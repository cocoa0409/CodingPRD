scenario: "Nutraceutical & Supplement Contract Manufacturing (NSF-certified contract manufacturer): formula & overage calculation, raw-material identity testing & COA review, batch record & yield reconciliation, allergen/gluten changeover & cleaning validation, label claim vs assay result hold, stability program & expiry assignment, minimum order & tiered pricing, recall/lot trace"

domain_name: nutraceutical-contract-manufacturing
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: brand_name, type: string, source: input, description: "Brand owner name; non-empty" }
      - { name: committed_order_value_cents, type: integer, source: computed, default: 0, description: "Sum of total_price_cents over own ManufacturingOrders with status IN {PLACED, SCHEDULED, IN_PRODUCTION}" }
      - { name: open_order_count, type: integer, source: computed, default: 0, description: "Count of own ManufacturingOrders with status IN {PLACED, SCHEDULED, IN_PRODUCTION}" }
      - { name: lifetime_receipts_cents, type: integer, source: computed, default: 0, description: "Sum of total_price_cents over own ManufacturingOrders with status == COMPLETED" }
      - { name: open_recall_count, type: integer, source: computed, default: 0, description: "Count of own ManufacturingOrders with recall_flag == true" }

  - name: Formula
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning brand" }
      - { name: name, type: string, source: input, description: "Formula name; non-empty" }
      - { name: dosage_form, type: enum, source: input, description: "TABLET | CAPSULE | POWDER | SOFTGEL | LIQUID" }
      - { name: allergen_class, type: enum, source: input, description: "NONE | GLUTEN | MILK | SOY | EGG | PEANUT | TREE_NUT | FISH | SHELLFISH | SESAME" }
      - { name: min_order_qty, type: integer, source: input, description: "Minimum order quantity in finished units; >= 1" }
      - { name: batch_size_units, type: integer, source: input, description: "Theoretical finished units per batch; >= 1" }
      - { name: shelf_life_months, type: integer, source: input, description: "Maximum labeled shelf life in months; >= 1" }
      - { name: overage_basis, type: enum, source: input, description: "THEORETICAL | LABEL_CLAIM; selects planned-overage variant at approval" }
      - { name: price_tiers, type: array, source: input, description: "Array of {min_qty: integer, unit_price_cents: integer}; first tier min_qty MUST equal min_order_qty; min_qty strictly increasing; unit_price_cents strictly decreasing" }
      - { name: revised_from_formula_id, type: string, source: system, default: null, description: "FK -> Formula.id; set on revisions created by POST /formulas/{id}/revise" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | SUPERSEDED" }

  - name: FormulaLine
    parent: Formula
    common_fields: true
    fields:
      - { name: formula_id, type: string, source: system, description: "FK -> Formula.id" }
      - { name: raw_material_id, type: string, source: input, description: "FK -> RawMaterial.id" }
      - { name: theoretical_qty_mg_per_unit, type: number, source: input, description: "Theoretical milligrams of this material per finished unit; > 0" }
      - { name: overage_pct, type: number, source: input, description: "Overage percentage; 0 <= overage_pct <= 25" }
      - { name: is_label_claim_line, type: boolean, source: input, description: "True when this line carries the product's label claim; exactly one line per formula" }
      - { name: label_claim_mg_per_unit, type: number, source: input, default: null, description: "Label claim mg per unit; required iff is_label_claim_line == true" }
      - { name: planned_weigh_qty_mg, type: number, source: computed, default: null, description: "Computed at formula approval per calculation planned_overage_qty" }

  - name: RawMaterial
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Material name; non-empty" }
      - { name: allergen_class, type: enum, source: input, description: "NONE | GLUTEN | MILK | SOY | EGG | PEANUT | TREE_NUT | FISH | SHELLFISH | SESAME" }

  - name: MaterialLot
    parent: null
    common_fields: true
    fields:
      - { name: raw_material_id, type: string, source: input, description: "FK -> RawMaterial.id" }
      - { name: supplier_name, type: string, source: input, description: "Supplier name; non-empty" }
      - { name: supplier_coa_ref, type: string, source: input, description: "Supplier certificate-of-analysis reference; non-empty" }
      - { name: qty_received, type: number, source: input, description: "Received quantity in mg; > 0" }
      - { name: qty_remaining, type: number, source: computed, description: "qty_received minus sum of qty_consumed over ACTIVE BatchConsumption rows for this lot" }
      - { name: status, type: enum, source: system, description: "QUARANTINE | IDENTITY_PASSED | IDENTITY_FAILED | RELEASED | REJECTED | RECALLED" }

  - name: IdentityTest
    parent: MaterialLot
    common_fields: true
    fields:
      - { name: material_lot_id, type: string, source: system, description: "FK -> MaterialLot.id" }
      - { name: result, type: enum, source: input, description: "PASS | FAIL; identity test outcome" }
      - { name: coa_match, type: boolean, source: input, description: "Whether supplier COA matches the material identity" }
      - { name: tested_by_id, type: string, source: system, description: "X-User-ID of the submitting QAChemist" }
      - { name: review_outcome, type: enum, source: input, default: null, description: "APPROVE | REJECT; set by COA review" }
      - { name: reviewed_by_id, type: string, source: system, default: null, description: "X-User-ID of the reviewing QAManager" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | COA_APPROVED | COA_REJECTED" }

  - name: ManufacturingOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; must equal BrandRep X-User-ID" }
      - { name: formula_id, type: string, source: input, description: "FK -> Formula.id; must be APPROVED at placement" }
      - { name: formula_version_at_order, type: integer, source: system, description: "Formula.version pinned at placement (version-pinning on order)" }
      - { name: ordered_qty, type: integer, source: input, description: "Ordered finished units; >= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Tier unit price per calculation tiered_unit_price" }
      - { name: total_price_cents, type: integer, source: computed, description: "ordered_qty * unit_price_cents (exact integer)" }
      - { name: recall_flag, type: boolean, source: computed, default: false, description: "True once a batch of this order enters RECALLED" }
      - { name: status, type: enum, source: system, description: "PLACED | SCHEDULED | IN_PRODUCTION | COMPLETED | CANCELLED" }

  - name: Batch
    parent: null
    common_fields: true
    fields:
      - { name: mo_id, type: string, source: system, description: "FK -> ManufacturingOrder.id; set at schedule" }
      - { name: production_line_id, type: string, source: system, description: "FK -> ProductionLine.id; set at schedule" }
      - { name: theoretical_units, type: integer, source: system, description: "Snapshot of Formula.batch_size_units at schedule" }
      - { name: planned_start, type: datetime, source: system, description: "Planned production window start (from schedule input)" }
      - { name: planned_end, type: datetime, source: system, description: "Planned production window end (from schedule input)" }
      - { name: actual_yield_units, type: integer, source: input, default: null, description: "Actual finished units produced; recorded at complete, amendable via PUT" }
      - { name: actual_bulk_mass_g, type: number, source: input, default: null, description: "Actual bulk mass in grams; recorded at complete, amendable via PUT" }
      - { name: yield_variance_pct, type: number, source: computed, default: null, description: "Per calculation yield_variance_pct (UNITS basis), 2 decimals round_half_up" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when batch completed" }
      - { name: recorded_by_id, type: string, source: system, default: null, description: "X-User-ID of ProductionOperator who completed the batch" }
      - { name: reviewed_by_id, type: string, source: system, default: null, description: "X-User-ID of QAManager who performed record review" }
      - { name: expiry_date, type: string, source: computed, default: null, description: "ISO date assigned by stability study completion; last calendar day of computed month" }
      - { name: production_status, type: enum, source: system, description: "CREATED | IN_PROCESS | COMPLETED | RECORD_REVIEWED | CANCELLED" }
      - { name: quality_status, type: enum, source: system, description: "PENDING_QC | ASSAY_HOLD | QC_READY | RELEASED | REJECTED | RECALLED" }

  - name: BatchConsumption
    parent: Batch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> Batch.id" }
      - { name: material_lot_id, type: string, source: input, description: "FK -> MaterialLot.id" }
      - { name: qty_consumed, type: number, source: input, description: "Consumed quantity in mg; > 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED" }
      - { name: voided_by_id, type: string, source: system, default: null, description: "X-User-ID of ProductionOperator who voided the row" }

  - name: ProductionLine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Line name; non-empty" }
      - { name: cleaning_status, type: enum, source: system, default: CLEAN_VALIDATED, description: "CLEAN_VALIDATED | DIRTY | CLEAN_PENDING_VALIDATION" }
      - { name: current_allergen_class, type: enum, source: system, default: NONE, description: "NONE | GLUTEN | MILK | SOY | EGG | PEANUT | TREE_NUT | FISH | SHELLFISH | SESAME; allergen of last completed batch" }

  - name: CleaningValidation
    parent: ProductionLine
    common_fields: true
    fields:
      - { name: production_line_id, type: string, source: system, description: "FK -> ProductionLine.id" }
      - { name: notes, type: string, source: input, default: null, description: "Optional cleaning notes" }
      - { name: recorded_by_id, type: string, source: system, description: "X-User-ID of ProductionOperator who recorded cleaning" }
      - { name: swab_result, type: enum, source: input, default: null, description: "PASS | FAIL; swab outcome" }
      - { name: swabbed_by_id, type: string, source: system, default: null, description: "X-User-ID of QAChemist who recorded the swab" }
      - { name: approved_by_id, type: string, source: system, default: null, description: "X-User-ID of QAManager who approved the validation" }
      - { name: status, type: enum, source: system, description: "RECORDED | SWAB_PASSED | VALIDATED | FAILED" }

  - name: AssayResult
    parent: Batch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> Batch.id" }
      - { name: assayed_mg_per_unit, type: number, source: input, description: "Assayed marker content per finished unit; > 0" }
      - { name: label_claim_mg_per_unit, type: number, source: system, description: "Snapshot of the formula's unique label-claim line value at submission" }
      - { name: pct_of_claim, type: number, source: computed, description: "Per calculation pct_of_claim; 1 decimal round_half_up" }
      - { name: submitted_by_id, type: string, source: system, description: "X-User-ID of submitting QAChemist" }
      - { name: review_outcome, type: enum, source: input, default: null, description: "ACCEPT | REJECT" }
      - { name: reviewed_by_id, type: string, source: system, default: null, description: "X-User-ID of reviewing QAManager" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED" }

  - name: StabilityStudy
    parent: Batch
    common_fields: true
    fields:
      - { name: batch_id, type: string, source: system, description: "FK -> Batch.id" }
      - { name: chamber_id, type: string, source: input, description: "FK -> StabilityChamber.id" }
      - { name: protocol, type: enum, source: input, description: "REAL_TIME | ACCELERATED" }
      - { name: pull_results, type: array, source: input, default: null, description: "Array of {pull_month: integer >= 1, passed: boolean}; months strictly ascending; recorded at completion" }
      - { name: supported_months, type: integer, source: computed, default: null, description: "Per calculation supported_shelf_months" }
      - { name: assigned_expiry_date, type: string, source: computed, default: null, description: "ISO date per calculation assigned_expiry; mirrored onto Batch.expiry_date" }
      - { name: status, type: enum, source: system, description: "ENROLLED | COMPLETED" }

  - name: StabilityChamber
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Chamber name; non-empty" }
      - { name: capacity_units, type: integer, source: input, description: "Maximum finished units held across ENROLLED studies; >= 1" }
      - { name: occupied_units, type: integer, source: computed, default: 0, description: "Sum of Batch.theoretical_units over ENROLLED StabilityStudies in this chamber" }

  - name: RecallEvent
    parent: null
    common_fields: true
    fields:
      - { name: scope_type, type: enum, source: input, description: "MATERIAL_LOT | BATCH" }
      - { name: scope_id, type: string, source: input, description: "Polymorphic reference: MaterialLot.id when scope_type == MATERIAL_LOT, Batch.id when scope_type == BATCH" }
      - { name: reason, type: string, source: input, description: "Recall reason; non-empty" }
      - { name: affected_batch_count, type: integer, source: computed, default: 0, description: "Number of batches transitioned to RECALLED by this event" }
      - { name: status, type: enum, source: system, description: "INITIATED | TRACED | CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Formula
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /api/formulas/{id}/approve"
        actor: QAManager
        preconditions:
          - "Formula.status == DRAFT (ERR_FORMULA_STATE)"
          - ">= 1 FormulaLine exists (ERR_FORMULA_INCOMPLETE)"
          - "Exactly 1 FormulaLine with is_label_claim_line == true (ERR_FORMULA_INCOMPLETE)"
          - ">= 1 price tier and tier set valid per ERR_INVALID_TIER_SET rules (ERR_FORMULA_INCOMPLETE if empty, ERR_INVALID_TIER_SET if malformed)"
        side_effects:
          - "Compute planned_weigh_qty_mg on every FormulaLine per calculation planned_overage_qty"
          - "If revised_from_formula_id references a Formula with status == APPROVED, that Formula transitions APPROVED -> SUPERSEDED"
      - from: DRAFT
        to: DRAFT
        trigger: "PUT /api/formulas/{id} (in-place edit, OCC-guarded)"
        actor: ProductionPlanner
        preconditions:
          - "Formula.status == DRAFT (ERR_FORMULA_STATE)"
          - "expected_formula_version == current version (ERR_STALE_VERSION)"
        side_effects:
          - "Increments Formula.version by 1"
          - "If lines replaced, prior FormulaLine rows are discarded and re-created from payload"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when a revision of this formula is approved)"
        actor: system
        preconditions:
          - "A Formula F2 with revised_from_formula_id == this.id completes DRAFT -> APPROVED"
        side_effects: []

  - entity: MaterialLot
    initial_state: QUARANTINE
    terminal_states: [REJECTED, RECALLED]
    transitions:
      - from: QUARANTINE
        to: IDENTITY_PASSED
        trigger: "POST /api/material-lots/{lotId}/identity-tests with result == PASS"
        actor: QAChemist
        preconditions:
          - "MaterialLot.status IN {QUARANTINE, IDENTITY_FAILED} (ERR_LOT_STATE)"
        side_effects:
          - "IdentityTest created with status SUBMITTED, tested_by_id from X-User-ID"
      - from: QUARANTINE
        to: IDENTITY_FAILED
        trigger: "POST /api/material-lots/{lotId}/identity-tests with result == FAIL"
        actor: QAChemist
        preconditions:
          - "MaterialLot.status IN {QUARANTINE, IDENTITY_FAILED} (ERR_LOT_STATE)"
        side_effects:
          - "IdentityTest created with status SUBMITTED"
      - from: IDENTITY_FAILED
        to: IDENTITY_PASSED
        trigger: "POST /api/material-lots/{lotId}/identity-tests with result == PASS (retest)"
        actor: QAChemist
        preconditions:
          - "MaterialLot.status IN {QUARANTINE, IDENTITY_FAILED} (ERR_LOT_STATE)"
        side_effects:
          - "IdentityTest created with status SUBMITTED"
        note: "Retest cycle: IDENTITY_FAILED -> IDENTITY_PASSED via a passing retest"
      - from: IDENTITY_PASSED
        to: RELEASED
        trigger: "POST /api/identity-tests/{id}/coa-review with review_outcome == APPROVE"
        actor: QAManager
        preconditions:
          - "IdentityTest.status == SUBMITTED (ERR_IDENTITY_TEST_STATE)"
          - "IdentityTest.result == PASS (ERR_INVALID_REQUEST)"
          - "X-User-ID != IdentityTest.tested_by_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "IdentityTest.status -> COA_APPROVED; reviewed_by_id set"
      - from: IDENTITY_PASSED
        to: REJECTED
        trigger: "POST /api/identity-tests/{id}/coa-review with review_outcome == REJECT"
        actor: QAManager
        preconditions:
          - "IdentityTest.status == SUBMITTED (ERR_IDENTITY_TEST_STATE)"
          - "X-User-ID != IdentityTest.tested_by_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "IdentityTest.status -> COA_REJECTED; reviewed_by_id set"
      - from: IDENTITY_FAILED
        to: REJECTED
        trigger: "POST /api/identity-tests/{id}/coa-review with review_outcome == REJECT"
        actor: QAManager
        preconditions:
          - "IdentityTest.status == SUBMITTED (ERR_IDENTITY_TEST_STATE)"
          - "X-User-ID != IdentityTest.tested_by_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "IdentityTest.status -> COA_REJECTED; reviewed_by_id set"
      - from: RELEASED
        to: RECALLED
        trigger: "POST /api/recalls with scope_type == MATERIAL_LOT"
        actor: QAManager
        preconditions:
          - "MaterialLot.status == RELEASED (ERR_LOT_STATE)"
        side_effects:
          - "Recall trace cascade per RecallEvent TRACED transition"

  - entity: IdentityTest
    initial_state: SUBMITTED
    terminal_states: [COA_APPROVED, COA_REJECTED]
    transitions:
      - from: SUBMITTED
        to: COA_APPROVED
        trigger: "POST /api/identity-tests/{id}/coa-review with review_outcome == APPROVE"
        actor: QAManager
        preconditions:
          - "IdentityTest.status == SUBMITTED (ERR_IDENTITY_TEST_STATE)"
          - "IdentityTest.result == PASS (ERR_INVALID_REQUEST)"
          - "X-User-ID != tested_by_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "MaterialLot IDENTITY_PASSED -> RELEASED"
      - from: SUBMITTED
        to: COA_REJECTED
        trigger: "POST /api/identity-tests/{id}/coa-review with review_outcome == REJECT"
        actor: QAManager
        preconditions:
          - "IdentityTest.status == SUBMITTED (ERR_IDENTITY_TEST_STATE)"
          - "X-User-ID != tested_by_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "MaterialLot -> REJECTED"

  - entity: ManufacturingOrder
    initial_state: PLACED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLACED
        to: SCHEDULED
        trigger: "POST /api/manufacturing-orders/{id}/schedule"
        actor: ProductionPlanner
        preconditions:
          - "ManufacturingOrder.status == PLACED (ERR_ORDER_STATE)"
          - "planned_start < planned_end (ERR_INVALID_REQUEST)"
          - "No overlapping batch window on the line per validation line_schedule_overlap (ERR_LINE_SCHEDULE_CONFLICT)"
        side_effects:
          - "Batch created: production_status CREATED, quality_status PENDING_QC, theoretical_units = Formula.batch_size_units snapshot"
      - from: SCHEDULED
        to: IN_PRODUCTION
        trigger: "system (automatic when the scheduled Batch is started)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PRODUCTION
        to: COMPLETED
        trigger: "system (automatic when the Batch quality_status -> RELEASED)"
        actor: system
        preconditions: []
        side_effects:
          - "Customer.open_order_count -= 1"
          - "Customer.committed_order_value_cents -= total_price_cents"
          - "Customer.lifetime_receipts_cents += total_price_cents"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "system (automatic when the Batch quality_status -> REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Customer.open_order_count -= 1"
          - "Customer.committed_order_value_cents -= total_price_cents"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /api/manufacturing-orders/{id}/cancel"
        actor: BrandRep
        preconditions:
          - "ManufacturingOrder.status IN {PLACED, SCHEDULED} (ERR_ORDER_STATE)"
          - "X-User-ID == customer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Customer.open_order_count -= 1"
          - "Customer.committed_order_value_cents -= total_price_cents"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/manufacturing-orders/{id}/cancel"
        actor: BrandRep
        preconditions:
          - "ManufacturingOrder.status IN {PLACED, SCHEDULED} (ERR_ORDER_STATE)"
          - "X-User-ID == customer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "Customer.open_order_count -= 1"
          - "Customer.committed_order_value_cents -= total_price_cents"
          - "Scheduled Batch production_status -> CANCELLED (frees the line window)"

  - entity: Batch
    initial_state: "production_status=CREATED, quality_status=PENDING_QC"
    terminal_states: ["production_status=CANCELLED", "quality_status=RELEASED", "quality_status=REJECTED", "quality_status=RECALLED"]
    transitions:
      - from: "production_status=CREATED"
        to: "production_status=IN_PROCESS"
        trigger: "POST /api/batches/{id}/start"
        actor: ProductionOperator
        preconditions:
          - "production_status == CREATED (ERR_BATCH_STATE)"
          - "Line gating per validation line_cleaning_gate: ERR_LINE_NOT_CLEAN_VALIDATED or ERR_ALLERGEN_CHANGEOVER_REQUIRED"
        side_effects:
          - "ManufacturingOrder SCHEDULED -> IN_PRODUCTION"
      - from: "production_status=IN_PROCESS"
        to: "production_status=COMPLETED"
        trigger: "POST /api/batches/{id}/complete"
        actor: ProductionOperator
        preconditions:
          - "production_status == IN_PROCESS (ERR_BATCH_STATE)"
          - "Every FormulaLine of the ordered formula has >= 1 ACTIVE BatchConsumption (ERR_INCOMPLETE_CONSUMPTION)"
        side_effects:
          - "yield_variance_pct computed per calculation yield_variance_pct"
          - "completed_at = logical clock now; recorded_by_id = X-User-ID"
          - "ProductionLine.cleaning_status -> DIRTY; ProductionLine.current_allergen_class = formula allergen_class"
      - from: "production_status=COMPLETED"
        to: "production_status=COMPLETED"
        trigger: "PUT /api/batches/{id} (yield amendment, OCC-guarded)"
        actor: ProductionOperator
        preconditions:
          - "production_status == COMPLETED (ERR_BATCH_STATE)"
          - "expected_batch_version == current version (ERR_STALE_VERSION)"
        side_effects:
          - "yield_variance_pct recomputed; increments Batch.version by 1"
      - from: "production_status=COMPLETED"
        to: "production_status=RECORD_REVIEWED"
        trigger: "POST /api/batches/{id}/record-review"
        actor: QAManager
        preconditions:
          - "production_status == COMPLETED (ERR_BATCH_STATE)"
          - "X-User-ID != recorded_by_id (ERR_SOD_VIOLATION)"
          - "abs(yield_variance_pct) <= 10.0 inclusive (ERR_YIELD_VARIANCE_EXCEEDED)"
        side_effects:
          - "reviewed_by_id = X-User-ID"
      - from: "production_status=CREATED"
        to: "production_status=CANCELLED"
        trigger: "system (automatic when parent ManufacturingOrder is cancelled from SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "quality_status=PENDING_QC"
        to: "quality_status=ASSAY_HOLD"
        trigger: "system (automatic when an AssayResult is submitted with pct_of_claim outside [90.0, 110.0])"
        actor: system
        preconditions: []
        side_effects: []
      - from: "quality_status IN {PENDING_QC, ASSAY_HOLD}"
        to: "quality_status=QC_READY"
        trigger: "system (automatic when an AssayResult is reviewed ACCEPT with pct_of_claim inside [90.0, 110.0])"
        actor: system
        preconditions: []
        side_effects: []
      - from: "quality_status IN {PENDING_QC, ASSAY_HOLD, QC_READY}"
        to: "quality_status=RELEASED"
        trigger: "POST /api/batches/{id}/release"
        actor: QAManager
        preconditions:
          - "quality_status IN {PENDING_QC, ASSAY_HOLD, QC_READY} (ERR_BATCH_STATE)"
          - "production_status == RECORD_REVIEWED (ERR_BATCH_STATE)"
          - "Assay gate: an ACCEPTED AssayResult with pct_of_claim IN [90.0, 110.0] exists (ERR_ASSAY_LABEL_CLAIM_FAIL)"
          - "Component-lot gate: every ACTIVE BatchConsumption's MaterialLot.status == RELEASED (ERR_COMPONENT_LOT_UNRESOLVED)"
          - "Stability gate: a COMPLETED StabilityStudy exists and expiry_date is set (ERR_STABILITY_NOT_COMPLETED)"
        side_effects:
          - "ManufacturingOrder IN_PRODUCTION -> COMPLETED"
          - "Customer aggregates updated per ManufacturingOrder COMPLETED transition"
      - from: "quality_status IN {PENDING_QC, ASSAY_HOLD, QC_READY}"
        to: "quality_status=REJECTED"
        trigger: "POST /api/batches/{id}/reject"
        actor: QAManager
        preconditions:
          - "quality_status IN {PENDING_QC, ASSAY_HOLD, QC_READY} (ERR_BATCH_STATE)"
        side_effects:
          - "ManufacturingOrder IN_PRODUCTION -> CANCELLED; Customer aggregates updated per that transition"
      - from: "quality_status=RELEASED"
        to: "quality_status=RECALLED"
        trigger: "system (automatic when a RecallEvent traces to this batch)"
        actor: system
        preconditions: []
        side_effects:
          - "ManufacturingOrder.recall_flag = true"
          - "Customer.open_recall_count = count of that customer's ManufacturingOrders with recall_flag == true"

  - entity: BatchConsumption
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /api/batches/{id}/consumptions/{consumptionId}/void"
        actor: ProductionOperator
        preconditions:
          - "Batch.production_status == IN_PROCESS (ERR_BATCH_STATE)"
          - "BatchConsumption.status == ACTIVE (ERR_INVALID_REQUEST)"
        side_effects:
          - "MaterialLot.qty_remaining += qty_consumed (recomputed per calculation lot_qty_reconciliation)"
          - "voided_by_id = X-User-ID"

  - entity: ProductionLine
    initial_state: "cleaning_status=CLEAN_VALIDATED"
    terminal_states: []
    transitions:
      - from: "cleaning_status=CLEAN_VALIDATED"
        to: "cleaning_status=DIRTY"
        trigger: "system (automatic when a Batch completes on this line)"
        actor: system
        preconditions: []
        side_effects:
          - "current_allergen_class = completing batch's formula allergen_class"
      - from: "cleaning_status=DIRTY"
        to: "cleaning_status=CLEAN_PENDING_VALIDATION"
        trigger: "POST /api/production-lines/{id}/cleaning-validations"
        actor: ProductionOperator
        preconditions:
          - "cleaning_status == DIRTY (ERR_CLEANING_STATE)"
        side_effects:
          - "CleaningValidation created with status RECORDED"
      - from: "cleaning_status=CLEAN_PENDING_VALIDATION"
        to: "cleaning_status=DIRTY"
        trigger: "system (automatic when the CleaningValidation swab is FAIL)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "cleaning_status=CLEAN_PENDING_VALIDATION"
        to: "cleaning_status=CLEAN_VALIDATED"
        trigger: "system (automatic when the CleaningValidation is approved)"
        actor: system
        preconditions: []
        side_effects:
          - "current_allergen_class = NONE"
        note: "Cycle: CLEAN_VALIDATED -> DIRTY -> CLEAN_PENDING_VALIDATION -> CLEAN_VALIDATED repeats per campaign"

  - entity: CleaningValidation
    initial_state: RECORDED
    terminal_states: [VALIDATED, FAILED]
    transitions:
      - from: RECORDED
        to: SWAB_PASSED
        trigger: "POST /api/cleaning-validations/{id}/swab with result == PASS"
        actor: QAChemist
        preconditions:
          - "CleaningValidation.status == RECORDED (ERR_CLEANING_STATE)"
        side_effects:
          - "swabbed_by_id = X-User-ID"
      - from: RECORDED
        to: FAILED
        trigger: "POST /api/cleaning-validations/{id}/swab with result == FAIL"
        actor: QAChemist
        preconditions:
          - "CleaningValidation.status == RECORDED (ERR_CLEANING_STATE)"
        side_effects:
          - "ProductionLine.cleaning_status -> DIRTY"
      - from: SWAB_PASSED
        to: VALIDATED
        trigger: "POST /api/cleaning-validations/{id}/approve"
        actor: QAManager
        preconditions:
          - "CleaningValidation.status == SWAB_PASSED (ERR_CLEANING_STATE)"
          - "X-User-ID != recorded_by_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "approved_by_id = X-User-ID"
          - "ProductionLine.cleaning_status -> CLEAN_VALIDATED; current_allergen_class -> NONE"

  - entity: AssayResult
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /api/assay-results/{id}/review with review_outcome == ACCEPT"
        actor: QAManager
        preconditions:
          - "AssayResult.status == SUBMITTED (ERR_ASSAY_STATE)"
          - "X-User-ID != submitted_by_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "If pct_of_claim IN [90.0, 110.0]: Batch.quality_status -> QC_READY"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/assay-results/{id}/review with review_outcome == REJECT"
        actor: QAManager
        preconditions:
          - "AssayResult.status == SUBMITTED (ERR_ASSAY_STATE)"
          - "X-User-ID != submitted_by_id (ERR_SOD_VIOLATION)"
        side_effects: []

  - entity: StabilityStudy
    initial_state: ENROLLED
    terminal_states: [COMPLETED]
    transitions:
      - from: ENROLLED
        to: COMPLETED
        trigger: "POST /api/stability-studies/{id}/complete"
        actor: QAManager
        preconditions:
          - "StabilityStudy.status == ENROLLED (ERR_STUDY_STATE)"
          - "pull_results non-empty, pull_month values strictly ascending integers >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "supported_months and assigned_expiry_date computed per calculation assigned_expiry"
          - "Batch.expiry_date = assigned_expiry_date"
          - "StabilityChamber.occupied_units -= Batch.theoretical_units"

  - entity: RecallEvent
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: TRACED
        trigger: "system (automatic within POST /api/recalls)"
        actor: system
        preconditions: []
        side_effects:
          - "scope MATERIAL_LOT: lot RELEASED -> RECALLED; every Batch with an ACTIVE BatchConsumption of the lot AND quality_status == RELEASED transitions to RECALLED (ordered by Batch.created_at ASC); each such transition sets its ManufacturingOrder.recall_flag = true and refreshes Customer.open_recall_count; affected_batch_count = number of batches transitioned"
          - "scope BATCH: if Batch.quality_status == RELEASED it transitions to RECALLED with the same per-batch side effects; affected_batch_count = 1; otherwise ERR_BATCH_STATE at creation"
      - from: TRACED
        to: CLOSED
        trigger: "POST /api/recalls/{id}/close"
        actor: QAManager
        preconditions:
          - "RecallEvent.status == TRACED (ERR_RECALL_STATE)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: formula-update-stale-version
    parent_entity: Formula
    write_endpoint: "PUT /api/formulas/{id}"
    occ_field: expected_formula_version
    description: |
      Updating a DRAFT Formula (which replaces its line and tier sets) against a
      stale expected_formula_version is rejected. This captures the case where
      another writer has just updated the same draft (legitimately superseding
      the caller's view of its contents) and the caller's base version is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: batch-yield-amend-stale-version
    parent_entity: Batch
    write_endpoint: "PUT /api/batches/{id}"
    occ_field: expected_batch_version
    description: |
      Amending a COMPLETED Batch's yield figures against a stale
      expected_batch_version is rejected. This captures the case where another
      writer has just amended the same batch record (legitimately superseding
      the caller's view of the record) and the caller's base version is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: planned_overage_qty
    trigger: "Formula approval (POST /api/formulas/{id}/approve)"
    algorithm: multiplication
    formula: |
      Per FormulaLine, rounding order is PINNED: round per-unit first, then
      multiply, then round the product.
        base_mg = (formula.overage_basis == THEORETICAL)
                  ? line.theoretical_qty_mg_per_unit
                  : line.label_claim_mg_per_unit
        per_unit_planned_mg = round_half_up(base_mg * (1 + line.overage_pct / 100), 2)
        line.planned_weigh_qty_mg = round_half_up(per_unit_planned_mg * formula.batch_size_units, 2)
    input_set: "All FormulaLines of the Formula being approved"
    constants:
      OVERAGE_PCT_MIN: 0
      OVERAGE_PCT_MAX: 25
    precision: "2 decimal places, round_half_up; per-unit rounding precedes multiplication"
    variants:
      - name: theoretical_basis
        when: "formula.overage_basis == THEORETICAL"
        difference: "Overage base is theoretical_qty_mg_per_unit (which may already embed formulation excess)"
      - name: label_claim_basis
        when: "formula.overage_basis == LABEL_CLAIM"
        difference: "Overage base is label_claim_mg_per_unit; yields a smaller planned quantity whenever theoretical exceeds label claim"
  - name: yield_variance_pct
    trigger: "Batch completion (POST /api/batches/{id}/complete) and yield amendment (PUT /api/batches/{id})"
    algorithm: aggregation
    formula: |
      PINNED basis is UNITS:
        yield_variance_pct = round_half_up(
          (batch.actual_yield_units - batch.theoretical_units) / batch.theoretical_units * 100, 2)
      Record review tolerance: abs(yield_variance_pct) <= 10.0 inclusive passes.
    input_set: "The Batch being completed or amended; theoretical_units snapshot taken at schedule"
    constants:
      YIELD_TOLERANCE_PCT: 10.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: units_basis
        when: "always (PINNED system rule)"
        difference: "Denominator is theoretical_units (finished-unit count)"
      - name: mass_basis
        when: "documented alternative reading of 'yield reconciliation' — NOT used by the system"
        difference: "Denominator is theoretical bulk mass (theoretical_units * per-unit mass); diverges from units basis whenever measured bulk mass deviates from units times nominal unit mass"
  - name: tiered_unit_price
    trigger: "Manufacturing order placement (POST /api/manufacturing-orders)"
    algorithm: tiered_pricing
    formula: |
      MOQ gate first: ordered_qty >= formula.min_order_qty else ERR_BELOW_MINIMUM_ORDER.
      Tier selection (selector determinism PINNED): among the formula's price_tiers,
      select the tier with the greatest min_qty such that min_qty <= ordered_qty
      (lower bounds INCLUSIVE; min_qty values are unique by tier-set validation).
      Flat-rate (NOT marginal): the selected tier's unit_price_cents applies to
      every unit.
        mo.unit_price_cents = selected_tier.unit_price_cents
        mo.total_price_cents = ordered_qty * unit_price_cents   # exact integer cents
      At least one tier always satisfies min_qty <= ordered_qty because tier-set
      validation requires the first tier's min_qty == min_order_qty and the MOQ
      gate already passed.
    input_set: "The ordered Formula's price_tiers (version pinned at order time)"
    constants: {}
    precision: "integer cents, no rounding"
    variants:
      - name: flat_tier_rate
        when: "always (PINNED system rule)"
        difference: "Whole ordered_qty priced at the single selected tier rate"
      - name: marginal_tier_rate
        when: "documented alternative reading of 'tiered pricing' — NOT used by the system"
        difference: "Units within each tier band priced at that band's rate; produces a lower total than flat pricing when ordered_qty straddles a breakpoint"
  - name: pct_of_claim
    trigger: "Assay result submission (POST /api/batches/{id}/assay-results)"
    algorithm: threshold
    formula: |
      label_claim = the batch's formula's unique label-claim FormulaLine
                    .label_claim_mg_per_unit (snapshotted onto the AssayResult)
      pct_of_claim = round_half_up(assayed_mg_per_unit / label_claim * 100, 1)
      Hold thresholds INCLUSIVE: pct_of_claim IN [90.0, 110.0] is in-range;
      otherwise the submission drives Batch.quality_status -> ASSAY_HOLD.
    input_set: "The AssayResult being created and the formula's unique label-claim line"
    constants:
      CLAIM_MIN_PCT: 90.0
      CLAIM_MAX_PCT: 110.0
    precision: "1 decimal place, round_half_up"
    variants: []
  - name: supported_shelf_months
    trigger: "Stability study completion (POST /api/stability-studies/{id}/complete)"
    algorithm: threshold
    formula: |
      pull_results are strictly ascending by pull_month (validated).
      supported_months = the largest pull_month m such that EVERY pull with
      pull_month <= m has passed == true; 0 if the earliest pull failed.
      Evaluation order PINNED: scan pulls ascending; stop at the first failed
      pull; supported_months = greatest pull_month strictly before that failure
      (0 if the first pull failed, last pull_month if none failed).
    input_set: "The completing StabilityStudy's pull_results"
    constants: {}
    precision: "integer months"
    variants: []
  - name: assigned_expiry
    trigger: "Stability study completion (POST /api/stability-studies/{id}/complete)"
    algorithm: constraint_propagation
    formula: |
      effective_months = min(formula.shelf_life_months, study.supported_months)
      base_month = the calendar month containing Batch.completed_at
      expiry month = base_month + effective_months
      assigned_expiry_date = LAST CALENDAR DAY of the expiry month (end-of-month
      rounding PINNED: e.g. completed 2026-08-14 + 3 months -> 2026-11-30;
      completed 2026-11-20 + 3 months -> 2027-02-28 in non-leap 2027).
      Batch.expiry_date is set to assigned_expiry_date.
    input_set: "The completing StabilityStudy, its Batch, and the batch's Formula"
    constants: {}
    precision: "whole calendar day"
    variants: []
  - name: lot_qty_reconciliation
    trigger: "BatchConsumption creation and void"
    algorithm: aggregation
    formula: |
      lot.qty_remaining = lot.qty_received - sum(qty_consumed over
        BatchConsumption rows for this lot with status == ACTIVE)
      Recomputed on every consumption create/void; invariant:
      qty_remaining + sum(ACTIVE consumptions) == qty_received.
    input_set: "BatchConsumption rows with status == ACTIVE for the lot"
    constants: {}
    precision: "2 decimal places, round_half_up"
    variants: []
  - name: customer_commitment
    trigger: "ManufacturingOrder placement, cancellation, completion, rejection"
    algorithm: aggregation
    formula: |
      customer.committed_order_value_cents = sum(total_price_cents over the
        customer's ManufacturingOrders with status IN {PLACED, SCHEDULED, IN_PRODUCTION})
      customer.open_order_count = count of the same set
      customer.lifetime_receipts_cents = sum(total_price_cents over status == COMPLETED)
      customer.open_recall_count = count of ManufacturingOrders with recall_flag == true
      Invariant: committed_order_value_cents + lifetime_receipts_cents ==
      sum(total_price_cents over all non-CANCELLED orders).
    input_set: "The customer's ManufacturingOrders, filtered by status as shown"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is listed on the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Ownership: BrandRep's X-User-ID equals the target ManufacturingOrder's customer_id (or payload customer_id on placement)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /api/manufacturing-orders, POST /api/manufacturing-orders/{id}/cancel"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version equals current entity version (before any business logic)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PUT /api/formulas/{id}, PUT /api/batches/{id}"
  - priority: 6
    category: state
    check: "Target resource state precondition of the endpoint's transition (per-entity ERR_*_STATE codes)"
    error_id: "ERR_FORMULA_STATE | ERR_LOT_STATE | ERR_ORDER_STATE | ERR_BATCH_STATE | ERR_IDENTITY_TEST_STATE | ERR_CLEANING_STATE | ERR_ASSAY_STATE | ERR_STUDY_STATE | ERR_RECALL_STATE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Cross-entity state gates on referenced entities: formula APPROVED at MO placement (ERR_FORMULA_STATE); lot RELEASED at consumption (ERR_LOT_NOT_RELEASED); line cleaning gate at batch start (ERR_LINE_NOT_CLEAN_VALIDATED, ERR_ALLERGEN_CHANGEOVER_REQUIRED)"
    error_id: "ERR_FORMULA_STATE | ERR_LOT_NOT_RELEASED | ERR_LINE_NOT_CLEAN_VALIDATED | ERR_ALLERGEN_CHANGEOVER_REQUIRED"
    http_status: 409
    applies_to: "POST /api/manufacturing-orders, POST /api/batches/{id}/consumptions, POST /api/batches/{id}/start"
  - priority: 8
    category: business_safety
    check: "Segregation of duties: reviewing user's X-User-ID differs from the recording user's id stored on the record"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /api/identity-tests/{id}/coa-review, POST /api/batches/{id}/record-review, POST /api/cleaning-validations/{id}/approve, POST /api/assay-results/{id}/review"
  - priority: 9
    category: business_safety
    check: "Release quality gates in pinned order: (a) assay gate ERR_ASSAY_LABEL_CLAIM_FAIL, (b) component-lot gate ERR_COMPONENT_LOT_UNRESOLVED; record-review yield gate ERR_YIELD_VARIANCE_EXCEEDED"
    error_id: "ERR_ASSAY_LABEL_CLAIM_FAIL | ERR_COMPONENT_LOT_UNRESOLVED | ERR_YIELD_VARIANCE_EXCEEDED"
    http_status: 409
    applies_to: "POST /api/batches/{id}/release, POST /api/batches/{id}/record-review"
  - priority: 10
    category: business_temporal
    check: "Line schedule overlap: new [planned_start, planned_end) must not intersect any non-CANCELLED batch window on the line (half-open: adjacency allowed)"
    error_id: ERR_LINE_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /api/manufacturing-orders/{id}/schedule"
  - priority: 11
    category: business_referential
    check: "Stability gate at release (ERR_STABILITY_NOT_COMPLETED); consumption material must appear among the formula's lines (ERR_FORMULA_MATERIAL_MISMATCH)"
    error_id: "ERR_STABILITY_NOT_COMPLETED | ERR_FORMULA_MATERIAL_MISMATCH"
    http_status: 409
    applies_to: "POST /api/batches/{id}/release, POST /api/batches/{id}/consumptions"
  - priority: 12
    category: business_constraint
    check: "Completeness/consistency constraints: formula approvable — >=1 line, exactly 1 label-claim line, >=1 price tier (ERR_FORMULA_INCOMPLETE); non-empty tier set shape at create/update (ERR_INVALID_TIER_SET, http 400); overage_pct within [0,25] (ERR_INVALID_REQUEST); chamber aggregate capacity occupied + batch theoretical_units <= capacity_units (ERR_CHAMBER_CAPACITY_EXCEEDED); batch consumption coverage at complete (ERR_INCOMPLETE_CONSUMPTION)"
    error_id: "ERR_FORMULA_INCOMPLETE | ERR_INVALID_TIER_SET | ERR_INVALID_REQUEST | ERR_CHAMBER_CAPACITY_EXCEEDED | ERR_INCOMPLETE_CONSUMPTION"
    http_status: 409
    applies_to: "formula create/update/approve, POST /api/batches/{id}/stability-studies, POST /api/batches/{id}/complete"
  - priority: 13
    category: business_fiscal
    check: "Fiscal checks last: ordered_qty >= min_order_qty (ERR_BELOW_MINIMUM_ORDER, 422); qty_consumed <= lot.qty_remaining (ERR_INSUFFICIENT_LOT_QUANTITY, 422)"
    error_id: "ERR_BELOW_MINIMUM_ORDER | ERR_INSUFFICIENT_LOT_QUANTITY"
    http_status: 422
    applies_to: "POST /api/manufacturing-orders, POST /api/batches/{id}/consumptions"
  - priority: 14
    category: existence
    check: "Request-body shape: required fields present, types and enum values valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customers ---
  - method: POST
    path: "/api/customers"
    description: "Create a brand customer"
    roles: [ProductionPlanner]
    code: 201
    input: [brand_name]
    output: Customer
    side_effects: ["computed aggregates initialized to 0"]
  - method: GET
    path: "/api/customers/{id}"
    description: "Get a customer"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/api/customers/{id}/formulas"
    description: "List formulas owned by a customer"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Formula[]"
    side_effects: []

  # --- Raw materials ---
  - method: POST
    path: "/api/raw-materials"
    description: "Register a raw material"
    roles: [ProductionPlanner]
    code: 201
    input: [name, allergen_class]
    output: RawMaterial
    side_effects: []
  - method: GET
    path: "/api/raw-materials/{id}"
    description: "Get a raw material"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: []
    output: RawMaterial
    side_effects: []
  - method: GET
    path: "/api/raw-materials/{id}/material-lots"
    description: "List lots of a raw material"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "MaterialLot[]"
    side_effects: []
  - method: GET
    path: "/api/raw-materials/{id}/formula-lines"
    description: "List formula lines referencing a raw material"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "FormulaLine[]"
    side_effects: []

  # --- Material lots & identity testing ---
  - method: POST
    path: "/api/material-lots"
    description: "Receive a supplier material lot (enters QUARANTINE)"
    roles: [ProductionOperator]
    code: 201
    input: [raw_material_id, supplier_name, supplier_coa_ref, qty_received]
    output: MaterialLot
    side_effects: ["status = QUARANTINE", "qty_remaining = qty_received"]
  - method: GET
    path: "/api/material-lots/{id}"
    description: "Get a material lot"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: []
    output: MaterialLot
    side_effects: []
  - method: POST
    path: "/api/material-lots/{id}/identity-tests"
    description: "Submit an identity test result for a lot (retest allowed from IDENTITY_FAILED)"
    roles: [QAChemist]
    code: 201
    input: [result, coa_match]
    output: IdentityTest
    side_effects:
      - "MaterialLot QUARANTINE/IDENTITY_FAILED -> IDENTITY_PASSED (result PASS) or IDENTITY_FAILED (result FAIL)"
  - method: GET
    path: "/api/material-lots/{id}/identity-tests"
    description: "List identity tests of a lot"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "IdentityTest[]"
    side_effects: []
  - method: GET
    path: "/api/material-lots/{id}/consumptions"
    description: "List consumption rows referencing a lot (lot trace)"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "BatchConsumption[]"
    side_effects: []
  - method: POST
    path: "/api/identity-tests/{id}/coa-review"
    description: "QA manager reviews identity test against supplier COA"
    roles: [QAManager]
    code: 200
    input: [review_outcome]
    output: IdentityTest
    side_effects:
      - "APPROVE: IdentityTest -> COA_APPROVED, MaterialLot IDENTITY_PASSED -> RELEASED"
      - "REJECT: IdentityTest -> COA_REJECTED, MaterialLot -> REJECTED"

  # --- Formulas ---
  - method: POST
    path: "/api/customers/{customerId}/formulas"
    description: "Create a DRAFT formula with lines and price tiers"
    roles: [ProductionPlanner]
    code: 201
    input: [name, dosage_form, allergen_class, min_order_qty, batch_size_units, shelf_life_months, overage_basis, "lines", "price_tiers"]
    output: Formula
    side_effects: ["status = DRAFT", "FormulaLine rows created from lines payload"]
  - method: GET
    path: "/api/formulas/{id}"
    description: "Get a formula"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: []
    output: Formula
    side_effects: []
  - method: PUT
    path: "/api/formulas/{id}"
    description: "Update a DRAFT formula (replaces lines and price_tiers when provided); OCC-guarded"
    roles: [ProductionPlanner]
    code: 200
    input: [expected_formula_version, "name?", "dosage_form?", "allergen_class?", "min_order_qty?", "batch_size_units?", "shelf_life_months?", "overage_basis?", "lines?", "price_tiers?"]
    output: Formula
    side_effects: ["increments Formula.version by 1", "tier set re-validated when price_tiers provided"]
  - method: GET
    path: "/api/formulas/{id}/lines"
    description: "List formula lines"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "FormulaLine[]"
    side_effects: []
  - method: GET
    path: "/api/formulas/{id}/revisions"
    description: "List formulas whose revised_from_formula_id is this formula"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "Formula[]"
    side_effects: []
  - method: POST
    path: "/api/formulas/{id}/approve"
    description: "Approve a DRAFT formula; computes planned overage quantities; supersedes prior APPROVED revision"
    roles: [QAManager]
    code: 200
    input: []
    output: Formula
    side_effects:
      - "status DRAFT -> APPROVED"
      - "planned_weigh_qty_mg computed on every line per planned_overage_qty"
      - "prior APPROVED revision -> SUPERSEDED"
  - method: POST
    path: "/api/formulas/{id}/revise"
    description: "Create a new DRAFT formula copied from an APPROVED formula"
    roles: [ProductionPlanner]
    code: 201
    input: []
    output: Formula
    side_effects: ["new Formula status = DRAFT", "revised_from_formula_id = source id", "lines and price_tiers copied"]

  # --- Manufacturing orders ---
  - method: POST
    path: "/api/manufacturing-orders"
    description: "Brand places a manufacturing order; MOQ gate and tiered pricing applied"
    roles: [BrandRep]
    code: 201
    input: [customer_id, formula_id, ordered_qty]
    output: ManufacturingOrder
    side_effects:
      - "status = PLACED"
      - "unit_price_cents and total_price_cents computed per tiered_unit_price"
      - "formula_version_at_order pinned to Formula.version"
      - "Customer.committed_order_value_cents += total_price_cents; open_order_count += 1"
  - method: GET
    path: "/api/manufacturing-orders"
    description: "List manufacturing orders with filters"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: ["customer_id?", "formula_id?", "status?", "limit?", "offset?"]
    output: "ManufacturingOrder[]"
    side_effects: []
  - method: GET
    path: "/api/manufacturing-orders/{id}"
    description: "Get a manufacturing order"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: []
    output: ManufacturingOrder
    side_effects: []
  - method: POST
    path: "/api/manufacturing-orders/{id}/cancel"
    description: "Brand cancels a PLACED or SCHEDULED order"
    roles: [BrandRep]
    code: 200
    input: []
    output: ManufacturingOrder
    side_effects:
      - "status -> CANCELLED; customer aggregates recomputed"
      - "if SCHEDULED: batch production_status -> CANCELLED"
  - method: POST
    path: "/api/manufacturing-orders/{id}/schedule"
    description: "Schedule an order onto a production line; creates the Batch"
    roles: [ProductionPlanner]
    code: 201
    input: [production_line_id, planned_start, planned_end]
    output: Batch
    side_effects:
      - "ManufacturingOrder PLACED -> SCHEDULED"
      - "Batch created: CREATED / PENDING_QC, theoretical_units snapshot"
      - "line overlap validated (half-open intervals)"

  # --- Batches ---
  - method: GET
    path: "/api/batches"
    description: "List batches with filters (pagination supported)"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: ["mo_id?", "production_line_id?", "quality_status?", "limit?", "offset?"]
    output: "Batch[]"
    side_effects: []
  - method: GET
    path: "/api/batches/{id}"
    description: "Get a batch"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: []
    output: Batch
    side_effects: []
  - method: POST
    path: "/api/batches/{id}/start"
    description: "Start production on a batch; line cleaning/allergen gate enforced"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: Batch
    side_effects: ["production_status CREATED -> IN_PROCESS", "ManufacturingOrder SCHEDULED -> IN_PRODUCTION"]
  - method: POST
    path: "/api/batches/{id}/consumptions"
    description: "Record consumption of a released material lot"
    roles: [ProductionOperator]
    code: 201
    input: [material_lot_id, qty_consumed]
    output: BatchConsumption
    side_effects: ["BatchConsumption created ACTIVE", "MaterialLot.qty_remaining -= qty_consumed"]
  - method: GET
    path: "/api/batches/{id}/consumptions"
    description: "List consumption rows of a batch"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "BatchConsumption[]"
    side_effects: []
  - method: POST
    path: "/api/batches/{id}/consumptions/{consumptionId}/void"
    description: "Void an ACTIVE consumption row (compensating action; restores lot quantity)"
    roles: [ProductionOperator]
    code: 200
    input: []
    output: BatchConsumption
    side_effects: ["BatchConsumption -> VOIDED", "MaterialLot.qty_remaining += qty_consumed"]
  - method: POST
    path: "/api/batches/{id}/complete"
    description: "Complete production; records yield, flips line to DIRTY"
    roles: [ProductionOperator]
    code: 200
    input: [actual_yield_units, actual_bulk_mass_g]
    output: Batch
    side_effects:
      - "production_status IN_PROCESS -> COMPLETED"
      - "yield_variance_pct computed; completed_at stamped from logical clock; recorded_by_id set"
      - "ProductionLine.cleaning_status -> DIRTY; current_allergen_class = formula allergen_class"
  - method: PUT
    path: "/api/batches/{id}"
    description: "Amend yield figures on a COMPLETED batch; OCC-guarded"
    roles: [ProductionOperator]
    code: 200
    input: [actual_yield_units, actual_bulk_mass_g, expected_batch_version]
    output: Batch
    side_effects: ["yield_variance_pct recomputed", "increments Batch.version by 1"]
  - method: POST
    path: "/api/batches/{id}/record-review"
    description: "QA manager reviews the batch record (SoD vs recorder; yield tolerance gate)"
    roles: [QAManager]
    code: 200
    input: []
    output: Batch
    side_effects: ["production_status COMPLETED -> RECORD_REVIEWED", "reviewed_by_id set"]
  - method: POST
    path: "/api/batches/{id}/release"
    description: "QA releases a QC_READY batch (assay, component-lot, stability gates in pinned order)"
    roles: [QAManager]
    code: 200
    input: []
    output: Batch
    side_effects:
      - "quality_status QC_READY -> RELEASED"
      - "ManufacturingOrder IN_PRODUCTION -> COMPLETED"
      - "Customer aggregates updated (open_order_count, committed_order_value_cents, lifetime_receipts_cents)"
  - method: POST
    path: "/api/batches/{id}/reject"
    description: "QA rejects a pre-release batch"
    roles: [QAManager]
    code: 200
    input: []
    output: Batch
    side_effects: ["quality_status -> REJECTED", "ManufacturingOrder IN_PRODUCTION -> CANCELLED; customer aggregates recomputed"]

  # --- Assay results ---
  - method: POST
    path: "/api/batches/{id}/assay-results"
    description: "Submit a potency assay vs label claim (batch must be production-complete; quality PENDING_QC or ASSAY_HOLD)"
    roles: [QAChemist]
    code: 201
    input: [assayed_mg_per_unit]
    output: AssayResult
    side_effects:
      - "pct_of_claim computed; label_claim snapshotted"
      - "if pct_of_claim outside [90.0, 110.0]: Batch.quality_status -> ASSAY_HOLD"
  - method: GET
    path: "/api/batches/{id}/assay-results"
    description: "List assay results of a batch"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "AssayResult[]"
    side_effects: []
  - method: POST
    path: "/api/assay-results/{id}/review"
    description: "QA manager reviews an assay (SoD vs submitter)"
    roles: [QAManager]
    code: 200
    input: [review_outcome]
    output: AssayResult
    side_effects:
      - "AssayResult SUBMITTED -> ACCEPTED | REJECTED"
      - "on ACCEPT with pct_of_claim in range: Batch.quality_status -> QC_READY"

  # --- Stability ---
  - method: POST
    path: "/api/batches/{id}/stability-studies"
    description: "Enroll a production-completed batch into a stability chamber (aggregate capacity checked)"
    roles: [QAChemist]
    code: 201
    input: [chamber_id, protocol]
    output: StabilityStudy
    side_effects:
      - "status = ENROLLED; at most one ENROLLED study per batch (ERR_STUDY_STATE)"
      - "StabilityChamber.occupied_units += Batch.theoretical_units (occupied must stay <= capacity_units)"
  - method: GET
    path: "/api/batches/{id}/stability-studies"
    description: "List stability studies of a batch"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "StabilityStudy[]"
    side_effects: []
  - method: POST
    path: "/api/stability-studies/{id}/complete"
    description: "Complete a study with pull results; computes supported months and assigns batch expiry"
    roles: [QAManager]
    code: 200
    input: [pull_results]
    output: StabilityStudy
    side_effects:
      - "status ENROLLED -> COMPLETED"
      - "supported_months, assigned_expiry_date computed; Batch.expiry_date set"
      - "StabilityChamber.occupied_units -= Batch.theoretical_units"

  # --- Production lines & cleaning ---
  - method: POST
    path: "/api/production-lines"
    description: "Register a production line"
    roles: [ProductionPlanner]
    code: 201
    input: [name]
    output: ProductionLine
    side_effects: ["cleaning_status = CLEAN_VALIDATED", "current_allergen_class = NONE"]
  - method: GET
    path: "/api/production-lines/{id}"
    description: "Get a production line"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: []
    output: ProductionLine
    side_effects: []
  - method: GET
    path: "/api/production-lines/{id}/cleaning-validations"
    description: "List cleaning validations of a line"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "CleaningValidation[]"
    side_effects: []
  - method: POST
    path: "/api/production-lines/{id}/cleaning-validations"
    description: "Record a cleaning event on a DIRTY line"
    roles: [ProductionOperator]
    code: 201
    input: ["notes?"]
    output: CleaningValidation
    side_effects: ["CleaningValidation status = RECORDED", "ProductionLine.cleaning_status -> CLEAN_PENDING_VALIDATION"]
  - method: POST
    path: "/api/cleaning-validations/{id}/swab"
    description: "Record swab result on a RECORDED cleaning validation"
    roles: [QAChemist]
    code: 200
    input: [result]
    output: CleaningValidation
    side_effects:
      - "PASS: status -> SWAB_PASSED"
      - "FAIL: status -> FAILED; ProductionLine.cleaning_status -> DIRTY"
  - method: POST
    path: "/api/cleaning-validations/{id}/approve"
    description: "QA manager approves a SWAB_PASSED cleaning validation (SoD vs recorder)"
    roles: [QAManager]
    code: 200
    input: []
    output: CleaningValidation
    side_effects: ["status -> VALIDATED", "ProductionLine.cleaning_status -> CLEAN_VALIDATED; current_allergen_class -> NONE"]

  # --- Stability chambers ---
  - method: POST
    path: "/api/stability-chambers"
    description: "Register a stability chamber"
    roles: [ProductionPlanner]
    code: 201
    input: [name, capacity_units]
    output: StabilityChamber
    side_effects: ["occupied_units = 0"]
  - method: GET
    path: "/api/stability-chambers/{id}"
    description: "Get a stability chamber"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: []
    output: StabilityChamber
    side_effects: []
  - method: GET
    path: "/api/stability-chambers/{id}/stability-studies"
    description: "List studies enrolled in a chamber"
    roles: [BrandRep, ProductionPlanner, ProductionOperator, QAChemist, QAManager]
    code: 200
    input: ["limit?", "offset?"]
    output: "StabilityStudy[]"
    side_effects: []

  # --- Recalls ---
  - method: POST
    path: "/api/recalls"
    description: "Initiate a recall on a material lot or a released batch; trace cascade executes synchronously"
    roles: [QAManager]
    code: 201
    input: [scope_type, scope_id, reason]
    output: RecallEvent
    side_effects:
      - "status INITIATED -> TRACED"
      - "MATERIAL_LOT scope: lot RELEASED -> RECALLED; consuming RELEASED batches -> RECALLED (created_at ASC); each sets MO.recall_flag and refreshes customer open_recall_count"
      - "BATCH scope: released batch -> RECALLED with same per-batch side effects"
  - method: POST
    path: "/api/recalls/{id}/close"
    description: "Close a traced recall"
    roles: [QAManager]
    code: 200
    input: []
    output: RecallEvent
    side_effects: ["status TRACED -> CLOSED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601 UTC). Startup default before any set call is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time. All server-stamped timestamps (created_at, completed_at) read this clock."
    roles: [ProductionPlanner, QAManager]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role undeclared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "BrandRep X-User-ID does not match the customer_id of the order being placed or cancelled" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not identify an existing resource (checked left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid field, invalid enum, malformed arrays, APPROVE review of a FAIL identity test, void of a non-ACTIVE consumption, planned window with start >= end" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the entity's current version" }
  - { id: ERR_FORMULA_STATE, http: 409, condition: "Formula not in the required state: edit/approve requires DRAFT; order placement and revise require APPROVED" }
  - { id: ERR_LOT_STATE, http: 409, condition: "MaterialLot not in the required state: identity test requires QUARANTINE or IDENTITY_FAILED; lot-scope recall requires RELEASED" }
  - { id: ERR_ORDER_STATE, http: 409, condition: "ManufacturingOrder not in the required state: schedule requires PLACED; cancel requires PLACED or SCHEDULED" }
  - { id: ERR_BATCH_STATE, http: 409, condition: "Batch not in the required state for the attempted transition (start/complete/amend/record-review/release/reject/assay-submit/study-enroll/batch-scope recall)" }
  - { id: ERR_IDENTITY_TEST_STATE, http: 409, condition: "IdentityTest not SUBMITTED when COA review attempted" }
  - { id: ERR_CLEANING_STATE, http: 409, condition: "CleaningValidation or ProductionLine not in the required state: record requires DIRTY line; swab requires RECORDED; approve requires SWAB_PASSED" }
  - { id: ERR_ASSAY_STATE, http: 409, condition: "AssayResult not SUBMITTED when review attempted" }
  - { id: ERR_STUDY_STATE, http: 409, condition: "StabilityStudy not ENROLLED when completed, or batch already has an ENROLLED study" }
  - { id: ERR_RECALL_STATE, http: 409, condition: "RecallEvent not TRACED when close attempted" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: reviewing X-User-ID equals the recording user's id (COA review, record review, cleaning approval, assay review)" }
  - { id: ERR_LINE_NOT_CLEAN_VALIDATED, http: 409, condition: "Batch start rejected: line cleaning_status == CLEAN_PENDING_VALIDATION, or DIRTY with a like-for-like allergen match not applicable" }
  - { id: ERR_ALLERGEN_CHANGEOVER_REQUIRED, http: 409, condition: "Batch start rejected: line DIRTY and current_allergen_class differs from the formula's allergen_class" }
  - { id: ERR_LOT_NOT_RELEASED, http: 409, condition: "Consumption rejected: MaterialLot.status != RELEASED" }
  - { id: ERR_LINE_SCHEDULE_CONFLICT, http: 409, condition: "Schedule rejected: [planned_start, planned_end) intersects a non-CANCELLED batch window on the same line (half-open; adjacency allowed)" }
  - { id: ERR_CHAMBER_CAPACITY_EXCEEDED, http: 409, condition: "Stability enrollment rejected: chamber occupied_units + batch theoretical_units > capacity_units (equality allowed)" }
  - { id: ERR_COMPONENT_LOT_UNRESOLVED, http: 409, condition: "Release rejected: an ACTIVE consumption's MaterialLot.status != RELEASED (e.g., recalled after consumption)" }
  - { id: ERR_ASSAY_LABEL_CLAIM_FAIL, http: 409, condition: "Release rejected: no ACCEPTED assay with pct_of_claim in [90.0, 110.0]" }
  - { id: ERR_STABILITY_NOT_COMPLETED, http: 409, condition: "Release rejected: no COMPLETED stability study / expiry_date unset" }
  - { id: ERR_YIELD_VARIANCE_EXCEEDED, http: 409, condition: "Record review rejected: abs(yield_variance_pct) > 10.0" }
  - { id: ERR_INCOMPLETE_CONSUMPTION, http: 409, condition: "Completion rejected: a formula line has no ACTIVE consumption" }
  - { id: ERR_FORMULA_INCOMPLETE, http: 409, condition: "Approval rejected: no lines, label-claim line count != 1, or no price tiers" }
  - { id: ERR_INVALID_TIER_SET, http: 400, condition: "Non-empty tier set invalid at create/update: first min_qty != min_order_qty, min_qty not strictly increasing, or unit_price_cents not strictly decreasing (an EMPTY tier set is allowed on a DRAFT and is caught at approval by ERR_FORMULA_INCOMPLETE)" }
  - { id: ERR_FORMULA_MATERIAL_MISMATCH, http: 400, condition: "Consumption rejected: the lot's raw material does not appear among the ordered formula's lines" }
  - { id: ERR_BELOW_MINIMUM_ORDER, http: 422, condition: "ordered_qty < formula.min_order_qty (equality allowed)" }
  - { id: ERR_INSUFFICIENT_LOT_QUANTITY, http: 422, condition: "qty_consumed > MaterialLot.qty_remaining (equality allowed)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BrandRep
    description: "Customer brand representative; places and cancels own manufacturing orders, reads own data"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/manufacturing-orders"
      - "POST /api/manufacturing-orders/{id}/cancel"
    shared_operations:
      - "All GET endpoints"
  - name: ProductionPlanner
    description: "Plans production: customers, raw materials, formulas, price tiers, scheduling, lines, chambers"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/customers"
      - "POST /api/raw-materials"
      - "POST /api/customers/{customerId}/formulas"
      - "PUT /api/formulas/{id}"
      - "POST /api/formulas/{id}/revise"
      - "POST /api/manufacturing-orders/{id}/schedule"
      - "POST /api/production-lines"
      - "POST /api/stability-chambers"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/_clock/set_current_utc"
  - name: ProductionOperator
    description: "Floor operator: receives lots, runs batches, records consumption/yield, records cleaning"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/material-lots"
      - "POST /api/batches/{id}/start"
      - "POST /api/batches/{id}/consumptions"
      - "POST /api/batches/{id}/consumptions/{consumptionId}/void"
      - "POST /api/batches/{id}/complete"
      - "PUT /api/batches/{id}"
      - "POST /api/production-lines/{id}/cleaning-validations"
    shared_operations:
      - "All GET endpoints"
  - name: QAChemist
    description: "Quality chemist: identity tests, swabs, assay submission, stability enrollment"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/material-lots/{id}/identity-tests"
      - "POST /api/cleaning-validations/{id}/swab"
      - "POST /api/batches/{id}/assay-results"
      - "POST /api/batches/{id}/stability-studies"
    shared_operations:
      - "All GET endpoints"
  - name: QAManager
    description: "QA manager: COA review, formula approval, record review, assay review, cleaning approval, batch release/reject, recalls, study completion"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/identity-tests/{id}/coa-review"
      - "POST /api/formulas/{id}/approve"
      - "POST /api/batches/{id}/record-review"
      - "POST /api/batches/{id}/release"
      - "POST /api/batches/{id}/reject"
      - "POST /api/assay-results/{id}/review"
      - "POST /api/cleaning-validations/{id}/approve"
      - "POST /api/stability-studies/{id}/complete"
      - "POST /api/recalls"
      - "POST /api/recalls/{id}/close"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/_clock/set_current_utc"
