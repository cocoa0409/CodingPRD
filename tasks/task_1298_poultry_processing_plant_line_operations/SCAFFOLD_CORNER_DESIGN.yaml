  - section: complexity_layers
    instances:
      - name: occ_stale_shift_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[shift-staffing-stale-version]", "errors[ERR_STALE_SHIFT_VERSION]"]
        distinguishing_aspect: "OCC on ProductionShift.version: staffing with the observed version succeeds (version 1 -> 2); replaying the SAME captured version is rejected 412 ERR_STALE_SHIFT_VERSION — deterministic two-sequential-requests probe."
        test_recipe:
          setup: ["shift created (version 1 captured)"]
          setup_api_calls:
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id, s_v: $.data.version } }
          trigger:
            - { call: "POST /poultry/shifts/${s1}/staffing", payload: { shacklers_present: 10, eviscerators_present: 20, deboners_present: 12, qa_techs_present: 2, expected_shift_version: "${s_v}" }, as: ShiftSupervisor, captures: { s_v2: $.data.version } }
            - { call: "POST /poultry/shifts/${s1}/staffing", payload: { shacklers_present: 8, eviscerators_present: 20, deboners_present: 12, qa_techs_present: 2, expected_shift_version: "${s_v}" }, as: ShiftSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "first update succeeded and bumped version: ${s_v2} == 2 (was ${s_v} == 1)"
            - "stale replay rejected: ${err} == ERR_STALE_SHIFT_VERSION (412); shacklers_present remains 10"

      - name: occ_stale_order_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[order-amend-stale-version]", "errors[ERR_STALE_ORDER_VERSION]"]
        distinguishing_aspect: "OCC on ProductOrder.version: two sequential amendments carrying the same captured version — first succeeds (version 1 -> 2), second is rejected 412 ERR_STALE_ORDER_VERSION."
        test_recipe:
          setup: ["order created (version 1 captured); still PENDING (amendable)"]
          setup_api_calls:
            - { call: "POST /poultry/orders", payload: { customer_name: "CustX", product_code: "WINGS", pounds_ordered: 500.0, temperature_requirement: "FROZEN", due_at: "2026-08-03T00:00:00Z" }, as: OrderPlanner, captures: { o1: $.data.id, o_v: $.data.version } }
          trigger:
            - { call: "PUT /poultry/orders/${o1}", payload: { pounds_ordered: 600.0, expected_order_version: "${o_v}" }, as: OrderPlanner, captures: { o_v2: $.data.version, lbs: $.data.pounds_ordered } }
            - { call: "PUT /poultry/orders/${o1}", payload: { pounds_ordered: 700.0, expected_order_version: "${o_v}" }, as: OrderPlanner, captures: { err: $.data.error_id } }
          assert:
            - "first amendment succeeded: ${o_v2} == 2 and ${lbs} == 600.0"
            - "stale amendment rejected: ${err} == ERR_STALE_ORDER_VERSION (412); pounds_ordered remains 600.0"

      - name: occ_stale_line_version_on_waiver_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[waiver-create-supersede-stale-line]", "errors[ERR_STALE_LINE_VERSION]"]
        distinguishing_aspect: "OCC on ProcessingLine.version at waiver CREATE-with-supersede: first create bumps the line version; a second create carrying the original captured version is rejected 412 ERR_STALE_LINE_VERSION."
        test_recipe:
          setup: ["line EV-1 created (version 1 captured)"]
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id, l_v: $.data.version } }
          trigger:
            - { call: "POST /poultry/lines/${l1}/waivers", payload: { max_speed_bpm: 195, effective_from: "2026-08-01T06:00:00Z", effective_to: "2026-08-01T14:00:00Z", expected_line_version: "${l_v}" }, as: PlantManager, captures: { w1: $.data.id } }
            - { call: "GET /poultry/lines/${l1}", as: PlantManager, captures: { l_v2: $.data.version } }
            - { call: "POST /poultry/lines/${l1}/waivers", payload: { max_speed_bpm: 190, effective_from: "2026-08-02T06:00:00Z", effective_to: "2026-08-02T14:00:00Z", expected_line_version: "${l_v}" }, as: PlantManager, captures: { err: $.data.error_id } }
          assert:
            - "first waiver created: LineSpeedWaiver.${w1} exists; line version advanced (${l_v2} == 2)"
            - "second create with stale version rejected: ${err} == ERR_STALE_LINE_VERSION (412)"

      - name: pagination_limit_offset_interaction
        claim_type: pagination_with_filtering
        grounds: ["response_envelope", "endpoints[GET /poultry/line-runs]"]
        distinguishing_aspect: "Pagination + filter: three runs created for one shift; limit=2 returns exactly 2 rows with has_more true and total_count 3; offset=2 returns the final row with has_more false; flock_lot_id filter narrows to 1."
        test_recipe:
          setup: ["EV-1; shift; lots FL-A/FL-B/FL-C; three runs (two on FL-A, one on FL-B), all QUEUED"]
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 30000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id } }
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-A", grower_name: "GrowerA", booked_head_count: 9000, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s1}" }, as: ReceivingClerk, captures: { fa: $.data.id } }
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-B", grower_name: "GrowerB", booked_head_count: 9000, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s1}" }, as: ReceivingClerk, captures: { fb: $.data.id } }
            - { call: "POST /poultry/line-runs", payload: { shift_id: "${s1}", line_id: "${l1}", flock_lot_id: "${fa}", planned_speed_bpm: 170 }, as: ShiftSupervisor, captures: { ra: $.data.id } }
            - { call: "POST /poultry/line-runs", payload: { shift_id: "${s1}", line_id: "${l1}", flock_lot_id: "${fa}", planned_speed_bpm: 170 }, as: ShiftSupervisor, captures: { rb: $.data.id } }
            - { call: "POST /poultry/line-runs", payload: { shift_id: "${s1}", line_id: "${l1}", flock_lot_id: "${fb}", planned_speed_bpm: 170 }, as: ShiftSupervisor, captures: { rc: $.data.id } }
          trigger:
            - { call: "GET /poultry/line-runs", as: LineOperator, payload: { shift_id: "${s1}", limit: 2, offset: 0 } }
            - { call: "GET /poultry/line-runs", as: LineOperator, payload: { shift_id: "${s1}", limit: 2, offset: 2 } }
            - { call: "GET /poultry/line-runs", as: LineOperator, payload: { flock_lot_id: "${fb}" } }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2 (offset 2): 1 row, total_count == 3, has_more == false"
            - "filter flock_lot_id == ${fb}: exactly 1 row (run ${rc})"

      - name: dual_variant_and_cascade_layers_covered
        claim_type: dual_variant_calculation
        grounds: ["calculations.flock_yield_pct", "calculations.shift_water_intensity"]
