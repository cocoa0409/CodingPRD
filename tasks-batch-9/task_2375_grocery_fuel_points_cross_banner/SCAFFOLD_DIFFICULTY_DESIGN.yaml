  # =========================================================================
  # Rule 8 — resource_temporal_overlap (different resource kinds, different
  #          interval semantics: half-open promos vs closed settlement periods)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: promo_half_open_windows_permit_adjacency_and_reject_true_overlap
        grounds:
          - validations[priority=56]
          - errors[ERR_PROMO_WINDOW_CONFLICT]
          - entities.PromoEvent.fields.stack_priority
          - entities.PromoEvent.fields.applies_to_categories
        distinguishing_aspect: |
          The conflict key is the triple (window overlap, intersecting category
          set, equal stack_priority) over half-open windows, so back-to-back
          events touching at 2026-08-10T00:00:00Z are accepted while a one-day
          true overlap is refused, and the same refused window is accepted twice
          more once either the priority or the category set differs. The resource
          being contested is a PromoEvent window with half-open semantics.
        test_recipe:
          setup:
            - "Banner B_OV on defaults; clock at 2026-08-01T00:00:00Z."
            - "ACTIVE promo P1: 2x [GROCERY], window [2026-08-01T00:00:00Z, 2026-08-10T00:00:00Z), stack_priority 10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /banners"
              payload: { banner_code: "OV", name: "Overlap Banner" }
              as: ProgramAdmin
              captures: { bov_id: $.data.id }
            - call: "POST /promo-events"
              payload: { banner_id: "${bov_id}", promo_code: "P1", multiplier: 2, applies_to_categories: ["GROCERY"], starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-10T00:00:00Z", stack_priority: 10 }
              as: ProgramAdmin
              captures: { pov1_id: $.data.id }
            - call: "POST /promo-events/${pov1_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /promo-events"
              payload: { banner_id: "${bov_id}", promo_code: "P2", multiplier: 3, applies_to_categories: ["GROCERY"], starts_at: "2026-08-10T00:00:00Z", ends_at: "2026-08-20T00:00:00Z", stack_priority: 10 }
              as: ProgramAdmin
              captures: { pov2_id: $.data.id }
            - call: "POST /promo-events"
              payload: { banner_id: "${bov_id}", promo_code: "P3", multiplier: 4, applies_to_categories: ["GROCERY"], starts_at: "2026-08-09T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", stack_priority: 10 }
              as: ProgramAdmin
              captures: { err_id5: $.data.error_id }
            - call: "POST /promo-events"
              payload: { banner_id: "${bov_id}", promo_code: "P4", multiplier: 4, applies_to_categories: ["GROCERY"], starts_at: "2026-08-09T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", stack_priority: 7 }
              as: ProgramAdmin
              captures: { pov4_id: $.data.id }
            - call: "POST /promo-events"
              payload: { banner_id: "${bov_id}", promo_code: "P5", multiplier: 4, applies_to_categories: ["PHARMACY"], starts_at: "2026-08-09T00:00:00Z", ends_at: "2026-08-15T00:00:00Z", stack_priority: 10 }
              as: ProgramAdmin
              captures: { pov5_id: $.data.id }
          assert:
            - "P2 returned HTTP 201 (touching at 2026-08-10T00:00:00Z is adjacency, not overlap) and PromoEvent.${pov2_id}.status == \"SCHEDULED\""
            - "P3 returned HTTP 409 and ${err_id5} == \"ERR_PROMO_WINDOW_CONFLICT\""
            - "P4 returned HTTP 201 and PromoEvent.${pov4_id}.stack_priority == 7"
            - "P5 returned HTTP 201 and PromoEvent.${pov5_id}.applies_to_categories == [\"PHARMACY\"]"
            - "GET /banners/${bov_id}/promo-events returns meta total_count == 4"

      - name: settlement_closed_periods_reject_touching_endpoints_then_hit_open_batch_limit
        grounds:
          - validations[priority=58]
          - validations[priority=60]
          - errors[ERR_BATCH_PERIOD_OVERLAP]
          - errors[ERR_OPEN_BATCH_LIMIT]
        distinguishing_aspect: |
          The contested resource is a settlement period with CLOSED semantics, the
          mirror image of the promo window: a period starting exactly at the prior
          period_end overlaps and is refused, while shifting the start one
          millisecond later is accepted. The accepted DRAFT then makes the site's
          open-batch count 2, so a period that overlaps nothing at all is still
          refused — an aggregate-count refusal on top of an interval refusal.
        test_recipe:
          setup:
            - "Banner B_PER on defaults; cycles 2026-08 (OPEN) and 2026-09 exist; clock at 2026-08-05T10:00:00Z."
            - "Grocery site G16; partner station P3 with partner_code, per_gallon_cap_cents 30 and max_gallons_per_redemption 20."
            - "Member M16 with 300 accrued points and one DISPENSED partner redemption of 12.345 gallons dispensed at 2026-08-05T10:00:00Z, settlement_status PENDING."
            - "SettlementBatch A over the CLOSED period [2026-08-01T00:00:00Z, 2026-08-15T00:00:00Z], already SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /banners"
              payload: { banner_code: "PER", name: "Period Banner" }
