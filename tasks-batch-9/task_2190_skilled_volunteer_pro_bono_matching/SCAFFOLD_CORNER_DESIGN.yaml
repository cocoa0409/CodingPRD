        distinguishing_aspect: "min_proficiency shares the 1..5 proficiency scale, so 6 is unsatisfiable by construction and must be refused with 422 ERR_VALIDATION at filing rather than surviving to produce a guaranteed ERR_NO_ELIGIBLE_VOLUNTEER at match time."
        test_recipe:
