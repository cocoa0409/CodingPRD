  - rule_id: resource_temporal_overlap
    instances:

      - name: panelist_cooldown_closed_interval_with_trailing_buffer
        resource_entity: Panelist
        interval_semantics: CLOSED at both ends, with a 14-day trailing exclusivity buffer added to the prior campaign's end
        grounds:
          - calculations.panelist_cooldown_overlap
          - calculations.eligibility_screening_decision
          - entities.Enrollment.fields.screening_failure_reason
          - state_machines.Enrollment.PENDING_SCREEN_to_SCREEN_FAILED
        distinguishing_aspect: |
          The contended resource is the PANELIST's own participation timeline, and the interval semantics are
          CLOSED with a trailing buffer: the prior campaign occupies
          [2026-06-01T00:00:00Z, 2026-06-30T00:00:00Z + 14 days] = [.., 2026-07-14T00:00:00Z] inclusive, so a
          candidate campaign starting at exactly 2026-07-14T00:00:00Z COLLIDES while one starting one second
          later at 2026-07-14T00:00:01Z does not. Both boundary cases are exercised against the same prior
          occupancy, so a half-open or buffer-less reading flips exactly one of the two outcomes.
        test_recipe:
          setup:
            - "Campaign C1 with sampling window 2026-06-01T00:00:00Z to 2026-06-30T00:00:00Z, in SCREENING_OPEN, with one SCREEN_PASSED enrollment for the panelist - this is the prior occupancy."
