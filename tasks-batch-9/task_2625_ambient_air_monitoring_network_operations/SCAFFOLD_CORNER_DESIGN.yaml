# =============================================================================
# 1.9 Scaffold Corner Design - ambient-air-monitoring-network-operations
#
# Breadth probe. Walks references/claim-extraction-guide.md section by section
# against SCAFFOLD.yaml's 1.1-1.7 surface. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs naming the
# covering difficulty instance.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_pollutant_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.Pollutant
          - endpoints[POST /pollutants]
        distinguishing_aspect: "A POST /pollutants carrying all seven declared inputs returns 201 with code PM25, primary_standard_value 9.0 and a system id, and - because Pollutant declares common_fields false - no version field at all."
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-01-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { p_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Pollutant.${p_id}.code == PM25 and Pollutant.${p_id}.standard_form == ANNUAL_MEAN"
            - "Pollutant.${p_id}.averaging_period_hours == 24 and Pollutant.${p_id}.primary_standard_value == 9.0"
            - "Pollutant.${p_id}.design_value_years == 3, completeness_threshold_pct == 75.0, rounding_decimals == 1"
            - "the response data carries id and created_at, and carries no version field because Pollutant declares common_fields false"
            - "the response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: get_pollutant_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /pollutants/{id}]
          - entities.Pollutant
        distinguishing_aspect: "GET /pollutants/{id} returns the same code, primary_standard_value and completeness_threshold_pct that POST /pollutants persisted, with no field drift."
        test_recipe:
          setup:
            - "one Pollutant PM25 with primary_standard_value 9.0 and completeness_threshold_pct 75.0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { p_id: "$.data.id" }
          trigger:
            - call: "GET /pollutants/${p_id}"
              payload: {}
              as: QaOfficer
          assert:
            - "HTTP 200"
            - "data.id == ${p_id} and data.code == PM25"
            - "data.primary_standard_value == 9.0 and data.completeness_threshold_pct == 75.0 and data.rounding_decimals == 1"

      - name: list_reference_methods_for_a_pollutant_paginates_and_filters
        claim_type: listing
        grounds:
          - endpoints[GET /pollutants/{id}/reference-methods]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With two ReferenceMethod rows under one Pollutant, limit 1 offset 0 returns exactly 1 item with total_count 2 and has_more true, and the designation_status filter narrows the same list to the single WITHDRAWN row."
        test_recipe:
          setup:
            - "one Pollutant PM25 with two reference methods, one of them WITHDRAWN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0 }
              as: NetworkAdmin
              captures: { p_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${p_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { m1_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${p_id}", method_code: "RFPS-0617-002", designation_type: "FEM", effective_from: "2021-01-01T00:00:00Z", max_span_drift_pct: 6.0, zero_drift_limit: 2.0, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { m2_id: "$.data.id" }
            - call: "POST /reference-methods/${m2_id}/designation"
              payload: { new_designation_status: "WITHDRAWN", determination_note: "Superseded by a later method" }
              as: EpaRegionalReviewer
          trigger:
            - call: "GET /pollutants/${p_id}/reference-methods"
              payload: { limit: 1, offset: 0 }
              as: ProgramManager
            - call: "GET /pollutants/${p_id}/reference-methods"
              payload: { designation_status: "WITHDRAWN", limit: 10, offset: 0 }
              as: ProgramManager
          assert:
            - "first call: HTTP 200, response_type == array, exactly 1 item returned, total_count == 2, has_more == true, limit == 1, offset == 0"
            - "second call: exactly 1 item returned, that item id == ${m2_id}, total_count == 1, has_more == false"
            - "second call: the returned row has designation_status == WITHDRAWN and withdrawn_on == 2026-01-05T00:00:00Z"

      - name: unknown_path_ids_return_entity_specific_not_found_errors
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_POLLUTANT_NOT_FOUND]
          - errors[ERR_REFERENCE_METHOD_NOT_FOUND]
          - errors[ERR_NETWORK_NOT_FOUND]
          - errors[ERR_SITE_NOT_FOUND]
          - errors[ERR_MONITOR_NOT_FOUND]
          - errors[ERR_DATA_BATCH_NOT_FOUND]
          - errors[ERR_INVALIDATION_NOT_FOUND]
          - errors[ERR_DEMONSTRATION_NOT_FOUND]
          - errors[ERR_DESIGN_VALUE_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
          - errors[ERR_CHANGE_REQUEST_NOT_FOUND]
          - errors[ERR_PACKAGE_NOT_FOUND]
        distinguishing_aspect: "Each of the twelve {id}-carrying resource families returns its own 404 error_id rather than one generic not-found code, proving validation priority 4 is entity-specific."
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-01-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "GET /pollutants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NetworkAdmin
            - call: "GET /reference-methods/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NetworkAdmin
            - call: "GET /monitoring-networks/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NetworkAdmin
            - call: "GET /monitoring-sites/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NetworkAdmin
            - call: "GET /monitors/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NetworkAdmin
            - call: "GET /data-batches/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NetworkAdmin
            - call: "POST /data-invalidations/00000000-0000-0000-0000-000000000000/withdraw"
              payload: { withdrawn_reason: "no such row" }
              as: QaOfficer
            - call: "GET /exceptional-event-demonstrations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NetworkAdmin
            - call: "GET /design-values/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NetworkAdmin
            - call: "GET /network-assessments/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NetworkAdmin
            - call: "GET /site-change-requests/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NetworkAdmin
            - call: "GET /certification-packages/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: NetworkAdmin
          assert:
            - "every call returns HTTP 404 with response_type == error"
            - "the twelve error_id values are, in call order: ERR_POLLUTANT_NOT_FOUND, ERR_REFERENCE_METHOD_NOT_FOUND, ERR_NETWORK_NOT_FOUND, ERR_SITE_NOT_FOUND, ERR_MONITOR_NOT_FOUND, ERR_DATA_BATCH_NOT_FOUND, ERR_INVALIDATION_NOT_FOUND, ERR_DEMONSTRATION_NOT_FOUND, ERR_DESIGN_VALUE_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_CHANGE_REQUEST_NOT_FOUND, ERR_PACKAGE_NOT_FOUND"
            - "each error body carries data.error_id and data.message and no data.id"

      - name: unknown_body_foreign_keys_return_entity_specific_not_found_errors
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - entities.Monitor.fields.site_id
          - entities.Monitor.fields.reference_method_id
          - entities.SiteChangeRequest.fields.assessment_id
          - errors[ERR_SITE_NOT_FOUND]
          - errors[ERR_REFERENCE_METHOD_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
        distinguishing_aspect: "Body foreign keys are resolved in the field order the endpoint's input list declares, so POST /monitors with both site_id and reference_method_id unknown returns ERR_SITE_NOT_FOUND - the first field - and never ERR_REFERENCE_METHOD_NOT_FOUND."
        test_recipe:
          setup:
            - "one operating site with one commissioned monitor under a designated FRM method"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { pm25_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_id: "$.data.id" }
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-001", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_a_id: "$.data.id" }
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${site_a_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "${frm_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2022-12-20T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: "$.data.id" }
            - call: "POST /monitors/${mon_id}/approve"
              payload: {}
              as: EpaRegionalReviewer
            - call: "POST /monitors/${mon_id}/commission"
              payload: {}
              as: FieldTechnician
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "SPAN_CHECK", performed_at: "2026-01-02T00:00:00Z", span_drift_pct: 2.0 }
              as: FieldTechnician
          trigger:
            - call: "POST /monitors"
              payload: { site_id: "00000000-0000-0000-0000-000000000000", reference_method_id: "00000000-0000-0000-0000-000000000000", poc: 2, is_primary_for_design_value: false, installed_at: "2025-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "00000000-0000-0000-0000-000000000000", poc: 2, is_primary_for_design_value: false, installed_at: "2025-01-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /monitoring-sites"
              payload: { network_id: "00000000-0000-0000-0000-000000000000", site_code: "S-777", site_type: "BACKGROUND", latitude: 39.9, longitude: -105.1, population_served: 0, probe_height_m: 4.0, distance_to_roadway_m: 150.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
            - call: "POST /data-batches"
              payload: { monitor_id: "00000000-0000-0000-0000-000000000000", year: 2025, quarter: 1, scheduled_hour_count: 2160, quarterly_mean_concentration: 9.0 }
              as: QaOfficer
            - call: "POST /site-change-requests"
              payload: { site_id: "${site_a_id}", request_type: "SHUTDOWN", justification: "Lease ended", assessment_id: "00000000-0000-0000-0000-000000000000" }
              as: ProgramManager
            - call: "POST /certification-packages"
              payload: { network_id: "${net_id}", pollutant_id: "00000000-0000-0000-0000-000000000000", year: 2025 }
              as: ProgramManager
          assert:
            - "call 1: HTTP 404 with error_id == ERR_SITE_NOT_FOUND - site_id precedes reference_method_id in the endpoint's input list"
            - "call 2: HTTP 404 with error_id == ERR_REFERENCE_METHOD_NOT_FOUND"
            - "call 3: HTTP 404 with error_id == ERR_NETWORK_NOT_FOUND"
            - "call 4: HTTP 404 with error_id == ERR_MONITOR_NOT_FOUND"
            - "call 5: HTTP 404 with error_id == ERR_ASSESSMENT_NOT_FOUND"
            - "call 6: HTTP 404 with error_id == ERR_POLLUTANT_NOT_FOUND"
            - "no Monitor, MonitoringSite, DataBatch, SiteChangeRequest or CertificationPackage row was created by any of the six calls"

      - name: omitting_a_required_pollutant_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.Pollutant.fields.primary_standard_value
        distinguishing_aspect: "primary_standard_value has source input and no default, so a POST /pollutants omitting it returns ERR_INVALID_REQUEST 422 and persists nothing, unlike the three defaulted inputs."
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-01-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
          trigger:
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN" }
              as: NetworkAdmin
          assert:
            - "HTTP 422 with error_id == ERR_INVALID_REQUEST"
            - "no Pollutant row exists afterwards"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Pollutant.fields.design_value_years
          - entities.Pollutant.fields.completeness_threshold_pct
          - entities.Pollutant.fields.rounding_decimals
          - entities.MonitoringSite.fields.distance_to_source_m
          - entities.Monitor.fields.is_primary_for_design_value
        distinguishing_aspect: "Omitting design_value_years, completeness_threshold_pct, rounding_decimals, distance_to_source_m and is_primary_for_design_value yields exactly 3, 75.0, 1, 0.0 and false respectively."
        test_recipe:
          setup:
            - "one Pollutant PM25 with a designated FRM method and one network, so a site and monitor can be created"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { pm25_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_id: "$.data.id" }
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
          trigger:
            - call: "POST /pollutants"
              payload: { code: "PM10", averaging_period_hours: 24, standard_form: "PERCENTILE_98", primary_standard_value: 150.0 }
              as: NetworkAdmin
              captures: { pm10_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-002", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0 }
              as: NetworkAdmin
              captures: { site_b_id: "$.data.id" }
            - call: "POST /monitors"
              payload: { site_id: "${site_b_id}", reference_method_id: "${frm_id}", poc: 1, installed_at: "2025-06-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_b_id: "$.data.id" }
          assert:
            - "Pollutant.${pm10_id}.design_value_years == 3, completeness_threshold_pct == 75.0, rounding_decimals == 1"
            - "MonitoringSite.${site_b_id}.distance_to_source_m == 0.0"
            - "MonitoringSite.${site_b_id}.siting_violation_codes == [] and siting_waiver_required == false"
            - "Monitor.${mon_b_id}.is_primary_for_design_value == false"

      - name: data_batch_computed_hour_fields_are_populated_at_creation
        claim_type: computed_fields
        grounds:
          - calculations.batch_hour_accounting
          - entities.DataBatch.fields.completeness_pct
          - entities.DataBatch.fields.regulatory_use_eligible
        distinguishing_aspect: "A freshly created 2160-hour quarter with no invalidation and no exclusion returns excused 0, invalidated 0, event_excluded 0, adjusted 2160, valid 2160, completeness_pct 100.0 and regulatory_use_eligible true in the creation response itself."
        test_recipe:
          setup:
            - "one operating site with one commissioned QC-current monitor, logical clock at 2026-01-05T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /pollutants"
              payload: { code: "PM25", averaging_period_hours: 24, standard_form: "ANNUAL_MEAN", primary_standard_value: 9.0, design_value_years: 3, completeness_threshold_pct: 75.0, rounding_decimals: 1 }
              as: NetworkAdmin
              captures: { pm25_id: "$.data.id" }
            - call: "POST /reference-methods"
              payload: { pollutant_id: "${pm25_id}", method_code: "RFPS-0617-001", designation_type: "FRM", effective_from: "2020-01-01T00:00:00Z", max_span_drift_pct: 5.0, zero_drift_limit: 1.5, required_span_check_interval_days: 14, required_calibration_interval_days: 365 }
              as: NetworkAdmin
              captures: { frm_id: "$.data.id" }
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
            - call: "POST /monitoring-sites"
              payload: { network_id: "${net_id}", site_code: "S-001", site_type: "POPULATION_ORIENTED", latitude: 39.75, longitude: -104.99, population_served: 400000, probe_height_m: 4.0, distance_to_roadway_m: 25.0, distance_to_obstruction_m: 12.0, obstruction_height_m: 6.0, distance_to_source_m: 0.0 }
              as: NetworkAdmin
              captures: { site_a_id: "$.data.id" }
            - call: "POST /monitoring-sites/${site_a_id}/siting-approval"
              payload: { waiver_granted: false }
              as: EpaRegionalReviewer
            - call: "POST /monitoring-sites/${site_a_id}/commence-operations"
              payload: {}
              as: ProgramManager
            - call: "POST /monitors"
              payload: { site_id: "${site_a_id}", reference_method_id: "${frm_id}", poc: 1, is_primary_for_design_value: true, installed_at: "2022-12-20T00:00:00Z" }
              as: NetworkAdmin
              captures: { mon_id: "$.data.id" }
            - call: "POST /monitors/${mon_id}/approve"
              payload: {}
              as: EpaRegionalReviewer
            - call: "POST /monitors/${mon_id}/commission"
              payload: {}
              as: FieldTechnician
            - call: "POST /monitors/${mon_id}/qc-events"
              payload: { event_type: "SPAN_CHECK", performed_at: "2026-01-02T00:00:00Z", span_drift_pct: 2.0 }
              as: FieldTechnician
          trigger:
            - call: "POST /data-batches"
              payload: { monitor_id: "${mon_id}", year: 2025, quarter: 1, scheduled_hour_count: 2160, quarterly_mean_concentration: 9.0 }
              as: QaOfficer
              as_user_id: "qa-1"
              captures: { b_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "DataBatch.${b_id}.excused_hour_count == 0, invalidated_hour_count == 0, event_excluded_hour_count == 0"
            - "DataBatch.${b_id}.adjusted_scheduled_hour_count == 2160 and valid_hour_count == 2160"
            - "DataBatch.${b_id}.completeness_pct == 100.0 and regulatory_use_eligible == true"
            - "DataBatch.${b_id}.validation_status == RAW and submission_status == UNSUBMITTED"
            - "DataBatch.${b_id}.reopen_count == 0 and invalidation_applied_by_user_ids == []"

      - name: monitoring_site_system_fields_are_server_assigned_at_creation
        claim_type: system_fields
        grounds:
          - entities.MonitoringSite.fields.status
          - entities.MonitoringSite.fields.siting_waiver_granted
          - entities.MonitoringSite.fields.operations_start_at
          - entities.MonitoringSite.fields.current_attainment_status
        distinguishing_aspect: "POST /monitoring-sites assigns id, created_at, updated_at and version 1 plus status PROPOSED, siting_waiver_granted false, operations_start_at null, suspended_at null, operating_monitor_count 0 and current_attainment_status UNDETERMINED without any of them appearing in the request."
        test_recipe:
          setup:
            - "one network with metropolitan_population 1200000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /monitoring-networks"
              payload: { name: "State Ambient Network", agency_code: "AQ01", metropolitan_population: 1200000 }
              as: NetworkAdmin
              captures: { net_id: "$.data.id" }
          trigger:
            - call: "POST /monitoring-sites"
