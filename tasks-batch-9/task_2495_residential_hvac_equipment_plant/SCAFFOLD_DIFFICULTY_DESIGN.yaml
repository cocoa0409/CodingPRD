          - state_machines.ProductPlatform.ENG_REVIEW_to_DRAFT
          - entities.ProductPlatform.fields.revision_round
          - entities.ProductPlatform.fields.last_revision_notes
          - entities.ProductPlatform.fields.submitted_by_user_id
          - validations.segregation-of-duties
        distinguishing_aspect: |
          The platform re-enters DRAFT from ENG_REVIEW and the identical submit trigger produces a
          different observable outcome the second time round - revision_round 2 instead of 1 - while
          the reviewer's notes from the first pass survive the loop; the state alone does not
          determine the effect, the number of completed cycles does.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "An ACTIVE A2L program and a platform that has been submitted once by user-de-1 and returned to DRAFT by reviewer user-re-1 with notes, so revision_round == 1 and last_revision_notes is populated."
