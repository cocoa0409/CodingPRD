            - "exactly 2 rows, sequence_index ASC: ${m1_seq} == 1 and ${m2_seq} == 2"
            - "${m1_dist} == 0 (mandatory for sequence_index 1) and ${m2_dist} == 2640"
            - "${m1_int} == ${i1_id} and ${m2_int} == ${i2_id}"
            - "no row carries a version, created_at or updated_at field — CorridorMember has common_fields false"
            - "§1.5 declares no PATCH, PUT or DELETE whose path ends in /members, so no mutation surface exists for these rows"

      - name: phase_split_create_against_unknown_timing_plan_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.PhaseSplit.parent
          - errors.ERR_TIMING_PLAN_NOT_FOUND
          - validations[priority=20]
          - endpoints[POST /signal-ops/timing-plans/{id}/phase-splits]
        distinguishing_aspect: "PhaseSplit's parent is TimingPlan and the parent id lives in the path, so an unknown plan id returns 404 ERR_TIMING_PLAN_NOT_FOUND before any body validation runs — even when the body itself is also invalid."
        test_recipe:
          setup:
            - "Empty database; clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /signal-ops/timing-plans/22222222-2222-4222-8222-222222222222/phase-splits"
              payload: { phase_number: 99, split_sec: 21, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == ERR_TIMING_PLAN_NOT_FOUND, NOT ERR_INVALID_REQUEST — the priority-20 path-resolution check (priority 20) precedes body validation (priority 30) even though phase_number 99 is out of its 1..8 range"

      - name: one_intersection_participates_in_two_corridors_through_the_junction_entity
        claim_type: graph_many_to_many_junction
        grounds:
          - complexity_profile.entity_topology
          - entities.CorridorMember
          - endpoints[GET /signal-ops/intersections/{id}/corridor-memberships]
          - endpoints[GET /signal-ops/corridors/{id}/members]
        distinguishing_aspect: "entity_topology is graph: the same Intersection is enrolled in two different Corridors, each membership carrying its own sequence_index, and the reverse lookup from the intersection returns both junction rows while each corridor's own member list returns only its own."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Intersection iShared is enrolled in corridor cA at sequence_index 1 and in corridor cB at sequence_index 2 (behind iB at sequence_index 1)."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Shared Junction @ Main", controller_type: "TS2_CABINET" }
              as: SignalOpsAdmin
              captures: { ishared_id: $.data.id }
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "B St @ 1st Ave", controller_type: "TS2_CABINET" }
              as: SignalOpsAdmin
              captures: { ib_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "A Street Corridor", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 10.0 }
              as: SignalOpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "B Street Corridor", jurisdiction_class: "COLLECTOR", annual_volume_change_pct: 5.0 }
              as: SignalOpsAdmin
              captures: { cb_id: $.data.id }
            - call: "POST /signal-ops/corridors/${ca_id}/members"
              payload: { intersection_id: "${ishared_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${cb_id}/members"
              payload: { intersection_id: "${ib_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${cb_id}/members"
              payload: { intersection_id: "${ishared_id}", sequence_index: 2, distance_from_prev_ft: 1320 }
              as: SignalOpsAdmin
          trigger:
            - call: "GET /signal-ops/intersections/${ishared_id}/corridor-memberships"
              payload: {}
              as: SignalOpsAdmin
              captures: { mem_a_corridor: "$.data[0].corridor_id", mem_a_seq: "$.data[0].sequence_index", mem_b_corridor: "$.data[1].corridor_id", mem_b_seq: "$.data[1].sequence_index" }
            - call: "GET /signal-ops/corridors/${ca_id}/members"
              payload: {}
              as: SignalOpsAdmin
              captures: { ca_member_int: "$.data[0].intersection_id" }
          assert:
            - "the reverse lookup returns exactly 2 junction rows, total_count == 2"
            - "the two rows reference the two different corridors ${ca_id} and ${cb_id} — ${mem_a_corridor} and ${mem_b_corridor} are distinct"
            - "the same intersection carries different positions in the two corridors: one row has sequence_index 1 and the other 2, so ${mem_a_seq} != ${mem_b_seq}"
            - "GET /signal-ops/corridors/${ca_id}/members has total_count == 1 with ${ca_member_int} == ${ishared_id}"
            - "Corridor.${ca_id}.member_count == 1 and Corridor.${cb_id}.member_count == 2"

  # =============================================================================================
  # SECTION 2 — state_machines
  # Walks Table-2 rows (Valid Transition, Precondition Enforcement, Side Effect Execution,
  # Invalid Transitions, Initial State, Terminal State Lockdown, Idempotency), the `cyclic`
  # state_machine_shape row, the `parallel` row, and the six side-effect patterns
  # (cascade down, bubble up, cross-entity, ledger sync, compensation, conditional cascade)
  # against §1.2's seven machines.
  # =============================================================================================
  - section: state_machines
    instances:
      - name: complaint_open_to_triaged_valid_transition_refreshes_counters
        claim_type: valid_transition
        grounds:
          - state_machines.CitizenComplaint[OPEN -> TRIAGED]
          - endpoints[POST /signal-ops/complaints/{id}/triage]
          - entities.Corridor.fields.complaint_open_count
          - entities.Requester.fields.open_complaint_count
        distinguishing_aspect: "The declared valid transition moves the complaint to TRIAGED and refreshes both derived counters in the same request, with TRIAGED still counted inside the corridor's open bucket rather than moving to the linked or terminal bucket."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor c1 exists (no members needed) and requester r1 has filed one COORDINATION complaint against it."
          setup_api_calls:
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/requesters"
              payload: { display_name: "Ada Citizen", email: "ada@example.org" }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { r1_id: $.data.id }
            - call: "POST /signal-ops/complaints"
              payload: { requester_id: "${r1_id}", corridor_id: "${c1_id}", category: "COORDINATION", narrative: "Waiting three cycles at 2nd Ave every morning." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { cx_id: $.data.id, cx_status0: $.data.status, cx_v0: $.data.version }
          trigger:
            - call: "POST /signal-ops/complaints/${cx_id}/triage"
              payload: { disposition: "TRIAGE", note: "Corridor is on the retiming shortlist." }
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { cx_status1: $.data.status, cx_v1: $.data.version, cx_linked: $.data.linked_project_id, cx_reopen: $.data.reopen_count }
            - call: "GET /signal-ops/corridors/${c1_id}"
              payload: {}
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { c1_total: $.data.complaint_total_count, c1_open: $.data.complaint_open_count, c1_linked: $.data.complaint_linked_count, c1_term: $.data.complaint_terminal_count }
            - call: "GET /signal-ops/requesters/${r1_id}"
              payload: {}
              as: CitizenLiaison
              as_user_id: "liaison-1"
              captures: { r1_open: $.data.open_complaint_count }
          assert:
            - "HTTP 200 on the triage call"
            - "${cx_status0} == OPEN and ${cx_status1} == TRIAGED"
            - "${cx_v1} == ${cx_v0} + 1"
            - "${cx_linked} == null and ${cx_reopen} == 0 — triage neither links nor reopens"
            - "${c1_total} == 1, ${c1_open} == 1, ${c1_linked} == 0, ${c1_term} == 0 (TRIAGED lives in the open bucket)"
            - "${r1_open} == 1"

      - name: field_tuning_complete_rejected_while_an_observation_is_open
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RetimingProject[FIELD_TUNING -> EVALUATION]
          - errors.ERR_OBSERVATIONS_UNRESOLVED
          - endpoints[PATCH /signal-ops/field-observations/{id}]
          - endpoints[POST /signal-ops/retiming-projects/{id}/field-tuning]
        distinguishing_aspect: "The transition's own precondition — every FieldObservation resolved to ADDRESSED or DISMISSED — is enforced independently of the status gate: with the project legitimately in FIELD_TUNING, COMPLETE is refused 409 ERR_OBSERVATIONS_UNRESOLVED, and the identical call succeeds the moment the observation is patched to ADDRESSED."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "CHAIN-IMPL: intersection i1 (TS2_CABINET, FULL, ONLINE, STD_3_5_FPS, max_cycle 150) is the sole member of ARTERIAL corridor c1 (annual_volume_change_pct 20.0); c1 is screened then SELECTED; project p1 (study_window_start_at 2026-07-01T00:00:00Z, 180 days, lead eng-1) collects one BEFORE count {1:350, 2:500, 4:250, 6:180} and one BEFORE run, advances, drafts plan tp1 (AM_PEAK 360..540, drafted cycle 90, MASTER) with four phase splits 21/30/22/22 (phase 2 pedestrian, min_green 15, walk 7, ped clear 27, crosswalk 62.0 ft), coordinates to cycle 105, submits, is certified by cert-1 and is implemented."
            - "The project is then started into FIELD_TUNING and one FieldObservation with requires_adjustment false is logged, so it sits in resolution_status OPEN without firing the adjustment cascade."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/screen"
              payload: {}
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${c1_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Programme corridor" }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${c1_id}", study_window_start_at: "2026-07-01T00:00:00Z", study_window_days: 180, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id }
            - call: "POST /signal-ops/intersections/${i1_id}/turning-movement-counts"
              payload: { project_id: "${p1_id}", study_role: "BEFORE", count_date: "2026-07-15T00:00:00Z", period: "AM_PEAK", phase_volumes: { "1": 350, "2": 500, "4": 250, "6": 180 } }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/travel-time-runs"
              payload: { study_role: "BEFORE", direction: "NB", started_at: "2026-07-15T09:00:00Z", duration_sec: 320, stops_count: 5, arrivals_on_green_count: 4, total_arrivals: 12 }
              as: FieldTechnician
              as_user_id: "tech-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/advance"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_v_adv: $.data.version }
            - call: "POST /signal-ops/timing-plans"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "AM_PEAK", tod_start_min: 360, tod_end_min: 540, cycle_length_sec: 90, coordination_ref: "MASTER", expected_project_version: "${p1_v_adv}" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { tp1_id: $.data.id }
            - call: "POST /signal-ops/timing-plans/${tp1_id}/phase-splits"
              payload: { phase_number: 1, split_sec: 21, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${tp1_id}/phase-splits"
              payload: { phase_number: 2, split_sec: 30, min_green_sec: 15, yellow_sec: 3.0, red_clearance_sec: 1.0, is_pedestrian_phase: true, walk_sec: 7, ped_clear_sec: 27, crosswalk_length_ft: 62.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${tp1_id}/phase-splits"
              payload: { phase_number: 4, split_sec: 22, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${tp1_id}/phase-splits"
              payload: { phase_number: 6, split_sec: 22, min_green_sec: 10, yellow_sec: 3.0, red_clearance_sec: 1.0 }
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/coordinate"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${tp1_id}/submit"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/timing-plans/${tp1_id}/certify"
              payload: {}
              as: CertifyingEngineer
              as_user_id: "cert-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/implement"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
            - call: "POST /signal-ops/retiming-projects/${p1_id}/field-tuning"
              payload: { action: "START" }
              as: SignalOpsAdmin
              captures: { p1_status_ft: $.data.status }
            - call: "POST /signal-ops/field-observations"
              payload: { project_id: "${p1_id}", intersection_id: "${i1_id}", tod_period: "AM_PEAK", observed_at: "2026-08-01T00:00:00Z", finding_code: "EARLY_RETURN_TO_GREEN", requires_adjustment: false }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { obs1_id: $.data.id, obs1_res0: $.data.resolution_status }
          trigger:
            - call: "POST /signal-ops/retiming-projects/${p1_id}/field-tuning"
              payload: { action: "COMPLETE" }
              as: SignalOpsAdmin
              captures: { err: $.data.error_id }
            - call: "PATCH /signal-ops/field-observations/${obs1_id}"
              payload: { resolution_status: "ADDRESSED" }
              as: FieldTechnician
              as_user_id: "tech-1"
              captures: { obs1_res1: $.data.resolution_status }
            - call: "POST /signal-ops/retiming-projects/${p1_id}/field-tuning"
              payload: { action: "COMPLETE" }
              as: SignalOpsAdmin
              captures: { p1_status2: $.data.status, p1_tuned_at: $.data.last_tuning_completed_at }
          assert:
            - "${p1_status_ft} == FIELD_TUNING and ${obs1_res0} == OPEN"
            - "the first COMPLETE returns HTTP 409 with ${err} == ERR_OBSERVATIONS_UNRESOLVED"
            - "GET /signal-ops/retiming-projects/${p1_id} right after the refusal still reports status FIELD_TUNING and last_tuning_completed_at null"
