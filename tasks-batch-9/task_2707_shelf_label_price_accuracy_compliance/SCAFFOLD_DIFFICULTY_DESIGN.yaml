  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: audit_outcome_threshold_is_inclusive_at_exactly_the_percentage
        grounds:
          - calculations.scanner_audit_error_rate
          - entities.Jurisdiction.fields.scanner_error_rate_threshold_pct
          - state_machines.ScannerAudit.SCANNING_to_CLOSED
        distinguishing_aspect: |
          Comparison-operator boundary on a computed percentage: outcome is FAIL when
          error_rate_pct >= threshold, so a rate of exactly 25.00 against a threshold of 25.0 must
          FAIL, not PASS. Three audits with identical overcharge counts but sample sizes 5 / 4 / 3
          land just below, exactly on, and just above the threshold, and the third also pins the
          2-decimal ROUND_HALF_UP of 33.3333... to 33.33.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z default."
            - "Jurisdiction US-CA with scanner_error_rate_threshold_pct 25.0 and default_rate_variant GROSS_MISMATCH."
            - "One store, three aisles with NO assigned associate (so no accountability cascade muddies the verdict), one CERTIFIED PRICE_AUDITOR."
            - "Three audits, one per aisle: 5 lines / 1 overcharge, 4 lines / 1 overcharge, 3 lines / 1 overcharge. Separate aisles keep the 60-minute audit cooldown out of play."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", scanner_error_rate_threshold_pct: 25.0, default_rate_variant: "GROSS_MISMATCH" }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_below: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A02", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_at: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A03", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_above: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${aisle_below}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T08:00:00Z", scan_window_end: "2026-08-01T09:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_below: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_below}/scan-lines"
              payload: { item_upc: "00000000000701", shelf_price_cents: 949, register_price_cents: 1099 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_below}/scan-lines"
              payload: { item_upc: "00000000000702", shelf_price_cents: 299, register_price_cents: 299 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_below}/scan-lines"
              payload: { item_upc: "00000000000703", shelf_price_cents: 199, register_price_cents: 199 }
