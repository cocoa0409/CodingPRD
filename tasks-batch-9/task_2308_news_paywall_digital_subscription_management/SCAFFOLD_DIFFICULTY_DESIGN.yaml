              as: Reader
              as_user_id: "${rd11}"
              captures: { err_buffer: "$.data.error_id" }
            - call: "POST /paywall/subscriptions/${sub11}/holds"
              payload: { hold_type: "VACATION_DELIVERY", start_date: "2026-09-16", end_date: "2026-09-22" }
              as: Reader
              as_user_id: "${rd11}"
              captures: { hold11b: "$.data.id" }
          assert:
            - "the 2026-09-15 candidate returns HTTP 409 with error_id ERR_HOLD_BUFFER_VIOLATION"
            - "the 2026-09-16 candidate returns HTTP 201"
            - "Hold rows on Subscription.${sub11} == 2"
