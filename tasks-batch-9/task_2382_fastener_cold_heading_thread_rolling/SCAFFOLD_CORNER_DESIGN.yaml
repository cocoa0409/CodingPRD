              as: ProcessEngineer
              captures: { wire_1: $.data.id }
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 200.0 }
              as: ProcessEngineer
              captures: { wire_2: $.data.id }
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat_id}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 200.0 }
              as: ProcessEngineer
              captures: { wire_3: $.data.id }
            - call: "POST /wire-lots"
              payload: { steel_heat_id: "${heat2_id}", draw_pass_count: 3, inlet_diameter_mm: 8.00, outlet_diameter_mm: 6.80, lubricant_coating: "PHOSPHATE", coating_weight_gsm: 4.5, gross_mass_kg: 200.0 }
              as: ProcessEngineer
              captures: { wire_4: $.data.id }
          trigger:
            - call: "GET /wire-lots"
              payload: { steel_heat_id: "${heat_id}", status: "DRAWN", limit: 10, offset: 0 }
              as: QualityManager
              as_user_id: "qm-1"
            - call: "GET /wire-lots"
              payload: { steel_heat_id: "${heat_id}", limit: 2, offset: 2 }
              as: QualityManager
              as_user_id: "qm-1"
            - call: "POST /wire-lots/${wire_2}/release"
              payload: {}
              as: QualityInspector
              as_user_id: "insp-1"
            - call: "GET /wire-lots"
