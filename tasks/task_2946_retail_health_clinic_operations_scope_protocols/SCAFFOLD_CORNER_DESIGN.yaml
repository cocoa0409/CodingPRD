            - "${now_booking_status} == SCHEDULED with HTTP status 201   # scheduled_at exactly AT the clock is not 'in the past'"
            - "${empty_window_err} == ERR_INVALID_TIME_RANGE with HTTP status 422   # window_start == window_end"
