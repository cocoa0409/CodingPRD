            - *c_win
            - *c_open
            - *c_ent
            - *c_site
            - *c_verify
            - call: "POST /vaccine-distribution/storage-sites"
              payload: { site_code: "MI-RIV-02", site_name: "Riverside Field Unit", jurisdiction_program_id: "${prog_id}", storage_capability: "ULTRA_COLD", ultra_cold_capacity_cartons: 1, refrigerated_capacity_cartons: 1, cold_chain_equipment_type: "ULTRA_COLD_FREEZER", equipment_certificate_expires_at: "2027-01-01T00:00:00Z", expected_weekly_doses: 600 }
