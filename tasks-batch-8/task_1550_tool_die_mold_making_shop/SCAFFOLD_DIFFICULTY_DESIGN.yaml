        grounds:
          - state_machines.EngineeringChange.IMPACT_ASSESSED_to_APPROVED
          - state_machines.BuildMilestone.INVOICED_to_REOPENED
          - state_machines.ProgressInvoice.PARTIALLY_PAID_to_VOID
          - state_machines.BuildJob.BUYOFF_PASSED_to_IN_BUILD
          - calculations.milestone_billing_schedule
        distinguishing_aspect: |
          Depth-4 chain from POST /engineering-changes/{id}/customer-decision
          APPROVED: ECO creates a ReworkAuthorization (hop 1); the BuildJob
          re-baselines and milestones m4/m5 are REOPENED (hop 2, caused by the
          approval, not the caller); each reopened milestone voids its open
          invoice (hop 3, caused by the milestone reopen); billed_cents drops to
          0 and the job plus tool regress BUYOFF_PASSED/AWAITING_SHIPMENT ->
          IN_BUILD (hop 4, caused by the reopen set being non-empty).
        test_recipe:
          setup:
            - "CLASS_103 job (contract 10500000) at BUYOFF_PASSED: tryout bought off (500 shots), milestones 1-5 EARNED, milestone 4 INVOICED with an open ISSUED invoice of 1575000, milestones 1-3 EARNED but never invoiced"
            - "ECO (SHOP, affects_from_milestone_seq 4) assessed at 4.0 h rework, 50000 scrapped, 1-week extension => impact 50000+57500 = 107500, penalty 0, total_charge 107500"
