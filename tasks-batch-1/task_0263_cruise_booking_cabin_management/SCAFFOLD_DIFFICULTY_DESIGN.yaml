              as: RevenueManager
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8002", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { s_v: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${s_id}", cabin_category_id: "${cc_id}", owner_user_id: "guest-12", expected_sailing_version: "${s_v}" }
              as: GuestUser
              as_user_id: "guest-12"
              captures: { b_id: $.data.id }
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "M One", age: 40 }
              as: GuestUser
              as_user_id: "guest-12"
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "M Two", age: 38 }
              as: GuestUser
              as_user_id: "guest-12"
            - call: "POST /payments"
              payload: { booking_id: "${b_id}", kind: "DEPOSIT", amount_cents: 50000 }
              as: GuestUser
              as_user_id: "guest-12"
              captures: { dep_id: $.data.id }
            - call: "POST /payments/${dep_id}/capture"
              payload: {}
              as: GuestUser
              as_user_id: "guest-12"
            - call: "POST /bookings/${b_id}/hold-deposit"
