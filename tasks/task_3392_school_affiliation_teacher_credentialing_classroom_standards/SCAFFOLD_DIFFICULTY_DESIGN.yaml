            - "ClassroomAudit.${aud_id}.materials_pass == true (0.9175 >= 0.90; sum-first order would yield 0.8929 and fail)"
            - "ClassroomAudit.${aud_id}.verdict == COMPLIANT (ratio 15.0 <= 15, work 180 >= 180, multi-age 3 >= 3 all pass)"

  - rule_id: non_linear_state_machine
    instances:

      - name: self_study_revision_cycle
        grounds:
          - state_machines.SelfStudy.DRAFT_to_SUBMITTED
          - state_machines.SelfStudy.SUBMITTED_to_RETURNED_FOR_REVISION
          - state_machines.SelfStudy.RETURNED_FOR_REVISION_to_SUBMITTED
          - state_machines.SelfStudy.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: "SelfStudy is cyclic: DRAFT -> SUBMITTED -> RETURNED_FOR_REVISION -> SUBMITTED -> ACCEPTED, i.e. the same submit transition fires twice from different loop iterations; the terminal ACCEPTED state then rejects a further submit with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "School S (APPLICANT) with one self-study; ACTIVE catalog present for pinning."
          setup_api_calls:
            - *clk_start
            - *cat_create
