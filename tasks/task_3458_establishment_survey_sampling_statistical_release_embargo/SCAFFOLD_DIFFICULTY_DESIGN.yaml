            - { call: "POST /survey/sample-frames/${frame_id}/freeze", payload: {}, as: ProgramAdmin }
            - { call: "POST /survey/establishments", payload: { ein: "11-0001201", name: "RS1", industry_code: RETAIL, size_class: SMALL }, as: CollectionOfficer, captures: { rs1: $.data.id } }
            - { call: "POST /survey/establishments", payload: { ein: "11-0001202", name: "RS2", industry_code: RETAIL, size_class: SMALL }, as: CollectionOfficer, captures: { rs2: $.data.id } }
            - { call: "POST /survey/establishments", payload: { ein: "11-0001203", name: "RM1", industry_code: RETAIL, size_class: MEDIUM }, as: CollectionOfficer, captures: { rm1: $.data.id } }
