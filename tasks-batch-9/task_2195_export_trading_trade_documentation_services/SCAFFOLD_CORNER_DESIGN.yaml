          assert:
            - "the booking response itself already carries chargeable == 8000.000 (the DRY_20 minimum, not the booked 1200.000), window_start == \"2026-08-18T00:00:00Z\" and window_end == \"2026-08-22T00:00:00Z\" (etd plus DOC_BUFFER_HOURS 24)"
            - "booked_before == 0.000 and booked_after == 1200.000 on the very next read — the sailing ledger charges the REQUESTED weight, not the chargeable weight"
            - "sailing_status == \"OPEN\" (1200.000 is far below capacity 20000.000) and sailing_v_after == sailing_v + 1"
            - "fulfillment_after == \"BOOKED\" and both provisional cost fields are non-zero immediately, with provisional_seller == 584.00 for the FOB seller buckets B1 42.00 + B2 180.00 + B3 320.00 under ZONE_2"
            - "recomputed_seller == provisional_seller — the computed read agrees with the stored ledger with no lag and without persisting anything new"
            - "reread_chargeable == chargeable and reread_status == booking_status == \"BOOKED\": nothing about the write settles asynchronously"
      - name: corner_a_discrepant_examination_compensates_the_order_back_to_lc_accepted
