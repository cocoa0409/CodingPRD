# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3459_food_facility_registration_import_alert_detention
#
# Breadth probe over §1.1-§1.7 claims not already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. §1.8-covered corners appear as
# excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: facility_creation_assigns_registration_number_and_biennial_expiry
        claim_type: Creation
        grounds:
          - entities.Facility
          - endpoints.POST_/registry/facilities
          - calculations.facility_registration_expiry
        distinguishing_aspect: "The first facility registered from an empty database comes back 201 with server-minted registration_number FFR-000001, status REGISTERED, version 1, and expires_at exactly 730 days after the default-clock registration instant."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z. Empty database."
          trigger:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Acme Brine Works", facility_kind: "DOMESTIC", country_code: "US", ufi: "UFI-US-0001" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
          assert:
            - "response 201; Facility.${fac_id}.registration_number == \"FFR-000001\""
            - "registration_status == REGISTERED and version == 1"
            - "registered_at == 2026-09-01T00:00:00Z and expires_at == 2028-08-31T00:00:00Z (registered_at + 730 days)"
            - "violation_count == 0 and open_detention_count == 0; id is a type-prefix-free UUID"
            - "response carries meta.api_request_id and meta.api_request_timestamp"

      - name: facility_get_with_unknown_id_returns_facility_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/registry/facilities/{id}
          - errors.ERR_FACILITY_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated facility id yields the entity-specific ERR_FACILITY_NOT_FOUND (404), not a generic error."
        test_recipe:
          setup: ["Empty database; default clock."]
          trigger:
            - call: "GET /registry/facilities/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FACILITY_NOT_FOUND (http 404)"

      - name: prior_notice_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.PriorNotice
          - endpoints.POST_/registry/prior-notices
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required arrival_eta data element from a prior notice filing is rejected 400 ERR_INVALID_REQUEST; no notice is created."
        test_recipe:
          setup:
            - "Default clock; Facility (FOREIGN, DE) REGISTERED; Importer onboarded."
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Ebro Vegetales", facility_kind: "FOREIGN", country_code: "ES", ufi: "UFI-ES-2001" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Copper State Imports", account_code: "IMP-2001" }
              as: PlatformAdmin
              captures: { imp_id: $.data.id }
          trigger:
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-VEG-01", product_risk_class: "STANDARD", transport_mode: "VESSEL", declared_units: 10, unit_value_cents: 100, port_code: "US-NYC" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"
            - "GET /registry/prior-notices?importer_id=${imp_id} returns 0 rows"

      - name: facility_duplicate_ufi_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Facility.fields.ufi
          - errors.ERR_DUPLICATE_UFI
          - validations[priority=9]
        distinguishing_aspect: "A second facility registration reusing an existing ufi is rejected 409 ERR_DUPLICATE_UFI regardless of the other fields."
        test_recipe:
          setup: ["Default clock; one facility with ufi UFI-ES-2002 exists."]
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Rioja Bodega", facility_kind: "FOREIGN", country_code: "ES", ufi: "UFI-ES-2002" }
              as: FacilityOwner
              captures: { fac_1: $.data.id }
          trigger:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Rioja Bodega Segunda", facility_kind: "FOREIGN", country_code: "ES", ufi: "UFI-ES-2002" }
              as: FacilityOwner
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_UFI (http 409); Facility.${fac_1} unchanged"

      - name: importer_duplicate_account_code_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ImporterFirm.fields.account_code
          - errors.ERR_DUPLICATE_ACCOUNT_CODE
        distinguishing_aspect: "Importer onboarding enforces account_code uniqueness with ERR_DUPLICATE_ACCOUNT_CODE."
        test_recipe:
          setup: ["Default clock; importer IMP-2002 exists."]
          setup_api_calls:
            - call: "POST /registry/importers"
              payload: { firm_name: "Northwoods Trading", account_code: "IMP-2002" }
              as: PlatformAdmin
              captures: { imp_1: $.data.id }
          trigger:
            - call: "POST /registry/importers"
              payload: { firm_name: "Northwoods Trading II", account_code: "IMP-2002" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_ACCOUNT_CODE (http 409)"

      - name: laboratory_duplicate_lab_code_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Laboratory.fields.lab_code
          - errors.ERR_DUPLICATE_LAB_CODE
        distinguishing_aspect: "Laboratory registration enforces lab_code uniqueness with ERR_DUPLICATE_LAB_CODE."
        test_recipe:
          setup: ["Default clock; laboratory LAB-DUP exists."]
          setup_api_calls:
            - call: "POST /registry/laboratories"
              payload: { lab_code: "LAB-DUP", daily_sample_capacity: 10 }
              as: PlatformAdmin
          trigger:
            - call: "POST /registry/laboratories"
              payload: { lab_code: "LAB-DUP", daily_sample_capacity: 5 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_LAB_CODE (http 409)"

      - name: prior_notice_invalid_enum_transport_mode_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.PriorNotice.fields.transport_mode
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "A transport_mode outside {VESSEL, AIR, RAIL, ROAD} is rejected 400 ERR_INVALID_REQUEST before any timing or state check runs."
        test_recipe:
          setup: ["Default clock; facility and importer exist."]
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Thai Rice Mills", facility_kind: "FOREIGN", country_code: "TH", ufi: "UFI-TH-2003" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Bay Area Foods", account_code: "IMP-2003" }
              as: PlatformAdmin
              captures: { imp_id: $.data.id }
          trigger:
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-RICE-02", product_risk_class: "STANDARD", transport_mode: "HORSE", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 10, unit_value_cents: 100, port_code: "US-OAK" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST (http 400)"

      - name: entries_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/registry/entries
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three entries on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false; no parameters applies the defaults limit 10 / offset 0."
        test_recipe:
          setup:
            - "Default clock; facility, importer, and three entries (three consumed notices)."
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Puno Quinoa", facility_kind: "FOREIGN", country_code: "PE", ufi: "UFI-PE-2004" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Mesa Verde Imports", account_code: "IMP-2004" }
              as: PlatformAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-GRN-01", product_risk_class: "LOW", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 5, unit_value_cents: 100, port_code: "US-LAX" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn_a: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_a}" }
              as: Importer
              as_user_id: "${imp_id}"
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-GRN-02", product_risk_class: "LOW", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 5, unit_value_cents: 100, port_code: "US-LAX" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn_b: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_b}" }
              as: Importer
              as_user_id: "${imp_id}"
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-GRN-03", product_risk_class: "LOW", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 5, unit_value_cents: 100, port_code: "US-LAX" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn_c: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_c}" }
              as: Importer
              as_user_id: "${imp_id}"
          trigger:
            - call: "GET /registry/entries"
              payload: { limit: 2, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "response 200 with response_type array; exactly 2 rows; total_count == 3 and has_more == true"
            - "GET /registry/entries with limit 2 offset 2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /registry/entries with importer_id filter and no pagination params returns 3 rows with limit defaulting to 10 and offset to 0"
            - "GET /registry/entries?disposition_status=PENDING returns 3 rows; ?disposition_status=RELEASED returns 0"

      - name: prior_notice_create_with_status_field_returns_invalid_request
        claim_type: System Fields
        grounds:
          - entities.PriorNotice.fields.status
          - endpoints.POST_/registry/prior-notices
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "System-controlled fields are not client-writable: a filing that tries to smuggle status into the payload is rejected 400 ERR_INVALID_REQUEST (unknown field), and a clean filing shows the server-set status CONFIRMED."
        test_recipe:
          setup: ["Default clock; facility and importer exist."]
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Gdansk Ryby", facility_kind: "FOREIGN", country_code: "PL", ufi: "UFI-PL-2005" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Superior Seafood", account_code: "IMP-2005" }
              as: PlatformAdmin
              captures: { imp_id: $.data.id }
          trigger:
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-FISH-02", product_risk_class: "STANDARD", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 10, unit_value_cents: 100, port_code: "US-SEA", status: "CONFIRMED" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { err: $.data.error_id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-FISH-02", product_risk_class: "STANDARD", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 10, unit_value_cents: 100, port_code: "US-SEA" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn_ok: $.data.id }
          assert:
            - "payload containing system field status: err == ERR_INVALID_REQUEST (http 400)"
            - "clean filing: PriorNotice.${pn_ok}.status == CONFIRMED, is_amendment == false, parent_pn_id is null, version == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: entry_double_screen_returns_entry_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ImportEntry
          - errors.ERR_ENTRY_INVALID_STATE
        distinguishing_aspect: "Screening is one-shot: a second screen on an already SCREENED (and RELEASED) entry fails with ERR_ENTRY_INVALID_STATE and no fields change."
        test_recipe:
          setup:
            - "Default clock; clean facility and importer; LOW entry screened once (score 10 -> RELEASE, disposition RELEASED)."
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Otago Orchards", facility_kind: "FOREIGN", country_code: "NZ", ufi: "UFI-NZ-2101" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Inland Empire Foods", account_code: "IMP-2101" }
              as: PlatformAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-APL-01", product_risk_class: "LOW", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 7, unit_value_cents: 120, port_code: "US-LAX" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn_id: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_id}" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { ent_id: $.data.id }
            - call: "POST /registry/entries/${ent_id}/screen"
              payload: {}
              as: EntryReviewer
              as_user_id: "er-1"
          trigger:
            - call: "POST /registry/entries/${ent_id}/screen"
              payload: {}
              as: EntryReviewer
              as_user_id: "er-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ENTRY_INVALID_STATE (http 409)"
            - "ImportEntry.${ent_id}.review_status == SCREENED and disposition_status == RELEASED and screening_score == 10"

      - name: terminal_entry_rejects_further_actions
        claim_type: terminal_lockdown
        grounds:
          - state_machines.ImportEntry
          - errors.ERR_ENTRY_INVALID_STATE
        distinguishing_aspect: "A RELEASED entry is in a terminal disposition: release, refuse, and export on it all fail with ERR_ENTRY_INVALID_STATE, regardless of caller role."
        test_recipe:
          setup:
            - "Default clock; clean facility and importer; LOW entry screened to RELEASE."
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Algarve Citrus", facility_kind: "FOREIGN", country_code: "PT", ufi: "UFI-PT-2102" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "High Plains Pantry", account_code: "IMP-2102" }
              as: PlatformAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /registry/prior-notices"
              payload: { importer_id: "${imp_id}", facility_id: "${fac_id}", product_code: "PC-ORG-01", product_risk_class: "LOW", transport_mode: "VESSEL", arrival_eta: "2026-09-03T00:00:00Z", declared_units: 9, unit_value_cents: 90, port_code: "US-MIA" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { pn_id: $.data.id }
            - call: "POST /registry/entries"
              payload: { prior_notice_id: "${pn_id}" }
              as: Importer
              as_user_id: "${imp_id}"
              captures: { ent_id: $.data.id }
            - call: "POST /registry/entries/${ent_id}/screen"
              payload: {}
              as: EntryReviewer
              as_user_id: "er-1"
          trigger:
            - call: "POST /registry/entries/${ent_id}/release"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { err_rel: $.data.error_id }
            - call: "POST /registry/entries/${ent_id}/refuse"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { err_ref: $.data.error_id }
            - call: "POST /registry/entries/${ent_id}/export"
              payload: {}
              as: Importer
              as_user_id: "${imp_id}"
              captures: { err_exp: $.data.error_id }
          assert:
            - "err_rel == ERR_ENTRY_INVALID_STATE and err_ref == ERR_ENTRY_INVALID_STATE and err_exp == ERR_ENTRY_INVALID_STATE (all http 409)"
            - "ImportEntry.${ent_id}.disposition_status == RELEASED and units_released == 9 and units_held == 0"

      - name: adjudicate_on_denied_petition_returns_petition_not_reviewable
        claim_type: terminal_lockdown
        grounds:
          - state_machines.AlertPetition
          - errors.ERR_PETITION_NOT_REVIEWABLE
        distinguishing_aspect: "A DENIED petition is terminal: a second adjudicate attempt fails with ERR_PETITION_NOT_REVIEWABLE; the alert stays ACTIVE."
        test_recipe:
          setup:
            - "Default clock; Facility (FOREIGN, DE); FIRM alert by co-1; petition filed by the facility with evidence; adjudicate DENY by co-2 -> DENIED."
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Wien Backwaren", facility_kind: "FOREIGN", country_code: "AT", ufi: "UFI-AT-2103" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/import-alerts"
              payload: { scope_type: "FIRM", facility_id: "${fac_id}", reason: "Mycotoxins" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { alert_id: $.data.id, alert_v: $.data.version }
            - call: "POST /registry/import-alerts/${alert_id}/petitions"
              payload: { expected_import_alert_version: "${alert_v}", evidence_links: ["doc-1"] }
              as: FacilityOwner
              as_user_id: "${fac_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /registry/alert-petitions/${pet_id}/adjudicate"
              payload: { decision: "DENY" }
              as: ComplianceOfficer
              as_user_id: "co-2"
          trigger:
            - call: "POST /registry/alert-petitions/${pet_id}/adjudicate"
              payload: { decision: "DENY" }
              as: ComplianceOfficer
              as_user_id: "co-2"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PETITION_NOT_REVIEWABLE (http 409)"
            - "AlertPetition.${pet_id}.status == DENIED and ImportAlert.${alert_id}.status == ACTIVE"

      - name: refuse_entry_on_completed_inspection_returns_inspection_not_open
        claim_type: invalid_transition
        grounds:
          - state_machines.Inspection.SCHEDULED_to_COMPLETED
          - errors.ERR_INSPECTION_NOT_OPEN
        distinguishing_aspect: "A COMPLETED inspection is terminal for the refusal path: refuse-entry on it fails with ERR_INSPECTION_NOT_OPEN and the facility is NOT suspended."
        test_recipe:
          setup:
            - "Default clock; Facility (FOREIGN, DE); inspection scheduled by fi-1 and completed by fi-1 with 0 findings."
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Luzern Milchwerk", facility_kind: "FOREIGN", country_code: "CH", ufi: "UFI-CH-2104" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/inspections"
              payload: { facility_id: "${fac_id}", scheduled_start_at: "2026-09-05T09:00:00Z", scheduled_end_at: "2026-09-05T17:00:00Z" }
              as: FieldInspector
              as_user_id: "fi-1"
              captures: { insp_id: $.data.id }
            - call: "POST /registry/inspections/${insp_id}/complete"
              payload: { findings_violation_count: 0 }
              as: FieldInspector
              as_user_id: "fi-1"
          trigger:
            - call: "POST /registry/inspections/${insp_id}/refuse-entry"
              payload: {}
              as: FacilityOwner
              as_user_id: "${fac_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INSPECTION_NOT_OPEN (http 409)"
            - "Facility.${fac_id}.registration_status == REGISTERED (no cascade fired) and violation_count == 0"

      - name: classify_on_classified_recall_returns_recall_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Recall.INITIATED_to_CLASSIFIED
          - errors.ERR_RECALL_INVALID_STATE
        distinguishing_aspect: "Classification is one-shot INITIATED -> CLASSIFIED; a second classify fails with ERR_RECALL_INVALID_STATE and the original classification stands."
        test_recipe:
          setup:
            - "Default clock; DOMESTIC facility; recall created (INITIATED, classification NONE) then classified CLASS_II."
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Yakima Valley Packing", facility_kind: "DOMESTIC", country_code: "US", ufi: "UFI-US-2105" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/recalls"
              payload: { facility_id: "${fac_id}", product_code: "PC-APC-01", quantity_distributed: 500 }
              as: RecallCoordinator
              as_user_id: "rc-1"
              captures: { rec_id: $.data.id }
            - call: "POST /registry/recalls/${rec_id}/classify"
              payload: { classification: "CLASS_II" }
              as: RecallCoordinator
              as_user_id: "rc-1"
          trigger:
            - call: "POST /registry/recalls/${rec_id}/classify"
              payload: { classification: "CLASS_I" }
              as: RecallCoordinator
              as_user_id: "rc-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RECALL_INVALID_STATE (http 409)"
            - "Recall.${rec_id}.classification == CLASS_II and status == CLASSIFIED"

      - name: compromised_notice_rejects_entry_filing
        claim_type: invalid_transition
        grounds:
          - state_machines.PriorNotice.CONFIRMED_to_COMPROMISED
          - state_machines.Inspection.SCHEDULED_to_REFUSED_BY_FACILITY
          - errors.ERR_PN_NOT_CONFIRMED
        distinguishing_aspect: "A notice pushed to COMPROMISED by the inspection-refusal cascade (not by any direct notice action) can no longer seed an entry: filing fails with ERR_PN_NOT_CONFIRMED."
        test_recipe:
          setup:
            - "Default clock; Facility (FOREIGN, DE) with one CONFIRMED unconsumed notice; inspection refused by the facility -> notice COMPROMISED."
          setup_api_calls:
            - call: "POST /registry/facilities"
              payload: { legal_name: "Cork Meats", facility_kind: "FOREIGN", country_code: "IE", ufi: "UFI-IE-2106" }
              as: FacilityOwner
              captures: { fac_id: $.data.id }
            - call: "POST /registry/importers"
              payload: { firm_name: "Finger Lakes Foods", account_code: "IMP-2106" }
              as: PlatformAdmin
              captures: { imp_id: $.data.id }
            - call: "POST /registry/prior-notices"
