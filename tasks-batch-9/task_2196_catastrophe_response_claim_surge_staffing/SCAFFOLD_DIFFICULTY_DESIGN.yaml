            - "Three Claims on the event, each TRIAGED at CAT_SEVERE (severity_score 100.00, case_reserve 170000.00 each) with inspection_mode FIELD."
            - "Three non-overlapping SCHEDULED InspectionAssignments (2026-09-02/03, 09-03/04, 09-04/05) funded by that Deployment, one per claim, so all three claims sit at INSPECTION_PENDING, unassigned_severe == 0 and posture == OPEN immediately before the trigger."
