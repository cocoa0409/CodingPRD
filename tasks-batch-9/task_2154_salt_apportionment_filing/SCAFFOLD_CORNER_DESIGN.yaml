      - name: vda_execute_from_draft_returns_invalid_vda_state
        claim_type: invalid_transition
        grounds:
          - state_machines.VDAAgreement.SUBMITTED_to_EXECUTED
          - validations[priority=11]
          - errors[ERR_INVALID_VDA_STATE]
        distinguishing_aspect: "execute is legal only from SUBMITTED, so calling it on a DRAFT disclosure answers HTTP 409 ERR_INVALID_VDA_STATE and the registration's nexus axis is untouched."
        test_recipe:
          setup:
            - "A group with one member entity and a CA registration."
            - "One DRAFT LOOKBACK_LIMITED disclosure anchored at 2024 with a 3-year lookback."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
              payload: {to_iso8601: "2026-08-01T00:00:00Z"}
              as: TaxManager
            - call: "POST /salt/groups"
              payload: {name: "VDA State Group", base_state_code: "DE", everywhere_sales: 10000000, everywhere_property: 4000000, everywhere_payroll: 2000000}
              as: TaxManager
              captures: {grp_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/legal-entities"
              payload: {name: "Corner Member", incorporation_state_code: "DE", entity_type: "CORP", is_unitary_member: true}
              as: TaxManager
              captures: {le_a_id: $.data.id}
            - call: "POST /salt/groups/${grp_id}/registrations"
              payload: {state_code: "CA", factor_formula: "DOUBLE_WEIGHTED_SALES", tax_rate: 0.0884, throwback_rule: "THROWBACK", service_sourcing_rule: "MARKET_BASED"}
              as: TaxManager
              captures: {reg_ca_id: $.data.id}
            - call: "POST /salt/registrations/${reg_ca_id}/vda-agreements"
              payload: {legal_entity_id: "${le_a_id}", anchor_tax_year: 2024, lookback_years: 3, exposure_variant: "LOOKBACK_LIMITED", estimated_exposure_tax: 210000.00}
              as: TaxManager
              captures: {v_id: $.data.id}
          trigger:
            - call: "POST /salt/vda-agreements/${v_id}/execute"
              payload: {negotiated_tax: 90000.00, negotiated_interest: 5000.00}
              as: TaxManager
              captures: {err_id: $.data.error_id}
          assert:
            - "the response is HTTP 409 with data.error_id == ERR_INVALID_VDA_STATE"
            - "VDAAgreement.${v_id}.status is still DRAFT and executed_on_date == null"
            - "StateRegistration.${reg_ca_id}.nexus_status is still NONE"

      - name: vda_execution_cascades_to_registration_and_group
        claim_type: side_effect_execution
        grounds:
          - state_machines.VDAAgreement.SUBMITTED_to_EXECUTED
          - state_machines.StateRegistration.REGISTRATION_REQUIRED_to_REGISTERED
          - entities.LegalEntity.fields.vda_shield_until
          - calculations.vda_exposure
        distinguishing_aspect: "Executing a disclosure sets nexus_status VOLUNTARY, moves registration_status REGISTRATION_REQUIRED -> REGISTERED, decrements the group's obligation counter to 0, returns compliance_posture to COMPLIANT and stamps LegalEntity.vda_shield_until at executed_on_date plus 24 months."
        test_recipe:
          setup:
            - "A group whose CA registration reached nexus ECONOMIC and registration_status REGISTRATION_REQUIRED through evaluate-nexus, leaving open_registration_obligations 1 and compliance_posture EXPOSED."
            - "A SUBMITTED FULL_EXPOSURE disclosure anchored at 2024 for the member entity."
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /salt/_clock/set_current_utc"
