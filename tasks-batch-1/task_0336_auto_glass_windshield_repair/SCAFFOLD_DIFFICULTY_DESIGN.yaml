              as: ServiceAdvisor
            - call: "POST /service-appointments/${appt_q}/check-in"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_q}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_q}/finish-install"
              payload: { temp_c: 25, humidity_pct: 40 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_q_v_fin: $.data.version }
          trigger:
            - call: "POST /recalibration-jobs"
              payload: { work_order_id: "${wo_q}", technician_id: "${tech_id}", service_bay_id: "${cbay_id}", calibration_type: "STATIC", start_at: "2026-06-13T09:50:00Z", end_at: "2026-06-13T10:20:00Z", expected_work_order_version: "${wo_q_v_fin}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second recalibration 09:50-10:20 fails 409 ERR_BAY_DOUBLE_BOOKED (gap 10 min < 15 min buffer from the 09:10-09:40 job)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_releases_reserved_glass_stock_conservation
        grounds:
          - state_machines.WorkOrder.OPEN_to_CANCELLED
          - state_machines.PartOrder.RESERVED_to_CANCELLED
          - entities.GlassPart.fields.on_hand_qty
          - entities.GlassPart.fields.reserved_qty
        distinguishing_aspect: |
          Conserved quantity: total glass units (GlassPart.on_hand_qty + reserved_qty).
          Reserving a part (on_hand 5->4, reserved 0->1) then cancelling the work order
          (RESERVED->CANCELLED, release_reserved_part) restores on_hand 4->5, reserved
          1->0; the sum stays 5 throughout. Distinct from the money-conservation sibling.
        test_recipe:
          setup:
            - "A REPLACE non-ADAS work order in ASSESSED with one RESERVED PartOrder against a GlassPart (on_hand 4, reserved 1, total 5)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Cons Conserve", email: "cons@x.com", phone: "555-0116", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "JHGCM82633A004371", make: "Honda", model: "Ridgeline", model_year: 2019, adas_equipped: false, glass_part_number: "FW04142" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /glass-parts"
              payload: { oem_part_number: "FW04142", description: "Ridgeline windshield", adas_compatible: false, unit_price_cents: 26000, on_hand_qty: 5 }
              as: ShopManager
              captures: { part_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/damage-assessments"
              payload: { chip_count: 0, longest_crack_mm: 300, in_driver_primary_view: true, edge_distance_mm: 5 }
              as: ServiceAdvisor
              captures: { asmt_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/accept-assessment"
              payload: { assessment_id: "${asmt_id}" }
              as: ServiceAdvisor
              captures: { wo_v2: $.data.version }
            - call: "POST /part-orders"
              payload: { work_order_id: "${wo_id}", glass_part_id: "${part_id}", quantity: 1, expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
              captures: { po_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: ServiceAdvisor
          assert:
            - "WorkOrder.${wo_id}.status == CANCELLED"
            - "PartOrder.${po_id}.status == CANCELLED"
            - "GlassPart.${part_id}.on_hand_qty == 5 and reserved_qty == 0 (sum conserved at 5)"

      - name: refund_money_conservation_amount_paid_invariant
        grounds:
          - calculations.refund_amount
          - state_machines.Payment
          - entities.WorkOrder.fields.amount_paid_cents
          - entities.Payment.fields.refunded_amount_cents
        distinguishing_aspect: |
          Conserved quantity: money on the work order, pinned as
          amount_paid_cents == sum(CAPTURED amount_cents) - sum(refunded_amount_cents).
          Capturing 9657 (paid->9657) then refunding it (REPAIR, no restock) returns
          amount_paid_cents to 0 while refunded_amount_cents == 9657; the invariant
          holds. Distinct conserved quantity (money) from the glass-units sibling.
        test_recipe:
          setup:
            - "A REPAIR work order in ASSESSED with total_charge_cents 9657, fully paid (amount_paid 9657)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Mona Money", email: "mona@x.com", phone: "555-0117", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "KHGCM82633A004372", make: "Honda", model: "Insight", model_year: 2020, adas_equipped: false, glass_part_number: "FW04143" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/damage-assessments"
              payload: { chip_count: 1, longest_crack_mm: 20, in_driver_primary_view: false, edge_distance_mm: 80 }
              as: ServiceAdvisor
              captures: { asmt_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/accept-assessment"
              payload: { assessment_id: "${asmt_id}" }
              as: ServiceAdvisor
            - call: "POST /payments"
              payload: { work_order_id: "${wo_id}", amount_cents: 9657, method: "CARD" }
              as: ServiceAdvisor
              captures: { pay_id: $.data.id }
          trigger:
            - call: "POST /payments/${pay_id}/refund"
              payload: {}
              as: ShopManager
              captures: { refunded: $.data.refunded_amount_cents }
          assert:
            - "Payment.${pay_id}.refunded_amount_cents == 9657 (REPAIR, no restock)"
            - "Payment.${pay_id}.status == REFUNDED"
            - "WorkOrder.${wo_id}.amount_paid_cents == 0 (9657 captured - 9657 refunded)"
