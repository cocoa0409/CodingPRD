          rationale: "The cyclic-shape claim (an entity loops back and the loop bound is respected) is exactly what §1.8 rule non_linear_state_machine instance a asserts: UNDER_REVIEW -> REVISION_REQUESTED -> SUBMITTED three times with revision_round 1, 2, 3 and recomputed betterment figures on every lap, then ERR_REVISION_LIMIT_EXCEEDED on the fourth."

      - name: corner_guarded_plan_approval_requires_all_permits_granted
        claim_type: Guarded Transitions
        grounds: ["validations[priority=17]", "state_machines.RelocationPlan"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / plan_approve_depends_on_every_permit_record_being_granted
          rationale: "The guarded-transition claim (UNDER_REVIEW -> APPROVED only when the sibling PermitRecord rows are all in state GRANTED) is asserted by §1.8 rule cross_entity_state_dependency instance b, including the all-quantified case with a mix of GRANTED and APPLIED permits and the at-least-one-exists case."

