      - name: empty_reconciliation_period_closes_with_zero_imported_lines
        grounds:
          - validations[priority=27]
          - state_machines.ReconciliationPeriod.IN_REVIEW_to_CLOSED
          - entities.ReconciliationPeriod.fields.imported_line_count
          - entities.ReconciliationPeriod.fields.open_exception_count
        distinguishing_aspect: |
          An EMPTY-COLLECTION boundary, not a numeric threshold, and reached
          through a third endpoint - POST /dmm/reconciliation-periods/{id}/status.
          The close rung tests open_exception_count == 0, so a period with zero
