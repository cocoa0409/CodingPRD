# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2564 — Student Records Transfer & Education Records Requests
#
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1-§1.7.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Logical clock starts at 2026-08-01T00:00:00Z in every chain unless a call moves it.
# Error assertions read the §1.7 error envelope: data.error_id.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: student_creation_mints_cumulative_file_and_four_components
        claim_type: creation
        grounds:
          - endpoints.POST_/records-office/students
          - entities.Student.fields.has_iep
          - entities.CumulativeFile.fields.required_component_types
          - entities.FileComponent.fields.is_required
        distinguishing_aspect: "One POST with has_iep true must return 201 and leave exactly one NOT_STARTED CumulativeFile with four required_component_types and four PENDING components all flagged is_required; a has_iep false student would have three required types."
        test_recipe:
          setup:
            - "CA state rule and district SEND01 exist; database otherwise empty."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
          trigger:
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Aiko", last_name: "Berenson", dob: "2012-04-04", grade_level: 8, has_iep: true, guardian_user_id: "guardian-aiko", student_user_id: "student-aiko" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
          assert:
            - "the trigger call returns HTTP 201"
            - "Student.${student_id}.enrollment_status == \"ENROLLED\""
            - "Student.${student_id}.has_iep == true"
            - "Student.${student_id}.is_eligible_student == false"
            - "Student.${student_id}.directory_optout_deadline_at == \"2026-08-15T00:00:00.000Z\""
            - "Student.${student_id}.directory_optout_effective == false"
            - "Student.${student_id}.exit_effective_date == null"
            - "Student.${student_id}.version == 1"
            - "GET /records-office/students/${student_id}/cumulative-files returns exactly 1 row"
            - "that CumulativeFile.assembly_status == \"NOT_STARTED\""
            - "that CumulativeFile.required_component_types == [\"ACADEMIC\", \"HEALTH\", \"DISCIPLINE\", \"SPECIAL_EDUCATION\"]"
            - "that CumulativeFile.certified_component_count == 0 and completeness_pct == 0.0"
            - "that CumulativeFile.total_page_count == 0"
            - "GET /records-office/cumulative-files/{that id}/components returns exactly 4 rows"
            - "every returned FileComponent.status == \"PENDING\" and is_required == true and page_count == 0"

      - name: state_rule_retrieval_by_natural_key
        claim_type: retrieval
        grounds:
          - endpoints.GET_/records-office/state-rules/{state_code}
          - entities.StateRecordsRule.fields.state_code
        distinguishing_aspect: "StateRecordsRule is addressed by its natural key state_code, not by a UUID, and the stored row must round-trip every configured field including the defaulted discipline_min_days_removed."
        test_recipe:
          setup:
            - "A TX rule is created with discipline_min_days_removed omitted so the default applies."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "TX", transfer_response_days: 30, discipline_inclusion_mode: "ALL_INCIDENTS", include_pending_investigations: true, sped_requires_consent: false, amendment_hearing_days: 45, destruction_min_age_years: 7, directory_optout_grace_days: 10, notification_wait_days: 3 }
              as: SystemAdmin
          trigger:
            - call: "GET /records-office/state-rules/TX"
              payload: {}
              as: RecordsOfficer
          assert:
            - "the trigger call returns HTTP 200 with response_type \"object\""
            - "data.state_code == \"TX\""
            - "data.transfer_response_days == 30"
            - "data.discipline_inclusion_mode == \"ALL_INCIDENTS\""
            - "data.discipline_min_days_removed == 10"
            - "data.include_pending_investigations == true"
            - "data.sped_requires_consent == false"
            - "data.destruction_min_age_years == 7"

      - name: students_list_filters_by_district_and_paginates
        claim_type: listing
        grounds:
          - endpoints.GET_/records-office/students
          - response_envelope.pagination_fields
          - entities.District.fields.district_code
        distinguishing_aspect: "Three students in SEND01 and one in SEND02: the district_id filter must exclude the SEND02 student, and limit 2 / offset 0 must report total_count 3 with has_more true while offset 2 returns the single remaining row with has_more false."
        test_recipe:
          setup:
            - "CA and TX rules exist; SEND01 (CA) holds three students and SEND02 (TX) holds one."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/state-rules"
              payload: { state_code: "TX", transfer_response_days: 30, discipline_inclusion_mode: "ALL_INCIDENTS", discipline_min_days_removed: 10, include_pending_investigations: true, sped_requires_consent: false, amendment_hearing_days: 45, destruction_min_age_years: 7, directory_optout_grace_days: 10, notification_wait_days: 3 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/districts"
              payload: { name: "Second Unified", district_code: "SEND02", state_code: "TX" }
              as: SystemAdmin
              captures: { other_district_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Bo", last_name: "Ling", dob: "2012-01-01", grade_level: 8, has_iep: false, guardian_user_id: "guardian-bo" }
              as: RecordsClerk
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Cai", last_name: "Ling", dob: "2011-01-01", grade_level: 9, has_iep: false, guardian_user_id: "guardian-cai" }
              as: RecordsClerk
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Dara", last_name: "Ling", dob: "2010-01-01", grade_level: 10, has_iep: true, guardian_user_id: "guardian-dara" }
              as: RecordsClerk
            - call: "POST /records-office/students"
              payload: { district_id: "${other_district_id}", first_name: "Eli", last_name: "Stone", dob: "2010-02-02", grade_level: 10, has_iep: false, guardian_user_id: "guardian-eli" }
              as: RecordsClerk
          trigger:
            - call: "GET /records-office/students?district_id=${send_district_id}&limit=2&offset=0"
              payload: {}
              as: RecordsOfficer
            - call: "GET /records-office/students?district_id=${send_district_id}&limit=2&offset=2"
              payload: {}
              as: RecordsOfficer
          assert:
            - "the first trigger call returns HTTP 200 with response_type \"array\" and exactly 2 rows"
            - "the first trigger call reports total_count == 3, limit == 2, offset == 0, has_more == true"
            - "the second trigger call returns exactly 1 row with total_count == 3, offset == 2, has_more == false"
            - "no returned row has district_id == \"${other_district_id}\""
            - "GET /records-office/students?has_iep=true returns exactly 1 row"

      - name: get_student_with_unknown_id_returns_4xx
        claim_type: not_found
        grounds:
          - validations.priority_10_path_entities_exist
          - errors.ERR_STUDENT_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown UUID on the student read must return ERR_STUDENT_NOT_FOUND / 404 in the error envelope, not an empty 200 object."
        test_recipe:
          setup:
            - "Database is empty apart from the CA rule and SEND01."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
          trigger:
            - call: "GET /records-office/students/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: RecordsOfficer
          assert:
            - "the trigger call returns HTTP 404"
            - "response_type == \"error\" and data.error_id == \"ERR_STUDENT_NOT_FOUND\""
            - "GET /records-office/state-rules/WY returns HTTP 404 with data.error_id == \"ERR_STATE_RULE_NOT_FOUND\""

      - name: student_missing_required_guardian_user_id_returns_4xx
        claim_type: required_fields
        grounds:
          - validations.priority_30_required_fields_present
          - endpoints.POST_/records-office/students
          - errors.ERR_VALIDATION
        distinguishing_aspect: "guardian_user_id is source: input with no default, so omitting it must produce ERR_VALIDATION / 400 and create neither the Student nor its CumulativeFile."
        test_recipe:
          setup:
            - "CA rule and SEND01 exist; no students yet."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
          trigger:
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Fern", last_name: "Okafor", dob: "2012-05-05", grade_level: 8 }
              as: RecordsClerk
          assert:
            - "the trigger call returns HTTP 400 with data.error_id == \"ERR_VALIDATION\""
            - "GET /records-office/students returns exactly 0 rows"

      - name: records_request_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - endpoints.POST_/records-office/records-requests
          - entities.RecordsRequest.fields.request_priority
          - entities.RecordsRequest.fields.includes_special_education
          - entities.RecordsRequest.fields.packet_status
        distinguishing_aspect: "Omitting request_priority, includes_special_education and sped_consent_on_file must yield STANDARD / false / false with packet_status NONE and packet_page_count null — not nulls and not the expedited window."
        test_recipe:
          setup:
            - "CA rule (10 response days) and TX rule; SEND01 in CA responds, RECV01 in TX requests; one student."
            - "Clock moved to 2026-08-03T00:00:00Z so the 10-business-day window lands on 2026-08-17."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/state-rules"
              payload: { state_code: "TX", transfer_response_days: 30, discipline_inclusion_mode: "ALL_INCIDENTS", discipline_min_days_removed: 10, include_pending_investigations: true, sped_requires_consent: false, amendment_hearing_days: 45, destruction_min_age_years: 7, directory_optout_grace_days: 10, notification_wait_days: 3 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/districts"
              payload: { name: "Receiving Unified", district_code: "RECV01", state_code: "TX" }
              as: SystemAdmin
              captures: { recv_district_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Gita", last_name: "Halim", dob: "2011-03-03", grade_level: 9, has_iep: false, guardian_user_id: "guardian-gita" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
            - call: "POST /records-office/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /records-office/records-requests"
              payload: { student_id: "${student_id}", requesting_district_id: "${recv_district_id}", responding_district_id: "${send_district_id}", authorization_reference: "ENR-2026-9001" }
              as: ReceivingRegistrar
              as_user_id: "${recv_district_id}"
              captures: { req_id: "$.data.id" }
          assert:
            - "the trigger call returns HTTP 201"
            - "RecordsRequest.${req_id}.request_priority == \"STANDARD\""
            - "RecordsRequest.${req_id}.includes_special_education == false"
            - "RecordsRequest.${req_id}.sped_consent_on_file == false"
            - "RecordsRequest.${req_id}.authorization_verified == false"
            - "RecordsRequest.${req_id}.status == \"RECEIVED\""
            - "RecordsRequest.${req_id}.packet_status == \"NONE\""
            - "RecordsRequest.${req_id}.packet_page_count == null"
            - "RecordsRequest.${req_id}.reopen_count == 0"
            - "RecordsRequest.${req_id}.is_overdue == false"
            - "RecordsRequest.${req_id}.statutory_days_allowed == 10"
            - "RecordsRequest.${req_id}.statutory_due_at == \"2026-08-17T23:59:59.999Z\""

      - name: student_computed_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Student.fields.enrollment_status
          - entities.Student.fields.is_eligible_student
          - entities.Student.fields.records_disposition_date
          - endpoints.POST_/records-office/students
        distinguishing_aspect: "enrollment_status, is_eligible_student and records_disposition_date are source: computed, so client-supplied values in the create body are ignored and the server-derived values (ENROLLED / true for a dob of exactly 18 years / null) stand."
        test_recipe:
          setup:
            - "CA rule and SEND01 exist; the clock is at its 2026-08-01T00:00:00Z default, so a dob of 2008-08-01 is exactly 18 today."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
          trigger:
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Hugo", last_name: "Petrov", dob: "2008-08-01", grade_level: 12, has_iep: false, guardian_user_id: "guardian-hugo", student_user_id: "student-hugo" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
          assert:
            - "the trigger call returns HTTP 201"
            - "Student.${student_id}.enrollment_status == \"ENROLLED\""
            - "Student.${student_id}.is_eligible_student == true"
            - "Student.${student_id}.records_disposition_date == null"
            - "Student.${student_id}.directory_optout_categories == []"
            - "Student.${student_id}.directory_optout_effective == false"

      - name: disclosure_log_entry_system_fields_generated
        claim_type: system_fields
        grounds:
          - entities.DisclosureLogEntry.fields.disclosed_at
          - entities.DisclosureLogEntry.fields.logged_by_user_id
          - entities.DisclosureLogEntry.fields.page_count
          - endpoints.POST_/records-office/students/{student_id}/directory-disclosures
        distinguishing_aspect: "disclosed_at, logged_by_user_id, disclosure_type, source_type, source_id and page_count are all system-sourced on a directory disclosure: disclosed_at must equal the logical clock and logged_by_user_id must equal the caller's X-User-ID, with page_count fixed at 0."
        test_recipe:
          setup:
            - "CA rule, SEND01 and one student exist; no opt-out has been filed, so disclosure is permitted."
            - "Clock moved to 2026-08-05T16:45:00Z before the disclosure."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Ines", last_name: "Duarte", dob: "2012-07-07", grade_level: 8, has_iep: false, guardian_user_id: "guardian-ines" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
            - call: "POST /records-office/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T16:45:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /records-office/students/${student_id}/directory-disclosures"
              payload: { recipient_name: "Alta County Sports League", disclosed_categories: ["NAME", "SPORTS_PARTICIPATION"], legitimate_interest_note: "Team roster publication" }
              as: RecordsClerk
              as_user_id: "clerk-7"
          assert:
            - "the trigger call returns HTTP 201"
            - "GET /records-office/students/${student_id}/disclosure-log returns exactly 1 row"
            - "that DisclosureLogEntry.disclosure_type == \"DIRECTORY_INFORMATION\""
            - "that DisclosureLogEntry.source_type == \"STUDENT_DIRECTORY\""
            - "that DisclosureLogEntry.source_id == \"${student_id}\""
            - "that DisclosureLogEntry.page_count == 0"
            - "that DisclosureLogEntry.disclosed_at == \"2026-08-05T16:45:00.000Z\""
            - "that DisclosureLogEntry.logged_by_user_id == \"clerk-7\""
            - "that DisclosureLogEntry.recipient_name == \"Alta County Sports League\""
            - "that DisclosureLogEntry.disclosed_categories == [\"NAME\", \"SPORTS_PARTICIPATION\"]"

      - name: discipline_incident_invalid_action_type_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_31_enum_membership
          - validations.priority_32_numeric_and_temporal_ranges
          - entities.DisciplineIncident.fields.action_type
          - errors.ERR_VALIDATION
        distinguishing_aspect: "action_type is a closed enum and days_removed is bounded to 0..365, so an out-of-set action_type and an over-range days_removed must each return ERR_VALIDATION / 400 while the in-set payload succeeds."
        test_recipe:
          setup:
            - "CA rule, SEND01 and one student exist."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Jae", last_name: "Moreau", dob: "2011-06-06", grade_level: 9, has_iep: false, guardian_user_id: "guardian-jae" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
          trigger:
            - call: "POST /records-office/students/${student_id}/discipline-incidents"
              payload: { incident_date: "2026-05-05", action_type: "SATURDAY_SCHOOL", days_removed: 1, incident_status: "SUSTAINED", description: "Not a declared action type" }
              as: RecordsClerk
            - call: "POST /records-office/students/${student_id}/discipline-incidents"
              payload: { incident_date: "2026-05-06", action_type: "SUSPENSION", days_removed: 400, incident_status: "SUSTAINED", description: "Over the 365 day ceiling" }
              as: RecordsClerk
          assert:
            - "both trigger calls return HTTP 400 with data.error_id == \"ERR_VALIDATION\""
            - "GET /records-office/students/${student_id}/discipline-incidents returns exactly 0 rows"

      - name: disclosure_log_entry_is_immutable_without_version
        claim_type: immutability
        grounds:
          - entities.DisclosureLogEntry
          - endpoints.GET_/records-office/students/{student_id}/disclosure-log
        distinguishing_aspect: "DisclosureLogEntry is declared common_fields: false, so its rows expose only id and created_at with no version and no update or delete endpoint anywhere in §1.5 — the audit log is append-only."
        test_recipe:
          setup:
            - "CA rule, SEND01 and one student exist; two directory disclosures are logged at two different instants."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Kofi", last_name: "Mensah", dob: "2012-02-02", grade_level: 8, has_iep: false, guardian_user_id: "guardian-kofi" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
            - call: "POST /records-office/students/${student_id}/directory-disclosures"
              payload: { recipient_name: "Yearbook Vendor", disclosed_categories: ["NAME"] }
              as: RecordsClerk
              as_user_id: "clerk-7"
            - call: "POST /records-office/_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T09:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "POST /records-office/students/${student_id}/directory-disclosures"
              payload: { recipient_name: "Class Ring Vendor", disclosed_categories: ["NAME", "HONORS"] }
              as: RecordsClerk
