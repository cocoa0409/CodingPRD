          - errors[ERR_ASSIGNMENT_STATE_FORBIDS_ACTION]
        distinguishing_aspect: "Chaperone is entity_backed: only X-User-ID == chaperone_id may respond; after DECLINED the assignment is terminal (second respond fails with ERR_ASSIGNMENT_STATE_FORBIDS_ACTION)."
