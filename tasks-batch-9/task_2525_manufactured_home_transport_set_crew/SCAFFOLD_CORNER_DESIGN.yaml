      - name: hauler_suspension_at_exactly_the_threshold_then_leg_state_mismatch
        claim_type: error_triggerable
        grounds:
          - errors[ERR_HAULER_SUSPENDED]
          - errors[ERR_LEG_PERMIT_MISMATCH]
          - validations[priority 14]
          - validations[priority 16]
          - calculations.party_chargeback_ledger
        distinguishing_aspect: |
          A single STAGE adjudication of 555556 cents haircuts to
          round_half_up(555556 x 0.90) = 500000, which lands EXACTLY on
          HAULER_SUSPENSION_THRESHOLD_CENTS; because the refresh is inclusive
          (>=), the hauler is SUSPENDED and cannot be given a new leg (422
          ERR_HAULER_SUSPENDED, priority 14). Reversing the claim recomputes the
          ledger to 0 and returns the hauler to ACTIVE, after which the same POST
          fails for a different reason - a TX leg filed under an AZ permit (422
          ERR_LEG_PERMIT_MISMATCH, priority 16) - proving the two 422s are
          distinguishable and that priority 14 masks priority 16 while both are
          violated.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one AZ plant, one ACTIVE hauler endorsed for AZ and TX, one licensed SetCrew"
            - "a one-section AZ order whose 168 x 150 in floor is measured and released"
            - "a REQUESTED AZ permit for that section with planned_leg_count 1 and no legs yet"
            - "a non-blocking claim of 555556 cents discovered IN_TRANSIT, reviewed and adjudicated on the STAGE basis so the hauler is charged exactly 500000"
