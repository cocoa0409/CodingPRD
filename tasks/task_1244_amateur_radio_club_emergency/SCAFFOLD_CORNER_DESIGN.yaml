  - section: cross_cutting_complexity_layers
    instances:
      - name: coordination_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[coordination-create-stale-repeater]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first coordination create bumps Repeater.version 1 -> 2, a second create carrying the stale expected_repeater_version is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["site agreement ACTIVE; repeater created (version 1); CR1 created with version 1 (repeater now version 2)"]
          setup_api_calls:
            - call: "POST /antenna-site-agreements"
              payload: { site_name: "Hilltop", owner_name: "County", lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-12-31T00:00:00Z" }
              as: ClubAdmin
              captures: { asa: $.data.id }
            - call: "POST /antenna-site-agreements/${asa}/set-status"
              payload: { to: "ACTIVE" }
              as: ClubAdmin
            - call: "POST /repeaters"
              payload: { callsign: "W1RPT", output_frequency_mhz: 146.94, site_agreement_id: "${asa}" }
              as: ClubAdmin
              captures: { rep: $.data.id, rep_ver: $.data.version }
            - call: "POST /coordination-requests"
              payload: { repeater_id: "${rep}", requested_frequency_mhz: 146.94, expected_repeater_version: "${rep_ver}" }
              as: ClubAdmin
              captures: { cr1: $.data.id }
          trigger:
            - call: "POST /coordination-requests"
              payload: { repeater_id: "${rep}", requested_frequency_mhz: 146.95, expected_repeater_version: "${rep_ver}" }
              as: ClubAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 412 with data.error_id == ERR_STALE_VERSION"
            - "CoordinationRequest.${cr1}.status == DRAFT"

      - name: activation_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[activation-create-stale-agreement]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a first activation create bumps ServedAgencyAgreement.version 2 -> 3, a second create carrying the version observed at activation (2) is rejected 412 ERR_STALE_VERSION; a retry with a fresh read succeeds and supersedes the first activation."
        test_recipe:
          setup: ["EC member; agreement created (version 1) then ACTIVATED (version 2); ACT1 created with version 2 (agreement now version 3)"]
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "W1EC", full_name: "EC One", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
              as: ClubAdmin
              captures: { ec: $.data.id }
            - call: "POST /served-agency-agreements"
              payload: { agency_name: "County OEM", max_operators: 10, effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-12-31T00:00:00Z" }
              as: ClubAdmin
              captures: { sag: $.data.id }
            - call: "POST /served-agency-agreements/${sag}/set-status"
              payload: { to: "ACTIVE" }
              as: ClubAdmin
              captures: { sag_ver2: $.data.version }
            - call: "POST /emergency-activations"
              payload: { agreement_id: "${sag}", title: "Flood", required_operators: 2, expected_served_agency_agreement_version: "${sag_ver2}" }
              as: EmergencyCoordinator
              as_user_id: "${ec}"
              captures: { act1: $.data.id }
          trigger:
            - call: "POST /emergency-activations"
              payload: { agreement_id: "${sag}", title: "Storm", required_operators: 3, expected_served_agency_agreement_version: "${sag_ver2}" }
              as: EmergencyCoordinator
              as_user_id: "${ec}"
              captures: { err: $.data.error_id }
            - call: "GET /served-agency-agreements/${sag}"
              payload: {}
              as: ClubAdmin
              captures: { sag_ver3: $.data.version }
            - call: "POST /emergency-activations"
              payload: { agreement_id: "${sag}", title: "Storm", required_operators: 3, expected_served_agency_agreement_version: "${sag_ver3}" }
              as: EmergencyCoordinator
              as_user_id: "${ec}"
              captures: { act2: $.data.id }
          assert:
            - "stale create: 412 ERR_STALE_VERSION"
            - "fresh create succeeds: EmergencyActivation.${act2}.status == STANDBY"
            - "EmergencyActivation.${act1}.status == CANCELLED"

      - name: version_increments_on_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Member]
        distinguishing_aspect: "Every mutation bumps version by exactly 1: create -> 1, renew -> 2, PATCH -> 3."
        test_recipe:
          setup: ["member created and renewed (version 2)"]
          setup_api_calls:
            - call: "POST /members"
              payload: { callsign: "K1OPR", full_name: "Operator", license_class: "EXTRA", license_expires_at: "2030-01-01T00:00:00Z" }
