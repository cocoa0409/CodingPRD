      - name: late_fee_rounds_per_line_before_summing
        grounds:
          - calculations.invoice_aging_and_late_fee
          - calculations.shipment_line_totals
          - entities.Shipment.fields.late_fee
          - entities.Shipment.fields.aging_bucket
          - state_machines.Shipment.deliver_shipment
        distinguishing_aspect: |
          Mode (b) — the pinned rounding order. Three ACTIVE lines of
          extended_price 43.60 at days_past_due 10 give late_fee 1.95 when each
          line is rounded before summing, and 1.96 when the extended prices are
          summed first, so the assertion falsifies the wrong order outright.
          This is a different combinatorial mode from the yield instance, which
          is mode (a).
        test_recipe:
          setup:
            - "A RELEASED 258-unit BOTTLE lot, released 2026-05-12."
