# =============================================================================
# SCAFFOLD.yaml — Donated Goods Processing, Production Standards & Mission
# Funding (Goodwill Industries member-org model)
# =============================================================================

scenario: |
  Donated Goods Processing, Production Standards & Mission Funding (Goodwill Industries): autonomous member organizations operating under a shared brand with territory assignments and licensing standards, donation intake through attended donation centers and store drop-off with donor receipt handling, sorting and production standards setting target rates for items processed per hour and price point assignment, salvage and recycling channels for unsold goods including textile bales, e-waste and outlet by-the-pound sales, retail store operations with rotation policies and color tag markdown cycles, mission services funded by retail margin including job training, placement and support programs, government workforce contracts operated alongside retail with separate compliance, unsalable material disposal costs and diversion targets

domain_name: donated-goods-processing
api_prefix: /donated-goods

# =============================================================================
# Complexity Profile (§0.3)
# =============================================================================
complexity_profile:
  primary_archetype: posture_driven_gating     # MemberOrg brand_license_status + diversion_compliant + margin_health gate all child operations
  secondary_archetype: ledger_reconciliation   # dual-variant unit costing (STANDARD vs ACTUAL) feeding one margin ledger
  complexity_layers:
    - optimistic_concurrency                   # OCC on MemberOrg.version for standard supersede and allocation create
    - cascading_side_effects                   # disposal -> disposed_lbs -> diversion_rate -> diversion_compliant gate (depth 3)
    - ops_run_checkpoint                       # weekly markdown-events advance the color-tag cycle and rotation pulls
    - version_pinning_on_approval              # items and runs pin the ProductionStandard used at pricing/opening; supersede never reprices
  entity_topology: flat                        # peer entities joined by foreign keys; no nested URL creation paths
  state_machine_shape: cyclic                  # MemberOrg ACTIVE<->SUSPENDED; WorkforceContract ACTIVE<->UNDER_REVIEW; DonatedItem ON_FLOOR self-loop via markdown
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties            # allocation creator cannot approve; contract creator cannot attest milestones
  consistency_model: immediate                 # every mutation visible in the same request's response

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities)
# =============================================================================
entities:
  - name: MemberOrg
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Member organization legal name" }
      - { name: brand_license_status, type: enum, source: system, description: "ACTIVE | SUSPENDED — licensing posture; gates all org-scoped writes", default: ACTIVE }
      - { name: costing_method, type: enum, source: input, description: "STANDARD | ACTUAL — selects unit_costing variant", default: STANDARD }
      - { name: reserve_floor_cents, type: integer, source: input, description: "Margin reserve floor; pool below this flips margin_health to LOW" }
      - { name: diversion_floor_bps, type: integer, source: input, description: "Minimum diversion rate in basis points (e.g. 7500 = 75%)" }
      - { name: retail_margin_pool_cents, type: integer, source: computed, description: "Accrued retail + salvage margin available to fund mission programs", default: 0 }
      - { name: reserved_cents, type: integer, source: computed, description: "Sum of APPROVED (not yet DISBURSED/CANCELLED) funding allocation amounts", default: 0 }
      - { name: margin_health, type: enum, source: computed, description: "HEALTHY | LOW — HEALTHY iff retail_margin_pool_cents >= reserve_floor_cents" }
      - { name: contract_revenue_cents, type: integer, source: computed, description: "Government workforce contract attested payouts; SEPARATE ledger from retail margin", default: 0 }
      - { name: total_diverted_lbs, type: number, source: computed, description: "Sum of weight sold through salvage channels", default: 0 }
      - { name: total_disposed_lbs, type: number, source: computed, description: "Sum of weight on disposal tickets", default: 0 }
      - { name: diversion_rate_bps, type: integer, source: computed, description: "floor(diverted*10000/(diverted+disposed)); 10000 when denominator is 0" }
      - { name: diversion_compliant, type: boolean, source: computed, description: "true iff diversion_rate_bps >= diversion_floor_bps; gates salvage lot creation", default: true }
      - { name: last_markdown_week, type: integer, source: system, description: "week_index of the most recent markdown event; null until first event", default: null }

  - name: Territory
    parent: null
    common_fields: false
    fields:
      - { name: member_org_id, type: string, source: input, description: "FK -> MemberOrg.id; org holding this territory assignment" }
      - { name: region_code, type: string, source: input, description: "Territory region identifier (e.g. PNW-NORTH)" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the assignment window (half-open lower bound)" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of the assignment window; null = open-ended", default: null }

  - name: DonationSite
    parent: null
    common_fields: false
    fields:
      - { name: member_org_id, type: string, source: input, description: "FK -> MemberOrg.id; org operating this site" }
      - { name: name, type: string, source: input, description: "Site display name" }
      - { name: site_type, type: enum, source: input, description: "ADC | STORE_DROP — attended donation center issues donor receipts automatically; store drop-off does not" }

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> DonationSite.id; intake site" }
      - { name: donor_name, type: string, source: input, description: "Donor full name" }
      - { name: donor_email, type: string, source: input, description: "Donor email (optional)", default: null }
      - { name: item_count_declared, type: integer, source: input, description: "Donor-declared item count; sort must match exactly" }
      - { name: status, type: enum, source: system, description: "RECEIVED | SORTED", default: RECEIVED }
      - { name: receipt_issued, type: boolean, source: system, description: "true iff site.site_type == ADC at creation (attended centers issue receipts)" }
      - { name: receipt_token, type: string, source: system, description: "Server-minted donor receipt token; null unless receipt_issued", default: null }
      - { name: receipt_fmv_total_cents, type: integer, source: computed, description: "Fair-market-value receipt total computed at sort via per-item rounding", default: null }
      - { name: sorted_at, type: datetime, source: system, description: "Logical-clock timestamp of sort completion; null until sorted", default: null }

  - name: DonatedItem
    parent: null
    common_fields: true
    fields:
      - { name: donation_id, type: string, source: system, description: "FK -> Donation.id; source donation" }
      - { name: category, type: enum, source: input, description: "TEXTILES | HOUSEWARES | MEDIA | FURNITURE | EWASTE" }
      - { name: condition_grade, type: enum, source: input, description: "A | B | C | UNSALABLE — graded at sort" }
      - { name: estimated_value_cents, type: integer, source: input, description: "Sorter-estimated fair market value before condition multiplier" }
      - { name: weight_lbs, type: number, source: input, description: "Item weight in pounds" }
      - { name: status, type: enum, source: system, description: "SORTED | ON_FLOOR | SOLD | SALVAGED — UNSALABLE grade is born SALVAGED", default: SORTED }
      - { name: price_cents, type: integer, source: system, description: "Base price assigned by the price-point map of the pinned standard", default: null }
      - { name: current_selling_price_cents, type: integer, source: system, description: "Markdown-adjusted live price", default: null }
      - { name: color_tag, type: enum, source: system, description: "BLUE | GREEN | YELLOW | RED — COLORS[floor_week mod 4] assigned at pricing", default: null }
      - { name: floor_week, type: integer, source: system, description: "week_index when the item was priced onto the floor", default: null }
      - { name: markdown_step, type: integer, source: system, description: "0..3 — markdown progression index", default: 0 }
      - { name: priced_standard_id, type: string, source: system, description: "FK -> ProductionStandard.id pinned at pricing; supersede never reprices", default: null }
      - { name: unit_cost_cents, type: integer, source: system, description: "Processing unit cost locked at pricing per org costing_method", default: null }
      - { name: salvage_lot_id, type: string, source: system, description: "FK -> SalvageLot.id; set when loaded into a lot, null otherwise", default: null }
      - { name: sold_at, type: datetime, source: system, description: "Logical-clock timestamp of retail sale; null until SOLD", default: null }

  - name: ProductionStandard
    parent: null
    common_fields: true
    fields:
      - { name: member_org_id, type: string, source: input, description: "FK -> MemberOrg.id; org owning this standard" }
      - { name: category, type: enum, source: input, description: "TEXTILES | HOUSEWARES | MEDIA | FURNITURE | EWASTE — one ACTIVE standard per (org, category)" }
      - { name: target_items_per_hour, type: integer, source: input, description: "Production target rate (items processed per labor hour)" }
      - { name: hourly_cost_cents, type: integer, source: input, description: "Loaded labor cost per hour used by STANDARD unit costing" }
      - { name: grade_price_map, type: object, source: input, description: "{\"A\": cents, \"B\": cents, \"C\": cents} — price-point assignment per condition grade" }
      - { name: price_floor_cents, type: integer, source: input, description: "Minimum assigned price (clamp lower bound)" }
      - { name: price_ceiling_cents, type: integer, source: input, description: "Maximum assigned price (clamp upper bound)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED — creating a new standard for the same (org, category) supersedes the prior", default: ACTIVE }

  - name: ProcessingRun
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> DonationSite.id; production site" }
      - { name: production_standard_id, type: string, source: input, description: "FK -> ProductionStandard.id pinned at open; must be ACTIVE and same-org as site" }
      - { name: category, type: enum, source: system, description: "Copied from the pinned standard at open" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED", default: OPEN }
      - { name: item_count_processed, type: integer, source: input, description: "Total items processed (set at close)" , default: null}
      - { name: unsalable_count, type: integer, source: input, description: "Items found unsalable during the run (set at close)", default: null }
      - { name: labor_minutes, type: integer, source: input, description: "Labor minutes consumed (set at close)", default: null }
      - { name: labor_cost_cents, type: integer, source: input, description: "Loaded labor cost for the run (set at close)", default: null }
      - { name: gross_rate_iph, type: number, source: computed, description: "GROSS variant: item_count_processed * 60 / labor_minutes", default: null }
      - { name: net_rate_iph, type: number, source: computed, description: "NET variant: (item_count_processed - unsalable_count) * 60 / labor_minutes", default: null }
      - { name: variance_bps, type: integer, source: computed, description: "round_half_up((net_rate_iph - target) * 10000 / target) vs pinned standard target", default: null }
      - { name: performance_flag, type: enum, source: computed, description: "MET | MISSED — MET iff net_rate_iph >= target_items_per_hour (inclusive)", default: null }

  - name: SalvageLot
    parent: null
    common_fields: true
    fields:
      - { name: member_org_id, type: string, source: input, description: "FK -> MemberOrg.id; org selling this lot" }
      - { name: channel, type: enum, source: input, description: "TEXTILE_BALE | EWASTE | OUTLET_BIN" }
      - { name: status, type: enum, source: system, description: "OPEN | SOLD", default: OPEN }
      - { name: total_weight_lbs, type: number, source: computed, description: "Sum of member item weights", default: 0 }
      - { name: item_count, type: integer, source: computed, description: "Number of member items", default: 0 }
      - { name: sale_revenue_cents, type: integer, source: system, description: "Channel-priced revenue computed at sell; null until SOLD", default: null }
      - { name: sold_at, type: datetime, source: system, description: "Logical-clock timestamp of sale; null until SOLD", default: null }

  - name: MissionProgram
    parent: null
    common_fields: true
    fields:
      - { name: member_org_id, type: string, source: input, description: "FK -> MemberOrg.id; org operating the program" }
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: program_type, type: enum, source: input, description: "JOB_TRAINING | PLACEMENT | SUPPORT" }
      - { name: start_date, type: datetime, source: input, description: "Funding window open (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Funding window close (inclusive)" }
      - { name: funding_goal_cents, type: integer, source: input, description: "Total funding target" }
      - { name: funding_disbursed_cents, type: integer, source: computed, description: "Sum of DISBURSED allocation amounts", default: 0 }

  - name: FundingAllocation
    parent: null
    common_fields: true
    fields:
      - { name: mission_program_id, type: string, source: input, description: "FK -> MissionProgram.id; funded program" }
      - { name: amount_cents, type: integer, source: input, description: "Allocation amount (>= 1)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the ProgramDirector creator (segregation anchor)" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving MemberCFO; null until approved", default: null }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DISBURSED | CANCELLED", default: PENDING }

  - name: WorkforceContract
    parent: null
    common_fields: true
    fields:
      - { name: member_org_id, type: string, source: input, description: "FK -> MemberOrg.id; operating org" }
      - { name: funding_agency, type: string, source: input, description: "Government agency; overlap-checked per (org, agency)" }
      - { name: start_date, type: datetime, source: input, description: "Performance window start (CLOSED interval, inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Performance window end (CLOSED interval, inclusive)" }
      - { name: contract_value_cents, type: integer, source: input, description: "Total contract value" }
      - { name: enrolled_headcount, type: integer, source: input, description: "Currently enrolled participants; gates milestone attestation" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the ContractManager creator (segregation anchor)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | UNDER_REVIEW | CLOSED — auto-CLOSED when all milestones terminal", default: ACTIVE }
      - { name: compliance_posture, type: enum, source: computed, description: "COMPLIANT | AT_RISK | BREACH — BREACH iff missed_count*4 > total_count; else AT_RISK iff missed_count >= 1", default: COMPLIANT }
      - { name: attested_payout_cents, type: integer, source: computed, description: "Sum of ATTESTED milestone payouts", default: 0 }
      - { name: missed_count, type: integer, source: computed, description: "Count of MISSED milestones", default: 0 }

  - name: ContractMilestone
    parent: null
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> WorkforceContract.id; owning contract (created inline with the contract)" }
      - { name: description, type: string, source: input, description: "Milestone description" }
      - { name: target_date, type: datetime, source: input, description: "Due date; swept to MISSED by a review CLOSE when target_date < now" }
      - { name: min_headcount, type: integer, source: input, description: "Minimum enrolled_headcount required to attest" }
      - { name: payout_cents, type: integer, source: input, description: "Payout credited to contract_revenue_cents on attestation" }
      - { name: status, type: enum, source: system, description: "PENDING | ATTESTED | MISSED", default: PENDING }
      - { name: attested_by_user_id, type: string, source: system, description: "X-User-ID of the attesting ComplianceOfficer; null until attested", default: null }

  - name: DisposalTicket
    parent: null
    common_fields: false
    fields:
      - { name: member_org_id, type: string, source: input, description: "FK -> MemberOrg.id; org paying for disposal" }
      - { name: material, type: enum, source: input, description: "MIXED_UNSALABLE | HAZARD | FURNITURE" }
      - { name: weight_lbs, type: number, source: input, description: "Disposed weight in pounds" }
      - { name: cost_cents, type: integer, source: computed, description: "round_half_up(weight_lbs * DISPOSAL_RATE_CENTS_PER_LB[material])" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: MemberOrg
    field: brand_license_status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /donated-goods/member-orgs/{id}/suspend"
        actor: BrandRegulator
        preconditions:
          - "org.brand_license_status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "All PENDING FundingAllocations of this org's MissionPrograms are set to CANCELLED (cascade down; APPROVED allocations keep their reservation)"
          - "increments MemberOrg.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /donated-goods/member-orgs/{id}/reinstate"
        actor: BrandRegulator
        preconditions:
          - "org.brand_license_status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "Org-scoped writes re-enabled (no financial fields change)"
          - "increments MemberOrg.version by 1"

  - entity: Donation
    field: status
    initial_state: RECEIVED
    terminal_states: [SORTED]
    transitions:
      - from: RECEIVED
        to: SORTED
        trigger: "POST /donated-goods/donations/{id}/sort"
        actor: DonationAttendant
        preconditions:
          - "donation.status == RECEIVED (ERR_INVALID_STATE)"
          - "org of donation.site_id is ACTIVE (ERR_ORG_SUSPENDED)"
          - "len(items) == donation.item_count_declared (ERR_ITEM_COUNT_MISMATCH)"
        side_effects:
          - "One DonatedItem created per items[] entry; grade UNSALABLE -> status SALVAGED, else SORTED"
          - "receipt_fmv_total_cents computed via receipt_fmv_total (per-item rounding, then summed)"
          - "sorted_at set to the logical clock"

  - entity: DonatedItem
    field: status
    initial_state: SORTED
    terminal_states: [SOLD, SALVAGED]
    transitions:
      - from: SORTED
        to: ON_FLOOR
        trigger: "POST /donated-goods/donated-items/{id}/price"
        actor: StoreAssociate
        preconditions:
          - "item.status == SORTED (ERR_INVALID_STATE)"
          - "org is ACTIVE (ERR_ORG_SUSPENDED)"
          - "an ACTIVE ProductionStandard exists for (item org, item.category) (ERR_NO_ELIGIBLE_STANDARD)"
        side_effects:
          - "price_cents = max(price_floor, min(price_ceiling, grade_price_map[condition_grade])) of the ACTIVE standard"
          - "priced_standard_id pinned to that standard (version pinning)"
          - "unit_cost_cents computed per unit_costing (STANDARD or ACTUAL variant) and locked"
          - "floor_week = week_index(now); color_tag = COLORS[floor_week mod 4]; markdown_step = 0"
          - "current_selling_price_cents = price_cents"
      - from: ON_FLOOR
        to: SOLD
        trigger: "POST /donated-goods/donated-items/{id}/sell"
        actor: StoreAssociate
        preconditions:
          - "item.status == ON_FLOOR (ERR_INVALID_STATE)"
          - "org is ACTIVE (ERR_ORG_SUSPENDED)"
        side_effects:
          - "margin = current_selling_price_cents - unit_cost_cents; org.retail_margin_pool_cents += margin (margin_accrual)"
          - "org.margin_health recomputed (margin_health)"
          - "sold_at set to the logical clock"
          - "increments MemberOrg.version by 1 (pool mutation)"
      - from: ON_FLOOR
        to: ON_FLOOR
        trigger: "system (POST /donated-goods/member-orgs/{id}/markdown-events with age >= 1 week)"
        actor: system
        preconditions:
          - "item.status == ON_FLOOR"
          - "week_index(now) - item.floor_week >= 1 and < 4"
        side_effects:
          - "markdown_step = min(markdown_step + 1, 3)"
          - "current_selling_price_cents recomputed via markdown_pricing (round_half_up of price_cents * (100 - MARKDOWN_PCT[step]) / 100)"
      - from: ON_FLOOR
        to: SALVAGED
        trigger: "system (POST /donated-goods/member-orgs/{id}/markdown-events with age >= 4 weeks)"
        actor: system
        preconditions:
          - "item.status == ON_FLOOR"
          - "week_index(now) - item.floor_week >= ROTATION_WEEKS (4, inclusive boundary)"
        side_effects:
          - "Item leaves the sales floor; eligible for salvage lots"
          - "markdown_step and current_selling_price_cents are frozen"

  - entity: ProductionStandard
    field: status
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (POST /donated-goods/production-standards for the same (member_org_id, category))"
        actor: system
        preconditions:
          - "a new standard for the same (org, category) passes OCC on MemberOrg.version"
        side_effects:
          - "Prior ACTIVE standard -> SUPERSEDED; new standard ACTIVE"
          - "Pinned items (priced_standard_id) and runs (production_standard_id) are NOT re-evaluated"

  - entity: ProcessingRun
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /donated-goods/processing-runs/{id}/close"
        actor: ProductionLead
        preconditions:
          - "run.status == OPEN (ERR_INVALID_STATE)"
          - "org is ACTIVE (ERR_ORG_SUSPENDED)"
        side_effects:
          - "gross_rate_iph and net_rate_iph computed (production_rate_dual: two variants, different results)"
          - "variance_bps and performance_flag computed vs the PINNED standard's target (supersede-safe)"

  - entity: SalvageLot
    field: status
    initial_state: OPEN
    terminal_states: [SOLD]
    transitions:
      - from: OPEN
        to: SOLD
        trigger: "POST /donated-goods/salvage-lots/{id}/sell"
        actor: MemberAdmin
        preconditions:
          - "lot.status == OPEN (ERR_INVALID_STATE)"
          - "org is ACTIVE (ERR_ORG_SUSPENDED)"
          - "channel TEXTILE_BALE requires total_weight_lbs >= 50 (ERR_BALE_UNDERWEIGHT, inclusive boundary)"
        side_effects:
          - "sale_revenue_cents computed via salvage_pricing (channel-branched; OUTLET_BIN is tiered)"
          - "org.total_diverted_lbs += total_weight_lbs -> diversion_rate_bps recomputed -> diversion_compliant recomputed (cascade)"
          - "org.retail_margin_pool_cents += sale_revenue_cents; margin_health recomputed"
          - "sold_at set to the logical clock"
          - "increments MemberOrg.version by 1"

  - entity: FundingAllocation
    field: status
    initial_state: PENDING
    terminal_states: [DISBURSED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /donated-goods/funding-allocations/{id}/approve"
        actor: MemberCFO
        preconditions:
          - "allocation.status == PENDING (ERR_INVALID_STATE)"
          - "org is ACTIVE (ERR_ORG_SUSPENDED)"
          - "X-User-ID != allocation.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "logical clock within [program.start_date, program.end_date] (ERR_PROGRAM_WINDOW_CLOSED)"
          - "amount_cents <= org.retail_margin_pool_cents - org.reserved_cents (ERR_INSUFFICIENT_MARGIN)"
        side_effects:
          - "org.reserved_cents += amount_cents"
          - "approved_by_user_id = X-User-ID"
          - "increments MemberOrg.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /donated-goods/funding-allocations/{id}/cancel"
        actor: ProgramDirector
        preconditions:
          - "allocation.status in {PENDING, APPROVED} (ERR_INVALID_STATE)"
          - "cancel is EXEMPT from the org-suspension gate (cleanup path)"
        side_effects:
          - "No reservation change (PENDING holds none)"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /donated-goods/funding-allocations/{id}/cancel"
        actor: MemberCFO
        preconditions:
          - "allocation.status in {PENDING, APPROVED} (ERR_INVALID_STATE)"
          - "cancel is EXEMPT from the org-suspension gate (cleanup path)"
        side_effects:
          - "org.reserved_cents -= amount_cents (compensating action: restores available margin)"
          - "increments MemberOrg.version by 1"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /donated-goods/funding-allocations/{id}/disburse"
        actor: MemberCFO
        preconditions:
          - "allocation.status == APPROVED (ERR_INVALID_STATE)"
          - "org is ACTIVE (ERR_ORG_SUSPENDED)"
        side_effects:
          - "org.reserved_cents -= amount_cents (link 1)"
          - "org.retail_margin_pool_cents -= amount_cents; this pool mutation itself triggers margin_health recomputation -> margin_health may cross to LOW, which gates future POST /funding-allocations with ERR_MARGIN_RESERVE_BREACH (link 2)"
          - "program.funding_disbursed_cents += amount_cents"
          - "increments MemberOrg.version by 1"

  - entity: WorkforceContract
    field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /donated-goods/workforce-contracts/{id}/reviews with action=OPEN"
        actor: ComplianceOfficer
        preconditions:
          - "contract.status == ACTIVE (ERR_INVALID_STATE)"
          - "org is ACTIVE (ERR_ORG_SUSPENDED)"
        side_effects:
          - "Milestone attestation is frozen while UNDER_REVIEW (cross-entity gate)"
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /donated-goods/workforce-contracts/{id}/reviews with action=CLOSE"
        actor: ComplianceOfficer
        preconditions:
          - "contract.status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "org is ACTIVE (ERR_ORG_SUSPENDED)"
        side_effects:
          - "Every PENDING milestone with target_date < now is set to MISSED (sweep); contract.missed_count recomputed"
          - "compliance_posture recomputed (compliance_posture rule)"
          - "If all milestones are terminal (ATTESTED or MISSED), contract auto-transitions to CLOSED (compound bubble-up)"
      - from: ACTIVE
        to: CLOSED
        trigger: "system (last PENDING milestone becomes terminal via attest)"
        actor: system
        preconditions:
          - "all milestones in {ATTESTED, MISSED}"
        side_effects:
          - "Contract locked; no further reviews or attestations"

  - entity: ContractMilestone
    field: status
    initial_state: PENDING
    terminal_states: [ATTESTED, MISSED]
    transitions:
      - from: PENDING
        to: ATTESTED
        trigger: "POST /donated-goods/milestones/{id}/attest"
        actor: ComplianceOfficer
        preconditions:
          - "milestone.status == PENDING (ERR_INVALID_STATE)"
          - "contract.status == ACTIVE — attestation frozen while UNDER_REVIEW or CLOSED (ERR_INVALID_STATE)"
          - "org is ACTIVE (ERR_ORG_SUSPENDED)"
          - "X-User-ID != contract.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "contract.enrolled_headcount >= milestone.min_headcount (ERR_HEADCOUNT_SHORTFALL)"
        side_effects:
          - "attested_by_user_id = X-User-ID"
          - "contract.attested_payout_cents += payout_cents (link 1)"
          - "org.contract_revenue_cents += payout_cents — SEPARATE ledger from retail margin (link 2)"
          - "contract auto-CLOSES if this was the last PENDING milestone"
      - from: PENDING
        to: MISSED
        trigger: "system (review CLOSE sweep when milestone.target_date < now)"
        actor: system
        preconditions:
          - "milestone.status == PENDING"
          - "milestone.target_date < current logical clock"
        side_effects:
          - "contract.missed_count += 1"
          - "compliance_posture recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: standard-create-stale-org
    parent_entity: MemberOrg
    write_endpoint: "POST /donated-goods/production-standards"
    occ_field: expected_member_org_version
    description: |
      Creating a ProductionStandard against a MemberOrg whose version has
      advanced since the client last observed it is rejected. Creating a
      standard legitimately supersedes the prior ACTIVE standard for the same
      (org, category) and bumps MemberOrg.version, so a second create carrying
      the previously observed version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: allocation-create-stale-org
    parent_entity: MemberOrg
    write_endpoint: "POST /donated-goods/funding-allocations"
    occ_field: expected_member_org_version
    description: |
      Creating a FundingAllocation against a MemberOrg whose version has
      advanced since the client last observed it is rejected. The allocation
      draws against the margin pool view encoded in the org version, and the
      create itself bumps MemberOrg.version, so a replay carrying the older
      version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: week_index_and_color
    trigger: "any logic needing the logical week (pricing color assignment, markdown events)"
    algorithm: chronological
    formula: |
      week_index = floor((current_utc - WEEK_EPOCH) / 7 days)   # WEEK_EPOCH is a Monday
      color_tag at pricing = COLORS[week_index mod 4]
    constants:
      WEEK_EPOCH: "2026-01-05T00:00:00Z"
      COLORS: [BLUE, GREEN, YELLOW, RED]
    input_set: "the logical clock (POST /donated-goods/_clock/set_current_utc); default 2026-09-01T00:00:00Z"
    precision: "integer week index; no rounding"

  - name: receipt_fmv_total
    trigger: "POST /donated-goods/donations/{id}/sort"
    algorithm: aggregation
    formula: |
      # PINNED ROUNDING ORDER (mode b): round EACH item first, then sum.
      # Sum-then-round is a plausible but FORBIDDEN variant and yields different cents.
      receipt_fmv_total_cents = SUM over items of round_half_up(estimated_value_cents * CONDITION_MULTIPLIER[condition_grade])
      e.g. items [A@100, B@101, C@99, UNSALABLE@500]:
        100 + round_half_up(75.75)=76 + round_half_up(49.50)=50 + 0 = 226   (sum-then-round would give 225)
    constants:
      CONDITION_MULTIPLIER: { A: 1.0, B: 0.75, C: 0.5, UNSALABLE: 0.0 }
    input_set: "all DonatedItems created by this sort call, regardless of grade (UNSALABLE contributes 0)"
    precision: "2 decimal places intermediate, round_half_up per item to integer cents"

  - name: production_rate_dual
    trigger: "POST /donated-goods/processing-runs/{id}/close"
    algorithm: aggregation
    formula: |
      target = pinned_standard.target_items_per_hour   # PINNED at run open; supersede does not re-target
      GROSS variant: gross_rate_iph = item_count_processed * 60 / labor_minutes
      NET variant:   net_rate_iph   = (item_count_processed - unsalable_count) * 60 / labor_minutes
      variance_bps = round_half_up((net_rate_iph - target) * 10000 / target)
      performance_flag = MET iff net_rate_iph >= target (INCLUSIVE boundary), else MISSED
    input_set: "the closing payload plus the run's pinned ProductionStandard"
    precision: "rates: 2 decimal places, round_half_up; variance_bps: integer, round_half_up (ties away from zero)"
    variants:
      - name: GROSS
        when: "staffing-credit view — counts every item touched, including unsalables"
        difference: "uses item_count_processed; a run with many unsalables scores higher GROSS than NET"
      - name: NET
        when: "standard-compliance view — only sellable output counts toward target"
        difference: "excludes unsalable_count; drives variance_bps and performance_flag"

  - name: unit_costing
    trigger: "POST /donated-goods/donated-items/{id}/price"
    algorithm: tiered_pricing
    formula: |
      price_cents = max(std.price_floor_cents, min(std.price_ceiling_cents, std.grade_price_map[condition_grade]))
      STANDARD variant: unit_cost_cents = round_half_up(std.hourly_cost_cents / std.target_items_per_hour)
      ACTUAL variant:   unit_cost_cents = round_half_up(SUM(labor_cost_cents) / SUM(item_count_processed))
                        over the org's CLOSED ProcessingRuns with category == item.category;
                        FALLBACK to the STANDARD variant when the org has no CLOSED runs in that category.
      Both price_cents and unit_cost_cents are LOCKED on the item at pricing time.
    input_set: "the ACTIVE ProductionStandard for (org, category); for ACTUAL, all CLOSED ProcessingRuns of the org with the item's category"
    precision: "integer cents, round_half_up"
    variants:
      - name: STANDARD
        when: "org.costing_method == STANDARD"
        difference: "cost from the standard's configured rate; identical inputs under ACTUAL generally differ"
      - name: ACTUAL
        when: "org.costing_method == ACTUAL"
        difference: "cost from realized run economics at pricing time; changes as more runs close"

  - name: margin_accrual
    trigger: "POST /donated-goods/donated-items/{id}/sell"
    algorithm: aggregation
    formula: |
      margin = current_selling_price_cents - unit_cost_cents
      org.retail_margin_pool_cents += margin
      recompute margin_health
    input_set: "the sold item and its org"
    precision: "integer cents"

  - name: markdown_pricing
    trigger: "POST /donated-goods/member-orgs/{id}/markdown-events"
    algorithm: decay_function
    formula: |
      w = week_index(now); reject if org.last_markdown_week == w (ERR_MARKDOWN_WEEK_ALREADY_RUN)
      for each ON_FLOOR item of the org (processing order: floor_week ASC, then created_at ASC):
        age = w - item.floor_week
        if age >= ROTATION_WEEKS:        # inclusive: age exactly 4 IS pulled
          item.status -> SALVAGED (rotation pull; step and price frozen)
        elif age >= 1:
          item.markdown_step = min(item.markdown_step + 1, 3)
          item.current_selling_price_cents = round_half_up(item.price_cents * (100 - MARKDOWN_PCT[item.markdown_step]) / 100)
        else: untouched (same-week pricing never marked down)
      one event applies AT MOST one step per item, even if the clock skipped weeks
      org.last_markdown_week = w
    constants:
      ROTATION_WEEKS: 4
      MARKDOWN_PCT: [0, 25, 50, 75]
    input_set: "all ON_FLOOR DonatedItems whose donation's site belongs to the org"
    precision: "integer cents, round_half_up per item per event"

  - name: salvage_pricing
    trigger: "POST /donated-goods/salvage-lots/{id}/sell"
    algorithm: tiered_pricing
    formula: |
      # Combinatorial (mode a): >= 3 inputs, channel-branched with nested min/max.
      if channel == TEXTILE_BALE:
        require total_weight_lbs >= MIN_BALE_LBS (ERR_BALE_UNDERWEIGHT)
        revenue = round_half_up(total_weight_lbs * TEXTILE_RATE)
      elif channel == EWASTE:
        revenue = item_count * EWASTE_FEE
      else:  # OUTLET_BIN tiered by the pound
        revenue = round_half_up(min(total_weight_lbs, OUTLET_T1_LBS) * OUTLET_R1
                                + max(0, total_weight_lbs - OUTLET_T1_LBS) * OUTLET_R2)
      e.g. OUTLET_BIN 150 lbs -> 100*45 + 50*30 = 6000; TEXTILE_BALE 300 lbs -> 3600; EWASTE 7 items -> 1050
      org.total_diverted_lbs += total_weight_lbs   # feeds diversion_rate (cascade)
      org.retail_margin_pool_cents += revenue      # salvage margin funds mission
    constants:
      TEXTILE_RATE: 12
      MIN_BALE_LBS: 50
      EWASTE_FEE: 150
      OUTLET_T1_LBS: 100
      OUTLET_R1: 45
      OUTLET_R2: 30
    input_set: "the lot's member items (SALVAGED DonatedItems with salvage_lot_id == lot.id)"
    precision: "integer cents, round_half_up"

  - name: diversion_rate
    trigger: "POST /donated-goods/disposal-tickets and salvage lot sell"
    algorithm: threshold
    formula: |
      if total_diverted_lbs + total_disposed_lbs == 0: diversion_rate_bps = 10000
      else: diversion_rate_bps = floor(total_diverted_lbs * 10000 / (total_diverted_lbs + total_disposed_lbs))
      diversion_compliant = (diversion_rate_bps >= diversion_floor_bps)   # INCLUSIVE boundary
      e.g. diverted 300, disposed 100 -> floor(3000000/400) = 7500 -> compliant at floor 7500
           +1 lb disposed            -> floor(3000000/401) = 7481 -> NOT compliant
    input_set: "the org's own totals only"
    precision: "integer basis points, floor"

  - name: margin_health
    trigger: "any change to retail_margin_pool_cents"
    algorithm: threshold
    formula: |
      margin_health = HEALTHY iff retail_margin_pool_cents >= reserve_floor_cents else LOW
      LOW gates POST /donated-goods/funding-allocations with ERR_MARGIN_RESERVE_BREACH
    input_set: "the org's own fields"
    precision: "integer cents comparison"

  - name: compliance_posture
    trigger: "milestone attested or review-close sweep"
    algorithm: threshold
    formula: |
      total = count of the contract's milestones in {PENDING, ATTESTED, MISSED}
      if missed_count == 0: COMPLIANT
      elif missed_count * 4 > total: BREACH      # STRICTLY greater than 25% (exactly 25% stays AT_RISK)
      else: AT_RISK
    input_set: "the contract's own milestones"
    precision: "integer counts"

  - name: disposal_cost
    trigger: "POST /donated-goods/disposal-tickets"
    algorithm: aggregation
    formula: |
      cost_cents = round_half_up(weight_lbs * DISPOSAL_RATE_CENTS_PER_LB[material])
      org.total_disposed_lbs += weight_lbs  -> diversion_rate recomputed -> diversion_compliant recomputed (cascade link 2-3)
    constants:
      DISPOSAL_RATE_CENTS_PER_LB: { MIXED_UNSALABLE: 9, HAZARD: 40, FURNITURE: 15 }
    input_set: "the created ticket and its org"
    precision: "integer cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: request, check: "Request body well-formed; all required fields present; enum members valid; integer/number fields positive where required (amount_cents >= 1, item_count_declared >= 0, weight_lbs >= 0, labor_minutes >= 1)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all endpoints" }
  - { priority: 2, category: auth, check: "X-User-Role and X-User-ID headers present; role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all endpoints" }
  - { priority: 3, category: auth, check: "Role permitted for this endpoint per RBAC matrix", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all endpoints" }
  - { priority: 4, category: auth, check: "Entity-backed ownership: DonationAttendant X-User-ID == donation.site_id (or == site_id on create); MemberAdmin X-User-ID == the MemberOrg.id being acted on (directly or via child entity)", error_id: ERR_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "org-scoped and site-scoped writes" }
  - { priority: 5, category: existence, check: "Path ids and body FK references exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 6, category: state, check: "OCC: expected_member_org_version == current MemberOrg.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /production-standards, POST /funding-allocations" }
  - { priority: 7, category: state, check: "MemberOrg.brand_license_status == ACTIVE for every org-scoped write (EXCEPT allocation cancel, which stays allowed as cleanup)", error_id: ERR_ORG_SUSPENDED, http_status: 409, applies_to: "org-scoped write endpoints" }
  - { priority: 8, category: state, check: "Target resource in a valid from-state for the transition (incl. donation RECEIVED, item SORTED/ON_FLOOR, run OPEN, lot OPEN, allocation PENDING/APPROVED, contract ACTIVE/UNDER_REVIEW, milestone PENDING, attestation requires contract ACTIVE)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 9, category: state, check: "markdown event for week w rejected if org.last_markdown_week == w", error_id: ERR_MARKDOWN_WEEK_ALREADY_RUN, http_status: 409, applies_to: "POST /member-orgs/{id}/markdown-events" }
  - { priority: 10, category: business_safety, check: "org.diversion_compliant == true before opening a salvage lot", error_id: ERR_DIVERSION_BREACH, http_status: 409, applies_to: "POST /salvage-lots" }
  - { priority: 11, category: business_safety, check: "segregation of duties: X-User-ID != created_by_user_id on approve / attest", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, applies_to: "POST /funding-allocations/{id}/approve, POST /milestones/{id}/attest" }
  - { priority: 12, category: business_referential, check: "pricing/run-open requires an ACTIVE same-org ProductionStandard for the category; lot items must be SALVAGED, same-org, channel-compatible category, and not already in a lot", error_id: ERR_NO_ELIGIBLE_STANDARD, http_status: 409, applies_to: "POST /donated-items/{id}/price, POST /processing-runs" }
  - { priority: 12, category: business_referential, check: "lot membership: item.status == SALVAGED and item.salvage_lot_id IS NULL", error_id: ERR_ITEM_ALREADY_IN_LOT, http_status: 409, applies_to: "POST /salvage-lots, POST /salvage-lots/{id}/add-items" }
  - { priority: 12, category: business_referential, check: "channel compatibility: TEXTILE_BALE accepts TEXTILES; EWASTE accepts EWASTE; OUTLET_BIN accepts TEXTILES, HOUSEWARES, MEDIA", error_id: ERR_ITEM_CHANNEL_MISMATCH, http_status: 409, applies_to: "POST /salvage-lots, POST /salvage-lots/{id}/add-items" }
  - { priority: 13, category: business_temporal, check: "territory half-open window [effective_from, effective_to) must not intersect another territory with the same region_code held by a DIFFERENT org; adjacency (a.effective_to == b.effective_from) is allowed; null effective_to is open-ended", error_id: ERR_TERRITORY_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /territories" }
  - { priority: 13, category: business_temporal, check: "contract CLOSED window [start_date, end_date] must not intersect another contract of the same (member_org_id, funding_agency); touching endpoints (a.end_date == b.start_date) DO overlap", error_id: ERR_CONTRACT_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /workforce-contracts" }
  - { priority: 13, category: business_temporal, check: "allocation create/approve requires the logical clock within [program.start_date, program.end_date] inclusive", error_id: ERR_PROGRAM_WINDOW_CLOSED, http_status: 409, applies_to: "POST /funding-allocations, POST /funding-allocations/{id}/approve" }
  - { priority: 14, category: business_constraint, check: "len(items) == donation.item_count_declared at sort", error_id: ERR_ITEM_COUNT_MISMATCH, http_status: 409, applies_to: "POST /donations/{id}/sort" }
  - { priority: 14, category: business_constraint, check: "TEXTILE_BALE sale requires total_weight_lbs >= 50 (inclusive)", error_id: ERR_BALE_UNDERWEIGHT, http_status: 409, applies_to: "POST /salvage-lots/{id}/sell" }
  - { priority: 14, category: business_constraint, check: "attestation requires contract.enrolled_headcount >= milestone.min_headcount", error_id: ERR_HEADCOUNT_SHORTFALL, http_status: 409, applies_to: "POST /milestones/{id}/attest" }
  - { priority: 15, category: business_fiscal, check: "allocation approve requires amount_cents <= retail_margin_pool_cents - reserved_cents", error_id: ERR_INSUFFICIENT_MARGIN, http_status: 402, applies_to: "POST /funding-allocations/{id}/approve" }
  - { priority: 15, category: business_fiscal, check: "allocation create requires margin_health == HEALTHY", error_id: ERR_MARGIN_RESERVE_BREACH, http_status: 409, applies_to: "POST /funding-allocations" }

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table (44 endpoints)
# =============================================================================
endpoints:
  - { method: POST, path: "/donated-goods/_clock/set_current_utc", description: "Advance the logical clock (test-driving endpoint). Server starts at 2026-09-01T00:00:00Z and NEVER falls back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["all week_index / window logic re-evaluates against the new clock"] }
  - { method: POST, path: "/donated-goods/member-orgs", description: "Register a member organization", roles: [PlatformAdmin], code: 201, input: [name, "costing_method?", reserve_floor_cents, diversion_floor_bps], output: MemberOrg, side_effects: ["status ACTIVE, ledgers zeroed, margin_health HEALTHY, diversion_compliant true"] }
  - { method: GET, path: "/donated-goods/member-orgs/{id}", description: "Read one member org incl. computed ledgers", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: [], output: MemberOrg, side_effects: [] }
  - { method: POST, path: "/donated-goods/member-orgs/{id}/suspend", description: "Suspend the brand license; cancels PENDING allocations", roles: [BrandRegulator], code: 200, input: [], output: MemberOrg, side_effects: ["PENDING FundingAllocations of org programs -> CANCELLED", "increments MemberOrg.version by 1"] }
  - { method: POST, path: "/donated-goods/member-orgs/{id}/reinstate", description: "Reinstate a suspended license", roles: [BrandRegulator], code: 200, input: [], output: MemberOrg, side_effects: ["brand_license_status -> ACTIVE", "increments MemberOrg.version by 1"] }
  - { method: POST, path: "/donated-goods/territories", description: "Assign a territory window to an org (half-open overlap check)", roles: [BrandRegulator], code: 201, input: [member_org_id, region_code, effective_from, "effective_to?"], output: Territory, side_effects: [] }
  - { method: GET, path: "/donated-goods/member-orgs/{id}/territories", description: "List territories held by an org", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: ["limit?", "offset?", ], output: "Territory[]", side_effects: [] }
  - { method: POST, path: "/donated-goods/donation-sites", description: "Register a donation site (ADC or STORE_DROP)", roles: [MemberAdmin], code: 201, input: [member_org_id, name, site_type], output: DonationSite, side_effects: [] }
  - { method: GET, path: "/donated-goods/member-orgs/{id}/donation-sites", description: "List sites of an org", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: ["limit?", "offset?", ], output: "DonationSite[]", side_effects: [] }
  - { method: POST, path: "/donated-goods/donations", description: "Record a donation intake at a site; ADC auto-issues the donor receipt", roles: [DonationAttendant], code: 201, input: [site_id, donor_name, "donor_email?", item_count_declared], output: Donation, side_effects: ["receipt_issued and receipt_token set iff site.site_type == ADC"] }
  - { method: GET, path: "/donated-goods/donations", description: "List donations (filters)", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "site_id?", "status?"], output: "Donation[]", side_effects: [] }
  - { method: GET, path: "/donated-goods/donations/{id}", description: "Read one donation", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: [], output: Donation, side_effects: [] }
  - { method: POST, path: "/donated-goods/donations/{id}/sort", description: "Bulk-create graded items from a received donation and total the receipt FMV", roles: [DonationAttendant], code: 200, input: [items], output: Donation, side_effects: ["items created (UNSALABLE -> SALVAGED, else SORTED)", "receipt_fmv_total_cents computed (per-item round, then sum)", "status -> SORTED"] }
  - { method: GET, path: "/donated-goods/donated-items", description: "List items (filters)", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "donation_id?", "salvage_lot_id?", "status?", "color_tag?", "priced_standard_id?"], output: "DonatedItem[]", side_effects: [] }
  - { method: GET, path: "/donated-goods/donated-items/{id}", description: "Read one item", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: [], output: DonatedItem, side_effects: [] }
  - { method: POST, path: "/donated-goods/donated-items/{id}/price", description: "Price-point assignment: pin the ACTIVE standard, set price/cost/color/floor week", roles: [StoreAssociate], code: 200, input: [], output: DonatedItem, side_effects: ["status -> ON_FLOOR", "price_cents / unit_cost_cents / color_tag / floor_week / markdown_step set"] }
  - { method: POST, path: "/donated-goods/donated-items/{id}/sell", description: "Sell an ON_FLOOR item at its current selling price", roles: [StoreAssociate], code: 200, input: [], output: DonatedItem, side_effects: ["status -> SOLD", "margin = current_selling_price_cents - unit_cost_cents added to org pool", "margin_health recomputed", "increments MemberOrg.version by 1"] }
  - { method: POST, path: "/donated-goods/production-standards", description: "Create a production standard (supersedes prior ACTIVE for same org+category; OCC on MemberOrg.version)", roles: [MemberAdmin], code: 201, input: [member_org_id, category, target_items_per_hour, hourly_cost_cents, grade_price_map, price_floor_cents, price_ceiling_cents, expected_member_org_version], output: ProductionStandard, side_effects: ["prior ACTIVE standard for (org, category) -> SUPERSEDED", "increments MemberOrg.version by 1"] }
  - { method: GET, path: "/donated-goods/member-orgs/{id}/production-standards", description: "List standards of an org", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "category?", "status?"], output: "ProductionStandard[]", side_effects: [] }
  - { method: POST, path: "/donated-goods/processing-runs", description: "Open a production run pinned to an ACTIVE same-org standard", roles: [ProductionLead], code: 201, input: [site_id, production_standard_id], output: ProcessingRun, side_effects: ["category copied from standard"] }
  - { method: GET, path: "/donated-goods/processing-runs", description: "List runs (filters)", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "site_id?", "status?", "production_standard_id?"], output: "ProcessingRun[]", side_effects: [] }
  - { method: GET, path: "/donated-goods/processing-runs/{id}", description: "Read one run", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: [], output: ProcessingRun, side_effects: [] }
  - { method: POST, path: "/donated-goods/processing-runs/{id}/close", description: "Close a run and compute dual production rates vs the pinned target", roles: [ProductionLead], code: 200, input: [item_count_processed, unsalable_count, labor_minutes, labor_cost_cents], output: ProcessingRun, side_effects: ["gross_rate_iph / net_rate_iph / variance_bps / performance_flag computed"] }
  - { method: POST, path: "/donated-goods/member-orgs/{id}/markdown-events", description: "Ops-run checkpoint: apply one markdown step and rotation pulls for the current week", roles: [MemberAdmin], code: 200, input: [], output: "{ applied_week: integer, marked_down_count: integer, pulled_count: integer }", side_effects: ["eligible ON_FLOOR items step++ or -> SALVAGED", "last_markdown_week set", "increments MemberOrg.version by 1"] }
  - { method: POST, path: "/donated-goods/salvage-lots", description: "Open a salvage lot with an initial item load (gated by diversion_compliant)", roles: [MemberAdmin], code: 201, input: [member_org_id, channel, item_ids], output: SalvageLot, side_effects: ["items linked (salvage_lot_id set)", "total_weight_lbs / item_count computed"] }
  - { method: GET, path: "/donated-goods/member-orgs/{id}/salvage-lots", description: "List lots of an org", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "channel?", "status?"], output: "SalvageLot[]", side_effects: [] }
  - { method: POST, path: "/donated-goods/salvage-lots/{id}/add-items", description: "Load additional SALVAGED items into an OPEN lot", roles: [MemberAdmin], code: 200, input: [item_ids], output: SalvageLot, side_effects: ["items linked", "total_weight_lbs / item_count recomputed"] }
  - { method: POST, path: "/donated-goods/salvage-lots/{id}/sell", description: "Sell the lot through its channel; revenue to margin pool, weight to diversion", roles: [MemberAdmin], code: 200, input: [], output: SalvageLot, side_effects: ["status -> SOLD", "sale_revenue_cents computed", "org pool += revenue; diverted += weight; diversion + health recomputed", "increments MemberOrg.version by 1"] }
  - { method: POST, path: "/donated-goods/mission-programs", description: "Register a mission program with a funding window", roles: [ProgramDirector], code: 201, input: [member_org_id, name, program_type, start_date, end_date, funding_goal_cents], output: MissionProgram, side_effects: [] }
  - { method: GET, path: "/donated-goods/member-orgs/{id}/mission-programs", description: "List programs of an org", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "program_type?"], output: "MissionProgram[]", side_effects: [] }
  - { method: POST, path: "/donated-goods/funding-allocations", description: "Create an allocation against a program (OCC on MemberOrg.version; margin_health gate)", roles: [ProgramDirector], code: 201, input: [mission_program_id, amount_cents, expected_member_org_version], output: FundingAllocation, side_effects: ["status PENDING", "created_by_user_id = X-User-ID", "increments MemberOrg.version by 1"] }
  - { method: GET, path: "/donated-goods/funding-allocations", description: "List allocations (filters)", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "mission_program_id?", "status?"], output: "FundingAllocation[]", side_effects: [] }
  - { method: GET, path: "/donated-goods/funding-allocations/{id}", description: "Read one allocation", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: [], output: FundingAllocation, side_effects: [] }
  - { method: POST, path: "/donated-goods/funding-allocations/{id}/approve", description: "CFO approval; reserves margin (segregated from creator)", roles: [MemberCFO], code: 200, input: [], output: FundingAllocation, side_effects: ["org.reserved_cents += amount_cents", "increments MemberOrg.version by 1"] }
  - { method: POST, path: "/donated-goods/funding-allocations/{id}/cancel", description: "Cancel PENDING/APPROVED; releases any reservation (exempt from suspension gate)", roles: [ProgramDirector, MemberCFO], code: 200, input: [], output: FundingAllocation, side_effects: ["APPROVED -> org.reserved_cents -= amount_cents", "increments MemberOrg.version by 1 when a reservation is released"] }
  - { method: POST, path: "/donated-goods/funding-allocations/{id}/disburse", description: "Disburse approved funds: debit pool, release reservation, credit program", roles: [MemberCFO], code: 200, input: [], output: FundingAllocation, side_effects: ["pool -= amount; reserved -= amount; program.funding_disbursed_cents += amount", "margin_health recomputed (cascade link 2)", "increments MemberOrg.version by 1"] }
  - { method: POST, path: "/donated-goods/workforce-contracts", description: "Create a government workforce contract with inline milestones (closed-window overlap check)", roles: [ContractManager], code: 201, input: [member_org_id, funding_agency, start_date, end_date, contract_value_cents, enrolled_headcount, milestones], output: WorkforceContract, side_effects: ["milestones created PENDING", "created_by_user_id = X-User-ID", "posture COMPLIANT"] }
  - { method: GET, path: "/donated-goods/member-orgs/{id}/workforce-contracts", description: "List contracts of an org", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "funding_agency?", "status?"], output: "WorkforceContract[]", side_effects: [] }
  - { method: POST, path: "/donated-goods/workforce-contracts/{id}/reviews", description: "Compliance review cycle: action OPEN freezes attestation; CLOSE sweeps overdue milestones to MISSED", roles: [ComplianceOfficer], code: 200, input: [action], output: WorkforceContract, side_effects: ["OPEN: ACTIVE -> UNDER_REVIEW", "CLOSE: UNDER_REVIEW -> ACTIVE; overdue PENDING -> MISSED; posture recomputed; auto-CLOSE if all terminal"] }
  - { method: GET, path: "/donated-goods/milestones", description: "List milestones (filters)", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "contract_id?", "status?"], output: "ContractMilestone[]", side_effects: [] }
  - { method: GET, path: "/donated-goods/milestones/{id}", description: "Read one milestone", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: [], output: ContractMilestone, side_effects: [] }
  - { method: POST, path: "/donated-goods/milestones/{id}/attest", description: "Attest a milestone outcome; credits the SEPARATE contract revenue ledger", roles: [ComplianceOfficer], code: 200, input: [], output: ContractMilestone, side_effects: ["status -> ATTESTED", "contract.attested_payout_cents += payout", "org.contract_revenue_cents += payout", "contract auto-CLOSES if no PENDING milestones remain"] }
  - { method: POST, path: "/donated-goods/disposal-tickets", description: "Record unsalable disposal; cost computed; disposed weight cascades into diversion rate", roles: [MemberAdmin], code: 201, input: [member_org_id, material, weight_lbs], output: DisposalTicket, side_effects: ["cost_cents computed", "org.total_disposed_lbs += weight_lbs", "diversion_rate_bps and diversion_compliant recomputed (cascade)", "increments MemberOrg.version by 1"] }
  - { method: GET, path: "/donated-goods/member-orgs/{id}/disposal-tickets", description: "List disposal tickets of an org", roles: [PlatformAdmin, BrandRegulator, MemberAdmin, DonationAttendant, StoreAssociate, ProductionLead, ProgramDirector, MemberCFO, ContractManager, ComplianceOfficer], code: 200, input: ["limit?", "offset?", "material?"], output: "DisposalTicket[]", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog (22 codes)
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum member, or non-positive numeric input" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed identity mismatch (attendant vs site, MemberAdmin vs org)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_member_org_version != current MemberOrg.version (OCC)" }
  - { id: ERR_ORG_SUSPENDED, http: 409, condition: "MemberOrg brand_license_status != ACTIVE for an org-scoped write" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_MARKDOWN_WEEK_ALREADY_RUN, http: 409, condition: "A markdown event already ran for this org in the current week" }
  - { id: ERR_DIVERSION_BREACH, http: 409, condition: "diversion_compliant == false blocks new salvage lots" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Creator of the allocation/contract attempted the approval/attestation step" }
  - { id: ERR_NO_ELIGIBLE_STANDARD, http: 409, condition: "No ACTIVE ProductionStandard for the (org, category), or the pinned standard is SUPERSEDED/foreign" }
  - { id: ERR_ITEM_ALREADY_IN_LOT, http: 409, condition: "Item not SALVAGED or already linked to a lot" }
  - { id: ERR_ITEM_CHANNEL_MISMATCH, http: 409, condition: "Item category not accepted by the lot's channel" }
  - { id: ERR_TERRITORY_WINDOW_OVERLAP, http: 409, condition: "Half-open territory window intersects another org's territory for the same region_code" }
  - { id: ERR_CONTRACT_WINDOW_OVERLAP, http: 409, condition: "Closed contract window intersects another contract of the same org and agency" }
  - { id: ERR_PROGRAM_WINDOW_CLOSED, http: 409, condition: "Clock outside [program.start_date, program.end_date] on allocation create/approve" }
  - { id: ERR_ITEM_COUNT_MISMATCH, http: 409, condition: "len(items) != donation.item_count_declared at sort" }
  - { id: ERR_BALE_UNDERWEIGHT, http: 409, condition: "TEXTILE_BALE lot below 50 lbs at sale" }
  - { id: ERR_HEADCOUNT_SHORTFALL, http: 409, condition: "contract.enrolled_headcount < milestone.min_headcount at attestation" }
  - { id: ERR_INSUFFICIENT_MARGIN, http: 402, condition: "Approve would exceed pool minus reserved" }
  - { id: ERR_MARGIN_RESERVE_BREACH, http: 409, condition: "margin_health == LOW blocks allocation creation" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns the logical clock and member-org registration"
    identity: opaque
    exclusive_operations: ["POST /donated-goods/_clock/set_current_utc", "POST /donated-goods/member-orgs"]
    shared_operations: ["all GET endpoints"]
  - name: BrandRegulator
    description: "Shared-brand licensing authority; manages license posture and territory assignments"
    identity: opaque
    exclusive_operations: ["POST /donated-goods/member-orgs/{id}/suspend", "POST /donated-goods/member-orgs/{id}/reinstate", "POST /donated-goods/territories"]
    shared_operations: ["all GET endpoints"]
  - name: MemberAdmin
    description: "Administrator of one member org; X-User-ID equals the MemberOrg.id"
    identity: "entity_backed:MemberOrg"
    exclusive_operations: ["POST /donated-goods/donation-sites", "POST /donated-goods/production-standards", "POST /donated-goods/member-orgs/{id}/markdown-events", "POST /donated-goods/salvage-lots", "POST /donated-goods/salvage-lots/{id}/add-items", "POST /donated-goods/salvage-lots/{id}/sell", "POST /donated-goods/disposal-tickets"]
    shared_operations: ["all GET endpoints"]
  - name: DonationAttendant
    description: "Intake worker bound to one donation site; X-User-ID equals the DonationSite.id"
    identity: "entity_backed:DonationSite"
    exclusive_operations: ["POST /donated-goods/donations", "POST /donated-goods/donations/{id}/sort"]
    shared_operations: ["all GET endpoints"]
  - name: StoreAssociate
    description: "Retail floor worker; prices and sells items"
    identity: opaque
    exclusive_operations: ["POST /donated-goods/donated-items/{id}/price", "POST /donated-goods/donated-items/{id}/sell"]
    shared_operations: ["all GET endpoints"]
  - name: ProductionLead
    description: "Back-room production supervisor; opens and closes processing runs"
    identity: opaque
    exclusive_operations: ["POST /donated-goods/processing-runs", "POST /donated-goods/processing-runs/{id}/close"]
    shared_operations: ["all GET endpoints"]
  - name: ProgramDirector
    description: "Mission services director; creates programs and requests funding allocations"
    identity: opaque
    exclusive_operations: ["POST /donated-goods/mission-programs", "POST /donated-goods/funding-allocations"]
    shared_operations: ["POST /donated-goods/funding-allocations/{id}/cancel", "all GET endpoints"]
  - name: MemberCFO
    description: "Member-org finance officer; approves and disburses allocations (segregated from the creator)"
    identity: opaque
    exclusive_operations: ["POST /donated-goods/funding-allocations/{id}/approve", "POST /donated-goods/funding-allocations/{id}/disburse"]
    shared_operations: ["POST /donated-goods/funding-allocations/{id}/cancel", "all GET endpoints"]
  - name: ContractManager
    description: "Workforce contract operator; creates contracts with their milestones"
    identity: opaque
    exclusive_operations: ["POST /donated-goods/workforce-contracts"]
    shared_operations: ["all GET endpoints"]
  - name: ComplianceOfficer
    description: "Independent compliance role; runs review cycles and attests milestones (segregated from the contract creator)"
    identity: opaque
    exclusive_operations: ["POST /donated-goods/workforce-contracts/{id}/reviews", "POST /donated-goods/milestones/{id}/attest"]
    shared_operations: ["all GET endpoints"]
