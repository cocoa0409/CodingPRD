  - rule_id: compensating_invariant
    instances:

      - name: unstaffing_restores_the_providers_exact_pre_staffing_minute_and_travel_figures
        grounds:
          - calculations.provider_assigned_weekly_minutes
          - calculations.provider_service_capacity_posture
          - state_machines.ServiceLine.STAFFED_to_UNSTAFFED
          - endpoints[POST /child-find/service-lines/{id}/unstaff]
        distinguishing_aspect: |
          Unstaffing is an exact inverse: because travel overhead is a tiered
          function of direct minutes plus a per-extra-site charge, removing the
          second line has to undo BOTH terms - 320 assigned minutes (290 direct,
          30 overhead, two sites, NEAR_CAPACITY) must fall back to exactly 160
          (150 direct, 10 overhead, one site, OPEN) and not to 320 minus the
          line's own 140, while the plan's assigned_weekly_minutes stays 290
          because UNSTAFFED lines still count toward the plan total. Re-staffing
          reproduces 320 exactly, so the round trip leaves no drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two ACTIVE sites S1 and S2; one SLP provider with max_weekly_service_minutes 400."
            - "An ELIGIBLE DRAFT plan at S1 with two SLP DIRECT lines of 150 and 140 weekly minutes, both STAFFED to that provider - the 150 at S1 and the 140 at S2."
            - "The provider therefore stands at 290 direct minutes, tier-1 overhead 15 (5 percent of 290, rounded up to the 5-minute increment) plus 15 for the one extra site, i.e. 320 assigned minutes."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /child-find/community-sites"
