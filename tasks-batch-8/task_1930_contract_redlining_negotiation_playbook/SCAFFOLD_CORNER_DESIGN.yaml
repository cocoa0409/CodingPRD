scaffold_corner_design:
  # ===========================================================================
  # Section: entities — creation, retrieval, defaults, required fields
  # ===========================================================================
  - section: entities
    instances:
      - name: playbook_creation_returns_201_with_defaults
        claim_type: creation
        grounds:
          - entities.Playbook
        distinguishing_aspect: "POST /playbooks with valid name returns 201 with status=DRAFT, clause_count=0, active_negotiation_count=0, published_at=null, version=1."
        test_recipe:
          setup: ["ChiefCounsel user exists"]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "cc_c1@x.com", display_name: "CC", primary_role: "CHIEF_COUNSEL" }
              as: OpsAdmin
              captures: { cc_id: $.data.id }
          trigger:
            - call: "POST /playbooks"
              payload: { name: "Fresh" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { pb_id: $.data.id, pb_status: $.data.status, pb_cc: $.data.clause_count, pb_v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "pb_status == DRAFT"
            - "pb_cc == 0"
            - "pb_v == 1"
            - "Playbook.${pb_id}.published_at == null"

      - name: clause_template_fallback_positions_default_applied
        claim_type: defaults
        grounds:
          - entities.ClauseTemplate.fields.fallback_positions
        distinguishing_aspect: "When fallback_positions is omitted (would need to be optional) — in current scaffold it's required, so test that supplying empty array yields severity STANDARD for any non-deviated clause."
        test_recipe:
          setup: ["Playbook ACTIVE with one clause having fallback_positions=[]"]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "cc_c2@x.com", display_name: "CC", primary_role: "CHIEF_COUNSEL" }
              as: OpsAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /playbooks"
              payload: { name: "EmptyFB" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { pb_id: $.data.id }
          trigger:
            - call: "POST /playbooks/${pb_id}/clauses"
              payload: { clause_key: "K", category: "OPERATIONAL", standard_text: "s", fallback_positions: [], approver_role_required: "LEGAL_COUNSEL", deviation_severity_cap: "LOW" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { cl_id: $.data.id, cl_fb: $.data.fallback_positions }
          assert:
            - "cl_fb == []"
            - "ClauseTemplate.${cl_id}.status == ACTIVE"

      - name: negotiation_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - entities.Negotiation
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "GET /negotiations/{unknown-uuid} returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["An authenticated user exists"]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "ca_c3@x.com", display_name: "CA", primary_role: "CONTRACT_ANALYST" }
              as: OpsAdmin
              captures: { ca_id: $.data.id }
          trigger:
            - call: "GET /negotiations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "err == ERR_NOT_FOUND"

      - name: counterparty_risk_tier_default_standard
        claim_type: defaults
        grounds:
          - entities.Counterparty.fields.risk_tier
        distinguishing_aspect: "POST /counterparties omitting risk_tier applies default STANDARD."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /counterparties"
              payload: { legal_name: "DefaultCo", jurisdiction: "US-CA" }
              as: OpsAdmin
              captures: { cp_id: $.data.id, cp_risk: $.data.risk_tier }
          assert:
            - "HTTP status == 201"
            - "cp_risk == STANDARD"

      - name: user_can_sign_above_cents_default_zero
        claim_type: defaults
        grounds:
          - entities.User.fields.can_sign_above_cents
        distinguishing_aspect: "POST /users omitting can_sign_above_cents defaults to 0 — meaning user cannot sign any contract with positive value."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /users"
              payload: { email: "nosign@x.com", display_name: "NS", primary_role: "SIGNATORY" }
              as: OpsAdmin
              captures: { u_id: $.data.id, u_cap: $.data.can_sign_above_cents }
          assert:
            - "u_cap == 0"

      - name: intake_request_invalid_contract_type_fk_returns_422
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors.ERR_FOREIGN_KEY_NOT_FOUND
        distinguishing_aspect: "POST /intake-requests with a non-existent contract_type_id returns 422 ERR_FOREIGN_KEY_NOT_FOUND."
        test_recipe:
          setup: ["Analyst + Counterparty exist"]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "ca_c6@x.com", display_name: "CA", primary_role: "CONTRACT_ANALYST" }
              as: OpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /counterparties"
              payload: { legal_name: "CP", jurisdiction: "US-CA" }
              as: OpsAdmin
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "00000000-0000-0000-0000-000000000000", counterparty_id: "${cp_id}", contract_value_cents: 1000, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "err == ERR_FOREIGN_KEY_NOT_FOUND"

      - name: negotiation_computed_fields_ignore_input
        claim_type: computed_fields
        grounds:
          - entities.Negotiation.fields.open_deviation_count
        distinguishing_aspect: "Client cannot write open_deviation_count; the field is computed and input is ignored/rejected."
        excluded_because:
          difficulty_instance: open_deviation_count_invariant_after_supersede
          rationale: "§1.8 invariant test proves the field is computed by demonstrating its value is server-derived; that input would be ignored is implicit."

  # ===========================================================================
  # Section: state_machines — invalid transitions, terminal lockdown
  # ===========================================================================
  - section: state_machines
    instances:
      - name: playbook_deprecate_from_deprecated_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Playbook
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "POST /playbooks/{id}/deprecate on already-DEPRECATED playbook returns 409 ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Playbook in DEPRECATED state"]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "cc_sm1@x.com", display_name: "CC", primary_role: "CHIEF_COUNSEL" }
              as: OpsAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /playbooks"
              payload: { name: "SM1" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /playbooks/${pb_id}/clauses"
              payload: { clause_key: "K", category: "OPERATIONAL", standard_text: "s", fallback_positions: [], approver_role_required: "LEGAL_COUNSEL", deviation_severity_cap: "LOW" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
            - call: "POST /playbooks/${pb_id}/publish"
              payload: {}
              as: ChiefCounsel
              as_user_id: "${cc_id}"
            - call: "POST /playbooks/${pb_id}/deprecate"
              payload: {}
              as: ChiefCounsel
              as_user_id: "${cc_id}"
          trigger:
            - call: "POST /playbooks/${pb_id}/deprecate"
              payload: {}
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"

      - name: deviation_terminal_approved_no_further_transitions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Deviation
        distinguishing_aspect: "Deviation in APPROVED (terminal) rejects begin-review, decide, withdraw with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Negotiation REDLINING, Deviation APPROVED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /users"
              payload: { email: "bo_sm2@x.com", display_name: "BO", primary_role: "BUSINESS_OWNER" }
              as: OpsAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /users"
              payload: { email: "lc_sm2@x.com", display_name: "LC", primary_role: "LEGAL_COUNSEL" }
              as: OpsAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /users"
              payload: { email: "ca_sm2@x.com", display_name: "CA", primary_role: "CONTRACT_ANALYST" }
              as: OpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /users"
              payload: { email: "cc_sm2@x.com", display_name: "CC", primary_role: "CHIEF_COUNSEL" }
              as: OpsAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /contract-types"
              payload: { code: "SM2", display_name: "SM2", low_value_threshold_cents: 100000, mid_value_threshold_cents: 500000, high_value_threshold_cents: 2000000, auto_approve_below_cents: 50000, requires_chief_counsel_above_cents: 10000000, default_business_owner_id: "${bo_id}", default_legal_counsel_id: "${lc_id}" }
              as: OpsAdmin
              captures: { ct_id: $.data.id }
            - call: "POST /counterparties"
              payload: { legal_name: "SM2", jurisdiction: "US-CA" }
              as: OpsAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /playbooks"
              payload: { name: "SM2" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /playbooks/${pb_id}/clauses"
              payload: { clause_key: "A", category: "OPERATIONAL", standard_text: "a", fallback_positions: ["a_fb"], approver_role_required: "LEGAL_COUNSEL", deviation_severity_cap: "MEDIUM" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { cl_a: $.data.id }
            - call: "POST /playbooks/${pb_id}/publish"
              payload: {}
              as: ChiefCounsel
              as_user_id: "${cc_id}"
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "${ct_id}", counterparty_id: "${cp_id}", contract_value_cents: 75000, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_id: $.data.id }
            - call: "POST /intake-requests/${ir_id}/triage"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_v: $.data.version }
            - call: "POST /intake-requests/${ir_id}/open-negotiation"
              payload: { playbook_id: "${pb_id}", drafter_user_id: "${ca_id}", expected_intake_request_version: "${ir_v}" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { neg_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { change_summary: "r1" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
            - call: "POST /negotiations/${neg_id}/deviations"
              payload: { clause_template_id: "${cl_a}", proposed_text: "alt", fallback_index: 0 }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { dev_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/deviations/${dev_id}/begin-review"
              payload: {}
              as: LegalCounsel
              as_user_id: "${lc_id}"
            - call: "GET /negotiations/${neg_id}"
              payload: {}
              as: LegalCounsel
              as_user_id: "${lc_id}"
              captures: { neg_v: $.data.version }
            - call: "POST /negotiations/${neg_id}/deviations/${dev_id}/decide"
              payload: { decision: "APPROVE", expected_negotiation_version: "${neg_v}" }
              as: LegalCounsel
              as_user_id: "${lc_id}"
          trigger:
            - call: "POST /negotiations/${neg_id}/deviations/${dev_id}/begin-review"
              payload: {}
              as: LegalCounsel
              as_user_id: "${lc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE_TRANSITION"
            - "Deviation.${dev_id}.status == APPROVED"

      - name: intake_request_initial_state_is_pending_triage
        claim_type: initial_state
        grounds:
          - state_machines.IntakeRequest
        distinguishing_aspect: "New IntakeRequest is created in PENDING_TRIAGE."
        test_recipe:
          setup: ["ContractType, Counterparty, User exist"]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "bo_sm3@x.com", display_name: "BO", primary_role: "BUSINESS_OWNER" }
              as: OpsAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /users"
              payload: { email: "lc_sm3@x.com", display_name: "LC", primary_role: "LEGAL_COUNSEL" }
              as: OpsAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /users"
              payload: { email: "ca_sm3@x.com", display_name: "CA", primary_role: "CONTRACT_ANALYST" }
              as: OpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /contract-types"
              payload: { code: "SM3", display_name: "SM3", low_value_threshold_cents: 100000, mid_value_threshold_cents: 500000, high_value_threshold_cents: 2000000, auto_approve_below_cents: 50000, requires_chief_counsel_above_cents: 10000000, default_business_owner_id: "${bo_id}", default_legal_counsel_id: "${lc_id}" }
              as: OpsAdmin
              captures: { ct_id: $.data.id }
            - call: "POST /counterparties"
              payload: { legal_name: "SM3", jurisdiction: "US-CA" }
              as: OpsAdmin
              captures: { cp_id: $.data.id }
          trigger:
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "${ct_id}", counterparty_id: "${cp_id}", contract_value_cents: 1000, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_status: $.data.status }
          assert:
            - "ir_status == PENDING_TRIAGE"

      - name: negotiation_abort_cascades_to_deviations_and_rounds
        claim_type: side_effect_execution
        grounds:
          - state_machines.Negotiation.REDLINING_to_ABORTED
        distinguishing_aspect: "Aborting a REDLINING negotiation supersedes open round, withdraws open deviations, decrements counterparty/playbook active counts."
        test_recipe:
          setup: ["Negotiation REDLINING with 1 open round, 1 OPEN deviation"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /users"
              payload: { email: "bo_sm4@x.com", display_name: "BO", primary_role: "BUSINESS_OWNER" }
              as: OpsAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /users"
              payload: { email: "lc_sm4@x.com", display_name: "LC", primary_role: "LEGAL_COUNSEL" }
              as: OpsAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /users"
              payload: { email: "ca_sm4@x.com", display_name: "CA", primary_role: "CONTRACT_ANALYST" }
              as: OpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /users"
              payload: { email: "cc_sm4@x.com", display_name: "CC", primary_role: "CHIEF_COUNSEL" }
              as: OpsAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /contract-types"
              payload: { code: "SM4", display_name: "SM4", low_value_threshold_cents: 100000, mid_value_threshold_cents: 500000, high_value_threshold_cents: 2000000, auto_approve_below_cents: 50000, requires_chief_counsel_above_cents: 10000000, default_business_owner_id: "${bo_id}", default_legal_counsel_id: "${lc_id}" }
              as: OpsAdmin
              captures: { ct_id: $.data.id }
            - call: "POST /counterparties"
              payload: { legal_name: "SM4", jurisdiction: "US-CA" }
              as: OpsAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /playbooks"
              payload: { name: "SM4" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /playbooks/${pb_id}/clauses"
              payload: { clause_key: "A", category: "OPERATIONAL", standard_text: "a", fallback_positions: ["a_fb"], approver_role_required: "LEGAL_COUNSEL", deviation_severity_cap: "MEDIUM" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { cl_a: $.data.id }
            - call: "POST /playbooks/${pb_id}/publish"
              payload: {}
              as: ChiefCounsel
              as_user_id: "${cc_id}"
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "${ct_id}", counterparty_id: "${cp_id}", contract_value_cents: 75000, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_id: $.data.id }
            - call: "POST /intake-requests/${ir_id}/triage"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_v: $.data.version }
            - call: "POST /intake-requests/${ir_id}/open-negotiation"
              payload: { playbook_id: "${pb_id}", drafter_user_id: "${ca_id}", expected_intake_request_version: "${ir_v}" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { neg_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { change_summary: "r1" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { rd_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/deviations"
              payload: { clause_template_id: "${cl_a}", proposed_text: "alt", fallback_index: 0 }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /negotiations/${neg_id}/abort"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
          assert:
            - "Negotiation.${neg_id}.draft_status == ABORTED"
            - "NegotiationRound.${rd_id}.status == SUPERSEDED"
            - "Deviation.${dev_id}.status == WITHDRAWN"
            - "Counterparty.${cp_id}.active_negotiation_count == 0"
            - "Playbook.${pb_id}.active_negotiation_count == 0"

  # ===========================================================================
  # Section: calculations — precision, boundary, constants
  # ===========================================================================
  - section: calculations
    instances:
      - name: value_tier_very_high_above_high_threshold
        claim_type: correct_result
        grounds:
          - calculations.value_tier_assignment
        distinguishing_aspect: "value > high_value_threshold_cents -> VERY_HIGH; the boundary is strict (>) on the very-high side."
        test_recipe:
          setup: ["ContractType with high=2000000"]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "bo_c4@x.com", display_name: "BO", primary_role: "BUSINESS_OWNER" }
              as: OpsAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /users"
              payload: { email: "lc_c4@x.com", display_name: "LC", primary_role: "LEGAL_COUNSEL" }
              as: OpsAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /users"
              payload: { email: "ca_c4@x.com", display_name: "CA", primary_role: "CONTRACT_ANALYST" }
              as: OpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /contract-types"
              payload: { code: "C4", display_name: "C4", low_value_threshold_cents: 100000, mid_value_threshold_cents: 500000, high_value_threshold_cents: 2000000, auto_approve_below_cents: 0, requires_chief_counsel_above_cents: 10000000, default_business_owner_id: "${bo_id}", default_legal_counsel_id: "${lc_id}" }
              as: OpsAdmin
              captures: { ct_id: $.data.id }
            - call: "POST /counterparties"
              payload: { legal_name: "C4", jurisdiction: "US-CA" }
              as: OpsAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "${ct_id}", counterparty_id: "${cp_id}", contract_value_cents: 2000001, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_id: $.data.id }
          trigger:
            - call: "POST /intake-requests/${ir_id}/triage"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
            - call: "GET /intake-requests/${ir_id}/triage-decisions"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { tier: "$.data[0].value_tier" }
          assert:
            - "tier == VERY_HIGH"

      - name: deviation_severity_fallback_index_zero_is_fallback
        claim_type: correct_result
        grounds:
          - calculations.deviation_severity_classification
        distinguishing_aspect: "fallback_index=0 (within range) produces severity=FALLBACK; fallback_index=-1 produces NON_STANDARD."
        test_recipe:
          setup: ["Negotiation REDLINING; clause with 2 fallbacks"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /users"
              payload: { email: "bo_c5@x.com", display_name: "BO", primary_role: "BUSINESS_OWNER" }
              as: OpsAdmin
              captures: { bo_id: $.data.id }
            - call: "POST /users"
              payload: { email: "lc_c5@x.com", display_name: "LC", primary_role: "LEGAL_COUNSEL" }
              as: OpsAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /users"
              payload: { email: "ca_c5@x.com", display_name: "CA", primary_role: "CONTRACT_ANALYST" }
              as: OpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /users"
              payload: { email: "cc_c5@x.com", display_name: "CC", primary_role: "CHIEF_COUNSEL" }
              as: OpsAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /contract-types"
              payload: { code: "C5", display_name: "C5", low_value_threshold_cents: 100000, mid_value_threshold_cents: 500000, high_value_threshold_cents: 2000000, auto_approve_below_cents: 0, requires_chief_counsel_above_cents: 10000000, default_business_owner_id: "${bo_id}", default_legal_counsel_id: "${lc_id}" }
              as: OpsAdmin
              captures: { ct_id: $.data.id }
            - call: "POST /counterparties"
              payload: { legal_name: "C5", jurisdiction: "US-CA" }
              as: OpsAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /playbooks"
              payload: { name: "C5" }
