            - call: "POST /riders/${r1_id}/assessments"
              payload: { assessment_type: "ANNUAL_REASSESSMENT", performed_on: "2026-04-15", balance_score: 9, trunk_control_score: 9, rider_weight_lb: 150, backriding_required: false, expected_rider_version: "${r1_v3}" }
              as: Instructor
              as_user_id: "${i1_id}"
              captures: { a2_id: "$.data.id", a2_level: "$.data.independence_level" }
          assert:
            - "${err_id} == ERR_STALE_VERSION with HTTP status 412"
            - "Assessment.${a1_id}.status is still RECORDED after the rejected call"
            - "The retry returns HTTP 201, ${a2_level} == LEVEL_4 and Assessment.${a1_id}.status == SUPERSEDED"
            - "Rider.${r1_id}.independence_level == LEVEL_4 and required_sidewalker_count == 0"

      - name: medical_release_filing_with_a_stale_rider_version_returns_412
        claim_type: optimistic_concurrency
