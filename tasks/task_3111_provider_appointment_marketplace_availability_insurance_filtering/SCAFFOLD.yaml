# =============================================================================
# SCAFFOLD — Provider Appointment Marketplace (Zocdoc-style)
# Availability publication, insurance attestation/filtering, booking write-back,
# attribution monetization, reliability scoring, verified reviews, directory audits.
# =============================================================================

scenario: |
  Provider Appointment Marketplace Availability & Insurance Filtering (Zocdoc):
  provider calendar integration with real-time open-slot publication and booking
  write-back, insurance plan filtering that must reflect actual accepted plans
  with attestation and complaint handling, appointment type mapping between the
  marketplace and practice scheduling templates, new-patient versus
  existing-patient slot rules and appointment lead time constraints, per-booking
  or subscription monetization with attribution disputes over patients who
  already knew the practice, no-show and cancellation policy enforcement with
  patient reliability scoring, review collection restricted to verified visits
  with moderation, provider directory accuracy audits and delisting.

domain_name: provider-appointment-marketplace
api_prefix: /marketplace

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Practice
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Practice display name" }
      - { name: timezone, type: string, source: input, description: "IANA timezone of the practice" }
      - { name: billing_mode, type: enum, source: input, default: "PER_BOOKING", description: "PER_BOOKING | SUBSCRIPTION", constraints: "enum {PER_BOOKING, SUBSCRIPTION}" }
      - { name: subscription_fee_cents, type: integer, source: input, default: 30000, description: "Flat monthly fee when billing_mode == SUBSCRIPTION" }
      - { name: new_patient_lead_time_hours, type: integer, source: input, default: 24, description: "Minimum hours between booking creation and slot start for new patients" }
      - { name: existing_patient_lead_time_hours, type: integer, source: input, default: 4, description: "Minimum hours between booking creation and slot start for existing patients" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> SUSPENDED -> ACTIVE (cyclic) -> DELISTED", constraints: "enum {DRAFT, ACTIVE, SUSPENDED, DELISTED}" }

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: input, description: "FK -> Practice.id; must equal acting PracticeStaff X-User-ID" }
      - { name: display_name, type: string, source: input, description: "Provider display name" }
      - { name: specialty, type: string, source: input, description: "Specialty code, e.g. DERM" }
      - { name: lead_time_override_hours, type: integer, source: input, default: null, description: "Optional per-provider lead-time override (applies to both new and existing patients); null = inherit from Practice" }
      - { name: insurance_mismatch_count, type: integer, source: computed, default: 0, description: "Count of upheld INSURANCE_MISMATCH complaints; reaching 3 auto-suspends the provider" }
      - { name: bookable_in_directory, type: boolean, source: computed, default: false, description: "Derived: status == ACTIVE AND owning Practice.status == ACTIVE; recomputed on every provider/practice status change" }
      - { name: status, type: enum, source: system, description: "PENDING -> ACTIVE -> SUSPENDED -> ACTIVE (cyclic) -> DELISTED", constraints: "enum {PENDING, ACTIVE, SUSPENDED, DELISTED}" }

  - name: Slot
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; taken from the path" }
      - { name: start_at, type: datetime, source: input, description: "Slot start (ISO 8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Slot end (ISO 8601 UTC); must be > start_at" }
      - { name: status, type: enum, source: system, description: "OPEN -> BOOKED -> OPEN (release on cancel, cyclic); OPEN|BOOKED -> CLOSED", constraints: "enum {OPEN, BOOKED, CLOSED}" }
      - { name: close_reason, type: enum, source: system, default: null, description: "Set when status becomes CLOSED: PROVIDER_CLOSED | AUDIT_SWEEP | PROVIDER_SUSPENDED", constraints: "enum {PROVIDER_CLOSED, AUDIT_SWEEP, PROVIDER_SUSPENDED} or null" }
      - { name: current_booking_id, type: string, source: computed, default: null, description: "id of the Booking currently occupying this slot; null unless status == BOOKED" }

  - name: AppointmentType
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; taken from the path" }
      - { name: code, type: string, source: input, description: "Practice scheduling-template code, e.g. NEW30" }
      - { name: display_name, type: string, source: input, description: "Marketplace-facing name" }
      - { name: duration_minutes, type: integer, source: input, description: "Template duration" }
      - { name: booked_copay_cents, type: integer, source: input, description: "Expected copay pinned onto the booking and charge" }
      - { name: accepts_new_patients, type: boolean, source: input, default: true, description: "Whether patients with no prior COMPLETED booking at this practice may book this type" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RETIRED", constraints: "enum {ACTIVE, RETIRED}" }

  - name: InsurancePlan
    parent: null
    common_fields: true
    fields:
      - { name: carrier, type: string, source: input, description: "Carrier name, e.g. Aetna" }
      - { name: plan_name, type: string, source: input, description: "Plan name" }
      - { name: plan_code, type: string, source: input, description: "Unique plan code", constraints: "unique across all InsurancePlans" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RETIRED", constraints: "enum {ACTIVE, RETIRED}" }

  - name: Attestation
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: plan_id, type: string, source: input, description: "FK -> InsurancePlan.id" }
      - { name: effective_from, type: datetime, source: input, description: "Start of the attested acceptance window (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "End of the attested acceptance window (exclusive); must be > effective_from" }
      - { name: status, type: enum, source: system, description: "ATTESTED -> VERIFIED -> REVOKED | EXPIRED; ATTESTED -> REJECTED", constraints: "enum {ATTESTED, VERIFIED, REJECTED, REVOKED, EXPIRED}" }
      - { name: verified_by, type: string, source: system, default: null, description: "OpsAdmin X-User-ID that verified the attestation" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patient full name" }
      - { name: email, type: string, source: input, description: "Patient email", constraints: "unique across all Patients" }
      - { name: plan_id, type: string, source: input, default: null, description: "FK -> InsurancePlan.id; patient's self-declared plan; null = self-pay" }
      - { name: reliability_score, type: integer, source: computed, default: 100, description: "Effective reliability: 100 - sum(active strike magnitudes) + 10 * recovery_count, clamped to [0, 100]; booking gate blocks when < 50" }
      - { name: provisional_score, type: integer, source: computed, default: 100, description: "Window-only reliability: 100 - sum(active strike magnitudes), clamped to [0, 100]; ignores recoveries" }
      - { name: strikes, type: array, source: computed, default: [], description: "Array of { epoch: integer, magnitude: integer, kind: NO_SHOW | LATE_CANCEL }; a strike is active while strike.epoch >= current_epoch - 3" }
      - { name: recovery_count, type: integer, source: computed, default: 0, description: "Number of COMPLETED bookings that granted a +10 recovery" }

  - name: ContactEvent
    parent: null
    common_fields: false
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id; taken from acting PracticeStaff X-User-ID" }
      - { name: provider_id, type: string, source: input, default: null, description: "FK -> Provider.id; optional specific provider the patient contacted" }
      - { name: contacted_at, type: datetime, source: input, description: "When the pre-existing contact occurred" }
      - { name: channel, type: enum, source: input, description: "PHONE | EMAIL | PORTAL | WALKIN", constraints: "enum {PHONE, EMAIL, PORTAL, WALKIN}" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: slot_id, type: string, source: system, description: "FK -> Slot.id; taken from the path" }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; must equal acting Patient X-User-ID" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; copied from the slot" }
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id; copied from the provider" }
      - { name: appointment_type_id, type: string, source: input, description: "FK -> AppointmentType.id; must be an ACTIVE type of the slot's provider" }
      - { name: insurance_plan_id, type: string, source: input, default: null, description: "FK -> InsurancePlan.id; null = self-pay" }
      - { name: start_at, type: datetime, source: system, description: "Copied from slot.start_at" }
      - { name: end_at, type: datetime, source: system, description: "Copied from slot.end_at" }
      - { name: booked_copay_cents, type: integer, source: system, description: "Copied from AppointmentType.booked_copay_cents at booking time" }
      - { name: is_new_patient, type: boolean, source: computed, description: "true when the patient has no COMPLETED booking with this practice at booking time" }
      - { name: attribution_status, type: enum, source: computed, description: "ATTRIBUTED (marketplace-acquired, billable) | ORGANIC (pre-existing contact inside the 90-day window, never billed)", constraints: "enum {ATTRIBUTED, ORGANIC}" }
      - { name: late_cancel, type: boolean, source: computed, default: false, description: "true when cancelled with 2 <= hours_before_start < 24" }
      - { name: cancel_reason, type: enum, source: system, default: null, description: "PATIENT | PRACTICE | RELIABILITY_GATE; null until cancelled", constraints: "enum {PATIENT, PRACTICE, RELIABILITY_GATE} or null" }
      - { name: status, type: enum, source: system, description: "CONFIRMED -> CHECKED_IN -> COMPLETED; CONFIRMED -> NO_SHOW | CANCELLED", constraints: "enum {CONFIRMED, CHECKED_IN, COMPLETED, NO_SHOW, CANCELLED}" }

  - name: Charge
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id" }
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id; copied from the booking" }
      - { name: invoice_id, type: string, source: system, default: null, description: "FK -> Invoice.id; set when the charge is swept into an invoice" }
      - { name: gross_cents, type: integer, source: system, description: "= booking.booked_copay_cents" }
      - { name: marketplace_fee_cents, type: integer, source: computed, description: "round_half_up(gross_cents * 0.15); computed at booking time" }
      - { name: processing_cents, type: integer, source: computed, description: "round_half_up(gross_cents * 0.029) + 30; computed after the fee" }
      - { name: net_to_practice_cents, type: integer, source: computed, description: "gross_cents - marketplace_fee_cents - processing_cents" }
      - { name: status, type: enum, source: system, description: "BILLABLE -> INVOICED -> DISPUTED -> INVOICED (KEEP, cyclic) | REFUNDED (REMOVE); INVOICED -> SETTLED", constraints: "enum {BILLABLE, INVOICED, DISPUTED, SETTLED, REFUNDED}" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: practice_id, type: string, source: system, description: "FK -> Practice.id" }
      - { name: period, type: string, source: system, description: "Billing period, format YYYY-MM" }
      - { name: charge_count, type: integer, source: computed, default: 0, description: "Number of charges swept into this invoice" }
      - { name: fee_total_cents, type: integer, source: computed, default: 0, description: "Sum of marketplace_fee_cents over swept charges (per-charge rounded values, never re-derived from gross)" }
      - { name: discount_tier, type: number, source: computed, default: 0, description: "0.20 when charge_count >= 21; 0.10 when >= 11; else 0.00" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "round_half_up(fee_total_cents * discount_tier); computed once after fee_total_cents is final" }
      - { name: amount_due_cents, type: integer, source: computed, default: 0, description: "ALWAYS equals sum of LedgerEntry.amount_cents for this invoice; recomputed on every ledger mutation" }
      - { name: payout_provisional_cents, type: integer, source: computed, default: 0, description: "Sum of charge.net_to_practice_cents over swept charges (per-charge provisional view)" }
      - { name: payout_final_cents, type: integer, source: computed, default: 0, description: "sum(gross) - amount_due_billing_part - sum(processing); equals payout_provisional_cents + discount_cents" }
      - { name: status, type: enum, source: system, description: "ISSUED -> DISPUTED -> ISSUED (cyclic); ISSUED -> PAID | WRITTEN_OFF", constraints: "enum {ISSUED, DISPUTED, PAID, WRITTEN_OFF}" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id" }
      - { name: charge_id, type: string, source: system, default: null, description: "FK -> Charge.id; null for TIER_DISCOUNT, SUBSCRIPTION_FEE, PAYMENT, WRITE_OFF entries" }
      - { name: entry_type, type: enum, source: system, description: "CHARGE_FEE | TIER_DISCOUNT | DISPUTE_CREDIT | SUBSCRIPTION_FEE | PAYMENT | WRITE_OFF", constraints: "enum {CHARGE_FEE, TIER_DISCOUNT, DISPUTE_CREDIT, SUBSCRIPTION_FEE, PAYMENT, WRITE_OFF}" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount; fees positive, discounts/credits/payments negative" }
      - { name: note, type: string, source: system, default: null, description: "Free-text note" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; copied from the booking" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; copied from the booking" }
      - { name: complaint_type, type: enum, source: input, description: "INSURANCE_MISMATCH | DIRECTORY_INACCURACY | OTHER", constraints: "enum {INSURANCE_MISMATCH, DIRECTORY_INACCURACY, OTHER}" }
      - { name: description, type: string, source: input, default: null, description: "Free-text detail" }
      - { name: response, type: string, source: system, default: null, description: "Practice response text" }
      - { name: outcome, type: enum, source: system, default: null, description: "UPHOLD | DISMISS; set at resolution", constraints: "enum {UPHOLD, DISMISS} or null" }
      - { name: status, type: enum, source: system, description: "OPEN -> UNDER_REVIEW -> RESOLVED_UPHELD | RESOLVED_DISMISSED", constraints: "enum {OPEN, UNDER_REVIEW, RESOLVED_UPHELD, RESOLVED_DISMISSED}" }

  - name: Review
    parent: null
    common_fields: true
    fields:
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; the booking must have a VERIFIED VisitRecord" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; copied from the booking" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; copied from the booking" }
      - { name: rating, type: integer, source: input, description: "1..5", constraints: "1 <= rating <= 5" }
      - { name: text, type: string, source: input, default: null, description: "Review text" }
      - { name: flag_reason, type: string, source: system, default: null, description: "Reason supplied at flag time" }
      - { name: status, type: enum, source: system, description: "PUBLISHED -> FLAGGED -> PUBLISHED (restore, cyclic) | REMOVED; PUBLISHED -> REMOVED", constraints: "enum {PUBLISHED, FLAGGED, REMOVED}" }

  - name: VisitRecord
    parent: null
    common_fields: false
    fields:
      - { name: booking_id, type: string, source: system, description: "FK -> Booking.id; unique — at most one VisitRecord per booking" }
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; copied from the booking" }
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; copied from the booking" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock timestamp when the booking completed" }
      - { name: verification, type: enum, source: system, description: "Always VERIFIED (created only by the complete transition)", constraints: "enum {VERIFIED}" }

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id" }
      - { name: scope, type: enum, source: input, description: "AVAILABILITY | INSURANCE | FULL", constraints: "enum {AVAILABILITY, INSURANCE, FULL}" }
      - { name: sampled_count, type: integer, source: computed, default: 0, description: "Items inspected at run time (up to 20; slots first by created_at ASC, then attestations by created_at ASC for FULL)" }
      - { name: mismatch_count, type: integer, source: computed, default: 0, description: "Sampled items found stale at run time" }
      - { name: mismatch_rate, type: number, source: computed, default: 0, description: "mismatch_count / max(1, sampled_count)" }
      - { name: severity, type: enum, source: computed, default: "CLEAN", description: "mismatch_rate > 0.20 -> CRITICAL; > 0.05 -> WARN; else CLEAN", constraints: "enum {CLEAN, WARN, CRITICAL}" }
      - { name: findings, type: array, source: computed, default: [], description: "Array of { finding_index: integer, finding_type: TIME_TRAVEL_SLOT | INSURANCE_STALE, ref_id: string, resolved: boolean }" }
      - { name: status, type: enum, source: system, description: "OPEN -> FINDINGS_OPEN -> CLOSED; OPEN -> CLOSED_CLEAN (zero mismatches)", constraints: "enum {OPEN, FINDINGS_OPEN, CLOSED_CLEAN, CLOSED}" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Practice
    initial_state: DRAFT
    terminal_states: [DELISTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /marketplace/practices/{practice_id}/activate
        actor: OpsAdmin
        preconditions: ["status == DRAFT (else ERR_INVALID_STATE)"]
        side_effects: ["recompute bookable_in_directory on all providers of this practice"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /marketplace/practices/{practice_id}/suspend
        actor: OpsAdmin
        preconditions: ["status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["recompute bookable_in_directory on all providers of this practice"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /marketplace/practices/{practice_id}/reinstate
        actor: OpsAdmin
        preconditions: ["status == SUSPENDED (else ERR_INVALID_STATE)"]
        side_effects: ["recompute bookable_in_directory on all providers of this practice"]
      - from: ACTIVE
        to: DELISTED
        trigger: POST /marketplace/practices/{practice_id}/delist
        actor: OpsAdmin
        preconditions: ["status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects:
          - "Every provider of this practice in status ACTIVE or SUSPENDED -> DELISTED"
          - "Every future OPEN slot of those providers -> CLOSED with close_reason PROVIDER_SUSPENDED"
      - from: SUSPENDED
        to: DELISTED
        trigger: POST /marketplace/practices/{practice_id}/delist
        actor: OpsAdmin
        preconditions: ["status == SUSPENDED (else ERR_INVALID_STATE)"]
        side_effects: ["Same provider/slot cascade as ACTIVE -> DELISTED"]

  - entity: Provider
    initial_state: PENDING
    terminal_states: [DELISTED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: POST /marketplace/providers/{provider_id}/activate
        actor: OpsAdmin
        preconditions:
          - "status == PENDING (else ERR_INVALID_STATE)"
          - "owning Practice.status == ACTIVE (else ERR_PRACTICE_NOT_ACTIVE)"
        side_effects: ["recompute bookable_in_directory"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /marketplace/providers/{provider_id}/suspend (OpsAdmin) OR system (insurance_mismatch_count reaches 3 via upheld complaint)"
        actor: OpsAdmin
        preconditions: ["status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects:
          - "Every future OPEN slot (start_at > now) -> CLOSED with close_reason PROVIDER_SUSPENDED"
          - "recompute bookable_in_directory (= false)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /marketplace/providers/{provider_id}/reinstate
        actor: OpsAdmin
        preconditions:
          - "status == SUSPENDED (else ERR_INVALID_STATE)"
          - "owning Practice.status == ACTIVE (else ERR_PRACTICE_NOT_ACTIVE)"
        side_effects: ["recompute bookable_in_directory"]
      - from: ACTIVE
        to: DELISTED
        trigger: "POST /marketplace/providers/{provider_id}/delist OR system (practice delist cascade)"
        actor: OpsAdmin
        preconditions: ["status == ACTIVE (else ERR_INVALID_STATE; system cascade exempt)"]
        side_effects:
          - "Every future OPEN slot -> CLOSED with close_reason PROVIDER_SUSPENDED"
          - "recompute bookable_in_directory (= false)"
      - from: SUSPENDED
        to: DELISTED
        trigger: "POST /marketplace/providers/{provider_id}/delist OR system (practice delist cascade)"
        actor: OpsAdmin
        preconditions: ["status == SUSPENDED (else ERR_INVALID_STATE; system cascade exempt)"]
        side_effects: ["Same slot cascade as ACTIVE -> DELISTED"]

  - entity: Slot
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: BOOKED
        trigger: POST /marketplace/slots/{slot_id}/bookings
        actor: Patient
        preconditions:
          - "status == OPEN (else ERR_SLOT_NOT_OPEN)"
          - "all booking validations pass (see §1.4)"
        side_effects:
          - "current_booking_id := new booking id"
          - "increments Provider.version by 1 is NOT triggered here; Slot.version increments"
      - from: BOOKED
        to: OPEN
        trigger: "system (occupying booking transitions to CANCELLED)"
        actor: system
        preconditions: ["occupying booking cancelled"]
        side_effects: ["current_booking_id := null"]
      - from: OPEN
        to: CLOSED
        trigger: "POST /marketplace/slots/{slot_id}/close (PROVIDER_CLOSED) OR system audit sweep (AUDIT_SWEEP) OR system provider suspension/delist (PROVIDER_SUSPENDED)"
        actor: Provider
        preconditions: ["status == OPEN (else ERR_INVALID_STATE for the endpoint path; system cascades only touch OPEN slots)"]
        side_effects: ["close_reason set per trigger"]
      - from: BOOKED
        to: CLOSED
        trigger: "system (occupying booking transitions to COMPLETED or NO_SHOW)"
        actor: system
        preconditions: ["occupying booking reached COMPLETED or NO_SHOW"]
        side_effects: ["close_reason := PROVIDER_CLOSED when the booking COMPLETED; PROVIDER_SUSPENDED when the booking went NO_SHOW"]

  - entity: Booking
    initial_state: CONFIRMED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: POST /marketplace/bookings/{booking_id}/check-in
        actor: PracticeStaff
        preconditions: ["status == CONFIRMED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: POST /marketplace/bookings/{booking_id}/complete
        actor: PracticeStaff
        preconditions: ["status == CHECKED_IN (else ERR_INVALID_STATE)"]
        side_effects:
          - "Create VisitRecord (verification VERIFIED) for this booking"
          - "Patient.recovery_count += 1; Patient.reliability_score recomputed (calc_reliability, +10 capped at 100)"
          - "Slot BOOKED -> CLOSED"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: POST /marketplace/bookings/{booking_id}/mark-no-show
        actor: PracticeStaff
        preconditions:
          - "status == CONFIRMED (else ERR_INVALID_STATE)"
          - "now >= booking.start_at (else ERR_NO_SHOW_TOO_EARLY)"
        side_effects:
          - "Append strike { epoch: current_epoch, magnitude: 25, kind: NO_SHOW } to Patient.strikes; recompute reliability (calc_reliability)"
          - "If recomputed reliability_score < 50: every other CONFIRMED booking of this patient with start_at > now -> CANCELLED with cancel_reason RELIABILITY_GATE, and each such booking's slot BOOKED -> OPEN"
          - "Slot BOOKED -> CLOSED"
          - "Charge (if any) remains BILLABLE — no-show does not refund the marketplace fee"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /marketplace/bookings/{booking_id}/cancel (Patient or PracticeStaff) OR system (reliability-gate cascade)"
        actor: Patient
        preconditions:
          - "status == CONFIRMED (else ERR_BOOKING_NOT_CANCELLABLE; system cascade only touches CONFIRMED bookings)"
          - "for the endpoint path: hours_before_start >= 2 (else ERR_CANCELLATION_TOO_LATE)"
        side_effects:
          - "If 2 <= hours_before_start < 24: late_cancel := true and append strike { epoch: current_epoch, magnitude: 15, kind: LATE_CANCEL }; recompute reliability (calc_reliability); if reliability_score < 50 the same reliability-gate cascade as NO_SHOW fires"
          - "cancel_reason := PATIENT (Patient actor) | PRACTICE (PracticeStaff actor) | RELIABILITY_GATE (system)"
          - "Slot BOOKED -> OPEN (release)"

  - entity: Attestation
    initial_state: ATTESTED
    terminal_states: [REJECTED, REVOKED, EXPIRED]
    transitions:
      - from: ATTESTED
        to: VERIFIED
        trigger: POST /marketplace/attestations/{attestation_id}/verify with decision VERIFY
        actor: OpsAdmin
        preconditions:
          - "status == ATTESTED (else ERR_INVALID_STATE)"
          - "InsurancePlan.status == ACTIVE (else ERR_PLAN_NOT_ACTIVE)"
        side_effects: ["verified_by := acting OpsAdmin X-User-ID"]
      - from: ATTESTED
        to: REJECTED
        trigger: POST /marketplace/attestations/{attestation_id}/verify with decision REJECT
        actor: OpsAdmin
        preconditions: ["status == ATTESTED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: VERIFIED
        to: REVOKED
        trigger: "system (complaint resolved UPHOLD on an INSURANCE_MISMATCH whose booking referenced this provider+plan)"
        actor: system
        preconditions: ["attestation is the selector result for (provider_id, plan_id) with status VERIFIED"]
        side_effects: []
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (audit sweep or epoch run when effective_to <= now)"
        actor: system
        preconditions: ["status == VERIFIED and effective_to <= now"]
        side_effects: []

  - entity: Complaint
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_DISMISSED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: POST /marketplace/complaints/{complaint_id}/respond
        actor: PracticeStaff
        preconditions: ["status == OPEN (else ERR_COMPLAINT_NOT_OPEN)"]
        side_effects: ["response := payload.response"]
      - from: UNDER_REVIEW
        to: RESOLVED_UPHELD
        trigger: POST /marketplace/complaints/{complaint_id}/resolve with outcome UPHOLD
        actor: OpsAdmin
        preconditions:
          - "status == UNDER_REVIEW (else ERR_COMPLAINT_NOT_OPEN)"
          - "when complaint_type == INSURANCE_MISMATCH: an attestation selected by (booking.provider_id, booking.insurance_plan_id, status VERIFIED; tie-break earliest created_at ASC) must exist (else ERR_INVALID_STATE)"
        side_effects:
          - "outcome := UPHOLD"
          - "If complaint_type == INSURANCE_MISMATCH: the attestation selected by (booking.provider_id, booking.insurance_plan_id, status VERIFIED; tie-break earliest created_at ASC) -> REVOKED"
          - "Provider.insurance_mismatch_count += 1"
          - "If Provider.insurance_mismatch_count >= 3: Provider ACTIVE -> SUSPENDED with its full slot-closing cascade"
      - from: UNDER_REVIEW
        to: RESOLVED_DISMISSED
        trigger: POST /marketplace/complaints/{complaint_id}/resolve with outcome DISMISS
        actor: OpsAdmin
        preconditions: ["status == UNDER_REVIEW (else ERR_COMPLAINT_NOT_OPEN)"]
        side_effects: ["outcome := DISMISS"]

  - entity: Review
    initial_state: PUBLISHED
    terminal_states: [REMOVED]
    transitions:
      - from: PUBLISHED
        to: FLAGGED
        trigger: POST /marketplace/reviews/{review_id}/flag
        actor: PracticeStaff
        preconditions: ["status == PUBLISHED (else ERR_INVALID_STATE)"]
        side_effects: ["flag_reason := payload.reason"]
      - from: FLAGGED
        to: PUBLISHED
        trigger: POST /marketplace/reviews/{review_id}/moderate with action RESTORE
        actor: OpsAdmin
        preconditions: ["status == FLAGGED (else ERR_INVALID_STATE)"]
        side_effects: ["flag_reason := null"]
      - from: FLAGGED
        to: REMOVED
        trigger: POST /marketplace/reviews/{review_id}/moderate with action REMOVE
        actor: OpsAdmin
        preconditions: ["status == FLAGGED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: PUBLISHED
        to: REMOVED
        trigger: POST /marketplace/reviews/{review_id}/moderate with action REMOVE
        actor: OpsAdmin
        preconditions: ["status == PUBLISHED (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: ISSUED
        to: DISPUTED
        trigger: POST /marketplace/invoices/{invoice_id}/dispute
        actor: PracticeStaff
        preconditions:
          - "status == ISSUED (else ERR_INVOICE_NOT_DISPUTABLE)"
          - "every charge_id in payload exists (else ERR_CHARGE_NOT_FOUND), belongs to this invoice (else ERR_CHARGE_NOT_IN_INVOICE), and is INVOICED (else ERR_INVALID_STATE)"
        side_effects: ["each named charge INVOICED -> DISPUTED"]
      - from: DISPUTED
        to: ISSUED
        trigger: POST /marketplace/invoices/{invoice_id}/resolve-dispute
        actor: OpsAdmin
        preconditions:
          - "status == DISPUTED (else ERR_INVALID_STATE)"
          - "every DISPUTED charge of this invoice appears exactly once in resolutions (else ERR_INVALID_REQUEST)"
        side_effects:
          - "action KEEP: charge DISPUTED -> INVOICED"
          - "action REMOVE: charge DISPUTED -> REFUNDED and append LedgerEntry DISPUTE_CREDIT amount = -charge.marketplace_fee_cents"
          - "recompute amount_due_cents = sum(ledger entries)"
      - from: ISSUED
        to: PAID
        trigger: POST /marketplace/invoices/{invoice_id}/pay
        actor: PracticeStaff
        preconditions:
          - "status == ISSUED (else ERR_INVOICE_NOT_PAYABLE)"
          - "amount_due_cents > 0 (else ERR_INVOICE_NOT_PAYABLE)"
        side_effects:
          - "append LedgerEntry PAYMENT amount = -amount_due_cents"
          - "amount_due_cents := 0"
          - "every INVOICED charge of this invoice -> SETTLED"
      - from: ISSUED
        to: WRITTEN_OFF
        trigger: POST /marketplace/invoices/{invoice_id}/write-off
        actor: OpsAdmin
        preconditions: ["status == ISSUED (else ERR_INVALID_STATE)"]
        side_effects:
          - "append LedgerEntry WRITE_OFF amount = -amount_due_cents"
          - "amount_due_cents := 0"

  - entity: Charge
    initial_state: BILLABLE
    terminal_states: [SETTLED, REFUNDED]
    transitions:
      - from: BILLABLE
        to: INVOICED
        trigger: "system (POST /marketplace/billing/generate-invoices sweeps the charge)"
        actor: system
        preconditions: ["status == BILLABLE and practice matches and booking.created_at within period"]
        side_effects: ["invoice_id := new invoice id"]
      - from: INVOICED
        to: DISPUTED
        trigger: "system (invoice dispute names this charge)"
        actor: system
        preconditions: ["status == INVOICED"]
        side_effects: []
      - from: DISPUTED
        to: INVOICED
        trigger: "system (dispute resolution KEEP)"
        actor: system
        preconditions: ["status == DISPUTED"]
        side_effects: []
      - from: DISPUTED
        to: REFUNDED
        trigger: "system (dispute resolution REMOVE)"
        actor: system
        preconditions: ["status == DISPUTED"]
        side_effects: ["DISPUTE_CREDIT ledger entry appended on the invoice"]
      - from: INVOICED
        to: SETTLED
        trigger: "system (invoice paid)"
        actor: system
        preconditions: ["status == INVOICED"]
        side_effects: []

  - entity: InsurancePlan
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: POST /marketplace/insurance-plans/{plan_id}/retire
        actor: OpsAdmin
        preconditions: ["status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["Plan no longer matches directory plan_id filters"]

  - entity: AppointmentType
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: POST /marketplace/appointment-types/{type_id}/retire
        actor: Provider
        preconditions: ["status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["Existing bookings keep booked_copay_cents pinned"]

  - entity: AuditCase
    initial_state: OPEN
    terminal_states: [CLOSED_CLEAN, CLOSED]
    transitions:
      - from: OPEN
        to: FINDINGS_OPEN
        trigger: POST /marketplace/audit-cases/{case_id}/run with mismatch_count > 0
        actor: OpsAdmin
        preconditions: ["status == OPEN (else ERR_INVALID_STATE)"]
        side_effects:
          - "Each TIME_TRAVEL_SLOT finding's slot OPEN -> CLOSED with close_reason AUDIT_SWEEP"
          - "Each INSURANCE_STALE finding's attestation VERIFIED -> EXPIRED"
          - "findings array populated with resolved = false"
      - from: OPEN
        to: CLOSED_CLEAN
        trigger: POST /marketplace/audit-cases/{case_id}/run with mismatch_count == 0
        actor: OpsAdmin
        preconditions: ["status == OPEN (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: FINDINGS_OPEN
        to: CLOSED
        trigger: POST /marketplace/audit-cases/{case_id}/close
        actor: OpsAdmin
        preconditions:
          - "status == FINDINGS_OPEN (else ERR_INVALID_STATE)"
          - "every finding has resolved == true (else ERR_UNRESOLVED_FINDINGS)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — true races per the serial-observability filter)
# =============================================================================
concurrency_rules:
  - rule_id: bulk-publish-stale-provider
    parent_entity: Provider
    write_endpoint: "POST /marketplace/providers/{provider_id}/slots/bulk-publish"
    occ_field: "expected_provider_version"
    description: |
      Bulk-publishing a schedule against a Provider whose version has advanced
      since the client last observed it is rejected. A bulk publish legitimately
      supersedes the provider's future OPEN slot set (closing slots absent from
      the new payload), so a stale view of the provider would silently destroy
      slots created by the newer publish.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: patient-plan-update-stale
    parent_entity: Patient
    write_endpoint: "PATCH /marketplace/patients/{patient_id}"
    occ_field: "expected_patient_version"
    description: |
      Updating a Patient's insurance plan against a Patient whose version has
      advanced since the client last observed it is rejected. Plan updates are
      idempotent-by-value but not by intent: the newer writer's plan choice must
      not be silently overwritten by a writer holding an older view.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_fee_split
    trigger: "booking creation, only when attribution_status == ATTRIBUTED and practice.billing_mode == PER_BOOKING (a Charge is created)"
    algorithm: tiered_pricing
    formula: |
      # Rounding order is PINNED — each component is rounded independently
      # before subtraction; never round once at the end.
      step 1: marketplace_fee_cents = round_half_up(gross_cents * 0.15)
      step 2: processing_cents      = round_half_up(gross_cents * 0.029) + 30
      step 3: net_to_practice_cents = gross_cents - marketplace_fee_cents - processing_cents
      where gross_cents = booking.booked_copay_cents.
    constants:
      FEE_PCT: 0.15
      PROCESSING_PCT: 0.029
      PROCESSING_FLAT_CENTS: 30
    precision: "integer cents; round_half_up applied per component in the pinned order"
    note: "Worked example: gross 9999 -> fee round(1499.85)=1500, processing round(289.971)+30=320, net 8179."
    variants:
      - name: subscription_mode
        when: "practice.billing_mode == SUBSCRIPTION"
        difference: "no Charge is created at all; the practice is billed the flat subscription_fee_cents per monthly invoice regardless of bookings"
      - name: organic_attribution
        when: "booking.attribution_status == ORGANIC"
        difference: "no Charge is created; pre-existing patients are never billed"

  - name: calc_invoice_aggregate
    trigger: "POST /marketplace/billing/generate-invoices"
    algorithm: aggregation
    formula: |
      # Evaluation order is PINNED (circular-looking dependency resolved):
      # the tier depends on charge_count, and the discount depends on
      # fee_total_cents — which is the sum of per-charge ROUNDED fees and is
      # NEVER re-derived from gross, and NEVER reduced per-charge after the
      # discount is known.
      step 1: charges = all Charge rows with status BILLABLE, practice_id = practice,
              and booking.created_at within [period-01T00:00:00Z, first day of next month)
      step 2: charge_count = len(charges)
      step 3: fee_total_cents = sum(charge.marketplace_fee_cents for charges)
      step 4: discount_tier = 0.20 if charge_count >= 21 else (0.10 if charge_count >= 11 else 0.00)
      step 5: discount_cents = round_half_up(fee_total_cents * discount_tier)
      step 6: ledger: one CHARGE_FEE entry (+marketplace_fee_cents) per charge;
              one TIER_DISCOUNT entry (-discount_cents) when discount_cents > 0
      step 7: amount_due_cents = fee_total_cents - discount_cents
      # SUBSCRIPTION variant: steps 1-5 are skipped; a single SUBSCRIPTION_FEE
      # entry (+practice.subscription_fee_cents) is posted; charge_count = 0.
    constants:
      TIER2_COUNT: 21
      TIER2_PCT: 0.20
      TIER1_COUNT: 11
      TIER1_PCT: 0.10
    precision: "integer cents; round_half_up for the discount"
    note: "Worked example: 11 charges of fee 1500 -> fee_total 16500, tier 0.10, discount 1650, amount_due 14850."
    variants:
      - name: subscription_mode
        when: "practice.billing_mode == SUBSCRIPTION"
        difference: "single SUBSCRIPTION_FEE ledger entry of subscription_fee_cents; per-booking charges are never swept"

  - name: calc_payout_reconciliation
    trigger: "POST /marketplace/billing/generate-invoices (fields stamped on the new Invoice)"
    algorithm: aggregation
    formula: |
      payout_provisional_cents = sum(charge.net_to_practice_cents) over swept charges
      payout_final_cents = sum(charge.gross_cents) - amount_due_cents - sum(charge.processing_cents)
      # Identity: payout_final_cents == payout_provisional_cents + discount_cents
    precision: "integer cents"
    variants:
      - name: provisional
        when: "per-charge view (provisional)"
        difference: "sums per-charge net amounts; tier discount NOT credited back"
      - name: final
        when: "invoice-level view (final)"
        difference: "credits the tier discount back; identical inputs yield payout_final - payout_provisional == discount_cents > 0 whenever a tier applies"
    note: "Worked example: 11 charges, gross 10000 each -> provisional 11*8180=89980, final 110000-14850-3520=91630, delta 1650 == discount."

  - name: calc_reliability
    trigger: "strike appended (NO_SHOW / LATE_CANCEL), booking COMPLETED (+10 recovery), or POST /marketplace/ops/run-epoch (strike aging)"
    algorithm: decay_function
    formula: |
      active_strikes = [s for s in patient.strikes if s.epoch >= current_epoch - 3]
      provisional_score = clamp(100 - sum(s.magnitude for s in active_strikes), 0, 100)
      reliability_score = clamp(100 - sum(s.magnitude for s in active_strikes) + 10 * patient.recovery_count, 0, 100)
      At epoch run: nothing is deleted; strikes simply fall out of the window as
      current_epoch advances, so both scores are recomputed for every patient
      with at least one strike.
    constants:
      NO_SHOW_MAGNITUDE: 25
      LATE_CANCEL_MAGNITUDE: 15
      RECOVERY_PER_COMPLETION: 10
      WINDOW_EPOCHS: 4
      GATE_THRESHOLD: 50
      INITIAL_EPOCH: 1
    precision: "integer"
    variants:
      - name: provisional_window_only
        when: "provisional_score"
        difference: "ignores recovery_count entirely — pure windowed strike view"
      - name: effective_with_recovery
        when: "reliability_score (used by the booking gate)"
        difference: "adds +10 per completed visit; identical strike data yields a HIGHER effective score, e.g. 1 strike + 1 recovery -> provisional 75 vs effective 85"
    note: "Gate: booking creation requires reliability_score >= 50 (boundary: exactly 50 passes, 49 fails)."

  - name: calc_attribution_window
    trigger: "booking creation"
    algorithm: interval_merge
    formula: |
      window = [booking.created_at - 90 days, booking.created_at)   # closed-lower, open-upper
      matches = ContactEvents with patient_id = booking.patient_id
                AND (practice_id = booking.practice_id OR provider_id = booking.provider_id)
                AND contacted_at in window
      attribution_status = ORGANIC if len(matches) >= 1 else ATTRIBUTED
      # Boundary: contacted_at exactly == created_at - 90 days is INSIDE the
      # window (ORGANIC); one second earlier is OUTSIDE (ATTRIBUTED).
    constants:
      WINDOW_DAYS: 90
    precision: "second-precision timestamps; closed-lower / open-upper comparison"

  - name: calc_lead_time
    trigger: "booking creation"
    algorithm: threshold
    formula: |
      lead_hours = provider.lead_time_override_hours if not null
                   else (practice.new_patient_lead_time_hours if is_new_patient
                         else practice.existing_patient_lead_time_hours)
      require slot.start_at - now >= lead_hours * 3600 seconds
      # Boundary: exactly lead_hours passes (>=), one second less fails.
      is_new_patient = (count of patient's COMPLETED bookings with this practice == 0)
    precision: "second precision"

  - name: calc_cancellation_policy
    trigger: "POST /marketplace/bookings/{booking_id}/cancel"
    algorithm: threshold
    formula: |
      hours_before = (booking.start_at - now) / 3600 seconds
      if hours_before >= 24: free cancel, late_cancel = false, no strike
      elif hours_before >= 2: cancel allowed, late_cancel = true, LATE_CANCEL strike (magnitude 15)
      else: reject with ERR_CANCELLATION_TOO_LATE
      # Boundaries: exactly 24h -> free; exactly 2h -> late strike; 1h59m59s -> rejected.
    precision: "second precision"

  - name: calc_audit_severity
    trigger: "POST /marketplace/audit-cases/{case_id}/run"
    algorithm: weighted_scoring
    formula: |
      inspected items (deterministic order — slots by created_at ASC first,
      then attestations by created_at ASC for FULL scope; first 20 items):
        AVAILABILITY: provider's slots
        INSURANCE: provider's attestations
        FULL: slots then attestations, combined, capped at 20
      mismatch predicates:
        slot:       status == OPEN AND start_at < now            (TIME_TRAVEL_SLOT)
        attestation: status == VERIFIED AND effective_to <= now  (INSURANCE_STALE)
      sampled_count = number of inspected items
      mismatch_count = number of inspected items matching a predicate
      mismatch_rate = mismatch_count / max(1, sampled_count)
      severity = CRITICAL if mismatch_rate > 0.20 else (WARN if mismatch_rate > 0.05 else CLEAN)
      status: mismatch_count == 0 -> CLOSED_CLEAN else FINDINGS_OPEN
      # Boundary with 20 samples: 1/20 = 0.05 -> CLEAN; 2/20 = 0.10 -> WARN;
      # 4/20 = 0.20 -> WARN; 5/20 = 0.25 -> CRITICAL.
    constants:
      SAMPLE_CAP: 20
      WARN_THRESHOLD: 0.05
      CRITICAL_THRESHOLD: 0.20
    precision: "rate compared with strict >"

  - name: calc_slot_overlap
    trigger: "slot creation (single or inside bulk-publish)"
    algorithm: interval_merge
    formula: |
      Slot intervals are HALF-OPEN [start_at, end_at) on one provider.
      overlap(a, b) = a.start_at < b.end_at AND b.start_at < a.end_at
      A new slot is rejected (ERR_SLOT_OVERLAP) when it overlaps any existing
      slot of the same provider with status in {OPEN, BOOKED}.
      Adjacent slots (a.end_at == b.start_at) do NOT overlap.
      CLOSED slots never block.
    precision: "second precision; half-open interval semantics"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must be listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: business_constraint
    check: "Request schema: required fields present, types correct, enum values valid, rating in 1..5, end_at > start_at, attestation effective_to > effective_from"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints with a request body

  - priority: 4
    category: business_constraint
    check: "Ownership scope: Patient may only act on own bookings/reviews/complaints/record (X-User-ID == patient_id); PracticeStaff only on own practice's resources (X-User-ID == practice_id); Provider only on self (X-User-ID == provider_id)"
    error_id: ERR_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: all mutating endpoints and role-restricted reads

  - priority: 5
    category: existence
    check: "Path ids, then body-referenced ids, must exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_PRACTICE_NOT_FOUND, ERR_PROVIDER_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_PATIENT_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_ATTESTATION_NOT_FOUND, ERR_COMPLAINT_NOT_FOUND, ERR_REVIEW_NOT_FOUND, ERR_INVOICE_NOT_FOUND, ERR_CHARGE_NOT_FOUND, ERR_AUDIT_CASE_NOT_FOUND, ERR_TYPE_NOT_FOUND)"
    http_status: 404
    applies_to: all endpoints with resource ids

  - priority: 6
    category: state
    check: "Target entity must be in a state from which the requested transition exists (per §1.2); includes slot OPEN for booking, invoice ISSUED for dispute/pay/write-off, complaint UNDER_REVIEW for resolve"
    error_id: "ERR_INVALID_STATE | ERR_SLOT_NOT_OPEN | ERR_BOOKING_NOT_CANCELLABLE | ERR_INVOICE_NOT_DISPUTABLE | ERR_INVOICE_NOT_PAYABLE | ERR_COMPLAINT_NOT_OPEN"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: business_temporal
    check: "Temporal rules: slot.start_at > now at creation (ERR_SLOT_IN_PAST); lead time at booking (ERR_LEAD_TIME_VIOLATION); cancellation window >= 2h (ERR_CANCELLATION_TOO_LATE); no-show only at/after start (ERR_NO_SHOW_TOO_EARLY)"
    error_id: "ERR_SLOT_IN_PAST | ERR_LEAD_TIME_VIOLATION | ERR_CANCELLATION_TOO_LATE | ERR_NO_SHOW_TOO_EARLY"
    http_status: 422
    applies_to: "slot creation, booking creation, booking cancel, mark-no-show"

  - priority: 8
    category: business_constraint
    check: "Constraint rules: insurance plan accepted = VERIFIED attestation with now in [effective_from, effective_to) when insurance_plan_id given (ERR_PLAN_NOT_ACCEPTED); appointment type ACTIVE and belongs to slot's provider (ERR_TYPE_MAPPING_MISSING); new-patient type gate (ERR_NEW_PATIENT_TYPE_BLOCKED); reliability_score >= 50 (ERR_RELIABILITY_GATE); slot overlap (ERR_SLOT_OVERLAP); duplicate ATTESTED/VERIFIED attestation for (provider, plan) (ERR_DUPLICATE_ATTESTATION); one review per booking (ERR_DUPLICATE_REVIEW); VERIFIED visit required for review (ERR_VISIT_NOT_VERIFIED); OCC expected version match (ERR_STALE_VERSION)"
    error_id: "ERR_PLAN_NOT_ACCEPTED | ERR_TYPE_MAPPING_MISSING | ERR_NEW_PATIENT_TYPE_BLOCKED | ERR_RELIABILITY_GATE | ERR_SLOT_OVERLAP | ERR_DUPLICATE_ATTESTATION | ERR_DUPLICATE_REVIEW | ERR_VISIT_NOT_VERIFIED | ERR_STALE_VERSION"
    http_status: 422
    applies_to: "booking creation, review creation, attestation creation, slot creation/bulk-publish, patient PATCH"
    note: "ERR_RELIABILITY_GATE returns 403 and ERR_STALE_VERSION returns 412 despite sharing this priority band"

  - priority: 9
    category: business_fiscal
    check: "Fiscal rules: billing-mode switch blocked while BILLABLE charges exist (ERR_PENDING_CHARGES); dispute/charge operations require PER_BOOKING mode (ERR_BILLING_MODE_MISMATCH); provider/practice must be ACTIVE for slot publication (ERR_PRACTICE_NOT_ACTIVE / ERR_PROVIDER_NOT_BOOKABLE)"
    error_id: "ERR_PENDING_CHARGES | ERR_BILLING_MODE_MISMATCH | ERR_PRACTICE_NOT_ACTIVE | ERR_PROVIDER_NOT_BOOKABLE"
    http_status: 402
    applies_to: "billing-mode switch, generate-invoices, invoice dispute, slot creation"
    note: "ERR_PRACTICE_NOT_ACTIVE and ERR_PROVIDER_NOT_BOOKABLE return 409 despite sharing this fiscal priority band; on slot creation the provider-status check (ERR_PROVIDER_NOT_BOOKABLE) precedes the practice-status check (ERR_PRACTICE_NOT_ACTIVE); invoice dispute against an invoice of a SUBSCRIPTION-mode practice raises ERR_BILLING_MODE_MISMATCH (402) after existence and state checks"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving / ops ---
  - method: POST
    path: "/marketplace/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and NEVER falls back to wall-clock time."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  - method: POST
    path: "/marketplace/ops/run-epoch"
    description: "Advance the reliability epoch by 1; strikes with epoch < current_epoch - 3 age out of the active window and every patient with strikes is rescored (calc_reliability). Also expires VERIFIED attestations whose effective_to <= now."
    roles: [OpsAdmin]
    code: 200
    input: []
    output: { epoch: integer, decayed_strikes: integer, patients_updated: integer }
    side_effects: ["strike window advance", "reliability recompute", "attestation auto-expiry"]

  # --- Practice ---
  - method: POST
    path: "/marketplace/practices"
    description: "Create a practice (status DRAFT)"
    roles: [OpsAdmin]
    code: 201
    input: [name, timezone, "billing_mode?", "subscription_fee_cents?", "new_patient_lead_time_hours?", "existing_patient_lead_time_hours?"]
    output: Practice
    side_effects: []

  - method: GET
    path: "/marketplace/practices"
    description: "List practices"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Practice[]"
    side_effects: []

  - method: GET
    path: "/marketplace/practices/{practice_id}"
    description: "Get a practice"
    roles: [Any]
    code: 200
    input: []
    output: Practice
    side_effects: []

  - method: POST
    path: "/marketplace/practices/{practice_id}/activate"
    description: "DRAFT -> ACTIVE"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Practice
    side_effects: ["status -> ACTIVE", "recompute providers' bookable_in_directory"]

  - method: POST
    path: "/marketplace/practices/{practice_id}/suspend"
    description: "ACTIVE -> SUSPENDED"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Practice
    side_effects: ["status -> SUSPENDED", "recompute providers' bookable_in_directory"]

  - method: POST
    path: "/marketplace/practices/{practice_id}/reinstate"
    description: "SUSPENDED -> ACTIVE"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Practice
    side_effects: ["status -> ACTIVE", "recompute providers' bookable_in_directory"]

  - method: POST
    path: "/marketplace/practices/{practice_id}/delist"
    description: "ACTIVE|SUSPENDED -> DELISTED; cascades to providers and their future OPEN slots"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Practice
    side_effects: ["status -> DELISTED", "providers -> DELISTED", "future OPEN slots -> CLOSED (PROVIDER_SUSPENDED)"]

  - method: POST
    path: "/marketplace/practices/{practice_id}/billing-mode"
    description: "Switch PER_BOOKING <-> SUBSCRIPTION; blocked while any BILLABLE charge exists for the practice (ERR_PENDING_CHARGES)"
    roles: [OpsAdmin]
    code: 200
    input: [billing_mode]
    output: Practice
    side_effects: ["billing_mode updated"]

  # --- Provider ---
  - method: POST
    path: "/marketplace/providers"
    description: "Create a provider under the acting practice (status PENDING); practice_id must equal X-User-ID"
    roles: [PracticeStaff]
    code: 201
    input: [practice_id, display_name, specialty, "lead_time_override_hours?"]
    output: Provider
    side_effects: []

  - method: GET
    path: "/marketplace/providers"
    description: "Directory search. plan_id filter keeps only providers with a VERIFIED attestation for that plan where now in [effective_from, effective_to). bookable_only=true keeps only bookable_in_directory == true."
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "specialty?", "plan_id?", "bookable_only?", "practice_id?"]
    output: "Provider[]"
    side_effects: []

  - method: GET
    path: "/marketplace/providers/{provider_id}"
    description: "Get a provider"
    roles: [Any]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: POST
    path: "/marketplace/providers/{provider_id}/activate"
    description: "PENDING -> ACTIVE; requires owning practice ACTIVE"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: ["status -> ACTIVE", "recompute bookable_in_directory"]

  - method: POST
    path: "/marketplace/providers/{provider_id}/suspend"
    description: "ACTIVE -> SUSPENDED; closes future OPEN slots"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: ["status -> SUSPENDED", "future OPEN slots -> CLOSED (PROVIDER_SUSPENDED)", "bookable_in_directory -> false"]

  - method: POST
    path: "/marketplace/providers/{provider_id}/reinstate"
    description: "SUSPENDED -> ACTIVE; requires owning practice ACTIVE"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: ["status -> ACTIVE", "recompute bookable_in_directory"]

  - method: POST
    path: "/marketplace/providers/{provider_id}/delist"
    description: "ACTIVE|SUSPENDED -> DELISTED; closes future OPEN slots"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: ["status -> DELISTED", "future OPEN slots -> CLOSED (PROVIDER_SUSPENDED)"]

  # --- Slots ---
  - method: POST
    path: "/marketplace/providers/{provider_id}/slots"
    description: "Publish one OPEN slot (calendar write-back). Provider must be bookable (provider ACTIVE and practice ACTIVE); start_at must be in the future; no half-open overlap with existing OPEN/BOOKED slots."
    roles: [Provider, PracticeStaff]
    code: 201
    input: [start_at, end_at]
    output: Slot
    side_effects: ["increments Provider.version by 1"]

  - method: POST
    path: "/marketplace/providers/{provider_id}/slots/bulk-publish"
    description: "Calendar sync push: atomically create the given slots and CLOSE every future OPEN slot of the provider not present in the payload (supersede semantics). OCC-guarded on Provider.version."
    roles: [Provider, PracticeStaff]
    code: 200
    input: [slots, expected_provider_version]
    output: { created_count: integer, closed_count: integer }
    side_effects: ["create slots (each overlap-checked)", "close superseded future OPEN slots (PROVIDER_CLOSED)", "increments Provider.version by 1"]

  - method: GET
    path: "/marketplace/slots"
    description: "Search slots with filters"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "provider_id?", "status?", "from?", "to?"]
    output: "Slot[]"
    side_effects: []

  - method: GET
    path: "/marketplace/slots/{slot_id}"
    description: "Get a slot"
    roles: [Any]
    code: 200
    input: []
    output: Slot
    side_effects: []

  - method: POST
    path: "/marketplace/slots/{slot_id}/close"
    description: "OPEN -> CLOSED with close_reason PROVIDER_CLOSED"
    roles: [Provider, PracticeStaff]
    code: 200
    input: []
    output: Slot
    side_effects: ["status -> CLOSED"]

  # --- Appointment types ---
  - method: POST
    path: "/marketplace/providers/{provider_id}/appointment-types"
    description: "Map a marketplace appointment type to a practice scheduling template"
    roles: [Provider, PracticeStaff]
    code: 201
    input: [code, display_name, duration_minutes, booked_copay_cents, "accepts_new_patients?"]
    output: AppointmentType
    side_effects: []

  - method: GET
    path: "/marketplace/appointment-types"
    description: "List appointment types"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "provider_id?", "status?"]
    output: "AppointmentType[]"
    side_effects: []

  - method: GET
    path: "/marketplace/appointment-types/{type_id}"
    description: "Get an appointment type"
    roles: [Any]
    code: 200
    input: []
    output: AppointmentType
    side_effects: []

  - method: POST
    path: "/marketplace/appointment-types/{type_id}/retire"
    description: "ACTIVE -> RETIRED; existing bookings keep their pinned copay"
    roles: [Provider, PracticeStaff]
    code: 200
    input: []
    output: AppointmentType
    side_effects: ["status -> RETIRED"]

  # --- Insurance plans ---
  - method: POST
    path: "/marketplace/insurance-plans"
    description: "Create an insurance plan (status ACTIVE); plan_code unique"
    roles: [OpsAdmin]
    code: 201
    input: [carrier, plan_name, plan_code]
    output: InsurancePlan
    side_effects: []

  - method: GET
    path: "/marketplace/insurance-plans"
    description: "List insurance plans"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "carrier?", "status?"]
    output: "InsurancePlan[]"
    side_effects: []

  - method: GET
    path: "/marketplace/insurance-plans/{plan_id}"
    description: "Get an insurance plan"
    roles: [Any]
    code: 200
    input: []
    output: InsurancePlan
    side_effects: []

  - method: POST
    path: "/marketplace/insurance-plans/{plan_id}/retire"
    description: "ACTIVE -> RETIRED"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: InsurancePlan
    side_effects: ["status -> RETIRED"]

  # --- Attestations ---
  - method: POST
    path: "/marketplace/attestations"
    description: "Provider attests acceptance of a plan over [effective_from, effective_to). Rejects duplicates with an existing ATTESTED/VERIFIED attestation for the same (provider, plan)."
    roles: [Provider, PracticeStaff]
    code: 201
    input: [provider_id, plan_id, effective_from, effective_to]
    output: Attestation
    side_effects: []

  - method: GET
    path: "/marketplace/attestations"
    description: "List attestations"
    roles: [OpsAdmin, Provider, PracticeStaff]
    code: 200
    input: ["limit?", "offset?", "provider_id?", "plan_id?", "status?"]
    output: "Attestation[]"
    side_effects: []

  - method: GET
    path: "/marketplace/attestations/{attestation_id}"
    description: "Get an attestation"
    roles: [OpsAdmin, Provider, PracticeStaff]
    code: 200
    input: []
    output: Attestation
    side_effects: []

  - method: POST
    path: "/marketplace/attestations/{attestation_id}/verify"
    description: "decision VERIFY: ATTESTED -> VERIFIED (requires plan ACTIVE); decision REJECT: ATTESTED -> REJECTED"
    roles: [OpsAdmin]
    code: 200
    input: [decision]
    output: Attestation
    side_effects: ["status transition", "verified_by set on VERIFY"]

  # --- Patients ---
  - method: POST
    path: "/marketplace/patients"
    description: "Register a patient (reliability_score and provisional_score start at 100)"
    roles: [Anonymous]
    code: 201
    input: [full_name, email, "plan_id?"]
    output: Patient
    side_effects: []

  - method: GET
    path: "/marketplace/patients/{patient_id}"
    description: "Get a patient (self or OpsAdmin)"
    roles: [Patient, OpsAdmin]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/marketplace/patients"
    description: "List patients (oversight); plan_id? filters by declared insurance plan"
    roles: [OpsAdmin]
    code: 200
    input: ["limit?", "offset?", "plan_id?"]
    output: "Patient[]"
    side_effects: []

  - method: PATCH
    path: "/marketplace/patients/{patient_id}"
    description: "Update the patient's insurance plan; OCC-guarded on Patient.version"
    roles: [Patient]
    code: 200
    input: ["plan_id?", expected_patient_version]
    output: Patient
    side_effects: ["plan_id updated", "increments Patient.version by 1"]

  # --- Contact events ---
  - method: POST
    path: "/marketplace/contact-events"
    description: "Record a pre-existing patient contact (CRM write-back); practice_id is taken from the acting PracticeStaff X-User-ID"
    roles: [PracticeStaff]
    code: 201
    input: [patient_id, "provider_id?", contacted_at, channel]
    output: ContactEvent
    side_effects: []

  - method: GET
    path: "/marketplace/contact-events"
    description: "List contact events"
    roles: [PracticeStaff, OpsAdmin]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "practice_id?", "provider_id?"]
    output: "ContactEvent[]"
    side_effects: []

  - method: GET
    path: "/marketplace/contact-events/{event_id}"
    description: "Get a contact event"
    roles: [PracticeStaff, OpsAdmin]
    code: 200
    input: []
    output: ContactEvent
    side_effects: []

  # --- Bookings ---
  - method: POST
    path: "/marketplace/slots/{slot_id}/bookings"
    description: "Book an OPEN slot. Runs the full validation chain (ownership, slot OPEN, temporal lead time, plan acceptance, type mapping, new-patient gate, reliability gate), computes attribution and fee split, creates a Charge when ATTRIBUTED and PER_BOOKING, and writes back Slot OPEN -> BOOKED."
    roles: [Patient]
    code: 201
    input: [patient_id, appointment_type_id, "insurance_plan_id?"]
    output: Booking
    side_effects:
      - "Slot OPEN -> BOOKED, current_booking_id set"
      - "calc_attribution_window -> attribution_status"
      - "calc_fee_split -> Charge created when ATTRIBUTED and practice PER_BOOKING"
      - "is_new_patient computed from prior COMPLETED bookings at this practice"

  - method: GET
    path: "/marketplace/bookings"
    description: "List bookings"
    roles: [Patient, PracticeStaff, OpsAdmin]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "provider_id?", "slot_id?", "practice_id?", "appointment_type_id?", "insurance_plan_id?", "status?"]
    output: "Booking[]"
    side_effects: []

  - method: GET
    path: "/marketplace/bookings/{booking_id}"
    description: "Get a booking"
    roles: [Patient, PracticeStaff, OpsAdmin]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: POST
    path: "/marketplace/bookings/{booking_id}/cancel"
    description: "CONFIRMED -> CANCELLED per calc_cancellation_policy; releases the slot BOOKED -> OPEN; may append a LATE_CANCEL strike and fire the reliability-gate cascade"
    roles: [Patient, PracticeStaff]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> CANCELLED", "late_cancel + strike when 2 <= hours_before < 24", "Slot BOOKED -> OPEN", "reliability-gate cascade when score drops below 50"]

  - method: POST
    path: "/marketplace/bookings/{booking_id}/check-in"
    description: "CONFIRMED -> CHECKED_IN"
    roles: [PracticeStaff]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> CHECKED_IN"]

  - method: POST
    path: "/marketplace/bookings/{booking_id}/complete"
    description: "CHECKED_IN -> COMPLETED; creates the VERIFIED VisitRecord and grants a +10 reliability recovery"
    roles: [PracticeStaff]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> COMPLETED", "VisitRecord created", "Patient.recovery_count += 1, reliability recomputed", "Slot BOOKED -> CLOSED"]

  - method: POST
    path: "/marketplace/bookings/{booking_id}/mark-no-show"
    description: "CONFIRMED -> NO_SHOW (only at/after start_at); appends a NO_SHOW strike, recomputes reliability, fires the reliability-gate cascade below 50"
    roles: [PracticeStaff]
    code: 200
    input: []
    output: Booking
    side_effects: ["status -> NO_SHOW", "NO_SHOW strike (magnitude 25)", "reliability-gate cascade", "Slot BOOKED -> CLOSED"]

  # --- Charges ---
  - method: GET
    path: "/marketplace/charges"
    description: "List charges"
    roles: [OpsAdmin, PracticeStaff]
    code: 200
    input: ["limit?", "offset?", "booking_id?", "practice_id?", "invoice_id?", "status?"]
    output: "Charge[]"
    side_effects: []

  - method: GET
    path: "/marketplace/charges/{charge_id}"
    description: "Get a charge"
    roles: [OpsAdmin, PracticeStaff]
    code: 200
    input: []
    output: Charge
    side_effects: []

  # --- Billing / invoices ---
  - method: POST
    path: "/marketplace/billing/generate-invoices"
    description: "Sweep a practice's BILLABLE charges whose booking.created_at falls in period (YYYY-MM) into a new ISSUED invoice with tier discount (calc_invoice_aggregate); SUBSCRIPTION practices get a single flat SUBSCRIPTION_FEE entry"
    roles: [OpsAdmin]
    code: 201
    input: [practice_id, period]
    output: Invoice
    side_effects: ["BILLABLE charges -> INVOICED with invoice_id set", "CHARGE_FEE + TIER_DISCOUNT ledger entries", "calc_payout_reconciliation fields stamped"]

  - method: GET
    path: "/marketplace/invoices"
    description: "List invoices"
    roles: [OpsAdmin, PracticeStaff]
    code: 200
    input: ["limit?", "offset?", "practice_id?", "status?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/marketplace/invoices/{invoice_id}"
    description: "Get an invoice"
    roles: [OpsAdmin, PracticeStaff]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/marketplace/invoices/{invoice_id}/dispute"
    description: "ISSUED -> DISPUTED; named charges must exist, belong to this invoice, and be INVOICED; each becomes DISPUTED"
    roles: [PracticeStaff]
    code: 200
    input: [charge_ids, reason]
    output: Invoice
    side_effects: ["status -> DISPUTED", "named charges INVOICED -> DISPUTED"]

  - method: POST
    path: "/marketplace/invoices/{invoice_id}/resolve-dispute"
    description: "DISPUTED -> ISSUED; resolutions is an array of { charge_id, action: KEEP | REMOVE } covering every DISPUTED charge exactly once; REMOVE posts a DISPUTE_CREDIT ledger entry and refunds the charge"
    roles: [OpsAdmin]
    code: 200
    input: [resolutions]
    output: Invoice
    side_effects: ["charges DISPUTED -> INVOICED (KEEP) or REFUNDED (REMOVE)", "DISPUTE_CREDIT entries", "amount_due_cents recomputed"]

  - method: POST
    path: "/marketplace/invoices/{invoice_id}/pay"
    description: "ISSUED -> PAID; requires amount_due_cents > 0; posts a PAYMENT entry of -amount_due_cents and settles all INVOICED charges"
    roles: [PracticeStaff]
    code: 200
    input: []
    output: Invoice
    side_effects: ["PAYMENT ledger entry", "amount_due_cents := 0", "INVOICED charges -> SETTLED"]

  - method: POST
    path: "/marketplace/invoices/{invoice_id}/write-off"
    description: "ISSUED -> WRITTEN_OFF; posts a WRITE_OFF entry of -amount_due_cents"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["WRITE_OFF ledger entry", "amount_due_cents := 0"]

  # --- Ledger ---
  - method: GET
    path: "/marketplace/ledger-entries"
    description: "List ledger entries"
    roles: [OpsAdmin, PracticeStaff]
    code: 200
    input: ["limit?", "offset?", "invoice_id?", "charge_id?", "entry_type?"]
    output: "LedgerEntry[]"
    side_effects: []

  - method: GET
    path: "/marketplace/ledger-entries/{entry_id}"
    description: "Get a ledger entry"
    roles: [OpsAdmin, PracticeStaff]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  # --- Complaints ---
  - method: POST
    path: "/marketplace/complaints"
    description: "File a complaint on an own booking that is not CANCELLED"
    roles: [Patient]
    code: 201
    input: [booking_id, complaint_type, "description?"]
    output: Complaint
    side_effects: []

  - method: GET
    path: "/marketplace/complaints"
    description: "List complaints"
    roles: [OpsAdmin, PracticeStaff, Patient]
    code: 200
    input: ["limit?", "offset?", "booking_id?", "provider_id?", "patient_id?", "status?"]
    output: "Complaint[]"
    side_effects: []

  - method: GET
    path: "/marketplace/complaints/{complaint_id}"
    description: "Get a complaint"
    roles: [OpsAdmin, PracticeStaff, Patient]
    code: 200
    input: []
    output: Complaint
    side_effects: []

  - method: POST
    path: "/marketplace/complaints/{complaint_id}/respond"
    description: "OPEN -> UNDER_REVIEW"
    roles: [PracticeStaff]
    code: 200
    input: [response]
    output: Complaint
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/marketplace/complaints/{complaint_id}/resolve"
    description: "UNDER_REVIEW -> RESOLVED_UPHELD | RESOLVED_DISMISSED; UPHOLD on INSURANCE_MISMATCH revokes the matching VERIFIED attestation and increments Provider.insurance_mismatch_count (>= 3 auto-suspends the provider)"
    roles: [OpsAdmin]
    code: 200
    input: [outcome, "resolution_note?"]
    output: Complaint
    side_effects: ["attestation REVOKED on UPHOLD", "insurance_mismatch_count += 1", "provider auto-suspension cascade at count >= 3"]

  # --- Reviews ---
  - method: POST
    path: "/marketplace/reviews"
    description: "Create a review; requires a VERIFIED VisitRecord for the booking and at most one review per booking; initial status PUBLISHED"
    roles: [Patient]
    code: 201
    input: [booking_id, rating, "text?"]
    output: Review
    side_effects: []

  - method: GET
    path: "/marketplace/reviews"
    description: "List reviews"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "provider_id?", "booking_id?", "patient_id?", "status?"]
    output: "Review[]"
    side_effects: []

  - method: GET
    path: "/marketplace/reviews/{review_id}"
    description: "Get a review"
    roles: [Any]
    code: 200
    input: []
    output: Review
    side_effects: []

  - method: POST
    path: "/marketplace/reviews/{review_id}/flag"
    description: "PUBLISHED -> FLAGGED"
    roles: [PracticeStaff, Provider]
    code: 200
    input: [reason]
    output: Review
    side_effects: ["status -> FLAGGED"]

  - method: POST
    path: "/marketplace/reviews/{review_id}/moderate"
    description: "action RESTORE: FLAGGED -> PUBLISHED; action REMOVE: PUBLISHED|FLAGGED -> REMOVED"
    roles: [OpsAdmin]
    code: 200
    input: [action]
    output: Review
    side_effects: ["status transition per action"]

  # --- Visit records ---
  - method: GET
    path: "/marketplace/visit-records"
    description: "List visit records"
    roles: [PracticeStaff, OpsAdmin, Patient]
    code: 200
    input: ["limit?", "offset?", "booking_id?", "provider_id?", "patient_id?"]
    output: "VisitRecord[]"
    side_effects: []

  - method: GET
    path: "/marketplace/visit-records/{record_id}"
    description: "Get a visit record"
    roles: [PracticeStaff, OpsAdmin, Patient]
    code: 200
    input: []
    output: VisitRecord
    side_effects: []

  - method: GET
    path: "/marketplace/bookings/{booking_id}/visit-records"
    description: "List visit records for a booking (0 or 1 element)"
    roles: [PracticeStaff, OpsAdmin, Patient]
    code: 200
    input: ["limit?", "offset?"]
    output: "VisitRecord[]"
    side_effects: []

  # --- Audit cases ---
  - method: POST
    path: "/marketplace/audit-cases"
    description: "Open a directory-accuracy audit case for a provider (status OPEN)"
    roles: [OpsAdmin]
    code: 201
    input: [provider_id, scope]
    output: AuditCase
    side_effects: []

  - method: GET
    path: "/marketplace/audit-cases"
    description: "List audit cases"
    roles: [OpsAdmin]
    code: 200
    input: ["limit?", "offset?", "provider_id?", "status?"]
    output: "AuditCase[]"
    side_effects: []

  - method: GET
    path: "/marketplace/audit-cases/{case_id}"
    description: "Get an audit case"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: AuditCase
    side_effects: []

  - method: POST
    path: "/marketplace/audit-cases/{case_id}/run"
    description: "Execute the sweep per calc_audit_severity; auto-closes stale slots (AUDIT_SWEEP) and auto-expires stale attestations; OPEN -> FINDINGS_OPEN or CLOSED_CLEAN"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["sampled/mismatch counts and severity computed", "findings populated", "stale slots CLOSED", "stale attestations EXPIRED"]

  - method: POST
    path: "/marketplace/audit-cases/{case_id}/resolve-finding"
    description: "Mark one finding (by finding_index) resolved"
    roles: [OpsAdmin]
    code: 200
    input: [finding_index, resolution_note]
    output: AuditCase
    side_effects: ["findings[finding_index].resolved := true"]

  - method: POST
    path: "/marketplace/audit-cases/{case_id}/close"
    description: "FINDINGS_OPEN -> CLOSED; requires every finding resolved (ERR_UNRESOLVED_FINDINGS)"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["status -> CLOSED"]

