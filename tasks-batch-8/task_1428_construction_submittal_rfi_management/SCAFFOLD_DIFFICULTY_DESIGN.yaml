  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers; depths >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: accept_impact_schedule_cascade_depth4
        grounds:
          - state_machines.ImpactAssessment.status.PRICED_to_ACCEPTED
          - calculations.submittal_required_dates
          - calculations.escalation_level
        distinguishing_aspect: |
          Depth-4 cascade from POST accept: assessment accept shifts PLANNED activities (+7d),
          the activity shift moves the submittal's required_on_site_date (recomputing
          required_approval 2026-07-06 / required_submission 2026-06-22), the date move
          recomputes the long-lead item (days_late 6 -> 0, level 1 -> 0), and the tier drop
          appends an LLI_ESCALATION_CLEARED event.
        test_recipe:
          setup:
            - "Project ACTIVE (contingency 2000000); sub C1; reviewer R1 ARCH"
            - "Long-lead section (lead 35, review 10, need 2026-08-15) -> submittal S + LLI; clock advanced to 2026-08-21 and scanned (LLI days_late 6, level 1)"
            - "PLANNED activity A on S/C1 window [2026-09-01, 2026-09-10)"
            - "RFI on S answered with cost flag (est 100000) + schedule flag (7 days); assessment priced at 100000 (final 117810)"
