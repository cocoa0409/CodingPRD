          trigger:
            - call: "GET /fountain-network/outlets/00000000-0000-0000-0000-000000000000"
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "${err} == \"ERR_OUTLET_NOT_FOUND\""

