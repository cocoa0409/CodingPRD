  # =======================================================================
  # Rule 5 - validation priority conflicts across different category pairs
  # =======================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: cancelled_turn_state_beats_lapsed_certification_safety
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - errors[ERR_TURN_NOT_ASSIGNABLE]
          - errors[ERR_CERT_NOT_CURRENT]
          - calculations.certification_currency
        distinguishing_aspect: |
          Category pair STATE (priority 10) versus BUSINESS_SAFETY (priority 12): one request
          violates both, and the response must be ERR_TURN_NOT_ASSIGNABLE with HTTP 409, never
          ERR_CERT_NOT_CURRENT with HTTP 422.
        test_recipe:
          setup:
            - "Station ZRH is OPEN, season SUMMER; the logical clock reads 2026-04-01T00:00:00Z."
            - "Agent E001's only RAMP_SAFETY endorsement at ZRH ran 2026-01-01 to 2026-02-01 and is therefore LAPSED at the requested occupation start."
            - "Turn LX318 was created SCHEDULED and then CANCELLED, so it no longer admits resources."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t1_id: $.data.id }
            - call: "POST /agents"
              payload: { station_id: "${st_id}", employee_code: "E001", full_name: "Ana Ruiz" }
              as: StationManager
              captures: { a1_id: $.data.id }
            - call: "POST /certifications"
              payload: { agent_id: "${a1_id}", station_id: "${st_id}", cert_type: "RAMP_SAFETY", issued_at: "2026-01-01T00:00:00Z", expires_at: "2026-02-01T00:00:00Z" }
              as: StationManager
              captures: { c1_id: $.data.id }
            - call: "POST /turns/${t1_id}/lifecycle"
              payload: { action: "CANCEL", reason: "SLOT_WITHDRAWN" }
              as: DutyOfficer
            - call: "GET /turns/${t1_id}"
              payload: {}
              as: DutyOfficer
              captures: { t1_v_after: $.data.version, t1_status: $.data.status }
          trigger:
            - call: "POST /turn-resources"
              payload: { turn_id: "${t1_id}", resource_kind: "AGENT", agent_id: "${a1_id}", role_on_turn: "RAMP", window_start: "2026-04-10T05:50:00Z", window_end: "2026-04-10T06:30:00Z", expected_turn_version: "${t1_v_after}" }
              as: DutyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${t1_status} == CANCELLED"
            - "${err} == ERR_TURN_NOT_ASSIGNABLE"
            - "${err} != ERR_CERT_NOT_CURRENT"
            - "HTTP status of the trigger is 409, not 422"
            - "Certification.${c1_id}.currency_state == LAPSED"
            - "Turn.${t1_id}.assigned_agent_count == 0"
            - "Agent.${a1_id}.assigned_duty_minutes == 0"

      - name: open_critical_incident_safety_beats_penalty_cap_fiscal
        grounds:
          - validations[priority=12]
          - validations[priority=15]
          - errors[ERR_OPEN_CRITICAL_INCIDENT]
          - errors[ERR_PENALTY_CAP_BREACHED]
          - state_machines.BillingPeriod.OPEN_to_PENDING_APPROVAL
        distinguishing_aspect: |
          A DIFFERENT category pair: BUSINESS_SAFETY (priority 12) versus BUSINESS_FISCAL
          (priority 15). One FINALIZE violates both, and the safety error
          ERR_OPEN_CRITICAL_INCIDENT (409) must win; only after the critical incident is closed
          does the same call surface the fiscal ERR_PENALTY_CAP_BREACHED (422), proving both
          violations were live at once.
        test_recipe:
          setup:
            - "Station ZRH is OPEN with penalty_cap_cents 1000, otp_tolerance_minutes 15."
            - "Turn LX318 (TOWING_ONLY, scheduled 06:00-06:20) completed 06:00-06:38 with delay_code GH_EQUIPMENT, so it is DELAYED with a FINAL gross of 35700 and an OTP penalty of 4284 - far over the 1000-cent cap."
            - "BillingPeriod 2026-04 is OPEN with one PROVISIONAL line for that turn."
            - "A CRITICAL PERSONAL_INJURY incident at the station is still REPORTED (no equipment named, so no quarantine cascade)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
