        claim_type: Violation → Error
        grounds: ["validations[priority=2]", "roles.NeutralityReviewer", "errors[ERR_UNAUTHORIZED_ROLE]"]
        distinguishing_aspect: "RBAC denial precedes existence: a NeutralityReviewer hitting the coordinator-only contest creation gets ERR_UNAUTHORIZED_ROLE (403) even when the jurisdiction id in the path does not exist."
        test_recipe:
          setup: ["One reviewer volunteer exists; no jurisdiction needed (role check fires first)."]
          setup_api_calls:
            - { call: "POST /volunteers", payload: { volunteer_name: "Rhea Reviewer", chapter_code: "CH2", roles: ["REVIEWER"] }, as: LeagueAdmin, captures: { rev_id: "$.data.id" } }
          trigger:
            - { call: "POST /jurisdictions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/contests", payload: { kind: "CANDIDATE_RACE", office_name: "Mayor", filing_deadline: "2026-09-15T17:00:00Z" }, as: NeutralityReviewer, as_user_id: "${rev_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_UNAUTHORIZED_ROLE, HTTP 403 (not ERR_NOT_FOUND — priority 2 beats priority 4)"

