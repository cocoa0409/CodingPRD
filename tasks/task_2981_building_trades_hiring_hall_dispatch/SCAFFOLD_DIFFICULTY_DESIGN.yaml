              captures: { sweep_at_deadline: $.data.expired_referral_count, demoted_at_deadline: $.data.demoted_registration_count }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00.001Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/referrals/${refB_id}/accept"
