  - rule_id: resource_temporal_overlap
    instances:

      - name: serve_window_half_open_with_asymmetric_trailing_cooldown_buffer
        grounds:
          - validations.priority_61
          - errors.ERR_SERVE_WINDOW_CONFLICT
          - entities.ServingEndpoint.fields.deploy_cooldown_minutes
          - entities.Deployment.fields.serve_from
          - entities.Deployment.fields.serve_until
        distinguishing_aspect: |
          RESOURCE: ServingEndpoint, scoped per (serving_endpoint_id, pattern).
          GEOMETRY: HALF-OPEN [serve_from, serve_until) with an ASYMMETRIC TRAILING buffer of
          deploy_cooldown_minutes = 30. Consequences exercised here: a new serve_from equal to an
          existing serve_until is REJECTED (the buffer extends the incumbent forward), serve_from at
          buffer_end - 1 minute is rejected, serve_from exactly at buffer_end is accepted, and yet a
          new serve_until exactly equal to an existing serve_from is accepted with NO buffer at all
          on the leading side. The scope is per pattern, so a SHADOW deployment may occupy the exact
          same interval on the exact same endpoint as a REALTIME one.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "one APPROVED ModelVersion (feature_spec_hash fs-v1)"
            - "one OPEN ServingEndpoint with deploy_cooldown_minutes 30"
