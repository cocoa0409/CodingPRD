            - "the second payment returns 201 with license_fee_paid_cents == 382950, license_fee_settled == true and version == ${lic_v} + 2"
            - "license_fee_cents stays 382950 across both payments and label_license_status stays ACTIVE"

      - name: compliance_sweep_returns_all_zero_counts_when_nothing_is_due
        claim_type: bulk_action
        grounds:
          - endpoints[POST /fairtrade/compliance-sweeps]
          - state_machines.Nonconformity.OPEN_to_OVERDUE
        distinguishing_aspect: "A sweep run on 2026-08-05, four days before the MAJOR finding's 2026-09-15 deadline, skips every row: all seven counters are zero, the finding stays OPEN and no version anywhere is bumped, proving the sweep is a filter-and-skip bulk action rather than an unconditional writer."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z, later advanced to 2026-08-05T00:00:00Z"
            - "CERTIFIED producer with one started audit and one OPEN MAJOR finding whose deadline_at is 2026-09-15"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
