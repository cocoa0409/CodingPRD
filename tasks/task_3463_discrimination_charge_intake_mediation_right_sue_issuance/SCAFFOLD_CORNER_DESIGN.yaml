            - call: "POST /eeoc/charges"
              payload: { complainant_id: "${cmp_f1}", employer_id: "${emp_am2}", basis_codes: ["RACE"], incident_date: "2026-06-01", harm_description: "fired", employee_count_at_incident: 40 }
              as: IntakeOfficer
              captures: { chg_am2: $.data.id, chg_am2_v: $.data.version }
          trigger:
            - call: "POST /eeoc/charges/${chg_am2}/amend"
