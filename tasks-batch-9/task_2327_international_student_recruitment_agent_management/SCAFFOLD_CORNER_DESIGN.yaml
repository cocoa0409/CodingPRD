              payload: { action: "SUBMIT_FOR_SCREENING" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag1_id}", contract_ref: "CTR-001", exclusivity_model: "EXCLUSIVE_ALLOWED", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c1_id: "$.data.id", c1_v: "$.data.version" }
            - call: "POST /recruitment/contracts/${c1_id}/commission-schedules"
              payload: { effective_from: "2026-08-01", effective_to: "2027-07-31", deposit_rate_bps: 400, enrollment_rate_bps: 500, census_rate_bps: 200, persistence_rate_bps: 150, rate_cap_bps: 600, per_milestone_cap_cents: 150000, clawback_window_days: 120, expected_contract_version: "${c1_v}" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/contracts/${c1_id}/lifecycle"
              payload: { action: "SEND_FOR_SIGNATURE" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/contracts/${c1_id}/lifecycle"
              payload: { action: "AGENCY_SIGN" }
              as: AgencyOwner
              as_user_id: "${ag1_id}"
              captures: { c1_v_signed: "$.data.version" }
          trigger:
            - call: "POST /recruitment/contracts/${c1_id}/lifecycle"
              payload: { action: "AGENCY_SIGN" }
