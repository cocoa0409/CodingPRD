          establishing the inclusive boundary.
        test_recipe:
          setup:
            - "RETAIL customer; site; 1 SEDAN; order COMPLETED with completed_at == 2026-08-05T10:00:00Z (clock pinned before COMPLETE)"
          setup_api_calls:
            - { call: "POST /fleet-wash/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T10:00:00Z" }, as: PlatformAdmin }
