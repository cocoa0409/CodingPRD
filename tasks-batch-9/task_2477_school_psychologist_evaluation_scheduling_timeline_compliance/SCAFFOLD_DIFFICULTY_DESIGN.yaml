              as: IntakeCoordinator
              captures: { r2: $.data.id }
            - call: "POST /psych-services/referrals/${r2}/consent-events"
              payload: { event_type: "CONSENT_RECEIVED", effective_at: "2026-08-01T09:00:00Z", parent_signature_reference: "SIG-R-1" }
              as: IntakeCoordinator
              captures: { eval2: $.data.active_evaluation_id }
