        claim_type: role_denied
        grounds:
          - roles[BuilderRep]
          - state_machines.TakedownTranche.MISSED_to_CURED
        distinguishing_aspect: "Entity-backed identity: the cure endpoint accepts the BuilderRep role but rejects a rep whose X-User-ID names a different Builder than the agreement's builder (403 ERR_FORBIDDEN_ROLE)."
        test_recipe:
          setup: ["builder A with a MISSED tranche (deficit 1, due 2026-06-30) at clock 2026-07-10; builder B exists"]
          setup_api_calls:
            - call: "POST /mpc/communities"
              payload: { community_name: "Ownership Oaks", total_planned_units: 20 }
              as: DeclarantExecutive
              captures: { c_id: $.data.id }
            - call: "POST /mpc/communities/${c_id}/activate"
              payload: { declarant_director_names: ["D1", "D2", "D3", "D4", "D5"] }
              as: DeclarantExecutive
            - call: "POST /mpc/phases"
              payload: { community_id: "${c_id}", phase_name: "P1", sequence_no: 1, planned_lot_count: 10 }
              as: DeclarantExecutive
              captures: { p1_id: $.data.id }
            - call: "POST /mpc/phases/${p1_id}/open-sales"
              payload: {}
              as: DeclarantExecutive
            - call: "POST /mpc/builders"
              payload: { community_id: "${c_id}", legal_name: "Alpha Builders", credit_tier: "A" }
              as: DeclarantExecutive
              captures: { ba_id: $.data.id }
            - call: "POST /mpc/builders"
              payload: { community_id: "${c_id}", legal_name: "Beta Builders", credit_tier: "A" }
              as: DeclarantExecutive
              captures: { bb_id: $.data.id }
            - call: "POST /mpc/agreements"
              payload: { community_id: "${c_id}", builder_id: "${ba_id}", phase_id: "${p1_id}", base_price_per_lot_cents: 5000000, annual_escalation_pct: 6.0, penalty_per_lot_per_day_cents: 1000, earnest_money_cents: 1000000, total_lots_committed: 1 }
              as: DeclarantController
              captures: { ag_id: $.data.id }
            - call: "POST /mpc/tranches"
              payload: { agreement_id: "${ag_id}", tranche_no: 1, due_date: "2026-06-30T00:00:00Z", lot_count_due: 1 }
              as: DeclarantController
              captures: { t1_id: $.data.id }
            - call: "POST /mpc/agreements/${ag_id}/execute"
              payload: {}
              as: DeclarantExecutive
            - call: "POST /mpc/agreements/${ag_id}/commence"
              payload: {}
              as: DeclarantController
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /mpc/tranches/${t1_id}/cure"
              payload: { payment_cents: 10000 }
              as: BuilderRep
              as_user_id: "${bb_id}"
              captures: { err: $.data.error_id }
            - call: "POST /mpc/tranches/${t1_id}/cure"
              payload: { payment_cents: 10000 }
              as: BuilderRep
              as_user_id: "${ba_id}"
              captures: { ok_status: $.data.status }
          assert:
            - "builder B's rep curing builder A's tranche -> ${err} == ERR_FORBIDDEN_ROLE (403)"
            - "builder A's rep with the exact penalty -> ${ok_status} == CURED"

      - name: rsvp_cancel_ownership_enforced
        claim_type: role_denied
        grounds:
          - roles[HomeownerResident]
          - state_machines.EventRsvp.CONFIRMED_to_CANCELLED
        distinguishing_aspect: "A resident cannot cancel another resident's RSVP (403 ERR_FORBIDDEN_ROLE); the LifestyleCoordinator can (shared operation)."
        test_recipe:
          setup: ["ACTIVE community; SCHEDULED SALES_CENTER event (capacity 10); residents r1, r2; r1 has a CONFIRMED RSVP"]
          setup_api_calls:
            - call: "POST /mpc/communities"
