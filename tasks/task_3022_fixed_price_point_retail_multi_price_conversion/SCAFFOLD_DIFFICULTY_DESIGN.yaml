  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:

      - name: item_delete_review_round_trip_and_pristine_release
        grounds:
          - state_machines.Item.COST_PENDING_to_DELETE_REVIEW
          - state_machines.Item.DELETE_REVIEW_to_ACTIVE
          - state_machines.Item.COST_PENDING_to_ACTIVE
          - state_machines.Item.PRICE_ASSIGNED_to_COST_PENDING
          - state_machines.Item.PRICE_ASSIGNED_to_DENOMINATED
        distinguishing_aspect: "Two cycles on two different Item paths: the COST_PENDING → DELETE_REVIEW → COST_PENDING revision loop driven by a vendor price change (each round appends a cost row rather than restoring the old one), and the PRICE_ASSIGNED → DENOMINATED rollback that is only legal while the item has taken no cost row at all — so the DENOMINATED revert is refused once the item has entered the loop."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. One ACTIVE price point at 125 cents, one import vendor, one item SKU 5001 in DENOMINATED with base_landed_cost_cents 115."
            - "One item SKU 5002 also in DENOMINATED with base_landed_cost_cents 125."
          setup_api_calls:
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/vendors"
              payload: { vendor_name: "Ningbo Home Goods Co", country_of_origin: "CN", import_flag: true }
              as: MerchandiseBuyer
              captures: { vendor_x_id: $.data.id }
            - call: "POST /merchandise/items"
              payload: { sku: "5001", description: "Dish Brush 4ct", unit_retail_cents: 125, commodity_class: "KITCHEN", season_code: "HARVEST_2026", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 115, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i5001_id: $.data.id }
            - call: "POST /merchandise/items/${i5001_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items"
              payload: { sku: "5002", description: "Sponge 4ct", unit_retail_cents: 125, commodity_class: "KITCHEN", season_code: "HARVEST_2026", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 125, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i5002_id: $.data.id }
          trigger:
            - call: "POST /merchandise/items/${i5001_id}/landed-costs"
              payload: { method: "VENDOR_PRICE_CHANGE", applied_amount_cents: 120 }
              as: MerchandiseBuyer
              captures: { h_round1: $.data.id }
            - call: "GET /merchandise/items/${i5001_id}"
              payload: {}
              as: MerchandiseBuyer
              captures: { st_round1: $.data.status }
            - call: "POST /merchandise/items/${i5001_id}/landed-costs"
              payload: { method: "VENDOR_PRICE_CHANGE", applied_amount_cents: 115 }
              as: MerchandiseBuyer
              captures: { h_round2: $.data.id }
            - call: "GET /merchandise/items/${i5001_id}"
              payload: {}
              as: MerchandiseBuyer
              captures: { v_before_activate: $.data.version }
            - call: "POST /merchandise/items/${i5001_id}/activations"
              payload: {}
              as: MerchandiseBuyer
              captures: { v_after_activate: $.data.version }
            - call: "POST /merchandise/items/${i5002_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items/${i5002_id}/landed-costs"
              payload: { method: "VENDOR_PRICE_CHANGE", applied_amount_cents: 125 }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items/${i5002_id}/price-assignment-release"
              payload: {}
              as: MerchandiseBuyer
              captures: { err_release: $.data.error_id }
          assert:
            - "st_round1 == DELETE_REVIEW — the 120-cent revision round pushed the item into deletion review"
            - "h_round2 > h_round1 and Item.${i5001_id}.status == ACTIVE — the SAME endpoint walked the item back out of the review and the activation then cleared it"
            - "Item.${i5001_id}.status == ACTIVE and Item.${i5001_id}.landed_cost_cents == 115"
            - "GET /merchandise/items/${i5001_id}/landed-costs returns exactly 2 rows — each revision round appended a row, none was overwritten"
            - "v_after_activate > v_before_activate — each mutation including the activation advanced Item.version"
            - "the release call returns 409 and err_release == ERR_ITEM_NOT_PRICE_ASSIGNED, because SKU 5002 left PRICE_ASSIGNED when its landed cost row pushed it into COST_PENDING"
            - "Item.${i5002_id}.status == COST_PENDING — DENOMINATED is unreachable again once any cost row exists"

      - name: store_conversion_reverts_through_a_rollback_edge
        grounds:
          - state_machines.Store.SINGLE_PRICE_to_CONVERTING
          - state_machines.Store.CONVERTING_to_SINGLE_PRICE
          - state_machines.Store.MULTI_PRICE_to_REVERTING
          - state_machines.Store.REVERTING_to_SINGLE_PRICE
          - state_machines.ConversionProject.IN_PROGRESS_to_ROLLBACK
        distinguishing_aspect: "Branching fork-join with a revert: a CONVERTING store can reach MULTI_PRICE through the completion branch or fall back to its SELF-0 state through the rollback branch, and a store that already reached MULTI_PRICE can be pulled back through the separate MULTI_PRICE → REVERTING → SINGLE_PRICE path — so SINGLE_PRICE is a state the machine returns to, not a starting point only."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. Two ACTIVE price points: 125 cents and 300 cents. One store with shelf_facing_capacity_sqft 400."
          setup_api_calls:
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/price-points"
              payload: { label: "THREE_DOLLAR_25", shelf_price_cents: 300, target_landed_cost_ratio: 0.40 }
              as: MerchandiseBuyer
              captures: { pp300_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp300_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id, store_v0: $.data.version }
          trigger:
            - call: "POST /merchandise/stores/${store_id}/conversions"
              payload: { to_price_point_id: "${pp300_id}" }
              as: StoreOperationsManager
              captures: { store_v_after_start: $.data.version }
            - call: "POST /merchandise/stores/${store_id}/conversions"
              payload: { to_price_point_id: "${pp125_id}" }
              as: StoreOperationsManager
              captures: { err_double: $.data.error_id }
            - call: "POST /merchandise/stores/${store_id}/conversions/00000000-0000-4000-8000-000000000000/rollback"
              payload: {}
              as: StoreOperationsManager
              captures: { err_rollback: $.data.error_id }
            - call: "POST /merchandise/conversion-projects"
              payload: { store_id: "${store_id}", from_price_point_id: "${pp125_id}", to_price_point_id: "${pp300_id}", expected_store_version: "${store_v_after_start}" }
              as: StoreOperationsManager
              captures: { conv_id: $.data.id }
            - call: "POST /merchandise/conversion-projects/${conv_id}/start"
              payload: {}
              as: StoreOperationsManager
            - call: "POST /merchandise/stores/${store_id}/conversions/${conv_id}/rollback"
              payload: {}
              as: StoreOperationsManager
              captures: { store_status_final: $.data.status }
          assert:
            - "the second begin returns 409 and err_double == ERR_STORE_NOT_SINGLE_PRICE — CONVERTING has no direct edge back to CONVERTING"
            - "the rollback against an unknown project id returns 404 and err_rollback == ERR_CONVERSION_PROJECT_NOT_FOUND — the CONVERTING → SINGLE_PRICE edge needs a real project"
            - "Store.${store_id}.status == CONVERTING and Store.${store_id}.conversion_price_point_id == ${pp300_id} before the project is opened"
            - "Store.${store_id}.status != MULTI_PRICE — the completion branch was never taken, so the store sat mid-branch and not terminal"
            - "store_status_final == SINGLE_PRICE and Store.${store_id}.conversion_price_point_id is null — the rollback branch returned the store to its own start state"
            - "ConversionProject.${conv_id}.status == ROLLBACK"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:

      - name: container_hold_cascade_through_item_to_allocation_line
        grounds:
          - state_machines.Container.AT_PORT_to_CUSTOMS_HOLD
          - state_machines.Container.CUSTOMS_HOLD_to_AT_PORT
          - validations[priority=15]
          - errors.ERR_CONTAINER_NOT_RECEIVED
          - state_machines.Item.PRICE_ASSIGNED_to_COST_PENDING
          - entities.LandedCostHistory.fields.effective_sequence
        distinguishing_aspect: "Depth-3 chain whose FIRST hop is the cause of the second, not a parallel fan-out: the container's state change gates the freight pass-through, which is the only thing that can advance the item's cost state, which is the only thing that can capture a cost row. Receiving the container first and then re-running the identical pass-through call is what produces the success — the rejection was caused by hop 1, not by the request."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. One ACTIVE price point at 125 cents, one import vendor, one item SKU 6001 in PRICE_ASSIGNED, one container from that vendor in status AT_PORT with customs_cleared false, one store."
          setup_api_calls:
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/vendors"
              payload: { vendor_name: "Ningbo Home Goods Co", country_of_origin: "CN", import_flag: true }
              as: MerchandiseBuyer
              captures: { vendor_x_id: $.data.id }
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - call: "POST /merchandise/items"
              payload: { sku: "6001", description: "Scrub Sponge 4ct", unit_retail_cents: 125, commodity_class: "KITCHEN", season_code: "HARVEST_2026", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 105, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i6001_id: $.data.id }
            - call: "POST /merchandise/items/${i6001_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/containers"
              payload: { vendor_id: "${vendor_x_id}", container_number: "MSCU7654321", port_code: "LAX", dc_code: "DC-ATL", total_freight_cents: 1260 }
              as: ImportCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /merchandise/containers/${cont_id}/depart"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/arrive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/customs-hold"
              payload: {}
              as: ImportCoordinator
          trigger:
            - call: "POST /merchandise/items/${i6001_id}/landed-costs"
              payload: { method: "FREIGHT_PASS_THROUGH", applied_amount_cents: 107, container_id: "${cont_id}" }
              as: MerchandiseBuyer
              captures: { err_hop1: $.data.error_id }
            - call: "POST /merchandise/containers/${cont_id}/customs-release"
              payload: {}
              as: ImportCoordinator
              captures: { v_hop2: $.data.version }
            - call: "POST /merchandise/containers/${cont_id}/receive"
              payload: {}
              as: ImportCoordinator
              captures: { v_hop3: $.data.version }
            - call: "POST /merchandise/items/${i6001_id}/landed-costs"
              payload: { method: "FREIGHT_PASS_THROUGH", applied_amount_cents: 107, container_id: "${cont_id}" }
              as: MerchandiseBuyer
              captures: { hist_id: $.data.id }
          assert:
            - "hop-1 write returns 409 and err_hop1 == ERR_CONTAINER_NOT_RECEIVED — CUSTOMS_HOLD is not RECEIVED"
            - "v_hop3 > v_hop2 — the customs release mutated the container, which is what cleared the gate"
            - "after hop 3 the identical write returns 201 and LandedCostHistory.${hist_id}.applied_amount_cents == 107"
            - "Item.${i6001_id}.landed_cost_cents == 107 and Item.${i6001_id}.status == COST_PENDING — hop 2 mutated the item, which is a consequence of hop 1"
            - "Item.${i6001_id}.break_even_units == 4 — hop 3's derived-field recompute, ceil((107 * 4 + 6) / (125 - 4)) == ceil(434 / 121) == 4"
            - "LandedCostHistory.${hist_id}.effective_sequence == 1 — the failed attempt wrote no row, so hop 3 captured the first sequence"

      - name: item_deletion_cascade_through_lines_to_store_and_container
        grounds:
          - state_machines.Item.DELETE_REVIEW_to_DELETED
          - state_machines.AllocationLine.ALLOCATED_to_REVERSED
          - state_machines.Container.RECEIVED_to_ALLOCATED
          - state_machines.Store.SINGLE_PRICE_to_CONVERTING
          - errors.ERR_STORE_NOT_CONVERTING
        distinguishing_aspect: "Depth-3 chain with a depth-2 second chain from the same trigger: deleting the item reverses its allocation lines (hop 1); the reversal is itself what moves the container back from ALLOCATED to RECEIVED (hop 2, caused by hop 1, not by the delete directly); and the same reversal is what makes the store's conversion incomplete so its completion call is refused (hop 3 on the store branch). Recreating the line restores ALLOCATED, proving hop 2 was caused by hop 1."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. One ACTIVE price point at 125 cents, one import vendor, one store CONVERTING toward that price point, one item SKU 7001 in DELETE_REVIEW, one RECEIVED container."
            - "The item is the store's only allocated item and its only aisle-reset candidate, and one OPEN violation exists on the store."
          setup_api_calls:
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/vendors"
              payload: { vendor_name: "Ningbo Home Goods Co", country_of_origin: "CN", import_flag: true }
              as: MerchandiseBuyer
              captures: { vendor_x_id: $.data.id }
            - call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - call: "POST /merchandise/items"
              payload: { sku: "7001", description: "Sponge 4ct", unit_retail_cents: 125, commodity_class: "KITCHEN", season_code: "HARVEST_2026", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 128, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i7001_id: $.data.id }
            - call: "POST /merchandise/items/${i7001_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items/${i7001_id}/landed-costs"
              payload: { method: "VENDOR_PRICE_CHANGE", applied_amount_cents: 128 }
              as: MerchandiseBuyer
            - call: "POST /merchandise/containers"
              payload: { vendor_id: "${vendor_x_id}", container_number: "MSCU7654321", port_code: "LAX", dc_code: "DC-ATL", total_freight_cents: 1260 }
              as: ImportCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /merchandise/containers/${cont_id}/depart"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/arrive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/customs-release"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/receive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/allocation-lines"
              payload: { container_id: "${cont_id}", store_id: "${store_id}", item_id: "${i7001_id}", sequence: 1, requested_units: 40 }
              as: DistributionCenterOperator
              captures: { line_id: $.data.id }
            - call: "POST /merchandise/allocation-lines/${line_id}/release"
              payload: { release_units: 40 }
              as: DistributionCenterOperator
              captures: { v_hop2_before: $.data.version }
            - call: "POST /merchandise/stores/${store_id}/conversions"
              payload: { to_price_point_id: "${pp125_id}" }
              as: StoreOperationsManager
              captures: { conv_id: $.data.id, store_v_hop3: $.data.version }
            - call: "POST /merchandise/conversion-projects"
              payload: { store_id: "${store_id}", from_price_point_id: "${pp125_id}", to_price_point_id: "${pp125_id}", expected_store_version: "${store_v_hop3}" }
              as: StoreOperationsManager
              captures: { err_project: $.data.error_id }
          trigger:
            - call: "POST /merchandise/item-deletions/${i7001_id}/decision"
              payload: { decision: "DELETE" }
              as: MerchandiseBuyer
              captures: { v_item_after: $.data.version }
            - call: "GET /merchandise/containers/${cont_id}/allocation-lines"
              payload: {}
              as: DistributionCenterOperator
            - call: "POST /merchandise/stores/${store_id}/conversions/${conv_id}/complete"
              payload: {}
              as: StoreOperationsManager
              captures: { err_hop3: $.data.error_id }
          assert:
            - "Item.${i7001_id}.status == DELETED and Item.${i7001_id}.price_point_id is null"
            - "GET /merchandise/containers/${cont_id}/allocation-lines returns exactly 1 row with AllocationLine.${line_id}.status == REVERSED and released_units == 0 — hop 1"
            - "Container.${cont_id}.status == RECEIVED, having been ALLOCATED before the delete — hop 2, caused by hop 1's reversal and not by the delete request"
            - "the completion call returns 409 and err_hop3 == ERR_CONVERSION_PREREQUISITES_UNMET — hop 3, because sign_order_filed, shelf_tag_filed and register_file_locked are still false and no ACTIVE item can carry the reset"
            - "Item.${i7001_id}.version == ${v_item_after} — the delete mutated the item"
            - "the project-open call returns 400 and err_project == ERR_INVALID_REQUEST, because to_price_point_id equals from_price_point_id"
            - "had the two price points differed, the same call would have returned 412 ERR_STALE_VERSION against expected_store_version ${store_v_hop3}, because the store was mutated by the conversion begin"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_versus_business_constraint_on_activation
        grounds:
          - validations[priority=5]
          - validations[priority=18]
          - validations[priority=10]
          - errors.ERR_ITEM_NOT_COST_PENDING
          - errors.ERR_ITEM_NOT_COST_CLEARED
        distinguishing_aspect: "state vs business_constraint: an ACTIVE item that is also cost-uncovered fails at priority 5 with ERR_ITEM_NOT_COST_PENDING (409) on POST /merchandise/items/{id}/activations, never at priority 18 with ERR_ITEM_NOT_COST_CLEARED (422) — the state gate runs before the fiscal gate, so the same request carries two violated rules and the LOW-numbered error wins."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. One ACTIVE price point at 125 cents, one import vendor."
            - "SKU 8001 is ACTIVE with net_contribution_cents_per_unit 9. SKU 8002 is in COST_PENDING with landed_cost_cents 128 and net_contribution_cents_per_unit -7, and has no exclusive pack program."
          setup_api_calls:
            - call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/vendors"
              payload: { vendor_name: "Ningbo Home Goods Co", country_of_origin: "CN", import_flag: true }
              as: MerchandiseBuyer
              captures: { vendor_x_id: $.data.id }
            - call: "POST /merchandise/items"
              payload: { sku: "8001", description: "Sponge 4ct", unit_retail_cents: 125, commodity_class: "KITCHEN", season_code: "HARVEST_2026", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 112, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i8001_id: $.data.id }
            - call: "POST /merchandise/items/${i8001_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items/${i8001_id}/landed-costs"
              payload: { method: "VENDOR_PRICE_CHANGE", applied_amount_cents: 112 }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items/${i8001_id}/activations"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/items"
              payload: { sku: "8002", description: "Scrub Pad 4ct", unit_retail_cents: 125, commodity_class: "KITCHEN", season_code: "HARVEST_2026", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 128, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i8002_id: $.data.id }
            - call: "POST /merchandise/items/${i8002_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
          trigger:
            - call: "POST /merchandise/items/${i8002_id}/landed-costs"
              payload: { method: "VENDOR_PRICE_CHANGE", applied_amount_cents: 128 }
              as: MerchandiseBuyer
            - call: "GET /merchandise/items/${i8002_id}"
              payload: {}
              as: MerchandiseBuyer
              captures: { status_after_cost: $.data.status }
            - call: "POST /merchandise/items/${i8001_id}/activations"
              payload: {}
              as: MerchandiseBuyer
              captures: { err_state: $.data.error_id }
            - call: "POST /merchandise/items/${i8002_id}/activations"
              payload: {}
              as: MerchandiseBuyer
              captures: { err_pair: $.data.error_id }
          assert:
            - "status_after_cost == DELETE_REVIEW — the landed cost write routed SKU 8002 into deletion review"
            - "the activation of SKU 8001 returns 409 and err_state == ERR_ITEM_NOT_COST_PENDING, because ACTIVE is not COST_PENDING"
            - "err_state != ERR_ITEM_NOT_COST_CLEARED — priority 5 is checked before priority 18 even though SKU 8001's cost is fully covered"
            - "the activation of SKU 8002 returns 409 and err_pair == ERR_ITEM_NOT_COST_PENDING, not 422 ERR_ITEM_NOT_COST_CLEARED"
            - "GET /merchandise/items?status=DELETE_REVIEW returns exactly 1 row, so priority 5 genuinely short-circuited the priority-18 fiscal check"

      - name: business_temporal_versus_business_referential_on_aisle_reset
        grounds:
          - validations[priority=12]
          - validations[priority=19]
          - validations[priority=13]
          - errors.ERR_AISLE_RESET_OVERLAP
          - errors.ERR_PRICE_POINT_MIXED_WITHIN_CONVERSION
        distinguishing_aspect: "business_temporal vs business_referential: a reset that both collides with an existing reset on its aisle AND carries a price point foreign to the store's conversion is answered at priority 12 with ERR_AISLE_RESET_OVERLAP (409), never at priority 19 with ERR_PRICE_POINT_MIXED_WITHIN_CONVERSION (409) — a different error-category pair from the state-vs-business_constraint instance above, and the losing error belongs to the other pair."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. Two ACTIVE price points, 125 cents and 300 cents. One store CONVERTING toward 300 cents, with a SCHEDULED-then-OPEN season window HARVEST_2026 running 2026-09-01T00:00:00Z to 2026-11-30T00:00:00Z."
            - "One existing PLANNED aisle reset on aisle A14 of that store spanning 2026-09-05T00:00:00Z to 2026-09-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /merchandise/price-points"
