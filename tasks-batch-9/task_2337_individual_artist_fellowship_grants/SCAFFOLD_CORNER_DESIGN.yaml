      - name: an_artist_cannot_act_on_another_artists_application
        claim_type: resource_ownership
        grounds:
          - errors[ERR_NOT_RESOURCE_OWNER]
          - validations[priority=50]
        distinguishing_aspect: |
          The acting caller holds the Artist role and is a real Artist row, so
          P20 passes; only the ownership comparison at P50 stops the four calls.
          It also fires ahead of the P80 window and P85 sample checks, so a
          foreign submit reports ERR_NOT_RESOURCE_OWNER rather than a business
          error, and the owner's identical submit then succeeds.
