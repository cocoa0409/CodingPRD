      - name: waterfall_fills_each_bucket_before_the_next
        claim_type: waterfall_allocation
        grounds:
          - calculations.liquidation_proceeds_waterfall
        excluded_because:
          difficulty_instance: transitive_cascade / reo_sale_four_link_waterfall_and_control_restoration_cascade
          rationale: "The named §1.8 instance walks all seven waterfall steps on a real REO sale, proving fee-before-advances, oldest-advance-first, interest-before-principal and the residue rule in one recipe."

      - name: ara_variants_produce_different_reductions_on_identical_data
        claim_type: variant_divergence
        grounds:
          - calculations.appraisal_reduction_amount.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / ara_gross_appraised_versus_net_liquidation_credit_basis
          rationale: "The named §1.8 instance holds the deficiency base and appraised value fixed, runs both credit bases and pins the divergence to the cent, which is the variant-divergence claim in full."

      - name: fee_basis_variant_is_selected_by_ara_effectiveness_not_by_the_caller
        claim_type: variant_selection
        grounds:
          - calculations.special_servicing_fee_accrual.variants
          - entities.Trust.fields.fee_basis_convention
          - entities.Loan.fields.ara_amount_usd
        distinguishing_aspect: "One ARA_ADJUSTED trust, one loan, two consecutive monthly accruals and no change in any client input: the July accrual uses the full 10,000,000.00 basis because the reduction is still PROVISIONAL, and the August accrual uses 5,400,000.00 because the committee made the same reduction EFFECTIVE in between. The variant is chosen by server-side state, and the caller cannot name a basis."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; trust created with fee_basis_convention ARA_ADJUSTED and the default 0.25 annual rate."
            - "Loan principal 10,000,000.00 in SPECIAL_SERVICING with an UPDATE appraisal ACCEPTED at 6,000,000, giving a reduction of 4,600,000.00."
          setup_api_calls:
            - call: "POST /special-servicing/trusts"
              payload: { deal_name: "CMBS 2026-V19", closing_date: "2026-01-15T00:00:00Z", original_controlling_class_balance_usd: 40000000, fee_basis_convention: "ARA_ADJUSTED" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { trust_id: "$.data.id", convention: "$.data.fee_basis_convention" }
            - call: "POST /special-servicing/loans"
              payload: { trust_id: "${trust_id}", loan_number: "L-V19", original_balance_usd: 12000000, current_principal_balance_usd: 10000000, note_rate_pct: 6.0, monthly_debt_service_usd: 65000, maturity_date: "2029-06-01T00:00:00Z", securitization_value_usd: 15000000 }
              as: MasterServicer
              as_user_id: "ms-001"
              captures: { loan_id: "$.data.id" }
            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "BANKRUPTCY", occurred_on: "2026-07-01T00:00:00Z", evidence_note: "chapter 11 petition" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/appraisals"
              payload: { loan_id: "${loan_id}", appraisal_type: "UPDATE", ordered_on: "2026-08-01T00:00:00Z", appraiser_firm: "Acme Valuation", valuation_valid_months: 12 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { appraisal_id: "$.data.id" }
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "RECEIVED", value_usd: 6000000, as_of_date: "2026-08-01T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/appraisals/${appraisal_id}/status"
              payload: { to_status: "ACCEPTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-002"
            - call: "GET /special-servicing/appraisal-reductions"
              payload: { loan_id: "${loan_id}" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { ara_id: "$.data[0].id", ara_amount: "$.data[0].ara_amount_usd", ara_status: "$.data[0].status" }
          trigger:
            - call: "POST /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_id}", fee_type: "SPECIAL_SERVICING_FEE", period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { fee_july_id: "$.data.id", july_basis: "$.data.basis_amount_usd", july_amount: "$.data.amount_usd", july_rate: "$.data.rate_pct" }
            - call: "POST /special-servicing/appraisal-reductions/${ara_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: SpecialServicingCommitteeOfficer
              as_user_id: "cmte-001"
              captures: { ara_effective: "$.data.status" }
            - call: "POST /special-servicing/fee-accruals"
              payload: { loan_id: "${loan_id}", fee_type: "SPECIAL_SERVICING_FEE", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T00:00:00Z" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { fee_aug_id: "$.data.id", aug_basis: "$.data.basis_amount_usd", aug_amount: "$.data.amount_usd", aug_rate: "$.data.rate_pct" }
          assert:
            - "The reduction is 4600000.00 and is PROVISIONAL when the July fee is accrued, so Loan.ara_amount_usd is still 0.00"
            - "July accrual: basis_amount_usd == 10000000.00, rate_pct == 0.020833 and amount_usd == 2083.33"
            - "August accrual: basis_amount_usd == 5400000.00 (10,000,000.00 - 4,600,000.00) with the SAME rate_pct 0.020833 and amount_usd == 1125.00"
            - "The divergence of 958.33 comes entirely from the ARA becoming EFFECTIVE between the two calls; no client input changed"
            - "Neither accrual is floored: both raw figures exceed MONTHLY_FEE_FLOOR_USD 500.00"
            - "The two closed periods [2026-07-01, 2026-07-31] and [2026-08-01, 2026-08-31] do not overlap, so no ERR_FEE_PERIOD_OVERLAP is raised"
            - "Loan.fees_payable_usd == 3208.33 after both accruals"

