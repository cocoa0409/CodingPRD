          residency_status: IN_STATE
          level: UNDERGRADUATE
        as: RegistrarStaff
      trigger:
      - call: POST /bursar/terms
        payload:
          code: FALL-26
          name: Fall Again
          start_date: '2026-08-24'
          end_date: '2026-12-11'
          census_date: '2026-09-07'
          full_refund_end_date: '2026-09-07'
          mid_refund_end_date: '2026-10-05'
          withdrawal_deadline: '2026-11-13'
          refund_policy: PRO_RATA
          flat_fee_cents: 15000
          hold_threshold_cents: 20000
          plan_setup_fee_cents: 2500
          late_fee_pct: 0.05
          grace_days: 10
        as: RegistrarStaff
        captures:
          err_t: $.data.error_id
      - call: POST /bursar/students
        payload:
