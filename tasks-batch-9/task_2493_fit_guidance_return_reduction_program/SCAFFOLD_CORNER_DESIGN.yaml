      - name: item_list_action_repeated_returns_invalid_item_state
        claim_type: idempotency
        grounds:
          - state_machines.CatalogItem.listing_status.DRAFT_to_LISTED
          - validations[priority=10]
          - errors[ERR_INVALID_ITEM_STATE]
        distinguishing_aspect: |
          Replaying POST /fit-program/catalog-items/{id}/list on an already-LISTED item is
          rejected with 409 ERR_INVALID_ITEM_STATE rather than silently succeeding, and the
          item's version is byte-identical before and after the rejected call, proving no
          partial write occurred.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one TOPS item already moved DRAFT -> LISTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { ver_before: $.data.version, status_before: $.data.listing_status }
          trigger:
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
              captures: { err_id: $.data.error_id }
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { ver_after: $.data.version, status_after: $.data.listing_status }
          assert:
            - "${err_id} == \"ERR_INVALID_ITEM_STATE\""
            - "http_status == 409"
            - "${status_before} == \"LISTED\""
            - "${status_after} == \"LISTED\""
            - "${ver_after} == ${ver_before}"
            - "${ver_before} == 2"

