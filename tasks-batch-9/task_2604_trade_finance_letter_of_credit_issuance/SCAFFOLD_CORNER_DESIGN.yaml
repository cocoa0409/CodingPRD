  - section: rbac
    instances:
      - name: missing_x_user_headers_return_unauthenticated_before_anything_else
        claim_type: unauthenticated_request
        grounds:
          - validations.priority_1_auth
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          Priority 1 sits above priority 3 existence, so a request with no X-Role
          and no X-User-ID header answers 401 ERR_UNAUTHENTICATED even when the
          path id does not exist and the payload is malformed. If the
          implementation resolved the path first the same calls would return 404,
          and if it validated the body first they would return 422 - both wrong.
          The recipe therefore aims the header-less calls at ids that are known not
          to exist.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z. The store holds no rows at all."
            - "Each trigger call is issued with NO X-Role header and NO X-User-ID header. The as/as_user_id fields are written as NONE to record that absence."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
          trigger:
            - call: "GET /credits/no_such_credit"
              payload: {}
              as: NONE
              as_user_id: "NONE"
              captures: { e_read: $.data.error_id }
            - call: "POST /applicants"
              payload: { legal_name: "Ghost Trading Ltd", country_code: "GB", industry_code: "4671", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: NONE
              as_user_id: "NONE"
              captures: { e_write: $.data.error_id, m_write: $.data.message }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NONE
              as_user_id: "NONE"
              captures: { e_clock: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 401"
            - "${e_read} == ERR_UNAUTHENTICATED"
            - "${e_write} == ERR_UNAUTHENTICATED"
            - "${e_clock} == ERR_UNAUTHENTICATED"
            - "${m_write} is a non-empty string"
            - "GET /applicants (as CreditOfficer co_1) returns total_count 0 - the header-less POST wrote nothing"
            - "the logical clock is still 2026-08-10T09:00:00Z - the header-less clock call did not move it"

      - name: roles_cannot_invoke_another_roles_exclusive_operations
        claim_type: unauthorized_operation
        grounds:
          - validations.priority_2_authorization
          - errors.ERR_UNAUTHORIZED
          - roles.CreditOfficer
          - roles.TradeFinanceOfficer
          - roles.DocumentExaminer
          - roles.ComplianceOfficer
          - roles.SystemOperator
          - roles.CorrespondentBank
        distinguishing_aspect: |
          Six crossings of the segregation lines declared in §1.7, each aimed at an
          id that does not exist, so a 403 rather than a 404 proves that priority 2
          authorization is decided before priority 3 existence. The pairs are chosen
          to be plausible: a BeneficiaryUser approving a credit, a DocumentExaminer
          issuing one, a TradeFinanceOfficer raising a discrepancy, a
          ComplianceOfficer settling a claim, a SystemOperator drafting a credit,
          and a CorrespondentBank running the operational sweep. ERR_UNAUTHORIZED
          (role not permitted at all) must not be confused with
          ERR_PRINCIPAL_NOT_PARTY (right role, wrong row).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z. The store holds no business rows, so every addressed id is unknown."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
          trigger:
            - call: "POST /credits/no_such_credit/approve"
              payload: { decision: "APPROVE", approval_note: "beneficiary approving its own credit" }
              as: BeneficiaryUser
              as_user_id: "no_such_beneficiary"
              captures: { e_approve: $.data.error_id }
            - call: "POST /credits/no_such_credit/issue"
              payload: { issue_note: "examiner issuing a credit" }
              as: DocumentExaminer
              as_user_id: "dx_1"
              captures: { e_issue: $.data.error_id }
            - call: "POST /presentations/no_such_presentation/discrepancies"
              payload: { code: "LATE_SHIPMENT", severity: "MATERIAL", description: "officer raising a discrepancy" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { e_disc: $.data.error_id }
            - call: "POST /settlement-claims/no_such_claim/settle"
              payload: { settlement_note: "compliance paying a claim" }
              as: ComplianceOfficer
              as_user_id: "cmp_1"
              captures: { e_settle: $.data.error_id }
            - call: "POST /credits"
              payload: { applicant_id: "no_such_applicant", beneficiary_id: "no_such_beneficiary", facility_id: "no_such_facility", advising_bank_id: "no_such_bank", currency: "USD", amount_cents: 1000000, available_by: "SIGHT_PAYMENT", incoterm: "FOB", incoterm_place: "Port of Riga", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Oslo", presentation_period_days: 21 }
              as: SystemOperator
              as_user_id: "sysop_1"
              captures: { e_draft: $.data.error_id }
            - call: "POST /_ops/run-expiry-sweep"
              payload: { dry_run: true }
              as: CorrespondentBank
              as_user_id: "no_such_bank"
              captures: { e_sweep: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 403"
            - "${e_approve} == ERR_UNAUTHORIZED"
            - "${e_issue} == ERR_UNAUTHORIZED"
            - "${e_disc} == ERR_UNAUTHORIZED"
            - "${e_settle} == ERR_UNAUTHORIZED"
            - "${e_draft} == ERR_UNAUTHORIZED"
            - "${e_sweep} == ERR_UNAUTHORIZED"
            - "none of the six responses is 404 - authorization is decided before the id is resolved"
            - "GET /credits (as CreditOfficer co_1) returns total_count 0"

      - name: same_user_id_cannot_draft_and_approve_a_credit_or_issue_its_own_amendment
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_2_authorization
          - errors.ERR_SEGREGATION_OF_DUTIES
          - roles.CreditOfficer
          - roles.TradeFinanceOfficer
        distinguishing_aspect: |
          Both segregation rules in §1.7 are enforced on the X-User-ID string, not
          on the role: the operator id space is shared and opaque, so a
          CreditOfficer presenting X-User-ID tfo_1 is refused the approval of a
          credit whose drafted_by_user_id is tfo_1, and the very same call
          presenting co_2 succeeds. The amendment rule is the mirror image on a
          different entity: tfo_1 may draft the amendment but may not issue it,
          while tfo_2 may. The pair proves the check compares two stored ids rather
          than testing role membership - a role-only check would let the first call
          through and a role-only refusal would block the second.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "Standard fixture: applicant Baltic Timber Imports AS (NO, CLEARED), USD facility limit_cents 50000000 collateral_required_pct 0 expiring 2027-06-30, bank Nordkyst Bank NDKBNOKK, beneficiary Riga Sawmill SIA (LV)."
            - "One credit of amount_cents 10000000, SIGHT_PAYMENT, tenor_days 0, tolerance_pct 0, FOB, latest_shipment_date 2026-10-31, expiry_date 2026-11-30, presentation_period_days 21, drafted by tfo_1, with both mandatory requirements, sitting in PENDING_CREDIT_APPROVAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: SystemOperator
              as_user_id: "sysop_1"
            - call: "POST /applicants"
              payload: { legal_name: "Baltic Timber Imports AS", country_code: "NO", industry_code: "4671", internal_risk_grade: "A", kyc_status: "CLEARED" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/facilities"
              payload: { currency: "USD", limit_cents: 50000000, collateral_required_pct: 0, facility_expiry_date: "2027-06-30" }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { fac_id: $.data.id }
            - call: "POST /banks"
              payload: { bank_name: "Nordkyst Bank", swift_bic: "NDKBNOKK", country_code: "NO", country_risk_score: 12, credit_rating: "AA", confirmation_appetite_cents: 90000000 }
              as: CreditOfficer
              as_user_id: "co_1"
              captures: { bank_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { beneficiary_name: "Riga Sawmill SIA", country_code: "LV", nominated_bank_id: "${bank_id}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { ben_id: $.data.id }
            - call: "POST /credits"
              payload: { applicant_id: "${app_id}", beneficiary_id: "${ben_id}", facility_id: "${fac_id}", advising_bank_id: "${bank_id}", currency: "USD", amount_cents: 10000000, available_by: "SIGHT_PAYMENT", tenor_days: 0, tolerance_pct: 0, incoterm: "FOB", incoterm_place: "Port of Riga", latest_shipment_date: "2026-10-31", expiry_date: "2026-11-30", expiry_place: "Oslo", presentation_period_days: 21 }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { cr_id: $.data.id, drafter: $.data.drafted_by_user_id }
            - call: "POST /credits/${cr_id}/documentary-requirements"
              payload: { doc_type: "COMMERCIAL_INVOICE", originals_required: 1, copies_required: 2, issuer_constraint: "Beneficiary", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${cr_id}/documentary-requirements"
              payload: { doc_type: "BILL_OF_LADING", originals_required: 1, copies_required: 1, issuer_constraint: "Carrier", is_mandatory: true }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "POST /credits/${cr_id}/submit-for-approval"
              payload: { submission_note: "ready for credit decision" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
          trigger:
            - call: "POST /credits/${cr_id}/approve"
              payload: { decision: "APPROVE", approval_note: "approving my own draft" }
              as: CreditOfficer
              as_user_id: "tfo_1"
              captures: { e_sod_credit: $.data.error_id }
            - call: "POST /credits/${cr_id}/approve"
              payload: { decision: "APPROVE", approval_note: "second pair of eyes" }
              as: CreditOfficer
              as_user_id: "co_2"
            - call: "POST /credits/${cr_id}/issue"
              payload: { issue_note: "issued to Riga Sawmill" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
            - call: "GET /credits/${cr_id}"
              payload: {}
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { cr_ver: $.data.version }
            - call: "POST /credits/${cr_id}/amendments"
              payload: { change_set: { expiry_date: "2026-12-31" }, reason: "shipment delayed, expiry extended", expected_credit_version: "${cr_ver}" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { amd_id: $.data.id }
            - call: "POST /amendments/${amd_id}/issue"
              payload: { issue_note: "issuing my own amendment draft" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_1"
              captures: { e_sod_amd: $.data.error_id }
            - call: "POST /amendments/${amd_id}/issue"
              payload: { issue_note: "issued by the second officer" }
              as: TradeFinanceOfficer
              as_user_id: "tfo_2"
          assert:
            - "${drafter} == tfo_1"
            - "trigger call 1 returns HTTP 403 and ${e_sod_credit} == ERR_SEGREGATION_OF_DUTIES"
            - "DocumentaryCredit.${cr_id}.status == PENDING_CREDIT_APPROVAL after trigger call 1 - the refused approval changed nothing"
            - "trigger call 2 succeeds: DocumentaryCredit.${cr_id}.status == APPROVED and no FacilityAllocation row exists yet"
            - "trigger call 3 succeeds: DocumentaryCredit.${cr_id}.status == ISSUED"
            - "trigger call 5 succeeds: Amendment.${amd_id}.status == DRAFT, drafted_by_user_id == tfo_1, requires_beneficiary_consent == false, exposure_delta_cents == 0"
            - "trigger call 6 returns HTTP 403 and ${e_sod_amd} == ERR_SEGREGATION_OF_DUTIES"
            - "Amendment.${amd_id}.status == DRAFT and issued_by_user_id is null and consent_window_start is null after trigger call 6"
            - "trigger call 7 succeeds: Amendment.${amd_id}.status == ACCEPTED, issued_by_user_id == tfo_2, amendment_fee_cents == 7500"
            - "DocumentaryCredit.${cr_id}.expiry_date == 2026-12-31 and status == ISSUED - a consent-free amendment binds on issuance"

      - name: same_compliance_officer_cannot_screen_and_then_review_the_hit
        claim_type: segregation_of_duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - roles.ComplianceOfficer
          - calculations.sanctions_dual_use_score
        distinguishing_aspect: |
          The screening segregation rule is the third instance of the same pattern
          on a third entity, and it is checked BEFORE the state guard: the check is
          a genuine HIT_PENDING_REVIEW (hs_code 8471 scores 60 on the dual-use
          limb), so the only reason cmp_1 is refused is that
          screened_by_user_id == cmp_1, and cmp_2 then succeeds on the identical
          payload. A single reviewer would otherwise be able to raise and clear its
