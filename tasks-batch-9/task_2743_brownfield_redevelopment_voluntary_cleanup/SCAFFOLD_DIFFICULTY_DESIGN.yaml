                contaminant_code: "TCE"
                media: SOIL_VAPOR
                sample_location_code: "SV-01"
                max_concentration_ugl: 480.0
                screening_level_ugl: 5.0
                delineated: false
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &k_pA180sub
              call: "POST /assessment-phases/${pA180_id}/submit"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &k_pA180app
              call: "POST /assessment-phases/${pA180_id}/review"
              payload: { decision: APPROVE, review_comment: "Inquiry record accepted." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
            - &k_siteB
              call: "POST /sites"
              payload:
                owner_party_id: "${redev_id}"
                site_name: "Menomonee Foundry Parcel"
                county_code: "OH-039"
                acreage: 6.8
                intended_reuse: COMMERCIAL
                planned_acquisition_date: "2026-10-15"
                institutional_control_committed: true
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { siteB_id: $.data.id }
            - &k_protB
              call: "POST /liability-protections"
              payload: { site_id: "${siteB_id}" }
              as: Redeveloper
              as_user_id: "${redev_id}"
              captures: { protB_id: $.data.id }
            - &k_pB181
              call: "POST /assessment-phases"
              payload:
                site_id: "${siteB_id}"
                consultant_party_id: "${consult_id}"
                phase_type: PHASE_I
                field_start_date: "2026-03-01"
                field_end_date: "2026-04-10"
                delineation_confidence: SCREENING
                aai_report_date: "2026-04-17"
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
              captures: { pB181_id: $.data.id }
            - &k_pB181f
              call: "POST /assessment-phases/${pB181_id}/contaminant-findings"
              payload:
                contaminant_code: "LEAD"
                media: SOIL
                sample_location_code: "SB-04"
                max_concentration_ugl: 900.0
                screening_level_ugl: 400.0
                delineated: false
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &k_pB181sub
              call: "POST /assessment-phases/${pB181_id}/submit"
              payload: {}
              as: EnvironmentalConsultant
              as_user_id: "${consult_id}"
            - &k_pB181app
              call: "POST /assessment-phases/${pB181_id}/review"
              payload: { decision: APPROVE, review_comment: "Inquiry record accepted." }
              as: StateAgencyReviewer
              as_user_id: "reviewer-alpha"
          trigger:
            - &k_inq180
              call: "POST /liability-protections/${prot_id}/inquiry-completion"
