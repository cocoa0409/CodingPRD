scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: quote_vs_final_settlement_on_booking
        grounds:
          - calculations.estimate_quote
          - calculations.final_settlement
          - state_machines.EventLog.OPEN_to_FINALIZED
          - entities.Booking.fields.quote_subtotal
          - entities.Booking.fields.final_subtotal
        distinguishing_aspect: |
          The forward-looking estimate_quote (booked hours, no print overage) and the
          chronological final_settlement (actual logged hours + print overage) produce
          different totals for the SAME Booking: quote_subtotal 1972.50 vs final_subtotal 2221.50.
        test_recipe:
          setup:
            - "Premium package (base 1200.00, included_hours 4, overtime_rate 150.00, idle_rate 75.00, included_prints 300, overage_print_rate 0.40) on a booth model with one AVAILABLE booth."
            - "Customer booking: 6h event window, requested_setup_lead_min 90, venue 40 miles, add-ons PROPS+BACKDROP+ALBUM; deposit 493.13 paid; CONFIRMED then IN_SERVICE."
            - "EventLog actuals: coverage 7.25h, idle gap 45min, 360 prints."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Premium 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /add-ons"
              payload: { code: "PROPS", name: "Prop Box", unit_price: 50.00 }
              as: PlatformAdmin
              captures: { props_id: $.data.id }
            - call: "POST /add-ons"
              payload: { code: "BACKDROP", name: "Sequin Backdrop", unit_price: 100.00 }
              as: PlatformAdmin
              captures: { backdrop_id: $.data.id }
            - call: "POST /add-ons"
              payload: { code: "ALBUM", name: "Leather Album", unit_price: 150.00 }
              as: PlatformAdmin
              captures: { album_id: $.data.id }
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-001" }
              as: OperationsManager
              captures: { booth_id: $.data.id, booth_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-13T00:00:00Z", venue_distance_miles: 40, requested_setup_lead_min: 90 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/add-ons"
              payload: { add_on_id: "${props_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /bookings/${bk_id}/add-ons"
              payload: { add_on_id: "${backdrop_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /bookings/${bk_id}/add-ons"
              payload: { add_on_id: "${album_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { dep_due: $.data.id }
            - call: "POST /bookings/${bk_id}/payments"
              payload: { kind: "DEPOSIT", amount: 493.13 }
              as: FinanceClerk
            - call: "POST /bookings/${bk_id}/confirm"
              payload: { expected_booth_version: "${booth_v}" }
              as: OperationsManager
            - call: "POST /bookings/${bk_id}/start-service"
              payload: {}
              as: OperationsManager
            - call: "GET /bookings/${bk_id}/event-logs"
              payload: {}
              as: OperationsManager
              captures: { log_id: $.data.0.id, log_v: $.data.0.version }
          trigger:
            - call: "POST /event-logs/${log_id}/finalize"
              payload: { actual_setup_start: "2026-09-12T16:15:00Z", actual_coverage_start: "2026-09-12T17:00:00Z", actual_coverage_end: "2026-09-13T00:15:00Z", actual_teardown_end: "2026-09-13T01:00:00Z", actual_print_count: 360, expected_eventlog_version: "${log_v}" }
              as: OperationsManager
          assert:
            - "Booking.${bk_id}.quote_subtotal == 1972.50"
            - "Booking.${bk_id}.final_subtotal == 2221.50"
            - "Booking.${bk_id}.final_subtotal != Booking.${bk_id}.quote_subtotal"
            - "Booking.${bk_id}.balance_due == 1728.37"

      - name: cancellation_refund_tier_variants_on_booking
        grounds:
          - calculations.cancellation_refund
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - calculations.estimate_quote
          - entities.Booking.fields.deposit_due
        distinguishing_aspect: |
          cancellation_refund operates on a different domain (deposit-tier refund keyed on
          days-to-event clock distance) than estimate_quote/final_settlement (coverage pricing);
          same deposit 493.13 refunds 493.13 at 60+ days vs 246.57 at 30-59 days.
        test_recipe:
          setup:
            - "Same Premium package/booth as above; a DRAFT booking with deposit 493.13 paid, then CONFIRMED."
            - "Clock at 2026-06-14 makes the 2026-09-12 event 90 days out (>=60 tier => full refund)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Premium 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /add-ons"
              payload: { code: "PROPS", name: "Prop Box", unit_price: 50.00 }
              as: PlatformAdmin
              captures: { props_id: $.data.id }
            - call: "POST /add-ons"
              payload: { code: "BACKDROP", name: "Sequin Backdrop", unit_price: 100.00 }
              as: PlatformAdmin
              captures: { backdrop_id: $.data.id }
            - call: "POST /add-ons"
              payload: { code: "ALBUM", name: "Leather Album", unit_price: 150.00 }
              as: PlatformAdmin
              captures: { album_id: $.data.id }
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-001" }
              as: OperationsManager
              captures: { booth_id: $.data.id, booth_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-13T00:00:00Z", venue_distance_miles: 40, requested_setup_lead_min: 90 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/add-ons"
              payload: { add_on_id: "${props_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /bookings/${bk_id}/add-ons"
              payload: { add_on_id: "${backdrop_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /bookings/${bk_id}/add-ons"
              payload: { add_on_id: "${album_id}", qty: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /bookings/${bk_id}/payments"
              payload: { kind: "DEPOSIT", amount: 493.13 }
              as: FinanceClerk
            - call: "POST /bookings/${bk_id}/confirm"
              payload: { expected_booth_version: "${booth_v}" }
              as: OperationsManager
          trigger:
            - call: "POST /bookings/${bk_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Booking.${bk_id}.schedule_status == CANCELLED"
            - "cancellation_refund.refundable_amount for Booking.${bk_id} == 493.13"
            - "Booking.${bk_id}.deposit_due == 493.13"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: overtime_cap_min_nonlinear_mode_a
        grounds:
          - calculations.final_settlement
          - calculations.estimate_quote
          - entities.Package.fields.overtime_rate_per_hour
          - state_machines.EventLog.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Mode (a): final_subtotal nests min(overtime_rate*ceil(actual-included), OVERTIME_DAILY_CAP=750)
          with ceil() inside the max() and the cap clamp — coverage 9.1h yields ceil(5.1)=6h*150=900
          clamped to 750, a >=3-input non-linear interaction.
        test_recipe:
          setup:
            - "Premium package, one booth, no add-ons; booking event 5h (quote overtime 1h=150), venue 10 miles (<25 => travel 0), lead 0."
            - "Deposit 337.50 paid, CONFIRMED, IN_SERVICE; EventLog actuals coverage 9.1h drives the cap."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Premium 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-001" }
              as: OperationsManager
              captures: { booth_id: $.data.id, booth_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-12T23:00:00Z", venue_distance_miles: 10, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/payments"
              payload: { kind: "DEPOSIT", amount: 337.50 }
              as: FinanceClerk
            - call: "POST /bookings/${bk_id}/confirm"
              payload: { expected_booth_version: "${booth_v}" }
              as: OperationsManager
            - call: "POST /bookings/${bk_id}/start-service"
              payload: {}
              as: OperationsManager
            - call: "GET /bookings/${bk_id}/event-logs"
              payload: {}
              as: OperationsManager
              captures: { log_id: $.data.0.id, log_v: $.data.0.version }
          trigger:
            - call: "POST /event-logs/${log_id}/finalize"
              payload: { actual_setup_start: "2026-09-12T17:55:00Z", actual_coverage_start: "2026-09-12T18:00:00Z", actual_coverage_end: "2026-09-13T03:06:00Z", actual_teardown_end: "2026-09-13T04:00:00Z", actual_print_count: 300, expected_eventlog_version: "${log_v}" }
              as: OperationsManager
          assert:
            - "Booking.${bk_id}.final_subtotal == 1950.00"
            - "Booking.${bk_id}.quote_subtotal == 1350.00"

      - name: addon_round_per_line_then_sum_mode_b
        grounds:
          - calculations.estimate_quote
          - entities.BookingAddOn.fields.line_total
          - entities.AddOn.fields.unit_price
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — each BookingAddOn.line_total is
          round(unit_price*qty,2) FIRST, then the already-rounded line_totals are summed
          (round-per-line-then-sum), distinct from summing raw then rounding.
        test_recipe:
          setup:
            - "Premium package; a DRAFT booking with three add-on lines whose per-line rounding is observable in line_total and aggregated quote."
            - "Add-on FANCY priced 33.337-ish is impossible (2dp inputs), so use qty>1 to exercise per-line rounding: ALBUM unit 150.00 qty 2 => line 300.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Premium 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /add-ons"
              payload: { code: "ALBUM", name: "Leather Album", unit_price: 150.00, max_qty: 3 }
              as: PlatformAdmin
              captures: { album_id: $.data.id }
            - call: "POST /add-ons"
              payload: { code: "PROPS", name: "Prop Box", unit_price: 50.00, max_qty: 5 }
              as: PlatformAdmin
              captures: { props_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-12T22:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/add-ons"
              payload: { add_on_id: "${album_id}", qty: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line1_total: $.data.line_total }
          trigger:
            - call: "POST /bookings/${bk_id}/add-ons"
              payload: { add_on_id: "${props_id}", qty: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { line2_total: $.data.line_total }
          assert:
            - "BookingAddOn line1_total == 300.00"
            - "BookingAddOn line2_total == 150.00"
            - "Booking.${bk_id}.quote_subtotal == 1650.00"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: gallery_publish_unpublish_cycle
        grounds:
          - state_machines.Gallery.DRAFT_to_PUBLISHED
          - state_machines.Gallery.PUBLISHED_to_UNPUBLISHED
          - state_machines.Gallery.UNPUBLISHED_to_PUBLISHED
          - entities.Gallery.fields.access_pin
        distinguishing_aspect: |
          Gallery is cyclic: PUBLISHED->UNPUBLISHED->PUBLISHED loops, minting a fresh
          access_pin on each (re)publish — a non-linear loop on the Gallery entity.
        test_recipe:
          setup:
            - "A COMPLETED, PAID_IN_FULL booking with a Gallery holding >=1 photo, published once then unpublished."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Basic 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-001" }
              as: OperationsManager
              captures: { booth_id: $.data.id, booth_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-12T22:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/payments"
              payload: { kind: "DEPOSIT", amount: 300.00 }
              as: FinanceClerk
            - call: "POST /bookings/${bk_id}/confirm"
              payload: { expected_booth_version: "${booth_v}" }
              as: OperationsManager
            - call: "POST /bookings/${bk_id}/start-service"
              payload: {}
              as: OperationsManager
            - call: "GET /bookings/${bk_id}/event-logs"
              payload: {}
              as: OperationsManager
              captures: { log_id: $.data.0.id, log_v: $.data.0.version }
            - call: "POST /event-logs/${log_id}/finalize"
              payload: { actual_setup_start: "2026-09-12T18:00:00Z", actual_coverage_start: "2026-09-12T18:00:00Z", actual_coverage_end: "2026-09-12T22:00:00Z", actual_teardown_end: "2026-09-12T22:30:00Z", actual_print_count: 200, expected_eventlog_version: "${log_v}" }
              as: OperationsManager
            - call: "POST /bookings/${bk_id}/payments"
              payload: { kind: "BALANCE", amount: 900.00 }
              as: FinanceClerk
            - call: "POST /bookings/${bk_id}/complete"
              payload: {}
              as: OperationsManager
            - call: "GET /bookings/${bk_id}/galleries"
              payload: {}
              as: OperationsManager
              captures: { gal_id: $.data.0.id }
            - call: "POST /galleries/${gal_id}/photos"
              payload: { count: 12 }
              as: OperationsManager
            - call: "POST /galleries/${gal_id}/publish"
              payload: {}
              as: OperationsManager
              captures: { pin1: $.data.access_pin }
            - call: "POST /galleries/${gal_id}/unpublish"
              payload: {}
              as: OperationsManager
          trigger:
            - call: "POST /galleries/${gal_id}/publish"
              payload: {}
              as: OperationsManager
              captures: { pin2: $.data.access_pin }
          assert:
            - "Gallery.${gal_id}.status == PUBLISHED"
            - "Gallery.${gal_id}.access_pin != null"
            - "Gallery.${gal_id}.version == 5"

      - name: booking_parallel_schedule_payment_dimensions
        grounds:
          - state_machines.Booking.DRAFT_to_CONFIRMED
          - state_machines.Booking.UNPAID_to_DEPOSIT_PAID
          - entities.Booking.fields.schedule_status
          - entities.Booking.fields.payment_status
        distinguishing_aspect: |
          Booking carries two independent state dimensions on one row: paying the deposit
          advances payment_status UNPAID->DEPOSIT_PAID while schedule_status stays DRAFT;
          confirming then advances schedule_status DRAFT->CONFIRMED while payment_status stays DEPOSIT_PAID.
        test_recipe:
          setup:
            - "Premium package, one booth; a DRAFT/UNPAID booking with deposit_due 300.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Basic 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-001" }
              as: OperationsManager
              captures: { booth_id: $.data.id, booth_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-12T22:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/payments"
              payload: { kind: "DEPOSIT", amount: 300.00 }
              as: FinanceClerk
          trigger:
            - call: "POST /bookings/${bk_id}/confirm"
              payload: { expected_booth_version: "${booth_v}" }
              as: OperationsManager
          assert:
            - "Booking.${bk_id}.schedule_status == CONFIRMED"
            - "Booking.${bk_id}.payment_status == DEPOSIT_PAID"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_cascade_depth3_balance_to_completion_gate
        grounds:
          - state_machines.EventLog.OPEN_to_FINALIZED
          - state_machines.Booking.DEPOSIT_PAID_to_PAID_IN_FULL
          - state_machines.Booking.IN_SERVICE_to_COMPLETED
          - calculations.final_settlement
        distinguishing_aspect: |
          Depth-3 cascade originating at EventLog finalize: finalize (A) computes final_subtotal which
          mutates Booking.balance_due (B); that balance change is what the BALANCE payment must clear to
          reach PAID_IN_FULL (C); and PAID_IN_FULL is itself the precondition that the COMPLETED transition
          (D) consumes — each hop caused by the prior, not the original action.
        test_recipe:
          setup:
            - "Premium package, one booth; booking 6h, lead 90, 40 miles, add-ons PROPS+BACKDROP+ALBUM; deposit 493.13 paid; CONFIRMED, IN_SERVICE."
            - "EventLog actuals coverage 7.25h, idle 45min, 360 prints -> final_subtotal 2221.50, balance_due 1728.37."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
