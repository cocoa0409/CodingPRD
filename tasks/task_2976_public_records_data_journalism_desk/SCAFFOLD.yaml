scenario: |
  2976. Public Records & Data Journalism Desk (news organization investigations team): records request planning with agency identification, statutory deadlines and fee waiver requests, request tracking with appeal and litigation escalation when denied or delayed, data acquisition with format negotiation, documentation of fields and known quality issues, data cleaning, verification and analysis with reproducible code and peer review of methodology, findings verification against source documents and subject-matter expert review, subject response solicitation with sufficient notice and documentation of attempts, methodology publication and data sharing decisions balancing transparency and privacy, records retention, security of sensitive documents and source protection

domain_name: "public-records-data-journalism-desk"
api_prefix: "/records-desk"

complexity_profile:
  difficulty_level: expert_plus
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - scheduled_actions
    - derived_field_reconciliation

  entity_topology: graph
  entity_topology_notes: |
    Peer entities linked by explicit foreign keys with no deep URL nesting (only
    FieldDefinition is addressed as a sub-resource of Dataset). Three graph
    features: (1) self-referential RecordsRequest.supersedes_request_id;
    (2) many-to-many ExpertReviewer x Finding through the ReviewAssignment
    junction; (3) a two-way reference cycle between Investigation and Dataset
    (Dataset.investigation_id and Investigation.release_dataset_id).

  state_machine_shape: cyclic
  state_machine_shape_notes: |
    RecordsRequest is cyclic (AWAITING_AGENCY_RESPONSE <-> CLARIFICATION_REQUESTED,
    and APPEAL_FILED -> AWAITING_AGENCY_RESPONSE) plus branching on the appeal
    decision. Dataset is cyclic (CLEAN_LOCKED -> QUARANTINED -> CLEANING).
    Finding is cyclic (DOC_MATCHED/SME_* -> UNVERIFIED). AnalysisRun carries two
    independent parallel state dimensions (code_review_status x
    cost_allocation_status). Investigation is compound: its analysis_readiness
    is derived from child AnalysisRun and Finding state, and Desk.security_posture
    is a derived aggregate that gates Investigation publication and enclave booking.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  role_model_notes: |
    Six roles with non-overlapping write surfaces. The compliance-critical rule is
    that the PeerReviewer who signs off on an AnalysisRun MUST NOT be the
    DataReporter user who authored it (AnalysisRun.authored_by_user_id), and the
    ExpertReviewer who returns an SME verdict must be the reviewer the assignment
    names.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# 1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Desk
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: "Investigations desk name."
        constraints: "1..120 chars, non-blank."
      - name: fee_budget_total_cents
        type: integer
        source: input
        description: "Total records-fee budget in cents. Initialised from the create payload, then moved only by budget adjustments."
        constraints: ">= 0."
      - name: fee_budget_available_cents
        type: integer
        source: computed
        description: "Unencumbered budget. total = available + committed + spent is invariant at all times."
        constraints: ">= 0."
      - name: fee_budget_committed_cents
        type: integer
        source: computed
        description: "Budget encumbered by determined-but-unsettled records fees and filed appeal filing fees."
        constraints: ">= 0."
      - name: fee_budget_spent_cents
        type: integer
        source: computed
        description: "Budget irreversibly consumed (records released, appeal decided)."
        constraints: ">= 0."
      - name: retention_policy_days
        type: integer
        source: input
        description: "Records retention horizon in days, applied to acquired Datasets."
        constraints: "365..3650."
      - name: open_request_count
        type: integer
        source: computed
        description: "Count of RecordsRequest rows for this desk whose status is not in {RELEASED, LITIGATION_AUTHORIZED, WITHDRAWN}."
        default: 0
      - name: open_appeal_count
        type: integer
        source: computed
        description: "Count of Appeal rows for this desk's requests whose status == FILED."
        default: 0
      - name: litigation_exposure_count
        type: integer
        source: computed
        description: "Count of RecordsRequest rows for this desk whose status == LITIGATION_AUTHORIZED."
        default: 0
      - name: source_exposure_incident_count
        type: integer
        source: computed
        description: "Count of recorded source-exposure incidents. Never decreases."
        default: 0
      - name: security_posture
        type: enum
        source: computed
        description: "Derived aggregate gate. LOCKDOWN if source_exposure_incident_count >= 1; else RESTRICTED if litigation_exposure_count >= 1; else OPEN."
        default: "OPEN"
        constraints: "one of {OPEN, RESTRICTED, LOCKDOWN}."

  - name: Agency
    parent: null
    common_fields: false
    entity_kind: configuration
    fields:
      - name: name
        type: string
        source: input
        description: "Public body the desk files with."
        constraints: "1..160 chars, non-blank."
      - name: jurisdiction_code
        type: string
        source: input
        description: "Jurisdiction identifier, e.g. CA-STATE."
        constraints: "2..16 chars, uppercase letters and hyphen only."
      - name: statute_name
        type: string
        source: input
        description: "Access statute the desk cites, e.g. CPRA."
        constraints: "1..80 chars."
      - name: initial_response_days
        type: integer
        source: input
        description: "Statutory days the agency has to respond to a submitted request."
        constraints: "1..60."
      - name: deadline_basis
        type: enum
        source: input
        description: "Day-counting basis for every deadline this agency owes."
        constraints: "one of {BUSINESS_DAYS, CALENDAR_DAYS}."
      - name: tolling_allowed
        type: boolean
        source: input
        description: "Whether the statute lets a clarification round pause the response clock."
      - name: appeal_venue
        type: enum
        source: input
        description: "Venue an appeal against this agency must be filed in."
        constraints: "one of {INTERNAL, OMBUDS, COURT}."
      - name: appeal_decision_days
        type: integer
        source: input
        description: "Days the venue has to decide a filed appeal, counted on deadline_basis."
        constraints: "1..90."
      - name: search_fee_cents_per_hour
        type: integer
        source: input
        description: "Search labour rate in cents per hour used by the fee determination."
        constraints: "0..50000."
      - name: page_fee_cents
        type: integer
        source: input
        description: "Per-page duplication fee in cents."
        constraints: "0..1000."
      - name: max_waiver_cents
        type: integer
        source: input
        description: "Statutory ceiling in cents on the amount this agency may waive on a single request."
        constraints: ">= 0."
      - name: holiday_dates
        type: array
        source: input
        description: "Declared non-working dates excluded from BUSINESS_DAYS counting. Array of ISO-8601 date strings (YYYY-MM-DD)."
        default: []

  - name: RecordsRequest
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: desk_id
        type: string
        source: input
        description: "FK -> Desk.id; the desk that owns and funds this request."
      - name: agency_id
        type: string
        source: input
        description: "FK -> Agency.id; the public body the request is filed with."
      - name: supersedes_request_id
        type: string
        source: input
        description: "FK -> RecordsRequest.id; optional self-reference to the request this one replaces. When present, the target is withdrawn as a side effect of creation."
        default: null
      - name: requester_user_id
        type: string
        source: system
        description: "X-User-ID of the RecordsCoordinator who created the request."
      - name: subject_summary
        type: string
        source: input
        description: "One-line description of the records sought."
        constraints: "1..400 chars, non-blank."
      - name: requested_format
        type: enum
        source: input
        description: "Format the desk asks for in the request letter."
        constraints: "one of {CSV, XLSX, PDF_SCAN, FIXED_WIDTH, API_JSON}."
      - name: estimated_page_count
        type: integer
        source: input
        description: "Desk's own page estimate used only for planning; the fee determination uses the agency-reported page_count instead."
        constraints: "0..1000000."
      - name: waiver_requested
        type: boolean
        source: input
        description: "Whether the request letter asked for a public-interest fee waiver."
      - name: public_interest_score
        type: integer
        source: input
        description: "Desk's declared public-interest score feeding the waiver bonus."
        constraints: "0..100."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state."
        default: "DRAFT"
        constraints: "one of {DRAFT, AWAITING_AGENCY_RESPONSE, CLARIFICATION_REQUESTED, PARTIALLY_RELEASED, RELEASED, DENIED, APPEAL_FILED, LITIGATION_AUTHORIZED, WITHDRAWN}."
      - name: submitted_at
        type: datetime
        source: computed
        description: "Logical-clock instant the request was submitted. ISO 8601 UTC, three fractional digits."
        default: null
      - name: clarification_round_count
        type: integer
        source: computed
        description: "Number of clarification rounds opened on this request."
        default: 0
      - name: clarification_opened_at
        type: datetime
        source: computed
        description: "Instant the currently open clarification round started; null when no round is open."
        default: null
      - name: tolled_days_total
        type: integer
        source: computed
        description: "Accumulated tolled days, counted on the agency's deadline_basis, from closed clarification rounds and granted appeals."
        default: 0
      - name: due_at_strict
        type: datetime
        source: computed
        description: "STRICT variant of the statutory deadline: ignores every tolling event. Stamped at submission and never revised."
        default: null
      - name: due_at_tolled
        type: datetime
        source: computed
        description: "TOLLED variant of the statutory deadline: initial_response_days + tolled_days_total. Recomputed on every tolling event and used for overdue/appeal-ripeness decisions."
        default: null
      - name: search_hours
        type: number
        source: input
        description: "Agency-reported search hours recorded by the fee determination."
        default: null
      - name: billed_page_count
        type: integer
        source: input
        description: "Agency-reported page count recorded by the fee determination."
        default: null
      - name: search_fee_cents
        type: integer
        source: computed
        description: "round_half_up(search_hours * Agency.search_fee_cents_per_hour)."
        default: null
      - name: duplication_fee_cents
        type: integer
        source: computed
        description: "billed_page_count * Agency.page_fee_cents."
        default: null
      - name: gross_fee_cents
        type: integer
        source: computed
        description: "search_fee_cents + duplication_fee_cents."
        default: null
      - name: waiver_pct
        type: number
        source: computed
        description: "Waiver percentage selected by the gross-fee tier plus the public-interest bonus, capped at MAX_WAIVER_PCT."
        default: null
      - name: waiver_amount_cents
        type: integer
        source: computed
        description: "Final waived amount after the agency ceiling and the small-balance full-waive rule."
        default: null
      - name: net_fee_cents
        type: integer
        source: computed
        description: "gross_fee_cents - waiver_amount_cents."
        default: null
      - name: fee_committed_cents
        type: integer
        source: computed
        description: "Amount currently encumbered on Desk.fee_budget_committed_cents for this request. Zeroed on release, denial, or withdrawal."
        default: 0
      - name: fee_determined_at
        type: datetime
        source: computed
        description: "Instant the fee determination was recorded; null before that."
        default: null
      - name: denial_reason_code
        type: enum
        source: input
        description: "Exemption the agency cited when denying."
        default: null
        constraints: "one of {EXEMPT_PRIVACY, EXEMPT_DELIBERATIVE, EXEMPT_LAW_ENFORCEMENT, NO_RECORDS, FEE_UNPAID}."

  - name: Appeal
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> RecordsRequest.id; the request under appeal."
      - name: venue
        type: enum
        source: input
        description: "Venue the appeal is filed in; must equal the agency's appeal_venue."
        constraints: "one of {INTERNAL, OMBUDS, COURT}."
      - name: grounds
        type: string
        source: input
        description: "Written grounds for the appeal."
        constraints: "1..2000 chars, non-blank."
      - name: filing_fee_cents
        type: integer
        source: input
        description: "Filing fee the venue charges, encumbered on the desk budget at filing."
        constraints: "0..2000000."
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LegalCounsel who filed."
      - name: filed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of filing."
      - name: ripeness_basis
        type: enum
        source: computed
        description: "Why the appeal was ripe at filing time."
        constraints: "one of {DENIED, PARTIAL_RELEASE, OVERDUE}."
      - name: decision_due_at
        type: datetime
        source: computed
        description: "filed_at date advanced by Agency.appeal_decision_days on the agency's deadline_basis, stamped at 23:59:59.000Z."
      - name: status
        type: enum
        source: computed
        description: "Appeal lifecycle."
        default: "FILED"
        constraints: "one of {FILED, GRANTED, DENIED, WITHDRAWN}."
      - name: decision_rationale
        type: string
        source: input
        description: "Venue's written rationale, recorded with the decision."
        default: null

  - name: Dataset
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: request_id
        type: string
        source: input
        description: "FK -> RecordsRequest.id; the records request this data was acquired under."
      - name: investigation_id
        type: string
        source: input
        description: "FK -> Investigation.id; optional link to the investigation that analyses this dataset."
        default: null
      - name: name
        type: string
        source: input
        description: "Dataset slug, globally unique across the API. Used as the deterministic tie-break key for cost allocation ordering."
        constraints: "1..80 chars, lowercase letters, digits and hyphen only; globally unique."
      - name: negotiated_format
        type: enum
        source: input
        description: "Format the desk and agency agreed on during format negotiation."
        constraints: "one of {CSV, XLSX, PDF_SCAN, FIXED_WIDTH, API_JSON}."
      - name: delivered_format
        type: enum
        source: computed
        description: "Format the agency actually delivered, recorded by the delivery call."
        default: null
        constraints: "one of {CSV, XLSX, PDF_SCAN, FIXED_WIDTH, API_JSON}."
      - name: format_negotiation_status
        type: enum
        source: computed
        description: "REQUESTED until delivery; then AGREED when delivered_format == negotiated_format, else REFUSED."
        default: "REQUESTED"
        constraints: "one of {REQUESTED, AGREED, REFUSED}."
      - name: record_count
        type: integer
        source: computed
        description: "Row count of the delivered data, recorded by the delivery call. Zero before delivery."
        default: 0
        constraints: ">= 0."
      - name: expected_field_count
        type: integer
        source: input
        description: "Number of fields the desk commits to documenting before the dataset may be cleaning-locked."
        constraints: "1..500."
      - name: field_definition_count
        type: integer
        source: computed
        description: "Number of FieldDefinition rows attached to this dataset."
        default: 0
      - name: documentation_status
        type: enum
        source: computed
        description: "COMPLETE when field_definition_count == expected_field_count, else INCOMPLETE."
        default: "INCOMPLETE"
        constraints: "one of {INCOMPLETE, COMPLETE}."
      - name: known_issue_count
        type: integer
        source: computed
        description: "Sum of len(known_issue_codes) over this dataset's FieldDefinition rows."
        default: 0
      - name: sensitivity_tier
        type: enum
        source: input
        description: "Handling tier for the acquired records."
        constraints: "one of {PUBLIC, RESTRICTED, CONFIDENTIAL, SOURCE_LINKED}."
      - name: status
        type: enum
        source: computed
        description: "Acquisition and cleaning lifecycle."
        default: "RAW"
        constraints: "one of {RAW, CLEANING, CLEAN_LOCKED, QUARANTINED}."
      - name: allocated_cost_cents
        type: integer
        source: computed
        description: "Share of the current AnalysisRun cost allocated to this dataset. Reset to 0 when the dataset is quarantined."
        default: 0
      - name: quarantine_reason_code
        type: enum
        source: input
        description: "Reason recorded when the dataset is quarantined."
        default: null
        constraints: "one of {SOURCE_INTEGRITY, MISMATCHED_TOTALS, UNRESOLVED_NULLS, LEGAL_HOLD}."
      - name: retention_expires_at
        type: datetime
        source: computed
        description: "delivery instant advanced by Desk.retention_policy_days calendar days, at 23:59:59.000Z. Null before delivery."
        default: null

  - name: FieldDefinition
    parent: Dataset
    common_fields: true
    entity_kind: resource
    fields:
      - name: dataset_id
        type: string
        source: input
        description: "FK -> Dataset.id; the dataset this field belongs to."
      - name: field_name
        type: string
        source: input
        description: "Column name as delivered; unique within the dataset."
        constraints: "1..80 chars, lowercase letters, digits and underscore only; unique per dataset_id."
      - name: data_type
        type: enum
        source: input
        description: "Documented type of the column."
        constraints: "one of {STRING, INTEGER, DECIMAL, DATE, BOOLEAN}."
      - name: null_rate_pct
        type: number
        source: input
        description: "Documented share of null values, in percent."
        constraints: "0.0..100.0."
      - name: known_issue_codes
        type: array
        source: input
        description: "Documented quality issues. Array of strings drawn from {TRUNCATED, MIXED_FORMAT, INCONSISTENT_CODING, OUT_OF_RANGE, DUPLICATE_KEYS}."
        default: []
      - name: reidentification_risk
        type: integer
        source: input
        description: "Re-identification risk points for this column, feeding both disclosure-risk variants."
        constraints: "0..10."
      - name: is_source_identifying
        type: boolean
        source: input
        description: "True when the column can expose a confidential source."
      - name: suppression_applied
        type: boolean
        source: computed
        description: "True once a suppression has been applied to this column. Suppressed columns are excluded from both disclosure-risk variants."
        default: false
      - name: suppression_method
        type: enum
        source: computed
        description: "Suppression technique recorded when suppression was applied."
        default: null
        constraints: "one of {HASH_REDACT, DROP_COLUMN, COARSEN_BUCKET, TOP_CODE}."

  - name: Investigation
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: desk_id
        type: string
        source: input
        description: "FK -> Desk.id; the desk running the investigation."
      - name: release_dataset_id
        type: string
        source: input
        description: "FK -> Dataset.id; the dataset selected for release, recorded by the publication call."
        default: null
      - name: headline
        type: string
        source: input
        description: "Working headline."
        constraints: "1..200 chars, non-blank."
      - name: publication_mode
        type: enum
        source: input
        description: "Data-sharing decision, which also selects the disclosure-risk variant."
        constraints: "one of {FULL_DATA_RELEASE, AGGREGATES_ONLY, METHODOLOGY_ONLY}."
      - name: status
        type: enum
        source: computed
        description: "Investigation lifecycle."
        default: "DRAFTING"
        constraints: "one of {DRAFTING, ANALYSIS, FINDINGS_LOCKED, HOLD_LEGAL_REVIEW, CLEARED, PUBLISHED}."
      - name: analysis_readiness
        type: enum
        source: computed
        description: "READY when the current AnalysisRun (highest run_sequence) has code_review_status == APPROVED and cost_allocation_status == ALLOCATED, and sme_confirmed_finding_count >= 1, and sme_disputed_finding_count == 0, and unverified_finding_count == 0. Otherwise NOT_READY."
        default: "NOT_READY"
        constraints: "one of {NOT_READY, READY}."
      - name: finding_count
        type: integer
        source: computed
        description: "Total Finding rows for this investigation."
        default: 0
      - name: unverified_finding_count
        type: integer
        source: computed
        description: "Findings with verification_status == UNVERIFIED."
        default: 0
      - name: doc_matched_finding_count
        type: integer
        source: computed
        description: "Findings with verification_status == DOC_MATCHED."
        default: 0
      - name: sme_confirmed_finding_count
        type: integer
        source: computed
        description: "Findings with verification_status == SME_CONFIRMED."
        default: 0
      - name: sme_disputed_finding_count
        type: integer
        source: computed
        description: "Findings with verification_status == SME_DISPUTED."
        default: 0
      - name: methodology_doc_ref
        type: string
        source: input
        description: "Reference to the published methodology write-up, recorded by the publication call."
        default: null
      - name: disclosure_risk_score
        type: integer
        source: computed
        description: "Applicable disclosure-risk score stamped at publication, from the variant selected by publication_mode."
        default: null
      - name: applicable_risk_variant
        type: enum
        source: computed
        description: "Which disclosure-risk variant was applied at publication."
        default: null
        constraints: "one of {AGGREGATE_MAX, COMPOSITE_WEIGHTED, NONE}."
      - name: hold_reason_code
        type: enum
        source: computed
        description: "Why the investigation was placed on legal hold by a cascade."
        default: null
        constraints: "one of {LITIGATION_AUTHORIZED, SOURCE_EXPOSURE_INCIDENT}."
      - name: legal_clearance_at
        type: datetime
        source: computed
        description: "Instant LegalCounsel cleared the investigation; null when never cleared."
        default: null
      - name: published_at
        type: datetime
        source: computed
        description: "Instant of publication."
        default: null

  - name: AnalysisRun
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: investigation_id
        type: string
        source: input
        description: "FK -> Investigation.id; the investigation this run belongs to."
      - name: run_sequence
        type: integer
        source: computed
        description: "1 + count of pre-existing AnalysisRun rows for the same investigation_id. The run with the highest run_sequence is the investigation's current run."
      - name: code_repo_ref
        type: string
        source: input
        description: "Repository reference for the reproducible analysis code."
        constraints: "1..200 chars, non-blank."
      - name: code_commit_sha
        type: string
        source: input
        description: "Exact commit the run executed."
        constraints: "exactly 40 lowercase hex chars."
      - name: container_digest
        type: string
        source: input
        description: "Container image digest pinning the execution environment."
        constraints: "matches sha256:<64 lowercase hex chars>."
      - name: authored_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DataReporter who created the run. The peer reviewer must not be this user."
      - name: compute_cost_cents
        type: integer
        source: input
        description: "Metered compute cost of the run in cents."
        constraints: "0..100000000."
      - name: labor_hours
        type: number
        source: input
        description: "Analyst hours booked to the run."
        constraints: "0.0..10000.0."
      - name: labor_cost_cents
        type: integer
        source: computed
        description: "round_half_up(labor_hours * LABOR_RATE_CENTS_PER_HOUR)."
      - name: total_cost_cents
        type: integer
        source: computed
        description: "compute_cost_cents + labor_cost_cents."
      - name: allocated_total_cents
        type: integer
        source: computed
        description: "Sum of Dataset.allocated_cost_cents produced by the most recent cost allocation of this run. 0 before allocation."
        default: 0
      - name: code_review_status
        type: enum
        source: computed
        description: "Parallel dimension 1: methodology peer-review state."
        default: "PENDING_REVIEW"
        constraints: "one of {PENDING_REVIEW, CHANGES_REQUESTED, APPROVED}."
      - name: cost_allocation_status
        type: enum
        source: computed
        description: "Parallel dimension 2: cost-allocation bookkeeping state, advanced and reverted independently of code_review_status."
        default: "NOT_ALLOCATED"
        constraints: "one of {NOT_ALLOCATED, ALLOCATED}."
      - name: review_cycle_count
        type: integer
        source: computed
        description: "Number of peer-review decisions recorded against this run."
        default: 0
      - name: peer_review_note
        type: string
        source: input
        description: "Latest peer-review note."
        default: null
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the PeerReviewer who recorded the latest decision."
        default: null

  - name: Finding
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: investigation_id
        type: string
        source: input
        description: "FK -> Investigation.id; the investigation the claim belongs to."
      - name: analysis_run_id
        type: string
        source: input
        description: "FK -> AnalysisRun.id; the run that produced the claim. Must belong to the same investigation_id."
      - name: claim_text
        type: string
        source: input
        description: "The publishable claim, stated precisely."
        constraints: "1..1000 chars, non-blank."
      - name: source_document_ref
        type: string
        source: input
        description: "Reference to the source document the claim is checked against."
        constraints: "1..200 chars, non-blank."
      - name: matched_page
        type: integer
        source: computed
        description: "Page of the source document the claim was matched against, recorded by the document-match call."
        default: null
      - name: verification_status
        type: enum
        source: computed
        description: "Verification lifecycle of the claim."
        default: "UNVERIFIED"
        constraints: "one of {UNVERIFIED, DOC_MATCHED, SME_CONFIRMED, SME_DISPUTED}."
      - name: sme_verdict_rationale
        type: string
        source: computed
        description: "Rationale copied from the SME verdict; cleared on revocation."
        default: null

  - name: ExpertReviewer
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: "Subject-matter expert's name."
        constraints: "1..120 chars, non-blank."
      - name: affiliation
        type: string
        source: input
        description: "Institution the expert is affiliated with."
        constraints: "1..160 chars, non-blank."
      - name: expertise_code
        type: enum
        source: input
        description: "Domain of expertise."
        constraints: "one of {HOUSING, PUBLIC_HEALTH, POLICING, PROCUREMENT, STATISTICS}."
      - name: max_concurrent_assignments
        type: integer
        source: input
        description: "Aggregate capacity: the maximum number of ASSIGNED review assignments whose closed windows may cover any single instant."
        default: 2
        constraints: "1..10."
      - name: conflict_of_interest_agency_ids
        type: array
        source: input
        description: "Array of Agency.id strings this expert is conflicted with. Every element must reference an existing Agency."
        default: []
      - name: active_assignment_count
        type: integer
        source: computed
        description: "Count of ReviewAssignment rows for this reviewer whose status == ASSIGNED."
        default: 0

  - name: ReviewAssignment
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: reviewer_id
        type: string
        source: input
        description: "FK -> ExpertReviewer.id; the expert asked to review the finding."
      - name: finding_id
        type: string
        source: input
        description: "FK -> Finding.id; the finding under expert review."
      - name: window_start
        type: datetime
        source: input
        description: "Start of the reviewer's committed window. CLOSED interval endpoint: an assignment occupies [window_start, window_end] inclusive of both ends."
      - name: window_end
        type: datetime
        source: input
        description: "End of the reviewer's committed window, inclusive. Must be strictly after window_start."
      - name: status
        type: enum
        source: computed
        description: "Assignment lifecycle. Only ASSIGNED rows consume aggregate capacity."
        default: "ASSIGNED"
        constraints: "one of {ASSIGNED, COMPLETED, RELEASED}."
      - name: verdict
        type: enum
        source: input
        description: "Expert verdict recorded at completion."
        default: null
        constraints: "one of {CONFIRMED, DISPUTED}."
      - name: rationale
        type: string
        source: input
        description: "Expert's written rationale recorded at completion."
        default: null

  - name: SubjectResponseRequest
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: investigation_id
        type: string
        source: input
        description: "FK -> Investigation.id; the investigation whose subject is being solicited."
      - name: subject_name
        type: string
        source: input
        description: "Name of the person or organisation the findings concern."
        constraints: "1..160 chars, non-blank."
      - name: contact_channel
        type: enum
        source: input
        description: "Primary channel declared for the notice."
        constraints: "one of {EMAIL, PHONE, CERTIFIED_MAIL, IN_PERSON}."
      - name: status
        type: enum
        source: computed
        description: "Notice lifecycle."
        default: "DRAFT"
        constraints: "one of {DRAFT, NOTICE_ELIGIBLE, NOTICE_SENT, RESPONDED, NO_RESPONSE, UNREACHABLE}."
      - name: attempt_count
        type: integer
        source: computed
        description: "Number of documented contact attempts."
        default: 0
      - name: documented_attempts
        type: array
        source: computed
        description: "Append-only log of attempts. Each element is an object { channel, contact_detail, deliverable, note, attempted_at }."
        default: []
      - name: notice_sent_at
        type: datetime
        source: computed
        description: "Instant of the FIRST documented attempt; the notice clock runs from here and is never re-stamped by later attempts."
        default: null
      - name: response_deadline_at
        type: datetime
        source: computed
        description: "notice_sent_at + MIN_NOTICE_HOURS hours, stamped with the first attempt."
        default: null
      - name: response_text
        type: string
        source: input
        description: "Subject's response as recorded."
        default: null
      - name: on_the_record
        type: boolean
        source: input
        description: "Whether the response may be quoted."
        default: null

  - name: SecureEnclave
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: "Enclave label."
        constraints: "1..80 chars, non-blank."
      - name: sanitization_buffer_minutes
        type: integer
        source: input
        description: "Minutes of mandatory sanitization after every session; the occupied span of a session is [start_at, end_at + this buffer)."
        default: 30
        constraints: "0..240."
      - name: max_documents
        type: integer
        source: input
        description: "Maximum documents a single session may check out."
        constraints: "1..100."
      - name: booked_session_count
        type: integer
        source: computed
        description: "Count of EnclaveSession rows on this enclave whose status == BOOKED."
        default: 0

  - name: EnclaveSession
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: enclave_id
        type: string
        source: input
        description: "FK -> SecureEnclave.id; the enclave booked."
      - name: dataset_id
        type: string
        source: input
        description: "FK -> Dataset.id; the sensitive dataset examined in the session."
      - name: start_at
        type: datetime
        source: input
        description: "Session start. HALF-OPEN interval endpoint: the session itself occupies [start_at, end_at)."
      - name: end_at
        type: datetime
        source: input
        description: "Session end, exclusive. Must be strictly after start_at."
      - name: document_count
        type: integer
        source: input
        description: "Number of documents checked out for the session."
        constraints: "1..100."
      - name: purpose
        type: string
        source: input
        description: "Why the session is needed."
        constraints: "1..300 chars, non-blank."
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the caller who booked the session."
      - name: status
        type: enum
        source: computed
        description: "Session lifecycle. Only BOOKED sessions occupy the enclave."
        default: "BOOKED"
        constraints: "one of {BOOKED, CLOSED, CANCELLED}."
      - name: documents_returned_count
        type: integer
        source: input
        description: "Documents accounted for at closure."
        default: null
      - name: cancellation_reason_code
        type: enum
        source: computed
        description: "Why a cascade cancelled the booking."
        default: null
        constraints: "one of {INVESTIGATION_LEGAL_HOLD, DESK_LOCKDOWN}."

# ===========================================================================
# 1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: RecordsRequest
    shape: "cyclic + branching (clarification loop, appeal loop, appeal fork)"
    initial_state: DRAFT
    terminal_states: [RELEASED, LITIGATION_AUTHORIZED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: AWAITING_AGENCY_RESPONSE
        trigger: "POST /records-desk/records-requests/{id}/submit"
        actor: RecordsCoordinator
        preconditions:
          - "RecordsRequest.status == DRAFT"
        side_effects:
          - "stamps RecordsRequest.submitted_at = logical clock now"
          - "computes RecordsRequest.due_at_strict via calculations.statutory_deadline variant STRICT (tolled_days_total treated as 0)"
          - "computes RecordsRequest.due_at_tolled via calculations.statutory_deadline variant TOLLED with tolled_days_total == 0 (equal to due_at_strict at submission)"
          - "increments RecordsRequest.version by 1"
      - from: AWAITING_AGENCY_RESPONSE
        to: CLARIFICATION_REQUESTED
        trigger: "POST /records-desk/records-requests/{id}/clarification-request"
        actor: RecordsCoordinator
        preconditions:
          - "RecordsRequest.status == AWAITING_AGENCY_RESPONSE"
          - "Agency.tolling_allowed == true for RecordsRequest.agency_id, else ERR_TOLLING_NOT_PERMITTED"
          - "RecordsRequest.clarification_round_count < MAX_CLARIFICATION_ROUNDS (3), else ERR_CLARIFICATION_LIMIT_REACHED"
        side_effects:
          - "sets RecordsRequest.clarification_opened_at = logical clock now"
          - "increments RecordsRequest.clarification_round_count by 1"
        note: "The clock is paused from this instant; due_at_tolled is NOT revised until the round closes."
      - from: CLARIFICATION_REQUESTED
        to: AWAITING_AGENCY_RESPONSE
        trigger: "POST /records-desk/records-requests/{id}/clarification-response"
        actor: RecordsCoordinator
        preconditions:
          - "RecordsRequest.status == CLARIFICATION_REQUESTED"
        side_effects:
          - "adds calculations.tolling_days_for_span (from clarification_opened_at inclusive to now exclusive, on Agency.deadline_basis) to RecordsRequest.tolled_days_total"
          - "recomputes RecordsRequest.due_at_tolled via calculations.statutory_deadline variant TOLLED using the new tolled_days_total"
          - "sets RecordsRequest.clarification_opened_at = null"
          - "leaves RecordsRequest.due_at_strict unchanged"
        note: "CYCLE: returns to AWAITING_AGENCY_RESPONSE, so a second clarification round is possible up to MAX_CLARIFICATION_ROUNDS."
      - from: AWAITING_AGENCY_RESPONSE
        to: RELEASED
        trigger: "POST /records-desk/records-requests/{id}/agency-decision with outcome == RELEASED_FULL"
        actor: RecordsCoordinator
        preconditions:
          - "RecordsRequest.status == AWAITING_AGENCY_RESPONSE"
        side_effects:
          - "moves RecordsRequest.fee_committed_cents from Desk.fee_budget_committed_cents to Desk.fee_budget_spent_cents"
          - "sets RecordsRequest.fee_committed_cents = 0"
          - "decrements Desk.open_request_count by 1 and increments Desk.version by 1"
      - from: AWAITING_AGENCY_RESPONSE
        to: PARTIALLY_RELEASED
        trigger: "POST /records-desk/records-requests/{id}/agency-decision with outcome == RELEASED_PARTIAL"
        actor: RecordsCoordinator
        preconditions:
          - "RecordsRequest.status == AWAITING_AGENCY_RESPONSE"
        side_effects:
          - "moves RecordsRequest.fee_committed_cents from Desk.fee_budget_committed_cents to Desk.fee_budget_spent_cents"
          - "sets RecordsRequest.fee_committed_cents = 0"
          - "increments Desk.version by 1"
        note: "PARTIALLY_RELEASED is non-terminal: the withheld portion remains appealable, and delivery of the released portion is allowed."
      - from: AWAITING_AGENCY_RESPONSE
        to: DENIED
        trigger: "POST /records-desk/records-requests/{id}/agency-decision with outcome == DENIED"
        actor: RecordsCoordinator
        preconditions:
          - "RecordsRequest.status == AWAITING_AGENCY_RESPONSE"
          - "denial_reason_code is present in the payload, else ERR_INVALID_REQUEST"
        side_effects:
          - "returns RecordsRequest.fee_committed_cents from Desk.fee_budget_committed_cents to Desk.fee_budget_available_cents (a denial charges nothing)"
          - "sets RecordsRequest.fee_committed_cents = 0"
          - "records RecordsRequest.denial_reason_code"
          - "increments Desk.version by 1"
      - from: DENIED
        to: APPEAL_FILED
        trigger: "POST /records-desk/appeals with request_id == this request"
        actor: LegalCounsel
        preconditions:
          - "RecordsRequest.status == DENIED"
          - "Appeal.venue == Agency.appeal_venue, else ERR_APPEAL_VENUE_MISMATCH"
          - "Desk.fee_budget_available_cents >= Appeal.filing_fee_cents, else ERR_FEE_BUDGET_EXCEEDED"
        side_effects:
          - "creates the Appeal in status FILED with ripeness_basis = DENIED"
          - "computes Appeal.decision_due_at from filed_at + Agency.appeal_decision_days on Agency.deadline_basis"
          - "moves Appeal.filing_fee_cents from Desk.fee_budget_available_cents to Desk.fee_budget_committed_cents"
          - "increments Desk.open_appeal_count by 1 and increments Desk.version by 1"
      - from: PARTIALLY_RELEASED
        to: APPEAL_FILED
        trigger: "POST /records-desk/appeals with request_id == this request"
        actor: LegalCounsel
        preconditions:
          - "RecordsRequest.status == PARTIALLY_RELEASED"
          - "Appeal.venue == Agency.appeal_venue, else ERR_APPEAL_VENUE_MISMATCH"
          - "Desk.fee_budget_available_cents >= Appeal.filing_fee_cents, else ERR_FEE_BUDGET_EXCEEDED"
        side_effects:
          - "creates the Appeal in status FILED with ripeness_basis = PARTIAL_RELEASE"
          - "computes Appeal.decision_due_at as above"
          - "moves Appeal.filing_fee_cents from Desk.fee_budget_available_cents to Desk.fee_budget_committed_cents"
          - "increments Desk.open_appeal_count by 1 and increments Desk.version by 1"
      - from: AWAITING_AGENCY_RESPONSE
        to: APPEAL_FILED
        trigger: "POST /records-desk/appeals with request_id == this request, on the delay ground"
        actor: LegalCounsel
        preconditions:
          - "RecordsRequest.status == AWAITING_AGENCY_RESPONSE"
          - "logical clock now > RecordsRequest.due_at_tolled (STRICTLY greater), else ERR_APPEAL_NOT_RIPE"
          - "Appeal.venue == Agency.appeal_venue, else ERR_APPEAL_VENUE_MISMATCH"
          - "Desk.fee_budget_available_cents >= Appeal.filing_fee_cents, else ERR_FEE_BUDGET_EXCEEDED"
        side_effects:
          - "creates the Appeal in status FILED with ripeness_basis = OVERDUE"
          - "computes Appeal.decision_due_at as above"
          - "moves Appeal.filing_fee_cents from Desk.fee_budget_available_cents to Desk.fee_budget_committed_cents"
          - "increments Desk.open_appeal_count by 1 and increments Desk.version by 1"
        note: "Ripeness is judged against due_at_tolled, never due_at_strict."
      - from: APPEAL_FILED
        to: AWAITING_AGENCY_RESPONSE
        trigger: "POST /records-desk/appeals/{id}/decision with outcome == GRANTED"
        actor: RecordsCoordinator
        preconditions:
          - "Appeal.status == FILED"
          - "RecordsRequest.status == APPEAL_FILED"
        side_effects:
          - "sets Appeal.status = GRANTED and records Appeal.decision_rationale"
          - "adds calculations.tolling_days_for_span (from Appeal.filed_at inclusive to now exclusive) to RecordsRequest.tolled_days_total"
          - "recomputes RecordsRequest.due_at_tolled from the new tolled_days_total"
          - "moves Appeal.filing_fee_cents from Desk.fee_budget_committed_cents to Desk.fee_budget_spent_cents"
          - "decrements Desk.open_appeal_count by 1 and increments Desk.version by 1"
        note: "CYCLE: a granted appeal puts the request back in the agency's queue with a re-based deadline."
      - from: APPEAL_FILED
        to: LITIGATION_AUTHORIZED
        trigger: "POST /records-desk/appeals/{id}/decision with outcome == DENIED"
        actor: RecordsCoordinator
        preconditions:
          - "Appeal.status == FILED"
          - "RecordsRequest.status == APPEAL_FILED"
        side_effects:
          - "CASCADE HOP 1: sets Appeal.status = DENIED and records Appeal.decision_rationale"
          - "CASCADE HOP 2: because the appeal is now DENIED, RecordsRequest.status becomes LITIGATION_AUTHORIZED"
          - "CASCADE HOP 3: because the request entered LITIGATION_AUTHORIZED, Desk.litigation_exposure_count increments by 1, Desk.open_request_count decrements by 1, and Desk.security_posture is recomputed"
          - "CASCADE HOP 4: because Desk.security_posture is no longer OPEN, every Investigation reachable as Investigation.id IN (SELECT investigation_id FROM Dataset WHERE request_id == this request AND investigation_id IS NOT NULL) whose status IN {ANALYSIS, FINDINGS_LOCKED, CLEARED} moves to HOLD_LEGAL_REVIEW with hold_reason_code = LITIGATION_AUTHORIZED (iterate created_at ASC, then headline ASC; ordering does not change the outcome)"
          - "CASCADE HOP 5: because those Investigations entered HOLD_LEGAL_REVIEW, every EnclaveSession whose dataset_id belongs to one of those Investigations (Dataset.investigation_id == that Investigation.id) and whose status == BOOKED moves to CANCELLED with cancellation_reason_code = INVESTIGATION_LEGAL_HOLD, decrementing SecureEnclave.booked_session_count"
          - "moves Appeal.filing_fee_cents from Desk.fee_budget_committed_cents to Desk.fee_budget_spent_cents"
          - "decrements Desk.open_appeal_count by 1 and increments Desk.version by 1"
      - from: APPEAL_FILED
        to: WITHDRAWN
        trigger: "POST /records-desk/records-requests/{id}/withdrawal"
        actor: RecordsCoordinator
        preconditions:
          - "RecordsRequest.status == APPEAL_FILED"
        side_effects:
          - "CASCADE HOP 1: sets RecordsRequest.status = WITHDRAWN and returns RecordsRequest.fee_committed_cents from Desk.fee_budget_committed_cents to Desk.fee_budget_available_cents, then sets fee_committed_cents = 0"
          - "CASCADE HOP 2: because the request is withdrawn, its Appeal with status == FILED moves to WITHDRAWN"
          - "CASCADE HOP 3: because the appeal is WITHDRAWN, its filing_fee_cents returns from Desk.fee_budget_committed_cents to Desk.fee_budget_available_cents and Desk.open_appeal_count decrements by 1"
          - "decrements Desk.open_request_count by 1 and increments Desk.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /records-desk/records-requests/{id}/withdrawal"
        actor: RecordsCoordinator
        preconditions:
          - "RecordsRequest.status == DRAFT"
        side_effects:
          - "sets RecordsRequest.status = WITHDRAWN"
          - "decrements Desk.open_request_count by 1 and increments Desk.version by 1"
      - from: AWAITING_AGENCY_RESPONSE
        to: WITHDRAWN
        trigger: "POST /records-desk/records-requests/{id}/withdrawal"
        actor: RecordsCoordinator
        preconditions:
          - "RecordsRequest.status == AWAITING_AGENCY_RESPONSE"
        side_effects:
          - "returns RecordsRequest.fee_committed_cents from Desk.fee_budget_committed_cents to Desk.fee_budget_available_cents and sets fee_committed_cents = 0"
          - "decrements Desk.open_request_count by 1 and increments Desk.version by 1"
      - from: CLARIFICATION_REQUESTED
        to: WITHDRAWN
        trigger: "POST /records-desk/records-requests/{id}/withdrawal"
        actor: RecordsCoordinator
        preconditions:
          - "RecordsRequest.status == CLARIFICATION_REQUESTED"
        side_effects:
          - "returns RecordsRequest.fee_committed_cents from Desk.fee_budget_committed_cents to Desk.fee_budget_available_cents and sets fee_committed_cents = 0"
          - "sets RecordsRequest.clarification_opened_at = null"
          - "decrements Desk.open_request_count by 1 and increments Desk.version by 1"
      - from: AWAITING_AGENCY_RESPONSE
        to: WITHDRAWN
        trigger: "POST /records-desk/records-requests with supersedes_request_id == this request (system supersede)"
        actor: system
        preconditions:
          - "RecordsRequest.status IN {DRAFT, AWAITING_AGENCY_RESPONSE, CLARIFICATION_REQUESTED}, else ERR_SUPERSEDE_TARGET_NOT_ACTIVE"
        side_effects:
          - "sets the superseded RecordsRequest.status = WITHDRAWN"
          - "returns its fee_committed_cents from Desk.fee_budget_committed_cents to Desk.fee_budget_available_cents and sets fee_committed_cents = 0"
          - "decrements Desk.open_request_count by 1"
        note: "System transition fired by the create-with-supersede pattern guarded by OCC on Desk.version (see concurrency_rules)."

  - entity: Appeal
    shape: "branching fork (FILED forks to GRANTED / DENIED / WITHDRAWN with divergent side-effect sets)"
    initial_state: FILED
    terminal_states: [GRANTED, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: GRANTED
        trigger: "POST /records-desk/appeals/{id}/decision with outcome == GRANTED"
        actor: RecordsCoordinator
        preconditions:
          - "Appeal.status == FILED"
        side_effects:
          - "re-bases the parent RecordsRequest deadline and returns it to AWAITING_AGENCY_RESPONSE (see RecordsRequest machine)"
          - "moves filing_fee_cents from committed to spent on the Desk"
      - from: FILED
        to: DENIED
        trigger: "POST /records-desk/appeals/{id}/decision with outcome == DENIED"
        actor: RecordsCoordinator
        preconditions:
          - "Appeal.status == FILED"
        side_effects:
          - "drives the parent RecordsRequest to LITIGATION_AUTHORIZED and starts the five-hop litigation cascade (see RecordsRequest machine)"
          - "moves filing_fee_cents from committed to spent on the Desk"
        note: "BRANCH: GRANTED and DENIED share a trigger endpoint but have entirely disjoint side-effect sets."
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /records-desk/records-requests/{id}/withdrawal (cascade hop 2)"
        actor: system
        preconditions:
          - "Appeal.status == FILED"
        side_effects:
          - "returns filing_fee_cents from Desk.fee_budget_committed_cents to Desk.fee_budget_available_cents"
          - "decrements Desk.open_appeal_count by 1"

  - entity: Dataset
    shape: "cyclic (CLEAN_LOCKED -> QUARANTINED -> CLEANING -> CLEAN_LOCKED)"
    initial_state: RAW
    terminal_states: []
    transitions:
      - from: RAW
        to: CLEANING
        trigger: "POST /records-desk/datasets/{id}/delivery"
        actor: DataReporter
        preconditions:
          - "Dataset.status == RAW"
          - "the parent RecordsRequest.status IN {PARTIALLY_RELEASED, RELEASED}, else ERR_SOURCE_REQUEST_UNRESOLVED"
        side_effects:
          - "records Dataset.delivered_format and Dataset.record_count"
          - "sets Dataset.format_negotiation_status = AGREED when delivered_format == negotiated_format, else REFUSED"
          - "computes Dataset.retention_expires_at = delivery date + Desk.retention_policy_days calendar days at 23:59:59.000Z, resolving Desk via RecordsRequest.desk_id"
      - from: CLEANING
        to: CLEAN_LOCKED
        trigger: "POST /records-desk/datasets/{id}/cleaning-lock"
        actor: DataReporter
        preconditions:
          - "Dataset.status == CLEANING"
          - "Dataset.format_negotiation_status == AGREED, else ERR_FORMAT_NOT_NEGOTIATED"
          - "Dataset.documentation_status == COMPLETE, else ERR_DATASET_DOCUMENTATION_INCOMPLETE"
        side_effects:
          - "freezes the dataset for analysis; only CLEAN_LOCKED datasets are allocable by calculations.analysis_cost_allocation"
      - from: CLEAN_LOCKED
        to: QUARANTINED
        trigger: "POST /records-desk/datasets/{id}/quarantine"
        actor: ManagingEditor
        preconditions:
          - "Dataset.status == CLEAN_LOCKED"
        side_effects:
          - "CASCADE HOP 1: sets Dataset.status = QUARANTINED, records quarantine_reason_code, and sets Dataset.allocated_cost_cents = 0"
          - "CASCADE HOP 2: because the dataset is quarantined, every AnalysisRun whose investigation_id == Dataset.investigation_id has code_review_status APPROVED downgraded to CHANGES_REQUESTED and cost_allocation_status ALLOCATED downgraded to NOT_ALLOCATED, and allocated_total_cents reset to 0"
          - "CASCADE HOP 3: because the current AnalysisRun is no longer APPROVED/ALLOCATED, the Investigation.analysis_readiness recomputes to NOT_READY, and an Investigation whose status == FINDINGS_LOCKED reverts to ANALYSIS"
      - from: QUARANTINED
        to: CLEANING
        trigger: "POST /records-desk/datasets/{id}/requalification"
        actor: DataReporter
        preconditions:
          - "Dataset.status == QUARANTINED"
        side_effects:
          - "clears Dataset.quarantine_reason_code"
        note: "CYCLE: the dataset re-enters cleaning and may be cleaning-locked again."

  - entity: Investigation
    shape: "compound + posture-gated (analysis_readiness derived from AnalysisRun and Finding children; Desk.security_posture gates publication)"
    initial_state: DRAFTING
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFTING
        to: ANALYSIS
        trigger: "POST /records-desk/analysis-runs with investigation_id == this investigation"
        actor: DataReporter
        preconditions:
          - "Investigation.status == DRAFTING"
          - "payload expected_investigation_version == Investigation.version, else ERR_STALE_INVESTIGATION_VERSION"
        side_effects:
          - "creates the AnalysisRun with run_sequence = 1 + count of existing runs, code_review_status = PENDING_REVIEW, cost_allocation_status = NOT_ALLOCATED"
          - "recomputes Investigation.analysis_readiness"
          - "increments Investigation.version by 1"
      - from: ANALYSIS
        to: ANALYSIS
        trigger: "POST /records-desk/analysis-runs with investigation_id == this investigation (supersede)"
        actor: DataReporter
        preconditions:
          - "Investigation.status == ANALYSIS"
          - "payload expected_investigation_version == Investigation.version, else ERR_STALE_INVESTIGATION_VERSION"
        side_effects:
          - "creates a new AnalysisRun with the next run_sequence, which becomes the investigation's current run and legitimately supersedes the prior one"
          - "recomputes Investigation.analysis_readiness (falls to NOT_READY because the new current run is PENDING_REVIEW / NOT_ALLOCATED)"
          - "increments Investigation.version by 1"
      - from: ANALYSIS
        to: FINDINGS_LOCKED
        trigger: "POST /records-desk/investigations/{id}/lock-findings"
        actor: ManagingEditor
        preconditions:
          - "Investigation.status == ANALYSIS"
          - "Investigation.analysis_readiness == READY, else ERR_ANALYSIS_NOT_READY"
        side_effects:
          - "CASCADE HOP 1: sets Investigation.status = FINDINGS_LOCKED"
          - "CASCADE HOP 2: because findings are locked, every SubjectResponseRequest for this investigation with status == DRAFT moves to NOTICE_ELIGIBLE"
          - "increments Investigation.version by 1"
      - from: FINDINGS_LOCKED
        to: ANALYSIS
        trigger: "POST /records-desk/datasets/{id}/quarantine (cascade hop 3) or POST /records-desk/findings/{id}/verification-revocation (cascade hop 3)"
        actor: system
        preconditions:
          - "Investigation.status == FINDINGS_LOCKED"
          - "recomputed Investigation.analysis_readiness == NOT_READY"
        side_effects:
          - "sets Investigation.status = ANALYSIS"
          - "leaves SubjectResponseRequest rows already in NOTICE_ELIGIBLE or later untouched"
      - from: FINDINGS_LOCKED
        to: HOLD_LEGAL_REVIEW
        trigger: "system cascade from Desk.security_posture leaving OPEN (appeal denial hop 4, or source-exposure incident)"
        actor: system
        preconditions:
          - "Investigation.status IN {ANALYSIS, FINDINGS_LOCKED, CLEARED}"
        side_effects:
          - "sets Investigation.status = HOLD_LEGAL_REVIEW and records hold_reason_code"
          - "triggers cancellation of that investigation's BOOKED EnclaveSessions (next cascade hop)"
        note: "Same transition applies from ANALYSIS and from CLEARED; the from-set is {ANALYSIS, FINDINGS_LOCKED, CLEARED}."
      - from: HOLD_LEGAL_REVIEW
        to: CLEARED
        trigger: "POST /records-desk/investigations/{id}/legal-clearance"
        actor: LegalCounsel
        preconditions:
          - "Investigation.status == HOLD_LEGAL_REVIEW"
          - "Desk.security_posture != LOCKDOWN, else ERR_DESK_LOCKDOWN"
        side_effects:
          - "sets Investigation.status = CLEARED, stamps legal_clearance_at = now, clears hold_reason_code"
          - "increments Investigation.version by 1"
      - from: FINDINGS_LOCKED
        to: CLEARED
        trigger: "POST /records-desk/investigations/{id}/legal-clearance"
        actor: LegalCounsel
        preconditions:
          - "Investigation.status == FINDINGS_LOCKED"
          - "Desk.security_posture != LOCKDOWN, else ERR_DESK_LOCKDOWN"
        side_effects:
          - "sets Investigation.status = CLEARED, stamps legal_clearance_at = now"
          - "increments Investigation.version by 1"
      - from: FINDINGS_LOCKED
        to: PUBLISHED
        trigger: "POST /records-desk/investigations/{id}/publication"
        actor: ManagingEditor
        preconditions:
          - "Investigation.status == FINDINGS_LOCKED"
          - "Desk.security_posture == OPEN, else ERR_DESK_LOCKDOWN (LOCKDOWN) or ERR_INVESTIGATION_NOT_CLEARED (RESTRICTED)"
          - "no Dataset with investigation_id == this investigation has a parent RecordsRequest whose status IN {APPEAL_FILED, LITIGATION_AUTHORIZED}, else ERR_SOURCE_REQUEST_UNRESOLVED"
          - "all publication gates in validations priorities 125-220 pass"
        side_effects:
          - "SYSTEM PRE-STEP: every SubjectResponseRequest for this investigation with status == NOTICE_SENT and response_deadline_at < now moves to NO_RESPONSE before the notice gates are evaluated"
          - "stamps Investigation.methodology_doc_ref, release_dataset_id, published_at = now"
          - "computes Investigation.disclosure_risk_score and applicable_risk_variant via calculations.disclosure_risk_score using the variant selected by publication_mode"
          - "increments Investigation.version by 1"
      - from: CLEARED
        to: PUBLISHED
        trigger: "POST /records-desk/investigations/{id}/publication"
        actor: ManagingEditor
        preconditions:
          - "Investigation.status == CLEARED"
          - "Desk.security_posture != LOCKDOWN, else ERR_DESK_LOCKDOWN"
          - "no Dataset with investigation_id == this investigation has a parent RecordsRequest whose status IN {APPEAL_FILED, LITIGATION_AUTHORIZED}, else ERR_SOURCE_REQUEST_UNRESOLVED"
          - "all publication gates in validations priorities 125-220 pass"
        side_effects:
          - "same as the FINDINGS_LOCKED -> PUBLISHED transition"
        note: "A CLEARED investigation may publish while Desk.security_posture == RESTRICTED; a merely FINDINGS_LOCKED one may not."

  - entity: AnalysisRun
    shape: "parallel dimensions (code_review_status x cost_allocation_status evolve independently on the same row)"
    initial_state: "PENDING_REVIEW / NOT_ALLOCATED"
    terminal_states: []
    parallel_dimensions:
      - field: code_review_status
        states: [PENDING_REVIEW, CHANGES_REQUESTED, APPROVED]
      - field: cost_allocation_status
        states: [NOT_ALLOCATED, ALLOCATED]
    transitions:
      - from: "code_review_status=PENDING_REVIEW"
        to: "code_review_status=APPROVED"
        trigger: "POST /records-desk/analysis-runs/{id}/peer-review with decision == APPROVED"
        actor: PeerReviewer
        preconditions:
          - "AnalysisRun.code_review_status IN {PENDING_REVIEW, CHANGES_REQUESTED}, else ERR_INVALID_RUN_STATE"
          - "X-User-ID != AnalysisRun.authored_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets code_review_status = APPROVED, increments review_cycle_count by 1, records peer_review_note and reviewed_by_user_id"
          - "leaves cost_allocation_status untouched"
          - "recomputes Investigation.analysis_readiness"
      - from: "code_review_status=PENDING_REVIEW"
        to: "code_review_status=CHANGES_REQUESTED"
        trigger: "POST /records-desk/analysis-runs/{id}/peer-review with decision == CHANGES_REQUESTED"
        actor: PeerReviewer
        preconditions:
          - "AnalysisRun.code_review_status IN {PENDING_REVIEW, CHANGES_REQUESTED}, else ERR_INVALID_RUN_STATE"
          - "X-User-ID != AnalysisRun.authored_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets code_review_status = CHANGES_REQUESTED, increments review_cycle_count by 1"
          - "recomputes Investigation.analysis_readiness"
      - from: "code_review_status=CHANGES_REQUESTED"
        to: "code_review_status=APPROVED"
        trigger: "POST /records-desk/analysis-runs/{id}/peer-review with decision == APPROVED"
        actor: PeerReviewer
        preconditions:
          - "AnalysisRun.code_review_status == CHANGES_REQUESTED"
          - "X-User-ID != AnalysisRun.authored_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets code_review_status = APPROVED, increments review_cycle_count by 1"
          - "recomputes Investigation.analysis_readiness"
        note: "CYCLE within dimension 1: review rounds may loop PENDING_REVIEW -> CHANGES_REQUESTED -> APPROVED."
      - from: "code_review_status=APPROVED"
        to: "code_review_status=CHANGES_REQUESTED"
        trigger: "POST /records-desk/datasets/{id}/quarantine (cascade hop 2)"
        actor: system
        preconditions:
          - "AnalysisRun.code_review_status == APPROVED"
          - "the quarantined Dataset.investigation_id == AnalysisRun.investigation_id"
        side_effects:
          - "sets code_review_status = CHANGES_REQUESTED"
      - from: "cost_allocation_status=NOT_ALLOCATED"
        to: "cost_allocation_status=ALLOCATED"
        trigger: "POST /records-desk/analysis-runs/{id}/cost-allocation"
        actor: DataReporter
        preconditions:
          - "at least one Dataset with investigation_id == AnalysisRun.investigation_id has status == CLEAN_LOCKED, else ERR_NO_ALLOCABLE_INPUTS"
        side_effects:
          - "computes AnalysisRun.labor_cost_cents and total_cost_cents"
          - "writes Dataset.allocated_cost_cents for every allocable dataset per calculations.analysis_cost_allocation"
          - "sets AnalysisRun.allocated_total_cents = total_cost_cents and cost_allocation_status = ALLOCATED"
          - "leaves code_review_status untouched"
          - "recomputes Investigation.analysis_readiness"
      - from: "cost_allocation_status=ALLOCATED"
        to: "cost_allocation_status=NOT_ALLOCATED"
        trigger: "POST /records-desk/datasets/{id}/quarantine (cascade hop 2)"
        actor: system
        preconditions:
          - "AnalysisRun.cost_allocation_status == ALLOCATED"
          - "the quarantined Dataset.investigation_id == AnalysisRun.investigation_id"
        side_effects:
          - "sets cost_allocation_status = NOT_ALLOCATED and allocated_total_cents = 0"

  - entity: Finding
    shape: "cyclic (verification can be revoked back to UNVERIFIED from any verified state)"
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: DOC_MATCHED
        trigger: "POST /records-desk/findings/{id}/document-match"
        actor: DataReporter
        preconditions:
          - "Finding.verification_status == UNVERIFIED, else ERR_INVALID_FINDING_STATE"
        side_effects:
          - "records Finding.source_document_ref and matched_page"
          - "decrements Investigation.unverified_finding_count by 1 and increments Investigation.doc_matched_finding_count by 1"
          - "recomputes Investigation.analysis_readiness"
      - from: DOC_MATCHED
        to: SME_CONFIRMED
        trigger: "POST /records-desk/review-assignments/{id}/verdict with verdict == CONFIRMED"
        actor: ExpertReviewer
        preconditions:
          - "Finding.verification_status == DOC_MATCHED, else ERR_INVALID_FINDING_STATE"
          - "ReviewAssignment.status == ASSIGNED"
          - "X-User-ID == ReviewAssignment.reviewer_id, else ERR_ASSIGNMENT_NOT_OWNED"
        side_effects:
          - "sets ReviewAssignment.status = COMPLETED, verdict = CONFIRMED, rationale recorded; decrements ExpertReviewer.active_assignment_count by 1"
          - "decrements Investigation.doc_matched_finding_count by 1 and increments Investigation.sme_confirmed_finding_count by 1"
          - "recomputes Investigation.analysis_readiness"
      - from: DOC_MATCHED
        to: SME_DISPUTED
        trigger: "POST /records-desk/review-assignments/{id}/verdict with verdict == DISPUTED"
        actor: ExpertReviewer
        preconditions:
          - "Finding.verification_status == DOC_MATCHED, else ERR_INVALID_FINDING_STATE"
          - "ReviewAssignment.status == ASSIGNED"
          - "X-User-ID == ReviewAssignment.reviewer_id, else ERR_ASSIGNMENT_NOT_OWNED"
        side_effects:
          - "sets ReviewAssignment.status = COMPLETED, verdict = DISPUTED; decrements ExpertReviewer.active_assignment_count by 1"
          - "decrements Investigation.doc_matched_finding_count by 1 and increments Investigation.sme_disputed_finding_count by 1"
          - "recomputes Investigation.analysis_readiness (a single disputed finding forces NOT_READY)"
      - from: DOC_MATCHED
        to: UNVERIFIED
        trigger: "POST /records-desk/findings/{id}/verification-revocation"
        actor: ManagingEditor
        preconditions:
          - "Finding.verification_status IN {DOC_MATCHED, SME_CONFIRMED, SME_DISPUTED}, else ERR_INVALID_FINDING_STATE"
        side_effects:
          - "CASCADE HOP 1: sets Finding.verification_status = UNVERIFIED, clears matched_page and sme_verdict_rationale, and moves the finding's count from its previous bucket back to Investigation.unverified_finding_count"
          - "CASCADE HOP 2: because the finding is unverified again, every ReviewAssignment for this finding with status IN {ASSIGNED, COMPLETED} moves to RELEASED, and ExpertReviewer.active_assignment_count decrements for each formerly ASSIGNED row"
          - "CASCADE HOP 3: because the finding partition changed, Investigation.analysis_readiness recomputes and an Investigation in FINDINGS_LOCKED reverts to ANALYSIS"
        note: "Same transition applies from SME_CONFIRMED and from SME_DISPUTED; the from-set is {DOC_MATCHED, SME_CONFIRMED, SME_DISPUTED}. This is the compensating action for the finding-partition invariant."

  - entity: ReviewAssignment
    shape: "linear with compensating release"
    initial_state: ASSIGNED
    terminal_states: [RELEASED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /records-desk/review-assignments/{id}/verdict"
        actor: ExpertReviewer
        preconditions:
          - "ReviewAssignment.status == ASSIGNED, else ERR_INVALID_FINDING_STATE"
          - "X-User-ID == ReviewAssignment.reviewer_id, else ERR_ASSIGNMENT_NOT_OWNED"
        side_effects:
          - "records verdict and rationale; decrements ExpertReviewer.active_assignment_count by 1 (frees aggregate capacity)"
          - "moves the linked Finding to SME_CONFIRMED or SME_DISPUTED"
      - from: ASSIGNED
        to: RELEASED
        trigger: "POST /records-desk/findings/{id}/verification-revocation (cascade hop 2)"
        actor: system
        preconditions:
          - "ReviewAssignment.status == ASSIGNED"
        side_effects:
          - "decrements ExpertReviewer.active_assignment_count by 1"
      - from: COMPLETED
        to: RELEASED
        trigger: "POST /records-desk/findings/{id}/verification-revocation (cascade hop 2)"
        actor: system
        preconditions:
          - "ReviewAssignment.status == COMPLETED"
        side_effects:
          - "clears verdict and rationale"

  - entity: SubjectResponseRequest
    shape: "branching with a system deadline transition"
    initial_state: DRAFT
    terminal_states: [RESPONDED, UNREACHABLE]
    transitions:
      - from: DRAFT
        to: NOTICE_ELIGIBLE
        trigger: "POST /records-desk/investigations/{id}/lock-findings (cascade hop 2)"
        actor: system
        preconditions:
          - "SubjectResponseRequest.status == DRAFT"
        side_effects:
          - "sets status = NOTICE_ELIGIBLE"
      - from: NOTICE_ELIGIBLE
        to: NOTICE_SENT
        trigger: "POST /records-desk/subject-response-requests/{id}/attempts (first attempt)"
        actor: RecordsCoordinator
        preconditions:
          - "SubjectResponseRequest.status == NOTICE_ELIGIBLE, else ERR_INVALID_SUBJECT_STATE"
        side_effects:
          - "appends the attempt to documented_attempts and increments attempt_count to 1"
          - "stamps notice_sent_at = now and response_deadline_at = now + MIN_NOTICE_HOURS hours"
      - from: NOTICE_SENT
        to: NOTICE_SENT
        trigger: "POST /records-desk/subject-response-requests/{id}/attempts (subsequent deliverable attempt)"
        actor: RecordsCoordinator
        preconditions:
          - "SubjectResponseRequest.status == NOTICE_SENT"
        side_effects:
          - "appends the attempt and increments attempt_count by 1"
          - "leaves notice_sent_at and response_deadline_at unchanged"
        note: "Self-loop: repeated documented attempts never re-base the notice clock."
      - from: NOTICE_SENT
        to: UNREACHABLE
        trigger: "POST /records-desk/subject-response-requests/{id}/attempts with deliverable == false when the post-increment attempt_count >= MIN_DOCUMENTED_ATTEMPTS (2)"
        actor: RecordsCoordinator
        preconditions:
          - "SubjectResponseRequest.status == NOTICE_SENT"
        side_effects:
          - "appends the attempt, increments attempt_count, sets status = UNREACHABLE"
      - from: NOTICE_SENT
        to: RESPONDED
        trigger: "POST /records-desk/subject-response-requests/{id}/response"
        actor: RecordsCoordinator
        preconditions:
          - "SubjectResponseRequest.status IN {NOTICE_SENT, NO_RESPONSE}, else ERR_INVALID_SUBJECT_STATE"
        side_effects:
          - "records response_text and on_the_record, sets status = RESPONDED"
      - from: NOTICE_SENT
        to: NO_RESPONSE
        trigger: "POST /records-desk/investigations/{id}/publication (system pre-step)"
        actor: system
        preconditions:
          - "SubjectResponseRequest.status == NOTICE_SENT"
          - "logical clock now >= SubjectResponseRequest.response_deadline_at"
        side_effects:
          - "sets status = NO_RESPONSE"
        note: "Automatic deadline transition evaluated at the start of every publication attempt."
      - from: NO_RESPONSE
        to: RESPONDED
        trigger: "POST /records-desk/subject-response-requests/{id}/response (late response)"
        actor: RecordsCoordinator
        preconditions:
          - "SubjectResponseRequest.status == NO_RESPONSE"
        side_effects:
          - "records response_text and on_the_record, sets status = RESPONDED"

  - entity: EnclaveSession
    shape: "linear with compensating cancellation"
    initial_state: BOOKED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: BOOKED
        to: CLOSED
        trigger: "POST /records-desk/enclave-sessions/{id}/closure"
        actor: LegalCounsel
        preconditions:
          - "EnclaveSession.status == BOOKED, else ERR_INVALID_SESSION_STATE"
          - "documents_returned_count == EnclaveSession.document_count, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets status = CLOSED and decrements SecureEnclave.booked_session_count by 1"
          - "releases the enclave occupancy span so a later booking may reuse it"
      - from: BOOKED
        to: CANCELLED
        trigger: "system cascade: appeal-denial hop 5, or POST /records-desk/desks/{id}/source-exposure-incidents"
        actor: system
        preconditions:
          - "EnclaveSession.status == BOOKED"
        side_effects:
          - "sets status = CANCELLED, records cancellation_reason_code, decrements SecureEnclave.booked_session_count by 1"

# ===========================================================================
# 1.2.1 Concurrency Rules (OCC only)
# ===========================================================================
concurrency_rules:
  - rule_id: request-create-stale-desk
    parent_entity: Desk
    write_endpoint: "POST /records-desk/records-requests"
    occ_field: "expected_desk_version"
    description: |
      Creating a RecordsRequest against a Desk whose version has advanced since
      the client last observed it is rejected as stale. This captures the
      create-with-supersede pattern: another writer may already have filed a
      request that withdrew the target of supersedes_request_id (a legitimate
      supersede under the Dataset/RecordsRequest lifecycle) or moved desk budget,
      so the current writer's view of the desk is out of date.
    error_id: ERR_STALE_DESK_VERSION
    http_status: 412
  - rule_id: analysis-run-create-stale-investigation
    parent_entity: Investigation
    write_endpoint: "POST /records-desk/analysis-runs"
    occ_field: "expected_investigation_version"
    description: |
      Creating an AnalysisRun against an Investigation whose version has advanced
      since the client last observed it is rejected as stale. A newly created run
      becomes the investigation's current run and legitimately supersedes the
      previously approved one, dropping analysis_readiness to NOT_READY, so a
      writer working from an out-of-date investigation view would silently discard
      another writer's approved run.
    error_id: ERR_STALE_INVESTIGATION_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules
# ===========================================================================
calculations:
  - name: statutory_deadline
    entity: RecordsRequest
    algorithm_type: chronological
    trigger: "POST /records-desk/records-requests/{id}/submit (initial), POST /records-desk/records-requests/{id}/clarification-response and POST /records-desk/appeals/{id}/decision with outcome == GRANTED (revision of the TOLLED variant only)"
    inputs:
      - "RecordsRequest.submitted_at (the instant of submit)"
      - "RecordsRequest.tolled_days_total (accumulated whole days of tolling)"
      - "Agency.initial_response_days"
      - "Agency.deadline_basis (CALENDAR_DAYS | BUSINESS_DAYS)"
      - "Agency.holiday_dates (list of YYYY-MM-DD strings)"
    constants:
      MAX_CLARIFICATION_ROUNDS: 3
      DEADLINE_TIME_OF_DAY: "23:59:59.000Z"
    formula: |
      add_days(start_date, n, basis, holidays):
        d = start_date
        if basis == "CALENDAR_DAYS":
          return d + n days
        # BUSINESS_DAYS: advance n times, skipping Saturday, Sunday and any date in holidays
        remaining = n
        while remaining > 0:
          d = d + 1 day
          if weekday(d) not in {SAT, SUN} and iso_date(d) not in holidays:
            remaining = remaining - 1
        return d

      submitted_date = the UTC calendar date of RecordsRequest.submitted_at
      due_at_strict  = iso_date(add_days(submitted_date, Agency.initial_response_days, basis, holidays)) + "T23:59:59.000Z"
      due_at_tolled  = iso_date(add_days(submitted_date, Agency.initial_response_days + tolled_days_total, basis, holidays)) + "T23:59:59.000Z"

      tolling_days_for_span(open_at, close_at):
        # whole basis-days from the open date INCLUSIVE to the close date EXCLUSIVE
        count = 0
        d = the UTC calendar date of open_at
        while d < the UTC calendar date of close_at:
          if basis == "CALENDAR_DAYS" or (weekday(d) not in {SAT, SUN} and iso_date(d) not in holidays):
            count = count + 1
          d = d + 1 day
        return count
    variants:
      - variant_name: STRICT
        description: "The unforgiving statutory deadline computed once at submission from initial_response_days alone. Never revised, no matter how many clarification rounds or granted appeals intervene. Published in the methodology as the agency's nominal obligation."
        applies_when: "always stamped at submit; exposed as RecordsRequest.due_at_strict"
      - variant_name: TOLLED
        description: "The enforceable deadline, computed from initial_response_days + tolled_days_total. Recomputed from the ORIGINAL submitted_date (not incrementally from the previous due date) every time tolled_days_total changes."
        applies_when: "recomputed on every clarification-response and on every granted appeal; exposed as RecordsRequest.due_at_tolled; this is the ONLY variant used for appeal ripeness and overdue determination"
    variant_divergence_example: |
      Agency: initial_response_days 10, deadline_basis BUSINESS_DAYS, holiday_dates ["2026-09-07"].
      Submit at 2026-08-03T09:00:00Z (a Monday).
        10 business days from 2026-08-03 -> 2026-08-17 (Mon).
        due_at_strict == "2026-08-17T23:59:59.000Z"
        due_at_tolled == "2026-08-17T23:59:59.000Z"  (tolled_days_total == 0)
      Clarification round 1 opened 2026-08-05T10:00:00Z, answered 2026-08-11T10:00:00Z.
        Business days from 2026-08-05 inclusive to 2026-08-11 exclusive: Aug 5, 6, 7, 10 -> 4.
        tolled_days_total == 4; 14 business days from 2026-08-03 -> 2026-08-21 (Fri).
        due_at_strict stays "2026-08-17T23:59:59.000Z"; due_at_tolled == "2026-08-21T23:59:59.000Z"
      Clarification round 2 opened 2026-08-12T09:00:00Z, answered 2026-08-14T09:00:00Z.
        Business days from 2026-08-12 inclusive to 2026-08-14 exclusive: Aug 12, 13 -> 2.
        tolled_days_total == 6; 16 business days from 2026-08-03 -> 2026-08-25 (Tue).
        due_at_strict stays "2026-08-17T23:59:59.000Z"; due_at_tolled == "2026-08-25T23:59:59.000Z"
      DIVERGENCE: the two variants differ by 6 business days; an appeal filed at
      2026-08-18T00:00:00Z would be ripe under STRICT but is NOT ripe, because
      ripeness reads due_at_tolled only.
    precision: "Whole days only; the time-of-day component of every deadline is exactly 23:59:59.000Z. No sub-day arithmetic."
    output_field: "RecordsRequest.due_at_strict, RecordsRequest.due_at_tolled, RecordsRequest.tolled_days_total"

  - name: fee_waiver_and_net_fee
    entity: RecordsRequest
    algorithm_type: tiered_pricing
    trigger: "POST /records-desk/records-requests/{id}/fee-determination"
    inputs:
      - "payload search_hours (decimal, up to 2 places)"
      - "payload page_count (integer >= 0)"
      - "Agency.search_fee_cents_per_hour"
      - "Agency.page_fee_cents"
      - "Agency.max_waiver_cents"
      - "RecordsRequest.waiver_requested (boolean)"
      - "RecordsRequest.public_interest_score (integer 0..100)"
    constants:
      SMALL_BALANCE_WAIVE_THRESHOLD_CENTS: 1500
      MAX_WAIVER_PCT: 0.95
      TIER_1_MAX_GROSS_CENTS: 5000
      TIER_1_PCT: 0.50
      TIER_2_MAX_GROSS_CENTS: 20000
      TIER_2_PCT: 0.75
      TIER_3_PCT: 0.90
      BONUS_HIGH_MIN_SCORE: 80
      BONUS_HIGH_PCT: 0.10
      BONUS_MID_MIN_SCORE: 60
      BONUS_MID_PCT: 0.05
    formula: |
      PINNED EVALUATION ORDER - the eight steps below MUST be applied in exactly
      this sequence. The waiver percentage depends on the gross fee, the cap
      depends on the percentage, and the small-balance rule depends on the capped
      waiver, so re-ordering any pair changes the result.

      step 1  search_fee_cents      = round_half_up(search_hours * Agency.search_fee_cents_per_hour)
      step 2  duplication_fee_cents = page_count * Agency.page_fee_cents
      step 3  gross_fee_cents       = search_fee_cents + duplication_fee_cents
      step 4  if RecordsRequest.waiver_requested == false:
                waiver_amount_cents = 0
                goto step 8
              tier_pct = 0.50 if gross_fee_cents <= 5000
                         0.75 if 5000 < gross_fee_cents <= 20000
                         0.90 if gross_fee_cents > 20000
              bonus_pct = 0.10 if public_interest_score >= 80
                          0.05 if 60 <= public_interest_score < 80
                          0.00 otherwise
              waiver_pct = min(0.95, tier_pct + bonus_pct)
      step 5  raw_waiver_cents    = round_half_up(gross_fee_cents * waiver_pct)
      step 6  capped_waiver_cents = min(raw_waiver_cents, Agency.max_waiver_cents)
      step 7  if (gross_fee_cents - capped_waiver_cents) < SMALL_BALANCE_WAIVE_THRESHOLD_CENTS:
                waiver_amount_cents = gross_fee_cents      # de-minimis balance is fully waived
              else:
                waiver_amount_cents = capped_waiver_cents
      step 8  net_fee_cents = gross_fee_cents - waiver_amount_cents
              # then, only if net_fee_cents <= Desk.fee_budget_available_cents:
              #   Desk.fee_budget_available_cents -= net_fee_cents
              #   Desk.fee_budget_committed_cents += net_fee_cents
              #   RecordsRequest.fee_committed_cents = net_fee_cents
              # else ERR_FEE_BUDGET_EXCEEDED
    worked_examples: |
      Agency A: search_fee_cents_per_hour 3500, page_fee_cents 25, max_waiver_cents 10000.

      CASE A (cap binds): search_hours 3.5, page_count 120, waiver_requested true, public_interest_score 85
        step 1 round_half_up(3.5 * 3500) = 12250
        step 2 120 * 25                  = 3000
        step 3 gross                     = 15250
        step 4 tier 0.75 (5000 < 15250 <= 20000) + bonus 0.10 = 0.85 -> waiver_pct 0.85
        step 5 round_half_up(15250 * 0.85) = round_half_up(12962.5) = 12963
        step 6 min(12963, 10000)           = 10000
        step 7 15250 - 10000 = 5250, not < 1500 -> waiver_amount_cents = 10000
        step 8 net_fee_cents = 5250
      CASE B (small-balance rule binds): search_hours 1.0, page_count 100, waiver_requested true, public_interest_score 85
        step 1 3500, step 2 2500, step 3 gross 6000
        step 4 tier 0.75 + bonus 0.10 = 0.85
        step 5 round_half_up(6000 * 0.85) = 5100
        step 6 min(5100, 10000) = 5100
        step 7 6000 - 5100 = 900, which is < 1500 -> waiver_amount_cents = 6000 (full waive)
        step 8 net_fee_cents = 0
      CASE C (no waiver requested): search_hours 3.5, page_count 120, waiver_requested false
        gross 15250, waiver_amount_cents 0, net_fee_cents 15250
      CASE D (MAX_WAIVER_PCT ceiling binds): gross > 20000 with public_interest_score 85
        search_hours 6.0, page_count 200 -> step 1 21000, step 2 5000, gross 26000
        tier 0.90 + bonus 0.10 = 1.00 -> min(0.95, 1.00) = 0.95
        step 5 round_half_up(26000 * 0.95) = 24700; step 6 min(24700, 10000) = 10000
        step 7 26000 - 10000 = 16000 -> waiver_amount_cents 10000; step 8 net 16000
      CASE E (half-up precision): Agency B with search_fee_cents_per_hour 3475, search_hours 2.5
        2.5 * 3475 = 8687.5 -> round_half_up -> 8688 (NOT 8687; banker's rounding would give 8688 here
        too, so also test 1.5 * 3475 = 5212.5 -> 5213, and 0.5 * 3475 = 1737.5 -> 1738)
    precision: "All money in integer cents. round_half_up means: add 0.5 to the exact decimal product and truncate toward zero for non-negative values. Percentages are exact decimals (0.50, 0.75, 0.90, 0.95, 0.05, 0.10) and are never rounded themselves."
    output_field: "RecordsRequest.search_fee_cents, duplication_fee_cents, gross_fee_cents, waiver_amount_cents, net_fee_cents, fee_committed_cents"

  - name: analysis_cost_allocation
    entity: AnalysisRun
    algorithm_type: waterfall_allocation
    trigger: "POST /records-desk/analysis-runs/{id}/cost-allocation"
    inputs:
      - "AnalysisRun.compute_cost_cents"
      - "AnalysisRun.labor_hours (decimal, up to 2 places)"
      - "the allocable Dataset set: every Dataset WHERE investigation_id == AnalysisRun.investigation_id AND status == CLEAN_LOCKED"
      - "Dataset.record_count for each allocable dataset"
    constants:
      LABOR_RATE_CENTS_PER_HOUR: 6500
    formula: |
      PINNED ROUNDING ORDER - round each dataset's share FIRST, then reconcile the
      residual against the earliest dataset. Rounding the total first, or spreading
      the residual proportionally, produces different per-dataset values.

      labor_cost_cents = round_half_up(labor_hours * 6500)
      total_cost_cents = compute_cost_cents + labor_cost_cents

      allocable = [Dataset WHERE investigation_id == run.investigation_id AND status == CLEAN_LOCKED]
                  ordered by created_at ASC, then name ASC   # name is globally unique, so the order is total
      if allocable is empty: ERR_NO_ALLOCABLE_INPUTS

      total_records = sum(d.record_count for d in allocable)
      for each d in allocable (in the order above):
        if total_records == 0:
          share[d] = 0
        else:
          share[d] = round_half_up(total_cost_cents * d.record_count / total_records)
      residual = total_cost_cents - sum(share[d] for d in allocable)
      share[allocable[0]] = share[allocable[0]] + residual      # residual (which may be negative) goes to the EARLIEST dataset only

      Dataset.allocated_cost_cents = share[d] for each allocable dataset
      AnalysisRun.allocated_total_cents = total_cost_cents
      # datasets not in the allocable set keep allocated_cost_cents unchanged
    worked_examples: |
      EXAMPLE 1 (negative residual): compute_cost_cents 12000, labor_hours 3.5
        labor_cost_cents = round_half_up(3.5 * 6500) = 22750
        total_cost_cents = 34750
        allocable, in created_at ASC order: "alpha-permits" rc 333, "beta-permits" rc 333, "gamma-permits" rc 334
        total_records = 1000
        raw shares: round_half_up(34750*333/1000) = round_half_up(11571.75) = 11572
                    round_half_up(34750*333/1000) = 11572
                    round_half_up(34750*334/1000) = round_half_up(11606.5) = 11607
        sum = 34751, residual = 34750 - 34751 = -1
        final: alpha-permits 11571, beta-permits 11572, gamma-permits 11607  (sum 34750)
      EXAMPLE 2 (zero-record edge): compute_cost_cents 5000, labor_hours 1.0
        labor_cost_cents = 6500, total_cost_cents = 11500
        allocable: "alpha-permits" rc 0, "beta-permits" rc 0 -> total_records 0
        every share = 0, residual = 11500 - 0 = 11500, all of it to the earliest dataset
        final: alpha-permits 11500, beta-permits 0
      EXAMPLE 3 (filtering): if "gamma-permits" is QUARANTINED at allocation time it is excluded
        entirely; with alpha rc 333 and beta rc 333, total_records 666,
        raw shares round_half_up(34750*333/666) = round_half_up(17375.0) = 17375 each,
        sum 34750, residual 0 -> alpha 17375, beta 17375.
      EXAMPLE 4 (empty set): every dataset for the investigation is RAW/CLEANING/QUARANTINED
        -> ERR_NO_ALLOCABLE_INPUTS (422), nothing is written.
    precision: "Integer cents throughout. round_half_up on each per-dataset share; the residual is an exact integer difference and is never rounded."
    output_field: "AnalysisRun.labor_cost_cents, AnalysisRun.total_cost_cents, AnalysisRun.allocated_total_cents, Dataset.allocated_cost_cents"

  - name: disclosure_risk_score
    entity: Investigation
    algorithm_type: weighted_scoring
    trigger: "GET /records-desk/investigations/{id}/disclosure-risk-preview (read-only) and POST /records-desk/investigations/{id}/publication (persisting)"
    inputs:
      - "the release Dataset (Investigation.release_dataset_id, or the release_dataset_id query parameter on the preview endpoint)"
      - "Dataset.record_count"
      - "the unsuppressed FieldDefinition set: every FieldDefinition WHERE dataset_id == the release dataset AND suppression_applied == false"
      - "FieldDefinition.reidentification_risk (integer 0..10)"
      - "FieldDefinition.is_source_identifying (boolean)"
      - "Investigation.publication_mode"
    constants:
      PUBLISH_RISK_CEILING: 60
      SOURCE_FIELD_AGGREGATE_BUMP: 10
      SOURCE_FIELD_COMPOSITE_PENALTY: 25
      SIZE_TIER_1_MAX_RECORDS: 1000
      SIZE_MULT_1: 1.0
      SIZE_TIER_2_MAX_RECORDS: 100000
      SIZE_MULT_2: 1.25
      SIZE_MULT_3: 1.5
      RISK_SCALE: 10
    formula: |
      unsuppressed = [FieldDefinition WHERE dataset_id == release_dataset_id AND suppression_applied == false]
      any_source   = any(f.is_source_identifying for f in unsuppressed)

      AGGREGATE_MAX variant:
        if unsuppressed is empty: aggregate_max_score = 0
        else:
          peak = max(f.reidentification_risk for f in unsuppressed) * 10
          aggregate_max_score = min(100, peak + (10 if any_source else 0))

      COMPOSITE_WEIGHTED variant:
        base    = sum(f.reidentification_risk for f in unsuppressed)
        density = base / max(1, count(unsuppressed))
        size_multiplier = 1.0  if record_count < 1000
                          1.25 if 1000 <= record_count < 100000
                          1.5  if record_count >= 100000
        penalty = 25 if any_source else 0
        composite_weighted_score = min(100, round_half_up(density * 10 * size_multiplier) + penalty)

      Variant selection by Investigation.publication_mode:
        FULL_DATA_RELEASE -> applicable_variant COMPOSITE_WEIGHTED, applicable_score = composite_weighted_score
        AGGREGATES_ONLY   -> applicable_variant AGGREGATE_MAX,      applicable_score = aggregate_max_score
        METHODOLOGY_ONLY  -> applicable_variant NONE,               applicable_score = 0

      Publication gate: reject with ERR_DISCLOSURE_RISK_TOO_HIGH when
      applicable_score > PUBLISH_RISK_CEILING (a score of exactly 60 publishes).
    variants:
      - variant_name: AGGREGATE_MAX
        description: "Worst-single-field exposure. Governs aggregate-only publication, where a reader sees summary statistics and the risk is dominated by the single most identifying column."
        applies_when: "Investigation.publication_mode == AGGREGATES_ONLY"
      - variant_name: COMPOSITE_WEIGHTED
        description: "Average-density exposure scaled by dataset size with a flat source-identification penalty. Governs full row-level release, where risk grows with how many columns are jointly available and how many rows can be cross-matched."
        applies_when: "Investigation.publication_mode == FULL_DATA_RELEASE"
    variant_divergence_example: |
      Release dataset: record_count 5000. Field definitions:
        "permit_holder_zip"    reidentification_risk 8, is_source_identifying false, suppression_applied false
        "permit_type"          reidentification_risk 3, is_source_identifying false, suppression_applied false
        "inspector_badge_id"   reidentification_risk 6, is_source_identifying TRUE,  suppression_applied TRUE
      unsuppressed = the first two; any_source == false (the source field is suppressed).
        AGGREGATE_MAX:      max risk 8 * 10 = 80, + 0 -> 80
        COMPOSITE_WEIGHTED: base 11, count 2, density 5.5, 5.5*10 = 55, *1.25 = 68.75
                            -> round_half_up 69, + 0 penalty -> 69
      DIVERGENCE: 80 vs 69 on identical data. Under AGGREGATES_ONLY the publication is
      rejected (80 > 60); under FULL_DATA_RELEASE it is also rejected (69 > 60), but the
      error's reported applicable_score differs, and unsuppressing "inspector_badge_id"
      moves AGGREGATE_MAX to min(100, 80+10) = 90 while COMPOSITE_WEIGHTED becomes
      base 17, count 3, density 5.666..., 56.666...*1.25 = 70.833... -> 71, + 25 -> 96.
      PUBLISHABLE EXAMPLE: record_count 500, unsuppressed risks 4 and 2, no source field.
        AGGREGATE_MAX 40; COMPOSITE_WEIGHTED base 6, count 2, density 3.0, 30*1.0 = 30 -> 30.
        Both are <= 60, so publication proceeds under either mode.
      OPPOSITE-GATE DIVERGENCE (the sharpest case): record_count 500, unsuppressed risks 8 and 3,
        no source field. AGGREGATE_MAX = 8*10 = 80. COMPOSITE_WEIGHTED: base 11, count 2,
        density 5.5, 55 * 1.0 = 55 -> 55. Under AGGREGATES_ONLY the publication is REJECTED with
        ERR_DISCLOSURE_RISK_TOO_HIGH (80 > 60); under FULL_DATA_RELEASE, on byte-identical field
        data, the publication SUCCEEDS with disclosure_risk_score 55 and
        applicable_risk_variant COMPOSITE_WEIGHTED.
      CEILING EXAMPLE (exactly at the boundary): record_count 500, one unsuppressed field
        with reidentification_risk 6 -> AGGREGATE_MAX 60, COMPOSITE 60. Publication SUCCEEDS.
        Raise that field to reidentification_risk 7 -> 70 under both variants -> rejected.
    precision: "Scores are integers 0..100. density is an exact rational; round_half_up is applied once, after the size multiplier and before the source penalty is added. The min(100, ...) clamp is applied last."
    output_field: "Investigation.disclosure_risk_score, Investigation.applicable_risk_variant"

  - name: subject_notice_sufficiency
    entity: SubjectResponseRequest
    algorithm_type: threshold
    trigger: "POST /records-desk/subject-response-requests/{id}/attempts (stamping) and POST /records-desk/investigations/{id}/publication (gating)"
    inputs:
      - "SubjectResponseRequest.notice_sent_at"
      - "SubjectResponseRequest.attempt_count"
      - "SubjectResponseRequest.status"
      - "the logical clock now"
    constants:
      MIN_NOTICE_HOURS: 72
      MIN_DOCUMENTED_ATTEMPTS: 2
    formula: |
      On the first attempt: response_deadline_at = notice_sent_at + 72 hours (exact).

      At publication, for every SubjectResponseRequest of the investigation whose
      status != DRAFT, evaluated after the NOTICE_SENT -> NO_RESPONSE system pre-step:
        notice_elapsed_hours = (now - notice_sent_at) in exact hours
        sufficient_notice = notice_sent_at is not null AND notice_elapsed_hours >= 72
        sufficient_attempts = attempt_count >= 2

        if status == UNREACHABLE: both gates are satisfied by the documented-attempts
          record regardless of elapsed time (the subject cannot be reached), provided
          attempt_count >= 2.
        else if not sufficient_notice: ERR_INSUFFICIENT_NOTICE (422)
        else if not sufficient_attempts: ERR_INSUFFICIENT_ATTEMPTS (422)
      A SubjectResponseRequest still in NOTICE_ELIGIBLE or DRAFT at publication time
      yields ERR_SUBJECT_NOTICE_PENDING (409) - no notice has been sent at all.
    worked_examples: |
      notice_sent_at 2026-08-20T09:00:00Z -> response_deadline_at 2026-08-23T09:00:00Z.
        now 2026-08-23T08:59:59Z -> elapsed 71.999..h -> ERR_INSUFFICIENT_NOTICE
        now 2026-08-23T09:00:00Z -> elapsed exactly 72.000h -> notice gate PASSES
        (and the same instant satisfies now >= response_deadline_at, so a still-NOTICE_SENT
        row moves to NO_RESPONSE in the publication pre-step)
      attempt_count 1 with elapsed 100h -> ERR_INSUFFICIENT_ATTEMPTS
      attempt_count 2 with elapsed 48h  -> ERR_INSUFFICIENT_NOTICE (notice is checked first,
        priority 170 before 180)
    precision: "Exact instant arithmetic to millisecond resolution; the comparison is >= (72.000h passes)."
    output_field: "SubjectResponseRequest.response_deadline_at, SubjectResponseRequest.status"

  - name: investigation_analysis_readiness
    entity: Investigation
    algorithm_type: constraint_propagation
    trigger: "every AnalysisRun create / peer-review / cost-allocation, every Finding document-match / verdict / verification-revocation, and every Dataset quarantine that touches the investigation"
    inputs:
      - "the current AnalysisRun: the AnalysisRun for this investigation with the highest run_sequence"
      - "Investigation.unverified_finding_count, doc_matched_finding_count, sme_confirmed_finding_count, sme_disputed_finding_count"
      - "Investigation.finding_count"
    constants:
      MIN_CONFIRMED_FINDINGS: 1
    formula: |
      PARTITION INVARIANT (must hold after every mutation):
        finding_count == unverified_finding_count + doc_matched_finding_count
                       + sme_confirmed_finding_count + sme_disputed_finding_count

      current_run = the AnalysisRun for this investigation with MAX(run_sequence)
                    (run_sequence is assigned as 1 + the count of existing runs, so it is
                     unique per investigation and independent of created_at ties)

      analysis_readiness = READY iff ALL of:
        current_run is not null
        current_run.code_review_status == APPROVED
        current_run.cost_allocation_status == ALLOCATED
        sme_confirmed_finding_count >= 1
        sme_disputed_finding_count == 0
        unverified_finding_count == 0
        doc_matched_finding_count == 0
      otherwise analysis_readiness = NOT_READY
    worked_examples: |
      Two findings, both document-matched then both SME_CONFIRMED; current run APPROVED and
      ALLOCATED -> finding_count 2, unverified 0, doc_matched 0, sme_confirmed 2,
      sme_disputed 0 -> READY, so lock-findings succeeds.
      Revoke verification on one of them -> unverified 1, sme_confirmed 1, partition still
      sums to 2 -> NOT_READY, and a FINDINGS_LOCKED investigation reverts to ANALYSIS.
      A single SME_DISPUTED finding with everything else confirmed -> NOT_READY.
      Creating a fresh AnalysisRun (run_sequence 2) makes the current run PENDING_REVIEW /
      NOT_ALLOCATED -> NOT_READY even though nothing about the findings changed.
    precision: "Integer counts; no rounding."
    output_field: "Investigation.analysis_readiness"

  - name: desk_security_posture
    entity: Desk
    algorithm_type: threshold
    trigger: "every transition that changes Desk.litigation_exposure_count or Desk.source_exposure_incident_count"
    inputs:
      - "Desk.source_exposure_incident_count"
      - "Desk.litigation_exposure_count"
    constants:
      LOCKDOWN_MIN_SOURCE_INCIDENTS: 1
      RESTRICTED_MIN_LITIGATION: 1
    formula: |
      ORDERED, first match wins:
        if source_exposure_incident_count >= 1: security_posture = LOCKDOWN
        elif litigation_exposure_count >= 1:    security_posture = RESTRICTED
        else:                                    security_posture = OPEN
      Gating effect:
        LOCKDOWN   -> every publication, legal-clearance and enclave booking is refused with ERR_DESK_LOCKDOWN (409)
        RESTRICTED -> publication requires Investigation.status == CLEARED; a FINDINGS_LOCKED
                      investigation is refused with ERR_INVESTIGATION_NOT_CLEARED (409)
        OPEN       -> publication allowed from FINDINGS_LOCKED or CLEARED
    worked_examples: |
      Fresh desk: 0 / 0 -> OPEN.
      One appeal denied -> litigation_exposure_count 1 -> RESTRICTED (publication now needs legal clearance).
      One source-exposure incident on top of that -> LOCKDOWN (the litigation count is irrelevant; the
      source incident wins the ordered evaluation).
    precision: "Integer counts; no rounding."
    output_field: "Desk.security_posture"

  - name: desk_fee_budget_ledger
    entity: Desk
    algorithm_type: aggregation
    trigger: "every fee-determination, appeal filing, agency-decision, withdrawal, appeal decision and budget-adjustment"
    inputs:
      - "Desk.fee_budget_total_cents"
      - "Desk.fee_budget_available_cents"
      - "Desk.fee_budget_committed_cents"
      - "Desk.fee_budget_spent_cents"
    constants: {}
    formula: |
      CONSERVED QUANTITY (must hold after every single mutation, with no drift):
        fee_budget_total_cents == fee_budget_available_cents
                                + fee_budget_committed_cents
                                + fee_budget_spent_cents

      commit(n):   available -= n; committed += n          # fee-determination, appeal filing
      settle(n):   committed -= n; spent += n              # release / partial release / appeal decision
      release(n):  committed -= n; available += n          # denial, withdrawal (the compensating action)
      adjust(d):   total += d; available += d              # POST /desks/{id}/budget-adjustments, d may be negative
                   # refused with ERR_FEE_BUDGET_EXCEEDED if available + d < 0

      Every commit is refused with ERR_FEE_BUDGET_EXCEEDED (402) when n > available.
    worked_examples: |
      total 500000, available 500000, committed 0, spent 0.
      fee-determination nets 5250 -> available 494750, committed 5250, spent 0 (sum 500000).
      appeal filed with filing_fee_cents 4500 -> available 490250, committed 9750, spent 0.
      appeal DENIED -> committed 5250, spent 4500, available 490250 (sum 500000).
      request withdrawal returns the 5250 commitment -> available 495500, committed 0, spent 4500
      (sum 500000, and RecordsRequest.fee_committed_cents == 0). No drift.
    precision: "Integer cents; no rounding anywhere in the ledger."
    output_field: "Desk.fee_budget_available_cents, Desk.fee_budget_committed_cents, Desk.fee_budget_spent_cents, Desk.fee_budget_total_cents"

  - name: dataset_retention_expiry
    entity: Dataset
    algorithm_type: chronological
    trigger: "POST /records-desk/datasets/{id}/delivery"
    inputs:
      - "the logical clock now at delivery"
      - "Desk.retention_policy_days (resolved via Dataset.request_id -> RecordsRequest.desk_id)"
    constants:
      RETENTION_TIME_OF_DAY: "23:59:59.000Z"
    formula: |
      delivery_date = the UTC calendar date of the logical clock at delivery
      retention_expires_at = iso_date(delivery_date + Desk.retention_policy_days CALENDAR days) + "T23:59:59.000Z"
      Retention is always calendar-day based; Agency.deadline_basis does not apply.
    worked_examples: |
      Desk.retention_policy_days 1095, delivery at 2026-08-20T14:30:00Z
        -> 2026-08-20 + 1095 days = 2029-08-19 -> retention_expires_at "2029-08-19T23:59:59.000Z"
      Desk.retention_policy_days 365 (the minimum the field allows), delivery at 2026-08-20T14:30:00Z
        -> 2026-08-20 + 365 days = 2027-08-20 -> "2027-08-20T23:59:59.000Z"
    precision: "Whole calendar days; fixed time-of-day 23:59:59.000Z."
    output_field: "Dataset.retention_expires_at"

  - name: enclave_occupancy_span
    entity: EnclaveSession
    algorithm_type: interval_merge
    trigger: "POST /records-desk/enclave-sessions"
    inputs:
      - "payload start_at, end_at"
      - "SecureEnclave.sanitization_buffer_minutes"
      - "every existing EnclaveSession for the same enclave_id with status == BOOKED"
    constants: {}
    formula: |
      occupied_span(s) = [ s.start_at , s.end_at + SecureEnclave.sanitization_buffer_minutes )
      HALF-OPEN: the span excludes its own upper endpoint.

      A candidate booking conflicts with an existing BOOKED session e iff
        candidate.start_at < (e.end_at + buffer)  AND  e.start_at < (candidate.end_at + buffer)
      Conflict is PAIRWISE EXCLUSION against every BOOKED session individually - the enclave
      admits exactly one session at a time, so there is no per-enclave count threshold.
      CLOSED and CANCELLED sessions never conflict.
      On conflict: ERR_ENCLAVE_SESSION_OVERLAP (409).
      Also required: end_at > start_at (else ERR_INVALID_REQUEST) and
      document_count <= SecureEnclave.max_documents (else ERR_ENCLAVE_DOCUMENT_LIMIT).
    worked_examples: |
      SecureEnclave.sanitization_buffer_minutes 30.
      Existing BOOKED session: [2026-08-20T09:00:00Z, 2026-08-20T11:00:00Z) -> occupies to 11:30:00Z exclusive.
        candidate [2026-08-20T11:29:00Z, 2026-08-20T13:00:00Z) -> 11:29 < 11:30 -> ERR_ENCLAVE_SESSION_OVERLAP
        candidate [2026-08-20T11:30:00Z, 2026-08-20T13:00:00Z) -> 11:30 is NOT < 11:30 -> ACCEPTED
        candidate [2026-08-20T08:00:00Z, 2026-08-20T09:00:00Z) -> its own span runs to 09:30,
          and 09:00 < 09:30 -> ERR_ENCLAVE_SESSION_OVERLAP (the buffer applies to the candidate too)
        candidate [2026-08-20T07:00:00Z, 2026-08-20T08:30:00Z) -> span to 09:00; 09:00 is NOT < 09:00
          on the left test (candidate.start 07:00 < 11:30 is true) but e.start 09:00 < candidate.end+buffer
          09:00 is false -> ACCEPTED
      After the existing session is CLOSED, the 11:29 candidate is ACCEPTED.
    precision: "Millisecond instant comparison; strict < on both sides (half-open intervals)."
    output_field: "EnclaveSession.status, SecureEnclave.booked_session_count"

  - name: reviewer_capacity_window
    entity: ExpertReviewer
    algorithm_type: aggregation
    trigger: "POST /records-desk/review-assignments"
    inputs:
      - "payload window_start, window_end"
      - "ExpertReviewer.max_concurrent_assignments"
      - "every existing ReviewAssignment for the same reviewer_id with status == ASSIGNED"
    constants: {}
    formula: |
      An assignment occupies the CLOSED interval [window_start, window_end] - both endpoints
      inclusive. Two assignments overlap iff
        a.window_start <= b.window_end  AND  b.window_start <= a.window_end

      AGGREGATE CAPACITY (not pairwise exclusion): let
        overlapping = count of existing ASSIGNED assignments for this reviewer that overlap
                      the candidate window
      Reject with ERR_REVIEWER_CAPACITY_EXCEEDED (409) iff
        overlapping + 1 > ExpertReviewer.max_concurrent_assignments
      COMPLETED and RELEASED assignments do not count, which is what makes the verdict and
      the verification-revocation cascade free capacity.
      Also required: window_end > window_start (else ERR_INVALID_REQUEST).
    worked_examples: |
      Reviewer with max_concurrent_assignments 2.
      Existing ASSIGNED: A1 [2026-09-01T00:00:00Z, 2026-09-05T00:00:00Z]
                         A2 [2026-09-03T00:00:00Z, 2026-09-07T00:00:00Z]
        candidate [2026-09-05T00:00:00Z, 2026-09-06T00:00:00Z]
          overlaps A1 (09-05T00:00:00 <= 09-05T00:00:00, closed endpoint touch) and A2 -> overlapping 2
          2 + 1 = 3 > 2 -> ERR_REVIEWER_CAPACITY_EXCEEDED
        candidate [2026-09-05T00:00:00.001Z, 2026-09-06T00:00:00Z]
          overlaps A2 only -> overlapping 1, 1 + 1 = 2, not > 2 -> ACCEPTED
        candidate [2026-09-08T00:00:00Z, 2026-09-09T00:00:00Z] -> overlapping 0 -> ACCEPTED
      NOTE the deliberate contrast with enclave_occupancy_span: reviewer windows are CLOSED
      intervals compared against an aggregate count of 2, while enclave spans are HALF-OPEN
      with a sanitization buffer and pairwise exclusion.
    precision: "Millisecond instant comparison; <= on both sides (closed intervals)."
    output_field: "ExpertReviewer.active_assignment_count, ReviewAssignment.status"

# ===========================================================================
# 1.4 Validation Priority Table
# ===========================================================================
# Rules are evaluated in ascending priority order. The FIRST rule whose
# condition is violated determines the response; no later rule is evaluated.
# Priorities are spaced by 10 so that later insertions never renumber the table.
validations:
  - priority: 10
    rule: "Both X-User-ID and X-User-Role headers must be present and non-empty on every endpoint."
    applies_to: "all endpoints"
    category: auth
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
  - priority: 20
    rule: "X-User-Role must name one of the six roles declared in the RBAC matrix."
    applies_to: "all endpoints"
    category: auth
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
  - priority: 30
    rule: "The role in X-User-Role must appear in the target endpoint's allowed roles."
    applies_to: "all endpoints"
    category: rbac
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
  - priority: 40
    rule: "Every path parameter must resolve to an existing entity, checked left to right; the leftmost unresolved segment determines the error."
    applies_to: "all endpoints with path parameters"
    category: existence
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
  - priority: 50
    rule: "The request body must satisfy the endpoint's declared input contract: all required fields present, correct JSON types, enum values drawn from the declared set, integers within declared ranges, ISO-8601 instants parseable, end instants strictly after start instants, and no unknown field causing a failure (unknown fields are ignored)."
    applies_to: "all POST endpoints"
    category: schema
    error_id: ERR_INVALID_REQUEST
    http_status: 400
  - priority: 60
    rule: "Every foreign-key field in the request body must resolve to an existing entity, checked in the field order declared by the endpoint's input contract."
    applies_to: "all POST endpoints carrying foreign keys"
    category: referential
    error_id: "the matching ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
  - priority: 70
    rule: "X-User-ID must equal ReviewAssignment.reviewer_id when submitting a verdict; a reviewer may not act on another reviewer's assignment."
    applies_to: "POST /records-desk/review-assignments/{id}/verdict"
    category: ownership
    error_id: ERR_ASSIGNMENT_NOT_OWNED
    http_status: 403
  - priority: 80
    rule: "X-User-ID must differ from AnalysisRun.authored_by_user_id when peer-reviewing that run; an analyst may not review their own code."
    applies_to: "POST /records-desk/analysis-runs/{id}/peer-review"
    category: segregation_of_duties
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
  - priority: 90
    rule: "When the endpoint declares an expected_<parent>_version field, its value must equal the parent's current version."
    applies_to: "POST /records-desk/records-requests, POST /records-desk/analysis-runs"
    category: concurrency
    error_id: "ERR_STALE_DESK_VERSION or ERR_STALE_INVESTIGATION_VERSION"
    http_status: 412
  - priority: 100
    rule: "The target entity must be in a state from which the requested transition is declared in the state machine table; for state-gated endpoints that do not change status (fee-determination requires AWAITING_AGENCY_RESPONSE, cost-allocation requires the run's investigation to be in ANALYSIS or FINDINGS_LOCKED, field-definition creation requires the dataset to be RAW or CLEANING, field suppression requires the dataset not to be QUARANTINED) the declared precondition applies instead."
    applies_to: "all transition endpoints and all state-gated mutation endpoints"
    category: state
    error_id: "ERR_INVALID_REQUEST_STATE, ERR_INVALID_APPEAL_STATE, ERR_INVALID_DATASET_STATE, ERR_INVALID_INVESTIGATION_STATE, ERR_INVALID_RUN_STATE, ERR_INVALID_FINDING_STATE, ERR_INVALID_SUBJECT_STATE or ERR_INVALID_SESSION_STATE, according to the entity"
    http_status: 409
  - priority: 105
    rule: "A supersedes_request_id, when supplied, must target a RecordsRequest whose status is DRAFT, AWAITING_AGENCY_RESPONSE or CLARIFICATION_REQUESTED."
    applies_to: "POST /records-desk/records-requests"
    category: state
    error_id: ERR_SUPERSEDE_TARGET_NOT_ACTIVE
    http_status: 409
  - priority: 108
    rule: "A fee determination may be performed at most once per RecordsRequest; fee_determined_at must be null."
    applies_to: "POST /records-desk/records-requests/{id}/fee-determination"
    category: state
    error_id: ERR_FEE_ALREADY_DETERMINED
    http_status: 409
  - priority: 110
    rule: "Desk.security_posture must not be LOCKDOWN for publication, legal clearance, or enclave-session booking."
    applies_to: "POST /records-desk/investigations/{id}/publication, POST /records-desk/investigations/{id}/legal-clearance, POST /records-desk/enclave-sessions"
    category: business_safety
    error_id: ERR_DESK_LOCKDOWN
    http_status: 409
  - priority: 112
    rule: "When Desk.security_posture == RESTRICTED, only an Investigation whose status is CLEARED may publish; a merely FINDINGS_LOCKED investigation must obtain legal clearance first."
    applies_to: "POST /records-desk/investigations/{id}/publication"
    category: cross_entity_state
    error_id: ERR_INVESTIGATION_NOT_CLEARED
    http_status: 409
  - priority: 115
    rule: "Clarification may only be opened against an Agency whose tolling_allowed is true."
    applies_to: "POST /records-desk/records-requests/{id}/clarification-request"
    category: business_constraint
    error_id: ERR_TOLLING_NOT_PERMITTED
    http_status: 422
  - priority: 118
    rule: "RecordsRequest.clarification_round_count must be strictly less than MAX_CLARIFICATION_ROUNDS (3) before a new round is opened."
    applies_to: "POST /records-desk/records-requests/{id}/clarification-request"
    category: business_constraint
    error_id: ERR_CLARIFICATION_LIMIT_REACHED
    http_status: 409
  - priority: 120
    rule: "A Dataset may only be delivered when its parent RecordsRequest.status is RELEASED or PARTIALLY_RELEASED; and an Investigation may only publish when no Dataset it uses has a parent RecordsRequest whose status is APPEAL_FILED or LITIGATION_AUTHORIZED."
    applies_to: "POST /records-desk/datasets/{id}/delivery, POST /records-desk/investigations/{id}/publication"
    category: cross_entity_state
    error_id: ERR_SOURCE_REQUEST_UNRESOLVED
    http_status: 409
  - priority: 125
    rule: "Publication with publication_mode FULL_DATA_RELEASE or AGGREGATES_ONLY must name a release_dataset_id; METHODOLOGY_ONLY must not."
    applies_to: "POST /records-desk/investigations/{id}/publication"
    category: business_referential
    error_id: ERR_RELEASE_DATASET_REQUIRED
    http_status: 422
  - priority: 130
    rule: "No FieldDefinition of the release dataset may have is_source_identifying true while suppression_applied is false at publication time; an unsuppressed source-identifying column would burn a source."
    applies_to: "POST /records-desk/investigations/{id}/publication"
    category: business_safety
    error_id: ERR_SOURCE_EXPOSURE_RISK
    http_status: 422
  - priority: 140
    rule: "The applicable disclosure risk score (per calculations.disclosure_risk_score, using the variant selected by publication_mode) must not exceed PUBLISH_RISK_CEILING (60)."
    applies_to: "POST /records-desk/investigations/{id}/publication"
    category: business_safety
    error_id: ERR_DISCLOSURE_RISK_TOO_HIGH
    http_status: 422
  - priority: 150
    rule: "An ExpertReviewer may not be assigned to a Finding whose investigation draws on a Dataset sourced from an Agency listed in ExpertReviewer.conflict_of_interest_agency_ids."
    applies_to: "POST /records-desk/review-assignments"
    category: business_safety
    error_id: ERR_REVIEWER_CONFLICT_OF_INTEREST
    http_status: 422
  - priority: 160
    rule: "An Appeal on the delay ground requires the logical clock to be STRICTLY after RecordsRequest.due_at_tolled; an Appeal on the denial or partial-release ground requires the corresponding request status."
    applies_to: "POST /records-desk/appeals"
    category: business_temporal
    error_id: ERR_APPEAL_NOT_RIPE
    http_status: 409
  - priority: 162
    rule: "Appeal.venue must equal Agency.appeal_venue for the request's agency."
    applies_to: "POST /records-desk/appeals"
    category: business_constraint
    error_id: ERR_APPEAL_VENUE_MISMATCH
    http_status: 422
  - priority: 165
    rule: "Every SubjectResponseRequest of the investigation must have progressed past NOTICE_ELIGIBLE (that is, notice_sent_at is not null) before publication."
    applies_to: "POST /records-desk/investigations/{id}/publication"
    category: state
    error_id: ERR_SUBJECT_NOTICE_PENDING
    http_status: 409
  - priority: 170
    rule: "Every notified SubjectResponseRequest must have at least MIN_NOTICE_HOURS (72) of elapsed notice, unless its status is UNREACHABLE."
    applies_to: "POST /records-desk/investigations/{id}/publication"
    category: business_temporal
    error_id: ERR_INSUFFICIENT_NOTICE
    http_status: 422
  - priority: 180
    rule: "Every notified SubjectResponseRequest must have attempt_count >= MIN_DOCUMENTED_ATTEMPTS (2)."
    applies_to: "POST /records-desk/investigations/{id}/publication"
    category: business_constraint
    error_id: ERR_INSUFFICIENT_ATTEMPTS
    http_status: 422
  - priority: 190
    rule: "A new EnclaveSession must not overlap the buffered occupancy span of any BOOKED session in the same enclave (half-open intervals plus SecureEnclave.sanitization_buffer_minutes, pairwise exclusion)."
    applies_to: "POST /records-desk/enclave-sessions"
    category: temporal_overlap
    error_id: ERR_ENCLAVE_SESSION_OVERLAP
    http_status: 409
  - priority: 200
    rule: "The count of a reviewer's existing ASSIGNED assignments whose CLOSED windows overlap the candidate window, plus one, must not exceed ExpertReviewer.max_concurrent_assignments."
    applies_to: "POST /records-desk/review-assignments"
    category: temporal_overlap
    error_id: ERR_REVIEWER_CAPACITY_EXCEEDED
    http_status: 409
  - priority: 210
    rule: "EnclaveSession.document_count must not exceed SecureEnclave.max_documents."
    applies_to: "POST /records-desk/enclave-sessions"
    category: business_constraint
    error_id: ERR_ENCLAVE_DOCUMENT_LIMIT
    http_status: 409
  - priority: 215
    rule: "An EnclaveSession may only be booked against a Dataset whose status is CLEAN_LOCKED or QUARANTINED (a raw or in-cleaning dataset has no reviewable document set)."
    applies_to: "POST /records-desk/enclave-sessions"
    category: cross_entity_state
    error_id: ERR_INVALID_DATASET_STATE
    http_status: 409
  - priority: 220
    rule: "A Finding's analysis_run_id must belong to the same Investigation as the finding, and a release_dataset_id named at publication must have investigation_id equal to the investigation being published."
    applies_to: "POST /records-desk/findings, POST /records-desk/investigations/{id}/publication"
    category: business_referential
    error_id: ERR_DATASET_NOT_LINKED
    http_status: 422
  - priority: 230
    rule: "At least one Dataset with investigation_id equal to the run's investigation must be CLEAN_LOCKED at allocation time."
    applies_to: "POST /records-desk/analysis-runs/{id}/cost-allocation"
    category: business_constraint
    error_id: ERR_NO_ALLOCABLE_INPUTS
    http_status: 422
  - priority: 240
    rule: "Investigation.analysis_readiness must be READY before findings may be locked."
    applies_to: "POST /records-desk/investigations/{id}/lock-findings"
    category: business_constraint
    error_id: ERR_ANALYSIS_NOT_READY
    http_status: 409
  - priority: 250
    rule: "Dataset.documentation_status must be COMPLETE (every declared field documented, field_definition_count >= 1) before the cleaning lock."
    applies_to: "POST /records-desk/datasets/{id}/cleaning-lock"
    category: business_constraint
    error_id: ERR_DATASET_DOCUMENTATION_INCOMPLETE
    http_status: 422
  - priority: 260
    rule: "Dataset.format_negotiation_status must be AGREED before the cleaning lock; a REFUSED format must be renegotiated with the agency."
    applies_to: "POST /records-desk/datasets/{id}/cleaning-lock"
    category: business_constraint
    error_id: ERR_FORMAT_NOT_NEGOTIATED
    http_status: 422
  - priority: 265
    rule: "Dataset.name must be globally unique; FieldDefinition.name must be unique within its dataset."
    applies_to: "POST /records-desk/datasets, POST /records-desk/datasets/{id}/field-definitions"
    category: uniqueness
    error_id: "ERR_DATASET_NAME_CONFLICT or ERR_FIELD_NAME_CONFLICT"
    http_status: 409
  - priority: 268
    rule: "A Dataset may carry at most MAX_FIELD_DEFINITIONS (40) field definitions."
    applies_to: "POST /records-desk/datasets/{id}/field-definitions"
    category: business_constraint
    error_id: ERR_FIELD_LIMIT_EXCEEDED
    http_status: 422
  - priority: 270
    rule: "The amount being committed (net_fee_cents on a fee determination, filing_fee_cents on an appeal, or a negative budget adjustment) must not exceed Desk.fee_budget_available_cents."
    applies_to: "POST /records-desk/records-requests/{id}/fee-determination, POST /records-desk/appeals, POST /records-desk/desks/{id}/budget-adjustments"
    category: business_fiscal
    error_id: ERR_FEE_BUDGET_EXCEEDED
    http_status: 402

# ===========================================================================
# 1.5 API Endpoint Table
# ===========================================================================
endpoints:
  - method: POST
    path: /records-desk/desks
    description: "Register an investigations desk with its records-fee budget and document retention policy."
    roles: [ManagingEditor]
    code: 201
    input: [name, fee_budget_total_cents, retention_policy_days]
    output: Desk
    side_effects:
      - "sets fee_budget_available_cents = fee_budget_total_cents, fee_budget_committed_cents = 0, fee_budget_spent_cents = 0"
      - "sets security_posture = OPEN, all exposure counters to 0"
      - "sets version = 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /records-desk/desks/{id}
    description: "Read a desk, including the fee-budget ledger, security posture and current version (used to obtain a fresh expected_desk_version)."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: []
    output: Desk
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_DESK_NOT_FOUND]

  - method: POST
    path: /records-desk/desks/{id}/budget-adjustments
    description: "Adjust the desk's total records-fee budget by a signed delta (calculations.desk_fee_budget_ledger, adjust)."
    roles: [ManagingEditor]
    code: 200
    input: [delta_cents, reason]
    output: Desk
    side_effects:
      - "applies calculations.desk_fee_budget_ledger adjust(delta_cents): total += delta, available += delta"
      - "refuses with ERR_FEE_BUDGET_EXCEEDED when available + delta_cents < 0"
      - "increments Desk.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_DESK_NOT_FOUND, ERR_INVALID_REQUEST, ERR_FEE_BUDGET_EXCEEDED]

  - method: POST
    path: /records-desk/desks/{id}/source-exposure-incidents
    description: "Record a confirmed source-exposure incident on the desk. This is the desk's real-world security-incident intake, and it drives the desk into LOCKDOWN. incident_summary is 1..1000 chars non-blank; severity_code is one of {LOW, MEDIUM, HIGH, CRITICAL} and is recorded for the audit trail without changing the posture computation."
    roles: [ManagingEditor, LegalCounsel]
    code: 200
    input: [incident_summary, severity_code]
    output: Desk
    side_effects:
      - "increments Desk.source_exposure_incident_count by 1"
      - "recomputes Desk.security_posture via calculations.desk_security_posture (becomes LOCKDOWN)"
      - "CASCADE HOP 1: every Investigation of this desk whose status IN {ANALYSIS, FINDINGS_LOCKED, CLEARED} moves to HOLD_LEGAL_REVIEW with hold_reason_code = SOURCE_EXPOSURE_INCIDENT (iterate created_at ASC, then headline ASC), incrementing each Investigation.version by 1"
      - "CASCADE HOP 2: every EnclaveSession with status == BOOKED whose dataset belongs to an Investigation of this desk moves to CANCELLED with cancellation_reason_code = DESK_LOCKDOWN, decrementing SecureEnclave.booked_session_count"
      - "increments Desk.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_DESK_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: POST
    path: /records-desk/agencies
    description: "Register a public agency with its statutory response clock, tolling policy, appeal venue and fee schedule."
    roles: [RecordsCoordinator, ManagingEditor]
    code: 201
    input: [name, jurisdiction_code, statute_name, initial_response_days, deadline_basis, tolling_allowed, appeal_venue, appeal_decision_days, search_fee_cents_per_hour, page_fee_cents, max_waiver_cents, "holiday_dates?"]
    output: Agency
    side_effects:
      - "immutable reference row: Agency has common_fields false, so it has id and created_at only, no version and no update endpoint"
      - "holiday_dates defaults to [] when omitted"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /records-desk/agencies/{id}
    description: "Read an agency's statutory profile and fee schedule."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: []
    output: Agency
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_AGENCY_NOT_FOUND]

  - method: POST
    path: /records-desk/records-requests
    description: "Draft a public-records request against an agency. Guarded by OCC on the desk (concurrency_rules request-create-stale-desk) because the create both mutates the desk's open-request counter and may withdraw a superseded request."
    roles: [RecordsCoordinator]
    code: 201
    input: [desk_id, agency_id, subject_summary, requested_format, estimated_page_count, waiver_requested, public_interest_score, expected_desk_version, "supersedes_request_id?"]
    output: RecordsRequest
    side_effects:
      - "rejects with ERR_STALE_DESK_VERSION (412) when expected_desk_version != Desk.version"
      - "sets status = DRAFT, requester_user_id = X-User-ID, fee_committed_cents = 0, tolled_days_total = 0, clarification_round_count = 0"
      - "when supersedes_request_id is supplied: the target must be a RecordsRequest of the same desk in DRAFT, AWAITING_AGENCY_RESPONSE or CLARIFICATION_REQUESTED (else ERR_SUPERSEDE_TARGET_NOT_ACTIVE), and it is transitioned to WITHDRAWN, returning its fee_committed_cents to Desk.fee_budget_available_cents and decrementing Desk.open_request_count"
      - "increments Desk.open_request_count by 1 and increments Desk.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_DESK_NOT_FOUND, ERR_AGENCY_NOT_FOUND, ERR_REQUEST_NOT_FOUND, ERR_STALE_DESK_VERSION, ERR_SUPERSEDE_TARGET_NOT_ACTIVE]

  - method: GET
    path: /records-desk/records-requests/{id}
    description: "Read a records request, including both deadline variants (due_at_strict and due_at_tolled) and the full fee determination."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: []
    output: RecordsRequest
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_REQUEST_NOT_FOUND]

  - method: GET
    path: /records-desk/records-requests
    description: "List records requests, filterable by desk, agency, supersede target and status. Reverse-reachability list for Desk, Agency and the self-referential supersede edge."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: ["desk_id?", "agency_id?", "supersedes_request_id?", "status?", "limit?", "offset?"]
    output: RecordsRequest[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: POST
    path: /records-desk/records-requests/{id}/submit
    description: "Submit the request to the agency, starting the statutory clock and stamping both deadline variants (calculations.statutory_deadline)."
    roles: [RecordsCoordinator]
    code: 200
    input: []
    output: RecordsRequest
    side_effects:
      - "DRAFT -> AWAITING_AGENCY_RESPONSE"
      - "stamps submitted_at = logical clock now"
      - "computes due_at_strict and due_at_tolled via calculations.statutory_deadline"
      - "increments RecordsRequest.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_REQUEST_NOT_FOUND, ERR_INVALID_REQUEST_STATE]

  - method: POST
    path: /records-desk/records-requests/{id}/fee-determination
    description: "Record the agency's fee determination and commit the net fee against the desk budget (calculations.fee_waiver_and_net_fee). Requires status AWAITING_AGENCY_RESPONSE and may be done at most once."
    roles: [RecordsCoordinator]
    code: 200
    input: [search_hours, billed_page_count]
    output: RecordsRequest
    side_effects:
      - "computes search_fee_cents, duplication_fee_cents, gross_fee_cents, waiver_pct, waiver_amount_cents and net_fee_cents through the eight pinned steps of calculations.fee_waiver_and_net_fee"
      - "commits net_fee_cents on the desk (available -> committed) and sets RecordsRequest.fee_committed_cents = net_fee_cents"
      - "refuses with ERR_FEE_BUDGET_EXCEEDED (402) when net_fee_cents > Desk.fee_budget_available_cents"
      - "refuses with ERR_FEE_ALREADY_DETERMINED (409) when fee_determined_at is already set"
      - "stamps fee_determined_at = now; increments RecordsRequest.version and Desk.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_REQUEST_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_REQUEST_STATE, ERR_FEE_ALREADY_DETERMINED, ERR_FEE_BUDGET_EXCEEDED]

  - method: POST
    path: /records-desk/records-requests/{id}/clarification-request
    description: "Record that the agency has asked the desk to narrow the request, pausing the statutory clock. Only permitted for agencies whose statute allows tolling and at most MAX_CLARIFICATION_ROUNDS times."
    roles: [RecordsCoordinator]
    code: 200
    input: [question_text]
    output: RecordsRequest
    side_effects:
      - "AWAITING_AGENCY_RESPONSE -> CLARIFICATION_REQUESTED"
      - "sets clarification_opened_at = now and increments clarification_round_count by 1"
      - "leaves due_at_strict and due_at_tolled unchanged until the round closes"
      - "increments RecordsRequest.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_REQUEST_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_REQUEST_STATE, ERR_TOLLING_NOT_PERMITTED, ERR_CLARIFICATION_LIMIT_REACHED]

  - method: POST
    path: /records-desk/records-requests/{id}/clarification-response
    description: "Answer the agency's clarification, closing the round, accruing tolled days and recomputing the TOLLED deadline variant only."
    roles: [RecordsCoordinator]
    code: 200
    input: [answer_text]
    output: RecordsRequest
    side_effects:
      - "CLARIFICATION_REQUESTED -> AWAITING_AGENCY_RESPONSE (cycle)"
      - "adds calculations.statutory_deadline tolling_days_for_span(clarification_opened_at, now) to tolled_days_total"
      - "recomputes due_at_tolled from the original submitted_at and the new tolled_days_total; due_at_strict is never revised"
      - "clears clarification_opened_at; increments RecordsRequest.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_REQUEST_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_REQUEST_STATE]

  - method: POST
    path: /records-desk/records-requests/{id}/agency-decision
    description: "Record the agency's disposition of the request: full release, partial release or denial. Settles or releases the committed fee accordingly."
    roles: [RecordsCoordinator]
    code: 200
    input: [outcome, "denial_reason_code?"]
    output: RecordsRequest
    side_effects:
      - "outcome RELEASED_FULL: AWAITING_AGENCY_RESPONSE -> RELEASED, settles fee_committed_cents (committed -> spent)"
      - "outcome RELEASED_PARTIAL: AWAITING_AGENCY_RESPONSE -> PARTIALLY_RELEASED, settles fee_committed_cents (committed -> spent)"
      - "outcome DENIED: AWAITING_AGENCY_RESPONSE -> DENIED, requires denial_reason_code, releases fee_committed_cents (committed -> available)"
      - "sets RecordsRequest.fee_committed_cents = 0; increments RecordsRequest.version and Desk.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_REQUEST_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_REQUEST_STATE]

  - method: POST
    path: /records-desk/records-requests/{id}/withdrawal
    description: "Withdraw the request. This is the compensating action for the fee ledger: every cent committed by the fee determination and by any open appeal returns to available, leaving the conserved budget identity intact."
    roles: [RecordsCoordinator]
    code: 200
    input: [reason]
    output: RecordsRequest
    side_effects:
      - "DRAFT / AWAITING_AGENCY_RESPONSE / CLARIFICATION_REQUESTED / APPEAL_FILED -> WITHDRAWN"
      - "releases RecordsRequest.fee_committed_cents (committed -> available) and sets it to 0"
      - "CASCADE: an Appeal of this request with status FILED moves to WITHDRAWN, releasing its filing_fee_cents (committed -> available) and decrementing Desk.open_appeal_count"
      - "decrements Desk.open_request_count by 1; increments RecordsRequest.version and Desk.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_REQUEST_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_REQUEST_STATE]

  - method: POST
    path: /records-desk/appeals
    description: "File an administrative appeal on the denial, partial-release or delay ground. Ripeness on the delay ground is judged strictly against due_at_tolled."
    roles: [LegalCounsel]
    code: 201
    input: [request_id, venue, grounds, filing_fee_cents]
    output: Appeal
    side_effects:
      - "requires RecordsRequest.status DENIED (ripeness_basis DENIED), PARTIALLY_RELEASED (ripeness_basis PARTIAL_RELEASE), or AWAITING_AGENCY_RESPONSE with now > due_at_tolled (ripeness_basis OVERDUE), else ERR_APPEAL_NOT_RIPE"
      - "requires venue == Agency.appeal_venue, else ERR_APPEAL_VENUE_MISMATCH"
      - "drives RecordsRequest -> APPEAL_FILED"
      - "stamps filed_at = now, filed_by_user_id = X-User-ID, and decision_due_at = filed_at + Agency.appeal_decision_days on Agency.deadline_basis at 23:59:59.000Z"
      - "commits filing_fee_cents on the desk (available -> committed), else ERR_FEE_BUDGET_EXCEEDED"
      - "increments Desk.open_appeal_count by 1 and increments Desk.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_REQUEST_NOT_FOUND, ERR_INVALID_REQUEST_STATE, ERR_APPEAL_NOT_RIPE, ERR_APPEAL_VENUE_MISMATCH, ERR_FEE_BUDGET_EXCEEDED]

  - method: GET
    path: /records-desk/appeals/{id}
    description: "Read an appeal, including its ripeness basis and decision deadline."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: []
    output: Appeal
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_APPEAL_NOT_FOUND]

  - method: GET
    path: /records-desk/appeals
    description: "List appeals, filterable by request. Reverse-reachability list for Appeal.request_id, and the only discovery channel for the appeal a cascade withdrew."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: ["request_id?", "status?", "limit?", "offset?"]
    output: Appeal[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: POST
    path: /records-desk/appeals/{id}/decision
    description: "Record the appeal authority's decision. GRANTED re-bases the request's tolled deadline and returns it to the agency queue; DENIED authorizes litigation and starts the five-hop exposure cascade."
    roles: [RecordsCoordinator]
    code: 200
    input: [outcome, decision_rationale]
    output: Appeal
    side_effects:
      - "outcome GRANTED: Appeal FILED -> GRANTED; RecordsRequest APPEAL_FILED -> AWAITING_AGENCY_RESPONSE; adds tolling_days_for_span(filed_at, now) to tolled_days_total and recomputes due_at_tolled; settles filing_fee_cents (committed -> spent)"
      - "outcome DENIED: Appeal FILED -> DENIED; RecordsRequest APPEAL_FILED -> LITIGATION_AUTHORIZED; Desk.litigation_exposure_count += 1 and security_posture recomputed to RESTRICTED; every Investigation drawing on a Dataset of this request and in ANALYSIS / FINDINGS_LOCKED / CLEARED moves to HOLD_LEGAL_REVIEW with hold_reason_code LITIGATION_AUTHORIZED; every BOOKED EnclaveSession on those investigations' datasets moves to CANCELLED with cancellation_reason_code INVESTIGATION_LEGAL_HOLD; settles filing_fee_cents (committed -> spent)"
      - "decrements Desk.open_appeal_count by 1; increments Appeal.version and Desk.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_APPEAL_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_APPEAL_STATE]

  - method: POST
    path: /records-desk/datasets
    description: "Register a dataset expected from a records request, with the format negotiated with the agency and the number of fields the desk expects to document."
    roles: [DataReporter]
    code: 201
    input: [request_id, investigation_id, name, negotiated_format, expected_field_count, sensitivity_tier]
    output: Dataset
    side_effects:
      - "sets status = RAW, format_negotiation_status = REQUESTED, documentation_status = INCOMPLETE, record_count = 0, field_definition_count = 0, allocated_cost_cents = 0"
      - "requires Dataset.name to be globally unique, else ERR_DATASET_NAME_CONFLICT"
      - "the named Investigation must belong to the same Desk as the named RecordsRequest, else ERR_DATASET_NOT_LINKED"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_REQUEST_NOT_FOUND, ERR_INVESTIGATION_NOT_FOUND, ERR_DATASET_NAME_CONFLICT, ERR_DATASET_NOT_LINKED]

  - method: GET
    path: /records-desk/datasets/{id}
    description: "Read a dataset, including its lifecycle status, documentation status, record count, allocated cost and retention expiry."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: []
    output: Dataset
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_DATASET_NOT_FOUND]

  - method: GET
    path: /records-desk/datasets
    description: "List datasets, filterable by source records request and by investigation. Reverse-reachability list for Dataset.request_id and Dataset.investigation_id."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: ["request_id?", "investigation_id?", "status?", "limit?", "offset?"]
    output: Dataset[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: POST
    path: /records-desk/datasets/{id}/delivery
    description: "Record the agency's actual delivery of the dataset. Only possible once the source records request has actually produced records."
    roles: [DataReporter]
    code: 200
    input: [delivered_format, record_count]
    output: Dataset
    side_effects:
      - "requires the parent RecordsRequest.status IN {RELEASED, PARTIALLY_RELEASED}, else ERR_SOURCE_REQUEST_UNRESOLVED"
      - "RAW -> CLEANING"
      - "sets delivered_format and record_count"
      - "sets format_negotiation_status = AGREED when delivered_format == negotiated_format, else REFUSED"
      - "computes retention_expires_at via calculations.dataset_retention_expiry"
      - "increments Dataset.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_DATASET_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_DATASET_STATE, ERR_SOURCE_REQUEST_UNRESOLVED]

  - method: POST
    path: /records-desk/datasets/{id}/field-definitions
    description: "Document one field of the dataset: its type, null rate, known quality issues, re-identification risk and whether it identifies a source."
    roles: [DataReporter]
    code: 201
    input: [field_name, data_type, null_rate_pct, reidentification_risk, is_source_identifying, "known_issue_codes?"]
    output: FieldDefinition
    side_effects:
      - "requires Dataset.status IN {RAW, CLEANING}, else ERR_INVALID_DATASET_STATE"
      - "requires field_name to be unique within the dataset, else ERR_FIELD_NAME_CONFLICT"
      - "refuses beyond MAX_FIELD_DEFINITIONS (40) rows per dataset with ERR_FIELD_LIMIT_EXCEEDED"
      - "sets suppression_applied = false and suppression_method = null"
      - "increments Dataset.field_definition_count by 1, adds len(known_issue_codes) to Dataset.known_issue_count, and sets Dataset.documentation_status = COMPLETE once field_definition_count >= expected_field_count (with expected_field_count >= 1), else INCOMPLETE"
      - "increments Dataset.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_DATASET_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_DATASET_STATE, ERR_FIELD_NAME_CONFLICT, ERR_FIELD_LIMIT_EXCEEDED]

  - method: GET
    path: /records-desk/datasets/{id}/field-definitions
    description: "List the documented fields of a dataset. Sub-resource reverse-reachability list for FieldDefinition.dataset_id."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: ["limit?", "offset?"]
    output: FieldDefinition[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_DATASET_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: POST
    path: /records-desk/datasets/{id}/field-suppressions
    description: "Suppress a documented field ahead of release, removing it from the disclosure-risk input set."
    roles: [DataReporter, ManagingEditor]
    code: 200
    input: [field_definition_id, suppression_method]
    output: FieldDefinition
    side_effects:
      - "requires the FieldDefinition to belong to this dataset, else ERR_FIELD_NOT_FOUND"
      - "requires Dataset.status != QUARANTINED, else ERR_INVALID_DATASET_STATE"
      - "sets FieldDefinition.suppression_applied = true and suppression_method"
      - "the field is thereafter excluded from both variants of calculations.disclosure_risk_score"
      - "increments FieldDefinition.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_DATASET_NOT_FOUND, ERR_FIELD_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_DATASET_STATE]

  - method: POST
    path: /records-desk/datasets/{id}/cleaning-lock
    description: "Freeze the cleaned dataset for analysis. Requires the negotiated format to have been honoured and the field documentation to be complete."
    roles: [DataReporter]
    code: 200
    input: [cleaning_notes]
    output: Dataset
    side_effects:
      - "CLEANING -> CLEAN_LOCKED"
      - "requires format_negotiation_status == AGREED, else ERR_FORMAT_NOT_NEGOTIATED"
      - "requires documentation_status == COMPLETE, else ERR_DATASET_DOCUMENTATION_INCOMPLETE"
      - "the dataset becomes allocable by calculations.analysis_cost_allocation"
      - "increments Dataset.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_DATASET_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_DATASET_STATE, ERR_FORMAT_NOT_NEGOTIATED, ERR_DATASET_DOCUMENTATION_INCOMPLETE]

  - method: POST
    path: /records-desk/datasets/{id}/quarantine
    description: "Quarantine a locked dataset after a data-quality discovery. Starts the three-hop analysis-invalidation cascade."
    roles: [ManagingEditor]
    code: 200
    input: [quarantine_reason_code]
    output: Dataset
    side_effects:
      - "CASCADE HOP 1: CLEAN_LOCKED -> QUARANTINED, records quarantine_reason_code, sets allocated_cost_cents = 0"
      - "CASCADE HOP 2: every AnalysisRun of the same Investigation has code_review_status APPROVED downgraded to CHANGES_REQUESTED and cost_allocation_status ALLOCATED downgraded to NOT_ALLOCATED with allocated_total_cents reset to 0"
      - "CASCADE HOP 3: Investigation.analysis_readiness recomputes to NOT_READY and an Investigation in FINDINGS_LOCKED reverts to ANALYSIS"
      - "increments Dataset.version, each affected AnalysisRun.version, and Investigation.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_DATASET_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_DATASET_STATE]

  - method: POST
    path: /records-desk/datasets/{id}/requalification
    description: "Return a quarantined dataset to cleaning after remediation, so it can be locked again (the dataset cycle)."
    roles: [DataReporter]
    code: 200
    input: [remediation_notes]
    output: Dataset
    side_effects:
      - "QUARANTINED -> CLEANING (cycle)"
      - "clears quarantine_reason_code"
      - "increments Dataset.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_DATASET_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_DATASET_STATE]

  - method: POST
    path: /records-desk/investigations
    description: "Open an investigation on the desk, declaring up front how its underlying data will be published."
    roles: [ManagingEditor, DataReporter]
    code: 201
    input: [desk_id, headline, publication_mode]
    output: Investigation
    side_effects:
      - "sets status = DRAFTING, analysis_readiness = NOT_READY, all finding counters to 0"
      - "sets version = 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_DESK_NOT_FOUND]

  - method: GET
    path: /records-desk/investigations/{id}
    description: "Read an investigation, including analysis readiness, the finding-count partition, the persisted disclosure risk score and the current version (used to obtain a fresh expected_investigation_version)."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: []
    output: Investigation
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVESTIGATION_NOT_FOUND]

  - method: GET
    path: /records-desk/investigations
    description: "List investigations, filterable by desk and by release dataset. Reverse-reachability list for Investigation.desk_id and Investigation.release_dataset_id."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: ["desk_id?", "release_dataset_id?", "status?", "limit?", "offset?"]
    output: Investigation[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: POST
    path: /records-desk/analysis-runs
    description: "Record a reproducible analysis run (repo, commit, container digest, compute and labour cost). Guarded by OCC on the investigation (concurrency_rules analysis-run-create-stale-investigation) because a new run supersedes the previous one and resets readiness."
    roles: [DataReporter]
    code: 201
    input: [investigation_id, code_repo_ref, code_commit_sha, container_digest, compute_cost_cents, labor_hours, expected_investigation_version]
    output: AnalysisRun
    side_effects:
      - "rejects with ERR_STALE_INVESTIGATION_VERSION (412) when expected_investigation_version != Investigation.version"
      - "assigns run_sequence = 1 + the count of existing AnalysisRun rows for the investigation, making this the current run"
      - "sets code_review_status = PENDING_REVIEW, cost_allocation_status = NOT_ALLOCATED, review_cycle_count = 0, allocated_total_cents = 0, authored_by_user_id = X-User-ID"
      - "Investigation DRAFTING -> ANALYSIS on the first run; a later run leaves the investigation in ANALYSIS but supersedes the prior current run"
      - "recomputes Investigation.analysis_readiness (falls to NOT_READY) and increments Investigation.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_INVESTIGATION_NOT_FOUND, ERR_INVALID_INVESTIGATION_STATE, ERR_STALE_INVESTIGATION_VERSION]

  - method: GET
    path: /records-desk/analysis-runs/{id}
    description: "Read an analysis run, including both of its independent status dimensions and its cost breakdown."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: []
    output: AnalysisRun
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_RUN_NOT_FOUND]

  - method: GET
    path: /records-desk/analysis-runs
    description: "List analysis runs, filterable by investigation and code-review status. Reverse-reachability list for AnalysisRun.investigation_id."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: ["investigation_id?", "code_review_status?", "limit?", "offset?"]
    output: AnalysisRun[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: POST
    path: /records-desk/analysis-runs/{id}/cost-allocation
    description: "Allocate the run's total cost across the investigation's clean-locked datasets by record count (calculations.analysis_cost_allocation). Independent of the peer-review dimension."
    roles: [DataReporter]
    code: 200
    input: []
    output: AnalysisRun
    side_effects:
      - "requires Investigation.status IN {ANALYSIS, FINDINGS_LOCKED}, else ERR_INVALID_INVESTIGATION_STATE"
      - "requires at least one CLEAN_LOCKED Dataset on the investigation, else ERR_NO_ALLOCABLE_INPUTS"
      - "computes labor_cost_cents and total_cost_cents, writes Dataset.allocated_cost_cents for every allocable dataset with the residual applied to the earliest one, and sets allocated_total_cents"
      - "cost_allocation_status NOT_ALLOCATED -> ALLOCATED; code_review_status is untouched"
      - "recomputes Investigation.analysis_readiness; increments AnalysisRun.version, each affected Dataset.version and Investigation.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_RUN_NOT_FOUND, ERR_INVALID_INVESTIGATION_STATE, ERR_NO_ALLOCABLE_INPUTS]

  - method: POST
    path: /records-desk/analysis-runs/{id}/peer-review
    description: "Record a methodology peer review of the run's code. Segregation of duties: the reviewer may not be the run's author. Independent of the cost-allocation dimension."
    roles: [PeerReviewer]
    code: 200
    input: [decision, peer_review_note]
    output: AnalysisRun
    side_effects:
      - "refuses with ERR_SEGREGATION_OF_DUTIES when X-User-ID == AnalysisRun.authored_by_user_id"
      - "decision APPROVED: code_review_status -> APPROVED; decision CHANGES_REQUESTED: code_review_status -> CHANGES_REQUESTED (may cycle)"
      - "increments review_cycle_count by 1, records peer_review_note and reviewed_by_user_id = X-User-ID"
      - "cost_allocation_status is untouched"
      - "recomputes Investigation.analysis_readiness; increments AnalysisRun.version and Investigation.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_RUN_NOT_FOUND, ERR_INVALID_REQUEST, ERR_SEGREGATION_OF_DUTIES, ERR_INVALID_RUN_STATE]

  - method: POST
    path: /records-desk/findings
    description: "Assert a finding produced by an analysis run. Begins life UNVERIFIED."
    roles: [DataReporter]
    code: 201
    input: [investigation_id, analysis_run_id, claim_text]
    output: Finding
    side_effects:
      - "requires AnalysisRun.investigation_id == investigation_id, else ERR_DATASET_NOT_LINKED"
      - "sets verification_status = UNVERIFIED"
      - "increments Investigation.finding_count and Investigation.unverified_finding_count by 1"
      - "recomputes Investigation.analysis_readiness; increments Investigation.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_INVESTIGATION_NOT_FOUND, ERR_RUN_NOT_FOUND, ERR_DATASET_NOT_LINKED]

  - method: GET
    path: /records-desk/findings/{id}
    description: "Read a finding, including its verification status and matched source document."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: []
    output: Finding
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_FINDING_NOT_FOUND]

  - method: GET
    path: /records-desk/findings
    description: "List findings, filterable by investigation and analysis run. Reverse-reachability list for Finding.investigation_id and Finding.analysis_run_id."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: ["investigation_id?", "analysis_run_id?", "verification_status?", "limit?", "offset?"]
    output: Finding[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: POST
    path: /records-desk/findings/{id}/document-match
    description: "Verify the finding against a specific page of a source document."
    roles: [DataReporter]
    code: 200
    input: [source_document_ref, matched_page]
    output: Finding
    side_effects:
      - "UNVERIFIED -> DOC_MATCHED"
      - "records source_document_ref and matched_page"
      - "moves the finding from Investigation.unverified_finding_count to Investigation.doc_matched_finding_count"
      - "recomputes Investigation.analysis_readiness; increments Finding.version and Investigation.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_FINDING_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_FINDING_STATE]

  - method: POST
    path: /records-desk/findings/{id}/verification-revocation
    description: "Revoke a finding's verification. Compensating action for the finding-count partition: the finding returns to UNVERIFIED, every assignment on it is released, and readiness is recomputed, with finding_count unchanged."
    roles: [ManagingEditor]
    code: 200
    input: [reason]
    output: Finding
    side_effects:
      - "CASCADE HOP 1: DOC_MATCHED / SME_CONFIRMED / SME_DISPUTED -> UNVERIFIED, clearing matched_page and sme_verdict_rationale, and returning the finding's unit to Investigation.unverified_finding_count from whichever bucket held it"
      - "CASCADE HOP 2: every ReviewAssignment on this finding with status ASSIGNED or COMPLETED moves to RELEASED, clearing verdict and rationale and decrementing ExpertReviewer.active_assignment_count for each formerly ASSIGNED row"
      - "CASCADE HOP 3: Investigation.analysis_readiness recomputes and an Investigation in FINDINGS_LOCKED reverts to ANALYSIS"
      - "Investigation.finding_count is NOT changed; the partition identity still holds"
      - "increments Finding.version, each affected ReviewAssignment.version and Investigation.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_FINDING_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_FINDING_STATE]

  - method: POST
    path: /records-desk/expert-reviewers
    description: "Register a subject-matter expert reviewer, with the agencies they are conflicted on and how many overlapping assignments they will accept."
    roles: [ManagingEditor]
    code: 201
    input: [name, affiliation, expertise_code, "max_concurrent_assignments?", "conflict_of_interest_agency_ids?"]
    output: ExpertReviewer
    side_effects:
      - "max_concurrent_assignments defaults to 2 and conflict_of_interest_agency_ids defaults to []"
      - "sets active_assignment_count = 0"
      - "the reviewer's id is the X-User-ID an ExpertReviewer-role caller must present (identity entity_backed:ExpertReviewer)"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /records-desk/expert-reviewers/{id}
    description: "Read a reviewer, including their conflict list and live assignment count."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: []
    output: ExpertReviewer
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_REVIEWER_NOT_FOUND]

  - method: POST
    path: /records-desk/review-assignments
    description: "Assign a document-matched finding to a subject-matter expert for a committed review window. Enforces conflict of interest before aggregate window capacity."
    roles: [ManagingEditor]
    code: 201
    input: [reviewer_id, finding_id, window_start, window_end]
    output: ReviewAssignment
    side_effects:
      - "requires window_end > window_start, else ERR_INVALID_REQUEST"
      - "refuses with ERR_REVIEWER_CONFLICT_OF_INTEREST (priority 150) when any Dataset of the finding's Investigation was sourced from a RecordsRequest whose agency_id appears in ExpertReviewer.conflict_of_interest_agency_ids"
      - "refuses with ERR_REVIEWER_CAPACITY_EXCEEDED (priority 200) when the count of the reviewer's overlapping ASSIGNED windows plus one exceeds max_concurrent_assignments, using CLOSED interval overlap per calculations.reviewer_capacity_window"
      - "sets status = ASSIGNED, verdict = null; increments ExpertReviewer.active_assignment_count by 1 and ExpertReviewer.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_REVIEWER_NOT_FOUND, ERR_FINDING_NOT_FOUND, ERR_REVIEWER_CONFLICT_OF_INTEREST, ERR_REVIEWER_CAPACITY_EXCEEDED]

  - method: GET
    path: /records-desk/review-assignments/{id}
    description: "Read a review assignment, including its window, status and verdict."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: []
    output: ReviewAssignment
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ASSIGNMENT_NOT_FOUND]

  - method: GET
    path: /records-desk/review-assignments
    description: "List review assignments, filterable by reviewer and finding. Reverse-reachability list for ReviewAssignment.reviewer_id and ReviewAssignment.finding_id, and the discovery channel for assignments released by the revocation cascade."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: ["reviewer_id?", "finding_id?", "status?", "limit?", "offset?"]
    output: ReviewAssignment[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: POST
    path: /records-desk/review-assignments/{id}/verdict
    description: "Submit the expert's verdict on the assigned finding. Only the assigned reviewer may act."
    roles: [ExpertReviewer]
    code: 200
    input: [verdict, rationale]
    output: ReviewAssignment
    side_effects:
      - "refuses with ERR_ASSIGNMENT_NOT_OWNED when X-User-ID != ReviewAssignment.reviewer_id"
      - "ASSIGNED -> COMPLETED, recording verdict and rationale, and decrementing ExpertReviewer.active_assignment_count by 1 (freeing window capacity)"
      - "verdict CONFIRMED: the linked Finding DOC_MATCHED -> SME_CONFIRMED, moving its unit from Investigation.doc_matched_finding_count to sme_confirmed_finding_count and copying rationale to Finding.sme_verdict_rationale"
      - "verdict DISPUTED: the linked Finding DOC_MATCHED -> SME_DISPUTED, moving its unit to sme_disputed_finding_count"
      - "recomputes Investigation.analysis_readiness; increments ReviewAssignment.version, ExpertReviewer.version, Finding.version and Investigation.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ASSIGNMENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_ASSIGNMENT_NOT_OWNED, ERR_INVALID_FINDING_STATE]

  - method: POST
    path: /records-desk/investigations/{id}/lock-findings
    description: "Lock the investigation's findings once the current analysis run is approved and allocated and every finding is expert-confirmed. Makes the subject-notice requests eligible for notice."
    roles: [ManagingEditor]
    code: 200
    input: []
    output: Investigation
    side_effects:
      - "requires analysis_readiness == READY, else ERR_ANALYSIS_NOT_READY"
      - "CASCADE HOP 1: ANALYSIS -> FINDINGS_LOCKED"
      - "CASCADE HOP 2: every SubjectResponseRequest of this investigation in DRAFT moves to NOTICE_ELIGIBLE"
      - "increments Investigation.version and each affected SubjectResponseRequest.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVESTIGATION_NOT_FOUND, ERR_INVALID_INVESTIGATION_STATE, ERR_ANALYSIS_NOT_READY]

  - method: POST
    path: /records-desk/subject-response-requests
    description: "Open a right-of-reply record for a named subject of the investigation."
    roles: [RecordsCoordinator]
    code: 201
    input: [investigation_id, subject_name, contact_channel]
    output: SubjectResponseRequest
    side_effects:
      - "sets status = DRAFT, attempt_count = 0, documented_attempts = []"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_INVESTIGATION_NOT_FOUND]

  - method: GET
    path: /records-desk/subject-response-requests/{id}
    description: "Read a subject response request, including the documented attempt log and the response deadline."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: []
    output: SubjectResponseRequest
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_SUBJECT_REQUEST_NOT_FOUND]

  - method: GET
    path: /records-desk/subject-response-requests
    description: "List subject response requests, filterable by investigation. Reverse-reachability list for SubjectResponseRequest.investigation_id."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: ["investigation_id?", "status?", "limit?", "offset?"]
    output: SubjectResponseRequest[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: POST
    path: /records-desk/subject-response-requests/{id}/attempts
    description: "Document one attempt to reach the subject. The first attempt starts the 72-hour notice clock; later attempts never re-base it. channel is one of {EMAIL, PHONE, CERTIFIED_MAIL, IN_PERSON}, deliverable is a boolean, note is 1..300 chars non-blank."
    roles: [RecordsCoordinator]
    code: 200
    input: [channel, deliverable, note]
    output: SubjectResponseRequest
    side_effects:
      - "appends the attempt to documented_attempts and increments attempt_count by 1"
      - "first attempt: NOTICE_ELIGIBLE -> NOTICE_SENT, stamping notice_sent_at = now and response_deadline_at = now + MIN_NOTICE_HOURS (72) hours"
      - "subsequent deliverable attempt: self-loop in NOTICE_SENT with notice_sent_at and response_deadline_at unchanged"
      - "deliverable == false with post-increment attempt_count >= MIN_DOCUMENTED_ATTEMPTS (2): NOTICE_SENT -> UNREACHABLE"
      - "increments SubjectResponseRequest.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_SUBJECT_REQUEST_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_SUBJECT_STATE]

  - method: POST
    path: /records-desk/subject-response-requests/{id}/response
    description: "Record the subject's response, on or off the record. Accepted from NOTICE_SENT and from NO_RESPONSE (a late reply)."
    roles: [RecordsCoordinator]
    code: 200
    input: [response_text, on_the_record]
    output: SubjectResponseRequest
    side_effects:
      - "NOTICE_SENT or NO_RESPONSE -> RESPONDED"
      - "records response_text and on_the_record"
      - "increments SubjectResponseRequest.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_SUBJECT_REQUEST_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_SUBJECT_STATE]

  - method: POST
    path: /records-desk/secure-enclaves
    description: "Register a secure reading room for sensitive source documents, with its post-session sanitization buffer and document ceiling."
    roles: [LegalCounsel, ManagingEditor]
    code: 201
    input: [name, max_documents, "sanitization_buffer_minutes?"]
    output: SecureEnclave
    side_effects:
      - "sanitization_buffer_minutes defaults to 30"
      - "sets booked_session_count = 0"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: POST
    path: /records-desk/enclave-sessions
    description: "Book a supervised session in a secure enclave to inspect a dataset's sensitive documents. Occupancy is half-open and extended by the enclave's sanitization buffer; the enclave admits one session at a time."
    roles: [LegalCounsel, DataReporter]
    code: 201
    input: [enclave_id, dataset_id, start_at, end_at, document_count, purpose]
    output: EnclaveSession
    side_effects:
      - "requires end_at > start_at, else ERR_INVALID_REQUEST"
      - "refuses with ERR_DESK_LOCKDOWN (priority 110) when the owning Desk.security_posture == LOCKDOWN"
      - "refuses with ERR_ENCLAVE_SESSION_OVERLAP (priority 190) per calculations.enclave_occupancy_span"
      - "refuses with ERR_ENCLAVE_DOCUMENT_LIMIT (priority 210) when document_count > SecureEnclave.max_documents"
      - "requires Dataset.status IN {CLEAN_LOCKED, QUARANTINED}, else ERR_INVALID_DATASET_STATE (priority 215)"
      - "sets status = BOOKED, opened_by_user_id = X-User-ID; increments SecureEnclave.booked_session_count and SecureEnclave.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_ENCLAVE_NOT_FOUND, ERR_DATASET_NOT_FOUND, ERR_DESK_LOCKDOWN, ERR_INVALID_DATASET_STATE, ERR_ENCLAVE_SESSION_OVERLAP, ERR_ENCLAVE_DOCUMENT_LIMIT]

  - method: GET
    path: /records-desk/enclave-sessions/{id}
    description: "Read an enclave session, including its status and cancellation reason."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: []
    output: EnclaveSession
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_SESSION_NOT_FOUND]

  - method: GET
    path: /records-desk/enclave-sessions
    description: "List enclave sessions, filterable by enclave and dataset. Reverse-reachability list for EnclaveSession.enclave_id and EnclaveSession.dataset_id, and the discovery channel for sessions cancelled by a cascade."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: ["enclave_id?", "dataset_id?", "status?", "limit?", "offset?"]
    output: EnclaveSession[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: POST
    path: /records-desk/enclave-sessions/{id}/closure
    description: "Close a session after every document is accounted for, releasing the enclave's occupancy span."
    roles: [LegalCounsel, DataReporter]
    code: 200
    input: [documents_returned_count]
    output: EnclaveSession
    side_effects:
      - "BOOKED -> CLOSED"
      - "requires documents_returned_count == EnclaveSession.document_count, else ERR_INVALID_REQUEST"
      - "decrements SecureEnclave.booked_session_count by 1 and increments SecureEnclave.version by 1"
      - "the closed session no longer blocks overlapping bookings"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_SESSION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_SESSION_STATE]

  - method: POST
    path: /records-desk/investigations/{id}/legal-clearance
    description: "Clear an investigation for publication after legal review. The only exit from HOLD_LEGAL_REVIEW, and the way a RESTRICTED desk can still publish."
    roles: [LegalCounsel]
    code: 200
    input: [clearance_note]
    output: Investigation
    side_effects:
      - "HOLD_LEGAL_REVIEW or FINDINGS_LOCKED -> CLEARED"
      - "refuses with ERR_DESK_LOCKDOWN when Desk.security_posture == LOCKDOWN"
      - "stamps legal_clearance_at = now and clears hold_reason_code"
      - "increments Investigation.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVESTIGATION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_INVESTIGATION_STATE, ERR_DESK_LOCKDOWN]

  - method: POST
    path: /records-desk/investigations/{id}/publication
    description: "Publish the investigation with its methodology and, for data releases, the named release dataset. Runs the full publication gate ladder: desk posture, unresolved source requests, release-dataset linkage, source exposure, disclosure risk, subject notice and documented attempts."
    roles: [ManagingEditor]
    code: 200
    input: [methodology_doc_ref, "release_dataset_id?"]
    output: Investigation
    side_effects:
      - "SYSTEM PRE-STEP: every SubjectResponseRequest of this investigation in NOTICE_SENT whose response_deadline_at <= now moves to NO_RESPONSE"
      - "FINDINGS_LOCKED or CLEARED -> PUBLISHED"
      - "evaluates validations priorities 110, 112, 120, 125, 130, 140, 165, 170, 180 and 220 in that order"
      - "stamps methodology_doc_ref, release_dataset_id, published_at = now"
      - "computes disclosure_risk_score and applicable_risk_variant via calculations.disclosure_risk_score under the variant selected by publication_mode"
      - "increments Investigation.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVESTIGATION_NOT_FOUND, ERR_INVALID_REQUEST, ERR_DATASET_NOT_FOUND, ERR_INVALID_INVESTIGATION_STATE, ERR_DESK_LOCKDOWN, ERR_INVESTIGATION_NOT_CLEARED, ERR_SOURCE_REQUEST_UNRESOLVED, ERR_RELEASE_DATASET_REQUIRED, ERR_SOURCE_EXPOSURE_RISK, ERR_DISCLOSURE_RISK_TOO_HIGH, ERR_SUBJECT_NOTICE_PENDING, ERR_INSUFFICIENT_NOTICE, ERR_INSUFFICIENT_ATTEMPTS, ERR_DATASET_NOT_LINKED]

  - method: GET
    path: /records-desk/investigations/{id}/disclosure-risk-preview
    description: "Read-only preview of both disclosure-risk variants for a candidate release dataset, plus the variant the investigation's publication_mode would select and the reason publication would currently be blocked. Computed read; nothing is persisted."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: ["release_dataset_id?"]
    output: { aggregate_max_score: integer, composite_weighted_score: integer, applicable_variant: string, applicable_score: integer, notice_window_hours: integer, blocking_reason_code: string }
    side_effects:
      - "computes both variants of calculations.disclosure_risk_score over the dataset named by release_dataset_id, defaulting to Investigation.release_dataset_id when the parameter is omitted"
      - "notice_window_hours reports the minimum elapsed notice hours across the investigation's notified SubjectResponseRequest rows, or 0 when none has been notified"
      - "blocking_reason_code names the first publication gate that would fail right now, or NONE"
      - "persists nothing and does not advance any state machine"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVESTIGATION_NOT_FOUND, ERR_DATASET_NOT_FOUND, ERR_RELEASE_DATASET_REQUIRED, ERR_DATASET_NOT_LINKED]

  - method: POST
    path: /_clock/set_current_utc
    description: "Test-driving endpoint: set the server's logical UTC clock, which every deadline, tolling, notice and interval rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [RecordsCoordinator, DataReporter, PeerReviewer, ExpertReviewer, ManagingEditor, LegalCounsel]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "sets the logical clock to the supplied instant; the clock may move backwards as well as forwards"
      - "fires no scheduled action by itself: NOTICE_SENT -> NO_RESPONSE is evaluated lazily at publication time"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

# ===========================================================================
# 1.6 Error Code Catalog
# ===========================================================================
errors:
  # --- auth / rbac -------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role is missing, empty, or names a role outside the six declared roles."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The caller's role is recognised but is not listed in the target endpoint's roles."
  - id: ERR_ASSIGNMENT_NOT_OWNED
    http: 403
    condition: "An ExpertReviewer submits a verdict on a ReviewAssignment whose reviewer_id is not the caller's X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "A peer review is submitted by the same X-User-ID that authored the AnalysisRun."
  # --- schema ------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Body schema violation: missing required field, wrong JSON type, enum value outside the declared set, integer outside its declared range, unparseable ISO-8601 instant, end instant not strictly after start instant, or documents_returned_count not equal to the session's document_count."
  # --- not found ---------------------------------------------------------
  - id: ERR_DESK_NOT_FOUND
    http: 404
    condition: "No Desk exists with the referenced id."
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: "No Agency exists with the referenced id."
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "No RecordsRequest exists with the referenced id (path id, request_id, or supersedes_request_id)."
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "No Appeal exists with the referenced id."
  - id: ERR_DATASET_NOT_FOUND
    http: 404
    condition: "No Dataset exists with the referenced id (path id, dataset_id, or release_dataset_id)."
  - id: ERR_FIELD_NOT_FOUND
    http: 404
    condition: "No FieldDefinition exists with the referenced field_definition_id, or it belongs to a different dataset."
  - id: ERR_INVESTIGATION_NOT_FOUND
    http: 404
    condition: "No Investigation exists with the referenced id."
  - id: ERR_RUN_NOT_FOUND
    http: 404
    condition: "No AnalysisRun exists with the referenced id."
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "No Finding exists with the referenced id."
  - id: ERR_REVIEWER_NOT_FOUND
    http: 404
    condition: "No ExpertReviewer exists with the referenced id."
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "No ReviewAssignment exists with the referenced id."
  - id: ERR_SUBJECT_REQUEST_NOT_FOUND
    http: 404
    condition: "No SubjectResponseRequest exists with the referenced id."
  - id: ERR_ENCLAVE_NOT_FOUND
    http: 404
    condition: "No SecureEnclave exists with the referenced enclave_id."
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "No EnclaveSession exists with the referenced id."
  # --- optimistic concurrency -------------------------------------------
  - id: ERR_STALE_DESK_VERSION
    http: 412
    condition: "expected_desk_version does not equal the current Desk.version on records-request creation."
  - id: ERR_STALE_INVESTIGATION_VERSION
    http: 412
    condition: "expected_investigation_version does not equal the current Investigation.version on analysis-run creation."
  # --- state -------------------------------------------------------------
  - id: ERR_INVALID_REQUEST_STATE
    http: 409
    condition: "The RecordsRequest is not in a state from which the requested operation is declared (submit outside DRAFT, fee determination outside AWAITING_AGENCY_RESPONSE, clarification outside the declared states, agency decision outside AWAITING_AGENCY_RESPONSE, withdrawal from a terminal state)."
  - id: ERR_INVALID_APPEAL_STATE
    http: 409
    condition: "A decision is recorded on an Appeal whose status is not FILED."
  - id: ERR_INVALID_DATASET_STATE
    http: 409
    condition: "The Dataset is not in a state from which the requested operation is declared (delivery outside RAW, cleaning-lock outside CLEANING, quarantine outside CLEAN_LOCKED, requalification outside QUARANTINED, field documentation outside RAW/CLEANING, suppression while QUARANTINED, or an enclave booking against a dataset that is neither CLEAN_LOCKED nor QUARANTINED)."
  - id: ERR_INVALID_INVESTIGATION_STATE
    http: 409
    condition: "The Investigation is not in a state from which the requested operation is declared (lock-findings outside ANALYSIS, legal clearance outside HOLD_LEGAL_REVIEW/FINDINGS_LOCKED, publication outside FINDINGS_LOCKED/CLEARED, cost allocation while the investigation is not in ANALYSIS or FINDINGS_LOCKED, analysis run creation on a PUBLISHED or HOLD_LEGAL_REVIEW investigation)."
  - id: ERR_INVALID_RUN_STATE
    http: 409
    condition: "A peer review is submitted on an AnalysisRun whose code_review_status is already APPROVED."
  - id: ERR_INVALID_FINDING_STATE
    http: 409
    condition: "The Finding is not in a state from which the requested operation is declared (document match outside UNVERIFIED, expert verdict outside DOC_MATCHED, revocation on an UNVERIFIED finding, or a verdict on an assignment that is no longer ASSIGNED)."
  - id: ERR_INVALID_SUBJECT_STATE
    http: 409
    condition: "The SubjectResponseRequest is not in a state from which the requested operation is declared (an attempt while DRAFT, RESPONDED or UNREACHABLE; a response while DRAFT, NOTICE_ELIGIBLE, RESPONDED or UNREACHABLE)."
  - id: ERR_INVALID_SESSION_STATE
    http: 409
    condition: "A closure is attempted on an EnclaveSession that is not BOOKED."
  # --- business ----------------------------------------------------------
  - id: ERR_SUPERSEDE_TARGET_NOT_ACTIVE
    http: 409
    condition: "supersedes_request_id targets a RecordsRequest whose status is not DRAFT, AWAITING_AGENCY_RESPONSE or CLARIFICATION_REQUESTED."
  - id: ERR_FEE_ALREADY_DETERMINED
    http: 409
    condition: "A second fee determination is attempted on a RecordsRequest whose fee_determined_at is already set."
  - id: ERR_TOLLING_NOT_PERMITTED
    http: 422
    condition: "A clarification round is opened on a request whose Agency.tolling_allowed is false."
  - id: ERR_CLARIFICATION_LIMIT_REACHED
    http: 409
    condition: "A clarification round is opened when clarification_round_count has already reached MAX_CLARIFICATION_ROUNDS (3)."
  - id: ERR_APPEAL_NOT_RIPE
    http: 409
    condition: "An appeal is filed on the delay ground while the logical clock is at or before RecordsRequest.due_at_tolled, or on a request whose status supports no appeal ground at all."
  - id: ERR_APPEAL_VENUE_MISMATCH
    http: 422
    condition: "Appeal.venue does not equal the Agency.appeal_venue of the request's agency."
  - id: ERR_FEE_BUDGET_EXCEEDED
    http: 402
    condition: "A commitment (net fee, appeal filing fee) exceeds Desk.fee_budget_available_cents, or a budget adjustment would drive available below zero."
  - id: ERR_DESK_LOCKDOWN
    http: 409
    condition: "Publication, legal clearance or an enclave booking is attempted while Desk.security_posture is LOCKDOWN."
  - id: ERR_INVESTIGATION_NOT_CLEARED
    http: 409
    condition: "Publication is attempted from FINDINGS_LOCKED while Desk.security_posture is RESTRICTED; legal clearance is required first."
  - id: ERR_SOURCE_REQUEST_UNRESOLVED
    http: 409
    condition: "A dataset delivery is recorded while its RecordsRequest is neither RELEASED nor PARTIALLY_RELEASED, or a publication is attempted while a dataset of the investigation traces to a request in APPEAL_FILED or LITIGATION_AUTHORIZED."
  - id: ERR_RELEASE_DATASET_REQUIRED
    http: 422
    condition: "publication_mode FULL_DATA_RELEASE or AGGREGATES_ONLY without a release_dataset_id, or METHODOLOGY_ONLY with one; also raised by the preview endpoint when no dataset can be resolved."
  - id: ERR_DATASET_NOT_LINKED
    http: 422
    condition: "A finding's analysis_run_id belongs to a different investigation, a release_dataset_id names a dataset whose investigation_id is not the investigation being published, or a dataset's investigation and records request belong to different desks."
  - id: ERR_SOURCE_EXPOSURE_RISK
    http: 422
    condition: "The release dataset still exposes at least one FieldDefinition with is_source_identifying true and suppression_applied false."
  - id: ERR_DISCLOSURE_RISK_TOO_HIGH
    http: 422
    condition: "The applicable disclosure risk score exceeds PUBLISH_RISK_CEILING (60) under the variant selected by publication_mode."
  - id: ERR_REVIEWER_CONFLICT_OF_INTEREST
    http: 422
    condition: "The expert reviewer is conflicted on an agency that sourced a dataset of the finding's investigation."
  - id: ERR_REVIEWER_CAPACITY_EXCEEDED
    http: 409
    condition: "The reviewer's overlapping ASSIGNED windows plus the candidate exceed max_concurrent_assignments."
  - id: ERR_SUBJECT_NOTICE_PENDING
    http: 409
    condition: "Publication is attempted while a SubjectResponseRequest of the investigation has never been notified (still DRAFT or NOTICE_ELIGIBLE)."
  - id: ERR_INSUFFICIENT_NOTICE
    http: 422
    condition: "Publication is attempted with fewer than MIN_NOTICE_HOURS (72) elapsed hours of notice on a notified, non-UNREACHABLE subject."
  - id: ERR_INSUFFICIENT_ATTEMPTS
    http: 422
    condition: "Publication is attempted with fewer than MIN_DOCUMENTED_ATTEMPTS (2) documented contact attempts on a notified subject."
  - id: ERR_ENCLAVE_SESSION_OVERLAP
    http: 409
    condition: "The candidate session's buffered half-open span intersects the buffered span of an existing BOOKED session in the same enclave."
  - id: ERR_ENCLAVE_DOCUMENT_LIMIT
    http: 409
    condition: "EnclaveSession.document_count exceeds SecureEnclave.max_documents."
  - id: ERR_NO_ALLOCABLE_INPUTS
    http: 422
    condition: "Cost allocation is attempted when the investigation has no CLEAN_LOCKED dataset."
  - id: ERR_ANALYSIS_NOT_READY
    http: 409
    condition: "Findings are locked while Investigation.analysis_readiness is NOT_READY."
  - id: ERR_DATASET_DOCUMENTATION_INCOMPLETE
    http: 422
    condition: "The cleaning lock is attempted while Dataset.documentation_status is INCOMPLETE."
  - id: ERR_FORMAT_NOT_NEGOTIATED
    http: 422
    condition: "The cleaning lock is attempted while Dataset.format_negotiation_status is REQUESTED or REFUSED."
  - id: ERR_DATASET_NAME_CONFLICT
    http: 409
    condition: "A Dataset is created with a name that already exists (names are globally unique and serve as the cost-allocation tie-break)."
  - id: ERR_FIELD_NAME_CONFLICT
    http: 409
    condition: "A FieldDefinition is created with a field_name that already exists within the same dataset."
  - id: ERR_FIELD_LIMIT_EXCEEDED
    http: 422
    condition: "A dataset already carries MAX_FIELD_DEFINITIONS (40) field definitions."

# ===========================================================================
# 1.7 RBAC Matrix
# ===========================================================================
# role_model: segregation_of_duties. The desk deliberately splits records
# acquisition (RecordsCoordinator), analysis (DataReporter), methodology review
# (PeerReviewer), substantive verification (ExpertReviewer), editorial release
# (ManagingEditor) and legal exposure (LegalCounsel) across six roles. No role
# is a superset of another: the ManagingEditor who can lock and publish cannot
# file a request or an appeal, and the DataReporter who authors an analysis run
# can never approve one - not even another reporter's, since peer review is the
# PeerReviewer role's exclusive operation, and never their own, since
# ERR_SEGREGATION_OF_DUTIES compares X-User-ID.
roles:
  - name: RecordsCoordinator
    description: "Plans and prosecutes records requests: identifies the agency, drafts and submits, negotiates clarifications and fees, records the agency's decision, withdraws, and runs the subject right-of-reply process."
    identity: opaque
    exclusive_operations:
      - "POST /records-desk/records-requests"
      - "POST /records-desk/records-requests/{id}/submit"
      - "POST /records-desk/records-requests/{id}/fee-determination"
      - "POST /records-desk/records-requests/{id}/clarification-request"
      - "POST /records-desk/records-requests/{id}/clarification-response"
      - "POST /records-desk/records-requests/{id}/agency-decision"
      - "POST /records-desk/records-requests/{id}/withdrawal"
      - "POST /records-desk/appeals/{id}/decision"
      - "POST /records-desk/subject-response-requests"
      - "POST /records-desk/subject-response-requests/{id}/attempts"
      - "POST /records-desk/subject-response-requests/{id}/response"
    shared_operations:
      - "POST /records-desk/agencies (with ManagingEditor)"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
  - name: DataReporter
    description: "Acquires and cleans the data, documents its fields and quality issues, authors reproducible analysis runs, allocates their cost, asserts findings and matches them to source documents."
    identity: opaque
    exclusive_operations:
      - "POST /records-desk/datasets"
      - "POST /records-desk/datasets/{id}/delivery"
      - "POST /records-desk/datasets/{id}/field-definitions"
      - "POST /records-desk/datasets/{id}/cleaning-lock"
      - "POST /records-desk/datasets/{id}/requalification"
      - "POST /records-desk/analysis-runs"
      - "POST /records-desk/analysis-runs/{id}/cost-allocation"
      - "POST /records-desk/findings"
      - "POST /records-desk/findings/{id}/document-match"
    shared_operations:
      - "POST /records-desk/investigations (with ManagingEditor)"
      - "POST /records-desk/datasets/{id}/field-suppressions (with ManagingEditor)"
      - "POST /records-desk/enclave-sessions and POST /records-desk/enclave-sessions/{id}/closure (with LegalCounsel)"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
  - name: PeerReviewer
    description: "Reviews the methodology and code of an analysis run. Cannot author runs, cannot allocate cost, and can never review a run they authored."
    identity: opaque
    exclusive_operations:
      - "POST /records-desk/analysis-runs/{id}/peer-review"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
  - name: ExpertReviewer
    description: "External subject-matter expert who confirms or disputes an individual finding. Acts only on assignments made to them: X-User-ID is the ExpertReviewer row's id."
    identity: "entity_backed:ExpertReviewer"
    exclusive_operations:
      - "POST /records-desk/review-assignments/{id}/verdict"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
  - name: ManagingEditor
    description: "Owns the desk, its budget and the editorial release decision: registers the desk, quarantines bad data, revokes verification, assigns expert review, locks findings and publishes."
    identity: opaque
    exclusive_operations:
      - "POST /records-desk/desks"
      - "POST /records-desk/desks/{id}/budget-adjustments"
      - "POST /records-desk/datasets/{id}/quarantine"
      - "POST /records-desk/findings/{id}/verification-revocation"
      - "POST /records-desk/expert-reviewers"
      - "POST /records-desk/review-assignments"
      - "POST /records-desk/investigations/{id}/lock-findings"
      - "POST /records-desk/investigations/{id}/publication"
    shared_operations:
      - "POST /records-desk/agencies (with RecordsCoordinator)"
      - "POST /records-desk/investigations (with DataReporter)"
      - "POST /records-desk/datasets/{id}/field-suppressions (with DataReporter)"
      - "POST /records-desk/desks/{id}/source-exposure-incidents (with LegalCounsel)"
      - "POST /records-desk/secure-enclaves (with LegalCounsel)"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
  - name: LegalCounsel
    description: "Handles appeal and litigation escalation, source protection and the secure handling of sensitive documents, and clears an investigation for publication after legal review."
    identity: opaque
    exclusive_operations:
      - "POST /records-desk/appeals"
      - "POST /records-desk/investigations/{id}/legal-clearance"
    shared_operations:
      - "POST /records-desk/desks/{id}/source-exposure-incidents (with ManagingEditor)"
      - "POST /records-desk/secure-enclaves (with ManagingEditor)"
      - "POST /records-desk/enclave-sessions and POST /records-desk/enclave-sessions/{id}/closure (with DataReporter)"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
