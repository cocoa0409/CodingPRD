# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3183_dealer_satisfaction_survey_administration_incentive_qualification
#
# Two instances per §0.5 Difficulty Rule (9 rules × 2 = 18 instances).
# Every test_recipe is replayed against SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: score_computation_raw_vs_adjusted_divergence_on_dealer
        grounds:
          - calculations.score_computation
          - calculations.score_computation.variants[raw]
          - calculations.score_computation.variants[adjusted]
          - entities.Dealer.fields.current_score_adjusted
          - entities.ManipulationFlag.fields.status
        distinguishing_aspect: |
          Two valid variants of the SAME dealer wave score — raw and adjusted —
          produce different numeric results for identical response data when
          the dealer has at least one CONFIRMED ManipulationFlag. The raw
          variant is the unweighted average of SCORED responses ×10; the
          adjusted variant subtracts 25 per confirmed flag. This instance
          lives on the DEALER entity domain.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Region SW; Dealer D1 (region SW); Department D1-SALES kind=SALES; Customer C1 (do_not_contact=false)."
            - "QuestionSet QS-A ACTIVE with one question q1 weight 1.0 and comparability_factor 1.0."
            - "SurveyWave W1 [2026-09-01, 2026-10-01) pinned to QS-A, OPEN."
            - "Transaction T1 for D1 / D1-SALES / C1, kind=SALE, completed_at=2026-09-05T00:00:00Z, margin_cents=100000."
            - "Sampling sweep on wave open creates SurveyInvitation I1 for T1 (QUEUED)."
            - "I1 SENT at 2026-09-06T00:00:00Z; window_closes_at=2026-09-20T00:00:00Z."
            - "Customer C1 submits response R1 with answers=[{q1, score=8}]; R1.score=80.0; R1.status=SCORED."
            - "ManipulationFlag F1 (dealer D1, kind=COACHING) opened and then CONFIRMED."
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "SW", name: "Southwest" }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /survey/dealers"
              payload: { region_id: "${region_id}", name: "D1", dealer_code: "D1" }
              as: PlatformAdmin
              captures: { dealer_id: $.data.id }
            - call: "POST /survey/departments"
              payload: { dealer_id: "${dealer_id}", kind: "SALES", name: "Sales" }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /survey/customers"
              payload: { full_name: "C1", email: "c1@x.com", phone: "5551234567" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /survey/question-sets"
              payload: { code: "QS-A", questions: [{question_code: "q1", prompt: "Satisfaction", weight: 1.0}], comparability_factor: 1.0 }
              as: PlatformAdmin
              captures: { qs_id: $.data.id }
            - call: "POST /survey/question-sets/${qs_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /survey/waves"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", question_set_id: "${qs_id}" }
              as: PlatformAdmin
              captures: { wave_id: $.data.id }
            - call: "POST /survey/transactions"
              payload: { dealer_id: "${dealer_id}", department_id: "${dept_id}", customer_id: "${cust_id}", kind: "SALE", completed_at: "2026-09-05T00:00:00Z", margin_cents: 100000 }
              as: PlatformAdmin
              captures: { tx_id: $.data.id }
            - call: "POST /survey/waves/${wave_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /survey/waves/${wave_id}/invitations"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /survey/invitations/${inv_id}/send"
              payload: {}
              as: SurveyVendor
            - call: "POST /survey/invitations/${inv_id}/responses"
              payload: { answers: [{question_code: "q1", score: 8}] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { resp_id: $.data.id }
            - call: "POST /survey/flags"
              payload: { dealer_id: "${dealer_id}", kind: "COACHING", evidence: "coached customer" }
              as: ComplianceAuditor
              captures: { flag_id: $.data.id }
            - call: "POST /survey/flags/${flag_id}/resolve"
              payload: { outcome: "CONFIRMED" }
              as: ComplianceAuditor
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/waves/${wave_id}/close"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /survey/dealers/${dealer_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Dealer.${dealer_id}.current_score_adjusted == 775.0  # raw 80*10=800; adjusted = 800 - 25*1 = 775"
            - "Dealer.${dealer_id}.confirmed_flag_count == 1"
            - "raw variant would be 800.0; adjusted variant is 775.0; difference of exactly 25 per confirmed flag"

      - name: incentive_tiering_provisional_vs_final_statement_payout_divergence
        grounds:
          - calculations.incentive_tiering
          - entities.IncentiveStatement.fields.status
          - entities.IncentiveStatement.fields.payout_cents
          - state_machines.IncentiveStatement.PROVISIONAL_to_FINAL
        distinguishing_aspect: |
          Two valid statement variants — PROVISIONAL vs FINAL — produce different
          observable payout behavior for identical score data. The PROVISIONAL
          statement can be recomputed and SUPERSEDED (so a later statement may
          carry a different payout_cents for the same dealer and wave), while
          the FINAL statement is locked and payable. This instance lives on the
          INCENTIVE STATEMENT entity domain — a different entity domain from
          the dealer score instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; Region SW; Dealer D2; Department D2-SALES; Customer C2."
            - "QuestionSet QS-B ACTIVE (q1 weight 1.0)."
            - "Wave W2 [2026-09-01, 2026-10-01) pinned to QS-B."
            - "Transaction T2: margin_cents=100000; invitation responded with score=10 (response score 100, dealer raw 1000, adjusted 1000)."
            - "Wave W2 CLOSED at 2026-10-01; Dealer D2.current_score_adjusted=1000.0, current_response_rate=1.0."
            - "Statement ST1 created PROVISIONAL: tier=GOLD, eligible_margin_cents=100000, payout_cents=8000."
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "SW", name: "Southwest" }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /survey/dealers"
              payload: { region_id: "${region_id}", name: "D2", dealer_code: "D2" }
              as: PlatformAdmin
              captures: { dealer_id: $.data.id }
            - call: "POST /survey/departments"
              payload: { dealer_id: "${dealer_id}", kind: "SALES", name: "Sales" }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /survey/customers"
              payload: { full_name: "C2", email: "c2@x.com", phone: "5551234567" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /survey/question-sets"
              payload: { code: "QS-B", questions: [{question_code: "q1", prompt: "Sat", weight: 1.0}], comparability_factor: 1.0 }
              as: PlatformAdmin
              captures: { qs_id: $.data.id }
            - call: "POST /survey/question-sets/${qs_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /survey/waves"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", question_set_id: "${qs_id}" }
              as: PlatformAdmin
              captures: { wave_id: $.data.id, wave_v0: $.data.version }
            - call: "POST /survey/transactions"
              payload: { dealer_id: "${dealer_id}", department_id: "${dept_id}", customer_id: "${cust_id}", kind: "SALE", completed_at: "2026-09-05T00:00:00Z", margin_cents: 100000 }
              as: PlatformAdmin
            - call: "POST /survey/waves/${wave_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /survey/waves/${wave_id}/invitations"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /survey/invitations/${inv_id}/send"
              payload: {}
              as: SurveyVendor
            - call: "POST /survey/invitations/${inv_id}/responses"
              payload: { answers: [{question_code: "q1", score: 10}] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/waves/${wave_id}/close"
              payload: {}
              as: PlatformAdmin
            - call: "GET /survey/waves/${wave_id}"
              payload: {}
              as: PlatformAdmin
              captures: { wave_v_after_close: $.data.version }
            - call: "POST /survey/statements"
              payload: { dealer_id: "${dealer_id}", wave_id: "${wave_id}", expected_wave_version: "${wave_v_after_close}" }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /survey/waves/${wave_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "GET /survey/statements/${st_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "IncentiveStatement.${st_id}.status == FINAL  # promoted from PROVISIONAL at finalize"
            - "IncentiveStatement.${st_id}.tier == GOLD"
            - "IncentiveStatement.${st_id}.payout_cents == 8000  # 100000 * 0.08 = 8000"
            - "provisional statement would have been SUPERSEDED by a recompute; FINAL is locked and payable"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: incentive_tiering_multi_input_threshold_mode_a
        grounds:
          - calculations.incentive_tiering
          - entities.IncentiveStatement.fields.tier
          - entities.IncentiveStatement.fields.payout_cents
        distinguishing_aspect: |
          Combinatorial mode (a): incentive_tiering takes ≥3 inputs (adjusted
          score, response rate, posture-via-flag count) with non-linear
          interaction — eligibility gated on response_rate >= 0.30 first, then
          tier selected by score threshold chain (>=900 GOLD, >=800 SILVER,
          >=700 BRONZE, else INELIGIBLE), then payout is rate × margin with
          round_half_up to integer cents. Different combinations of (score,
          rate) yield discretely different payouts.
        test_recipe:
          setup:
            - "Region SW; Dealer D3; Department D3-SALES; Customers C3a, C3b, C3c (all do_not_contact=false)."
            - "QS-C ACTIVE (q1 weight 1.0)."
            - "Wave W3 [2026-09-01, 2026-10-01)."
            - "Three transactions T3a/T3b/T3c for D3 with margin_cents 50000 each; three invitations; two customers respond with score=10, one does not respond."
            - "Wave closed; dealer raw = 100*10=1000; adjusted = 1000; response_rate = round(2/3, 4) = 0.6667."
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "SW", name: "Southwest" }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /survey/dealers"
              payload: { region_id: "${region_id}", name: "D3", dealer_code: "D3" }
              as: PlatformAdmin
              captures: { dealer_id: $.data.id }
            - call: "POST /survey/departments"
              payload: { dealer_id: "${dealer_id}", kind: "SALES", name: "Sales" }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /survey/customers"
              payload: { full_name: "C3a", email: "c3a@x.com", phone: "5551111111" }
              as: PlatformAdmin
              captures: { cust_a: $.data.id }
            - call: "POST /survey/customers"
              payload: { full_name: "C3b", email: "c3b@x.com", phone: "5552222222" }
              as: PlatformAdmin
              captures: { cust_b: $.data.id }
            - call: "POST /survey/customers"
              payload: { full_name: "C3c", email: "c3c@x.com", phone: "5553333333" }
              as: PlatformAdmin
              captures: { cust_c: $.data.id }
            - call: "POST /survey/question-sets"
              payload: { code: "QS-C", questions: [{question_code: "q1", prompt: "Sat", weight: 1.0}], comparability_factor: 1.0 }
              as: PlatformAdmin
              captures: { qs_id: $.data.id }
            - call: "POST /survey/question-sets/${qs_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /survey/waves"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", question_set_id: "${qs_id}" }
              as: PlatformAdmin
              captures: { wave_id: $.data.id }
            - call: "POST /survey/transactions"
              payload: { dealer_id: "${dealer_id}", department_id: "${dept_id}", customer_id: "${cust_a}", kind: "SALE", completed_at: "2026-09-05T00:00:00Z", margin_cents: 50000 }
              as: PlatformAdmin
            - call: "POST /survey/transactions"
              payload: { dealer_id: "${dealer_id}", department_id: "${dept_id}", customer_id: "${cust_b}", kind: "SALE", completed_at: "2026-09-06T00:00:00Z", margin_cents: 50000 }
              as: PlatformAdmin
            - call: "POST /survey/transactions"
              payload: { dealer_id: "${dealer_id}", department_id: "${dept_id}", customer_id: "${cust_c}", kind: "SALE", completed_at: "2026-09-07T00:00:00Z", margin_cents: 50000 }
              as: PlatformAdmin
            - call: "POST /survey/waves/${wave_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /survey/waves/${wave_id}/invitations"
              payload: { limit: 100 }
              as: PlatformAdmin
              captures: { inv_a: "$.data[0].id", inv_b: "$.data[1].id" }
            - call: "POST /survey/invitations/${inv_a}/send"
              payload: {}
              as: SurveyVendor
            - call: "POST /survey/invitations/${inv_b}/send"
              payload: {}
              as: SurveyVendor
            - call: "POST /survey/invitations/${inv_a}/responses"
              payload: { answers: [{question_code: "q1", score: 10}] }
              as: Customer
              as_user_id: "${cust_a}"
            - call: "POST /survey/invitations/${inv_b}/responses"
              payload: { answers: [{question_code: "q1", score: 10}] }
              as: Customer
              as_user_id: "${cust_b}"
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/waves/${wave_id}/close"
              payload: {}
              as: PlatformAdmin
            - call: "GET /survey/waves/${wave_id}"
              payload: {}
              as: PlatformAdmin
              captures: { wave_v: $.data.version }
          trigger:
            - call: "POST /survey/statements"
              payload: { dealer_id: "${dealer_id}", wave_id: "${wave_id}", expected_wave_version: "${wave_v}" }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
          assert:
            - "IncentiveStatement.${st_id}.score_used == 1000.0"
            - "IncentiveStatement.${st_id}.response_rate_used == 0.6667"
            - "IncentiveStatement.${st_id}.tier == GOLD  # score 1000 >= 900 AND rate 0.6667 >= 0.30"
            - "IncentiveStatement.${st_id}.eligible_margin_cents == 150000"
            - "IncentiveStatement.${st_id}.payout_cents == 12000  # 150000 * 0.08 = 12000"

      - name: response_score_nested_rounding_mode_b
        grounds:
          - calculations.response_score
          - entities.SurveyResponse.fields.score
          - entities.QuestionSet.fields.questions
        distinguishing_aspect: |
          Combinatorial mode (b): response_score uses nested rounding where the
          order matters — per-question contribution is (answer × weight), then
          the weighted sum is divided by total weight, multiplied by 100, and
          only then round_half_up to 2 decimals. Rounding per-question first
          (e.g., round each contribution to integer) vs rounding only the final
          average produces different cents-level outputs; the scaffold pins
          "round only at the end, after the ×100 scaling".
        test_recipe:
          setup:
            - "Region SW; Dealer D4; Dept D4-SALES; Customer C4."
            - "QS-D ACTIVE with three questions: q1 weight 1, q2 weight 3, q3 weight 7. comparability_factor 1.0."
            - "Wave W4 [2026-09-01, 2026-10-01) QS-D."
            - "Transaction T4 (margin_cents irrelevant here)."
            - "Invitation I4 sent; customer submits answers q1=7, q2=8, q3=9."
            - "Expected: weighted sum = 7*1 + 8*3 + 9*7 = 7 + 24 + 63 = 94; total weight = 11; raw mean = 94/11 = 8.545454...; ×100 = 854.5454...; round_half_up 2dp = 854.55. If instead we rounded per-question contribution to integer first (7, 24, 63), we'd get the same 94 — to break ties consider a finer case: answers 7,8,9 give same sum; we pin order explicitly so re-implementation must not pre-round."
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "SW", name: "Southwest" }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /survey/dealers"
              payload: { region_id: "${region_id}", name: "D4", dealer_code: "D4" }
              as: PlatformAdmin
              captures: { dealer_id: $.data.id }
            - call: "POST /survey/departments"
              payload: { dealer_id: "${dealer_id}", kind: "SALES", name: "Sales" }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /survey/customers"
              payload: { full_name: "C4", email: "c4@x.com", phone: "5554444444" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /survey/question-sets"
              payload: { code: "QS-D", questions: [{question_code: "q1", prompt: "A", weight: 1}, {question_code: "q2", prompt: "B", weight: 3}, {question_code: "q3", prompt: "C", weight: 7}], comparability_factor: 1.0 }
              as: PlatformAdmin
              captures: { qs_id: $.data.id }
            - call: "POST /survey/question-sets/${qs_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /survey/waves"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", question_set_id: "${qs_id}" }
              as: PlatformAdmin
              captures: { wave_id: $.data.id }
            - call: "POST /survey/transactions"
              payload: { dealer_id: "${dealer_id}", department_id: "${dept_id}", customer_id: "${cust_id}", kind: "SALE", completed_at: "2026-09-05T00:00:00Z", margin_cents: 1000 }
              as: PlatformAdmin
            - call: "POST /survey/waves/${wave_id}/open"
              payload: {}
              as: PlatformAdmin
            - call: "GET /survey/waves/${wave_id}/invitations"
              payload: {}
              as: PlatformAdmin
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /survey/invitations/${inv_id}/send"
              payload: {}
              as: SurveyVendor
          trigger:
            - call: "POST /survey/invitations/${inv_id}/responses"
              payload: { answers: [{question_code: "q1", score: 7}, {question_code: "q2", score: 8}, {question_code: "q3", score: 9}] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { resp_id: $.data.id }
          assert:
            - "SurveyResponse.${resp_id}.score == 854.55  # (7*1+8*3+9*7)/(1+3+7) * 100 = 94/11*100 = 854.5454... rounds half-up to 854.55"
            - "rounding is applied once at the end, NOT per-question contribution"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: action_plan_revision_loop_branching
        grounds:
          - state_machines.ActionPlan
          - state_machines.ActionPlan.SUBMITTED_to_REJECTED
          - state_machines.ActionPlan.REJECTED_to_DRAFT
        distinguishing_aspect: |
          ActionPlan exhibits a cyclic shape: DRAFT -> SUBMITTED -> REJECTED ->
          DRAFT, allowing multiple revision rounds. The same entity can loop
          back to DRAFT, and review_note is cleared on each revert. This is
          branching-with-revert on the ActionPlan entity.
        test_recipe:
          setup:
            - "Region SW; Dealer D5; Wave W5 in DRAFT (no close needed); ActionPlan AP5 created in DRAFT."
          setup_api_calls:
            - call: "POST /survey/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /survey/regions"
              payload: { code: "SW", name: "Southwest" }
              as: PlatformAdmin
              captures: { region_id: $.data.id }
            - call: "POST /survey/dealers"
              payload: { region_id: "${region_id}", name: "D5", dealer_code: "D5" }
              as: PlatformAdmin
              captures: { dealer_id: $.data.id }
            - call: "POST /survey/question-sets"
              payload: { code: "QS-E", questions: [{question_code: "q1", prompt: "A", weight: 1}], comparability_factor: 1.0 }
              as: PlatformAdmin
              captures: { qs_id: $.data.id }
            - call: "POST /survey/waves"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", question_set_id: "${qs_id}" }
              as: PlatformAdmin
              captures: { wave_id: $.data.id }
            - call: "POST /survey/action-plans"
              payload: { dealer_id: "${dealer_id}", wave_id: "${wave_id}", title: "Improve follow-up", items: [{action: "coach staff", owner: "GM", due_date: "2026-11-01T00:00:00Z"}], due_date: "2026-12-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /survey/action-plans/${ap_id}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
            - call: "POST /survey/action-plans/${ap_id}/review"
              payload: { outcome: "REJECTED", review_note: "insufficient detail" }
              as: FieldConsultant
            - call: "POST /survey/action-plans/${ap_id}/revise"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
            - call: "POST /survey/action-plans/${ap_id}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
            - call: "POST /survey/action-plans/${ap_id}/review"
              payload: { outcome: "APPROVED", review_note: "ok" }
              as: FieldConsultant
            - call: "POST /survey/action-plans/${ap_id}/start"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
            - call: "POST /survey/action-plans/${ap_id}/complete"
              payload: {}
              as: FieldConsultant
