          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BUDGET_BELOW_MINIMUM]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: the same PUT violates
          both (ENDED terminal state, budget 50 < 100) and priority 6 beats
          priority 11, so ERR_INVALID_STATE wins — not the fiscal error.
