              captures: { dev_j: $.data.id }
            - call: "POST /pers/devices/${dev_j}/tests"
              payload: { reported_battery_pct: 90, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_j}"
            - call: "POST /pers/devices/${dev_j}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_j}"
            - call: "POST /pers/contracts/${ctr_j}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { ctr_j_v: $.data.version }
            - call: "POST /pers/devices/${dev_j}/alarms"
              payload: { signal_type: "MANUAL_BUTTON" }
              as: Subscriber
              as_user_id: "${sub_j}"
              captures: { alarm_j: $.data.id }
            - call: "POST /pers/contracts/${ctr_j}/request-cancellation"
              payload: { expected_contract_version: "${ctr_j_v}" }
              as: Subscriber
              as_user_id: "${sub_j}"
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
