              as: System
            - call: "POST /markets"
              payload: { code: "ATL", name: "Atlanta", tax_jurisdiction_code: "GA-FULTON", millage_bps: 125, rent_index_cents: 210000, cost_index_bps: 10250, cost_variance_tolerance_bps: 1000, make_ready_target_days: 30, turn_holdback_cap_bps: 1500, showing_buffer_minutes: 30, min_showing_duration_minutes: 30, pet_deposit_per_pet_cents: 30000, pet_deposit_cap_cents: 50000, max_pets: 2, restricted_breeds: ["PIT_BULL", "ROTTWEILER"], standard_lease_term_months: 12, fraud_block_threshold_bps: 6000, rent_to_income_max_bps: 4000, vacancy_loss_bps: 500, bad_debt_bps: 100, mgmt_fee_bps: 800, underwriting_yield_floor_bps: 500, disposition_yield_floor_bps: 540, max_rent_concession_bps: 500 }
              as: PortfolioAdmin
              as_user_id: "admin-1"
              captures: { mkt_id: $.data.id }
            - call: "POST /prospects"
              payload: { email: "p1@example.com", full_name: "Paula One", phone: "+1-404-555-0101", market_id: "${mkt_id}", declared_monthly_income_cents: 700000, credit_tier: "B", prior_eviction_count: 0 }
              as: Anonymous
              as_user_id: "device-p1"
              captures: { p1_id: $.data.id, p1_v1: $.data.version }
            - call: "POST /prospects/${p1_id}/identity-verifications"
              payload: { expected_prospect_version: "${p1_v1}", document_type: "DRIVERS_LICENSE", document_match_score_bps: 9200, selfie_liveness_pass: true, verified_monthly_income_cents: 560000, device_reputation_bps: 8800, ip_geo_distance_km: 15 }
              as: Prospect
              as_user_id: "${p1_id}"
              captures: { p1_v2: $.data.version }
          trigger:
            - call: "POST /prospects/${p1_id}/identity-verifications"
              payload: { expected_prospect_version: "${p1_v1}", document_type: "DRIVERS_LICENSE", document_match_score_bps: 9200, selfie_liveness_pass: true, verified_monthly_income_cents: 560000, device_reputation_bps: 8800, ip_geo_distance_km: 15 }
              as: Prospect
              as_user_id: "${p1_id}"
            - call: "POST /prospects/${p1_id}/identity-verifications"
              payload: { expected_prospect_version: "${p1_v2}", document_type: "DRIVERS_LICENSE", document_match_score_bps: 9200, selfie_liveness_pass: true, verified_monthly_income_cents: 560000, device_reputation_bps: 8800, ip_geo_distance_km: 15 }
              as: Prospect
              as_user_id: "${p1_id}"
          assert:
            - "before trigger call 1: Prospect.${p1_id}.version == 2"
            - "before trigger call 1: Prospect.${p1_id}.verification_attempt_count == 1"
            - "before trigger call 1: Prospect.${p1_id}.fraud_risk_score_bps == 1093"
            - "trigger call 1: response.http_status == 412 and response.error_id == ERR_STALE_PROSPECT_VERSION"
            - "after trigger call 1: Prospect.${p1_id}.version == 2"
            - "after trigger call 1: Prospect.${p1_id}.verification_attempt_count == 1"
            - "trigger call 2: response.http_status == 200"
            - "after trigger call 2: Prospect.${p1_id}.version == 3"
            - "after trigger call 2: Prospect.${p1_id}.verification_attempt_count == 2"
            - "after trigger call 2: Prospect.${p1_id}.identity_status == VERIFIED"
            - "after trigger call 2: Prospect.${p1_id}.fraud_score_variant == post_verification"
            - "after trigger call 2: Prospect.${p1_id}.fraud_risk_score_bps == 1093"

      - name: work_order_completion_cascade_runs_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.RenovationProject.IN_PROGRESS_to_RENT_READY
          - state_machines.Home.asset_status.RENOVATING_to_STABILIZED
        excluded_because:
          difficulty_instance: work_order_completion_cascades_four_hops_to_slot_unblock_and_realized_yield
          rationale: >
            The cascading_side_effects layer is exercised at full depth by the difficulty instance,
            which follows one completion through the project rollup, the home's asset dimension, the
            posture-driven slot unblock and the realized yield recomputation in a single scenario.
            Re-testing a shorter version of the same chain here would only duplicate its first hops.

