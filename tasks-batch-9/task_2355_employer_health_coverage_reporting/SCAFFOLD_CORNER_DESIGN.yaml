          states in one recipe: LEAVE_END is not a transition out of ACTIVE and
          REHIRE is not a transition out of ON_LEAVE, while the LEAVE_START in
          between proves the machine is otherwise live. Both rejections must be
          ERR_EMPLOYMENT_EVENT_NOT_APPLICABLE (priority 10), not a 404 or a
          shape error.
        test_recipe:
          setup:
