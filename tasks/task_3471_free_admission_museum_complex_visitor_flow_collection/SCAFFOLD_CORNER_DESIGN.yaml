  # ===========================================================================
  - section: rbac
    instances:
      - name: rbac_role_denials
        claim_type: violation_to_error
        grounds:
          - roles.PlatformAdmin
          - roles.VisitorServices
          - roles.LoansOfficer
          - roles.Curator
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "Four independent role denials on one sweep: Public cannot create museums, a Docent cannot refund tickets, a BorrowerRep cannot decide condition reports, and a CommitteeChair cannot submit reviews — role checks (priority 2) fire before existence checks (priority 3), so even bogus ids return 403."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /campus/museums"
              payload: { museum_code: "DENY", display_name: "Denied Museum", requires_timed_pass: false, quarter_hour_pass_quota: 10, daily_pass_quota: 100, screening_rate_per_quarter_hour: 20 }
              as: Public
              as_user_id: "visitor-deny"
              captures: { e1: $.data.error_id }
            - call: "POST /campus/tickets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/refund"
              payload: {}
              as: Docent
              as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              captures: { e2: $.data.error_id }
            - call: "POST /campus/condition-reports/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/decide"
              payload: { outcome: "ACCEPTED" }
              as: BorrowerRep
              captures: { e3: $.data.error_id }
            - call: "POST /campus/collection-reviews/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/submit"
              payload: {}
              as: CommitteeChair
              as_user_id: "chair-deny"
              captures: { e4: $.data.error_id }
          assert:
            - "e1 == ERR_UNAUTHORIZED_ROLE (Public may not create museums)"
            - "e2 == ERR_UNAUTHORIZED_ROLE (Docent may not refund; role check precedes the 404 the bogus id would otherwise earn)"
            - "e3 == ERR_UNAUTHORIZED_ROLE (BorrowerRep may not decide reports)"
            - "e4 == ERR_UNAUTHORIZED_ROLE (CommitteeChair may not submit reviews)"

      - name: docent_confirm_other_docents_assignment_forbidden
        claim_type: violation_to_error
        grounds:
          - roles.Docent
          - state_machines.DocentAssignment.ASSIGNED_to_CONFIRMED
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "The Docent role is entity-backed: confirm requires X-User-ID == assignment.docent_id, so docent Two confirming docent One's assignment is a 403 ownership violation, not a state error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Museum; program (MON, gallery D1, 600-660, BASIC); docents One and Two; assignment of docent One for 2026-10-05."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/museums"
              payload: { museum_code: "SAAM", display_name: "American Art", requires_timed_pass: false, quarter_hour_pass_quota: 10, daily_pass_quota: 100, screening_rate_per_quarter_hour: 20 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/education-programs"
              payload: { title: "Ownership Tour", gallery_code: "D1", day_of_week: "MON", start_minute: 600, end_minute: 660, student_capacity: 20, docent_ratio: 10, max_group_size: 20, required_docent_certification: "BASIC" }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /campus/docents"
              payload: { full_name: "Docent One", certification_level: "BASIC" }
              as: ProgramCoordinator
              captures: { d1: $.data.id }
            - call: "POST /campus/docents"
              payload: { full_name: "Docent Two", certification_level: "BASIC" }
              as: ProgramCoordinator
              captures: { d2: $.data.id }
            - call: "POST /campus/education-programs/${prog_id}/docent-assignments"
              payload: { docent_id: "${d1}", service_date: "2026-10-05" }
              as: ProgramCoordinator
              captures: { asg: $.data.id }
          trigger:
            - call: "POST /campus/docent-assignments/${asg}/confirm"
              payload: {}
              as: Docent
              as_user_id: "${d2}"
              captures: { err: $.data.error_id }
          assert:
            - "confirm by docent Two fails err == ERR_UNAUTHORIZED_ROLE (403)"
            - "DocentAssignment.${asg}.status remains ASSIGNED"

      - name: member_must_act_as_self_for_member_price
        claim_type: violation_to_error
        grounds:
          - roles.Member
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "The Member role is entity-backed: a Member caller whose X-User-ID is member M1 may not attach member_id M2 to a purchase — the member-price path enforces self-service."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z (public window open). TRUST fund; museum; exhibition fee 2500 quota 5 ON_SALE; ACTIVE members M1 and M2."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/funds"
              payload: { fund_code: "TRUST-SELF", fund_type: "TRUST", appropriation_cents: 1000000 }
              as: PlatformAdmin
              captures: { fund_id: $.data.id }
            - call: "POST /campus/museums"
              payload: { museum_code: "NPG", display_name: "Portrait Gallery", requires_timed_pass: false, quarter_hour_pass_quota: 10, daily_pass_quota: 100, screening_rate_per_quarter_hour: 20 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/exhibitions"
              payload: { title: "Self Service Show", fee_cents: 2500, daily_ticket_quota: 5, member_presale_opens_at: "2026-09-05T00:00:00Z", public_sale_opens_at: "2026-09-10T00:00:00Z", revenue_fund_id: "${fund_id}" }
              as: ExhibitionManager
              captures: { exh_id: $.data.id }
            - call: "POST /campus/exhibitions/${exh_id}/open-sale"
              payload: {}
              as: ExhibitionManager
            - call: "POST /campus/members"
              payload: { full_name: "Member One", email: "m1@example.org", membership_term_months: 12 }
              as: Public
              as_user_id: "signup-7"
              captures: { m1: $.data.id }
            - call: "POST /campus/members"
              payload: { full_name: "Member Two", email: "m2@example.org", membership_term_months: 12 }
              as: Public
              as_user_id: "signup-8"
              captures: { m2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campus/exhibitions/${exh_id}/tickets"
              payload: { buyer_name: "Member One", visit_date: "2026-09-20", member_id: "${m2}" }
              as: Member
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
            - call: "GET /campus/funds/${fund_id}"
              payload: {}
              as: FinanceOfficer
              captures: { rec0: $.data.receipts_cents }
          assert:
            - "purchase fails err == ERR_UNAUTHORIZED_ROLE (403): member_id M2 does not match caller X-User-ID M1"
            - "rec0 == 0 (no ticket row created, no receipt posted)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_same_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/campus/school-reservations
        distinguishing_aspect: "Consistency is immediate: the 201 create response of a school reservation already carries its synchronously-resolved status (CONFIRMED) and a subsequent list read returns the identical status — no polling, no eventual lag."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Museum; program (MON 600-660 gallery E1, capacity 40, ratio 10, max 40, BASIC); one BASIC docent confirmed for 2026-10-05."
          setup_api_calls:
            - *c_clock
            - call: "POST /campus/museums"
              payload: { museum_code: "NMAI", display_name: "American Indian", requires_timed_pass: false, quarter_hour_pass_quota: 10, daily_pass_quota: 100, screening_rate_per_quarter_hour: 20 }
              as: PlatformAdmin
              captures: { mus_id: $.data.id }
            - call: "POST /campus/museums/${mus_id}/education-programs"
              payload: { title: "Consistency Tour", gallery_code: "E1", day_of_week: "MON", start_minute: 600, end_minute: 660, student_capacity: 40, docent_ratio: 10, max_group_size: 40, required_docent_certification: "BASIC" }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /campus/docents"
              payload: { full_name: "Docent Consistent", certification_level: "BASIC" }
              as: ProgramCoordinator
              captures: { dc: $.data.id }
            - call: "POST /campus/education-programs/${prog_id}/docent-assignments"
              payload: { docent_id: "${dc}", service_date: "2026-10-05" }
              as: ProgramCoordinator
              captures: { asg: $.data.id }
            - call: "POST /campus/docent-assignments/${asg}/confirm"
              payload: {}
              as: Docent
              as_user_id: "${dc}"
          trigger:
            - call: "POST /campus/school-reservations"
              payload: { museum_id: "${mus_id}", program_id: "${prog_id}", school_name: "Consistent School", headcount: 10, visit_date: "2026-10-05" }
              as: Public
              as_user_id: "teacher-cs"
              captures: { res_id: $.data.id, stat_create: $.data.status }
            - call: "GET /campus/school-reservations"
              payload: { program_id: "${prog_id}" }
              as: ProgramCoordinator
          assert:
            - "stat_create == CONFIRMED in the create response itself (resolution is synchronous)"
            - "the subsequent list read shows SchoolGroupReservation.${res_id}.status == CONFIRMED (identical value, no lag)"

