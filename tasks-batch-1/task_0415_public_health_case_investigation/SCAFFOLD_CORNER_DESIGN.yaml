        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / referential_404_beats_jurisdiction_scope_403
          rationale: "The priority-4-over-5 ladder ordering is the exact assertion of the named §1.8 instance."

  # ===========================================================================
  # SECTION: endpoints
