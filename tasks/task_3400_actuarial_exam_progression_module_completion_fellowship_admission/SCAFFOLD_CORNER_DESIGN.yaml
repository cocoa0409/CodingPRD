        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_HEADERS]"]
        distinguishing_aspect: "A call without an X-User-Role header fails ERR_MISSING_HEADERS (401) before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /actuarial/candidates/00000000-0000-0000-0000-000000000000"
              as: "(no X-User-Role header sent)"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_MISSING_HEADERS"
