  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: pricing_tier_duplicate_start_instant_rejected
        grounds:
          - validations[priority=17]
          - entities.PricingTier.fields.effective_from_utc
          - errors[ERR_DUPLICATE_PRICING_TIER]
        distinguishing_aspect: |
          Interval semantics = point-adjacency on the time axis: PricingTier windows are half-open
          [effective_from_i, effective_from_{i+1}) that must tile the timeline; a second tier sharing
          an identical effective_from_utc collides at the start instant and is rejected. Resource: PricingTier.
        test_recipe:
          setup:
            - "Distance with a REGULAR tier at 2026-05-01; adding a second tier at the same instant."
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Dup Tier 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 50 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
          trigger:
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "LATE", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 7000 }
              as: RaceDirector
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_DUPLICATE_PRICING_TIER"

      - name: wave_aggregate_capacity_full_rejects_bib_assignment
        grounds:
          - validations[priority=12]
          - entities.Wave.fields.assigned_count
          - errors[ERR_WAVE_FULL]
        distinguishing_aspect: |
          Interval semantics = aggregate capacity occupation (different from PricingTier's point-adjacency):
          a Wave holds wave_capacity bib slots; once assigned_count reaches wave_capacity a further
          assign-bib collides with the existing occupants and is rejected. Resource: Wave.
        test_recipe:
          setup:
            - "Wave wave_capacity 1, already filled by P1's bib; P2 CONFIRMED awaiting bib in same wave."
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "wf1@x.com", full_name: "WF One", birthdate: "1990-01-01", gender: "M" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /participants"
              payload: { email: "wf2@x.com", full_name: "WF Two", birthdate: "1990-01-02", gender: "F" }
              as: RaceDirector
              captures: { p2: $.data.id }
            - call: "POST /events"
              payload: { name: "WF 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 50 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 1, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p1}" }
              as: Participant
              as_user_id: "${p1}"
              captures: { reg1: $.data.id }
            - call: "GET /distances/${dist}"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
              captures: { dv1: $.data.version }
            - call: "POST /registrations/${reg1}/confirm-payment"
              payload: { expected_distance_version: "${dv1}" }
              as: Participant
              as_user_id: "${p1}"
            - call: "POST /registrations/${reg1}/assign-bib"
              payload: {}
              as: RaceDirector
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p2}" }
              as: Participant
              as_user_id: "${p2}"
              captures: { reg2: $.data.id }
            - call: "GET /distances/${dist}"
              payload: {}
              as: Participant
              as_user_id: "${p2}"
              captures: { dv2: $.data.version }
            - call: "POST /registrations/${reg2}/confirm-payment"
              payload: { expected_distance_version: "${dv2}" }
              as: Participant
              as_user_id: "${p2}"
          trigger:
            - call: "POST /registrations/${reg2}/assign-bib"
              payload: {}
              as: RaceDirector
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_WAVE_FULL"
            - "Registration.${reg2}.status == CONFIRMED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: distance_confirmed_count_invariant_after_confirm_then_cancel
        grounds:
          - state_machines.Registration.PENDING_PAYMENT_to_CONFIRMED
          - state_machines.Registration.CONFIRMED_to_CANCELLED
          - entities.Distance.fields.confirmed_count
        distinguishing_aspect: |
          Conserved quantity = Distance.confirmed_count == count of Registrations on the distance in
          {CONFIRMED, BIB_ASSIGNED, FINISHED}. A confirm (+1) paired with its compensating cancel (-1)
          returns confirmed_count to its starting value of 0 with zero drift.
        test_recipe:
          setup:
            - "Empty distance capacity 5, confirmed_count starts at 0."
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "inv1@x.com", full_name: "Inv One", birthdate: "1990-01-01", gender: "M" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /events"
              payload: { name: "Inv 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 5 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p1}" }
              as: Participant
              as_user_id: "${p1}"
              captures: { reg: $.data.id }
            - call: "GET /distances/${dist}"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
              captures: { dv: $.data.version }
            - call: "POST /registrations/${reg}/confirm-payment"
              payload: { expected_distance_version: "${dv}" }
              as: Participant
              as_user_id: "${p1}"
          trigger:
            - call: "POST /registrations/${reg}/cancel"
              payload: {}
