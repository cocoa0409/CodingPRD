  # ===========================================================================
  # Section 8 - Cross-cutting complexity layers (1.0 complexity_profile)
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: optimistic_concurrency
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[lot-create-stale-rod-lot]
          - validations[priority=35]
          - errors[ERR_STALE_ROD_LOT_VERSION]
          - calculations[rod_mass_ledger]
        distinguishing_aspect: "The rod-lot OCC guard cannot be replaced by a state precondition: the second allocation is legitimate in every other respect (the rod lot is still RECEIVED and still holds 19901.00 lbs), it is refused purely because the client's version is stale. A refused write burns no version and no mass, so re-reading and retrying with the fresh version succeeds unchanged."
        test_recipe:
          setup:
            - "Released SKU THHN-12-CU (19.8 lbs/kft) and rod lot H-77Q of 20000.00 lbs at version v1. No customer or order is needed: order_id is optional on POST /production-lots."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /compounds"
              payload: { compound_code: "PVC-90-INS", layer_role: "INSULATION", temp_rating_c: 90, flame_test: "VW_1", max_voltage_v: 600, wet_rated: true, filler_pct: 12.5 }
              as: ProcessEngineer
              captures: { ins_id: $.data.id }
            - call: "POST /compounds/${ins_id}/qualify"
              payload: {}
              as: ProcessEngineer
            - call: "POST /listing-certifications"
              payload: { agency: "UL", file_number: "E12345", product_family_code: "BLDG-WIRE", initial_listing_date: "2026-06-01", inspection_interval_days: 90 }
              as: CertificationOfficer
              captures: { cert_id: $.data.id }
            - call: "POST /listing-certifications/${cert_id}/inspections"
              payload: { inspection_date: "2026-06-05", inspector_code: "INS-7", findings_count: 0, outcome: "PASS" }
              as: CertificationOfficer
            - call: "POST /catalog-products"
              payload: { product_code: "THHN-12-CU", awg_size: "12", conductor_metal: "COPPER", conductor_construction: "STRANDED_7", application_rating: "THHN", voltage_class: "LV_600", temp_rating_c: 90, insulation_thickness_mils: 28.0, conductor_lbs_per_kft: 19.8, insulation_compound_id: "${ins_id}", listing_certification_id: "${cert_id}", base_target_kft: 100.0 }
              as: ProcessEngineer
              captures: { prod_id: $.data.id }
            - call: "POST /catalog-products/${prod_id}/release"
              payload: {}
              as: ProcessEngineer
            - call: "POST /rod-purchase-lots"
              payload: { metal: "COPPER", supplier_code: "SUP-1", rod_diameter_mm: 8.0, heat_number: "H-77Q", purchase_weight_lbs: 20000.00, purchase_price_usd_per_lb: 4.05, pricing_basis: "SPOT", received_date: "2026-07-25" }
              as: ProcurementBuyer
              captures: { rod_id: $.data.id, rod_v1: $.data.version, rod_remaining_0: $.data.remaining_lbs }
          trigger:
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", lot_code: "LOT-A", planned_length_ft: 5000, line_code: "EXT-1", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T12:00:00Z", expected_rod_lot_version: "${rod_v1}" }
              as: ProcessEngineer
              captures: { lot_a: $.data.id, lot_a_consumed: $.data.consumed_rod_lbs }
            - call: "GET /rod-purchase-lots/${rod_id}"
              payload: {}
              as: ProcurementBuyer
              captures: { rod_v2: $.data.version, rod_remaining_1: $.data.remaining_lbs, rod_status_1: $.data.status }
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", lot_code: "LOT-B", planned_length_ft: 1000, line_code: "EXT-2", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T10:00:00Z", expected_rod_lot_version: "${rod_v1}" }
              as: ProcessEngineer
              captures: { e_stale_rod: $.data.error_id }
            - call: "GET /rod-purchase-lots/${rod_id}"
              payload: {}
              as: ProcurementBuyer
              captures: { rod_v3: $.data.version, rod_remaining_2: $.data.remaining_lbs, rod_committed_2: $.data.committed_lbs }
            - call: "GET /production-lots"
              payload: {}
              as: ProcessEngineer
            - call: "POST /production-lots"
              payload: { product_id: "${prod_id}", rod_lot_id: "${rod_id}", lot_code: "LOT-B", planned_length_ft: 1000, line_code: "EXT-2", scheduled_start_at: "2026-08-02T08:00:00Z", scheduled_end_at: "2026-08-02T10:00:00Z", expected_rod_lot_version: "${rod_v3}" }
              as: ProcessEngineer
              captures: { lot_b: $.data.id, lot_b_consumed: $.data.consumed_rod_lbs }
            - call: "GET /rod-purchase-lots/${rod_id}"
              payload: {}
              as: ProcurementBuyer
              captures: { rod_v4: $.data.version, rod_remaining_3: $.data.remaining_lbs, rod_committed_3: $.data.committed_lbs, rod_scrapped_3: $.data.scrapped_lbs, rod_status_3: $.data.status }
          assert:
            - "${rod_remaining_0} == 20000.00 at creation, and ${lot_a_consumed} == 99.00 (5.000 kft x 19.8 lbs/kft)"
            - "the successful allocation bumps the parent: ${rod_v2} == ${rod_v1} + 1 and ${rod_remaining_1} == 19901.00"
            - "${e_stale_rod} == \"ERR_STALE_ROD_LOT_VERSION\" with HTTP 412 - not 409 and not 422: the rod lot is still ${rod_status_1} == \"RECEIVED\" with 19901.00 lbs left, so no state or quantity rung could have caught this write"
            - "the refusal is completely inert: ${rod_v3} == ${rod_v2} (a rejected write burns no version), ${rod_remaining_2} == 19901.00 and ${rod_committed_2} == 99.00"
            - "no phantom lot was created: GET /production-lots returns 1 row with total_count == 1"
            - "the retry with the freshly read version succeeds unchanged: ${lot_b_consumed} == 19.80 and ${rod_v4} == ${rod_v3} + 1"
            - "the ledger closes: ${rod_remaining_3} == 19881.20, ${rod_committed_3} == 118.80, ${rod_scrapped_3} == 0.00 and 19881.20 + 118.80 + 0.00 == 20000.00"
            - "${rod_status_3} == \"RECEIVED\": remaining_lbs never reached 0, so the CONSUMED auto-transition did not fire"

      - name: rate_threshold_triggers
        claim_type: rate_threshold_triggers
        grounds:
          - calculations[rod_mass_ledger]
          - state_machines[RodPurchaseLot]
          - state_machines[ProductionLot]
        distinguishing_aspect: "SCRAP_ALERT_PCT is a strict greater-than on a rounded percentage, so a scrap that lands on exactly 10.00 percent of the purchase weight leaves the rod lot RECEIVED and its sibling lots untouched; the very next 1.00-point scrap tips it and the cascade fires. The rod lot is sized at 1000.00 lbs precisely so the boundary is expressible."
        test_recipe:
