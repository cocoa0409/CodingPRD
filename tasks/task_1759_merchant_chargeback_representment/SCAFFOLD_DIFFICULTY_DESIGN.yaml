            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${ma_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${mb_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${ma_id}", transaction_external_ref: "T-1", network_case_id: "NC-IA", reason_code: "10.4", amount_cents: 10000 }
              captures: { cba_id: $.data.id }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${mb_id}", transaction_external_ref: "T-1", network_case_id: "NC-IB", reason_code: "10.4", amount_cents: 10000 }
              captures: { cbb_id: $.data.id }
            - { call: "POST /acquirer/chargebacks/${cba_id}/notify", as: AcquirerOps, payload: {} }
            - { call: "POST /acquirer/chargebacks/${cbb_id}/notify", as: AcquirerOps, payload: {} }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${ma_id}"
              payload: { chargeback_id: "${cba_id}", evidence_type: RECEIPT, document_uri: "s3://ev/a.pdf" }
              captures: { eva: $.data.id }
            - call: "GET /acquirer/chargebacks/${cba_id}"
              as: AcquirerOps
              captures: { cba_v: $.data.version }
            - call: "POST /acquirer/representments"
              as: MerchantUser
              as_user_id: "${ma_id}"
              payload: { chargeback_id: "${cba_id}", evidence_item_ids: ["${eva}"], expected_chargeback_version: "${cba_v}" }
              captures: { repa_id: $.data.id }
            - { call: "POST /acquirer/representments/${repa_id}/submit", as: MerchantUser, as_user_id: "${ma_id}", payload: {} }
            - { call: "POST /acquirer/representments/${repa_id}/network-outcome", as: AcquirerOps, payload: { outcome: WON } }
            - { call: "POST /acquirer/chargebacks/${cba_id}/pre-arbitration", as: AcquirerOps, payload: {} }
            - { call: "POST /acquirer/chargebacks/${cba_id}/pre-arbitration/outcome", as: AcquirerOps, payload: { decision: LOST } }
            - { call: "POST /acquirer/chargebacks/${cbb_id}/accept", as: MerchantUser, as_user_id: "${mb_id}", payload: {} }
          trigger:
            - call: "GET /acquirer/merchants/${ma_id}"
              as: AcquirerOps
              captures: { clearing_a: $.data.clearing_balance_cents, case_a: $.data.status }
            - call: "GET /acquirer/merchants/${mb_id}"
              as: AcquirerOps
              captures: { clearing_b: $.data.clearing_balance_cents }
            - call: "GET /acquirer/chargebacks/${cba_id}"
              as: AcquirerOps
              captures: { case_a_final: $.data.case_status, funds_a: $.data.funds_status }
            - call: "GET /acquirer/chargebacks/${cbb_id}"
              as: AcquirerOps
              captures: { case_b_final: $.data.case_status, funds_b: $.data.funds_status }
          assert:
            - "clearing_a == 0 and clearing_b == 0 (win-then-pre-arb-loss nets to the accept outcome: sale +10000, dispute -10000, zero residual drift)"
            - "case_a_final == DECIDED_LOST and funds_a == DEBIT_FINAL"
            - "case_b_final == MERCHANT_ACCEPTED and funds_b == DEBIT_FINAL"
            - "invariant: clearing_a == clearing_b despite MA traversing WON -> PRE_ARBITRATION -> DECIDED_LOST"

      - name: reserve_units_hold_release_fold_invariant
        grounds:
          - entities.ReserveAccount.fields.held_cents
          - entities.ReserveLedgerEntry.fields.entry_type
          - calculations.reserve_hold_rounding
        distinguishing_aspect: |
          Conserved quantity: reserve units (different from clearing money).
          held_cents must always equal the ledger fold sum(HOLD) - sum(RELEASE) -
          sum(FORFEIT); the receipt holdback paired with its win RELEASE, and the
          pre-arb holdback paired with its loss FORFEIT, each leave held_cents
          exactly at its pre-receipt value (0), with four compensating entries
          netting to zero.
        test_recipe:
          setup:
            - "HIGH_RISK merchant reserve_rate_bps 0 (no settlement holds; only case-bound holdbacks)"
            - "one 10000-cent sale; full-amount chargeback fought WON, pre-arbitrated, then LOST"
          setup_api_calls:
            - { call: "POST /acquirer/reason-code-rules", as: AcquirerOps, payload: { network: VISA, reason_code: "10.4", category: FRAUD, required_evidence_types: [RECEIPT], merchant_response_days: 7, representment_days: 30, chargeback_fee_cents: 2500, effective_from: "2026-01-01T00:00:00Z" } }
            - call: "POST /acquirer/merchants"
              as: AcquirerOps
              payload: { legal_name: "Fold M", merchant_category_code: "5411", risk_tier: HIGH_RISK, reserve_rate_bps: 0 }
              captures: { m_id: $.data.id }
            - { call: "POST /acquirer/transactions", as: AcquirerOps, payload: { merchant_id: "${m_id}", external_ref: "T-1", network: VISA, amount_cents: 10000, occurred_at: "2026-07-10T00:00:00Z" } }
            - { call: "POST /acquirer/_clock/set_current_utc", as: AcquirerOps, payload: { to_iso8601: "2026-07-15T00:00:00Z" } }
            - call: "POST /acquirer/chargebacks"
              as: AcquirerOps
              payload: { merchant_id: "${m_id}", transaction_external_ref: "T-1", network_case_id: "NC-F1", reason_code: "10.4", amount_cents: 10000 }
              captures: { cb_id: $.data.id }
            - call: "GET /acquirer/reserve-accounts"
              as: RiskOfficer
              payload: { merchant_id: "${m_id}" }
              captures: { ra_id: "$.data[0].id", held_after_receipt: "$.data[0].held_cents" }
            - { call: "POST /acquirer/chargebacks/${cb_id}/notify", as: AcquirerOps, payload: {} }
            - call: "POST /acquirer/evidence-items"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_type: RECEIPT, document_uri: "s3://ev/f.pdf" }
              captures: { ev1: $.data.id }
            - call: "GET /acquirer/chargebacks/${cb_id}"
              as: AcquirerOps
              captures: { cb_v: $.data.version }
            - call: "POST /acquirer/representments"
              as: MerchantUser
              as_user_id: "${m_id}"
              payload: { chargeback_id: "${cb_id}", evidence_item_ids: ["${ev1}"], expected_chargeback_version: "${cb_v}" }
              captures: { rep_id: $.data.id }
            - { call: "POST /acquirer/representments/${rep_id}/submit", as: MerchantUser, as_user_id: "${m_id}", payload: {} }
          trigger:
            - { call: "POST /acquirer/representments/${rep_id}/network-outcome", as: AcquirerOps, payload: { outcome: WON } }
            - call: "GET /acquirer/reserve-accounts/${ra_id}"
              as: RiskOfficer
              captures: { held_after_win: $.data.held_cents }
            - { call: "POST /acquirer/chargebacks/${cb_id}/pre-arbitration", as: AcquirerOps, payload: {} }
            - call: "GET /acquirer/reserve-accounts/${ra_id}"
              as: RiskOfficer
              captures: { held_after_prearb: $.data.held_cents }
            - { call: "POST /acquirer/chargebacks/${cb_id}/pre-arbitration/outcome", as: AcquirerOps, payload: { decision: LOST } }
            - call: "GET /acquirer/reserve-accounts/${ra_id}"
              as: RiskOfficer
              captures: { held_final: $.data.held_cents }
            - call: "GET /acquirer/reserve-accounts/${ra_id}/ledger-entries"
              as: RiskOfficer
              captures: { e1: "$.data[0].entry_type", e2: "$.data[1].entry_type", e3: "$.data[2].entry_type", e4: "$.data[3].entry_type" }
          assert:
            - "held_after_receipt == 10000 (HIGH_RISK receipt holdback posted)"
            - "held_after_win == 0 (CHARGEBACK_WON RELEASE exactly compensates the receipt HOLD)"
            - "held_after_prearb == 10000 (pre-arb re-debit restores the holdback)"
            - "held_final == 0 (CHARGEBACK_LOST FORFEIT compensates the restored hold)"
            - "ledger fold: e1 == HOLD, e2 == RELEASE, e3 == HOLD, e4 == FORFEIT, each 10000; sum(HOLD) - sum(RELEASE) - sum(FORFEIT) == 20000 - 10000 - 10000 == 0 == held_final"
