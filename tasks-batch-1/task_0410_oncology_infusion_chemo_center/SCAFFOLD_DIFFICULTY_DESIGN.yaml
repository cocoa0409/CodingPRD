  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_chair_double_book_rejected
        grounds:
          - validations[priority=11]
          - entities.InfusionAppointment.fields.start_at
          - entities.Chair.fields.label
        distinguishing_aspect: |
          Chair interval semantics: half-open [start,end) overlap on the SAME chair.
          An existing 09:00-10:30 appointment blocks a 10:00-11:00 booking on the
          same chair (they overlap) with ERR_CHAIR_DOUBLE_BOOKED — this rule treats
          adjacency (end==start) as non-overlapping.
        test_recipe:
          setup:
            - "ACTIVE cycle; chair C-X with a SCHEDULED 09:00-10:30 appointment; nurses with ample acuity"
          setup_api_calls:
            - call: "POST /infusion-center/patients"
