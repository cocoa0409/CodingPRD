              as: MaterialsController
              captures: { bm_id: $.data.id }
            - call: "POST /plant-ops/calciner-batches/${bm_id}/feeds"
              payload: { lot_id: "${lot_m_id}", tons_fed: 100.000, measured_free_moisture_pct: 10.00, expected_lot_version: "${lot_m_v}" }
              as: MaterialsController
            - call: "POST /plant-ops/calciner-batches"
              payload: { plant_id: "${plant_id}", target_stucco_tons: 40.000, calcination_temp_f: 320.0, feed_rate_tph: 15.0, feed_window_start: "2026-08-02T14:00:00Z", feed_window_end: "2026-08-02T18:00:00Z" }
              as: MaterialsController
              captures: { b2_id: $.data.id }
            - call: "GET /plant-ops/gypsum-lots/${lot_m_id}"
              payload: {}
              as: MaterialsController
              captures: { lot_m_v3: $.data.version }
          trigger:
