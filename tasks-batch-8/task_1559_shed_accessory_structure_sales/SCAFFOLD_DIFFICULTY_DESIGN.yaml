        distinguishing_aspect: |
          Interval semantics = WHOLE-DAY occupancy on the ORDER/crew resource:
          any second booking for the same crew on the same calendar date
          collides, while the adjacent calendar date is free; semantics and
          resource differ from assessor_halfopen_window_overlap.
