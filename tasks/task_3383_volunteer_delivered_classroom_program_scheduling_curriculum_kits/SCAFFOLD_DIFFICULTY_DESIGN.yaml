  - rule_id: resource_temporal_overlap
    instances:
      - name: volunteer_sessions_half_open_overlap_back_to_back_allowed
        grounds:
          - state_machines.DeliverySession.TENTATIVE_to_SCHEDULED
          - errors.ERR_SESSION_OVERLAP
        distinguishing_aspect: |
          Interval semantics: pure half-open on the Volunteer resource — overlap iff
          cand.start < other.end AND other.start < cand.end on the same date, so a session
          starting exactly when another ends (630 == 630) is allowed, while a session starting
          30 minutes before that boundary (600 < 630) is rejected. No capacity aggregation:
          any positive overlap is a conflict. Distinct resource and semantics from the sibling
          (facility buffered aggregate).
