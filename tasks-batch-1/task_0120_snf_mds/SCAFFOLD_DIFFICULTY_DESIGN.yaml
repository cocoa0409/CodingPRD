              payload: { full_name: "Disch Res", medical_record_number: "MRN-DSC1", date_of_birth: "1945-01-01T00:00:00Z", primary_facility_id: "${fac_id}" }
              as: AdmissionsCoordinator
              captures: { res_id: $.data.id }
            - call: "POST /snf/residents/${res_id}/pasrr-screenings"
