# =============================================================================
# Task 1973: BIT & Care Referral — §1.9 Scaffold Corner Design
# Breadth coverage of every testable claim in §1.1-§1.7 not already covered by
# §1.8. Clock default 2026-08-01T00:00:00Z unless a chain sets it.
# =============================================================================
scaffold_corner_design:

  # ============================================================ entities
  - section: entities
    instances:
      - name: student_creation_applies_defaults
        claim_type: defaults
        grounds:
          - "entities.Student.fields.enrollment_status"
        distinguishing_aspect: "A student created without an enrollment_status input starts ENROLLED with version 1; id is a server-minted UUID."
        test_recipe:
          setup: ["SystemAdmin only; empty DB"]
          setup_api_calls:
            - { call: "POST /bit/students", payload: { external_ref: "S0001", full_name: "Stu Zero" }, as: SystemAdmin, captures: { s0: $.data.id, s0_status: $.data.enrollment_status, s0_v: $.data.version } }
          trigger:
            - { call: "GET /bit/students/${s0}", as: SystemAdmin, captures: { s0_get_status: $.data.enrollment_status } }
          assert:
            - "POST response: enrollment_status == ENROLLED, version == 1, id present (UUID without type prefix)"
            - "GET /bit/students/${s0} returns the same record with enrollment_status == ENROLLED"

      - name: staff_office_enum_invalid_rejected
        claim_type: type_constraints
        grounds:
          - "entities.StaffMember.fields.office"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "office must be one of the seven declared enum members; LIBRARY is rejected at creation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /bit/staff", payload: { full_name: "Bad Office", office: LIBRARY }, as: SystemAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (HTTP 400); no StaffMember persisted"

      - name: concern_report_missing_required_narrative
        claim_type: required_fields
        grounds:
          - "entities.ConcernReport.fields.narrative"
          - "errors[ERR_VALIDATION]"
        distinguishing_aspect: "narrative is a required input; omitting it fails before any business rule runs."
        test_recipe:
          setup: ["staff rep; student s1"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0002", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, observed_at: "2026-08-01T09:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (HTTP 400) — narrative missing"

      - name: care_case_computed_fields_after_scoring
        claim_type: computed_fields
        grounds:
          - "entities.CareCase.fields.current_risk_score"
          - "entities.CareCase.fields.current_risk_tier"
          - "entities.CareCase.fields.status"
        distinguishing_aspect: "current_risk_score / current_risk_tier are computed by triage_risk_score and status advances INTAKE -> TRIAGED; clients cannot set them directly (not in any input schema)."
        test_recipe:
          setup: ["staff chair/cm/rep; student s1; case c1 INTAKE via accepted report"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0003", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: SELF_HARM_RISK, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
          trigger:
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 20, harm_to_others: 20, academic_disruption: 5, substance_involvement: 5, rationale: "high" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { c1_score: $.data.current_risk_score, c1_tier: $.data.current_risk_tier, c1_status: $.data.status } }
          assert:
            - "CareCase.${c1}.current_risk_score == 62.0 (4*(7.0+7.0+0.75+0.75)) and .current_risk_tier == HIGH"
            - "CareCase.${c1}.status == TRIAGED — scoring drove the INTAKE -> TRIAGED transition"

      - name: get_unknown_ids_return_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: "A well-formed UUID that does not exist returns 404 ERR_NOT_FOUND on single-resource GET."
        test_recipe:
          setup: ["staff chair"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
          trigger:
            - { call: "GET /bit/care-cases/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: BITChair, as_user_id: "${chair}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (HTTP 404)"

      - name: list_pagination_limit_and_has_more
        claim_type: listing
        grounds:
          - "response_envelope.pagination_defaults"
          - "endpoints[GET /bit/concern-reports]"
        distinguishing_aspect: "List endpoints honor limit/offset and report total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["staff rep/chair; student s1; two SUBMITTED reports"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0004", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: ACADEMIC_DISTRESS, narrative: "first", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}" }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "second", observed_at: "2026-07-31T11:00:00Z" }, as: Reporter, as_user_id: "${rep}" }
          trigger:
            - { call: "GET /bit/concern-reports", payload: { student_id: "${s1}", limit: 1, offset: 0 }, as: BITChair, as_user_id: "${chair}" }
          assert:
            - "response data array has length 1; pagination total_count == 2 and has_more == true"
            - "a second call with offset: 1 returns the other report and has_more == false"

      - name: related_report_chain_link
        claim_type: parent_relationships
        grounds:
          - "entities.ConcernReport.fields.related_report_id"
        distinguishing_aspect: "A report may self-reference a prior report of the SAME student; the link is queryable via the filtered list."
        test_recipe:
          setup: ["staff rep/chair; student s1; report r1 exists"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0005", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: ACADEMIC_DISTRESS, narrative: "first", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "follow-up", observed_at: "2026-08-01T08:00:00Z", related_report_id: "${r1}" }, as: Reporter, as_user_id: "${rep}", captures: { r2: $.data.id, r2_rel: $.data.related_report_id } }
            - { call: "GET /bit/concern-reports", payload: { related_report_id: "${r1}" }, as: BITChair, as_user_id: "${chair}" }
          assert:
            - "ConcernReport.${r2}.related_report_id == ${r1}"
            - "GET /bit/concern-reports?related_report_id=${r1} returns exactly [${r2}]"

  # ============================================================ state_machines
  - section: state_machines
    instances:
      - name: report_accept_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.ConcernReport.UNDER_REVIEW_to_ACCEPTED"
          - "errors[ERR_REPORT_NOT_UNDER_REVIEW]"
        distinguishing_aspect: "accept requires UNDER_REVIEW; calling it on a fresh SUBMITTED report fails and nothing is created."
        test_recipe:
          setup: ["staff chair/cm/rep; student s1; report r1 SUBMITTED (never reviewed)"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0006", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { err: $.data.error_id } }
            - { call: "GET /bit/care-cases", payload: { student_id: "${s1}" }, as: BITChair, as_user_id: "${chair}" }
          assert:
            - "error_id == ERR_REPORT_NOT_UNDER_REVIEW (HTTP 409)"
            - "no CareCase created for ${s1} (list total_count == 0)"

      - name: closed_case_terminal_lockdown_rejects_scoring
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.CareCase"
          - "errors[ERR_CASE_NOT_TRIAGEABLE]"
        distinguishing_aspect: "CLOSED is terminal: after closure, scoring (and every other transition) is rejected."
        test_recipe:
          setup: ["staff chair/cm/rep; student s1; case c1 CLOSED (LOW tier, 3 STABLE check-ins, default clock)"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0007", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "low" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k1: "$.data[0].id" } }
            - { call: "POST /bit/follow-up-checkins/${k1}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k2: "$.data[0].id" } }
            - { call: "POST /bit/follow-up-checkins/${k2}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k3: "$.data[0].id" } }
            - { call: "POST /bit/follow-up-checkins/${k3}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/care-cases/${c1}/close", as: BITChair, as_user_id: "${chair}", captures: { c1_status: $.data.status } }
          trigger:
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: REASSESSMENT, harm_to_self: 10, harm_to_others: 10, academic_disruption: 10, substance_involvement: 10, rationale: "post-close" }, as: BITChair, as_user_id: "${chair}", captures: { err: $.data.error_id } }
          assert:
            - "close succeeded (status == CLOSED)"
            - "post-close scoring: error_id == ERR_CASE_NOT_TRIAGEABLE (HTTP 409) — terminal lockdown"

      - name: checkin_complete_twice_returns_invalid_state
        claim_type: idempotency
        grounds:
          - "state_machines.FollowUpCheckin.SCHEDULED_to_COMPLETED"
          - "errors[ERR_CHECKIN_NOT_SCHEDULED]"
        distinguishing_aspect: "Completing the same check-in twice: the second call observes COMPLETED and is rejected; no duplicate successor is created."
        test_recipe:
          setup: ["staff chair/cm/rep; student s1; case c1 PLAN_ACTIVE LOW; check-in k1 SCHEDULED"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0008", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: WELLBEING_GENERAL, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 0, harm_to_others: 0, academic_disruption: 0, substance_involvement: 0, rationale: "low" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k1: "$.data[0].id" } }
          trigger:
            - { call: "POST /bit/follow-up-checkins/${k1}/complete", payload: { outcome: STABLE, note: "ok" }, as: CaseManager, as_user_id: "${cm}", captures: { k1_status: $.data.status } }
            - { call: "POST /bit/follow-up-checkins/${k1}/complete", payload: { outcome: STABLE, note: "duplicate" }, as: CaseManager, as_user_id: "${cm}", captures: { err: $.data.error_id } }
          assert:
            - "first completion: status == COMPLETED; second: error_id == ERR_CHECKIN_NOT_SCHEDULED (HTTP 409)"
            - "exactly one SCHEDULED successor exists for the case (no duplicate)"

      - name: assessment_expiry_auto_transition
        claim_type: side_effect_execution
        grounds:
          - "state_machines.MandatedAssessment.SCHEDULED_to_EXPIRED"
          - "state_machines.CareCase.MANDATED_ASSESSMENT_to_LEAVE_DECISION"
        distinguishing_aspect: "The clock sweep itself drives SCHEDULED -> EXPIRED when now > due_at and fires the full LEAVE_DECISION cascade without any user action on the assessment."
        test_recipe:
          setup: ["staff chair/cm/rep/eval; student s1; case c1 PLAN_ACTIVE HIGH with check-in k1 SCHEDULED; assessment a1 due 2026-08-05T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Prof Rep", office: FACULTY_AFFAIRS }, as: SystemAdmin, captures: { rep: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Eval One", office: COUNSELING_CENTER }, as: SystemAdmin, captures: { ev: $.data.id } }
            - { call: "POST /bit/students", payload: { external_ref: "S0009", full_name: "Stu One" }, as: SystemAdmin, captures: { s1: $.data.id } }
            - { call: "POST /bit/concern-reports", payload: { student_id: "${s1}", category: SELF_HARM_RISK, narrative: "n", observed_at: "2026-07-31T10:00:00Z" }, as: Reporter, as_user_id: "${rep}", captures: { r1: $.data.id } }
            - { call: "POST /bit/concern-reports/${r1}/start-review", as: BITChair, as_user_id: "${chair}" }
            - { call: "POST /bit/concern-reports/${r1}/accept", payload: { case_manager_id: "${cm}" }, as: BITChair, as_user_id: "${chair}", captures: { c1: $.data.care_case_id } }
            - { call: "POST /bit/risk-scorings", payload: { case_id: "${c1}", mode: INITIAL, harm_to_self: 20, harm_to_others: 20, academic_disruption: 5, substance_involvement: 5, rationale: "high" }, as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { cv: $.data.version } }
            - { call: "POST /bit/intervention-plans", payload: { case_id: "${c1}", expected_case_version: "${cv}", objectives: ["o"], success_criteria: "s" }, as: CaseManager, as_user_id: "${cm}", captures: { p1: $.data.id } }
            - { call: "POST /bit/intervention-plans/${p1}/submit", as: CaseManager, as_user_id: "${cm}" }
            - { call: "POST /bit/intervention-plans/${p1}/approve", as: BITChair, as_user_id: "${chair}" }
            - { call: "GET /bit/follow-up-checkins", payload: { case_id: "${c1}", status: SCHEDULED }, as: BITChair, as_user_id: "${chair}", captures: { k1: "$.data[0].id" } }
            - { call: "POST /bit/mandated-assessments", payload: { case_id: "${c1}", evaluator_id: "${ev}", due_at: "2026-08-05T00:00:00Z", rationale: "mandate" }, as: BITChair, as_user_id: "${chair}", captures: { a1: $.data.id } }
          trigger:
            - { call: "POST /bit/_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /bit/mandated-assessments/${a1}", as: BITChair, as_user_id: "${chair}", captures: { a1_status: $.data.status } }
            - { call: "GET /bit/care-cases/${c1}", as: BITChair, as_user_id: "${chair}", captures: { c1_status: $.data.status } }
            - { call: "GET /bit/leave-decisions", payload: { case_id: "${c1}" }, as: BITChair, as_user_id: "${chair}", captures: { ld_status: "$.data[0].status", ld_req: "$.data[0].requested_by" } }
            - { call: "GET /bit/follow-up-checkins/${k1}", as: BITChair, as_user_id: "${chair}", captures: { k1_status: $.data.status } }
          assert:
            - "MandatedAssessment.${a1}.status == EXPIRED after the sweep (now 2026-08-06 > due_at 2026-08-05)"
            - "CareCase.${c1}.status == LEAVE_DECISION; one LeaveDecision PENDING with requested_by == ${chair}"
            - "FollowUpCheckin.${k1}.status == CANCELLED"

      - name: reentry_denied_returns_to_on_leave
        claim_type: valid_transition
        grounds:
          - "state_machines.CareCase.REENTRY_REVIEW_to_ON_LEAVE"
          - "state_machines.ReentryEvaluation.PENDING_to_DENIED"
        distinguishing_aspect: "The re-entry denial loop REENTRY_REVIEW -> ON_LEAVE keeps the student on leave and leaves the case re-petitionable (cyclic at case level)."
        test_recipe:
          setup: ["full leave path: case c1 ON_LEAVE via NOT_CLEARED assessment + GRANT_LEAVE by dean; re-entry evaluation ev1 PENDING petitioned by cm"]
          setup_api_calls:
            - { call: "POST /bit/staff", payload: { full_name: "Chair One", office: BIT_OFFICE }, as: SystemAdmin, captures: { chair: $.data.id } }
            - { call: "POST /bit/staff", payload: { full_name: "Manager One", office: BIT_OFFICE }, as: SystemAdmin, captures: { cm: $.data.id } }
