              captures: { pet_v: $.data.version }
            - call: "PUT /petitions/${pet_id}/title-summary"
              payload: { official_title: "The Duplicate Act", official_summary: "One signer, one signature.", expected_petition_version: "${pet_v}" }
              as: TitleExaminer
