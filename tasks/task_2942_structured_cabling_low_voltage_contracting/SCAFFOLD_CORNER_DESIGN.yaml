              as: DesignEngineer
              captures: { seg2: $.data.id, seg2_v1: $.data.version }
            - call: "POST /cabling/cable-types"
              payload: { category: "CAT6A", jacket_rating: "CMP", outer_diameter_mm: 7.9, max_channel_length_m: 100.0, shielded: false, cost_per_meter_cents: 150, applications: ["DATA_HORIZONTAL"] }
              as: DesignEngineer
              captures: { ct: $.data.id }
            - call: "POST /cabling/links"
              payload: { project_id: "${proj1}", telecom_room_id: "${room1}", cable_type_id: "${ct}", identifier: "TR01-A01", application: "DATA_HORIZONTAL", horizontal_length_m: 40.00, consolidation_point_stub_m: 0, patch_cord_allowance_m: 2.00 }
