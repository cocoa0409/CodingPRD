            - call: "POST /watch/incident-reports/${r1}/corroborate"
              payload: {}
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { err1: $.data.error_id }
            - call: "POST /watch/data-share-agreements/${dsa}/activate"
              payload: {}
