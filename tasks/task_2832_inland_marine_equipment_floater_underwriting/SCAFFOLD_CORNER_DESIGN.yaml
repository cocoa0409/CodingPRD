# ===========================================================================
# 1.9 Scaffold Corner Design - Inland Marine & Equipment Floater Underwriting
#
# Breadth probe over SCAFFOLD.yaml sections 1.1-1.7. Sections and claim_type
# values are taken verbatim from references/claim-extraction-guide.md; no new
# categories are invented. Corners already asserted by SCAFFOLD_DIFFICULTY_
# DESIGN.yaml appear as excluded_because stubs citing the covering instance by
# name.
#
# Money is integer cents, rates and factors are basis points. Every numeric
# assertion below was produced by executing the SCAFFOLD.yaml 1.3 formulas in
# exact rational arithmetic with a single round_half_up at the pinned point.
# ===========================================================================
scaffold_corner_design:

  # =========================================================================
  - section: entities
    instances:

      - name: corner_policy_creation_applies_defaults_and_computes_term_days
        claim_type: Creation
        grounds:
          - entities.Policy
          - entities.Policy.fields.term_days
          - entities.Policy.fields.minimum_premium_cents
          - endpoints[POST /inland-marine/policies]
        distinguishing_aspect: "A create with only the four required fields returns 201 with status DRAFT, referral_status NOT_REQUIRED, term_days computed as 365, minimum_premium_cents defaulted to 250000, and every money field at 0."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Default Draft Co", territory_code: "T3_INLAND", effective_date: "2026-08-01", expiration_date: "2027-08-01" }
              as: Underwriter
              captures: { pol: $.data.id }
          trigger:
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
          assert:
            - "create response HTTP status == 201"
            - "Policy.${pol}.status == DRAFT"
            - "Policy.${pol}.term_days == 365"
            - "Policy.${pol}.minimum_premium_cents == 250000 (declared default, not supplied)"
            - "Policy.${pol}.referral_required == false and referral_status == NOT_REQUIRED"
            - "Policy.${pol}.referred_by_user_id is null and referral_decided_by_user_id is null"
            - "Policy.${pol}.sum_of_part_premiums_cents == 0 and written_premium_cents == 0 and premium_balance_cents == 0 and incurred_loss_cents == 0 and total_insured_value_cents == 0"
            - "Policy.${pol}.occupancy_termination_count == 0"
            - "Policy.${pol}.quoted_at is null and bound_at is null and in_force_at is null"
            - "Policy.${pol}.id, created_at, updated_at and version are present; version == 1"

      - name: corner_policy_retrieval_returns_stored_state
        claim_type: Retrieval
        grounds:
          - entities.Policy
          - endpoints[GET /inland-marine/policies/{id}]
        distinguishing_aspect: "GET /policies/{id} echoes the persisted policy exactly: policyholder_name, territory_code T1_COASTAL, effective_date 2026-08-01, expiration_date 2027-02-01 and the derived term_days 184."
        test_recipe:
          setup:
            - "One DRAFT Policy, T1_COASTAL, 2026-08-01 to 2027-02-01, minimum_premium_cents 100000."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Coastal Readback Co", territory_code: "T1_COASTAL", effective_date: "2026-08-01", expiration_date: "2027-02-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
          trigger:
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: UnderwritingManager
          assert:
            - "trigger HTTP status == 200"
            - "Policy.${pol}.policyholder_name == Coastal Readback Co"
            - "Policy.${pol}.territory_code == T1_COASTAL"
            - "Policy.${pol}.effective_date == 2026-08-01 and expiration_date == 2027-02-01"
            - "Policy.${pol}.term_days == 184"
            - "Policy.${pol}.minimum_premium_cents == 100000"

      - name: corner_equipment_item_listing_paginates_with_filter
        claim_type: Listing
        grounds:
          - entities.EquipmentItem
          - endpoints[GET /inland-marine/equipment-items]
          - endpoints[GET /inland-marine/coverage-parts/{id}/equipment-items]
        distinguishing_aspect: "With three items on one part, GET /equipment-items?coverage_part_id=&limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset 2 returns the remaining 1 row with has_more false."
        test_recipe:
          setup:
            - "One PUBLISHED T2_URBAN EXCAVATOR rate cell, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One DRAFT Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart holding three RATED EquipmentItems, each insured_value_cents 8160000."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_exc: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_exc}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Fleet Pager Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Item 1", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { it1: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v2: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Item 2", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v2}" }
              as: Underwriter
              captures: { it2: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v3: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Item 3", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v3}" }
              as: Underwriter
              captures: { it3: $.data.id }
          trigger:
            - call: "GET /inland-marine/equipment-items"
              payload: { coverage_part_id: "${cp}", limit: 2, offset: 0 }
              as: Underwriter
            - call: "GET /inland-marine/equipment-items"
              payload: { coverage_part_id: "${cp}", limit: 2, offset: 2 }
              as: Underwriter
            - call: "GET /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { status: "RATED" }
              as: Underwriter
          assert:
            - "trigger[0] response: 2 rows, total_count == 3, has_more == true"
            - "trigger[1] response: 1 row, total_count == 3, has_more == false"
            - "trigger[0] and trigger[1] rows are disjoint and together cover ${it1}, ${it2}, ${it3}"
            - "rows are ordered created_at ASC, so trigger[0] row 0 is ${it1} and row 1 is ${it2}, and trigger[1] row 0 is ${it3}"
            - "trigger[2] response: total_count == 3, every row status == RATED"

      - name: corner_policy_not_found_for_unknown_id
        claim_type: Not Found
        grounds:
          - errors[ERR_POLICY_NOT_FOUND]
          - endpoints[GET /inland-marine/policies/{id}]
        distinguishing_aspect: "A GET against a well-formed but unknown policy id returns ERR_POLICY_NOT_FOUND with HTTP 404, not 200 with a null body and not 422."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Existing Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
          trigger:
            - call: "GET /inland-marine/policies/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "trigger HTTP status == 404"
            - "trigger response error_id == ERR_POLICY_NOT_FOUND"
            - "trigger response carries a non-empty message field"
            - "Policy.${pol} is unaffected and still retrievable"

      - name: corner_rate_rule_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.RateRule.fields.base_rate_bp
          - validations[priority=35]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /inland-marine/rate-rules]
        distinguishing_aspect: "Omitting the required base_rate_bp from a rate-cell create returns ERR_INVALID_REQUEST 400 and persists nothing, so a subsequent rating attempt still finds no cell."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, theft_hazard_grade: "A" }
              as: Actuary
              captures: { err: $.data.error_id }
          assert:
            - "trigger HTTP status == 400"
            - "trigger response error_id == ERR_INVALID_REQUEST"
            - "no RateRule row is created"

      - name: corner_equipment_item_defaults_inherit_part_basis_and_no_tracker
        claim_type: Defaults
        grounds:
          - entities.EquipmentItem.fields.valuation_basis
          - entities.EquipmentItem.fields.geo_tracker_installed
          - entities.EquipmentItem.fields.ownership
          - endpoints[POST /inland-marine/coverage-parts/{id}/equipment-items]
        distinguishing_aspect: "Omitting valuation_basis and geo_tracker_installed copies the parent part's REPLACEMENT_COST basis onto the item and leaves geo_tracker_installed false, so applied_credit_bp is 0 and the item rates at 114103 rather than any credited figure."
        test_recipe:
          setup:
            - "One PUBLISHED T2_URBAN LOADER rate cell, age band 6-12, base_rate_bp 205, theft_hazard_grade B, replacement_cost_index_bp 11000."
            - "One DRAFT Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000."
            - "One ACTIVE SCHEDULED_EQUIPMENT CoveragePart whose valuation_basis is REPLACEMENT_COST."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "LOADER", territory_code: "T2_URBAN", age_band_min_years: 6, age_band_max_years: 12, base_rate_bp: 205, theft_hazard_grade: "B", replacement_cost_index_bp: 11000 }
              as: Actuary
              captures: { rr_ldr: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_ldr}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Default Basis Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "REPLACEMENT_COST", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "E4 loader", equipment_type: "LOADER", model_year: 2016, original_cost_cents: 4000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { item_e4: $.data.id }
          assert:
            - "trigger HTTP status == 201"
            - "EquipmentItem.${item_e4}.valuation_basis == REPLACEMENT_COST (copied from the parent part)"
            - "EquipmentItem.${item_e4}.geo_tracker_installed == false"
            - "EquipmentItem.${item_e4}.age_years_at_rating == 10"
            - "EquipmentItem.${item_e4}.insured_value_cents == 4400000 (replacement_cost_index_bp 11000, no depreciation on the replacement-cost branch)"
            - "EquipmentItem.${item_e4}.applied_credit_bp == 0"
            - "EquipmentItem.${item_e4}.rated_premium_cents == 114103"
            - "EquipmentItem.${item_e4}.status == RATED and removed_at is null"

      - name: corner_equipment_item_computed_fields_derive_from_rate_cell
        claim_type: Computed Fields
        grounds:
          - entities.EquipmentItem.fields.age_years_at_rating
          - entities.EquipmentItem.fields.insured_value_cents
          - entities.EquipmentItem.fields.applied_base_rate_bp
          - entities.EquipmentItem.fields.applied_rate_rule_id
          - calculations.equipment_insured_value
        distinguishing_aspect: "The item's computed block is fully determined by the clock and the selected cell: age_years_at_rating 4, insured_value_cents 8160000, applied_base_rate_bp 180 and applied_rate_rule_id equal to the published EXCAVATOR cell - none of these are client inputs."
        test_recipe:
          setup:
            - "One PUBLISHED T2_URBAN EXCAVATOR rate cell, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One DRAFT Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, with one ACTIVE ACV SCHEDULED_EQUIPMENT CoveragePart."
            - "Logical clock at its 2026-08-01T00:00:00Z default, so calendar_year is 2026."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_exc: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_exc}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Computed Fields Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
          trigger:
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "E1 excavator", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", geo_tracker_installed: false, expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { item_e1: $.data.id }
          assert:
            - "EquipmentItem.${item_e1}.age_years_at_rating == 4"
            - "EquipmentItem.${item_e1}.insured_value_cents == 8160000 (12000000 depreciated 4 x 800 bp)"
            - "EquipmentItem.${item_e1}.applied_base_rate_bp == 180"
            - "EquipmentItem.${item_e1}.applied_rate_rule_id == ${rr_exc}"
            - "EquipmentItem.${item_e1}.applied_credit_bp == 0"
            - "EquipmentItem.${item_e1}.rated_premium_cents == 173318"
            - "EquipmentItem.${item_e1}.assigned_jobsite_id is null, so the policy territory T2_URBAN drove cell selection"
            - "CoveragePart.${cp}.rated_premium_cents == 173318 and Policy.${pol}.total_insured_value_cents == 8160000"

      - name: corner_ledger_entry_is_immutable_and_versionless
        claim_type: Immutability
        grounds:
          - entities.LedgerEntry
          - entities.LedgerEntry.fields.entry_type
          - endpoints[GET /inland-marine/policies/{id}/ledger-entries]
        distinguishing_aspect: "LedgerEntry is declared common_fields false: the bind-time INITIAL_PREMIUM row of 180251 is exposed only through list reads, carries no version field, and the scaffold declares no PATCH or DELETE endpoint for it."
        test_recipe:
          setup:
            - "One PUBLISHED T2_URBAN EXCAVATOR rate cell, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One BOUND Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, whose single ACV SCHEDULED_EQUIPMENT part rates at 173318 and whose written premium is 180251."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_exc: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_exc}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Ledger Only Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "E1 excavator", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { item_e1: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
          trigger:
            - call: "GET /inland-marine/policies/${pol}/ledger-entries"
              payload: { ledger: "PREMIUM" }
              as: Underwriter
          assert:
            - "trigger response: total_count == 1"
            - "the row has entry_type == INITIAL_PREMIUM, ledger == PREMIUM, amount_cents == 180251, effective_date == 2026-08-01"
            - "the row exposes id and created_at but NO updated_at and NO version field"
            - "no endpoint in section 1.5 mutates or deletes a LedgerEntry"
            - "Policy.${pol}.premium_balance_cents == 180251 equals the single row's amount_cents"

      - name: corner_policy_type_constraints_reject_bad_enum_and_inverted_term
        claim_type: Type Constraints
        grounds:
          - entities.Policy.fields.territory_code
          - entities.Policy.fields.expiration_date
          - validations[priority=35]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Both an out-of-enum territory_code and an expiration_date that is not strictly greater than effective_date are rejected with ERR_INVALID_REQUEST 400, so neither a bad enum nor a zero-length term ever reaches the rating engine."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Bad Territory Co", territory_code: "T9_ORBITAL", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { err_enum: $.data.error_id }
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Zero Term Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2026-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { err_term: $.data.error_id }
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Negative Minimum Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: -1 }
              as: Underwriter
              captures: { err_money: $.data.error_id }
          assert:
            - "trigger[0] HTTP status == 400 and error_id == ERR_INVALID_REQUEST"
            - "trigger[1] HTTP status == 400 and error_id == ERR_INVALID_REQUEST"
            - "trigger[2] HTTP status == 400 and error_id == ERR_INVALID_REQUEST"
            - "no Policy row is created by any of the three calls"

      - name: corner_equipment_item_parent_must_exist
        claim_type: Parent Relationships
        grounds:
          - entities.EquipmentItem.fields.coverage_part_id
          - errors[ERR_COVERAGE_PART_NOT_FOUND]
          - validations[priority=31]
        distinguishing_aspect: "Creating an equipment item under an unknown coverage-part id returns ERR_COVERAGE_PART_NOT_FOUND 404 - the parent existence check runs before the OCC version check, so a valid expected_policy_version does not rescue it."
        test_recipe:
          setup:
            - "One PUBLISHED T2_URBAN EXCAVATOR rate cell, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One DRAFT Policy whose current version has been observed."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_exc: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_exc}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Orphan Item Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
          trigger:
            - call: "POST /inland-marine/coverage-parts/00000000-0000-0000-0000-0000000000aa/equipment-items"
              payload: { description: "Orphan", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "trigger HTTP status == 404"
            - "trigger response error_id == ERR_COVERAGE_PART_NOT_FOUND"
            - "Policy.${pol}.version is unchanged at ${pol_v1}"
            - "Policy.${pol}.total_insured_value_cents == 0"

      - name: corner_hybrid_topology_claim_subject_must_belong_to_named_part
        claim_type: Parent Relationships
        grounds:
          - entities.Claim.fields.coverage_part_id
          - entities.Claim.fields.equipment_item_id
          - validations[priority=61]
          - errors[ERR_LOSS_SUBJECT_NOT_ON_PART]
        distinguishing_aspect: "The hybrid topology is enforced across the hierarchy: filing a claim that names coverage part A but an equipment item that hangs off part B returns ERR_LOSS_SUBJECT_NOT_ON_PART 422, even though both ids exist and both parts belong to the same policy."
        test_recipe:
          setup:
            - "One PUBLISHED T2_URBAN EXCAVATOR rate cell, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One IN_FORCE Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, with two ACTIVE ACV SCHEDULED_EQUIPMENT parts A and B."
            - "One ACTIVE EquipmentItem on part B only; part A holds no items."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_exc: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_exc}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Cross Part Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp_a: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp_b: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp_b}/equipment-items"
              payload: { description: "B-side excavator", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { item_b: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/equipment-items/${item_b}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /inland-marine/policies/${pol}/claims"
              payload: { coverage_part_id: "${cp_a}", loss_date: "2026-08-10", loss_type: "THEFT", equipment_item_id: "${item_b}" }
              as: Underwriter
              captures: { err: $.data.error_id }
            - call: "POST /inland-marine/policies/${pol}/claims"
              payload: { coverage_part_id: "${cp_b}", loss_date: "2026-08-10", loss_type: "THEFT", equipment_item_id: "${item_b}" }
              as: Underwriter
              captures: { clm_ok: $.data.id }
          assert:
            - "trigger[0] HTTP status == 422"
            - "trigger[0] response error_id == ERR_LOSS_SUBJECT_NOT_ON_PART"
            - "trigger[1] HTTP status == 201"
            - "Claim.${clm_ok}.coverage_part_id == ${cp_b} and equipment_item_id == ${item_b}"
            - "Claim.${clm_ok}.adjustment_status == OPEN and salvage_status == NOT_APPLICABLE"
            - "GET /inland-marine/claims?coverage_part_id=${cp_a} returns total_count == 0"

  # =========================================================================
  - section: state_machines
    instances:

      - name: corner_policy_starts_in_initial_state_draft
        claim_type: Initial State
        grounds:
          - state_machines.Policy.initial_state
          - endpoints[POST /inland-marine/policies]
        distinguishing_aspect: "A freshly created Policy is in the declared initial_state DRAFT with referral_status NOT_REQUIRED, and no lifecycle timestamp is stamped yet."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Initial State Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
          assert:
            - "trigger HTTP status == 201"
            - "Policy.${pol}.status == DRAFT"
            - "Policy.${pol}.referral_status == NOT_REQUIRED"
            - "Policy.${pol}.quoted_at is null, bound_at is null, in_force_at is null"
            - "Policy.${pol}.cancellation_reason is null and cancel_effective_date is null"

      - name: corner_policy_quote_transition_stamps_and_prices
        claim_type: Valid Transition
        grounds:
          - state_machines.Policy.DRAFT_to_QUOTED
          - calculations.policy_written_premium
          - endpoints[POST /inland-marine/policies/{id}/quote]
        distinguishing_aspect: "Quote moves DRAFT to QUOTED, stamps quoted_at from the logical clock, and writes sum_of_part_premiums_cents 173318 and written_premium_cents 180251 - and it appends NO ledger entry, because premium is only booked at bind."
        test_recipe:
          setup:
            - "One PUBLISHED T2_URBAN EXCAVATOR rate cell, age band 0-5, base_rate_bp 180, theft_hazard_grade A."
            - "One DRAFT Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, with one ACTIVE ACV SCHEDULED_EQUIPMENT part carrying one RATED item at 173318."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
              payload: { equipment_type: "EXCAVATOR", territory_code: "T2_URBAN", age_band_min_years: 0, age_band_max_years: 5, base_rate_bp: 180, theft_hazard_grade: "A" }
              as: Actuary
              captures: { rr_exc: $.data.id }
            - call: "POST /inland-marine/rate-rules/${rr_exc}/publish"
              payload: {}
              as: Actuary
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Quote Stamp Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "SCHEDULED_EQUIPMENT", valuation_basis: "ACV", rating_basis: "SCHEDULED", deductible_cents: 100000, per_item_limit_cents: 20000000, aggregate_limit_cents: 200000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "GET /inland-marine/policies/${pol}"
              payload: {}
              as: Underwriter
              captures: { pol_v1: $.data.version }
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "E1 excavator", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "OWNED", expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { item_e1: $.data.id }
          trigger:
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "GET /inland-marine/policies/${pol}/ledger-entries"
              payload: {}
              as: Underwriter
          assert:
            - "trigger[0] HTTP status == 200"
            - "Policy.${pol}.status == QUOTED"
            - "Policy.${pol}.quoted_at == 2026-08-01T00:00:00Z"
            - "Policy.${pol}.sum_of_part_premiums_cents == 173318"
            - "Policy.${pol}.written_premium_cents == 180251"
            - "Policy.${pol}.scheduled_basis_premium_cents == 180251"
            - "Policy.${pol}.total_insured_value_cents == 8160000"
            - "Policy.${pol}.referral_required == false"
            - "Policy.${pol}.premium_balance_cents == 0"
            - "trigger[1] response: total_count == 0 (quote books no ledger entry)"

      - name: corner_policy_bind_from_draft_rejected
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=40]
          - errors[ERR_POLICY_NOT_BINDABLE]
          - endpoints[POST /inland-marine/policies/{id}/bind]
        distinguishing_aspect: "Bind requires status QUOTED: called on a DRAFT policy it returns ERR_POLICY_NOT_BINDABLE 409, stamps no bound_at and books no INITIAL_PREMIUM ledger entry."
        test_recipe:
          setup:
            - "One DRAFT Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, with one ACTIVE TRANSIT part so that quoting would otherwise be possible."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Premature Bind Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "TRANSIT", valuation_basis: "ACV", aggregate_limit_cents: 200000000, transit_owned_limit_cents: 10000000, transit_hired_limit_cents: 0, catastrophe_limit_cents: 5000000 }
              as: Underwriter
              captures: { cp: $.data.id }
          trigger:
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "trigger HTTP status == 409"
            - "trigger response error_id == ERR_POLICY_NOT_BINDABLE"
            - "Policy.${pol}.status == DRAFT and bound_at is null"
            - "Policy.${pol}.written_premium_cents == 0 and premium_balance_cents == 0"
            - "GET /inland-marine/policies/${pol}/ledger-entries returns total_count == 0"

      - name: corner_policy_activate_twice_rejected
        claim_type: Idempotency
        grounds:
          - validations[priority=40]
          - errors[ERR_POLICY_NOT_ACTIVATABLE]
          - state_machines.Policy.BOUND_to_IN_FORCE
        distinguishing_aspect: "Activate is not idempotent: the second call on an already IN_FORCE policy returns ERR_POLICY_NOT_ACTIVATABLE 409 and leaves in_force_at at its first-call value rather than re-stamping it."
        test_recipe:
          setup:
            - "One IN_FORCE Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, with one ACTIVE TRANSIT part rated at 515000, activated exactly once."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Double Activate Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "TRANSIT", valuation_basis: "ACV", aggregate_limit_cents: 200000000, transit_owned_limit_cents: 10000000, transit_hired_limit_cents: 0, catastrophe_limit_cents: 5000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "trigger HTTP status == 409"
            - "trigger response error_id == ERR_POLICY_NOT_ACTIVATABLE"
            - "Policy.${pol}.status == IN_FORCE and in_force_at == 2026-08-01T00:00:00Z"
            - "CoveragePart.${cp}.rated_premium_cents == 515000 and Policy.${pol}.written_premium_cents == 535600"
            - "GET /inland-marine/policies/${pol}/ledger-entries returns total_count == 1 (still only the bind-time INITIAL_PREMIUM of 535600)"

      - name: corner_policy_cancelled_is_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Policy.terminal_states
          - validations[priority=40]
          - errors[ERR_POLICY_ALREADY_TERMINAL]
          - errors[ERR_POLICY_NOT_QUOTABLE]
          - errors[ERR_POLICY_NOT_MUTABLE]
        distinguishing_aspect: "From CANCELLED no transition is possible: a second cancel returns ERR_POLICY_ALREADY_TERMINAL 409, a re-quote returns ERR_POLICY_NOT_QUOTABLE 409, and adding a coverage part returns ERR_POLICY_NOT_MUTABLE 409 - three different error ids from one terminal state."
        test_recipe:
          setup:
            - "One IN_FORCE Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, with one ACTIVE TRANSIT part rated at 515000 and written premium 535600."
            - "Logical clock advanced to 2026-11-01T00:00:00Z."
            - "The policy has been cancelled UNDERWRITING effective 2026-11-01."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Terminal Lock Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "TRANSIT", valuation_basis: "ACV", aggregate_limit_cents: 200000000, transit_owned_limit_cents: 10000000, transit_hired_limit_cents: 0, catastrophe_limit_cents: 5000000 }
              as: Underwriter
              captures: { cp: $.data.id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: UnderwritingManager
            - call: "POST /inland-marine/policies/${pol}/cancel"
              payload: { cancellation_reason: "UNDERWRITING", cancel_effective_date: "2026-11-01" }
              as: UnderwritingManager
          trigger:
            - call: "POST /inland-marine/policies/${pol}/cancel"
              payload: { cancellation_reason: "INSURED_REQUEST", cancel_effective_date: "2026-11-15" }
              as: UnderwritingManager
              captures: { err_cancel: $.data.error_id }
            - call: "POST /inland-marine/policies/${pol}/quote"
              payload: {}
              as: Underwriter
              captures: { err_quote: $.data.error_id }
            - call: "POST /inland-marine/policies/${pol}/coverage-parts"
              payload: { part_type: "TRANSIT", valuation_basis: "ACV", aggregate_limit_cents: 100000000, transit_owned_limit_cents: 5000000, transit_hired_limit_cents: 0, catastrophe_limit_cents: 1000000 }
              as: Underwriter
              captures: { err_part: $.data.error_id }
          assert:
            - "before the triggers: Policy.${pol}.status == CANCELLED, cancellation_reason == UNDERWRITING, cancel_effective_date == 2026-11-01"
            - "trigger[0] HTTP status == 409 and error_id == ERR_POLICY_ALREADY_TERMINAL"
            - "trigger[1] HTTP status == 409 and error_id == ERR_POLICY_NOT_QUOTABLE"
            - "trigger[2] HTTP status == 409 and error_id == ERR_POLICY_NOT_MUTABLE"
            - "Policy.${pol}.cancellation_reason is still UNDERWRITING (the rejected cancel did not overwrite it)"
            - "GET /inland-marine/policies/${pol}/coverage-parts returns total_count == 1"

      - name: corner_rate_rule_publish_retires_prior_identical_cell
        claim_type: Side Effect Execution
        grounds:
          - state_machines.RateRule.DRAFT_to_PUBLISHED
          - calculations.rate_rule_selection
          - endpoints[POST /inland-marine/rate-rules/{id}/publish]
        distinguishing_aspect: "Publishing a second cell for the identical {equipment_type, territory_code, age band} RETIRES the first: the newly created item picks up applied_base_rate_bp 200 from the survivor and rates at 192576, never the retired 180."
        test_recipe:
          setup:
            - "Rate cell A: EXCAVATOR, T2_URBAN, age band 0-5, base_rate_bp 180, theft_hazard_grade A, PUBLISHED."
            - "Rate cell B: same equipment_type, territory and age band, base_rate_bp 200, theft_hazard_grade A, still DRAFT."
            - "One DRAFT Policy, T2_URBAN, 2026-08-01 to 2027-08-01, minimum_premium_cents 100000, with one ACTIVE ACV SCHEDULED_EQUIPMENT part."
          setup_api_calls:
            - call: "POST /inland-marine/rate-rules"
