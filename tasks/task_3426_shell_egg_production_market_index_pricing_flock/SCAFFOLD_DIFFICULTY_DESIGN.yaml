  - rule_id: boundary_precision_check
    instances:
      - name: posture_elevates_at_exactly_one_suspected_event
        grounds:
          - calculations.biosecurity_posture
          - endpoints.POST_/api/complexes/{id}/disease-events
        distinguishing_aspect: "Metric: open-SUSPECTED count on the complex; endpoint: POST /api/complexes/{id}/disease-events. The threshold is >= 1: zero suspected events reads NORMAL, exactly one flips to ELEVATED, and a SUSPECTED event on a region-mate complex alone does NOT elevate (region rule needs CONFIRMED)."
        test_recipe:
          setup:
            - "Two complexes in the same region: 'North Farm' and 'South Farm' (both MIDWEST), both with posture NORMAL."
          setup_api_calls:
            - *k_clock0901
            - call: "POST /api/complexes"
              payload: { name: "North Farm", region_code: "MIDWEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_n: $.data.id }
            - call: "POST /api/complexes"
              payload: { name: "South Farm", region_code: "MIDWEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_s: $.data.id }
          trigger:
            - call: "POST /api/complexes/${cx_n}/disease-events"
              payload: { pathogen: "SALMONELLA", detection_date: "2026-09-01T00:00:00Z", scope_house_ids: [] }
              as: HealthOfficial
              captures: { err_scope: $.data.error_id }
            - call: "POST /api/complexes/${cx_n}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 50000 }
              as: PlatformAdmin
              captures: { hn_id: $.data.id }
            - call: "POST /api/complexes/${cx_n}/disease-events"
              payload: { pathogen: "SALMONELLA", detection_date: "2026-09-01T00:00:00Z", scope_house_ids: ["${hn_id}"] }
              as: HealthOfficial
              captures: { ev1: $.data.id }
            - call: "GET /api/complexes/${cx_n}"
              payload: {}
              as: HealthOfficial
              captures: { posture_n: $.data.biosecurity_posture }
            - call: "GET /api/complexes/${cx_s}"
              payload: {}
              as: HealthOfficial
              captures: { posture_s: $.data.biosecurity_posture }
          assert:
            - "an empty scope_house_ids array is rejected with 400 ERR_INVALID_REQUEST (non-empty constraint) and creates no event"
            - "before the valid event: both complexes read NORMAL"
            - "after exactly one SUSPECTED event: posture_n == ELEVATED (the >= 1 threshold is met at exactly 1)"
            - "posture_s == NORMAL — a region-mate SUSPECTED event does not elevate neighbors (only CONFIRMED does)"

      - name: house_capacity_exact_fill_allowed_plus_one_rejected
        grounds:
          - validations[priority=21]
          - entities.House.fields.hen_inventory
          - endpoints.POST_/api/flocks/{id}/place
        distinguishing_aspect: "Metric: hen headcount vs capacity_hens; endpoint: POST /api/flocks/{id}/place. The comparison is <= : a placed_hen_count exactly equal to capacity is accepted, capacity + 1 is rejected with ERR_HOUSE_OVER_CAPACITY."
        test_recipe:
          setup:
            - "Complex 'Boundary Barns' with house HA (capacity 50000) holding planned flock FA of exactly 50000 pullets, and house HB (capacity 50000) holding planned flock FB of 50001 pullets; both placements due at 2026-09-01."
          setup_api_calls:
            - *k_clock0901
            - call: "POST /api/complexes"
              payload: { name: "Boundary Barns", region_code: "WEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "HA", housing_style: "CONVENTIONAL", capacity_hens: 50000 }
              as: PlatformAdmin
              captures: { ha_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "HB", housing_style: "CONVENTIONAL", capacity_hens: 50000 }
              as: PlatformAdmin
              captures: { hb_id: $.data.id }
            - call: "POST /api/houses/${ha_id}/flocks"
              payload: { flock_code: "FA", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-09-01T00:00:00Z", placed_hen_count: 50000 }
              as: ProductionPlanner
              captures: { fa_id: $.data.id }
            - call: "POST /api/houses/${hb_id}/flocks"
              payload: { flock_code: "FB", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-09-01T00:00:00Z", placed_hen_count: 50001 }
              as: ProductionPlanner
              captures: { fb_id: $.data.id }
          trigger:
            - call: "POST /api/flocks/${fa_id}/place"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/flocks/${fb_id}/place"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "FA placement succeeds: 0 + 50000 <= 50000 (exact fill allowed); House.${ha_id}.hen_inventory == 50000"
            - "FA lands in GROWING (age 0 at placement on the placement date)"
            - "FB placement fails with 422 ERR_HOUSE_OVER_CAPACITY: 0 + 50001 > 50000"
            - "Flock.${fb_id}.status stays PLANNED and House.${hb_id}.hen_inventory == 0"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: specialty_placement_requires_passed_certification
        grounds:
          - validations[priority=10]
          - state_machines.Flock.PLANNED_to_GROWING
          - state_machines.Certification.SCHEDULED_to_PASSED
        distinguishing_aspect: "Entity pair Flock x Certification: placing a CAGE_FREE flock is gated on the HOUSE's certification state — without a PASSED cert the placement is rejected; once the cert passes (validity window opens at the record clock), the identical placement succeeds."
        test_recipe:
          setup:
            - "Complex 'Specialty Gardens' with house H2 (CAGE_FREE, 80000) and planned CAGE_FREE flock F2 of 60000 pullets with placement_date 2026-09-01."
          setup_api_calls:
            - *k_clock0901
            - call: "POST /api/complexes"
              payload: { name: "Specialty Gardens", region_code: "WEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H2", housing_style: "CAGE_FREE", capacity_hens: 80000 }
              as: PlatformAdmin
              captures: { h2_id: $.data.id }
            - call: "POST /api/houses/${h2_id}/flocks"
              payload: { flock_code: "F2", program: "CAGE_FREE", ownership: "OWNED", placement_date: "2026-09-01T00:00:00Z", placed_hen_count: 60000 }
              as: ProductionPlanner
              captures: { f2_id: $.data.id }
          trigger:
            - call: "POST /api/flocks/${f2_id}/place"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "POST /api/houses/${h2_id}/certifications"
              payload: { program: "CAGE_FREE", auditor_name: "Humane Farm Auditors", scheduled_date: "2026-09-01T00:00:00Z" }
              as: QualityAuditor
              captures: { cert_id: $.data.id }
            - call: "POST /api/certifications/${cert_id}/record-result"
              payload: { result: "PASSED" }
              as: QualityAuditor
            - call: "POST /api/flocks/${f2_id}/place"
              payload: {}
              as: ProductionPlanner
          assert:
            - "first placement attempt: 422 ERR_CERTIFICATION_REQUIRED and Flock.${f2_id} stays PLANNED"
            - "Certification.${cert_id}: status PASSED, valid_from == 2026-09-01T00:00:00Z, valid_until == 2027-09-01T00:00:00Z"
            - "second placement attempt succeeds: Flock.${f2_id}.status == GROWING and House.${h2_id}.hen_inventory == 60000"

      - name: allocate_blocked_after_commitment_expires
        grounds:
          - state_machines.CustomerCommitment.ACTIVE_to_EXPIRED
          - state_machines.SalesOrder.BOOKED_to_ALLOCATED
        distinguishing_aspect: "Entity pair SalesOrder x CustomerCommitment (different pair than Flock x Certification): the allocate transition's validity depends on the commitment's state, which moved ACTIVE -> EXPIRED under the order via a run-ops auto-transition — allocation is then rejected with ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Complex with a LAYING flock of 50000 hens (capacity is NOT the constraint here)."
            - "ACTIVE commitment (CONVENTIONAL, MIDWEST, 100000/week, window [2026-09-01, 2026-09-20]) with one BOOKED order for week 2026-09-07."
            - "Logical clock advanced to 2026-09-20T12:00:00Z (past effective_to but still inside the order's ship window) and one run-ops executed: the commitment auto-expires."
          setup_api_calls:
            - *k_clock0901
            - call: "POST /api/complexes"
              payload: { name: "Prairie Gold", region_code: "MIDWEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 100000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-04-28T00:00:00Z", placed_hen_count: 50000 }
              as: ProductionPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /api/flocks/${f1_id}/place"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/customers"
              payload: { name: "Sunrise Grocers", segment: "RETAIL", credit_limit_cents: 500000000 }
              as: PlatformAdmin
              captures: { cu_id: $.data.id }
            - call: "POST /api/customers/${cu_id}/commitments"
              payload: { program: "CONVENTIONAL", region_code: "MIDWEST", weekly_dozen_committed: 100000, price_adjustment_cents_per_dozen: 0, effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-09-20T00:00:00Z" }
              as: SalesManager
              captures: { cm_id: $.data.id }
            - call: "POST /api/commitments/${cm_id}/activate"
              payload: {}
              as: SalesManager
            - call: "GET /api/commitments/${cm_id}"
              payload: {}
              as: SalesManager
              captures: { cm_v: $.data.version }
            - call: "POST /api/commitments/${cm_id}/orders"
              payload: { ship_week_start: "2026-09-07T00:00:00Z", dozen_ordered: 10000, size_class: "LARGE", expected_commitment_version: "${cm_v}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/complexes/${cx_id}/run-ops"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/orders/${ord_id}/allocate"
              payload: {}
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "precondition: CustomerCommitment.${cm_id}.status == EXPIRED after run-ops (clock 2026-09-20T12:00:00Z > effective_to 2026-09-20T00:00:00Z)"
            - "allocate returns 409 with error_id == ERR_INVALID_STATE because the parent commitment is EXPIRED"
            - "the ship-window temporal check would still pass (clock < 2026-09-07 + 14 days), isolating the cross-entity state gate"
            - "SalesOrder.${ord_id}.status stays BOOKED"

      - name: packing_rejected_while_complex_quarantined
        grounds:
          - validations[priority=9]
          - state_machines.DiseaseEvent.SUSPECTED_to_CONFIRMED
        distinguishing_aspect: "Entity pair PackingRun x Complex (third distinct pair): packing-run creation reads the complex's derived posture — a confirmation elsewhere in the complex freezes the plant even though the packing run's own fields are all valid."
        test_recipe:
          setup:
            - "Complex 'Gradeworks' with a LAYING flock of 30000 hens (age 20) and one run-ops week accrued (bucket 9916 dozen conventional)."
            - "A disease event on the flock's house is CONFIRMED, driving the complex to QUARANTINE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/complexes"
              payload: { name: "Gradeworks", region_code: "SOUTHWEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 50000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-04-07T00:00:00Z", placed_hen_count: 20000 }
              as: ProductionPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /api/flocks/${f1_id}/place"
              payload: {}
              as: ProductionPlanner
            - *k_clock0901
            - call: "POST /api/complexes/${cx_id}/run-ops"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/complexes/${cx_id}/disease-events"
              payload: { pathogen: "HPAI", detection_date: "2026-09-01T00:00:00Z", scope_house_ids: ["${h1_id}"] }
              as: HealthOfficial
              captures: { ev_id: $.data.id }
            - call: "POST /api/disease-events/${ev_id}/confirm"
              payload: {}
              as: HealthOfficial
            - call: "GET /api/complexes/${cx_id}"
              payload: {}
              as: PlantManager
              captures: { cx_v: $.data.version }
          trigger:
            - call: "POST /api/complexes/${cx_id}/packing-runs"
              payload: { program: "CONVENTIONAL", dozen_input: 3000, run_date: "2026-09-01T00:00:00Z", expected_complex_version: "${cx_v}" }
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "Complex.${cx_id}.biosecurity_posture == QUARANTINE before the packing attempt"
            - "the packing create returns 409 with error_id == ERR_COMPLEX_QUARANTINED despite a valid OCC version, a stocked bucket and a LAYING flock"
            - "GET /api/complexes/${cx_id}/packing-runs returns 0 rows and the ungraded bucket is unchanged at 9916"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: house_occupancy_half_open_adjacency
        grounds:
          - validations[priority=22]
          - entities.Flock.fields.placement_date
        distinguishing_aspect: "Interval semantics: exclusive half-open occupancy on a House — a new flock's window [placement_date, placement_date + 560 days) colliding by one day is rejected, but a window starting exactly at the predecessor's end (2028-03-14) is accepted."
        test_recipe:
          setup:
            - "Complex 'Occupancy House' with house H1 (CONVENTIONAL, 200000) holding planned flock FA with placement_date 2026-09-01 (window [2026-09-01, 2028-03-14))."
          setup_api_calls:
            - *k_clock0901
            - call: "POST /api/complexes"
              payload: { name: "Occupancy House", region_code: "WEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 200000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "FA", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-09-01T00:00:00Z", placed_hen_count: 90000 }
              as: ProductionPlanner
              captures: { fa_id: $.data.id }
          trigger:
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "FB", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2028-03-13T00:00:00Z", placed_hen_count: 90000 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "FC", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2028-03-14T00:00:00Z", placed_hen_count: 90000 }
              as: ProductionPlanner
              captures: { fc_id: $.data.id }
          assert:
            - "FB (start 2028-03-13, one day inside FA's window) is rejected with 409 ERR_HOUSE_OCCUPANCY_CONFLICT"
            - "FC (start 2028-03-14, exactly FA's window end) is created 201 with status PLANNED — adjacency is allowed under half-open semantics"
            - "GET /api/houses/${h1_id}/flocks returns exactly 2 rows (FA and FC)"

      - name: mill_receiving_aggregate_daily_capacity
        grounds:
          - validations[priority=23]
          - entities.Complex.fields.mill_receiving_tons_per_day
        distinguishing_aspect: "Different interval semantics on a different resource (the Complex mill, not a House): overlapping delivery windows are ALLOWED while aggregate daily load (ceil of each contract's tons spread evenly over its window) stays within 100 tons/day — the third contract is rejected only because the overlap pushes the peak day to 120."
        test_recipe:
          setup:
            - "Complex 'Mill Central' with mill_receiving_tons_per_day 100."
            - "Contract C1: CORN 350 tons over [2026-09-01, 2026-09-08) -> daily 50. Contract C2: SOYBEAN_MEAL 280 tons over [2026-09-04, 2026-09-11) -> daily 40. Overlap peak 90 <= 100, both accepted."
          setup_api_calls:
            - *k_clock0901
            - call: "POST /api/complexes"
              payload: { name: "Mill Central", region_code: "MIDWEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/feed-contracts"
              payload: { complex_id: "${cx_id}", commodity: "CORN", total_tons: 350, basis_cents_per_ton: 2000, spot_reference_cents_per_ton: 17000, delivery_start: "2026-09-01T00:00:00Z", delivery_end: "2026-09-08T00:00:00Z" }
              as: ProcurementLead
              captures: { c1_id: $.data.id }
            - call: "POST /api/feed-contracts"
              payload: { complex_id: "${cx_id}", commodity: "SOYBEAN_MEAL", total_tons: 280, basis_cents_per_ton: 3000, spot_reference_cents_per_ton: 34000, delivery_start: "2026-09-04T00:00:00Z", delivery_end: "2026-09-11T00:00:00Z" }
              as: ProcurementLead
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /api/feed-contracts"
              payload: { complex_id: "${cx_id}", commodity: "CORN", total_tons: 210, basis_cents_per_ton: 2100, spot_reference_cents_per_ton: 17100, delivery_start: "2026-09-05T00:00:00Z", delivery_end: "2026-09-12T00:00:00Z" }
              as: ProcurementLead
              captures: { err: $.data.error_id }
          assert:
            - "C1 and C2 coexist despite overlapping windows — aggregate capacity semantics, not exclusive occupancy"
            - "C3 (daily 30) is rejected with 422 ERR_MILL_RECEIVING_CAPACITY_EXCEEDED: 2026-09-05..07 would carry 50 + 40 + 30 = 120 > 100"
            - "GET /api/complexes/${cx_id}/feed-contracts returns exactly 2 rows"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: place_then_depopulate_restores_house_hen_inventory
        grounds:
          - entities.House.fields.hen_inventory
          - state_machines.Flock.PLANNED_to_GROWING
          - state_machines.DepopulationOrder.ISSUED_to_COMPLETED
        distinguishing_aspect: "Conserved quantity: the house's live hen inventory. The forward action (place: +10000) paired with its compensating action (depopulation complete: -10000) returns hen_inventory to the pre-placement value 0 — hen_inventory == sum of current_hen_count over {GROWING, LAYING, MOLT} flocks holds at every step."
        test_recipe:
          setup:
            - "Complex 'Biosecure Unit' with house H1 (capacity 50000), hen_inventory 0, and LAYING flock F1 of 10000 hens placed at 2026-09-01."
          setup_api_calls:
            - *k_clock0901
            - call: "POST /api/complexes"
              payload: { name: "Biosecure Unit", region_code: "NORTHEAST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 50000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-09-01T00:00:00Z", placed_hen_count: 10000 }
              as: ProductionPlanner
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /api/flocks/${f1_id}/place"
              payload: {}
              as: ProductionPlanner
            - call: "GET /api/houses/${h1_id}"
              payload: {}
              as: HealthOfficial
              captures: { inv_after_place: $.data.hen_inventory }
            - call: "POST /api/complexes/${cx_id}/disease-events"
              payload: { pathogen: "HPAI", detection_date: "2026-09-01T00:00:00Z", scope_house_ids: ["${h1_id}"] }
              as: HealthOfficial
              captures: { ev_id: $.data.id }
            - call: "POST /api/disease-events/${ev_id}/confirm"
              payload: {}
              as: HealthOfficial
            - call: "POST /api/disease-events/${ev_id}/depopulation-orders"
              payload: { house_id: "${h1_id}", disposal_method: "BURIAL" }
              as: HealthOfficial
              captures: { dp_id: $.data.id }
            - call: "POST /api/depopulation-orders/${dp_id}/complete"
              payload: {}
              as: HealthOfficial
          assert:
            - "inv_after_place == 10000 (place credited the house)"
            - "after depopulation completes: Flock.${f1_id}.status == DEPOPULATED with current_hen_count == 0"
            - "House.${h1_id}.hen_inventory == 0 — exactly the pre-placement baseline; the forward/compensating pair conserved the invariant"
            - "House.${h1_id}.downtime_until == 2026-09-29T00:00:00Z (clock 2026-09-01 + BURIAL 28 days, no regional bonus)"

      - name: allocate_then_cancel_restores_week_capacity
        grounds:
          - calculations.order_allocation_capacity
          - state_machines.SalesOrder.ALLOCATED_to_CANCELLED
        distinguishing_aspect: "Conserved quantity: the complex's week-allocated dozen against the projection (a capacity quantity, not a hen count). Allocate (-10000) followed by its compensating cancel (+10000) restores the pool exactly — observable because a 15000-dozen order that blocked between the two actions allocates cleanly after them."
        test_recipe:
          setup:
            - "Complex 'Prairie Gold' (MIDWEST) with LAYING flock of 50000 hens at age 18 (projection 24791 dozen for week 2026-09-07)."
            - "ACTIVE commitment (100000/week, adjustment 0) with order A (10000 dozen) and order B (15000 dozen), both BOOKED for week 2026-09-07."
            - "Order A ALLOCATED (pool 24791 - 10000 = 14791); order B's first allocate BLOCKS (14791 < 15000)."
          setup_api_calls:
            - *k_clock0901
            - call: "POST /api/complexes"
              payload: { name: "Prairie Gold", region_code: "MIDWEST", mill_receiving_tons_per_day: 100 }
              as: PlatformAdmin
              captures: { cx_id: $.data.id }
            - call: "POST /api/complexes/${cx_id}/houses"
              payload: { house_code: "H1", housing_style: "CONVENTIONAL", capacity_hens: 100000 }
              as: PlatformAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /api/houses/${h1_id}/flocks"
              payload: { flock_code: "F1", program: "CONVENTIONAL", ownership: "OWNED", placement_date: "2026-04-28T00:00:00Z", placed_hen_count: 50000 }
              as: ProductionPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /api/flocks/${f1_id}/place"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/customers"
              payload: { name: "Sunrise Grocers", segment: "RETAIL", credit_limit_cents: 500000000 }
              as: PlatformAdmin
              captures: { cu_id: $.data.id }
            - call: "POST /api/customers/${cu_id}/commitments"
              payload: { program: "CONVENTIONAL", region_code: "MIDWEST", weekly_dozen_committed: 100000, price_adjustment_cents_per_dozen: 0, effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-03-01T00:00:00Z" }
              as: SalesManager
              captures: { cm_id: $.data.id }
            - call: "POST /api/commitments/${cm_id}/activate"
              payload: {}
              as: SalesManager
            - call: "GET /api/commitments/${cm_id}"
              payload: {}
              as: SalesManager
              captures: { cm_v1: $.data.version }
            - call: "POST /api/commitments/${cm_id}/orders"
              payload: { ship_week_start: "2026-09-07T00:00:00Z", dozen_ordered: 10000, size_class: "LARGE", expected_commitment_version: "${cm_v1}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ord_a: $.data.id }
            - call: "GET /api/commitments/${cm_id}"
              payload: {}
              as: SalesManager
              captures: { cm_v2: $.data.version }
            - call: "POST /api/commitments/${cm_id}/orders"
              payload: { ship_week_start: "2026-09-07T00:00:00Z", dozen_ordered: 15000, size_class: "LARGE", expected_commitment_version: "${cm_v2}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ord_b: $.data.id }
            - call: "POST /api/orders/${ord_a}/allocate"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/orders/${ord_b}/allocate"
              payload: {}
              as: ProductionPlanner
              captures: { ord_b_mid: $.data.status }
          trigger:
            - call: "POST /api/orders/${ord_a}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cu_id}"
            - call: "POST /api/orders/${ord_b}/allocate"
              payload: {}
              as: ProductionPlanner
          assert:
            - "ord_b_mid == BLOCKED (the allocate drained the pool to 14791 < 15000 before the cancel)"
            - "after the cancel: SalesOrder.${ord_a}.status == CANCELLED"
            - "order B's retry ALLOCATES with allocated_dozen == 15000 and allocated_complex_id == ${cx_id} — the allocate/cancel pair restored the full 24791-dozen pool"
            - "CustomerCommitment.${cm_id}.blocked_order_count == 0 (the BLOCKED order left BLOCKED via the successful retry)"
