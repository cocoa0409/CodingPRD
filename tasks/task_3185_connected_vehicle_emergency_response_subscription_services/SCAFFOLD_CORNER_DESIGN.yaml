        distinguishing_aspect: "Granting INSURANCE_PROGRAM_SHARING without a GRANTED DRIVING_DATA_COLLECTION consent on the same account fails 409 ERR_CONSENT_DEPENDENCY_MISSING — validity depends on a sibling entity's state."
