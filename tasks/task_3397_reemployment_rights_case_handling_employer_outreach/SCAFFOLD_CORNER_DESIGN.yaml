  - section: validations
    instances:
      - name: service_period_create_missing_user_header_returns_unauthenticated
        claim_type: Violation -> Error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A ServiceMember call without X-User-ID fails priority 1 with 401 ERR_UNAUTHENTICATED before any other check — even though the role is valid and the payload well-formed."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer and member."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_mem
          trigger:
            - call: "POST /reemployment/service-periods"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", start_date: "2026-01-01T00:00:00Z", end_date: "2026-02-01T00:00:00Z", orders_type: "DRILL" }
              as: ServiceMember
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"
            - "GET /reemployment/members/${mem_id}/service-periods returns 0 rows"

      - name: member_role_cannot_assign_returns_unauthorized
        claim_type: Violation -> Error
        grounds:
          - validations[priority=2]
          - errors.ERR_UNAUTHORIZED_ROLE
          - endpoints.POST_/reemployment/cases/{id}/assign
        distinguishing_aspect: "assign is ProgramCoordinator-exclusive; a ServiceMember caller (even the case owner) fails priority 2 with 403 ERR_UNAUTHORIZED_ROLE, and ownership is never consulted."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer, member, one TRIAGE case, one certified ombudsman."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_omb
            - *c_tra
            - *c_trb
            - *c_trc
            - *c_cert
            - *c_mem
            - *c_case
            - *c_triage
          trigger:
            - call: "POST /reemployment/cases/${case_id}/assign"
              payload: { ombudsman_id: "${omb_id}", expected_case_version: "${case_vt}" }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED_ROLE"
            - "error_id != ERR_OWNERSHIP_VIOLATION (role is checked before ownership)"
            - "ReemploymentCase.${case_id}.status remains TRIAGE"

      - name: assign_unknown_ombudsman_beats_state_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors.ERR_OMBUDSMAN_NOT_FOUND
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Assigning to a withdrawn case with a nonexistent ombudsman_id violates both existence (priority 4) and state (priority 6); the 404 ERR_OMBUDSMAN_NOT_FOUND wins."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Employer, member, one case already CLOSED_WITHDRAWN."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_mem
            - *c_case
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "CLOSED_WITHDRAWN" }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { case_vw: $.data.version }
          trigger:
            - call: "POST /reemployment/cases/${case_id}/assign"
              payload: { ombudsman_id: "00000000-0000-4000-8000-000000000009", expected_case_version: "${case_vw}" }
              as: ProgramCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_OMBUDSMAN_NOT_FOUND"
            - "error_id != ERR_INVALID_STATE even though the case is terminal"

      - name: respond_timing_boundary_at_deadline
        claim_type: Violation -> Error
        grounds:
          - validations[priority=9]
          - errors.ERR_RESPONSE_DEADLINE_PASSED
          - state_machines.MediationRound.PROPOSED_to_EXPIRED
        distinguishing_aspect: "The deadline is inclusive: a response at exactly response_deadline succeeds (DECLINE recorded), while one second past it on a second round fails 422 ERR_RESPONSE_DEADLINE_PASSED and lazily flips that round to EXPIRED with the case back to IN_MEDIATION."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Certified ombudsman assigned; round 1 PROPOSED with deadline 2026-09-15T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_omb
            - *c_tra
            - *c_trb
            - *c_trc
            - *c_cert
            - *c_mem
            - *c_case
            - *c_triage
            - *c_assign
            - *c_round
            - call: "POST /reemployment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /reemployment/mediation-rounds/${r1_id}/respond"
              payload: { response: "DECLINE" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /reemployment/mediation-rounds"
              payload: { case_id: "${case_id}", proposal_text: "Second offer.", addressed_to: "EMPLOYER" }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { r2_id: $.data.id, r2_deadline: $.data.response_deadline }
            - call: "POST /reemployment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-29T00:00:01Z" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /reemployment/mediation-rounds/${r2_id}/respond"
              payload: { response: "ACCEPT" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { err_late: $.data.error_id }
          assert:
            - "round 1 responded at exactly its deadline succeeded (DECLINE recorded) — equality is timely"
            - "r2_deadline == 2026-09-29T00:00:00Z and the late response returns 422 err_late == ERR_RESPONSE_DEADLINE_PASSED"
            - "MediationRound.${r2_id}.status == EXPIRED after the failed response (lazy flip as side effect)"
            - "ReemploymentCase.${case_id}.status == IN_MEDIATION"

      - name: referral_window_exactly_30_days
        claim_type: Violation -> Error
        grounds:
          - validations[priority=9]
          - errors.ERR_REFERRAL_WINDOW_PASSED
          - state_machines.Referral.DRAFT_to_SUBMITTED
        distinguishing_aspect: "The 30-day referral window is inclusive at its end: submission at escalated_at + 30 days exactly succeeds; the same submission one second later fails 422 ERR_REFERRAL_WINDOW_PASSED and the referral stays DRAFT."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two cases, each escalated at 2026-09-01 with a DRAFT referral (referral A and referral B)."
          setup_api_calls:
            - *c_clock
            - *c_emp
            - *c_omb
            - *c_tra
            - *c_trb
            - *c_trc
            - *c_cert
            - *c_mem
            - *c_case
            - *c_triage
            - *c_assign
            - *c_round
            - call: "POST /reemployment/mediation-rounds/${r1_id}/respond"
              payload: { response: "DECLINE" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /reemployment/cases/${case_id}/state"
              payload: { to_status: "ESCALATION_PENDING" }
              as: Ombudsman
              as_user_id: "${omb_id}"
            - call: "POST /reemployment/referrals"
              payload: { case_id: "${case_id}", agency: "DOL_VETS", summary: "Referral A." }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { rfa_id: $.data.id }
            - call: "POST /reemployment/cases"
              payload: { member_id: "${mem_id}", employer_id: "${emp_id}", issue_type: "REEMPLOYMENT", description: "Case for referral B" }
              as: ServiceMember
              as_user_id: "${mem_id}"
              captures: { caseb_id: $.data.id }
            - call: "POST /reemployment/cases/${caseb_id}/state"
              payload: { to_status: "TRIAGE" }
              as: ProgramCoordinator
              captures: { caseb_v: $.data.version }
            - call: "POST /reemployment/cases/${caseb_id}/assign"
              payload: { ombudsman_id: "${omb_id}", expected_case_version: "${caseb_v}" }
              as: ProgramCoordinator
            - call: "POST /reemployment/mediation-rounds"
              payload: { case_id: "${caseb_id}", proposal_text: "Offer B.", addressed_to: "EMPLOYER" }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { rb1_id: $.data.id }
            - call: "POST /reemployment/mediation-rounds/${rb1_id}/respond"
              payload: { response: "DECLINE" }
              as: Employer
              as_user_id: "${emp_id}"
            - call: "POST /reemployment/cases/${caseb_id}/state"
              payload: { to_status: "ESCALATION_PENDING" }
              as: Ombudsman
              as_user_id: "${omb_id}"
            - call: "POST /reemployment/referrals"
              payload: { case_id: "${caseb_id}", agency: "DOJ_CIVIL_RIGHTS", summary: "Referral B." }
              as: Ombudsman
              as_user_id: "${omb_id}"
              captures: { rfb_id: $.data.id }
            - call: "POST /reemployment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /reemployment/referrals/${rfa_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProgramCoordinator
              captures: { suba: $.data.status }
            - call: "POST /reemployment/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:01Z" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /reemployment/referrals/${rfb_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProgramCoordinator
              captures: { err_win: $.data.error_id }
          assert:
            - "referral A submitted at exactly escalated_at + 30 days: suba == SUBMITTED (inclusive boundary)"
            - "referral B one second past the window: 422 and err_win == ERR_REFERRAL_WINDOW_PASSED"
            - "Referral.${rfb_id}.status remains DRAFT and case B remains ESCALATION_PENDING"

      - name: reopen_window_exactly_60_days
        claim_type: Violation -> Error
        grounds:
          - validations[priority=9]
          - errors.ERR_REOPEN_WINDOW_PASSED
          - state_machines.ReemploymentCase.CLOSED_UNRESOLVED_to_TRIAGE
        distinguishing_aspect: "The 60-day reopen window is inclusive: reopening at closed_at + 60 days exactly succeeds; one second later fails 422 ERR_REOPEN_WINDOW_PASSED and the case stays CLOSED_UNRESOLVED."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Two cases, each closed CLOSED_UNRESOLVED by the assigned ombudsman at 2026-09-01T00:00:00Z."
          setup_api_calls:
