# =============================================================================
# task_2347 — Foreign Supplier Verification Program
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids / 24 instances. Every numeric literal in `assert:` was computed by
# executing the §1.3 formulas with their declared constants.
# Canonical fixture (reused across instances, always rebuilt from empty DB):
#   clock 2026-09-01T00:00:00Z; importer "Northbrook Foods Import LLC"
#   (dnb 123456789 / UFI UFI-NB-0001); QI Ada Ruiz (training 2025-06-01) and
#   QI Ben Osei (training 2025-07-01), both DESIGNATED; supplier "Rio Verde SA"
#   (NO_ADVERSE_FINDINGS, APPROVED); food "Frozen mango chunks"
#   (GENERAL, non-RAC, ready_to_eat); pair P1; hazard analysis with
#   H1 13.80 / H2 4.20 / H3 17.25 (risk_total 35.25, hazard_load 31.05);
#   activities A1 ONSITE_AUDIT×1, A2 SAMPLING_AND_TESTING×2, A3 RECORDS_REVIEW×1
#   (coverage 10.00 + 12.00 + 3.00 = 25.00); pair required_coverage 40.58,
#   risk_tier MODERATE, required_annual_frequency 2, adequacy_score_planned 61.61.
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: supplier_performance_provisional_diverges_from_final_on_unattested_fail
        grounds:
          - calculations.supplier_performance_score.variants.PROVISIONAL
          - calculations.supplier_performance_score.variants.FINAL
          - entities.ForeignSupplier.fields.performance_score_provisional
          - entities.ForeignSupplier.fields.performance_score_final
          - endpoints["POST /fsvp/verification-records"]
        distinguishing_aspect: "Dual variant on the ForeignSupplier risk domain: a RECEIVED (unattested) FAIL audit moves performance_score_provisional to 10.00 while performance_score_final stays at 100.00 and performance_sample_weight_total stays 0.00, so the supplier is not suspended."
        test_recipe:
          setup:
            - "Canonical fixture through verification approval of pair P1."
            - "Clock advanced to 2026-10-20T00:00:00Z so a September audit can be filed."
            - "One ONSITE_AUDIT record with outcome FAIL and findings_count 2 is filed but NOT attested."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ben Osei", email: "ben@northbrook.example", qualification_summary: "Preventive controls qualified individual with laboratory oversight background", training_completed_at: "2025-07-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_b: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_b}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
              as: ComplianceOfficer
              captures: { sup: $.data.id }
            - call: "POST /fsvp/foreign-suppliers/${sup}/evaluation"
              payload: { decision: "APPROVE", performance_basis_note: "No adverse FDA findings and two acceptable prior audits on file" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Frozen mango chunks", fda_product_code: "20-MAN-01", is_raw_agricultural_commodity: false, intended_consumer_group: "GENERAL", ready_to_eat: true }
              as: ComplianceOfficer
              captures: { food1: $.data.id }
            - call: "POST /fsvp/supplier-food-pairs"
              payload: { importer_id: "${imp}", supplier_id: "${sup}", food_id: "${food1}", designated_qi_id: "${qi_a}" }
              as: ComplianceOfficer
              captures: { pair1: $.data.id, pair1_v: $.data.version }
            - call: "POST /fsvp/hazard-analyses"
              payload: { pair_id: "${pair1}", expected_pair_version: "${pair1_v}", methodology_note: "Codex hazard identification for frozen ready-to-eat fruit" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { ha1: $.data.id }
            - call: "POST /fsvp/hazard-analyses/${ha1}/hazards"
              payload: { hazard_type: "BIOLOGICAL", hazard_name: "Listeria monocytogenes", severity: 4, probability: 3, control_owner: "FOREIGN_SUPPLIER" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/hazard-analyses/${ha1}/hazards"
              payload: { hazard_type: "CHEMICAL_INCL_RADIOLOGICAL", hazard_name: "Pesticide residue", severity: 3, probability: 2, control_owner: "IMPORTER" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/hazard-analyses/${ha1}/hazards"
              payload: { hazard_type: "BIOLOGICAL", hazard_name: "Salmonella spp.", severity: 5, probability: 3, control_owner: "FOREIGN_SUPPLIER" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/hazard-analyses/${ha1}/approval"
              payload: { approval_note: "Hazard analysis complete for this supplier and food combination" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/verification-activities"
              payload: { pair_id: "${pair1}", activity_type: "ONSITE_AUDIT", frequency_per_year: 1, justification_text: "Annual onsite audit because a severity five biological hazard is controlled by the foreign supplier", window_start: "2026-09-10T00:00:00Z", window_end: "2026-09-20T00:00:00Z", assigned_qi_id: "${qi_a}" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { act1: $.data.id }
            - call: "POST /fsvp/verification-activities"
              payload: { pair_id: "${pair1}", activity_type: "SAMPLING_AND_TESTING", frequency_per_year: 2, justification_text: "Semiannual finished product sampling for Listeria and Salmonella at the port of entry", window_start: "2026-10-01T00:00:00Z", window_end: "2026-10-15T00:00:00Z", assigned_qi_id: "${qi_b}" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { act2: $.data.id }
            - call: "POST /fsvp/verification-activities"
              payload: { pair_id: "${pair1}", activity_type: "RECORDS_REVIEW", frequency_per_year: 1, justification_text: "Annual review of the supplier sanitation and environmental monitoring records", window_start: "2026-09-15T00:00:00Z", window_end: "2026-09-25T00:00:00Z", assigned_qi_id: "${qi_a}" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { act3: $.data.id }
            - call: "POST /fsvp/verification-activities/${act1}/review"
              payload: { decision: "APPROVE", reviewer_note: "Audit frequency and scope are adequate for the identified hazards" }
              as: QualifiedIndividual
              as_user_id: "${qi_b}"
            - call: "POST /fsvp/verification-activities/${act2}/review"
              payload: { decision: "APPROVE", reviewer_note: "Sampling plan matches the pathogen profile of the food" }
              as: QualifiedIndividual
              as_user_id: "${qi_b}"
            - call: "POST /fsvp/verification-activities/${act3}/review"
              payload: { decision: "APPROVE", reviewer_note: "Records review supports the other two activities" }
              as: QualifiedIndividual
              as_user_id: "${qi_b}"
            - call: "POST /fsvp/supplier-food-pairs/${pair1}/verification-approval"
              payload: { approval_note: "Verification activities and their frequency justification are adequate" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fsvp/verification-records"
              payload: { activity_id: "${act1}", outcome: "FAIL", performed_start: "2026-09-12T00:00:00Z", performed_end: "2026-09-14T00:00:00Z", findings_count: 2, document_reference: "AUD-2026-0912-RV" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { rec_fail: $.data.id }
          assert:
            - "VerificationRecord.${rec_fail}.record_status == RECEIVED"
            - "VerificationRecord.${rec_fail}.record_points == 10.00"
            - "VerificationRecord.${rec_fail}.weight == 3.00"
            - "ForeignSupplier.${sup}.performance_score_provisional == 10.00"
            - "ForeignSupplier.${sup}.performance_score_final == 100.00"
            - "ForeignSupplier.${sup}.performance_sample_weight_total == 0.00"
            - "ForeignSupplier.${sup}.status == APPROVED"
            - "SupplierFoodPair.${pair1}.verification_status == VERIFICATION_APPROVED"
            - "SupplierFoodPair.${pair1}.entry_eligibility_status == ELIGIBLE"

      - name: pair_adequacy_planned_diverges_from_realized_after_one_attestation
        grounds:
