            - call: "POST /challenge-course/training-records"
              payload: { facilitator_id: "${f_active_id}", kind: "REFRESHER", completed_on: "2026-07-15", hours: 8 }
              as: ProgramDirector
            - call: "POST /challenge-course/facilitators"
              payload: { course_id: "${course_id}", full_name: "Sam Ito", staff_type: "STAFF_FACILITATOR", certification_level: "LEVEL_2", cert_expires_on: "2027-06-30", is_operator_employee: true }
              as: ProgramDirector
              captures: { f_probation_id: $.data.id }
          trigger:
            - call: "GET /challenge-course/courses/${course_id}/facilitators"
              payload: { cert_status: "ACTIVE", limit: 10, offset: 0 }
              as: ProgramDirector
          assert:
            - "http_status == 200"
            - "len(response.data) == 1"
            - "response.total_count == 1"
            - "response.has_more == false"
