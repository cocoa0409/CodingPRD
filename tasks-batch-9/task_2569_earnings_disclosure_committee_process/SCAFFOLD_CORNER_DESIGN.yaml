            missing_milestone_kinds is [] even though the cycle has no CERTIFICATION milestone: §1.4
            priority 33 requires CLOSE for OPEN_CLOSE and OPEN_REVIEW, REVIEW for OPEN_CERTIFICATION and
            FILING for DECLARE_FILING_READY, so no transition of this scaffold ever requires a
            CERTIFICATION milestone and its absence is not a blocking gate. min_slack_days_* read from
            the FILING milestone alone: it is the only row left in {PLANNED, IN_PROGRESS} because CLOSE
            and REVIEW are COMPLETE, and both variants happen to agree at 1 here because
            2026-08-10 is a Monday and the only day counted.

      - name: safe_harbor_gate_fires_on_an_earnings_release_but_not_on_a_periodic_filing_with_the_same_flag
        claim_type: conditional_validation
        grounds:
          - validations[priority=23]
          - errors[ERR_SAFE_HARBOR_MISSING]
          - entities.DraftDocument.safe_harbor_present
          - state_machines.DraftDocument.IN_REVIEW_to_APPROVED
        distinguishing_aspect: |
          §1.4 priority 23 is conditional on `doc_type`, not on the flag alone. Three documents on one
          cycle carry the SAME safe_harbor_present value in two of the three cases, and the outcome is
          decided by doc_type: an EARNINGS_RELEASE with the field omitted (default false) is refused with
          ERR_SAFE_HARBOR_MISSING, a PERIODIC_FILING with the field equally omitted is APPROVED, and an
          EARNINGS_RELEASE with the flag explicitly true is APPROVED. An implementation that gates every
          document on the flag fails leg B; one that ignores doc_type and never gates fails leg A.
        test_recipe:
          setup:
            - "An adopted charter with a FINANCE and a LEGAL seat, and a FY2026-Q2 cycle in CLOSE_OPEN with a COMPLETE-eligible CLOSE milestone."
            - "No AdjustedMeasure and no QandAItem exist on any of the three documents, so measure_gate_status is NO_MEASURES and the CALL_SCRIPT-only question gate never applies."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
