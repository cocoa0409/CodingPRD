          - errors.ERR_NTE_EXHAUSTED
          - calculations.monthly_invoice_amounts
          - entities.ClientContract.fields.ytd_billed_cents
        distinguishing_aspect: |
          The not-to-exceed ceiling is annual and cumulative, and it is enforced
          at issue time: with not_to_exceed_cents 6141 the August invoice issues
          for exactly 6141 (net == remaining, so nte_capped stays false), and the
          September invoice — worth 0 on its own — cannot be issued at all because
          remaining headroom is now 0, giving 422 ERR_NTE_EXHAUSTED.
