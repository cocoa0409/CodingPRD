            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-BA", name: "BA Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 2, criticality: "HARD" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-BA-1", full_name: "BA Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "POST /compliance/campaigns", payload: { year: 2026, regulator_id: "${reg_id}", window_open_at: "2026-08-01T00:00:00Z", window_close_at: "2026-09-01T00:00:00Z", statement_version: "STMT-BA" }, as: ComplianceAdmin, captures: { camp: "$.data.id" } }
            - { call: "POST /compliance/campaigns/${camp}/open", payload: {}, as: ComplianceAdmin }
            - { call: "GET /compliance/employees/${emp}/attestations", as: ComplianceAdmin, captures: { att: "$.data[0].id" } }
          trigger:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T09:00:01Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/_sweeps/run", payload: {}, as: ComplianceAdmin }
            - { call: "POST /compliance/attestations/${att}/attest", payload: {}, as: Employee, as_user_id: "${emp}", captures: { err: "$.data.error_id" } }
            - { call: "GET /compliance/attestations/${att}", as: ComplianceAdmin, captures: { att_st: "$.data.status" } }
          assert:
            - "att_st == \"BLOCKED\" (HARD escalation cascaded)"
            - "err == \"ERR_ATTESTATION_NOT_ACTIONABLE\""

      - name: completion_review_state_gates
        claim_type: invalid_transition
        grounds:
          - "errors[ERR_COMPLETION_NOT_VOIDABLE]"
          - "errors[ERR_COMPLETION_NOT_REVIEWABLE]"
          - "state_machines.CompletionRecord"
        distinguishing_aspect: "Void requires ACCEPTED; accept requires PENDING_REVIEW: void on PENDING_REVIEW fails, accept succeeds, and a second accept on the terminal ACCEPTED record fails."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; regulator REG-RSG; curriculum CUR-RSG ACTIVE; role R-RSG with SOFT req due 30; employee E-RSG holds A with completion C1 PENDING_REVIEW (score 90)"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-RSG", name: "RSG Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/curricula", payload: { regulator_id: "${reg_id}", code: "CUR-RSG", title: "RSG Course", passing_score_pct: 80, validity_months: 12, evidence_requirement: "NONE" }, as: ComplianceAdmin, captures: { cur_id: "$.data.id", cur_v: "$.data.version" } }
            - { call: "POST /compliance/curricula/${cur_id}/versions", payload: { version_no: 1, effective_from: "2026-08-01T00:00:00Z", content_uri: "uri://rsg-v1" }, as: ComplianceAdmin }
            - { call: "PATCH /compliance/curricula/${cur_id}", payload: { status: "ACTIVE", expected_curriculum_version: "${cur_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/roles", payload: { code: "R-RSG", name: "RSG Role" }, as: ComplianceAdmin, captures: { role_id: "$.data.id" } }
            - { call: "POST /compliance/roles/${role_id}/requirements", payload: { curriculum_id: "${cur_id}", recurrence: "INITIAL_ONLY", due_in_days: 30, criticality: "SOFT" }, as: ComplianceAdmin }
            - { call: "POST /compliance/employees", payload: { employee_no: "E-RSG-1", full_name: "RSG Emp", hired_at: "2026-08-03T09:00:00Z", current_role_id: "${role_id}" }, as: HRAdmin, captures: { emp: "$.data.id" } }
            - { call: "GET /compliance/assignments", payload: { employee_id: "${emp}" }, as: ComplianceAdmin, captures: { a: "$.data[0].id" } }
            - { call: "POST /compliance/assignments/${a}/completions", payload: { score_pct: 90, evidence_type: "NONE" }, as: Employee, as_user_id: "${emp}", captures: { c1: "$.data.id" } }
          trigger:
            - { call: "POST /compliance/completions/${c1}/void", payload: { reason: "premature" }, as: ComplianceAdmin, captures: { err1: "$.data.error_id" } }
            - { call: "POST /compliance/completions/${c1}/accept", payload: {}, as: ComplianceAdmin, captures: { ok_st: "$.data.review_status" } }
            - { call: "POST /compliance/completions/${c1}/accept", payload: {}, as: ComplianceAdmin, captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == \"ERR_COMPLETION_NOT_VOIDABLE\" (PENDING_REVIEW is not voidable by admins)"
            - "ok_st == \"ACCEPTED\""
            - "err2 == \"ERR_COMPLETION_NOT_REVIEWABLE\" (ACCEPTED is terminal for review)"

      - name: campaign_state_gate_errors
        claim_type: invalid_transition
        grounds:
          - "errors[ERR_CAMPAIGN_NOT_OPEN]"
          - "errors[ERR_CAMPAIGN_NOT_DRAFT]"
          - "errors[ERR_CAMPAIGN_NOT_FINALIZABLE]"
          - "state_machines.AttestationCampaign"
        distinguishing_aspect: "The DRAFT -> OPEN -> CLOSED -> FINALIZED pipeline rejects out-of-order actions with per-state errors: close on DRAFT, re-open on OPEN, finalize on OPEN."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; regulator REG-CG; campaign CMP-CG (window 2026-08-01..2026-09-01) in DRAFT"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-CG", name: "CG Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
            - { call: "POST /compliance/campaigns", payload: { year: 2026, regulator_id: "${reg_id}", window_open_at: "2026-08-01T00:00:00Z", window_close_at: "2026-09-01T00:00:00Z", statement_version: "STMT-CG" }, as: ComplianceAdmin, captures: { camp: "$.data.id" } }
          trigger:
            - { call: "POST /compliance/campaigns/${camp}/close", payload: {}, as: ComplianceAdmin, captures: { err1: "$.data.error_id" } }
            - { call: "POST /compliance/campaigns/${camp}/open", payload: {}, as: ComplianceAdmin, captures: { st1: "$.data.status" } }
            - { call: "POST /compliance/campaigns/${camp}/open", payload: {}, as: ComplianceAdmin, captures: { err2: "$.data.error_id" } }
            - { call: "POST /compliance/campaigns/${camp}/finalize", payload: {}, as: Auditor, captures: { err3: "$.data.error_id" } }
          assert:
            - "err1 == \"ERR_CAMPAIGN_NOT_OPEN\" (close requires OPEN)"
            - "st1 == \"OPEN\""
            - "err2 == \"ERR_CAMPAIGN_NOT_DRAFT\" (re-open rejected)"
            - "err3 == \"ERR_CAMPAIGN_NOT_FINALIZABLE\" (finalize requires CLOSED)"

      - name: campaign_window_validation_at_create_and_open
        claim_type: temporal_validation
        grounds:
          - "errors[ERR_CAMPAIGN_WINDOW_INVALID]"
          - "validations[priority=8]"
          - "entities.AttestationCampaign.fields.window_close_at"
        distinguishing_aspect: "window_close_at must be strictly after window_open_at at creation, and open is only legal inside [window_open_at, window_close_at] — an early open is the same error class."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; regulator REG-WV"]
          setup_api_calls:
            - { call: "POST /compliance/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /compliance/regulators", payload: { code: "REG-WV", name: "WV Regulator", deadline_mode: "CALENDAR", recordkeeping_years: 7 }, as: ComplianceAdmin, captures: { reg_id: "$.data.id" } }
          trigger:
            - { call: "POST /compliance/campaigns", payload: { year: 2026, regulator_id: "${reg_id}", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-08-01T00:00:00Z", statement_version: "STMT-WV" }, as: ComplianceAdmin, captures: { err1: "$.data.error_id" } }
            - { call: "POST /compliance/campaigns", payload: { year: 2026, regulator_id: "${reg_id}", window_open_at: "2026-08-10T00:00:00Z", window_close_at: "2026-09-01T00:00:00Z", statement_version: "STMT-WV" }, as: ComplianceAdmin, captures: { camp2: "$.data.id" } }
            - { call: "POST /compliance/campaigns/${camp2}/open", payload: {}, as: ComplianceAdmin, captures: { err2: "$.data.error_id" } }
          assert:
            - "err1 == \"ERR_CAMPAIGN_WINDOW_INVALID\" (close <= open at creation)"
            - "err2 == \"ERR_CAMPAIGN_WINDOW_INVALID\" (now 2026-08-03 < window_open_at 2026-08-10)"

      - name: exception_decision_gates
        claim_type: invalid_transition
        grounds:
          - "errors[ERR_EXCEPTION_NOT_PENDING]"
          - "state_machines.AttestationException"
          - "state_machines.Attestation.EXCEPTION_PENDING_to_EXEMPTED"
        distinguishing_aspect: "Approve moves REQUESTED -> APPROVED and the attestation to EXEMPTED; a subsequent deny on the decided exception fails ERR_EXCEPTION_NOT_PENDING."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; regulator REG-EG; curriculum CUR-EG ACTIVE; roles R-EGM (manager M), R-EG (SOFT req due 30); employee E-EG; campaign CMP-EG OPEN; attestation ATT EXCEPTION_PENDING with exception EXC REQUESTED"]
