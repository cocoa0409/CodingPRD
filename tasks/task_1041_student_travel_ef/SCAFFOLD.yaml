    code: 200
    input: []
    output: GroupLeader
    side_effects: []

  # ---- Departure ----
  - method: POST
    path: "/departures"
    description: "Create a dated departure of a tour, assigned to a group leader. Starts DRAFT."
    roles: [Operator]
    code: 201
    input: [tour_id, group_leader_id, depart_date, return_date, enrollment_deadline, early_bird_cutoff, capacity, price_per_traveler_cents, min_to_guarantee, "chaperone_ratio?"]
    output: Departure
    side_effects: ["initializes status=DRAFT, computed counters to 0"]

  - method: GET
    path: "/departures/{id}"
    description: "Fetch one departure including computed seat-ledger fields."
    roles: [Operator, GroupLeader]
    code: 200
    input: []
    output: Departure
    side_effects: []

  - method: GET
    path: "/departures"
    description: "List departures; filter by tour_id and/or group_leader_id (FK reverse-reachability for Departure.tour_id and Departure.group_leader_id)."
    roles: [Operator, GroupLeader]
    code: 200
    input: ["tour_id?", "group_leader_id?", "limit?", "offset?"]
    output: Departure[]
    side_effects: []

  - method: GET
    path: "/departures/{id}/summary"
    description: "Leader-portal dashboard: computed roster figures including BOTH free_spot_credit variants (provisional = all non-cancelled enrollees; final = paid-in-full only)."
    roles: [Operator, GroupLeader]
    code: 200
    input: []
    output: { active_enrollment_count: integer, paid_in_full_count: integer, provisional_free_spots: integer, final_free_spots: integer, provisional_credit_cents: integer, final_credit_cents: integer, available_seats: integer }
    side_effects: []

  - method: POST
    path: "/departures/{id}/open"
    description: "DRAFT -> OPEN."
    roles: [Operator]
    code: 200
    input: []
    output: Departure
    side_effects: ["available_seats = capacity"]

  - method: POST
    path: "/departures/{id}/guarantee"
    description: "OPEN -> GUARANTEED; recompute free_spots_earned (final variant) and leader credit."
    roles: [Operator]
    code: 200
    input: []
    output: Departure
    side_effects: ["recompute free_spots_earned, available_seats, GroupLeader.free_spot_credit_cents"]

  - method: POST
    path: "/departures/{id}/depart"
    description: "GUARANTEED -> DEPARTED (clock >= depart_date); confirmed enrollments -> TRAVELING."
    roles: [Operator]
    code: 200
    input: []
    output: Departure
    side_effects: ["CONFIRMED Enrollments -> TRAVELING"]

  - method: POST
    path: "/departures/{id}/cancel"
    description: "Cancel a departure; cascades full-refund cancellation to all enrollments."
    roles: [Operator]
    code: 200
    input: ["reason?"]
    output: Departure
    side_effects: ["cascade Enrollment -> CANCELLED -> PaymentPlan REFUND_DUE -> Payment(REFUND) full; recompute derived fields"]

  - method: GET
    path: "/departures/{id}/enrollments"
    description: "List enrollments on a departure (FK reverse-reachability for Enrollment.departure_id)."
    roles: [Operator, GroupLeader]
    code: 200
    input: ["limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: GET
    path: "/departures/{id}/chaperones"
    description: "List chaperones on a departure (FK reverse-reachability for Chaperone.departure_id)."
    roles: [Operator, GroupLeader]
    code: 200
    input: ["limit?", "offset?"]
    output: Chaperone[]
    side_effects: []

  - method: GET
    path: "/departures/{id}/rooming"
    description: "List rooming assignments on a departure (FK reverse-reachability for RoomingAssignment.departure_id)."
    roles: [Operator, GroupLeader]
    code: 200
    input: ["limit?", "offset?"]
    output: RoomingAssignment[]
    side_effects: []

  - method: GET
    path: "/departures/{id}/supplier-bookings"
    description: "List supplier bookings for a departure (FK reverse-reachability for SupplierBooking.departure_id)."
    roles: [Operator]
    code: 200
    input: ["limit?", "offset?"]
    output: SupplierBooking[]
    side_effects: []

  # ---- Enrollment ----
  - method: POST
    path: "/enrollments"
    description: "Enroll a traveler on a departure; locks price via calculations.enrollment_price."
    roles: [Operator, GroupLeader]
    code: 201
    input: [departure_id, traveler_name, traveler_dob, traveler_gender, "add_ons?", "insurance_opted?", "insurance_tier?"]
    output: Enrollment
    side_effects: ["price_locked_cents computed; departure counters recomputed"]

  - method: GET
    path: "/enrollments/{id}"
    description: "Fetch one enrollment (both status axes + doc_complete)."
    roles: [Operator, GroupLeader, Traveler]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/enrollments/{id}/confirm"
    description: "PENDING -> CONFIRMED (requires departure OPEN/GUARANTEED and deposit paid)."
    roles: [Operator, GroupLeader]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: POST
    path: "/enrollments/{id}/cancel"
    description: "Cancel an enrollment; runs calculations.refund_amount (final) + refund cascade."
    roles: [Operator, GroupLeader, Traveler]
    code: 200
    input: ["reason?"]
    output: Enrollment
    side_effects: ["PaymentPlan REFUND_DUE -> Payment(REFUND)+Payment(PENALTY_RETAINED); recompute derived fields"]

  - method: POST
    path: "/enrollments/{id}/rebook"
    description: "Move a confirmed enrollment to another departure; old plan refunded in full, new enrollment created."
    roles: [Operator, GroupLeader]
    code: 200
    input: [target_departure_id]
    output: Enrollment
    side_effects: ["old Enrollment -> CANCELLED(reason=REBOOK); new Enrollment + PaymentPlan created; both departures recomputed"]

  - method: GET
    path: "/enrollments/{id}/refund-quote"
    description: "What-if refund preview for this enrollment at the current logical clock: returns BOTH calculations.refund_amount variants (provisional over price_locked_cents, final over amount_paid_cents), plus the selected tier."
    roles: [Operator, GroupLeader, Traveler]
    code: 200
    input: []
    output: { provisional_refund_cents: integer, final_refund_cents: integer, refund_pct: number, days_before: integer }
    side_effects: []

  - method: GET
    path: "/enrollments/{id}/payment-plan"
    description: "List payment plans for an enrollment (FK reverse-reachability for PaymentPlan.enrollment_id; array 0..N with at most one ACTIVE)."
    roles: [Operator, GroupLeader, Traveler]
    code: 200
    input: ["limit?", "offset?"]
    output: PaymentPlan[]
    side_effects: []

  - method: GET
    path: "/enrollments/{id}/permission-form"
    description: "List the permission form(s) for an enrollment (FK reverse-reachability for PermissionForm.enrollment_id; array 0..1)."
    roles: [Operator, GroupLeader, Traveler]
    code: 200
    input: ["limit?", "offset?"]
    output: PermissionForm[]
    side_effects: []

  # ---- PaymentPlan / Payment ----
  - method: POST
    path: "/payment-plans"
    description: "Create/replace the payment plan for an enrollment (OCC on Enrollment.version; supersedes prior ACTIVE plan)."
    roles: [Operator, GroupLeader]
    code: 201
    input: [enrollment_id, installment_count, expected_enrollment_version, "deposit_cents?"]
    output: PaymentPlan
    side_effects: ["installment_amounts via calculations.installment_split; prior ACTIVE plan -> SUPERSEDED; increments Enrollment.version by 1"]

  - method: GET
    path: "/payment-plans/{id}"
    description: "Fetch one payment plan."
    roles: [Operator, GroupLeader, Traveler]
    code: 200
    input: []
