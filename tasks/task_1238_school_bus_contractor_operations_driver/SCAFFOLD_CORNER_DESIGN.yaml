# =============================================================================
# Task 1238 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not covered by §1.8.
# List endpoints sort by created_at ASC by default, so $.data[0] is the
# first-created child. Server logical clock default: 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_district_defaults_applied
        claim_type: defaults
        grounds: ["entities.District.fields.billing_dispute_window_days", "entities.District.fields.status"]
        distinguishing_aspect: "Omitting billing_dispute_window_days applies default 30; status initialized ACTIVE; outstanding_balance_cents starts 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-ENT1", region_fuel_index_code: "WEST", credit_limit_cents: 5000000 }, as: SystemAdmin, captures: { d_id: $.data.id } }
          trigger:
            - { call: "GET /busops/districts/${d_id}", as: SystemAdmin, captures: { win: $.data.billing_dispute_window_days, st: $.data.status, ob: $.data.outstanding_balance_cents } }
          assert:
            - "${win} == 30 (default applied)"
            - "${st} == ACTIVE"
            - "${ob} == 0"
      - name: system_fields_generated_on_create
        claim_type: system_fields
        grounds: ["entities.Contract"]
        distinguishing_aspect: "Server mints UUID id without type prefix, ISO8601 created_at with millisecond precision, version starting at 1."
        test_recipe:
          setup: ["district exists"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-ENT2", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-SYS", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id, c_v: $.data.version, c_ts: $.data.created_at } }
          assert:
            - "${c_id} matches UUID format with no type prefix"
            - "${c_v} == 1"
            - "${c_ts} is ISO8601 UTC with three fractional digits"
            - "Contract.${c_id}.status == DRAFT_BID (initial state)"
      - name: get_contract_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "entities.Contract"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /busops/contracts/00000000-0000-0000-0000-000000000000", as: ContractorOps, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"
            - "HTTP status 404"
      - name: create_driver_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=1]", "errors[ERR_INVALID_REQUEST]", "entities.Driver.fields.license_number"]
        distinguishing_aspect: "Omitting required input license_number fails schema validation with ERR_INVALID_REQUEST 400 before any business rule runs."
        test_recipe:
          setup: ["district exists"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-ENT4", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "No License", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status 400"
      - name: create_route_inverted_time_range_returns_422
        claim_type: type_constraints
        grounds: ["validations[priority=11]", "errors[ERR_INVALID_TIME_RANGE]", "entities.Route.fields.am_end_minute"]
        distinguishing_aspect: "am_end_minute <= am_start_minute violates the range constraint -> ERR_INVALID_TIME_RANGE 422."
        test_recipe:
          setup: ["ACTIVE contract"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-ENT5", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-E5", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
          trigger:
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "RBAD", school_site: "Lincoln", am_start_minute: 480, am_end_minute: 480, student_count: 40 }, as: ContractorOps, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_TIME_RANGE"
            - "HTTP status 422"
      - name: immutable_training_event_has_no_update_path
        claim_type: immutability
        grounds: ["entities.TrainingEvent"]
        distinguishing_aspect: "common_fields:false event entity: response carries id and created_at but no version/updated_at, and §1.5 declares no PUT/PATCH/DELETE for it."
        test_recipe:
          setup: ["district + APPLICANT driver"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-ENT6", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D Imm", license_number: "L210", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { dr_id: $.data.id } }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "SAFETY", minutes: 60, occurred_on: "2026-04-01" }, as: HRRecruiter, captures: { te: $.data.id } }
          trigger:
            - { call: "GET /busops/training-events/${te}", as: HRRecruiter, captures: { mins: $.data.minutes } }
          assert:
            - "${mins} == 60"
            - "response has no version field and no updated_at field (append-only)"
            - "no PUT/PATCH/DELETE endpoint exists for /busops/training-events in §1.5"
      - name: computed_driver_minutes_aggregation
        claim_type: computed_fields
        grounds: ["entities.Driver.fields.behind_wheel_minutes", "entities.Driver.fields.classroom_minutes", "calculations.training_eligibility"]
        distinguishing_aspect: "behind_wheel_minutes and classroom_minutes are computed aggregates over TrainingEvent rows; SAFETY events count toward neither; client-supplied values are impossible."
        test_recipe:
          setup: ["district + driver with training events 1000 BW + 1400 BW + 1200 CLASSROOM + 300 SAFETY"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-ENT7", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D Agg", license_number: "L211", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { dr_id: $.data.id } }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "BEHIND_WHEEL", minutes: 1000, occurred_on: "2026-04-01" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "BEHIND_WHEEL", minutes: 1400, occurred_on: "2026-04-02" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "CLASSROOM", minutes: 1200, occurred_on: "2026-04-03" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "SAFETY", minutes: 300, occurred_on: "2026-04-04" }, as: HRRecruiter }
          trigger:
            - { call: "GET /busops/drivers/${dr_id}", as: HRRecruiter, captures: { bw: $.data.behind_wheel_minutes, cl: $.data.classroom_minutes } }
          assert:
            - "${bw} == 2400 (1000 + 1400)"
            - "${cl} == 1200"
            - "SAFETY 300 counted in neither aggregate"
      - name: service_day_creation_spawns_planned_assignments
        claim_type: creation
        grounds: ["entities.ServiceDay.fields.required_routes", "entities.Assignment.fields.status", "endpoints.POST /busops/service-days"]
        distinguishing_aspect: "Creating a service day over 2 ACTIVE routes materializes 2 PLANNED assignments with planned minutes copied from the routes; required_routes == 2; a SUSPENDED route is excluded."
        test_recipe:
          setup: ["ACTIVE contract; routes R1 (420-480) ACTIVE, R2 (480-540) ACTIVE, R3 SUSPENDED"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-ENT8", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-E8", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R1", school_site: "Lincoln", am_start_minute: 420, am_end_minute: 480, student_count: 40 }, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R2", school_site: "Lincoln", am_start_minute: 480, am_end_minute: 540, student_count: 30 }, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R3", school_site: "Lincoln", am_start_minute: 600, am_end_minute: 660, student_count: 20 }, as: ContractorOps, captures: { r3: $.data.id } }
            - { call: "POST /busops/routes/${r3}/deactivate", payload: {}, as: ContractorOps }
          trigger:
            - { call: "POST /busops/service-days", payload: { contract_id: "${c_id}", service_date: "2026-06-01" }, as: ContractorOps, captures: { sd: $.data.id, req: $.data.required_routes } }
            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd}" }, as: ContractorOps, captures: { a1_st: "$.data[0].status", a1_ps: "$.data[0].planned_start_minute", a2_st: "$.data[1].status" } }
          assert:
            - "${req} == 2 (SUSPENDED route excluded)"
            - "${a1_st} == PLANNED and ${a1_ps} == 420"
            - "${a2_st} == PLANNED"
            - "ServiceDay.${sd}.covered_routes == 0 and uncovered_routes == 2 and shortage_flag == true"
      - name: fk_integrity_route_unknown_contract_returns_not_found
        claim_type: parent_relationships
        grounds: ["entities.Route.fields.contract_id", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Body FK contract_id referencing a nonexistent contract is rejected with ERR_NOT_FOUND 404 (existence priority 4 covers body FKs)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /busops/routes", payload: { contract_id: "00000000-0000-0000-0000-000000000000", route_code: "RX", school_site: "Nowhere", am_start_minute: 420, am_end_minute: 480, student_count: 10 }, as: ContractorOps, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_NOT_FOUND"
            - "HTTP status 404"
      - name: list_drivers_pagination_defaults_and_offsets
        claim_type: listing
        grounds: ["response_envelope", "endpoints.GET /busops/drivers"]
        distinguishing_aspect: "Default page is limit=10/offset=0 with total_count and has_more; offset=10 returns the remaining 2 of 12 with has_more=false."
        test_recipe:
          setup: ["district with 12 drivers"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-ENT10", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D P01", license_number: "LP01", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D P02", license_number: "LP02", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D P03", license_number: "LP03", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D P04", license_number: "LP04", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D P05", license_number: "LP05", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D P06", license_number: "LP06", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D P07", license_number: "LP07", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D P08", license_number: "LP08", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D P09", license_number: "LP09", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D P10", license_number: "LP10", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D P11", license_number: "LP11", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D P12", license_number: "LP12", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter }
          trigger:
            - { call: "GET /busops/drivers", payload: { primary_district_id: "${d_id}" }, as: HRRecruiter }
            - { call: "GET /busops/drivers", payload: { primary_district_id: "${d_id}", limit: 10, offset: 10 }, as: HRRecruiter }
          assert:
            - "first page returns 10 items with total_count == 12 and has_more == true"
            - "second page (offset 10) returns 2 items with has_more == false"
            - "envelope contains meta.api_request_id and meta.api_request_timestamp"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_state_driver_applicant
        claim_type: initial_state
        grounds:
          - state_machines.Driver
        distinguishing_aspect: "A newly created driver starts in APPLICANT with zeroed aggregates and null hired_on."
        test_recipe:
          setup: ["district exists"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-SM1", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
          trigger:
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D Init", license_number: "L220", license_class: "A", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { st: $.data.status, hw: $.data.behind_wheel_minutes, hired: $.data.hired_on } }
          assert:
            - "${st} == APPLICANT"
            - "${hw} == 0"
            - "${hired} == null"
      - name: invalid_transition_complete_from_planned_returns_409
        claim_type: invalid_transition
        grounds:
          - state_machines.Assignment
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "COMPLETE is declared only from EN_ROUTE; the owning driver calling it on a CONFIRMED assignment (never started) fails with ERR_INVALID_STATE and no fields change."
        test_recipe:
          setup: ["full dispatch chain: ACTIVE contract/route, ACTIVE driver, bus; service day 2026-06-01 DISPATCH_OPEN; assignment CONFIRMED to the driver (start never called)"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-SM2", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-S2", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
            - { call: "POST /busops/contracts/${c_id}/award", payload: {}, as: DistrictAdmin, as_user_id: "${d_id}" }
            - { call: "POST /busops/contracts/${c_id}/activate", payload: {}, as: ContractorOps }
            - { call: "POST /busops/routes", payload: { contract_id: "${c_id}", route_code: "R1", school_site: "Lincoln", am_start_minute: 420, am_end_minute: 480, student_count: 40 }, as: ContractorOps }
            - { call: "POST /busops/drivers", payload: { primary_district_id: "${d_id}", full_name: "D Sm2", license_number: "L225", license_class: "B", hourly_wage_cents: 3000 }, as: HRRecruiter, captures: { dr_id: $.data.id } }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCREEN" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ENROLL" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "BEHIND_WHEEL", minutes: 2400, occurred_on: "2026-04-01" }, as: HRRecruiter }
            - { call: "POST /busops/training-events", payload: { driver_id: "${dr_id}", category: "CLASSROOM", minutes: 1200, occurred_on: "2026-04-02" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "SCHEDULE_TEST" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "CDL_B", issued_on: "2026-04-10", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "TEST_PASS" }, as: HRRecruiter }
            - { call: "POST /busops/credentials", payload: { driver_id: "${dr_id}", kind: "S_ENDORSEMENT", issued_on: "2026-04-15", expires_on: "2027-01-01" }, as: HRRecruiter }
            - { call: "POST /busops/drivers/${dr_id}/events", payload: { event_type: "ACTIVATE" }, as: HRRecruiter }
            - { call: "POST /busops/buses", payload: { district_id: "${d_id}", fleet_number: "BS2", capacity: 48, fuel_type: "DIESEL", mpg_x10: 80, next_inspection_due: "2026-12-31" }, as: FleetManager, captures: { b_id: $.data.id } }
            - { call: "POST /busops/service-days", payload: { contract_id: "${c_id}", service_date: "2026-06-01" }, as: ContractorOps, captures: { sd1: $.data.id } }
            - { call: "POST /busops/service-days/${sd1}/open-dispatch", payload: {}, as: ContractorOps }
            - { call: "GET /busops/assignments", payload: { service_day_id: "${sd1}" }, as: ContractorOps, captures: { a1: "$.data[0].id" } }
            - { call: "POST /busops/assignments/${a1}/confirm", payload: { driver_id: "${dr_id}", bus_id: "${b_id}" }, as: ContractorOps }
          trigger:
            - { call: "POST /busops/assignments/${a1}/complete", payload: { actual_start_minute: 420, actual_end_minute: 480, actual_miles: 50 }, as: Driver, as_user_id: "${dr_id}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE (CONFIRMED, not EN_ROUTE)"
            - "HTTP status 409"
            - "Assignment.${a1}.status == CONFIRMED and billable == false"
      - name: terminal_lockdown_paid_invoice_returns_409
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Invoice
          - "errors[ERR_ALREADY_TERMINAL]"
        distinguishing_aspect: "PAID is terminal: a dispute against a PAID invoice is rejected with ERR_ALREADY_TERMINAL regardless of the dispute window."
        test_recipe:
          setup: ["reconciled billed day 2026-06-01; invoice ISSUED at clock 2026-06-05 then PAID"]
          setup_api_calls:
            - { call: "POST /busops/districts", payload: { name: "D-SM3", region_fuel_index_code: "WEST", credit_limit_cents: 5000000, billing_dispute_window_days: 30 }, as: SystemAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /busops/contracts", payload: { district_id: "${d_id}", bid_reference: "BID-S3", daily_rate_per_bus_cents: 50000, school_days_per_year: 180, fuel_base_price_cents: 400, penalty_mode: "FLAT_PER_ROUTE", shortage_penalty_flat_cents: 15000, shortage_penalty_per_student_minute_cents: 25, assumed_minutes_per_missed_route: 45, monthly_cap_cents: 10000000, charter_hourly_rate_cents: 12000, charter_per_mile_cents: 250, start_date: "2026-01-01", end_date: "2026-12-31" }, as: ContractorOps, captures: { c_id: $.data.id } }
            - { call: "POST /busops/contracts/${c_id}/submit", payload: {}, as: ContractorOps }
