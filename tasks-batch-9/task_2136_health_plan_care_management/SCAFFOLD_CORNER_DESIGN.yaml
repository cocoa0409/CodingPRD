            - "Clock at its 2026-08-01T00:00:00Z default."
            - "Member with chronic_condition_count 0 and no utilization events, enrolled (status PENDING) so social needs can be attached."
            - "Four SocialNeeds in status IDENTIFIED on that enrollment."
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "SDOH Cap Program", min_risk_tier: "LOW", stratification_variant: "CONCURRENT", required_credential_levels: ["CHW"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000 }
              as: ProgramAdmin
