        claim_type: Violation → Error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_BERTH_LENGTH_EXCEEDED]"
          - "entities.Vessel.fields.loa_m"
        distinguishing_aspect: "Scheduling a window for a vessel whose loa_m=500 exceeds the berth's length_m=400 (but fits draft) -> ERR_BERTH_LENGTH_EXCEEDED (409); the draft check passes first."
        test_recipe:
          setup: ["A berth with length_m=400, draft_m=16.0; a vessel with loa_m=500, draft_m=14.0."]
          setup_api_calls:
            - call: "POST /berths"
