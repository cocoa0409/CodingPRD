          assert:
            - "the second listing returns HTTP 201 with ResaleListing.supersedes_listing_id == ${listing1_id}"
            - "the second listing has markdown_step == 1 and state == LISTED"
            - "GET /resale-listings?supersedes_listing_id=${listing1_id} returns total_count == 1 and data[0].id == ${listing2_id}"
            - "GET /resale-listings/${listing1_id} still reports supersedes_listing_id == null and state == EXPIRED"
