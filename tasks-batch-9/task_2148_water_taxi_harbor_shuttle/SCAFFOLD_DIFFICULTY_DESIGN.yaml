  # ===========================================================================
  # Rule 8 - resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: dock_berth_halfopen_window_with_turnaround_buffer_saturates_aggregate_capacity
        grounds:
          - calculations.dock_berth_overlap_count
          - validations[priority=19]
          - errors[ERR_DOCK_BERTH_CONFLICT]
          - entities.Dock.fields.berth_count
          - entities.Dock.fields.min_turnaround_minutes
        distinguishing_aspect: |
          Interval semantics 1 of 2: half-open [start, end) instants on a Dock, a 15-minute
          turnaround buffer added to both ends of both intervals, and aggregate capacity of
          berth_count = 2, so the adjacent 14:20-14:40 window is accepted while the 14:25-14:45
          window that buffered-overlaps two existing slots is rejected. The sibling instance uses
          closed-closed calendar dates with single occupancy on a Vessel.
        test_recipe:
          setup:
            - "Pier One with berth_count 2 and min_turnaround_minutes 15."
            - "One SCHEDULED trip 14:00-15:00 Ferry Landing -> Quay Two on 2026-09-12."
