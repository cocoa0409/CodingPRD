            - "The claimant's FILED 2026-08 return carries SCH_1 UNDYED_DIESEL 100.00 gallons, so the pool is exactly 100.00 gallons."
            - "A first OFF_ROAD claim of 60.00 gallons is already SUBMITTED, consuming 60.00 of the pool."
          setup_api_calls:
            - call: "POST /mft/licensees"
              payload: { legal_name: "Waterfall Fuel Supply LLC", fein: "41-4800001", license_type: "SUPPLIER", mailing_state: "MN" }
