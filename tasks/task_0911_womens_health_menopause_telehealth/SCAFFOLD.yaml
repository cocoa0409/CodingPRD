# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Patient
    description: "The patient acting on their own resources"
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /patients/{id}/intake-assessments — create intake"
      - "POST /intake-assessments/{id}/submit — submit intake"
      - "POST /visits — schedule visit"
      - "POST /visits/{id}/cancel — cancel own visit"
      - "POST /prescriptions/{id}/refills — request refill"
      - "POST /subscriptions — create subscription"
      - "POST /subscriptions/{id}/cancel — cancel subscription"
    shared_operations:
      - "POST /care-plans/{id}/messages — send care-plan message"
      - "GET (reads) across own resources"

  - name: Provider
    description: "Clinician: visits, prescriptions, labs, refills"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /intake-assessments/{id}/clear — clear flagged intake"
      - "POST /visits/{id}/complete — complete visit"
      - "POST /prescriptions — write prescription"
      - "POST /prescriptions/{id}/suspend|reactivate|discontinue"
      - "POST /prescriptions/{id}/lab-orders — order lab"
      - "POST /lab-orders/{id}/resolve — resolve lab"
      - "POST /refills/{id}/approve|deny|fulfill|reverse"
    shared_operations:
      - "POST /care-plans/{id}/messages — send care-plan message"
      - "GET (reads)"

  - name: BillingAdmin
    description: "Billing/operations: policies, charges, dunning, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /patients/{id}/insurance-policies — attach policy"
      - "POST /charges/{id}/adjudicate — adjudicate charge"
      - "POST /charges/{id}/reverse — reverse charge"
      - "POST /subscriptions/{id}/mark-past-due — dunning"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET (reads)"

  - name: CareCoordinator
    description: "Onboarding + care-plan coordination"
    identity: "opaque"
    exclusive_operations:
      - "POST /patients — register patient"
      - "POST /providers — register provider"
    shared_operations:
      - "POST /care-plans/{id}/messages — send care-plan message"
      - "GET (reads)"
