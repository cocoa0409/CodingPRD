              payload: { approved_artwork_ref: "ART-1" }
              as: ChainAdmin
              as_user_id: "${chain_id}"
            - call: "POST /chain-configurations/${cfg_id}/release"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /construction-programs"
              payload: { chain_account_id: "${chain_id}", program_code: "PRG-1", program_type: "NEW_BUILD", site_count_planned: 3 }
              as: ChainAdmin
              as_user_id: "${chain_id}"
              captures: { prog_id: $.data.id }
            - call: "POST /site-orders"
              payload: { construction_program_id: "${prog_id}", chain_configuration_id: "${cfg_id}", site_code: "SITE-1", committed_delivery_date: "2026-10-15T00:00:00Z", unit_count: 10 }
              as: ChainAdmin
              as_user_id: "${chain_id}"
              captures: { so_id: $.data.id }
            - call: "POST /build-lines"
              payload: { line_code: "LN-1", plant_code: "P1", daily_capacity_units: 20, supported_energy_types: ["ELECTRIC"] }
              as: ProductionPlanner
              captures: { line_id: $.data.id }
            - call: "POST /production-slots"
              payload: { build_line_id: "${line_id}", site_order_id: "${so_id}", window_start: "2026-09-07T00:00:00Z", window_end: "2026-09-08T00:00:00Z", units: 10 }
              as: ProductionPlanner
              captures: { slot_id: $.data.id, slot_status0: $.data.status }
            - call: "GET /site-orders/${so_id}"
              payload: {}
              as: ProductionPlanner
              captures: { fs0: $.data.fulfillment_status, cs0: $.data.commitment_status, slack0: $.data.slack_days }
          trigger:
            - call: "POST /site-orders/${so_id}/fulfillment-events"
              payload: { event: "SHIP" }
              as: ProductionPlanner
              captures: { err_early: $.data.error_id }
            - call: "POST /production-slots/${slot_id}/build-progress"
              payload: { progress: "CONFIRM" }
              as: ProductionPlanner
              captures: { slot_confirmed: $.data.status }
            - call: "GET /site-orders/${so_id}"
              payload: {}
              as: ProductionPlanner
              captures: { fs_after_confirm: $.data.fulfillment_status }
            - call: "POST /production-slots/${slot_id}/build-progress"
              payload: { progress: "START" }
              as: ProductionPlanner
              captures: { slot_in_build: $.data.status }
            - call: "POST /production-slots/${slot_id}/build-progress"
              payload: { progress: "COMPLETE" }
              as: ProductionPlanner
              captures: { slot_completed: $.data.status }
            - call: "GET /production-slots/${slot_id}"
              payload: {}
              as: ProductionPlanner
              captures: { slot_read: $.data.status }
            - call: "POST /site-orders/${so_id}/fulfillment-events"
              payload: { event: "SHIP" }
              as: ProductionPlanner
              captures: { fs_shipped: $.data.fulfillment_status, cs_shipped: $.data.commitment_status }
            - call: "POST /site-orders/${so_id}/fulfillment-events"
              payload: { event: "DELIVER" }
              as: ProductionPlanner
              captures: { fs_delivered: $.data.fulfillment_status, slack_delivered: $.data.slack_days }
            - call: "POST /site-orders/${so_id}/fulfillment-events"
              payload: { event: "DELIVER" }
              as: ProductionPlanner
              captures: { err_replay: $.data.error_id }
          assert:
            - "${slot_status0} == RESERVED"
            - "${fs0} == SCHEDULED"
            - "${cs0} == COMMITTED"
            - "${slack0} == 30"
            - "first trigger HTTP status == 409"
            - "${err_early} == ERR_PRODUCTION_STATE_INVALID"
            - "${slot_confirmed} == CONFIRMED"
            - "${fs_after_confirm} == SCHEDULED"
            - "${slot_in_build} == IN_BUILD"
            - "after the START hop SiteOrder.${so_id}.fulfillment_status == IN_BUILD"
            - "${slot_completed} == COMPLETED"
            - "${slot_read} == COMPLETED"
            - "after the COMPLETE hop SiteOrder.${so_id}.fulfillment_status == BUILT"
            - "${fs_shipped} == SHIPPED"
            - "${cs_shipped} == COMMITTED"
            - "${fs_delivered} == DELIVERED"
            - "${slack_delivered} == 30"
            - "last trigger HTTP status == 409"
            - "${err_replay} == ERR_PRODUCTION_STATE_INVALID"
            - "BuildLine.${line_id}.committed_units == 10"


  - section: errors
    instances:
      - name: every_not_found_family_answers_with_its_own_error_id
        claim_type: Errors
        grounds:
          - errors[ERR_EQUIPMENT_MODEL_NOT_FOUND]
          - errors[ERR_COMPLIANCE_RESOURCE_NOT_FOUND]
          - errors[ERR_PRODUCTION_RESOURCE_NOT_FOUND]
          - errors[ERR_CHANNEL_RESOURCE_NOT_FOUND]
          - errors[ERR_WARRANTY_CLAIM_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: "The catalog splits not-found by resource family rather than using one generic code: unknown ids on GET /equipment-models/{id}, /certification-listings/{id}, /build-lines/{id}, /service-partners/{id} and /warranty-claims/{id} return ERR_EQUIPMENT_MODEL_NOT_FOUND, ERR_COMPLIANCE_RESOURCE_NOT_FOUND, ERR_PRODUCTION_RESOURCE_NOT_FOUND, ERR_CHANNEL_RESOURCE_NOT_FOUND and ERR_WARRANTY_CLAIM_NOT_FOUND respectively, all at 404."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; an otherwise empty database, so every id used below is unknown."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /equipment-models/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { e_model: $.data.error_id }
            - call: "GET /certification-listings/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { e_listing: $.data.error_id }
            - call: "GET /build-lines/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ProductionPlanner
              captures: { e_line: $.data.error_id }
            - call: "GET /service-partners/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ChannelManager
              captures: { e_partner: $.data.error_id }
            - call: "GET /warranty-claims/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: WarrantyAdjudicator
              captures: { e_claim: $.data.error_id }
          assert:
            - "all five triggers HTTP status == 404"
            - "${e_model} == ERR_EQUIPMENT_MODEL_NOT_FOUND"
            - "${e_listing} == ERR_COMPLIANCE_RESOURCE_NOT_FOUND"
            - "${e_line} == ERR_PRODUCTION_RESOURCE_NOT_FOUND"
            - "${e_partner} == ERR_CHANNEL_RESOURCE_NOT_FOUND"
            - "${e_claim} == ERR_WARRANTY_CLAIM_NOT_FOUND"
            - "every response body carries data.error_id and data.message"

      - name: listing_revision_cap_error
        claim_type: Errors
        excluded_because:
          difficulty_instance: listing_conditions_revision_loop_reenters_submitted_and_caps_at_three
          rationale: "The §1.8 cyclic instance already walks the CONDITIONS loop to MAX_LISTING_REVISIONS and asserts ERR_LISTING_REVISION_LIMIT on the fourth submission, so no separate trigger is needed."

  - section: rbac
    instances:
      - name: a_role_outside_the_endpoints_list_is_refused_before_any_payload_check
        claim_type: exclusive_operations
        grounds:
          - roles.ProductionPlanner
          - roles.ComplianceEngineer
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Role screening at priority 2 runs before the priority-5 payload validation: a ProductionPlanner posting an EquipmentModel with a deliberately invalid category still gets ERR_ROLE_NOT_PERMITTED (403) rather than ERR_INVALID_REQUEST, and no model row is created."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "SALAMANDER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
          assert:
            - "first trigger HTTP status == 403"
            - "${err} == ERR_ROLE_NOT_PERMITTED"
            - "${err} != ERR_INVALID_REQUEST"
            - "GET /equipment-models returns total_count == 1 after both triggers"
            - "EquipmentModel.${model_id}.category == FRYER"

      - name: missing_or_unknown_role_header_is_unauthenticated_not_forbidden
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - roles
        distinguishing_aspect: "Priority 1 covers both a missing header pair and a syntactically valid but undeclared role name: both attempts on the same endpoint return ERR_UNAUTHENTICATED (401), never the 403 ERR_ROLE_NOT_PERMITTED that a declared-but-unlisted role would get."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /equipment-models"
              payload: {}
              as: "(no X-User-Role or X-User-ID headers sent)"
              captures: { err_missing: $.data.error_id }
            - call: "GET /equipment-models"
              payload: {}
              as: "(X-User-Role: FactoryIntern, a role not declared in the role list)"
              as_user_id: "intern-1"
              captures: { err_unknown: $.data.error_id }
          assert:
            - "both triggers HTTP status == 401"
            - "${err_missing} == ERR_UNAUTHENTICATED"
            - "${err_unknown} == ERR_UNAUTHENTICATED"
            - "${err_unknown} != ERR_ROLE_NOT_PERMITTED"

      - name: chain_admin_cannot_reach_another_chains_program
        claim_type: peer_roles
        grounds:
          - validations[priority=3]
          - errors[ERR_CHAIN_SCOPE_VIOLATION]
          - roles.ChainAdmin
        distinguishing_aspect: "ChainAdmin identity is entity-backed by ChainAccount.id, so the scope check at priority 3 compares X-User-ID with the owning account: CHN-2's admin creating a program for CHN-1 gets ERR_CHAIN_SCOPE_VIOLATION (403) ahead of any not-found or capacity rule, while CHN-1's own admin succeeds."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; two chain accounts CHN-1 (volume 250) and CHN-2 (volume 60), no programs yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-1", name: "Skillet Chain", contracted_unit_volume: 250 }
              as: ChannelManager
              captures: { c1: $.data.id }
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-2", name: "Griddle Group", contracted_unit_volume: 60 }
              as: ChannelManager
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /construction-programs"
              payload: { chain_account_id: "${c1}", program_code: "PRG-X", program_type: "REMODEL", site_count_planned: 2 }
              as: ChainAdmin
              as_user_id: "${c2}"
              captures: { err: $.data.error_id }
            - call: "POST /construction-programs"
              payload: { chain_account_id: "${c1}", program_code: "PRG-X", program_type: "REMODEL", site_count_planned: 2 }
              as: ChainAdmin
              as_user_id: "${c1}"
              captures: { prog_id: $.data.id, posture: $.data.commit_posture }
            - call: "GET /construction-programs/${prog_id}"
              payload: {}
              as: ChainAdmin
              as_user_id: "${c2}"
              captures: { err_read: $.data.error_id }
          assert:
            - "first trigger HTTP status == 403"
            - "${err} == ERR_CHAIN_SCOPE_VIOLATION"
            - "no ConstructionProgram row exists after the first trigger"
            - "second trigger HTTP status == 201"
            - "${posture} == ON_TRACK"
            - "third trigger HTTP status == 403"
            - "${err_read} == ERR_CHAIN_SCOPE_VIOLATION"

      - name: service_partner_user_cannot_file_under_another_partners_id
        claim_type: peer_roles
        grounds:
          - validations[priority=4]
          - errors[ERR_PARTNER_SCOPE_VIOLATION]
          - roles.ServicePartnerUser
        distinguishing_aspect: "The partner scope check reads the service_partner_id in the body as well as the target row, so SP-2's user cannot enrol a technician under SP-1: the attempt returns ERR_PARTNER_SCOPE_VIOLATION (403) at priority 4, before the priority-33 certification rule or any duplicate-code rule can fire."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one ELECTRIC model; two service partners SP-1 and SP-2, both APPLIED with FULL stocking."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /service-partners"
              payload: { partner_code: "SP-1", name: "Metro Service", region_code: "NE", parts_stocking_level: "FULL" }
              as: ChannelManager
              captures: { sp1: $.data.id }
            - call: "POST /service-partners"
              payload: { partner_code: "SP-2", name: "Harbor Service", region_code: "SE", parts_stocking_level: "FULL" }
              as: ChannelManager
              captures: { sp2: $.data.id }
          trigger:
            - call: "POST /technician-certifications"
              payload: { service_partner_id: "${sp1}", equipment_model_id: "${model_id}", technician_code: "T1", training_hours: 40 }
              as: ServicePartnerUser
              as_user_id: "${sp2}"
              captures: { err: $.data.error_id }
            - call: "GET /service-partners/${sp1}"
              payload: {}
              as: ServicePartnerUser
              as_user_id: "${sp2}"
              captures: { err_read: $.data.error_id }
            - call: "POST /technician-certifications"
              payload: { service_partner_id: "${sp1}", equipment_model_id: "${model_id}", technician_code: "T1", training_hours: 40 }
              as: ServicePartnerUser
              as_user_id: "${sp1}"
              captures: { tc_id: $.data.id, tc_status: $.data.status }
            - call: "GET /technician-certifications/${tc_id}"
              payload: {}
              as: ServicePartnerUser
              as_user_id: "${sp1}"
              captures: { own_read_status: $.data.status, own_read_hours: $.data.training_hours }
            - call: "GET /technician-certifications/${tc_id}"
              payload: {}
              as: ServicePartnerUser
              as_user_id: "${sp2}"
              captures: { err_cross_read: $.data.error_id }
          assert:
            - "first trigger HTTP status == 403"
            - "${err} == ERR_PARTNER_SCOPE_VIOLATION"
            - "second trigger HTTP status == 403"
            - "${err_read} == ERR_PARTNER_SCOPE_VIOLATION"
            - "third trigger HTTP status == 201"
            - "${tc_status} == ENROLLED"
            - "TechnicianCertification.${tc_id}.service_partner_id == ${sp1}"
            - "fourth trigger HTTP status == 200"
            - "${own_read_status} == ENROLLED"
            - "${own_read_hours} == 40"
            - "fifth trigger HTTP status == 403"
            - "${err_cross_read} == ERR_PARTNER_SCOPE_VIOLATION"

      - name: the_listing_submitter_cannot_also_record_the_agency_decision
        claim_type: Segregation of duties
        grounds:
          - validations[priority=15]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - entities.CertificationListing.submitted_by_user_id
        distinguishing_aspect: "Segregation is enforced on the X-User-ID rather than the role: a ListingReviewer who happens to be the same user id that submitted the application is refused with ERR_SEGREGATION_OF_DUTIES (409) at priority 15 -- before the priority-16 state check -- while a different reviewer id on the identical call succeeds."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ELECTRIC model FRY-900 with an AGENCY_GAMMA listing submitted by user id 'dual-hat-1' acting as ComplianceEngineer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "dual-hat-1"
              captures: { model_id: $.data.id }
            - call: "POST /certification-listings"
              payload: { equipment_model_id: "${model_id}", agency_code: "AGENCY_GAMMA", scopes: ["SANITATION", "ELECTRICAL"] }
              as: ComplianceEngineer
              as_user_id: "dual-hat-1"
              captures: { listing_id: $.data.id }
            - call: "POST /certification-listings/${listing_id}/submissions"
              payload: {}
              as: ComplianceEngineer
              as_user_id: "dual-hat-1"
              captures: { st: $.data.status, submitter: $.data.submitted_by_user_id }
          trigger:
            - call: "POST /certification-listings/${listing_id}/agency-decisions"
              payload: { decision: "ACKNOWLEDGE_REVIEW" }
              as: ListingReviewer
              as_user_id: "dual-hat-1"
              captures: { err: $.data.error_id }
            - call: "POST /certification-listings/${listing_id}/agency-decisions"
              payload: { decision: "ACKNOWLEDGE_REVIEW" }
              as: ListingReviewer
              as_user_id: "lr-1"
              captures: { st_after: $.data.status, decider: $.data.decided_by_user_id }
          assert:
            - "${st} == SUBMITTED"
            - "${submitter} == 'dual-hat-1'"
            - "first trigger HTTP status == 409"
            - "${err} == ERR_SEGREGATION_OF_DUTIES"
            - "after the first trigger CertificationListing.${listing_id}.status == SUBMITTED"
            - "second trigger HTTP status == 200"
            - "${st_after} == UNDER_REVIEW"
            - "${decider} == 'lr-1'"

      - name: shared_reads_are_open_to_every_listed_role_while_writes_stay_exclusive
        claim_type: shared_operations
        grounds:
          - endpoints["GET /equipment-models/{id}"]
          - endpoints["PATCH /equipment-models/{id}"]
          - roles.ServicePartnerUser
          - roles.WarrantyAdjudicator
        distinguishing_aspect: "GET /equipment-models/{id} is a shared operation listing ten business roles, so a ServicePartnerUser and a WarrantyAdjudicator both read the same model successfully, yet the PATCH on that same resource is exclusive to ComplianceEngineer and returns ERR_ROLE_NOT_PERMITTED for either of them."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ELECTRIC model FRY-900 at base 1850020; one ServicePartner SP-1 so the partner user has a valid identity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /service-partners"
              payload: { partner_code: "SP-1", name: "Metro Service", region_code: "NE", parts_stocking_level: "FULL" }
              as: ChannelManager
              captures: { sp_id: $.data.id }
          trigger:
            - call: "GET /equipment-models/${model_id}"
              payload: {}
              as: ServicePartnerUser
              as_user_id: "${sp_id}"
              captures: { base_partner: $.data.base_price_cents }
            - call: "GET /equipment-models/${model_id}"
              payload: {}
              as: WarrantyAdjudicator
              captures: { base_adj: $.data.base_price_cents }
            - call: "PATCH /equipment-models/${model_id}"
              payload: { base_price_cents: 1 }
              as: WarrantyAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "first two triggers HTTP status == 200"
            - "${base_partner} == 1850020"
            - "${base_adj} == 1850020"
            - "third trigger HTTP status == 403"
            - "${err} == ERR_ROLE_NOT_PERMITTED"
            - "EquipmentModel.${model_id}.base_price_cents == 1850020"
            - "EquipmentModel.${model_id}.version == 1"

  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_chain_account_version_blocks_configuration_creation_until_re_read
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[config-create-stale-chain-account]
          - validations[priority=13]
          - errors[ERR_STALE_CHAIN_ACCOUNT_VERSION]
        distinguishing_aspect: "The OCC token must match the account's current version exactly: after a PATCH moves CHN-1 from version 1 to 2, a configuration carrying expected_chain_account_version 1 is refused with ERR_STALE_CHAIN_ACCOUNT_VERSION (412) even though every other field is valid, and the retry with the re-read version 2 succeeds."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ELECTRIC model FRY-900; ChainAccount CHN-1 created at volume 250 (version 1) and then patched to add a dealer of record, moving it to version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-1", name: "Skillet Chain", contracted_unit_volume: 250 }
              as: ChannelManager
              captures: { chain_id: $.data.id, v_stale: $.data.version }
            - call: "PATCH /chain-accounts/${chain_id}"
              payload: { dealer_of_record: "Northeast Foodservice Supply" }
              as: ChannelManager
              captures: { v_fresh: $.data.version }
          trigger:
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${chain_id}", equipment_model_id: "${model_id}", config_code: "CFG-1", option_codes: [], controls_package: "STANDARD_DIAL", branding_kit: "NONE", expected_chain_account_version: "${v_stale}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { err: $.data.error_id }
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${chain_id}", equipment_model_id: "${model_id}", config_code: "CFG-1", option_codes: [], controls_package: "STANDARD_DIAL", branding_kit: "NONE", expected_chain_account_version: "${v_fresh}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { cfg_id: $.data.id, cfg_status: $.data.status, price: $.data.indicative_unit_price_cents }
          assert:
            - "${v_stale} == 1"
            - "${v_fresh} == 2"
            - "first trigger HTTP status == 412"
            - "${err} == ERR_STALE_CHAIN_ACCOUNT_VERSION"
            - "no ChainConfiguration row exists after the first trigger"
            - "second trigger HTTP status == 201"
            - "${cfg_status} == DRAFT"
            - "${price} == 1702018"
            - "ChainAccount.${chain_id}.version == 2"

      - name: stale_configuration_version_blocks_a_superseding_performance_validation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[validation-create-stale-configuration]
          - validations[priority=14]
          - errors[ERR_STALE_CONFIGURATION_VERSION]
        distinguishing_aspect: "The second OCC rule protects the supersession of validations: once the configuration's version has advanced past the value the client read, a new FRIES validation carrying the old token is refused with ERR_STALE_CONFIGURATION_VERSION (412) and the existing PASSED validation is left untouched rather than being superseded."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ELECTRIC model FRY-900; ChainAccount CHN-1 at volume 250; DRAFT configuration CFG-1 whose version is captured immediately after creation."
            - "A first FRIES PerformanceValidation is created with that token and driven to PASSED, which advances the configuration's version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-1", name: "Skillet Chain", contracted_unit_volume: 250 }
              as: ChannelManager
              captures: { chain_id: $.data.id, chain_v: $.data.version }
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${chain_id}", equipment_model_id: "${model_id}", config_code: "CFG-1", option_codes: [], controls_package: "STANDARD_DIAL", branding_kit: "NONE", expected_chain_account_version: "${chain_v}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { cfg_id: $.data.id, cfg_v_stale: $.data.version }
            - call: "POST /performance-validations"
              payload: { chain_configuration_id: "${cfg_id}", menu_item_code: "FRIES", target_throughput_units_per_hour: 60, hold_temp_target_c: 175.0, expected_chain_configuration_version: "${cfg_v_stale}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { pv1: $.data.id }
            - call: "POST /performance-validations/${pv1}/test-runs"
              payload: { units_produced: 95, minutes: 90, hold_temp_c: 175.0 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /performance-validations/${pv1}/test-runs"
              payload: { units_produced: 108, minutes: 95, hold_temp_c: 175.0 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /performance-validations/${pv1}/test-runs"
              payload: { units_produced: 102, minutes: 92, hold_temp_c: 176.0 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /performance-validations/${pv1}/conclusion"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { pv1_status: $.data.status }
            - call: "GET /chain-configurations/${cfg_id}"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { cfg_v_fresh: $.data.version }
          trigger:
            - call: "POST /performance-validations"
              payload: { chain_configuration_id: "${cfg_id}", menu_item_code: "FRIES", target_throughput_units_per_hour: 60, hold_temp_target_c: 175.0, expected_chain_configuration_version: "${cfg_v_stale}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { err: $.data.error_id }
            - call: "POST /performance-validations"
              payload: { chain_configuration_id: "${cfg_id}", menu_item_code: "FRIES", target_throughput_units_per_hour: 60, hold_temp_target_c: 175.0, expected_chain_configuration_version: "${cfg_v_fresh}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { pv2: $.data.id, pv2_status: $.data.status }
            - call: "GET /performance-validations/${pv1}"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { pv1_after: $.data.status }
          assert:
            - "${pv1_status} == PASSED"
            - "${cfg_v_fresh} > ${cfg_v_stale}"
            - "first trigger HTTP status == 412"
            - "${err} == ERR_STALE_CONFIGURATION_VERSION"
            - "after the first trigger PerformanceValidation.${pv1}.status == PASSED"
            - "second trigger HTTP status == 201"
            - "${pv2_status} == IN_PROGRESS"
            - "${pv1_after} == SUPERSEDED"

      - name: a_model_patched_after_approval_invalidates_the_pin_and_blocks_release
        claim_type: version_pinning_on_approval
        grounds:
          - validations[priority=31]
          - errors[ERR_MODEL_VERSION_PIN_STALE]
          - state_machines.ChainConfiguration["ENG_APPROVED -> RELEASED"]
          - endpoints["PATCH /equipment-models/{id}"]
        distinguishing_aspect: "pinned_model_version is frozen at APPROVE and is not refreshed by a later PATCH, so releasing a configuration whose model moved from version 2 to 3 fails with ERR_MODEL_VERSION_PIN_STALE (409) while the model stays LISTED; only a fresh ENG_REVIEW -> ENG_APPROVED cycle re-pins to 3 and lets the release stamp the firm price."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ELECTRIC model FRY-900 LISTED via AGENCY_GAMMA (the grant leaves the model at version 2); ChainAccount CHN-1 at volume 250."
            - "Configuration CFG-1 (no options, STANDARD_DIAL, branding NONE) reaches ENG_APPROVED with pinned_model_version 2 and a completed branding sign-off."
            - "The model is then patched to base 2000060, moving it to version 3, without touching the configuration."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment-models"
              payload: { model_code: "FRY-900", name: "Fryer 900", category: "FRYER", energy_type: "ELECTRIC", base_price_cents: 1850020, supported_controls_packages: ["STANDARD_DIAL"], rated_throughput_units_per_hour: 120 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { model_id: $.data.id }
            - call: "POST /certification-listings"
              payload: { equipment_model_id: "${model_id}", agency_code: "AGENCY_GAMMA", scopes: ["SANITATION", "ELECTRICAL"] }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { listing_id: $.data.id }
            - call: "POST /certification-listings/${listing_id}/submissions"
              payload: {}
              as: ComplianceEngineer
              as_user_id: "ce-1"
            - call: "POST /certification-listings/${listing_id}/agency-decisions"
              payload: { decision: "ACKNOWLEDGE_REVIEW" }
              as: ListingReviewer
              as_user_id: "lr-1"
            - call: "POST /certification-listings/${listing_id}/agency-decisions"
              payload: { decision: "GRANT" }
              as: ListingReviewer
              as_user_id: "lr-1"
            - call: "POST /chain-accounts"
              payload: { account_code: "CHN-1", name: "Skillet Chain", contracted_unit_volume: 250 }
              as: ChannelManager
              captures: { chain_id: $.data.id, chain_v: $.data.version }
            - call: "POST /chain-configurations"
              payload: { chain_account_id: "${chain_id}", equipment_model_id: "${model_id}", config_code: "CFG-1", option_codes: [], controls_package: "STANDARD_DIAL", branding_kit: "NONE", expected_chain_account_version: "${chain_v}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { cfg_id: $.data.id, cfg_v: $.data.version }
            - call: "POST /performance-validations"
              payload: { chain_configuration_id: "${cfg_id}", menu_item_code: "FRIES", target_throughput_units_per_hour: 60, hold_temp_target_c: 175.0, expected_chain_configuration_version: "${cfg_v}" }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { pv_id: $.data.id }
            - call: "POST /performance-validations/${pv_id}/test-runs"
              payload: { units_produced: 95, minutes: 90, hold_temp_c: 175.0 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /performance-validations/${pv_id}/test-runs"
              payload: { units_produced: 108, minutes: 95, hold_temp_c: 175.0 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /performance-validations/${pv_id}/test-runs"
              payload: { units_produced: 102, minutes: 92, hold_temp_c: 176.0 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /performance-validations/${pv_id}/conclusion"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /chain-configurations/${cfg_id}/submissions"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
            - call: "POST /chain-configurations/${cfg_id}/engineering-decisions"
              payload: { decision: "APPROVE" }
              as: EngineeringApprover
              as_user_id: "appr-1"
              captures: { pinned: $.data.pinned_model_version, st_appr: $.data.status }
            - call: "POST /chain-configurations/${cfg_id}/branding-signoff"
              payload: { approved_artwork_ref: "ART-1" }
              as: ChainAdmin
              as_user_id: "${chain_id}"
            - call: "PATCH /equipment-models/${model_id}"
              payload: { base_price_cents: 2000060 }
              as: ComplianceEngineer
              as_user_id: "ce-1"
              captures: { mv3: $.data.version, posture: $.data.certification_posture }
          trigger:
            - call: "POST /chain-configurations/${cfg_id}/release"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { err: $.data.error_id }
            - call: "POST /chain-configurations/${cfg_id}/engineering-decisions"
              payload: { decision: "REQUEST_REVISION", revision_note: "Re-approve against the repriced model" }
              as: EngineeringApprover
              as_user_id: "appr-1"
              captures: { err_state: $.data.error_id }
          assert:
            - "${pinned} == 2"
            - "${st_appr} == ENG_APPROVED"
            - "${mv3} == 3"
            - "${posture} == LISTED"
            - "first trigger HTTP status == 409"
            - "${err} == ERR_MODEL_VERSION_PIN_STALE"
            - "${err} != ERR_MODEL_NOT_LISTED"
            - "ChainConfiguration.${cfg_id}.status == ENG_APPROVED"
            - "ChainConfiguration.${cfg_id}.firm_unit_price_cents is null"
            - "ChainConfiguration.${cfg_id}.pinned_model_version == 2"
            - "second trigger HTTP status == 409"
            - "${err_state} == ERR_CONFIGURATION_STATE_INVALID"

      - name: suspension_cascade_chain
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: listing_suspension_cascades_six_hops_to_program_commit_posture
          rationale: "The §1.8 cascading instance already verifies the six-hop chain end to end -- listing, model posture, configuration hold, slot cancellation, build line ledger, site order and program posture -- with an assert at every hop."

      - name: reserve_ledger_reconciliation
        claim_type: derived_field_reconciliation
        excluded_because:
          difficulty_instance: build_line_committed_units_reconciles_with_active_slots_after_cancellation
          rationale: "The §1.8 reconciliation instance already asserts the derived committed_units after create, after a second slot and after a cancellation, matching the sum over non-cancelled slots each time."

      - name: firm_versus_indicative_variants
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: config_pricing_indicative_versus_firm_diverge_by_undiscounted_branding
          rationale: "The §1.8 dual-variant instance already exercises both pricing variants on one configuration and asserts the exact delta at release."

