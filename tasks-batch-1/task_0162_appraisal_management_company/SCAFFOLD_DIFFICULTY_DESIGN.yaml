  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fee_conservation_appraiser_plus_amc_equals_order_fee
        grounds:
          - calculations.fee_split_computation
          - entities.FeeSplit.fields.appraiser_fee_cents
          - entities.FeeSplit.fields.amc_fee_cents
          - entities.Order.fields.order_fee_cents
        distinguishing_aspect: |
          Conserved quantity = money: across the forward revision-penalty re-split and finalization, the named
          invariant appraiser_fee_cents + amc_fee_cents == order_fee_cents (50000) holds exactly; after one
          revision the split moves to 27500 + 22500 = 50000, no drift.
        test_recipe:
          setup:
            - "Order completed after exactly one revision round (fee 50000, share 0.60)."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Cons A", license_state: "CA", base_fee_share_pct: 0.60 }
              as: AMCCoordinator
              captures: { a_id: $.data.id }
            - call: "POST /amc/lenders"
              payload: { name: "Lender CN", approved_panel_appraiser_ids: ["${a_id}"], monthly_fee_budget_cents: 1000000 }
              as: AMCCoordinator
              captures: { l_id: $.data.id }
            - call: "POST /amc/properties"
              payload: { street_address: "30 CA St", state_code: "CA" }
              as: AMCCoordinator
              captures: { p_id: $.data.id }
            - call: "POST /amc/orders"
              payload: { lender_id: "${l_id}", property_id: "${p_id}", order_fee_cents: 50000, product_type: "URAR_1004" }
              as: AMCCoordinator
              captures: { o_id: $.data.id, o_v0: $.data.version }
            - call: "POST /amc/orders/${o_id}/assignments"
              payload: { expected_order_version: "${o_v0}" }
              as: AMCCoordinator
              captures: { asg_id: $.data.id }
            - call: "POST /amc/assignments/${asg_id}/accept"
              payload: { inspection_start: "2026-06-02T15:00:00Z", inspection_end: "2026-06-02T17:00:00Z" }
              as: Appraiser
              as_user_id: "${a_id}"
            - call: "POST /amc/assignments/${asg_id}/reports"
              payload: { opinion_of_value_cents: 500000, uad_condition_rating: "C3", uad_quality_rating: "Q4", comparable_count: 2 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /amc/reports/${rpt_id}/compliance-reviews"
              payload: {}
              as: ComplianceReviewer
              captures: { cr1_id: $.data.id }
            - call: "POST /amc/compliance-reviews/${cr1_id}/finalize"
              payload: { finding_codes: ["USPAP_1004_MIN_COMPS"] }
              as: ComplianceReviewer
            - call: "POST /amc/assignments/${asg_id}/reports"
              payload: { opinion_of_value_cents: 500000, uad_condition_rating: "C3", uad_quality_rating: "Q4", comparable_count: 4 }
              as: Appraiser
              as_user_id: "${a_id}"
              captures: { rpt2_id: $.data.id }
            - call: "POST /amc/reports/${rpt_id}/compliance-reviews"
              payload: {}
              as: ComplianceReviewer
              captures: { cr2_id: $.data.id }
            - call: "POST /amc/compliance-reviews/${cr2_id}/finalize"
              payload: {}
              as: ComplianceReviewer
          trigger:
            - call: "GET /amc/orders/${o_id}"
              payload: {}
              as: AMCCoordinator
              captures: { o_v_pre: $.data.version }
            - call: "POST /amc/orders/${o_id}/complete"
              payload: { expected_order_version: "${o_v_pre}" }
              as: AMCCoordinator
            - call: "GET /amc/orders/${o_id}/fee-split"
              payload: {}
              as: AMCCoordinator
              captures: { ap: "$.data[0].appraiser_fee_cents", amc: "$.data[0].amc_fee_cents" }
          assert:
            - "GET /amc/orders/${o_id}/fee-split [0].appraiser_fee_cents == 27500"
            - "GET /amc/orders/${o_id}/fee-split [0].amc_fee_cents == 22500"
            - "GET /amc/orders/${o_id}/fee-split [0].appraiser_fee_cents + [0].amc_fee_cents == 50000"

      - name: appraiser_load_conservation_on_cancel_compensation
        grounds:
          - entities.Appraiser.fields.active_assignment_count
          - state_machines.Assignment.ACCEPTED_to_CANCELLED
          - state_machines.Order.PLACED_to_CANCELLED
        distinguishing_aspect: |
          Different conserved quantity = active-load count: after an appraiser accepts (active_assignment_count 1)
          and the order is then cancelled (compensating cascade Assignment->CANCELLED), the invariant
          active_assignment_count == count of this appraiser's non-terminal assignments returns to 0, no drift.
        test_recipe:
          setup:
            - "Order assigned and accepted (appraiser active_assignment_count 1), order IN_PROGRESS."
          setup_api_calls:
            - call: "POST /amc/appraisers"
              payload: { full_name: "Load A", license_state: "CA", base_fee_share_pct: 0.50 }
              as: AMCCoordinator
