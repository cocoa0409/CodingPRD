              as: Partner
              as_user_id: "${pw_id}"
              captures: { rw1_id: $.data.id }
            - call: "POST /deal-registrations/${rw1_id}/submit"
              payload: {}
              as: Partner
              as_user_id: "${pw_id}"
            - call: "POST /deal-registrations/${rw1_id}/review"
              payload: { action: "START_REVIEW" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /deal-registrations/${rw1_id}/decision"
              payload: { decision: "APPROVE" }
