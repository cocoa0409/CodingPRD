# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2479 — Youth Tournament Housing & Stay-to-Play Administration
#
# Breadth walk of references/claim-extraction-guide.md against this scaffold's
# 1.1-1.7 surface. `section:` values are the guide's nine sections; `claim_type:`
# values are its per-section rows (snake_cased). Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs.
#
# SHARED SETUP CHAIN — the anchors below (&sc_*) are defined at first use and
# re-aliased throughout the file, so every instance carries a complete, literal,
# structured chain after YAML resolution. Canonical fixture values:
#   Tournament   Fall Classic 2026, 2026-09-10 -> 2026-09-13, night_count 3,
#                booking_deadline 2026-09-01T00:00:00Z, shares 0.50/0.30/0.20
#   Hotel        Host Inn Metro, total_rooms 100
#   HotelContract rate 14900, PER_ROOM_NIGHT_FLAT 900, attrition_threshold_pct 0.10,
#                penalty rate 900, cutoff_date 2026-08-20
#   RoomBlock    DOUBLE_QUEEN, 20 rooms, 2026-09-10 -> 2026-09-13,
#                release_deadline 2026-08-25  => contracted_room_nights 60,
#                threshold_room_nights 6
#   Team/Reg     Riverside FC 16U (120 mi), roster 13 players + 3 staff
#                => required_rooms_registered 6, minimum_rooms_for_compliance 4,
#                   required_room_nights 18
#   Booking      4 rooms, 2026-09-10 -> 2026-09-13 => nights 3, projected 12
#   Actualization 12 room nights => rebate_accrued_cents 10800
#   RebateInvoice invoiced_room_nights 12, invoiced_rebate_cents 10800,
#                attrition shortfall 0, total_due_cents 10800
#   Distribution gross 10800 -> admin_fee_pct 0.08, fee 864, distributable 9936,
#                organizer 4969, rights_holder 2980, destination 1987, remainder 1
# The logical clock starts at 2026-08-01T00:00:00Z in every chain.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: tournament_creation_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Tournament
          - endpoints[POST /housing/tournaments]
          - response_envelope
        distinguishing_aspect: |
          A create with every required input present must return 201 and expose all fifteen
          declared Tournament fields, with the computed ones already resolved: night_count is the
          whole-day span 3 (half-open, so the night beginning on end_date is excluded), posture
          starts at OPEN, housing_pressure at NORMAL and both contract counters at 0.
        test_recipe:
          setup:
            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - &sc_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: HousingManager
          trigger:
            - &sc_tournament
              call: "POST /housing/tournaments"
              payload: { name: "Fall Classic 2026", rights_holder_org: "USYS", destination_org: "Metro CVB", start_date: "2026-09-10", end_date: "2026-09-13", booking_deadline: "2026-09-01T00:00:00Z", stay_to_play_required: true, share_pct_organizer: 0.50, share_pct_rights_holder: 0.30, share_pct_destination: 0.20 }
              as: HousingManager
              captures: { tourn_id: "$.data.id" }
          assert:
            - "response.status == 201"
            - "Tournament.${tourn_id}.name == Fall Classic 2026"
            - "Tournament.${tourn_id}.night_count == 3"
            - "Tournament.${tourn_id}.posture == OPEN"
            - "Tournament.${tourn_id}.housing_pressure == NORMAL"
            - "Tournament.${tourn_id}.executed_contract_count == 0"
            - "Tournament.${tourn_id}.sold_out_contract_count == 0"
            - "Tournament.${tourn_id}.stay_to_play_required == true"
            - "Tournament.${tourn_id}.version == 1"

      - name: hotel_contract_retrieval_returns_stored_data
        claim_type: retrieval
        grounds:
          - entities.HotelContract
          - endpoints[GET /housing/hotel-contracts/{id}]
        distinguishing_aspect: |
          GET by id must echo the stored contract exactly, including the two rebate parameter
          fields that carry defaults: a PER_ROOM_NIGHT_FLAT contract shows
          rebate_flat_cents_per_room_night 900 and rebate_percent at its 0 default, plus
          contracted_room_nights 60 derived from the single 20-room three-night block.
        test_recipe:
          setup:
            - "One Tournament, one Hotel, one DRAFT HotelContract with one 20-room block."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - &sc_hotel
              call: "POST /housing/hotels"
              payload: { name: "Host Inn Metro", city: "Metro", total_rooms: 100, distance_miles_from_venue: 3.0 }
              as: HousingManager
              captures: { hotel_id: "$.data.id" }
            - &sc_contract
              call: "POST /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", hotel_id: "${hotel_id}", negotiated_nightly_rate_cents: 14900, rebate_model: "PER_ROOM_NIGHT_FLAT", rebate_flat_cents_per_room_night: 900, attrition_threshold_pct: 0.10, attrition_penalty_rate_cents_per_room_night: 900, cutoff_date: "2026-08-20" }
              as: HousingManager
              captures: { contract_id: "$.data.id" }
            - &sc_block
              call: "POST /housing/room-blocks"
              payload: { contract_id: "${contract_id}", room_type: "DOUBLE_QUEEN", block_size_rooms: 20, arrival_date: "2026-09-10", departure_date: "2026-09-13", release_deadline: "2026-08-25" }
              as: HousingManager
              captures: { block_id: "$.data.id" }
          trigger:
            - &sc_get_contract
              call: "GET /housing/hotel-contracts/${contract_id}"
              payload: {}
              as: HousingManager
          assert:
            - "response.status == 200"
            - "HotelContract.${contract_id}.status == DRAFT"
            - "HotelContract.${contract_id}.negotiated_nightly_rate_cents == 14900"
            - "HotelContract.${contract_id}.rebate_model == PER_ROOM_NIGHT_FLAT"
            - "HotelContract.${contract_id}.rebate_flat_cents_per_room_night == 900"
            - "HotelContract.${contract_id}.rebate_percent == 0"
            - "HotelContract.${contract_id}.contracted_room_nights == 60"
            - "HotelContract.${contract_id}.block_posture == AVAILABLE"
            - "HotelContract.${contract_id}.revision_round == 0"

      - name: hotel_contract_listing_paginates_and_filters
        claim_type: listing
        grounds:
          - endpoints[GET /housing/hotel-contracts]
          - response_envelope
        distinguishing_aspect: |
          The list route must combine the tournament_id filter, the status filter and the
          limit/offset window in one request and report the envelope's pagination block against
          the FILTERED population, not the whole table. With two contracts on the tournament and
          only one in NEGOTIATING, a status=NEGOTIATING query with limit 1 returns exactly that
          row with total_count 1 and has_more false.
        test_recipe:
          setup:
            - "One Tournament with two Hotels and two HotelContracts, each carrying one 20-room block."
            - "Contract A has been SUBMITted and is NEGOTIATING; contract B is left in DRAFT."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - &sc_submit
              call: "POST /housing/hotel-contracts/${contract_id}/negotiation"
              payload: { action: "SUBMIT" }
              as: HousingManager
            - call: "POST /housing/hotels"
              payload: { name: "Riverfront Suites", city: "Metro", total_rooms: 80, distance_miles_from_venue: 6.0 }
              as: HousingManager
              captures: { hotel2_id: "$.data.id" }
            - call: "POST /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", hotel_id: "${hotel2_id}", negotiated_nightly_rate_cents: 15900, rebate_model: "PER_ROOM_NIGHT_FLAT", rebate_flat_cents_per_room_night: 800, attrition_threshold_pct: 0.10, attrition_penalty_rate_cents_per_room_night: 800, cutoff_date: "2026-08-20" }
              as: HousingManager
              captures: { contract2_id: "$.data.id" }
          trigger:
            - call: "GET /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", status: "NEGOTIATING", limit: 1, offset: 0 }
              as: HousingManager
          assert:
            - "response.status == 200"
            - "response.pagination.total_count == 1"
            - "response.pagination.limit == 1"
            - "response.pagination.offset == 0"
            - "response.pagination.has_more == false"
            - "response.data length == 1"
            - "response.data[0].id == ${contract_id}"
            - "HotelContract.${contract2_id}.status == DRAFT"

      - name: booking_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_BOOKING_NOT_FOUND]
          - validations[priority=5]
          - endpoints[GET /housing/bookings/{id}]
        distinguishing_aspect: |
          Path-existence sits at priority 5, above every state and business rule, so a
          syntactically valid UUID that matches no Booking row must return 404
          ERR_BOOKING_NOT_FOUND rather than 400 or an empty 200 envelope.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - *sc_clock
          trigger:
            - call: "GET /housing/bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 404"
            - "response.error.error_id == ERR_BOOKING_NOT_FOUND"

      - name: team_registration_missing_required_field_is_rejected
        claim_type: required_fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=10]
          - endpoints[POST /housing/team-registrations]
        distinguishing_aspect: |
          roster_staff_count has source input and no default, so omitting it is a 400
          ERR_INVALID_REQUEST — not a silent coercion to 0. The registration must not be
          persisted, which the follow-up list query proves by returning total_count 0.
        test_recipe:
          setup:
            - "One Tournament and one Team, no registrations yet."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - &sc_team
              call: "POST /housing/teams"
              payload: { name: "Riverside FC 16U", home_city: "Farville", home_state: "ST", org_contact_email: "riverside@example.com", distance_miles_from_venue: 120.0 }
              as: HousingManager
              captures: { team_id: "$.data.id" }
          trigger:
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${team_id}", roster_player_count: 13 }
              as: HousingManager
              captures: { err: "$.data.error_id" }
            - call: "GET /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}" }
              as: HousingManager
          assert:
            - "first response.status == 400"
            - "first response.error.error_id == ERR_INVALID_REQUEST"
            - "second response.pagination.total_count == 0"

      - name: tournament_stay_to_play_default_applied_when_omitted
        claim_type: defaults
        grounds:
          - entities.Tournament.fields.stay_to_play_required
          - calculations.registration_compliance_status
          - endpoints[POST /housing/tournaments]
        distinguishing_aspect: |
          stay_to_play_required is the only input field carrying a default (true). Omitting it
          must yield true — not false and not null — which is observable a second time through
          compliance: a brand-new registration on the defaulted tournament stays PENDING_HOUSING
          instead of being short-circuited to HOUSING_COMPLIANT by the stay-to-play bypass branch.
        test_recipe:
          setup:
            - "Empty database apart from the logical clock."
          setup_api_calls:
            - *sc_clock
          trigger:
            - call: "POST /housing/tournaments"
              payload: { name: "Default Probe Cup", rights_holder_org: "USYS", destination_org: "Metro CVB", start_date: "2026-09-10", end_date: "2026-09-13", booking_deadline: "2026-09-01T00:00:00Z", share_pct_organizer: 0.50, share_pct_rights_holder: 0.30, share_pct_destination: 0.20 }
              as: HousingManager
              captures: { tourn_d_id: "$.data.id" }
            - call: "POST /housing/teams"
              payload: { name: "Default Probe FC", home_city: "Farville", home_state: "ST", org_contact_email: "probe@example.com", distance_miles_from_venue: 120.0 }
              as: HousingManager
              captures: { team_d_id: "$.data.id" }
            - call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_d_id}", team_id: "${team_d_id}", roster_player_count: 13, roster_staff_count: 3 }
              as: HousingManager
              captures: { reg_d_id: "$.data.id" }
          assert:
            - "Tournament.${tourn_d_id}.stay_to_play_required == true"
            - "TeamRegistration.${reg_d_id}.status == PENDING_HOUSING"
            - "TeamRegistration.${reg_d_id}.effective_required_rooms == 4"

      - name: registration_computed_room_requirements_are_server_derived
        claim_type: computed_fields
        grounds:
          - entities.TeamRegistration
          - calculations.roster_room_requirement
          - endpoints[POST /housing/team-registrations]
        distinguishing_aspect: |
          Every non-input field on TeamRegistration is derived from the two roster counts plus
          Tournament.night_count; none of them is client-supplied. A create that sends only
          tournament_id, team_id, roster_player_count and roster_staff_count must come back with
          all nine computed fields resolved and compliance_evaluated_at stamped from the logical
          clock, not left null.
        test_recipe:
          setup:
            - "One Tournament with night_count 3 and one Team 120 miles from the venue."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_team
          trigger:
            - &sc_registration
              call: "POST /housing/team-registrations"
              payload: { tournament_id: "${tourn_id}", team_id: "${team_id}", roster_player_count: 13, roster_staff_count: 3 }
              as: HousingManager
              captures: { reg_id: "$.data.id", reg_v1: "$.data.version" }
          assert:
            - "response.status == 201"
            - "TeamRegistration.${reg_id}.local_team_flag == false"
            - "TeamRegistration.${reg_id}.required_rooms_registered == 6"
            - "TeamRegistration.${reg_id}.required_room_nights == 18"
            - "TeamRegistration.${reg_id}.minimum_rooms_for_compliance == 4"
            - "TeamRegistration.${reg_id}.exempt_rooms_granted == 0"
            - "TeamRegistration.${reg_id}.effective_required_rooms == 4"
            - "TeamRegistration.${reg_id}.committed_rooms == 0"
            - "TeamRegistration.${reg_id}.status == PENDING_HOUSING"
            - "TeamRegistration.${reg_id}.compliance_evaluated_at == 2026-08-01T00:00:00.000Z"

      - name: booking_system_fields_minted_by_server
        claim_type: system_fields
        grounds:
          - entities.Booking
          - endpoints[POST /housing/bookings]
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-minted: a fresh booking must carry
          version 1 and a created_at equal to the logical clock, while cancelled_at — the only
          system-sourced business field — stays null until a cancel actually happens. nights and
          projected_room_nights are computed at creation from the supplied date pair.
        test_recipe:
          setup:
            - "One EXECUTED HotelContract with a 20-room block and one registration (13 players, 3 staff)."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - &sc_countersign
              call: "POST /housing/hotel-contracts/${contract_id}/negotiation"
              payload: { action: "COUNTERSIGN" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
            - *sc_team
            - *sc_registration
          trigger:
            - &sc_booking
              call: "POST /housing/bookings"
              payload: { registration_id: "${reg_id}", room_block_id: "${block_id}", rooms_requested: 4, check_in_date: "2026-09-10", check_out_date: "2026-09-13", expected_registration_version: "${reg_v1}" }
              as: HousingManager
              captures: { bk_id: "$.data.id" }
          assert:
            - "response.status == 201"
            - "Booking.${bk_id}.version == 1"
            - "Booking.${bk_id}.created_at == 2026-08-01T00:00:00.000Z"
            - "Booking.${bk_id}.updated_at == 2026-08-01T00:00:00.000Z"
            - "Booking.${bk_id}.cancelled_at == null"
            - "Booking.${bk_id}.nights == 3"
            - "Booking.${bk_id}.projected_room_nights == 12"
            - "Booking.${bk_id}.booking_status == DRAFT"
            - "Booking.${bk_id}.rebate_status == NOT_DUE"
            - "Booking.${bk_id}.penalty_cents == 0"
            - "Booking.${bk_id}.penalty_credit_cents == 0"

      - name: hotel_contract_invalid_rebate_model_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.HotelContract.fields.rebate_model
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=10]
        distinguishing_aspect: |
          rebate_model is a closed three-member enum, so an out-of-vocabulary member is a 400
          ERR_INVALID_REQUEST at priority 10 — it must NOT fall through to the priority 72
          rebate-field-coherence rule, which is a 422 and would be the wrong answer.
        test_recipe:
          setup:
            - "One Tournament and one Hotel."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
          trigger:
            - call: "POST /housing/hotel-contracts"
              payload: { tournament_id: "${tourn_id}", hotel_id: "${hotel_id}", negotiated_nightly_rate_cents: 14900, rebate_model: "MYSTERY_MODEL", attrition_threshold_pct: 0.10, attrition_penalty_rate_cents_per_room_night: 900, cutoff_date: "2026-08-20" }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 400"
            - "response.error.error_id == ERR_INVALID_REQUEST"
            - "response.error.error_id != ERR_REBATE_MODEL_FIELDS_INVALID"

      - name: rooming_list_entries_are_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.RoomingListEntry
          - state_machines.Booking (ROOMING_LIST_SUBMITTED -> ROOMING_LIST_SUBMITTED)
          - endpoints[GET /housing/bookings/{id}/rooming-list]
        distinguishing_aspect: |
          RoomingListEntry is declared common_fields false, so it carries only id and created_at
          and has no update route: a replacement submission does not mutate rows, it deletes the
          four existing rows and creates four new ones. The proof is that after resubmitting with
          different occupant counts the collection still has exactly 4 rows and the new
          occupant_count values are visible with no version field anywhere in the payload.
        test_recipe:
          setup:
            - "One DRAFT booking for 4 rooms whose rooming list has already been submitted once with 4 occupants per room."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - &sc_rooming
              call: "POST /housing/bookings/${bk_id}/rooming-list"
              payload:
                entries:
                  - { room_index: 1, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 2, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 3, occupant_count: 4, minor_occupant_count: 0 }
                  - { room_index: 4, occupant_count: 4, minor_occupant_count: 0 }
              as: HousingManager
          trigger:
            - call: "POST /housing/bookings/${bk_id}/rooming-list"
              payload:
                entries:
                  - { room_index: 1, occupant_count: 3, minor_occupant_count: 0 }
                  - { room_index: 2, occupant_count: 3, minor_occupant_count: 0 }
                  - { room_index: 3, occupant_count: 3, minor_occupant_count: 0 }
                  - { room_index: 4, occupant_count: 3, minor_occupant_count: 0 }
              as: HousingManager
            - call: "GET /housing/bookings/${bk_id}/rooming-list"
              payload: {}
              as: HousingManager
          assert:
            - "second response.pagination.total_count == 4"
            - "second response.data[0].room_index == 1"
            - "second response.data[0].occupant_count == 3"
            - "second response.data[0].minor_occupant_count == 0"
            - "second response.data[0].version == null"
            - "second response.data[0].updated_at == null"
            - "Booking.${bk_id}.booking_status == ROOMING_LIST_SUBMITTED"
            - "Booking.${bk_id}.version == 3"

      - name: actualization_reports_form_append_only_ledger
        claim_type: immutability
        grounds:
          - entities.ActualizationReport
          - endpoints[POST /housing/bookings/{id}/actualizations]
          - endpoints[GET /housing/bookings/{id}/actualization-reports]
        distinguishing_aspect: |
          ActualizationReport is the second common_fields false entity: reports are appended, never
          corrected in place. Two reports on the same booking must both survive with sequence_no 1
          and 2 in creation order, while the booking's actualized_room_nights tracks only the
          greatest sequence_no (15, not the 27 sum and not the first report's 12).
        test_recipe:
          setup:
            - "One CONFIRMED booking of 4 rooms on a BOOKING_CLOSED tournament."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - &sc_confirm
              call: "POST /housing/bookings/${bk_id}/confirm"
              payload: {}
              as: HousingManager
            - &sc_close_booking
              call: "POST /housing/tournaments/${tourn_id}/close-booking"
              payload: {}
              as: HousingManager
            - &sc_actualize12
              call: "POST /housing/bookings/${bk_id}/actualizations"
              payload: { reported_room_nights: 12, report_note: "folio at checkout" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
          trigger:
            - call: "POST /housing/bookings/${bk_id}/actualizations"
              payload: { reported_room_nights: 15, report_note: "corrected folio" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
            - call: "GET /housing/bookings/${bk_id}/actualization-reports"
              payload: {}
              as: HousingManager
          assert:
            - "second response.pagination.total_count == 2"
            - "second response.data[0].sequence_no == 1"
            - "second response.data[0].reported_room_nights == 12"
            - "second response.data[1].sequence_no == 2"
            - "second response.data[1].reported_room_nights == 15"
            - "Booking.${bk_id}.actualized_room_nights == 15"
            - "Booking.${bk_id}.rebate_accrued_cents == 13500"
            - "RoomBlock.${block_id}.actualized_room_nights == 15"

      - name: room_block_create_with_unknown_contract_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.RoomBlock.fields.contract_id
          - errors[ERR_CONTRACT_NOT_FOUND]
          - validations[priority=6]
        distinguishing_aspect: |
          RoomBlock has exactly one parent. A body FK pointing at no HotelContract row must fail
          at priority 6 with 404 ERR_CONTRACT_NOT_FOUND, ahead of every window and capacity rule
          (46, 49, 58) that would otherwise also have something to say about the payload.
        test_recipe:
          setup:
            - "One Tournament and one Hotel exist; no HotelContract has the id used in the trigger."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
          trigger:
            - call: "POST /housing/room-blocks"
              payload: { contract_id: "00000000-0000-4000-8000-000000000000", room_type: "DOUBLE_QUEEN", block_size_rooms: 20, arrival_date: "2026-09-10", departure_date: "2026-09-13", release_deadline: "2026-08-25" }
              as: HousingManager
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 404"
            - "response.error.error_id == ERR_CONTRACT_NOT_FOUND"

      - name: graph_topology_complaint_resolves_three_cross_aggregate_links
        claim_type: graph
        grounds:
          - entities.Complaint
          - endpoints[POST /housing/complaints]
          - endpoints[GET /housing/complaints]
        distinguishing_aspect: |
          entity_topology is graph, and Complaint is the junction that proves it: one row can
          reference a Tournament, a TeamRegistration, an ExceptionRequest and a Booking at once,
          across three different aggregates. All four links must validate on create, and each
          optional link must be independently queryable — a filter on affected_booking_id alone
          returns the row.
        test_recipe:
          setup:
            - "One EXECUTED contract, one registration with a DRAFT booking, and one SUBMITTED exception request on that same registration."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - &sc_exception_family
              call: "POST /housing/exception-requests"
              payload: { registration_id: "${reg_id}", reason_code: "FAMILY_MEDICAL", requested_rooms_exempt: 1, justification: "one player travels with a medical caregiver" }
              as: HousingManager
              captures: { exc_id: "$.data.id" }
          trigger:
            - &sc_complaint
              call: "POST /housing/complaints"
              payload: { tournament_id: "${tourn_id}", category: "POLICY_FAIRNESS", narrative: "the housing policy is applied unevenly across visiting teams", registration_id: "${reg_id}", cited_exception_request_id: "${exc_id}", affected_booking_id: "${bk_id}" }
              as: HousingManager
              captures: { cmp_id: "$.data.id" }
            - call: "GET /housing/complaints"
              payload: { affected_booking_id: "${bk_id}" }
              as: HousingManager
          assert:
            - "first response.status == 201"
            - "Complaint.${cmp_id}.status == FILED"
            - "Complaint.${cmp_id}.route == null"
            - "Complaint.${cmp_id}.remedy_type == NONE"
            - "Complaint.${cmp_id}.remedy_credit_cents == 0"
            - "Complaint.${cmp_id}.registration_id == ${reg_id}"
            - "Complaint.${cmp_id}.cited_exception_request_id == ${exc_id}"
            - "Complaint.${cmp_id}.affected_booking_id == ${bk_id}"
            - "second response.pagination.total_count == 1"
            - "second response.data[0].id == ${cmp_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complaint_triage_investigate_transition
        claim_type: valid_transition
        grounds:
          - state_machines.Complaint (FILED -> INVESTIGATING)
          - endpoints[POST /housing/complaints/{id}/triage]
        distinguishing_aspect: |
          The INVESTIGATE fork must move FILED -> INVESTIGATING, stamp route and triaged_by_user_id
          from X-User-ID, and bump version to 2 — and, being fork branch 1, it must leave the cited
          ExceptionRequest completely alone, so that request's appeal_count and version are
          unchanged afterwards.
        test_recipe:
          setup:
            - "One FILED complaint citing a SUBMITTED exception request and a DRAFT booking."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_exception_family
            - *sc_complaint
          trigger:
            - call: "POST /housing/complaints/${cmp_id}/triage"
              payload: { route: "INVESTIGATE" }
              as: HousingManager
              as_user_id: "mgr-1"
          assert:
            - "response.status == 200"
            - "Complaint.${cmp_id}.status == INVESTIGATING"
            - "Complaint.${cmp_id}.route == INVESTIGATE"
            - "Complaint.${cmp_id}.triaged_by_user_id == mgr-1"
            - "Complaint.${cmp_id}.adjudicated_by_user_id == null"
            - "Complaint.${cmp_id}.version == 2"
            - "ExceptionRequest.${exc_id}.appeal_count == 0"
            - "ExceptionRequest.${exc_id}.version == 1"

      - name: investigate_branch_rejects_rate_adjustment_remedy
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Complaint (INVESTIGATING -> UPHELD, remedy vocabulary precondition)
          - validations[priority=95]
          - errors[ERR_REMEDY_NOT_AVAILABLE_ON_ROUTE]
        distinguishing_aspect: |
          The two join edges into UPHELD carry DIFFERENT remedy vocabularies. RATE_ADJUSTMENT is
          legal only on the ESCALATE branch, so offering it on an INVESTIGATING complaint is a 422
          ERR_REMEDY_NOT_AVAILABLE_ON_ROUTE. The complaint must remain INVESTIGATING with
          remedy_type NONE — a rejected adjudication leaves no partial mutation.
        test_recipe:
          setup:
            - "One INVESTIGATING complaint whose affected_booking_id points at a DRAFT booking."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_exception_family
            - *sc_complaint
            - &sc_triage_investigate
              call: "POST /housing/complaints/${cmp_id}/triage"
              payload: { route: "INVESTIGATE" }
              as: HousingManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /housing/complaints/${cmp_id}/adjudicate"
              payload: { outcome: "UPHOLD", remedy_type: "RATE_ADJUSTMENT" }
              as: RightsHolder
              as_user_id: "rights-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 422"
            - "response.error.error_id == ERR_REMEDY_NOT_AVAILABLE_ON_ROUTE"
            - "Complaint.${cmp_id}.status == INVESTIGATING"
            - "Complaint.${cmp_id}.remedy_type == NONE"
            - "Complaint.${cmp_id}.remedy_credit_cents == 0"
            - "Complaint.${cmp_id}.adjudicated_by_user_id == null"
            - "Complaint.${cmp_id}.version == 2"

      - name: escalate_branch_restores_one_appeal_cycle
        claim_type: side_effect_execution
        grounds:
          - state_machines.Complaint (FILED -> ESCALATED, divergent branch effect)
          - entities.ExceptionRequest.fields.appeal_count
        distinguishing_aspect: |
          Fork branch 2 carries a cross-entity side effect branch 1 does not: escalating a complaint
          that cites a DENIED exception request resets that request's appeal_count from 1 back to 0
          and bumps its version. The reset is observable behaviourally, not just as a field — the
          team can APPEAL again afterwards where the same call had been refused with
          ERR_APPEAL_LIMIT_REACHED.
        test_recipe:
          setup:
            - "One exception request that was denied, appealed once, and denied again, so appeal_count is 1 and status is DENIED."
            - "One FILED complaint citing that request."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_exception_family
            - &sc_start_review
              call: "POST /housing/exception-requests/${exc_id}/review"
              payload: { action: "START_REVIEW" }
              as: ExceptionReviewer
              as_user_id: "rev-1"
            - &sc_deny
              call: "POST /housing/exception-requests/${exc_id}/review"
              payload: { action: "DENY", decision_note: "insufficient documentation" }
              as: ExceptionReviewer
              as_user_id: "rev-1"
            - call: "POST /housing/exception-requests/${exc_id}/team-action"
              payload: { action: "APPEAL", justification: "attaching the physician letter" }
              as: TeamManager
              as_user_id: "${team_id}"
            - call: "POST /housing/exception-requests/${exc_id}/review"
              payload: { action: "DENY", decision_note: "still insufficient" }
              as: ExceptionReviewer
              as_user_id: "rev-2"
            - call: "POST /housing/complaints"
              payload: { tournament_id: "${tourn_id}", category: "POLICY_FAIRNESS", narrative: "the exemption criteria were applied inconsistently", registration_id: "${reg_id}", cited_exception_request_id: "${exc_id}" }
              as: HousingManager
              captures: { cmp2_id: "$.data.id" }
          trigger:
            - call: "POST /housing/complaints/${cmp2_id}/triage"
              payload: { route: "ESCALATE" }
              as: HousingManager
              as_user_id: "mgr-1"
            - call: "POST /housing/exception-requests/${exc_id}/team-action"
              payload: { action: "APPEAL", justification: "second appeal after escalation" }
              as: TeamManager
              as_user_id: "${team_id}"
          assert:
            - "first response.status == 200"
            - "Complaint.${cmp2_id}.status == ESCALATED"
            - "Complaint.${cmp2_id}.route == ESCALATE"
            - "second response.status == 200"
            - "ExceptionRequest.${exc_id}.status == UNDER_REVIEW"
            - "ExceptionRequest.${exc_id}.appeal_count == 1"

      - name: booking_confirm_from_draft_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Booking (no DRAFT -> CONFIRMED edge)
          - validations[priority=20]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          DRAFT has exactly two outgoing edges — ROOMING_LIST_SUBMITTED and CANCELLED. Confirming
          straight from DRAFT is not merely a missing rooming list, it is an absent edge, so the
          answer is 409 ERR_INVALID_STATE and none of the CASCADE-CONFIRM side effects fire: the
          block's rooms_committed stays 0 and the registration stays PENDING_HOUSING.
        test_recipe:
          setup:
            - "One DRAFT booking of 4 rooms whose rooming list has never been submitted."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
          trigger:
            - call: "POST /housing/bookings/${bk_id}/confirm"
              payload: {}
              as: HousingManager
              captures: { err: "$.data.error_id" }
            - call: "GET /housing/hotel-contracts/${contract_id}/room-blocks"
              payload: {}
              as: HousingManager
          assert:
            - "first response.status == 409"
            - "first response.error.error_id == ERR_INVALID_STATE"
            - "Booking.${bk_id}.booking_status == DRAFT"
            - "Booking.${bk_id}.version == 1"
            - "second response.data[0].rooms_committed == 0"
            - "second response.data[0].rooms_available == 20"
            - "second response.data[0].status == OPEN"
            - "TeamRegistration.${reg_id}.status == PENDING_HOUSING"

      - name: exception_request_initial_state
        claim_type: initial_state
        excluded_because:
          difficulty_instance: exception_auto_approval_requires_tournament_constrained
          rationale: |
            That instance files two exception requests differing only in Tournament.housing_pressure
            and asserts the first one lands in the declared initial_state SUBMITTED while the second
            is auto-advanced to APPROVED, which pins initial_state more sharply than a standalone
            create-and-read would.

      - name: adjudicate_on_upheld_complaint_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Complaint.terminal_states [UPHELD, DISMISSED]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          UPHELD is terminal, so a second adjudication must be refused with 409 ERR_INVALID_STATE and
          must not overwrite the remedy already granted: remedy_type stays FEE_WAIVER, the credit
          stays 44700, and the affected booking's penalty_credit_cents is not incremented a second
          time (it stays 44700 rather than doubling).
        test_recipe:
          setup:
            - "One CONFIRMED booking of 4 rooms cancelled at 40 days out, so penalty_cents is 44700."
            - "One INVESTIGATING complaint on that booking, already upheld with a FEE_WAIVER remedy."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_booking
            - *sc_rooming
            - *sc_confirm
            - &sc_cancel
              call: "POST /housing/bookings/${bk_id}/cancel"
              payload: { cancellation_reason: "team withdrew from the event" }
              as: TeamManager
              as_user_id: "${team_id}"
            - &sc_complaint_pricing
              call: "POST /housing/complaints"
              payload: { tournament_id: "${tourn_id}", category: "PRICING_FAIRNESS", narrative: "the cancellation penalty tier was misapplied", affected_booking_id: "${bk_id}" }
              as: HousingManager
              captures: { cmp3_id: "$.data.id" }
            - &sc_triage_investigate_3
              call: "POST /housing/complaints/${cmp3_id}/triage"
              payload: { route: "INVESTIGATE" }
              as: HousingManager
              as_user_id: "mgr-1"
            - &sc_uphold_fee_waiver
              call: "POST /housing/complaints/${cmp3_id}/adjudicate"
              payload: { outcome: "UPHOLD", remedy_type: "FEE_WAIVER", remedy_amount_cents: 60000 }
              as: RightsHolder
              as_user_id: "rights-1"
          trigger:
            - call: "POST /housing/complaints/${cmp3_id}/adjudicate"
              payload: { outcome: "DISMISS", remedy_type: "NONE" }
              as: RightsHolder
              as_user_id: "rights-1"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.error.error_id == ERR_INVALID_STATE"
            - "Complaint.${cmp3_id}.status == UPHELD"
            - "Complaint.${cmp3_id}.remedy_type == FEE_WAIVER"
            - "Complaint.${cmp3_id}.remedy_credit_cents == 44700"
            - "Booking.${bk_id}.penalty_cents == 44700"
            - "Booking.${bk_id}.penalty_credit_cents == 44700"

      - name: second_countersign_rejected
        claim_type: idempotency
        grounds:
          - state_machines.HotelContract (EXECUTED has no COUNTERSIGN edge)
          - errors[ERR_INVALID_STATE]
          - entities.Tournament.fields.executed_contract_count
        distinguishing_aspect: |
          Replaying COUNTERSIGN on an already EXECUTED contract must fail rather than be absorbed
          silently, and it must not re-run the transition's cross-entity side effect: the
          tournament's executed_contract_count must remain 1, not become 2.
        test_recipe:
          setup:
            - "One EXECUTED HotelContract on a tournament with exactly one contract."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
          trigger:
            - call: "POST /housing/hotel-contracts/${contract_id}/negotiation"
              payload: { action: "COUNTERSIGN" }
              as: HotelRepresentative
              as_user_id: "${hotel_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.error.error_id == ERR_INVALID_STATE"
            - "HotelContract.${contract_id}.status == EXECUTED"
            - "HotelContract.${contract_id}.revision_round == 0"
            - "Tournament.${tourn_id}.executed_contract_count == 1"
            - "Tournament.${tourn_id}.housing_pressure == NORMAL"

      - name: booking_parallel_dimensions_shape
        claim_type: parallel
        excluded_because:
          difficulty_instance: booking_parallel_axes_independence
          rationale: |
            state_machine_shape is parallel because Booking carries two independent dimensions
            (booking_status and rebate_status). That instance drives rebate_status NOT_DUE -> ACCRUED
            -> INVOICED -> COLLECTED while booking_status stays pinned at CHECKED_OUT, which is
            exactly the shape claim.

      - name: cascade_close_denies_open_exception_requests
        claim_type: cascade_down
        grounds:
          - state_machines.Tournament (OPEN -> BOOKING_CLOSED, CASCADE-CLOSE links 1-3)
          - calculations.registration_compliance_status
        distinguishing_aspect: |
          CASCADE-CLOSE is a three-link chain the difficulty design never exercises: closing booking
          flips an unhoused registration to NON_COMPLIANT (link 1), which is what makes its still-open
          exception request DENIED with decided_by_user_id SYSTEM_AUTO and the pinned decision_note
          (link 2), which in turn forces a recompute leaving exempt_rooms_granted 0 and
          effective_required_rooms 4 with a refreshed compliance_evaluated_at (link 3). A
          DENIED-by-cascade request contributes nothing to exempt_rooms_granted, so the requirement
          does not shrink.
        test_recipe:
          setup:
            - "One EXECUTED contract, one registration (13 players, 3 staff) with no bookings at all, and one SUBMITTED FAMILY_MEDICAL exception request on it."
            - "The block's release_deadline 2026-08-25 is still in the future at the logical clock 2026-08-01, so the block is not swept into RELEASED by the same transition."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - *sc_exception_family
          trigger:
            - call: "POST /housing/tournaments/${tourn_id}/close-booking"
              payload: {}
              as: HousingManager
            - call: "GET /housing/hotel-contracts/${contract_id}/room-blocks"
              payload: {}
              as: HousingManager
          assert:
            - "first response.status == 200"
            - "Tournament.${tourn_id}.posture == BOOKING_CLOSED"
            - "TeamRegistration.${reg_id}.status == NON_COMPLIANT"
            - "TeamRegistration.${reg_id}.committed_rooms == 0"
            - "TeamRegistration.${reg_id}.exempt_rooms_granted == 0"
            - "TeamRegistration.${reg_id}.effective_required_rooms == 4"
            - "ExceptionRequest.${exc_id}.status == DENIED"
            - "ExceptionRequest.${exc_id}.decided_by_user_id == SYSTEM_AUTO"
            - "ExceptionRequest.${exc_id}.decision_note == closed without decision"
            - "second response.data[0].status == OPEN"

      - name: block_settled_bubbles_contract_to_closed
        claim_type: bubble_up
        excluded_because:
          difficulty_instance: cascade_remit_depth_four_invoice_to_contract_closed
          rationale: |
            That instance walks the whole bubble-up: the last Booking reaching rebate_status COLLECTED
            drives its RoomBlock RELEASED -> SETTLED, and the contract auto-transitions EXECUTED ->
            CLOSED only once every one of its blocks is SETTLED.

      - name: confirm_adjusts_block_and_registration
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: cascade_confirm_depth_four_booking_to_housing_pressure
          rationale: |
            Confirming a booking is the scaffold's principal cross-entity effect, and that instance
            already verifies every downstream field it touches on RoomBlock, HotelContract,
            Tournament and TeamRegistration in one pass.

      - name: remittance_syncs_invoice_ledger_fields
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: rebate_ledger_conservation_partial_remit_then_write_off
          rationale: |
            That instance pins collected_cents, written_off_cents and outstanding_cents against
            total_due_cents across a partial remittance and a write-off, which is the ledger-sync
            claim for this scaffold's only monetary ledger.

      - name: cancel_reverses_confirm_side_effects
        claim_type: compensation
        excluded_because:
          difficulty_instance: room_inventory_conservation_confirm_then_cancel
          rationale: |
            Cancel is the compensating transition for confirm, and that instance asserts every
            counter, posture and pressure field returns to its pre-confirm value with no drift.

      - name: cascade_remedy_policy_exemption_only_when_request_denied
        claim_type: conditional_cascade
        grounds:
          - state_machines.Complaint (ESCALATED -> UPHELD, CASCADE-REMEDY links 1-3)
          - calculations.registration_compliance_status
          - validations[priority=80]
        distinguishing_aspect: |
          CASCADE-REMEDY is guarded three ways at once: remedy_type must be POLICY_EXEMPTION,
          cited_exception_request_id must be non-null, AND that request must currently be DENIED.
          Under all three, the request is revived to APPROVED with approved_rooms_exempt taken from
          requested_rooms_exempt (link 1), the registration's exempt_rooms_granted becomes 4 and
          effective_required_rooms collapses to 0 (link 2), and the status is re-derived from
          NON_COMPLIANT to EXCEPTION_GRANTED (link 3) — even though committed_rooms is still 0.
          POLICY_EXEMPTION credits no money, so remedy_credit_cents must be 0 despite the remedy
          being granted.
        test_recipe:
          setup:
            - "One registration (13 players, 3 staff, minimum_rooms_for_compliance 4) with no bookings."
            - "One FINANCIAL_HARDSHIP exception request for 4 rooms, taken to DENIED by reviewer rev-1."
            - "Booking then closed, so the registration is NON_COMPLIANT."
            - "One complaint citing that request, escalated by the housing manager."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
            - *sc_contract
            - *sc_block
            - *sc_submit
            - *sc_countersign
            - *sc_team
            - *sc_registration
            - &sc_exception_hardship
              call: "POST /housing/exception-requests"
              payload: { registration_id: "${reg_id}", reason_code: "FINANCIAL_HARDSHIP", requested_rooms_exempt: 4, justification: "the club cannot fund four nights of program housing" }
              as: HousingManager
              captures: { exch_id: "$.data.id" }
            - call: "POST /housing/exception-requests/${exch_id}/review"
              payload: { action: "START_REVIEW" }
              as: ExceptionReviewer
              as_user_id: "rev-1"
            - call: "POST /housing/exception-requests/${exch_id}/review"
              payload: { action: "DENY", decision_note: "hardship not documented" }
              as: ExceptionReviewer
              as_user_id: "rev-1"
            - &sc_close_booking_2
              call: "POST /housing/tournaments/${tourn_id}/close-booking"
              payload: {}
              as: HousingManager
            - call: "POST /housing/complaints"
              payload: { tournament_id: "${tourn_id}", category: "POLICY_FAIRNESS", narrative: "the hardship exemption criteria were applied unfairly", registration_id: "${reg_id}", cited_exception_request_id: "${exch_id}" }
              as: HousingManager
              captures: { cmp4_id: "$.data.id" }
            - call: "POST /housing/complaints/${cmp4_id}/triage"
              payload: { route: "ESCALATE" }
              as: HousingManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /housing/complaints/${cmp4_id}/adjudicate"
              payload: { outcome: "UPHOLD", remedy_type: "POLICY_EXEMPTION" }
              as: RightsHolder
              as_user_id: "rights-1"
          assert:
            - "response.status == 200"
            - "Complaint.${cmp4_id}.status == UPHELD"
            - "Complaint.${cmp4_id}.remedy_type == POLICY_EXEMPTION"
            - "Complaint.${cmp4_id}.remedy_credit_cents == 0"
            - "Complaint.${cmp4_id}.adjudicated_by_user_id == rights-1"
            - "ExceptionRequest.${exch_id}.status == APPROVED"
            - "ExceptionRequest.${exch_id}.approved_rooms_exempt == 4"
            - "ExceptionRequest.${exch_id}.decided_by_user_id == SYSTEM_AUTO"
            - "TeamRegistration.${reg_id}.exempt_rooms_granted == 4"
            - "TeamRegistration.${reg_id}.effective_required_rooms == 0"
            - "TeamRegistration.${reg_id}.committed_rooms == 0"
            - "TeamRegistration.${reg_id}.status == EXCEPTION_GRANTED"

      - name: booking_create_guarded_by_contract_state
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: booking_create_requires_contract_executed
          rationale: |
            The scaffold's guarded transitions are all of the form "act on A only if related B is in
            state X". That instance covers the canonical one — booking creation is refused while the
            owning HotelContract is NEGOTIATING and succeeds the moment it is countersigned.

  # ===========================================================================
  - section: calculations
    instances:
      - name: revenue_share_split_base_case_exact_cents
        claim_type: correct_result
        grounds:
          - calculations.revenue_share_split
          - endpoints[POST /housing/revenue-distributions]
        distinguishing_aspect: |
          Every one of the six pinned steps is checked against one fully computed fixture: gross
          10800 sits below ADMIN_TIER_1_MAX_CENTS so admin_fee_pct is 0.08, the fee is
          round_half_up(864.0) = 864, distributable is 9936, and the three floor buckets are 4968 /
          2980 / 1987, summing to 9935 and leaving a remainder of 1 that goes entirely to the
          organizer, giving organizer_cents 4969 and closing the invariant exactly at 9936.
        test_recipe:
          setup:
            - "One EXECUTED contract whose single 4-room booking actualized 12 room nights."
            - "One RebateInvoice for 10800 cents, issued and fully remitted, so collected_cents is 10800."
          setup_api_calls:
            - *sc_clock
            - *sc_tournament
            - *sc_hotel
