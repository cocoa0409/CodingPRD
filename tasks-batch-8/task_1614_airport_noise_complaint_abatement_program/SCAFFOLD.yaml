  - { method: POST, path: "/noise-program/noise-events/{eventId}/verify", description: "CLASSIFIED_* -> VERIFIED (confidence>=70, uptime>=80.0)", roles: [NoiseAnalyst], code: 200, input: [], output: NoiseEvent, side_effects: ["increments NoiseEvent.version by 1"] }
