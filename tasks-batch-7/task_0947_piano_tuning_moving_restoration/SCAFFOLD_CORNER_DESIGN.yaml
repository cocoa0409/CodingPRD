  # =======================================================================
  # CONSISTENCY MODEL
  # =======================================================================
  - section: consistency_model
    instances:

      - name: booking_updates_the_route_day_within_the_same_request
        claim_type: immediate
        grounds:
          - calculations.route_day_committed_minutes
          - conservation_invariants[route-minutes-conservation]
          - endpoints[POST /appointments]
        distinguishing_aspect: "The consistency model is immediate: the RouteDay read straight after the booking already reports committed_minutes 85, stop_count 1 and a bumped version, with no sweep or second call required."
        test_recipe:
          setup: ["One assessed UPRIGHT instrument at a ZONE_A address and an APPRENTICE technician with an OPEN 2026-05-04 route day."]
          setup_api_calls:
            - call: "POST /clients"
              payload: { display_name: "Immediate Client", email: "imm2@example.com", phone: "555-0390", home_zone_code: "ZONE_A" }
              as: ShopManager
              captures: { cl_id: "$.data.id" }
            - call: "POST /locations"
              payload: { client_id: "${cl_id}", label: "Room", zone_code: "ZONE_A", address_key: "imm2-room", distance_miles_from_shop: 3.0 }
              as: ShopManager
              captures: { loc_id: "$.data.id" }
            - call: "POST /instruments"
              payload: { client_id: "${cl_id}", current_location_id: "${loc_id}", make: "Yamaha", model: "U1", serial_number: "SN-C90-0001", instrument_class: "UPRIGHT", usage_tier: "HOME" }
              as: ShopManager
              captures: { inst_id: "$.data.id" }
            - call: "POST /instruments/${inst_id}/pitch-assessments"
              payload: { reference_pitch_hz: 440.0, measured_deviation_cents: 2.0 }
              as: ShopManager
            - call: "POST /technicians"
              payload: { display_name: "Tech A90", certification_level: "APPRENTICE", zone_codes: ["ZONE_A"] }
              as: PlatformAdmin
              captures: { tech_id: "$.data.id" }
            - call: "POST /route-days"
              payload: { technician_id: "${tech_id}", service_date: "2026-05-04" }
              as: ShopManager
              captures: { rd_id: "$.data.id", rd_v0: "$.data.version" }
          trigger:
            - call: "POST /appointments"
              payload: { instrument_id: "${inst_id}", route_day_id: "${rd_id}", location_id: "${loc_id}", scheduled_start_utc: "2026-05-04T09:00:00Z", service_type: "TUNE", expected_route_day_version: "${rd_v0}" }
              as: ShopManager
              captures: { ap_id: "$.data.id" }
            - call: "GET /route-days/${rd_id}"
              payload: {}
              as: ShopManager
              captures: { rd_v1: "$.data.version" }
          assert:
            - "Appointment.${ap_id}.scheduling_status == SCHEDULED and fulfillment_status == PENDING in the create response itself"
            - "Appointment.${ap_id}.total_block_minutes == 85"
            - "RouteDay.${rd_id}.committed_minutes == 85 and stop_count == 1 on the very next read"
            - "${rd_v1} equals ${rd_v0} plus 1"
            - "cancelling ${ap_id} immediately restores RouteDay.${rd_id}.committed_minutes to 0, conserving route minutes exactly"
