              as: FleetPlanner
              captures: { store_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-E3", domicile_id: "${dom_id}", pay_plan_id: "${plan_id}", seniority_date: "2019-03-01" }
              as: TransportManager
              captures: { driver_id: $.data.id }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-E3", domicile_id: "${dom_id}", odometer_miles: 50000, pm_interval_miles: 25000, pm_last_service_odometer: 40000 }
              as: MaintenanceCoordinator
              captures: { tractor_id: $.data.id }
            - call: "POST /fleet/trailers"
              payload: { trailer_code: "TL-E3", domicile_id: "${dom_id}", trailer_type: "DRY_VAN", capacity_cases: 1800, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
              captures: { trailer_id: $.data.id }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_id}", cases: 600, weight_lbs: 13200, requested_window_start: "2026-08-20T06:00:00Z", requested_window_end: "2026-08-20T18:00:00Z", temperature_mode: "DRY", priority: 1 }
              as: FleetPlanner
              captures: { order_id: $.data.id }
            - call: "POST /fleet/trips"
              payload: { trip_code: "TRIP-E3", domicile_id: "${dom_id}", planned_start_at: "2026-08-20T06:00:00Z" }
              as: FleetPlanner
              captures: { trip_id: $.data.id }
            - call: "POST /fleet/trips/${trip_id}/stops"
              payload: { sequence: 1, stop_type: "DELIVERY", store_id: "${store_id}", replenishment_order_id: "${order_id}", scheduled_arrival_at: "2026-08-20T08:00:00Z", scheduled_departure_at: "2026-08-20T09:15:00Z", drive_minutes_from_prev: 120, miles_from_prev: 100, segment_loaded: true, cases: 600 }
              as: FleetPlanner
              captures: { stop_id: $.data.id }
            - call: "POST /fleet/trips/${trip_id}/assignments"
              payload: { driver_id: "${driver_id}", tractor_id: "${tractor_id}", trailer_id: "${trailer_id}" }
              as: TransportManager
            - call: "POST /fleet/trips/${trip_id}/plan"
              payload: {}
              as: FleetPlanner
            - call: "POST /fleet/trips/${trip_id}/dispatch"
