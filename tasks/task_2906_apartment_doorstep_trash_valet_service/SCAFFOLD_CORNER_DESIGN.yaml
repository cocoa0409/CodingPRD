            - "ServiceNight.${n1_id}.assigned_unit_coverage_count == 2 and version == ${n1_v2} — the rejected write bumped nothing"

      - name: resident_on_an_occupied_unit_returns_unit_already_occupied
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors[ERR_UNIT_ALREADY_OCCUPIED]
          - entities.Resident.fields.unit_number
        distinguishing_aspect: "Unit occupancy is unique per property among ACTIVE residents only, so a second ACTIVE resident on unit 101 returns HTTP 409 ERR_UNIT_ALREADY_OCCUPIED rather than ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' unit_count 4 with one ACTIVE resident on unit 101"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
