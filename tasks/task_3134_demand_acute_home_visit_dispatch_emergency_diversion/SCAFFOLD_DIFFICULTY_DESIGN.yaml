              as: Dispatcher
            - call: "POST /dh/visit-requests"
              payload: { patient_id: "${patient_id}", market_id: "${mkt_id}", requestor_role: "PATIENT", chief_complaint: "fever" }
              as: TriageNurse
              captures: { vr_triaged: $.data.id, vr_triaged_v0: $.data.version }
            - call: "POST /dh/visit-requests/${vr_triaged}/triage-assessments"
              payload: { heart_rate: 110, systolic_bp: 100, spo2_pct: 94, is_chest_pain: false, is_stroke_signs: false, is_severe_trauma: false, is_altered_mental_status: false }
