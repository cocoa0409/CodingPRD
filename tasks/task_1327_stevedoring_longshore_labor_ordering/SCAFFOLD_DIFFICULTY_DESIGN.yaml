          assert:
            - "GangOrder.${g}.actual_mph == 25.0 (25 moves * 60 / 60 productive minutes)"
            - "GangOrder.${g}.bonus_eligible == true (>= semantics at exact equality)"
            - "GangOrder.${g}.bonus_pool_cents == 0 (excess_moves = max(0, 25 - ceil(25.0 * 1)) = 0)"
            - "GangOrder.${g}.bonus_per_worker_cents == 0"

      - name: checkin_rejected_exactly_at_full_headcount
        grounds:
          - validations[priority=10]
          - calculations.filled_headcount
          - state_machines.DispatchAssignment.OFFERED_to_CHECKED_IN
        distinguishing_aspect: |
          Metric: filled_headcount at exact equality with required_headcount (a
          zero-remaining-slots edge), reached via the check-in endpoint. An OFFERED
          assignment left outstanding by a headcount amendment is bounced with
          ERR_GANG_FULL precisely when filled == required.
        test_recipe:
          setup:
            - "Vessel/shift IN_PROGRESS; gang G headcount 2 with W1, W2 OFFERED; W1 checked in (filled 1)"
            - "Amendment reduces required_headcount to 1: filled 1 == required 1, G becomes MANNED, W2's offer survives"
          setup_api_calls:
