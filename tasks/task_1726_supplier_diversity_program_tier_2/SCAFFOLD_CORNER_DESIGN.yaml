  # ---------------------------------------------------------------------------
  # Section: errors (triggerability audit — §1.8-covered codes appear as stubs)
  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_cert_window_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CERT_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / certification_closed_window_boundary_overlap
          rationale: "Asserted as the rejection of the boundary-day overlapping certification in the named §1.8 instance."
      - name: error_inclusion_shortfall_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INCLUSION_SHORTFALL]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / inclusion_count_exact_minimum_boundary
          rationale: "Asserted on the event with one diverse bid below the required two in the named §1.8 instance."
      - name: error_engagement_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ENGAGEMENT_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / engagement_half_open_window_with_buffer
          rationale: "Asserted for the engagement starting inside the 30-day post-end buffer in the named §1.8 instance."
      - name: error_cert_not_reviewable_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CERT_NOT_REVIEWABLE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / verify_expired_cert_state_error_beats_temporal
          rationale: "Asserted as the priority-4 winner when verifying an EXPIRED certification in the named §1.8 instance."
      - name: error_supplier_not_eligible_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SUPPLIER_NOT_ELIGIBLE]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / award_ineligible_supplier_safety_beats_fiscal
          rationale: "Asserted as the safety-priority winner over the fiscal cap error in the named §1.8 instance."

  # ---------------------------------------------------------------------------
  # Section: rbac
  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: rbac_analyst_cannot_publish_goal_forbidden
        claim_type: rbac_denial
        grounds:
          - roles[DiversityAdmin].exclusive_operations
          - errors[ERR_FORBIDDEN_FOR_ROLE]
        distinguishing_aspect: "Goal publish is DiversityAdmin-exclusive; a DiversityAnalyst caller gets 403 ERR_FORBIDDEN_FOR_ROLE even though the goal is publishable."
        test_recipe:
          setup: ["BU; DRAFT goal created by admin-1"]
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id, bu_v: $.data.version }
            - call: "POST /api/v1/business-units/${bu_id}/goals"
              payload: { fiscal_year: 2026, cert_category: "ALL", goal_type: "PERCENT_OF_SPEND", target_value: 25.00, expected_business_unit_version: "${bu_v}" }
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { goal_id: $.data.id }
          trigger:
            - call: "POST /api/v1/goals/${goal_id}/publish"
              payload: {}
              as: DiversityAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE with HTTP 403; goal stays DRAFT"

      - name: rbac_lead_cannot_verify_certification_forbidden
        claim_type: rbac_denial
        grounds:
          - roles[DiversityAnalyst].shared_operations
          - errors[ERR_FORBIDDEN_FOR_ROLE]
        distinguishing_aspect: "Certification verification is restricted to DiversityAdmin/DiversityAnalyst; a BusinessUnitLead caller gets 403."
        test_recipe:
          setup: ["BU (lead-1); supplier with a certification UNDER_REVIEW (submitted by analyst-1)"]
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Gate Co", tax_id: "T-GTE", kind: "DIVERSE", contact_email: "g@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
            - call: "POST /api/v1/suppliers/${sup_id}/certifications"
              payload: { cert_type: "MBE", certifying_body: "NMSDC", certificate_number: "M-G", valid_from: "2026-01-01", valid_to: "2026-12-31" }
              as: DiversityAnalyst
              as_user_id: analyst-1
              captures: { cert_id: $.data.id }
            - call: "POST /api/v1/certifications/${cert_id}/begin-review"
              payload: {}
              as: DiversityAnalyst
              as_user_id: analyst-1
          trigger:
            - call: "POST /api/v1/certifications/${cert_id}/verify"
              payload: {}
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE with HTTP 403; certification stays UNDER_REVIEW"

      - name: rbac_prime_cannot_approve_report_forbidden
        claim_type: rbac_denial
        grounds:
          - roles[DiversityAdmin].exclusive_operations
          - errors[ERR_FORBIDDEN_FOR_ROLE]
        distinguishing_aspect: "A PrimeContact cannot approve even its own submitted report; approve is DiversityAdmin-exclusive -> 403."
        test_recipe:
          setup: ["BU; prime; diverse supplier; SUBMITTED report owned by the prime"]
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Prime Build Inc", tax_id: "T-PB", kind: "PRIME", contact_email: "p@x.com" }
              as: DiversityAnalyst
              captures: { prime_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Diverse Parts Co", tax_id: "T-DP", kind: "DIVERSE", contact_email: "d@x.com" }
              as: DiversityAnalyst
              captures: { sD: $.data.id }
            - call: "POST /api/v1/tier-2-reports"
              payload:
                prime_supplier_id: ${prime_id}
                business_unit_id: ${bu_id}
                reporting_period: "2026-Q1"
                lines:
                  - { diverse_supplier_id: "${sD}", gross_subcontract_cents: 10000, diverse_share_pct: 100.00 }
              as: PrimeContact
              as_user_id: ${prime_id}
              captures: { rep: $.data.id }
            - call: "POST /api/v1/tier-2-reports/${rep}/submit"
              payload: {}
              as: PrimeContact
              as_user_id: ${prime_id}
          trigger:
            - call: "POST /api/v1/tier-2-reports/${rep}/approve"
              payload: {}
              as: PrimeContact
              as_user_id: ${prime_id}
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE with HTTP 403; report stays SUBMITTED"

      - name: rbac_auditor_cannot_import_spend_forbidden
        claim_type: rbac_denial
        grounds:
          - roles[DiversityAnalyst].exclusive_operations
          - errors[ERR_FORBIDDEN_FOR_ROLE]
        distinguishing_aspect: "Spend import is DiversityAnalyst-exclusive; an Auditor caller with a fully valid payload still gets 403."
        test_recipe:
          setup: ["BU; supplier"]
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /api/v1/suppliers"
              payload: { legal_name: "Audit Target", tax_id: "T-AT", kind: "DIVERSE", contact_email: "a@x.com" }
              as: DiversityAnalyst
              captures: { sup_id: $.data.id }
          trigger:
            - call: "POST /api/v1/spend-records"
              payload: { supplier_id: "${sup_id}", business_unit_id: "${bu_id}", amount_cents: 5000, transaction_date: "2026-02-01", payment_date: "2026-02-01" }
              as: Auditor
              as_user_id: auditor-9
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE with HTTP 403"

      - name: rbac_lead_cannot_open_other_bus_event_forbidden
        claim_type: rbac_denial
        grounds:
          - roles[BusinessUnitLead].exclusive_operations
          - errors[ERR_FORBIDDEN_FOR_ROLE]
        distinguishing_aspect: "BusinessUnitLead scope is the BU whose lead_user_id equals the caller: lead-2 opening lead-1's event gets 403 (scope failure, same role)."
        test_recipe:
          setup: ["BU-1 owned by lead-1 with a DRAFT event; BU-2 owned by lead-2"]
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu1: $.data.id }
            - call: "POST /api/v1/business-units"
              payload: { name: "Marine", code: "MAR", lead_user_id: "lead-2" }
              as: DiversityAdmin
            - call: "POST /api/v1/sourcing-events"
              payload: { business_unit_id: "${bu1}", title: "Avionics cables", estimated_value_cents: 100000, required_diverse_bidders: 0 }
              as: BusinessUnitLead
              as_user_id: lead-1
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /api/v1/sourcing-events/${ev_id}/open"
              payload: {}
              as: BusinessUnitLead
              as_user_id: lead-2
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_FOR_ROLE with HTTP 403; event stays DRAFT"

  # ---------------------------------------------------------------------------
  # Section: cross_cutting_complexity_layers
  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: goal_create_stale_bu_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[goal-create-stale-business-unit]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Creating a goal with a stale expected_business_unit_version fails 412 ERR_STALE_VERSION and supersedes nothing; re-reading the BU and retrying with the fresh version succeeds and supersedes the prior DRAFT."
        test_recipe:
          setup: ["BU created (version 1 observed)"]
          setup_api_calls:
            - call: "POST /api/v1/business-units"
              payload: { name: "Aerospace", code: "AERO", lead_user_id: "lead-1" }
              as: DiversityAdmin
              captures: { bu_id: $.data.id, bu_v: $.data.version }
          trigger:
            - call: "POST /api/v1/business-units/${bu_id}/goals"
              payload: { fiscal_year: 2026, cert_category: "ALL", goal_type: "PERCENT_OF_SPEND", target_value: 25.00, expected_business_unit_version: "${bu_v}" }
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { goal1: $.data.id }
            - call: "POST /api/v1/business-units/${bu_id}/goals"
              payload: { fiscal_year: 2026, cert_category: "ALL", goal_type: "PERCENT_OF_SPEND", target_value: 30.00, expected_business_unit_version: "${bu_v}" }
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { err: $.data.error_id }
            - call: "GET /api/v1/business-units/${bu_id}"
              payload: {}
              as: DiversityAdmin
              captures: { bu_v2: $.data.version }
            - call: "POST /api/v1/business-units/${bu_id}/goals"
              payload: { fiscal_year: 2026, cert_category: "ALL", goal_type: "PERCENT_OF_SPEND", target_value: 30.00, expected_business_unit_version: "${bu_v2}" }
              as: DiversityAdmin
              as_user_id: admin-1
              captures: { goal2: $.data.id }
            - call: "GET /api/v1/business-units/${bu_id}/goals"
              payload: { status: "SUPERSEDED" }
              as: DiversityAdmin
              captures: { g1_status: "$.data[0].status", g1_id: "$.data[0].id" }
          assert:
            - "First create succeeds with the observed version 1 (BU version advances to 2)"
            - "Second create with the stale version 1: err == ERR_STALE_VERSION with HTTP 412"
            - "bu_v2 == 2; retry with the fresh version succeeds"
            - "The SUPERSEDED-filtered list has total_count == 1, g1_status == SUPERSEDED, and g1_id == ${goal1} (the successful retry superseded the prior DRAFT with the same key)"

      - name: cascade_end_to_end_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AuditCase.OPEN_to_FAILED
          - state_machines.Supplier.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / audit_failure_cascade_to_event_bid_count
          rationale: "The 4-link audit-failure chain and the 2-link admin-suspension chain are asserted end-to-end in the two §1.8 transitive_cascade instances."

      - name: dual_variant_layer_covered
        claim_type: dual_variant_calculation
        grounds:
          - calculations.diverse_spend_attribution
          - calculations.supplier_risk_score
        excluded_because:
          difficulty_instance: dual_variant_calc / spend_attribution_accrual_vs_cash_basis
          rationale: "Both variant pairs (spend basis; risk-score posture) are asserted with literal divergent outputs in §1.8."

      - name: derived_field_reconciliation_covered
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Scorecard.fields.direct_diverse_spend_cents
          - entities.BusinessUnit.fields.lifetime_imported_spend_cents
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / scorecard_attribution_depends_on_certification_state
          rationale: "Snapshot-then-recompute semantics after a source mutation are asserted there; BU counter reconciliation after void/re-import is asserted in compensating_invariant / spend_void_reimport_conserves_net_posted."

  # ---------------------------------------------------------------------------
  # Section: consistency_model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_covered
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        excluded_because:
          difficulty_instance: compensating_invariant / spend_void_reimport_conserves_net_posted
          rationale: "The void and re-import side effects are observable in the immediately following GET of the same instance's trigger chain — all mutations are atomic within their request under the immediate model."

