  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_pay_reverse_preserves_accumulation
        grounds:
          - state_machines.Claim.ADJUDICATED_to_PAID
          - state_machines.Claim.PAID_to_REVERSED
          - calculations.specific_accumulation_policy_year_basis
        distinguishing_aspect: |
          Conserved quantity: SPECIFIC ClaimAccumulation.accumulated_cents.
          Paying a claim adds paid_amount_cents; reversing the same claim
          removes exactly the same amount; net drift == 0.
