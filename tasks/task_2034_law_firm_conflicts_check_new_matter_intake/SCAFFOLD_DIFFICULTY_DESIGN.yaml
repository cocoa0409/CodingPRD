  # ---------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: retainer_fund_refund_conservation
        grounds:
          - state_machines.RetainerDeposit.PENDING_to_PARTIALLY_FUNDED
          - state_machines.RetainerDeposit.PARTIALLY_FUNDED_to_PENDING
          - entities.RetainerDeposit.fields.received_cents
        distinguishing_aspect: |
          Conserved quantity = money: received_cents = funded_total_cents - refunded_total_cents. A forward
          FUND(x) paired with its compensating REFUND(x) returns received_cents and the derived status to
          their exact pre-pair values (PENDING / 0), with both cumulative totals recording the round trip.
        test_recipe:
          setup:
            - "Matter M (INTAKE) with PRIME assessment (800) and ISSUED letter estimating 2,000,000 -> deposit required_cents == 2000000, received_cents == 0, status PENDING"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Conservation Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_c: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_c}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id } }
            - { call: "POST /intake/matters/${m}/credit-assessments", payload: { score: 800 }, as: BillingClerk }
            - { call: "GET /intake/matters/${m}", as: IntakeSpecialist, captures: { m_v: $.data.version } }
            - { call: "POST /intake/matters/${m}/engagement-letters", payload: { scope_text: "Scope", fee_lines: [{ description: "fees", hours: 100.0, rate_cents: 20000 }], expected_matter_version: "${m_v}" }, as: ResponsibleAttorney, as_user_id: "${atty_r}", captures: { letter: $.data.id } }
            - { call: "POST /intake/engagement-letters/${letter}/transition", payload: { action: "ISSUE" }, as: ResponsibleAttorney, as_user_id: "${atty_r}" }
            - { call: "GET /intake/matters/${m}/retainer-deposits", as: BillingClerk, captures: { dep: "$.data[0].id", pre_received: "$.data[0].received_cents", pre_status: "$.data[0].status" } }
          trigger:
            - { call: "POST /intake/retainer-deposits/${dep}/transition", payload: { action: "FUND", amount_cents: 500000 }, as: BillingClerk, captures: { mid_received: $.data.received_cents, mid_status: $.data.status } }
            - { call: "POST /intake/retainer-deposits/${dep}/transition", payload: { action: "REFUND", amount_cents: 500000 }, as: BillingClerk, captures: { end_received: $.data.received_cents, end_status: $.data.status, end_funded: $.data.funded_total_cents, end_refunded: $.data.refunded_total_cents } }
          assert:
            - "pre_received == 0 and pre_status == PENDING"
            - "mid_received == 500000 and mid_status == PARTIALLY_FUNDED"
            - "end_received == 0 == pre_received and end_status == PENDING == pre_status (FUND(x)+REFUND(x) conserves received_cents)"
            - "end_funded == 500000 and end_refunded == 500000 (cumulative totals prove the round trip, no drift)"

      - name: wall_exclude_release_conservation
        grounds:
          - state_machines.EthicalWall.ACTIVE_to_LIFTED
          - entities.EthicalWall.fields.excluded_attorney_ids
        distinguishing_aspect: |
          Conserved quantity = access cardinality: the excluded_attorney_ids set. A forward EXCLUDE(a)
          paired with its compensating RELEASE(a) returns the exclusion set to exactly its pre-pair contents
          while the wall stays ACTIVE (only version advances — observable mutation, zero net access change).
        test_recipe:
          setup:
            - "Matter M (INTAKE) has an ACTIVE wall excluding [A1]; attorneys A1, A2 exist"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Wall Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p_c: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_r: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Aaron Alpha", bar_number: "BAR003", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_a: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Bella Beta", bar_number: "BAR004", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_b: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Pat Partner", bar_number: "BAR002", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { atty_cp: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p_c}", responsible_attorney_id: "${atty_r}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id } }
            - { call: "POST /intake/matters/${m}/ethical-walls", payload: { reason: "CLIENT_REQUEST", excluded_attorney_ids: ["${atty_a}"], memo: "client requested screen" }, as: ConflictsPartner, as_user_id: "${atty_cp}", captures: { wall: $.data.id, excl0: $.data.excluded_attorney_ids, wv0: $.data.version } }
          trigger:
            - { call: "POST /intake/ethical-walls/${wall}/transition", payload: { action: "EXCLUDE", attorney_id: "${atty_b}" }, as: ConflictsPartner, as_user_id: "${atty_cp}", captures: { excl1: $.data.excluded_attorney_ids, wv1: $.data.version, st1: $.data.status } }
            - { call: "POST /intake/ethical-walls/${wall}/transition", payload: { action: "RELEASE", attorney_id: "${atty_b}" }, as: ConflictsPartner, as_user_id: "${atty_cp}", captures: { excl2: $.data.excluded_attorney_ids, wv2: $.data.version, st2: $.data.status } }
          assert:
            - "excl0 == [${atty_a}] and wv0 == 1"
            - "excl1 contains exactly [${atty_a}, ${atty_b}] and st1 == ACTIVE and wv1 == 2"
            - "excl2 == [${atty_a}] == excl0 (EXCLUDE+RELEASE conserves the exclusion set) and st2 == ACTIVE and wv2 == 3"
