      - name: proof_three_dimensions_resolve_independently_into_derived_state
        grounds:
          - state_machines.PrinterProof.PROOF_IN_REVIEW_to_PROOF_IN_REVIEW
          - state_machines.PrinterProof.PROOF_IN_REVIEW_to_PROOF_APPROVED
          - calculations.proof_state_resolution
          - calculations.proof_color_tolerance_verdict
          - entities.PrinterProof.fields.color_status
          - entities.PrinterProof.fields.substrate_status
          - entities.PrinterProof.fields.press_check_status
          - entities.PrinterProof.fields.proof_state
        distinguishing_aspect: |
          This is the PARALLEL instance: PrinterProof carries three independent
          status dimensions (colour, substrate, press check) whose combined
          proof_state is re-derived after every single-dimension write, so the proof
          self-transitions PROOF_IN_REVIEW -> PROOF_IN_REVIEW twice and only reaches
          PROOF_APPROVED when the third dimension lands - unlike the cyclic revision
          loop, no counter is involved and the three writes commute.
