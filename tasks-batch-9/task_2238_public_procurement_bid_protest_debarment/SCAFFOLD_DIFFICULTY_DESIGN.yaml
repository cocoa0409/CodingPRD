  - rule_id: resource_temporal_overlap
    instances:
      - name: hearing_room_rejects_an_exactly_adjacent_booking_inside_the_changeover_buffer
        grounds:
          - validations[priority=35]
          - errors[ERR_HEARING_ROOM_CONFLICT]
          - entities.ProtestHearing.fields.room_code
          - entities.ProtestHearing.fields.scheduled_end_utc
          - endpoints[POST /procurement/protests/{id}/hearings]
        distinguishing_aspect: |
          The contended resource is ProtestHearing.room_code and the interval semantics are
          PAIRWISE BUFFERED HALF-OPEN: [start, end) compared against each other booking
          individually, widened by a 30-minute changeover buffer on both sides, so a
          candidate starting at exactly the incumbent's end instant (11:00:00Z against an
          11:00:00Z end) still conflicts. Nothing about the officer's daily total is at
          issue here.
        test_recipe:
          setup:
            - "logical clock starts at its default 2026-08-01T00:00:00Z"
            - "one Vendor V20 with protest_fee_balance_cents 100000"
            - "two Solicitations S16 and S17, each with estimated_value_cents 10000000 and original_bid_due_utc 2026-08-27T00:00:00Z, both issued by U-OFFICER-1"
            - "V20 filed one PENDING QuestionSubmission on each solicitation, giving it PROSPECTIVE_BIDDER standing"
            - "Protest P10 on S16 and Protest P11 on S17, each SOLICITATION_IMPROPRIETY with filing_fee_cents 35638, leaving V20's balance at 28724"
            - "each protest received an AGENCY_REPORT record item from U-OFFICER-1, so both are UNDER_REVIEW"
            - "hearing H6 is scheduled on P10 for U-HEARING-1 from 2026-08-28T09:00:00Z to 11:00:00Z in ROOM-A (120 minutes of that officer's docket)"
