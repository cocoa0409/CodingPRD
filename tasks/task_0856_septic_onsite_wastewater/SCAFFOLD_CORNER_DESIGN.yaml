  - section: validations
    instances:
      - name: corner_missing_role_header_returns_unauthenticated_before_any_other_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request carrying no X-User-Role header against a non-existent parcel returns ERR_UNAUTHENTICATED 401, not ERR_PARCEL_NOT_FOUND 404 - authentication at priority 1 outranks existence at priority 3."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /parcels/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: Applicant
              captures: { err: $.data.error_id }
          assert:
            - "the request is sent with NO X-User-Role and NO X-User-ID header"
            - "${err} == ERR_UNAUTHENTICATED with HTTP 401"

      - name: corner_wrong_role_returns_unauthorized_before_existence_lookup
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "An Applicant calling the HealthOfficer-only issue endpoint with a repair-order id that does not exist receives ERR_UNAUTHORIZED 403 rather than ERR_REPAIR_ORDER_NOT_FOUND 404, proving authorization at priority 2 runs before existence at priority 3."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /repair-orders/00000000-0000-4000-8000-000000000003/issue"
              payload: {}
              as: Applicant
              as_user_id: "u-app-9"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNAUTHORIZED with HTTP 403"

      - name: corner_pagination_limit_above_maximum_returns_invalid_request
        claim_type: Violation to Error
        grounds:
          - validations[priority=5]
          - response_envelope.pagination_defaults
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "limit 101 exceeds the declared maximum of 100 and limit 0 falls below the minimum of 1; both return ERR_INVALID_REQUEST 400 rather than silently clamping."
        test_recipe:
          setup:
            - "One parcel exists."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-V3", county_code: "OR", site_address: "56 Page Place", lot_size_sqft: 20000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
          trigger:
            - call: "GET /parcels"
              payload: { limit: 101, offset: 0 }
              as: RecordsClerk
              as_user_id: "u-rc-1"
              captures: { err1: $.data.error_id }
            - call: "GET /parcels"
              payload: { limit: 1, offset: -1 }
              as: RecordsClerk
              as_user_id: "u-rc-1"
              captures: { err2: $.data.error_id }
          assert:
            - "${err1} == ERR_INVALID_REQUEST with HTTP 400"
            - "${err2} == ERR_INVALID_REQUEST with HTTP 400"

      - name: corner_expired_site_evaluation_blocks_design_submit
        claim_type: Temporal validation
        grounds:
          - validations[priority=16]
          - errors[ERR_SITE_EVALUATION_EXPIRED]
          - entities.SiteEvaluation.fields.valid_until
        distinguishing_aspect: "The evaluation dated 2026-04-15 is valid until 2031-04-15T00:00:00.000Z; with the clock moved to 2031-05-01 the design submit is refused with ERR_SITE_EVALUATION_EXPIRED 409 even though the evaluation is still APPROVED."
        test_recipe:
          setup:
            - "A parcel with an APPROVED site evaluation dated 2026-04-15 and a DRAFT design drawn from it."
            - "The logical clock has been advanced to 2031-05-01T00:00:00Z, past the evaluation's valid_until."
