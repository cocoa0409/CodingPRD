- section: validations
  instances:
  - name: missing_auth_headers_returns_unauthenticated
    claim_type: violation_to_error
    grounds:
    - validations[priority=1]
    - errors[ERR_UNAUTHENTICATED]
    distinguishing_aspect: No X-User-Role header on a protected endpoint returns 401 ERR_UNAUTHENTICATED before any other check.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls:
      - *id001
      trigger:
      - call: GET /stations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2
        as: ''
        captures:
          err: $.data.error_id
      assert:
      - response 401, captured ${err} == "ERR_UNAUTHENTICATED"
  - name: register_duplicate_email_rejected
    claim_type: violation_to_error
    grounds:
    - validations[priority=7]
    - errors[ERR_DUPLICATE_EMAIL]
    distinguishing_aspect: Second registration with the same email is rejected 409 ERR_DUPLICATE_EMAIL; the driver table keeps exactly one row
      for the address.
    test_recipe:
      setup:
