            - "MilkLot.${l1}.dispensed_ml == 600 and a fresh GET reports available_ml == 600 and release_status == RELEASED"
            - "Prescription.${rx1}.cumulative_dispensed_ml == 600 and remaining_ml == 600 and status == PARTIALLY_FILLED"
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_shipment_version_refuses_the_second_container_log_then_the_fresh_version_lands_it
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[donation-log-stale-shipment]
          - errors[ERR_STALE_VERSION]
          - endpoints[POST /milk-bank/shipments/{id}/donations]
          - complexity_profile.complexity_layers
        distinguishing_aspect: "The §1.2.1 rule donation-log-stale-shipment guards the container log with expected_shipment_version: replaying the version that was read before the first container was logged returns ERR_STALE_VERSION 412 and writes nothing, while the version read after that first log lets the identical body through - proving the Shipment version advances by exactly one per accepted write."
        test_recipe:
          setup:
            - "Clock 2026-08-05T08:00:00Z; donor DNR-0001 (zone Z2) is QUALIFIED."
            - "Cooler TRK-0001 (2 containers, no dry ice, declared 2400 ml, shipped 2026-08-02) was received ACCEPTED with excursion 0 and -18.0 C, verified 2400 ml, so containers may be logged."
          setup_api_calls:
            - { call: "POST /milk-bank/_clock/set_current_utc", payload: { current_utc: "2026-08-05T08:00:00Z" }, as: MilkBankAdmin, as_user_id: "u-admin-1" }
            - { call: "POST /milk-bank/donors", payload: { donor_code: "DNR-0001", full_name: "Ana Ruiz", email: "ana.ruiz@example.org", zone_code: "Z2" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { d1: "$.data.id" } }
            - { call: "POST /milk-bank/donors/${d1}/health-history", payload: { medication_flag_count: 2, travel_risk_flag: false, tobacco_use: false, alcohol_units_per_week: 3, months_postpartum: 15 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
            - { call: "POST /milk-bank/donors/${d1}/serology-panels", payload: { collected_on: "2026-07-20", hiv_result: "NON_REACTIVE", htlv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/physician-approvals", payload: { physician_npi: "1234567893", approved_on: "2026-07-15" }, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/donors/${d1}/qualify", payload: {}, as: MedicalDirector, as_user_id: "u-md-1" }
            - { call: "POST /milk-bank/shipments", payload: { donor_id: "${d1}", tracking_code: "TRK-0001", container_count: 2, uses_dry_ice: false, declared_volume_ml: 2400, shipped_on: "2026-08-02" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { s1: "$.data.id" } }
            - { call: "POST /milk-bank/shipments/${s1}/receive", payload: { excursion_minutes: 0, arrival_max_temp_celsius: -18.0, verified_volume_ml: 2400 }, as: IntakeCoordinator, as_user_id: "u-intake-1" }
          trigger:
            - { call: "GET /milk-bank/shipments/${s1}", payload: {}, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { sv1: "$.data.version" } }
            - { call: "POST /milk-bank/shipments/${s1}/donations", payload: { container_label: "C1", expressed_on: "2026-07-10", volume_ml: 1200, kcal_per_oz: 20.0, milk_class: "TERM", expected_shipment_version: "${sv1}" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { dn1: "$.data.id" } }
            - { call: "POST /milk-bank/shipments/${s1}/donations", payload: { container_label: "C2", expressed_on: "2026-07-10", volume_ml: 1200, kcal_per_oz: 20.0, milk_class: "TERM", expected_shipment_version: "${sv1}" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { e1: "$.data.error_id" } }
            - { call: "GET /milk-bank/shipments/${s1}", payload: {}, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { sv2: "$.data.version" } }
            - { call: "POST /milk-bank/shipments/${s1}/donations", payload: { container_label: "C2", expressed_on: "2026-07-10", volume_ml: 1200, kcal_per_oz: 20.0, milk_class: "TERM", expected_shipment_version: "${sv2}" }, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { dn2: "$.data.id" } }
            - { call: "GET /milk-bank/shipments/${s1}", payload: {}, as: IntakeCoordinator, as_user_id: "u-intake-1", captures: { sv3: "$.data.version" } }
          assert:
            - "second response: http_status == 201 and data.container_label == C1 and data.remaining_ml == 1200"
            - "${e1} == ERR_STALE_VERSION with http_status 412"
            - "${sv2} == ${sv1} + 1 (only the accepted C1 log advanced the Shipment)"
            - "GET /milk-bank/donations returns total_count == 1 in the response taken immediately after the 412, so the refused call stored no Donation"
            - "fifth response: http_status == 201 and data.container_label == C2 and data.shipment_id == ${s1}"
            - "${sv3} == ${sv1} + 2 and Donation.${dn2}.remaining_ml == 1200"
            - "Shipment.${s1}.status == ACCEPTED and final_reimbursement_cents == 2400 and estimated_reimbursement_cents == 2400 (1850/2 = 925, +275 = 1200, rounded per container, x2)"
            - "GET /milk-bank/donations returns total_count == 2 with the ${dn1} and ${dn2} rows"
