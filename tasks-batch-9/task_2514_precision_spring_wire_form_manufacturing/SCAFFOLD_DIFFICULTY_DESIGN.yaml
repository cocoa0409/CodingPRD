      - name: tooling_cents_conserved_and_status_reverted_across_ship_then_return
        conserved_quantity: "ToolingAsset.original_cost_cents == unamortized_cents + recovered_cents, in integer cents, before and after the reversal"
        grounds:
          - calculations.tooling_amortization_recovery
          - state_machines.ShipmentLot.PACKED_to_SHIPPED
          - state_machines.ShipmentLot.SHIPPED_to_RETURNED
          - state_machines.ToolingAsset.AMORTIZING_to_FULLY_AMORTIZED
          - entities.ShipmentLot.fields.tooling_recovery_cents
        distinguishing_aspect: |
          A different conserved quantity (integer CENTS on the tooling ledger, not kilograms) and a compensation
          that must also undo a STATE change: a 1000-piece shipment against a 1000-cent tool drives
          unamortized_cents to exactly 0 and flips the tool to FULLY_AMORTIZED, and the return must post the stored
          1000 cents back verbatim AND walk the tool back to AMORTIZING, while the lot keeps tooling_recovery_cents
          1000 as the historical posting. Recomputing the recovery at return time instead of reusing the stored
          value would drift, because open_commitment_pieces has moved in between.
        test_recipe:
          setup:
            - "A fully PPAP-approved AUTOMOTIVE_SAFETY program (committed 500000, MOQ 1000) on FORECAST_BASIS, quoted at 26000 pieces against a deliberately cheap 1000-cent re-cut tool, so amort_per_piece_cents freezes at 1."
            - "A COMPLETE, peened, in-control 26000-piece run with produced_pieces 25500 and one PACKED 1000-piece lot."
          setup_api_calls:
            - call: "POST /customer-programs"
              payload: { program_code: "PGM-AUTO-7", customer_name: "Northwind Drivetrain", application_class: "AUTOMOTIVE_SAFETY", ppap_level: 3, committed_pieces: 500000, minimum_order_quantity: 1000, required_salt_spray_hours: 96, biocompatibility_required: false, min_fatigue_margin: 1.2, required_ppk: 1.33, amortization_method: "FORECAST_BASIS" }
              as: ProgramManager
              captures: { prog_id: $.data.id, prog_v: $.data.version }
