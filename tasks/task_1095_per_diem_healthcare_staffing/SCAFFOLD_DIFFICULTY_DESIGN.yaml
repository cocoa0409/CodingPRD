  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: order_cancel_four_link_cascade_to_reliability_score
        grounds:
          - state_machines.StaffingOrder.OPEN_to_CANCELLED
          - state_machines.Shift.ASSIGNED_to_CANCELLED
          - state_machines.Assignment.CONFIRMED_to_CANCELLED_BY_FACILITY
          - state_machines.Assignment.UNBILLED_to_WAIVED
          - calculations.cancellation_penalty_tier
          - calculations.reliability_score
          - entities.ReliabilityEvent.fields.credit_points
          - entities.Clinician.fields.provisional_reliability_score
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /staffing/orders/{id}/cancel: the order cancel mutates
          its Shifts (link 1); BECAUSE a Shift became CANCELLED its live Assignment moves to
          CANCELLED_BY_FACILITY/WAIVED (link 2); BECAUSE that Assignment was cancelled by the
          facility a FACILITY_CANCELLATION_CREDIT ReliabilityEvent is appended (link 3); BECAUSE
          that event was appended reliability_recompute rewrites the clinician's scores, taking
          provisional_reliability_score from 70 to 72 (link 4).
