        distinguishing_aspect: "After one reinstatement (reinstatement_count == 1 == MAX_REINSTATEMENTS) a second default cannot be reinstated: ERR_REINSTATEMENT_LIMIT (409) and the agreement stays DEFAULTED."
        test_recipe:
