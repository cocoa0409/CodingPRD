          rationale: "ERR_ISF_NOT_FILED winning over ERR_BOND_SATURATED is asserted by the named §1.8 priority-conflict instance."

      - name: bond_insufficient_strictly_above_boundary_stub
        claim_type: Violation → Error
        grounds:
          - validations[priority=14]
          - errors[ERR_BOND_INSUFFICIENT]
        excluded_because:
          difficulty_instance: boundary_precision_check / bond_insufficient_strictly_above_vs_saturate_at_equal
          rationale: "ERR_BOND_INSUFFICIENT at limit 54799 vs saturate at 54800 boundary is asserted by the named §1.8 boundary instance."

      - name: file_zero_lines_no_lines_boundary_stub
        claim_type: Violation → Error
        grounds:
          - state_machines.CustomsEntry.DRAFT_to_FILED
          - errors[ERR_NO_LINES]
        excluded_because:
          difficulty_instance: boundary_precision_check / file_with_zero_lines_empty_set_rejected
          rationale: "ERR_NO_LINES on filing a zero-line entry is asserted by the named §1.8 empty-set boundary instance."

      - name: pga_not_cleared_blocks_release_cross_entity_stub
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=8]
          - errors[ERR_PGA_NOT_CLEARED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / entry_release_blocked_by_pga_review_state
          rationale: "ERR_PGA_NOT_CLEARED blocking release while a PGAReview is HOLD is asserted by the named §1.8 cross-entity instance."

      - name: statement_settle_blocked_until_liquidated_cross_entity_stub
        claim_type: Cross-entity validation
        grounds:
