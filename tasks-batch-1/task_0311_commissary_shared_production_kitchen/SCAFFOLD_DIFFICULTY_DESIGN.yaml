# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Commissary & Shared Production Kitchen (Expert)
# 9 rule_ids × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: batch_estimated_vs_actual_food_cost_diverge
        grounds:
          - calculations.actual_food_cost
          - calculations.estimated_food_cost
          - entities.ProductionBatch.fields.estimated_food_cost_cents
          - entities.ProductionBatch.fields.actual_food_cost_cents
        distinguishing_aspect: |
          Same batch, two food-cost algorithms: estimate (round-per-line on planned qty, no spoilage)
          vs actual (round-per-line on actual qty + 5% spoilage adder). On entity domain ProductionBatch,
          estimated_food_cost_cents == 3199 while actual_food_cost_cents == 7065 — they diverge.
        test_recipe:
          setup:
            - "Member m1 ACTIVE PREMIUM with wallet topped up to 1000000 cents"
            - "Ingredients A(333c), B(1299c), C(845c) created with on_hand high enough"
            - "Recipe r1 batch_yield_units=40 with components A:2.5, B:1.333, C:0.75, PUBLISHED"
            - "Batch b1 planned yield 40 (scale 1.0) -> estimated_food_cost_cents=3199, started"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M1", email: "m1@x.com", plan_tier: "PREMIUM" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members/${m1}/wallet/top-ups"
              payload: { amount_cents: 1000000 }
              as: MemberOperator
              as_user_id: "${m1}"
              captures: { m1v: $.data.version }
            - call: "POST /ingredients"
              payload: { name: "A", unit_cost_cents: 333 }
              as: FacilityManager
              captures: { ingA: $.data.id }
            - call: "POST /ingredients"
              payload: { name: "B", unit_cost_cents: 1299 }
              as: FacilityManager
              captures: { ingB: $.data.id }
            - call: "POST /ingredients"
              payload: { name: "C", unit_cost_cents: 845 }
              as: FacilityManager
              captures: { ingC: $.data.id }
            - call: "POST /members/${m1}/ingredient-orders"
              payload: { ingredient_id: "${ingA}", order_qty: 100, unit_cost_cents: 333 }
              as: MemberOperator
              as_user_id: "${m1}"
              captures: { oA: $.data.id }
            - call: "POST /members/${m1}/ingredient-orders/${oA}/receive"
              payload: {}
              as: MemberOperator
              as_user_id: "${m1}"
            - call: "POST /members/${m1}/ingredient-orders"
              payload: { ingredient_id: "${ingB}", order_qty: 100, unit_cost_cents: 1299 }
              as: MemberOperator
              as_user_id: "${m1}"
              captures: { oB: $.data.id }
            - call: "POST /members/${m1}/ingredient-orders/${oB}/receive"
              payload: {}
              as: MemberOperator
              as_user_id: "${m1}"
            - call: "POST /members/${m1}/ingredient-orders"
              payload: { ingredient_id: "${ingC}", order_qty: 100, unit_cost_cents: 845 }
              as: MemberOperator
              as_user_id: "${m1}"
              captures: { oC: $.data.id }
            - call: "POST /members/${m1}/ingredient-orders/${oC}/receive"
              payload: {}
              as: MemberOperator
              as_user_id: "${m1}"
            - call: "POST /members/${m1}/recipes"
              payload: { name: "R1", batch_yield_units: 40 }
              as: MemberOperator
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
            - call: "POST /members/${m1}/recipes/${r1}/components"
              payload: { ingredient_id: "${ingA}", planned_qty: 2.5 }
              as: MemberOperator
              as_user_id: "${m1}"
            - call: "POST /members/${m1}/recipes/${r1}/components"
              payload: { ingredient_id: "${ingB}", planned_qty: 1.333 }
              as: MemberOperator
              as_user_id: "${m1}"
            - call: "POST /members/${m1}/recipes/${r1}/components"
              payload: { ingredient_id: "${ingC}", planned_qty: 0.75 }
              as: MemberOperator
              as_user_id: "${m1}"
            - call: "POST /members/${m1}/recipes/${r1}/publish"
              payload: {}
              as: MemberOperator
              as_user_id: "${m1}"
            - call: "POST /members/${m1}/batches"
              payload: { recipe_id: "${r1}", planned_yield_units: 40 }
              as: MemberOperator
              as_user_id: "${m1}"
              captures: { b1: $.data.id, est: $.data.estimated_food_cost_cents }
            - call: "POST /members/${m1}/batches/${b1}/start"
              payload: {}
              as: MemberOperator
              as_user_id: "${m1}"
          trigger:
            - call: "POST /members/${m1}/batches/${b1}/complete"
              payload: { actual_yield_units: 40, actual_components: [ { ingredient_id: "${ingA}", actual_qty: 6.0 }, { ingredient_id: "${ingB}", actual_qty: 2.666 }, { ingredient_id: "${ingC}", actual_qty: 1.5 } ] }
              as: MemberOperator
              as_user_id: "${m1}"
              captures: { act: $.data.actual_food_cost_cents }
          assert:
            - "ProductionBatch.${b1}.estimated_food_cost_cents == 3199"
            - "ProductionBatch.${b1}.actual_food_cost_cents == 7065"
            - "ProductionBatch.${b1}.estimated_food_cost_cents != ProductionBatch.${b1}.actual_food_cost_cents"

      - name: invoice_period_rollup_vs_wallet_running_balance
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.total_cents
          - entities.Member.fields.wallet_balance_cents
          - entities.Member.fields.lifetime_charged_cents
        distinguishing_aspect: |
          Same money charged, two algorithms on different entity domains: Invoice rolls the period as a
          forward snapshot (subtotal->discount->fee) giving total_cents=4532, while Member.wallet runs a
          chronological accumulator giving lifetime_charged_cents=4400 (no platform fee/discount in the wallet) —
          the two figures differ because the invoice adds a 3% platform fee the wallet never charged.
        test_recipe:
          setup:
            - "Member m2 ACTIVE STANDARD, wallet topped to 100000"
            - "Station prep1 PREP_TABLE OPEN; one COMPLETED booking offpeak 120 min fee 2400 (wallet charged 2400)"
            - "One ACTIVE DRY storage assignment 5 slots standard monthly_fee 2000 (no wallet charge — billed via invoice)"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M2", email: "m2@x.com", plan_tier: "STANDARD" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /members/${m2}/wallet/top-ups"
              payload: { amount_cents: 100000 }
              as: MemberOperator
              as_user_id: "${m2}"
              captures: { m2v: $.data.version }
            - call: "POST /stations"
              payload: { name: "Prep1", station_class: "PREP_TABLE" }
              as: FacilityManager
              captures: { st1: $.data.id }
            - call: "POST /storage-units"
              payload: { name: "Dry1", temp_class: "DRY", total_slots: 20, temp_min_c: 10.0, temp_max_c: 25.0 }
              as: FacilityManager
              captures: { du1: $.data.id }
            - call: "POST /members/${m2}/bookings"
              payload: { station_id: "${st1}", start_utc: "2026-07-01T12:00:00.000Z", end_utc: "2026-07-01T14:00:00.000Z", expected_member_version: "${m2v}" }
              as: MemberOperator
              as_user_id: "${m2}"
              captures: { bk1: $.data.id }
            - call: "POST /members/${m2}/bookings/${bk1}/complete"
              payload: {}
              as: MemberOperator
              as_user_id: "${m2}"
            - call: "GET /members/${m2}"
              payload: {}
              as: MemberOperator
              as_user_id: "${m2}"
              captures: { m2v2: $.data.version }
            - call: "POST /members/${m2}/storage-assignments"
              payload: { temp_class: "DRY", requested_slots: 5, expected_member_version: "${m2v2}" }
              as: MemberOperator
              as_user_id: "${m2}"
              captures: { sa1: $.data.id }
          trigger:
            - call: "POST /members/${m2}/invoices"
              payload: { period_start_utc: "2026-07-01T00:00:00.000Z", period_end_utc: "2026-08-01T00:00:00.000Z" }
              as: FacilityManager
              captures: { inv1: $.data.id, tot: $.data.total_cents }
          assert:
            - "Invoice.${inv1}.subtotal_cents == 4400"
            - "Invoice.${inv1}.platform_fee_cents == 132"
            - "Invoice.${inv1}.total_cents == 4532"
            - "Member.${m2}.lifetime_charged_cents == 2400"
            - "Invoice.${inv1}.total_cents != Member.${m2}.lifetime_charged_cents"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: booking_fee_tiered_rate_peak_turnover_nonlinear
        grounds:
          - calculations.booking_fee
          - entities.Booking.fields.fee_cents
          - entities.Booking.fields.is_peak
          - entities.Booking.fields.turnover_applied
        distinguishing_aspect: |
          Mode (a): >=3 inputs (station_class rate, peak multiplier, duration) interact non-linearly via
          tiered-rate selection and a conditional flat surcharge — peak oven 60 min with turnover yields
          fee_cents == 5300 (3000*1.0h*1.5 + 800), not a linear function of any single input.
        test_recipe:
          setup:
            - "Member m3 ACTIVE PREMIUM wallet 100000"
            - "Station oven1 CONVECTION_OVEN OPEN, turnover_buffer 30"
            - "Existing COMPLETED booking on oven1 09:30-10:00 so the new 10:00-11:00 booking abuts within the 30-min buffer (turnover_applied=true)"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M3", email: "m3@x.com", plan_tier: "PREMIUM" }
              as: Anonymous
              captures: { m3: $.data.id }
            - call: "POST /members/${m3}/wallet/top-ups"
              payload: { amount_cents: 100000 }
              as: MemberOperator
              as_user_id: "${m3}"
              captures: { m3v: $.data.version }
            - call: "POST /stations"
              payload: { name: "Oven1", station_class: "CONVECTION_OVEN", turnover_buffer_minutes: 30 }
              as: FacilityManager
              captures: { ov1: $.data.id }
            - call: "POST /members/${m3}/bookings"
              payload: { station_id: "${ov1}", start_utc: "2026-07-02T09:30:00.000Z", end_utc: "2026-07-02T10:00:00.000Z", expected_member_version: "${m3v}" }
              as: MemberOperator
              as_user_id: "${m3}"
              captures: { bprev: $.data.id }
            - call: "POST /members/${m3}/bookings/${bprev}/complete"
              payload: {}
              as: MemberOperator
              as_user_id: "${m3}"
            - call: "GET /members/${m3}"
              payload: {}
              as: MemberOperator
              as_user_id: "${m3}"
              captures: { m3v2: $.data.version }
          trigger:
            - call: "POST /members/${m3}/bookings"
              payload: { station_id: "${ov1}", start_utc: "2026-07-02T10:00:00.000Z", end_utc: "2026-07-02T11:00:00.000Z", expected_member_version: "${m3v2}" }
              as: MemberOperator
              as_user_id: "${m3}"
              captures: { bk: $.data.id }
          assert:
            - "Booking.${bk}.is_peak == true"
            - "Booking.${bk}.turnover_applied == true"
            - "Booking.${bk}.fee_cents == 5300"

      - name: invoice_eval_order_discount_vs_fee_circular
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.subtotal_cents
          - entities.Invoice.fields.loyalty_discount_cents
          - entities.Invoice.fields.platform_fee_cents
          - entities.Invoice.fields.total_cents
        distinguishing_aspect: |
          Mode (c): discount keyed on subtotal tier and platform fee keyed on subtotal form a circular-looking
          dependency; the pinned order (subtotal -> discount(subtotal tier) -> fee(subtotal) -> total) makes the
          result well-defined: subtotal 20000 -> discount 1000 (5% MID tier) -> fee 600 -> total 19600.
        test_recipe:
          setup:
            - "Member m4 ACTIVE STANDARD, no bookings, no batches"
            - "One ACTIVE DRY storage assignment of 50 slots (monthly_fee 20000) so subtotal == 20000 exactly (MID tier boundary)"
            - "Storage unit Dry50 with 50 total slots so the 50-slot request fits in a single unit"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M4", email: "m4@x.com", plan_tier: "STANDARD" }
              as: Anonymous
              captures: { m4: $.data.id, m4v0: $.data.version }
            - call: "POST /storage-units"
              payload: { name: "Dry50", temp_class: "DRY", total_slots: 50, temp_min_c: 10.0, temp_max_c: 25.0 }
              as: FacilityManager
              captures: { du50: $.data.id }
            - call: "POST /members/${m4}/storage-assignments"
              payload: { temp_class: "DRY", requested_slots: 50, expected_member_version: "${m4v0}" }
              as: MemberOperator
              as_user_id: "${m4}"
              captures: { sa4: $.data.id }
          trigger:
            - call: "POST /members/${m4}/invoices"
              payload: { period_start_utc: "2026-07-01T00:00:00.000Z", period_end_utc: "2026-08-01T00:00:00.000Z" }
              as: FacilityManager
              captures: { inv4: $.data.id }
          assert:
            - "Invoice.${inv4}.subtotal_cents == 20000"
            - "Invoice.${inv4}.loyalty_discount_cents == 1000"
            - "Invoice.${inv4}.platform_fee_cents == 600"
            - "Invoice.${inv4}.total_cents == 19600"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: recipe_cyclic_revise_loop_bumps_version
        grounds:
          - state_machines.Recipe.PUBLISHED_to_DRAFT
          - state_machines.Recipe.DRAFT_to_PUBLISHED
          - entities.Recipe.fields.version
        distinguishing_aspect: |
          Cyclic shape on Recipe: DRAFT->PUBLISHED->DRAFT->PUBLISHED loop; each revise bumps Recipe.version,
          so after publish/revise/publish the version is 2 while status returns to PUBLISHED (a loop, not a linear pipeline).
        test_recipe:
          setup:
            - "Member m5 ACTIVE; recipe r5 DRAFT with one component, published once (version 1)"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M5", email: "m5@x.com" }
              as: Anonymous
              captures: { m5: $.data.id }
            - call: "POST /ingredients"
              payload: { name: "Flour", unit_cost_cents: 200 }
              as: FacilityManager
              captures: { ing5: $.data.id }
            - call: "POST /members/${m5}/recipes"
              payload: { name: "R5", batch_yield_units: 10 }
              as: MemberOperator
              as_user_id: "${m5}"
              captures: { r5: $.data.id }
            - call: "POST /members/${m5}/recipes/${r5}/components"
              payload: { ingredient_id: "${ing5}", planned_qty: 1.0 }
              as: MemberOperator
              as_user_id: "${m5}"
            - call: "POST /members/${m5}/recipes/${r5}/publish"
              payload: {}
              as: MemberOperator
              as_user_id: "${m5}"
          trigger:
            - call: "POST /members/${m5}/recipes/${r5}/revise"
              payload: {}
              as: MemberOperator
              as_user_id: "${m5}"
              captures: { vrev: $.data.version }
            - call: "POST /members/${m5}/recipes/${r5}/publish"
              payload: {}
              as: MemberOperator
              as_user_id: "${m5}"
              captures: { vpub: $.data.version }
          assert:
            - "Recipe.${r5}.status == PUBLISHED"
            - "Recipe.${r5}.version == 2"

      - name: production_batch_branch_complete_vs_scrap
        grounds:
          - state_machines.ProductionBatch.IN_PRODUCTION_to_COMPLETED
          - state_machines.ProductionBatch.IN_PRODUCTION_to_SCRAPPED
          - entities.ProductionBatch.fields.production_fee_cents
        distinguishing_aspect: |
          Branching fork-join on ProductionBatch (different entity than Recipe): from IN_PRODUCTION the two
          branches COMPLETED vs SCRAPPED have divergent side-effects — COMPLETE charges production_fee and
          consumes stock, SCRAP charges nothing and leaves stock untouched.
        test_recipe:
          setup:
            - "Member m6 ACTIVE wallet 100000; ingredient stocked; recipe r6 PUBLISHED; two batches both IN_PRODUCTION"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M6", email: "m6@x.com" }
              as: Anonymous
              captures: { m6: $.data.id }
            - call: "POST /members/${m6}/wallet/top-ups"
              payload: { amount_cents: 100000 }
              as: MemberOperator
              as_user_id: "${m6}"
            - call: "POST /ingredients"
              payload: { name: "Sugar", unit_cost_cents: 100 }
              as: FacilityManager
              captures: { ing6: $.data.id }
            - call: "POST /members/${m6}/ingredient-orders"
              payload: { ingredient_id: "${ing6}", order_qty: 1000, unit_cost_cents: 100 }
              as: MemberOperator
              as_user_id: "${m6}"
              captures: { o6: $.data.id }
            - call: "POST /members/${m6}/ingredient-orders/${o6}/receive"
              payload: {}
              as: MemberOperator
              as_user_id: "${m6}"
            - call: "POST /members/${m6}/recipes"
              payload: { name: "R6", batch_yield_units: 10 }
              as: MemberOperator
              as_user_id: "${m6}"
              captures: { r6: $.data.id }
            - call: "POST /members/${m6}/recipes/${r6}/components"
              payload: { ingredient_id: "${ing6}", planned_qty: 1.0 }
              as: MemberOperator
              as_user_id: "${m6}"
            - call: "POST /members/${m6}/recipes/${r6}/publish"
              payload: {}
              as: MemberOperator
              as_user_id: "${m6}"
            - call: "POST /members/${m6}/batches"
              payload: { recipe_id: "${r6}", planned_yield_units: 10 }
              as: MemberOperator
              as_user_id: "${m6}"
              captures: { bc: $.data.id }
            - call: "POST /members/${m6}/batches/${bc}/start"
              payload: {}
              as: MemberOperator
              as_user_id: "${m6}"
            - call: "POST /members/${m6}/batches"
              payload: { recipe_id: "${r6}", planned_yield_units: 10 }
              as: MemberOperator
              as_user_id: "${m6}"
              captures: { bs: $.data.id }
            - call: "POST /members/${m6}/batches/${bs}/start"
              payload: {}
              as: MemberOperator
              as_user_id: "${m6}"
          trigger:
            - call: "POST /members/${m6}/batches/${bc}/complete"
              payload: { actual_yield_units: 10, actual_components: [ { ingredient_id: "${ing6}", actual_qty: 10.0 } ] }
              as: MemberOperator
              as_user_id: "${m6}"
              captures: { feec: $.data.production_fee_cents }
            - call: "POST /members/${m6}/batches/${bs}/scrap"
              payload: {}
              as: MemberOperator
              as_user_id: "${m6}"
          assert:
            - "ProductionBatch.${bc}.status == COMPLETED"
            - "ProductionBatch.${bc}.production_fee_cents == 350"
            - "ProductionBatch.${bs}.status == SCRAPPED"
            - "ProductionBatch.${bs}.production_fee_cents == null"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: temp_breach_quarantines_unit_then_assignment
        grounds:
          - state_machines.StorageUnit.EXCURSION_to_QUARANTINED
          - state_machines.StorageAssignment.ACTIVE_to_QUARANTINED
          - calculations.temp_excursion_accumulation
          - entities.StorageAssignment.fields.status
        distinguishing_aspect: |
          Depth-3 cascade from a TempLog POST: reading (A) flips StorageUnit COMPLIANT->EXCURSION, the next
          out-of-range reading pushes excursion_minutes>120 flipping the unit EXCURSION->QUARANTINED (B), and
          that unit transition itself cascades the touching StorageAssignment ACTIVE->QUARANTINED (C). Each hop
          is caused by the previous, not by the original POST.
        test_recipe:
          setup:
            - "StorageUnit cold1 COLD range [0,4]; member m7 has ACTIVE assignment of 3 slots in cold1"
            - "Two prior out-of-range readings 60 min apart already recorded (unit EXCURSION, excursion_minutes=60)"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M7", email: "m7@x.com" }
              as: Anonymous
              captures: { m7: $.data.id, m7v0: $.data.version }
            - call: "POST /storage-units"
              payload: { name: "Cold1", temp_class: "COLD", total_slots: 10, temp_min_c: 0.0, temp_max_c: 4.0 }
              as: FacilityManager
              captures: { cu1: $.data.id }
            - call: "POST /members/${m7}/storage-assignments"
              payload: { temp_class: "COLD", requested_slots: 3, expected_member_version: "${m7v0}" }
              as: MemberOperator
              as_user_id: "${m7}"
              captures: { sa7: $.data.id }
            - call: "POST /storage-units/${cu1}/temp-logs"
              payload: { reading_c: 8.0, reading_utc: "2026-07-03T10:00:00.000Z" }
              as: ComplianceOfficer
            - call: "POST /storage-units/${cu1}/temp-logs"
              payload: { reading_c: 8.0, reading_utc: "2026-07-03T11:00:00.000Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /storage-units/${cu1}/temp-logs"
              payload: { reading_c: 8.0, reading_utc: "2026-07-03T12:05:00.000Z" }
              as: ComplianceOfficer
          assert:
            - "StorageUnit.${cu1}.excursion_minutes == 125"
            - "StorageUnit.${cu1}.compliance_status == QUARANTINED"
            - "StorageAssignment.${sa7}.status == QUARANTINED"

      - name: order_receive_restocks_then_enables_batch_start
        grounds:
          - state_machines.IngredientOrder.PLACED_to_RECEIVED
          - state_machines.ProductionBatch.PLANNED_to_IN_PRODUCTION
          - entities.Ingredient.fields.on_hand_qty
          - entities.ProductionBatch.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (order receive): receiving an IngredientOrder mutates
          Ingredient.on_hand_qty (A->B), and that restock is the precondition that lets a previously stock-blocked
          batch start IN_PRODUCTION (B->C). The batch start is caused by the restock, not the receive call directly.
        test_recipe:
          setup:
            - "Member m8 ACTIVE; ingredient stocked at 0; recipe r8 PUBLISHED needs qty 5; batch b8 PLANNED"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M8", email: "m8@x.com" }
              as: Anonymous
              captures: { m8: $.data.id }
            - call: "POST /ingredients"
              payload: { name: "Butter", unit_cost_cents: 500 }
              as: FacilityManager
              captures: { ing8: $.data.id }
            - call: "POST /members/${m8}/recipes"
              payload: { name: "R8", batch_yield_units: 10 }
              as: MemberOperator
              as_user_id: "${m8}"
              captures: { r8: $.data.id }
            - call: "POST /members/${m8}/recipes/${r8}/components"
              payload: { ingredient_id: "${ing8}", planned_qty: 5.0 }
              as: MemberOperator
              as_user_id: "${m8}"
            - call: "POST /members/${m8}/recipes/${r8}/publish"
              payload: {}
              as: MemberOperator
              as_user_id: "${m8}"
            - call: "POST /members/${m8}/batches"
              payload: { recipe_id: "${r8}", planned_yield_units: 10 }
              as: MemberOperator
              as_user_id: "${m8}"
              captures: { b8: $.data.id }
            - call: "POST /members/${m8}/ingredient-orders"
              payload: { ingredient_id: "${ing8}", order_qty: 5, unit_cost_cents: 500 }
              as: MemberOperator
              as_user_id: "${m8}"
              captures: { o8: $.data.id }
          trigger:
            - call: "POST /members/${m8}/ingredient-orders/${o8}/receive"
              payload: {}
              as: MemberOperator
              as_user_id: "${m8}"
            - call: "POST /members/${m8}/batches/${b8}/start"
              payload: {}
              as: MemberOperator
              as_user_id: "${m8}"
          assert:
            - "Ingredient.${ing8}.on_hand_qty == 5"
            - "ProductionBatch.${b8}.status == IN_PRODUCTION"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: booking_state_vs_fiscal_member_not_active_wins
        grounds:
          - validations[priority=9]
          - validations[priority=22]
          - errors[ERR_MEMBER_NOT_ACTIVE]
          - errors[ERR_INSUFFICIENT_WALLET]
        distinguishing_aspect: |
          Pair {state (priority 9, ERR_MEMBER_NOT_ACTIVE) vs business_fiscal (priority 22, ERR_INSUFFICIENT_WALLET)}:
          a SUSPENDED member with a zero wallet attempts a booking — the lower-numbered state check wins,
          so ERR_MEMBER_NOT_ACTIVE (409) is returned, not ERR_INSUFFICIENT_WALLET.
        test_recipe:
          setup:
            - "Member m9 SUSPENDED with wallet 0; station OPEN"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M9", email: "m9@x.com" }
              as: Anonymous
              captures: { m9: $.data.id, m9v: $.data.version }
            - call: "POST /stations"
              payload: { name: "Prep9", station_class: "PREP_TABLE" }
              as: FacilityManager
              captures: { st9: $.data.id }
            - call: "POST /members/${m9}/suspend"
              payload: { expected_member_version: "${m9v}" }
              as: FacilityManager
              captures: { m9v2: $.data.version }
          trigger:
            - call: "POST /members/${m9}/bookings"
              payload: { station_id: "${st9}", start_utc: "2026-07-04T12:00:00.000Z", end_utc: "2026-07-04T13:00:00.000Z", expected_member_version: "${m9v2}" }
              as: MemberOperator
              as_user_id: "${m9}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_MEMBER_NOT_ACTIVE"

      - name: storage_safety_vs_fiscal_unit_quarantined_wins
        grounds:
          - validations[priority=10]
          - validations[priority=21]
          - errors[ERR_UNIT_QUARANTINED]
          - errors[ERR_STORAGE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Pair {business_safety (priority 10, ERR_UNIT_QUARANTINED) vs business_fiscal (priority 21,
          ERR_STORAGE_CAPACITY_EXCEEDED)} — different category pair than the first instance: a request whose
          only candidate same-class unit is QUARANTINED AND lacks free slots returns the lower-numbered
          ERR_UNIT_QUARANTINED, not the capacity error.
        test_recipe:
          setup:
            - "Single COLD unit cold2 total 2 slots, already QUARANTINED via temp breach; request 5 slots (also exceeds capacity)"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M10", email: "m10@x.com" }
              as: Anonymous
              captures: { m10: $.data.id, m10v: $.data.version }
            - call: "POST /storage-units"
              payload: { name: "Cold2", temp_class: "COLD", total_slots: 2, temp_min_c: 0.0, temp_max_c: 4.0 }
              as: FacilityManager
              captures: { cu2: $.data.id }
            - call: "POST /storage-units/${cu2}/temp-logs"
              payload: { reading_c: 9.0, reading_utc: "2026-07-05T10:00:00.000Z" }
              as: ComplianceOfficer
            - call: "POST /storage-units/${cu2}/temp-logs"
              payload: { reading_c: 9.0, reading_utc: "2026-07-05T12:01:00.000Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /members/${m10}/storage-assignments"
              payload: { temp_class: "COLD", requested_slots: 5, expected_member_version: "${m10v}" }
              as: MemberOperator
              as_user_id: "${m10}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_UNIT_QUARANTINED"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: temp_reading_at_max_inclusive_is_in_range
        grounds:
          - calculations.temp_excursion_accumulation
          - entities.TempLog.fields.in_range
          - entities.StorageUnit.fields.compliance_status
        distinguishing_aspect: |
          Numeric boundary (>= vs >) on the temp metric, reachable via POST /storage-units/{id}/temp-logs:
          a reading exactly at temp_max_c (4.0 in [0,4]) is in_range==true and the unit stays COMPLIANT,
          while 4.1 would breach. Tests the inclusive upper bound.
        test_recipe:
          setup:
            - "COLD unit cold3 range [0.0, 4.0]"
          setup_api_calls:
            - call: "POST /storage-units"
              payload: { name: "Cold3", temp_class: "COLD", total_slots: 5, temp_min_c: 0.0, temp_max_c: 4.0 }
              as: FacilityManager
              captures: { cu3: $.data.id }
          trigger:
            - call: "POST /storage-units/${cu3}/temp-logs"
              payload: { reading_c: 4.0, reading_utc: "2026-07-06T10:00:00.000Z" }
              as: ComplianceOfficer
              captures: { logid: $.data.storage_unit_id }
          assert:
            - "TempLog.in_range == true"
            - "StorageUnit.${cu3}.compliance_status == COMPLIANT"
            - "StorageUnit.${cu3}.excursion_minutes == 0"

      - name: storage_allocation_empty_candidate_pool_rejects
        grounds:
          - calculations.storage_allocation
          - validations[priority=21]
          - errors[ERR_STORAGE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Empty-set boundary on a different metric (candidate-pool count, not a numeric threshold), reached via
          a different endpoint POST /members/{id}/storage-assignments: requesting FROZEN slots when zero FROZEN
          units exist gives an empty candidate set with 0 aggregate free slots -> ERR_STORAGE_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Member m11 ACTIVE; only DRY and COLD units exist, no FROZEN units"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M11", email: "m11@x.com" }
              as: Anonymous
              captures: { m11: $.data.id, m11v: $.data.version }
            - call: "POST /storage-units"
              payload: { name: "DryX", temp_class: "DRY", total_slots: 10, temp_min_c: 10.0, temp_max_c: 25.0 }
              as: FacilityManager
          trigger:
            - call: "POST /members/${m11}/storage-assignments"
              payload: { temp_class: "FROZEN", requested_slots: 1, expected_member_version: "${m11v}" }
              as: MemberOperator
              as_user_id: "${m11}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_STORAGE_CAPACITY_EXCEEDED"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: batch_plan_requires_recipe_published
        grounds:
          - state_machines.ProductionBatch.none_to_PLANNED
          - state_machines.Recipe.DRAFT_to_PUBLISHED
          - validations[priority=16]
          - errors[ERR_RECIPE_NOT_PUBLISHED]
        distinguishing_aspect: |
          Cross-entity pair ProductionBatch->Recipe: a batch may only be PLANNED when the referenced Recipe is
          PUBLISHED; against a DRAFT recipe the create is rejected ERR_RECIPE_NOT_PUBLISHED.
        test_recipe:
          setup:
            - "Member m12 ACTIVE; recipe r12 still DRAFT (never published)"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M12", email: "m12@x.com" }
              as: Anonymous
              captures: { m12: $.data.id }
            - call: "POST /ingredients"
              payload: { name: "Salt", unit_cost_cents: 50 }
              as: FacilityManager
              captures: { ing12: $.data.id }
            - call: "POST /members/${m12}/recipes"
              payload: { name: "R12", batch_yield_units: 10 }
              as: MemberOperator
              as_user_id: "${m12}"
              captures: { r12: $.data.id }
            - call: "POST /members/${m12}/recipes/${r12}/components"
              payload: { ingredient_id: "${ing12}", planned_qty: 1.0 }
              as: MemberOperator
              as_user_id: "${m12}"
          trigger:
            - call: "POST /members/${m12}/batches"
              payload: { recipe_id: "${r12}", planned_yield_units: 10 }
              as: MemberOperator
              as_user_id: "${m12}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_RECIPE_NOT_PUBLISHED"

      - name: assignment_create_requires_unit_not_quarantined
        grounds:
          - state_machines.StorageAssignment.none_to_ACTIVE
          - state_machines.StorageUnit.EXCURSION_to_QUARANTINED
          - validations[priority=10]
          - errors[ERR_UNIT_QUARANTINED]
        distinguishing_aspect: |
          Different cross-entity pair StorageAssignment->StorageUnit: a new assignment whose only matching unit is
          QUARANTINED is rejected ERR_UNIT_QUARANTINED even though slots are free — assignment validity depends on
          the unit's compliance_status, a distinct entity pair from the batch/recipe dependency.
        test_recipe:
          setup:
            - "Single FROZEN unit frz1 total 10 slots, driven to QUARANTINED via temp breach"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M13", email: "m13@x.com" }
              as: Anonymous
              captures: { m13: $.data.id, m13v: $.data.version }
            - call: "POST /storage-units"
              payload: { name: "Frz1", temp_class: "FROZEN", total_slots: 10, temp_min_c: -22.0, temp_max_c: -16.0 }
              as: FacilityManager
              captures: { fu1: $.data.id }
            - call: "POST /storage-units/${fu1}/temp-logs"
              payload: { reading_c: 0.0, reading_utc: "2026-07-07T10:00:00.000Z" }
              as: ComplianceOfficer
            - call: "POST /storage-units/${fu1}/temp-logs"
              payload: { reading_c: 0.0, reading_utc: "2026-07-07T12:01:00.000Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /members/${m13}/storage-assignments"
              payload: { temp_class: "FROZEN", requested_slots: 2, expected_member_version: "${m13v}" }
              as: MemberOperator
              as_user_id: "${m13}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_UNIT_QUARANTINED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: booking_overlap_with_turnover_buffer_on_station
        grounds:
          - validations[priority=14]
          - calculations.booking_fee
          - errors[ERR_BOOKING_OVERLAP]
          - entities.Station.fields.turnover_buffer_minutes
        distinguishing_aspect: |
          Interval semantics WITH a turnover buffer: on a Station with turnover_buffer_minutes=30, a new booking
          starting 15 min after a prior booking's end_utc still collides (buffer-expanded overlap) -> ERR_BOOKING_OVERLAP,
          even though the raw [start,end) intervals are disjoint.
        test_recipe:
          setup:
            - "Member m14 ACTIVE wallet 100000; Station prep14 turnover_buffer 30; existing CONFIRMED booking 12:00-13:00"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M14", email: "m14@x.com" }
              as: Anonymous
              captures: { m14: $.data.id }
            - call: "POST /members/${m14}/wallet/top-ups"
              payload: { amount_cents: 100000 }
              as: MemberOperator
              as_user_id: "${m14}"
              captures: { m14v: $.data.version }
            - call: "POST /stations"
              payload: { name: "Prep14", station_class: "PREP_TABLE", turnover_buffer_minutes: 30 }
              as: FacilityManager
              captures: { st14: $.data.id }
            - call: "POST /members/${m14}/bookings"
              payload: { station_id: "${st14}", start_utc: "2026-07-08T12:00:00.000Z", end_utc: "2026-07-08T13:00:00.000Z", expected_member_version: "${m14v}" }
              as: MemberOperator
              as_user_id: "${m14}"
              captures: { b14: $.data.id }
            - call: "GET /members/${m14}"
              payload: {}
              as: MemberOperator
              as_user_id: "${m14}"
              captures: { m14v2: $.data.version }
          trigger:
            - call: "POST /members/${m14}/bookings"
              payload: { station_id: "${st14}", start_utc: "2026-07-08T13:15:00.000Z", end_utc: "2026-07-08T14:00:00.000Z", expected_member_version: "${m14v2}" }
              as: MemberOperator
              as_user_id: "${m14}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BOOKING_OVERLAP"

      - name: storage_slot_aggregate_capacity_overlap_rejects
        grounds:
          - calculations.storage_allocation
          - validations[priority=21]
          - errors[ERR_STORAGE_CAPACITY_EXCEEDED]
          - entities.StorageUnit.fields.used_slots
        distinguishing_aspect: |
          Different interval semantics on a different resource (StorageUnit aggregate capacity, not a time line):
          slot occupancy is treated as additive aggregate capacity — an existing ACTIVE assignment holding 8 of 10
          slots leaves only 2 free, so a 5-slot request overflows the aggregate and is rejected
          ERR_STORAGE_CAPACITY_EXCEEDED. No adjacency/buffer math; pure summed-occupancy overlap.
        test_recipe:
          setup:
            - "Single COLD unit cold5 total 10; member m15a holds an ACTIVE 8-slot assignment (used_slots=8)"
            - "Member m15b requests 5 COLD slots — only 2 free aggregate"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M15a", email: "m15a@x.com" }
              as: Anonymous
              captures: { m15a: $.data.id, m15av: $.data.version }
            - call: "POST /members/register"
              payload: { business_name: "M15b", email: "m15b@x.com" }
              as: Anonymous
              captures: { m15b: $.data.id, m15bv: $.data.version }
            - call: "POST /storage-units"
              payload: { name: "Cold5", temp_class: "COLD", total_slots: 10, temp_min_c: 0.0, temp_max_c: 4.0 }
              as: FacilityManager
              captures: { cu5: $.data.id }
            - call: "POST /members/${m15a}/storage-assignments"
              payload: { temp_class: "COLD", requested_slots: 8, expected_member_version: "${m15av}" }
              as: MemberOperator
              as_user_id: "${m15a}"
              captures: { sa15a: $.data.id }
          trigger:
            - call: "POST /members/${m15b}/storage-assignments"
              payload: { temp_class: "COLD", requested_slots: 5, expected_member_version: "${m15bv}" }
              as: MemberOperator
              as_user_id: "${m15b}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_STORAGE_CAPACITY_EXCEEDED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: booking_cancel_restores_wallet_conservation
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Member.fields.wallet_balance_cents
          - entities.Member.fields.lifetime_loaded_cents
          - entities.Member.fields.lifetime_charged_cents
        distinguishing_aspect: |
          Conserved quantity = member wallet money. Invariant: wallet_balance_cents == lifetime_loaded_cents -
          lifetime_charged_cents. Booking create debits the fee; cancel credits it back exactly, so after the
          forward+compensating pair wallet_balance_cents returns to 100000 and lifetime_charged_cents back to 0.
        test_recipe:
          setup:
            - "Member m16 ACTIVE wallet topped to 100000; station OPEN; one CONFIRMED booking fee 2400"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M16", email: "m16@x.com" }
              as: Anonymous
              captures: { m16: $.data.id }
            - call: "POST /members/${m16}/wallet/top-ups"
              payload: { amount_cents: 100000 }
              as: MemberOperator
              as_user_id: "${m16}"
              captures: { m16v: $.data.version }
            - call: "POST /stations"
              payload: { name: "Prep16", station_class: "PREP_TABLE" }
              as: FacilityManager
              captures: { st16: $.data.id }
            - call: "POST /members/${m16}/bookings"
              payload: { station_id: "${st16}", start_utc: "2026-07-09T12:00:00.000Z", end_utc: "2026-07-09T14:00:00.000Z", expected_member_version: "${m16v}" }
              as: MemberOperator
              as_user_id: "${m16}"
              captures: { b16: $.data.id }
          trigger:
            - call: "POST /members/${m16}/bookings/${b16}/cancel"
              payload: {}
              as: MemberOperator
              as_user_id: "${m16}"
          assert:
            - "Member.${m16}.wallet_balance_cents == 100000"
            - "Member.${m16}.lifetime_charged_cents == 0"
            - "Member.${m16}.wallet_balance_cents == Member.${m16}.lifetime_loaded_cents - Member.${m16}.lifetime_charged_cents"

      - name: storage_release_restores_slot_conservation
        grounds:
          - state_machines.StorageAssignment.ACTIVE_to_RELEASED
          - calculations.storage_allocation
          - entities.StorageUnit.fields.used_slots
        distinguishing_aspect: |
          Different conserved quantity = storage shelf slots. Invariant: sum of StorageUnit.used_slots equals
          sum of requested_slots over ACTIVE assignments. Assign 15 slots (debits used_slots across the waterfall),
          then release (credits them back) -> every touched unit's used_slots returns to 0.
        test_recipe:
          setup:
            - "Two DRY units dryA(10) dryB(10) created in order; member m17 assigns 15 slots (waterfall dryA=10, dryB=5)"
          setup_api_calls:
            - call: "POST /members/register"
              payload: { business_name: "M17", email: "m17@x.com" }
              as: Anonymous
              captures: { m17: $.data.id, m17v: $.data.version }
            - call: "POST /storage-units"
              payload: { name: "DryA", temp_class: "DRY", total_slots: 10, temp_min_c: 10.0, temp_max_c: 25.0 }
              as: FacilityManager
              captures: { dA: $.data.id }
            - call: "POST /storage-units"
              payload: { name: "DryB", temp_class: "DRY", total_slots: 10, temp_min_c: 10.0, temp_max_c: 25.0 }
              as: FacilityManager
              captures: { dB: $.data.id }
            - call: "POST /members/${m17}/storage-assignments"
              payload: { temp_class: "DRY", requested_slots: 15, expected_member_version: "${m17v}" }
              as: MemberOperator
              as_user_id: "${m17}"
              captures: { sa17: $.data.id }
          trigger:
            - call: "POST /members/${m17}/storage-assignments/${sa17}/release"
              payload: {}
              as: MemberOperator
              as_user_id: "${m17}"
          assert:
            - "StorageUnit.${dA}.used_slots == 0"
            - "StorageUnit.${dB}.used_slots == 0"
