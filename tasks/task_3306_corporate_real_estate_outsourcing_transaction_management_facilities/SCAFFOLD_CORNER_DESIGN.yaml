          due_at: '2026-12-31T00:00:00Z'
        as: TransitionManager
        captures:
          TK1: $.data.id
      - call: POST /api/transition-tasks/${TK1}/start
        payload: {}
        as: TransitionManager
      - call: POST /api/transition-tasks/${TK1}/complete
        payload: {}
        as: TransitionManager
      - call: POST /api/accounts/${acc}/close-converted
        payload: {}
        as: AccountExecutive
      trigger:
      - call: POST /api/leases
        payload:
          account_id: ${acc}
          property_address: 40 New St
          market_code: SFO
          leased_sqft: 40000
          base_rent_cents_per_year: 74000000
          lease_start_date: '2026-10-01T00:00:00Z'
          lease_end_date: '2027-10-01T00:00:00Z'
        as: TransactionManager
        captures:
          e1: $.data.error_id
      assert:
      - ${e1} == ERR_ACCOUNT_CLOSED
  - name: second_audit_failure_flips_posture_to_restricted
    claim_type: precondition_enforcement
    grounds:
    - calculations.governance_posture_rollup
    - entities.PortfolioAccount.fields.governance_posture
    - validations[priority=6]
    distinguishing_aspect: One FAILED audit leaves the posture ON_WATCH while a second FAILED audit flips it to RESTRICTED, and a RESTRICTED account can no longer create a facility site.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE with DisciplineAudit A1 FAILED
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Posture Co
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/discipline-audits
        payload:
          account_id: ${acc}
          discipline: TRANSACTION
          finding: Approval minutes incomplete
        as: GovernanceManager
        captures:
          A1: $.data.id
      trigger:
      - call: POST /api/discipline-audits/${A1}/start
        payload: {}
        as: GovernanceManager
      - call: POST /api/discipline-audits/${A1}/decide
        payload:
          outcome: FAILED
        as: GovernanceManager
      assert:
      - PortfolioAccount.${acc}.governance_posture == ON_WATCH
      - DisciplineAudit.${A1}.remediation_required == true
- section: consistency_model
  instances:
  - name: converted_close_path_revokes_licence_and_keeps_area
    claim_type: immediate
    grounds:
    - state_machines.PortfolioAccount.transitions.OFFBOARDING_to_CLOSED_CONVERTED
    - consistency_model.immediate
    distinguishing_aspect: The closed-converted path returns lifecycle_state CLOSED_CONVERTED in the same response with the licence already REVOKED.
    test_recipe:
      setup:
      - PortfolioAccount OFFBOARDING, completion_pct_bps 10000 (one terminal task)
      - DataLicense D1 GRANTED scope AGGREGATE
      setup_api_calls:
      - call: POST /api/accounts
        payload:
          account_name: Converted Co
          client_name: GlobalTech Industries
          portfolio_sqft: 400000
          platform_tier: ENTERPRISE
        as: AccountExecutive
        captures:
          acc: $.data.id
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/activate
        payload: {}
        as: AccountExecutive
      - call: POST /api/accounts/${acc}/transitions
        payload: {}
        as: AccountExecutive
      - call: POST /api/transition-tasks
        payload:
          account_id: ${acc}
          task_name: Records handover
          task_type: RECORDS_TRANSFER
          sequence_no: 1
          blocking: true
          due_at: '2026-12-31T00:00:00Z'
        as: TransitionManager
        captures:
          TK1: $.data.id
      - call: POST /api/transition-tasks/${TK1}/start
        payload: {}
        as: TransitionManager
      - call: POST /api/transition-tasks/${TK1}/complete
        payload: {}
        as: TransitionManager
      - call: POST /api/data-licenses
        payload:
          account_id: ${acc}
          licensee_name: Meridian Analytics
          platform_tier_at_issue: ENTERPRISE
          data_scope: AGGREGATE
        as: DataSteward
        captures:
          D1: $.data.id
      - call: POST /api/data-licenses/${D1}/grant
        payload: {}
        as: DataSteward
      trigger:
      - call: POST /api/accounts/${acc}/close-converted
        payload: {}
        as: AccountExecutive
        captures:
          ls: $.data.lifecycle_state
      assert:
      - ${ls} == CLOSED_CONVERTED
      - DataLicense.${D1}.license_state == REVOKED
