          METRIC: accumulated noncompliance POINTS against the >= 12 threshold, an integer derived
          from severity codes rather than money or days. ENDPOINT:
          POST /osup/permits/{id}/noncompliance-actions. Because MINOR is 2 and MODERATE is 5,
          11 points (three MINOR plus one MODERATE) and 12 points (one MINOR plus two MODERATE) are
          both reachable, so the threshold can be probed from directly below and directly on it.
          Both permits carry current insurance and bonds and are not fee delinquent, so points are
