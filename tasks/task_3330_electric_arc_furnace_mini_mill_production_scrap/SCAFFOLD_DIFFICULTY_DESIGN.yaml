  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: posture_state_beats_blend_safety_on_charge_apply
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors.ERR_MILL_INTERRUPTED
          - errors.ERR_BLEND_INFEASIBLE
        distinguishing_aspect: |
          Error-category pair business_temporal (priority 7, mill posture)
          vs business_safety (priority 8, blend feasibility): a charge line
          that would fail BOTH the posture gate and the blend ceiling must
          return ERR_MILL_INTERRUPTED, not ERR_BLEND_INFEASIBLE.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. Mill, FIXED contract, lots L1 (5t, cu 0.002) and L2 (5t, cu 0.0045)."
            - "Grade GR40 cu_max 0.0028 (tight); heat H1 already charged 3t from L1 (blend cu 0.002 <= 0.0028, OK)."
            - "EnergyEvent ACTIVE (mill posture INTERRUPTED); H1 has NO waiver."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
              payload: { name: "Gallatin Energy Mill", division: "ENERGY", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts"
              payload: { supplier_name: "River Metals Recycling", grade_category: "SHREDDED", contract_type: "FIXED", contract_price_cents: 39000, committed_tons: 100 }
              as: ProcurementOfficer
              captures: { contract_id: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-03", tons_received: 5, moisture_pct: 0.0, cu_pct: 0.002, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_1: $.data.id }
            - call: "POST /mills/${mill_id}/procurement-contracts/${contract_id}/scrap-lots"
              payload: { received_on: "2026-09-04", tons_received: 5, moisture_pct: 0.0, cu_pct: 0.0045, mn_pct: 0.004 }
              as: ProcurementOfficer
              captures: { lot_2: $.data.id }
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR60-TIGHT", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.0028, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats"
              payload: { heat_number: "H-5001", grade_id: "${grade_id}", target_tap_weight_tons: 5, planned_tap_at: "2026-09-15T12:00:00Z" }
              as: MillOperator
              captures: { heat_id: $.data.id }
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_1}", tons: 3 }
              as: MillOperator
            - call: "POST /mills/${mill_id}/energy-events"
              payload: { grid_operator: "PJM", called_at: "2026-09-10T12:00:00Z", released_at: "2026-09-10T14:00:00Z" }
              as: EnergyDispatcher
              captures: { event_id: $.data.id }
            - call: "POST /mills/${mill_id}/energy-events/${event_id}/activate"
              payload: {}
              as: EnergyDispatcher
          trigger:
            - call: "POST /mills/${mill_id}/heats/${heat_id}/charges"
              payload: { scrap_lot_id: "${lot_2}", tons: 2 }
              as: MillOperator
              captures: { err: $.data.error_id }
          assert:
            - "the trigger fails with err == ERR_MILL_INTERRUPTED (priority 7 temporal posture beats priority 8 safety blend)"
            - "err != ERR_BLEND_INFEASIBLE even though (3*0.002 + 2*0.0045)/5 = 0.003 > 0.0028 would also fail"
            - "Heat.${heat_id} has exactly 1 charge line and remains CHARGED"

      - name: credit_fiscal_beats_nothing_but_blocked_vs_stale_version
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - errors.ERR_STALE_VERSION
          - errors.ERR_ACCOUNT_BLOCKED
        distinguishing_aspect: |
          Error-category pair state/OCC (priority 6, stale version) vs
          business_fiscal (priority 17, blocked account): an order confirm
          carrying a stale expected_order_version on a BLOCKED account must
          return ERR_STALE_VERSION, not ERR_ACCOUNT_BLOCKED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-10T00:00:00Z. Mill, SHREDDED 2026-09 index 38000, grade GR40, SPOT account with order O1 (QUOTED, version 1)."
            - "Account credit_status moved GOOD → WATCH → BLOCKED (two PATCHes; the order itself is untouched, so order.version stays 1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: PlantManager
            - call: "POST /mills"
              payload: { name: "Crawfordsville Bar Mill", division: "CONSTRUCTION", furnace_capacity_tons: 150, caster_rate_tph: 80 }
              as: PlantManager
              captures: { mill_id: $.data.id }
            - call: "POST /mills/${mill_id}/surcharge-indices"
              payload: { grade_category: "SHREDDED", effective_month: "2026-09", price_per_ton_cents: 38000 }
              as: PlantManager
            - call: "POST /mills/${mill_id}/grades"
              payload: { grade_code: "GR40", product_form: "BILLET", grade_group: "GROUP_A", certification_class: "STANDARD", cu_max_pct: 0.004, mn_min_pct: 0.002, mn_max_pct: 0.012, requires_energy_certified: false }
              as: Metallurgist
              captures: { grade_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts"
              payload: { name: "Shaky Credit Erectors", market: "CONSTRUCTION", pricing_mode: "SPOT" }
              as: AccountManager
              captures: { acct_id: $.data.id }
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders"
              payload: { product_family: "REBAR", grade_id: "${grade_id}", tons: 20, fulfillment_month: "2026-09", base_price_cents_per_ton: 25000 }
              as: AccountManager
              captures: { ord_id: $.data.id, ord_v: $.data.version }
            - call: "PATCH /mills/${mill_id}/customer-accounts/${acct_id}"
              payload: { credit_status: "WATCH" }
              as: AccountManager
            - call: "PATCH /mills/${mill_id}/customer-accounts/${acct_id}"
              payload: { credit_status: "BLOCKED" }
              as: AccountManager
          trigger:
            - call: "POST /mills/${mill_id}/customer-accounts/${acct_id}/orders/${ord_id}/confirm"
              payload: { expected_order_version: "${ord_v} - 1" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "the trigger fails with err == ERR_STALE_VERSION (priority 6 OCC beats priority 17 fiscal block)"
            - "err != ERR_ACCOUNT_BLOCKED even though the account is BLOCKED"
            - "Order.${ord_id}.status remains QUOTED"

