  - section: consistency_model
    instances:
      - name: corner_consistency_completion_cascade_is_visible_in_the_same_request
        claim_type: immediate
        grounds: ["complexity_profile.consistency_model", "state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED", "calculations.maintenance_visit_kind_selection", "calculations.maintenance_next_due_at"]
        distinguishing_aspect: |
          The declared consistency model is `immediate`, so the completion RESPONSE
          itself already carries every derived field of hops 1, 2 and 8
          (billable_minutes 60, labor_charge_cents 9500, parts_charge_cents 16000,
          fulfillment_status COMPLETED, billing_status PENDING_INVOICE) and the very
          next reads - with no intervening write and no clock advance - already show
          the invoice, the two warranty coverages, the SERVICE_ONLY maintenance visit
          and the RESOLVED ticket. The plan's clocks have already moved too:
          last_service_date 2026-06-01T12:00:00.000Z and next_due_at that instant plus
          the 270-day MODERATE interval, 2027-02-26T12:00:00.000Z. An implementation
          that reconciles any of these lazily returns 0 rows or stale values on the
          reads that follow.
        test_recipe:
          setup:
            - "One NONE-tier account, one property 10.0 miles out with household 3, one well at the default 6.0 gallon drawdown, one JOURNEYMAN technician and one CONTROL part costing 5000 cents with 10 on hand."
            - "One ACTIVE MaintenancePlan created at 2026-06-01T09:00:00Z with interval_days_as_operated 270."
            - "One PRE_AUTHORIZED emergency work order of scope REPAIR with one POSTED consumption row of quantity 2, IN_PROGRESS at 2026-06-01T12:00:00Z."
