  - section: rbac
    instances:
      - name: peer_roles_cannot_reach_each_others_exclusive_operations
        claim_type: Exclusive Operation
        grounds:
          - roles
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "The role model is peer_roles, so there is no seniority ladder to fall back on: each of the six production roles owns a disjoint slice of the write surface and the shared reads are open to several roles at once. Authentication is checked before authorisation, so a missing header is a 401 and never a 403."
        test_recipe:
          setup:
            - "One program, one objective, line SX-1001, one site and one STAGE_1 series (rep 3, min_locations 1)."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1001", generation_number: 6, seed_inventory_g: 500000 }
              as: BreedingScientist
              captures: { line_id: $.data.id }
            - call: "POST /trial-sites"
              payload: { site_code: "RB1", environment_class: "HIGH_YIELD_IRRIGATED", total_plot_capacity: 400, plot_cost_usd: 45.00, season_start_date: "2027-03-01", season_end_date: "2027-10-31" }
              as: TrialAgronomist
              captures: { site_id: $.data.id }
            - call: "POST /trial-series"
              payload: { program_id: "${prog_id}", stage: "STAGE_1", season_year: 2027, plot_design: "RCBD", replication_count: 3, min_locations: 1 }
              as: TrialAgronomist
              captures: { series_id: $.data.id }
          trigger:
            - call: "GET /breeding-lines"
              payload: { program_id: "${prog_id}", limit: 20 }
              as: SupplyPlanner
            - call: "GET /breeding-lines"
              payload: { program_id: "${prog_id}", limit: 20 }
              as: RegulatoryOfficer
            - call: "GET /breeding-lines/${line_id}"
              payload: {}
              as: DataAnalyst
            - call: "GET /trial-series/${series_id}"
              payload: {}
              as: TrialAgronomist
          assert:
            - "all four shared reads -> 200: GET /breeding-lines is open to six roles and the same rows are returned whichever of them asks"
            - "the same POST /breeding-programs issued with X-User-Role: TrialAgronomist -> 403 with data.error_id == ERR_ROLE_NOT_PERMITTED (PipelineDirector-exclusive)"
            - "POST /trial-sites as BreedingScientist, POST /trial-series/${series_id}/entries as DataAnalyst, POST /trial-series/${series_id}/analyses as SupplyPlanner, POST /seed-increase-lots as RegulatoryOfficer and POST /breeding-lines/${line_id}/stewardship-agreements as SupplyPlanner each -> 403 ERR_ROLE_NOT_PERMITTED"
            - "POST /advancement-decisions as ProgramLead -> 403 ERR_ROLE_NOT_PERMITTED: ProgramLead holds no exclusive operation and cannot borrow one"
            - "any request with no X-User-Role header, no X-User-ID header, or X-User-Role: Agronomist (not one of the seven) -> 401 with data.error_id == ERR_UNAUTHENTICATED, checked before the role rung"
            - "no refused request mutated anything: BreedingProgram.${prog_id}.active_line_count == 1 and TrialSeries.${series_id}.entry_count == 0"

      - name: program_lead_is_scoped_to_the_program_named_by_its_user_id
        claim_type: Tenant Scoping
        grounds:
          - validations[priority=5]
          - errors[ERR_PROGRAM_SCOPE_VIOLATION]
          - roles.ProgramLead
        distinguishing_aspect: "ProgramLead's X-User-ID is not an identity but a scope key: the same endpoint, the same role and the same body succeed for the program whose id equals X-User-ID and are refused with 403 for a sibling program - and the scope is followed through the body's FKs, not only the path."
        test_recipe:
          setup:
            - "Two programs P1 and P2, each with its own objective."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { p1: $.data.id }
            - call: "POST /breeding-programs"
              payload: { name: "Soy Southern", crop_code: "SOYBEAN", market_zone: "SOUTHERN", total_plot_budget: 3000, total_budget_usd: 900000.00 }
              as: PipelineDirector
              captures: { p2: $.data.id }
            - call: "POST /breeding-programs/${p1}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj1: $.data.id }
            - call: "POST /breeding-programs/${p2}/objectives"
              payload: { market_segment: "MG5_SOUTH", target_yield_kg_per_ha: 9000.00, required_disease_resistances: ["RUST"], min_resistance_score: 5, quality_trait_specs: { PROTEIN_PCT_MIN: 12.5 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 80.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj2: $.data.id }
          trigger:
            - call: "POST /breeding-lines"
              payload: { program_id: "${p1}", objective_id: "${obj1}", designation: "SX-1001", generation_number: 6, seed_inventory_g: 500000 }
              as: ProgramLead
              as_user_id: "${p1}"
              captures: { own_line: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${p2}", objective_id: "${obj2}", designation: "SY-2001", generation_number: 6, seed_inventory_g: 200000 }
              as: ProgramLead
              as_user_id: "${p1}"
            - call: "GET /breeding-lines/${own_line}"
              payload: {}
              as: ProgramLead
              as_user_id: "${p2}"
            - call: "GET /breeding-lines/${own_line}"
              payload: {}
              as: ProgramLead
              as_user_id: "${p1}"
          assert:
            - "the in-scope create -> 201 and BreedingProgram.${p1}.active_line_count == 1"
            - "the create aimed at P2 while X-User-ID is ${p1} -> 403 with data.error_id == ERR_PROGRAM_SCOPE_VIOLATION, and BreedingProgram.${p2}.active_line_count == 0"
            - "reading P1's line as ProgramLead of ${p2} -> 403 ERR_PROGRAM_SCOPE_VIOLATION - the scope rung applies to reads too"
            - "reading the same line as ProgramLead of ${p1} -> 200 with the full entity"
            - "the scope rung sits at priority 5, so it fires before any state or business rung the same request would also violate"

      - name: suspending_an_agreement_requires_a_second_pair_of_hands
        claim_type: Segregation of duties
        grounds:
          - validations[priority=21]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.StewardshipAgreement.APPROVED_to_SUSPENDED
        distinguishing_aspect: "The suspend guard compares X-User-ID against the stored approved_by_user_id, so the refusal depends on who approved rather than on any role: the approver is blocked with 403 while a different user holding the very same role succeeds, and PipelineDirector - also allowed on the endpoint - would be blocked too if it had been the approver."
        test_recipe:
          setup:
            - "One program, one objective, line SX-1001 with an APPROVED stewardship agreement approved by user ro-2."
          setup_api_calls:
            - call: "POST /breeding-programs"
              payload: { name: "Soy North Central", crop_code: "SOYBEAN", market_zone: "NORTH_CENTRAL", total_plot_budget: 5000, total_budget_usd: 2000000.00 }
              as: PipelineDirector
              captures: { prog_id: $.data.id }
            - call: "POST /breeding-programs/${prog_id}/objectives"
              payload: { market_segment: "MG2_NORTH", target_yield_kg_per_ha: 11000.00, required_disease_resistances: ["RUST", "SDS"], min_resistance_score: 6, quality_trait_specs: { PROTEIN_PCT_MIN: 13.0 }, yield_weight: 0.50, disease_weight: 0.30, quality_weight: 0.20, min_advancement_index: 85.00, min_generation_number: 5 }
              as: PipelineDirector
              captures: { obj_id: $.data.id }
            - call: "POST /breeding-lines"
              payload: { program_id: "${prog_id}", objective_id: "${obj_id}", designation: "SX-1001", generation_number: 6, seed_inventory_g: 500000 }
              as: BreedingScientist
              captures: { line_id: $.data.id }
            - call: "POST /breeding-lines/${line_id}/stewardship-agreements"
              payload: { approved_markets: ["US_CORNBELT"], regulatory_dossier_ref: "DOS-2852-05", grower_agreement_ref: "GA-2852-05", effective_from: "2026-09-01", effective_to: "2029-09-01" }
              as: RegulatoryOfficer
              as_user_id: "ro-1"
              captures: { agr_id: $.data.id }
            - call: "POST /stewardship-agreements/${agr_id}/submit"
              payload: {}
              as: RegulatoryOfficer
              as_user_id: "ro-1"
            - call: "POST /stewardship-agreements/${agr_id}/review"
              payload: { outcome: "APPROVE" }
              as: RegulatoryOfficer
              as_user_id: "ro-2"
          trigger:
            - call: "POST /stewardship-agreements/${agr_id}/suspend"
