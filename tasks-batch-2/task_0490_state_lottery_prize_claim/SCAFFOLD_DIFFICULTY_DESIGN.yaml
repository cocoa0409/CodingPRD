  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_business_safety_on_disburse
        grounds:
          - validations[priority=4]
          - validations[priority=7]
        distinguishing_aspect: |
          Pair {state (priority 4) vs business_safety (priority 7)}: a disburse on a still-ADJUDICATING claim by the same
          adjudicating officer violates BOTH the state precondition (not APPROVED_*) and segregation-of-duties; the lower
          priority number wins, so ERR_INVALID_STATE is returned, not ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "A claim left in ADJUDICATING by u-adj (never approved); attempt disburse as the SAME u-adj."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "PrioGame", game_type: "INSTANT", claim_window_days: 30, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { game_id: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Prio Mart", tax_id: "TAX-9" }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-9" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "PR-1", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 1, gross_prize_cents: 1000000 }
              as: TerminalOperator
              captures: { tk: $.data.id }
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
            - call: "POST /players"
              payload: { full_name: "Prio Player", government_id_number: "GID-9" }
              as: ClaimsClerk
              captures: { pl_id: $.data.id }
            - call: "POST /prize-claims"
              payload: { ticket_id: "${tk}", player_id: "${pl_id}", payout_option: "CASH" }
              as: ClaimsClerk
              captures: { cl: $.data.id }
            - call: "POST /prize-claims/${cl}/begin-adjudication"
              payload: {}
              as: LotteryOfficer
              as_user_id: "u-adj"
          trigger:
            - call: "POST /prize-claims/${cl}/disburse"
              payload: {}
              as: LotteryOfficer
              as_user_id: "u-adj"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_INVALID_STATE"

      - name: existence_beats_business_constraint_on_claim_create
        grounds:
          - validations[priority=3]
          - validations[priority=10]
        distinguishing_aspect: |
          Pair {existence (priority 3) vs business_constraint (priority 10)}: a POST /prize-claims naming a non-existent
          player_id AND a payout against a winner ticket would also need ID verification; existence (404 ERR_NOT_FOUND) wins
          over the ID-verification business constraint because existence has the lower priority number.
        test_recipe:
          setup:
            - "A VALIDATED_WINNER ticket; POST /prize-claims with a bogus player_id that does not resolve."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "ExGame", game_type: "INSTANT", claim_window_days: 30, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { game_id: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Ex Mart", tax_id: "TAX-10" }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-10" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "EX-1", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 1, gross_prize_cents: 1000000 }
              as: TerminalOperator
              captures: { tk: $.data.id }
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
          trigger:
            - call: "POST /prize-claims"
              payload: { ticket_id: "${tk}", player_id: "00000000-0000-4000-8000-000000000000", payout_option: "CASH" }
              as: ClaimsClerk
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and data.error_id == ERR_NOT_FOUND"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: claim_deadline_inclusive_boundary_on_validate
        grounds:
          - calculations.ticket_claim_deadline
          - state_machines.Ticket.UNVALIDATED_to_VALIDATED_WINNER
          - validations[priority=11]
        distinguishing_aspect: |
          Numeric/temporal boundary on POST /tickets/{id}/validate: at logical_clock EXACTLY == claim_deadline
          (2026-02-09T00:00:00Z) the winner-validate SUCCEEDS (inclusive), proving escheat uses strict > not >=.
        test_recipe:
          setup:
            - "An UNVALIDATED over-threshold winner ticket draw_date 2026-01-10, claim_window_days 30 -> deadline 2026-02-09T00:00:00Z; clock set to exactly the deadline."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "BoundGame", game_type: "INSTANT", claim_window_days: 30, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { game_id: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Bound Mart", tax_id: "TAX-11" }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-11" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "BD-1", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 1, gross_prize_cents: 1000000 }
              as: TerminalOperator
              captures: { tk: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-09T00:00:00Z" }
              as: LotteryOfficer
          trigger:
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
              captures: { vs: $.data.validation_status }
          assert:
            - "Ticket.${tk}.validation_status == VALIDATED_WINNER"
            - "Ticket.${tk}.claim_deadline == 2026-02-09T00:00:00.000Z"

      - name: empty_second_chance_pool_run_rejected
        grounds:
          - validations[priority=14]
          - state_machines.SecondChanceDrawing.OPEN_to_DRAWN
          - entities.SecondChanceDrawing.fields.entry_count
        distinguishing_aspect: |
          Empty-collection boundary on POST /second-chance-drawings/{id}/run: entry_count == 0 (zero-count edge, a DIFFERENT
          metric than the temporal deadline boundary) past entry_deadline yields ERR_EMPTY_DRAWING_POOL, not a winner.
        test_recipe:
          setup:
            - "A SecondChanceDrawing OPEN with entry_deadline 2026-02-01, zero entries; clock advanced past the deadline."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "EmptyDraw", game_type: "DAILY", claim_window_days: 10, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { game_id: $.data.id }
            - call: "POST /second-chance-drawings"
              payload: { game_id: "${game_id}", entry_deadline: "2026-02-01T00:00:00Z", prize_pool_cents: 500000 }
              as: LotteryOfficer
              captures: { dr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-02T00:00:00Z" }
              as: LotteryOfficer
            - call: "GET /second-chance-drawings/${dr_id}"
              payload: {}
              as: LotteryOfficer
              captures: { dr_v: $.data.version }
          trigger:
            - call: "POST /second-chance-drawings/${dr_id}/run"
              payload: { expected_drawing_version: "${dr_v}" }
              as: LotteryOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_EMPTY_DRAWING_POOL"
            - "SecondChanceDrawing.${dr_id}.status == OPEN"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: terminal_activate_requires_retailer_active
        grounds:
          - state_machines.Terminal.PROVISIONED_to_ACTIVE
          - validations[priority=15]
          - entities.Retailer.fields.license_status
        distinguishing_aspect: |
          Entity pair Terminal->Retailer: a Terminal can only transition PROVISIONED -> ACTIVE when its owning
          Retailer.license_status == ACTIVE; a PENDING retailer blocks activation with ERR_RETAILER_NOT_LICENSED.
        test_recipe:
          setup:
            - "A PENDING (never activated) retailer with a PROVISIONED terminal; attempt to activate the terminal."
          setup_api_calls:
            - call: "POST /retailers"
              payload: { business_name: "Pend Mart", tax_id: "TAX-12" }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-12" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
          trigger:
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_RETAILER_NOT_LICENSED"
            - "Terminal.${term_id}.status == PROVISIONED"

      - name: adjudication_blocked_when_player_self_excluded
        grounds:
          - state_machines.PrizeClaim.SUBMITTED_to_ADJUDICATING
          - validations[priority=6]
          - entities.Player.fields.self_exclusion_status
        distinguishing_aspect: |
          Entity pair PrizeClaim->Player (a DIFFERENT pair than Terminal->Retailer): a claim cannot move
          SUBMITTED -> ADJUDICATING while the linked Player.self_exclusion_status == EXCLUDED and clock < exclusion_until,
          returning ERR_PLAYER_SELF_EXCLUDED.
        test_recipe:
          setup:
            - "A SUBMITTED claim whose player self-excluded for 90 days from clock 2026-01-05; begin-adjudication while exclusion active."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "SelfExGame", game_type: "INSTANT", claim_window_days: 60, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { game_id: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "SelfEx Mart", tax_id: "TAX-13" }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-13" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "SE-1", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 1, gross_prize_cents: 1000000 }
              as: TerminalOperator
              captures: { tk: $.data.id }
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
            - call: "POST /players"
              payload: { full_name: "Excluded Player", government_id_number: "GID-13" }
              as: ClaimsClerk
              captures: { pl_id: $.data.id }
            - call: "POST /prize-claims"
              payload: { ticket_id: "${tk}", player_id: "${pl_id}", payout_option: "CASH" }
              as: ClaimsClerk
              captures: { cl: $.data.id }
            - call: "POST /players/${pl_id}/self-exclude"
              payload: { exclusion_days: 90 }
              as: ClaimsClerk
          trigger:
            - call: "POST /prize-claims/${cl}/begin-adjudication"
              payload: {}
              as: LotteryOfficer
              as_user_id: "u-adj"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_PLAYER_SELF_EXCLUDED"
            - "PrizeClaim.${cl}.status == SUBMITTED"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: settlement_window_half_open_excludes_period_end_ticket
        grounds:
          - calculations.retailer_commission_settlement
          - entities.CommissionSettlement.fields.period_start
          - entities.CommissionSettlement.fields.period_end
        distinguishing_aspect: |
          Interval semantics A — half-open [period_start, period_end): a ticket created at EXACTLY period_end
          (2026-06-01T00:00:00Z) is EXCLUDED from the window (end-exclusive), while one at period_start is included; the
          settlement resource's window uses end-exclusive arithmetic.
        test_recipe:
          setup:
            - "ACTIVE retailer+terminal; one ticket price 100 sold at 2026-05-01 (== period_start, included), one ticket price 100 sold at 2026-06-01 (== period_end, excluded). commission_rate 0.06."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "WindowGame", game_type: "DAILY", claim_window_days: 10, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { game_id: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Window Mart", tax_id: "TAX-14", commission_rate: 0.06 }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-14" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "W-IN", price_cents: 100, draw_date: "2026-05-01T00:00:00Z", declared_tier: 0, gross_prize_cents: 0 }
              as: TerminalOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "W-OUT", price_cents: 100, draw_date: "2026-06-01T00:00:00Z", declared_tier: 0, gross_prize_cents: 0 }
              as: TerminalOperator
            - call: "GET /retailers/${ret_id}"
              payload: {}
              as: LotteryOfficer
              captures: { ret_v: $.data.version }
          trigger:
            - call: "POST /commission-settlements"
              payload: { retailer_id: "${ret_id}", period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_retailer_version: "${ret_v}" }
              as: LotteryOfficer
              as_user_id: "u-prep"
              captures: { st_id: $.data.id }
          assert:
            - "CommissionSettlement.${st_id}.gross_commission_cents == 6"

      - name: second_chance_entry_deadline_inclusive_resource_window
        grounds:
          - validations[priority=12]
          - validations[priority=13]
          - entities.SecondChanceDrawing.fields.entry_deadline
        distinguishing_aspect: |
          Interval semantics B — the SecondChanceDrawing resource uses an INCLUSIVE entry window (entry allowed while
          clock <= entry_deadline) but EXCLUSIVE run gate (run allowed only while clock > entry_deadline); at clock ==
          entry_deadline an entry still succeeds yet the run is rejected ERR_DRAWING_NOT_CLOSED — opposite adjacency
          treatment from the settlement half-open window.
        test_recipe:
          setup:
            - "An OPEN drawing entry_deadline 2026-02-01; a non-winner ticket made ELIGIBLE; clock set to exactly 2026-02-01."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "EntryWin", game_type: "DAILY", claim_window_days: 30, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { game_id: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Entry Mart", tax_id: "TAX-15" }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-15" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /second-chance-drawings"
              payload: { game_id: "${game_id}", entry_deadline: "2026-02-01T00:00:00Z", prize_pool_cents: 500000 }
              as: LotteryOfficer
              captures: { dr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "EW-1", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 0, gross_prize_cents: 0 }
              as: TerminalOperator
              captures: { tk: $.data.id }
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /second-chance-entries"
              payload: { drawing_id: "${dr_id}", ticket_id: "${tk}" }
              as: ClaimsClerk
              captures: { en_id: $.data.id }
            - call: "GET /second-chance-drawings/${dr_id}"
              payload: {}
              as: LotteryOfficer
              captures: { dr_v: $.data.version }
          trigger:
            - call: "POST /second-chance-drawings/${dr_id}/run"
              payload: { expected_drawing_version: "${dr_v}" }
              as: LotteryOfficer
              captures: { err: $.data.error_id }
          assert:
            - "SecondChanceEntry.${en_id}.outcome == PENDING"
            - "HTTP status == 409 and data.error_id == ERR_DRAWING_NOT_CLOSED"
            - "SecondChanceDrawing.${dr_id}.entry_count == 1"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: counter_pay_then_reversal_conserves_commission_balance
        grounds:
          - state_machines.Ticket.UNVALIDATED_to_PAID_AT_COUNTER
          - state_machines.Ticket.PAID_AT_COUNTER_to_COUNTER_REVERSED
          - entities.Retailer.fields.commission_balance_cents
        distinguishing_aspect: |
          Conserved quantity = Retailer.commission_balance_cents: a PAID_AT_COUNTER accrual of +500 followed by the SAME
          ticket's reverse-counter-pay debit of exactly -500 leaves commission_balance_cents at its pre-counter-pay value
          (0) — forward action plus its compensating action conserve the named ledger quantity to the cent.
        test_recipe:
          setup:
            - "ACTIVE retailer+terminal, cashing_bonus_rate 0.01; an under-threshold winner gross_prize 50,000 paid at counter (+500), then reversed (-500)."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "ClawGame", game_type: "INSTANT", claim_window_days: 30, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { game_id: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Claw Mart", tax_id: "TAX-16", commission_rate: 0.06, cashing_bonus_rate: 0.01 }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-16" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "CW-1", price_cents: 100, draw_date: "2026-07-03T00:00:00Z", declared_tier: 2, gross_prize_cents: 50000 }
              as: TerminalOperator
              captures: { tk: $.data.id }
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
            - call: "GET /retailers/${ret_id}"
              payload: {}
              as: LotteryOfficer
              captures: { bal_after_pay: $.data.commission_balance_cents }
          trigger:
            - call: "POST /tickets/${tk}/reverse-counter-pay"
              payload: {}
              as: LotteryOfficer
              captures: { vs: $.data.validation_status }
          assert:
            - "Ticket.${tk}.validation_status == COUNTER_REVERSED"
            - "Retailer.${ret_id}.commission_balance_cents == 0"

      - name: cancel_drawing_conserves_eligible_ticket_count
        grounds:
          - state_machines.SecondChanceDrawing.OPEN_to_CANCELLED
          - state_machines.Ticket.UNVALIDATED_to_VALIDATED_NONWINNER
          - entities.Ticket.fields.second_chance_status
        distinguishing_aspect: |
          Conserved quantity = count of tickets with second_chance_status == ELIGIBLE (a DIFFERENT conserved quantity than
          the commission-balance one): entering a ticket flips ELIGIBLE -> ENTERED (-1 eligible), cancelling the drawing
          flips ENTERED -> ELIGIBLE (+1 eligible), so the eligible-ticket population returns to exactly its pre-entry value.
        test_recipe:
          setup:
            - "One VALIDATED_NONWINNER ticket made ELIGIBLE, entered into an OPEN drawing (ENTERED), then the drawing is cancelled."
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "CancelDraw", game_type: "DAILY", claim_window_days: 30, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { game_id: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Cancel Mart", tax_id: "TAX-17" }
              as: LicensingAdmin
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${ret_id}", serial_number: "SN-17" }
              as: LicensingAdmin
              captures: { term_id: $.data.id }
            - call: "POST /terminals/${term_id}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /second-chance-drawings"
              payload: { game_id: "${game_id}", entry_deadline: "2026-03-01T00:00:00Z", prize_pool_cents: 500000 }
              as: LotteryOfficer
              captures: { dr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${game_id}", terminal_id: "${term_id}", serial: "CD-1", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 0, gross_prize_cents: 0 }
              as: TerminalOperator
              captures: { tk: $.data.id }
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
            - call: "POST /second-chance-entries"
              payload: { drawing_id: "${dr_id}", ticket_id: "${tk}" }
              as: ClaimsClerk
              captures: { en_id: $.data.id }
          trigger:
            - call: "POST /second-chance-drawings/${dr_id}/cancel"
              payload: {}
              as: LotteryOfficer
              captures: { st: $.data.status }
          assert:
            - "SecondChanceDrawing.${dr_id}.status == CANCELLED"
            - "Ticket.${tk}.second_chance_status == ELIGIBLE"
            - "SecondChanceEntry.${en_id}.outcome == PENDING"
