# ===========================================================================
# 1.8 Scaffold Difficulty Design — task 2799
#     Commercial Kitchen Food Waste Tracking & Diversion
#
# Nine §0.5 difficulty rules, each with two or more differentiated instances.
# Every asserted number below is a pre-computed literal, derived by hand from
# the §1.3 formulas against the stated fixture; no assert restates a formula.
#
# Shared fixture conventions used by the recipes:
#   * The logical clock is left at its mandatory default 2026-08-01T00:00:00Z
#     unless an instance explicitly sets it. Every captured_at below is therefore
#     in the past, which satisfies validations[priority=82].
#   * Station calibration_due_at is always 2027-01-01T00:00:00Z so
#     ERR_STATION_CALIBRATION_OVERDUE never fires incidentally.
#   * FoodType FT_PREP  = PREPARED, 640 c/kg, donation_eligible true,
#                         animal_feed_eligible true, compostable true,
#                         donation_shelf_life_hours 24.
#     FoodType FT_SPOIL = PRODUCE, 210 c/kg, donation_eligible FALSE,
#                         animal_feed_eligible true, compostable true,
#                         donation_shelf_life_hours 12.
#   * Recipe BRZ-CHK has cost_per_kg_cents 1029 (see rule combinatorial_formula
#     instance recipe_cost_per_kg_rounds_per_line_before_summing).
# ===========================================================================
scaffold_difficulty_design:

  # =======================================================================
  - rule_id: dual_variant_calc
    mechanism: |
      Two independent calculations each carry a `variants:` block whose two arms
      consume byte-identical stored data and return different numbers, and the
      arm is selected by context rather than by any request field.
      (1) calculations.waste_entry_valuation values one WasteEntry twice: the
          CATALOG arm at capture (FoodType.default_cost_per_kg_cents) and the
          RECIPE arm at shift close (Recipe.published_cost_per_kg_cents, which
          already carries trim loss). The switch is reconciled through
          valuation_delta_cents and pushed into Site.valued_waste_cost_cents.
      (2) calculations.reduction_attainment measures the same site's same window
          twice: the ABSOLUTE arm on raw grams and the INTENSITY arm on kg per
          1000 meals. Falling covers can turn a genuine gram reduction into an
          intensity regression, so the two arms disagree on attainment_state.
    instances:

      - name: waste_entry_valuation_catalog_provisional_versus_recipe_final_delta
        grounds: "§1.3 calculations.waste_entry_valuation variants CATALOG_PROVISIONAL / RECIPE_FINAL; §1.2 state_machines.Shift.OPEN_to_CLOSED FINAL valuation pass; §1.1 WasteEntry.provisional_cost_cents / final_cost_cents / valuation_delta_cents / effective_cost_cents."
        distinguishing_aspect: "Divergence lives on a single WasteEntry row and is driven by the OWNING SHIFT'S state, not by any field of the entry or of the request: the same 2450 g is worth 1568 c while the shift is OPEN and 2521 c once it is CLOSED. An implementation that values everything at the catalog rate, or that back-fills the recipe rate at capture time, is caught by the 953 c delta."
        test_recipe:
          setup: |
            One site with one PREP station, FoodType FT_PREP (640 c/kg) and a PUBLISHED
            recipe BRZ-CHK whose frozen cost is 1029 c/kg. One OPEN shift on 2026-06-10 with
            meals_served 1000 (deliberately high so no coaching alert can fire and disturb
            the site aggregates). A single 2450 g capture attributed to BRZ-CHK.
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2027-01-01T00:00:00Z", capture_lock_seconds: 30 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Braised Chicken Portion", category: "PREPARED", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: true, compostable: true, donation_shelf_life_hours: 24 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /recipes"
              payload:
                recipe_code: "BRZ-CHK"
                name: "Braised Chicken Thigh"
                ingredients:
                  - { ingredient_name: "chicken thigh", quantity_kg: 2.5, unit_cost_cents_per_kg: 1201, trim_loss_pct: 0.20 }
                  - { ingredient_name: "mirepoix", quantity_kg: 1.5, unit_cost_cents_per_kg: 407, trim_loss_pct: 0.00 }
                  - { ingredient_name: "cream", quantity_kg: 0.5, unit_cost_cents_per_kg: 999, trim_loss_pct: 0.00 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { recipe_id: "$.data.id" }
            - call: "POST /recipes/${recipe_id}/publish"
              payload: {}
              as: PlatformAdmin
              as_user_id: "pa-1"
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-06-10", shift_code: "AM", meals_served: 1000 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", recipe_id: "${recipe_id}", weight_grams: 2450, loss_reason: "TRIM", captured_at: "2026-06-10T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { entry_id: "$.data.id" }
            - call: "GET /waste-entries/${entry_id}"
              payload: {}
              as: ShiftLead
              as_user_id: "sl-1"
            - call: "GET /sites/${site_id}"
              payload: {}
              as: ShiftLead
              as_user_id: "sl-1"
          trigger:
            - call: "POST /shifts/${shift_id}/close"
              payload: {}
              as: ShiftLead
              as_user_id: "sl-1"
          assert:
            - "The setup GET /waste-entries/${entry_id} (shift still OPEN) returns provisional_cost_cents == 1568, final_cost_cents == null, valuation_delta_cents == null, effective_cost_cents == 1568."
            - "The setup GET /sites/${site_id} (shift still OPEN) returns valued_waste_cost_cents == 1568 and total_captured_weight_grams == 2450."
            - "After the trigger, GET /waste-entries/${entry_id} returns provisional_cost_cents == 1568 (unchanged), final_cost_cents == 2521, valuation_delta_cents == 953, effective_cost_cents == 2521."
            - "After the trigger, GET /sites/${site_id} returns valued_waste_cost_cents == 2521 and total_captured_weight_grams == 2450 (grams are untouched by the valuation switch)."
            - "The trigger response has status CLOSED, shift_waste_grams == 2450, waste_intensity_kg_per_1k_meals == 2.450 and leaderboard_score == 100.0 (raw score 103.0 clamped by the upper bound: penalty 0 + compliance penalty 0 + pre-consumer bonus 3.0)."
            - "GET /coaching-alerts?shift_id=${shift_id} returns total_count == 0 — 2.450 is far below COACHING_INTENSITY_THRESHOLD 12.000, so no alert interferes with the ledger figures above."

      - name: reduction_attainment_absolute_versus_intensity_disagree_on_same_data
        grounds: "§1.3 calculations.reduction_attainment variants ABSOLUTE / INTENSITY; §1.1 ReductionTarget.basis / absolute_reduction_pct / intensity_reduction_pct / effective_reduction_pct / attainment_state; §1.5 GET /reduction-targets/{id}/attainment."
        distinguishing_aspect: "A different entity and a different divergence axis from the valuation instance: here BOTH arms are computed and stored on every target row, and only `basis` decides which one gates attainment_state. The fixture is built so the arms have OPPOSITE SIGNS (+10.00 % absolute against -12.50 % intensity), so an implementation that silently uses grams for both bases reports ACHIEVED_PENDING where the scaffold requires BEHIND."
        test_recipe:
          setup: |
            Site with one PREP station and FT_PREP. Baseline June: shift 2026-06-10 AM,
            meals_served 250, three captures totalling 3000 g, shift CLOSED, baseline period
            2026-06-01..2026-06-30 submitted and certified -> baseline_waste_grams 3000,
            baseline_meals_served 250, baseline_intensity 12.000.
            Performance July: shift 2026-07-10 AM, meals_served 200, two captures totalling
            2700 g, shift CLOSED -> performance_intensity 13.500.
            Two targets are created with SLIGHTLY DIFFERENT window_end values (2026-07-31 and
            2026-07-30) so neither supersedes the other, yet both windows contain exactly the
            same single July shift and therefore exactly the same performance data.
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2027-01-01T00:00:00Z", capture_lock_seconds: 30 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Braised Chicken Portion", category: "PREPARED", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: true, compostable: true, donation_shelf_life_hours: 24 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-06-10", shift_code: "AM", meals_served: 250 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { june_shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${june_shift_id}", food_type_id: "${food_type_id}", weight_grams: 1200, loss_reason: "TRIM", captured_at: "2026-06-10T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${june_shift_id}", food_type_id: "${food_type_id}", weight_grams: 1000, loss_reason: "TRIM", captured_at: "2026-06-10T10:05:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${june_shift_id}", food_type_id: "${food_type_id}", weight_grams: 800, loss_reason: "SPOILAGE", captured_at: "2026-06-10T10:10:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /shifts/${june_shift_id}/close"
              payload: {}
              as: ShiftLead
              as_user_id: "sl-1"
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-07-10", shift_code: "AM", meals_served: 200 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { july_shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${july_shift_id}", food_type_id: "${food_type_id}", weight_grams: 1500, loss_reason: "TRIM", captured_at: "2026-07-10T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${july_shift_id}", food_type_id: "${food_type_id}", weight_grams: 1200, loss_reason: "TRIM", captured_at: "2026-07-10T10:05:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
            - call: "POST /shifts/${july_shift_id}/close"
              payload: {}
              as: ShiftLead
              as_user_id: "sl-1"
            - call: "POST /baseline-periods"
              payload: { site_id: "${site_id}", start_date: "2026-06-01", end_date: "2026-06-30" }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
              captures: { baseline_id: "$.data.id" }
            - call: "POST /baseline-periods/${baseline_id}/submit"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
            - call: "POST /baseline-periods/${baseline_id}/certify"
              payload: {}
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
            - call: "GET /sites/${site_id}"
              payload: {}
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
              captures: { site_v1: "$.data.version" }
            - call: "POST /reduction-targets"
              payload: { site_id: "${site_id}", baseline_period_id: "${baseline_id}", basis: "ABSOLUTE", target_reduction_pct: 10.00, window_start: "2026-07-01", window_end: "2026-07-31", expected_site_version: "${site_v1}" }
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
              captures: { abs_target_id: "$.data.id" }
            - call: "POST /reduction-targets/${abs_target_id}/activate"
              payload: {}
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
            - call: "GET /sites/${site_id}"
              payload: {}
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
              captures: { site_v2: "$.data.version" }
            - call: "POST /reduction-targets"
              payload: { site_id: "${site_id}", baseline_period_id: "${baseline_id}", basis: "INTENSITY", target_reduction_pct: 10.00, window_start: "2026-07-01", window_end: "2026-07-30", expected_site_version: "${site_v2}" }
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
              captures: { int_target_id: "$.data.id" }
          trigger:
            - call: "POST /reduction-targets/${int_target_id}/activate"
              payload: {}
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
          assert:
            - "GET /reduction-targets/${abs_target_id} returns status ACTIVE, performance_waste_grams == 2700, performance_meals_served == 200, performance_intensity_kg_per_1k_meals == 13.500, absolute_reduction_pct == 10.00, intensity_reduction_pct == -12.50, effective_reduction_pct == 10.00, attainment_state == ACHIEVED_PENDING."
            - "The trigger response (the INTENSITY target) has status ACTIVE, absolute_reduction_pct == 10.00, intensity_reduction_pct == -12.50, effective_reduction_pct == -12.50 and attainment_state == BEHIND."
            - "GET /reduction-targets/${abs_target_id}/attainment and GET /reduction-targets/${int_target_id}/attainment both report baseline_waste_grams == 3000, baseline_intensity_kg_per_1k_meals == 12.000, performance_waste_grams == 2700, performance_intensity_kg_per_1k_meals == 13.500, absolute_reduction_pct == 10.00 and intensity_reduction_pct == -12.50 — the two rows differ ONLY in basis, effective_reduction_pct and attainment_state."
            - "Neither target is SUPERSEDED: GET /reduction-targets?site_id=${site_id} returns total_count == 2 with both rows status ACTIVE (the windows differ in window_end, so the supersession rule does not apply)."
            - "attainment_state is ACHIEVED_PENDING for the ABSOLUTE target because 10.00 >= 10.00 is an INCLUSIVE comparison; both targets carry min_diversion_rate_pct 0.00, which the site's null diversion_rate_pct satisfies as 0.00."

  # =======================================================================
  - rule_id: combinatorial_formula
    mechanism: |
      Three multi-step formulas whose steps interact, covering all three modes:
      (a) calculations.shift_leaderboard_score — a weighted score with three
          interacting terms, a capped penalty nested inside min/max, a conditional
          bonus and a final clamp;
      (b) calculations.recipe_cost_per_kg — NESTED ROUNDING whose order is
          load-bearing: whole-cent rounding happens per ingredient line, the
          integers are then summed and only then divided by a 3-decimal usable
          yield. Rounding once at the end shifts the answer by a full cent;
      (c) calculations.hauler_ticket_settlement — a CIRCULAR-LOOKING pipeline: the
          fuel surcharge tier is selected from base_haul_fee_cents, while the
          subtotal that everyone is tempted to key the tier on already contains
          the surcharge. The fixture straddles the 15000 c tier edge so the two
          readings give different money.
    instances:

      - name: recipe_cost_per_kg_rounds_per_line_before_summing
        grounds: "§1.3 calculations.recipe_cost_per_kg steps 1-4 with LINE_ROUNDING_ORDER round_per_line_then_sum; §1.1 Recipe.total_ingredient_cost_cents / usable_yield_kg / cost_per_kg_cents."
        distinguishing_aspect: "Mode (b) — nested rounding. The divergence is a pure ordering effect with no state, no roles and no other entity involved: per-line rounding gives 3003 + 611 + 500 = 4114 and 4114 / 4.000 = 1028.5 -> 1029, whereas summing the exact products first gives round(4112.5) = 4113 and 4113 / 4.000 = 1028.25 -> 1028. Both intermediate sums differ AND the final answer differs, so the assert pins three numbers, not one."
        test_recipe:
          setup: |
            No prior state at all. Three ingredient lines are chosen so that (i) every
            gross line product lands exactly on a half cent (3002.5, 610.5, 499.5), (ii) the
            usable yield is exactly 4.000 kg, and (iii) the resulting quotient straddles a
            half-cent boundary (1028.5 versus 1028.25).
          setup_api_calls: []
          trigger:
            - call: "POST /recipes"
              payload:
                recipe_code: "BRZ-CHK"
                name: "Braised Chicken Thigh"
                ingredients:
                  - { ingredient_name: "chicken thigh", quantity_kg: 2.5, unit_cost_cents_per_kg: 1201, trim_loss_pct: 0.20 }
                  - { ingredient_name: "mirepoix", quantity_kg: 1.5, unit_cost_cents_per_kg: 407, trim_loss_pct: 0.00 }
                  - { ingredient_name: "cream", quantity_kg: 0.5, unit_cost_cents_per_kg: 999, trim_loss_pct: 0.00 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { recipe_id: "$.data.id" }
          assert:
            - "The trigger response returns total_ingredient_cost_cents == 4114 (NOT 4113), usable_yield_kg == 4.000 and cost_per_kg_cents == 1029 (NOT 1028)."
            - "status == DRAFT and published_cost_per_kg_cents == null and published_at == null on creation."
            - "POST /recipes/${recipe_id}/publish as PlatformAdmin returns status PUBLISHED with published_cost_per_kg_cents == 1029, i.e. the frozen value equals cost_per_kg_cents exactly."
            - "GET /recipes/${recipe_id} still reports total_ingredient_cost_cents == 4114 and cost_per_kg_cents == 1029 after publication."

      - name: hauler_ticket_surcharge_tier_keyed_on_base_fee_not_on_subtotal
        grounds: "§1.3 calculations.hauler_ticket_settlement steps 1-7 with SURCHARGE_TIER_1_CENTS 5000, SURCHARGE_TIER_2_CENTS 15000, VARIANCE_TOLERANCE_PCT 5.00, VARIANCE_CREDIT_RATE 0.10; §1.1 HaulerTicket computed fields."
        distinguishing_aspect: "Mode (c) — circular-looking dependency, a completely different failure mode from the nested-rounding instance. Base fee 14800 sits just BELOW the 15000 tier edge while the subtotal 15688 sits just ABOVE it, so keying the tier on the subtotal yields surcharge 1332 and total 16132 instead of 888 and 15688. Seven ordered steps are pinned, including a tare subtraction and a variance comparison that must NOT fire."
        test_recipe:
          setup: |
            Site with one PREP station and FT_PREP. Hauler H1: rate_cents_per_tonne 52000,
            stop_fee_cents 1800, capacity_kg_per_pickup 500, channels [COMPOST], APPROVED.
            Shift 2026-06-10 AM with meals_served 5000. Two 120000 g captures are fully routed
            onto a COMPOST consignment with container_tare_grams 2000, giving
            staged_weight_grams 240000. The consignment is staged and dispatched.
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Kitchen", site_code: "HK-01", region_code: "NE" }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { site_id: "$.data.id" }
            - call: "POST /tracking-stations"
              payload: { site_id: "${site_id}", station_code: "PREP-1", station_kind: "PREP", calibration_due_at: "2027-01-01T00:00:00Z", capture_lock_seconds: 30 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { station_id: "$.data.id" }
            - call: "POST /food-types"
              payload: { name: "Braised Chicken Portion", category: "PREPARED", default_cost_per_kg_cents: 640, donation_eligible: true, animal_feed_eligible: true, compostable: true, donation_shelf_life_hours: 24 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { food_type_id: "$.data.id" }
            - call: "POST /haulers"
              payload: { name: "Green Loop Compost", channels: ["COMPOST"], rate_cents_per_tonne: 52000, stop_fee_cents: 1800, capacity_kg_per_pickup: 500, max_concurrent_pickups: 1 }
              as: PlatformAdmin
              as_user_id: "pa-1"
              captures: { hauler_id: "$.data.id" }
            - call: "POST /haulers/${hauler_id}/approve"
              payload: {}
              as: CorporateSustainabilityLead
              as_user_id: "csl-1"
            - call: "POST /shifts"
              payload: { site_id: "${site_id}", shift_date: "2026-06-10", shift_code: "AM", meals_served: 5000 }
              as: ShiftLead
              as_user_id: "sl-1"
              captures: { shift_id: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 120000, loss_reason: "SPOILAGE", captured_at: "2026-06-10T10:00:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { entry_a: "$.data.id" }
            - call: "POST /waste-entries"
              payload: { station_id: "${station_id}", shift_id: "${shift_id}", food_type_id: "${food_type_id}", weight_grams: 120000, loss_reason: "SPOILAGE", captured_at: "2026-06-10T10:05:00Z" }
              as: KitchenStaff
              as_user_id: "ks-1"
              captures: { entry_b: "$.data.id" }
            - call: "POST /diversion-consignments"
              payload: { site_id: "${site_id}", hauler_id: "${hauler_id}", channel: "COMPOST", pickup_window_start: "2026-06-11T08:00:00Z", pickup_window_end: "2026-06-11T10:00:00Z", container_tare_grams: 2000 }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
              captures: { consignment_id: "$.data.id" }
            - call: "POST /consignment-lines"
              payload: { consignment_id: "${consignment_id}", waste_entry_id: "${entry_a}", allocated_weight_grams: 120000 }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
            - call: "POST /consignment-lines"
              payload: { consignment_id: "${consignment_id}", waste_entry_id: "${entry_b}", allocated_weight_grams: 120000 }
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
            - call: "POST /diversion-consignments/${consignment_id}/stage"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
            - call: "POST /diversion-consignments/${consignment_id}/dispatch"
              payload: {}
              as: SiteSustainabilityManager
              as_user_id: "${site_id}"
          trigger:
            - call: "POST /hauler-tickets"
              payload: { consignment_id: "${consignment_id}", ticket_number: "GLC-9001", gross_weight_grams: 252000, ticket_date: "2026-06-11" }
              as: HaulerOperator
              as_user_id: "${hauler_id}"
              captures: { ticket_id: "$.data.id" }
          assert:
            - "The trigger response returns net_weight_grams == 250000 (252000 gross minus 2000 container tare)."
            - "billable_tonnes == 0.2500 and base_haul_fee_cents == 14800 (round(0.2500 * 52000) = 13000, plus stop_fee_cents 1800)."
            - "fuel_surcharge_pct == 0.06 — the tier is selected from base_haul_fee_cents 14800, which is in [5000, 15000); it is NOT 0.09."
            - "fuel_surcharge_cents == 888 and settlement_subtotal_cents == 15688. Keying the tier on settlement_subtotal_cents (15688 >= 15000) would give 1332 and 16132; both are wrong."
            - "variance_pct == 4.17 (|250000 - 240000| / 240000 * 100 = 4.1666...), variance_credit_cents == 0 because 4.17 is not strictly greater than VARIANCE_TOLERANCE_PCT 5.00."
            - "settlement_total_cents == 15688 and status == SUBMITTED."
            - "GET /diversion-consignments/${consignment_id} reports settlement_status TICKET_SUBMITTED with logistics_status still DISPATCHED and staged_weight_grams == 240000 (the ticket never rewrites the staged weight)."

      - name: shift_leaderboard_score_weights_penalty_cap_and_conditional_bonus
        grounds: "§1.3 calculations.shift_leaderboard_score with INTENSITY_PENALTY_PER_KG 4.0, PENALTY_CAP 60.0, COMPLIANCE_WEIGHT 25.0, PRE_CONSUMER_BONUS 3.0, PRE_CONSUMER_BONUS_THRESHOLD 0.60; §1.3 calculations.shift_waste_intensity; §1.1 Shift.leaderboard_score."
        distinguishing_aspect: "Mode (a) — three interacting inputs feeding one weighted score, distinct from both the nested-rounding and the circular-dependency instances. All three terms are simultaneously non-trivial here: an intensity penalty of 8.0, a compliance penalty of 12.5 driven by a SECOND active station that never reported, and a pre-consumer bonus of +3.0 that only applies because the share reaches the 0.60 threshold. The single number 82.5 can only come out right if every term is computed and combined in the declared order."
        test_recipe:
          setup: |
            Site with target_intensity_kg_per_1k_meals 10.000 and TWO ACTIVE stations
            (PREP-1 and LINE-1). Shift 2026-06-10 AM, meals_served 250. Three captures,
