  # =========================================================================
  - section: endpoints
    instances:
      - name: list_incidents_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/incidents
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /incidents?limit=2 returns at most 2 items plus total_count and has_more in the paginated envelope."
        test_recipe:
          setup: ["Three PENDING incidents created."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T15:00:00Z" }
