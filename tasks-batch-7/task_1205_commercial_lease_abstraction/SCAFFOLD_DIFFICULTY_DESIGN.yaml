              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE   # already CLOSED; state check dominates"
            - "err != ERR_OPEN_CHALLENGE"

  # ==========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: critical_date_notify_window_start_boundary
        grounds:
          - validations[priority=13]
          - calculations.audit_window_close
          - errors[ERR_NOTIFICATION_NOT_YET_DUE]
          - errors[ERR_NOTIFICATION_WINDOW_MISSED]
        distinguishing_aspect: |
          Metric: calendar days vs due_date. Endpoint: POST /lease-admin/critical-dates/{id}/notify.
          Boundary: notify is valid exactly when today >= due_date - advance_notice_days
          AND today < due_date. at (due_date - advance - 1 day) -> NOT_YET_DUE;
          at (due_date - advance) -> success; at due_date itself -> WINDOW_MISSED (strict less-than).
        test_recipe:
          setup:
            - "ACTIVE Lease with CriticalDate kind=NOTICE_DEADLINE, due_date=2027-06-30, advance_notice_days=30"
            - "Window opens 2027-05-31 (inclusive), closes 2027-06-30 (exclusive)"
          setup_api_calls:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lease-admin/properties"
              payload: { name: "P1", address: "1 Main", total_rentable_sf: 10000, fiscal_year_end_month: 12 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /lease-admin/properties/${prop_id}/leases"
              payload: { tenant_legal_name: "T1", suite: "100", leased_sf: 4000, commencement_date: "2027-01-01", expiration_date: "2027-12-31", base_rent_annual_cents: 1200000, escalation_type: NONE, recovery_structure: NNN, pro_rata_share_bps: 4000, security_deposit_cents: 0 }
              as: PortfolioManager
              captures: { lease_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/abstract"
              payload: {}
              as: Abstractor
            - call: "POST /lease-admin/leases/${lease_id}/certify"
              payload: {}
              as: Certifier
            - call: "POST /lease-admin/leases/${lease_id}/rent-schedule-lines"
              payload: { period_start: "2027-01-01", period_end: "2028-01-01", base_rent_cents: 1200000 }
              as: PortfolioManager
            - call: "POST /lease-admin/properties/${prop_id}/recovery-pools"
              payload: { category: CAM, fiscal_year: 2027, budgeted_cents: 1200000 }
              as: LeaseAccountant
              captures: { pool_id: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/recovery-billings"
              payload: { pool_id: "${pool_id}", fiscal_year: 2027, period_index: 1 }
              as: LeaseAccountant
              captures: { b_id: $.data.id }
            - call: "POST /lease-admin/recovery-billings/${b_id}/issue"
              payload: {}
              as: LeaseAccountant
            - call: "POST /lease-admin/leases/${lease_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "POST /lease-admin/leases/${lease_id}/critical-dates"
              payload: { kind: NOTICE_DEADLINE, due_date: "2027-06-30", advance_notice_days: 30 }
              as: PropertyManager
              captures: { cd_1: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/critical-dates"
              payload: { kind: NOTICE_DEADLINE, due_date: "2027-06-30", advance_notice_days: 30 }
              as: PropertyManager
              captures: { cd_2: $.data.id }
            - call: "POST /lease-admin/leases/${lease_id}/critical-dates"
              payload: { kind: NOTICE_DEADLINE, due_date: "2027-06-30", advance_notice_days: 30 }
              as: PropertyManager
              captures: { cd_3: $.data.id }
          trigger:
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-30T00:00:00Z" }  # one day BEFORE window
              as: PlatformAdmin
            - call: "POST /lease-admin/critical-dates/${cd_1}/notify"
              payload: {}
              as: PropertyManager
              captures: { err_early: $.data.error_id }
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-31T00:00:00Z" }  # first valid day
              as: PlatformAdmin
            - call: "POST /lease-admin/critical-dates/${cd_2}/notify"
              payload: {}
              as: PropertyManager
              captures: { status_ok: $.data.status }
            - call: "POST /lease-admin/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-30T00:00:00Z" }  # ON due_date (excluded)
              as: PlatformAdmin
            - call: "POST /lease-admin/critical-dates/${cd_3}/notify"
              payload: {}
              as: PropertyManager
              captures: { err_late: $.data.error_id }
          assert:
            - "err_early == ERR_NOTIFICATION_NOT_YET_DUE   # one day early, >= check"
            - "status_ok == NOTIFIED                       # exact window start, accepted"
            - "err_late == ERR_NOTIFICATION_WINDOW_MISSED # on due_date, strict < check"

      - name: schedule_line_half_open_overlap_boundary
        grounds:
          - validations[priority=9]
          - errors[ERR_SCHEDULE_OVERLAP]
        distinguishing_aspect: |
          Metric: half-open interval overlap on dates. Endpoint: POST /lease-admin/leases/{id}/rent-schedule-lines.
          Boundary: new line with period_start == existing.period_end is NOT overlap
          (adjacent); new line with period_start == existing.period_end - 1 day IS overlap.
          Different metric (interval vs calendar day) and different endpoint from notify boundary.
        test_recipe:
          setup:
