            - { call: "POST /grants/applications/${app_a}/submit", payload: {}, as: Applicant, as_user_id: "${pi1}", captures: { app_a_v: $.data.version } }
            - { call: "POST /grants/applications/${app_a}/referral", payload: { study_section_id: "${sec_a}", institute_id: "${insti_id}", expected_application_version: "${app_a_v}" }, as: ReferralOfficer }
            - { call: "POST /grants/applications", payload: { foa_id: "${foa_id}", institution_id: "${inst_id}", title: "PB", research_strategy_page_count: 5, direct_cents_per_year: [20000000], requested_years: 1 }, as: Applicant, as_user_id: "${pi2}", captures: { app_b: $.data.id } }
            - { call: "POST /grants/applications/${app_b}/submit", payload: {}, as: Applicant, as_user_id: "${pi2}", captures: { app_b_v: $.data.version } }
            - { call: "POST /grants/applications/${app_b}/referral", payload: { study_section_id: "${sec_b}", institute_id: "${insti_id}", expected_application_version: "${app_b_v}" }, as: ReferralOfficer }
            - { call: "POST /grants/applications", payload: { foa_id: "${foa_id}", institution_id: "${inst_id}", title: "PC", research_strategy_page_count: 5, direct_cents_per_year: [20000000], requested_years: 1 }, as: Applicant, as_user_id: "${pi3}", captures: { app_c: $.data.id } }
