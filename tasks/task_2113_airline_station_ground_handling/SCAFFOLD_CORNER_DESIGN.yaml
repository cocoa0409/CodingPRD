          rationale: "Provisional 18000 versus final 31416 on the same turn is exactly what that §1.8 instance pins."

  # =======================================================================
  - section: validations
    instances:

      - name: turn_scheduled_outside_bank_window_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=13]
          - errors[ERR_TURN_WINDOW_OUTSIDE_BANK]
          - entities.FlightBank.fields.window_end
        distinguishing_aspect: "A turn whose scheduled_out 22:30 falls past the bank window_end 22:00 is refused with ERR_TURN_WINDOW_OUTSIDE_BANK and HTTP 409, leaving turn_count at 0."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with FlightBank AM1 spanning 2026-04-10T04:00:00Z to 2026-04-10T22:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
          trigger:
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T22:10:00Z", scheduled_out: "2026-04-10T22:30:00Z" }
              as: DutyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_TURN_WINDOW_OUTSIDE_BANK"
            - "HTTP status is 409"
            - "FlightBank.${fb_id}.turn_count == 0"

      - name: turn_referencing_bank_of_another_station_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=6]
          - errors[ERR_STATION_SCOPE_MISMATCH]
        distinguishing_aspect: "Station scope is checked at priority 6, before any temporal test: a turn naming station ZRH with a flight_bank belonging to GVA returns ERR_STATION_SCOPE_MISMATCH with HTTP 409 even though its window also falls outside that bank."
        test_recipe:
          setup:
            - "Stations ZRH and GVA are both OPEN in season SUMMER."
            - "FlightBank GVA-1 belongs to GVA and spans 2026-04-10T04:00:00Z to 2026-04-10T10:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { zrh_id: $.data.id }
            - call: "POST /stations/${zrh_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "GVA", name: "Geneva", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { gva_id: $.data.id }
            - call: "POST /stations/${gva_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${gva_id}", bank_code: "GVA-1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T10:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { gva_fb: $.data.id }
          trigger:
            - call: "POST /turns"
              payload: { station_id: "${zrh_id}", flight_bank_id: "${gva_fb}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T18:00:00Z", scheduled_out: "2026-04-10T18:20:00Z" }
              as: DutyOfficer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_STATION_SCOPE_MISMATCH"
            - "${err} != ERR_TURN_WINDOW_OUTSIDE_BANK"
            - "HTTP status is 409"
            - "FlightBank.${gva_fb}.turn_count == 0"

      - name: duplicate_iata_code_returns_duplicate_code
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_DUPLICATE_CODE]
          - entities.Station.fields.iata_code
        distinguishing_aspect: "iata_code is unique across all stations, so a second POST /stations with iata_code ZRH returns ERR_DUPLICATE_CODE with HTTP 409 and no second row."
        test_recipe:
          setup:
            - "Station ZRH already exists in PLANNED status."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
          trigger:
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich Cargo", handler_code: "MNZ", season_code: "WINTER" }
              as: StationManager
              captures: { err: $.data.error_id }
            - call: "GET /stations"
              payload: { limit: 10, offset: 0 }
              as: StationManager
              captures: { only_id: "$.data[0].id" }
          assert:
            - "${err} == ERR_DUPLICATE_CODE"
            - "HTTP status of the duplicate create is 409"
            - "${only_id} == ${st_id}"
            - "the station list returns exactly 1 element with total_count 1"

      - name: second_billing_line_for_same_turn_returns_duplicate_billing_line
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_DUPLICATE_BILLING_LINE]
          - entities.Turn.fields.billed
        distinguishing_aspect: "A turn may carry at most one non-VOID line across all periods, so a second accrual for the same turn returns ERR_DUPLICATE_BILLING_LINE with HTTP 409 and leaves accrued_cents at 18000."
        test_recipe:
          setup:
            - "Station ZRH is OPEN with one SCHEDULED TOWING_ONLY turn scheduled 06:00-06:20."
            - "BillingPeriod 2026-04 is OPEN and already carries one PROVISIONAL line of 18000 cents for that turn."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t_id: $.data.id }
            - call: "POST /billing-periods"
              payload: { station_id: "${st_id}", period_code: "2026-04", window_start: "2026-04-01T00:00:00Z", window_end: "2026-04-30T23:59:00Z" }
              as: BillingController
              captures: { bp_id: $.data.id, bp_v: $.data.version }
            - call: "POST /billing-lines"
              payload: { billing_period_id: "${bp_id}", turn_id: "${t_id}", expected_billing_period_version: "${bp_v}" }
              as: BillingController
              captures: { bl_id: $.data.id }
            - call: "GET /billing-periods/${bp_id}"
              payload: {}
              as: BillingController
              captures: { bp_v2: $.data.version }
          trigger:
            - call: "POST /billing-lines"
              payload: { billing_period_id: "${bp_id}", turn_id: "${t_id}", expected_billing_period_version: "${bp_v2}" }
              as: BillingController
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DUPLICATE_BILLING_LINE"
            - "HTTP status is 409"
            - "BillingPeriod.${bp_id}.line_count == 1"
            - "BillingPeriod.${bp_id}.accrued_cents == 18000"
            - "Turn.${t_id}.billed == true"

      - name: incident_occurred_at_after_the_logical_clock_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - entities.Incident.fields.occurred_at
        distinguishing_aspect: "occurred_at 2026-04-02 with the logical clock pinned at 2026-04-01 is in the future, so POST /incidents returns ERR_INVALID_REQUEST with HTTP 400 and the station's incident counters stay at 0."
        test_recipe:
          setup:
            - "Station ZRH is OPEN and the logical clock reads 2026-04-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER" }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
          trigger:
            - call: "POST /incidents"
              payload: { station_id: "${st_id}", incident_type: "NEAR_MISS", severity: "MINOR", occurred_at: "2026-04-02T00:00:00Z" }
              as: DutyOfficer
              as_user_id: "duty-01"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status is 400"
            - "Station.${st_id}.open_major_incident_count == 0"
            - "Station.${st_id}.oversight_posture == NORMAL"

      - name: gse_occupation_touching_a_booked_future_service_hold_is_rejected
        claim_type: temporal_validation
        grounds:
          - calculations.gse_occupation_overlap
          - state_machines.GseUnit.AVAILABLE_to_AVAILABLE
          - errors[ERR_GSE_SERVICE_HOLD_CONFLICT]
          - validations[priority=13]
        distinguishing_aspect: "A hold booked for a future hold_start leaves the unit AVAILABLE, and the hold window is a CLOSED interval with no buffer: an occupation of [06:30, 07:00] inside [06:00, 08:00] is refused with ERR_GSE_SERVICE_HOLD_CONFLICT while one at [09:00, 09:30] is accepted."
        test_recipe:
          setup:
            - "Station ZRH is OPEN; the logical clock reads 2026-04-01T00:00:00Z."
            - "Tug TUG-01 is AVAILABLE and carries a BOOKED service hold of [2026-04-10T06:00:00Z, 2026-04-10T08:00:00Z] whose hold_start is in the future."
            - "One SCHEDULED TOWING_ONLY turn exists on 2026-04-10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00Z" }
              as: StationManager
            - call: "POST /stations"
              payload: { iata_code: "ZRH", name: "Zurich", handler_code: "SWP", season_code: "SUMMER", gse_reposition_buffer_minutes: 20 }
              as: StationManager
              captures: { st_id: $.data.id }
            - call: "POST /stations/${st_id}/lifecycle"
              payload: { action: "OPEN" }
              as: StationManager
            - call: "POST /flight-banks"
              payload: { station_id: "${st_id}", bank_code: "AM1", season_code: "SUMMER", window_start: "2026-04-10T04:00:00Z", window_end: "2026-04-10T22:00:00Z", planned_headcount: 1 }
              as: DutyOfficer
              captures: { fb_id: $.data.id }
            - call: "POST /turns"
              payload: { station_id: "${st_id}", flight_bank_id: "${fb_id}", flight_number: "LX318", turn_type: "TOWING_ONLY", scheduled_in: "2026-04-10T06:00:00Z", scheduled_out: "2026-04-10T06:20:00Z" }
              as: DutyOfficer
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /gse-units"
              payload: { station_id: "${st_id}", asset_tag: "TUG-01", gse_type: "PUSHBACK_TUG" }
              as: StationManager
              captures: { g_id: $.data.id }
            - call: "POST /gse-units/${g_id}/service-events"
              payload: { event_type: "HOLD_SCHEDULED", hold_start: "2026-04-10T06:00:00Z", hold_end: "2026-04-10T08:00:00Z" }
              as: StationManager
              captures: { g_status_booked: $.data.status, hs: $.data.service_hold_start, he: $.data.service_hold_end }
          trigger:
            - call: "POST /turn-resources"
              payload: { turn_id: "${t_id}", resource_kind: "GSE", gse_unit_id: "${g_id}", window_start: "2026-04-10T06:30:00Z", window_end: "2026-04-10T07:00:00Z", expected_turn_version: "${t_v}" }
              as: DutyOfficer
              captures: { err: $.data.error_id }
            - call: "POST /turn-resources"
