# =============================================================================
# Task 1964 — Cut-&-Sew Apparel Factory (domestic) — Scaffold seed tables
# =============================================================================

scenario: |
  1964. Cut-&-Sew Apparel Factory (domestic): tech pack & size grading, marker making & fabric utilization, bundle ticketing & piece-rate payroll, style/color/size (SKU) work-in-process, sewing line balance & operator efficiency, quality audit AQL & rework loop, trim shortage hold, made-in-USA content claim

domain_name: cut-sew-apparel
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns: [one_to_many, many_to_many, self_referential, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: Style
    parent: null
    common_fields: true
    fields:
      - { name: style_code, type: string, source: input, description: "Unique style code", constraints: "unique across all styles" }
      - { name: description, type: string, source: input, required: false, description: "Optional description" }
      - { name: base_size, type: string, source: input, description: "Size at which base_measurements are taken; must be a member of size_run" }
      - { name: size_run, type: array, source: input, description: "Ordered list of size labels, e.g. [XS,S,M,L,XL]; order defines grading steps" }
      - { name: declared_fabric_domestic, type: boolean, source: input, description: "Whether the shell fabric used for this style is of USA origin (declared basis for content claim)" }
      - { name: target_content_claim, type: enum, source: input, description: "NONE | MADE_IN_USA" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE (auto DRAFT->ACTIVE on first ProductionOrder created for this style)" }
      - { name: active_tech_pack_id, type: string, source: system, description: "FK -> TechPack.id; nullable", constraints: "set when a TechPack is APPROVED; re-pointed on supersede" }
      - { name: domestic_content_pct_cost, type: number, source: computed, description: "Cost-basis domestic share ratio (4dp, round_half_up) per calculations.domestic_content_determination; null until a TechPack is APPROVED" }
      - { name: domestic_component_ratio, type: number, source: computed, description: "Unit-basis domestic component ratio (4dp, round_half_up); null until a TechPack is APPROVED" }
      - { name: content_qualification, type: enum, source: computed, description: "UNDETERMINED | QUALIFIED_STRICT | QUALIFIED_COST_ONLY | NOT_QUALIFIED" }
      - { name: certification_status, type: enum, source: system, description: "UNCERTIFIED | CERTIFIED | REVOKED" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of certifying PlantManager; nullable" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator" }

  - name: TechPack
    parent: null
    common_fields: true
    fields:
      - { name: style_id, type: string, source: input, description: "FK -> Style.id" }
      - { name: version_no, type: integer, source: input, description: "Pack version number (>=1); unique per style among non-SUPERSEDED packs", constraints: ">=1" }
      - { name: base_measurements, type: array, source: input, description: "[{point, base_value_in}] measured at style.base_size; inches" }
      - { name: grade_rules, type: array, source: input, description: "[{point, per_step_increment_in}] applied per size step away from base_size; inches; signed" }
      - { name: labor_cost_cents_per_unit, type: integer, source: input, description: "Domestic direct labor cost per garment, cents (content-claim cost basis)", constraints: ">=0" }
      - { name: fabric_cost_cents_per_unit, type: integer, source: input, description: "Shell fabric cost per garment, cents (content-claim cost basis)", constraints: ">=0" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_APPROVAL | APPROVED | REJECTED | SUPERSEDED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creating Merchandiser" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of reviewing PlantManager; nullable" }

  - name: OperationSpec
    parent: null
    common_fields: true
    fields:
      - { name: tech_pack_id, type: string, source: input, description: "FK -> TechPack.id" }
      - { name: sequence_no, type: integer, source: input, description: "Route position (>=1); unique within tech_pack_id; precedence is ascending sequence_no", constraints: ">=1, unique per tech_pack_id" }
      - { name: name, type: string, source: input, description: "Operation name, e.g. 'attach collar'" }
      - { name: machine_type, type: enum, source: input, description: "SINGLE_NEEDLE | OVERLOCK | COVERSTITCH | BUTTONHOLE | MANUAL" }
      - { name: sam_seconds, type: integer, source: input, description: "Standard allowed seconds per piece for this operation", constraints: ">0" }
      - { name: piece_rate_cents, type: integer, source: input, description: "Piece rate paid per completed piece for this operation, cents", constraints: ">=0" }

  - name: TrimItem
    parent: null
    common_fields: true
    fields:
      - { name: sku_code, type: string, source: input, description: "Unique trim SKU code", constraints: "unique" }
      - { name: description, type: string, source: input, description: "Trim description" }
      - { name: origin_country, type: string, source: input, description: "ISO 3166-1 alpha-2 country of origin; 'US' is domestic" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Cost per unit, cents", constraints: ">=0" }
      - { name: qty_on_hand, type: integer, source: system, description: "Physical units on hand; starts 0; += receive qty", default: 0 }
      - { name: qty_reserved, type: integer, source: computed, description: "Units reserved by ProductionOrders in PLANNED/CUTTING/SEWING whose plan reserved this item and which are not FINISHED", default: 0 }
      - { name: qty_available, type: integer, source: computed, description: "= qty_on_hand - qty_reserved", default: 0 }

  - name: TrimRequirement
    parent: null
    common_fields: true
    fields:
      - { name: tech_pack_id, type: string, source: input, description: "FK -> TechPack.id" }
      - { name: trim_item_id, type: string, source: input, description: "FK -> TrimItem.id" }
      - { name: units_per_garment, type: integer, source: input, description: "Trim units consumed per garment", constraints: ">=1" }
      - { name: wastage_pct, type: number, source: input, description: "Wastage allowance as a fraction, 0..0.5", constraints: "0 <= w <= 0.5" }

  - name: FabricRoll
    parent: null
    common_fields: true
    fields:
      - { name: roll_code, type: string, source: input, description: "Unique roll identifier", constraints: "unique" }
      - { name: fabric_code, type: string, source: input, description: "Fabric quality/code" }
      - { name: origin_country, type: string, source: input, description: "ISO alpha-2 country of origin" }
      - { name: cost_cents_per_yard, type: integer, source: input, description: "Fabric cost per yard, cents", constraints: ">=0" }
      - { name: received_yards, type: number, source: input, description: "Yards received (2dp)", constraints: ">0" }
      - { name: usable_yards, type: number, source: computed, description: "= received_yards once QC PASS; 0 while RECEIVED or REJECTED" }
      - { name: allocated_yards, type: number, source: computed, description: "Yards reserved by Markers in APPROVED status referencing this roll" }
      - { name: consumed_yards, type: number, source: computed, description: "Yards consumed by Markers in CUT status referencing this roll" }
      - { name: available_yards, type: number, source: computed, description: "= usable_yards - allocated_yards - consumed_yards" }
      - { name: status, type: enum, source: system, description: "RECEIVED | AVAILABLE | REJECTED | DEPLETED" }

  - name: ProductionOrder
    parent: null
    common_fields: true
    fields:
      - { name: style_id, type: string, source: input, description: "FK -> Style.id" }
      - { name: color, type: string, source: input, description: "Colorway for this order" }
      - { name: size_quantities, type: array, source: input, description: "[{size, qty}]; every size must be a member of style.size_run; no duplicate sizes; qty > 0" }
      - { name: tech_pack_id, type: string, source: system, description: "FK -> TechPack.id; pinned by the plan action; immutable thereafter", constraints: "null until planned" }
      - { name: total_order_qty, type: integer, source: computed, description: "= sum of size_quantities[].qty" }
      - { name: production_status, type: enum, source: system, description: "PLANNED | CUTTING | SEWING | FINISHED" }
      - { name: trim_hold_status, type: enum, source: system, description: "MATERIALS_OK | TRIM_HOLD (independent parallel dimension)" }
      - { name: quality_status, type: enum, source: system, description: "QC_PENDING | QC_PASSED | QC_FAILED | REWORK_IN_PROGRESS (independent parallel dimension)" }
      - { name: made_in_usa_eligible, type: boolean, source: computed, description: "Computed at plan: true iff pinned pack's trim BOM all origin_country == 'US' AND style.declared_fabric_domestic" }
      - { name: trim_shortages, type: array, source: computed, description: "At plan: [{trim_item_id, required_units, available_units, shortage_units}] for shorted lines; [] when fully covered" }

  - name: Marker
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: input, description: "FK -> ProductionOrder.id" }
      - { name: fabric_roll_id, type: string, source: input, description: "FK -> FabricRoll.id; single-roll spread (one marker consumes from exactly one roll)" }
      - { name: marker_length_yards, type: number, source: input, description: "Marker face length in yards (2dp)", constraints: ">0" }
      - { name: planned_pieces, type: integer, source: input, description: "Total garment pieces on this marker", constraints: ">0" }
      - { name: allocated_yards, type: number, source: computed, description: "Reservation computed at approve per calculations.marker_allocation_and_utilization; 0 until APPROVED and after CANCELLED/CUT conversion" }
      - { name: utilization_gross_pct, type: number, source: computed, description: "Gross utilization variant (1dp); null until APPROVED" }
      - { name: utilization_net_pct, type: number, source: computed, description: "Net utilization variant (1dp); null until APPROVED" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | CUT | CANCELLED" }

  - name: Bundle
    parent: null
    common_fields: true
    fields:
      - { name: marker_id, type: string, source: system, description: "FK -> Marker.id; set by the cut action that creates the bundle" }
      - { name: production_order_id, type: string, source: system, description: "FK -> ProductionOrder.id; copied from the marker's order" }
      - { name: size, type: string, source: system, description: "Size label of this bundle (SKU axis: style x color x size via order + this field)" }
      - { name: qty, type: integer, source: system, description: "Pieces in this bundle, from the cut distribution" }
      - { name: ticket_no, type: string, source: system, description: "Bundle ticket number; sequential per order: '{order_seq}-{size}-{n}' where order_seq is the order's creation ordinal and n is 1-based within the cut in size_quantities order" }
      - { name: status, type: enum, source: system, description: "TICKETED | RELEASED | IN_PROGRESS | REWORK_HOLD | COMPLETED" }
      - { name: pre_rework_status, type: enum, source: system, description: "RELEASED | IN_PROGRESS | COMPLETED; snapshot of status when the bundle entered REWORK_HOLD; null otherwise", constraints: "null until first REWORK_HOLD" }
      - { name: completed_through_seq, type: integer, source: computed, description: "Highest sequence_no fully verified on this bundle; 0 when none", default: 0 }

  - name: SewingLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Unique line code", constraints: "unique" }
      - { name: station_count, type: integer, source: input, description: "Number of workstations (aggregate interval capacity)", constraints: ">=1" }
      - { name: shift_minutes, type: integer, source: input, description: "Planned minutes per shift", constraints: ">0" }

  - name: LineAssignment
    parent: null
    common_fields: true
    fields:
      - { name: sewing_line_id, type: string, source: input, description: "FK -> SewingLine.id" }
      - { name: production_order_id, type: string, source: input, description: "FK -> ProductionOrder.id" }
      - { name: operation_spec_id, type: string, source: input, description: "FK -> OperationSpec.id" }
      - { name: operator_id, type: string, source: input, description: "FK -> Operator.id" }
      - { name: shift_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of the scheduled shift" }
      - { name: start_minute, type: integer, source: input, description: "Minute of day, 0..1439", constraints: "0 <= start_minute < end_minute" }
      - { name: end_minute, type: integer, source: input, description: "Minute of day, <= 1440", constraints: "start_minute < end_minute <= 1440" }
      - { name: assigned_pieces, type: integer, source: input, description: "Planned pieces for this assignment", constraints: ">0" }

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: employee_no, type: string, source: input, description: "Unique employee number", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Operator full name" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE" }
      - { name: efficiency_pct, type: number, source: computed, description: "Lifetime efficiency per calculations.operator_efficiency (1dp); 0 when attended_minutes == 0" }
      - { name: ytd_earnings_cents, type: integer, source: computed, description: "Sum of payable_cents over PAID PieceWorkEntries", default: 0 }

  - name: PieceWorkEntry
    parent: null
    common_fields: true
    fields:
      - { name: bundle_id, type: string, source: input, description: "FK -> Bundle.id" }
      - { name: operation_spec_id, type: string, source: input, description: "FK -> OperationSpec.id" }
      - { name: operator_id, type: string, source: system, description: "FK -> Operator.id; taken from X-User-ID of the SewingOperator caller (entity-backed identity); body field ignored" }
      - { name: work_date, type: string, source: input, description: "ISO date the work was performed" }
      - { name: qty, type: integer, source: input, description: "Pieces completed for this operation on this bundle", constraints: ">0" }
      - { name: piece_earnings_cents, type: integer, source: computed, description: "Straight piece variant: qty x operation.piece_rate_cents" }
      - { name: earned_minutes, type: number, source: computed, description: "= qty x operation.sam_seconds / 60 (2dp)" }
      - { name: payable_cents, type: integer, source: computed, description: "Guarantee-variant payable incl. top-up and bonus shares; null until stamped by a payroll calculate", constraints: "null until CALCULATED" }
      - { name: payroll_run_id, type: string, source: system, description: "FK -> PayrollRun.id; nullable", constraints: "stamped by calculate; cleared if run rejected back to OPEN" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of reviewing LineSupervisor; nullable" }
      - { name: status, type: enum, source: system, description: "LOGGED | VERIFIED | REJECTED | PAID" }

  - name: PayrollRun
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: string, source: input, description: "ISO date, inclusive lower bound of the pay period" }
      - { name: period_end, type: string, source: input, description: "ISO date, inclusive upper bound; >= period_start" }
      - { name: status, type: enum, source: system, description: "OPEN | CALCULATED | APPROVED | PAID" }
      - { name: calculated_by_user_id, type: string, source: system, description: "X-User-ID of the PayrollClerk who ran calculate; nullable" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the PlantManager who approved; nullable" }
      - { name: entry_count, type: integer, source: computed, description: "Entries swept into this run by the latest calculate" }
      - { name: total_piece_cents, type: integer, source: computed, description: "Sum of piece_earnings_cents over swept entries" }
      - { name: total_topup_cents, type: integer, source: computed, description: "Sum of guaranteed-minimum top-ups over swept operator-days" }
      - { name: total_bonus_cents, type: integer, source: computed, description: "Sum of efficiency bonuses over swept operators" }
      - { name: total_payable_cents, type: integer, source: computed, description: "= total_piece_cents + total_topup_cents + total_bonus_cents" }

  - name: QualityAudit
    parent: null
    common_fields: true
    fields:
      - { name: production_order_id, type: string, source: input, description: "FK -> ProductionOrder.id" }
      - { name: re_audit_of_audit_id, type: string, source: input, required: false, description: "FK -> QualityAudit.id; self-referential re-audit chain link; null for first-pass audits", constraints: "must reference a REWORK_RECORDED audit of the same order" }
      - { name: inspection_level, type: enum, source: input, description: "NORMAL | TIGHTENED (TIGHTENED bumps code letter one step, capped at J)" }
      - { name: aql_level, type: enum, source: input, description: "AQL_2_5 | AQL_4_0" }
      - { name: lot_size, type: integer, source: computed, description: "= order.total_order_qty at audit creation" }
      - { name: code_letter, type: string, source: computed, description: "A|B|C|D|E|F|G|H|J per calculations.aql_sample_plan" }
      - { name: sample_size, type: integer, source: computed, description: "Per calculations.aql_sample_plan" }
      - { name: accept_max, type: integer, source: computed, description: "Ac: defects_found <= accept_max at record => PASS" }
      - { name: reject_min, type: integer, source: computed, description: "Re: defects_found >= reject_min at record => FAIL; always accept_max + 1" }
      - { name: defects_found, type: integer, source: input, description: "Supplied via the record endpoint body; null until recorded" }
      - { name: result, type: enum, source: system, description: "NONE | PASS | FAIL" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of recording QualityInspector; nullable" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED_PASS | CLOSED_FAIL | REWORK_RECORDED | SUPERSEDED" }

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: Style
    initial_state: "status=DRAFT, certification_status=UNCERTIFIED"
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system (automatic when the first ProductionOrder referencing this style is created)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Style.version by 1"
        note: "Style.status dimension. Auto-activation only fires from DRAFT; later orders leave ACTIVE unchanged."
      - from: UNCERTIFIED
        to: CERTIFIED
        trigger: "POST /styles/{id}/certify-content-claim"
        actor: PlantManager
        preconditions:
          - "certification_status in {UNCERTIFIED, REVOKED} (ERR_INVALID_STATE_TRANSITION otherwise)"
          - "content_qualification == QUALIFIED_STRICT (ERR_NOT_CERTIFIABLE)"
        side_effects:
          - "certified_by_user_id = X-User-ID"
          - "increments Style.version by 1"
        note: "Style.certification_status dimension."
      - from: CERTIFIED
        to: REVOKED
        trigger: "system (automatic when a TechPack review APPROVE re-points style.active_tech_pack_id and the recomputed content_qualification is not QUALIFIED_STRICT)"
        actor: system
        preconditions:
          - "certification_status == CERTIFIED"
          - "recomputed content_qualification != QUALIFIED_STRICT after active pack change"
        side_effects:
          - "certified_by_user_id = null"
          - "increments Style.version by 1"

  - entity: TechPack
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /tech-packs/{id}/submit"
        actor: Merchandiser
        preconditions:
          - "pack status == DRAFT (ERR_INVALID_STATE_TRANSITION)"
          - "at least one OperationSpec exists for this pack (ERR_NO_OPERATION_SPECS)"
          - "base_measurements non-empty and every grade_rules.point appears in base_measurements (ERR_INVALID_REQUEST)"
        side_effects:
          - "increments TechPack.version by 1"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /tech-packs/{id}/review with decision=APPROVE"
        actor: PlantManager
        preconditions:
          - "pack status == PENDING_APPROVAL (ERR_TECH_PACK_NOT_PENDING_REVIEW)"
          - "expected_style_version == Style.version (ERR_STALE_VERSION, 412; checked before state)"
          - "reviewer X-User-ID != pack.created_by_user_id (ERR_SOD_SELF_REVIEW)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
          - "prior APPROVED TechPack of the same style (if any) -> SUPERSEDED, its version incremented"
          - "Style.active_tech_pack_id = this pack; Style.content fields recomputed; Style.version incremented by 1"
          - "if Style.certification_status == CERTIFIED and recomputed content_qualification != QUALIFIED_STRICT: Style CERTIFIED -> REVOKED (see Style machine)"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /tech-packs/{id}/review with decision=REJECT"
        actor: PlantManager
        preconditions:
          - "pack status == PENDING_APPROVAL (ERR_TECH_PACK_NOT_PENDING_REVIEW)"
          - "expected_style_version == Style.version (ERR_STALE_VERSION, 412; checked before state)"
          - "reviewer X-User-ID != pack.created_by_user_id (ERR_SOD_SELF_REVIEW)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
          - "increments TechPack.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /tech-packs/{id}/revise"
        actor: Merchandiser
        preconditions:
          - "pack status == REJECTED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments TechPack.version by 1"
        note: "Revision loop DRAFT -> PENDING_APPROVAL -> REJECTED -> DRAFT (cyclic)."
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when a sibling TechPack of the same style is APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments TechPack.version by 1"

  - entity: FabricRoll
    initial_state: RECEIVED
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: RECEIVED
        to: AVAILABLE
        trigger: "POST /fabric-rolls/{id}/record-qc with result=PASS"
        actor: MaterialsPlanner
        preconditions:
          - "roll status == RECEIVED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "usable_yards = received_yards"
          - "increments FabricRoll.version by 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /fabric-rolls/{id}/record-qc with result=FAIL"
        actor: MaterialsPlanner
        preconditions:
          - "roll status == RECEIVED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "usable_yards = 0"
          - "increments FabricRoll.version by 1"
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system (automatic after any marker cut that leaves available_yards == 0)"
        actor: system
        preconditions:
          - "available_yards == 0 after the cut's consumption is applied"
        side_effects:
          - "increments FabricRoll.version by 1"

  - entity: ProductionOrder
    initial_state: "production_status=PLANNED, trim_hold_status=MATERIALS_OK, quality_status=QC_PENDING"
    terminal_states: [FINISHED]
    transitions:
      - from: PLANNED
        to: CUTTING
        trigger: "POST /production-orders/{id}/start-cutting"
        actor: ProductionPlanner
        preconditions:
          - "production_status == PLANNED (ERR_INVALID_STATE_TRANSITION)"
          - "tech_pack_id is pinned (order has been planned) (ERR_ORDER_NOT_PLANNED)"
          - "trim_hold_status == MATERIALS_OK (ERR_TRIM_HOLD_ACTIVE)"
          - "at least one Marker of this order in APPROVED status (ERR_NO_APPROVED_MARKER)"
        side_effects:
          - "increments ProductionOrder.version by 1"
        note: "production_status dimension."
      - from: CUTTING
        to: SEWING
        trigger: "system (automatic when the first Bundle of this order reaches RELEASED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments ProductionOrder.version by 1"
      - from: SEWING
        to: FINISHED
        trigger: "POST /production-orders/{id}/finish"
        actor: ProductionPlanner
        preconditions:
          - "production_status == SEWING (ERR_INVALID_STATE_TRANSITION)"
          - "every Bundle of this order is COMPLETED (ERR_ORDER_NOT_FINISHABLE)"
          - "quality_status == QC_PASSED (ERR_ORDER_NOT_FINISHABLE)"
        side_effects:
          - "release all trim reservations made for this order: each referenced TrimItem.qty_reserved decremented by this order's reserved units (recomputes qty_available)"
          - "increments ProductionOrder.version by 1"
      - from: MATERIALS_OK
        to: TRIM_HOLD
        trigger: "system (automatic at plan when any trim requirement line is short, per calculations.trim_grossing)"
        actor: system
        preconditions:
          - "at least one requirement line has shortage_units > 0"
        side_effects:
          - "no reservation is applied for this order (all-or-nothing per order)"
          - "trim_shortages populated"
        note: "trim_hold_status dimension (cyclic)."
      - from: TRIM_HOLD
        to: MATERIALS_OK
        trigger: "system (automatic sweep on POST /trim-items/{id}/receive; held orders re-evaluated in created_at ASC order; an order flips only if ALL its requirement lines are coverable from current qty_available, in which case reservations are applied and qty_available decremented before the next held order is evaluated)"
        actor: system
        preconditions:
          - "every requirement line of the pinned pack coverable from current qty_available"
        side_effects:
          - "reservations applied: each covered TrimItem.qty_reserved += reserved units"
          - "trim_shortages cleared to []"
          - "increments ProductionOrder.version by 1"
      - from: QC_PENDING
        to: QC_FAILED
        trigger: "system (automatic when a QualityAudit of this order records FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "every Bundle of this order in {RELEASED, IN_PROGRESS, COMPLETED} -> REWORK_HOLD (this flip itself auto-REJECTs each such bundle's LOGGED PieceWorkEntries, stamping reviewed_by_user_id = 'system')"
          - "increments ProductionOrder.version by 1"
        note: "quality_status dimension (cyclic rework loop)."
      - from: QC_FAILED
        to: REWORK_IN_PROGRESS
        trigger: "system (automatic when POST /quality-audits/{id}/rework-complete succeeds on the FAILED audit of this order)"
        actor: system
        preconditions: []
        side_effects:
          - "every Bundle of this order in REWORK_HOLD -> its pre_rework_status (RELEASED/IN_PROGRESS/COMPLETED)"
          - "increments ProductionOrder.version by 1"
      - from: REWORK_IN_PROGRESS
        to: QC_PENDING
        trigger: "system (automatic when a re-audit QualityAudit referencing the REWORK_RECORDED audit is created)"
        actor: system
        preconditions: []
        side_effects:
          - "increments ProductionOrder.version by 1"
      - from: QC_PENDING
        to: QC_PASSED
        trigger: "system (automatic when a QualityAudit of this order records PASS)"
        actor: system
        preconditions: []
        side_effects:
          - "increments ProductionOrder.version by 1"

  - entity: Marker
    initial_state: DRAFT
    terminal_states: [CUT, CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /markers/{id}/approve"
        actor: CuttingManager
        preconditions:
          - "marker status == DRAFT (ERR_MARKER_NOT_DRAFT; state, checked before any business rule)"
          - "expected_fabric_roll_version == FabricRoll.version (ERR_STALE_VERSION, 412; checked before state)"
          - "referenced FabricRoll status == AVAILABLE (ERR_ROLL_NOT_AVAILABLE)"
          - "roll.available_yards >= computed allocated_yards (ERR_INSUFFICIENT_FABRIC; equality allowed)"
        side_effects:
          - "allocated_yards computed per calculations.marker_allocation_and_utilization"
          - "utilization_gross_pct and utilization_net_pct computed and stored"
          - "FabricRoll.allocated_yards += allocated_yards; available_yards recomputed; FabricRoll.version incremented"
          - "increments Marker.version by 1"
      - from: APPROVED
        to: CUT
        trigger: "POST /markers/{id}/cut"
        actor: CuttingManager
        preconditions:
          - "marker status == APPROVED (ERR_MARKER_NOT_APPROVED)"
          - "marker.production_order.production_status == CUTTING (ERR_INVALID_STATE_TRANSITION)"
          - "cut size_quantities sizes/qtys do not exceed the order's remaining uncut qty per size (ERR_CUT_EXCEEDS_UNCUT)"
          - "sum of cut qty == marker.planned_pieces (ERR_INVALID_REQUEST)"
        side_effects:
          - "FabricRoll.allocated_yards -= marker.allocated_yards; FabricRoll.consumed_yards += marker.allocated_yards; marker.allocated_yards := 0 after transfer; roll available_yards recomputed; FabricRoll.version incremented"
          - "if roll.available_yards == 0: roll AVAILABLE -> DEPLETED"
          - "one Bundle created per size line in the cut distribution (status TICKETED, ticket_no assigned)"
          - "increments Marker.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /markers/{id}/cancel"
        actor: CuttingManager
        preconditions:
          - "marker status in {DRAFT, APPROVED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "increments Marker.version by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /markers/{id}/cancel"
        actor: CuttingManager
        preconditions:
          - "marker status in {DRAFT, APPROVED} (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "compensation: FabricRoll.allocated_yards -= marker.allocated_yards; available_yards recomputed; FabricRoll.version incremented"
          - "marker.allocated_yards := 0"
          - "increments Marker.version by 1"

  - entity: Bundle
    initial_state: TICKETED
    terminal_states: [COMPLETED]
    transitions:
      - from: TICKETED
        to: RELEASED
        trigger: "POST /bundles/{id}/release"
        actor: LineSupervisor
        preconditions:
          - "bundle status == TICKETED (ERR_BUNDLE_NOT_RELEASABLE)"
          - "order.production_status in {CUTTING, SEWING} (ERR_INVALID_STATE_TRANSITION)"
          - "order.trim_hold_status == MATERIALS_OK (ERR_TRIM_HOLD_ACTIVE)"
        side_effects:
          - "if order.production_status == CUTTING: order CUTTING -> SEWING (order.version incremented)"
          - "increments Bundle.version by 1"
      - from: RELEASED
        to: IN_PROGRESS
        trigger: "system (automatic when the first PieceWorkEntry is LOGGED against this bundle)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Bundle.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system (automatic when for EVERY OperationSpec of the pinned tech pack, sum of qty over this bundle's VERIFIED+PAID entries for that operation == bundle.qty; evaluated on each entry verification)"
        actor: system
        preconditions: []
        side_effects:
          - "completed_through_seq = max sequence_no of pinned pack"
          - "increments Bundle.version by 1"
      - from: RELEASED
        to: REWORK_HOLD
        trigger: "system (cascade from order QC_FAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "pre_rework_status = RELEASED"
          - "this bundle's PieceWorkEntries in LOGGED -> REJECTED (reviewed_by_user_id='system')"
          - "increments Bundle.version by 1"
        note: "Rework loop: REWORK_HOLD returns to pre_rework_status on rework-complete (cyclic)."
      - from: IN_PROGRESS
        to: REWORK_HOLD
        trigger: "system (cascade from order QC_FAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "pre_rework_status = IN_PROGRESS"
          - "this bundle's PieceWorkEntries in LOGGED -> REJECTED (reviewed_by_user_id='system')"
          - "increments Bundle.version by 1"
      - from: COMPLETED
        to: REWORK_HOLD
        trigger: "system (cascade from order QC_FAILED)"
        actor: system
        preconditions: []
        side_effects:
          - "pre_rework_status = COMPLETED"
          - "this bundle's PieceWorkEntries in LOGGED -> REJECTED (reviewed_by_user_id='system')"
          - "increments Bundle.version by 1"
      - from: REWORK_HOLD
        to: RELEASED
        trigger: "system (cascade from POST /quality-audits/{id}/rework-complete; applies when pre_rework_status == RELEASED)"
        actor: system
        preconditions: []
        side_effects:
          - "pre_rework_status = null; completed_through_seq unchanged (verified work survives rework)"
          - "increments Bundle.version by 1"
      - from: REWORK_HOLD
        to: IN_PROGRESS
        trigger: "system (cascade from POST /quality-audits/{id}/rework-complete; applies when pre_rework_status == IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects:
          - "pre_rework_status = null; completed_through_seq unchanged"
          - "increments Bundle.version by 1"
      - from: REWORK_HOLD
        to: COMPLETED
        trigger: "system (cascade from POST /quality-audits/{id}/rework-complete; applies when pre_rework_status == COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "pre_rework_status = null; completed_through_seq unchanged"
          - "increments Bundle.version by 1"

  - entity: PieceWorkEntry
    initial_state: LOGGED
    terminal_states: [REJECTED, PAID]
    transitions:
      - from: LOGGED
        to: VERIFIED
        trigger: "POST /piece-work-entries/{id}/review with decision=VERIFY"
        actor: LineSupervisor
        preconditions:
          - "entry status == LOGGED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
          - "recompute bundle.completed_through_seq; if all operations fully verified: bundle IN_PROGRESS -> COMPLETED"
          - "increments PieceWorkEntry.version by 1"
      - from: LOGGED
        to: REJECTED
        trigger: "POST /piece-work-entries/{id}/review with decision=REJECT, or system cascade from bundle REWORK_HOLD"
        actor: LineSupervisor
        preconditions:
          - "entry status == LOGGED (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID (or 'system' on cascade)"
          - "increments PieceWorkEntry.version by 1"
      - from: VERIFIED
        to: PAID
        trigger: "system (cascade from POST /payroll-runs/{id}/pay on the run that swept this entry)"
        actor: system
        preconditions: []
        side_effects:
          - "payable_cents stamped by the run's calculate is finalized"
          - "operator.ytd_earnings_cents += payable_cents; operator.efficiency_pct recomputed; Operator.version incremented"
          - "increments PieceWorkEntry.version by 1"

  - entity: PayrollRun
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: CALCULATED
        trigger: "POST /payroll-runs/{id}/calculate"
        actor: PayrollClerk
        preconditions:
          - "run status == OPEN (ERR_PAYROLL_NOT_OPEN)"
          - "expected_payroll_run_version == PayrollRun.version (ERR_STALE_VERSION, 412; checked before state)"
        side_effects:
          - "sweep set = VERIFIED entries with payroll_run_id null and period_start <= work_date <= period_end (inclusive)"
          - "per calculations.payroll_run_totals: stamp each swept entry payroll_run_id + payable_cents; set entry_count and totals"
          - "calculated_by_user_id = X-User-ID"
          - "increments PayrollRun.version by 1"
      - from: CALCULATED
        to: APPROVED
        trigger: "POST /payroll-runs/{id}/decide with decision=APPROVE"
        actor: PlantManager
        preconditions:
          - "run status == CALCULATED (ERR_PAYROLL_NOT_CALCULATED)"
          - "approver X-User-ID != calculated_by_user_id (ERR_SOD_PAYROLL_SELF_APPROVE)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
          - "increments PayrollRun.version by 1"
      - from: CALCULATED
        to: OPEN
        trigger: "POST /payroll-runs/{id}/decide with decision=REJECT"
        actor: PlantManager
        preconditions:
          - "run status == CALCULATED (ERR_PAYROLL_NOT_CALCULATED)"
          - "decider X-User-ID != calculated_by_user_id (ERR_SOD_PAYROLL_SELF_APPROVE)"
        side_effects:
          - "compensation: every swept entry payroll_run_id = null, payable_cents = null"
          - "calculated_by_user_id = null; entry_count and totals reset to 0"
          - "increments PayrollRun.version by 1"
        note: "Recalculation loop CALCULATED -> OPEN -> CALCULATED (cyclic)."
      - from: APPROVED
        to: PAID
        trigger: "POST /payroll-runs/{id}/pay"
        actor: PayrollClerk
        preconditions:
          - "run status == APPROVED (ERR_PAYROLL_NOT_APPROVED)"
        side_effects:
          - "every swept entry VERIFIED -> PAID (each entry flip recomputes its operator's ytd_earnings_cents and efficiency_pct)"
          - "increments PayrollRun.version by 1"

  - entity: QualityAudit
    initial_state: OPEN
    terminal_states: [CLOSED_PASS, SUPERSEDED]
    transitions:
      - from: OPEN
        to: CLOSED_PASS
        trigger: "POST /quality-audits/{id}/record with defects_found <= accept_max"
        actor: QualityInspector
        preconditions:
          - "audit status == OPEN (ERR_INVALID_STATE_TRANSITION)"
          - "if audit.re_audit_of_audit_id is not null: recorder X-User-ID != referenced audit's recorded_by_user_id (ERR_SOD_REAUDIT_SELF_RECHECK)"
        side_effects:
          - "result = PASS; recorded_by_user_id = X-User-ID"
          - "order.quality_status QC_PENDING -> QC_PASSED (order.version incremented)"
          - "increments QualityAudit.version by 1"
      - from: OPEN
        to: CLOSED_FAIL
        trigger: "POST /quality-audits/{id}/record with defects_found >= reject_min"
        actor: QualityInspector
        preconditions:
          - "audit status == OPEN (ERR_INVALID_STATE_TRANSITION)"
          - "if audit.re_audit_of_audit_id is not null: recorder X-User-ID != referenced audit's recorded_by_user_id (ERR_SOD_REAUDIT_SELF_RECHECK)"
        side_effects:
          - "result = FAIL; recorded_by_user_id = X-User-ID"
          - "order.quality_status QC_PENDING -> QC_FAILED, which cascades: bundles {RELEASED,IN_PROGRESS,COMPLETED} -> REWORK_HOLD, which cascades: their LOGGED entries -> REJECTED"
          - "increments QualityAudit.version by 1"
      - from: CLOSED_FAIL
        to: REWORK_RECORDED
        trigger: "POST /quality-audits/{id}/rework-complete"
        actor: QualityInspector
        preconditions:
          - "audit status == CLOSED_FAIL (ERR_AUDIT_NOT_FAILED)"
        side_effects:
          - "order.quality_status QC_FAILED -> REWORK_IN_PROGRESS, which cascades: bundles REWORK_HOLD -> RELEASED"
          - "increments QualityAudit.version by 1"
      - from: REWORK_RECORDED
        to: SUPERSEDED
        trigger: "system (automatic when a new QualityAudit is created with re_audit_of_audit_id == this audit)"
        actor: system
        preconditions: []
        side_effects:
          - "order.quality_status REWORK_IN_PROGRESS -> QC_PENDING"
          - "increments QualityAudit.version by 1"

# =============================================================================
# Concurrency Rules (§1.2.1) — true races only, OCC on parent version
# =============================================================================
concurrency_rules:
  - rule_id: tech-pack-review-stale-style
    parent_entity: Style
    write_endpoint: "POST /tech-packs/{id}/review"
    occ_field: expected_style_version
    description: |
      Reviewing (APPROVE or REJECT) a TechPack against a Style whose version has
      advanced since the reviewer last observed it is rejected. Approving a pack
      legitimately supersedes the style's previously APPROVED pack and re-points
      Style.active_tech_pack_id (advancing Style.version); a reviewer holding a
      stale style version is therefore acting on a superseded baseline.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: marker-approve-stale-roll
    parent_entity: FabricRoll
    write_endpoint: "POST /markers/{id}/approve"
    occ_field: expected_fabric_roll_version
    description: |
      Approving a Marker against a FabricRoll whose version has advanced since
      the cutting manager last observed it is rejected. Each successful approve
      moves yards into allocated (advancing FabricRoll.version); an approval
      carrying a pre-reservation baseline version is planning against yardage
      that no longer reflects reality, even when enough yards remain.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: payroll-calculate-stale-run
    parent_entity: PayrollRun
    write_endpoint: "POST /payroll-runs/{id}/calculate"
    occ_field: expected_payroll_run_version
    description: |
      Calculating a PayrollRun whose version has advanced since the clerk last
      observed it is rejected. A calculate on an OPEN run legitimately sweeps and
      stamps entries (advancing PayrollRun.version); a second calculate carrying
      the pre-calculation version is acting on a stale baseline and must be
      refused even when the run has since been rejected back to OPEN.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: size_grading
    trigger: "GET /tech-packs/{id}/graded-measurements (computed read; never persisted)"
    algorithm: constraint_propagation
    formula: |
      Let sizes = style.size_run (ordered), i_base = index of style.base_size in sizes.
      For each measurement point p with base value B(p) (from tech_pack.base_measurements)
      and per-step increment G(p) (from tech_pack.grade_rules; points without a grade rule
      use G(p) = 0):
        steps(size) = index(size) - i_base
        raw(p, size) = B(p) + steps(size) * G(p)
        graded(p, size) = round(raw(p, size) * 8) / 8   # nearest 1/8 inch, round_half_up on the eighth-count
      Rounding is applied PER (point, size) cell AFTER the multiplication; the cumulative
      raw value is never rounded mid-chain. Negative steps apply symmetrically.
    input_set: "The pack's base_measurements + grade_rules + parent style.size_run/base_size"
    precision: "each cell rounded to nearest 0.125 inch, round_half_up on the scaled integer"

  - name: marker_allocation_and_utilization
    trigger: "POST /markers/{id}/approve"
    algorithm: aggregation
    formula: |
      allocated_yards  = round(marker_length_yards * (1 + END_LOSS_PCT), 2) + SPLICE_YARDS
      utilization_gross_pct = round(100.0 * marker_length_yards / allocated_yards, 1)
      utilization_net_pct   = round(100.0 * marker_length_yards / (allocated_yards - SPLICE_YARDS), 1)
    input_set: "The marker being approved"
    constants:
      END_LOSS_PCT: 0.02
      SPLICE_YARDS: 0.5
    precision: "yards: 2 decimal places, round_half_up; percentages: 1 decimal place, round_half_up"
    variants:
      - name: gross
        when: "utilization reported against total allocated yards (incl. splice allowance)"
        difference: "denominator is allocated_yards"
      - name: net
        when: "utilization reported against net spread yards (excl. splice allowance)"
        difference: "denominator is allocated_yards - SPLICE_YARDS; same inputs, strictly larger result whenever SPLICE_YARDS > 0"

  - name: trim_grossing
    trigger: "POST /production-orders/{id}/plan (and the receive sweep's cover check)"
    algorithm: tiered_pricing
    formula: |
      For each TrimRequirement line of the pinned tech pack:
        exact_units(line)  = order.total_order_qty * line.units_per_garment * (1 + line.wastage_pct)
        required_units(line) = ceil(exact_units(line))       # ceiling applied PER LINE first
      order_required_total = SUM over lines of required_units(line)   # sum AFTER per-line ceiling
      For each line: available_units(line) = TrimItem.qty_available at evaluation time;
        shortage_units(line) = max(0, required_units(line) - available_units(line)).
      If any shortage_units > 0: order goes to TRIM_HOLD, NO units are reserved (all-or-nothing).
      Else: reserve per line: TrimItem.qty_reserved += required_units(line).
      NOTE the pinned rounding order: per-line ceiling THEN sum. Summing exact units and
      ceiling once yields a different total whenever >=2 lines have fractional parts whose
      sum <= 1; the per-line order is authoritative.
    input_set: "TrimRequirements of the pinned pack; order.total_order_qty; TrimItem.qty_available"
    precision: "exact_units exact decimal; required_units integer via ceil"

  - name: piece_rate_earnings
    trigger: "POST /piece-work-entries (straight variant, per entry); POST /payroll-runs/{id}/calculate (guaranteed variant, per operator-day)"
    algorithm: tiered_pricing
    formula: |
      Straight variant (at log time, per entry):
        piece_earnings_cents = qty * operation_spec.piece_rate_cents
        earned_minutes = round(qty * operation_spec.sam_seconds / 60, 2)
      Guaranteed-minimum variant (at payroll calculate, per operator per work_date):
        day_piece   = SUM of piece_earnings_cents over the operator's swept entries that work_date
        day_minutes = SUM of (end_minute - start_minute) over LineAssignments for that operator
                      with shift_date == work_date
        day_guarantee = round(day_minutes * HOURLY_GUARANTEE_CENTS / 60, 0)
        day_payable   = max(day_piece, day_guarantee)
        day_topup     = day_payable - day_piece
      The two variants disagree whenever day_piece < day_guarantee.
    input_set: "Entries: the logged entry. Guarantee: swept VERIFIED entries of the run grouped by (operator_id, work_date); LineAssignments by operator_id + shift_date"
    constants:
      HOURLY_GUARANTEE_CENTS: 1500
    precision: "cents integer; earned_minutes 2dp round_half_up; day_guarantee 0dp round_half_up"
    variants:
      - name: straight_piece
        when: "entry log time and the run's total_piece_cents basis"
        difference: "pure qty x rate; no floor"
      - name: guaranteed_minimum
        when: "payroll calculate"
        difference: "per operator-day floor at HOURLY_GUARANTEE_CENTS prorated by assigned minutes; top-up = floor - straight when positive"

  - name: operator_efficiency
    trigger: "entry verification/rejection, payroll calculate (bonus tier), payroll pay cascade, GET /operators/{id}/efficiency"
    algorithm: aggregation
    formula: |
      earned_minutes   = SUM over the operator's PieceWorkEntries with status in {VERIFIED, PAID}
                         of earned_minutes
      attended_minutes = SUM over all LineAssignments of the operator of (end_minute - start_minute)
      efficiency_pct   = attended_minutes == 0 ? 0 : round(100.0 * earned_minutes / attended_minutes, 1)
      Bonus tier (used by payroll_run_totals): efficiency_pct >= BONUS_TIER_HIGH => 10%;
        BONUS_TIER_LOW <= efficiency_pct < BONUS_TIER_HIGH => 5%; else 0%. Boundaries are >=.
    input_set: "operator's entries in {VERIFIED, PAID}; all of the operator's LineAssignments"
    constants:
      BONUS_TIER_LOW: 90
      BONUS_TIER_HIGH: 100
    precision: "1 decimal place, round_half_up"

  - name: payroll_run_totals
    trigger: "POST /payroll-runs/{id}/calculate"
    algorithm: aggregation
    formula: |
      PINNED EVALUATION ORDER (the definition is circular-looking without it):
        (1) sweep = VERIFIED entries, payroll_run_id null, period_start <= work_date <= period_end;
        (2) per operator-day: apply piece_rate_earnings guaranteed variant -> day_topup;
        (3) efficiency per operator is computed over entries in {VERIFIED, PAID} — which INCLUDES
            this run's swept VERIFIED entries (pinned: pre-pay snapshot, bonus does NOT feed back
            into efficiency);
        (4) bonus_cents(operator) = round(operator_piece_total_in_run * tier_rate(efficiency), 0);
        (5) entry.payable_cents = piece_earnings_cents + topup_share + bonus_share, where
            topup_share/bonus_share are allocated pro-rata by piece_earnings_cents across the
            operator's swept entries of that day (topup) / of the run (bonus); integer remainder
            cents go to the entry with the earliest created_at (ties impossible: created_at unique
            per creation request).
      Totals: total_piece_cents = SUM piece_earnings; total_topup_cents = SUM day_topup;
        total_bonus_cents = SUM bonus; total_payable_cents = piece + topup + bonus;
        entry_count = |sweep|.
    input_set: "VERIFIED entries in period with payroll_run_id null"
    precision: "all cent fields integer; shares rounded to integer cents, round_half_up, remainder to earliest created_at"

  - name: aql_sample_plan
    trigger: "POST /quality-audits (sample plan derivation); POST /quality-audits/{id}/record (verdict)"
    algorithm: threshold
    formula: |
      Step 1 — code letter from lot_size (order.total_order_qty at creation):
        2-8 => A; 9-15 => B; 16-25 => C; 26-50 => D; 51-90 => E; 91-150 => F;
        151-280 => G; 281-500 => H; 501-1200 => J. Ranges are inclusive both ends.
        inspection_level == TIGHTENED bumps the letter one step (A->B, ..., H->J; J stays J).
      Step 2 — sample_size from letter: A=2, B=3, C=5, D=8, E=13, F=20, G=32, H=50, J=80.
      Step 3 — (accept_max, reject_min) from (letter, aql_level):
        AQL_2_5: A 0/1, B 0/1, C 0/1, D 0/1, E 1/2, F 1/2, G 2/3, H 3/4, J 5/6
        AQL_4_0: A 0/1, B 0/1, C 0/1, D 1/2, E 1/2, F 2/3, G 3/4, H 5/6, J 7/8
      Step 4 — verdict at record: defects_found <= accept_max => PASS;
        defects_found >= reject_min => FAIL. reject_min == accept_max + 1 always, so the
        comparison boundary is exact.
    input_set: "The order's total_order_qty; audit.inspection_level; audit.aql_level"
    constants:
      LOT_TIERS: "2-8:A,9-15:B,16-25:C,26-50:D,51-90:E,91-150:F,151-280:G,281-500:H,501-1200:J"
      SAMPLE_SIZES: "A:2,B:3,C:5,D:8,E:13,F:20,G:32,H:50,J:80"
    precision: "integer table lookup; no rounding"

  - name: line_balance
    trigger: "GET /sewing-lines/{id}/balance?production_order_id=..."
    algorithm: waterfall_allocation
    formula: |
      ops = pinned tech pack's OperationSpecs ascending by sequence_no;
      total_sam = SUM(sam_seconds);
      takt_seconds = ceil(total_sam / line.station_count);
      Greedy in-sequence packing: station load starts at 0; walk ops in sequence_no order;
      place op on current station if load + op.sam_seconds <= takt_seconds, else close the
      station and start a new one (a single op with sam_seconds > takt_seconds occupies its
      own station with load = sam_seconds);
      stations_used = number of stations produced (may exceed line.station_count — that is a
      feasibility fact, not an error);
      max_station_load = MAX(station loads);
      balance_efficiency_pct = round(100.0 * total_sam / (stations_used * max_station_load), 1).
      Output object: { total_sam_seconds, takt_seconds, stations_used, max_station_load_seconds,
                       balance_efficiency_pct }.
    input_set: "line.station_count; pinned pack's OperationSpecs (any status of pack approval — read-only)"
    precision: "efficiency 1dp round_half_up; takt integer via ceil"

  - name: domestic_content_determination
    trigger: "TechPack review APPROVE (recompute for parent Style); GET /styles/{id} read"
    algorithm: weighted_scoring
    formula: |
      Let pack = style.active_tech_pack_id's pack; reqs = its TrimRequirements.
      trim_cost(line) = line.units_per_garment * TrimItem(line.trim_item_id).unit_cost_cents
                        * (1 + line.wastage_pct)          # exact decimal, no per-line ceil here
      cost_total  = SUM(trim_cost) + pack.fabric_cost_cents_per_unit + pack.labor_cost_cents_per_unit
      cost_domestic = SUM(trim_cost over lines whose item origin_country == 'US')
                      + (pack.fabric_cost_cents_per_unit if style.declared_fabric_domestic else 0)
                      + pack.labor_cost_cents_per_unit    # direct labor is domestic by scenario
      domestic_content_pct_cost = cost_total == 0 ? 0 : round(cost_domestic / cost_total, 4)
      components_total    = |reqs| + 1                    # each requirement line + the shell fabric
      components_domestic = |lines whose item origin_country == 'US'|
                            + (1 if style.declared_fabric_domestic else 0)
      domestic_component_ratio = round(components_domestic / components_total, 4)
      Qualification (pinned precedence):
        QUALIFIED_STRICT    if domestic_component_ratio == 1.0
        QUALIFIED_COST_ONLY elif domestic_content_pct_cost >= DOMESTIC_COST_THRESHOLD
        NOT_QUALIFIED       otherwise
      UNDETERMINED when style has no active pack. The two bases routinely disagree
      (cheap domestic notions + expensive foreign zipper): both fields are stored.
    input_set: "Active pack's TrimRequirements + TrimItems; pack cost fields; style.declared_fabric_domestic"
    constants:
      DOMESTIC_COST_THRESHOLD: 0.7
    precision: "ratios 4dp round_half_up"
    variants:
      - name: cost_basis
        when: "FTC-style cost-weighted reading"
        difference: "weights components by cost; can qualify at >= 0.70 even with foreign components"
      - name: unit_basis
        when: "strict all-components reading"
        difference: "unweighted component count; requires ratio == 1.0 for QUALIFIED_STRICT"

  - name: wip_by_sku
    trigger: "GET /production-orders/{id}/wip"
    algorithm: aggregation
    formula: |
      For each size in the order's size_quantities (order preserved):
        ordered_qty     = size_quantities[size].qty
        ticketed_qty    = SUM qty of the size's Bundles in {TICKETED, RELEASED}
        in_progress_qty = SUM qty of the size's Bundles in {IN_PROGRESS, REWORK_HOLD}
        completed_qty   = SUM qty of the size's Bundles in {COMPLETED}
      Output rows: [{size, ordered_qty, ticketed_qty, in_progress_qty, completed_qty}].
      Per-row invariant: ticketed_qty + in_progress_qty + completed_qty == cut qty of that size.
    input_set: "Bundles of the order grouped by size"
    precision: "integers"

# =============================================================================
# Table 4: Validation Rules Table (§1.4) — ordered by priority
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role (or 'Any' on open GET endpoints)"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list (Any = any authenticated role)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids exist (validated left-to-right); body FK fields (style_id, tech_pack_id, trim_item_id, production_order_id, fabric_roll_id, bundle_id, operation_spec_id, sewing_line_id, operator_id, re_audit_of_audit_id) reference existing resources"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 3.4
    category: business_constraint
    check: "Request-body schema: required fields present, types match, enum values valid, scalar ranges respected (wastage_pct 0..0.5, qty>0, minutes 0..1440); size_quantities members belong to style.size_run with no duplicate sizes"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all endpoints with a body
  - priority: 3.5
    category: concurrency
    check: "OCC: expected_<parent>_version equals the parent's current version (checked BEFORE state and business rules, AFTER existence)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /tech-packs/{id}/review; POST /markers/{id}/approve; POST /payroll-runs/{id}/calculate"
  - priority: 4
    category: state
    check: "Target resource is in a valid from-state for the requested transition (generic invalid-from rejection)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: all action endpoints
  - priority: 4.1
    category: state
    check: "TechPack-specific from-states: review requires PENDING_APPROVAL; plan requires pinned candidate APPROVED is NOT here (see 6.1); operation-spec/trim-requirement creation requires pack DRAFT"
    error_id: ERR_TECH_PACK_NOT_PENDING_REVIEW
    http_status: 409
    applies_to: "POST /tech-packs/{id}/review"
  - priority: 4.2
    category: state
    check: "OperationSpec/TrimRequirement creation allowed only while the referenced TechPack is DRAFT"
    error_id: ERR_TECH_PACK_NOT_EDITABLE
    http_status: 409
    applies_to: "POST /operation-specs; POST /trim-requirements"
  - priority: 4.3
    category: state
    check: "Marker approve requires marker DRAFT"
    error_id: ERR_MARKER_NOT_DRAFT
    http_status: 409
    applies_to: "POST /markers/{id}/approve"
  - priority: 4.4
    category: state
    check: "Marker cut requires marker APPROVED"
    error_id: ERR_MARKER_NOT_APPROVED
    http_status: 409
    applies_to: "POST /markers/{id}/cut"
  - priority: 4.5
    category: state
    check: "start-cutting requires the order to have been planned (tech_pack_id pinned)"
    error_id: ERR_ORDER_NOT_PLANNED
    http_status: 409
    applies_to: "POST /production-orders/{id}/start-cutting"
  - priority: 4.6
    category: state
    check: "PayrollRun from-states: calculate requires OPEN; decide requires CALCULATED; pay requires APPROVED"
    error_id: ERR_PAYROLL_NOT_OPEN
    http_status: 409
    applies_to: "POST /payroll-runs/{id}/calculate"
  - priority: 4.7
    category: state
    check: "decide requires CALCULATED"
    error_id: ERR_PAYROLL_NOT_CALCULATED
    http_status: 409
    applies_to: "POST /payroll-runs/{id}/decide"
  - priority: 4.8
    category: state
    check: "pay requires APPROVED"
    error_id: ERR_PAYROLL_NOT_APPROVED
    http_status: 409
    applies_to: "POST /payroll-runs/{id}/pay"
  - priority: 4.9
    category: state
    check: "rework-complete requires audit CLOSED_FAIL"
    error_id: ERR_AUDIT_NOT_FAILED
    http_status: 409
    applies_to: "POST /quality-audits/{id}/rework-complete"
  - priority: 4.12
    category: state
    check: "Bundle release requires bundle TICKETED"
    error_id: ERR_BUNDLE_NOT_RELEASABLE
    http_status: 409
    applies_to: "POST /bundles/{id}/release"
  - priority: 4.13
    category: state
    check: "PieceWorkEntry creation requires bundle in {RELEASED, IN_PROGRESS}"
    error_id: ERR_BUNDLE_NOT_LOGGABLE
    http_status: 409
    applies_to: "POST /piece-work-entries"
  - priority: 5
    category: business_safety
    check: "Content-claim safety: plan under a style with target_content_claim == MADE_IN_USA requires style.declared_fabric_domestic == true AND every trim requirement of the candidate pack to reference a TrimItem with origin_country == 'US' (checked even when the candidate pack is not APPROVED — safety precedes referential failure on the pack)"
    error_id: ERR_CONTENT_CLAIM_VIOLATION
    http_status: 403
    applies_to: "POST /production-orders/{id}/plan"
  - priority: 5.1
    category: business_safety
    check: "Segregation of duties: tech-pack reviewer must differ from pack creator"
    error_id: ERR_SOD_SELF_REVIEW
    http_status: 403
    applies_to: "POST /tech-packs/{id}/review"
  - priority: 5.2
    category: business_safety
    check: "Segregation of duties: payroll decider must differ from calculated_by_user_id"
    error_id: ERR_SOD_PAYROLL_SELF_APPROVE
    http_status: 403
    applies_to: "POST /payroll-runs/{id}/decide"
  - priority: 5.3
    category: business_safety
    check: "Segregation of duties: recording a re-audit (re_audit_of_audit_id not null) requires recorder != referenced audit's recorded_by_user_id"
    error_id: ERR_SOD_REAUDIT_SELF_RECHECK
    http_status: 403
    applies_to: "POST /quality-audits/{id}/record"
  - priority: 5.4
    category: business_safety
    check: "certify-content-claim requires content_qualification == QUALIFIED_STRICT"
    error_id: ERR_NOT_CERTIFIABLE
    http_status: 409
    applies_to: "POST /styles/{id}/certify-content-claim"
  - priority: 6
    category: business_referential
    check: "plan's candidate tech pack: exists (3), belongs to the order's style, and is APPROVED"
    error_id: ERR_TECH_PACK_NOT_APPROVED
    http_status: 409
    applies_to: "POST /production-orders/{id}/plan"
  - priority: 6.1
    category: business_referential
    check: "Re-audit linkage: re_audit_of_audit_id references an audit of the SAME production order"
    error_id: ERR_REAUDIT_ORDER_MISMATCH
    http_status: 422
    applies_to: "POST /quality-audits"
  - priority: 6.2
    category: business_referential
    check: "Re-audit parent audit is REWORK_RECORDED"
    error_id: ERR_REAUDIT_PARENT_NOT_REWORKED
    http_status: 409
    applies_to: "POST /quality-audits"
  - priority: 6.3
    category: business_referential
    check: "QualityAudit creation requires at least one bundle of the order in COMPLETED status"
    error_id: ERR_NO_COMPLETED_BUNDLES
    http_status: 409
    applies_to: "POST /quality-audits"
  - priority: 6.4
    category: business_referential
    check: "PieceWorkEntry's operation_spec must belong to the bundle's order's pinned tech pack"
    error_id: ERR_OPERATION_NOT_IN_TECH_PACK
    http_status: 422
    applies_to: "POST /piece-work-entries"
  - priority: 6.5
    category: business_referential
    check: "PieceWorkEntry creation requires a LineAssignment with operator_id == caller X-User-ID, operation_spec_id == entry's, production_order_id == bundle's order, shift_date == work_date"
    error_id: ERR_NO_LINE_ASSIGNMENT
    http_status: 422
    applies_to: "POST /piece-work-entries"
  - priority: 7
    category: business_constraint
    check: "Operation precedence: an entry for sequence_no N (N>1) on a bundle is loggable only when the operation with sequence_no N-1 is fully logged on that bundle (sum of qty over its non-REJECTED entries == bundle.qty)"
    error_id: ERR_OPERATION_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /piece-work-entries"
  - priority: 7.1
    category: business_constraint
    check: "PieceWorkEntry qty <= bundle.qty - sum(qty over this bundle's non-REJECTED entries for this operation)"
    error_id: ERR_QTY_EXCEEDS_REMAINING
    http_status: 422
    applies_to: "POST /piece-work-entries"
  - priority: 7.2
    category: business_constraint
    check: "Marker cut distribution: per size, sum of cut qty over all of the order's CUT markers <= ordered qty of that size"
    error_id: ERR_CUT_EXCEEDS_UNCUT
    http_status: 422
    applies_to: "POST /markers/{id}/cut"
  - priority: 7.3
    category: business_constraint
    check: "OperationSpec sequence_no unique within tech_pack_id"
    error_id: ERR_DUPLICATE_OPERATION_SEQUENCE
    http_status: 409
    applies_to: "POST /operation-specs"
  - priority: 8
    category: business_temporal
    check: "LineAssignment window: 0 <= start_minute < end_minute <= 1440"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 400
    applies_to: "POST /line-assignments"
  - priority: 8.1
    category: business_temporal
    check: "SewingLine aggregate capacity: on the same (sewing_line_id, shift_date), the number of assignments whose half-open [start_minute, end_minute) intervals overlap any point must never exceed line.station_count; pure adjacency (end == start) does not count as overlap"
    error_id: ERR_LINE_STATION_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /line-assignments"
  - priority: 8.2
    category: business_temporal
    check: "Operator buffered exclusion: for the same (operator_id, shift_date), a new assignment must satisfy new.start >= existing.end + CHANGEOVER_BUFFER_MINUTES OR new.end <= existing.start - CHANGEOVER_BUFFER_MINUTES for every existing assignment; pure adjacency is rejected (buffer required)"
    error_id: ERR_OPERATOR_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /line-assignments"
  - priority: 9
    category: business_fiscal
    check: "Marker approve: referenced FabricRoll is AVAILABLE"
    error_id: ERR_ROLL_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /markers/{id}/approve"
  - priority: 9.1
    category: business_fiscal
    check: "Marker approve: roll.available_yards >= computed allocated_yards (equality permitted); checked LAST, after state and roll-availability"
    error_id: ERR_INSUFFICIENT_FABRIC
    http_status: 409
    applies_to: "POST /markers/{id}/approve"
  - priority: 9.2
    category: business_fiscal
    check: "start-cutting requires at least one APPROVED marker for the order"
    error_id: ERR_NO_APPROVED_MARKER
    http_status: 409
    applies_to: "POST /production-orders/{id}/start-cutting"
  - priority: 9.3
    category: business_fiscal
    check: "finish requires all bundles COMPLETED and quality_status == QC_PASSED"
    error_id: ERR_ORDER_NOT_FINISHABLE
    http_status: 409
    applies_to: "POST /production-orders/{id}/finish"
  - priority: 9.4
    category: business_fiscal
    check: "tech-pack submit requires at least one OperationSpec"
    error_id: ERR_NO_OPERATION_SPECS
    http_status: 409
    applies_to: "POST /tech-packs/{id}/submit"
  - priority: 9.5
    category: business_fiscal
    check: "Order-level trim gate: start-cutting and bundle release require trim_hold_status == MATERIALS_OK"
    error_id: ERR_TRIM_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /production-orders/{id}/start-cutting; POST /bundles/{id}/release"

# =============================================================================
# Response Envelope (§1.0) — FIXED, emit verbatim
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # --- Styles ---
  - method: POST
    path: "/styles"
    description: "Create a Style"
    roles: [Merchandiser]
    code: 201
    input: [style_code, "description?", base_size, size_run, declared_fabric_domestic, target_content_claim]
    output: Style
    side_effects: ["status=DRAFT, certification_status=UNCERTIFIED, content fields null/UNDETERMINED; created_by_user_id=X-User-ID"]
  - method: GET
    path: "/styles/{id}"
    description: "Get a Style (incl. computed content fields)"
    roles: [Any]
    code: 200
    input: []
    output: Style
    side_effects: []
  - method: GET
    path: "/styles"
    description: "List Styles (optionally by active tech pack)"
    roles: [Any]
    code: 200
    input: ["active_tech_pack_id?", "limit?", "offset?"]
    output: "Style[]"
    side_effects: []
  - method: POST
    path: "/styles/{id}/certify-content-claim"
    description: "Certify the style's made-in-USA content claim"
    roles: [PlantManager]
    code: 200
    input: []
    output: Style
    side_effects: ["certification_status -> CERTIFIED; certified_by_user_id=X-User-ID; increments Style.version by 1"]

  # --- Tech packs ---
  - method: POST
    path: "/tech-packs"
    description: "Create a TechPack (DRAFT) for a style"
    roles: [Merchandiser]
    code: 201
    input: [style_id, version_no, base_measurements, grade_rules, labor_cost_cents_per_unit, fabric_cost_cents_per_unit]
    output: TechPack
    side_effects: ["status=DRAFT; created_by_user_id=X-User-ID"]
  - method: GET
    path: "/tech-packs"
    description: "List TechPacks (optionally by style)"
    roles: [Any]
    code: 200
    input: ["style_id?", "limit?", "offset?"]
    output: "TechPack[]"
    side_effects: []
  - method: GET
    path: "/tech-packs/{id}"
    description: "Get a TechPack"
    roles: [Any]
    code: 200
    input: []
    output: TechPack
    side_effects: []
  - method: GET
    path: "/tech-packs/{id}/graded-measurements"
    description: "Computed read: full graded measurement chart per calculations.size_grading"
    roles: [Any]
    code: 200
    input: []
    output: "{ size_run: array, cells: array }"
    side_effects: []
  - method: POST
    path: "/tech-packs/{id}/submit"
    description: "Submit a DRAFT pack for approval"
    roles: [Merchandiser]
    code: 200
    input: []
    output: TechPack
    side_effects: ["status DRAFT -> PENDING_APPROVAL; increments TechPack.version by 1"]
  - method: POST
    path: "/tech-packs/{id}/review"
    description: "Approve or reject a PENDING_APPROVAL pack (OCC on Style.version; supersede on APPROVE)"
    roles: [PlantManager]
    code: 200
    input: [decision, expected_style_version]
    output: TechPack
    side_effects:
      - "decision=APPROVE: status -> APPROVED; prior APPROVED sibling -> SUPERSEDED; Style.active_tech_pack_id re-pointed; Style content fields recomputed; increments Style.version by 1; possible CERTIFIED -> REVOKED cascade"
      - "decision=REJECT: status -> REJECTED"
      - "increments TechPack.version by 1"
  - method: POST
    path: "/tech-packs/{id}/revise"
    description: "Return a REJECTED pack to DRAFT for editing"
    roles: [Merchandiser]
    code: 200
    input: []
    output: TechPack
    side_effects: ["status REJECTED -> DRAFT; increments TechPack.version by 1"]

  # --- Operation specs ---
  - method: POST
    path: "/operation-specs"
    description: "Add an operation to a DRAFT tech pack"
    roles: [Merchandiser]
    code: 201
    input: [tech_pack_id, sequence_no, name, machine_type, sam_seconds, piece_rate_cents]
    output: OperationSpec
    side_effects: []
  - method: GET
    path: "/operation-specs"
    description: "List OperationSpecs (optionally by tech pack)"
    roles: [Any]
    code: 200
    input: ["tech_pack_id?", "limit?", "offset?"]
    output: "OperationSpec[]"
    side_effects: []
  - method: GET
    path: "/operation-specs/{id}"
    description: "Get an OperationSpec"
    roles: [Any]
    code: 200
    input: []
    output: OperationSpec
    side_effects: []

  # --- Trim ---
  - method: POST
    path: "/trim-items"
    description: "Create a TrimItem"
    roles: [MaterialsPlanner]
    code: 201
    input: [sku_code, description, origin_country, unit_cost_cents]
    output: TrimItem
    side_effects: ["qty_on_hand=0, qty_reserved=0, qty_available=0"]
  - method: GET
    path: "/trim-items/{id}"
    description: "Get a TrimItem"
    roles: [Any]
    code: 200
    input: []
    output: TrimItem
    side_effects: []
  - method: POST
    path: "/trim-items/{id}/receive"
    description: "Receive trim stock; triggers the TRIM_HOLD sweep (held orders re-evaluated in created_at ASC order, all-or-nothing per order)"
    roles: [MaterialsPlanner]
    code: 200
    input: [qty]
    output: TrimItem
    side_effects:
      - "qty_on_hand += qty; qty_available recomputed; increments TrimItem.version by 1"
      - "sweep: for each ProductionOrder in TRIM_HOLD (created_at ASC): if fully coverable -> apply reservations (qty_reserved += per line), trim_hold_status -> MATERIALS_OK, order.version incremented"
  - method: POST
    path: "/trim-requirements"
    description: "Add a trim BOM line to a DRAFT tech pack"
    roles: [Merchandiser]
    code: 201
    input: [tech_pack_id, trim_item_id, units_per_garment, wastage_pct]
    output: TrimRequirement
    side_effects: []
  - method: GET
    path: "/trim-requirements"
    description: "List TrimRequirements (by pack and/or item)"
    roles: [Any]
    code: 200
    input: ["tech_pack_id?", "trim_item_id?", "limit?", "offset?"]
    output: "TrimRequirement[]"
    side_effects: []
  - method: GET
    path: "/trim-requirements/{id}"
    description: "Get a TrimRequirement"
    roles: [Any]
    code: 200
    input: []
    output: TrimRequirement
    side_effects: []

  # --- Fabric ---
  - method: POST
    path: "/fabric-rolls"
    description: "Create a FabricRoll (RECEIVED)"
    roles: [MaterialsPlanner]
    code: 201
    input: [roll_code, fabric_code, origin_country, cost_cents_per_yard, received_yards]
    output: FabricRoll
    side_effects: ["status=RECEIVED; usable/allocated/consumed/available = 0"]
  - method: GET
    path: "/fabric-rolls/{id}"
    description: "Get a FabricRoll"
    roles: [Any]
    code: 200
    input: []
    output: FabricRoll
    side_effects: []
  - method: POST
    path: "/fabric-rolls/{id}/record-qc"
    description: "Record fabric QC result (PASS -> AVAILABLE, FAIL -> REJECTED)"
    roles: [MaterialsPlanner]
    code: 200
    input: [result]
    output: FabricRoll
    side_effects: ["status transition per FabricRoll machine; increments FabricRoll.version by 1"]

  # --- Production orders ---
  - method: POST
    path: "/production-orders"
    description: "Create a ProductionOrder (PLANNED / MATERIALS_OK / QC_PENDING)"
    roles: [ProductionPlanner]
    code: 201
    input: [style_id, color, size_quantities]
    output: ProductionOrder
    side_effects: ["total_order_qty computed; style DRAFT -> ACTIVE on first order (Style.version incremented)"]
  - method: GET
    path: "/production-orders"
    description: "List ProductionOrders (by style and/or pinned pack)"
    roles: [Any]
    code: 200
    input: ["style_id?", "tech_pack_id?", "limit?", "offset?"]
    output: "ProductionOrder[]"
    side_effects: []
  - method: GET
    path: "/production-orders/{id}"
    description: "Get a ProductionOrder"
    roles: [Any]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: []
  - method: GET
    path: "/production-orders/{id}/wip"
    description: "Computed read: SKU-level (style x color x size) work-in-process per calculations.wip_by_sku"
    roles: [Any]
    code: 200
    input: []
    output: "{ rows: array }"
    side_effects: []
  - method: POST
    path: "/production-orders/{id}/plan"
    description: "Pin an APPROVED tech pack, gross trim requirements, reserve trim or place TRIM_HOLD (all-or-nothing)"
    roles: [ProductionPlanner]
    code: 200
    input: [tech_pack_id]
    output: ProductionOrder
    side_effects:
      - "pins tech_pack_id; computes made_in_usa_eligible; per calculations.trim_grossing: reserve per line (qty_reserved += required) OR trim_hold_status -> TRIM_HOLD with trim_shortages populated"
      - "increments ProductionOrder.version by 1"
  - method: POST
    path: "/production-orders/{id}/start-cutting"
    description: "Move order PLANNED -> CUTTING"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: ["increments ProductionOrder.version by 1"]
  - method: POST
    path: "/production-orders/{id}/finish"
    description: "Move order SEWING -> FINISHED; releases the order's trim reservations"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: ["trim reservations released (TrimItem.qty_reserved decremented per line); increments ProductionOrder.version by 1"]

  # --- Markers ---
  - method: POST
    path: "/markers"
    description: "Create a Marker (DRAFT) for an order from one fabric roll"
    roles: [CuttingManager]
    code: 201
    input: [production_order_id, fabric_roll_id, marker_length_yards, planned_pieces]
    output: Marker
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/markers"
    description: "List Markers (by order and/or roll)"
    roles: [Any]
    code: 200
    input: ["production_order_id?", "fabric_roll_id?", "limit?", "offset?"]
    output: "Marker[]"
    side_effects: []
  - method: GET
    path: "/markers/{id}"
    description: "Get a Marker"
    roles: [Any]
    code: 200
    input: []
    output: Marker
    side_effects: []
  - method: POST
    path: "/markers/{id}/approve"
    description: "Approve a DRAFT marker: reserves fabric on the roll (OCC on FabricRoll.version), computes utilization variants"
    roles: [CuttingManager]
    code: 200
    input: [expected_fabric_roll_version]
    output: Marker
    side_effects:
      - "allocated_yards + utilization_gross_pct/net_pct computed"
      - "FabricRoll.allocated_yards += allocated_yards; FabricRoll.version incremented; increments Marker.version by 1"
  - method: POST
    path: "/markers/{id}/cut"
    description: "Cut an APPROVED marker: converts reservation to consumption, creates one Bundle per size line (TICKETED)"
    roles: [CuttingManager]
    code: 200
    input: [size_quantities]
    output: Marker
    side_effects:
      - "roll: allocated_yards -= marker reservation; consumed_yards += marker reservation; roll.version incremented; roll auto -> DEPLETED when available_yards == 0"
      - "Bundles created (status TICKETED) per size_quantities lines, in given order"
      - "increments Marker.version by 1"
  - method: POST
    path: "/markers/{id}/cancel"
    description: "Cancel a DRAFT or APPROVED marker; compensates any fabric reservation"
    roles: [CuttingManager]
    code: 200
    input: []
    output: Marker
    side_effects: ["if APPROVED: FabricRoll.allocated_yards -= marker.allocated_yards (roll.version incremented); marker.allocated_yards := 0; increments Marker.version by 1"]

  # --- Bundles ---
  - method: GET
    path: "/bundles"
    description: "List Bundles (by marker and/or order)"
    roles: [Any]
    code: 200
    input: ["marker_id?", "production_order_id?", "limit?", "offset?"]
    output: "Bundle[]"
    side_effects: []
  - method: GET
    path: "/bundles/{id}"
    description: "Get a Bundle"
    roles: [Any]
    code: 200
    input: []
    output: Bundle
    side_effects: []
  - method: POST
    path: "/bundles/{id}/release"
    description: "Release a TICKETED bundle to the sewing floor"
    roles: [LineSupervisor]
    code: 200
    input: []
    output: Bundle
    side_effects: ["status TICKETED -> RELEASED; order CUTTING -> SEWING when first bundle released; increments Bundle.version by 1"]

  # --- Sewing lines / assignments / operators ---
  - method: POST
    path: "/sewing-lines"
    description: "Create a SewingLine"
    roles: [ProductionPlanner]
    code: 201
    input: [line_code, station_count, shift_minutes]
    output: SewingLine
    side_effects: []
  - method: GET
    path: "/sewing-lines/{id}/balance"
    description: "Computed read: line balance for the given order's pinned pack per calculations.line_balance"
    roles: [Any]
    code: 200
    input: [production_order_id]
    output: "{ total_sam_seconds: integer, takt_seconds: integer, stations_used: integer, max_station_load_seconds: integer, balance_efficiency_pct: number }"
    side_effects: []
  - method: POST
    path: "/line-assignments"
    description: "Schedule an operator on a line for an operation (temporal overlap rules per §1.4 priorities 8.x)"
    roles: [LineSupervisor]
    code: 201
    input: [sewing_line_id, production_order_id, operation_spec_id, operator_id, shift_date, start_minute, end_minute, assigned_pieces]
    output: LineAssignment
    side_effects: []
  - method: GET
    path: "/line-assignments"
    description: "List LineAssignments (filterable by line/order/operation/operator)"
    roles: [Any]
    code: 200
    input: ["sewing_line_id?", "production_order_id?", "operation_spec_id?", "operator_id?", "limit?", "offset?"]
    output: "LineAssignment[]"
    side_effects: []
  - method: GET
    path: "/line-assignments/{id}"
    description: "Get a LineAssignment"
    roles: [Any]
    code: 200
    input: []
    output: LineAssignment
    side_effects: []
  - method: POST
    path: "/operators"
    description: "Create an Operator"
    roles: [LineSupervisor]
    code: 201
    input: [employee_no, full_name]
    output: Operator
    side_effects: ["status=ACTIVE; efficiency_pct=0; ytd_earnings_cents=0"]
  - method: GET
    path: "/operators/{id}"
    description: "Get an Operator (incl. computed efficiency_pct, ytd_earnings_cents)"
    roles: [Any]
    code: 200
    input: []
    output: Operator
    side_effects: []
  - method: GET
    path: "/operators/{id}/efficiency"
    description: "Computed read: operator efficiency breakdown per calculations.operator_efficiency"
    roles: [Any]
    code: 200
    input: []
    output: "{ efficiency_pct: number, earned_minutes: number, attended_minutes: number }"
    side_effects: []

  # --- Piece work ---
  - method: POST
    path: "/piece-work-entries"
    description: "Log piece work against a released bundle (operator_id taken from X-User-ID)"
    roles: [SewingOperator]
    code: 201
    input: [bundle_id, operation_spec_id, work_date, qty]
    output: PieceWorkEntry
    side_effects:
      - "status=LOGGED; operator_id=X-User-ID; piece_earnings_cents + earned_minutes computed"
      - "first entry on a RELEASED bundle: bundle RELEASED -> IN_PROGRESS"
  - method: GET
    path: "/piece-work-entries"
    description: "List PieceWorkEntries (filterable by bundle/operation/operator/payroll run)"
    roles: [Any]
    code: 200
    input: ["bundle_id?", "operation_spec_id?", "operator_id?", "payroll_run_id?", "limit?", "offset?"]
    output: "PieceWorkEntry[]"
    side_effects: []
  - method: GET
    path: "/piece-work-entries/{id}"
    description: "Get a PieceWorkEntry"
    roles: [Any]
    code: 200
    input: []
    output: PieceWorkEntry
    side_effects: []
  - method: POST
    path: "/piece-work-entries/{id}/review"
    description: "Verify or reject a LOGGED entry"
    roles: [LineSupervisor]
    code: 200
    input: [decision]
    output: PieceWorkEntry
    side_effects:
      - "VERIFY: status -> VERIFIED; bundle.completed_through_seq recomputed; bundle auto -> COMPLETED when all operations fully verified"
      - "REJECT: status -> REJECTED"
      - "increments PieceWorkEntry.version by 1"

  # --- Payroll ---
  - method: POST
    path: "/payroll-runs"
    description: "Create a PayrollRun (OPEN) for a pay period"
    roles: [PayrollClerk]
    code: 201
    input: [period_start, period_end]
    output: PayrollRun
    side_effects: ["status=OPEN; totals 0"]
  - method: GET
    path: "/payroll-runs/{id}"
    description: "Get a PayrollRun"
    roles: [Any]
    code: 200
    input: []
    output: PayrollRun
    side_effects: []
  - method: POST
    path: "/payroll-runs/{id}/calculate"
    description: "Sweep VERIFIED in-period entries; apply guarantee + bonus; stamp payable_cents (OCC on PayrollRun.version)"
    roles: [PayrollClerk]
    code: 200
    input: [expected_payroll_run_version]
    output: PayrollRun
    side_effects: ["per calculations.payroll_run_totals; status OPEN -> CALCULATED; increments PayrollRun.version by 1"]
  - method: POST
    path: "/payroll-runs/{id}/decide"
    description: "Approve or reject a CALCULATED run (SoD vs calculated_by_user_id)"
    roles: [PlantManager]
    code: 200
    input: [decision]
    output: PayrollRun
    side_effects:
      - "APPROVE: status -> APPROVED; approved_by_user_id=X-User-ID"
      - "REJECT: status -> OPEN; swept entries unstamped (payroll_run_id=null, payable_cents=null); totals reset"
      - "increments PayrollRun.version by 1"
  - method: POST
    path: "/payroll-runs/{id}/pay"
    description: "Pay an APPROVED run: swept entries VERIFIED -> PAID; operator metrics recomputed per entry"
    roles: [PayrollClerk]
    code: 200
    input: []
    output: PayrollRun
    side_effects: ["entries -> PAID; per entry: operator.ytd_earnings_cents += payable_cents; operator.efficiency_pct recomputed; increments PayrollRun.version by 1"]

  # --- Quality audits ---
  - method: POST
    path: "/quality-audits"
    description: "Open a QualityAudit for an order (AQL sample plan derived); optional re_audit_of_audit_id chains a re-audit"
    roles: [QualityInspector]
    code: 201
    input: [production_order_id, inspection_level, aql_level, "re_audit_of_audit_id?"]
    output: QualityAudit
    side_effects:
      - "sample plan computed per calculations.aql_sample_plan; status=OPEN"
      - "when re_audit_of_audit_id present: parent audit REWORK_RECORDED -> SUPERSEDED; order REWORK_IN_PROGRESS -> QC_PENDING"
  - method: GET
    path: "/quality-audits"
    description: "List QualityAudits (by order and/or re-audit parent)"
    roles: [Any]
    code: 200
    input: ["production_order_id?", "re_audit_of_audit_id?", "limit?", "offset?"]
    output: "QualityAudit[]"
    side_effects: []
  - method: GET
    path: "/quality-audits/{id}"
    description: "Get a QualityAudit"
    roles: [Any]
    code: 200
    input: []
    output: QualityAudit
    side_effects: []
  - method: POST
    path: "/quality-audits/{id}/record"
    description: "Record defects_found; verdict auto PASS (<= accept_max) / FAIL (>= reject_min); FAIL cascades to order and bundles"
    roles: [QualityInspector]
    code: 200
    input: [defects_found]
    output: QualityAudit
    side_effects:
      - "PASS: order QC_PENDING -> QC_PASSED"
      - "FAIL: order QC_PENDING -> QC_FAILED -> bundles {RELEASED,IN_PROGRESS,COMPLETED} -> REWORK_HOLD -> their LOGGED entries -> REJECTED"
      - "increments QualityAudit.version by 1"
  - method: POST
    path: "/quality-audits/{id}/rework-complete"
    description: "Declare rework done on a CLOSED_FAIL audit; bundles return to RELEASED"
    roles: [QualityInspector]
    code: 200
    input: []
    output: QualityAudit
    side_effects: ["audit CLOSED_FAIL -> REWORK_RECORDED; order QC_FAILED -> REWORK_IN_PROGRESS; bundles REWORK_HOLD -> pre_rework_status; increments QualityAudit.version by 1"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not in the endpoint's roles list" }
  # --- Existence / input ---
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, scalar range violation, or size_quantities referencing sizes outside style.size_run / duplicate sizes" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 400, condition: "LineAssignment: not (0 <= start_minute < end_minute <= 1440)" }
  # --- Concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version" }
  # --- State ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Generic invalid from-state for the requested transition (submit/revise/cancel/record/release-happy-path violations without a more specific code)" }
  - { id: ERR_TECH_PACK_NOT_PENDING_REVIEW, http: 409, condition: "TechPack review attempted when pack is not PENDING_APPROVAL" }
  - { id: ERR_TECH_PACK_NOT_EDITABLE, http: 409, condition: "OperationSpec/TrimRequirement creation attempted against a non-DRAFT pack" }
  - { id: ERR_TECH_PACK_NOT_APPROVED, http: 409, condition: "plan's candidate pack is not APPROVED or belongs to another style" }
  - { id: ERR_MARKER_NOT_DRAFT, http: 409, condition: "Marker approve attempted when marker is not DRAFT" }
  - { id: ERR_MARKER_NOT_APPROVED, http: 409, condition: "Marker cut attempted when marker is not APPROVED" }
  - { id: ERR_ORDER_NOT_PLANNED, http: 409, condition: "start-cutting attempted before plan pinned a tech pack" }
  - { id: ERR_ORDER_NOT_FINISHABLE, http: 409, condition: "finish attempted with non-COMPLETED bundles or quality_status != QC_PASSED" }
  - { id: ERR_NO_APPROVED_MARKER, http: 409, condition: "start-cutting attempted with no APPROVED marker" }
  - { id: ERR_NO_OPERATION_SPECS, http: 409, condition: "submit attempted on a pack with zero OperationSpecs" }
  - { id: ERR_TRIM_HOLD_ACTIVE, http: 409, condition: "start-cutting or bundle release attempted while order.trim_hold_status == TRIM_HOLD" }
  - { id: ERR_BUNDLE_NOT_RELEASABLE, http: 409, condition: "Bundle release attempted when bundle is not TICKETED" }
  - { id: ERR_BUNDLE_NOT_LOGGABLE, http: 409, condition: "PieceWorkEntry attempted against a bundle not in {RELEASED, IN_PROGRESS}" }
  - { id: ERR_OPERATION_SEQUENCE_VIOLATION, http: 409, condition: "Logging operation N before operation N-1 is fully logged on the same bundle" }
  - { id: ERR_PAYROLL_NOT_OPEN, http: 409, condition: "calculate attempted when run is not OPEN" }
  - { id: ERR_PAYROLL_NOT_CALCULATED, http: 409, condition: "decide attempted when run is not CALCULATED" }
  - { id: ERR_PAYROLL_NOT_APPROVED, http: 409, condition: "pay attempted when run is not APPROVED" }
  - { id: ERR_AUDIT_NOT_FAILED, http: 409, condition: "rework-complete attempted on an audit not in CLOSED_FAIL" }
  - { id: ERR_REAUDIT_PARENT_NOT_REWORKED, http: 409, condition: "re_audit_of_audit_id references an audit not in REWORK_RECORDED" }
  - { id: ERR_NO_COMPLETED_BUNDLES, http: 409, condition: "QualityAudit creation attempted with no COMPLETED bundle on the order" }
  - { id: ERR_LINE_STATION_CAPACITY_EXCEEDED, http: 409, condition: "Overlapping assignments on one (line, shift_date) would exceed station_count (aggregate-capacity interval semantics; adjacency allowed)" }
  - { id: ERR_OPERATOR_SCHEDULE_OVERLAP, http: 409, condition: "Same (operator, shift_date) assignments closer than the 15-minute changeover buffer (buffered-exclusion interval semantics; adjacency rejected)" }
  - { id: ERR_DUPLICATE_OPERATION_SEQUENCE, http: 409, condition: "sequence_no reused within one tech pack" }
  # --- Safety / compliance ---
  - { id: ERR_CONTENT_CLAIM_VIOLATION, http: 403, condition: "plan under MADE_IN_USA target with declared_fabric_domestic == false or a non-US trim in the candidate pack's BOM" }
  - { id: ERR_NOT_CERTIFIABLE, http: 409, condition: "certify-content-claim attempted while content_qualification != QUALIFIED_STRICT" }
  - { id: ERR_SOD_SELF_REVIEW, http: 403, condition: "TechPack reviewer X-User-ID equals pack.created_by_user_id" }
  - { id: ERR_SOD_PAYROLL_SELF_APPROVE, http: 403, condition: "PayrollRun decider X-User-ID equals run.calculated_by_user_id" }
  - { id: ERR_SOD_REAUDIT_SELF_RECHECK, http: 403, condition: "Re-audit recorder equals the referenced failed audit's recorded_by_user_id" }
  # --- Referential / capacity / fiscal ---
  - { id: ERR_REAUDIT_ORDER_MISMATCH, http: 422, condition: "re_audit_of_audit_id references an audit of a different production order" }
  - { id: ERR_OPERATION_NOT_IN_TECH_PACK, http: 422, condition: "PieceWorkEntry's operation_spec does not belong to the order's pinned tech pack" }
  - { id: ERR_NO_LINE_ASSIGNMENT, http: 422, condition: "No LineAssignment matches (operator = X-User-ID, operation_spec, order, shift_date == work_date)" }
  - { id: ERR_QTY_EXCEEDS_REMAINING, http: 422, condition: "PieceWorkEntry qty exceeds remaining loggable qty for that operation on that bundle" }
  - { id: ERR_CUT_EXCEEDS_UNCUT, http: 422, condition: "Cut distribution exceeds the order's remaining uncut qty for a size" }
  - { id: ERR_ROLL_NOT_AVAILABLE, http: 409, condition: "Marker approve references a roll not in AVAILABLE status" }
  - { id: ERR_INSUFFICIENT_FABRIC, http: 409, condition: "Marker approve: roll.available_yards < computed allocated_yards" }

# =============================================================================
# Table 7: RBAC Matrix (§1.7)
# =============================================================================
roles:
  - name: Merchandiser
    description: "Owns styles, tech packs, operation specs, and trim BOM lines"
    identity: opaque
    exclusive_operations:
      - "POST /styles"
      - "POST /tech-packs"
      - "POST /tech-packs/{id}/submit"
      - "POST /tech-packs/{id}/revise"
      - "POST /operation-specs"
      - "POST /trim-requirements"
    shared_operations: ["GET endpoints (via Any)"]
  - name: MaterialsPlanner
    description: "Owns trim items, trim receipts, fabric rolls and fabric QC"
    identity: opaque
    exclusive_operations:
      - "POST /trim-items"
      - "POST /trim-items/{id}/receive"
      - "POST /fabric-rolls"
      - "POST /fabric-rolls/{id}/record-qc"
    shared_operations: ["GET endpoints (via Any)"]
  - name: CuttingManager
    description: "Owns markers: creation, approval (fabric reservation), cutting, cancellation"
    identity: opaque
    exclusive_operations:
      - "POST /markers"
      - "POST /markers/{id}/approve"
      - "POST /markers/{id}/cut"
      - "POST /markers/{id}/cancel"
    shared_operations: ["GET endpoints (via Any)"]
  - name: ProductionPlanner
    description: "Owns production orders and sewing lines; plans, starts, finishes orders"
    identity: opaque
    exclusive_operations:
      - "POST /production-orders"
      - "POST /production-orders/{id}/plan"
      - "POST /production-orders/{id}/start-cutting"
      - "POST /production-orders/{id}/finish"
      - "POST /sewing-lines"
    shared_operations: ["GET endpoints (via Any)"]
  - name: LineSupervisor
    description: "Owns operators, line assignments, bundle release, piece-work review"
    identity: opaque
    exclusive_operations:
      - "POST /operators"
      - "POST /line-assignments"
      - "POST /bundles/{id}/release"
      - "POST /piece-work-entries/{id}/review"
    shared_operations: ["GET endpoints (via Any)"]
  - name: SewingOperator
    description: "Logs own piece work; X-User-ID must equal an Operator.id (entity-backed)"
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /piece-work-entries"
    shared_operations: ["GET endpoints (via Any)"]
  - name: QualityInspector
    description: "Owns quality audits: creation, result recording, rework completion"
    identity: opaque
    exclusive_operations:
      - "POST /quality-audits"
      - "POST /quality-audits/{id}/record"
      - "POST /quality-audits/{id}/rework-complete"
    shared_operations: ["GET endpoints (via Any)"]
  - name: PayrollClerk
    description: "Owns payroll runs: creation, calculation, payment; cannot approve (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /payroll-runs"
      - "POST /payroll-runs/{id}/calculate"
      - "POST /payroll-runs/{id}/pay"
    shared_operations: ["GET endpoints (via Any)"]
  - name: PlantManager
    description: "Reviews tech packs, decides payroll, certifies content claims; cannot perform the steps it checks (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /tech-packs/{id}/review"
      - "POST /payroll-runs/{id}/decide"
      - "POST /styles/{id}/certify-content-claim"
    shared_operations: ["GET endpoints (via Any)"]
  - name: Any
    description: "Pseudo-role: any authenticated caller may use GET endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["All GET endpoints"]
