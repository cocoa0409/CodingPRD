            - call: "POST /lessors/${lessor_id}/leases/${lease1_id}/eot-elections/${l1_eot_id}/exercise"
              payload: {}
              as: Servicer
            - call: "POST /lessors/${lessor_id}/_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: FundingOfficer
            - call: "POST /lessors/${lessor_id}/equipment/${unit1_id}/return"
