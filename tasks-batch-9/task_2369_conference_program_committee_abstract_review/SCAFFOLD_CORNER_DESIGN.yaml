              as_user_id: "${mb_r1_id}"
              captures: { new_ws: "$.data.weighted_score" }
          assert:
            - "PATCH → HTTP 200 with calibration_bias -0.50 and expertise_keywords [oncology, immunotherapy]"
            - "CommitteeMember.${mb_r1_id}.max_review_load == 4 (omitted from the PATCH body, left alone)"
            - "CommitteeMember.${mb_r1_id}.version == ${v_before} + 1"
            - "Review.${rv1_id}.weighted_score is still 4.00 (no retroactive rescore)"
            - "Review.${rv2_id}.weighted_score == 3.50 (the new bias applies to the later submission)"
            - "Abstract.${ab1_id}.provisional_score == 4.00 (unchanged by the PATCH)"

