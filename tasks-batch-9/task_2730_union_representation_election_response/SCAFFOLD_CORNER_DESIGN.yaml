      - name: campaign_risk_score_saturates_at_one_hundred
        claim_type: Precision
        grounds:
          - calculations.campaign_risk_score
          - entities.CampaignCommunication.fields.risk_score
          - endpoints.POST_campaign_communications_id_accuracy_review
        distinguishing_aspect: |
          The raw sum for a UNIT_WIDE captive-audience meeting with 3 threats, interrogation, a promise,
          a surveillance reference and 4 unsupported claims is 30 + 45 + 12 + 10 + 8 + 18 + 5 = 128, and the
          stored risk_score must be the min(100, raw) cap of exactly 100 - the unsupported-claim term counts
          max(0, 4 - 1) = 3 excess claims, not 4.
