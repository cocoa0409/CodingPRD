            - "after the void it reads obligated_cents 0 (${fin_obligated}) and expended_cents 0 (${fin_expended}), so expended + obligated equals the pre-document value exactly"
            - "the grant is back to burn_ratio 0.000000 (${fin_burn}) and status OPEN (${fin_status})"
            - "the CostAllocation line is REVERSED (${line_status}) with allocated_amount_cents 0 (${line_allocated}) and admin_amount_cents 0 (${line_admin})"
            - "the delivery itself returns to DRAFT with allocated_total_cents 0 and admin_total_cents 0"
