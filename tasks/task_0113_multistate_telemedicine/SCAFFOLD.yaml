scenario: |
  113. Multi-State Telemedicine Platform: physician multi-state licensure registry,
  patient state determination, compliance routing, electronic prescription DEA compliance,
  insurance/self-pay routing, Interstate Compact, follow-up.

domain_name: multistate-telemedicine
api_prefix: /telemed

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: access_control_matrix
  complexity_layers:
    - dual_variant_calculation        # insurance vs self-pay charge for the same consult
    - cascading_side_effects          # consult complete -> rx issuance -> follow-up scheduling -> billing
    - rate_threshold_triggers         # DEA schedule-based prescription expiration windows
    - conditional_feature_flags       # compact-license fast-path vs single-state license verification
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Physician
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Physician's full legal name."
      - name: npi_number
        type: string
        source: input
        description: "National Provider Identifier (10 digits)."
        constraints: "regex ^[0-9]{10}$; unique across physicians"
      - name: imlc_compact_member
        type: boolean
        source: input
        description: "Whether this physician holds an Interstate Medical Licensure Compact (IMLC) Letter of Qualification, enabling expedited licensure in member states."
        default: false
      - name: imlc_home_state
        type: string
        source: input
        description: "Two-letter US state code of the IMLC State-of-Principal-License when imlc_compact_member is true; null otherwise."
        constraints: "regex ^[A-Z]{2}$ when present"
        default: null
      - name: dea_number
        type: string
        source: input
        description: "DEA registration number authorizing controlled-substance prescribing."
        constraints: "regex ^[A-Z]{2}[0-9]{7}$; unique when present"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Operational status."
        constraints: "values: ACTIVE | SUSPENDED"
        default: ACTIVE

  - name: StateLicense
    parent: Physician
    common_fields: true
    fields:
      - name: physician_id
        type: string
        source: input
        description: "Owning Physician id."
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state code where the license is granted."
        constraints: "regex ^[A-Z]{2}$; multiple licenses may exist for the same (physician_id, state_code) only if their [issued_at, expires_at) intervals do not overlap (half-open semantics — see ERR_LICENSE_PERIOD_OVERLAP)"
      - name: license_number
        type: string
        source: input
        description: "License number issued by the state medical board."
      - name: license_type
        type: enum
        source: input
        description: "Origin of the license."
        constraints: "values: FULL | IMLC_EXPEDITED"
      - name: issued_at
        type: datetime
        source: input
        description: "Date the license was issued (ISO 8601 UTC)."
      - name: expires_at
        type: datetime
        source: input
        description: "Date the license expires (ISO 8601 UTC). MUST be strictly greater than issued_at."
      - name: status
        type: enum
        source: computed
        description: "License status, recomputed against the clock at every read and at every state-machine read."
        constraints: "values: ACTIVE | EXPIRED | REVOKED"
        default: ACTIVE

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Patient's full legal name."
      - name: date_of_birth
        type: datetime
        source: input
        description: "Date of birth (ISO 8601 UTC)."
      - name: home_state_code
        type: string
        source: input
        description: "Registered residence state, two-letter US code."
        constraints: "regex ^[A-Z]{2}$"
      - name: present_state_code
        type: string
        source: input
        description: "Two-letter US state code declared as the patient's physical location for the active consult; defaults to home_state_code if absent at consult creation."
        constraints: "regex ^[A-Z]{2}$"
      - name: insurance_payer_id
        type: string
        source: input
        description: "Optional insurance payer identifier; absent means self-pay only."
        default: null
      - name: insurance_member_id
        type: string
        source: input
        description: "Insurance member identifier; required if insurance_payer_id is present."
        default: null
      - name: insurance_deductible_remaining_cents
        type: integer
        source: input
        description: "Remaining annual deductible amount, in cents. Used by InsuranceClaim allocation."
        default: 0
      - name: insurance_copay_cents
        type: integer
        source: input
        description: "Flat copay per visit, in cents."
        default: 0
      - name: insurance_coinsurance_bps
        type: integer
        source: input
        description: "Coinsurance percentage in basis points (e.g., 2000 = 20%)."
        constraints: "0 <= value <= 10000"
        default: 0

  - name: Consult
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "Patient receiving the consult."
      - name: physician_id
        type: string
        source: computed
        description: "Physician routed to this consult after compliance routing succeeds; null while REQUESTED."
        default: null
      - name: present_state_code
        type: string
        source: input
        description: "State the patient declared as physical location at consult creation; snapshot — does not change with later Patient updates."
      - name: billing_mode
        type: enum
        source: input
        description: "Payment routing chosen at creation."
        constraints: "values: INSURANCE | SELF_PAY"
      - name: visit_tier
        type: enum
        source: input
        description: "Service intensity tier driving the base price."
        constraints: "values: BRIEF | STANDARD | EXTENDED"
      - name: routing_basis
        type: enum
        source: computed
        description: "Which licensure path was used to satisfy compliance; written when ROUTED is entered."
        constraints: "values: FULL_LICENSE | IMLC_EXPEDITED | null"
        default: null
      - name: requires_followup
        type: boolean
        source: input
        description: "Clinician-asserted intent that a follow-up should be scheduled when the consult completes."
        default: false
      - name: base_charge_cents
        type: integer
        source: computed
        description: "Tier-based base charge in cents at COMPLETE time."
        default: null
      - name: final_charge_cents
        type: integer
        source: computed
        description: "Final patient-side charge in cents, computed at COMPLETE per consult_charge_calculation (insurance vs self-pay variant)."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Consult lifecycle status."
        constraints: "values: REQUESTED | ROUTED | IN_PROGRESS | COMPLETED | CLOSED | DECLINED"
        default: REQUESTED

  - name: Prescription
    parent: Consult
    common_fields: true
    fields:
      - name: consult_id
        type: string
        source: input
        description: "Owning Consult id; prescriptions live under exactly one consult."
      - name: prescribing_physician_id
        type: string
        source: input
        description: "Physician issuing the prescription; MUST equal Consult.physician_id."
      - name: drug_name
        type: string
        source: input
        description: "Name of drug being prescribed."
      - name: dea_schedule
        type: enum
        source: input
        description: "DEA controlled-substance schedule; NONE for non-controlled drugs."
        constraints: "values: NONE | II | III | IV | V"
      - name: days_supply
        type: integer
        source: input
        description: "Days-supply requested."
        constraints: "1 <= value <= 90"
      - name: refills
        type: integer
        source: input
        description: "Number of refills authorized."
        constraints: "0 <= value <= 11"
        default: 0
      - name: epcs_two_factor_token
        type: string
        source: input
        description: "EPCS two-factor authentication token presented when issuing controlled substances (dea_schedule != NONE)."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Prescription lifecycle status."
        constraints: "values: DRAFT | ISSUED | TRANSMITTED | DISPENSED | VOIDED"
        default: DRAFT
      - name: void_reason
        type: string
        source: input
        description: "Reason captured at void time."
        default: null

  - name: InsuranceClaim
    parent: Consult
    common_fields: true
    fields:
      - name: consult_id
        type: string
        source: system
        description: "Owning Consult id; exactly one InsuranceClaim per Consult when billing_mode=INSURANCE."
        constraints: "(consult_id) unique"
      - name: billed_cents
        type: integer
        source: computed
        description: "Amount billed to the payer (equals Consult.base_charge_cents at submission)."
      - name: deductible_applied_cents
        type: integer
        source: computed
        description: "Portion of billed amount applied against the patient's remaining deductible (waterfall step 1)."
      - name: copay_applied_cents
        type: integer
        source: computed
        description: "Flat copay charged to the patient (waterfall step 2)."
      - name: coinsurance_applied_cents
        type: integer
        source: computed
        description: "Coinsurance portion charged to the patient (waterfall step 3)."
      - name: payer_paid_cents
        type: integer
        source: computed
        description: "Amount paid by the payer when status=PAID; zero while pending."
        default: 0
      - name: patient_responsibility_cents
        type: integer
        source: computed
        description: "Sum of deductible_applied + copay_applied + coinsurance_applied."
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle status."
        constraints: "values: SUBMITTED | APPROVED | DENIED | APPEALED | PAID"
        default: SUBMITTED
      - name: denial_reason
        type: string
        source: input
        description: "Captured at DENIED."
        default: null

  - name: SelfPayInvoice
    parent: Consult
    common_fields: true
    fields:
      - name: consult_id
        type: string
        source: system
        description: "Owning Consult id; exactly one SelfPayInvoice per Consult when billing_mode=SELF_PAY."
        constraints: "(consult_id) unique"
      - name: subtotal_cents
        type: integer
        source: computed
        description: "Pre-discount subtotal (equals Consult.base_charge_cents)."
      - name: discount_cents
        type: integer
        source: computed
        description: "Self-pay courtesy discount per consult_charge_calculation self-pay variant."
      - name: amount_due_cents
        type: integer
        source: computed
        description: "subtotal_cents - discount_cents."
      - name: status
        type: enum
        source: computed
        description: "Invoice status."
        constraints: "values: ISSUED | PAID | VOIDED"
        default: ISSUED

  - name: FollowUp
    parent: Consult
    common_fields: true
    fields:
      - name: consult_id
        type: string
        source: system
        description: "Owning Consult id."
      - name: due_by
        type: datetime
        source: computed
        description: "Hard due date computed by followup_due_date calculation at scheduling time."
      - name: status
        type: enum
        source: computed
        description: "FollowUp status."
        constraints: "values: SCHEDULED | COMPLETED | MISSED | CANCELLED"
        default: SCHEDULED

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - name: event_type
        type: enum
        source: system
        description: "Append-only audit category."
        constraints: "values: CONSULT_ROUTED | RX_ISSUED | RX_VOIDED | CLAIM_PAID | LICENSE_REVOKED | COMPLIANCE_FAILURE | CLOCK_ADVANCED"
      - name: subject_entity
        type: string
        source: system
        description: "Entity name the event concerns."
      - name: subject_id
        type: string
        source: system
        description: "Entity id the event concerns."
      - name: actor_role
        type: string
        source: system
        description: "Role that triggered the event; 'system' for automatic transitions."
      - name: payload_json
        type: object
        source: system
        description: "Free-form JSON snapshot captured at event time."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Consult
    initial_state: REQUESTED
    terminal_states: [CLOSED, DECLINED]
    transitions:
      - from: REQUESTED
        to: ROUTED
        trigger: "POST /telemed/consults/{id}/route"
        actor: ComplianceOfficer
        preconditions:
          - "Consult.status == REQUESTED"
          - "request body supplies physician_id"
          - "Physician(physician_id).status == ACTIVE"
          - "Physician(physician_id).status == ACTIVE AND a matching StateLicense exists where state_code == Consult.present_state_code AND status == ACTIVE AND license_type IN {FULL, IMLC_EXPEDITED}; routing_basis is set to that license's license_type"
        side_effects:
          - "Consult.physician_id set to provided physician_id"
          - "Consult.routing_basis set to the matched StateLicense.license_type"
          - "AuditEvent(event_type=CONSULT_ROUTED) appended"
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /telemed/consults/{id}/decline"
        actor: ComplianceOfficer
        preconditions:
          - "Consult.status == REQUESTED"
        side_effects:
          - "Consult.physician_id remains null"
      - from: ROUTED
        to: REQUESTED
        trigger: "POST /telemed/consults/{id}/unroute"
        actor: ComplianceOfficer
        preconditions:
          - "Consult.status == ROUTED"
          - "no Prescription exists under this consult (Prescription.consult_id == Consult.id implies none)"
        side_effects:
          - "Consult.physician_id cleared to null"
          - "Consult.routing_basis cleared to null"
        note: "Revert path allows reassigning to another physician before treatment begins."
      - from: ROUTED
        to: REQUESTED
        trigger: "system: cascade from POST /telemed/physicians/{pid}/licenses/{lid}/revoke when this Consult.physician_id and present_state_code match the revoked license"
        actor: system
        preconditions:
          - "Consult.status == ROUTED"
          - "the revoked StateLicense.state_code == Consult.present_state_code"
          - "the revoked StateLicense.physician_id == Consult.physician_id"
        side_effects:
          - "Consult.physician_id cleared to null"
          - "Consult.routing_basis cleared to null"
          - "Cascades to: every Prescription in status=DRAFT under this Consult is auto-voided (see Prescription state machine system transition DRAFT→VOIDED)"
        note: "Depth-3 cascade chain: license revoke (link 1) -> Consult unrouted (link 2) -> DRAFT Prescriptions voided (link 3)."
      - from: IN_PROGRESS
        to: REQUESTED
        trigger: "system: cascade from POST /telemed/physicians/{pid}/licenses/{lid}/revoke when this Consult.physician_id and present_state_code match the revoked license"
        actor: system
        preconditions:
          - "Consult.status == IN_PROGRESS"
          - "the revoked StateLicense.state_code == Consult.present_state_code"
          - "the revoked StateLicense.physician_id == Consult.physician_id"
        side_effects:
          - "Consult.physician_id cleared to null"
          - "Consult.routing_basis cleared to null"
          - "Cascades to: every Prescription in status=DRAFT under this Consult is auto-voided"
      - from: ROUTED
        to: IN_PROGRESS
        trigger: "POST /telemed/consults/{id}/start"
        actor: Physician
        preconditions:
          - "Consult.status == ROUTED"
          - "acting Physician.id == Consult.physician_id"
          - "matched StateLicense still ACTIVE at start time (re-check)"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /telemed/consults/{id}/complete"
        actor: Physician
        preconditions:
          - "Consult.status == IN_PROGRESS"
          - "acting Physician.id == Consult.physician_id"
          - "all Prescription rows under this Consult are in {ISSUED, TRANSMITTED, DISPENSED, VOIDED} (no DRAFT remaining)"
        side_effects:
          - "Consult.base_charge_cents computed from visit_tier (BRIEF=5000, STANDARD=10000, EXTENDED=18000)"
          - "Consult.final_charge_cents computed per consult_charge_calculation"
          - "If Consult.billing_mode == INSURANCE: InsuranceClaim row created via cascade (sets billed/deductible/copay/coinsurance/patient_responsibility, status=SUBMITTED)"
          - "If Consult.billing_mode == SELF_PAY: SelfPayInvoice row created via cascade (subtotal/discount/amount_due, status=ISSUED)"
          - "If Consult.requires_followup == true: FollowUp row created with due_by computed per followup_due_date"
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /telemed/consults/{id}/close"
        actor: ComplianceOfficer
        preconditions:
          - "Consult.status == COMPLETED"
          - "billing terminal: (InsuranceClaim.status == PAID OR DENIED) when billing_mode=INSURANCE, else (SelfPayInvoice.status IN {PAID, VOIDED}) when billing_mode=SELF_PAY"
          - "FollowUp.status IN {COMPLETED, MISSED, CANCELLED} when a FollowUp exists; if none exists this clause is vacuous"

  - entity: Prescription
    initial_state: DRAFT
    terminal_states: [DISPENSED, VOIDED]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "PATCH /telemed/prescriptions/{id}"
        actor: Physician
        preconditions:
          - "Prescription.status == DRAFT"
          - "acting Physician.id == Prescription.prescribing_physician_id"
        side_effects:
          - "fields drug_name, dea_schedule, days_supply, refills, epcs_two_factor_token updated; Prescription.version increments"
        note: "Self-loop edit before issuance; allows correcting controlled-substance fields without recreating the prescription."
      - from: DRAFT
        to: ISSUED
        trigger: "POST /telemed/prescriptions/{id}/issue"
        actor: Physician
        preconditions:
          - "Prescription.status == DRAFT"
          - "Consult.status == IN_PROGRESS (cross-entity)"
          - "acting Physician.id == Prescription.prescribing_physician_id"
          - "if dea_schedule != NONE: Physician.dea_number is present AND epcs_two_factor_token is present"
          - "if dea_schedule == II: refills == 0 (DEA Schedule II hard rule)"
          - "matched StateLicense for Consult.present_state_code is ACTIVE"
      - from: ISSUED
        to: TRANSMITTED
        trigger: "POST /telemed/prescriptions/{id}/transmit"
        actor: Physician
        preconditions:
          - "Prescription.status == ISSUED"
          - "acting Physician.id == Prescription.prescribing_physician_id"
      - from: TRANSMITTED
        to: DISPENSED
        trigger: "POST /telemed/prescriptions/{id}/mark-dispensed"
        actor: ComplianceOfficer
        preconditions:
          - "Prescription.status == TRANSMITTED"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /telemed/prescriptions/{id}/void"
        actor: Physician
        preconditions:
          - "Prescription.status IN {DRAFT, ISSUED, TRANSMITTED}"
          - "void_reason supplied"
        side_effects:
          - "Prescription.void_reason set; AuditEvent(event_type=RX_VOIDED) appended"
      - from: DRAFT
        to: VOIDED
        trigger: "system: cascade from license revoke (third link of the depth-3 cascade); originally driven by POST /telemed/physicians/{pid}/licenses/{lid}/revoke"
        actor: system
        preconditions:
          - "Prescription.status == DRAFT"
          - "owning Consult was just unrouted by the license-revoke cascade in this same request"
        side_effects:
          - "Prescription.void_reason := 'LICENSE_REVOKED'; AuditEvent(RX_VOIDED) appended"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /telemed/prescriptions/{id}/void"
        actor: Physician
        preconditions:
          - "Prescription.status IN {DRAFT, ISSUED, TRANSMITTED}"
          - "void_reason supplied"
        side_effects:
          - "Prescription.void_reason set; AuditEvent(event_type=RX_VOIDED) appended"
      - from: TRANSMITTED
        to: VOIDED
        trigger: "POST /telemed/prescriptions/{id}/void"
        actor: Physician
        preconditions:
          - "Prescription.status IN {DRAFT, ISSUED, TRANSMITTED}"
          - "void_reason supplied"
        side_effects:
          - "Prescription.void_reason set; AuditEvent(event_type=RX_VOIDED) appended"

  - entity: InsuranceClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /telemed/claims/{id}/approve"
        actor: Payer
        preconditions:
          - "InsuranceClaim.status == SUBMITTED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /telemed/claims/{id}/deny"
        actor: Payer
        preconditions:
          - "InsuranceClaim.status == SUBMITTED"
          - "denial_reason supplied"
        side_effects:
          - "InsuranceClaim.denial_reason set"
      - from: DENIED
        to: APPEALED
        trigger: "POST /telemed/claims/{id}/appeal"
        actor: ComplianceOfficer
        preconditions:
          - "InsuranceClaim.status == DENIED"
        note: "Revert/cycle path: denied claims can be appealed."
      - from: APPEALED
        to: APPROVED
        trigger: "POST /telemed/claims/{id}/approve"
        actor: Payer
        preconditions:
          - "InsuranceClaim.status == APPEALED"
      - from: APPROVED
        to: PAID
        trigger: "POST /telemed/claims/{id}/mark-paid"
        actor: Payer
        preconditions:
          - "InsuranceClaim.status == APPROVED"
        side_effects:
          - "InsuranceClaim.payer_paid_cents := billed_cents - patient_responsibility_cents"
          - "Patient.insurance_deductible_remaining_cents decremented by InsuranceClaim.deductible_applied_cents (floor 0); recompute leaves the conservation identity Patient.insurance_deductible_remaining_cents (pre) - Patient.insurance_deductible_remaining_cents (post) == InsuranceClaim.deductible_applied_cents"
          - "AuditEvent(event_type=CLAIM_PAID) appended"

  - entity: FollowUp
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, MISSED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /telemed/followups/{id}/complete"
        actor: Physician
        preconditions:
          - "FollowUp.status == SCHEDULED"
          - "current clock time <= FollowUp.due_by"
      - from: SCHEDULED
        to: MISSED
        trigger: "system: nightly sweep — invoked via POST /telemed/_sweep/run"
        actor: system
        preconditions:
          - "FollowUp.status == SCHEDULED"
          - "current clock time > FollowUp.due_by"
        note: "Driven by the test-driving sweep endpoint so the MISSED state is reachable."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /telemed/followups/{id}/cancel"
        actor: ComplianceOfficer
        preconditions:
          - "FollowUp.status == SCHEDULED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two route attempts arrive for the same Consult"
    guarantee: "Exactly one route succeeds; the second sees Consult already ROUTED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Consult.status REQUESTED→ROUTED"

  - scenario: "Two clients attempt to issue the same DRAFT prescription concurrently"
    guarantee: "Exactly one issue advances the prescription to ISSUED; the loser sees the prescription already advanced."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Prescription.status DRAFT→ISSUED"

  - scenario: "Two creators try to create an InsuranceClaim for the same completed Consult"
    guarantee: "At most one InsuranceClaim per Consult is permitted by the (consult_id) uniqueness constraint."
    error_id: ERR_CLAIM_ALREADY_EXISTS
    http_status: 409
    serialization: "Unique (consult_id) on InsuranceClaim"

  - scenario: "Stale PATCH to Prescription DRAFT collides with a concurrent edit"
    guarantee: "Caller must send the current version; mismatched version is rejected."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "OCC on Prescription.version"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: consult_charge_calculation
    trigger: "Consult IN_PROGRESS → COMPLETED transition"
    algorithm: tiered_pricing
    formula: |
      # base_charge_cents from visit_tier:
      base = { BRIEF: 5000, STANDARD: 10000, EXTENDED: 18000 }[Consult.visit_tier]
      Consult.base_charge_cents = base
      # final_charge_cents diverges by billing_mode (dual-variant on the same input):
      if Consult.billing_mode == SELF_PAY:
          # SELF_PAY variant: courtesy 15% discount, rounded HALF_UP to nearest cent
          discount = round(base * 0.15, half_up)        # cents
          Consult.final_charge_cents = base - discount
      else:  # INSURANCE
          # INSURANCE variant: patient responsibility computed by waterfall:
          # 1) deductible_applied = min(base, Patient.insurance_deductible_remaining_cents)
          remaining_after_deductible = base - deductible_applied
          # 2) copay_applied = min(remaining_after_deductible, Patient.insurance_copay_cents)
          remaining_after_copay = remaining_after_deductible - copay_applied
          # 3) coinsurance_applied = round_half_up(remaining_after_copay * coinsurance_bps / 10000)
          coinsurance_applied = round(remaining_after_copay * Patient.insurance_coinsurance_bps / 10000, half_up)
          Consult.final_charge_cents = deductible_applied + copay_applied + coinsurance_applied
    input_set: |
      Consult.visit_tier (BRIEF|STANDARD|EXTENDED), Consult.billing_mode,
      Patient.insurance_deductible_remaining_cents, Patient.insurance_copay_cents,
      Patient.insurance_coinsurance_bps. Insurance fields read at COMPLETION time;
      a later Patient mutation does not retroactively change the Consult.
    constants:
      BRIEF_CENTS: 5000
      STANDARD_CENTS: 10000
      EXTENDED_CENTS: 18000
      SELF_PAY_DISCOUNT_BPS: 1500
    precision: "Cents (integers); intermediate ratios computed in floating point and rounded HALF_UP to nearest cent after each waterfall step, in the order shown."
    variants:
      - name: self_pay
        when: "Consult.billing_mode == SELF_PAY"
        difference: "Patient owes (base - 15% discount); no InsuranceClaim is created. For STANDARD tier (base=10000) the self-pay result is 8500 cents."
      - name: insurance
        when: "Consult.billing_mode == INSURANCE"
        difference: "Patient owes the waterfall sum (deductible + copay + coinsurance); payer covers the rest. For STANDARD tier (base=10000) with deductible_remaining=2000, copay=2000, coinsurance_bps=2000 the result is 2000 + 2000 + round_half_up(6000*0.20) = 2000 + 2000 + 1200 = 5200 cents."

  - name: followup_due_date
    trigger: "FollowUp creation during Consult IN_PROGRESS → COMPLETED side_effects (when Consult.requires_followup == true)"
    algorithm: threshold
    formula: |
      now = clock.now()
      max_schedule = max(p.dea_schedule for p in Prescriptions under this Consult
                        where p.status IN {ISSUED, TRANSMITTED, DISPENSED})
      # dea_schedule precedence: II > III > IV > V > NONE
      if max_schedule == II:
          window_days = 30
      elif max_schedule in (III, IV, V):
          window_days = 60
      else:  # NONE or no qualifying prescriptions
          window_days = 90
      FollowUp.due_by = now + timedelta(days=window_days)
    input_set: |
      Prescriptions under this Consult whose status IN {ISSUED, TRANSMITTED, DISPENSED}.
      VOIDED and DRAFT prescriptions are excluded from the max computation.
    constants:
      SCHEDULE_II_WINDOW_DAYS: 30
      SCHEDULE_III_TO_V_WINDOW_DAYS: 60
      NON_CONTROLLED_WINDOW_DAYS: 90
    precision: "Day-resolution; due_by is set to (now + days) at second precision."
    variants:
      - name: schedule_ii_present
        when: "any non-VOIDED Prescription has dea_schedule == II"
        difference: "due_by = now + 30 days (tightest window)."
      - name: lower_schedule_present
        when: "no Schedule II Rx, but at least one non-VOIDED Rx has dea_schedule IN {III, IV, V}"
        difference: "due_by = now + 60 days."
      - name: non_controlled_only
        when: "no non-VOIDED controlled-substance Rx (only NONE or no qualifying Rx)"
        difference: "due_by = now + 90 days."

  - name: prescription_compliance_score
    trigger: "Server-computed during Prescription DRAFT→ISSUED precondition check; aggregated for monitoring via GET /telemed/physicians/{id}/compliance"
    algorithm: weighted_scoring
    formula: |
      # Multi-input non-linear score combining licensure, DEA, and refill validity.
      # Inputs: dea_schedule, days_supply, refills, has_dea_number, has_epcs_token,
      # matched_license_type (FULL|IMLC_EXPEDITED), patient_present_state_code,
      # consult.routing_basis.
      score = 0
      # (a) Licensure leg
      if matched_license_type == FULL:        score += 40
      elif matched_license_type == IMLC_EXPEDITED: score += 30
      else:                                    score += 0
      # (b) DEA leg
      if dea_schedule == NONE:                 score += 30
      elif dea_schedule != NONE and has_dea_number and has_epcs_token: score += 30
      else:                                    score += 0
      # (c) Refill compliance leg (non-linear by schedule)
      if dea_schedule == II and refills == 0:  score += 20
      elif dea_schedule == II and refills > 0: score += 0          # disqualifying
      elif dea_schedule IN {III, IV} and refills <= 5: score += 20
      elif dea_schedule IN {III, IV} and refills > 5:  score += 10
      elif dea_schedule == V or dea_schedule == NONE:  score += 20
      # (d) Days supply leg
      if days_supply <= 30:                    score += 10
      elif days_supply <= 60:                  score += 5
      else:                                    score += 0
      # Total is in [0, 100]; ISSUANCE requires score >= 80.
    input_set: |
      Single Prescription evaluated against its Consult.routing_basis and Physician fields.
      Aggregated endpoint GET /telemed/physicians/{id}/compliance returns the average score
      across that physician's Prescriptions in status IN {ISSUED, TRANSMITTED, DISPENSED}
      (VOIDED and DRAFT excluded), tie-broken by oldest created_at first when ranking
      multiple physicians.
    constants:
      FULL_LICENSE_PTS: 40
      IMLC_PTS: 30
      DEA_OK_PTS: 30
      REFILL_OK_PTS: 20
      DAYS_SUPPLY_OK_PTS: 10
      MIN_PASS_SCORE: 80
    precision: "Integer points; aggregate average rounded HALF_UP to one decimal place."
    variants:
      - name: per_prescription_pass
        when: "Issuance precondition during DRAFT→ISSUED"
        difference: "Threshold ≥ 80 must hold; otherwise ERR_COMPLIANCE_SCORE_TOO_LOW."
      - name: physician_aggregate
        when: "Read endpoint GET /telemed/physicians/{id}/compliance"
        difference: "Average across qualifying Prescriptions; no threshold enforced — observational only."

  - name: state_license_status_projection
    trigger: "Read of any StateLicense (GET, list, or referenced during routing/issuance preconditions)."
    algorithm: projection
    formula: |
      # Project the license status from the immutable fields (issued_at, expires_at, revoked_at)
      # plus current clock time. The expensive replay would walk every revoke/reinstate event;
      # here the projection is closed-form because there is no reinstate path.
      if StateLicense has a corresponding REVOKE event in AuditEvent of subject_id == this StateLicense:
          status = REVOKED
      elif clock.now() >= StateLicense.expires_at:
          status = EXPIRED
      else:
          status = ACTIVE
    input_set: |
      StateLicense.issued_at, StateLicense.expires_at, the presence of an
      AuditEvent(event_type=LICENSE_REVOKED, subject_id=StateLicense.id), and clock.now().
      No other licenses participate; this is a per-license closed-form projection.
    constants: {}
    precision: "Status is an enum; comparisons against expires_at use UTC seconds."

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header and X-User-ID header present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /telemed/_clock/advance and POST /telemed/_sweep/run"

  - priority: 2
    category: auth
    check: "Role is allowed to perform this endpoint per RBAC (§1.7)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-referenced resources exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a state that permits this transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_referential
    check: "On Prescription DRAFT→ISSUED and PATCH, prescribing_physician_id == Consult.physician_id"
    error_id: ERR_PHYSICIAN_MISMATCH
    http_status: 422
    applies_to: "POST /telemed/consults/{cid}/prescriptions, PATCH /telemed/prescriptions/{id}, POST /telemed/prescriptions/{id}/issue"

  - priority: 6
    category: business_safety
    check: "On Consult REQUESTED→ROUTED: the chosen Physician has at least one StateLicense whose state_code == Consult.present_state_code AND status == ACTIVE; if none exists, reject"
    error_id: ERR_NO_VALID_LICENSE
    http_status: 422
    applies_to: "POST /telemed/consults/{id}/route"

  - priority: 7
    category: business_safety
    check: "On Prescription DRAFT→ISSUED: if dea_schedule != NONE then Physician.dea_number must be present AND epcs_two_factor_token must be present"
    error_id: ERR_DEA_REQUIREMENTS_NOT_MET
    http_status: 422
    applies_to: "POST /telemed/prescriptions/{id}/issue"

  - priority: 8
    category: business_safety
    check: "On Prescription DRAFT→ISSUED: if dea_schedule == II then refills == 0 (DEA Schedule II hard rule)"
    error_id: ERR_SCHEDULE_II_REFILLS_FORBIDDEN
    http_status: 422
    applies_to: "POST /telemed/prescriptions/{id}/issue"

  - priority: 9
    category: business_safety
    check: "On Prescription DRAFT→ISSUED: prescription_compliance_score >= 80"
    error_id: ERR_COMPLIANCE_SCORE_TOO_LOW
    http_status: 422
    applies_to: "POST /telemed/prescriptions/{id}/issue"

  - priority: 10
    category: business_constraint
    check: "On Consult creation when billing_mode=INSURANCE: Patient.insurance_payer_id and insurance_member_id must both be present"
    error_id: ERR_INSURANCE_NOT_ENROLLED
    http_status: 422
    applies_to: "POST /telemed/consults"

  - priority: 11
    category: business_constraint
    check: "On Prescription PATCH or create: days_supply in [1,90] AND refills in [0,11]"
    error_id: ERR_RX_FIELD_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /telemed/consults/{cid}/prescriptions, PATCH /telemed/prescriptions/{id}"

  - priority: 12
    category: business_temporal
    check: "On FollowUp scheduling: due_by computed by followup_due_date MUST be > now"
    error_id: ERR_FOLLOWUP_WINDOW_EMPTY
    http_status: 422
    applies_to: "side_effect during Consult COMPLETE"

  - priority: 13
    category: business_referential
    check: "On Consult.close: any InsuranceClaim under the Consult must be in {PAID, DENIED}; any SelfPayInvoice must be in {PAID, VOIDED}; any FollowUp must be in {COMPLETED, MISSED, CANCELLED}"
    error_id: ERR_BILLING_NOT_TERMINAL
    http_status: 409
    applies_to: "POST /telemed/consults/{id}/close"

  - priority: 14
    category: business_temporal
    check: "On POST /telemed/consults: Patient must not currently own another Consult in {REQUESTED, ROUTED, IN_PROGRESS, COMPLETED}. Two consults overlap if both have non-terminal status simultaneously (status-enum-based active-window semantics)."
    error_id: ERR_PATIENT_HAS_ACTIVE_CONSULT
    http_status: 409
    applies_to: "POST /telemed/consults"

  - priority: 15
    category: business_temporal
    check: "On POST /telemed/physicians/{id}/licenses: the new license's [issued_at, expires_at) interval must not overlap any existing StateLicense for the same (physician_id, state_code). Overlap uses half-open interval semantics: [a1, e1) and [a2, e2) overlap iff a1 < e2 AND a2 < e1; back-to-back licenses where e1 == a2 are permitted."
    error_id: ERR_LICENSE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /telemed/physicians/{id}/licenses"

  - priority: 16
    category: business_constraint
    check: "OCC version check (when version supplied on PATCH/PUT or state transition)"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all version-bearing mutations"

  - priority: 17
    category: business_constraint
    check: "Pagination: limit in [1,100], offset >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Physicians & licensure ----
  - method: POST
    path: "/telemed/physicians"
    description: "Register a new Physician."
    roles: [PlatformAdmin]
    code: 201
    input: ["full_name", "npi_number", "imlc_compact_member", "imlc_home_state?", "dea_number?"]
    output: Physician
    side_effects: []

  - method: GET
    path: "/telemed/physicians/{id}"
    description: "Read a physician."
    roles: [PlatformAdmin, ComplianceOfficer, Physician]
    code: 200
    input: []
    output: Physician
    side_effects: []

  - method: GET
    path: "/telemed/physicians"
    description: "List physicians (paginated, filterable by status)."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Physician[]
    side_effects: []

  - method: POST
    path: "/telemed/physicians/{id}/licenses"
    description: "Register a StateLicense under the physician."
    roles: [PlatformAdmin]
    code: 201
    input: ["state_code", "license_number", "license_type", "issued_at", "expires_at"]
    output: StateLicense
    side_effects: []

  - method: GET
    path: "/telemed/physicians/{id}/licenses"
    description: "List the physician's StateLicenses, with projected status."
    roles: [PlatformAdmin, ComplianceOfficer, Physician]
    code: 200
    input: ["limit?", "offset?", "state_code?", "status?"]
    output: StateLicense[]
    side_effects: []

  - method: POST
    path: "/telemed/physicians/{pid}/licenses/{lid}/revoke"
    description: "Mark a StateLicense as REVOKED. Cascades: any Consult in {REQUESTED, ROUTED, IN_PROGRESS} whose physician_id == this license's physician_id AND present_state_code == this license's state_code AND routing_basis matches this license is forcibly unrouted; every DRAFT Prescription under those consults is auto-voided with void_reason='LICENSE_REVOKED'."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: StateLicense
    side_effects:
      - "AuditEvent(event_type=LICENSE_REVOKED) appended"
      - "Cascade depth 2: every Consult in {ROUTED, IN_PROGRESS} whose (physician_id, present_state_code) match this license is set back to REQUESTED with physician_id=null, routing_basis=null"
      - "Cascade depth 3: every Prescription in status=DRAFT under those affected Consults is auto-voided (status=VOIDED, void_reason='LICENSE_REVOKED'), and an AuditEvent(RX_VOIDED) is appended per prescription"

  - method: GET
    path: "/telemed/physicians/{id}/compliance"
    description: "Return the physician's aggregate compliance score (per §1.3 physician_aggregate variant)."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: object
    side_effects: []

  # ---- Patients ----
  - method: POST
    path: "/telemed/patients"
    description: "Register a Patient."
    roles: [PlatformAdmin]
    code: 201
    input: ["full_name", "date_of_birth", "home_state_code", "present_state_code?", "insurance_payer_id?", "insurance_member_id?", "insurance_deductible_remaining_cents?", "insurance_copay_cents?", "insurance_coinsurance_bps?"]
    output: Patient
    side_effects: []

  - method: GET
    path: "/telemed/patients/{id}"
    description: "Read a patient."
    roles: [PlatformAdmin, ComplianceOfficer, Physician]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: PATCH
    path: "/telemed/patients/{id}"
    description: "Update Patient mutable fields (e.g., present_state_code, insurance fields)."
    roles: [PlatformAdmin]
    code: 200
    input: ["present_state_code?", "insurance_deductible_remaining_cents?", "insurance_copay_cents?", "insurance_coinsurance_bps?", "version?"]
    output: Patient
    side_effects: []

  # ---- Consults ----
  - method: POST
    path: "/telemed/consults"
    description: "Create a Consult. Snapshots Patient.present_state_code onto the consult."
    roles: [ComplianceOfficer]
    code: 201
    input: ["patient_id", "present_state_code?", "billing_mode", "visit_tier", "requires_followup?"]
    output: Consult
    side_effects: []

  - method: GET
    path: "/telemed/consults/{id}"
    description: "Read a consult."
    roles: [ComplianceOfficer, Physician]
    code: 200
    input: []
    output: Consult
    side_effects: []

  - method: GET
    path: "/telemed/consults"
    description: "List consults (paginated, filterable by status, billing_mode, present_state_code)."
    roles: [ComplianceOfficer, Physician]
    code: 200
    input: ["limit?", "offset?", "status?", "billing_mode?", "present_state_code?"]
    output: Consult[]
    side_effects: []

  - method: POST
    path: "/telemed/consults/{id}/route"
    description: "Compliance-route a REQUESTED consult to a Physician with a valid license in the patient's present_state_code."
    roles: [ComplianceOfficer]
    code: 200
    input: ["physician_id", "version?"]
    output: Consult
    side_effects:
      - "Consult.physician_id set; Consult.routing_basis set; AuditEvent CONSULT_ROUTED appended"

  - method: POST
    path: "/telemed/consults/{id}/decline"
    description: "Compliance declines a REQUESTED consult (terminal: DECLINED)."
    roles: [ComplianceOfficer]
    code: 200
    input: ["version?"]
    output: Consult
    side_effects: []

  - method: POST
    path: "/telemed/consults/{id}/unroute"
    description: "Revert a ROUTED consult back to REQUESTED before treatment begins."
    roles: [ComplianceOfficer]
    code: 200
    input: ["version?"]
    output: Consult
    side_effects: []

  - method: POST
    path: "/telemed/consults/{id}/start"
    description: "Physician starts an IN_PROGRESS consult (ROUTED→IN_PROGRESS)."
    roles: [Physician]
    code: 200
    input: ["version?"]
    output: Consult
    side_effects: []

  - method: POST
    path: "/telemed/consults/{id}/complete"
    description: "Physician completes the consult; triggers charge calculation and billing/follow-up cascades."
    roles: [Physician]
    code: 200
    input: ["version?"]
    output: Consult
    side_effects:
      - "consult_charge_calculation runs"
      - "InsuranceClaim or SelfPayInvoice row created per billing_mode"
      - "FollowUp row created if requires_followup, per followup_due_date"

  - method: POST
    path: "/telemed/consults/{id}/close"
    description: "Close a completed consult once billing and follow-up are terminal."
    roles: [ComplianceOfficer]
    code: 200
    input: ["version?"]
    output: Consult
    side_effects: []

  # ---- Prescriptions ----
  - method: POST
    path: "/telemed/consults/{cid}/prescriptions"
    description: "Create a DRAFT Prescription under an IN_PROGRESS consult."
    roles: [Physician]
    code: 201
    input: ["drug_name", "dea_schedule", "days_supply", "refills?", "epcs_two_factor_token?"]
    output: Prescription
    side_effects: []

  - method: PATCH
    path: "/telemed/prescriptions/{id}"
    description: "Edit a DRAFT prescription (self-loop)."
    roles: [Physician]
    code: 200
    input: ["drug_name?", "dea_schedule?", "days_supply?", "refills?", "epcs_two_factor_token?", "version?"]
    output: Prescription
    side_effects: []

  - method: POST
    path: "/telemed/prescriptions/{id}/issue"
    description: "Issue a DRAFT prescription (DEA + licensure + compliance score checks)."
    roles: [Physician]
    code: 200
    input: ["version?"]
    output: Prescription
    side_effects:
      - "AuditEvent(event_type=RX_ISSUED) appended"

  - method: POST
    path: "/telemed/prescriptions/{id}/transmit"
    description: "Mark an issued prescription as transmitted to a pharmacy."
    roles: [Physician]
    code: 200
    input: ["version?"]
    output: Prescription
    side_effects: []

  - method: POST
    path: "/telemed/prescriptions/{id}/mark-dispensed"
    description: "Mark a transmitted prescription as dispensed."
    roles: [ComplianceOfficer]
    code: 200
    input: ["version?"]
    output: Prescription
    side_effects: []

  - method: POST
    path: "/telemed/prescriptions/{id}/void"
    description: "Void a non-dispensed prescription."
    roles: [Physician]
    code: 200
    input: ["void_reason", "version?"]
    output: Prescription
    side_effects:
      - "AuditEvent(event_type=RX_VOIDED) appended"

  # ---- Billing ----
  - method: GET
    path: "/telemed/claims/{id}"
    description: "Read an InsuranceClaim."
    roles: [ComplianceOfficer, Payer]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

  - method: POST
    path: "/telemed/claims/{id}/approve"
    description: "Payer approves a SUBMITTED or APPEALED claim."
    roles: [Payer]
    code: 200
    input: ["version?"]
    output: InsuranceClaim
    side_effects: []

  - method: POST
    path: "/telemed/claims/{id}/deny"
    description: "Payer denies a SUBMITTED claim."
    roles: [Payer]
    code: 200
    input: ["denial_reason", "version?"]
    output: InsuranceClaim
    side_effects: []

  - method: POST
    path: "/telemed/claims/{id}/appeal"
    description: "Compliance appeals a DENIED claim."
    roles: [ComplianceOfficer]
    code: 200
    input: ["version?"]
    output: InsuranceClaim
    side_effects: []

  - method: POST
    path: "/telemed/claims/{id}/mark-paid"
    description: "Payer marks an APPROVED claim as paid; decrements Patient.insurance_deductible_remaining_cents."
    roles: [Payer]
    code: 200
    input: ["version?"]
    output: InsuranceClaim
    side_effects:
      - "Patient.insurance_deductible_remaining_cents decremented"
      - "AuditEvent CLAIM_PAID appended"

  - method: GET
    path: "/telemed/invoices/{id}"
    description: "Read a SelfPayInvoice."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: SelfPayInvoice
    side_effects: []

  - method: POST
    path: "/telemed/invoices/{id}/mark-paid"
    description: "Mark a self-pay invoice as paid."
    roles: [ComplianceOfficer]
    code: 200
    input: ["version?"]
    output: SelfPayInvoice
    side_effects: []

  # ---- Follow-ups ----
  - method: GET
    path: "/telemed/followups/{id}"
    description: "Read a FollowUp."
    roles: [ComplianceOfficer, Physician]
    code: 200
    input: []
    output: FollowUp
    side_effects: []

  - method: POST
    path: "/telemed/followups/{id}/complete"
    description: "Physician completes a scheduled FollowUp (must be ≤ due_by)."
    roles: [Physician]
    code: 200
    input: ["version?"]
    output: FollowUp
    side_effects: []

  - method: POST
    path: "/telemed/followups/{id}/cancel"
    description: "Compliance cancels a scheduled FollowUp."
    roles: [ComplianceOfficer]
    code: 200
    input: ["version?"]
    output: FollowUp
    side_effects: []

  # ---- Test-driving endpoints (required for state-coverage) ----
  - method: POST
    path: "/telemed/_clock/advance"
    description: "Advance the in-process simulated clock. Required to reach time-gated states (license EXPIRED, FollowUp MISSED)."
    roles: [PlatformAdmin]
    code: 200
    input: ["to"]
    output: object
    side_effects:
      - "Simulated clock advances; subsequent reads of StateLicense.status may project to EXPIRED."

  - method: POST
    path: "/telemed/_sweep/run"
    description: "Run the nightly sweep: any FollowUp whose due_by < clock.now() transitions SCHEDULED→MISSED. Required to make MISSED reachable."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: object
    side_effects:
      - "FollowUps with due_by < now flip SCHEDULED → MISSED"
      - "AuditEvent rows appended per FollowUp transition"

  # ---- Audit trail ----
  - method: GET
    path: "/telemed/audit-events"
    description: "List AuditEvent rows (paginated)."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?", "event_type?", "subject_entity?", "subject_id?"]
    output: AuditEvent[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing X-User-Role or X-User-ID header."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role is not authorized for this endpoint per §1.7."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits this transition."
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version supplied does not match current version."
  - id: ERR_NO_VALID_LICENSE
    http: 422
    condition: "Routing: physician has no ACTIVE StateLicense matching Consult.present_state_code."
  - id: ERR_DEA_REQUIREMENTS_NOT_MET
    http: 422
    condition: "Issuing a controlled-substance prescription without a DEA number or EPCS token."
  - id: ERR_SCHEDULE_II_REFILLS_FORBIDDEN
    http: 422
    condition: "Issuing a Schedule II prescription with refills > 0."
  - id: ERR_COMPLIANCE_SCORE_TOO_LOW
    http: 422
    condition: "Issuing a prescription whose prescription_compliance_score < 80."
  - id: ERR_PHYSICIAN_MISMATCH
    http: 422
    condition: "Prescription.prescribing_physician_id does not equal Consult.physician_id."
  - id: ERR_INSURANCE_NOT_ENROLLED
    http: 422
    condition: "Consult.billing_mode = INSURANCE but Patient lacks insurance_payer_id or insurance_member_id."
  - id: ERR_RX_FIELD_OUT_OF_RANGE
    http: 422
    condition: "days_supply or refills outside the declared range."
  - id: ERR_FOLLOWUP_WINDOW_EMPTY
    http: 422
    condition: "Computed FollowUp.due_by would not be strictly later than now (defensive)."
  - id: ERR_BILLING_NOT_TERMINAL
    http: 409
    condition: "Closing a consult while billing or follow-up is non-terminal."
  - id: ERR_CLAIM_ALREADY_EXISTS
    http: 409
    condition: "An InsuranceClaim already exists for this Consult (uniqueness on consult_id)."
  - id: ERR_PATIENT_HAS_ACTIVE_CONSULT
    http: 409
    condition: "Creating a Consult while the Patient has another Consult in a non-terminal state (REQUESTED, ROUTED, IN_PROGRESS, or COMPLETED)."
  - id: ERR_LICENSE_PERIOD_OVERLAP
    http: 409
    condition: "Registering a StateLicense whose [issued_at, expires_at) interval overlaps an existing license for the same (physician_id, state_code)."
  - id: ERR_PAGINATION_INVALID
    http: 400
    condition: "limit out of [1,100] or offset < 0."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator who registers physicians, patients, and licenses; runs clock/sweep utilities."
    identity: "opaque"
    exclusive_operations:
      - "POST /telemed/physicians"
      - "POST /telemed/physicians/{id}/licenses"
      - "POST /telemed/physicians/{pid}/licenses/{lid}/revoke"
      - "POST /telemed/patients"
      - "PATCH /telemed/patients/{id}"
      - "POST /telemed/_clock/advance"
      - "POST /telemed/_sweep/run"
    shared_operations:
      - "GET /telemed/physicians"
      - "GET /telemed/physicians/{id}"
      - "GET /telemed/physicians/{id}/licenses"
      - "GET /telemed/physicians/{id}/compliance"
      - "GET /telemed/audit-events"

  - name: ComplianceOfficer
    description: "Routes and closes consults, appeals denied claims; cannot prescribe or treat (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /telemed/consults"
      - "POST /telemed/consults/{id}/route"
      - "POST /telemed/consults/{id}/decline"
      - "POST /telemed/consults/{id}/unroute"
      - "POST /telemed/consults/{id}/close"
      - "POST /telemed/claims/{id}/appeal"
      - "POST /telemed/prescriptions/{id}/mark-dispensed"
      - "POST /telemed/invoices/{id}/mark-paid"
      - "POST /telemed/followups/{id}/cancel"
    shared_operations:
      - "GET /telemed/consults"
      - "GET /telemed/consults/{id}"
      - "GET /telemed/claims/{id}"
      - "GET /telemed/invoices/{id}"
      - "GET /telemed/followups/{id}"
      - "GET /telemed/audit-events"
      - "GET /telemed/physicians/{id}/compliance"
      - "GET /telemed/patients/{id}"
      - "GET /telemed/physicians/{id}"
      - "GET /telemed/physicians/{id}/licenses"

  - name: Physician
    description: "Treats routed consults, drafts/issues/voids prescriptions, completes follow-ups."
    identity: "entity_backed:Physician"
    exclusive_operations:
      - "POST /telemed/consults/{id}/start"
      - "POST /telemed/consults/{id}/complete"
      - "POST /telemed/consults/{cid}/prescriptions"
      - "PATCH /telemed/prescriptions/{id}"
      - "POST /telemed/prescriptions/{id}/issue"
      - "POST /telemed/prescriptions/{id}/transmit"
      - "POST /telemed/prescriptions/{id}/void"
      - "POST /telemed/followups/{id}/complete"
    shared_operations:
      - "GET /telemed/consults"
      - "GET /telemed/consults/{id}"
      - "GET /telemed/patients/{id}"
      - "GET /telemed/physicians/{id}"
      - "GET /telemed/physicians/{id}/licenses"
      - "GET /telemed/followups/{id}"
    note: |
      Segregation of duties: a Physician cannot route, decline, close, or appeal a consult,
      cannot mark-dispensed (that is the pharmacy/compliance step), and cannot edit Patient
      records. A ComplianceOfficer cannot start, complete, prescribe, or issue prescriptions.

  - name: Payer
    description: "Insurance payer who approves, denies, and marks-paid claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /telemed/claims/{id}/approve"
      - "POST /telemed/claims/{id}/deny"
      - "POST /telemed/claims/{id}/mark-paid"
    shared_operations:
      - "GET /telemed/claims/{id}"
