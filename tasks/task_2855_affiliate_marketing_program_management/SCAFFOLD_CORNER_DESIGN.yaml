          - endpoints[POST /policy-violation-cases]
        distinguishing_aspect: "The auto-suspension threshold is inclusive on the point-in-time variant only: partner A carrying COOKIE_STUFFING (40) plus UNAUTHORIZED_COUPON (25) scores 65 and stays ACTIVE, while partner B carrying COOKIE_STUFFING (40) plus FORCED_CLICK (30) hits exactly 70 and auto-suspends with suspension_cause FRAUD_THRESHOLD on the case-creation call itself. B is still ACTIVE after its first case at 40, so the suspension is caused by crossing the threshold, not by having two cases."
