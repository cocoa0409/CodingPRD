# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Specialty Coffee Shop & Multi-Roast Café — Expert
# Breadth probe across the claim-extraction taxonomy.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: menu_item_not_found_returns_404
        claim_type: not_found
        grounds: [entities.MenuItem, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET a non-existent MenuItem id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /menu-items/00000000-0000-0000-0000-000000000000", payload: {}, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: order_empty_lines_returns_empty_order
        claim_type: required_fields
        grounds: [entities.Order.fields.lines, "errors[ERR_EMPTY_ORDER]"]
        distinguishing_aspect: "Creating an order with zero lines returns ERR_EMPTY_ORDER (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /orders", payload: { lines: [] }, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_EMPTY_ORDER"
            - "response.http_status == 422"

      - name: member_computed_fields_on_create
        claim_type: computed_fields
        grounds: [entities.Member.fields.tier, entities.Member.fields.points_balance, entities.Member.fields.lifetime_points]
        distinguishing_aspect: "A newly created Member has points_balance==0, lifetime_points==0, tier==BRONZE regardless of input."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "new@x.com", full_name: "New" }, as: Manager, captures: { m_id: "$.data.id" } }
          trigger:
            - { call: "GET /members/${m_id}", payload: {}, as: Manager }
          assert:
            - "Member.${m_id}.points_balance == 0"
            - "Member.${m_id}.lifetime_points == 0"
            - "Member.${m_id}.tier == BRONZE"

      - name: bean_lot_on_hand_equals_received_on_create
        claim_type: computed_fields
        grounds: [entities.BeanLot.fields.on_hand_grams, entities.BeanLot.fields.rotation_status]
        distinguishing_aspect: "A newly created BeanLot has on_hand_grams == received_grams, consumed_grams 0, waste 0, rotation_status RESERVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - { call: "POST /bean-lots", payload: { origin: "COLOMBIA", roast_level: "DARK", received_grams: 800, par_grams: 100, price_per_gram_cents: 4 }, as: Manager, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "GET /bean-lots/${lot_id}", payload: {}, as: Manager }
          assert:
            - "BeanLot.${lot_id}.on_hand_grams == 800"
            - "BeanLot.${lot_id}.rotation_status == RESERVE"

      - name: catering_quote_and_deposit_computed
        claim_type: computed_fields
        grounds: [calculations.catering_quote, entities.CateringEvent.fields.quoted_total_cents, entities.CateringEvent.fields.deposit_cents]
        distinguishing_aspect: "headcount 30 * PER_HEAD_CENTS 1500 + travel_fee 5000 = quoted_total 50000; deposit = round_half_up(50000*0.25) = 12500."
        test_recipe:
          setup: ["ACTIVE barista and OPERATIONAL equipment for the assignment fields."]
          setup_api_calls:
            - { call: "POST /baristas", payload: { name: "B", station_role: "CATERING" }, as: Manager, captures: { bar_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "Cart", equipment_type: "ESPRESSO" }, as: Manager, captures: { eq_id: "$.data.id" } }
          trigger:
            - { call: "POST /catering-events", payload: { client_name: "Gala", assigned_equipment_id: "${eq_id}", assigned_barista_id: "${bar_id}", scheduled_start: "2026-03-05T18:00:00Z", scheduled_end: "2026-03-05T21:00:00Z", headcount: 30, travel_fee_cents: 5000 }, as: Manager, captures: { evt_id: "$.data.id" } }
          assert:
            - "CateringEvent.${evt_id}.quoted_total_cents == 50000"
            - "CateringEvent.${evt_id}.deposit_cents == 12500"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_lot_rejected
        claim_type: invalid_transition
        grounds: [state_machines.BeanLot.RESERVE_to_ACTIVE, "errors[ERR_ALREADY_ACTIVE]"]
        distinguishing_aspect: "Activating a lot that is already ACTIVE returns ERR_ALREADY_ACTIVE (409)."
        test_recipe:
          setup: ["A lot created and activated (ACTIVE)."]
          setup_api_calls:
            - { call: "POST /bean-lots", payload: { origin: "BRAZIL", roast_level: "MEDIUM", received_grams: 500, par_grams: 50, price_per_gram_cents: 4 }, as: Manager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /bean-lots/${lot_id}/activate", payload: {}, as: Manager }
          trigger:
            - { call: "POST /bean-lots/${lot_id}/activate", payload: {}, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_ALREADY_ACTIVE"

      - name: cancel_subscription_twice_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Subscription.ACTIVE_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED subscription returns ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["A member with an ACTIVE subscription, then cancelled."]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "sub@x.com", full_name: "Sub" }, as: Manager, captures: { m_id: "$.data.id", m_v: "$.data.version" } }
            - { call: "POST /subscriptions", payload: { member_id: "${m_id}", bean_origin: "ETHIOPIA", frequency: "MONTHLY", bags_per_cycle: 2, next_ship_at: "2026-04-01T00:00:00Z", expected_member_version: "${m_v}" }, as: Manager, captures: { sub_id: "$.data.id" } }
            - { call: "POST /subscriptions/${sub_id}/cancel", payload: {}, as: Manager }
          trigger:
            - { call: "POST /subscriptions/${sub_id}/cancel", payload: {}, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: close_reconciliation_without_count_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.DailyReconciliation.COUNTING_to_CLOSED, "errors[ERR_COUNT_NOT_SUBMITTED]"]
        distinguishing_aspect: "Closing a reconciliation with no submitted count returns ERR_COUNT_NOT_SUBMITTED (409)."
        test_recipe:
          setup: ["A bean lot and an OPEN reconciliation (no count submitted)."]
          setup_api_calls:
            - { call: "POST /bean-lots", payload: { origin: "PERU", roast_level: "LIGHT", received_grams: 400, par_grams: 50, price_per_gram_cents: 5 }, as: Manager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /daily-reconciliations", payload: { business_date: "2026-03-03", bean_lot_id: "${lot_id}" }, as: Manager, captures: { recon_id: "$.data.id" } }
          trigger:
            - { call: "POST /daily-reconciliations/${recon_id}/close", payload: {}, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_COUNT_NOT_SUBMITTED"

      - name: log_waste_depletes_active_then_promotes_reserve
        claim_type: cross_entity
        grounds: [state_machines.BeanLot.ACTIVE_to_DEPLETED, state_machines.BeanLot.RESERVE_to_ACTIVE, "errors[ERR_LOT_DEPLETED]"]
        distinguishing_aspect: "Logging waste that empties the ACTIVE lot (on_hand->0) transitions it ACTIVE->DEPLETED and auto-activates the oldest RESERVE lot of the origin — same cascade from the log-waste trigger."
        test_recipe:
          setup: ["Lot A GUATEMALA received 100g ACTIVE; lot B GUATEMALA received 300g RESERVE (created after A)."]
          setup_api_calls:
            - { call: "POST /bean-lots", payload: { origin: "GUATEMALA", roast_level: "MEDIUM", received_grams: 100, par_grams: 0, price_per_gram_cents: 5 }, as: Manager, captures: { lotA_id: "$.data.id" } }
            - { call: "POST /bean-lots/${lotA_id}/activate", payload: {}, as: Manager }
            - { call: "POST /bean-lots", payload: { origin: "GUATEMALA", roast_level: "MEDIUM", received_grams: 300, par_grams: 0, price_per_gram_cents: 5 }, as: Manager, captures: { lotB_id: "$.data.id" } }
          trigger:
            - { call: "POST /bean-lots/${lotA_id}/log-waste", payload: { grams: 100, reason: "SPOILAGE" }, as: Manager }
          assert:
            - "BeanLot.${lotA_id}.on_hand_grams == 0"
            - "BeanLot.${lotA_id}.rotation_status == DEPLETED"
            - "BeanLot.${lotB_id}.rotation_status == ACTIVE"

      - name: pay_voided_order_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Order.UNPAID_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Paying an order whose fulfillment_status is VOIDED returns ERR_INVALID_STATE (409) — payment precondition on the fulfillment dimension."
        test_recipe:
          setup: ["An order placed then voided (still UNPAID)."]
          setup_api_calls:
            - { call: "POST /menu-items", payload: { name: "Batch", category: "BEVERAGE", base_price_cents: 400, required_equipment_type: "BATCH_BREW", size: "MEDIUM", origin_required: false }, as: Manager, captures: { batch_id: "$.data.id" } }
            - { call: "POST /orders", payload: { lines: [ { menu_item_id: "${batch_id}", quantity: 1, modifier_ids: [] } ] }, as: Manager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/void", payload: {}, as: Manager }
          trigger:
            - { call: "POST /orders/${ord_id}/pay", payload: {}, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - section: calculations
    instances:
      - name: order_totals_silver_tier_discount
        claim_type: correct_result
        grounds: [calculations.order_totals, entities.Order.fields.discount_cents]
        distinguishing_aspect: "SILVER member (5%) on subtotal 1530: tier_discount=round_half_up(1530*0.05)=77, service_fee 50, total=1530-77+50=1503."
        test_recipe:
          setup: ["SILVER member (lifetime 500); Latte LG + Extra Shot; single-line order qty 2."]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "silver@x.com", full_name: "Silver" }, as: Manager, captures: { m_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/point-adjustments", payload: { lifetime_points_delta: 500, points_balance_delta: 0 }, as: Manager }
            - { call: "POST /modifiers", payload: { name: "Extra Shot", modifier_group: "SHOT", surcharge_cents: 90, extra_bean_grams: 9 }, as: Manager, captures: { shot_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Latte LG", category: "BEVERAGE", base_price_cents: 450, required_equipment_type: "ESPRESSO", size: "LARGE", bean_grams: 18, origin_required: false }, as: Manager, captures: { latte_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders", payload: { member_id: "${m_id}", lines: [ { menu_item_id: "${latte_id}", quantity: 2, modifier_ids: ["${shot_id}"] } ] }, as: Manager, captures: { ord_id: "$.data.id" } }
          assert:
            - "Order.${ord_id}.subtotal_cents == 1530"
            - "Order.${ord_id}.discount_cents == 77"
            - "Order.${ord_id}.total_cents == 1503"

      - name: reconciliation_revenue_variance_correct
        claim_type: correct_result
        grounds: [calculations.reconciliation_revenue, entities.DailyReconciliation.fields.revenue_variance_cents]
        distinguishing_aspect: "One PAID+FULFILLED order total 1764 gives expected_revenue 1764; counted 1800 yields revenue_variance_cents == 36."
        test_recipe:
          setup: ["GOLD member; the 2-line order (total 1764) paid and fulfilled; reconciliation counts submitted."]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "rev@x.com", full_name: "Rev" }, as: Manager, captures: { m_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/point-adjustments", payload: { lifetime_points_delta: 1200, points_balance_delta: 0 }, as: Manager }
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
            - { call: "POST /equipment", payload: { name: "brew1", equipment_type: "BATCH_BREW" }, as: Manager, captures: { brew_id: "$.data.id" } }
            - { call: "POST /bean-lots", payload: { origin: "ETHIOPIA", roast_level: "MEDIUM", received_grams: 1000, par_grams: 200, price_per_gram_cents: 5 }, as: Manager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /bean-lots/${lot_id}/activate", payload: {}, as: Manager }
            - { call: "POST /modifiers", payload: { name: "Extra Shot", modifier_group: "SHOT", surcharge_cents: 90, extra_bean_grams: 9 }, as: Manager, captures: { shot_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Latte LG", category: "BEVERAGE", base_price_cents: 450, required_equipment_type: "ESPRESSO", size: "LARGE", bean_grams: 18, origin_required: true, bean_origin: "ETHIOPIA" }, as: Manager, captures: { latte_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Drip MD", category: "BEVERAGE", base_price_cents: 300, required_equipment_type: "BATCH_BREW", size: "MEDIUM", bean_grams: 20, origin_required: true, bean_origin: "ETHIOPIA" }, as: Manager, captures: { drip_id: "$.data.id" } }
            - { call: "POST /orders", payload: { member_id: "${m_id}", lines: [ { menu_item_id: "${latte_id}", quantity: 2, modifier_ids: ["${shot_id}"] }, { menu_item_id: "${drip_id}", quantity: 1, modifier_ids: [] } ] }, as: Manager, captures: { ord_id: "$.data.id" } }
            - { call: "POST /orders/${ord_id}/pay", payload: {}, as: Manager }
            - { call: "POST /orders/${ord_id}/fulfill", payload: {}, as: Manager }
            - { call: "POST /daily-reconciliations", payload: { business_date: "2026-03-04", bean_lot_id: "${lot_id}" }, as: Manager, captures: { recon_id: "$.data.id", recon_v: "$.data.version" } }
            - { call: "POST /daily-reconciliations/${recon_id}/submit-count", payload: { counted_revenue_cents: 1800, counted_bean_on_hand_grams: 900, expected_reconciliation_version: "${recon_v}" }, as: Manager }
          trigger:
            - { call: "POST /daily-reconciliations/${recon_id}/close", payload: {}, as: Manager }
          assert:
            - "DailyReconciliation.${recon_id}.expected_revenue_cents == 1764"
            - "DailyReconciliation.${recon_id}.revenue_variance_cents == 36"

  # ===========================================================================
  - section: validations
    instances:
      - name: duplicate_member_email_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Registering a second member with an existing email returns ERR_DUPLICATE_EMAIL (422)."
        test_recipe:
          setup: ["A member with email dup@x.com."]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "dup@x.com", full_name: "One" }, as: Manager }
          trigger:
            - { call: "POST /members", payload: { email: "dup@x.com", full_name: "Two" }, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_EMAIL"

      - name: duplicate_business_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_BUSINESS_DATE]"]
        distinguishing_aspect: "Opening a second reconciliation for an existing business_date returns ERR_DUPLICATE_BUSINESS_DATE (422)."
        test_recipe:
          setup: ["A bean lot and a reconciliation for 2026-03-06."]
          setup_api_calls:
            - { call: "POST /bean-lots", payload: { origin: "PERU", roast_level: "LIGHT", received_grams: 400, par_grams: 50, price_per_gram_cents: 5 }, as: Manager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /daily-reconciliations", payload: { business_date: "2026-03-06", bean_lot_id: "${lot_id}" }, as: Manager }
          trigger:
            - { call: "POST /daily-reconciliations", payload: { business_date: "2026-03-06", bean_lot_id: "${lot_id}" }, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_BUSINESS_DATE"

      - name: invalid_interval_maintenance_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INVALID_INTERVAL]"]
        distinguishing_aspect: "A maintenance window with end_at <= start_at returns ERR_INVALID_INTERVAL (422)."
        test_recipe:
          setup: ["An equipment record."]
          setup_api_calls:
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
          trigger:
            - { call: "POST /maintenance-windows", payload: { equipment_id: "${esp_id}", start_at: "2026-03-02T12:00:00Z", end_at: "2026-03-02T11:00:00Z", kind: "REPAIR" }, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_INTERVAL"

      - name: insufficient_beans_on_fulfill_rejected
        claim_type: aggregate_validation
        grounds: ["validations[priority=8]", "errors[ERR_INSUFFICIENT_BEANS]"]
        distinguishing_aspect: "Fulfilling a line needing 18g when the ACTIVE lot holds only 10g returns ERR_INSUFFICIENT_BEANS (422)."
        test_recipe:
          setup: ["ESPRESSO machine OPERATIONAL; ACTIVE ETHIOPIA lot with only 10g; Latte item bean_grams 18; an order."]
          setup_api_calls:
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
            - { call: "POST /bean-lots", payload: { origin: "ETHIOPIA", roast_level: "MEDIUM", received_grams: 10, par_grams: 0, price_per_gram_cents: 5 }, as: Manager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /bean-lots/${lot_id}/activate", payload: {}, as: Manager }
            - { call: "POST /menu-items", payload: { name: "Latte MD", category: "BEVERAGE", base_price_cents: 450, required_equipment_type: "ESPRESSO", size: "MEDIUM", bean_grams: 18, origin_required: true, bean_origin: "ETHIOPIA" }, as: Manager, captures: { latte_id: "$.data.id" } }
            - { call: "POST /orders", payload: { lines: [ { menu_item_id: "${latte_id}", quantity: 1, modifier_ids: [] } ] }, as: Manager, captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/fulfill", payload: {}, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_BEANS"

      - name: insufficient_points_redemption_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_INSUFFICIENT_POINTS]"]
        distinguishing_aspect: "An ACTIVE member redeeming 50 points with balance 5 returns ERR_INSUFFICIENT_POINTS (422) — isolates the fiscal check that loses to the state check in the §1.8 priority-conflict instance."
        test_recipe:
          setup: ["ACTIVE member with points_balance 5; a simple menu item."]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "poor@x.com", full_name: "Poor" }, as: Manager, captures: { m_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/point-adjustments", payload: { points_balance_delta: 5, lifetime_points_delta: 0 }, as: Manager }
            - { call: "POST /menu-items", payload: { name: "Batch", category: "BEVERAGE", base_price_cents: 400, required_equipment_type: "BATCH_BREW", size: "MEDIUM", origin_required: false }, as: Manager, captures: { batch_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders", payload: { member_id: "${m_id}", lines: [ { menu_item_id: "${batch_id}", quantity: 1, modifier_ids: [] } ], points_redeemed: 50 }, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_POINTS"

      - name: log_waste_exceeds_on_hand_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_INVALID_WASTE]"]
        distinguishing_aspect: "Logging 50g waste against a lot holding 10g returns ERR_INVALID_WASTE (422)."
        test_recipe:
          setup: ["A lot with 10g on hand."]
          setup_api_calls:
            - { call: "POST /bean-lots", payload: { origin: "ETHIOPIA", roast_level: "MEDIUM", received_grams: 10, par_grams: 0, price_per_gram_cents: 5 }, as: Manager, captures: { lot_id: "$.data.id" } }
          trigger:
            - { call: "POST /bean-lots/${lot_id}/log-waste", payload: { grams: 50, reason: "SPILL" }, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_WASTE"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: orders_list_pagination_envelope
        claim_type: listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /orders?member_id returns a paginated array envelope with total_count==2 and has_more==false after two orders."
        test_recipe:
          setup: ["A member with two simple orders."]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "list@x.com", full_name: "List" }, as: Manager, captures: { m_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Batch", category: "BEVERAGE", base_price_cents: 400, required_equipment_type: "BATCH_BREW", size: "MEDIUM", origin_required: false }, as: Manager, captures: { batch_id: "$.data.id" } }
            - { call: "POST /orders", payload: { member_id: "${m_id}", lines: [ { menu_item_id: "${batch_id}", quantity: 1, modifier_ids: [] } ] }, as: Manager }
            - { call: "POST /orders", payload: { member_id: "${m_id}", lines: [ { menu_item_id: "${batch_id}", quantity: 2, modifier_ids: [] } ] }, as: Manager }
          trigger:
            - { call: "GET /orders", payload: { member_id: "${m_id}" }, as: Manager }
          assert:
            - "response.meta.total_count == 2 (envelope pagination fields present: limit, offset, total_count, has_more)"
            - "response.data is an array of length 2"

      - name: maintenance_window_reverse_reachable_by_equipment
        claim_type: parent_relationships
        grounds: [entities.MaintenanceWindow.fields.equipment_id, endpoints]
        distinguishing_aspect: "GET /maintenance-windows?equipment_id returns the windows for that equipment (FK reverse-reachability)."
        test_recipe:
          setup: ["An equipment with one scheduled maintenance window."]
          setup_api_calls:
            - { call: "POST /equipment", payload: { name: "esp1", equipment_type: "ESPRESSO" }, as: Manager, captures: { esp_id: "$.data.id" } }
            - { call: "POST /maintenance-windows", payload: { equipment_id: "${esp_id}", start_at: "2026-03-07T10:00:00Z", end_at: "2026-03-07T11:00:00Z", kind: "CLEANING" }, as: Manager, captures: { mw_id: "$.data.id" } }
          trigger:
            - { call: "GET /maintenance-windows", payload: { equipment_id: "${esp_id}" }, as: Manager }
          assert:
            - "response.data is an array containing the window ${mw_id} with equipment_id == ${esp_id}"

  # ===========================================================================
  - section: RBAC
    instances:
      - name: customer_cannot_create_menu_item
        claim_type: unauthorized_operation
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Customer calling POST /menu-items (Manager-only) is denied with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A registered member acting as Customer."]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "cust@x.com", full_name: "Cust" }, as: Manager, captures: { m_id: "$.data.id" } }
          trigger:
            - { call: "POST /menu-items", payload: { name: "Hack", category: "BEVERAGE", base_price_cents: 100, required_equipment_type: "NONE" }, as: Customer, as_user_id: "${m_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "response.http_status == 403"

      - name: customer_cannot_fulfill_order
        claim_type: unauthorized_operation
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Customer calling POST /orders/{id}/fulfill (Barista/Manager-only) is denied with ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A member with a placed order for themselves."]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "c2@x.com", full_name: "C2" }, as: Manager, captures: { m_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Batch", category: "BEVERAGE", base_price_cents: 400, required_equipment_type: "BATCH_BREW", size: "MEDIUM", origin_required: false }, as: Manager, captures: { batch_id: "$.data.id" } }
            - { call: "POST /orders", payload: { member_id: "${m_id}", lines: [ { menu_item_id: "${batch_id}", quantity: 1, modifier_ids: [] } ] }, as: Customer, as_user_id: "${m_id}", captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/fulfill", payload: {}, as: Customer, as_user_id: "${m_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: customer_cannot_pay_other_members_order
        claim_type: unauthorized_operation
        grounds: [roles, "errors[ERR_NOT_OWNER]"]
        distinguishing_aspect: "Customer B paying an order owned by member A returns ERR_NOT_OWNER (403) — entity_backed ownership check on Order.member_id."
        test_recipe:
          setup: ["Members A and B; an order owned by A."]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "a2@x.com", full_name: "A2" }, as: Manager, captures: { a_id: "$.data.id" } }
            - { call: "POST /members", payload: { email: "b2@x.com", full_name: "B2" }, as: Manager, captures: { b_id: "$.data.id" } }
            - { call: "POST /menu-items", payload: { name: "Batch", category: "BEVERAGE", base_price_cents: 400, required_equipment_type: "BATCH_BREW", size: "MEDIUM", origin_required: false }, as: Manager, captures: { batch_id: "$.data.id" } }
            - { call: "POST /orders", payload: { member_id: "${a_id}", lines: [ { menu_item_id: "${batch_id}", quantity: 1, modifier_ids: [] } ] }, as: Customer, as_user_id: "${a_id}", captures: { ord_id: "$.data.id" } }
          trigger:
            - { call: "POST /orders/${ord_id}/pay", payload: {}, as: Customer, as_user_id: "${b_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_NOT_OWNER"

  # ===========================================================================
  - section: Cross-Cutting Complexity Layers
    instances:
      - name: subscription_create_stale_member_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[subscription-create-stale-member]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential subscription creates carrying the same (pre-supersede) expected_member_version: the first succeeds and bumps member.version; the second is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A member (version 1); a first subscription created (member.version -> 2)."]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "occ@x.com", full_name: "Occ" }, as: Manager, captures: { m_id: "$.data.id", m_v0: "$.data.version" } }
            - { call: "POST /subscriptions", payload: { member_id: "${m_id}", bean_origin: "ETHIOPIA", frequency: "MONTHLY", bags_per_cycle: 2, next_ship_at: "2026-04-01T00:00:00Z", expected_member_version: "${m_v0}" }, as: Manager, captures: { sub1_id: "$.data.id" } }
          trigger:
            - { call: "POST /subscriptions", payload: { member_id: "${m_id}", bean_origin: "ETHIOPIA", frequency: "WEEKLY", bags_per_cycle: 1, next_ship_at: "2026-04-08T00:00:00Z", expected_member_version: "${m_v0}" }, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "response.http_status == 412"

      - name: subscription_supersede_prior_active
        claim_type: derived_field_reconciliation
        grounds: [state_machines.Subscription.ACTIVE_to_SUPERSEDED, "concurrency_rules[subscription-create-stale-member]"]
        distinguishing_aspect: "Creating a second subscription with the fresh member version supersedes the prior ACTIVE one: sub1 -> SUPERSEDED, sub2 -> ACTIVE."
        test_recipe:
          setup: ["A member (version 1); a first ACTIVE subscription (member.version -> 2)."]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "sup2@x.com", full_name: "Sup2" }, as: Manager, captures: { m_id: "$.data.id", m_v0: "$.data.version" } }
            - { call: "POST /subscriptions", payload: { member_id: "${m_id}", bean_origin: "ETHIOPIA", frequency: "MONTHLY", bags_per_cycle: 2, next_ship_at: "2026-04-01T00:00:00Z", expected_member_version: "${m_v0}" }, as: Manager, captures: { sub1_id: "$.data.id" } }
            - { call: "GET /members/${m_id}", payload: {}, as: Manager, captures: { m_v1: "$.data.version" } }
          trigger:
            - { call: "POST /subscriptions", payload: { member_id: "${m_id}", bean_origin: "KENYA", frequency: "WEEKLY", bags_per_cycle: 1, next_ship_at: "2026-04-08T00:00:00Z", expected_member_version: "${m_v1}" }, as: Manager, captures: { sub2_id: "$.data.id" } }
          assert:
            - "Subscription.${sub1_id}.status == SUPERSEDED"
            - "Subscription.${sub2_id}.status == ACTIVE"

      - name: reconciliation_submit_count_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reconciliation-submit-count-stale]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two sequential submit-count calls carrying the same expected_reconciliation_version: the first succeeds and bumps version; the second is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A bean lot and an OPEN reconciliation (version 1); one count already submitted (version -> 2)."]
          setup_api_calls:
            - { call: "POST /bean-lots", payload: { origin: "PERU", roast_level: "LIGHT", received_grams: 400, par_grams: 50, price_per_gram_cents: 5 }, as: Manager, captures: { lot_id: "$.data.id" } }
            - { call: "POST /daily-reconciliations", payload: { business_date: "2026-03-08", bean_lot_id: "${lot_id}" }, as: Manager, captures: { recon_id: "$.data.id", recon_v0: "$.data.version" } }
            - { call: "POST /daily-reconciliations/${recon_id}/submit-count", payload: { counted_revenue_cents: 1000, counted_bean_on_hand_grams: 390, expected_reconciliation_version: "${recon_v0}" }, as: Manager }
          trigger:
            - { call: "POST /daily-reconciliations/${recon_id}/submit-count", payload: { counted_revenue_cents: 1100, counted_bean_on_hand_grams: 380, expected_reconciliation_version: "${recon_v0}" }, as: Manager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "response.http_status == 412"

