            - "One RevRecAssessment created and CLEARED before submit, so the MULTI_ELEMENT submit gate passes."
            - "The quote is submitted; the level-1 step is APPROVED, both terms are legally APPROVED (terms track CLEARED), and the level-2 step then answers REQUEST_CHANGES, leaving the quote CHANGES_REQUESTED with no PENDING step."
