          - state_machines.PerfusionDevice.IN_USE_to_NEEDS_SERVICE
          - endpoints[POST /bypass-cases/{id}/end-bypass]
          - entities.PerfusionDevice.fields.service_interval_hours
          - entities.PerfusionDevice.fields.runtime_hours_since_service
          - entities.DeviceEventLog.fields.event_code
        distinguishing_aspect: |
          end-bypass has a three-way conditional branch on the primary device, chosen by a condition
          that lives on a *different* entity than the trigger's target. With
          service_interval_hours == 2 and 120 pump minutes the runtime lands exactly on the interval,
          so the service-due branch is selected at the inclusive boundary and a SELF_TEST_FAIL event
          log is appended - yet the branch is strictly device-local: the case still reaches
          OFF_BYPASS, keeps its accrual and can still be closed. An implementation that routes the
          service-due branch through the critical-alarm cascade would wrongly strip the case.
        test_recipe:
          setup:
            - "LEAN BASE chain through start-bypass, except that d1 is created with service_interval_hours == 2, so 120 pump minutes will take runtime to exactly 2.0."
          setup_api_calls:
