    instances:
      - name: grant_approve_award_exact_cap_boundary
        grounds:
          - calculations.grant_award
          - errors[ERR_GRANT_CAPACITY_EXCEEDED]
          - endpoints."POST /ct/grant-applications/{id}/approve"
        distinguishing_aspect: |
          Money metric at approve: when requested_cents equals the share-term exactly
          (min() tie), the award equals that value with no error; one cent more of
          available-shoring is irrelevant because the min() tie is inclusive. Boundary:
          requested == floor(quoted*share) == 500000 succeeds and awards exactly 500000.
        test_recipe:
          setup:
            - "Program GP: appropriation 1000000, share 0.5, cap 100000/trainee, window 2026-06-30"
            - "Agreement PER_PARTICIPANT ON_SITE n=20 hours=10 -> quoted 1025000... adjusted: use n=20 ON_CAMPUS with venue hourly 0 -> quoted = 850000+150000+0 = 1000000 so floor(quoted*0.5) == 500000 == requested"
