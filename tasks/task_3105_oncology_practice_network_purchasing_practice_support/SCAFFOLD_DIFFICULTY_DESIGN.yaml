  - rule_id: transitive_cascade
    instances:
      - name: epoch_advance_to_departure_to_holdback_chain
        grounds:
          - state_machines.OncologyNetwork.ACTIVE_to_ACTIVE
          - state_machines.Practice.AFFILIATED_to_DEPARTING
          - state_machines.Practice.DEPARTING_to_DEPARTED
          - state_machines.AffiliationContract.DEPARTURE_NOTICE_to_UNWIND_IN_PROGRESS
          - entities.RebateQualification.fields.holdback_cents
        distinguishing_aspect: "Depth-3 chain: one advance-epoch call moves the network epoch, which reaches the practice's departure_effective_epoch_index and flips it to DEPARTED, which alone flips its affiliation contract to UNWIND_IN_PROGRESS — the contract hop is caused by the practice hop, never by the epoch call directly."
        test_recipe:
          setup:
            - "Practice P affiliated with an ACTIVE contract carrying notice_period_days 30 and an ACTIVE agreement, plus one PENDING rebate qualification for epoch 0, so the departure notice withholds dollars. Logical clock 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *d_clock
            - *d_net
            - call: "POST /networks/${n_id}/practices"
              payload: { practice_name: "Red River Cancer Care", practice_npi: "7890123499", state_code: "ND", drug_shortage_baseline_units: 100, pathway_steering_target_pct: 0.75, denial_ratio_threshold_pct: 0.20 }
              as: NetworkAdmin
              captures: { p_id: $.data.id, p_v: $.data.version }
            - *d_con
            - call: "POST /networks/affiliation-contracts/${c_id}/activate"
              payload: {}
              as: NetworkAdmin
            - *d_ag
            - call: "POST /networks/pricing-agreements/${ag_id}/submit"
              payload: { expected_practice_version: "${p_v}" }
              as: PracticeAdmin
              as_user_id: "pa-redriver"
            - call: "POST /networks/pricing-agreements/${ag_id}/approve"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/practices/${p_id}/affiliate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /networks/${n_id}/rebate-programs"
              payload: { program_name: "Baseline FY26", drug_ndc_scope: "ALL", market_share_threshold_pct: 0.00, rebate_pct: 0.02, compliance_min_score: 0.00, period_epoch_index: 0, weight_reporting_compliance: 1, weight_adherence_steering: 1, weight_transparency: 1 }
              as: NetworkAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /networks/rebate-programs/${prog_id}/activate"
              payload: {}
              as: NetworkAdmin
