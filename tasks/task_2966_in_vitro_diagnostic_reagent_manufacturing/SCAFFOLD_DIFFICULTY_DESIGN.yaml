          assert:
            - "each of the three TestResult rows has bias_pct == 1.00 (abs(101.004 - 100.0) / 100.0 * 100 == 1.004, rounded half-up to 2dp)"
            - "ReagentLot.release_bias_max_pct == 1.00"
            - "ReagentLot.release_bias_sum_pct == 3.00 exactly — NOT 3.01, which is what summing the unrounded 1.004 values and rounding once would produce"
