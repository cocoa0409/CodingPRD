      - name: validation_p15_enrollment_requires_a_verified_merchant
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=15]
          - errors[ERR_MERCHANT_NOT_VERIFIED]
        excluded_because:
          difficulty_instance: cross_entity_enrollment_blocked_until_merchant_mcc_status_becomes_verified
          rationale: "The §1.8 instance drives the same enrollment call before and after verification, asserting the 409 in the unverified state and success afterwards, which is exactly the valid/invalid pair this cross-entity claim asks for."

      - name: validation_p16_finalize_requires_a_compliant_acquirer
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=16]
          - errors[ERR_ACQUIRER_NON_COMPLIANT]
        excluded_because:
          difficulty_instance: cross_entity_batch_finalize_blocked_by_acquirer_compliance_status_from_missed_window
          rationale: "The §1.8 instance pushes the acquirer to NON_COMPLIANT via a swept missed window, shows finalize failing 409, then restores compliance and shows finalize succeeding — both halves of the cross-entity claim."

      - name: validation_p9_closed_program_blocks_enrollment_unless_waitlisted
        claim_type: conditional_validation
        grounds:
          - validations[priority=9]
          - errors[ERR_ENROLLMENT_CLOSED]
        excluded_because:
          difficulty_instance: priority_conflict_enrollment_closed_state_beats_incentive_capacity_fiscal
          rationale: "The §1.8 priority-conflict instance exercises the CLOSED_FULL programme both with and without waitlist_requested, so the conditional behaviour of P9 is already pinned there."

      - name: validation_p33_commitment_beyond_uncommitted_capacity
        claim_type: aggregate_validation
        grounds:
          - validations[priority=33]
          - errors[ERR_INCENTIVE_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: priority_conflict_enrollment_closed_state_beats_incentive_capacity_fiscal
          rationale: "The §1.8 instance builds a programme whose individual enrollments are each valid but collectively exhaust the pool, and asserts that P9's state error outranks P33's fiscal error, covering the aggregate claim and its priority interaction."

      - name: validation_priority_conflict_safety_rule_outranks_referential_rule
        claim_type: priority_conflict
        grounds:
          - validations[priority=13]
          - validations[priority=25]
        excluded_because:
          difficulty_instance: priority_conflict_merchant_misrepresented_safety_beats_mcc_not_defined_referential
          rationale: "The §1.8 instance constructs a request that simultaneously violates P13 and P25 and asserts that ERR_MERCHANT_MISREPRESENTED is returned, which is precisely this priority-conflict claim."

      - name: validation_p20_window_must_sit_inside_the_publication_envelope
        claim_type: temporal_validation
        grounds:
          - validations[priority=20]
          - errors[ERR_IMPLEMENTATION_WINDOW_OUT_OF_BOUNDS]
          - calculations.implementation_window_bounds_check
        excluded_because:
          difficulty_instance: temporal_overlap_platform_windows_closed_interval_with_symmetric_buffer_and_capacity
          rationale: "The §1.8 instance includes a candidate window that breaches the published_at/implementation_deadline envelope and asserts that P20's 422 is returned in preference to P22's 409, covering the bounds claim."

      - name: validation_p22_platform_concurrency_limit_on_implementation_windows
        claim_type: aggregate_validation
        grounds:
          - validations[priority=22]
          - errors[ERR_PLATFORM_WINDOW_CONFLICT]
          - calculations.platform_window_overlap_check
        excluded_because:
          difficulty_instance: temporal_overlap_platform_windows_closed_interval_with_symmetric_buffer_and_capacity
          rationale: "The §1.8 instance walks four candidate windows against a max_concurrent_windows of 1 with a symmetric blackout buffer, asserting exactly which candidates conflict, which subsumes the aggregate claim."

      - name: validation_p21_published_versions_may_not_overlap
        claim_type: temporal_validation
        grounds:
          - validations[priority=21]
          - errors[ERR_RATE_VERSION_WINDOW_OVERLAP]
          - calculations.rate_version_window_overlap_check
        excluded_because:
          difficulty_instance: temporal_overlap_rate_version_half_open_adjacency_legal_intrusion_rejected
          rationale: "The §1.8 instance publishes adjacent half-open ranges successfully and rejects an intruding range with ERR_RATE_VERSION_WINDOW_OVERLAP, so the temporal claim is fully covered."

      - name: validation_p24_information_requests_are_bounded_by_the_review_round_limit
        claim_type: violation_to_error
        grounds:
          - validations[priority=24]
          - errors[ERR_REVIEW_ROUND_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: cyclic_reclassification_review_loop_terminates_at_max_review_rounds
          rationale: "The §1.8 instance loops review/request-info/resubmit until review_round reaches MAX_REVIEW_ROUNDS and asserts the 422 on the next information request, covering this rule."

      - name: validation_cascading_check_order_state_precondition_runs_before_the_ledger_math
        claim_type: cascading_validation
        grounds:
          - validations[priority=7]
          - validations[priority=28]
          - errors[ERR_INVALID_STATE]
        excluded_because:
          difficulty_instance: cascade_batch_finalize_to_downgrade_counter_to_auto_audit_to_reclassification_suspension
          rationale: "The §1.8 cascade instance asserts that finalize refuses an OPEN batch with ERR_INVALID_STATE before any assessment or counter update runs, and that the whole downstream chain only fires on the legal path — the ordering claim this row asks for."

