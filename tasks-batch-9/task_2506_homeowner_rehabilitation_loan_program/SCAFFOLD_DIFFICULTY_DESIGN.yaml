# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Task: 2506 Homeowner Rehabilitation Loan Program
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. All numeric asserts
# were executed against the §1.3 formulas and their constants before being
# written here as literals.
#
# Shared fixture conventions used by every recipe:
#   * logical clock starts at its mandatory default 2026-08-01T00:00:00Z
#   * ProgramYear 2026: ami 9,000,000 / max loan 7,500,000 / allocation 50,000,000
#   * opaque operator ids: is-1 (IntakeSpecialist), rs-1 / rs-2 (RehabSpecialist),
#     insp-1 / insp-2 (Inspector), lo-1 (LoanOfficer), pm-1 (ProgramManager)
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: part5_vs_irs1040_income_certification_diverges_across_the_eligibility_band
        grounds:
          - calculations.applicant_annual_income_and_category
          - entities.Applicant.fields.income_calc_method
          - entities.Applicant.fields.ami_percent
          - entities.Applicant.fields.income_category
          - entities.Applicant.fields.eligibility_status
          - state_machines.Applicant.APPLIED_to_INCOME_VERIFIED
          - state_machines.Applicant.APPLIED_to_INELIGIBLE
        distinguishing_aspect: |
          This instance's dual variant lives on the Applicant entity domain (household income
          certification): with byte-identical household inputs, the PART_5_ANNUAL variant imputes
          asset income at the passbook rate and ignores deductions, producing ami_percent 80.3 and
          eligibility_status INELIGIBLE, while the IRS_1040_ADJUSTED variant drops the imputation
          and subtracts the dependent deduction, producing ami_percent 78.9 and INCOME_VERIFIED —
          the two variants land on opposite sides of the 80.0 eligibility band.
        test_recipe:
          setup:
            - "one ProgramYear 2026 with ami_median_income_cents 9,000,000 (household-size-4 adjustment 1.00, so income_limit_cents is 9,000,000)"
            - "two Applicant rows carrying identical household economics: household_size 4, dependents_count 1, elderly_household false, wage_income_cents 7,150,000, benefit_income_cents 0, actual_asset_income_cents 0, household_assets_cents 20,000,000"
            - "the only difference between the two rows is income_calc_method: PART_5_ANNUAL versus IRS_1040_ADJUSTED"
            - "both applicants are still in eligibility_status APPLIED"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Ramona Vela", email: "ramona@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7150000, benefit_income_cents: 0, actual_asset_income_cents: 0, household_assets_cents: 20000000, dependents_count: 1, elderly_household: false }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { app_part5_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Ramona Vela", email: "ramona.irs@example.org", household_size: 4, income_calc_method: "IRS_1040_ADJUSTED", wage_income_cents: 7150000, benefit_income_cents: 0, actual_asset_income_cents: 0, household_assets_cents: 20000000, dependents_count: 1, elderly_household: false }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { app_irs_id: $.data.id }
          trigger:
            - call: "POST /rehab/applicants/${app_part5_id}/verify-income"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/applicants/${app_irs_id}/verify-income"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
          assert:
            - "Applicant.${app_part5_id}.income_limit_cents == 9000000"
            - "Applicant.${app_part5_id}.annual_income_cents == 7230000"
            - "Applicant.${app_part5_id}.ami_percent == 80.3"
            - "Applicant.${app_part5_id}.income_category == OVER_INCOME"
            - "Applicant.${app_part5_id}.eligibility_status == INELIGIBLE"
            - "Applicant.${app_irs_id}.annual_income_cents == 7102000"
            - "Applicant.${app_irs_id}.ami_percent == 78.9"
            - "Applicant.${app_irs_id}.income_category == LOW"
            - "Applicant.${app_irs_id}.eligibility_status == INCOME_VERIFIED"
            - "Applicant.${app_part5_id}.annual_income_cents - Applicant.${app_irs_id}.annual_income_cents == 128000"
            - "both rows have verified_by_user_id == is-1"

      - name: sale_vs_transfer_recapture_variants_on_identical_forgivable_loans
        grounds:
          - calculations.recapture_amount
          - entities.RehabLoan.fields.recapture_event_type
          - entities.RehabLoan.fields.net_proceeds_cents
          - entities.RehabLoan.fields.recapture_amount_cents
          - entities.RehabLoan.fields.shortfall_forgiven_cents
          - entities.RehabLoan.fields.program_income_posted_cents
          - state_machines.RehabLoan.SERVICING_to_RECAPTURED
          - entities.ProgramYear.fields.program_income_balance_cents
        distinguishing_aspect: |
          This instance's dual variant lives on the RehabLoan entity domain (money recovered on
          conveyance), not on Applicant income: two loans with identical principal 3,025,000,
          identical 60-month forgiveness term and identical 24 elapsed months recapture different
          amounts solely because SALE caps recovery at net proceeds (600,000, leaving
          shortfall_forgiven_cents 1,215,000) while TRANSFER recovers the whole unforgiven balance
          (1,815,000, shortfall 0).
        test_recipe:
          setup:
            - "two RehabApplication rows for the same household, both year_built 1995 and historic_district false so compliance_posture is CLEAR, both with senior_lien_balance_cents 12,000,000"
            - "each application carries an approved write-up with a single 2,800,000 HEALTH_SAFETY line (total_estimate_cents 3,080,000) and an awarded bid of 3,000,000 from its own contractor"
            - "each loan is FORGIVABLE with forgiveness_term_months 60, lien_recording_fee_cents 25,000 and principal_cents 3,025,000"
            - "each loan was fully disbursed by one final draw of 3,000,000 and closed out on 2026-10-30, so both are SERVICING with forgiveness_start_date 2026-10-30, disbursed_cents 3,025,000, retainage_held_cents 0 and principal_repaid_cents 0"
            - "the logical clock has been advanced to 2028-10-30T00:00:00Z, exactly 24 whole months after forgiveness started"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/contractors"
