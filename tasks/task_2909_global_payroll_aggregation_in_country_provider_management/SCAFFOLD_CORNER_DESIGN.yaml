# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Global Payroll Aggregation & In-Country Provider Management
#
# Breadth walk of references/claim-extraction-guide.md against SCAFFOLD.yaml
# §1.1-§1.7. `section:` and `claim_type:` values come from that guide only.
# Corners already asserted by a §1.8 instance are emitted as excluded_because
# stubs naming that instance. The logical clock starts at 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: country_profile_creation_returns_every_declared_field
        claim_type: creation
        grounds:
          - entities.CountryProfile
          - endpoints.POST_payroll_country_profiles
        distinguishing_aspect: "A country profile created with all required fields returns 201 with every input field echoed, open_filing_obligation_count seeded to 0 and version 1."
        test_recipe:
          setup:
            - "empty database, logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING", "SOCIAL_INSURANCE"], local_holidays: ["2026-09-25"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_de: "$.data.id" }
          assert:
            - "HTTP 201"
            - "CountryProfile.${cp_de}.country_code == DE and local_currency == EUR and data_residency_region == EU"
            - "CountryProfile.${cp_de}.statutory_filing_deadline_days == 10"
            - "CountryProfile.${cp_de}.materiality_pct == 5.00 and materiality_floor_minor == 100000"
            - "CountryProfile.${cp_de}.penalty_daily_rate_minor == 15000"
            - "CountryProfile.${cp_de}.required_filing_types == [INCOME_TAX_WITHHOLDING, SOCIAL_INSURANCE]"
            - "CountryProfile.${cp_de}.local_holidays == [2026-09-25]"
            - "CountryProfile.${cp_de}.open_filing_obligation_count == 0"
            - "CountryProfile.${cp_de}.version == 1 and id is a UUID with no type prefix"

      - name: provider_read_returns_the_stored_entity
        claim_type: retrieval
        grounds:
          - entities.Provider
          - endpoints.GET_payroll_providers_id
        distinguishing_aspect: "A GET by id returns the provider exactly as stored, including the computed statutory_filing_capable flag and the seeded score fields."
        test_recipe:
          setup:
            - "one Provider registered with STATUTORY_FILING in scope"
          setup_api_calls:
            - call: "POST /payroll/providers"
              payload: { legal_name: "EuroPay GmbH", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING", "PAYMENT_DISBURSEMENT"], data_residency_regions: ["EU"], annual_fee_minor: 6000000, indemnity_cap_pct: 25.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p1: "$.data.id" }
          trigger:
            - call: "GET /payroll/providers/${prov_p1}"
              payload: {}
              as: GlobalPayrollOps
              as_user_id: "ops-01"
          assert:
            - "HTTP 200"
            - "Provider.${prov_p1}.legal_name == EuroPay GmbH"
            - "Provider.${prov_p1}.statutory_filing_capable == true"
            - "Provider.${prov_p1}.status == ACTIVE"
            - "Provider.${prov_p1}.service_score == 100.00"
            - "Provider.${prov_p1}.score_variant_applied == ENGAGEMENT_TO_DATE"
            - "Provider.${prov_p1}.open_penalty_minor == 0"

      - name: engagement_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_payroll_engagements
          - response_envelope
        distinguishing_aspect: "With three engagements stored, limit 2 offset 0 returns exactly 2 items with total_count 3 and has_more true."
        test_recipe:
          setup:
            - "three CountryProfiles (DE, FR, IT) and one Provider whose data_residency_regions contains EU"
            - "three DRAFT Engagements, one per country, all with the same provider (the uniqueness rule is per country and provider pair)"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_de: "$.data.id" }
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "FR", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_fr: "$.data.id" }
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "IT", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_it: "$.data.id" }
            - call: "POST /payroll/providers"
              payload: { legal_name: "EuroPay GmbH", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], data_residency_regions: ["EU"], annual_fee_minor: 6000000, indemnity_cap_pct: 25.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p1: "$.data.id" }
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_de}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET"], filing_responsibility: "CLIENT", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_fr}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET"], filing_responsibility: "CLIENT", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_it}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET"], filing_responsibility: "CLIENT", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "GET /payroll/engagements"
              payload: { limit: 2, offset: 0 }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
          assert:
            - "HTTP 200"
            - "the envelope carries total_count 3 and has_more true"
            - "exactly 2 Engagement rows are returned"
            - "a follow-up GET /payroll/engagements with limit 2 and offset 2 returns 1 row with has_more false"
            - "every returned Engagement has status DRAFT"

      - name: provider_read_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_PROVIDER_NOT_FOUND
          - endpoints.GET_payroll_providers_id
        distinguishing_aspect: "A syntactically valid UUID that names no provider returns 404 ERR_PROVIDER_NOT_FOUND rather than 200 with an empty body."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /payroll/providers/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: GlobalPayrollOps
              as_user_id: "ops-01"
          assert:
            - "HTTP 404 with error_id ERR_PROVIDER_NOT_FOUND"
            - "the envelope carries data null and a non-empty message"

      - name: country_profile_missing_required_materiality_pct_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.CountryProfile.fields.materiality_pct
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required materiality_pct field is rejected with ERR_INVALID_REQUEST (422) and nothing is persisted."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
          assert:
            - "HTTP 422 with error_id ERR_INVALID_REQUEST"
            - "no CountryProfile exists afterwards, so a subsequent create with country_code DE succeeds with 201"

      - name: cycle_optional_prior_cycle_id_defaults_to_null
        claim_type: defaults
        grounds:
          - entities.PayrollCycle.fields.prior_cycle_id
          - entities.PayrollCycle.fields.status
          - entities.PayrollCycle.fields.hold_reason
        distinguishing_aspect: "Creating a first cycle without prior_cycle_id leaves it null and applies the declared defaults status DRAFT, hold_reason null, gross_total_minor 0 and funded_total_minor 0."
        test_recipe:
          setup:
            - "CountryProfile DE, Provider EuroPay GmbH, ACTIVE Engagement for DE"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_de: "$.data.id" }
            - call: "POST /payroll/providers"
              payload: { legal_name: "EuroPay GmbH", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], data_residency_regions: ["EU"], annual_fee_minor: 6000000, indemnity_cap_pct: 25.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p1: "$.data.id" }
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_de}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], filing_responsibility: "PROVIDER", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { eng_de: "$.data.id" }
            - call: "POST /payroll/engagements/${eng_de}/residency-decision"
              payload: { decision: "APPROVE", residency_terms_ref: "DPA-DE-2026-01" }
              as: ComplianceAuditor
              as_user_id: "audit-01"
          trigger:
            - call: "POST /payroll/cycles"
              payload: { engagement_id: "${eng_de}", period_label: "2026-08", period_start_date: "2026-08-01", period_end_date: "2026-09-01", pay_date: "2026-08-31", cutoff_lead_working_days: 3 }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c1: "$.data.id" }
          assert:
            - "HTTP 201"
            - "PayrollCycle.${c1}.prior_cycle_id is null"
            - "PayrollCycle.${c1}.status == DRAFT and hold_reason is null"
            - "PayrollCycle.${c1}.gross_total_minor == 0 and funded_total_minor == 0"
            - "PayrollCycle.${c1}.filings_confirmed_count == 0"
            - "PayrollCycle.${c1}.input_submitter_user_id is null"

      - name: provider_statutory_filing_capable_is_derived_from_service_scope
        claim_type: computed_fields
        grounds:
          - entities.Provider.fields.statutory_filing_capable
          - entities.Provider.fields.service_scope
        distinguishing_aspect: "statutory_filing_capable is computed as exactly the presence of STATUTORY_FILING in service_scope: a provider registered without it reads false while an otherwise identical provider with it reads true."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "POST /payroll/providers"
              payload: { legal_name: "CalcOnly BV", service_scope: ["GROSS_TO_NET"], data_residency_regions: ["EU"], annual_fee_minor: 1000000, indemnity_cap_pct: 20.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_calc: "$.data.id" }
          trigger:
            - call: "POST /payroll/providers"
              payload: { legal_name: "FullService BV", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], data_residency_regions: ["EU"], annual_fee_minor: 1000000, indemnity_cap_pct: 20.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_full: "$.data.id" }
          assert:
            - "Provider.${prov_calc}.statutory_filing_capable == false"
            - "Provider.${prov_full}.statutory_filing_capable == true"
            - "both providers have status ACTIVE and service_score 100.00"

      - name: input_file_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.InputFile.fields.submitted_at
          - entities.InputFile.fields.status
          - entities.InputFile.fields.validated_record_count
        distinguishing_aspect: "id, created_at, version and submitted_at are minted by the server: submitted_at equals the logical clock instant 2026-08-05T09:30:00.000Z, status defaults to RECEIVED and validated_record_count starts at 0."
        test_recipe:
          setup:
            - "CountryProfile DE, Provider EuroPay GmbH, ACTIVE Engagement for DE"
            - "PayrollCycle 2026-08 in DRAFT with input_cutoff_at 2026-08-26T17:00:00.000Z"
            - "logical clock moved to 2026-08-05T09:30:00Z, comfortably before the cutoff"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_de: "$.data.id" }
            - call: "POST /payroll/providers"
              payload: { legal_name: "EuroPay GmbH", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], data_residency_regions: ["EU"], annual_fee_minor: 6000000, indemnity_cap_pct: 25.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p1: "$.data.id" }
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_de}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], filing_responsibility: "PROVIDER", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { eng_de: "$.data.id" }
            - call: "POST /payroll/engagements/${eng_de}/residency-decision"
              payload: { decision: "APPROVE", residency_terms_ref: "DPA-DE-2026-01" }
              as: ComplianceAuditor
              as_user_id: "audit-01"
            - call: "POST /payroll/cycles"
              payload: { engagement_id: "${eng_de}", period_label: "2026-08", period_start_date: "2026-08-01", period_end_date: "2026-09-01", pay_date: "2026-08-31", cutoff_lead_working_days: 3 }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:30:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /payroll/input-files"
              payload: { cycle_id: "${c1}", source_system: "HRIS_CORE", record_count: 200, gross_declared_minor: 10000000, country_elements: { tax_id: "DE-TAX-100", social_insurance_no: "DE-SI-100", iban: "DE89370400440532013000" }, residency_region_of_transfer: "EU" }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { if1: "$.data.id" }
          assert:
            - "HTTP 201"
            - "InputFile.${if1}.id is a server-minted UUID with no type prefix"
            - "InputFile.${if1}.version == 1"
            - "InputFile.${if1}.submitted_at == 2026-08-05T09:30:00.000Z"
            - "InputFile.${if1}.status == RECEIVED and rejection_code is null"
            - "InputFile.${if1}.validated_record_count == 0"
            - "PayrollCycle.${c1}.input_submitter_user_id == ops-01"

      - name: engagement_pay_frequency_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.Engagement.fields.pay_frequency
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "pay_frequency accepts only WEEKLY, BIWEEKLY, SEMI_MONTHLY and MONTHLY: the value FORTNIGHTLY is rejected with ERR_INVALID_REQUEST (422) before any residency or scope check runs."
        test_recipe:
          setup:
            - "CountryProfile DE and Provider EuroPay GmbH, both consistent with an EU engagement"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_de: "$.data.id" }
            - call: "POST /payroll/providers"
              payload: { legal_name: "EuroPay GmbH", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], data_residency_regions: ["EU"], annual_fee_minor: 6000000, indemnity_cap_pct: 25.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p1: "$.data.id" }
          trigger:
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_de}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET"], filing_responsibility: "CLIENT", data_residency_region: "EU", pay_frequency: "FORTNIGHTLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
          assert:
            - "HTTP 422 with error_id ERR_INVALID_REQUEST"
            - "GET /payroll/engagements returns total_count 0"

      - name: audit_evidence_item_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.AuditEvidenceItem
          - entities.AuditEvidenceItem.fields.sequence_no
          - endpoints.POST_payroll_audit_evidence
        distinguishing_aspect: "AuditEvidenceItem is declared common_fields false: the created item exposes id and created_at with no version and no updated_at, §1.5 offers no update or delete endpoint for it, and sequence_no is 1 for the first item of the cycle."
        test_recipe:
          setup:
            - "CountryProfile DE, Provider EuroPay GmbH, ACTIVE Engagement for DE"
            - "PayrollCycle 2026-08 in DRAFT, which is neither CLOSED nor CANCELLED"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_de: "$.data.id" }
            - call: "POST /payroll/providers"
              payload: { legal_name: "EuroPay GmbH", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], data_residency_regions: ["EU"], annual_fee_minor: 6000000, indemnity_cap_pct: 25.00 }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { prov_p1: "$.data.id" }
            - call: "POST /payroll/engagements"
              payload: { country_profile_id: "${cp_de}", provider_id: "${prov_p1}", service_scope: ["GROSS_TO_NET", "STATUTORY_FILING"], filing_responsibility: "PROVIDER", data_residency_region: "EU", pay_frequency: "MONTHLY" }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { eng_de: "$.data.id" }
            - call: "POST /payroll/engagements/${eng_de}/residency-decision"
              payload: { decision: "APPROVE", residency_terms_ref: "DPA-DE-2026-01" }
              as: ComplianceAuditor
              as_user_id: "audit-01"
            - call: "POST /payroll/cycles"
              payload: { engagement_id: "${eng_de}", period_label: "2026-08", period_start_date: "2026-08-01", period_end_date: "2026-09-01", pay_date: "2026-08-31", cutoff_lead_working_days: 3 }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
              captures: { c1: "$.data.id" }
          trigger:
            - call: "POST /payroll/audit-evidence"
              payload: { cycle_id: "${c1}", control_ref: "CTRL_RESIDENCY_ATTESTATION", evidence_type: "DOCUMENT_HASH", payload_hash: "9f2c4ba7d1e05c38" }
              as: ComplianceAuditor
              as_user_id: "audit-01"
              captures: { ev1: "$.data.id" }
          assert:
            - "HTTP 201"
            - "AuditEvidenceItem.${ev1} exposes id and created_at and carries no version field and no updated_at field"
            - "AuditEvidenceItem.${ev1}.sequence_no == 1"
            - "AuditEvidenceItem.${ev1}.recorded_by_role == ComplianceAuditor and recorded_by_user_id == audit-01"
            - "GET /payroll/cycles/${c1}/audit-evidence returns total_count 1"

      - name: cycle_creation_with_unknown_engagement_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.PayrollCycle.fields.engagement_id
          - errors.ERR_ENGAGEMENT_NOT_FOUND
        distinguishing_aspect: "The engagement_id foreign key is resolved before any period arithmetic: an unknown parent id returns 404 ERR_ENGAGEMENT_NOT_FOUND, not a 422 about the period."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /payroll/cycles"
              payload: { engagement_id: "22222222-2222-4222-8222-222222222222", period_label: "2026-08", period_start_date: "2026-08-01", period_end_date: "2026-09-01", pay_date: "2026-08-31", cutoff_lead_working_days: 3 }
              as: GlobalPayrollOps
              as_user_id: "ops-01"
          assert:
            - "HTTP 404 with error_id ERR_ENGAGEMENT_NOT_FOUND"
            - "GET /payroll/cycles returns total_count 0"

      - name: funding_instruction_naming_another_engagements_account_is_rejected
        claim_type: parent_relationships
        grounds:
          - validations.funding-bank-account-coherence
          - errors.ERR_BANK_ACCOUNT_ENGAGEMENT_MISMATCH
        distinguishing_aspect: "Flat topology cross-reference integrity: both the cycle and the bank account exist, but they hang off different engagements, so the instruction is rejected with ERR_BANK_ACCOUNT_ENGAGEMENT_MISMATCH (422)."
        test_recipe:
          setup:
            - "two CountryProfiles DE and FR, one Provider, and one ACTIVE Engagement per country"
            - "PayrollCycle 2026-08 of the DE engagement driven to RESULTS_APPROVED"
            - "a VERIFIED LocalBankAccount that belongs to the FR engagement"
          setup_api_calls:
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "DE", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_de: "$.data.id" }
            - call: "POST /payroll/country-profiles"
              payload: { country_code: "FR", local_currency: "EUR", data_residency_region: "EU", statutory_filing_deadline_days: 10, materiality_pct: 5.00, materiality_floor_minor: 100000, penalty_daily_rate_minor: 15000, required_filing_types: ["INCOME_TAX_WITHHOLDING"] }
              as: PlatformAdmin
              as_user_id: "admin-01"
              captures: { cp_fr: "$.data.id" }
