          - state_machines.SeasonProgram.OPEN_to_POSTSEASON_LOCKED
        distinguishing_aspect: "The lock refuses to run while any game of the program is IN_PROGRESS, so no FINAL accuracy recompute or retention decision happens and the program stays OPEN at its previous version."
        test_recipe:
          setup:
            - "SeasonProgram 2026 is OPEN with crew_size_required 1."
