  - section: validations
    instances:
      - name: tax_profile_country_must_equal_creator_country
        claim_type: violation_to_error
        grounds:
          - "validations[priority 52]"
          - "errors[ERR_TAX_COUNTRY_MISMATCH]"
        distinguishing_aspect: "Priority 52 compares the submitted country_code against Creator.country_code before the form/country rule at 53, so a US creator filing a W8BEN for GB is rejected with ERR_TAX_COUNTRY_MISMATCH and not ERR_TAX_FORM_COUNTRY_INVALID."
        test_recipe:
          setup: ["One creator registered with country_code US."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id", cr_v1: "$.data.version" }
          trigger:
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr}", form_type: "W8BEN", country_code: "GB", tin_provided: false, treaty_claimed: false, expected_creator_version: "${cr_v1}" }
              as: Creator
              as_user_id: "${cr}"
          assert:
            - "HTTP status == 422"
            - "error.error_id == 'ERR_TAX_COUNTRY_MISMATCH'"
            - "Creator.${cr}.version == ${cr_v1}"
            - "GET /monetization/tax-profiles?creator_id=${cr}: total_count == 0"

      - name: w9_form_requires_a_us_country_code
        claim_type: violation_to_error
        grounds:
          - "validations[priority 53]"
          - "errors[ERR_TAX_FORM_COUNTRY_INVALID]"
        distinguishing_aspect: "A GB creator filing a W9 with the matching country_code GB clears priority 52 and is stopped by 53, proving the form/country pairing is checked independently of the creator match."
        test_recipe:
          setup: ["One creator registered with country_code GB."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Bea Bytes", country_code: "GB", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id", cr_v1: "$.data.version" }
          trigger:
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr}", form_type: "W9", country_code: "GB", tin_provided: true, treaty_claimed: false, expected_creator_version: "${cr_v1}" }
              as: Creator
              as_user_id: "${cr}"
          assert:
            - "HTTP status == 422"
            - "error.error_id == 'ERR_TAX_FORM_COUNTRY_INVALID'"
            - "GET /monetization/tax-profiles?creator_id=${cr}: total_count == 0"

      - name: treaty_claim_without_a_rate_is_rejected
        claim_type: conditional_validation
        grounds:
          - "validations[priority 54]"
          - "errors[ERR_TREATY_RATE_REQUIRED]"
        distinguishing_aspect: "treaty_rate_bps is optional in the endpoint's input list, so its absence is not a missing-required-field error at priority 6; it only becomes mandatory at priority 54 once treaty_claimed is true."
        test_recipe:
          setup: ["One creator registered with country_code GB."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Bea Bytes", country_code: "GB", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id", cr_v1: "$.data.version" }
          trigger:
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr}", form_type: "W8BEN", country_code: "GB", tin_provided: false, treaty_claimed: true, expected_creator_version: "${cr_v1}" }
              as: Creator
              as_user_id: "${cr}"
          assert:
            - "HTTP status == 422"
            - "error.error_id == 'ERR_TREATY_RATE_REQUIRED'"
            - "GET /monetization/tax-profiles?creator_id=${cr}: total_count == 0"

      - name: treaty_rate_supplied_without_a_claim_is_rejected
        claim_type: conditional_validation
        grounds:
          - "validations[priority 55]"
          - "errors[ERR_TREATY_RATE_FORBIDDEN]"
        distinguishing_aspect: "The same optional field flips polarity: with treaty_claimed false a non-null treaty_rate_bps of 1000 is itself the violation, so the pair of rules 54/55 forces exactly one consistent shape."
        test_recipe:
          setup: ["One creator registered with country_code GB."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Bea Bytes", country_code: "GB", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id", cr_v1: "$.data.version" }
          trigger:
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr}", form_type: "W8BEN", country_code: "GB", tin_provided: false, treaty_claimed: false, treaty_rate_bps: 1000, expected_creator_version: "${cr_v1}" }
              as: Creator
              as_user_id: "${cr}"
          assert:
            - "HTTP status == 422"
            - "error.error_id == 'ERR_TREATY_RATE_FORBIDDEN'"
            - "GET /monetization/tax-profiles?creator_id=${cr}: total_count == 0"

      - name: verify_with_reject_decision_requires_a_rejection_reason
        claim_type: conditional_validation
        grounds:
          - "validations[priority 57]"
          - "errors[ERR_REJECTION_REASON_REQUIRED]"
        distinguishing_aspect: "A REJECT decision with no rejection_reason is a 422 and leaves the profile SUBMITTED, so the state transition is not applied before the conditional field check."
        test_recipe:
          setup: ["One creator with a SUBMITTED W9 tax profile."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id", cr_v1: "$.data.version" }
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr}", form_type: "W9", country_code: "US", tin_provided: true, treaty_claimed: false, expected_creator_version: "${cr_v1}" }
              as: Creator
              as_user_id: "${cr}"
              captures: { tp: "$.data.id" }
            - call: "POST /monetization/tax-profiles/${tp}/submit"
              payload: {}
              as: Creator
              as_user_id: "${cr}"
          trigger:
            - call: "POST /monetization/tax-profiles/${tp}/verify"
              payload: { decision: "REJECT" }
              as: FinanceOperator
          assert:
            - "HTTP status == 422"
            - "error.error_id == 'ERR_REJECTION_REASON_REQUIRED'"
            - "TaxProfile.${tp}.status == 'SUBMITTED'"
            - "TaxProfile.${tp}.rejection_reason == null"

      - name: verify_with_verify_decision_forbids_a_rejection_reason
        claim_type: conditional_validation
        grounds:
          - "validations[priority 58]"
          - "errors[ERR_REJECTION_REASON_FORBIDDEN]"
        distinguishing_aspect: "Supplying a rejection_reason alongside decision VERIFY is rejected at 58 rather than silently ignored, and verified_at stays null."
        test_recipe:
          setup: ["One creator with a SUBMITTED W9 tax profile."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id", cr_v1: "$.data.version" }
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr}", form_type: "W9", country_code: "US", tin_provided: true, treaty_claimed: false, expected_creator_version: "${cr_v1}" }
              as: Creator
              as_user_id: "${cr}"
              captures: { tp: "$.data.id" }
            - call: "POST /monetization/tax-profiles/${tp}/submit"
              payload: {}
              as: Creator
              as_user_id: "${cr}"
          trigger:
            - call: "POST /monetization/tax-profiles/${tp}/verify"
              payload: { decision: "VERIFY", rejection_reason: "Looks fine but here is a reason anyway" }
              as: FinanceOperator
          assert:
            - "HTTP status == 422"
            - "error.error_id == 'ERR_REJECTION_REASON_FORBIDDEN'"
            - "TaxProfile.${tp}.status == 'SUBMITTED'"
            - "TaxProfile.${tp}.verified_at == null"
            - "TaxProfile.${tp}.expires_at == null"

      - name: rate_with_reserved_default_source_is_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority 46]"
          - "errors[ERR_RATING_SOURCE_RESERVED]"
          - entities.ContentItem.fields.rating_source
        distinguishing_aspect: "DEFAULT is a declared member of the rating_source enum, so it clears the type check at priority 7 and is stopped by the reserved-provenance rule at 46 instead."
        test_recipe:
          setup: ["One creator and one GREEN content item with rating_source DEFAULT."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id" }
            - call: "POST /monetization/content-items"
              payload: { creator_id: "${cr}", title: "Launch Vlog", published_at: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ci: "$.data.id" }
          trigger:
            - call: "POST /monetization/content-items/${ci}/rate"
              payload: { suitability_rating: "YELLOW", rating_source: "DEFAULT" }
              as: PolicyReviewer
              as_user_id: "pr_rate_1"
          assert:
            - "HTTP status == 422"
            - "error.error_id == 'ERR_RATING_SOURCE_RESERVED'"
            - "ContentItem.${ci}.suitability_rating == 'GREEN'"
            - "ContentItem.${ci}.rating_source == 'DEFAULT'"
            - "ContentItem.${ci}.last_rated_by_user_id == null"

      - name: appeal_requested_rating_must_be_strictly_less_restrictive
        claim_type: violation_to_error
        grounds:
          - "validations[priority 56]"
          - "errors[ERR_APPEAL_RATING_NOT_IMPROVEMENT]"
        distinguishing_aspect: "A YELLOW item is appealable (LIMITED), so rules 19 and 20 both pass, and asking for RED is caught only by the improvement-direction rule at 56."
        test_recipe:
          setup: ["One creator with a content item rated YELLOW by pr_rate_1, leaving monetization_state LIMITED and no open appeal."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id" }
            - call: "POST /monetization/content-items"
              payload: { creator_id: "${cr}", title: "Launch Vlog", published_at: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ci: "$.data.id" }
            - call: "POST /monetization/content-items/${ci}/rate"
              payload: { suitability_rating: "YELLOW", rating_source: "MANUAL" }
              as: PolicyReviewer
              as_user_id: "pr_rate_1"
          trigger:
            - call: "POST /monetization/appeals"
              payload: { content_item_id: "${ci}", requested_rating: "RED", statement_text: "Please mark this clip fully restricted." }
              as: Creator
              as_user_id: "${cr}"
          assert:
            - "HTTP status == 422"
            - "error.error_id == 'ERR_APPEAL_RATING_NOT_IMPROVEMENT'"
            - "ContentItem.${ci}.open_appeal_count == 0"
            - "GET /monetization/appeals?content_item_id=${ci}: total_count == 0"

      - name: content_item_published_after_the_logical_clock_is_rejected
        claim_type: temporal_validation
        grounds:
          - "validations[priority 72]"
          - "errors[ERR_PUBLISHED_IN_FUTURE]"
          - "endpoints[POST /monetization/_clock/set_current_utc]"
        distinguishing_aspect: "With the logical clock at its 2026-08-01T00:00:00Z default, a published_at of 2026-08-02T00:00:00Z is rejected, so the rule reads the logical clock rather than wall-clock time."
        test_recipe:
          setup: ["One creator; the logical clock left at its startup default 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id" }
          trigger:
            - call: "POST /monetization/content-items"
              payload: { creator_id: "${cr}", title: "Tomorrow's Vlog", published_at: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
          assert:
