              payload: { target_text: "ゲーム開始", target_char_count: 120, applied_tm_match_pct: 96 }
              as: TranslationVendor
            - call: "POST /translation-units/${u_menu}/deliver"
              payload: {}
              as: TranslationVendor
            - call: "POST /market-plans/${mp_jp}/enter-lqa"
              payload: {}
              as: LocalizationProducer
            - call: "POST /qa-passes"
              payload: { market_plan_id: "${mp_jp}", pass_type: "FUNCTIONAL", inspected_unit_count: 160 }
              as: LqaTester
              as_user_id: "lqa-1"
              captures: { pass_fn: "$.data.id" }
            - call: "POST /lqa-bugs"
              payload: { qa_pass_id: "${pass_fn}", bug_class: "FUNCTIONAL_CRASH", severity: "S2", summary: "crash on language switch" }
              as: LqaTester
              as_user_id: "lqa-1"
              captures: { bug_a: "$.data.id" }
            - call: "POST /lqa-bugs"
              payload: { qa_pass_id: "${pass_fn}", bug_class: "FUNCTIONAL_CRASH", severity: "S2", summary: "crash on subtitle toggle" }
              as: LqaTester
