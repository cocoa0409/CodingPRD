              as_user_id: "csr-001"
              captures: { hold_after: $.data.retention_hold }
            - call: "POST /enrollments/${enrollment_id}/cancellation"
              payload: { reason: "CUSTOMER_REQUEST", requested_effective_date: "2026-09-20" }
              as: CustomerServiceRep
              as_user_id: "csr-001"
              captures: { final_coverage: $.data.coverage_status, final_billing: $.data.billing_status, final_refund: $.data.refund_cents, final_fee: $.data.cancellation_fee_cents, final_credit: $.data.credit_cents, final_effective: $.data.cancellation_effective_date, final_reason: $.data.cancellation_reason }
          assert:
            - "${hold_at_creation} == false, ${eligibility} == OWNERSHIP_INELIGIBLE (INSIDE_HOME is not in COVERED_DEFECT_LOCATIONS[CURB_STOP]) and ${denied_status} == DENIED with ${denied_at} == 2026-09-10T08:00:00.000Z"
            - "${appeal_status} == APPEAL_OPEN, ${appeal_source} == POLICYHOLDER, ${appeal_count} == 1, and ${hold_before} == true with ${coverage_before} == ACTIVE  # cascade hop 2 set the hold on the enrollment"
            - "${err_hold} == ERR_CANCELLATION_BLOCKED_APPEAL with HTTP 422  # priority 60, read from the enrollment's live retention_hold"
            - "the refused cancellation writes nothing: GET /enrollments/${enrollment_id} still reports coverage_status ACTIVE, billing_status CURRENT, refund_cents null and cancellation_effective_date null, and GET /ledger-entries?enrollment_id=${enrollment_id} reports total_count 0"
            - "${upheld_status} == APPEAL_UPHELD_DENIAL and ${upheld_by} == apo-001  # apo-001 != triage_decided_by_user_id adj-001, so segregation of duties is satisfied"
            - "${hold_after} == false  # the appeal decision recomputes retention_hold; no other claim of this enrollment is in APPEAL_OPEN"
            - "${final_coverage} == CANCELLED, ${final_billing} == REFUND_ISSUED, ${final_reason} == CUSTOMER_REQUEST and ${final_effective} == 2026-09-20 with HTTP 200"
            - "${final_refund} == 23728, ${final_fee} == 2500 and ${final_credit} == 0  # earned = round_half_up(2499*27/31) 2177 + round_half_up(2499*19/30) 1583 = 3760; 46 days elapsed >= FREE_LOOK_DAYS 30 so the 2500 fee applies; 29988 - 3760 - 2500"
            - "GET /ledger-entries?enrollment_id=${enrollment_id} now reports total_count 2: one CASH PRORATION_REFUND of -23728 and one CASH CANCELLATION_FEE of +2500"

      - name: appeal_window_expiry_is_temporal_not_state
        claim_type: temporal_validation
        grounds:
          - validations.appeal-window-open
          - errors.ERR_APPEAL_WINDOW_EXPIRED
          - state_machines.Claim.transitions.DENIED_to_APPEAL_OPEN
          - calculations.claim_eligibility_assessment.constants.APPEAL_WINDOW_DAYS
          - endpoints.POST /claims/{claimId}/appeals
        distinguishing_aspect: "Two claims are denied at the very same instant and appealed one millisecond apart across the boundary, with NO nightly run in between - so the second refusal has to come from the temporal rule at priority 55 (422 ERR_APPEAL_WINDOW_EXPIRED) and not from the claim-state gate, because both claims are still in DENIED rather than the CLOSED state the nightly sweep would have given them. The comparison is inclusive: the clock exactly at denied_at + 30 days is still open."
