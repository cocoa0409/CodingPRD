      - name: canceled_hold_returns_its_window_for_reuse
        claim_type: soft_delete
        grounds:
          - state_machines.FuelDelivery.DELIVERY_SCHEDULED_to_DELIVERY_CANCELLED
          - endpoints.POST_/power/sites/{id}/release-resource-hold
          - entities.FuelDelivery.fields.hold_window_start_iso8601
        distinguishing_aspect: "A canceled hold stays queryable through the site's delivery list but is excluded from the open-window set, so a new hold may take the identical window that the canceled one had occupied."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. One site holding a 25000-therm hold over 2026-04-01..2026-04-04."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
