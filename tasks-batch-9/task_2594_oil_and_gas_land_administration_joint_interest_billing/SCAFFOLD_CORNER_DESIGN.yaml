      - name: parallel_tenure_and_obligation_dimensions_move_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Lease.PRIMARY_TERM_to_SHUT_IN_HELD
          - state_machines.Lease.COMPLIANT_to_OBLIGATION_DUE
        excluded_because:
          difficulty_instance: non_linear_state_machine / lease_tenure_and_obligation_dimensions_advance_independently
          rationale: "That §1.8 instance drives the tenure and obligation dimensions through four combined states on one lease and asserts each pair, which is exactly this row's parallel-shape claim."

      - name: statement_issuance_is_guarded_by_the_wells_pooling_dimension
        claim_type: guarded_transitions
        grounds:
          - state_machines.JibStatement.DRAFT_to_ISSUED
          - validations[priority=55, error_id=ERR_WELL_NOT_POOLED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / statement_issuance_depends_on_the_wells_pooling_status
          rationale: "Asserted as both the guarded-rejection path and the success path of the named §1.8 instance."

      - name: lease_expiry_cascades_down_into_its_allocations
        claim_type: cascade_down
        grounds:
          - state_machines.Lease.PRIMARY_TERM_to_EXPIRED
          - entities.WellLeaseAllocation.fields.withdrawn_reason
        excluded_because:
          difficulty_instance: transitive_cascade / lease_expiry_cascades_four_hops_into_suspended_disbursements
          rationale: "Hop 1 of that §1.8 instance is precisely the parent-to-children withdrawal cascade, and it asserts that only COMMITTED allocations are affected."

      - name: election_closure_crosses_into_interests_and_disbursements
        claim_type: cross_entity
        grounds:
          - state_machines.Afe.ELECTIONS_OPEN_to_PARTIALLY_CONSENTED
          - entities.WellInterest.fields.non_consent_flag
        excluded_because:
          difficulty_instance: transitive_cascade / afe_election_closure_cascades_four_hops_into_non_consent_suspense
          rationale: "That §1.8 instance asserts each cross-entity hop of the closure cascade, including the suspended disbursements and the recomputed suspense balance."

      - name: statement_revision_keeps_the_well_ledger_in_sync
        claim_type: ledger_sync
        grounds:
          - state_machines.JibStatement.ISSUED_to_ADJUSTED
          - entities.Well.fields.billed_to_date_cents
        excluded_because:
          difficulty_instance: compensating_invariant / statement_revision_reverses_the_billed_ledger_without_drift
          rationale: "That §1.8 instance reconciles Well.billed_to_date_cents before and after the revision and re-issuance, which is this row's ledger-sync claim."

      - name: closing_a_conveyance_compensates_the_superseded_interest_rows
        claim_type: compensation
        grounds:
          - state_machines.WellInterest.ACTIVE_to_SUPERSEDED
          - state_machines.WellInterest.ACTIVE_to_TERMINATED
        excluded_because:
          difficulty_instance: compensating_invariant / full_conveyance_conserves_both_interest_totals_on_the_well
          rationale: "That §1.8 instance asserts the conserved working-interest and net-revenue-interest totals across the supersede/terminate pair, i.e. no drift after the undo-and-replace."

  # ============================================================================
  # Section 3 - Calculations (claim-extraction-guide "From Table 3")
  # ============================================================================
  - section: calculations
    instances:
      - name: allocation_factor_residual_lands_on_the_first_largest_allocation
        claim_type: correct_result
        grounds:
          - calculations.unit_allocation_factor
          - entities.WellLeaseAllocation.fields.allocation_factor
          - entities.Well.fields.allocation_factor_total
        distinguishing_aspect: |
          Three equal 100.00-acre allocations each round to 0.333333, summing to 0.999999, so the
          signed residual 0.000001 goes to the tied-largest allocation with the earliest created_at:
          the first allocation reads 0.333334, the other two 0.333333, and allocation_factor_total is
          exactly 1.000000.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-10T00:00:00Z"
            - "Leases L-001, L-002 and L-003, each 160.00 gross acres, created in that order"
            - "Well Sandstone 1H, OIL, 9500 ft"
            - "100.00 acres committed from L-001 and then from L-002"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-10T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-001", lessor_name: "Alpha Minerals", gross_acres: 160.00, royalty_rate: 0.187500, primary_term_end_date: "2026-09-30" }
              as: LandAdministrator
              captures: { lease1_id: $.data.id }
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-002", lessor_name: "Beta Royalties", gross_acres: 160.00, royalty_rate: 0.250000, primary_term_end_date: "2027-12-31" }
              as: LandAdministrator
              captures: { lease2_id: $.data.id }
            - call: "POST /land-admin/leases"
              payload: { lease_number: "L-003", lessor_name: "Gamma Minerals", gross_acres: 160.00, royalty_rate: 0.200000, primary_term_end_date: "2028-06-30" }
              as: LandAdministrator
              captures: { lease3_id: $.data.id }
            - call: "POST /land-admin/wells"
              payload: { well_name: "Sandstone 1H", api_number: "42-123-45678", product_type: "OIL", total_depth_ft: 9500 }
              as: LandAdministrator
              captures: { well_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease1_id}", committed_acres: 100.00 }
              as: LandAdministrator
              captures: { alloc1_id: $.data.id }
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease2_id}", committed_acres: 100.00 }
              as: LandAdministrator
              captures: { alloc2_id: $.data.id }
          trigger:
            - call: "POST /land-admin/wells/${well_id}/lease-allocations"
              payload: { lease_id: "${lease3_id}", committed_acres: 100.00 }
              as: LandAdministrator
              captures: { alloc3_id: $.data.id }
          assert:
            - "HTTP 201"
            - "WellLeaseAllocation.${alloc1_id}.allocation_factor == 0.333334"
            - "WellLeaseAllocation.${alloc2_id}.allocation_factor == 0.333333"
            - "WellLeaseAllocation.${alloc3_id}.allocation_factor == 0.333333"
            - "Well.${well_id}.allocation_factor_total == 1.000000"
            - "Lease.${lease1_id}.committed_acres_total == 100.00 and held_acres == 100.00"
            - "Lease.${lease3_id}.committed_acres_total == 100.00 and held_acres == 100.00"

