    distinguishing_aspect: Both SupervisionCase dimensions start at their own initial_state on the same create (PENDING_CONTACT
      and NOT_REQUESTED) with a null window and a zero change counter — an implementation that jumps a fresh case
      to ACTIVE or pre-approves work fails here.
    test_recipe:
      setup:
      - one Participant p1 exists
      - no SupervisionCase exists
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00.000Z'
        as: CaseManager
