            - call: "POST /visits/${vB}/begin-treatment"
              payload: {}
              as: ClinicianDVM
          trigger:
            - call: "POST /visits/${vB}/hospitalizations"
              payload: { ward: "ICU", cage_number: 1, admit_at: "2026-05-04T08:00:00Z", planned_discharge_at: "2026-05-05T08:00:00Z" }
              as: ClinicianDVM
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CAGE_OCCUPIED"

  # ==========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_authorization_void_ceiling_conserved
        grounds:
          - state_machines.Authorization.ACTIVE_to_VOIDED
          - state_machines.Authorization.PENDING_to_ACTIVE
          - entities.Visit.fields.authorized_ceiling_cents
        distinguishing_aspect: |
          Conserved quantity = Visit.authorized_ceiling_cents. Approving then
          voiding an authorization must leave the ceiling exactly at its prior
          value: after approve (ceiling 200000) then void, authorized_ceiling_cents
          returns to 0 (its pre-approve value). Invariant:
          authorized_ceiling_cents == sum(ACTIVE approved_ceiling_cents).
        test_recipe:
          setup:
            - "A YELLOW Visit with an ACTIVE authorization (ceiling 200000), no procedures performed (committed 0)."
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Fig", species: "FELINE", weight_kg: 5, owner_user_id: "owner-17" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "blockage" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "YELLOW" }
              as: TriageNurse
            - call: "POST /visits/${visit_id}/estimates"
              payload: { line_items: [ { code: "TX", description: "care", qty: 1, unit_price_cents: 100000 } ] }
              as: FinanceCoordinator
              captures: { e1: $.data.id }
            - call: "GET /visits/${visit_id}"
              payload: {}
              as: FinanceCoordinator
              captures: { vv1: $.data.version }
            - call: "POST /visits/${visit_id}/estimates/${e1}/issue"
              payload: { expected_visit_version: "${vv1}" }
              as: FinanceCoordinator
            - call: "POST /visits/${visit_id}/authorizations"
              payload: { estimate_id: "${e1}", approved_ceiling_cents: 200000 }
              as: FinanceCoordinator
              captures: { a1: $.data.id }
            - call: "POST /visits/${visit_id}/authorizations/${a1}/approve"
              payload: {}
              as: Owner
              as_user_id: "owner-17"
          trigger:
            - call: "POST /visits/${visit_id}/authorizations/${a1}/void"
              payload: {}
              as: FinanceCoordinator
          assert:
            - "Authorization.${a1}.status == VOIDED"
            - "Visit.${visit_id}.authorized_ceiling_cents == 0"

      - name: ci_authorization_void_deposit_conserved
        grounds:
          - state_machines.Authorization.ACTIVE_to_VOIDED
          - entities.Invoice.fields.deposit_applied_cents
          - entities.Invoice.fields.balance_due_cents
        distinguishing_aspect: |
          Different conserved quantity = Invoice.deposit_applied_cents. Approving
          credits deposit 128700 into the invoice; voiding removes exactly that
          deposit, returning deposit_applied_cents to 0 and balance_due_cents to
          its pre-credit value. Invariant: deposit_applied_cents ==
          sum(ACTIVE authorizations' deposit_paid_cents).
        test_recipe:
          setup:
            - "A YELLOW Visit with an ACTIVE authorization whose deposit 128700 was credited to the OPEN invoice, no charges posted."
          setup_api_calls:
            - call: "POST /patients"
              payload: { name: "Gus", species: "CANINE", weight_kg: 24, owner_user_id: "owner-18" }
              as: TriageNurse
              captures: { pat_id: $.data.id }
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", chief_complaint: "GDV" }
              as: TriageNurse
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/triage"
              payload: { triage_level: "YELLOW" }
              as: TriageNurse
            - call: "POST /visits/${visit_id}/estimates"
              payload: { line_items: [ { code: "SX", description: "surgery", qty: 1, unit_price_cents: 300000 } ] }
              as: FinanceCoordinator
              captures: { e1: $.data.id }
            - call: "GET /visits/${visit_id}"
              payload: {}
              as: FinanceCoordinator
              captures: { vv1: $.data.version }
            - call: "POST /visits/${visit_id}/estimates/${e1}/issue"
              payload: { expected_visit_version: "${vv1}" }
              as: FinanceCoordinator
            - call: "POST /visits/${visit_id}/authorizations"
              payload: { estimate_id: "${e1}", approved_ceiling_cents: 386100 }
              as: FinanceCoordinator
              captures: { a1: $.data.id }
            - call: "POST /visits/${visit_id}/authorizations/${a1}/approve"
              payload: {}
              as: Owner
              as_user_id: "owner-18"
          trigger:
            - call: "POST /visits/${visit_id}/authorizations/${a1}/void"
              payload: {}
              as: FinanceCoordinator
          assert:
            - "Authorization.${a1}.status == VOIDED"
            - "Invoice(visit=${visit_id}).deposit_applied_cents == 0"
            - "Invoice(visit=${visit_id}).balance_due_cents == 0"
