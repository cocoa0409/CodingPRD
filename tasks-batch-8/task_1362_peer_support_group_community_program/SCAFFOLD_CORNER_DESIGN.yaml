              as: ProgramAdmin
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /programs/${pid}"
              payload: {}
              as: ProgramAdmin
              captures: { posture: $.data.posture, cc: $.data.active_critical_incident_count }
          assert:
            - "At creation: active_critical_incident_count == 0 → posture == OPEN"
            - "posture == OPEN"
            - "cc == 0"
            - "Boundary: count > 0 (not >= 0) is the trigger for LOCKDOWN"

