              as_user_id: "analyst-issuer"
          assert:
            - "HTTP 404 with error_id == 'ERR_STATEMENT_NOT_FOUND'"

      - name: escalate_of_an_unknown_incident_returns_incident_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_INCIDENT_NOT_FOUND]
        distinguishing_aspect: "The unknown-incident 404 precedes the temporal ack-window rule at priority 18, so no deadline arithmetic is attempted on a missing row."
        test_recipe:
          setup:
            - "An empty database apart from the logical clock"
