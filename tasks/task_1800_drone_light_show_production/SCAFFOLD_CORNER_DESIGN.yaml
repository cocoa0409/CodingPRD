            - { call: "POST /api/drones", payload: { serial_number: "SN-P04", model: "LUM-2" }, as: FleetManager }
            - { call: "POST /api/drones", payload: { serial_number: "SN-P05", model: "LUM-2" }, as: FleetManager }
