# SCAFFOLD.yaml — §1.0 through §1.7
# Task 2879 — Essential Air Service Subsidy Program
scenario: |
  2879. Essential Air Service Subsidy Program (federal essential air service program): community
  eligibility determination with subsidy-per-passenger caps and distance thresholds, carrier proposal
  solicitation with service level, aircraft type and subsidy amount, community preference input and
  carrier selection decisions, service commitment terms with minimum frequency, capacity and seat
  availability, subsidy payment based on actual completed flights with adjustment for cancellations,
  carrier performance monitoring on completion factor and service quality, community termination
  petitions and hold-in requirements until a replacement carrier is secured, rate renegotiation on
  fuel and cost changes

domain_name: essential-air-service-subsidy
api_prefix: /eas

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — VERBATIM)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# ---------------------------------------------------------------------------
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # Every entity is addressed at its own top-level collection under /eas; parents are
  # referenced by FK fields in request bodies, never by URL nesting. The only nested
  # paths are read-side sub-resources and action endpoints on a single resource.

  state_machine_shape: cyclic
  # Solicitation (CLOSED -> OPEN reopen loop), RateRenegotiation (REQUESTED -> COUNTERED ->
  # REQUESTED revision loop), Carrier (ACTIVE -> PROBATION -> ACTIVE), Community
  # (SUBSIDIZED -> HOLD_IN -> SUBSIDIZED), ServicePeriod (CERTIFIED/PAID -> REPORTED on
  # payment reversal) all cycle. Proposal additionally carries two independent state
  # dimensions (submission_state x evaluation_state), and TerminationPetition branches
  # fork-style into three decision outcomes with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # Community -> Solicitation -> Proposal; ServiceAgreement -> ServicePeriod
    - many_to_many         # CommunityPreference joins Solicitation x Proposal (ranked junction)
    - self_referential     # ServiceAgreement.predecessor_agreement_id -> ServiceAgreement.id
    - cross_aggregate      # PerformanceReview mutates Carrier, ServiceAgreement and Community

  role_model: segregation_of_duties
  # The EligibilityAnalyst X-User-ID that certified a community's latest determination may not
  # be the SelectionOfficer X-User-ID that issues the selection order for that community, and the
  # ProgramAdmin X-User-ID that approves a subsidy payment may not be the one that disburses it.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Community
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Three-letter community airport code, uppercase.
        constraints: "matches ^[A-Z]{3}$; unique across all Community rows"
      - name: name
        type: string
        source: input
        description: Human-readable community name.
        constraints: "1..120 chars"
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code, uppercase.
        constraints: "matches ^[A-Z]{2}$"
      - name: driving_miles_to_nearest_hub
        type: number
        source: input
        description: Highway driving distance in statute miles from the community to the nearest large or medium hub airport.
        constraints: ">= 0.0; at most 1 decimal place"
      - name: enplanements_prior_year
        type: integer
        source: input
        description: Total passenger enplanements at the community airport in the prior calendar year.
        constraints: ">= 0"
      - name: min_required_weekly_round_trips
        type: integer
        source: input
        description: Minimum weekly round trips any awarded carrier must commit to serve this community.
        constraints: "1..21"
      - name: min_required_weekly_seats
        type: integer
        source: input
        description: Minimum weekly one-way seats any awarded carrier must make available.
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: Community lifecycle state; see §1.2 Community state machine.
        default: REGISTERED
        constraints: "REGISTERED | ELIGIBLE | INELIGIBLE | SUBSIDIZED | HOLD_IN | TERMINATED"
      - name: distance_band
        type: enum
        source: computed
        description: Distance classification written by calculations.community_eligibility_assessment; null until the first EligibilityDetermination exists.
        default: null
        constraints: "TOO_CLOSE | CAPPED | UNCAPPED | null"
      - name: subsidy_per_passenger_cap_usd
        type: number
        source: computed
        description: Per-passenger subsidy ceiling copied from the latest EligibilityDetermination; null means no cap applies.
        default: null
        constraints: "null or 200.00"
      - name: latest_determination_outcome
        type: enum
        source: computed
        description: Outcome of the EligibilityDetermination with the greatest created_at for this Community; null before the first determination.
        default: null
        constraints: "ELIGIBLE | ELIGIBLE_WITH_WAIVER | INELIGIBLE_DISTANCE | INELIGIBLE_ENPLANEMENTS | null"
      - name: active_agreement_count
        type: integer
        source: computed
        description: Count of ServiceAgreement rows with community_id equal to this Community.id and status == ACTIVE.
        default: 0
        constraints: ">= 0"

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Air carrier legal name.
        constraints: "1..120 chars"
      - name: certificate_number
        type: string
        source: input
        description: DOT operating certificate number.
        constraints: "1..32 chars; unique across all Carrier rows"
      - name: status
        type: enum
        source: system
        description: Carrier standing; see §1.2 Carrier state machine.
        default: ACTIVE
        constraints: "ACTIVE | PROBATION | SUSPENDED | DEBARRED"
      - name: latest_completion_factor
        type: number
        source: computed
        description: completion_factor of the PerformanceReview with the greatest created_at across all agreements of this Carrier; null before the first review.
        default: null
        constraints: "0.0000..1.0000, 4 decimal places, or null"
      - name: latest_quality_score
        type: number
        source: computed
        description: quality_score of the PerformanceReview with the greatest created_at across all agreements of this Carrier; null before the first review.
        default: null
        constraints: "0.00..100.00 or null"
      - name: latest_performance_tier
        type: enum
        source: computed
        description: tier of the PerformanceReview with the greatest created_at across all agreements of this Carrier.
        default: null
        constraints: "COMPLIANT | WATCH | DEFICIENT | null"
      - name: consecutive_watch_count
        type: integer
        source: computed
        description: Number of consecutive PerformanceReview rows for this Carrier, ordered by created_at ASC, whose tier == WATCH, counted back from the most recent review; reset to 0 by a COMPLIANT review.
        default: 0
        constraints: ">= 0"

  - name: AircraftType
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: ICAO-style aircraft type code.
        constraints: "matches ^[A-Z0-9]{3,5}$; unique across all AircraftType rows"
      - name: name
        type: string
        source: input
        description: Manufacturer and model description.
        constraints: "1..120 chars"
      - name: seats
        type: integer
        source: input
        description: Maximum certificated passenger seats on this aircraft type.
        constraints: "1..100"
      - name: is_jet
        type: boolean
        source: input
        description: True for turbofan equipment, false for turboprop or piston equipment.
      - name: fuel_burn_gal_per_hour
        type: number
        source: input
        description: Average block-hour fuel burn in US gallons, used by calculations.renegotiated_annual_subsidy.
        constraints: "> 0.0; at most 1 decimal place"
      - name: hourly_operating_cost_usd
        type: number
        source: input
        description: Average non-fuel direct operating cost per block hour in USD.
        constraints: "> 0.00; 2 decimal places"
      - name: is_retired
        type: boolean
        source: system
        description: True once POST /eas/aircraft-types/{id}/retire has been applied; retired types may not back a proposal submission.
        default: false

  - name: FuelIndex
    parent: null
    common_fields: false
    fields:
      - name: index_month
        type: string
        source: input
        description: Calendar month the index value applies to, in YYYY-MM form.
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$; unique across all FuelIndex rows"
      - name: price_per_gallon_usd
        type: number
        source: input
        description: Published average jet fuel price per US gallon for index_month.
        constraints: "> 0.0000; exactly 4 decimal places"

  - name: EligibilityDetermination
    parent: null
    common_fields: false
    fields:
      - name: community_id
        type: string
        source: input
        description: FK -> Community.id; the community whose eligibility this row determines.
      - name: waiver_requested
        type: boolean
        source: input
        description: True when the community asks for an enplanement-floor waiver.
        default: false
      - name: driving_miles_at_determination
        type: number
        source: computed
        description: Snapshot of Community.driving_miles_to_nearest_hub at determination time.
      - name: avg_daily_enplanements
        type: number
        source: computed
        description: round(Community.enplanements_prior_year / 365, 2), round_half_up.
        constraints: ">= 0.00, 2 decimal places"
      - name: distance_band
        type: enum
        source: computed
        description: Distance classification produced by calculations.community_eligibility_assessment.
        constraints: "TOO_CLOSE | CAPPED | UNCAPPED"
      - name: subsidy_per_passenger_cap_usd
        type: number
        source: computed
        description: 200.00 when distance_band == CAPPED, otherwise null.
        constraints: "null or 200.00"
      - name: outcome
        type: enum
        source: computed
        description: Determination result produced by calculations.community_eligibility_assessment.
        constraints: "ELIGIBLE | ELIGIBLE_WITH_WAIVER | INELIGIBLE_DISTANCE | INELIGIBLE_ENPLANEMENTS"
      - name: certified_by_user_id
        type: string
        source: system
        description: X-User-ID of the EligibilityAnalyst that created this row; consumed by the segregation-of-duties check on POST /eas/solicitations/{id}/selection-order.
      - name: effective_at
        type: datetime
        source: system
        description: Logical clock value at creation, ISO 8601 UTC with three fractional digits.

  - name: Solicitation
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: FK -> Community.id; the community this solicitation seeks service for.
      - name: closes_at
        type: datetime
        source: input
        description: Instant after which proposal submission is refused; ISO 8601 UTC.
      - name: round_number
        type: integer
        source: system
        description: Solicitation round; 1 at creation, incremented by one on every REOPEN action.
        default: 1
      - name: created_reason
        type: enum
        source: system
        description: INITIAL for solicitations created via POST /eas/solicitations; REPLACEMENT for solicitations auto-created when a Community enters HOLD_IN.
        default: INITIAL
        constraints: "INITIAL | REPLACEMENT"
      - name: status
        type: enum
        source: system
        description: Solicitation lifecycle state; see §1.2 Solicitation state machine.
        default: OPEN
        constraints: "OPEN | CLOSED | AWARDED | CANCELLED"
      - name: preference_filing_count
        type: integer
        source: computed
        description: Number of accepted community preference filings; incremented by one on each POST /eas/solicitations/{id}/preferences. Only CommunityPreference rows whose filing_sequence equals this value are read by calculations.carrier_selection_ranking.
        default: 0
      - name: selected_proposal_id
        type: string
        source: computed
        description: Back-reference holding the Proposal.id chosen by the selection order (read it with GET /eas/proposals/{id}); null while status is in {OPEN, CLOSED, CANCELLED}.
        default: null
      - name: candidate_count_at_award
        type: integer
        source: computed
        description: Size of the candidate set evaluated by calculations.carrier_selection_ranking at award time; null before award.
        default: null

  - name: Proposal
    parent: null
    common_fields: true
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: FK -> Solicitation.id; the solicitation round this proposal answers.
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the proposing carrier. Must equal the X-User-ID of the acting Carrier role.
      - name: aircraft_type_id
        type: string
        source: input
        description: FK -> AircraftType.id; equipment offered.
      - name: service_level
        type: enum
        source: input
        description: Offered service pattern.
        constraints: "ESSENTIAL_MINIMUM | ENHANCED | HUB_CONNECT"
      - name: weekly_round_trips
        type: integer
        source: input
        description: Round trips per week the carrier commits to operate.
        constraints: "1..21"
      - name: seats_per_departure
        type: integer
        source: input
        description: Seats offered on each departure; must be <= AircraftType.seats of aircraft_type_id.
        constraints: "1..100"
      - name: annual_subsidy_request_usd
        type: number
        source: input
        description: Annual subsidy amount requested, USD.
        constraints: "> 0.00; 2 decimal places"
      - name: term_months
        type: integer
        source: input
        description: Requested commitment term in months.
        constraints: "one of 12 | 24 | 36 | 48"
      - name: payment_basis
        type: enum
        source: input
        description: Which variant of calculations.subsidy_payment_amount the resulting ServiceAgreement will pay on.
        constraints: "COMPLETED_FLIGHT_PRORATION | SCHEDULED_FLIGHT_FLAT"
      - name: projected_annual_passengers
        type: integer
        source: computed
        description: floor(weekly_round_trips * 2 * seats_per_departure * 52 * 0.375); see calculations.proposal_subsidy_per_passenger.
      - name: subsidy_per_passenger_usd
        type: number
        source: computed
        description: round(annual_subsidy_request_usd / projected_annual_passengers, 2), round_half_up.
        constraints: "> 0.00, 2 decimal places"
      - name: submission_state
        type: enum
        source: system
        description: Submission dimension of the Proposal state machine; evolves independently of evaluation_state.
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | WITHDRAWN"
      - name: evaluation_state
        type: enum
        source: system
        description: Evaluation dimension of the Proposal state machine; evolves independently of submission_state.
        default: NOT_EVALUATED
        constraints: "NOT_EVALUATED | UNDER_EVALUATION | SELECTED | NOT_SELECTED | EXPIRED"
      - name: composite_score
        type: number
        source: computed
        description: Ranking score written by calculations.carrier_selection_ranking when the selection order runs; null until then.
        default: null
        constraints: "0.0000..100.0000, 4 decimal places, or null"

  - name: CommunityPreference
    parent: null
    common_fields: false
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: FK -> Solicitation.id; the solicitation this ranking row belongs to.
      - name: proposal_id
        type: string
        source: input
        description: FK -> Proposal.id; the ranked proposal.
      - name: rank
        type: integer
        source: input
        description: Community's ordinal preference, 1 = most preferred.
        constraints: ">= 1; within one filing the ranks are exactly 1..N with no duplicates"
      - name: filing_sequence
        type: integer
        source: system
        description: Solicitation.preference_filing_count value produced by the filing that created this row; only rows at the maximum filing_sequence are read by the ranking calculation.
        constraints: ">= 1"
      - name: rationale
        type: string
        source: input
        description: Free-text explanation supplied with the filing; identical on every row of one filing.
        default: null
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the CommunityRepresentative that filed the ranking; equals Community.id of the solicitation's community.

  - name: ServiceAgreement
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: FK -> Community.id; community served under this agreement.
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; carrier obligated under this agreement.
      - name: proposal_id
        type: string
        source: input
        description: FK -> Proposal.id; the selected proposal whose terms this agreement fixes.
      - name: predecessor_agreement_id
        type: string
        source: computed
        description: FK -> ServiceAgreement.id; the HOLD_IN agreement this one replaces. Resolved at award as the ServiceAgreement with community_id equal to the solicitation's community and status == HOLD_IN; when more than one qualifies the row with the earliest created_at wins; null when none qualifies.
        default: null
      - name: min_weekly_round_trips
        type: integer
        source: computed
        description: Copied from Proposal.weekly_round_trips of proposal_id at award.
      - name: min_monthly_seats
        type: integer
        source: computed
        description: floor(min_weekly_round_trips * 2 * Proposal.seats_per_departure * 52 / 12); the monthly seat-availability floor used by calculations.carrier_performance_scoring.
      - name: annual_subsidy_usd
        type: number
        source: computed
        description: Annual subsidy rate in force; equals Proposal.annual_subsidy_request_usd at award and is replaced by RateRenegotiation.approved_annual_subsidy_usd on ACCEPT.
        constraints: "> 0.00, 2 decimal places"
      - name: payment_basis
        type: enum
        source: computed
        description: Copied from Proposal.payment_basis at award; selects the variant of calculations.subsidy_payment_amount.
        constraints: "COMPLETED_FLIGHT_PRORATION | SCHEDULED_FLIGHT_FLAT"
      - name: term_months
        type: integer
        source: computed
        description: Copied from Proposal.term_months at award.
      - name: rate_effective_from
        type: datetime
        source: computed
        description: Logical clock value at award, replaced by the logical clock value at each accepted renegotiation; lower bound of the half-open rate interval.
      - name: rate_effective_to
        type: datetime
        source: computed
        description: rate_effective_from at award plus term_months calendar months; exclusive upper bound of the half-open rate interval. Never changed by renegotiation.
      - name: baseline_fuel_index_usd
        type: number
        source: computed
        description: FuelIndex.price_per_gallon_usd of the FuelIndex whose index_month equals the YYYY-MM of rate_effective_from at award; the renegotiation baseline.
        constraints: "> 0.0000, 4 decimal places"
      - name: annual_block_hours
        type: number
        source: computed
        description: min_weekly_round_trips * 2 * 52 * 1.5 block hours per year.
        constraints: "> 0.0, 1 decimal place"
      - name: total_committed_usd
        type: number
        source: computed
        description: Total program obligation booked against this agreement; round(annual_subsidy_usd * term_months / 12, 2) at award, adjusted on renegotiation acceptance.
        constraints: ">= 0.00, 2 decimal places"
      - name: disbursed_to_date_usd
        type: number
        source: computed
        description: Sum of SubsidyPayment.net_payment_usd for payments of this agreement's periods with status == DISBURSED.
        default: 0.00
      - name: obligated_remaining_usd
        type: number
        source: computed
        description: round(total_committed_usd - disbursed_to_date_usd, 2); the conserved quantity of invariant program_obligation_conservation.
        default: 0.00
      - name: hold_in_premium_paid_usd
        type: number
        source: computed
        description: Sum of SubsidyPayment.hold_in_premium_usd for payments of this agreement's periods with status == DISBURSED; tracked outside the committed obligation ledger.
        default: 0.00
      - name: cumulative_scheduled_departures
        type: integer
        source: computed
        description: Sum of ServicePeriod.scheduled_departures over periods of this agreement with status IN {REPORTED, CERTIFIED, PAID}.
        default: 0
      - name: cumulative_completed_departures
        type: integer
        source: computed
        description: Sum of ServicePeriod.completed_departures over periods of this agreement with status IN {REPORTED, CERTIFIED, PAID}.
        default: 0
      - name: cumulative_cancelled_carrier_departures
        type: integer
        source: computed
        description: Sum of ServicePeriod.cancelled_carrier_departures over periods of this agreement with status IN {REPORTED, CERTIFIED, PAID}.
        default: 0
      - name: cumulative_cancelled_weather_departures
        type: integer
        source: computed
        description: Sum of ServicePeriod.cancelled_weather_departures over periods of this agreement with status IN {REPORTED, CERTIFIED, PAID}.
        default: 0
      - name: status
        type: enum
        source: system
        description: Agreement lifecycle state; see §1.2 ServiceAgreement state machine.
        default: ACTIVE
        constraints: "ACTIVE | HOLD_IN | SUSPENDED | TERMINATED"
      - name: terminated_at
        type: datetime
        source: computed
        description: Logical clock value when status became TERMINATED; lower bound of the carrier re-entry buffer. Null while status is in {ACTIVE, HOLD_IN, SUSPENDED}.
        default: null

  - name: ServicePeriod
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> ServiceAgreement.id; the agreement this monthly report belongs to.
      - name: period_month
        type: string
        source: input
        description: Reporting month in YYYY-MM form; unique per agreement_id.
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: scheduled_departures
        type: integer
        source: input
        description: Departures published in the schedule for the month; supplied by POST /eas/service-periods/{id}/report and replaced by POST /eas/service-periods/{id}/amend.
        default: 0
        constraints: ">= 0; must be >= 1 at report time"
      - name: completed_departures
        type: integer
        source: input
        description: Departures actually flown; supplied at report and replaced at amend.
        default: 0
      - name: cancelled_carrier_departures
        type: integer
        source: input
        description: Departures cancelled for carrier-controllable reasons; supplied at report and replaced at amend.
        default: 0
      - name: cancelled_weather_departures
        type: integer
        source: input
        description: Departures cancelled for weather or air-traffic reasons; supplied at report and replaced at amend.
        default: 0
      - name: seats_offered
        type: integer
        source: input
        description: One-way seats actually offered during the month; supplied at report and replaced at amend.
        default: 0
      - name: passengers_enplaned
        type: integer
        source: input
        description: Passengers actually enplaned during the month; supplied at report and replaced at amend.
        default: 0
      - name: period_completion_factor
        type: number
        source: computed
        description: round(completed_departures / scheduled_departures, 4) written at report and at amend; null while status == OPEN.
        default: null
      - name: status
        type: enum
        source: system
        description: Period lifecycle state; see §1.2 ServicePeriod state machine.
        default: OPEN
        constraints: "OPEN | REPORTED | CERTIFIED | PAID"
      - name: amendment_count
        type: integer
        source: computed
        description: Number of accepted POST /eas/service-periods/{id}/amend calls on this row.
        default: 0

  - name: SubsidyPayment
    parent: null
    common_fields: true
    fields:
      - name: service_period_id
        type: string
        source: input
        description: FK -> ServicePeriod.id; the certified period this payment settles.
      - name: variant_used
        type: enum
        source: computed
        description: ServiceAgreement.payment_basis in force at certification; names the variant of calculations.subsidy_payment_amount that produced gross_subsidy_usd.
        constraints: "COMPLETED_FLIGHT_PRORATION | SCHEDULED_FLIGHT_FLAT"
      - name: monthly_entitlement_usd
        type: number
        source: computed
        description: round(ServiceAgreement.annual_subsidy_usd / 12, 2), round_half_up.
      - name: per_departure_rate_usd
        type: number
        source: computed
        description: round(monthly_entitlement_usd / ServicePeriod.scheduled_departures, 2), round_half_up; rounded BEFORE any multiplication.
      - name: credited_departures
        type: integer
        source: computed
        description: completed_departures plus weather cancellations credited up to the 5 percent allowance; 0 for the SCHEDULED_FLIGHT_FLAT variant.
        default: 0
      - name: gross_subsidy_usd
        type: number
        source: computed
        description: Variant-specific gross entitlement from calculations.subsidy_payment_amount.
      - name: cancellation_adjustment_usd
        type: number
        source: computed
        description: Variant-independent deduction for carrier cancellations above the 2 percent allowance.
      - name: withholding_pct
        type: number
        source: computed
        description: Performance withholding rate selected from the period completion-factor tier table.
        constraints: "one of 0.00 | 0.02 | 0.05 | 0.10"
      - name: performance_withholding_usd
        type: number
        source: computed
        description: round((gross_subsidy_usd - cancellation_adjustment_usd) * withholding_pct, 2).
      - name: net_payment_usd
        type: number
        source: computed
        description: round(gross_subsidy_usd - cancellation_adjustment_usd - performance_withholding_usd, 2); the amount booked against the obligation ledger.
      - name: hold_in_premium_usd
        type: number
        source: computed
        description: Hold-in premium from calculations.hold_in_premium; 0.00 unless ServiceAgreement.status == HOLD_IN at certification.
        default: 0.00
      - name: total_disbursement_usd
        type: number
        source: computed
        description: round(net_payment_usd + hold_in_premium_usd, 2); the cash actually paid out.
      - name: status
        type: enum
        source: system
        description: Payment lifecycle state; see §1.2 SubsidyPayment state machine.
        default: COMPUTED
        constraints: "COMPUTED | APPROVED | DISBURSED | REVERSED"
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin that ran the APPROVE action; null while status == COMPUTED.
        default: null
      - name: disbursed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin that ran the DISBURSE action; must differ from approved_by_user_id.
        default: null
      - name: reversal_reason_code
        type: enum
        source: system
        description: Reason recorded by the REVERSE action; null until reversal.
        default: null
        constraints: "AUDIT_FINDING | REPORTING_ERROR | OVERPAYMENT | null"

  - name: PerformanceReview
    parent: null
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> ServiceAgreement.id; the agreement reviewed.
      - name: basis
        type: enum
        source: input
        description: Which variant of calculations.carrier_completion_factor to apply.
        constraints: "STRICT | ADJUSTED"
      - name: window_start_month
        type: string
        source: input
        description: First month of the review window, YYYY-MM, inclusive.
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$; <= window_end_month"
      - name: window_end_month
        type: string
        source: input
        description: Last month of the review window, YYYY-MM, inclusive.
        constraints: "matches ^[0-9]{4}-(0[1-9]|1[0-2])$"
      - name: months_in_window
        type: integer
        source: computed
        description: Inclusive calendar-month count between window_start_month and window_end_month.
        constraints: ">= 1"
      - name: included_period_count
        type: integer
        source: computed
        description: Count of ServicePeriod rows of agreement_id with period_month inside the window and status IN {CERTIFIED, PAID}.
      - name: sum_scheduled_departures
        type: integer
        source: computed
        description: Sum of scheduled_departures over the included periods.
      - name: sum_completed_departures
        type: integer
        source: computed
        description: Sum of completed_departures over the included periods.
      - name: sum_cancelled_weather_departures
        type: integer
        source: computed
        description: Sum of cancelled_weather_departures over the included periods.
      - name: sum_seats_offered
        type: integer
        source: computed
        description: Sum of seats_offered over the included periods.
      - name: sum_passengers_enplaned
        type: integer
        source: computed
        description: Sum of passengers_enplaned over the included periods.
      - name: completion_factor
        type: number
        source: computed
        description: Variant output of calculations.carrier_completion_factor, 4 decimal places.
      - name: seat_fulfillment
        type: number
        source: computed
        description: round(min(1.0, sum_seats_offered / (ServiceAgreement.min_monthly_seats * months_in_window)), 4).
      - name: load_factor
        type: number
        source: computed
        description: round(sum_passengers_enplaned / sum_seats_offered, 4).
      - name: quality_score
        type: number
        source: computed
        description: Weighted service-quality score from calculations.carrier_performance_scoring, 2 decimal places.
      - name: tier
        type: enum
        source: computed
        description: Compliance tier selected from completion_factor.
        constraints: "COMPLIANT | WATCH | DEFICIENT"
      - name: action_taken
        type: enum
        source: computed
        description: Enforcement action the review triggered.
        constraints: "NONE | CARRIER_PLACED_ON_PROBATION | AGREEMENT_SUSPENDED_AND_HOLD_IN"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin that created the review.

  - name: TerminationPetition
    parent: null
    common_fields: true
    fields:
      - name: community_id
        type: string
        source: input
        description: FK -> Community.id; the petitioning community. Must equal the X-User-ID of the acting CommunityRepresentative.
      - name: agreement_id
        type: string
        source: input
        description: FK -> ServiceAgreement.id; the agreement the community asks to end. Its community_id must equal community_id.
      - name: reason_code
        type: enum
        source: input
        description: Statutory ground for the petition; AIRPORT_CLOSURE exempts the petition from the replacement-carrier hold-in requirement.
        constraints: "SERVICE_QUALITY | COMMUNITY_PREFERENCE_CHANGE | CARRIER_NONPERFORMANCE | AIRPORT_CLOSURE"
      - name: narrative
        type: string
        source: input
        description: Supporting narrative supplied by the community.
        constraints: "1..2000 chars"
      - name: requested_effective_at
        type: datetime
        source: input
        description: Instant at which the community wishes service to end; ISO 8601 UTC.
      - name: status
        type: enum
        source: system
        description: Petition lifecycle state; see §1.2 TerminationPetition state machine.
        default: FILED
        constraints: "FILED | UNDER_REVIEW | GRANTED_WITH_HOLD_IN | GRANTED_IMMEDIATE | DENIED | WITHDRAWN | CLOSED"
      - name: return_count
        type: integer
        source: computed
        description: Number of RETURN_FOR_INFO decisions applied to this petition.
        default: 0
      - name: decision_note
        type: string
        source: system
        description: Note recorded by the last decision action.
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the SelectionOfficer that recorded the terminal decision.
        default: null
      - name: filed_by_user_id
        type: string
        source: system
        description: X-User-ID of the CommunityRepresentative that filed the petition; equals community_id.

  - name: RateRenegotiation
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: FK -> ServiceAgreement.id; the agreement whose annual rate is being renegotiated.
      - name: trigger_type
        type: enum
        source: input
        description: Statutory ground for reopening the rate.
        constraints: "FUEL_INDEX | COST_INCREASE"
      - name: fuel_index_month
        type: string
        source: input
        description: YYYY-MM of the FuelIndex row used as the current price; required when trigger_type == FUEL_INDEX, must be omitted otherwise.
        default: null
      - name: documented_cost_increase_pct
        type: number
        source: input
        description: Documented non-fuel cost increase as a fraction of the current annual rate; required when trigger_type == COST_INCREASE, must be omitted otherwise.
        default: null
        constraints: ">= 0.0000, 4 decimal places"
      - name: requested_annual_subsidy_usd
        type: number
        source: input
        description: Annual subsidy the carrier asks for.
        constraints: "> 0.00, 2 decimal places"
      - name: justification
        type: string
        source: input
        description: Narrative justification filed with the request.
        constraints: "1..2000 chars"
      - name: current_fuel_index_usd
        type: number
        source: computed
        description: price_per_gallon_usd of the FuelIndex named by fuel_index_month; null when trigger_type == COST_INCREASE.
        default: null
      - name: fuel_cost_delta_usd
        type: number
        source: computed
        description: Annualized fuel cost change from calculations.renegotiated_annual_subsidy; null when trigger_type == COST_INCREASE.
        default: null
      - name: justified_delta_usd
        type: number
        source: computed
        description: Trigger-specific justified annual delta before the cap and floor are applied.
      - name: ceiling_annual_subsidy_usd
        type: number
        source: computed
        description: Highest annual rate the program will approve for this request; recomputed on every REVISE.
      - name: countered_annual_subsidy_usd
        type: number
        source: system
        description: Program counter-offer recorded by the COUNTER action.
        default: null
      - name: approved_annual_subsidy_usd
        type: number
        source: computed
        description: min(ceiling_annual_subsidy_usd, requested_annual_subsidy_usd), written by the ACCEPT action; null otherwise.
        default: null
      - name: revision_count
        type: integer
        source: computed
        description: Number of accepted REVISE actions; a fourth REVISE is refused.
        default: 0
      - name: status
        type: enum
        source: system
        description: Renegotiation lifecycle state; see §1.2 RateRenegotiation state machine.
        default: REQUESTED
        constraints: "REQUESTED | COUNTERED | ACCEPTED | REJECTED | WITHDRAWN"
      - name: effective_at
        type: datetime
        source: system
        description: Logical clock value when the ACCEPT action ran; null otherwise.
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Community
    initial_state: REGISTERED
    terminal_states: [TERMINATED]
    transitions:
      - from: REGISTERED
        to: ELIGIBLE
        trigger: "POST /eas/communities/{id}/eligibility-determinations"
        actor: EligibilityAnalyst
        preconditions:
          - "computed outcome IN {ELIGIBLE, ELIGIBLE_WITH_WAIVER}"
        side_effects:
          - "creates an EligibilityDetermination row with certified_by_user_id set to the acting X-User-ID"
          - "writes Community.distance_band, Community.subsidy_per_passenger_cap_usd and Community.latest_determination_outcome from the new determination"
      - from: REGISTERED
        to: INELIGIBLE
        trigger: "POST /eas/communities/{id}/eligibility-determinations"
        actor: EligibilityAnalyst
        preconditions:
          - "computed outcome IN {INELIGIBLE_DISTANCE, INELIGIBLE_ENPLANEMENTS}"
        side_effects:
          - "creates an EligibilityDetermination row"
          - "writes Community.distance_band and Community.latest_determination_outcome"
      - from: INELIGIBLE
        to: ELIGIBLE
        trigger: "POST /eas/communities/{id}/eligibility-determinations"
        actor: EligibilityAnalyst
        preconditions:
          - "computed outcome IN {ELIGIBLE, ELIGIBLE_WITH_WAIVER}"
        side_effects:
          - "writes Community.distance_band, Community.subsidy_per_passenger_cap_usd and Community.latest_determination_outcome"
        note: "Re-determination after a waiver request or a corrected enplanement count."
      - from: ELIGIBLE
        to: INELIGIBLE
        trigger: "POST /eas/communities/{id}/eligibility-determinations"
        actor: EligibilityAnalyst
        preconditions:
          - "computed outcome IN {INELIGIBLE_DISTANCE, INELIGIBLE_ENPLANEMENTS}"
        side_effects:
          - "writes Community.latest_determination_outcome"
      - from: ELIGIBLE
        to: SUBSIDIZED
        trigger: "POST /eas/solicitations/{id}/selection-order (system cascade)"
        actor: system
        preconditions:
          - "a ServiceAgreement with community_id == this Community.id reached status == ACTIVE"
        side_effects:
          - "increments Community.active_agreement_count by 1"
      - from: HOLD_IN
        to: SUBSIDIZED
        trigger: "POST /eas/solicitations/{id}/selection-order on the REPLACEMENT solicitation (system cascade)"
        actor: system
        preconditions:
          - "the newly awarded ServiceAgreement has predecessor_agreement_id equal to the id of this Community's HOLD_IN agreement"
        side_effects:
          - "increments Community.active_agreement_count by 1"
        note: "Closes the HOLD_IN cycle: SUBSIDIZED -> HOLD_IN -> SUBSIDIZED."
      - from: SUBSIDIZED
        to: SUBSIDIZED
        trigger: "POST /eas/solicitations/{id}/selection-order on a further solicitation (system cascade)"
        actor: system
        preconditions:
          - "an additional ServiceAgreement with community_id == this Community.id reached status == ACTIVE while the community was already SUBSIDIZED"
        side_effects:
          - "increments Community.active_agreement_count by 1"
        note: "A community may hold more than one ACTIVE agreement provided the half-open rate intervals do not intersect (§1.4 priority 18)."
      - from: SUBSIDIZED
        to: HOLD_IN
        trigger: "POST /eas/termination-petitions/{id}/decision with action == GRANT_WITH_HOLD_IN (system cascade)"
        actor: system
        preconditions:
          - "the petition's ServiceAgreement moved ACTIVE -> HOLD_IN"
        side_effects:
          - "decrements Community.active_agreement_count by 1"
          - "creates a Solicitation for this Community with created_reason == REPLACEMENT, status == OPEN, round_number == 1 and closes_at equal to the logical clock plus 60 days"
      - from: SUBSIDIZED
        to: HOLD_IN
        trigger: "POST /eas/performance-reviews producing tier == DEFICIENT (system cascade)"
        actor: system
        preconditions:
          - "the reviewed ServiceAgreement moved ACTIVE -> SUSPENDED because its Carrier moved to SUSPENDED"
        side_effects:
          - "decrements Community.active_agreement_count by 1"
          - "creates a Solicitation for this Community with created_reason == REPLACEMENT, status == OPEN, round_number == 1 and closes_at equal to the logical clock plus 60 days"
      - from: SUBSIDIZED
        to: ELIGIBLE
        trigger: "POST /eas/termination-petitions/{id}/decision with action == GRANT_IMMEDIATE, or POST /eas/service-agreements/{id}/status-actions with action == TERMINATE (system cascade)"
        actor: system
        preconditions:
          - "the Community's last ServiceAgreement with status IN {ACTIVE, HOLD_IN, SUSPENDED} moved to TERMINATED, so Community.active_agreement_count becomes 0"
          - "Community.latest_determination_outcome IN {ELIGIBLE, ELIGIBLE_WITH_WAIVER}"
        side_effects:
          - "decrements Community.active_agreement_count by 1"
        note: "The community keeps its eligibility and may be solicited again."
      - from: SUBSIDIZED
        to: TERMINATED
        trigger: "POST /eas/termination-petitions/{id}/decision with action == GRANT_IMMEDIATE, or POST /eas/service-agreements/{id}/status-actions with action == TERMINATE (system cascade)"
        actor: system
        preconditions:
          - "the Community's last ServiceAgreement with status IN {ACTIVE, HOLD_IN, SUSPENDED} moved to TERMINATED, so Community.active_agreement_count becomes 0"
          - "Community.latest_determination_outcome IN {INELIGIBLE_DISTANCE, INELIGIBLE_ENPLANEMENTS}"
        side_effects:
          - "decrements Community.active_agreement_count by 1"

  - entity: Carrier
    initial_state: ACTIVE
    terminal_states: [DEBARRED]
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "POST /eas/carriers/{id}/standing with action == PLACE_ON_PROBATION"
        actor: ProgramAdmin
        preconditions:
          - "Carrier.status == ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: PROBATION
        trigger: "POST /eas/performance-reviews producing tier == WATCH with resulting consecutive_watch_count >= 2 (system cascade)"
        actor: system
        preconditions:
          - "Carrier.status == ACTIVE"
          - "Carrier.consecutive_watch_count after this review is >= 2"
        side_effects:
          - "sets PerformanceReview.action_taken to CARRIER_PLACED_ON_PROBATION"
      - from: PROBATION
        to: ACTIVE
        trigger: "POST /eas/carriers/{id}/standing with action == REINSTATE"
        actor: ProgramAdmin
        preconditions:
          - "Carrier.status == PROBATION"
        side_effects:
          - "resets Carrier.consecutive_watch_count to 0"
        note: "Cycle ACTIVE -> PROBATION -> ACTIVE."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /eas/carriers/{id}/standing with action == SUSPEND"
        actor: ProgramAdmin
        preconditions:
          - "Carrier.status IN {ACTIVE, PROBATION}"
        side_effects:
          - "every ServiceAgreement with carrier_id == this Carrier.id and status == ACTIVE moves ACTIVE -> SUSPENDED"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /eas/carriers/{id}/standing with action == SUSPEND"
        actor: ProgramAdmin
        preconditions:
          - "Carrier.status IN {ACTIVE, PROBATION}"
        side_effects:
          - "every ServiceAgreement with carrier_id == this Carrier.id and status == ACTIVE moves ACTIVE -> SUSPENDED"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /eas/performance-reviews producing tier == DEFICIENT (system cascade)"
        actor: system
        preconditions:
          - "Carrier.status IN {ACTIVE, PROBATION}"
        side_effects:
          - "sets PerformanceReview.action_taken to AGREEMENT_SUSPENDED_AND_HOLD_IN"
          - "the reviewed ServiceAgreement moves ACTIVE -> SUSPENDED, which in turn moves its Community SUBSIDIZED -> HOLD_IN"
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /eas/performance-reviews producing tier == DEFICIENT (system cascade)"
        actor: system
        preconditions:
          - "Carrier.status IN {ACTIVE, PROBATION}"
        side_effects:
          - "sets PerformanceReview.action_taken to AGREEMENT_SUSPENDED_AND_HOLD_IN"
          - "the reviewed ServiceAgreement moves ACTIVE -> SUSPENDED, which in turn moves its Community SUBSIDIZED -> HOLD_IN"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /eas/carriers/{id}/standing with action == REINSTATE"
        actor: ProgramAdmin
        preconditions:
          - "Carrier.status == SUSPENDED"
        side_effects:
          - "resets Carrier.consecutive_watch_count to 0"
        note: "Suspended agreements are NOT auto-reactivated; each requires POST /eas/service-agreements/{id}/status-actions with action == REINSTATE."
      - from: ACTIVE
        to: DEBARRED
        trigger: "POST /eas/carriers/{id}/standing with action == DEBAR"
        actor: ProgramAdmin
        preconditions:
          - "Carrier.status IN {ACTIVE, PROBATION, SUSPENDED}"
        side_effects:
          - "every Proposal of this Carrier with submission_state == DRAFT moves DRAFT -> WITHDRAWN"
      - from: PROBATION
        to: DEBARRED
        trigger: "POST /eas/carriers/{id}/standing with action == DEBAR"
        actor: ProgramAdmin
        preconditions:
          - "Carrier.status IN {ACTIVE, PROBATION, SUSPENDED}"
        side_effects:
          - "every Proposal of this Carrier with submission_state == DRAFT moves DRAFT -> WITHDRAWN"
      - from: SUSPENDED
        to: DEBARRED
        trigger: "POST /eas/carriers/{id}/standing with action == DEBAR"
        actor: ProgramAdmin
        preconditions:
          - "Carrier.status IN {ACTIVE, PROBATION, SUSPENDED}"
        side_effects:
          - "every Proposal of this Carrier with submission_state == DRAFT moves DRAFT -> WITHDRAWN"

  - entity: Solicitation
    initial_state: OPEN
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /eas/solicitations/{id}/actions with action == CLOSE"
        actor: ProgramAdmin
        preconditions:
          - "Solicitation.status == OPEN"
        side_effects:
          - "every Proposal of this Solicitation with submission_state == SUBMITTED and evaluation_state == NOT_EVALUATED moves NOT_EVALUATED -> UNDER_EVALUATION"
      - from: CLOSED
        to: OPEN
        trigger: "POST /eas/solicitations/{id}/actions with action == REOPEN"
        actor: ProgramAdmin
        preconditions:
          - "Solicitation.status == CLOSED"
        side_effects:
          - "increments Solicitation.round_number by 1"
          - "every Proposal of this Solicitation with evaluation_state == UNDER_EVALUATION moves UNDER_EVALUATION -> EXPIRED; submission_state is left untouched"
        note: "Cycle OPEN -> CLOSED -> OPEN. Preference filings already recorded are retained; Solicitation.preference_filing_count is NOT reset."
      - from: CLOSED
        to: AWARDED
        trigger: "POST /eas/solicitations/{id}/selection-order"
        actor: SelectionOfficer
        preconditions:
          - "Solicitation.status == CLOSED"
          - "the candidate set of calculations.carrier_selection_ranking is non-empty"
          - "the acting X-User-ID differs from certified_by_user_id of the community's latest EligibilityDetermination"
        side_effects:
          - "writes Proposal.composite_score on every candidate"
          - "the winning Proposal moves UNDER_EVALUATION -> SELECTED; every other candidate moves UNDER_EVALUATION -> NOT_SELECTED"
          - "writes Solicitation.selected_proposal_id and Solicitation.candidate_count_at_award"
          - "creates a ServiceAgreement with status == ACTIVE from the winning Proposal's terms"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /eas/solicitations/{id}/actions with action == CANCEL"
        actor: ProgramAdmin
        preconditions:
          - "Solicitation.status IN {OPEN, CLOSED}"
        side_effects:
          - "every Proposal of this Solicitation with evaluation_state IN {NOT_EVALUATED, UNDER_EVALUATION} moves to EXPIRED"
      - from: CLOSED
        to: CANCELLED
        trigger: "POST /eas/solicitations/{id}/actions with action == CANCEL"
        actor: ProgramAdmin
        preconditions:
          - "Solicitation.status IN {OPEN, CLOSED}"
        side_effects:
          - "every Proposal of this Solicitation with evaluation_state IN {NOT_EVALUATED, UNDER_EVALUATION} moves to EXPIRED"

  - entity: Proposal
    dimension: submission_state
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /eas/proposals/{id}/actions with action == SUBMIT"
        actor: Carrier
        preconditions:
          - "Proposal.submission_state == DRAFT"
          - "Solicitation.status == OPEN"
          - "the logical clock is at or before Solicitation.closes_at"
          - "Carrier.status IN {ACTIVE, PROBATION}"
          - "AircraftType.is_retired == false"
          - "Proposal.weekly_round_trips >= Community.min_required_weekly_round_trips"
          - "Proposal.weekly_round_trips * 2 * Proposal.seats_per_departure >= Community.min_required_weekly_seats"
          - "Community.subsidy_per_passenger_cap_usd is null OR Proposal.subsidy_per_passenger_usd <= Community.subsidy_per_passenger_cap_usd"
        side_effects: []
        note: "This dimension is independent of evaluation_state; a SUBMITTED proposal is still NOT_EVALUATED until the solicitation closes."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /eas/proposals/{id}/actions with action == WITHDRAW"
        actor: Carrier
        preconditions:
          - "Proposal.submission_state IN {DRAFT, SUBMITTED}"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /eas/proposals/{id}/actions with action == WITHDRAW"
        actor: Carrier
        preconditions:
          - "Proposal.submission_state IN {DRAFT, SUBMITTED}"
        side_effects: []
        note: "evaluation_state is deliberately NOT changed by withdrawal; a proposal can sit at submission_state == WITHDRAWN while evaluation_state is still UNDER_EVALUATION, and calculations.carrier_selection_ranking excludes it because its candidate filter requires submission_state == SUBMITTED."

  - entity: Proposal
    dimension: evaluation_state
    initial_state: NOT_EVALUATED
    terminal_states: [SELECTED, NOT_SELECTED, EXPIRED]
    transitions:
      - from: NOT_EVALUATED
        to: UNDER_EVALUATION
        trigger: "POST /eas/solicitations/{id}/actions with action == CLOSE (system cascade)"
        actor: system
        preconditions:
          - "Proposal.submission_state == SUBMITTED"
        side_effects: []
      - from: UNDER_EVALUATION
        to: SELECTED
        trigger: "POST /eas/solicitations/{id}/selection-order (system cascade)"
        actor: system
        preconditions:
          - "this Proposal has the greatest composite_score in the candidate set under calculations.carrier_selection_ranking"
        side_effects:
          - "creates the ServiceAgreement whose proposal_id is this Proposal.id"
      - from: UNDER_EVALUATION
        to: NOT_SELECTED
        trigger: "POST /eas/solicitations/{id}/selection-order (system cascade)"
        actor: system
        preconditions:
          - "this Proposal is in the candidate set but is not the winner"
        side_effects: []
      - from: UNDER_EVALUATION
        to: EXPIRED
        trigger: "POST /eas/solicitations/{id}/actions with action IN {REOPEN, CANCEL} (system cascade)"
        actor: system
        preconditions:
          - "the parent Solicitation left status == CLOSED without awarding this Proposal"
        side_effects: []
      - from: NOT_EVALUATED
        to: EXPIRED
        trigger: "POST /eas/solicitations/{id}/actions with action == CANCEL (system cascade)"
        actor: system
        preconditions:
          - "the parent Solicitation moved to status == CANCELLED"
        side_effects: []

  - entity: ServiceAgreement
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: HOLD_IN
        trigger: "POST /eas/termination-petitions/{id}/decision with action == GRANT_WITH_HOLD_IN"
        actor: SelectionOfficer
        preconditions:
          - "ServiceAgreement.status == ACTIVE"
          - "TerminationPetition.status == UNDER_REVIEW"
        side_effects:
          - "sets TerminationPetition.status to GRANTED_WITH_HOLD_IN"
          - "the Community moves SUBSIDIZED -> HOLD_IN, which in turn creates a Solicitation with created_reason == REPLACEMENT"
        note: "The carrier must keep flying at the HOLD_IN premium rate until a replacement carrier is secured."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /eas/service-agreements/{id}/status-actions with action == SUSPEND"
        actor: ProgramAdmin
        preconditions:
          - "ServiceAgreement.status == ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /eas/performance-reviews producing tier == DEFICIENT (system cascade)"
        actor: system
        preconditions:
          - "ServiceAgreement.status == ACTIVE"
          - "the Carrier moved to status == SUSPENDED as a result of this review"
        side_effects:
          - "the Community moves SUBSIDIZED -> HOLD_IN, which in turn creates a Solicitation with created_reason == REPLACEMENT"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /eas/service-agreements/{id}/status-actions with action == REINSTATE"
        actor: ProgramAdmin
        preconditions:
          - "ServiceAgreement.status == SUSPENDED"
          - "Carrier.status IN {ACTIVE, PROBATION}"
        side_effects:
          - "if the Community.status == HOLD_IN and this agreement is its only non-terminal agreement, the Community moves HOLD_IN -> SUBSIDIZED"
        note: "Cycle ACTIVE -> SUSPENDED -> ACTIVE, guarded on the Carrier's standing."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /eas/termination-petitions/{id}/decision with action == GRANT_IMMEDIATE"
        actor: SelectionOfficer
        preconditions:
          - "ServiceAgreement.status == ACTIVE"
          - "TerminationPetition.reason_code == AIRPORT_CLOSURE OR the Community has another ServiceAgreement with status == ACTIVE"
        side_effects:
          - "sets ServiceAgreement.terminated_at to the logical clock value"
          - "sets TerminationPetition.status to GRANTED_IMMEDIATE"
          - "the Community moves SUBSIDIZED -> ELIGIBLE or SUBSIDIZED -> TERMINATED depending on Community.latest_determination_outcome"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /eas/service-agreements/{id}/status-actions with action == TERMINATE"
        actor: ProgramAdmin
        preconditions:
          - "ServiceAgreement.status IN {ACTIVE, SUSPENDED}"
          - "no ServicePeriod of this agreement has status IN {REPORTED, CERTIFIED}"
        side_effects:
          - "sets ServiceAgreement.terminated_at to the logical clock value"
          - "sets ServiceAgreement.total_committed_usd to round(disbursed_to_date_usd, 2) and ServiceAgreement.obligated_remaining_usd to 0.00, releasing the unspent obligation"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /eas/service-agreements/{id}/status-actions with action == TERMINATE"
        actor: ProgramAdmin
        preconditions:
          - "ServiceAgreement.status IN {ACTIVE, SUSPENDED}"
          - "no ServicePeriod of this agreement has status IN {REPORTED, CERTIFIED}"
        side_effects:
          - "sets ServiceAgreement.terminated_at to the logical clock value"
          - "sets ServiceAgreement.total_committed_usd to round(disbursed_to_date_usd, 2) and ServiceAgreement.obligated_remaining_usd to 0.00, releasing the unspent obligation"
      - from: HOLD_IN
        to: TERMINATED
        trigger: "POST /eas/solicitations/{id}/selection-order on the REPLACEMENT solicitation (system cascade)"
        actor: system
        preconditions:
          - "ServiceAgreement.status == HOLD_IN"
          - "a ServiceAgreement with predecessor_agreement_id == this ServiceAgreement.id reached status == ACTIVE"
        side_effects:
          - "sets ServiceAgreement.terminated_at to the logical clock value"
          - "sets ServiceAgreement.total_committed_usd to round(disbursed_to_date_usd, 2) and ServiceAgreement.obligated_remaining_usd to 0.00"
          - "the TerminationPetition with status == GRANTED_WITH_HOLD_IN for this agreement moves GRANTED_WITH_HOLD_IN -> CLOSED"
          - "the Community moves HOLD_IN -> SUBSIDIZED"
        note: "Hold-in release is impossible until the replacement agreement exists; this is the statutory hold-in requirement."

  - entity: ServicePeriod
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: REPORTED
        trigger: "POST /eas/service-periods/{id}/report"
        actor: Carrier
        preconditions:
          - "ServicePeriod.status == OPEN"
          - "ServiceAgreement.status IN {ACTIVE, HOLD_IN}"
          - "scheduled_departures >= 1"
          - "completed_departures + cancelled_carrier_departures + cancelled_weather_departures == scheduled_departures"
        side_effects:
          - "writes ServicePeriod.period_completion_factor"
          - "adds this period's four counts into the ServiceAgreement cumulative_* fields"
      - from: REPORTED
        to: REPORTED
        trigger: "POST /eas/service-periods/{id}/amend"
        actor: Carrier
        preconditions:
          - "ServicePeriod.status == REPORTED"
          - "ServiceAgreement.version equals the request's expected_agreement_version"
          - "completed_departures + cancelled_carrier_departures + cancelled_weather_departures == scheduled_departures"
        side_effects:
          - "increments ServicePeriod.amendment_count by 1"
          - "subtracts the previous four counts from the ServiceAgreement cumulative_* fields and adds the new four, preserving invariant departure_count_conservation"
          - "increments ServiceAgreement.version by 1"
          - "rewrites ServicePeriod.period_completion_factor"
        note: "Self-loop; the amendment may be repeated."
      - from: REPORTED
        to: CERTIFIED
        trigger: "POST /eas/service-periods/{id}/certify"
        actor: ProgramAdmin
        preconditions:
          - "ServicePeriod.status == REPORTED"
          - "no earlier month of the same agreement has status == OPEN"
          - "round(monthly_entitlement_usd - cancellation_adjustment_usd, 2) <= ServiceAgreement.obligated_remaining_usd"
        side_effects:
          - "creates a SubsidyPayment with status == COMPUTED from calculations.subsidy_payment_amount"
          - "when ServiceAgreement.status == HOLD_IN, also writes SubsidyPayment.hold_in_premium_usd from calculations.hold_in_premium"
      - from: CERTIFIED
        to: PAID
        trigger: "POST /eas/subsidy-payments/{id}/actions with action == DISBURSE (system cascade)"
        actor: system
        preconditions:
          - "the SubsidyPayment of this period reached status == DISBURSED"
        side_effects: []
      - from: CERTIFIED
        to: REPORTED
        trigger: "POST /eas/subsidy-payments/{id}/actions with action == REVERSE (system cascade)"
        actor: system
        preconditions:
          - "the SubsidyPayment of this period moved APPROVED -> REVERSED"
        side_effects: []
      - from: PAID
        to: REPORTED
        trigger: "POST /eas/subsidy-payments/{id}/actions with action == REVERSE (system cascade)"
        actor: system
        preconditions:
          - "the SubsidyPayment of this period moved DISBURSED -> REVERSED"
        side_effects: []
        note: "Cycle REPORTED -> CERTIFIED -> PAID -> REPORTED; the period may be amended and re-certified after a reversal."

  - entity: SubsidyPayment
    initial_state: COMPUTED
    terminal_states: [REVERSED]
    transitions:
      - from: COMPUTED
        to: APPROVED
        trigger: "POST /eas/subsidy-payments/{id}/actions with action == APPROVE"
        actor: ProgramAdmin
        preconditions:
          - "SubsidyPayment.status == COMPUTED"
          - "ServicePeriod.status == CERTIFIED"
        side_effects:
          - "writes SubsidyPayment.approved_by_user_id from the acting X-User-ID"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /eas/subsidy-payments/{id}/actions with action == DISBURSE"
        actor: ProgramAdmin
        preconditions:
          - "SubsidyPayment.status == APPROVED"
          - "the acting X-User-ID differs from SubsidyPayment.approved_by_user_id"
          - "round(net_payment_usd, 2) <= ServiceAgreement.obligated_remaining_usd"
        side_effects:
          - "writes SubsidyPayment.disbursed_by_user_id from the acting X-User-ID"
          - "adds net_payment_usd to ServiceAgreement.disbursed_to_date_usd and recomputes ServiceAgreement.obligated_remaining_usd"
          - "adds hold_in_premium_usd to ServiceAgreement.hold_in_premium_paid_usd"
          - "the ServicePeriod moves CERTIFIED -> PAID"
      - from: APPROVED
        to: REVERSED
        trigger: "POST /eas/subsidy-payments/{id}/actions with action == REVERSE"
        actor: ProgramAdmin
        preconditions:
          - "SubsidyPayment.status IN {APPROVED, DISBURSED}"
        side_effects:
          - "writes SubsidyPayment.reversal_reason_code"
          - "the ServicePeriod moves CERTIFIED -> REPORTED"
      - from: DISBURSED
        to: REVERSED
        trigger: "POST /eas/subsidy-payments/{id}/actions with action == REVERSE"
        actor: ProgramAdmin
        preconditions:
          - "SubsidyPayment.status IN {APPROVED, DISBURSED}"
        side_effects:
          - "writes SubsidyPayment.reversal_reason_code"
          - "subtracts net_payment_usd from ServiceAgreement.disbursed_to_date_usd and recomputes ServiceAgreement.obligated_remaining_usd"
          - "subtracts hold_in_premium_usd from ServiceAgreement.hold_in_premium_paid_usd"
          - "the ServicePeriod moves PAID -> REPORTED"
        note: "Compensating action for the DISBURSE transition; invariant program_obligation_conservation must hold before and after."

  - entity: TerminationPetition
    initial_state: FILED
    terminal_states: [GRANTED_IMMEDIATE, DENIED, WITHDRAWN, CLOSED]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /eas/termination-petitions/{id}/decision with action == OPEN_REVIEW"
        actor: SelectionOfficer
        preconditions:
          - "TerminationPetition.status == FILED"
        side_effects: []
      - from: UNDER_REVIEW
        to: FILED
        trigger: "POST /eas/termination-petitions/{id}/decision with action == RETURN_FOR_INFO"
        actor: SelectionOfficer
        preconditions:
          - "TerminationPetition.status == UNDER_REVIEW"
        side_effects:
          - "increments TerminationPetition.return_count by 1"
          - "writes TerminationPetition.decision_note"
        note: "Cycle FILED -> UNDER_REVIEW -> FILED."
      - from: UNDER_REVIEW
        to: GRANTED_WITH_HOLD_IN
        trigger: "POST /eas/termination-petitions/{id}/decision with action == GRANT_WITH_HOLD_IN"
        actor: SelectionOfficer
        preconditions:
          - "TerminationPetition.status == UNDER_REVIEW"
          - "ServiceAgreement.status == ACTIVE"
        side_effects:
          - "the ServiceAgreement moves ACTIVE -> HOLD_IN"
          - "writes TerminationPetition.decided_by_user_id and decision_note"
      - from: UNDER_REVIEW
        to: GRANTED_IMMEDIATE
        trigger: "POST /eas/termination-petitions/{id}/decision with action == GRANT_IMMEDIATE"
        actor: SelectionOfficer
        preconditions:
          - "TerminationPetition.status == UNDER_REVIEW"
          - "ServiceAgreement.status == ACTIVE"
          - "TerminationPetition.reason_code == AIRPORT_CLOSURE OR the Community has another ServiceAgreement with status == ACTIVE"
        side_effects:
          - "the ServiceAgreement moves ACTIVE -> TERMINATED"
          - "writes TerminationPetition.decided_by_user_id and decision_note"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /eas/termination-petitions/{id}/decision with action == DENY"
        actor: SelectionOfficer
        preconditions:
          - "TerminationPetition.status == UNDER_REVIEW"
        side_effects:
          - "writes TerminationPetition.decided_by_user_id and decision_note"
      - from: GRANTED_WITH_HOLD_IN
        to: CLOSED
        trigger: "POST /eas/solicitations/{id}/selection-order on the REPLACEMENT solicitation (system cascade)"
        actor: system
        preconditions:
          - "the petition's ServiceAgreement moved HOLD_IN -> TERMINATED because a successor agreement reached status == ACTIVE"
        side_effects: []
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /eas/termination-petitions/{id}/withdraw"
        actor: CommunityRepresentative
        preconditions:
          - "TerminationPetition.status IN {FILED, UNDER_REVIEW}"
          - "the acting X-User-ID equals TerminationPetition.community_id"
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /eas/termination-petitions/{id}/withdraw"
        actor: CommunityRepresentative
        preconditions:
          - "TerminationPetition.status IN {FILED, UNDER_REVIEW}"
          - "the acting X-User-ID equals TerminationPetition.community_id"
        side_effects: []

  - entity: RateRenegotiation
    initial_state: REQUESTED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: COUNTERED
        trigger: "POST /eas/rate-renegotiations/{id}/actions with action == COUNTER"
        actor: ProgramAdmin
        preconditions:
          - "RateRenegotiation.status == REQUESTED"
        side_effects:
          - "writes RateRenegotiation.countered_annual_subsidy_usd to ceiling_annual_subsidy_usd"
      - from: COUNTERED
        to: REQUESTED
        trigger: "POST /eas/rate-renegotiations/{id}/actions with action == REVISE"
        actor: Carrier
        preconditions:
          - "RateRenegotiation.status == COUNTERED"
          - "RateRenegotiation.revision_count < 3"
          - "the acting X-User-ID equals ServiceAgreement.carrier_id"
        side_effects:
          - "increments RateRenegotiation.revision_count by 1"
          - "replaces RateRenegotiation.requested_annual_subsidy_usd with the revised amount and recomputes justified_delta_usd and ceiling_annual_subsidy_usd"
        note: "Negotiation cycle REQUESTED -> COUNTERED -> REQUESTED, bounded at three revisions."
      - from: REQUESTED
        to: ACCEPTED
        trigger: "POST /eas/rate-renegotiations/{id}/actions with action == ACCEPT"
        actor: ProgramAdmin
        preconditions:
          - "RateRenegotiation.status IN {REQUESTED, COUNTERED}"
          - "ServiceAgreement.status IN {ACTIVE, HOLD_IN}"
        side_effects:
          - "writes RateRenegotiation.approved_annual_subsidy_usd and effective_at"
          - "replaces ServiceAgreement.annual_subsidy_usd, advances ServiceAgreement.rate_effective_from to the logical clock value, and re-books ServiceAgreement.total_committed_usd and obligated_remaining_usd per calculations.agreement_obligation_ledger"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /eas/rate-renegotiations/{id}/actions with action == ACCEPT"
        actor: ProgramAdmin
        preconditions:
          - "RateRenegotiation.status IN {REQUESTED, COUNTERED}"
          - "ServiceAgreement.status IN {ACTIVE, HOLD_IN}"
        side_effects:
          - "writes RateRenegotiation.approved_annual_subsidy_usd and effective_at"
          - "replaces ServiceAgreement.annual_subsidy_usd, advances ServiceAgreement.rate_effective_from to the logical clock value, and re-books ServiceAgreement.total_committed_usd and obligated_remaining_usd per calculations.agreement_obligation_ledger"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /eas/rate-renegotiations/{id}/actions with action == REJECT"
        actor: ProgramAdmin
        preconditions:
          - "RateRenegotiation.status IN {REQUESTED, COUNTERED}"
        side_effects: []
      - from: COUNTERED
        to: REJECTED
        trigger: "POST /eas/rate-renegotiations/{id}/actions with action == REJECT"
        actor: ProgramAdmin
        preconditions:
          - "RateRenegotiation.status IN {REQUESTED, COUNTERED}"
        side_effects: []
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /eas/rate-renegotiations/{id}/actions with action == WITHDRAW"
        actor: Carrier
        preconditions:
          - "RateRenegotiation.status IN {REQUESTED, COUNTERED}"
          - "the acting X-User-ID equals ServiceAgreement.carrier_id"
        side_effects: []
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "POST /eas/rate-renegotiations/{id}/actions with action == WITHDRAW"
        actor: Carrier
        preconditions:
          - "RateRenegotiation.status IN {REQUESTED, COUNTERED}"
          - "the acting X-User-ID equals ServiceAgreement.carrier_id"
        side_effects: []

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: preference-filing-stale-solicitation
    parent_entity: Solicitation
    write_endpoint: "POST /eas/solicitations/{id}/preferences"
    occ_field: "expected_solicitation_version"
    description: |
      Filing a community preference ranking against a Solicitation whose version has
      advanced since the client last read it is rejected. A later filing legitimately
      supersedes the prior one (calculations.carrier_selection_ranking reads only the rows
      whose filing_sequence equals Solicitation.preference_filing_count), so a writer whose
      view of the solicitation is stale must re-read before re-filing rather than silently
      overwrite the ranking that is now in force.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: period-amend-stale-agreement
    parent_entity: ServiceAgreement
    write_endpoint: "POST /eas/service-periods/{id}/amend"
    occ_field: "expected_agreement_version"
    description: |
      Amending a ServicePeriod's reported departure counts is rejected when the parent
      ServiceAgreement's version has advanced since the client last read it. An amendment
      legitimately supersedes the previously reported figures and re-bases the agreement's
      cumulative_* counters, so a stale view of the agreement would re-base from counters
      that no longer reflect the ledger.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: community_eligibility_assessment
    trigger: "On POST /eas/communities/{id}/eligibility-determinations, before the Community state transition."
    algorithm: threshold
    formula: |
      D = Community.driving_miles_to_nearest_hub
      E = Community.enplanements_prior_year

      # 1. Distance band — lower bound EXCLUSIVE, cap-exemption bound INCLUSIVE
      if D < MIN_DISTANCE_FROM_HUB_MILES:            distance_band = TOO_CLOSE
      elif D < CAP_EXEMPTION_DISTANCE_MILES:         distance_band = CAPPED
      else:                                          distance_band = UNCAPPED
      # D exactly 70.0 -> CAPPED (>= 70 qualifies); D exactly 210.0 -> UNCAPPED (>= 210 exempt)

      # 2. Enplanement floor
      avg_daily_enplanements = round(E / 365, 2)     # round_half_up

      # 3. Outcome
      if distance_band == TOO_CLOSE:
          outcome = INELIGIBLE_DISTANCE
      elif avg_daily_enplanements >= MIN_AVG_DAILY_ENPLANEMENTS:
          outcome = ELIGIBLE
      elif Community.waiver_requested_on_this_request == true:
          outcome = ELIGIBLE_WITH_WAIVER
      else:
          outcome = INELIGIBLE_ENPLANEMENTS

      # 4. Per-passenger cap
      if distance_band == CAPPED: subsidy_per_passenger_cap_usd = SUBSIDY_PER_PASSENGER_CAP_USD
      else:                       subsidy_per_passenger_cap_usd = null
    input_set: "Exactly one Community row, read at request time; no other entity participates. The distance check is evaluated before the enplanement check, so a TOO_CLOSE community never reports INELIGIBLE_ENPLANEMENTS."
    constants:
      MIN_DISTANCE_FROM_HUB_MILES: 70
      CAP_EXEMPTION_DISTANCE_MILES: 210
      MIN_AVG_DAILY_ENPLANEMENTS: 10
      SUBSIDY_PER_PASSENGER_CAP_USD: 200.00
    precision: "avg_daily_enplanements 2 decimal places, round_half_up; cap 2 decimal places"

  - name: proposal_subsidy_per_passenger
    trigger: "On POST /eas/proposals (creation), and re-run on POST /eas/proposals/{id}/actions with action == SUBMIT to re-evaluate the cap."
    algorithm: threshold
    formula: |
      projected_annual_passengers =
          floor(weekly_round_trips * 2 * seats_per_departure * WEEKS_PER_YEAR * ASSUMED_LOAD_FACTOR)
      subsidy_per_passenger_usd =
          round(annual_subsidy_request_usd / projected_annual_passengers, 2)   # round_half_up

      # Cap gate applied at SUBMIT only (Community.subsidy_per_passenger_cap_usd may be null):
      if Community.subsidy_per_passenger_cap_usd is not null
         and subsidy_per_passenger_usd > Community.subsidy_per_passenger_cap_usd:
          reject with ERR_SUBSIDY_PER_PASSENGER_CAP_EXCEEDED
      # Equality passes: subsidy_per_passenger_usd == 200.00 is accepted.
    input_set: "The single Proposal row under write plus the Community reached through Proposal.solicitation_id -> Solicitation.community_id."
    constants:
      WEEKS_PER_YEAR: 52
      ASSUMED_LOAD_FACTOR: 0.375
    precision: "projected_annual_passengers is an integer produced by floor(); subsidy_per_passenger_usd 2 decimal places, round_half_up"

  - name: carrier_selection_ranking
    trigger: "On POST /eas/solicitations/{id}/selection-order, and read-only on GET /eas/solicitations/{id}/ranking."
    algorithm: weighted_scoring
    formula: |
      # (a) Candidate set — explicit eligibility filter
      candidates = { p in Proposal :
                       p.solicitation_id == solicitation.id
                       and p.submission_state == SUBMITTED
                       and p.evaluation_state == UNDER_EVALUATION
                       and Carrier(p.carrier_id).status IN {ACTIVE, PROBATION} }
      if candidates is empty: reject with ERR_NO_ELIGIBLE_PROPOSALS      # (d) empty-set fallback

      # (b) Ranking expression
      best_spp = min(p.subsidy_per_passenger_usd for p in candidates)
      for p in candidates:
          subsidy_points = round(100 * best_spp / p.subsidy_per_passenger_usd, 4)
          service_points = round(100 * min(1.0,
                              p.weekly_round_trips / community.min_required_weekly_round_trips), 4)

          # preference input: ONLY rows of the current filing
          current = { cp in CommunityPreference :
                        cp.solicitation_id == solicitation.id
                        and cp.filing_sequence == solicitation.preference_filing_count }
          N = count(current)
          if N == 0 or no row in current has proposal_id == p.id:
              preference_points = 0.0000
          else:
              rank = the rank of the row in current with proposal_id == p.id
              preference_points = round(100 * (N - rank + 1) / N, 4)

          p.composite_score = round(  WEIGHT_PREFERENCE * preference_points
                                    + WEIGHT_SUBSIDY    * subsidy_points
                                    + WEIGHT_SERVICE    * service_points, 4)

      # (c) Sort and tie-break — never uses id
      winner = candidates sorted by (composite_score DESC,
                                     annual_subsidy_request_usd ASC,
                                     weekly_round_trips DESC,
                                     created_at ASC) [0]
    input_set: "Proposal rows of this Solicitation with submission_state == SUBMITTED and evaluation_state == UNDER_EVALUATION whose Carrier.status IN {ACTIVE, PROBATION}; CommunityPreference rows of this Solicitation whose filing_sequence == Solicitation.preference_filing_count (earlier filings are superseded and contribute nothing); the Community for min_required_weekly_round_trips."
    constants:
      WEIGHT_PREFERENCE: 0.40
      WEIGHT_SUBSIDY: 0.35
      WEIGHT_SERVICE: 0.25
    precision: "each component 4 decimal places round_half_up, composite_score 4 decimal places round_half_up; components are rounded BEFORE the weighted sum"

  - name: subsidy_payment_amount
    trigger: "On POST /eas/service-periods/{id}/certify, creating the SubsidyPayment."
    algorithm: tiered_pricing
    formula: |
      S = ServicePeriod.scheduled_departures            # must be >= 1
      C = ServicePeriod.completed_departures
      XC = ServicePeriod.cancelled_carrier_departures   # carrier-controllable
      XW = ServicePeriod.cancelled_weather_departures   # excusable

      # STEP 1 — pinned rounding order: the per-departure rate is rounded to cents FIRST,
      # then multiplied. "Sum then round" is NOT used and would differ in cents.
      monthly_entitlement_usd = round(ServiceAgreement.annual_subsidy_usd / 12, 2)
      per_departure_rate_usd  = round(monthly_entitlement_usd / S, 2)

      # STEP 2 — variant-specific gross
      if variant == COMPLETED_FLIGHT_PRORATION:
          weather_allowance   = floor(S * WEATHER_CREDIT_ALLOWANCE_PCT / 100)
          credited_departures = C + min(XW, weather_allowance)
          gross_subsidy_usd   = round(per_departure_rate_usd * credited_departures, 2)
      else:   # SCHEDULED_FLIGHT_FLAT
          credited_departures = 0
          gross_subsidy_usd   = round(monthly_entitlement_usd - per_departure_rate_usd * XC, 2)

      # STEP 3 — variant-independent cancellation adjustment
      carrier_allowance = floor(S * CARRIER_CANCEL_ALLOWANCE_PCT / 100)
      excess_carrier    = max(0, XC - carrier_allowance)
      cancellation_adjustment_usd =
          round(per_departure_rate_usd * excess_carrier * CANCELLATION_PENALTY_RATE, 2)
      if cancellation_adjustment_usd > round(monthly_entitlement_usd * ADJUSTMENT_CAP_PCT, 2):
          reject with ERR_ADJUSTMENT_EXCEEDS_CAP

      # STEP 4 — performance withholding, tiered on the period completion factor
      cf = ServicePeriod.period_completion_factor
      if   cf >= 0.9500: withholding_pct = 0.00
      elif cf >= 0.9000: withholding_pct = 0.02
      elif cf >= 0.8500: withholding_pct = 0.05
      else:              withholding_pct = 0.10
      performance_withholding_usd =
          round((gross_subsidy_usd - cancellation_adjustment_usd) * withholding_pct, 2)

      net_payment_usd = round(gross_subsidy_usd
                              - cancellation_adjustment_usd
                              - performance_withholding_usd, 2)
    input_set: "The single ServicePeriod being certified (status == REPORTED) plus its ServiceAgreement; no other period contributes. The variant is ServiceAgreement.payment_basis in force at certification time."
    constants:
      WEATHER_CREDIT_ALLOWANCE_PCT: 5
      CARRIER_CANCEL_ALLOWANCE_PCT: 2
      CANCELLATION_PENALTY_RATE: 0.50
      ADJUSTMENT_CAP_PCT: 0.25
    precision: "all money 2 decimal places, round_half_up; per_departure_rate_usd is rounded to cents before any multiplication (pinned order)"
    variants:
      - name: COMPLETED_FLIGHT_PRORATION
        when: "ServiceAgreement.payment_basis == COMPLETED_FLIGHT_PRORATION"
        difference: "Pays per departure actually flown, crediting excusable weather cancellations only up to 5 percent of scheduled departures; unflown departures beyond that allowance earn nothing."
      - name: SCHEDULED_FLIGHT_FLAT
        when: "ServiceAgreement.payment_basis == SCHEDULED_FLIGHT_FLAT"
        difference: "Pays the full monthly entitlement less the per-departure rate for each carrier-controllable cancellation; weather cancellations are fully paid and the allowance is irrelevant, so identical period data yields a different gross and net."

  - name: hold_in_premium
    trigger: "On POST /eas/service-periods/{id}/certify when ServiceAgreement.status == HOLD_IN."
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency resolved by a PINNED evaluation order:
      # the premium tier is keyed on the PRE-PREMIUM net payment, never on the
      # post-premium total. total_disbursement_usd is computed LAST.
      base = SubsidyPayment.net_payment_usd            # from subsidy_payment_amount, STEP 4
      if   base >= HOLD_IN_TIER_HIGH_USD: premium_rate = 0.03
      elif base >= HOLD_IN_TIER_MID_USD:  premium_rate = 0.05
      else:                               premium_rate = 0.08
      hold_in_premium_usd     = round(base * premium_rate, 2)
      total_disbursement_usd  = round(base + hold_in_premium_usd, 2)
      # For agreements not in HOLD_IN: hold_in_premium_usd = 0.00 and
      # total_disbursement_usd = net_payment_usd.
    input_set: "The SubsidyPayment being created and its ServiceAgreement.status at certification time."
    constants:
      HOLD_IN_TIER_HIGH_USD: 120000.00
      HOLD_IN_TIER_MID_USD: 100000.00
    precision: "2 decimal places, round_half_up"

  - name: carrier_completion_factor
    trigger: "On POST /eas/performance-reviews, producing PerformanceReview.completion_factor and tier."
    algorithm: aggregation
    formula: |
      periods = { sp in ServicePeriod :
                    sp.agreement_id == review.agreement_id
                    and window_start_month <= sp.period_month <= window_end_month   # both INCLUSIVE
                    and sp.status IN {CERTIFIED, PAID} }
      sum_scheduled = sum(sp.scheduled_departures for sp in periods)
      sum_completed = sum(sp.completed_departures for sp in periods)
      sum_weather   = sum(sp.cancelled_weather_departures for sp in periods)
      if sum_scheduled == 0: reject with ERR_NO_SCHEDULED_DEPARTURES

      if basis == STRICT:
          completion_factor = round(sum_completed / sum_scheduled, 4)
      else:  # ADJUSTED
          denominator = sum_scheduled - sum_weather
          if denominator == 0: reject with ERR_NO_SCHEDULED_DEPARTURES
          completion_factor = round(sum_completed / denominator, 4)

      if   completion_factor >= TIER_COMPLIANT_MIN: tier = COMPLIANT
      elif completion_factor >= TIER_WATCH_MIN:     tier = WATCH
      else:                                         tier = DEFICIENT
    input_set: "ServicePeriod rows of the reviewed ServiceAgreement whose period_month lies inside the inclusive window and whose status IN {CERTIFIED, PAID}. Periods still OPEN or REPORTED are excluded, so a reversal that pushes a period back to REPORTED removes it from the review basis."
    constants:
      TIER_COMPLIANT_MIN: 0.9500
      TIER_WATCH_MIN: 0.9000
    precision: "4 decimal places, round_half_up"
    variants:
      - name: STRICT
        when: "PerformanceReview.basis == STRICT"
        difference: "Divides by every scheduled departure, charging weather cancellations against the carrier."
      - name: ADJUSTED
        when: "PerformanceReview.basis == ADJUSTED"
        difference: "Removes excusable weather cancellations from the denominator, so identical period data can move the carrier a whole tier — WATCH under STRICT, COMPLIANT under ADJUSTED — and therefore changes whether enforcement fires."

  - name: carrier_performance_scoring
    trigger: "On POST /eas/performance-reviews, after carrier_completion_factor, producing PerformanceReview.quality_score."
    algorithm: weighted_scoring
    formula: |
      months_in_window = inclusive count of calendar months from window_start_month to window_end_month
      sum_seats = sum(sp.seats_offered for sp in periods)          # same period set as carrier_completion_factor
      sum_pax   = sum(sp.passengers_enplaned for sp in periods)

      seat_fulfillment = round(min(1.0,
          sum_seats / (ServiceAgreement.min_monthly_seats * months_in_window)), 4)
      load_factor      = round(sum_pax / sum_seats, 4)
      normalized_load  = min(1.0, load_factor / TARGET_LOAD_FACTOR)

      quality_score = round(100 * (  QUALITY_WEIGHT_COMPLETION * completion_factor
                                   + QUALITY_WEIGHT_SEATS      * seat_fulfillment
                                   + QUALITY_WEIGHT_LOAD       * normalized_load), 2)

      # Enforcement, evaluated after tier is known:
      if tier == DEFICIENT:
          action_taken = AGREEMENT_SUSPENDED_AND_HOLD_IN
      elif tier == WATCH and Carrier.consecutive_watch_count (after this review) >= 2:
          action_taken = CARRIER_PLACED_ON_PROBATION
      else:
          action_taken = NONE
    input_set: "The same ServicePeriod set as carrier_completion_factor (status IN {CERTIFIED, PAID} inside the inclusive month window), plus ServiceAgreement.min_monthly_seats."
    constants:
      QUALITY_WEIGHT_COMPLETION: 0.60
      QUALITY_WEIGHT_SEATS: 0.30
      QUALITY_WEIGHT_LOAD: 0.10
      TARGET_LOAD_FACTOR: 0.375
    precision: "seat_fulfillment and load_factor 4 decimal places round_half_up; quality_score 2 decimal places round_half_up. normalized_load is NOT pre-rounded; the weighted sum is rounded once at the end."

  - name: renegotiated_annual_subsidy
    trigger: "On POST /eas/rate-renegotiations (creation) and re-run on POST /eas/rate-renegotiations/{id}/actions with action == REVISE."
    algorithm: constraint_propagation
    formula: |
      A = ServiceAgreement.annual_subsidy_usd            # rate currently in force
      annual_block_hours = ServiceAgreement.annual_block_hours

      if trigger_type == FUEL_INDEX:
          current_fuel_index_usd = FuelIndex(index_month == fuel_index_month).price_per_gallon_usd
          if no such FuelIndex row: reject with ERR_MISSING_FUEL_INDEX
          annual_fuel_gallons = round(annual_block_hours
                                      * AircraftType(proposal.aircraft_type_id).fuel_burn_gal_per_hour, 2)
          fuel_delta_usd_per_gal = round(current_fuel_index_usd
                                         - ServiceAgreement.baseline_fuel_index_usd, 4)
          fuel_cost_delta_usd    = round(fuel_delta_usd_per_gal * annual_fuel_gallons, 2)
          justified_delta_usd    = round(fuel_cost_delta_usd * FUEL_PASSTHROUGH_RATE, 2)
      else:   # COST_INCREASE
          current_fuel_index_usd = null
          fuel_cost_delta_usd    = null
          justified_delta_usd    = round(A * min(MAX_COST_INCREASE_PCT,
                                                 max(0.0000, documented_cost_increase_pct)), 2)

      # Nested cap then floor — a negative fuel delta may cut the rate, but not below -5 percent
      capped  = min(justified_delta_usd, round(A * MAX_ANNUAL_INCREASE_PCT, 2))
      floored = max(capped, round(-A * MAX_ANNUAL_DECREASE_PCT, 2))
      ceiling_annual_subsidy_usd = round(A + floored, 2)

      # Facial sanity gate on the ask
      if requested_annual_subsidy_usd > round(A * REQUEST_FACIAL_CAP_MULTIPLE, 2):
          reject with ERR_INVALID_REQUEST

      # On ACCEPT only:
      approved_annual_subsidy_usd = min(ceiling_annual_subsidy_usd, requested_annual_subsidy_usd)
    input_set: "The single ServiceAgreement under renegotiation, the AircraftType reached through ServiceAgreement.proposal_id -> Proposal.aircraft_type_id, and (for FUEL_INDEX) exactly one FuelIndex row selected by index_month equality."
    constants:
      FUEL_PASSTHROUGH_RATE: 0.80
      MAX_COST_INCREASE_PCT: 0.10
      MAX_ANNUAL_INCREASE_PCT: 0.15
      MAX_ANNUAL_DECREASE_PCT: 0.05
      REQUEST_FACIAL_CAP_MULTIPLE: 1.25
    precision: "per-gallon deltas 4 decimal places; all annual money 2 decimal places, round_half_up"

  - name: agreement_obligation_ledger
    trigger: "On POST /eas/solicitations/{id}/selection-order (initial booking), on POST /eas/subsidy-payments/{id}/actions with action IN {DISBURSE, REVERSE}, and on POST /eas/rate-renegotiations/{id}/actions with action == ACCEPT."
    algorithm: aggregation
    formula: |
      # At award:
      total_committed_usd     = round(annual_subsidy_usd * term_months / 12, 2)
      disbursed_to_date_usd   = 0.00
      hold_in_premium_paid_usd = 0.00
      obligated_remaining_usd = round(total_committed_usd - disbursed_to_date_usd, 2)

      # On DISBURSE:
      disbursed_to_date_usd    += SubsidyPayment.net_payment_usd
      hold_in_premium_paid_usd += SubsidyPayment.hold_in_premium_usd
      obligated_remaining_usd   = round(total_committed_usd - disbursed_to_date_usd, 2)

      # On REVERSE of a DISBURSED payment (compensating action):
      disbursed_to_date_usd    -= SubsidyPayment.net_payment_usd
      hold_in_premium_paid_usd -= SubsidyPayment.hold_in_premium_usd
      obligated_remaining_usd   = round(total_committed_usd - disbursed_to_date_usd, 2)

      # On renegotiation ACCEPT — re-book only the unserved remainder of the term:
      settled_periods = count(sp in ServicePeriod :
                                sp.agreement_id == agreement.id
                                and sp.status IN {CERTIFIED, PAID})
      remaining_term_months = term_months - settled_periods
      delta = round(approved_annual_subsidy_usd - annual_subsidy_usd_before_accept, 2)
      total_committed_usd    = round(total_committed_usd
                                     + round(delta * remaining_term_months / 12, 2), 2)
      obligated_remaining_usd = round(total_committed_usd - disbursed_to_date_usd, 2)
      # Guard: if obligated_remaining_usd < 0 the ACCEPT is rejected with ERR_OBLIGATION_EXCEEDED.
    input_set: "The single ServiceAgreement plus, for the renegotiation re-booking, the count of its ServicePeriod rows with status IN {CERTIFIED, PAID}. hold_in_premium_paid_usd is tracked OUTSIDE total_committed_usd, so hold-in premiums never disturb the committed-obligation identity."
    constants: {}
    precision: "2 decimal places, round_half_up; the inner delta pro-ration is rounded before it is added to total_committed_usd (pinned order)"

  - name: departure_count_reconciliation
    trigger: "On POST /eas/service-periods/{id}/report and POST /eas/service-periods/{id}/amend."
    algorithm: chronological
    formula: |
      # Per-period identity, enforced on every write:
      completed_departures + cancelled_carrier_departures + cancelled_weather_departures
          == scheduled_departures                       # else ERR_DEPARTURE_COUNTS_UNBALANCED
      period_completion_factor = round(completed_departures / scheduled_departures, 4)

      # Agreement-level roll-up, applied in write order (report adds; amend subtracts-then-adds):
      on report(sp):
          agreement.cumulative_scheduled_departures          += sp.scheduled_departures
          agreement.cumulative_completed_departures          += sp.completed_departures
          agreement.cumulative_cancelled_carrier_departures  += sp.cancelled_carrier_departures
          agreement.cumulative_cancelled_weather_departures  += sp.cancelled_weather_departures
      on amend(sp, new_counts):
          subtract sp's stored four counts from the four cumulative_* fields
          add new_counts's four values to the four cumulative_* fields
    input_set: "The single ServicePeriod under write and its ServiceAgreement. Periods with status == OPEN contribute nothing to the cumulative_* fields."
    constants: {}
    precision: "integers exactly; period_completion_factor 4 decimal places, round_half_up"

# ---------------------------------------------------------------------------
# §1.3.1 Named Invariants (referenced by state-machine side_effects)
# ---------------------------------------------------------------------------
invariants:
  - name: program_obligation_conservation
    conserved_quantity: "committed program dollars on a ServiceAgreement"
    formula: |
      ServiceAgreement.obligated_remaining_usd + ServiceAgreement.disbursed_to_date_usd
          == ServiceAgreement.total_committed_usd
    holds_when: "Before and after every DISBURSE / REVERSE pair on any SubsidyPayment of the agreement, and after every renegotiation ACCEPT. hold_in_premium_paid_usd is deliberately outside this identity."
  - name: departure_count_conservation
    conserved_quantity: "reported departure counts on a ServiceAgreement"
    formula: |
      ServiceAgreement.cumulative_scheduled_departures
          == ServiceAgreement.cumulative_completed_departures
           + ServiceAgreement.cumulative_cancelled_carrier_departures
           + ServiceAgreement.cumulative_cancelled_weather_departures
    holds_when: "After every report and every amend on any ServicePeriod of the agreement, including repeated amendments of the same period."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (Ordered by Priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty, and X-User-Role is one of the five roles declared in §1.7."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting X-User-Role appears in the called endpoint's roles list."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body parses, contains every required input field of the endpoint, enum values are members of their declared sets, numbers respect their declared ranges and decimal widths, YYYY-MM strings match the month pattern, datetimes are ISO 8601 UTC, and requested_annual_subsidy_usd does not exceed 1.25 times the agreement's current annual_subsidy_usd."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    check: "Every id referenced in the path or body resolves to a stored row, validated left-to-right: path id first, then body FK fields in declaration order (community_id, carrier_id, aircraft_type_id, solicitation_id, proposal_id, agreement_id, service_period_id)."
    error_id: "ERR_COMMUNITY_NOT_FOUND | ERR_CARRIER_NOT_FOUND | ERR_AIRCRAFT_TYPE_NOT_FOUND | ERR_SOLICITATION_NOT_FOUND | ERR_PROPOSAL_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_SERVICE_PERIOD_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_PETITION_NOT_FOUND | ERR_RENEGOTIATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints taking a path id or a body FK"

  - priority: 5
    category: auth
    check: "For entity_backed roles the acting X-User-ID owns the target: a Carrier may only act on Proposals whose carrier_id equals it, on ServicePeriods whose agreement's carrier_id equals it, and on RateRenegotiations whose agreement's carrier_id equals it; a CommunityRepresentative may only act on Solicitations and TerminationPetitions whose community_id equals it."
    error_id: ERR_FORBIDDEN_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /eas/proposals, POST /eas/proposals/{id}/actions, POST /eas/solicitations/{id}/preferences, POST /eas/service-periods/{id}/report, POST /eas/service-periods/{id}/amend, POST /eas/termination-petitions, POST /eas/termination-petitions/{id}/withdraw, POST /eas/rate-renegotiations, POST /eas/rate-renegotiations/{id}/actions"

  - priority: 6
    category: state
    check: "The target row is in a state from which the requested transition is declared in §1.2."
    error_id: "ERR_COMMUNITY_NOT_ELIGIBLE | ERR_CARRIER_NOT_ACTIONABLE | ERR_SOLICITATION_NOT_OPEN | ERR_SOLICITATION_NOT_CLOSED | ERR_PROPOSAL_NOT_SUBMITTABLE | ERR_AGREEMENT_NOT_ACTIVE | ERR_PERIOD_NOT_REPORTABLE | ERR_PERIOD_NOT_AMENDABLE | ERR_PERIOD_NOT_CERTIFIABLE | ERR_PAYMENT_NOT_APPROVABLE | ERR_PAYMENT_NOT_DISBURSABLE | ERR_PAYMENT_NOT_REVERSIBLE | ERR_PETITION_NOT_DECIDABLE | ERR_RENEGOTIATION_NOT_ACTIONABLE"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "When the endpoint declares expected_<parent>_version, that value equals the parent row's current version."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /eas/solicitations/{id}/preferences, POST /eas/service-periods/{id}/amend"

  - priority: 8
    category: business_safety
    check: "The Carrier bound to the operation has status IN {ACTIVE, PROBATION}. Applies to proposal submission and to reinstating a suspended agreement."
    error_id: ERR_CARRIER_NOT_IN_GOOD_STANDING
    http_status: 409
    applies_to: "POST /eas/proposals/{id}/actions (action == SUBMIT), POST /eas/service-agreements/{id}/status-actions (action == REINSTATE)"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: on a selection order the acting X-User-ID differs from certified_by_user_id of the community's latest EligibilityDetermination; on a payment DISBURSE the acting X-User-ID differs from SubsidyPayment.approved_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /eas/solicitations/{id}/selection-order, POST /eas/subsidy-payments/{id}/actions (action == DISBURSE)"

  - priority: 10
    category: business_safety
    check: "A GRANT_IMMEDIATE decision is refused unless the petition's reason_code == AIRPORT_CLOSURE or the Community has another ServiceAgreement with status == ACTIVE; the community may not be left with no air service."
    error_id: ERR_HOLD_IN_REQUIRED
    http_status: 409
    applies_to: "POST /eas/termination-petitions/{id}/decision"

  - priority: 11
    category: business_referential
    check: "A HOLD_IN agreement may only be terminated once a ServiceAgreement with predecessor_agreement_id equal to it has reached status == ACTIVE."
    error_id: ERR_REPLACEMENT_AGREEMENT_REQUIRED
    http_status: 409
    applies_to: "POST /eas/service-agreements/{id}/status-actions (action == TERMINATE)"

  - priority: 12
    category: business_referential
    check: "The AircraftType named by the proposal has is_retired == false at submission time."
    error_id: ERR_AIRCRAFT_TYPE_RETIRED
    http_status: 422
    applies_to: "POST /eas/proposals/{id}/actions (action == SUBMIT)"

  - priority: 13
    category: business_referential
    check: "Every proposal_id in a preference filing belongs to the addressed Solicitation and has submission_state == SUBMITTED."
    error_id: ERR_PROPOSAL_NOT_IN_SOLICITATION
    http_status: 409
    applies_to: "POST /eas/solicitations/{id}/preferences"

  - priority: 14
    category: business_referential
    check: "trigger_type == FUEL_INDEX requires fuel_index_month and forbids documented_cost_increase_pct; trigger_type == COST_INCREASE requires documented_cost_increase_pct and forbids fuel_index_month; the named FuelIndex row must exist."
    error_id: ERR_MISSING_FUEL_INDEX
    http_status: 422
    applies_to: "POST /eas/rate-renegotiations"

  - priority: 15
    category: business_referential
    check: "At most one RateRenegotiation per ServiceAgreement may have status IN {REQUESTED, COUNTERED}."
    error_id: ERR_RENEGOTIATION_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /eas/rate-renegotiations"

  - priority: 16
    category: business_temporal
    check: "A proposal may be submitted only while the logical clock is at or before Solicitation.closes_at (equality passes)."
    error_id: ERR_SOLICITATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /eas/proposals/{id}/actions (action == SUBMIT)"

  - priority: 17
    category: business_temporal
    check: "A RateRenegotiation may be filed only when the logical clock is at or after ServiceAgreement.rate_effective_from plus 180 days (equality passes)."
    error_id: ERR_RENEGOTIATION_COOLING_OFF
    http_status: 422
    applies_to: "POST /eas/rate-renegotiations"

  - priority: 18
    category: business_temporal
    check: "The half-open rate interval [rate_effective_from, rate_effective_to) of a new ServiceAgreement must not intersect the interval of any other ServiceAgreement for the same Community whose status IN {ACTIVE, SUSPENDED}. Agreements with status IN {HOLD_IN, TERMINATED} are excluded from the sweep, and touching endpoints (one interval's rate_effective_to equal to the other's rate_effective_from) do not intersect."
    error_id: ERR_RATE_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /eas/solicitations/{id}/selection-order"

  - priority: 19
    category: business_temporal
    check: "A Carrier whose previous ServiceAgreement for this Community reached status == TERMINATED may not begin a new agreement for the same Community until the logical clock is at or after that agreement's terminated_at plus 14 days (equality passes). Unlike the rate-interval rule this compares a single instant against a buffered point, not two intervals."
    error_id: ERR_CARRIER_REENTRY_BUFFER
    http_status: 409
    applies_to: "POST /eas/solicitations/{id}/selection-order"

  - priority: 20
    category: business_temporal
    check: "A new ServicePeriod's period_month must equal the month immediately after the greatest period_month already recorded for the agreement, or the month of ServiceAgreement.rate_effective_from when the agreement has no periods yet."
    error_id: ERR_PERIOD_SEQUENCE_GAP
    http_status: 409
    applies_to: "POST /eas/service-periods"

  - priority: 21
    category: business_constraint
    check: "period_month is unique per agreement_id."
    error_id: ERR_DUPLICATE_PERIOD
    http_status: 409
    applies_to: "POST /eas/service-periods"

  - priority: 22
    category: business_constraint
    check: "Community.code, Carrier.certificate_number, AircraftType.code and FuelIndex.index_month are each unique across their entity."
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /eas/communities, POST /eas/carriers, POST /eas/aircraft-types, POST /eas/fuel-indices"

  - priority: 23
    category: business_constraint
    check: "completed_departures + cancelled_carrier_departures + cancelled_weather_departures equals scheduled_departures, and passengers_enplaned <= seats_offered."
    error_id: ERR_DEPARTURE_COUNTS_UNBALANCED
    http_status: 422
    applies_to: "POST /eas/service-periods/{id}/report, POST /eas/service-periods/{id}/amend"

  - priority: 24
    category: business_constraint
    check: "A preference filing ranks exactly the Solicitation's proposals with submission_state == SUBMITTED, once each, with ranks forming the contiguous set 1..N."
    error_id: ERR_INVALID_PREFERENCE_RANKING
    http_status: 422
    applies_to: "POST /eas/solicitations/{id}/preferences"

  - priority: 25
    category: business_constraint
    check: "Proposal.weekly_round_trips >= Community.min_required_weekly_round_trips at submission."
    error_id: ERR_FREQUENCY_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /eas/proposals/{id}/actions (action == SUBMIT)"

  - priority: 26
    category: business_constraint
    check: "Proposal.weekly_round_trips * 2 * Proposal.seats_per_departure >= Community.min_required_weekly_seats at submission, and Proposal.seats_per_departure <= AircraftType.seats."
    error_id: ERR_SEATS_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /eas/proposals/{id}/actions (action == SUBMIT)"

  - priority: 27
    category: business_constraint
    check: "The candidate set of calculations.carrier_selection_ranking is non-empty."
    error_id: ERR_NO_ELIGIBLE_PROPOSALS
    http_status: 409
    applies_to: "POST /eas/solicitations/{id}/selection-order"

  - priority: 28
    category: business_constraint
    check: "scheduled_departures >= 1 on report and amend, and the denominator of the requested completion-factor basis is greater than zero on a performance review."
    error_id: ERR_NO_SCHEDULED_DEPARTURES
    http_status: 422
    applies_to: "POST /eas/service-periods/{id}/report, POST /eas/service-periods/{id}/amend, POST /eas/performance-reviews"

  - priority: 29
    category: business_fiscal
    check: "When Community.subsidy_per_passenger_cap_usd is not null, Proposal.subsidy_per_passenger_usd <= that cap at submission (equality passes)."
    error_id: ERR_SUBSIDY_PER_PASSENGER_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /eas/proposals/{id}/actions (action == SUBMIT)"

  - priority: 30
    category: business_fiscal
    check: "cancellation_adjustment_usd must not exceed 25 percent of monthly_entitlement_usd."
    error_id: ERR_ADJUSTMENT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /eas/service-periods/{id}/certify"

  - priority: 31
    category: business_fiscal
    check: "Certification requires round(monthly_entitlement_usd - cancellation_adjustment_usd, 2) <= ServiceAgreement.obligated_remaining_usd; disbursement requires net_payment_usd <= ServiceAgreement.obligated_remaining_usd; a renegotiation ACCEPT must not drive obligated_remaining_usd below 0.00."
    error_id: ERR_OBLIGATION_EXCEEDED
    http_status: 422
    applies_to: "POST /eas/service-periods/{id}/certify, POST /eas/subsidy-payments/{id}/actions (action == DISBURSE), POST /eas/rate-renegotiations/{id}/actions (action == ACCEPT)"

  - priority: 32
    category: business_constraint
    check: "A REVISE action requires RateRenegotiation.revision_count < 3 and a revised_annual_subsidy_usd value; a fourth revision is refused."
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /eas/rate-renegotiations/{id}/actions (action == REVISE)"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table  (24 reads / 26 writes = 50 endpoints)
# ---------------------------------------------------------------------------
endpoints:
  # ---- test-driving surface (last rung of the §1.5 priority ladder) --------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every temporal rule reads. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z; the server MUST NOT fall back to real wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all subsequent created_at, updated_at, effective_at, rate_effective_from and terminated_at stamps use this instant"]

  # ---- Community ----------------------------------------------------------
  - method: POST
    path: "/eas/communities"
    description: "Registers a community that may qualify for essential air service."
    roles: [ProgramAdmin]
    code: 201
    input: [code, name, state_code, driving_miles_to_nearest_hub, enplanements_prior_year, min_required_weekly_round_trips, min_required_weekly_seats]
    output: Community
    side_effects: ["Community.status initialized to REGISTERED"]

  - method: GET
    path: "/eas/communities/{id}"
    description: "Reads one community including its computed distance band, cap, latest determination outcome and active agreement count."
    roles: [ProgramAdmin, EligibilityAnalyst, SelectionOfficer, CommunityRepresentative, Carrier]
    code: 200
    input: []
    output: Community
    side_effects: []

  - method: GET
    path: "/eas/communities"
    description: "Lists communities, newest first by created_at DESC."
    roles: [ProgramAdmin, EligibilityAnalyst, SelectionOfficer]
    code: 200
    input: ["status?", "state_code?", "limit?", "offset?"]
    output: Community[]
    side_effects: []

  - method: POST
    path: "/eas/communities/{id}/eligibility-determinations"
    description: "Runs calculations.community_eligibility_assessment and records the determination, moving the community between REGISTERED, ELIGIBLE and INELIGIBLE."
    roles: [EligibilityAnalyst]
    code: 201
    input: ["waiver_requested?"]
    output: EligibilityDetermination
    side_effects:
      - "runs calculations.community_eligibility_assessment"
      - "writes Community.distance_band, Community.subsidy_per_passenger_cap_usd and Community.latest_determination_outcome"
      - "moves Community between REGISTERED, ELIGIBLE and INELIGIBLE per §1.2"
      - "stores the acting X-User-ID as EligibilityDetermination.certified_by_user_id"

  - method: GET
    path: "/eas/communities/{id}/eligibility-determinations"
    description: "Lists a community's eligibility determinations, created_at ASC."
    roles: [ProgramAdmin, EligibilityAnalyst, SelectionOfficer, CommunityRepresentative]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: EligibilityDetermination[]
    side_effects: []

  - method: GET
    path: "/eas/communities/{id}/solicitations"
    description: "Lists the solicitations opened for a community, created_at ASC."
    roles: [ProgramAdmin, SelectionOfficer, CommunityRepresentative, Carrier]
    code: 200
    input: ["status?", "created_reason?", "limit?", "offset?"]
    output: Solicitation[]
    side_effects: []

  # ---- Carrier ------------------------------------------------------------
  - method: POST
    path: "/eas/carriers"
    description: "Registers an air carrier eligible to bid on essential air service."
    roles: [ProgramAdmin]
    code: 201
    input: [name, certificate_number]
    output: Carrier
    side_effects: ["Carrier.status initialized to ACTIVE"]

  - method: GET
    path: "/eas/carriers/{id}"
    description: "Reads one carrier including its latest performance figures and standing."
    roles: [ProgramAdmin, EligibilityAnalyst, SelectionOfficer, CommunityRepresentative, Carrier]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: POST
    path: "/eas/carriers/{id}/standing"
    description: "Changes a carrier's standing: PLACE_ON_PROBATION, SUSPEND, DEBAR or REINSTATE."
    roles: [ProgramAdmin]
    code: 200
    input: ["action", "note?"]
    output: Carrier
    side_effects:
      - "moves Carrier between ACTIVE, PROBATION, SUSPENDED and DEBARRED per §1.2"
      - "on SUSPEND, every ServiceAgreement of this carrier with status == ACTIVE moves to SUSPENDED"
      - "on REINSTATE, resets Carrier.consecutive_watch_count to 0"
      - "on DEBAR, every Proposal of this carrier with submission_state == DRAFT moves to WITHDRAWN"

  # ---- AircraftType -------------------------------------------------------
  - method: POST
    path: "/eas/aircraft-types"
    description: "Registers an aircraft type with its seat count and block-hour economics."
    roles: [ProgramAdmin]
    code: 201
    input: [code, name, seats, is_jet, fuel_burn_gal_per_hour, hourly_operating_cost_usd]
    output: AircraftType
    side_effects: ["AircraftType.is_retired initialized to false"]

  - method: GET
    path: "/eas/aircraft-types/{id}"
    description: "Reads one aircraft type including its retirement flag."
    roles: [ProgramAdmin, SelectionOfficer, Carrier]
    code: 200
    input: []
    output: AircraftType
    side_effects: []

  - method: POST
    path: "/eas/aircraft-types/{id}/retire"
    description: "Retires an aircraft type so that no further proposal may be submitted on it."
    roles: [ProgramAdmin]
    code: 200
    input: ["note?"]
    output: AircraftType
    side_effects: ["sets AircraftType.is_retired to true"]

  # ---- FuelIndex ----------------------------------------------------------
  - method: POST
    path: "/eas/fuel-indices"
    description: "Publishes the jet fuel price index for one calendar month."
    roles: [ProgramAdmin]
    code: 201
    input: [index_month, price_per_gallon_usd]
    output: FuelIndex
    side_effects: []

  - method: GET
    path: "/eas/fuel-indices"
    description: "Lists published fuel index months, index_month ASC."
    roles: [ProgramAdmin, SelectionOfficer, Carrier]
    code: 200
    input: ["index_month?", "limit?", "offset?"]
    output: FuelIndex[]
    side_effects: []

  # ---- Solicitation -------------------------------------------------------
  - method: POST
    path: "/eas/solicitations"
    description: "Opens a solicitation round inviting carrier proposals for an eligible community."
    roles: [ProgramAdmin]
    code: 201
    input: [community_id, closes_at]
    output: Solicitation
    side_effects: ["Solicitation.status initialized to OPEN, round_number to 1, created_reason to INITIAL, preference_filing_count to 0"]

  - method: GET
    path: "/eas/solicitations/{id}"
    description: "Reads one solicitation including its preference filing count and the selected proposal back-reference."
    roles: [ProgramAdmin, SelectionOfficer, CommunityRepresentative, Carrier]
    code: 200
    input: []
    output: Solicitation
    side_effects: []

  - method: POST
    path: "/eas/solicitations/{id}/actions"
    description: "Drives the solicitation state machine: CLOSE, REOPEN or CANCEL."
    roles: [ProgramAdmin]
    code: 200
    input: ["action", "note?"]
    output: Solicitation
    side_effects:
      - "on CLOSE, every Proposal with submission_state == SUBMITTED and evaluation_state == NOT_EVALUATED moves to UNDER_EVALUATION"
      - "on REOPEN, increments Solicitation.round_number and moves every UNDER_EVALUATION proposal to EXPIRED without touching submission_state"
      - "on CANCEL, moves every NOT_EVALUATED or UNDER_EVALUATION proposal to EXPIRED"

  - method: POST
    path: "/eas/solicitations/{id}/preferences"
    description: "Files the community's ranked preference over the solicitation's submitted proposals. A later filing supersedes the prior one; the request must carry the solicitation version the client last observed."
    roles: [CommunityRepresentative]
    code: 201
    input: ["expected_solicitation_version", "rankings", "rationale?"]
    output: Solicitation
    side_effects:
      - "increments Solicitation.preference_filing_count by 1"
      - "creates one CommunityPreference row per ranking entry, stamped with filing_sequence equal to the new Solicitation.preference_filing_count"
      - "increments Solicitation.version by 1"
      - "earlier filings remain stored but are no longer read by calculations.carrier_selection_ranking"

  - method: GET
    path: "/eas/solicitations/{id}/preferences"
    description: "Lists the community preference rows filed against a solicitation, filing_sequence ASC then rank ASC."
    roles: [ProgramAdmin, SelectionOfficer, CommunityRepresentative]
    code: 200
    input: ["filing_sequence?", "limit?", "offset?"]
    output: CommunityPreference[]
    side_effects: []

  - method: GET
    path: "/eas/solicitations/{id}/ranking"
    description: "Read-only preview of calculations.carrier_selection_ranking over the solicitation's current candidate set; persists nothing."
    roles: [ProgramAdmin, SelectionOfficer]
    code: 200
    input: []
    output: { candidate_count: integer, top_proposal_id: string, top_composite_score: number, ranked_proposal_ids: array, excluded_proposal_ids: array }
    side_effects: []

  - method: POST
    path: "/eas/solicitations/{id}/selection-order"
    description: "Issues the carrier selection order: ranks the candidate proposals, awards the winner and books the resulting service agreement."
    roles: [SelectionOfficer]
    code: 201
    input: ["order_note?"]
    output: ServiceAgreement
    side_effects:
      - "runs calculations.carrier_selection_ranking and writes Proposal.composite_score on every candidate"
      - "the winner moves UNDER_EVALUATION -> SELECTED, every other candidate moves UNDER_EVALUATION -> NOT_SELECTED"
      - "Solicitation moves CLOSED -> AWARDED and records selected_proposal_id and candidate_count_at_award"
      - "creates a ServiceAgreement with status == ACTIVE, copying the winning proposal's terms and running calculations.agreement_obligation_ledger"
      - "resolves ServiceAgreement.predecessor_agreement_id to the community's HOLD_IN agreement when one exists, which then moves HOLD_IN -> TERMINATED, closes its GRANTED_WITH_HOLD_IN petition and moves the Community HOLD_IN -> SUBSIDIZED"
      - "when no predecessor exists, the Community moves ELIGIBLE -> SUBSIDIZED"

  # ---- Proposal -----------------------------------------------------------
  - method: POST
    path: "/eas/proposals"
    description: "Drafts a carrier proposal answering a solicitation."
    roles: [Carrier]
    code: 201
    input: [solicitation_id, carrier_id, aircraft_type_id, service_level, weekly_round_trips, seats_per_departure, annual_subsidy_request_usd, term_months, payment_basis]
    output: Proposal
    side_effects:
      - "runs calculations.proposal_subsidy_per_passenger writing projected_annual_passengers and subsidy_per_passenger_usd"
      - "submission_state initialized to DRAFT, evaluation_state to NOT_EVALUATED"

  - method: GET
    path: "/eas/proposals/{id}"
    description: "Reads one proposal including both state dimensions and its composite score."
    roles: [ProgramAdmin, SelectionOfficer, CommunityRepresentative, Carrier]
    code: 200
    input: []
    output: Proposal
    side_effects: []

  - method: GET
    path: "/eas/proposals"
    description: "Lists proposals filtered by solicitation, carrier, aircraft type or either state dimension; created_at ASC."
    roles: [ProgramAdmin, SelectionOfficer, CommunityRepresentative, Carrier]
    code: 200
    input: ["solicitation_id?", "carrier_id?", "aircraft_type_id?", "submission_state?", "evaluation_state?", "limit?", "offset?"]
    output: Proposal[]
    side_effects: []

  - method: POST
    path: "/eas/proposals/{id}/actions"
    description: "Drives the proposal submission dimension: SUBMIT or WITHDRAW."
    roles: [Carrier]
    code: 200
    input: [action]
    output: Proposal
    side_effects:
      - "on SUBMIT, re-runs calculations.proposal_subsidy_per_passenger and enforces the frequency, seat and per-passenger cap gates"
      - "on SUBMIT, submission_state moves DRAFT -> SUBMITTED with evaluation_state left at NOT_EVALUATED"
      - "on WITHDRAW, submission_state moves to WITHDRAWN and evaluation_state is left unchanged"

  - method: GET
    path: "/eas/proposals/{id}/preferences"
    description: "Lists the community preference rows that rank this proposal, filing_sequence ASC."
    roles: [ProgramAdmin, SelectionOfficer, CommunityRepresentative, Carrier]
    code: 200
    input: ["limit?", "offset?"]
    output: CommunityPreference[]
    side_effects: []

  # ---- ServiceAgreement ---------------------------------------------------
  - method: GET
    path: "/eas/service-agreements/{id}"
    description: "Reads one service agreement including its commitment terms and the full obligation ledger."
    roles: [ProgramAdmin, SelectionOfficer, EligibilityAnalyst, CommunityRepresentative, Carrier]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: []

  - method: GET
    path: "/eas/service-agreements"
    description: "Lists service agreements filtered by community, carrier, source proposal, predecessor agreement or status; created_at ASC."
    roles: [ProgramAdmin, SelectionOfficer, CommunityRepresentative, Carrier]
    code: 200
    input: ["community_id?", "carrier_id?", "proposal_id?", "predecessor_agreement_id?", "status?", "limit?", "offset?"]
    output: ServiceAgreement[]
    side_effects: []

  - method: POST
    path: "/eas/service-agreements/{id}/status-actions"
    description: "Drives the agreement status machine: SUSPEND, REINSTATE or TERMINATE."
    roles: [ProgramAdmin]
    code: 200
    input: ["action", "note?"]
    output: ServiceAgreement
    side_effects:
      - "on REINSTATE, requires Carrier.status IN {ACTIVE, PROBATION} and may move the Community HOLD_IN -> SUBSIDIZED"
      - "on TERMINATE, refuses a HOLD_IN agreement that has no ACTIVE successor, stamps terminated_at, and releases the unspent obligation by setting total_committed_usd to disbursed_to_date_usd and obligated_remaining_usd to 0.00"

  - method: GET
    path: "/eas/service-agreements/{id}/performance-reviews"
    description: "Lists the performance reviews recorded against an agreement, created_at ASC."
    roles: [ProgramAdmin, SelectionOfficer, CommunityRepresentative, Carrier]
    code: 200
    input: ["basis?", "tier?", "limit?", "offset?"]
    output: PerformanceReview[]
    side_effects: []

  # ---- ServicePeriod ------------------------------------------------------
  - method: POST
    path: "/eas/service-periods"
    description: "Opens the monthly reporting bucket for the next month of an agreement."
    roles: [ProgramAdmin]
    code: 201
    input: [agreement_id, period_month]
    output: ServicePeriod
    side_effects: ["ServicePeriod.status initialized to OPEN with all counts 0"]

  - method: GET
    path: "/eas/service-periods/{id}"
    description: "Reads one service period including its reported counts and completion factor."
    roles: [ProgramAdmin, SelectionOfficer, CommunityRepresentative, Carrier]
    code: 200
    input: []
    output: ServicePeriod
    side_effects: []

  - method: GET
    path: "/eas/service-periods"
    description: "Lists service periods filtered by agreement, status or month; period_month ASC."
    roles: [ProgramAdmin, SelectionOfficer, CommunityRepresentative, Carrier]
    code: 200
    input: ["agreement_id?", "status?", "period_month?", "limit?", "offset?"]
    output: ServicePeriod[]
    side_effects: []

  - method: POST
    path: "/eas/service-periods/{id}/report"
    description: "Files the carrier's monthly operating report for a period."
    roles: [Carrier]
    code: 200
    input: [scheduled_departures, completed_departures, cancelled_carrier_departures, cancelled_weather_departures, seats_offered, passengers_enplaned]
    output: ServicePeriod
    side_effects:
      - "ServicePeriod moves OPEN -> REPORTED"
      - "runs calculations.departure_count_reconciliation writing period_completion_factor and adding the four counts into the agreement's cumulative_* fields"

  - method: POST
    path: "/eas/service-periods/{id}/amend"
    description: "Replaces a period's reported counts. The request must carry the agreement version the client last observed."
    roles: [Carrier]
    code: 200
    input: [expected_agreement_version, scheduled_departures, completed_departures, cancelled_carrier_departures, cancelled_weather_departures, seats_offered, passengers_enplaned]
    output: ServicePeriod
    side_effects:
      - "increments ServicePeriod.amendment_count by 1"
      - "subtracts the stored counts from the agreement's cumulative_* fields and adds the new counts, preserving invariant departure_count_conservation"
      - "increments ServiceAgreement.version by 1"
      - "rewrites ServicePeriod.period_completion_factor"

  - method: GET
    path: "/eas/service-periods/{id}/payment-preview"
    description: "Read-only dual-variant preview of calculations.subsidy_payment_amount for a reported period; persists nothing."
    roles: [ProgramAdmin, SelectionOfficer, Carrier]
    code: 200
    input: []
    output: { completed_flight_proration_net_usd: number, scheduled_flight_flat_net_usd: number, variant_in_effect: string, divergence_usd: number, per_departure_rate_usd: number, credited_departures: integer }
    side_effects: []

  - method: POST
    path: "/eas/service-periods/{id}/certify"
    description: "Certifies a reported period and computes the subsidy payment due."
    roles: [ProgramAdmin]
    code: 201
    input: ["certification_note?"]
    output: SubsidyPayment
    side_effects:
      - "ServicePeriod moves REPORTED -> CERTIFIED"
      - "runs calculations.subsidy_payment_amount under ServiceAgreement.payment_basis and creates a SubsidyPayment with status == COMPUTED"
      - "when ServiceAgreement.status == HOLD_IN, also runs calculations.hold_in_premium writing hold_in_premium_usd and total_disbursement_usd"

  # ---- SubsidyPayment -----------------------------------------------------
  - method: GET
    path: "/eas/subsidy-payments/{id}"
    description: "Reads one subsidy payment including every intermediate figure of the payment calculation."
    roles: [ProgramAdmin, SelectionOfficer, CommunityRepresentative, Carrier]
    code: 200
    input: []
    output: SubsidyPayment
    side_effects: []

  - method: GET
    path: "/eas/subsidy-payments"
    description: "Lists subsidy payments filtered by service period or status; created_at ASC."
    roles: [ProgramAdmin, SelectionOfficer, Carrier]
    code: 200
    input: ["service_period_id?", "status?", "limit?", "offset?"]
    output: SubsidyPayment[]
    side_effects: []

  - method: POST
    path: "/eas/subsidy-payments/{id}/actions"
    description: "Drives the payment state machine: APPROVE, DISBURSE or REVERSE. The disbursing user must differ from the approving user."
    roles: [ProgramAdmin]
    code: 200
    input: ["action", "reversal_reason_code?"]
    output: SubsidyPayment
    side_effects:
      - "on APPROVE, records approved_by_user_id from the acting X-User-ID"
      - "on DISBURSE, records disbursed_by_user_id, adds net_payment_usd to the agreement's disbursed_to_date_usd, adds hold_in_premium_usd to hold_in_premium_paid_usd, recomputes obligated_remaining_usd and moves the period CERTIFIED -> PAID"
      - "on REVERSE from DISBURSED, subtracts net_payment_usd and hold_in_premium_usd back out of the agreement ledger, recomputes obligated_remaining_usd and moves the period PAID -> REPORTED"
      - "on REVERSE from APPROVED, moves the period CERTIFIED -> REPORTED without touching the ledger"

  # ---- PerformanceReview --------------------------------------------------
  - method: POST
    path: "/eas/performance-reviews"
    description: "Runs a completion-factor and service-quality review over a month window of an agreement and applies the resulting enforcement action."
    roles: [ProgramAdmin]
    code: 201
    input: [agreement_id, basis, window_start_month, window_end_month]
    output: PerformanceReview
    side_effects:
      - "runs calculations.carrier_completion_factor and calculations.carrier_performance_scoring"
      - "writes Carrier.latest_completion_factor, latest_quality_score, latest_performance_tier and consecutive_watch_count"
      - "on tier == WATCH with consecutive_watch_count >= 2, the Carrier moves to PROBATION and action_taken is CARRIER_PLACED_ON_PROBATION"
      - "on tier == DEFICIENT, the Carrier moves to SUSPENDED, the reviewed ServiceAgreement moves ACTIVE -> SUSPENDED, the Community moves SUBSIDIZED -> HOLD_IN and a REPLACEMENT Solicitation is opened; action_taken is AGREEMENT_SUSPENDED_AND_HOLD_IN"

  # ---- TerminationPetition ------------------------------------------------
  - method: POST
    path: "/eas/termination-petitions"
    description: "Files a community petition to end an existing service agreement."
    roles: [CommunityRepresentative]
    code: 201
    input: [community_id, agreement_id, reason_code, narrative, requested_effective_at]
    output: TerminationPetition
    side_effects: ["TerminationPetition.status initialized to FILED with filed_by_user_id set to the acting X-User-ID"]

  - method: GET
    path: "/eas/termination-petitions/{id}"
    description: "Reads one termination petition including its decision trail."
    roles: [ProgramAdmin, SelectionOfficer, CommunityRepresentative, Carrier]
    code: 200
    input: []
    output: TerminationPetition
    side_effects: []

  - method: GET
    path: "/eas/termination-petitions"
    description: "Lists termination petitions filtered by community, agreement or status; created_at ASC."
    roles: [ProgramAdmin, SelectionOfficer, CommunityRepresentative, Carrier]
    code: 200
    input: ["community_id?", "agreement_id?", "status?", "limit?", "offset?"]
    output: TerminationPetition[]
    side_effects: []

  - method: POST
    path: "/eas/termination-petitions/{id}/decision"
    description: "Records a decision on a petition: OPEN_REVIEW, RETURN_FOR_INFO, GRANT_WITH_HOLD_IN, GRANT_IMMEDIATE or DENY."
    roles: [SelectionOfficer]
    code: 200
    input: ["action", "decision_note?"]
    output: TerminationPetition
    side_effects:
      - "on RETURN_FOR_INFO, increments return_count and returns the petition to FILED"
      - "on GRANT_WITH_HOLD_IN, the ServiceAgreement moves ACTIVE -> HOLD_IN, the Community moves SUBSIDIZED -> HOLD_IN and a REPLACEMENT Solicitation is opened"
      - "on GRANT_IMMEDIATE, the ServiceAgreement moves ACTIVE -> TERMINATED and the Community moves to ELIGIBLE or TERMINATED per its latest determination outcome"

  - method: POST
    path: "/eas/termination-petitions/{id}/withdraw"
    description: "Withdraws a petition the community no longer wishes to pursue."
    roles: [CommunityRepresentative]
    code: 200
    input: ["withdraw_note?"]
    output: TerminationPetition
    side_effects: ["TerminationPetition moves FILED or UNDER_REVIEW -> WITHDRAWN; no agreement or community state changes"]

  # ---- RateRenegotiation --------------------------------------------------
  - method: POST
    path: "/eas/rate-renegotiations"
    description: "Files a carrier request to reopen the annual subsidy rate on fuel or documented cost grounds."
    roles: [Carrier]
    code: 201
    input: ["agreement_id", "trigger_type", "requested_annual_subsidy_usd", "justification", "fuel_index_month?", "documented_cost_increase_pct?"]
    output: RateRenegotiation
    side_effects:
      - "runs calculations.renegotiated_annual_subsidy writing current_fuel_index_usd, fuel_cost_delta_usd, justified_delta_usd and ceiling_annual_subsidy_usd"
      - "RateRenegotiation.status initialized to REQUESTED with revision_count 0"

  - method: GET
    path: "/eas/rate-renegotiations/{id}"
    description: "Reads one rate renegotiation including every intermediate figure of the ceiling computation."
    roles: [ProgramAdmin, SelectionOfficer, Carrier]
    code: 200
    input: []
    output: RateRenegotiation
    side_effects: []

  - method: GET
    path: "/eas/rate-renegotiations"
    description: "Lists rate renegotiations filtered by agreement or status; created_at ASC."
    roles: [ProgramAdmin, SelectionOfficer, Carrier]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: RateRenegotiation[]
    side_effects: []

  - method: POST
    path: "/eas/rate-renegotiations/{id}/actions"
    description: "Drives the renegotiation machine. COUNTER, ACCEPT and REJECT are ProgramAdmin-only; REVISE and WITHDRAW are Carrier-only; any other pairing is rejected with ERR_UNAUTHORIZED."
    roles: [ProgramAdmin, Carrier]
    code: 200
    input: ["action", "revised_annual_subsidy_usd?", "action_note?"]
    output: RateRenegotiation
    side_effects:
      - "on COUNTER, writes countered_annual_subsidy_usd equal to ceiling_annual_subsidy_usd"
      - "on REVISE, increments revision_count, replaces requested_annual_subsidy_usd with revised_annual_subsidy_usd and re-runs calculations.renegotiated_annual_subsidy"
      - "on ACCEPT, writes approved_annual_subsidy_usd and effective_at, replaces ServiceAgreement.annual_subsidy_usd, advances rate_effective_from and re-books the ledger per calculations.agreement_obligation_ledger"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # -- authentication / authorization --------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role not declared in §1.7."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The acting role is not listed on the called endpoint, or an action-level role split is violated (COUNTER/ACCEPT/REJECT attempted by Carrier, REVISE/WITHDRAW attempted by ProgramAdmin)."
  - id: ERR_FORBIDDEN_RESOURCE_OWNER
    http: 403
    condition: "An entity_backed role acts on a resource it does not own: a Carrier on another carrier's proposal, period or renegotiation, or a CommunityRepresentative on another community's solicitation or petition."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The selection officer issuing the order is the same user id that certified the community's latest eligibility determination, or the same user id both approves and disburses a subsidy payment."

  # -- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, invalid enum member, out-of-range or wrong-precision number, malformed YYYY-MM or ISO 8601 value, or a requested annual subsidy above 1.25 times the rate currently in force."

  # -- existence ------------------------------------------------------------
  - id: ERR_COMMUNITY_NOT_FOUND
    http: 404
    condition: "No Community row matches the supplied id."
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "No Carrier row matches the supplied id."
  - id: ERR_AIRCRAFT_TYPE_NOT_FOUND
    http: 404
    condition: "No AircraftType row matches the supplied id."
  - id: ERR_SOLICITATION_NOT_FOUND
    http: 404
    condition: "No Solicitation row matches the supplied id."
  - id: ERR_PROPOSAL_NOT_FOUND
    http: 404
    condition: "No Proposal row matches the supplied id, including a proposal_id inside a preference ranking."
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "No ServiceAgreement row matches the supplied id."
  - id: ERR_SERVICE_PERIOD_NOT_FOUND
    http: 404
    condition: "No ServicePeriod row matches the supplied id."
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "No SubsidyPayment row matches the supplied id."
  - id: ERR_PETITION_NOT_FOUND
    http: 404
    condition: "No TerminationPetition row matches the supplied id."
  - id: ERR_RENEGOTIATION_NOT_FOUND
    http: 404
    condition: "No RateRenegotiation row matches the supplied id."

  # -- state ----------------------------------------------------------------
  - id: ERR_COMMUNITY_NOT_ELIGIBLE
    http: 409
    condition: "A solicitation is opened for a Community whose status is not IN {ELIGIBLE, SUBSIDIZED, HOLD_IN}; a REGISTERED, INELIGIBLE or TERMINATED community may not be solicited."
  - id: ERR_CARRIER_NOT_ACTIONABLE
    http: 409
    condition: "A standing action targets a Carrier already in the terminal DEBARRED state, or REINSTATE targets a carrier with status == ACTIVE."
  - id: ERR_SOLICITATION_NOT_OPEN
    http: 409
    condition: "CLOSE is requested on a solicitation whose status is not OPEN, or a proposal is submitted against a solicitation whose status is not OPEN."
  - id: ERR_SOLICITATION_NOT_CLOSED
    http: 409
    condition: "REOPEN or a selection order is requested on a solicitation whose status is not CLOSED, or CANCEL is requested on a solicitation with status IN {AWARDED, CANCELLED}."
  - id: ERR_PROPOSAL_NOT_SUBMITTABLE
    http: 409
    condition: "SUBMIT is requested on a proposal whose submission_state is not DRAFT, or WITHDRAW on one already WITHDRAWN."
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "A status action, petition decision, renegotiation or period write targets an agreement whose status does not permit the transition declared in §1.2."
  - id: ERR_PERIOD_NOT_REPORTABLE
    http: 409
    condition: "A report is filed on a period whose status is not OPEN."
  - id: ERR_PERIOD_NOT_AMENDABLE
    http: 409
    condition: "An amendment is filed on a period whose status is not REPORTED."
  - id: ERR_PERIOD_NOT_CERTIFIABLE
    http: 409
    condition: "Certification is requested on a period whose status is not REPORTED, or an earlier month of the same agreement is still OPEN."
  - id: ERR_PAYMENT_NOT_APPROVABLE
    http: 409
    condition: "APPROVE is requested on a payment whose status is not COMPUTED."
  - id: ERR_PAYMENT_NOT_DISBURSABLE
    http: 409
    condition: "DISBURSE is requested on a payment whose status is not APPROVED."
  - id: ERR_PAYMENT_NOT_REVERSIBLE
    http: 409
    condition: "REVERSE is requested on a payment whose status is not IN {APPROVED, DISBURSED}."
  - id: ERR_PETITION_NOT_DECIDABLE
    http: 409
    condition: "A decision action is inconsistent with the petition's status: OPEN_REVIEW from a status other than FILED, any other decision from a status other than UNDER_REVIEW, or a withdrawal of a petition whose status is not IN {FILED, UNDER_REVIEW}."
  - id: ERR_RENEGOTIATION_NOT_ACTIONABLE
    http: 409
    condition: "COUNTER from a status other than REQUESTED, REVISE from a status other than COUNTERED, or ACCEPT/REJECT/WITHDRAW from a status not IN {REQUESTED, COUNTERED}."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "The request's expected_solicitation_version or expected_agreement_version does not equal the parent row's current version."

  # -- business safety ------------------------------------------------------
  - id: ERR_CARRIER_NOT_IN_GOOD_STANDING
    http: 409
    condition: "The carrier bound to the operation has status IN {SUSPENDED, DEBARRED}."
  - id: ERR_HOLD_IN_REQUIRED
    http: 409
    condition: "GRANT_IMMEDIATE is requested although the petition's reason_code is not AIRPORT_CLOSURE and the community has no other ACTIVE service agreement."
  - id: ERR_REPLACEMENT_AGREEMENT_REQUIRED
    http: 409
    condition: "TERMINATE is requested on a HOLD_IN agreement that has no successor ServiceAgreement with status == ACTIVE."

  # -- business referential -------------------------------------------------
  - id: ERR_AIRCRAFT_TYPE_RETIRED
    http: 422
    condition: "The proposal's AircraftType has is_retired == true at submission."
  - id: ERR_PROPOSAL_NOT_IN_SOLICITATION
    http: 409
    condition: "A preference ranking names a proposal belonging to a different solicitation, or one whose submission_state is not SUBMITTED."
  - id: ERR_MISSING_FUEL_INDEX
    http: 422
    condition: "A FUEL_INDEX renegotiation omits fuel_index_month or names a month with no FuelIndex row, a COST_INCREASE renegotiation omits documented_cost_increase_pct, or either supplies the other trigger's field."
  - id: ERR_RENEGOTIATION_ALREADY_OPEN
    http: 409
    condition: "The agreement already has a RateRenegotiation with status IN {REQUESTED, COUNTERED}."

  # -- business temporal ----------------------------------------------------
  - id: ERR_SOLICITATION_WINDOW_CLOSED
    http: 422
    condition: "A proposal is submitted when the logical clock is strictly after Solicitation.closes_at."
  - id: ERR_RENEGOTIATION_COOLING_OFF
    http: 422
    condition: "A renegotiation is filed before ServiceAgreement.rate_effective_from plus 180 days."
  - id: ERR_RATE_INTERVAL_OVERLAP
    http: 409
    condition: "The new agreement's half-open interval [rate_effective_from, rate_effective_to) intersects that of another agreement for the same community with status IN {ACTIVE, SUSPENDED}."
  - id: ERR_CARRIER_REENTRY_BUFFER
    http: 409
    condition: "The winning carrier's previous agreement for this community was TERMINATED less than 14 days before the logical clock."
  - id: ERR_PERIOD_SEQUENCE_GAP
    http: 409
    condition: "The requested period_month is not the month immediately following the agreement's latest recorded month, nor the month of rate_effective_from for a first period."

  # -- business constraint --------------------------------------------------
  - id: ERR_DUPLICATE_PERIOD
    http: 409
    condition: "A ServicePeriod already exists for that agreement_id and period_month."
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Community.code, Carrier.certificate_number, AircraftType.code or FuelIndex.index_month already exists."
  - id: ERR_DEPARTURE_COUNTS_UNBALANCED
    http: 422
    condition: "completed + cancelled_carrier + cancelled_weather does not equal scheduled_departures, or passengers_enplaned exceeds seats_offered."
  - id: ERR_INVALID_PREFERENCE_RANKING
    http: 422
    condition: "The filing does not rank every SUBMITTED proposal of the solicitation exactly once with contiguous ranks 1..N."
  - id: ERR_FREQUENCY_BELOW_MINIMUM
    http: 422
    condition: "Proposal.weekly_round_trips is below Community.min_required_weekly_round_trips at submission."
  - id: ERR_SEATS_BELOW_MINIMUM
    http: 422
    condition: "Weekly one-way seats offered are below Community.min_required_weekly_seats, or seats_per_departure exceeds AircraftType.seats."
  - id: ERR_NO_ELIGIBLE_PROPOSALS
    http: 409
    condition: "The selection order's candidate set is empty after applying the eligibility filter of calculations.carrier_selection_ranking."
  - id: ERR_NO_SCHEDULED_DEPARTURES
    http: 422
    condition: "scheduled_departures is 0 on a report or amendment, or the completion-factor denominator for the requested basis is 0 on a performance review."
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 422
    condition: "A REVISE action is attempted when RateRenegotiation.revision_count is already 3, or without revised_annual_subsidy_usd."

  # -- business fiscal ------------------------------------------------------
  - id: ERR_SUBSIDY_PER_PASSENGER_CAP_EXCEEDED
    http: 422
    condition: "Proposal.subsidy_per_passenger_usd exceeds the community's non-null subsidy_per_passenger_cap_usd at submission."
  - id: ERR_ADJUSTMENT_EXCEEDS_CAP
    http: 422
    condition: "The computed cancellation adjustment exceeds 25 percent of the monthly entitlement."
  - id: ERR_OBLIGATION_EXCEEDED
    http: 422
    condition: "Certification, disbursement or a renegotiation acceptance would drive ServiceAgreement.obligated_remaining_usd below 0.00."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProgramAdmin
    description: "Program office operator: maintains reference data, drives solicitation status, opens and certifies reporting periods, approves and disburses payments, runs performance reviews and negotiates rates."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /eas/communities"
      - "POST /eas/carriers"
      - "POST /eas/carriers/{id}/standing"
      - "POST /eas/aircraft-types"
      - "POST /eas/aircraft-types/{id}/retire"
      - "POST /eas/fuel-indices"
      - "POST /eas/solicitations"
      - "POST /eas/solicitations/{id}/actions"
      - "POST /eas/service-agreements/{id}/status-actions"
      - "POST /eas/service-periods"
      - "POST /eas/service-periods/{id}/certify"
      - "POST /eas/subsidy-payments/{id}/actions"
      - "POST /eas/performance-reviews"
      - "POST /eas/rate-renegotiations/{id}/actions with action IN {COUNTER, ACCEPT, REJECT}"
    shared_operations:
      - "all GET endpoints"

  - name: EligibilityAnalyst
    description: "Determines community eligibility, per-passenger caps and distance bands. The analyst user id that certifies a determination is barred from later issuing the selection order for that community."
    identity: "opaque"
    exclusive_operations:
      - "POST /eas/communities/{id}/eligibility-determinations"
    shared_operations:
      - "GET /eas/communities/{id}"
      - "GET /eas/communities"
      - "GET /eas/communities/{id}/eligibility-determinations"
      - "GET /eas/carriers/{id}"
      - "GET /eas/service-agreements/{id}"

  - name: SelectionOfficer
    description: "Issues carrier selection orders and decides community termination petitions."
    identity: "opaque"
    exclusive_operations:
      - "POST /eas/solicitations/{id}/selection-order"
      - "POST /eas/termination-petitions/{id}/decision"
    shared_operations:
      - "all GET endpoints"

  - name: CommunityRepresentative
    description: "Acts for one community: files preference rankings over submitted proposals, files and withdraws termination petitions. X-User-ID equals the Community.id it represents."
    identity: "entity_backed:Community"
    exclusive_operations:
      - "POST /eas/solicitations/{id}/preferences"
      - "POST /eas/termination-petitions"
      - "POST /eas/termination-petitions/{id}/withdraw"
    shared_operations:
      - "GET /eas/communities/{id}"
      - "GET /eas/communities/{id}/eligibility-determinations"
      - "GET /eas/communities/{id}/solicitations"
      - "GET /eas/carriers/{id}"
      - "GET /eas/solicitations/{id}"
      - "GET /eas/solicitations/{id}/preferences"
      - "GET /eas/proposals/{id}"
      - "GET /eas/proposals"
      - "GET /eas/proposals/{id}/preferences"
      - "GET /eas/service-agreements/{id}"
      - "GET /eas/service-agreements"
      - "GET /eas/service-agreements/{id}/performance-reviews"
      - "GET /eas/service-periods/{id}"
      - "GET /eas/service-periods"
      - "GET /eas/subsidy-payments/{id}"
      - "GET /eas/termination-petitions/{id}"
      - "GET /eas/termination-petitions"

  - name: Carrier
    description: "Acts for one air carrier: drafts and submits proposals, files monthly operating reports and amendments, and files or revises rate renegotiations. X-User-ID equals the Carrier.id it acts as."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /eas/proposals"
      - "POST /eas/proposals/{id}/actions"
      - "POST /eas/service-periods/{id}/report"
      - "POST /eas/service-periods/{id}/amend"
      - "POST /eas/rate-renegotiations"
      - "POST /eas/rate-renegotiations/{id}/actions with action IN {REVISE, WITHDRAW}"
    shared_operations:
      - "GET /eas/communities/{id}"
      - "GET /eas/communities/{id}/solicitations"
      - "GET /eas/carriers/{id}"
      - "GET /eas/aircraft-types/{id}"
      - "GET /eas/fuel-indices"
      - "GET /eas/solicitations/{id}"
      - "GET /eas/proposals/{id}"
      - "GET /eas/proposals"
      - "GET /eas/proposals/{id}/preferences"
      - "GET /eas/service-agreements/{id}"
      - "GET /eas/service-agreements"
      - "GET /eas/service-agreements/{id}/performance-reviews"
      - "GET /eas/service-periods/{id}"
      - "GET /eas/service-periods"
      - "GET /eas/service-periods/{id}/payment-preview"
      - "GET /eas/subsidy-payments/{id}"
      - "GET /eas/subsidy-payments"
      - "GET /eas/termination-petitions/{id}"
      - "GET /eas/termination-petitions"
      - "GET /eas/rate-renegotiations/{id}"
      - "GET /eas/rate-renegotiations"
