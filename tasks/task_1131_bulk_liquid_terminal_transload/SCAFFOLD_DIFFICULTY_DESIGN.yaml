            - { call: "POST /movements", payload: { lease_id: "${l_id}", tank_id: "${t_id}", direction: "RECEIPT", mode: "VESSEL", product_grade: "DIESEL", declared_volume_bbl: 100, window_start: "2026-05-10T08:00:00Z", window_end: "2026-05-11T08:00:00Z" }, as: Scheduler, captures: { m_id: $.data.id } }
            - { call: "POST /movements/${m_id}/schedule", payload: { resource_id: "${r_id}" }, as: Scheduler }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T08:00:00Z" }, as: TerminalManager }
            - { call: "POST /movements/${m_id}/arrive", payload: {}, as: Scheduler }
