  # ===========================================================================
  # 7. From Table 7 (RBAC) — scope gates and segregation of duties.
  # ===========================================================================
  - section: rbac
    instances:

      - name: member_cannot_grant_own_badge_unauthorized
        claim_type: peer_roles
        grounds:
          - endpoints[POST /members/{id}/badge-access].roles
          - validations[priority 2].ERR_UNAUTHORIZED
          - roles.Member.shared_operations
        distinguishing_aspect: |
          Badge issuance is an operator-side act: Member is a declared role but is
          not on POST /members/{id}/badge-access, so a member granting their own
          badge is 403 ERR_UNAUTHORIZED (not 401, and not the ERR_FORBIDDEN_SCOPE
          used when the role is right but the resource belongs to someone else),
          and the very same payload from the SiteManager succeeds.
        test_recipe:
          setup:
            - "ACTIVE-CONTRACT chain; one ELIGIBLE EMPLOYEE member with a SIGNED waiver, still at access_status NO_BADGE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
