  # =========================================================================
  # 6. From Table 6 (Errors) — every catalogued error_id must be triggerable.
  #    The 61 ids of §1.6 are asserted across §1.8 and the §1.9 sections above;
  #    this section adds the envelope-uniformity claim and records the ids whose
  #    trigger lives in a §1.8 instance.
  # =========================================================================
  - section: errors
    instances:
      - name: every_error_response_carries_the_same_two_field_envelope_across_status_classes
        claim_type: violation_to_error
        grounds:
          - errors[ERR_VALIDATION]
          - errors[ERR_CYCLE_NOT_FOUND]
          - errors[ERR_CYCLE_INVALID_STATE]
          - errors[ERR_MANDATE_DEADLINE_REQUIRED]
        distinguishing_aspect: >-
          Four different status classes — 400 shape, 404 existence, 409 state, 422 semantic — must all
          come back as the SAME two-key envelope {"data": {"error_id", "message"}} with no envelope
          variation by class, and none of the four may leave a row or a version bump behind.
        test_recipe:
          setup:
            - "Facility NRH, department DEPT-A1 (CT), asset AC and a DRAFT cycle for plan year 2027; no requests yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
            - call: "POST /capital/departments"
              payload: { facility_id: "${fac_a_id}", name: "Diagnostic Imaging CT", modality_scope: "CT" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { dept_a1_id: $.data.id }
            - call: "POST /capital/assets"
              payload: { facility_id: "${fac_a_id}", department_id: "${dept_a1_id}", modality: "CT", model_name: "Aquilon CT-8", install_date: "2020-08-02T00:00:00Z", expected_life_years: 8, acquisition_cost_cents: 100000000, oem_support_end_date: "2029-06-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { asset_ac_id: $.data.id }
            - call: "POST /capital/cycles"
              payload: { plan_year: 2027, plan_year_start: "2027-01-01T00:00:00Z", total_capital_cents: 500000000, contingency_pct: 0.00, facility_contingency_pct: 0.00 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /capital/facilities"
              payload: { name: "Ghost Facility" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { e_shape: $.data.error_id, m_shape: $.data.message }
            - call: "GET /capital/cycles/00000000-0000-0000-0000-0000000000ff"
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { e_missing: $.data.error_id, m_missing: $.data.message }
            - call: "POST /capital/cycles/${c_id}/close-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { e_state: $.data.error_id, m_state: $.data.message }
            - call: "POST /capital/cycles/${c_id}/open-intake"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/requests"
              payload: { cycle_id: "${c_id}", department_id: "${dept_a1_id}", asset_id: "${asset_ac_id}", clinical_justification: "Mandated CT dose-monitoring upgrade.", current_annual_volume: 1000, projected_annual_volume: 2000, estimated_capital_cents: 100000000, annual_service_contract_cents: 10000000, disposable_unit_cents: 500, regulatory_mandate_flag: true }
              as: ClinicalRequester
              as_user_id: "${dept_a1_id}"
              captures: { e_semantic: $.data.error_id, m_semantic: $.data.message }
            - call: "GET /capital/requests?cycle_id=${c_id}"
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "GET /capital/facilities"
              as: CapitalPlanner
              as_user_id: "planner-setup"
          assert:
            - "Trigger step 1: HTTP 400 with ${e_shape} == ERR_VALIDATION"
            - "Trigger step 2: HTTP 404 with ${e_missing} == ERR_CYCLE_NOT_FOUND"
            - "Trigger step 3: HTTP 409 with ${e_state} == ERR_CYCLE_INVALID_STATE (close-intake from DRAFT)"
            - "Trigger step 5: HTTP 422 with ${e_semantic} == ERR_MANDATE_DEADLINE_REQUIRED (regulatory_mandate_flag true with no mandate_deadline)"
            - "All four bodies share one envelope: response_type == \"error\", a meta object carrying api_request_id and api_request_timestamp, and a data object holding exactly the two keys error_id and message — no top-level error/errors/detail key, no field-level error map, and each message a non-empty string"
            - "Trigger step 6: 0 ReplacementRequest rows — the 422 wrote nothing; trigger step 7: exactly 1 Facility (NRH) — the 400 wrote nothing"
            - "The cycle is INTAKE_OPEN at version 2 (only the successful open-intake bumped it); the failed close-intake left the version alone"

      - name: err_asset_not_replacement_eligible_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ASSET_NOT_REPLACEMENT_ELIGIBLE]
        excluded_because:
          difficulty_instance: ruls_eligibility_at_exactly_thirty_on_submit
          rationale: "Asserted on the failing side of the named §1.8 boundary instance (adjusted RULS 30.01 rejected, 30.00 accepted)."

      - name: err_stale_request_version_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_REQUEST_VERSION]
        excluded_because:
          difficulty_instance: existence_beats_stale_version_on_vote
          rationale: "The named §1.8 instance asserts ERR_STALE_REQUEST_VERSION at 412 once the id exists, after showing 404 outranks it."

      - name: err_unauthorized_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHORIZED]
        excluded_because:
          difficulty_instance: auth_beats_shape_on_screen
          rationale: "The named §1.8 instance asserts ERR_UNAUTHORIZED at 403 for a wrong-role screen carrying a malformed body."

      - name: err_allocation_insufficient_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ALLOCATION_INSUFFICIENT]
        excluded_because:
          difficulty_instance: request_state_beats_allocation_capacity_on_fund
          rationale: "The named §1.8 instance repairs the request state to expose ERR_ALLOCATION_INSUFFICIENT at 422 underneath."

      - name: err_negotiation_round_limit_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NEGOTIATION_ROUND_LIMIT]
        excluded_because:
          difficulty_instance: vendor_quote_negotiation_cycle_bounded_by_round_cap
          rationale: "The named §1.8 instance drives the counter/revise loop to round 3 and asserts the cap on the next revise."

      - name: err_downtime_window_conflict_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DOWNTIME_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: department_downtime_buffered_half_open_boundary
          rationale: "The named §1.8 instance asserts the conflict one second inside the 24-hour buffer and success exactly at it."

      - name: err_construction_capacity_exceeded_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CONSTRUCTION_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: facility_construction_closed_interval_capacity
          rationale: "The named §1.8 instance asserts the capacity error for a shared endpoint day under the closed-interval reading."

      - name: err_installation_not_commissioned_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INSTALLATION_NOT_COMMISSIONED]
        excluded_because:
          difficulty_instance: asset_decommission_depends_on_project_commissioning
          rationale: "The named §1.8 instance asserts the error at every pre-COMMISSIONED equipment status and success once commissioned."

      - name: err_no_eligible_voters_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NO_ELIGIBLE_VOTERS]
        excluded_because:
          difficulty_instance: committee_decision_depends_on_member_active_flag
          rationale: "The named §1.8 instance empties the electorate by deactivating the only eligible member and asserts the 409."

      - name: err_cycle_invalid_state_on_submit_is_triggerable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_CYCLE_INVALID_STATE]
        excluded_because:
          difficulty_instance: request_submit_depends_on_cycle_intake_stage
          rationale: "The named §1.8 instance asserts ERR_CYCLE_INVALID_STATE on submit at every cycle stage other than INTAKE_OPEN."

  # =========================================================================
  # 7. From Table 7 (RBAC) — role_model: segregation_of_duties
  # =========================================================================
  - section: rbac
    instances:
      - name: identity_then_role_then_existence_is_the_first_three_rungs_of_the_ladder
        claim_type: exclusive_operation_denied
        grounds:
          - validations[priority=10]
          - validations[priority=12]
          - validations[priority=20]
        distinguishing_aspect: >-
          The three cheapest checks are strictly ordered and the target id does not even have to exist:
          a blank X-User-ID on a fund of a non-existent request is 401, the same call with a valid
          auditor identity is 403, and only a correctly-roled caller ever sees the 404.
        test_recipe:
          setup:
            - "Empty database with the logical clock at 2026-08-01T00:00:00Z; no request with id 00000000-0000-0000-0000-0000000000ff exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
          trigger:
            - call: "POST /capital/requests/00000000-0000-0000-0000-0000000000ff/fund"
              payload: {}
              as: CapitalPlanner
              as_user_id: ""
              captures: { e_no_context: $.data.error_id }
            - call: "GET /capital/cycles"
              as: ComplianceAuditor
              as_user_id: ""
              captures: { e_no_context_read: $.data.error_id }
            - call: "GET /capital/cycles"
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "POST /capital/requests/00000000-0000-0000-0000-0000000000ff/fund"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { e_wrong_role: $.data.error_id }
            - call: "POST /capital/requests/00000000-0000-0000-0000-0000000000ff/fund"
              payload: {}
              as: CapitalPlanner
              as_user_id: "planner-fund"
              captures: { e_missing_row: $.data.error_id }
          assert:
            - "Trigger step 1: ${e_no_context} == ERR_USER_CONTEXT_REQUIRED at HTTP 401 — V01 (priority 10) fires even though the path id does not exist and the role would have been right"
            - "Trigger step 2: ${e_no_context_read} == ERR_USER_CONTEXT_REQUIRED at HTTP 401 — a blank header is refused on a shared GET too"
            - "Trigger step 3: HTTP 200 with an empty list (total_count 0) — the auditor may read"
            - "Trigger step 4: ${e_wrong_role} == ERR_UNAUTHORIZED at HTTP 403 — V02 (priority 12) outranks the V03 existence check"
            - "Trigger step 5: ${e_missing_row} == ERR_REQUEST_NOT_FOUND at HTTP 404 — only the correctly-roled caller reaches V03"

