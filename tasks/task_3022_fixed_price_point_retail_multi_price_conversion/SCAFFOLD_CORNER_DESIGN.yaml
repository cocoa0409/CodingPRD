              as: StoreOperationsManager
              captures: { err_same: $.data.error_id }
            - call: "POST /merchandise/season-windows"
              payload: { season_code: "HARVEST_2026", opens_on: "2026-09-01T00:00:00Z", closes_on: "2026-11-30T00:00:00Z" }
              as: ResetCalendarPlanner
              captures: { window_id: $.data.id }
            - call: "POST /merchandise/season-windows/${window_id}/schedule"
              payload: {}
              as: ResetCalendarPlanner
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", season_window_id: "${window_id}", aisle_code: "A11", starts_at: "2026-09-02T00:00:00Z", ends_at: "2026-09-06T00:00:00Z", allocated_shelf_sqft: 50.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { r_one_id: $.data.id }
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", season_window_id: "${window_id}", aisle_code: "A12", starts_at: "2026-09-02T00:00:00Z", ends_at: "2026-09-06T00:00:00Z", allocated_shelf_sqft: 50.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { r_two_id: $.data.id }
          trigger:
            - call: "GET /merchandise/conversion-projects/${err_same}/coverage"
