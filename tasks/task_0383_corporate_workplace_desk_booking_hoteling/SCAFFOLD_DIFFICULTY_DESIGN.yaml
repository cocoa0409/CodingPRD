scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: amenity_chargeback_provisional_vs_final_diverge
        grounds:
          - calculations.amenity_chargeback
          - entities.Reservation.fields.provisional_chargeback_cents
          - entities.Reservation.fields.final_chargeback_cents
          - state_machines.Reservation.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          Provisional chargeback counts REQUESTED+APPROVED amenity lines while final
          counts APPROVED only; on the SAME reservation with one APPROVED line (40000c)
          and one still-REQUESTED line (40000c) the two variants differ
          (provisional 78120c vs final 39060c). This is the Reservation-billing domain.
        test_recipe:
          setup:
            - "A floor (workday 540..1080), neighborhood, seat, employee, capacity policy exist."
            - "Employee holds a CHECKED_IN seat reservation on 2026-06-20."
            - "Two amenity lines added: line A unit_price 40000 qty 1 (APPROVED), line B unit_price 40000 qty 1 (still REQUESTED)."
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQ" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 1, workday_start_minute: 540, workday_end_minute: 1080 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { max_active_reservations_per_employee: 5, grace_minutes: 30, enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "Eng", capacity_cap_pct: 100 }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "S1" }
              as: FacilityManager
              captures: { seat_id: $.data.id, seat_v: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "e1@x.com", full_name: "E One", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_id: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-06-20", current_minute: 545 }
              as: FacilityManager
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_id}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-06-20", start_minute: 540, end_minute: 1080, expected_seat_version: "${seat_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { resv_id: $.data.id }
            - call: "POST /workplace/reservations/${resv_id}/check-in"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /workplace/reservations/${resv_id}/amenities"
              payload: { amenity_code: "MONITOR", unit_price_cents: 40000, quantity: 1 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { line_a_id: $.data.id }
            - call: "POST /workplace/reservations/${resv_id}/amenities"
              payload: { amenity_code: "PARKING", unit_price_cents: 40000, quantity: 1 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { line_b_id: $.data.id }
            - call: "POST /workplace/amenity-requests/${line_a_id}/approve"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /workplace/reservations/${resv_id}/complete"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { final_cents: $.data.final_chargeback_cents, prov_cents: $.data.provisional_chargeback_cents }
          assert:
            - "Reservation.${resv_id}.provisional_chargeback_cents == 78120"
            - "Reservation.${resv_id}.final_chargeback_cents == 39060"
            - "Reservation.${resv_id}.billing_status == FINALIZED"
            - "Reservation.${resv_id}.final_chargeback_cents != Reservation.${resv_id}.provisional_chargeback_cents"

      - name: utilization_planned_vs_realized_diverge
        grounds:
          - calculations.utilization_report
          - entities.Reservation.fields.occupied_minutes
          - entities.Floor.fields.capacity_minutes
        distinguishing_aspect: |
          PLANNED utilization counts BOOKED reservations toward occupancy; REALIZED
          counts only CHECKED_IN/COMPLETED. On a 540-min-capacity floor with one
          CHECKED_IN 180-min reservation and one BOOKED 180-min no-show, PLANNED=66.67
          while REALIZED=33.33. This is the Floor-analytics domain (distinct from Reservation billing).
        test_recipe:
          setup:
            - "Floor (workday 540..1080 => capacity 540), neighborhood, 1 seat, employee."
            - "Reservation A 540..720 CHECKED_IN; Reservation B 720..900 left BOOKED (never checked in)."
            - "Clock at 2026-06-21 545."
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQ2" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 2, workday_start_minute: 540, workday_end_minute: 1080 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { max_active_reservations_per_employee: 5, grace_minutes: 30, enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "Eng2", capacity_cap_pct: 100 }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "S1" }
              as: FacilityManager
              captures: { seat_id: $.data.id, seat_v0: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "e2@x.com", full_name: "E Two", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_id: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-06-21", current_minute: 545 }
              as: FacilityManager
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_id}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-06-21", start_minute: 540, end_minute: 720, expected_seat_version: "${seat_v0}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { resv_a: $.data.id }
            - call: "GET /workplace/seats/${seat_id}"
              payload: {}
              as: FacilityManager
              captures: { seat_v1: $.data.version }
            - call: "POST /workplace/reservations/${resv_a}/check-in"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_id}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-06-21", start_minute: 720, end_minute: 900, expected_seat_version: "${seat_v1}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { resv_b: $.data.id }
          trigger:
            - call: "GET /workplace/floors/${floor_id}/utilization?date=2026-06-21&mode=PLANNED"
              payload: { date: "2026-06-21", mode: "PLANNED" }
              as: Analyst
              captures: { planned_pct: $.data.floor_utilization_pct }
            - call: "GET /workplace/floors/${floor_id}/utilization?date=2026-06-21&mode=REALIZED"
              payload: { date: "2026-06-21", mode: "REALIZED" }
              as: Analyst
              captures: { realized_pct: $.data.floor_utilization_pct }
          assert:
            - "PLANNED floor_utilization_pct == 66.67"
            - "REALIZED floor_utilization_pct == 33.33"
            - "PLANNED floor_utilization_pct != REALIZED floor_utilization_pct"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: amenity_fee_round_per_line_then_sum_mode_b
        grounds:
          - calculations.amenity_chargeback
          - entities.AmenityRequest.fields.line_total_cents
          - entities.Reservation.fields.final_chargeback_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the 8.5% service fee is rounded per line to whole
          cents THEN summed. With APPROVED amounts {125,255,225}, per-line fees
          {11,22,19} sum to 52; sum-then-round of raw fees would give 51. The scaffold
          pins per-line-then-sum, so final fee=52 and chargeback total=624.
        test_recipe:
          setup:
            - "Floor, neighborhood, seat, employee, capacity policy."
            - "CHECKED_IN reservation with three APPROVED amenity lines: (125x1),(255x1),(75x3)."
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQ3" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 3, workday_start_minute: 540, workday_end_minute: 1080 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { max_active_reservations_per_employee: 5, grace_minutes: 30, enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "Eng3", capacity_cap_pct: 100 }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "S1" }
              as: FacilityManager
              captures: { seat_id: $.data.id, seat_v: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "e3@x.com", full_name: "E Three", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_id: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-06-22", current_minute: 545 }
              as: FacilityManager
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_id}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-06-22", start_minute: 540, end_minute: 1080, expected_seat_version: "${seat_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { resv_id: $.data.id }
            - call: "POST /workplace/reservations/${resv_id}/check-in"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /workplace/reservations/${resv_id}/amenities"
              payload: { amenity_code: "A", unit_price_cents: 125, quantity: 1 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { l1: $.data.id }
            - call: "POST /workplace/reservations/${resv_id}/amenities"
              payload: { amenity_code: "B", unit_price_cents: 255, quantity: 1 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { l2: $.data.id }
            - call: "POST /workplace/reservations/${resv_id}/amenities"
              payload: { amenity_code: "C", unit_price_cents: 75, quantity: 3 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { l3: $.data.id }
            - call: "POST /workplace/amenity-requests/${l1}/approve"
              payload: {}
              as: FacilityManager
            - call: "POST /workplace/amenity-requests/${l2}/approve"
              payload: {}
              as: FacilityManager
            - call: "POST /workplace/amenity-requests/${l3}/approve"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /workplace/reservations/${resv_id}/complete"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { final_cents: $.data.final_chargeback_cents }
          assert:
            - "Reservation.${resv_id}.final_chargeback_cents == 624"

      - name: amenity_discount_tier_keyed_on_fee_inclusive_total_mode_c
        grounds:
          - calculations.amenity_chargeback
          - entities.Reservation.fields.final_chargeback_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the discount tier is keyed on
          pre_discount_total = subtotal + fee, but fee itself feeds that total. With a
          single APPROVED line (160x3 => subtotal 480, under the 500 tier floor), the
          8.5% fee (41) pushes pre_discount_total to 521, crossing into the 5% tier;
          discount 26, total 495. Pinning fee-before-tier is what makes this well-defined
          (a naive subtotal-keyed tier would give 0% discount, total 521).
        test_recipe:
          setup:
            - "Floor, neighborhood, seat, employee, capacity policy."
            - "CHECKED_IN reservation with one APPROVED amenity line (unit_price 160, qty 3)."
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQ4" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 4, workday_start_minute: 540, workday_end_minute: 1080 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { max_active_reservations_per_employee: 5, grace_minutes: 30, enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "Eng4", capacity_cap_pct: 100 }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "S1" }
              as: FacilityManager
              captures: { seat_id: $.data.id, seat_v: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "e4@x.com", full_name: "E Four", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_id: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-06-23", current_minute: 545 }
              as: FacilityManager
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_id}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-06-23", start_minute: 540, end_minute: 1080, expected_seat_version: "${seat_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { resv_id: $.data.id }
            - call: "POST /workplace/reservations/${resv_id}/check-in"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /workplace/reservations/${resv_id}/amenities"
              payload: { amenity_code: "CATERING", unit_price_cents: 160, quantity: 3 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { l1: $.data.id }
            - call: "POST /workplace/amenity-requests/${l1}/approve"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /workplace/reservations/${resv_id}/complete"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { final_cents: $.data.final_chargeback_cents }
          assert:
            - "Reservation.${resv_id}.final_chargeback_cents == 495"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: visitor_pass_cyclic_changes_requested_loop
        grounds:
          - state_machines.VisitorPass.REQUESTED_to_CHANGES_REQUESTED
          - state_machines.VisitorPass.CHANGES_REQUESTED_to_REQUESTED
          - entities.VisitorPass.fields.status
        distinguishing_aspect: |
          VisitorPass cycles REQUESTED -> CHANGES_REQUESTED -> REQUESTED an arbitrary
          number of rounds (host requests changes, receptionist resubmits) before
          APPROVED; this is a genuine cycle on the VisitorPass entity, distinct from
          the parallel-dimension non-linearity on Reservation.
        test_recipe:
          setup:
            - "Floor, neighborhood, seat, host employee."
            - "A REQUESTED visitor pass on the seat for 2026-06-24 600..720."
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQ5" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 5, workday_start_minute: 540, workday_end_minute: 1080 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "Eng5", capacity_cap_pct: 100 }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "V1" }
              as: FacilityManager
              captures: { seat_id: $.data.id }
            - call: "POST /workplace/employees"
              payload: { email: "host5@x.com", full_name: "Host Five", team_code: "ENG" }
              as: FacilityManager
              captures: { host_id: $.data.id }
            - call: "POST /workplace/visitor-passes"
              payload: { host_employee_id: "${host_id}", seat_id: "${seat_id}", visitor_name: "Guest", booking_date: "2026-06-24", start_minute: 600, end_minute: 720 }
              as: Receptionist
              captures: { vp_id: $.data.id }
          trigger:
            - call: "POST /workplace/visitor-passes/${vp_id}/request-changes"
              payload: {}
              as: Employee
              as_user_id: "${host_id}"
              captures: { st1: $.data.status }
            - call: "POST /workplace/visitor-passes/${vp_id}/resubmit"
              payload: { start_minute: 660, end_minute: 780 }
              as: Receptionist
              captures: { st2: $.data.status }
            - call: "POST /workplace/visitor-passes/${vp_id}/request-changes"
              payload: {}
              as: Employee
              as_user_id: "${host_id}"
              captures: { st3: $.data.status }
          assert:
            - "after first request-changes VisitorPass.${vp_id}.status == CHANGES_REQUESTED"
            - "after resubmit VisitorPass.${vp_id}.status == REQUESTED"
            - "after second request-changes VisitorPass.${vp_id}.status == CHANGES_REQUESTED"

      - name: reservation_parallel_occupancy_and_billing_dimensions
        grounds:
          - state_machines.Reservation.BOOKED_to_CHECKED_IN
          - state_machines.Reservation.NONE_to_PROVISIONAL
          - entities.Reservation.fields.occupancy_status
          - entities.Reservation.fields.billing_status
        distinguishing_aspect: |
          Reservation carries two independent status dimensions: occupancy_status
          (BOOKED->CHECKED_IN) advances via check-in while billing_status
          (NONE->PROVISIONAL) advances independently via amenity creation; the two
          evolve on the same row without coupling. This is the parallel-dimension
          non-linearity on the Reservation entity (distinct from VisitorPass cycle).
        test_recipe:
          setup:
            - "Floor, neighborhood, seat, employee, capacity policy; CHECKED_IN reservation."
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQ6" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 6, workday_start_minute: 540, workday_end_minute: 1080 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { max_active_reservations_per_employee: 5, grace_minutes: 30, enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "Eng6", capacity_cap_pct: 100 }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "S1" }
              as: FacilityManager
              captures: { seat_id: $.data.id, seat_v: $.data.version }
            - call: "POST /workplace/employees"
              payload: { email: "e6@x.com", full_name: "E Six", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_id: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-06-25", current_minute: 545 }
              as: FacilityManager
            - call: "POST /workplace/reservations"
              payload: { employee_id: "${emp_id}", resource_type: "SEAT", seat_id: "${seat_id}", booking_date: "2026-06-25", start_minute: 540, end_minute: 1080, expected_seat_version: "${seat_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { resv_id: $.data.id }
            - call: "POST /workplace/reservations/${resv_id}/check-in"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
          trigger:
            - call: "POST /workplace/reservations/${resv_id}/amenities"
              payload: { amenity_code: "MONITOR", unit_price_cents: 1000, quantity: 1 }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "GET /workplace/reservations/${resv_id}"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
              captures: { occ: $.data.occupancy_status, bill: $.data.billing_status }
          assert:
            - "Reservation.${resv_id}.occupancy_status == CHECKED_IN"
            - "Reservation.${resv_id}.billing_status == PROVISIONAL"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: noshow_release_cascade_depth3_strike_to_suspend
        grounds:
          - state_machines.Reservation.BOOKED_to_NO_SHOW_RELEASED
          - calculations.strike_score
          - state_machines.Employee.ACTIVE_to_SUSPENDED
          - entities.Employee.fields.strike_score
          - entities.Employee.fields.booking_privilege
        distinguishing_aspect: |
          Depth-3 cascade originating at the no-show release transition: release of the
          third grace-expired reservation appends a NO_SHOW NoShowEvent (link 1) ->
          strike_score recomputes to 30 (link 2, caused by the appended event) ->
          booking_privilege flips ACTIVE->SUSPENDED (link 3, caused by score crossing 30).
        test_recipe:
          setup:
            - "Floor (grace 30), neighborhood (cap 100%), one seat, employee (STRIKE_WEIGHT 10, SUSPEND_THRESHOLD 30)."
            - "Employee already has 2 prior NO_SHOW strikes (score 20) from two earlier released reservations on 2026-06-26."
            - "A third BOOKED reservation 540..600 on 2026-06-27 whose grace has expired (clock at 2026-06-27 700)."
          setup_api_calls:
            - call: "POST /workplace/sites"
              payload: { name: "HQ7" }
              as: FacilityManager
              captures: { site_id: $.data.id }
            - call: "POST /workplace/sites/${site_id}/floors"
              payload: { level: 7, workday_start_minute: 540, workday_end_minute: 1080 }
              as: FacilityManager
              captures: { floor_id: $.data.id }
            - call: "POST /workplace/floors/${floor_id}/capacity-policy"
              payload: { max_active_reservations_per_employee: 5, grace_minutes: 30, enforce_team_zoning: false }
              as: FacilityManager
            - call: "POST /workplace/floors/${floor_id}/neighborhoods"
              payload: { name: "Eng7", capacity_cap_pct: 100 }
              as: FacilityManager
              captures: { nb_id: $.data.id }
            - call: "POST /workplace/neighborhoods/${nb_id}/seats"
              payload: { label: "S1" }
              as: FacilityManager
              captures: { seat_id: $.data.id }
            - call: "POST /workplace/employees"
              payload: { email: "e7@x.com", full_name: "E Seven", team_code: "ENG" }
              as: FacilityManager
              captures: { emp_id: $.data.id }
            - call: "POST /workplace/_clock/set"
              payload: { current_date: "2026-06-26", current_minute: 545 }
              as: FacilityManager
            - call: "GET /workplace/seats/${seat_id}"
              payload: {}
              as: FacilityManager
              captures: { sv1: $.data.version }
            - call: "POST /workplace/reservations"
