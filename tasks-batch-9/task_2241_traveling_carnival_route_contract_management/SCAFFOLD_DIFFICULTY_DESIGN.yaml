              as: LotBoss
              captures: { alloc_o1c: $.data.id }
          assert:
            - "Before the trigger: RideAllocation.${alloc_o1a}.status == RESERVED, occupation_start == 2026-09-01T06:00:00Z, occupation_end == 2026-09-08T12:00:00Z"
            - "UNDER THE BUFFER: trigger call 1 returns HTTP 409 with error_id == ERR_RIDE_DOUBLE_BOOKED (gap 2 h < 0 + 4 h)"
            - "UNDER THE BUFFER: RouteStop.${stop_o1b}.allocated_sqft_used == 0 and GET /ride-allocations?route_stop_id=${stop_o1b} returns 0 rows"
            - "AT THE BUFFER: trigger call 2 returns HTTP 201 with RideAllocation.${alloc_o1c}.occupation_start == 2026-09-08T16:00:00Z and occupation_end == 2026-09-15T12:00:00Z"
            - "AT THE BUFFER: RideAllocation.${alloc_o1c}.footprint_charged_sqft == 2404 and power_charged_amps == 138.0"
            - "GET /ride-allocations?ride_id=${ride_o1} returns exactly 2 rows, both non-terminal"

      - name: crew_shift_intervals_are_half_open_so_back_to_back_shifts_are_admitted
        grounds:
          - validations[priority=71]
          - validations[priority=75]
          - calculations.stop_labor_cost
          - entities.Worker.fields.scheduled_hours_total
          - errors[ERR_CREW_SHIFT_OVERLAP]
        distinguishing_aspect: |
          The contended resource is a WORKER and its shift interval is HALF-OPEN with no buffer at all — the exact
          opposite convention to the ride's closed padded occupation: a second shift starting at the instant the first
          ends (2026-09-04T20:00:00Z) is admitted, while a third shift that genuinely straddles the boundary
          (19:00..21:00) is refused with ERR_CREW_SHIFT_OVERLAP. Both admitted rows are TICKETING, so no rigging
          premium is applied and the ledger reads 32000 rather than 35200.
        test_recipe:
          setup:
            - "Jurisdiction OH with max_consecutive_work_days 6; Venue V1; Route R1 DRAFT with one PLANNED stop A (open_date 2026-09-04T12:00:00Z, close_date 2026-09-07T12:00:00Z)."
