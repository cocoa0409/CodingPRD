              as: Controller
              captures: { sc_pwp: $.data.id }
            - call: "POST /consultant-subcontracts/${sc_pwp}/execute"
              payload: {}
              as: Controller
            - call: "POST /consultant-subcontracts"
              payload: { project_id: "${p_id}", phase_id: "${ph_id}", consultant_name: "Cedar Structural", committed_amount: 30000.00, pay_when_paid: false, commitment_start: "2026-04-01", commitment_end: "2026-12-31" }
              as: Controller
              captures: { sc_free: $.data.id }
            - call: "POST /consultant-subcontracts/${sc_free}/execute"
              payload: {}
              as: Controller
            - call: "POST /consultant-invoices"
              payload: { subcontract_id: "${sc_pwp}", amount: 20000.00, invoice_date: "2026-05-20", backup_attached: true }
