scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: trade_in_provisional_vs_final_credit
        grounds:
          - calculations.trade_in_credit_valuation
          - state_machines.TradeIn.SUBMITTED_to_UNDER_INSPECTION
          - state_machines.TradeIn.UNDER_INSPECTION_to_APPROVED
          - entities.TradeIn.fields.provisional_value_cents
          - entities.TradeIn.fields.final_value_cents
        distinguishing_aspect: |
          Dual-variant lives on the TradeIn entity (buy/trade-in credit domain): provisional uses
          claimed grades with no bonus, final uses inspected grades plus the 20% CREDIT bonus, so the
          same submission yields 1400 provisional but 1320 final.
        test_recipe:
          setup:
            - "One Customer with payout_method CREDIT, a DRAFT TradeIn with two lines (VG base 3000, NM base 1000), submitted then inspected with line1 regraded down to G, line2 NM confirmed."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "seller@x.com", full_name: "Seller" }
              as: Anonymous
              captures: { seller_id: "$.data.id" }
            - call: "POST /shop/trade-ins"
              payload: { customer_id: "${seller_id}", payout_method: "CREDIT" }
              as: Customer
              as_user_id: "${seller_id}"
              captures: { ti_id: "$.data.id" }
            - call: "POST /shop/trade-ins/${ti_id}/lines"
              payload: { format: "VINYL", claimed_grade: "VG", base_value_cents: 3000 }
              as: Customer
              as_user_id: "${seller_id}"
              captures: { line1_id: "$.data.id" }
            - call: "POST /shop/trade-ins/${ti_id}/lines"
              payload: { format: "CD", claimed_grade: "NM", base_value_cents: 1000 }
              as: Customer
              as_user_id: "${seller_id}"
              captures: { line2_id: "$.data.id" }
            - call: "POST /shop/trade-ins/${ti_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${seller_id}"
            - call: "POST /shop/trade-ins/${ti_id}/start-inspection"
              payload: {}
              as: Grader
            - call: "PATCH /shop/trade-in-lines/${line1_id}"
              payload: { inspected_grade: "G" }
              as: Grader
            - call: "PATCH /shop/trade-in-lines/${line2_id}"
              payload: { inspected_grade: "NM" }
              as: Grader
          trigger:
            - call: "POST /shop/trade-ins/${ti_id}/approve"
              payload: {}
              as: Grader
          assert:
            - "TradeIn.${ti_id}.provisional_value_cents == 1400"
            - "TradeIn.${ti_id}.final_value_cents == 1320"
            - "TradeIn.${ti_id}.final_value_cents != TradeIn.${ti_id}.provisional_value_cents"
            - "Customer.${seller_id}.store_credit_cents == 1320"

      - name: consignment_estimated_vs_actual_payout
        grounds:
          - calculations.consignment_payout
          - state_machines.Consignment.DRAFT_to_ACTIVE
          - state_machines.Consignment.ACTIVE_to_SOLD
          - entities.Consignment.fields.estimated_payout_cents
          - entities.Consignment.fields.actual_payout_cents
        distinguishing_aspect: |
          Dual-variant lives on the Consignment entity (consignment payout domain, different from TradeIn):
          estimated is pinned at ACTIVE from list_price 10000 (payout 7500) and is NOT recomputed on
          markdown, while actual is computed at SOLD from the marked-down sale_price 8000 (payout 5900).
        test_recipe:
          setup:
            - "A consignor with an ACTIVE consignment listed at 10000 (estimated payout pinned at 7500), then marked down to 8000; a buyer IN_STORE order containing the consigned copy, paid and about to be fulfilled."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "consignor@x.com", full_name: "Consignor" }
              as: Anonymous
              captures: { consignor_id: "$.data.id" }
            - call: "POST /shop/customers"
              payload: { email: "buyer@x.com", full_name: "Buyer" }
              as: Anonymous
              captures: { buyer_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "Miles Davis", title: "Kind of Blue", format: "VINYL", base_price_cents: 3000 }
              as: Manager
              captures: { prod_id: "$.data.id" }
            - call: "POST /shop/consignments"
              payload: { consignor_id: "${consignor_id}", list_price_cents: 10000, product_id: "${prod_id}", condition_grade: "VG_PLUS" }
              as: Manager
              captures: { cons_id: "$.data.id" }
            - call: "POST /shop/consignments/${cons_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /shop/consignments/${cons_id}/markdown"
              payload: { new_list_price_cents: 8000 }
              as: Manager
            - call: "GET /shop/inventory-items?consignment_id=${cons_id}"
              payload: {}
              as: Manager
              captures: { cons_item_id: "$.data[0].id" }
            - call: "POST /shop/orders"
              payload: { customer_id: "${buyer_id}", channel: "IN_STORE" }
              as: Customer
              as_user_id: "${buyer_id}"
              captures: { ord_id: "$.data.id" }
            - call: "POST /shop/orders/${ord_id}/lines"
              payload: { inventory_item_id: "${cons_item_id}" }
              as: Customer
              as_user_id: "${buyer_id}"
            - call: "POST /shop/orders/${ord_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${buyer_id}"
            - call: "POST /shop/orders/${ord_id}/capture-payment"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /shop/orders/${ord_id}/fulfill"
              payload: {}
              as: StoreClerk
          assert:
            - "Consignment.${cons_id}.estimated_payout_cents == 7500"
            - "Consignment.${cons_id}.actual_payout_cents == 5900"
            - "Consignment.${cons_id}.actual_payout_cents != Consignment.${cons_id}.estimated_payout_cents"
            - "Consignment.${cons_id}.status == SOLD"
            - "Customer.${consignor_id}.store_credit_cents == 5900"

  # =================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: trade_in_round_per_line_then_sum
        grounds:
          - calculations.trade_in_credit_valuation
          - state_machines.TradeIn.DRAFT_to_SUBMITTED
          - entities.TradeInLine.fields.base_value_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding with pinned order round-each-line-then-sum: three lines base 55 at VG
          (0.30 => 16.5 -> 17 each) sum to 51, whereas sum-then-round (165*0.30 = 49.5 -> 50) would give
          50. The scaffold pins per-line-first, so provisional_value_cents == 51.
        test_recipe:
          setup:
            - "A DRAFT CASH TradeIn with three lines each base 55 at claimed grade VG, submitted to trigger the pinned round-each-line-then-sum provisional valuation."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "seller2@x.com", full_name: "Seller Two" }
              as: Anonymous
              captures: { s2_id: "$.data.id" }
            - call: "POST /shop/trade-ins"
              payload: { customer_id: "${s2_id}", payout_method: "CASH" }
              as: Customer
              as_user_id: "${s2_id}"
              captures: { ti2_id: "$.data.id" }
            - call: "POST /shop/trade-ins/${ti2_id}/lines"
              payload: { format: "VINYL", claimed_grade: "VG", base_value_cents: 55 }
              as: Customer
              as_user_id: "${s2_id}"
            - call: "POST /shop/trade-ins/${ti2_id}/lines"
              payload: { format: "VINYL", claimed_grade: "VG", base_value_cents: 55 }
              as: Customer
              as_user_id: "${s2_id}"
            - call: "POST /shop/trade-ins/${ti2_id}/lines"
              payload: { format: "VINYL", claimed_grade: "VG", base_value_cents: 55 }
              as: Customer
              as_user_id: "${s2_id}"
          trigger:
            - call: "POST /shop/trade-ins/${ti2_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${s2_id}"
          assert:
            - "TradeIn.${ti2_id}.provisional_value_cents == 51"
            - "TradeIn.${ti2_id}.status == SUBMITTED"

      - name: order_total_pinned_eval_order
        grounds:
          - calculations.order_total
          - state_machines.Order.PENDING_to_RESERVED
          - entities.Order.fields.subtotal_cents
          - entities.Order.fields.discount_cents
          - entities.Order.fields.shipping_cents
          - entities.Order.fields.total_cents
        distinguishing_aspect: |
          Mode (c) evaluation-order-pinned circular-looking dependency: shipping keys off pre-discount
          subtotal while discount keys off the loyalty tier; the pinned order (subtotal -> discount ->
          shipping-on-subtotal -> total) yields subtotal 4000, discount 200 (SILVER 5%), shipping 599
          (4000<5000), total 4399 — a naive discount-then-shipping-threshold order would free-ship wrong.
        test_recipe:
          setup:
            - "A SILVER-tier buyer (150 loyalty points) with an ONLINE order holding two NEW NM copies of a base-2000 product (subtotal 4000)."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "silver@x.com", full_name: "Silver Buyer" }
              as: Anonymous
              captures: { sb_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "Radiohead", title: "OK Computer", format: "VINYL", base_price_cents: 2000 }
              as: Manager
              captures: { rp_id: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${rp_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
              captures: { it1_id: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${rp_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
              captures: { it2_id: "$.data.id" }
            - call: "POST /shop/_loyalty/adjust-points"
              payload: { customer_id: "${sb_id}", delta_points: 150 }
              as: Manager
            - call: "POST /shop/orders"
              payload: { customer_id: "${sb_id}", channel: "ONLINE" }
              as: Customer
              as_user_id: "${sb_id}"
              captures: { so_id: "$.data.id" }
            - call: "POST /shop/orders/${so_id}/lines"
              payload: { inventory_item_id: "${it1_id}" }
              as: Customer
              as_user_id: "${sb_id}"
          trigger:
            - call: "POST /shop/orders/${so_id}/lines"
              payload: { inventory_item_id: "${it2_id}" }
              as: Customer
              as_user_id: "${sb_id}"
          assert:
            - "Order.${so_id}.subtotal_cents == 4000"
            - "Order.${so_id}.discount_cents == 200"
            - "Order.${so_id}.shipping_cents == 599"
            - "Order.${so_id}.total_cents == 4399"

  # =================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: grading_dispute_needs_info_cycle
        grounds:
          - state_machines.GradingDispute.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.GradingDispute.NEEDS_INFO_to_UNDER_REVIEW
          - entities.GradingDispute.fields.status
        distinguishing_aspect: |
          GradingDispute is cyclic: UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW can repeat. The test drives
          two full loops and confirms the entity legitimately re-enters UNDER_REVIEW each time (not a
          one-way linear pipeline), landing back in UNDER_REVIEW after the second provide-info.
        test_recipe:
          setup:
            - "A used InventoryItem with an OPEN GradingDispute moved to UNDER_REVIEW, then looped NEEDS_INFO<->UNDER_REVIEW once already."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "disp@x.com", full_name: "Disputer" }
              as: Anonymous
              captures: { d_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "Nirvana", title: "Nevermind", format: "VINYL", base_price_cents: 2500 }
              as: Manager
              captures: { np_id: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${np_id}", is_used: true, condition_grade: "VG" }
              as: StoreClerk
              captures: { ni_id: "$.data.id" }
            - call: "POST /shop/grading-disputes"
              payload: { inventory_item_id: "${ni_id}", customer_id: "${d_id}", claimed_grade: "VG_PLUS" }
              as: Customer
              as_user_id: "${d_id}"
              captures: { gd_id: "$.data.id" }
            - call: "POST /shop/grading-disputes/${gd_id}/start-review"
              payload: {}
              as: Grader
            - call: "POST /shop/grading-disputes/${gd_id}/request-info"
              payload: {}
              as: Grader
            - call: "POST /shop/grading-disputes/${gd_id}/provide-info"
              payload: {}
              as: Customer
              as_user_id: "${d_id}"
            - call: "POST /shop/grading-disputes/${gd_id}/request-info"
              payload: {}
              as: Grader
          trigger:
            - call: "POST /shop/grading-disputes/${gd_id}/provide-info"
              payload: {}
              as: Customer
              as_user_id: "${d_id}"
          assert:
            - "GradingDispute.${gd_id}.status == UNDER_REVIEW"

      - name: order_parallel_payment_fulfillment_dimensions
        grounds:
          - state_machines.Order.UNPAID_to_AUTHORIZED
          - state_machines.Order.PENDING_to_RESERVED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Order carries two independent state dimensions on one row (parallel shape, different entity from
          GradingDispute): payment can reach AUTHORIZED while fulfillment is still RESERVED, and the two
          advance via distinct triggers — proving they evolve independently, not as one linear chain.
        test_recipe:
          setup:
            - "An ONLINE order with one NEW NM line already added (fulfillment RESERVED, payment UNPAID)."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "par@x.com", full_name: "Parallel" }
              as: Anonymous
              captures: { pc_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "Pink Floyd", title: "Wish You Were Here", format: "VINYL", base_price_cents: 3000 }
              as: Manager
              captures: { pf_id: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${pf_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
              captures: { pi_id: "$.data.id" }
            - call: "POST /shop/orders"
              payload: { customer_id: "${pc_id}", channel: "ONLINE" }
              as: Customer
              as_user_id: "${pc_id}"
              captures: { po_id: "$.data.id" }
            - call: "POST /shop/orders/${po_id}/lines"
              payload: { inventory_item_id: "${pi_id}" }
              as: Customer
              as_user_id: "${pc_id}"
          trigger:
            - call: "POST /shop/orders/${po_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${pc_id}"
          assert:
            - "Order.${po_id}.payment_status == AUTHORIZED"
            - "Order.${po_id}.fulfillment_status == RESERVED"

  # =================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispute_regrade_cascade_depth3
        grounds:
          - state_machines.GradingDispute.UNDER_REVIEW_to_RESOLVED_REGRADE
          - calculations.item_list_price
          - calculations.order_total
          - entities.InventoryItem.fields.condition_grade
          - entities.OrderLine.fields.unit_price_cents
          - entities.Order.fields.total_cents
        distinguishing_aspect: |
          Depth-3 cascade from a dispute regrade trigger: resolve-regrade sets InventoryItem.condition_grade
          (hop1) which recomputes InventoryItem.list_price_cents (hop2) which resyncs the OrderLine
          unit_price on the PENDING/RESERVED order and recomputes Order totals (hop3). Each hop is caused
          by the previous, not the original action. VG(1200)->G(800) drops line and order total.
        test_recipe:
          setup:
            - "A used VG copy of a base-2000 product listed at 1200, added to an ONLINE order (RESERVED, unpaid, subtotal 1200 total 1799), with an OPEN dispute moved to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "casc@x.com", full_name: "Cascade Buyer" }
              as: Anonymous
              captures: { cb_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "The Beatles", title: "Abbey Road", format: "VINYL", base_price_cents: 2000 }
              as: Manager
              captures: { ab_id: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${ab_id}", is_used: true, condition_grade: "VG" }
              as: StoreClerk
              captures: { av_id: "$.data.id" }
            - call: "POST /shop/orders"
              payload: { customer_id: "${cb_id}", channel: "ONLINE" }
              as: Customer
              as_user_id: "${cb_id}"
              captures: { co_id: "$.data.id" }
            - call: "POST /shop/orders/${co_id}/lines"
              payload: { inventory_item_id: "${av_id}" }
              as: Customer
              as_user_id: "${cb_id}"
              captures: { col_id: "$.data.id" }
            - call: "POST /shop/grading-disputes"
              payload: { inventory_item_id: "${av_id}", customer_id: "${cb_id}", claimed_grade: "G" }
              as: Customer
              as_user_id: "${cb_id}"
              captures: { cgd_id: "$.data.id" }
            - call: "POST /shop/grading-disputes/${cgd_id}/start-review"
              payload: {}
              as: Grader
          trigger:
            - call: "POST /shop/grading-disputes/${cgd_id}/resolve-regrade"
              payload: { resolution_grade: "G" }
              as: Grader
          assert:
            - "InventoryItem.${av_id}.condition_grade == G"
            - "InventoryItem.${av_id}.list_price_cents == 800"
            - "OrderLine.${col_id}.unit_price_cents == 800"
            - "Order.${co_id}.subtotal_cents == 800"
            - "Order.${co_id}.total_cents == 1399"

      - name: preorder_cancel_release_promote_depth2
        grounds:
          - state_machines.PreOrder.RESERVED_to_CANCELLED
          - state_machines.PreOrder.WAITLISTED_to_RESERVED
          - entities.Allocation.fields.available_count
          - entities.Allocation.fields.reserved_count
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (PreOrder cancel): cancelling the RESERVED pre-order
          releases its unit (hop1: available_count += 1) which promotes the earliest WAITLISTED pre-order
          to RESERVED (hop2: that pre-order flips status and reserved_count nets back). Distinct from the
          dispute-regrade chain's trigger and propagation pattern.
        test_recipe:
          setup:
            - "An allocation_total=1 pool with pre-order window open; one RESERVED pre-order holding the unit and one WAITLISTED pre-order behind it (created later)."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "first@x.com", full_name: "First" }
              as: Anonymous
              captures: { f_id: "$.data.id" }
            - call: "POST /shop/customers"
              payload: { email: "second@x.com", full_name: "Second" }
              as: Anonymous
              captures: { g_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "RSD Artist", title: "Exclusive LP", format: "VINYL", base_price_cents: 4000, is_rsd_exclusive: true }
              as: Manager
              captures: { rsd_id: "$.data.id" }
            - call: "POST /shop/products/${rsd_id}/allocations"
              payload: { allocation_total: 1, window_open_at: "2026-03-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z" }
              as: Manager
              captures: { alloc_id: "$.data.id", alloc_v0: "$.data.version" }
            - call: "POST /shop/pre-orders"
              payload: { customer_id: "${f_id}", product_id: "${rsd_id}", allocation_id: "${alloc_id}", pickup_window_start: "2026-04-01T09:00:00Z", pickup_window_end: "2026-04-01T17:00:00Z", expected_allocation_version: "${alloc_v0}" }
              as: Customer
              as_user_id: "${f_id}"
              captures: { po_first_id: "$.data.id" }
            - call: "GET /shop/allocations/${alloc_id}"
              payload: {}
              as: Manager
              captures: { alloc_v1: "$.data.version" }
            - call: "POST /shop/pre-orders"
              payload: { customer_id: "${g_id}", product_id: "${rsd_id}", allocation_id: "${alloc_id}", pickup_window_start: "2026-04-02T09:00:00Z", pickup_window_end: "2026-04-02T17:00:00Z", expected_allocation_version: "${alloc_v1}" }
              as: Customer
              as_user_id: "${g_id}"
              captures: { po_second_id: "$.data.id" }
          trigger:
            - call: "POST /shop/pre-orders/${po_first_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${f_id}"
          assert:
            - "PreOrder.${po_first_id}.status == CANCELLED"
            - "PreOrder.${po_second_id}.status == RESERVED"
            - "Allocation.${alloc_id}.available_count == 0"
            - "Allocation.${alloc_id}.reserved_count == 1"

  # =================================================================
  # Rule 5 — validation priority conflicts across different error-category pairs
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_capture
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - state_machines.Order.AUTHORIZED_to_PAID
        distinguishing_aspect: |
          Error-category pair state (priority 5) vs business_fiscal (priority 12): capturing payment on an
          UNPAID order that also over-applies store credit fails the state check first, so ERR_INVALID_STATE
          wins over ERR_INSUFFICIENT_CREDIT.
        test_recipe:
          setup:
            - "An ONLINE order with one NM line (total 3599) still UNPAID (never authorized), buyer has 0 store credit."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "pc1@x.com", full_name: "PConflict1" }
              as: Anonymous
              captures: { p1_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "Queen", title: "A Night at the Opera", format: "VINYL", base_price_cents: 3000 }
              as: Manager
              captures: { q_id: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${q_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
              captures: { qi_id: "$.data.id" }
            - call: "POST /shop/orders"
              payload: { customer_id: "${p1_id}", channel: "ONLINE" }
              as: Customer
              as_user_id: "${p1_id}"
              captures: { pco_id: "$.data.id" }
            - call: "POST /shop/orders/${pco_id}/lines"
              payload: { inventory_item_id: "${qi_id}" }
              as: Customer
              as_user_id: "${p1_id}"
          trigger:
            - call: "POST /shop/orders/${pco_id}/capture-payment"
              payload: { credit_applied_cents: 999999 }
              as: StoreClerk
              captures: { err: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: existence_beats_temporal_on_preorder
        grounds:
          - validations[priority=3]
          - validations[priority=7]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_PREORDER_WINDOW_CLOSED]
        distinguishing_aspect: |
          Error-category pair existence (priority 3) vs business_temporal (priority 7): a pre-order create
          naming a non-existent allocation AND sent after the window closes fails existence first, so
          ERR_NOT_FOUND wins over ERR_PREORDER_WINDOW_CLOSED.
        test_recipe:
          setup:
            - "An RSD product with an allocation whose window has closed; the logical clock advanced past window_close_at."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "pc2@x.com", full_name: "PConflict2" }
              as: Anonymous
              captures: { p2_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "RSD2", title: "Closed Window LP", format: "VINYL", base_price_cents: 4000, is_rsd_exclusive: true }
              as: Manager
              captures: { rsd2_id: "$.data.id" }
            - call: "POST /shop/products/${rsd2_id}/allocations"
              payload: { allocation_total: 5, window_open_at: "2026-03-01T00:00:00Z", window_close_at: "2026-03-10T00:00:00Z" }
              as: Manager
              captures: { alloc2_id: "$.data.id", alloc2_v0: "$.data.version" }
            - call: "POST /shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /shop/pre-orders"
              payload: { customer_id: "${p2_id}", product_id: "${rsd2_id}", allocation_id: "00000000-0000-4000-8000-000000000000", pickup_window_start: "2026-04-01T09:00:00Z", pickup_window_end: "2026-04-01T17:00:00Z", expected_allocation_version: "${alloc2_v0}" }
              as: Customer
              as_user_id: "${p2_id}"
              captures: { err2: "$.data.error_id" }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

  # =================================================================
  # Rule 6 — boundary-precision checks on different metrics/endpoints
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: loyalty_tier_gold_inclusive_boundary
        grounds:
          - calculations.loyalty_tier
          - entities.Customer.fields.loyalty_points
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: |
          Numeric >= boundary on the loyalty_points metric via /shop/_loyalty/adjust-points: exactly 500
          points crosses to GOLD (GOLD_MIN inclusive), whereas 499 stays SILVER. This is the threshold-crossing
          metric, distinct from the empty-collection boundary below and reached through a different endpoint.
        test_recipe:
          setup:
            - "A fresh customer whose loyalty_points is set to exactly 500 via the test-driving points endpoint."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "gold@x.com", full_name: "Gold Edge" }
              as: Anonymous
              captures: { ge_id: "$.data.id" }
          trigger:
            - call: "POST /shop/_loyalty/adjust-points"
              payload: { customer_id: "${ge_id}", delta_points: 500 }
              as: Manager
          assert:
            - "Customer.${ge_id}.loyalty_points == 500"
            - "Customer.${ge_id}.loyalty_tier == GOLD"

      - name: allocation_exhaustion_zero_available_boundary
        grounds:
          - state_machines.PreOrder.WAITLISTED_to_RESERVED
          - entities.Allocation.fields.available_count
          - validations[priority=11]
          - concurrency_rules[preorder-create-stale-allocation]
        distinguishing_aspect: |
          Zero-count boundary on the Allocation.available_count metric via POST /shop/pre-orders (a
          different endpoint from the loyalty boundary): when available_count hits exactly 0 while the
          window is still open, the next pre-order is WAITLISTED (not rejected), pinning the >0-vs-0 edge.
        test_recipe:
          setup:
            - "An allocation_total=1 pool, window open; one pre-order already RESERVED so available_count == 0."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "b1@x.com", full_name: "Boundary One" }
              as: Anonymous
              captures: { b1_id: "$.data.id" }
            - call: "POST /shop/customers"
              payload: { email: "b2@x.com", full_name: "Boundary Two" }
              as: Anonymous
              captures: { b2_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "RSD3", title: "One Copy LP", format: "VINYL", base_price_cents: 4000, is_rsd_exclusive: true }
              as: Manager
              captures: { rsd3_id: "$.data.id" }
            - call: "POST /shop/products/${rsd3_id}/allocations"
              payload: { allocation_total: 1, window_open_at: "2026-03-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z" }
              as: Manager
              captures: { alloc3_id: "$.data.id", alloc3_v0: "$.data.version" }
            - call: "POST /shop/pre-orders"
              payload: { customer_id: "${b1_id}", product_id: "${rsd3_id}", allocation_id: "${alloc3_id}", pickup_window_start: "2026-04-01T09:00:00Z", pickup_window_end: "2026-04-01T17:00:00Z", expected_allocation_version: "${alloc3_v0}" }
              as: Customer
              as_user_id: "${b1_id}"
            - call: "GET /shop/allocations/${alloc3_id}"
              payload: {}
              as: Manager
              captures: { alloc3_v1: "$.data.version" }
          trigger:
            - call: "POST /shop/pre-orders"
              payload: { customer_id: "${b2_id}", product_id: "${rsd3_id}", allocation_id: "${alloc3_id}", pickup_window_start: "2026-04-02T09:00:00Z", pickup_window_end: "2026-04-02T17:00:00Z", expected_allocation_version: "${alloc3_v1}" }
              as: Customer
              as_user_id: "${b2_id}"
              captures: { po_wl_id: "$.data.id" }
          assert:
            - "PreOrder.${po_wl_id}.status == WAITLISTED"
            - "Allocation.${alloc3_id}.available_count == 0"
            - "Allocation.${alloc3_id}.reserved_count == 1"

  # =================================================================
  # Rule 7 — cross-entity state dependencies across different entity pairs
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_ship_requires_payment_paid
        grounds:
          - state_machines.Order.RESERVED_to_SHIPPED
          - validations[priority=6]
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Cross-dimension dependency within the Order entity's two parallel axes (payment vs fulfillment):
          the fulfillment RESERVED->SHIPPED transition is guarded by payment_status == PAID, so shipping an
          AUTHORIZED-but-not-captured order is rejected with ERR_DEPENDENCY_NOT_READY.
        test_recipe:
          setup:
            - "An ONLINE order, one NM line, payment AUTHORIZED (not captured), fulfillment RESERVED."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "ship1@x.com", full_name: "Ship One" }
              as: Anonymous
              captures: { sh_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "Bowie", title: "Low", format: "VINYL", base_price_cents: 3000 }
              as: Manager
              captures: { bw_id: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${bw_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
              captures: { bi_id: "$.data.id" }
            - call: "POST /shop/orders"
              payload: { customer_id: "${sh_id}", channel: "ONLINE" }
              as: Customer
              as_user_id: "${sh_id}"
              captures: { sho_id: "$.data.id" }
            - call: "POST /shop/orders/${sho_id}/lines"
              payload: { inventory_item_id: "${bi_id}" }
              as: Customer
              as_user_id: "${sh_id}"
            - call: "POST /shop/orders/${sho_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${sh_id}"
          trigger:
            - call: "POST /shop/orders/${sho_id}/ship"
              payload: {}
              as: StoreClerk
              captures: { sherr: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DEPENDENCY_NOT_READY"
            - "Order.${sho_id}.fulfillment_status == RESERVED"

      - name: product_open_preorders_requires_allocation_window
        grounds:
          - state_machines.Product.LISTED_to_PRE_ORDER_OPEN
          - entities.Product.fields.catalog_status
          - entities.Allocation.fields.window_close_at
        distinguishing_aspect: |
          Different entity pair (Product depends on Allocation): the Product LISTED->PRE_ORDER_OPEN transition
          requires an Allocation to exist AND current_utc < allocation.window_close_at; with the clock past
          window_close_at the transition is rejected with ERR_INVALID_STATE. Distinct from the Order payment
          x fulfillment pair above.
        test_recipe:
          setup:
            - "A LISTED RSD product with an allocation whose window has already closed (clock advanced past window_close_at)."
          setup_api_calls:
            - call: "POST /shop/products"
              payload: { artist: "RSD4", title: "Past Window LP", format: "VINYL", base_price_cents: 4000, is_rsd_exclusive: true }
              as: Manager
              captures: { rsd4_id: "$.data.id" }
            - call: "POST /shop/products/${rsd4_id}/allocations"
              payload: { allocation_total: 3, window_open_at: "2026-03-01T00:00:00Z", window_close_at: "2026-03-05T00:00:00Z" }
              as: Manager
            - call: "POST /shop/products/${rsd4_id}/list"
              payload: {}
              as: Manager
            - call: "POST /shop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: Manager
          trigger:
            - call: "POST /shop/products/${rsd4_id}/open-preorders"
              payload: {}
              as: Manager
              captures: { operr: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Product.${rsd4_id}.catalog_status == LISTED"

  # =================================================================
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: display_slot_buffered_closed_interval_overlap
        grounds:
          - state_machines.Consignment.DRAFT_to_ACTIVE
          - validations[priority=8.5]
          - entities.Consignment.fields.display_start
          - entities.Consignment.fields.display_end
          - entities.DisplaySlot.fields.slot_label
        distinguishing_aspect: |
          DisplaySlot overlap uses BUFFERED CLOSED-interval semantics: an existing ACTIVE booking
          [Mar1,Mar10] expands by CONSIGNMENT_BUFFER_DAYS=2 to [Feb27,Mar12], so a second booking starting
          Mar11 collides (Mar11 <= Mar12) and is rejected with ERR_SLOT_OVERLAP — geometrically distinct
          from the allocation pickup half-open capacity rule.
        test_recipe:
          setup:
            - "A DisplaySlot with one ACTIVE consignment booked [2026-03-01,2026-03-10]; a second DRAFT consignment on the same slot booked [2026-03-11,2026-03-20]."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "cg1@x.com", full_name: "Consignor A" }
              as: Anonymous
              captures: { cga_id: "$.data.id" }
            - call: "POST /shop/customers"
              payload: { email: "cg2@x.com", full_name: "Consignor B" }
              as: Anonymous
              captures: { cgb_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "Slot Artist", title: "Slot LP", format: "VINYL", base_price_cents: 2000 }
              as: Manager
              captures: { slp_id: "$.data.id" }
            - call: "POST /shop/display-slots"
              payload: { slot_label: "Front Window A" }
              as: Manager
              captures: { slot_id: "$.data.id" }
            - call: "POST /shop/consignments"
              payload: { consignor_id: "${cga_id}", list_price_cents: 5000, product_id: "${slp_id}", condition_grade: "VG", display_slot_id: "${slot_id}", display_start: "2026-03-01T00:00:00Z", display_end: "2026-03-10T00:00:00Z" }
              as: Manager
              captures: { consa_id: "$.data.id" }
            - call: "POST /shop/consignments/${consa_id}/activate"
              payload: {}
              as: Manager
            - call: "POST /shop/consignments"
              payload: { consignor_id: "${cgb_id}", list_price_cents: 5000, product_id: "${slp_id}", condition_grade: "VG", display_slot_id: "${slot_id}", display_start: "2026-03-11T00:00:00Z", display_end: "2026-03-20T00:00:00Z" }
              as: Manager
              captures: { consb_id: "$.data.id" }
          trigger:
            - call: "POST /shop/consignments/${consb_id}/activate"
              payload: {}
              as: Manager
              captures: { slotoverr: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_SLOT_OVERLAP"
            - "Consignment.${consb_id}.status == DRAFT"

      - name: allocation_pickup_halfopen_capacity_overlap
        grounds:
          - state_machines.PreOrder.RESERVED_to_READY_FOR_PICKUP
          - validations[priority=7.5]
          - entities.Allocation.fields.pickup_concurrency
          - entities.PreOrder.fields.pickup_window_start
          - entities.PreOrder.fields.pickup_window_end
        distinguishing_aspect: |
          Allocation pickup overlap uses HALF-OPEN aggregate-CAPACITY semantics with pickup_concurrency=1:
          a first READY_FOR_PICKUP pre-order holds [09:00,12:00); a second pre-order requesting [11:00,14:00)
          overlaps and, capacity being 1, is rejected with ERR_PICKUP_CAPACITY_EXCEEDED. Adjacent windows
          (gap touching at the exclusive end) would NOT collide — a different interval treatment from the
          buffered-closed DisplaySlot rule, on a different resource entity.
        test_recipe:
          setup:
            - "An allocation_total=2, pickup_concurrency=1 pool with two RESERVED pre-orders; the first already READY_FOR_PICKUP holding [2026-04-01T09:00,12:00), the second still RESERVED requesting [2026-04-01T11:00,14:00). Two AVAILABLE copies of the product exist."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "pk1@x.com", full_name: "Pickup One" }
              as: Anonymous
              captures: { pk1_id: "$.data.id" }
            - call: "POST /shop/customers"
              payload: { email: "pk2@x.com", full_name: "Pickup Two" }
              as: Anonymous
              captures: { pk2_id: "$.data.id" }
            - call: "POST /shop/products"
              payload: { artist: "RSD5", title: "Pickup LP", format: "VINYL", base_price_cents: 4000, is_rsd_exclusive: true }
              as: Manager
              captures: { rsd5_id: "$.data.id" }
            - call: "POST /shop/products/${rsd5_id}/allocations"
              payload: { allocation_total: 2, window_open_at: "2026-03-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", pickup_concurrency: 1 }
              as: Manager
              captures: { alloc5_id: "$.data.id", alloc5_v0: "$.data.version" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${rsd5_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${rsd5_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
            - call: "POST /shop/pre-orders"
              payload: { customer_id: "${pk1_id}", product_id: "${rsd5_id}", allocation_id: "${alloc5_id}", pickup_window_start: "2026-04-01T09:00:00Z", pickup_window_end: "2026-04-01T12:00:00Z", expected_allocation_version: "${alloc5_v0}" }
              as: Customer
              as_user_id: "${pk1_id}"
              captures: { pk_po1_id: "$.data.id" }
            - call: "GET /shop/allocations/${alloc5_id}"
              payload: {}
              as: Manager
              captures: { alloc5_v1: "$.data.version" }
            - call: "POST /shop/pre-orders"
              payload: { customer_id: "${pk2_id}", product_id: "${rsd5_id}", allocation_id: "${alloc5_id}", pickup_window_start: "2026-04-01T11:00:00Z", pickup_window_end: "2026-04-01T14:00:00Z", expected_allocation_version: "${alloc5_v1}" }
              as: Customer
              as_user_id: "${pk2_id}"
              captures: { pk_po2_id: "$.data.id" }
            - call: "POST /shop/pre-orders/${pk_po1_id}/ready"
              payload: {}
              as: StoreClerk
          trigger:
            - call: "POST /shop/pre-orders/${pk_po2_id}/ready"
              payload: {}
              as: StoreClerk
              captures: { pkerr: "$.data.error_id" }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PICKUP_CAPACITY_EXCEEDED"
            - "PreOrder.${pk_po2_id}.status == RESERVED"

  # =================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: order_refund_conserves_store_credit
        grounds:
          - state_machines.Order.AUTHORIZED_to_PAID
          - state_machines.Order.PAID_to_REFUNDED
          - calculations.loyalty_points_earned
          - entities.Customer.fields.store_credit_cents
          - entities.Customer.fields.loyalty_points
        distinguishing_aspect: |
          Conserved quantity #1 = customer.store_credit_cents (a fiscal balance). Capture debits store credit
          by credit_applied_cents and awards points; the compensating cancel-refund credits back exactly
          credit_applied_cents and reverses the points. Invariant: store_credit_cents and loyalty_points return
          to their pre-capture values (500 credit, 0 points) — no drift.
        test_recipe:
          setup:
            - "A buyer with 500 store credit, an ONLINE order of one NM base-3000 copy (total 3599), payment AUTHORIZED; capture applies 500 credit and awards 35 points, then the order is cancelled (refunded) before shipping."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "refund@x.com", full_name: "Refund Buyer" }
              as: Anonymous
              captures: { rf_id: "$.data.id" }
            - call: "POST /shop/customers/${rf_id}/credit-adjustments"
              payload: { delta_cents: 500, reason: "seed credit" }
              as: Manager
            - call: "POST /shop/products"
              payload: { artist: "Fleetwood Mac", title: "Rumours", format: "VINYL", base_price_cents: 3000 }
              as: Manager
              captures: { fm_id: "$.data.id" }
            - call: "POST /shop/inventory-items"
              payload: { product_id: "${fm_id}", is_used: false, condition_grade: "NM" }
              as: StoreClerk
              captures: { fi_id: "$.data.id" }
            - call: "POST /shop/orders"
              payload: { customer_id: "${rf_id}", channel: "ONLINE" }
              as: Customer
              as_user_id: "${rf_id}"
              captures: { rfo_id: "$.data.id" }
            - call: "POST /shop/orders/${rfo_id}/lines"
              payload: { inventory_item_id: "${fi_id}" }
              as: Customer
              as_user_id: "${rf_id}"
            - call: "POST /shop/orders/${rfo_id}/authorize-payment"
              payload: {}
              as: Customer
              as_user_id: "${rf_id}"
            - call: "POST /shop/orders/${rfo_id}/capture-payment"
              payload: { credit_applied_cents: 500 }
              as: StoreClerk
          trigger:
            - call: "POST /shop/orders/${rfo_id}/cancel"
              payload: {}
              as: StoreClerk
          assert:
            - "Order.${rfo_id}.payment_status == REFUNDED"
            - "Customer.${rf_id}.store_credit_cents == 500"
            - "Customer.${rf_id}.loyalty_points == 0"

      - name: trade_in_reverse_conserves_allocation_of_credit_and_inventory
        grounds:
          - state_machines.TradeIn.UNDER_INSPECTION_to_APPROVED
          - state_machines.TradeIn.APPROVED_to_REVERSED
          - calculations.trade_in_credit_valuation
          - entities.Customer.fields.store_credit_cents
          - entities.InventoryItem.fields.status
        distinguishing_aspect: |
          Conserved quantity #2 = count of live trade-in-created InventoryItems (an inventory count, a
          different kind of conserved quantity from a fiscal balance). Approve grants final credit and creates
          one used InventoryItem per line; the compensating reverse debits the exact same credit and voids the
          created items. Invariant: store_credit returns to 0 AND no live InventoryItem remains from this trade-in.
        test_recipe:
          setup:
            - "A CREDIT trade-in with one line (NM base 1000) submitted, inspected NM, approved (final 600 credited, one used item created), then reversed while that item is still AVAILABLE."
          setup_api_calls:
            - call: "POST /shop/customers"
              payload: { email: "rev@x.com", full_name: "Reverse Seller" }
              as: Anonymous
              captures: { rv_id: "$.data.id" }
            - call: "POST /shop/trade-ins"
              payload: { customer_id: "${rv_id}", payout_method: "CREDIT" }
              as: Customer
              as_user_id: "${rv_id}"
              captures: { rvti_id: "$.data.id" }
            - call: "POST /shop/trade-ins/${rvti_id}/lines"
              payload: { format: "CD", claimed_grade: "NM", base_value_cents: 1000 }
              as: Customer
              as_user_id: "${rv_id}"
              captures: { rvline_id: "$.data.id" }
            - call: "POST /shop/trade-ins/${rvti_id}/submit"
              payload: {}
              as: Customer
              as_user_id: "${rv_id}"
            - call: "POST /shop/trade-ins/${rvti_id}/start-inspection"
              payload: {}
              as: Grader
            - call: "PATCH /shop/trade-in-lines/${rvline_id}"
              payload: { inspected_grade: "NM" }
              as: Grader
            - call: "POST /shop/trade-ins/${rvti_id}/approve"
              payload: {}
              as: Grader
          trigger:
            - call: "POST /shop/trade-ins/${rvti_id}/reverse"
              payload: {}
              as: Manager
          assert:
            - "TradeIn.${rvti_id}.status == REVERSED"
            - "TradeIn.${rvti_id}.final_value_cents == 600"
            - "Customer.${rv_id}.store_credit_cents == 0"
