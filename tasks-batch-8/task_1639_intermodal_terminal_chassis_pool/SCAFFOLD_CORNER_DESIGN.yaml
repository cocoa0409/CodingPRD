  # ===========================================================================
  - section: errors
    instances:
      - name: error_terminal_closed_on_ground
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_TERMINAL_CLOSED]"
        distinguishing_aspect: "Ground attempt on CLOSED terminal returns ERR_TERMINAL_CLOSED."
        excluded_because:
          difficulty_instance: yard_slot_single_occupancy_aggregate_capacity
          rationale: "Posture=CLOSED vs ERR_NO_YARD_SLOT_AVAILABLE interplay is exercised in resource_temporal_overlap instance 2's assert; the underlying ERR_TERMINAL_CLOSED path is asserted there."

      - name: error_train_not_arrived
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_TRAIN_NOT_ARRIVED]"
        excluded_because:
          difficulty_instance: container_ground_depends_on_train_arrived
          rationale: "Asserted as the failure path of the named §1.8 cross_entity_state_dependency instance."

      - name: error_rail_cutoff_missed
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RAIL_CUTOFF_MISSED]"
        excluded_because:
          difficulty_instance: rail_cutoff_strict_less_than
          rationale: "Asserted as the failure path of the named §1.8 boundary_precision_check instance."

      - name: error_chassis_unroadable
