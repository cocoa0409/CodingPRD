            - "Placement.${placement_id}.declination_count is still 0 — the count is pinned only by complete-search"
            - "Placement.${placement_id}.status is still SEARCH_IN_PROGRESS"
            - "GET /placements/${placement_id}/declinations?status=RECORDED returns exactly 2 rows"
            - "GET /placements/${placement_id}/declinations returns 3 rows in total"
            - "replaying POST /declinations/${declination_1_id}/invalidate returns 409 with error_id ERR_INVALID_STATE"

  # ===========================================================================
  - section: errors
    instances:

      - name: unauthenticated_request_missing_x_user_headers_or_carrying_an_unknown_role
        claim_type: Error Triggerable
        grounds:
          - validations.priority_1_auth
          - validations.priority_2_auth
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Both authentication rungs answer 401 ERR_UNAUTHENTICATED and both run before role authorisation: a request with no X-User-Role / X-User-ID headers at all, and a request whose X-User-Role is a string outside the five declared roles, are indistinguishable to the caller — neither leaks 403."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. One brokerage on file."
          setup_api_calls:
            - *k_clock
            - *k_broker
          trigger:
            - call: "POST /placements"
              payload: { insured_name: "Headerless Risk LLC", principal_place_of_business_state: "TX", coverage_class: "PROPERTY", is_export_list_risk: false, state_exposures: [{ state_code: "TX", insured_value_cents: 100000000 }] }
              as: "(no X-User-Role and no X-User-ID header)"
              captures: { error_id_missing: $.data.error_id }
            - call: "POST /placements"
              payload: { insured_name: "Bogus Role Risk LLC", principal_place_of_business_state: "TX", coverage_class: "PROPERTY", is_export_list_risk: false, state_exposures: [{ state_code: "TX", insured_value_cents: 100000000 }] }
              as: "SurplusLinesWizard"
              as_user_id: "${broker_id}"
              captures: { error_id_unknown_role: $.data.error_id }
          assert:
            - "the header-less request returns 401 with error_id_missing == ERR_UNAUTHENTICATED"
            - "the unknown-role request returns 401 with error_id_unknown_role == ERR_UNAUTHENTICATED, not 403"
            - "GET /placements returns 0 rows"

      - name: every_get_by_id_endpoint_reports_its_own_not_found_error
        claim_type: Error Triggerable
        grounds:
          - validations.priority_4_existence
          - errors.ERR_BROKER_NOT_FOUND
          - errors.ERR_STATE_PROGRAM_NOT_FOUND
          - errors.ERR_CARRIER_ELIGIBILITY_NOT_FOUND
          - errors.ERR_PLACEMENT_NOT_FOUND
          - errors.ERR_POLICY_NOT_FOUND
          - errors.ERR_ENDORSEMENT_NOT_FOUND
          - errors.ERR_TAX_FILING_LINE_NOT_FOUND
          - errors.ERR_FILING_BATCH_NOT_FOUND
        distinguishing_aspect: "Each of the nine GET-by-id endpoints answers with its OWN entity-specific 404 id rather than a shared generic code, so the caller can tell which reference was bad."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Empty database — no entity of any type has been created."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /brokers/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: Any
              as_user_id: "tf-nina"
              captures: { e_broker: $.data.error_id }
            - call: "GET /state-programs/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: Any
              as_user_id: "tf-nina"
              captures: { e_program: $.data.error_id }
            - call: "GET /carrier-eligibilities/00000000-0000-4000-8000-000000000012"
              payload: {}
              as: Any
              as_user_id: "tf-nina"
              captures: { e_elig: $.data.error_id }
            - call: "GET /placements/00000000-0000-4000-8000-000000000013"
              payload: {}
              as: Any
              as_user_id: "tf-nina"
              captures: { e_placement: $.data.error_id }
            - call: "GET /policies/00000000-0000-4000-8000-000000000014"
              payload: {}
              as: Any
              as_user_id: "tf-nina"
              captures: { e_policy: $.data.error_id }
            - call: "GET /endorsements/00000000-0000-4000-8000-000000000015"
              payload: {}
              as: Any
              as_user_id: "tf-nina"
              captures: { e_endorsement: $.data.error_id }
            - call: "GET /tax-filing-lines/00000000-0000-4000-8000-000000000016"
              payload: {}
              as: Any
              as_user_id: "tf-nina"
              captures: { e_line: $.data.error_id }
            - call: "GET /filing-batches/00000000-0000-4000-8000-000000000017"
              payload: {}
              as: Any
              as_user_id: "tf-nina"
              captures: { e_batch: $.data.error_id }
          assert:
            - "every request returns 404 with response_type error"
            - "e_broker == ERR_BROKER_NOT_FOUND and e_program == ERR_STATE_PROGRAM_NOT_FOUND"
            - "e_elig == ERR_CARRIER_ELIGIBILITY_NOT_FOUND and e_placement == ERR_PLACEMENT_NOT_FOUND"
            - "e_policy == ERR_POLICY_NOT_FOUND and e_endorsement == ERR_ENDORSEMENT_NOT_FOUND"
            - "e_line == ERR_TAX_FILING_LINE_NOT_FOUND and e_batch == ERR_FILING_BATCH_NOT_FOUND"

      - name: action_endpoints_on_entities_without_a_get_by_id_still_report_not_found
        claim_type: Error Triggerable
        grounds:
          - validations.priority_4_existence
          - errors.ERR_MARKET_SECURITY_REVIEW_NOT_FOUND
          - errors.ERR_DECLINATION_NOT_FOUND
          - errors.ERR_CANCELLATION_NOT_FOUND
          - errors.ERR_AFFIDAVIT_NOT_FOUND
        distinguishing_aspect: "MarketSecurityReview, Declination, Cancellation and Affidavit are read through parent-scoped list endpoints, so their 404s surface on the action endpoints that take their id in the path — and existence (priority 4) is decided before the state check, so an unknown id never returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /market-security-reviews/00000000-0000-4000-8000-000000000020/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { e_review: $.data.error_id }
            - call: "POST /declinations/00000000-0000-4000-8000-000000000021/invalidate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { e_declination: $.data.error_id }
            - call: "POST /cancellations/00000000-0000-4000-8000-000000000022/process"
              payload: {}
              as: PlacementBroker
              as_user_id: "00000000-0000-4000-8000-0000000000ff"
              captures: { e_cancellation: $.data.error_id }
            - call: "POST /affidavits/00000000-0000-4000-8000-000000000023/sign"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { e_affidavit: $.data.error_id }
          assert:
            - "every request returns 404"
            - "e_review == ERR_MARKET_SECURITY_REVIEW_NOT_FOUND"
            - "e_declination == ERR_DECLINATION_NOT_FOUND"
            - "e_cancellation == ERR_CANCELLATION_NOT_FOUND"
            - "e_affidavit == ERR_AFFIDAVIT_NOT_FOUND"
            - "none of the four returns ERR_INVALID_STATE"

      - name: duplicate_state_program_and_duplicate_carrier_registrations_are_refused
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_STATE_PROGRAM_DUPLICATE
          - errors.ERR_CARRIER_DUPLICATE
          - entities.StateProgram.fields.state_code
          - entities.Carrier.fields.naic_number
        distinguishing_aspect: "state_code is unique across StateProgram and naic_number is unique across Carrier; both duplicates answer 409 with their own error id, and the second attempt leaves the first row untouched rather than updating it."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the TX program and Atlas (NAIC 12345) already registered."
          setup_api_calls:
            - *k_clock
            - *k_prog_tx
            - *k_carrier
          trigger:
            - call: "POST /state-programs"
              payload: { state_code: "TX", premium_tax_rate: 0.0100, stamping_fee_rate: 0.0000, stamping_fee_cap_cents: null, stamping_office_required: false, allocation_method: "HOME_STATE_SINGLE", diligent_search_min_declinations: 1, export_list_exempts_search: false, filing_frequency: "QUARTERLY", filing_deadline_days: 60, return_premium_tax_refundable: false, return_premium_stamping_refundable: false, min_carrier_capital_surplus_cents: 0, required_notice_codes: [] }
              as: PlatformAdmin
              captures: { e_program: $.data.error_id }
            - call: "POST /carriers"
              payload: { naic_number: "12345", legal_name: "Impostor Specialty Company", domicile_type: "ALIEN", capital_surplus_cents: 100, am_best_rating: "NR", trust_fund_cents: 0, naic_quarterly_listing: false }
              as: PlatformAdmin
              captures: { e_carrier: $.data.error_id }
          assert:
            - "the program attempt returns 409 with e_program == ERR_STATE_PROGRAM_DUPLICATE"
            - "the carrier attempt returns 409 with e_carrier == ERR_CARRIER_DUPLICATE"
            - "StateProgram.${tx_program_id}.premium_tax_rate is still 0.0485 and allocation_method is still ALLOCATED_MULTI"
            - "Carrier.${carrier_id}.legal_name is still \"Atlas Specialty Insurance Company\" and domicile_type is still US_STATE"

      - name: opening_a_second_security_review_while_one_is_under_review_is_refused
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_REVIEW_ALREADY_OPEN
          - endpoints.POST_/carriers/{id}/security-reviews
        distinguishing_aspect: "At most one non-terminal MarketSecurityReview may exist per carrier: with one review already open, POST /carriers/{id}/security-reviews returns 409 ERR_REVIEW_ALREADY_OPEN. After the open review is decided, a further review is accepted."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Atlas registered with one MarketSecurityReview already created and started."
          setup_api_calls:
            - *k_clock
            - *k_carrier
            - *k_review_new
            - *k_review_start
          trigger:
            - call: "POST /carriers/${carrier_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_REVIEW_ALREADY_OPEN"
            - "GET /carriers/${carrier_id}/security-reviews returns exactly 1 row"
            - "after POST /market-security-reviews/${review_id}/decide with APPROVE, a second POST /carriers/${carrier_id}/security-reviews returns 201"
            - "GET /carriers/${carrier_id}/security-reviews then returns exactly 2 rows"

      - name: a_conditional_decision_without_a_conditions_note_is_refused
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_CONDITIONS_NOTE_REQUIRED
          - calculations.market_security_score
        distinguishing_aspect: "An unrated carrier with tier-1 capital and a NAIC listing scores 0 + 40 + 15 + 5 = 60, squarely in the CONDITION band, so CONDITION is the only decision the score supports — but it is still refused 422 ERR_CONDITIONS_NOTE_REQUIRED until a non-empty conditions_note accompanies it."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; a carrier with am_best_rating NR, capital_surplus_cents 5000000000, domicile_type US_STATE, trust_fund_cents 0 and naic_quarterly_listing true, with a started review."
          setup_api_calls:
            - *k_clock
            - call: "POST /carriers"
              payload: { naic_number: "44444", legal_name: "Borderline Mutual Specialty", domicile_type: "US_STATE", capital_surplus_cents: 5000000000, am_best_rating: "NR", trust_fund_cents: 0, naic_quarterly_listing: true }
              as: PlatformAdmin
              captures: { borderline_id: $.data.id, borderline_v0: $.data.version }
            - call: "POST /carriers/${borderline_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { borderline_review_id: $.data.id }
            - call: "POST /market-security-reviews/${borderline_review_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
          trigger:
            - call: "POST /market-security-reviews/${borderline_review_id}/decide"
              payload: { decision: "CONDITION", expected_carrier_version: "${borderline_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { error_id: $.data.error_id }
          assert:
            - "MarketSecurityReview.${borderline_review_id}.score == 60"
            - "the response status is 422 and error_id == ERR_CONDITIONS_NOTE_REQUIRED"
            - "MarketSecurityReview.${borderline_review_id}.status is still UNDER_REVIEW"
            - "Carrier.${borderline_id}.security_status is unchanged and version is still ${borderline_v0}"
            - "retrying with conditions_note \"Quarterly financial statements required\" returns 200 and Carrier.${borderline_id}.security_status == CONDITIONAL"

      - name: affixing_an_incomplete_notice_set_is_refused
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_NOTICES_INCOMPLETE
          - state_machines.Policy.compliance_status
        distinguishing_aspect: "TX requires both TX-SL-1 and TX-SL-2; supplying only TX-SL-1 is 422 ERR_NOTICES_INCOMPLETE and leaves notice_codes_affixed empty. Supplying a superset that also contains an unrelated code is accepted, because the rule is containment, not equality."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home ISSUED policy with compliance_status PENDING_NOTICES."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_carrier
            - *k_review_new
            - *k_review_start
            - *k_review_approve
            - *k_elig_tx
            - *k_placement
            - *k_begin_search
            - *k_decl_1
            - *k_decl_2
            - *k_decl_3
            - *k_complete_search
            - *k_policy
          trigger:
            - call: "POST /policies/${policy_id}/affix-notices"
              payload: { notice_codes: ["TX-SL-1"] }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_NOTICES_INCOMPLETE"
            - "Policy.${policy_id}.compliance_status is still PENDING_NOTICES"
            - "Policy.${policy_id}.notice_codes_affixed == []"
            - "retrying with notice_codes [\"TX-SL-2\", \"TX-SL-1\", \"TX-SL-1\"] returns 200 and notice_codes_affixed == [\"TX-SL-1\", \"TX-SL-2\"] — de-duplicated and sorted"

      - name: an_affidavit_attesting_the_wrong_declination_count_is_refused
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_AFFIDAVIT_COUNT_MISMATCH
          - state_machines.Affidavit.transitions
        distinguishing_aspect: "declination_count_attested is checked against the placement's PINNED declination_count at signing time, not at creation time: the DRAFT affidavit is accepted with the wrong figure 2 and only the sign call fails 422 ERR_AFFIDAVIT_COUNT_MISMATCH."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home ISSUED policy whose placement pinned declination_count 3, with notices affixed and a DRAFT DILIGENT_SEARCH affidavit attesting 2."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_carrier
            - *k_review_new
            - *k_review_start
            - *k_review_approve
            - *k_elig_tx
            - *k_placement
            - *k_begin_search
            - *k_decl_1
            - *k_decl_2
            - *k_decl_3
            - *k_complete_search
            - *k_policy
            - *k_affix_notices
            - call: "POST /policies/${policy_id}/affidavits"
              payload: { affidavit_type: "DILIGENT_SEARCH", declination_count_attested: 2 }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { affidavit_id: $.data.id }
          trigger:
            - call: "POST /affidavits/${affidavit_id}/sign"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the DRAFT affidavit was created 201 despite the wrong count"
            - "the sign response status is 422 and error_id == ERR_AFFIDAVIT_COUNT_MISMATCH"
            - "Affidavit.${affidavit_id}.status is still DRAFT with signed_by_user_id and signed_at both null"
            - "Policy.${policy_id}.compliance_status is still NOTICES_AFFIXED, not COMPLIANT"
            - "Placement.${placement_id}.declination_count == 3"

      - name: an_endorsement_that_would_zero_the_premium_is_refused
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_PREMIUM_WOULD_BE_NON_POSITIVE
          - state_machines.Endorsement.transitions
        distinguishing_aspect: "The guard is strictly greater than zero and it fires at ISSUE, not at creation: a PREMIUM_DECREASE of exactly -1,000,000 on a 1,000,000-cent policy leaves gross_premium_cents at 0, which is refused 422 ERR_PREMIUM_WOULD_BE_NON_POSITIVE while the endorsement stays DRAFT."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the base TX-home policy with tax calculated (gross_premium_cents 1000000) and a DRAFT PREMIUM_DECREASE endorsement of -1000000."
          setup_api_calls:
            - *k_clock
            - *k_broker
            - *k_lic_tx
            - *k_prog_tx
            - *k_prog_nv
            - *k_prog_ca
            - *k_carrier
            - *k_review_new
            - *k_review_start
            - *k_review_approve
            - *k_elig_tx
            - *k_placement
            - *k_begin_search
            - *k_decl_1
            - *k_decl_2
            - *k_decl_3
            - *k_complete_search
            - *k_policy
            - *k_calc_tax
            - *k_get_policy_v
            - call: "POST /policies/${policy_id}/endorsements"
              payload: { endorsement_type: "PREMIUM_DECREASE", premium_delta_cents: -1000000, effective_date: "2026-09-01T00:00:00Z", supersedes_endorsement_id: null, expected_policy_version: "${policy_v}" }
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { doomed_endorsement_id: $.data.id }
          trigger:
            - call: "POST /endorsements/${doomed_endorsement_id}/issue"
              payload: {}
              as: PlacementBroker
              as_user_id: "${broker_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_PREMIUM_WOULD_BE_NON_POSITIVE"
            - "Endorsement.${doomed_endorsement_id}.status is still DRAFT with tax_adjustment_cents null"
            - "Policy.${policy_id}.gross_premium_cents is still 1000000 and total_tax_cents is still 38779"
            - "GET /tax-filing-lines?policy_id=${policy_id}&line_type=ENDORSEMENT returns 0 rows"

      - name: superseding_an_endorsement_that_was_never_issued_is_refused
        claim_type: Error Triggerable
        grounds:
          - errors.ERR_SUPERSEDE_TARGET_INVALID
          - entities.Endorsement.fields.supersedes_endorsement_id
        distinguishing_aspect: "A supersede target must itself be ISSUED. Pointing at a sibling endorsement that is still DRAFT passes the priority-5 foreign-key check (the row exists) and fails later at 422 ERR_SUPERSEDE_TARGET_INVALID, so the failure is a state judgement on the target, not a missing reference."
