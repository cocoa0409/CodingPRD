        claim_type: optimistic_concurrency
        grounds:
          - 'concurrency_rules[block-assign-supersede-stale-plan]'
          - 'errors[ERR_STALE_PLAN_VERSION]'
        distinguishing_aspect: "After one successful assignment bumps plan.version to 2, a second assignment still carrying expected_plan_version 1 (the pre-assignment value) -> 412 ERR_STALE_PLAN_VERSION."
        test_recipe:
          setup: ["plan P with District 1 and blocks A, B; version 1 observed before any assignment"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Jocc", state_code: "CA", target_district_count: 1 }
              as: Cartographer
              captures: { jid: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "A", population: 500, voting_age_population: 400, minority_vap: 100, registered_voters: 300 }
              as: Cartographer
              captures: { blkA: $.data.id }
            - call: "POST /jurisdictions/${jid}/census-blocks"
              payload: { geoid: "B", population: 500, voting_age_population: 400, minority_vap: 100, registered_voters: 300 }
              as: Cartographer
              captures: { blkB: $.data.id }
            - call: "POST /jurisdictions/${jid}/plans"
              payload: { name: "Pocc" }
              as: Cartographer
              as_user_id: "u_cart"
              captures: { pid: $.data.id, pv0: $.data.version }
            - call: "POST /plans/${pid}/districts"
