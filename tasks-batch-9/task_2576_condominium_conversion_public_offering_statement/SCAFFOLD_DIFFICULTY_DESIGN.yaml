      - name: presale_pct_inclusive_at_exact_threshold_equality
        grounds:
          - calculations.presale_threshold_evaluation
          - state_machines.ClosingBatch.OPEN_FOR_ASSIGNMENT_to_THRESHOLD_MET
          - state_machines.ClosingBatch.THRESHOLD_MET_to_THRESHOLD_SHORT
          - entities.ClosingBatch.fields.presale_pct
          - entities.ClosingBatch.fields.min_presale_threshold_pct
        distinguishing_aspect: |
          The metric under test is presale_pct against min_presale_threshold_pct, and the probe lands
          the computed value EXACTLY on the threshold (50.00 vs 50.00): the inclusive comparison must
          make the batch THRESHOLD_MET, while a one-hundredth-of-a-percent stricter threshold (50.01)
          must leave the identical agreement population THRESHOLD_SHORT. A `>` implementation and a
