            - "Reservation.${res_p1_id}.status == CONFIRMED"
            - "Membership.${ms_lena_id}.residual_released_cents == 0"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (>= 2 instances, different interval
  #          semantics, different resource entities)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_half_open_reservation_interval
        grounds:
          - validations[priority=23]
          - state_machines.Reservation.HELD_to_CONFIRMED
          - entities.Reservation.fields.start_at
          - entities.Reservation.fields.end_at
        distinguishing_aspect: "Vehicle reservation intervals use naive half-open arithmetic with no buffer: a window starting exactly at the prior reservation's end_at is accepted because the closed endpoint is excluded, while a window starting one minute earlier is rejected with ERR_VEHICLE_DOUBLE_BOOKED."
