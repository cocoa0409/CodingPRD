      - name: arrive_completes_escort_assignments_and_releases_minutes
        claim_type: side_effect_execution
        grounds:
          - state_machines.RouteLeg.IN_TRANSIT_to_ARRIVED
          - state_machines.EscortAssignment.RESERVED_to_COMPLETED
          - calculations.escort_reserved_minutes
          - state_machines.HomeSection.IN_TRANSIT_to_DELIVERED
        distinguishing_aspect: |
          One arrive call must fire four declared side effects together: the leg
          becomes ARRIVED, every RESERVED assignment on it becomes COMPLETED, the
          crew's reserved_minutes is recomputed from the surviving RESERVED rows
          (480 -> 0, status refreshed to AVAILABLE), and the permit's section moves
          IN_TRANSIT -> DELIVERED. COMPLETED - not RELEASED - is the consuming
          terminal state, so the assignment row keeps its frozen 480 minutes.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant, one ACTIVE Hauler, one EscortCrew (default 600-minute ceiling)"
            - "a single-section AZ order with the 168 in section released, its permit paid 16500 and ISSUED, one leg 06:00Z-14:00Z, and one 480-minute escort reservation on that leg"
            - "the leg has already departed, so it is IN_TRANSIT and the section is IN_TRANSIT"
