scenario: 'Automated Bowl Assembly Throughput & Ingredient Hopper Management (Sweetgreen): automated assembly line dispensing portioned ingredients
  into rotating bowls with per-ingredient calibration, hopper refill scheduling tied to depletion sensors and prep-room output, order routing
  between automated and manual lines by customization complexity, portion accuracy verification and calibration drift detection, ingredient substitution
  and eighty-six propagation to digital menus, cleaning and sanitation cycles that take the line out of service, labor redeployment from the make
  line to prep and hospitality roles, throughput measurement per hour and queue-time targets'
domain_name: bowl-assembly-ops
api_prefix: /api
complexity_profile:
  primary_archetype: Posture-driven gating
  secondary_archetype: Quota / allocation
  complexity_layers:
  - cascading_side_effects
  - derived_field_reconciliation
  - rate_threshold_triggers
  - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - self_referential
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\"\
    , \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Restaurant
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Restaurant display name
  - name: city
    type: string
    source: input
    description: City the restaurant operates in
- name: AssemblyLine
  parent: null
  common_fields: true
  fields:
  - name: restaurant_id
    type: string
    source: input
    description: FK -> Restaurant.id; owning restaurant
  - name: name
    type: string
    source: input
    description: Line display name (e.g. 'Auto Line 1')
  - name: line_type
    type: enum
    source: input
    description: AUTOMATED (robotic dispensing) or MANUAL (human make line)
    constraints: 'enum: {AUTOMATED, MANUAL}'
  - name: service_rate_seconds_per_bowl
    type: integer
    source: input
    description: Nominal seconds to assemble one bowl on this line
    default: 45
    constraints: must be > 0; AUTOMATED default 45, MANUAL default 120
  - name: status
    type: enum
    source: system
    description: Lifecycle state; see state_machines.AssemblyLine
    constraints: 'enum: {ACTIVE, PAUSED, CLEANING}'
  - name: posture
    type: enum
    source: computed
    description: 'Derived gate: FROZEN if status != ACTIVE; else RESTRICTED if any hopper on the line has status QUARANTINED or DEPLETED or REFILL_SCHEDULED
      or REFILLING, or sanitation is overdue (now > next_sanitation_due_at); else OPEN. Input ignored.'
    constraints: 'enum: {OPEN, RESTRICTED, FROZEN}'
  - name: last_sanitation_completed_at
    type: datetime
    source: system
    description: Timestamp of most recent COMPLETED SanitationCycle on this line; null if never
    default: null
  - name: next_sanitation_due_at
    type: datetime
    source: computed
    description: last_sanitation_completed_at + SANITATION_INTERVAL_HOURS (4); null until first completion
- name: Ingredient
  parent: null
  common_fields: true
  fields:
  - name: sku
    type: string
    source: input
    description: Globally unique stock-keeping code
    constraints: unique across all Ingredients
  - name: name
    type: string
    source: input
    description: Display name (e.g. 'Romaine')
  - name: station_type
    type: enum
    source: input
    description: Hopper station classification
    constraints: 'enum: {BASE, PROTEIN, TOPPING, DRESSING}'
  - name: shelf_life_minutes
    type: integer
    source: input
    description: Minutes a READY PrepBatch of this ingredient remains usable
    constraints: must be > 0
  - name: allergen_flag
    type: boolean
    source: input
    description: True if handling requires allergen protocol (affects routing complexity)
    default: false
  - name: status
    type: enum
    source: system
    description: ACTIVE normally; EIGHTY_SIXED after eighty-six until restore
    constraints: 'enum: {ACTIVE, EIGHTY_SIXED}'
- name: Recipe
  parent: null
  common_fields: true
  fields:
  - name: restaurant_id
    type: string
    source: input
    description: FK -> Restaurant.id; menu scoping
  - name: name
    type: string
    source: input
    description: Bowl name (e.g. 'Harvest Bowl')
  - name: base_complexity
    type: integer
    source: input
    description: Intrinsic routing-complexity score of the recipe before customizations
    default: 0
    constraints: integer >= 0
  - name: portion_spec
    type: array
    source: input
    description: Array of {ingredient_id, target_grams}; each entry names an ingredient and its nominal portion. Must contain at least 1 entry;
      ingredient_ids distinct.
  - name: is_available
    type: boolean
    source: computed
    description: True iff for every portion_spec entry, the ingredient is ACTIVE or covered by an ACTIVE SubstitutionRule (same restaurant, from_ingredient
      = entry ingredient, effective window contains now). Recomputed on every read and on any eighty-six / restore / substitution transition.
      Input ignored.
- name: Hopper
  parent: null
  common_fields: true
  fields:
  - name: line_id
    type: string
    source: input
    description: FK -> AssemblyLine.id; line this hopper is mounted on
  - name: ingredient_id
    type: string
    source: input
    description: FK -> Ingredient.id; ingredient currently loaded (immutable after creation)
  - name: capacity_grams
    type: number
    source: input
    description: Maximum grams the hopper holds
    constraints: must be > 0
  - name: station_slot
    type: integer
    source: input
    description: Physical slot index on the line
    constraints: unique per line_id
  - name: calibration_coefficient
    type: number
    source: input
    description: Dispense multiplier; actual dispense = round_half_up(target_grams * calibration_coefficient, 1)
    default: 1.0
    constraints: 0.5 <= value <= 2.0, 3 decimal places
  - name: status
    type: enum
    source: system
    description: See state_machines.Hopper
    constraints: 'enum: {LOADING, IN_SERVICE, DEPLETED, REFILL_SCHEDULED, REFILLING, QUARANTINED}'
  - name: current_grams
    type: number
    source: system
    description: Measured/derived grams currently in hopper; authoritative source is the latest sensor reading minus subsequent dispenses plus
      subsequent refills
    default: 0
  - name: initial_load_grams
    type: number
    source: system
    description: Grams set by the most recent load action
    default: 0
  - name: cumulative_dispensed_grams
    type: number
    source: system
    description: Running total of dispensed grams not later reclassified as waste
    default: 0
  - name: cumulative_refilled_grams
    type: number
    source: system
    description: Running total of grams added by completed RefillTasks
    default: 0
  - name: cumulative_waste_grams
    type: number
    source: system
    description: Running total of dispensed grams reclassified to waste on failed verification
    default: 0
  - name: drift_pct
    type: number
    source: computed
    description: Signed mean of variance_pct over the most recent DRIFT_WINDOW_SIZE (10) PortionVerifications for this hopper created after drift_window_anchor;
      null if fewer than DRIFT_MIN_SAMPLES (3) samples. 2 decimals, round_half_up. Input ignored.
  - name: drift_window_anchor
    type: datetime
    source: system
    description: Timestamp of the last calibration adjustment (or hopper creation); only verifications strictly after this count toward drift
- name: RefillTask
  parent: null
  common_fields: true
  fields:
  - name: hopper_id
    type: string
    source: input
    description: FK -> Hopper.id; hopper to refill
  - name: ingredient_id
    type: string
    source: system
    description: FK -> Ingredient.id; denormalized from hopper at creation
  - name: requested_grams
    type: number
    source: computed
    description: 'STANDARD mode: capacity_grams - current_grams at request time. FORECAST mode: min(capacity_grams - current_grams, committed
      queued demand for the ingredient on the line). Snapshot frozen at creation.'
  - name: allocated_grams
    type: number
    source: system
    description: Grams currently reserved from the linked PrepBatch
    default: 0
  - name: prep_batch_id
    type: string
    source: system
    description: FK -> PrepBatch.id; allocated batch, null while SCHEDULED
    default: null
  - name: desired_ready_at
    type: datetime
    source: computed
    description: Depletion-forecast timestamp by which the refill should complete (see calculations.depletion_forecast)
  - name: auto_created
    type: boolean
    source: system
    description: True if created by the depletion-sensor cascade, false if manually requested
  - name: status
    type: enum
    source: system
    description: See state_machines.RefillTask
    constraints: 'enum: {SCHEDULED, READY, IN_PROGRESS, COMPLETED, CANCELLED}'
- name: PrepBatch
  parent: null
  common_fields: true
  fields:
  - name: restaurant_id
    type: string
    source: input
    description: FK -> Restaurant.id; prep room scoping
  - name: ingredient_id
    type: string
    source: input
    description: FK -> Ingredient.id; what was prepped
  - name: quantity_grams
    type: number
    source: input
    description: Total grams produced
    constraints: must be > 0
  - name: allocated_grams
    type: number
    source: system
    description: Grams reserved by non-terminal RefillTasks
    default: 0
  - name: consumed_grams
    type: number
    source: system
    description: Grams delivered into hoppers by COMPLETED RefillTasks
    default: 0
  - name: available_grams
    type: number
    source: computed
    description: 'quantity_grams - allocated_grams - consumed_grams; invariant: quantity == allocated + consumed + available at all times. Input
      ignored.'
  - name: status
    type: enum
    source: system
    description: See state_machines.PrepBatch
    constraints: 'enum: {IN_PREP, READY, CONSUMED, EXPIRED}'
  - name: ready_at
    type: datetime
    source: system
    description: Set when marked ready
    default: null
  - name: expires_at
    type: datetime
    source: computed
    description: ready_at + ingredient.shelf_life_minutes; set at mark-ready
- name: Order
  parent: null
  common_fields: true
  fields:
  - name: restaurant_id
    type: string
    source: input
    description: FK -> Restaurant.id; store the order belongs to
  - name: recipe_id
    type: string
    source: input
    description: FK -> Recipe.id; ordered bowl
  - name: customizations
    type: array
    source: input
    description: Array of {ingredient_id, action}; action in {EXTRA, REMOVE, SUBSTITUTE}. EXTRA = 1.5x portion, REMOVE = omit, SUBSTITUTE = swap
      per ACTIVE SubstitutionRule. Default [].
    default: []
  - name: complexity_score
    type: integer
    source: computed
    description: See calculations.routing_complexity_score. Input ignored.
  - name: route
    type: enum
    source: computed
    description: AUTOMATED if complexity_score <= ROUTING_THRESHOLD (8) else MANUAL; may later be forced MANUAL by reroute or quarantine cascade
    constraints: 'enum: {AUTOMATED, MANUAL}'
  - name: assigned_line_id
    type: string
    source: computed
    description: FK -> AssemblyLine.id; chosen by line selector (see calculations.line_selector)
  - name: status
    type: enum
    source: system
    description: See state_machines.Order
    constraints: 'enum: {QUEUED, ASSEMBLING, VERIFICATION, COMPLETED, CANCELLED}'
  - name: queue_entered_at
    type: datetime
    source: system
    description: Timestamp of entering QUEUED (creation, and each re-queue after failed verification)
  - name: started_at
    type: datetime
    source: system
    description: Timestamp of the most recent QUEUED -> ASSEMBLING transition
    default: null
  - name: completed_at
    type: datetime
    source: system
    description: Timestamp of VERIFICATION -> COMPLETED
    default: null
  - name: remake_count
    type: integer
    source: system
    description: Number of failed verifications that returned the order to QUEUED
    default: 0
  - name: expected_total_grams
    type: number
    source: computed
    description: Sum of per-ingredient dispense_grams AFTER per-line rounding (see calculations.dispense_mass_balance). Frozen at ASSEMBLING ->
      VERIFICATION.
    default: 0
  - name: estimated_queue_seconds
    type: integer
    source: computed
    description: 'ESTIMATED variant at creation: (number of QUEUED orders on the assigned line with earlier queue_entered_at) * assigned_line.service_rate_seconds_per_bowl'
  - name: actual_queue_seconds
    type: integer
    source: computed
    description: 'ACTUAL variant: seconds from queue_entered_at to started_at of the successful (final) start-assembly; null until then'
    default: null
- name: PortionVerification
  parent: null
  common_fields: false
  fields:
  - name: order_id
    type: string
    source: input
    description: FK -> Order.id; verified order
  - name: hopper_id
    type: string
    source: input
    description: FK -> Hopper.id; hopper whose dispense was weighed
  - name: ingredient_id
    type: string
    source: system
    description: FK -> Ingredient.id; denormalized from hopper
  - name: expected_grams
    type: number
    source: system
    description: Per-ingredient dispense_grams the order recorded for this hopper
  - name: actual_grams
    type: number
    source: input
    description: Scale-measured grams for this ingredient in the bowl
    constraints: must be >= 0
  - name: variance_pct
    type: number
    source: computed
    description: (actual_grams - expected_grams) / expected_grams * 100; 2 decimals, round_half_up. If expected_grams == 0 the measurement is
      rejected.
  - name: result
    type: enum
    source: computed
    description: PASS if abs(variance_pct) <= PORTION_TOLERANCE_PCT (5.0), else FAIL
    constraints: 'enum: {PASS, FAIL}'
  - name: recorded_by_user_id
    type: string
    source: system
    description: X-User-ID of the verifying operator; used by segregation-of-duties check on calibration approval
- name: CalibrationAdjustment
  parent: null
  common_fields: false
  fields:
  - name: hopper_id
    type: string
    source: input
    description: FK -> Hopper.id; adjusted hopper
  - name: old_coefficient
    type: number
    source: system
    description: calibration_coefficient before adjustment
  - name: new_coefficient
    type: number
    source: input
    description: Replacement calibration_coefficient
    constraints: 0.5 <= value <= 2.0, 3 decimal places
  - name: drift_pct_observed
    type: number
    source: system
    description: drift_pct at the moment of adjustment (null if insufficient samples)
  - name: approved_by_user_id
    type: string
    source: system
    description: X-User-ID of the approving QualityLead
  - name: adjusted_at
    type: datetime
    source: system
    description: Logical-clock timestamp of the adjustment
- name: SubstitutionRule
  parent: null
  common_fields: true
  fields:
  - name: restaurant_id
    type: string
    source: input
    description: FK -> Restaurant.id; menu scoping
  - name: from_ingredient_id
    type: string
    source: input
    description: FK -> Ingredient.id; unavailable ingredient being replaced
  - name: to_ingredient_id
    type: string
    source: input
    description: FK -> Ingredient.id; replacement ingredient (self-referential pair with from_ingredient_id; must differ)
  - name: effective_start
    type: datetime
    source: input
    description: Window start (inclusive)
  - name: effective_end
    type: datetime
    source: input
    description: Window end (exclusive); must be strictly after effective_start
  - name: status
    type: enum
    source: system
    description: See state_machines.SubstitutionRule
    constraints: 'enum: {PENDING, ACTIVE, RETIRED, REJECTED}'
- name: SanitationCycle
  parent: null
  common_fields: true
  fields:
  - name: line_id
    type: string
    source: input
    description: FK -> AssemblyLine.id; line taken out of service
  - name: scheduled_start
    type: datetime
    source: input
    description: Planned window start (inclusive)
  - name: scheduled_end
    type: datetime
    source: input
    description: Planned window end (exclusive); must be strictly after scheduled_start
  - name: actual_started_at
    type: datetime
    source: system
    description: Set on start
    default: null
  - name: actual_completed_at
    type: datetime
    source: system
    description: Set on complete
    default: null
  - name: status
    type: enum
    source: system
    description: See state_machines.SanitationCycle
    constraints: 'enum: {SCHEDULED, IN_PROGRESS, COMPLETED, ABORTED}'
- name: LaborAssignment
  parent: null
  common_fields: true
  fields:
  - name: restaurant_id
    type: string
    source: input
    description: FK -> Restaurant.id; store scoping
  - name: staff_user_id
    type: string
    source: input
    description: Opaque staff identifier being redeployed (matches X-User-ID conventions but is not entity-backed)
  - name: from_role
    type: enum
    source: input
    description: Origin duty; only MAKE_LINE supported (redeployment is always away from the make line)
    constraints: 'enum: {MAKE_LINE}'
  - name: to_role
    type: enum
    source: input
    description: Destination duty
    constraints: 'enum: {PREP, HOSPITALITY}'
  - name: window_start
    type: datetime
    source: input
    description: Redeployment window start (inclusive)
  - name: window_end
    type: datetime
    source: input
    description: Redeployment window end (INCLUSIVE — closed-interval semantics; must be strictly after window_start)
  - name: is_active
    type: boolean
    source: computed
    description: True iff window_start <= now <= window_end (closed interval). Input ignored.
state_machines:
- entity: AssemblyLine
  initial_state: ACTIVE
  terminal_states: []
  transitions:
  - from: ACTIVE
    to: PAUSED
    trigger: POST /api/assembly-lines/{id}/pause
    actor: ShiftManager
    preconditions:
    - line.status == ACTIVE
    - no Order on this line with status == ASSEMBLING
    side_effects:
    - line.posture recomputed (FROZEN while PAUSED)
    - increments line.version by 1
  - from: PAUSED
    to: ACTIVE
    trigger: POST /api/assembly-lines/{id}/resume
    actor: ShiftManager
    preconditions:
    - line.status == PAUSED
    side_effects:
    - line.posture recomputed
    - increments line.version by 1
  - from: ACTIVE
    to: CLEANING
    trigger: POST /api/sanitation-cycles/{id}/start (cycle of this line)
    actor: LineOperator
    preconditions:
    - cycle.status == SCHEDULED and cycle.line_id == line.id
    - line.status == ACTIVE
    - no Order on this line with status IN {QUEUED, ASSEMBLING, VERIFICATION}
    - no Hopper on this line with status == REFILLING
    side_effects:
    - line.posture recomputed (FROZEN while CLEANING)
    - cycle.actual_started_at set to now
    - increments line.version by 1
  - from: CLEANING
    to: ACTIVE
    trigger: POST /api/sanitation-cycles/{id}/complete (cycle of this line)
    actor: LineOperator
    preconditions:
    - cycle.status == IN_PROGRESS and cycle.line_id == line.id
    - line.status == CLEANING
    side_effects:
    - line.last_sanitation_completed_at = now; line.next_sanitation_due_at recomputed
    - 'for every Hopper on this line with status == QUARANTINED: hopper.status -> DEPLETED (hopper must be reloaded before re-service), increments
      hopper.version by 1, and line.posture recomputed'
    - increments line.version by 1
  - from: CLEANING
    to: ACTIVE
    trigger: POST /api/sanitation-cycles/{id}/abort (cycle of this line)
    actor: ShiftManager
    preconditions:
    - cycle.status == IN_PROGRESS and cycle.line_id == line.id
    - line.status == CLEANING
    side_effects:
    - line.last_sanitation_completed_at unchanged; next_sanitation_due_at unchanged (overdue posture persists)
    - quarantined hoppers REMAIN QUARANTINED (abort does not clear quarantine)
    - increments line.version by 1
- entity: Hopper
  initial_state: LOADING
  terminal_states: []
  transitions:
  - from: LOADING
    to: IN_SERVICE
    trigger: POST /api/hoppers/{id}/load
    actor: LineOperator
    preconditions:
    - hopper.status IN {LOADING, DEPLETED}
    - load_grams > 0
    - hopper.current_grams + load_grams <= hopper.capacity_grams
    side_effects:
    - hopper.current_grams += load_grams; hopper.initial_load_grams = current_grams after increment
    - hopper.status -> IN_SERVICE
    - line posture of hopper's line recomputed
    - increments hopper.version by 1
  - from: IN_SERVICE
    to: DEPLETED
    trigger: POST /api/hoppers/{id}/sensor-reading with grams_reading <= HOPPER_DEPLETION_THRESHOLD (<= 200 grams)
    actor: LineOperator
    preconditions:
    - hopper.status == IN_SERVICE
    - 'grams_reading <= 200 (boundary: exactly 200 triggers)'
    side_effects:
    - hopper.current_grams = grams_reading (sensor is authoritative)
    - hopper.status -> DEPLETED
    - 'if no RefillTask exists with hopper_id == hopper.id and status IN {SCHEDULED, READY, IN_PROGRESS}: auto-create RefillTask {hopper_id, auto_created:
      true, requested_grams = capacity - current, desired_ready_at per calculations.depletion_forecast}'
    - line posture recomputed (line becomes RESTRICTED)
    - increments hopper.version by 1
  - from: IN_SERVICE
    to: IN_SERVICE
    trigger: POST /api/hoppers/{id}/sensor-reading with grams_reading > HOPPER_DEPLETION_THRESHOLD (> 200 grams)
    actor: LineOperator
    preconditions:
    - hopper.status == IN_SERVICE
    - grams_reading > 200
    - grams_reading <= hopper.capacity_grams
    side_effects:
    - hopper.current_grams = grams_reading (sensor is authoritative; dispense-derived bookkeeping is overwritten)
    - line posture recomputed
    - increments hopper.version by 1
  - from: DEPLETED
    to: REFILL_SCHEDULED
    trigger: RefillTask SCHEDULED -> READY when task.prep_batch_id set (allocation)
    actor: system
    preconditions:
    - hopper.status == DEPLETED
    - a RefillTask for this hopper transitions to READY
    side_effects:
    - hopper.status -> REFILL_SCHEDULED
    - increments hopper.version by 1
  - from: REFILL_SCHEDULED
    to: REFILLING
    trigger: POST /api/refill-tasks/{id}/start (task of this hopper)
    actor: LineOperator
    preconditions:
    - task.status == READY and task.hopper_id == hopper.id
    - hopper.status == REFILL_SCHEDULED
    - hopper's line.status == ACTIVE (cannot refill a line out of service)
    side_effects:
    - hopper.status -> REFILLING
    - increments hopper.version by 1
  - from: REFILLING
    to: IN_SERVICE
    trigger: POST /api/refill-tasks/{id}/complete (task of this hopper)
    actor: LineOperator
    preconditions:
    - task.status == IN_PROGRESS and task.hopper_id == hopper.id
    - hopper.status == REFILLING
    side_effects:
    - hopper.current_grams += task.allocated_grams; hopper.cumulative_refilled_grams += task.allocated_grams
    - 'PrepBatch(task.prep_batch_id): allocated_grams -= task.allocated_grams; consumed_grams += task.allocated_grams; if available_grams == 0
      and allocated_grams == 0 then batch.status -> CONSUMED'
    - task.status -> COMPLETED; hopper.status -> IN_SERVICE; line posture recomputed
    - increments hopper.version by 1 and batch.version by 1
  - from: REFILL_SCHEDULED
    to: DEPLETED
    trigger: POST /api/refill-tasks/{id}/cancel (task of this hopper)
    actor: ShiftManager
    preconditions:
    - task.status IN {SCHEDULED, READY} and task.hopper_id == hopper.id
    - hopper.status == REFILL_SCHEDULED iff task was READY; hopper stays DEPLETED if task was SCHEDULED
    side_effects:
    - 'if task.prep_batch_id set: PrepBatch.allocated_grams -= task.allocated_grams (batch.version +1)'
    - task.status -> CANCELLED
    - hopper.status -> DEPLETED (hopper returns to awaiting-refill pool; a new request is required)
    - increments hopper.version by 1
  - from: IN_SERVICE
    to: QUARANTINED
    trigger: 'system drift detection: calculations.calibration_drift_detection evaluates hopper.drift_pct'
    actor: system
    preconditions:
    - hopper.status == IN_SERVICE
    - hopper.drift_pct is not null and abs(hopper.drift_pct) > DRIFT_THRESHOLD_PCT (3.0; strictly greater — exactly 3.0 does not trigger)
    side_effects:
    - hopper.status -> QUARANTINED
    - hopper's line.posture -> RESTRICTED
    - 'for every Order with assigned_line_id == hopper.line_id, route == AUTOMATED, status == QUEUED, and recipe contains hopper.ingredient_id
      (directly or via applied substitution): order.route -> MANUAL, order.assigned_line_id reselected per calculations.line_selector among eligible
      MANUAL lines, order.estimated_queue_seconds recomputed (order.version +1 each)'
    - increments hopper.version by 1
  - from: QUARANTINED
    to: IN_SERVICE
    trigger: POST /api/hoppers/{id}/calibration-adjustments
    actor: QualityLead
    preconditions:
    - hopper.status == QUARANTINED
    - 'X-User-ID (approver) != recorded_by_user_id of the most recent PortionVerification for this hopper (segregation of duties: verifier cannot
      approve the calibration that clears their own finding); when no verifications exist the check is vacuous'
    - 0.5 <= new_coefficient <= 2.0
    side_effects:
    - creates CalibrationAdjustment {old_coefficient, new_coefficient, drift_pct_observed, approved_by_user_id = X-User-ID, adjusted_at = now}
    - hopper.calibration_coefficient = new_coefficient; hopper.drift_window_anchor = now; hopper.drift_pct recomputed -> null (window reset)
    - hopper.status -> IN_SERVICE; hopper's line.posture recomputed
    - QUEUED orders previously force-rerouted to MANUAL are NOT automatically moved back
    - increments hopper.version by 1
- entity: RefillTask
  initial_state: SCHEDULED
  terminal_states:
  - COMPLETED
  - CANCELLED
  transitions:
  - from: SCHEDULED
    to: READY
    trigger: system allocation on PrepBatch mark-ready or RefillTask creation, per calculations.refill_allocation_waterfall
    actor: system
    preconditions:
    - a READY, unexpired PrepBatch for task.ingredient_id at the task's restaurant with available_grams > 0 exists
    side_effects:
    - task.allocated_grams = min(task.requested_grams, selected batch.available_grams); task.prep_batch_id = selected batch
    - PrepBatch.allocated_grams += task.allocated_grams (batch.version +1)
    - hopper(task.hopper_id) DEPLETED -> REFILL_SCHEDULED
    - increments task.version by 1
  - from: READY
    to: IN_PROGRESS
    trigger: POST /api/refill-tasks/{id}/start
    actor: LineOperator
    preconditions:
    - task.status == READY
    - task batch.status == READY and batch.expires_at > now (allocated batch must still be usable)
    - hopper.status == REFILL_SCHEDULED and hopper's line.status == ACTIVE
    side_effects:
    - hopper.status -> REFILLING
    - increments task.version by 1
  - from: IN_PROGRESS
    to: COMPLETED
    trigger: POST /api/refill-tasks/{id}/complete
    actor: LineOperator
    preconditions:
    - task.status == IN_PROGRESS
    - hopper.status == REFILLING
    side_effects:
    - hopper/prep-batch updates per Hopper REFILLING -> IN_SERVICE transition
    - increments task.version by 1
  - from: SCHEDULED
    to: CANCELLED
    trigger: POST /api/refill-tasks/{id}/cancel
    actor: ShiftManager
    preconditions:
    - task.status IN {SCHEDULED, READY}
    side_effects:
    - 'if prep_batch_id set: batch.allocated_grams -= task.allocated_grams (batch.version +1); hopper REFILL_SCHEDULED -> DEPLETED'
    - increments task.version by 1
  - from: READY
    to: CANCELLED
    trigger: POST /api/refill-tasks/{id}/cancel
    actor: ShiftManager
    preconditions:
    - task.status IN {SCHEDULED, READY}
    side_effects:
    - batch.allocated_grams -= task.allocated_grams (batch.version +1); hopper REFILL_SCHEDULED -> DEPLETED
    - increments task.version by 1
- entity: PrepBatch
  initial_state: IN_PREP
  terminal_states:
  - CONSUMED
  - EXPIRED
  transitions:
  - from: IN_PREP
    to: READY
    trigger: POST /api/prep-batches/{id}/mark-ready
    actor: PrepCook
    preconditions:
    - batch.status == IN_PREP
    side_effects:
    - batch.ready_at = now; batch.expires_at = now + ingredient.shelf_life_minutes
    - run calculations.refill_allocation_waterfall over SCHEDULED RefillTasks needing this ingredient at this restaurant
    - increments batch.version by 1
  - from: READY
    to: CONSUMED
    trigger: 'system: RefillTask completion drives available_grams == 0 and allocated_grams == 0'
    actor: system
    preconditions:
    - batch.available_grams == 0 and batch.allocated_grams == 0
    side_effects:
    - increments batch.version by 1
  - from: READY
    to: EXPIRED
    trigger: POST /api/prep-batches/expire-sweep
    actor: ShiftManager
    preconditions:
    - batch.status == READY and batch.expires_at <= now
    side_effects:
    - 'for each RefillTask with prep_batch_id == batch.id and status == READY: task.status -> SCHEDULED, task.allocated_grams = 0, task.prep_batch_id
      = null (task.version +1); linked hopper REFILL_SCHEDULED -> DEPLETED (hopper.version +1); batch.allocated_grams -= released amount'
    - then run calculations.refill_allocation_waterfall to try re-allocating the released tasks from other READY unexpired batches
    - increments batch.version by 1
- entity: Order
  initial_state: QUEUED
  terminal_states:
  - COMPLETED
  - CANCELLED
  transitions:
  - from: QUEUED
    to: ASSEMBLING
    trigger: POST /api/orders/{id}/start-assembly
    actor: LineOperator
    preconditions:
    - order.status == QUEUED
    - assigned_line.posture == OPEN (gates every child operation on the line)
    - 'for each recipe portion (after customizations/substitutions): the resolved ingredient is not EIGHTY_SIXED, and if route == AUTOMATED the
      line has a hopper for the resolved ingredient with status == IN_SERVICE and current_grams >= dispense_grams'
    side_effects:
    - order.started_at = now; order.actual_queue_seconds = now - order.queue_entered_at (FINAL on the successful start; supersedes earlier value
      from any failed-remake start)
    - 'if route == AUTOMATED: for each portion, hopper.current_grams -= dispense_grams and hopper.cumulative_dispensed_grams += dispense_grams
      (hopper.version +1 each); line posture recomputed'
    - increments order.version by 1
  - from: ASSEMBLING
    to: VERIFICATION
    trigger: POST /api/orders/{id}/submit-verification
    actor: LineOperator
    preconditions:
    - order.status == ASSEMBLING
    - measurements array covers exactly the hopper set dispensed for this order (AUTOMATED) — each entry {hopper_id, actual_grams}
    side_effects:
    - order.expected_total_grams frozen = sum of per-line dispense_grams (see calculations.dispense_mass_balance)
    - creates one PortionVerification per measurement with expected/actual/variance/result computed
    - increments order.version by 1
  - from: VERIFICATION
    to: COMPLETED
    trigger: POST /api/orders/{id}/submit-verification when every created PortionVerification has result == PASS
    actor: system
    preconditions:
    - all PortionVerifications created by this submission have result == PASS
    side_effects:
    - order.completed_at = now
    - restaurant throughput aggregates recomputed (see calculations.throughput_per_hour)
    - 'for each hopper involved: drift_pct recomputed; if drift_pct not null and abs(drift_pct) > 3.0 then Hopper IN_SERVICE -> QUARANTINED cascade
      fires'
    - increments order.version by 1
  - from: VERIFICATION
    to: QUEUED
    trigger: POST /api/orders/{id}/submit-verification when any created PortionVerification has result == FAIL
    actor: system
    preconditions:
    - order.remake_count < REMAKE_LIMIT (3)
    side_effects:
    - order.remake_count += 1; order.queue_entered_at = now (re-queued at the BACK of the line's queue); order.started_at reset to null; order.actual_queue_seconds
      reset to null
    - 'for each failed measurement: hopper.cumulative_dispensed_grams -= expected_grams and hopper.cumulative_waste_grams += expected_grams (hopper.version
      +1); the dispensed mass is reclassified as waste and is NOT returned to hopper.current_grams'
    - order.estimated_queue_seconds recomputed
    - 'for each hopper involved: drift_pct recomputed; quarantine cascade may fire as in the COMPLETED transition'
    - increments order.version by 1
  - from: VERIFICATION
    to: CANCELLED
    trigger: POST /api/orders/{id}/submit-verification when a verification FAILS and order.remake_count == REMAKE_LIMIT (3)
    actor: system
    preconditions:
    - 'order.remake_count == 3 (boundary: the fourth failure cancels)'
    side_effects:
    - failed measurements reclassified to waste as in the re-queue transition
    - drift recompute / quarantine cascade as in the re-queue transition
    - increments order.version by 1
  - from: QUEUED
    to: CANCELLED
    trigger: POST /api/orders/{id}/cancel
    actor: Customer
    preconditions:
    - order.status == QUEUED
    - X-User-ID is recorded as the placing customer id (order carries no separate customer entity; customer identity is the opaque X-User-ID captured
      at creation — any Customer role may cancel any QUEUED order)
    side_effects:
    - estimated_queue_seconds of remaining QUEUED orders on the assigned line recomputed
    - increments order.version by 1
  - from: QUEUED
    to: QUEUED
    trigger: POST /api/orders/{id}/reroute
    actor: ShiftManager
    preconditions:
    - order.status == QUEUED
    - target line exists at order's restaurant, line_type differs from current route's requirement per explicit target_route input, and target
      line posture == OPEN
    side_effects:
    - order.route and order.assigned_line_id updated; order.queue_entered_at = now (re-queued at back of target line); estimated_queue_seconds
      recomputed
    - increments order.version by 1
- entity: SubstitutionRule
  initial_state: PENDING
  terminal_states:
  - RETIRED
  - REJECTED
  transitions:
  - from: PENDING
    to: ACTIVE
    trigger: POST /api/substitution-rules/{id}/activate
    actor: ShiftManager
    preconditions:
    - rule.status == PENDING
    - to_ingredient.status == ACTIVE
    - no other ACTIVE SubstitutionRule for the same restaurant_id + from_ingredient_id with an overlapping window (overlapping windows for the
      same from_ingredient rejected; different from_ingredients may overlap freely)
    side_effects:
    - Recipe.is_available recomputed for all recipes at the restaurant containing from_ingredient_id
    - increments rule.version by 1
  - from: PENDING
    to: REJECTED
    trigger: POST /api/substitution-rules/{id}/reject
    actor: ShiftManager
    preconditions:
    - rule.status == PENDING
    side_effects:
    - increments rule.version by 1
  - from: ACTIVE
    to: RETIRED
    trigger: POST /api/substitution-rules/{id}/retire
    actor: ShiftManager
    preconditions:
    - rule.status == ACTIVE
    side_effects:
    - Recipe.is_available recomputed for affected recipes (an eighty-sixed from_ingredient may now leave recipes unavailable)
    - increments rule.version by 1
- entity: SanitationCycle
  initial_state: SCHEDULED
  terminal_states:
  - COMPLETED
  - ABORTED
  transitions:
  - from: SCHEDULED
    to: IN_PROGRESS
    trigger: POST /api/sanitation-cycles/{id}/start
    actor: LineOperator
    preconditions:
    - cycle.status == SCHEDULED
    - now >= cycle.scheduled_start and now < cycle.scheduled_end (half-open window)
    - line preconditions per AssemblyLine ACTIVE -> CLEANING
    side_effects:
    - AssemblyLine ACTIVE -> CLEANING side effects
    - increments cycle.version by 1
  - from: IN_PROGRESS
    to: COMPLETED
    trigger: POST /api/sanitation-cycles/{id}/complete
    actor: LineOperator
    preconditions:
    - cycle.status == IN_PROGRESS
    side_effects:
    - AssemblyLine CLEANING -> ACTIVE side effects (including quarantine -> DEPLETED hopper reset)
    - increments cycle.version by 1
  - from: IN_PROGRESS
    to: ABORTED
    trigger: POST /api/sanitation-cycles/{id}/abort
    actor: ShiftManager
    preconditions:
    - cycle.status == IN_PROGRESS
    side_effects:
    - AssemblyLine CLEANING -> ACTIVE abort side effects (quarantine NOT cleared, sanitation still overdue)
    - increments cycle.version by 1
concurrency_rules:
- rule_id: order-create-stale-recipe
  parent_entity: Recipe
  write_endpoint: POST /api/orders
  occ_field: expected_recipe_version
  description: 'Creating an Order against a Recipe whose version has advanced since the

    client last observed it is rejected. This captures the case where another

    writer has just modified the recipe''s portion_spec or an eighty-six /

    substitution cascade has flipped Recipe.is_available (bumping version),

    and the current writer''s view of the recipe is therefore stale.

    '
  error_id: ERR_STALE_RECIPE_VERSION
  http_status: 412
- rule_id: hopper-load-stale-version
  parent_entity: Hopper
  write_endpoint: POST /api/hoppers/{id}/load
  occ_field: expected_hopper_version
  description: 'Loading a Hopper whose version has advanced since the client last

    observed it is rejected. This captures the case where another writer has

    just completed a load or a sensor reading has re-baselined

    current_grams, and the current writer''s capacity computation is

    therefore stale.

    '
  error_id: ERR_STALE_HOPPER_VERSION
  http_status: 412
calculations:
- name: dispense_mass_balance
  trigger: Order QUEUED -> ASSEMBLING (per portion) and ASSEMBLING -> VERIFICATION (total freeze)
  algorithm: combinatorial
  formula: "For each recipe portion entry (after customizations and substitutions resolve\nthe effective ingredient and target):\n  base_target\
    \ = portion.target_grams\n  if customization action == EXTRA: base_target = base_target * 1.5\n  dispense_grams = round_half_up(base_target\
    \ * hopper.calibration_coefficient, 1)   # PER-LINE rounding to 0.1 g\nhopper.current_grams -= dispense_grams\nhopper.cumulative_dispensed_grams\
    \ += dispense_grams\norder.expected_total_grams = sum(dispense_grams over all lines)   # sum of ALREADY-ROUNDED lines; never re-rounded\n"
  input_set: Portion entries of the order's recipe, with REMOVE entries excluded and SUBSTITUTE entries resolved through the ACTIVE SubstitutionRule
    in effect at start-assembly time
  constants:
    EXTRA_MULTIPLIER: 1.5
    DISPENSE_PRECISION: 0.1 grams
  precision: 'per-line 1 decimal place round_half_up; total is an exact sum of rounded lines (pinned rounding order: round per line THEN sum)'
  variants:
  - name: nominal_projection
    when: order creation time, before assembly
    difference: uses round_half_up(base_target * calibration_coefficient, 1) per line with coefficients as of creation; informational only
  - name: frozen_actual
    when: ASSEMBLING -> VERIFICATION
    difference: recomputed with coefficients as of the actual dispense moment; if a CalibrationAdjustment landed between creation and assembly
      the two variants diverge
- name: queue_time
  trigger: Order creation (ESTIMATED) and QUEUED -> ASSEMBLING (ACTUAL)
  algorithm: forward_looking
  formula: "ESTIMATED (at creation, and recomputed on reroute / re-queue / queue changes):\n  estimated_queue_seconds = count(orders O where O.assigned_line_id\
    \ == this.assigned_line_id\n                                  AND O.status == QUEUED\n                                  AND O.queue_entered_at\
    \ < this.queue_entered_at)\n                            * assigned_line.service_rate_seconds_per_bowl\n  # strictly earlier queue_entered_at;\
    \ ties broken by created_at ASC; the order itself excluded\nACTUAL (on the successful start-assembly that ultimately leads to COMPLETED):\n\
    \  actual_queue_seconds = started_at - queue_entered_at (seconds)\n  # REMAKE variant: re-queue after failed verification resets queue_entered_at,\
    \ so actual\n  # measures only the FINAL wait — cumulative wait across remakes is intentionally excluded\n"
  input_set: QUEUED orders on the assigned line; COMPLETED/CANCELLED/ASSEMBLING/VERIFICATION excluded
  constants: {}
  precision: integer seconds
  variants:
  - name: estimated
    when: order is QUEUED
    difference: count-based projection using nominal service rate
  - name: actual
    when: order leaves QUEUED for the final time
    difference: measured wall wait of the final queue entry only
- name: throughput_per_hour
  trigger: Order -> COMPLETED; read via GET /api/throughput
  algorithm: chronological
  formula: "bowls_per_hour(line, window [window_start, window_end)):\n  completed = [orders where assigned_line_id == line AND status == COMPLETED\n\
    \               AND completed_at IN [window_start, window_end)]\n  order events sorted by completed_at ASC; ties broken by created_at ASC\
    \ (never by id)\n  bowls_per_hour = len(completed) * 3600.0 / (window_end - window_start in seconds)\navg_queue_seconds(line, window) = mean(actual_queue_seconds\
    \ over completed) or null if empty\nqueue_target_met = (avg_queue_seconds is not null) and (avg_queue_seconds <= QUEUE_TARGET_SECONDS)\n"
  input_set: COMPLETED orders only; CANCELLED and in-flight orders excluded; window is half-open [start, end)
  constants:
    QUEUE_TARGET_SECONDS: 300
  precision: bowls_per_hour 2 decimals round_half_up; avg_queue_seconds integer round_half_up
- name: routing_complexity_score
  trigger: Order creation
  algorithm: constraint_propagation
  formula: "score = recipe.base_complexity\nfor each customization entry:\n  action == EXTRA      -> score += 1\n  action == REMOVE     -> score\
    \ += 2\n  action == SUBSTITUTE -> score += 3\n  if referenced ingredient.allergen_flag: score += 2\nroute = AUTOMATED if score <= ROUTING_THRESHOLD\
    \ else MANUAL   # boundary: score == 8 routes AUTOMATED\n"
  input_set: recipe.base_complexity + order.customizations with resolved ingredient allergen flags
  constants:
    ROUTING_THRESHOLD: 8
  precision: integer
- name: line_selector
  trigger: Order creation (initial assignment), reroute, quarantine cascade re-selection
  algorithm: selector
  formula: "eligibility: lines at order.restaurant_id with line_type == order.route\n             AND status == ACTIVE AND posture == OPEN\nranking:\
    \ fewest QUEUED orders on the line (ascending)\ntie-break 1: lowest service_rate_seconds_per_bowl\ntie-break 2: earliest created_at (never\
    \ id)\nempty pool: reject order creation with ERR_NO_LINE_AVAILABLE; on quarantine cascade with\n            empty MANUAL pool the order stays\
    \ QUEUED on its current line with route forced\n            MANUAL and assigned_line_id unchanged until a manual reroute\n"
  input_set: AssemblyLines of the restaurant; QUEUED orders for queue-depth counts
  constants: {}
  precision: n/a (selection)
- name: depletion_forecast
  trigger: RefillTask creation (auto from sensor cascade or manual POST /api/refill-tasks)
  algorithm: forward_looking
  formula: "burn_rate_grams_per_min(hopper) =\n  hopper.cumulative_dispensed_grams\n  / max(1, minutes_between(hopper.created_at, now))\n  # step\
    \ approximation over the hopper's lifetime; no decay — a calibration reset does NOT\n  # reset burn history\nminutes_to_empty = hopper.current_grams\
    \ / burn_rate_grams_per_min(hopper)\n  # when burn_rate rounds to 0 with current_grams > 0: minutes_to_empty = FORECAST_CAP_MINUTES (240)\n\
    desired_ready_at = now + minutes_to_empty * SAFETY_FACTOR   # 0.8: refill must land before empty\nrequested_grams (FORECAST variant) = min(capacity\
    \ - current_grams,\n  sum over QUEUED orders on the line whose recipe (post-customization) needs this ingredient\n  of per-order dispense_grams\
    \ for this ingredient)\nrequested_grams (STANDARD variant) = capacity - current_grams\n"
  input_set: hopper dispense history; QUEUED orders on the hopper's line
  constants:
    SAFETY_FACTOR: 0.8
    FORECAST_CAP_MINUTES: 240
  precision: minutes_to_empty 2 decimals round_half_up; requested_grams 1 decimal round_half_up
  variants:
  - name: standard
    when: manual refill request without demand context (mode == STANDARD)
    difference: fills to capacity regardless of queued demand
  - name: forecast
    when: mode == FORECAST (auto-created refills always use FORECAST)
    difference: demand-capped; can be strictly smaller than STANDARD for identical hopper state, and zero committed demand yields requested_grams
      == 0 (task still created)
- name: calibration_drift_detection
  trigger: PortionVerification creation (as part of submit-verification), per involved hopper
  algorithm: aggregation
  formula: "samples = PortionVerifications for hopper with created_at > hopper.drift_window_anchor,\n          most recent DRIFT_WINDOW_SIZE (10)\
    \ by created_at DESC (tie-break: created_at DESC is\n          total within logical-clock ticks; identical timestamps keep insertion order)\n\
    if len(samples) < DRIFT_MIN_SAMPLES (3): drift_pct = null (insufficient data)\nelse: drift_pct = round_half_up(mean(variance_pct over samples),\
    \ 2)   # SIGNED mean\nquarantine when drift_pct is not null AND abs(drift_pct) > DRIFT_THRESHOLD_PCT (3.0)\n# boundary: exactly 3.0 does NOT\
    \ quarantine (strictly greater)\n# circular-looking dependency pinned: dispense uses CURRENT coefficient; verifications feed\n# drift; drift\
    \ triggers quarantine; calibration adjustment changes the coefficient AND resets\n# the window anchor. Evaluation order: (1) freeze dispense_grams\
    \ with current coefficient,\n# (2) weigh and compute variance, (3) update drift, (4) maybe quarantine, (5) adjustment later\n# changes coefficient\
    \ for FUTURE dispenses only.\n"
  input_set: PortionVerifications of the hopper created after drift_window_anchor
  constants:
    DRIFT_WINDOW_SIZE: 10
    DRIFT_MIN_SAMPLES: 3
    DRIFT_THRESHOLD_PCT: 3.0
    PORTION_TOLERANCE_PCT: 5.0
  precision: drift_pct 2 decimals round_half_up
- name: refill_allocation_waterfall
  trigger: PrepBatch IN_PREP -> READY; RefillTask creation; expire-sweep release
  algorithm: waterfall_allocation
  formula: "pending = RefillTasks with status == SCHEDULED, ordered by desired_ready_at ASC,\n          tie-break created_at ASC (never id)\n\
    for each task in pending order:\n  candidates = PrepBatches at task's restaurant with ingredient_id == task.ingredient_id,\n             \
    \  status == READY, expires_at > now, available_grams > 0,\n               ordered by expires_at ASC (FEFO), tie-break created_at ASC\n  if\
    \ candidates empty: task stays SCHEDULED (deferred — no error)\n  else: batch = first candidate\n        task.allocated_grams = min(task.requested_grams,\
    \ batch.available_grams)\n        task.prep_batch_id = batch; task.status -> READY\n        batch.allocated_grams += task.allocated_grams\n\
    \        hopper(task.hopper_id) DEPLETED -> REFILL_SCHEDULED\n# partial allocation allowed: task proceeds with less than requested_grams\n"
  input_set: SCHEDULED RefillTasks; READY unexpired PrepBatches
  constants: {}
  precision: allocated_grams 1 decimal round_half_up
- name: prep_batch_utilization
  trigger: read via GET /api/prep-batches/{id} (computed projection)
  algorithm: aggregation
  formula: 'utilized_pct = round_half_up(consumed_grams / quantity_grams * 100, 2)

    waste_pct    = round_half_up((quantity_grams - consumed_grams - allocated_grams - available_grams) / quantity_grams * 100, 2)

    # EXPIRED-bucket variant: when status == EXPIRED, remaining available_grams are counted as waste:

    waste_pct_expired = round_half_up((available_grams) / quantity_grams * 100, 2) on transition to EXPIRED

    # the two waste figures diverge for identical fields because the EXPIRED variant reclassifies

    # unsold remainder as waste while the live variant treats it as usable

    invariant: quantity_grams == allocated_grams + consumed_grams + available_grams (always)

    '
  input_set: the PrepBatch row itself
  constants: {}
  precision: 2 decimals round_half_up
  variants:
  - name: live
    when: status IN {IN_PREP, READY}
    difference: available remainder is not waste
  - name: expired
    when: status == EXPIRED
    difference: available remainder reclassified as waste — same inputs, different waste_pct
validations:
- priority: 1
  category: auth
  check: X-User-Role header present and names a declared role; X-User-ID header present
  error_id: ERR_UNAUTHENTICATED
  http_status: 401
  applies_to: all endpoints
- priority: 2
  category: auth
  check: acting role is permitted for the endpoint per §1.5 roles
  error_id: ERR_UNAUTHORIZED_ROLE
  http_status: 403
  applies_to: all endpoints
- priority: 3
  category: existence
  check: path-templated resources exist, validated left-to-right (restaurant -> line -> hopper/task/cycle/order/recipe/rule/batch)
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: all endpoints with path ids
- priority: 4
  category: existence
  check: body-referenced entities exist (recipe_id, ingredient_ids in portion_spec/customizations/substitution pairs, hopper_id, prep_batch_id)
  error_id: ERR_NOT_FOUND
  http_status: 404
  applies_to: POST /api/orders, POST /api/recipes, POST /api/substitution-rules, POST /api/refill-tasks, POST /api/hoppers/{id}/calibration-adjustments,
    POST /api/orders/{id}/submit-verification
- priority: 5
  category: state
  check: target resource state permits the transition per §1.2 (wrong-from-state rejected)
  error_id: ERR_INVALID_STATE
  http_status: 409
  applies_to: all action endpoints
- priority: 6
  category: business_safety
  check: calibration adjustment approver (X-User-ID) != recorded_by_user_id of the most recent PortionVerification on the hopper — verifier cannot
    clear their own finding
  error_id: ERR_SEGREGATION_OF_DUTIES
  http_status: 403
  applies_to: POST /api/hoppers/{id}/calibration-adjustments
- priority: 7
  category: business_temporal
  check: sanitation cycle may start only when now >= scheduled_start and now < scheduled_end (half-open); scheduling a cycle overlapping another
    non-terminal cycle on the same line is rejected (touching endpoints allowed)
  error_id: ERR_SANITATION_OVERLAP
  http_status: 422
  applies_to: POST /api/sanitation-cycles, POST /api/sanitation-cycles/{id}/start
- priority: 8
  category: business_temporal
  check: labor assignment windows for the same staff_user_id must not overlap under closed-interval semantics (window_start <= existing.window_end
    AND existing.window_start <= window_end => conflict; touching endpoints DO conflict)
  error_id: ERR_LABOR_OVERLAP
  http_status: 422
  applies_to: POST /api/labor-assignments
- priority: 9
  category: business_constraint
  check: load would not exceed hopper capacity (current_grams + load_grams <= capacity_grams); equality allowed
  error_id: ERR_HOPPER_CAPACITY_EXCEEDED
  http_status: 422
  applies_to: POST /api/hoppers/{id}/load
- priority: 10
  category: business_constraint
  check: sensor reading within physical bounds (0 <= grams_reading <= capacity_grams)
  error_id: ERR_SENSOR_READING_OUT_OF_RANGE
  http_status: 422
  applies_to: POST /api/hoppers/{id}/sensor-reading
- priority: 11
  category: business_referential
  check: order creation requires at least one eligible line for the computed route at the restaurant (selector non-empty)
  error_id: ERR_NO_LINE_AVAILABLE
  http_status: 422
  applies_to: POST /api/orders
- priority: 12
  category: business_referential
  check: recipe referenced by a new order must have is_available == true (post eighty-six/substitution resolution)
  error_id: ERR_RECIPE_UNAVAILABLE
  http_status: 422
  applies_to: POST /api/orders
- priority: 13
  category: business_constraint
  check: 'substitution rule: to_ingredient must be ACTIVE, from_ingredient != to_ingredient, and no ACTIVE rule for the same restaurant + from_ingredient
    with an overlapping window; effective_end strictly after effective_start'
  error_id: ERR_SUBSTITUTION_CONFLICT
  http_status: 422
  applies_to: POST /api/substitution-rules, POST /api/substitution-rules/{id}/activate
- priority: 14
  category: business_constraint
  check: refill start requires the allocated batch still READY and unexpired (expires_at > now)
  error_id: ERR_PREP_BATCH_EXPIRED
  http_status: 422
  applies_to: POST /api/refill-tasks/{id}/start
- priority: 15
  category: business_constraint
  check: verification measurements must cover exactly the dispensed hopper set, each actual_grams >= 0, and expected_grams > 0 per line
  error_id: ERR_VERIFICATION_MISMATCH
  http_status: 422
  applies_to: POST /api/orders/{id}/submit-verification
- priority: 16
  category: business_fiscal
  check: restaurant-level daily refill budget (sum of allocated_grams of RefillTasks created today) must stay within DAILY_REFILL_BUDGET_GRAMS
    (50000); manual refill creation that would cross the budget is rejected (auto-created sensor refills are exempt and may exceed it)
  error_id: ERR_REFILL_BUDGET_EXCEEDED
  http_status: 402
  applies_to: POST /api/refill-tasks
- priority: 17
  category: business_constraint
  check: customizations reference ingredients in the recipe's portion_spec (EXTRA/REMOVE) or name a valid substitution pair (SUBSTITUTE); duplicate
    customization entries for the same ingredient rejected
  error_id: ERR_INVALID_CUSTOMIZATION
  http_status: 422
  applies_to: POST /api/orders
- priority: 18
  category: business_constraint
  check: new_coefficient within [0.5, 2.0]; load_grams > 0; quantity_grams > 0; service_rate_seconds_per_bowl > 0; enum fields carry declared
    members only; sku unique
  error_id: ERR_VALIDATION
  http_status: 400
  applies_to: multiple creation/adjustment endpoints
- priority: 19
  category: business_constraint
  check: 'hopper station_slot must map to the ingredient''s station_type under the fixed slot map: slot 0 = BASE, slot 1 = PROTEIN, slots 2-5
    = TOPPING, slot 6 = DRESSING'
  error_id: ERR_INGREDIENT_STATION_MISMATCH
  http_status: 422
  applies_to: POST /api/hoppers
- priority: 20
  category: state
  check: pause or sanitation start require no in-flight order on the line and no REFILLING hopper (line-busy guard)
  error_id: ERR_LINE_BUSY
  http_status: 409
  applies_to: POST /api/assembly-lines/{id}/pause, POST /api/sanitation-cycles/{id}/start
- priority: 21
  category: state
  check: start-assembly requires assigned_line.posture == OPEN
  error_id: ERR_LINE_NOT_OPEN
  http_status: 409
  applies_to: POST /api/orders/{id}/start-assembly
- priority: 22
  category: state
  check: 'OCC: expected_recipe_version matches current Recipe.version on order creation; expected_hopper_version matches current Hopper.version
    on load'
  error_id: ERR_STALE_RECIPE_VERSION
  http_status: 412
  applies_to: POST /api/orders
- priority: 23
  category: state
  check: 'OCC: expected_hopper_version matches current Hopper.version'
  error_id: ERR_STALE_HOPPER_VERSION
  http_status: 412
  applies_to: POST /api/hoppers/{id}/load
- priority: 24
  category: state
  check: eighty-six requires ingredient status ACTIVE (re-eighty-six of an EIGHTY_SIXED ingredient rejected); restore of an ACTIVE ingredient
    falls under the generic ERR_INVALID_STATE at priority 5
  error_id: ERR_ALREADY_EIGHTY_SIXED
  http_status: 409
  applies_to: POST /api/ingredients/{id}/eighty-six
