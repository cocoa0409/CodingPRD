      - name: unknown_hit_path_segment_outranks_state_checks
        claim_type: Cascading Validation
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Publishing through an unknown hit_id returns 404 ERR_NOT_FOUND rather than a state or fiscal error, because existence is resolved before state on the path left to right."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One requester exists with a zero balance and no HITs."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/requesters"
              payload: { name: "Acme Existence" }
              as: Anonymous
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /mkt/hits/00000000-0000-4000-8000-000000000000/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "the error is not a state or fiscal error even though the requester balance is 0"

      - name: conditional_qualification_gate_applies_only_to_gated_hits
        claim_type: Conditional Validation
        grounds:
          - state_machines.HIT.transitions.PUBLISHED_to_DISPATCHED
          - errors.ERR_QUALIFICATION_REQUIRED
        distinguishing_aspect: "The qualification precondition fires only for a HIT whose required_qualification_ids is non-empty; the same worker is admitted to a HIT with an empty array, so the rule is entity-configured rather than global."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Qualification type Gate with an exam; HIT A is ungated and HIT B requires the Gate qualification. W1 holds no grant."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
