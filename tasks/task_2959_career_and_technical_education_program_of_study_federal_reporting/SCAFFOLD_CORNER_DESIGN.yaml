            - "Empty database. The logical clock is pinned to its startup default 2026-08-01T00:00:00Z."
            - "One ProgramOfStudy in approval_status DRAFT with labor_market_data_asof 2026-03-01 and clna_phase CERTIFIED, clna_certified_on 2026-08-01 and clna_expires_on 2028-07-31."
