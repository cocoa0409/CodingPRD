              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
            - call: "GET /tour-stops"
              payload: { venue_booking_id: "${b_atl}" }
              as: SeriesPromoter
              captures: { stop_atl: "$.data[0].id" }
            - call: "PATCH /tour-stops/${stop_atl}/logistics"
              payload: { doors_open_utc: "2026-11-14T22:00:00Z", show_start_utc: "2026-11-14T23:00:00Z", show_window_minutes: 150 }
              as: SeriesPromoter
          trigger:
            - call: "POST /tour-stops/${stop_atl}/show-segments"
              payload: { segment_type: "COMPETITION", title: "Heat 1", run_order_position: 1, duration_minutes: 30 }
              as: SeriesPromoter
              captures: { seg1: "$.data.id" }
            - call: "POST /tour-stops/${stop_atl}/show-segments"
              payload: { segment_type: "INTERMISSION", title: "Freestyle Show", run_order_position: 2, duration_minutes: 20 }
              as: SeriesPromoter
              captures: { seg2: "$.data.id" }
            - call: "POST /tour-stops/${stop_atl}/show-segments"
              payload: { segment_type: "COMPETITION", title: "Heat 2", run_order_position: 3, duration_minutes: 30 }
              as: SeriesPromoter
              captures: { seg3: "$.data.id" }
            - call: "POST /tour-stops/${stop_atl}/show-segments"
              payload: { segment_type: "COMPETITION", title: "Heat 3", run_order_position: 4, duration_minutes: 40 }
              as: SeriesPromoter
              captures: { seg4: "$.data.id" }
            - call: "POST /tour-stops/${stop_atl}/show-segments"
              payload: { segment_type: "COMPETITION", title: "Main Event", run_order_position: 5, duration_minutes: 14 }
              as: SeriesPromoter
