# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x 2 instances = 18 instances. Every ground resolves into SCAFFOLD.yaml
# §1.1–§1.6; every setup_api_calls chain drives empty-DB -> the described state
# using only §1.5 endpoints. All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: energy_savings_estimated_vs_verified
        grounds:
          - calculations.annual_energy_savings
          - entities.Job.fields.estimated_annual_savings_kwh
          - entities.Job.fields.verified_annual_savings_kwh
          - state_machines.Job.verification_status_PENDING_to_verification_status_PASSED
        distinguishing_aspect: |
          annual_energy_savings ESTIMATED (bottom-up sum of ScopeItem.estimated_savings_kwh)
          and VERIFIED (top-down from measured CFM50 reduction) resolve to different kWh on the
          Job energy domain: 1200 vs 900 — a dual-variant on the Job/DiagnosticTest domain.
        test_recipe:
          setup:
            - "A UTILITY job with one APPROVED-then-INSTALLED attic scope item whose estimated_savings_kwh is 1200"
            - "install complete; baseline blower-door 3000 CFM50 by auditor-alice, post 2400 CFM50 by auditor-bob"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "1 Elm St", year_built: 1962, conditioned_area_sqft: 1500, foundation_type: "CRAWLSPACE", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 300000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/audits"
              payload: { job_id: "${job_id}" }
              as: Auditor
              as_user_id: "auditor-alice"
              captures: { audit_id: $.data.id }
            - call: "POST /weatherization/scope-items"
              payload: { job_id: "${job_id}", audit_id: "${audit_id}", category: "ATTIC_INSULATION", area_sqft: 1000, target_r_value: 38, estimated_cost_cents: 300000, estimated_savings_kwh: 1200 }
              as: Auditor
              as_user_id: "auditor-alice"
              captures: { scope_id: $.data.id }
            - call: "POST /weatherization/audits/${audit_id}/submit"
              payload: {}
              as: Auditor
              as_user_id: "auditor-alice"
            - call: "POST /weatherization/audits/${audit_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/crews"
              payload: { name: "Crew A", crew_size: 3, skills: ["ATTIC_INSULATION"], capacity_days: 30 }
              as: ProgramAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /weatherization/crew-assignments"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", scheduled_start_date: "2026-06-01T00:00:00Z", scheduled_end_date: "2026-06-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope_id}/mark-installed"
              payload: { achieved_r_value: 38, actual_cost_cents: 300000 }
              as: Installer
            - call: "POST /weatherization/jobs/${job_id}/complete-install"
              payload: {}
              as: ProgramAdmin
            - call: "POST /weatherization/diagnostic-tests"
              payload: { job_id: "${job_id}", kind: "BLOWER_DOOR", stage: "BASELINE", cfm_measured: 3000 }
              as: Auditor
              as_user_id: "auditor-alice"
              captures: { base_test_id: $.data.id }
            - call: "POST /weatherization/diagnostic-tests"
              payload: { job_id: "${job_id}", kind: "BLOWER_DOOR", stage: "POST", cfm_measured: 2400, baseline_test_id: "${base_test_id}" }
              as: Auditor
              as_user_id: "auditor-bob"
              captures: { post_test_id: $.data.id }
          trigger:
            - call: "POST /weatherization/jobs/${job_id}/verify"
              payload: { post_test_id: "${post_test_id}" }
              as: Auditor
              as_user_id: "auditor-bob"
          assert:
            - "Job.${job_id}.verification_status == PASSED"
            - "Job.${job_id}.estimated_annual_savings_kwh == 1200"
            - "Job.${job_id}.verified_annual_savings_kwh == 900"
            - "Job.${job_id}.estimated_annual_savings_kwh != Job.${job_id}.verified_annual_savings_kwh"

      - name: rebate_provisional_vs_finalized
        grounds:
          - calculations.rebate_amount
          - entities.RebateClaim.fields.provisional_amount_cents
          - entities.RebateClaim.fields.finalized_amount_cents
          - state_machines.RebateClaim.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          rebate_amount PROVISIONAL (tier from target_r_value=38 -> TIER2 rate 90) and FINALIZED
          (tier from achieved_r_value=25 -> TIER1 rate 50) resolve to different cents on the
          RebateClaim domain: 90000 vs 50000 — a dual-variant on a different entity from energy savings.
        test_recipe:
          setup:
            - "An attic scope (1000 sqft, target R38) INSTALLED at achieved R25; a DRAFT rebate claim with provisional 90000"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "2 Oak St", year_built: 1975, conditioned_area_sqft: 1800, foundation_type: "BASEMENT", heating_fuel_type: "ELECTRIC" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 300000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/audits"
              payload: { job_id: "${job_id}" }
              as: Auditor
              captures: { audit_id: $.data.id }
            - call: "POST /weatherization/scope-items"
              payload: { job_id: "${job_id}", audit_id: "${audit_id}", category: "ATTIC_INSULATION", area_sqft: 1000, target_r_value: 38, estimated_cost_cents: 300000, estimated_savings_kwh: 1000 }
              as: Auditor
              captures: { scope_id: $.data.id }
            - call: "POST /weatherization/audits/${audit_id}/submit"
              payload: {}
              as: Auditor
            - call: "POST /weatherization/audits/${audit_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/crews"
              payload: { name: "Crew B", crew_size: 2, skills: ["ATTIC_INSULATION"], capacity_days: 30 }
              as: ProgramAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /weatherization/crew-assignments"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", scheduled_start_date: "2026-06-01T00:00:00Z", scheduled_end_date: "2026-06-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope_id}/mark-installed"
              payload: { achieved_r_value: 25, actual_cost_cents: 320000 }
              as: Installer
            - call: "POST /weatherization/rebate-claims"
              payload: { job_id: "${job_id}", scope_item_id: "${scope_id}" }
              as: ProgramAdmin
              captures: { rebate_id: $.data.id }
          trigger:
            - call: "POST /weatherization/rebate-claims/${rebate_id}/submit"
              payload: {}
              as: ProgramAdmin
          assert:
            - "RebateClaim.${rebate_id}.provisional_amount_cents == 90000"
            - "RebateClaim.${rebate_id}.finalized_amount_cents == 50000"
            - "RebateClaim.${rebate_id}.provisional_amount_cents != RebateClaim.${rebate_id}.finalized_amount_cents"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rebate_tiered_nested_min_mode_a
        grounds:
          - calculations.rebate_amount
          - entities.RebateClaim.fields.provisional_amount_cents
          - entities.ScopeItem.fields.category
        distinguishing_aspect: |
          Mode (a): rebate_amount takes >=3 inputs (category, R-tier, area) with tiered-rate
          selection nested under min(raw, MEASURE_CAP_CENTS). WALL_INSULATION at R50 (TIER3 rate
          100) x 3000 sqft = 300000 raw, capped to 200000 — non-linear interaction, not a flat product.
        test_recipe:
          setup:
            - "A wall-insulation scope (3000 sqft, target R50) with no install yet; a rebate claim created against it"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "3 Pine St", year_built: 1950, conditioned_area_sqft: 2400, foundation_type: "SLAB", heating_fuel_type: "OIL" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 500000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/audits"
              payload: { job_id: "${job_id}" }
              as: Auditor
              captures: { audit_id: $.data.id }
            - call: "POST /weatherization/scope-items"
              payload: { job_id: "${job_id}", audit_id: "${audit_id}", category: "WALL_INSULATION", area_sqft: 3000, target_r_value: 50, estimated_cost_cents: 500000, estimated_savings_kwh: 900 }
              as: Auditor
              captures: { scope_id: $.data.id }
          trigger:
            - call: "POST /weatherization/rebate-claims"
              payload: { job_id: "${job_id}", scope_item_id: "${scope_id}" }
              as: ProgramAdmin
              captures: { rebate_id: $.data.id }
          assert:
            - "RebateClaim.${rebate_id}.provisional_amount_cents == 200000"

      - name: tax_credit_25c_per_line_rounding_mode_b
        grounds:
          - calculations.tax_credit_25c
          - entities.Job.fields.tax_credit_cents
          - state_machines.ScopeItem.APPROVED_to_INSTALLED
        distinguishing_aspect: |
          Mode (b): 25C rounds EACH qualifying line to whole dollars before summing. Two attic
          items at actual_cost 33500 give 0.30*335.00=$100.50 -> $101/line -> sum 20200 cents,
          where sum-then-round would give 20100; the scaffold pins per-line rounding, so 20200.
        test_recipe:
          setup:
            - "A job with two APPROVED attic scope items; the first already INSTALLED at actual_cost 33500"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "4 Ash St", year_built: 1968, conditioned_area_sqft: 2000, foundation_type: "BASEMENT", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 300000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/audits"
              payload: { job_id: "${job_id}" }
              as: Auditor
              captures: { audit_id: $.data.id }
            - call: "POST /weatherization/scope-items"
              payload: { job_id: "${job_id}", audit_id: "${audit_id}", category: "ATTIC_INSULATION", area_sqft: 1000, target_r_value: 30, estimated_cost_cents: 100000, estimated_savings_kwh: 500 }
              as: Auditor
              captures: { scope1_id: $.data.id }
            - call: "POST /weatherization/scope-items"
              payload: { job_id: "${job_id}", audit_id: "${audit_id}", category: "ATTIC_INSULATION", area_sqft: 1000, target_r_value: 30, estimated_cost_cents: 100000, estimated_savings_kwh: 500 }
              as: Auditor
              captures: { scope2_id: $.data.id }
            - call: "POST /weatherization/audits/${audit_id}/submit"
              payload: {}
              as: Auditor
            - call: "POST /weatherization/audits/${audit_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope1_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope2_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/crews"
              payload: { name: "Crew C", crew_size: 4, skills: ["ATTIC_INSULATION"], capacity_days: 30 }
              as: ProgramAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /weatherization/crew-assignments"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", scheduled_start_date: "2026-06-01T00:00:00Z", scheduled_end_date: "2026-06-06T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope1_id}/mark-installed"
              payload: { achieved_r_value: 30, actual_cost_cents: 33500 }
              as: Installer
          trigger:
            - call: "POST /weatherization/scope-items/${scope2_id}/mark-installed"
              payload: { achieved_r_value: 30, actual_cost_cents: 33500 }
              as: Installer
          assert:
            - "Job.${job_id}.tax_credit_cents == 20200"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: energy_audit_reject_resubmit_cycle
        grounds:
          - state_machines.EnergyAudit.SUBMITTED_to_REJECTED
          - state_machines.EnergyAudit.REJECTED_to_SUBMITTED
          - entities.EnergyAudit.fields.status
        distinguishing_aspect: |
          EnergyAudit is cyclic: SUBMITTED -> REJECTED (decide REJECT) -> SUBMITTED (submit again),
          re-entering a prior state — not a forward-only pipeline.
        test_recipe:
          setup:
            - "An audit with one scope item, submitted then rejected (status REJECTED)"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "5 Fir St", year_built: 1980, conditioned_area_sqft: 1600, foundation_type: "CRAWLSPACE", heating_fuel_type: "PROPANE" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/audits"
              payload: { job_id: "${job_id}" }
              as: Auditor
              captures: { audit_id: $.data.id }
            - call: "POST /weatherization/scope-items"
              payload: { job_id: "${job_id}", audit_id: "${audit_id}", category: "AIR_SEALING", area_sqft: 800, target_r_value: 0, estimated_cost_cents: 60000, estimated_savings_kwh: 400 }
              as: Auditor
              captures: { scope_id: $.data.id }
            - call: "POST /weatherization/audits/${audit_id}/submit"
              payload: {}
              as: Auditor
            - call: "POST /weatherization/audits/${audit_id}/decide"
              payload: { decision: "REJECT" }
              as: ProgramAdmin
          trigger:
            - call: "POST /weatherization/audits/${audit_id}/submit"
              payload: {}
              as: Auditor
          assert:
            - "EnergyAudit.${audit_id}.status == SUBMITTED"

      - name: job_parallel_install_and_verification_dimensions
        grounds:
          - state_machines.Job.install_status_SCHEDULED_to_install_status_INSTALLED
          - entities.Job.fields.install_status
          - entities.Job.fields.verification_status
        distinguishing_aspect: |
          Job carries two independent dimensions on one row: complete-install drives
          install_status to INSTALLED while verification_status stays PENDING (verify not yet run) —
          the dimensions advance under different triggers, a parallel (non-linear) shape.
        test_recipe:
          setup:
            - "A job with one INSTALLED attic scope and a scheduled crew; install not yet completed, never verified"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "6 Birch St", year_built: 1971, conditioned_area_sqft: 1700, foundation_type: "SLAB", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 100000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/audits"
              payload: { job_id: "${job_id}" }
              as: Auditor
              captures: { audit_id: $.data.id }
            - call: "POST /weatherization/scope-items"
              payload: { job_id: "${job_id}", audit_id: "${audit_id}", category: "ATTIC_INSULATION", area_sqft: 1000, target_r_value: 30, estimated_cost_cents: 100000, estimated_savings_kwh: 500 }
              as: Auditor
              captures: { scope_id: $.data.id }
            - call: "POST /weatherization/audits/${audit_id}/submit"
              payload: {}
              as: Auditor
            - call: "POST /weatherization/audits/${audit_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/crews"
              payload: { name: "Crew D", crew_size: 3, skills: ["ATTIC_INSULATION"], capacity_days: 20 }
              as: ProgramAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /weatherization/crew-assignments"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", scheduled_start_date: "2026-06-01T00:00:00Z", scheduled_end_date: "2026-06-04T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope_id}/mark-installed"
              payload: { achieved_r_value: 30, actual_cost_cents: 100000 }
              as: Installer
          trigger:
            - call: "POST /weatherization/jobs/${job_id}/complete-install"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Job.${job_id}.install_status == INSTALLED"
            - "Job.${job_id}.verification_status == PENDING"
            - "Job.${job_id}.job_status == ACTIVE"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: verify_fail_cascade_scope_rebate_budget_depth3
        grounds:
          - state_machines.Job.verification_status_PENDING_to_verification_status_FAILED
          - state_machines.ScopeItem.INSTALLED_to_FAILED_VERIFICATION
          - state_machines.RebateClaim.APPROVED_to_VOIDED
          - entities.Job.fields.approved_rebate_total_cents
        distinguishing_aspect: |
          verify FAIL is a depth-3 chain of caused links: Job.verification_status=FAILED forces the
          INSTALLED ScopeItem -> FAILED_VERIFICATION (link1), which forces its APPROVED RebateClaim
          -> VOIDED (link2), which decrements Job.approved_rebate_total_cents 90000 -> 0 (link3).
        test_recipe:
          setup:
            - "Attic scope INSTALLED (achieved R30); rebate APPROVED at finalized 90000 (Job.approved_rebate_total 90000)"
            - "baseline blower-door 3000 by auditor-alice, post 2500 by auditor-bob (reduction 0.1667 < 0.20 -> FAIL)"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
              payload: { address: "7 Cedar St", year_built: 1959, conditioned_area_sqft: 1500, foundation_type: "CRAWLSPACE", heating_fuel_type: "GAS" }
              as: ProgramAdmin
              captures: { dwelling_id: $.data.id }
            - call: "POST /weatherization/jobs"
              payload: { dwelling_id: "${dwelling_id}", program_track: "UTILITY", rebate_budget_cap_cents: 300000 }
              as: ProgramAdmin
              captures: { job_id: $.data.id }
            - call: "POST /weatherization/audits"
              payload: { job_id: "${job_id}" }
              as: Auditor
              as_user_id: "auditor-alice"
              captures: { audit_id: $.data.id }
            - call: "POST /weatherization/scope-items"
              payload: { job_id: "${job_id}", audit_id: "${audit_id}", category: "ATTIC_INSULATION", area_sqft: 1000, target_r_value: 30, estimated_cost_cents: 100000, estimated_savings_kwh: 800 }
              as: Auditor
              as_user_id: "auditor-alice"
              captures: { scope_id: $.data.id }
            - call: "POST /weatherization/audits/${audit_id}/submit"
              payload: {}
              as: Auditor
              as_user_id: "auditor-alice"
            - call: "POST /weatherization/audits/${audit_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/crews"
              payload: { name: "Crew E", crew_size: 3, skills: ["ATTIC_INSULATION"], capacity_days: 20 }
              as: ProgramAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /weatherization/crew-assignments"
              payload: { job_id: "${job_id}", crew_id: "${crew_id}", scheduled_start_date: "2026-06-01T00:00:00Z", scheduled_end_date: "2026-06-04T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /weatherization/scope-items/${scope_id}/mark-installed"
              payload: { achieved_r_value: 30, actual_cost_cents: 100000 }
              as: Installer
            - call: "POST /weatherization/jobs/${job_id}/complete-install"
              payload: {}
              as: ProgramAdmin
            - call: "POST /weatherization/rebate-claims"
              payload: { job_id: "${job_id}", scope_item_id: "${scope_id}" }
              as: ProgramAdmin
              captures: { rebate_id: $.data.id }
            - call: "POST /weatherization/rebate-claims/${rebate_id}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /weatherization/rebate-claims/${rebate_id}/decide"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /weatherization/diagnostic-tests"
              payload: { job_id: "${job_id}", kind: "BLOWER_DOOR", stage: "BASELINE", cfm_measured: 3000 }
              as: Auditor
              as_user_id: "auditor-alice"
              captures: { base_test_id: $.data.id }
            - call: "POST /weatherization/diagnostic-tests"
              payload: { job_id: "${job_id}", kind: "BLOWER_DOOR", stage: "POST", cfm_measured: 2500, baseline_test_id: "${base_test_id}" }
              as: Auditor
              as_user_id: "auditor-bob"
              captures: { post_test_id: $.data.id }
          trigger:
            - call: "POST /weatherization/jobs/${job_id}/verify"
              payload: { post_test_id: "${post_test_id}" }
              as: Auditor
              as_user_id: "auditor-bob"
          assert:
            - "Job.${job_id}.verification_status == FAILED"
            - "ScopeItem.${scope_id}.status == FAILED_VERIFICATION"
            - "RebateClaim.${rebate_id}.status == VOIDED"
            - "Job.${job_id}.approved_rebate_total_cents == 0"

      - name: job_cancel_cascade_scope_rebate_depth2
        grounds:
          - state_machines.Job.job_status_ACTIVE_to_job_status_CANCELLED
          - state_machines.ScopeItem.INSTALLED_to_CANCELLED
          - state_machines.RebateClaim.APPROVED_to_VOIDED
          - entities.Job.fields.approved_rebate_total_cents
        distinguishing_aspect: |
          Job cancel is a depth-2 chain from a DIFFERENT trigger than verify FAIL: job_status=CANCELLED
          forces the INSTALLED ScopeItem -> CANCELLED (link1), which forces its APPROVED RebateClaim
          -> VOIDED (link2), returning Job.approved_rebate_total_cents 90000 -> 0.
        test_recipe:
          setup:
            - "Attic scope INSTALLED; rebate APPROVED at finalized 90000 (Job.approved_rebate_total 90000); no verification run"
          setup_api_calls:
            - call: "POST /weatherization/dwellings"
