  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: video_request_submit_gated_on_agency_status_not_on_its_own_state
        grounds:
          - validations[priority=9]
          - errors.ERR_AGENCY_NOT_ONBOARDED
          - state_machines.Agency.status.ONBOARDED_to_SUSPENDED
          - state_machines.VideoRequest.lifecycle_state.SOLICITING_to_WITHDRAWN
          - endpoints[POST /neighborhood-safety/agencies/{id}/status-change]
          - entities.Agency.fields.status
        distinguishing_aspect: |
          Entity pair (VideoRequest, Agency): the guard lives two hops from the row being
          written — submit reads the status of the Agency that owns the RequestArea that backs
          the VideoRequest. Two agencies are built to be byte-identical in shape (same officer
          duty_role, same device count, same radius, same footage window, same justification),
          and the ONLY difference is that one has been SUSPENDED, so the divergence cannot be
          explained by anything on the VideoRequest itself. The suspension also drives the
          enforcement cascade that leaves VR1 in WITHDRAWN and its area INVALIDATED, which means
          three rules (9 state, 13 state, 14 state) are simultaneously violated and the
          cross-entity one at priority 9 must be the reported error.
        test_recipe:
          setup:
            - "Clock at 2026-08-12T00:00:00Z."
            - "Agency A1 ONBOARDED with min_device_threshold 3; officer O1 (REQUESTER); three residents with one camera each at (0,10), (0,20), (0,30); RequestArea (0,0) radius 500 over 2026-08-08T00:00:00Z..2026-08-08T06:00:00Z LOCKED with eligible_device_count 3; VideoRequest VR1 created and justified."
