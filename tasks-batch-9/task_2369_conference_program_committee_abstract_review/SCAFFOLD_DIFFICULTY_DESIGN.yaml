              as: Reviewer
              as_user_id: "${mb_r3_id}"
          assert:
            - "Review.${rv_rui_id}.expertise_match_score == 0.5000"
            - "Review.${rv_rui_id}.status == DECLINED"
            - "Review.${rv_nadia_id}.expertise_match_score == 1.0000"
