            - "Enrollment.${enr_id}.refunded_cents == 80000 (SCHEDULE_TIER 100% of 85000-5000)"
            - "Student.${stu_id}.wallet_balance_cents == 80000 (link 3b, single REFUND_CREDIT entry)"

