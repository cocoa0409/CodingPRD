            - call: "POST /fare-weeks"
              payload: { rider_id: "${r11}", week_start_date: "2026-06-01", zone_code: "ZONE_Z" }
              as: Rider
              as_user_id: "${r11}"
              captures: { w1: $.data.id }
            - call: "POST /taps"
              payload: { rider_id: "${r11}", fare_week_id: "${w1}", funding_source_id: "${f11}", tapped_at: "2026-06-01T08:00:00Z" }
