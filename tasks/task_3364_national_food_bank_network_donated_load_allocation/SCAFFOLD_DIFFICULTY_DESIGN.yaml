# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3364_national_food_bank_network_donated_load_allocation
#
# Cross-reference of the nine §0.5 Difficulty Rules against the §1.1–§1.7 surface
# of SCAFFOLD.yaml. Two instances per rule (18 total). Every ${var} is bound by a
# `captures:` block earlier in the same instance; every call resolves to a §1.5
# endpoint; every asserted number is a literal computed from the §1.3 formulas.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: freight_provisional_vs_final_on_awarded_load
        grounds:
          - calculations.freight_subsidy_cents
          - state_machines.DonatedLoad.BIDDING_to_AWARDED
          - state_machines.DonatedLoad.AWARDED_to_BIDDING
        distinguishing_aspect: |
          The provisional variant (detour_miles pinned to 0 at award) and the final variant
          (detour_miles 60 at the freight decision) produce different subsidies for the same
          620-mile load — 103230 cents provisional versus 113220 cents final — on the DonatedLoad
          domain, and the stored freight_estimate_cents keeps the provisional value.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Agreement AGR (DRY_GOODS, pool 500000 cents) is ACTIVE."
            - "Load L1: 40000 lbs DRY, 620 miles, lot LOT-77, POSTED then BIDDING."
            - "Member M1 (OH, population 250000, LOCAL transport, cannot self-transport) is CERTIFIED with a 100000-share grant and holds one SUBMITTED bid of 400 shares on L1."
            - "L1 is AWARDED to M1 with freight_decision PENDING and freight_estimate_cents 114700."
          setup_api_calls:
            - &clk_sep
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - &agr_dry
              call: "POST /network/donor-agreements"
              payload: { donor_name: "Midwest Mills Co", donor_type: "MANUFACTURER", product_category: "DRY_GOODS", committed_lbs: 500000, freight_subsidy_pool_cents: 500000 }
              as: NetworkAdmin
              captures: { agr: $.data.id }
            - &agr_dry_act
              call: "POST /network/donor-agreements/${agr}/activate"
              payload: {}
              as: NetworkAdmin
            - &load_l1
              call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr}", product_category: "DRY_GOODS", storage_type: "DRY", weight_lbs: 40000, lot_code: "LOT-77", origin_zip: "44101", destination_region: "MIDWEST", distance_miles: 620 }
              as: NetworkAdmin
              captures: { l1: $.data.id, l1_v0: $.data.version }
            - &load_l1_post
              call: "POST /network/loads/${l1}/post"
              payload: {}
              as: NetworkAdmin
              captures: { l1_v1: $.data.version }
            - &mem_m1_certified
              call: "POST /network/members"
              payload: { name: "Greater Cleveland Food Bank", state_code: "OH", food_insecure_population: 250000, storage_capacity_lbs: 200000, refrigerated_capacity_lbs: 50000, transport_ability: "LOCAL" }
              as: NetworkAdmin
              captures: { m1: $.data.id }
            - &audit_m1_pass
              call: "POST /network/audits"
              payload: { member_id: "${m1}", audit_type: "COMPREHENSIVE", storage_score: 85, distribution_score: 85, reporting_score: 85 }
              as: NetworkAdmin
              as_user_id: "ops_admin_1"
              captures: { aud1: $.data.id }
            - &audit_m1_done
              call: "POST /network/audits/${aud1}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "auditor_7"
            - &certify_m1
              call: "POST /network/members/${m1}/certify"
              payload: {}
              as: NetworkAdmin
              captures: { m1_v: $.data.version }
            - &grant_m1_solo
              call: "POST /network/share-ledger/grants"
              payload: { member_id: "${m1}", epoch: "2026-09", expected_member_version: "${m1_v}" }
              as: NetworkAdmin
              captures: { g1: $.data.id }
            - &bid_l1_m1_400
              call: "POST /network/loads/${l1}/bids"
              payload: { member_id: "${m1}", shares_offered: 400, preference_rank: 1, can_self_transport: false, expected_load_version: "${l1_v1}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { bid_l1: $.data.id }
            - &award_l1
              call: "POST /network/loads/${l1}/award"
              payload: {}
              as: NetworkAdmin
              captures: { l1_v2: $.data.version }
          trigger:
            - call: "POST /network/loads/${l1}/freight-decision"
              payload: { decision: "COVERED", detour_miles: 60 }
              as: NetworkAdmin
              captures: { l1_v3: $.data.version }
          assert:
            - "the load's provisional freight_estimate_cents read before the trigger == 114700 (= 620 * 185, detour pinned to 0)"
            - "after the trigger DonatedLoad.${l1}.freight_subsidy_cents == 113220 (= min(ceil(125800*0.75) + ceil(125800*0.15), 500000, 250000))"
            - "after the trigger DonatedLoad.${l1}.member_freight_due_cents == 12580 (= 125800 - 113220)"
            - "DonatedLoad.${l1}.freight_decision == COVERED and DonatedAgreement.${agr}.freight_subsidy_used_cents == 113220"
            - "the provisional and final values differ: 114700 != 125800 for identical distance_miles, proving the detour-bearing final variant diverges from the detour-free provisional variant"

      - name: meal_equivalency_per_load_vs_sum_then_divide
        grounds:
          - calculations.meal_equivalency_total
          - endpoints.GET_/network/donor-agreements/{id}/poundage-summary
        distinguishing_aspect: |
          On the DonorAgreement reporting domain the canonical per-load rounding variant yields
          1249 meals while the sum-then-divide variant yields 1250 meals for the identical two
          delivered loads (1000 lbs + 500 lbs at factor 1.2), so the two valid rounding orders
          produce different donor-reported numbers.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Agreement AGR2 (DRY_GOODS, factor 1.2) is ACTIVE."
            - "Member M1 is CERTIFIED, self-transports, and has delivered two loads of 1000 lbs and 500 lbs under AGR2."
          setup_api_calls:
            - *clk_sep
            - &agr_meal
              call: "POST /network/donor-agreements"
              payload: { donor_name: "Prairie Pantry Retail", donor_type: "RETAILER", product_category: "DRY_GOODS", committed_lbs: 200000, freight_subsidy_pool_cents: 100000, meal_equivalency_factor: 1.2 }
              as: NetworkAdmin
              captures: { agr2: $.data.id }
            - call: "POST /network/donor-agreements/${agr2}/activate"
              payload: {}
              as: NetworkAdmin
            - *mem_m1_certified
            - *audit_m1_pass
            - *audit_m1_done
            - *certify_m1
            - &load_small_1000
              call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr2}", product_category: "DRY_GOODS", storage_type: "DRY", weight_lbs: 1000, lot_code: "LOT-1000", origin_zip: "50309", destination_region: "MIDWEST", distance_miles: 120 }
              as: NetworkAdmin
              captures: { s1: $.data.id }
            - call: "POST /network/loads/${s1}/post"
              payload: {}
              as: NetworkAdmin
              captures: { s1_v: $.data.version }
            - &load_small_500
              call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr2}", product_category: "DRY_GOODS", storage_type: "DRY", weight_lbs: 500, lot_code: "LOT-500", origin_zip: "50309", destination_region: "MIDWEST", distance_miles: 120 }
              as: NetworkAdmin
              captures: { s2: $.data.id }
            - call: "POST /network/loads/${s2}/post"
              payload: {}
              as: NetworkAdmin
              captures: { s2_v: $.data.version }
            - call: "POST /network/loads/${s1}/bids"
              payload: { member_id: "${m1}", shares_offered: 100, preference_rank: 1, can_self_transport: true, expected_load_version: "${s1_v}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
            - call: "POST /network/loads/${s1}/award"
              payload: {}
              as: NetworkAdmin
              captures: { s1_a: $.data.version }
            - call: "POST /network/loads/${s1}/freight-decision"
              payload: { decision: "COVERED" }
              as: NetworkAdmin
              captures: { s1_f: $.data.version }
            - call: "POST /network/loads/${s1}/dispatch"
              payload: { delivery_window_start: "2026-09-03T08:00:00Z", delivery_window_end: "2026-09-03T12:00:00Z" }
              as: NetworkAdmin
            - call: "POST /network/loads/${s1}/deliver"
              payload: {}
              as: NetworkAdmin
            - call: "POST /network/loads/${s2}/bids"
              payload: { member_id: "${m1}", shares_offered: 100, preference_rank: 1, can_self_transport: true, expected_load_version: "${s2_v}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
            - call: "POST /network/loads/${s2}/award"
              payload: {}
              as: NetworkAdmin
              captures: { s2_a: $.data.version }
            - call: "POST /network/loads/${s2}/freight-decision"
              payload: { decision: "COVERED" }
              as: NetworkAdmin
              captures: { s2_f: $.data.version }
            - call: "POST /network/loads/${s2}/dispatch"
              payload: { delivery_window_start: "2026-09-04T08:00:00Z", delivery_window_end: "2026-09-04T12:00:00Z" }
              as: NetworkAdmin
            - call: "POST /network/loads/${s2}/deliver"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "GET /network/donor-agreements/${agr2}/poundage-summary"
              payload: {}
              as: NetworkAdmin
              captures: { canon_meals: $.data.total_meals, canon_lbs: $.data.total_lbs, canon_loads: $.data.delivered_load_count }
            - call: "GET /network/donor-agreements/${agr2}/poundage-summary"
              payload: { rounding_basis: "SUM_THEN_DIVIDE" }
              as: NetworkAdmin
              captures: { alt_meals: $.data.total_meals }
          assert:
            - "the canonical summary returns ${canon_lbs} == 1500, ${canon_loads} == 2 and ${canon_meals} == 1249 (= floor(1000/1.2) + floor(500/1.2) = 833 + 416)"
            - "the SUM_THEN_DIVIDE summary returns ${alt_meals} == 1250 (= floor(1500/1.2))"
            - "the two variants diverge for identical loads: 1249 != 1250"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: freight_subsidy_nested_caps_on_remote_member
        grounds:
          - calculations.freight_subsidy_cents
          - validations[priority=32]
          - endpoints.POST_/network/loads/{id}/freight-decision
        distinguishing_aspect: |
          Mode (a): the freight formula takes four inputs (distance, transport_ability,
          can_self_transport, pool_remaining) and applies a conditional transport tier, a
          remote uplift gated on ability AND self-transport, then a nested
          min(raw + uplift, pool_remaining, MAX_SUBSIDY_PER_LOAD_CENTS) — the absolute cap binds
          first for a NONE-transport member at 1700 miles.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Agreement AGR3 (pool 500000 cents) is ACTIVE."
            - "Member M1 (NONE transport, cannot self-transport) is CERTIFIED with a 100000-share grant and has been awarded load L3 (40000 lbs, 1700 miles) with freight_decision PENDING."
          setup_api_calls:
            - *clk_sep
            - &agr_big_pool
              call: "POST /network/donor-agreements"
              payload: { donor_name: "Coastal Growers Alliance", donor_type: "DISTRIBUTOR", product_category: "DRY_GOODS", committed_lbs: 900000, freight_subsidy_pool_cents: 500000 }
              as: NetworkAdmin
              captures: { agr3: $.data.id }
            - call: "POST /network/donor-agreements/${agr3}/activate"
              payload: {}
              as: NetworkAdmin
            - &load_l3
              call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr3}", product_category: "DRY_GOODS", storage_type: "DRY", weight_lbs: 40000, lot_code: "LOT-1700", origin_zip: "97201", destination_region: "WEST", distance_miles: 1700 }
              as: NetworkAdmin
              captures: { l3: $.data.id }
            - call: "POST /network/loads/${l3}/post"
              payload: {}
              as: NetworkAdmin
              captures: { l3_v: $.data.version }
            - &mem_m1_remote
              call: "POST /network/members"
              payload: { name: "Rural Harvest Food Bank", state_code: "MT", food_insecure_population: 250000, storage_capacity_lbs: 200000, refrigerated_capacity_lbs: 50000, transport_ability: "NONE" }
              as: NetworkAdmin
              captures: { m1: $.data.id }
            - call: "POST /network/audits"
              payload: { member_id: "${m1}", audit_type: "COMPREHENSIVE", storage_score: 85, distribution_score: 85, reporting_score: 85 }
              as: NetworkAdmin
              as_user_id: "ops_admin_1"
              captures: { aud1: $.data.id }
            - call: "POST /network/audits/${aud1}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "auditor_7"
            - call: "POST /network/members/${m1}/certify"
              payload: {}
              as: NetworkAdmin
              captures: { m1_v: $.data.version }
            - call: "POST /network/share-ledger/grants"
              payload: { member_id: "${m1}", epoch: "2026-09", expected_member_version: "${m1_v}" }
              as: NetworkAdmin
              captures: { g1: $.data.id }
            - call: "POST /network/loads/${l3}/bids"
              payload: { member_id: "${m1}", shares_offered: 400, preference_rank: 1, can_self_transport: false, expected_load_version: "${l3_v}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { bid_l3: $.data.id }
            - call: "POST /network/loads/${l3}/award"
              payload: {}
              as: NetworkAdmin
              captures: { l3_a: $.data.version }
          trigger:
            - call: "POST /network/loads/${l3}/freight-decision"
              payload: { decision: "COVERED" }
              as: NetworkAdmin
          assert:
            - "DonatedLoad.${l3}.freight_subsidy_cents == 250000 — the MAX_SUBSIDY_PER_LOAD_CENTS cap binds because raw + uplift = ceil(314500*1.00) + ceil(314500*0.15) = 314500 + 47175 = 361675 exceeds it"
            - "DonatedLoad.${l3}.member_freight_due_cents == 64500 (= 1700*185 - 250000)"
            - "DonatedAgreement.${agr3}.freight_subsidy_used_cents == 250000 and freight_decision == COVERED"
            - "the same load with distance_miles 400 and LOCAL transport would have produced min(55500 + 11100, pool, 250000) = 66600, so the nested min selects the absolute cap only at long haul"

      - name: share_grant_evaluation_order_frozen_demands
        grounds:
          - calculations.share_grant_allocation
          - calculations.share_balance_recompute
          - endpoints.POST_/network/share-ledger/grants
        distinguishing_aspect: |
          Mode (c): the grant depends on total network demand which itself includes the member
          being granted, so the evaluation order must be pinned — with demands frozen before any
          grant is applied the two-member split is 71429 / 28571, and applying M1's grant first
          must not change M2's amount.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Members M1 (population 250000) and M2 (population 100000) are both CERTIFIED with no delivered loads and no prior grants."
          setup_api_calls:
            - *clk_sep
            - &mem_m1_oh
              call: "POST /network/members"
              payload: { name: "Greater Cleveland Food Bank", state_code: "OH", food_insecure_population: 250000, storage_capacity_lbs: 200000, refrigerated_capacity_lbs: 50000, transport_ability: "LOCAL" }
              as: NetworkAdmin
              captures: { m1: $.data.id }
            - call: "POST /network/audits"
              payload: { member_id: "${m1}", audit_type: "COMPREHENSIVE", storage_score: 85, distribution_score: 85, reporting_score: 85 }
              as: NetworkAdmin
              as_user_id: "ops_admin_1"
              captures: { aud1: $.data.id }
            - call: "POST /network/audits/${aud1}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "auditor_7"
            - call: "POST /network/members/${m1}/certify"
              payload: {}
              as: NetworkAdmin
              captures: { m1_v: $.data.version }
            - &mem_m2_ia
              call: "POST /network/members"
              payload: { name: "Food Bank of Iowa", state_code: "IA", food_insecure_population: 100000, storage_capacity_lbs: 150000, refrigerated_capacity_lbs: 30000, transport_ability: "REGIONAL" }
              as: NetworkAdmin
              captures: { m2: $.data.id }
            - call: "POST /network/audits"
              payload: { member_id: "${m2}", audit_type: "COMPREHENSIVE", storage_score: 85, distribution_score: 85, reporting_score: 85 }
              as: NetworkAdmin
              as_user_id: "ops_admin_2"
              captures: { aud2: $.data.id }
            - call: "POST /network/audits/${aud2}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "auditor_7"
            - call: "POST /network/members/${m2}/certify"
              payload: {}
              as: NetworkAdmin
              captures: { m2_v: $.data.version }
          trigger:
            - call: "POST /network/share-ledger/grants"
              payload: { member_id: "${m1}", epoch: "2026-09", expected_member_version: "${m1_v}" }
              as: NetworkAdmin
              captures: { g1: $.data.id, g1_amt: $.data.amount, g1_bal: $.data.balance_after }
            - call: "POST /network/share-ledger/grants"
              payload: { member_id: "${m2}", epoch: "2026-09", expected_member_version: "${m2_v}" }
              as: NetworkAdmin
              captures: { g2: $.data.id, g2_amt: $.data.amount }
          assert:
            - "the M1 grant amount ${g1_amt} == 71429 (= floor(100000*30000/42000) + 1 residual share, M1 has the larger fractional part 0.5714)"
            - "the M2 grant amount ${g2_amt} == 28571 (= floor(100000*12000/42000))"
            - "the two grants sum to exactly 100000, the epoch pool, with no drift"
            - "MemberFoodBank.${m1}.share_balance == 71429 and MemberFoodBank.${m2}.share_balance == 28571 after both grants, proving M1's grant was not folded into M2's demand"
            - "MemberFoodBank.${m1}.last_grant_epoch == \"2026-09\" and MemberFoodBank.${m2}.last_grant_epoch == \"2026-09\""

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: donated_load_parallel_dimensions_and_award_cycle
        grounds:
          - state_machines.DonatedLoad.AWARDED_to_BIDDING
          - state_machines.DonatedLoad.CLEAR_to_HELD
          - state_machines.DonatedLoad.HELD_to_CLEAR
          - validations[priority=20]
        distinguishing_aspect: |
          The DonatedLoad row carries two independent dimensions — status cycles AWARDED ->
          BIDDING on a declined freight decision while safety_status moves CLEAR -> HELD under a
          recall trace — so the load holds BIDDING in one dimension and HELD in the other, and the safety dimension
          blocks bidding without touching status.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Load L4 (40000 lbs, 620 miles, lot LOT-77) is AWARDED to certified member M1 (LOCAL transport, cannot self-transport) with freight_decision PENDING."
          setup_api_calls:
            - *clk_sep
            - *agr_dry
            - *agr_dry_act
            - *load_l1
            - *load_l1_post
            - *mem_m1_certified
            - *audit_m1_pass
            - *audit_m1_done
            - *certify_m1
            - *grant_m1_solo
            - *bid_l1_m1_400
            - *award_l1
          trigger:
            - call: "POST /network/loads/${l1}/freight-decision"
              payload: { decision: "DECLINED" }
              as: NetworkAdmin
              captures: { l1_v4: $.data.version }
            - call: "POST /network/recalls"
              payload: { donor_agreement_id: "${agr}", lot_code: "LOT-77", product_category: "DRY_GOODS", affected_lbs: 40000 }
              as: NetworkAdmin
              captures: { rc: $.data.id }
            - call: "POST /network/recalls/${rc}/trace"
              payload: {}
              as: NetworkAdmin
              captures: { rc_v: $.data.version }
            - call: "GET /network/loads/${l1}"
              payload: {}
              as: NetworkAdmin
              captures: { l1_v5: $.data.version }
            - call: "POST /network/loads/${l1}/bids"
              payload: { member_id: "${m1}", shares_offered: 100, preference_rank: 1, can_self_transport: false, expected_load_version: "${l1_v5}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "after the declined freight decision DonatedLoad.${l1}.status == BIDDING again (the AWARDED -> BIDDING cycle fired) with awarded_bid_id == null and freight_decision == PENDING"
            - "LoadBid.${bid_l1}.bid_status == REJECTED with rejection_reason FREIGHT_DECLINED"
            - "after the trace DonatedLoad.${l1}.status == BIDDING and DonatedLoad.${l1}.safety_status == HELD — the two dimensions moved independently"
            - "the post-recall bid attempt returns ${err} == ERR_LOAD_SAFETY_HOLD with HTTP 409, so the safety dimension gates bidding while status alone would have allowed it"
            - "ProductRecall.${rc}.recall_status == TRACING and traced_load_count == 1"

      - name: product_recall_resolved_then_reopened_cycle
        grounds:
          - state_machines.ProductRecall.OPEN_to_TRACING
          - state_machines.ProductRecall.TRACING_to_RESOLVED
          - state_machines.ProductRecall.NONE_to_REOPENED
          - calculations.recall_hold_selection
        distinguishing_aspect: |
          ProductRecall is cyclic across rows: the first recall for lot LOT-77 runs
          OPEN -> TRACING -> RESOLVED, and a second recall for the same lot opens directly in
          REOPENED and re-enters TRACING, which a linear machine could not express.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Agreement AGR5 is ACTIVE with two POSTED loads of lot LOT-77 (800 lbs) and lot LOT-88 (400 lbs)."
          setup_api_calls:
            - *clk_sep
            - &agr_recall
              call: "POST /network/donor-agreements"
              payload: { donor_name: "Great Lakes Creamery", donor_type: "MANUFACTURER", product_category: "DAIRY", committed_lbs: 300000, freight_subsidy_pool_cents: 120000 }
              as: NetworkAdmin
              captures: { agr5: $.data.id }
            - call: "POST /network/donor-agreements/${agr5}/activate"
              payload: {}
              as: NetworkAdmin
            - &load_r800
              call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr5}", product_category: "DAIRY", storage_type: "REFRIGERATED", weight_lbs: 800, lot_code: "LOT-77", origin_zip: "53202", destination_region: "MIDWEST", distance_miles: 210 }
              as: NetworkAdmin
              captures: { r800: $.data.id }
            - &load_r400
              call: "POST /network/loads"
              payload: { donor_agreement_id: "${agr5}", product_category: "DAIRY", storage_type: "REFRIGERATED", weight_lbs: 400, lot_code: "LOT-88", origin_zip: "53202", destination_region: "MIDWEST", distance_miles: 210 }
              as: NetworkAdmin
              captures: { r400: $.data.id }
          trigger:
            - call: "POST /network/recalls"
              payload: { donor_agreement_id: "${agr5}", lot_code: "LOT-77", product_category: "DAIRY", affected_lbs: 800 }
              as: NetworkAdmin
              captures: { rc1: $.data.id, rc1_status: $.data.recall_status }
            - call: "POST /network/recalls/${rc1}/trace"
              payload: {}
              as: NetworkAdmin
              captures: { rc1_traced: $.data.traced_load_count, rc1_held: $.data.held_lbs }
            - call: "POST /network/recalls/${rc1}/resolve"
              payload: {}
              as: NetworkAdmin
              captures: { rc1_final: $.data.recall_status }
            - call: "POST /network/recalls"
              payload: { donor_agreement_id: "${agr5}", lot_code: "LOT-77", product_category: "DAIRY", affected_lbs: 800 }
              as: NetworkAdmin
