  # ==========================================================================
  - section: state_machines
    instances:

      - name: newly_created_rows_start_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.AffiliationAgreement.initial_state
          - state_machines.MedicalClearance.initial_state
          - state_machines.TransactionReport.initial_state
        distinguishing_aspect: "Three different machines are checked at birth in one pass: an agreement is created DRAFT with posture FROZEN and settlement_status NOT_SETTLED, a clearance is created REQUESTED, and no disposition has yet been applied to either."
        test_recipe:
          setup:
            - "One affiliate and one player exist; nothing has been dispositioned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "POST /affiliates"
              payload: { name: "Initial Club", level: "DOUBLE_A", market_city: "Biloxi", meal_stipend_cents_per_day: 2900 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { is_aff: $.data.id }
            - call: "POST /players"
              payload: { full_name: "Initial Player", origin: "DOMESTIC_DRAFT", signed_date: "2025-06-10" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { is_p: $.data.id }
          trigger:
            - call: "POST /affiliates/${is_aff}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 900000 }
              as: AffiliateOperator
              as_user_id: "${is_aff}"
              captures: { is_agr: $.data.id, is_status: $.data.status }
            - call: "POST /players/${is_p}/medical-clearances"
              payload: { clearance_type: "LEVEL_ASSIGNMENT" }
              as: MedicalDirector
              as_user_id: "u-med-1"
              captures: { is_c: $.data.id }
          assert:
            - "AffiliationAgreement.${is_agr}.status == DRAFT with posture == FROZEN, settlement_status == NOT_SETTLED and submitted_by_user_id == null"
            - "AffiliationAgreement.${is_agr}.provisional_club_obligation_cents == 0 and final_club_obligation_cents == null"
            - "MedicalClearance.${is_c}.status == REQUESTED with issued_by_user_id == null and cleared_workload_ceiling_index == null"
            - "Player.${is_p}.medical_status is still PENDING_CLEARANCE: creating a clearance request does not clear anyone"

      - name: agreement_submit_then_activate_walks_the_happy_path_and_derives_posture
        claim_type: valid_transition
        grounds:
          - "state_machines.AffiliationAgreement[DRAFT -> SUBMITTED]"
          - "state_machines.AffiliationAgreement[SUBMITTED -> ACTIVE]"
          - calculations.facility_posture_evaluation
        distinguishing_aspect: "Two affiliates walk the identical DRAFT -> SUBMITTED -> ACTIVE path and land on different postures: minimum_active_players 0 yields OPEN, the default 22 yields RESTRICTED because active_roster_count is 0, proving posture is derived at ACTIVATE rather than hard-coded."
        test_recipe:
          setup:
            - "Two affiliates with no facility reviews, so facility_status is COMPLIANT for both."
            - "Affiliate P declares minimum_active_players 0 and no required_staff_roles; affiliate Q omits both, taking the defaults 22 and []."
            - "All four expense inputs are omitted on both agreements, so each defaults to 0 and the provisional obligation is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "POST /affiliates"
              payload: { name: "Posture Open Club", level: "HIGH_A", market_city: "Hickory", meal_stipend_cents_per_day: 2800 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { vt_affP: $.data.id }
            - call: "POST /affiliates"
              payload: { name: "Posture Restricted Club", level: "HIGH_A", market_city: "Wilmington", meal_stipend_cents_per_day: 2800 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { vt_affQ: $.data.id }
            - call: "POST /affiliates/${vt_affP}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 900000, minimum_active_players: 0 }
              as: AffiliateOperator
              as_user_id: "${vt_affP}"
              captures: { vt_agrP: $.data.id }
            - call: "POST /affiliates/${vt_affQ}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 900000 }
              as: AffiliateOperator
              as_user_id: "${vt_affQ}"
              captures: { vt_agrQ: $.data.id }
          trigger:
            - call: "POST /agreements/${vt_agrP}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${vt_affP}"
              captures: { vt_P_sub_status: $.data.status, vt_P_sub_posture: $.data.posture }
            - call: "POST /agreements/${vt_agrP}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { vt_P_act_status: $.data.status, vt_P_act_posture: $.data.posture }
            - call: "POST /agreements/${vt_agrQ}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${vt_affQ}"
            - call: "POST /agreements/${vt_agrQ}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { vt_Q_act_posture: $.data.posture }
          assert:
            - "After SUBMIT: AffiliationAgreement.${vt_agrP}.status == SUBMITTED, posture still FROZEN (status is not ACTIVE), and submitted_by_user_id == ${vt_affP}"
            - "After SUBMIT the provisional variant has run: provisional_club_obligation_cents == 0 and affiliate_overflow_cents == 0 because all four declared expenses defaulted to 0"
            - "After ACTIVATE: AffiliationAgreement.${vt_agrP}.status == ACTIVE and posture == OPEN (minimum_active_players 0, required_staff_roles empty)"
            - "After ACTIVATE: AffiliationAgreement.${vt_agrQ}.status == ACTIVE but posture == RESTRICTED, because active_roster_count 0 < minimum_active_players 22"
            - "Neither activation touched settlement_status, which remains NOT_SETTLED on both agreements"

      - name: undeclared_agreement_actions_from_draft_and_active_are_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.AffiliationAgreement.transitions
          - errors[ERR_INVALID_AGREEMENT_STATE]
          - "validations[priority=40]"
        distinguishing_aspect: "Three actions absent from the transition table are attempted from two different source states — ACTIVATE and SUSPEND from DRAFT, SUBMIT from ACTIVE — each returning 409 ERR_INVALID_AGREEMENT_STATE while the stored status never moves."
        test_recipe:
          setup:
            - "Affiliate R with one agreement left in DRAFT, plus affiliate S with an ACTIVE agreement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "POST /affiliates"
              payload: { name: "Draft Club", level: "SINGLE_A", market_city: "Salem", meal_stipend_cents_per_day: 2600 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { it_affR: $.data.id }
            - call: "POST /affiliates/${it_affR}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 900000, minimum_active_players: 0 }
              as: AffiliateOperator
              as_user_id: "${it_affR}"
              captures: { it_agrR: $.data.id }
            - call: "POST /affiliates"
              payload: { name: "Active Club", level: "SINGLE_A", market_city: "Fredericksburg", meal_stipend_cents_per_day: 2600 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { it_affS: $.data.id }
            - call: "POST /affiliates/${it_affS}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 900000, minimum_active_players: 0 }
              as: AffiliateOperator
              as_user_id: "${it_affS}"
              captures: { it_agrS: $.data.id }
            - call: "POST /agreements/${it_agrS}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${it_affS}"
            - call: "POST /agreements/${it_agrS}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          trigger:
            - call: "POST /agreements/${it_agrR}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { it_e1: $.data.error_id }
            - call: "POST /agreements/${it_agrR}/disposition"
              payload: { action: "SUSPEND" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { it_e2: $.data.error_id }
            - call: "POST /agreements/${it_agrS}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${it_affS}"
              captures: { it_e3: $.data.error_id }
            - call: "GET /affiliates/${it_affR}/agreements"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { it_r_status: "$.data[0].status" }
          assert:
            - "DRAFT + ACTIVATE returns 409 with error_id == ERR_INVALID_AGREEMENT_STATE (DRAFT -> ACTIVE is not a declared transition)"
            - "DRAFT + SUSPEND returns 409 with error_id == ERR_INVALID_AGREEMENT_STATE"
            - "ACTIVE + SUBMIT returns 409 with error_id == ERR_INVALID_AGREEMENT_STATE"
            - "AffiliationAgreement.${it_agrR}.status is still DRAFT and AffiliationAgreement.${it_agrS}.status is still ACTIVE after all three rejections"

      - name: rejected_agreement_is_terminal_and_accepts_no_further_action
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.AffiliationAgreement.terminal_states
          - errors[ERR_INVALID_AGREEMENT_STATE]
        distinguishing_aspect: "From the terminal state REJECTED, three different actions that are legal from some other state (REINSTATE, TERMINATE, SUBMIT) all fail, and the row keeps posture FROZEN — terminality is enforced for the whole action alphabet, not just for a re-entry of the same action."
        test_recipe:
          setup:
            - "Affiliate T with one agreement driven DRAFT -> SUBMITTED -> REJECTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "POST /affiliates"
              payload: { name: "Terminal Club", level: "DOUBLE_A", market_city: "Springfield", meal_stipend_cents_per_day: 2900 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { tl_aff: $.data.id }
            - call: "POST /affiliates/${tl_aff}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_3", club_reimbursement_cap_cents: 500000, minimum_active_players: 0 }
              as: AffiliateOperator
              as_user_id: "${tl_aff}"
              captures: { tl_agr: $.data.id }
            - call: "POST /agreements/${tl_agr}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${tl_aff}"
            - call: "POST /agreements/${tl_agr}/disposition"
              payload: { action: "REJECT", note: "facility plan incomplete" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { tl_status: $.data.status, tl_posture: $.data.posture }
          trigger:
            - call: "POST /agreements/${tl_agr}/disposition"
              payload: { action: "REINSTATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { tl_e1: $.data.error_id }
            - call: "POST /agreements/${tl_agr}/disposition"
              payload: { action: "TERMINATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { tl_e2: $.data.error_id }
            - call: "POST /agreements/${tl_agr}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${tl_aff}"
              captures: { tl_e3: $.data.error_id }
            - call: "GET /affiliates/${tl_aff}/agreements"
              payload: { status: "REJECTED" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { tl_still: "$.data[0].status" }
          assert:
            - "The REJECT itself moved the agreement to REJECTED with posture == FROZEN"
            - "REINSTATE, TERMINATE and SUBMIT each return 409 with error_id == ERR_INVALID_AGREEMENT_STATE"
            - "GET /affiliates/${tl_aff}/agreements filtered on status REJECTED returns total_count == 1, so the row never left the terminal state"
            - "A fresh agreement can still be created for ${tl_aff} because the REJECTED one does not count toward the SUBMITTED/ACTIVE uniqueness rule"

      - name: repeating_a_consumed_action_fails_on_the_second_attempt
        claim_type: idempotency
        grounds:
          - "state_machines.AffiliationAgreement[DRAFT -> SUBMITTED]"
          - "state_machines.MedicalClearance[REQUESTED -> ISSUED]"
