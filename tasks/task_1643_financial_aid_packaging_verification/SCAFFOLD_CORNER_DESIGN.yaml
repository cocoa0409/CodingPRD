            - call: "POST /api/award-lines/${line_rk}/begin-disbursement"
              payload: {}
              as: AidOfficer
            - call: "POST /api/disbursements"
              payload: { award_line_id: "${line_rk}", scheduled_cents: 100000, term_code: "2026-FALL" }
              as: AidOfficer
