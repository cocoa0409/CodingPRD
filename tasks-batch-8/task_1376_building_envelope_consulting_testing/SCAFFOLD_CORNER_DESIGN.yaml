# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_1376_building_envelope_consulting_testing
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: engagement_creation_defaults_and_system_fields
        claim_type: creation
        grounds:
          - "entities.Engagement"
        distinguishing_aspect: "POST /engagements returns 201 with status SETUP, risk_score 100, posture OPEN, recognized_fees_cents 0, invoiced_cents 0, version 1, and server-minted id/created_at — client-supplied values for computed fields are ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /engagements"
              payload: { name: "NE", client_name: "NC", fee_cap_cents: 1000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { eng_id: $.data.id }
          assert:
            - "Engagement.${eng_id}.status == SETUP"
            - "Engagement.${eng_id}.risk_score == 100"
            - "Engagement.${eng_id}.posture == OPEN"
            - "Engagement.${eng_id}.recognized_fees_cents == 0"
            - "Engagement.${eng_id}.invoiced_cents == 0"
            - "Engagement.${eng_id}.version == 1"
            - "Engagement.${eng_id}.litigation_hold_active == false"
      - name: engagement_not_found_returns_404
        claim_type: not_found
        grounds:
          - "entities.Engagement"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET on a non-existent engagement id returns ERR_NOT_FOUND with http 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /engagements/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Principal
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "http status == 404"
      - name: engagement_list_pagination_envelope
        claim_type: listing
        grounds:
          - "entities.Engagement"
          - "response_envelope"
        distinguishing_aspect: "GET /engagements with limit/offset returns the fixed pagination fields (limit, offset, total_count, has_more) with defaults limit=10, offset=0."
        test_recipe:
          setup: ["two engagements exist"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "P1", client_name: "C", fee_cap_cents: 1000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
            - call: "POST /engagements"
              payload: { name: "P2", client_name: "C", fee_cap_cents: 1000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
          trigger:
            - call: "GET /engagements"
              payload: { limit: 1, offset: 0 }
              as: Consultant
          assert:
            - "response data length == 1"
            - "meta.pagination total_count == 2"
            - "has_more == true"
      - name: engagement_missing_required_field
        claim_type: required_fields
        grounds:
          - "entities.Engagement.fields.fee_cap_cents"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required fee_cap_cents on create returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /engagements"
              payload: { name: "BAD", client_name: "C", labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
      - name: assembly_duplicate_tag_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Assembly.fields.tag"
          - "errors[ERR_DUPLICATE_ASSEMBLY_TAG]"
        distinguishing_aspect: "Assembly tag is unique per engagement; second create with the same tag returns ERR_DUPLICATE_ASSEMBLY_TAG (409), while the same tag on a DIFFERENT engagement is allowed."
        test_recipe:
          setup: ["engagement E activated; assembly W1 exists on E; second engagement E2 exists"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "E", client_name: "C", fee_cap_cents: 1000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements"
              payload: { name: "E2", client_name: "C", fee_cap_cents: 1000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { eng2_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "W1", assembly_type: "MASONRY", design_u_factor: 1.0, required_airtightness_lps_m2: 2.0 }
              as: Consultant
          trigger:
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "W1", assembly_type: "ROOFING", design_u_factor: 0.9, required_airtightness_lps_m2: 2.5 }
              as: Consultant
              captures: { err: $.data.error_id }
            - call: "POST /engagements/${eng2_id}/assemblies"
              payload: { tag: "W1", assembly_type: "ROOFING", design_u_factor: 0.9, required_airtightness_lps_m2: 2.5 }
              as: Consultant
              captures: { ok_id: $.data.id }
          assert:
            - "err == ERR_DUPLICATE_ASSEMBLY_TAG"
            - "cross-engagement create succeeds: Assembly.${ok_id}.tag == W1"
      - name: anomaly_xor_constraint_enforced
        claim_type: type_constraints
        grounds:
          - "entities.Anomaly.fields.field_test_id"
          - "entities.Anomaly.fields.survey_id"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Anomaly requires exactly one of field_test_id / survey_id; providing neither (or both) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["engagement activated with an assembly and a completed survey"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "EX", client_name: "C", fee_cap_cents: 1000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "AX", assembly_type: "MASONRY", design_u_factor: 1.0, required_airtightness_lps_m2: 2.0 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys"
              payload: { assembly_id: "${asm_id}", survey_type: "MOISTURE", survey_date: "2026-09-01", ambient_delta_t_c: 1.0 }
              as: Consultant
              captures: { srv_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys/${srv_id}/complete"
              payload: {}
              as: FieldTechnician
          trigger:
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { anomaly_type: "WATER_INGRESS", severity: "LOW", description: "neither parent" }
              as: Consultant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
      - name: litigation_hold_immutable_no_version_field
        claim_type: immutability
        grounds:
          - "entities.LitigationHold"
        distinguishing_aspect: "LitigationHold has common_fields: false — responses expose id and created_at but no version field, and no update endpoint exists."
        test_recipe:
          setup: ["engagement activated; hold applied"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "EH", client_name: "C", fee_cap_cents: 1000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
          trigger:
            - call: "POST /engagements/${eng_id}/litigation-holds"
              payload: { matter_reference: "CASE-X" }
              as: Principal
              captures: { hold_id: $.data.id }
          assert:
            - "LitigationHold.${hold_id}.hold_status == ACTIVE"
            - "response contains no version key"
            - "Engagement.${eng_id}.posture == FROZEN"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: engagement_terminal_close_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Engagement"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "After CLOSED, every further mutation (e.g., activate) is rejected with a state error (ERR_NOT_FOUND-free: ERR_ENGAGEMENT_NOT_IN_SETUP for activate) and the engagement remains CLOSED."
        test_recipe:
          setup: ["engagement driven SETUP -> IN_PROGRESS -> CLOSE_OUT -> CLOSED with no children"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "ET", client_name: "C", fee_cap_cents: 1000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/begin-close-out"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/close"
              payload: {}
              as: Principal
          trigger:
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ENGAGEMENT_NOT_IN_SETUP"
            - "Engagement.${eng_id}.status == CLOSED (unchanged)"
      - name: design_review_reject_from_submitted_invalid
        claim_type: invalid_transition
        grounds:
          - "state_machines.DesignReview"
          - "errors[ERR_REVIEW_NOT_ACTIONABLE]"
        distinguishing_aspect: "approve/reject/issue-comments on a SUBMITTED review (never started) fail with ERR_REVIEW_NOT_ACTIONABLE; only start-review is valid from SUBMITTED."
        test_recipe:
          setup: ["engagement IN_PROGRESS OPEN; review SUBMITTED"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "ER", client_name: "C", fee_cap_cents: 1000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "AR", assembly_type: "MASONRY", design_u_factor: 1.0, required_airtightness_lps_m2: 2.0 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews"
              payload: { assembly_id: "${asm_id}", barrier_scope: ["AIR"], drawing_count: 2 }
              as: Consultant
              captures: { rev_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/approve"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REVIEW_NOT_ACTIONABLE"
            - "DesignReview.${rev_id}.status == SUBMITTED"
      - name: mockup_begin_testing_outside_slot_window
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.MockUp.READY_FOR_TEST_to_TESTING"
          - "errors[ERR_OUTSIDE_SLOT_WINDOW]"
        distinguishing_aspect: "begin-testing with the logical clock set BEFORE the slot's start_date fails with ERR_OUTSIDE_SLOT_WINDOW (409); the slot stays RESERVED."
        test_recipe:
          setup: ["mock-up READY_FOR_TEST; slot [2026-09-10, 2026-09-12); clock at 2026-09-05"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "EM", client_name: "C", fee_cap_cents: 1000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "AM", assembly_type: "CURTAIN_WALL", design_u_factor: 1.6, required_airtightness_lps_m2: 1.5 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/chamber-slots"
              payload: { chamber_code: "CHAMBER-Z", start_date: "2026-09-10", end_date: "2026-09-12", daily_rate_cents: 100000 }
              as: Consultant
              captures: { slot_id: $.data.id }
            - call: "POST /engagements/${eng_id}/mock-ups"
              payload: { assembly_id: "${asm_id}", chamber_slot_id: "${slot_id}", specimen_count: 1 }
              as: Consultant
              captures: { mu_id: $.data.id }
            - call: "POST /engagements/${eng_id}/mock-ups/${mu_id}/begin-construction"
              payload: {}
              as: Consultant
            - call: "POST /engagements/${eng_id}/mock-ups/${mu_id}/declare-ready"
              payload: {}
              as: Consultant
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T09:00:00Z" }
              as: Principal
          trigger:
            - call: "POST /engagements/${eng_id}/mock-ups/${mu_id}/begin-testing"
              payload: {}
              as: Consultant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_OUTSIDE_SLOT_WINDOW"
            - "MockUp.${mu_id}.status == READY_FOR_TEST"
            - "ChamberSlot.${slot_id}.status == RESERVED"
      - name: survey_imaging_delta_t_boundary
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Survey.PLANNED_to_COMPLETED"
          - "errors[ERR_IMAGING_DELTA_T_INSUFFICIENT]"
        distinguishing_aspect: "THERMAL_IMAGING completion requires ambient_delta_t_c >= 3.0: delta 2.9 fails with ERR_IMAGING_DELTA_T_INSUFFICIENT; delta exactly 3.0 succeeds; MOISTURE surveys ignore the check entirely."
        test_recipe:
          setup: ["engagement IN_PROGRESS; three surveys planned: S1 THERMAL_IMAGING delta 2.9, S2 THERMAL_IMAGING delta 3.0, S3 MOISTURE delta 0.5"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "ES", client_name: "C", fee_cap_cents: 1000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "AS", assembly_type: "ROOFING", design_u_factor: 0.8, required_airtightness_lps_m2: 3.0 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys"
              payload: { assembly_id: "${asm_id}", survey_type: "THERMAL_IMAGING", survey_date: "2026-09-01", ambient_delta_t_c: 2.9 }
              as: Consultant
              captures: { s1_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys"
              payload: { assembly_id: "${asm_id}", survey_type: "THERMAL_IMAGING", survey_date: "2026-09-01", ambient_delta_t_c: 3.0 }
              as: Consultant
              captures: { s2_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys"
              payload: { assembly_id: "${asm_id}", survey_type: "MOISTURE", survey_date: "2026-09-01", ambient_delta_t_c: 0.5 }
              as: Consultant
              captures: { s3_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/surveys/${s1_id}/complete"
              payload: {}
              as: FieldTechnician
              captures: { err1: $.data.error_id }
            - call: "POST /engagements/${eng_id}/surveys/${s2_id}/complete"
              payload: {}
              as: FieldTechnician
              captures: { s2_status: $.data.status }
            - call: "POST /engagements/${eng_id}/surveys/${s3_id}/complete"
              payload: {}
              as: FieldTechnician
              captures: { s3_status: $.data.status }
          assert:
            - "err1 == ERR_IMAGING_DELTA_T_INSUFFICIENT"
            - "s2_status == COMPLETED (boundary 3.0 inclusive)"
            - "s3_status == COMPLETED (delta-T not applicable to MOISTURE)"
      - name: chamber_slot_release_blocked_while_mockup_live
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ChamberSlot.RESERVED_to_RELEASED"
          - "errors[ERR_SLOT_IN_USE]"
        distinguishing_aspect: "Releasing a slot referenced by a PLANNED mock-up fails with ERR_SLOT_IN_USE; after the mock-up consumes the slot, release fails with ERR_SLOT_NOT_RESERVED instead."
        test_recipe:
          setup: ["slot RESERVED with a PLANNED mock-up bound to it"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "EC", client_name: "C", fee_cap_cents: 1000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "AC", assembly_type: "CURTAIN_WALL", design_u_factor: 1.6, required_airtightness_lps_m2: 1.5 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/chamber-slots"
              payload: { chamber_code: "CHAMBER-Y", start_date: "2026-09-10", end_date: "2026-09-12", daily_rate_cents: 100000 }
              as: Consultant
              captures: { slot_id: $.data.id }
            - call: "POST /engagements/${eng_id}/mock-ups"
              payload: { assembly_id: "${asm_id}", chamber_slot_id: "${slot_id}", specimen_count: 1 }
              as: Consultant
              captures: { mu_id: $.data.id }
          trigger:
            - call: "POST /engagements/${eng_id}/chamber-slots/${slot_id}/release"
              payload: {}
              as: Consultant
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SLOT_IN_USE"
            - "ChamberSlot.${slot_id}.status == RESERVED"
      - name: field_test_certify_success_after_diagnosis
        claim_type: valid_transition
        grounds:
          - "state_machines.FieldTest.RESULT_RECORDED_to_CERTIFIED"
        distinguishing_aspect: "FAIL result certified only after diagnosis completes: begin-diagnosis -> complete-diagnosis -> certify by a DIFFERENT user succeeds; certifier recorded on the entity."
        test_recipe:
          setup: ["assembly APPROVED; field test FAIL recorded by tech-user-1; diagnosis driven UNDIAGNOSED -> DIAGNOSING -> DIAGNOSED"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "EF", client_name: "C", fee_cap_cents: 1000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "AF", assembly_type: "WINDOW_WALL", design_u_factor: 2.0, required_airtightness_lps_m2: 1.5 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews"
              payload: { assembly_id: "${asm_id}", barrier_scope: ["AIR"], drawing_count: 1 }
              as: Consultant
              captures: { rev_id: $.data.id }
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/start-review"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
            - call: "POST /engagements/${eng_id}/design-reviews/${rev_id}/approve"
              payload: {}
              as: Reviewer
              as_user_id: "rev-user-1"
            - call: "POST /engagements/${eng_id}/field-tests"
              payload: { assembly_id: "${asm_id}", test_method: "ASTM_E783", test_date: "2026-09-10", test_pressure_pa: 150 }
              as: Consultant
              captures: { ft_id: $.data.id }
            - call: "POST /engagements/${eng_id}/field-tests/${ft_id}/begin"
              payload: {}
              as: FieldTechnician
              as_user_id: "tech-user-1"
            - call: "POST /engagements/${eng_id}/field-tests/${ft_id}/record-result"
              payload: { measured_leakage_lps_m2: 3.5 }
              as: FieldTechnician
              as_user_id: "tech-user-1"
            - call: "POST /engagements/${eng_id}/field-tests/${ft_id}/begin-diagnosis"
              payload: {}
              as: Consultant
            - call: "POST /engagements/${eng_id}/field-tests/${ft_id}/complete-diagnosis"
              payload: {}
              as: Consultant
          trigger:
            - call: "POST /engagements/${eng_id}/field-tests/${ft_id}/certify"
              payload: {}
              as: Principal
              as_user_id: "principal-user-1"
              captures: { cert_by: $.data.certified_by, exec_status: $.data.execution_status }
          assert:
            - "exec_status == CERTIFIED"
            - "cert_by == principal-user-1"
      - name: warranty_claim_cycle_denied_escalated_denied_again
        claim_type: valid_transition
        grounds:
          - "state_machines.WarrantyClaim.ESCALATED_to_DENIED"
        distinguishing_aspect: "The DENIED -> ESCALATED -> DENIED cycle may repeat: after escalation and a second DENIED decision, claim_status is DENIED again and a further escalate remains possible (window already elapsed)."
        test_recipe:
          setup: ["claim filed at clock 2026-09-01, acknowledged, DENIED; clock advanced to 2026-10-02; claim escalated"]
          setup_api_calls:
            - call: "POST /engagements"
              payload: { name: "EW", client_name: "C", fee_cap_cents: 1000000, labor_rate_cents_per_hour: 12000 }
              as: Principal
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/activate"
              payload: {}
              as: Principal
            - call: "POST /engagements/${eng_id}/assemblies"
              payload: { tag: "AW", assembly_type: "MASONRY", design_u_factor: 1.0, required_airtightness_lps_m2: 2.0 }
              as: Consultant
              captures: { asm_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys"
              payload: { assembly_id: "${asm_id}", survey_type: "MOISTURE", survey_date: "2026-08-20", ambient_delta_t_c: 1.0 }
              as: Consultant
              captures: { srv_id: $.data.id }
            - call: "POST /engagements/${eng_id}/surveys/${srv_id}/complete"
              payload: {}
              as: FieldTechnician
            - call: "POST /engagements/${eng_id}/anomalies"
              payload: { survey_id: "${srv_id}", anomaly_type: "WATER_INGRESS", severity: "LOW", description: "minor" }
              as: Consultant
              captures: { an_id: $.data.id }
            - call: "POST /engagements/${eng_id}/anomalies/${an_id}/verify"
              payload: {}
              as: Consultant
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Principal
            - call: "POST /engagements/${eng_id}/warranty-claims"
              payload: { anomaly_id: "${an_id}", manufacturer_name: "ACME", claimed_amount_cents: 500000 }
              as: Consultant
              captures: { claim_id: $.data.id }
            - call: "POST /engagements/${eng_id}/warranty-claims/${claim_id}/manufacturer-acknowledge"
              payload: {}
              as: ManufacturerRep
            - call: "POST /engagements/${eng_id}/warranty-claims/${claim_id}/manufacturer-decide"
              payload: { decision: "DENIED" }
              as: ManufacturerRep
