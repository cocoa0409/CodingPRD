      - name: alumni_reserve_pinned_to_cohort_target_not_post_bucket_remainder
        grounds: "§1.3 calculations.slate_allocation (algorithm waterfall_allocation) and its ordering_note; §1.0 constants; §1.1 Cycle.alumni_reserved_slots / cohort_target_size / alumni_reserve_pct; §1.5 POST /cycles/{id}/lock-slate"
        distinguishing_aspect: |
          MODE (c): a circular-looking dependency broken by a pinned evaluation order. Read
          naively, the waterfall is self-referential: the alumni reserve is a percentage of the
          slots available to it, bucket 1 (discipline minimums) consumes slots before the reserve
          is measured, and bucket 3 (general merit) fills whatever the reserve leaves - so the
          reserve appears to depend on the remainder that depends on the reserve. §1.3 pins the
          order: alumni_reserved_slots is computed FIRST, from cohort_target_size, and never
          recomputed as buckets drain. With cohort_target_size 10 and alumni_reserve_pct 0.25 the
          pinned answer is ceil(0.25 * 10) = 3; the seductive "recompute against what survived
          bucket 1" reading gives ceil(0.25 * 8) = 2 and silently hands one reserved slot to
          general merit. Same inputs, two defensible readings, one pinned answer.
        test_recipe:
          setup: |
            A cycle with cohort_target_size 10 and alumni_reserve_pct 0.25 and TWO disciplines,
            PRINT and SCULPT, each with cohort_min_slots 1 - so bucket 1 provably consumes 2 of
            the 10 slots before the reserve would be measured. Two applicants each submit one
            application (one per discipline), both are advanced to panel and both are scored to
            80.00 by the same two panelists (panel_quorum 2, so n = 2 < TRIM_MIN_PANELISTS and no
            trim applies). The chair who locks the slate is a third, chair_eligible panelist who
