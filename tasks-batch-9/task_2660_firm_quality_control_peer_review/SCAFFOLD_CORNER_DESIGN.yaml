            - "HTTP 201"
            - "data.must_select_category == \"ERISA_AUDIT\" and data.is_scope_limitation == false"
            - "data.status == \"COMMITTED\" and data.disposition == \"NONE\" and data.non_conforming == false"
            - "a follow-up GET /peer-reviews/${pr_id} returns unallocated_hours == 32 (48 - 16)"
            - "a follow-up GET /peer-reviewers/${reviewer_id} returns committed_hours_balance == 16"

      - name: partner_patch_recomputes_eqr_eligible_from_cpe_hours
        claim_type: Standard CRUD
        grounds:
          - endpoints."PATCH /partners/{partner_id}"
          - entities.Partner.eqr_eligible
        distinguishing_aspect: >-
          eqr_eligible is recomputed on every write, not only at create: a partner
          registered with 90 CPE hours and the EQ_REVIEWER designation is
          ineligible, and a PATCH raising the hours to 120 (exactly the gate)
          flips it true while leaving designations untouched and bumping version.
        test_recipe:
          setup:
            - "Firm with an EQ-designated partner holding only 90 CPE hours."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - &k_eqrp_low
              call: "POST /firms/${firm_id}/partners"
              payload:
                full_name: "Nadia Kwon"
                cpa_license_state: "TX"
                designations: ["EQ_REVIEWER"]
                cpe_hours_last_3y: 90
              as: SystemAdmin
              as_user_id: "sysadmin-01"
              captures: { eqrp_low_id: "$.data.id" }
          trigger:
            - call: "PATCH /partners/${eqrp_low_id}"
              payload: { cpe_hours_last_3y: 120 }
              as: SystemAdmin
              as_user_id: "sysadmin-01"
          assert:
            - "HTTP 200"
            - "data.cpe_hours_last_3y == 120 and data.eqr_eligible == true"
            - "data.designations == [\"EQ_REVIEWER\"] and data.status == \"ACTIVE\""
            - "data.version == 2"

  - section: errors
    instances:

      - name: missing_x_user_headers_returns_unauthenticated
        claim_type: Error Triggerable
        grounds:
          - validations.priority_1
          - validations.priority_2
          - validations.priority_3
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: >-
          The three auth rules are distinct and ordered. Omitting the headers
          entirely is 401 ERR_UNAUTHENTICATED; presenting a real role that is not
          in the endpoint's role list is 403 ERR_ROLE_NOT_PERMITTED; presenting a
          permitted entity_backed role whose X-User-ID is not a row of the backing
          entity is 403 ERR_ROLE_IDENTITY_UNKNOWN. All three must be
          distinguishable on the same endpoint.
        test_recipe:
          setup:
            - "One firm with a managing partner and one engagement."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
          trigger:
            - # both the X-User-Role and X-User-ID headers are omitted from this request
              call: "POST /engagements/${eng_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: "<no headers sent>"
              as_user_id: "<none>"
              captures: { auth_err: "$.data.error_id" }
          assert:
            - "HTTP 401"
            - "data.error_id == \"ERR_UNAUTHENTICATED\""
            - "a repeat call with X-User-Role: PeerReviewCommittee (a declared role absent from this endpoint's list) returns 403 ERR_ROLE_NOT_PERMITTED"
            - "a repeat call with X-User-Role: EngagementPartner and X-User-ID: \"ptr-does-not-exist\" returns 403 ERR_ROLE_IDENTITY_UNKNOWN"
            - "a follow-up GET /engagements/${eng_id} returns workflow_state == \"PLANNING\" and version == 1"

      - name: unknown_ids_return_the_per_collection_not_found_error
        claim_type: Error Triggerable
        grounds:
          - validations.priority_4
          - validations.priority_5
          - errors.ERR_FIRM_NOT_FOUND
        distinguishing_aspect: >-
          Every collection owns its own 404 id, and path segments are validated
          left to right, so an unknown {firm_id} on a nested route wins over
          anything else in the body. One instance sweeps the whole not-found
          family so no collection silently reuses a neighbour's id.
        test_recipe:
          setup:
            - "One firm so that the well-formed comparison calls have a valid parent."
          setup_api_calls:
            - *k_clock
            - *k_firm
          trigger:
            - call: "GET /firms/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: SystemAdmin
              as_user_id: "sysadmin-01"
              captures: { nf_err: "$.data.error_id" }
          assert:
            - "HTTP 404 and data.error_id == \"ERR_FIRM_NOT_FOUND\""
            - "GET /partners/{unknown} returns ERR_PARTNER_NOT_FOUND; GET /engagements/{unknown} returns ERR_ENGAGEMENT_NOT_FOUND; GET /quality-reviews/{unknown} returns ERR_QUALITY_REVIEW_NOT_FOUND"
            - "GET /quality-risks/{unknown} returns ERR_QUALITY_RISK_NOT_FOUND; GET /risk-responses/{unknown} returns ERR_RISK_RESPONSE_NOT_FOUND"
            - "GET /internal-inspections/{unknown} returns ERR_INSPECTION_NOT_FOUND; GET /inspection-selections/{unknown} returns ERR_INSPECTION_SELECTION_NOT_FOUND; GET /inspection-findings/{unknown} returns ERR_FINDING_NOT_FOUND"
            - "GET /root-cause-analyses/{unknown} returns ERR_RCA_NOT_FOUND; GET /remediation-plans/{unknown} returns ERR_REMEDIATION_PLAN_NOT_FOUND"
            - "GET /peer-reviewers/{unknown} returns ERR_PEER_REVIEWER_NOT_FOUND; GET /peer-review-selections/{unknown} returns ERR_PEER_REVIEW_SELECTION_NOT_FOUND; GET /corrective-action-plans/{unknown} returns ERR_CORRECTIVE_ACTION_PLAN_NOT_FOUND"
            - "POST /firms/{unknown}/partners returns ERR_FIRM_NOT_FOUND (the path segment is resolved before the body is read)"

      - name: duplicate_unique_keys_return_their_own_error_ids
        claim_type: Error Triggerable
        grounds:
          - validations.priority_54
          - errors.ERR_DUPLICATE_INSPECTION_YEAR
          - errors.ERR_DUPLICATE_QUALITY_OBJECTIVE
          - errors.ERR_DUPLICATE_ENGAGEMENT
        distinguishing_aspect: >-
          Three different unique keys share one validation priority but not one
          error id: (firm_id, inspection_year), (firm_id, component,
          quality_objective_code) and (firm_id, client_name, period_end). Each
          duplicate must name its own id, and the first row must survive intact.
        test_recipe:
          setup:
            - "Firm with a 2026 inspection cycle, one quality risk on EP-01 and one engagement for Aurora Metals Inc at period_end 2026-03-31."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_risk_a
            - *k_insp
          trigger:
            - call: "POST /firms/${firm_id}/internal-inspections"
              payload: { inspection_year: 2026, target_engagement_count: 3 }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { dup_err: "$.data.error_id" }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_DUPLICATE_INSPECTION_YEAR\""
            - "a repeat POST /firms/${firm_id}/quality-risks with component ENGAGEMENT_PERFORMANCE and quality_objective_code EP-01 returns 409 ERR_DUPLICATE_QUALITY_OBJECTIVE"
            - "a repeat POST /engagements with the same firm_id, client_name \"Aurora Metals Inc\" and period_end 2026-03-31 returns 409 ERR_DUPLICATE_ENGAGEMENT"
            - "a follow-up GET /internal-inspections/${insp_id} returns target_engagement_count == 1 (the original value is not overwritten)"
            - "a follow-up GET /engagements?firm_id=${firm_id} returns meta.total_count == 1"

      - name: eqr_eligibility_clauses_surface_the_first_failing_error
        claim_type: Error Triggerable
        grounds:
          - calculations.eqr_reviewer_eligibility
          - errors.ERR_EQR_SELF_REVIEW
        distinguishing_aspect: >-
          The eligibility clauses are ordered and the FIRST failure decides the
          error id. Naming the engagement partner as his own quality reviewer
          fails clause 3, so the answer is 403 ERR_EQR_SELF_REVIEW even though
          that partner also fails clause 4 (no EQ_REVIEWER designation, 60 CPE
          hours). The remaining clauses each own a distinct id.
        test_recipe:
          setup:
            - "Engagement in FIELDWORK; partners covering each eligibility failure mode (self, inactive, low-CPE, conflicted)."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eqrp
            - *k_eng
            - &k_eng_fw_v
              call: "POST /engagements/${eng_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
              captures: { eng_v_fw2: "$.data.version" }
          trigger:
            - call: "POST /engagements/${eng_id}/quality-reviews"
              payload:
                reviewer_partner_id: "${ep_id}"
                objectivity_attested: true
                expected_engagement_version: "${eng_v_fw2}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { self_err: "$.data.error_id" }
          assert:
            - "HTTP 403 and data.error_id == \"ERR_EQR_SELF_REVIEW\" (not ERR_CPE_REQUIREMENT_NOT_MET)"
            - "a repeat call naming a partner PATCHed to status INACTIVE returns 409 ERR_PARTNER_INACTIVE (clause 1 precedes clause 3)"
            - "a repeat call naming a partner with EQ_REVIEWER but cpe_hours_last_3y 90 returns 409 ERR_CPE_REQUIREMENT_NOT_MET"
            - "a repeat call naming ${eqrp_id} after PATCHing independence_conflict_client_names to [\"Aurora Metals Inc\"] returns 409 ERR_REVIEWER_INDEPENDENCE_CONFLICT"
            - "a repeat call naming ${eqrp_id} with objectivity_attested false returns 422 ERR_OBJECTIVITY_NOT_ATTESTED"
            - "a follow-up GET /quality-reviews?engagement_id=${eng_id} returns meta.total_count == 0"

      - name: fourth_open_quality_review_exceeds_the_eqr_capacity
        claim_type: Error Triggerable
        grounds:
          - calculations.eqr_reviewer_concurrency_window
          - errors.ERR_EQR_CAPACITY_EXCEEDED
          - errors.ERR_EQR_ALREADY_ASSIGNED
        distinguishing_aspect: >-
          MAX_CONCURRENT_EQR is 3 over half-open intervals with no buffer: three
          ASSIGNED reviews (all with null concluded_at, i.e. open to +infinity)
          occupy every slot, so the fourth assignment to the same reviewer is 409
          ERR_EQR_CAPACITY_EXCEEDED. A second assignment on an engagement that
          already holds an ASSIGNED review is a different failure
          (ERR_EQR_ALREADY_ASSIGNED) and must not be conflated.
        test_recipe:
          setup:
            - "One EQ-eligible partner holding three ASSIGNED quality reviews across three FIELDWORK engagements, plus a fourth FIELDWORK engagement with no review."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eqrp
            - *k_eng
            - *k_eng_fw_v
            - &k_eqr_slot1
              call: "POST /engagements/${eng_id}/quality-reviews"
              payload:
                reviewer_partner_id: "${eqrp_id}"
                objectivity_attested: true
                expected_engagement_version: "${eng_v_fw2}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { eqr_slot1_id: "$.data.id" }
            - call: "POST /engagements"
              payload:
                firm_id: "${firm_id}"
                client_name: "Bellhaven Clinics"
                engagement_type: "REVIEW"
                period_end: "2026-03-31"
                engagement_partner_id: "${ep_id}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { eng_c_id: "$.data.id" }
            - call: "POST /engagements/${eng_c_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
              captures: { eng_c_v: "$.data.version" }
            - call: "POST /engagements/${eng_c_id}/quality-reviews"
              payload:
                reviewer_partner_id: "${eqrp_id}"
                objectivity_attested: true
                expected_engagement_version: "${eng_c_v}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
            - call: "POST /engagements"
              payload:
                firm_id: "${firm_id}"
                client_name: "Corvid Logistics"
                engagement_type: "REVIEW"
                period_end: "2026-03-31"
                engagement_partner_id: "${ep_id}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { eng_d_id: "$.data.id" }
            - call: "POST /engagements/${eng_d_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
              captures: { eng_d_v: "$.data.version" }
            - call: "POST /engagements/${eng_d_id}/quality-reviews"
              payload:
                reviewer_partner_id: "${eqrp_id}"
                objectivity_attested: true
                expected_engagement_version: "${eng_d_v}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
            - call: "POST /engagements"
              payload:
                firm_id: "${firm_id}"
                client_name: "Dunmore Paper Co"
                engagement_type: "REVIEW"
                period_end: "2026-03-31"
                engagement_partner_id: "${ep_id}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { eng_e_id: "$.data.id" }
            - call: "POST /engagements/${eng_e_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
              captures: { eng_e_v: "$.data.version" }
          trigger:
            - call: "POST /engagements/${eng_e_id}/quality-reviews"
              payload:
                reviewer_partner_id: "${eqrp_id}"
                objectivity_attested: true
                expected_engagement_version: "${eng_e_v}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { cap_err: "$.data.error_id" }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_EQR_CAPACITY_EXCEEDED\""
            - "a follow-up GET /partners/${eqrp_id} returns open_eqr_count == 3"
            - "a follow-up GET /quality-reviews?engagement_id=${eng_e_id} returns meta.total_count == 0"
            - "a repeat POST /engagements/${eng_id}/quality-reviews (whose review ${eqr_slot1_id} is still ASSIGNED) returns 409 ERR_EQR_ALREADY_ASSIGNED, not ERR_EQR_CAPACITY_EXCEEDED"

      - name: explicitly_named_reviewer_rejections_are_each_distinct
        claim_type: Error Triggerable
        grounds:
          - validations.priority_49
          - validations.priority_50
          - validations.priority_39
          - validations.priority_57
          - errors.ERR_REVIEWER_SUSPENDED
        distinguishing_aspect: >-
          When reviewer_id is supplied explicitly the eligibility clauses become
          individually addressable errors instead of a silent pool exclusion: a
          SUSPENDED reviewer is ERR_REVIEWER_SUSPENDED, an NV-licensed reviewer who
          does not accept out-of-state work is ERR_REVIEWER_STATE_NOT_LICENSED, a
          reviewer sitting in firm.prior_reviewer_ids is
          ERR_REVIEWER_ROTATION_REQUIRED, and a reviewer missing the firm's
          ERISA_AUDIT qualification is ERR_MUST_SELECT_CATEGORY_NOT_QUALIFIED.
        test_recipe:
          setup:
            - "Firm with a released ERISA_AUDIT engagement (so ERISA_AUDIT is a must-select category) and four differently disqualified reviewers; the rotation history names one of them."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eqrp
            - *k_eng2
            - *k_eng2_fw
            - *k_eqr
            - *k_eqr_start
            - *k_eng2_eqrp
            - *k_eqr_concur
            - *k_eng2_cleared
            - *k_eng2_released
            - &k_reviewer_suspended
              call: "POST /peer-reviewers"
              payload:
                reviewer_firm_name: "Marlow Sturgis PC"
                license_state: "TX"
                qualified_categories: ["ERISA_AUDIT"]
                status: "SUSPENDED"
              as: PeerReviewCommittee
              as_user_id: "prc-01"
              captures: { reviewer_susp_id: "$.data.id" }
            - &k_reviewer_outofstate
              call: "POST /peer-reviewers"
              payload:
                reviewer_firm_name: "Bassett Nolan LLP"
                license_state: "NV"
                accepts_out_of_state: false
                qualified_categories: ["ERISA_AUDIT"]
              as: PeerReviewCommittee
              as_user_id: "prc-01"
              captures: { reviewer_oos_id: "$.data.id" }
            - &k_reviewer_unqualified
              call: "POST /peer-reviewers"
              payload:
                reviewer_firm_name: "Quillen Advisory PC"
                license_state: "TX"
                qualified_categories: []
              as: PeerReviewCommittee
              as_user_id: "prc-01"
              captures: { reviewer_unq_id: "$.data.id" }
            - &k_firm_patch_rotation
              call: "PATCH /firms/${firm_id}"
              payload: { prior_reviewer_ids: ["${reviewer_unq_id}"] }
              as: PeerReviewCommittee
              as_user_id: "prc-01"
            - *k_pr
          trigger:
            - call: "POST /peer-reviews/${pr_id}/reviewer-assignment"
              payload: { reviewer_id: "${reviewer_susp_id}" }
              as: PeerReviewCommittee
              as_user_id: "prc-01"
              captures: { susp_err: "$.data.error_id" }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_REVIEWER_SUSPENDED\""
            - "a repeat call naming ${reviewer_oos_id} returns 409 ERR_REVIEWER_STATE_NOT_LICENSED"
            - "a repeat call naming ${reviewer_unq_id} returns 409 ERR_REVIEWER_ROTATION_REQUIRED (priority 39 precedes the qualification check at 57)"
            - "after PATCH /firms/${firm_id} with prior_reviewer_ids [], a repeat call naming ${reviewer_unq_id} returns 409 ERR_MUST_SELECT_CATEGORY_NOT_QUALIFIED"
            - "a follow-up GET /peer-reviews/${pr_id} returns state == \"SCHEDULED\" and assigned_reviewer_id == null"

      - name: inspection_cycle_transition_guards_are_each_distinct
        claim_type: Error Triggerable
        grounds:
          - state_machines.InternalInspection
          - errors.ERR_NO_ELIGIBLE_ENGAGEMENTS
          - errors.ERR_UNCLASSIFIED_FINDINGS_PRESENT
          - errors.ERR_INSPECTION_NOT_IN_PROGRESS
        distinguishing_aspect: >-
          The cycle's guards are addressable one at a time. A cycle whose selection
          run found nothing (empty eligible pool, engagements_selected_count 0)
          cannot start: ERR_NO_ELIGIBLE_ENGAGEMENTS. Raising a finding before
          IN_PROGRESS is ERR_INSPECTION_NOT_IN_PROGRESS, and an UNCLASSIFIED
          finding blocks FINDINGS_CLASSIFIED with
          ERR_UNCLASSIFIED_FINDINGS_PRESENT.
        test_recipe:
          setup:
            - "Firm whose only engagement is still in PLANNING, and a 2026 cycle whose selection run produced zero selections."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_insp
            - *k_insp_select
          trigger:
            - call: "POST /internal-inspections/${insp_id}/transitions"
              payload: { to_state: "IN_PROGRESS" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { empty_err: "$.data.error_id" }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_NO_ELIGIBLE_ENGAGEMENTS\""
            - "a follow-up GET /internal-inspections/${insp_id} returns state == \"SELECTION_COMPLETE\", engagements_selected_count == 0, must_select_coverage_pct == 100.00, deficiency_severity_index == 0.00"
            - "with the engagement released instead, POST /inspection-selections/{selection_id}/findings before IN_PROGRESS returns 409 ERR_INSPECTION_NOT_IN_PROGRESS"
            - "with one UNCLASSIFIED finding raised, POST /internal-inspections/{id}/transitions {to_state: FINDINGS_CLASSIFIED, severity_index_basis: ENGAGEMENT_WEIGHTED} returns 409 ERR_UNCLASSIFIED_FINDINGS_PRESENT"
            - "with a SIGNIFICANT_DEFICIENCY finding left in RCA_PENDING, the CONCLUDED transition returns 409 ERR_OPEN_SIGNIFICANT_FINDINGS"
            - "with 1 of 1 must-select-eligible engagements unselected (coverage 0.00), the CONCLUDED transition returns 409 ERR_MUST_SELECT_COVERAGE_INCOMPLETE"

      - name: remediation_chain_guards_reject_each_premature_step
        claim_type: Error Triggerable
        grounds:
          - validations.priority_25
          - validations.priority_60
          - validations.priority_62
          - errors.ERR_RCA_NOT_VALIDATED
        distinguishing_aspect: >-
          Every step of the remediation chain has its own gate. A plan cannot be
          built on a DRAFTED analysis (ERR_RCA_NOT_VALIDATED); a plan scoring
          0.40*9.00 + 0.35*2.00 + 0.25*0.00 = 4.30 cannot be accepted
          (ERR_ACCEPTANCE_SCORE_BELOW_THRESHOLD, threshold 7.00); and a plan with
          2 of 4 actions done cannot be COMPLETED
          (ERR_REMEDIATION_ACTIONS_INCOMPLETE).
        test_recipe:
          setup:
            - "Classified DEFICIENCY finding with a DRAFTED three-factor FISHBONE analysis."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_sel_lookup
            - *k_insp_inprog
            - *k_finding
            - *k_classify_def
            - *k_rca
            - *k_finding_v
          trigger:
            - call: "POST /inspection-findings/${finding_id}/remediation-plans"
              payload:
                root_cause_analysis_id: "${rca_id}"
                owner_partner_id: "${qcd_id}"
                target_completion_date: "2026-09-30"
                action_count: 4
                action_specificity_score: 2.00
                expected_finding_version: "${finding_v}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { rca_state_err: "$.data.error_id" }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_RCA_NOT_VALIDATED\""
            - "a follow-up GET /inspection-findings/${finding_id} returns state == \"RCA_PENDING\" and no plan exists (GET /remediation-plans?finding_id=${finding_id} meta.total_count == 0)"
            - "after validating the analysis, the same create succeeds (201) and SUBMITTED yields raw_completeness 4.30, completeness_tier \"CRITICAL\", acceptance_score 4.30; the ACCEPTED transition then returns 409 ERR_ACCEPTANCE_SCORE_BELOW_THRESHOLD"
            - "with action_specificity_score 8.00 and completed_action_count 4 the plan reaches ACCEPTED, and a COMPLETED transition sent with completed_action_count 2 returns 409 ERR_REMEDIATION_ACTIONS_INCOMPLETE"
            - "validating an analysis through a finding it does not belong to returns 409 ERR_RCA_FINDING_MISMATCH"

      - name: peer_review_scope_and_rating_guards_are_each_distinct
        claim_type: Error Triggerable
        grounds:
          - validations.priority_58
          - validations.priority_28
          - validations.priority_21
          - validations.priority_46
          - errors.ERR_SELECTION_DISPOSITION_MISSING
        distinguishing_aspect: >-
          Four separate guards protect the peer review's scope and rating legs: a
          COMMITTED selection with disposition NONE blocks RATING_DRAFTED
          (ERR_SELECTION_DISPOSITION_MISSING); an uncovered must-select category
          blocks FIELDWORK (ERR_MUST_SELECT_CATEGORY_NOT_COVERED); a second
          selection on the same engagement is ERR_DUPLICATE_SELECTION; and an
          engagement whose period_end (2026-08-31) is after year_end (2026-06-30)
          is ERR_ENGAGEMENT_OUTSIDE_REVIEW_SCOPE.
        test_recipe:
          setup:
            - "Peer review in FIELDWORK with one committed selection that has no disposition yet."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_insp_inprog
            - *k_insp_classified
            - *k_insp_concluded
            - *k_reviewer
            - *k_pr
            - *k_pr_assign
            - *k_pr_scope
            - *k_pr_sel
            - *k_pr_fieldwork
          trigger:
            - call: "POST /peer-reviews/${pr_id}/transitions"
              payload: { to_state: "RATING_DRAFTED" }
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
              captures: { disp_err: "$.data.error_id" }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_SELECTION_DISPOSITION_MISSING\""
            - "a follow-up GET /peer-reviews/${pr_id} returns state == \"FIELDWORK\" and rating == \"NONE\""
            - "a repeat POST /peer-reviews/${pr_id}/selections naming ${eng_id} again returns 409 ERR_DUPLICATE_SELECTION"
            - "a selection naming an engagement with period_end 2026-08-31 returns 409 ERR_ENGAGEMENT_OUTSIDE_REVIEW_SCOPE"
            - "on a review whose must_select_categories == [\"ERISA_AUDIT\"] but whose only selection is a REVIEW engagement, the FIELDWORK transition returns 409 ERR_MUST_SELECT_CATEGORY_NOT_COVERED"
            - "after the review reaches RATING_DRAFTED, a further disposition or selection call returns 409 ERR_PEER_REVIEW_ALREADY_RATED"

      - name: locked_file_and_unconcurred_eqr_block_engagement_writes
        claim_type: Error Triggerable
        grounds:
          - validations.priority_17
          - validations.priority_23
          - validations.priority_20
          - errors.ERR_ENGAGEMENT_FILE_LOCKED
        distinguishing_aspect: >-
          Once file_state is LOCKED every workflow- and file-transition on that
          engagement is 409 ERR_ENGAGEMENT_FILE_LOCKED — the guard is on the
          engagement, not on the dimension being written. The two EQR guards are
          separate: EQR_PENDING -> EQR_CLEARED without a CONCURRED review is
          ERR_EQR_NOT_CONCURRED, and requesting CONCURRED while concerns are open
          is ERR_UNRESOLVED_CONCERNS.
        test_recipe:
          setup:
            - "Released engagement whose documentation file has been locked inside the 60-day window."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_file_assembled
            - &k_file_locked
              call: "POST /engagements/${eng_id}/file-transitions"
              payload: { to_state: "LOCKED" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
          trigger:
            - call: "POST /engagements/${eng_id}/file-transitions"
              payload: { to_state: "ASSEMBLED" }
              as: EngagementPartner
              as_user_id: "${ep_id}"
              captures: { locked_err: "$.data.error_id" }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_ENGAGEMENT_FILE_LOCKED\""
            - "a follow-up GET /engagements/${eng_id} returns file_state == \"LOCKED\", workflow_state == \"REPORT_RELEASED\", reopened_count == 0, version == 7"
            - "on an ERISA_AUDIT engagement in EQR_PENDING with no CONCURRED review, the EQR_CLEARED transition returns 409 ERR_EQR_NOT_CONCURRED"
            - "on a quality review sitting in CONCERNS_RAISED, a CONCURRED transition returns 409 ERR_UNRESOLVED_CONCERNS"

      - name: corrective_action_evidence_after_the_due_date_is_rejected
        claim_type: Error Triggerable
        grounds:
          - validations.priority_46
          - errors.ERR_CORRECTIVE_ACTION_PAST_DUE
          - state_machines.peer_review_state
        distinguishing_aspect: >-
          The PASS_WITH_DEFICIENCY fork synthesizes a MONITORING_VISIT plan due
          exactly 90 days after the report issue date (2026-08-01 -> 2026-10-30),
          and the due-date check reads the logical clock date, not wall time. One
          day past the due date the submission is 409
          ERR_CORRECTIVE_ACTION_PAST_DUE, the plan stays REQUIRED with
          evidence_submitted_at null, and because the review never reaches
          ACCEPTED the firm's last_peer_review_rating is still the default NONE.
        test_recipe:
          setup:
            - "Firm walked to a PASS_WITH_DEFICIENCY report issued on 2026-08-01, then the clock advanced one day past the synthesized plan's due date."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_insp_inprog
            - *k_insp_classified
            - *k_insp_concluded
            - *k_reviewer
            - *k_pr
            - *k_pr_assign
            - *k_pr_scope
            - *k_pr_sel_lim
            - *k_pr_fieldwork
            - *k_pr_disp_ffc
            - *k_pr_rating
            - *k_pr_issue
            - call: "GET /corrective-action-plans?peer_review_id=${pr_id}"
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { cap_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-01"
          trigger:
            - call: "POST /corrective-action-plans/${cap_id}/evidence"
              payload: { evidence_summary: "Monitoring visit completed; supervision checklist rolled out firm-wide." }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { past_due_err: "$.data.error_id" }
          assert:
            - "HTTP 409 and data.error_id == \"ERR_CORRECTIVE_ACTION_PAST_DUE\""
            - "a follow-up GET /corrective-action-plans/${cap_id} returns action_code == \"MONITORING_VISIT\", due_date == \"2026-10-30\", status == \"REQUIRED\", evidence_submitted_at == null and rejection_count == 0"
            - "a follow-up GET /peer-reviews/${pr_id} returns state == \"CORRECTIVE_ACTION_REQUIRED\" and rating == \"PASS_WITH_DEFICIENCY\""
            - "a follow-up GET /firms/${firm_id} returns last_peer_review_rating == \"NONE\" (the review never reached ACCEPTED)"
            - "on a FAIL-rated review the synthesized plan instead has action_code == \"PREISSUANCE_REVIEW\" and due_date == \"2026-09-15\" (issue date + 45 days)"

  # =====================================================================
  # 7. RBAC - §1.7 role model is segregation_of_duties: the four firm roles
  #    are Partner-backed, so "who" is decided by comparing X-User-ID with the
  #    resource's partner FKs; the two programme-side roles are opaque.
  # =====================================================================
  - section: rbac
    instances:
      - name: qc_director_exclusive_selector_run_is_denied_to_other_roles
        claim_type: Exclusive Operation
        grounds:
          - roles.QualityControlDirector.exclusive_operations
          - validations.priority_2
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: >-
          Running the deterministic selector is a QualityControlDirector
          exclusive operation, so an EngagementPartner attempt is refused at
          priority 2 (403 ERR_ROLE_NOT_PERMITTED) before any selection row is
          written - the inspection must still read PLANNING with
          engagements_selected_count 0, proving the denial fired before the
          cascade rather than after it.
        test_recipe:
          setup:
            - "Firm with a managing partner, an engagement partner, a QC director and a 2026 inspection still in PLANNING."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_insp
          trigger:
            - call: "POST /internal-inspections/${insp_id}/selections"
              payload: {}
              as: EngagementPartner
              as_user_id: "${ep_id}"
              captures: { role_err: "$.data.error_id" }
          assert:
            - "HTTP 403 and data.error_id == \"ERR_ROLE_NOT_PERMITTED\""
            - "a follow-up GET /internal-inspections/${insp_id} returns state == \"PLANNING\", engagements_selected_count == 0 and version == 1"
            - "the identical call as QualityControlDirector with X-User-ID ${qcd_id} returns HTTP 201 and state == \"SELECTION_COMPLETE\""
            - "PATCH /partners/${ep_id} as QualityControlDirector returns 403 ERR_ROLE_NOT_PERMITTED (a FirmManagingPartner exclusive operation)"
            - "POST /peer-reviewers as FirmManagingPartner returns 403 ERR_ROLE_NOT_PERMITTED (a PeerReviewCommittee exclusive operation)"

      - name: peer_reviewer_cannot_scope_another_reviewers_review
        claim_type: peer_roles
        grounds:
          - validations.priority_13
          - errors.ERR_NOT_RESOURCE_OWNER
          - state_machines.PeerReview.PLANNING_to_SCOPE_SET
        distinguishing_aspect: >-
          Both actors hold the PeerReviewer role, so the endpoint's role list
          cannot separate them: the refusal is ownership-based (403
          ERR_NOT_RESOURCE_OWNER because X-User-ID != assigned_reviewer_id) and
          the review must stay PLANNING with total_scope_hours still null.
        test_recipe:
          setup:
            - "Scheduled 2026 peer review assigned to reviewer A, plus an unrelated reviewer B on the roster."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_reviewer
            - call: "POST /peer-reviewers"
              payload:
                reviewer_firm_name: "Halstead Peer Review LLC"
                license_state: "TX"
                qualified_categories: ["ERISA_AUDIT", "SINGLE_AUDIT", "BROKER_DEALER", "GOVERNMENTAL", "PUBLIC_INTEREST"]
                max_concurrent_reviews: 2
                experience_hours: 3000
              as: PeerReviewCommittee
              as_user_id: "prc-01"
              captures: { reviewer_b_id: "$.data.id" }
            - *k_pr
            - *k_pr_assign
          trigger:
            - call: "POST /peer-reviews/${pr_id}/scope"
              payload: {}
              as: PeerReviewer
              as_user_id: "${reviewer_b_id}"
              captures: { owner_err: "$.data.error_id" }
          assert:
            - "HTTP 403 and data.error_id == \"ERR_NOT_RESOURCE_OWNER\""
            - "a follow-up GET /peer-reviews/${pr_id} returns state == \"PLANNING\", total_scope_hours == null and unallocated_hours == null"
            - "the identical call as PeerReviewer with X-User-ID ${reviewer_id} returns HTTP 200 and state == \"SCOPE_SET\""
            - "reviewer B attempting POST /peer-reviews/${pr_id}/selections or DELETE /peer-reviews/${pr_id}/selections/{selection_id} also returns 403 ERR_NOT_RESOURCE_OWNER"
            - "an EngagementQualityReviewer transitioning a quality review whose reviewer_partner_id is another partner likewise returns 403 ERR_NOT_RESOURCE_OWNER"

      - name: qc_director_cannot_raise_a_finding_on_his_own_engagement
        claim_type: Segregation of duties
        grounds:
          - validations.priority_40
          - errors.ERR_SEGREGATION_OF_DUTIES
          - entities.Partner.designations
        distinguishing_aspect: >-
          One partner holds both ENGAGEMENT_PARTNER and QC_DIRECTOR, so the role
          check at priority 2 passes and only the identity comparison at priority
          40 can refuse the call: raising a finding on the engagement he
          personally led is 403 ERR_SEGREGATION_OF_DUTIES, and
          InspectionSelection.finding_count must stay 0.
        test_recipe:
          setup:
            - "Dual-designated partner (ENGAGEMENT_PARTNER + QC_DIRECTOR) led the firm's only released engagement, which the 2026 inspection then selected."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_qcd
            - call: "POST /firms/${firm_id}/partners"
              payload:
                full_name: "Tobias Reyes"
                cpa_license_state: "TX"
                designations: ["ENGAGEMENT_PARTNER", "QC_DIRECTOR"]
                cpe_hours_last_3y: 100
              as: SystemAdmin
              as_user_id: "sysadmin-01"
              captures: { dual_id: "$.data.id" }
            - call: "POST /engagements"
              payload:
                firm_id: "${firm_id}"
                client_name: "Kestrel Foundry Co"
                engagement_type: "REVIEW"
                period_end: "2026-02-28"
                engagement_partner_id: "${dual_id}"
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { eng_dual_id: "$.data.id" }
            - call: "POST /engagements/${eng_dual_id}/workflow-transitions"
              payload: { to_state: "FIELDWORK" }
              as: EngagementPartner
              as_user_id: "${dual_id}"
            - call: "POST /engagements/${eng_dual_id}/workflow-transitions"
              payload: { to_state: "EQR_PENDING" }
              as: EngagementPartner
              as_user_id: "${dual_id}"
            - call: "POST /engagements/${eng_dual_id}/workflow-transitions"
              payload: { to_state: "EQR_CLEARED" }
              as: EngagementPartner
              as_user_id: "${dual_id}"
            - call: "POST /engagements/${eng_dual_id}/workflow-transitions"
              payload: { to_state: "REPORT_RELEASED" }
              as: EngagementPartner
              as_user_id: "${dual_id}"
            - *k_insp
            - *k_insp_select
            - call: "GET /inspection-selections"
              payload: { inspection_id: "${insp_id}" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { sel_dual_id: "$.data[0].id" }
            - *k_insp_inprog
          trigger:
            - call: "POST /inspection-selections/${sel_dual_id}/findings"
              payload:
                title: "Estimate testing lacked corroborating evidence"
                sqm_component: "ENGAGEMENT_PERFORMANCE"
              as: QualityControlDirector
              as_user_id: "${dual_id}"
              captures: { sod_err: "$.data.error_id" }
          assert:
            - "HTTP 403 and data.error_id == \"ERR_SEGREGATION_OF_DUTIES\""
            - "a follow-up GET /inspection-selections/${sel_dual_id} returns finding_count == 0"
            - "a follow-up GET /firms/${firm_id} returns open_deficiency_count == 0"
            - "the identical call as QualityControlDirector with X-User-ID ${qcd_id} returns HTTP 201 with classification == \"UNCLASSIFIED\" and state == \"IDENTIFIED\""

      - name: remediation_plan_owner_cannot_accept_his_own_plan
        claim_type: Segregation of duties
        grounds:
          - validations.priority_41
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.RemediationPlan.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: >-
          The same FirmManagingPartner legitimately owns and submits the plan
          (priority 13 requires X-User-ID == owner_partner_id on DRAFTED ->
          SUBMITTED) but is barred from accepting it (priority 41 requires
          X-User-ID != owner_partner_id) - the identical identity flips from
          mandatory to forbidden between two legs of one state machine, and the
          403 fires even though acceptance_score 8.90 clears the 7.00 gate.
        test_recipe:
          setup:
            - "Remediation ladder driven to a SUBMITTED plan whose owner_partner_id is the managing partner, scored 8.90 (STRONG, no lateness)."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_sel_lookup
            - *k_insp_inprog
            - *k_finding
            - *k_classify_def
            - *k_rca
            - *k_rca_validate
            - *k_finding_v
            - call: "POST /inspection-findings/${finding_id}/remediation-plans"
              payload:
                root_cause_analysis_id: "${rca_id}"
                owner_partner_id: "${mp_id}"
                target_completion_date: "2026-09-30"
                action_count: 4
                action_specificity_score: 8.00
                expected_finding_version: "${finding_v}"
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { plan_mp_id: "$.data.id" }
            - call: "POST /remediation-plans/${plan_mp_id}/transitions"
              payload: { to_state: "SUBMITTED", completed_action_count: 4 }
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
          trigger:
            - call: "POST /remediation-plans/${plan_mp_id}/transitions"
              payload: { to_state: "ACCEPTED" }
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { own_plan_err: "$.data.error_id" }
          assert:
            - "HTTP 403 and data.error_id == \"ERR_SEGREGATION_OF_DUTIES\""
            - "a follow-up GET /remediation-plans/${plan_mp_id} returns state == \"SUBMITTED\", accepted_at == null, acceptance_score == 8.90 and completeness_tier == \"STRONG\""
            - "a follow-up GET /inspection-findings/${finding_id} returns state == \"REMEDIATION_ASSIGNED\" (acceptance did not cascade)"
            - "the identical call as QualityControlDirector with X-User-ID ${qcd_id} returns HTTP 200 with state == \"ACCEPTED\" and accepted_at set"
            - "a RETURNED request from the owner is refused the same way, while the owner's own DRAFTED -> SUBMITTED leg succeeded above"

      - name: managing_partner_cannot_reach_another_firms_engagement
        claim_type: peer_roles
        grounds:
          - validations.priority_14
          - validations.priority_13
          - errors.ERR_CROSS_FIRM_ACCESS_DENIED
        distinguishing_aspect: >-
          Firm isolation is checked at priority 14, ahead of the ownership check
          at priority 13, so firm B's managing partner attacking firm A's
          engagement gets ERR_CROSS_FIRM_ACCESS_DENIED (403) - not
          ERR_NOT_RESOURCE_OWNER and not a 404 - while firm A's own managing
          partner reads the very same row successfully.
        test_recipe:
          setup:
            - "Two independent firms, each with a managing partner, an engagement partner and one PLANNING engagement."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
            - *k_firm_b
            - *k_mp_b
            - *k_ep_b
            - *k_eng_b
          trigger:
            - call: "GET /engagements/${eng_id}"
              as: FirmManagingPartner
              as_user_id: "${mp_b_id}"
              captures: { cross_err: "$.data.error_id" }
          assert:
            - "HTTP 403 and data.error_id == \"ERR_CROSS_FIRM_ACCESS_DENIED\""
            - "the identical GET as FirmManagingPartner with X-User-ID ${mp_id} returns HTTP 200 with client_name == \"Aurora Metals Inc\""
            - "POST /engagements/${eng_id}/workflow-transitions {to_state: FIELDWORK} as FirmManagingPartner ${mp_b_id} returns 403 ERR_CROSS_FIRM_ACCESS_DENIED, not ERR_NOT_RESOURCE_OWNER (priority 14 outranks priority 13)"
            - "GET /firms/${firm_id} as FirmManagingPartner ${mp_b_id} returns 403 ERR_CROSS_FIRM_ACCESS_DENIED"
            - "a follow-up GET /engagements/${eng_id} as ${mp_id} returns workflow_state == \"PLANNING\" and version == 1 (no write leaked through)"

      - name: quality_risk_creation_is_shared_while_response_design_is_not
        claim_type: Shared Operation
        grounds:
          - roles.FirmManagingPartner.shared_operations
          - roles.QualityControlDirector.exclusive_operations
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: >-
          The two firm-side quality roles genuinely share risk creation - the
          managing partner's POST succeeds with the same auto-advance to ASSESSED
          - yet the very next step in the same aggregate, designing the response,
          is QC-director-exclusive and refuses the managing partner with 403
          ERR_ROLE_NOT_PERMITTED. Sharing is per endpoint, not per aggregate.
        test_recipe:
          setup:
            - "Firm with a managing partner and a QC director and no quality risks yet."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
          trigger:
            - call: "POST /firms/${firm_id}/quality-risks"
              payload:
                component: "GOVERNANCE_LEADERSHIP"
                quality_objective_code: "GL-01"
                risk_statement: "Firm leadership may not reinforce quality objectives in partner evaluations."
                likelihood: 3
                impact: 4
              as: FirmManagingPartner
              as_user_id: "${mp_id}"
              captures: { risk_gl_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "data.state == \"ASSESSED\" and data.inherent_risk_score == 12"
            - "data.response_count == 0 and data.version == 1"
            - "POST /quality-risks/${risk_gl_id}/responses as FirmManagingPartner ${mp_id} returns 403 ERR_ROLE_NOT_PERMITTED (QualityControlDirector exclusive)"
            - "the same responses call as QualityControlDirector ${qcd_id} returns HTTP 201 and drives the risk to state == \"RESPONDED\""
            - "POST /firms/${firm_id}/quality-risks as EngagementPartner ${ep_id} returns 403 ERR_ROLE_NOT_PERMITTED (not one of the sharing pair)"

  # =====================================================================
  # 8. CROSS-CUTTING COMPLEXITY LAYERS - §1.0 declares cascading_side_effects,
  #    dual_variant_calculation, optimistic_concurrency and selector_policy.
  #    One OCC instance per §1.2.1 concurrency_rules entry, plus the two
  #    five-link cascades. (dual_variant_calculation and selector_policy are
  #    exercised in the calculations section above.)
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: eqr_assignment_with_a_stale_engagement_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.eqr-assign-stale-engagement
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: >-
          The client holds the version it read at engagement creation (1) while
          the PLANNING -> FIELDWORK transition has already bumped the engagement
          to 2, so the assignment is refused with 412 ERR_STALE_VERSION even
          though the engagement is inside the EQR window and the reviewer is
          fully eligible - no EngagementQualityReview row is created and
          Partner.open_eqr_count stays 0.
        test_recipe:
          setup:
            - "ERISA_AUDIT engagement moved to FIELDWORK after the client captured its create-time version, plus an eligible EQ reviewer."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eqrp
            - *k_eng2
            - *k_eng2_fw
          trigger:
            - call: "POST /engagements/${eng2_id}/quality-reviews"
              payload:
                reviewer_partner_id: "${eqrp_id}"
                objectivity_attested: true
                expected_engagement_version: "${eng2_v_create}"
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { stale_err: "$.data.error_id" }
          assert:
            - "HTTP 412 and data.error_id == \"ERR_STALE_VERSION\""
            - "a follow-up GET /engagements/${eng2_id} returns version == 2, workflow_state == \"FIELDWORK\" and eqr_required == true"
            - "a follow-up GET /partners/${eqrp_id} returns open_eqr_count == 0"
            - "a follow-up GET /quality-reviews?engagement_id=${eng2_id} returns total_count == 0"

      - name: eqr_assignment_with_the_observed_version_succeeds_and_bumps_the_parent
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.eqr-assign-stale-engagement
          - endpoints.POST_engagements_engagement_id_quality-reviews
        distinguishing_aspect: >-
          The happy-path half of the same OCC rule: passing the version observed
          after the FIELDWORK transition (2) is accepted, and the write bumps the
          *parent* engagement to 3 even though the created row is an
          EngagementQualityReview - so a second assignment replaying version 2
          would now be stale.
        test_recipe:
          setup:
            - "Same firm, ERISA_AUDIT engagement in FIELDWORK, eligible EQ reviewer with 150 CPE hours and no prior engagement with the client."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eqrp
            - *k_eng2
            - *k_eng2_fw
          trigger:
            - *k_eqr
          assert:
            - "HTTP 201"
            - "data.state == \"ASSIGNED\" and data.reviewer_partner_id == \"${eqrp_id}\""
            - "data.cooling_off_days_at_assignment == null (the reviewer never served on this engagement's client team)"
            - "a follow-up GET /engagements/${eng2_id} returns version == 3 (the parent is bumped by the child write)"
            - "a follow-up GET /partners/${eqrp_id} returns open_eqr_count == 1"
            - "replaying the identical call with expected_engagement_version 2 now returns 412 ERR_STALE_VERSION"

      - name: remediation_plan_create_with_a_pre_validation_finding_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.remediation-plan-create-stale-finding
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: >-
          The stale view is created by the finding's own RCA ladder: the client
          reads the finding while it is RCA_PENDING, then the analysis create and
          its validation each bump the finding, so attaching the plan with the
          pre-ladder version is 412 ERR_STALE_VERSION - distinct from
          ERR_RCA_NOT_VALIDATED, which would fire on the same endpoint if the
          analysis had not been validated.
        test_recipe:
          setup:
            - "DEFICIENCY finding whose version was captured immediately after classification, then walked through a VALIDATED FISHBONE analysis."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_sel_lookup
            - *k_insp_inprog
            - *k_finding
            - *k_classify_def
            - call: "GET /inspection-findings/${finding_id}"
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { finding_v_stale: "$.data.version" }
            - *k_rca
            - *k_rca_validate
          trigger:
            - call: "POST /inspection-findings/${finding_id}/remediation-plans"
              payload:
                root_cause_analysis_id: "${rca_id}"
                owner_partner_id: "${ep_id}"
                target_completion_date: "2026-09-30"
                action_count: 4
                action_specificity_score: 8.00
                expected_finding_version: "${finding_v_stale}"
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
              captures: { plan_stale_err: "$.data.error_id" }
          assert:
            - "HTTP 412 and data.error_id == \"ERR_STALE_VERSION\""
            - "a follow-up GET /inspection-findings/${finding_id} returns state == \"RCA_COMPLETE\" and a version strictly greater than ${finding_v_stale}"
            - "a follow-up GET /remediation-plans?finding_id=${finding_id} returns total_count == 0"
            - "re-reading the finding and replaying the call with the freshly observed version returns HTTP 201 with state == \"DRAFTED\" and completed_action_count == 0"

      - name: peer_review_selection_with_a_pre_scope_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.peer-review-selection-stale-review
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: >-
          Here the parent bump comes from the hours budget itself: the scope run
          writes total_scope_hours and unallocated_hours and bumps the review, so
          committing hours against the version observed before the scope run is
          412 ERR_STALE_VERSION and unallocated_hours must remain the untouched
          40 rather than 28.
        test_recipe:
          setup:
            - "Peer review with an assigned reviewer whose version was captured before the scope run, then scoped to 40 hours."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_reviewer
            - *k_pr
            - *k_pr_assign
            - call: "GET /peer-reviews/${pr_id}"
              as: PeerReviewCommittee
              as_user_id: "prc-01"
              captures: { pr_v_pre_scope: "$.data.version" }
            - *k_pr_scope
          trigger:
            - call: "POST /peer-reviews/${pr_id}/selections"
              payload:
                engagement_id: "${eng_id}"
                hours_committed: 12
                expected_peer_review_version: "${pr_v_pre_scope}"
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
              captures: { sel_stale_err: "$.data.error_id" }
          assert:
            - "HTTP 412 and data.error_id == \"ERR_STALE_VERSION\""
            - "a follow-up GET /peer-reviews/${pr_id} returns state == \"SCOPE_SET\", total_scope_hours == 40 and unallocated_hours == 40"
            - "a follow-up GET /peer-review-selections?peer_review_id=${pr_id} returns total_count == 0"
            - "replaying the identical call with expected_peer_review_version ${pr_v_scope} returns HTTP 201 and unallocated_hours == 28"

      - name: material_failure_classification_fires_all_five_cascade_links
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_inspection-findings_finding_id_classification
          - calculations.firm_risk_posture
          - state_machines.file_state.LOCKED_to_OPEN
          - state_machines.QualityRisk.EVALUATED_to_RESPONDED
          - errors.ERR_ACCEPTANCE_FROZEN
        distinguishing_aspect: >-
          One classification call must be observable in five different
          aggregates: the finding (RCA_PENDING, class_points 20), the
          engagement's documentation file (LOCKED -> OPEN, reopened_count 1), the
          QualityRisk sharing the finding's sqm_component (EVALUATED ->
          RESPONDED, reopen_count 1), the firm (open_material_failure_count 1,
          critical_risk_count back to 0, risk_posture CRITICAL) and the firm's
          acceptance gate (a new ERISA_AUDIT is now frozen). Link 3 dropping the
          risk out of EVALUATED is what makes critical_risk_count fall to 0 while
          the posture still rises to CRITICAL - the two counters move in
          opposite directions in the same request.
        test_recipe:
          setup:
            - "Released engagement with a LOCKED documentation file, a CRITICAL EVALUATED ENGAGEMENT_PERFORMANCE risk (inherent 25, residual 16.25 on DESIGN_BASIS), and an in-progress 2026 inspection carrying one unclassified finding on the same component."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_file_assembled
            - *k_file_locked
            - *k_risk_a
            - *k_resp_a1
            - *k_test_a1
            - call: "POST /quality-risks/${risk_a_id}/evaluations"
              payload: { basis: "DESIGN_BASIS" }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
            - *k_insp
            - *k_insp_select
            - *k_sel_lookup
            - *k_insp_inprog
            - *k_finding
          trigger:
            - call: "POST /inspection-findings/${finding_id}/classification"
              payload: { classification: "MATERIAL_FAILURE", pervasiveness: "PERVASIVE", affects_report_conclusion: true }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
          assert:
            - "HTTP 200"
            - "data.classification == \"MATERIAL_FAILURE\", data.class_points == 20 and data.state == \"RCA_PENDING\""
            - "a follow-up GET /engagements/${eng_id} returns file_state == \"OPEN\" and reopened_count == 1 (link 2)"
            - "a follow-up GET /quality-risks/${risk_a_id} returns state == \"RESPONDED\", reopen_count == 1, residual_risk_score == null, severity_band == \"NONE\" and evaluation_basis == \"NONE\" (link 3 invalidates the monitoring conclusion)"
            - "a follow-up GET /firms/${firm_id} returns open_material_failure_count == 1, open_deficiency_count == 1, critical_risk_count == 0 and risk_posture == \"CRITICAL\" (link 4)"
            - "POST /engagements with engagement_type ERISA_AUDIT for ${firm_id} now returns 409 ERR_ACCEPTANCE_FROZEN (link 5's gate)"
            - "a new REVIEW engagement created for ${firm_id} comes back with eqr_required == true even though its risk_score is 8 (link 5 forces EQR under a CRITICAL posture)"

      - name: corrective_action_rejection_synthesizes_the_follow_up_review
        claim_type: cascading_side_effects
        grounds:
          - endpoints.POST_corrective-action-plans_cap_id_disposition
          - state_machines.PeerReview.REMEDIATION_SUBMITTED_to_FOLLOW_UP_REQUIRED
          - entities.PeerReview.prior_peer_review_id
          - calculations.firm_risk_posture
        distinguishing_aspect: >-
          Rejecting the evidence must synthesize a *new* self-referential
          PeerReview - is_follow_up true, prior_peer_review_id pointing at the
          rejected cycle, window 2026-10-15 + 180 days = 2027-04-13 through
          2027-04-27 - while the original review moves to FOLLOW_UP_REQUIRED and
          only now writes Firm.last_peer_review_rating, driving the posture to
          ELEVATED for a PASS_WITH_DEFICIENCY rating.
        test_recipe:
          setup:
            - "PASS_WITH_DEFICIENCY report issued 2026-08-01, its MONITORING_VISIT plan evidenced on time, awaiting committee disposition."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_insp_inprog
            - *k_insp_classified
            - *k_insp_concluded
            - *k_reviewer
            - *k_pr
            - *k_pr_assign
            - *k_pr_scope
            - *k_pr_sel_lim
            - *k_pr_fieldwork
            - *k_pr_disp_ffc
            - *k_pr_rating
            - *k_pr_issue
            - call: "GET /corrective-action-plans?peer_review_id=${pr_id}"
              as: PeerReviewCommittee
              as_user_id: "prc-01"
              captures: { cap_rej_id: "$.data[0].id" }
            - call: "POST /corrective-action-plans/${cap_rej_id}/evidence"
              payload: { evidence_summary: "Monitoring visit performed; supervision checklist adopted firm-wide." }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
          trigger:
            - call: "POST /corrective-action-plans/${cap_rej_id}/disposition"
              payload: { outcome: "REJECTED" }
              as: PeerReviewCommittee
              as_user_id: "prc-01"
          assert:
            - "HTTP 200"
            - "data.status == \"REJECTED\" and data.rejection_count == 1"
            - "a follow-up GET /peer-reviews/${pr_id} returns state == \"FOLLOW_UP_REQUIRED\" and rating == \"PASS_WITH_DEFICIENCY\" (link 2)"
            - "a follow-up GET /peer-reviews?prior_peer_review_id=${pr_id} returns total_count == 1 with state == \"SCHEDULED\", is_follow_up == true, review_type == \"SYSTEM_REVIEW\", year_end == \"2026-06-30\", scheduled_window_start == \"2027-04-13\" and scheduled_window_end == \"2027-04-27\" (link 3)"
            - "a follow-up GET /firms/${firm_id} returns last_peer_review_rating == \"PASS_WITH_DEFICIENCY\" and risk_posture == \"ELEVATED\" (link 4)"
            - "a follow-up GET /peer-reviewers/${reviewer_id} returns active_review_count == 0 (link 3 released the slot and the synthesized follow-up has no reviewer yet)"
            - "POST /engagements with engagement_type SINGLE_AUDIT for ${firm_id} still succeeds under the ELEVATED posture and comes back with eqr_required == true (ERR_ACCEPTANCE_FROZEN is CRITICAL-only)"

  # =====================================================================
  # 9. CONSISTENCY MODEL - §1.0 declares consistency_model: immediate, so every
  #    denormalized counter and every cascaded field must already be correct in
  #    the response body of the request that caused it, not on a later re-read.
  # =====================================================================
  - section: consistency_model
    instances:
      - name: classification_response_already_carries_the_cascaded_counters
        claim_type: immediate
        grounds:
          - endpoints.POST_inspection-findings_finding_id_classification
          - entities.Firm.open_deficiency_count
          - calculations.firm_risk_posture
        distinguishing_aspect: >-
          The classification response and an immediate re-read of the firm must
          agree exactly: open_deficiency_count is already 1 in the same request
          that classified the finding, so there is no window in which the finding
          reads SIGNIFICANT_DEFICIENCY while the firm still reads 0. The posture
          is the falsifier - one deficiency is below the ELEVATED threshold of 5,
          so it must stay STABLE rather than drift upward on a later re-read.
        test_recipe:
          setup:
            - "Firm with one released engagement and an in-progress 2026 inspection carrying one unclassified finding; the firm's counters are all still at their creation defaults."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_qcd
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_insp
            - *k_insp_select
            - *k_sel_lookup
            - *k_insp_inprog
            - *k_finding
          trigger:
            - call: "POST /inspection-findings/${finding_id}/classification"
              payload: { classification: "SIGNIFICANT_DEFICIENCY", pervasiveness: "SYSTEMIC", affects_report_conclusion: false }
              as: QualityControlDirector
              as_user_id: "${qcd_id}"
          assert:
            - "HTTP 200"
            - "data.classification == \"SIGNIFICANT_DEFICIENCY\", data.class_points == 8, data.state == \"RCA_PENDING\" and data.version == 2"
            - "a GET /firms/${firm_id} issued immediately afterwards returns open_deficiency_count == 1, open_material_failure_count == 0 and risk_posture == \"STABLE\" (one deficiency is below the ELEVATED threshold of 5)"
            - "a GET /inspection-selections/${sel_id} issued immediately afterwards returns finding_count == 1 and weighted_points == 0.00 (the index is only written at FINDINGS_CLASSIFIED)"
            - "no second read is required for any of the above: the values never change between the classification response and the follow-up reads"

      - name: selection_response_already_debits_the_hours_budget
        claim_type: immediate
        grounds:
          - endpoints.POST_peer-reviews_peer_review_id_selections
          - entities.PeerReview.unallocated_hours
          - calculations.peer_review_hours_scope
        distinguishing_aspect: >-
          The hours-conservation invariant is enforced synchronously: the
          selection create response already shows the review at unallocated_hours
          28 (40 - 12), so committed + unallocated == total_scope_hours holds at
          every observable instant rather than converging afterwards.
        test_recipe:
          setup:
            - "Peer review scoped to 40 hours with one released REVIEW engagement available for selection and unallocated_hours still 40."
          setup_api_calls:
            - *k_clock
            - *k_firm
            - *k_mp
            - *k_ep
            - *k_eng
            - *k_eng_fw
            - *k_eng_eqrp
            - *k_eng_cleared
            - *k_eng_released
            - *k_reviewer
            - *k_pr
            - *k_pr_assign
            - *k_pr_scope
          trigger:
            - call: "POST /peer-reviews/${pr_id}/selections"
              payload:
                engagement_id: "${eng_id}"
                hours_committed: 12
                expected_peer_review_version: "${pr_v_scope}"
              as: PeerReviewer
              as_user_id: "${reviewer_id}"
              captures: { sel_now_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "data.hours_committed == 12, data.status == \"COMMITTED\", data.disposition == \"NONE\", data.must_select_category == null and data.is_scope_limitation == false"
            - "a GET /peer-reviews/${pr_id} issued immediately afterwards returns total_scope_hours == 40 and unallocated_hours == 28"
            - "a GET /peer-review-selections?peer_review_id=${pr_id} issued immediately afterwards returns total_count == 1 with id == ${sel_now_id}"
            - "12 + 28 == 40 holds in the very response that created the selection - the sum is never transiently 40 + 12"
