              captures: {below_points: $.data.suspension_points_assessed, below_repair: $.data.assessed_repair_cents}
            - call: "POST /damage-assessments/${d2_id}/finalize"
              payload: {}
              as: FacilitiesManager
              as_user_id: "fac-1"
              captures: {at_points: $.data.suspension_points_assessed, at_repair: $.data.assessed_repair_cents}
          assert:
            - "${below_repair} == 49999 and ${below_points} == 1 — MINOR base only, because 49999 < REPAIR_ESCALATION_CENTS"
            - "${at_repair} == 50000 and ${at_points} == 2 — the threshold is inclusive (>=), so the escalation point is added at exactly 50000"
            - "Producer.${p1_id}.suspension_points == 1 and Producer.${p2_id}.suspension_points == 2; both remain ACTIVE because SUSPENSION_THRESHOLD_POINTS is 3"
            - "Producer.${p1_id}.certification_level == BASIC and Producer.${p2_id}.certification_level == BASIC — no suspension means no certification reset"
            - "Reservation.${r1_id}.uncovered_liability_cents == 37037 and Reservation.${r2_id}.uncovered_liability_cents == 37038 — the one-cent input difference lands one-for-one on the uncovered figure"
            - "Both reservations show deposit_forfeited_cents 12962, deposit_refunded_cents 0 and late_fee_cents 0 (both were returned before their end_at)"
            - "StudioResource.${res_id}.open_reservation_count == 0"

