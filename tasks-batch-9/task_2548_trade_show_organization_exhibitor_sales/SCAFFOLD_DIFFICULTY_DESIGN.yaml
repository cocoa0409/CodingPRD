            - "After the sign: Booth.${b_a}.status == ASSIGNED and SpaceContract.${sc1}.points_awarded == 4"
            - "After the cancel: Show.${show_id}.available_net_sqft == 600, held_net_sqft == 0, assigned_net_sqft == 0, committed_ratio_pct == 0, floor_posture == OPEN"
            - "After the cancel: sellable_booth_sqft == 600 == available_net_sqft + held_net_sqft + assigned_net_sqft (INVARIANT A)"
            - "After the cancel: Booth.${b_a}.status == AVAILABLE with space_contract_id == null; Booth.${b_c}.status == AVAILABLE (untouched)"
            - "After the cancel: SpaceContract.${sc1}.status == CANCELLED, points_awarded == 0, cancellation_fee_cents == 389070, fee_applied_to_deposit_cents == 389070, refund_cents == 10930, balance_due_cents == 0"

