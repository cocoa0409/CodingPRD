  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: itinerary_publish_cascades_to_sailing_revenue_alert
        grounds:
          - state_machines.ItineraryChange.DRAFT_to_PUBLISHED
          - calculations.itinerary_compensation
          - calculations.booking_onboard_projection
          - calculations.sailing_ralbd
          - entities.Sailing.fields.revenue_alert
        distinguishing_aspect: |
          One publish call propagates through five entity hops: ItineraryChange.status ->
          Booking.itinerary_compensation_obc_cents / itinerary_refund_cents ->
          Booking.projected_onboard_net_cents and balance_due_cents ->
          Sailing.projected_onboard_revenue_cents / compensation_liability_cents ->
          Sailing.ralbd_net_cents -> Sailing.revenue_alert, flipping the alert from false to
          true (20000 -> 18275). No hop is skippable: the alert only moves because the onboard
          projection was reduced by the onboard credit AND the refund was booked as liability.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing PRT-2701 with 4 lower berths over 5 nights, embark 2027-03-01T16:00:00Z, OPEN_FOR_SALE."
            - "One OV allotment of 2 physical cabins and a single 730..0 fare window at base 145000."
            - "One OPTION booking of 2 adults: net_ticket_cents 290000, projected_onboard_gross_cents 110000, projected_onboard_net_cents 110000, no payments posted."
            - "Sailing therefore sits exactly on the alert floor: total revenue 400000 over 20 available lower berth days, ralbd_net_cents 20000 and revenue_alert false."
            - "A DRAFT ItineraryChange of kind PORT_CANCELLED with compensation_policy OBC_PLUS_REFUND_PCT exists, so obc_per_guest_cents == 5000 and refund_pct == 0.05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "OV", tier_rank: 2, max_occupancy: 4, onboard_spend_lower_per_night_cents: 11000, onboard_spend_upper_per_night_cents: 7000 }
              as: RevenueManager
              captures: { cat_ov: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "BOREAL", voyage_code: "PRT-2701", embark_date: "2027-03-01T16:00:00Z", nights: 5, total_lower_berths: 4, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_p: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_p}", cabin_category_id: "${cat_ov}", physical_cabins: 2, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_p: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_p}", cabin_category_id: "${cat_ov}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 145000, third_berth_fare_cents: 50000, fourth_berth_fare_cents: 40000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_p}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_none: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_p}", cabin_category_id: "${cat_ov}", guest_id: "${g_none}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_c: $.data.id }
            - call: "POST /itinerary-changes"
              payload: { sailing_id: "${sail_p}", kind: "PORT_CANCELLED", affected_port_code: "GRC", compensation_policy: "OBC_PLUS_REFUND_PCT" }
              as: PortOpsCoordinator
