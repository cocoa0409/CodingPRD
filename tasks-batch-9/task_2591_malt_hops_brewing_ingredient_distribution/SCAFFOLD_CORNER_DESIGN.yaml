      - name: carry_forward_cap_is_a_share_of_the_original_contracted_pounds
        claim_type: threshold
        grounds:
          - calculations.carry_forward_eligibility
          - validations[priority=36]
          - errors.ERR_CARRY_FORWARD_EXCEEDS_CAP
        distinguishing_aspect: "The 25 percent cap is measured against the ORIGINAL 5000 lbs, so a contract already drawn down to 1000 remaining can still roll all 1000 — a cap computed from remaining_lbs would allow only 250 and would wrongly refuse the request."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 3000000; OPEN crop-year programs 2026 and 2027."
            - "Citra variety; a 5000 lb FIXED_CROP_YEAR Citra contract at 250.00 with delivery window 2026-09-01 to 2026-12-31."
            - "An order for 4000 lbs on that contract, confirmed, so committed_lbs is 4000 and remaining_lbs is 1000."
            - "The 2026 program then reports a 100.00 percent harvest, leaving the contract ACTIVE with allocated_lbs 5000 and moving the program to HARVEST_REPORTED, which the carry-forward request requires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Carry Forward Cap Brewing", brewery_license_no: "BR-1019", credit_terms_days: 30, credit_limit_cents: 3000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { cf_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2026, contract_open_date: "2026-01-15T00:00:00Z", harvest_report_due_date: "2026-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { cf_prog26_id: $.data.id }
            - call: "POST /crop-year-programs"
              payload: { crop_year: 2027, contract_open_date: "2027-01-15T00:00:00Z", harvest_report_due_date: "2027-10-01T00:00:00Z" }
              as: AllocationManager
              captures: { cf_prog27_id: $.data.id }
            - call: "POST /hop-varieties"
              payload: { variety_code: "CITRA", name: "Citra", substitution_group: "AROMA_HIGH_ALPHA", alpha_acid_target_pct: 12.50, spot_price_cents_per_lb: 51.00, available_spot_lbs: 20000, cold_storage_required: true, pallet_quantity_lbs: 880, min_order_lbs: 44 }
              as: AllocationManager
              captures: { cf_citra_id: $.data.id }
            - call: "POST /hop-contracts"
              payload: { brewer_id: "${cf_id}", variety_id: "${cf_citra_id}", crop_year_program_id: "${cf_prog26_id}", contract_type: "FIXED_CROP_YEAR", contracted_lbs: 5000, price_per_lb_cents: 250.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-12-31T00:00:00Z" }
              as: AllocationManager
              captures: { cf_k_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { brewer_id: "${cf_id}", requested_ship_date: "2026-09-20T00:00:00Z", purchase_order_ref: "PO-CF" }
              as: Brewer
              as_user_id: "${cf_id}"
              captures: { cf_o_id: $.data.id }
            - call: "POST /sales-orders/${cf_o_id}/lines"
              payload: { item_type: "HOP", quantity: 4000, uom: "LB", allocation_source: "CONTRACT", hop_contract_id: "${cf_k_id}" }
              as: Brewer
              as_user_id: "${cf_id}"
            - call: "POST /sales-orders/${cf_o_id}/confirm"
              payload: {}
              as: Brewer
              as_user_id: "${cf_id}"
            - call: "POST /crop-year-programs/${cf_prog26_id}/report-harvest"
              payload: { harvest_yield_pct: 100.00, reported_note: "full crop" }
              as: AllocationManager
          trigger:
            - call: "POST /hop-contracts/${cf_k_id}/carry-forward-requests"
              payload: { carry_forward_target_program_id: "${cf_prog27_id}", requested_lbs: 1001, justification: "one pound over the eligible amount" }
              as: Brewer
              as_user_id: "${cf_id}"
              captures: { cf_err: $.data.error_id }
            - call: "POST /hop-contracts/${cf_k_id}/carry-forward-requests"
              payload: { carry_forward_target_program_id: "${cf_prog27_id}", requested_lbs: 1000, justification: "roll the whole remainder" }
              as: Brewer
              as_user_id: "${cf_id}"
              captures: { cf_req: $.data.carry_forward_requested_lbs, cf_fee: $.data.carry_forward_fee_cents, cf_status: $.data.status }
          assert:
            - "setup: HopContract.${cf_k_id}.committed_lbs == 4000, remaining_lbs == 1000, allocated_lbs == 5000 and status == ACTIVE; SalesOrder.${cf_o_id}.total_cents == 1055500"
            - "cap_lbs == floor(5000 * 25 / 100) == 1250 and eligible_lbs == min(1250, 1000) == 1000"
            - "requesting 1001: HTTP 422 with ${cf_err} == ERR_CARRY_FORWARD_EXCEEDS_CAP, and HopContract.${cf_k_id}.status is still ACTIVE with carry_forward_requested_lbs == null"
            - "requesting exactly 1000: HTTP 200, ${cf_status} == CARRY_FORWARD_PENDING and ${cf_req} == 1000"
            - "${cf_fee} == 20000 — round_half_up(1000 * 250.00 * 8 / 100)"
            - "HopContract.${cf_k_id}.carry_forward_target_program_id == ${cf_prog27_id}, carried_forward_out_lbs == 0 and remaining_lbs == 1000 — nothing moves until the decision"
            - "Brewer.${cf_id}.ar_balance_cents == 0 — the carry-forward fee is booked on approval, not on request"
            - "a cap derived from remaining_lbs would be floor(1000 * 25 / 100) == 250 and would have refused the accepted 1000 lb request"

      - name: draft_line_deletion_reprices_the_aggregate_rollup
        claim_type: aggregation
        grounds:
          - calculations.order_subtotal_rollup
          - endpoints[DELETE /sales-orders/{id}/lines/{line_id}]
          - state_machines.OrderLine.transitions[OPEN->REMOVED]
        distinguishing_aspect: "Deleting a line must re-derive the whole aggregate rather than subtract the line's own contribution: subtotal_cents, chargeable_lbs, line_count AND requires_cold_chain are all rewritten, so removing the only cold-chain line flips the order back to ambient while the fee fields stay untouched until confirm."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Brewer with credit_limit_cents 5000000; Citra requiring reefer; RELEASED 5000 lb PALE-ALE lot."
            - "DRAFT order carrying one 880 lb SPOT Citra line and one 1000 lb MALT line, so requires_cold_chain is true."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /brewers"
              payload: { name: "Reprice On Delete Brewing", brewery_license_no: "BR-1020", credit_terms_days: 30, credit_limit_cents: 5000000, cold_chain_certified: true, legacy_trailing_lbs: 0 }
              as: CreditManager
              captures: { rd_id: $.data.id }
            - call: "POST /hop-varieties"
