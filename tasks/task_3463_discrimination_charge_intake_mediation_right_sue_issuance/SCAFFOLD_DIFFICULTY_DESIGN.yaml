              as: IntakeOfficer
              captures: { med_i2: $.data.id }
            - call: "POST /eeoc/mediation-cases/${med_i2}/respond"
              payload: { response: "DECLINED" }
              as: ChargingParty
              as_user_id: "${cp_19}"
            - call: "GET /eeoc/charges/${chg_i2}"
              as: Director
              captures: { inv_i2: $.data.investigation_case_id }
