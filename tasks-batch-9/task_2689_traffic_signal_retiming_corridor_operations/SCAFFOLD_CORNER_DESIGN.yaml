          - entities.Intersection
          - endpoints[POST /signal-ops/priority-configs]
        distinguishing_aspect: "The second OCC rule guards a DIFFERENT parent with a DIFFERENT error code, and it is invalidated from two directions: by the proposing engineer's own previous config (each create increments Intersection.version) and by a completely unrelated SignalOpsAdmin PATCH of the inventory row. That second case is the rule's stated purpose — the intersection's version moves whenever its priority budget could be recomputed — so an engineer holding a token from before the admin's edit is refused rather than silently re-ranked."
