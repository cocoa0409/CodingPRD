            - call: "POST /pickups/${pk1_id}/complete"
              payload: { expected_cart_version: "${cart_v}" }
              as: Driver
            - call: "POST /pickups/${pk1_id}/weight-ticket"
              payload: { gross_weight_lbs: 250, diverted: false }
              as: Driver
            - call: "POST /pickups/${pk1_id}/contamination-tags"
              payload: { severity: "MAJOR", note: "wrong stream" }
              as: Driver
            - call: "POST /pickups/${pk2_id}/complete"
              payload: { expected_cart_version: "${cart_v}" }
              as: Driver
            - call: "POST /pickups/${pk2_id}/weight-ticket"
