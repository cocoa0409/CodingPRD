            - { call: "POST /litigation/conflict-checks/${cc19}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${r19}/credential-reviews", payload: { expert_id: "${e19}" }, as: CredentialAnalyst, captures: { cr19: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${cr19}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${r19}", expert_id: "${e19}", hourly_rate_cents: 40000, retainer_cents: 0, expense_cap_cents: 0 }, as: CaseManager, as_user_id: "cm-1", captures: { g19: $.data.id } }
            - { call: "POST /litigation/engagements/${g19}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g19}/sign", payload: {}, as: Expert, as_user_id: "${e19}" }
            - { call: "POST /litigation/engagements/${g19}/fund-retainer", payload: { amount_cents: 0 }, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g19}/testimony-schedules", payload: { kind: "DEPOSITION", start_at: "2026-06-15T10:00:00Z", end_at: "2026-06-15T12:00:00Z", estimated_hours: 2, venue_id: "${v19}" }, as: CaseManager, as_user_id: "cm-1", captures: { s191: $.data.id } }
          trigger:
            - call: "POST /litigation/engagements/${g19}/testimony-schedules"
              payload: { kind: "DEPOSITION", start_at: "2026-06-15T13:00:00Z", end_at: "2026-06-15T15:00:00Z", estimated_hours: 2, venue_id: "${v19}" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { err19: $.data.error_id }
            - call: "POST /litigation/engagements/${g19}/testimony-schedules"
              payload: { kind: "DEPOSITION", start_at: "2026-06-15T13:00:01Z", end_at: "2026-06-15T15:00:00Z", estimated_hours: 2, venue_id: "${v19}" }
              as: CaseManager
              as_user_id: "cm-1"
              captures: { s192: $.data.id }
          assert:
            - "err19 == ERR_VENUE_CONFLICT  (13:00 start -> buffered edge 12:30 touches closed effective end 12:30)"
            - "TestimonySchedule.${s192}.status == PROPOSED  (13:00:01 -> buffered start 12:30:01 clears the closed edge)"

  - rule_id: compensating_invariant
    instances:
      - name: retainer_funded_equals_drawn_refunded_remaining
        grounds:
          - calculations.retainer_drawdown
          - entities.Engagement.fields.retainer_remaining_cents
          - state_machines.Engagement.ACTIVE_to_TERMINATED
        distinguishing_aspect: |
          Conserved quantity: retainer money. The forward/compensating pair fund(300000) + approve(draw 100000)
          + terminate(refund 200000) must leave funded == drawn + refunded + remaining exactly, with no drift.
        test_recipe:
          setup: ["ACTIVE engagement: rate 40000, retainer 300000 fully funded; one invoice (PREP 2.5h = 100000) approved"]
          setup_api_calls:
            - { call: "POST /litigation/experts", payload: { full_name: "V Jek", specialty_area: "med" }, as: PlatformAdmin, captures: { e20: $.data.id } }
            - { call: "POST /litigation/cases", payload: { case_number: "CV-2000", court: "SDNY", title: "UU v VV", budget_cents: 1000000, trial_date: "2026-09-01T00:00:00Z", report_deadline: "2026-07-01T17:00:00Z" }, as: CaseManager, as_user_id: "cm-1", captures: { c20: $.data.id } }
            - { call: "POST /litigation/engagement-requests", payload: { case_id: "${c20}", specialty_area: "med" }, as: CaseManager, as_user_id: "cm-1", captures: { r20: $.data.id } }
            - { call: "POST /litigation/engagement-requests/${r20}/conflict-checks", payload: { expert_id: "${e20}", adverse_parties: [] }, as: ConflictAnalyst, captures: { cc20: $.data.id } }
            - { call: "POST /litigation/conflict-checks/${cc20}/resolve", payload: { outcome: "CLEARED", rationale: "ok" }, as: ConflictAnalyst }
            - { call: "POST /litigation/engagement-requests/${r20}/credential-reviews", payload: { expert_id: "${e20}" }, as: CredentialAnalyst, captures: { cr20: $.data.id } }
            - { call: "POST /litigation/credential-reviews/${cr20}/resolve", payload: { outcome: "PASSED" }, as: CredentialAnalyst }
            - { call: "POST /litigation/engagements", payload: { engagement_request_id: "${r20}", expert_id: "${e20}", hourly_rate_cents: 40000, retainer_cents: 300000, expense_cap_cents: 0 }, as: CaseManager, as_user_id: "cm-1", captures: { g20: $.data.id } }
            - { call: "POST /litigation/engagements/${g20}/propose", payload: {}, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g20}/sign", payload: {}, as: Expert, as_user_id: "${e20}" }
            - { call: "POST /litigation/engagements/${g20}/fund-retainer", payload: { amount_cents: 300000 }, as: CaseManager, as_user_id: "cm-1" }
            - { call: "POST /litigation/engagements/${g20}/invoices", payload: { period_start: "2026-05-04T00:00:00Z", period_end: "2026-05-08T00:00:00Z", line_items: [{ kind: "PREP", hours: 2.5 }], travel_expense_cents: 0, total_cents: 100000 }, as: Expert, as_user_id: "${e20}", captures: { inv20: $.data.id } }
            - { call: "POST /litigation/invoices/${inv20}/approve", payload: {}, as: BillingReviewer, as_user_id: "br-1" }
          trigger:
            - call: "POST /litigation/engagements/${g20}/terminate"
              payload: { reason: "settlement" }
              as: CaseManager
              as_user_id: "cm-1"
          assert:
            - "Engagement.${g20}.retainer_funded_cents == 300000"
            - "Engagement.${g20}.retainer_drawn_cents == 100000"
            - "Engagement.${g20}.retainer_refunded_cents == 200000"
            - "Engagement.${g20}.retainer_remaining_cents == 0"
            - "invariant: 300000 == 100000 + 200000 + 0 (fund/approve/terminate pair conserves retainer money)"

      - name: expert_active_engagement_slot_conservation
        grounds:
          - entities.Expert.fields.active_engagement_count
          - validations[priority=14]
          - errors[ERR_EXPERT_CAPACITY_FULL]
        distinguishing_aspect: |
          Conserved quantity: engagement slots (a count, not money). active_engagement_count tracks exactly the
          number of SIGNED|ACTIVE engagements; sign (+1) and terminate (-1) are compensating, and creation is
          rejected exactly at the cap (count == max).
