            - "same instant: provider response accepted (HTTP 201), submitted_at == '2026-08-15T00:00:00Z' — the deadline is inclusive for the provider"
            - "GET /peer-review/cases/${case1} -> status == 'RESPONDED'"

  # =====================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_requires_active_reviewer_member
        grounds:
          - state_machines.CommitteeMember.ACTIVE_to_INACTIVE
          - validations[priority=7]
          - errors[ERR_REVIEWER_INACTIVE]
        distinguishing_aspect: |
          Entity pair CommitteeMember -> ReviewAssignment: a valid
          assignment-create transition depends on the reviewer member's
          status == ACTIVE; after deactivation the same request is rejected.
        test_recipe:
          setup:
            - "Subject provider; member B seated then deactivated (no assignments held); case screened in"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Fifteen", specialty: "SURGERY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "SURGERY" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members/${m_b}/deactivate", as: QualityDirector }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "gate case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == 'ERR_REVIEWER_INACTIVE' with HTTP 422 — the assignment transition is gated by CommitteeMember.status on a different entity"
            - "GET /peer-review/cases/${case1}/assignments returns an empty list (no assignment persisted)"

      - name: focus_group_requires_active_focused_review
        grounds:
          - state_machines.FocusedReview.ACTIVE_to_CLOSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair FocusedReview -> FocusGroup: group creation is valid
          only while the parent focused review is ACTIVE; after close the
          same request is rejected — a different entity pair from the
          member->assignment gate.
        test_recipe:
          setup:
            - "Provider with a MANUAL FocusedReview (ACTIVE); one group already created successfully"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Sixteen", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/focused-reviews", payload: { provider_id: "${p_sub}", basis: "pattern of complaints" }, as: QualityDirector, captures: { fr1: $.data.id } }
            - { call: "POST /peer-review/focused-reviews/${fr1}/focus-groups", payload: { name: "panel-1" }, as: QualityDirector, captures: { grp1: $.data.id } }
            - { call: "POST /peer-review/focused-reviews/${fr1}/close", payload: { resolution_note: "completed" }, as: QualityDirector }
          trigger:
            - { call: "POST /peer-review/focused-reviews/${fr1}/focus-groups", payload: { name: "panel-2" }, as: QualityDirector, captures: { err: $.data.error_id } }
          assert:
            - "first group create succeeded (group id ${grp1}) while the review was ACTIVE"
            - "after close: second group create rejected with error_id == 'ERR_INVALID_STATE' (HTTP 409) — gated by FocusedReview.status on the parent entity"

      - name: finalize_quorum_requires_focus_group_membership
        grounds:
          - state_machines.ReviewCase.DELIBERATION_to_NOTIFIED
          - errors[ERR_FOCUS_PANEL_QUORUM_NOT_MET]
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair (FocusedReview x FocusGroupMember) -> ReviewCase
          deliberation finalize: when the subject has an ACTIVE
          FocusedReview, the finalize transition is gated on an aggregate
          over a third entity — at least 2 SUBMITTED reviewers must hold
          FocusGroupMember rows in that review's groups.
        test_recipe:
          setup:
            - "Subject provider; CHAIR A; members B/C/D; case in DELIBERATION with scores (4,4,4)"
            - "Subject has an ACTIVE MANUAL FocusedReview with one group; only member B added to it"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Seventeen", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Chair A", specialty: "INTERNAL_MEDICINE" }, as: QualityDirector, captures: { p_a: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "SURGERY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev D", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_d: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_a}", member_role: "CHAIR" }, as: QualityDirector, captures: { m_a: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_d}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_d: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "INCIDENT_REPORT", referred_at: "2026-07-20T00:00:00Z", description: "quorum case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_d}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_d: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_c}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_c}" }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_d}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_d}" }
            - { call: "POST /peer-review/focused-reviews", payload: { provider_id: "${p_sub}", basis: "prior trend" }, as: QualityDirector, captures: { fr1: $.data.id } }
            - { call: "POST /peer-review/focused-reviews/${fr1}/focus-groups", payload: { name: "quorum-panel" }, as: QualityDirector, captures: { grp1: $.data.id } }
            - { call: "POST /peer-review/focus-groups/${grp1}/members", payload: { member_id: "${m_b}" }, as: QualityDirector }
          trigger:
            - { call: "POST /peer-review/cases/${case1}/finalize-deliberation", payload: { rationale_note: "attempt with one panelist" }, as: CommitteeMember, as_user_id: "${m_a}", captures: { err: $.data.error_id } }
            - { call: "POST /peer-review/focus-groups/${grp1}/members", payload: { member_id: "${m_c}" }, as: QualityDirector }
            - { call: "POST /peer-review/cases/${case1}/finalize-deliberation", payload: { rationale_note: "quorum met" }, as: CommitteeMember, as_user_id: "${m_a}", captures: { rating: $.data.rating } }
          assert:
            - "first finalize rejected: error_id == 'ERR_FOCUS_PANEL_QUORUM_NOT_MET' (409) — only 1 of 3 SUBMITTED reviewers held a FocusGroupMember row"
            - "after adding member C to the group, the identical finalize succeeds and returns rating == 'APPROPRIATE'"
            - "GET /peer-review/cases/${case1} -> status == 'NOTIFIED' only after the second attempt"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: focused_review_half_open_interval_adjacency
        grounds:
          - state_machines.FocusedReview.ACTIVE_to_CLOSED
          - errors[ERR_FOCUSED_REVIEW_ALREADY_ACTIVE]
        distinguishing_aspect: |
          Resource = Provider, semantics = half-open ACTIVE interval
          [opened_at, closed_at): a second open while ACTIVE collides, but
          opening at the exact instant the prior review closed is adjacent,
          not overlapping, and succeeds.
        test_recipe:
          setup:
            - "Provider; MANUAL FocusedReview F1 opened at default clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Eighteen", specialty: "SURGERY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/focused-reviews", payload: { provider_id: "${p_sub}", basis: "first" }, as: QualityDirector, captures: { fr1: $.data.id, fr1_opened: $.data.opened_at } }
          trigger:
            - { call: "POST /peer-review/focused-reviews", payload: { provider_id: "${p_sub}", basis: "overlap attempt" }, as: QualityDirector, captures: { err: $.data.error_id } }
            - { call: "POST /peer-review/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: QualityDirector }
            - { call: "POST /peer-review/focused-reviews/${fr1}/close", payload: { resolution_note: "done" }, as: QualityDirector, captures: { fr1_closed: $.data.closed_at } }
            - { call: "POST /peer-review/focused-reviews", payload: { provider_id: "${p_sub}", basis: "adjacent reopen" }, as: QualityDirector, captures: { fr2: $.data.id, fr2_opened: $.data.opened_at } }
          assert:
            - "overlapping open rejected: error_id == 'ERR_FOCUSED_REVIEW_ALREADY_ACTIVE' (409)"
            - "F1 closed_at == '2026-08-10T00:00:00Z'"
            - "adjacent open succeeds: F2 created with opened_at == '2026-08-10T00:00:00Z' — opened_at == prior closed_at is permitted under half-open [opened_at, closed_at) semantics"
            - "GET /peer-review/providers/${p_sub}/focused-reviews?status=ACTIVE returns exactly F2"

      - name: referral_cooldown_minimum_gap_semantics
        grounds:
          - calculations.referral_cooldown_window
          - errors[ERR_DUPLICATE_REFERRAL_WINDOW]
        distinguishing_aspect: |
          Resource = ReviewCase intake stream for a subject, semantics =
          fixed 30-day minimum gap after a SCREENED_OUT terminal event:
          referrals blocked while screened_out_at > clock - 30d, allowed at
          exactly +30 days. Different interval geometry (trailing gap vs
          half-open occupancy) and different resource/endpoint from the
          focused-review instance.
        test_recipe:
          setup:
            - "Provider; case screened out at default clock so screened_out_at == 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Nineteen", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "PATIENT_COMPLAINT", referred_at: "2026-07-20T00:00:00Z", description: "first referral" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_OUT", screened_out_reason: "DUPLICATE" }, as: QualityDirector, captures: { so_at: $.data.screened_out_at } }
            - { call: "POST /peer-review/_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T00:00:00Z" }, as: QualityDirector }
          trigger:
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "STAFF_REFERRAL", referred_at: "2026-08-29T00:00:00Z", description: "too-early re-referral" }, as: PeerReviewCoordinator, captures: { err: $.data.error_id } }
            - { call: "POST /peer-review/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: QualityDirector }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "STAFF_REFERRAL", referred_at: "2026-08-31T00:00:00Z", description: "boundary re-referral" }, as: PeerReviewCoordinator, captures: { case2: $.data.id, st2: $.data.status } }
          assert:
            - "screened_out_at == '2026-08-01T00:00:00Z'"
            - "at clock 2026-08-30T00:00:00Z (29 days later): create rejected with error_id == 'ERR_DUPLICATE_REFERRAL_WINDOW' (409) — screened_out_at > clock - 30d"
            - "at clock 2026-08-31T00:00:00Z (exactly 30 days): create succeeds, new case status == 'REFERRED' — gap boundary is exclusive of the +30d instant"

  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deactivate_replace_conserves_case_panel
        grounds:
          - state_machines.CommitteeMember.ACTIVE_to_INACTIVE
          - state_machines.ReviewAssignment.PENDING_to_WAIVED
        distinguishing_aspect: |
          Conserved quantity = the case's SUBMITTED-score ledger: the
          waiver-plus-replacement pair (deactivate a PENDING reviewer, then
          assign a replacement) MUST leave the multiset of SUBMITTED
          care_appropriateness_score values and the count of SUBMITTED rows
          exactly unchanged, while the non-WAIVED count returns to 3.
        test_recipe:
          setup:
            - "Subject provider; members B/C/D/E; case with B, C, D assigned; B has submitted score 4 (case IN_REVIEW); C and D still PENDING"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj Twenty", specialty: "SURGERY" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "SURGERY" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "CARDIOLOGY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev D", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_d: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev E", specialty: "EMERGENCY_MEDICINE" }, as: QualityDirector, captures: { p_e: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_d}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_d: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_e}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_e: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "invariant case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_d}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_d: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 4, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
          trigger:
            - { call: "POST /peer-review/committee-members/${m_d}/deactivate", as: QualityDirector }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_e}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_e: $.data.id, e_seq: $.data.sequence } }
            - { call: "GET /peer-review/cases/${case1}/assignments?status=SUBMITTED", as: QualityDirector }
          assert:
            - "after deactivate + replacement: SUBMITTED-filtered assignment list has exactly 1 row with care_appropriateness_score == 4 — identical to before the pair (no drift in the score ledger)"
            - "full assignment list has 4 rows with statuses [SUBMITTED, PENDING, WAIVED, PENDING] in sequence order 1,2,3,4 — non-WAIVED count back to exactly 3"
            - "replacement sequence == 4 (waived slot's sequence 3 is never reused)"

      - name: member_cycle_conserves_reliability_ledger
        grounds:
          - state_machines.CommitteeMember.ACTIVE_to_INACTIVE
          - state_machines.CommitteeMember.INACTIVE_to_ACTIVE
          - entities.CommitteeMember.fields.reliability_completed_count
        distinguishing_aspect: |
          Conserved quantity = the member reliability ledger: a
          deactivate/activate cycle paired around a completed SUBMITTED
          assignment MUST leave reliability_completed_count and the
          SUBMITTED row's stored scores bit-identical — a different
          conserved quantity (member-aggregate counter, not per-case score
          multiset) from the sibling instance.
        test_recipe:
          setup:
            - "Subject provider; members B/C; case with B, C assigned; B submitted score 5 (reliability 1); C PENDING"
          setup_api_calls:
            - { call: "POST /peer-review/providers", payload: { full_name: "Subj TwentyOne", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_sub: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev B", specialty: "PEDIATRICS" }, as: QualityDirector, captures: { p_b: $.data.id } }
            - { call: "POST /peer-review/providers", payload: { full_name: "Rev C", specialty: "SURGERY" }, as: QualityDirector, captures: { p_c: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_b}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_b: $.data.id } }
            - { call: "POST /peer-review/committee-members", payload: { provider_id: "${p_c}", member_role: "MEMBER" }, as: QualityDirector, captures: { m_c: $.data.id } }
            - { call: "POST /peer-review/cases", payload: { subject_provider_id: "${p_sub}", referral_source: "OTHER", referred_at: "2026-07-20T00:00:00Z", description: "ledger case" }, as: PeerReviewCoordinator, captures: { case1: $.data.id } }
            - { call: "POST /peer-review/cases/${case1}/screen", payload: { decision: "SCREEN_IN" }, as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_b}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_b: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/cases/${case1}/assignments", payload: { reviewer_id: "${m_c}", expected_case_version: "${case_v}" }, as: PeerReviewCoordinator, captures: { asg_c: $.data.id } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_v: $.data.version } }
            - { call: "POST /peer-review/assignments/${asg_b}/submit", payload: { care_appropriateness_score: 5, expected_case_version: "${case_v}" }, as: CommitteeMember, as_user_id: "${m_b}" }
            - { call: "GET /peer-review/committee-members/${m_b}", as: QualityDirector, captures: { rel_before: $.data.reliability_completed_count } }
          trigger:
            - { call: "POST /peer-review/committee-members/${m_b}/deactivate", as: QualityDirector }
            - { call: "POST /peer-review/committee-members/${m_b}/activate", as: QualityDirector }
            - { call: "GET /peer-review/committee-members/${m_b}", as: QualityDirector, captures: { rel_after: $.data.reliability_completed_count, st_after: $.data.status } }
            - { call: "GET /peer-review/assignments/${asg_b}", as: QualityDirector, captures: { asg_status: $.data.status, asg_score: $.data.care_appropriateness_score } }
            - { call: "GET /peer-review/cases/${case1}", as: QualityDirector, captures: { case_status: $.data.status } }
          assert:
            - "reliability_completed_count before cycle == 1 and after cycle == 1 (deactivate/activate pair conserves the ledger)"
            - "assignment ${asg_b} remains SUBMITTED with care_appropriateness_score == 5 (the deactivation cascade touches PENDING rows only)"
            - "member status == 'ACTIVE' after the cycle; case status still 'IN_REVIEW'"
