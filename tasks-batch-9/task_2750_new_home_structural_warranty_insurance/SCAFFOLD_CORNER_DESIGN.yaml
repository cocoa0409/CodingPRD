        distinguishing_aspect: "WarrantyPolicy carries two independent state dimensions. Driving the premium axis all the way to its terminal PAID leaves the coverage axis in its initial PENDING_ENROLLMENT, and because the earned-premium denominator requires coverage_status IN {ACTIVE, EXPIRED} AND premium_status == PAID, the builder's earned_premium_cents is still 0 after the premium is fully paid and only becomes 363894 when the second axis moves."
