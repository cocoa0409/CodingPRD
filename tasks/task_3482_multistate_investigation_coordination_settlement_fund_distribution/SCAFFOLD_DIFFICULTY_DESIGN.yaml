# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Multistate Investigation Coordination & Settlement Fund Distribution
# Canonical world: offices CA(pop 100, PREAPPROPRIATED), TX(300, PREAPPROPRIATED),
# NY(400, CERTIFICATION_REQUIRED), FL(200, GENERAL_FUND_ONLY); harms 50/150/200/100.
# Leads: CA, TX. Settlement: total 100,000,000 / reserve 10,000,000 / 3 terms.
# Signed CA+TX+NY, FL DECLINED -> quorum 8000/10000 bps, weights 1250/3750/5000,
# lead_cost 4,500,000, distributable 85,500,000, shares 10,687,500 / 32,062,500 /
# 42,750,000, lead bonus 2,250,000 each for CA and TX.
# Logical clock default 2026-09-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_weight_divergence
        grounds:
          - calculations.provisional_vs_final_allocation
          - calculations.allocation_weight_normalization
          - entities.Settlement.fields.provisional_weight_bps_by_state
        distinguishing_aspect: |
          Settlement-domain dual variant: the SAME normalization formula runs at proposal
          time over the four ACTIVE participations (CA 1000 bps) and at execution over the
          three LOCKED sign-ons (CA 1250 bps); identical formula, different inclusion set,
          different weight for the same state.
        test_recipe:
          setup:
            - "Investigation in NEGOTIATION with ACTIVE participations CA/TX/NY/FL; settlement PROPOSED with allocation_basis POPULATION"
          setup_api_calls:
            - { call: "POST /multistate/state-offices", payload: { state_code: "CA", population: 100, harm_measure_cents: 50, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { ca_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "TX", population: 300, harm_measure_cents: 150, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { tx_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "NY", population: 400, harm_measure_cents: 200, appropriation_rule: "CERTIFICATION_REQUIRED" }, as: CommitteeChair, captures: { ny_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "FL", population: 200, harm_measure_cents: 100, appropriation_rule: "GENERAL_FUND_ONLY" }, as: CommitteeChair, captures: { fl_off: $.data.id } }
            - { call: "POST /multistate/investigations", payload: { title: "Pricing probe", target_name: "Acme Corp", summary: "Coordinated probe" }, as: CommitteeChair, captures: { inv: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${ca_off}" }, as: CommitteeChair, captures: { p_ca: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${tx_off}" }, as: CommitteeChair, captures: { p_tx: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${ny_off}" }, as: CommitteeChair, captures: { p_ny: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${fl_off}" }, as: CommitteeChair, captures: { p_fl: $.data.id } }
            - { call: "POST /multistate/participations/${p_ca}/execute-cia", payload: { confidentiality_tier: "LEAD_ONLY" }, as: ParticipatingStateAG, as_user_id: "${ca_off}" }
            - { call: "POST /multistate/participations/${p_tx}/execute-cia", payload: { confidentiality_tier: "RESTRICTED" }, as: ParticipatingStateAG, as_user_id: "${tx_off}" }
            - { call: "POST /multistate/participations/${p_ny}/execute-cia", payload: { confidentiality_tier: "STANDARD" }, as: ParticipatingStateAG, as_user_id: "${ny_off}" }
            - { call: "POST /multistate/participations/${p_fl}/execute-cia", payload: { confidentiality_tier: "STANDARD" }, as: ParticipatingStateAG, as_user_id: "${fl_off}" }
            - { call: "POST /multistate/participations/${p_ca}/designate-lead", payload: {}, as: CommitteeChair }
            - { call: "POST /multistate/participations/${p_tx}/designate-lead", payload: {}, as: CommitteeChair }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "OPEN" }, as: CommitteeChair }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "DISCOVERY" }, as: CommitteeChair }
            - { call: "POST /multistate/participations/${p_ca}/demands", payload: { scope_text: "Pricing documents" }, as: LeadStateAG, as_user_id: "${ca_off}", captures: { d_ca: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/responses", payload: { demand_ids: ["${d_ca}"], coverage_summary: "Consolidated production" }, as: DefendantCounsel, captures: { resp: $.data.id } }
            - { call: "POST /multistate/responses/${resp}/accept", payload: {}, as: LeadStateAG, as_user_id: "${ca_off}" }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "NEGOTIATION" }, as: CommitteeChair }
            - { call: "POST /multistate/investigations/${inv}/settlements", payload: { monetary_total_cents: 100000000, restitution_reserve_cents: 10000000, allocation_basis: "POPULATION", injunctive_terms: ["No misleading marketing", "Annual compliance audit", "Data preservation"] }, as: LeadStateAG, as_user_id: "${ca_off}", captures: { stl: $.data.id } }
            - { call: "POST /multistate/settlements/${stl}/agree-terms", payload: {}, as: DefendantCounsel }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "SETTLEMENT_PENDING" }, as: CommitteeChair }
            - { call: "POST /multistate/settlements/${stl}/open-sign-on", payload: {}, as: CommitteeChair }
            - { call: "POST /multistate/settlements/${stl}/sign-ons", payload: { decision: "SIGNED" }, as: LeadStateAG, as_user_id: "${ca_off}" }
            - { call: "POST /multistate/settlements/${stl}/sign-ons", payload: { decision: "SIGNED" }, as: LeadStateAG, as_user_id: "${tx_off}" }
            - { call: "POST /multistate/settlements/${stl}/sign-ons", payload: { decision: "SIGNED" }, as: ParticipatingStateAG, as_user_id: "${ny_off}" }
            - { call: "POST /multistate/settlements/${stl}/sign-ons", payload: { decision: "DECLINED" }, as: ParticipatingStateAG, as_user_id: "${fl_off}" }
          trigger:
            - { call: "POST /multistate/settlements/${stl}/execute", payload: {}, as: CommitteeChair }
            - { call: "GET /multistate/settlements/${stl}/allocation-lines", as: CommitteeChair, captures: { ca_w: "$.data[0].weight_bps" } }
          assert:
            - "Settlement.${stl}.provisional_weight_bps_by_state == {CA: 1000, TX: 3000, NY: 4000, FL: 2000} (provisional variant over ACTIVE participations)"
            - "AllocationLine for CA weight_bps == 1250 (final variant over LOCKED sign-ons), proving CA weight differs between variants"
            - "Settlement.${stl}.provisional_distributable_cents == 85500000 and Settlement.${stl}.distributable_cents == 85500000 (same formula, only the inclusion set changed)"
      - name: estimated_vs_final_payout_divergence
        grounds:
          - calculations.restitution_proration
          - entities.Claimant.fields.estimated_payout_cents
          - entities.Claimant.fields.payout_cents
        distinguishing_aspect: |
          Claimant-domain dual variant (different entity domain from the Settlement-domain
          allocation instance): validation stamps estimated_payout_cents == validated_loss_cents
          assuming no oversubscription; the compute-time final variant pro-rates against the
          10,000,000 reserve and pays k2 exactly 3,333,333, strictly less than its 4,000,000 estimate.
        test_recipe:
          setup:
            - "Settlement EXECUTED (canonical world) with restitution reserve 10,000,000; three claimants validated at 6,000,000 / 4,000,000 / 2,000,000 (sum 12,000,000 oversubscribes the pool)"
          setup_api_calls:
            - { call: "POST /multistate/state-offices", payload: { state_code: "CA", population: 100, harm_measure_cents: 50, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { ca_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "TX", population: 300, harm_measure_cents: 150, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { tx_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "NY", population: 400, harm_measure_cents: 200, appropriation_rule: "CERTIFICATION_REQUIRED" }, as: CommitteeChair, captures: { ny_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "FL", population: 200, harm_measure_cents: 100, appropriation_rule: "GENERAL_FUND_ONLY" }, as: CommitteeChair, captures: { fl_off: $.data.id } }
            - { call: "POST /multistate/investigations", payload: { title: "Pricing probe", target_name: "Acme Corp", summary: "Coordinated probe" }, as: CommitteeChair, captures: { inv: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${ca_off}" }, as: CommitteeChair, captures: { p_ca: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${tx_off}" }, as: CommitteeChair, captures: { p_tx: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${ny_off}" }, as: CommitteeChair, captures: { p_ny: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/participations", payload: { state_office_id: "${fl_off}" }, as: CommitteeChair, captures: { p_fl: $.data.id } }
            - { call: "POST /multistate/participations/${p_ca}/execute-cia", payload: { confidentiality_tier: "LEAD_ONLY" }, as: ParticipatingStateAG, as_user_id: "${ca_off}" }
            - { call: "POST /multistate/participations/${p_tx}/execute-cia", payload: { confidentiality_tier: "RESTRICTED" }, as: ParticipatingStateAG, as_user_id: "${tx_off}" }
            - { call: "POST /multistate/participations/${p_ny}/execute-cia", payload: { confidentiality_tier: "STANDARD" }, as: ParticipatingStateAG, as_user_id: "${ny_off}" }
            - { call: "POST /multistate/participations/${p_fl}/execute-cia", payload: { confidentiality_tier: "STANDARD" }, as: ParticipatingStateAG, as_user_id: "${fl_off}" }
            - { call: "POST /multistate/participations/${p_ca}/designate-lead", payload: {}, as: CommitteeChair }
            - { call: "POST /multistate/participations/${p_tx}/designate-lead", payload: {}, as: CommitteeChair }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "OPEN" }, as: CommitteeChair }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "DISCOVERY" }, as: CommitteeChair }
            - { call: "POST /multistate/participations/${p_ca}/demands", payload: { scope_text: "Pricing documents" }, as: LeadStateAG, as_user_id: "${ca_off}", captures: { d_ca: $.data.id } }
            - { call: "POST /multistate/investigations/${inv}/responses", payload: { demand_ids: ["${d_ca}"], coverage_summary: "Consolidated production" }, as: DefendantCounsel, captures: { resp: $.data.id } }
            - { call: "POST /multistate/responses/${resp}/accept", payload: {}, as: LeadStateAG, as_user_id: "${ca_off}" }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "NEGOTIATION" }, as: CommitteeChair }
            - { call: "POST /multistate/investigations/${inv}/settlements", payload: { monetary_total_cents: 100000000, restitution_reserve_cents: 10000000, allocation_basis: "POPULATION", injunctive_terms: ["No misleading marketing", "Annual compliance audit", "Data preservation"] }, as: LeadStateAG, as_user_id: "${ca_off}", captures: { stl: $.data.id } }
            - { call: "POST /multistate/settlements/${stl}/agree-terms", payload: {}, as: DefendantCounsel }
            - { call: "POST /multistate/investigations/${inv}/advance", payload: { to_phase: "SETTLEMENT_PENDING" }, as: CommitteeChair }
            - { call: "POST /multistate/settlements/${stl}/open-sign-on", payload: {}, as: CommitteeChair }
            - { call: "POST /multistate/settlements/${stl}/sign-ons", payload: { decision: "SIGNED" }, as: LeadStateAG, as_user_id: "${ca_off}" }
            - { call: "POST /multistate/settlements/${stl}/sign-ons", payload: { decision: "SIGNED" }, as: LeadStateAG, as_user_id: "${tx_off}" }
            - { call: "POST /multistate/settlements/${stl}/sign-ons", payload: { decision: "SIGNED" }, as: ParticipatingStateAG, as_user_id: "${ny_off}" }
            - { call: "POST /multistate/settlements/${stl}/sign-ons", payload: { decision: "DECLINED" }, as: ParticipatingStateAG, as_user_id: "${fl_off}" }
            - { call: "POST /multistate/settlements/${stl}/execute", payload: {}, as: CommitteeChair }
            - { call: "POST /multistate/settlements/${stl}/claimants", payload: { state_code: "CA", contact_ref: "ref-k1", claimed_loss_cents: 6000000 }, as: FundAdministrator, captures: { k1: $.data.id } }
            - { call: "POST /multistate/settlements/${stl}/claimants", payload: { state_code: "TX", contact_ref: "ref-k2", claimed_loss_cents: 5000000 }, as: FundAdministrator, captures: { k2: $.data.id } }
            - { call: "POST /multistate/settlements/${stl}/claimants", payload: { state_code: "NY", contact_ref: "ref-k3", claimed_loss_cents: 2000000 }, as: FundAdministrator, captures: { k3: $.data.id } }
            - { call: "POST /multistate/claimants/${k1}/validate", payload: { decision: "VALIDATED", validated_loss_cents: 6000000 }, as: FundAdministrator }
            - { call: "POST /multistate/claimants/${k2}/validate", payload: { decision: "VALIDATED", validated_loss_cents: 4000000 }, as: FundAdministrator, captures: { k2_est: $.data.estimated_payout_cents } }
            - { call: "POST /multistate/claimants/${k3}/validate", payload: { decision: "VALIDATED", validated_loss_cents: 2000000 }, as: FundAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-01T00:00:00Z" }, as: CommitteeChair }
          trigger:
            - { call: "POST /multistate/settlements/${stl}/restitution-compute", payload: {}, as: FundAdministrator }
            - { call: "GET /multistate/settlements/${stl}/claimants", as: CommitteeChair, captures: { k1_pay: "$.data[0].payout_cents", k2_pay: "$.data[1].payout_cents", k3_pay: "$.data[2].payout_cents" } }
          assert:
            - "estimated variant: Claimant.${k2}.estimated_payout_cents == 4000000 (set at validation)"
            - "final variant: Claimant.${k2}.payout_cents == 3333333 (floor(10000000 * 4000000 / 12000000)), strictly below the estimate"
            - "Claimant.${k1}.payout_cents == 5000001 and Claimant.${k3}.payout_cents == 1666666 (1 remainder cent to the largest validated claim)"
            - "Settlement.${stl}.restitution_remainder_cents == 0 and all three claimants have status PAID"
  - rule_id: combinatorial_formula
    instances:
      - name: circular_lead_cost_order_pinned
        grounds:
          - calculations.lead_cost_and_distributable
          - calculations.line_share_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: lead_cost is a
          percentage of a pool that itself excludes lead_cost. The pinned order base ->
          lead_cost -> distributable yields lead_cost 4,500,000 and distributable 85,500,000;
          any simultaneous-solve or reverse order produces different cents.
        test_recipe:
          setup:
            - "Settlement EXECUTED (canonical world): total 100,000,000, reserve 10,000,000, POPULATION basis, signed CA/TX/NY, leads CA and TX both signed"
          setup_api_calls:
            - { call: "POST /multistate/state-offices", payload: { state_code: "CA", population: 100, harm_measure_cents: 50, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { ca_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "TX", population: 300, harm_measure_cents: 150, appropriation_rule: "PREAPPROPRIATED" }, as: CommitteeChair, captures: { tx_off: $.data.id } }
            - { call: "POST /multistate/state-offices", payload: { state_code: "NY", population: 400, harm_measure_cents: 200, appropriation_rule: "CERTIFICATION_REQUIRED" }, as: CommitteeChair, captures: { ny_off: $.data.id } }
