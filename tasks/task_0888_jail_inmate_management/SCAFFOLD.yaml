scenario: "Jail & Inmate Management: booking & intake/classification, housing-assignment & bed, court-date & transport scheduling, commissary account & ordering, visitation & scheduling, property & release, medical/grievance, good-time & release-date calculation"
domain_name: "jail-inmate-management"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  # Person (Inmate) -> Booking episode is hierarchical; HousingUnit/Bed and
  # Visitor/Visit form cross-cutting flat FK references over the booking tree.
  state_machine_shape: cyclic
  # CourtEvent continuance loop and Request deny->appeal loop are cyclic;
  # Booking CLASSIFIED<->HOUSED is also a cycle via un-housing.
  relationship_patterns:
    - one_to_many        # Inmate 1:N Booking; Booking 1:N most children
    - cross_aggregate    # HousingAssignment references both Booking and Bed
    - many_to_many       # Visit joins Booking and Visitor
  role_model: segregation_of_duties
  # Reporting officer of a disciplinary infraction cannot be its hearing
  # (uphold) officer; release/refund reserved to Supervisor.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# 1.1 Entity-Relationship Table
# ============================================================================
entities:
  - name: Inmate
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: legal name of the person
      - name: date_of_birth
        type: string
        source: input
        description: birth date, YYYY-MM-DD
      - name: sex
        type: enum
        source: input
        description: biological sex, drives housing gender segregation
        constraints: "one of {MALE, FEMALE}"
      - name: status
        type: enum
        source: computed
        description: derived custody status across bookings
        default: "IN_CUSTODY"
        constraints: "one of {IN_CUSTODY, RELEASED}; RELEASED when the person's latest booking is RELEASED"

  - name: Booking
    parent: Inmate
    common_fields: true
    fields:
      - name: inmate_id
        type: string
        source: input
        description: "FK -> Inmate.id; the person this custody episode belongs to"
      - name: booking_status
        type: enum
        source: computed
        description: lifecycle state of the booking (see state machine)
        default: "BOOKED"
        constraints: "one of {BOOKED, CLASSIFIED, HOUSED, RELEASED}"
      - name: arrest_datetime
        type: datetime
        source: input
        description: ISO 8601 UTC arrest timestamp
      - name: charge_severity
        type: enum
        source: input
        description: most serious charge class, feeds classification severity points
        constraints: "one of {FELONY, MISDEMEANOR, INFRACTION}"
      - name: prior_bookings_count
        type: integer
        source: input
        description: number of prior bookings, feeds classification history points
        constraints: ">= 0"
      - name: sentence_days
        type: integer
        source: input
        description: total sentence length in days
        constraints: "> 0"
      - name: sentence_start_date
        type: string
        source: input
        description: date sentence begins, YYYY-MM-DD
      - name: classification_level
        type: enum
        source: computed
        description: custody level set by the latest ClassificationAssessment; null until first classified
        default: null
        constraints: "one of {MIN, MED, MAX} or null"
      - name: total_forfeited_days
        type: integer
        source: computed
        description: sum of good_time_forfeit_days over UPHELD DisciplinaryInfractions on this booking
        default: 0
      - name: statutory_good_time_days
        type: integer
        source: computed
        description: statutory good-time credit (see calc good_time_credit variant STATUTORY)
        default: 0
      - name: earned_good_time_days
        type: integer
        source: computed
        description: earned/behavioral good-time credit (see calc good_time_credit variant EARNED)
        default: 0
      - name: statutory_release_date
        type: string
        source: computed
        description: sentence_start_date + (sentence_days - statutory_good_time_days) days, YYYY-MM-DD
      - name: projected_release_date
        type: string
        source: computed
        description: sentence_start_date + (sentence_days - earned_good_time_days) days, YYYY-MM-DD; governs release eligibility
      - name: release_reason
        type: enum
        source: input
        description: reason recorded at release; null until released
        default: null
        constraints: "one of {TIME_SERVED, COURT_ORDER, BOND, BAIL} or null"

  - name: ClassificationAssessment
    parent: Booking
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; booking being classified"
      - name: assessment_type
        type: enum
        source: input
        description: INITIAL ignores behavior points; REASSESSMENT adds behavior points from UPHELD infractions
        constraints: "one of {INITIAL, REASSESSMENT}"
      - name: severity_points
        type: integer
        source: computed
        description: points from the booking's charge_severity
      - name: history_points
        type: integer
        source: computed
        description: points from the booking's prior_bookings_count
      - name: behavior_points
        type: integer
        source: computed
        description: points from UPHELD infractions (REASSESSMENT only, else 0)
      - name: total_score
        type: integer
        source: computed
        description: severity_points + history_points + behavior_points
      - name: resulting_level
        type: enum
        source: computed
        description: custody level derived from total_score thresholds
        constraints: "one of {MIN, MED, MAX}"

  - name: HousingUnit
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: unit / pod label
      - name: security_level
        type: enum
        source: input
        description: security classification this unit houses
        constraints: "one of {MIN, MED, MAX}"
      - name: gender
        type: enum
        source: input
        description: gender the unit accepts
        constraints: "one of {MALE, FEMALE, COED}"
      - name: capacity
        type: integer
        source: input
        description: maximum concurrent occupied beds allowed in the unit
        constraints: "> 0"

  - name: Bed
    parent: HousingUnit
    common_fields: true
    fields:
      - name: housing_unit_id
        type: string
        source: input
        description: "FK -> HousingUnit.id; unit containing this bed"
      - name: bed_label
        type: string
        source: input
        description: human label unique within the unit
      - name: status
        type: enum
        source: computed
        description: current occupancy of the bed
        default: "AVAILABLE"
        constraints: "one of {AVAILABLE, OCCUPIED}"

  - name: HousingAssignment
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; booking occupying the bed"
      - name: bed_id
        type: string
        source: input
        description: "FK -> Bed.id; bed occupied for the interval"
      - name: start_datetime
        type: datetime
        source: input
        description: ISO 8601 UTC start of occupation (inclusive)
      - name: end_datetime
        type: datetime
        source: input
        description: ISO 8601 UTC end of occupation (exclusive); null = open-ended
        default: null
      - name: assignment_status
        type: enum
        source: computed
        description: lifecycle of the assignment
        default: "ACTIVE"
        constraints: "one of {ACTIVE, ENDED}"

  - name: CourtEvent
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; booking due in court"
      - name: event_datetime
        type: datetime
        source: input
        description: ISO 8601 UTC scheduled court time
      - name: event_type
        type: enum
        source: input
        description: type of court appearance
        constraints: "one of {ARRAIGNMENT, HEARING, TRIAL, SENTENCING}"
      - name: transport_required
        type: boolean
        source: input
        description: whether custodial transport must be arranged
        default: true
      - name: court_event_status
        type: enum
        source: computed
        description: lifecycle of the court event (see state machine)
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, CONTINUED, ATTENDED}"
      - name: continuance_count
        type: integer
        source: computed
        description: number of times this event has been continued/rescheduled
        default: 0

  - name: CommissaryAccount
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; owning booking (created automatically at booking time)"
      - name: balance_cents
        type: integer
        source: computed
        description: available funds in cents
        default: 0
      - name: total_deposited_cents
        type: integer
        source: computed
        description: lifetime sum of deposits in cents
        default: 0

  - name: CommissaryOrder
    parent: CommissaryAccount
    common_fields: true
    fields:
      - name: commissary_account_id
        type: string
        source: input
        description: "FK -> CommissaryAccount.id; account charged"
      - name: lines
        type: array
        source: input
        description: "array of {item_name, quantity, unit_price_cents, taxable} order lines"
      - name: order_total_cents
        type: integer
        source: computed
        description: computed per-line-rounded total plus service fee (see calc commissary_order_total)
      - name: order_status
        type: enum
        source: computed
        description: lifecycle of the order
        default: "PENDING"
        constraints: "one of {PENDING, FULFILLED, REFUNDED}"

  - name: Visitor
    parent: Inmate
    common_fields: true
    fields:
      - name: inmate_id
        type: string
        source: input
        description: "FK -> Inmate.id; inmate this visitor is registered to see"
      - name: visitor_name
        type: string
        source: input
        description: visitor legal name
      - name: relationship
        type: enum
        source: input
        description: relationship to the inmate
        constraints: "one of {FAMILY, ATTORNEY, FRIEND, CLERGY}"
      - name: visitor_status
        type: enum
        source: computed
        description: approval status for visitation
        default: "PENDING"
        constraints: "one of {PENDING, APPROVED}"

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; booking being visited"
      - name: visitor_id
        type: string
        source: input
        description: "FK -> Visitor.id; the approved visitor"
      - name: start_datetime
        type: datetime
        source: input
        description: ISO 8601 UTC visit start (inclusive)
      - name: end_datetime
        type: datetime
        source: input
        description: ISO 8601 UTC visit end (inclusive)
      - name: visit_status
        type: enum
        source: computed
        description: lifecycle of the visit
        default: "REQUESTED"
        constraints: "one of {REQUESTED, APPROVED, CANCELLED}"

  - name: Request
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; booking that filed the request"
      - name: request_type
        type: enum
        source: input
        description: kind of request
        constraints: "one of {MEDICAL, GRIEVANCE}"
      - name: description
        type: string
        source: input
        description: free-text detail
      - name: request_status
        type: enum
        source: computed
        description: lifecycle of the request (see cyclic state machine)
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, UNDER_REVIEW, DENIED, RESOLVED}"
      - name: appeal_count
        type: integer
        source: computed
        description: number of times a DENIED request was appealed back to review
        default: 0

  - name: DisciplinaryInfraction
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; booking that committed the infraction"
      - name: infraction_type
        type: enum
        source: input
        description: category of rule violation
        constraints: "one of {CONTRABAND, ASSAULT, DISOBEDIENCE, PROPERTY_DAMAGE}"
      - name: good_time_forfeit_days
        type: integer
        source: input
        description: days of good-time to forfeit if upheld
        constraints: ">= 0"
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the officer who reported the infraction (for segregation of duties)
      - name: infraction_status
        type: enum
        source: computed
        description: lifecycle of the infraction
        default: "REPORTED"
        constraints: "one of {REPORTED, UPHELD}"

  - name: PropertyItem
    parent: Booking
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; booking whose property is held"
      - name: description
        type: string
        source: input
        description: item description
      - name: category
        type: enum
        source: input
        description: property category
        constraints: "one of {CLOTHING, ELECTRONICS, CASH, DOCUMENTS, OTHER}"
      - name: property_status
        type: enum
        source: computed
        description: storage status of the item
        default: "STORED"
        constraints: "one of {STORED, RETURNED}"

# ============================================================================
# 1.2 State Machine Table
# ============================================================================
state_machines:
  - entity: Booking
    initial_state: BOOKED
    terminal_states: [RELEASED]
    transitions:
      - from: BOOKED
        to: CLASSIFIED
        trigger: "POST /bookings/{id}/classifications (assessment_type=INITIAL)"
        actor: ClassificationOfficer
        preconditions: ["booking_status == BOOKED"]
        side_effects:
          - "create ClassificationAssessment; set Booking.classification_level = assessment.resulting_level"
          - "recompute earned_good_time_days, earned/projected_release_date (accrual rate now known)"
          - "increment Booking.version by 1"
      - from: CLASSIFIED
        to: CLASSIFIED
        trigger: "POST /bookings/{id}/classifications (assessment_type=REASSESSMENT)"
        actor: ClassificationOfficer
        preconditions: ["booking_status in {CLASSIFIED, HOUSED}"]
        side_effects:
          - "create new ClassificationAssessment that supersedes the prior one; update Booking.classification_level"
          - "recompute earned_good_time_days and projected_release_date"
          - "increment Booking.version by 1"
        note: "CREATE-with-supersede; guarded by OCC on Booking.version (see concurrency_rules)"
      - from: HOUSED
        to: HOUSED
        trigger: "POST /bookings/{id}/classifications (assessment_type=REASSESSMENT)"
        actor: ClassificationOfficer
        preconditions: ["booking_status == HOUSED"]
        side_effects:
          - "update Booking.classification_level; recompute projected_release_date"
          - "increment Booking.version by 1"
      - from: CLASSIFIED
        to: HOUSED
        trigger: "POST /housing-assignments"
        actor: ClassificationOfficer
        preconditions:
          - "booking_status == CLASSIFIED"
          - "no overlapping ACTIVE assignment on the target bed for the requested interval"
          - "Bed's unit security_level == Booking.classification_level"
          - "Bed's unit gender accepts inmate.sex"
        side_effects:
          - "create HousingAssignment (ACTIVE); set Bed.status = OCCUPIED; increment Bed.version"
      - from: HOUSED
        to: CLASSIFIED
        trigger: "POST /housing-assignments/{id}/end"
        actor: ClassificationOfficer
        preconditions: ["an ACTIVE HousingAssignment exists for this booking"]
        side_effects:
          - "set HousingAssignment.assignment_status = ENDED; set Bed.status = AVAILABLE; increment Bed.version"
      - from: BOOKED
        to: RELEASED
        trigger: "POST /bookings/{id}/release"
        actor: Supervisor
        preconditions: ["release eligibility satisfied (see calc release_eligibility)"]
        side_effects:
          - "set booking_status = RELEASED; set Inmate.status = RELEASED"
          - "set every STORED PropertyItem on the booking to RETURNED"
      - from: CLASSIFIED
        to: RELEASED
        trigger: "POST /bookings/{id}/release"
        actor: Supervisor
        preconditions: ["release eligibility satisfied"]
        side_effects:
          - "set booking_status = RELEASED; set Inmate.status = RELEASED"
          - "set every STORED PropertyItem on the booking to RETURNED"
      - from: HOUSED
        to: RELEASED
        trigger: "POST /bookings/{id}/release"
        actor: Supervisor
        preconditions: ["release eligibility satisfied"]
        side_effects:
          - "CASCADE: end the ACTIVE HousingAssignment (assignment_status = ENDED)"
          - "that end sets its Bed.status = AVAILABLE (increment Bed.version)"
          - "the freed Bed decrements its HousingUnit occupied-bed count"
          - "set booking_status = RELEASED; set Inmate.status = RELEASED"
          - "set every STORED PropertyItem on the booking to RETURNED"

  - entity: Bed
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "system: HousingAssignment created on this bed"
        actor: system
        preconditions: ["no overlapping ACTIVE assignment on this bed"]
        side_effects: ["increment Bed.version by 1"]
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "system: the ACTIVE HousingAssignment on this bed ends (via end endpoint or release cascade)"
        actor: system
        preconditions: []
        side_effects: ["increment Bed.version by 1"]

  - entity: HousingAssignment
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: ENDED
        trigger: "POST /housing-assignments/{id}/end OR release cascade"
        actor: ClassificationOfficer
        preconditions: ["assignment_status == ACTIVE"]
        side_effects: ["set Bed.status = AVAILABLE; increment Bed.version"]

  - entity: CourtEvent
    initial_state: SCHEDULED
    terminal_states: [ATTENDED]
    transitions:
      - from: SCHEDULED
        to: CONTINUED
        trigger: "POST /court-events/{id}/continue"
        actor: Scheduler
        preconditions: ["court_event_status == SCHEDULED"]
        side_effects: ["record prior event_datetime; increment continuance_count by 1"]
      - from: CONTINUED
        to: SCHEDULED
        trigger: "system: continue completes by re-scheduling to new_event_datetime (same request)"
        actor: system
        preconditions: []
        side_effects: ["set event_datetime = new_event_datetime; court_event_status back to SCHEDULED"]
        note: "cyclic: SCHEDULED -> CONTINUED -> SCHEDULED; repeatable, continuance_count grows"
      - from: SCHEDULED
        to: ATTENDED
        trigger: "POST /court-events/{id}/attend"
        actor: Scheduler
        preconditions: ["court_event_status == SCHEDULED"]
        side_effects: []

  - entity: CommissaryOrder
    initial_state: PENDING
    terminal_states: [REFUNDED]
    transitions:
      - from: PENDING
        to: FULFILLED
        trigger: "POST /commissary-orders/{id}/fulfill"
        actor: IntakeOfficer
        preconditions:
          - "order_status == PENDING"
          - "CommissaryAccount.balance_cents >= order_total_cents"
        side_effects:
          - "debit CommissaryAccount.balance_cents by order_total_cents"
          - "increment CommissaryAccount.version by 1"
      - from: FULFILLED
        to: REFUNDED
        trigger: "POST /commissary-orders/{id}/refund"
        actor: Supervisor
        preconditions: ["order_status == FULFILLED"]
        side_effects:
          - "COMPENSATION: credit CommissaryAccount.balance_cents by order_total_cents (restores money-conservation invariant)"
          - "increment CommissaryAccount.version by 1"

  - entity: Visitor
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /visitors/{id}/approve"
        actor: Scheduler
        preconditions: ["visitor_status == PENDING"]
        side_effects: []

  - entity: Visit
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /visits/{id}/approve"
        actor: Scheduler
        preconditions: ["visit_status == REQUESTED"]
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel"
        actor: Scheduler
        preconditions: ["visit_status == REQUESTED"]
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel"
        actor: Scheduler
        preconditions: ["visit_status == APPROVED"]
        side_effects: []

  - entity: Request
    initial_state: SUBMITTED
    terminal_states: [RESOLVED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /requests/{id}/review"
        actor: HealthGrievanceOfficer
        preconditions: ["request_status == SUBMITTED"]
        side_effects: []
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /requests/{id}/resolve"
        actor: HealthGrievanceOfficer
        preconditions: ["request_status == UNDER_REVIEW"]
        side_effects: []
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /requests/{id}/deny"
        actor: HealthGrievanceOfficer
        preconditions: ["request_status == UNDER_REVIEW"]
        side_effects: []
      - from: DENIED
        to: UNDER_REVIEW
        trigger: "POST /requests/{id}/appeal"
        actor: HealthGrievanceOfficer
        preconditions: ["request_status == DENIED"]
        side_effects: ["increment appeal_count by 1"]
        note: "cyclic: UNDER_REVIEW -> DENIED -> UNDER_REVIEW"

  - entity: DisciplinaryInfraction
    initial_state: REPORTED
    terminal_states: [UPHELD]
    transitions:
      - from: REPORTED
        to: UPHELD
        trigger: "POST /infractions/{id}/uphold"
        actor: Supervisor
        preconditions:
          - "infraction_status == REPORTED"
          - "segregation of duties: X-User-ID of upholder != reported_by_user_id"
        side_effects:
          - "CASCADE: add good_time_forfeit_days to Booking.total_forfeited_days"
          - "that increase recomputes Booking.earned_good_time_days and Booking.projected_release_date"
          - "increment Booking.version by 1"

  - entity: PropertyItem
    initial_state: STORED
    terminal_states: [RETURNED]
    transitions:
      - from: STORED
        to: RETURNED
        trigger: "POST /property-items/{id}/release OR release cascade of the owning booking"
        actor: IntakeOfficer
        preconditions: ["property_status == STORED"]
        side_effects: []

# ============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version)
# ============================================================================
concurrency_rules:
  - rule_id: classification-supersede-stale-booking
    parent_entity: Booking
    write_endpoint: "POST /bookings/{id}/classifications"
    occ_field: "expected_booking_version"
    description: |
      Creating a ClassificationAssessment against a Booking whose version has
      advanced since the client last observed it is rejected. A REASSESSMENT
      legitimately supersedes the prior assessment, so a second create off a
      stale booking view (its version already bumped by an earlier assessment
      or an upheld infraction) must fail on the version check rather than
      silently produce a second superseding assessment.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-create-stale-account
    parent_entity: CommissaryAccount
    write_endpoint: "POST /commissary-accounts/{id}/orders"
    occ_field: "expected_commissaryaccount_version"
    description: |
      Creating a CommissaryOrder against a CommissaryAccount whose version has
      advanced since the client last read it is rejected. Deposits, fulfillments
      and refunds all bump the account version; an order placed off a stale
      balance view (which would otherwise legitimately succeed) is rejected so
      the client re-reads the current balance before committing.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ============================================================================
# 1.3 Calculation Rules Table
# ============================================================================
calculations:
  - name: good_time_credit
    trigger: "recomputed on classification (level known), on infraction uphold (forfeit added), and read via GET /bookings/{id}/release-projection"
    algorithm: threshold
    formula: |
      # STATUTORY variant (fixed statutory rate, ignores behavior):
      statutory_good_time_days = floor(sentence_days * STATUTORY_RATE)
      statutory_release_date   = sentence_start_date + (sentence_days - statutory_good_time_days) days

      # EARNED variant (behavioral, class-rate accrual net of forfeitures, capped):
      accrual_rate = ACCRUAL_RATE_BY_LEVEL[classification_level]   # 0 if unclassified
      cap          = floor(sentence_days * EARNED_CAP_RATE)
      accrued      = floor(sentence_days * accrual_rate)
      earned_good_time_days = max(0, min(cap, accrued - total_forfeited_days))
      projected_release_date = sentence_start_date + (sentence_days - earned_good_time_days) days
    input_set: "single Booking; total_forfeited_days = sum(good_time_forfeit_days) over its UPHELD infractions"
    constants:
      STATUTORY_RATE: 0.10
      EARNED_CAP_RATE: 0.20
      ACCRUAL_RATE_BY_LEVEL: { MIN: 0.25, MED: 0.15, MAX: 0.05 }
    precision: "day counts floored to integer; dates are calendar-day arithmetic"
    variants:
      - name: STATUTORY
        when: "always available; the fixed statutory credit"
        difference: "uses STATUTORY_RATE, ignores classification level and forfeitures"
      - name: EARNED
        when: "governs actual release eligibility"
        difference: "uses class accrual rate, subtracts forfeitures, clamps to [0, cap]; diverges from STATUTORY for identical sentence_days"

  - name: classification_score
    trigger: "on POST /bookings/{id}/classifications"
    algorithm: weighted_scoring
    formula: |
      severity_points = SEVERITY_POINTS[booking.charge_severity]
      history_points  = min(HISTORY_CAP, booking.prior_bookings_count * HISTORY_PER_PRIOR)
      behavior_points = (BEHAVIOR_PER_UPHELD * count(UPHELD infractions on booking))
                          if assessment_type == REASSESSMENT else 0
      total_score = severity_points + history_points + behavior_points
      resulting_level = MAX if total_score >= MAX_THRESHOLD
                        else MED if total_score >= MED_THRESHOLD
                        else MIN
    input_set: "single Booking plus its UPHELD infractions (REASSESSMENT only)"
    constants:
      SEVERITY_POINTS: { FELONY: 30, MISDEMEANOR: 10, INFRACTION: 5 }
      HISTORY_PER_PRIOR: 6
      HISTORY_CAP: 30
      BEHAVIOR_PER_UPHELD: 15
      MED_THRESHOLD: 25
      MAX_THRESHOLD: 55
    precision: "integer points; thresholds inclusive (>=)"
    variants:
      - name: INITIAL
        when: "first classification of a booking"
        difference: "behavior_points forced to 0"
      - name: REASSESSMENT
        when: "re-classification after infractions"
        difference: "behavior_points add BEHAVIOR_PER_UPHELD per UPHELD infraction, can raise the level for identical severity/history"

  - name: commissary_order_total
    trigger: "on POST /commissary-accounts/{id}/orders (order create)"
    algorithm: aggregation
    formula: |
      # round PER LINE, then sum (pinned order; sum-then-round is WRONG):
      for each line:
        raw = line.quantity * line.unit_price_cents * (1 + TAX_RATE if line.taxable else 1)
        line_total_cents = round_half_up(raw)            # to whole cents
      order_total_cents = sum(line_total_cents) + SERVICE_FEE_CENTS
    input_set: "the lines[] of a single order"
    constants:
      TAX_RATE: 0.0725
      SERVICE_FEE_CENTS: 25
    precision: "round_half_up to whole cents, per line, BEFORE summing"

  - name: release_eligibility
    trigger: "on POST /bookings/{id}/release"
    algorithm: threshold
    formula: |
      if release_reason in {COURT_ORDER, BOND, BAIL}:
        eligible = true                       # discretionary release, no date gate
      elif release_reason == TIME_SERVED:
        eligible = (current_utc_date >= projected_release_date)   # earned-date gate
      else:
        eligible = false
    input_set: "single Booking; projected_release_date from good_time_credit EARNED variant; current date from logical clock"
    constants: {}
    precision: "date comparison at day granularity; boundary is inclusive (>=)"

  - name: housing_unit_occupancy
    trigger: "on POST /housing-assignments (capacity gate) and as derived unit metric"
    algorithm: aggregation
    formula: |
      occupied_beds = count(Bed in unit where status == OCCUPIED)
      # unit is FULL when a new occupation would exceed capacity:
      reject if occupied_beds >= unit.capacity
    input_set: "all Beds whose housing_unit_id == unit.id"
    constants: {}
    precision: "integer bed counts; boundary inclusive (>=)"

# ============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# ============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is permitted for this operation per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path-referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing paths"
  - priority: 10
    category: business_constraint
    check: "required body fields present and correctly typed"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 11
    category: business_constraint
    check: "enum-valued fields carry a declared member"
    error_id: ERR_INVALID_ENUM
    http_status: 422
    applies_to: "all write endpoints with enum inputs"
  - priority: 12
    category: business_temporal
    check: "interval end_datetime strictly after start_datetime"
    error_id: ERR_INVALID_TIME_RANGE
    http_status: 422
    applies_to: "POST /housing-assignments, POST /visits"
  - priority: 20
    category: business_constraint
    check: "expected_<parent>_version matches the parent's current version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bookings/{id}/classifications, POST /commissary-accounts/{id}/orders"
  - priority: 30
    category: state
    check: "target booking is not RELEASED"
    error_id: ERR_BOOKING_RELEASED
    http_status: 409
    applies_to: "POST /commissary-accounts/{id}/orders, POST /bookings/{id}/court-events, POST /housing-assignments, POST /visits, POST /bookings/{id}/requests"
  - priority: 31
    category: state
    check: "booking is CLASSIFIED before it can be housed"
    error_id: ERR_BOOKING_NOT_CLASSIFIED
    http_status: 409
    applies_to: "POST /housing-assignments"
  - priority: 33
    category: state
    check: "entity is in the correct source state for the requested transition (order PENDING/FULFILLED, court event SCHEDULED, request SUBMITTED/UNDER_REVIEW/DENIED, visit REQUESTED/APPROVED, infraction REPORTED, assignment ACTIVE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 35
    category: business_referential
    check: "visitor referenced by a visit is APPROVED"
    error_id: ERR_VISITOR_NOT_APPROVED
    http_status: 409
    applies_to: "POST /visits"
  - priority: 40
    category: business_safety
    check: "segregation of duties: infraction upholder's X-User-ID != reported_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /infractions/{id}/uphold"
  - priority: 50
    category: business_safety
    check: "bed's unit security_level equals booking.classification_level"
    error_id: ERR_SECURITY_LEVEL_MISMATCH
    http_status: 409
    applies_to: "POST /housing-assignments"
  - priority: 51
    category: business_safety
    check: "bed's unit gender accepts inmate.sex (COED accepts both)"
    error_id: ERR_GENDER_MISMATCH
    http_status: 409
    applies_to: "POST /housing-assignments"
  - priority: 60
    category: business_constraint
    check: "requested bed interval does not overlap an existing ACTIVE assignment on that bed (half-open [start,end))"
    error_id: ERR_BED_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /housing-assignments"
  - priority: 61
    category: business_constraint
    check: "requested visit does not fall within VISIT_BUFFER_MINUTES of another non-cancelled visit on the same booking (closed interval + 30-min buffer)"
    error_id: ERR_VISIT_OVERLAP
    http_status: 409
    applies_to: "POST /visits"
  - priority: 62
    category: business_constraint
    check: "housing unit occupied-bed count < capacity"
    error_id: ERR_HOUSING_UNIT_FULL
    http_status: 409
    applies_to: "POST /housing-assignments"
  - priority: 70
    category: business_fiscal
    check: "commissary account balance covers the order total (checked at create and at fulfill)"
    error_id: ERR_INSUFFICIENT_FUNDS
    http_status: 402
    applies_to: "POST /commissary-accounts/{id}/orders, POST /commissary-orders/{id}/fulfill"
  - priority: 80
    category: business_temporal
    check: "release eligibility satisfied (discretionary reason, or TIME_SERVED with current date >= projected_release_date)"
    error_id: ERR_NOT_RELEASE_ELIGIBLE
    http_status: 409
    applies_to: "POST /bookings/{id}/release"

# ============================================================================
# 1.5 API Endpoint Table
# ============================================================================
endpoints:
  # --- Inmate ---
  - method: POST
    path: "/inmates"
    description: "register a person"
    roles: [IntakeOfficer]
    code: 201
    input: [full_name, date_of_birth, sex]
    output: Inmate
    side_effects: ["create Inmate with status IN_CUSTODY"]
  - method: GET
    path: "/inmates/{id}"
    description: "read an inmate"
    roles: [IntakeOfficer, ClassificationOfficer, Scheduler, HealthGrievanceOfficer, Supervisor]
    code: 200
    input: []
    output: Inmate
    side_effects: []
  - method: GET
    path: "/inmates/{id}/bookings"
    description: "list bookings for an inmate (FK reverse Booking.inmate_id)"
    roles: [IntakeOfficer, ClassificationOfficer, Scheduler, HealthGrievanceOfficer, Supervisor]
    code: 200
    input: []
    output: Booking[]
    side_effects: []
  - method: GET
    path: "/inmates/{id}/visitors"
    description: "list registered visitors for an inmate (FK reverse Visitor.inmate_id)"
    roles: [IntakeOfficer, ClassificationOfficer, Scheduler, HealthGrievanceOfficer, Supervisor]
    code: 200
    input: []
    output: Visitor[]
    side_effects: []

  # --- Booking ---
  - method: POST
    path: "/bookings"
    description: "book an inmate (open a custody episode)"
    roles: [IntakeOfficer]
    code: 201
    input: [inmate_id, arrest_datetime, charge_severity, prior_bookings_count, sentence_days, sentence_start_date]
    output: Booking
    side_effects:
      - "create Booking (BOOKED); compute statutory good-time + statutory_release_date"
      - "auto-create a CommissaryAccount for the booking with balance 0"
  - method: GET
    path: "/bookings/{id}"
    description: "read a booking"
    roles: [IntakeOfficer, ClassificationOfficer, Scheduler, HealthGrievanceOfficer, Supervisor]
    code: 200
    input: []
    output: Booking
    side_effects: []
  - method: GET
    path: "/bookings/{id}/release-projection"
    description: "computed read: statutory vs earned good-time and release dates"
    roles: [IntakeOfficer, ClassificationOfficer, Scheduler, HealthGrievanceOfficer, Supervisor]
    code: 200
    input: []
    output: "{ classification_level: enum, total_forfeited_days: integer, statutory_good_time_days: integer, earned_good_time_days: integer, statutory_release_date: string, projected_release_date: string }"
    side_effects: []
  - method: POST
    path: "/bookings/{id}/classifications"
    description: "run a classification assessment (INITIAL or REASSESSMENT); OCC on booking version"
    roles: [ClassificationOfficer]
    code: 201
    input: [assessment_type, expected_booking_version]
    output: ClassificationAssessment
    side_effects:
      - "compute classification_score; create ClassificationAssessment"
      - "set Booking.classification_level; BOOKED->CLASSIFIED on INITIAL; recompute earned good-time"
      - "increment Booking.version by 1"
  - method: GET
    path: "/bookings/{id}/classifications"
    description: "list classification assessments for a booking (FK reverse)"
    roles: [ClassificationOfficer, Supervisor]
    code: 200
    input: []
    output: ClassificationAssessment[]
    side_effects: []
  - method: POST
    path: "/bookings/{id}/release"
    description: "release the booking (state-guarded by eligibility)"
    roles: [Supervisor]
    code: 200
    input: [release_reason]
    output: Booking
    side_effects:
      - "cascade end ACTIVE HousingAssignment -> free Bed -> unit occupancy--"
      - "return STORED property; set Inmate.status = RELEASED"

  # --- Housing ---
  - method: POST
    path: "/housing-units"
    description: "create a housing unit"
    roles: [ClassificationOfficer]
    code: 201
    input: [name, security_level, gender, capacity]
    output: HousingUnit
    side_effects: []
  - method: GET
    path: "/housing-units/{id}"
    description: "read a housing unit"
    roles: [ClassificationOfficer, Supervisor]
    code: 200
    input: []
    output: HousingUnit
    side_effects: []
  - method: POST
    path: "/housing-units/{id}/beds"
    description: "add a bed to a unit"
    roles: [ClassificationOfficer]
    code: 201
    input: [bed_label]
    output: Bed
    side_effects: ["create Bed with status AVAILABLE"]
  - method: GET
    path: "/housing-units/{id}/beds"
    description: "list beds in a unit (FK reverse Bed.housing_unit_id)"
    roles: [ClassificationOfficer, Supervisor]
    code: 200
    input: []
    output: Bed[]
    side_effects: []
  - method: POST
    path: "/housing-assignments"
    description: "assign a booking to a bed for an interval"
    roles: [ClassificationOfficer]
    code: 201
    input: [booking_id, bed_id, start_datetime, "end_datetime?"]
    output: HousingAssignment
    side_effects:
      - "create HousingAssignment (ACTIVE); Bed.status=OCCUPIED (Bed.version++); Booking CLASSIFIED->HOUSED"
  - method: GET
    path: "/housing-assignments/{id}"
    description: "read a housing assignment"
    roles: [ClassificationOfficer, Supervisor]
    code: 200
    input: []
    output: HousingAssignment
    side_effects: []
  - method: GET
    path: "/housing-assignments"
    description: "list housing assignments filtered by booking or bed (FK reverse for both FKs)"
    roles: [ClassificationOfficer, Supervisor]
    code: 200
    input: ["booking_id?", "bed_id?"]
    output: HousingAssignment[]
    side_effects: []
  - method: POST
    path: "/housing-assignments/{id}/end"
    description: "end an active assignment (un-house)"
    roles: [ClassificationOfficer]
    code: 200
    input: []
    output: HousingAssignment
    side_effects: ["assignment ACTIVE->ENDED; Bed.status=AVAILABLE (Bed.version++); Booking HOUSED->CLASSIFIED"]

  # --- Commissary ---
  - method: GET
    path: "/bookings/{id}/commissary-account"
    description: "read the booking's commissary account (FK reverse CommissaryAccount.booking_id; array of 0-1)"
    roles: [IntakeOfficer, Supervisor]
    code: 200
    input: []
    output: CommissaryAccount[]
    side_effects: []
  - method: GET
    path: "/commissary-accounts/{id}"
    description: "read a commissary account"
    roles: [IntakeOfficer, Supervisor]
    code: 200
    input: []
    output: CommissaryAccount
    side_effects: []
  - method: POST
    path: "/commissary-accounts/{id}/deposits"
    description: "deposit funds into a commissary account"
    roles: [IntakeOfficer]
    code: 200
    input: [amount_cents]
    output: CommissaryAccount
    side_effects: ["balance_cents += amount_cents; total_deposited_cents += amount_cents; version++"]
  - method: POST
    path: "/commissary-accounts/{id}/orders"
    description: "place a commissary order; OCC on account version"
    roles: [IntakeOfficer]
    code: 201
    input: [lines, expected_commissaryaccount_version]
    output: CommissaryOrder
    side_effects: ["compute order_total_cents (per-line rounded); create order PENDING; increment CommissaryAccount.version by 1"]
  - method: GET
    path: "/commissary-accounts/{id}/orders"
    description: "list orders on an account (FK reverse CommissaryOrder.commissary_account_id)"
    roles: [IntakeOfficer, Supervisor]
    code: 200
    input: []
    output: CommissaryOrder[]
    side_effects: []
  - method: POST
    path: "/commissary-orders/{id}/fulfill"
    description: "fulfill a pending order (debit balance)"
    roles: [IntakeOfficer]
    code: 200
    input: []
    output: CommissaryOrder
    side_effects: ["order PENDING->FULFILLED; balance_cents -= order_total_cents; account.version++"]
  - method: POST
    path: "/commissary-orders/{id}/refund"
    description: "refund a fulfilled order (credit balance back)"
    roles: [Supervisor]
    code: 200
    input: []
    output: CommissaryOrder
    side_effects: ["order FULFILLED->REFUNDED; balance_cents += order_total_cents; account.version++"]

  # --- Court ---
  - method: POST
    path: "/bookings/{id}/court-events"
    description: "schedule a court date"
    roles: [Scheduler]
    code: 201
    input: [event_datetime, event_type, "transport_required?"]
    output: CourtEvent
    side_effects: ["create CourtEvent SCHEDULED"]
  - method: GET
    path: "/bookings/{id}/court-events"
    description: "list court events for a booking (FK reverse CourtEvent.booking_id)"
    roles: [Scheduler, Supervisor]
    code: 200
    input: []
    output: CourtEvent[]
    side_effects: []
  - method: POST
    path: "/court-events/{id}/continue"
    description: "continue (reschedule) a court event; cyclic"
    roles: [Scheduler]
    code: 200
    input: [new_event_datetime]
    output: CourtEvent
    side_effects: ["continuance_count++; event_datetime = new_event_datetime; status stays SCHEDULED"]
  - method: POST
    path: "/court-events/{id}/attend"
    description: "mark a court event attended (terminal)"
    roles: [Scheduler]
    code: 200
    input: []
    output: CourtEvent
    side_effects: ["status SCHEDULED->ATTENDED"]

  # --- Visitation ---
  - method: POST
    path: "/inmates/{id}/visitors"
    description: "register a visitor for an inmate (PENDING approval)"
    roles: [Scheduler]
    code: 201
    input: [visitor_name, relationship]
    output: Visitor
    side_effects: ["create Visitor PENDING"]
  - method: POST
    path: "/visitors/{id}/approve"
    description: "approve a visitor"
    roles: [Scheduler]
    code: 200
    input: []
    output: Visitor
    side_effects: ["visitor_status PENDING->APPROVED"]
  - method: POST
    path: "/visits"
    description: "request a visit (requires an APPROVED visitor; buffer overlap checked)"
    roles: [Scheduler, Visitor]
    code: 201
    input: [booking_id, visitor_id, start_datetime, end_datetime]
    output: Visit
    side_effects: ["create Visit REQUESTED"]
  - method: GET
    path: "/visits/{id}"
    description: "read a visit"
    roles: [Scheduler, Supervisor, Visitor]
    code: 200
    input: []
    output: Visit
    side_effects: []
  - method: GET
    path: "/visits"
    description: "list visits filtered by booking or visitor (FK reverse for both FKs)"
    roles: [Scheduler, Supervisor]
    code: 200
    input: ["booking_id?", "visitor_id?"]
    output: Visit[]
    side_effects: []
  - method: POST
    path: "/visits/{id}/approve"
    description: "approve a requested visit"
    roles: [Scheduler]
    code: 200
    input: []
    output: Visit
    side_effects: ["visit_status REQUESTED->APPROVED"]
  - method: POST
    path: "/visits/{id}/cancel"
    description: "cancel a requested or approved visit"
    roles: [Scheduler, Visitor]
    code: 200
    input: []
    output: Visit
    side_effects: ["visit_status ->CANCELLED"]

  # --- Medical / Grievance ---
  - method: POST
    path: "/bookings/{id}/requests"
    description: "file a medical or grievance request"
    roles: [HealthGrievanceOfficer]
    code: 201
    input: [request_type, description]
    output: Request
    side_effects: ["create Request SUBMITTED"]
  - method: GET
    path: "/bookings/{id}/requests"
    description: "list requests for a booking (FK reverse Request.booking_id)"
    roles: [HealthGrievanceOfficer, Supervisor]
    code: 200
    input: []
    output: Request[]
    side_effects: []
  - method: POST
    path: "/requests/{id}/review"
    description: "move a request into review"
    roles: [HealthGrievanceOfficer]
    code: 200
    input: []
    output: Request
    side_effects: ["SUBMITTED->UNDER_REVIEW"]
  - method: POST
    path: "/requests/{id}/deny"
    description: "deny a request under review"
    roles: [HealthGrievanceOfficer]
    code: 200
    input: []
    output: Request
    side_effects: ["UNDER_REVIEW->DENIED"]
  - method: POST
    path: "/requests/{id}/appeal"
    description: "appeal a denied request back into review; cyclic"
    roles: [HealthGrievanceOfficer]
    code: 200
    input: []
    output: Request
    side_effects: ["DENIED->UNDER_REVIEW; appeal_count++"]
  - method: POST
    path: "/requests/{id}/resolve"
    description: "resolve a request under review (terminal)"
    roles: [HealthGrievanceOfficer]
    code: 200
    input: []
    output: Request
    side_effects: ["UNDER_REVIEW->RESOLVED"]

  # --- Disciplinary ---
  - method: POST
    path: "/bookings/{id}/infractions"
    description: "report a disciplinary infraction (records reporter's X-User-ID)"
    roles: [IntakeOfficer, ClassificationOfficer, Scheduler, HealthGrievanceOfficer, Supervisor]
    code: 201
    input: [infraction_type, good_time_forfeit_days]
    output: DisciplinaryInfraction
    side_effects: ["create DisciplinaryInfraction REPORTED; set reported_by_user_id = X-User-ID"]
  - method: GET
    path: "/bookings/{id}/infractions"
    description: "list infractions for a booking (FK reverse DisciplinaryInfraction.booking_id)"
    roles: [ClassificationOfficer, Supervisor]
    code: 200
    input: []
    output: DisciplinaryInfraction[]
    side_effects: []
  - method: POST
    path: "/infractions/{id}/uphold"
    description: "uphold an infraction (SoD: upholder != reporter); forfeits good-time"
    roles: [Supervisor]
    code: 200
    input: []
    output: DisciplinaryInfraction
    side_effects:
      - "REPORTED->UPHELD; add good_time_forfeit_days to Booking.total_forfeited_days"
      - "recompute Booking.earned_good_time_days and projected_release_date; Booking.version++"

  # --- Property ---
  - method: POST
    path: "/bookings/{id}/property"
    description: "log a property item held at intake"
    roles: [IntakeOfficer]
    code: 201
    input: [description, category]
    output: PropertyItem
    side_effects: ["create PropertyItem STORED"]
  - method: GET
    path: "/bookings/{id}/property"
    description: "list property items for a booking (FK reverse PropertyItem.booking_id)"
    roles: [IntakeOfficer, Supervisor]
    code: 200
    input: []
    output: PropertyItem[]
    side_effects: []
  - method: POST
    path: "/property-items/{id}/release"
    description: "return a stored property item to its owner"
    roles: [IntakeOfficer]
    code: 200
    input: []
    output: PropertyItem
    side_effects: ["STORED->RETURNED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any set, the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Supervisor]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["set logical clock to to_iso8601"]

# ============================================================================
# 1.6 Error Code Catalog
# ============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID header"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "acting role not permitted for the operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a path-referenced resource does not exist (inmate/booking/unit/bed/assignment/account/order/court-event/visitor/visit/request/infraction/property)"
  - id: ERR_VALIDATION
    http: 422
    condition: "missing or mistyped required body field, empty lines[] array, or non-positive quantity"
  - id: ERR_INVALID_ENUM
    http: 422
    condition: "enum field value not a declared member"
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "interval end_datetime not strictly after start_datetime"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)"
  - id: ERR_BOOKING_RELEASED
    http: 409
    condition: "operation attempted against a RELEASED booking"
  - id: ERR_BOOKING_NOT_CLASSIFIED
    http: 409
    condition: "housing assignment attempted before the booking is CLASSIFIED"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "entity not in a valid source state for the requested transition"
  - id: ERR_VISITOR_NOT_APPROVED
    http: 409
    condition: "visit references a visitor whose status is not APPROVED"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "infraction upholder X-User-ID equals the reporter's X-User-ID"
  - id: ERR_SECURITY_LEVEL_MISMATCH
    http: 409
    condition: "bed's unit security_level does not equal booking.classification_level"
  - id: ERR_GENDER_MISMATCH
    http: 409
    condition: "bed's unit gender does not accept the inmate's sex"
  - id: ERR_BED_DOUBLE_BOOKED
    http: 409
    condition: "requested bed interval overlaps an existing ACTIVE assignment on that bed"
  - id: ERR_VISIT_OVERLAP
    http: 409
    condition: "requested visit is within the 30-minute buffer of another non-cancelled visit on the same booking"
  - id: ERR_HOUSING_UNIT_FULL
    http: 409
    condition: "housing unit occupied-bed count is already at capacity"
  - id: ERR_INSUFFICIENT_FUNDS
    http: 402
    condition: "commissary account balance does not cover the order total"
  - id: ERR_NOT_RELEASE_ELIGIBLE
    http: 409
    condition: "TIME_SERVED release before current date reaches projected_release_date"

# ============================================================================
# 1.7 RBAC Matrix
# ============================================================================
roles:
  - name: IntakeOfficer
    description: "books inmates, logs property, manages commissary deposits/orders/fulfillment"
    identity: "opaque"
    exclusive_operations:
      - "POST /inmates"
      - "POST /bookings"
      - "POST /bookings/{id}/property"
      - "POST /property-items/{id}/release"
      - "POST /commissary-accounts/{id}/deposits"
      - "POST /commissary-accounts/{id}/orders"
      - "POST /commissary-orders/{id}/fulfill"
    shared_operations:
      - "POST /bookings/{id}/infractions"
      - "GET reads within intake/commissary/property scope"
  - name: ClassificationOfficer
    description: "classifies bookings and manages housing units/beds/assignments"
    identity: "opaque"
    exclusive_operations:
      - "POST /bookings/{id}/classifications"
      - "POST /housing-units"
      - "POST /housing-units/{id}/beds"
      - "POST /housing-assignments"
      - "POST /housing-assignments/{id}/end"
    shared_operations:
      - "POST /bookings/{id}/infractions"
      - "GET reads within classification/housing scope"
  - name: Scheduler
    description: "schedules court events and manages visitation"
    identity: "opaque"
    exclusive_operations:
      - "POST /bookings/{id}/court-events"
      - "POST /court-events/{id}/continue"
      - "POST /court-events/{id}/attend"
      - "POST /inmates/{id}/visitors"
      - "POST /visitors/{id}/approve"
      - "POST /visits/{id}/approve"
    shared_operations:
      - "POST /visits"
      - "POST /visits/{id}/cancel"
      - "POST /bookings/{id}/infractions"
      - "GET reads within court/visitation scope"
  - name: HealthGrievanceOfficer
    description: "handles medical and grievance requests"
    identity: "opaque"
    exclusive_operations:
      - "POST /bookings/{id}/requests"
      - "POST /requests/{id}/review"
      - "POST /requests/{id}/deny"
      - "POST /requests/{id}/appeal"
      - "POST /requests/{id}/resolve"
    shared_operations:
      - "POST /bookings/{id}/infractions"
      - "GET reads within request scope"
  - name: Supervisor
    description: "releases inmates, upholds infractions, refunds commissary, sets logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /bookings/{id}/release"
      - "POST /infractions/{id}/uphold"
      - "POST /commissary-orders/{id}/refund"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /bookings/{id}/infractions"
      - "GET reads across all scopes"
  - name: Visitor
    description: "an approved external visitor acting on their own visits"
    identity: "entity_backed:Visitor"
    exclusive_operations: []
    shared_operations:
      - "POST /visits"
      - "POST /visits/{id}/cancel"
      - "GET /visits/{id}"
