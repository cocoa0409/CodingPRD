      - name: compliant_shipment_cannot_be_reviewed_a_second_time
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines[entity=ImportShipment].terminal_states
          - validations[priority=45]
          - errors.ERR_SHIPMENT_STATE_INVALID
        distinguishing_aspect: "MARKING_COMPLIANT is terminal, so the second review of the very same entry is refused at priority 45 and the row keeps its first review_decided_at, its zero assessment and its null deficiency_code - a re-review must not be able to turn a cleared entry into a penalised one."
        test_recipe:
          setup:
            - "Market US is registered; one brand owns style NL-4410 and filed entry ENT-7001 for 100 units at 400.00 USD."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-4410", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id }
            - call: "POST /labeling/import-shipments"
              payload: { importer_brand_id: "${brand_id}", style_id: "${style_id}", entry_number: "ENT-7001", quantity_units: 100, declared_value_usd: 400.00, entry_market_code: "US" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { sh_id: $.data.id, state_filed: $.data.marking_state }
            - call: "POST /labeling/import-shipments/${sh_id}/marking-review"
              payload: { outcome: "COMPLIANT" }
              as: CustomsOfficer
              captures: { state_first: $.data.marking_state, assessed_first: $.data.penalty_assessed_usd, decided_first: $.data.review_decided_at }
          trigger:
            - call: "POST /labeling/import-shipments/${sh_id}/marking-review"
              payload: { outcome: "DEFICIENT", deficiency_code: "MISSING_ORIGIN" }
              as: CustomsOfficer
              captures: { err: $.data.error_id }
            - call: "GET /labeling/import-shipments/${sh_id}"
              payload: {}
              as: CustomsOfficer
              captures: { state_after: $.data.marking_state, assessed_after: $.data.penalty_assessed_usd, deficiency_after: $.data.deficiency_code, decided_after: $.data.review_decided_at }
          assert:
            - "${state_filed} == \"ENTRY_FILED\" and ${state_first} == \"MARKING_COMPLIANT\" with ${assessed_first} == 0.00"
            - "HTTP 409 and ${err} == \"ERR_SHIPMENT_STATE_INVALID\""
            - "${state_after} == \"MARKING_COMPLIANT\", ${assessed_after} == 0.00, ${deficiency_after} == null and ${decided_after} == ${decided_first}"
            - "Brand.outstanding_penalty_usd == 0.00 and Brand.posture == \"OPEN\""

