          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_WATERFALL_ORDER_VIOLATION"

      - name: modification_approve_rate_floor_clamps_at_300bps
        claim_type: correct_result
        grounds: ["calculations.modification_restructure", "entities.LossMitigationAction.fields.new_payment_cents"]
        distinguishing_aspect: "modified_rate_bps clamps at the RATE_FLOOR_BPS 300 when note_rate_bps 400 - 200 = 200 would undercut it: new_upb 30880000 at 300 bps gives new_payment 77200 and reduction_bps 6140."
        test_recipe:
          setup: ["one IN_DEFAULT case with a PENDING LOAN_MODIFICATION action; note_rate_bps 400"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Rate Floor Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "FL-1", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 400, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /mi/loan-cases/${lc_id}/appraisals", payload: { appraised_value_cents: 31250000, effective_date: "2026-07-01" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { ap_id: $.data.id } }
            - { call: "POST /mi/appraisals/${ap_id}/decide", payload: { decision: ACCEPT }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/loan-cases/${lc_id}/submit-underwriting", payload: {}, as: LenderOfficer, as_user_id: "${len_id}" }
            - { call: "POST /mi/loan-cases/${lc_id}/endorsement-review", payload: { decision: ENDORSE }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/loan-cases/${lc_id}/declare-default", payload: {}, as: ServicerOfficer, as_user_id: "${len_id}" }
            - { call: "POST /mi/loan-cases/${lc_id}/loss-mitigation-actions", payload: { action_type: REPAYMENT_PLAN }, as: ServicerOfficer, as_user_id: "${len_id}", captures: { lm1: $.data.id } }
            - { call: "POST /mi/loss-mitigation-actions/${lm1}/evaluate", payload: { decision: FAILED }, as: ServicerOfficer, as_user_id: "${len_id}" }
            - { call: "POST /mi/loan-cases/${lc_id}/loss-mitigation-actions", payload: { action_type: SPECIAL_FORBEARANCE }, as: ServicerOfficer, as_user_id: "${len_id}", captures: { lm2: $.data.id } }
            - { call: "POST /mi/loss-mitigation-actions/${lm2}/evaluate", payload: { decision: FAILED }, as: ServicerOfficer, as_user_id: "${len_id}" }
            - { call: "POST /mi/loan-cases/${lc_id}/loss-mitigation-actions", payload: { action_type: LOAN_MODIFICATION }, as: ServicerOfficer, as_user_id: "${len_id}", captures: { lm3: $.data.id } }
          trigger:
            - { call: "POST /mi/loss-mitigation-actions/${lm3}/evaluate", payload: { decision: APPROVE, months_late: 4, escrow_advances_cents: 80000 }, as: ServicerOfficer, as_user_id: "${len_id}" }
          assert:
            - "response status == 200"
            - "data.status == APPROVED"
            - "data.new_upb_cents == 30880000"
            - "data.new_payment_cents == 77200"
            - "data.reduction_bps == 6140"

  # ---------------------------------------------------------------------------
  # Section: validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: unauthenticated_request_missing_role_header
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers fails priority-1 auth with 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /mi/lenders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin, note: "test driver sends the request WITHOUT the X-User-Role and X-User-ID headers; the as: field only names the endpoint's declared role set" }
          assert:
            - "response status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: unrecognized_role_header_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "An X-User-Role value outside the declared role catalog is unrecognized and rejected 401 ERR_UNAUTHENTICATED (auth failure, not a 403)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /mi/lenders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: PlatformAdmin, note: "test driver sends X-User-Role: SuperUser (an undeclared role) with any X-User-ID" }
          assert:
            - "response status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

      - name: resubmit_by_non_owner_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN_OWNERSHIP]", "state_machines.Lender.RETURNED_to_DESK_REVIEW"]
        distinguishing_aspect: "RESUBMIT by a LenderOfficer whose X-User-ID differs from the lender id fails the ownership check with 403 ERR_FORBIDDEN_OWNERSHIP."
        test_recipe:
          setup: ["one lender in RETURNED"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Owned Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: RETURN }, as: FhaReviewer, as_user_id: rev-1 }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: RESUBMIT }, as: LenderOfficer, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
          assert:
            - "response status == 403"
            - "response.data.error_id == ERR_FORBIDDEN_OWNERSHIP"

      - name: missing_required_field_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "validations[priority=4]", "validations[priority=5]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A filing create missing fiscal_year_end against a NON-EXISTENT lender returns 400 ERR_VALIDATION (payload shape at priority 5 wins over existence at priority 4 per the scaffold's ordering)."
        test_recipe:
          setup: ["one lender created (only to source a legitimate version value); the trigger path id does not exist and the payload omits fiscal_year_end"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Decoy Priority Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { decoy_v: $.data.version } }
          trigger:
            - { call: "POST /mi/lenders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/financial-filings", payload: { total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${decoy_v}" }, as: LenderOfficer, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
          assert:
            - "response status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: invalid_action_enum_on_status_change
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_VALIDATION]", "endpoints[POST /mi/lenders/{lenderId}/status-change]"]
        distinguishing_aspect: "An action value outside the declared status-change matrix (e.g. DEMOTE) is rejected 400 ERR_VALIDATION before any state logic runs."
        test_recipe:
          setup: ["one lender in DESK_REVIEW"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Bad Action Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
          trigger:
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: DEMOTE }, as: FhaReviewer, as_user_id: rev-1 }
          assert:
            - "response status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: occ_mismatch_returns_412_stale_version
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_STALE_VERSION]", "concurrency_rules[filing-decide-stale-lender]"]
        distinguishing_aspect: "Deciding a filing with an expected_lender_version one behind the current version fails OCC with 412 ERR_STALE_VERSION (sequential stale read, no wall-clock dependency)."
        test_recipe:
          setup: ["one lender (version 2 after filing create) with one SUBMITTED filing; client holds the pre-create version 1"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "OCC Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id, len_v1: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v1}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
          trigger:
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v1}" }, as: FhaReviewer, as_user_id: rev-1 }
          assert:
            - "response status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: endorsement_on_blocked_case_returns_case_blocked
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_CASE_BLOCKED]"]
        distinguishing_aspect: "Endorsement review on a case frozen by the suspension cascade returns 409 ERR_CASE_BLOCKED — the domain-specific blocked error, not generic ERR_INVALID_STATE."
        test_recipe:
          setup: ["one approved-then-suspended lender whose UNDERWRITE_SUBMITTED case was cascaded to BLOCKED"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Blocked Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "BLK-1", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /mi/loan-cases/${lc_id}/appraisals", payload: { appraised_value_cents: 31250000, effective_date: "2026-07-01" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { ap_id: $.data.id } }
            - { call: "POST /mi/appraisals/${ap_id}/decide", payload: { decision: ACCEPT }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/loan-cases/${lc_id}/submit-underwriting", payload: {}, as: LenderOfficer, as_user_id: "${len_id}" }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: SUSPEND }, as: FhaApprover, as_user_id: app-1 }
          trigger:
            - { call: "POST /mi/loan-cases/${lc_id}/endorsement-review", payload: { decision: ENDORSE }, as: FhaReviewer, as_user_id: rev-1 }
          assert:
            - "response status == 409"
            - "response.data.error_id == ERR_CASE_BLOCKED"
            - "LoanCase.${lc_id}.status == BLOCKED"

      - name: reviewer_conflict_when_endorser_opens_review
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_REVIEWER_CONFLICT]", "entities.LoanCase.fields.endorsement_reviewer_id"]
        distinguishing_aspect: "The reviewer who endorsed the case (rev-1) cannot open its post-endorsement review: 422 ERR_REVIEWER_CONFLICT; a different reviewer succeeds."
        test_recipe:
          setup: ["one endorsed case whose endorsement_reviewer_id is rev-1"]
          setup_api_calls:
            - { call: "POST /mi/lenders", payload: { legal_name: "Conflict Co", institution_type: MORTGAGEE_SUPERVISED, home_state: "VA", qc_plan_on_file: true }, as: PlatformAdmin, captures: { len_id: $.data.id } }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: ADVANCE_TO_FIELD_REVIEW }, as: FhaReviewer, as_user_id: rev-1, captures: { len_v2: $.data.version } }
            - { call: "POST /mi/lenders/${len_id}/financial-filings", payload: { fiscal_year_end: "2025-12-31", total_assets_cents: 50000000000, total_liabilities_cents: 49000000000, liquid_assets_cents: 5000000000, expected_lender_version: "${len_v2}" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { fil_id: $.data.id } }
            - { call: "GET /mi/lenders/${len_id}", payload: {}, as: PlatformAdmin, captures: { len_v3: $.data.version } }
            - { call: "POST /mi/financial-filings/${fil_id}/decide", payload: { decision: ACCEPT, expected_lender_version: "${len_v3}" }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "CON-1", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /mi/loan-cases/${lc_id}/appraisals", payload: { appraised_value_cents: 31250000, effective_date: "2026-07-01" }, as: LenderOfficer, as_user_id: "${len_id}", captures: { ap_id: $.data.id } }
            - { call: "POST /mi/appraisals/${ap_id}/decide", payload: { decision: ACCEPT }, as: FhaReviewer, as_user_id: rev-1 }
            - { call: "POST /mi/loan-cases/${lc_id}/submit-underwriting", payload: {}, as: LenderOfficer, as_user_id: "${len_id}" }
            - { call: "POST /mi/loan-cases/${lc_id}/endorsement-review", payload: { decision: ENDORSE }, as: FhaReviewer, as_user_id: rev-1 }
          trigger:
            - { call: "POST /mi/loan-cases/${lc_id}/post-endorsement-reviews", payload: { scope_codes: ["INCOME"] }, as: FhaReviewer, as_user_id: rev-1 }
          assert:
            - "response status == 422"
            - "response.data.error_id == ERR_REVIEWER_CONFLICT"

      - name: endorsement_without_accepted_appraisal
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_APPRAISAL_NOT_ACCEPTED]"]
        distinguishing_aspect: "Endorsement with only a DELIVERED (never decided) appraisal fails the accepted-appraisal referential gate with 409 ERR_APPRAISAL_NOT_ACCEPTED."
        test_recipe:
          setup: ["one case in UNDERWRITE_SUBMITTED whose only appraisal is DELIVERED"]
          setup_api_calls:
