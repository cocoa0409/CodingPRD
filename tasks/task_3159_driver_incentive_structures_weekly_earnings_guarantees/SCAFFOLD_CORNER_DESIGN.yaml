# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3159_driver_incentive_structures_weekly_earnings_guarantees
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: market_create_returns_computed_budget_fields_and_active_status
        claim_type: Creation
        grounds:
          - entities.Market
          - endpoints.POST_/markets
        distinguishing_aspect: "A market created with code/cells/budget returns 201 with status ACTIVE, version 1, budget_spent 0, budget_reserved 0, budget_available == incentive_budget_cents — computed budget fields are never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &market
              call: "POST /markets"
              payload: { market_code: "MKE", geo_cells: ["cellA", "cellB"], incentive_budget_cents: 750000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
          assert:
            - "response status 201; Market.${mkt}.status == ACTIVE and version == 1"
            - "Market.${mkt}.budget_spent_cents == 0 and budget_reserved_cents == 0"
            - "Market.${mkt}.budget_available_cents == 750000"
            - "response carries non-null id, created_at, updated_at; meta.api_request_id present"

      - name: driver_create_onboards_with_eligible_rate_and_clear_fraud
        claim_type: Defaults
        grounds:
          - entities.Driver
          - endpoints.POST_/drivers
        distinguishing_aspect: "A freshly onboarded driver starts with account_status ACTIVE, rate_posture ELIGIBLE, fraud_posture CLEAR, all rolling counters zeroed, and acceptance_rate_bps 10000 (empty-window default)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Market MKE exists."
          setup_api_calls:
            - *clock
            - *market
          trigger:
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Fresh Fran" }
              as: IncentiveOps
              captures: { drv: $.data.id }
          assert:
            - "Driver.${drv}.account_status == ACTIVE, rate_posture == ELIGIBLE, fraud_posture == CLEAR"
            - "Driver.${drv}.offers_total == 0, accepted_total == 0, cancelled_total == 0"
            - "Driver.${drv}.acceptance_rate_bps == 10000 and cancellation_rate_bps == 0"

      - name: get_missing_program_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.IncentiveProgram
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but nonexistent program id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *clock
          trigger:
            - call: "GET /incentive-programs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: IncentiveOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: program_create_streak_without_streak_length_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=9]
          - errors[ERR_PROGRAM_CONFIG_INCOMPLETE]
        distinguishing_aspect: "A STREAK program missing streak_length is rejected with ERR_PROGRAM_CONFIG_INCOMPLETE even though the generic required fields are all present."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Market MKE exists."
          setup_api_calls:
            - *clock
            - *market
          trigger:
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "STREAK", title: "S", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], streak_payout_cents: 5000 }
              as: IncentiveOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_CONFIG_INCOMPLETE"

      - name: programs_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/incentive-programs
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three programs on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the final row with has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Market MKE with three STREAK programs."
          setup_api_calls:
            - *clock
            - *market
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "STREAK", title: "S1", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], streak_length: 2, streak_payout_cents: 5000 }
              as: IncentiveOps
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "STREAK", title: "S2", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], streak_length: 3, streak_payout_cents: 7000 }
              as: IncentiveOps
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "STREAK", title: "S3", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], streak_length: 4, streak_payout_cents: 9000 }
              as: IncentiveOps
          trigger:
            - call: "GET /incentive-programs"
              payload: { market_id: "${mkt}", limit: 2, offset: 0 }
              as: IncentiveOps
            - call: "GET /incentive-programs"
              payload: { market_id: "${mkt}", limit: 2, offset: 2 }
              as: IncentiveOps
          assert:
            - "First page: 2 rows, total_count == 3, has_more == true"
            - "Second page: 1 row, total_count == 3, has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: ride_decline_latches_streak_broken_and_zeroes_progress
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Ride.OFFERED_to_DECLINED
          - entities.IncentiveEnrollment.fields.streak_broken
        distinguishing_aspect: "Declining an offered ride mid-streak sets streak_broken true and resets progress_count to 0 on the driver's ACTIVE streak enrollment; the enrollment itself stays ACTIVE."
        test_recipe:
          setup:
            - "Clock 2026-09-01; Market GRB; STREAK ACTIVE length 3 payout 5000 window 2026-09-07..09-14; driver enrolled; one qualifying ride COMPLETED (progress 1); a second ride OFFERED."
          setup_api_calls:
            - *clock
            - call: "POST /markets"
              payload: { market_code: "GRB", geo_cells: ["cellA"], incentive_budget_cents: 10000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Streaky Stan" }
              as: IncentiveOps
              captures: { drv: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "STREAK", title: "S", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], streak_length: 3, streak_payout_cents: 5000 }
              as: IncentiveOps
              captures: { prog: $.data.id }
            - call: "POST /incentive-programs/${prog}/activate"
              payload: {}
              as: IncentiveOps
            - call: "POST /incentive-programs/${prog}/enrollments"
              payload: { driver_id: "${drv}" }
              as: IncentiveOps
              captures: { enr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 8000, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride1: $.data.id }
            - call: "POST /rides/${ride1}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride1}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 8000, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride2: $.data.id }
          trigger:
            - call: "POST /rides/${ride2}/decline"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "GET /enrollments/${enr}"
              payload: {}
              as: IncentiveOps
          assert:
            - "Ride.${ride2}.status == DECLINED"
            - "IncentiveEnrollment.${enr}.streak_broken == true and progress_count == 0"
            - "IncentiveEnrollment.${enr}.status == ACTIVE (broken streak does not cancel the enrollment)"

      - name: rider_cancel_preserves_streak_and_cancellation_rate
        claim_type: Conditional cascade
        grounds:
          - state_machines.Ride.ACCEPTED_to_RIDER_CANCELLED
        distinguishing_aspect: "A RIDER-cancelled ride has zero cancellation-rate impact and does NOT touch the streak latch — the conditional cascade applies only to cancelled_by == DRIVER."
        test_recipe:
          setup:
            - "Clock 2026-09-01; Market AUS; STREAK ACTIVE length 3; driver enrolled with one COMPLETED qualifying ride; a second ride ACCEPTED."
          setup_api_calls:
            - *clock
            - call: "POST /markets"
              payload: { market_code: "AUS", geo_cells: ["cellA"], incentive_budget_cents: 10000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Rider Cancel Ria" }
              as: IncentiveOps
              captures: { drv: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "STREAK", title: "S", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], streak_length: 3, streak_payout_cents: 5000 }
              as: IncentiveOps
              captures: { prog: $.data.id }
            - call: "POST /incentive-programs/${prog}/activate"
              payload: {}
              as: IncentiveOps
            - call: "POST /incentive-programs/${prog}/enrollments"
              payload: { driver_id: "${drv}" }
              as: IncentiveOps
              captures: { enr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 8000, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride1: $.data.id }
            - call: "POST /rides/${ride1}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride1}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 8000, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride2: $.data.id }
            - call: "POST /rides/${ride2}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
          trigger:
            - call: "POST /rides/${ride2}/cancel"
              payload: { cancelled_by: "RIDER" }
              as: Driver
              as_user_id: "${drv}"
            - call: "GET /enrollments/${enr}"
              payload: {}
              as: IncentiveOps
            - call: "GET /drivers/${drv}"
              payload: {}
              as: IncentiveOps
          assert:
            - "Ride.${ride2}.status == RIDER_CANCELLED"
            - "IncentiveEnrollment.${enr}.streak_broken == false and progress_count == 1 (unchanged)"
            - "Driver.${drv}.cancelled_total == 0 (rider cancel does not count)"

      - name: complete_terminal_ride_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Ride
          - errors[ERR_RIDE_ALREADY_TERMINAL]
        distinguishing_aspect: "Completing an already-COMPLETED ride is rejected; terminal states admit no further transitions."
        test_recipe:
          setup:
            - "Clock 2026-09-01; Market CRW; driver with one COMPLETED ride."
          setup_api_calls:
            - *clock
            - call: "POST /markets"
              payload: { market_code: "CRW", geo_cells: ["cellA"], incentive_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Terminal Tim" }
              as: IncentiveOps
              captures: { drv: $.data.id }
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 8000, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride1: $.data.id }
            - call: "POST /rides/${ride1}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride1}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
          trigger:
            - call: "POST /rides/${ride1}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RIDE_ALREADY_TERMINAL"
            - "Ride.${ride1}.status remains COMPLETED"

      - name: retire_program_with_active_enrollment_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.IncentiveProgram
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Retire requires zero ACTIVE enrollments; with one ACTIVE enrollment the call fails and the program stays ACTIVE."
        test_recipe:
          setup:
            - "Clock 2026-09-01; Market CHS; STREAK ACTIVE; driver enrolled (ACTIVE)."
          setup_api_calls:
            - *clock
            - call: "POST /markets"
              payload: { market_code: "CHS", geo_cells: ["cellA"], incentive_budget_cents: 10000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Retire Rita" }
              as: IncentiveOps
              captures: { drv: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "STREAK", title: "S", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], streak_length: 2, streak_payout_cents: 5000 }
              as: IncentiveOps
              captures: { prog: $.data.id }
            - call: "POST /incentive-programs/${prog}/activate"
              payload: {}
              as: IncentiveOps
            - call: "POST /incentive-programs/${prog}/enrollments"
              payload: { driver_id: "${drv}" }
              as: IncentiveOps
          trigger:
            - call: "POST /incentive-programs/${prog}/retire"
              payload: {}
              as: IncentiveOps
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "IncentiveProgram.${prog}.status remains ACTIVE"

      - name: market_close_cascades_programs_retired_and_shortfalls_expired
        claim_type: Cascade down
        grounds:
          - state_machines.Market
          - state_machines.SupplyShortfall.OPEN_to_EXPIRED
        distinguishing_aspect: "Closing a market retires all non-ACTIVE programs (DRAFT here) and expires OPEN shortfalls in one cascade."
        test_recipe:
          setup:
            - "Clock 2026-09-01; Market SAV with one DRAFT STREAK program and one OPEN shortfall."
          setup_api_calls:
            - *clock
            - call: "POST /markets"
              payload: { market_code: "SAV", geo_cells: ["cellA"], incentive_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "STREAK", title: "S", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], streak_length: 2, streak_payout_cents: 5000 }
              as: IncentiveOps
              captures: { prog: $.data.id }
            - call: "POST /supply-shortfalls"
              payload: { market_id: "${mkt}", geo_cell_id: "cellA", hour_bucket: 40, severity_bps: 2500 }
              as: IncentiveOps
              captures: { sf: $.data.id }
          trigger:
            - call: "POST /markets/${mkt}/close"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Market.${mkt}.status == CLOSED"
            - "IncentiveProgram.${prog}.status == RETIRED"
            - "SupplyShortfall.${sf}.status == EXPIRED"

      - name: direct_enrollment_cancel_releases_zone_capacity_slot
        claim_type: Compensation
        grounds:
          - state_machines.IncentiveEnrollment.ACTIVE_to_CANCELLED
          - endpoints.POST_/enrollments/{id}/cancel
        distinguishing_aspect: "Cancelling a zone enrollment directly (not via posture cascade) releases the capacity-1 slot; a second driver can then enroll."
        test_recipe:
          setup:
            - "Clock 2026-09-01; Market ALE; BONUS_ZONE ACTIVE capacity 1 cellA; driver1 enrolled."
          setup_api_calls:
            - *clock
            - call: "POST /markets"
              payload: { market_code: "ALE", geo_cells: ["cellA"], incentive_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Slot Sal" }
              as: IncentiveOps
              captures: { drv1: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Slot Sue" }
              as: IncentiveOps
              captures: { drv2: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "BONUS_ZONE", title: "Z", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], geo_cell_id: "cellA", zone_multiplier_bps: 15000, capacity: 1 }
              as: IncentiveOps
              captures: { zone: $.data.id }
            - call: "POST /incentive-programs/${zone}/activate"
              payload: {}
              as: IncentiveOps
            - call: "POST /incentive-programs/${zone}/enrollments"
              payload: { driver_id: "${drv1}" }
              as: IncentiveOps
              captures: { enr1: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr1}/cancel"
              payload: {}
              as: IncentiveOps
            - call: "POST /incentive-programs/${zone}/enrollments"
              payload: { driver_id: "${drv2}" }
              as: IncentiveOps
              captures: { enr2: $.data.id }
          assert:
            - "IncentiveEnrollment.${enr1}.status == CANCELLED"
            - "IncentiveEnrollment.${enr2}.status == ACTIVE (slot released by the cancel)"

      - name: exclusive_program_suppresses_stackable_streak_payout
        claim_type: Side Effect Execution
        grounds:
          - calculations.streak_payout
          - entities.IncentiveProgram.fields.stacking_class
        distinguishing_aspect: "When the deciding ride also advances an ACTIVE EXCLUSIVE enrollment, the STACKABLE streak payout is suppressed to 0 while the enrollment still COMPLETES."
        test_recipe:
          setup:
            - "Clock 2026-09-01; Market MSY; STREAK STACKABLE ACTIVE length 2 payout 5000; CHALLENGE EXCLUSIVE ACTIVE target 2 payout 12000; driver enrolled in both; both windows 2026-09-07..09-14."
          setup_api_calls:
            - *clock
            - call: "POST /markets"
              payload: { market_code: "MSY", geo_cells: ["cellA"], incentive_budget_cents: 10000000 }
              as: PlatformAdmin
              captures: { mkt: $.data.id }
            - call: "POST /drivers"
              payload: { market_id: "${mkt}", display_name: "Stack Stella" }
              as: IncentiveOps
              captures: { drv: $.data.id }
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "STREAK", title: "S", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "STACKABLE", excluded_ride_types: [], streak_length: 2, streak_payout_cents: 5000 }
              as: IncentiveOps
              captures: { sprog: $.data.id }
            - call: "POST /incentive-programs/${sprog}/activate"
              payload: {}
              as: IncentiveOps
            - call: "POST /incentive-programs"
              payload: { market_id: "${mkt}", program_type: "CHALLENGE", title: "C", window_start_utc: "2026-09-07T00:00:00Z", window_end_utc: "2026-09-14T00:00:00Z", stacking_class: "EXCLUSIVE", excluded_ride_types: [], challenge_ride_target: 2, challenge_payout_cents: 12000 }
              as: IncentiveOps
              captures: { cprog: $.data.id }
            - call: "POST /incentive-programs/${cprog}/activate"
              payload: {}
              as: IncentiveOps
            - call: "POST /incentive-programs/${sprog}/enrollments"
              payload: { driver_id: "${drv}" }
              as: IncentiveOps
              captures: { senr: $.data.id }
            - call: "POST /incentive-programs/${cprog}/enrollments"
              payload: { driver_id: "${drv}" }
              as: IncentiveOps
              captures: { cenr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 8000, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride1: $.data.id }
            - call: "POST /rides/${ride1}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride1}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
          trigger:
            - call: "POST /rides"
              payload: { driver_id: "${drv}", market_id: "${mkt}", ride_type: "STANDARD", geo_cell_id: "cellA", base_fare_cents: 8000, tips_cents: 0 }
              as: Driver
              as_user_id: "${drv}"
              captures: { ride2: $.data.id }
            - call: "POST /rides/${ride2}/accept"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
            - call: "POST /rides/${ride2}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv}"
