      - name: each_approval_hop_requires_the_role_that_owns_that_stage
        claim_type: approval_chain
        grounds:
          - validations.priority_19
          - errors.ERR_APPROVAL_LEVEL_MISMATCH
          - calculations.required_approval_level
          - state_machines.Trip.approval_state
        distinguishing_aspect: |
          A DIRECTOR_AND_COMPLIANCE trip has two approval hops that belong to two different roles,
          and each role is confined to exactly one of them. The officer cannot start the chain at
          PENDING_REVIEW and the director cannot finish it at PENDING_COMPLIANCE, so the same
          request body produces a 409 or a 200 depending only on the stage the trip is in. The
          level itself has to be derived, not supplied: a TIER_1 protectee travelling to a
          HIGH-band destination is escalated past the DIRECTOR base that the band alone implies.
        test_recipe:
          setup:
            - "a TIER_1 executive, a HIGH-band NG destination rating (composite 62.00), a VERIFIED MEDICAL_EVAC policy with coverage 200000000, and a trip with one NG leg whose four HIGH-band advance items are all COMPLETE, submitted for approval and acknowledged"
