            - { call: "POST /applications/${app2}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app2}/decide", payload: { decision: "WAITLIST" }, as: ProgramCoordinator }
            - { call: "POST /applications", payload: { cycle_id: "${cyc}", applicant_name: "Carol Cedar", email: "carol@example.org", county: "Harford", prior_gardening_years: 7 }, as: ProgramCoordinator, captures: { app3: $.data.id } }
            - { call: "POST /applications/${app3}/score", payload: { essay_score: 80, interview_score: 90 }, as: ProgramCoordinator }
            - { call: "POST /applications/${app3}/decide", payload: { decision: "WAITLIST" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /program-cycles/${cyc}/promote-waitlisted", as: ProgramCoordinator, captures: { promoted: $.data.id, pst: $.data.status } }
            - { call: "GET /volunteers?application_id=${app2}", as: ProgramCoordinator, captures: { v2: "$.data[0].id" } }
