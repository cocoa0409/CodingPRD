            - "RESOLVED is terminal: a further MONITOR returns HTTP 409 with error_id 'ERR_TERMINAL_STATE' (priority 14)"

      - name: revalidation_failure_cascades_down_to_version_and_deployment
        claim_type: Cascade down
        grounds:
          - state_machines.RevalidationTask.IN_REVIEW_to_FAILED
          - state_machines.ModelVersion.APPROVED_to_BLOCKED
          - state_machines.Deployment_rollout_state.RAMPING_to_DRAINING
          - calculations.endpoint_traffic_ledger
        distinguishing_aspect: |
          The THIRD independent cascade root in the scaffold (§1.8 covers the dataset-revocation and
          drift-breach roots): a FAILED RevalidationTask blocks its version, drains that version's
          serving deployments to 0.00 with a DRAIN_RELEASE audit row, and releases the endpoint
          ledger — all inside the disposition request. Hop 4 is a no-op here because no
          ChallengerEvaluation is COLLECTING, which is itself the conditional-cascade claim.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default, then 2026-10-31T00:00:00Z"
            - "one APPROVED ModelVersion approved at 2026-08-01 by u_appr_1 with Model.revalidation_interval_days 90, so revalidation_due_at == 2026-10-30T00:00:00Z"
            - "one REALTIME Deployment of it ramped twice at clock 2026-08-01 (RAMPING, traffic_pct 15.00)"
            - "one DUE RevalidationTask produced by the operator sweep once the clock passes the due date"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml", revalidation_interval_days: 90 }
              as: MLEngineer
