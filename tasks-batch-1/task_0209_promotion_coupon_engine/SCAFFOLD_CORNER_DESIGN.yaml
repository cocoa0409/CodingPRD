# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Promotion & Coupon Engine — Expert band
# Breadth probe across the claim-extraction-guide's nine sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.Customer]
        distinguishing_aspect: "POST /customers with email+display_name returns 201; order_count==0, lifetime_discount_cents==0, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "new@x.com", display_name: "New" }
              as: Shopper
              captures: { cust_id: $.data.id }
          assert:
            - "response code 201"
            - "Customer.${cust_id}.order_count == 0"
            - "Customer.${cust_id}.lifetime_discount_cents == 0"
            - "Customer.${cust_id}.version == 1"

      - name: get_promotion_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Promotion]
        distinguishing_aspect: "GET /promotions/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /promotions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: MerchantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_NOT_FOUND (404)"

      - name: create_promotion_missing_required_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Promotion.fields.promo_type, "validations[priority=5]"]
        distinguishing_aspect: "POST /promotions omitting promo_type -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /promotions"
              payload: { name: "NoType", stacking_class: "STACKABLE", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_INVALID_REQUEST (400)"

      - name: create_promotion_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Promotion.fields.promo_type, "validations[priority=5]"]
        distinguishing_aspect: "POST /promotions with promo_type='WEEKLY' (not in enum) -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /promotions"
              payload: { name: "BadEnum", promo_type: "WEEKLY", stacking_class: "STACKABLE", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_INVALID_REQUEST (400)"

      - name: eligibility_mode_defaults_to_all
        claim_type: Defaults
        grounds: [entities.Promotion.fields.eligibility_mode]
        distinguishing_aspect: "POST /promotions omitting eligibility_mode -> stored value ALL."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /promotions"
              payload: { name: "DefElig", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
          assert:
            - "Promotion.${promo_id}.eligibility_mode == ALL"

      - name: cart_subtotal_computed_from_lines
        claim_type: Computed Fields
        grounds: [entities.Cart.fields.subtotal_cents, calculations.percent_off_discount]
        distinguishing_aspect: "subtotal_cents is server-computed as sum(unit_price*qty); a client-sent subtotal is ignored (field not in input)."
        test_recipe:
          setup: ["Cart with two lines (1000c x2) and (500c x3) -> subtotal 3500."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sub@x.com", display_name: "Sub" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "A", unit_price_cents: 1000, quantity: 2 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "B", unit_price_cents: 500, quantity: 3 }
              as: Shopper
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          assert:
            - "Cart.${cart_id}.subtotal_cents == 3500"

      - name: blackout_window_immutable_no_version
        claim_type: Immutability
        grounds: [entities.BlackoutWindow]
        distinguishing_aspect: "BlackoutWindow has common_fields:false — created with id+created_at only, no version field and no update endpoint."
        test_recipe:
          setup: ["Promotion DRAFT with one blackout window."]
          setup_api_calls:
            - call: "POST /promotions"
              payload: { name: "BWImm", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
          trigger:
            - call: "POST /promotions/${promo_id}/blackouts"
              payload: { starts_at: "2026-06-10T00:00:00Z", ends_at: "2026-06-20T00:00:00Z", reason: "freeze" }
              as: MerchantAdmin
              captures: { bw_id: $.data.id }
          assert:
            - "response code 201; BlackoutWindow has id and created_at; no version field is present in the response"

      - name: coupon_requires_existing_parent_promotion
        claim_type: Parent Relationships
        grounds: [entities.Coupon, entities.Coupon.fields.promotion_id]
        distinguishing_aspect: "POST /promotions/{random}/coupons against a non-existent promotion -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /promotions/00000000-0000-0000-0000-000000000000/coupons"
              payload: { code: "ORPHAN", use_mode: "SINGLE_USE" }
              as: MerchantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_NOT_FOUND (404)"

      - name: list_promotions_paginated_envelope
        claim_type: Listing
        grounds: [entities.Promotion, endpoints]
        distinguishing_aspect: "GET /promotions returns array envelope with total_count and has_more in meta/pagination."
        test_recipe:
          setup: ["One DRAFT promotion exists."]
          setup_api_calls:
            - call: "POST /promotions"
              payload: { name: "ListP", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
          trigger:
            - call: "GET /promotions"
              payload: {}
              as: MerchantAdmin
          assert:
            - "response_type == array; data is a list; pagination has_more == false, total_count == 1"

      - name: duplicate_coupon_code_returns_duplicate
        claim_type: Type Constraints
        grounds: [entities.Coupon.fields.code, "validations[priority=6]"]
        distinguishing_aspect: "Second coupon with the same code (case-insensitive) -> ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["Promotion with coupon DUP already created."]
          setup_api_calls:
            - call: "POST /promotions"
              payload: { name: "DupP", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "DUP", use_mode: "SINGLE_USE" }
              as: MerchantAdmin
          trigger:
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "dup", use_mode: "SINGLE_USE" }
              as: MerchantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_DUPLICATE (409)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_from_archived_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Promotion.DRAFT_to_ARCHIVED, "validations[priority=9]"]
        distinguishing_aspect: "Activating an ARCHIVED promotion -> ERR_INVALID_STATE (409); no transition from terminal."
        test_recipe:
          setup: ["Promotion archived from DRAFT."]
          setup_api_calls:
            - call: "POST /promotions"
              payload: { name: "ArchP", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/archive"
              payload: {}
              as: MerchantAdmin
          trigger:
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_INVALID_STATE (409)"

      - name: pause_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Promotion.ACTIVE_to_PAUSED, "validations[priority=9]"]
        distinguishing_aspect: "Pausing a DRAFT (never activated) promotion -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Promotion in DRAFT."]
          setup_api_calls:
            - call: "POST /promotions"
              payload: { name: "DraftPause", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
          trigger:
            - call: "POST /promotions/${promo_id}/pause"
              payload: {}
              as: MerchantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_INVALID_STATE (409)"

      - name: promotion_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.Promotion, entities.Promotion.fields.status]
        distinguishing_aspect: "Newly created Promotion starts in DRAFT (initial_state)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /promotions"
              payload: { name: "InitP", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
          assert:
            - "Promotion.${promo_id}.status == DRAFT"

      - name: checkout_from_open_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Cart.checkout_status.LOCKED_to_CHECKED_OUT, "validations[priority=9]"]
        distinguishing_aspect: "Checking out an OPEN (un-locked) cart -> ERR_INVALID_STATE (409); checkout requires LOCKED."
        test_recipe:
          setup: ["Clock 2026-06-15. OPEN cart with one line, repriced but not locked."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "sm4@x.com", display_name: "SM4" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "A", unit_price_cents: 1000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_ver: $.data.version }
          trigger:
            - call: "POST /carts/${cart_id}/checkout"
              payload: { expected_cart_version: "${cart_ver}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_INVALID_STATE (409) — cart is OPEN, not LOCKED"

      - name: terminal_checked_out_cart_rejects_unlock
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Cart.checkout_status.LOCKED_to_OPEN, "validations[priority=9]"]
        distinguishing_aspect: "Unlocking a CHECKED_OUT (terminal) cart -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Clock 2026-06-15. Cart with line repriced, locked, checked out (terminal CHECKED_OUT)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "sm5@x.com", display_name: "SM5" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "A", unit_price_cents: 1000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/lock"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_ver: $.data.version }
            - call: "POST /carts/${cart_id}/checkout"
              payload: { expected_cart_version: "${cart_ver}" }
              as: Shopper
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /carts/${cart_id}/unlock"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_INVALID_STATE (409)"

      - name: reprice_on_locked_cart_returns_not_open
        claim_type: Precondition Enforcement
        grounds: [state_machines.Cart.pricing_status.STALE_to_PRICED, "validations[priority=10]"]
        distinguishing_aspect: "Repricing a LOCKED cart -> ERR_CART_NOT_OPEN (409); reprice precondition checkout_status==OPEN."
        test_recipe:
          setup: ["Clock 2026-06-15. Cart with line repriced and locked."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "sm6@x.com", display_name: "SM6" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "A", unit_price_cents: 1000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/lock"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_CART_NOT_OPEN (409)"

      - name: coupon_auto_exhausts_at_cap
        claim_type: Side Effect Execution
        grounds: [state_machines.Coupon.ENABLED_to_EXHAUSTED, entities.Coupon.fields.redeemed_count]
        distinguishing_aspect: "A SINGLE_USE coupon auto-transitions ENABLED->EXHAUSTED after its one CONFIRMED redemption (redeemed_count==1)."
        test_recipe:
          setup: ["Clock 2026-06-15. Promotion EXC PERCENT_OFF 10% ACTIVE, coupon EXCK SINGLE_USE; one cart redeems it to completion."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "sm7@x.com", display_name: "SM7" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "EXC", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "EXCK", use_mode: "SINGLE_USE" }
              as: MerchantAdmin
              captures: { coupon_id: $.data.id }
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "A", unit_price_cents: 2000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "EXCK" }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/lock"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_ver: $.data.version }
          trigger:
            - call: "POST /carts/${cart_id}/checkout"
              payload: { expected_cart_version: "${cart_ver}" }
              as: Shopper
              as_user_id: "${cust_id}"
          assert:
            - "Coupon.${coupon_id}.redeemed_count == 1"
            - "Coupon.${coupon_id}.status == EXHAUSTED"

      - name: archive_paused_with_reservations_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Promotion.PAUSED_to_ARCHIVED, "errors[ERR_PROMO_HAS_RESERVATIONS]"]
        distinguishing_aspect: "Archiving a PAUSED promotion that has an outstanding RESERVED redemption -> ERR_PROMO_HAS_RESERVATIONS (409)."
        test_recipe:
          setup: ["Clock 2026-06-15. Promotion RES PERCENT_OFF 10% ACTIVE, coupon RESK; a cart applies, reprices, locks (RESERVED redemption), then promotion PAUSED."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "sm8@x.com", display_name: "SM8" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "RES", promo_type: "PERCENT_OFF", percent_off: 0.10, stacking_class: "STACKABLE", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "RESK", use_mode: "MULTI_USE", max_total_redemptions: 10 }
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/lines"
              payload: { sku: "A", unit_price_cents: 2000, quantity: 1 }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/applications"
              payload: { code: "RESK" }
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/reprice"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /carts/${cart_id}/lock"
              payload: {}
              as: Shopper
              as_user_id: "${cust_id}"
            - call: "POST /promotions/${promo_id}/pause"
              payload: {}
              as: MerchantAdmin
          trigger:
            - call: "POST /promotions/${promo_id}/archive"
              payload: {}
              as: MerchantAdmin
              captures: { err: $.data.error_id }
          assert:
            - "returns ERR_PROMO_HAS_RESERVATIONS (409)"

      - name: error_promotion_exhausted_auto_transition
        claim_type: Side Effect Execution
        grounds: [state_machines.Promotion.ACTIVE_to_EXHAUSTED]
        excluded_because:
          difficulty_instance: transitive_cascade / tc_checkout_confirm_budget_exhaust_depth3
          rationale: "The ACTIVE->EXHAUSTED auto-transition is the terminal hop asserted by the named §1.8 cascade instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: bogo_cheapest_unit_free
        claim_type: Correct Result
        grounds: [calculations.bogo_discount]
        distinguishing_aspect: "BOGO on sku B: matching units [1799,1799,1799,999], total_qty 4, free 2 cheapest = 999+1799 = 2798 discount."
        test_recipe:
          setup: ["Clock 2026-06-15. Promotion BG BOGO bogo_sku=B ACTIVE, coupon BGK; cart lines (B,1799c x3) and (B,999c x1)."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-06-15T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /customers"
              payload: { email: "calc1@x.com", display_name: "CA1" }
              as: Shopper
              captures: { cust_id: $.data.id }
            - call: "POST /promotions"
              payload: { name: "BG", promo_type: "BOGO", bogo_sku: "B", stacking_class: "STACKABLE", active_from: "2026-06-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: MerchantAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /promotions/${promo_id}/coupons"
              payload: { code: "BGK", use_mode: "MULTI_USE", max_total_redemptions: 100 }
              as: MerchantAdmin
            - call: "POST /promotions/${promo_id}/activate"
              payload: {}
              as: MerchantAdmin
            - call: "POST /carts"
              payload: { customer_id: "${cust_id}" }
              as: Shopper
              as_user_id: "${cust_id}"
              captures: { cart_id: $.data.id }
