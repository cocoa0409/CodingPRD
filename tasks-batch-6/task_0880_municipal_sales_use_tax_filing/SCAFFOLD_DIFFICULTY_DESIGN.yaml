scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: assessment_penalty_variant_audit_vs_late
        grounds:
          - calculations.assessment_penalty_interest
          - entities.Assessment.fields.penalty_cents
          - entities.Assessment.fields.total_due_cents
          - state_machines.Audit.OPEN_to_CLOSED_ASSESSED
        distinguishing_aspect: |
          Assessment domain: identical base (100000 cents) and identical 3 whole
          months late yield total_due_cents 128750 for AUDIT_DEFICIENCY (25% penalty)
          but 113300 for LATE_FILING (10% penalty) — different algorithm, different result.
        test_recipe:
          setup:
            - "One ACTIVE taxpayer; logical clock at 2026-04-20 (assessment issue date); original_due_date 2026-01-20 => 3 whole 30-day months late."
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Acme LLC", entity_type: "LLC", email: "acme@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /tax/audits"
              payload: { taxpayer_id: "${tp_id}", audit_type: "FIELD_AUDIT", period_key: "2026-Q1" }
              as: TaxAuditor
              as_user_id: "aud-1"
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /tax/assessments"
              payload: { taxpayer_id: "${tp_id}", assessment_type: "LATE_FILING", tax_deficiency_cents: 100000, original_due_date: "2026-01-20T00:00:00Z" }
              as: TaxAuditor
              as_user_id: "aud-1"
              captures: { late_asmt_id: $.data.id }
            - call: "POST /tax/audits/${audit_id}/close"
              payload: { outcome: "ASSESSED", tax_deficiency_cents: 100000, original_due_date: "2026-01-20T00:00:00Z" }
              as: TaxAuditor
              as_user_id: "aud-1"
          assert:
            - "Assessment.${late_asmt_id}.penalty_cents == 10000"
            - "Assessment.${late_asmt_id}.interest_cents == 3300"
            - "Assessment.${late_asmt_id}.total_due_cents == 113300"
            - "The AUDIT_DEFICIENCY Assessment with audit_id == ${audit_id} has penalty_cents == 25000, interest_cents == 3750, total_due_cents == 128750"

      - name: refund_interest_variant_statutory_vs_overpayment
        grounds:
          - calculations.refund_interest
          - entities.RefundClaim.fields.interest_cents
          - entities.RefundClaim.fields.refund_total_cents
          - state_machines.RefundClaim.OPEN_to_APPROVED
        distinguishing_aspect: |
          RefundClaim domain: identical principal 50000 and identical 151-day span
          give interest 915 (STATUTORY_DELAY, TAXPAYER_ERROR: only 61 days beyond the
          90-day grace) vs 2265 (OVERPAYMENT_DATE, AUDIT_ADJUSTMENT: full 151 days) —
          totals 50915 vs 52265.
        test_recipe:
          setup:
            - "One ACTIVE taxpayer; two non-overlapping filed returns; clock at 2026-01-01 for claim filing, 2026-06-01 for approval (151 days apart)."
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Beta Corp", entity_type: "CORP", email: "beta@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 200000, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_a_id: $.data.id }
            - call: "POST /tax/returns/${ret_a_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_a_v: $.data.version }
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q2", period_start_date: "2026-04-01T00:00:00Z", period_end_date: "2026-06-30T00:00:00Z", filing_due_date: "2026-07-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 200000, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_b_id: $.data.id }
            - call: "POST /tax/returns/${ret_b_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_b_v: $.data.version }
            - call: "POST /tax/refund-claims"
              payload: { taxpayer_id: "${tp_id}", return_id: "${ret_a_id}", claim_amount_cents: 50000, reason: "TAXPAYER_ERROR", overpayment_date: "2026-01-01T00:00:00Z", expected_return_version: "${ret_a_v}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { claim_err_id: $.data.id }
            - call: "POST /tax/refund-claims"
              payload: { taxpayer_id: "${tp_id}", return_id: "${ret_b_id}", claim_amount_cents: 50000, reason: "AUDIT_ADJUSTMENT", overpayment_date: "2026-01-01T00:00:00Z", expected_return_version: "${ret_b_v}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { claim_aud_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TaxAdmin
          trigger:
            - call: "POST /tax/refund-claims/${claim_err_id}/approve"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/refund-claims/${claim_aud_id}/approve"
              payload: {}
              as: TaxAdmin
          assert:
            - "RefundClaim.${claim_err_id}.interest_cents == 915"
            - "RefundClaim.${claim_err_id}.refund_total_cents == 50915"
            - "RefundClaim.${claim_aud_id}.interest_cents == 2265"
            - "RefundClaim.${claim_aud_id}.refund_total_cents == 52265"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: return_tax_per_line_round_then_sum
        grounds:
          - calculations.return_tax_due
          - entities.TaxReturn.fields.tax_due_cents
          - entities.TaxReturn.fields.total_taxable_cents
          - state_machines.TaxReturn.DRAFT_to_FILED
        distinguishing_aspect: |
          Mode (b) nested rounding: two lines each taxable 333333 at 850 bps round to
          28333 per line (28333.305 -> 28333) summing to 56666; summing taxable first
          (666666 * 0.085 = 56666.61 -> 56667) would differ by 1 cent. Per-line-then-sum is pinned.
        test_recipe:
          setup:
            - "One ACTIVE taxpayer; one jurisdiction at 850 bps; a DRAFT return with two equal lines of taxable 333333."
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Gamma", entity_type: "LLC", email: "g@x.com", filing_frequency: "MONTHLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-01", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-01-31T00:00:00Z", filing_due_date: "2026-02-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 333333, exempt_sales_cents: 0, deduction_cents: 0 }, { jurisdiction_id: "${jur_id}", gross_sales_cents: 333333, exempt_sales_cents: 0, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "TaxReturn.${ret_id}.total_taxable_cents == 666666"
            - "TaxReturn.${ret_id}.tax_due_cents == 56666"

      - name: assessment_interest_on_base_plus_penalty
        grounds:
          - calculations.assessment_penalty_interest
          - entities.Assessment.fields.interest_cents
          - state_machines.Audit.OPEN_to_CLOSED_ASSESSED
        distinguishing_aspect: |
          Mode (c) pinned evaluation order base -> penalty -> interest(base+penalty):
          AUDIT_DEFICIENCY base 100000, penalty 25000, interest is 3750 (on 125000 for
          3 months) — NOT 3000 (which interest-on-base-alone would give).
        test_recipe:
          setup:
            - "One ACTIVE taxpayer; open FIELD_AUDIT; clock 2026-04-20; original_due_date 2026-01-20 (3 months)."
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Delta", entity_type: "CORP", email: "d@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /tax/audits"
              payload: { taxpayer_id: "${tp_id}", audit_type: "FIELD_AUDIT", period_key: "2026-Q1" }
              as: TaxAuditor
              as_user_id: "aud-1"
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /tax/audits/${audit_id}/close"
              payload: { outcome: "ASSESSED", tax_deficiency_cents: 100000, original_due_date: "2026-01-20T00:00:00Z" }
              as: TaxAuditor
              as_user_id: "aud-1"
          assert:
            - "The Assessment with audit_id == ${audit_id} has penalty_cents == 25000"
            - "The Assessment with audit_id == ${audit_id} has interest_cents == 3750"
            - "The Assessment with audit_id == ${audit_id} has total_due_cents == 128750"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: return_amend_refile_cycle
        grounds:
          - state_machines.TaxReturn.FILED_to_AMENDING
          - state_machines.TaxReturn.AMENDING_to_FILED
          - entities.TaxReturn.fields.status
        distinguishing_aspect: |
          TaxReturn cycles FILED -> AMENDING -> FILED: the entity re-enters FILED after
          an amendment, a genuine loop (not a forward-only pipeline).
        test_recipe:
          setup:
            - "One ACTIVE taxpayer; one jurisdiction; a FILED return."
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Epsilon", entity_type: "LLC", email: "e@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 200000, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_v: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/amend"
              payload: { expected_return_version: "${ret_v}", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 500000, exempt_sales_cents: 0, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "After amend, TaxReturn.${ret_id}.status == AMENDING"
            - "After the re-file, TaxReturn.${ret_id}.status == FILED"
            - "TaxReturn.${ret_id}.tax_due_cents == 42500"

      - name: appeal_info_request_cycle
        grounds:
          - state_machines.Appeal.SUBMITTED_to_INFO_REQUESTED
          - state_machines.Appeal.INFO_REQUESTED_to_SUBMITTED
          - entities.Appeal.fields.status
        distinguishing_aspect: |
          Appeal cycles SUBMITTED -> INFO_REQUESTED -> SUBMITTED (different entity than
          TaxReturn): the appeal returns to SUBMITTED after the taxpayer responds.
        test_recipe:
          setup:
            - "One ACTIVE taxpayer; an ISSUED LATE_FILING assessment; a SUBMITTED appeal on it; clock at 2026-04-20."
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Zeta", entity_type: "PARTNERSHIP", email: "z@x.com", filing_frequency: "ANNUAL" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /tax/assessments"
              payload: { taxpayer_id: "${tp_id}", assessment_type: "LATE_FILING", tax_deficiency_cents: 100000, original_due_date: "2026-01-20T00:00:00Z" }
              as: TaxAuditor
              as_user_id: "aud-1"
              captures: { asmt_id: $.data.id }
            - call: "POST /tax/appeals"
              payload: { assessment_id: "${asmt_id}", grounds: "Deficiency disputed." }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { appeal_id: $.data.id }
          trigger:
            - call: "POST /tax/appeals/${appeal_id}/request-info"
              payload: { info_request_note: "Provide invoices." }
              as: AppealsOfficer
              as_user_id: "off-1"
            - call: "POST /tax/appeals/${appeal_id}/respond"
              payload: { response_note: "Invoices attached." }
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "After request-info, Appeal.${appeal_id}.status == INFO_REQUESTED"
            - "After respond, Appeal.${appeal_id}.status == SUBMITTED"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: audit_close_cascades_assessment_return_refund
        grounds:
          - state_machines.Audit.OPEN_to_CLOSED_ASSESSED
          - state_machines.TaxReturn.FILED_to_ASSESSED
          - state_machines.RefundClaim.OPEN_to_VOIDED
          - state_machines.Assessment.ISSUED_to_ABATED
        distinguishing_aspect: |
          Depth-3 chain from audit close: Audit.CLOSED_ASSESSED -> creates ISSUED Assessment
          -> that marks its return ASSESSED -> which voids the OPEN RefundClaim on the return.
          Each link is caused by the previous one, not by the trigger directly.
        test_recipe:
          setup:
            - "One ACTIVE taxpayer; one FILED return; one OPEN refund claim on that return; an OPEN FIELD_AUDIT for the same period; clock 2026-04-20."
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Eta", entity_type: "LLC", email: "eta@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 200000, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_v: $.data.version }
            - call: "POST /tax/refund-claims"
              payload: { taxpayer_id: "${tp_id}", return_id: "${ret_id}", claim_amount_cents: 5000, reason: "TAXPAYER_ERROR", overpayment_date: "2026-04-01T00:00:00Z", expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /tax/audits"
              payload: { taxpayer_id: "${tp_id}", audit_type: "FIELD_AUDIT", period_key: "2026-Q1" }
              as: TaxAuditor
              as_user_id: "aud-1"
              captures: { audit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: TaxAdmin
          trigger:
            - call: "POST /tax/audits/${audit_id}/close"
              payload: { outcome: "ASSESSED", tax_deficiency_cents: 100000, original_due_date: "2026-01-20T00:00:00Z", return_id: "${ret_id}" }
              as: TaxAuditor
              as_user_id: "aud-1"
          assert:
            - "Audit.${audit_id}.status == CLOSED_ASSESSED"
            - "An Assessment with audit_id == ${audit_id} exists in status ISSUED with total_due_cents == 128750"
            - "TaxReturn.${ret_id}.status == ASSESSED"
            - "RefundClaim.${claim_id}.status == VOIDED"

      - name: return_amend_cascades_remittance_unapply
        grounds:
          - state_machines.TaxReturn.FILED_to_AMENDING
          - calculations.remittance_application
          - entities.Remittance.fields.applied_amount_cents
          - entities.Remittance.fields.applied_return_id
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (return amend): TaxReturn.FILED->AMENDING
          -> the return leaving FILED un-applies every Remittance applied to it (applied_amount
          back to 0, applied_return_id cleared).
        test_recipe:
          setup:
            - "One ACTIVE taxpayer; one FILED return (net due 68000, filed late so no discount); a remittance of 100000 with 68000 applied to that return."
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Theta", entity_type: "CORP", email: "t@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 200000, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_v: $.data.version }
            - call: "POST /tax/remittances"
              payload: { taxpayer_id: "${tp_id}", remittance_type: "PAYMENT", amount_cents: 100000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { rem_id: $.data.id }
            - call: "POST /tax/remittances/${rem_id}/apply"
              payload: { applied_return_id: "${ret_id}", apply_amount_cents: 68000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax/returns/${ret_id}/amend"
              payload: { expected_return_version: "${ret_v}", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 500000, exempt_sales_cents: 0, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
          assert:
            - "TaxReturn.${ret_id}.status == AMENDING"
            - "Remittance.${rem_id}.applied_amount_cents == 0"
            - "Remittance.${rem_id}.unapplied_amount_cents == 100000"
            - "Remittance.${rem_id}.applied_return_id == null"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: apply_state_beats_fiscal_on_draft_return
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_RETURN_NOT_FILED]
          - errors[ERR_OVERAPPLICATION]
        distinguishing_aspect: |
          state (ERR_RETURN_NOT_FILED, priority 5) outranks business_fiscal
          (ERR_OVERAPPLICATION, priority 10): applying an over-large amount to a DRAFT
          return returns ERR_RETURN_NOT_FILED, not ERR_OVERAPPLICATION.
        test_recipe:
          setup:
            - "One ACTIVE taxpayer; a DRAFT (unfiled) return; a remittance of 100."
          setup_api_calls:
            - call: "POST /tax/taxpayers"
              payload: { legal_name: "Iota", entity_type: "LLC", email: "i@x.com", filing_frequency: "QUARTERLY" }
              as: Anonymous
              captures: { tp_id: $.data.id }
            - call: "POST /tax/taxpayers/${tp_id}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /tax/jurisdictions"
              payload: { code: "CITY", name: "City", rate_bps: 850 }
              as: TaxAdmin
              captures: { jur_id: $.data.id }
            - call: "POST /tax/returns"
              payload: { taxpayer_id: "${tp_id}", period_key: "2026-Q1", period_start_date: "2026-01-01T00:00:00Z", period_end_date: "2026-03-31T00:00:00Z", filing_due_date: "2026-04-20T00:00:00Z", lines: [ { jurisdiction_id: "${jur_id}", gross_sales_cents: 1000000, exempt_sales_cents: 200000, deduction_cents: 0 } ] }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax/remittances"
              payload: { taxpayer_id: "${tp_id}", remittance_type: "PAYMENT", amount_cents: 100 }
