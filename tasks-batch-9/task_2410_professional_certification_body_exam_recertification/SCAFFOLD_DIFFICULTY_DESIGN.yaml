              payload: {"application_id": "${appB_id}", "form_id": "${form_id}", "fee_paid_cents": 45000}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { regB_id: "$.data.id" }
          trigger:
            - call: "POST /exam-registrations/${regA_id}/schedule"
              payload: {"session_id": "${sess_id}", "expected_session_version": "${sess_v}"}
              as: ExamOperations
              as_user_id: "ops-1"
            - call: "GET /exam-sessions/${sess_id}"
              payload: {}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { sess_v2: "$.data.version" }
            - call: "POST /exam-registrations/${regB_id}/schedule"
              payload: {"session_id": "${sess_id}", "expected_session_version": "${sess_v2}"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { err_full: "$.data.error_id" }
            - call: "POST /exam-registrations/${regA_id}/cancel-schedule"
              payload: {"cancel_reason": "candidate deferred"}
              as: ExamOperations
              as_user_id: "ops-1"
            - call: "GET /exam-sessions/${sess_id}"
              payload: {}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { sess_v3: "$.data.version" }
            - call: "POST /exam-registrations/${regB_id}/schedule"
              payload: {"session_id": "${sess_id}", "expected_session_version": "${sess_v3}"}
              as: ExamOperations
              as_user_id: "ops-1"
          assert:
            - "after trigger[0] ExamRegistration.${regA_id}.seat_status == SCHEDULED, session_id == \"${sess_id}\" and session_ends_at == \"2026-08-10T04:00:00Z\""
            - "after trigger[0] ExamSession.${sess_id}.seats_reserved == 1 and ExamSession.${sess_id}.status == FULL, and ${sess_v2} == ${sess_v} + 1"
            - "trigger[2] responds 409 with ${err_full} == ERR_SESSION_FULL; ExamRegistration.${regB_id}.seat_status stays UNSCHEDULED and ExamSession.${sess_id}.seats_reserved stays 1"
            - "the refused trigger[2] does not bump the session, so ${sess_v3} == ${sess_v2} + 1 counts only the accepted cancellation"
            - "after trigger[3] ExamSession.${sess_id}.seats_reserved == 0 exactly (never -1) and ExamSession.${sess_id}.status == OPEN"
            - "after trigger[3] ExamRegistration.${regA_id}.seat_status == UNSCHEDULED, session_id == null, session_ends_at == \"2026-08-10T04:00:00Z\" (retained) and attempt_number == 1"
            - "after trigger[3] ExamRegistration.${regA_id}.score_status == NOT_APPLICABLE throughout — the compensation touches only the seat dimension"
            - "after trigger[5] ExamRegistration.${regB_id}.seat_status == SCHEDULED and ExamSession.${sess_id}.seats_reserved == 1 exactly (a missing compensation would read 2 and refuse this call)"
            - "after trigger[5] ExamSession.${sess_id}.status == FULL and ExamSession.${sess_id}.version == ${sess_v3} + 1"


      - name: ceu_credit_ledger_unwinds_on_audit_selection_and_reinstates_on_verification
        grounds:
          - state_machines.CEUActivity.APPROVED_to_AUDIT_SELECTED
          - state_machines.CEUActivity.AUDIT_SELECTED_to_VERIFIED
          - state_machines.RecertificationCycle.SATISFIED_to_OPEN
          - calculations.ceu_credit_accrual
          - calculations.cycle_credit_reconciliation
          - validations[priority=19]
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          Audit selection is an explicit COMPENSATION on an already-counted credit: the same
          activity swings counted true -> false -> true and the cycle swings SATISFIED -> OPEN
          -> SATISFIED with credits_applied 12.00 -> 0.00 -> 12.00, ending byte-identical to its
          pre-audit value with no residue on Certificant.ceu_credits_applied. The reinstating
          call must additionally come from a different officer than the reviewer recorded by the
          selection, so an audit-verify by the selector is refused ERR_SEGREGATION_OF_DUTIES and
          the ledger stays unwound.
        test_recipe:
          setup:
            - "One ACTIVE programme CPX (form_length 1, domain_specs [{D1, 100, min_operational_items 1}], psychometric_stat_basis POOLED, min_panelists 1, panel_trim_count 0, audit_every_nth 7, cycle_length_months 12, required_ceu_credits 12, ceu_credit_accrual_basis STRICT_CYCLE)."
            - "One OPERATIONAL item (pretest batch 40 responses, p_value 0.6000, discrimination_index 0.6000) and one PUBLISHED form whose raw_cut_score computed to 0 (trimmed_mean 0.600000, sem 0.0, raw 1, clamped to ceil_cut floor(0.90*1) = 0)."
            - "One APPROVED application (BACHELOR 2020, 36 months, audit_sequence_number 1, not sampled) and a TEST_CENTER session 2026-08-10T00:00:00Z-04:00:00Z seat_capacity 5."
            - "The candidate checked in at clock 2026-08-10T00:00:00Z, scored raw_score 1 -> scaled_score 800 -> PASS, and the score was reported, minting Certificant CPX-2026-00001 (status ACTIVE, publication_status PUBLISHED, issued_on 2026-08-10, valid_through 2027-08-10) with RecertificationCycle 1 OPEN, starts_on 2026-08-10, ends_on 2027-08-10, grace_ends_on 2027-11-08, required_credits 12."
            - "One CEUActivity ${act_id} (LIVE_INSTRUCTION, 12 contact hours, multiplier 1.0) dated 2026-09-15 inside the cycle window, reviewed APPROVE by elr-3: status APPROVED, counted true, credits_awarded 12.00, credits_counted 12.00, reviewer_user_id elr-3."
            - "The cycle therefore reads credits_applied 12.00 / required_credits 12 and status SATISFIED, and Certificant.ceu_credits_applied == 12.00."
          setup_api_calls:
            - call: "POST /programs"
              payload: {"name": "Certified Practitioner X", "credential_code": "CPX", "jta_version": "JTA-2026.1", "domain_specs": [{"domain_code": "D1", "weight_pct": 100, "min_operational_items": 1}], "form_length": 1, "accepted_education_credentials": ["BACHELOR"], "psychometric_stat_basis": "POOLED", "min_panelists": 1, "panel_trim_count": 0, "audit_every_nth": 7, "cycle_length_months": 12, "required_ceu_credits": 12, "ceu_credit_accrual_basis": "STRICT_CYCLE"}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /programs/${prog_id}/activate"
              payload: {"activation_note": "CPX live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /items"
              payload: {"program_id": "${prog_id}", "domain_code": "D1", "cognitive_level": "APPLICATION", "stem": "CPX operational item"}
              as: ItemSpecialist
              as_user_id: "isp-author"
              captures: { item_id: "$.data.id" }
            - call: "POST /items/${item_id}/submit-for-review"
              payload: {"revision_note": "first submission"}
              as: ItemSpecialist
              as_user_id: "isp-author"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-1"
            - call: "POST /items/${item_id}/review"
              payload: {"decision": "APPROVE"}
              as: ItemSpecialist
              as_user_id: "isp-rev-2"
            - call: "POST /items/${item_id}/response-batches"
              payload: {"is_pretest": true, "response_count": 40, "correct_count": 24, "upper_n": 10, "upper_correct": 9, "lower_n": 10, "lower_correct": 3}
              as: Psychometrician
              as_user_id: "psy-1"
            - call: "POST /forms"
              payload: {"program_id": "${prog_id}", "form_code": "CPX-F1", "item_ids": ["${item_id}"], "panelist_user_ids": ["pan-1"], "panel_method": "MODIFIED_ANGOFF"}
              as: Psychometrician
              as_user_id: "psy-1"
              captures: { form_id: "$.data.id" }
            - call: "POST /forms/${form_id}/panel-ratings"
              payload: {"panelist_user_id": "pan-1", "mean_expected_pass_rate": 0.6}
              as: Panelist
              as_user_id: "pan-1"
              captures: { form_v: "$.data.version" }
            - call: "POST /forms/${form_id}/adopt-cut-score"
              payload: {"expected_form_version": "${form_v}", "adoption_note": "single-panelist adoption"}
              as: Psychometrician
              as_user_id: "psy-1"
            - call: "POST /forms/${form_id}/publish"
              payload: {"publication_note": "CPX form live"}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /candidates"
              payload: {"email": "cand.a@example.com", "full_name": "Cand A"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { cand_id: "$.data.id" }
            - call: "POST /applications"
              payload: {"candidate_id": "${cand_id}", "program_id": "${prog_id}", "education_credential": "BACHELOR", "education_completion_year": 2020, "experience_months": 36, "attestation_signed": true}
              as: EligibilityReviewer
              as_user_id: "elr-1"
              captures: { app_id: "$.data.id" }
            - call: "POST /applications/${app_id}/verify"
              payload: {"dimension": "EDUCATION", "outcome": "PASS"}
              as: EligibilityReviewer
              as_user_id: "elr-1"
            - call: "POST /applications/${app_id}/verify"
              payload: {"dimension": "EXPERIENCE", "outcome": "PASS"}
              as: EligibilityReviewer
              as_user_id: "elr-2"
            - call: "POST /exam-sessions"
              payload: {"modality": "TEST_CENTER", "starts_at": "2026-08-10T00:00:00Z", "ends_at": "2026-08-10T04:00:00Z", "seat_capacity": 5, "center_code": "C1", "room_code": "R1"}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { sess_id: "$.data.id", sess_v: "$.data.version" }
            - call: "POST /exam-registrations"
              payload: {"application_id": "${app_id}", "form_id": "${form_id}", "fee_paid_cents": 45000}
              as: ExamOperations
              as_user_id: "ops-1"
              captures: { reg_id: "$.data.id" }
            - call: "POST /exam-registrations/${reg_id}/schedule"
              payload: {"session_id": "${sess_id}", "expected_session_version": "${sess_v}"}
              as: ExamOperations
              as_user_id: "ops-1"
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-10T00:00:00Z"}
              as: ExamOperations
              as_user_id: "ops-1"
            - call: "POST /exam-registrations/${reg_id}/check-in"
              payload: {"checkin_note": "seated"}
              as: ExamOperations
              as_user_id: "ops-1"
            - call: "POST /exam-registrations/${reg_id}/submit-responses"
              payload: {"raw_score": 1}
              as: ExamOperations
              as_user_id: "ops-1"
            - call: "POST /exam-registrations/${reg_id}/report-score"
              payload: {"report_note": "release result"}
              as: ExamOperations
              as_user_id: "ops-1"
            - call: "GET /certificants"
              payload: {"candidate_id": "${cand_id}"}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { cert_id: "$.data[0].id", cert_v: "$.data[0].version" }
            - call: "GET /recertification-cycles"
              payload: {"certificant_id": "${cert_id}"}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { cycle_id: "$.data[0].id" }
            - call: "POST /recertification-cycles/${cycle_id}/ceu-activities"
              payload: {"activity_date": "2026-09-15T00:00:00Z", "category": "LIVE_INSTRUCTION", "provider": "State Chapter Seminar", "contact_hours": 12.0}
              as: Certificant
              as_user_id: "${cand_id}"
              captures: { act_id: "$.data.id" }
            - call: "POST /ceu-activities/${act_id}/review"
              payload: {"outcome": "APPROVE", "review_note": "certificate on file"}
              as: EligibilityReviewer
              as_user_id: "elr-3"
          trigger:
            - call: "POST /ceu-activities/${act_id}/review"
              payload: {"outcome": "SELECT_FOR_AUDIT", "review_note": "sampled for documentation audit"}
              as: EligibilityReviewer
              as_user_id: "elr-3"
            - call: "POST /ceu-activities/${act_id}/audit-verify"
              payload: {"outcome": "VERIFY", "review_note": "self-verification attempt"}
              as: EligibilityReviewer
              as_user_id: "elr-3"
              captures: { err_sod: "$.data.error_id" }
            - call: "POST /ceu-activities/${act_id}/audit-verify"
              payload: {"outcome": "VERIFY", "review_note": "attendance roster sighted"}
              as: EligibilityReviewer
              as_user_id: "elr-4"
          assert:
            - "after trigger[0] CEUActivity.${act_id}.status == AUDIT_SELECTED, counted == false, credits_counted == 0.00 and credits_awarded still 12.00"
            - "after trigger[0] CEUActivity.${act_id}.reviewer_user_id == \"elr-3\" and audit_verifier_user_id == null"
            - "after trigger[0] RecertificationCycle.${cycle_id}.credits_applied == 0.00, status == OPEN and Certificant.${cert_id}.ceu_credits_applied == 0.00"
            - "trigger[1] responds 403 with ${err_sod} == ERR_SEGREGATION_OF_DUTIES because the acting user equals reviewer_user_id"
            - "after trigger[1] CEUActivity.${act_id}.status stays AUDIT_SELECTED, audit_verifier_user_id stays null and RecertificationCycle.${cycle_id}.credits_applied stays 0.00"
            - "after trigger[2] CEUActivity.${act_id}.status == VERIFIED, counted == true, credits_counted == 12.00 and audit_verifier_user_id == \"elr-4\""
            - "after trigger[2] RecertificationCycle.${cycle_id}.credits_applied == 12.00 exactly (not 24.00) and status == SATISFIED"
            - "after trigger[2] Certificant.${cert_id}.ceu_credits_applied == 12.00 and Certificant.${cert_id}.status == ACTIVE"
            - "RecertificationCycle.${cycle_id}.carryover_credits_out == 0 (STRICT_CYCLE never carries a surplus and there is no surplus)"
