            - "${e_fk_int} == ERR_INTERSECTION_NOT_FOUND even though the PATH corridor resolved — the priority-25 body FK check names the intersection"
            - "${e_fk_req} == ERR_REQUESTER_NOT_FOUND and ${e_fk_cor} == ERR_CORRIDOR_NOT_FOUND from two bodies that differ in exactly one field"
            - "${e_fk_proj} == ERR_PROJECT_NOT_FOUND — the observation's project FK is resolved before its intersection FK is even considered"
            - "no row was created by any of the fourteen calls: GET /signal-ops/corridors/${c1_id}/members has total_count == 0"

      - name: project_phase_gates_reject_every_out_of_phase_action
        claim_type: error_triggerable
        grounds:
          - errors.ERR_PROJECT_NOT_IN_PLAN_DEVELOPMENT
          - errors.ERR_PROJECT_NOT_IMPLEMENTED
          - errors.ERR_PROJECT_NOT_IN_EVALUATION
          - errors.ERR_PROJECT_NOT_IN_FIELD_TUNING
          - errors.ERR_PROJECT_NOT_IN_DATA_COLLECTION
          - state_machines.RetimingProject
        distinguishing_aspect: "Every phase-gated endpoint names the phase IT requires, not the phase the project is in: from DATA_COLLECTION, coordinate answers ERR_PROJECT_NOT_IN_PLAN_DEVELOPMENT, field-tuning answers ERR_PROJECT_NOT_IMPLEMENTED, the evaluation POST answers ERR_PROJECT_NOT_IN_EVALUATION and an observation answers ERR_PROJECT_NOT_IN_FIELD_TUNING — five distinct codes for one project state. Once the project legitimately advances, the advance itself becomes the out-of-phase call and reports ERR_PROJECT_NOT_IN_DATA_COLLECTION."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor c1 (ARTERIAL) has one READY member, is SELECTED, and project p1 sits in DATA_COLLECTION with its BEFORE study already complete so the priority-60 aggregate gate cannot mask the phase gates."
