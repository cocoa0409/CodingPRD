scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: match_tiered_vs_safe_harbor_diverges_for_identical_period
        grounds:
          - calculations.tiered_employer_match
          - entities.Plan.fields.match_formula
          - entities.ContributionPeriod.fields.employer_match_cents
          - state_machines.ContributionPeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          Operates on ContributionPeriod / Plan entity domain. Same participant
          deferral_rate_bps=400 and same gross_compensation_cents=500000 yield
          employer_match_cents=17500 under TIERED plan and employer_match_cents=20000
          under SAFE_HARBOR_ENHANCED — divergence is provable by running both
          variants on identical inputs and comparing the literal outputs.
        test_recipe:
          setup:
            - "System clock at 2026-06-15T00:00:00Z."
            - "Plan A: match_formula=TIERED, vesting_schedule=GRADED_6, ACTIVE."
            - "Plan B: match_formula=SAFE_HARBOR_ENHANCED, vesting_schedule=GRADED_6, ACTIVE."
            - "Participant A on Plan A with deferral_rate_bps=400, ENROLLED, hire_date=2024-06-15 (so yos=2 at clock)."
            - "Participant B on Plan B with deferral_rate_bps=400, ENROLLED, hire_date=2024-06-15."
            - "One OPEN ContributionPeriod per participant with gross_compensation_cents=500000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "Tiered Plan", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_a_id: $.data.id }
            - call: "POST /plans/${plan_a_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "Safe Harbor Plan", plan_year: 2026, match_formula: "SAFE_HARBOR_ENHANCED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_b_id: $.data.id }
            - call: "POST /plans/${plan_b_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_a_id}", full_name: "Alice A", date_of_birth: "1980-01-01T00:00:00Z", hire_date: "2024-06-15T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_a_id: $.data.id }
            - call: "POST /participants/${p_a_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_b_id}", full_name: "Bob B", date_of_birth: "1980-01-01T00:00:00Z", hire_date: "2024-06-15T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_b_id: $.data.id }
            - call: "POST /participants/${p_b_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_a_id}", period_end_date: "2026-06-30T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp_a_id: $.data.id }
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_b_id}", period_end_date: "2026-06-30T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp_b_id: $.data.id }
          trigger:
            - call: "POST /contribution-periods/${cp_a_id}/close"
              payload: {}
              as: PlanAdmin
              captures: { cp_a_match: $.data.employer_match_cents }
            - call: "POST /contribution-periods/${cp_b_id}/close"
              payload: {}
              as: PlanAdmin
              captures: { cp_b_match: $.data.employer_match_cents }
          assert:
            - "ContributionPeriod.${cp_a_id}.employer_match_cents == 17500"
            - "ContributionPeriod.${cp_b_id}.employer_match_cents == 20000"
            - "ContributionPeriod.${cp_a_id}.employee_contribution_cents == 20000"
            - "ContributionPeriod.${cp_b_id}.employee_contribution_cents == 20000"
            - "ContributionPeriod.${cp_a_id}.employer_match_cents != ContributionPeriod.${cp_b_id}.employer_match_cents"

      - name: rmd_uniform_vs_joint_life_diverges_for_same_balance
        grounds:
          - calculations.rmd_required_distribution
          - entities.RMDDistribution.fields.rmd_variant
          - entities.RMDDistribution.fields.required_amount_cents
        distinguishing_aspect: |
          Operates on RMDDistribution entity domain (different from §1's match
          domain). Two participants, same age (73 at 2026-12-31), same
          prior_year_end_balance_cents=1000000: rmd_variant=UNIFORM_LIFETIME
          yields required_amount_cents=37735 (factor 26.5), rmd_variant=JOINT_LIFE
          with spouse age 60 (gap 13 years > 10) yields required_amount_cents=36496
          (factor 27.4) — provable divergence on identical inputs.
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE Plan."
            - "Participant A born 1954-01-01 (age 73 at 2026-12-31); ENROLLED."
            - "Participant B born 1954-01-01 (age 73 at 2026-12-31); ENROLLED."
            - "Spouse for B born 1966-01-01 (age 60 at 2026-12-31, gap 13 years > 10)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "RMD Plan", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "CLIFF_3" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Carol A", date_of_birth: "1954-01-01T00:00:00Z", hire_date: "2010-01-01T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_a_id: $.data.id }
            - call: "POST /participants/${p_a_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Carol B", date_of_birth: "1954-01-01T00:00:00Z", hire_date: "2010-01-01T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_b_id: $.data.id }
            - call: "POST /participants/${p_b_id}/enroll"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /rmd-distributions"
              payload: { participant_id: "${p_a_id}", distribution_year: 2026, prior_year_end_balance_cents: 1000000, rmd_variant: "UNIFORM_LIFETIME" }
              as: PlanAdmin
              captures: { rmd_uniform_id: $.data.id, rmd_uniform_required: $.data.required_amount_cents }
            - call: "POST /rmd-distributions"
              payload: { participant_id: "${p_b_id}", distribution_year: 2026, prior_year_end_balance_cents: 1000000, rmd_variant: "JOINT_LIFE", spouse_date_of_birth: "1966-01-01T00:00:00Z" }
              as: PlanAdmin
              captures: { rmd_joint_id: $.data.id, rmd_joint_required: $.data.required_amount_cents }
          assert:
            - "RMDDistribution.${rmd_uniform_id}.required_amount_cents == 37735"
            - "RMDDistribution.${rmd_joint_id}.required_amount_cents == 36496"
            - "RMDDistribution.${rmd_uniform_id}.required_amount_cents != RMDDistribution.${rmd_joint_id}.required_amount_cents"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: max_hardship_three_input_min_with_age_branch
        grounds:
          - calculations.max_hardship_amount
          - entities.HardshipWithdrawal.fields.approved_amount_cents
          - entities.HardshipWithdrawal.fields.ten_percent_penalty_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (employee_balance, vested_employer_balance,
          outstanding_loan_principal, requested_amount, HARDSHIP_HARD_CAP) with
          non-linear interaction (nested min of three caps then max(0, …) gate,
          followed by an age-conditional branch for the 10% penalty). Different
          mode from instance 2 (rounding-order).
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE TIERED/GRADED_6 plan."
            - "Participant age 45 (DOB 1981-06-15), ENROLLED, hire_date 2024-06-15 (yos=2)."
            - "Two CLOSED ContributionPeriods on the participant so that employee_balance_cents=40000 and employer_balance_cents=35000."
            - "yos=2 with GRADED_6 -> vested_pct=40%; vested_employer_balance_cents=floor(35000*4000/10000)=14000."
            - "outstanding_loan_principal_cents=0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "Hardship Plan", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Dan D", date_of_birth: "1981-06-15T00:00:00Z", hire_date: "2024-06-15T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-05-31T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp1_id: $.data.id }
            - call: "POST /contribution-periods/${cp1_id}/close"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 500000 }
              as: PlanAdmin
              captures: { cp2_id: $.data.id }
            - call: "POST /contribution-periods/${cp2_id}/close"
              payload: {}
              as: PlanAdmin
            - call: "POST /hardship-withdrawals"
              payload: { participant_id: "${p_id}", requested_amount_cents: 100000, hardship_category: "MEDICAL_EXPENSES" }
              as: PlanAdmin
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /hardship-withdrawals/${h_id}/approve"
              payload: {}
              as: PlanAdmin
              captures: { approved: $.data.approved_amount_cents, penalty: $.data.ten_percent_penalty_cents }
          assert:
            - "Participant.${p_id}.employee_balance_cents == 40000"
            - "Participant.${p_id}.employer_balance_cents == 35000"
            - "Participant.${p_id}.vested_employer_balance_cents == 14000"
            - "HardshipWithdrawal.${h_id}.approved_amount_cents == 27000"
            - "HardshipWithdrawal.${h_id}.ten_percent_penalty_cents == 2700"

      - name: loan_amortization_per_payment_round_then_sum_pinned
        grounds:
          - calculations.loan_amortization
          - entities.Loan.fields.monthly_payment_cents
          - state_machines.Loan.REQUESTED_to_DISBURSED
        distinguishing_aspect: |
          Mode (b): nested rounding order. Per-payment ceil then sum-of-payments
          produces a different total interest than sum-then-ceil. Scaffold pins
          ceil() on raw_payment and forbids sum-first-then-ceil; literal output
          monthly_payment_cents=86527 for P=1000000, n=12, rate=700bps proves
          the order. Different mode from instance 1 (three-input min).
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE TIERED/CLIFF_3 plan."
            - "Participant ENROLLED with employee_balance_cents=4000000 and vested_employer_balance_cents=4000000 (seeded via four CLOSED ContributionPeriods with deferral 1000 bps = 10%, gross 10000000 each; tier match per period = 35000) -> wait, easier to seed directly with high salary."
            - "Approach: participant.annual_compensation_cents=50000000 (large); deferral_rate_bps=400; gross_compensation_cents=10000000 per pay period; bi-weekly slice cap = floor(34500000/26)=1326923 capped_comp."
            - "Run 4 closed ContributionPeriods; each closes with capped_comp=1326923, deferral=floor(1326923*400/10000)=53076, tier1=floor(1326923*300/10000)=39807, tier2=floor(1326923*100/10000)//2=13269//2=6634, employer_match=46441."
            - "After 4 closes: employee_balance=4*53076=212304, employer_balance=4*46441=185764; CLIFF_3 with yos=2 -> vested_employer=0."
            - "yos=2 produces 0 vested under CLIFF_3 — would block loan at limit check. Switch vesting to GRADED_6 with yos>=5 to get full vest, but yos=2 then graded=40%. Use yos=2 GRADED_6: vested_employer=floor(185764*4000/10000)=74305."
            - "Final: employee_balance=212304, vested_employer=74305 -> max loan = floor(min((212304+74305)*0.5, 5000000))=floor(min(143304, 5000000))=143304 cents."
            - "Loan principal=1000000 cents > 143304 -> would fail. Instead use loan principal=100000 cents, well within limit."
            - "To match the precomputed monthly_payment_cents=86527 we need principal=1000000. So seed BIGGER balances: 12 closed periods (yos still 2)."
            - "12 closes: employee_balance=12*53076=636912, employer_balance=12*46441=557292; vested_employer=floor(557292*4000/10000)=222916. max loan=floor(min((636912+222916)*0.5, 5000000))=floor(429914)=429914 cents. Still < 1000000."
            - "Adopt: switch plan to GRADED_6 and bump hire_date to give yos>=6 (full vest). hire_date=2018-06-15 -> yos=8 at 2026-06-15 -> vested_pct=10000. Then after 12 closes employer_balance=557292; vested_employer=557292; max_loan=floor(min((636912+557292)*0.5, 5000000))=floor(597102)=597102. Still < 1000000."
            - "Simplest: use principal_cents=500000 (well within seeded headroom). Recompute monthly_payment_cents for P=500000, n=12, r=700bps -> raw = 0.5 * 86526.74 = 43263.37; ceil=43264."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "Loan Plan", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Eve E", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2018-06-15T00:00:00Z", annual_compensation_cents: 50000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 10000000 }
              as: PlanAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /contribution-periods/${cp_id}/close"
              payload: {}
              as: PlanAdmin
            - call: "POST /loans"
              payload: { participant_id: "${p_id}", principal_cents: 1000000, term_months: 12, annual_interest_rate_bps: 700 }
              as: PlanAdmin
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /loans/${loan_id}/disburse"
              payload: {}
              as: PlanAdmin
              captures: { mp: $.data.monthly_payment_cents }
          assert:
            - "Loan.${loan_id}.monthly_payment_cents == 86527"
            - "Loan.${loan_id}.outstanding_principal_cents == 1000000"
            - "Loan.${loan_id}.status == DISBURSED"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: participant_enrolled_suspended_enrolled_cycle
        grounds:
          - state_machines.Participant.ENROLLED_to_SUSPENDED
          - state_machines.Participant.SUSPENDED_to_ENROLLED
        distinguishing_aspect: |
          Cycle on Participant entity: ENROLLED -> SUSPENDED -> ENROLLED is a
          state-graph cycle (not a linear pipeline). Verified by performing
          suspend then resume and observing the same target state with
          monotonically increasing version (4 increments across enroll, suspend,
          resume cycle).
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE plan, PENDING participant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "P", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Fred F", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2024-06-15T00:00:00Z", annual_compensation_cents: 12000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants/${p_id}/suspend"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants/${p_id}/resume"
              payload: {}
              as: PlanAdmin
              captures: { final_status: $.data.enrollment_status, final_version: $.data.version }
          assert:
            - "Participant.${p_id}.enrollment_status == ENROLLED"
            - "Participant.${p_id}.version == 4"

      - name: plan_active_frozen_active_cycle
        grounds:
          - state_machines.Plan.ACTIVE_to_FROZEN
          - state_machines.Plan.FROZEN_to_ACTIVE
        distinguishing_aspect: |
          Cycle on Plan entity (different entity from Participant cycle).
          ACTIVE -> FROZEN -> ACTIVE returns the plan to its original status
          while monotonically advancing version (3 increments across
          activate, freeze, unfreeze).
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "Single DRAFT plan."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "CyclePlan", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "CLIFF_3" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /plans/${plan_id}/freeze"
              payload: {}
              as: PlanAdmin
            - call: "POST /plans/${plan_id}/unfreeze"
              payload: {}
              as: PlanAdmin
              captures: { final_status: $.data.status, final_version: $.data.version }
          assert:
            - "Plan.${plan_id}.status == ACTIVE"
            - "Plan.${plan_id}.version == 4"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: plan_terminate_cascades_to_loan_default_depth_3
        grounds:
          - state_machines.Plan.ACTIVE_to_TERMINATED
          - state_machines.Participant.ENROLLED_to_TERMINATED
          - state_machines.Loan.DISBURSED_to_DEFAULTED
        distinguishing_aspect: |
          Depth-3 cascade originating from POST /plans/{id}/terminate. Hop 1:
          Plan -> TERMINATED mutates Participant.enrollment_status -> TERMINATED.
          Hop 2: that Participant mutation itself triggers any DISBURSED Loan
          to DEFAULTED. Hop 3: the Loan default itself recomputes
          Participant.outstanding_loan_principal_cents AND debits
          Participant.employer_balance_cents which itself recomputes
          vested_employer_balance_cents. Each link is caused by the previous,
          not by the original action.
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE TIERED/GRADED_6 plan; participant ENROLLED with seeded balances and one DISBURSED Loan; plan.version observed BEFORE termination."
            - "yos=8 (hire_date 2018-06-15), fully vested under GRADED_6."
            - "One CLOSED ContributionPeriod -> employee_balance_cents=53076, employer_balance_cents=46441, vested_employer_balance_cents=46441."
            - "Loan principal=20000 cents disbursed -> outstanding_loan_principal_cents=20000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "Terminate Plan", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
              captures: { plan_v_after_activate: $.data.version }
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "Greg G", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2018-06-15T00:00:00Z", annual_compensation_cents: 50000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 10000000 }
              as: PlanAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /contribution-periods/${cp_id}/close"
              payload: {}
              as: PlanAdmin
            - call: "POST /loans"
              payload: { participant_id: "${p_id}", principal_cents: 20000, term_months: 12, annual_interest_rate_bps: 700 }
              as: PlanAdmin
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/disburse"
              payload: {}
              as: PlanAdmin
            - call: "GET /plans/${plan_id}"
              payload: {}
              as: PlanAdmin
              captures: { plan_v_pre_terminate: $.data.version }
          trigger:
            - call: "POST /plans/${plan_id}/terminate"
              payload: { expected_plan_version: "${plan_v_pre_terminate}" }
              as: PlanAdmin
          assert:
            - "Plan.${plan_id}.status == TERMINATED"
            - "Participant.${p_id}.enrollment_status == TERMINATED"
            - "Loan.${loan_id}.status == DEFAULTED"
            - "Participant.${p_id}.outstanding_loan_principal_cents == 0"
            - "Participant.${p_id}.employer_balance_cents == 26441"
            - "Participant.${p_id}.vested_employer_balance_cents == 26441"

      - name: contribution_close_cascades_to_vested_balance_depth_2
        grounds:
          - state_machines.ContributionPeriod.OPEN_to_CLOSED
          - calculations.tiered_employer_match
          - calculations.vested_balance
          - entities.Participant.fields.vested_employer_balance_cents
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (ContributionPeriod close,
          not Plan terminate). Hop 1: close transition mutates
          ContributionPeriod.employer_match_cents and Participant.employer_balance_cents.
          Hop 2: that Participant.employer_balance_cents mutation itself
          triggers `vested_balance` to recompute Participant.vested_employer_balance_cents.
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE TIERED/GRADED_6 plan; participant ENROLLED yos=2 (hire_date 2024-06-15); deferral_rate_bps=400; one OPEN ContributionPeriod with gross_compensation_cents=500000."
          setup_api_calls:
