# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0497
# 9 Difficulty Rules × ≥2 instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.7.
# Numeric asserts are pre-computed literals (formulas executed in code).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: load_sizing_staggered_vs_full_load_diverges
        grounds:
          - calculations.run_load_sizing
          - entities.LoadAssessment.fields.computed_required_kw
          - entities.LoadAssessment.fields.method
        distinguishing_aspect: "Same appliance array yields required_kw 25.0 under STAGGERED (largest single surge) vs 31.0 under FULL_LOAD (all surges sum); divergence lives on the LoadAssessment/GeneratorProject domain."
        test_recipe:
          setup:
            - "A customer and a DRAFT project with fuel_type NG exist."
            - "Two LoadAssessments on the project with the identical appliance set, one method=STAGGERED and one method=FULL_LOAD."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ds1@x.com", full_name: "DS One", service_address: "1 A St" }
              as: ServiceManager
              captures: { cust1: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust1}", fuel_type: "NG" }
              as: ServiceManager
              captures: { proj1: $.data.id }
          trigger:
            - call: "POST /projects/${proj1}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac_5ton", running_watts: 5000, starting_watts: 16000}, {name: "well_pump", running_watts: 1000, starting_watts: 3000}, {name: "fridge", running_watts: 700, starting_watts: 2200}, {name: "sump", running_watts: 800, starting_watts: 2000}, {name: "lights", running_watts: 1500, starting_watts: 1500} ] }
              as: ServiceManager
              captures: { asmt_stag: $.data.computed_required_kw }
            - call: "POST /projects/${proj1}/load-assessments"
              payload: { method: "FULL_LOAD", appliances: [ {name: "ac_5ton", running_watts: 5000, starting_watts: 16000}, {name: "well_pump", running_watts: 1000, starting_watts: 3000}, {name: "fridge", running_watts: 700, starting_watts: 2200}, {name: "sump", running_watts: 800, starting_watts: 2000}, {name: "lights", running_watts: 1500, starting_watts: 1500} ] }
              as: ServiceManager
              captures: { asmt_full: $.data.computed_required_kw }
          assert:
            - "First load-assessment response data.computed_required_kw == 25.0"
            - "First load-assessment response data.peak_demand_w == 20000"
            - "Second load-assessment response data.computed_required_kw == 31.0"
            - "Second load-assessment response data.peak_demand_w == 24700"

      - name: warranty_refund_calendar_vs_usage_diverges
        grounds:
          - calculations.run_warranty_refund
          - entities.WarrantyClaim.fields.refund_basis
          - entities.WarrantyClaim.fields.refund_cents
          - entities.Unit.fields.runtime_hours
        distinguishing_aspect: "For the same unit (warranty_start 2026-01-01, total 60 mo, runtime 500h) a PRORATED_REFUND adjudication yields refund_cents 216000 under CALENDAR (6 mo elapsed) vs 200000 under USAGE (10 mo elapsed); this is the Unit/WarrantyClaim domain, distinct from sizing."
        test_recipe:
          setup:
            - "An ACTIVATED unit (warranty_start=2026-01-01, model.warranty_months=60, unchanged) with runtime_hours=500 accumulated via one resolved PAID repair dispatch."
            - "Clock advanced to 2026-07-01 (6 calendar months after activation)."
            - "A warranty claim moved to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "wr1@x.com", full_name: "WR One", service_address: "2 B St" }
              as: ServiceManager
              captures: { cust: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech G", license_no: "LICWR1", gas_certified: true }
              as: ServiceManager
              captures: { tech: $.data.id }
            - call: "POST /models"
              payload: { sku: "WRSKU1", rated_kw: 26, fuel_types: ["NG"], unit_price_cents: 900000, warranty_months: 60 }
              as: ServiceManager
              captures: { model: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", fuel_type: "NG" }
              as: ServiceManager
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 4000, starting_watts: 12000} ] }
              as: ServiceManager
              captures: { asmt: $.data.id }
            - call: "POST /projects/${proj}/size"
              payload: { assessment_id: "${asmt}", model_id: "${model}" }
              as: ServiceManager
            - call: "POST /projects/${proj}/permit"
              payload: { permit_number: "PWR1", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000, existing_load_btu_per_hr: 0 }
              as: ServiceManager
            - call: "POST /projects/${proj}/install"
              payload: { install_tech_id: "${tech}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${proj}/activate"
              payload: { serial_no: "SNWR1" }
              as: ServiceManager
              captures: { unit: $.data.unit_id }
            - call: "POST /units/${unit}/repair-dispatches"
              payload: { labor_cents: 0, parts_cents: 0 }
              as: ServiceManager
              captures: { disp: $.data.id, disp_v0: $.data.version }
            - call: "POST /repair-dispatches/${disp}/assign"
              payload: { assigned_tech_id: "${tech}", expected_dispatch_version: "${disp_v0}" }
              as: ServiceManager
            - call: "POST /repair-dispatches/${disp}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /repair-dispatches/${disp}/resolve"
              payload: { runtime_added_hours: 500 }
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ServiceManager
            - call: "GET /units/${unit}"
              payload: {}
              as: ServiceManager
              captures: { u_v: $.data.version }
            - call: "POST /units/${unit}/warranty-claims"
              payload: { description: "control board fault", expected_unit_version: "${u_v}" }
              as: ServiceManager
              captures: { claim: $.data.id }
            - call: "POST /warranty-claims/${claim}/review"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /warranty-claims/${claim}/adjudicate"
              payload: { decision: "APPROVE", resolution: "PRORATED_REFUND", refund_basis: "USAGE" }
              as: ComplianceOfficer
              captures: { refund: $.data.refund_cents }
          assert:
            - "WarrantyClaim.${claim}.refund_cents == 200000 (USAGE: elapsed=max(6,10)=10, remaining 50/60 of 240000)"
            - "The CALENDAR counterpart for the same dates would be 216000 (54/60 of 240000); USAGE strictly less because runtime ages the unit faster"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: plan_price_tiered_with_bundle_discount_mode_a
        grounds:
          - calculations.run_plan_price
          - entities.MaintenancePlan.fields.annual_price_cents
          - entities.MaintenancePlan.fields.frequency
          - entities.MaintenancePlan.fields.monitoring_bundled
        distinguishing_aspect: "Mode (a): annual_price_cents = round_half_up( (tiered visit_price by rated_kw) * visits_per_year + monitoring_addon ) * (1-0.10) only when SEMI_ANNUAL AND monitoring_bundled — three inputs (kw tier, frequency, monitoring) interact non-linearly; for a 26kW SEMI_ANNUAL bundled plan = 66600."
        test_recipe:
          setup:
            - "An ACTIVATED unit with rated_kw 26 (tier >24 -> visit_price 34000)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "pp1@x.com", full_name: "PP One", service_address: "3 C St" }
              as: ServiceManager
              captures: { cust: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech P", license_no: "LICPP1", gas_certified: true }
              as: ServiceManager
              captures: { tech: $.data.id }
            - call: "POST /models"
              payload: { sku: "PPSKU1", rated_kw: 26, fuel_types: ["NG"], unit_price_cents: 900000, warranty_months: 60 }
              as: ServiceManager
              captures: { model: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", fuel_type: "NG" }
              as: ServiceManager
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 4000, starting_watts: 12000} ] }
              as: ServiceManager
              captures: { asmt: $.data.id }
            - call: "POST /projects/${proj}/size"
              payload: { assessment_id: "${asmt}", model_id: "${model}" }
              as: ServiceManager
            - call: "POST /projects/${proj}/permit"
              payload: { permit_number: "PPP1", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${proj}/install"
              payload: { install_tech_id: "${tech}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${proj}/activate"
              payload: { serial_no: "SNPP1" }
              as: ServiceManager
              captures: { unit: $.data.unit_id }
          trigger:
            - call: "POST /units/${unit}/maintenance-plans"
              payload: { frequency: "SEMI_ANNUAL", monitoring_bundled: true }
              as: ServiceManager
              captures: { plan: $.data.id }
          assert:
            - "MaintenancePlan.${plan}.visits_per_year == 2"
            - "MaintenancePlan.${plan}.annual_price_cents == 66600 (34000*2 + 6000 = 74000, *0.90 = 66600)"

      - name: repair_invoice_rounding_order_mode_b
        grounds:
          - calculations.run_repair_invoice
          - entities.RepairDispatch.fields.invoice_total_cents
          - entities.RepairDispatch.fields.labor_cents
          - entities.RepairDispatch.fields.parts_cents
        distinguishing_aspect: "Mode (b): rounding ORDER is pinned per-line-then-sum. With labor_cents=200, parts_cents=200 at TAX_RATE 8.75%, invoice_total_cents = round_half_up(200*1.0875)=218 + round_half_up(200*1.0875)=218 = 436, which differs from the sum-then-round result round_half_up(400*1.0875)=435 — the pinned order is observable at the cent."
        test_recipe:
          setup:
            - "An ACTIVATED unit; a PAID (billable) repair dispatch with labor_cents=200 and parts_cents=200, taken through assign/start to resolve."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ri1@x.com", full_name: "RI One", service_address: "4 D St" }
              as: ServiceManager
              captures: { cust: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech R", license_no: "LICRI1", gas_certified: true }
              as: ServiceManager
              captures: { tech: $.data.id }
            - call: "POST /models"
              payload: { sku: "RISKU1", rated_kw: 22, fuel_types: ["NG"], unit_price_cents: 800000, warranty_months: 60 }
              as: ServiceManager
              captures: { model: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", fuel_type: "NG" }
              as: ServiceManager
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 4000, starting_watts: 11000} ] }
              as: ServiceManager
              captures: { asmt: $.data.id }
            - call: "POST /projects/${proj}/size"
              payload: { assessment_id: "${asmt}", model_id: "${model}" }
              as: ServiceManager
            - call: "POST /projects/${proj}/permit"
              payload: { permit_number: "PRI1", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${proj}/install"
              payload: { install_tech_id: "${tech}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${proj}/activate"
              payload: { serial_no: "SNRI1" }
              as: ServiceManager
              captures: { unit: $.data.unit_id }
            - call: "POST /units/${unit}/repair-dispatches"
              payload: { labor_cents: 200, parts_cents: 200 }
              as: ServiceManager
              captures: { disp: $.data.id, disp_v0: $.data.version }
            - call: "POST /repair-dispatches/${disp}/assign"
              payload: { assigned_tech_id: "${tech}", expected_dispatch_version: "${disp_v0}" }
              as: ServiceManager
            - call: "POST /repair-dispatches/${disp}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
          trigger:
            - call: "POST /repair-dispatches/${disp}/resolve"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
              captures: { inv: $.data.invoice_total_cents }
          assert:
            - "RepairDispatch.${disp}.billable == true"
            - "RepairDispatch.${disp}.invoice_total_cents == 436 (per-line-then-sum: 218 + 218); the sum-then-round value 435 would be wrong"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: warranty_claim_review_loop_cycle
        grounds:
          - state_machines.WarrantyClaim.OPEN_to_UNDER_REVIEW
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_OPEN
        distinguishing_aspect: "WarrantyClaim cycles OPEN->UNDER_REVIEW->OPEN->UNDER_REVIEW via review/return-for-info before any terminal adjudication; a linear pipeline could not return to OPEN. Cycle lives on the WarrantyClaim entity."
        test_recipe:
          setup:
            - "An ACTIVATED unit with warranty_status ACTIVE and an OPEN warranty claim."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "wc1@x.com", full_name: "WC One", service_address: "5 E St" }
              as: ServiceManager
              captures: { cust: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech W", license_no: "LICWC1", gas_certified: true }
              as: ServiceManager
              captures: { tech: $.data.id }
            - call: "POST /models"
              payload: { sku: "WCSKU1", rated_kw: 20, fuel_types: ["NG"], unit_price_cents: 700000, warranty_months: 60 }
              as: ServiceManager
              captures: { model: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", fuel_type: "NG" }
              as: ServiceManager
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 3000, starting_watts: 9000} ] }
              as: ServiceManager
              captures: { asmt: $.data.id }
            - call: "POST /projects/${proj}/size"
              payload: { assessment_id: "${asmt}", model_id: "${model}" }
              as: ServiceManager
            - call: "POST /projects/${proj}/permit"
              payload: { permit_number: "PWC1", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${proj}/install"
              payload: { install_tech_id: "${tech}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${proj}/activate"
              payload: { serial_no: "SNWC1" }
              as: ServiceManager
              captures: { unit: $.data.unit_id }
            - call: "GET /units/${unit}"
              payload: {}
              as: ServiceManager
              captures: { u_v: $.data.version }
            - call: "POST /units/${unit}/warranty-claims"
              payload: { description: "intermittent fault", expected_unit_version: "${u_v}" }
              as: ServiceManager
              captures: { claim: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim}/review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /warranty-claims/${claim}/return-for-info"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /warranty-claims/${claim}/review"
              payload: {}
              as: ComplianceOfficer
              captures: { st: $.data.status }
          assert:
            - "After review->return-for-info->review, WarrantyClaim.${claim}.status == UNDER_REVIEW"
            - "WarrantyClaim.${claim}.version == 4 (create=1, +3 transitions)"

      - name: repair_dispatch_progress_pause_cycle
        grounds:
          - state_machines.RepairDispatch.DISPATCHED_to_IN_PROGRESS
          - state_machines.RepairDispatch.IN_PROGRESS_to_DISPATCHED
        distinguishing_aspect: "RepairDispatch oscillates DISPATCHED->IN_PROGRESS->DISPATCHED via start/pause across field visits before resolving; cycle is on the RepairDispatch entity, a different entity than WarrantyClaim."
        test_recipe:
          setup:
            - "An ACTIVATED unit with a PAID dispatch assigned to a tech (status DISPATCHED)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rd1@x.com", full_name: "RD One", service_address: "6 F St" }
              as: ServiceManager
              captures: { cust: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech D", license_no: "LICRD1", gas_certified: true }
              as: ServiceManager
              captures: { tech: $.data.id }
            - call: "POST /models"
              payload: { sku: "RDSKU1", rated_kw: 20, fuel_types: ["NG"], unit_price_cents: 700000, warranty_months: 60 }
              as: ServiceManager
              captures: { model: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", fuel_type: "NG" }
              as: ServiceManager
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 3000, starting_watts: 9000} ] }
              as: ServiceManager
              captures: { asmt: $.data.id }
            - call: "POST /projects/${proj}/size"
              payload: { assessment_id: "${asmt}", model_id: "${model}" }
              as: ServiceManager
            - call: "POST /projects/${proj}/permit"
              payload: { permit_number: "PRD1", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${proj}/install"
              payload: { install_tech_id: "${tech}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${proj}/activate"
              payload: { serial_no: "SNRD1" }
              as: ServiceManager
              captures: { unit: $.data.unit_id }
            - call: "POST /units/${unit}/repair-dispatches"
              payload: { labor_cents: 5000, parts_cents: 0 }
              as: ServiceManager
              captures: { disp: $.data.id, disp_v0: $.data.version }
            - call: "POST /repair-dispatches/${disp}/assign"
              payload: { assigned_tech_id: "${tech}", expected_dispatch_version: "${disp_v0}" }
              as: ServiceManager
          trigger:
            - call: "POST /repair-dispatches/${disp}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /repair-dispatches/${disp}/pause"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /repair-dispatches/${disp}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
              captures: { st: $.data.status }
          assert:
            - "After start->pause->start, RepairDispatch.${disp}.status == IN_PROGRESS"
            - "Technician.${tech}.open_dispatch_count == 1 (count unchanged across the start/pause cycle)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recall_resolve_cascade_depth4_restores_warranty
        grounds:
          - state_machines.RepairDispatch.IN_PROGRESS_to_RESOLVED
          - state_machines.RecallRemediation.SCHEDULED_to_COMPLETED
          - state_machines.Unit.NON_COMPLIANT_to_OPERATIONAL
          - entities.Unit.fields.warranty_status
        distinguishing_aspect: "Trigger = resolve on a RECALL dispatch. Hop1: dispatch IN_PROGRESS->RESOLVED. Hop2 (caused by hop1): linked RecallRemediation SCHEDULED->COMPLETED. Hop3 (caused by hop2): recompute_unit_posture flips Unit NON_COMPLIANT->OPERATIONAL. Hop4 (caused by hop3): warranty_status restored VOID->ACTIVE. Depth >= 3."
        test_recipe:
          setup:
            - "A unit affected by a MANDATORY recall whose remediation went OVERDUE (unit NON_COMPLIANT, warranty VOID), then SCHEDULED (spawning a RECALL dispatch) which was assigned and started."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rc1@x.com", full_name: "RC One", service_address: "7 G St" }
              as: ServiceManager
              captures: { cust: $.data.id }
            - call: "POST /technicians"
              payload: { name: "Tech C", license_no: "LICRC1", gas_certified: true }
              as: ServiceManager
              captures: { tech: $.data.id }
            - call: "POST /models"
              payload: { sku: "RCSKU1", rated_kw: 22, fuel_types: ["NG"], unit_price_cents: 800000, warranty_months: 60 }
              as: ServiceManager
              captures: { model: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", fuel_type: "NG" }
              as: ServiceManager
              captures: { proj: $.data.id }
            - call: "POST /projects/${proj}/load-assessments"
              payload: { method: "STAGGERED", appliances: [ {name: "ac", running_watts: 4000, starting_watts: 11000} ] }
              as: ServiceManager
              captures: { asmt: $.data.id }
            - call: "POST /projects/${proj}/size"
              payload: { assessment_id: "${asmt}", model_id: "${model}" }
              as: ServiceManager
            - call: "POST /projects/${proj}/permit"
              payload: { permit_number: "PRC1", permit_decision: "APPROVE", fuel_supply_btu_per_hr: 400000 }
              as: ServiceManager
            - call: "POST /projects/${proj}/install"
              payload: { install_tech_id: "${tech}", ats_amps: 200 }
              as: ServiceManager
            - call: "POST /projects/${proj}/activate"
              payload: { serial_no: "SNRC1" }
              as: ServiceManager
              captures: { unit: $.data.unit_id }
            - call: "POST /recall-campaigns"
              payload: { model_id: "${model}", code: "RC-2026-01", severity: "MANDATORY", remediation_window_days: 30 }
              as: ComplianceOfficer
              captures: { camp: $.data.id }
            - call: "POST /recall-campaigns/${camp}/open"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /recall-remediations"
              payload: { unit_id: "${unit}" }
              as: ServiceManager
              captures: { rem: "$.data[0].id" }
            - call: "POST /recall-remediations/${rem}/schedule"
              payload: {}
              as: ServiceManager
              captures: { rdisp: $.data.dispatch_id }
            - call: "GET /repair-dispatches/${rdisp}"
              payload: {}
              as: ServiceManager
              captures: { rdisp_v0: $.data.version }
            - call: "POST /repair-dispatches/${rdisp}/assign"
              payload: { assigned_tech_id: "${tech}", expected_dispatch_version: "${rdisp_v0}" }
              as: ServiceManager
            - call: "POST /repair-dispatches/${rdisp}/start"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ServiceManager
          trigger:
            - call: "POST /repair-dispatches/${rdisp}/resolve"
              payload: {}
              as: Technician
              as_user_id: "${tech}"
          assert:
            - "RecallRemediation.${rem}.status == COMPLETED"
            - "Unit.${unit}.operating_status == OPERATIONAL"
            - "Unit.${unit}.warranty_status == ACTIVE"

      - name: decommission_cascade_depth2_cancels_plan_and_visits
        grounds:
          - state_machines.Unit.OPERATIONAL_to_DECOMMISSIONED
          - state_machines.MaintenancePlan.ACTIVE_to_CANCELLED
          - state_machines.MaintenanceVisit.SCHEDULED_to_CANCELLED
