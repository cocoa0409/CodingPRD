# =============================================================================
# 1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Air Freight Forwarding & Consolidation
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: shipper_creation_defaults_and_system_fields
        claim_type: creation_defaults
        grounds: ["entities.Shipper.fields.known_shipper_status", "entities.Shipper.fields.screening_rejection_count"]
        distinguishing_aspect: "A freshly created shipper starts UNVERIFIED with demerit counter 0, version 1, and server-minted id/created_at."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id", st: "$.data.known_shipper_status", cnt: "$.data.screening_rejection_count", v: "$.data.version" } }
          assert:
            - "${st} == UNVERIFIED and ${cnt} == 0 and ${v} == 1"
            - "${sh1} is a server-minted UUID; response includes created_at and updated_at"

      - name: house_waybill_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.HouseWaybill.fields.pieces", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required field pieces (no default) fails creation with ERR_INVALID_REQUEST; nothing is persisted."
        test_recipe:
          setup: ["Shipper ACME exists"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
          trigger:
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-NOPIECES", origin_code: "SFO", destination_code: "NRT", gross_weight_kg: 10.0, declared_volume_m3: 0.05 }, as: ForwarderOps, captures: { err: "$.data.error_id" } }
          assert:
            - "captured ${err} == ERR_INVALID_REQUEST (HTTP 400)"
            - "GET /air-freight/house-waybills?shipper_id=${sh1} returns total_count == 0"

      - name: computed_charge_fields_input_ignored
        claim_type: computed_fields
        grounds: ["entities.HouseWaybill.fields.chargeable_weight_kg", "entities.HouseWaybill.fields.total_charge_amount"]
        distinguishing_aspect: "Client-supplied values for computed fields (chargeable_weight_kg, total_charge_amount) are ignored at creation: the response shows the server-computed 0 values."
        test_recipe:
          setup: ["Shipper ACME exists"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
          trigger:
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-COMP", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05, chargeable_weight_kg: 999.9, total_charge_amount: 1.00 }, as: ForwarderOps, captures: { cw: "$.data.chargeable_weight_kg", tot: "$.data.total_charge_amount" } }
          assert:
            - "captured ${cw} == 0 and ${tot} == 0 — client input for computed fields discarded"

      - name: get_nonexistent_house_waybill_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_HOUSE_WAYBILL_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown house waybill UUID returns 404 ERR_HOUSE_WAYBILL_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /air-freight/house-waybills/00000000-0000-4000-8000-0000000000aa", as: ForwarderOps, captures: { err: "$.data.error_id" } }
          assert:
            - "captured ${err} == ERR_HOUSE_WAYBILL_NOT_FOUND (HTTP 404)"

      - name: master_waybill_with_unknown_booking_returns_not_found
        claim_type: fk_integrity
        grounds: ["entities.MasterWaybill.fields.booking_id", "errors[ERR_FLIGHT_BOOKING_NOT_FOUND]"]
        distinguishing_aspect: "Creating a master waybill against a non-existent booking id is rejected with ERR_FLIGHT_BOOKING_NOT_FOUND (body-reference existence)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "00000000-0000-4000-8000-0000000000bb", mawb_number: "180-00000001" }, as: CapacityPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "captured ${err} == ERR_FLIGHT_BOOKING_NOT_FOUND (HTTP 404); no master waybill persisted"

      - name: house_waybill_list_pagination_and_filters
        claim_type: listing
        grounds: ["response_envelope.pagination_fields", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "Filtered list paginates: limit=2 of 3 rows returns total_count 3 with has_more true; offset=2 returns the last row with has_more false."
        test_recipe:
          setup: ["Shipper ACME with three DRAFT house waybills HWB-P1, HWB-P2, HWB-P3"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-P1", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05 }, as: ForwarderOps }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-P2", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05 }, as: ForwarderOps }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-P3", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05 }, as: ForwarderOps }
          trigger:
            - { call: "GET /air-freight/house-waybills", payload: { shipper_id: "${sh1}", limit: 2, offset: 0 }, as: ForwarderOps }
            - { call: "GET /air-freight/house-waybills", payload: { shipper_id: "${sh1}", limit: 2, offset: 2 }, as: ForwarderOps }
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2 (offset 2): 1 row, total_count == 3, has_more == false"
            - "a filter for another shipper_id returns total_count == 0 (filter correctness)"

      - name: milestone_event_immutable_no_common_version_fields
        claim_type: immutability
        grounds: ["entities.MilestoneEvent"]
        distinguishing_aspect: "MilestoneEvent declares common_fields: false — its representation carries id and created_at but no version or updated_at members."
        test_recipe:
          setup:
            - "Base SFO->NRT fixture; HWB-A consolidated and measured; MAWB tendered (window 2026-08-09T12:00-13:00)"
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/rate-agreements", payload: { shipper_id: "${sh1}", origin_code: "SFO", destination_code: "NRT", weight_breaks: [ { min_weight_kg: 0, rate_per_kg: 5.00 } ], min_charge_amount: 250.00, fuel_surcharge_pct: 0.125, security_fee_amount: 25.00, spot_surcharge_pct: 0, valid_from_utc: "2026-01-01T00:00:00Z", valid_to_utc: "2027-01-01T00:00:00Z" }, as: PricingManager }
            - { call: "POST /air-freight/flight-bookings", payload: { airline_code: "UA", flight_number: "UA838", origin_code: "SFO", destination_code: "NRT", scheduled_departure_utc: "2026-08-10T10:00:00Z", cutoff_utc: "2026-08-09T10:00:00Z", booked_weight_kg: 500.0, booked_volume_m3: 50.0 }, as: CapacityPlanner, captures: { bk1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-12345675" }, as: CapacityPlanner, captures: { mb1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-A", origin_code: "SFO", destination_code: "NRT", pieces: 5, gross_weight_kg: 80.0, declared_volume_m3: 0.60, dg_flag: false }, as: ForwarderOps, captures: { hwa: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hwa}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hwa}/screening-records", as: ForwarderOps, captures: { sra: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${sra}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv1: "$.data.version" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hwa}", expected_master_waybill_version: "${mv1}" }, as: ForwarderOps }
            - { call: "POST /air-freight/house-waybills/${hwa}/measure", payload: { measured_volume_m3: 0.60 }, as: ForwarderOps }
            - { call: "POST /air-freight/master-waybills/${mb1}/tender", payload: { tender_window_start_utc: "2026-08-09T12:00:00Z", tender_window_end_utc: "2026-08-09T13:00:00Z" }, as: CapacityPlanner }
          trigger:
            - { call: "POST /air-freight/master-waybills/${mb1}/milestone-events", payload: { event_code: "DEPARTED", event_time_utc: "2026-08-10T10:00:00Z" }, as: ForwarderOps, captures: { ev1: "$.data.id" } }
          assert:
            - "milestone response data contains id and created_at but neither version nor updated_at (append-only event log)"
            - "GET /air-freight/master-waybills/${mb1}/milestone-events returns the event with out_of_order == false"

  - section: state_machines
    instances:
      - name: house_waybill_initial_state_draft
        claim_type: initial_state
        grounds: ["state_machines.HouseWaybill"]
        distinguishing_aspect: "A new house waybill starts DRAFT with weight_basis UNRATED, mawb_id null, and zeroed charge fields before any submit."
        test_recipe:
          setup: ["Shipper ACME exists"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
          trigger:
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-INIT", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05 }, as: ForwarderOps, captures: { st: "$.data.status", basis: "$.data.weight_basis", mb: "$.data.mawb_id" } }
          assert:
            - "captured ${st} == DRAFT, ${basis} == UNRATED, ${mb} == null; effective_volume_m3 == 0.05"

      - name: cancel_already_cancelled_hwb_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.HouseWaybill.DRAFT_to_CANCELLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Terminal lockdown: a second cancel on a CANCELLED waybill is rejected with ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["Shipper ACME; HWB-X1 DRAFT"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-X1", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05 }, as: ForwarderOps, captures: { hw1: "$.data.id" } }
          trigger:
            - { call: "POST /air-freight/house-waybills/${hw1}/cancel", as: ForwarderOps, captures: { st1: "$.data.status" } }
            - { call: "POST /air-freight/house-waybills/${hw1}/cancel", as: ForwarderOps, captures: { err: "$.data.error_id" } }
          assert:
            - "first cancel: ${st1} == CANCELLED"
            - "second cancel: captured ${err} == ERR_INVALID_STATE (HTTP 409); waybill remains CANCELLED with version incremented only once"

      - name: milestone_on_closed_mawb_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.MasterWaybill.DELIVERED_to_CLOSED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal for milestone intake: recording any event against a closed master waybill fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Base SFO->NRT fixture; HWB-A consolidated, measured 0.60, tendered; DEPARTED/ARRIVED/DELIVERED milestones recorded; MAWB closed (no claims)"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/rate-agreements", payload: { shipper_id: "${sh1}", origin_code: "SFO", destination_code: "NRT", weight_breaks: [ { min_weight_kg: 0, rate_per_kg: 5.00 } ], min_charge_amount: 250.00, fuel_surcharge_pct: 0.125, security_fee_amount: 25.00, spot_surcharge_pct: 0, valid_from_utc: "2026-01-01T00:00:00Z", valid_to_utc: "2027-01-01T00:00:00Z" }, as: PricingManager }
            - { call: "POST /air-freight/flight-bookings", payload: { airline_code: "UA", flight_number: "UA838", origin_code: "SFO", destination_code: "NRT", scheduled_departure_utc: "2026-08-10T10:00:00Z", cutoff_utc: "2026-08-09T10:00:00Z", booked_weight_kg: 500.0, booked_volume_m3: 50.0 }, as: CapacityPlanner, captures: { bk1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-12345675" }, as: CapacityPlanner, captures: { mb1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-A", origin_code: "SFO", destination_code: "NRT", pieces: 5, gross_weight_kg: 80.0, declared_volume_m3: 0.60, dg_flag: false }, as: ForwarderOps, captures: { hwa: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hwa}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hwa}/screening-records", as: ForwarderOps, captures: { sra: "$.data[0].id" } }
            - { call: "POST /air-freight/screening-records/${sra}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv1: "$.data.version" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/house-waybills", payload: { hwb_id: "${hwa}", expected_master_waybill_version: "${mv1}" }, as: ForwarderOps }
            - { call: "POST /air-freight/house-waybills/${hwa}/measure", payload: { measured_volume_m3: 0.60 }, as: ForwarderOps }
            - { call: "POST /air-freight/master-waybills/${mb1}/tender", payload: { tender_window_start_utc: "2026-08-09T12:00:00Z", tender_window_end_utc: "2026-08-09T13:00:00Z" }, as: CapacityPlanner }
            - { call: "POST /air-freight/master-waybills/${mb1}/milestone-events", payload: { event_code: "DEPARTED", event_time_utc: "2026-08-10T10:00:00Z" }, as: ForwarderOps }
            - { call: "POST /air-freight/master-waybills/${mb1}/milestone-events", payload: { event_code: "ARRIVED", event_time_utc: "2026-08-10T22:00:00Z" }, as: ForwarderOps }
            - { call: "POST /air-freight/master-waybills/${mb1}/milestone-events", payload: { event_code: "DELIVERED", event_time_utc: "2026-08-11T09:00:00Z" }, as: ForwarderOps }
            - { call: "POST /air-freight/master-waybills/${mb1}/close", as: CapacityPlanner, captures: { st_closed: "$.data.status" } }
          trigger:
            - { call: "POST /air-freight/master-waybills/${mb1}/milestone-events", payload: { event_code: "ARRIVED", event_time_utc: "2026-08-10T23:00:00Z" }, as: ForwarderOps, captures: { err: "$.data.error_id" } }
          assert:
            - "close succeeded first: captured ${st_closed} == CLOSED"
            - "milestone against CLOSED waybill: captured ${err} == ERR_INVALID_STATE; GET milestone-events still returns exactly 3 events"

      - name: submit_creates_required_screening_records
        claim_type: side_effect_execution
        grounds: ["state_machines.HouseWaybill.DRAFT_to_SCREENING"]
        distinguishing_aspect: "Submitting a dg waybill creates exactly two PENDING records (SECURITY first, DANGEROUS_GOODS second); a non-dg waybill creates exactly one."
        test_recipe:
          setup: ["Shipper ACME KNOWN; HWB-DG dg_flag true and HWB-GEN dg_flag false, both DRAFT"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-DG", origin_code: "SFO", destination_code: "NRT", pieces: 2, gross_weight_kg: 20.0, declared_volume_m3: 0.10, dg_flag: true }, as: ForwarderOps, captures: { hwdg: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-GEN", origin_code: "SFO", destination_code: "NRT", pieces: 1, gross_weight_kg: 10.0, declared_volume_m3: 0.05, dg_flag: false }, as: ForwarderOps, captures: { hwgen: "$.data.id" } }
          trigger:
            - { call: "POST /air-freight/house-waybills/${hwdg}/submit", as: ForwarderOps, as_user_id: "ops-1", captures: { st_dg: "$.data.status", sub_dg: "$.data.submitted_by_user_id" } }
            - { call: "GET /air-freight/house-waybills/${hwdg}/screening-records", as: ForwarderOps }
            - { call: "POST /air-freight/house-waybills/${hwgen}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hwgen}/screening-records", as: ForwarderOps }
          assert:
            - "dg waybill: ${st_dg} == SCREENING, ${sub_dg} == ops-1; its record list has total_count == 2 with screening_type [SECURITY, DANGEROUS_GOODS] in that order, both result PENDING, resolved_by_user_id null"
            - "non-dg waybill: record list total_count == 1 with screening_type SECURITY only"

      - name: latest_record_per_type_gates_clearance
        claim_type: compound_state_derivation
        grounds: ["state_machines.HouseWaybill.SCREENING_to_CLEARED", "state_machines.HouseWaybill.SCREENING_REJECTED_to_DRAFT"]
        distinguishing_aspect: "Clearance judges the LATEST record per type: after a rejection, recall and resubmission, a stale REJECTED record does not block the waybill once the newer record of that type is CLEARED."
        test_recipe:
          setup: ["Shipper ACME KNOWN; HWB-DG2 dg submitted, DG record rejected, waybill recalled to DRAFT and resubmitted (fresh record pair)"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-DG2", origin_code: "SFO", destination_code: "NRT", pieces: 2, gross_weight_kg: 20.0, declared_volume_m3: 0.10, dg_flag: true }, as: ForwarderOps, captures: { hw1: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hw1}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hw1}/screening-records", as: ForwarderOps, captures: { dg_old: "$.data[1].id" } }
            - { call: "POST /air-freight/screening-records/${dg_old}/resolve", payload: { outcome: "REJECTED", rejection_reason: "bad DG declaration" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "POST /air-freight/house-waybills/${hw1}/recall", as: ForwarderOps }
            - { call: "POST /air-freight/house-waybills/${hw1}/submit", as: ForwarderOps, as_user_id: "ops-1" }
            - { call: "GET /air-freight/house-waybills/${hw1}/screening-records", as: ForwarderOps, captures: { sec_new: "$.data[2].id", dg_new: "$.data[3].id" } }
          trigger:
            - { call: "POST /air-freight/screening-records/${sec_new}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/house-waybills/${hw1}", as: ForwarderOps, captures: { st_mid: "$.data.status" } }
            - { call: "POST /air-freight/screening-records/${dg_new}/resolve", payload: { outcome: "CLEARED" }, as: ComplianceOfficer, as_user_id: "comp-1" }
            - { call: "GET /air-freight/house-waybills/${hw1}", as: ForwarderOps, captures: { st_fin: "$.data.status" } }
          assert:
            - "with only the new SECURITY record cleared: ${st_mid} == SCREENING (latest DANGEROUS_GOODS record still PENDING)"
            - "after the new DANGEROUS_GOODS record clears: ${st_fin} == CLEARED despite the older REJECTED record — latest-per-type wins"
            - "GET screening-records returns 4 records total (audit retained), first pair [CLEARED? no: PENDING SECURITY + REJECTED DG], second pair both CLEARED"

      - name: out_of_order_milestone_recorded_without_transition
        claim_type: projection_ordering
        grounds: ["entities.MilestoneEvent.fields.out_of_order", "state_machines.MasterWaybill.TENDERED_to_IN_TRANSIT"]
        distinguishing_aspect: "An event whose rank skips ahead (DELIVERED while TENDERED) or repeats a passed rank is persisted with out_of_order == true and causes no transition; the in-order sequence still advances the waybill afterwards."
        test_recipe:
          setup: ["Base SFO->NRT fixture; HWB-A consolidated, measured, MAWB tendered"]
          setup_api_calls:
            - { call: "POST /air-freight/shippers", payload: { name: "Acme Exports", account_code: "ACME" }, as: ForwarderOps, captures: { sh1: "$.data.id" } }
            - { call: "POST /air-freight/shippers/${sh1}/verify-known-shipper", as: ComplianceOfficer }
