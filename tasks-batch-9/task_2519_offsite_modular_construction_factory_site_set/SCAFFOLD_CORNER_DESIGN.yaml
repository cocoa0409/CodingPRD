              payload: { project_id: "${proj}", carrier_code: "NWHEAVY", route_state_codes: ["WA"], planned_departure_at: "2026-09-08T13:00:00Z", planned_arrival_at: "2026-09-08T21:00:00Z" }
              as: TransportCoordinator
