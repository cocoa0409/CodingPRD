              payload: { ani: "5125559024", ali_grid_x: 12, ali_grid_y: 10, incident_type: "WELFARE_CHECK" }
              as: Calltaker
          trigger:
            - call: "GET /incidents"
              payload: { limit: 2, offset: 0 }
              as: Dispatcher
          assert:
            - "response data array length == 2"
            - "meta/envelope total_count == 3"
            - "has_more == true"

      - name: list_incidents_filter_by_lifecycle_status
        claim_type: Listing
        grounds:
          - endpoints.GET_/incidents
          - entities.Incident.fields.lifecycle_status
        distinguishing_aspect: "GET /incidents?lifecycle_status=CANCELLED returns only the cancelled incident, excluding the PENDING one."
        test_recipe:
          setup: ["One PENDING and one CANCELLED incident."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T16:00:00Z" }
