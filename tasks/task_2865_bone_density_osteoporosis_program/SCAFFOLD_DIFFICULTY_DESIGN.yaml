            - "Order O2 (HIGH_RISK_CASE_FINDING, FEMORAL_NECK, requested_scan_date 2026-04-15) created while next_eligible_scan_date is null so it is ELIGIBLE, then booked as appointment A2 on 2026-04-15T09:00:00Z, leaving open_scheduled_order_count 1."
