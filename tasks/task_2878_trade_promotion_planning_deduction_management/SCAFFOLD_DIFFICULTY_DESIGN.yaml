            - "Deduction.${ded_a_id}.entitled_amount == 2500.00 and Deduction.${ded_a_id}.validated_amount == 2500.00 and Deduction.${ded_a_id}.variance_amount == 500.00"
            - "Promotion.${promo_e_id}.accrued_balance == 250.00 (2500.00 accrued minus 2250.00 consumed)"
            - "Promotion.${promo_a_id}.accrued_balance == 0.00 (the agreement cap consumed the whole balance)"

  - rule_id: combinatorial_formula
    instances:
      - name: accrual_rounds_each_tactic_line_before_summing
        combination_mode: b
        grounds:
          - calculations.accrual_amount_for_period
          - calculations.tactic_line_planned_spend
          - entities.AccrualEntry.fields.tactic_line_amounts
        distinguishing_aspect: |
          Mode b: the same base quantity feeds two rate lines, each of which is rounded to the
          cent independently before the lines are summed. 333 cases at 0.375 gives 124.875 ->
          124.88 and 333 cases at 0.125 gives 41.625 -> 41.63, so the entry amount is 166.51.
          An implementation that sums the unrounded products first (333 x 0.500 = 166.500)
          rounds to 166.50 and is one cent short. Only the per-line-then-sum order produces
          166.51, so the assert falsifies the aggregate-then-round order.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03."
            - "One program, brand, customer and APPROVED allocation."
            - "One CONSUMPTION-basis promotion, window 2026-08-03 -> 2026-08-31, carrying two TPR tactic lines over the same window: 8000 cases at rate_per_case 0.375 and 8000 cases at rate_per_case 0.125 (TPR_CONCURRENCY_CAP is 2, so both lines are admissible)."
            - "Promotion APPROVED then LIVE via the activation run."
            - "One CONSUMPTION volume fact of 333 cases for period_start 2026-08-03."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/programs"
              payload: { fiscal_year: 2026, name: "FY2026 National Trade Fund", total_budget_amount: 5000000.00, accrual_method_default: "CONSUMPTION" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { prog_id: $.data.id }
            - call: "POST /trade-marketing/brands"
              payload: { program_id: "${prog_id}", name: "Crisp Oat Cereal", list_price_per_case: 24.00, cogs_per_case: 8.70, baseline_units_per_week: 1200 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "MegaMart", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations"
              payload: { program_id: "${prog_id}", customer_id: "${cust_id}", brand_id: "${brand_id}", event_type: "EVERYDAY", planned_amount: 100000.00, baseline_units: 40000, planned_incremental_units: 20000 }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_id: $.data.id }
            - call: "POST /trade-marketing/budget-allocations/${alloc_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { alloc_v1: $.data.version }
            - call: "POST /trade-marketing/promotions"
              payload: { allocation_id: "${alloc_id}", name: "Split Rate Everyday TPR", window_start: "2026-08-03", window_end: "2026-08-31", accrual_method: "CONSUMPTION", expected_allocation_version: "${alloc_v1}" }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { promo_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/tactics"
              payload: { tactic_type: "TPR", planned_units: 8000, window_start: "2026-08-03", window_end: "2026-08-31", rate_per_case: 0.375 }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { tactic_a_id: $.data.id }
            - call: "POST /trade-marketing/promotions/${promo_id}/tactics"
              payload: { tactic_type: "TPR", planned_units: 8000, window_start: "2026-08-03", window_end: "2026-08-31", rate_per_case: 0.125 }
              as: KeyAccountManager
              as_user_id: "kam-1"
              captures: { tactic_b_id: $.data.id }
            - call: "POST /trade-marketing/volume-facts"
              payload: { customer_id: "${cust_id}", brand_id: "${brand_id}", fact_type: "CONSUMPTION", period_start: "2026-08-03", units: 333, source: "EDI_852" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/promotions/${promo_id}/submit"
              payload: {}
              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "POST /trade-marketing/promotions/${promo_id}/approve"
              payload: {}
