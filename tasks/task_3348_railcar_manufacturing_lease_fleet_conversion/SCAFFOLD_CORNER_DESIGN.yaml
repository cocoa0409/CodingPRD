        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_id}/complete
        payload:
          completed_qty: 2
          completion_date: '2026-09-04'
        as: ProductionPlanner
      - call: GET /api/v1/lease-fleet-cars?production_order_id=${po_id}
        payload: {}
        as: LeaseAdministrator
        captures:
          car_a: $.data[0].id
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-24T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /api/v1/lease-fleet-sales
        payload:
          lease_fleet_car_id: ${car_a}
          buyer_name: Great Lakes Rail Leasing
          sale_price_cents: 30000
          writeback_liability_cents: 0
          sale_date: '2026-09-24'
        as: PortfolioManager
        captures:
          sale_id: $.data.id
          gain: $.data.gain_loss_cents
      - call: POST /api/v1/lease-fleet-sales/${sale_id}/settle
        payload: {}
