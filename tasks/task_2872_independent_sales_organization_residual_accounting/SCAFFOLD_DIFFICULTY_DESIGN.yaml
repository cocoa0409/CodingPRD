  - rule_id: boundary_precision_check
    instances:

      - name: vesting_cliff_at_exactly_twelve_months_on_departure
        grounds:
          - calculations.agent_vesting_pct
          - calculations.departure_vested_buyout
          - state_machines.Agent.DEPARTURE_NOTICE_to_DEPARTED
          - entities.Agent.fields.vested_pct_at_departure
        distinguishing_aspect: |
          The cliff is INCLUSIVE at exactly VESTING_CLIFF_MONTHS. With the clock at
          2027-02-01, A3 (vesting_start 2026-02-01) has months_elapsed == 12 and vests
          25%, while A4 (vesting_start 2026-03-01) has months_elapsed == 11 and vests 0
          — one calendar day of anchor difference separates a 87858-cent buyout from no
          adjustment at all. round_half_up is applied twice: 14643 average, then
          14643 * 24 * 25 / 100 = 87858 exactly.
        test_recipe:
          setup:
            - "A3 (top-level, split 0.45, vesting_start_date 2026-02-01) owns M1 with the canonical July line and both chargebacks; the 2026-07 batch is POSTED and A3's statement is ISSUED at 14643, so the trailing window holds exactly one ISSUED statement."
            - "A4 (top-level, split 0.45, vesting_start_date 2026-03-01) owns nothing."
            - "The logical clock is advanced to 2027-02-01 and both agents file a departure notice effective 2027-02-01."
