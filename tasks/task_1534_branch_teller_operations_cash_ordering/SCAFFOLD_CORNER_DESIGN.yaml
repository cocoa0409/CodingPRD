              as: BranchManager
              as_user_id: "mgr-1"
              captures: { c_id: "$.data[0].id", c_status: "$.data[0].status" }
          trigger:
            - call: "GET /api/drawers/${d_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { d_ver: $.data.version }
            - call: "POST /api/drawers/${d_id}/close"
              payload: { expected_drawer_version: "${d_ver}" }
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { err1: $.data.error_id }
            - call: "POST /api/over-short-cases/${c_id}/investigate"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { c_st2: $.data.status }
            - call: "POST /api/over-short-cases/${c_id}/resolve"
              payload: {}
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { c_st3: $.data.status }
            - call: "GET /api/drawers/${d_id}"
              as: BranchManager
              as_user_id: "mgr-1"
              captures: { d_ver2: $.data.version }
            - call: "POST /api/drawers/${d_id}/close"
              payload: { expected_drawer_version: "${d_ver2}" }
              as: BranchManager
