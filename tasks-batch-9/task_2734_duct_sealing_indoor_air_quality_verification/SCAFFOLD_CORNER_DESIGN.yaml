              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /duct-sealing/projects/${proj_id}/duct-systems"
              payload: { system_label: "AHU-1", total_register_count: 9, design_cfm: 1200.0, duct_material: "SHEET_METAL", condition_grade: "B" }
              as: ProgramAdmin
              captures: { ds1_id: $.data.id }
            - call: "POST /duct-sealing/duct-systems/${ds1_id}/asbestos-screening"
              payload: { asbestos_screening_result: "CLEARED", lab_reference: "LAB-1001" }
              as: QAVerifier
              as_user_id: "qa-1"
            - call: "POST /duct-sealing/leakage-tests"
              payload: { duct_system_id: "${ds1_id}", phase: "PRE", method: "DUCT_BLASTER", window_start_at: "2026-08-01T13:00:00Z", window_end_at: "2026-08-01T15:00:00Z" }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
              captures: { pre1_id: $.data.id }
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/pressurize"
              payload: { test_pressure_pa: 25.0, fan_ring_config: "RING_2", masked_register_count: 9 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/record"
              payload: { measured_leakage_cfm: 300.0, ambient_temp_f: 78.0 }
              as: FieldTechnician
              as_user_id: "${tech1_id}"
          trigger:
            - call: "GET /duct-sealing/leakage-tests/${pre1_id}"
              as: QAVerifier
              as_user_id: "qa-1"
              captures: { measured_by: $.data.performed_by_user_id, before_status: $.data.status }
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/review"
              payload: { decision: "ACCEPT", review_note: "looks fine to me, says the person who measured it" }
              as: QAVerifier
              as_user_id: "${tech1_id}"
              captures: { e_sod: $.data.error_id }
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/review"
              payload: { decision: "ACCEPT", review_note: "independent review" }
              as: QAVerifier
              as_user_id: "qa-1"
              captures: { after_status: $.data.status, reviewer: $.data.reviewed_by_user_id }
            - call: "POST /duct-sealing/leakage-tests/${pre1_id}/review"
              payload: { decision: "REJECT", review_note: "measuring technician trying again after acceptance" }
              as: QAVerifier
              as_user_id: "${tech1_id}"
              captures: { e_sod_again: $.data.error_id }
