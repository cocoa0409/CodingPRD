      - name: timer_loop_creation_requires_active_daypart_profile
        grounds:
          - validations.priority_13_ERR_PROFILE_NOT_ACTIVE
          - state_machines.DaypartProfile.DRAFT_to_ACTIVE
          - entities.DaypartProfile.fields.profile_state
          - calculations.loop_target_pinning
        distinguishing_aspect: |
          Entity pair is TimerLoop depending on DaypartProfile: an identical, byte-for-byte create
