            - "err_term == ERR_INVALID_SEASON_STATE (CLOSED is terminal)"

      - name: slot_completion_marks_no_shows_third_triggers_probation
        claim_type: side_effect_execution
        grounds: [state_machines.ShiftSlot.LOCKED_to_COMPLETED, state_machines.ShiftSignup.CONFIRMED_to_NO_SHOW, calculations.no_show_standing, entities.Volunteer.fields.no_show_count]
        distinguishing_aspect: "Threshold trigger with exact boundary: slot completion flips un-checked-in CONFIRMED signups to NO_SHOW; the volunteer's 1st and 2nd no-shows leave standing GOOD, the 3rd flips GOOD -> PROBATION (>= 3, not > 3)."
