# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3208_theater_dining_service_timing_server_routing
#
# 9 rule_id blocks, 34 instances total. Every instance grounds in §1.1–§1.6 and
# carries a directly executable setup_api_calls chain.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: kitchen_load_projection_wave_vs_final_over_one_cluster
        grounds:
          - calculations.kitchen_load_projection
          - calculations.kitchen_load_projection.variants.wave_projection
          - calculations.kitchen_load_projection.variants.final_projection
          - endpoints.GET_/showtimes/{id}/dining-capacity
          - state_machines.Showtime.SCHEDULED_to_DINING_OPEN
        distinguishing_aspect: |
          The two variants consume the identical ENTREE slip set at the identical
          logical clock and still disagree: the base restricts the cohort to
          showtimes starting at or before S and measures point cost, while the
          final measures item count across the whole cluster, so reading one
          showtime reports 2 then 1 for the same demand.
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, screen_lead_time_minutes 20, kitchen_point_rate 1. Menu item E1 = ENTREE, price 1200 cents, prep_minutes 2. Server S1 hired into A."
            - "Showtime X1 on A: start_at_utc 2026-09-01T20:00:00Z, runtime_minutes 60, so dining_open 19:40, entree_ready_deadline 20:45, dining_close 20:15."
            - "Showtime X2 on A: start_at_utc 2026-09-01T20:45:00Z, runtime_minutes 60, so dining_open 20:25. X1's dining window [19:40,20:15) and X2's [20:25,21:30) are disjoint, and X2 sits 105 minutes from X1's cluster anchor 19:00, inside the 120-minute window."
            - "Logical clock at 2026-09-01T19:40:00Z. X1 open for dining, one section assigned, one ENTREE slip of 1x E1 accepted (2 points, 1 item). X2 still SCHEDULED."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 3", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Bucket of Fries", channel: "ENTREE", price_cents: 1200, prep_minutes: 2, is_alcoholic: false }
              as: PlatformAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Dana", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { srv1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:40:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Alien", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_v: $.data.version }
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Aliens", start_at_utc: "2026-09-01T20:45:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x2_id: $.data.id }
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${srv1_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { sa1_id: $.data.id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 12, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
          trigger:
            - call: "GET /showtimes/${x1_id}/dining-capacity"
              payload: {}
              as: KitchenLead
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:50:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes/${x1_id}/start-service"
              payload: {}
              as: KitchenLead
            - call: "GET /showtimes/${x1_id}/dining-capacity"
              payload: {}
              as: KitchenLead
          assert:
            - "while X1 is DINING_OPEN the read model reports data.projection_variant == \"wave_projection\" and data.entree_load_points == 2"
            - "after X1 reaches SERVICE the same one item of demand is reported as data.projection_variant == \"final_projection\" and data.entree_load_points == 1"
            - "the two reads are taken against the identical slip set (X1's 1x E1) and the identical X2 state, so the 2 -> 1 delta is produced by the variant switch alone and not by a change in demand"

      - name: ejection_liability_fair_vs_shock_on_one_cluster_instant
        grounds:
          - calculations.ejection_cluster_refund_liability
          - calculations.ejection_cluster_refund_liability.variants.fair_liability
          - calculations.ejection_cluster_refund_liability.variants.shock_liability
          - entities.Server.fields.rollup_provisional_cents
          - endpoints.GET_/auditoriums/{id}/refund-liability
          - state_machines.CheckTab.OPEN_to_PARTIALLY_REFUNDED
        distinguishing_aspect: |
          Both variants report the refund liability booked for the same ejections
          at the same instant, but fair reads the ejected slips' own refunded_cents
          while shock folds each ejected slip's original_cents plus every other
          open slip belonging to the same owning server, so one owner holding an
          unejected open slip makes the two figures diverge.
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, kitchen_point_rate 1, alcove_point_rate 3. ENTREE item E1 price 1000 prep 1. Server S1 hired into A."
            - "Showtime X1 on A starts 2026-09-01T20:00:00Z, runtime 60. Section assignment SA1 (S1, LEFT). Two ENTREE slips on SA1: slip P at seat 10 and slip Q at seat 11, each 1x E1, subtotal 1000 cents each."
            - "Clock at 2026-09-01T19:45:00Z. X1 is DINING_OPEN. Slip P is delivered and then its seat is the subject of an approved ejection, so P's check carries refunded_cents 1000. Slip Q's check is still OPEN with refunded_cents 0."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 1", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Pretzel", channel: "ENTREE", price_cents: 1000, prep_minutes: 1, is_alcoholic: false }
              as: PlatformAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Iris", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { srv1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:45:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Jaws", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 60, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_v: $.data.version }
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${srv1_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { sa1_id: $.data.id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 10, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 11, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
              captures: { q_id: $.data.id }
            - call: "POST /order-slips/${p_id}/prepare"
              payload: {}
              as: Server
              as_user_id: "${srv1_id}"
            - call: "POST /order-slips/${p_id}/mark-ready"
              payload: {}
              as: Server
              as_user_id: "${srv1_id}"
            - call: "POST /order-slips/${p_id}/deliver"
              payload: {}
              as: Server
              as_user_id: "${srv1_id}"
            - call: "POST /disturbance-events"
              payload: { order_slip_id: "${p_id}", kind: "NO_TALKING" }
              as: Server
              as_user_id: "${srv1_id}"
              captures: { de_id: $.data.id }
            - call: "POST /disturbance-events/${de_id}/approve-ejection"
              payload: {}
              as: KitchenLead
          trigger:
            - call: "GET /auditoriums/${aud_id}/refund-liability"
              payload: {}
              as: KitchenLead
          assert:
            - "data.ejection_count == 1"
            - "data.fair_liability_cents == 1000, which is the ejected slip P's own CheckTab.refunded_cents"
            - "data.shock_liability_cents == 2000, because owning server S1.rollup_provisional_cents folds P's original_cents 1000 plus Q's still-open original_cents 1000"
            - "data.shock_liability_cents != data.fair_liability_cents"

  # ===========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: dining_order_capacity_snapshot_two_min_layers_at_exact_boundary
        grounds:
          - calculations.dining_order_capacity_snapshot
          - calculations.dining_order_capacity_snapshot.variants.pre_show_snapshot
          - calculations.kitchen_load_projection
          - validations[priority=17]
          - endpoints.POST_/order-slips
          - endpoints.GET_/showtimes/{id}/dining-capacity
        distinguishing_aspect: |
          Mode (a): the band is the outer min of two independently derived bands —
          the capacity band from ceil(load / rate) and the load-percentage band
          from the sliding remaining-minutes window — so at a clock where the
          capacity band is NORMAL the acceptance still flips to LATE because the
          percentage band is 100 strictly at and above the ceiling, not above it.
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, screen_lead_time_minutes 20, kitchen_point_rate 1. ENTREE item E1 price 1000, prep_minutes 2. Server S1 hired into A."
            - "Showtime X1 on A starts 2026-09-01T20:00:00Z, runtime 100, so dining_open 19:40 and entree_ready_deadline 21:15. Entity load_pct is floor(load * 100 / (rate * (Ti - now)))."
            - "Clock at 2026-09-01T20:15:00Z, giving Ti - now = 60 minutes and a ceil denominator of 60. Fifty accepted ENTREE slips of 1x E1 already sit on X1, for a load of 100 points."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 7", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Nachos", channel: "ENTREE", price_cents: 1000, prep_minutes: 2, is_alcoholic: false }
              as: PlatformAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Ola", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { srv1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:40:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "Heat", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 100, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_v: $.data.version }
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${srv1_id}", section_label: "LEFT" }
              as: KitchenLead
              captures: { sa1_id: $.data.id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 1, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 2, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 3, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 4, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 5, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T20:15:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /showtimes/${x1_id}/dining-capacity"
              payload: {}
              as: KitchenLead
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 6, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
              captures: { err_no_ack: $.data.error_id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 7, lines: [ { menu_item_id: "${e1_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}", capacity_ack: true }
              as: Server
              as_user_id: "${srv1_id}"
          assert:
            - "the unacknowledged placement is rejected with data.error_id == \"ERR_KITCHEN_CAPACITY_BAND\""
            - "the acknowledged placement succeeds with HTTP 201 and data.status == \"ACCEPTED\""
            - "the read model reports data.load_pct == 100 and data.capacity_band == \"LATE\""
            - "the read model reports data.entree_load_points == 10, being the 5 accepted slips of 1x E1 at 2 points each"
            - "the read model reports data.entree_latest_accept_at_utc == \"2026-09-01T21:15:00Z\", because ceil(10 / 1) == 10 minutes and 21:15 minus 10 minutes equals the deadline itself"

      - name: order_subtotal_per_line_rounding_not_sum_then_round
        grounds:
          - calculations.order_subtotal
          - calculations.order_subtotal.variants.themed_pricing
          - calculations.order_subtotal.variants.standard_pricing
          - constants.THEME_DISCOUNT_PCT
          - endpoints.POST_/order-slips
        distinguishing_aspect: |
          Mode (b): the 5% theme discount is rounded once per line and the rounded
          line totals are then summed, so a three-line themed slip totals 3357
          cents rather than the 3358 that sum-then-round produces — the one-cent
          delta is the whole point of the pinned rounding order.
        test_recipe:
          setup:
            - "Auditorium A, 60 seats, kitchen_point_rate 1. ENTREE item E1 price 999 prep 1; BEVERAGE item B1 price 451 prep 1, non-alcoholic; BEVERAGE item B2 price 301 prep 1, non-alcoholic."
            - "ProgrammingEvent PE1 on A, requires_themed_menu true, with themed items E1 at 1099, B1 at 499 and B2 at 349. Pre-show content approved and the event activated BEFORE the showtime is scheduled."
            - "Showtime X1 on A, content_type SPECIAL_EVENT, starts 2026-09-01T20:00:00Z runtime 100. Clock at 2026-09-01T19:40:00Z. X1 open for dining. One ENTREE slip accepted with three lines: 1x E1, 1x B1, 1x B2."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 2", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Quiche", channel: "ENTREE", price_cents: 999, prep_minutes: 1, is_alcoholic: false }
              as: PlatformAdmin
              captures: { e1_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Sparkling Water", channel: "BEVERAGE", price_cents: 451, prep_minutes: 1, is_alcoholic: false }
              as: PlatformAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /menu-items"
              payload: { catalog_name: "Cola", channel: "BEVERAGE", price_cents: 301, prep_minutes: 1, is_alcoholic: false }
              as: PlatformAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /servers"
              payload: { display_name: "Paz", home_auditorium_id: "${aud_id}" }
              as: PlatformAdmin
              captures: { srv1_id: $.data.id }
            - call: "POST /programming-events"
              payload: { auditorium_id: "${aud_id}", theme_name: "Quote-Along: The Princess Bride", requires_themed_menu: true }
              as: ProgrammingCoordinator
              captures: { pe_id: $.data.id, pe_v: $.data.version }
            - call: "POST /programming-events/${pe_id}/themed-menu-items"
              payload: { menu_item_id: "${e1_id}", theme_price_cents: 1099, is_signature: true }
              as: ProgrammingCoordinator
            - call: "POST /programming-events/${pe_id}/themed-menu-items"
              payload: { menu_item_id: "${b1_id}", theme_price_cents: 499, is_signature: false }
              as: ProgrammingCoordinator
            - call: "POST /programming-events/${pe_id}/themed-menu-items"
              payload: { menu_item_id: "${b2_id}", theme_price_cents: 349, is_signature: false }
              as: ProgrammingCoordinator
            - call: "POST /programming-events/${pe_id}/pre-show-content/submit"
              payload: {}
              as: ProgrammingCoordinator
            - call: "POST /programming-events/${pe_id}/pre-show-content/approve"
              payload: {}
              as: PreShowProducer
            - call: "POST /programming-events/${pe_id}/activate"
              payload: { expected_programming_event_version: "${pe_v}" }
              as: ProgrammingCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:40:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "The Princess Bride", start_at_utc: "2026-09-01T20:00:00Z", runtime_minutes: 100, content_type: "SPECIAL_EVENT" }
              as: ProgrammingCoordinator
              captures: { x1_id: $.data.id, x1_v: $.data.version }
            - call: "POST /showtimes/${x1_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x1_id}", server_id: "${srv1_id}", section_label: "CENTER" }
              as: KitchenLead
              captures: { sa1_id: $.data.id }
          trigger:
            - call: "POST /order-slips"
              payload: { showtime_id: "${x1_id}", section_assignment_id: "${sa1_id}", seat_number: 8, lines: [ { menu_item_id: "${e1_id}", quantity: 1 }, { menu_item_id: "${b1_id}", quantity: 1 }, { menu_item_id: "${b2_id}", quantity: 1 } ], expected_showtime_version: "${x1_v}" }
              as: Server
              as_user_id: "${srv1_id}"
              captures: { slip_themed_id: $.data.id, slip_themed_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:45:00Z" }
              as: PlatformAdmin
            - call: "POST /showtimes"
              payload: { auditorium_id: "${aud_id}", title: "The Princess Bride (late)", start_at_utc: "2026-09-01T21:30:00Z", runtime_minutes: 100, content_type: "STANDARD" }
              as: ProgrammingCoordinator
              captures: { x2_id: $.data.id, x2_v: $.data.version }
            - call: "POST /showtimes/${x2_id}/open-dining"
              payload: {}
              as: KitchenLead
            - call: "POST /section-assignments"
              payload: { showtime_id: "${x2_id}", server_id: "${srv1_id}", section_label: "RIGHT" }
              as: KitchenLead
              captures: { sa2_id: $.data.id }
            - call: "POST /order-slips"
              payload: { showtime_id: "${x2_id}", section_assignment_id: "${sa2_id}", seat_number: 8, lines: [ { menu_item_id: "${e1_id}", quantity: 1 }, { menu_item_id: "${b1_id}", quantity: 1 }, { menu_item_id: "${b2_id}", quantity: 1 } ], expected_showtime_version: "${x2_v}" }
              as: Server
              as_user_id: "${srv1_id}"
              captures: { slip_standard_id: $.data.id }
          assert:
            - "the themed slip is created with data.subtotal_cents == 3357, being sum of the per-line rounded totals 1044 + 474 + 332"
            - "the standard slip on the non-themed showtime X2 is created with data.subtotal_cents == 1751, being 999 + 451 + 301 with no theme discount"
            - "the themed slip's data.resolved_lines[0].unit_price_cents == 1099, data.resolved_lines[1].unit_price_cents == 499 and data.resolved_lines[2].unit_price_cents == 349"
            - "data.subtotal_cents for the themed slip is NOT 3358, which is what summing the lines first and rounding the 5% discount once would produce"

  # ===========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: programming_event_pre_show_cycle_rejects_then_resubmits_and_bumps_version
        grounds:
          - state_machines.ProgrammingEvent.PRE_SHOW_IN_REVIEW_to_PRE_SHOW_REJECTED
          - state_machines.ProgrammingEvent.PRE_SHOW_REJECTED_to_PRE_SHOW_IN_REVIEW
          - state_machines.ProgrammingEvent.PRE_SHOW_APPROVED_to_PRE_SHOW_IN_REVIEW
          - entities.ProgrammingEvent.fields.pre_show_content_version
          - endpoints.POST_/programming-events/{id}/pre-show-content/submit
          - endpoints.POST_/programming-events/{id}/pre-show-content/reject
        distinguishing_aspect: |
          A genuine cycle, not a pipeline: PRE_SHOW_IN_REVIEW -> REJECTED -> IN_REVIEW
          -> APPROVED -> IN_REVIEW, and every re-entry through the cycle bumps
          pre_show_content_version, so the event lands back in the same state with a
          strictly higher version than it started with.
        test_recipe:
          setup:
            - "Auditorium A, 60 seats. ProgrammingEvent PE1 on A with requires_themed_menu true and one themed menu item attached, so the submit precondition is met."
            - "Clock at 2026-09-01T18:00:00Z. PE1 is DRAFT with pre_show_content_status PRE_SHOW_DRAFT and pre_show_content_version 1."
          setup_api_calls:
            - call: "POST /auditoriums"
              payload: { name: "Theater 5", seat_capacity: 60, screen_lead_time_minutes: 20, kitchen_point_rate: 1, alcove_point_rate: 3 }
              as: PlatformAdmin
              captures: { aud_id: $.data.id }
