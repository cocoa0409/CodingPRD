scenario: "587. Drone Delivery & BVLOS Operations (Zipline/Wing style): order intake & payload/weight, route & airspace (LAANC) authorization, drone fleet & battery/charge state, launch/recovery & nest, weather/no-fly geofence, delivery confirmation & drop, incident & maintenance log, range/service-area"
domain_name: "drone-bvlos-delivery"
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - selector_policy
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Flight carries two independent state dimensions (ops_state x clearance_state) that evolve
    on the same row; Drone and Battery are cyclic (IDLE->RESERVED->IN_FLIGHT->IDLE,
    READY->IN_USE->COOLDOWN->READY); Incident is a fork-join branch whose two outcomes carry
    disjoint side-effect sets. Difficulty is concentrated in the dispatch selector, the
    provisional-vs-actual energy variants, the pad/maintenance interval arithmetic, and the
    grounding cascade that unwinds a live flight without leaking pad slots or held funds.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================== §1.1 Entities ===============================
entities:
  - name: ServiceArea
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human label for the service area"
      - name: center_lat
        type: number
        source: input
        description: "Latitude of the service-area centroid; range check is measured from here"
      - name: center_lon
        type: number
        source: input
        description: "Longitude of the service-area centroid"
      - name: max_range_km
        type: number
        source: input
        description: "Maximum one-way delivery distance from the centroid, inclusive"
        constraints: "> 0"
      - name: max_payload_g
        type: integer
        source: input
        description: "Maximum order payload accepted in this area, inclusive"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Operational status of the whole area"
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"

  - name: Nest
    parent: ServiceArea
    common_fields: true
    fields:
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; the area this nest launches into"
      - name: name
        type: string
        source: input
        description: "Nest label"
      - name: lat
        type: number
        source: input
        description: "Nest latitude; the launch and recovery point of every flight from this nest"
      - name: lon
        type: number
        source: input
        description: "Nest longitude"
      - name: pad_count
        type: integer
        source: input
        description: "Number of physical launch/recovery pads; aggregate capacity for overlapping pad holds"
        constraints: ">= 1"
      - name: status
        type: enum
        source: input
        description: "Nest availability"
        default: OPEN
        constraints: "OPEN | CLOSED"
      - name: reserved_pads
        type: integer
        source: computed
        description: "Live count of pad slots held by non-terminal flights recovering here; conserved quantity of the pad invariant"
        default: 0

  - name: Drone
    parent: null
    common_fields: true
    fields:
      - name: home_nest_id
        type: string
        source: input
        description: "FK -> Nest.id; the nest this airframe is based at"
      - name: tail_number
        type: string
        source: input
        description: "Registration mark; globally unique across all drones"
        constraints: "unique"
      - name: airframe_class
        type: enum
        source: input
        description: "Airframe family"
        constraints: "LIGHT | HEAVY"
      - name: max_payload_g
        type: integer
        source: input
        description: "Maximum payload this airframe can lift, inclusive"
        constraints: "> 0"
      - name: cruise_speed_kmh
        type: number
        source: input
        description: "Cruise ground speed used for ETA computation"
        constraints: "> 0"
      - name: hours_since_service
        type: number
        source: input
        description: "Airframe hours flown since the last completed maintenance; imported for existing fleet"
        default: 0
        constraints: ">= 0"
      - name: flight_hours
        type: number
        source: system
        description: "Lifetime airframe hours; never reset"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Fleet availability dimension"
        default: IDLE
        constraints: "IDLE | RESERVED | IN_FLIGHT | GROUNDED"
      - name: installed_battery_id
        type: string
        source: system
        description: "FK -> Battery.id; the battery currently bolted into this airframe, null when none"
        default: null
      - name: advisory_risk_score
        type: number
        source: computed
        description: "Airworthiness risk, advisory variant (closed incidents only); surfaced for fleet dashboards, never gates an operation"
      - name: blocking_risk_score
        type: number
        source: computed
        description: "Airworthiness risk, blocking variant (open + under-review + closed incidents); gates dispatch eligibility and flight release at >= 70"

  - name: Battery
    parent: Nest
    common_fields: true
    fields:
      - name: nest_id
        type: string
        source: input
        description: "FK -> Nest.id; the nest that stores and charges this pack"
      - name: serial
        type: string
        source: input
        description: "Pack serial number"
      - name: charge_pct
        type: number
        source: input
        description: "State of charge in percent, one decimal place"
        default: 100
        constraints: ">= 0 and <= 100"
      - name: cycle_count
        type: integer
        source: input
        description: "Completed charge/discharge cycles; imported for existing packs"
        default: 0
        constraints: ">= 0"
      - name: state
        type: enum
        source: system
        description: "Pack lifecycle dimension"
        default: CHARGING
        constraints: "CHARGING | READY | IN_USE | COOLDOWN | RETIRED"
      - name: health_pct
        type: number
        source: computed
        description: "Remaining pack health = round(100 - (cycle_count / 300) * 100, 1), floored at 0"

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Customer display name"
      - name: email
        type: string
        source: input
        description: "Contact email"
      - name: dropoff_lat
        type: number
        source: input
        description: "Latitude of this customer's fixed delivery point"
      - name: dropoff_lon
        type: number
        source: input
        description: "Longitude of this customer's fixed delivery point"
      - name: held_total
        type: number
        source: computed
        description: "Money authorized but not yet captured; conserved quantity of the funds invariant. Equals sum(Order.order_total) over this customer's orders with status IN {ASSIGNED, IN_TRANSIT}"
        default: 0
      - name: billed_total
        type: number
        source: computed
        description: "Money captured. Equals sum(Order.order_total) over this customer's orders with status == DELIVERED"
        default: 0

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the ordering customer, whose dropoff coordinates are copied onto the order"
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; the area that must serve this order"
      - name: payload_weight_g
        type: integer
        source: input
        description: "Gross payload mass in grams"
        constraints: "> 0"
      - name: priority
        type: enum
        source: input
        description: "Service class; drives the fee multiplier"
        default: STANDARD
        constraints: "STANDARD | URGENT | MEDICAL"
      - name: dropoff_lat
        type: number
        source: computed
        description: "Copied from Customer.dropoff_lat at order creation and frozen"
      - name: dropoff_lon
        type: number
        source: computed
        description: "Copied from Customer.dropoff_lon at order creation and frozen"
      - name: distance_km
        type: number
        source: computed
        description: "Planar distance from ServiceArea centroid to the dropoff point, 3 decimals; drives the range check and the fee tier"
      - name: delivery_fee
        type: number
        source: computed
        description: "Component-rounded delivery fee, 2 decimals"
      - name: airspace_surcharge
        type: number
        source: computed
        description: "Regulatory surcharge, 2 decimals; tier is keyed on delivery_fee, never on order_total"
      - name: order_total
        type: number
        source: computed
        description: "delivery_fee + airspace_surcharge, 2 decimals"
      - name: status
        type: enum
        source: system
        description: "Order lifecycle; re-enters QUOTED when a flight aborts"
        default: QUOTED
        constraints: "QUOTED | ASSIGNED | IN_TRANSIT | DELIVERED | CANCELLED"

  - name: Flight
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: system
        description: "FK -> Order.id; the order this sortie serves"
      - name: drone_id
        type: string
        source: system
        description: "FK -> Drone.id; the airframe selected by the dispatch selector"
      - name: launch_nest_id
        type: string
        source: system
        description: "FK -> Nest.id; the nest the sortie departs from"
      - name: recovery_nest_id
        type: string
        source: system
        description: "FK -> Nest.id; the nest the sortie returns to; equals launch_nest_id"
      - name: battery_id
        type: string
        source: system
        description: "FK -> Battery.id; the pack installed on the drone at dispatch time"
      - name: ops_state
        type: enum
        source: system
        description: "Physical sortie dimension; evolves independently of clearance_state"
        default: PLANNED
        constraints: "PLANNED | LAUNCHED | DROPPING | RETURNING | RECOVERED | ABORTED"
      - name: clearance_state
        type: enum
        source: system
        description: "Regulatory dimension; evolves independently of ops_state"
        default: UNFILED
        constraints: "UNFILED | FILED | CLEARED | REVOKED"
      - name: planned_route_km
        type: number
        source: computed
        description: "2 * planar distance(launch nest, dropoff), 3 decimals"
      - name: required_energy_pct
        type: number
        source: computed
        description: "Provisional energy variant: planned-route energy plus hover plus reserve, 1 decimal"
      - name: actual_energy_pct
        type: number
        source: computed
        description: "Actual energy variant: reported-route energy plus hover, no reserve, 1 decimal; null until recovery or a post-launch abort"
        default: null
      - name: actual_route_km
        type: number
        source: input
        description: "Route actually flown, reported at recovery or post-launch abort, 3 decimals"
        default: null
      - name: wind_kph_at_dispatch
        type: number
        source: computed
        description: "Wind speed frozen from the latest WeatherObservation of the order's service area at dispatch time; 0 when no observation exists"
      - name: eta_recovery_at
        type: datetime
        source: computed
        description: "Logical clock at dispatch + ceil(planned_route_km / cruise_speed_kmh * 60) + 3 minutes"
      - name: pad_hold_start
        type: datetime
        source: computed
        description: "eta_recovery_at - 5 minutes; start of the closed pad-hold interval at the recovery nest"
      - name: pad_hold_end
        type: datetime
        source: computed
        description: "eta_recovery_at + 10 minutes; end of the closed pad-hold interval at the recovery nest"
      - name: filed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DispatchOperator who filed the airspace authorization"
        default: null
      - name: released_by_user_id
        type: string
        source: system
        description: "X-User-ID of the FlightDirector who released the flight; must differ from filed_by_user_id"
        default: null
      - name: abort_reason
        type: enum
        source: system
        description: "Why the sortie ended early"
        default: null
        constraints: "OPERATOR | DRONE_GROUNDED | WEATHER"

  - name: AirspaceAuthorization
    parent: Flight
    common_fields: true
    fields:
      - name: flight_id
        type: string
        source: system
        description: "FK -> Flight.id; the sortie this LAANC request covers"
      - name: grid_cells
        type: array
        source: input
        description: "List of LAANC grid-cell codes the route traverses"
      - name: requested_alt_ft
        type: integer
        source: input
        description: "Requested altitude ceiling in feet AGL"
        constraints: "> 0 and <= 400"
      - name: window_start
        type: datetime
        source: input
        description: "Start of the authorized flight window, inclusive"
      - name: window_end
        type: datetime
        source: input
        description: "End of the authorized flight window, exclusive"
      - name: status
        type: enum
        source: system
        description: "LAANC decision dimension"
        default: PENDING
        constraints: "PENDING | APPROVED | DENIED | REVOKED"
      - name: auth_code
        type: string
        source: system
        description: "Authorization code minted on approval; null otherwise"
        default: null

  - name: GeofenceZone
    parent: ServiceArea
    common_fields: true
    fields:
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; the area this restriction sits in"
      - name: kind
        type: enum
        source: input
        description: "Restriction family"
        constraints: "NO_FLY | TFR | WEATHER_HOLD"
      - name: center_lat
        type: number
        source: input
        description: "Latitude of the restriction centre"
      - name: center_lon
        type: number
        source: input
        description: "Longitude of the restriction centre"
      - name: radius_km
        type: number
        source: input
        description: "Restriction radius in km, inclusive"
        constraints: "> 0"
      - name: effective_from
        type: datetime
        source: input
        description: "Start of the restriction, inclusive"
      - name: effective_to
        type: datetime
        source: input
        description: "End of the restriction, exclusive"
      - name: status
        type: enum
        source: system
        description: "Whether the restriction is enforced"
        default: ACTIVE
        constraints: "ACTIVE | LIFTED"

  - name: WeatherObservation
    parent: ServiceArea
    common_fields: false
    fields:
      - name: service_area_id
        type: string
        source: input
        description: "FK -> ServiceArea.id; the area this observation covers"
      - name: observed_at
        type: datetime
        source: input
        description: "Observation timestamp; latest observation wins, ties broken by created_at DESC"
      - name: wind_kph
        type: number
        source: input
        description: "Sustained wind speed"
        constraints: ">= 0"
      - name: gust_kph
        type: number
        source: input
        description: "Peak gust speed"
        constraints: ">= 0"
      - name: visibility_km
        type: number
        source: input
        description: "Horizontal visibility"
        constraints: ">= 0"
      - name: precip
        type: enum
        source: input
        description: "Precipitation intensity"
        default: NONE
        constraints: "NONE | LIGHT | HEAVY"
      - name: flyable
        type: boolean
        source: computed
        description: "wind_kph <= 35 AND gust_kph <= 45 AND visibility_km >= 1.5 AND precip IN {NONE, LIGHT}"

  - name: DeliveryDrop
    parent: Flight
    common_fields: false
    fields:
      - name: flight_id
        type: string
        source: system
        description: "FK -> Flight.id; the sortie that performed the drop"
      - name: drop_lat
        type: number
        source: computed
        description: "Copied from Order.dropoff_lat"
      - name: drop_lon
        type: number
        source: computed
        description: "Copied from Order.dropoff_lon"
      - name: hover_alt_ft
        type: integer
        source: input
        description: "Hover altitude at release"
        constraints: "> 0 and <= 400"
      - name: photo_ref
        type: string
        source: input
        description: "Reference to the drop confirmation photo"
      - name: confirmed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DispatchOperator who confirmed the drop"

  - name: Incident
    parent: null
    common_fields: true
    fields:
      - name: drone_id
        type: string
        source: input
        description: "FK -> Drone.id; the airframe involved"
      - name: flight_id
        type: string
        source: input
        description: "FK -> Flight.id; the sortie involved, null for ground incidents"
        default: null
      - name: severity
        type: enum
        source: input
        description: "Severity band; contributes 5 / 15 / 30 risk points"
        constraints: "MINOR | MAJOR | CRITICAL"
      - name: category
        type: enum
        source: input
        description: "Incident family"
        constraints: "HARD_LANDING | LOST_LINK | PAYLOAD_RELEASE | AIRSPACE_DEVIATION | GROUND_DAMAGE"
      - name: narrative
        type: string
        source: input
        description: "Free-text description"
      - name: status
        type: enum
        source: system
        description: "Review lifecycle; forks at the review outcome"
        default: OPEN
        constraints: "OPEN | UNDER_REVIEW | MAINTENANCE_REQUIRED | CLOSED"

  - name: MaintenanceLog
    parent: Drone
    common_fields: true
    fields:
      - name: drone_id
        type: string
        source: input
        description: "FK -> Drone.id; the airframe under maintenance"
      - name: incident_id
        type: string
        source: system
        description: "FK -> Incident.id; the incident that mandated this work, null for routine work"
        default: null
      - name: work_type
        type: enum
        source: input
        description: "Kind of work performed"
        constraints: "INSPECTION | REPAIR | BATTERY_SWAP | OVERHAUL"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Start of the maintenance window, inclusive"
      - name: scheduled_end
        type: datetime
        source: input
        description: "End of the maintenance window, exclusive"
      - name: status
        type: enum
        source: system
        description: "Work-order lifecycle"
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED"
      - name: completed_at
        type: datetime
        source: system
        description: "Logical clock at completion; null while SCHEDULED"
        default: null
      - name: notes
        type: string
        source: input
        description: "Technician notes"
        default: ""

# ============================ §1.2 State Machines ============================
state_machines:
  - entity: Order
    initial_state: QUOTED
    terminal_states: [DELIVERED, CANCELLED]
    shape: cyclic
    transitions:
      - from: QUOTED
        to: ASSIGNED
        trigger: "POST /orders/{id}/dispatch"
        actor: DispatchOperator
        preconditions:
          - "Order.status == QUOTED"
          - "expected_order_version == Order.version"
          - "ServiceArea.status == ACTIVE for Order.service_area_id"
          - "Nest.status == OPEN and Nest.service_area_id == Order.service_area_id"
          - "pad-hold capacity at the nest is not saturated (see validations priority 20)"
          - "the drone selector (calculations.dispatch_drone_selection) returns a non-empty candidate set"
        side_effects:
          - "creates Flight with ops_state=PLANNED, clearance_state=UNFILED, order_id, drone_id (selector winner), launch_nest_id = recovery_nest_id = the requested nest, battery_id = drone.installed_battery_id"
          - "computes Flight.planned_route_km, Flight.wind_kph_at_dispatch, Flight.required_energy_pct (calculations.flight_energy_requirement, provisional variant), Flight.eta_recovery_at, Flight.pad_hold_start, Flight.pad_hold_end"
          - "Drone.status IDLE -> RESERVED; increments Drone.version by 1"
          - "Nest.reserved_pads += 1"
          - "Customer.held_total += Order.order_total"
          - "increments Order.version by 1"
      - from: ASSIGNED
        to: IN_TRANSIT
        trigger: "POST /flights/{id}/launch (bubble-up from the flight)"
        actor: DispatchOperator
        preconditions:
          - "the order's Flight passes every launch precondition"
        side_effects:
          - "Order.status ASSIGNED -> IN_TRANSIT; increments Order.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /flights/{id}/drop (bubble-up from the flight)"
        actor: DispatchOperator
        preconditions:
          - "Flight.ops_state == DROPPING"
        side_effects:
          - "Order.status IN_TRANSIT -> DELIVERED; increments Order.version by 1"
          - "Customer.held_total -= Order.order_total"
          - "Customer.billed_total += Order.order_total"
      - from: ASSIGNED
        to: QUOTED
        trigger: "POST /flights/{id}/abort, or the grounding cascade from POST /incidents/{id}/outcome"
        actor: DispatchOperator | FlightDirector | system
        preconditions:
          - "the order's Flight moves to ABORTED"
          - "Order.status == ASSIGNED"
        side_effects:
          - "Order.status ASSIGNED -> QUOTED (re-dispatchable); increments Order.version by 1"
          - "Customer.held_total -= Order.order_total (compensates the dispatch hold exactly)"
        note: "Cyclic edge: an order may be dispatched, aborted, and dispatched again any number of times."
      - from: IN_TRANSIT
        to: QUOTED
        trigger: "POST /flights/{id}/abort, or the grounding cascade from POST /incidents/{id}/outcome"
        actor: DispatchOperator | FlightDirector | system
        preconditions:
          - "the order's Flight moves to ABORTED from LAUNCHED or DROPPING"
          - "Order.status == IN_TRANSIT"
        side_effects:
          - "Order.status IN_TRANSIT -> QUOTED; increments Order.version by 1"
          - "Customer.held_total -= Order.order_total"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: Customer | DispatchOperator
        preconditions:
          - "Order.status == QUOTED"
          - "acting Customer's X-User-ID == Order.customer_id when the actor is a Customer"
        side_effects:
          - "Order.status QUOTED -> CANCELLED; increments Order.version by 1"
        note: "An order that is ASSIGNED or IN_TRANSIT must be aborted at the flight level first; cancel from those states is ERR_ORDER_NOT_CANCELLABLE."

  - entity: Flight
    initial_state: PLANNED
    terminal_states: [RECOVERED, ABORTED]
    shape: parallel
    dimension: ops_state
    note: "Flight carries two independent dimensions on the same row. ops_state (below) is physical; clearance_state (next machine) is regulatory. Launch is the single point where the two dimensions are jointly gated."
    transitions:
      - from: PLANNED
        to: LAUNCHED
        trigger: "POST /flights/{id}/launch"
        actor: DispatchOperator
        preconditions:
          - "Flight.ops_state == PLANNED"
          - "Flight.clearance_state == CLEARED"
          - "ServiceArea.status == ACTIVE"
          - "the latest WeatherObservation for the order's service area has flyable == true (no observation at all counts as flyable)"
          - "no ACTIVE GeofenceZone in the service area intersects the route during the flight window (calculations.geofence_route_intersection)"
          - "Drone.status == RESERVED (a GROUNDED drone fails with ERR_DRONE_GROUNDED)"
          - "the flight's AirspaceAuthorization.status == APPROVED"
          - "window_start <= now < window_end on that authorization (half-open)"
          - "Battery.charge_pct >= Flight.required_energy_pct (inclusive)"
          - "Battery.state == READY"
        side_effects:
          - "Flight.ops_state PLANNED -> LAUNCHED; Flight.version += 1"
          - "Drone.status RESERVED -> IN_FLIGHT; Drone.version += 1"
          - "Battery.state READY -> IN_USE; Battery.version += 1"
          - "Order.status ASSIGNED -> IN_TRANSIT (bubble-up); Order.version += 1"
      - from: LAUNCHED
        to: DROPPING
        trigger: "POST /flights/{id}/arrive"
        actor: DispatchOperator
        preconditions:
          - "Flight.ops_state == LAUNCHED"
        side_effects:
          - "Flight.ops_state LAUNCHED -> DROPPING; Flight.version += 1"
      - from: DROPPING
        to: RETURNING
        trigger: "POST /flights/{id}/drop"
        actor: DispatchOperator
        preconditions:
          - "Flight.ops_state == DROPPING"
        side_effects:
          - "creates DeliveryDrop with drop_lat/drop_lon copied from the Order, confirmed_by_user_id = X-User-ID"
          - "Flight.ops_state DROPPING -> RETURNING; Flight.version += 1"
          - "Order.status IN_TRANSIT -> DELIVERED (bubble-up); Order.version += 1"
          - "Customer.held_total -= Order.order_total and Customer.billed_total += Order.order_total"
      - from: RETURNING
        to: RECOVERED
        trigger: "POST /flights/{id}/recover"
        actor: DispatchOperator
        preconditions:
          - "Flight.ops_state == RETURNING"
        side_effects:
          - "Flight.actual_route_km = the reported value; Flight.actual_energy_pct = calculations.flight_energy_requirement (actual variant); Flight.ops_state -> RECOVERED; Flight.version += 1"
          - "CASCADE hop 1: Battery.state IN_USE -> COOLDOWN, Battery.cycle_count += 1, Battery.charge_pct = max(0, round(Battery.charge_pct - Flight.actual_energy_pct, 1)); Battery.version += 1"
          - "CASCADE hop 2 (caused by hop 1's cycle_count increment): if Battery.cycle_count >= 300 then Battery.state COOLDOWN -> RETIRED"
          - "CASCADE hop 3 (caused by hop 2's retirement): Drone.installed_battery_id = null and Drone.status IN_FLIGHT -> GROUNDED; otherwise Drone.status IN_FLIGHT -> IDLE. Drone.flight_hours += round(Flight.actual_route_km / Drone.cruise_speed_kmh, 2) and Drone.hours_since_service += the same amount; Drone.version += 1"
          - "CASCADE hop 4 (caused by hop 3's grounding): creates MaintenanceLog(work_type=BATTERY_SWAP, status=SCHEDULED, incident_id=null, scheduled_start=now, scheduled_end=now + 60 minutes)"
          - "Nest.reserved_pads -= 1 on the recovery nest"
      - from: PLANNED
        to: ABORTED
        trigger: "POST /flights/{id}/abort, or the grounding cascade"
        actor: DispatchOperator | FlightDirector | system
        preconditions:
          - "Flight.ops_state == PLANNED"
        side_effects:
          - "Flight.ops_state -> ABORTED, Flight.abort_reason set; Flight.version += 1"
          - "Flight.clearance_state -> REVOKED when it is FILED or CLEARED (no-op when UNFILED)"
          - "the flight's AirspaceAuthorization, when status IN {PENDING, APPROVED}, -> REVOKED"
          - "Drone.status RESERVED -> IDLE (only when the drone is not being GROUNDED by the same cascade); Drone.version += 1"
          - "Battery is untouched (it never left READY)"
          - "Nest.reserved_pads -= 1 on the recovery nest"
          - "Order.status ASSIGNED -> QUOTED; Customer.held_total -= Order.order_total; Order.version += 1"
      - from: LAUNCHED
        to: ABORTED
        trigger: "POST /flights/{id}/abort, or the grounding cascade"
        actor: DispatchOperator | FlightDirector | system
        preconditions:
          - "Flight.ops_state == LAUNCHED"
        side_effects:
          - "Flight.actual_route_km = the reported value (0.0 for a system-triggered abort); Flight.actual_energy_pct = calculations.flight_energy_requirement (actual variant); Flight.ops_state -> ABORTED; Flight.clearance_state CLEARED -> REVOKED; Flight.version += 1"
          - "the flight's AirspaceAuthorization, when status IN {PENDING, APPROVED}, -> REVOKED"
          - "Battery.state IN_USE -> COOLDOWN, cycle_count += 1, charge_pct = max(0, round(charge_pct - actual_energy_pct, 1)); retirement at cycle_count >= 300 applies exactly as on recovery"
          - "Drone.status IN_FLIGHT -> IDLE (or GROUNDED when the battery retired or when the cascade is grounding this drone); Drone.flight_hours and Drone.hours_since_service += round(actual_route_km / cruise_speed_kmh, 2); Drone.version += 1"
          - "Nest.reserved_pads -= 1"
          - "Order.status IN_TRANSIT -> QUOTED; Customer.held_total -= Order.order_total; Order.version += 1"
      - from: DROPPING
        to: ABORTED
        trigger: "POST /flights/{id}/abort, or the grounding cascade"
        actor: DispatchOperator | FlightDirector | system
        preconditions:
          - "Flight.ops_state == DROPPING"
        side_effects:
          - "identical to the LAUNCHED -> ABORTED side-effect set (the payload was never released, so Order.status IN_TRANSIT -> QUOTED and the hold is released)"
      - from: RETURNING
        to: ABORTED
        trigger: "POST /flights/{id}/abort, or the grounding cascade"
        actor: DispatchOperator | FlightDirector | system
        preconditions:
          - "Flight.ops_state == RETURNING"
        side_effects:
          - "same battery / drone / nest side effects as the LAUNCHED -> ABORTED edge"
          - "CONDITIONAL CASCADE: the Order is already DELIVERED (terminal), so its status, Customer.held_total and Customer.billed_total are left untouched"

  - entity: Flight
    initial_state: UNFILED
    terminal_states: [REVOKED]
    shape: parallel
    dimension: clearance_state
    note: "Second, independent dimension on the same Flight row. It advances only via authorization actions and is never advanced by ops_state transitions, except that an abort revokes it."
    transitions:
      - from: UNFILED
        to: FILED
        trigger: "POST /flights/{id}/file-authorization"
        actor: DispatchOperator
        preconditions:
          - "Flight.ops_state == PLANNED"
          - "Flight.clearance_state == UNFILED"
        side_effects:
          - "creates AirspaceAuthorization(status=PENDING) for this flight"
          - "Flight.clearance_state UNFILED -> FILED; Flight.filed_by_user_id = X-User-ID; Flight.version += 1"
      - from: FILED
        to: CLEARED
        trigger: "POST /flights/{id}/release"
        actor: FlightDirector
        preconditions:
          - "Flight.clearance_state == FILED"
          - "Flight.ops_state == PLANNED"
          - "the flight's AirspaceAuthorization.status == APPROVED"
          - "X-User-ID != Flight.filed_by_user_id (segregation of duties)"
          - "Drone.blocking_risk_score < 70"
        side_effects:
          - "Flight.clearance_state FILED -> CLEARED; Flight.released_by_user_id = X-User-ID; Flight.version += 1"
      - from: FILED
        to: REVOKED
        trigger: "POST /flights/{id}/abort, or the grounding cascade"
        actor: DispatchOperator | FlightDirector | system
        preconditions:
          - "the flight moves to ops_state ABORTED"
        side_effects:
          - "Flight.clearance_state -> REVOKED; the AirspaceAuthorization -> REVOKED"
      - from: CLEARED
        to: REVOKED
        trigger: "POST /flights/{id}/abort, or the grounding cascade"
        actor: DispatchOperator | FlightDirector | system
        preconditions:
          - "the flight moves to ops_state ABORTED"
        side_effects:
          - "Flight.clearance_state -> REVOKED; the AirspaceAuthorization -> REVOKED"

  - entity: AirspaceAuthorization
    initial_state: PENDING
    terminal_states: [DENIED, REVOKED]
    shape: branching
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /_laanc/decision with outcome=APPROVED"
        actor: PlatformAdmin
        preconditions:
          - "AirspaceAuthorization.status == PENDING"
        side_effects:
          - "status -> APPROVED; auth_code minted as 'LAANC-' + the authorization's created_at compacted to YYYYMMDDHHMMSS; version += 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /_laanc/decision with outcome=DENIED"
        actor: PlatformAdmin
        preconditions:
          - "AirspaceAuthorization.status == PENDING"
        side_effects:
          - "status -> DENIED; auth_code stays null; version += 1"
          - "Flight.clearance_state stays FILED, so POST /flights/{id}/release fails with ERR_AUTHORIZATION_NOT_APPROVED"
      - from: APPROVED
        to: REVOKED
        trigger: "flight abort (any source)"
        actor: system
        preconditions:
          - "the parent Flight moves to ops_state ABORTED"
        side_effects:
          - "status -> REVOKED; version += 1"
      - from: PENDING
        to: REVOKED
        trigger: "flight abort (any source)"
        actor: system
        preconditions:
          - "the parent Flight moves to ops_state ABORTED"
        side_effects:
          - "status -> REVOKED; version += 1"

  - entity: Drone
    initial_state: IDLE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: IDLE
        to: RESERVED
        trigger: "POST /orders/{id}/dispatch (selector winner)"
        actor: DispatchOperator
        preconditions:
          - "Drone.status == IDLE and the drone satisfies every eligibility predicate of calculations.dispatch_drone_selection"
        side_effects:
          - "Drone.status -> RESERVED; version += 1"
      - from: RESERVED
        to: IN_FLIGHT
        trigger: "POST /flights/{id}/launch"
        actor: DispatchOperator
        preconditions:
          - "Drone.status == RESERVED"
        side_effects:
          - "Drone.status -> IN_FLIGHT; version += 1"
      - from: IN_FLIGHT
        to: IDLE
        trigger: "POST /flights/{id}/recover or POST /flights/{id}/abort"
        actor: DispatchOperator | FlightDirector | system
        preconditions:
          - "the flight reaches RECOVERED or ABORTED and the installed battery did not retire on this hop"
        side_effects:
          - "Drone.status -> IDLE; flight_hours and hours_since_service incremented; version += 1"
        note: "Cyclic edge closing IDLE -> RESERVED -> IN_FLIGHT -> IDLE; the same airframe can fly unlimited sorties."
      - from: RESERVED
        to: IDLE
        trigger: "POST /flights/{id}/abort on a PLANNED flight"
        actor: DispatchOperator | FlightDirector
        preconditions:
          - "Drone.status == RESERVED and the flight was still PLANNED"
        side_effects:
          - "Drone.status -> IDLE; version += 1"
      - from: IN_FLIGHT
        to: GROUNDED
        trigger: "battery retirement on POST /flights/{id}/recover or /abort"
        actor: system
        preconditions:
          - "the installed Battery reached cycle_count >= 300 and moved to RETIRED on this hop"
        side_effects:
          - "Drone.installed_battery_id = null; Drone.status -> GROUNDED; version += 1"
          - "creates MaintenanceLog(work_type=BATTERY_SWAP, status=SCHEDULED)"
      - from: IDLE
        to: GROUNDED
        trigger: "POST /incidents/{id}/outcome with outcome=MAINTENANCE_REQUIRED"
        actor: MaintenanceTech
        preconditions:
          - "the Incident names this drone and moves to MAINTENANCE_REQUIRED"
        side_effects:
          - "Drone.status -> GROUNDED; version += 1"
      - from: RESERVED
        to: GROUNDED
        trigger: "POST /incidents/{id}/outcome with outcome=MAINTENANCE_REQUIRED"
        actor: MaintenanceTech
        preconditions:
          - "the Incident names this drone and moves to MAINTENANCE_REQUIRED"
        side_effects:
          - "Drone.status -> GROUNDED; version += 1"
          - "every non-terminal Flight of this drone is force-ABORTED (grounding cascade)"
      - from: IN_FLIGHT
        to: GROUNDED
        trigger: "POST /incidents/{id}/outcome with outcome=MAINTENANCE_REQUIRED"
        actor: MaintenanceTech
        preconditions:
          - "the Incident names this drone and moves to MAINTENANCE_REQUIRED"
        side_effects:
          - "Drone.status -> GROUNDED; version += 1"
          - "every non-terminal Flight of this drone is force-ABORTED (grounding cascade)"
      - from: GROUNDED
        to: IDLE
        trigger: "POST /maintenance-logs/{id}/complete"
        actor: MaintenanceTech
        preconditions:
          - "MaintenanceLog.status == SCHEDULED"
          - "Drone.installed_battery_id != null AND that Battery.state == READY (else ERR_BATTERY_NOT_READY)"
        side_effects:
          - "Drone.hours_since_service = 0; Drone.status GROUNDED -> IDLE; version += 1"
          - "the linked Incident, when status == MAINTENANCE_REQUIRED, -> CLOSED (bubble-up)"

  - entity: Battery
    initial_state: CHARGING
    terminal_states: [RETIRED]
    shape: cyclic
    transitions:
      - from: CHARGING
        to: READY
        trigger: "POST /batteries/{id}/charge"
        actor: MaintenanceTech
        preconditions:
          - "Battery.state IN {CHARGING, COOLDOWN, READY}"
        side_effects:
          - "Battery.charge_pct = target_charge_pct; state -> READY; version += 1"
      - from: COOLDOWN
        to: READY
        trigger: "POST /batteries/{id}/charge"
        actor: MaintenanceTech
        preconditions:
          - "Battery.state IN {CHARGING, COOLDOWN, READY}"
        side_effects:
          - "Battery.charge_pct = target_charge_pct; state -> READY; version += 1"
        note: "Cyclic edge closing READY -> IN_USE -> COOLDOWN -> READY."
      - from: READY
        to: IN_USE
        trigger: "POST /flights/{id}/launch"
        actor: DispatchOperator
        preconditions:
          - "Battery.state == READY and charge_pct >= Flight.required_energy_pct"
        side_effects:
          - "Battery.state -> IN_USE; version += 1"
      - from: IN_USE
        to: COOLDOWN
        trigger: "POST /flights/{id}/recover or a post-launch POST /flights/{id}/abort"
        actor: DispatchOperator | FlightDirector | system
        preconditions:
          - "Battery.state == IN_USE"
        side_effects:
          - "cycle_count += 1; charge_pct = max(0, round(charge_pct - Flight.actual_energy_pct, 1)); state -> COOLDOWN; health_pct recomputed; version += 1"
      - from: COOLDOWN
        to: RETIRED
        trigger: "same hop as IN_USE -> COOLDOWN, when the incremented cycle_count crosses the retirement threshold"
        actor: system
        preconditions:
          - "cycle_count >= 300 after the increment"
        side_effects:
          - "state -> RETIRED; the owning Drone is un-linked and GROUNDED, and a BATTERY_SWAP MaintenanceLog is scheduled"

  - entity: Incident
    initial_state: OPEN
    terminal_states: [CLOSED]
    shape: branching
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /incidents/{id}/review"
        actor: MaintenanceTech
        preconditions:
          - "Incident.status == OPEN"
        side_effects:
          - "Incident.status -> UNDER_REVIEW; version += 1"
          - "Drone.blocking_risk_score is unchanged (OPEN and UNDER_REVIEW both count), Drone.advisory_risk_score is unchanged (neither counts)"
      - from: UNDER_REVIEW
        to: CLOSED
        trigger: "POST /incidents/{id}/outcome with outcome=NO_ACTION"
        actor: MaintenanceTech
        preconditions:
          - "Incident.status == UNDER_REVIEW"
        side_effects:
          - "Incident.status -> CLOSED; version += 1"
          - "Drone is NOT grounded; no MaintenanceLog is created"
          - "Drone.advisory_risk_score now counts this incident's severity points (it did not before); Drone.blocking_risk_score is unchanged"
        note: "Branch A of the fork. Divergent from branch B in both side-effect set and downstream states."
      - from: UNDER_REVIEW
        to: MAINTENANCE_REQUIRED
        trigger: "POST /incidents/{id}/outcome with outcome=MAINTENANCE_REQUIRED"
        actor: MaintenanceTech
        preconditions:
          - "Incident.status == UNDER_REVIEW"
        side_effects:
          - "GROUNDING CASCADE hop 1: Incident.status -> MAINTENANCE_REQUIRED; version += 1"
          - "GROUNDING CASCADE hop 2 (caused by hop 1): the named Drone -> GROUNDED from whatever state it is in; Drone.version += 1"
          - "GROUNDING CASCADE hop 3 (caused by hop 2's grounding): every Flight of that drone with ops_state IN {PLANNED, LAUNCHED, DROPPING, RETURNING} -> ABORTED with abort_reason=DRONE_GROUNDED and actual_route_km=0.0"
          - "GROUNDING CASCADE hop 4 (caused by hop 3's abort): each aborted flight's clearance_state -> REVOKED and its AirspaceAuthorization -> REVOKED; its recovery Nest.reserved_pads -= 1; its Order, when status IN {ASSIGNED, IN_TRANSIT}, -> QUOTED with Customer.held_total -= Order.order_total; its Battery, when IN_USE, -> COOLDOWN with cycle_count += 1"
          - "creates MaintenanceLog(work_type=REPAIR, status=SCHEDULED, incident_id=this incident, scheduled_start=now, scheduled_end=now + 120 minutes)"
        note: "Branch B of the fork."
      - from: MAINTENANCE_REQUIRED
        to: CLOSED
        trigger: "POST /maintenance-logs/{id}/complete on the linked log"
        actor: MaintenanceTech
        preconditions:
          - "MaintenanceLog.incident_id == this incident and the log completes"
        side_effects:
          - "Incident.status -> CLOSED; version += 1"
          - "the incident's severity points move from the blocking-only bucket into the advisory bucket as well"

  - entity: MaintenanceLog
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    shape: linear
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /maintenance-logs/{id}/complete"
        actor: MaintenanceTech
        preconditions:
          - "MaintenanceLog.status == SCHEDULED"
          - "the Drone has an installed Battery whose state == READY"
        side_effects:
          - "status -> COMPLETED; completed_at = now; version += 1"
          - "Drone.hours_since_service = 0; Drone.status GROUNDED -> IDLE; Drone.version += 1"
          - "the linked Incident, when MAINTENANCE_REQUIRED, -> CLOSED"

# ========================== §1.2.1 Concurrency Rules ==========================
concurrency_rules:
  - rule_id: dispatch-stale-order
    parent_entity: Order
    write_endpoint: "POST /orders/{id}/dispatch"
    occ_field: "expected_order_version"
    description: |
      Dispatching an Order whose version has advanced since the client last observed it is
      rejected. A prior dispatch legitimately supersedes the client's view: it creates a Flight,
      reserves a pad and moves the order to ASSIGNED, all of which bump Order.version. An abort
      then returns the order to QUOTED and bumps the version again, so a client holding the
      pre-abort version number would otherwise re-dispatch against a stale plan.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
  - rule_id: maintenance-schedule-stale-drone
    parent_entity: Drone
    write_endpoint: "POST /maintenance-logs"
    occ_field: "expected_drone_version"
    description: |
      Scheduling a MaintenanceLog against a Drone whose version has advanced since the client
      last observed it is rejected. The grounding cascade, a battery retirement and every
      dispatch/launch/recovery hop all bump Drone.version, so a technician who read the drone
      before one of those cascades would otherwise schedule a window against an airframe whose
      state has changed underneath them.
    error_id: ERR_STALE_DRONE_VERSION
    http_status: 412

# ============================= §1.3 Calculations =============================
calculations:
  - name: planar_distance_km
    trigger: "shared helper invoked by order_geometry, flight_energy_requirement, geofence_route_intersection"
    algorithm: aggregation
    formula: |
      planar_distance_km(lat_a, lon_a, lat_b, lon_b):
        dy = (lat_b - lat_a) * KM_PER_DEG_LAT
        dx = (lon_b - lon_a) * KM_PER_DEG_LON
        return round(sqrt(dy*dy + dx*dx), 3)   # round_half_up, 3 decimals
    input_set: "Two coordinate pairs. No great-circle correction is applied; the flat-earth constants below are normative."
    constants:
      KM_PER_DEG_LAT: 111.0
      KM_PER_DEG_LON: 85.0
    precision: "3 decimal places, round_half_up"

  - name: order_geometry
    trigger: "POST /orders"
    algorithm: threshold
    formula: |
      Order.dropoff_lat = Customer.dropoff_lat        # frozen copy
      Order.dropoff_lon = Customer.dropoff_lon
      Order.distance_km = planar_distance_km(ServiceArea.center_lat, ServiceArea.center_lon,
                                             Order.dropoff_lat, Order.dropoff_lon)
      REJECT with ERR_OUT_OF_SERVICE_RANGE when Order.distance_km > ServiceArea.max_range_km
      # distance_km EXACTLY equal to max_range_km is accepted (inclusive boundary)
    input_set: "The ServiceArea named in the request and the Customer named in the request."
    precision: "3 decimal places, round_half_up"

  - name: order_fee_components
    trigger: "POST /orders (immediately after order_geometry passes)"
    algorithm: tiered_pricing
    formula: |
      # Step 1 - base component, selected by ONE-WAY distance tier (inclusive upper bounds):
      if   Order.distance_km <= TIER1_MAX_KM: base = TIER1_BASE
      elif Order.distance_km <= TIER2_MAX_KM: base = TIER2_BASE
      else:                                   base = TIER3_BASE
      # Step 2 - payload component:
      payload = (Order.payload_weight_g / 1000.0) * PAYLOAD_RATE_PER_KG
      # Step 3 - PINNED ROUNDING ORDER: round EACH component to 2 dp FIRST, then sum,
      #          then apply the priority multiplier, then round the product to 2 dp.
      #          "sum then round once" is explicitly NOT the rule and yields different cents.
      subtotal = round(base, 2) + round(payload, 2)
      mult = PRIORITY_MULT[Order.priority]
      Order.delivery_fee = round(subtotal * mult, 2)
    input_set: "Only the order under construction; no other orders participate."
    constants:
      TIER1_MAX_KM: 5.0
      TIER1_BASE: 4.00
      TIER2_MAX_KM: 12.0
      TIER2_BASE: 6.50
      TIER3_BASE: 9.00
      PAYLOAD_RATE_PER_KG: 0.90
      PRIORITY_MULT: { STANDARD: 1.0, URGENT: 1.35, MEDICAL: 1.60 }
    precision: "2 decimal places, round_half_up, applied at each pinned rounding step"

  - name: order_billing_total
    trigger: "POST /orders (immediately after order_fee_components)"
    algorithm: threshold
    formula: |
      # PINNED EVALUATION ORDER. The surcharge tier is keyed on delivery_fee (the PRE-surcharge
      # value), never on order_total, even though order_total is what the customer pays. This
      # dependency looks circular (total = fee + surcharge, surcharge = pct(tier) * fee) and is
      # resolved by fixing the tier lookup on delivery_fee.
      if   Order.delivery_fee <= SURCHARGE_TIER1_MAX: pct = SURCHARGE_PCT_LOW
      elif Order.delivery_fee <= SURCHARGE_TIER2_MAX: pct = SURCHARGE_PCT_MID
      else:                                           pct = SURCHARGE_PCT_HIGH
      Order.airspace_surcharge = round(pct * Order.delivery_fee, 2)
      Order.order_total        = round(Order.delivery_fee + Order.airspace_surcharge, 2)
    input_set: "Only the order under construction."
    constants:
      SURCHARGE_TIER1_MAX: 8.00
      SURCHARGE_TIER2_MAX: 15.00
      SURCHARGE_PCT_LOW: 0.05
      SURCHARGE_PCT_MID: 0.08
      SURCHARGE_PCT_HIGH: 0.12
    precision: "2 decimal places, round_half_up"

  - name: flight_energy_requirement
    trigger: "POST /orders/{id}/dispatch (provisional variant, writes Flight.required_energy_pct); POST /flights/{id}/recover and post-launch POST /flights/{id}/abort (actual variant, writes Flight.actual_energy_pct)"
    algorithm: forward_looking
    formula: |
      # Shared core. Non-linear in three inputs (route, payload, wind) with a clamped wind term.
      payload_factor = 1 + (Order.payload_weight_g / 1000.0) * PAYLOAD_ENERGY_FACTOR
      wind_factor    = 1 + max(0, wind_kph - WIND_FREE_KPH) * WIND_PENALTY_PER_KPH
      core(route_km) = route_km * ENERGY_PCT_PER_KM * payload_factor * wind_factor

      # PROVISIONAL variant (dispatch):
      Flight.planned_route_km   = 2 * planar_distance_km(Nest.lat, Nest.lon, Order.dropoff_lat, Order.dropoff_lon)
      Flight.wind_kph_at_dispatch = wind_kph            # frozen, see input_set
      Flight.required_energy_pct = round(core(Flight.planned_route_km) + HOVER_PCT + RESERVE_PCT, 1)

      # ACTUAL variant (recovery / post-launch abort):
      Flight.actual_energy_pct = round(core(Flight.actual_route_km) + HOVER_PCT, 1)
      # RESERVE_PCT is a planning margin that is NOT consumed, so it is absent from the actual
      # variant. Feeding actual_route_km == planned_route_km into both variants therefore still
      # yields two different numbers (they differ by exactly RESERVE_PCT before rounding).
    input_set: |
      wind_kph is frozen ONCE at dispatch, from the WeatherObservation of Order.service_area_id with
      the greatest observed_at (tie-break: greatest created_at; still tied: no further tie possible
      because created_at carries millisecond precision). When the service area has zero observations,
      wind_kph = 0. The actual variant reuses Flight.wind_kph_at_dispatch and Order.payload_weight_g;
      it never re-reads the weather feed.
    constants:
      ENERGY_PCT_PER_KM: 1.6
      PAYLOAD_ENERGY_FACTOR: 0.08
      WIND_FREE_KPH: 10.0
      WIND_PENALTY_PER_KPH: 0.02
      HOVER_PCT: 3.0
      RESERVE_PCT: 15.0
    precision: "1 decimal place, round_half_up; a single rounding at the end of each variant"
    variants:
      - name: provisional
        when: "dispatch, to size the battery requirement and gate launch"
        difference: "uses planned_route_km and adds RESERVE_PCT (15.0) on top of hover"
      - name: actual
        when: "recovery or post-launch abort, to debit the pack"
        difference: "uses the reported actual_route_km and omits RESERVE_PCT entirely"

  - name: drone_airworthiness_risk
    trigger: "recomputed on every read of a Drone and on every dispatch-eligibility evaluation and every POST /flights/{id}/release"
    algorithm: weighted_scoring
    formula: |
      service_term = SERVICE_WEIGHT * min(1.0, Drone.hours_since_service / SERVICE_INTERVAL_H)
      if Drone.installed_battery_id is null:
        cycle_term = CYCLE_WEIGHT           # no pack installed = worst case
      else:
        cycle_term = CYCLE_WEIGHT * min(1.0, Battery.cycle_count / RETIRE_CYCLES)
      severity_points(bucket) = min(SEVERITY_CAP, sum over Incidents with drone_id == Drone.id
                                    and status IN bucket of SEVERITY_POINTS[severity])
      Drone.advisory_risk_score = round(service_term + cycle_term + severity_points({CLOSED}), 1)
      Drone.blocking_risk_score = round(service_term + cycle_term
                                        + severity_points({OPEN, UNDER_REVIEW, MAINTENANCE_REQUIRED, CLOSED}), 1)
      # Gate: blocking_risk_score >= RISK_BLOCK_THRESHOLD removes the drone from the dispatch
      # candidate set AND rejects POST /flights/{id}/release with ERR_DRONE_RISK_TOO_HIGH.
      # advisory_risk_score gates nothing; it exists so the same inputs yield two published numbers.
    input_set: "Battery = the pack referenced by Drone.installed_battery_id. Incidents are filtered by status bucket per variant; no time window applies (lifetime)."
    constants:
      SERVICE_WEIGHT: 40.0
      SERVICE_INTERVAL_H: 50.0
      CYCLE_WEIGHT: 30.0
      RETIRE_CYCLES: 300
      SEVERITY_POINTS: { MINOR: 5, MAJOR: 15, CRITICAL: 30 }
      SEVERITY_CAP: 30
      RISK_BLOCK_THRESHOLD: 70.0
    precision: "1 decimal place, round_half_up"
    variants:
      - name: advisory
        when: "published on every Drone read; dashboards only"
        difference: "severity bucket = {CLOSED} only"
      - name: blocking
        when: "dispatch eligibility and flight release"
        difference: "severity bucket = {OPEN, UNDER_REVIEW, MAINTENANCE_REQUIRED, CLOSED}; strictly >= advisory on identical data"

  - name: weather_flyability
    trigger: "on WeatherObservation creation (writes flyable) and on POST /flights/{id}/launch"
    algorithm: threshold
    formula: |
      flyable = (wind_kph <= MAX_WIND_KPH) and (gust_kph <= MAX_GUST_KPH)
                and (visibility_km >= MIN_VISIBILITY_KM) and (precip in {NONE, LIGHT})
      # Launch reads the LATEST observation of the flight's service area by observed_at DESC,
      # tie-break created_at DESC. Zero observations => treated as flyable.
    input_set: "WeatherObservations of Order.service_area_id; only the single latest row is consulted at launch."
    constants:
      MAX_WIND_KPH: 35.0
      MAX_GUST_KPH: 45.0
      MIN_VISIBILITY_KM: 1.5
    precision: "exact comparison; boundary values 35.0 / 45.0 / 1.5 are all flyable"

  - name: geofence_route_intersection
    trigger: "POST /flights/{id}/launch"
    algorithm: interval_merge
    formula: |
      route_points = [ (Nest.lat, Nest.lon),
                       ( (Nest.lat + Order.dropoff_lat)/2, (Nest.lon + Order.dropoff_lon)/2 ),   # midpoint
                       (Order.dropoff_lat, Order.dropoff_lon) ]
      for zone in GeofenceZones where zone.service_area_id == Order.service_area_id
                                  and zone.status == ACTIVE
                                  and zone.effective_from <= now < zone.effective_to:   # half-open
          for p in route_points:
              if planar_distance_km(zone.center_lat, zone.center_lon, p.lat, p.lon) <= zone.radius_km:
                  REJECT with ERR_GEOFENCE_VIOLATION      # distance EXACTLY == radius_km violates
    input_set: "ACTIVE zones of the order's service area whose half-open effective window contains the logical clock at launch time. LIFTED zones and zones of other areas are ignored."
    precision: "distances at 3 decimals; radius comparison is inclusive (<=)"

  - name: nest_pad_capacity_check
    trigger: "POST /orders/{id}/dispatch"
    algorithm: interval_merge
    formula: |
      # CLOSED-interval, buffered, AGGREGATE-CAPACITY semantics.
      candidate_hold = [ eta_recovery_at - PAD_BUFFER_MIN , eta_recovery_at + PAD_HOLD_MIN ]
      where eta_recovery_at = clock_now + ceil(planned_route_km / Drone.cruise_speed_kmh * 60) + HOVER_MIN  (minutes)
      existing = Flights with recovery_nest_id == nest.id and ops_state IN {PLANNED, LAUNCHED, DROPPING, RETURNING}
      overlapping = count of existing whose CLOSED [pad_hold_start, pad_hold_end] intersects the
                    candidate CLOSED hold. Touching endpoints DO intersect (a hold ending exactly
                    when another begins collides).
      REJECT with ERR_NEST_PADS_FULL when overlapping >= Nest.pad_count
      # i.e. the nest tolerates up to pad_count-1 concurrent holds beside the newcomer.
    input_set: "Non-terminal flights recovering at the requested nest. RECOVERED and ABORTED flights are excluded and free their slot immediately."
    constants:
      PAD_BUFFER_MIN: 5
      PAD_HOLD_MIN: 10
      HOVER_MIN: 3
    precision: "whole minutes; ceil on the cruise leg"

  - name: maintenance_window_conflict
    trigger: "POST /maintenance-logs"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN, zero-buffer, EXCLUSIVE (capacity 1) semantics — deliberately different geometry
      # from nest_pad_capacity_check.
      existing = MaintenanceLogs with drone_id == the requested drone and status == SCHEDULED
      conflict if any existing satisfies:
          new.scheduled_start < existing.scheduled_end AND existing.scheduled_start < new.scheduled_end
      # Half-open [start, end): a new window starting EXACTLY at an existing window's end does NOT
      # conflict (adjacency is legal); one starting one second earlier does.
      REJECT with ERR_MAINTENANCE_WINDOW_CONFLICT on any conflict (capacity 1: a single overlap is fatal)
    input_set: "SCHEDULED logs of the same drone only. COMPLETED logs never conflict."
    precision: "second resolution on ISO-8601 UTC timestamps"

  - name: dispatch_drone_selection
    trigger: "POST /orders/{id}/dispatch"
    algorithm: waterfall_allocation
    formula: |
      # (a) ELIGIBILITY FILTER — every predicate must hold:
      candidates = Drones d such that
          d.home_nest_id == the requested nest.id
        AND d.status == IDLE
        AND d.max_payload_g >= Order.payload_weight_g
        AND d.installed_battery_id != null
        AND Battery(d.installed_battery_id).state == READY
        AND Battery(d.installed_battery_id).charge_pct >= required_energy_pct(d)   # inclusive
        AND d.blocking_risk_score < 70.0                                           # strict
        AND no MaintenanceLog with drone_id == d.id and status == SCHEDULED whose
            half-open [scheduled_start, scheduled_end) overlaps the half-open flight window
            [clock_now, eta_recovery_at(d))
      # required_energy_pct(d) and eta_recovery_at(d) are per-candidate: the route is identical
      # for every candidate at this nest, but cruise_speed_kmh differs per airframe.

      # (b) RANKING (all keys over entity fields; no random field participates):
      ORDER BY Battery.charge_pct DESC,
               d.hours_since_service ASC,
               d.created_at ASC            # (c) TIE-BREAK: earliest-registered airframe wins
      # (d) EMPTY POOL: reject with ERR_NO_ELIGIBLE_DRONE (409). No queueing, no deferral.
    input_set: "Drones based at the requested nest only. Drones at other nests of the same service area are NOT candidates."
    constants:
      RISK_BLOCK_THRESHOLD: 70.0
    precision: "charge_pct at 1 decimal; hours_since_service at 2 decimals"

  - name: customer_funds_ledger
    trigger: "dispatch (hold), flight abort (release hold), drop (capture)"
    algorithm: aggregation
    formula: |
      # Conserved quantity #1 (money). These two equalities MUST hold after every request:
      Customer.held_total   == round(sum(o.order_total for o in Orders
                                         where o.customer_id == c.id
                                           and o.status IN {ASSIGNED, IN_TRANSIT}), 2)
      Customer.billed_total == round(sum(o.order_total for o in Orders
                                         where o.customer_id == c.id
                                           and o.status == DELIVERED), 2)
      # dispatch: held += order_total.  abort (order ASSIGNED|IN_TRANSIT): held -= order_total.
      # drop: held -= order_total; billed += order_total.
      # dispatch followed by its compensating abort therefore returns held_total to EXACTLY its
      # pre-dispatch value (zero drift), and leaves billed_total untouched.
    input_set: "All orders of the customer; CANCELLED and QUOTED orders contribute to neither total."
    precision: "2 decimal places, round_half_up"

  - name: nest_pad_ledger
    trigger: "dispatch (reserve), flight recover / abort (release)"
    algorithm: aggregation
    formula: |
      # Conserved quantity #2 (physical pad slots). MUST hold after every request:
      Nest.reserved_pads == count(Flights f where f.recovery_nest_id == nest.id
                                    and f.ops_state IN {PLANNED, LAUNCHED, DROPPING, RETURNING})
      # dispatch: reserved_pads += 1.  recover: -= 1.  abort (from any non-terminal ops_state): -= 1.
      # The grounding cascade aborts flights through the SAME edge, so a cascade that abandons a
      # live sortie must still decrement the pad ledger — a slot leaked here permanently shrinks
      # the nest's usable capacity and eventually starves dispatch with ERR_NEST_PADS_FULL.
    input_set: "Flights recovering at this nest; terminal flights (RECOVERED, ABORTED) never count."
    precision: "integer"

# ============================= §1.4 Validations ==============================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body / query shape: required fields present, types correct, enums in range, numeric constraints (payload_weight_g > 0, pad_count >= 1, requested_alt_ft in (0,400], limit in [1,100], offset >= 0) satisfied"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all
  - priority: 4
    category: existence
    check: "every path-parameter resource exists, validated left-to-right"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 5
    category: existence
    check: "every foreign key supplied in the body exists (customer_id, service_area_id, home_nest_id, nest_id, drone_id, battery_id)"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /orders, POST /nests, POST /drones, POST /batteries, POST /drones/{id}/install-battery, POST /incidents, POST /maintenance-logs, POST /geofence-zones, POST /weather-observations"
  - priority: 6
    category: auth
    check: "a Customer may only act on an Order whose customer_id equals the caller's X-User-ID"
    error_id: ERR_NOT_ORDER_OWNER
    http_status: 403
    applies_to: "POST /orders, POST /orders/{id}/cancel"
  - priority: 7
    category: business_constraint
    check: "tail_number is globally unique across drones"
    error_id: ERR_DUPLICATE_TAIL_NUMBER
    http_status: 409
    applies_to: "POST /drones"
  - priority: 8
    category: state
    check: "expected_order_version == Order.version / expected_drone_version == Drone.version (optimistic concurrency)"
    error_id: "ERR_STALE_ORDER_VERSION | ERR_STALE_DRONE_VERSION"
    http_status: 412
    applies_to: "POST /orders/{id}/dispatch, POST /maintenance-logs"
  - priority: 9
    category: state
    check: "the target resource is in the state the transition requires (Order QUOTED for dispatch; Order QUOTED for cancel; Flight ops_state PLANNED for file-authorization/release/launch; LAUNCHED for arrive; DROPPING for drop; RETURNING for recover; non-terminal for abort; Flight clearance_state FILED for release, CLEARED for launch; Authorization PENDING for a LAANC decision; Incident OPEN for review, UNDER_REVIEW for outcome; MaintenanceLog SCHEDULED for complete)"
    error_id: "ERR_ORDER_NOT_QUOTED | ERR_ORDER_NOT_CANCELLABLE | ERR_FLIGHT_NOT_PLANNED | ERR_FLIGHT_INVALID_STATE | ERR_FLIGHT_TERMINAL | ERR_FLIGHT_NOT_CLEARED | ERR_AUTHORIZATION_NOT_PENDING | ERR_INCIDENT_NOT_OPEN | ERR_INCIDENT_NOT_UNDER_REVIEW | ERR_MAINTENANCE_NOT_SCHEDULED"
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 10
    category: auth
    check: "segregation of duties: the FlightDirector releasing a flight must not be the user who filed its authorization (X-User-ID != Flight.filed_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /flights/{id}/release"
  - priority: 11
    category: business_safety
    check: "the ServiceArea of the order is ACTIVE"
    error_id: ERR_SERVICE_AREA_SUSPENDED
    http_status: 409
    applies_to: "POST /orders, POST /orders/{id}/dispatch, POST /flights/{id}/launch"
  - priority: 12
    category: business_safety
    check: "the latest WeatherObservation of the order's service area is flyable (no observation counts as flyable)"
    error_id: ERR_WEATHER_NO_GO
    http_status: 409
    applies_to: "POST /flights/{id}/launch"
  - priority: 13
    category: business_safety
    check: "no ACTIVE GeofenceZone whose half-open effective window contains now intersects the route (calculations.geofence_route_intersection)"
    error_id: ERR_GEOFENCE_VIOLATION
    http_status: 409
    applies_to: "POST /flights/{id}/launch"
  - priority: 14
    category: business_safety
    check: "the flight's Drone is not GROUNDED"
    error_id: ERR_DRONE_GROUNDED
    http_status: 409
    applies_to: "POST /flights/{id}/launch, POST /flights/{id}/release"
  - priority: 15
    category: business_safety
    check: "Drone.blocking_risk_score < 70.0 (strictly)"
    error_id: ERR_DRONE_RISK_TOO_HIGH
    http_status: 409
    applies_to: "POST /flights/{id}/release"
  - priority: 16
    category: business_referential
    check: "the flight's AirspaceAuthorization exists and its status == APPROVED"
    error_id: ERR_AUTHORIZATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /flights/{id}/release, POST /flights/{id}/launch"
  - priority: 17
    category: business_temporal
    check: "the logical clock satisfies window_start <= now < window_end on the flight's APPROVED authorization (half-open)"
    error_id: ERR_AUTHORIZATION_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /flights/{id}/launch"
  - priority: 18
    category: business_temporal
    check: "the new maintenance window does not half-open-overlap another SCHEDULED window on the same drone (calculations.maintenance_window_conflict)"
    error_id: ERR_MAINTENANCE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /maintenance-logs"
  - priority: 19
    category: business_constraint
    check: "0 < Order.payload_weight_g <= ServiceArea.max_payload_g"
    error_id: ERR_PAYLOAD_EXCEEDS_LIMIT
    http_status: 422
    applies_to: "POST /orders"
  - priority: 20
    category: business_constraint
    check: "Order.distance_km <= ServiceArea.max_range_km (inclusive)"
    error_id: ERR_OUT_OF_SERVICE_RANGE
    http_status: 422
    applies_to: "POST /orders"
  - priority: 21
    category: business_constraint
    check: "the requested Nest is OPEN and belongs to the order's ServiceArea"
    error_id: ERR_NEST_UNAVAILABLE
    http_status: 409
    applies_to: "POST /orders/{id}/dispatch"
  - priority: 22
    category: business_constraint
    check: "the count of overlapping closed pad holds at the recovery nest is < Nest.pad_count (calculations.nest_pad_capacity_check)"
    error_id: ERR_NEST_PADS_FULL
    http_status: 409
    applies_to: "POST /orders/{id}/dispatch"
  - priority: 23
    category: business_constraint
    check: "the installed Battery is in state READY (charge endpoint rejects IN_USE / RETIRED packs; maintenance completion requires a READY pack)"
    error_id: ERR_BATTERY_NOT_READY
    http_status: 409
    applies_to: "POST /batteries/{id}/charge, POST /drones/{id}/install-battery, POST /maintenance-logs/{id}/complete"
  - priority: 24
    category: business_fiscal
    check: "Battery.charge_pct >= Flight.required_energy_pct at launch (inclusive; the energy budget is the fiscal check of this domain and runs last)"
    error_id: ERR_INSUFFICIENT_BATTERY
    http_status: 409
    applies_to: "POST /flights/{id}/launch"
  - priority: 25
    category: business_constraint
    check: "the dispatch selector's candidate set is non-empty"
    error_id: ERR_NO_ELIGIBLE_DRONE
    http_status: 409
    applies_to: "POST /orders/{id}/dispatch"

# ============================== §1.5 Endpoints ===============================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The clock starts at the fixed default 2026-05-01T00:00:00Z on server startup and NEVER falls back to real wall-clock time; every deadline, window and ETA in this API is evaluated against this logical clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock moves to the supplied instant (forward or backward)"]

  - method: POST
    path: "/_laanc/decision"
    description: "Simulates the external LAANC authority returning a decision on a pending airspace authorization."
    roles: [PlatformAdmin]
    code: 200
    input: [authorization_id, outcome]
    output: AirspaceAuthorization
    side_effects: ["AirspaceAuthorization PENDING -> APPROVED (mints auth_code) or PENDING -> DENIED"]

  - method: POST
    path: "/service-areas"
    description: "Registers a service area."
    roles: [PlatformAdmin]
    code: 201
    input: [name, center_lat, center_lon, max_range_km, max_payload_g]
    output: ServiceArea
    side_effects: ["ServiceArea created with status=ACTIVE"]

  - method: GET
    path: "/service-areas/{id}"
    description: "Reads one service area."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, MaintenanceTech, Customer]
    code: 200
    input: []
    output: ServiceArea
    side_effects: []

  - method: POST
    path: "/service-areas/{id}/suspend"
    description: "Suspends a service area (regulatory stand-down)."
    roles: [PlatformAdmin, FlightDirector]
    code: 200
    input: []
    output: ServiceArea
    side_effects: ["ServiceArea.status ACTIVE -> SUSPENDED; new orders, dispatches and launches in the area are rejected; in-flight sorties are untouched"]

  - method: POST
    path: "/nests"
    description: "Registers a launch/recovery nest inside a service area."
    roles: [PlatformAdmin]
    code: 201
    input: [service_area_id, name, lat, lon, pad_count, "status?"]
    output: Nest
    side_effects: ["Nest created with reserved_pads=0"]

  - method: GET
    path: "/nests"
    description: "Lists nests, filterable by service area. Reverse-reachability channel for Nest.service_area_id."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, MaintenanceTech]
    code: 200
    input: ["service_area_id?", "status?", "limit?", "offset?"]
    output: Nest[]
    side_effects: []

  - method: POST
    path: "/drones"
    description: "Registers an airframe at a nest."
    roles: [PlatformAdmin]
    code: 201
    input: [home_nest_id, tail_number, airframe_class, max_payload_g, cruise_speed_kmh, "hours_since_service?"]
    output: Drone
    side_effects: ["Drone created with status=IDLE, flight_hours=0, installed_battery_id=null; advisory_risk_score and blocking_risk_score computed"]

  - method: GET
    path: "/drones"
    description: "Lists drones. Reverse-reachability channel for Drone.home_nest_id and Drone.installed_battery_id."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, MaintenanceTech]
    code: 200
    input: ["home_nest_id?", "installed_battery_id?", "status?", "limit?", "offset?"]
    output: Drone[]
    side_effects: []

  - method: GET
    path: "/drones/{id}"
    description: "Reads one airframe with both freshly computed risk scores and its current version."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, MaintenanceTech]
    code: 200
    input: []
    output: Drone
    side_effects: []

  - method: POST
    path: "/batteries"
    description: "Registers a battery pack at a nest."
    roles: [PlatformAdmin, MaintenanceTech]
    code: 201
    input: [nest_id, serial, "charge_pct?", "cycle_count?"]
    output: Battery
    side_effects: ["Battery created with state=CHARGING; health_pct computed"]

  - method: GET
    path: "/batteries"
    description: "Lists battery packs. Reverse-reachability channel for Battery.nest_id."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, MaintenanceTech]
    code: 200
    input: ["nest_id?", "state?", "limit?", "offset?"]
    output: Battery[]
    side_effects: []

  - method: POST
    path: "/batteries/{id}/charge"
    description: "Ground charger set-point. Drives the pack to the requested state of charge and marks it READY. Rejected for IN_USE and RETIRED packs."
    roles: [MaintenanceTech, PlatformAdmin]
    code: 200
    input: [target_charge_pct]
    output: Battery
    side_effects: ["Battery.charge_pct = target_charge_pct; Battery.state {CHARGING, COOLDOWN, READY} -> READY; version += 1"]

  - method: POST
    path: "/drones/{id}/install-battery"
    description: "Bolts a pack into an airframe. Requires the drone IDLE or GROUNDED and the pack stored at the drone's home nest."
    roles: [MaintenanceTech, PlatformAdmin]
    code: 200
    input: [battery_id]
    output: Drone
    side_effects: ["Drone.installed_battery_id = battery_id; any previously installed pack is un-linked; risk scores recomputed; Drone.version += 1"]

  - method: POST
    path: "/customers"
    description: "Registers a customer with a fixed dropoff point."
    roles: [PlatformAdmin]
    code: 201
    input: [name, email, dropoff_lat, dropoff_lon]
    output: Customer
    side_effects: ["Customer created with held_total=0 and billed_total=0"]

  - method: POST
    path: "/orders"
    description: "Intakes an order, freezing the customer's dropoff point and computing distance, fee, surcharge and total."
    roles: [Customer, DispatchOperator]
    code: 201
    input: [customer_id, service_area_id, payload_weight_g, "priority?"]
    output: Order
    side_effects: ["runs calculations.order_geometry, order_fee_components, order_billing_total; Order created with status=QUOTED and version=1"]

  - method: GET
    path: "/orders"
    description: "Lists orders. Reverse-reachability channel for Order.customer_id and Order.service_area_id. Paginated."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, Customer]
    code: 200
    input: ["customer_id?", "service_area_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: GET
    path: "/orders/{id}"
    description: "Reads one order, including its current version (needed for the OCC dispatch field)."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, Customer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/orders/{id}/dispatch"
    description: "Selects an airframe at the requested nest, creates the Flight, holds the funds and reserves a pad. Optimistically concurrent on Order.version."
    roles: [DispatchOperator]
    code: 201
    input: [nest_id, expected_order_version]
    output: Flight
    side_effects:
      - "runs calculations.dispatch_drone_selection, flight_energy_requirement (provisional), nest_pad_capacity_check"
      - "creates Flight(ops_state=PLANNED, clearance_state=UNFILED)"
      - "Drone IDLE -> RESERVED; Nest.reserved_pads += 1; Customer.held_total += Order.order_total"
      - "Order QUOTED -> ASSIGNED; increments Order.version by 1"

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancels a QUOTED order. Customers may only cancel their own."
    roles: [Customer, DispatchOperator]
    code: 200
    input: []
    output: Order
    side_effects: ["Order QUOTED -> CANCELLED; increments Order.version by 1"]

  - method: GET
    path: "/flights"
    description: "Lists flights. Reverse-reachability channel for Flight.order_id, drone_id, launch_nest_id, recovery_nest_id and battery_id."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, MaintenanceTech]
    code: 200
    input: ["order_id?", "drone_id?", "launch_nest_id?", "recovery_nest_id?", "battery_id?", "ops_state?", "limit?", "offset?"]
    output: Flight[]
    side_effects: []

  - method: GET
    path: "/flights/{id}"
    description: "Reads one flight with both state dimensions and both energy figures."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, MaintenanceTech]
    code: 200
    input: []
    output: Flight
    side_effects: []

  - method: POST
    path: "/flights/{id}/file-authorization"
    description: "Files a LAANC request for the sortie; advances only the clearance dimension."
    roles: [DispatchOperator]
    code: 201
    input: [grid_cells, requested_alt_ft, window_start, window_end]
    output: AirspaceAuthorization
    side_effects: ["creates AirspaceAuthorization(status=PENDING); Flight.clearance_state UNFILED -> FILED; Flight.filed_by_user_id = X-User-ID"]

  - method: POST
    path: "/flights/{id}/release"
    description: "BVLOS release. Segregation of duties: the releasing FlightDirector must not be the user who filed the authorization."
    roles: [FlightDirector]
    code: 200
    input: []
    output: Flight
    side_effects: ["Flight.clearance_state FILED -> CLEARED; Flight.released_by_user_id = X-User-ID"]

  - method: POST
    path: "/flights/{id}/launch"
    description: "Launches the sortie. The single point where both Flight dimensions, the drone, the pack, the weather, the geofence and the authorization window are jointly gated."
    roles: [DispatchOperator]
    code: 200
    input: []
    output: Flight
    side_effects: ["Flight.ops_state PLANNED -> LAUNCHED; Drone RESERVED -> IN_FLIGHT; Battery READY -> IN_USE; Order ASSIGNED -> IN_TRANSIT"]

  - method: POST
    path: "/flights/{id}/arrive"
    description: "Reports arrival over the dropoff point."
    roles: [DispatchOperator]
    code: 200
    input: []
    output: Flight
    side_effects: ["Flight.ops_state LAUNCHED -> DROPPING"]

  - method: POST
    path: "/flights/{id}/drop"
    description: "Confirms payload release; captures the held funds."
    roles: [DispatchOperator]
    code: 201
    input: [hover_alt_ft, photo_ref]
    output: DeliveryDrop
    side_effects: ["creates DeliveryDrop; Flight.ops_state DROPPING -> RETURNING; Order IN_TRANSIT -> DELIVERED; Customer.held_total -= order_total and Customer.billed_total += order_total"]

  - method: GET
    path: "/flights/{id}/delivery-drops"
    description: "Lists the drop confirmations of a flight (0 or 1). Reverse-reachability channel for DeliveryDrop.flight_id."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: DeliveryDrop[]
    side_effects: []

  - method: POST
    path: "/flights/{id}/recover"
    description: "Recovers the airframe at the recovery nest, debits the pack with the ACTUAL energy variant and runs the retirement cascade."
    roles: [DispatchOperator]
    code: 200
    input: [actual_route_km]
    output: Flight
    side_effects:
      - "Flight.actual_energy_pct = flight_energy_requirement (actual variant); Flight.ops_state RETURNING -> RECOVERED"
      - "Battery IN_USE -> COOLDOWN, cycle_count += 1, charge debited; at cycle_count >= 300 the pack RETIRES"
      - "Drone IN_FLIGHT -> IDLE, or -> GROUNDED with a BATTERY_SWAP MaintenanceLog when the pack retired; hours accumulated"
      - "Nest.reserved_pads -= 1"

  - method: POST
    path: "/flights/{id}/abort"
    description: "Aborts a non-terminal sortie and unwinds every reservation it holds."
    roles: [DispatchOperator, FlightDirector]
    code: 200
    input: ["actual_route_km?"]
    output: Flight
    side_effects:
      - "Flight.ops_state -> ABORTED (abort_reason=OPERATOR); clearance_state FILED|CLEARED -> REVOKED; the AirspaceAuthorization -> REVOKED"
      - "Nest.reserved_pads -= 1; Drone -> IDLE; Battery IN_USE -> COOLDOWN with the actual-variant debit (post-launch only)"
      - "Order ASSIGNED|IN_TRANSIT -> QUOTED and Customer.held_total -= order_total; a DELIVERED order is left untouched"

  - method: GET
    path: "/airspace-authorizations"
    description: "Lists airspace authorizations. Reverse-reachability channel for AirspaceAuthorization.flight_id."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector]
    code: 200
    input: ["flight_id?", "status?", "limit?", "offset?"]
    output: AirspaceAuthorization[]
    side_effects: []

  - method: POST
    path: "/geofence-zones"
    description: "Publishes a no-fly / TFR / weather-hold restriction inside a service area."
    roles: [PlatformAdmin, FlightDirector]
    code: 201
    input: [service_area_id, kind, center_lat, center_lon, radius_km, effective_from, effective_to]
    output: GeofenceZone
    side_effects: ["GeofenceZone created with status=ACTIVE"]

  - method: GET
    path: "/geofence-zones"
    description: "Lists restrictions. Reverse-reachability channel for GeofenceZone.service_area_id."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector]
    code: 200
    input: ["service_area_id?", "status?", "limit?", "offset?"]
    output: GeofenceZone[]
    side_effects: []

  - method: POST
    path: "/geofence-zones/{id}/lift"
    description: "Lifts a restriction; LIFTED zones no longer gate launches."
    roles: [PlatformAdmin, FlightDirector]
    code: 200
    input: []
    output: GeofenceZone
    side_effects: ["GeofenceZone.status ACTIVE -> LIFTED"]

  - method: POST
    path: "/weather-observations"
    description: "Publishes a weather observation for a service area; flyable is computed on write."
    roles: [PlatformAdmin, DispatchOperator]
    code: 201
    input: [service_area_id, observed_at, wind_kph, gust_kph, visibility_km, "precip?"]
    output: WeatherObservation
    side_effects: ["runs calculations.weather_flyability to set flyable"]

  - method: GET
    path: "/weather-observations"
    description: "Lists observations. Reverse-reachability channel for WeatherObservation.service_area_id."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector]
    code: 200
    input: ["service_area_id?", "limit?", "offset?"]
    output: WeatherObservation[]
    side_effects: []

  - method: POST
    path: "/incidents"
    description: "Files an incident against an airframe, optionally tied to a sortie. Immediately raises the drone's blocking_risk_score."
    roles: [DispatchOperator, MaintenanceTech, FlightDirector]
    code: 201
    input: [drone_id, severity, category, narrative, "flight_id?"]
    output: Incident
    side_effects: ["Incident created with status=OPEN; Drone.blocking_risk_score recomputed upward; Drone.advisory_risk_score unchanged"]

  - method: GET
    path: "/incidents"
    description: "Lists incidents. Reverse-reachability channel for Incident.drone_id and Incident.flight_id."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, MaintenanceTech]
    code: 200
    input: ["drone_id?", "flight_id?", "status?", "limit?", "offset?"]
    output: Incident[]
    side_effects: []

  - method: POST
    path: "/incidents/{id}/review"
    description: "Opens the review of an incident."
    roles: [MaintenanceTech]
    code: 200
    input: []
    output: Incident
    side_effects: ["Incident OPEN -> UNDER_REVIEW"]

  - method: POST
    path: "/incidents/{id}/outcome"
    description: "Forks the incident: NO_ACTION closes it with no fleet impact; MAINTENANCE_REQUIRED grounds the airframe and fires the grounding cascade."
    roles: [MaintenanceTech]
    code: 200
    input: [outcome]
    output: Incident
    side_effects:
      - "outcome=NO_ACTION: Incident UNDER_REVIEW -> CLOSED; the severity points migrate into advisory_risk_score; nothing else changes"
      - "outcome=MAINTENANCE_REQUIRED: Incident -> MAINTENANCE_REQUIRED; Drone -> GROUNDED; every non-terminal Flight of that drone -> ABORTED; each aborted flight revokes its clearance and authorization, releases its pad and reverts its order with the funds hold; a REPAIR MaintenanceLog is scheduled"

  - method: POST
    path: "/maintenance-logs"
    description: "Schedules a maintenance window on an airframe. Optimistically concurrent on Drone.version."
    roles: [MaintenanceTech]
    code: 201
    input: [drone_id, work_type, scheduled_start, scheduled_end, expected_drone_version, "notes?"]
    output: MaintenanceLog
    side_effects: ["runs calculations.maintenance_window_conflict; MaintenanceLog created with status=SCHEDULED; increments Drone.version by 1"]

  - method: GET
    path: "/maintenance-logs"
    description: "Lists maintenance logs. Reverse-reachability channel for MaintenanceLog.drone_id and MaintenanceLog.incident_id."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, MaintenanceTech]
    code: 200
    input: ["drone_id?", "incident_id?", "status?", "limit?", "offset?"]
    output: MaintenanceLog[]
    side_effects: []

  - method: POST
    path: "/maintenance-logs/{id}/complete"
    description: "Closes out the work order, zeroes hours_since_service and returns the airframe to service."
    roles: [MaintenanceTech]
    code: 200
    input: []
    output: MaintenanceLog
    side_effects: ["MaintenanceLog SCHEDULED -> COMPLETED; Drone.hours_since_service = 0; Drone GROUNDED -> IDLE; the linked Incident MAINTENANCE_REQUIRED -> CLOSED"]

  - method: GET
    path: "/nests/{id}"
    description: "Reads one nest, including its live reserved_pads ledger."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, MaintenanceTech]
    code: 200
    input: []
    output: Nest
    side_effects: []

  - method: GET
    path: "/batteries/{id}"
    description: "Reads one battery pack with its state, charge and health."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, MaintenanceTech]
    code: 200
    input: []
    output: Battery
    side_effects: []

  - method: GET
    path: "/customers/{id}"
    description: "Reads one customer, including the held_total and billed_total ledgers."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/airspace-authorizations/{id}"
    description: "Reads one airspace authorization."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector]
    code: 200
    input: []
    output: AirspaceAuthorization
    side_effects: []

  - method: GET
    path: "/geofence-zones/{id}"
    description: "Reads one geofence zone."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector]
    code: 200
    input: []
    output: GeofenceZone
    side_effects: []

  - method: GET
    path: "/weather-observations/{id}"
    description: "Reads one weather observation, including its computed flyable flag."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector]
    code: 200
    input: []
    output: WeatherObservation
    side_effects: []

  - method: GET
    path: "/delivery-drops/{id}"
    description: "Reads one delivery drop confirmation."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, Customer]
    code: 200
    input: []
    output: DeliveryDrop
    side_effects: []

  - method: GET
    path: "/incidents/{id}"
    description: "Reads one incident."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, MaintenanceTech]
    code: 200
    input: []
    output: Incident
    side_effects: []

  - method: GET
    path: "/maintenance-logs/{id}"
    description: "Reads one maintenance work order."
    roles: [PlatformAdmin, DispatchOperator, FlightDirector, MaintenanceTech]
    code: 200
    input: []
    output: MaintenanceLog
    side_effects: []

# ============================ §1.6 Error Catalog =============================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role / X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed in the endpoint's roles"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required field, wrong type, enum out of range, or a numeric constraint violated"
  - id: ERR_SERVICE_AREA_NOT_FOUND
    http: 404
    condition: "service_area_id in the path or body names no service area"
  - id: ERR_NEST_NOT_FOUND
    http: 404
    condition: "nest_id in the path or body names no nest"
  - id: ERR_DRONE_NOT_FOUND
    http: 404
    condition: "drone_id in the path or body names no drone"
  - id: ERR_BATTERY_NOT_FOUND
    http: 404
    condition: "battery_id in the path or body names no battery"
  - id: ERR_CUSTOMER_NOT_FOUND
    http: 404
    condition: "customer_id in the body names no customer"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order id in the path names no order"
  - id: ERR_FLIGHT_NOT_FOUND
    http: 404
    condition: "flight id in the path or body names no flight"
  - id: ERR_AUTHORIZATION_NOT_FOUND
    http: 404
    condition: "authorization_id names no airspace authorization"
  - id: ERR_GEOFENCE_ZONE_NOT_FOUND
    http: 404
    condition: "geofence zone id in the path names no zone"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "incident id in the path names no incident"
  - id: ERR_MAINTENANCE_LOG_NOT_FOUND
    http: 404
    condition: "maintenance log id in the path names no log"
  - id: ERR_NOT_ORDER_OWNER
    http: 403
    condition: "a Customer acts on an order whose customer_id != X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the FlightDirector releasing a flight is the same user who filed its authorization"
  - id: ERR_DUPLICATE_TAIL_NUMBER
    http: 409
    condition: "tail_number already registered on another drone"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_order_version != Order.version on dispatch"
  - id: ERR_STALE_DRONE_VERSION
    http: 412
    condition: "expected_drone_version != Drone.version on maintenance-log creation"
  - id: ERR_ORDER_NOT_QUOTED
    http: 409
    condition: "dispatch attempted on an order whose status is not QUOTED"
  - id: ERR_ORDER_NOT_CANCELLABLE
    http: 409
    condition: "cancel attempted on an order that is ASSIGNED, IN_TRANSIT, DELIVERED or CANCELLED"
  - id: ERR_FLIGHT_NOT_PLANNED
    http: 409
    condition: "file-authorization, release or launch attempted on a flight whose ops_state is not PLANNED"
  - id: ERR_FLIGHT_INVALID_STATE
    http: 409
    condition: "arrive on a flight not LAUNCHED, drop on a flight not DROPPING, or recover on a flight not RETURNING"
  - id: ERR_FLIGHT_TERMINAL
    http: 409
    condition: "abort attempted on a flight already RECOVERED or ABORTED"
  - id: ERR_FLIGHT_NOT_CLEARED
    http: 409
    condition: "launch attempted while clearance_state is not CLEARED, or release attempted while clearance_state is not FILED"
  - id: ERR_AUTHORIZATION_NOT_PENDING
    http: 409
    condition: "a LAANC decision is applied to an authorization that is not PENDING"
  - id: ERR_AUTHORIZATION_NOT_APPROVED
    http: 409
    condition: "release or launch while the flight's authorization is PENDING, DENIED or REVOKED"
  - id: ERR_AUTHORIZATION_WINDOW_EXPIRED
    http: 409
    condition: "launch outside the half-open [window_start, window_end) of the approved authorization"
  - id: ERR_INCIDENT_NOT_OPEN
    http: 409
    condition: "review attempted on an incident that is not OPEN"
  - id: ERR_INCIDENT_NOT_UNDER_REVIEW
    http: 409
    condition: "an outcome is recorded on an incident that is not UNDER_REVIEW"
  - id: ERR_MAINTENANCE_NOT_SCHEDULED
    http: 409
    condition: "complete attempted on a maintenance log that is already COMPLETED"
  - id: ERR_MAINTENANCE_WINDOW_CONFLICT
    http: 409
    condition: "the new maintenance window half-open-overlaps another SCHEDULED window on the same drone"
  - id: ERR_SERVICE_AREA_SUSPENDED
    http: 409
    condition: "order intake, dispatch or launch in a SUSPENDED service area"
  - id: ERR_WEATHER_NO_GO
    http: 409
    condition: "launch while the latest observation of the service area has flyable == false"
  - id: ERR_GEOFENCE_VIOLATION
    http: 409
    condition: "launch while an ACTIVE, in-window geofence zone intersects the route"
  - id: ERR_DRONE_GROUNDED
    http: 409
    condition: "release or launch of a flight whose drone is GROUNDED"
  - id: ERR_DRONE_RISK_TOO_HIGH
    http: 409
    condition: "release while Drone.blocking_risk_score >= 70.0"
  - id: ERR_NEST_UNAVAILABLE
    http: 409
    condition: "dispatch to a CLOSED nest, or to a nest outside the order's service area"
  - id: ERR_NEST_PADS_FULL
    http: 409
    condition: "the count of overlapping closed pad holds at the recovery nest has reached Nest.pad_count"
  - id: ERR_BATTERY_NOT_READY
    http: 409
    condition: "charging an IN_USE or RETIRED pack, installing a pack that is IN_USE / RETIRED or stored at another nest into a drone that is not IDLE or GROUNDED, or completing maintenance on a drone with no READY pack installed"
  - id: ERR_INSUFFICIENT_BATTERY
    http: 409
    condition: "launch while Battery.charge_pct < Flight.required_energy_pct"
  - id: ERR_NO_ELIGIBLE_DRONE
    http: 409
    condition: "the dispatch selector's candidate set is empty"
  - id: ERR_PAYLOAD_EXCEEDS_LIMIT
    http: 422
    condition: "Order.payload_weight_g > ServiceArea.max_payload_g"
  - id: ERR_OUT_OF_SERVICE_RANGE
    http: 422
    condition: "Order.distance_km > ServiceArea.max_range_km"

# ============================== §1.7 RBAC Matrix =============================
roles:
  - name: Customer
    description: "Places orders to a fixed dropoff point and cancels its own quoted orders."
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /orders (only with customer_id == X-User-ID)"
      - "POST /orders/{id}/cancel (only own orders)"
      - "GET /orders, GET /orders/{id}, GET /service-areas/{id}, GET /flights/{id}/delivery-drops"

  - name: DispatchOperator
    description: "Runs the sortie: dispatches orders, files LAANC, launches, tracks, drops, recovers and aborts. Cannot release a flight it filed."
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/dispatch"
      - "POST /flights/{id}/file-authorization"
      - "POST /flights/{id}/launch"
      - "POST /flights/{id}/arrive"
      - "POST /flights/{id}/drop"
      - "POST /flights/{id}/recover"
    shared_operations:
      - "POST /orders, POST /orders/{id}/cancel"
      - "POST /flights/{id}/abort (with FlightDirector)"
      - "POST /weather-observations, POST /incidents"
      - "all GET endpoints except the customer-only reads"

  - name: FlightDirector
    description: "BVLOS release authority. Segregated from the operator who filed the airspace authorization."
    identity: "opaque"
    exclusive_operations:
      - "POST /flights/{id}/release"
    shared_operations:
      - "POST /flights/{id}/abort (with DispatchOperator)"
      - "POST /service-areas/{id}/suspend, POST /geofence-zones, POST /geofence-zones/{id}/lift (with PlatformAdmin)"
      - "POST /incidents"
      - "all GET endpoints"

  - name: MaintenanceTech
    description: "Owns the airframe and the pack: charging, battery installation, incident review and maintenance work orders."
    identity: "opaque"
    exclusive_operations:
      - "POST /incidents/{id}/review"
      - "POST /incidents/{id}/outcome"
      - "POST /maintenance-logs"
      - "POST /maintenance-logs/{id}/complete"
    shared_operations:
      - "POST /batteries, POST /batteries/{id}/charge, POST /drones/{id}/install-battery (with PlatformAdmin)"
      - "POST /incidents"
      - "GET /drones, GET /drones/{id}, GET /batteries, GET /flights, GET /incidents, GET /maintenance-logs, GET /nests"

  - name: PlatformAdmin
    description: "Fleet and geography administration plus the two simulator endpoints (logical clock, LAANC authority)."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /_laanc/decision"
      - "POST /service-areas"
      - "POST /nests"
      - "POST /drones"
      - "POST /customers"
    shared_operations:
      - "POST /service-areas/{id}/suspend, POST /geofence-zones, POST /geofence-zones/{id}/lift (with FlightDirector)"
      - "POST /batteries, POST /batteries/{id}/charge, POST /drones/{id}/install-battery (with MaintenanceTech)"
      - "POST /weather-observations"
      - "all GET endpoints"
