              as: LogisticsCoordinator
              captures: { agocc1: $.data.id }
            # agreement create bumped event version; client retries with stale version
          trigger:
            - call: "POST /clinic-events/${evocc}/site-agreements"
              payload: { site_id: "${socc}", host_org_name: "B", liability_cap_cents: 1000000, insurance_certificate_ref: "COCC2", expected_event_version: "${evocc_v}" }
              as: LogisticsCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STALE_VERSION (412)"
