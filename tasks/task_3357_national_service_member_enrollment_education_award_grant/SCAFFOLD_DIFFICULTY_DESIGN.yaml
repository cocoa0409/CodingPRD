              payload: { use_type: "TUITION", amount_cents: 1000, institution_title_iv: true, expected_education_award_version: "${edu_v1}" }
              as: Member
              as_user_id: "${m_a}"
              captures: { use_1: $.data.id }
            - call: "GET /education-awards/${edu_a}"
              payload: {}
              as: TrustAdministrator
              captures: { edu_v2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2033-10-02T00:00:01Z" }
              as: CNCSProgramOfficer
            - call: "POST /education-awards/${edu_a}/uses"
              payload: { use_type: "QUALIFIED_LOAN", amount_cents: 1000, expected_education_award_version: "${edu_v2}" }
              as: Member
              as_user_id: "${m_a}"
