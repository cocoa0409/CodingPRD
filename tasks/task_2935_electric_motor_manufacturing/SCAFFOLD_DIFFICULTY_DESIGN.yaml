  - rule_id: priority_pair_validation_conflict
    instances:

      - name: unauthorized_role_outranks_nameplate_not_certified_on_ship
        grounds:
          - validations[priority=2]
          - validations[priority=71]
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_NAMEPLATE_NOT_CERTIFIED]
          - endpoints[POST /work-orders/{id}/ship]
        distinguishing_aspect: |
          Both rules are violated by the SAME request: a BuildTechnician (not in the ship
          endpoint's roles list, priority 2) shipping a TESTED work order that has no nameplate
          at all (certification_status PENDING, priority 71). Priority 2 must win, so the
          response is 403 ERR_UNAUTHORIZED and the reporter learns nothing about the missing
          certification; re-issuing the identical request as ProductionPlanner then surfaces the
          409 ERR_NAMEPLATE_NOT_CERTIFIED, proving the second violation was really there.
