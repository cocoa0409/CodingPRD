              as_user_id: "${p_qc_id}"
              captures: { f1_id: $.data.id }
          trigger:
            - call: "POST /inspection-findings/${f1_id}/classification"
              payload: { classification: "MATERIAL_FAILURE", pervasiveness: "SYSTEMIC", affects_report_conclusion: true }
              as: QualityControlDirector
              as_user_id: "${p_qc_id}"
          assert:
            - "InspectionFinding.${f1_id}.classification == MATERIAL_FAILURE"
            - "InspectionFinding.${f1_id}.class_points == 20"
            - "InspectionFinding.${f1_id}.state == RCA_PENDING"
            - "InspectionSelection.${sel1_id}.finding_count == 1"
            - "Firm.${firm_id}.open_deficiency_count == 1"
            - "Firm.${firm_id}.open_material_failure_count == 1"
            - "Engagement.${e1_id}.file_state == OPEN"
            - "Engagement.${e1_id}.reopened_count == 1"
            - "Engagement.${e1_id}.workflow_state == REPORT_RELEASED"
            - "QualityRisk.${risk_id}.state == RESPONDED"
            - "QualityRisk.${risk_id}.residual_risk_score == null"
            - "QualityRisk.${risk_id}.severity_band == NONE"
            - "QualityRisk.${risk_id}.evaluation_basis == NONE"
            - "QualityRisk.${risk_id}.reopen_count == 1"
            - "Firm.${firm_id}.critical_risk_count == 0"
            - "Firm.${firm_id}.risk_posture == CRITICAL"
            - "Engagement.${e2_id}.eqr_required == true"
            - "Engagement.${e2_id}.workflow_state == PLANNING"

      - name: corrective_action_rejection_five_link_cascade_to_follow_up_review
        grounds:
          - state_machines.CorrectiveActionPlan.EVIDENCE_SUBMITTED_to_REJECTED
          - state_machines.PeerReview.REMEDIATION_SUBMITTED_to_FOLLOW_UP_REQUIRED
          - entities.PeerReview.fields.prior_peer_review_id
          - entities.PeerReview.fields.is_follow_up
          - entities.PeerReviewer.fields.active_review_count
          - entities.Firm.fields.last_peer_review_rating
          - entities.Firm.fields.prior_reviewer_ids
          - calculations.firm_risk_posture
          - errors[ERR_ACCEPTANCE_FROZEN]
        distinguishing_aspect: |
          Fired from a different endpoint than instance one, one REJECTED disposition propagates five
          links: (1) the plan reaches REJECTED with rejection_count 1, (2) the parent PeerReview moves
          REMEDIATION_SUBMITTED -> FOLLOW_UP_REQUIRED, (3) a brand-new follow-up PeerReview is created
          with prior_peer_review_id set, is_follow_up true, state SCHEDULED and a window of
          2027-03-14..2027-03-28 (the original window end 2026-09-15 plus 180 days, plus 14), while the
          reviewer's active_review_count drops to 0, (4) the firm records last_peer_review_rating FAIL
          and prepends the reviewer to prior_reviewer_ids so the posture recomputes to CRITICAL, and
          (5) because the posture is CRITICAL, accepting a new ERISA_AUDIT is refused with
