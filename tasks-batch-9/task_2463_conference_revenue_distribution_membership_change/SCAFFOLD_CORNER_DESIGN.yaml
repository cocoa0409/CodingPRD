              as: FinanceOfficer
              as_user_id: "u_fin_1"
              captures: { p26_id: $.data.id }
            - &c_p26_open
              call: "POST /revenue-pools/${p26_id}/open"
              payload: {}
              as: FinanceOfficer
              as_user_id: "u_fin_1"
