            - { call: "POST /consignment/items", payload: { seller_id: "${seller_id}", category: "HANDBAGS", brand: "Bally", title: "Clutch", declared_value_cents: 90000, intake_channel: "DROP_OFF" }, as: Seller, as_user_id: "${seller_id}", captures: { item_id: "$.data.id" } }
            - { call: "POST /consignment/listings", payload: { item_id: "${item_id}", list_price_cents: 90000 }, as: Seller, as_user_id: "${seller_id}", captures: { listing_id: "$.data.id" } }
          trigger:
            - { call: "POST /consignment/listings/${listing_id}/publish", payload: {}, as: Seller, as_user_id: "${seller_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_ITEM_NOT_AUTHENTICATED"
            - "http_status == 409"
            - "Listing.${listing_id}.status == DRAFT"

      - name: direct_buy_requires_listing_active
        grounds:
          - state_machines.Listing.ACTIVE_to_SOLD
          - validations[priority=7]
          - errors[ERR_LISTING_NOT_ACTIVE]
          - entities.Listing.fields.status
        distinguishing_aspect: "Direct-buying a listing still in DRAFT (never published) is rejected ERR_LISTING_NOT_ACTIVE — Sale creation is gated by Listing.status (pair Sale->Listing, a different entity pair than publish->item)."
