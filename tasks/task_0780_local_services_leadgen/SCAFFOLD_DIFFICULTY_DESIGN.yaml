  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: availability_slot_halfopen_overlap_rejected_adjacent_allowed
        grounds:
          - validations[priority=10]
          - state_machines.AvailabilitySlot.initial_state
          - errors[ERR_SLOT_OVERLAP]
        distinguishing_aspect: "AvailabilitySlot uses half-open [start,end) semantics: a new slot [10:30,11:30) overlapping existing [10:00,11:00) is rejected ERR_SLOT_OVERLAP, while a touching slot [11:00,12:00) is accepted (adjacency allowed) — interval arithmetic pure half-open on resource AvailabilitySlot."
        test_recipe:
          setup:
            - "Pro PP with one existing slot [2026-03-05T10:00:00Z, 2026-03-05T11:00:00Z)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /service-categories", payload: { name: "Fencing", base_lead_price_cents: 5000, max_leads_per_request: 2, demand_high_threshold: 5, demand_multiplier_high: 1.5, refund_window_hours: 24, min_rating_to_receive_leads: 0.0 }, as: PlatformAdmin, captures: { cat: "$.data.id" } }
            - { call: "POST /pros", payload: { email: "pp@x.com", business_name: "PP", billing_mode: "PAY_PER_LEAD", service_zip_codes: ["94016"], covered_category_ids: ["${cat}"] }, as: PlatformAdmin, captures: { pp: "$.data.id" } }
            - { call: "POST /pros/${pp}/submit-verification", payload: {}, as: Pro, as_user_id: "${pp}" }
            - { call: "POST /pros/${pp}/verify", payload: { decision: "APPROVE" }, as: PlatformAdmin }
            - { call: "POST /availability-slots", payload: { pro_id: "${pp}", start_utc: "2026-03-05T10:00:00Z", end_utc: "2026-03-05T11:00:00Z" }, as: Pro, as_user_id: "${pp}", captures: { slot1: "$.data.id" } }
            - { call: "POST /availability-slots", payload: { pro_id: "${pp}", start_utc: "2026-03-05T11:00:00Z", end_utc: "2026-03-05T12:00:00Z" }, as: Pro, as_user_id: "${pp}", captures: { slotAdj: "$.data.id" } }
          trigger:
            - { call: "POST /availability-slots", payload: { pro_id: "${pp}", start_utc: "2026-03-05T10:30:00Z", end_utc: "2026-03-05T11:30:00Z" }, as: Pro, as_user_id: "${pp}", captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_SLOT_OVERLAP"
            - "AvailabilitySlot.${slotAdj}.status == OPEN"

      - name: booking_buffered_overlap_rejected
        grounds:
          - validations[priority=11]
          - state_machines.Booking.initial_state
          - errors[ERR_BOOKING_CONFLICT]
