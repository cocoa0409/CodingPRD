      - name: finalize_is_blocked_while_an_overlapping_exclusion_review_is_still_pending
        claim_type: cascading_validation
        grounds:
          - validations[priority=22]
          - errors[ERR_EXCLUSION_REVIEW_PENDING]
          - state_machines.UptimeReport.transitions.PROVISIONAL_to_DRAFT
          - state_machines.OutageEvent.transitions.EXCLUSION_REVIEW_to_EXCLUDED
        distinguishing_aspect: "An undecided exclusion request would make the FINAL denominator ambiguous, so finalize must refuse with 409 while the outage sits in EXCLUSION_REVIEW. Deciding the exclusion then invalidates the already-computed provisional figures, resetting the report to DRAFT with every computed field null, after which the same period recomputes to 30.00 provisional and 100.00 final because all 30240 attributable minutes moved from D into E."
