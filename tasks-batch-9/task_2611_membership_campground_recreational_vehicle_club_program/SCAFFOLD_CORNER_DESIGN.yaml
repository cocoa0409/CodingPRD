          assert:
            - "Recomputed scores entering the walk: UTILITY 4500000 -> 3600 (1.20 * 1.00 * 2.50 * 1.0000 * 1.20 * 1000), SAFETY 12000000 -> 3500 (1.40 * 2.50 * 1.00 cost_factor), EXPANSION 3000000 -> 2400 (0.80 * 2.50 * 1.20)"
            - "Ordering is 3600, then 3500, then 2400, so the SAFETY project is examined second"
