  - rule_id: non_linear_state_machine
    instances:
      - name: tech_pack_revision_cycle_and_supersede
        grounds:
          - state_machines.TechPack.PENDING_APPROVAL_to_REJECTED
          - state_machines.TechPack.REJECTED_to_DRAFT
          - state_machines.TechPack.APPROVED_to_SUPERSEDED
        distinguishing_aspect: |
          TechPack: cyclic revision loop DRAFT->PENDING_APPROVAL->REJECTED->DRAFT->PENDING_APPROVAL->APPROVED
          on one pack, then an APPROVED->SUPERSEDED auto-transition when a sibling pack is approved.
        test_recipe:
          setup:
            - "Style ST-TP1; pack v1 created by u-m1 with one op"
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-TP1", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tpA: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tpA}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser }
            - { call: "POST /tech-packs/${tpA}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tpA}/review", payload: { decision: "REJECT", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "POST /tech-packs/${tpA}/revise", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tpA}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tpA}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 2, base_measurements: [{ point: "chest", base_value_in: 20.5 }], grade_rules: [], labor_cost_cents_per_unit: 820, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tpB: $.data.id } }
