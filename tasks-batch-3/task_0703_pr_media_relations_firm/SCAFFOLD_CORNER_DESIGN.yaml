              payload: { campaign_id: "${campaign_id}", name: "First List", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${current_v}" }
              as: MediaSpecialist
              captures: { first_list_id: $.data.id }
          trigger:
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "Second List", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${current_v}" }
              as: MediaSpecialist
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_CAMPAIGN_VERSION"

      - name: occ_media_list_create_supersedes_prior_active_on_correct_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[media-list-create-stale-campaign]
          - state_machines.MediaList
          - entities.MediaList.fields.status
        distinguishing_aspect: "Creating a second MediaList with the CURRENT (re-read) expected_campaign_version succeeds (201), supersedes the prior ACTIVE list (-> SUPERSEDED), and the new list is ACTIVE."
        test_recipe:
          setup:
            - "An ACTIVE Campaign with one ACTIVE MediaList (first list); an ACTIVE Journalist."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Oo", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 20, overage_rate_cents: 10000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "Sup", objective: "LAUNCH", budget_cents: 800000, target_beat: "TECH" }
              as: AccountManager
              captures: { campaign_id: $.data.id, v0: $.data.version }
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /agency/outlets"
              payload: { name: "Sup Trade", tier: "TRADE", monthly_unique_visitors: 100000, domain_authority: 40 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "Sup Jo", email: "sup@st.com", beat: "TECH" }
              as: MediaSpecialist
              captures: { journalist_id: $.data.id }
            - call: "GET /agency/campaigns/${campaign_id}"
              payload: {}
              as: MediaSpecialist
              captures: { v1: $.data.version }
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "First", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${v1}" }
              as: MediaSpecialist
              captures: { first_list_id: $.data.id }
          trigger:
            - call: "GET /agency/campaigns/${campaign_id}"
              payload: {}
              as: MediaSpecialist
              captures: { v2: $.data.version }
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "Second", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${v2}" }
              as: MediaSpecialist
              captures: { second_list_id: $.data.id }
          assert:
            - "response.status == 201"
            - "MediaList.${first_list_id}.status == SUPERSEDED"
            - "MediaList.${second_list_id}.status == ACTIVE"

      - name: occ_period_close_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[period-close-stale-period]
          - errors[ERR_STALE_PERIOD_VERSION]
        distinguishing_aspect: "Closing a RetainerPeriod with a stale expected_retainer_period_version (a TimeEntry was approved after the version was observed, bumping period.version) returns 412 ERR_STALE_PERIOD_VERSION."
        test_recipe:
          setup:
            - "A Client; an OPEN RetainerPeriod (version observed as stale_v BEFORE any entry approval); one TimeEntry then APPROVED (bumping period.version away from stale_v)."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Pp", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 20, overage_rate_cents: 10000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/retainer-periods"
              payload: { client_id: "${client_id}", period_month: "2026-11" }
              as: AccountManager
              captures: { period_id: $.data.id, stale_v: $.data.version }
            - call: "POST /agency/time-entries"
              payload: { retainer_period_id: "${period_id}", staff_id: "staff-g", work_type: "STRATEGY", billable_hours: 2.0 }
              as: AccountManager
              captures: { te_id: $.data.id }
            - call: "POST /agency/time-entries/${te_id}/approve"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /agency/retainer-periods/${period_id}/close"
              payload: { expected_retainer_period_version: "${stale_v}" }
              as: AccountManager
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_PERIOD_VERSION"

      - name: version_increments_on_each_campaign_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Campaign.fields.version
          - state_machines.Campaign.DRAFT_to_ACTIVE
        distinguishing_aspect: "A new Campaign starts at version 1; after one media-list create (which bumps Campaign.version) the version is 2 (monotonic increment on mutation)."
        test_recipe:
          setup:
            - "An ACTIVE Campaign (version 1 at create); an ACTIVE Journalist."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Qq", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 20, overage_rate_cents: 10000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "Ver", objective: "LAUNCH", budget_cents: 800000, target_beat: "TECH" }
              as: AccountManager
              captures: { campaign_id: $.data.id, v0: $.data.version }
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /agency/outlets"
              payload: { name: "Ve Trade", tier: "TRADE", monthly_unique_visitors: 100000, domain_authority: 40 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "Ve Jo", email: "ve@vt.com", beat: "TECH" }
              as: MediaSpecialist
              captures: { journalist_id: $.data.id }
            - call: "GET /agency/campaigns/${campaign_id}"
              payload: {}
              as: MediaSpecialist
              captures: { v_before: $.data.version }
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "Ver List", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${v_before}" }
              as: MediaSpecialist
          trigger:
            - call: "GET /agency/campaigns/${campaign_id}"
              payload: {}
              as: MediaSpecialist
              captures: { v_after: $.data.version }
          assert:
            - "v0 == 1"
            - "Campaign.${campaign_id}.version == ${v_before} + 1"

      - name: dual_variant_provisional_vs_final_delta_on_close
        claim_type: dual_variant_calculation
        grounds:
          - calculations.retainer_billing
        excluded_because:
          difficulty_instance: dual_variant_calc / retainer_billing_provisional_vs_final_on_period
          rationale: "The provisional (501) vs final (500) divergence and the variant selection (provisional live, final at close) are asserted by the named §1.8 dual_variant_calc instance."

      - name: cascade_spokesperson_deactivate_ordering_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Spokesperson.ACTIVE_to_INACTIVE
        excluded_because:
          difficulty_instance: transitive_cascade / spokesperson_deactivate_depth2_interview_pitch_revert
          rationale: "The depth-2 interview-cancel then pitch-revert ordering is asserted end-to-end by the named §1.8 transitive_cascade instance."

      - name: rate_threshold_reach_cap_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.media_value
        excluded_because:
          difficulty_instance: boundary_precision_check / reach_cap_min_boundary_on_coverage_verify
          rationale: "The REACH_CAP=3.0 boundary (reach clamped at the cap) is asserted by the named §1.8 boundary_precision_check instance."

      - name: scheduled_press_release_release_at_embargo_boundary
        claim_type: scheduled_actions
        grounds:
          - state_machines.PressRelease.SCHEDULED_to_RELEASED
          - errors[ERR_EMBARGO_NOT_LIFTED]
        distinguishing_aspect: "Releasing exactly when current clock == embargo_until succeeds (clock >= embargo, inclusive); releasing one second before fails with ERR_EMBARGO_NOT_LIFTED (deferred action gated by the logical clock)."
        test_recipe:
          setup:
            - "An ACTIVE Campaign; ACTIVE MediaList + ACTIVE Journalist; a SCHEDULED PressRelease embargo_until=2026-03-15T00:00:00Z with one QUEUED Distribution; clock set to 2026-03-14T23:59:59Z (one second before embargo)."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Rr", industry: "TECH", monthly_retainer_cents: 300000, monthly_hours_cap: 20, overage_rate_cents: 10000 }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "Emb", objective: "LAUNCH", budget_cents: 800000, target_beat: "TECH" }
              as: AccountManager
              captures: { campaign_id: $.data.id, campaign_v: $.data.version }
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /agency/outlets"
              payload: { name: "Em Trade", tier: "TRADE", monthly_unique_visitors: 100000, domain_authority: 40 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "Em Jo", email: "em@et.com", beat: "TECH" }
              as: MediaSpecialist
              captures: { journalist_id: $.data.id }
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "Em List", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${campaign_v}" }
              as: MediaSpecialist
              captures: { media_list_id: $.data.id }
            - call: "POST /agency/press-releases"
              payload: { campaign_id: "${campaign_id}", headline: "Timed", embargo_until: "2026-03-15T00:00:00Z" }
              as: MediaSpecialist
              captures: { pr_id: $.data.id }
            - call: "POST /agency/press-releases/${pr_id}/schedule"
              payload: {}
              as: MediaSpecialist
            - call: "POST /agency/distributions"
              payload: { press_release_id: "${pr_id}", journalist_id: "${journalist_id}" }
              as: MediaSpecialist
              captures: { dist_id: $.data.id }
            - call: "POST /agency/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-14T23:59:59Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /agency/press-releases/${pr_id}/release"
              payload: {}
              as: MediaSpecialist
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_EMBARGO_NOT_LIFTED"
            - "PressRelease.${pr_id}.status == SCHEDULED"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: verify_coverage_immediate_ledger_visible_in_get
        claim_type: immediate
        grounds:
          - state_machines.Coverage.DRAFT_to_VERIFIED
          - entities.Campaign.fields.earned_media_value_cents
        distinguishing_aspect: "After verifying a Coverage (media_value_cents=4050000), an immediate GET /agency/campaigns/{id} shows earned_media_value_cents=4050000 in the same request cycle (immediate consistency)."
        test_recipe:
          setup:
            - "An ENTERPRISE Client; ACTIVE Campaign; NATIONAL/2M-MUV/DA80 Outlet; ACTIVE Journalist on ACTIVE MediaList; one DRAFT Coverage POSITIVE/FEATURE then VERIFIED."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Ss", industry: "TECH", monthly_retainer_cents: 500000, monthly_hours_cap: 40, overage_rate_cents: 15000, account_tier: "ENTERPRISE" }
              as: AccountManager
              captures: { client_id: $.data.id }
            - call: "POST /agency/campaigns"
              payload: { client_id: "${client_id}", title: "Imm", objective: "LAUNCH", budget_cents: 5000000, target_beat: "TECH" }
              as: AccountManager
              captures: { campaign_id: $.data.id, campaign_v: $.data.version }
            - call: "POST /agency/campaigns/${campaign_id}/activate"
              payload: {}
              as: AccountManager
            - call: "POST /agency/outlets"
              payload: { name: "Im Nat", tier: "NATIONAL", monthly_unique_visitors: 2000000, domain_authority: 80 }
              as: PlatformAdmin
              captures: { outlet_id: $.data.id }
            - call: "POST /agency/journalists"
              payload: { outlet_id: "${outlet_id}", full_name: "Im Jo", email: "im@in.com", beat: "TECH" }
              as: MediaSpecialist
              captures: { journalist_id: $.data.id }
            - call: "POST /agency/media-lists"
              payload: { campaign_id: "${campaign_id}", name: "Im List", journalist_ids: ["${journalist_id}"], expected_campaign_version: "${campaign_v}" }
              as: MediaSpecialist
              captures: { media_list_id: $.data.id }
            - call: "POST /agency/coverage"
              payload: { campaign_id: "${campaign_id}", journalist_id: "${journalist_id}", headline: "Im Clip", published_at: "2026-03-02T00:00:00Z", sentiment: "POSITIVE", prominence: "FEATURE" }
