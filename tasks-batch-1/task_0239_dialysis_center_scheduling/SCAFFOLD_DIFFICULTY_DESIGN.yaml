        distinguishing_aspect: "Depth-2 chain from a DIFFERENT trigger (clinic close, not order revoke): close -> every RESERVED StandingSlot -> RELEASED; that release -> the slot's BOOKED session -> CANCELLED. Distinct propagation pattern from the order-revoke cascade."
