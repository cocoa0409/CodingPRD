  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_restores_outstanding_principal
        grounds:
          - state_machines.RecoveryTransaction.POSTED_to_VOIDED
          - calculations.payment_allocation
          - entities.Overpayment.fields.outstanding_principal_cents
          - entities.Overpayment.fields.final_amount_cents
        distinguishing_aspect: |
          Conserved quantity = outstanding principal (money): outstanding_principal_cents ==
          final_amount_cents - SUM(POSTED applied_to_principal_cents). Posting 5000 then
          voiding returns outstanding_principal_cents to 45050 with zero drift.
        test_recipe:
          setup:
            - "An IHE Overpayment (final 45050, zero interest) IN_RECOVERY with one POSTED transaction of 5000 (all principal)."
          setup_api_calls:
            - call: "POST /fraud-recovery/subjects"
              payload: { name: "Ola Void", ssn_last4: "1818", primary_program: "SNAP" }
              as: Intake
              captures: { subj_id: $.data.id }
            - call: "POST /fraud-recovery/referrals"
              payload: { subject_id: "${subj_id}", program: "SNAP", source: "CASEWORKER", allegation_summary: "Recovery case" }
              as: Intake
              captures: { ref_id: $.data.id }
            - call: "POST /fraud-recovery/referrals/${ref_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Intake
            - call: "POST /fraud-recovery/cases"
              payload: { referral_id: "${ref_id}" }
              as: Investigator
              captures: { case_id: $.data.id }
            - call: "POST /fraud-recovery/cases/${case_id}/assign"
              payload: { investigator_user_id: "inv-1" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/evidence"
              payload: { kind: "DOCUMENT", description: "Record" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/submit-review"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/adjudicate"
              payload: { decision: "SUBSTANTIATE" }
              as: Supervisor
            - call: "POST /fraud-recovery/overpayments"
              payload: { case_id: "${case_id}", claim_type: "IHE" }
              as: Investigator
              captures: { op_id: $.data.id }
            - call: "POST /fraud-recovery/overpayments/${op_id}/months"
              payload: { benefit_month: "2025-01", benefits_issued_cents: 50050, benefits_entitled_reported_cents: 30000, benefits_entitled_verified_cents: 20000 }
              as: Investigator
            - call: "POST /fraud-recovery/overpayments/${op_id}/months"
              payload: { benefit_month: "2025-02", benefits_issued_cents: 40000, benefits_entitled_reported_cents: 25000, benefits_entitled_verified_cents: 25000 }
              as: Investigator
            - call: "POST /fraud-recovery/overpayments/${op_id}/calculate"
              payload: {}
              as: Investigator
            - call: "POST /fraud-recovery/overpayments/${op_id}/establish"
              payload: {}
              as: Supervisor
            - call: "POST /fraud-recovery/overpayments/${op_id}/demand"
              payload: {}
              as: RecoveryOfficer
            - call: "POST /fraud-recovery/recovery-plans"
              payload: { overpayment_id: "${op_id}", method: "RECOUPMENT", start_date: "2026-05-01", end_date: "2027-05-01", monthly_allotment_cents: 19400, scheduled_monthly_cents: 9010 }
              as: RecoveryOfficer
              captures: { plan_id: $.data.id }
            - call: "POST /fraud-recovery/recovery-transactions"
              payload: { recovery_plan_id: "${plan_id}", amount_cents: 5000, transaction_date: "2026-05-01", method: "PAYMENT" }
              as: RecoveryOfficer
              captures: { txn_id: $.data.id }
          trigger:
            - call: "POST /fraud-recovery/recovery-transactions/${txn_id}/void"
              payload: { reason: "Posted in error" }
              as: RecoveryOfficer
          assert:
            - "RecoveryTransaction.${txn_id}.status == VOIDED"
            - "Overpayment.${op_id}.outstanding_principal_cents == 45050"
            - "Overpayment.${op_id}.status == IN_RECOVERY"

      - name: rescind_restores_prior_ipv_count
        grounds:
          - state_machines.Disqualification.IMPOSED_to_RESCINDED
          - state_machines.Disqualification.ADH_REFERRED_to_IMPOSED
          - entities.Subject.fields.prior_ipv_count
          - entities.Subject.fields.disqualification_status
        distinguishing_aspect: |
          Conserved quantity = subject prior_ipv_count (a count, not money): imposition (+1)
          followed by rescission (-1) returns prior_ipv_count to 0 and disqualification_status
          to NONE with zero drift.
        test_recipe:
          setup:
            - "A subject with an IMPOSED first-offense Disqualification (prior_ipv_count == 1) reached via ADH IPV decision (adjudicator adj-1 != investigator inv-1)."
          setup_api_calls:
            - call: "POST /fraud-recovery/subjects"
              payload: { name: "Pam Res", ssn_last4: "1919", primary_program: "SNAP" }
              as: Intake
              captures: { subj_id: $.data.id }
            - call: "POST /fraud-recovery/referrals"
              payload: { subject_id: "${subj_id}", program: "SNAP", source: "HOTLINE", allegation_summary: "IPV" }
              as: Intake
              captures: { ref_id: $.data.id }
            - call: "POST /fraud-recovery/referrals/${ref_id}/decide"
              payload: { decision: "ACCEPT" }
              as: Intake
            - call: "POST /fraud-recovery/cases"
              payload: { referral_id: "${ref_id}" }
              as: Investigator
              captures: { case_id: $.data.id }
            - call: "POST /fraud-recovery/cases/${case_id}/assign"
              payload: { investigator_user_id: "inv-1" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/evidence"
              payload: { kind: "DOCUMENT", description: "Intent" }
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/submit-review"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/cases/${case_id}/adjudicate"
              payload: { decision: "SUBSTANTIATE" }
              as: Supervisor
            - call: "POST /fraud-recovery/disqualifications"
              payload: { case_id: "${case_id}" }
              as: Investigator
              captures: { disq_id: $.data.id }
            - call: "POST /fraud-recovery/disqualifications/${disq_id}/refer-adh"
              payload: {}
              as: Investigator
              as_user_id: "inv-1"
            - call: "POST /fraud-recovery/hearings"
              payload: { disqualification_id: "${disq_id}", scheduled_date: "2026-05-15T09:00:00Z" }
              as: Adjudicator
              captures: { hearing_id: $.data.id }
            - call: "POST /fraud-recovery/hearings/${hearing_id}/hold"
              payload: {}
              as: Adjudicator
              as_user_id: "adj-1"
            - call: "POST /fraud-recovery/hearings/${hearing_id}/decide"
              payload: { outcome: "IPV" }
