              as_user_id: "${b1_id}"
              captures: { p1: "$.data.id" }
            - call: "POST /sourcing/factories/${f1_id}/compliance-documents"
              payload: { doc_type: "FIRE_SAFETY", issued_date: "2026-01-01", expires_at: "2027-06-01T00:00:00Z" }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { d_fs: "$.data.id" }
            - call: "POST /sourcing/compliance-documents/${d_fs}/verify"
              payload: {}
