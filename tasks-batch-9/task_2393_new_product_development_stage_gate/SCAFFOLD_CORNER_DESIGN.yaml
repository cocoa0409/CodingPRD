              as: InnovationLead
          trigger:
            - call: "GET /innovation-projects/${rs_p_id}"
              as: PortfolioAdmin
            - call: "GET /innovation-projects/${rs_p_id}"
              as: InnovationLead
            - call: "GET /innovation-projects/${rs_p_id}"
              as: GateChair
            - call: "GET /innovation-projects/${rs_p_id}"
              as: FunctionalReviewer
            - call: "GET /innovation-projects/${rs_p_id}"
              as: RegulatoryApprover
            - call: "GET /innovation-projects/${rs_p_id}"
              as: RnDLead
            - call: "GET /innovation-projects/${rs_p_id}"
              as: SalesAccountManager
            - call: "GET /business-cases/${rs_bc_id}"
