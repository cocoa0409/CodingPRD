# =============================================================================
# Task 1805 — School Facility Use & Community Rental (district facilities rental office)
# Scaffold seed tables (§1.0–§1.7). Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1805. School Facility Use & Community Rental (district facilities rental office): facility
  inventory & rental rate class (nonprofit/for-profit/internal), request intake & conflict
  check with school calendar, insurance certificate & fee/deposit, custodial/staffing charge
  & after-hours cost, cancellation policy & refund, damage assessment & deposit forfeiture,
  priority hierarchy in schedule conflicts, recurring seasonal permits.

domain_name: school-facility-rental
api_prefix: /district

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing        # facility intervals, half-open semantics, buffers, calendar conflicts
  secondary_archetype: pricing_engine          # rate classes x staffing x after-hours x deposits x refunds x forfeiture
  complexity_layers:
    - optimistic_concurrency                   # OCC on Permit.version (supersede-on-approve) and SeasonalPermit.version
    - cascading_side_effects                   # approve -> permit issue -> invoice draft -> work order schedule; cancel -> refund -> work order cancel -> waitlist promote
    - dual_variant_calculation                 # provisional (quote at approval) vs final (post-event actuals) invoice
    - rate_threshold_triggers                  # cancellation refund tiers by days-before; headcount insurance tiers
  entity_topology: hybrid                      # District -> SchoolSite -> Facility tree, with cross-cutting RenterOrganization / SchoolCalendarEvent / Permit
  state_machine_shape: compound                # cyclic revision loop on RentalRequest; parallel financial_status x lifecycle on Permit
  relationship_patterns:
    - one_to_many
    - cross_aggregate                          # Permit references RentalRequest (renter aggregate) and Facility (inventory aggregate)
    - self_referential                         # SeasonalPermit.renewed_from_id -> SeasonalPermit.id
  role_model: segregation_of_duties            # damage intake (SiteCoordinator) vs appeal adjudication (FacilitiesDirector) cannot be same operator action on same assessment
  consistency_model: immediate                 # all mutations atomic in-request; derived fields recomputed synchronously

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: SchoolSite
    parent: null
    common_fields: true
    fields:
      - { name: site_code, type: string, source: input, description: "Unique district-wide site code, e.g. 'RHS'", constraints: "unique across all SchoolSite rows" }
      - { name: display_name, type: string, source: input, description: "Human-readable school name" }
      - { name: site_status, type: enum, source: system, description: "ACTIVE | CLOSED — CLOSED sites reject all new requests and auto-cancel pending work", default: ACTIVE }
      - { name: rental_timezone, type: string, source: input, description: "IANA timezone for wall-clock interval interpretation", default: "America/Los_Angeles" }

  - name: Facility
    parent: SchoolSite
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id; owning school" }
      - { name: facility_code, type: string, source: input, description: "Site-local code, e.g. 'GYM-A'", constraints: "unique within site_id" }
      - { name: facility_tier, type: enum, source: input, description: "STANDARD | PREMIUM | ATHLETIC — drives base hourly rate" }
      - { name: capacity, type: integer, source: input, description: "Max occupants; requests with headcount_estimate > capacity rejected", constraints: ">= 1" }
      - { name: setup_buffer_minutes, type: integer, source: input, description: "Mandatory unbookable buffer prepended to every confirmed occupancy", default: 30, constraints: ">= 0, multiple of 15" }
      - { name: teardown_buffer_minutes, type: integer, source: input, description: "Mandatory unbookable buffer appended to every confirmed occupancy", default: 30, constraints: ">= 0, multiple of 15" }
      - { name: requires_custodian, type: boolean, source: input, description: "If true, every permit on this facility generates a CustodialWorkOrder", default: true }
      - { name: facility_status, type: enum, source: system, description: "AVAILABLE | MAINTENANCE_HOLD | RETIRED", default: AVAILABLE }

  - name: RenterOrganization
    parent: null
    common_fields: true
    fields:
      - { name: org_name, type: string, source: input, description: "Legal organization name", constraints: "unique, case-insensitive" }
      - { name: rate_class, type: enum, source: input, description: "INTERNAL | NONPROFIT | FOR_PROFIT — immutable after first SUBMITTED request exists" }
      - { name: nonprofit_registration_no, type: string, source: input, description: "501(c)(3) EIN; required iff rate_class == NONPROFIT", constraints: "null allowed for non-NONPROFIT" }
      - { name: org_standing, type: enum, source: system, description: "GOOD_STANDING | SUSPENDED | BARRED — SUSPENDED on unpaid balance > 30 days or 3 damage forfeits; BARRED is terminal", default: GOOD_STANDING }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Prepaid credit from over-refunds; applied to future invoices before card", default: 0, constraints: ">= 0" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Unpaid invoiced balance; drives SUSPENDED when > 0 for > 30 days", default: 0, constraints: ">= 0" }
      - { name: forfeiture_count, type: integer, source: computed, description: "Lifetime count of deposits fully or partially forfeited", default: 0 }

  - name: RateClassPolicy
    parent: null
    common_fields: true
    fields:
      - { name: policy_code, type: string, source: input, description: "Unique policy identifier, e.g. 'FY2027'", constraints: "unique" }
      - { name: rate_class, type: enum, source: input, description: "INTERNAL | NONPROFIT | FOR_PROFIT" }
      - { name: facility_tier, type: enum, source: input, description: "STANDARD | PREMIUM | ATHLETIC" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Base hourly rental rate for this (rate_class, facility_tier) pair; INTERNAL must be 0", constraints: ">= 0" }
      - { name: deposit_basis_points, type: integer, source: input, description: "Deposit = round_half_up(quoted_rental_fee * deposit_basis_points / 10000), subject to floor", constraints: "0..10000" }
      - { name: deposit_floor_cents, type: integer, source: input, description: "Minimum deposit regardless of fee", default: 10000 }
      - { name: custodial_hourly_cents, type: integer, source: input, description: "Custodial labor rate per hour for this rate class" }
      - { name: effective_from, type: datetime, source: input, description: "Policy applies to events starting at/after this instant" }
      - { name: effective_to, type: datetime, source: input, description: "Policy applies to events starting before this instant; null = open-ended", constraints: "null or > effective_from" }
      - { name: policy_status, type: enum, source: system, description: "ACTIVE | SUPERSEDED — at most one ACTIVE row per (rate_class, facility_tier) at any instant", default: ACTIVE }
      - { name: unique_key, type: string, source: system, description: "Server-composed uniqueness scope: rate_class + '|' + facility_tier + '|' + effective_from" }

  - name: SchoolCalendarEvent
    parent: SchoolSite
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> SchoolSite.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; null means event occupies ALL facilities of the site (blackout)", constraints: "null allowed" }
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: starts_at, type: datetime, source: input, description: "Occupancy start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Occupancy end (exclusive) — half-open interval", constraints: "> starts_at" }
      - { name: event_priority_tier, type: integer, source: input, description: "0 = instructional/athletic school event (highest); 1 = district-sponsored; always outranks any community request", constraints: "0 or 1" }
      - { name: event_status, type: enum, source: system, description: "SCHEDULED | CANCELLED", default: SCHEDULED }

  - name: RentalRequest
    parent: RenterOrganization
    common_fields: true
    fields:
      - { name: renter_org_id, type: string, source: input, description: "FK -> RenterOrganization.id; the renting organization" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id; requested space" }
      - { name: event_title, type: string, source: input, description: "Community event title" }
      - { name: headcount_estimate, type: integer, source: input, description: "Expected attendees; drives insurance tier and capacity check", constraints: ">= 1" }
      - { name: starts_at, type: datetime, source: input, description: "Requested occupancy start (inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Requested occupancy end (exclusive)", constraints: "> starts_at" }
      - { name: request_priority_class, type: enum, source: system, description: "Derived from renter rate_class: INTERNAL->P0, NONPROFIT->P2, FOR_PROFIT->P3; district-sponsored NONPROFIT may be promoted to P1 by FacilitiesDirector" }
      - { name: district_sponsored, type: boolean, source: input, description: "If true and renter is NONPROFIT, request is eligible for P1 promotion", default: false }
      - { name: request_status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | RESUBMITTED | APPROVED | DENIED | WAITLISTED | WITHDRAWN | EXPIRED" }
      - { name: revision_round, type: integer, source: system, description: "Number of UNDER_REVIEW -> REVISION_REQUESTED -> RESUBMITTED loops completed", default: 0, constraints: "<= 3; exceeding 3 forces DENIED" }
      - { name: denial_reason_code, type: enum, source: system, description: "CAPACITY | CALENDAR_CONFLICT | INSURANCE | POLICY | DISCRETIONARY; null unless DENIED", constraints: "null allowed" }
      - { name: submitted_at, type: datetime, source: system, description: "First DRAFT->SUBMITTED timestamp; the canonical conflict-ordering key (never updated on resubmission)", constraints: "null until first submit" }

  - name: InsuranceCertificate
    parent: RenterOrganization
    common_fields: true
    fields:
      - { name: renter_org_id, type: string, source: input, description: "FK -> RenterOrganization.id" }
      - { name: insurer_name, type: string, source: input, description: "Issuing insurer" }
      - { name: per_occurrence_limit_cents, type: integer, source: input, description: "Per-occurrence liability limit", constraints: "> 0" }
      - { name: aggregate_limit_cents, type: integer, source: input, description: "Aggregate liability limit", constraints: ">= per_occurrence_limit_cents" }
      - { name: effective_from, type: datetime, source: input, description: "Coverage window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Coverage window end (exclusive); must cover entire event window", constraints: "> effective_from" }
      - { name: cert_status, type: enum, source: system, description: "VALID | EXPIRED | REVOKED — EXPIRED set by system when clock passes effective_to; REVOKED by FacilitiesDirector", default: VALID }

  - name: Permit
    parent: RentalRequest
    common_fields: true
    fields:
      - { name: rental_request_id, type: string, source: system, description: "FK -> RentalRequest.id; one APPROVED request has exactly one non-VOID permit" }
      - { name: renter_org_id, type: string, source: system, description: "FK -> RenterOrganization.id; denormalized from request at issuance" }
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id; denormalized from request at issuance" }
      - { name: occupancy_start, type: datetime, source: system, description: "Confirmed occupancy start (inclusive) — request window minus setup buffer is NOT included; buffer blocks calendar separately" }
      - { name: occupancy_end, type: datetime, source: system, description: "Confirmed occupancy end (exclusive)" }
      - { name: blocked_start, type: datetime, source: system, description: "occupancy_start minus Facility.setup_buffer_minutes — start of calendar-blocked interval (inclusive)" }
      - { name: blocked_end, type: datetime, source: system, description: "occupancy_end plus Facility.teardown_buffer_minutes — end of calendar-blocked interval (exclusive)" }
      - { name: lifecycle_status, type: enum, source: system, description: "ISSUED | ACTIVE | COMPLETED | CANCELLED | EXPIRED | SUPERSEDED" }
      - { name: financial_status, type: enum, source: system, description: "DEPOSIT_PENDING | SECURED | INVOICED | SETTLED | REFUND_PENDING | REFUNDED | FORFEIT_PENDING | FORFEITED — evolves independently of lifecycle_status (parallel dimension)" }
      - { name: deposit_required_cents, type: integer, source: computed, description: "From RateClassPolicy.deposit_basis_points x quoted rental fee, floored at deposit_floor_cents" }
      - { name: deposit_held_cents, type: integer, source: computed, description: "Deposit actually captured and held; 0 until deposit payment posts" }
      - { name: seasonal_permit_id, type: string, source: system, description: "FK -> SeasonalPermit.id; set when this permit is one occurrence of a recurring seasonal permit", constraints: "null allowed" }
      - { name: superseded_by_permit_id, type: string, source: system, description: "FK -> Permit.id; set when a waitlist promotion supersedes this permit", constraints: "null allowed" }

  - name: CustodialWorkOrder
    parent: Permit
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> Permit.id" }
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: scheduled_start, type: datetime, source: system, description: "blocked_start of permit (custodian arrives at setup)" }
      - { name: scheduled_end, type: datetime, source: system, description: "blocked_end of permit (custodian departs after teardown)" }
      - { name: estimated_hours, type: number, source: computed, description: "(scheduled_end - scheduled_start) in hours, 2-decimal" }
      - { name: actual_hours, type: number, source: input, description: "Verified hours worked; null until VERIFIED", constraints: "null allowed; > 0 when present, 2-decimal" }
      - { name: after_hours_flag, type: boolean, source: computed, description: "True iff any part of [scheduled_start, scheduled_end) falls outside 07:00-18:00 site-local Mon-Fri" }
      - { name: weekend_flag, type: boolean, source: computed, description: "True iff any part falls on Sat/Sun site-local" }
      - { name: wo_status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | VERIFIED | BILLED | CANCELLED" }

  - name: Invoice
    parent: Permit
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> Permit.id" }
      - { name: renter_org_id, type: string, source: system, description: "FK -> RenterOrganization.id" }
      - { name: invoice_kind, type: enum, source: system, description: "PROVISIONAL | FINAL | REFUND | DAMAGE — PROVISIONAL at approval (estimate), FINAL after event completion (actuals), REFUND on cancellation, DAMAGE on forfeiture" }
      - { name: rental_fee_cents, type: integer, source: computed, description: "Tiered hourly charge for occupancy window" }
      - { name: staffing_charge_cents, type: integer, source: computed, description: "CustodialWorkOrder labor charge (estimated for PROVISIONAL, actual for FINAL)" }
      - { name: after_hours_charge_cents, type: integer, source: computed, description: "After-hours/weekend uplift on staffing; 0 when neither flag set" }
      - { name: discount_cents, type: integer, source: computed, description: "Volume discount keyed on pre-discount subtotal tier; evaluation order pinned in calculations.invoice_total" }
      - { name: total_cents, type: integer, source: computed, description: "rental_fee + staffing + after_hours - discount; never negative" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of POSTED PaymentTransactions of kind FEE_PAYMENT against this invoice", default: 0 }
      - { name: invoice_status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | VOID | REFUND_PENDING | REFUNDED" }

  - name: DamageAssessment
    parent: Permit
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> Permit.id" }
      - { name: facility_id, type: string, source: system, description: "FK -> Facility.id" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the SiteCoordinator who recorded intake; segregation-of-duties anchor" }
      - { name: line_items, type: array, source: input, description: "Array of {description, repair_cost_cents}; must be non-empty; each repair_cost_cents > 0" }
      - { name: total_claimed_cents, type: integer, source: computed, description: "Sum of line_items[].repair_cost_cents" }
      - { name: adjudicated_amount_cents, type: integer, source: system, description: "Amount awarded after adjudication; null until ADJUDICATED", constraints: "null allowed; 0 <= x <= total_claimed_cents" }
      - { name: assessment_status, type: enum, source: system, description: "OPEN | ADJUDICATED | APPEALED | FINAL" }

  - name: PaymentTransaction
    parent: Permit
    common_fields: false
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> Permit.id" }
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; null for DEPOSIT_CAPTURE and DEPOSIT_FORFEIT rows", constraints: "null allowed" }
      - { name: txn_kind, type: enum, source: system, description: "DEPOSIT_CAPTURE | FEE_PAYMENT | DEPOSIT_REFUND | DEPOSIT_FORFEIT | FEE_REFUND | DAMAGE_CHARGE" }
      - { name: amount_cents, type: integer, source: system, description: "Always positive; direction implied by txn_kind (captures/payments debit renter; refunds credit renter; forfeit transfers held deposit to district)" }
      - { name: posted_at, type: datetime, source: system, description: "Server logical-clock timestamp when posted" }
      - { name: idempotency_key, type: string, source: input, description: "Client key; duplicate key with identical payload returns original row, different payload -> ERR_IDEMPOTENCY_CONFLICT" }

  - name: SeasonalPermit
    parent: RenterOrganization
    common_fields: true
    fields:
      - { name: renter_org_id, type: string, source: input, description: "FK -> RenterOrganization.id" }
      - { name: facility_id, type: string, source: input, description: "FK -> Facility.id" }
      - { name: series_name, type: string, source: input, description: "e.g. 'Fall Soccer Saturdays'" }
      - { name: recurrence_rule, type: string, source: input, description: "Weekly pattern: 'WEEKLY:SAT:18:00-21:00' — weekday + local start/end time" }
      - { name: season_start, type: datetime, source: input, description: "First possible occurrence date (inclusive)" }
      - { name: season_end, type: datetime, source: input, description: "Last possible occurrence date (inclusive)", constraints: ">= season_start; span <= 120 days" }
      - { name: renewed_from_id, type: string, source: input, description: "FK -> SeasonalPermit.id; prior season this series renews; renewal inherits priority seniority", constraints: "null allowed" }
      - { name: seniority_key, type: datetime, source: system, description: "Effective priority timestamp: renewed_from's seniority_key if renewing, else creation timestamp" }
      - { name: series_status, type: enum, source: system, description: "PENDING_GENERATION | ACTIVE | PARTIALLY_BLOCKED | COMPLETED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SchoolSite
    field: site_status
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /district/sites/{site_id}/close"
        actor: DistrictAdmin
        preconditions:
          - "No Permit with lifecycle_status IN {ISSUED, ACTIVE} on any facility of this site"
        side_effects:
          - "All RentalRequest in {DRAFT, SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, RESUBMITTED, WAITLISTED} targeting facilities of this site -> WITHDRAWN (system)"
          - "All Facility of this site -> RETIRED"

  - entity: Facility
    field: facility_status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE_HOLD
        trigger: "POST /district/facilities/{facility_id}/hold"
        actor: DistrictAdmin
        preconditions: []
        side_effects:
          - "All RentalRequest in {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, RESUBMITTED} for this facility whose window overlaps the hold window -> WAITLISTED with hold_reason=MAINTENANCE"
      - from: MAINTENANCE_HOLD
        to: AVAILABLE
        trigger: "POST /district/facilities/{facility_id}/release_hold"
        actor: DistrictAdmin
        preconditions: []
        side_effects:
          - "Waitlisted requests for this facility become eligible for re-review at next conflict sweep (not auto-approved)"
      - from: [AVAILABLE, MAINTENANCE_HOLD]
        to: RETIRED
        trigger: "system (owning SchoolSite CLOSED) or POST /district/facilities/{facility_id}/retire"
        actor: "DistrictAdmin or system"
        preconditions:
          - "Manual retire: no Permit with lifecycle_status IN {ISSUED, ACTIVE} for this facility"
        side_effects:
          - "Pending requests for this facility -> WITHDRAWN"

  - entity: RenterOrganization
    field: org_standing
    initial_state: GOOD_STANDING
    terminal_states: [BARRED]
    transitions:
      - from: GOOD_STANDING
        to: SUSPENDED
        trigger: "system (outstanding_balance_cents > 0 continuously for 30+ days at clock advance, OR forfeiture_count reaches 3)"
        actor: system
        preconditions: []
        side_effects:
          - "Blocks new RentalRequest submission and Permit activation"
      - from: SUSPENDED
        to: GOOD_STANDING
        trigger: "system (outstanding_balance_cents returns to 0 AND forfeiture_count < 3)"
        actor: system
        preconditions:
          - "outstanding_balance_cents == 0"
        side_effects: []
      - from: [GOOD_STANDING, SUSPENDED]
        to: BARRED
        trigger: "POST /district/renters/{org_id}/bar"
        actor: FacilitiesDirector
        preconditions: []
        side_effects:
          - "All non-terminal RentalRequest of this org -> WITHDRAWN"
          - "All Permit in ISSUED for this org -> CANCELLED with cancellation_class=ADMINISTRATIVE (full refund, no fee)"

  - entity: RentalRequest
    field: request_status
    initial_state: DRAFT
    terminal_states: [DENIED, WITHDRAWN, EXPIRED]
    note: "APPROVED is terminal for the request lifecycle but spawns Permit; the request row remains APPROVED."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /district/renters/{org_id}/requests/{request_id}/submit"
        actor: RenterOrgRep
        preconditions:
          - "RenterOrganization.org_standing == GOOD_STANDING"
          - "headcount_estimate <= Facility.capacity"
          - "starts_at strictly after logical clock now (no past-dated submissions)"
          - "ends_at - starts_at <= 12 hours"
        side_effects:
          - "submitted_at set to logical clock now (first submit only; resubmits do not refresh)"
          - "request_priority_class derived from renter rate_class (+P1 promotion if district_sponsored NONPROFIT)"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /district/requests/{request_id}/begin_review"
        actor: SiteCoordinator
        preconditions:
          - "Facility.facility_status == AVAILABLE"
        side_effects: []

      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /district/requests/{request_id}/request_revision"
        actor: SiteCoordinator
        preconditions:
          - "revision_round < 3"
        side_effects:
          - "revision_round unchanged (increments on RESUBMITTED)"

      - from: REVISION_REQUESTED
        to: RESUBMITTED
        trigger: "PATCH /district/renters/{org_id}/requests/{request_id} followed by POST .../submit (single resubmit endpoint POST /district/renters/{org_id}/requests/{request_id}/resubmit)"
        actor: RenterOrgRep
        preconditions:
          - "Updated headcount_estimate <= Facility.capacity"
        side_effects:
          - "revision_round += 1"
          - "submitted_at NOT refreshed (original seniority preserved)"

      - from: RESUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /district/requests/{request_id}/begin_review"
        actor: SiteCoordinator
        preconditions: []
        side_effects: []
        note: "Cycle UNDER_REVIEW -> REVISION_REQUESTED -> RESUBMITTED -> UNDER_REVIEW may repeat up to 3 times; a 4th request_revision is rejected with ERR_REVISION_LIMIT_EXCEEDED."

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /district/requests/{request_id}/approve"
        actor: FacilitiesDirector
        preconditions:
          - "Conflict check passes: no SchoolCalendarEvent with event_status == SCHEDULED overlapping [starts_at, ends_at) on same facility (or site-wide blackout event)"
          - "No Permit with lifecycle_status IN {ISSUED, ACTIVE} whose [blocked_start, blocked_end) overlaps requested [starts_at - setup_buffer, ends_at + teardown_buffer) on same facility"
          - "Renter has at least one InsuranceCertificate with cert_status == VALID, effective_from <= ends_at AND effective_to >= ends_at (covers full event window), and limits sufficient for headcount tier (calculations.insurance_coverage_sufficiency)"
          - "RenterOrganization.org_standing == GOOD_STANDING"
          - "exactly one ACTIVE RateClassPolicy exists for (renter.rate_class, facility.facility_tier) covering starts_at"
        side_effects:
          - "Creates Permit (lifecycle=ISSUED, financial=DEPOSIT_PENDING) with occupancy/blocked intervals computed from facility buffers"
          - "Creates PROVISIONAL Invoice via calculations.invoice_total (provisional variant)"
          - "If Facility.requires_custodian: creates CustodialWorkOrder (SCHEDULED)"
          - "Any other RentalRequest in {SUBMITTED, UNDER_REVIEW, RESUBMITTED, WAITLISTED} overlapping the new permit's blocked interval on the same facility with LOWER priority -> WAITLISTED (calculations.priority_conflict_resolution)"

      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /district/requests/{request_id}/deny"
        actor: FacilitiesDirector
        preconditions:
          - "denial_reason_code supplied"
        side_effects: []

      - from: [SUBMITTED, UNDER_REVIEW, RESUBMITTED]
        to: WAITLISTED
        trigger: "system (a higher-priority permit was issued overlapping this window) or POST /district/requests/{request_id}/waitlist"
        actor: "system or FacilitiesDirector"
        preconditions: []
        side_effects: []

      - from: WAITLISTED
        to: UNDER_REVIEW
        trigger: "system (blocking permit CANCELLED/SUPERSEDED — promotion sweep) "
        actor: system
        preconditions:
          - "No remaining ISSUED/ACTIVE permit blocks the window"
        side_effects:
          - "Promoted candidate chosen by calculations.priority_conflict_resolution waitlist selector"

      - from: [DRAFT, SUBMITTED, REVISION_REQUESTED, WAITLISTED]
        to: WITHDRAWN
        trigger: "POST /district/renters/{org_id}/requests/{request_id}/withdraw or system (org BARRED / site CLOSED / facility RETIRED)"
        actor: "RenterOrgRep or system"
        preconditions: []
        side_effects: []

      - from: [SUBMITTED, WAITLISTED]
        to: EXPIRED
        trigger: "system (logical clock passes starts_at without approval)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Permit
    field: lifecycle_status
    initial_state: ISSUED
    terminal_states: [COMPLETED, CANCELLED, EXPIRED, SUPERSEDED]
    note: "Permit carries TWO independent state dimensions: lifecycle_status (this machine) and financial_status (next machine). Transitions in one dimension do not imply transitions in the other except where side_effects say so."
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "system (logical clock reaches occupancy_start AND financial_status == SECURED)"
        actor: system
        preconditions:
          - "financial_status == SECURED (deposit captured)"
        side_effects:
          - "CustodialWorkOrder -> IN_PROGRESS"

      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /district/permits/{permit_id}/complete"
        actor: SiteCoordinator
        preconditions:
          - "Logical clock >= occupancy_end"
        side_effects:
          - "CustodialWorkOrder eligible for verify (not automatic)"
          - "FINAL Invoice generated via calculations.invoice_total (final variant using verified actual_hours); PROVISIONAL invoice -> VOID"
          - "financial_status -> INVOICED if not already"

      - from: ISSUED
        to: CANCELLED
        trigger: "POST /district/permits/{permit_id}/cancel"
        actor: "RenterOrgRep or FacilitiesDirector"
        preconditions:
          - "lifecycle_status == ISSUED (cannot cancel after activation; post-event disputes go through DamageAssessment)"
        side_effects:
          - "CustodialWorkOrder -> CANCELLED"
          - "PROVISIONAL Invoice -> VOID"
          - "calculations.cancellation_refund runs: REFUND invoice issued per days-before-event tier; financial_status -> REFUND_PENDING then REFUNDED when refund posts, or -> SETTLED when tier forfeits everything"
          - "Waitlist promotion sweep on the freed interval (may promote WAITLISTED request -> UNDER_REVIEW)"

      - from: ISSUED
        to: EXPIRED
        trigger: "system (logical clock passes occupancy_start while financial_status still DEPOSIT_PENDING — deposit never secured)"
        actor: system
        preconditions: []
        side_effects:
          - "PROVISIONAL Invoice -> VOID"
          - "CustodialWorkOrder -> CANCELLED"
          - "Waitlist promotion sweep on freed interval"

      - from: ISSUED
        to: SUPERSEDED
        trigger: "system (a SchoolCalendarEvent with event_priority_tier == 0 is created overlapping this permit's blocked interval — instructional events preempt community permits)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_permit_id set to null (no replacement permit; field used only when a rebook is issued)"
          - "calculations.cancellation_refund runs with tier ADMINISTRATIVE (full refund of deposit + any fees, no cancellation fee)"
          - "financial_status -> REFUND_PENDING"
          - "CustodialWorkOrder -> CANCELLED"

  - entity: Permit
    field: financial_status
    initial_state: DEPOSIT_PENDING
    terminal_states: [SETTLED, REFUNDED, FORFEITED]
    transitions:
      - from: DEPOSIT_PENDING
        to: SECURED
        trigger: "POST /district/permits/{permit_id}/payments with txn_kind=DEPOSIT_CAPTURE covering deposit_required_cents; OR system at issuance when deposit_required_cents == 0 (INTERNAL rate class)"
        actor: "RenterOrgRep or system"
        preconditions:
          - "Manual payment: amount_cents == deposit_required_cents exactly"
          - "lifecycle_status == ISSUED"
          - "Auto-secure: deposit_required_cents == 0"
        side_effects:
          - "deposit_held_cents = amount_cents (0 for auto-secure)"

      - from: SECURED
        to: INVOICED
        trigger: "system (permit COMPLETED -> FINAL invoice issued)"
        actor: system
        preconditions: []
        side_effects: []

      - from: INVOICED
        to: SETTLED
        trigger: "POST /district/permits/{permit_id}/payments with txn_kind=FEE_PAYMENT bringing invoice amount_paid_cents == total_cents, or system when total_cents == 0 (INTERNAL rate class)"
        actor: "RenterOrgRep or system"
        preconditions:
          - "FINAL invoice in ISSUED status"
        side_effects:
          - "Deposit released: DEPOSIT_REFUND transaction for deposit_held_cents unless DamageAssessment in {OPEN, ADJUDICATED, APPEALED} exists (then deposit stays held -> FORFEIT_PENDING)"
          - "RenterOrganization.outstanding_balance_cents reduced by payment"

      - from: [SECURED, DEPOSIT_PENDING]
        to: REFUND_PENDING
        trigger: "system (permit CANCELLED or SUPERSEDED with refundable amount > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "REFUND invoice issued"

      - from: REFUND_PENDING
        to: REFUNDED
        trigger: "system (DEPOSIT_REFUND / FEE_REFUND transactions post)"
        actor: system
        preconditions: []
        side_effects:
          - "RenterOrganization.credit_balance_cents increased by refund amount when refund_destination == CREDIT"

      - from: [SECURED, INVOICED]
        to: FORFEIT_PENDING
        trigger: "system (DamageAssessment created on COMPLETED permit)"
        actor: system
        preconditions: []
        side_effects:
          - "Deposit release frozen pending adjudication"

      - from: FORFEIT_PENDING
        to: FORFEITED
        trigger: "system (DamageAssessment -> FINAL with adjudicated_amount_cents > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "calculations.deposit_forfeiture_allocation runs: DEPOSIT_FORFEIT transaction up to adjudicated amount; remainder of held deposit refunded; shortfall beyond deposit -> DAMAGE_CHARGE invoice -> RenterOrganization.outstanding_balance_cents"
          - "RenterOrganization.forfeiture_count += 1; if reaches 3 -> org_standing SUSPENDED"

      - from: FORFEIT_PENDING
        to: SETTLED
        trigger: "system (DamageAssessment -> FINAL with adjudicated_amount_cents == 0)"
        actor: system
        preconditions: []
        side_effects:
          - "Full deposit released as DEPOSIT_REFUND"

  - entity: CustodialWorkOrder
    field: wo_status
    initial_state: SCHEDULED
    terminal_states: [BILLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system (permit -> ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: VERIFIED
        trigger: "POST /district/work_orders/{wo_id}/verify"
        actor: CustodialSupervisor
        preconditions:
          - "actual_hours supplied, > 0"
          - "Permit.lifecycle_status == COMPLETED"
        side_effects:
          - "FINAL invoice staffing_charge_cents recomputed with actual_hours (calculations.staffing_charge final variant)"
      - from: VERIFIED
        to: BILLED
        trigger: "system (FINAL invoice ISSUED including this work order's charges)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [SCHEDULED, IN_PROGRESS]
        to: CANCELLED
        trigger: "system (permit CANCELLED / EXPIRED / SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Invoice
    field: invoice_status
    initial_state: DRAFT
    terminal_states: [PAID, VOID, REFUNDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "system (PROVISIONAL: immediately on approve; FINAL: on permit completion; REFUND/DAMAGE: on trigger event)"
        actor: system
        preconditions: []
        side_effects:
          - "RenterOrganization.outstanding_balance_cents += total_cents for FINAL/DAMAGE kinds"
      - from: ISSUED
        to: PAID
        trigger: "system (amount_paid_cents == total_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "RenterOrganization.outstanding_balance_cents -= total_cents (may trigger SUSPENDED -> GOOD_STANDING)"
      - from: [DRAFT, ISSUED]
        to: VOID
        trigger: "system (PROVISIONAL superseded by FINAL; or permit CANCELLED/EXPIRED/SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects:
          - "If was ISSUED: outstanding_balance_cents -= total_cents (reverses the accrual)"
      - from: ISSUED
        to: REFUNDED
        trigger: "system (REFUND invoice's transactions post)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DamageAssessment
    field: assessment_status
    initial_state: OPEN
    terminal_states: [FINAL]
    transitions:
      - from: OPEN
        to: ADJUDICATED
        trigger: "POST /district/damage_assessments/{assessment_id}/adjudicate"
        actor: FacilitiesDirector
        preconditions:
          - "adjudicated_amount_cents <= total_claimed_cents"
          - "X-User-ID != recorded_by_user_id (segregation of duties: intake coordinator may not adjudicate)"
        side_effects:
          - "Permit.financial_status stays FORFEIT_PENDING"
      - from: ADJUDICATED
        to: APPEALED
        trigger: "POST /district/damage_assessments/{assessment_id}/appeal"
        actor: RenterOrgRep
        preconditions:
          - "Within 14 days of adjudication (logical clock)"
        side_effects: []
      - from: APPEALED
        to: FINAL
        trigger: "POST /district/damage_assessments/{assessment_id}/resolve_appeal"
        actor: FacilitiesDirector
        preconditions:
          - "final_amount_cents <= total_claimed_cents"
          - "X-User-ID != recorded_by_user_id"
        side_effects:
          - "adjudicated_amount_cents overwritten by final_amount_cents"
          - "Permit deposit forfeiture allocation runs (financial_status -> FORFEITED or SETTLED)"
      - from: ADJUDICATED
        to: FINAL
        trigger: "system (14-day appeal window elapses with no appeal) or POST /district/damage_assessments/{assessment_id}/accept"
        actor: "system or RenterOrgRep"
        preconditions: []
        side_effects:
          - "Permit deposit forfeiture allocation runs"

  - entity: InsuranceCertificate
    field: cert_status
    initial_state: VALID
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: VALID
        to: EXPIRED
        trigger: "system (logical clock passes effective_to)"
        actor: system
        preconditions: []
        side_effects:
          - "Any RentalRequest in UNDER_REVIEW relying solely on this cert -> REVISION_REQUESTED with reason INSURANCE (renter must upload new cert)"
      - from: VALID
        to: REVOKED
        trigger: "POST /district/insurance/{cert_id}/revoke"
        actor: FacilitiesDirector
        preconditions: []
        side_effects:
          - "Same cascade as EXPIRED"

  - entity: SchoolCalendarEvent
    field: event_status
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /district/calendar_events/{event_id}/cancel"
        actor: DistrictAdmin
        preconditions: []
        side_effects:
          - "If this event had superseded a permit, the permit is NOT un-superseded (supersession is sticky); freed window triggers waitlist sweep"

  - entity: SeasonalPermit
    field: series_status
    initial_state: PENDING_GENERATION
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING_GENERATION
        to: ACTIVE
        trigger: "system (occurrence generation: one RentalRequest+approval pipeline per occurrence date; ALL occurrences that pass conflict/insurance checks get Permits)"
        actor: system
        preconditions:
          - "At least one occurrence approved"
        side_effects:
          - "Creates one RentalRequest per occurrence date (recurrence expansion), each auto-SUBMITTED then batch-approved via priority pipeline"
      - from: PENDING_GENERATION
        to: PARTIALLY_BLOCKED
        trigger: "system (at least one occurrence failed conflict check but at least one succeeded)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [ACTIVE, PARTIALLY_BLOCKED]
        to: COMPLETED
        trigger: "system (logical clock passes season_end)"
        actor: system
        preconditions: []
        side_effects: []
      - from: [PENDING_GENERATION, ACTIVE, PARTIALLY_BLOCKED]
        to: CANCELLED
        trigger: "POST /district/seasonal_permits/{series_id}/cancel"
        actor: "RenterOrgRep or FacilitiesDirector"
        preconditions: []
        side_effects:
          - "All future-dated Permits of the series -> CANCELLED with tier ADMINISTRATIVE (full refund)"
          - "Past/completed permits unaffected"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: permit-supersede-stale-request
    parent_entity: RentalRequest
    write_endpoint: "POST /district/requests/{request_id}/approve"
    occ_field: "expected_request_version"
    description: |
      Approving a RentalRequest whose version has advanced since the approver
      last observed it is rejected. This captures the case where the renter
      resubmitted revised details (which legitimately replaces the terms under
      review) and the approver's view of the request is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: seasonal-renew-stale-series
    parent_entity: SeasonalPermit
    write_endpoint: "POST /district/seasonal_permits"
    occ_field: "expected_series_version"
    description: |
      Creating a renewal SeasonalPermit (renewed_from_id set) against a prior
      series whose version has advanced since the client last observed it is
      rejected. This captures the case where another writer has just renewed
      the same series (renewals legitimately supersede under the seniority
      rule) and the current writer's view of the series is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rental_charge_quote
    trigger: "PROVISIONAL invoice creation at request approval; re-quoted on FINAL if occupancy window unchanged"
    algorithm: tiered_pricing
    formula: |
      # Mode (a): >=3 inputs with non-linear interaction (rate class x facility tier x duration blocks).
      # Duration is billed in whole 30-minute blocks, rounding UP any partial block.
      block_count = ceil((ends_at - starts_at).total_minutes / 30)
      billable_hours = block_count / 2
      policy = the unique ACTIVE RateClassPolicy where
                 rate_class == renter.rate_class AND facility_tier == facility.facility_tier
                 AND effective_from <= starts_at AND (effective_to IS NULL OR starts_at < effective_to)
      base = billable_hours * policy.hourly_rate_cents
      # Long-booking rebate: bookings of >= 6 billable hours get 10% off the base rental fee.
      if billable_hours >= 6: base = round_half_up(base * 0.90)
      rental_fee_cents = base   # INTERNAL policies have hourly_rate_cents == 0 -> fee 0
    input_set: "RentalRequest (window, renter), Facility (tier), RateClassPolicy (rate, effective window)"
    constants:
      BLOCK_MINUTES: 30
      LONG_BOOKING_HOURS: 6
      LONG_BOOKING_DISCOUNT_PCT: 0.10
    precision: "integer cents; round_half_up applied once at the rebate step; per-hour multiplication is exact"
    variants:
      - name: provisional
        when: "at approval"
        difference: "uses requested window [starts_at, ends_at)"
      - name: final
        when: "at completion"
        difference: "uses confirmed occupancy window [occupancy_start, occupancy_end) — identical to provisional unless permit was superseded-partial (not supported), so in practice equal; the variant that diverges in money is staffing_charge"

  - name: staffing_charge
    trigger: "PROVISIONAL invoice (estimated variant) and FINAL invoice (actual variant after work-order verification)"
    algorithm: tiered_pricing
    formula: |
      # Mode (b): nested rounding where ORDER MATTERS — the scaffold pins:
      #   (1) compute each component and round it to integer cents individually,
      #   (2) THEN sum the rounded components.
      # "sum raw then round once" yields different cents and is FORBIDDEN.
      hours = estimated_hours (provisional) | actual_hours (actual)
      base_labor = round_half_up_cents(hours * policy.custodial_hourly_cents)
      # Minimum-shift floor: bill at least 2.0 hours whenever hours > 0.
      if 0 < hours < 2.0: base_labor = round_half_up_cents(2.0 * policy.custodial_hourly_cents)
      staffing_charge_cents = base_labor
    input_set: "CustodialWorkOrder (hours, flags), RateClassPolicy (custodial_hourly_cents)"
    constants:
      MIN_SHIFT_HOURS: 2.0
    precision: "integer cents; each rounded component rounded half-up BEFORE summation"
    variants:
      - name: provisional
        when: "approval-time quote"
        difference: "uses estimated_hours = (blocked_end - blocked_start) in hours; buffers are billable custodial time"
      - name: actual
        when: "post-event final invoice"
        difference: "uses verified actual_hours from CustodialWorkOrder — almost always differs from estimate, exercising the dual-variant money delta"

  - name: after_hours_charge
    trigger: "with staffing_charge on both PROVISIONAL and FINAL invoices"
    algorithm: threshold
    formula: |
      # Uplift applies to the (already rounded) staffing_charge_cents.
      # after_hours: any occupancy-minute outside 07:00-18:00 site-local Mon-Fri -> +50% on staffing
      # weekend:      any occupancy-minute on Sat/Sun site-local                 -> +25% on staffing
      # Both flags may be true; uplifts COMPOSE ADDITIVELY on the staffing base (not multiplicatively):
      uplift_pct = 0.50 * after_hours_flag + 0.25 * weekend_flag
      after_hours_charge_cents = round_half_up_cents(staffing_charge_cents * uplift_pct)
    input_set: "CustodialWorkOrder (after_hours_flag, weekend_flag), staffing_charge_cents"
    constants:
      AFTER_HOURS_PCT: 0.50
      WEEKEND_PCT: 0.25
      BUSINESS_START: "07:00"
      BUSINESS_END: "18:00"
    precision: "integer cents, round_half_up on the product of rounded staffing base"

  - name: invoice_total
    trigger: "invoice creation (PROVISIONAL at approval, FINAL at completion, REFUND at cancel, DAMAGE at forfeiture)"
    algorithm: constraint_propagation
    formula: |
      # Mode (c): circular-looking dependency — volume discount tier is keyed on the
      # PRE-DISCOUNT subtotal, and total = subtotal - discount. Pinned evaluation order:
      #   1. rental  = rental_charge_quote.rental_fee_cents
      #   2. staff   = staffing_charge.staffing_charge_cents
      #   3. after   = after_hours_charge.after_hours_charge_cents   (needs staff — order fixed)
      #   4. subtotal = rental + staff + after
      #   5. discount tier on subtotal: subtotal >= 200000 cents -> 15%; >= 100000 -> 10%; >= 50000 -> 5%; else 0%
      #      (tier selected on PRE-discount subtotal — NOT re-keyed after discounting)
      #   6. discount_cents = round_half_up_cents(subtotal * tier_pct)
      #   7. total_cents = max(0, subtotal - discount_cents)
      # Deposit (separate from invoice): deposit_required = max(deposit_floor_cents,
      #      round_half_up_cents(rental_fee_cents * deposit_basis_points / 10000))
    input_set: "Permit, Facility, RateClassPolicy, CustodialWorkOrder"
    constants:
      TIER1_FLOOR_CENTS: 50000
      TIER1_PCT: 0.05
      TIER2_FLOOR_CENTS: 100000
      TIER2_PCT: 0.10
      TIER3_FLOOR_CENTS: 200000
      TIER3_PCT: 0.15
    precision: "integer cents; discount computed on exact integer subtotal, rounded half-up once"
    variants:
      - name: provisional
        when: "approval"
        difference: "staffing/after-hours computed from estimated_hours"
      - name: final
        when: "completion"
        difference: "staffing/after-hours from verified actual_hours; if the tier threshold is crossed between provisional and final (e.g. actuals push subtotal across 100000), discount tier RE-KEYS on final subtotal — provisional and final totals diverge by more than the staffing delta"

  - name: cancellation_refund
    trigger: "Permit ISSUED -> CANCELLED (renter or admin) or ISSUED -> SUPERSEDED (calendar preemption)"
    algorithm: waterfall_allocation
    formula: |
      # days_before = calendar days between cancellation timestamp and occupancy_start (site-local dates).
      # Boundary precision: comparisons are >= on whole days.
      if cancellation_class == ADMINISTRATIVE:            # supersession, org barred, site closed
          fee_cents = 0;            refund_pct = 1.00
      elif days_before >= 14:       fee_cents = 0;            refund_pct = 1.00
      elif days_before >= 7:        fee_cents = 2500;         refund_pct = 0.50   # $25 processing fee
      else:                         fee_cents = 0;            refund_pct = 0.00   # full forfeiture of paid amounts
      gross_paid = deposit_held_cents + sum(FEE_PAYMENT amounts against this permit's invoices)
      refundable_before_fee = round_half_up_cents(gross_paid * refund_pct)
      refund_total = max(0, refundable_before_fee - fee_cents)
      # Waterfall: refund deposit first (DEPOSIT_REFUND), then fees (FEE_REFUND).
      deposit_refund = min(refund_total, deposit_held_cents)
      fee_refund = refund_total - deposit_refund
      # Forfeited remainder of held deposit posts as DEPOSIT_FORFEIT.
      deposit_forfeit = deposit_held_cents - deposit_refund
    input_set: "Permit (deposit_held_cents, occupancy_start), PaymentTransaction rows for the permit, logical clock"
    constants:
      FULL_REFUND_DAYS: 14
      PARTIAL_REFUND_DAYS: 7
      PROCESSING_FEE_CENTS: 2500
    precision: "integer cents, round_half_up once at refund_pct multiplication"

  - name: deposit_forfeiture_allocation
    trigger: "DamageAssessment -> FINAL"
    algorithm: waterfall_allocation
    formula: |
      # Waterfall over held deposit against adjudicated damage amount:
      applied_to_damage = min(deposit_held_cents, adjudicated_amount_cents)
      deposit_refunded = deposit_held_cents - applied_to_damage          # -> DEPOSIT_REFUND txn
      damage_shortfall = adjudicated_amount_cents - applied_to_damage    # -> DAMAGE_CHARGE invoice if > 0
      # Invariant: applied_to_damage + deposit_refunded == deposit_held_cents
      #            applied_to_damage + damage_shortfall == adjudicated_amount_cents
    input_set: "Permit.deposit_held_cents, DamageAssessment.adjudicated_amount_cents"
    precision: "integer cents; no rounding (allocation only)"

  - name: priority_conflict_resolution
    trigger: "(1) request approval when other pending requests overlap the blocked interval; (2) waitlist promotion sweep when an interval frees"
    algorithm: weighted_scoring
    formula: |
      # Lexicographic priority — NOT a numeric score. Candidate ordering:
      #   1. request_priority_class ASC  (P0 < P1 < P2 < P3)
      #   2. submitted_at ASC            (earliest original submission wins; resubmits don't refresh)
      #   3. created_at ASC              (final deterministic tie-break; id NEVER used)
      # SchoolCalendarEvent rows with event_status == SCHEDULED outrank ALL community requests
      # (tier 0 events also preempt already-ISSUED permits -> SUPERSEDED).
      # Eligibility filter for waitlist promotion:
      #   request_status == WAITLISTED AND window overlaps freed interval AND
      #   renter GOOD_STANDING AND headcount <= capacity AND facility AVAILABLE
      # Empty candidate set -> no promotion (interval simply frees).
    input_set: "RentalRequest (priority class, submitted_at, status), SchoolCalendarEvent, Permit"
    precision: "deterministic total order; no rounding"

  - name: insurance_coverage_sufficiency
    trigger: "request approval (gate) and certificate upload (pre-validation)"
    algorithm: threshold
    formula: |
      # Headcount tiers (boundary precision: >= on lower bound):
      #   headcount < 100          -> per_occurrence >= 100000000 cents ($1M),  aggregate >= 200000000
      #   100 <= headcount < 500   -> per_occurrence >= 200000000,              aggregate >= 400000000
      #   headcount >= 500         -> per_occurrence >= 500000000,              aggregate >= 1000000000
      # A certificate satisfies the request iff:
      #   cert_status == VALID AND effective_from <= request.ends_at AND effective_to >= request.ends_at
      #   AND per_occurrence_limit_cents >= tier_floor AND aggregate_limit_cents >= tier_aggregate_floor
      # INTERNAL rate-class renters are EXEMPT from the insurance gate (district self-insures).
    input_set: "InsuranceCertificate (limits, window, status), RentalRequest.headcount_estimate"
    constants:
      TIER1_HEADCOUNT: 100
      TIER2_HEADCOUNT: 500
    precision: "exact integer comparison, no rounding"

  - name: seasonal_occurrence_expansion
    trigger: "SeasonalPermit creation (PENDING_GENERATION -> ACTIVE/PARTIALLY_BLOCKED)"
    algorithm: chronological
    formula: |
      # Expand recurrence_rule across [season_start, season_end] in site-local time,
      # generating occurrence dates in chronological order. Each occurrence becomes a
      # RentalRequest processed in date order (ASC); a conflict on occurrence N does NOT
      # block occurrence N+1 — failures are collected, and series_status reflects partial success.
      # Renewal seniority: if renewed_from_id set, seniority_key = renewed_from.seniority_key
      # (earlier chain root wins conflicts); else seniority_key = SeasonalPermit.created_at.
      # Rate-year straddle: an occurrence whose starts_at falls under a DIFFERENT active
      # RateClassPolicy than the series' first occurrence is priced under ITS OWN policy
      # (policy selected per-occurrence by starts_at), so a series crossing a rate-year
      # boundary bills later occurrences at the new rate.
    input_set: "SeasonalPermit (recurrence_rule, season window), Facility, SchoolCalendarEvent, RateClassPolicy"
    precision: "date arithmetic in site-local timezone; no monetary rounding"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7; entity-backed roles must own the target resource (RenterOrgRep's X-User-ID must equal the renter org id in the path); segregation of duties: adjudicate/resolve_appeal caller's X-User-ID must differ from the assessment's recorded_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
    error_id: "ERR_FORBIDDEN_FOR_ROLE / ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right (site before facility before permit; org before request). Syntactic request sanity (malformed body, missing required field, enum outside declared set, wrong type) is checked at this same tier before deeper business rules"
    error_id: "ERR_NOT_FOUND (404) for missing path ids; ERR_INVALID_REQUEST (400) for malformed bodies"
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: state
    check: "Target resource lifecycle state permits the operation (e.g., approve requires UNDER_REVIEW; cancel requires ISSUED; terminal states reject all mutations)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Capacity and insurance safety gates: headcount_estimate <= Facility.capacity; insurance certificate VALID, covers full event window, limits sufficient for headcount tier (INTERNAL exempt)"
    error_id: "ERR_CAPACITY_EXCEEDED / ERR_INSURANCE_INSUFFICIENT"
    http_status: 422
    applies_to: "submit, resubmit, approve"
  - priority: 6
    category: business_temporal
    check: "Temporal sanity: ends_at > starts_at; duration <= 12h; starts_at in future at submit; seasonal span <= 120 days; buffers are 15-minute multiples"
    error_id: "ERR_INVALID_TIME_WINDOW"
    http_status: 422
    applies_to: "request create/submit/resubmit, seasonal create, calendar event create"
  - priority: 7
    category: business_constraint
    check: "Resource availability and calendar/permit conflict: site must be ACTIVE (ERR_SITE_CLOSED); facility must be AVAILABLE (ERR_FACILITY_NOT_AVAILABLE); no SCHEDULED SchoolCalendarEvent overlap; no ISSUED/ACTIVE permit blocked-interval overlap on same facility (ERR_SCHEDULE_CONFLICT)"
    error_id: "ERR_SITE_CLOSED / ERR_FACILITY_NOT_AVAILABLE / ERR_SCHEDULE_CONFLICT"
    http_status: 409
    applies_to: "request create/submit, begin_review, approve, seasonal generate, calendar event create, facility create (tier-0 calendar events on occupied intervals allowed, preempting ISSUED permits)"
  - priority: 8
    category: business_referential
    check: "Referential integrity: referenced facility belongs to an ACTIVE site; policy exists for (rate_class, tier, start date); renewed_from_id points to a real COMPLETED/ACTIVE series of the same renter"
    error_id: "ERR_REFERENCE_INVALID"
    http_status: 422
    applies_to: "request create, seasonal create, approve"
  - priority: 9
    category: business_fiscal
    check: "Fiscal gates: renter GOOD_STANDING (no unpaid balance > 30d, forfeits < 3); deposit capture amount == deposit_required_cents exactly; fee payment does not exceed invoice remaining balance"
    error_id: "ERR_RENTER_NOT_IN_GOOD_STANDING / ERR_PAYMENT_AMOUNT_MISMATCH / ERR_OVERPAYMENT"
    http_status: 402
    applies_to: "submit, approve, payments"
  - priority: 10
    category: business_constraint
    check: "Uniqueness: org_name case-insensitive unique; facility_code unique within site; site_code unique; policy (rate_class, tier, effective_from) unique; idempotency key reuse with identical payload replays, different payload conflicts"
    error_id: "ERR_DUPLICATE / ERR_IDEMPOTENCY_CONFLICT"
    http_status: 409
    applies_to: "create endpoints, payments"
  - priority: 11
    category: business_constraint
    check: "Revision loop cap: request_revision when revision_round == 3; cancel on non-ISSUED permit; damage assessment with empty line_items or non-positive repair cost; adjudication/appeal amounts exceeding total_claimed_cents; appeal beyond 14-day window"
    error_id: "ERR_REVISION_LIMIT_EXCEEDED / ERR_PERMIT_NOT_CANCELLABLE / ERR_EMPTY_DAMAGE_CLAIM / ERR_ADJUDICATION_EXCEEDS_CLAIM / ERR_APPEAL_WINDOW_ELAPSED"
    http_status: 409
    applies_to: "request_revision, permit cancel, damage assessment create/adjudicate/appeal"
  - priority: 12
    category: business_referential
    check: "Renewal linkage: renewed_from_id must reference a series owned by the same renter not already renewed"
    error_id: "ERR_RENEWAL_NOT_RENEWABLE"
    http_status: 422
    applies_to: "seasonal_permits create"


