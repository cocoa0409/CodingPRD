# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3022_fixed_price_point_retail_multi_price_conversion
#
# Breadth probe over §1.1–§1.7, walked against references/claim-extraction-guide.md.
# Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: price_point_create_returns_draft_with_zero_issued_stores
        claim_type: Creation
        grounds:
          - entities.PricePoint
          - endpoints.POST_/merchandise/price-points
        distinguishing_aspect: "A price point created with only its three inputs comes back 201 with status DRAFT and issued_store_count 0 — status is never client-supplied, and a DRAFT point is not yet issuable."
        test_recipe:
          setup:
            - "Logical clock at its 2026-09-01T00:00:00Z default. Empty database."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_pp125
              call: "POST /merchandise/price-points"
              payload: { label: "DOLLAR_25", shelf_price_cents: 125, target_landed_cost_ratio: 0.90 }
              as: MerchandiseBuyer
              captures: { pp125_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "PricePoint.${pp125_id}.label == \"DOLLAR_25\" and shelf_price_cents == 125 and target_landed_cost_ratio == 0.90"
            - "PricePoint.${pp125_id}.status == DRAFT"
            - "PricePoint.${pp125_id}.issued_store_count == 0"
            - "PricePoint.${pp125_id}.version == 1 and the response carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: item_get_round_trips_every_declared_cost_input
        claim_type: Retrieval
        grounds:
          - entities.Item
          - endpoints.GET_/merchandise/items/{id}
        distinguishing_aspect: "All eleven Item cost and geometry inputs round-trip through GET unchanged, including the 0.1 sqft_per_unit fraction and the 4.0 shelf_package_capacity that together drive broken_case_allowance."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One price point at 125 cents and one import vendor."
          setup_api_calls:
            - *c_clock
            - *c_pp125
            - &c_vendor
              call: "POST /merchandise/vendors"
              payload: { vendor_name: "Ningbo Home Goods Co", country_of_origin: "CN", import_flag: true }
              as: MerchandiseBuyer
              captures: { vendor_x_id: $.data.id }
            - &c_item
              call: "POST /merchandise/items"
              payload: { sku: "1001", description: "Bath Bar 4ct", unit_retail_cents: 125, commodity_class: "BATH", season_code: "HARVEST_2026", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 105, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i1001_id: $.data.id }
          trigger:
            - call: "GET /merchandise/items/${i1001_id}"
              payload: {}
              as: MerchandiseAnalyst
          assert:
            - "the response status is 200 and response_type is object"
            - "Item.${i1001_id}.sku == \"1001\" and description == \"Bath Bar 4ct\" and commodity_class == BATH and season_code == \"HARVEST_2026\""
            - "Item.${i1001_id}.unit_retail_cents == 125 and base_landed_cost_cents == 105"
            - "Item.${i1001_id}.sqft_per_unit == 0.1 and shelf_package_capacity == 4.0 and units_per_case == 4"
            - "Item.${i1001_id}.fixed_store_handling_cents == 6 and variable_store_cost_cents == 4"
            - "Item.${i1001_id}.sourcing_vendor_id == ${vendor_x_id}"

      - name: items_list_paginates_and_filters_by_price_point
        claim_type: Listing
        grounds:
          - endpoints.GET_/merchandise/items
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three items on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true while offset=2 returns the remaining row with has_more false, and the price_point_id filter narrows the whole set rather than the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One price point at 125 cents and one import vendor."
          setup_api_calls:
            - *c_clock
            - *c_pp125
            - *c_vendor
            - call: "POST /merchandise/items"
              payload: { sku: "1001", description: "Bath Bar 4ct", unit_retail_cents: 125, commodity_class: "BATH", season_code: "", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 105, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i_a: $.data.id }
            - call: "POST /merchandise/items/${i_a}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items"
              payload: { sku: "1002", description: "Sponge 4ct", unit_retail_cents: 125, commodity_class: "BATH", season_code: "", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 105, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i_b: $.data.id }
            - call: "POST /merchandise/items/${i_b}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/items"
              payload: { sku: "1003", description: "Tumbler 4ct", unit_retail_cents: 125, commodity_class: "KITCHEN", season_code: "", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 105, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { i_c: $.data.id }
          trigger:
            - call: "GET /merchandise/items"
              payload: { limit: 2, offset: 0 }
              as: MerchandiseAnalyst
            - call: "GET /merchandise/items"
              payload: { limit: 2, offset: 2 }
              as: MerchandiseAnalyst
            - call: "GET /merchandise/items"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseAnalyst
          assert:
            - "the first read returns 200, response_type array, exactly 2 rows with total_count == 3 and has_more == true"
            - "the second read returns exactly 1 row with total_count == 3 and has_more == false"
            - "the price-point-filtered read returns exactly 2 rows — SKU 1003 was never price-assigned"
            - "GET /merchandise/items?status=DENOMINATED returns exactly 1 row, the Tumbler"
            - "GET /merchandise/items with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0"

      - name: container_get_with_unknown_id_returns_container_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/merchandise/containers/{id}
          - errors.ERR_CONTAINER_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated id on the path produces the entity-specific 404 ERR_CONTAINER_NOT_FOUND, not a generic not-found error and not a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No container has been created."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /merchandise/containers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ImportCoordinator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_CONTAINER_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: season_window_create_without_closes_on_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.SeasonWindow.fields.closes_on
          - validations[priority=7]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "closes_on is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the shape check — it is NOT the 400 ERR_INVALID_SEASON_WINDOW that a present-but-early closes_on produces."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /merchandise/season-windows"
              payload: { season_code: "HARVEST_2026", opens_on: "2026-09-01T00:00:00Z" }
              as: ResetCalendarPlanner
              captures: { err_missing: $.data.error_id }
            - call: "POST /merchandise/season-windows"
              payload: { season_code: "HARVEST_2026", opens_on: "2026-11-30T00:00:00Z", closes_on: "2026-09-01T00:00:00Z" }
              as: ResetCalendarPlanner
              captures: { err_order: $.data.error_id }
          assert:
            - "the omission returns 400 and err_missing == ERR_INVALID_REQUEST"
            - "the reversed-window request returns 400 and err_order == ERR_INVALID_SEASON_WINDOW — a different error id for a present but unusable value"
            - "GET /merchandise/season-windows returns 0 rows — neither request persisted a window"

      - name: container_create_defaults_customs_cleared_false
        claim_type: Defaults
        grounds:
          - entities.Container.fields.customs_cleared
          - entities.Container.fields.status
          - endpoints.POST_/merchandise/containers
        distinguishing_aspect: "customs_cleared declares a default of false, so omitting it stores false rather than null, and the receipt gate therefore refuses the container until the customs-release transition sets it true."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One import vendor."
          setup_api_calls:
            - *c_clock
            - *c_vendor
          trigger:
            - call: "POST /merchandise/containers"
              payload: { vendor_id: "${vendor_x_id}", container_number: "MSCU7654321", port_code: "LAX", dc_code: "DC-ATL", total_freight_cents: 200 }
              as: ImportCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /merchandise/containers/${cont_id}/depart"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/arrive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/customs-hold"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/receive"
              payload: {}
              as: ImportCoordinator
              captures: { err_gate: $.data.error_id }
          assert:
            - "Container.${cont_id}.customs_cleared == false and Container.${cont_id}.status == CUSTOMS_HOLD"
            - "the receive returns 409 and err_gate == ERR_CONTAINER_NOT_RECEIVED — the container is on customs hold, not at port"
            - "Container.${cont_id}.customs_cleared is false, not null — the declared default applied"
            - "after POST /merchandise/containers/${cont_id}/customs-release the same receive returns 200 and Container.${cont_id}.status == RECEIVED"

      - name: item_computed_flags_ignored_input_returns_computed_values
        claim_type: Computed Fields
        grounds:
          - entities.Item.fields.broken_case_allowance
          - entities.Item.fields.is_shelf_overflow
          - calculations.shelf_allocation_waterfall
          - endpoints.POST_/merchandise/allocation-lines/{id}/release
        distinguishing_aspect: "broken_case_allowance is true at creation because 100 * 0.1 exceeds 4.0, and is_shelf_overflow stays false until the release pushes on_hand_units past the shelf and then reads true — neither flag is client-supplied, and the two are independent (one is geometry, one is live stock)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One price point at 125 cents, one import vendor, one store, one RECEIVED container."
          setup_api_calls:
            - *c_clock
            - *c_pp125
            - *c_vendor
            - &c_store
              call: "POST /merchandise/stores"
              payload: { store_number: "1927", shelf_facing_capacity_sqft: 400.0 }
              as: StoreOperationsManager
              captures: { store_id: $.data.id }
            - call: "POST /merchandise/items"
              payload: { sku: "2001", description: "Pine Cleaner 100ct", unit_retail_cents: 125, commodity_class: "HOUSEHOLD", season_code: "HARVEST_2026", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 100, base_landed_cost_cents: 105, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}", is_shelf_overflow: true, broken_case_allowance: false }
              as: MerchandiseBuyer
              captures: { i2001_id: $.data.id }
            - call: "POST /merchandise/items/${i2001_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/containers"
              payload: { vendor_id: "${vendor_x_id}", container_number: "MSCU7654321", port_code: "LAX", dc_code: "DC-ATL", total_freight_cents: 0 }
              as: ImportCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /merchandise/containers/${cont_id}/depart"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/arrive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/customs-release"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/receive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/allocation-lines"
              payload: { container_id: "${cont_id}", store_id: "${store_id}", item_id: "${i2001_id}", sequence: 1, requested_units: 140 }
              as: DistributionCenterOperator
              captures: { line_id: $.data.id }
          trigger:
            - call: "GET /merchandise/items/${i2001_id}"
              payload: {}
              as: MerchandiseAnalyst
              captures: { bca_before: $.data.broken_case_allowance, ovf_before: $.data.is_shelf_overflow, onhand_before: $.data.on_hand_units }
            - call: "POST /merchandise/allocation-lines/${line_id}/release"
              payload: { release_units: 140 }
              as: DistributionCenterOperator
            - call: "GET /merchandise/items/${i2001_id}"
              payload: {}
              as: MerchandiseAnalyst
              captures: { ovf_after: $.data.is_shelf_overflow, onhand_after: $.data.on_hand_units }
          assert:
            - "onhand_before == 0 and ovf_before == false"
            - "bca_before == true — the client sent broken_case_allowance false and is_shelf_overflow true and both were ignored, because 100 * 0.1 > 4.0"
            - "onhand_after == 140 and ovf_after == true — 140 * 0.1 == 14.0 exceeds the 4.0 shelf"
            - "AllocationLine.${line_id}.allocated_units == 140 and overflow_units == 0 — broken_case_allowance armed the base-deck allowance of one full case"
            - "Item.${i2001_id}.status is still PRICE_ASSIGNED — the computed flags never change the lifecycle"

      - name: season_window_status_is_clock_derived_and_never_written
        claim_type: System Fields
        grounds:
          - entities.SeasonWindow.fields.status
          - calculations.season_window_lifecycle
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "SeasonWindow.status is source: system and moves DRAFT → SCHEDULED → OPEN → CLOSED purely as a function of the logical clock, so the same stored row reads SCHEDULED at 2026-09-15, OPEN at 2026-10-01T00:00:00Z exactly, and CLOSED at 2026-11-30T00:00:00.001Z with no write in between."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One season window 2026-10-01T00:00:00Z to 2026-11-30T00:00:00Z, scheduled."
          setup_api_calls:
            - *c_clock
            - call: "POST /merchandise/season-windows"
              payload: { season_code: "HARVEST_2026", opens_on: "2026-10-01T00:00:00Z", closes_on: "2026-11-30T00:00:00Z" }
              as: ResetCalendarPlanner
              captures: { window_id: $.data.id, window_v0: $.data.version }
            - call: "POST /merchandise/season-windows/${window_id}/schedule"
              payload: {}
              as: ResetCalendarPlanner
          trigger:
            - call: "GET /merchandise/season-windows/${window_id}"
              payload: {}
              as: MerchandiseAnalyst
              captures: { st_early: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /merchandise/season-windows/${window_id}"
              payload: {}
              as: MerchandiseAnalyst
              captures: { st_open: $.data.status, window_v1: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /merchandise/season-windows/${window_id}"
              payload: {}
              as: MerchandiseAnalyst
              captures: { st_last_day: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "st_early == SCHEDULED at the 2026-09-01T00:00:00Z default clock"
            - "st_open == OPEN at exactly 2026-10-01T00:00:00Z — opens_on is inclusive"
            - "st_last_day == OPEN at exactly 2026-11-30T00:00:00Z — closes_on is inclusive, the window closes on the instant AFTER it"
            - "window_v1 == window_v0 — every one of those transitions happened without a write"
            - "SeasonWindow.${window_id}.opens_on == 2026-10-01T00:00:00Z and closes_on == 2026-11-30T00:00:00Z, unchanged by the clock"

      - name: price_integrity_audit_has_no_update_or_delete_surface
        claim_type: Immutability
        grounds:
          - entities.PriceIntegrityAudit
          - endpoints.POST_/merchandise/price-integrity-audits
          - endpoints.POST_/merchandise/price-integrity-audits/{id}/resolve
        distinguishing_aspect: "PriceIntegrityAudit is an append-only event row, so the only mutation the scaffold exposes is the OPEN → RESOLVED status action — there is no PUT or DELETE on the collection, and the audited counts cannot be edited after the visit."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One price point at 125 cents and one store."
          setup_api_calls:
            - *c_clock
            - *c_pp125
            - *c_store
            - call: "POST /merchandise/price-integrity-audits"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", audited_at: "2026-09-03T00:00:00Z", observed_item_count: 80, mismatched_item_count: 5 }
              as: StoreOperationsManager
              captures: { audit_id: $.data.id }
          trigger:
            - call: "POST /merchandise/price-integrity-audits/${audit_id}/resolve"
              payload: {}
              as: StoreOperationsManager
              captures: { resolved_status: $.data.status }
            - call: "GET /merchandise/price-integrity-audits/${audit_id}"
              payload: {}
              as: MerchandiseAnalyst
          assert:
            - "resolved_status == RESOLVED"
            - "PriceIntegrityAudit.${audit_id}.observed_item_count == 80 and mismatched_item_count == 5 — untouched by the resolve"
            - "PriceIntegrityAudit.${audit_id}.mismatch_ratio == 0.063 and result == VIOLATION — the verdict is frozen at creation and does not become WITHIN_TOLERANCE when the row is resolved"
            - "the audit row has no updated_at — common_fields is false for this entity and only id and created_at are minted"
            - "Store.${store_id}.open_violation_count == 0 after the resolve"

      - name: aisle_reset_creation_requires_resolvable_store_price_point_and_window
        claim_type: Parent Relationships
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - endpoints.POST_/merchandise/aisle-resets
          - errors.ERR_STORE_NOT_FOUND
          - errors.ERR_SEASON_WINDOW_NOT_FOUND
        distinguishing_aspect: "The three body foreign keys are validated left-to-right in the order the endpoint's input list declares them — store_id, then price_point_id, then season_window_id — so with all three unknown the answer is ERR_STORE_NOT_FOUND, and with only the window unknown it is ERR_SEASON_WINDOW_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One price point at 125 cents and one store."
          setup_api_calls:
            - *c_clock
            - *c_pp125
            - *c_store
          trigger:
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "00000000-0000-4000-8000-000000000001", price_point_id: "00000000-0000-4000-8000-000000000002", season_window_id: "00000000-0000-4000-8000-000000000003", aisle_code: "A11", starts_at: "2026-09-05T00:00:00Z", ends_at: "2026-09-10T00:00:00Z", allocated_shelf_sqft: 50.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { err_all: $.data.error_id }
            - call: "POST /merchandise/aisle-resets"
              payload: { store_id: "${store_id}", price_point_id: "${pp125_id}", season_window_id: "00000000-0000-4000-8000-000000000003", aisle_code: "A11", starts_at: "2026-09-05T00:00:00Z", ends_at: "2026-09-10T00:00:00Z", allocated_shelf_sqft: 50.0, seasonal_changeover: true }
              as: ResetCalendarPlanner
              captures: { err_window: $.data.error_id }
          assert:
            - "the first request returns 404 and err_all == ERR_STORE_NOT_FOUND — store_id is checked before the other two"
            - "err_all != ERR_SEASON_WINDOW_NOT_FOUND and err_all != ERR_PRICE_POINT_NOT_FOUND"
            - "the second request returns 404 and err_window == ERR_SEASON_WINDOW_NOT_FOUND"
            - "GET /merchandise/aisle-resets returns 0 rows"
            - "Store.${store_id}.status == SINGLE_PRICE and Store.${store_id}.version is unchanged by either rejection"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: container_depart_from_booked_then_depart_again_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Container.IN_TRANSIT_to_AT_PORT
          - state_machines.Container.BOOKED_to_IN_TRANSIT
          - errors.ERR_CONTAINER_NOT_BOOKED
        distinguishing_aspect: "IN_TRANSIT has no departure edge of its own, so the second depart is rejected at 409 with ERR_CONTAINER_NOT_BOOKED and the container stays IN_TRANSIT with its version advanced only once."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One import vendor and one booked container."
          setup_api_calls:
            - *c_clock
            - *c_vendor
            - call: "POST /merchandise/containers"
              payload: { vendor_id: "${vendor_x_id}", container_number: "MSCU7654321", port_code: "LAX", dc_code: "DC-ATL", total_freight_cents: 200 }
              as: ImportCoordinator
              captures: { cont_id: $.data.id }
          trigger:
            - call: "POST /merchandise/containers/${cont_id}/depart"
              payload: {}
              as: ImportCoordinator
              captures: { v_ok: $.data.version }
            - call: "POST /merchandise/containers/${cont_id}/depart"
              payload: {}
              as: ImportCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "the first depart returns 200 and Container.${cont_id}.status == IN_TRANSIT with version ${v_ok}"
            - "the second depart returns 409 and err == ERR_CONTAINER_NOT_BOOKED"
            - "Container.${cont_id}.version == ${v_ok} — the refused call did not mutate the container"
            - "Container.${cont_id}.status == IN_TRANSIT, so the refused call did not skip the leg"

      - name: allocation_line_short_after_release_returns_not_allocated
        claim_type: Idempotency
        grounds:
          - state_machines.AllocationLine.ALLOCATED_to_SHORTED
          - state_machines.AllocationLine.ALLOCATED_to_RELEASED
          - errors.ERR_ALLOCATION_LINE_NOT_ALLOCATED
        distinguishing_aspect: "Shorting a line that already released is refused with ERR_ALLOCATION_LINE_NOT_ALLOCATED, and a second short of a line already SHORTED is refused the same way, so neither action is repeatable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One price point at 125 cents, one import vendor, one store, one RECEIVED container, one partially released line."
          setup_api_calls:
            - *c_clock
            - *c_pp125
            - *c_vendor
            - *c_store
            - call: "POST /merchandise/items"
              payload: { sku: "1001", description: "Bath Bar 4ct", unit_retail_cents: 125, commodity_class: "BATH", season_code: "", sqft_per_unit: 0.1, shelf_package_capacity: 4.0, units_per_case: 4, base_landed_cost_cents: 105, fixed_store_handling_cents: 6, variable_store_cost_cents: 4, sourcing_vendor_id: "${vendor_x_id}" }
              as: MerchandiseBuyer
              captures: { item_id: $.data.id }
            - call: "POST /merchandise/items/${item_id}/price-assignments"
              payload: { price_point_id: "${pp125_id}" }
              as: MerchandiseBuyer
            - call: "POST /merchandise/containers"
              payload: { vendor_id: "${vendor_x_id}", container_number: "MSCU7654321", port_code: "LAX", dc_code: "DC-ATL", total_freight_cents: 0 }
              as: ImportCoordinator
              captures: { cont_id: $.data.id }
            - call: "POST /merchandise/containers/${cont_id}/depart"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/arrive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/customs-release"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/containers/${cont_id}/receive"
              payload: {}
              as: ImportCoordinator
            - call: "POST /merchandise/allocation-lines"
              payload: { container_id: "${cont_id}", store_id: "${store_id}", item_id: "${item_id}", sequence: 1, requested_units: 4 }
              as: DistributionCenterOperator
              captures: { line_id: $.data.id }
            - call: "POST /merchandise/allocation-lines/${line_id}/release"
              payload: { release_units: 2 }
              as: DistributionCenterOperator
          trigger:
            - call: "POST /merchandise/allocation-lines/${line_id}/short"
              payload: {}
              as: DistributionCenterOperator
              captures: { short_status: $.data.status }
            - call: "POST /merchandise/allocation-lines/${line_id}/short"
              payload: {}
              as: DistributionCenterOperator
              captures: { err: $.data.error_id }
          assert:
            - "the first short returns 200 and short_status == SHORTED — a partially released line is still ALLOCATED and may be shorted"
            - "the second short returns 409 and err == ERR_ALLOCATION_LINE_NOT_ALLOCATED"
            - "AllocationLine.${line_id}.remaining_units == 0 and released_units == 2 — the short did not rewind the two released units"
            - "GET /merchandise/items/${item_id} reports on_hand_units == 2, so the short did not claw back stock"

      - name: conversion_start_requires_a_single_price_store_and_an_active_price_point
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Store.SINGLE_PRICE_to_CONVERTING
          - errors.ERR_STORE_NOT_SINGLE_PRICE
          - errors.ERR_PRICE_POINT_NOT_ACTIVE
          - validations[priority=10]
        distinguishing_aspect: "Each precondition of the SINGLE_PRICE → CONVERTING edge produces its own error id: a DRAFT destination price point yields ERR_PRICE_POINT_NOT_ACTIVE (409) even from a legal SINGLE_PRICE store, and once the point is activated the same store against a second conversion yields ERR_STORE_NOT_SINGLE_PRICE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE price point at 125 cents, one DRAFT price point at 300 cents, one single-price store."
          setup_api_calls:
            - *c_clock
            - *c_pp125
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/price-points"
              payload: { label: "THREE_DOLLAR_25", shelf_price_cents: 300, target_landed_cost_ratio: 0.40 }
              as: MerchandiseBuyer
              captures: { pp300_draft_id: $.data.id }
            - *c_store
          trigger:
            - call: "POST /merchandise/stores/${store_id}/conversions"
              payload: { to_price_point_id: "${pp300_draft_id}" }
              as: StoreOperationsManager
              captures: { err_not_active: $.data.error_id }
            - call: "POST /merchandise/price-points/${pp300_draft_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - call: "POST /merchandise/stores/${store_id}/conversions"
              payload: { to_price_point_id: "${pp300_draft_id}" }
              as: StoreOperationsManager
            - call: "POST /merchandise/stores/${store_id}/conversions"
              payload: { to_price_point_id: "${pp125_id}" }
              as: StoreOperationsManager
              captures: { err_state: $.data.error_id }
          assert:
            - "the first attempt returns 409 and err_not_active == ERR_PRICE_POINT_NOT_ACTIVE — a DRAFT price point is not issuable"
            - "the second attempt after activation returns 200"
            - "the third attempt returns 409 and err_state == ERR_STORE_NOT_SINGLE_PRICE"
            - "Store.${store_id}.status == CONVERTING and Store.${store_id}.conversion_price_point_id == ${pp300_draft_id} after all three"

      - name: audit_resolve_after_auto_resolution_returns_already_resolved
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.PriceIntegrityAudit.OPEN_to_RESOLVED
          - errors.ERR_AUDIT_ALREADY_RESOLVED
        distinguishing_aspect: "RESOLVED is terminal for the audit even though two different triggers can reach it: the manual resolve and the automatic close driven by a completed store conversion. Resolving an already-RESOLVED row is always a 409."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ACTIVE price point at 125 cents, one store, one OPEN violation audit."
          setup_api_calls:
            - *c_clock
            - *c_pp125
            - call: "POST /merchandise/price-points/${pp125_id}/activate"
              payload: {}
              as: MerchandiseBuyer
            - *c_store
