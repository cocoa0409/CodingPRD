          - entities.ContentItem.fields.last_audit_verdict
          - entities.PerformanceSnapshot.fields.period_start
          - entities.PerformanceSnapshot.fields.period_end
        distinguishing_aspect: |
          The item's only pre-window snapshot straddles the baseline start by two days and its only
          trailing snapshot ends after the baseline closes, so the fully-contained test leaves
          baseline_sessions at exactly 0; the calculation must short-circuit to decay_pct 0.00 with
          refresh_required false and verdict KEEP rather than divide 900 trailing sessions by zero or
