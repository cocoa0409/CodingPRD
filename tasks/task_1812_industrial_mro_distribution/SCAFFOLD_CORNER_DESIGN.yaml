              as: DistributionAdmin
              captures: { o9: $.data.id }
            - call: "POST /mro/orders"
              payload: { customer_id: "${cust_id}", fulfillment_branch_id: "${br_id}", fulfillment_method: "WILL_CALL", lines: [{ item_id: "${it_id}", qty: 10 }] }
              as: DistributionAdmin
              captures: { o10: $.data.id }
            - call: "GET /mro/orders/${o9}/lines"
              as: DistributionAdmin
              captures: { u9: "$.data[0].unit_price_cents", t9: "$.data[0].line_total_cents" }
            - call: "GET /mro/orders/${o10}/lines"
              as: DistributionAdmin
              captures: { u10: "$.data[0].unit_price_cents", t10: "$.data[0].line_total_cents" }
          assert:
            - "u9 == 1000 and t9 == 9000 (9 < 10: no tier)"
            - "u10 == 970 and t10 == 9700 (10 >= 10: round_half_up(1000*0.97) = 970)"

      - name: central_selector_prefers_highest_available
        claim_type: correct_result
        grounds: [calculations.allocation_waterfall]
        distinguishing_aspect: "Central bucket selector: among CENTRAL locations with available stock the one with the highest available_qty is picked (B with 9 beats A with 4), exactly one central is used, and the line reports SPLIT_STOCK."
        test_recipe:
          setup: ["Customer; STOCKED item list 800; branch with 0 stock; CENTRAL A restocked 4 (created first); CENTRAL B restocked 9 (created second)"]
          setup_api_calls:
            - call: "POST /mro/customers"
              payload: { account_number: "CS-1", display_name: "CentralSel Co", credit_limit_cents: 100000, primary_ship_to_state: "OH" }
              as: DistributionAdmin
              captures: { cust_id: $.data.id }
