              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC" }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "RESIDUAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id, c_v1: $.data.version }
            - call: "POST /disability/claims/${c_id}/income-reports"
              payload: { effective_month: 3, current_monthly_income_cents: 500000, expected_claim_version: "${c_v1}" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { ir1_id: $.data.id }
            - call: "GET /disability/claims/${c_id}"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_v2: $.data.version }
          trigger:
            - call: "POST /disability/claims/${c_id}/income-reports"
              payload: { effective_month: 5, current_monthly_income_cents: 400000, expected_claim_version: "${c_v2}" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { ir2_id: $.data.id }
            - call: "GET /disability/claims/${c_id}/income-reports"
              payload: {}
              as: ClaimsAdjudicator
          assert:
            - "HTTP 201 for the second report ${ir2_id}"
            - "The prior report ${ir1_id} now has is_superseded == true (effective_month 3 < 5)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: offset_create_immediately_recomputes_net_in_same_session
        claim_type: immediate
        grounds:
          - calculations.net_benefit_cents
          - entities.BenefitPeriod.fields.net_benefit_cents
        distinguishing_aspect: "Immediate consistency: creating an ESTIMATED offset over an already-accrued month recomputes that BenefitPeriod's net_benefit_cents (380000) visible on the next read with no delay."
        test_recipe:
          setup: ["Insurer at month 5; APPROVED TOTAL claim; one BenefitPeriod accrued at month 3 (net 500000, no offsets)."]
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "CM1 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/insurers/${ins_id}/clock/advance"
              payload: { by_months: 5 }
              as: SystemOperator
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 60 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH CM1", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC" }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/begin-review"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/approve"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/benefit-periods"
              payload: { coverage_month: 3 }
              as: ClaimsAdjudicator
              captures: { bp_id: $.data.id }
          trigger:
            - call: "POST /disability/claims/${c_id}/offset-awards"
              payload: { offset_source: "SSDI", monthly_offset_cents: 120000, start_month: 3, end_month: 5 }
              as: ClaimsAdjudicator
            - call: "GET /disability/benefit-periods/${bp_id}"
              payload: {}
              as: ClaimsAdjudicator
              captures: { net: $.data.net_benefit_cents }
          assert:
            - "After offset create, BenefitPeriod.${bp_id}.net_benefit_cents == 380000 (immediately recomputed)"

  # ===========================================================================
  - section: validations
    instances:
      - name: error_elimination_not_satisfied_excluded
        claim_type: Violation → Error
        grounds:
          - errors[ERR_ELIMINATION_NOT_SATISFIED]
        excluded_because:
          difficulty_instance: boundary_precision_check / elimination_satisfied_boundary_ge_on_approve
          rationale: "ERR_ELIMINATION_NOT_SATISFIED is asserted as the month-2 failure path of the named §1.8 boundary instance."
      - name: error_benefit_period_exhausted_excluded
        claim_type: Violation → Error
        grounds:
          - errors[ERR_BENEFIT_PERIOD_WOULD_EXCEED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / payable_constraint_vs_fiscal_on_accrual_constraint_wins
          rationale: "The would-exceed fiscal path is the lower-priority loser in the named §1.8 priority-conflict instance."
      - name: error_coverage_month_occupied_excluded
        claim_type: Violation → Error
        grounds:
          - errors[ERR_COVERAGE_MONTH_OCCUPIED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / benefit_period_half_open_consecutive_months_allowed
          rationale: "ERR_COVERAGE_MONTH_OCCUPIED is asserted on the duplicate-month leg of the named §1.8 overlap instance."
      - name: error_offset_window_overlap_excluded
        claim_type: Violation → Error
        grounds:
          - errors[ERR_OFFSET_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / offset_window_closed_interval_touching_collides
          rationale: "ERR_OFFSET_WINDOW_OVERLAP is the asserted outcome of the named §1.8 closed-interval overlap instance."
      - name: error_policy_not_active_excluded
        claim_type: Violation → Error
        grounds:
          - errors[ERR_POLICY_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / claim_approve_blocked_by_policy_premium_default
          rationale: "ERR_POLICY_NOT_ACTIVE is the asserted outcome of the named §1.8 cross-entity instance."
      - name: error_claim_not_payable_excluded
        claim_type: Violation → Error
        grounds:
          - errors[ERR_CLAIM_NOT_PAYABLE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / benefit_accrual_blocked_by_claim_not_approved
          rationale: "ERR_CLAIM_NOT_PAYABLE is the asserted outcome of the named §1.8 cross-entity accrual instance."
