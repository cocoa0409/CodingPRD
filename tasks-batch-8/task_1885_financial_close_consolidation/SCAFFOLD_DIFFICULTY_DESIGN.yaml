# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1885 Financial Close & Consolidation. 9 rules × 2 instances = 18.
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and replays against §1.5.
#
# Conventions used across recipes:
#   - All amounts are integer minor units of the entity's functional currency.
#   - Period P1: 2026-01-01T00:00:00Z .. 2026-01-31T00:00:00Z (period_end is the
#     31st at 00:00:00Z — i.e. the close of Jan 30 / boundary of Jan 31).
#     period_start = 2026-01-01T00:00:00Z, period_end = 2026-01-31T00:00:00Z.
#   - Logical clock is set explicitly in every recipe that depends on time; the
#     server default (2026-08-01T00:00:00Z) is AFTER every fixture date here,
#     so recipes that need "inside the period" MUST set the clock back.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: currency_translation_current_rate_vs_temporal_cta_divergence
        grounds:
          - calculations.currency_translation
          - entities.Entity.fields.translation_method
          - entities.EntityPeriod.fields.cta_minor
        distinguishing_aspect: |
          Same trial balance and same FX rates, two translation_method variants
          on the Entity domain: CURRENT_RATE produces cta_minor == 50000 (the
          period-end vs average-rate plug) while TEMPORAL produces cta_minor == 0
          (temporal remeasurement bypasses CTA). Identical inputs, divergent
          observable outputs on the EntityPeriod.
        test_recipe:
          setup:
            - "Period P1 (2026-01) opened; reporting currency USD; materiality 10000"
            - "Entity A: functional EUR, translation_method CURRENT_RATE, ownership 100"
            - "Entity B: functional EUR, translation_method TEMPORAL, ownership 100"
            - "Both entity-periods have a single POSTED JE netting to trial_balance_minor == 1000000 (one DEBIT line 1000000 to account 1000, one CREDIT line 1000000 to 2000)"
            - "FxRate EUR->USD PERIOD_END 1.10, AVERAGE 1.05, HISTORICAL 1.02 (all effective 2026-01-31T00:00:00Z)"
            - "Translation run executed for both entity-periods"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "EUCUR", name: "EU Current", functional_currency: EUR, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_cur: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "EUTMP", name: "EU Temporal", functional_currency: EUR, ownership_pct: 100, translation_method: TEMPORAL }
              as: Controller
              captures: { ent_tmp: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_cur}" }
              as: Controller
              captures: { ep_cur: "$.data[0].id" }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_tmp}" }
              as: Controller
              captures: { ep_tmp: "$.data[0].id" }
            # post a balanced JE of net +1,000,000 on each entity-period
            - call: "POST /close/entity-periods/${ep_cur}/journal-entries"
              payload: { je_type: RECLASS, entry_date: "2026-01-20T00:00:00Z", functional_currency: EUR, lines: [ { line_no: 1, account_code: "1000-CASH", direction: DEBIT, amount_minor: 1000000 }, { line_no: 2, account_code: "2000-REV", direction: CREDIT, amount_minor: 1000000 } ] }
              as: Preparer
              captures: { je_cur: $.data.id }
            - call: "POST /close/entity-periods/${ep_tmp}/journal-entries"
              payload: { je_type: RECLASS, entry_date: "2026-01-20T00:00:00Z", functional_currency: EUR, lines: [ { line_no: 1, account_code: "1000-CASH", direction: DEBIT, amount_minor: 1000000 }, { line_no: 2, account_code: "2000-REV", direction: CREDIT, amount_minor: 1000000 } ] }
              as: Preparer
              captures: { je_tmp: $.data.id }
            # FX rates
            - { call: "POST /close/periods/${per_id}/fx-rates", payload: { from_currency: EUR, to_currency: USD, rate_kind: PERIOD_END, rate: 1.10, effective_at: "2026-01-31T00:00:00Z" }, as: Controller }
            - { call: "POST /close/periods/${per_id}/fx-rates", payload: { from_currency: EUR, to_currency: USD, rate_kind: AVERAGE, rate: 1.05, effective_at: "2026-01-31T00:00:00Z" }, as: Controller }
            - { call: "POST /close/periods/${per_id}/fx-rates", payload: { from_currency: EUR, to_currency: USD, rate_kind: HISTORICAL, rate: 1.02, effective_at: "2026-01-31T00:00:00Z" }, as: Controller }
            # drive both JEs DRAFT->SUBMITTED->APPROVED->POSTED (RECLASS needs no doc)
            - { call: "POST /close/journal-entries/${je_cur}/submit", payload: {}, as: Preparer }
            - { call: "POST /close/journal-entries/${je_cur}/approve", payload: {}, as: Approver }
            - { call: "POST /close/journal-entries/${je_cur}/post", payload: {}, as: Preparer }
            - { call: "POST /close/journal-entries/${je_tmp}/submit", payload: {}, as: Preparer }
            - { call: "POST /close/journal-entries/${je_tmp}/approve", payload: {}, as: Approver }
            - { call: "POST /close/journal-entries/${je_tmp}/post", payload: {}, as: Preparer }
            # translation runs
            - { call: "POST /close/entity-periods/${ep_cur}/translate", payload: {}, as: Controller }
            - call: "POST /close/entity-periods/${ep_tmp}/translate"
              payload: {}
              as: Controller
          trigger:
            - call: "GET /close/entity-periods/${ep_cur}"
              payload: {}
              as: Controller
            - call: "GET /close/entity-periods/${ep_tmp}"
              payload: {}
              as: Controller
          assert:
            - "EntityPeriod.${ep_cur}.trial_balance_minor == 1000000"
            - "EntityPeriod.${ep_cur}.translated_balance_minor == 1100000"
            - "EntityPeriod.${ep_cur}.cta_minor == 50000"
            - "EntityPeriod.${ep_tmp}.trial_balance_minor == 1000000"
            - "EntityPeriod.${ep_tmp}.translated_balance_minor == 1100000"
            - "EntityPeriod.${ep_tmp}.cta_minor == 0"
            - "EntityPeriod.${ep_cur}.cta_minor != EntityPeriod.${ep_tmp}.cta_minor"

      - name: accrual_estimation_provisional_vs_final_material_trueup
        grounds:
          - calculations.accrual_estimation
          - entities.AccrualEstimate.fields.true_up_delta_minor
          - state_machines.AccrualEstimate.PROVISIONAL_to_TRUED_UP
        distinguishing_aspect: |
          Second dual-variant instance on a DIFFERENT entity domain
          (AccrualEstimate, not Entity translation): the PROVISIONAL
          system-computed estimate (PRIOR_3M_AVG basis) diverges from the
          preparer-supplied FINAL actual, and the true_up_delta at-or-above
          materiality gates the entity-period's RECONCILED transition. The two
          variants of the same underlying amount produce different downstream
          state (blocked vs allowed).
        test_recipe:
          setup:
            - "Period P1 opened; materiality_threshold_minor == 10000"
            - "One Entity (USD, ownership 100, CURRENT_RATE); its EntityPeriod has one CONFIRMED SubledgerCutoff (AR) so it is SUBLEDGER_CUT"
            - "AccrualEstimate on account 6100-SALARIES, basis PRIOR_PERIOD, provisional computed at SUBLEDGER_CUT"
            - "Preparer true-ups the accrual to a final that exceeds provisional by exactly the materiality threshold (delta == 10000)"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/entity-periods/${ep_id}/subledger-cutoffs"
              payload: { subledger: AR, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_id: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/cut", payload: {}, as: Preparer }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/confirm", payload: {}, as: Approver, as_user_id: "approver-1" }
            - call: "POST /close/entity-periods/${ep_id}/accruals"
              payload: { subledger_cutoff_id: "${cut_id}", account_code: "6100-SALARIES", basis: PRIOR_PERIOD }
              as: Preparer
              captures: { acc_id: $.data.id }
            # the accrual spec was created AFTER the entity-period reached SUBLEDGER_CUT,
            # so drive its provisional explicitly. PRIOR_PERIOD with no prior periods → 0.
            - call: "POST /close/accruals/${acc_id}/recompute"
              payload: {}
              as: Preparer
              captures: { acc_prov: $.data.provisional_amount_minor }
          trigger:
            # provisional == 0 (no prior period) → final 10000 gives delta == 10000 == materiality
            - call: "POST /close/accruals/${acc_id}/true-up"
              payload: { final_amount_minor: 10000 }
              as: Preparer
              captures: { acc_delta: $.data.true_up_delta_minor }
            - call: "POST /close/entity-periods/${ep_id}/mark-reconciled"
              payload: {}
              as: Preparer
              captures: { err: $.data.error_id }
          assert:
            - "AccrualEstimate.${acc_id}.provisional_amount_minor == 0 (PRIOR_PERIOD basis, no prior periods)"
            - "AccrualEstimate.${acc_id}.true_up_delta_minor == 10000 (final 10000 - provisional 0)"
            - "mark-reconciled rejected with ERR_ACCRUAL_MATERIAL_TRUEUP (abs(delta) == materiality 10000 uses >=, and delta unposted)"
            - "EntityPeriod.${ep_id}.status remains SUBLEDGER_CUT (not RECONCILED)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: flux_variance_materiality_or_pct_tiered_gate
        grounds:
          - calculations.flux_variance
          - entities.FluxExplanation.fields.requires_explanation
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: requires_explanation
          = (abs(variance) >= materiality) OR (variance_pct >= 10.0), where
          variance_pct divides by max(abs(prior),1) — a conditional floor on the
          denominator. Three inputs (prior, current, materiality) interact through
          a branch (OR) and a nested max; the pct path can fire when the absolute
          path cannot (prior==0 floor) and vice versa.
        test_recipe:
          setup:
            - "Period P1 opened; materiality_threshold_minor == 10000"
            - "One entity-period exists"
            - "Three FluxExplanation rows: (F1) prior 0 / current 5000 (abs 5000 < 10000 but pct huge via denominator floor); (F2) prior 1000000 / current 1000500 (abs 500 < materiality, pct 0.05 < 10); (F3) prior 100000 / current 110000 (abs 10000 == materiality AND pct 10.0 == threshold)"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/entity-periods/${ep_id}/flux"
              payload: { account_code: "4000-REV", prior_balance_minor: 0, current_balance_minor: 5000 }
              as: Preparer
              captures: { f1: $.data.id, f1_req: $.data.requires_explanation }
            - call: "POST /close/entity-periods/${ep_id}/flux"
              payload: { account_code: "5000-COGS", prior_balance_minor: 1000000, current_balance_minor: 1000500 }
              as: Preparer
              captures: { f2: $.data.id, f2_req: $.data.requires_explanation }
            - call: "POST /close/entity-periods/${ep_id}/flux"
              payload: { account_code: "6000-OPEX", prior_balance_minor: 100000, current_balance_minor: 110000 }
              as: Preparer
              captures: { f3: $.data.id, f3_req: $.data.requires_explanation, f3_pct: $.data.variance_pct }
          trigger:
            - { call: "GET /close/entity-periods/${ep_id}/flux", payload: {}, as: Preparer }
          assert:
            - "FluxExplanation.${f1}.requires_explanation == true (pct path via max(prior,1) floor: 5000/1*100 = 500000.0 >= 10.0 even though abs 5000 < 10000)"
            - "FluxExplanation.${f2}.requires_explanation == false (abs 500 < 10000 AND pct 0.05 < 10.0)"
            - "FluxExplanation.${f3}.requires_explanation == true (abs == materiality boundary uses >=; pct == 10.0 uses >=)"
            - "FluxExplanation.${f3}.variance_pct == 10.0"

      - name: intercompany_elimination_per_side_rounding_then_min
        grounds:
          - calculations.intercompany_elimination
          - entities.ElimPair.fields.eliminated_amount_minor
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: each side is translated
          to reporting currency and rounded FIRST (round_half_up per side), THEN
          MIN is taken. Rounding each side independently before MIN can diverge
          from translating the raw MIN; the scaffold pins per-side-round-then-MIN,
          and the residual sign indicates which side was larger after rounding.
        test_recipe:
          setup:
            - "Period P1 opened (reporting USD, materiality 10000)"
            - "Entity A functional EUR, Entity B functional USD (both ownership 100)"
            - "FxRate EUR->USD PERIOD_END 1.10 (effective 2026-01-31)"
            - "Both entity-periods advanced to RECONCILED (cutoff confirmed, no recons, no accruals, translation run done)"
            - "ElimPair: side A (EUR) amount 100000; side B (USD) amount -109800"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "EUA", name: "EU A", functional_currency: EUR, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_a: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "USB", name: "US B", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_b: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_a}" }
              as: Controller
              captures: { ep_a: "$.data[0].id" }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_b}" }
              as: Controller
              captures: { ep_b: "$.data[0].id" }
            - { call: "POST /close/periods/${per_id}/fx-rates", payload: { from_currency: EUR, to_currency: USD, rate_kind: PERIOD_END, rate: 1.10, effective_at: "2026-01-31T00:00:00Z" }, as: Controller }
            # cutoffs for both, so they can reach RECONCILED
            - call: "POST /close/entity-periods/${ep_a}/subledger-cutoffs"
              payload: { subledger: AR, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_a: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_a}/cut", payload: {}, as: Preparer }
            - { call: "POST /close/subledger-cutoffs/${cut_a}/confirm", payload: {}, as: Approver, as_user_id: "approver-1" }
            - call: "POST /close/entity-periods/${ep_b}/subledger-cutoffs"
              payload: { subledger: AP, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_b: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_b}/cut", payload: {}, as: Preparer }
            - { call: "POST /close/subledger-cutoffs/${cut_b}/confirm", payload: {}, as: Approver, as_user_id: "approver-1" }
            # translate both (USD side identity via reporting currency; EUR side needs the rate)
            - { call: "POST /close/entity-periods/${ep_a}/translate", payload: {}, as: Controller }
            - { call: "POST /close/entity-periods/${ep_b}/translate", payload: {}, as: Controller }
            # mark both reconciled (no recon rows at all → gates pass trivially)
            - { call: "POST /close/entity-periods/${ep_a}/mark-reconciled", payload: {}, as: Preparer }
            - { call: "POST /close/entity-periods/${ep_b}/mark-reconciled", payload: {}, as: Preparer }
            # declare the pair
            - call: "POST /close/periods/${per_id}/elim-pairs"
              payload: { entity_period_id_a: "${ep_a}", entity_period_id_b: "${ep_b}", account_code: "1500-IC_AR", amount_a_minor: 100000, amount_b_minor: -109800 }
              as: Preparer
              captures: { pair_id: $.data.id }
          trigger:
            - call: "POST /close/elim-pairs/${pair_id}/match"
              payload: {}
              as: Preparer
              captures: { eliminated: $.data.eliminated_amount_minor, residual: $.data.residual_minor }
          assert:
            - "ElimPair.${pair_id}.eliminated_amount_minor == 109800  (min(round(100000*1.10)=110000, round(109800*1.0)=109800))"
            - "ElimPair.${pair_id}.residual_minor == 200  (110000 - 109800; positive => side A larger after per-side rounding)"
            - "abs(residual_minor) == 200 <= 500 tolerance"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: journal_entry_reject_rework_cycle
        grounds:
          - state_machines.JournalEntry.REJECTED_to_DRAFT
          - state_machines.JournalEntry.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Cycle on the JournalEntry entity: DRAFT → SUBMITTED → REJECTED →
          DRAFT (rework) → SUBMITTED again. The machine loops rather than
          terminating, and rejection_reason is cleared on rework — observable
          state that a linear pipeline would never revisit.
        test_recipe:
          setup:
            - "Period P1 opened; one entity-period PREPARING"
            - "A RECLASS JE (no doc gate) with balanced lines, submitted then rejected with a reason"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/entity-periods/${ep_id}/journal-entries"
              payload: { je_type: RECLASS, entry_date: "2026-01-20T00:00:00Z", functional_currency: USD, lines: [ { line_no: 1, account_code: "6100", direction: DEBIT, amount_minor: 5000 }, { line_no: 2, account_code: "6150", direction: CREDIT, amount_minor: 5000 } ] }
              as: Preparer
              captures: { je_id: $.data.id }
            - { call: "POST /close/journal-entries/${je_id}/submit", payload: {}, as: Preparer }
            - { call: "POST /close/journal-entries/${je_id}/reject", payload: { rejection_reason: "wrong account mapping" }, as: Approver, as_user_id: "approver-1" }
          trigger:
            - call: "POST /close/journal-entries/${je_id}/rework"
              payload: {}
              as: Preparer
              captures: { st: $.data.status }
            - call: "POST /close/journal-entries/${je_id}/submit"
              payload: {}
              as: Preparer
              captures: { st2: $.data.status }
          assert:
            - "after rework: JournalEntry.${je_id}.status == DRAFT (cycled back)"
            - "after rework: JournalEntry.${je_id}.rejection_reason is cleared (null)"
            - "after second submit: JournalEntry.${je_id}.status == SUBMITTED (cycle traversed DRAFT→SUBMITTED→REJECTED→DRAFT→SUBMITTED)"

      - name: close_task_dag_dependency_unblock_cascade
        grounds:
          - state_machines.CloseTask.BLOCKED_to_READY
          - state_machines.CloseTask.IN_PROGRESS_to_DONE
        distinguishing_aspect: |
          Non-linear shape on the CloseTask entity (different from JournalEntry):
          a DAG fan-out where task T3 depends on {T1, T2}; T3 stays BLOCKED until
          BOTH dependencies reach DONE/WAIVED, and the second completion flips T3
          BLOCKED → READY via system cascade. Compound/derived readiness, not a
          linear pipeline.
        test_recipe:
          setup:
            - "Period P1 opened; one entity-period"
            - "T1 (SL_CUTOFF, no deps), T2 (ACCRUALS, no deps), T3 (CONSOLIDATE, depends_on [T1, T2])"
            - "Both T1 and T2 completed by their assignee; T3 observed after each"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/periods/${per_id}/tasks"
              payload: { entity_period_id: "${ep_id}", task_key: "SL_CUTOFF", title: "Cut subledgers", assignee_user_id: "prep-1", due_offset_hours: 24 }
              as: Controller
              captures: { t1: $.data.id }
            - call: "POST /close/periods/${per_id}/tasks"
              payload: { entity_period_id: "${ep_id}", task_key: "ACCRUALS", title: "Book accruals", assignee_user_id: "prep-1", due_offset_hours: 48 }
              as: Controller
              captures: { t2: $.data.id }
            - call: "POST /close/periods/${per_id}/tasks"
              payload: { entity_period_id: "${ep_id}", task_key: "CONSOLIDATE", title: "Consolidate", depends_on_task_ids: [ "${t1}", "${t2}" ], assignee_user_id: "prep-1", due_offset_hours: 120 }
              as: Controller
              captures: { t3: $.data.id, t3_status0: $.data.status }
            - { call: "POST /close/tasks/${t1}/start", payload: {}, as: Preparer, as_user_id: "prep-1" }
            - call: "POST /close/tasks/${t1}/complete"
              payload: {}
              as: Preparer
              as_user_id: "prep-1"
            # T3 must STILL be blocked (T2 not done)
            - call: "GET /close/tasks/${t3}"
              payload: {}
              as: Preparer
              captures: { t3_status_mid: $.data.status }
            - { call: "POST /close/tasks/${t2}/start", payload: {}, as: Preparer, as_user_id: "prep-1" }
            - call: "POST /close/tasks/${t2}/complete"
              payload: {}
              as: Preparer
              as_user_id: "prep-1"
          trigger:
            - call: "GET /close/tasks/${t3}"
              payload: {}
              as: Preparer
              captures: { t3_status_final: $.data.status }
          assert:
            - "initially CloseTask.${t3}.status == BLOCKED (created with unmet deps)"
            - "after only T1 completes: CloseTask.${t3}.status == BLOCKED (T2 still open — AND-join semantics)"
            - "after T2 also completes: CloseTask.${t3}.status == READY (cascade flips on last dependency)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; depths >=3 and >=2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cutoff_confirm_to_entityperiod_to_accrual_cascade
        grounds:
          - state_machines.SubledgerCutoff.CUT_to_CONFIRMED
          - state_machines.EntityPeriod.PREPARING_to_SUBLEDGER_CUT
          - calculations.accrual_estimation
        distinguishing_aspect: |
          Depth-3 cascade triggered by the cutoff CONFIRM transition: confirming
          the LAST SubledgerCutoff (A) bubbles the parent EntityPeriod
          PREPARING → SUBLEDGER_CUT (B); that EntityPeriod transition itself
          triggers recomputation of every AccrualEstimate.provisional_amount_minor
          (C). B is caused by A, C is caused by B — not a fan-out from A.
        test_recipe:
          setup:
            - "Period P1 opened; one entity-period PREPARING with TWO SubledgerCutoffs (AR, AP) and one AccrualEstimate (basis PRIOR_PERIOD)"
            - "AR cutoff already CUT+CONFIRMED; AP cutoff CUT but not yet confirmed"
            - "Confirming AP is the last confirm → bubbles EntityPeriod and recomputes accrual"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            # AR cutoff through confirm
            - call: "POST /close/entity-periods/${ep_id}/subledger-cutoffs"
              payload: { subledger: AR, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_ar: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_ar}/cut", payload: {}, as: Preparer }
            - { call: "POST /close/subledger-cutoffs/${cut_ar}/confirm", payload: {}, as: Approver, as_user_id: "approver-1" }
            # AP cutoff to CUT only
            - call: "POST /close/entity-periods/${ep_id}/subledger-cutoffs"
              payload: { subledger: AP, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_ap: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_ap}/cut", payload: {}, as: Preparer }
            # accrual spec attached to the AR cutoff
            - call: "POST /close/entity-periods/${ep_id}/accruals"
              payload: { subledger_cutoff_id: "${cut_ar}", account_code: "6100-SALARIES", basis: PRIOR_PERIOD }
              as: Preparer
              captures: { acc_id: $.data.id }
            # sanity: entity-period still PREPARING (AP not confirmed)
            - call: "GET /close/entity-periods/${ep_id}"
              payload: {}
              as: Preparer
              captures: { ep_status_pre: $.data.status }
          trigger:
            - call: "POST /close/subledger-cutoffs/${cut_ap}/confirm"
              payload: {}
              as: Approver
              as_user_id: "approver-1"
            - call: "GET /close/entity-periods/${ep_id}"
              payload: {}
              as: Preparer
              captures: { ep_status_post: $.data.status }
            - call: "GET /close/entity-periods/${ep_id}/accruals"
              payload: {}
              as: Preparer
              captures: { acc_status: "$.data[0].status" }
          assert:
            - "before last confirm: EntityPeriod.${ep_id}.status == PREPARING"
            - "after last confirm: EntityPeriod.${ep_id}.status == SUBLEDGER_CUT (bubble-up hop A→B)"
            - "after bubble-up: AccrualEstimate.${acc_id}.status == PROVISIONAL and provisional_amount_minor recomputed (hop B→C fired by the EntityPeriod transition, not by the confirm directly)"

      - name: task_complete_to_dependent_ready_to_period_lock_eligibility
        grounds:
          - state_machines.CloseTask.IN_PROGRESS_to_DONE
          - state_machines.CloseTask.BLOCKED_to_READY
          - state_machines.EntityPeriod.RECONCILED_to_READY_FOR_CONSOL
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (task complete, not cutoff
          confirm): completing the last open CloseTask (A) flips its dependent
          tasks BLOCKED → READY (B); B's flip (all tasks now DONE/WAIVED) is
          precisely the gate that lets the EntityPeriod advance RECONCILED →
          READY_FOR_CONSOL. The cascade A→B and the downstream readiness gate
          are chained, distinct from the cutoff cascade's trigger.
        test_recipe:
          setup:
            - "Period P1 opened; one entity-period advanced to RECONCILED"
            - "Entity-period has exactly one task T (SL_CUTOFF, no deps, assignee prep-1) currently IN_PROGRESS"
            - "A dependent task D (REVIEW, depends_on [T]) exists and is BLOCKED"
            - "Translation already run; no elim pairs; so once T is DONE the only blocker to readiness is D — but D is REVIEW (waivable is Controller-only; here we complete T and observe D unblock)"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            # reach RECONCILED: one cutoff confirmed, then mark-reconciled
            - call: "POST /close/entity-periods/${ep_id}/subledger-cutoffs"
              payload: { subledger: AR, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_id: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/cut", payload: {}, as: Preparer }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/confirm", payload: {}, as: Approver, as_user_id: "approver-1" }
            - { call: "POST /close/entity-periods/${ep_id}/mark-reconciled", payload: {}, as: Preparer }
            # tasks: T (no deps) and D (depends on T)
            - call: "POST /close/periods/${per_id}/tasks"
              payload: { entity_period_id: "${ep_id}", task_key: "SL_CUTOFF", title: "Cut", assignee_user_id: "prep-1", due_offset_hours: 24 }
              as: Controller
              captures: { t_id: $.data.id }
            - call: "POST /close/periods/${per_id}/tasks"
              payload: { entity_period_id: "${ep_id}", task_key: "REVIEW", title: "Review", depends_on_task_ids: [ "${t_id}" ], assignee_user_id: "prep-1", due_offset_hours: 96 }
              as: Controller
              captures: { d_id: $.data.id, d_status0: $.data.status }
            - { call: "POST /close/tasks/${t_id}/start", payload: {}, as: Preparer, as_user_id: "prep-1" }
          trigger:
            - call: "POST /close/tasks/${t_id}/complete"
              payload: {}
              as: Preparer
              as_user_id: "prep-1"
            - call: "GET /close/tasks/${d_id}"
              payload: {}
              as: Preparer
              captures: { d_status_post: $.data.status }
          assert:
            - "before T completes: CloseTask.${d_id}.status == BLOCKED"
            - "after T completes: CloseTask.${d_id}.status == READY (A→B cascade)"
            - "EntityPeriod.${ep_id}.status == RECONCILED and readiness gate ERR_OPEN_CLOSE_TASKS would clear once D is DONE/WAIVED — the cascade output (D READY) is the input to the next gate"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sod_violation_vs_period_locked_safety_over_state
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_SOD_VIOLATION]
        distinguishing_aspect: |
          Conflict between two business_safety rows at priorities 6 and 7 on a
          JE approve: when the SAME user is both preparer and approver (SoD,
          priority 6) AND the period is locked (priority 7), the higher-priority
          SoD error (priority 6) wins. Pair = business_safety(6) vs
          business_safety(7) — ordering within the safety band.
        test_recipe:
          setup:
            - "Period P1 opened; one entity-period"
            - "JE created by preparer 'prep-1', submitted (RECLASS, no doc gate)"
            - "Entity-period then driven to SOFT_LOCKED via full readiness + soft-lock so the period is locked"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id, per_v0: $.data.version }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/entity-periods/${ep_id}/journal-entries"
              payload: { je_type: RECLASS, entry_date: "2026-01-20T00:00:00Z", functional_currency: USD, lines: [ { line_no: 1, account_code: "6100", direction: DEBIT, amount_minor: 1000 }, { line_no: 2, account_code: "6150", direction: CREDIT, amount_minor: 1000 } ] }
              as: Preparer
              as_user_id: "prep-1"
              captures: { je_id: $.data.id }
            - { call: "POST /close/journal-entries/${je_id}/submit", payload: {}, as: Preparer, as_user_id: "prep-1" }
            # drive entity-period to SOFT_LOCKED: cutoff, translate, reconcile, ready, then soft-lock
            - call: "POST /close/entity-periods/${ep_id}/subledger-cutoffs"
              payload: { subledger: AR, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_id: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/cut", payload: {}, as: Preparer }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/confirm", payload: {}, as: Approver, as_user_id: "approver-1" }
            - { call: "POST /close/periods/${per_id}/fx-rates", payload: { from_currency: USD, to_currency: USD, rate_kind: PERIOD_END, rate: 1.0, effective_at: "2026-01-31T00:00:00Z" }, as: Controller }
            - { call: "POST /close/entity-periods/${ep_id}/translate", payload: {}, as: Controller }
            - { call: "POST /close/entity-periods/${ep_id}/mark-reconciled", payload: {}, as: Preparer }
            - { call: "POST /close/entity-periods/${ep_id}/ready", payload: {}, as: Preparer }
            - call: "GET /close/periods/${per_id}"
              payload: {}
              as: Controller
              captures: { per_v1: $.data.version }
            - { call: "POST /close/periods/${per_id}/soft-lock", payload: { expected_close_period_version: "${per_v1}" }, as: Controller }
          trigger:
            # approver == preparer (SoD violation at p6) AND period soft-locked (p7)
            - call: "POST /close/journal-entries/${je_id}/approve"
              payload: {}
              as: Approver
              as_user_id: "prep-1"
              captures: { err: $.data.error_id }
          assert:
            - "approve rejected with ERR_SOD_VIOLATION (priority 6 business_safety), NOT the period-locked error (priority 7) — safety-ordering conflict resolved toward the higher-priority SoD check"
            - "JournalEntry.${je_id}.status remains SUBMITTED"

      - name: invalid_state_vs_business_temporal_state_over_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          DIFFERENT error-category pair: state (priority 5) vs business_temporal
          (priority 9). A JE submit on an entry that is ALREADY POSTED (invalid
          state, p5) while ALSO carrying an out-of-period entry_date (temporal,
          p9) must surface ERR_INVALID_STATE — the state precondition is checked
          before the temporal business rule.
        test_recipe:
          setup:
            - "Period P1 opened; one entity-period"
            - "A JE whose entry_date is OUTSIDE the period (out-of-period, temporal violation)"
            - "The JE is created while in-period (valid), posted, then a tamper attempt re-submits an already-POSTED entry — but the posted entry ALSO would fail a temporal re-check"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            # valid in-period JE, walk it to POSTED
            - call: "POST /close/entity-periods/${ep_id}/journal-entries"
              payload: { je_type: RECLASS, entry_date: "2026-01-20T00:00:00Z", functional_currency: USD, lines: [ { line_no: 1, account_code: "6100", direction: DEBIT, amount_minor: 2000 }, { line_no: 2, account_code: "6150", direction: CREDIT, amount_minor: 2000 } ] }
              as: Preparer
              captures: { je_id: $.data.id }
            - { call: "POST /close/journal-entries/${je_id}/submit", payload: {}, as: Preparer }
            - { call: "POST /close/journal-entries/${je_id}/approve", payload: {}, as: Approver, as_user_id: "approver-1" }
            - { call: "POST /close/journal-entries/${je_id}/post", payload: {}, as: Preparer }
          trigger:
            # re-submit an already-POSTED entry. If the implementation ALSO re-ran
            # the temporal check it could argue the entry is fine; the pinned order
            # requires the STATE check (p5) to fire first because POSTED→SUBMITTED
            # is not a permitted transition.
            - call: "POST /close/journal-entries/${je_id}/submit"
              payload: {}
              as: Preparer
              captures: { err: $.data.error_id }
          assert:
            - "submit on POSTED entry rejected with ERR_INVALID_STATE (priority 5 state) and NOT any business_temporal error (priority 9)"
            - "JournalEntry.${je_id}.status remains POSTED"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics, distinct endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: recon_aging_bucket_30_vs_31_day_boundary
        grounds:
          - calculations.recon_aging
          - entities.ReconcilingItem.fields.aging_bucket
        distinguishing_aspect: |
          Boundary on the AGING metric via the items endpoint: an item exactly
          30 days past period_end is AGE_1_30 (inclusive upper bound, <=30),
          while 31 days past is AGE_31_60. The 30/31 day edge flips the bucket
          and changes aged_over_30_count (which counts days_past >= 31).
        test_recipe:
          setup:
            - "Period P1 (period_end 2026-01-31T00:00:00Z) opened; one entity-period"
            - "Reconciliation R created (SUBLEDGER_GL, within tolerance so no block)"
            - "Two items: I30 with item_date = period_end (0 days past) and a second where aging is evaluated at a clock 30 and then 31 days past period_end"
            - "Logical clock advanced to exactly period_end + 30 days, then + 31 days"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/entity-periods/${ep_id}/reconciliations"
              payload: { account_code: "1010-BANK", recon_type: BANK, gl_balance_minor: 100000, subledger_balance_minor: 100000 }
              as: Preparer
              captures: { rec_id: $.data.id }
            # item dated at period_end (2026-01-31T00:00:00Z)
            - call: "POST /close/reconciliations/${rec_id}/items"
              payload: { description: "Deposit in transit", amount_minor: 500, item_date: "2026-01-31T00:00:00Z" }
              as: Preparer
              captures: { item_id: $.data.id }
          trigger:
            # advance clock to period_end + 30 days = 2026-03-02T00:00:00Z
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-03-02T00:00:00Z" }, as: Controller }
            - call: "GET /close/reconciliations/${rec_id}/items"
              payload: {}
              as: Preparer
              captures: { b30: "$.data[0].aging_bucket" }
            # advance to period_end + 31 days = 2026-03-03T00:00:00Z
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-03-03T00:00:00Z" }, as: Controller }
            - call: "GET /close/reconciliations/${rec_id}/items"
              payload: {}
              as: Preparer
              captures: { b31: "$.data[0].aging_bucket" }
          assert:
            - "at exactly period_end + 30 days: ReconcilingItem.${item_id}.aging_bucket == AGE_1_30 (upper bound inclusive)"
            - "at period_end + 31 days: ReconcilingItem.${item_id}.aging_bucket == AGE_31_60 (crosses at 31, not 30)"

      - name: writeoff_exactly_at_materiality_rejected_zero_item_count
        grounds:
          - calculations.recon_aging
          - state_machines.ReconcilingItem.OPEN_to_WRITTEN_OFF
          - errors[ERR_WRITEOFF_ABOVE_MATERIALITY]
        distinguishing_aspect: |
          DIFFERENT metric (money threshold vs day-count) AND distinct endpoint
          (write-off, not items list): an item with abs(amount_minor) exactly
          EQUAL to materiality_threshold_minor is rejected (>= materiality ⇒ not
          write-off-able), while one unit below is permitted. Tests the >= vs >
          edge on the fiscal threshold.
        test_recipe:
          setup:
            - "Period P1 opened; materiality_threshold_minor == 10000"
            - "One entity-period SUBLEDGER_CUT; one reconciliation IN_REVIEW"
            - "Two items both old enough (AGE_31_60): I_at with amount exactly 10000, I_below with 9999"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/entity-periods/${ep_id}/subledger-cutoffs"
              payload: { subledger: AR, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_id: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/cut", payload: {}, as: Preparer }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/confirm", payload: {}, as: Approver, as_user_id: "approver-1" }
            - call: "POST /close/entity-periods/${ep_id}/reconciliations"
              payload: { account_code: "1010-BANK", recon_type: BANK, gl_balance_minor: 100000, subledger_balance_minor: 100000 }
              as: Preparer
              captures: { rec_id: $.data.id }
            - { call: "POST /close/reconciliations/${rec_id}/review", payload: {}, as: Preparer, as_user_id: "prep-1" }
            # items dated 40 days before a clock that puts them in AGE_31_60.
            # Use item_date well before period_end and a clock 40 days past period_end.
            - call: "POST /close/reconciliations/${rec_id}/items"
              payload: { description: "At materiality", amount_minor: 10000, item_date: "2026-01-20T00:00:00Z" }
              as: Preparer
              captures: { item_at: $.data.id }
            - call: "POST /close/reconciliations/${rec_id}/items"
              payload: { description: "Below materiality", amount_minor: 9999, item_date: "2026-01-20T00:00:00Z" }
              as: Preparer
              captures: { item_below: $.data.id }
            # advance clock so items are 40 days past period_end → AGE_31_60
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-03-12T00:00:00Z" }, as: Controller }
          trigger:
            - call: "POST /close/reconciling-items/${item_at}/write-off"
              payload: {}
              as: Approver
              captures: { err_at: $.data.error_id }
            - call: "POST /close/reconciling-items/${item_below}/write-off"
              payload: {}
              as: Approver
              captures: { st_below: $.data.status }
          assert:
            - "write-off of amount exactly == materiality (10000) rejected with ERR_WRITEOFF_ABOVE_MATERIALITY (boundary uses >=)"
            - "write-off of amount 9999 (one minor unit below) succeeds: ReconcilingItem.${item_below}.status == WRITTEN_OFF"
            - "boundary precision: >= materiality rejects, < materiality permits"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: flux_accept_depends_on_reconciliation_cleared
        grounds:
          - state_machines.FluxExplanation.EXPLAINED_to_ACCEPTED
          - errors[ERR_FLUX_RECON_NOT_CLEARED]
        distinguishing_aspect: |
          FluxExplanation (entity A) → ACCEPTED is gated by the state of a
          Reconciliation (entity B) referenced via reconciliation_id: the linked
          reconciliation must be CLEARED. Pair = FluxExplanation→Reconciliation.
        test_recipe:
          setup:
            - "Period P1 opened; one entity-period"
            - "FluxExplanation F (EXPLAINED) with reconciliation_id pointing at Reconciliation R"
            - "R is IN_REVIEW (not CLEARED)"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            - call: "POST /close/entity-periods/${ep_id}/subledger-cutoffs"
              payload: { subledger: AR, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_id: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/cut", payload: {}, as: Preparer }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/confirm", payload: {}, as: Approver, as_user_id: "approver-1" }
            - call: "POST /close/entity-periods/${ep_id}/reconciliations"
              payload: { account_code: "4000-REV", recon_type: SUBLEDGER_GL, gl_balance_minor: 200000, subledger_balance_minor: 199700 }
              as: Preparer
              captures: { rec_id: $.data.id }
            - { call: "POST /close/reconciliations/${rec_id}/review", payload: {}, as: Preparer, as_user_id: "prep-1" }
            - call: "POST /close/entity-periods/${ep_id}/flux"
              payload: { account_code: "4000-REV", prior_balance_minor: 100000, current_balance_minor: 200000, reconciliation_id: "${rec_id}" }
              as: Preparer
              captures: { flux_id: $.data.id }
            - { call: "POST /close/flux/${flux_id}/explain", payload: { explanation_text: "driven by new customer contract" }, as: Preparer }
          trigger:
            # accept while recon still IN_REVIEW → blocked
            - call: "POST /close/flux/${flux_id}/accept"
              payload: {}
              as: Controller
              captures: { err: $.data.error_id }
            # now clear the recon (by a different preparer than reviewer) and retry
            - { call: "POST /close/reconciliations/${rec_id}/clear", payload: {}, as: Preparer, as_user_id: "prep-2" }
            - call: "POST /close/flux/${flux_id}/accept"
              payload: {}
              as: Controller
              captures: { st: $.data.status }
          assert:
            - "accept with linked reconciliation IN_REVIEW rejected with ERR_FLUX_RECON_NOT_CLEARED"
            - "after Reconciliation.${rec_id}.status == CLEARED, accept succeeds: FluxExplanation.${flux_id}.status == ACCEPTED"

      - name: entityperiod_ready_depends_on_elimpair_resolved
        grounds:
          - state_machines.EntityPeriod.RECONCILED_to_READY_FOR_CONSOL
          - errors[ERR_ELIM_RESIDUAL_EXCEEDED]
        distinguishing_aspect: |
          DIFFERENT entity pair: EntityPeriod (A) → READY_FOR_CONSOL is gated by
          the state of every ElimPair (B) touching it — a PROPOSED/DISPUTED pair
          with out-of-tolerance residual blocks readiness. Pair =
          EntityPeriod→ElimPair (distinct from FluxExplanation→Reconciliation).
        test_recipe:
          setup:
            - "Period P1 opened (reporting USD)"
            - "Entities EU-A (EUR) and US-B (USD); both entity-periods RECONCILED, translation run"
            - "ElimPair on the two with residual 5000 (> 500 tolerance), still PROPOSED"
            - "All tasks DONE/WAIVED so the ONLY readiness blocker is the elim pair"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "EUA", name: "EU A", functional_currency: EUR, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_a: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "USB", name: "US B", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_b: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_a}" }
              as: Controller
              captures: { ep_a: "$.data[0].id" }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_b}" }
              as: Controller
              captures: { ep_b: "$.data[0].id" }
            - { call: "POST /close/periods/${per_id}/fx-rates", payload: { from_currency: EUR, to_currency: USD, rate_kind: PERIOD_END, rate: 1.10, effective_at: "2026-01-31T00:00:00Z" }, as: Controller }
            # cutoffs + translate + reconcile both
            - call: "POST /close/entity-periods/${ep_a}/subledger-cutoffs"
              payload: { subledger: AR, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_a: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_a}/cut", payload: {}, as: Preparer }
            - { call: "POST /close/subledger-cutoffs/${cut_a}/confirm", payload: {}, as: Approver, as_user_id: "approver-1" }
            - call: "POST /close/entity-periods/${ep_b}/subledger-cutoffs"
              payload: { subledger: AP, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_b: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_b}/cut", payload: {}, as: Preparer }
            - { call: "POST /close/subledger-cutoffs/${cut_b}/confirm", payload: {}, as: Approver, as_user_id: "approver-1" }
            - { call: "POST /close/entity-periods/${ep_a}/translate", payload: {}, as: Controller }
            - { call: "POST /close/entity-periods/${ep_b}/translate", payload: {}, as: Controller }
            - { call: "POST /close/entity-periods/${ep_a}/mark-reconciled", payload: {}, as: Preparer }
            - { call: "POST /close/entity-periods/${ep_b}/mark-reconciled", payload: {}, as: Preparer }
            # elim pair with residual 5000 (A EUR 200000 → 220000; B USD -215000 → 215000)
            - call: "POST /close/periods/${per_id}/elim-pairs"
              payload: { entity_period_id_a: "${ep_a}", entity_period_id_b: "${ep_b}", account_code: "1500-IC_AR", amount_a_minor: 200000, amount_b_minor: -215000 }
              as: Preparer
              captures: { pair_id: $.data.id }
            - { call: "POST /close/elim-pairs/${pair_id}/match", payload: {}, as: Preparer }
          trigger:
            - call: "POST /close/entity-periods/${ep_a}/ready"
              payload: {}
              as: Preparer
              captures: { err_a: $.data.error_id }
          assert:
            - "EntityPeriod.${ep_a} readiness rejected with ERR_ELIM_RESIDUAL_EXCEEDED (ElimPair.${pair_id} residual 5000 > 500 and not ELIMINATED)"
            - "EntityPeriod.${ep_a}.status remains RECONCILED — the ElimPair's unresolved state gates the EntityPeriod's transition"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics/resources)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: cutoff_boundary_inclusive_vs_exclusive_at_instant
        grounds:
          - calculations.subledger_cutoff_totals
          - entities.SubledgerCutoff.fields.cutoff_rule
        distinguishing_aspect: |
          Interval semantics on the SubledgerCutoff resource: a transaction exactly
          AT cutoff_at is EXCLUDED under INCLUSIVE (half-open [start, cutoff)) but
          INCLUDED under EXCLUSIVE_AT_END ([start, cutoff] closed). Same instant,
          two geometric treatments of the boundary, producing different
          pre_cutoff_total_minor on identical subledger data.
        test_recipe:
          setup:
            - "Period P1 opened; one entity-period"
            - "Three seeded AR transactions: ts1 = period_start + 1 day (1000), ts2 = cutoff_at EXACTLY (500), ts3 = cutoff_at + 1 day (700)"
            - "Two cutoffs on the same subledger: CUT_INC (INCLUSIVE) and CUT_EXC (EXCLUSIVE_AT_END), both at cutoff_at = 2026-01-31T00:00:00Z"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id" }
            # seed subledger transactions
            - { call: "POST /close/_subledger/seed", payload: { entity_id: "${ent_id}", subledger: AR, ts: "2026-01-02T00:00:00Z", amount_minor: 1000, account_code: "1200-AR" }, as: Controller }
            - { call: "POST /close/_subledger/seed", payload: { entity_id: "${ent_id}", subledger: AR, ts: "2026-01-31T00:00:00Z", amount_minor: 500, account_code: "1200-AR" }, as: Controller }
            - { call: "POST /close/_subledger/seed", payload: { entity_id: "${ent_id}", subledger: AR, ts: "2026-02-01T00:00:00Z", amount_minor: 700, account_code: "1200-AR" }, as: Controller }
            # INCLUSIVE cutoff
            - call: "POST /close/entity-periods/${ep_id}/subledger-cutoffs"
              payload: { subledger: AR, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_inc: $.data.id }
          trigger:
            - call: "POST /close/subledger-cutoffs/${cut_inc}/cut"
              payload: {}
              as: Preparer
              captures: { inc_total: $.data.pre_cutoff_total_minor, inc_boundary: $.data.boundary_transaction_count }
          assert:
            - "INCLUSIVE: pre_cutoff_total_minor == 1000 (only ts1; the ts==cutoff 500 EXCLUDED; ts3 after cutoff excluded)"
            - "INCLUSIVE: boundary_transaction_count == 1 (the transaction exactly at cutoff_at)"
            - "demonstrates half-open [start, cutoff) semantics on the SubledgerCutoff resource"

      - name: single_open_close_period_mutual_exclusion
        grounds:
          - state_machines.ClosePeriod.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_PERIOD_ALREADY_OPEN]
        distinguishing_aspect: |
          DIFFERENT resource + DIFFERENT interval semantics: the ClosePeriod
          resource enforces an aggregate-exclusion constraint (at most ONE period
          IN_PROGRESS/UNDER_REVIEW across the whole system) rather than a point-
          boundary rule. Opening period P2 while P1 is open collides on the
          "open close" singleton, regardless of whether their [start,end)
          windows overlap — a capacity-1 occupancy rule, not an adjacency edge.
        test_recipe:
          setup:
            - "Period P1 created and opened (IN_PROGRESS)"
            - "Period P2 created for a NON-overlapping window (2026-02), still SCHEDULED"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per1: $.data.id }
            - { call: "POST /close/periods/${per1}/open", payload: {}, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 2, period_start: "2026-02-01T00:00:00Z", period_end: "2026-02-28T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per2: $.data.id }
          trigger:
            - call: "POST /close/periods/${per2}/open"
              payload: {}
              as: Controller
              captures: { err: $.data.error_id }
          assert:
            - "opening P2 while P1 is IN_PROGRESS rejected with ERR_PERIOD_ALREADY_OPEN (capacity-1 occupancy on the open-close singleton)"
            - "ClosePeriod.${per2}.status remains SCHEDULED even though P2's window does not overlap P1's — the exclusion is aggregate, not geometric"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: je_post_and_reverse_conserves_trial_balance
        grounds:
          - calculations.trial_balance
          - state_machines.JournalEntry.APPROVED_to_POSTED
        distinguishing_aspect: |
          Conserved quantity = EntityPeriod.trial_balance_minor. Posting a JE
          moves it by the entry's net; posting an equal-and-opposite reversal JE
          returns it EXACTLY to the prior value. trial_balance_before ==
          trial_balance_after_forward + after_reverse. Conserved across the
          forward/compensating action pair.
        test_recipe:
          setup:
            - "Period P1 opened; one entity-period"
            - "JE-F: DEBIT 6100 5000 / CREDIT 2000 5000 → posted"
            - "JE-R (reversal): DEBIT 2000 5000 / CREDIT 6100 5000 → posted"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "US100", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_id: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_id}" }
              as: Controller
              captures: { ep_id: "$.data[0].id", tb0: "$.data[0].trial_balance_minor" }
            # forward JE
            - call: "POST /close/entity-periods/${ep_id}/journal-entries"
              payload: { je_type: RECLASS, entry_date: "2026-01-20T00:00:00Z", functional_currency: USD, lines: [ { line_no: 1, account_code: "6100", direction: DEBIT, amount_minor: 5000 }, { line_no: 2, account_code: "2000", direction: CREDIT, amount_minor: 5000 } ] }
              as: Preparer
              captures: { je_f: $.data.id }
            - { call: "POST /close/journal-entries/${je_f}/submit", payload: {}, as: Preparer }
            - { call: "POST /close/journal-entries/${je_f}/approve", payload: {}, as: Approver, as_user_id: "approver-1" }
            - { call: "POST /close/journal-entries/${je_f}/post", payload: {}, as: Preparer }
            - call: "GET /close/entity-periods/${ep_id}"
              payload: {}
              as: Preparer
              captures: { tb_after_fwd: $.data.trial_balance_minor }
          trigger:
            # compensating reversal JE (mirror)
            - call: "POST /close/entity-periods/${ep_id}/journal-entries"
              payload: { je_type: RECLASS, entry_date: "2026-01-21T00:00:00Z", functional_currency: USD, lines: [ { line_no: 1, account_code: "2000", direction: DEBIT, amount_minor: 5000 }, { line_no: 2, account_code: "6100", direction: CREDIT, amount_minor: 5000 } ] }
              as: Preparer
              captures: { je_r: $.data.id }
            - { call: "POST /close/journal-entries/${je_r}/submit", payload: {}, as: Preparer }
            - { call: "POST /close/journal-entries/${je_r}/approve", payload: {}, as: Approver, as_user_id: "approver-1" }
            - { call: "POST /close/journal-entries/${je_r}/post", payload: {}, as: Preparer }
            - call: "GET /close/entity-periods/${ep_id}"
              payload: {}
              as: Preparer
              captures: { tb_after_rev: $.data.trial_balance_minor }
          assert:
            - "before any post: EntityPeriod.${ep_id}.trial_balance_minor == 0"
            - "after forward post: trial_balance_minor == 0 (balanced JE nets to zero — DEBIT 5000 6100, CREDIT 5000 2000; signed sum over ALL lines = 0)"
            - "after reversal post: trial_balance_minor still == 0 — forward+compensating pair conserves the zero trial balance (no drift)"

      - name: nci_plus_parent_share_readds_to_translated_balance
        grounds:
          - calculations.minority_interest
          - entities.EntityPeriod.fields.nci_share_minor
        distinguishing_aspect: |
          DIFFERENT conserved quantity: EntityPeriod.translated_balance_minor is
          partitioned into NCI share + parent share such that nci_share_minor +
          parent_share == translated_balance_minor EXACTLY (pinned rounding order:
          NCI rounded first, parent is the residual). A consolidation that
          double-rounds or drops the remainder breaks the invariant. Conserved
          across the split/join action pair.
        test_recipe:
          setup:
            - "Period P1 opened (reporting USD)"
            - "Entity EU-Sub: functional EUR, ownership 80 (NCI 20%), translation CURRENT_RATE"
            - "Posted JE nets trial_balance to 1000000; EUR->USD PERIOD_END 1.10, AVERAGE 1.05"
            - "Entity-period driven RECONCILED → READY_FOR_CONSOL (which recomputes nci_share_minor)"
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }
              as: Controller
              captures: { per_id: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "USPAR", name: "US Parent", functional_currency: USD, ownership_pct: 100, translation_method: CURRENT_RATE }
              as: Controller
              captures: { ent_par: $.data.id }
            - call: "POST /close/entities"
              payload: { entity_code: "EUSUB", name: "EU Sub", functional_currency: EUR, ownership_pct: 80, translation_method: CURRENT_RATE, parent_entity_id: "${ent_par}" }
              as: Controller
              captures: { ent_sub: $.data.id }
            - { call: "POST /close/periods/${per_id}/open", payload: {}, as: Controller }
            - call: "GET /close/entity-periods"
              payload: { close_period_id: "${per_id}", entity_id: "${ent_sub}" }
              as: Controller
              captures: { ep_sub: "$.data[0].id" }
            - call: "POST /close/entity-periods/${ep_sub}/journal-entries"
              payload: { je_type: RECLASS, entry_date: "2026-01-20T00:00:00Z", functional_currency: EUR, lines: [ { line_no: 1, account_code: "1000", direction: DEBIT, amount_minor: 1000000 }, { line_no: 2, account_code: "2000", direction: CREDIT, amount_minor: 1000000 } ] }
              as: Preparer
              captures: { je_id: $.data.id }
            - { call: "POST /close/journal-entries/${je_id}/submit", payload: {}, as: Preparer }
            - { call: "POST /close/journal-entries/${je_id}/approve", payload: {}, as: Approver, as_user_id: "approver-1" }
            - { call: "POST /close/journal-entries/${je_id}/post", payload: {}, as: Preparer }
            - { call: "POST /close/periods/${per_id}/fx-rates", payload: { from_currency: EUR, to_currency: USD, rate_kind: PERIOD_END, rate: 1.10, effective_at: "2026-01-31T00:00:00Z" }, as: Controller }
            - { call: "POST /close/periods/${per_id}/fx-rates", payload: { from_currency: EUR, to_currency: USD, rate_kind: AVERAGE, rate: 1.05, effective_at: "2026-01-31T00:00:00Z" }, as: Controller }
            - call: "POST /close/entity-periods/${ep_sub}/subledger-cutoffs"
              payload: { subledger: AR, cutoff_at: "2026-01-31T00:00:00Z", cutoff_rule: INCLUSIVE }
              as: Preparer
              captures: { cut_id: $.data.id }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/cut", payload: {}, as: Preparer }
            - { call: "POST /close/subledger-cutoffs/${cut_id}/confirm", payload: {}, as: Approver, as_user_id: "approver-1" }
            - { call: "POST /close/entity-periods/${ep_sub}/translate", payload: {}, as: Controller }
            - { call: "POST /close/entity-periods/${ep_sub}/mark-reconciled", payload: {}, as: Preparer }
          trigger:
            - call: "POST /close/entity-periods/${ep_sub}/ready"
              payload: {}
              as: Preparer
              captures: { translated: $.data.translated_balance_minor, nci: $.data.nci_share_minor }
          assert:
            - "EntityPeriod.${ep_sub}.translated_balance_minor == 1100000 (round(1000000 * 1.10))"
            - "EntityPeriod.${ep_sub}.nci_share_minor == 220000 (round(1100000 * 20 / 100))"
            - "parent share == 880000 (1100000 - 220000, residual AFTER NCI rounding)"
            - "invariant: nci_share_minor + parent_share == translated_balance_minor exactly (220000 + 880000 == 1100000) — no rounding remainder dropped"
