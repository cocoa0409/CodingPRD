      - name: specialist_cannot_confirm_match_link
        claim_type: role_denied
        grounds:
          - roles[Specialist]
          - roles[MatchReviewer]
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: "Peer-role separation: match review belongs to MatchReviewer; a Specialist calling confirm gets ERR_UNAUTHORIZED_ROLE (data ops and case work are segregated peer roles)."
        test_recipe:
          setup: ["Campaign OPEN; school ENROLLED; senior with SUGGESTED link (score 0.85)"]
          setup_api_calls:
            - { call: "POST /fafsa/campaigns", as: CampaignAdmin, payload: { name: "C27", academic_year: "2027-2028", state_grant_deadline: "2027-04-15T00:00:00Z", federal_deadline: "2028-06-30T00:00:00Z", total_budget_cents: 50000 }, captures: { camp: $.data.id } }
