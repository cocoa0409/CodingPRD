            - "the survey call sets Executive.residential_survey_status == DEFICIENT and residential_component == 40.00"
            - "the second submit returns HTTP 200 with status == SUBMITTED — DEFICIENT satisfies the precondition, only PENDING blocks it"
            - "the successful submit snapshots residential_component_snapshot == 40.00 and composite_risk_score == 17.00 == round_half_up((0.45*20.00 + 0.35*0 + 0.20*40.00) * 1.0, 2)"

      - name: verify_an_already_verified_policy_returns_policy_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.InsurancePolicy.terminal_states
          - validations[priority=25]
          - errors.ERR_POLICY_INVALID_STATE
        distinguishing_aspect: |
          VERIFIED is terminal, so the verify action is not idempotent and REJECT is not a
          downgrade path: from VERIFIED both outcome == VERIFY and outcome == REJECT must fail
          with the same state error, and verified_at must keep the instant of the FIRST verify
          rather than being refreshed by the rejected retry.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z; one executive; one UNVERIFIED policy; the clock then advanced to 2026-08-02T00:00:00Z so a refreshed verified_at would be visible"
          setup_api_calls:
