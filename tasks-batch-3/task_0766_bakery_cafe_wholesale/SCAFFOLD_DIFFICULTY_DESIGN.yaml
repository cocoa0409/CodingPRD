      - name: oven_slot_buffer_conflict
        grounds:
          - validations[priority=7]
          - entities.Oven.fields.clean_buffer_minutes
          - entities.BakeLot.fields.slot_start
        distinguishing_aspect: "Closed-interval + clean_buffer_minutes(15) oven semantics: a 10-minute gap between consecutive slots (08:00-09:00 then 09:10-10:00) is under the buffer and rejected ERR_OVEN_SLOT_CONFLICT; resource is Oven, distinct interval arithmetic from the route's buffer-free half-open overlap."
        test_recipe:
          setup:
            - "Oven clean_buffer_minutes 15; committed plan line par 40; one lot occupying 08:00-09:00."
          setup_api_calls:
            - call: "POST /products"
