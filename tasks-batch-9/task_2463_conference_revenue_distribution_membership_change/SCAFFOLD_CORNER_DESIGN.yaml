          trigger:
            - call: "POST /distribution-runs/${r26_id}/reverse"
              payload: { reason: "restatement required by the membership" }
              as: Treasurer
              as_user_id: "u_trs_1"
          assert:
            - "immediately before the reversal, Conference.reserve_balance_cents == 18000000, .funded_ratio_bps == 10000, .reserve_posture == \"OPEN\", .escrow_balance_cents == 0 and .governance_fee_revenue_cents == 5000000"
            - "after the reversal, DistributionRun.${r26_id}.status == \"REVERSED\" and all 4 of its lines have status == \"VOIDED\""
            - "after the reversal, Conference.reserve_balance_cents == 12000000, .funded_ratio_bps == 6666, .reserve_posture == \"OPEN\", .escrow_balance_cents == 0 and .governance_fee_revenue_cents == 0"
            - "every member still has exit_settlement_paid_cents == 0, since every line's gor_offset_cents was 0 in both directions"
            - "every member still has last_full_annual_distribution_cents == 147500000, because the REVERSED transition's side-effect list does not restore it"

      - name: corner_rivalry_lapses_when_its_last_game_is_cancelled
        claim_type: Bubble up
        grounds:
          - state_machines.ProtectedRivalry.ACTIVE_to_LAPSED
          - state_machines.ScheduleGame.SCHEDULED_to_CANCELLED
          - calculations.schedule_compliance_score
        distinguishing_aspect: |
          Cancelling the only game that satisfied a rivalry bubbles the parent
          rivalry to LAPSED and re-scores both participants from 100 to 85, so the
          15-point rivalry penalty is applied to a member with no games left
          rather than merely flagged on the rivalry row.
        test_recipe:
          setup:
            - "The conference is FORMING with four charter members."
            - "A North-South protected rivalry requiring 1 annual meeting is ACTIVE and its single FY2027 game, North at home, is SCHEDULED and linked to it."
          setup_api_calls:
