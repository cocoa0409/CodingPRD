              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
