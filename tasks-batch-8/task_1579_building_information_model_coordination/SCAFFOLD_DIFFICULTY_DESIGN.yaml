  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: meeting_room_half_open_adjacency_rules
        grounds:
          - calculations.meeting_room_overlap
          - entities.CoordinationMeeting.fields.room_id
        distinguishing_aspect: |
          Interval semantics half-open [starts_at, ends_at) on resource (project, room):
          back-to-back booking (new.starts_at == existing.ends_at) is ALLOWED with zero
          gap, while any strict overlap is ERR_ROOM_WINDOW_CONFLICT, and the same clock
          window in a different room is allowed.
        test_recipe:
          setup:
            - "Project P; meeting A in room RM-1 occupying [2026-08-10T09:00:00Z, 2026-08-10T10:00:00Z)"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "TO1" }, as: VDCManager, captures: { pid: $.data.id } }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "RM-1", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z" }, as: BIMCoordinator, captures: { mta: $.data.id } }
          trigger:
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "RM-1", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T11:00:00Z" }, as: BIMCoordinator, captures: { mtb: $.data.id } }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "RM-1", starts_at: "2026-08-10T09:30:00Z", ends_at: "2026-08-10T10:30:00Z" }, as: BIMCoordinator, captures: { err_overlap: $.data.error_id } }
            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "RM-2", starts_at: "2026-08-10T09:30:00Z", ends_at: "2026-08-10T10:30:00Z" }, as: BIMCoordinator, captures: { mtd: $.data.id } }
          assert:
            - "adjacent booking created: CoordinationMeeting.${mtb} exists with status SCHEDULED (ends_at == starts_at is allowed)"
            - "overlapping booking rejected: error_id == ERR_ROOM_WINDOW_CONFLICT (409)"
            - "same window in room RM-2 created: CoordinationMeeting.${mtd} exists (resource is (project, room))"

      - name: freeze_window_closed_interval_buffer_gap
        grounds:
          - calculations.freeze_window_gap_check
          - entities.FreezeWindow.fields.federated_model_id
        distinguishing_aspect: |
          Different interval semantics on a different resource: freeze windows on a
          FEDERATED MODEL are closed intervals with a mandatory 3600-second buffer —
          a gap of exactly 3600 s is allowed (>=), a gap of 3599 s is
          ERR_FREEZE_WINDOW_GAP_VIOLATION, and direct overlap is rejected; unlike meeting
          rooms, zero-gap adjacency is forbidden here.
        test_recipe:
          setup:
            - "Project P, partner P1, M1 ACCEPTED, F1 FROZEN; window W1 [2026-09-10T00:00:00Z, 2026-09-11T00:00:00Z] on F1"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "TO2" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "POST /api/federated-models/${f1}/freeze-windows", payload: { starts_at: "2026-09-10T00:00:00Z", ends_at: "2026-09-11T00:00:00Z", purpose: COORDINATION_FREEZE }, as: VDCManager, captures: { w1: $.data.id } }
          trigger:
            - { call: "POST /api/federated-models/${f1}/freeze-windows", payload: { starts_at: "2026-09-11T01:00:00Z", ends_at: "2026-09-12T00:00:00Z", purpose: FABRICATION_HOLD }, as: VDCManager, captures: { w2: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/freeze-windows", payload: { starts_at: "2026-09-09T22:00:00Z", ends_at: "2026-09-09T23:59:59Z", purpose: HANDOVER_FREEZE }, as: VDCManager, captures: { err_gap: $.data.error_id } }
            - { call: "POST /api/federated-models/${f1}/freeze-windows", payload: { starts_at: "2026-09-10T12:00:00Z", ends_at: "2026-09-10T13:00:00Z", purpose: COORDINATION_FREEZE }, as: VDCManager, captures: { err_ov: $.data.error_id } }
          assert:
            - "gap of exactly 3600 s allowed: FreezeWindow.${w2} created (201)"
            - "gap of 3599 s rejected: error_id == ERR_FREEZE_WINDOW_GAP_VIOLATION (409)"
            - "direct overlap rejected: error_id == ERR_FREEZE_WINDOW_GAP_VIOLATION (409)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: verify_reopen_conserves_run_clash_counts
        grounds:
          - state_machines.ClashIssue.RESOLVED_to_VERIFIED
          - state_machines.ClashIssue.VERIFIED_to_REOPENED
          - entities.ClashDetectionRun.fields.open_clash_count
          - entities.ClashDetectionRun.fields.closed_clash_count
        distinguishing_aspect: |
          Conserved quantity: ClashDetectionRun.total_clash_count. The forward action
          (verify: RESOLVED -> VERIFIED) moves one clash from open to closed; the
          compensating action (reopen: VERIFIED -> REOPENED) moves it back; after the
          pair, open_clash_count + closed_clash_count == total_clash_count == 3 exactly
          as before, with zero drift.
        test_recipe:
          setup:
            - "Project P, partner P1, M1 ACCEPTED, F1 FROZEN, R1 RUNNING with clashes C1 (CRITICAL), C2 (MAJOR), C3 (MINOR)"
            - "C1 assigned to P1 and resolved with 4.0 h"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "CI1" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "POST /api/federated-models/${f1}/clash-runs", payload: { tolerance_mm: 5.0 }, as: BIMCoordinator, captures: { r1: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/start", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "I/1", overlap_mm: 75.0, spans_disciplines: true }, as: BIMCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "I/2", overlap_mm: 30.0, spans_disciplines: false }, as: BIMCoordinator, captures: { c2: $.data.id } }
            - { call: "POST /api/clash-runs/${r1}/clashes", payload: { element_pair: "I/3", overlap_mm: 0.0, spans_disciplines: false }, as: BIMCoordinator, captures: { c3: $.data.id } }
            - { call: "POST /api/clash-issues/${c1}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/clash-issues/${c1}/resolve", payload: { actual_labor_hours: 4.0 }, as: TradeModelAuthor, as_user_id: "${p1}" }
          trigger:
            - { call: "POST /api/clash-issues/${c1}/verify", payload: { re_inspection_overlap_mm: 1.0 }, as: BIMCoordinator, as_user_id: "coord-2" }
            - { call: "GET /api/clash-runs/${r1}", payload: {}, as: BIMCoordinator, captures: { o1: $.data.open_clash_count, cl1: $.data.closed_clash_count, t1: $.data.total_clash_count } }
            - { call: "POST /api/clash-issues/${c1}/reopen", payload: {}, as: BIMCoordinator }
            - { call: "GET /api/clash-runs/${r1}", payload: {}, as: BIMCoordinator, captures: { o2: $.data.open_clash_count, cl2: $.data.closed_clash_count, t2: $.data.total_clash_count } }
            - { call: "POST /api/clash-issues/${c1}/assign", payload: { trade_partner_id: "${p1}" }, as: BIMCoordinator, as_user_id: "coord-1" }
            - { call: "POST /api/clash-issues/${c1}/resolve", payload: { actual_labor_hours: 2.0 }, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/clash-issues/${c1}/verify", payload: { re_inspection_overlap_mm: 1.0 }, as: BIMCoordinator, as_user_id: "coord-2" }
            - { call: "GET /api/clash-runs/${r1}", payload: {}, as: BIMCoordinator, captures: { o3: $.data.open_clash_count, cl3: $.data.closed_clash_count, t3: $.data.total_clash_count } }
          assert:
            - "after verify: open == 2, closed == 1, total == 3"
            - "after reopen (compensating): open == 3, closed == 0, total == 3"
            - "after re-verify: open == 2, closed == 1, total == 3"
            - "invariant open_clash_count + closed_clash_count == total_clash_count held at every hop (no drift from the verify/reopen pair)"

      - name: sign_revoke_rerequest_conserves_signoff_slots
        grounds:
          - state_machines.SignOff.REQUESTED_to_SIGNED
          - state_machines.SignOff.SIGNED_to_REVOKED
          - state_machines.SignOff.REVOKED_to_REQUESTED
          - entities.FabricationPackage.fields.required_signoff_count
        distinguishing_aspect: |
          Conserved quantity (different from CI1's clash counts): the package's sign-off
          slot pool — required_signoff_count == count(REQUESTED)+count(SIGNED)+
          count(DECLINED)+count(REVOKED) == 2 at all times. Forward action sign moves a
          slot REQUESTED -> SIGNED; the compensating unfreeze revokes SIGNED -> REVOKED;
          re-request restores REVOKED -> REQUESTED; no SignOff row is ever created or
          destroyed after the initial submit-for-signoff.
        test_recipe:
          setup:
            - "Project P; partners P1 (STRUCTURAL) and P2 (MECHANICAL, fabricator)"
            - "M1 (STRUCTURAL) and M3 (MECHANICAL) both ACCEPTED; F1 [M1, M3] FROZEN"
            - "Package PKG (scope [STRUCTURAL, MECHANICAL]) with both sign-offs SIGNED -> READY_FOR_RELEASE"
          setup_api_calls:
            - { call: "POST /api/projects", payload: { name: "CI2" }, as: VDCManager, captures: { pid: $.data.id, pv: $.data.version } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "StructCo", discipline: STRUCTURAL, hourly_rate_cents: 12000, coordination_budget_hours: 100.0, software_platform: REVIT }, as: VDCManager, captures: { p1: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-partners", payload: { company_name: "FabCo", discipline: MECHANICAL, hourly_rate_cents: 10000, coordination_budget_hours: 50.0, software_platform: TEKLA }, as: VDCManager, captures: { p2: $.data.id } }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p1}", file_format: RVT, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p1}", captures: { m1: $.data.id } }
            - { call: "POST /api/trade-models/${m1}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p1}" }
            - { call: "POST /api/trade-models/${m1}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/trade-models", payload: { trade_partner_id: "${p2}", file_format: IFC, declared_lod: 300, life_safety_elements: 10, life_safety_compliant: 10, envelope_elements: 10, envelope_compliant: 10, finish_elements: 10, finish_compliant: 10 }, as: TradeModelAuthor, as_user_id: "${p2}", captures: { m3: $.data.id } }
            - { call: "POST /api/trade-models/${m3}/submit", payload: {}, as: TradeModelAuthor, as_user_id: "${p2}" }
            - { call: "POST /api/trade-models/${m3}/accept", payload: {}, as: BIMCoordinator }
            - { call: "POST /api/projects/${pid}/federated-models", payload: { label: "F1", target_format: IFC, member_trade_model_ids: ["${m1}", "${m3}"], expected_project_version: "${pv}" }, as: VDCManager, captures: { f1: $.data.id } }
            - { call: "POST /api/federated-models/${f1}/freeze", payload: {}, as: VDCManager }
            - { call: "POST /api/projects/${pid}/fabrication-packages", payload: { federated_model_id: "${f1}", scope_disciplines: ["STRUCTURAL", "MECHANICAL"] }, as: FabricationLead, as_user_id: "${p2}", captures: { pkg: $.data.id } }
            - { call: "POST /api/fabrication-packages/${pkg}/submit-for-signoff", payload: {}, as: FabricationLead, as_user_id: "${p2}" }
            - { call: "GET /api/fabrication-packages/${pkg}/signoffs", payload: {}, as: VDCManager, captures: { soA: "$.data[0].id", soB: "$.data[1].id" } }
            - { call: "POST /api/signoffs/${soA}/sign", payload: {}, as: LeadEngineer, as_user_id: "eng-2" }
            - { call: "POST /api/signoffs/${soB}/sign", payload: {}, as: LeadEngineer, as_user_id: "eng-2" }
            - { call: "GET /api/fabrication-packages/${pkg}", payload: {}, as: VDCManager, captures: { pkg_st1: $.data.status, pkg_sc1: $.data.signed_count, pkg_req: $.data.required_signoff_count } }
          trigger:
            - { call: "POST /api/federated-models/${f1}/unfreeze", payload: {}, as: VDCManager }
            - { call: "GET /api/fabrication-packages/${pkg}", payload: {}, as: VDCManager, captures: { pkg_st2: $.data.status, pkg_sc2: $.data.signed_count } }
            - { call: "GET /api/fabrication-packages/${pkg}/signoffs", payload: {}, as: VDCManager, captures: { soA_st: "$.data[0].status", soB_st: "$.data[1].status" } }
            - { call: "POST /api/fabrication-packages/${pkg}/submit-for-signoff", payload: {}, as: FabricationLead, as_user_id: "${p2}" }
            - { call: "GET /api/fabrication-packages/${pkg}/signoffs", payload: {}, as: VDCManager, captures: { soA_st2: "$.data[0].status", soB_st2: "$.data[1].status" } }
          assert:
            - "before unfreeze: package READY_FOR_RELEASE, signed_count == 2, required_signoff_count == 2"
            - "after unfreeze (compensating revoke): both sign-offs REVOKED, package SIGNOFF_IN_PROGRESS, signed_count == 0"
            - "after re-request: both sign-offs REQUESTED again"
            - "invariant: exactly 2 SignOff rows exist throughout — status multiset changed but slot count == required_signoff_count == 2 conserved"
