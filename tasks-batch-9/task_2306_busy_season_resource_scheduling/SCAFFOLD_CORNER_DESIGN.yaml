          - calculations.weekly_committed_hours
        distinguishing_aspect: |
          Confirming a PROPOSED booking moves only the staffing dimension to CONFIRMED and
          bumps Assignment.version to 2, while the declared side effect leaves S1 carrying
          committed_hours_current_week 20.02 (daily_hours 2.86 x 7 overlap days) against
          effective_weekly_cap_hours 50.00.
