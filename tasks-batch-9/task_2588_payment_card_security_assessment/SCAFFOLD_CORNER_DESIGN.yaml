          rationale: "That instance is exactly the cross-entity guard: the IN_TESTING -> IN_PLACE edge is refused with ERR_SAMPLING_PLAN_STALE purely because a different aggregate (the SamplingPlan) left ACTIVE."

  # ---------------------------------------------------------------------------
  # Section 3 — Calculations (Table 3 claim types + per-algorithm boundary rows
  # + Table 4 dual-variant rows)
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:

      - name: calc_facility_sample_selection_orders_names_ascending_and_reprices_the_fee
        claim_type: Correct Result
        grounds:
          - calculations.facility_sample_selection
          - calculations.component_sample_allocation
          - entities.SamplingPlan.fields.sampled_facility_names
        distinguishing_aspect: "Over a three-facility population the FACILITY_SAMPLE_RATE 0.34 gives ceil(1.02) == 2, and the two names selected are the byte-wise smallest ('DC-EAST', 'RETAIL-12') - never the highest-ranked facility_type and never insertion order, even though RETAIL-40 was created last and DATA_CENTER outranks RETAIL_STORE. The two sampled facilities also drive estimated_hours to 256 and the fee to 67046.40."
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' (L1, budget 200000.00) is in SCOPING with a VALIDATED CDE segment."
            - "Three components sit in that segment, one per facility: 'pay-01' (APPLICATION, DC-EAST/DATA_CENTER), 'pos-01' (POS_TERMINAL, RETAIL-12/RETAIL_STORE) and 'pos-02' (POS_TERMINAL, RETAIL-40/RETAIL_STORE)."
