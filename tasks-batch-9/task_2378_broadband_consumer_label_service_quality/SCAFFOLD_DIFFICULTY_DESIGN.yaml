  - rule_id: priority_pair_validation_conflict
    instances:

      - name: measurement_window_future_outranks_run_duration_exceeded
        grounds:
          - validations.priority_55
          - validations.priority_60
          - errors.ERR_MEASUREMENT_WINDOW_FUTURE
          - errors.ERR_RUN_DURATION_EXCEEDED
        distinguishing_aspect: |
          Category pair business_temporal (priority 55) versus business_constraint (priority 60) on
          POST /test-runs: a run window that is both in the future and longer than the methodology
          permits must surface the temporal complaint, because a measurement that cannot have happened
          yet is rejected before its shape is judged.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ServicePlan FIBER300 (advertised 300/140) with its five FeeLineItems."
            - "PUBLISHED MethodologyDocument MTH-2026-A (peak [19,23), min_samples_required 4, max_run_duration_days 7) and MeasurementProbe PRB-1 (max_concurrent_windows 2)."
            - "One INCLUDED TestRun A whose closed window is [2026-08-03T00:00:00Z, 2026-08-09T23:00:00Z], so its buffered end is 2026-08-10T00:00:00Z."

          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer

            - call: "POST /service-plans"
              payload: { plan_code: "FIBER300", display_name: "Fiber 300", technology: "FIBER", advertised_download_mbps: 300, advertised_upload_mbps: 140, monthly_price_cents: 7999, early_termination_fee_cents: 12000, required_locales: ["en-US"], intro_price_cents: 4999, intro_term_months: 6, data_allowance_gb: 1200, overage_rate_cents_per_gb: 1000, etf_proration_policy: "PRORATED_MONTHLY", discount_program_eligible: true }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { plan_id: $.data.id }

            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "EQUIP_RENTAL", description: "Equipment rental", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 1500, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "NETWORK_ACCESS", description: "Network access surcharge", label_category: "MONTHLY_RECURRING", basis: "FIXED", amount_cents: 700, applies_during: "POST_PROMO_ONLY" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "REG_RECOVERY", description: "Regulatory cost recovery", label_category: "MONTHLY_RECURRING", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0325, applies_during: "ALWAYS", is_regulatory_recovery: true }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "STATE_USF", description: "State universal service fund", label_category: "GOVERNMENT_TAX", basis: "PCT_OF_MONTHLY_CHARGE", rate_pct: 0.0211, applies_during: "ALWAYS" }
              as: ComplianceOfficer
            - call: "POST /service-plans/${plan_id}/fee-line-items"
              payload: { fee_code: "INSTALL", description: "Professional installation", label_category: "ONE_TIME", basis: "FIXED", amount_cents: 9900, applies_during: "ALWAYS" }
              as: ComplianceOfficer

            - call: "POST /methodology-documents"
              payload: { doc_code: "MTH-2026-A", version_label: "v1.0", methodology_url: "https://isp.example/methodology/v1.0", peak_hours_start_utc_hour: 19, peak_hours_end_utc_hour: 23, min_samples_required: 4, max_run_duration_days: 7 }
              as: NetworkEngineer
              captures: { doc_id: $.data.id }
            - call: "POST /methodology-documents/${doc_id}/publish"
              payload: {}
              as: ComplianceOfficer

            - call: "POST /measurement-probes"
              payload: { probe_code: "PRB-1", market_code: "US-TX-AUS", panel_size: 75, max_concurrent_windows: 2 }
              as: NetworkEngineer
              captures: { probe_id: $.data.id }

            - call: "POST /test-runs"
              payload: { probe_id: "${probe_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-03T00:00:00Z", window_end: "2026-08-09T23:00:00Z", samples: [ {observed_at: "2026-08-03T19:10:00Z", download_mbps: 210, upload_mbps: 100, latency_ms: 42}, {observed_at: "2026-08-04T21:30:00Z", download_mbps: 238, upload_mbps: 112, latency_ms: 24}, {observed_at: "2026-08-05T20:40:00Z", download_mbps: 242, upload_mbps: 118, latency_ms: 22}, {observed_at: "2026-08-08T19:45:00Z", download_mbps: 290, upload_mbps: 130, latency_ms: 18}, {observed_at: "2026-08-05T14:30:00Z", download_mbps: 295, upload_mbps: 145, latency_ms: 14}, {observed_at: "2026-08-06T02:40:00Z", download_mbps: 306, upload_mbps: 155, latency_ms: 55} ] }
              as: NetworkEngineer
              captures: { run_a_id: $.data.id }

          trigger:
            - call: "POST /test-runs"   # both violated: window_end 2026-09-20 > clock AND 15 days > max_run_duration_days 7 -> expect ERR_MEASUREMENT_WINDOW_FUTURE (422)
              payload: { probe_id: "${probe_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-20T00:00:00Z", samples: [ {observed_at: "2026-09-06T19:10:00Z", download_mbps: 250, upload_mbps: 120, latency_ms: 20} ] }
              as: NetworkEngineer
            - call: "POST /test-runs"   # only priority 60 violated: past window, 15 days long -> expect ERR_RUN_DURATION_EXCEEDED (422)
              payload: { probe_id: "${probe_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-11T00:01:00Z", window_end: "2026-08-26T00:00:00Z", samples: [ {observed_at: "2026-08-12T19:10:00Z", download_mbps: 250, upload_mbps: 120, latency_ms: 20} ] }
              as: NetworkEngineer
            - call: "POST /test-runs"   # only priority 55 violated: 1-day window but entirely in the future -> expect ERR_MEASUREMENT_WINDOW_FUTURE (422)
              payload: { probe_id: "${probe_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-06T00:00:00Z", samples: [ {observed_at: "2026-09-05T19:10:00Z", download_mbps: 250, upload_mbps: 120, latency_ms: 20} ] }
              as: NetworkEngineer
            - call: "POST /test-runs"   # neither violated -> 201
              payload: { probe_id: "${probe_id}", plan_id: "${plan_id}", methodology_doc_id: "${doc_id}", window_start: "2026-08-11T00:01:00Z", window_end: "2026-08-12T00:00:00Z", samples: [ {observed_at: "2026-08-11T19:10:00Z", download_mbps: 250, upload_mbps: 120, latency_ms: 20} ] }
              as: NetworkEngineer
              captures: { run_ok_id: $.data.id }
          assert:
            - "call 1 returns ERR_MEASUREMENT_WINDOW_FUTURE (422), NOT ERR_RUN_DURATION_EXCEEDED, because 55 < 60"
            - "call 2 returns ERR_RUN_DURATION_EXCEEDED (422) — the same shape violation surfaces once the temporal rule is satisfied"
            - "call 3 returns ERR_MEASUREMENT_WINDOW_FUTURE (422) with the duration rule satisfied, proving the two rules are independently reachable"
            - "call 4 returns 201 with TestRun.${run_ok_id}.sample_count == 1 and status == INCLUDED"
            - "after all four calls ServicePlan.${plan_id}.evidence_sample_total == 7 (6 from run A plus 1 from the accepted run); the three rejected calls left it untouched"

