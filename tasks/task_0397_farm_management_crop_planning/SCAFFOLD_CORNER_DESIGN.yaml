      - name: equipment_usage_on_down_asset_rejected
        claim_type: Conditional action
        grounds:
          - endpoints.POST /equipment-usages
          - errors[ERR_EQUIPMENT_DOWN]
          - entities.EquipmentAsset.fields.status
        distinguishing_aspect: "Booking usage on a DOWN equipment asset -> ERR_EQUIPMENT_DOWN (409). Asset is DOWN via no transition endpoint; covered as create-time guard when status DOWN."
        test_recipe:
          setup: ["An equipment asset that is DOWN (constructed by exhausting its lifecycle is not modeled; this corner asserts the guard reads EquipmentAsset.status). A GROWING plan."]
          setup_api_calls:
            - call: "POST /parcels"
              payload: { name: "ED", acreage: 50, soil_type: "LOAM" }
              as: FarmManager
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /input-products"
              payload: { name: "S", category: "SEED", unit: "SEED_UNIT", unit_cost: 0.5 }
              as: FarmManager
              captures: { sp: $.data.id }
            - call: "POST /input-lots"
              payload: { input_product_id: "${sp}", lot_code: "L", quantity_received: 200 }
              as: FarmManager
              captures: { sl: $.data.id }
            - call: "POST /crop-plans"
              payload: { parcel_id: "${pid}", crop: "CORN", season_year: 2026, planned_acres: 40, budget_input_cost: 1, budget_labor_cost: 1, budget_equipment_cost: 1 }
              as: Agronomist
