              as_user_id: cur-01
              captures: { q1: $.data.id, q1v: $.data.version, q1n: $.data.placed_artifact_count, q1min: $.data.required_rh_min_pct, q1lux: $.data.allowed_lux, q1feas: $.data.env_feasible, q1sec: $.data.security_ok, q1vol: $.data.case_volume_m3, q1sil: $.data.silica_gel_kg }
            - call: "GET /gallery-zones/${zone1}"
              payload: {}
              as: MuseumOperations
              as_user_id: ops-01
              captures: { q1zr: $.data.reserved_case_slots, q1za: $.data.available_case_slots }
            - call: "POST /artifact-cases/${q1}/placements"
              payload: { expected_case_version: "${q1v}", artifact_id: "${art1}" }
              as: Curator
              as_user_id: cur-01
              captures: { q2st: $.data.placement_status, q2case: $.data.assigned_case_id, q2acc: $.data.accession_number }
            - call: "GET /artifact-cases/${q1}"
              payload: {}
              as: Conservator
              as_user_id: con-01
              captures: { q2v: $.data.version, q2n: $.data.placed_artifact_count, q2min: $.data.required_rh_min_pct, q2max: $.data.required_rh_max_pct, q2lux: $.data.allowed_lux, q2feas: $.data.env_feasible, q2sec: $.data.security_ok }
            - call: "POST /artifact-cases/${q1}/submit-for-conservation"
              payload: {}
              as: Curator
              as_user_id: cur-01
              captures: { q3st: $.data.status, q3v: $.data.version }
            - call: "POST /artifact-cases/${q1}/conservator-decision"
              payload: { decision: "APPROVE" }
              as: Conservator
              as_user_id: con-01
              captures: { q4st: $.data.status, q4v: $.data.version, q4mount: $.data.mount_status }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { q4cc: $.data.conditional_case_count, q4cb: $.data.conservation_block_count, q4po: $.data.posture }
            - call: "GET /exhibit-projects/${proj}/artifacts"
              payload: { assigned_case_id: "${q1}" }
              as: Curator
              as_user_id: cur-01
              captures: { q4a0: "$.data[0].placement_status" }
          assert:
            - "${q1n} == 0, ${q1min} == null, ${q1lux} == null, ${q1feas} == true and ${q1sec} == true - the create response already carries the empty-set branch of the envelope"
            - "${q1vol} == 0.648 == round_half_up(120.0 * 60.0 * 90.0 / 1000000, 4) and ${q1sil} == 0.91 == round_half_up(0.648 * 0.4 * 3.5, 2) - the geometry-derived fields are computed in the create itself"
            - "${q1zr} == 1 and ${q1za} == 1 - the zone slot ledger on a different aggregate is already reconciled on the read taken immediately after the case create"
            - "${q2st} == RESERVED, ${q2case} == ${q1} and ${q2acc} == 2019.14.3 - the placement write returns the ARTIFACT, not the case"
            - "${q2v} == 2 == ${q1v} + 1, ${q2n} == 1, ${q2min} == 45.0, ${q2max} == 55.0, ${q2lux} == 50.0, ${q2feas} == true and ${q2sec} == true - the case the write did not return is already fully recomputed"
            - "${q3st} == CONSERVATION_REVIEW with ${q3v} == 3, and ${q4st} == CONSERVATION_APPROVED with ${q4v} == 4 - each mutation's own response carries its post-write status and version"
            - "${q4mount} == NOT_STARTED - the parallel mount dimension is untouched by the status dimension"
            - "${q4cc} == 0, ${q4cb} == 0 and ${q4po} == OPEN - an unconditional approval adds nothing to either restriction counter"
            - "${q4a0} == RESERVED - the reverse listing agrees with both parents at every point"
