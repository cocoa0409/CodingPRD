      - name: enhancement_withdraw_conserves_issue_price_identity
        grounds:
          - state_machines.CreditEnhancement.COMMITTED_to_WITHDRAWN
          - calculations.credit_enhancement_premium_and_net_proceeds
          - entities.Deal.fields.issue_price_total_usd
          - entities.Deal.fields.net_proceeds_to_issuer_usd
          - entities.Deal.fields.gross_spread_total_usd
          - entities.Deal.fields.credit_enhancement_premium_usd
        distinguishing_aspect: |
          A different conserved quantity from the par identity: MONEY, namely
          issue_price_total_usd == net_proceeds_to_issuer_usd + gross_spread_total_usd +
          credit_enhancement_premium_usd. The compensating action is the enhancement withdrawal on
          an already PRICED deal, which must move 33,750.00 out of the premium term and into the
          net-proceeds term without changing the issue price or the gross spread, so the identity
          holds at both ends with a different split.
        test_recipe:
          setup:
            - "A negotiated deal (Series 2026Q) is PRICED with takedown 5.000, management fee 2.500 and expenses 1.250 per bond over 10,000 bonds, so gross_spread_total_usd is 87500.00 and issue_price_total_usd is 10711700.00."
            - "A COMMITTED BOND_INSURANCE enhancement at 45 bps insures tranche 1 only, so credit_enhancement_premium_usd is 33750.00 and net_proceeds_to_issuer_usd is 10590450.00."
            - "The statement is PRELIMINARY_POSTED, the undertaking ACTIVE and one institutional order period was closed with zero orders."
            - "The logical clock stands at 2026-08-05T14:00:00.000Z."
          setup_api_calls:
            - call: "POST /bond-offerings/firms"
              payload: { name: "Beta Municipal Advisors", firm_type: "MUNICIPAL_ADVISOR", msrb_registration_id: "MA0001" }
              as: ComplianceOfficer
              captures: { ma_firm_id: $.data.id }
