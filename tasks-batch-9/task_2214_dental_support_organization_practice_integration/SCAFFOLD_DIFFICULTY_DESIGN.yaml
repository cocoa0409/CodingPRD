      - name: affiliation_diligence_reprice_loop_bounded_at_two_rounds
        grounds:
          - state_machines.Affiliation.DILIGENCE_to_DRAFT
          - state_machines.Affiliation.DRAFT_to_DILIGENCE
          - validations[priority=43]
          - errors.ERR_REPRICING_LIMIT_REACHED
          - entities.Affiliation.fields.repricing_round
        distinguishing_aspect: |
          The affiliation returns from DILIGENCE to DRAFT twice, so DRAFT and
          DILIGENCE are each occupied three times, and the third reprice attempt
          is refused with ERR_REPRICING_LIMIT_REACHED at repricing_round == 2 —
          the loop terminates on a counter, not on a state.
        test_recipe:
          setup:
            - "One Affiliation in DRAFT at logical clock 2026-08-01T00:00:00Z (the mandated default) with purchase_price_cents 450000000, earnout_pool_cents 90000000 and repricing_round 0."
            - "One Practice attached to that affiliation so advance-diligence is permitted, and no EarnoutTranche exists."
          setup_api_calls:
            - call: "POST /dso/affiliations"
              payload: { seller_group_name: "Elm Ridge Dental Group", purchase_price_cents: 450000000, earnout_pool_cents: 90000000, baseline_ebitda_cents: 90000000, baseline_net_collections_cents: 400000000, post_close_doctor_term_months: 36 }
