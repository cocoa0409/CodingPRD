        distinguishing_aspect: "Only ACCEPTED trips and ACCEPTED purchases enter the settlement: a GAP_FLAGGED 900.0-mile trip and a RECORDED 60.000-gallon purchase in the same quarter are both ignored, so total_fleet_miles is 400.0 and total_tax_paid_gallons is 40.000 rather than 1300.0 and 100.000."
