      - name: consignor_party_id
        type: string
        source: computed
        description: "FK -> Party.id; copied from the consignment."
      - name: gross_amount
        type: number
        source: computed
        description: "Sum of Lot.extended_amount for this consignment's lots with sale_status == SOLD."
      - name: commission_amount
        type: number
        source: computed
        description: "Produced by calculation seller_commission (dual-variant)."
      - name: yardage_amount
        type: number
        source: computed
        description: "Produced by calculation yardage_charge (dual-variant)."
      - name: feed_amount
        type: number
        source: computed
        description: "Produced by calculation feed_charge."
      - name: statutory_amount
        type: number
        source: computed
        description: "Produced by calculation statutory_checkoff (state share + national share)."
      - name: brand_fee_amount
        type: number
        source: computed
        description: "Produced by calculation brand_inspection_fee."
      - name: indemnity_fee_amount
        type: number
        source: computed
        description: "Produced by calculation indemnity_fee."
      - name: advances_amount
