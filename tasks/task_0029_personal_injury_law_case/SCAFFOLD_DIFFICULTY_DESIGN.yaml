            - "Case.${case_id}.gross_settlement_cents == 6000000"
            - "MedicalLien.${lien_id}.status == 'AGREED'"
            - "MedicalLien.${lien_id}.negotiated_amount_cents == 1500000"
            - "CourtEvent.${event_id}.status == 'CANCELLED'"
            - "Disbursement for case ${case_id}.status == 'PENDING'"
            - "Disbursement for case ${case_id}.contingency_fee_cents == 1999800"
            - "Disbursement for case ${case_id}.total_lien_payout_cents == 1500000"
            - "Disbursement for case ${case_id}.net_to_client_cents == 2500200"

      - name: demand_send_cascade_to_case_demand_sent
        grounds:
          - state_machines.DemandLetter.DRAFT_to_SENT
          - state_machines.Case.ACTIVE_to_DEMAND_SENT
          - entities.Case.fields.status
          - entities.DemandLetter.fields.sent_at
        distinguishing_aspect: |
          Sending a DemandLetter triggers a depth-2 cascade with a distinct origin
          from instance 1 (DemandLetter send vs SettlementOffer accept): hop 1 =
          DemandLetter DRAFT→SENT (status flips, sent_at stamped); hop 2 (caused by
          hop 1) = Case ACTIVE→DEMAND_SENT. The Case transition is reachable ONLY
          via this DemandLetter transition — no direct endpoint exists — proving
          causal chain rather than fan-out. Trigger differs from instance 1.
        test_recipe:
          setup:
            - "Active CA Case (status ACTIVE), one REVIEWED MedicalRecordsRequest, one DRAFT DemandLetter drafted by user_id=drafter_2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
