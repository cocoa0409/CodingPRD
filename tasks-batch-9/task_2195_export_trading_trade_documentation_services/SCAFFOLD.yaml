# =============================================================================
# PRD Benchmark Scaffold — §1.0 through §1.7
# Task 2195 — Export Trading & Trade-Documentation Services
# =============================================================================

scenario: |
  2195. Export Trading & Trade-Documentation Services (export management company):
  letter-of-credit terms review & discrepancy prevention, commercial invoice/packing
  list/certificate of origin generation, incoterm-based cost allocation, export
  control screening & license determination, freight booking & bill-of-lading
  issuance, payment collection & document presentation, foreign-buyer credit
  insurance, dispute & short-shipment

domain_name: "export-trade-documentation"
api_prefix: ""            # every §1.5 path is already absolute and rooted at the API host

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §0.1–§0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
  difficulty_tier: "beyond_expert"
  difficulty_notes: |
    Expert band (§0.4) taken as the floor, then densified rather than widened:
    15 entities / 38 endpoints, but every entity participates in at least one
    cross-entity invariant. Density devices: (1) two calculation families whose
    provisional and final variants diverge only when shipped quantities differ
    from ordered quantities, (2) an ordering-sensitive rounding chain
    (per-line round -> pro-rata freight apportionment -> residual to largest
    line, tie-break line_no ASC) that produces different cents under the
    naive sum-then-round reading, (3) a circular-looking premium computation
    whose rate tier is keyed on an exposure figure the premium itself feeds,
    with a pinned evaluation order, (4) a 33-row priority-ordered validation
    chain with four dual-failure conflicts across four distinct category
    pairs, (5) four OCC rules on four distinct parent entities, and (6) three
    transitive cascades of depth 4, 3 and 3 from three unrelated triggers.
  entity_topology: graph
  entity_topology_notes: |
    PresentationDocumentLink is a many-to-many junction between
    DocumentPresentation and TradeDocument; LetterOfCredit and TradeDocument
    are self-referential (supersedes_lc_id / supersedes_document_id);
    DiscrepancyFinding is a cross-aggregate child of both LetterOfCredit and
    DocumentPresentation. No deep URL nesting beyond one level.
  state_machine_shape: parallel
  state_machine_shape_notes: |
    ExportOrder carries two independent state dimensions
    (fulfillment_status x settlement_status). LetterOfCredit and
    DocumentPresentation are cyclic (amendment rounds / discrepancy-cure
    rounds). ExportControlScreening is a fork-join with divergent
    side-effect sets per branch. DisputeCase is cyclic (offer/counter rounds).
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  role_model_notes: |
    The user who created a LetterOfCredit row may not review it; the user who
    generated a TradeDocument may not examine the presentation that contains
    it; compliance decisions and freight/document preparation are disjoint
    role surfaces.
  consistency_model: saga

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ForeignBuyer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        required: true
        description: "Registered legal name of the overseas buyer"
        constraints: "1-200 chars"
      - name: country_code
        type: string
        source: input
        required: true
        description: "Buyer domicile, ISO 3166-1 alpha-2"
        constraints: "exactly 2 uppercase letters"
      - name: credit_rating
        type: enum
        source: input
        required: true
        description: "External credit grade used by insurance premium tiering"
        constraints: "one of AAA, AA, A, BBB, BB, B, CCC"
      - name: sanctions_tier
        type: enum
        source: input
        required: true
        description: "Jurisdiction sanctions posture of the buyer domicile"
        default: NONE
        constraints: "one of NONE, WATCHLIST, EMBARGOED"
      - name: restricted_party_flag
        type: boolean
        source: input
        required: true
        description: "True when the buyer is on a denied/restricted party list"
        default: false
      - name: restricted_party_reason
        type: string
        source: input
        required: false
        description: "Free-text justification recorded when restricted_party_flag is set true; null when flag is false"
      - name: aggregate_exposure_usd
        type: number
        source: computed
        required: true
        description: "Sum of CreditInsurancePolicy.utilized_usd over this buyer's policies with status IN {ACTIVE, EXHAUSTED}; 2 decimal places"
        default: 0
      - name: open_order_count
        type: integer
        source: computed
        required: true
        description: "Count of this buyer's ExportOrder rows with fulfillment_status NOT IN {CLOSED, CANCELLED}"
        default: 0

  - name: ExportOrder
    parent: null
    common_fields: true
    fields:
      - name: buyer_id
        type: string
        source: input
        required: true
        description: "FK -> ForeignBuyer.id; the overseas buyer of this export shipment"
      - name: prepared_by_user_id
        type: string
        source: system
        required: true
        description: "X-User-ID of the ExportOpsCoordinator that created the order; used by segregation-of-duties checks"
      - name: incoterm
        type: enum
        source: input
        required: true
        description: "Incoterms 2020 rule governing cost allocation"
        constraints: "one of EXW, FCA, FOB, CFR, CIF, DAP, DDP"
      - name: incoterm_named_place
        type: string
        source: input
        required: true
        description: "Named place qualifying the incoterm (e.g. 'FOB Busan')"
      - name: origin_country_code
        type: string
        source: input
        required: true
        description: "Country of manufacture, ISO 3166-1 alpha-2; printed on the certificate of origin"
      - name: destination_country_code
        type: string
        source: input
        required: true
        description: "Country of final destination, ISO 3166-1 alpha-2"
      - name: destination_zone
        type: enum
        source: input
        required: true
        description: "Ocean-freight tariff zone of the destination; selects the freight rate tier"
        constraints: "one of ZONE_1, ZONE_2, ZONE_3"
      - name: invoice_currency
        type: string
        source: input
        required: true
        description: "Currency the commercial invoice is denominated in, ISO 4217"
        default: "USD"
      - name: fx_rate_usd_to_invoice
        type: number
        source: input
        required: true
        description: "USD -> invoice_currency rate, exactly 6 decimal places; 1.000000 when invoice_currency is USD"
        default: 1.0
      - name: ship_by_date
        type: datetime
        source: input
        required: true
        description: "Contractual latest on-board date agreed with the buyer, ISO 8601 UTC"
      - name: fulfillment_status
        type: enum
        source: system
        required: true
        description: "Physical/compliance dimension of the order lifecycle (see §1.2 ExportOrder.fulfillment_status)"
        default: DRAFT
        constraints: "one of DRAFT, COMPLIANCE_PENDING, COMPLIANCE_CLEARED, COMPLIANCE_BLOCKED, BOOKED, SHIPPED, SHORT_SHIPPED, CLOSED, CANCELLED"
      - name: settlement_status
        type: enum
        source: system
        required: true
        description: "Money dimension of the order lifecycle, evolves independently of fulfillment_status (see §1.2 ExportOrder.settlement_status)"
        default: UNSECURED
        constraints: "one of UNSECURED, LC_ACCEPTED, DOCS_PRESENTED, PAID, DISHONORED, CLAIM_FILED, INDEMNIFIED, WRITTEN_OFF"
      - name: ordered_goods_value_usd
        type: number
        source: computed
        required: true
        description: "Sum over all ShipmentLine of round(quantity * unit_price_usd, 2); 2 decimal places"
        default: 0
      - name: shipped_goods_value_usd
        type: number
        source: computed
        required: true
        description: "Sum over all ShipmentLine of round(shipped_quantity * unit_price_usd, 2); 0 until a bill of lading is issued"
        default: 0
      - name: provisional_seller_cost_usd
        type: number
        source: computed
        required: true
        description: "Seller-borne trade cost under calculation incoterm_cost_allocation variant provisional_at_booking"
        default: 0
      - name: provisional_buyer_cost_usd
        type: number
        source: computed
        required: true
        description: "Buyer-borne trade cost under calculation incoterm_cost_allocation variant provisional_at_booking"
        default: 0
      - name: final_seller_cost_usd
        type: number
        source: computed
        required: true
        description: "Seller-borne trade cost under calculation incoterm_cost_allocation variant final_at_bl_issuance; 0 before bill-of-lading issuance"
        default: 0
      - name: final_buyer_cost_usd
        type: number
        source: computed
        required: true
        description: "Buyer-borne trade cost under calculation incoterm_cost_allocation variant final_at_bl_issuance; 0 before bill-of-lading issuance"
        default: 0
      - name: cost_allocation_variance_usd
        type: number
        source: computed
        required: true
        description: "final_seller_cost_usd - provisional_seller_cost_usd; may be negative; 0 before bill-of-lading issuance"
        default: 0
      - name: outstanding_receivable_usd
        type: number
        source: computed
        required: true
        description: "Invoice total of the ISSUED COMMERCIAL_INVOICE minus sum of DocumentPresentation.received_amount_usd over presentations with status HONOURED; 0 when no COMMERCIAL_INVOICE is ISSUED"
        default: 0
      - name: licensed_value_allocated_usd
        type: number
        source: computed
        required: true
        description: "Value of this order charged against an ExportLicense while fulfillment_status IN {BOOKED, SHIPPED, SHORT_SHIPPED, CLOSED}; 0 otherwise"
        default: 0
      - name: insured_exposure_usd
        type: number
        source: computed
        required: true
        description: "Portion of outstanding_receivable_usd charged against a CreditInsurancePolicy while settlement_status IN {LC_ACCEPTED, DOCS_PRESENTED, DISHONORED, CLAIM_FILED}; 0 otherwise"
        default: 0
      - name: short_shipped_value_usd
        type: number
        source: computed
        required: true
        description: "ordered_goods_value_usd - shipped_goods_value_usd after bill-of-lading issuance; 0 while fulfillment_status is not IN {SHIPPED, SHORT_SHIPPED, CLOSED}"
        default: 0

  - name: LetterOfCredit
    parent: null
    common_fields: true
    fields:
      - name: export_order_id
        type: string
        source: input
        required: true
        description: "FK -> ExportOrder.id; the order this credit secures"
      - name: supersedes_lc_id
        type: string
        source: input
        required: false
        description: "FK -> LetterOfCredit.id; set when this row is a replacement credit for a credit whose status is REJECTED or EXPIRED; null otherwise"
      - name: captured_by_user_id
        type: string
        source: system
        required: true
        description: "X-User-ID of the ExportOpsCoordinator that captured the credit terms; a review by this same user id is barred by segregation of duties"
      - name: lc_number
        type: string
        source: input
        required: true
        description: "Documentary-credit reference issued by the issuing bank"
        constraints: "unique across LetterOfCredit rows with status NOT IN {REJECTED, EXPIRED}"
      - name: issuing_bank_swift
        type: string
        source: input
        required: true
        description: "SWIFT BIC of the issuing bank"
        constraints: "8 or 11 uppercase alphanumerics"
      - name: amount_usd
        type: number
        source: input
        required: true
        description: "Face amount of the credit in USD, 2 decimal places"
        constraints: "> 0"
      - name: tolerance_pct
        type: number
        source: input
        required: true
        description: "Permitted plus/minus drawing tolerance in percent, 2 decimal places"
        default: 0
        constraints: ">= 0 and <= 10"
      - name: availability
        type: enum
        source: input
        required: true
        description: "Whether the credit pays at sight or after a usance period"
        constraints: "one of SIGHT, USANCE"
      - name: usance_days
        type: integer
        source: input
        required: true
        description: "Deferred payment tenor in days; must be 0 when availability is SIGHT and >= 30 when availability is USANCE"
        default: 0
      - name: expiry_date
        type: datetime
        source: input
        required: true
        description: "Expiry of the credit for presentation, ISO 8601 UTC"
      - name: latest_shipment_date
        type: datetime
        source: input
        required: true
        description: "Latest permitted on-board date under the credit, ISO 8601 UTC"
      - name: presentation_period_days
        type: integer
        source: input
        required: true
        description: "Days after the on-board date within which documents must be presented"
        default: 21
        constraints: ">= 1 and <= 60"
      - name: partial_shipment_allowed
        type: boolean
        source: input
        required: true
        description: "Whether the credit permits partial shipment"
        default: false
      - name: transshipment_allowed
        type: boolean
        source: input
        required: true
        description: "Whether the credit permits transshipment"
        default: false
      - name: required_document_types
        type: array
        source: input
        required: true
        description: "Document types the credit demands; each element one of COMMERCIAL_INVOICE, PACKING_LIST, CERTIFICATE_OF_ORIGIN, BILL_OF_LADING, INSURANCE_CERTIFICATE, INSPECTION_CERTIFICATE"
        constraints: "non-empty; must contain COMMERCIAL_INVOICE"
      - name: status
        type: enum
        source: system
        required: true
        description: "Credit lifecycle state (see §1.2 LetterOfCredit)"
        default: RECEIVED
        constraints: "one of RECEIVED, UNDER_REVIEW, AMENDMENT_REQUESTED, ACCEPTED, REJECTED, EXPIRED, UTILISED"
      - name: amendment_round
        type: integer
        source: system
        required: true
        description: "Number of amendments applied in place to this credit row; incremented on each AMENDMENT_REQUESTED -> RECEIVED or ACCEPTED -> RECEIVED transition"
        default: 0
      - name: max_drawable_usd
        type: number
        source: computed
        required: true
        description: "round(amount_usd * (1 + tolerance_pct / 100), 2); recomputed whenever amount_usd or tolerance_pct changes"
        default: 0
      - name: min_drawable_usd
        type: number
        source: computed
        required: true
        description: "round(amount_usd * (1 - tolerance_pct / 100), 2); recomputed whenever amount_usd or tolerance_pct changes"
        default: 0
      - name: drawn_amount_usd
        type: number
        source: computed
        required: true
        description: "Sum of DocumentPresentation.received_amount_usd over presentations against this credit with status HONOURED"
        default: 0

  - name: LCTermsReview
    parent: null
    common_fields: true
    fields:
      - name: letter_of_credit_id
        type: string
        source: input
        required: true
        description: "FK -> LetterOfCredit.id; the credit whose terms are under review"
      - name: reviewer_user_id
        type: string
        source: system
        required: true
        description: "X-User-ID of the DocumentaryCreditReviewer that opened the review"
      - name: reviewed_lc_version
        type: integer
        source: system
        required: true
        description: "LetterOfCredit.version pinned at review creation; a submit whose pinned version no longer matches the credit is rejected"
      - name: recommendation
        type: enum
        source: input
        required: false
        description: "Reviewer verdict, set on submit; null while status is DRAFTING"
        constraints: "one of ACCEPT, AMEND, REJECT"
      - name: terms_risk_score
        type: number
        source: computed
        required: true
        description: "Output of calculation lc_discrepancy_risk_score variant pre_shipment_review, 2 decimal places; 0 while status is DRAFTING"
        default: 0
      - name: finding_count
        type: integer
        source: computed
        required: true
        description: "Count of DiscrepancyFinding rows whose lc_terms_review_id equals this review's id"
        default: 0
      - name: status
        type: enum
        source: system
        required: true
        description: "Review lifecycle; DRAFTING until submit, SUBMITTED after submit, SUPERSEDED when an amendment is applied in place to the credit"
        default: DRAFTING
        constraints: "one of DRAFTING, SUBMITTED, SUPERSEDED"

  - name: DiscrepancyFinding
    parent: null
    common_fields: true
    fields:
      - name: letter_of_credit_id
        type: string
        source: input
        required: true
        description: "FK -> LetterOfCredit.id; the credit the finding is raised against"
      - name: lc_terms_review_id
        type: string
        source: input
        required: false
        description: "FK -> LCTermsReview.id; set when source is TERMS, null when source is DOCUMENT"
      - name: document_presentation_id
        type: string
        source: input
        required: false
        description: "FK -> DocumentPresentation.id; set when source is DOCUMENT, null when source is TERMS"
      - name: source
        type: enum
        source: system
        required: true
        description: "TERMS for pre-shipment terms findings, DOCUMENT for findings raised while examining a presentation"
        constraints: "one of TERMS, DOCUMENT"
      - name: code
        type: enum
        source: input
        required: true
        description: "Standardised finding code"
        constraints: "one of AMOUNT_MISMATCH, EXPIRY_UNWORKABLE, LATEST_SHIPMENT_UNWORKABLE, PARTIAL_SHIPMENT_BARRED, DOC_TYPE_MISSING, DESCRIPTION_MISMATCH, WEIGHT_MISMATCH, ORIGIN_MISMATCH, LATE_PRESENTATION, SHORT_DRAWING, DOC_VOIDED"
      - name: severity
        type: enum
        source: input
        required: true
        description: "Finding severity, drives the risk weight in lc_discrepancy_risk_score"
        constraints: "one of CRITICAL, MAJOR, MINOR"
      - name: clause_ref
        type: enum
        source: input
        required: true
        description: "Credit clause the finding attaches to; AMOUNT, EXPIRY and LATEST_SHIPMENT carry the 1.5 clause multiplier"
        constraints: "one of AMOUNT, EXPIRY, LATEST_SHIPMENT, DOCUMENTS, GOODS, OTHER"
      - name: detail
        type: string
        source: input
        required: true
        description: "Human-readable description of the discrepancy"
      - name: cure_status
        type: enum
        source: system
        required: true
        description: "OPEN when raised; CURED when a cure round replaced the offending document; WAIVED when the buyer waived it"
        default: OPEN
        constraints: "one of OPEN, CURED, WAIVED"
      - name: waived_by_buyer_id
        type: string
        source: system
        required: false
        description: "FK -> ForeignBuyer.id; the buyer identity that waived this finding; null unless cure_status is WAIVED"
      - name: buyer_reference
        type: string
        source: input
        required: false
        description: "Buyer's own reference recorded with the waiver; null unless cure_status is WAIVED"
      - name: raised_in_round
        type: integer
        source: system
        required: true
        description: "DocumentPresentation.presentation_round at which the finding was raised; 0 for source TERMS"
        default: 0

  - name: ShipmentLine
    parent: ExportOrder
    common_fields: true
    fields:
      - name: export_order_id
        type: string
        source: input
        required: true
        description: "FK -> ExportOrder.id; the order this line belongs to"
      - name: line_no
        type: integer
        source: input
        required: true
        description: "1-based ordinal of the line on the invoice; sole tie-break key for rounding-residual assignment"
        constraints: "unique per export_order_id, >= 1"
      - name: goods_description
        type: string
        source: input
        required: true
        description: "Goods description as it must appear on the invoice and the credit"
      - name: hs_code
        type: string
        source: input
        required: true
        description: "Harmonised System tariff code, 6 or 10 digits"
      - name: quantity
        type: number
        source: input
        required: true
        description: "Ordered quantity, 3 decimal places"
        constraints: "> 0"
      - name: uom
        type: enum
        source: input
        required: true
        description: "Unit of measure"
        constraints: "one of EA, KG, LTR, MTR, SET"
      - name: unit_price_usd
        type: number
        source: input
        required: true
        description: "Unit price in USD, 4 decimal places"
        constraints: "> 0"
      - name: line_discount_pct
        type: number
        source: input
        required: true
        description: "Line-level discount in percent, 2 decimal places"
        default: 0
        constraints: ">= 0 and <= 40"
      - name: net_weight_kg
        type: number
        source: input
        required: true
        description: "Net weight of the line, 3 decimal places"
        constraints: "> 0"
      - name: gross_weight_kg
        type: number
        source: input
        required: true
        description: "Gross weight of the line including packing, 3 decimal places"
        constraints: ">= net_weight_kg"
      - name: package_count
        type: integer
        source: input
        required: true
        description: "Number of packages for this line, printed on the packing list"
        constraints: ">= 1"
      - name: shipped_quantity
        type: number
        source: system
        required: true
        description: "Quantity actually taken on board, set by bill-of-lading issuance; 0 before issuance"
        default: 0
      - name: line_extended_usd
        type: number
        source: computed
        required: true
        description: "round(quantity * unit_price_usd, 2) — per-line rounding is pinned before any summation"
        default: 0
      - name: line_net_usd
        type: number
        source: computed
        required: true
        description: "line_extended_usd - round(line_extended_usd * line_discount_pct / 100, 2)"
        default: 0
      - name: apportioned_freight_usd
        type: number
        source: computed
        required: true
        description: "Seller-borne main carriage apportioned to this line by calculation commercial_invoice_totalling; 0 when the incoterm leaves main carriage to the buyer"
        default: 0

  - name: TradeDocument
    parent: null
    common_fields: true
    fields:
      - name: export_order_id
        type: string
        source: input
        required: true
        description: "FK -> ExportOrder.id; the order this document evidences"
      - name: supersedes_document_id
        type: string
        source: input
        required: false
        description: "FK -> TradeDocument.id; set when this row is a regenerated revision replacing an earlier document; null for revision 1"
      - name: generated_by_user_id
        type: string
        source: system
        required: true
        description: "X-User-ID that generated the document; a presentation containing this document may not be examined by this same user id"
      - name: doc_type
        type: enum
        source: input
        required: true
        description: "Kind of trade document"
        constraints: "one of COMMERCIAL_INVOICE, PACKING_LIST, CERTIFICATE_OF_ORIGIN, BILL_OF_LADING, INSURANCE_CERTIFICATE, INSPECTION_CERTIFICATE"
      - name: revision
        type: integer
        source: system
        required: true
        description: "1 for the first generation of this doc_type on the order; predecessor revision + 1 on regenerate"
        default: 1
      - name: status
        type: enum
        source: system
        required: true
        description: "Document lifecycle (see §1.2 TradeDocument)"
        default: DRAFT
        constraints: "one of DRAFT, ISSUED, SUPERSEDED, VOIDED"
      - name: pinned_order_version
        type: integer
        source: system
        required: true
        description: "ExportOrder.version observed at generation time; issue is refused when it no longer matches the order's current version"
      - name: declared_total_usd
        type: number
        source: computed
        required: true
        description: "Invoice total in USD from calculation commercial_invoice_totalling; 0 for doc_type NOT IN {COMMERCIAL_INVOICE, INSURANCE_CERTIFICATE}"
        default: 0
      - name: declared_total_invoice_currency
        type: number
        source: computed
        required: true
        description: "round(declared_total_usd * ExportOrder.fx_rate_usd_to_invoice, 2) — single rounding at the end of the chain"
        default: 0
      - name: total_gross_weight_kg
        type: number
        source: computed
        required: true
        description: "Sum of ShipmentLine.gross_weight_kg over the order's lines with quantity > 0 at generation time (packing list, bill of lading); 3 decimal places"
        default: 0
      - name: total_package_count
        type: integer
        source: computed
        required: true
        description: "Sum of ShipmentLine.package_count over the order's lines at generation time"
        default: 0
      - name: origin_country_code
        type: string
        source: computed
        required: true
        description: "Copied from ExportOrder.origin_country_code at generation time; printed on the certificate of origin"
      - name: on_board_date
        type: datetime
        source: system
        required: false
        description: "On-board date stamped when doc_type is BILL_OF_LADING; null for all other document types"
      - name: void_reason
        type: string
        source: input
        required: false
        description: "Reason recorded when the document is voided; null unless status is VOIDED"

  - name: ExportControlScreening
    parent: null
    common_fields: true
    fields:
      - name: export_order_id
        type: string
        source: input
        required: true
        description: "FK -> ExportOrder.id; the order being screened"
      - name: ruleset_version
        type: integer
        source: system
        required: true
        description: "Screening ruleset generation the case was opened under; incremented by a re-screen"
        default: 1
      - name: decided_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID of the TradeComplianceOfficer that recorded the decision; null while status is INITIATED"
      - name: eccn
        type: string
        source: input
        required: false
        description: "Export control classification number assigned by the decision; null while status is INITIATED"
        constraints: "matches ^[0-9][A-E][0-9]{3}$ when present"
      - name: denied_party_hits
        type: integer
        source: input
        required: true
        description: "Number of denied-party list matches recorded by the decision"
        default: 0
      - name: license_determination
        type: enum
        source: system
        required: false
        description: "Outcome of the classification; null while status is INITIATED"
        constraints: "one of NLR, LICENSE_REQUIRED, PROHIBITED"
      - name: export_license_id
        type: string
        source: system
        required: false
        description: "FK -> ExportLicense.id; the license that cleared this screening, set by POST /export-control-screenings/{screening_id}/clear-with-license; null otherwise"
      - name: status
        type: enum
        source: system
        required: true
        description: "Screening lifecycle (see §1.2 ExportControlScreening)"
        default: INITIATED
        constraints: "one of INITIATED, PENDING_LICENSE, CLEARED, BLOCKED"
      - name: cleared_at
        type: datetime
        source: system
        required: false
        description: "Logical-clock instant at which status became CLEARED; null otherwise"

  - name: ExportLicense
    parent: null
    common_fields: true
    fields:
      - name: export_control_screening_id
        type: string
        source: input
        required: true
        description: "FK -> ExportControlScreening.id; the screening case this license answers"
      - name: license_number
        type: string
        source: input
        required: true
        description: "Authority-issued license reference"
        constraints: "unique across ExportLicense rows"
      - name: authority
        type: enum
        source: input
        required: true
        description: "Issuing authority"
        constraints: "one of BIS, DDTC, OFAC, NATIONAL_OTHER"
      - name: eccn
        type: string
        source: input
        required: true
        description: "Classification the license authorises; must equal the screening's eccn"
      - name: valid_from
        type: datetime
        source: input
        required: true
        description: "First instant of validity, inclusive, ISO 8601 UTC"
      - name: valid_to
        type: datetime
        source: input
        required: true
        description: "Last instant of validity, inclusive, ISO 8601 UTC"
        constraints: "> valid_from"
      - name: licensed_value_usd
        type: number
        source: input
        required: true
        description: "Ceiling of aggregate shipment value the license authorises, 2 decimal places"
        constraints: "> 0"
      - name: consumed_value_usd
        type: number
        source: computed
        required: true
        description: "Sum of ExportOrder.licensed_value_allocated_usd over orders charged against this license; conserved quantity of calculation license_value_consumption"
        default: 0
      - name: remaining_value_usd
        type: number
        source: computed
        required: true
        description: "licensed_value_usd - consumed_value_usd; never negative"
        default: 0
      - name: status
        type: enum
        source: system
        required: true
        description: "ISSUED on creation; ACTIVE once it clears a screening; EXHAUSTED when remaining_value_usd is 0; EXPIRED by the clock sweep once valid_to is passed"
        default: ISSUED
        constraints: "one of ISSUED, ACTIVE, EXHAUSTED, EXPIRED"

  - name: VesselSailing
    parent: null
    common_fields: true
    fields:
      - name: carrier_scac
        type: string
        source: input
        required: true
        description: "Standard carrier alpha code"
        constraints: "4 uppercase letters"
      - name: vessel_name
        type: string
        source: input
        required: true
        description: "Vessel name"
      - name: voyage_no
        type: string
        source: input
        required: true
        description: "Voyage number"
        constraints: "unique per carrier_scac"
      - name: port_of_loading
        type: string
        source: input
        required: true
        description: "UN/LOCODE of the loading port"
      - name: port_of_discharge
        type: string
        source: input
        required: true
        description: "UN/LOCODE of the discharge port"
      - name: destination_zone
        type: enum
        source: input
        required: true
        description: "Tariff zone this sailing serves; must equal the booked order's destination_zone"
        constraints: "one of ZONE_1, ZONE_2, ZONE_3"
      - name: cutoff_at
        type: datetime
        source: input
        required: true
        description: "Documentation cut-off instant; start of the loading window, inclusive"
      - name: etd
        type: datetime
        source: input
        required: true
        description: "Estimated time of departure; end of the loading window, exclusive"
        constraints: "> cutoff_at"
      - name: eta
        type: datetime
        source: input
        required: true
        description: "Estimated time of arrival"
        constraints: "> etd"
      - name: capacity_weight_kg
        type: number
        source: input
        required: true
        description: "Aggregate bookable gross weight for this sailing, 3 decimal places"
        constraints: "> 0"
      - name: booked_weight_kg
        type: number
        source: computed
        required: true
        description: "Sum of FreightBooking.booked_weight_kg over bookings on this sailing with status IN {BOOKED, CONFIRMED, SHIPPED}; conserved quantity of calculation sailing_capacity_ledger"
        default: 0
      - name: tariff_rate_per_1000kg_usd
        type: number
        source: input
        required: true
        description: "Published ocean-freight rate per 1000 kg of chargeable weight for this sailing, 2 decimal places"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        required: true
        description: "OPEN while bookable; FULL when booked_weight_kg >= capacity_weight_kg; CUTOFF_PASSED and DEPARTED set by the clock sweep"
        default: OPEN
        constraints: "one of OPEN, FULL, CUTOFF_PASSED, DEPARTED"

  - name: FreightBooking
    parent: null
    common_fields: true
    fields:
      - name: export_order_id
        type: string
        source: input
        required: true
        description: "FK -> ExportOrder.id; the order being shipped"
      - name: vessel_sailing_id
        type: string
        source: input
        required: true
        description: "FK -> VesselSailing.id; the sailing carrying this booking"
      - name: booked_weight_kg
        type: number
        source: input
        required: true
        description: "Gross weight reserved on the sailing, 3 decimal places"
        constraints: "> 0"
      - name: container_type
        type: enum
        source: input
        required: true
        description: "Equipment booked"
        constraints: "one of LCL, DRY_20, DRY_40, REEFER_40"
      - name: effective_window_start
        type: datetime
        source: computed
        required: true
        description: "Copied from VesselSailing.cutoff_at; start of this booking's occupation interval, inclusive"
      - name: effective_window_end
        type: datetime
        source: computed
        required: true
        description: "VesselSailing.etd plus DOC_BUFFER_HOURS (24); end of this booking's occupation interval, exclusive"
      - name: chargeable_weight_kg
        type: number
        source: computed
        required: true
        description: "max(booked_weight_kg, CONTAINER_MIN_WEIGHT_KG for container_type), 3 decimal places"
        default: 0
      - name: status
        type: enum
        source: system
        required: true
        description: "Booking lifecycle; BOOKED on creation, CONFIRMED once the order is compliance cleared and the provisional cost allocation is stored, SHIPPED on bill-of-lading issuance, CANCELLED by cancel or by a compliance-block cascade"
        default: BOOKED
        constraints: "one of BOOKED, CONFIRMED, SHIPPED, CANCELLED"
      - name: cancel_reason
        type: string
        source: input
        required: false
        description: "Reason recorded on cancellation; null unless status is CANCELLED"

  - name: DocumentPresentation
    parent: null
    common_fields: true
    fields:
      - name: letter_of_credit_id
        type: string
        source: input
        required: true
        description: "FK -> LetterOfCredit.id; the credit documents are presented under"
      - name: export_order_id
        type: string
        source: input
        required: true
        description: "FK -> ExportOrder.id; the order whose documents are presented"
      - name: presented_by_user_id
        type: string
        source: system
        required: true
        description: "X-User-ID of the ExportOpsCoordinator that lodged the presentation"
      - name: examined_by_user_id
        type: string
        source: system
        required: false
        description: "X-User-ID of the DocumentaryCreditReviewer that examined the presentation; null while status is PRESENTED"
      - name: presented_at
        type: datetime
        source: system
        required: true
        description: "Logical-clock instant of the most recent PRESENTED entry (initial lodgement or cure round)"
      - name: presentation_round
        type: integer
        source: system
        required: true
        description: "1 on lodgement; incremented on every CURING -> PRESENTED cure transition"
        default: 1
      - name: days_after_on_board
        type: integer
        source: computed
        required: false
        description: "Whole days between the BILL_OF_LADING on_board_date and presented_at, floor; null when no BILL_OF_LADING is linked"
      - name: presented_amount_usd
        type: number
        source: computed
        required: true
        description: "declared_total_usd of the linked COMMERCIAL_INVOICE revision at the current presentation_round"
        default: 0
      - name: examination_risk_score
        type: number
        source: computed
        required: true
        description: "Output of calculation lc_discrepancy_risk_score variant presentation_examination, 2 decimal places; 0 while status is PRESENTED"
        default: 0
      - name: negotiable_amount_usd
        type: number
        source: computed
        required: true
        description: "Output of calculation lc_negotiable_amount; 0 until status becomes COMPLIED"
        default: 0
      - name: received_amount_usd
        type: number
        source: input
        required: false
        description: "Funds actually received from the issuing bank, recorded on settlement; null until status is HONOURED"
      - name: value_date
        type: datetime
        source: input
        required: false
        description: "Value date of the received funds; null until status is HONOURED"
      - name: refusal_reason
        type: string
        source: input
        required: false
        description: "Reason recorded when the presentation is refused; null unless status is REFUSED"
      - name: open_finding_count
        type: integer
        source: computed
        required: true
        description: "Count of DiscrepancyFinding rows with document_presentation_id equal to this row's id and cure_status OPEN"
        default: 0
      - name: status
        type: enum
        source: system
        required: true
        description: "Presentation lifecycle (see §1.2 DocumentPresentation)"
        default: PRESENTED
        constraints: "one of PRESENTED, COMPLIED, DISCREPANT, CURING, REFUSED, HONOURED"

  - name: PresentationDocumentLink
    parent: null
    common_fields: false
    fields:
      - name: document_presentation_id
        type: string
        source: input
        required: true
        description: "FK -> DocumentPresentation.id; the presentation this link belongs to"
      - name: trade_document_id
        type: string
        source: input
        required: true
        description: "FK -> TradeDocument.id; the exact document revision tendered"
      - name: doc_type
        type: enum
        source: computed
        required: true
        description: "Copied from the linked TradeDocument.doc_type at link creation"
        constraints: "one of COMMERCIAL_INVOICE, PACKING_LIST, CERTIFICATE_OF_ORIGIN, BILL_OF_LADING, INSURANCE_CERTIFICATE, INSPECTION_CERTIFICATE"
      - name: pinned_document_revision
        type: integer
        source: computed
        required: true
        description: "TradeDocument.revision observed when the link was created; a later revision does not retroactively change the tender"
      - name: linked_in_round
        type: integer
        source: computed
        required: true
        description: "DocumentPresentation.presentation_round at which this link was created"
      - name: link_status
        type: enum
        source: system
        required: true
        description: "ACTIVE while the tender stands; REPLACED when a cure round links a newer revision of the same doc_type; INVALIDATED when the linked document is voided"
        default: ACTIVE
        constraints: "one of ACTIVE, REPLACED, INVALIDATED"

  - name: CreditInsurancePolicy
    parent: null
    common_fields: true
    fields:
      - name: buyer_id
        type: string
        source: input
        required: true
        description: "FK -> ForeignBuyer.id; the buyer whose non-payment risk is insured"
      - name: policy_number
        type: string
        source: input
        required: true
        description: "Insurer policy reference"
        constraints: "unique across CreditInsurancePolicy rows"
      - name: credit_limit_usd
        type: number
        source: input
        required: true
        description: "Maximum insured receivable outstanding at any instant, 2 decimal places"
        constraints: "> 0"
      - name: insured_pct
        type: number
        source: input
        required: true
        description: "Percentage of a covered loss the insurer indemnifies, 2 decimal places"
        constraints: ">= 50 and <= 95"
      - name: deductible_usd
        type: number
        source: input
        required: true
        description: "First-loss retention borne by the seller on each claim, 2 decimal places"
        constraints: ">= 0"
      - name: effective_from
        type: datetime
        source: input
        required: true
        description: "First instant of cover, inclusive"
      - name: effective_to
        type: datetime
        source: input
        required: true
        description: "Last instant of cover, inclusive"
        constraints: "> effective_from"
      - name: exposure_tier
        type: enum
        source: computed
        required: true
        description: "Rate band selected by calculation insurance_premium_assessment step 2; pinned at creation and never recomputed"
        constraints: "one of TIER_1, TIER_2, TIER_3"
      - name: premium_usd
        type: number
        source: computed
        required: true
        description: "Output of calculation insurance_premium_assessment, 2 decimal places"
        default: 0
      - name: utilized_usd
        type: number
        source: computed
        required: true
        description: "Sum of ExportOrder.insured_exposure_usd over the buyer's orders charged against this policy; conserved quantity of calculation insured_exposure_ledger"
        default: 0
      - name: available_limit_usd
        type: number
        source: computed
        required: true
        description: "credit_limit_usd - utilized_usd; never negative"
        default: 0
      - name: indemnified_total_usd
        type: number
        source: computed
        required: true
        description: "Sum of DisputeCase.insurance_indemnity_usd over settled disputes charged to this policy"
        default: 0
      - name: status
        type: enum
        source: system
        required: true
        description: "ACTIVE on creation; EXHAUSTED when available_limit_usd is exactly 0; EXPIRED by the clock sweep once effective_to is passed"
        default: ACTIVE
        constraints: "one of ACTIVE, EXHAUSTED, EXPIRED"

  - name: DisputeCase
    parent: null
    common_fields: true
    fields:
      - name: export_order_id
        type: string
        source: input
        required: true
        description: "FK -> ExportOrder.id; the order in dispute"
      - name: credit_insurance_policy_id
        type: string
        source: input
        required: false
        description: "FK -> CreditInsurancePolicy.id; the policy a non-payment claim is charged to; null for uninsured disputes"
      - name: opened_by_role
        type: enum
        source: system
        required: true
        description: "Role that opened the case; ForeignBuyer for SHORT_SHIPMENT and QUALITY, FinanceCollectionsOfficer for NON_PAYMENT"
        constraints: "one of ForeignBuyer, FinanceCollectionsOfficer"
      - name: dispute_type
        type: enum
        source: input
        required: true
        description: "Nature of the dispute"
        constraints: "one of SHORT_SHIPMENT, QUALITY, NON_PAYMENT"
      - name: claimed_amount_usd
        type: number
        source: input
        required: true
        description: "Amount claimed by the opening party, 2 decimal places"
        constraints: "> 0"
      - name: current_offer_usd
        type: number
        source: system
        required: false
        description: "Most recent offer on the table; null while status is OPEN"
      - name: negotiation_round
        type: integer
        source: system
        required: true
        description: "Incremented on every COUNTERED entry; escalation is forced once it would exceed MAX_NEGOTIATION_ROUNDS"
        default: 0
      - name: settlement_amount_usd
        type: number
        source: computed
        required: false
        description: "Accepted amount; equals the accepted offer or counter; null unless status is SETTLED"
      - name: receivable_offset_usd
        type: number
        source: computed
        required: true
        description: "Waterfall bucket 1 from calculation short_shipment_settlement_waterfall"
        default: 0
      - name: insurance_indemnity_usd
        type: number
        source: computed
        required: true
        description: "Waterfall bucket 2 from calculation short_shipment_settlement_waterfall"
        default: 0
      - name: seller_credit_note_usd
        type: number
        source: computed
        required: true
        description: "Waterfall bucket 3 from calculation short_shipment_settlement_waterfall; absorbs the rounding residual"
        default: 0
      - name: status
        type: enum
        source: system
        required: true
        description: "Dispute lifecycle (see §1.2 DisputeCase)"
        default: OPEN
        constraints: "one of OPEN, OFFERED, COUNTERED, SETTLED, ESCALATED, CLOSED_NO_SETTLEMENT"

# =============================================================================
# §1.2 State Machine Table
#
# ExportOrder carries two independent state dimensions; each is declared as its
# own machine below and named by `state_field`. A transition on one dimension
# never implies a transition on the other unless its side_effects say so.
# =============================================================================
state_machines:

  - entity: ExportOrder
    state_field: fulfillment_status
    shape: "parallel dimension 1 of 2 (physical/compliance axis); contains the COMPLIANCE_BLOCKED -> COMPLIANCE_PENDING re-screen loop"
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: COMPLIANCE_PENDING
        trigger: "POST /export-orders/{export_order_id}/submit-for-compliance"
        actor: ExportOpsCoordinator
        preconditions:
          - "at least one ShipmentLine exists for the order"
          - "every ShipmentLine of the order has quantity > 0"
          - "ForeignBuyer.restricted_party_flag is false for the order's buyer_id"
          - "ForeignBuyer.sanctions_tier is not EMBARGOED for the order's buyer_id"
        side_effects:
          - "creates one ExportControlScreening for the order with status INITIATED and ruleset_version 1"
          - "recomputes ExportOrder.ordered_goods_value_usd per calculation commercial_invoice_totalling step 1 (sum of ShipmentLine.line_extended_usd)"
          - "increments ExportOrder.version by 1"
      - from: COMPLIANCE_PENDING
        to: COMPLIANCE_CLEARED
        trigger: "system, on ExportControlScreening INITIATED -> CLEARED or PENDING_LICENSE -> CLEARED"
        actor: system
        preconditions:
          - "the order's ExportControlScreening.status becomes CLEARED"
        side_effects:
          - "stamps ExportControlScreening.cleared_at with the current logical clock"
          - "increments ExportOrder.version by 1"
      - from: COMPLIANCE_PENDING
        to: COMPLIANCE_BLOCKED
        trigger: "system, on ExportControlScreening INITIATED -> BLOCKED or PENDING_LICENSE -> BLOCKED"
        actor: system
        preconditions:
          - "the order's ExportControlScreening.status becomes BLOCKED"
        side_effects:
          - "increments ExportOrder.version by 1"
      - from: COMPLIANCE_CLEARED
        to: COMPLIANCE_BLOCKED
        trigger: "system, cascade link 1 of PATCH /foreign-buyers/{buyer_id}/restricted-party-flag with restricted_party_flag true"
        actor: system
        preconditions:
          - "the order's buyer_id equals the flagged ForeignBuyer.id"
        side_effects:
          - "cascade link 2: every FreightBooking of this order with status IN {BOOKED, CONFIRMED} moves to CANCELLED with cancel_reason 'RESTRICTED_PARTY_CASCADE'"
          - "the order's ExportControlScreening moves CLEARED -> INITIATED with ruleset_version incremented by 1 and cleared_at reset to null"
          - "increments ExportOrder.version by 1"
      - from: BOOKED
        to: COMPLIANCE_BLOCKED
        trigger: "system, cascade link 1 of PATCH /foreign-buyers/{buyer_id}/restricted-party-flag with restricted_party_flag true"
        actor: system
        preconditions:
          - "the order's buyer_id equals the flagged ForeignBuyer.id"
        side_effects:
          - "cascade link 2: every FreightBooking of this order with status IN {BOOKED, CONFIRMED} moves to CANCELLED with cancel_reason 'RESTRICTED_PARTY_CASCADE'"
          - "sets ExportOrder.licensed_value_allocated_usd to 0 and recomputes the charged ExportLicense.consumed_value_usd per calculation license_value_consumption"
          - "the order's ExportControlScreening moves CLEARED -> INITIATED with ruleset_version incremented by 1 and cleared_at reset to null"
          - "increments ExportOrder.version by 1"
      - from: COMPLIANCE_BLOCKED
        to: COMPLIANCE_PENDING
        trigger: "POST /export-control-screenings/{screening_id}/decision on the re-opened screening (INITIATED)"
        actor: TradeComplianceOfficer
        preconditions:
          - "ForeignBuyer.restricted_party_flag is false for the order's buyer_id"
          - "the order's ExportControlScreening.status is INITIATED"
        side_effects:
          - "increments ExportOrder.version by 1"
        note: "Re-screen loop: COMPLIANCE_BLOCKED -> COMPLIANCE_PENDING -> COMPLIANCE_CLEARED is the recovery path after a restricted-party flag is lifted."
      - from: COMPLIANCE_CLEARED
        to: BOOKED
        trigger: "POST /freight-bookings"
        actor: ExportOpsCoordinator
        preconditions:
          - "the order's ExportControlScreening.status is CLEARED"
          - "VesselSailing.status is OPEN"
          - "VesselSailing.destination_zone equals ExportOrder.destination_zone"
          - "the order has no FreightBooking with status IN {BOOKED, CONFIRMED, SHIPPED} whose occupation interval overlaps the new one"
        side_effects:
          - "creates the FreightBooking with status BOOKED"
          - "adds booked_weight_kg to VesselSailing.booked_weight_kg per calculation sailing_capacity_ledger and moves the sailing OPEN -> FULL when booked_weight_kg >= capacity_weight_kg"
          - "stores ExportOrder.provisional_seller_cost_usd and provisional_buyer_cost_usd per calculation incoterm_cost_allocation variant provisional_at_booking"
          - "when the order's ExportControlScreening.license_determination is LICENSE_REQUIRED, sets ExportOrder.licensed_value_allocated_usd to round(ordered_goods_value_usd, 2) and recomputes the license's consumed_value_usd per calculation license_value_consumption"
          - "increments ExportOrder.version by 1 and VesselSailing.version by 1"
      - from: BOOKED
        to: SHIPPED
        trigger: "POST /freight-bookings/{booking_id}/bill-of-lading"
        actor: ExportOpsCoordinator
        preconditions:
          - "the FreightBooking.status is CONFIRMED"
          - "every ShipmentLine of the order appears in shipped_lines with shipped_quantity equal to its quantity"
        side_effects:
          - "creates a TradeDocument with doc_type BILL_OF_LADING, status ISSUED, revision 1, on_board_date set to the request's on_board_date"
          - "sets each ShipmentLine.shipped_quantity from shipped_lines and recomputes ExportOrder.shipped_goods_value_usd"
          - "moves the FreightBooking CONFIRMED -> SHIPPED"
          - "stores ExportOrder.final_seller_cost_usd, final_buyer_cost_usd and cost_allocation_variance_usd per calculation incoterm_cost_allocation variant final_at_bl_issuance"
          - "sets ExportOrder.short_shipped_value_usd to 0"
          - "increments ExportOrder.version by 1"
      - from: BOOKED
        to: SHORT_SHIPPED
        trigger: "POST /freight-bookings/{booking_id}/bill-of-lading"
        actor: ExportOpsCoordinator
        preconditions:
          - "the FreightBooking.status is CONFIRMED"
          - "at least one ShipmentLine has shipped_quantity strictly less than quantity and every shipped_quantity is > 0"
        side_effects:
          - "creates a TradeDocument with doc_type BILL_OF_LADING, status ISSUED, revision 1, on_board_date set to the request's on_board_date"
          - "sets each ShipmentLine.shipped_quantity from shipped_lines and recomputes ExportOrder.shipped_goods_value_usd"
          - "moves the FreightBooking CONFIRMED -> SHIPPED"
          - "stores ExportOrder.final_seller_cost_usd, final_buyer_cost_usd and cost_allocation_variance_usd per calculation incoterm_cost_allocation variant final_at_bl_issuance"
          - "sets ExportOrder.short_shipped_value_usd to ordered_goods_value_usd - shipped_goods_value_usd"
          - "when the order's LetterOfCredit has partial_shipment_allowed false, marks the order's COMMERCIAL_INVOICE revision stale by leaving pinned_order_version behind the bumped ExportOrder.version"
          - "increments ExportOrder.version by 1"
        note: "Divergent branch: same trigger, different shipped-quantity predicate, different side-effect set from the SHIPPED branch."
      - from: SHIPPED
        to: CLOSED
        trigger: "system, on ExportOrder.settlement_status entering PAID, INDEMNIFIED or WRITTEN_OFF"
        actor: system
        preconditions:
          - "settlement_status IN {PAID, INDEMNIFIED, WRITTEN_OFF}"
        side_effects:
          - "decrements ForeignBuyer.open_order_count by 1"
          - "increments ExportOrder.version by 1"
      - from: SHORT_SHIPPED
        to: CLOSED
        trigger: "system, on ExportOrder.settlement_status entering PAID, INDEMNIFIED or WRITTEN_OFF"
        actor: system
        preconditions:
          - "settlement_status IN {PAID, INDEMNIFIED, WRITTEN_OFF}"
          - "the order has no DisputeCase with status IN {OPEN, OFFERED, COUNTERED, ESCALATED}"
        side_effects:
          - "decrements ForeignBuyer.open_order_count by 1"
          - "increments ExportOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /export-orders/{export_order_id}/cancel"
        actor: ExportOpsCoordinator
        preconditions:
          - "the order has no TradeDocument with status ISSUED"
        side_effects:
          - "decrements ForeignBuyer.open_order_count by 1"
          - "increments ExportOrder.version by 1"
      - from: COMPLIANCE_PENDING
        to: CANCELLED
        trigger: "POST /export-orders/{export_order_id}/cancel"
        actor: ExportOpsCoordinator
        preconditions:
          - "the order has no TradeDocument with status ISSUED"
        side_effects:
          - "the order's ExportControlScreening with status IN {INITIATED, PENDING_LICENSE} is left untouched and no longer gates anything"
          - "decrements ForeignBuyer.open_order_count by 1"
          - "increments ExportOrder.version by 1"
      - from: COMPLIANCE_BLOCKED
        to: CANCELLED
        trigger: "POST /export-orders/{export_order_id}/cancel"
        actor: ExportOpsCoordinator
        preconditions:
          - "the order has no TradeDocument with status ISSUED"
        side_effects:
          - "decrements ForeignBuyer.open_order_count by 1"
          - "increments ExportOrder.version by 1"

  - entity: ExportOrder
    state_field: settlement_status
    shape: "parallel dimension 2 of 2 (money axis); contains the LC_ACCEPTED <-> DOCS_PRESENTED and LC_ACCEPTED -> UNSECURED loops"
    initial_state: UNSECURED
    terminal_states: [PAID, INDEMNIFIED, WRITTEN_OFF]
    transitions:
      - from: UNSECURED
        to: LC_ACCEPTED
        trigger: "POST /lc-terms-reviews/{review_id}/submit with recommendation ACCEPT"
        actor: DocumentaryCreditReviewer
        preconditions:
          - "the review's LetterOfCredit.status is UNDER_REVIEW"
          - "LCTermsReview.terms_risk_score < RISK_ACCEPT_CEILING"
        side_effects:
          - "the LetterOfCredit moves UNDER_REVIEW -> ACCEPTED"
          - "sets ExportOrder.insured_exposure_usd per calculation insured_exposure_ledger and adds it to the buyer's ACTIVE CreditInsurancePolicy.utilized_usd when one exists"
          - "increments ExportOrder.version by 1"
      - from: LC_ACCEPTED
        to: UNSECURED
        trigger: "POST /letters-of-credit/{lc_id}/amendments, or the clock sweep expiring the credit"
        actor: ExportOpsCoordinator | system
        preconditions:
          - "the order's LetterOfCredit leaves ACCEPTED (to RECEIVED on amendment, to EXPIRED on the clock sweep)"
          - "the order has no DocumentPresentation with status IN {PRESENTED, CURING, COMPLIED}"
        side_effects:
          - "releases ExportOrder.insured_exposure_usd to 0 and recomputes CreditInsurancePolicy.utilized_usd per calculation insured_exposure_ledger"
          - "increments ExportOrder.version by 1"
        note: "Cycle: UNSECURED -> LC_ACCEPTED -> UNSECURED repeats once per amendment round."
      - from: LC_ACCEPTED
        to: DOCS_PRESENTED
        trigger: "POST /document-presentations"
        actor: ExportOpsCoordinator
        preconditions:
          - "the LetterOfCredit.status is ACCEPTED"
          - "the order's fulfillment_status IN {SHIPPED, SHORT_SHIPPED}"
        side_effects:
          - "creates the DocumentPresentation with status PRESENTED and presentation_round 1"
          - "creates one ACTIVE PresentationDocumentLink per tendered TradeDocument, pinning its revision"
          - "increments ExportOrder.version by 1"
      - from: DOCS_PRESENTED
        to: LC_ACCEPTED
        trigger: "system, on DocumentPresentation entering DISCREPANT, or cascade link 3 of POST /trade-documents/{document_id}/void"
        actor: system
        preconditions:
          - "the order has no DocumentPresentation with status IN {COMPLIED, HONOURED}"
        side_effects:
          - "increments ExportOrder.version by 1"
        note: "Cycle: DOCS_PRESENTED -> LC_ACCEPTED -> DOCS_PRESENTED repeats once per cure round."
      - from: DOCS_PRESENTED
        to: PAID
        trigger: "POST /document-presentations/{presentation_id}/settlement"
        actor: FinanceCollectionsOfficer
        preconditions:
          - "the DocumentPresentation.status is COMPLIED"
        side_effects:
          - "cascade link 1: the DocumentPresentation moves COMPLIED -> HONOURED and LetterOfCredit.drawn_amount_usd increases by received_amount_usd"
          - "cascade link 2: because the order became PAID, ExportOrder.insured_exposure_usd is released to 0 and the charged CreditInsurancePolicy.utilized_usd is reduced by that amount per calculation insured_exposure_ledger"
          - "cascade link 3: because the policy's utilized_usd fell, ForeignBuyer.aggregate_exposure_usd is recomputed and a policy whose status was EXHAUSTED returns to ACTIVE when available_limit_usd becomes > 0"
          - "the order's fulfillment_status auto-advances SHIPPED -> CLOSED or SHORT_SHIPPED -> CLOSED when that dimension's preconditions hold"
          - "recomputes ExportOrder.outstanding_receivable_usd"
          - "increments ExportOrder.version by 1"
      - from: DOCS_PRESENTED
        to: DISHONORED
        trigger: "POST /document-presentations/{presentation_id}/dishonour"
        actor: FinanceCollectionsOfficer
        preconditions:
          - "the DocumentPresentation.status IN {COMPLIED, DISCREPANT}"
        side_effects:
          - "the DocumentPresentation moves to REFUSED with refusal_reason recorded"
          - "increments ExportOrder.version by 1"
      - from: DISHONORED
        to: CLAIM_FILED
        trigger: "POST /credit-insurance-policies/{policy_id}/claims"
        actor: FinanceCollectionsOfficer
        preconditions:
          - "the CreditInsurancePolicy.status is ACTIVE"
          - "the order's insured_exposure_usd is > 0"
          - "a DisputeCase with dispute_type NON_PAYMENT and status IN {OPEN, OFFERED, COUNTERED, ESCALATED} exists for the order"
        side_effects:
          - "links the DisputeCase to the policy via credit_insurance_policy_id"
          - "increments ExportOrder.version by 1 and CreditInsurancePolicy.version by 1"
      - from: CLAIM_FILED
        to: INDEMNIFIED
        trigger: "system, on the linked DisputeCase entering SETTLED"
        actor: system
        preconditions:
          - "the linked DisputeCase.insurance_indemnity_usd is > 0"
        side_effects:
          - "adds DisputeCase.insurance_indemnity_usd to CreditInsurancePolicy.indemnified_total_usd"
          - "releases ExportOrder.insured_exposure_usd to 0 and recomputes CreditInsurancePolicy.utilized_usd and ForeignBuyer.aggregate_exposure_usd"
          - "the order's fulfillment_status auto-advances to CLOSED when that dimension's preconditions hold"
          - "increments ExportOrder.version by 1"
      - from: DISHONORED
        to: WRITTEN_OFF
        trigger: "POST /export-orders/{export_order_id}/write-off"
        actor: FinanceCollectionsOfficer
        preconditions:
          - "the order has no CreditInsurancePolicy charged (insured_exposure_usd is 0) or the linked DisputeCase.status is CLOSED_NO_SETTLEMENT"
        side_effects:
          - "releases ExportOrder.insured_exposure_usd to 0 and recomputes CreditInsurancePolicy.utilized_usd and ForeignBuyer.aggregate_exposure_usd"
          - "the order's fulfillment_status auto-advances to CLOSED when that dimension's preconditions hold"
          - "increments ExportOrder.version by 1"
      - from: CLAIM_FILED
        to: WRITTEN_OFF
        trigger: "POST /export-orders/{export_order_id}/write-off"
        actor: FinanceCollectionsOfficer
        preconditions:
          - "the linked DisputeCase.status is CLOSED_NO_SETTLEMENT"
        side_effects:
          - "releases ExportOrder.insured_exposure_usd to 0 and recomputes CreditInsurancePolicy.utilized_usd and ForeignBuyer.aggregate_exposure_usd"
          - "the order's fulfillment_status auto-advances to CLOSED when that dimension's preconditions hold"
          - "increments ExportOrder.version by 1"

  - entity: LetterOfCredit
    state_field: status
    shape: "cyclic — AMENDMENT_REQUESTED -> RECEIVED -> UNDER_REVIEW -> AMENDMENT_REQUESTED and ACCEPTED -> RECEIVED are in-place amendment loops"
    initial_state: RECEIVED
    terminal_states: [REJECTED, EXPIRED, UTILISED]
    transitions:
      - from: RECEIVED
        to: UNDER_REVIEW
        trigger: "POST /letters-of-credit/{lc_id}/reviews"
        actor: DocumentaryCreditReviewer
        preconditions:
          - "expected_letter_of_credit_version equals LetterOfCredit.version"
          - "X-User-ID differs from LetterOfCredit.captured_by_user_id"
          - "ForeignBuyer.restricted_party_flag is false for the order's buyer_id"
          - "the current logical clock is strictly before expiry_date"
        side_effects:
          - "creates one LCTermsReview with status DRAFTING and reviewed_lc_version pinned to LetterOfCredit.version"
          - "moves any existing LCTermsReview of this credit with status DRAFTING to SUPERSEDED"
          - "increments LetterOfCredit.version by 1"
      - from: UNDER_REVIEW
        to: ACCEPTED
        trigger: "POST /lc-terms-reviews/{review_id}/submit with recommendation ACCEPT"
        actor: DocumentaryCreditReviewer
        preconditions:
          - "LCTermsReview.status is DRAFTING"
          - "LCTermsReview.reviewed_lc_version equals LetterOfCredit.version"
          - "the review has zero DiscrepancyFinding rows with severity CRITICAL and cure_status OPEN"
          - "terms_risk_score computed by calculation lc_discrepancy_risk_score variant pre_shipment_review is < RISK_ACCEPT_CEILING"
        side_effects:
          - "stores LCTermsReview.terms_risk_score and finding_count, sets its status to SUBMITTED"
          - "recomputes LetterOfCredit.max_drawable_usd and min_drawable_usd"
          - "moves ExportOrder.settlement_status UNSECURED -> LC_ACCEPTED"
          - "increments LetterOfCredit.version by 1"
      - from: UNDER_REVIEW
        to: AMENDMENT_REQUESTED
        trigger: "POST /lc-terms-reviews/{review_id}/submit with recommendation AMEND"
        actor: DocumentaryCreditReviewer
        preconditions:
          - "LCTermsReview.status is DRAFTING"
          - "LCTermsReview.reviewed_lc_version equals LetterOfCredit.version"
          - "the review has at least one DiscrepancyFinding row with cure_status OPEN"
        side_effects:
          - "stores LCTermsReview.terms_risk_score and finding_count, sets its status to SUBMITTED"
          - "increments LetterOfCredit.version by 1"
        note: "Divergent branch of the same trigger: ACCEPT, AMEND and REJECT write three different side-effect sets."
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /lc-terms-reviews/{review_id}/submit with recommendation REJECT"
        actor: DocumentaryCreditReviewer
        preconditions:
          - "LCTermsReview.status is DRAFTING"
          - "LCTermsReview.reviewed_lc_version equals LetterOfCredit.version"
          - "the review has at least one DiscrepancyFinding row with severity CRITICAL and cure_status OPEN, or terms_risk_score >= RISK_REJECT_FLOOR"
        side_effects:
          - "stores LCTermsReview.terms_risk_score and finding_count, sets its status to SUBMITTED"
          - "ExportOrder.settlement_status stays UNSECURED; a replacement credit may be captured with supersedes_lc_id pointing at this row"
          - "increments LetterOfCredit.version by 1"
      - from: AMENDMENT_REQUESTED
        to: RECEIVED
        trigger: "POST /letters-of-credit/{lc_id}/amendments"
        actor: ExportOpsCoordinator
        preconditions:
          - "expected_letter_of_credit_version equals LetterOfCredit.version"
          - "the current logical clock is strictly before expiry_date"
          - "at least one amendable field is present in the request body"
        side_effects:
          - "applies the submitted amendable fields in place and increments amendment_round by 1"
          - "recomputes max_drawable_usd and min_drawable_usd"
          - "moves every LCTermsReview of this credit with status SUBMITTED to SUPERSEDED"
          - "marks every DiscrepancyFinding of this credit with source TERMS and cure_status OPEN as CURED"
          - "increments LetterOfCredit.version by 1"
        note: "Amendment cycle: the credit returns to RECEIVED and must be reviewed again by a reviewer other than captured_by_user_id."
      - from: ACCEPTED
        to: RECEIVED
        trigger: "POST /letters-of-credit/{lc_id}/amendments"
        actor: ExportOpsCoordinator
        preconditions:
          - "expected_letter_of_credit_version equals LetterOfCredit.version"
          - "the order has no DocumentPresentation with status IN {PRESENTED, CURING, COMPLIED, HONOURED}"
          - "the current logical clock is strictly before expiry_date"
        side_effects:
          - "applies the submitted amendable fields in place and increments amendment_round by 1"
          - "recomputes max_drawable_usd and min_drawable_usd"
          - "moves every LCTermsReview of this credit with status SUBMITTED to SUPERSEDED"
          - "moves ExportOrder.settlement_status LC_ACCEPTED -> UNSECURED, which releases insured_exposure_usd and reduces CreditInsurancePolicy.utilized_usd"
          - "increments LetterOfCredit.version by 1"
      - from: ACCEPTED
        to: UTILISED
        trigger: "system, on DocumentPresentation COMPLIED -> HONOURED"
        actor: system
        preconditions:
          - "drawn_amount_usd after the settlement is >= min_drawable_usd"
        side_effects:
          - "increments LetterOfCredit.version by 1"
      - from: RECEIVED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc sweep step 1"
        actor: system
        preconditions:
          - "the new logical clock is strictly after expiry_date"
        side_effects:
          - "increments LetterOfCredit.version by 1"
      - from: UNDER_REVIEW
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc sweep step 1"
        actor: system
        preconditions:
          - "the new logical clock is strictly after expiry_date"
        side_effects:
          - "moves the credit's DRAFTING LCTermsReview to SUPERSEDED"
          - "increments LetterOfCredit.version by 1"
      - from: AMENDMENT_REQUESTED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc sweep step 1"
        actor: system
        preconditions:
          - "the new logical clock is strictly after expiry_date"
        side_effects:
          - "increments LetterOfCredit.version by 1"
      - from: ACCEPTED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc sweep step 1"
        actor: system
        preconditions:
          - "the new logical clock is strictly after expiry_date"
          - "the order has no DocumentPresentation with status IN {COMPLIED, HONOURED}"
        side_effects:
          - "moves ExportOrder.settlement_status LC_ACCEPTED -> UNSECURED when the order has no presentation with status IN {PRESENTED, CURING, COMPLIED}"
          - "moves every DocumentPresentation of this credit with status IN {PRESENTED, CURING, DISCREPANT} to REFUSED with refusal_reason 'CREDIT_EXPIRED'"
          - "increments LetterOfCredit.version by 1"

  - entity: ExportControlScreening
    state_field: status
    shape: "fork-join — INITIATED forks on license_determination into three branches with disjoint side-effect sets, and the LICENSE_REQUIRED branch rejoins CLEARED"
    initial_state: INITIATED
    terminal_states: []
    transitions:
      - from: INITIATED
        to: CLEARED
        trigger: "POST /export-control-screenings/{screening_id}/decision with license_determination NLR"
        actor: TradeComplianceOfficer
        preconditions:
          - "denied_party_hits equals 0"
          - "ForeignBuyer.sanctions_tier is not EMBARGOED for the order's buyer_id"
          - "the order's fulfillment_status IN {COMPLIANCE_PENDING, COMPLIANCE_BLOCKED}"
        side_effects:
          - "stores eccn, license_determination NLR and decided_by_user_id"
          - "stamps cleared_at with the current logical clock"
          - "moves ExportOrder.fulfillment_status to COMPLIANCE_CLEARED (via COMPLIANCE_PENDING when the order was COMPLIANCE_BLOCKED)"
          - "increments ExportControlScreening.version by 1"
      - from: INITIATED
        to: PENDING_LICENSE
        trigger: "POST /export-control-screenings/{screening_id}/decision with license_determination LICENSE_REQUIRED"
        actor: TradeComplianceOfficer
        preconditions:
          - "denied_party_hits equals 0"
          - "eccn is present in the request body"
        side_effects:
          - "stores eccn, license_determination LICENSE_REQUIRED and decided_by_user_id"
          - "ExportOrder.fulfillment_status stays COMPLIANCE_PENDING; no clearance is granted"
          - "increments ExportControlScreening.version by 1"
      - from: INITIATED
        to: BLOCKED
        trigger: "POST /export-control-screenings/{screening_id}/decision with license_determination PROHIBITED, or with denied_party_hits > 0"
        actor: TradeComplianceOfficer
        preconditions:
          - "the order's fulfillment_status IN {COMPLIANCE_PENDING, COMPLIANCE_BLOCKED}"
        side_effects:
          - "stores eccn, license_determination PROHIBITED and decided_by_user_id"
          - "moves ExportOrder.fulfillment_status to COMPLIANCE_BLOCKED"
          - "sets ForeignBuyer.restricted_party_flag true with restricted_party_reason 'DENIED_PARTY_SCREENING_HIT' when denied_party_hits > 0"
          - "increments ExportControlScreening.version by 1"
      - from: PENDING_LICENSE
        to: CLEARED
        trigger: "POST /export-control-screenings/{screening_id}/clear-with-license"
        actor: TradeComplianceOfficer
        preconditions:
          - "ExportLicense.eccn equals this screening's eccn"
          - "the ExportOrder of the license's originating ExportControlScreening (its export_control_screening_id) has the same buyer_id as this screening's ExportOrder"
          - "ExportLicense.status IN {ISSUED, ACTIVE}"
          - "the current logical clock is >= valid_from and <= valid_to"
          - "ExportLicense.remaining_value_usd >= ExportOrder.ordered_goods_value_usd"
        side_effects:
          - "sets ExportControlScreening.export_license_id to the referenced license"
          - "stamps cleared_at with the current logical clock"
          - "moves ExportLicense.status ISSUED -> ACTIVE"
          - "moves ExportOrder.fulfillment_status COMPLIANCE_PENDING -> COMPLIANCE_CLEARED"
          - "increments ExportControlScreening.version by 1 and ExportLicense.version by 1"
        note: "Fork-join: the LICENSE_REQUIRED branch rejoins the NLR branch at CLEARED, but consumes license value that the NLR branch never touches."
      - from: PENDING_LICENSE
        to: BLOCKED
        trigger: "POST /export-control-screenings/{screening_id}/decision with license_determination PROHIBITED"
        actor: TradeComplianceOfficer
        preconditions:
          - "the order's fulfillment_status is COMPLIANCE_PENDING"
        side_effects:
          - "stores license_determination PROHIBITED and decided_by_user_id"
          - "moves ExportOrder.fulfillment_status COMPLIANCE_PENDING -> COMPLIANCE_BLOCKED"
          - "increments ExportControlScreening.version by 1"
      - from: CLEARED
        to: INITIATED
        trigger: "system, cascade of PATCH /foreign-buyers/{buyer_id}/restricted-party-flag with restricted_party_flag true"
        actor: system
        preconditions:
          - "the screening's order belongs to the flagged buyer"
        side_effects:
          - "increments ruleset_version by 1, resets cleared_at to null, license_determination to null"
          - "increments ExportControlScreening.version by 1"
        note: "Re-screen loop: CLEARED -> INITIATED -> CLEARED after the restricted-party flag is lifted."

  - entity: TradeDocument
    state_field: status
    shape: "branching with revision supersession; DRAFT and ISSUED both fork to SUPERSEDED or VOIDED"
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /trade-documents/{document_id}/issue"
        actor: ExportOpsCoordinator
        preconditions:
          - "pinned_order_version equals the current ExportOrder.version"
          - "the order's fulfillment_status NOT IN {COMPLIANCE_BLOCKED, CANCELLED}"
          - "no other TradeDocument of the same doc_type on this order has status ISSUED"
          - "for doc_type CERTIFICATE_OF_ORIGIN, origin_country_code equals the order's origin_country_code"
        side_effects:
          - "recomputes ExportOrder.outstanding_receivable_usd when doc_type is COMMERCIAL_INVOICE"
          - "increments TradeDocument.version by 1 and ExportOrder.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /trade-documents/{document_id}/regenerate"
        actor: ExportOpsCoordinator
        preconditions:
          - "the order's fulfillment_status NOT IN {CANCELLED}"
        side_effects:
          - "creates a new TradeDocument of the same doc_type with revision incremented by 1, status DRAFT, supersedes_document_id set to this row and pinned_order_version set to the current ExportOrder.version"
          - "recomputes the new row's declared_total_usd per calculation commercial_invoice_totalling"
          - "increments TradeDocument.version by 1"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /trade-documents/{document_id}/regenerate"
        actor: ExportOpsCoordinator
        preconditions:
          - "the order's fulfillment_status NOT IN {CANCELLED}"
          - "no PresentationDocumentLink with link_status ACTIVE references this document while its presentation status is HONOURED"
        side_effects:
          - "creates a new TradeDocument of the same doc_type with revision incremented by 1, status DRAFT, supersedes_document_id set to this row and pinned_order_version set to the current ExportOrder.version"
          - "moves every PresentationDocumentLink referencing this document with link_status ACTIVE to REPLACED"
          - "increments TradeDocument.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /trade-documents/{document_id}/void"
        actor: ExportOpsCoordinator
        preconditions:
          - "no PresentationDocumentLink with link_status ACTIVE references this document while its presentation status is HONOURED"
        side_effects:
          - "cascade link 1: every PresentationDocumentLink referencing this document with link_status ACTIVE moves to INVALIDATED"
          - "cascade link 2: because a link was invalidated, each DocumentPresentation owning such a link with status PRESENTED moves to DISCREPANT and a system DiscrepancyFinding is created with source DOCUMENT, code DOC_VOIDED, severity CRITICAL, clause_ref DOCUMENTS, cure_status OPEN and raised_in_round equal to the presentation's presentation_round"
          - "cascade link 3: because the presentation became DISCREPANT, ExportOrder.settlement_status moves DOCS_PRESENTED -> LC_ACCEPTED"
          - "records void_reason and increments TradeDocument.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /trade-documents/{document_id}/void"
        actor: ExportOpsCoordinator
        preconditions:
          - "the document has no PresentationDocumentLink"
        side_effects:
          - "records void_reason and increments TradeDocument.version by 1"

  - entity: FreightBooking
    state_field: status
    shape: "linear with a compensating cancel branch reachable from two states"
    initial_state: BOOKED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: BOOKED
        to: CONFIRMED
        trigger: "POST /freight-bookings/{booking_id}/confirm"
        actor: ExportOpsCoordinator
        preconditions:
          - "the ExportOrder.fulfillment_status is BOOKED"
          - "the VesselSailing.status IN {OPEN, FULL}"
          - "the order has a TradeDocument with doc_type COMMERCIAL_INVOICE and status ISSUED"
          - "the order has a TradeDocument with doc_type PACKING_LIST and status ISSUED"
        side_effects:
          - "increments FreightBooking.version by 1"
        note: "Cross-entity gate: FreightBooking cannot be confirmed until the TradeDocument pair required by the carrier is ISSUED."
      - from: CONFIRMED
        to: SHIPPED
        trigger: "POST /freight-bookings/{booking_id}/bill-of-lading"
        actor: ExportOpsCoordinator
        preconditions:
          - "the VesselSailing.status IN {CUTOFF_PASSED, DEPARTED, FULL, OPEN}"
          - "the ExportOrder.fulfillment_status is BOOKED"
          - "on_board_date is <= the order's LetterOfCredit.latest_shipment_date when a LetterOfCredit with status ACCEPTED exists"
        side_effects:
          - "moves ExportOrder.fulfillment_status BOOKED -> SHIPPED or BOOKED -> SHORT_SHIPPED per the shipped-quantity predicate"
          - "leaves VesselSailing.booked_weight_kg unchanged (SHIPPED still occupies capacity)"
          - "increments FreightBooking.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /freight-bookings/{booking_id}/cancel"
        actor: ExportOpsCoordinator
        preconditions:
          - "the VesselSailing.status is not DEPARTED"
        side_effects:
          - "subtracts booked_weight_kg from VesselSailing.booked_weight_kg per calculation sailing_capacity_ledger and moves the sailing FULL -> OPEN when booked_weight_kg < capacity_weight_kg and the clock is strictly before cutoff_at"
          - "moves ExportOrder.fulfillment_status BOOKED -> COMPLIANCE_CLEARED and releases licensed_value_allocated_usd to 0, recomputing ExportLicense.consumed_value_usd per calculation license_value_consumption and moving the license EXHAUSTED -> ACTIVE when remaining_value_usd becomes > 0"
          - "records cancel_reason and increments FreightBooking.version, VesselSailing.version and ExportOrder.version by 1 each"
        note: "Compensating action for POST /freight-bookings: sailing_capacity_ledger and license_value_consumption must both return to their pre-booking values."
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /freight-bookings/{booking_id}/cancel"
        actor: ExportOpsCoordinator
        preconditions:
          - "the VesselSailing.status is not DEPARTED"
          - "the order has no TradeDocument with doc_type BILL_OF_LADING and status ISSUED"
        side_effects:
          - "subtracts booked_weight_kg from VesselSailing.booked_weight_kg per calculation sailing_capacity_ledger and moves the sailing FULL -> OPEN when booked_weight_kg < capacity_weight_kg and the clock is strictly before cutoff_at"
          - "moves ExportOrder.fulfillment_status BOOKED -> COMPLIANCE_CLEARED and releases licensed_value_allocated_usd to 0, recomputing ExportLicense.consumed_value_usd"
          - "records cancel_reason and increments FreightBooking.version, VesselSailing.version and ExportOrder.version by 1 each"
      - from: BOOKED
        to: CANCELLED
        trigger: "system, cascade link 2 of PATCH /foreign-buyers/{buyer_id}/restricted-party-flag with restricted_party_flag true"
        actor: system
        preconditions:
          - "the booking's ExportOrder moved into COMPLIANCE_BLOCKED as cascade link 1"
        side_effects:
          - "cascade link 3: subtracts booked_weight_kg from VesselSailing.booked_weight_kg and moves the sailing FULL -> OPEN when booked_weight_kg < capacity_weight_kg"
          - "sets cancel_reason 'RESTRICTED_PARTY_CASCADE' and increments FreightBooking.version and VesselSailing.version by 1 each"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "system, cascade link 2 of PATCH /foreign-buyers/{buyer_id}/restricted-party-flag with restricted_party_flag true"
        actor: system
        preconditions:
          - "the booking's ExportOrder moved into COMPLIANCE_BLOCKED as cascade link 1"
        side_effects:
          - "cascade link 3: subtracts booked_weight_kg from VesselSailing.booked_weight_kg and moves the sailing FULL -> OPEN when booked_weight_kg < capacity_weight_kg"
          - "cascade link 4: because the order left BOOKED, the charged ExportLicense.consumed_value_usd is reduced and the license moves EXHAUSTED -> ACTIVE when remaining_value_usd becomes > 0"
          - "sets cancel_reason 'RESTRICTED_PARTY_CASCADE' and increments FreightBooking.version, VesselSailing.version and ExportLicense.version by 1 each"

  - entity: DocumentPresentation
    state_field: status
    shape: "cyclic — DISCREPANT -> CURING -> PRESENTED -> DISCREPANT is the discrepancy-cure loop, one round per pass"
    initial_state: PRESENTED
    terminal_states: [HONOURED, REFUSED]
    transitions:
      - from: PRESENTED
        to: COMPLIED
        trigger: "POST /document-presentations/{presentation_id}/examine"
        actor: DocumentaryCreditReviewer
        preconditions:
          - "X-User-ID differs from the generated_by_user_id of every TradeDocument linked with link_status ACTIVE"
          - "the current logical clock is <= LetterOfCredit.expiry_date"
          - "days_after_on_board is <= LetterOfCredit.presentation_period_days"
          - "every doc_type in LetterOfCredit.required_document_types has an ACTIVE PresentationDocumentLink"
          - "presented_amount_usd is <= LetterOfCredit.max_drawable_usd"
          - "the examination raises zero DiscrepancyFinding rows with severity IN {CRITICAL, MAJOR}"
        side_effects:
          - "stores examined_by_user_id and examination_risk_score per calculation lc_discrepancy_risk_score variant presentation_examination"
          - "stores negotiable_amount_usd per calculation lc_negotiable_amount"
          - "persists any raised DiscrepancyFinding rows with severity MINOR and cure_status OPEN"
          - "increments DocumentPresentation.version by 1"
      - from: PRESENTED
        to: DISCREPANT
        trigger: "POST /document-presentations/{presentation_id}/examine"
        actor: DocumentaryCreditReviewer
        preconditions:
          - "X-User-ID differs from the generated_by_user_id of every TradeDocument linked with link_status ACTIVE"
          - "the examination raises at least one DiscrepancyFinding row with severity IN {CRITICAL, MAJOR}"
        side_effects:
          - "persists every raised DiscrepancyFinding with source DOCUMENT, cure_status OPEN and raised_in_round equal to presentation_round"
          - "stores examined_by_user_id, examination_risk_score and open_finding_count"
          - "moves ExportOrder.settlement_status DOCS_PRESENTED -> LC_ACCEPTED"
          - "increments DocumentPresentation.version by 1"
        note: "Divergent branch of the same trigger: the COMPLIED branch prices the drawing, the DISCREPANT branch reverts the order's money dimension."
      - from: DISCREPANT
        to: CURING
        trigger: "POST /document-presentations/{presentation_id}/cure"
        actor: ExportOpsCoordinator
        preconditions:
          - "LetterOfCredit.status is ACCEPTED"
          - "the current logical clock is <= LetterOfCredit.expiry_date"
          - "presentation_round is < MAX_CURE_ROUNDS"
          - "every replacement_document_id references a TradeDocument with status ISSUED on the same export_order_id"
        side_effects:
          - "moves every PresentationDocumentLink whose doc_type matches a replacement document and whose link_status is ACTIVE or INVALIDATED to REPLACED"
          - "marks every DiscrepancyFinding of this presentation with cure_status OPEN whose clause_ref is addressed by a replacement doc_type as CURED"
          - "increments DocumentPresentation.version by 1"
      - from: CURING
        to: PRESENTED
        trigger: "system, immediately after the cure links are written"
        actor: system
        preconditions:
          - "at least one new ACTIVE PresentationDocumentLink was created by the cure"
        side_effects:
          - "increments presentation_round by 1 and re-stamps presented_at with the current logical clock"
          - "creates one ACTIVE PresentationDocumentLink per replacement document with pinned_document_revision and linked_in_round set to the new presentation_round"
          - "recomputes presented_amount_usd from the newly linked COMMERCIAL_INVOICE revision"
          - "moves ExportOrder.settlement_status LC_ACCEPTED -> DOCS_PRESENTED"
          - "increments DocumentPresentation.version by 1"
        note: "Cure cycle closes here: the presentation is examinable again and MINOR findings are dropped from the score once presentation_round >= 2."
      - from: DISCREPANT
        to: COMPLIED
        trigger: "system, on the last OPEN DiscrepancyFinding of this presentation becoming WAIVED via POST /discrepancy-findings/{finding_id}/waiver"
        actor: system
        preconditions:
          - "open_finding_count becomes 0"
          - "the current logical clock is <= LetterOfCredit.expiry_date"
        side_effects:
          - "stores negotiable_amount_usd per calculation lc_negotiable_amount"
          - "moves ExportOrder.settlement_status LC_ACCEPTED -> DOCS_PRESENTED"
          - "increments DocumentPresentation.version by 1"
      - from: COMPLIED
        to: HONOURED
        trigger: "POST /document-presentations/{presentation_id}/settlement"
        actor: FinanceCollectionsOfficer
        preconditions:
          - "received_amount_usd is <= LetterOfCredit.max_drawable_usd"
          - "received_amount_usd is <= negotiable_amount_usd"
        side_effects:
          - "stores received_amount_usd and value_date"
          - "moves ExportOrder.settlement_status DOCS_PRESENTED -> PAID, which starts the three-link settlement cascade"
          - "moves LetterOfCredit ACCEPTED -> UTILISED when drawn_amount_usd >= min_drawable_usd"
          - "increments DocumentPresentation.version by 1"
      - from: COMPLIED
        to: REFUSED
        trigger: "POST /document-presentations/{presentation_id}/dishonour"
        actor: FinanceCollectionsOfficer
        preconditions:
          - "the ExportOrder.settlement_status is DOCS_PRESENTED"
        side_effects:
          - "records refusal_reason and moves ExportOrder.settlement_status DOCS_PRESENTED -> DISHONORED"
          - "increments DocumentPresentation.version by 1"
      - from: DISCREPANT
        to: REFUSED
        trigger: "POST /document-presentations/{presentation_id}/dishonour, or POST /_clock/set_current_utc sweep step 1 expiring the credit"
        actor: FinanceCollectionsOfficer | system
        preconditions:
          - "the presentation has at least one DiscrepancyFinding with cure_status OPEN, or LetterOfCredit.status became EXPIRED"
        side_effects:
          - "records refusal_reason and moves ExportOrder.settlement_status to DISHONORED when the order was DOCS_PRESENTED"
          - "increments DocumentPresentation.version by 1"

  - entity: DisputeCase
    state_field: status
    shape: "cyclic — OFFERED <-> COUNTERED is a bounded negotiation loop that forks to SETTLED or ESCALATED"
    initial_state: OPEN
    terminal_states: [SETTLED, CLOSED_NO_SETTLEMENT]
    transitions:
      - from: OPEN
        to: OFFERED
        trigger: "POST /dispute-cases/{dispute_id}/offers"
        actor: FinanceCollectionsOfficer
        preconditions:
          - "offer_amount_usd is <= claimed_amount_usd"
          - "for dispute_type SHORT_SHIPMENT, offer_amount_usd is <= ExportOrder.short_shipped_value_usd"
        side_effects:
          - "stores current_offer_usd"
          - "increments DisputeCase.version by 1"
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /dispute-cases/{dispute_id}/counter"
        actor: ForeignBuyer
        preconditions:
          - "X-User-ID equals ExportOrder.buyer_id"
          - "counter_amount_usd is > current_offer_usd and <= claimed_amount_usd"
          - "negotiation_round + 1 is <= MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "stores current_offer_usd equal to counter_amount_usd and increments negotiation_round by 1"
          - "increments DisputeCase.version by 1"
      - from: COUNTERED
        to: OFFERED
        trigger: "POST /dispute-cases/{dispute_id}/offers"
        actor: FinanceCollectionsOfficer
        preconditions:
          - "offer_amount_usd is <= current_offer_usd"
          - "negotiation_round is < MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "stores current_offer_usd"
          - "increments DisputeCase.version by 1"
        note: "Negotiation cycle: OFFERED -> COUNTERED -> OFFERED repeats at most MAX_NEGOTIATION_ROUNDS times."
      - from: COUNTERED
        to: ESCALATED
        trigger: "POST /dispute-cases/{dispute_id}/counter when the round bound is reached"
        actor: system
        preconditions:
          - "negotiation_round equals MAX_NEGOTIATION_ROUNDS"
        side_effects:
          - "leaves current_offer_usd at its last value and increments DisputeCase.version by 1"
      - from: OFFERED
        to: SETTLED
        trigger: "POST /dispute-cases/{dispute_id}/accept"
        actor: ForeignBuyer
        preconditions:
          - "X-User-ID equals ExportOrder.buyer_id"
          - "current_offer_usd is not null"
        side_effects:
          - "sets settlement_amount_usd to current_offer_usd"
          - "allocates receivable_offset_usd, insurance_indemnity_usd and seller_credit_note_usd per calculation short_shipment_settlement_waterfall"
          - "reduces ExportOrder.outstanding_receivable_usd by receivable_offset_usd"
          - "when credit_insurance_policy_id is set, adds insurance_indemnity_usd to CreditInsurancePolicy.indemnified_total_usd and moves ExportOrder.settlement_status CLAIM_FILED -> INDEMNIFIED"
          - "increments DisputeCase.version by 1"
      - from: COUNTERED
        to: SETTLED
        trigger: "POST /dispute-cases/{dispute_id}/accept"
        actor: FinanceCollectionsOfficer
        preconditions:
          - "current_offer_usd is not null"
        side_effects:
          - "sets settlement_amount_usd to current_offer_usd"
          - "allocates receivable_offset_usd, insurance_indemnity_usd and seller_credit_note_usd per calculation short_shipment_settlement_waterfall"
          - "reduces ExportOrder.outstanding_receivable_usd by receivable_offset_usd"
          - "when credit_insurance_policy_id is set, adds insurance_indemnity_usd to CreditInsurancePolicy.indemnified_total_usd and moves ExportOrder.settlement_status CLAIM_FILED -> INDEMNIFIED"
          - "increments DisputeCase.version by 1"
      - from: ESCALATED
        to: SETTLED
        trigger: "POST /dispute-cases/{dispute_id}/accept"
        actor: PlatformAdmin
        preconditions:
          - "current_offer_usd is not null"
        side_effects:
          - "sets settlement_amount_usd to current_offer_usd and allocates the three waterfall buckets"
          - "reduces ExportOrder.outstanding_receivable_usd by receivable_offset_usd"
          - "when credit_insurance_policy_id is set, adds insurance_indemnity_usd to CreditInsurancePolicy.indemnified_total_usd and moves ExportOrder.settlement_status CLAIM_FILED -> INDEMNIFIED"
          - "increments DisputeCase.version by 1"
      - from: ESCALATED
        to: CLOSED_NO_SETTLEMENT
        trigger: "POST /dispute-cases/{dispute_id}/close"
        actor: PlatformAdmin
        preconditions:
          - "the case has been ESCALATED"
        side_effects:
          - "sets receivable_offset_usd, insurance_indemnity_usd and seller_credit_note_usd to 0"
          - "increments DisputeCase.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent entity's `version` only
# =============================================================================
concurrency_rules:

  - rule_id: lc-review-stale-credit
    parent_entity: LetterOfCredit
    write_endpoint: "POST /letters-of-credit/{lc_id}/reviews"
    occ_field: "expected_letter_of_credit_version"
    description: |
      Opening a terms review against a credit whose version has advanced since
      the client last read it is rejected. This captures the case where an
      amendment has already been applied in place to the credit (bumping
      amendment_round, max_drawable_usd and version) so the terms the client
      intends to review are no longer the terms of record; a review opened
      on that stale view would pin reviewed_lc_version to a value the credit
      has already left behind.
    error_id: ERR_STALE_LC_VERSION
    http_status: 412

  - rule_id: lc-amendment-stale-credit
    parent_entity: LetterOfCredit
    write_endpoint: "POST /letters-of-credit/{lc_id}/amendments"
    occ_field: "expected_letter_of_credit_version"
    description: |
      Applying an amendment in place to a credit whose version has advanced
      since the client last read it is rejected. Because each amendment
      legitimately supersedes the prior terms, an amendment computed against a
      stale view would silently overwrite the amendment of record and leave
      amendment_round inconsistent with the applied field values.
    error_id: ERR_STALE_LC_VERSION
    http_status: 412

  - rule_id: booking-stale-sailing
    parent_entity: VesselSailing
    write_endpoint: "POST /freight-bookings"
    occ_field: "expected_vessel_sailing_version"
    description: |
      Booking space on a sailing whose version has advanced since the client
      last read it is rejected. Another booking may already have consumed part
      of capacity_weight_kg (legitimately, since multiple orders share a
      sailing), so the remaining capacity the client used to size this booking
      is stale and the capacity ledger would be evaluated against a figure the
      sailing has already left behind.
    error_id: ERR_STALE_SAILING_VERSION
    http_status: 412

  - rule_id: presentation-stale-order
    parent_entity: ExportOrder
    write_endpoint: "POST /document-presentations"
    occ_field: "expected_export_order_version"
    description: |
      Lodging a presentation against an order whose version has advanced since
      the client last read it is rejected. A regenerated document revision or a
      final cost reallocation legitimately supersedes the figures the client
      used to choose which document revisions to tender, so the tender would
      pin revisions that are no longer the revisions of record.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: claim-stale-policy
    parent_entity: CreditInsurancePolicy
    write_endpoint: "POST /credit-insurance-policies/{policy_id}/claims"
    occ_field: "expected_credit_insurance_policy_version"
    description: |
      Filing a claim against a policy whose version has advanced since the
      client last read it is rejected. Settlements and write-offs on other
      orders legitimately move utilized_usd and available_limit_usd, so the
      coverage headroom the client used to size the claim is stale.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# Global numeric conventions: every monetary figure is USD with 2 decimal
# places, ROUND_HALF_UP, unless a rule says otherwise. Quantities carry 3
# decimal places, unit prices 4, FX rates exactly 6. "round(x, n)" always
# means ROUND_HALF_UP at n decimal places.
# =============================================================================
calculations:

  - name: incoterm_cost_allocation
    description: |
      Splits eight trade-cost buckets between seller and buyer according to the
      order's Incoterms 2020 rule, then reports each side's total. The bucket
      set a side owns is a step function of the incoterm; three of the eight
      buckets are themselves non-linear in chargeable weight or goods value.
    trigger: "POST /freight-bookings (variant provisional_at_booking); POST /freight-bookings/{booking_id}/bill-of-lading (variant final_at_bl_issuance); GET /export-orders/{export_order_id}/cost-allocation recomputes and returns both variants without persisting"
    algorithm: tiered_pricing
    input_set: |
      ShipmentLine rows of the order with quantity > 0, ordered by line_no ASC;
      the order's single FreightBooking with status IN {BOOKED, CONFIRMED,
      SHIPPED} (a CANCELLED booking is excluded); that booking's VesselSailing.
      Cancelled bookings and lines with quantity 0 never enter any bucket.
    formula: |
      # --- weight and value bases (differ per variant, see `variants`) ---
      W = max(weight_basis, CONTAINER_MIN_WEIGHT_KG[booking.container_type])
      V = value_basis
      CW_UNITS = ceil(W / 1000)                       # integer freight units

      # --- the eight buckets, each rounded to 2dp BEFORE any summation ---
      B1_inland_origin   = round(INLAND_ORIGIN_RATE_PER_1000KG_USD * CW_UNITS, 2)
      B2_export_clear    = EXPORT_CLEARANCE_FEE_USD
      B3_thc_origin      = TERMINAL_HANDLING_ORIGIN_USD
      B4_main_carriage   = max(MIN_OCEAN_FREIGHT_USD,
                               round(sailing.tariff_rate_per_1000kg_usd
                                     * ZONE_MULTIPLIER[order.destination_zone]
                                     * CW_UNITS, 2))
      B5_marine_ins      = max(MIN_MARINE_PREMIUM_USD,
                               round(MARINE_INSURANCE_RATE_PCT / 100
                                     * V * INSURANCE_COVER_FACTOR, 2))
      B6_thc_dest        = TERMINAL_HANDLING_DEST_USD
      B7_inland_dest     = round(INLAND_DEST_RATE_PER_1000KG_USD * CW_UNITS, 2)
      B8_import_duty     = round(IMPORT_DUTY_PCT / 100 * V, 2)

      # --- incoterm -> seller-owned bucket set (buyer owns the complement) ---
      SELLER_BUCKETS[EXW] = {}
      SELLER_BUCKETS[FCA] = {B1, B2}
      SELLER_BUCKETS[FOB] = {B1, B2, B3}
      SELLER_BUCKETS[CFR] = {B1, B2, B3, B4}
      SELLER_BUCKETS[CIF] = {B1, B2, B3, B4, B5}
      SELLER_BUCKETS[DAP] = {B1, B2, B3, B4, B5, B6, B7}
      SELLER_BUCKETS[DDP] = {B1, B2, B3, B4, B5, B6, B7, B8}

      seller_cost = sum of the already-rounded buckets in SELLER_BUCKETS[incoterm]
      buyer_cost  = sum of the already-rounded buckets NOT in SELLER_BUCKETS[incoterm]
      # Rounding order is pinned: round per bucket, then sum. Summing the raw
      # bucket expressions and rounding once at the end is NOT the rule.

      cost_allocation_variance_usd = final_seller_cost_usd - provisional_seller_cost_usd
    constants:
      INLAND_ORIGIN_RATE_PER_1000KG_USD: 42.00
      INLAND_DEST_RATE_PER_1000KG_USD: 55.00
      EXPORT_CLEARANCE_FEE_USD: 180.00
      TERMINAL_HANDLING_ORIGIN_USD: 320.00
      TERMINAL_HANDLING_DEST_USD: 295.00
      MIN_OCEAN_FREIGHT_USD: 450.00
      MIN_MARINE_PREMIUM_USD: 75.00
      MARINE_INSURANCE_RATE_PCT: 0.35
      INSURANCE_COVER_FACTOR: 1.10
      IMPORT_DUTY_PCT: 6.50
      ZONE_MULTIPLIER_ZONE_1: 1.00
      ZONE_MULTIPLIER_ZONE_2: 1.15
      ZONE_MULTIPLIER_ZONE_3: 1.35
      CONTAINER_MIN_WEIGHT_KG_LCL: 0
      CONTAINER_MIN_WEIGHT_KG_DRY_20: 8000
      CONTAINER_MIN_WEIGHT_KG_DRY_40: 15000
      CONTAINER_MIN_WEIGHT_KG_REEFER_40: 12000
    precision: "each bucket 2 decimal places round_half_up; CW_UNITS is an integer via ceil; totals are exact sums of rounded buckets"
    variants:
      - name: provisional_at_booking
        when: "stored into provisional_seller_cost_usd / provisional_buyer_cost_usd at POST /freight-bookings"
        difference: |
          weight_basis = sum of ShipmentLine.gross_weight_kg over lines with
          quantity > 0 (ordered weights, ignoring shipped_quantity);
          value_basis = ExportOrder.ordered_goods_value_usd.
      - name: final_at_bl_issuance
        when: "stored into final_seller_cost_usd / final_buyer_cost_usd at POST /freight-bookings/{booking_id}/bill-of-lading"
        difference: |
          weight_basis = sum over lines with shipped_quantity > 0 of
          round(gross_weight_kg * shipped_quantity / quantity, 3);
          value_basis = ExportOrder.shipped_goods_value_usd. On a full shipment
          the two variants agree only when ceil(W/1000) lands on the same
          integer; on a short shipment they diverge in all five of B1, B4, B5,
          B7 and B8 at once, and the divergence is NOT proportional to the
          shipped-value ratio because B2, B3 and B6 are flat and B4 and B5
          carry floors.

  - name: commercial_invoice_totalling
    description: |
      Builds the commercial-invoice money figures from the order's shipment
      lines. The rounding order is the crux: per-line rounding happens first,
      the seller-borne main-carriage pool is then apportioned pro rata with the
      residual driven to a single line, and the FX conversion rounds exactly
      once at the very end.
    trigger: "POST /trade-documents with doc_type COMMERCIAL_INVOICE; POST /trade-documents/{document_id}/regenerate; also recomputes ShipmentLine.line_extended_usd, line_net_usd and apportioned_freight_usd, ExportOrder.ordered_goods_value_usd, and TradeDocument.declared_total_usd / declared_total_invoice_currency"
    algorithm: waterfall_allocation
    input_set: |
      ShipmentLine rows of the order with billable_quantity > 0, processed in
      line_no ASC order. billable_quantity = ShipmentLine.shipped_quantity when
      ExportOrder.fulfillment_status IN {SHIPPED, SHORT_SHIPPED, CLOSED},
      otherwise ShipmentLine.quantity. Lines whose billable_quantity is 0 are
      excluded from every step including the apportionment denominator.
    formula: |
      # step 1 — per-line rounding FIRST (pinned)
      for each line in line_no ASC:
        line_extended_usd = round(billable_quantity * unit_price_usd, 2)
        line_discount     = round(line_extended_usd * line_discount_pct / 100, 2)
        line_net_usd      = line_extended_usd - line_discount

      # step 2 — subtotal is the exact sum of the ALREADY ROUNDED line nets.
      #          round(sum of raw products) is explicitly NOT the rule.
      invoice_subtotal_usd = sum(line_net_usd)

      # step 3 — seller-borne freight pool to spread over the lines
      F = B4_main_carriage from incoterm_cost_allocation when B4 is in
          SELLER_BUCKETS[order.incoterm], else 0.00
          (provisional_at_booking variant before a BILL_OF_LADING is ISSUED,
           final_at_bl_issuance variant afterwards)

      # step 4 — pro-rata apportionment with a single residual sink
      for each line in line_no ASC:
        apportioned_freight_usd = round(F * line_net_usd / invoice_subtotal_usd, 2)
      residual = round(F - sum(apportioned_freight_usd), 2)
      sink_line = the line with the greatest line_net_usd;
                  ties broken by the smaller line_no (never by id)
      sink_line.apportioned_freight_usd += residual

      # step 5 — insurance certificate value, seller-borne only
      INS = B5_marine_ins from incoterm_cost_allocation when B5 is in
            SELLER_BUCKETS[order.incoterm], else 0.00

      # step 6 — totals; no re-rounding of USD intermediates
      declared_total_usd = invoice_subtotal_usd + F + INS

      # step 7 — FX applied ONCE, at the end
      declared_total_invoice_currency =
        round(declared_total_usd * order.fx_rate_usd_to_invoice, 2)
    constants:
      MAX_LINES_PER_INVOICE: 50
    precision: "line figures 2 decimal places round_half_up; the FX conversion is the only rounding applied to a total; ordered_goods_value_usd = sum over ALL lines of round(quantity * unit_price_usd, 2) regardless of billable_quantity"
    variants:
      - name: pre_shipment_invoice
        when: "generated while ExportOrder.fulfillment_status NOT IN {SHIPPED, SHORT_SHIPPED, CLOSED}"
        difference: "billable_quantity is ShipmentLine.quantity and F comes from the provisional_at_booking cost variant"
      - name: post_shipment_invoice
        when: "generated or regenerated after a BILL_OF_LADING is ISSUED"
        difference: |
          billable_quantity is ShipmentLine.shipped_quantity, so a line whose
          shipped_quantity is 0 leaves the apportionment denominator entirely
          and the residual sink can move to a different line than it occupied
          pre-shipment.

  - name: lc_discrepancy_risk_score
    description: |
      Scores documentary-credit risk from the findings raised against a credit.
      The same finding set scores differently before shipment (terms review)
      and at presentation examination: the examination variant admits a second
      finding source, discounts findings carried over from earlier cure rounds,
      and drops MINOR findings once the presentation has been cured at least
      once.
    trigger: "POST /lc-terms-reviews/{review_id}/submit stores LCTermsReview.terms_risk_score (variant pre_shipment_review); POST /document-presentations/{presentation_id}/examine stores DocumentPresentation.examination_risk_score (variant presentation_examination)"
    algorithm: weighted_scoring
    input_set: |
      DiscrepancyFinding rows selected per variant (see `variants`). Rows with
      cure_status WAIVED contribute 0.00 in both variants and are still counted
      in finding_count. Rows belonging to a LCTermsReview whose status is
      SUPERSEDED are excluded from both variants.
    formula: |
      SEVERITY_WEIGHT = { CRITICAL: 40, MAJOR: 15, MINOR: 5 }
      CLAUSE_MULTIPLIER = 1.5 when clause_ref IN {AMOUNT, EXPIRY, LATEST_SHIPMENT}
                          else 1.0

      # contribution rounded per finding FIRST, then summed, then capped
      for each selected finding f, in created_at ASC order:
        contribution(f) = round(SEVERITY_WEIGHT[f.severity]
                                * CLAUSE_MULTIPLIER(f.clause_ref)
                                * CARRYOVER_FACTOR(f), 2)
      raw_score = sum of contributions
      score = min(RISK_SCORE_CEILING, raw_score)
    constants:
      RISK_SCORE_CEILING: 100.00
      RISK_ACCEPT_CEILING: 45.00
      RISK_REJECT_FLOOR: 60.00
      CARRYOVER_FACTOR_SAME_ROUND: 1.0
      CARRYOVER_FACTOR_EARLIER_ROUND: 0.5
      MAX_CURE_ROUNDS: 3
    precision: "each contribution 2 decimal places round_half_up, then summed exactly, then capped at RISK_SCORE_CEILING"
    variants:
      - name: pre_shipment_review
        when: "computed on POST /lc-terms-reviews/{review_id}/submit"
        difference: |
          Selected findings: source TERMS, lc_terms_review_id equal to the
          submitting review's id, cure_status IN {OPEN, CURED}.
          CARRYOVER_FACTOR(f) is always CARRYOVER_FACTOR_SAME_ROUND (1.0) —
          the terms review has no round concept. MINOR findings always count.
          Gate: a recommendation of ACCEPT requires score < RISK_ACCEPT_CEILING;
          a score >= RISK_REJECT_FLOOR permits only REJECT.
      - name: presentation_examination
        when: "computed on POST /document-presentations/{presentation_id}/examine"
        difference: |
          Selected findings: source DOCUMENT with document_presentation_id equal
          to the presentation's id, PLUS source TERMS findings of the same
          letter_of_credit_id whose cure_status is OPEN.
          CARRYOVER_FACTOR(f) = CARRYOVER_FACTOR_SAME_ROUND when
          f.raised_in_round equals the presentation's current
          presentation_round, otherwise CARRYOVER_FACTOR_EARLIER_ROUND (0.5).
          When presentation_round >= 2, findings with severity MINOR are
          excluded from the selection entirely (not merely down-weighted).
          Consequence: an identical finding set scores strictly lower here from
          round 2 onward, and the two variants disagree even on round 1
          whenever a source TERMS finding is still OPEN.

  - name: lc_negotiable_amount
    description: |
      Prices the drawing under the credit and decides whether the presented
      invoice amount is drawable. Both drawing bounds are hard boundaries with
      pinned comparison operators, and the sight/usance branch changes which
      deductions apply.
    trigger: "POST /document-presentations/{presentation_id}/examine (bounds check and, on the COMPLIED branch, storing negotiable_amount_usd); the same bounds are re-checked at POST /document-presentations/{presentation_id}/settlement"
    algorithm: threshold
    input_set: |
      The presentation's LetterOfCredit; the presentation's presented_amount_usd
      taken from the ACTIVE PresentationDocumentLink whose doc_type is
      COMMERCIAL_INVOICE at the current presentation_round (there is exactly one
      such link; a REPLACED or INVALIDATED link is never read).
    formula: |
      max_drawable_usd = round(lc.amount_usd * (1 + lc.tolerance_pct / 100), 2)
      min_drawable_usd = round(lc.amount_usd * (1 - lc.tolerance_pct / 100), 2)

      # over-drawing is a hard rejection; equality is ALLOWED (strict >)
      if presented_amount_usd > max_drawable_usd:
          reject with ERR_LC_AMOUNT_EXCEEDED

      # under-drawing raises a finding, never a rejection
      effective_floor =
        if lc.partial_shipment_allowed:
            round(lc.amount_usd
                  * (1 - max(lc.tolerance_pct, PARTIAL_UNDERDRAW_PCT) / 100), 2)
        else:
            min_drawable_usd
      if presented_amount_usd < effective_floor:
          raise DiscrepancyFinding(code SHORT_DRAWING, severity MAJOR,
                                   clause_ref AMOUNT)

      gross = min(presented_amount_usd, max_drawable_usd)
      # both deductions are computed from `gross`, never from a running balance
      negotiation_fee = max(MIN_NEGOTIATION_FEE_USD,
                            round(gross * NEGOTIATION_FEE_PCT / 100, 2))
      usance_discount =
        if lc.availability == SIGHT: 0.00
        else: round(gross * USANCE_DISCOUNT_RATE_PCT / 100
                    * lc.usance_days / USANCE_DAY_BASIS, 2)
      negotiable_amount_usd = max(0.00, gross - negotiation_fee - usance_discount)
    constants:
      PARTIAL_UNDERDRAW_PCT: 5.00
      MIN_NEGOTIATION_FEE_USD: 150.00
      NEGOTIATION_FEE_PCT: 0.125
      USANCE_DISCOUNT_RATE_PCT: 4.75
      USANCE_DAY_BASIS: 360
      MIN_USANCE_DAYS: 30
    precision: "bounds and deductions 2 decimal places round_half_up; the usance day fraction uses a 360-day basis and is not rounded before multiplication"
    variants:
      - name: sight_negotiation
        when: "lc.availability is SIGHT (usance_days must be 0)"
        difference: "usance_discount is exactly 0.00; only the negotiation fee is deducted"
      - name: usance_negotiation
        when: "lc.availability is USANCE (usance_days >= MIN_USANCE_DAYS)"
        difference: |
          usance_discount is deducted in addition to the fee and scales linearly
          with usance_days on a 360-day basis, so usance_days = 360 deducts the
          full USANCE_DISCOUNT_RATE_PCT of gross.

  - name: insurance_premium_assessment
    description: |
      Prices a foreign-buyer credit insurance policy. The rate band is keyed on
      an exposure figure that this very policy will contribute to once orders
      are charged against it, so the evaluation order is pinned: the tier is
      resolved from persisted exposure plus this policy's own limit, before the
      policy row exists, and is never recomputed afterwards.
    trigger: "POST /credit-insurance-policies"
    algorithm: constraint_propagation
    input_set: |
      The buyer's existing CreditInsurancePolicy rows with status IN {ACTIVE,
      EXHAUSTED} (rows with status EXPIRED are excluded); the buyer's
      credit_rating; the request body's credit_limit_usd, insured_pct and
      deductible_usd.
    formula: |
      # --- PINNED EVALUATION ORDER (steps must run in this sequence) ---
      # step 1: read exposure from persisted state, BEFORE inserting this policy
      exposure_before = sum of CreditInsurancePolicy.utilized_usd over the
                        buyer's policies with status IN {ACTIVE, EXHAUSTED}
                        # equals ForeignBuyer.aggregate_exposure_usd

      # step 2: tier basis includes this policy's own limit; upper bounds are
      #         inclusive (<=), so exactly 250000.00 is TIER_1
      tier_basis = exposure_before + credit_limit_usd
      exposure_tier = TIER_1 if tier_basis <= TIER_1_CEILING_USD
                 else TIER_2 if tier_basis <= TIER_2_CEILING_USD
                 else TIER_3
      tier_rate_pct = { TIER_1: TIER_1_RATE_PCT,
                        TIER_2: TIER_2_RATE_PCT,
                        TIER_3: TIER_3_RATE_PCT }[exposure_tier]

      # step 3: rating multiplier from the buyer's credit_rating
      rating_multiplier = RATING_MULTIPLIER[buyer.credit_rating]

      # step 4: base premium, rounded once
      base_premium = round(credit_limit_usd * insured_pct / 100
                           * tier_rate_pct / 100 * rating_multiplier, 2)

      # step 5: policy fee, waived only on the cheapest tier with real retention
      policy_fee = 0.00 if (exposure_tier == TIER_1
                            and deductible_usd >= DEDUCTIBLE_FEE_WAIVER_USD)
                   else max(POLICY_FEE_MIN_USD,
                            round(credit_limit_usd * POLICY_FEE_PCT / 100, 2))

      # step 6
      premium_usd = base_premium + policy_fee

      # step 7: persist the policy with utilized_usd 0.00 and
      #         available_limit_usd = credit_limit_usd, THEN recompute
      #         ForeignBuyer.aggregate_exposure_usd including this row.
      #         exposure_tier and premium_usd are frozen for the policy's life.
    constants:
      TIER_1_CEILING_USD: 250000.00
      TIER_2_CEILING_USD: 1000000.00
      TIER_1_RATE_PCT: 0.85
      TIER_2_RATE_PCT: 1.15
      TIER_3_RATE_PCT: 1.60
      RATING_MULTIPLIER_AAA: 0.80
      RATING_MULTIPLIER_AA: 0.85
      RATING_MULTIPLIER_A: 0.90
      RATING_MULTIPLIER_BBB: 1.00
      RATING_MULTIPLIER_BB: 1.20
      RATING_MULTIPLIER_B: 1.45
      RATING_MULTIPLIER_CCC: 1.80
      POLICY_FEE_MIN_USD: 250.00
      POLICY_FEE_PCT: 0.10
      DEDUCTIBLE_FEE_WAIVER_USD: 5000.00
    precision: "base_premium and policy_fee each rounded to 2 decimal places round_half_up, then added; premium_usd is never re-rounded"
    variants:
      - name: fee_waived_tier_1
        when: "exposure_tier is TIER_1 and deductible_usd >= DEDUCTIBLE_FEE_WAIVER_USD"
        difference: "policy_fee is exactly 0.00, so premium_usd equals base_premium"
      - name: fee_charged
        when: "exposure_tier is TIER_2 or TIER_3, or deductible_usd < DEDUCTIBLE_FEE_WAIVER_USD"
        difference: "policy_fee is the max of the floor and the percentage of credit_limit_usd and is added to base_premium"

  - name: insured_exposure_ledger
    description: |
      Charges and releases a policy's insured exposure as orders move along the
      settlement dimension. Conserves the identity
      utilized_usd + available_limit_usd == credit_limit_usd at every instant,
      including after every compensating release.
    trigger: "ExportOrder.settlement_status transitions UNSECURED -> LC_ACCEPTED (charge) and LC_ACCEPTED -> UNSECURED, DOCS_PRESENTED -> PAID, CLAIM_FILED -> INDEMNIFIED, DISHONORED -> WRITTEN_OFF, CLAIM_FILED -> WRITTEN_OFF (release)"
    algorithm: aggregation
    input_set: |
      Candidate policies: CreditInsurancePolicy rows with buyer_id equal to the
      order's buyer_id, status ACTIVE, effective_from <= current logical clock
      <= effective_to, and available_limit_usd >= required_charge.
      Ranking: available_limit_usd DESC; tie-break created_at ASC (never id).
      Empty candidate set: no policy is charged, ExportOrder.insured_exposure_usd
      stays 0.00 and the order proceeds uninsured (no error).
    formula: |
      required_charge = round(ExportOrder.ordered_goods_value_usd, 2)

      # charge
      policy = first candidate under the ranking above
      ExportOrder.insured_exposure_usd = required_charge
      policy.utilized_usd        += required_charge
      policy.available_limit_usd  = policy.credit_limit_usd - policy.utilized_usd
      policy.status = EXHAUSTED if policy.available_limit_usd == 0.00 else ACTIVE

      # release (compensating action)
      policy.utilized_usd        -= ExportOrder.insured_exposure_usd
      ExportOrder.insured_exposure_usd = 0.00
      policy.available_limit_usd  = policy.credit_limit_usd - policy.utilized_usd
      policy.status = ACTIVE if policy.available_limit_usd > 0.00 else EXHAUSTED
      ForeignBuyer.aggregate_exposure_usd =
        sum of utilized_usd over the buyer's policies with status IN {ACTIVE, EXHAUSTED}

      # INVARIANT (must hold after every charge and every release):
      #   policy.utilized_usd + policy.available_limit_usd == policy.credit_limit_usd
      #   policy.utilized_usd == sum of ExportOrder.insured_exposure_usd over the
      #     buyer's orders charged to this policy
    constants:
      EXHAUSTION_EPSILON_USD: 0.00
    precision: "2 decimal places round_half_up; EXHAUSTED is decided on exact equality with 0.00, not on a tolerance"
    variants:
      - name: insured_charge
        when: "at least one candidate policy exists at charge time"
        difference: "insured_exposure_usd is the full required_charge and the policy's headroom shrinks by it"
      - name: uninsured_passthrough
        when: "the candidate set is empty (no ACTIVE policy in window with enough headroom)"
        difference: "insured_exposure_usd stays 0.00; a later claim on this order is impossible and only the write-off path closes it"

  - name: license_value_consumption
    description: |
      Maintains the value drawn against an export license as orders are booked,
      shipped and cancelled. Conserves
      consumed_value_usd + remaining_value_usd == licensed_value_usd.
    trigger: "POST /export-control-screenings/{screening_id}/clear-with-license (link), POST /freight-bookings (charge), POST /freight-bookings/{booking_id}/cancel and the restricted-party cascade (release)"
    algorithm: aggregation
    input_set: |
      ExportOrder rows whose ExportControlScreening.export_license_id equals this
      license's id and whose fulfillment_status IN {BOOKED, SHIPPED,
      SHORT_SHIPPED, CLOSED}. Orders in DRAFT, COMPLIANCE_PENDING,
      COMPLIANCE_CLEARED, COMPLIANCE_BLOCKED or CANCELLED contribute 0.00.
    formula: |
      for each qualifying order:
        ExportOrder.licensed_value_allocated_usd = round(ordered_goods_value_usd, 2)
      consumed_value_usd  = sum of licensed_value_allocated_usd over qualifying orders
      remaining_value_usd = licensed_value_usd - consumed_value_usd
      status = EXHAUSTED if remaining_value_usd == 0.00
               else ACTIVE if the license has cleared at least one screening
               else ISSUED

      # gate at charge time (equality is allowed, strict >)
      if consumed_value_usd + round(order.ordered_goods_value_usd, 2) > licensed_value_usd:
          reject with ERR_LICENSE_VALUE_EXHAUSTED

      # INVARIANT: consumed_value_usd + remaining_value_usd == licensed_value_usd
      # after every charge and every release, and remaining_value_usd is never < 0
    constants:
      LICENSE_UTILISATION_WARN_PCT: 90.00
    precision: "2 decimal places round_half_up; remaining_value_usd is recomputed from the sum, never decremented in place"
    variants:
      - name: charge_on_booking
        when: "an order with license_determination LICENSE_REQUIRED enters fulfillment_status BOOKED"
        difference: "licensed_value_allocated_usd is set to the ordered value, not the shipped value, so a later short shipment does not reduce consumption"
      - name: release_on_cancel_or_block
        when: "the order leaves BOOKED via booking cancellation or the restricted-party cascade"
        difference: "licensed_value_allocated_usd returns to 0.00 and the license status steps back EXHAUSTED -> ACTIVE when remaining_value_usd becomes > 0"

  - name: sailing_capacity_ledger
    description: |
      Maintains the aggregate booked weight on a sailing and the OPEN/FULL
      posture derived from it. Conserves
      booked_weight_kg == sum of live booking weights.
    trigger: "POST /freight-bookings (charge), POST /freight-bookings/{booking_id}/cancel and the restricted-party cascade (release)"
    algorithm: aggregation
    input_set: |
      FreightBooking rows on the sailing with status IN {BOOKED, CONFIRMED,
      SHIPPED}. Rows with status CANCELLED contribute 0.000.
    formula: |
      booked_weight_kg = sum of FreightBooking.booked_weight_kg over live rows

      # gate at booking time — equality is ALLOWED (strict >)
      if booked_weight_kg + request.booked_weight_kg > capacity_weight_kg:
          reject with ERR_SAILING_CAPACITY_EXCEEDED

      status = FULL  if booked_weight_kg >= capacity_weight_kg
               OPEN  if booked_weight_kg <  capacity_weight_kg
                        and current clock < cutoff_at
      # CUTOFF_PASSED and DEPARTED are set only by the clock sweep and are not
      # overwritten by this ledger.

      # INVARIANT: booked_weight_kg == sum of live booking weights after every
      # charge and every release; a create-then-cancel pair returns the sailing
      # to its exact prior booked_weight_kg and status.
    constants:
      DOC_BUFFER_HOURS: 24
    precision: "3 decimal places for weights, round_half_up; FULL is decided with >= and the capacity gate with strict >"
    variants:
      - name: aggregate_capacity_check
        when: "POST /freight-bookings on a sailing with status OPEN"
        difference: "the check is aggregate over the whole loading window; individual bookings never conflict with each other on this axis"
      - name: per_order_window_check
        when: "POST /freight-bookings for an order that already holds a live booking"
        difference: |
          the second check is geometric, not aggregate: the new booking's
          half-open interval [cutoff_at, etd + DOC_BUFFER_HOURS) must not
          intersect the interval of any of the order's bookings with status IN
          {BOOKED, CONFIRMED, SHIPPED}. Touching endpoints do NOT overlap
          (an interval starting exactly at another's end is accepted), which is
          the opposite of the closed-interval rule used for export licenses.

  - name: short_shipment_settlement_waterfall
    description: |
      Distributes an accepted dispute settlement across three ordered buckets.
      The last bucket absorbs the rounding residual so the three buckets always
      re-sum to the settlement amount exactly.
    trigger: "POST /dispute-cases/{dispute_id}/accept"
    algorithm: waterfall_allocation
    input_set: |
      The dispute's ExportOrder (outstanding_receivable_usd, insured_exposure_usd,
      short_shipped_value_usd) and, when credit_insurance_policy_id is set, that
      CreditInsurancePolicy (deductible_usd, insured_pct, credit_limit_usd,
      indemnified_total_usd). Buckets are filled strictly in the order below.
    formula: |
      S = settlement_amount_usd            # the accepted offer, exact

      # bucket 1 — offset against what the buyer still owes
      receivable_offset_usd = min(S, ExportOrder.outstanding_receivable_usd)
      R1 = S - receivable_offset_usd

      # bucket 2 — insurer indemnity, net of deductible, capped three ways
      covered_loss = min(R1, ExportOrder.insured_exposure_usd)
                     if credit_insurance_policy_id is not null else 0.00
      indemnity_cap = policy.credit_limit_usd - policy.indemnified_total_usd
      insurance_indemnity_usd = min(
          R1,
          indemnity_cap,
          round(max(0.00, covered_loss - policy.deductible_usd)
                * policy.insured_pct / 100, 2))
      R2 = R1 - insurance_indemnity_usd

      # bucket 3 — seller credit note absorbs the remainder AND the residual
      seller_credit_note_usd = R2

      # INVARIANT (exact, no tolerance):
      #   receivable_offset_usd + insurance_indemnity_usd + seller_credit_note_usd == S
      #   and every bucket is >= 0.00
    constants:
      MAX_NEGOTIATION_ROUNDS: 3
    precision: "bucket 2 is the only bucket that rounds (2 decimal places round_half_up); buckets 1 and 3 are exact subtractions so the residual lands in bucket 3"
    variants:
      - name: insured_settlement
        when: "credit_insurance_policy_id is set and ExportOrder.insured_exposure_usd > 0"
        difference: "bucket 2 can be positive; the deductible is subtracted before the insured_pct is applied, so a settlement at or below the deductible yields exactly 0.00 indemnity and pushes everything into bucket 3"
      - name: uninsured_settlement
        when: "credit_insurance_policy_id is null"
        difference: "bucket 2 is exactly 0.00 and bucket 3 takes the whole remainder after bucket 1"

# =============================================================================
# §1.4 Validation Rules Table — evaluated in ascending `priority`, first
# failure wins, remaining checks are not evaluated.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role names one of the six roles declared in §1.7"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the role in X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 4
    category: auth
    check: "when X-User-Role is ForeignBuyer, X-User-ID equals the id of an existing ForeignBuyer row"
    error_id: ERR_BUYER_IDENTITY_NOT_FOUND
    http_status: 403
    applies_to: "all endpoints whose roles include ForeignBuyer"

  - priority: 5
    category: existence
    check: "every path parameter resolves to an existing row, validated left to right"
    error_id: "ERR_BUYER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_LC_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_FINDING_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_SCREENING_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_SAILING_NOT_FOUND | ERR_BOOKING_NOT_FOUND | ERR_PRESENTATION_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_DISPUTE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 6
    category: existence
    check: "every foreign-key id in the request body resolves to an existing row, validated in the order the fields are listed in the endpoint's input"
    error_id: "ERR_BUYER_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_LC_NOT_FOUND | ERR_DOCUMENT_NOT_FOUND | ERR_LICENSE_NOT_FOUND | ERR_SAILING_NOT_FOUND | ERR_POLICY_NOT_FOUND | ERR_DISPUTE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with foreign-key fields in input"

  - priority: 7
    category: auth
    check: "when X-User-Role is ForeignBuyer, X-User-ID equals the buyer_id of the ExportOrder reached through the target resource"
    error_id: ERR_BUYER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /dispute-cases, POST /dispute-cases/{dispute_id}/counter, POST /dispute-cases/{dispute_id}/accept, POST /discrepancy-findings/{finding_id}/waiver, GET /export-orders, GET /dispute-cases"

  - priority: 8
    category: business_constraint
    check: "request body types, enum membership, decimal scale and numeric ranges match §1.1 field constraints"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

  - priority: 9
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "all GET list endpoints"

  - priority: 10
    category: business_constraint
    check: "field-level cross-consistency inside the body: usance_days is 0 when availability is SIGHT and >= 30 when USANCE; valid_to > valid_from; effective_to > effective_from; etd > cutoff_at and eta > etd; required_document_types contains COMMERCIAL_INVOICE; gross_weight_kg >= net_weight_kg"
    error_id: ERR_INCONSISTENT_TERMS
    http_status: 422
    applies_to: "POST /letters-of-credit, POST /letters-of-credit/{lc_id}/amendments, POST /export-control-screenings/{screening_id}/licenses, POST /credit-insurance-policies, POST /vessel-sailings, POST /export-orders/{export_order_id}/shipment-lines"

  - priority: 11
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_ORDER_STATE_INVALID | ERR_LC_STATE_INVALID | ERR_REVIEW_ALREADY_SUBMITTED | ERR_DOCUMENT_STATE_INVALID | ERR_SCREENING_STATE_INVALID | ERR_BOOKING_STATE_INVALID | ERR_PRESENTATION_STATE_INVALID | ERR_DISPUTE_STATE_INVALID"
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 12
    category: state
    check: "cross-entity state precondition: the order's ExportControlScreening.status is CLEARED before a freight booking; the LetterOfCredit.status is ACCEPTED before a presentation; the FreightBooking.status is CONFIRMED before a bill of lading; the CreditInsurancePolicy.status is ACTIVE before a claim; the VesselSailing.status is OPEN before a booking"
    error_id: "ERR_ORDER_NOT_COMPLIANCE_CLEARED | ERR_LC_NOT_ACCEPTED | ERR_BOOKING_NOT_CONFIRMED | ERR_POLICY_NOT_ACTIVE | ERR_SAILING_NOT_OPEN"
    http_status: 409
    applies_to: "POST /freight-bookings, POST /freight-bookings/{booking_id}/confirm, POST /freight-bookings/{booking_id}/bill-of-lading, POST /document-presentations, POST /credit-insurance-policies/{policy_id}/claims"
    description: "Conflict A, loser side: when the order is not compliance cleared AND the sailing has no capacity left, this priority-12 error is returned and ERR_SAILING_CAPACITY_EXCEEDED (priority 30) is never evaluated."

  - priority: 13
    category: state
    check: "expected_<parent>_version equals the parent entity's current version (OCC per §1.2.1)"
    error_id: "ERR_STALE_LC_VERSION | ERR_STALE_SAILING_VERSION | ERR_STALE_ORDER_VERSION | ERR_STALE_POLICY_VERSION"
    http_status: 412
    applies_to: "POST /letters-of-credit/{lc_id}/reviews, POST /letters-of-credit/{lc_id}/amendments, POST /freight-bookings, POST /document-presentations, POST /credit-insurance-policies/{policy_id}/claims"
    description: "Conflict B, winner side: a review request that is both stale AND aimed at a restricted-party buyer returns ERR_STALE_LC_VERSION (412), because state checks precede compliance checks."

  - priority: 14
    category: business_safety
    check: "the order's ForeignBuyer.restricted_party_flag is false"
    error_id: ERR_RESTRICTED_PARTY_BLOCKED
    http_status: 409
    applies_to: "POST /export-orders/{export_order_id}/submit-for-compliance, POST /letters-of-credit, POST /letters-of-credit/{lc_id}/reviews, POST /freight-bookings, POST /trade-documents, POST /trade-documents/{document_id}/issue, POST /document-presentations"
    description: "Conflict B, loser side: never reached when the same request also carries a stale expected_letter_of_credit_version."

  - priority: 15
    category: business_safety
    check: "the order's ForeignBuyer.sanctions_tier is not EMBARGOED and the destination_country_code is not on the embargoed-destination list derived from the buyer's sanctions_tier"
    error_id: ERR_PROHIBITED_DESTINATION
    http_status: 409
    applies_to: "POST /export-orders/{export_order_id}/submit-for-compliance, POST /export-control-screenings/{screening_id}/decision, POST /freight-bookings"

  - priority: 16
    category: business_safety
    check: "the order's ExportControlScreening.license_determination is not LICENSE_REQUIRED without a linked ExportLicense (screening.export_license_id is set) before the order may be booked"
    error_id: ERR_EXPORT_LICENSE_REQUIRED
    http_status: 409
    applies_to: "POST /freight-bookings"

  - priority: 17
    category: business_safety
    check: "segregation of duties: X-User-ID differs from LetterOfCredit.captured_by_user_id when opening a terms review, and differs from the generated_by_user_id of every ACTIVE-linked TradeDocument when examining a presentation"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /letters-of-credit/{lc_id}/reviews, POST /document-presentations/{presentation_id}/examine"
    description: "Conflict C, winner side: an examination by the document preparer against a stale document revision returns ERR_SEGREGATION_OF_DUTIES, not ERR_DOCUMENT_REVISION_SUPERSEDED (priority 27)."

  - priority: 18
    category: business_safety
    check: "the recommendation is compatible with the computed terms_risk_score: ACCEPT requires score < RISK_ACCEPT_CEILING; a score >= RISK_REJECT_FLOOR permits only REJECT"
    error_id: ERR_RECOMMENDATION_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /lc-terms-reviews/{review_id}/submit"

  - priority: 19
    category: business_temporal
    check: "the current logical clock is strictly before LetterOfCredit.expiry_date"
    error_id: ERR_LC_EXPIRED
    http_status: 409
    applies_to: "POST /letters-of-credit/{lc_id}/reviews, POST /letters-of-credit/{lc_id}/amendments, POST /document-presentations, POST /document-presentations/{presentation_id}/examine, POST /document-presentations/{presentation_id}/cure"
    description: "Conflict D, winner side: an examination on an expired credit whose invoice also over-draws returns ERR_LC_EXPIRED, not ERR_LC_AMOUNT_EXCEEDED (priority 31)."

  - priority: 20
    category: business_temporal
    check: "DocumentPresentation.days_after_on_board is <= LetterOfCredit.presentation_period_days (equality is accepted)"
    error_id: ERR_PRESENTATION_PERIOD_ELAPSED
    http_status: 409
    applies_to: "POST /document-presentations, POST /document-presentations/{presentation_id}/examine, POST /document-presentations/{presentation_id}/cure"

  - priority: 21
    category: business_temporal
    check: "the bill-of-lading on_board_date is <= LetterOfCredit.latest_shipment_date and <= ExportOrder.ship_by_date"
    error_id: ERR_LATEST_SHIPMENT_DATE_PASSED
    http_status: 409
    applies_to: "POST /freight-bookings/{booking_id}/bill-of-lading"

  - priority: 22
    category: business_temporal
    check: "the current logical clock is >= ExportLicense.valid_from and <= ExportLicense.valid_to (both bounds inclusive)"
    error_id: ERR_LICENSE_NOT_VALID_AT_DATE
    http_status: 409
    applies_to: "POST /export-control-screenings/{screening_id}/clear-with-license"

  - priority: 23
    category: business_temporal
    check: "the current logical clock is strictly before VesselSailing.cutoff_at"
    error_id: ERR_SAILING_CUTOFF_PASSED
    http_status: 409
    applies_to: "POST /freight-bookings"

  - priority: 24
    category: business_constraint
    check: "closed-interval overlap: no other ExportLicense with the same eccn and the same buyer (via its originating screening's order) and status IN {ISSUED, ACTIVE, EXHAUSTED} has a [valid_from, valid_to] interval intersecting the requested one; touching endpoints DO overlap"
    error_id: ERR_LICENSE_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /export-control-screenings/{screening_id}/licenses"

  - priority: 25
    category: business_constraint
    check: "half-open overlap: the new booking's [VesselSailing.cutoff_at, VesselSailing.etd + DOC_BUFFER_HOURS) interval does not intersect the interval of any FreightBooking of the same ExportOrder with status IN {BOOKED, CONFIRMED, SHIPPED}; touching endpoints do NOT overlap"
    error_id: ERR_BOOKING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /freight-bookings"

  - priority: 26
    category: business_constraint
    check: "uniqueness: lc_number is unique across LetterOfCredit rows with status NOT IN {REJECTED, EXPIRED}; license_number and policy_number are globally unique; ShipmentLine.line_no is unique per order; voyage_no is unique per carrier_scac; at most one TradeDocument per (export_order_id, doc_type) has status ISSUED"
    error_id: "ERR_DUPLICATE_LC_NUMBER | ERR_DUPLICATE_LICENSE_NUMBER | ERR_DUPLICATE_POLICY_NUMBER | ERR_DUPLICATE_LINE_NO | ERR_DUPLICATE_VOYAGE | ERR_DUPLICATE_ISSUED_DOCUMENT"
    http_status: 409
    applies_to: "POST /letters-of-credit, POST /export-control-screenings/{screening_id}/licenses, POST /credit-insurance-policies, POST /export-orders/{export_order_id}/shipment-lines, POST /vessel-sailings, POST /trade-documents/{document_id}/issue"

  - priority: 27
    category: business_referential
    check: "every tendered TradeDocument has status ISSUED, belongs to the presentation's export_order_id, and no ACTIVE link already exists for the same doc_type at the current presentation_round"
    error_id: ERR_DOCUMENT_REVISION_SUPERSEDED
    http_status: 409
    applies_to: "POST /document-presentations, POST /document-presentations/{presentation_id}/cure, POST /document-presentations/{presentation_id}/examine"
    description: "Conflict C, loser side: never reached when the examining user is also the document preparer."

  - priority: 28
    category: business_referential
    check: "TradeDocument.pinned_order_version equals the current ExportOrder.version"
    error_id: ERR_DOCUMENT_STALE_SOURCE
    http_status: 409
    applies_to: "POST /trade-documents/{document_id}/issue"

  - priority: 29
    category: business_referential
    check: "every doc_type listed in LetterOfCredit.required_document_types has an ACTIVE PresentationDocumentLink on the presentation"
    error_id: ERR_REQUIRED_DOCUMENT_MISSING
    http_status: 409
    applies_to: "POST /document-presentations, POST /document-presentations/{presentation_id}/examine"

  - priority: 30
    category: business_constraint
    check: "empty-collection guards: the order has at least one ShipmentLine before compliance submission; trade_document_ids is non-empty on a presentation; replacement_document_ids is non-empty on a cure; shipped_lines is non-empty and every shipped_quantity is > 0 on a bill of lading"
    error_id: "ERR_NO_SHIPMENT_LINES | ERR_PRESENTATION_NO_DOCUMENTS | ERR_NO_REPLACEMENT_DOCUMENTS | ERR_ZERO_SHIPPED_QUANTITY"
    http_status: 422
    applies_to: "POST /export-orders/{export_order_id}/submit-for-compliance, POST /document-presentations, POST /document-presentations/{presentation_id}/cure, POST /freight-bookings/{booking_id}/bill-of-lading"

  - priority: 31
    category: business_fiscal
    check: "VesselSailing.booked_weight_kg + request.booked_weight_kg is <= capacity_weight_kg (equality is accepted, only strict excess is rejected)"
    error_id: ERR_SAILING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /freight-bookings"
    description: "Conflict A, winner side is priority 12; this row only fires when the order IS compliance cleared."

  - priority: 32
    category: business_fiscal
    check: "ExportLicense.consumed_value_usd + round(ExportOrder.ordered_goods_value_usd, 2) is <= licensed_value_usd"
    error_id: ERR_LICENSE_VALUE_EXHAUSTED
    http_status: 409
    applies_to: "POST /export-control-screenings/{screening_id}/clear-with-license, POST /freight-bookings"

  - priority: 33
    category: business_fiscal
    check: "DocumentPresentation.presented_amount_usd is <= LetterOfCredit.max_drawable_usd (equality is accepted); at settlement, received_amount_usd is additionally <= negotiable_amount_usd"
    error_id: ERR_LC_AMOUNT_EXCEEDED
    http_status: 409
    applies_to: "POST /document-presentations/{presentation_id}/examine, POST /document-presentations/{presentation_id}/settlement"
    description: "Conflict D, loser side: never reached when the credit has already expired."

  - priority: 34
    category: business_fiscal
    check: "CreditInsurancePolicy.available_limit_usd >= the exposure the request would charge, and a claim's implied indemnity is <= credit_limit_usd - indemnified_total_usd"
    error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_CLAIM_EXCEEDS_COVERAGE"
    http_status: 409
    applies_to: "POST /credit-insurance-policies/{policy_id}/claims"

  - priority: 35
    category: business_fiscal
    check: "dispute money bounds: claimed_amount_usd is <= ExportOrder.ordered_goods_value_usd; for dispute_type SHORT_SHIPMENT, claimed_amount_usd is <= ExportOrder.short_shipped_value_usd; an offer is <= claimed_amount_usd and (from COUNTERED) <= current_offer_usd; a counter is > current_offer_usd and <= claimed_amount_usd"
    error_id: "ERR_CLAIM_AMOUNT_INVALID | ERR_OFFER_AMOUNT_INVALID"
    http_status: 422
    applies_to: "POST /dispute-cases, POST /dispute-cases/{dispute_id}/offers, POST /dispute-cases/{dispute_id}/counter"

  - priority: 36
    category: business_constraint
    check: "negotiation_round + 1 is <= MAX_NEGOTIATION_ROUNDS on a counter; the case is forced to ESCALATED instead of accepting a further counter once the bound is reached"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /dispute-cases/{dispute_id}/counter"

  - priority: 37
    category: business_constraint
    check: "DocumentPresentation.presentation_round is < MAX_CURE_ROUNDS"
    error_id: ERR_CURE_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /document-presentations/{presentation_id}/cure"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- logical clock (test-driving endpoint, §1.5 priority ladder step 3) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Every deadline, validity window and expiry rule in this scaffold reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "sweep step 1: every LetterOfCredit with status IN {RECEIVED, UNDER_REVIEW, AMENDMENT_REQUESTED, ACCEPTED} and expiry_date strictly before current_utc moves to EXPIRED, in created_at ASC order, with the side effects declared in §1.2"
      - "sweep step 2: every ExportLicense with status IN {ISSUED, ACTIVE, EXHAUSTED} and valid_to strictly before current_utc moves to EXPIRED, in created_at ASC order"
      - "sweep step 3: every CreditInsurancePolicy with status IN {ACTIVE, EXHAUSTED} and effective_to strictly before current_utc moves to EXPIRED, in created_at ASC order"
      - "sweep step 4: every VesselSailing with status OPEN or FULL moves to CUTOFF_PASSED when current_utc >= cutoff_at, then to DEPARTED when current_utc >= etd, in created_at ASC order"
      - "increments the version of every row the sweep mutates by 1"

  # ---- foreign buyers ----
  - method: POST
    path: "/foreign-buyers"
    description: "Onboards an overseas buyer with its sanctions posture and credit grade"
    roles: [TradeComplianceOfficer, PlatformAdmin]
    code: 201
    input: [legal_name, country_code, credit_rating, "sanctions_tier?", "restricted_party_flag?", "restricted_party_reason?"]
    output: ForeignBuyer
    side_effects:
      - "initialises aggregate_exposure_usd to 0 and open_order_count to 0"

  - method: GET
    path: "/foreign-buyers/{buyer_id}"
    description: "Reads a buyer including its computed aggregate_exposure_usd and open_order_count"
    roles: [TradeComplianceOfficer, ExportOpsCoordinator, DocumentaryCreditReviewer, FinanceCollectionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ForeignBuyer
    side_effects: []

  - method: PATCH
    path: "/foreign-buyers/{buyer_id}/restricted-party-flag"
    description: "Sets or lifts the denied/restricted party flag; setting it true starts the four-link compliance cascade"
    roles: [TradeComplianceOfficer]
    code: 200
    input: [restricted_party_flag, "restricted_party_reason?"]
    output: ForeignBuyer
    side_effects:
      - "cascade link 1 (flag true): every ExportOrder of this buyer with fulfillment_status IN {COMPLIANCE_PENDING, COMPLIANCE_CLEARED, BOOKED} moves to COMPLIANCE_BLOCKED, in created_at ASC order"
      - "cascade link 2: because each of those orders became COMPLIANCE_BLOCKED, each of its FreightBooking rows with status IN {BOOKED, CONFIRMED} moves to CANCELLED with cancel_reason 'RESTRICTED_PARTY_CASCADE'"
      - "cascade link 3: because each booking was cancelled, its VesselSailing.booked_weight_kg is reduced per calculation sailing_capacity_ledger and the sailing moves FULL -> OPEN when booked_weight_kg < capacity_weight_kg"
      - "cascade link 4: because each order left BOOKED, the charged ExportLicense.consumed_value_usd is reduced per calculation license_value_consumption and the license moves EXHAUSTED -> ACTIVE when remaining_value_usd becomes > 0"
      - "each affected order's ExportControlScreening moves CLEARED -> INITIATED with ruleset_version incremented by 1"
      - "increments the version of every mutated row by 1"

  # ---- export orders ----
  - method: POST
    path: "/export-orders"
    description: "Creates an export order in DRAFT with its incoterm and destination profile"
    roles: [ExportOpsCoordinator]
    code: 201
    input: [buyer_id, incoterm, incoterm_named_place, origin_country_code, destination_country_code, destination_zone, "invoice_currency?", "fx_rate_usd_to_invoice?", ship_by_date]
    output: ExportOrder
    side_effects:
      - "stores prepared_by_user_id from X-User-ID"
      - "increments ForeignBuyer.open_order_count by 1 and ForeignBuyer.version by 1"

  - method: GET
    path: "/export-orders"
    description: "Lists export orders; ForeignBuyer callers see only their own orders"
    roles: [ExportOpsCoordinator, TradeComplianceOfficer, DocumentaryCreditReviewer, FinanceCollectionsOfficer, ForeignBuyer, PlatformAdmin]
    code: 200
    input: ["buyer_id?", "fulfillment_status?", "settlement_status?", "limit?", "offset?"]
    output: ExportOrder[]
    side_effects: []

  - method: GET
    path: "/export-orders/{export_order_id}"
    description: "Reads one export order including both cost-allocation variants, the variance and the current version for optimistic concurrency"
    roles: [ExportOpsCoordinator, TradeComplianceOfficer, DocumentaryCreditReviewer, FinanceCollectionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ExportOrder
    side_effects: []

  - method: GET
    path: "/export-orders/{export_order_id}/cost-allocation"
    description: "Recomputes and returns both incoterm_cost_allocation variants for the order without persisting them"
    roles: [ExportOpsCoordinator, FinanceCollectionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ExportOrder
    side_effects: []

  - method: POST
    path: "/export-orders/{export_order_id}/shipment-lines"
    description: "Adds a shipment line to a DRAFT order"
    roles: [ExportOpsCoordinator]
    code: 201
    input: [line_no, goods_description, hs_code, quantity, uom, unit_price_usd, "line_discount_pct?", net_weight_kg, gross_weight_kg, package_count]
    output: ShipmentLine
    side_effects:
      - "computes line_extended_usd and line_net_usd per calculation commercial_invoice_totalling steps 1-2"
      - "recomputes ExportOrder.ordered_goods_value_usd and increments ExportOrder.version by 1"

  - method: GET
    path: "/export-orders/{export_order_id}/shipment-lines"
    description: "Lists the order's shipment lines in line_no ASC order"
    roles: [ExportOpsCoordinator, DocumentaryCreditReviewer, TradeComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ShipmentLine[]
    side_effects: []

  - method: POST
    path: "/export-orders/{export_order_id}/submit-for-compliance"
    description: "Moves the order DRAFT -> COMPLIANCE_PENDING and opens its export control screening"
    roles: [ExportOpsCoordinator]
    code: 200
    input: []
    output: ExportOrder
    side_effects:
      - "creates one ExportControlScreening with status INITIATED and ruleset_version 1"
      - "recomputes ordered_goods_value_usd and increments ExportOrder.version by 1"

  - method: POST
    path: "/export-orders/{export_order_id}/cancel"
    description: "Cancels an order that has no ISSUED trade document"
    roles: [ExportOpsCoordinator]
    code: 200
    input: [reason]
    output: ExportOrder
    side_effects:
      - "decrements ForeignBuyer.open_order_count by 1 and increments ForeignBuyer.version by 1"
      - "increments ExportOrder.version by 1"

  - method: POST
    path: "/export-orders/{export_order_id}/write-off"
    description: "Writes off an unrecoverable receivable, releasing insured exposure"
    roles: [FinanceCollectionsOfficer]
    code: 200
    input: [reason]
    output: ExportOrder
    side_effects:
      - "moves settlement_status DISHONORED -> WRITTEN_OFF or CLAIM_FILED -> WRITTEN_OFF"
      - "releases insured_exposure_usd per calculation insured_exposure_ledger and recomputes CreditInsurancePolicy.utilized_usd, available_limit_usd, status and ForeignBuyer.aggregate_exposure_usd"
      - "auto-advances fulfillment_status to CLOSED when that dimension's preconditions hold"
      - "increments ExportOrder.version by 1"

  # ---- export control ----
  - method: GET
    path: "/export-control-screenings"
    description: "Lists export control screening cases"
    roles: [TradeComplianceOfficer, ExportOpsCoordinator, PlatformAdmin]
    code: 200
    input: ["export_order_id?", "export_license_id?", "status?", "limit?", "offset?"]
    output: ExportControlScreening[]
    side_effects: []

  - method: POST
    path: "/export-control-screenings/{screening_id}/decision"
    description: "Records the classification decision, forking the case to CLEARED, PENDING_LICENSE or BLOCKED"
    roles: [TradeComplianceOfficer]
    code: 200
    input: [license_determination, "eccn?", "denied_party_hits?", "notes?"]
    output: ExportControlScreening
    side_effects:
      - "stores decided_by_user_id, eccn and denied_party_hits"
      - "NLR branch: status CLEARED, cleared_at stamped, ExportOrder.fulfillment_status advances to COMPLIANCE_CLEARED"
      - "LICENSE_REQUIRED branch: status PENDING_LICENSE, the order stays COMPLIANCE_PENDING"
      - "PROHIBITED branch or denied_party_hits > 0: status BLOCKED, ExportOrder.fulfillment_status becomes COMPLIANCE_BLOCKED, and ForeignBuyer.restricted_party_flag is set true with reason 'DENIED_PARTY_SCREENING_HIT' when denied_party_hits > 0"
      - "increments ExportControlScreening.version and ExportOrder.version by 1"

  - method: POST
    path: "/export-control-screenings/{screening_id}/licenses"
    description: "Records an export license obtained for a PENDING_LICENSE screening"
    roles: [TradeComplianceOfficer]
    code: 201
    input: [license_number, authority, eccn, valid_from, valid_to, licensed_value_usd]
    output: ExportLicense
    side_effects:
      - "initialises consumed_value_usd to 0, remaining_value_usd to licensed_value_usd and status to ISSUED"

  - method: POST
    path: "/export-control-screenings/{screening_id}/clear-with-license"
    description: "Clears a PENDING_LICENSE screening against a valid license with enough remaining value"
    roles: [TradeComplianceOfficer]
    code: 200
    input: [export_license_id]
    output: ExportControlScreening
    side_effects:
      - "sets export_license_id, stamps cleared_at and moves status PENDING_LICENSE -> CLEARED"
      - "moves ExportLicense.status ISSUED -> ACTIVE"
      - "moves ExportOrder.fulfillment_status COMPLIANCE_PENDING -> COMPLIANCE_CLEARED"
      - "increments ExportControlScreening.version, ExportLicense.version and ExportOrder.version by 1"

  - method: GET
    path: "/export-licenses"
    description: "Lists export licenses with their consumption ledger figures"
    roles: [TradeComplianceOfficer, ExportOpsCoordinator, PlatformAdmin]
    code: 200
    input: ["export_control_screening_id?", "status?", "eccn?", "limit?", "offset?"]
    output: ExportLicense[]
    side_effects: []

  # ---- letters of credit ----
  - method: POST
    path: "/letters-of-credit"
    description: "Captures the terms of an incoming documentary credit in RECEIVED; may replace a REJECTED or EXPIRED credit via supersedes_lc_id"
    roles: [ExportOpsCoordinator]
    code: 201
    input: [export_order_id, "supersedes_lc_id?", lc_number, issuing_bank_swift, amount_usd, "tolerance_pct?", availability, "usance_days?", expiry_date, latest_shipment_date, "presentation_period_days?", "partial_shipment_allowed?", "transshipment_allowed?", required_document_types]
    output: LetterOfCredit
    side_effects:
      - "stores captured_by_user_id from X-User-ID"
      - "computes max_drawable_usd and min_drawable_usd per calculation lc_negotiable_amount"
      - "sets amendment_round to 0 and drawn_amount_usd to 0"

  - method: GET
    path: "/letters-of-credit"
    description: "Lists documentary credits; the supersedes_lc_id filter walks the replacement chain"
    roles: [ExportOpsCoordinator, DocumentaryCreditReviewer, FinanceCollectionsOfficer, PlatformAdmin]
    code: 200
    input: ["export_order_id?", "supersedes_lc_id?", "status?", "limit?", "offset?"]
    output: LetterOfCredit[]
    side_effects: []

  - method: GET
    path: "/letters-of-credit/{lc_id}"
    description: "Reads one credit including drawing bounds and the current version for optimistic concurrency"
    roles: [ExportOpsCoordinator, DocumentaryCreditReviewer, FinanceCollectionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: LetterOfCredit
    side_effects: []

  - method: POST
    path: "/letters-of-credit/{lc_id}/reviews"
    description: "Opens a terms review on a RECEIVED credit; the reviewer may not be the user who captured the credit"
    roles: [DocumentaryCreditReviewer]
    code: 201
    input: [expected_letter_of_credit_version]
    output: LCTermsReview
    side_effects:
      - "creates the LCTermsReview with status DRAFTING, reviewer_user_id from X-User-ID and reviewed_lc_version pinned to LetterOfCredit.version"
      - "moves any DRAFTING LCTermsReview of this credit to SUPERSEDED"
      - "moves the credit RECEIVED -> UNDER_REVIEW and increments LetterOfCredit.version by 1"

  - method: POST
    path: "/letters-of-credit/{lc_id}/amendments"
    description: "Applies an amendment in place, returning the credit to RECEIVED and superseding its submitted reviews"
    roles: [ExportOpsCoordinator]
    code: 200
    input: [expected_letter_of_credit_version, "amount_usd?", "tolerance_pct?", "expiry_date?", "latest_shipment_date?", "presentation_period_days?", "partial_shipment_allowed?", "transshipment_allowed?", "required_document_types?"]
    output: LetterOfCredit
    side_effects:
      - "applies the submitted fields, increments amendment_round by 1 and recomputes max_drawable_usd and min_drawable_usd"
      - "moves every SUBMITTED LCTermsReview of the credit to SUPERSEDED and marks its OPEN source TERMS findings CURED"
      - "from ACCEPTED: moves ExportOrder.settlement_status LC_ACCEPTED -> UNSECURED, releasing insured exposure per calculation insured_exposure_ledger"
      - "increments LetterOfCredit.version by 1"

  - method: GET
    path: "/lc-terms-reviews"
    description: "Lists terms reviews with their risk scores"
    roles: [DocumentaryCreditReviewer, ExportOpsCoordinator, PlatformAdmin]
    code: 200
    input: ["letter_of_credit_id?", "status?", "limit?", "offset?"]
    output: LCTermsReview[]
    side_effects: []

  - method: POST
    path: "/lc-terms-reviews/{review_id}/findings"
    description: "Records a terms finding on a DRAFTING review"
    roles: [DocumentaryCreditReviewer]
    code: 201
    input: [code, severity, clause_ref, detail]
    output: DiscrepancyFinding
    side_effects:
      - "creates the finding with source TERMS, letter_of_credit_id copied from the review, cure_status OPEN and raised_in_round 0"
      - "recomputes LCTermsReview.finding_count"

  - method: POST
    path: "/lc-terms-reviews/{review_id}/submit"
    description: "Submits the review with a recommendation, forking the credit to ACCEPTED, AMENDMENT_REQUESTED or REJECTED"
    roles: [DocumentaryCreditReviewer]
    code: 200
    input: [recommendation]
    output: LCTermsReview
    side_effects:
      - "stores terms_risk_score per calculation lc_discrepancy_risk_score variant pre_shipment_review and sets status SUBMITTED"
      - "ACCEPT branch: credit UNDER_REVIEW -> ACCEPTED and ExportOrder.settlement_status UNSECURED -> LC_ACCEPTED, which charges a CreditInsurancePolicy per calculation insured_exposure_ledger"
      - "AMEND branch: credit UNDER_REVIEW -> AMENDMENT_REQUESTED, settlement dimension untouched"
      - "REJECT branch: credit UNDER_REVIEW -> REJECTED, settlement dimension untouched"
      - "increments LetterOfCredit.version by 1"

  - method: GET
    path: "/discrepancy-findings"
    description: "Lists discrepancy findings raised on credits and presentations"
    roles: [DocumentaryCreditReviewer, ExportOpsCoordinator, FinanceCollectionsOfficer, ForeignBuyer, PlatformAdmin]
    code: 200
    input: ["letter_of_credit_id?", "lc_terms_review_id?", "document_presentation_id?", "waived_by_buyer_id?", "source?", "severity?", "cure_status?", "limit?", "offset?"]
    output: DiscrepancyFinding[]
    side_effects: []

  - method: POST
    path: "/discrepancy-findings/{finding_id}/waiver"
    description: "Buyer waives a presentation discrepancy; the last waiver moves the presentation DISCREPANT -> COMPLIED"
    roles: [ForeignBuyer]
    code: 200
    input: [buyer_reference]
    output: DiscrepancyFinding
    side_effects:
      - "sets cure_status WAIVED and waived_by_buyer_id to X-User-ID"
      - "recomputes DocumentPresentation.open_finding_count; when it becomes 0 the presentation moves DISCREPANT -> COMPLIED, stores negotiable_amount_usd and moves ExportOrder.settlement_status LC_ACCEPTED -> DOCS_PRESENTED"
      - "increments DocumentPresentation.version and ExportOrder.version by 1 when the presentation transitions"

  # ---- trade documents ----
  - method: POST
    path: "/trade-documents"
    description: "Generates a trade document in DRAFT from the order's current shipment lines, pinning the order version"
    roles: [ExportOpsCoordinator]
    code: 201
    input: [export_order_id, doc_type]
    output: TradeDocument
    side_effects:
      - "stores generated_by_user_id from X-User-ID, revision 1 and pinned_order_version equal to the current ExportOrder.version"
      - "computes declared_total_usd, declared_total_invoice_currency, total_gross_weight_kg, total_package_count and origin_country_code per calculation commercial_invoice_totalling"
      - "recomputes ShipmentLine.apportioned_freight_usd for every billable line"

  - method: GET
    path: "/trade-documents"
    description: "Lists trade documents; the supersedes_document_id filter walks the revision chain"
    roles: [ExportOpsCoordinator, DocumentaryCreditReviewer, FinanceCollectionsOfficer, TradeComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["export_order_id?", "supersedes_document_id?", "doc_type?", "status?", "limit?", "offset?"]
    output: TradeDocument[]
    side_effects: []

  - method: POST
    path: "/trade-documents/{document_id}/issue"
    description: "Issues a DRAFT document; refused when the pinned order version is stale"
    roles: [ExportOpsCoordinator]
    code: 200
    input: []
    output: TradeDocument
    side_effects:
      - "moves the document DRAFT -> ISSUED"
      - "recomputes ExportOrder.outstanding_receivable_usd when doc_type is COMMERCIAL_INVOICE"
      - "increments TradeDocument.version and ExportOrder.version by 1"

  - method: POST
    path: "/trade-documents/{document_id}/regenerate"
    description: "Creates the next revision of a document against the current order version and supersedes the predecessor"
    roles: [ExportOpsCoordinator]
    code: 201
    input: [reason]
    output: TradeDocument
    side_effects:
      - "creates a new TradeDocument of the same doc_type with revision incremented by 1, status DRAFT, supersedes_document_id set to the predecessor and pinned_order_version equal to the current ExportOrder.version"
      - "moves the predecessor to SUPERSEDED and every ACTIVE PresentationDocumentLink referencing it to REPLACED"
      - "recomputes the new revision's money and weight figures per calculation commercial_invoice_totalling"

  - method: POST
    path: "/trade-documents/{document_id}/void"
    description: "Voids a document; voiding an ISSUED document tendered on a live presentation starts the three-link discrepancy cascade"
    roles: [ExportOpsCoordinator]
    code: 200
    input: [void_reason]
    output: TradeDocument
    side_effects:
      - "cascade link 1: every ACTIVE PresentationDocumentLink referencing the document moves to INVALIDATED"
      - "cascade link 2: because a link was invalidated, each owning DocumentPresentation with status PRESENTED moves to DISCREPANT and a system DiscrepancyFinding (code DOC_VOIDED, severity CRITICAL, clause_ref DOCUMENTS, source DOCUMENT) is created"
      - "cascade link 3: because the presentation became DISCREPANT, ExportOrder.settlement_status moves DOCS_PRESENTED -> LC_ACCEPTED"
      - "increments TradeDocument.version, DocumentPresentation.version and ExportOrder.version by 1"

  - method: GET
    path: "/presentation-document-links"
    description: "Lists the pinned document tenders of presentations, in created_at ASC order"
    roles: [DocumentaryCreditReviewer, ExportOpsCoordinator, FinanceCollectionsOfficer, PlatformAdmin]
    code: 200
    input: ["document_presentation_id?", "trade_document_id?", "link_status?", "limit?", "offset?"]
    output: PresentationDocumentLink[]
    side_effects: []

  # ---- freight ----
  - method: POST
    path: "/vessel-sailings"
    description: "Publishes a sailing with its loading window, aggregate capacity and tariff rate"
    roles: [ExportOpsCoordinator, PlatformAdmin]
    code: 201
    input: [carrier_scac, vessel_name, voyage_no, port_of_loading, port_of_discharge, destination_zone, cutoff_at, etd, eta, capacity_weight_kg, tariff_rate_per_1000kg_usd]
    output: VesselSailing
    side_effects:
      - "initialises booked_weight_kg to 0 and status to OPEN"

  - method: GET
    path: "/vessel-sailings/{vessel_sailing_id}"
    description: "Reads a sailing including booked_weight_kg and the current version for optimistic concurrency"
    roles: [ExportOpsCoordinator, FinanceCollectionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: VesselSailing
    side_effects: []

  - method: POST
    path: "/freight-bookings"
    description: "Books space on a sailing for a compliance-cleared order; charges the sailing capacity ledger and the export license ledger"
    roles: [ExportOpsCoordinator]
    code: 201
    input: [export_order_id, vessel_sailing_id, booked_weight_kg, container_type, expected_vessel_sailing_version]
    output: FreightBooking
    side_effects:
      - "creates the booking with status BOOKED, effective_window_start from the sailing's cutoff_at, effective_window_end from etd + DOC_BUFFER_HOURS and chargeable_weight_kg per the container minimum"
      - "adds booked_weight_kg to VesselSailing.booked_weight_kg per calculation sailing_capacity_ledger and moves the sailing OPEN -> FULL at booked_weight_kg >= capacity_weight_kg"
      - "moves ExportOrder.fulfillment_status COMPLIANCE_CLEARED -> BOOKED"
      - "stores provisional_seller_cost_usd and provisional_buyer_cost_usd per calculation incoterm_cost_allocation variant provisional_at_booking"
      - "charges licensed_value_allocated_usd per calculation license_value_consumption when the screening's license_determination is LICENSE_REQUIRED"
      - "increments VesselSailing.version by 1 and ExportOrder.version by 1"

  - method: GET
    path: "/freight-bookings"
    description: "Lists freight bookings with their occupation windows"
    roles: [ExportOpsCoordinator, FinanceCollectionsOfficer, TradeComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["export_order_id?", "vessel_sailing_id?", "status?", "limit?", "offset?"]
    output: FreightBooking[]
    side_effects: []

  - method: POST
    path: "/freight-bookings/{booking_id}/confirm"
    description: "Confirms a booking with the carrier; requires the ISSUED commercial invoice and packing list"
    roles: [ExportOpsCoordinator]
    code: 200
    input: []
    output: FreightBooking
    side_effects:
      - "moves the booking BOOKED -> CONFIRMED and increments FreightBooking.version by 1"

  - method: POST
    path: "/freight-bookings/{booking_id}/cancel"
    description: "Cancels a booking, releasing sailing capacity and license value exactly"
    roles: [ExportOpsCoordinator]
    code: 200
    input: [cancel_reason]
    output: FreightBooking
    side_effects:
      - "releases VesselSailing.booked_weight_kg per calculation sailing_capacity_ledger and moves the sailing FULL -> OPEN when booked_weight_kg < capacity_weight_kg and the clock is strictly before cutoff_at"
      - "moves ExportOrder.fulfillment_status BOOKED -> COMPLIANCE_CLEARED"
      - "releases licensed_value_allocated_usd per calculation license_value_consumption and moves the license EXHAUSTED -> ACTIVE when remaining_value_usd becomes > 0"
      - "increments FreightBooking.version, VesselSailing.version, ExportLicense.version and ExportOrder.version by 1"

  - method: POST
    path: "/freight-bookings/{booking_id}/bill-of-lading"
    description: "Issues the bill of lading from a CONFIRMED booking, stamping shipped quantities and switching the order to the final cost allocation"
    roles: [ExportOpsCoordinator]
    code: 201
    input: [on_board_date, shipped_lines]
    output: TradeDocument
    side_effects:
      - "creates the BILL_OF_LADING TradeDocument with status ISSUED, revision 1 and on_board_date stamped"
      - "sets each ShipmentLine.shipped_quantity from shipped_lines and recomputes ExportOrder.shipped_goods_value_usd"
      - "moves the booking CONFIRMED -> SHIPPED and the order BOOKED -> SHIPPED or BOOKED -> SHORT_SHIPPED per the shipped-quantity predicate"
      - "stores final_seller_cost_usd, final_buyer_cost_usd and cost_allocation_variance_usd per calculation incoterm_cost_allocation variant final_at_bl_issuance"
      - "sets short_shipped_value_usd on the SHORT_SHIPPED branch"
      - "increments TradeDocument.version, FreightBooking.version and ExportOrder.version by 1"

  # ---- presentation and collection ----
  - method: POST
    path: "/document-presentations"
    description: "Lodges a document presentation under an ACCEPTED credit, pinning each tendered document revision"
    roles: [ExportOpsCoordinator]
    code: 201
    input: [letter_of_credit_id, export_order_id, trade_document_ids, expected_export_order_version]
    output: DocumentPresentation
    side_effects:
      - "creates the presentation with status PRESENTED, presentation_round 1, presented_by_user_id from X-User-ID and presented_at stamped from the logical clock"
      - "creates one ACTIVE PresentationDocumentLink per tendered document with pinned_document_revision and linked_in_round 1"
      - "computes days_after_on_board and presented_amount_usd"
      - "moves ExportOrder.settlement_status LC_ACCEPTED -> DOCS_PRESENTED and increments ExportOrder.version by 1"

  - method: GET
    path: "/document-presentations"
    description: "Lists document presentations with their round and score figures"
    roles: [DocumentaryCreditReviewer, ExportOpsCoordinator, FinanceCollectionsOfficer, PlatformAdmin]
    code: 200
    input: ["letter_of_credit_id?", "export_order_id?", "status?", "limit?", "offset?"]
    output: DocumentPresentation[]
    side_effects: []

  - method: GET
    path: "/document-presentations/{presentation_id}"
    description: "Reads one presentation including its examination score and negotiable amount"
    roles: [DocumentaryCreditReviewer, ExportOpsCoordinator, FinanceCollectionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: DocumentPresentation
    side_effects: []

  - method: POST
    path: "/document-presentations/{presentation_id}/examine"
    description: "Examines a PRESENTED tender against the credit; forks to COMPLIED or DISCREPANT. The examiner may not have generated any tendered document."
    roles: [DocumentaryCreditReviewer]
    code: 200
    input: [findings]
    output: DocumentPresentation
    side_effects:
      - "stores examined_by_user_id and examination_risk_score per calculation lc_discrepancy_risk_score variant presentation_examination"
      - "persists every submitted finding with source DOCUMENT, cure_status OPEN and raised_in_round equal to presentation_round, plus any SHORT_DRAWING finding raised by calculation lc_negotiable_amount"
      - "COMPLIED branch: stores negotiable_amount_usd per calculation lc_negotiable_amount"
      - "DISCREPANT branch: moves ExportOrder.settlement_status DOCS_PRESENTED -> LC_ACCEPTED and increments ExportOrder.version by 1"
      - "increments DocumentPresentation.version by 1"

  - method: POST
    path: "/document-presentations/{presentation_id}/cure"
    description: "Replaces discrepant documents and re-presents, incrementing the presentation round"
    roles: [ExportOpsCoordinator]
    code: 200
    input: [replacement_document_ids]
    output: DocumentPresentation
    side_effects:
      - "moves the presentation DISCREPANT -> CURING, then CURING -> PRESENTED in the same request"
      - "moves superseded links to REPLACED, marks the addressed findings CURED and creates one ACTIVE link per replacement document with linked_in_round equal to the new presentation_round"
      - "increments presentation_round by 1, re-stamps presented_at and recomputes presented_amount_usd and days_after_on_board"
      - "moves ExportOrder.settlement_status LC_ACCEPTED -> DOCS_PRESENTED and increments ExportOrder.version by 1"
      - "increments DocumentPresentation.version by 1"

  - method: POST
    path: "/document-presentations/{presentation_id}/settlement"
    description: "Records funds received against a COMPLIED presentation, starting the three-link settlement cascade"
    roles: [FinanceCollectionsOfficer]
    code: 200
    input: [received_amount_usd, value_date]
    output: DocumentPresentation
    side_effects:
      - "moves the presentation COMPLIED -> HONOURED and increases LetterOfCredit.drawn_amount_usd"
      - "cascade link 1: ExportOrder.settlement_status DOCS_PRESENTED -> PAID and outstanding_receivable_usd recomputed"
      - "cascade link 2: because the order became PAID, insured_exposure_usd is released and CreditInsurancePolicy.utilized_usd and available_limit_usd are recomputed per calculation insured_exposure_ledger"
      - "cascade link 3: because the policy's utilized_usd fell, ForeignBuyer.aggregate_exposure_usd is recomputed and a policy whose status was EXHAUSTED returns to ACTIVE"
      - "moves the credit ACCEPTED -> UTILISED when drawn_amount_usd >= min_drawable_usd, and auto-advances fulfillment_status to CLOSED"
      - "increments DocumentPresentation.version, LetterOfCredit.version, ExportOrder.version, CreditInsurancePolicy.version and ForeignBuyer.version by 1"

  - method: POST
    path: "/document-presentations/{presentation_id}/dishonour"
    description: "Records the issuing bank's refusal to pay"
    roles: [FinanceCollectionsOfficer]
    code: 200
    input: [refusal_reason]
    output: DocumentPresentation
    side_effects:
      - "moves the presentation to REFUSED and ExportOrder.settlement_status DOCS_PRESENTED -> DISHONORED"
      - "increments DocumentPresentation.version and ExportOrder.version by 1"

  # ---- credit insurance ----
  - method: POST
    path: "/credit-insurance-policies"
    description: "Writes a buyer credit insurance policy and prices its premium with the pinned evaluation order"
    roles: [FinanceCollectionsOfficer]
    code: 201
    input: [buyer_id, policy_number, credit_limit_usd, insured_pct, deductible_usd, effective_from, effective_to]
    output: CreditInsurancePolicy
    side_effects:
      - "computes exposure_tier and premium_usd per calculation insurance_premium_assessment, using the buyer's exposure read BEFORE this row is inserted"
      - "initialises utilized_usd to 0, available_limit_usd to credit_limit_usd, indemnified_total_usd to 0 and status to ACTIVE"
      - "recomputes ForeignBuyer.aggregate_exposure_usd and increments ForeignBuyer.version by 1"

  - method: GET
    path: "/credit-insurance-policies"
    description: "Lists credit insurance policies with their utilisation figures"
    roles: [FinanceCollectionsOfficer, ExportOpsCoordinator, PlatformAdmin]
    code: 200
    input: ["buyer_id?", "status?", "limit?", "offset?"]
    output: CreditInsurancePolicy[]
    side_effects: []

  - method: GET
    path: "/credit-insurance-policies/{policy_id}"
    description: "Reads one policy including utilized_usd, available_limit_usd and the current version for optimistic concurrency"
    roles: [FinanceCollectionsOfficer, ExportOpsCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: CreditInsurancePolicy
    side_effects: []

  - method: POST
    path: "/credit-insurance-policies/{policy_id}/claims"
    description: "Files a non-payment claim against a policy for a dishonoured order, linking the dispute case"
    roles: [FinanceCollectionsOfficer]
    code: 200
    input: [dispute_case_id, expected_credit_insurance_policy_version]
    output: DisputeCase
    side_effects:
      - "sets DisputeCase.credit_insurance_policy_id to the policy"
      - "moves ExportOrder.settlement_status DISHONORED -> CLAIM_FILED"
      - "increments CreditInsurancePolicy.version, DisputeCase.version and ExportOrder.version by 1"

  # ---- disputes ----
  - method: POST
    path: "/dispute-cases"
    description: "Opens a dispute; SHORT_SHIPMENT and QUALITY are opened by the buyer, NON_PAYMENT by collections"
    roles: [ForeignBuyer, FinanceCollectionsOfficer]
    code: 201
    input: [export_order_id, dispute_type, claimed_amount_usd]
    output: DisputeCase
    side_effects:
      - "stores opened_by_role from X-User-Role, status OPEN and negotiation_round 0"

  - method: GET
    path: "/dispute-cases"
    description: "Lists dispute cases; ForeignBuyer callers see only their own"
    roles: [ForeignBuyer, FinanceCollectionsOfficer, ExportOpsCoordinator, PlatformAdmin]
    code: 200
    input: ["export_order_id?", "credit_insurance_policy_id?", "status?", "limit?", "offset?"]
    output: DisputeCase[]
    side_effects: []

  - method: POST
    path: "/dispute-cases/{dispute_id}/offers"
    description: "Puts a settlement offer on the table, from OPEN or COUNTERED"
    roles: [FinanceCollectionsOfficer]
    code: 200
    input: [offer_amount_usd]
    output: DisputeCase
    side_effects:
      - "stores current_offer_usd, moves the case to OFFERED and increments DisputeCase.version by 1"

  - method: POST
    path: "/dispute-cases/{dispute_id}/counter"
    description: "Buyer counters the offer; the case is forced to ESCALATED once the round bound is reached"
    roles: [ForeignBuyer]
    code: 200
    input: [counter_amount_usd]
    output: DisputeCase
    side_effects:
      - "increments negotiation_round by 1, stores current_offer_usd and moves the case OFFERED -> COUNTERED"
      - "moves the case COUNTERED -> ESCALATED instead when negotiation_round already equals MAX_NEGOTIATION_ROUNDS"
      - "increments DisputeCase.version by 1"

  - method: POST
    path: "/dispute-cases/{dispute_id}/accept"
    description: "Accepts the offer on the table and runs the three-bucket settlement waterfall"
    roles: [ForeignBuyer, FinanceCollectionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: DisputeCase
    side_effects:
      - "sets settlement_amount_usd to current_offer_usd and allocates receivable_offset_usd, insurance_indemnity_usd and seller_credit_note_usd per calculation short_shipment_settlement_waterfall"
      - "reduces ExportOrder.outstanding_receivable_usd by receivable_offset_usd"
      - "when credit_insurance_policy_id is set: adds insurance_indemnity_usd to CreditInsurancePolicy.indemnified_total_usd, moves ExportOrder.settlement_status CLAIM_FILED -> INDEMNIFIED, releases insured exposure and auto-advances fulfillment_status to CLOSED"
      - "increments DisputeCase.version, ExportOrder.version and CreditInsurancePolicy.version by 1"

  - method: POST
    path: "/dispute-cases/{dispute_id}/close"
    description: "Closes an ESCALATED case without settlement, zeroing the waterfall buckets"
    roles: [PlatformAdmin]
    code: 200
    input: [reason]
    output: DisputeCase
    side_effects:
      - "moves the case ESCALATED -> CLOSED_NO_SETTLEMENT and increments DisputeCase.version by 1"

  # ---- item reads (one per child collection, for revision and ledger drill-down) ----
  - method: GET
    path: "/shipment-lines/{shipment_line_id}"
    description: "Reads one shipment line with its computed line_net_usd and apportioned freight"
    roles: [ExportOpsCoordinator, DocumentaryCreditReviewer, TradeComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ShipmentLine
    side_effects: []

  - method: GET
    path: "/shipment-lines"
    description: "Lists shipment lines across orders in line_no ASC order within each order"
    roles: [ExportOpsCoordinator, DocumentaryCreditReviewer, TradeComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["export_order_id?", "hs_code?", "limit?", "offset?"]
    output: ShipmentLine[]
    side_effects: []

  - method: GET
    path: "/lc-terms-reviews/{review_id}"
    description: "Reads one terms review with its pinned reviewed_lc_version and risk score"
    roles: [DocumentaryCreditReviewer, ExportOpsCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: LCTermsReview
    side_effects: []

  - method: GET
    path: "/discrepancy-findings/{finding_id}"
    description: "Reads one discrepancy finding with its severity, clause and cure status"
    roles: [DocumentaryCreditReviewer, ExportOpsCoordinator, FinanceCollectionsOfficer, ForeignBuyer, PlatformAdmin]
    code: 200
    input: []
    output: DiscrepancyFinding
    side_effects: []

  - method: GET
    path: "/trade-documents/{document_id}"
    description: "Reads one trade document revision with its pinned_order_version"
    roles: [ExportOpsCoordinator, DocumentaryCreditReviewer, FinanceCollectionsOfficer, TradeComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: TradeDocument
    side_effects: []

  - method: GET
    path: "/export-control-screenings/{screening_id}"
    description: "Reads one screening case with its license determination and linked license"
    roles: [TradeComplianceOfficer, ExportOpsCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: ExportControlScreening
    side_effects: []

  - method: GET
    path: "/export-licenses/{export_license_id}"
    description: "Reads one export license with consumed_value_usd and remaining_value_usd"
    roles: [TradeComplianceOfficer, ExportOpsCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: ExportLicense
    side_effects: []

  - method: GET
    path: "/freight-bookings/{booking_id}"
    description: "Reads one freight booking with its occupation window and bill-of-lading link"
    roles: [ExportOpsCoordinator, FinanceCollectionsOfficer, TradeComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: FreightBooking
    side_effects: []

  - method: GET
    path: "/presentation-document-links/{link_id}"
    description: "Reads one document tender with its pinned_document_revision"
    roles: [DocumentaryCreditReviewer, ExportOpsCoordinator, FinanceCollectionsOfficer, PlatformAdmin]
    code: 200
    input: []
    output: PresentationDocumentLink
    side_effects: []

  - method: GET
    path: "/dispute-cases/{dispute_id}"
    description: "Reads one dispute case with its three settlement waterfall buckets"
    roles: [ForeignBuyer, FinanceCollectionsOfficer, ExportOpsCoordinator, PlatformAdmin]
    code: 200
    input: []
    output: DisputeCase
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # --- authentication / authorisation ---
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent or empty"
  - id: ERR_UNKNOWN_ROLE
    http: 401
    condition: "X-User-Role is not one of the six declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the caller's role is not in the target endpoint's roles list"
  - id: ERR_BUYER_IDENTITY_NOT_FOUND
    http: 403
    condition: "X-User-Role is ForeignBuyer but X-User-ID is not the id of an existing ForeignBuyer row"
  - id: ERR_BUYER_SCOPE_VIOLATION
    http: 403
    condition: "a ForeignBuyer caller targets a resource whose ExportOrder.buyer_id differs from X-User-ID"

  # --- existence ---
  - id: ERR_BUYER_NOT_FOUND
    http: 404
    condition: "buyer_id in the path or body does not resolve"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "export_order_id in the path or body does not resolve"
  - id: ERR_LC_NOT_FOUND
    http: 404
    condition: "lc_id, letter_of_credit_id or supersedes_lc_id does not resolve"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "review_id does not resolve"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "finding_id does not resolve"
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "document_id, a trade_document_ids element or a replacement_document_ids element does not resolve"
  - id: ERR_SCREENING_NOT_FOUND
    http: 404
    condition: "screening_id does not resolve"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "export_license_id does not resolve"
  - id: ERR_SAILING_NOT_FOUND
    http: 404
    condition: "vessel_sailing_id does not resolve"
  - id: ERR_BOOKING_NOT_FOUND
    http: 404
    condition: "booking_id does not resolve"
  - id: ERR_PRESENTATION_NOT_FOUND
    http: 404
    condition: "presentation_id does not resolve"
  - id: ERR_POLICY_NOT_FOUND
    http: 404
    condition: "policy_id or credit_insurance_policy_id does not resolve"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "dispute_id or dispute_case_id does not resolve"

  # --- body shape ---
  - id: ERR_VALIDATION
    http: 422
    condition: "a body field violates its declared type, enum membership, decimal scale or numeric range"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside [1, 100] or offset < 0"
  - id: ERR_INCONSISTENT_TERMS
    http: 422
    condition: "intra-body inconsistency: usance_days versus availability, valid_to <= valid_from, effective_to <= effective_from, etd <= cutoff_at, eta <= etd, required_document_types missing COMMERCIAL_INVOICE, or gross_weight_kg < net_weight_kg"

  # --- own-state preconditions ---
  - id: ERR_ORDER_STATE_INVALID
    http: 409
    condition: "the ExportOrder is not in a fulfillment_status or settlement_status from which the requested transition is declared"
  - id: ERR_LC_STATE_INVALID
    http: 409
    condition: "the LetterOfCredit status does not permit the requested transition"
  - id: ERR_REVIEW_ALREADY_SUBMITTED
    http: 409
    condition: "the LCTermsReview status is SUBMITTED or SUPERSEDED when a finding or a submit is attempted"
  - id: ERR_DOCUMENT_STATE_INVALID
    http: 409
    condition: "the TradeDocument status does not permit issue, regenerate or void"
  - id: ERR_SCREENING_STATE_INVALID
    http: 409
    condition: "the ExportControlScreening status does not permit the requested decision or clearance"
  - id: ERR_BOOKING_STATE_INVALID
    http: 409
    condition: "the FreightBooking status does not permit confirm, cancel or bill-of-lading issuance"
  - id: ERR_PRESENTATION_STATE_INVALID
    http: 409
    condition: "the DocumentPresentation status does not permit examine, cure, settlement or dishonour"
  - id: ERR_DISPUTE_STATE_INVALID
    http: 409
    condition: "the DisputeCase status does not permit offer, counter, accept or close"

  # --- cross-entity state preconditions ---
  - id: ERR_ORDER_NOT_COMPLIANCE_CLEARED
    http: 409
    condition: "a freight booking is attempted while the order's ExportControlScreening.status is not CLEARED"
  - id: ERR_LC_NOT_ACCEPTED
    http: 409
    condition: "a presentation is lodged while the LetterOfCredit.status is not ACCEPTED"
  - id: ERR_BOOKING_NOT_CONFIRMED
    http: 409
    condition: "a bill of lading is requested while the FreightBooking.status is not CONFIRMED"
  - id: ERR_POLICY_NOT_ACTIVE
    http: 409
    condition: "a claim is filed while the CreditInsurancePolicy.status is not ACTIVE"
  - id: ERR_SAILING_NOT_OPEN
    http: 409
    condition: "a booking is attempted while the VesselSailing.status is not OPEN"

  # --- optimistic concurrency (§1.2.1) ---
  - id: ERR_STALE_LC_VERSION
    http: 412
    condition: "expected_letter_of_credit_version does not equal LetterOfCredit.version"
  - id: ERR_STALE_SAILING_VERSION
    http: 412
    condition: "expected_vessel_sailing_version does not equal VesselSailing.version"
  - id: ERR_STALE_ORDER_VERSION
    http: 412
    condition: "expected_export_order_version does not equal ExportOrder.version"
  - id: ERR_STALE_POLICY_VERSION
    http: 412
    condition: "expected_credit_insurance_policy_version does not equal CreditInsurancePolicy.version"

  # --- compliance / safety ---
  - id: ERR_RESTRICTED_PARTY_BLOCKED
    http: 409
    condition: "the order's ForeignBuyer.restricted_party_flag is true"
  - id: ERR_PROHIBITED_DESTINATION
    http: 409
    condition: "the buyer's sanctions_tier is EMBARGOED, or the decision records license_determination PROHIBITED for the destination"
  - id: ERR_EXPORT_LICENSE_REQUIRED
    http: 409
    condition: "the screening's license_determination is LICENSE_REQUIRED and export_license_id is still null when a booking is attempted"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting user captured the credit under review, or generated one of the documents under examination"
  - id: ERR_RECOMMENDATION_NOT_PERMITTED
    http: 409
    condition: "ACCEPT submitted with terms_risk_score >= RISK_ACCEPT_CEILING, or a non-REJECT recommendation submitted with terms_risk_score >= RISK_REJECT_FLOOR, or ACCEPT submitted with an OPEN CRITICAL finding"

  # --- temporal ---
  - id: ERR_LC_EXPIRED
    http: 409
    condition: "the logical clock is at or after LetterOfCredit.expiry_date for an operation that requires a live credit"
  - id: ERR_PRESENTATION_PERIOD_ELAPSED
    http: 409
    condition: "days_after_on_board exceeds LetterOfCredit.presentation_period_days"
  - id: ERR_LATEST_SHIPMENT_DATE_PASSED
    http: 409
    condition: "the bill-of-lading on_board_date is after LetterOfCredit.latest_shipment_date or after ExportOrder.ship_by_date"
  - id: ERR_LICENSE_NOT_VALID_AT_DATE
    http: 409
    condition: "the logical clock is outside the license's inclusive [valid_from, valid_to] window"
  - id: ERR_SAILING_CUTOFF_PASSED
    http: 409
    condition: "the logical clock is at or after VesselSailing.cutoff_at when a booking is attempted"

  # --- constraint satisfaction ---
  - id: ERR_LICENSE_WINDOW_OVERLAP
    http: 409
    condition: "another license for the same buyer and eccn has a closed validity interval intersecting the requested one (touching endpoints count as overlap)"
  - id: ERR_BOOKING_WINDOW_OVERLAP
    http: 409
    condition: "the order already holds a live booking whose half-open occupation interval intersects the new one (touching endpoints do not count as overlap)"
  - id: ERR_DUPLICATE_LC_NUMBER
    http: 409
    condition: "lc_number already exists on a LetterOfCredit with status NOT IN {REJECTED, EXPIRED}"
  - id: ERR_DUPLICATE_LICENSE_NUMBER
    http: 409
    condition: "license_number already exists"
  - id: ERR_DUPLICATE_POLICY_NUMBER
    http: 409
    condition: "policy_number already exists"
  - id: ERR_DUPLICATE_LINE_NO
    http: 409
    condition: "line_no already exists on the order"
  - id: ERR_DUPLICATE_VOYAGE
    http: 409
    condition: "voyage_no already exists for the carrier_scac"
  - id: ERR_DUPLICATE_ISSUED_DOCUMENT
    http: 409
    condition: "another TradeDocument of the same doc_type on the order already has status ISSUED"
  - id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http: 409
    condition: "a counter is attempted when negotiation_round already equals MAX_NEGOTIATION_ROUNDS and the case has been escalated"
  - id: ERR_CURE_ROUNDS_EXHAUSTED
    http: 409
    condition: "a cure is attempted when presentation_round already equals MAX_CURE_ROUNDS"

  # --- referential integrity of pinned revisions ---
  - id: ERR_DOCUMENT_REVISION_SUPERSEDED
    http: 409
    condition: "a tendered TradeDocument has status SUPERSEDED, VOIDED or DRAFT, belongs to a different order, or duplicates an ACTIVE link of the same doc_type"
  - id: ERR_DOCUMENT_STALE_SOURCE
    http: 409
    condition: "TradeDocument.pinned_order_version no longer equals the current ExportOrder.version at issue time"
  - id: ERR_REQUIRED_DOCUMENT_MISSING
    http: 409
    condition: "a doc_type listed in LetterOfCredit.required_document_types has no ACTIVE PresentationDocumentLink"

  # --- empty-collection and zero-quantity boundaries ---
  - id: ERR_NO_SHIPMENT_LINES
    http: 422
    condition: "compliance submission attempted on an order with zero ShipmentLine rows"
  - id: ERR_PRESENTATION_NO_DOCUMENTS
    http: 422
    condition: "trade_document_ids is an empty array"
  - id: ERR_NO_REPLACEMENT_DOCUMENTS
    http: 422
    condition: "replacement_document_ids is an empty array"
  - id: ERR_ZERO_SHIPPED_QUANTITY
    http: 422
    condition: "shipped_lines is empty, or some shipped_quantity is 0 or exceeds the line's ordered quantity"

  # --- fiscal ---
  - id: ERR_SAILING_CAPACITY_EXCEEDED
    http: 409
    condition: "booked_weight_kg + the requested weight strictly exceeds VesselSailing.capacity_weight_kg"
  - id: ERR_LICENSE_VALUE_EXHAUSTED
    http: 409
    condition: "consumed_value_usd + the order's value strictly exceeds ExportLicense.licensed_value_usd"
  - id: ERR_LC_AMOUNT_EXCEEDED
    http: 409
    condition: "presented_amount_usd strictly exceeds max_drawable_usd, or received_amount_usd exceeds negotiable_amount_usd"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 409
    condition: "the requested exposure exceeds CreditInsurancePolicy.available_limit_usd"
  - id: ERR_CLAIM_EXCEEDS_COVERAGE
    http: 409
    condition: "the implied indemnity exceeds credit_limit_usd - indemnified_total_usd"
  - id: ERR_CLAIM_AMOUNT_INVALID
    http: 422
    condition: "claimed_amount_usd exceeds ordered_goods_value_usd, or exceeds short_shipped_value_usd for a SHORT_SHIPMENT dispute"
  - id: ERR_OFFER_AMOUNT_INVALID
    http: 422
    condition: "an offer exceeds claimed_amount_usd or the standing counter, or a counter is not strictly above the standing offer or exceeds claimed_amount_usd"

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
# =============================================================================
roles:

  - name: ExportOpsCoordinator
    description: "Prepares orders, captures credit terms, generates and issues trade documents, books freight and lodges presentations. Barred from reviewing the credits it captures and from examining presentations containing documents it generated."
    identity: opaque
    exclusive_operations:
      - "POST /export-orders"
      - "POST /export-orders/{export_order_id}/shipment-lines"
      - "POST /export-orders/{export_order_id}/submit-for-compliance"
      - "POST /export-orders/{export_order_id}/cancel"
      - "POST /letters-of-credit"
      - "POST /letters-of-credit/{lc_id}/amendments"
      - "POST /trade-documents"
      - "POST /trade-documents/{document_id}/issue"
      - "POST /trade-documents/{document_id}/regenerate"
      - "POST /trade-documents/{document_id}/void"
      - "POST /freight-bookings"
      - "POST /freight-bookings/{booking_id}/confirm"
      - "POST /freight-bookings/{booking_id}/cancel"
      - "POST /freight-bookings/{booking_id}/bill-of-lading"
      - "POST /document-presentations"
      - "POST /document-presentations/{presentation_id}/cure"
    shared_operations:
      - "POST /vessel-sailings (with PlatformAdmin)"
      - "GET /export-orders, GET /export-orders/{export_order_id}, GET /export-orders/{export_order_id}/cost-allocation, GET /export-orders/{export_order_id}/shipment-lines"
      - "GET /letters-of-credit, GET /letters-of-credit/{lc_id}, GET /lc-terms-reviews, GET /discrepancy-findings"
      - "GET /trade-documents, GET /presentation-document-links"
      - "GET /export-control-screenings, GET /export-licenses"
      - "GET /vessel-sailings/{vessel_sailing_id}, GET /freight-bookings"
      - "GET /document-presentations, GET /document-presentations/{presentation_id}"
      - "GET /credit-insurance-policies, GET /credit-insurance-policies/{policy_id}, GET /dispute-cases, GET /foreign-buyers/{buyer_id}"
      - "item reads: GET /shipment-lines, GET /shipment-lines/{shipment_line_id}, GET /lc-terms-reviews/{review_id}, GET /discrepancy-findings/{finding_id}, GET /trade-documents/{document_id}, GET /export-control-screenings/{screening_id}, GET /export-licenses/{export_license_id}, GET /freight-bookings/{booking_id}, GET /presentation-document-links/{link_id}, GET /dispute-cases/{dispute_id}"

  - name: TradeComplianceOfficer
    description: "Owns buyer onboarding, denied-party screening, classification decisions and export licenses. Never prepares or issues commercial documents and never touches money."
    identity: opaque
    exclusive_operations:
      - "PATCH /foreign-buyers/{buyer_id}/restricted-party-flag"
      - "POST /export-control-screenings/{screening_id}/decision"
      - "POST /export-control-screenings/{screening_id}/licenses"
      - "POST /export-control-screenings/{screening_id}/clear-with-license"
    shared_operations:
      - "POST /foreign-buyers (with PlatformAdmin)"
      - "GET /foreign-buyers/{buyer_id}, GET /export-orders, GET /export-orders/{export_order_id}, GET /export-orders/{export_order_id}/shipment-lines"
      - "GET /export-control-screenings, GET /export-licenses, GET /trade-documents, GET /freight-bookings"
      - "item reads: GET /shipment-lines, GET /shipment-lines/{shipment_line_id}, GET /export-control-screenings/{screening_id}, GET /export-licenses/{export_license_id}, GET /trade-documents/{document_id}, GET /freight-bookings/{booking_id}"

  - name: DocumentaryCreditReviewer
    description: "Reviews credit terms before shipment and examines document presentations afterwards. Cannot capture credits, generate documents or move money."
    identity: opaque
    exclusive_operations:
      - "POST /letters-of-credit/{lc_id}/reviews"
      - "POST /lc-terms-reviews/{review_id}/findings"
      - "POST /lc-terms-reviews/{review_id}/submit"
      - "POST /document-presentations/{presentation_id}/examine"
    shared_operations:
      - "GET /foreign-buyers/{buyer_id}, GET /export-orders, GET /export-orders/{export_order_id}, GET /export-orders/{export_order_id}/shipment-lines"
      - "GET /letters-of-credit, GET /letters-of-credit/{lc_id}, GET /lc-terms-reviews, GET /discrepancy-findings"
      - "GET /trade-documents, GET /presentation-document-links, GET /document-presentations, GET /document-presentations/{presentation_id}"
      - "item reads: GET /shipment-lines, GET /shipment-lines/{shipment_line_id}, GET /lc-terms-reviews/{review_id}, GET /discrepancy-findings/{finding_id}, GET /trade-documents/{document_id}, GET /presentation-document-links/{link_id}"

  - name: FinanceCollectionsOfficer
    description: "Collects payment against presentations, writes credit insurance, files claims and negotiates settlements from the seller side. Cannot examine documents or make compliance decisions."
    identity: opaque
    exclusive_operations:
      - "POST /document-presentations/{presentation_id}/settlement"
      - "POST /document-presentations/{presentation_id}/dishonour"
      - "POST /export-orders/{export_order_id}/write-off"
      - "POST /credit-insurance-policies"
      - "POST /credit-insurance-policies/{policy_id}/claims"
      - "POST /dispute-cases/{dispute_id}/offers"
    shared_operations:
      - "POST /dispute-cases (with ForeignBuyer)"
      - "POST /dispute-cases/{dispute_id}/accept (with ForeignBuyer and PlatformAdmin)"
      - "GET /foreign-buyers/{buyer_id}, GET /export-orders, GET /export-orders/{export_order_id}, GET /export-orders/{export_order_id}/cost-allocation"
      - "GET /letters-of-credit, GET /letters-of-credit/{lc_id}, GET /discrepancy-findings, GET /trade-documents"
      - "GET /vessel-sailings/{vessel_sailing_id}, GET /freight-bookings, GET /presentation-document-links"
      - "GET /document-presentations, GET /document-presentations/{presentation_id}"
      - "GET /credit-insurance-policies, GET /credit-insurance-policies/{policy_id}, GET /dispute-cases"
      - "item reads: GET /discrepancy-findings/{finding_id}, GET /trade-documents/{document_id}, GET /freight-bookings/{booking_id}, GET /presentation-document-links/{link_id}, GET /dispute-cases/{dispute_id}"

  - name: ForeignBuyer
    description: "The overseas buyer. Waives presentation discrepancies, opens short-shipment and quality disputes and counters settlement offers. X-User-ID is the buyer's own row id and every read is scoped to its own orders."
    identity: "entity_backed:ForeignBuyer"
    exclusive_operations:
      - "POST /discrepancy-findings/{finding_id}/waiver"
      - "POST /dispute-cases/{dispute_id}/counter"
    shared_operations:
      - "POST /dispute-cases (with FinanceCollectionsOfficer)"
      - "POST /dispute-cases/{dispute_id}/accept (with FinanceCollectionsOfficer and PlatformAdmin)"
      - "GET /export-orders (scoped to buyer_id equal to X-User-ID)"
      - "GET /discrepancy-findings, GET /dispute-cases (scoped to its own orders)"
      - "item reads: GET /discrepancy-findings/{finding_id}, GET /dispute-cases/{dispute_id} (scoped to its own orders)"

  - name: PlatformAdmin
    description: "Operator role. Drives the logical clock, publishes sailings, onboards buyers and breaks negotiation deadlocks on escalated disputes."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /dispute-cases/{dispute_id}/close"
    shared_operations:
      - "POST /foreign-buyers (with TradeComplianceOfficer)"
      - "POST /vessel-sailings (with ExportOpsCoordinator)"
      - "POST /dispute-cases/{dispute_id}/accept (with ForeignBuyer and FinanceCollectionsOfficer)"
      - "every GET endpoint declared in §1.5"
