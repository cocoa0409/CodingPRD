scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: qslp_mirror_vs_annual_true_up_divergence
        grounds:
          - calculations.qslp_match_amount
          - calculations.qslp_mirror_allocation
          - calculations.qslp_annual_true_up
          - calculations.deferral_match_per_period
          - entities.MatchAllocation.fields.allocation_type
          - entities.PlanYear.fields.total_qslp_match_funded_cents
          - state_machines.LoanCertification.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          On the MatchAllocation / LoanCertification money domain, the identical 30000 cents of
          certified student-loan payments yields 20000 cents under the PAY_PERIOD_MIRROR variant
          (leftover tier space measured period by period, so 20000 of the certified dollars land in
          the 50%-rate tier-2 bucket) but a 30000-cent annual entitlement under the ANNUAL_TRUE_UP
          variant (leftover tier space measured on annual totals, where the whole amount fits the
          100%-rate tier-1 bucket), producing a pinned 10000-cent reconciliation delta.
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with the default 3%@100% / 2%@50% match formula, 2300000-cent annual deferral limit and 34500000-cent compensation cap."
            - "One EFFECTIVE PlanAmendment for that plan year."
            - "One Employee E-001, NHCE (prior-year compensation 6000000 cents), fully vested (72 service months)."
            - "Three payroll periods, each with one ContributionRecord of 1000000 cents counted compensation and 20000 cents elective deferral, so each period leaves 10000 cents of tier-1 space and 20000 cents of tier-2 space unused."
            - "One VERIFIED LoanAccount and one SUBMITTED LoanCertification carrying a single 30000-cent certified payment line."
            - "One PENDING FundingBatch on payroll period 1."
            - "Logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z", compensation_cap_cents: 34500000, annual_deferral_limit_cents: 2300000, hce_prior_comp_threshold_cents: 15500000, tier1_pct: 0.03, tier1_match_rate: 1.00, tier2_pct: 0.02, tier2_match_rate: 0.50 }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments"
              payload: { plan_year_id: "${py_id}", document_ref: "AMD-2026-QSLP-1", effective_date: "2026-01-01T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { amd_id: $.data.id }
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "ADOPTED" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "NOTICE_SENT", notice_channel: "EMAIL" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-001", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 2, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T23:59:59Z", pay_date: "2026-03-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp2_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 3, start_date: "2026-03-01T00:00:00Z", end_date: "2026-03-31T23:59:59Z", pay_date: "2026-04-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp3_id: $.data.id }
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp2_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp3_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
            - call: "POST /loan-accounts"
              payload: { employee_id: "${emp_id}", servicer_name: "Nelnet", account_last4: "4321", original_principal_cents: 2500000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { la_id: $.data.id }
            - call: "POST /loan-accounts/${la_id}/verification"
              payload: { to_status: "VERIFIED", evidence_ref: "STMT-2026-03" }
              as: BenefitsAdministrator
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp_v: $.data.version }
            - call: "POST /loan-certifications"
              payload: { employee_id: "${emp_id}", plan_year_id: "${py_id}", certification_method: "SERVICER_STATEMENT", expected_employee_version: "${emp_v}" }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { cert_id: $.data.id }
            - call: "POST /loan-certifications/${cert_id}/lines"
              payload: { loan_account_id: "${la_id}", payment_date: "2026-03-15T00:00:00Z", amount_cents: 30000, covered_period_start: "2026-03-01T00:00:00Z", covered_period_end: "2026-04-01T00:00:00Z" }
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /loan-certifications/${cert_id}/submit"
              payload: {}
              as: Employee
              as_user_id: "${emp_id}"
            - call: "POST /funding-batches"
              payload: { plan_year_id: "${py_id}", payroll_period_id: "${pp1_id}" }
              as: PayrollOperator
              captures: { fb1_id: $.data.id }
          trigger:
            - call: "POST /loan-certifications/${cert_id}/decision"
              payload: { decision: "ACCEPT" }
              as: BenefitsAdministrator
              as_user_id: "admin-1"
              captures: { cert_eligible: $.data.eligible_total_cents, cert_matched: $.data.matched_total_cents }
            - call: "GET /match-allocations"
              payload: { certification_id: "${cert_id}" }
              as: BenefitsAdministrator
              captures: { mirror_id: "$.data[0].id", mirror_amount: "$.data[0].amount_cents", mirror_t1: "$.data[0].tier1_applied_cents", mirror_t2: "$.data[0].tier2_applied_cents" }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "LOCKED" }
              as: BenefitsAdministrator
            - call: "POST /plan-years/${py_id}/true-up"
              payload: { employee_id: "${emp_id}" }
              as: BenefitsAdministrator
              captures: { tu_count: $.data.true_up_allocation_count, tu_total: $.data.total_true_up_cents, tu_recoup: $.data.recoupment_count }
          assert:
            - "cert_eligible == 30000"
            - "MatchAllocation.${mirror_id}.allocation_type == MIRROR"
            - "mirror_amount == 20000"
            - "mirror_t1 == 10000"
            - "mirror_t2 == 20000"
            - "cert_matched == 20000  # PAY_PERIOD_MIRROR variant total"
            - "tu_count == 1"
            - "tu_total == 10000  # ANNUAL_TRUE_UP entitlement 30000 minus the 20000 already funded by the MIRROR variant"
            - "tu_recoup == 0"
            - "exactly one MatchAllocation with plan_year_id == ${py_id} and allocation_type == TRUE_UP, and its amount_cents == 10000"
            - "PlanYear.${py_id}.total_qslp_match_funded_cents == 30000"
            - "PlanYear.${py_id}.true_up_completed == true"

      - name: acp_current_year_vs_prior_year_method_flip
        grounds:
          - calculations.acp_test
          - entities.NondiscriminationTest.fields.test_method
          - entities.NondiscriminationTest.fields.limit_acp
          - entities.PlanYear.fields.prior_year_nhce_acp
          - entities.Employee.fields.hce_flag
          - state_machines.NondiscriminationTest.PENDING_to_PASSED
          - state_machines.NondiscriminationTest.PENDING_to_FAILED
        distinguishing_aspect: |
          On the NondiscriminationTest compliance-ratio domain (a different entity domain from the
          MatchAllocation money domain of the first instance), identical current-year participant data
          produces limit_acp 0.0202 and status FAILED under the CURRENT_YEAR method but limit_acp
          0.0460 and status PASSED under the PRIOR_YEAR method, because the NHCE average is sourced
          from the live population in one variant and from PlanYear.prior_year_nhce_acp in the other.
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with prior_year_nhce_acp pinned at 0.0260 and the HCE threshold at 15500000 cents."
            - "One payroll period 1."
            - "Three NHCE employees with prior-year compensation 6000000 cents and one ContributionRecord each: 1000000 cents counted compensation with deferrals 10049, 10049 and 10449 cents (deferral match equal to the deferral because all sit inside the 30000-cent tier-1 cap)."
            - "One HCE employee with prior-year compensation 20000000 cents and one ContributionRecord of 1000000 cents compensation with 30000 cents deferral (deferral match 30000)."
            - "Two PENDING NondiscriminationTest rows on the same plan year, one per test_method."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z", hce_prior_comp_threshold_cents: 15500000, nondiscrimination_test_method: "CURRENT_YEAR", prior_year_nhce_acp: 0.0260 }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /employees"
              payload: { external_id: "N-1", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { n1_id: $.data.id }
            - call: "POST /employees"
              payload: { external_id: "N-2", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { n2_id: $.data.id }
            - call: "POST /employees"
              payload: { external_id: "N-3", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { n3_id: $.data.id }
            - call: "POST /employees"
              payload: { external_id: "H-1", hire_date: "2015-01-01T00:00:00Z", prior_year_compensation_cents: 20000000, vesting_service_months: 120 }
              as: BenefitsAdministrator
              captures: { h1_id: $.data.id }
            - call: "POST /contribution-records"
              payload: { employee_id: "${n1_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 10049 }
              as: PayrollOperator
            - call: "POST /contribution-records"
              payload: { employee_id: "${n2_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 10049 }
              as: PayrollOperator
            - call: "POST /contribution-records"
              payload: { employee_id: "${n3_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 10449 }
              as: PayrollOperator
            - call: "POST /contribution-records"
              payload: { employee_id: "${h1_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 30000 }
              as: PayrollOperator
            - call: "POST /nondiscrimination-tests"
              payload: { plan_year_id: "${py_id}", test_method: "CURRENT_YEAR" }
              as: ComplianceAuditor
              captures: { t_cur_id: $.data.id }
            - call: "POST /nondiscrimination-tests"
              payload: { plan_year_id: "${py_id}", test_method: "PRIOR_YEAR" }
              as: ComplianceAuditor
              captures: { t_prior_id: $.data.id }
          trigger:
            - call: "POST /nondiscrimination-tests/${t_cur_id}/compute"
              payload: { include_qslp_match: true }
              as: ComplianceAuditor
              captures: { cur_nhce: $.data.nhce_acp, cur_hce: $.data.hce_acp, cur_limit: $.data.limit_acp, cur_status: $.data.status, cur_nhce_n: $.data.nhce_count, cur_hce_n: $.data.hce_count }
            - call: "POST /nondiscrimination-tests/${t_prior_id}/compute"
              payload: { include_qslp_match: true }
              as: ComplianceAuditor
              captures: { pri_nhce: $.data.nhce_acp, pri_hce: $.data.hce_acp, pri_limit: $.data.limit_acp, pri_status: $.data.status }
          assert:
            - "cur_nhce_n == 3"
            - "cur_hce_n == 1"
            - "cur_hce == 0.0300"
            - "cur_nhce == 0.0101"
            - "cur_limit == 0.0202"
            - "cur_status == FAILED"
            - "pri_nhce == 0.0260"
            - "pri_hce == 0.0300"
            - "pri_limit == 0.0460"
            - "pri_status == PASSED"
            - "NondiscriminationTest.${t_cur_id}.limit_acp != NondiscriminationTest.${t_prior_id}.limit_acp on identical current-year data"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: acp_round_per_participant_then_average
        grounds:
          - calculations.acp_test
          - entities.NondiscriminationTest.fields.nhce_acp
          - entities.ContributionRecord.fields.deferral_match_cents
          - entities.ContributionRecord.fields.counted_compensation_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins "round each participant
          ratio to 4 decimal places FIRST, then average the already-rounded ratios": three NHCE raw
          ratios of 0.010049, 0.010049 and 0.010449 give nhce_acp == 0.0101 under the pinned order,
          whereas averaging the raw ratios and rounding once would give 0.0102.
        test_recipe:
          setup:
            - "One PlanYear 2026 in status OPEN with the default HCE threshold."
            - "One payroll period 1."
            - "Three NHCE employees, each with one ContributionRecord of 1000000 cents counted compensation and deferrals of 10049, 10049 and 10449 cents, producing deferral matches of 10049, 10049 and 10449 cents."
            - "One PENDING NondiscriminationTest with test_method CURRENT_YEAR."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z", hce_prior_comp_threshold_cents: 15500000 }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /employees"
              payload: { external_id: "R-1", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { r1_id: $.data.id }
            - call: "POST /employees"
              payload: { external_id: "R-2", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { r2_id: $.data.id }
            - call: "POST /employees"
              payload: { external_id: "R-3", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { r3_id: $.data.id }
            - call: "POST /contribution-records"
              payload: { employee_id: "${r1_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 10049 }
              as: PayrollOperator
              captures: { cr1_match: $.data.deferral_match_cents }
            - call: "POST /contribution-records"
              payload: { employee_id: "${r2_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 10049 }
              as: PayrollOperator
            - call: "POST /contribution-records"
              payload: { employee_id: "${r3_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 10449 }
              as: PayrollOperator
              captures: { cr3_match: $.data.deferral_match_cents }
            - call: "POST /nondiscrimination-tests"
              payload: { plan_year_id: "${py_id}", test_method: "CURRENT_YEAR" }
              as: ComplianceAuditor
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /nondiscrimination-tests/${t_id}/compute"
              payload: { include_qslp_match: true }
              as: ComplianceAuditor
              captures: { nhce: $.data.nhce_acp, limit: $.data.limit_acp, hce: $.data.hce_acp, nhce_n: $.data.nhce_count, st: $.data.status }
          assert:
            - "cr1_match == 10049"
            - "cr3_match == 10449"
            - "nhce_n == 3"
            - "nhce == 0.0101  # mean of the per-participant rounded ratios 0.0100, 0.0100, 0.0104; sum-then-round would be 0.0102"
            - "nhce != 0.0102"
            - "hce == 0.0000"
            - "limit == 0.0202"
            - "st == PASSED"

      - name: true_up_evaluation_order_pinned
        grounds:
          - calculations.qslp_annual_true_up
          - entities.PlanYear.fields.total_qslp_match_funded_cents
          - entities.PlanYear.fields.true_up_completed
          - validations[priority=27]
          - state_machines.MatchAllocation.UNFUNDED_to_SCHEDULED
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with a pinned evaluation order. The true-up delta is
          a function of funded QSLP match, and the true-up itself writes funded QSLP match; the
          scaffold pins STEP 3 to snapshot only allocations with created_at < run_started_at, so the
          delta is 10000 (90000 entitlement - 60000 deferral match - 20000 pre-run MIRROR match) and
          not 0 (which is what including the run's own TRUE_UP row would yield).
        test_recipe:
          setup:
            - "The full state of instance qslp_mirror_vs_annual_true_up_divergence after its ACCEPT: PlanYear 2026, three payroll periods each 1000000 cents compensation / 20000 cents deferral, one ACCEPTED LoanCertification with eligible_total_cents 30000 and one SCHEDULED MIRROR MatchAllocation of 20000 cents in a PENDING FundingBatch on period 1."
            - "PlanYear moved to LOCKED so the annual true-up run is available, with true_up_completed still false."
          setup_api_calls:
            - call: "POST /plan-years"
              payload: { year: 2026, period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T23:59:59Z", certification_window_open: "2026-01-01T00:00:00Z", certification_deadline: "2026-12-31T23:59:59Z", compensation_cap_cents: 34500000, annual_deferral_limit_cents: 2300000, tier1_pct: 0.03, tier1_match_rate: 1.00, tier2_pct: 0.02, tier2_match_rate: 0.50 }
              as: BenefitsAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments"
              payload: { plan_year_id: "${py_id}", document_ref: "AMD-2026-QSLP-1", effective_date: "2026-01-01T00:00:00Z" }
              as: BenefitsAdministrator
              captures: { amd_id: $.data.id }
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "ADOPTED" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "NOTICE_SENT", notice_channel: "PORTAL" }
              as: BenefitsAdministrator
            - call: "POST /plan-amendments/${amd_id}/status"
              payload: { to_status: "EFFECTIVE" }
              as: BenefitsAdministrator
            - call: "POST /employees"
              payload: { external_id: "E-001", hire_date: "2019-01-01T00:00:00Z", prior_year_compensation_cents: 6000000, vesting_service_months: 72 }
              as: BenefitsAdministrator
              captures: { emp_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 1, start_date: "2026-01-01T00:00:00Z", end_date: "2026-01-31T23:59:59Z", pay_date: "2026-02-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp1_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 2, start_date: "2026-02-01T00:00:00Z", end_date: "2026-02-28T23:59:59Z", pay_date: "2026-03-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp2_id: $.data.id }
            - call: "POST /payroll-periods"
              payload: { plan_year_id: "${py_id}", period_number: 3, start_date: "2026-03-01T00:00:00Z", end_date: "2026-03-31T23:59:59Z", pay_date: "2026-04-05T00:00:00Z" }
              as: PayrollOperator
              captures: { pp3_id: $.data.id }
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp1_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp2_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
            - call: "POST /contribution-records"
              payload: { employee_id: "${emp_id}", payroll_period_id: "${pp3_id}", eligible_compensation_cents: 1000000, elective_deferral_cents: 20000 }
              as: PayrollOperator
            - call: "POST /loan-accounts"
              payload: { employee_id: "${emp_id}", servicer_name: "Nelnet", account_last4: "4321", original_principal_cents: 2500000 }
              as: Employee
              as_user_id: "${emp_id}"
              captures: { la_id: $.data.id }
            - call: "POST /loan-accounts/${la_id}/verification"
              payload: { to_status: "VERIFIED", evidence_ref: "STMT-2026-03" }
              as: BenefitsAdministrator
            - call: "GET /employees/${emp_id}"
              payload: {}
              as: BenefitsAdministrator
              captures: { emp_v: $.data.version }
