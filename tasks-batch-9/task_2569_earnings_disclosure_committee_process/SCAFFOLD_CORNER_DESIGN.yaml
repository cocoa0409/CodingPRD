            - call: "POST /disclosure/reporting-cycles"
              payload: { fiscal_period_label: "FY2026-Q2", form_type: "FORM_10Q", period_end_date: "2026-06-30", filer_status: "LARGE_ACCELERATED", materiality_base_amount: 10000000, charter_id: "${charter_b_id}", internal_buffer_days: 5 }
              as: ComplianceAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/milestones"
              payload: { kind: "CLOSE", planned_start_utc: "2026-08-01T00:00:00Z", planned_end_utc: "2026-08-03T00:00:00Z" }
              as: Controller
              as_user_id: "${fin_b_id}"
              captures: { close_ms_id: $.data.id }
            - call: "POST /disclosure/reporting-cycles/${cycle_id}/transitions"
              payload: { action: "OPEN_CLOSE" }
              as: Controller
              as_user_id: "${fin_b_id}"
            - call: "POST /disclosure/milestones/${close_ms_id}/transitions"
              payload: { action: "START" }
              as: Controller
              as_user_id: "${fin_b_id}"
            - call: "POST /disclosure/milestones/${close_ms_id}/transitions"
              payload: { action: "COMPLETE" }
              as: Controller
              as_user_id: "${fin_b_id}"
          trigger:
            - call: "POST /disclosure/charters/${charter_a_id}/transitions"
              payload: { action: "SUPERSEDE", successor_charter_id: "${charter_b_id}" }
