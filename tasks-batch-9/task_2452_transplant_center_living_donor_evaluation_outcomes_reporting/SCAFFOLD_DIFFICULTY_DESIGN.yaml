- rule_id: compensating_invariant
  instances:
  - name: donor_fund_ledger_restored_by_claim_reversal
    grounds:
    - calculations.donor_fund_ledger
    - calculations.donor_fund_ledger.invariant
    - state_machines.DonorCostClaim.ADJUDICATED_to_REVERSED
    - entities.TransplantProgram.fields.donor_fund_committed_cents
    - entities.TransplantProgram.fields.donor_fund_remaining_cents
    - entities.DonorCostClaim.fields.fund_part_cents
    distinguishing_aspect: 'Conserved quantity = MONEY in integer cents: donor_fund_committed_cents +
      donor_fund_remaining_cents must equal donor_fund_pool_cents before and after the compensating write,
      with no residue. The reversal has to remove exactly the fund_part_cents that adjudication added,
      even though the claim''s own adjudicated total (1000000) is larger than the fund''s share (400000).'
    test_recipe:
      setup:
      - A program with donor_fund_pool_cents 5000000, donor_fund_committed_cents 0 and donor_fund_remaining_cents
        5000000
      - A donor who completed donation on 2026-08-09 (overall_status DONATED) through a committed paired
        loop
      - 'One MEDICAL DonorCostClaim for 1000000 cents with coverage_source RECIPIENT_INSURANCE, ADJUDICATED:
        insurance_part_cents 600000 (the per-claim insurance cap), grant_part_cents 0 (MEDICAL is not
        grant-eligible), fund_part_cents 400000, adjudicated_reimbursement_cents 1000000, unfunded_cents
        0'
      - TransplantProgram.donor_fund_committed_cents is therefore 400000 and donor_fund_remaining_cents
        4600000, summing to the pool
      setup_api_calls:
      - call: POST /programs
        payload:
          name: Northlake Transplant Center
          center_code: NLT-01
          organ_type: KIDNEY
          cooling_off_days: 7
          follow_up_completeness_threshold_pct: 80
          follow_up_compliance_threshold_pct: 75
          expected_one_year_survival_rate: 0.8
          donor_fund_pool_cents: 5000000
          lost_wage_daily_cap_cents: 30000
          lost_wage_weekly_cap_cents: 150000
        as: ProgramAdmin
        captures:
          prog_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
