      - name: ticket_gross_potential_rounds_each_line_before_summing
        claim_type: precision
        grounds:
          - calculations.ticket_gross_potential
        distinguishing_aspect: "Each ticket-scale line is rounded to whole cents before the lines are summed, so a multi-line booking differs from the sum-then-round alternative."
        excluded_because:
          difficulty_instance: ticket_gross_potential_per_line_then_sum
          rationale: |
            The §1.8 instance already drives three scales whose per-line
            round_half_up results sum to a figure one cent away from the
            sum-then-round alternative, and asserts the booking rollup as well as
            each scale line. A §1.9 precision recipe would restate the same
            fixture with fewer lines.

      - name: stage_hold_ledger_aggregates_offers_and_bookings
        claim_type: aggregation
        grounds:
          - calculations.stage_hold_ledger
        distinguishing_aspect: "held_show_count sums live offer holds and live bookings on one stage, and drives booking_posture and the edition's open_stage_count."
        excluded_because:
          difficulty_instance: offer_send_saturates_stage_and_closes_edition_slot
          rationale: |
            The §1.8 transitive cascade already walks the ledger up from a single
            send through held_show_count, committed_guarantee_total_cents and the
            stage's slot posture, and asserts that ACCEPTED offers are counted via
            their booking rather than twice. A §1.9 aggregation recipe would add
            no distinct arithmetic.

      - name: artist_draw_score_blends_base_and_performance
        claim_type: weighted_scoring
        grounds:
          - calculations.artist_draw_score
        distinguishing_aspect: "The draw score blends the artist's base_draw_score with realised performance under the edition's strategy_basis weighting."
        excluded_because:
          difficulty_instance: artist_draw_score_attendance_vs_revenue_weighted
          rationale: |
            The §1.8 dual-variant instance computes the score under both
            ATTENDANCE_WEIGHTED and REVENUE_WEIGHTED editions on identical
            performance data, including the min(60, ...) clamp on the revenue
            branch, which strictly contains any single-basis weighted-scoring
            recipe.

      - name: settlement_payout_diverges_by_deal_type
        claim_type: variant_divergence
        grounds:
          - calculations.artist_payout
        distinguishing_aspect: "The same pool, expenses and surcharge produce different artist payouts under VERSUS and GUARANTEE_PLUS_BACKEND."
        excluded_because:
          difficulty_instance: settlement_payout_versus_vs_guarantee_plus_backend
          rationale: |
            The §1.8 instance runs two settlements on the same gross, expenses and
            surcharge with only deal_type differing, and asserts both payouts plus
            the breakeven interaction. The §1.9 variant_selection instance above
            already covers the branch-before-surcharge ordering, so a further
            divergence recipe would be redundant.

