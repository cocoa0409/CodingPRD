        grounds:
          - calculations.run_quality_index_certified
          - calculations.run_quality_index_certified.variants.endpoints_unweighted_vs_all_reels_weighted
          - state_machines.ProductionRun.transitions.PROVISIONAL_to_HELD
          - entities.ProductionRun.fields.certified_quality_index
        distinguishing_aspect: "The same three reels score 97.14 / 100.00 / 97.57 on 2.000 / 11.000 / 2.000 tons. The certified variant must be the tonnage-weighted mean 99.29; an unweighted all-reel mean gives 98.24 and the provisional endpoint-pair rule gives 97.36. All three are computable from the same payload, so only variant selection distinguishes them — and both indexes must survive side by side on the row after the hold."
