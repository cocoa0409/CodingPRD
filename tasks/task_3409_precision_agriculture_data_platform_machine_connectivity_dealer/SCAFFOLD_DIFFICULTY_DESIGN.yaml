            - "grant_status == SUSPENDED and sess_status == CLOSED and sess_reason == \"ACCESS_WITHDRAWN\" (fan-out)"
            - "plan_status_after_resume == SUSPENDED — organization resume does NOT revive children"

      - name: package_withdraw_cascade_depth2_to_consent
        grounds:
