        claim_type: dual_variant_calculation
        grounds: ["calculations.fee_assessment"]
        excluded_because:
          difficulty_instance: fee_provisional_vs_final_diverge_on_charge_input_set
          rationale: "Both variants (PROVISIONAL/FINAL) plus their reconciliation-on-execution are asserted by the named §1.8 instance, including the supersede of the provisional assessment."

  # ================================================== 9. consistency model
  - section: consistency_model
    instances:
      - name: immediate_consistency_release_response
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "endpoints[POST /wire-ops/wires/{wireId}/release]"]
        distinguishing_aspect: "The consistency model is immediate: the release RESPONSE body itself already reflects every side effect — status EXECUTED, fee_assessed_cents populated, reservation_active false, net_principal_cents set — with no re-read or settling delay."
        test_recipe:
          setup:
            - "Customer CM1 (MEDIUM), Account AM1, Beneficiary BM1, BusinessDate 2026-10-13 OPEN, Wire WM1 (100000, Fedwire) dual-approved"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Model One", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cm1: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cm1}", account_number: "A-M001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { am1: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cm1}", name: "Model Ben", bank_name: "ModelBank", account_number: "B-M001", country_code: "US" }, as: WireOperator, captures: { bm1: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-10-13" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${am1}", beneficiary_id: "${bm1}", amount_cents: 100000, method: "Fedwire", purpose: "consistency probe" }, as: WireOperator, as_user_id: "op-1", captures: { wm1: $.data.id } }
            - { call: "POST /wire-ops/wires/${wm1}/submit", payload: { business_date: "2026-10-13" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wm1}", as: WireOperator, captures: { m1_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wm1}/approve", payload: { expected_wire_version: "${m1_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wm1}", as: WireOperator, captures: { m1_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wm1}/approve", payload: { expected_wire_version: "${m1_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "GET /wire-ops/wires/${wm1}", as: WireOperator, captures: { m1_v3: $.data.version } }
          trigger:
            - { call: "POST /wire-ops/wires/${wm1}/release", payload: { expected_wire_version: "${m1_v3}" }, as: WireOperator, as_user_id: "op-1", captures: { m1_status: $.data.status, m1_fee: $.data.fee_assessed_cents, m1_res: $.data.reservation_active, m1_net: $.data.net_principal_cents, m1_exec: $.data.executed_at } }
          assert:
            - "Response body of the release call itself shows: status EXECUTED (${m1_status}), fee_assessed_cents 2500 (${m1_fee}), reservation_active false (${m1_res}), net_principal_cents 100000 (${m1_net}), executed_at non-null (${m1_exec})"
            - "No GET was needed between the mutating call and the observation — immediate consistency"
