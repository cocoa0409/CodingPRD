  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: factory_line_half_open_slot_windows_with_aggregate_capacity_two
        grounds:
          - validations[priority=68]
          - calculations.line_slot_schedule
          - entities.Factory.fields.parallel_station_capacity
          - entities.ModuleUnit.fields.line_slot_end
          - endpoints[POST /modular/modules/{moduleId}/schedule-line-slot]
        resource_entity: Factory (production line)
        interval_semantics: half-open [line_slot_start, line_slot_end), aggregate capacity 2, admits up to N-1 covering slots
        distinguishing_aspect: |
          The line is a COUNTING resource with half-open intervals: a third slot is refused only
          while two others already cover the requested instant, and the exact end instant of a slot
          is NOT covered, so a request starting at 23:00:00 — the very minute M-01's window ends —
          is admitted. Both properties are needed: an implementation using closed intervals rejects
          the 23:00 request, and one using exclusivity rejects M-02.
        test_recipe:
          setup:
            - "clock at 2026-09-01T08:00:00Z; FROZEN R1 with an APPROVED plan review"
            - "factory takt 90, 6 stations, parallel_station_capacity 2, shift window [06:00, 24:00)"
            - "modules M-01, M-02, M-03 all PLANNED"
          setup_api_calls:
            - call: "POST /modular/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /modular/factories"
