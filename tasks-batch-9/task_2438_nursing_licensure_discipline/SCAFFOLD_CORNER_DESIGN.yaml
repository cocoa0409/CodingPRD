            - "a follow-up board-decision with decision DENIED succeeds and yields status DENIED"

      - name: issuing_a_license_stamps_dates_and_runs_the_privilege_determination
        claim_type: side_effect_execution
        grounds:
          - state_machines.LicenseApplication.transitions.APPROVED_to_ISSUED
          - calculations.multistate_privilege_determination
          - entities.License.fields.expires_on
        distinguishing_aspect: "Issuance is a multi-write side effect: issued_on takes the logical clock, expires_on advances by renewal_period_months (24 months from 2026-08-01 is exactly 2028-08-01), the privilege triple is computed with variant RESIDENCY_DECLARED, and no NotificationReport is queued because the credential is RN and not NURSE_AIDE."
