    side_effects: []

  - method: POST
    path: "/cases"
    description: "Intake a new casework inquiry (status NEW). Sets representative_id from the constituent and computes provisional_due_at."
    roles: [Constituent, Caseworker, OfficeAdmin]
    code: 201
    input: [constituent_id, subject, description, category]
    output: Case
    side_effects: ["status=NEW; priority=NORMAL; representative_id copied from constituent; provisional_due_at computed"]
  - method: GET
    path: "/cases/{id}"
    description: "Fetch a case; recomputes gross/net elapsed hours and breached against the current clock."
    roles: [Constituent, Caseworker, OfficeAdmin]
    code: 200
    input: []
    output: Case
    side_effects: []
  - method: GET
    path: "/cases"
    description: "List/route cases (reverse lookup for Case.constituent_id and Case.representative_id)."
    roles: [Caseworker, OfficeAdmin]
    code: 200
    input: ["constituent_id?", "representative_id?", "status?", "category?", "limit?", "offset?"]
    output: Case[]
    side_effects: []
