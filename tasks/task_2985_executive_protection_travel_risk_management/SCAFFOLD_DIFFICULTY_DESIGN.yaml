    instances:

      - name: staff_rest_buffer_excludes_neighbour_until_exactly_twelve_hours_after
        grounds:
          - validations[priority=33]
          - errors.ERR_STAFF_REST_BUFFER_CONFLICT
          - detail_assignment_cost.constants.REST_BUFFER_HOURS
          - entities.SecurityStaff.committed_detail_hours
          - state_machines.ProtectiveDetailAssignment.null_to_CONFIRMED
          - concurrency_rules.detail-assignment-create-stale-leg
        distinguishing_aspect: |
          Resource: SECURITY_STAFF. Interval semantics: a PAIRWISE exclusion over
          REST_BUFFER_HOURS-INFLATED intervals, not a plain overlap. The two candidate
          windows tested here do not overlap the existing assignment at all in the ordinary
          sense — one begins six hours after it ends, the other nineteen hours and 59
          minutes after — yet the first is refused because the buffer expands the exclusion
          zone symmetrically on both sides, and the boundary is STRICT: a candidate whose
          starts_at equals existing.ends_at + 12h is accepted, while one starting a single
          minute earlier is refused. A single conflicting neighbour is enough (no counting
          is involved), which is the opposite of the vendor instance below.
