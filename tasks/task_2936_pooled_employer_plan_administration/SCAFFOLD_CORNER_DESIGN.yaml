              captures: { tr_id: $.data.id }
            - call: "GET /pep/service-providers/${rk_id}/affiliates"
              payload: { limit: 10, offset: 0 }
              as: PooledPlanProvider
              as_user_id: "${ppp_id}"
          assert:
            - "the cross-plan affiliation returns 422 ERR_INVALID_AFFILIATION — the id resolves, so this is not a 404"
            - "the unresolvable affiliation returns 404 ERR_SERVICE_PROVIDER_NOT_FOUND: the priority-6 FK check runs before the priority-38 business rule"
            - "the same-plan affiliation returns 201 with data.affiliated_service_provider_id == ${rk_id}"
            - "GET affiliates on the recordkeeper returns 1 row, the trustee, with total_count == 1 — the reverse direction of the self-referential link is navigable"

