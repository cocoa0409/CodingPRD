  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: invoice_dispute_resolve_cycle
        grounds:
          - state_machines.Invoice.ISSUED_to_DISPUTED
          - state_machines.Invoice.DISPUTED_to_ISSUED
          - entities.Invoice.fields.status
        distinguishing_aspect: "Invoice exhibits a cycle ISSUED->DISPUTED->ISSUED (re-priced); the same invoice returns to ISSUED with recomputed totals — a revision loop, not a linear pipeline."
        test_recipe:
          setup:
            - "ACTIVE RESIDENTIAL account with one ACTIVE TRASH plan base 2000; an ISSUED invoice with no weight/contam/credit (total 2000)."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "11 Birch St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65, tare_weight_lbs: 0 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /service-plans"
              payload: { account_id: "${acct_id}", stream: "TRASH", frequency: "WEEKLY", base_monthly_fee_cents: 2000 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { acct_v: $.data.version }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: Billing
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: Billing
            - call: "POST /invoices/${inv_id}/dispute"
              payload: {}
              as: ResidentAccount
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /invoices/${inv_id}/resolve"
              payload: {}
              as: Billing
              captures: { st: $.data.status }
          assert:
            - "Invoice.${inv_id}.status == ISSUED"
            - "Invoice.${inv_id}.total_cents == 2000"
      - name: special_pickup_branch_approve_vs_reject
        grounds:
          - state_machines.SpecialPickup.REQUESTED_to_APPROVED
          - state_machines.SpecialPickup.REQUESTED_to_REJECTED
          - entities.SpecialPickup.fields.status
        distinguishing_aspect: "SpecialPickup forks at REQUESTED into APPROVED (sets quoted_fee_cents) or REJECTED (no fee, terminal) — branching with divergent side-effect sets per branch, on a different entity than Invoice."
        test_recipe:
          setup:
            - "ACTIVE account with two REQUESTED BULK special pickups."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "13 Cedar St", rate_class: "RESIDENTIAL" }
