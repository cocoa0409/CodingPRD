      - name: access_request_cannot_begin_screening_while_series_suspended
        grounds:
          - validations[priority=25]
          - errors.ERR_SERIES_DISPOSITION_SUSPENDED
          - state_machines.AccessRequest.SUBMITTED_to_SCREENING
          - entities.RecordSeries.fields.disposition_state
        distinguishing_aspect: |
          Entity pair AccessRequest -> RecordSeries: the request itself is in a perfectly
          legal SUBMITTED state and every field on it validates, yet screening is
          refused solely because a THIRD entity (the LegalHold) has driven its governing
          series to SUSPENDED. The dependency is read two hops away from the endpoint's
          own resource. Distinct from the MigrationJob -> StorageZone and
          DeaccessionProposal -> ExhibitLoan pairs used by the partner instances.
        test_recipe:
          setup:
            - "A RecordSeries whose LegalHold has already been activated, so disposition_state == SUSPENDED and legal_hold_active == true."
            - "One processed ArchivalItem under that series."
            - "An AccessRequest created AFTER the hold activation, so it is in SUBMITTED (the activation cascade cannot have touched it) and has no screening yet."
