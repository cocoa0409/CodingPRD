        excluded_because:
          difficulty_instance: transitive_cascade / containment_leak_failure_blocks_level_four_packages
          rationale: "That §1.8 instance fails a containment zone under an L3 and an L4 package at once and asserts only the L4 package moves to BLOCKED while the L3 keeps its own state."

