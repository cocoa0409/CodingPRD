  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: submitter_credential_effective_window_overlap_rejected
        grounds:
          - entities.SubmitterCredential
          - validations.priority_7_business_constraint
        distinguishing_aspect: |
          Interval semantics: half-open [effective_at, expires_at) — two
          credentials on the same provider may not overlap; adjacency (one's
          expires_at == another's effective_at) is PERMITTED because the
          interval is half-open. Resource: SubmitterCredential per provider.
        test_recipe:
          setup:
            - "Provider prov_a ACTIVE."
            - "SubmitterCredential cred_a already exists with effective_at=2026-09-01T00:00:00Z, expires_at=2027-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "Overlap Provider", tax_identification_number: "232323232", national_provider_identifier: "1232323239", billing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { prov_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials"
              payload: { submitter_id: "SUB-OV1", trading_partner_agreement_ref: "TPA-OV1", effective_at: "2026-09-01T00:00:00Z", expires_at: "2027-09-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { cred_a: $.data.id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials/${cred_a}/submit"
              payload: {}
              as: ProviderAdmin
              as_user_id: "${prov_a}"
            - call: "POST /clearinghouse/providers/${prov_a}/activate"
              payload: {}
              as: ClearinghouseOps
          trigger:
            - call: "POST /clearinghouse/providers/${prov_a}/credentials"
              payload: { submitter_id: "SUB-OV2", trading_partner_agreement_ref: "TPA-OV2", effective_at: "2027-06-01T00:00:00Z", expires_at: "2028-06-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { err_id_overlap: $.data.error_id }
            - call: "POST /clearinghouse/providers/${prov_a}/credentials"
              payload: { submitter_id: "SUB-OV3", trading_partner_agreement_ref: "TPA-OV3", effective_at: "2027-09-01T00:00:00Z", expires_at: "2028-09-01T00:00:00Z" }
              as: ProviderAdmin
              as_user_id: "${prov_a}"
              captures: { cred_b: $.data.id }
          assert:
            - "overlapping interval [2027-06-01, 2028-06-01) vs existing [2026-09-01, 2027-09-01): the response status is 400 and error_id_overlap == ERR_INVALID_REQUEST"
            - "adjacent interval [2027-09-01, 2028-09-01) touches but does not overlap [2026-09-01, 2027-09-01): the response status is 201 (half-open semantics permit adjacency)"
            - "SubmitterCredential.${cred_b}.effective_at == \"2027-09-01T00:00:00Z\""

      - name: payer_edit_rule_effective_window_uniqueness
        grounds:
          - entities.PayerEditRule
        distinguishing_aspect: |
          Different interval semantics from credentials: a payer may not have
          two rules with the same rule_code whose effective windows overlap,
          but unlike credentials this is enforced at rule-create time against
          OPEN-ENDED (effective_to=null) rules as a special case — an open-ended
          rule conflicts with ANY later rule carrying the same code regardless
          of start date. Different resource (PayerEditRule per payer) and
          different semantics (unbounded-interval handling).
        test_recipe:
          setup:
            - "Payer pay_a exists."
            - "PayerEditRule rule_code='DX_REQUIRED' with effective_from=2026-01-01T00:00:00Z, effective_to=null (open-ended)."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/payers"
              payload: { payer_id_code: "PAYER", display_name: "Edit Rule Payer", claims_lead_time_days: 5, remittance_lead_time_days: 5, eligibility_lead_time_seconds: 60, pricing_model: "PROVIDER_FUNDED", monthly_minimum_cents: 0 }
              as: ClearinghouseOps
              captures: { pay_a: $.data.id }
            - call: "POST /clearinghouse/payers/${pay_a}/edit-rules"
              payload: { rule_code: "DX_REQUIRED", applies_to: "CLAIM_INTAKE", severity: "ERROR", expression: "diagnosis_codes.nonempty", effective_from: "2026-01-01T00:00:00Z" }
              as: ClearinghouseOps
              captures: { rule_a: $.data.id }
          trigger:
            - call: "POST /clearinghouse/payers/${pay_a}/edit-rules"
              payload: { rule_code: "DX_REQUIRED", applies_to: "CLAIM_INTAKE", severity: "WARNING", expression: "diagnosis_codes.size <= 12", effective_from: "2027-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z" }
              as: ClearinghouseOps
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "the open-ended existing rule conflicts with any later rule of the same code, even one whose [2027-01-01, 2027-12-31) window does not geometrically overlap the [2026-01-01, ∞) interval in the closed-interval sense"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: claim_rejection_conserves_provider_submission_count
        grounds:
          - state_machines.Claim.transitions.VALIDATING_to_REJECTED_CLEARINGHOUSE
          - entities.Claim.fields.acceptance_status
        distinguishing_aspect: |
          Conserved quantity: provider's total submissions. For every claim
          intake that reaches VALIDATING, exactly one of (accepted | rejected)
          results; the conserved invariant is
            claims_submitted == claims_accepted + claims_rejected_clearinghouse
          Claim intake that fails payer-edit ERROR rules conserves the count
          by transitioning to REJECTED_CLEARINGHOUSE (not vanishing).
        test_recipe:
          setup:
            - "Provider prov_a ACTIVE with credential; Payer pay_a with APPROVED CLAIMS_837 enrollment."
            - "Payer has a PayerEditRule rule_code='DX_REQUIRED', severity=ERROR, expression='diagnosis_codes.nonempty'."
            - "Two claims are submitted: one passes edits, one fails."
          setup_api_calls:
            - call: "POST /clearinghouse/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseOps
            - call: "POST /clearinghouse/providers"
              payload: { legal_name: "Invariant Provider", tax_identification_number: "343434343", national_provider_identifier: "1343434348", billing_model: "PROVIDER_FUNDED" }
              as: ClearinghouseOps
              captures: { prov_a: $.data.id }
