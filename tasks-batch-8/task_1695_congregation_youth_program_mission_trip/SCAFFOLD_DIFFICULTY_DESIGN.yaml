# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 9 rules x 2-3 instances = 25 instances. All numeric asserts precomputed.
# Canonical fixtures: clock default 2026-08-01T00:00:00Z; operator ids
# director-1 / leader-1 / treasurer-1 / reviewer-1 / guardian-N; Trip Alpha =
# INTERNATIONAL 2027-06-15..2027-06-25, base 200000, deposit 50000, ratio 5,
# cap 30, reg window 2026-08-01..2026-12-01, deposit_due 2027-01-15T00:00:00Z,
# final_due 2027-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: cost_share_provisional_vs_final_at_lock
        grounds:
          - calculations.provisional_cost_share
          - calculations.final_cost_share
          - state_machines.Trip.REGISTRATION_CLOSED_to_ROSTER_LOCKED
          - entities.Registration.fields.provisional_cost_share_cents
          - entities.Registration.fields.final_cost_share_cents
        distinguishing_aspect: |
          Same lodging data (90300 cents total) priced two ways on the Registration/Trip
          cost domain: provisional divides by PLANNED capacity_youth (30) giving 203010;
          final divides by ACTUAL confirmed headcount (3) giving 230100 — a 27090-cent
          divergence, and a registration that was PAID_IN_FULL on the provisional basis
          is downgraded to PARTIALLY_PAID by the lock.
        test_recipe:
          setup:
            - "Trip Alpha with 3 CONFIRMED registrations; lodging 3 rooms x 30100 = 90300 total; 1 CONFIRMED LEAD chaperone (ratio need ceil(3/5)=1); reg1 paid 203010 (full provisional -> PAID_IN_FULL), reg2/reg3 paid 50000 deposits"
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2026", ministry_year: "2026-2027", scholarship_fund_total_cents: 500000, code_of_conduct_text: "CoC v1", discipline_policy_text: "DP v1"}, as: ProgramDirector, captures: {prog_id: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol v1"}, as: ProgramDirector, captures: {trip_id: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/lodging-reservations", payload: {site_name: "host", room_code: "R1", check_in_date: "2027-06-15", check_out_date: "2027-06-25", room_capacity: 8, cost_cents: 30100}, as: TripLeader }
            - { call: "POST /youth-ministry/trips/${trip_id}/lodging-reservations", payload: {site_name: "host", room_code: "R2", check_in_date: "2027-06-15", check_out_date: "2027-06-25", room_capacity: 8, cost_cents: 30100}, as: TripLeader }
            - { call: "POST /youth-ministry/trips/${trip_id}/lodging-reservations", payload: {site_name: "host", room_code: "R3", check_in_date: "2027-06-15", check_out_date: "2027-06-25", room_capacity: 8, cost_cents: 30100}, as: TripLeader }
            - { call: "POST /youth-ministry/trips/${trip_id}/open-registration", as: ProgramDirector }
            - { call: "POST /youth-ministry/chaperones", payload: {program_id: "${prog_id}", first_name: "Ada", last_name: "Lead", email: "ada@x.org", phone: "555-1"}, as: ProgramDirector, captures: {chap_id: $.data.id} }
            - { call: "POST /youth-ministry/chaperones/${chap_id}/background-checks", payload: {}, as: ProgramDirector, captures: {bc_id: $.data.id} }
            - { call: "POST /youth-ministry/background-checks/${bc_id}/advance", payload: {to_status: "SCREENING"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/background-checks/${bc_id}/advance", payload: {to_status: "CLEARED"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/chaperone-assignments", payload: {trip_id: "${trip_id}", chaperone_id: "${chap_id}", role: "LEAD"}, as: ProgramDirector, captures: {asg_id: $.data.id} }
            - { call: "POST /youth-ministry/chaperone-assignments/${asg_id}/respond", payload: {decision: "ACCEPT"}, as: Chaperone, as_user_id: "${chap_id}" }
            # --- reg1: pays full provisional 203010 ---
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog_id}", family_key: "fam-1", first_name: "P", last_name: "One", birth_date: "2011-03-01", grade: 10, annual_income_bracket: "BAND_B", household_size: 4}, as: Guardian, as_user_id: "guardian-1", captures: {p1_id: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip_id}", participant_id: "${p1_id}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {reg1_id: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1_id}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G One", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cf1a: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1_id}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G One", signed_at: "2026-08-02T10:01:00Z", medical_notes: "none"}, as: Guardian, as_user_id: "guardian-1", captures: {cf1b: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg1_id}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G One", signed_at: "2026-08-02T10:02:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cf1c: $.data.id} }
            - { call: "POST /youth-ministry/consent-forms/${cf1a}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cf1b}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cf1c}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg1_id}/submit", as: Guardian, as_user_id: "guardian-1" }
            - { call: "POST /youth-ministry/registrations/${reg1_id}/review", payload: {decision: "APPROVE"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg1_id}/payments", payload: {amount_cents: 203010, method: "CARD_ONLINE"}, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "POST /youth-ministry/registrations/${reg1_id}/confirm", as: ProgramDirector, as_user_id: "director-1" }
            # --- reg2 ---
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog_id}", family_key: "fam-2", first_name: "P", last_name: "Two", birth_date: "2011-05-01", grade: 10, annual_income_bracket: "BAND_C", household_size: 3}, as: Guardian, as_user_id: "guardian-2", captures: {p2_id: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip_id}", participant_id: "${p2_id}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-2", captures: {reg2_id: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg2_id}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G Two", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-2", captures: {cf2a: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg2_id}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G Two", signed_at: "2026-08-02T10:01:00Z", medical_notes: "none"}, as: Guardian, as_user_id: "guardian-2", captures: {cf2b: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg2_id}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G Two", signed_at: "2026-08-02T10:02:00Z"}, as: Guardian, as_user_id: "guardian-2", captures: {cf2c: $.data.id} }
            - { call: "POST /youth-ministry/consent-forms/${cf2a}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cf2b}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cf2c}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg2_id}/submit", as: Guardian, as_user_id: "guardian-2" }
            - { call: "POST /youth-ministry/registrations/${reg2_id}/review", payload: {decision: "APPROVE"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg2_id}/payments", payload: {amount_cents: 50000, method: "CHECK"}, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "POST /youth-ministry/registrations/${reg2_id}/confirm", as: ProgramDirector, as_user_id: "director-1" }
            # --- reg3 ---
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog_id}", family_key: "fam-3", first_name: "P", last_name: "Three", birth_date: "2012-01-01", grade: 9, annual_income_bracket: "BAND_D", household_size: 2}, as: Guardian, as_user_id: "guardian-3", captures: {p3_id: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip_id}", participant_id: "${p3_id}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-3", captures: {reg3_id: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg3_id}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G Three", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-3", captures: {cf3a: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg3_id}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G Three", signed_at: "2026-08-02T10:01:00Z", medical_notes: "none"}, as: Guardian, as_user_id: "guardian-3", captures: {cf3b: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg3_id}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G Three", signed_at: "2026-08-02T10:02:00Z"}, as: Guardian, as_user_id: "guardian-3", captures: {cf3c: $.data.id} }
            - { call: "POST /youth-ministry/consent-forms/${cf3a}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cf3b}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cf3c}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg3_id}/submit", as: Guardian, as_user_id: "guardian-3" }
            - { call: "POST /youth-ministry/registrations/${reg3_id}/review", payload: {decision: "APPROVE"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg3_id}/payments", payload: {amount_cents: 50000, method: "CASH"}, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "POST /youth-ministry/registrations/${reg3_id}/confirm", as: ProgramDirector, as_user_id: "director-1" }
            # --- observe provisional basis, then lock ---
            - { call: "GET /youth-ministry/registrations/${reg1_id}", as: ProgramDirector, captures: {reg1_prov: $.data.provisional_cost_share_cents, reg1_pay_status_pre: $.data.payment_status} }
            - { call: "POST /youth-ministry/trips/${trip_id}/close-registration", as: ProgramDirector }
          trigger:
            - { call: "POST /youth-ministry/trips/${trip_id}/lock-roster", as: ProgramDirector, as_user_id: "director-1" }
          assert:
            - "pre-lock capture reg1_prov == 203010 and reg1_pay_status_pre == PAID_IN_FULL"
            - "Registration.${reg1_id}.final_cost_share_cents == 230100 (90300/3 = 12900 exactly, zero remainder)"
            - "Registration.${reg2_id}.final_cost_share_cents == 230100 and Registration.${reg3_id}.final_cost_share_cents == 230100"
            - "Registration.${reg1_id}.payment_status == PARTIALLY_PAID after lock (covered 203010 < 230100) — downgraded from PAID_IN_FULL purely by the variant switch"
            - "Trip.${trip_id}.status == ROSTER_LOCKED and final - provisional == 27090 on identical lodging data"

      - name: fundraising_gross_progress_vs_net_credit
        grounds:
          - calculations.fundraising_positions
          - calculations.donation_fee
          - entities.FundraisingAccount.fields.raised_gross_cents
          - entities.FundraisingAccount.fields.raised_net_cents
        distinguishing_aspect: |
          Fundraising domain (distinct from the cost-share domain of the sibling
          instance): identical donation set yields goal progress on the GROSS basis
          (35000 >= goal 30000 -> goal_met true) while the creditable balance uses
          the NET basis (34655 after 345 of channel fees) — donor-facing progress
          and balance credit diverge by exactly the fee total.
        test_recipe:
          setup:
            - "Registration (APPROVED) with fundraising goal 30000; account receives CARD_ONLINE 10000 (fee 320), CASH 5000 (fee 0), CHECK 20000 (fee 25)"
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2026", ministry_year: "2026-2027", scholarship_fund_total_cents: 500000, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog_id: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {trip_id: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/open-registration", as: ProgramDirector }
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog_id}", family_key: "fam-1", first_name: "P", last_name: "One", birth_date: "2011-03-01", grade: 10, annual_income_bracket: "BAND_B", household_size: 4}, as: Guardian, as_user_id: "guardian-1", captures: {p1_id: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip_id}", participant_id: "${p1_id}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 30000}, as: Guardian, as_user_id: "guardian-1", captures: {reg_id: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg_id}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G One", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfa: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg_id}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G One", signed_at: "2026-08-02T10:01:00Z", medical_notes: "none"}, as: Guardian, as_user_id: "guardian-1", captures: {cfb: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${reg_id}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G One", signed_at: "2026-08-02T10:02:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfc: $.data.id} }
            - { call: "POST /youth-ministry/consent-forms/${cfa}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cfb}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/consent-forms/${cfc}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "POST /youth-ministry/registrations/${reg_id}/submit", as: Guardian, as_user_id: "guardian-1" }
            - { call: "POST /youth-ministry/registrations/${reg_id}/review", payload: {decision: "APPROVE"}, as: ProgramDirector, as_user_id: "director-1" }
            - { call: "GET /youth-ministry/registrations/${reg_id}/fundraising-account", as: Treasurer, captures: {acct_id: "$.data[0].id"} }
            - { call: "POST /youth-ministry/fundraising-accounts/${acct_id}/donations", payload: {donor_name: "D1", amount_cents: 10000, channel: "CARD_ONLINE"}, as: Treasurer, as_user_id: "treasurer-1", captures: {don1: $.data.id} }
            - { call: "POST /youth-ministry/fundraising-accounts/${acct_id}/donations", payload: {donor_name: "D2", amount_cents: 5000, channel: "CASH"}, as: Treasurer, as_user_id: "treasurer-1" }
            - { call: "POST /youth-ministry/fundraising-accounts/${acct_id}/donations", payload: {donor_name: "D3", amount_cents: 20000, channel: "CHECK"}, as: Treasurer, as_user_id: "treasurer-1" }
          trigger:
            - { call: "GET /youth-ministry/fundraising-accounts/${acct_id}", as: Treasurer, as_user_id: "treasurer-1" }
          assert:
            - "Donation.${don1}.fee_cents == 320 (round_half_up(0.029*10000)=290 then +30; rounding before flat addition)"
            - "FundraisingAccount.${acct_id}.raised_gross_cents == 35000 (gross variant)"
            - "FundraisingAccount.${acct_id}.fee_total_cents == 345 and raised_net_cents == 34655 (net variant)"
            - "FundraisingAccount.${acct_id}.goal_met == true (35000 >= 30000 on GROSS) while available_credit_cents == 34655 (NET) — same data, two valid bases, 345-cent divergence"

  - rule_id: combinatorial_formula
    instances:
      - name: final_cost_share_round_then_sum_waterfall
        grounds:
          - calculations.final_cost_share
          - state_machines.Trip.REGISTRATION_CLOSED_to_ROSTER_LOCKED
        distinguishing_aspect: |
          MODE (b) nested rounding: lodging 100001 over N=3 — pinned order is
          round-then-sum (per-person share round_half_up(100001/3)=33334, sum 100002,
          remainder -1 cent waterfalled to the earliest-created CONFIRMED
          registration). The rejected sum-then-round reading would charge every
          participant 33334 and strand -1 cent unallocated with no owner.
        test_recipe:
          setup:
            - "Trip Alpha variant: capacity 30, base 200000, one lodging room cost 100001 with 30 beds; 3 CONFIRMED registrations created in order regA < regB < regC (created_at ASC); 1 CONFIRMED LEAD chaperone"
          setup_api_calls:
            - { call: "POST /youth-ministry/programs", payload: {name: "Youth 2026", ministry_year: "2026-2027", scholarship_fund_total_cents: 500000, code_of_conduct_text: "CoC", discipline_policy_text: "DP"}, as: ProgramDirector, captures: {prog_id: $.data.id} }
            - { call: "POST /youth-ministry/trips", payload: {program_id: "${prog_id}", name: "Alpha", destination_name: "Lima", destination_type: "INTERNATIONAL", start_date: "2027-06-15", end_date: "2027-06-25", capacity_youth: 30, base_cost_cents: 200000, deposit_cents: 50000, chaperone_ratio: 5, registration_open_at: "2026-08-01T00:00:00Z", registration_close_at: "2026-12-01T00:00:00Z", deposit_due_at: "2027-01-15T00:00:00Z", final_payment_due_at: "2027-05-01T00:00:00Z", emergency_protocol_text: "Protocol"}, as: ProgramDirector, captures: {trip_id: $.data.id} }
            - { call: "POST /youth-ministry/trips/${trip_id}/lodging-reservations", payload: {site_name: "host", room_code: "BIG", check_in_date: "2027-06-15", check_out_date: "2027-06-25", room_capacity: 30, cost_cents: 100001}, as: TripLeader }
            - { call: "POST /youth-ministry/trips/${trip_id}/open-registration", as: ProgramDirector }
            - { call: "POST /youth-ministry/chaperones", payload: {program_id: "${prog_id}", first_name: "Ada", last_name: "Lead", email: "ada@x.org", phone: "555-1"}, as: ProgramDirector, captures: {chap_id: $.data.id} }
            - { call: "POST /youth-ministry/chaperones/${chap_id}/background-checks", payload: {}, as: ProgramDirector, captures: {bc_id: $.data.id} }
            - { call: "POST /youth-ministry/background-checks/${bc_id}/advance", payload: {to_status: "SCREENING"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/background-checks/${bc_id}/advance", payload: {to_status: "CLEARED"}, as: ProgramDirector }
            - { call: "POST /youth-ministry/chaperone-assignments", payload: {trip_id: "${trip_id}", chaperone_id: "${chap_id}", role: "LEAD"}, as: ProgramDirector, captures: {asg_id: $.data.id} }
            - { call: "POST /youth-ministry/chaperone-assignments/${asg_id}/respond", payload: {decision: "ACCEPT"}, as: Chaperone, as_user_id: "${chap_id}" }
            # regA (earliest created)
            - { call: "POST /youth-ministry/participants", payload: {program_id: "${prog_id}", family_key: "fam-a", first_name: "A", last_name: "One", birth_date: "2011-01-01", grade: 10, annual_income_bracket: "BAND_B", household_size: 3}, as: Guardian, as_user_id: "guardian-1", captures: {pa_id: $.data.id} }
            - { call: "POST /youth-ministry/registrations", payload: {trip_id: "${trip_id}", participant_id: "${pa_id}", insurance_tier: "INTERNATIONAL", fundraising_goal_cents: 0}, as: Guardian, as_user_id: "guardian-1", captures: {rega_id: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${rega_id}/consent-forms", payload: {form_type: "PARENTAL_CONSENT", signed_by_name: "G A", signed_at: "2026-08-02T10:00:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfa1: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${rega_id}/consent-forms", payload: {form_type: "MEDICAL_RELEASE", signed_by_name: "G A", signed_at: "2026-08-02T10:01:00Z", medical_notes: "none"}, as: Guardian, as_user_id: "guardian-1", captures: {cfa2: $.data.id} }
            - { call: "POST /youth-ministry/registrations/${rega_id}/consent-forms", payload: {form_type: "CONDUCT_AGREEMENT", signed_by_name: "G A", signed_at: "2026-08-02T10:02:00Z"}, as: Guardian, as_user_id: "guardian-1", captures: {cfa3: $.data.id} }
            - { call: "POST /youth-ministry/consent-forms/${cfa1}/review", payload: {decision: "VERIFY"}, as: ProgramDirector, as_user_id: "director-1" }
