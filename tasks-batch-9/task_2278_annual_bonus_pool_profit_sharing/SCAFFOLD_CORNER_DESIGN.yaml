            - "H1 reversal while H2 posted: HTTP 409, error_id == ERR_ACCRUAL_REVERSAL_OUT_OF_ORDER"
            - "H2 reversal: HTTP 200, AccrualPeriod.${per2}.status == REVERSED"
            - "H1 reversal after H2: HTTP 200, AccrualPeriod.${per1}.status == REVERSED"
            - "AccrualPeriod.${per1}.total_period_cents == 2135304"
            - "AccrualPeriod.${per1}.burden_rate_pct == 7.65"
