# =============================================================================
# Scaffold: Mattress Manufacturing & Law-Label Compliance (Serta licensee plant)
# =============================================================================

scenario: |
  Mattress Manufacturing & Law-Label Compliance (Serta licensee plant): model/spec build & component BOM,
  foam pour/lot & off-gas cure time, law-label content by state, quilting/panel scheduling & size mix,
  prop-65 & flammability certificate, retailer drop-ship & recycling take-back, comfort-exchange & core
  recovery, warranty by sag depth

domain_name: mattress-law-label
api_prefix: /plant

complexity_profile:
  primary_archetype: compliance_audit          # law labels, flammability certs, Prop 65, segregation of duties
  secondary_archetype: workflow_orchestration  # production order pipeline with guarded steps
  complexity_layers:
    - optimistic_concurrency        # OCC on MattressModel.version and Retailer.version
    - cascading_side_effects        # cert-revoke → model → labels → orders; warranty pay → ledger
    - dual_variant_calculation      # warranty full-replacement vs prorated; recycling provisional vs final
    - version_pinning_on_approval   # LawLabel pins StateLawLabelSpec version at generation
  entity_topology: hybrid           # tree (Model → BOM/Certs/Labels) + flat peers with cross FKs
  state_machine_shape: parallel     # ProductionOrder production_status × fulfillment_status; cycles on FoamBatch
  relationship_patterns:
    - one_to_many
    - cross_aggregate               # Shipment→LawLabel, ProductionOrder→FoamBatch, MattressUnit→LawLabel
    - polymorphic                   # CreditAdjustment.source_id references WarrantyClaim or RecyclingIntake
  role_model: segregation_of_duties # label/cert approval and cure certification barred for the creator
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Retailer
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: retailer_name, type: string, source: input, description: "Retailer legal name" }
      - { name: drop_ship_enabled, type: boolean, source: input, description: "Whether retailer may place DROP_SHIP orders" }
      - { name: recycling_enrolled, type: boolean, source: input, description: "Whether retailer is enrolled in the recycling take-back program" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding credit balance in cents; credit_balance_cents may never exceed this" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Sum of all CreditAdjustment.amount_cents for this retailer; maintained on every adjustment" }

  - name: CreditAdjustment
    parent: Retailer
    common_fields: false  # append-only ledger entry: id + created_at only
    fields:
      - { name: retailer_id, type: string, source: system, description: "FK -> Retailer.id" }
      - { name: amount_cents, type: integer, source: input, description: "Signed credit amount; positive grants credit, negative claws back" }
      - { name: reason, type: string, source: input, description: "Free-text reason for manual adjustments; system text for cascaded ones" }
      - { name: source, type: enum, source: system, description: "MANUAL | WARRANTY_PAYOUT | RECYCLING_PROVISIONAL | RECYCLING_FINAL_DELTA | EXCHANGE_RECOVERY" }
      - { name: source_id, type: string, source: system, description: "Id of originating WarrantyClaim or RecyclingIntake for cascaded adjustments; null for MANUAL" }

  - name: MattressModel
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Plant model code (e.g. SRT-PLUSH-QN); unique across all models" }
      - { name: quilt_pattern, type: string, source: input, description: "Quilting pattern identifier used by panel scheduling" }
      - { name: bom_cost_cents, type: integer, source: computed, description: "Sum of per-line rounded BOM line costs; recomputed on every BomLine create/update (see bom_material_cost)" }
      - { name: status, type: enum, source: system, description: "DRAFT → CERT_REVIEW → CERTIFIED → ACTIVE → DISCONTINUED; CERT_REVIEW → DRAFT revert; CERTIFIED|ACTIVE → CERT_REVIEW on certificate revoke cascade" }

  - name: BomLine
    parent: MattressModel
    common_fields: true
    fields:
      - { name: model_id, type: string, source: system, description: "FK -> MattressModel.id" }
      - { name: component_type, type: enum, source: input, description: "FOAM_CORE | MEMORY_LAYER | FIRE_BARRIER | TICKING | QUILT_PANEL | FOUNDATION | THREAD" }
      - { name: material_code, type: string, source: input, description: "Supplier material code" }
      - { name: quantity_per_unit, type: number, source: input, description: "Quantity consumed per finished mattress unit; may be fractional; must be > 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Cost per unit of material in cents; must be >= 0" }
      - { name: filling_content_code, type: string, source: input, description: "Law-label filling content code (e.g. PU_FOAM_62, POLY_FIBER_18); required iff component_type is a filling type (FOAM_CORE, MEMORY_LAYER, FIRE_BARRIER, TICKING)", default: null }
      - { name: line_cost_cents, type: integer, source: computed, description: "round_half_up(quantity_per_unit * unit_cost_cents); the per-line rounded value that bom_material_cost sums" }

  - name: ComplianceCertificate
    parent: MattressModel
    common_fields: true
    fields:
      - { name: model_id, type: string, source: system, description: "FK -> MattressModel.id" }
      - { name: cert_type, type: enum, source: input, description: "FLAMMABILITY_16CFR1633 | PROP65_CA | TB117" }
      - { name: jurisdiction_state_code, type: string, source: input, description: "2-letter US state code the certificate covers; FLAMMABILITY_16CFR1633 is federal and uses state code US" }
      - { name: issued_on, type: datetime, source: input, description: "ISO8601 issue timestamp" }
      - { name: expires_on, type: datetime, source: input, description: "ISO8601 expiry timestamp; must be strictly after issued_on" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who created the certificate" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving ComplianceOfficer; null until APPROVED" }
      - { name: status, type: enum, source: system, description: "SUBMITTED → APPROVED → REVOKED | EXPIRED (EXPIRED set automatically when the logical clock passes expires_on)" }

  - name: StateLawLabelSpec
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "2-letter US state code this spec governs" }
      - { name: filling_content_codes, type: array, source: input, description: "Ordered list of filling content codes the label must declare" }
      - { name: required_phrases, type: array, source: input, description: "Ordered list of statutory phrases that must appear verbatim on the label" }
      - { name: prop65_warning_required, type: boolean, source: input, description: "Whether the California Prop 65 warning block must be printed" }
      - { name: status, type: enum, source: system, description: "DRAFT → PUBLISHED → SUPERSEDED (SUPERSEDED set automatically when another spec for the same state_code is published)" }

  - name: LawLabel
    parent: MattressModel
    common_fields: true
    fields:
      - { name: model_id, type: string, source: system, description: "FK -> MattressModel.id" }
      - { name: spec_id, type: string, source: system, description: "FK -> StateLawLabelSpec.id; pinned at generation to the spec PUBLISHED for state_code at that moment" }
      - { name: spec_version, type: integer, source: computed, description: "Version of StateLawLabelSpec pinned at generation time; never changes afterwards" }
      - { name: state_code, type: string, source: input, description: "2-letter destination state this label is valid for" }
      - { name: content_text, type: string, source: computed, description: "Rendered label content: spec.required_phrases joined in order, then the intersection of spec.filling_content_codes with the model BOM's filling_content_codes in BOM line creation order (created_at ASC), then the Prop 65 warning block iff spec.prop65_warning_required" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the ComplianceOfficer who generated the label" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of the approving ComplianceOfficer; null until APPROVED" }
      - { name: status, type: enum, source: system, description: "GENERATED → APPROVED → ACTIVE → SUPERSEDED; GENERATED → REJECTED; SUPERSEDED set automatically when another label for the same model+state is activated or when a certificate revoke cascade hits" }

  - name: FoamBatch
    parent: null
    common_fields: true
    fields:
      - { name: foam_density_class, type: enum, source: input, description: "STANDARD | HIGH_DENSITY | MEMORY; selects base cure hours (24 / 48 / 72)" }
      - { name: poured_mass_kg, type: number, source: input, description: "Total mass poured in this lot; must be > 0" }
      - { name: available_mass_kg, type: number, source: computed, description: "Mass not reserved/consumed/scrapped; initialized to poured_mass_kg" }
      - { name: reserved_mass_kg, type: number, source: computed, description: "Mass reserved by MATERIAL_ALLOCATED production orders; initialized to 0" }
      - { name: consumed_mass_kg, type: number, source: computed, description: "Mass consumed by started production orders; initialized to 0" }
      - { name: scrapped_mass_kg, type: number, source: computed, description: "Mass written off when a QUARANTINED batch is scrapped; initialized to 0" }
      - { name: chamber_id, type: string, source: input, description: "Cure chamber identifier; capacity-limited resource (max 3 CURING batches with overlapping estimated windows)" }
      - { name: cure_started_at, type: datetime, source: system, description: "Logical-clock timestamp of the latest CURING entry; null until first start-cure" }
      - { name: cure_eligible_at, type: datetime, source: computed, description: "cure_started_at + base_cure_hours(foam_density_class) + ambient temp adjustment; extended by +12h on each QUARANTINED → CURING re-cure" }
      - { name: cure_cycles, type: integer, source: computed, description: "Number of times the batch has entered CURING; starts at 0, +1 per start-cure/release-to-cure" }
      - { name: poured_by_user_id, type: string, source: system, description: "X-User-ID of the LineSupervisor who poured the batch" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of the QcInspector who certified cure completion; must differ from poured_by_user_id" }
      - { name: status, type: enum, source: system, description: "POURED → CURING → CURED → CONSUMED; CURING ↔ QUARANTINED re-cure cycle; QUARANTINED → SCRAPPED" }

  - name: QuiltRun
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ProductionOrder.id; the order these panels are quilted for" }
      - { name: machine_id, type: string, source: input, description: "Quilting machine identifier; pairwise-exclusive resource" }
      - { name: size, type: enum, source: input, description: "TWIN | FULL | QUEEN | KING | CAL_KING" }
      - { name: start_at, type: datetime, source: input, description: "ISO8601 window start; must be strictly before end_at" }
      - { name: end_at, type: datetime, source: input, description: "ISO8601 window end (exclusive); half-open interval semantics" }
      - { name: status, type: enum, source: system, description: "SCHEDULED → RUNNING → COMPLETE; SCHEDULED → CANCELLED" }

  - name: ProductionOrder
    parent: null
    common_fields: true
    fields:
      - { name: model_id, type: string, source: input, description: "FK -> MattressModel.id; model must be ACTIVE at creation" }
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id" }
      - { name: destination_state_code, type: string, source: input, description: "2-letter US state the mattresses ship to; drives law-label requirement" }
      - { name: quantity, type: integer, source: input, description: "Units to build; must be >= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Wholesale price per unit; must be > 0" }
      - { name: foam_mass_required_kg, type: number, source: input, description: "Foam mass to reserve from a FoamBatch at allocation; must be > 0" }
      - { name: ship_method, type: enum, source: input, description: "WAREHOUSE | DROP_SHIP; DROP_SHIP requires retailer.drop_ship_enabled" }
      - { name: foam_batch_id, type: string, source: system, description: "FK -> FoamBatch.id; set at allocate-materials" }
      - { name: subtotal_cents, type: integer, source: computed, description: "quantity * unit_price_cents" }
      - { name: compliance_fee_cents, type: integer, source: computed, description: "Tiered fee keyed on subtotal_cents (see order_compliance_fee)" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + compliance_fee_cents (evaluation order pinned: subtotal → fee → total)" }
      - { name: production_status, type: enum, source: system, description: "PLANNED → MATERIAL_ALLOCATED → IN_PRODUCTION → QC_PENDING → COMPLETE; QC_PENDING ↔ QC_HOLD; PLANNED|MATERIAL_ALLOCATED → CANCELLED" }
      - { name: fulfillment_status, type: enum, source: system, description: "UNFULFILLED → PARTIALLY_SHIPPED → FULLY_SHIPPED → DELIVERED; independent parallel dimension recomputed on shipment dispatch/deliver" }

  - name: MattressUnit
    parent: null
    common_fields: true
    fields:
      - { name: serial_no, type: string, source: system, description: "Server-assigned serial number, sequential per order (e.g. <order_seq>-0001)" }
      - { name: order_id, type: string, source: system, description: "FK -> ProductionOrder.id" }
      - { name: model_id, type: string, source: system, description: "FK -> MattressModel.id; copied from the order at manufacture" }
      - { name: retailer_id, type: string, source: system, description: "FK -> Retailer.id; copied from the order at manufacture" }
      - { name: foam_batch_id, type: string, source: system, description: "FK -> FoamBatch.id; batch that supplied the foam" }
      - { name: law_label_id, type: string, source: system, description: "FK -> LawLabel.id; the ACTIVE label for (model, destination_state) captured at manufacture time" }
      - { name: purchase_price_cents, type: integer, source: system, description: "Copied from ProductionOrder.unit_price_cents at manufacture; basis for warranty credit" }
      - { name: delivered_at, type: datetime, source: system, description: "Logical-clock timestamp when the carrying shipment was delivered; null until DELIVERED" }
      - { name: status, type: enum, source: system, description: "MANUFACTURED → SHIPPED → DELIVERED → RETURNED → RECOVERED | SCRAPPED; RETURNED → DELIVERED on rejected return" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> ProductionOrder.id" }
      - { name: retailer_id, type: string, source: system, description: "FK -> Retailer.id; copied from the order" }
      - { name: destination_state_code, type: string, source: system, description: "Copied from the order; law label must be ACTIVE for (order.model_id, this state)" }
      - { name: unit_ids, type: array, source: input, description: "Explicit list of MattressUnit ids to ship; must be non-empty, all MANUFACTURED, all belonging to order_id" }
      - { name: status, type: enum, source: system, description: "CREATED → DISPATCHED → DELIVERED" }

  - name: ReturnRequest
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> MattressUnit.id; unit must be DELIVERED and owned by the requesting retailer" }
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id; must equal the unit's retailer and the caller's X-User-ID when the caller is a Retailer" }
      - { name: reason, type: enum, source: input, description: "COMFORT_EXCHANGE | DEFECT; COMFORT_EXCHANGE enforces the 100-night comfort window" }
      - { name: measured_sag_inches, type: number, source: input, description: "Sag depth measured at inspection; recorded by the inspect action" }
      - { name: resolution, type: enum, source: system, description: "EXCHANGE | RECYCLE | REJECT; set by resolve" }
      - { name: replacement_unit_id, type: string, source: system, description: "FK -> MattressUnit.id; the replacement unit created when resolution is EXCHANGE; null otherwise" }
      - { name: status, type: enum, source: system, description: "REQUESTED → RECEIVED → INSPECTED → RESOLVED_EXCHANGE | RESOLVED_RECYCLED | REJECTED" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: unit_id, type: string, source: input, description: "FK -> MattressUnit.id; unit must be DELIVERED" }
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id; must equal the unit's retailer" }
      - { name: claim_type, type: enum, source: input, description: "SAG_DEFECT | WORKMANSHIP" }
      - { name: measured_sag_inches, type: number, source: input, description: "Measured sag depth; SAG_DEFECT claims require >= 1.5 (boundary inclusive)" }
      - { name: age_months, type: integer, source: computed, description: "Whole 30-day months between unit.delivered_at and the logical clock at approval time" }
      - { name: credit_variant, type: enum, source: computed, description: "FULL_REPLACEMENT (age_months <= 12) | PRORATED (age_months > 12); selected at approval" }
      - { name: credit_cents, type: integer, source: computed, description: "Credit computed per warranty_credit_amount at approval; null until APPROVED" }
      - { name: status, type: enum, source: system, description: "FILED → APPROVED → PAID; FILED → DENIED" }

  - name: RecyclingIntake
    parent: null
    common_fields: true
    fields:
      - { name: retailer_id, type: string, source: input, description: "FK -> Retailer.id; retailer.recycling_enrolled must be true" }
      - { name: unit_id, type: string, source: input, description: "FK -> MattressUnit.id; optional link to a SCRAPPED unit being taken back (core recovery)", default: null }
      - { name: declared_weight_kg, type: number, source: input, description: "Manifest weight at intake; must be > 0; basis of the provisional credit" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "declared_weight_kg * 20 (flat provisional rate), round_half_up" }
      - { name: final_credit_cents, type: integer, source: computed, description: "Per-material weighed credit computed at finalize; null until FINALIZED" }
      - { name: status, type: enum, source: system, description: "RECEIVED → FINALIZED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: MattressModel
    initial_state: DRAFT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: DRAFT
        to: CERT_REVIEW
        trigger: "POST /plant/models/{id}/submit-for-certification"
        actor: PlantManager
        preconditions:
          - "Model has at least one BomLine (ERR_MODEL_HAS_NO_BOM)"
        side_effects: ["increments MattressModel.version by 1"]

      - from: CERT_REVIEW
        to: DRAFT
        trigger: "POST /plant/models/{id}/return-to-draft"
        actor: PlantManager
        preconditions: []
        side_effects: ["increments MattressModel.version by 1"]

      - from: CERT_REVIEW
        to: CERTIFIED
        trigger: "POST /plant/models/{id}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "Model has >= 1 ComplianceCertificate with cert_type FLAMMABILITY_16CFR1633, status APPROVED, expires_on strictly after the logical clock (ERR_CERT_REQUIRED otherwise)"
        side_effects: ["increments MattressModel.version by 1"]

      - from: CERTIFIED
        to: ACTIVE
        trigger: "POST /plant/models/{id}/activate"
        actor: PlantManager
        preconditions: []
        side_effects: ["increments MattressModel.version by 1"]

      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /plant/models/{id}/discontinue"
        actor: PlantManager
        preconditions:
          - "No ProductionOrder for this model with production_status IN {PLANNED, MATERIAL_ALLOCATED, IN_PRODUCTION, QC_PENDING, QC_HOLD} (ERR_OPEN_ORDERS_EXIST)"
        side_effects: ["increments MattressModel.version by 1"]

      - from: CERTIFIED
        to: CERT_REVIEW
        trigger: "system (cascade from POST /plant/models/{id}/certificates/{certId}/revoke when the revoked cert was the last APPROVED unexpired FLAMMABILITY_16CFR1633 cert)"
        actor: system
        preconditions:
          - "Revoked certificate is FLAMMABILITY_16CFR1633 and no other APPROVED unexpired FLAMMABILITY_16CFR1633 certificate remains for the model"
        side_effects:
          - "All LawLabels of this model in GENERATED/APPROVED/ACTIVE → SUPERSEDED (hop 2)"
          - "increments MattressModel.version by 1"

      - from: ACTIVE
        to: CERT_REVIEW
        trigger: "system (cascade from certificate revoke, same rule as CERTIFIED → CERT_REVIEW)"
        actor: system
        preconditions:
          - "Revoked certificate is FLAMMABILITY_16CFR1633 and no other APPROVED unexpired FLAMMABILITY_16CFR1633 certificate remains for the model"
        side_effects:
          - "All LawLabels of this model in GENERATED/APPROVED/ACTIVE → SUPERSEDED (hop 2)"
          - "increments MattressModel.version by 1"

  - entity: ComplianceCertificate
    initial_state: SUBMITTED
    terminal_states: [REVOKED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /plant/models/{id}/certificates/{certId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Approver X-User-ID != certificate.submitted_by_user_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["approved_by_user_id set to approver X-User-ID"]

      - from: APPROVED
        to: REVOKED
        trigger: "POST /plant/models/{id}/certificates/{certId}/revoke"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "If this was the last APPROVED unexpired FLAMMABILITY_16CFR1633 cert: MattressModel CERTIFIED|ACTIVE → CERT_REVIEW (hop 1)"
          - "That model transition supersedes all non-terminal LawLabels of the model (hop 2)"
          - "Each superseded LawLabel puts every ProductionOrder with production_status IN {MATERIAL_ALLOCATED, IN_PRODUCTION, QC_PENDING} and destination_state_code == label.state_code into QC_HOLD (hop 3)"

      - from: APPROVED
        to: EXPIRED
        trigger: "system (automatic when logical clock advances past expires_on; applied lazily on any read/validation touch)"
        actor: system
        preconditions: ["logical clock > expires_on"]
        side_effects:
          - "NO cascade on expiry: existing LawLabels keep their status and units already manufactured remain valid; expiry only blocks NEW shipments via ERR_CERT_EXPIRED and NEW model certifications via ERR_CERT_REQUIRED. Only an explicit revoke cascades."

  - entity: StateLawLabelSpec
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /plant/law-label-specs/{id}/publish"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Any other StateLawLabelSpec with the same state_code in PUBLISHED → SUPERSEDED"
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (automatic when another spec for the same state_code is published)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: LawLabel
    initial_state: GENERATED
    terminal_states: [SUPERSEDED, REJECTED]
    transitions:
      - from: GENERATED
        to: APPROVED
        trigger: "POST /plant/models/{id}/law-labels/{labelId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "Approver X-User-ID != label.created_by_user_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["approved_by_user_id set to approver X-User-ID"]

      - from: GENERATED
        to: REJECTED
        trigger: "POST /plant/models/{id}/law-labels/{labelId}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "Rejector X-User-ID != label.created_by_user_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

      - from: APPROVED
        to: ACTIVE
        trigger: "POST /plant/models/{id}/law-labels/{labelId}/activate"
        actor: ComplianceOfficer
        preconditions:
          - "The pinned StateLawLabelSpec (label.spec_id) is still in PUBLISHED status (ERR_SPEC_SUPERSEDED otherwise)"
          - "MattressModel.status IN {CERTIFIED, ACTIVE} (ERR_MODEL_NOT_CERTIFIED otherwise)"
        side_effects:
          - "Any other LawLabel for the same model_id + state_code in ACTIVE → SUPERSEDED"

      - from: GENERATED
        to: SUPERSEDED
        trigger: "system (certificate revoke cascade on the parent model)"
        actor: system
        preconditions: []
        side_effects:
          - "Every ProductionOrder with production_status IN {MATERIAL_ALLOCATED, IN_PRODUCTION, QC_PENDING} and destination_state_code == this label's state_code → QC_HOLD (hop 3 of the revoke cascade)"

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (certificate revoke cascade on the parent model)"
        actor: system
        preconditions: []
        side_effects: ["same order-hold hop as GENERATED → SUPERSEDED"]

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (another label for same model+state activated, OR certificate revoke cascade)"
        actor: system
        preconditions: []
        side_effects: ["On revoke cascade only: same order-hold hop as GENERATED → SUPERSEDED; on voluntary replacement activation no orders are held"]

  - entity: FoamBatch
    initial_state: POURED
    terminal_states: [CONSUMED, SCRAPPED]
    transitions:
      - from: POURED
        to: CURING
        trigger: "POST /plant/foam-batches/{batchId}/start-cure"
        actor: LineSupervisor
        preconditions:
          - "Chamber aggregate capacity: fewer than 3 other batches in CURING on the same chamber_id whose [cure_started_at, cure_eligible_at) window overlaps this batch's estimated [now, now + cure length) window (ERR_CHAMBER_CAPACITY_EXCEEDED)"
        side_effects:
          - "cure_started_at = logical clock; cure_cycles += 1"
          - "cure_eligible_at computed per cure_eligibility_time using ambient_temp_c input"

      - from: CURING
        to: CURED
        trigger: "POST /plant/foam-batches/{batchId}/certify-cured"
        actor: QcInspector
        preconditions:
          - "logical clock >= cure_eligible_at (inclusive boundary; ERR_CURE_INCOMPLETE otherwise)"
          - "Certifier X-User-ID != batch.poured_by_user_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["certified_by_user_id set to certifier X-User-ID"]

      - from: CURING
        to: QUARANTINED
        trigger: "POST /plant/foam-batches/{batchId}/quarantine"
        actor: QcInspector
        preconditions: []
        side_effects: []

      - from: QUARANTINED
        to: CURING
        trigger: "POST /plant/foam-batches/{batchId}/release-to-cure"
        actor: LineSupervisor
        preconditions: []
        side_effects:
          - "cure_cycles += 1; cure_eligible_at extended by +12 hours (RECURE_PENALTY_HOURS); cure_started_at unchanged"
          - "The re-entering batch does NOT re-run the chamber capacity check against its own previous window (it left CURING at quarantine)"

      - from: QUARANTINED
        to: SCRAPPED
        trigger: "POST /plant/foam-batches/{batchId}/scrap"
        actor: QcInspector
        preconditions: []
        side_effects:
          - "scrapped_mass_kg = available_mass_kg; available_mass_kg = 0 (mass-conservation invariant maintained)"

      - from: CURED
        to: CONSUMED
        trigger: "system (automatic when available_mass_kg == 0 and reserved_mass_kg == 0 after a start-production consumption)"
        actor: system
        preconditions: ["available_mass_kg == 0 AND reserved_mass_kg == 0"]
        side_effects: []

  - entity: QuiltRun
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /plant/quilt-runs/{runId}/start"
        actor: LineSupervisor
        preconditions: ["logical clock >= start_at (ERR_RUN_WINDOW_NOT_REACHED)"]
        side_effects: []
      - from: RUNNING
        to: COMPLETE
        trigger: "POST /plant/quilt-runs/{runId}/complete"
        actor: LineSupervisor
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /plant/quilt-runs/{runId}/cancel"
        actor: LineSupervisor
        preconditions: []
        side_effects: []

  - entity: ProductionOrder
    initial_state: "production_status=PLANNED, fulfillment_status=UNFULFILLED (parallel dimensions)"
    terminal_states: ["production_status=COMPLETE or CANCELLED"]
    transitions:
      - from: PLANNED
        to: MATERIAL_ALLOCATED
        trigger: "POST /plant/production-orders/{orderId}/allocate-materials"
        actor: LineSupervisor
        preconditions:
          - "Target FoamBatch.status == CURED (ERR_BATCH_NOT_CURED)"
          - "batch.available_mass_kg >= order.foam_mass_required_kg (ERR_INSUFFICIENT_FOAM_MASS)"
        side_effects:
          - "order.foam_batch_id = batch; batch.available_mass_kg -= required; batch.reserved_mass_kg += required"
          - "Mass conservation: poured == available + reserved + consumed + scrapped holds after the move"

      - from: MATERIAL_ALLOCATED
        to: IN_PRODUCTION
        trigger: "POST /plant/production-orders/{orderId}/start-production"
        actor: LineSupervisor
        preconditions:
          - "An ACTIVE LawLabel exists for (order.model_id, order.destination_state_code) (ERR_LABEL_NOT_ACTIVE)"
        side_effects:
          - "batch.reserved_mass_kg -= required; batch.consumed_mass_kg += required"
          - "If batch.available_mass_kg == 0 AND reserved_mass_kg == 0 → batch auto-transitions CURED → CONSUMED (hop 2)"

      - from: IN_PRODUCTION
        to: QC_PENDING
        trigger: "POST /plant/production-orders/{orderId}/complete-production"
        actor: LineSupervisor
        preconditions: []
        side_effects:
          - "Creates order.quantity MattressUnits (status MANUFACTURED), each capturing the currently ACTIVE LawLabel id for (model, destination_state)"

      - from: QC_PENDING
        to: COMPLETE
        trigger: "POST /plant/production-orders/{orderId}/qc-pass"
        actor: QcInspector
        preconditions: []
        side_effects: []

      - from: QC_PENDING
        to: QC_HOLD
        trigger: "POST /plant/production-orders/{orderId}/qc-hold"
        actor: QcInspector
        preconditions: []
        side_effects: []

      - from: QC_HOLD
        to: QC_PENDING
        trigger: "POST /plant/production-orders/{orderId}/qc-release"
        actor: QcInspector
        preconditions: []
        side_effects: []

      - from: MATERIAL_ALLOCATED
        to: QC_HOLD
        trigger: "system (certificate revoke/expiry cascade, hop 3)"
        actor: system
        preconditions: ["The ACTIVE LawLabel for (order.model_id, order.destination_state_code) was superseded by the cascade"]
        side_effects: []

      - from: IN_PRODUCTION
        to: QC_HOLD
        trigger: "system (certificate revoke/expiry cascade, hop 3)"
        actor: system
        preconditions: ["same as MATERIAL_ALLOCATED → QC_HOLD cascade"]
        side_effects: []

      - from: QC_PENDING
        to: QC_HOLD
        trigger: "system (certificate revoke/expiry cascade, hop 3)"
        actor: system
        preconditions: ["same as MATERIAL_ALLOCATED → QC_HOLD cascade"]
        side_effects: []

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /plant/production-orders/{orderId}/cancel"
        actor: PlantManager
        preconditions: []
        side_effects: []

      - from: MATERIAL_ALLOCATED
        to: CANCELLED
        trigger: "POST /plant/production-orders/{orderId}/cancel"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "batch.reserved_mass_kg -= required; batch.available_mass_kg += required (compensating release; mass invariant holds)"

  # fulfillment_status parallel dimension (independent of production_status)
  - entity: ProductionOrderFulfillment
    initial_state: UNFULFILLED
    terminal_states: [DELIVERED]
    transitions:
      - from: UNFULFILLED
        to: PARTIALLY_SHIPPED
        trigger: "system (on POST /plant/shipments/{shipmentId}/dispatch when some but not all of the order's units are SHIPPED)"
        actor: system
        preconditions: ["0 < count(order units with status IN {SHIPPED, DELIVERED}) < order.quantity"]
        side_effects: []
      - from: UNFULFILLED
        to: FULLY_SHIPPED
        trigger: "system (on dispatch when all units ship at once)"
        actor: system
        preconditions: ["count(order units with status IN {SHIPPED, DELIVERED}) == order.quantity"]
        side_effects: []
      - from: PARTIALLY_SHIPPED
        to: FULLY_SHIPPED
        trigger: "system (on dispatch of the remaining units)"
        actor: system
        preconditions: ["count(order units with status IN {SHIPPED, DELIVERED}) == order.quantity"]
        side_effects: []
      - from: PARTIALLY_SHIPPED
        to: DELIVERED
        trigger: "system (on deliver when all units delivered)"
        actor: system
        preconditions: ["count(order units with status DELIVERED) == order.quantity"]
        side_effects: []
      - from: FULLY_SHIPPED
        to: DELIVERED
        trigger: "system (on deliver of the last outstanding shipment)"
        actor: system
        preconditions: ["count(order units with status DELIVERED) == order.quantity"]
        side_effects: []
      - from: UNFULFILLED
        to: DELIVERED
        trigger: "system (on deliver when a single shipment carried every unit)"
        actor: system
        preconditions: ["count(order units with status DELIVERED) == order.quantity"]
        side_effects: []

  - entity: MattressUnit
    initial_state: MANUFACTURED
    terminal_states: [RECOVERED, SCRAPPED]
    transitions:
      - from: MANUFACTURED
        to: SHIPPED
        trigger: "system (on POST /plant/shipments/{shipmentId}/dispatch for each unit in the shipment)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SHIPPED
        to: DELIVERED
        trigger: "system (on POST /plant/shipments/{shipmentId}/deliver for each unit in the shipment)"
        actor: system
        preconditions: []
        side_effects: ["delivered_at = logical clock"]
      - from: DELIVERED
        to: RETURNED
        trigger: "system (on POST /plant/returns/{returnId}/receive)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: RECOVERED
        trigger: "system (on return resolve with resolution EXCHANGE — core recovery keeps the unit in the plant)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: SCRAPPED
        trigger: "system (on return resolve with resolution RECYCLE)"
        actor: system
        preconditions: []
        side_effects:
          - "Creates a RecyclingIntake (retailer = unit's retailer, unit_id = unit, declared_weight_kg = sum of the model BOM's quantity_per_unit over component_type IN {FOAM_CORE, MEMORY_LAYER, TICKING, FOUNDATION}) with source EXCHANGE_RECOVERY — hop 2 of the recycle cascade"
      - from: RETURNED
        to: DELIVERED
        trigger: "system (on return resolve with resolution REJECT — unit ships back to the retailer)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Shipment
    initial_state: CREATED
    terminal_states: [DELIVERED]
    transitions:
      - from: CREATED
        to: DISPATCHED
        trigger: "POST /plant/shipments/{shipmentId}/dispatch"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "Each unit in shipment → SHIPPED; order fulfillment_status recomputed (hop 2)"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /plant/shipments/{shipmentId}/deliver"
        actor: LogisticsCoordinator
        preconditions: []
        side_effects:
          - "Each unit → DELIVERED with delivered_at = logical clock; order fulfillment_status recomputed (hop 2)"

  - entity: ReturnRequest
    initial_state: REQUESTED
    terminal_states: [RESOLVED_EXCHANGE, RESOLVED_RECYCLED, REJECTED]
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /plant/returns/{returnId}/receive"
        actor: QcInspector
        preconditions: []
        side_effects: ["unit → RETURNED (hop 2)"]
      - from: RECEIVED
        to: INSPECTED
        trigger: "POST /plant/returns/{returnId}/inspect"
        actor: QcInspector
        preconditions: []
        side_effects: ["measured_sag_inches recorded from payload"]
      - from: INSPECTED
        to: RESOLVED_EXCHANGE
        trigger: "POST /plant/returns/{returnId}/resolve with resolution=EXCHANGE"
        actor: PlantManager
        preconditions:
          - "return.reason == COMFORT_EXCHANGE (ERR_RESOLUTION_REASON_MISMATCH otherwise)"
        side_effects:
          - "Creates replacement MattressUnit (same order/model/batch, status MANUFACTURED) and sets replacement_unit_id (hop 2)"
          - "Original unit → RECOVERED (hop 2)"
      - from: INSPECTED
        to: RESOLVED_RECYCLED
        trigger: "POST /plant/returns/{returnId}/resolve with resolution=RECYCLE"
        actor: PlantManager
        preconditions:
          - "Unit's retailer.recycling_enrolled == true (ERR_RECYCLING_NOT_ENROLLED)"
        side_effects:
          - "Original unit → SCRAPPED (hop 2), which creates a RecyclingIntake (hop 3)"
      - from: INSPECTED
        to: REJECTED
        trigger: "POST /plant/returns/{returnId}/resolve with resolution=REJECT"
        actor: PlantManager
        preconditions: []
        side_effects: ["unit RETURNED → DELIVERED (hop 2)"]

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [PAID, DENIED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /plant/warranty-claims/{claimId}/approve"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "age_months, credit_variant, credit_cents computed per warranty_credit_amount at approval time"
      - from: FILED
        to: DENIED
        trigger: "POST /plant/warranty-claims/{claimId}/deny"
        actor: PlantManager
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /plant/warranty-claims/{claimId}/pay"
        actor: PlantManager
        preconditions:
          - "retailer.credit_balance_cents + claim.credit_cents <= retailer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Creates CreditAdjustment(amount=+credit_cents, source=WARRANTY_PAYOUT, source_id=claim) on the retailer (hop 2)"
          - "retailer.credit_balance_cents recomputed; retailer.version incremented (hop 3)"

  - entity: RecyclingIntake
    initial_state: RECEIVED
    terminal_states: [FINALIZED]
    transitions:
      - from: RECEIVED
        to: FINALIZED
        trigger: "POST /plant/recycling-intakes/{intakeId}/finalize"
        actor: PlantManager
        preconditions: []
        side_effects:
          - "final_credit_cents computed per recycling_credit (per-material lines rounded then summed)"
          - "Creates CreditAdjustment(amount = final - provisional, source=RECYCLING_FINAL_DELTA, source_id=intake) — hop 2"
          - "retailer.credit_balance_cents recomputed; retailer.version incremented — hop 3"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: law-label-create-stale-model
    parent_entity: MattressModel
    write_endpoint: "POST /plant/models/{id}/law-labels"
    occ_field: expected_model_version
    description: |
      Generating a LawLabel against a MattressModel whose version has advanced
      since the client last observed it is rejected. Generating a label bumps
      the model's version (label content derives from the BOM, so the model is
      the coherence boundary), so a second generator carrying a stale
      expected_model_version has an out-of-date view of the BOM the label
      would be rendered from.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: bom-edit-stale-model
    parent_entity: MattressModel
    write_endpoint: "PATCH /plant/models/{id}/bom-lines/{lineId}"
    occ_field: expected_model_version
    description: |
      Editing a BomLine of a MattressModel whose version has advanced since the
      client last observed it is rejected. BomLine edits bump the model's
      version (they change bom_cost_cents and any future label content), so a
      writer holding a stale expected_model_version would silently overwrite
      the effects of an interleaved BOM edit.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: credit-adjustment-stale-retailer
    parent_entity: Retailer
    write_endpoint: "POST /plant/retailers/{id}/credit-adjustments"
    occ_field: expected_retailer_version
    description: |
      Posting a manual CreditAdjustment against a Retailer whose version has
      advanced since the client last observed it is rejected. Every adjustment
      (manual or cascaded) recomputes credit_balance_cents and bumps the
      retailer's version, so a client computing a top-up from a stale balance
      is rejected instead of silently compounding on an outdated base.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: cure_eligibility_time
    trigger: "POST /plant/foam-batches/{batchId}/start-cure (compute), POST /plant/foam-batches/{batchId}/certify-cured (boundary check), POST /plant/foam-batches/{batchId}/release-to-cure (extend)"
    algorithm: threshold
    formula: |
      base_hours = BASE_CURE_HOURS[foam_density_class]        # STANDARD 24, HIGH_DENSITY 48, MEMORY 72
      if ambient_temp_c < 18:  adj_hours = 12                 # COOL tier
      elif ambient_temp_c <= 27: adj_hours = 0                # NORMAL tier (boundary 18 and 27 inclusive)
      else: adj_hours = -6                                    # WARM tier
      cure_eligible_at = cure_started_at + (base_hours + adj_hours) hours
      On release-to-cure (QUARANTINED → CURING): cure_eligible_at += RECURE_PENALTY_HOURS
      certify-cured passes iff logical_clock >= cure_eligible_at   # inclusive boundary: exact equality passes
    input_set: "The single FoamBatch being cured; ambient_temp_c supplied at start-cure"
    constants:
      BASE_CURE_STANDARD: 24
      BASE_CURE_HIGH_DENSITY: 48
      BASE_CURE_MEMORY: 72
      COOL_TIER_MAX_C: 18
      WARM_TIER_MIN_C: 27
      COOL_ADJUST_HOURS: 12
      WARM_ADJUST_HOURS: -6
      RECURE_PENALTY_HOURS: 12

  - name: bom_material_cost
    trigger: "BomLine create or update on a MattressModel"
    algorithm: aggregation
    formula: |
      For each BomLine of the model (processing order irrelevant — sum is order-independent):
        line_cost_cents = round_half_up(quantity_per_unit * unit_cost_cents)   # ROUND PER LINE FIRST
      model.bom_cost_cents = sum(line_cost_cents over all BomLines)            # THEN SUM
      Pinned rounding order: per-line rounding, then sum. The alternative
      (sum of unrounded products, then round once) yields different cents and
      is NOT the contract.
    input_set: "All BomLines of the model regardless of component_type"
    precision: "integer cents, round_half_up at the per-line step only"

  - name: order_compliance_fee
    trigger: "ProductionOrder creation"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned to break the circular-looking dependency
      (fee depends on subtotal; total includes fee):
        1. subtotal_cents = quantity * unit_price_cents
        2. compliance_fee_cents = tier(subtotal_cents):
             subtotal <  100000                -> 500
             100000 <= subtotal < 500000       -> 1500      # boundary 100000 inclusive in tier 2
             subtotal >= 500000                -> 3000      # boundary 500000 inclusive in tier 3
        3. total_cents = subtotal_cents + compliance_fee_cents
      The tier is keyed on subtotal BEFORE the fee is added — never on total.
    input_set: "The new ProductionOrder's quantity and unit_price_cents"
    constants:
      TIER1_MAX_CENTS: 100000
      TIER2_MAX_CENTS: 500000
      FEE_TIER1_CENTS: 500
      FEE_TIER2_CENTS: 1500
      FEE_TIER3_CENTS: 3000
    precision: "integer cents; no rounding (all inputs integral)"

  - name: warranty_credit_amount
    trigger: "POST /plant/warranty-claims/{claimId}/approve"
    algorithm: threshold
    formula: |
      age_months = floor( (logical_clock - unit.delivered_at) / 30 days )   # whole 30-day months
      price = unit.purchase_price_cents
      Variant selection: age_months <= FULL_REPLACEMENT_MONTHS -> FULL_REPLACEMENT, else PRORATED
      FULL_REPLACEMENT: credit_cents = price
      PRORATED:
        linear = round_half_up(price * (TERM_MONTHS - age_months) / TERM_MONTHS)   # may go negative past term
        floor_amt = round_half_up(price * MIN_CREDIT_PCT)
        credit_cents = max(floor_amt, min(price, linear))                          # nested min/max, floor binds late, cap binds early
    input_set: "The claim's unit (delivered_at, purchase_price_cents) and the logical clock at approval"
    constants:
      FULL_REPLACEMENT_MONTHS: 12
      TERM_MONTHS: 120
      MIN_CREDIT_PCT: 0.10
    precision: "integer cents, round_half_up"
    variants:
      - name: full_replacement
        when: "age_months <= 12 at approval"
        difference: "Full purchase price regardless of sag depth; no proration applied"
      - name: prorated
        when: "age_months > 12 at approval"
        difference: "Time-linear credit with 10% floor and price cap; strictly less than full price for 13..119 months"

  - name: recycling_credit
    trigger: "POST /plant/recycling-intakes (provisional at creation), POST /plant/recycling-intakes/{intakeId}/finalize (final)"
    algorithm: weighted_scoring
    formula: |
      PROVISIONAL (at intake creation):
        provisional_credit_cents = round_half_up(declared_weight_kg * PROVISIONAL_RATE_CENTS_PER_KG)
        Immediately posts CreditAdjustment(+provisional, source=RECYCLING_PROVISIONAL).
      FINAL (at finalize), per-material lines rounded individually then summed:
        final_credit_cents = round_half_up(actual_steel_kg * 25)
                           + round_half_up(actual_foam_kg  * 40)
                           + round_half_up(actual_fiber_kg * 15)
                           + round_half_up(actual_wood_kg  * 5)
        Posts CreditAdjustment(final - provisional, source=RECYCLING_FINAL_DELTA) — delta may be negative.
    input_set: "PROVISIONAL: declared_weight_kg only. FINAL: the four actual material weights supplied at finalize."
    constants:
      PROVISIONAL_RATE_CENTS_PER_KG: 20
      RATE_STEEL: 25
      RATE_FOAM: 40
      RATE_FIBER: 15
      RATE_WOOD: 5
    precision: "integer cents, round_half_up per material line, then sum"
    variants:
      - name: provisional
        when: "At intake creation, before sorting/weighing"
        difference: "Flat blended rate on declared manifest weight; posted immediately to the retailer ledger"
      - name: final
        when: "At finalize, after sort-and-weigh reconciliation"
        difference: "Per-material rates on actual weighed masses; almost always diverges from provisional; reconciled via a signed delta adjustment"

  - name: fulfillment_recompute
    trigger: "POST /plant/shipments/{shipmentId}/dispatch and /deliver"
    algorithm: aggregation
    formula: |
      shipped = count(order's MattressUnits with status IN {SHIPPED, DELIVERED})
      delivered = count(order's MattressUnits with status == DELIVERED)
      if delivered == order.quantity: fulfillment_status = DELIVERED
      elif shipped == order.quantity: fulfillment_status = FULLY_SHIPPED
      elif shipped > 0:               fulfillment_status = PARTIALLY_SHIPPED
      else:                           fulfillment_status = UNFULFILLED
      Ties cannot occur (counts are exact); boundary shipped == quantity uses ==, not >=.
    input_set: "All MattressUnits with order_id == shipment.order_id, any status"

  - name: chamber_capacity_check
    trigger: "POST /plant/foam-batches/{batchId}/start-cure"
    algorithm: interval_merge
    formula: |
      new_window = [logical_clock, logical_clock + base_hours + adj_hours)
      occupants = count of OTHER FoamBatches with status == CURING, same chamber_id,
                  whose [cure_started_at, cure_eligible_at) overlaps new_window
                  (overlap = a.start < b.end AND b.start < a.end; touching endpoints do NOT overlap)
      reject with ERR_CHAMBER_CAPACITY_EXCEEDED iff occupants >= CHAMBER_CAPACITY - 1
      (i.e. the new batch may be the 3rd concurrent occupant, never the 4th)
    input_set: "FoamBatches in CURING on the same chamber_id; POURED/QUARANTINED/CURED batches do not count"
    constants:
      CHAMBER_CAPACITY: 3

  - name: quilt_machine_conflict_check
    trigger: "POST /plant/quilt-runs"
    algorithm: interval_merge
    formula: |
      For the same machine_id, consider existing QuiltRuns with status IN {SCHEDULED, RUNNING}
      (COMPLETE and CANCELLED runs do not block):
        conflict iff existing.start_at < new.end_at AND new.start_at < existing.end_at
      Half-open semantics: new.start_at == existing.end_at (adjacent, zero gap) is ALLOWED.
      Also reject end_at <= start_at with ERR_INVALID_TIME_RANGE.
    input_set: "QuiltRuns on the same machine_id in non-terminal status"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role name"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right (modelId before bomLineId/certId/labelId; retailerId before adjustment scope)"
    error_id: "ERR_MODEL_NOT_FOUND | ERR_BOM_LINE_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND | ERR_LABEL_NOT_FOUND | ERR_SPEC_NOT_FOUND | ERR_RETAILER_NOT_FOUND | ERR_FOAM_BATCH_NOT_FOUND | ERR_QUILT_RUN_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_RETURN_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_INTAKE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Request body is well-formed: required input fields present, enums valid, numeric ranges respected (quantity >= 1, masses > 0, unit_price_cents > 0, end_at > start_at else ERR_INVALID_TIME_RANGE, expires_on > issued_on)"
    error_id: ERR_VALIDATION_FAILED
    http_status: 400
    applies_to: "all POST/PATCH endpoints"

  - priority: 5
    category: state
    check: "Target entity is in the required state for the transition (per-machine ERR_*_NOT_* errors)"
    error_id: "ERR_MODEL_NOT_DRAFT | ERR_MODEL_NOT_CERT_REVIEW | ERR_MODEL_NOT_CERTIFIED | ERR_MODEL_NOT_ACTIVE | ERR_CERT_NOT_SUBMITTED | ERR_CERT_NOT_APPROVED | ERR_SPEC_NOT_DRAFT | ERR_LABEL_NOT_GENERATED | ERR_LABEL_NOT_APPROVED | ERR_BATCH_NOT_POURED | ERR_BATCH_NOT_CURING | ERR_BATCH_NOT_QUARANTINED | ERR_BATCH_NOT_CURED | ERR_RUN_NOT_SCHEDULED | ERR_RUN_NOT_RUNNING | ERR_ORDER_NOT_PLANNED | ERR_ORDER_NOT_MATERIAL_ALLOCATED | ERR_ORDER_NOT_IN_PRODUCTION | ERR_ORDER_NOT_QC_PENDING | ERR_ORDER_NOT_QC_HOLD | ERR_ORDER_NOT_CANCELLABLE | ERR_ORDER_NOT_COMPLETE | ERR_UNIT_NOT_DELIVERED | ERR_UNITS_NOT_MANUFACTURED | ERR_SHIPMENT_NOT_CREATED | ERR_SHIPMENT_NOT_DISPATCHED | ERR_RETURN_NOT_REQUESTED | ERR_RETURN_NOT_RECEIVED | ERR_RETURN_NOT_INSPECTED | ERR_CLAIM_NOT_FILED | ERR_CLAIM_NOT_APPROVED | ERR_INTAKE_NOT_RECEIVED"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "Regulatory gates: model certify requires an APPROVED unexpired FLAMMABILITY_16CFR1633 cert (ERR_CERT_REQUIRED); shipment creation requires ACTIVE LawLabel for (model, destination_state) (ERR_LABEL_NOT_ACTIVE) and an APPROVED unexpired FLAMMABILITY cert (ERR_CERT_EXPIRED); start-production requires ACTIVE label (ERR_LABEL_NOT_ACTIVE); label activate requires pinned spec still PUBLISHED (ERR_SPEC_SUPERSEDED); label generate requires a PUBLISHED spec for the state (ERR_SPEC_NOT_PUBLISHED); certify-cured requires clock >= cure_eligible_at (ERR_CURE_INCOMPLETE)"
    error_id: "ERR_CERT_REQUIRED | ERR_LABEL_NOT_ACTIVE | ERR_CERT_EXPIRED | ERR_SPEC_SUPERSEDED | ERR_SPEC_NOT_PUBLISHED | ERR_CURE_INCOMPLETE"
    http_status: 409
    applies_to: "certify, shipments create, start-production, law-labels create/activate, certify-cured"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: certificate approver != submitter; label approver/rejector != creator; cure certifier != pourer"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "certificates/{id}/approve, law-labels/{id}/approve, law-labels/{id}/reject, foam-batches/{id}/certify-cured"

  - priority: 8
    category: business_constraint
    check: "Resource conflicts and program gates: quilt machine overlap (ERR_MACHINE_TIME_CONFLICT); chamber aggregate capacity (ERR_CHAMBER_CAPACITY_EXCEEDED); DROP_SHIP order requires retailer.drop_ship_enabled (ERR_DROPSHIP_NOT_ENABLED); recycling intake requires retailer.recycling_enrolled (ERR_RECYCLING_NOT_ENROLLED); model submit requires >= 1 BomLine (ERR_MODEL_HAS_NO_BOM); discontinue blocked by open orders (ERR_OPEN_ORDERS_EXIST); return resolution must match reason (ERR_RESOLUTION_REASON_MISMATCH)"
    error_id: "ERR_MACHINE_TIME_CONFLICT | ERR_CHAMBER_CAPACITY_EXCEEDED | ERR_DROPSHIP_NOT_ENABLED | ERR_RECYCLING_NOT_ENROLLED | ERR_MODEL_HAS_NO_BOM | ERR_OPEN_ORDERS_EXIST | ERR_RESOLUTION_REASON_MISMATCH"
    http_status: 409
    applies_to: "quilt-runs create, start-cure, production-orders create, recycling-intakes create, submit-for-certification, discontinue, returns resolve"

  - priority: 9
    category: business_temporal
    check: "Time-window gates: comfort-exchange return requested after unit.delivered_at + 100 days (ERR_OUTSIDE_COMFORT_WINDOW); quilt run start before its window (ERR_RUN_WINDOW_NOT_REACHED); allocation requires batch already CURED with clock past cure (covered by state ERR_BATCH_NOT_CURED at priority 5)"
    error_id: "ERR_OUTSIDE_COMFORT_WINDOW | ERR_RUN_WINDOW_NOT_REACHED"
    http_status: 409
    applies_to: "returns create, quilt-runs/{id}/start"

  - priority: 10
    category: business_referential
    check: "Cross-entity reference integrity: shipment unit_ids must all belong to the shipment's order (ERR_UNIT_ORDER_MISMATCH); return/warranty retailer_id must equal the unit's retailer_id (ERR_RETAILER_UNIT_MISMATCH); Retailer callers may only reference their own retailer_id (ERR_RETAILER_IDENTITY_MISMATCH); recycling intake unit_id, when provided, must reference a SCRAPPED unit owned by the same retailer (ERR_UNIT_NOT_SCRAPPED); SAG_DEFECT claim requires measured_sag_inches >= 1.5 inclusive (ERR_SAG_BELOW_THRESHOLD)"
    error_id: "ERR_UNIT_ORDER_MISMATCH | ERR_RETAILER_UNIT_MISMATCH | ERR_RETAILER_IDENTITY_MISMATCH | ERR_UNIT_NOT_SCRAPPED | ERR_SAG_BELOW_THRESHOLD"
    http_status: 422
    applies_to: "shipments create, returns create, warranty-claims create, recycling-intakes create"

  - priority: 11
    category: business_fiscal
    check: "Fiscal caps: recycling intake provisional credit must not push retailer.credit_balance_cents above credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED); warranty pay must not push the balance above the limit (ERR_CREDIT_LIMIT_EXCEEDED); allocation requires batch.available_mass_kg >= foam_mass_required_kg (ERR_INSUFFICIENT_FOAM_MASS)"
    error_id: "ERR_CREDIT_LIMIT_EXCEEDED | ERR_INSUFFICIENT_FOAM_MASS"
    http_status: 402
    applies_to: "recycling-intakes create, warranty-claims/{id}/pay, allocate-materials"

  - priority: 12
    category: business_constraint
    check: "OCC: expected_model_version / expected_retailer_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "law-labels create, bom-lines PATCH, credit-adjustments create"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/plant/_clock/set_current_utc"
    description: "Set the logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time."
    roles: [PlantManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["May trigger certificate EXPIRED transitions when crossing expires_on (expiry itself does not cascade — see ComplianceCertificate APPROVED → EXPIRED)"]

  # --- Retailer ---
  - method: POST
    path: "/plant/retailers"
    description: "Register a retailer account"
    roles: [PlantManager]
    code: 201
    input: [retailer_name, drop_ship_enabled, recycling_enrolled, credit_limit_cents]
    output: Retailer
    side_effects: ["credit_balance_cents initialized to 0"]

  - method: GET
    path: "/plant/retailers"
    description: "List retailers"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "drop_ship_enabled?", "recycling_enrolled?"]
    output: "Retailer[]"
    side_effects: []

  - method: GET
    path: "/plant/retailers/{retailerId}"
    description: "Get a retailer"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: []
    output: Retailer
    side_effects: []

  - method: POST
    path: "/plant/retailers/{id}/credit-adjustments"
    description: "Post a manual credit adjustment (OCC on retailer version)"
    roles: [PlantManager]
    code: 201
    input: [amount_cents, reason, expected_retailer_version]
    output: CreditAdjustment
    side_effects:
      - "retailer.credit_balance_cents += amount_cents"
      - "increments Retailer.version by 1"

  - method: GET
    path: "/plant/retailers/{id}/credit-adjustments"
    description: "List a retailer's credit ledger entries"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "CreditAdjustment[]"
    side_effects: []

  # --- MattressModel ---
  - method: POST
    path: "/plant/models"
    description: "Create a mattress model (status DRAFT)"
    roles: [PlantManager]
    code: 201
    input: [model_code, quilt_pattern]
    output: MattressModel
    side_effects: ["bom_cost_cents initialized to 0"]

  - method: GET
    path: "/plant/models"
    description: "List models"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "MattressModel[]"
    side_effects: []

  - method: GET
    path: "/plant/models/{modelId}"
    description: "Get a model"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: []
    output: MattressModel
    side_effects: []

  - method: POST
    path: "/plant/models/{id}/submit-for-certification"
    description: "DRAFT → CERT_REVIEW (requires at least one BomLine)"
    roles: [PlantManager]
    code: 200
    input: []
    output: MattressModel
    side_effects: ["increments MattressModel.version by 1"]

  - method: POST
    path: "/plant/models/{id}/return-to-draft"
    description: "CERT_REVIEW → DRAFT (revert loop for spec fixes)"
    roles: [PlantManager]
    code: 200
    input: []
    output: MattressModel
    side_effects: ["increments MattressModel.version by 1"]

  - method: POST
    path: "/plant/models/{id}/certify"
    description: "CERT_REVIEW → CERTIFIED (requires APPROVED unexpired FLAMMABILITY_16CFR1633 cert)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MattressModel
    side_effects: ["increments MattressModel.version by 1"]

  - method: POST
    path: "/plant/models/{id}/activate"
    description: "CERTIFIED → ACTIVE"
    roles: [PlantManager]
    code: 200
    input: []
    output: MattressModel
    side_effects: ["increments MattressModel.version by 1"]

  - method: POST
    path: "/plant/models/{id}/discontinue"
    description: "ACTIVE → DISCONTINUED (blocked by open orders)"
    roles: [PlantManager]
    code: 200
    input: []
    output: MattressModel
    side_effects: ["increments MattressModel.version by 1"]

  # --- BomLine ---
  - method: POST
    path: "/plant/models/{id}/bom-lines"
    description: "Add a BOM component line (model must be DRAFT)"
    roles: [PlantManager]
    code: 201
    input: [component_type, material_code, quantity_per_unit, unit_cost_cents, "filling_content_code?"]
    output: BomLine
    side_effects:
      - "line_cost_cents computed (per-line round_half_up)"
      - "model.bom_cost_cents recomputed per bom_material_cost"
      - "increments MattressModel.version by 1"

  - method: GET
    path: "/plant/models/{id}/bom-lines"
    description: "List BOM lines of a model"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "BomLine[]"
    side_effects: []

  - method: PATCH
    path: "/plant/models/{id}/bom-lines/{lineId}"
    description: "Edit a BOM line (model must be DRAFT; OCC on model version)"
    roles: [PlantManager]
    code: 200
    input: ["quantity_per_unit?", "unit_cost_cents?", expected_model_version]
    output: BomLine
    side_effects:
      - "line_cost_cents recomputed; model.bom_cost_cents recomputed"
      - "increments MattressModel.version by 1"

  # --- ComplianceCertificate ---
  - method: POST
    path: "/plant/models/{id}/certificates"
    description: "Submit a compliance certificate (model must be CERT_REVIEW)"
    roles: [ComplianceOfficer]
    code: 201
    input: [cert_type, jurisdiction_state_code, issued_on, expires_on]
    output: ComplianceCertificate
    side_effects: ["submitted_by_user_id = caller X-User-ID"]

  - method: GET
    path: "/plant/models/{id}/certificates"
    description: "List certificates of a model"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "ComplianceCertificate[]"
    side_effects: []

  - method: POST
    path: "/plant/models/{id}/certificates/{certId}/approve"
    description: "Approve a submitted certificate (approver != submitter)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceCertificate
    side_effects: ["approved_by_user_id = caller X-User-ID"]

  - method: POST
    path: "/plant/models/{id}/certificates/{certId}/revoke"
    description: "Revoke an approved certificate; triggers model → labels → orders cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ComplianceCertificate
    side_effects:
      - "If last APPROVED unexpired FLAMMABILITY_16CFR1633 cert: model CERTIFIED|ACTIVE → CERT_REVIEW"
      - "Model transition supersedes non-terminal LawLabels"
      - "Superseded labels hold open ProductionOrders for the label's state (QC_HOLD)"

  # --- StateLawLabelSpec ---
  - method: POST
    path: "/plant/law-label-specs"
    description: "Create a state law-label spec (DRAFT)"
    roles: [ComplianceOfficer]
    code: 201
    input: [state_code, filling_content_codes, required_phrases, prop65_warning_required]
    output: StateLawLabelSpec
    side_effects: []

  - method: GET
    path: "/plant/law-label-specs"
    description: "List specs"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "state_code?", "status?"]
    output: "StateLawLabelSpec[]"
    side_effects: []

  - method: GET
    path: "/plant/law-label-specs/{specId}"
    description: "Get a spec"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: []
    output: StateLawLabelSpec
    side_effects: []

  - method: GET
    path: "/plant/law-label-specs/{id}/law-labels"
    description: "List law labels pinned to this spec"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "LawLabel[]"
    side_effects: []

  - method: POST
    path: "/plant/law-label-specs/{id}/publish"
    description: "Publish a spec; supersedes any other PUBLISHED spec for the same state"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: StateLawLabelSpec
    side_effects: ["Other PUBLISHED spec with same state_code → SUPERSEDED"]

  # --- LawLabel ---
  - method: POST
    path: "/plant/models/{id}/law-labels"
    description: "Generate a law label for a state, pinned to the currently PUBLISHED spec (model must be CERTIFIED or ACTIVE; OCC on model version)"
    roles: [ComplianceOfficer]
    code: 201
    input: [state_code, expected_model_version]
    output: LawLabel
    side_effects:
      - "spec_id/spec_version pinned to the PUBLISHED spec for state_code"
      - "content_text rendered per LawLabel.content_text rule"
      - "created_by_user_id = caller X-User-ID"
      - "increments MattressModel.version by 1"

  - method: GET
    path: "/plant/models/{id}/law-labels"
    description: "List law labels of a model"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "state_code?", "status?"]
    output: "LawLabel[]"
    side_effects: []

  - method: GET
    path: "/plant/law-labels"
    description: "Filtered list of law labels across models"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "model_id?", "spec_id?", "state_code?", "status?"]
    output: "LawLabel[]"
    side_effects: []

  - method: GET
    path: "/plant/law-labels/{labelId}"
    description: "Get a law label"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: []
    output: LawLabel
    side_effects: []

  - method: POST
    path: "/plant/models/{id}/law-labels/{labelId}/approve"
    description: "Approve a generated label (approver != creator)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: LawLabel
    side_effects: ["approved_by_user_id = caller X-User-ID"]

  - method: POST
    path: "/plant/models/{id}/law-labels/{labelId}/reject"
    description: "Reject a generated label (rejector != creator)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: LawLabel
    side_effects: []

  - method: POST
    path: "/plant/models/{id}/law-labels/{labelId}/activate"
    description: "Activate an approved label; supersedes the current ACTIVE label for the same model+state"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: LawLabel
    side_effects: ["Prior ACTIVE label for same model+state → SUPERSEDED"]

  # --- FoamBatch ---
  - method: POST
    path: "/plant/foam-batches"
    description: "Pour a foam lot (POURED)"
    roles: [LineSupervisor]
    code: 201
    input: [foam_density_class, poured_mass_kg, chamber_id]
    output: FoamBatch
    side_effects:
      - "available_mass_kg = poured_mass_kg; reserved/consumed/scrapped = 0"
      - "poured_by_user_id = caller X-User-ID"

  - method: GET
    path: "/plant/foam-batches"
    description: "List foam batches"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?", "chamber_id?"]
    output: "FoamBatch[]"
    side_effects: []

  - method: GET
    path: "/plant/foam-batches/{batchId}"
    description: "Get a foam batch"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: []
    output: FoamBatch
    side_effects: []

  - method: POST
    path: "/plant/foam-batches/{batchId}/start-cure"
    description: "POURED → CURING; computes cure_eligible_at; enforces chamber capacity"
    roles: [LineSupervisor]
    code: 200
    input: [ambient_temp_c]
    output: FoamBatch
    side_effects: ["cure_started_at = clock; cure_cycles += 1; cure_eligible_at computed"]

  - method: POST
    path: "/plant/foam-batches/{batchId}/certify-cured"
    description: "CURING → CURED at/after cure_eligible_at (certifier != pourer)"
    roles: [QcInspector]
    code: 200
    input: []
    output: FoamBatch
    side_effects: ["certified_by_user_id = caller X-User-ID"]

  - method: POST
    path: "/plant/foam-batches/{batchId}/quarantine"
    description: "CURING → QUARANTINED"
    roles: [QcInspector]
    code: 200
    input: []
    output: FoamBatch
    side_effects: []

  - method: POST
    path: "/plant/foam-batches/{batchId}/release-to-cure"
    description: "QUARANTINED → CURING re-cure loop; extends cure_eligible_at by +12h"
    roles: [LineSupervisor]
    code: 200
    input: []
    output: FoamBatch
    side_effects: ["cure_cycles += 1; cure_eligible_at += 12h"]

  - method: POST
    path: "/plant/foam-batches/{batchId}/scrap"
    description: "QUARANTINED → SCRAPPED; writes off available mass"
    roles: [QcInspector]
    code: 200
    input: []
    output: FoamBatch
    side_effects: ["scrapped_mass_kg = available_mass_kg; available_mass_kg = 0"]

  # --- QuiltRun ---
  - method: POST
    path: "/plant/quilt-runs"
    description: "Schedule a quilting/panel run on a machine (half-open overlap check)"
    roles: [LineSupervisor]
    code: 201
    input: [order_id, machine_id, size, start_at, end_at]
    output: QuiltRun
    side_effects: []

  - method: GET
    path: "/plant/quilt-runs"
    description: "List quilt runs"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "machine_id?", "order_id?", "status?"]
    output: "QuiltRun[]"
    side_effects: []

  - method: GET
    path: "/plant/quilt-runs/{runId}"
    description: "Get a quilt run"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: []
    output: QuiltRun
    side_effects: []

  - method: POST
    path: "/plant/quilt-runs/{runId}/start"
    description: "SCHEDULED → RUNNING (clock must be >= start_at)"
    roles: [LineSupervisor]
    code: 200
    input: []
    output: QuiltRun
    side_effects: []

  - method: POST
    path: "/plant/quilt-runs/{runId}/complete"
    description: "RUNNING → COMPLETE"
    roles: [LineSupervisor]
    code: 200
    input: []
    output: QuiltRun
    side_effects: []

  - method: POST
    path: "/plant/quilt-runs/{runId}/cancel"
    description: "SCHEDULED → CANCELLED"
    roles: [LineSupervisor]
    code: 200
    input: []
    output: QuiltRun
    side_effects: []

  # --- ProductionOrder ---
  - method: POST
    path: "/plant/production-orders"
    description: "Create a production order; computes subtotal/fee/total"
    roles: [PlantManager, Retailer]
    code: 201
    input: [model_id, retailer_id, destination_state_code, quantity, unit_price_cents, foam_mass_required_kg, ship_method]
    output: ProductionOrder
    side_effects:
      - "subtotal_cents, compliance_fee_cents, total_cents computed per order_compliance_fee"
      - "Retailer callers must pass retailer_id == own X-User-ID"

  - method: GET
    path: "/plant/production-orders"
    description: "List production orders"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "model_id?", "retailer_id?", "foam_batch_id?", "production_status?", "fulfillment_status?"]
    output: "ProductionOrder[]"
    side_effects: []

  - method: GET
    path: "/plant/production-orders/{orderId}"
    description: "Get a production order"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: []

  - method: POST
    path: "/plant/production-orders/{orderId}/allocate-materials"
    description: "PLANNED → MATERIAL_ALLOCATED; reserves foam mass from a CURED batch"
    roles: [LineSupervisor]
    code: 200
    input: [foam_batch_id]
    output: ProductionOrder
    side_effects: ["batch.available_mass_kg -= required; batch.reserved_mass_kg += required"]

  - method: POST
    path: "/plant/production-orders/{orderId}/start-production"
    description: "MATERIAL_ALLOCATED → IN_PRODUCTION; consumes reserved foam; requires ACTIVE law label"
    roles: [LineSupervisor]
    code: 200
    input: []
    output: ProductionOrder
    side_effects:
      - "batch.reserved_mass_kg -= required; batch.consumed_mass_kg += required"
      - "batch auto CONSUMED when fully drained"

  - method: POST
    path: "/plant/production-orders/{orderId}/complete-production"
    description: "IN_PRODUCTION → QC_PENDING; manufactures quantity MattressUnits"
    roles: [LineSupervisor]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: ["Creates quantity MattressUnits (MANUFACTURED), each pinned to the ACTIVE LawLabel for (model, destination_state)"]

  - method: POST
    path: "/plant/production-orders/{orderId}/qc-pass"
    description: "QC_PENDING → COMPLETE"
    roles: [QcInspector]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: []

  - method: POST
    path: "/plant/production-orders/{orderId}/qc-hold"
    description: "QC_PENDING → QC_HOLD"
    roles: [QcInspector]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: []

  - method: POST
    path: "/plant/production-orders/{orderId}/qc-release"
    description: "QC_HOLD → QC_PENDING"
    roles: [QcInspector]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: []

  - method: POST
    path: "/plant/production-orders/{orderId}/cancel"
    description: "PLANNED|MATERIAL_ALLOCATED → CANCELLED; releases reserved foam"
    roles: [PlantManager]
    code: 200
    input: []
    output: ProductionOrder
    side_effects: ["If MATERIAL_ALLOCATED: batch.reserved_mass_kg -= required; batch.available_mass_kg += required"]

  # --- MattressUnit ---
  - method: GET
    path: "/plant/units"
    description: "List mattress units"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "model_id?", "retailer_id?", "foam_batch_id?", "law_label_id?", "status?"]
    output: "MattressUnit[]"
    side_effects: []

  - method: GET
    path: "/plant/units/{unitId}"
    description: "Get a mattress unit"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: []
    output: MattressUnit
    side_effects: []

  # --- Shipment ---
  - method: POST
    path: "/plant/shipments"
    description: "Create a shipment for an order (drop-ship or warehouse); validates label + cert compliance"
    roles: [LogisticsCoordinator]
    code: 201
    input: [order_id, unit_ids]
    output: Shipment
    side_effects: ["retailer_id and destination_state_code copied from the order"]

  - method: GET
    path: "/plant/shipments"
    description: "List shipments"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "retailer_id?", "status?"]
    output: "Shipment[]"
    side_effects: []

  - method: GET
    path: "/plant/shipments/{shipmentId}"
    description: "Get a shipment"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: POST
    path: "/plant/shipments/{shipmentId}/dispatch"
    description: "CREATED → DISPATCHED; units → SHIPPED; fulfillment recomputed"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["Units → SHIPPED", "order fulfillment_status recomputed"]

  - method: POST
    path: "/plant/shipments/{shipmentId}/deliver"
    description: "DISPATCHED → DELIVERED; units → DELIVERED with delivered_at = clock"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["Units → DELIVERED, delivered_at set", "order fulfillment_status recomputed"]

  # --- ReturnRequest ---
  - method: POST
    path: "/plant/returns"
    description: "Open a comfort-exchange or defect return for a delivered unit"
    roles: [Retailer]
    code: 201
    input: [unit_id, retailer_id, reason]
    output: ReturnRequest
    side_effects: []

  - method: GET
    path: "/plant/returns"
    description: "List return requests"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "unit_id?", "retailer_id?", "replacement_unit_id?", "status?"]
    output: "ReturnRequest[]"
    side_effects: []

  - method: GET
    path: "/plant/returns/{returnId}"
    description: "Get a return request"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: []

  - method: POST
    path: "/plant/returns/{returnId}/receive"
    description: "REQUESTED → RECEIVED; unit → RETURNED"
    roles: [QcInspector]
    code: 200
    input: []
    output: ReturnRequest
    side_effects: ["unit → RETURNED"]

  - method: POST
    path: "/plant/returns/{returnId}/inspect"
    description: "RECEIVED → INSPECTED; records measured sag"
    roles: [QcInspector]
    code: 200
    input: [measured_sag_inches]
    output: ReturnRequest
    side_effects: ["measured_sag_inches recorded"]

  - method: POST
    path: "/plant/returns/{returnId}/resolve"
    description: "INSPECTED → RESOLVED_EXCHANGE | RESOLVED_RECYCLED | REJECTED"
    roles: [PlantManager]
    code: 200
    input: [resolution]
    output: ReturnRequest
    side_effects:
      - "EXCHANGE: creates replacement MattressUnit (MANUFACTURED); original unit → RECOVERED"
      - "RECYCLE: original unit → SCRAPPED; creates RecyclingIntake with provisional credit"
      - "REJECT: unit RETURNED → DELIVERED"

  # --- WarrantyClaim ---
  - method: POST
    path: "/plant/warranty-claims"
    description: "File a warranty claim (SAG_DEFECT requires sag >= 1.5 inclusive)"
    roles: [Retailer]
    code: 201
    input: [unit_id, retailer_id, claim_type, measured_sag_inches]
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/plant/warranty-claims"
    description: "List warranty claims"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "unit_id?", "retailer_id?", "status?"]
    output: "WarrantyClaim[]"
    side_effects: []

  - method: GET
    path: "/plant/warranty-claims/{claimId}"
    description: "Get a warranty claim"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/plant/warranty-claims/{claimId}/approve"
    description: "FILED → APPROVED; computes age/variant/credit at approval time"
    roles: [PlantManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["age_months, credit_variant, credit_cents computed per warranty_credit_amount"]

  - method: POST
    path: "/plant/warranty-claims/{claimId}/deny"
    description: "FILED → DENIED"
    roles: [PlantManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/plant/warranty-claims/{claimId}/pay"
    description: "APPROVED → PAID; posts retailer credit (capped by credit limit)"
    roles: [PlantManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects:
      - "Creates CreditAdjustment(+credit_cents, WARRANTY_PAYOUT)"
      - "retailer.credit_balance_cents recomputed; retailer.version incremented"

  # --- RecyclingIntake ---
  - method: POST
    path: "/plant/recycling-intakes"
    description: "Record a take-back intake; posts provisional credit immediately"
    roles: [LogisticsCoordinator]
    code: 201
    input: [retailer_id, declared_weight_kg, "unit_id?"]
    output: RecyclingIntake
    side_effects:
      - "provisional_credit_cents computed; CreditAdjustment(+provisional, RECYCLING_PROVISIONAL) posted"
      - "retailer.credit_balance_cents recomputed; retailer.version incremented"

  - method: GET
    path: "/plant/recycling-intakes"
    description: "List recycling intakes"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: ["limit?", "offset?", "retailer_id?", "unit_id?", "status?"]
    output: "RecyclingIntake[]"
    side_effects: []

  - method: GET
    path: "/plant/recycling-intakes/{intakeId}"
    description: "Get a recycling intake"
    roles: [PlantManager, ComplianceOfficer, LineSupervisor, QcInspector, Retailer, LogisticsCoordinator]
    code: 200
    input: []
    output: RecyclingIntake
    side_effects: []

  - method: POST
    path: "/plant/recycling-intakes/{intakeId}/finalize"
    description: "RECEIVED → FINALIZED; computes per-material final credit and posts the signed delta"
    roles: [PlantManager]
    code: 200
    input: [actual_steel_kg, actual_foam_kg, actual_fiber_kg, actual_wood_kg]
    output: RecyclingIntake
    side_effects:
      - "final_credit_cents computed per recycling_credit"
      - "CreditAdjustment(final - provisional, RECYCLING_FINAL_DELTA) posted; retailer balance + version updated"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # auth
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not a declared role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not in the endpoint's roles list" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver/certifier is the same X-User-ID as the submitter/creator/pourer" }

  # existence
  - { id: ERR_RETAILER_NOT_FOUND, http: 404, condition: "retailerId path id does not exist" }
  - { id: ERR_MODEL_NOT_FOUND, http: 404, condition: "modelId path id does not exist" }
  - { id: ERR_BOM_LINE_NOT_FOUND, http: 404, condition: "lineId path id does not exist within the model" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "certId path id does not exist within the model" }
  - { id: ERR_LABEL_NOT_FOUND, http: 404, condition: "labelId path id does not exist" }
  - { id: ERR_SPEC_NOT_FOUND, http: 404, condition: "specId path id does not exist" }
  - { id: ERR_FOAM_BATCH_NOT_FOUND, http: 404, condition: "batchId path id does not exist" }
  - { id: ERR_QUILT_RUN_NOT_FOUND, http: 404, condition: "runId path id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "orderId path id does not exist" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "unitId path id or body unit reference does not exist" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "shipmentId path id does not exist" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "returnId path id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claimId path id does not exist" }
  - { id: ERR_INTAKE_NOT_FOUND, http: 404, condition: "intakeId path id does not exist" }
  - { id: ERR_VALIDATION_FAILED, http: 400, condition: "Required field missing, invalid enum, non-positive quantity/mass/price, or expires_on <= issued_on" }
  - { id: ERR_INVALID_TIME_RANGE, http: 400, condition: "end_at <= start_at on a quilt run" }

  # state
  - { id: ERR_MODEL_NOT_DRAFT, http: 409, condition: "Operation requires model DRAFT (BOM line create/update, submit-for-certification)" }
  - { id: ERR_MODEL_NOT_CERT_REVIEW, http: 409, condition: "Operation requires model CERT_REVIEW (certify, return-to-draft, certificate create)" }
  - { id: ERR_MODEL_NOT_CERTIFIED, http: 409, condition: "Operation requires model CERTIFIED (activate) or CERTIFIED|ACTIVE (label activate)" }
  - { id: ERR_MODEL_NOT_ACTIVE, http: 409, condition: "Operation requires model ACTIVE (production order create)" }
  - { id: ERR_CERT_NOT_SUBMITTED, http: 409, condition: "Approve requires certificate SUBMITTED" }
  - { id: ERR_CERT_NOT_APPROVED, http: 409, condition: "Revoke requires certificate APPROVED" }
  - { id: ERR_SPEC_NOT_DRAFT, http: 409, condition: "Publish requires spec DRAFT" }
  - { id: ERR_LABEL_NOT_GENERATED, http: 409, condition: "Approve/reject requires label GENERATED" }
  - { id: ERR_LABEL_NOT_APPROVED, http: 409, condition: "Activate requires label APPROVED" }
  - { id: ERR_BATCH_NOT_POURED, http: 409, condition: "start-cure requires batch POURED" }
  - { id: ERR_BATCH_NOT_CURING, http: 409, condition: "certify-cured or quarantine requires batch CURING" }
  - { id: ERR_BATCH_NOT_QUARANTINED, http: 409, condition: "release-to-cure or scrap requires batch QUARANTINED" }
  - { id: ERR_BATCH_NOT_CURED, http: 409, condition: "allocate-materials requires the referenced batch to be CURED" }
  - { id: ERR_RUN_NOT_SCHEDULED, http: 409, condition: "start/cancel requires run SCHEDULED" }
  - { id: ERR_RUN_NOT_RUNNING, http: 409, condition: "complete requires run RUNNING" }
  - { id: ERR_ORDER_NOT_PLANNED, http: 409, condition: "allocate-materials requires order production_status PLANNED" }
  - { id: ERR_ORDER_NOT_MATERIAL_ALLOCATED, http: 409, condition: "start-production requires MATERIAL_ALLOCATED" }
  - { id: ERR_ORDER_NOT_IN_PRODUCTION, http: 409, condition: "complete-production requires IN_PRODUCTION" }
  - { id: ERR_ORDER_NOT_QC_PENDING, http: 409, condition: "qc-pass/qc-hold requires QC_PENDING" }
  - { id: ERR_ORDER_NOT_QC_HOLD, http: 409, condition: "qc-release requires QC_HOLD" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel requires PLANNED or MATERIAL_ALLOCATED" }
  - { id: ERR_ORDER_NOT_COMPLETE, http: 409, condition: "shipment create requires order production_status COMPLETE" }
  - { id: ERR_UNIT_NOT_DELIVERED, http: 409, condition: "return/claim requires unit DELIVERED" }
  - { id: ERR_UNITS_NOT_MANUFACTURED, http: 409, condition: "shipment unit_ids must all be MANUFACTURED" }
  - { id: ERR_SHIPMENT_NOT_CREATED, http: 409, condition: "dispatch requires shipment CREATED" }
  - { id: ERR_SHIPMENT_NOT_DISPATCHED, http: 409, condition: "deliver requires shipment DISPATCHED" }
  - { id: ERR_RETURN_NOT_REQUESTED, http: 409, condition: "receive requires return REQUESTED" }
  - { id: ERR_RETURN_NOT_RECEIVED, http: 409, condition: "inspect requires return RECEIVED" }
  - { id: ERR_RETURN_NOT_INSPECTED, http: 409, condition: "resolve requires return INSPECTED" }
  - { id: ERR_CLAIM_NOT_FILED, http: 409, condition: "approve/deny requires claim FILED" }
  - { id: ERR_CLAIM_NOT_APPROVED, http: 409, condition: "pay requires claim APPROVED" }
  - { id: ERR_INTAKE_NOT_RECEIVED, http: 409, condition: "finalize requires intake RECEIVED" }

  # business_safety (regulatory)
  - { id: ERR_CERT_REQUIRED, http: 409, condition: "Model certify: no APPROVED unexpired FLAMMABILITY_16CFR1633 certificate on the model" }
  - { id: ERR_CERT_EXPIRED, http: 409, condition: "Shipment create: model's FLAMMABILITY certificate expired (clock past expires_on) or absent" }
  - { id: ERR_LABEL_NOT_ACTIVE, http: 409, condition: "No ACTIVE LawLabel for (model, destination_state) at start-production or shipment create" }
  - { id: ERR_SPEC_NOT_PUBLISHED, http: 409, condition: "Label generate: no PUBLISHED StateLawLabelSpec for the requested state_code" }
  - { id: ERR_SPEC_SUPERSEDED, http: 409, condition: "Label activate: the pinned spec is no longer PUBLISHED" }
  - { id: ERR_CURE_INCOMPLETE, http: 409, condition: "certify-cured before cure_eligible_at (strictly earlier clock)" }

  # business_constraint / temporal / referential
  - { id: ERR_MACHINE_TIME_CONFLICT, http: 409, condition: "Quilt run window overlaps an existing SCHEDULED/RUNNING run on the same machine (half-open; adjacency allowed)" }
  - { id: ERR_CHAMBER_CAPACITY_EXCEEDED, http: 409, condition: "start-cure would make a 4th CURING batch with overlapping estimated window in the chamber (capacity 3)" }
  - { id: ERR_DROPSHIP_NOT_ENABLED, http: 409, condition: "DROP_SHIP order for a retailer with drop_ship_enabled false" }
  - { id: ERR_RECYCLING_NOT_ENROLLED, http: 409, condition: "Recycling intake or RECYCLE resolution for a retailer with recycling_enrolled false" }
  - { id: ERR_MODEL_HAS_NO_BOM, http: 409, condition: "submit-for-certification with zero BomLines" }
  - { id: ERR_OPEN_ORDERS_EXIST, http: 409, condition: "discontinue with any non-terminal production order for the model" }
  - { id: ERR_RESOLUTION_REASON_MISMATCH, http: 409, condition: "resolution EXCHANGE on a return whose reason is DEFECT" }
  - { id: ERR_OUTSIDE_COMFORT_WINDOW, http: 409, condition: "COMFORT_EXCHANGE return requested when clock > unit.delivered_at + 100 days" }
  - { id: ERR_RUN_WINDOW_NOT_REACHED, http: 409, condition: "quilt run start when clock < start_at" }
  - { id: ERR_UNIT_ORDER_MISMATCH, http: 422, condition: "Shipment unit_ids include a unit whose order_id != shipment order" }
  - { id: ERR_RETAILER_UNIT_MISMATCH, http: 422, condition: "return/claim retailer_id differs from the unit's retailer_id" }
  - { id: ERR_RETAILER_IDENTITY_MISMATCH, http: 422, condition: "Retailer caller references a retailer_id other than their own X-User-ID" }
  - { id: ERR_UNIT_NOT_SCRAPPED, http: 422, condition: "Recycling intake unit_id references a unit that is not SCRAPPED, or belongs to another retailer" }
  - { id: ERR_SAG_BELOW_THRESHOLD, http: 422, condition: "SAG_DEFECT claim with measured_sag_inches < 1.5" }

  # business_fiscal
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 402, condition: "Posting the credit would push retailer.credit_balance_cents above credit_limit_cents" }
  - { id: ERR_INSUFFICIENT_FOAM_MASS, http: 402, condition: "allocate-materials: batch.available_mass_kg < order.foam_mass_required_kg" }

  # concurrency
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_model_version / expected_retailer_version does not match the parent's current version" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlantManager
    description: "Plant general manager; owns models, BOM, orders lifecycle overrides, claim adjudication, intake finalization, credit ledger, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /plant/retailers"
      - "POST /plant/retailers/{id}/credit-adjustments"
      - "POST /plant/models + model lifecycle actions (submit/return-to-draft/activate/discontinue)"
      - "POST/PATCH /plant/models/{id}/bom-lines"
      - "POST /plant/production-orders/{id}/cancel"
      - "POST /plant/warranty-claims/{id}/approve|deny|pay"
      - "POST /plant/recycling-intakes/{id}/finalize"
      - "POST /plant/returns/{id}/resolve"
      - "POST /plant/_clock/set_current_utc"
    shared_operations:
      - "POST /plant/production-orders (shared with Retailer)"
      - "All GET endpoints"

  - name: ComplianceOfficer
    description: "Regulatory affairs officer; owns law-label specs, certificates, and law labels; subject to segregation of duties on approvals"
    identity: opaque
    exclusive_operations:
      - "POST /plant/law-label-specs + publish"
      - "POST /plant/models/{id}/certificates + approve + revoke"
      - "POST /plant/models/{id}/law-labels + approve + reject + activate"
      - "POST /plant/models/{id}/certify"
    shared_operations:
      - "All GET endpoints"

  - name: LineSupervisor
    description: "Production floor supervisor; pours foam, manages cure chambers, schedules quilt runs, and drives the production pipeline"
    identity: opaque
    exclusive_operations:
      - "POST /plant/foam-batches + start-cure + release-to-cure"
      - "POST /plant/quilt-runs + start + complete + cancel"
      - "POST /plant/production-orders/{id}/allocate-materials + start-production + complete-production"
    shared_operations:
      - "All GET endpoints"

  - name: QcInspector
    description: "Quality control inspector; certifies cures (never own pours), quarantines batches, gates orders through QC, receives/inspects returns"
    identity: opaque
    exclusive_operations:
      - "POST /plant/foam-batches/{id}/certify-cured + quarantine + scrap"
      - "POST /plant/production-orders/{id}/qc-pass + qc-hold + qc-release"
      - "POST /plant/returns/{id}/receive + inspect"
    shared_operations:
      - "All GET endpoints"

  - name: Retailer
    description: "Retail partner account; places own orders, opens comfort-exchange returns and warranty claims for own units"
    identity: "entity_backed:Retailer"
    exclusive_operations:
      - "POST /plant/returns"
      - "POST /plant/warranty-claims"
    shared_operations:
      - "POST /plant/production-orders (only with retailer_id == own X-User-ID)"
      - "All GET endpoints"

  - name: LogisticsCoordinator
    description: "Shipping and reverse-logistics coordinator; creates/dispatches/delivers shipments and records recycling take-back intakes"
    identity: opaque
    exclusive_operations:
      - "POST /plant/shipments + dispatch + deliver"
      - "POST /plant/recycling-intakes"
    shared_operations:
      - "All GET endpoints"
