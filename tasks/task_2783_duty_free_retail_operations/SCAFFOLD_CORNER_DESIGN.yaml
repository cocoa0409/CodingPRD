          assert:
            - "Sale.${sale_104}.sealed_bag_required == true"
            - "Sale.${sale_104}.gross_amount_cents == 44000"
            - "Sale.${sale_104}.arrival_advisory has exactly 2 entries, one per distinct category"
            - "the bag create returns HTTP 201"
            - "SealedBag.${bag_1}.status == ISSUED"
            - "SealedBag.${bag_1}.terminal_id == ${t_hkg}"
            - "SealedBag.${bag_1}.total_liquid_ml == 2100"
            - "SealedBag.${bag_1}.expires_at == 2026-08-09T10:00:00Z"
            - "SealedBag.${bag_1}.issued_at == 2026-08-01T00:00:00Z"
            - "SealedBag.${bag_1}.verified_at == null"

      - claim_type: precondition_enforcement
        name: pickup_is_blocked_until_a_required_sealed_bag_is_intact_verified
        grounds:
          - validations[priority=68]
          - errors.ERR_SEALED_BAG_REQUIRED
          - state_machines.SealedBag.ISSUED_to_INTACT_VERIFIED
          - state_machines.Sale.ELIGIBILITY_CLEARED_to_PICKED_UP
        distinguishing_aspect: |
          An ISSUED bag is NOT enough: pickup on a sale with sealed_bag_required true MUST fail with 409
          ERR_SEALED_BAG_REQUIRED until the bag reaches INTACT_VERIFIED, and it MUST succeed immediately
          afterwards. Implementations that check merely for the EXISTENCE of a bag let an unverified bag
          through.
