            - { call: "POST /geo/borings/${b1_id}/samples", payload: { depth_top_ft: 10, depth_bottom_ft: 11.5, sampler_type: "SHELBY", recovery_pct: 95 }, as: FieldGeologist, captures: { sm_id: "$.data.id" } }
            - { call: "POST /geo/samples/${sm_id}/transition", payload: { to: "IN_TRANSIT" }, as: FieldGeologist }
            - { call: "POST /geo/samples/${sm_id}/transition", payload: { to: "LAB_RECEIVED" }, as: LabTechnician }
            - { call: "POST /geo/projects/${p_id}/lab-test-orders", payload: { sample_id: "${sm_id}", test_type: "UNCONFINED_COMPRESSION", priority: "STANDARD" }, as: LabManager, captures: { o_id: "$.data.id" } }
            - { call: "POST /geo/lab-test-orders/${o_id}/transition", payload: { to: "AUTHORIZED" }, as: LabManager }
            - { call: "POST /geo/lab-test-orders/${o_id}/transition", payload: { to: "IN_TEST" }, as: LabTechnician }
            - { call: "POST /geo/lab-test-orders/${o_id}/results", payload: { qu_psf: 4000 }, as: LabTechnician }
            - { call: "POST /geo/lab-test-orders/${o_id}/transition", payload: { to: "ACCEPTED" }, as: LabManager }
            - { call: "POST /geo/projects/${p_id}/foundation-analyses", payload: { method: "ALLOWABLE_STRESS", fs_required: 3.0, footing_width_ft: 6, applied_bearing_psf: 3000 }, as: SeniorEngineer, captures: { a_id: "$.data.id" } }
            - { call: "POST /geo/foundation-analyses/${a_id}/transition", payload: { to: "VERIFIED" }, as: SeniorEngineer, captures: { a_ds0: "$.data.data_status" } }
          trigger:
            - { call: "POST /geo/rig-assignments/${ra2_id}/transition", payload: { to: "MOBILIZED" }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "POST /geo/borings/${b2_id}/transition", payload: { to: "CLEARED" }, as: StaffEngineer }
            - { call: "POST /geo/borings/${b2_id}/transition", payload: { to: "DRILLED", actual_depth_ft: 30, rock_depth_ft: 0, groundwater_depth_ft: 14, avg_n60: 12 }, as: DrillingSub, as_user_id: "${s_id}" }
            - { call: "GET /geo/foundation-analyses/${a_id}", payload: {}, as: SeniorEngineer, captures: { a_ds1: "$.data.data_status" } }
            - { call: "POST /geo/foundation-analyses/${a_id}/transition", payload: { to: "VERIFIED" }, as: SeniorEngineer, captures: { a_ds2: "$.data.data_status", a_fin2: "$.data.bearing_capacity_final_psf" } }
          assert:
            - "captured a_ds0 == CURRENT"
            - "captured a_ds1 == STALE (new DRILLED boring invalidated the verified analysis)"
            - "captured a_ds2 == CURRENT and a_fin2 == 6000 (refresh recomputed over both borings; n60 mean still 12)"

