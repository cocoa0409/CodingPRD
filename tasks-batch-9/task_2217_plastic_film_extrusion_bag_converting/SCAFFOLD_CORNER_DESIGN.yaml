            - "BagLot.${bl1}.seal_provisional_mean_n == 21.00 and seal_provisional_verdict == FAIL"
            - "BagLot.${bl1}.seal_final_min_n == null, seal_final_mean_n == null, seal_final_verdict == null"
            - "BagLot.${bl1}.seal_specimens holds 3 rows, all with is_retest == false and attempt == 1"
      - name: gauge_capability_is_withheld_until_the_fifth_reading_lands
        claim_type: chronological
        grounds:
          - calculations.gauge_capability
          - calculations.gauge_capability.constants.MIN_GAUGE_SAMPLES
          - entities.ExtrusionRun.fields.gauge_capability_state
        distinguishing_aspect: "The reading set is processed in append order with no recency filtering, and the whole capability block is withheld while n < 5: the fourth reading leaves the index null and the state INSUFFICIENT_DATA, and the fifth writes index, mean, sd and cv in one step."
        test_recipe:
          setup:
            - "RUN-NF-1 RUNNING with exactly four 40.0 micron readings recorded"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
            - *a_r0_app
            - *a_run1_new
            - *a_run1_start
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
            - *a_g1_40
          trigger:
            - { call: "GET /extrusion-runs/${run1}", payload: {}, as: ExtrusionOperator }
            - { call: "POST /extrusion-runs/${run1}/gauge-readings", payload: { thickness_micron: 40.0 }, as: ExtrusionOperator }
          assert:
            - "the GET shows ExtrusionRun.${run1}.gauge_sample_count == 4, gauge_capability_index == null, gauge_capability_state == INSUFFICIENT_DATA"
            - "the fifth POST -> 201 and ExtrusionRun.${run1}.gauge_sample_count == 5"
            - "ExtrusionRun.${run1}.gauge_capability_index == 4.000 (sd == 0 takes CPK_CEILING) and gauge_capability_state == CAPABLE"
            - "ExtrusionRun.${run1}.gauge_mean_micron == 40.000, gauge_sd_micron == 0.0000, gauge_cv_pct == 0.000"
            - "ExtrusionRun.${run1}.status is still RUNNING"
