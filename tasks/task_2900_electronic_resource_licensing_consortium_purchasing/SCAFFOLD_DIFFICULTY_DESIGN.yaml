            - "Vendor Atlas Scholarly, Member Alpha College with budget_ceiling_cents 40000000, and four products each priced at a participant-count-1 share of 4500000 cents."
            - "Each product gets its own ENDORSED trial for Alpha, an AGREED negotiation at 9000000 cents for the term 2027-01-01..2027-12-31, a pledge and a signature, producing four subscriptions whose windows [2027-01-01, 2027-12-31] all intersect."
            - "Three SHIBBOLETH auth configs bound to realm SHIB-EDU-1 are created on the first three subscriptions and left PENDING - PENDING and VERIFIED both count towards the capacity."
            - "The clock is never advanced, so all four subscriptions stay PENDING_ACTIVATION; auth config creation has no contract-state gate."
