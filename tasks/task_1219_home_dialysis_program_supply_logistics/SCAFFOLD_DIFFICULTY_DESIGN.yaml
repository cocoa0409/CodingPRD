  # ------------------------------------------------------------------ RULE 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: slot_booking_blocked_by_expired_plan_then_allowed_after_drill
        grounds:
          - state_machines.EmergencyBackupPlan.ACTIVE_to_EXPIRED
          - state_machines.EmergencyBackupPlan.EXPIRED_to_ACTIVE
          - entities.BackupSlotReservation.fields.status
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair BackupSlotReservation -> EmergencyBackupPlan: once the logical clock passes
          last_drill_at + 90 days the plan lazily flips to EXPIRED and slot creation fails with
          ERR_PLAN_NOT_ACTIVE even though the patient is ACTIVE_HOME; a drill flips the plan back to
          ACTIVE and the identical slot then books.
        test_recipe:
          setup:
            - "ACTIVE_HOME patient (readiness chain completed at clock 2026-05-01) with ACTIVE plan and chair CH-1"
            - "clock advanced to 2026-08-05 (96 days after the plan's creation drill — beyond 90-day validity)"
          setup_api_calls:
            - { call: "POST /api/dialysis-programs", payload: { name: "HD Program N", review_cadence_treatments: 2, max_missed_log_streak: 3, waste_ratio_alert_threshold: 0.1, supply_catalog: [ { sku: "DIALYSATE_2L", name: "Dialysate 2L bag", unit_price_cents: 1200, handling_rate_cents: 10.5, unit_credit_cents: 300 } ] }, as: ProgramAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/patients", payload: { program_id: "${prog}", full_name: "Pat Fourteen", prescription_treatments_per_week: 3, prescription_units_per_treatment: 6 }, as: HomeNurse, as_user_id: "nurse-1", captures: { pat: $.data.id } }
