              as: BranchManager
              captures: { conflict_error: $.data.error_id }
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "EXPIRED" }
              as: ComplianceOfficer
            - call: "POST /inspectors/${insb}/license-status"
              payload: { status: "ACTIVE", license_expires_on: "2029-06-30", ce_credits: 12 }
              as: ComplianceOfficer
            - call: "POST /bond-renewals/${ren1}/complete"
              payload: { inspection_id: "${rins}", amount_usd: 100.00 }
              as: BranchManager
              captures: { money_error: $.data.error_id }
            - call: "POST /bond-renewals/${ren1}/complete"
              payload: { inspection_id: "${rins}", amount_usd: 227.19 }
              as: BranchManager
          assert:
            - "both rules are genuinely violated by the first call: Inspector.${insb}.license_expires_on 2027-08-31 < clock date 2027-09-04, AND amount_usd 100.00 < the FINAL_AT_COMPLETION total 227.19"
            - "the first call returns ERR_LICENSE_EXPIRED with HTTP 409 — priority 92 wins over priority 130"
            - "the first call returns exactly one error_id: ERR_PAYMENT_INSUFFICIENT must NOT appear in the response"
            - "rule 90 did not fire: Inspector.${insb}.status was ACTIVE, so ERR_LICENSE_NOT_ACTIVE is not the answer either"
            - "the first call is a pure rejection: BondRenewal.${ren1}.status is still PENDING, inspection_id still null, invoice_total_usd still the provisional 211.27, and Bond.${bond1}.term_index is still 1"
            - "after the licence is cycled ACTIVE -> EXPIRED -> ACTIVE with license_expires_on 2029-06-30 and ce_credits 12, only the fiscal violation remains"
            - "the second 100.00 call now returns ERR_PAYMENT_INSUFFICIENT with HTTP 402, proving rule 130 was reachable all along and was merely out-ranked"
            - "the 227.19 call then succeeds: BondRenewal.${ren1}.status == PAID, amount_paid_usd == 227.19, invoice_total_usd == 227.19"
            - "priority distance: 92 and 130 are 38 apart with rules 94-121 in between, none of which the first call violates"

