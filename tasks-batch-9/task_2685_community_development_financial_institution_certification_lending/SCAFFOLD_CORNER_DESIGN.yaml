            - call: "POST /cdfi/institutions/${inst_id}/compliance-measurements"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", weighting_basis: "DOLLAR_WEIGHTED" }
              as: ComplianceAnalyst
