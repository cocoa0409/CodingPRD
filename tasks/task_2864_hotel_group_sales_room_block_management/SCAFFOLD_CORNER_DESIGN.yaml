          rn_short: $.data.room_nights_basis_shortfall, rn_dmg: $.data.room_nights_basis_damages_cents,
          pk_short: $.data.peak_night_basis_shortfall, pk_dmg: $.data.peak_night_basis_damages_cents}
      assert:
      - res_status == PENDING
      - e_skip == ERR_RESERVATION_INVALID_STATE with HTTP 409 (PENDING -> CHECKED_IN is not declared)
      - confirmed == CONFIRMED
      - e_late_cancel == ERR_CANCEL_AFTER_ARRIVAL with HTTP 422 — priority 14 does not apply to cancel
      - no_show == NO_SHOW
      - picked == 0 and peak == 0 (a NO_SHOW leaves the PICKUP set)
      - base == 12 and rn_short == 8 (commitment ceil(12 * 0.75) = 9 minus 1 actualized room night)
      - rn_dmg == 141984 (round_half_up(8 * 20880 * 0.85))
      - pk_short == 6 (peak commitment ceil(4 * 0.75) = 3, peak actual 1, shortfall 2 rooms * 3 nights)
      - pk_dmg == 106488 (round_half_up(6 * 20880 * 0.85))
  - name: function_space_release_is_terminal_and_frees_the_slot
