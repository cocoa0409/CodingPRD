            - "${wcs_err} == ERR_INVALID_CLAIM_STATE with HTTP 409, NOT ERR_REVIEW_OUTCOME_CONFLICT"
            - "${wcr_err} == ERR_INVALID_CLAIM_STATE as well — reviews are only accepted from TRIAGE"
            - "GET /warranty-claims/${wc_raw_id} still reports status SUBMITTED with settlement_amount_cents null"

      - name: release_hold_while_the_run_is_quarantined_returns_run_not_released
        claim_type: violation_to_error
        grounds:
          - "validations.V-XSTATE-4"
          - "errors.ERR_RUN_NOT_RELEASED"
          - "state_machines.ProductionRun qc_disposition=PENDING -> QUARANTINED"
        distinguishing_aspect: |
          The batch is genuinely HELD and a DIFFERENT QA technician asks for the release, so
          both the own-state band and the SoD band are satisfied; the only remaining obstacle
          is the producing run's QC disposition one hop away. Stock quarantined by QC cannot be
          freed by a hold release — it has to go through the QC endpoint.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - call: "POST /production-runs/${run_a1_id}/qc-disposition"
              payload: { to_disposition: QUARANTINED, hold_reason: "Awaiting second curl reading" }
              as: QaTechnician
              as_user_id: "qa-002"
              captures: { q_disp: $.data.qc_disposition }
            - *batchA1Get
          trigger:
            - call: "POST /batches/${batch_a1_id}/hold-status"
              payload: { action: RELEASE_HOLD }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { rh_err: $.data.error_id }
          assert:
            - "${q_disp} == QUARANTINED and ${batch_a1_status} == HELD with hold_reason 'QC_QUARANTINE' and held_by_user_id 'qa-002'"
            - "${rh_err} == ERR_RUN_NOT_RELEASED with HTTP 409"
            - "it is NOT ERR_INVALID_BATCH_STATE (the batch is HELD, which is the declared from-state) and NOT ERR_SEGREGATION_OF_DUTIES (qa-001 is not the holder qa-002)"
            - "GET /batches/${batch_a1_id} still reports status HELD with available_quantity_sqm 0.00"

      - name: lapsed_dcof_qualification_returns_slip_resistance_not_qualified
        claim_type: violation_to_error
        grounds:
          - "validations.V-SAFE-1"
          - "errors.ERR_SLIP_RESISTANCE_NOT_QUALIFIED"
          - "calculations.sku_required_test_types"
        distinguishing_aspect: |
          The rule stays reachable AFTER a waterproof SKU has legitimately qualified: the DCOF
          result is real and passing, but it ages out 180 days later, and the age is read at
          start rather than at creation. So a run planned and set up without complaint is
          stopped on the final hop.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *licWp
            - *pfWp
            - *skuW
            - *skuWBegin
            - *tpW1
            - *tpW1Start
            - &tpW1Ind
              call: "POST /test-panels/${tp_w1_id}/results"
              payload: { test_type: RESIDUAL_INDENTATION, measured_value: 0.0800 }
              as: QaTechnician
              as_user_id: "qa-001"
            - &tpW1Dim
              call: "POST /test-panels/${tp_w1_id}/results"
              payload: { test_type: DIMENSIONAL_STABILITY_HEAT, measured_value: 0.1000 }
              as: QaTechnician
              as_user_id: "qa-001"
            - &tpW1Slip
              call: "POST /test-panels/${tp_w1_id}/results"
              payload: { test_type: SLIP_RESISTANCE, measured_value: 0.5000 }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { slip_limit: $.data.spec_limit, slip_outcome: $.data.outcome }
            - &tpW1Peel
              call: "POST /test-panels/${tp_w1_id}/results"
              payload: { test_type: PEEL_ADHESION_DELAMINATION, measured_value: 40.0000 }
              as: QaTechnician
              as_user_id: "qa-001"
            - &tpW1Lock
              call: "POST /test-panels/${tp_w1_id}/results"
              payload: { test_type: LOCK_SHEAR, measured_value: 9.0000 }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { lock_limit: $.data.spec_limit, lock_outcome: $.data.outcome }
            - call: "GET /test-panels/${tp_w1_id}"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tpw1_final_status: $.data.status }
            - *pl1
            - &runW1
              call: "POST /production-runs"
              payload: { run_code: "RUN-W1", sku_id: "${sku_w_id}", press_line_id: "${pl1_id}", planned_start_utc: "2027-02-01T01:00:00Z", planned_end_utc: "2027-02-01T02:00:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_w1_id: $.data.id }
            - &clock2027Feb
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T00:30:00Z" }
              as: PlantAdmin
              as_user_id: "pa-001"
            - call: "POST /production-runs/${run_w1_id}/setup"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_w1_setup: $.data.run_status }
          trigger:
            - call: "POST /production-runs/${run_w1_id}/start"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { slip_err: $.data.error_id }
          assert:
            - "${slip_limit} == 0.42 (waterproof) and ${slip_outcome} == PASS at 0.5000; ${lock_limit} == 8.00 with ${lock_outcome} == PASS, ${tpw1_final_status} == PASSED, so SKU-W really did qualify and reached PROVISIONAL"
            - "${run_w1_setup} == SETUP — creation and setup are unaffected, because V-SAFE-1 applies only to start"
            - "${slip_err} == ERR_SLIP_RESISTANCE_NOT_QUALIFIED with HTTP 422: the panel's updated_at 2026-08-01 is older than 2027-02-01T00:30 minus 180 days == 2026-08-05T00:30"
            - "GET /production-runs/${run_w1_id} still reports run_status SETUP, and the licence's reserved_volume_sqm is still 100.00 — nothing was consumed"

      - name: approving_a_class_23_31_recipe_returns_indentation_class_too_low
        claim_type: violation_to_error
        grounds:
          - "validations.V-CON-2"
          - "errors.ERR_INDENTATION_CLASS_TOO_LOW"
          - "calculations.formulation_blend_metrics"
        distinguishing_aspect: |
          A heavily chalk-filled recipe that comfortably CLEARS the 60.00 score floor at 71.87
          and is still refused, because the indentation class is derived from the raw blended
          index rather than from the score. The two P12 rules are therefore independent, and
          this fixture isolates the second one.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - &rmCaco3
              call: "POST /raw-materials"
              payload: { material_code: "RM-CACO3", name: "Ground Calcium Carbonate", category: FILLER, cost_per_kg_cents: 30, indentation_index: 30, thermal_stability_index: 88, plasticizer_migration_index: 1, max_phr: 400 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rm_caco3_id: $.data.id }
            - &fchalk
              call: "POST /formulations"
              payload: { formulation_code: "F-CHALK" }
              as: Formulator
              as_user_id: "form-001"
              captures: { f_chalk_id: $.data.id }
            - call: "POST /formulations/${f_chalk_id}/components"
              payload: { raw_material_id: "${rm_resin_id}", phr: 100.00 }
              as: Formulator
              as_user_id: "form-001"
            - call: "POST /formulations/${f_chalk_id}/components"
              payload: { raw_material_id: "${rm_caco3_id}", phr: 200.00 }
              as: Formulator
              as_user_id: "form-001"
            - call: "GET /formulations/${f_chalk_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { chalk_score: $.data.performance_score, chalk_class: $.data.indentation_resistance_class }
            - call: "POST /formulations/${f_chalk_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
          trigger:
            - call: "POST /formulations/${f_chalk_id}/review-decision"
              payload: { decision: APPROVE, review_note: "Cost target met" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { chalk_err: $.data.error_id }
          assert:
            - "${chalk_score} == 71.87 (raw 74.866667 less a 3-point brittleness penalty for filler_ratio exactly 2.0000) and ${chalk_class} == CLASS_23_31 from blended_indentation 50.000000"
            - "${chalk_err} == ERR_INDENTATION_CLASS_TOO_LOW with HTTP 422, NOT ERR_PERFORMANCE_SCORE_BELOW_MINIMUM — 71.87 clears the 60.00 floor"
            - "GET /formulations/${f_chalk_id} still reports status UNDER_REVIEW: a refused approval does not reject the recipe"

      - name: submit_without_normalised_resin_returns_resin_phr_not_normalized
        claim_type: violation_to_error
        grounds:
          - "validations.V-CON-3"
          - "errors.ERR_RESIN_PHR_NOT_NORMALIZED"
          - "calculations.formulation_blend_metrics.output resin_phr"
        distinguishing_aspect: |
          phr is a ratio TO the resin, so the whole calculation is meaningless unless the resin
          sums to exactly 100.00. Both failure modes of the same rule are covered: 90.00 phr of
          resin, and a recipe with no components at all whose resin_phr is 0.00.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - &fbad
              call: "POST /formulations"
              payload: { formulation_code: "F-BAD" }
              as: Formulator
              as_user_id: "form-001"
              captures: { f_bad_id: $.data.id }
            - call: "POST /formulations/${f_bad_id}/components"
              payload: { raw_material_id: "${rm_resin_id}", phr: 90.00 }
              as: Formulator
              as_user_id: "form-001"
            - call: "GET /formulations/${f_bad_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { bad_resin: $.data.resin_phr }
            - &fempty
              call: "POST /formulations"
              payload: { formulation_code: "F-EMPTY" }
              as: Formulator
              as_user_id: "form-001"
              captures: { f_empty_id: $.data.id, empty_total: $.data.total_phr }
          trigger:
            - call: "POST /formulations/${f_bad_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { bad_err: $.data.error_id }
            - call: "POST /formulations/${f_empty_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { empty_err: $.data.error_id }
          assert:
            - "${bad_resin} == 90.00 and ${empty_total} == 0.00"
            - "${bad_err} == ERR_RESIN_PHR_NOT_NORMALIZED with HTTP 422"
            - "${empty_err} == ERR_RESIN_PHR_NOT_NORMALIZED as well — the no-components clause shares the code"
            - "both recipes still report status DRAFT, so the submit is refused rather than partially applied"

      - name: duplicate_natural_key_and_repeated_material_return_duplicate_code
        claim_type: violation_to_error
        grounds:
          - "validations.V-CON-5"
          - "errors.ERR_DUPLICATE_CODE"
        distinguishing_aspect: |
          One code covers two different kinds of uniqueness: eleven collection-level natural
          keys AND the junction-level rule that one raw material may appear at most once in a
          recipe. The second clause is what stops a formulator from splitting a charge into two
          rows to dodge the per-material ceiling.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *fmin
            - *fminC1
          trigger:
            - call: "POST /raw-materials"
              payload: { material_code: "RM-RESIN", name: "Suspension PVC K67 (second source)", category: VINYL_RESIN, cost_per_kg_cents: 175, indentation_index: 90, thermal_stability_index: 85, plasticizer_migration_index: 5, max_phr: 100 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { dup_rm_err: $.data.error_id }
            - call: "POST /formulations"
              payload: { formulation_code: "F-MIN" }
              as: Formulator
              as_user_id: "form-001"
              captures: { dup_form_err: $.data.error_id }
            - call: "POST /formulations/${f_min_id}/components"
              payload: { raw_material_id: "${rm_resin_id}", phr: 40.00 }
              as: Formulator
              as_user_id: "form-001"
              captures: { dup_comp_err: $.data.error_id }
          assert:
            - "${dup_rm_err} == ERR_DUPLICATE_CODE with HTTP 409 and GET /raw-materials returns total_count 1 with cost_per_kg_cents still 180"
            - "${dup_form_err} == ERR_DUPLICATE_CODE for the repeated formulation_code"
            - "${dup_comp_err} == ERR_DUPLICATE_CODE — the recipe already references ${rm_resin_id}, and 100.00 + 40.00 would have been within the 100 max_phr per row while breaking it in aggregate"
            - "GET /formulations/${f_min_id} still reports resin_phr 100.00"

      - name: sku_thinner_than_the_line_minimum_returns_thickness_out_of_line_range
        claim_type: violation_to_error
        grounds:
          - "validations.V-CON-6"
          - "errors.ERR_THICKNESS_OUT_OF_LINE_RANGE"
          - "entities.PressLine.fields.min_thickness_mm"
        distinguishing_aspect: |
          A capability mismatch between two rows that are each perfectly valid: the 2.50 mm
          plank cannot be pressed on a multi-day press whose range starts at 6.00 mm. The rule
          reads the SKU through the run's sku_id, so nothing in the run payload itself is wrong.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - &pl2
              call: "POST /press-lines"
              payload: { line_code: "PL-2", line_type: MULTI_DAY_PRESS, min_thickness_mm: 6.00, max_thickness_mm: 8.00, changeover_minutes: 90, curl_control_index: 95 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pl2b_id: $.data.id }
          trigger:
            - call: "POST /production-runs"
              payload: { run_code: "RUN-THIN", sku_id: "${sku_a_id}", press_line_id: "${pl2b_id}", planned_start_utc: "2026-08-01T01:00:00Z", planned_end_utc: "2026-08-01T02:00:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { thin_err: $.data.error_id }
          assert:
            - "${thin_err} == ERR_THICKNESS_OUT_OF_LINE_RANGE with HTTP 422 — SKU-A's overall_thickness_mm 2.50 is below PL-2's min_thickness_mm 6.00"
            - "the identical payload against PL-1 (range 1.50 to 8.00) is accepted, so the refusal is attributable to the line and not to the run"
            - "GET /production-runs?press_line_id=${pl2b_id} returns total_count 0"

      - name: refilling_a_satisfied_allocation_returns_allocation_over_request
        claim_type: violation_to_error
        grounds:
          - "validations.V-CON-9"
          - "errors.ERR_ALLOCATION_OVER_REQUEST"
          - "validations.V-STATE-9 (FILLED deliberately excluded from its from-set)"
        distinguishing_aspect: |
          A FILLED allocation is explicitly NOT rejected by the lifecycle band, so this code is
          only reachable when the OCC version is correct, the SKU is still RELEASED and stock is
          still available. Everything else about the request is legal; the only fault is that
          the remaining requirement is 0.00.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *dist
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - *skuARelease
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - *qcRelease
            - *batchA1Get
            - *alloc1
            - *alloc1Fill
            - call: "GET /allocations/${alloc1_id}"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { alloc1_v2: $.data.version, alloc1_filled_status: $.data.status }
          trigger:
            - call: "POST /allocations/${alloc1_id}/fill"
              payload: { expected_allocation_version: "${alloc1_v2}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { over_err: $.data.error_id }
          assert:
            - "${alloc1_filled_status} == FILLED and ${alloc1_v2} == 2 after the first fill"
            - "${over_err} == ERR_ALLOCATION_OVER_REQUEST with HTTP 422"
            - "it is NOT ERR_INVALID_ALLOCATION_STATE (FILLED is not in V-STATE-9's from-set), NOT ERR_STALE_ALLOCATION_VERSION (the version is current) and NOT ERR_NO_ELIGIBLE_BATCH (1100.00 sqm of stock remains)"
            - "GET /batches/${batch_a1_id} still reports available_quantity_sqm 1100.00 and GET /allocations/${alloc1_id}/lines still total_count 1"

      - name: begin_testing_on_a_draft_recipe_returns_formulation_not_approved
        claim_type: violation_to_error
        grounds:
          - "validations.V-REF-1"
          - "errors.ERR_FORMULATION_NOT_APPROVED"
        distinguishing_aspect: |
          A SKU may be created against an unapproved recipe — nothing stops it — so the
          referential gate lands one step later, at the moment testing begins. The SKU's own
          certification_status is a perfectly valid UNCERTIFIED, so V-STATE-3 cannot mask it.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmSoft
            - *rmFiller
            - *fstd
            - *fstdC1
            - *fstdC2
            - *fstdC3
            - *lic
            - *pf1
            - call: "POST /product-skus"
              payload: { sku_code: "SKU-DRAFT", formulation_id: "${f_std_id}", print_film_id: "${pf1_id}", construction_type: GLUE_DOWN, wear_layer_mil: 12, overall_thickness_mm: 2.50, royalty_basis_price_cents_per_sqm: 2000 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { sku_draft_id: $.data.id, sku_draft_cert: $.data.certification_status }
          trigger:
            - call: "POST /product-skus/${sku_draft_id}/begin-testing"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { draft_err: $.data.error_id }
          assert:
            - "${sku_draft_id} is created successfully with ${sku_draft_cert} == UNCERTIFIED — an unapproved recipe does not block SKU creation"
            - "${draft_err} == ERR_FORMULATION_NOT_APPROVED with HTTP 409, not ERR_INVALID_SKU_CERTIFICATION_STATE"
            - "GET /product-skus/${sku_draft_id} still reports certification_status UNCERTIFIED"

      - name: run_creation_on_a_restricted_film_returns_print_film_not_available
        claim_type: violation_to_error
        grounds:
          - "validations.V-REF-3"
          - "errors.ERR_PRINT_FILM_NOT_AVAILABLE"
        distinguishing_aspect: |
          Restricting a film is a design-library decision that does not touch the SKU's own two
          status dimensions, so the SKU stays at TESTING and V-XSTATE-2 passes; the refusal has
          to come from the film one hop away, at the referential band.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *pl1
            - call: "POST /print-films/${pf1_id}/status"
              payload: { to_status: RESTRICTED }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pf1_restricted: $.data.status }
          trigger:
            - call: "POST /production-runs"
              payload: { run_code: "RUN-NOFILM", sku_id: "${sku_a_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T01:00:00Z", planned_end_utc: "2026-08-01T02:00:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { nofilm_err: $.data.error_id }
          assert:
            - "${pf1_restricted} == RESTRICTED while GET /product-skus/${sku_a_id} still reports certification_status TESTING and commercial_status DEVELOPMENT"
            - "${nofilm_err} == ERR_PRINT_FILM_NOT_AVAILABLE with HTTP 409"
            - "GET /design-licenses/${lic_id}/utilization reports reserved_volume_sqm 0.00 — no reservation was taken"

      - name: creating_a_film_under_a_suspended_grant_returns_license_not_active
        claim_type: violation_to_error
        grounds:
          - "validations.V-REF-4"
          - "errors.ERR_LICENSE_NOT_ACTIVE"
        distinguishing_aspect: |
          V-REF-4 guards five endpoints; this instance takes the one where the licence is
          addressed by a BODY key rather than reached through a SKU, so the code cannot be
          confused with the license's own V-STATE-2 (nothing is being asked of the grant itself).
        test_recipe:
          setup_api_calls:
            - *clock0
            - *lic
            - call: "POST /design-licenses/${lic_id}/status"
              payload: { to_status: SUSPENDED }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { lic_susp2: $.data.status }
          trigger:
            - call: "POST /print-films"
              payload: { design_code: "PF-OAK-1500", license_id: "${lic_id}", pattern_repeat_mm_length: 1500, pattern_repeat_mm_width: 200, registration_tolerance_mm: 0.25, emboss_plate_code: "EP-OAK-C", emboss_alignment_offset_mm: 0.10, master_roll_sets: 1 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { film_err: $.data.error_id }
          assert:
            - "${lic_susp2} == SUSPENDED"
            - "${film_err} == ERR_LICENSE_NOT_ACTIVE with HTTP 409, not ERR_INVALID_LICENSE_STATE"
            - "GET /print-films?license_id=${lic_id} returns total_count 0"

      - name: claim_on_stock_still_in_production_returns_batch_not_traceable
        claim_type: violation_to_error
        grounds:
          - "validations.V-REF-5"
          - "errors.ERR_BATCH_NOT_TRACEABLE"
          - "entities.Batch.fields.traceability_snapshot"
        distinguishing_aspect: |
          The traceability snapshot is already written — it is minted with the batch — yet a
          claim is still refused while the batch sits at IN_PRODUCTION, because material that
          never passed QC cannot found a field claim. Only the batch's status distinguishes this
          fixture from a valid claim.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *dist
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - *batchA1Get
          trigger:
            - call: "POST /warranty-claims"
              payload: { claim_code: "WC-UNTRACEABLE", batch_id: "${batch_a1_id}", distributor_id: "${dist_id}", claim_type: DELAMINATION, claimed_area_sqm: 10.00, installed_on: "2026-08-05T00:00:00Z", reported_on: "2027-08-05T00:00:00Z" }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
              captures: { trace_err: $.data.error_id }
          assert:
            - "${batch_a1_status} == IN_PRODUCTION with a fully populated traceability_snapshot and available_quantity_sqm 0.00"
            - "${trace_err} == ERR_BATCH_NOT_TRACEABLE with HTTP 409"
            - "after POST /production-runs/${run_a1_id}/qc-disposition { to_disposition: RELEASED } the identical claim payload is accepted, so the batch status is the sole cause"

      - name: filling_against_empty_stock_returns_no_eligible_batch
        claim_type: violation_to_error
        grounds:
          - "validations.V-REF-7"
          - "errors.ERR_NO_ELIGIBLE_BATCH"
          - "calculations.allocation_fill_plan step (1)"
        distinguishing_aspect: |
          The candidate set is empty because nothing was ever produced, which separates this
          code from the FILLED case: the allocation is OPEN, the version is current and the SKU
          is RELEASED, so every band above P14 is satisfied and only the search comes up empty.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *dist
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - *skuARelease
            - &allocEmpty
              call: "POST /allocations"
              payload: { allocation_code: "ALLOC-EMPTY", distributor_id: "${dist_id}", sku_id: "${sku_a_id}", requested_quantity_sqm: 25.00 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { alloc_e_id: $.data.id, alloc_e_v1: $.data.version, alloc_e_status: $.data.status }
          trigger:
            - call: "POST /allocations/${alloc_e_id}/fill"
              payload: { expected_allocation_version: "${alloc_e_v1}" }
              as: Distributor
              as_user_id: "${dist_id}"
              captures: { empty_fill_err: $.data.error_id }
          assert:
            - "${alloc_e_status} == OPEN with allocated_quantity_sqm 0.00 and ${alloc_e_v1} == 1"
            - "${empty_fill_err} == ERR_NO_ELIGIBLE_BATCH with HTTP 409"
            - "GET /batches?sku_id=${sku_a_id} returns total_count 0, and GET /allocations/${alloc_e_id} still reports status OPEN with an unchanged version"

      - name: approving_over_a_no_defect_review_returns_review_outcome_conflict
        claim_type: violation_to_error
        grounds:
          - "validations.V-REF-8"
          - "errors.ERR_REVIEW_OUTCOME_CONFLICT"
          - "state_machines.WarrantyClaim TRIAGE -> ADJUDICATION_READY (join)"
        distinguishing_aspect: |
          The join into ADJUDICATION_READY only requires both reviews to be ANSWERED, not to
          agree, so a claim can legitimately reach the adjudicable state carrying a NO_DEFECT
          finding — and the approval is then refused while a DENY on the same claim succeeds.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *dist
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - *qcRelease
            - *batchA1Get
            - *clock2029
            - *wcRaw
            - call: "POST /warranty-claims/${wc_raw_id}/triage"
              payload: {}
              as: WarrantyAdjuster
              as_user_id: "adj-001"
              captures: { wc_triaged_reviews: $.data.required_reviews }
            - call: "POST /warranty-claims/${wc_raw_id}/reviews"
              payload: { review_kind: MATERIALS, outcome: DEFECT_CONFIRMED }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
            - call: "POST /warranty-claims/${wc_raw_id}/reviews"
              payload: { review_kind: FIELD, outcome: NO_DEFECT, note: "Installed over an unlevelled slab" }
              as: WarrantyAdjuster
              as_user_id: "adj-001"
              captures: { wc_join_status: $.data.status }
          trigger:
            - call: "POST /warranty-claims/${wc_raw_id}/adjudicate"
              payload: { decision: APPROVE }
              as: WarrantyAdjuster
              as_user_id: "adj-002"
              captures: { conflict_err: $.data.error_id }
            - call: "POST /warranty-claims/${wc_raw_id}/adjudicate"
              payload: { decision: DENY, denial_reason: "Field review found no manufacturing defect" }
              as: WarrantyAdjuster
              as_user_id: "adj-002"
              captures: { deny_status: $.data.status, deny_amount: $.data.settlement_amount_cents }
          assert:
            - "${wc_triaged_reviews} == [MATERIALS, FIELD] and ${wc_join_status} == ADJUDICATION_READY even though the two findings disagree"
            - "${conflict_err} == ERR_REVIEW_OUTCOME_CONFLICT with HTTP 409"
            - "${deny_status} == DENIED and ${deny_amount} == null — a DENY is not gated by V-REF-8"

      - name: term_cap_admits_exact_equality_then_returns_license_volume_cap_exceeded
        claim_type: violation_to_error
        grounds:
          - "validations.V-FISC-1"
          - "validations.V-FISC-2"
          - "errors.ERR_LICENSE_VOLUME_CAP_EXCEEDED"
          - "calculations.license_volume_ledger"
        distinguishing_aspect: |
          Two rules share the code and are exercised from the same ledger state: reservations
          summing to EXACTLY the 2000.00 cap are admitted, one further hundredth of a square
          metre is refused, and an amendment that would set the cap below what is already
          committed is refused with the same code from the opposite direction.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *pl1
            - call: "POST /production-runs"
              payload: { run_code: "RUN-CAP-1", sku_id: "${sku_a_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T01:00:00Z", planned_end_utc: "2026-08-01T02:00:00Z", planned_quantity_sqm: 1500.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { cap1_id: $.data.id }
          trigger:
            - call: "POST /production-runs"
              payload: { run_code: "RUN-CAP-2", sku_id: "${sku_a_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T03:00:00Z", planned_end_utc: "2026-08-01T04:00:00Z", planned_quantity_sqm: 500.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { cap2_status: $.data.run_status }
            - call: "POST /production-runs"
              payload: { run_code: "RUN-CAP-3", sku_id: "${sku_a_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T05:00:00Z", planned_end_utc: "2026-08-01T06:00:00Z", planned_quantity_sqm: 0.01 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { cap3_err: $.data.error_id }
            - call: "POST /design-licenses/${lic_id}/amendments"
              payload: { license_code: "LIC-OAK-A2", term_volume_cap_sqm: 1000.00, amendment_note: "Attempted downward revision" }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { cap4_err: $.data.error_id }
          assert:
            - "${cap2_status} == PLANNED — 0.00 consumed + 1500.00 reserved + 500.00 planned == exactly the 2000.00 cap, and equality is admitted"
            - "${cap3_err} == ERR_LICENSE_VOLUME_CAP_EXCEEDED with HTTP 422 for a further 0.01 sqm"
            - "${cap4_err} == ERR_LICENSE_VOLUME_CAP_EXCEEDED as well, from V-FISC-2: a 1000.00 cap is below the 2000.00 already committed"
            - "GET /design-licenses/${lic_id}/utilization reports reserved_volume_sqm 2000.00, remaining_volume_sqm 0.00 and contributing_run_count 0; the grant is still ACTIVE, not SUPERSEDED"

      - name: allocation_own_lifecycle_code_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "allocation_own_state_beats_no_eligible_batch_referential"
          rationale: |
            ERR_INVALID_ALLOCATION_STATE is triggered there on a RELEASED allocation, alongside
            the controls that show ERR_NO_ELIGIBLE_BATCH and ERR_ALLOCATION_OVER_REQUEST are each
            separately reachable from the same fixture.

      - name: test_coverage_incomplete_code_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "test_coverage_safety_beats_formulation_referential_on_certify"
          rationale: |
            ERR_TEST_COVERAGE_INCOMPLETE is triggered there on a certify whose recipe has ALSO
            been superseded, which additionally proves it wins over ERR_FORMULATION_NOT_APPROVED.

      - name: performance_score_below_minimum_code_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "formulation_score_exactly_sixty_and_indentation_class_floor"
          rationale: |
            ERR_PERFORMANCE_SCORE_BELOW_MINIMUM is triggered there one hundredth below the floor
            and withheld at exactly 60.00, which is the sharpest possible demonstration.

      - name: retest_limit_exceeded_code_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "test_panel_marginal_retest_loop_terminates_at_max_retests"
          rationale: |
            ERR_RETEST_LIMIT_EXCEEDED is triggered there on the fourth start of a panel that has
            consumed both permitted retests, after two full MARGINAL cycles.

      - name: press_line_window_conflict_code_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "press_window_temporal_beats_license_volume_fiscal"
          rationale: |
            ERR_PRESS_LINE_WINDOW_CONFLICT is triggered there on an overlapping window that also
            breaks the term cap, proving both the code and its precedence over V-FISC-1.

      - name: changeover_gap_insufficient_code_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "changeover_gap_exactly_required_versus_one_minute_short"
          rationale: |
            ERR_CHANGEOVER_GAP_INSUFFICIENT is triggered there one minute short of the required
            gap and withheld at exact equality.

      - name: license_expired_code_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: "license_term_window_lazy_expiry_blocks_run_creation_before_status_flips"
          rationale: |
            ERR_LICENSE_EXPIRED is triggered there by lazy expiry, before the grant's stored
            status has flipped, which is the only way the code differs from ERR_LICENSE_NOT_ACTIVE.

  # ===========================================================================
  # Guide section 7 — Table 7 (RBAC) + role_model segregation_of_duties
  # ===========================================================================
  - section: rbac
    instances:

      - name: plant_admin_and_formulator_writes_are_mutually_exclusive
        claim_type: exclusive_operation
        grounds:
          - "rbac.PlantAdmin exclusive write POST /raw-materials"
          - "rbac.Formulator exclusive write POST /formulations"
          - "validations.V-RBAC-1"
          - "errors.ERR_UNAUTHORIZED"
        distinguishing_aspect: |
          Exclusivity is proved in BOTH directions from one fixture: the master-data role cannot
          author a recipe and the recipe author cannot create master data. A one-sided test would
          be satisfied by a matrix that simply grants PlantAdmin everything.
        test_recipe:
          setup_api_calls:
            - *clock0
          trigger:
            - call: "POST /raw-materials"
              payload: { material_code: "RM-X", name: "Unauthorised material", category: FILLER, cost_per_kg_cents: 50, indentation_index: 90, thermal_stability_index: 90, plasticizer_migration_index: 1, max_phr: 100 }
              as: Formulator
              as_user_id: "form-001"
              captures: { x1_err: $.data.error_id }
            - call: "POST /formulations"
              payload: { formulation_code: "F-X" }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { x2_err: $.data.error_id }
            - call: "POST /raw-materials"
              payload: { material_code: "RM-X", name: "Authorised material", category: FILLER, cost_per_kg_cents: 50, indentation_index: 90, thermal_stability_index: 90, plasticizer_migration_index: 1, max_phr: 100 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { x3_id: $.data.id }
            - call: "POST /formulations"
              payload: { formulation_code: "F-X" }
              as: Formulator
              as_user_id: "form-001"
              captures: { x4_id: $.data.id }
          assert:
            - "${x1_err} == ERR_UNAUTHORIZED with HTTP 403 and ${x2_err} == ERR_UNAUTHORIZED with HTTP 403"
            - "the identical payloads succeed for the permitted roles: ${x3_id} and ${x4_id} are created"
            - "the two refusals wrote nothing: immediately before the third call, GET /raw-materials as PlantAdmin returns total_count 0"

      - name: sku_catalog_read_is_shared_by_six_roles_and_closed_to_the_seventh
        claim_type: shared_operation
        grounds:
          - "rbac.GET /product-skus roles [PlantAdmin, Formulator, TechnicalDirector, QaTechnician, ProductionPlanner, Distributor]"
          - "validations.V-RBAC-1"
        distinguishing_aspect: |
          The widest shared read in the matrix, including the external Distributor role, against
          the one internal role deliberately excluded from it. Every permitted role must see the
          identical row, so the sharing is not silently scoped per role.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *lic
            - *pf1
            - *skuA
          trigger:
            - call: "GET /product-skus/${sku_a_id}"
              payload: {}
              as: Distributor
              as_user_id: "d-anon-001"
              captures: { sh_dist_code: $.data.sku_code, sh_dist_warranty: $.data.warranty_years }
            - call: "GET /product-skus/${sku_a_id}"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { sh_qa_code: $.data.sku_code }
            - call: "GET /product-skus/${sku_a_id}"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { sh_pp_code: $.data.sku_code }
            - call: "GET /product-skus/${sku_a_id}"
              payload: {}
              as: WarrantyAdjuster
              as_user_id: "adj-001"
              captures: { sh_adj_err: $.data.error_id }
          assert:
            - "${sh_dist_code} == ${sh_qa_code} == ${sh_pp_code} == SKU-A and ${sh_dist_warranty} == 20 — all permitted roles receive the same representation"
            - "${sh_adj_err} == ERR_UNAUTHORIZED with HTTP 403: WarrantyAdjuster is not in this endpoint's allowed_roles even though it may read /batches and /warranty-claims"
            - "the Distributor read is NOT an ERR_NOT_RESOURCE_OWNER case — ownership scoping applies to allocations and claims, not to the SKU catalogue"

      - name: license_status_authority_splits_on_the_requested_to_status
        claim_type: exclusive_operation
        grounds:
          - "validations.V-RBAC-2"
          - "rbac.POST /design-licenses/{id}/status roles [PlantAdmin, TechnicalDirector]"
          - "errors.ERR_UNAUTHORIZED"
        distinguishing_aspect: |
          One endpoint whose two allowed roles are NOT interchangeable: the payload decides which
          of them may act. Suspension is an operational act reserved to PlantAdmin, termination a
          contractual one reserved to TechnicalDirector, so each role is refused on the other's
          transition even though both pass V-RBAC-1.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *lic
          trigger:
            - call: "POST /design-licenses/${lic_id}/status"
              payload: { to_status: SUSPENDED }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { rb1_err: $.data.error_id }
            - call: "POST /design-licenses/${lic_id}/status"
              payload: { to_status: SUSPENDED }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rb2_status: $.data.status }
            - call: "POST /design-licenses/${lic_id}/status"
              payload: { to_status: TERMINATED }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rb3_err: $.data.error_id }
            - call: "POST /design-licenses/${lic_id}/status"
              payload: { to_status: TERMINATED }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { rb4_status: $.data.status }
          assert:
            - "${rb1_err} == ERR_UNAUTHORIZED with HTTP 403 — TechnicalDirector may not suspend"
            - "${rb2_status} == SUSPENDED for the same payload sent by PlantAdmin"
            - "${rb3_err} == ERR_UNAUTHORIZED — PlantAdmin may not terminate, even though it just performed a transition on this very endpoint"
            - "${rb4_status} == TERMINATED for TechnicalDirector, so both roles are genuinely in allowed_roles and only V-RBAC-2 separates them"

      - name: distributor_cannot_fill_another_accounts_allocation
        claim_type: ownership_denial
        grounds:
          - "validations.V-OWN-1"
          - "errors.ERR_NOT_RESOURCE_OWNER"
          - "rbac.notes X-User-ID equals Distributor.id for the Distributor role"
        distinguishing_aspect: |
          The Distributor role IS in allowed_roles for fill and for the allocation read, so
          V-RBAC-1 is satisfied; the refusal turns entirely on row ownership, and it must be 403
          ERR_NOT_RESOURCE_OWNER rather than a 404 that would leak nothing or a generic 403.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *dist
            - *distCert
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *skuACertify
            - *skuARelease
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
            - *qcRelease
            - *batchA1Get
            - *alloc1
          trigger:
            - call: "POST /allocations/${alloc1_id}/fill"
              payload: { expected_allocation_version: "${alloc1_v1}" }
              as: Distributor
              as_user_id: "${dist2_id}"
              captures: { own1_err: $.data.error_id }
            - call: "GET /allocations/${alloc1_id}"
              payload: {}
              as: Distributor
