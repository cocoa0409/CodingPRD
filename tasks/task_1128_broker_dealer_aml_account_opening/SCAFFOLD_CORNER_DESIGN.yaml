        claim_type: constants_applied
        grounds: [calculations.account_risk_score, "errors[ERR_PROHIBITED_TIER]"]
        distinguishing_aspect: "country_risk_tier PROHIBITED forces risk_tier PROHIBITED regardless of the (here zero) numeric score, and approval is refused with ERR_PROHIBITED_TIER (403)."
        test_recipe:
