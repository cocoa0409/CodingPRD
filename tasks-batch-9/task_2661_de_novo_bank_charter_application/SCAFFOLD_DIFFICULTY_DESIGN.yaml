      - name: conversion_window_confirm_requires_signed_vendor_contract
        grounds:
          - validations[priority=22]
          - errors[ERR_VENDOR_CONTRACT_NOT_SIGNED]
          - state_machines.ConversionWindow.RESERVED_to_CONFIRMED
          - state_machines.VendorContract.SELECTED_to_SIGNED
          - entities.VendorContract.fields.active_window_count
        distinguishing_aspect: >
          Entity pair ConversionWindow <-> VendorContract - a different pair from the
          group/filing dependency, and asymmetric: contract status SELECTED is sufficient to
          RESERVE a window but not to CONFIRM one, so the same child row is legal to create and
          illegal to advance until the parent is SIGNED.
        test_recipe:
          setup:
            - "Group at stage ORGANIZING."
            - "One CORE_PROCESSING VendorContract with criticality CRITICAL and due_diligence_score 88,"
            - "advanced to status SELECTED but not SIGNED."
            - "One ConversionWindow RESERVED for [2026-09-01T08:00:00Z, 2026-09-02T08:00:00Z)."
            - "Logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /de-novo/organizing-groups"
              payload: { proposed_bank_name: "Cascade Charter Bank", home_state_code: "WA", charter_type: "NATIONAL", target_opening_date: "2027-03-01T00:00:00Z" }
              as: CharterCounsel
              captures: { g_id: $.data.id }
            - call: "POST /de-novo/vendor-contracts"
              payload: { group_id: "${g_id}", service_domain: "CORE_PROCESSING", vendor_name: "Meridian Core Systems", annual_cost_cents: 90000000, contract_term_months: 60, due_diligence_score: 88, criticality: "CRITICAL" }
              as: CharterCounsel
              captures: { vc_id: $.data.id }
            - call: "POST /de-novo/vendor-contracts/${vc_id}/advance"
              payload: { target_status: "SELECTED" }
              as: CharterCounsel
            - call: "GET /de-novo/vendor-contracts/${vc_id}"
              payload: {}
              as: CharterCounsel
              captures: { vc_v1: $.data.version }
            - call: "POST /de-novo/conversion-windows"
              payload: { vendor_contract_id: "${vc_id}", expected_vendor_contract_version: "${vc_v1}", window_start_utc: "2026-09-01T08:00:00Z", window_end_utc: "2026-09-02T08:00:00Z" }
              as: CharterCounsel
              captures: { w1_id: $.data.id }
          trigger:
            - call: "POST /de-novo/conversion-windows/${w1_id}/confirm"
              payload: {}
              as: CharterCounsel
            - call: "POST /de-novo/vendor-contracts/${vc_id}/advance"
              payload: { target_status: "SIGNED" }
              as: CharterCounsel
            - call: "POST /de-novo/conversion-windows/${w1_id}/confirm"
              payload: {}
              as: CharterCounsel
          assert:
            - "the first confirm returns 409 with $.data.error_id == ERR_VENDOR_CONTRACT_NOT_SIGNED"
            - "at that moment ConversionWindow.${w1_id}.status == RESERVED"
            - "at that moment VendorContract.${vc_id}.status == SELECTED"
            - "ConversionWindow.${w1_id}.duration_hours == 24.00"
            - "after the SIGNED advance VendorContract.${vc_id}.status == SIGNED"
            - "the second confirm returns 200 and ConversionWindow.${w1_id}.status == CONFIRMED"
            - "VendorContract.${vc_id}.active_window_count == 1"
