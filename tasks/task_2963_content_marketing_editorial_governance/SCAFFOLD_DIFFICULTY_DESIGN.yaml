  - rule_id: non_linear_state_machine
    instances:

      - name: content_item_revision_cycle_reenters_in_review_from_changes_requested
        grounds:
          - state_machines.ContentItem.CHANGES_REQUESTED_to_IN_REVIEW
          - state_machines.ContentItem.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.ReviewGate.CHANGES_REQUESTED_to_PENDING
          - state_machines.ReviewGate.PENDING_to_WAIVED
          - entities.ContentItem.fields.revision_number
          - entities.ReviewGate.fields.opened_at
          - calculations.review_gate_sla_due_at
        distinguishing_aspect: |
          The item leaves IN_REVIEW for CHANGES_REQUESTED and re-enters IN_REVIEW through the same
          submit-for-review trigger, incrementing revision_number to 2, and on the second lap only the
          CHANGES_REQUESTED gate is reopened with a fresh opened_at of 2026-08-04T08:00:00.000Z and due_at
          of 2026-08-05T14:00:00.000Z while the already APPROVED and WAIVED gates keep their first-lap
          decisions — a linear reading of the workflow cannot produce a second visit to IN_REVIEW at all.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-03T08:00:00.000Z."
            - "Campaign CMP-CYCLE is ACTIVE, persona IT_BUYER, primary_funnel_stage DECISION."
            - "One DECISION CalendarSlot for week 2026-08-03 with capacity_points 40; one APPROVED brief (COMMERCIAL, 1500 words, DECISION, effort_points 16, sme_reserved_hours 8)."
            - "One ContentItem carrying zero Claim rows, submitted once so the gate set is exactly [SME, BRAND, ACCESSIBILITY] with no LEGAL gate; each gate opened_at 2026-08-03T08:00:00.000Z."
            - "At clock 2026-08-03T20:00:00.000Z the SME gate is APPROVED and the ACCESSIBILITY gate is WAIVED, then the BRAND gate is decided CHANGES_REQUESTED, dropping the item to CHANGES_REQUESTED."
            - "Clock then advances to 2026-08-04T08:00:00.000Z."
          setup_api_calls:
            - call: "POST /editorial/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00.000Z" }
