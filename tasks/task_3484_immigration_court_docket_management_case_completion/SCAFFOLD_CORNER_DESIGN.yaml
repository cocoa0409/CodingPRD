  # ===========================================================================
  - section: rbac
    instances:

      - name: board_member_cannot_file_case
        claim_type: role_denial
        grounds:
          - roles.BoardMember
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "BoardMember is an appeals-only role for writes: its case-filing attempt is a 403 at priority 2, before any body validation."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One court."]
          setup_api_calls:
            - *c_clock
            - *c_court
          trigger:
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "RB-1", respondent_full_name: "R Deny", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: BoardMember
              as_user_id: "bm-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /eoir/cases?court_id=${court_id} returns 0 rows"

      - name: judge_cannot_run_docket_review
        claim_type: role_denial
        grounds:
          - roles.ImmigrationJudge
          - endpoints.POST_/eoir/courts/{courtId}/docket-reviews
        distinguishing_aspect: "The docket checkpoint is a CourtAdministrator operation: even a valid ImmigrationJudge identity is denied with 403."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One court and one judge."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
          trigger:
            - call: "POST /eoir/courts/${court_id}/docket-reviews"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "GET /eoir/docket-reviews?court_id=${court_id} returns 0 rows"

      - name: administrator_cannot_decide_appeal
        claim_type: role_denial
        grounds:
          - roles.CourtAdministrator
          - endpoints.POST_/eoir/appeals/{appealId}/decide
        distinguishing_aspect: "The filing clerk and the review board are disjoint roles (approval chain): the administrator who filed the appeal cannot rule on it — 403."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Case driven to APPEALED with the appeal FILED by the administrator."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master
            - *c_clock_m
            - *c_complete_m
            - *c_get4
            - *c_merits
            - *c_clock_i
            - *c_complete_i
            - *c_get5
            - *c_decide
            - *c_appeal
          trigger:
            - call: "POST /eoir/appeals/${app_id}/decide"
              payload: { ruling: "AFFIRMED" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "Appeal.${app_id}.status remains FILED and Case.${case_id}.status remains APPEALED"

      - name: unassigned_judge_cannot_rule_on_continuance
        claim_type: role_denial
        grounds:
          - errors.ERR_NOT_ASSIGNED_JUDGE
          - validations[priority=4]
        distinguishing_aspect: "Judge rulings are ownership-bound (entity_backed identity): a different judge of the same court deciding the continuance gets 403 ERR_NOT_ASSIGNED_JUDGE, distinct from the role-denial 403."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Two judges at one court; the case is docketed to judge 1 and has a PENDING continuance."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge Other", max_pending_cases: 5 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { judge2: $.data.id }
            - *c_case_eng
            - *c_assign
            - *c_master_late
            - call: "POST /eoir/continuance-requests"
              payload: { case_id: "${case_id}", hearing_id: "${h_l}", reason_code: "EVIDENCE_GATHERING" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { cont_id: $.data.id }
          trigger:
            - call: "POST /eoir/continuance-requests/${cont_id}/decide"
              payload: { decision: "GRANTED" }
              as: ImmigrationJudge
              as_user_id: "${judge2}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_NOT_ASSIGNED_JUDGE (X-User-ID ${judge2} != case.assigned_judge_id ${judge_id})"
            - "ContinuanceRequest.${cont_id}.status remains PENDING"

      - name: non_hearing_judge_cannot_complete_hearing
        claim_type: role_denial
        grounds:
          - errors.ERR_NOT_HEARING_JUDGE
          - validations[priority=4]
        distinguishing_aspect: "Hearing completion is bound to the hearing's own judge (hearing.judge_id), not merely the case's: a colleague judge gets 403 ERR_NOT_HEARING_JUDGE."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Case docketed to judge 1 with a master hearing; a second judge exists at the court; clock at 2026-09-03T10:30."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - call: "POST /eoir/judges"
              payload: { court_id: "${court_id}", full_name: "Judge Other", max_pending_cases: 5 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { judge2: $.data.id }
            - *c_case_eng
            - *c_assign
            - *c_master
            - *c_clock_m
          trigger:
            - call: "POST /eoir/hearings/${h_m}/complete"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge2}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_NOT_HEARING_JUDGE"
            - "Hearing.${h_m}.status remains SCHEDULED and Case.${case_id}.status remains CALENDAR"

      - name: get_endpoints_readable_by_all_three_roles
        claim_type: role_allowance
        grounds:
          - roles.CourtAdministrator
          - roles.ImmigrationJudge
          - roles.BoardMember
        distinguishing_aspect: "Read access is the shared operation: the same case GET returns 200 to the administrator, the assigned judge, and a board member alike."
        test_recipe:
          setup: ["Logical clock 2026-09-01. One docketed case."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
          trigger:
            - call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
            - call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: BoardMember
              as_user_id: "bm-01"
          assert:
            - "all three GETs return 200 with response_type object and identical data payloads"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: success_envelope_shape_on_case_create
        claim_type: Standard CRUD
        grounds:
          - response_envelope
          - endpoints.POST_/eoir/cases
        distinguishing_aspect: "The fixed envelope wraps every success: meta.api_request_id and meta.api_request_timestamp accompany response_type == object and the created resource under data."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. One court."]
          setup_api_calls:
            - *c_clock
            - *c_court
          trigger:
            - *c_case_eng
          assert:
            - "the response status is 201 with response_type == \"object\""
            - "meta.api_request_id is a non-empty string and meta.api_request_timestamp is a valid ISO8601 timestamp"
            - "data carries the Case with id, created_at, updated_at, version == 1"

      - name: error_envelope_shape_on_not_found
        claim_type: Standard CRUD
        grounds:
          - response_envelope
          - errors.ERR_COURT_NOT_FOUND
        distinguishing_aspect: "The fixed error envelope wraps every failure: response_type == \"error\" with data.error_id and data.message, and meta fields still present."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /eoir/courts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 with response_type == \"error\""
            - "data.error_id == \"ERR_COURT_NOT_FOUND\" and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present even on errors"

      - name: cases_list_filters_combine
        claim_type: Listing
        grounds:
          - endpoints.GET_/eoir/cases
        distinguishing_aspect: "Filters compose conjunctively: court_id AND custody_status AND status narrow the same list, and custody=DETAINED at court A returns exactly the detained case."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Court A holds one DETAINED and one NON_DETAINED case; court B holds one NON_DETAINED case."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-FB", name: "Filter B", city: "Reno", annual_completion_goal: 100, detained_daily_hearing_capacity: 1 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_b: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "F-1", respondent_full_name: "R Det", custody_status: "DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_det: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "F-2", respondent_full_name: "R Non", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_b}", case_number: "F-3", respondent_full_name: "R Other", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
          trigger:
            - call: "GET /eoir/cases"
              payload: { court_id: "${court_id}", custody_status: "DETAINED" }
              as: CourtAdministrator
              as_user_id: "admin-01"
          assert:
            - "court A + DETAINED returns exactly 1 row: Case.${case_det}"
            - "court A alone returns 2 rows; status=FILED across all courts returns 3 rows"
            - "GET /eoir/cases?assigned_judge_id=<any unallocated uuid> returns 0 rows (no case is docketed yet)"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: stale_case_version_on_hearing_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[hearing-create-stale-case]
          - errors.ERR_STALE_CASE_VERSION
        distinguishing_aspect: "The hearing-create OCC guard observes the parent's version: after the case advanced to version 4 (docketing + hearing creation + master completion), a hearing create replaying the stale version 2 is a 412 even though every business rule passes."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Case docketed (v2), master hearing created (v3) and completed (case MERITS, v4)."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master
            - *c_clock_m
            - *c_complete_m
          trigger:
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case_id}", hearing_type: "INDIVIDUAL_MERITS", scheduled_start: "2026-09-08T10:00:00Z", expected_case_version: "${case_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_CASE_VERSION (expected 2, current 4)"
            - "GET /eoir/hearings?case_id=${case_id} returns exactly 1 row (the COMPLETED master) — the stale write persisted nothing"

      - name: stale_case_version_on_decision_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[decision-create-stale-case]
          - errors.ERR_STALE_CASE_VERSION
        distinguishing_aspect: "The decision-create OCC guard is evaluated after all business checks: an otherwise-valid decision carrying a stale expected_case_version is rejected 412 and the case stays MERITS."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Case in MERITS with a COMPLETED merits hearing; current version is 5 while the client replays version 2."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master
            - *c_clock_m
            - *c_complete_m
            - *c_get4
            - *c_merits
            - *c_clock_i
            - *c_complete_i
          trigger:
            - call: "POST /eoir/decisions"
              payload: { case_id: "${case_id}", outcome: "REMOVAL", expected_case_version: "${case_v2}" }
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_CASE_VERSION"
            - "GET /eoir/decisions?case_id=${case_id} returns 0 rows and Case.${case_id}.status remains MERITS"

      - name: stale_case_version_on_reassignment_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reassignment-stale-case]
          - errors.ERR_STALE_CASE_VERSION
        distinguishing_aspect: "The reassignment OCC guard rejects a deliberately stale version (one behind the create version) even though the source court is critical and a destination exists."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Critical source court A (goal 4, one pending case) and eligible destination B (goal 100, empty)."]
          setup_api_calls:
            - *c_clock
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-RA", name: "Reassign Source", city: "Laredo", annual_completion_goal: 4, detained_daily_hearing_capacity: 1 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_a: $.data.id }
            - call: "POST /eoir/courts"
              payload: { court_code: "CT-RB", name: "Reassign B", city: "Boise", annual_completion_goal: 100, detained_daily_hearing_capacity: 1 }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { court_b: $.data.id }
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_a}", case_number: "MV-1", respondent_full_name: "R Move", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_id: $.data.id, case_v1: $.data.version }
          trigger:
            - call: "POST /eoir/case-reassignments"
              payload: { case_id: "${case_id}", expected_case_version: "${case_v1} - 1" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_CASE_VERSION (expected version 0, current 1)"
            - "Case.${case_id}.court_id remains ${court_a} and GET /eoir/case-reassignments?case_id=${case_id} returns 0 rows"

      - name: case_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.Case.fields.version
          - concurrency_rules[hearing-create-stale-case]
        distinguishing_aspect: "The parent's version is the OCC observable: it steps 1 (create) -> 2 (assign-judge) -> 3 (hearing creation), each mutation adding exactly one."
        test_recipe:
          setup: ["Logical clock 2026-09-01. One court, one judge."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
          trigger:
            - *c_assign
            - *c_master
            - call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case_v3: $.data.version }
          assert:
            - "the create response carried version == 1"
            - "the assign-judge response carried version == 2 (captured case_v2)"
            - "after the hearing creation, GET shows version == 3 — hearing creation bumps the parent Case by exactly 1"

      - name: lop_coverage_threshold_reconciles_only_new_hearings
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.hearing_duration_and_daily_load
          - entities.LegalOrientationProgram.fields.coverage_pct
        distinguishing_aspect: "Crossing the LOP coverage threshold (49 -> 50) halves NEW master-calendar blocks to 15 minutes while the already-scheduled hearing keeps its stored 30 — the derived duration is frozen at creation and never reconciled backwards."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Court with an ACTIVE orientation program at coverage_pct 49; two docketed PRO_SE cases get master hearings before and after the coverage update."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - call: "POST /eoir/orientation-programs"
              payload: { court_id: "${court_id}", program_name: "Pro Bono Orientation", coverage_pct: 49, active: true }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { prog_id: $.data.id }
            - *c_case_eng
            - *c_assign
            - *c_master
            - call: "POST /eoir/orientation-programs/${prog_id}/set-coverage"
              payload: { coverage_pct: 50 }
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "POST /eoir/cases"
              payload: { court_id: "${court_id}", case_number: "E-2", respondent_full_name: "R Second", custody_status: "NON_DETAINED", primary_language_code: "eng", representation_status: "PRO_SE", interpreter_required: false }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case2: $.data.id }
            - call: "POST /eoir/cases/${case2}/assign-judge"
              payload: { judge_id: "${judge_id}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { case2_v2: $.data.version }
          trigger:
            - call: "POST /eoir/hearings"
              payload: { case_id: "${case2}", hearing_type: "MASTER_CALENDAR", scheduled_start: "2026-09-03T11:00:00Z", expected_case_version: "${case2_v2}" }
              as: CourtAdministrator
              as_user_id: "admin-01"
              captures: { h_new: $.data.id, h_new_dur: $.data.duration_minutes }
          assert:
            - "Hearing.${h_m} (created while coverage was 49) keeps duration_minutes == 30 — stored durations do not reconcile backwards"
            - "Hearing.${h_new}.duration_minutes == 15 (30 * 0.5 LOP factor at coverage 50) and scheduled_end == \"2026-09-03T11:15:00Z\""
            - "coverage exactly 50 activates the factor (the threshold is >= 50, inclusive)"

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: reopen_grant_cascade_motion_decision_case_hearing
          rationale: "The §1.8 transitive-cascade instances verify the 3-link reopen cascade and the no-show cascade end to end."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_consistency_visible_in_same_and_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.Hearing.SCHEDULED_to_COMPLETED
        distinguishing_aspect: "Immediate consistency: the completion response itself carries COMPLETED, and the very next reads show the hearing COMPLETED and the case MERITS with no settlement lag."
        test_recipe:
          setup: ["Logical clock 2026-09-01. Docketed case with master hearing; clock at 2026-09-03T10:30."]
          setup_api_calls:
            - *c_clock
            - *c_court
            - *c_judge
            - *c_case_eng
            - *c_assign
            - *c_master
            - *c_clock_m
          trigger:
            - call: "POST /eoir/hearings/${h_m}/complete"
              payload: {}
              as: ImmigrationJudge
              as_user_id: "${judge_id}"
              captures: { h_status: $.data.status }
            - call: "GET /eoir/hearings/${h_m}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
            - call: "GET /eoir/cases/${case_id}"
              payload: {}
              as: CourtAdministrator
              as_user_id: "admin-01"
          assert:
            - "the completion response itself shows status == COMPLETED (mutation visible in the same request)"
            - "the immediate GET of the hearing shows COMPLETED and the immediate GET of the case shows MERITS (no lag, no reconciliation window)"
            - "Case.${case_id}.version == 4 after create(1) + assign(2) + hearing create(3) + completion transition(4)"
