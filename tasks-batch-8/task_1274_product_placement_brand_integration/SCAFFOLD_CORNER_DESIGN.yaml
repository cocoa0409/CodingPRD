            - { call: "POST /proposals", payload: { brief_id: "${br_id}", opportunity_id: "${opp_id}", proposed_fee_cents: 60000, guaranteed_seconds: 10, guaranteed_verbal_mentions: 0, cross_promo_owed_count: 0, rate_cents_per_second: 2000 }, as: IntegrationManager }
          trigger:
            - { call: "GET /briefs/${br_id}", as: IntegrationManager, captures: { remaining: $.data.remaining_budget_cents } }
          assert:
            - "captured remaining == 40000"
      - name: bonus_applied_on_overdelivery
        claim_type: correct_result
        grounds: [calculations.contract_billing_value, state_machines.IntegrationContract.UNDER_VERIFICATION_to_SETTLED]
        distinguishing_aspect: "Measured 35s vs guaranteed 30s: bonus min(0.25*1000000, 5*2000) = 10000, under the cap, and final settlement is 1010000."
        test_recipe:
          setup: ["Full chain to ACTIVE contract (fee 1000000, guaranteed 30s + 2 mentions, 0 promos, rate 2000); disclosure ACKNOWLEDGED; episode AIRED; report segments [35] mentions 2"]
          setup_api_calls:
            - { call: "POST /brands", payload: { name: "FizzCo", category: "BEVERAGE" }, as: AgencyAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /brands/${b_id}/briefs", payload: { title: "T", objective: "O", budget_cents: 1000000 }, as: BrandRep, as_user_id: "${b_id}", captures: { br_id: $.data.id } }
