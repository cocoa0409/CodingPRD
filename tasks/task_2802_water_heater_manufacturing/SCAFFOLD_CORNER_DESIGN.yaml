      - name: furnace_and_batch_numeric_range_and_enum_constraints
        claim_type: type_constraints
        grounds:
          - entities.Furnace.fields.max_firing_temp_c
          - entities.ProductModel.fields.fuel_type
          - validations[priority 4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >
          Declared numeric ranges and enum closures are enforced at priority 4, before any business rule: a
          furnace above the declared 700..1000 window and a fuel_type outside {GAS, ELECTRIC, HEAT_PUMP} are both
          ERR_INVALID_REQUEST, not ERR_FIRING_TEMP_EXCEEDS_FURNACE_MAX and not a silently coerced value. The
          accepted boundary value 1000 in the same instance proves the range is inclusive.
        test_recipe:
          setup:
            - "No furnace and no product model exist."
            - "Furnace.max_firing_temp_c is declared with the inclusive range 700..1000."
            - "ProductModel.fuel_type is declared as the closed enum {GAS, ELECTRIC, HEAT_PUMP}."
          setup_api_calls:
            - call: "GET /mfg/_clock"
              payload: {}
              as: PlantAdmin
          trigger:
            - call: "POST /mfg/furnaces"
              payload: { furnace_code: "FURN-HOT", max_firing_temp_c: 1200 }
              as: PlantAdmin
            - call: "POST /mfg/furnaces"
              payload: { furnace_code: "FURN-COLD", max_firing_temp_c: 650 }
              as: PlantAdmin
            - call: "POST /mfg/furnaces"
              payload: { furnace_code: "FURN-MAX", max_firing_temp_c: 1000 }
              as: PlantAdmin
            - call: "POST /mfg/product-models"
