              payload: { concessionaire_id: "${cnr_id}", project_name: "A47 Availability Scheme", masp_cents: 100000000, indexation_pct: 0.0325, deduction_cap_pct: 0.20, total_project_cost_cents: 400000000, senior_debt_committed_cents: 300000000, equity_committed_cents: 100000000, base_case_equity_irr_bps: 1200, scheduled_service_commencement: "2027-01-01", ld_daily_rate_cents: 250000, ld_cap_cents: 5000000, lifecycle_reserve_target_cents: 20000000 }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_id: $.data.id }
            - call: "POST /ppp/concessions/${csn_id}/financial-close"
              payload: { close_date: "2026-09-15" }
              as: AuthorityOfficer
              as_user_id: "officer-alpha"
              captures: { csn_v_close: $.data.version }
            - call: "POST /ppp/concessions/${csn_id}/drawdown-milestones"
              payload: { milestone_name: "M1 Design Complete", requested_amount_cents: 120000000, expected_concession_version: "${csn_v_close}" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /ppp/drawdown-milestones/${m1_id}/approve"
              payload: { certified_cost_cents: 120000000 }
              as: IndependentCertifier
            - call: "POST /ppp/drawdown-milestones/${m1_id}/disburse"
              payload: {}
              as: LenderAgent
          trigger:
            - call: "POST /ppp/concessions/${csn_id}/reserve-transactions"
              payload: { txn_type: "WITHDRAWAL", amount_cents: 3000000, reason: "carriageway resurfacing tranche 1" }
              as: Concessionaire
              as_user_id: "${cnr_id}"
              captures: { wd_id: $.data.id, wd_balance: $.data.resulting_balance_cents }
            - call: "POST /ppp/reserve-transactions/${wd_id}/reverse"
              payload: { reason: "tranche 1 invoice cancelled by the contractor" }
              as: PlatformAdmin
              captures: { rv_id: $.data.id, rv_balance: $.data.resulting_balance_cents }
            - call: "POST /ppp/reserve-transactions/${wd_id}/reverse"
              payload: { reason: "duplicate cancellation posted by the finance team" }
              as: PlatformAdmin
              captures: { err_already: $.data.error_id }
            - call: "POST /ppp/reserve-transactions/${rv_id}/reverse"
              payload: { reason: "un-cancel the cancellation" }
              as: PlatformAdmin
              captures: { err_double: $.data.error_id }
          assert:
            - "BEFORE — GET /ppp/reserve-transactions?concession_id=${csn_id} returns total_count 1 and Concession.${csn_id}.lifecycle_reserve_balance_cents == 8000000"
            - "AFTER THE WITHDRAWAL — LifecycleReserveTransaction.${wd_id}.sequence_no == 2, amount_cents == 3000000, signed_amount_cents == -3000000, resulting_balance_cents == 5000000, and Concession.${csn_id}.lifecycle_reserve_balance_cents == 5000000"
            - "AFTER THE REVERSAL — LifecycleReserveTransaction.${rv_id}.sequence_no == 3, txn_type == REVERSAL, reverses_txn_id == ${wd_id}, amount_cents == 3000000 (copied from the target, not from the body), signed_amount_cents == +3000000, resulting_balance_cents == 8000000"
            - "CONSERVED — Concession.${csn_id}.lifecycle_reserve_balance_cents is back to exactly 8000000, its pre-withdrawal value"
            - "CONSERVED — the signed sum over all three rows is 8000000 - 3000000 + 3000000 == 8000000, matching both the concession field and the highest-sequence row"
            - "NO MUTATION — LifecycleReserveTransaction.${wd_id}.signed_amount_cents is still -3000000 and its resulting_balance_cents is still 5000000; history was appended to, not rewritten"
            - "NO MUTATION — the seed row at sequence_no 1 still reports resulting_balance_cents 8000000, so the per-row prefix-sum identity holds for every row"
            - "NOT REVERSIBLE TWICE — the second reverse of ${wd_id} returns ERR_TRANSACTION_ALREADY_REVERSED with HTTP 409"
            - "REVERSALS ARE NOT REVERSIBLE — reversing ${rv_id} returns ERR_CANNOT_REVERSE_REVERSAL with HTTP 409"
            - "after both refusals GET /ppp/reserve-transactions?concession_id=${csn_id} still returns total_count 3 and the balance is still 8000000"
            - "no LifecycleReserveTransaction row carries a version field — the entity is immutable and has no update endpoint"

