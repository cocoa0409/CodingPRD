              as: SiteOperator
              captures: { site_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Ventura Channel Seafood", industry_code: "311712", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { cust_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_id}", customer_id: "${cust_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
              captures: { ppa_id: $.data.id }
            - call: "POST /power/ppas/${ppa_id}/activate"
              payload: {}
              as: SiteOperator
              captures: { ppa_v: $.data.version }
            - call: "POST /power/ppa-accruals"
              payload: { ppa_id: "${ppa_id}", site_id: "${site_id}", accrual_type: "CAPACITY_ACCRUAL", amount_cents: 185000, period_anchor_iso8601: "2025-02-01T00:00:00Z" }
              as: SettlementAnalyst
              captures: { ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/allowances"
              payload: { allowance_kind: "CAPACITY_ALLOWANCE", amount_cents: 185000, expected_ppa_version: "${ppa_v}" }
              as: SettlementAnalyst
              captures: { ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/settlement-lines"
              payload: { period_start: "2025-02-01T00:00:00Z", period_end: "2025-03-01T00:00:00Z", metered_kwh: 200000, downtime_hours: 2.0, customer_source_deadline_iso8601: "2025-02-15T00:00:00Z", hourly_settlement: false, expected_ppa_version: "${ppa_v}" }
              as: SettlementAnalyst
              captures: { prior_line_id: $.data.id, ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/settlement-lines/${prior_line_id}/validate"
              payload: {}
              as: SettlementAnalyst
              captures: { ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/settlement-lines/${prior_line_id}/approve"
              payload: {}
              as: SettlementApprover
              captures: { ppa_v: $.data.version }
            - call: "POST /power/ppas/${ppa_id}/settlement-lines/${prior_line_id}/settle"
              payload: {}
              as: SettlementApprover
              captures: { ppa_v: $.data.version }
          trigger:
            - call: "POST /power/ppas/${ppa_id}/settlement-lines"
              payload: { period_start: "2025-03-01T00:00:00Z", period_end: "2025-03-15T00:00:00Z", metered_kwh: 100000, downtime_hours: 1.0, customer_source_deadline_iso8601: "2025-03-10T00:00:00Z", hourly_settlement: false, expected_ppa_version: "${ppa_v}" }
              as: SettlementAnalyst
              captures: { next_line_id: $.data.id }
          assert:
            - "the response status is 201 and SettlementLine.${next_line_id}.status == SETTLEMENT_DRAFT"
            - "SettlementLine.${next_line_id}.period_start == 2025-03-01T00:00:00Z"
            - "SettlementLine.${prior_line_id}.status == SETTLEMENT_APPLIED"

      - name: same_day_maintenance_windows_at_two_sites_do_not_conflict
        grounds:
          - validations[priority=11]
          - entities.ServicePlan.fields.window_start_iso8601
          - errors[ERR_WINDOW_VIOLATION]
          - endpoints.POST_/power/ppas/{id}/service-plans
        distinguishing_aspect: "Per-resource aggregate semantics on a different resource: two sites whose service plans occupy the identical calendar window are both admitted because the minimum-gap rule is scoped to one site's plan set, whereas the hold rule's window is scoped to one site's delivery set and the settlement rule's window is scoped to one contract — same adjacency concept, different scope."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. Two Sites, each with one active PPA and clearance capacity 400."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Sonoma Vineyard North", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_n_id: $.data.id }
            - call: "POST /power/sites"
              payload: { name: "Sonoma Vineyard South", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_s_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Sonoma Vineyard Group", industry_code: "111332", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { cust_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_n_id}", customer_id: "${cust_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
              captures: { ppa_n_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_s_id}", customer_id: "${cust_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
              captures: { ppa_s_id: $.data.id }
            - call: "POST /power/ppas/${ppa_n_id}/activate"
              payload: {}
              as: SiteOperator
            - call: "POST /power/ppas/${ppa_s_id}/activate"
              payload: {}
              as: SiteOperator
          trigger:
            - call: "POST /power/ppas/${ppa_n_id}/service-plans"
              payload: { remote_monitoring_status: "MONITORING_LINKED", radius_buffer_m: 10.0, window_start_iso8601: "2026-04-01T00:00:00Z", window_end_iso8601: "2026-04-08T00:00:00Z" }
              as: ServiceEngineer
              captures: { plan_n_id: $.data.id }
            - call: "POST /power/ppas/${ppa_s_id}/service-plans"
              payload: { remote_monitoring_status: "MONITORING_LINKED", radius_buffer_m: 10.0, window_start_iso8601: "2026-04-01T00:00:00Z", window_end_iso8601: "2026-04-08T00:00:00Z" }
              as: ServiceEngineer
              captures: { plan_s_id: $.data.id }
          assert:
            - "the second creation returns 201 and ServicePlan.${plan_s_id}.lifecycle_state == SERVICE_PLAN_DRAFT"
            - "ServicePlan.${plan_s_id}.window_start_iso8601 == ServicePlan.${plan_n_id}.window_start_iso8601"
            - "Site.${site_n_id}.clearance_zone_used == 10.0 and Site.${site_s_id}.clearance_zone_used == 10.0"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: canceled_delivery_restores_the_allocatable_therm_pool
        grounds:
          - calculations.commitment_allocation_rights
          - state_machines.FuelDelivery.DELIVERY_SCHEDULED_to_DELIVERY_CANCELLED
          - entities.Site.fields.draw_position_therms
          - endpoints.POST_/power/sites/{id}/fuel-deliveries/{id}/cancel
        distinguishing_aspect: "Therm-quantity conservation: scheduling a 60000-therm delivery and then canceling it leaves Site.draw_position_therms exactly equal to its pre-scheduling value of 100000, so the forward/reserve pair leaves zero drift in the site's allocatable fuel pool — the invariant is over a physical volume, not over money."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. A Site whose allocatable pool opens at 100000 therms."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Oxnard Cold Press", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id, site_v: $.data.version }
            - call: "POST /power/sites/${site_id}/fuel-deliveries"
              payload: { sourcing_mode: "FIXED_PRICE_BLEND", volume_therms: 60000, fixed_price_cents_per_therm: 4.20, hedged_fraction: 1.0, delivered_at: "2026-03-12T00:00:00Z", confirm_after_iso8601: "2026-03-13T00:00:00Z", expected_site_version: "${site_v}" }
              as: FuelCoordinator
              captures: { del_id: $.data.id, site_v: $.data.version }
          trigger:
            - call: "POST /power/sites/${site_id}/fuel-deliveries/${del_id}/cancel"
              payload: {}
              as: FuelCoordinator
          assert:
            - "FuelDelivery.${del_id}.lifecycle_state == DELIVERY_CANCELLED"
            - "Site.${site_id}.draw_position_therms == 100000"
            - "Site.${site_id}.draw_position_therms == Site.${site_id}.initial_fuel_inventory_therms"
            - "Site.${site_id}.lifecycle_state == RESOURCE_AVAILABLE"

      - name: accrual_charge_and_guarantee_pair_leaves_the_signed_ledger_balanced
        grounds:
          - calculations.customer_token_ledger
          - entities.PpaAccrual.fields.signed_amount_cents
          - entities.Customer.fields.outstanding_balance_cents
          - endpoints.POST_/power/ppa-accruals
        distinguishing_aspect: "Signed-cent conservation over a different quantity: posting a CHARGE_ACCRUAL of 100000 cents and an OUTPUT_GUARANTEE_ACCRUAL of 100000 cents leaves the contract's open signed accrual sum at exactly 0 and the customer's outstanding balance untouched, whereas a TRUEUP_ACCRUAL of 75000 moves the same sum to -75000 — the pair is the compensating action over money, not over therms."
        test_recipe:
          setup:
            - "Logical clock at 2026-03-10T00:00:00Z. A Site and an active PPA with no accruals and no settled lines."
          setup_api_calls:
            - call: "POST /power/_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T00:00:00Z" }
              as: SiteOperator
            - call: "POST /power/sites"
              payload: { name: "Tehachapi Wind Hybrid", utility_territory: "PGE_CA", grid_tariff_rate_cents_per_kwh: 24.0, grid_outage_events_per_year: 4, grid_annual_outage_hours: 37.5, gas_commodity_rate_cents_per_therm: 5.0, expected_annual_site_load_kwh: 9000000, tax_rate_pct: 0.0725, allowed_downtime_hours_per_year: 100.0, clearance_zone_capacity: 400.0, footprint_sqm: 1200.0, standby_charge_cents_per_kw_month: 1.80, interconnect_exit_fee_cents_per_kw: 95.0 }
              as: SiteOperator
              captures: { site_id: $.data.id }
            - call: "POST /power/customers"
              payload: { name: "Tehachapi Hybrid Power LLC", industry_code: "221118", credit_tier: "CREDIT_STANDARD" }
              as: CustomerService
              captures: { cust_id: $.data.id }
            - call: "POST /power/ppas"
              payload: { site_id: "${site_id}", customer_id: "${cust_id}", term_years: 15, contracted_kw: 500, contracted_efficiency_kwh_per_therm: 7.4, contracted_annual_kwh: 3240000, tariff_base_cents_per_kwh: 12.0, escalator_pct: 0.03, fuel_adder_cents_per_therm: 2.50, guaranteed_availability_pct: 0.97, guaranteed_delivery_kwh: 3240000, customer_cure_deadline_days: 30, fuel_responsibility: "PPA_FUEL_INCLUDED", loss_floor_cents: 25000 }
              as: SiteOperator
              captures: { ppa_id: $.data.id }
            - call: "POST /power/ppas/${ppa_id}/activate"
              payload: {}
              as: SiteOperator
          trigger:
            - call: "POST /power/ppa-accruals"
              payload: { ppa_id: "${ppa_id}", site_id: "${site_id}", accrual_type: "CHARGE_ACCRUAL", amount_cents: 100000, period_anchor_iso8601: "2026-03-01T00:00:00Z" }
              as: SettlementAnalyst
              captures: { charge_accrual_id: $.data.id, charge_signed: $.data.signed_amount_cents }
            - call: "POST /power/ppa-accruals"
              payload: { ppa_id: "${ppa_id}", site_id: "${site_id}", accrual_type: "OUTPUT_GUARANTEE_ACCRUAL", amount_cents: 100000, period_anchor_iso8601: "2026-03-01T00:00:00Z" }
              as: SettlementAnalyst
              captures: { guarantee_accrual_id: $.data.id, guarantee_signed: $.data.signed_amount_cents }
            - call: "POST /power/ppa-accruals"
              payload: { ppa_id: "${ppa_id}", site_id: "${site_id}", accrual_type: "TRUEUP_ACCRUAL", amount_cents: 75000, period_anchor_iso8601: "2026-03-01T00:00:00Z" }
              as: SettlementAnalyst
              captures: { trueup_signed: $.data.signed_amount_cents }
          assert:
            - "PpaAccrual.${charge_accrual_id}.signed_amount_cents == 100000"
            - "PpaAccrual.${guarantee_accrual_id}.signed_amount_cents == -100000"
            - "the open signed sum of PpaAccrual.signed_amount_cents for the PPA is 0 after the charge and guarantee posts"
            - "the open signed sum becomes -75000 after the TRUEUP_ACCRUAL post"
            - "Customer.${cust_id}.outstanding_balance_cents == 0"