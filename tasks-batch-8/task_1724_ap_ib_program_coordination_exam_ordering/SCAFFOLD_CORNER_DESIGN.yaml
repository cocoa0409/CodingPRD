              captures: { co: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Stu A", grade_level: 11, subgroup_code: "GEN" }
              as: ApCoordinator
              captures: { s1: $.data.id }
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
              captures: { err: $.data.error_id }
            - call: "POST /registrations/${r1}/cancel"
              as: ApCoordinator
            - call: "POST /registrations"
              payload: { student_id: "${s1}", course_id: "${co}" }
              as: Student
              as_user_id: "${s1}"
              captures: { r2: $.data.id }
          assert:
            - "Duplicate while REGISTERED: HTTP 409 and error_id == ERR_DUPLICATE_REGISTRATION"
            - "After cancel, re-register succeeds: ExamRegistration.${r2}.registration_status == REGISTERED (uniqueness ignores CANCELLED rows)"

