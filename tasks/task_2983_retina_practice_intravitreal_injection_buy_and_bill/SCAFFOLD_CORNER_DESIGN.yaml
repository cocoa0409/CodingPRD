              as: PracticeAdmin
              captures: { k_nf_encounter: $.data.error_id }
            - call: "GET /claims/aaaaaaaa-0000-4000-8000-00000000000c"
              as: PracticeAdmin
              captures: { k_nf_claim: $.data.error_id }
