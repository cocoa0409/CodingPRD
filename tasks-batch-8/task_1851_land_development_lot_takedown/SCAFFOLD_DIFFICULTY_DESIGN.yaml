# =============================================================================
# Task 1851: Land Development & Lot Takedown — §1.8 Scaffold Difficulty Design
# Test Targeting Index: 9 rules x 2 instances = 18 instances
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: bond_requirement_provisional_vs_final
        grounds:
          - calculations.bond_requirement
          - entities.InfrastructureBond.fields.required_bond_cents
          - state_machines.InfrastructureBond.ESTIMATED_to_BID_FINAL
        distinguishing_aspect: |
          Infrastructure/bond domain: the same bond record yields required_bond_cents
          11000000 on the PROVISIONAL basis (110% of engineer estimate 10000000) and
          9900000 on the FINAL basis (110% of awarded bid 9000000) — two valid
          algorithms over the same subject producing different amounts.
        test_recipe:
          setup:
            - "Parcel P and Phase PH exist; bond B for PH in ESTIMATED with engineer_estimate_cents 10000000"
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "P1", county: "Travis", earnest_money_cents: 500000 }
              as: DeveloperOperator
              captures: { p1: $.data.id }
            - call: "POST /api/phases"
              payload: { parcel_id: "${p1}", phase_name: "PH1", sequence_number: 1, planned_lot_count: 10, selling_window_start: "2026-09-01T00:00:00Z", selling_window_end: "2027-03-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { ph1: $.data.id }
            - call: "POST /api/infrastructure-bonds"
              payload: { phase_id: "${ph1}", engineer_estimate_cents: 10000000 }
              as: DeveloperOperator
              captures: { b1: $.data.id, req_prov: $.data.required_bond_cents }
          trigger:
            - call: "POST /api/infrastructure-bonds/${b1}/award-bid"
              payload: { awarded_bid_cents: 9000000 }
              as: DeveloperOperator
              captures: { req_final: $.data.required_bond_cents, b_status: $.data.status }
          assert:
            - "captured req_prov == 11000000 (110% of 10000000, provisional basis)"
            - "captured req_final == 9900000 (110% of 9000000, final basis)"
            - "req_prov != req_final for identical bond record"
            - "captured b_status == BID_FINAL"

      - name: absorption_pace_straight_line_vs_trailing
        grounds:
          - calculations.absorption_pace
          - entities.Parcel.fields.straight_line_pace_pm
          - entities.Parcel.fields.trailing_weighted_pace_pm
        distinguishing_aspect: |
          Forecast/planning domain (different entity domain from the bond instance):
          with 8 recorded lots and 24 planned months the STRAIGHT_LINE pace is 0.3333
          while the TRAILING_WEIGHTED pace over actual closings (2 in C1, 1 in C2, 0 in
          C3) is 1.3 — two valid pace algorithms produce different projections.
        test_recipe:
          setup:
            - "Parcel P ACQUIRED with phase PH ACTIVE, 8 lots recorded, planned_sellout_months 24"
            - "Agreement AG ACTIVE (min 1/quarter, scheduled 8); loan LN ACTIVE"
            - "Closing C_A finalized with clock 2026-06-05; closings C_B and C_C finalized with clock 2026-07-20; clock ends at 2026-08-01"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels"
              payload: { parcel_name: "P2", county: "Travis", earnest_money_cents: 500000, planned_sellout_months: 24, absorption_method: "TRAILING_WEIGHTED" }
              as: DeveloperOperator
              captures: { p2: $.data.id }
            - call: "POST /api/parcels/${p2}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${p2}/clear-contingency"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/phases"
              payload: { parcel_id: "${p2}", phase_name: "PH", sequence_number: 1, planned_lot_count: 8, selling_window_start: "2026-07-01T00:00:00Z", selling_window_end: "2027-06-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { ph2: $.data.id }
            - call: "POST /api/phases/${ph2}/submit-plat"
              payload: { plat_lot_count: 8, lot_type: "STANDARD" }
              as: DeveloperOperator
            - call: "POST /api/phases/${ph2}/review-plat"
              payload: { decision: "APPROVE" }
              as: MunicipalClerk
            - call: "POST /api/phases/${ph2}/record-plat"
              payload: {}
              as: MunicipalClerk
            - call: "POST /api/infrastructure-bonds"
              payload: { phase_id: "${ph2}", engineer_estimate_cents: 10000000 }
              as: DeveloperOperator
              captures: { bd2: $.data.id }
            - call: "POST /api/infrastructure-bonds/${bd2}/award-bid"
              payload: { awarded_bid_cents: 9000000 }
              as: DeveloperOperator
            - call: "POST /api/infrastructure-bonds/${bd2}/post-bond"
              payload: { posted_amount_cents: 9900000 }
              as: DeveloperOperator
            - call: "POST /api/phases/${ph2}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/builders"
              payload: { builder_name: "B Co", license_number: "LIC-1", contact_email: "b@x.com" }
              as: DeveloperOperator
              captures: { bldr2: $.data.id }
            - call: "POST /api/takedown-agreements"
              payload: { parcel_id: "${p2}", builder_id: "${bldr2}", effective_date: "2026-01-01T00:00:00Z", base_lot_price_cents: 5000000, escalator_rate_bp_per_quarter: 300, price_cap_bp: 12000, min_lots_per_quarter: 1, scheduled_lot_count: 8 }
              as: DeveloperOperator
              captures: { ag2: $.data.id }
            - call: "POST /api/takedown-agreements/${ag2}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/development-loans"
              payload: { parcel_id: "${p2}", commitment_amount_cents: 20000000, release_price_floor_bp: 8000 }
              as: DeveloperOperator
              captures: { ln2: $.data.id }
            - call: "POST /api/development-loans/${ln2}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "GET /api/lots?phase_id=${ph2}"
              as: DeveloperOperator
              captures: { lot_a: $.data.0.id, lot_b: $.data.1.id, lot_c: $.data.2.id }
            - call: "POST /api/lots/${lot_a}/reserve"
              payload: { agreement_id: "${ag2}" }
              as: BuilderRep
              as_user_id: "${bldr2}"
            - call: "POST /api/lot-closings"
              payload: { lot_id: "${lot_a}", agreement_id: "${ag2}" }
              as: BuilderRep
              as_user_id: "${bldr2}"
              captures: { cl_a: $.data.id }
            - call: "POST /api/lot-closings/${cl_a}/finalize"
              payload: {}
              as: LenderOfficer
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-20T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/lots/${lot_b}/reserve"
              payload: { agreement_id: "${ag2}" }
              as: BuilderRep
              as_user_id: "${bldr2}"
            - call: "POST /api/lot-closings"
              payload: { lot_id: "${lot_b}", agreement_id: "${ag2}" }
              as: BuilderRep
              as_user_id: "${bldr2}"
              captures: { cl_b: $.data.id }
            - call: "POST /api/lot-closings/${cl_b}/finalize"
              payload: {}
              as: LenderOfficer
            - call: "POST /api/lots/${lot_c}/reserve"
              payload: { agreement_id: "${ag2}" }
              as: BuilderRep
              as_user_id: "${bldr2}"
            - call: "POST /api/lot-closings"
              payload: { lot_id: "${lot_c}", agreement_id: "${ag2}" }
              as: BuilderRep
              as_user_id: "${bldr2}"
              captures: { cl_c: $.data.id }
            - call: "POST /api/lot-closings/${cl_c}/finalize"
              payload: {}
              as: LenderOfficer
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DeveloperOperator
          trigger:
            - call: "GET /api/parcels/${p2}"
              as: DeveloperOperator
              captures: { pace_sl: $.data.straight_line_pace_pm, pace_tw: $.data.trailing_weighted_pace_pm, pace_sel: $.data.selected_pace_pm }
          assert:
            - "captured pace_sl == 0.3333 (8 lots / 24 months, 4dp)"
            - "captured pace_tw == 1.3 (0.5*2 + 0.3*1 + 0.2*0 over trailing 30-day windows at 2026-08-01)"
            - "pace_sl != pace_tw for identical parcel data"
            - "captured pace_sel == 1.3 (TRAILING_WEIGHTED method selects the trailing variant)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: lot_price_escalator_cap_tier
        grounds:
          - calculations.lot_current_price
          - calculations.quarters_elapsed
          - entities.LotClosing.fields.contract_price_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (quarters elapsed, cap basis points, volume tier) with
          non-linear interaction — agreement A1 (escalator 300bp) prices at the
          compounded 5304500 while agreement A2 (escalator 1500bp, same base and
          effective date) is pinned by min() to the 120% cap 6000000 instead of its
          uncapped 6612500.
        test_recipe:
          setup:
            - "Parcel P ACQUIRED; phase ACTIVE with >= 2 lots; loan ACTIVE"
            - "Agreement A1: base 5000000, esc 300bp/qtr, cap 12000bp, effective 2026-01-01; Agreement A2: same but esc 1500bp/qtr; both ACTIVE, closed_lot_count 0"
            - "Default clock 2026-08-01 -> quarters_elapsed == 2 for both"
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "P3", county: "Travis", earnest_money_cents: 500000 }
              as: DeveloperOperator
              captures: { p3: $.data.id }
            - call: "POST /api/parcels/${p3}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${p3}/clear-contingency"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/phases"
              payload: { parcel_id: "${p3}", phase_name: "PH", sequence_number: 1, planned_lot_count: 4, selling_window_start: "2026-09-01T00:00:00Z", selling_window_end: "2027-03-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { ph3: $.data.id }
            - call: "POST /api/phases/${ph3}/submit-plat"
              payload: { plat_lot_count: 4, lot_type: "STANDARD" }
              as: DeveloperOperator
            - call: "POST /api/phases/${ph3}/review-plat"
              payload: { decision: "APPROVE" }
              as: MunicipalClerk
            - call: "POST /api/phases/${ph3}/record-plat"
              payload: {}
              as: MunicipalClerk
            - call: "POST /api/infrastructure-bonds"
              payload: { phase_id: "${ph3}", engineer_estimate_cents: 10000000 }
              as: DeveloperOperator
              captures: { bd3: $.data.id }
            - call: "POST /api/infrastructure-bonds/${bd3}/award-bid"
              payload: { awarded_bid_cents: 9000000 }
              as: DeveloperOperator
            - call: "POST /api/infrastructure-bonds/${bd3}/post-bond"
              payload: { posted_amount_cents: 9900000 }
              as: DeveloperOperator
            - call: "POST /api/phases/${ph3}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/builders"
              payload: { builder_name: "B1 Co", license_number: "LIC-10", contact_email: "b1@x.com" }
              as: DeveloperOperator
              captures: { bldr3a: $.data.id }
            - call: "POST /api/builders"
              payload: { builder_name: "B2 Co", license_number: "LIC-11", contact_email: "b2@x.com" }
              as: DeveloperOperator
              captures: { bldr3b: $.data.id }
            - call: "POST /api/takedown-agreements"
              payload: { parcel_id: "${p3}", builder_id: "${bldr3a}", effective_date: "2026-01-01T00:00:00Z", base_lot_price_cents: 5000000, escalator_rate_bp_per_quarter: 300, price_cap_bp: 12000, min_lots_per_quarter: 1, scheduled_lot_count: 4 }
              as: DeveloperOperator
              captures: { ag3a: $.data.id }
            - call: "POST /api/takedown-agreements"
              payload: { parcel_id: "${p3}", builder_id: "${bldr3b}", effective_date: "2026-01-01T00:00:00Z", base_lot_price_cents: 5000000, escalator_rate_bp_per_quarter: 1500, price_cap_bp: 12000, min_lots_per_quarter: 1, scheduled_lot_count: 4 }
              as: DeveloperOperator
              captures: { ag3b: $.data.id }
            - call: "POST /api/takedown-agreements/${ag3a}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/takedown-agreements/${ag3b}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/development-loans"
              payload: { parcel_id: "${p3}", commitment_amount_cents: 50000000, release_price_floor_bp: 8000 }
              as: DeveloperOperator
              captures: { ln3: $.data.id }
            - call: "POST /api/development-loans/${ln3}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "GET /api/lots?phase_id=${ph3}"
              as: DeveloperOperator
              captures: { lot3a: $.data.0.id, lot3b: $.data.1.id }
            - call: "POST /api/lots/${lot3a}/reserve"
              payload: { agreement_id: "${ag3a}" }
              as: BuilderRep
              as_user_id: "${bldr3a}"
            - call: "POST /api/lots/${lot3b}/reserve"
              payload: { agreement_id: "${ag3b}" }
              as: BuilderRep
              as_user_id: "${bldr3b}"
          trigger:
            - call: "POST /api/lot-closings"
              payload: { lot_id: "${lot3a}", agreement_id: "${ag3a}" }
              as: BuilderRep
              as_user_id: "${bldr3a}"
              captures: { price_a: $.data.contract_price_cents }
            - call: "POST /api/lot-closings"
              payload: { lot_id: "${lot3b}", agreement_id: "${ag3b}" }
              as: BuilderRep
              as_user_id: "${bldr3b}"
              captures: { price_b: $.data.contract_price_cents }
          assert:
            - "captured price_a == 5304500 (5000000 * 1.03^2, under the 6000000 cap, tier 0 discount)"
            - "captured price_b == 6000000 (uncapped 6612500 pinned down by min() to the 120% cap)"
            - "price_a != price_b although both share base price, effective date and quarter count"

      - name: draw_disbursement_nested_rounding
        grounds:
          - calculations.draw_disbursement
          - entities.LoanDraw.fields.retainage_cents
          - entities.LoanDraw.fields.draw_fee_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order matters (different mode from the
          price instance): pinned order (retainage rounded from gross first, fee rounded
          from the post-retainage base second) yields net 945345 on gross 1000100; the
          flipped order yields 945344 — the scaffold pins retainage-first.
        test_recipe:
          setup:
            - "Parcel P ACQUIRED; loan LN ACTIVE with commitment 20000000"
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "P4", county: "Travis", earnest_money_cents: 500000 }
              as: DeveloperOperator
              captures: { p4: $.data.id }
            - call: "POST /api/parcels/${p4}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${p4}/clear-contingency"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/development-loans"
              payload: { parcel_id: "${p4}", commitment_amount_cents: 20000000, release_price_floor_bp: 8000 }
              as: DeveloperOperator
              captures: { ln4: $.data.id }
            - call: "POST /api/development-loans/${ln4}/activate"
              payload: {}
              as: DeveloperOperator
          trigger:
            - call: "POST /api/loan-draws"
              payload: { loan_id: "${ln4}", line_items: [{ description: "grading", amount_cents: 1000100 }] }
              as: DeveloperOperator
              as_user_id: "dev-user-1"
              captures: { dr4: $.data.id, dr_gross: $.data.gross_amount_cents, dr_ret: $.data.retainage_cents, dr_fee: $.data.draw_fee_cents, dr_net: $.data.net_disbursed_cents }
          assert:
            - "captured dr_gross == 1000100"
            - "captured dr_ret == 50005 (round_half_up(1000100 * 0.05))"
            - "captured dr_fee == 4750 (round_half_up((1000100 - 50005) * 0.005))"
            - "captured dr_net == 945345 (flipped order would give 945344 — the pinned order is observable)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: agreement_default_cure_cycle
        grounds:
          - state_machines.TakedownAgreement.ACTIVE_to_DEFAULTED
          - state_machines.TakedownAgreement.DEFAULTED_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on TakedownAgreement: ACTIVE -> DEFAULTED -> ACTIVE via cure —
          the agreement loops back to a prior state rather than following a linear
          pipeline, and default_reason is set then cleared across the loop.
        test_recipe:
          setup:
            - "Parcel P ACQUIRED; agreement AG ACTIVE with effective_date 2026-01-01, min_lots_per_quarter 2, closed_lot_count 0; default clock 2026-08-01 -> quarters_elapsed 2 -> required_by_now 4 > 0 (behind schedule)"
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "P5", county: "Travis", earnest_money_cents: 500000 }
              as: DeveloperOperator
              captures: { p5: $.data.id }
            - call: "POST /api/parcels/${p5}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${p5}/clear-contingency"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/builders"
              payload: { builder_name: "B5 Co", license_number: "LIC-50", contact_email: "b5@x.com" }
              as: DeveloperOperator
              captures: { bldr5: $.data.id }
            - call: "POST /api/takedown-agreements"
              payload: { parcel_id: "${p5}", builder_id: "${bldr5}", effective_date: "2026-01-01T00:00:00Z", base_lot_price_cents: 5000000, escalator_rate_bp_per_quarter: 300, price_cap_bp: 12000, min_lots_per_quarter: 2, scheduled_lot_count: 8 }
              as: DeveloperOperator
              captures: { ag5: $.data.id }
            - call: "POST /api/takedown-agreements/${ag5}/activate"
              payload: {}
              as: DeveloperOperator
          trigger:
            - call: "POST /api/takedown-agreements/${ag5}/declare-default"
              payload: { reason: "missed Q2 takedown" }
              as: DeveloperOperator
              captures: { st_default: $.data.status, dr5: $.data.default_reason }
            - call: "POST /api/takedown-agreements/${ag5}/cure"
              payload: { cure_note: "builder posted cure letter" }
              as: DeveloperOperator
              captures: { st_cured: $.data.status, dr5_after: $.data.default_reason }
          assert:
            - "captured st_default == DEFAULTED"
            - "captured dr5 == 'missed Q2 takedown'"
            - "captured st_cured == ACTIVE (cycle back to the originating state)"
            - "captured dr5_after == null (cleared on cure)"

      - name: lot_parallel_sales_lien_dimensions
        grounds:
          - state_machines.Lot
          - entities.Lot.fields.sales_status
          - entities.Lot.fields.lien_status
        distinguishing_aspect: |
          Parallel state dimensions on the Lot entity (different entity from the
          agreement instance): reserve moves only sales_status (PLATTED -> RESERVED,
          lien stays ENCUMBERED), closing creation moves both independently
          (UNDER_CONTRACT x RELEASE_PENDING), and cancel reverts both
          (RESERVED x ENCUMBERED) — two independent axes on one row.
        test_recipe:
          setup:
            - "Parcel P ACQUIRED; phase ACTIVE with lots; agreement AG ACTIVE; loan LN ACTIVE; lot L PLATTED x ENCUMBERED"
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "P6", county: "Travis", earnest_money_cents: 500000 }
              as: DeveloperOperator
              captures: { p6: $.data.id }
            - call: "POST /api/parcels/${p6}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${p6}/clear-contingency"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/phases"
              payload: { parcel_id: "${p6}", phase_name: "PH", sequence_number: 1, planned_lot_count: 3, selling_window_start: "2026-09-01T00:00:00Z", selling_window_end: "2027-03-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { ph6: $.data.id }
            - call: "POST /api/phases/${ph6}/submit-plat"
              payload: { plat_lot_count: 3, lot_type: "STANDARD" }
              as: DeveloperOperator
            - call: "POST /api/phases/${ph6}/review-plat"
              payload: { decision: "APPROVE" }
              as: MunicipalClerk
            - call: "POST /api/phases/${ph6}/record-plat"
              payload: {}
              as: MunicipalClerk
            - call: "POST /api/infrastructure-bonds"
              payload: { phase_id: "${ph6}", engineer_estimate_cents: 10000000 }
              as: DeveloperOperator
              captures: { bd6: $.data.id }
            - call: "POST /api/infrastructure-bonds/${bd6}/award-bid"
              payload: { awarded_bid_cents: 9000000 }
              as: DeveloperOperator
            - call: "POST /api/infrastructure-bonds/${bd6}/post-bond"
              payload: { posted_amount_cents: 9900000 }
              as: DeveloperOperator
            - call: "POST /api/phases/${ph6}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/builders"
              payload: { builder_name: "B6 Co", license_number: "LIC-60", contact_email: "b6@x.com" }
              as: DeveloperOperator
              captures: { bldr6: $.data.id }
            - call: "POST /api/takedown-agreements"
              payload: { parcel_id: "${p6}", builder_id: "${bldr6}", effective_date: "2026-01-01T00:00:00Z", base_lot_price_cents: 5000000, escalator_rate_bp_per_quarter: 300, price_cap_bp: 12000, min_lots_per_quarter: 1, scheduled_lot_count: 3 }
              as: DeveloperOperator
              captures: { ag6: $.data.id }
            - call: "POST /api/takedown-agreements/${ag6}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/development-loans"
              payload: { parcel_id: "${p6}", commitment_amount_cents: 20000000, release_price_floor_bp: 8000 }
              as: DeveloperOperator
              captures: { ln6: $.data.id }
            - call: "POST /api/development-loans/${ln6}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "GET /api/lots?phase_id=${ph6}"
              as: DeveloperOperator
              captures: { lot6: $.data.0.id }
          trigger:
            - call: "POST /api/lots/${lot6}/reserve"
              payload: { agreement_id: "${ag6}" }
              as: BuilderRep
              as_user_id: "${bldr6}"
              captures: { sales_r: $.data.sales_status, lien_r: $.data.lien_status }
            - call: "POST /api/lot-closings"
              payload: { lot_id: "${lot6}", agreement_id: "${ag6}" }
              as: BuilderRep
              as_user_id: "${bldr6}"
              captures: { cl6: $.data.id }
            - call: "GET /api/lots/${lot6}"
              as: DeveloperOperator
              captures: { sales_c: $.data.sales_status, lien_c: $.data.lien_status }
            - call: "POST /api/lot-closings/${cl6}/cancel"
              payload: {}
              as: BuilderRep
              as_user_id: "${bldr6}"
            - call: "GET /api/lots/${lot6}"
              as: DeveloperOperator
              captures: { sales_x: $.data.sales_status, lien_x: $.data.lien_status }
          assert:
            - "after reserve: sales_r == RESERVED while lien_r == ENCUMBERED (lien dimension untouched)"
