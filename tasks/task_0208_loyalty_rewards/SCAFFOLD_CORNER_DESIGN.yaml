# =============================================================================
# §1.9 Scaffold Corner Design (Breadth coverage of non-Difficulty claims)
# Walks references/claim-extraction-guide.md row-by-row against §1.1–§1.7.
# excluded_because stubs point to §1.8 instances that already cover a corner.
# Canonical config matches SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_member_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "POST /members with all required fields -> 201; response carries server-minted id, version=1, status=ACTIVE, current_tier_code=STANDARD."
        test_recipe:
          setup: ["ACTIVE program with a STANDARD tier."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id, m_v: $.data.version }
          assert:
            - "response.status == 201"
            - "Member.${m_id}.status == ACTIVE"
            - "Member.${m_id}.current_tier_code == STANDARD"
            - "Member.${m_id}.version == 1"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{non-existent uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["No member with the queried id exists."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_member_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Member.fields.email, "validations[priority=5]"]
        distinguishing_aspect: "POST /members without email -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["ACTIVE program exists."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /members"
              payload: { program_id: "${prog_id}", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: duplicate_member_email_within_program_returns_409
        claim_type: Type Constraints
        grounds: ["validations[priority=6]", "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Second POST /members with an email already used in the program -> ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["ACTIVE program; member m@x.com already registered."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
          trigger:
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M2", birth_month_day: "04-10" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_EMAIL"

      - name: purchase_event_computed_fields_ignore_client_input
        claim_type: Computed Fields
        grounds: [entities.PurchaseEvent.fields.earned_points, entities.PurchaseEvent.fields.qualifying_points]
        distinguishing_aspect: "earned_points and qualifying_points are server-computed; STANDARD member spending 10000c earns 100 and qualifies 100."
        test_recipe:
          setup: ["ACTIVE program STANDARD tier; member M."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /purchase-events"
              payload: { member_id: "${m_id}", eligible_amount_cents: 10000 }
              as: ProgramAdmin
              captures: { earned: $.data.earned_points, qual: $.data.qualifying_points }
          assert:
            - "PurchaseEvent.earned_points == 100"
            - "PurchaseEvent.qualifying_points == 100"

      - name: tier_duplicate_rank_returns_409
        claim_type: Type Constraints
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_TIER]"]
        distinguishing_aspect: "Defining a second Tier with a rank already used in the program -> ERR_DUPLICATE_TIER (409)."
        test_recipe:
          setup: ["Program with STANDARD tier (rank 0); attempt another tier at rank 0."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "SILVER", qualify_threshold: 2000, earn_multiplier: 1.25, transfer_ratio: 0.6, rank: 0 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_DUPLICATE_TIER"

      - name: list_members_filtered_by_program_paginated
        claim_type: Listing
        grounds: [entities.Member.fields.program_id, endpoints]
        distinguishing_aspect: "GET /members?program_id=... returns Member[] with pagination meta total_count and has_more."
        test_recipe:
          setup: ["ACTIVE program with one member."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /members"
              payload: { program_id: "${prog_id}", limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "response.response_type == array"
            - "result contains a member with id == ${m_id}"
            - "meta/pagination exposes total_count and has_more"

      - name: pagination_limit_out_of_bounds_returns_422
        claim_type: Type Constraints
        grounds: ["validations[priority=5]", "errors[ERR_VALIDATION_LIMIT]"]
        distinguishing_aspect: "GET /members?limit=0 -> ERR_VALIDATION_LIMIT (422); limit must be in [1,100]."
        test_recipe:
          setup: ["ACTIVE program exists."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /members"
              payload: { program_id: "${prog_id}", limit: 0 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_VALIDATION_LIMIT"

      - name: negative_purchase_amount_returns_422
        claim_type: Type Constraints
        grounds: ["validations[priority=5]", "errors[ERR_NEGATIVE_AMOUNT]"]
        distinguishing_aspect: "POST /purchase-events with eligible_amount_cents = -1 -> ERR_NEGATIVE_AMOUNT (422)."
        test_recipe:
          setup: ["ACTIVE program; member M."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /purchase-events"
              payload: { member_id: "${m_id}", eligible_amount_cents: -1 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_NEGATIVE_AMOUNT"

      - name: invalid_rate_on_program_create_returns_422
        claim_type: Type Constraints
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_RATE]"]
        distinguishing_aspect: "POST /programs with base_earn_rate = 0 -> ERR_INVALID_RATE (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_RATE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: birthday_grant_mints_lot_and_marks_year
        claim_type: Side Effect Execution
        grounds: [endpoints, entities.PointsLot.fields.source_type, entities.Member.fields.last_birthday_grant_year, "validations[priority=22]"]
        distinguishing_aspect: "On the member's birthday, POST /members/{id}/birthday-grant mints a BIRTHDAY lot of 200, sets last_birthday_grant_year=2026, available_points becomes 200."
        test_recipe:
          setup: ["ACTIVE program birthday_reward_points=200; member born 03-10; clock 2026-03-10."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /members/${m_id}/birthday-grant"
              payload: {}
              as: ProgramAdmin
              captures: { lot_id: $.data.id, orig: $.data.original_points }
          assert:
            - "response.status == 201"
            - "PointsLot.${lot_id}.original_points == 200"
            - "PointsLot.${lot_id}.source_type == BIRTHDAY"
            - "Member.${m_id}.available_points == 200"
            - "Member.${m_id}.last_birthday_grant_year == 2026"

      - name: birthday_grant_twice_same_year_returns_409
        claim_type: Idempotency
        grounds: ["validations[priority=21]", "errors[ERR_BIRTHDAY_ALREADY_GRANTED]"]
        distinguishing_aspect: "Second birthday grant in the same calendar year -> ERR_BIRTHDAY_ALREADY_GRANTED (409)."
        test_recipe:
          setup: ["Member granted birthday once on 2026-03-10; attempt again same day."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/birthday-grant"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /members/${m_id}/birthday-grant"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BIRTHDAY_ALREADY_GRANTED"

      - name: birthday_grant_off_date_returns_409
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=22]", "errors[ERR_NOT_BIRTHDAY]"]
        distinguishing_aspect: "Birthday grant when clock MM-DD != birth_month_day -> ERR_NOT_BIRTHDAY (409)."
        test_recipe:
          setup: ["Member born 03-10; clock 2026-07-01."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /members/${m_id}/birthday-grant"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NOT_BIRTHDAY"

      - name: expiration_sweep_expires_past_lot_zeroes_balance
        claim_type: Side Effect Execution
        grounds: [state_machines.PointsLot.ACTIVE_to_EXPIRED, calculations.expiration_sweep, entities.PointsTransaction.fields.type]
        distinguishing_aspect: "Sweep after a lot's expires_at sets the lot EXPIRED, appends an EXPIRE transaction with delta -600, and available_points drops to 0."
        test_recipe:
          setup: ["Member with one 600-point lot created 2026-01-15 (expires 2027-01-15); clock 2027-02-01."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
            - call: "POST /purchase-events"
              payload: { member_id: "${m_id}", eligible_amount_cents: 60000 }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${prog_id}/sweep-expirations"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Member.${m_id}.available_points == 0"
            - "The 600-lot has status == EXPIRED and remaining_points == 0"
            - "A PointsTransaction of type EXPIRE with points_delta == -600 exists for the member"

      - name: promotion_refresh_scheduled_to_active_to_ended
        claim_type: Valid Transition
        grounds: [state_machines.Promotion.SCHEDULED_to_ACTIVE, state_machines.Promotion.ACTIVE_to_ENDED]
        distinguishing_aspect: "refresh-promotions moves a promotion SCHEDULED->ACTIVE inside [start,end) and ACTIVE->ENDED once clock >= end."
        test_recipe:
          setup: ["Program with promotion [2026-06-01, 2026-07-01); clock advanced past the window."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/promotions"
              payload: { program_id: "${prog_id}", name: "DBL", bonus_multiplier: 2.0, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-07-01T00:00:00Z", min_eligible_cents: 0 }
              as: ProgramAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/refresh-promotions"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /programs/${prog_id}/refresh-promotions"
              payload: {}
              as: ProgramAdmin
            - call: "GET /programs/${prog_id}/promotions"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Promotion.${promo_id}.status == ENDED"

      - name: cancel_already_fulfilled_redemption_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Redemption.QUOTED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a FULFILLED (terminal) redemption -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Redemption confirmed then fulfilled (terminal)."]
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/rewards"
