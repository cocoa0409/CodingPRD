      - name: shipment_deliver_moves_tons_from_origin_to_destination
        claim_type: valid_transition
        grounds:
          - state_machines.Shipment.IN_TRANSIT_to_DELIVERED
          - calculations.storage_position
          - calculations.shipment_freight_total
          - endpoints[POST /nitrogen-ops/shipments/{id}/deliver]
          - roles[TerminalOperator]
        distinguishing_aspect: |
          The receiving terminal's acknowledgement is the only event that moves inventory: after
          deliver with received_tons 98 the origin holds 900.000 with reserved_tons back to 0.000 and
          the destination holds 98.000, and the 2 tons of transit loss simply leave the network.
        test_recipe:
          setup:
            - "One plant with a non-regulated UREA product line."
            - "Origin terminal UT-ORIG capacity 20000 with an opening balance of 1000 tons; destination terminal UT-DEST capacity 20000 with no opening balance."
            - "One RAIL shipment SH-1 of 100 tons over 100 miles, booked and departed."
          setup_api_calls:
            - call: "POST /nitrogen-ops/plants"
              payload: { name: "Yazoo City Complex", site_code: "YZC-1", permit_limit_tons_30d: 12.00, spot_gas_index_usd_per_mmbtu: 4.20 }
              as: RegulatoryAdmin
              captures: { plant_id: $.data.id }
            - call: "POST /nitrogen-ops/product-lines"
              payload: { plant_id: "${plant_id}", product_code: "UREA", ammonia_tons_per_product_ton: 0.58, conversion_cost_usd_per_ton: 38.00, regulated: false, priority_rank: 1 }
              as: CommercialManager
              captures: { line_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-ORIG", asset_kind: "TERMINAL", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { origin_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets"
              payload: { plant_id: "${plant_id}", asset_code: "UT-DEST", asset_kind: "TERMINAL", product_code: "UREA", capacity_tons: 20000, security_class: "BASIC", seasonal_reserve_pct: 0.00 }
              as: LogisticsCoordinator
              captures: { dest_id: $.data.id }
            - call: "POST /nitrogen-ops/storage-assets/{id}/opening-balance"
              payload: { opening_balance_tons: 1000 }
              as: LogisticsCoordinator
            - call: "POST /nitrogen-ops/shipments"
              payload: { origin_asset_id: "${origin_id}", dest_asset_id: "${dest_id}", shipment_code: "SH-1", mode: "RAIL", tons: 100, distance_miles: 100, window_start: "2026-08-05T00:00:00Z", window_end: "2026-08-10T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { ship_id: $.data.id }
            - call: "GET /nitrogen-ops/storage-assets/{id}"
              payload: {}
              as: LogisticsCoordinator
              captures: { origin_ver: $.data.version }
            - call: "POST /nitrogen-ops/shipments/{id}/book"
              payload: { expected_origin_asset_version: "${origin_ver}" }
              as: LogisticsCoordinator
            - call: "POST /nitrogen-ops/shipments/{id}/depart"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /nitrogen-ops/shipments/{id}/deliver"
              payload: { received_tons: 98 }
              as: TerminalOperator
              as_user_id: "${dest_id}"
          assert:
            - "the trigger call returns HTTP status 200"
            - "Shipment.${ship_id}.status == DELIVERED"
            - "Shipment.${ship_id}.received_tons == 98.000"
            - "Shipment.${ship_id}.base_freight_usd == 2200.00"
            - "Shipment.${ship_id}.fuel_surcharge_usd == 187.00"
            - "Shipment.${ship_id}.freight_total_usd == 2387.00"
            - "Shipment.${ship_id}.freight_per_ton_usd == 23.8700"
            - "StorageAsset.${origin_id}.on_hand_tons == 900.000"
            - "StorageAsset.${origin_id}.reserved_tons == 0.000"
            - "StorageAsset.${origin_id}.available_tons == 900.000"
            - "StorageAsset.${dest_id}.on_hand_tons == 98.000"
            - "StorageAsset.${dest_id}.available_tons == 98.000"

