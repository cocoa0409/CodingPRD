      - name: attribution_beyond_the_case_total_rejected
        claim_type: violation_error
        grounds:
          - validations[priority=60]
          - calculations.variance_case_opening
          - errors[ERR_ATTRIBUTION_EXCEEDS_VARIANCE]
        distinguishing_aspect: >
          The conservation identity is enforced on the way in: with 2000 already attributed to REGISTER
          on a 3000 case, a further 1500 to SAFE would total 3500 and is refused with 422
          ERR_ATTRIBUTION_EXCEEDS_VARIANCE, leaving unexplained_cents at 1000 and the case version
          unchanged.
        test_recipe:
          setup:
            - "Store S-1946 (default thresholds), MANUAL safe SAFE-A (500000), cashier E-100, journal 2026-08-03"
            - "Session reconciles 3000 short, opening one SESSION_VARIANCE case; 2000 is attributed to REGISTER"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1946", name: "Store 1946", region_code: "WEST" }
              as: TreasuryAnalyst
