scenario: |
  Casino Loyalty Tier (Caesars Rewards): Tier Credit, Comp room rate, Host
  assignment, responsible gambling self-exclusion, Velocity monitoring,
  annual Reset, cross-property universal

domain_name: "casino-loyalty-caesars-rewards"
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - scheduled_deferred_actions

  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Full legal name."
      - name: email
        type: string
        source: input
        description: "Unique member email (case-insensitive)."
        constraints: "unique across all Member rows; max 254 chars"
      - name: home_property_id
        type: string
        source: input
        description: "FK -> Property.id; the member's enrolling/home property. Universal across all properties."
      - name: tier_status
        type: enum
        source: computed
        description: "Loyalty tier driven by tier_credits_ytd thresholds at last evaluation (recomputed on every TierCreditAccrual and on AnnualResetRun)."
        default: "GOLD"
        constraints: "enum: {GOLD, PLATINUM, DIAMOND, SEVEN_STARS}"
      - name: tier_credits_ytd
        type: number
        source: computed
        description: "Year-to-date Tier Credits in the current reset year, computed by calculations.tier_credit_accrual. Resets to 0 on AnnualResetRun.finalize."
        default: 0
      - name: tier_credits_lifetime
        type: number
        source: computed
        description: "Lifetime cumulative Tier Credits. Never resets; advances on every TierCreditAccrual."
        default: 0
      - name: exclusion_status
        type: enum
        source: computed
        description: "Responsible-gambling self-exclusion posture. Independent of tier_status (parallel dimension)."
        default: "NOT_EXCLUDED"
        constraints: "enum: {NOT_EXCLUDED, EXCLUDED, REINSTATED}"
      - name: velocity_status
        type: enum
        source: computed
        description: "Velocity-monitoring posture for high-rate play. Independent of tier_status and exclusion_status (parallel dimension)."
        default: "NORMAL"
        constraints: "enum: {NORMAL, FLAGGED, SUSPENDED}"
      - name: assigned_host_id
        type: string
        source: computed
        description: "FK -> Host.id; currently active HostAssignment.host_id where status=ACTIVE, or null if none. Updated by HostAssignment side effects."
        default: null

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Property display name (e.g., 'Caesars Palace Las Vegas')."
      - name: market_segment
        type: enum
        source: input
        description: "Comp rate band used by calculations.comp_room_rate."
        constraints: "enum: {VEGAS_STRIP, REGIONAL, INTERNATIONAL}"
      - name: base_room_rate_cents
        type: integer
        source: input
        description: "Property's standard nightly room rate in USD cents before any comp discount."
        constraints: "integer >= 0"
      - name: status
        type: enum
        source: computed
        description: "Property operational status."
        default: "OPEN"
        constraints: "enum: {OPEN, CLOSED}"

  - name: Host
    parent: null
    common_fields: true
    fields:
      - name: employee_email
        type: string
        source: input
        description: "Unique host work email (case-insensitive)."
        constraints: "unique across Host rows"
      - name: home_property_id
        type: string
        source: input
        description: "FK -> Property.id; the property that employs this host."
      - name: status
        type: enum
        source: computed
        description: "Host employment status."
        default: "ACTIVE"
        constraints: "enum: {ACTIVE, INACTIVE}"

  - name: GamingSession
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the playing member."
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property where the session was played."
      - name: started_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start of session."
      - name: ended_at
        type: datetime
        source: input
        description: "ISO 8601 UTC end of session."
        constraints: "must be > started_at"
      - name: game_type
        type: enum
        source: input
        description: "Game class used in tier_credit_accrual.formula."
        constraints: "enum: {SLOTS, TABLE_GAMES, POKER}"
      - name: theoretical_loss_cents
        type: integer
        source: input
        description: "Theoretical loss in USD cents — the input to tier_credit_accrual."
        constraints: "integer >= 0"
      - name: tier_credits_earned
        type: number
        source: computed
        description: "Tier Credits this session contributed (per calculations.tier_credit_accrual). Populated on POST."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Session lifecycle."
        default: "RECORDED"
        constraints: "enum: {RECORDED, VOIDED}"

  - name: CompRoomBooking
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member the booking is for."
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property where the room is booked."
      - name: check_in
        type: datetime
        source: input
        description: "ISO 8601 UTC arrival timestamp."
      - name: check_out
        type: datetime
        source: input
        description: "ISO 8601 UTC departure timestamp."
        constraints: "must be > check_in; nights = ceil((check_out - check_in)/86400s)"
      - name: nights
        type: integer
        source: computed
        description: "Number of nights derived from check_in/check_out."
        default: 0
      - name: provisional_rate_cents
        type: integer
        source: computed
        description: "Per-night comp rate (USD cents) at booking time, by calculations.comp_room_rate variant=PROVISIONAL."
        default: 0
      - name: final_rate_cents
        type: integer
        source: computed
        description: "Per-night comp rate (USD cents) at check-in time, by calculations.comp_room_rate variant=FINAL."
        default: null
      - name: total_charge_cents
        type: integer
        source: computed
        description: "nights * final_rate_cents (post-CHECKED_IN) else nights * provisional_rate_cents."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Booking lifecycle."
        default: "PENDING"
        constraints: "enum: {PENDING, CONFIRMED, CHECKED_IN, COMPLETED, CANCELLED}"

  - name: SelfExclusion
    parent: null
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member self-excluding."
      - name: requested_at
        type: datetime
        source: system
        description: "ISO 8601 UTC server timestamp at request."
      - name: exclusion_until
        type: datetime
        source: input
        description: "ISO 8601 UTC reinstatement-eligibility date. Min duration enforced in validations."
      - name: reason
        type: string
        source: input
        description: "Free-text member-provided reason."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle."
        default: "ACTIVE"
        constraints: "enum: {ACTIVE, REINSTATED, EXPIRED}"

  - name: HostAssignment
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member receiving host service."
      - name: host_id
        type: string
        source: input
        description: "FK -> Host.id; the assigned host."
      - name: assigned_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the LoyaltyManager who created the assignment. Used for segregation_of_duties: must differ from approved_by_user_id."
      - name: approved_by_user_id
        type: string
        source: system
        description: "Opaque X-User-ID of the LoyaltyManager who approved the assignment. Set by /approve. Segregation_of_duties: must differ from assigned_by_user_id."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Assignment lifecycle."
        default: "PENDING_APPROVAL"
        constraints: "enum: {PENDING_APPROVAL, ACTIVE, REVOKED, REJECTED}"

  - name: VelocityAlert
    parent: null
    common_fields: false
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member tripping the velocity threshold."
      - name: window_start
        type: datetime
        source: system
        description: "ISO 8601 UTC start of the 60-minute window that triggered the alert."
      - name: window_end
        type: datetime
        source: system
        description: "ISO 8601 UTC end of the 60-minute window."
      - name: total_theoretical_loss_cents
        type: integer
        source: computed
        description: "Sum of theoretical_loss_cents for the member's GamingSessions whose ended_at falls in [window_start, window_end] and status=RECORDED. Computed by calculations.velocity_monitor."
        default: 0
      - name: severity
        type: enum
        source: computed
        description: "Threshold band the total crossed; sets the member's velocity_status."
        constraints: "enum: {FLAGGED, SUSPENDED}"

  - name: AnnualResetRun
    parent: null
    common_fields: true
    fields:
      - name: reset_year
        type: integer
        source: input
        description: "Calendar year whose tier_credits_ytd is being wiped (e.g., 2025)."
        constraints: "unique; integer >= 2020"
      - name: scheduled_for
        type: datetime
        source: input
        description: "ISO 8601 UTC moment the reset is scheduled to execute."
      - name: status
        type: enum
        source: computed
        description: "Run lifecycle."
        default: "SCHEDULED"
        constraints: "enum: {SCHEDULED, EXECUTED, CANCELLED}"
      - name: members_reset_count
        type: integer
        source: computed
        description: "Count of Member rows whose tier_credits_ytd was zeroed by this run (only members with exclusion_status != EXCLUDED at execution time)."
        default: 0
      - name: tier_credits_lifetime_invariant_before_cents
        type: integer
        source: computed
        description: "Sum of all Member.tier_credits_lifetime captured immediately before /execute. Used to verify compensating-invariant (Rule 9)."
        default: 0
      - name: tier_credits_lifetime_invariant_after_cents
        type: integer
        source: computed
        description: "Sum of all Member.tier_credits_lifetime captured immediately after /execute. Must equal the _before value (lifetime is never reset)."
        default: 0

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # --- Member: PARALLEL dimensions (tier_status × exclusion_status × velocity_status) ---
  - entity: Member
    dimension: tier_status
    initial_state: GOLD
    terminal_states: []
    transitions:
      - from: GOLD
        to: PLATINUM
        trigger: "POST /gaming-sessions (system, on accrual)"
        actor: system
        preconditions:
          - "Member.exclusion_status != EXCLUDED"
          - "Member.tier_credits_ytd after this session's accrual >= 15000"
        side_effects:
          - "Member.tier_status := PLATINUM"
          - "Member.updated_at := now; Member.version += 1"
      - from: PLATINUM
        to: DIAMOND
        trigger: "POST /gaming-sessions (system, on accrual)"
        actor: system
        preconditions:
          - "Member.exclusion_status != EXCLUDED"
          - "Member.tier_credits_ytd >= 75000"
        side_effects:
          - "Member.tier_status := DIAMOND"
          - "Member.updated_at := now; Member.version += 1"
      - from: DIAMOND
        to: SEVEN_STARS
        trigger: "POST /gaming-sessions (system, on accrual)"
        actor: system
        preconditions:
          - "Member.exclusion_status != EXCLUDED"
          - "Member.tier_credits_ytd >= 150000"
        side_effects:
          - "Member.tier_status := SEVEN_STARS"
          - "Member.updated_at := now; Member.version += 1"
      - from: PLATINUM
        to: GOLD
        trigger: "POST /annual-reset-runs/{id}/execute (system)"
        actor: system
        preconditions:
          - "AnnualResetRun.status == SCHEDULED at trigger time"
          - "Member.exclusion_status != EXCLUDED"
        side_effects:
          - "Member.tier_credits_ytd := 0"
          - "Member.tier_status := GOLD"
          - "Member.updated_at := now; Member.version += 1"
      - from: DIAMOND
        to: GOLD
        trigger: "POST /annual-reset-runs/{id}/execute (system)"
        actor: system
        preconditions:
          - "Member.exclusion_status != EXCLUDED"
        side_effects:
          - "Member.tier_credits_ytd := 0"
          - "Member.tier_status := GOLD"
          - "Member.updated_at := now; Member.version += 1"
      - from: SEVEN_STARS
        to: GOLD
        trigger: "POST /annual-reset-runs/{id}/execute (system)"
        actor: system
        preconditions:
          - "Member.exclusion_status != EXCLUDED"
        side_effects:
          - "Member.tier_credits_ytd := 0"
          - "Member.tier_status := GOLD"
          - "Member.updated_at := now; Member.version += 1"

  - entity: Member
    dimension: exclusion_status
    initial_state: NOT_EXCLUDED
    terminal_states: []
    transitions:
      - from: NOT_EXCLUDED
        to: EXCLUDED
        trigger: "POST /self-exclusions"
        actor: Member
        preconditions:
          - "No SelfExclusion row for this member with status=ACTIVE"
          - "exclusion_until >= requested_at + 365 days"
        side_effects:
          - "Create SelfExclusion row with status=ACTIVE"
          - "Member.exclusion_status := EXCLUDED"
          - "CASCADE: every HostAssignment with member_id=this and status IN {PENDING_APPROVAL, ACTIVE} transitions to REVOKED (depth-2 cascade; see Rule 4)"
          - "CASCADE: every CompRoomBooking with member_id=this and status IN {PENDING, CONFIRMED} transitions to CANCELLED (depth-2 cascade)"
          - "Member.assigned_host_id := null (depth-3 consequence of HostAssignment revoke)"
          - "Member.updated_at := now; Member.version += 1"
      - from: EXCLUDED
        to: REINSTATED
        trigger: "POST /self-exclusions/{id}/reinstate"
        actor: Member
        preconditions:
          - "SelfExclusion.status == ACTIVE"
          - "current_utc >= SelfExclusion.exclusion_until"
        side_effects:
          - "SelfExclusion.status := REINSTATED"
          - "Member.exclusion_status := REINSTATED"
          - "Member.updated_at := now; Member.version += 1"
      - from: REINSTATED
        to: EXCLUDED
        trigger: "POST /self-exclusions (cyclic: same member can self-exclude again)"
        actor: Member
        preconditions:
          - "No SelfExclusion row for this member with status=ACTIVE"
          - "exclusion_until >= requested_at + 365 days"
        side_effects:
          - "Create SelfExclusion row with status=ACTIVE"
          - "Member.exclusion_status := EXCLUDED"
          - "Member.updated_at := now; Member.version += 1"

  - entity: Member
    dimension: velocity_status
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: FLAGGED
        trigger: "POST /gaming-sessions (system, on accrual)"
        actor: system
        preconditions:
          - "VelocityAlert created with severity=FLAGGED for this member"
          - "Member.velocity_status currently NORMAL"
        side_effects:
          - "Member.velocity_status := FLAGGED"
          - "Member.updated_at := now; Member.version += 1"
      - from: FLAGGED
        to: SUSPENDED
        trigger: "POST /gaming-sessions (system, on accrual)"
        actor: system
        preconditions:
          - "VelocityAlert created with severity=SUSPENDED for this member"
        side_effects:
          - "Member.velocity_status := SUSPENDED"
          - "CASCADE: every CompRoomBooking with member_id=this and status IN {PENDING, CONFIRMED} transitions to CANCELLED (depth-2 cascade originating from velocity_status transition; see Rule 4)"
          - "Member.updated_at := now; Member.version += 1"
      - from: NORMAL
        to: SUSPENDED
        trigger: "POST /gaming-sessions (system, on accrual)"
        actor: system
        preconditions:
          - "VelocityAlert created with severity=SUSPENDED for this member"
        side_effects:
          - "Member.velocity_status := SUSPENDED"
          - "CASCADE: every CompRoomBooking with member_id=this and status IN {PENDING, CONFIRMED} transitions to CANCELLED"
          - "Member.updated_at := now; Member.version += 1"
      - from: SUSPENDED
        to: NORMAL
        trigger: "POST /members/{id}/clear-velocity"
        actor: ComplianceOfficer
        preconditions:
          - "Member.velocity_status == SUSPENDED"
          - "Most recent VelocityAlert.window_end is older than current_utc - 24h"
        side_effects:
          - "Member.velocity_status := NORMAL"
          - "Member.updated_at := now; Member.version += 1"

  # --- CompRoomBooking lifecycle (BRANCHING with revert; cross-entity guards) ---
  - entity: CompRoomBooking
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /comp-room-bookings/{id}/confirm"
        actor: LoyaltyManager
        preconditions:
          - "Member.exclusion_status != EXCLUDED (CROSS-ENTITY: Member must not be excluded)"
          - "Member.velocity_status != SUSPENDED (CROSS-ENTITY: Member must not be velocity-suspended)"
          - "Member.tier_status IN {PLATINUM, DIAMOND, SEVEN_STARS} (CROSS-ENTITY)"
        side_effects:
          - "CompRoomBooking.status := CONFIRMED"
          - "CompRoomBooking.updated_at := now; CompRoomBooking.version += 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /comp-room-bookings/{id}/check-in"
        actor: LoyaltyManager
        preconditions:
          - "current_utc >= CompRoomBooking.check_in"
          - "Member.exclusion_status != EXCLUDED"
          - "Member.velocity_status != SUSPENDED"
        side_effects:
          - "Recompute calculations.comp_room_rate variant=FINAL using member's tier_status at this instant"
          - "CompRoomBooking.final_rate_cents := computed value"
          - "CompRoomBooking.total_charge_cents := nights * final_rate_cents"
          - "CompRoomBooking.status := CHECKED_IN"
          - "CompRoomBooking.updated_at := now; CompRoomBooking.version += 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /comp-room-bookings/{id}/check-out"
        actor: LoyaltyManager
        preconditions:
          - "current_utc >= CompRoomBooking.check_out"
        side_effects:
          - "CompRoomBooking.status := COMPLETED"
          - "CompRoomBooking.updated_at := now; CompRoomBooking.version += 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /comp-room-bookings/{id}/cancel OR cascade from Member.exclusion_status NOT_EXCLUDED→EXCLUDED OR cascade from Member.velocity_status →SUSPENDED"
        actor: LoyaltyManager | system
        preconditions:
          - "CompRoomBooking.status == PENDING"
        side_effects:
          - "CompRoomBooking.status := CANCELLED"
          - "CompRoomBooking.updated_at := now; CompRoomBooking.version += 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /comp-room-bookings/{id}/cancel OR cascade from Member.exclusion_status →EXCLUDED OR cascade from Member.velocity_status →SUSPENDED"
        actor: LoyaltyManager | system
        preconditions:
          - "CompRoomBooking.status == CONFIRMED"
        side_effects:
          - "CompRoomBooking.status := CANCELLED"
          - "CompRoomBooking.updated_at := now; CompRoomBooking.version += 1"
      - from: CONFIRMED
        to: PENDING
        trigger: "POST /comp-room-bookings/{id}/revert-to-pending"
        actor: LoyaltyManager
        preconditions:
          - "CompRoomBooking.status == CONFIRMED"
          - "current_utc < CompRoomBooking.check_in"
        side_effects:
          - "CompRoomBooking.status := PENDING"
          - "CompRoomBooking.updated_at := now; CompRoomBooking.version += 1"

  # --- HostAssignment (BRANCHING: PENDING_APPROVAL → ACTIVE | REJECTED; ACTIVE → REVOKED) ---
  - entity: HostAssignment
    initial_state: PENDING_APPROVAL
    terminal_states: [REVOKED, REJECTED]
    transitions:
      - from: PENDING_APPROVAL
        to: ACTIVE
        trigger: "POST /host-assignments/{id}/approve"
        actor: LoyaltyManager
        preconditions:
          - "HostAssignment.status == PENDING_APPROVAL"
          - "X-User-ID of approver MUST differ from HostAssignment.assigned_by_user_id (segregation_of_duties)"
          - "Member.exclusion_status != EXCLUDED (CROSS-ENTITY: cannot assign host to excluded member)"
          - "Host.status == ACTIVE (CROSS-ENTITY: host must be employed)"
          - "No other HostAssignment for this member with status=ACTIVE"
        side_effects:
          - "HostAssignment.approved_by_user_id := X-User-ID"
          - "HostAssignment.status := ACTIVE"
          - "Member.assigned_host_id := HostAssignment.host_id"
          - "Member.updated_at := now; Member.version += 1"
          - "HostAssignment.updated_at := now; HostAssignment.version += 1"
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /host-assignments/{id}/reject"
        actor: LoyaltyManager
        preconditions:
          - "HostAssignment.status == PENDING_APPROVAL"
          - "X-User-ID of rejecter MUST differ from HostAssignment.assigned_by_user_id (segregation_of_duties)"
        side_effects:
          - "HostAssignment.status := REJECTED"
          - "HostAssignment.updated_at := now; HostAssignment.version += 1"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /host-assignments/{id}/revoke OR cascade from Member.exclusion_status →EXCLUDED"
        actor: LoyaltyManager | system
        preconditions:
          - "HostAssignment.status == ACTIVE"
        side_effects:
          - "HostAssignment.status := REVOKED"
          - "Member.assigned_host_id := null (when this was the active assignment)"
          - "Member.updated_at := now; Member.version += 1"
          - "HostAssignment.updated_at := now; HostAssignment.version += 1"
      - from: PENDING_APPROVAL
        to: REVOKED
        trigger: "cascade from Member.exclusion_status NOT_EXCLUDED→EXCLUDED"
        actor: system
        preconditions:
          - "HostAssignment.status == PENDING_APPROVAL"
          - "Member.exclusion_status transitions to EXCLUDED"
        side_effects:
          - "HostAssignment.status := REVOKED"
          - "HostAssignment.updated_at := now; HostAssignment.version += 1"

  # --- AnnualResetRun lifecycle ---
  - entity: AnnualResetRun
    initial_state: SCHEDULED
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: EXECUTED
        trigger: "POST /annual-reset-runs/{id}/execute"
        actor: ComplianceOfficer
        preconditions:
          - "AnnualResetRun.status == SCHEDULED"
          - "current_utc >= AnnualResetRun.scheduled_for"
          - "No other AnnualResetRun with status=SCHEDULED whose reset_year equals this row's reset_year"
        side_effects:
          - "Capture tier_credits_lifetime_invariant_before_cents := SUM(Member.tier_credits_lifetime)"
          - "For every Member with exclusion_status != EXCLUDED: tier_credits_ytd := 0, tier_status := GOLD"
          - "members_reset_count := count of those members"
          - "Capture tier_credits_lifetime_invariant_after_cents := SUM(Member.tier_credits_lifetime)"
          - "AnnualResetRun.status := EXECUTED"
          - "AnnualResetRun.updated_at := now; AnnualResetRun.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /annual-reset-runs/{id}/cancel"
        actor: ComplianceOfficer
        preconditions:
          - "AnnualResetRun.status == SCHEDULED"
          - "current_utc < AnnualResetRun.scheduled_for"
        side_effects:
          - "AnnualResetRun.status := CANCELLED"
          - "AnnualResetRun.updated_at := now; AnnualResetRun.version += 1"

  # --- SelfExclusion lifecycle (mirrors Member.exclusion_status but on its own row) ---
  - entity: SelfExclusion
    initial_state: ACTIVE
    terminal_states: [REINSTATED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: REINSTATED
        trigger: "POST /self-exclusions/{id}/reinstate"
        actor: Member
        preconditions:
          - "SelfExclusion.status == ACTIVE"
          - "current_utc >= SelfExclusion.exclusion_until"
        side_effects:
          - "SelfExclusion.status := REINSTATED"
          - "Member.exclusion_status := REINSTATED"
          - "Member.updated_at := now; Member.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: host-assignment-approve-stale-member
    parent_entity: Member
    write_endpoint: "POST /host-assignments"
    occ_field: "expected_member_version"
    description: |
      Creating a HostAssignment against a Member whose version has advanced
      since the LoyaltyManager last observed it is rejected. The natural race:
      a self-exclusion request has just transitioned the member to EXCLUDED
      (bumping Member.version and cascading revokes on any prior assignments);
      a stale request that still believes the member is NOT_EXCLUDED and
      carries the prior version is deterministically rejected. Two strictly
      sequential calls reproduce this — the second carries the prior version
      and fails the OCC check, even though the new HostAssignment would
      legitimately supersede the prior one had the member still been eligible.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

  - rule_id: comp-booking-create-stale-member
    parent_entity: Member
    write_endpoint: "POST /comp-room-bookings"
    occ_field: "expected_member_version"
    description: |
      Creating a CompRoomBooking against a Member whose version has advanced
      since the LoyaltyManager last observed it is rejected. The natural race:
      a velocity-monitoring tick has just transitioned the member to SUSPENDED
      (bumping Member.version and cascading cancellations on prior bookings);
      a stale request that still believes the member is NORMAL and carries the
      prior version is deterministically rejected so the new booking does not
      slip past the velocity gate. Two strictly sequential requests reproduce
      this scenario.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: tier_credit_accrual
    trigger: "POST /gaming-sessions"
    algorithm: tiered_pricing
    formula: |
      # Cross-entity domain: GamingSession + Member.tier_status multiplier
      base_credits = theoretical_loss_cents / 100.0   # 1 TC per $1 theoretical loss (SLOTS)
      if game_type == TABLE_GAMES:
          base_credits = base_credits * 2.0           # tables earn 2x
      elif game_type == POKER:
          base_credits = base_credits * 1.5
      # Tier-based multiplier (uses Member.tier_status BEFORE this accrual)
      tier_multiplier = {
          GOLD: 1.00,
          PLATINUM: 1.25,
          DIAMOND: 1.50,
          SEVEN_STARS: 2.00,
      }[Member.tier_status]
      tier_credits_earned = round(base_credits * tier_multiplier, 2)
      # Round PER SESSION before summing into Member.tier_credits_ytd (Rule 2 mode b).
      Member.tier_credits_ytd  += tier_credits_earned
      Member.tier_credits_lifetime += tier_credits_earned
    input_set: |
      Per session: theoretical_loss_cents, game_type, and Member.tier_status as
      of the moment the POST /gaming-sessions request is processed (BEFORE any
      tier-promotion side effect from this same session).
    constants:
      GAME_TYPE_MULT_SLOTS: 1.0
      GAME_TYPE_MULT_TABLES: 2.0
      GAME_TYPE_MULT_POKER: 1.5
      TIER_MULT_GOLD: 1.00
      TIER_MULT_PLATINUM: 1.25
      TIER_MULT_DIAMOND: 1.50
      TIER_MULT_SEVEN_STARS: 2.00
      PLATINUM_THRESHOLD: 15000
      DIAMOND_THRESHOLD: 75000
      SEVEN_STARS_THRESHOLD: 150000
    precision: "Per-session value rounded to 2 decimal places, round_half_up; round PER session BEFORE summing into Member.tier_credits_ytd."
    variants: []

  - name: comp_room_rate
    trigger: "POST /comp-room-bookings (variant=PROVISIONAL); POST /comp-room-bookings/{id}/check-in (variant=FINAL)"
    algorithm: tiered_pricing
    formula: |
      # Cross-entity domain: CompRoomBooking + Property + Member.tier_status
      base = Property.base_room_rate_cents
      # Tier-driven comp discount (fraction of base waived)
      tier_discount = {
          GOLD: 0.10,
          PLATINUM: 0.40,
          DIAMOND: 0.70,
          SEVEN_STARS: 1.00,
      }[Member.tier_status]
      # Market-segment band multiplier
      market_mult = {
          VEGAS_STRIP: 1.20,
          REGIONAL:   1.00,
          INTERNATIONAL: 1.10,
      }[Property.market_segment]
      # Effective rate = base * (1 - tier_discount) * market_mult, banker-style.
      # Compute step-by-step in cents using ROUND_HALF_UP at each MULTIPLICATION step.
      step_a = round_half_up(base * (1 - tier_discount))         # cents, 0 decimals
      provisional_or_final = round_half_up(step_a * market_mult) # cents, 0 decimals
      # NOTE: This is "round per multiplicand", NOT "round at end". (Rule 2 mode b.)
    input_set: |
      base_room_rate_cents from Property (pinned at booking creation for PROVISIONAL;
      re-read at check-in for FINAL); Member.tier_status as of the moment of the
      request (PROVISIONAL=POST creation; FINAL=POST check-in).
    constants:
      DISCOUNT_GOLD: 0.10
      DISCOUNT_PLATINUM: 0.40
      DISCOUNT_DIAMOND: 0.70
      DISCOUNT_SEVEN_STARS: 1.00
      MARKET_VEGAS_STRIP: 1.20
      MARKET_REGIONAL: 1.00
      MARKET_INTERNATIONAL: 1.10
    precision: "Cents, integer. Round_half_up at each multiplication step. (Rule 2 mode b.)"
    variants:
      - name: PROVISIONAL
        when: "On POST /comp-room-bookings (booking creation)."
        difference: "Uses Member.tier_status frozen at booking creation; result stored in CompRoomBooking.provisional_rate_cents."
      - name: FINAL
        when: "On POST /comp-room-bookings/{id}/check-in."
        difference: "Recomputes using Member.tier_status at check-in instant. Different from PROVISIONAL when the member's tier_status has changed (e.g., crossed PLATINUM threshold) between booking creation and check-in. Stored in final_rate_cents."

  - name: velocity_monitor
    trigger: "POST /gaming-sessions (recomputed AFTER tier_credit_accrual updates Member.tier_credits_ytd)"
    algorithm: aggregation
    formula: |
      # Cross-entity domain: GamingSession (subject) → Member (output side effect)
      # Sliding 60-minute window ending at the just-recorded session.ended_at.
      window_end = NEW_SESSION.ended_at
      window_start = window_end - 3600 seconds
      total_cents = sum(
          gs.theoretical_loss_cents
          for gs in GamingSession
          where gs.member_id == member_id
            and gs.status == RECORDED
            and gs.ended_at >  window_start
            and gs.ended_at <= window_end
      )
      if total_cents >= VELOCITY_SUSPEND_THRESHOLD_CENTS:    # 1_500_000 cents == $15,000
          create VelocityAlert(severity=SUSPENDED, window_start, window_end, total_theoretical_loss_cents=total_cents)
      elif total_cents >= VELOCITY_FLAG_THRESHOLD_CENTS:     # 500_000 cents == $5,000
          create VelocityAlert(severity=FLAGGED, window_start, window_end, total_theoretical_loss_cents=total_cents)
      # Boundary precision: ">=" is the rule. total_cents == 500_000 → FLAGGED, NOT NORMAL.
    input_set: |
      All GamingSession rows for this member with status=RECORDED and
      ended_at in (window_start, window_end]. Window is half-open on the left,
      closed on the right.
    constants:
      VELOCITY_FLAG_THRESHOLD_CENTS: 500000
      VELOCITY_SUSPEND_THRESHOLD_CENTS: 1500000
      WINDOW_SECONDS: 3600
    precision: "Integer cents; sum is exact."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role matches the endpoint's authorized roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-segment and FK-body ids resolve to existing rows (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Target resource is in a state that permits this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 5
    category: state
    check: "OCC version mismatch: provided expected_<parent>_version != current <parent>.version"
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
    applies_to: "POST /host-assignments, POST /comp-room-bookings"

  - priority: 6
    category: business_safety
    check: "Member.exclusion_status != EXCLUDED for any operation that creates/promotes loyalty-related resources for the member (POST /comp-room-bookings, POST /host-assignments, POST /gaming-sessions, POST /comp-room-bookings/{id}/confirm, POST /comp-room-bookings/{id}/check-in, POST /host-assignments/{id}/approve)."
    error_id: ERR_MEMBER_EXCLUDED
    http_status: 422
    applies_to: "POST /comp-room-bookings, POST /host-assignments, POST /gaming-sessions, POST /comp-room-bookings/{id}/confirm, POST /comp-room-bookings/{id}/check-in, POST /host-assignments/{id}/approve"

  - priority: 7
    category: business_safety
    check: "Member.velocity_status != SUSPENDED for any new comp-room booking or confirmation."
    error_id: ERR_MEMBER_VELOCITY_SUSPENDED
    http_status: 422
    applies_to: "POST /comp-room-bookings, POST /comp-room-bookings/{id}/confirm, POST /comp-room-bookings/{id}/check-in"

  - priority: 8
    category: business_safety
    check: "SelfExclusion.exclusion_until - SelfExclusion.requested_at >= 365 days (regulator-mandated minimum self-exclusion period)."
    error_id: ERR_EXCLUSION_PERIOD_TOO_SHORT
    http_status: 422
    applies_to: "POST /self-exclusions"

  - priority: 9
    category: business_referential
    check: "X-User-ID of approver/rejecter MUST differ from HostAssignment.assigned_by_user_id (segregation_of_duties on host approvals)."
    error_id: ERR_SOD_VIOLATION
    http_status: 422
    applies_to: "POST /host-assignments/{id}/approve, POST /host-assignments/{id}/reject"

  - priority: 10
    category: business_constraint
    check: "No other HostAssignment with member_id=this and status=ACTIVE may exist at /approve time."
    error_id: ERR_ACTIVE_HOST_EXISTS
    http_status: 422
    applies_to: "POST /host-assignments/{id}/approve"

  - priority: 11
    category: business_constraint
    check: "Member.tier_status IN {PLATINUM, DIAMOND, SEVEN_STARS} to be eligible for a CompRoomBooking confirmation. GOLD members cannot receive comp rooms."
    error_id: ERR_TIER_INELIGIBLE_FOR_COMP
    http_status: 422
    applies_to: "POST /comp-room-bookings/{id}/confirm"

  - priority: 12
    category: business_temporal
    check: "current_utc >= AnnualResetRun.scheduled_for at execute time."
    error_id: ERR_RESET_NOT_DUE
    http_status: 422
    applies_to: "POST /annual-reset-runs/{id}/execute"

  - priority: 13
    category: business_temporal
    check: "current_utc < AnnualResetRun.scheduled_for at cancel time."
    error_id: ERR_RESET_ALREADY_DUE
    http_status: 422
    applies_to: "POST /annual-reset-runs/{id}/cancel"

  - priority: 14
    category: business_temporal
    check: "GamingSession.ended_at > GamingSession.started_at."
    error_id: ERR_SESSION_INVALID_TIMES
    http_status: 422
    applies_to: "POST /gaming-sessions"

  - priority: 15
    category: business_temporal
    check: "CompRoomBooking.check_out > CompRoomBooking.check_in."
    error_id: ERR_BOOKING_INVALID_DATES
    http_status: 422
    applies_to: "POST /comp-room-bookings"

  - priority: 16
    category: business_constraint
    check: "Email uniqueness on Member.email (case-insensitive)."
    error_id: ERR_EMAIL_TAKEN
    http_status: 409
    applies_to: "POST /members"

  - priority: 17
    category: business_constraint
    check: "AnnualResetRun.reset_year must be unique across SCHEDULED rows."
    error_id: ERR_RESET_YEAR_TAKEN
    http_status: 409
    applies_to: "POST /annual-reset-runs"

  - priority: 18
    category: business_constraint
    check: "GamingSession overlap with same member's existing RECORDED session on same property is rejected (intervals are half-open [started_at, ended_at); touching is allowed, true overlap is not)."
    error_id: ERR_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST /gaming-sessions"

  - priority: 19
    category: business_constraint
    check: "CompRoomBooking overlap with another non-terminal booking (status IN {PENDING, CONFIRMED, CHECKED_IN}) at the same Property: aggregate occupancy (count of overlapping bookings) MUST NOT exceed Property.occupancy_cap=20 across any [check_in, check_out) interval intersection. This uses aggregate-capacity interval semantics — distinct from GamingSession.overlap which is binary."
    error_id: ERR_BOOKING_OVERLAP
    http_status: 409
    applies_to: "POST /comp-room-bookings"

  - priority: 20
    category: business_fiscal
    check: "GamingSession.theoretical_loss_cents <= 100_000_000 (regulatory single-session reporting cap)."
    error_id: ERR_SESSION_LOSS_OVER_CAP
    http_status: 422
    applies_to: "POST /gaming-sessions"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Members ---
  - method: POST
    path: "/members"
    description: "Register a new member (universal across properties)."
    roles: [MemberServices]
    code: 201
    input: [full_name, email, home_property_id]
    output: Member
    side_effects:
      - "Create Member with tier_status=GOLD, tier_credits_ytd=0, tier_credits_lifetime=0, exclusion_status=NOT_EXCLUDED, velocity_status=NORMAL, assigned_host_id=null, version=1"

  - method: GET
    path: "/members/{id}"
    description: "Fetch a member by id."
    roles: [MemberServices, LoyaltyManager, ComplianceOfficer, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members"
    description: "List members (paginated)."
    roles: [MemberServices, LoyaltyManager, ComplianceOfficer]
    code: 200
    input: ["home_property_id?", "tier_status?", "exclusion_status?", "velocity_status?", "assigned_host_id?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/members/{id}/clear-velocity"
    description: "Manually clear a velocity SUSPENDED status if no alert in last 24h."
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_member_version]
    output: Member
    side_effects:
      - "Member.velocity_status := NORMAL"
      - "increments Member.version by 1"

  # --- Properties ---
  - method: POST
    path: "/properties"
    description: "Register a property."
    roles: [ComplianceOfficer]
    code: 201
    input: [name, market_segment, base_room_rate_cents]
    output: Property
    side_effects:
      - "Create Property with status=OPEN"

  - method: GET
    path: "/properties/{id}"
    description: "Fetch a property."
    roles: [MemberServices, LoyaltyManager, ComplianceOfficer]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "List properties."
    roles: [MemberServices, LoyaltyManager, ComplianceOfficer]
    code: 200
    input: ["market_segment?", "status?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: GET
    path: "/properties/{id}/members"
    description: "Reverse-reachability: members whose home_property_id == {id}."
    roles: [MemberServices, LoyaltyManager, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Member[]
    side_effects: []

  # --- Hosts ---
  - method: POST
    path: "/hosts"
    description: "Register a host."
    roles: [ComplianceOfficer]
    code: 201
    input: [employee_email, home_property_id]
    output: Host
    side_effects:
      - "Create Host with status=ACTIVE"

  - method: GET
    path: "/hosts/{id}"
    description: "Fetch a host."
    roles: [LoyaltyManager, ComplianceOfficer]
    code: 200
    input: []
    output: Host
    side_effects: []

  - method: GET
    path: "/hosts"
    description: "List hosts (supports home_property_id filter for FK reverse-reachability)."
    roles: [LoyaltyManager, ComplianceOfficer]
    code: 200
    input: ["home_property_id?", "status?", "limit?", "offset?"]
    output: Host[]
    side_effects: []

  # --- HostAssignment ---
  - method: POST
    path: "/host-assignments"
    description: "Create a host assignment (PENDING_APPROVAL). OCC-gated on Member.version."
    roles: [LoyaltyManager]
    code: 201
    input: [member_id, host_id, expected_member_version]
    output: HostAssignment
    side_effects:
      - "Create HostAssignment with status=PENDING_APPROVAL, assigned_by_user_id=X-User-ID, version=1"
      - "increments Member.version by 1"

  - method: POST
    path: "/host-assignments/{id}/approve"
    description: "Approve a PENDING_APPROVAL assignment (must be a DIFFERENT LoyaltyManager than the creator)."
    roles: [LoyaltyManager]
    code: 200
    input: []
    output: HostAssignment
    side_effects:
      - "HostAssignment.status := ACTIVE; approved_by_user_id := X-User-ID"
      - "Member.assigned_host_id := HostAssignment.host_id"
      - "increments Member.version by 1; increments HostAssignment.version by 1"

  - method: POST
    path: "/host-assignments/{id}/reject"
    description: "Reject a PENDING_APPROVAL assignment (must be a DIFFERENT LoyaltyManager than the creator)."
    roles: [LoyaltyManager]
    code: 200
    input: []
    output: HostAssignment
    side_effects:
      - "HostAssignment.status := REJECTED"
      - "increments HostAssignment.version by 1"

  - method: POST
    path: "/host-assignments/{id}/revoke"
    description: "Revoke an ACTIVE assignment."
    roles: [LoyaltyManager, ComplianceOfficer]
    code: 200
    input: []
    output: HostAssignment
    side_effects:
      - "HostAssignment.status := REVOKED"
      - "if was ACTIVE: Member.assigned_host_id := null; increments Member.version by 1"
      - "increments HostAssignment.version by 1"

  - method: GET
    path: "/host-assignments/{id}"
    description: "Fetch a HostAssignment."
    roles: [LoyaltyManager, ComplianceOfficer]
    code: 200
    input: []
    output: HostAssignment
    side_effects: []

  - method: GET
    path: "/host-assignments"
    description: "List host assignments. Reverse-reachability for member_id and host_id FKs."
    roles: [LoyaltyManager, ComplianceOfficer]
    code: 200
    input: ["member_id?", "host_id?", "status?", "limit?", "offset?"]
    output: HostAssignment[]
    side_effects: []

  # --- GamingSession ---
  - method: POST
    path: "/gaming-sessions"
    description: "Record a gaming session. Triggers tier_credit_accrual then velocity_monitor."
    roles: [MemberServices]
    code: 201
    input: [member_id, property_id, started_at, ended_at, game_type, theoretical_loss_cents]
    output: GamingSession
    side_effects:
      - "Create GamingSession with status=RECORDED"
      - "Run calculations.tier_credit_accrual → updates Member.tier_credits_ytd, Member.tier_credits_lifetime, GamingSession.tier_credits_earned"
      - "Run Member tier_status state machine (may transition GOLD→PLATINUM→DIAMOND→SEVEN_STARS)"
      - "Run calculations.velocity_monitor → may create VelocityAlert and transition Member.velocity_status (this is the depth-≥3 cascade: GamingSession create → VelocityAlert → Member.velocity_status SUSPENDED → CompRoomBooking CANCELLED, per Rule 4)"
      - "increments Member.version by 1"

  - method: GET
    path: "/gaming-sessions/{id}"
    description: "Fetch a session."
    roles: [MemberServices, LoyaltyManager, ComplianceOfficer]
    code: 200
    input: []
    output: GamingSession
    side_effects: []

  - method: GET
    path: "/gaming-sessions"
    description: "List sessions. Reverse-reachability for member_id and property_id FKs."
    roles: [MemberServices, LoyaltyManager, ComplianceOfficer]
    code: 200
    input: ["member_id?", "property_id?", "status?", "limit?", "offset?"]
    output: GamingSession[]
    side_effects: []

  # --- CompRoomBooking ---
  - method: POST
    path: "/comp-room-bookings"
    description: "Create a comp-room booking (PENDING). Computes provisional rate. OCC-gated on Member.version."
    roles: [LoyaltyManager]
    code: 201
    input: [member_id, property_id, check_in, check_out, expected_member_version]
    output: CompRoomBooking
    side_effects:
      - "Compute nights"
      - "Run calculations.comp_room_rate variant=PROVISIONAL → set provisional_rate_cents"
      - "Set total_charge_cents := nights * provisional_rate_cents"
      - "Create CompRoomBooking with status=PENDING, version=1"
      - "increments Member.version by 1"

  - method: POST
    path: "/comp-room-bookings/{id}/confirm"
    description: "Confirm a PENDING booking."
    roles: [LoyaltyManager]
    code: 200
    input: []
    output: CompRoomBooking
    side_effects:
      - "CompRoomBooking.status := CONFIRMED"
      - "increments CompRoomBooking.version by 1"

  - method: POST
    path: "/comp-room-bookings/{id}/check-in"
    description: "Check in a CONFIRMED booking. Recomputes FINAL rate."
    roles: [LoyaltyManager]
    code: 200
    input: []
    output: CompRoomBooking
    side_effects:
      - "Run calculations.comp_room_rate variant=FINAL → set final_rate_cents"
      - "Update total_charge_cents := nights * final_rate_cents"
      - "CompRoomBooking.status := CHECKED_IN"
      - "increments CompRoomBooking.version by 1"

  - method: POST
    path: "/comp-room-bookings/{id}/check-out"
    description: "Check out (CHECKED_IN → COMPLETED)."
    roles: [LoyaltyManager]
    code: 200
    input: []
    output: CompRoomBooking
    side_effects:
      - "CompRoomBooking.status := COMPLETED"
      - "increments CompRoomBooking.version by 1"

  - method: POST
    path: "/comp-room-bookings/{id}/cancel"
    description: "Cancel a non-checked-in booking."
    roles: [LoyaltyManager, Member]
    code: 200
    input: []
    output: CompRoomBooking
    side_effects:
      - "CompRoomBooking.status := CANCELLED"
      - "increments CompRoomBooking.version by 1"

  - method: POST
    path: "/comp-room-bookings/{id}/revert-to-pending"
    description: "Revert a CONFIRMED booking back to PENDING (cyclic transition; only before check_in)."
    roles: [LoyaltyManager]
    code: 200
    input: []
    output: CompRoomBooking
    side_effects:
      - "CompRoomBooking.status := PENDING"
      - "increments CompRoomBooking.version by 1"

  - method: GET
    path: "/comp-room-bookings/{id}"
    description: "Fetch a booking."
    roles: [LoyaltyManager, MemberServices, Member]
    code: 200
    input: []
    output: CompRoomBooking
    side_effects: []

  - method: GET
    path: "/comp-room-bookings"
    description: "List bookings. Reverse-reachability for member_id and property_id FKs."
    roles: [LoyaltyManager, MemberServices, ComplianceOfficer]
    code: 200
    input: ["member_id?", "property_id?", "status?", "limit?", "offset?"]
    output: CompRoomBooking[]
    side_effects: []

  # --- SelfExclusion ---
  - method: POST
    path: "/self-exclusions"
    description: "Member self-excludes. CASCADE revokes host assignments and cancels non-terminal bookings."
    roles: [Member]
    code: 201
    input: [member_id, exclusion_until, reason]
    output: SelfExclusion
    side_effects:
      - "Create SelfExclusion with status=ACTIVE, requested_at=current_utc"
      - "Member.exclusion_status := EXCLUDED"
      - "CASCADE: every HostAssignment for this member in {PENDING_APPROVAL, ACTIVE} → REVOKED; if any was ACTIVE → Member.assigned_host_id := null (depth-3 cascade originating from /self-exclusions)"
      - "CASCADE: every CompRoomBooking for this member in {PENDING, CONFIRMED} → CANCELLED"
      - "increments Member.version by 1"

  - method: POST
    path: "/self-exclusions/{id}/reinstate"
    description: "Reinstate after exclusion_until has elapsed."
    roles: [Member]
    code: 200
    input: []
    output: SelfExclusion
    side_effects:
      - "SelfExclusion.status := REINSTATED"
      - "Member.exclusion_status := REINSTATED"
      - "increments Member.version by 1"

  - method: GET
    path: "/self-exclusions/{id}"
    description: "Fetch a self-exclusion."
    roles: [Member, ComplianceOfficer]
    code: 200
    input: []
    output: SelfExclusion
    side_effects: []

  - method: GET
    path: "/self-exclusions"
    description: "List self-exclusions. Reverse-reachability for member_id FK."
    roles: [ComplianceOfficer, Member]
    code: 200
    input: ["member_id?", "status?", "limit?", "offset?"]
    output: SelfExclusion[]
    side_effects: []

  # --- VelocityAlert ---
  - method: GET
    path: "/velocity-alerts/{id}"
    description: "Fetch a velocity alert."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: VelocityAlert
    side_effects: []

  - method: GET
    path: "/velocity-alerts"
    description: "List velocity alerts. Reverse-reachability for member_id FK."
    roles: [ComplianceOfficer]
    code: 200
    input: ["member_id?", "severity?", "limit?", "offset?"]
    output: VelocityAlert[]
    side_effects: []

  # --- AnnualResetRun ---
  - method: POST
    path: "/annual-reset-runs"
    description: "Schedule an annual reset for a given reset_year."
    roles: [ComplianceOfficer]
    code: 201
    input: [reset_year, scheduled_for]
    output: AnnualResetRun
    side_effects:
      - "Create AnnualResetRun with status=SCHEDULED, version=1"

  - method: POST
    path: "/annual-reset-runs/{id}/execute"
    description: "Execute the reset (zero tier_credits_ytd, demote to GOLD) for non-excluded members."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AnnualResetRun
    side_effects:
      - "Capture tier_credits_lifetime_invariant_before_cents"
      - "For each Member with exclusion_status != EXCLUDED: tier_credits_ytd := 0; tier_status := GOLD; Member.version += 1"
      - "Capture tier_credits_lifetime_invariant_after_cents; assert equal to _before"
      - "AnnualResetRun.status := EXECUTED; increments AnnualResetRun.version by 1"

  - method: POST
    path: "/annual-reset-runs/{id}/cancel"
    description: "Cancel a scheduled reset before scheduled_for."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AnnualResetRun
    side_effects:
      - "AnnualResetRun.status := CANCELLED"
      - "increments AnnualResetRun.version by 1"

  - method: GET
    path: "/annual-reset-runs/{id}"
    description: "Fetch a reset run."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: AnnualResetRun
    side_effects: []

  - method: GET
    path: "/annual-reset-runs"
    description: "List reset runs."
    roles: [ComplianceOfficer]
    code: 200
    input: ["status?", "reset_year?", "limit?", "offset?"]
    output: AnnualResetRun[]
    side_effects: []

  # --- Test-driving / clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: pin the server's current_utc clock to an ISO8601 timestamp. Used by tests that depend on temporal preconditions (reset due date, exclusion period elapsed, booking check-in time)."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "Server's current_utc := to_iso8601 (sticks until next /_clock/set_current_utc)"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/blank."

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not in endpoint.roles."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource id (path or body FK) does not exist."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state that permits the requested transition."

  - id: ERR_STALE_MEMBER_VERSION
    http: 412
    condition: "OCC precondition failed: expected_member_version != Member.version."

  - id: ERR_MEMBER_EXCLUDED
    http: 422
    condition: "Member.exclusion_status == EXCLUDED blocks comp/host/session ops."

  - id: ERR_MEMBER_VELOCITY_SUSPENDED
    http: 422
    condition: "Member.velocity_status == SUSPENDED blocks new/active comp-room operations."

  - id: ERR_EXCLUSION_PERIOD_TOO_SHORT
    http: 422
    condition: "SelfExclusion.exclusion_until - requested_at < 365 days."

  - id: ERR_SOD_VIOLATION
    http: 422
    condition: "Approver/rejecter X-User-ID equals HostAssignment.assigned_by_user_id."

  - id: ERR_ACTIVE_HOST_EXISTS
    http: 422
    condition: "Another HostAssignment for this member with status=ACTIVE exists when approving."

  - id: ERR_TIER_INELIGIBLE_FOR_COMP
    http: 422
    condition: "Member.tier_status == GOLD when confirming a comp-room booking."

  - id: ERR_RESET_NOT_DUE
    http: 422
    condition: "current_utc < AnnualResetRun.scheduled_for at /execute."

  - id: ERR_RESET_ALREADY_DUE
    http: 422
    condition: "current_utc >= AnnualResetRun.scheduled_for at /cancel."

  - id: ERR_SESSION_INVALID_TIMES
    http: 422
    condition: "GamingSession.ended_at <= GamingSession.started_at."

  - id: ERR_BOOKING_INVALID_DATES
    http: 422
    condition: "CompRoomBooking.check_out <= CompRoomBooking.check_in."

  - id: ERR_EMAIL_TAKEN
    http: 409
    condition: "Member.email collides (case-insensitive)."

  - id: ERR_RESET_YEAR_TAKEN
    http: 409
    condition: "AnnualResetRun.reset_year duplicates an existing SCHEDULED row."

  - id: ERR_SESSION_OVERLAP
    http: 409
    condition: "GamingSession interval [started_at, ended_at) overlaps an existing RECORDED session for the same member on the same property (binary interval semantics: touching allowed, overlap rejected)."

  - id: ERR_BOOKING_OVERLAP
    http: 409
    condition: "CompRoomBooking [check_in, check_out) intersects non-terminal bookings on the same property such that aggregate occupancy would exceed Property.occupancy_cap=20 (aggregate-capacity interval semantics)."

  - id: ERR_SESSION_LOSS_OVER_CAP
    http: 422
    condition: "GamingSession.theoretical_loss_cents > 100_000_000."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Member
    description: "End-user loyalty member; can view own data, self-exclude, reinstate, cancel own pending bookings."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /self-exclusions"
      - "POST /self-exclusions/{id}/reinstate"
    shared_operations:
      - "GET /members/{id} (only own id)"
      - "GET /comp-room-bookings (filtered to own member_id)"
      - "POST /comp-room-bookings/{id}/cancel"
      - "GET /self-exclusions"

  - name: MemberServices
    description: "Operator role that registers new members and records gaming sessions; cannot promote tiers or comp rooms (peer)."
    identity: "opaque"
    exclusive_operations:
      - "POST /members"
      - "POST /gaming-sessions"
    shared_operations:
      - "GET /members, GET /members/{id}, GET /properties, GET /gaming-sessions, GET /comp-room-bookings"

  - name: LoyaltyManager
    description: "Operator role that creates host assignments, comp-room bookings, and drives their state transitions. SOD applies to host-assignment approve/reject: same X-User-ID cannot create and approve the same row."
    identity: "opaque"
    exclusive_operations:
      - "POST /host-assignments"
      - "POST /host-assignments/{id}/approve"
      - "POST /host-assignments/{id}/reject"
      - "POST /host-assignments/{id}/revoke"
      - "POST /comp-room-bookings"
      - "POST /comp-room-bookings/{id}/confirm"
      - "POST /comp-room-bookings/{id}/check-in"
      - "POST /comp-room-bookings/{id}/check-out"
      - "POST /comp-room-bookings/{id}/revert-to-pending"
    shared_operations:
      - "GET /members, GET /properties, GET /hosts, GET /host-assignments, GET /comp-room-bookings, GET /gaming-sessions"
      - "POST /comp-room-bookings/{id}/cancel"

  - name: ComplianceOfficer
    description: "Audit-and-control role: provisions Property/Host, schedules and executes annual reset, manually clears velocity status, oversees self-exclusion lifecycle. Cannot create comp bookings or host assignments (peer)."
    identity: "opaque"
    exclusive_operations:
      - "POST /properties"
      - "POST /hosts"
      - "POST /members/{id}/clear-velocity"
      - "POST /annual-reset-runs"
      - "POST /annual-reset-runs/{id}/execute"
      - "POST /annual-reset-runs/{id}/cancel"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /members, GET /properties, GET /hosts, GET /host-assignments, GET /gaming-sessions, GET /comp-room-bookings, GET /self-exclusions, GET /velocity-alerts, GET /annual-reset-runs"
      - "POST /host-assignments/{id}/revoke"
