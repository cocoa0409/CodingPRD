          assert:
            - "before the void: Dispense.${dsp}.tier_discount_pct == 0.00, gross_fee_cents == 2400 (ceil(500/100) = 5 units x 480, no OUTPATIENT handling fee), subsidy_cents == 1440 (round_half_up(2400 * 0.60)) and payer_due_cents == 960"
            - "before the void: SubsidyProgram.${sp}.consumed_cents == 1440 and status == OPEN; MilkLot.${lot}.available_ml == 1600 and dispensed_ml == 500; Prescription.${rx}.status == FILLED with cumulative_dispensed_ml == 500 and remaining_ml == 0 and waitlist_position == null"
            - "after the void: SubsidyProgram.${sp}.consumed_cents == 0 — exactly the pre-fill value, not 1440 and not a partial credit — and status == OPEN"
            - "after the void: MilkLot.${lot}.dispensed_ml == 0 and available_ml == 2100 and release_status == RELEASED"
            - "after the void: Prescription.${rx}.status == QUEUED with cumulative_dispensed_ml == 0, remaining_ml == 500 and waitlist_position == 1 (re-admitted to its priority_tier 1 bucket)"
            - "after the void: Dispense.${dsp}.status == VOIDED but gross_fee_cents == 2400, subsidy_cents == 1440 and payer_due_cents == 960 are RETAINED (the money is conserved in the ledger, not erased from the audit row)"
            - "gross_fee_cents == subsidy_cents + payer_due_cents (2400 == 1440 + 960) still holds on the voided row"
            - "a second POST /milk-bank/dispenses/${dsp}/void returns ERR_DISPENSE_STATE_INVALID (409), so the credit cannot be applied twice"
