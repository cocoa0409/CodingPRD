  - section: validations
    instances:
      - name: schema_error_beats_role_priority_ordering
        claim_type: priority_ordering
        grounds: ["validations[priority=0]", "validations[priority=2]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "A request violating p0 (missing required plan_id) and p2 (MarineSurveyor may not create contracts) returns the p0 error ERR_INVALID_REQUEST, proving schema validation runs before role authorization."
        test_recipe:
          setup: ["one casualty exists (unused by the failing call)"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01" }
          trigger:
            - { call: "POST /contracts", payload: { form: NO_CURE_NO_PAY }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (p0), NOT ERR_FORBIDDEN_ROLE (p2)"
      - name: sod_assessment_self_approve_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "Approver X-User-ID equal to assessment.assessor_id is rejected with 403 ERR_SOD_VIOLATION even when the role is OperationsDirector."
        test_recipe:
          setup: ["casualty with SUBMITTED assessment created by surveyor-01"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
          trigger:
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "surveyor-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SOD_VIOLATION, http 403; assessment stays SUBMITTED"
      - name: sod_plan_self_approve_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "Plan approver equal to plan.drafter_id (sm-01) is rejected with ERR_SOD_VIOLATION."
        test_recipe:
          setup: ["casualty with APPROVED assessment; plan SUBMITTED drafted by sm-01"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
          trigger:
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "sm-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SOD_VIOLATION, http 403; plan stays SUBMITTED"
      - name: sod_verify_value_by_same_surveyor_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "verify-value by the same X-User-ID that performed the survey is rejected; a different OperationsDirector succeeds — the lot then reads VALUE_VERIFIED."
        test_recipe:
          setup: ["NCNP contract ACTIVE; lot SECURED_ASHORE and SURVEYED by surveyor-02"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 30000000 }, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /properties", payload: { casualty_id: "${cas_id}", property_type: CARGO, quantity_tonnes: 10, declared_value_cents: 9000000 }, as: SalvageMaster, as_user_id: "sm-01", captures: { lot1: $.data.id } }
            - { call: "POST /properties/${lot1}/survey", payload: { verified_value_cents: 9000000 }, as: MarineSurveyor, as_user_id: "surveyor-02" }
          trigger:
            - { call: "POST /properties/${lot1}/verify-value", payload: {}, as: OperationsDirector, as_user_id: "surveyor-02", captures: { err: $.data.error_id } }
            - { call: "POST /properties/${lot1}/verify-value", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01", captures: { dc: $.data.documentation_status } }
          assert:
            - "first verify-value: error_id == ERR_SOD_VIOLATION (same person surveyed and verifies)"
            - "second verify-value by opsdir-01: documentation_status == VALUE_VERIFIED"
      - name: security_disburse_mode_not_allowed_rejected
        claim_type: violation_to_error
        grounds: [state_machines.SecurityDeposit, "errors[ERR_SECURITY_DISBURSE_NOT_ALLOWED]"]
        distinguishing_aspect: "RELEASE while the contract is still ACTIVE and APPLY_TO_AWARD before any award is PAID both fail with ERR_SECURITY_DISBURSE_NOT_ALLOWED — mode legality is state-dependent."
        test_recipe:
          setup: ["NCNP contract ACTIVE; deposit lodged 30,000,000"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
            - { call: "POST /assessments", payload: { casualty_id: "${cas_id}", expected_casualty_version: "${cas_v}", pollution_risk_tier: TIER_1, wreck_removal_required: false, estimated_cost_cents: 1000000 }, as: MarineSurveyor, as_user_id: "surveyor-01", captures: { asmt_id: $.data.id } }
            - { call: "POST /assessments/${asmt_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /plans", payload: { casualty_id: "${cas_id}", method: REFLOAT, required_equipment_classes: [TUG] }, as: SalvageMaster, as_user_id: "sm-01", captures: { plan_id: $.data.id } }
            - { call: "POST /plans/${plan_id}/submit", payload: {}, as: SalvageMaster, as_user_id: "sm-01" }
            - { call: "POST /plans/${plan_id}/approve", payload: {}, as: OperationsDirector, as_user_id: "opsdir-01" }
            - { call: "POST /contracts", payload: { casualty_id: "${cas_id}", plan_id: "${plan_id}", form: NO_CURE_NO_PAY, scopic_clause_included: false }, as: ContractsOfficer, as_user_id: "co-01", captures: { ct_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/offer", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /contracts/${ct_id}/sign", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
            - { call: "POST /securities", payload: { contract_id: "${ct_id}", lodged_amount_cents: 30000000 }, as: ContractsOfficer, as_user_id: "co-01", captures: { sec_id: $.data.id } }
            - { call: "POST /contracts/${ct_id}/activate", payload: {}, as: ContractsOfficer, as_user_id: "co-01" }
          trigger:
            - { call: "POST /securities/${sec_id}/disburse", payload: { mode: RELEASE, amount_cents: 1000000 }, as: ContractsOfficer, as_user_id: "co-01", captures: { err1: $.data.error_id } }
            - { call: "POST /securities/${sec_id}/disburse", payload: { mode: APPLY_TO_AWARD, amount_cents: 1000000 }, as: ContractsOfficer, as_user_id: "co-01", captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_SECURITY_DISBURSE_NOT_ALLOWED (RELEASE needs SETTLED/TERMINATED)"
            - "err2 == ERR_SECURITY_DISBURSE_NOT_ALLOWED (APPLY_TO_AWARD needs award PAID)"
            - "held_cents unchanged at 30000000"
      - name: security_disburse_exceeds_held_rejected
        claim_type: violation_to_error
        grounds: [calculations.security_conservation, "errors[ERR_SECURITY_DISBURSE_EXCEEDS_HELD]"]
        distinguishing_aspect: "Disbursing 20,000,001 of a 20,000,000-held deposit on a TERMINATED contract fails with ERR_SECURITY_DISBURSE_EXCEEDS_HELD; the conservation invariant never dips negative."
        test_recipe:
          setup: ["FIXED_PRICE contract TERMINATED (MUTUAL from SIGNED); deposit held 20,000,000"]
          setup_api_calls:
            - { call: "POST /casualties", payload: { vessel_name: "MV Pax", casualty_type: GROUNDING, declared_salved_value_cents: 200000000, position: "10S 140W" }, as: SalvageMaster, as_user_id: "sm-01", captures: { cas_id: $.data.id, cas_v: $.data.version } }
