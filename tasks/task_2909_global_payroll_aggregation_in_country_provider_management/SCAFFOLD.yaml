    priority: 50
    condition: "incoming_provider_id equals the current provider_id, or names a Provider whose status != ACTIVE, or names a Provider whose data_residency_regions does not contain Engagement.data_residency_region"
    error_id: ERR_INCOMING_PROVIDER_INVALID
