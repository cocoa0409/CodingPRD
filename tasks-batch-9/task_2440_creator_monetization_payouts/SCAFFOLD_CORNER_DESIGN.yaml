      - name: pagination_limit_of_zero_is_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority 5]"
          - "errors[ERR_INVALID_PAGINATION]"
        distinguishing_aspect: "limit must fall in 1..100, so 0 is a 400 rather than an empty page, and 101 is rejected on the same rule while 100 is accepted."
        test_recipe:
          setup: ["One creator so the unpaginated listing is non-empty."]
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ada Ads", country_code: "US", follower_count: 50000, watch_time_minutes_365d: 300000 }
              as: PlatformAdmin
              captures: { cr: "$.data.id" }
          trigger:
            - call: "GET /monetization/creators"
              payload: { limit: 0 }
              as: PlatformAdmin
            - call: "GET /monetization/creators"
              payload: { limit: 101 }
              as: PlatformAdmin
            - call: "GET /monetization/creators"
              payload: { limit: 100, offset: 0 }
              as: PlatformAdmin
          assert:
            - "first trigger: HTTP status == 400 and error.error_id == 'ERR_INVALID_PAGINATION'"
            - "second trigger: HTTP status == 400 and error.error_id == 'ERR_INVALID_PAGINATION'"
            - "third trigger: HTTP status == 200 and total_count == 1 and has_more == false"
            - "third trigger: len(data) == 1 and data[0].id == '${cr}'"

      - name: pagination_check_outranks_unknown_path_id_resolution
        claim_type: priority_ordering
        grounds:
          - "validations[priority 5]"
          - "validations[priority 10]"
        distinguishing_aspect: "A ledger read for a non-existent creator with limit 0 returns 400 ERR_INVALID_PAGINATION, not 404 ERR_CREATOR_NOT_FOUND, because the request-shape band at priority 5 runs before path resolution at 10."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /monetization/creators/00000000-0000-4000-8000-000000000000/ledger-entries"
              payload: { limit: 0 }
              as: FinanceOperator
          assert:
            - "HTTP status == 400"
            - "error.error_id == 'ERR_INVALID_PAGINATION'"

      - name: missing_required_field_outranks_unknown_body_foreign_key
        claim_type: priority_ordering
        grounds:
          - "validations[priority 6]"
          - "validations[priority 11]"
        distinguishing_aspect: "The request omits occurred_at and names a non-existent creator_id; the answer is 422 ERR_MISSING_REQUIRED_FIELD rather than 404 ERR_CREATOR_NOT_FOUND, so the completeness check precedes referential resolution."
        test_recipe:
          setup: ["One ACTIVE product so only the creator reference is dangling."]
          setup_api_calls:
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "SUBSCRIPTIONS", name: "Memberships", creator_share_bps: 7000, platform_fee_bps: 3000, min_payable_cents: 0 }
