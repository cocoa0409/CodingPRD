# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across the claim-extraction-guide sections. §1.8-covered corners
# are emitted as excluded_because stubs (no test_recipe).
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: franchisee_creation_sets_system_fields
        claim_type: creation
        grounds: [entities.Franchisee, endpoints]
        distinguishing_aspect: "POST /franchisees returns 201 with a server-minted id, version==1, and lifetime_royalty_cents defaulting to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /franchisees", payload: { legal_name: "Acme Juice", contact_email: "a@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id, v: $.data.version } }
          assert:
            - "response http_status == 201"
            - "Franchisee.${fr_id}.version == 1"
            - "Franchisee.${fr_id}.lifetime_royalty_cents == 0"

      - name: customer_defaults_bronze_zero_balance
        claim_type: defaults
        grounds: [entities.Customer.fields.loyalty_tier, entities.Customer.fields.points_balance]
        distinguishing_aspect: "A newly registered customer defaults to loyalty_tier BRONZE, points_balance 0, lifetime_points_earned 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /customers", payload: { email: "d@x.com", full_name: "Dee" }, as: Anonymous, captures: { cust_id: $.data.id, t: $.data.loyalty_tier } }
          assert:
            - "Customer.${cust_id}.loyalty_tier == BRONZE"
            - "Customer.${cust_id}.points_balance == 0"
            - "Customer.${cust_id}.lifetime_points_earned == 0"

      - name: get_store_not_found
        claim_type: not_found
        grounds: [endpoints, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /stores/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /stores/00000000-0000-0000-0000-000000000000", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: create_menu_item_missing_required_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.MenuItem, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /menu-items without base_price_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /menu-items", payload: { name: "NoPrice", category: "SMOOTHIE", recipe: [], base_calories: 100 }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "http_status == 400"

      - name: order_nutrition_computed_from_size_and_boosts
        claim_type: computed_fields
        grounds: [calculations.order_nutrition, entities.Order.fields.total_calories]
        distinguishing_aspect: "Order.total_calories = round(base_calories 200 * 1.5) + boost 100 = 400 for one MEDIUM Green Machine + Protein line."
        test_recipe:
          setup: ["OPEN store with inventory; Green Machine base_calories 200; Protein boost 100 calories."]
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /ingredients", payload: { name: "Spinach", unit: "GRAM", standard_cost_cents_per_unit: 2 }, as: PlatformAdmin, captures: { spin_id: $.data.id } }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${spin_id}", qty_received: 100, unit_cost_cents: 2, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /menu-items", payload: { name: "Green Machine", category: "SMOOTHIE", base_price_cents: 500, recipe: [ { ingredient_id: "${spin_id}", base_qty: 50 } ], base_calories: 200 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /boosts", payload: { name: "Protein", price_cents: 150, calories: 100 }, as: PlatformAdmin, captures: { boost_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "n@x.com", full_name: "Nut" }, as: Anonymous, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /orders", payload: { store_id: "${store_id}", lines: [ { menu_item_id: "${mi_id}", size: "MEDIUM", boost_ids: [ "${boost_id}" ] } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id, cal: $.data.total_calories } }
          assert:
            - "Order.${order_id}.total_calories == 400"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: ready_on_placed_order_returns_invalid_state
        claim_type: invalid_transitions
        grounds: [state_machines.Order.ready, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /orders/{id}/ready on a PLACED (unpaid) order returns ERR_INVALID_STATE (409); ready requires PREPARING."
        test_recipe:
          setup: ["OPEN store with inventory; a placed (unpaid) order."]
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /ingredients", payload: { name: "Spinach", unit: "GRAM", standard_cost_cents_per_unit: 2 }, as: PlatformAdmin, captures: { spin_id: $.data.id } }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${spin_id}", qty_received: 100, unit_cost_cents: 2, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /menu-items", payload: { name: "Green Machine", category: "SMOOTHIE", base_price_cents: 500, recipe: [ { ingredient_id: "${spin_id}", base_qty: 50 } ], base_calories: 200 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "e@x.com", full_name: "Ess" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { store_id: "${store_id}", lines: [ { menu_item_id: "${mi_id}", size: "SMALL", boost_ids: [] } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
          trigger:
            - { call: "POST /orders/${order_id}/ready", payload: {}, as: StoreStaff, as_user_id: "${store_id}", captures: { err: $.data.error_id } }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: pay_cancelled_order_terminal_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Order.pay, state_machines.Order.cancel]
        distinguishing_aspect: "A CANCELLED order is terminal in the fulfillment dimension; POST /orders/{id}/pay on it returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["OPEN store with inventory; a placed order that is then cancelled (still unpaid)."]
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /ingredients", payload: { name: "Spinach", unit: "GRAM", standard_cost_cents_per_unit: 2 }, as: PlatformAdmin, captures: { spin_id: $.data.id } }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${spin_id}", qty_received: 100, unit_cost_cents: 2, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /menu-items", payload: { name: "Green Machine", category: "SMOOTHIE", base_price_cents: 500, recipe: [ { ingredient_id: "${spin_id}", base_qty: 50 } ], base_calories: 200 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "f@x.com", full_name: "Eff" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { store_id: "${store_id}", lines: [ { menu_item_id: "${mi_id}", size: "SMALL", boost_ids: [] } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/pay", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: cancel_order_twice_second_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Order.cancel]
        distinguishing_aspect: "A second POST /orders/{id}/cancel on an already-CANCELLED order returns ERR_INVALID_STATE (409); cancel is not idempotently repeatable."
        test_recipe:
          setup: ["OPEN store with inventory; a placed order cancelled once."]
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /ingredients", payload: { name: "Spinach", unit: "GRAM", standard_cost_cents_per_unit: 2 }, as: PlatformAdmin, captures: { spin_id: $.data.id } }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${spin_id}", qty_received: 100, unit_cost_cents: 2, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /menu-items", payload: { name: "Green Machine", category: "SMOOTHIE", base_price_cents: 500, recipe: [ { ingredient_id: "${spin_id}", base_qty: 50 } ], base_calories: 200 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "g@x.com", full_name: "Gee" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { store_id: "${store_id}", lines: [ { menu_item_id: "${mi_id}", size: "SMALL", boost_ids: [] } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
            - { call: "POST /orders/${order_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders/${order_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "http_status == 409"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: catering_quote_computed
        claim_type: correct_result
        grounds: [calculations.catering_quote, entities.CateringBooking.fields.quoted_price_cents]
        distinguishing_aspect: "quoted_price_cents = items(500*3=1500) + service(8*200=1600) + tax(round(3100*0.08)=248) = 3348."
        test_recipe:
          setup: ["OPEN store capacity 10; menu item base 500; clock 2026-05-30 so window is future."]
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /menu-items", payload: { name: "Box", category: "WELLNESS_PACK", base_price_cents: 500, recipe: [], base_calories: 300 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "q@x.com", full_name: "Cue" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-30T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /stores/${store_id}/catering-bookings", payload: { customer_id: "${cust_id}", fulfillment_type: "PICKUP", headcount: 8, items: [ { menu_item_id: "${mi_id}", qty: 3 } ], prep_window_start: "2026-06-01T10:00:00Z", prep_window_end: "2026-06-01T12:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { book_id: $.data.id, q: $.data.quoted_price_cents } }
          assert:
            - "CateringBooking.${book_id}.quoted_price_cents == 3348"

      - name: cogs_provisional_vs_final_covered
        claim_type: correct_result
        grounds: [calculations.order_cogs]
        excluded_because:
          difficulty_instance: dual_variant_calc / order_cogs_provisional_vs_final
          rationale: "Provisional (420) vs final (570) COGS asserted directly in the named §1.8 instance."

      - name: royalty_gross_vs_net_covered
        claim_type: correct_result
        grounds: [calculations.royalty_computation]
        excluded_because:
          difficulty_instance: dual_variant_calc / royalty_gross_vs_net_basis
          rationale: "GROSS (60) vs NET (12) royalty divergence asserted in the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: catering_past_window_returns_invalid_window
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "A catering booking with prep_window_start in the past relative to the clock returns ERR_INVALID_WINDOW (422)."
        test_recipe:
          setup: ["OPEN store; clock at 2026-06-10; booking prep window on 2026-06-01 (past)."]
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /menu-items", payload: { name: "Box", category: "WELLNESS_PACK", base_price_cents: 500, recipe: [], base_calories: 300 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "w@x.com", full_name: "Dub" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /stores/${store_id}/catering-bookings", payload: { customer_id: "${cust_id}", fulfillment_type: "PICKUP", headcount: 4, items: [ { menu_item_id: "${mi_id}", qty: 4 } ], prep_window_start: "2026-06-01T10:00:00Z", prep_window_end: "2026-06-01T12:00:00Z" }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "response.error_id == ERR_INVALID_WINDOW"
            - "http_status == 422"

      - name: second_subscription_returns_subscription_exists
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_SUBSCRIPTION_EXISTS]"]
        distinguishing_aspect: "Creating a second subscription for a customer who already has a non-CANCELLED one returns ERR_SUBSCRIPTION_EXISTS (409)."
        test_recipe:
          setup: ["Customer with an existing ACTIVE subscription."]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "x2@x.com", full_name: "Ex" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /customers/${cust_id}/subscriptions", payload: { tier: "BASIC", monthly_fee_cents: 999, included_smoothie_credits: 4 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /customers/${cust_id}/subscriptions", payload: { tier: "PREMIUM", monthly_fee_cents: 1999, included_smoothie_credits: 8 }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "response.error_id == ERR_SUBSCRIPTION_EXISTS"
            - "http_status == 409"

      - name: redeem_more_than_balance_returns_insufficient_points
        claim_type: violation_to_error
        grounds: ["validations[priority=17]", "errors[ERR_INSUFFICIENT_POINTS]"]
        distinguishing_aspect: "At an OPEN store, an order redeeming more points than the customer's balance (0) returns ERR_INSUFFICIENT_POINTS (422)."
        test_recipe:
          setup: ["OPEN store with inventory; BRONZE customer with 0 points; order redeeming 100 points."]
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /ingredients", payload: { name: "Spinach", unit: "GRAM", standard_cost_cents_per_unit: 2 }, as: PlatformAdmin, captures: { spin_id: $.data.id } }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${spin_id}", qty_received: 100, unit_cost_cents: 2, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /menu-items", payload: { name: "Green Machine", category: "SMOOTHIE", base_price_cents: 500, recipe: [ { ingredient_id: "${spin_id}", base_qty: 50 } ], base_calories: 200 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "p@x.com", full_name: "Pea" }, as: Anonymous, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "POST /orders", payload: { store_id: "${store_id}", lines: [ { menu_item_id: "${mi_id}", size: "SMALL", boost_ids: [] } ], redeem_points: 100 }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "response.error_id == ERR_INSUFFICIENT_POINTS"
            - "http_status == 422"

      - name: duplicate_reconciliation_returns_exists
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", "errors[ERR_RECONCILIATION_EXISTS]"]
        distinguishing_aspect: "Opening a second reconciliation for the same (store, business_date) while one is non-POSTED returns ERR_RECONCILIATION_EXISTS (409)."
        test_recipe:
          setup: ["OPEN store with an OPEN reconciliation for 2026-06-01."]
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /stores/${store_id}/reconciliations", payload: { business_date: "2026-06-01" }, as: StoreStaff, as_user_id: "${store_id}" }
          trigger:
            - { call: "POST /stores/${store_id}/reconciliations", payload: { business_date: "2026-06-01" }, as: StoreStaff, as_user_id: "${store_id}", captures: { err: $.data.error_id } }
          assert:
            - "response.error_id == ERR_RECONCILIATION_EXISTS"
            - "http_status == 409"

      - name: credit_without_active_subscription_returns_no_active_subscription
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_NO_ACTIVE_SUBSCRIPTION]"]
        distinguishing_aspect: "use_subscription_credit=true when the customer's only subscription is CANCELLED returns ERR_NO_ACTIVE_SUBSCRIPTION (409)."
        test_recipe:
          setup: ["OPEN store with inventory; customer whose subscription is CANCELLED; order with use_subscription_credit true."]
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /ingredients", payload: { name: "Spinach", unit: "GRAM", standard_cost_cents_per_unit: 2 }, as: PlatformAdmin, captures: { spin_id: $.data.id } }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${spin_id}", qty_received: 100, unit_cost_cents: 2, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /menu-items", payload: { name: "Green Machine", category: "SMOOTHIE", base_price_cents: 500, recipe: [ { ingredient_id: "${spin_id}", base_qty: 50 } ], base_calories: 200 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "z@x.com", full_name: "Zed" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /customers/${cust_id}/subscriptions", payload: { tier: "BASIC", monthly_fee_cents: 999, included_smoothie_credits: 4 }, as: Customer, as_user_id: "${cust_id}", captures: { sub_id: $.data.id } }
            - { call: "POST /subscriptions/${sub_id}/cancel", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /orders", payload: { store_id: "${store_id}", lines: [ { menu_item_id: "${mi_id}", size: "SMALL", boost_ids: [] } ], use_subscription_credit: true }, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "response.error_id == ERR_NO_ACTIVE_SUBSCRIPTION"
            - "http_status == 409"

      - name: get_customer_missing_auth_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "GET /customers/{id} with no valid role/id headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["A registered customer."]
          setup_api_calls:
            - { call: "POST /customers", payload: { email: "au@x.com", full_name: "Auth" }, as: Anonymous, captures: { cust_id: $.data.id } }
          trigger:
            - { call: "GET /customers/${cust_id}", payload: {}, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "response.error_id == ERR_UNAUTHENTICATED"
            - "http_status == 401"

      - name: allergen_conflict_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=9]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / allergen_safety_beats_inventory_constraint
          rationale: "ERR_ALLERGEN_CONFLICT is the winning error of the named §1.8 priority-pair instance."

      - name: store_not_open_covered
        claim_type: priority_ordering
        grounds: ["validations[priority=7]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / store_state_beats_points_fiscal
          rationale: "ERR_STORE_NOT_OPEN is the winning error of the named §1.8 priority-pair instance."

      - name: insufficient_inventory_covered
        claim_type: violation_to_error
        grounds: ["validations[priority=15]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / inventory_exact_availability_boundary
          rationale: "ERR_INSUFFICIENT_INVENTORY is triggered by the second pay in the named §1.8 boundary instance."

      - name: catering_capacity_exceeded_covered
        claim_type: violation_to_error
        grounds: ["validations[priority=14]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / catering_store_prep_capacity_overlap
          rationale: "ERR_CATERING_CAPACITY_EXCEEDED asserted in the named §1.8 overlap instance."

      - name: vehicle_double_booked_covered
        claim_type: violation_to_error
        grounds: ["validations[priority=13]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / catering_vehicle_delivery_window_overlap
          rationale: "ERR_VEHICLE_DOUBLE_BOOKED asserted in the named §1.8 overlap instance."

      - name: vehicle_unavailable_covered
        claim_type: violation_to_error
        grounds: ["validations[priority=12]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / catering_delivery_requires_vehicle_available
          rationale: "ERR_VEHICLE_UNAVAILABLE asserted in the named §1.8 cross-entity instance."

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: list_orders_by_customer_reverse_reachability
        claim_type: listing
        grounds: [endpoints, entities.Order.fields.customer_id]
        distinguishing_aspect: "GET /orders?customer_id=... returns the customer's orders (reverse of Order.customer_id) with pagination envelope fields."
        test_recipe:
          setup: ["OPEN store with inventory; a customer with one placed order."]
          setup_api_calls:
            - { call: "POST /franchisees", payload: { legal_name: "FR", contact_email: "fr@x.com", base_royalty_rate: 0.06, marketing_fee_rate: 0.02 }, as: PlatformAdmin, captures: { fr_id: $.data.id } }
            - { call: "POST /franchisees/${fr_id}/stores", payload: { name: "S1", catering_capacity: 10 }, as: PlatformAdmin, captures: { store_id: $.data.id, store_v: $.data.version } }
            - { call: "PATCH /stores/${store_id}", payload: { expected_store_version: "${store_v}", status: "OPEN" }, as: PlatformAdmin }
            - { call: "POST /ingredients", payload: { name: "Spinach", unit: "GRAM", standard_cost_cents_per_unit: 2 }, as: PlatformAdmin, captures: { spin_id: $.data.id } }
            - { call: "POST /stores/${store_id}/inventory-lots", payload: { ingredient_id: "${spin_id}", qty_received: 100, unit_cost_cents: 2, received_at: "2026-05-01T00:00:00Z", expiry_date: "2026-12-31T00:00:00Z" }, as: StoreStaff, as_user_id: "${store_id}" }
            - { call: "POST /menu-items", payload: { name: "Green Machine", category: "SMOOTHIE", base_price_cents: 500, recipe: [ { ingredient_id: "${spin_id}", base_qty: 50 } ], base_calories: 200 }, as: PlatformAdmin, captures: { mi_id: $.data.id } }
            - { call: "POST /customers", payload: { email: "l@x.com", full_name: "Ell" }, as: Anonymous, captures: { cust_id: $.data.id } }
            - { call: "POST /orders", payload: { store_id: "${store_id}", lines: [ { menu_item_id: "${mi_id}", size: "SMALL", boost_ids: [] } ] }, as: Customer, as_user_id: "${cust_id}", captures: { order_id: $.data.id } }
          trigger:
            - { call: "GET /orders?customer_id=${cust_id}", payload: {}, as: Customer, as_user_id: "${cust_id}" }
          assert:
            - "response.total_count == 1"
            - "response.data[0].id == ${order_id}"
            - "response has_more == false"

      - name: list_menu_items_pagination
        claim_type: listing
        grounds: [endpoints, entities.MenuItem]
        distinguishing_aspect: "GET /menu-items?limit=1&offset=0 with two items present returns one item and has_more true."
        test_recipe:
          setup: ["Two menu items exist."]
          setup_api_calls:
            - { call: "POST /menu-items", payload: { name: "A", category: "JUICE", base_price_cents: 300, recipe: [], base_calories: 100 }, as: PlatformAdmin }
            - { call: "POST /menu-items", payload: { name: "B", category: "JUICE", base_price_cents: 400, recipe: [], base_calories: 120 }, as: PlatformAdmin }
          trigger:
            - { call: "GET /menu-items?limit=1&offset=0", payload: {}, as: PlatformAdmin }
          assert:
            - "response.data length == 1"
            - "response.total_count == 2"
            - "response has_more == true"

