- rule_id: compensating_invariant
  instances:
  - name: return_refund_conserves_customer_payment
    grounds:
    - calculations.refund_amount
    - state_machines.PurchaseOrder.RETURN_INITIATED_to_RETURN_COMPLETED
    - state_machines.PurchaseOrder.RETURN_INITIATED_to_COMPLETED
    distinguishing_aspect: 'Conserved quantity: customer cash flow. refund_amount_cents +

      excess_wear_fee == total_due_cents on an ACCEPTED return, and a

      REJECTED return leaves payment_status back at its pre-return value

      (PAID/FINANCED) with refund_amount_cents null — forward and

      compensating paths both conserve the quantity.

      '
