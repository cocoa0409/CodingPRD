  # =====================================================================
  # RULE 8 - resource_temporal_overlap
  # Instance 1: geometry A - Representative occupation, HALF-OPEN, with an
  #   asymmetric location-dependent travel buffer.
  # Instance 2: geometry B - Client occupation across ALL of the client's
  #   matters, FULLY CLOSED, no buffer, with the FILING_DEADLINE exemption
  #   and the waiver escape hatch.
  # Different interval semantics AND different resource entities.
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: representative_half_open_window_with_location_dependent_travel_buffer
        grounds:
          - calculations.calendar_conflict_scan
          - validations[priority=30]
          - entities.CalendarEvent.fields.travel_buffer_minutes
          - entities.CalendarEvent.fields.location_code
        distinguishing_aspect: |
          The representative resource is HALF-OPEN and its exclusion window is extended by
          BUFFER_BY_EVENT_TYPE of the EXISTING event, but only when the two events sit at
          different location_codes: a BIOMETRICS starting exactly at 12:00:00.000 - the
          11:00 end of an INDIVIDUAL_HEARING plus its 60-minute buffer - must book, one
          millisecond earlier must fail, and a BIOMETRICS at the SAME location may start at
          11:00:00.000 because the buffer collapses to zero. The one-millisecond candidate also
          overlaps the second client's own event, so returning ERR_CLIENT_CALENDAR_CONFLICT
          instead of ERR_REPRESENTATIVE_CALENDAR_CONFLICT would violate the normative
          representative -> client -> facility ordering.
        test_recipe:
          setup:
            - "Logical clock pinned to 2026-09-01T00:00:00.000Z; all events are in the future, and none is a FACILITY_VISIT, so lead-time and facility rules never engage."
            - "Two DIFFERENT clients C1 and C2 with one matter each, so the client geometry cannot mask the representative geometry on the first and third candidates."
            - "M1 is REMOVAL_DEFENSE_OTHER (forum EOIR_IMMIGRATION_COURT), M2 is ADJUSTMENT_OF_STATUS (forum USCIS)."
            - "rep_a is the assigned_representative_id of every event in this recipe, so it is the contended resource."
            - "Anchor event X: INDIVIDUAL_HEARING on M1, location_code 'EOIRA', 2026-09-10T09:00:00.000Z to 2026-09-10T11:00:00.000Z. BUFFER_BY_EVENT_TYPE['INDIVIDUAL_HEARING'] == 60, so its buffered end at a different location is exactly 2026-09-10T12:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: ProgramDirector
            - call: "POST /capacity-cycles"
              payload: { cycle_label: "FY27-Q1", period_start_date: "2026-08-01", period_end_date: "2026-12-31", total_case_slots: 20, reserved_detained_slots: 4 }
              as: ProgramDirector
              captures: { cycle_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Okonjo", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 25, max_supervisees: 6, weekly_capacity_hours: 40, bar_number: "TX-920001" }
              as: ProgramDirector
              captures: { screener_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Ada Okafor", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 12, max_supervisees: 3, weekly_capacity_hours: 40, bar_number: "TX-920002" }
              as: ProgramDirector
              captures: { rep_a_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Marta Reyes", preferred_language_code: "en", country_of_birth_code: "MX", date_of_birth: "1983-11-11", household_size: 2, annual_household_income_cents: 2100000, confidentiality_consent_scope: "PROGRAM_ONLY", interpreter_required: false }
              as: ProgramDirector
              captures: { c1_id: "$.data.id" }
            - call: "PATCH /clients/${c1_id}"
              payload: { status: "ACTIVE" }
              as: ProgramDirector
            - call: "POST /clients"
              payload: { full_name: "Yusuf Kaya", preferred_language_code: "en", country_of_birth_code: "TR", date_of_birth: "1984-12-12", household_size: 1, annual_household_income_cents: 1900000, confidentiality_consent_scope: "PROGRAM_ONLY", interpreter_required: false }
              as: ProgramDirector
              captures: { c2_id: "$.data.id" }
            - call: "PATCH /clients/${c2_id}"
              payload: { status: "ACTIVE" }
              as: ProgramDirector
            - call: "POST /intake-screenings"
              payload: { client_id: "${c1_id}", cycle_id: "${cycle_id}", case_type: "REMOVAL_DEFENSE_OTHER", detained: false }
              as: ProgramDirector
              captures: { i1_id: "$.data.id" }
            - call: "POST /intake-screenings/${i1_id}/screen"
              payload: {}
              as: IntakeScreener
              as_user_id: "${screener_id}"
            - call: "POST /intake-screenings/${i1_id}/decide"
