            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T2", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t2_id: "$.data.id" } }
