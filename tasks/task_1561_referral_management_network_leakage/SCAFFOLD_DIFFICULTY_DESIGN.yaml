            - "after a2: no_show_strikes == 2 and status == ACTIVE"
            - "after a3 (link 1+2): no_show_strikes == 3 and Patient.${pt1}.status == OUTREACH_REQUIRED"
            - "link 3: Referral.${r4}.escalation_flag == true (R4 never touched by the trigger calls)"
            - "Referral.${r1}.status == ACCEPTED (reverted after its appointment went NO_SHOW)"

      - name: aging_sweep_leakage_watch_cascade
        grounds:
          - state_machines.Referral.ACCEPTED_to_EXPIRED
          - calculations.provider_watch_flag
          - entities.ReferringProvider.fields.leakage_event_count
          - entities.ReferringProvider.fields.watch_flag
        distinguishing_aspect: |
          Different trigger from no_show_strike_threshold_cascade: the system aging
          sweep (not a coordinator appointment action). Depth 2: Referral -> EXPIRED
          creates a LeakageRecord (link 1); LeakageRecord creation increments the
          referring provider's leakage_event_count and flips watch_flag at the
          inclusive threshold of 2 (link 2).
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; plan; provider PA; patient PT; two STAT referrals R1/R2 accepted at 2026-08-01T00:00:00Z (sla_due 2026-08-03T00:00:00Z), never scheduled"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
