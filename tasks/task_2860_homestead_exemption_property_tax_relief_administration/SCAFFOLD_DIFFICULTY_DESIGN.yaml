  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_check_beats_income_limit_on_info_requested_application
        grounds:
          - validations[priority=9]
          - validations[priority=30]
          - errors[ERR_APPLICATION_NOT_UNDER_REVIEW]
          - errors[ERR_INCOME_LIMIT_EXCEEDED]
          - calculations.income_relief_tier
        distinguishing_aspect: |
          Conflicting pair (9 state, 409) vs (30 business_fiscal, 422) on
          POST /exemption-applications/{id}/determine: the application sits in INFO_REQUESTED while its
          CERTIFIED IncomeCertification reports 9000000 against a 6000000 program limit, so BOTH rules
          are violated by the same call and the lower-numbered state rule must win.
        conflict_pair:
          lower_priority_rule: "priority 9 — category state — the application must be UNDER_REVIEW for a determination"
          higher_priority_rule: "priority 30 — category business_fiscal — certification.household_income_cents must not exceed program.income_limit_cents"
          expected_winner: ERR_APPLICATION_NOT_UNDER_REVIEW
          expected_http: 409
          rationale: "Ascending priority order is absolute and first failure wins: a request against a row in the wrong lifecycle state is rejected before any money-shaped eligibility arithmetic runs, so the caller never learns the income verdict."
