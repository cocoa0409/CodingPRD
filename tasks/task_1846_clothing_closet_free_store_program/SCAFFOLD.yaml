# =============================================================================
# Task 1846: Clothing Closet & Free Store Program — seed tables
# =============================================================================

scenario: |
  1846. Clothing Closet & Free Store Program (community clothing closet): donation intake, sorting & quality standards, client eligibility & visit frequency/item limits, seasonal inventory rotation & storage constraints, volunteer shift scheduling & sorting workflow, referral partner voucher system, unsellable/unusable textile recycling channel, special drives (interview attire/coats), impact & inventory turnover reporting

domain_name: clothing-closet
api_prefix: /closet

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, many_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities; flat topology, FK-linked)
# common_fields: true => id, created_at, updated_at, version on every entity.
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Client full name" }
      - { name: household_size, type: integer, source: input, description: "Household members count", constraints: ">= 1" }
      - { name: eligibility_tier, type: enum, source: input, description: "STANDARD | HARDSHIP", default: STANDARD }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }
      - { name: last_checkout_at, type: datetime, source: system, description: "Clock time of most recent visit checkout; null until first checkout", default: null }
      - { name: visits_in_30d, type: integer, source: computed, description: "Count of own CHECKED_OUT visits with checked_out_at in (now-30d, now] per visit_window_stats" }
      - { name: items_in_30d, type: integer, source: computed, description: "Count of DISTRIBUTED lines on own visits checked out in (now-30d, now] per visit_window_stats" }

  - name: ClientVisit
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; visiting client" }
      - { name: voucher_id, type: string, source: input, description: "FK -> Voucher.id; voucher redeemed at check-in, null when none", default: null }
      - { name: status, type: enum, source: system, description: "CHECKED_IN | CHECKED_OUT | VOIDED", default: CHECKED_IN }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical clock at check-in" }
      - { name: checked_out_at, type: datetime, source: system, description: "Logical clock at checkout; null until checkout", default: null }
      - { name: general_allowance, type: integer, source: computed, description: "Snapshotted per-visit allowance from visit_item_allowance at check-in" }
      - { name: voucher_bonus_applied, type: integer, source: computed, description: "Voucher bonus_items folded into general_allowance; 0 when no voucher", default: 0 }

  - name: DistributionLine
    parent: null
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: system, description: "FK -> ClientVisit.id; owning visit" }
      - { name: item_id, type: string, source: input, description: "FK -> Item.id; item being distributed" }
      - { name: category_snapshot, type: enum, source: system, description: "Item.category copied at line creation: ADULT_TOPS | ADULT_BOTTOMS | CHILDRENS | COATS | INTERVIEW_ATTIRE | ACCESSORIES" }
      - { name: is_drive_line, type: boolean, source: system, description: "True when the item belongs to an ACTIVE SpecialDrive pool and consumes that drive's bonus pool" }
      - { name: drive_id, type: string, source: system, description: "FK -> SpecialDrive.id; set when is_drive_line, else null", default: null }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISTRIBUTED | RELEASED | RETURNED", default: ACTIVE }

  - name: DonationBatch
    parent: null
    common_fields: true
    fields:
      - { name: donor_name, type: string, source: input, description: "Donor display name" }
      - { name: donor_email, type: string, source: input, description: "Optional donor email", default: null }
      - { name: item_count_declared, type: integer, source: input, description: "Donor-declared item count", constraints: ">= 1" }
      - { name: items_created_count, type: integer, source: computed, description: "Items created against this batch" }
      - { name: status, type: enum, source: system, description: "RECEIVED | IN_SORT | SORTED | CLOSED", default: RECEIVED }
      - { name: sorted_by_user_id, type: string, source: system, description: "X-User-ID that started sorting; segregation-of-duties anchor", default: null }
      - { name: closed_by_user_id, type: string, source: system, description: "X-User-ID that closed the batch", default: null }

  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: donation_batch_id, type: string, source: system, description: "FK -> DonationBatch.id; source batch" }
      - { name: category, type: enum, source: input, description: "ADULT_TOPS | ADULT_BOTTOMS | CHILDRENS | COATS | INTERVIEW_ATTIRE | ACCESSORIES" }
      - { name: season, type: enum, source: input, description: "WINTER | SUMMER | ALL_SEASON" }
      - { name: quality_grade, type: enum, source: input, description: "NEW_WITH_TAGS | GOOD | FAIR | REJECT" }
      - { name: drive_id, type: string, source: input, description: "FK -> SpecialDrive.id; dedicates item to a drive pool; null for general stock", default: null }
      - { name: status, type: enum, source: system, description: "PENDING_STOCK | STOCKED | RESERVED | DISTRIBUTED | OFF_SEASON | QUARANTINED | REJECTED | RECYCLED" }
      - { name: storage_zone_id, type: string, source: system, description: "FK -> StorageZone.id; null unless status STOCKED/RESERVED/QUARANTINED", default: null }
      - { name: reserved_visit_id, type: string, source: system, description: "Visit holding the reservation while RESERVED", default: null }
      - { name: recycling_batch_id, type: string, source: system, description: "FK -> RecyclingBatch.id; assigned by sweep while REJECTED", default: null }
      - { name: graded_by_user_id, type: string, source: system, description: "X-User-ID that created/graded the item" }
      - { name: stocked_at, type: datetime, source: system, description: "Clock of latest transition into STOCKED", default: null }
      - { name: distributed_at, type: datetime, source: system, description: "Clock of DISTRIBUTED transition", default: null }
      - { name: distributed_from_zone_id, type: string, source: system, description: "Zone the item was distributed from; return target zone", default: null }

  - name: StorageZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Unique zone code", constraints: "globally unique" }
      - { name: season_policy, type: enum, source: input, description: "WINTER | SUMMER | ALL_SEASON" }
      - { name: capacity_items, type: integer, source: input, description: "Max physical items", constraints: ">= 1" }
      - { name: current_stock, type: integer, source: computed, description: "Items with storage_zone_id = this and status IN {STOCKED, RESERVED}" }
      - { name: posture, type: enum, source: computed, description: "AVAILABLE | NEAR_FULL | FULL per zone_posture thresholds" }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer name" }
      - { name: is_lead, type: boolean, source: input, description: "When true the volunteer authenticates with role VolunteerLead", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE (volunteers are never deactivated in v1)", default: ACTIVE }

  - name: VolunteerShift
    parent: null
    common_fields: true
    fields:
      - { name: start_at, type: datetime, source: input, description: "Shift window start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Shift window end (exclusive); must be > start_at" }
      - { name: role_type, type: enum, source: input, description: "SORTING | INTAKE | FLOOR" }
      - { name: capacity_volunteers, type: integer, source: input, description: "Max active signups", constraints: ">= 1" }
      - { name: active_signup_count, type: integer, source: computed, description: "Signups in SIGNED_UP or CHECKED_IN" }
      - { name: status, type: enum, source: system, description: "OPEN | LOCKED | COMPLETED | CANCELLED", default: OPEN }

  - name: ShiftSignup
    parent: null
    common_fields: true
    fields:
      - { name: shift_id, type: string, source: system, description: "FK -> VolunteerShift.id" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id" }
      - { name: status, type: enum, source: system, description: "SIGNED_UP | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED", default: SIGNED_UP }
      - { name: checked_in_at, type: datetime, source: system, description: "Clock at check-in", default: null }

  - name: ReferralPartner
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Partner agency name" }
      - { name: base_voucher_quota, type: integer, source: input, description: "Base monthly voucher quota", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: ACTIVE }
      - { name: activated_month_key, type: string, source: system, description: "UTC month YYYY-MM of creation; carryover recursion anchor" }
      - { name: vouchers_issued_current_month, type: integer, source: computed, description: "Vouchers created in the clock's current UTC month (any status)" }
      - { name: current_month_quota, type: integer, source: computed, description: "voucher_quota_carryover for the clock's current month" }

  - name: Voucher
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: system, description: "Server-minted unique voucher code" }
      - { name: partner_id, type: string, source: system, description: "FK -> ReferralPartner.id; issuing partner" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; intended client" }
      - { name: bonus_items, type: integer, source: input, description: "Extra items granted on the redeeming visit", constraints: "1..10" }
      - { name: waives_frequency, type: boolean, source: input, description: "When true, redemption waives the 14-day cooldown (never the 30-day caps)", default: false }
      - { name: expires_at, type: datetime, source: input, description: "Expiry; must be after the logical clock at issuance" }
      - { name: status, type: enum, source: system, description: "ISSUED | REDEEMED | REVOKED | EXPIRED", default: ISSUED }
      - { name: issued_month_key, type: string, source: system, description: "UTC month YYYY-MM of issuance; quota bucket" }
      - { name: redeemed_at, type: datetime, source: system, description: "Clock at redemption", default: null }

  - name: SpecialDrive
    parent: null
    common_fields: true
    fields:
      - { name: drive_type, type: enum, source: input, description: "INTERVIEW_ATTIRE | WINTER_COATS" }
      - { name: target_category, type: enum, source: input, description: "Item category this drive boosts; must be INTERVIEW_ATTIRE for INTERVIEW_ATTIRE drives and COATS for WINTER_COATS drives" }
      - { name: start_at, type: datetime, source: input, description: "Drive window start (inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "Drive window end (inclusive); must be > start_at" }
      - { name: bonus_items_per_client, type: integer, source: input, description: "Per-client drive-pool line allowance", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "UPCOMING | ACTIVE | CLOSED; clock-advanced lazily on any drive read and on allowance evaluation", default: UPCOMING }

  - name: SeasonalRotation
    parent: null
    common_fields: true
    fields:
      - { name: target_season, type: enum, source: input, description: "WINTER | SUMMER" }
      - { name: window_start, type: datetime, source: input, description: "Execution window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Execution window end (inclusive); must be > window_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", default: SCHEDULED }
      - { name: executed_at, type: datetime, source: system, description: "Clock at execution", default: null }
      - { name: moved_out_count, type: integer, source: system, description: "Items moved STOCKED -> OFF_SEASON", default: 0 }
      - { name: moved_in_count, type: integer, source: system, description: "Items moved OFF_SEASON -> STOCKED", default: 0 }

  - name: RecyclingBatch
    parent: null
    common_fields: true
    fields:
      - { name: recycler_name, type: string, source: input, description: "Textile recycler name" }
      - { name: capacity_kg, type: number, source: input, description: "Max estimated kg the batch accepts", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "ACCUMULATING | SEALED | PICKED_UP", default: ACCUMULATING }
      - { name: item_count, type: integer, source: computed, description: "Items assigned to this batch" }
      - { name: est_weight_kg, type: number, source: computed, description: "Sum of per-item estimated weights (2dp)" }
      - { name: provisional_credit_cents, type: integer, source: system, description: "recycling_credit provisional variant, computed at seal", default: null }
      - { name: actual_weight_kg, type: number, source: input, description: "Scale weight recorded at pickup", default: null }
      - { name: final_credit_cents, type: integer, source: system, description: "recycling_credit final variant, computed at pickup", default: null }
      - { name: sealed_by_user_id, type: string, source: system, description: "X-User-ID that sealed; segregation-of-duties anchor", default: null }
      - { name: picked_up_by_user_id, type: string, source: system, description: "X-User-ID that recorded pickup", default: null }

# =============================================================================
# §1.2 State Machine Table (10 machines)
# =============================================================================
state_machines:
  - entity: Client
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /closet/clients/{id}/suspend"
        actor: VolunteerLead | ProgramAdmin
        preconditions: ["Client is ACTIVE (ERR_INVALID_STATE)"]
        side_effects: ["Blocks new check-ins and voucher issuance for this client; in-flight CHECKED_IN visits unaffected"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /closet/clients/{id}/reinstate"
        actor: VolunteerLead | ProgramAdmin
        preconditions: ["Client is SUSPENDED (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: DonationBatch
    initial_state: RECEIVED
    terminal_states: [CLOSED]
    transitions:
      - from: RECEIVED
        to: IN_SORT
        trigger: "POST /closet/donation-batches/{id}/start-sorting"
        actor: Volunteer | VolunteerLead
        preconditions:
          - "Batch is RECEIVED (ERR_INVALID_STATE)"
          - "Exists ShiftSignup S with S.status == CHECKED_IN whose shift has role_type == SORTING, status IN {OPEN, LOCKED}, and start_at <= now <= end_at (ERR_NO_SORTING_STAFF)"
        side_effects: ["sorted_by_user_id = X-User-ID"]
      - from: IN_SORT
        to: SORTED
        trigger: "system (automatic on item creation when items_created_count reaches item_count_declared)"
        actor: system
        preconditions: ["items_created_count == item_count_declared after the create"]
        side_effects: []
      - from: SORTED
        to: CLOSED
        trigger: "POST /closet/donation-batches/{id}/close"
        actor: VolunteerLead | ProgramAdmin
        preconditions:
          - "Batch is SORTED (ERR_INVALID_STATE)"
          - "X-User-ID != sorted_by_user_id (ERR_SOD_SORTER_CANNOT_CLOSE)"
        side_effects: ["closed_by_user_id = X-User-ID"]

  - entity: Item
    initial_state: PENDING_STOCK
    terminal_states: [RECYCLED]
    transitions:
      - from: PENDING_STOCK
        to: STOCKED
        trigger: "POST /closet/items/{id}/stock"
        actor: Volunteer | VolunteerLead
        preconditions:
          - "Item is PENDING_STOCK (ERR_INVALID_STATE)"
          - "Zone season_policy compatible: item.season == ALL_SEASON OR zone.season_policy == ALL_SEASON OR item.season == zone.season_policy (ERR_SEASON_INCOMPATIBLE)"
          - "zone.current_stock < zone.capacity_items (ERR_ZONE_FULL)"
          - "If item.drive_id set: drive.status IN {UPCOMING, ACTIVE} (ERR_DRIVE_NOT_ACTIVE)"
        side_effects:
          - "storage_zone_id = zone; stocked_at = now"
          - "zone.current_stock += 1"
          - "zone.posture recomputed per zone_posture"
      - from: STOCKED
        to: RESERVED
        trigger: "POST /closet/visits/{visitId}/lines"
        actor: Volunteer | VolunteerLead | ProgramAdmin
        preconditions:
          - "Visit is CHECKED_IN; item is STOCKED (ERR_ITEM_NOT_AVAILABLE)"
          - "Allowance and caps per visit_item_allowance / category / rolling caps"
        side_effects: ["reserved_visit_id = visit"]
      - from: RESERVED
        to: STOCKED
        trigger: "DELETE /closet/distribution-lines/{id} or visit void cascade"
        actor: Volunteer | VolunteerLead | ProgramAdmin | system
        preconditions: ["Line is ACTIVE and visit still CHECKED_IN"]
        side_effects: ["reserved_visit_id = null"]
      - from: RESERVED
        to: DISTRIBUTED
        trigger: "POST /closet/visits/{id}/checkout"
        actor: Volunteer | VolunteerLead | ProgramAdmin
        preconditions: ["Visit CHECKED_IN with >= 1 ACTIVE line"]
        side_effects:
          - "distributed_at = now; distributed_from_zone_id = storage_zone_id; storage_zone_id = null; reserved_visit_id = null"
          - "zone.current_stock -= 1"
          - "zone.posture recomputed"
      - from: DISTRIBUTED
        to: STOCKED
        trigger: "POST /closet/distribution-lines/{id}/return"
        actor: Volunteer | VolunteerLead | ProgramAdmin
        preconditions: ["Line is DISTRIBUTED (ERR_INVALID_STATE)"]
        side_effects:
          - "storage_zone_id = distributed_from_zone_id; stocked_at = now (return bypasses capacity check)"
          - "zone.current_stock += 1; zone.posture recomputed"
      - from: STOCKED
        to: QUARANTINED
        trigger: "POST /closet/items/{id}/quarantine"
        actor: VolunteerLead | ProgramAdmin
        preconditions: ["Item is STOCKED (ERR_INVALID_STATE)"]
        side_effects: ["zone.current_stock -= 1 (quarantined items leave the shelf); zone.posture recomputed"]
      - from: QUARANTINED
        to: STOCKED
        trigger: "POST /closet/items/{id}/release-quarantine {outcome: RESTOCK}"
        actor: VolunteerLead | ProgramAdmin
        preconditions: ["Item is QUARANTINED (ERR_INVALID_STATE)"]
        side_effects: ["Restocked into same zone, bypassing capacity check; zone.current_stock += 1; posture recomputed; stocked_at = now"]
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /closet/items/{id}/release-quarantine {outcome: REJECT}"
        actor: VolunteerLead | ProgramAdmin
        preconditions: ["Item is QUARANTINED (ERR_INVALID_STATE)"]
        side_effects: ["storage_zone_id = null; item awaits recycling sweep"]
      - from: STOCKED
        to: OFF_SEASON
        trigger: "system (rotation execute phase-out)"
        actor: system
        preconditions: ["Item STOCKED and season not IN {rotation.target_season, ALL_SEASON}"]
        side_effects: ["storage_zone_id = null; zone.current_stock -= 1; zone.posture recomputed"]
      - from: OFF_SEASON
        to: STOCKED
        trigger: "system (rotation execute phase-in, capacity-gated selector)"
        actor: system
        preconditions: ["Item OFF_SEASON, season == rotation.target_season, and a compatible non-FULL zone exists per seasonal_rotation_moves selector"]
        side_effects: ["storage_zone_id = selected zone; stocked_at = now; zone.current_stock += 1; zone.posture recomputed"]
      - from: REJECTED
        to: RECYCLED
        trigger: "system (recycling batch seal)"
        actor: system
        preconditions: ["Item REJECTED and assigned to the sealing batch"]
        side_effects: []

  - entity: ReferralPartner
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /closet/referral-partners/{id}/suspend"
        actor: ProgramAdmin
        preconditions: ["Partner is ACTIVE (ERR_INVALID_STATE)"]
        side_effects: ["Blocks new voucher issuance; previously issued ISSUED vouchers fail redemption with ERR_PARTNER_SUSPENDED"]

  - entity: ClientVisit
    initial_state: CHECKED_IN
    terminal_states: [CHECKED_OUT, VOIDED]
    transitions:
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /closet/visits/{id}/checkout"
        actor: Volunteer | VolunteerLead | ProgramAdmin
        preconditions:
          - "Visit is CHECKED_IN (ERR_INVALID_STATE)"
          - ">= 1 ACTIVE line (ERR_EMPTY_VISIT_CHECKOUT)"
        side_effects:
          - "Every ACTIVE line -> DISTRIBUTED; each item RESERVED -> DISTRIBUTED with its zone stock/posture cascade"
          - "checked_out_at = now; client.last_checkout_at = now; client.visits_in_30d and items_in_30d recomputed"
      - from: CHECKED_IN
        to: VOIDED
        trigger: "POST /closet/visits/{id}/void"
        actor: VolunteerLead | ProgramAdmin
        preconditions: ["Visit is CHECKED_IN (ERR_INVALID_STATE)"]
        side_effects:
          - "Every ACTIVE line -> RELEASED; each item RESERVED -> STOCKED"
          - "Redeemed voucher stays REDEEMED (no un-redemption)"

  - entity: Voucher
    initial_state: ISSUED
    terminal_states: [REDEEMED, REVOKED, EXPIRED]
    transitions:
      - from: ISSUED
        to: REDEEMED
        trigger: "POST /closet/clients/{id}/visits with voucher_id"
        actor: Volunteer | VolunteerLead | ProgramAdmin
        preconditions:
          - "now < voucher.expires_at (ERR_VOUCHER_EXPIRED; on/after expiry the voucher flips EXPIRED)"
          - "voucher.status == ISSUED (ERR_VOUCHER_NOT_REDEEMABLE)"
          - "voucher.client_id == path client (ERR_VOUCHER_CLIENT_MISMATCH)"
          - "voucher.partner.status == ACTIVE (ERR_PARTNER_SUSPENDED)"
        side_effects: ["redeemed_at = now; visit.voucher_id = voucher; visit allowance gains bonus_items"]
      - from: ISSUED
        to: REVOKED
        trigger: "POST /closet/vouchers/{id}/revoke"
        actor: ReferralPartner | ProgramAdmin
        preconditions: ["Voucher is ISSUED (ERR_INVALID_STATE)"]
        side_effects: ["Issued-quota consumption is permanent; revocation does not refund quota"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (lazy: evaluated on voucher reads and redemption attempts when now >= expires_at)"
        actor: system
        preconditions: ["now >= expires_at"]
        side_effects: []

  - entity: VolunteerShift
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "system (automatic when active_signup_count reaches capacity_volunteers)"
        actor: system
        preconditions: ["active_signup_count == capacity_volunteers after a signup"]
        side_effects: []
      - from: LOCKED
        to: OPEN
        trigger: "system (automatic when a cancellation drops active_signup_count below capacity_volunteers)"
        actor: system
        preconditions: ["active_signup_count < capacity_volunteers after a cancel"]
        side_effects: []
      - from: OPEN
        to: COMPLETED
        trigger: "POST /closet/shifts/{id}/complete"
        actor: VolunteerLead | ProgramAdmin
        preconditions: ["Shift IN {OPEN, LOCKED} (ERR_INVALID_STATE)", "now >= shift.end_at (ERR_SHIFT_NOT_IN_WINDOW)"]
        side_effects: ["Signups SIGNED_UP -> NO_SHOW; signups CHECKED_IN -> COMPLETED"]
      - from: LOCKED
        to: COMPLETED
        trigger: "POST /closet/shifts/{id}/complete"
        actor: VolunteerLead | ProgramAdmin
        preconditions: ["now >= shift.end_at (ERR_SHIFT_NOT_IN_WINDOW)"]
        side_effects: ["Signups SIGNED_UP -> NO_SHOW; signups CHECKED_IN -> COMPLETED"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /closet/shifts/{id}/cancel"
        actor: VolunteerLead | ProgramAdmin
        preconditions: ["Shift IN {OPEN, LOCKED} (ERR_INVALID_STATE)"]
        side_effects: ["All SIGNED_UP and CHECKED_IN signups -> CANCELLED"]
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /closet/shifts/{id}/cancel"
        actor: VolunteerLead | ProgramAdmin
        preconditions: []
        side_effects: ["All SIGNED_UP and CHECKED_IN signups -> CANCELLED"]

  - entity: ShiftSignup
    initial_state: SIGNED_UP
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SIGNED_UP
        to: CHECKED_IN
        trigger: "POST /closet/shifts/{shiftId}/signups/{id}/check-in"
        actor: Volunteer | VolunteerLead | ProgramAdmin
        preconditions:
          - "Signup is SIGNED_UP (ERR_INVALID_STATE)"
          - "shift.status IN {OPEN, LOCKED} and shift.start_at <= now <= shift.end_at (ERR_SHIFT_NOT_IN_WINDOW)"
          - "Volunteer role may only check in own signup (signup.volunteer_id == X-User-ID, ERR_FORBIDDEN)"
        side_effects: ["checked_in_at = now"]
      - from: SIGNED_UP
        to: CANCELLED
        trigger: "POST /closet/shifts/{shiftId}/signups/{id}/cancel"
        actor: Volunteer | VolunteerLead | ProgramAdmin
        preconditions:
          - "Signup is SIGNED_UP (ERR_INVALID_STATE)"
          - "Volunteer role may only cancel own signup (ERR_FORBIDDEN)"
        side_effects: ["shift.active_signup_count -= 1; if shift LOCKED and count < capacity, shift -> OPEN"]
      - from: SIGNED_UP
        to: NO_SHOW
        trigger: "system (shift complete cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (shift complete cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SIGNED_UP
        to: CANCELLED
        trigger: "system (shift cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "system (shift cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SpecialDrive
    initial_state: UPCOMING
    terminal_states: [CLOSED]
    transitions:
      - from: UPCOMING
        to: ACTIVE
        trigger: "system (lazy clock advance when start_at <= now <= end_at, on drive reads and allowance evaluation)"
        actor: system
        preconditions: ["start_at <= now <= end_at"]
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "system (lazy when now > end_at) or POST /closet/drives/{id}/close"
        actor: system | ProgramAdmin
        preconditions: ["now > end_at for the system path; drive not already CLOSED for the manual path (ERR_INVALID_STATE)"]
        side_effects: ["Drive-pool items already STOCKED remain stocked but can no longer be distributed"]
      - from: UPCOMING
        to: CLOSED
        trigger: "POST /closet/drives/{id}/close"
        actor: ProgramAdmin
        preconditions: ["Drive not already CLOSED (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: SeasonalRotation
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /closet/seasonal-rotations/{id}/execute"
        actor: ProgramAdmin
        preconditions:
          - "Rotation is SCHEDULED (ERR_INVALID_STATE)"
          - "window_start <= now <= window_end (ERR_ROTATION_OUTSIDE_WINDOW)"
        side_effects:
          - "Phase-out: each STOCKED item with season NOT IN {target_season, ALL_SEASON} -> OFF_SEASON (zone stock/posture cascade per item)"
          - "Phase-in: OFF_SEASON items with season == target_season re-stocked per seasonal_rotation_moves selector (capacity-gated)"
          - "executed_at = now; moved_out_count / moved_in_count recorded"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /closet/seasonal-rotations/{id}/cancel"
        actor: ProgramAdmin
        preconditions: ["Rotation is SCHEDULED (ERR_INVALID_STATE)"]
        side_effects: []

  - entity: RecyclingBatch
    initial_state: ACCUMULATING
    terminal_states: [PICKED_UP]
    transitions:
      - from: ACCUMULATING
        to: SEALED
        trigger: "POST /closet/recycling-batches/{id}/seal"
        actor: ProgramAdmin
        preconditions:
          - "Batch is ACCUMULATING (ERR_INVALID_STATE)"
          - "item_count >= 1 (ERR_RECYCLING_EMPTY)"
        side_effects:
          - "est_weight_kg and provisional_credit_cents computed per recycling_credit provisional variant"
          - "All assigned items REJECTED -> RECYCLED"
          - "sealed_by_user_id = X-User-ID"
      - from: SEALED
        to: PICKED_UP
        trigger: "POST /closet/recycling-batches/{id}/pickup"
        actor: ProgramAdmin
        preconditions:
          - "Batch is SEALED (ERR_INVALID_STATE)"
          - "X-User-ID != sealed_by_user_id (ERR_SOD_SEALER_CANNOT_PICKUP)"
          - "actual_weight_kg > 0 (ERR_INVALID_REQUEST)"
        side_effects: ["final_credit_cents computed per recycling_credit final variant; picked_up_by_user_id = X-User-ID"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; serial-observable only)
# =============================================================================
concurrency_rules:
  - rule_id: client-profile-stale-version
    parent_entity: Client
    write_endpoint: "PATCH /closet/clients/{id}"
    occ_field: expected_client_version
    description: |
      Updating a Client profile (household_size / eligibility_tier) with an
      expected_client_version the server no longer holds is rejected. Because
      allowance snapshots are taken from the live profile at check-in, a writer
      who read the profile before another writer's update must not silently
      overwrite it; the stale writer re-reads and retries.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: zone-capacity-stale-version
    parent_entity: StorageZone
    write_endpoint: "PATCH /closet/storage-zones/{id}"
    occ_field: expected_zone_version
    description: |
      Updating a StorageZone (capacity_items / season_policy) with an
      expected_zone_version the server no longer holds is rejected. Capacity
      changes interact with live stock and rotation selectors, so a writer
      holding a stale zone snapshot must re-read before reapplying.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (10 calculations)
# =============================================================================
calculations:
  - name: visit_item_allowance
    trigger: "visit check-in (snapshot stored on ClientVisit.general_allowance)"
    algorithm: threshold
    formula: |
      base = min(HOUSEHOLD_CAP, BASE_ITEMS + PER_MEMBER_ITEMS * max(0, household_size - 1))
      if eligibility_tier == HARDSHIP: base = round_half_up(base * HARDSHIP_MULTIPLIER)   # integer
      voucher_bonus = voucher.bonus_items if a voucher is redeemed on this visit else 0
      general_allowance = min(HARD_VISIT_CAP, base + voucher_bonus)
      Drive pools are separate: each ACTIVE drive d grants up to d.bonus_items_per_client
      lines whose item has drive_id == d.id (is_drive_line); drive lines never consume
      general_allowance and general items never consume drive pools.
    input_set: "Client (household_size, eligibility_tier), redeemed Voucher, ACTIVE drives at check-in"
    constants: { BASE_ITEMS: 8, PER_MEMBER_ITEMS: 2, HOUSEHOLD_CAP: 16, HARDSHIP_MULTIPLIER: 1.5, HARD_VISIT_CAP: 24 }
    precision: "integer, round_half_up on the tier multiplier"

  - name: visit_frequency_gate
    trigger: "visit check-in"
    algorithm: threshold
    formula: |
      cooldown_ok = (client.last_checkout_at IS NULL) OR (now >= client.last_checkout_at + COOLDOWN_DAYS * 24h)   # boundary INCLUSIVE
      if voucher redeemed AND voucher.waives_frequency: cooldown_ok = true
      window_ok = client.visits_in_30d < MAX_VISITS_PER_30D   # never waived
      check-in allowed iff cooldown_ok AND window_ok
    input_set: "Client checkout history, redeemed Voucher"
    constants: { COOLDOWN_DAYS: 14, MAX_VISITS_PER_30D: 3 }
    precision: "second precision on timestamps"

  - name: rolling_item_cap
    trigger: "line add"
    algorithm: threshold
    formula: |
      reject with ERR_ROLLING_ITEM_CAP_EXCEEDED when
        client.items_in_30d + ACTIVE lines on this visit + 1 > MAX_ITEMS_PER_30D
    input_set: "Client visit history (30d), current visit ACTIVE lines"
    constants: { MAX_ITEMS_PER_30D: 30 }

  - name: category_line_cap
    trigger: "line add"
    algorithm: threshold
    formula: |
      cap(COATS) = 2; cap(INTERVIEW_ATTIRE) = 1; other categories uncapped.
      For a general (non-drive) line: reject ERR_CATEGORY_LIMIT_EXCEEDED when
        count(ACTIVE general lines with category_snapshot == c) + 1 > cap(c)
      Drive lines are exempt from category caps (bounded by drive bonus pool instead).
    input_set: "ACTIVE lines on the visit"

  - name: visit_window_stats
    trigger: "read of Client.visits_in_30d / items_in_30d, check-in, line add, checkout, return"
    algorithm: aggregation
    formula: |
      visits_in_30d = count of client's visits with status CHECKED_OUT and checked_out_at in (now-30d, now]
      items_in_30d  = count of lines with status == DISTRIBUTED on those in-window visits
      Window boundary: a checkout exactly 30*24h ago is EXCLUDED (half-open window).
    input_set: "ClientVisit + DistributionLine for the client"

  - name: zone_posture
    trigger: "any change to a zone's current_stock (stock, reserve-invariant no-op, distribute, return, quarantine, restock, rotation, capacity PATCH)"
    algorithm: threshold
    formula: |
      if current_stock >= capacity_items: FULL
      elif current_stock >= ceil(NEAR_FULL_RATIO * capacity_items): NEAR_FULL
      else AVAILABLE
      Stocking is rejected when posture == FULL, i.e. when current_stock >= capacity_items
      (boundary INCLUSIVE: a zone at exactly capacity refuses the next item).
    input_set: "StorageZone row"
    constants: { NEAR_FULL_RATIO: 0.8 }

  - name: voucher_quota_carryover
    trigger: "read of ReferralPartner.current_month_quota; voucher issuance"
    algorithm: chronological
    formula: |
      Months are UTC calendar months keyed YYYY-MM; the recursion anchor is
      activated_month_key (carryover into that month is 0).
      quota(m)   = base_voucher_quota + carryover(m)
      issued(m)  = count of vouchers with issued_month_key == m (any status; issuance is permanent)
      carryover(m) = min(MAX_CARRYOVER, max(0, quota(m-1) - issued(m-1))) for m after the anchor month
      EVALUATION ORDER (pinned): iterate months ascending from the anchor month to the
      current month, fully computing quota(m-1) and issued(m-1) before carryover(m).
      Issuance allowed iff vouchers_issued_current_month < current_month_quota.
    input_set: "ReferralPartner + its Vouchers"
    constants: { MAX_CARRYOVER: 5 }
    precision: "integer"

  - name: recycling_credit
    trigger: "recycling batch seal (provisional) and pickup (final)"
    algorithm: aggregation
    formula: |
      PROVISIONAL (at seal): per-ITEM rounding, then sum (pinned order):
        provisional_credit_cents = SUM over assigned items round_half_up(EST_WEIGHT_KG[category] * RATE_CENTS_PER_KG[category])
        est_weight_kg = SUM over assigned items EST_WEIGHT_KG[category], kept at 2dp
      FINAL (at pickup): single blended tier rate on the actual scale weight:
        tier = TIER1 if actual_weight_kg < TIER1_MAX_KG
               TIER2 if TIER1_MAX_KG <= actual_weight_kg < TIER2_MAX_KG
               TIER3 if actual_weight_kg >= TIER2_MAX_KG   (boundaries INCLUSIVE upward)
        final_credit_cents = round_half_up(actual_weight_kg * tier_rate)
    input_set: "Items assigned to the batch (provisional); actual_weight_kg (final)"
    constants:
      EST_WEIGHT_KG: { ADULT_TOPS: 0.40, ADULT_BOTTOMS: 0.60, CHILDRENS: 0.30, COATS: 1.50, INTERVIEW_ATTIRE: 0.80, ACCESSORIES: 0.20 }
      RATE_CENTS_PER_KG: { ADULT_TOPS: 45, ADULT_BOTTOMS: 45, CHILDRENS: 38, COATS: 52, INTERVIEW_ATTIRE: 60, ACCESSORIES: 30 }
      TIER1_MAX_KG: 100
      TIER2_MAX_KG: 500
      TIER1_RATE: 40
      TIER2_RATE: 44
      TIER3_RATE: 50
    precision: "integer cents, round_half_up; weights 2dp"
    variants:
      - name: provisional
        when: "at seal; per-item estimated weights and per-category rates"
        difference: "per-item rounding then sum; ignores actual scale weight"
      - name: final
        when: "at pickup; actual total scale weight times tiered single rate"
        difference: "one rounding on the total; ignores per-category composition"

  - name: inventory_turnover
    trigger: "GET /closet/reports/impact (per zone, trailing 28 days)"
    algorithm: aggregation
    formula: |
      window = (now - 28d, now]  (checkout exactly 28d ago EXCLUDED)
      window_distributed(Z) = count items with distributed_from_zone_id == Z and distributed_at in window
      window_stocked(Z)     = count items with stocked_at in window and
                              (storage_zone_id == Z OR distributed_from_zone_id == Z)
                              (an item stocked into Z then distributed still counts as stocked-into-Z)
      stock_at_window_start(Z) = current_stock + window_distributed - window_stocked
      CURRENT-BASIS: turnover_current_basis = window_distributed / max(1, current_stock)
      AVERAGE-BASIS: turnover_average_basis = window_distributed / max(1, round_half_up((stock_at_window_start + current_stock) / 2))
    input_set: "StorageZone + Items"
    precision: "4 decimal places, round_half_up"
    variants:
      - name: current_basis
        when: "denominator is live stock"
        difference: "penalizes zones that just received a restock wave"
      - name: average_basis
        when: "denominator is the mean of window-start and current stock"
        difference: "smooths restock waves; diverges from current-basis whenever stock moved in-window"

  - name: recycling_sweep_assignment
    trigger: "POST /closet/recycling-batches/{id}/sweep"
    algorithm: chronological
    formula: |
      Candidate set: items with status == REJECTED and recycling_batch_id IS NULL,
      processed created_at ASC (no id tie-break is ever used).
      running = batch.est_weight_kg
      For each candidate in order:
        if running + EST_WEIGHT_KG[item.category] > batch.capacity_kg: STOP (do not skip ahead)
        else: assign item.recycling_batch_id = batch; running += EST_WEIGHT_KG[item.category]
      batch.est_weight_kg = running; batch.item_count recomputed as assigned-item count.
    input_set: "REJECTED unassigned Items + the ACCUMULATING batch"
    precision: "weights 2dp"

  - name: seasonal_rotation_moves
    trigger: "rotation execute"
    algorithm: waterfall_allocation
    formula: |
      Phase-out first: every STOCKED item with season NOT IN {target_season, ALL_SEASON}
        -> OFF_SEASON (storage_zone_id = null; zone stock/posture cascade per item).
      Phase-in second: OFF_SEASON items with season == target_season, processed
        created_at ASC (oldest first; no id tie-break is ever used). For each item:
          eligible zones = zones with season_policy IN {target_season, ALL_SEASON} AND posture != FULL
          rank eligible zones by current_stock ASC, tie-break zone.created_at ASC
          empty pool -> item remains OFF_SEASON (no error)
          else place: storage_zone_id = chosen zone; stocked_at = now; stock += 1; posture recomputed per placement
      moved_out_count / moved_in_count record the phase totals.
    input_set: "Items + StorageZones at execution time"

# =============================================================================
# §1.4 Validation Rules Table (ordered; same-priority ties break top-down)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role value recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Ownership scope: Client may only read self (own record/visits/vouchers); ReferralPartner only its own record/voucher issue/revoke; Volunteer only own signup check-in/cancel", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "scoped endpoints" }
  - { priority: 4, category: existence, check: "Path and body-referenced ids resolve, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 5, category: existence, check: "Request shape: required fields present; types/enums valid; ranges (household_size>=1, capacity>=1, bonus_items 1..10, actual_weight_kg>0, start<end, expires_at in future)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 6, category: state, check: "OCC: expected_<parent>_version matches the resource's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /closet/clients/{id}, PATCH /closet/storage-zones/{id}" }
  - { priority: 7, category: state, check: "Target resource state permits the transition (batch IN_SORT for item create / SORTED for close, visit CHECKED_IN, voucher ISSUED for revoke, shift OPEN/LOCKED, rotation SCHEDULED, recycling batch ACCUMULATING/SEALED)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "Line add: item must be STOCKED", error_id: ERR_ITEM_NOT_AVAILABLE, http_status: 409, applies_to: "POST /closet/visits/{id}/lines" }
  - { priority: 9, category: state, check: "Client status ACTIVE for new check-ins and voucher issuance targeting the client", error_id: ERR_CLIENT_NOT_ACTIVE, http_status: 409, applies_to: "POST /closet/clients/{id}/visits, POST /closet/referral-partners/{id}/vouchers" }
  - { priority: 10, category: state, check: "ReferralPartner status ACTIVE for voucher issuance (partner is the path resource)", error_id: ERR_PARTNER_SUSPENDED, http_status: 409, applies_to: "POST /closet/referral-partners/{id}/vouchers" }
  - { priority: 11, category: business_temporal, check: "14-day cooldown since last checkout (inclusive boundary; voucher waives_frequency overrides)", error_id: ERR_VISIT_COOLDOWN_ACTIVE, http_status: 409, applies_to: "POST /closet/clients/{id}/visits" }
  - { priority: 12, category: business_temporal, check: "Rolling 30-day visit cap: visits_in_30d < 3 (never waived)", error_id: ERR_VISIT_LIMIT_REACHED, http_status: 409, applies_to: "POST /closet/clients/{id}/visits" }
  - { priority: 13, category: business_temporal, check: "Voucher not expired: now < expires_at (on/after expiry voucher flips EXPIRED)", error_id: ERR_VOUCHER_EXPIRED, http_status: 409, applies_to: "POST /closet/clients/{id}/visits" }
  - { priority: 14, category: business_temporal, check: "Shift check-in and shift complete only inside/after the shift window (check-in: start<=now<=end; complete: now>=end)", error_id: ERR_SHIFT_NOT_IN_WINDOW, http_status: 409, applies_to: "POST /closet/shifts/{id}/signups/{sid}/check-in, POST /closet/shifts/{id}/complete" }
  - { priority: 15, category: business_temporal, check: "Rotation execute only inside [window_start, window_end] inclusive", error_id: ERR_ROTATION_OUTSIDE_WINDOW, http_status: 409, applies_to: "POST /closet/seasonal-rotations/{id}/execute" }
  - { priority: 16, category: business_constraint, check: "Zone posture not FULL: current_stock < capacity_items", error_id: ERR_ZONE_FULL, http_status: 409, applies_to: "POST /closet/items/{id}/stock" }
  - { priority: 17, category: business_constraint, check: "Season compatibility item vs zone", error_id: ERR_SEASON_INCOMPATIBLE, http_status: 409, applies_to: "POST /closet/items/{id}/stock" }
  - { priority: 18, category: business_constraint, check: "Shift has remaining capacity (status OPEN, not LOCKED)", error_id: ERR_SHIFT_FULL, http_status: 409, applies_to: "POST /closet/shifts/{id}/signups" }
  - { priority: 19, category: business_constraint, check: "No overlapping active signup for the same volunteer (half-open intervals; back-to-back allowed)", error_id: ERR_SHIFT_OVERLAP, http_status: 409, applies_to: "POST /closet/shifts/{id}/signups" }
  - { priority: 20, category: business_constraint, check: "Volunteer not already actively signed up on this shift", error_id: ERR_ALREADY_SIGNED_UP, http_status: 409, applies_to: "POST /closet/shifts/{id}/signups" }
  - { priority: 21, category: business_constraint, check: "Per-visit allowance: general ACTIVE lines < general_allowance; per-drive lines < drive bonus pool", error_id: ERR_ITEM_LIMIT_EXCEEDED, http_status: 409, applies_to: "POST /closet/visits/{id}/lines" }
  - { priority: 22, category: business_constraint, check: "Category cap for general lines (COATS 2, INTERVIEW_ATTIRE 1)", error_id: ERR_CATEGORY_LIMIT_EXCEEDED, http_status: 409, applies_to: "POST /closet/visits/{id}/lines" }
  - { priority: 23, category: business_constraint, check: "Rolling 30-day item cap (30) including this visit's ACTIVE lines", error_id: ERR_ROLLING_ITEM_CAP_EXCEEDED, http_status: 409, applies_to: "POST /closet/visits/{id}/lines" }
  - { priority: 24, category: business_constraint, check: "Checkout requires >= 1 ACTIVE line", error_id: ERR_EMPTY_VISIT_CHECKOUT, http_status: 409, applies_to: "POST /closet/visits/{id}/checkout" }
  - { priority: 25, category: business_constraint, check: "Monthly voucher quota: vouchers_issued_current_month < current_month_quota", error_id: ERR_VOUCHER_QUOTA_EXHAUSTED, http_status: 409, applies_to: "POST /closet/referral-partners/{id}/vouchers" }
  - { priority: 26, category: business_constraint, check: "zone_code globally unique", error_id: ERR_ZONE_CODE_TAKEN, http_status: 409, applies_to: "POST /closet/storage-zones" }
  - { priority: 27, category: business_constraint, check: "Same-drive_type window conflict with 7-day buffer", error_id: ERR_DRIVE_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /closet/drives" }
  - { priority: 28, category: business_constraint, check: "Seal requires item_count >= 1", error_id: ERR_RECYCLING_EMPTY, http_status: 409, applies_to: "POST /closet/recycling-batches/{id}/seal" }
  - { priority: 29, category: business_constraint, check: "Zone PATCH: new capacity_items >= current_stock", error_id: ERR_CAPACITY_BELOW_STOCK, http_status: 409, applies_to: "PATCH /closet/storage-zones/{id}" }
  - { priority: 30, category: business_referential, check: "Voucher status ISSUED at redemption (not REVOKED/REDEEMED/EXPIRED)", error_id: ERR_VOUCHER_NOT_REDEEMABLE, http_status: 409, applies_to: "POST /closet/clients/{id}/visits" }
  - { priority: 31, category: business_referential, check: "Voucher belongs to this client", error_id: ERR_VOUCHER_CLIENT_MISMATCH, http_status: 409, applies_to: "POST /closet/clients/{id}/visits" }
  - { priority: 32, category: business_referential, check: "Voucher's partner ACTIVE at redemption", error_id: ERR_PARTNER_SUSPENDED, http_status: 409, applies_to: "POST /closet/clients/{id}/visits" }
  - { priority: 33, category: business_referential, check: "Drive-referenced operations require drive UPCOMING/ACTIVE for stocking, ACTIVE for line add", error_id: ERR_DRIVE_NOT_ACTIVE, http_status: 409, applies_to: "POST /closet/items/{id}/stock, POST /closet/visits/{id}/lines" }
  - { priority: 34, category: business_safety, check: "Segregation of duties: batch closer != sorted_by_user_id", error_id: ERR_SOD_SORTER_CANNOT_CLOSE, http_status: 409, applies_to: "POST /closet/donation-batches/{id}/close" }
  - { priority: 35, category: business_safety, check: "Segregation of duties: pickup recorder != sealed_by_user_id", error_id: ERR_SOD_SEALER_CANNOT_PICKUP, http_status: 409, applies_to: "POST /closet/recycling-batches/{id}/pickup" }
  - { priority: 36, category: business_temporal, check: "Sorting requires a CHECKED_IN signup on a SORTING shift covering now", error_id: ERR_NO_SORTING_STAFF, http_status: 409, applies_to: "POST /closet/donation-batches/{id}/start-sorting" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/closet/_clock/set_current_utc", description: "Advance the logical clock. Server starts at 2026-08-01T00:00:00Z before any call; never falls back to wall-clock.", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["Lazy drive/voucher status advancement on subsequent evaluations"] }

  - { method: POST, path: "/closet/clients", description: "Register a client", roles: [ProgramAdmin, VolunteerLead, Volunteer], code: 201, input: [full_name, household_size, "eligibility_tier?"], output: Client, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/closet/clients", description: "List clients", roles: [ProgramAdmin, VolunteerLead, Volunteer], code: 200, input: ["status?", "limit?", "offset?"], output: "Client[]", side_effects: [] }
  - { method: GET, path: "/closet/clients/{id}", description: "Read a client (self or staff)", roles: [ProgramAdmin, VolunteerLead, Volunteer, Client], code: 200, input: [], output: Client, side_effects: [] }
  - { method: PATCH, path: "/closet/clients/{id}", description: "Update household_size/eligibility_tier (OCC)", roles: [ProgramAdmin, VolunteerLead], code: 200, input: ["household_size?", "eligibility_tier?", expected_client_version], output: Client, side_effects: ["increments Client.version by 1"] }
