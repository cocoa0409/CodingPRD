              as: AdministrativeLawJudge
              as_user_id: "alj-1"
            - call: "POST /fmc/complaints/${comp_y}/open-adjudication"
              payload: {}
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T12:00:00Z" }
              as: CommissionAdmin
            - call: "POST /fmc/complaints/${comp_x}/decide"
              payload: {}
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
            - call: "POST /fmc/complaints/${comp_y}/decide"
              payload: {}
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-04T12:00:00Z" }
