            - "claim does NOT return ERR_PICKUP_CODE_INVALID"
            - "Order.${ord_id}.fulfillment_status == CANCELLED (unchanged)"
      - name: business_safety_vs_business_constraint_on_order_create
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors[ERR_DAYPART_NOT_ACTIVE]
          - errors[ERR_CUSTOMIZATION_NOT_ALLOWED]
        distinguishing_aspect: |
          Different category pair (business_constraint kind-mismatch at
          priority 14 vs business_constraint customization at priority 13): a
          PORTAL_STANDARD order created against a PLANNED daypart (priority-14
          daypart-state violation) that ALSO carries a customized line on a
          non-customizable product (priority-13 violation) MUST surface
          ERR_CUSTOMIZATION_NOT_ALLOWED — priority 13 is checked before 14 in
          this scaffold's ordering.
        test_recipe:
          setup:
            - "StoreDay 2026-09-19 created but NOT opened; DINNER daypart still PLANNED"
            - "Product PEP with customization_allowed default false"
          setup_api_calls:
            - call: "POST /store-days"
              payload: { business_date: "2026-09-19" }
