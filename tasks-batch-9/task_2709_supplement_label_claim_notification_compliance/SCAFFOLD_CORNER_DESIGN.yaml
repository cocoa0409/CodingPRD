scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_product_create_returns_envelope_with_seeded_counters
        claim_type: creation
        grounds:
          - entities.Product
          - response_envelope
          - endpoints[POST /supplement-compliance/products]
        distinguishing_aspect: "A bare product create must return 201 with the success envelope and every denormalized counter seeded to its declared default, not null."
        test_recipe:
          setup:
            - "Empty database; logical clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "NutraCore", product_name: "Magnesium Glycinate", net_quantity_g: 120, servings_per_container: 60 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id }
          assert:
            - "HTTP 201 with an envelope carrying data and no error member"
            - "data.lifecycle_status == DRAFT and data.label_posture == OPEN"
            - "data.serious_ae_count == 0, data.nonserious_ae_count == 0, data.late_notification_count == 0, data.rejected_coa_count == 0"
            - "data.active_claim_count == 0, data.withdrawn_claim_count == 0, data.requires_label_revision == false"
            - "data.compliance_risk_index == 10 (base floor with all counters zero) and data.marketing_start_date == null"
            - "data.version == 1 and data.id, data.created_at, data.updated_at are server-minted"
      - name: corner_product_get_returns_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - endpoints[GET /supplement-compliance/products/{id}]
          - entities.Product
        distinguishing_aspect: "A read-only GET must echo the stored row without mutating it — version must not advance on a read."
        test_recipe:
          setup:
            - "One DRAFT product created at the default clock."
          setup_api_calls:
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "NutraCore", product_name: "Magnesium Glycinate", net_quantity_g: 120, servings_per_container: 60 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id, created: $.data.created_at }
          trigger:
            - call: "GET /supplement-compliance/products/${prod_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u_aud_01"
              captures: { v: $.data.version }
          assert:
            - "HTTP 200 with data.id == ${prod_id} and data.created_at == ${created}"
            - "data.version == 1 — the GET performed no write"
            - "data.brand_name == NutraCore and data.net_quantity_g == 120"
      - name: corner_ingredient_list_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /supplement-compliance/ingredients]
          - response_envelope
        distinguishing_aspect: "Three ingredients with page_size 2 must return the first two rows plus total_count 3 and has_more true; the second page returns the remainder with has_more false."
        test_recipe:
          setup:
            - "Exactly three ingredients created in a known order, all left in DRAFT_ASSESSMENT."
          setup_api_calls:
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Ascorbic Acid", ingredient_class: "VITAMIN", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 500, rdi_mg: 90 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Zinc Picolinate", ingredient_class: "MINERAL", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 15, rdi_mg: 11 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Maca Root Powder", ingredient_class: "BOTANICAL", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 1500 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
          trigger:
            - call: "GET /supplement-compliance/ingredients"
              payload: { page: 1, page_size: 2 }
              as: ComplianceAuditor
              as_user_id: "u_aud_01"
            - call: "GET /supplement-compliance/ingredients"
              payload: { page: 2, page_size: 2 }
              as: ComplianceAuditor
              as_user_id: "u_aud_01"
          assert:
            - "page 1 returns exactly 2 items with total_count == 3 and has_more == true"
            - "page 2 returns exactly 1 item with total_count == 3 and has_more == false"
            - "the three ids across both pages are distinct and cover all three created ingredients"
      - name: corner_claim_get_unknown_id_returns_claim_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CLAIM_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unknown UUID on a claim read must produce ERR_CLAIM_NOT_FOUND (404) via the path-existence rule, not a 500 or an empty 200."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /supplement-compliance/claims/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "u_aud_01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_CLAIM_NOT_FOUND"
            - "the envelope carries the error member and data is null"
      - name: corner_panel_create_missing_serving_size_text_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
          - endpoints[POST /supplement-compliance/label-panels]
        distinguishing_aspect: "Body-shape validation (priority 4) must fire before any state, OCC or window rule when a required panel field is absent."
        test_recipe:
          setup:
            - "One GRANDFATHERED ingredient on a DRAFT product with one ACTIVE line; product version captured."
          setup_api_calls:
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Ascorbic Acid", ingredient_class: "VITAMIN", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 500, rdi_mg: 90 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "NutraCore", product_name: "C-500", net_quantity_g: 120, servings_per_container: 60 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id }
            - call: "POST /supplement-compliance/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_id}", amount_per_serving_mg: 500, panel_position: 1 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "GET /supplement-compliance/products/${prod_id}"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_v: $.data.version }
          trigger:
            - call: "POST /supplement-compliance/label-panels"
              payload: { product_id: "${prod_id}", expected_product_version: "${prod_v}", panel_format: "STANDARD", serving_weight_g: 2, servings_per_container_declared: 60, effective_from: "2026-09-01", effective_until: "2027-08-31", declared_warning_codes: ["PEDIATRIC_KEEP_OUT_OF_REACH"] }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_VALIDATION naming the absent serving_size_text"
            - "no LabelPanel row exists for Product.${prod_id}"
            - "Product.${prod_id}.version is still ${prod_v} — a rejected body performs no write"
      - name: corner_product_ingredient_percent_dv_is_computed_not_supplied
        claim_type: computed_fields
        grounds:
          - calculations.percent_dv_declared
          - entities.ProductIngredient.fields.percent_dv_declared
          - entities.ProductIngredient.fields.dv_established
        distinguishing_aspect: "percent_dv_declared and dv_established are computed at line creation from the ingredient's rdi_mg; a line on an ingredient with no rdi_mg must get a null percentage and dv_established false rather than 0."
        test_recipe:
          setup:
            - "Two GRANDFATHERED ingredients: zinc with rdi_mg 11 and a botanical with no rdi_mg at all."
            - "One DRAFT product carrying one line for each."
          setup_api_calls:
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Zinc Picolinate", ingredient_class: "MINERAL", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 15, rdi_mg: 11 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_zn_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_zn_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Maca Root Powder", ingredient_class: "BOTANICAL", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 1500 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_maca_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_maca_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "NutraCore", product_name: "Zinc Plus Maca", net_quantity_g: 60, servings_per_container: 30 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /supplement-compliance/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_zn_id}", amount_per_serving_mg: 11, panel_position: 1 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { line_zn_id: $.data.id, zn_dv: $.data.percent_dv_declared }
            - call: "POST /supplement-compliance/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_maca_id}", amount_per_serving_mg: 750, panel_position: 2 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { line_maca_id: $.data.id }
          assert:
            - "ProductIngredient.${line_zn_id}.percent_dv_declared == 100 and dv_established == true"
            - "ProductIngredient.${line_maca_id}.percent_dv_declared == null and dv_established == false"
            - "both lines are created with line_status == ACTIVE and version == 1"
      - name: corner_ingredient_create_rejects_unknown_ingredient_class
        claim_type: type_constraints
        grounds:
          - entities.Ingredient.fields.ingredient_class
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "An out-of-enum ingredient_class must be refused by body-shape validation rather than stored and later mis-classified by the CoA identity-method table."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Mystery Powder", ingredient_class: "SUPERFOOD", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 500 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 with error_id == ERR_VALIDATION"
            - "no Ingredient row is created"
      - name: corner_coa_create_unknown_lot_id_returns_lot_not_found
        claim_type: flat
        grounds:
          - validations[priority=5]
          - errors[ERR_LOT_NOT_FOUND]
          - entities.CertificateOfAnalysis.fields.lot_id
        distinguishing_aspect: "Flat topology: a body foreign key pointing at no row must fail referential existence (priority 5-10) before any identity-method or acceptability rule is evaluated, so the method is never checked against a missing ingredient class."
        test_recipe:
          setup:
            - "Empty database — no lots exist at all."
          setup_api_calls: []
          trigger:
            - call: "POST /supplement-compliance/coas"
              payload: { lot_id: "00000000-0000-4000-8000-000000000000", lab_name: "Cascade Analytical", identity_test_method: "HPTLC", identity_match: true, assay_percent_of_label: 100.0, heavy_metals_pass: true, microbial_pass: true }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with error_id == ERR_LOT_NOT_FOUND"
            - "error_id is NOT ERR_IDENTITY_METHOD_NOT_APPROVED — referential existence outranks the method table"
            - "no CertificateOfAnalysis row is created"
  - section: state_machines
    instances:
      - name: corner_second_eligibility_determination_on_same_ingredient_rejected
        claim_type: idempotency
        grounds:
          - state_machines.Ingredient.DRAFT_ASSESSMENT_to_GRANDFATHERED
          - validations[priority=14]
          - errors[ERR_INGREDIENT_STATE_INVALID]
        distinguishing_aspect: "Eligibility determination is a one-shot transition out of DRAFT_ASSESSMENT; the second call must be refused instead of re-deriving the status."
        test_recipe:
          setup:
            - "One pre-DSHEA vitamin already determined GRANDFATHERED."
          setup_api_calls:
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Ascorbic Acid", ingredient_class: "VITAMIN", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 500, rdi_mg: 90 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { determined: $.data.determined_at }
          trigger:
            - call: "POST /supplement-compliance/ingredients/${ing_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_INGREDIENT_STATE_INVALID"
            - "Ingredient.${ing_id}.eligibility_status is still GRANDFATHERED with determined_at == ${determined} and ndi_notification_required == false"
      - name: corner_ndi_acknowledge_before_waiting_period_rejected_object_exempt
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=27]
          - errors[ERR_WAITING_PERIOD_NOT_ELAPSED]
          - state_machines.NDINotification.SUBMITTED_to_OBJECTED
        distinguishing_aspect: "The 75-day premarket wait gates ACKNOWLEDGE only; an OBJECT response is explicitly exempt and must succeed from the same clock position, proving the precondition is branch-specific."
        test_recipe:
          setup:
            - "One NDI_REQUIRED ingredient with a notification SUBMITTED at the default clock, so waiting_period_end is 2026-10-15T00:00:00Z."
            - "Clock advanced to 2026-10-14T00:00:00Z, one day short of the window."
          setup_api_calls:
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Synthetic Peptide K", ingredient_class: "AMINO_ACID", pre_dshea_marketed: false, chemical_alteration: true, daily_intake_mg: 300 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/ndi-notifications"
              payload: { ingredient_id: "${ing_id}", submitter_reference: "NDI-2026-0301", safety_narrative: "Toxicology package for a 300 mg daily intake." }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ndi_id: $.data.id }
            - call: "POST /supplement-compliance/ndi-notifications/${ndi_id}/submit"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/_clock/set_current_utc"
              payload: { current_utc: "2026-10-14T00:00:00Z" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
          trigger:
            - call: "POST /supplement-compliance/ndi-notifications/${ndi_id}/agency-response"
              payload: { response: "ACKNOWLEDGE" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { err: $.data.error_id }
            - call: "POST /supplement-compliance/ndi-notifications/${ndi_id}/agency-response"
              payload: { response: "OBJECT", agency_objection_reason: "Safety narrative does not support the proposed daily intake." }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
          assert:
            - "the ACKNOWLEDGE attempt returns HTTP 409 with error_id == ERR_WAITING_PERIOD_NOT_ELAPSED and leaves notification_status == SUBMITTED"
            - "the OBJECT response returns HTTP 200 with notification_status == OBJECTED and agency_response_at == 2026-10-14T00:00:00Z"
            - "Ingredient.${ing_id}.eligibility_status == NDI_OBJECTED"
      - name: corner_nonserious_aer_branch_mints_no_submission_deadline
        claim_type: branching
        grounds:
          - state_machines.AdverseEventReport.RECEIVED_to_TRIAGED_NONSERIOUS
          - calculations.product_compliance_risk_index
          - entities.AdverseEventReport.fields.submission_due_date
        distinguishing_aspect: "The non-serious fork must leave submission_due_date null and bump only nonserious_ae_count, so the product's index rises by the 6-point weight and never by the 20-point serious weight."
        test_recipe:
          setup:
            - "One DRAFT product with a single RECEIVED adverse event report whose outcome codes contain no seriousness marker."
          setup_api_calls:
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "NutraCore", product_name: "Fiber Blend", net_quantity_g: 300, servings_per_container: 30 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id }
            - call: "POST /supplement-compliance/adverse-event-reports"
              payload: { product_id: "${prod_id}", reporter_type: "CONSUMER", received_date: "2026-08-03", narrative: "Transient bloating that resolved without care.", outcome_codes: ["MILD_GI_UPSET"] }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { aer_id: $.data.id }
          trigger:
            - call: "POST /supplement-compliance/adverse-event-reports/${aer_id}/triage"
              payload: {}
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { status: $.data.aer_status }
          assert:
            - "HTTP 200 with aer_status == TRIAGED_NONSERIOUS, is_serious == false and submission_due_date == null"
            - "triaged_at == 2026-08-01T00:00:00Z (the default logical clock) and retention_until == 2032-08-03"
            - "Product.${prod_id}.nonserious_ae_count == 1, serious_ae_count == 0"
            - "Product.${prod_id}.compliance_risk_index == 16 (10 + 6, base below 30 so surcharge 0) and label_posture == OPEN"
      - name: corner_submitted_aer_is_terminal_and_refuses_resubmission
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.AdverseEventReport.terminal_states
          - validations[priority=14]
          - errors[ERR_AER_STATE_INVALID]
        distinguishing_aspect: "SUBMITTED_TO_FDA is terminal: a second filing must be refused rather than overwriting submission_reference or double-counting timeliness."
        test_recipe:
          setup:
            - "One serious adverse event report already filed with the agency at the default clock, therefore TIMELY."
          setup_api_calls:
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "NutraCore", product_name: "Sleep Support", net_quantity_g: 90, servings_per_container: 45 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id }
            - call: "POST /supplement-compliance/adverse-event-reports"
              payload: { product_id: "${prod_id}", reporter_type: "HEALTHCARE_PROVIDER", received_date: "2026-07-28", narrative: "Overnight admission for arrhythmia.", outcome_codes: ["HOSPITALIZATION"] }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { aer_id: $.data.id }
            - call: "POST /supplement-compliance/adverse-event-reports/${aer_id}/triage"
              payload: {}
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
            - call: "POST /supplement-compliance/adverse-event-reports/${aer_id}/submit-to-fda"
              payload: { submission_reference: "SAE-2026-0900" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
          trigger:
            - call: "POST /supplement-compliance/adverse-event-reports/${aer_id}/submit-to-fda"
              payload: { submission_reference: "SAE-2026-0901" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_AER_STATE_INVALID"
            - "AdverseEventReport.${aer_id}.submission_reference is still SAE-2026-0900 and submission_timeliness == TIMELY"
            - "Product.${prod_id}.late_notification_count == 0 and serious_ae_count == 1"
      - name: corner_recall_of_quarantined_lot_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.IngredientLot.RELEASED_to_RECALLED
          - validations[priority=14]
          - errors[ERR_LOT_STATE_INVALID]
        distinguishing_aspect: "Recall is only legal from RELEASED; firing it on a QUARANTINED lot must be refused so the supplier's released-mass ledger is never decremented below zero."
        test_recipe:
          setup:
            - "One QUALIFIED supplier with a QUARANTINED 20.00 kg lot that has never been released."
          setup_api_calls:
            - call: "POST /supplement-compliance/suppliers"
              payload: { supplier_name: "Baltic Extracts", country_code: "LT", audit_score: 88 }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { sup_id: $.data.id }
            - call: "POST /supplement-compliance/suppliers/${sup_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Zinc Picolinate", ingredient_class: "MINERAL", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 15, rdi_mg: 11 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/ingredient-lots"
              payload: { supplier_id: "${sup_id}", ingredient_id: "${ing_id}", lot_code: "BE-2026-0007", quantity_kg: 20.00 }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /supplement-compliance/ingredient-lots/${lot_id}/recall"
              payload: { recall_reason: "Operator error — wrong lot selected." }
              as: QualityAssuranceManager
              as_user_id: "u_qam_01"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id == ERR_LOT_STATE_INVALID"
            - "IngredientLot.${lot_id}.lot_status is still QUARANTINED with quarantined_quantity_kg == 20.00 and recalled_at == null"
            - "Supplier.${sup_id}.total_released_kg == 0.00 (never driven negative)"
      - name: corner_supplier_qualify_requires_audit_score_at_least_seventy
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=38]
