      - name: audit_events_are_append_only_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.AuditEvent
          - entities.AuditEvent.fields.sequence_no
          - endpoints[GET /audit-events]
        distinguishing_aspect: |
          AuditEvent is declared `common_fields: false`: §1.5 exposes only GET /audit-events
          (no POST, PATCH or DELETE and no version field), and the licence activation appends
          exactly one LICENSE_STATUS_CHANGED row whose subject_ref is the licence id and whose
          actor is LicensingAnalyst / analyst-1.
        test_recipe:
          setup:
            - "Originator 2200001 with one CA licence that has been activated (one
               LICENSE_STATUS_CHANGED AuditEvent appended by the PENDING -> ACTIVE side effects)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-70001", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id }
            - call: "POST /license-registrations/${lic_id}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
          trigger:
            - call: "GET /audit-events"
              payload: { subject_type: "LicenseRegistration", event_type: "LICENSE_STATUS_CHANGED" }
              as: ExaminationCoordinator
              as_user_id: "exam-1"
              captures: { ev: "$.data[0].event_type", role: "$.data[0].actor_role", uid: "$.data[0].actor_user_id", ref: "$.data[0].subject_ref", seq: "$.data[0].sequence_no", stype: "$.data[0].subject_type", tc: $.total_count }
          assert:
            - "${tc} == 1"
            - "${ev} == LICENSE_STATUS_CHANGED"
            - "${stype} == LicenseRegistration and ${ref} == ${lic_id}"
            - "${role} == LicensingAnalyst and ${uid} == analyst-1"
            - "${seq} == 1"
            - "the returned AuditEvent object carries no `version` key and no `updated_at` key"
            - "§1.5 declares no POST, PATCH or DELETE route on /audit-events, so the row cannot be rewritten"

      - name: create_compensation_variable_under_unknown_plan_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.CompensationVariable.parent
          - errors[ERR_RESOURCE_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: |
          CompensationVariable declares `parent: CompensationPlan` and takes its
          compensation_plan_id from the path segment, so a POST under an id that resolves to
          no plan returns 404 ERR_RESOURCE_NOT_FOUND (path-id existence, priority 5).
        test_recipe:
          setup:
