# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Mold & Environmental Remediation — Expert tier
# 9 Difficulty Rules × 2 instances = 18 instances. Every grounds[] resolves
# into SCAFFOLD.yaml §1.1–§1.7. Every setup_api_calls chain drives empty-DB ->
# the precondition using only §1.5 endpoints. Numeric asserts are pre-computed
# literals. Logical clock default is 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      # ---- Instance 1: claim estimate (forward-looking) vs settlement (final) on InsuranceClaim
      - name: claim_estimate_vs_settlement_diverge_on_planned_vs_actual_weight
        grounds:
          - calculations.claim_estimate
          - calculations.claim_settlement
          - entities.InsuranceClaim.fields.estimated_amount_cents
          - entities.InsuranceClaim.fields.settled_amount_cents
        distinguishing_aspect: |
          claim_estimate (forward-looking, planned_weight_kg, DRAFT/SUBMITTED/ACCEPTED
          manifests, no deductible) and claim_settlement (chronological actuals,
          removed_weight_kg, ACCEPTED-only manifests, deductible then cap) produce
          different cents for the same InsuranceClaim — a different-entity-domain pair
          (InsuranceClaim billing) from rule dual_variant_calc instance 2 (Sample grading).
        test_recipe:
          setup:
            - "Clock 2026-01-15T00:00:00Z."
            - "MOLD project (80 sqft, neshap not required), one ACTIVE zone."
            - "One AbatementOrder MOLD planned_weight_kg=100, started, completed with removed_weight_kg=80, backed by an ACCEPTED 100 kg MOLD manifest (fee 8000)."
            - "InsuranceClaim deductible_cents=5000, coverage_limit_cents=10000000."
            - "Posture is CLEARANCE_PENDING (order COMPLETED, no signoff yet)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "Lead Mold", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { lead_id: $.data.id }
            - call: "POST /api/projects"
              payload: { site_name: "Site A", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/containment-zones"
              payload: { project_id: "${pid}", zone_label: "Z1", required_pressure_pa: 10 }
              as: ProjectManager
              captures: { zid: $.data.id }
            - call: "POST /api/containment-zones/${zid}/pressure-logs"
              payload: { zone_id: "${zid}", reading_pa: 12, reading_at: "2026-01-14T00:00:00Z" }
              as: AbatementSupervisor
            - call: "POST /api/containment-zones/${zid}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /api/abatement-orders"
              payload: { project_id: "${pid}", zone_id: "${zid}", lead_worker_id: "${lead_id}", abatement_type: "MOLD", planned_weight_kg: 100 }
              as: AbatementSupervisor
              captures: { aid: $.data.id }
            - call: "POST /api/assignments"
              payload: { abatement_order_id: "${aid}", worker_id: "${lead_id}", shift_start_at: "2026-01-15T08:00:00Z", shift_end_at: "2026-01-15T16:00:00Z" }
              as: AbatementSupervisor
            - call: "POST /api/abatement-orders/${aid}/start"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests"
              payload: { abatement_order_id: "${aid}", project_id: "${pid}", hauler_name: "Acme", manifest_weight_kg: 100 }
              as: AbatementSupervisor
              captures: { mid: $.data.id }
            - call: "POST /api/disposal-manifests/${mid}/submit"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests/${mid}/accept"
              payload: {}
              as: ProjectManager
            - call: "POST /api/abatement-orders/${aid}/complete"
              payload: { removed_weight_kg: 80 }
              as: AbatementSupervisor
            - call: "POST /api/insurance-claims"
              payload: { project_id: "${pid}", policy_number: "POL-1", deductible_cents: 5000, coverage_limit_cents: 10000000 }
              as: ProjectManager
              captures: { clid: $.data.id }
          trigger:
            - call: "POST /api/insurance-claims/${clid}/submit"
              payload: {}
              as: ProjectManager
              captures: { est: $.data.estimated_amount_cents, settled: $.data.settled_amount_cents }
          assert:
            - "InsuranceClaim.${clid}.estimated_amount_cents == 158000"   # 100*1500 + 8000
            - "InsuranceClaim.${clid}.settled_amount_cents == 123000"     # 80*1500 + 8000 - 5000 deductible
            - "InsuranceClaim.${clid}.estimated_amount_cents != InsuranceClaim.${clid}.settled_amount_cents"

      # ---- Instance 2: sample grading provisional severity vs clearance pass/fail on a DIFFERENT entity domain
      - name: sample_grade_air_vs_clearance_outcome_diverge_on_same_concentration
        grounds:
          - calculations.sample_grade
          - calculations.clearance_outcome
          - entities.Sample.fields.result_grade
          - entities.ClearanceTest.fields.outcome
        distinguishing_aspect: |
          The same numeric air concentration (e.g. 500 spores/m3) grades the diagnostic
          Sample as CLEAN (sample_grade tier, AIR_ELEVATED=1000) yet the post-remediation
          ClearanceTest evaluates against a far stricter hazard-specific limit
          (MOLD_LIMIT=900) — two different decision algorithms on two different entity
          domains (Sample diagnostics vs ClearanceTest verification), not provisional-
          vs-final on one metric.
        test_recipe:
          setup:
            - "Clock 2026-01-15T00:00:00Z; MOLD project; assessment with one AIR sample."
            - "Lab uploads raw_count=50 vol=100 -> concentration 500 -> sample_grade CLEAN."
            - "Separately, a COMPLETED order's ClearanceTest with air_count=90 vol=100 -> clearance_concentration 900 == MOLD_LIMIT -> FAIL."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "Lead Mold", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { lead_id: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "Sampler", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { sampler_id: $.data.id }
            - call: "POST /api/projects"
              payload: { site_name: "Site B", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/assessments"
              payload: { project_id: "${pid}", assessor_worker_id: "${sampler_id}", area_label: "Wall" }
              as: LabTech
              captures: { asid: $.data.id }
            - call: "POST /api/samples"
              payload: { assessment_id: "${asid}", project_id: "${pid}", sample_type: "AIR", collected_at: "2026-01-14T00:00:00Z", volume_liters: 100 }
              as: LabTech
              captures: { sid: $.data.id }
            - call: "POST /api/samples/${sid}/result"
              payload: { raw_count: 50 }
              as: LabTech
              captures: { grade: $.data.result_grade, conc: $.data.concentration }
            - call: "POST /api/containment-zones"
              payload: { project_id: "${pid}", zone_label: "Z1", required_pressure_pa: 10 }
              as: ProjectManager
              captures: { zid: $.data.id }
            - call: "POST /api/containment-zones/${zid}/pressure-logs"
              payload: { zone_id: "${zid}", reading_pa: 12, reading_at: "2026-01-14T00:00:00Z" }
              as: AbatementSupervisor
            - call: "POST /api/containment-zones/${zid}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /api/abatement-orders"
              payload: { project_id: "${pid}", zone_id: "${zid}", lead_worker_id: "${lead_id}", abatement_type: "MOLD", planned_weight_kg: 50 }
              as: AbatementSupervisor
              captures: { aid: $.data.id }
            - call: "POST /api/assignments"
              payload: { abatement_order_id: "${aid}", worker_id: "${lead_id}", shift_start_at: "2026-01-15T08:00:00Z", shift_end_at: "2026-01-15T16:00:00Z" }
              as: AbatementSupervisor
            - call: "POST /api/abatement-orders/${aid}/start"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests"
              payload: { abatement_order_id: "${aid}", project_id: "${pid}", hauler_name: "Acme", manifest_weight_kg: 50 }
              as: AbatementSupervisor
              captures: { mid: $.data.id }
            - call: "POST /api/disposal-manifests/${mid}/submit"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests/${mid}/accept"
              payload: {}
              as: ProjectManager
            - call: "POST /api/abatement-orders/${aid}/complete"
              payload: { removed_weight_kg: 50 }
              as: AbatementSupervisor
            - call: "POST /api/clearance-tests"
              payload: { project_id: "${pid}", zone_id: "${zid}", abatement_order_id: "${aid}", sampler_worker_id: "${sampler_id}", clearance_air_count: 90, clearance_volume_liters: 100 }
              as: LabTech
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /api/clearance-tests/${cid}/analyze"
              payload: {}
              as: LabTech
              captures: { outcome: $.data.outcome, cconc: $.data.clearance_concentration }
          assert:
            - "Sample.${sid}.concentration == 500"
            - "Sample.${sid}.result_grade == CLEAN"
            - "ClearanceTest.${cid}.clearance_concentration == 900"
            - "ClearanceTest.${cid}.outcome == FAIL"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      # ---- Instance (a): tiered marginal disposal_fee with >=3 inputs + hazard surcharge selection
      - name: disposal_fee_tiered_marginal_with_asbestos_surcharge
        grounds:
          - calculations.disposal_fee
          - entities.DisposalManifest.fields.disposal_fee_cents
          - entities.AbatementOrder.fields.abatement_type
        distinguishing_aspect: |
          disposal_fee is mode (a): a >=3-input non-linear formula — weight allocated
          across three marginal per-kg tiers (RATE1/2/3) then multiplied by a surcharge
          selected on AbatementOrder.abatement_type. A 250 kg ASBESTOS manifest spans
          tiers 1+2 then * 1.5. This is a different combinatorial mode from instance 2
          (nested rounding order).
        test_recipe:
          setup:
            - "Clock 2026-01-15T00:00:00Z; ASBESTOS project sqft=80 (< 160 so neshap NOT required, keeps setup minimal)."
            - "ACTIVE zone; PLANNED ASBESTOS order; a DRAFT disposal manifest of 250 kg."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "Lead Asb", cert_type: "ASBESTOS", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { lead_id: $.data.id }
            - call: "POST /api/projects"
              payload: { site_name: "Asb Site", hazard_class: "ASBESTOS", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/containment-zones"
              payload: { project_id: "${pid}", zone_label: "Z1", required_pressure_pa: 10 }
              as: ProjectManager
              captures: { zid: $.data.id }
            - call: "POST /api/abatement-orders"
              payload: { project_id: "${pid}", zone_id: "${zid}", lead_worker_id: "${lead_id}", abatement_type: "ASBESTOS", planned_weight_kg: 250 }
              as: AbatementSupervisor
              captures: { aid: $.data.id }
          trigger:
            - call: "POST /api/disposal-manifests"
              payload: { abatement_order_id: "${aid}", project_id: "${pid}", hauler_name: "Acme", manifest_weight_kg: 250 }
              as: AbatementSupervisor
              captures: { fee: $.data.disposal_fee_cents }
          assert:
            # tier1 100*80=8000, tier2 150*120=18000, base=26000, *1.5 = 39000
            - "DisposalManifest.disposal_fee_cents == 39000"

      # ---- Instance (b): nested rounding order — fee-per-manifest then sum vs sum-weights then fee
      - name: claim_disposal_cents_per_manifest_then_sum_rounding_order
        grounds:
          - calculations.claim_estimate
          - calculations.disposal_fee
          - entities.InsuranceClaim.fields.estimated_amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The claim's disposal_cents is
          the SUM of each manifest's already-tiered disposal_fee_cents (per-manifest THEN
          sum). Two 60 kg MOLD manifests on two orders fee 4800 each = 9600; summing the
          weights first into one 120 kg manifest would cross tier 2 and yield 10400. The
          scaffold pins per-manifest-then-sum; this is a different mode from instance 1
          (tiered selection).
        test_recipe:
          setup:
            - "Clock 2026-01-15T00:00:00Z; MOLD project; ACTIVE zone."
            - "Two PLANNED MOLD orders (planned 60 kg each), each with a DRAFT 60 kg manifest."
            - "InsuranceClaim open; posture must be CLEARANCE_PENDING or VERIFIED to submit — instead use both orders IN_PROGRESS so posture is ABATING; submit requires CLEARANCE_PENDING, so complete both first."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "Lead Mold", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { lead_id: $.data.id }
            - call: "POST /api/projects"
              payload: { site_name: "Two Order Site", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/containment-zones"
              payload: { project_id: "${pid}", zone_label: "Z1", required_pressure_pa: 10 }
              as: ProjectManager
              captures: { zid: $.data.id }
            - call: "POST /api/containment-zones/${zid}/pressure-logs"
              payload: { zone_id: "${zid}", reading_pa: 12, reading_at: "2026-01-14T00:00:00Z" }
              as: AbatementSupervisor
            - call: "POST /api/containment-zones/${zid}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /api/abatement-orders"
              payload: { project_id: "${pid}", zone_id: "${zid}", lead_worker_id: "${lead_id}", abatement_type: "MOLD", planned_weight_kg: 60 }
              as: AbatementSupervisor
              captures: { aid1: $.data.id }
            - call: "POST /api/assignments"
              payload: { abatement_order_id: "${aid1}", worker_id: "${lead_id}", shift_start_at: "2026-01-15T08:00:00Z", shift_end_at: "2026-01-15T16:00:00Z" }
              as: AbatementSupervisor
            - call: "POST /api/abatement-orders/${aid1}/start"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests"
              payload: { abatement_order_id: "${aid1}", project_id: "${pid}", hauler_name: "Acme", manifest_weight_kg: 60 }
              as: AbatementSupervisor
              captures: { mid1: $.data.id }
            - call: "POST /api/disposal-manifests/${mid1}/submit"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests/${mid1}/accept"
              payload: {}
              as: ProjectManager
            - call: "POST /api/abatement-orders/${aid1}/complete"
              payload: { removed_weight_kg: 60 }
              as: AbatementSupervisor
            - call: "POST /api/abatement-orders"
              payload: { project_id: "${pid}", zone_id: "${zid}", lead_worker_id: "${lead_id}", abatement_type: "MOLD", planned_weight_kg: 60 }
              as: AbatementSupervisor
              captures: { aid2: $.data.id }
            - call: "POST /api/assignments"
              payload: { abatement_order_id: "${aid2}", worker_id: "${lead_id}", shift_start_at: "2026-01-16T08:00:00Z", shift_end_at: "2026-01-16T16:00:00Z" }
              as: AbatementSupervisor
            - call: "POST /api/abatement-orders/${aid2}/start"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests"
              payload: { abatement_order_id: "${aid2}", project_id: "${pid}", hauler_name: "Acme", manifest_weight_kg: 60 }
              as: AbatementSupervisor
              captures: { mid2: $.data.id }
            - call: "POST /api/disposal-manifests/${mid2}/submit"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests/${mid2}/accept"
              payload: {}
              as: ProjectManager
            - call: "POST /api/abatement-orders/${aid2}/complete"
              payload: { removed_weight_kg: 60 }
              as: AbatementSupervisor
            - call: "POST /api/insurance-claims"
              payload: { project_id: "${pid}", policy_number: "POL-2", deductible_cents: 0, coverage_limit_cents: 100000000 }
              as: ProjectManager
              captures: { clid: $.data.id }
          trigger:
            - call: "POST /api/insurance-claims/${clid}/submit"
              payload: {}
              as: ProjectManager
              captures: { est: $.data.estimated_amount_cents }
          assert:
            # labor 60*1500*2 = 180000 ; disposal 4800 + 4800 = 9600 ; total 189600 (NOT 180000+10400=190400)
            - "InsuranceClaim.${clid}.estimated_amount_cents == 189600"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      # ---- Instance 1: AbatementOrder cyclic revision loop (COMPLETED -> REOPENED -> IN_PROGRESS)
      - name: abatement_order_cyclic_reopen_on_clearance_fail
        grounds:
          - state_machines.AbatementOrder.COMPLETED_to_REOPENED
          - state_machines.AbatementOrder.REOPENED_to_IN_PROGRESS
          - state_machines.ClearanceTest.ANALYZED_to_FAILED
        distinguishing_aspect: |
          AbatementOrder is cyclic: a FAILED clearance drives COMPLETED -> REOPENED, then
          /start drives REOPENED -> IN_PROGRESS, re-entering the work loop — a true cycle
          on the AbatementOrder entity, distinct from instance 2's branching fork on the
          ClearanceTest entity.
        test_recipe:
          setup:
            - "Clock 2026-01-15T00:00:00Z; MOLD project; ACTIVE zone; order COMPLETED with ACCEPTED manifest."
            - "A ClearanceTest with air_count=90 vol=100 -> 900 == MOLD_LIMIT -> FAIL, which reopens the order."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "Lead Mold", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { lead_id: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "Sampler", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { sampler_id: $.data.id }
            - call: "POST /api/projects"
              payload: { site_name: "Reopen Site", hazard_class: "MOLD", structure_sqft: 80, jurisdiction_code: "US-EPA" }
              as: ProjectManager
              captures: { pid: $.data.id }
            - call: "POST /api/containment-zones"
              payload: { project_id: "${pid}", zone_label: "Z1", required_pressure_pa: 10 }
              as: ProjectManager
              captures: { zid: $.data.id }
            - call: "POST /api/containment-zones/${zid}/pressure-logs"
              payload: { zone_id: "${zid}", reading_pa: 12, reading_at: "2026-01-14T00:00:00Z" }
              as: AbatementSupervisor
            - call: "POST /api/containment-zones/${zid}/activate"
              payload: {}
              as: ProjectManager
            - call: "POST /api/abatement-orders"
              payload: { project_id: "${pid}", zone_id: "${zid}", lead_worker_id: "${lead_id}", abatement_type: "MOLD", planned_weight_kg: 50 }
              as: AbatementSupervisor
              captures: { aid: $.data.id }
            - call: "POST /api/assignments"
              payload: { abatement_order_id: "${aid}", worker_id: "${lead_id}", shift_start_at: "2026-01-15T08:00:00Z", shift_end_at: "2026-01-15T16:00:00Z" }
              as: AbatementSupervisor
            - call: "POST /api/abatement-orders/${aid}/start"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests"
              payload: { abatement_order_id: "${aid}", project_id: "${pid}", hauler_name: "Acme", manifest_weight_kg: 50 }
              as: AbatementSupervisor
              captures: { mid: $.data.id }
            - call: "POST /api/disposal-manifests/${mid}/submit"
              payload: {}
              as: AbatementSupervisor
            - call: "POST /api/disposal-manifests/${mid}/accept"
              payload: {}
              as: ProjectManager
            - call: "POST /api/abatement-orders/${aid}/complete"
              payload: { removed_weight_kg: 50 }
              as: AbatementSupervisor
            - call: "POST /api/clearance-tests"
              payload: { project_id: "${pid}", zone_id: "${zid}", abatement_order_id: "${aid}", sampler_worker_id: "${sampler_id}", clearance_air_count: 90, clearance_volume_liters: 100 }
              as: LabTech
              captures: { cid: $.data.id }
            - call: "POST /api/clearance-tests/${cid}/analyze"
              payload: {}
              as: LabTech
          trigger:
            - call: "POST /api/abatement-orders/${aid}/start"
              payload: {}
              as: AbatementSupervisor
              captures: { ostatus: $.data.status }
          assert:
            - "AbatementOrder.${aid}.status == IN_PROGRESS"   # REOPENED -> IN_PROGRESS (cycle re-entered)

      # ---- Instance 2: ClearanceTest branching fork PASS vs FAIL with divergent side effects
      - name: clearance_test_branching_pass_vs_fail_divergent_cascades
        grounds:
          - state_machines.ClearanceTest.ANALYZED_to_PASSED
          - state_machines.ClearanceTest.ANALYZED_to_FAILED
          - state_machines.AbatementOrder.COMPLETED_to_REOPENED
        distinguishing_aspect: |
          ClearanceTest forks at ANALYZED into PASSED (no order mutation) or FAILED
          (reopens order, voids manifest, reprices claim) — a branching fork with divergent
          side-effect sets on the ClearanceTest entity, a different entity from instance 1's
          cyclic AbatementOrder.
        test_recipe:
          setup:
            - "Clock 2026-01-15T00:00:00Z; MOLD project; ACTIVE zone; order COMPLETED with ACCEPTED manifest."
            - "A DRAFT ClearanceTest with air_count=10 vol=100 -> 100 < MOLD_LIMIT 900 -> PASS branch."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /api/workers"
              payload: { full_name: "Lead Mold", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
              captures: { lead_id: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "Sampler", cert_type: "MOLD", cert_expires_at: "2027-01-01T00:00:00Z", ppe_fit_test_at: "2025-12-15T00:00:00Z" }
              as: ProjectManager
