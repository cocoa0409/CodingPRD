# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2196 — Catastrophe Response & Claim Surge Staffing
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# Clock startup default is exactly 2026-08-01T00:00:00Z (§1.5 /_clock/set_current_utc).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: deployment_cost_provisional_vs_final_settled_divergence
        grounds:
          - calculations.deployment_cost
          - state_machines.Deployment.REQUESTED_to_CONFIRMED
          - state_machines.Deployment.CONFIRMED_to_DEMOBILIZED
          - entities.Deployment.fields.provisional_cost
          - entities.Deployment.fields.final_settled_cost
          - entities.Deployment.fields.surge_premium_tier
        distinguishing_aspect: |
          Cost accounting on the Deployment entity domain: for one identical stored Deployment row the
          PROVISIONAL variant bills the full requested window with unconditional per-diem (18709.00) while
          the FINAL_SETTLED variant truncates nights at demobilized_at_utc and zeroes per-diem for an
          INDEPENDENT adjuster housed in a company block (8559.50), so the two variants differ by 10149.50.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. One CatastropheEvent 'CAT-2026-114' (HURRICANE, FL) in DECLARED with posture OPEN (no claims, no snapshots, no moratorium -> strain 0)."
            - "One INDEPENDENT Adjuster licensed in FL, daily_rate 900, per_diem_rate 150, credential_status VALID, deployment_status AVAILABLE."
            - "One HousingBlock on the event, 40 rooms at nightly_rate 200, block 2026-09-01 -> 2026-09-15, status ACTIVE."
            - "One FIELD Deployment on that event and block, window 2026-09-01T00:00:00Z -> 2026-09-11T00:00:00Z (10 nights), rooms_reserved 2, status REQUESTED."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-114", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-08-01T00:00:00.000Z", exposure_count: 1000, avg_insured_value: 250000, expected_severity_index: 0.0400 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /adjusters"
              payload: { full_name: "Ivy Independent", employment_type: "INDEPENDENT", home_state: "GA", licensed_states: ["FL", "GA"], license_expiry_utc: "2027-06-30T00:00:00.000Z", max_open_claims: 10, daily_rate: 900, per_diem_rate: 150, desk_certified: false, aerial_certified: false }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { adj: $.data.id }
            - call: "POST /housing-blocks"
              payload: { event_id: "${ev}", hotel_name: "Gulf Inn", city: "Tampa", rooms_total: 40, nightly_rate: 200, block_start_date: "2026-09-01T00:00:00.000Z", block_end_date: "2026-09-15T00:00:00.000Z" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { hb: $.data.id }
            - call: "POST /housing-blocks/${hb}/open"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /deployments"
              payload: { event_id: "${ev}", role_type: "FIELD", window_start_utc: "2026-09-01T00:00:00.000Z", window_end_utc: "2026-09-11T00:00:00.000Z", adjuster_id: "${adj}", housing_block_id: "${hb}", rooms_reserved: 2 }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { dep: $.data.id }
          trigger:
            - call: "POST /deployments/${dep}/confirm"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { prov: $.data.provisional_cost }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00.000Z" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /deployments/${dep}/demobilize"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
          assert:
            - "Deployment.${dep}.provisional_cost == 18709.00"
            - "Deployment.${dep}.final_settled_cost == 8559.50"
            - "Deployment.${dep}.provisional_cost != Deployment.${dep}.final_settled_cost"
            - "Deployment.${dep}.surge_premium_tier == TIER_MID"
            - "Deployment.${dep}.demobilized_at_utc == 2026-09-06T00:00:00.000Z"
            - "CatastropheEvent.${ev}.deployment_settled_cost == 8559.50"

      - name: event_loss_estimate_exposure_based_vs_incurred_development_divergence
        grounds:
          - calculations.event_loss_estimate
          - entities.LossEstimateSnapshot.fields.gross_estimate
          - entities.LossEstimateSnapshot.fields.ibnr_component
          - entities.LossEstimateSnapshot.fields.reported_component
          - entities.CatastropheEvent.fields.gross_loss_estimate
          - concurrency_rules[loss-estimate-stale-event]
        distinguishing_aspect: |
          Loss estimation on the CatastropheEvent entity domain (a different subject from deployment cost
          accounting): with reported_component pinned at 65250.00 and one reported claim, EXPOSURE_BASED
          reads footprint exposure to 14000000.00 while INCURRED_DEVELOPMENT develops observed severity to
          913500.00, and the event's gross_loss_estimate resolves to the created_at-ASC tie-break winner.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z throughout, so both snapshots share computed_at_utc and the event's gross_loss_estimate tie-break (created_at ASC) decides."
            - "One CatastropheEvent 'CAT-2026-115' in DECLARED: HURRICANE, FL, exposure_count 1000, avg_insured_value 250000, expected_severity_index 0.0400."
            - "One Claim on the event, TRIAGED at tier STANDARD (severity_score 35.30), which appended one INITIAL_CASE ReserveEntry of 65250.00, so event.incurred_total == 65250.00 and exactly one distinct claim_id carries an INITIAL_CASE entry."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-115", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-08-01T00:00:00.000Z", exposure_count: 1000, avg_insured_value: 250000, expected_severity_index: 0.0400 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-7001", loss_state: "FL", loss_date_utc: "2026-07-30T00:00:00.000Z", reported_loss_amount: 120000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 400000, deductible_amount: 5000, estimated_damage_amount: 150000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
            - call: "GET /catastrophe-events/${ev}"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev_v1: $.data.version }
          trigger:
            - call: "POST /loss-estimates"
              payload: { event_id: "${ev}", method: "EXPOSURE_BASED", expected_event_version: "${ev_v1}" }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { snap_exp: $.data.id }
            - call: "GET /catastrophe-events/${ev}"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev_v2: $.data.version }
            - call: "POST /loss-estimates"
              payload: { event_id: "${ev}", method: "INCURRED_DEVELOPMENT", expected_event_version: "${ev_v2}" }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { snap_inc: $.data.id }
          assert:
            - "Claim.${cl}.severity_score == 35.30"
            - "Claim.${cl}.triage_tier == STANDARD"
            - "Claim.${cl}.case_reserve == 65250.00"
            - "LossEstimateSnapshot.${snap_exp}.reported_component == 65250.00"
            - "LossEstimateSnapshot.${snap_exp}.ibnr_component == 13934750.00"
            - "LossEstimateSnapshot.${snap_exp}.gross_estimate == 14000000.00"
            - "LossEstimateSnapshot.${snap_inc}.reported_component == 65250.00"
            - "LossEstimateSnapshot.${snap_inc}.ibnr_component == 848250.00"
            - "LossEstimateSnapshot.${snap_inc}.gross_estimate == 913500.00"
            - "LossEstimateSnapshot.${snap_exp}.gross_estimate != LossEstimateSnapshot.${snap_inc}.gross_estimate"
            - "LossEstimateSnapshot.${snap_exp}.input_reserve_sequence_high_water == 1"
            - "LossEstimateSnapshot.${snap_exp}.stale == false"
            - "CatastropheEvent.${ev}.gross_loss_estimate == 14000000.00"

  - rule_id: combinatorial_formula
    instances:
      - name: advance_cap_round_each_coverage_line_then_sum_mode_b
        grounds:
          - calculations.advance_payment_amount
          - entities.Claim.fields.advance_cap
          - entities.Claim.fields.coverage_lines
          - entities.AdvancePayment.fields.amount
          - validations[priority=39]
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: the four coverage lines round to
          9000.01 + 5000.01 + 5000.01 + 3000.01 = 22000.04 under the pinned round-per-line-then-sum order,
          whereas summing the raw line values (22000.0325) and rounding once yields 22000.03 — a one-cent
          divergence that pins which order the implementation used.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One CatastropheEvent 'CAT-2026-201' in DECLARED: WILDFIRE, CA, exposure_count 400, avg_insured_value 300000, expected_severity_index 0.5000."
            - "One Claim on that event with four coverage lines whose per-line advance products each carry a third decimal digit (DWELLING 30000.03, CONTENTS 20000.03, ALE 10000.02, OTHER_STRUCTURES 15000.03 eligible)."
            - "The Claim is TRIAGED: severity_score clamps to 100.00 so triage_tier is CAT_SEVERE and TIER_MULTIPLIER is exactly 1.00, leaving the line-rounding residue visible in advance_cap."
            - "No ADVANCE_PAYMENT_MANDATE bulletin exists, so mandate_floor is 0.00 and advance_cap == the tiered value."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-201", peril_type: "WILDFIRE", jurisdiction_state: "CA", event_start_utc: "2026-07-28T00:00:00.000Z", exposure_count: 400, avg_insured_value: 300000, expected_severity_index: 0.5000 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-8010", loss_state: "CA", loss_date_utc: "2026-07-29T00:00:00.000Z", reported_loss_amount: 95000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 40000, deductible_amount: 0, estimated_damage_amount: 30000.03 }, { coverage_code: "CONTENTS", limit_amount: 25000, deductible_amount: 0, estimated_damage_amount: 20000.03 }, { coverage_code: "ALE", limit_amount: 12000, deductible_amount: 0, estimated_damage_amount: 10000.02 }, { coverage_code: "OTHER_STRUCTURES", limit_amount: 18000, deductible_amount: 0, estimated_damage_amount: 15000.03 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
          trigger:
            - call: "POST /advance-payments"
              payload: { claim_id: "${cl}", requested_amount: 30000, basis: "STRUCTURE_PARTIAL" }
              as: ClaimsExaminer
              as_user_id: "ce_9"
              captures: { adv: $.data.id }
          assert:
            - "Claim.${cl}.severity_score == 100.00"
            - "Claim.${cl}.triage_tier == CAT_SEVERE"
            - "Claim.${cl}.advance_cap == 22000.04"
            - "Claim.${cl}.advance_cap != 22000.03"
            - "AdvancePayment.${adv}.amount == 22000.04"
            - "AdvancePayment.${adv}.status == ISSUED"
            - "Claim.${cl}.advance_paid_total == 22000.04"
            - "Claim.${cl}.case_reserve == 58749.96"
            - "Claim.${cl}.paid_amount == 22000.04"
            - "CatastropheEvent.${ev}.incurred_total == 80750.00"

      - name: deployment_surge_premium_tier_keyed_on_subtotal_not_total_mode_c
        grounds:
          - calculations.deployment_cost
          - entities.Deployment.fields.surge_premium_tier
          - entities.Deployment.fields.provisional_cost
          - state_machines.Deployment.REQUESTED_to_CONFIRMED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: subtotal_pre_premium lands at
          exactly 19500.00 so the tier is TIER_MID at 6%, and the resulting total 20670.00 crosses
          PREMIUM_HIGH_FLOOR 20000.00 — a fixed-point re-derivation from the total would have stamped
          TIER_HIGH at 11% and 21645.00, so the stamped 20670.00/TIER_MID falsifies iteration.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One CatastropheEvent 'CAT-2026-202' in DECLARED: HAIL, TX, posture OPEN."
            - "One STAFF Adjuster licensed in TX, daily_rate 1500, per_diem_rate 200, credential_status VALID, deployment_status AVAILABLE."
            - "One ACTIVE HousingBlock on the event, 5 rooms at nightly_rate 250, block 2026-09-01 -> 2026-09-15."
            - "One FIELD Deployment REQUESTED on that event and block, window 2026-09-01 -> 2026-09-11 (10 nights), rooms_reserved 1."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-202", peril_type: "HAIL", jurisdiction_state: "TX", event_start_utc: "2026-07-25T00:00:00.000Z", exposure_count: 500, avg_insured_value: 150000, expected_severity_index: 0.1000 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /adjusters"
              payload: { full_name: "Stan Staff", employment_type: "STAFF", home_state: "TX", licensed_states: ["TX"], license_expiry_utc: "2027-12-31T00:00:00.000Z", max_open_claims: 20, daily_rate: 1500, per_diem_rate: 200, desk_certified: false, aerial_certified: false }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { adj: $.data.id }
            - call: "POST /housing-blocks"
              payload: { event_id: "${ev}", hotel_name: "Prairie Lodge", city: "Lubbock", rooms_total: 5, nightly_rate: 250, block_start_date: "2026-09-01T00:00:00.000Z", block_end_date: "2026-09-15T00:00:00.000Z" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { hb: $.data.id }
            - call: "POST /housing-blocks/${hb}/open"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
            - call: "POST /deployments"
              payload: { event_id: "${ev}", role_type: "FIELD", window_start_utc: "2026-09-01T00:00:00.000Z", window_end_utc: "2026-09-11T00:00:00.000Z", adjuster_id: "${adj}", housing_block_id: "${hb}", rooms_reserved: 1 }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { dep: $.data.id }
          trigger:
            - call: "POST /deployments/${dep}/confirm"
              payload: {}
              as: DeploymentCoordinator
              as_user_id: "dc_1"
          assert:
            - "Deployment.${dep}.provisional_cost == 20670.00"
            - "Deployment.${dep}.surge_premium_tier == TIER_MID"
            - "Deployment.${dep}.provisional_cost != 21645.00"
            - "Deployment.${dep}.status == CONFIRMED"
            - "HousingBlock.${hb}.rooms_occupied == 1"
            - "HousingBlock.${hb}.rooms_available == 4"

      - name: claim_severity_five_input_nonlinear_conditional_branches_mode_a
        grounds:
          - calculations.claim_triage_severity_score
          - calculations.inspection_mode_resolution
          - calculations.initial_case_reserve
          - calculations.claim_deadline_resolution
          - entities.Claim.fields.severity_score
          - entities.Claim.fields.triage_tier
        distinguishing_aspect: |
          Mode (a) formula with five interacting inputs and nested min/max plus conditional branches on
          peril_type and access_status: exposure_ratio 0.30 -> base 30.00, EARTHQUAKE weight 1.30,
          RESTRICTED access +6.00, ALE bonus +10.00 and severity-index term +5.00 combine non-linearly to
          exactly 60.00 (COMPLEX), a value no single-input tiered rate could produce.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default, so reported_at_utc == 2026-08-01T00:00:00.000Z."
            - "One CatastropheEvent 'CAT-2026-203' in DECLARED: EARTHQUAKE, CA, expected_severity_index 0.2500."
            - "One Claim on that event with three coverage lines (limits 200000/70000/30000 -> total_limit 300000), reported_loss_amount 90000 and access_status RESTRICTED."
            - "No CLAIM_DEADLINE_EXTENSION bulletin exists on the event, so extension_days is 0."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-203", peril_type: "EARTHQUAKE", jurisdiction_state: "CA", event_start_utc: "2026-07-31T00:00:00.000Z", exposure_count: 800, avg_insured_value: 400000, expected_severity_index: 0.2500 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-8020", loss_state: "CA", loss_date_utc: "2026-07-31T00:00:00.000Z", reported_loss_amount: 90000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 200000, deductible_amount: 2000, estimated_damage_amount: 90000 }, { coverage_code: "CONTENTS", limit_amount: 70000, deductible_amount: 1000, estimated_damage_amount: 20000 }, { coverage_code: "ALE", limit_amount: 30000, deductible_amount: 0, estimated_damage_amount: 15000 }], event_id: "${ev}", access_status: "RESTRICTED" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
          assert:
            - "Claim.${cl}.severity_score == 60.00"
            - "Claim.${cl}.triage_tier == COMPLEX"
            - "Claim.${cl}.inspection_mode == FIELD"
            - "Claim.${cl}.case_reserve == 79300.00"
            - "Claim.${cl}.deadline_utc == 2026-08-16T00:00:00.000Z"
            - "Claim.${cl}.handling_status == TRIAGED"
            - "Claim.${cl}.payment_status == NONE"
            - "CatastropheEvent.${ev}.case_reserve_total == 79300.00"

  - rule_id: non_linear_state_machine
    instances:
      - name: claim_handling_and_payment_axes_evolve_independently
        grounds:
          - state_machines.Claim.INTAKE_to_TRIAGED
          - state_machines.Claim.NONE_to_ADVANCE_ISSUED
          - state_machines.Claim.TRIAGED_to_INSPECTION_PENDING
          - entities.Claim.fields.handling_status
          - entities.Claim.fields.payment_status
        distinguishing_aspect: |
          Parallel state dimensions on the Claim row: payment_status advances NONE -> ADVANCE_ISSUED while
          handling_status is pinned at TRIAGED, and handling_status then advances TRIAGED ->
          INSPECTION_PENDING while payment_status is pinned at ADVANCE_ISSUED — neither axis gates the other.
        test_recipe:
          setup:
            - "Clock at the 2026-08-01T00:00:00Z startup default."
            - "One CatastropheEvent 'CAT-2026-301' in DECLARED: WINTER_STORM, NY, expected_severity_index 0.1000."
            - "One DESK-certified STAFF Adjuster licensed in NY, max_open_claims 5, deployment_status AVAILABLE, credential_status VALID."
            - "One Claim on the event, TRIAGED at FAST_TRACK (severity_score 9.20) with inspection_mode DESK and payment_status NONE."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-301", peril_type: "WINTER_STORM", jurisdiction_state: "NY", event_start_utc: "2026-07-30T00:00:00.000Z", exposure_count: 200, avg_insured_value: 220000, expected_severity_index: 0.1000 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /adjusters"
              payload: { full_name: "Dana Desk", employment_type: "STAFF", home_state: "NY", licensed_states: ["NY"], license_expiry_utc: "2027-11-30T00:00:00.000Z", max_open_claims: 5, daily_rate: 700, per_diem_rate: 0, desk_certified: true, aerial_certified: false }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { adj: $.data.id }
            - call: "POST /claims"
              payload: { policy_number: "POL-9001", loss_state: "NY", loss_date_utc: "2026-07-30T00:00:00.000Z", reported_loss_amount: 8000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 100000, deductible_amount: 500, estimated_damage_amount: 9000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
          trigger:
            - call: "POST /advance-payments"
              payload: { claim_id: "${cl}", requested_amount: 500, basis: "STRUCTURE_PARTIAL" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { adv: $.data.id }
            - call: "POST /inspection-assignments"
              payload: { claim_id: "${cl}", mode: "DESK", window_start_utc: "2026-08-02T00:00:00.000Z", window_end_utc: "2026-08-03T00:00:00.000Z", adjuster_id: "${adj}" }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
              captures: { ins: $.data.id }
          assert:
            - "Claim.${cl}.severity_score == 9.20"
            - "Claim.${cl}.triage_tier == FAST_TRACK"
            - "Claim.${cl}.inspection_mode == DESK"
            - "Claim.${cl}.advance_cap == 1020.00"
            - "AdvancePayment.${adv}.amount == 500.00"
            - "Claim.${cl}.payment_status == ADVANCE_ISSUED"
            - "Claim.${cl}.handling_status == INSPECTION_PENDING"
            - "Claim.${cl}.advance_paid_total == 500.00"
            - "Claim.${cl}.case_reserve == 1625.00"
            - "Claim.${cl}.paid_amount == 500.00"
            - "InspectionAssignment.${ins}.status == SCHEDULED"
            - "InspectionAssignment.${ins}.selection_reason == EXPLICIT_ADJUSTER"

