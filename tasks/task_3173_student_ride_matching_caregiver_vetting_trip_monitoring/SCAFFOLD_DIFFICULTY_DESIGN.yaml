  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cancellation_and_restore_preserve_the_district_scheduled_load
        grounds:
          - calculations.district_trips_scheduled_total
          - state_machines.Trip.SCHEDULED_to_CANCELLED
          - state_machines.Trip.CANCELLED_to_SCHEDULED
          - entities.District.fields.trips_scheduled_total
        distinguishing_aspect: "A count-shaped conserved quantity: cancelling a trip borrows exactly one unit from district.trips_scheduled_total and restoring it returns exactly one, so the district's live scheduled load after the compensating pair is identical to its value before, while the district's Trip row count has grown."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z, moved to 2026-09-10T06:00:00Z."
            - "One district, one rider, one contract and one scheduled trip on 2026-09-11, so the district's live scheduled load reads exactly 1."
          setup_api_calls:
            - *A_clock
            - *A_dist
            - &L_rider
              call: "POST /student-rides/riders"
              payload: { district_id: "${d_id}", full_name: "Quinn Hale", date_of_birth: "2013-09-19", program_type: "GENERAL", spi_level: 1, home_address: "23 Myrtle St", school_name: "Lincoln Elementary", emergency_contact_phone: "5550118", authorized_adults: [], notify_on_pickup: true, notify_on_dropoff: true }
              as: DistrictAdmin
              captures: { r_id13: $.data.id }
            - *A_contract
            - *A_contract_act
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T06:00:00Z" }
              as: PlatformAdmin
            - &L_req
              call: "POST /student-rides/ride-requests"
              payload: { expected_district_version: "${d_v}", district_id: "${d_id}", rider_id: "${r_id13}", trip_type: "AM_SCHOOL", required_specialty: "NONE", window_start_at: "2026-09-11T07:30:00Z", window_end_at: "2026-09-11T07:50:00Z", max_window_minutes: 30, min_lead_time_hours: 12, pickup_address: "23 Myrtle St", dropoff_address: "Lincoln Elementary", planned_miles: 3.0, is_recurring: false }
              as: DistrictAdmin
              captures: { rq_13: $.data.id }
            - call: "POST /student-rides/ride-requests/${rq_13}/submit"
              payload: {}
              as: DistrictAdmin
            - call: "POST /student-rides/ride-requests/${rq_13}/approve"
              payload: {}
              as: DistrictAdmin
            - call: "POST /student-rides/ride-requests/${rq_13}/schedule"
              payload: { scheduled_date: "2026-09-11" }
              as: DistrictAdmin
              captures: { tr_13: "$.data[0].id" }
            - call: "GET /student-rides/districts/${d_id}"
              payload: {}
              as: DistrictAdmin
              captures: { load_before: $.data.trips_scheduled_total }
          trigger:
            - call: "POST /student-rides/trips/${tr_13}/cancel"
              payload: { reason: "district closed the campus" }
              as: DistrictAdmin
            - call: "GET /student-rides/districts/${d_id}"
              payload: {}
              as: DistrictAdmin
              captures: { load_after_cancel: $.data.trips_scheduled_total }
            - call: "POST /student-rides/trips/${tr_13}/restore"
              payload: {}
              as: DistrictAdmin
            - call: "GET /student-rides/districts/${d_id}"
              payload: {}
              as: DistrictAdmin
              captures: { load_after_restore: $.data.trips_scheduled_total }
          assert:
            - "District.${d_id}.trips_scheduled_total reads 1 before the pair"
            - "the value reads 0 immediately after the cancellation"
            - "the value reads 1 again after the restore, so the conserved quantity has no drift"
            - "the district still holds exactly one Trip row, and that row reads trip_state SCHEDULED with driver_id null"
            - "the restoration also clears accepted_at, so the restored trip is indistinguishable from a freshly scheduled one in the load formula"

      - name: deactivation_and_reactivation_preserve_the_fleet_seat_pool
        grounds:
          - calculations.driver_approved_seat_count
          - state_machines.Driver.ACTIVE_to_INACTIVE
          - state_machines.Driver.SUSPENDED_to_ACTIVE
          - entities.Driver.fields.approved_seat_count
        distinguishing_aspect: "A capacity-shaped conserved quantity on a different resource than the count above: deactivating a vetted driver hands back the whole approved seat pool for that driver and reactivating returns exactly the same number, so the platform-wide seat total is invariant across the compensating pair even though the driver's own status changed twice."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z."
            - "A driver vetted to approved_seat_count 6 on a declared seat_capacity of 6, holding no non-terminal trips."
          setup_api_calls:
            - *A_clock
            - *A_dist
            - *A_driver
            - *A_bc1
            - *A_bc1c
            - *A_ins1
            - *A_ins1a
            - *A_bc2
            - *A_bc2c
            - *A_ins2
            - *A_ins2a
            - call: "GET /student-rides/drivers/${drv_id}"
              payload: {}
              as: DistrictAdmin
              captures: { seats_before: $.data.approved_seat_count, drv_stat_before: $.data.status }
          trigger:
            - call: "POST /student-rides/drivers/${drv_id}/deactivate"
              payload: {}
              as: DistrictAdmin
            - call: "GET /student-rides/drivers/${drv_id}"
              payload: {}
              as: DistrictAdmin
              captures: { seats_mid: $.data.approved_seat_count, drv_stat_mid: $.data.status }
            - call: "POST /student-rides/drivers/${drv_id}/reactivate"
              payload: {}
              as: DistrictAdmin
            - call: "GET /student-rides/drivers/${drv_id}"
              payload: {}
              as: DistrictAdmin
              captures: { seats_after: $.data.approved_seat_count, drv_stat_after: $.data.status }
          assert:
            - "Driver.${drv_id}.approved_seat_count reads 6 before the pair and Driver.${drv_id}.status reads ACTIVE"
            - "the value reads 0 while the driver is INACTIVE, so the forward action did debit the pool"
            - "the value reads 6 again after reactivation, so the fleet seat pool has no drift"
            - "the driver's compliance_expires_at is unchanged by the pair, because neither action touches the clearance dates"
            - "the conservation is not additive across a FAILED vehicle inspection, which is why the repaid pair here is deactivate followed by reactivate and never reject followed by attest"
