            - "PaymentPosting.${p_big}.installments_satisfied_count == 24 and overpayment_cents == 6124 and obligation_balance_after_cents == 0"
            - "InstallmentLoan.${loan}.paid_principal_cents == 89900, paid_premium_cents == 23976, paid_installment_count == 24, obligation_balance_cents == 0"
            - "InstallmentLoan.${loan}.status == ACTIVE with closure_reason == null (paying the schedule out does not close the loan by itself)"
            - "InstallmentLoan.${loan}.delinquency_state == CURRENT and days_past_due == 0"
            - "GET /loans/${loan}/installments?status=PAID returns total_count == 24"
            - "Installment(loan_id=${loan}, installment_number=24).paid_amount_cents == 4741 and status == PAID"
            - "the second posting returns HTTP 422 with error_id ERR_NOTHING_TO_ALLOCATE"
