# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3107_destination_medicine_referral_intake_multi_specialty_visit
# 2 instances per Difficulty Rule, grounded in SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: itinerary_estimate_provisional_vs_final_rounding_order
        grounds:
          - calculations.itinerary_total_estimate
          - entities.Itinerary.fields.provisional_total_cents
          - entities.Itinerary.fields.final_total_cents
        distinguishing_aspect: "Same three confirmed-priced visits yield provisional_total_cents == 285015 (per-visit round then sum) but final_total_cents == 285014 (sum then round) — a 1-cent divergence pinned to the mandated rounding order on the Itinerary entity."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One domestic US (non-MN) patient referral driven to FINANCIAL_CLEARED with a 2-specialty care team; three OPEN slots exist across two services on the same date."
            - "Deposit waived is impossible (patient is domestic but we exercise deposit path): instead the FinancialCounselor posts a DEPOSIT of 60000 (the tier deposit on the 300000 approval estimate) so clearance flips CLEARED."
          setup_api_calls:
            - &clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &svc_card
              call: "POST /specialty-services"
              payload: { code: "CARD", name: "Cardiology", destination_daily_capacity: 2, service_window_start_min: 480, service_window_end_min: 1020, supports_imaging: true, supports_remote_products: true }
              as: PlatformAdmin
              captures: { svc_card_id: $.data.id }
            - &svc_neur
              call: "POST /specialty-services"
              payload: { code: "NEUR", name: "Neurology", destination_daily_capacity: 2, service_window_start_min: 480, service_window_end_min: 1020, supports_imaging: false, supports_remote_products: true }
              as: PlatformAdmin
              captures: { svc_neur_id: $.data.id }
            - &slot_c1
              call: "POST /specialty-services/${svc_card_id}/slots"
              payload: { slot_date: "2026-09-10", start_min: 540, end_min: 600 }
              as: PlatformAdmin
              captures: { slot_c1: $.data.id }
            - &slot_c2
              call: "POST /specialty-services/${svc_card_id}/slots"
              payload: { slot_date: "2026-09-10", start_min: 600, end_min: 660 }
              as: PlatformAdmin
              captures: { slot_c2: $.data.id }
            - &slot_n1
              call: "POST /specialty-services/${svc_neur_id}/slots"
              payload: { slot_date: "2026-09-10", start_min: 540, end_min: 600 }
              as: PlatformAdmin
              captures: { slot_n1: $.data.id }
            - &ref_dom
              call: "POST /referrals"
              payload: { patient: { full_name: "Dana Domestic", date_of_birth: "1970-05-01", residence_country: "US", residence_state: "WI", preferred_language: "en" }, referring_physician_name: "Dr. Riley", referring_physician_contact: "riley@example.org", reason: "syncope workup" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { ref_id: $.data.id }
            - &rec_1
              call: "POST /referrals/${ref_id}/medical-records"
              payload: { record_type: "CLINICAL_NOTES", source_facility: "La Crosse General" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { rec_id: $.data.id }
            - &rec_verify
              call: "POST /referrals/${ref_id}/medical-records/${rec_id}/verify"
              payload: {}
              as: CaseReviewer
              as_user_id: "cr-boris"
            - &ref_submit
              call: "POST /referrals/${ref_id}/submit-review"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
            - &case_create
              call: "POST /visit-cases"
              payload: { referral_id: "${ref_id}", case_type: "DESTINATION", care_team_specialty_ids: ["${svc_card_id}", "${svc_neur_id}"] }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { case_id: $.data.id, case_v0: $.data.version }
            - &case_approve
              call: "POST /visit-cases/${case_id}/reviews"
              payload: { outcome: "APPROVE", notes: "appropriate for destination eval" }
              as: CaseReviewer
              as_user_id: "cr-boris"
            - &case_v_after_approve
              call: "GET /visit-cases/${case_id}"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { case_v1: $.data.version }
            - &deposit
              call: "POST /visit-cases/${case_id}/billing-transactions"
              payload: { txn_type: "DEPOSIT", amount_cents: 60000 }
              as: FinancialCounselor
              as_user_id: "fc-cora"
            - &case_v_after_deposit
              call: "GET /visit-cases/${case_id}"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { case_v2: $.data.version }
            - &hold_1
              call: "POST /visit-cases/${case_id}/slot-holds"
              payload: { appointment_slot_id: "${slot_c1}", visit_type: "CONSULT", listed_price_cents: 100003, sequencing_priority: 1, expected_case_version: "${case_v2}" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { visit_1: $.data.id }
            - &case_v_after_hold1
              call: "GET /visit-cases/${case_id}"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { case_v3: $.data.version }
            - &hold_2
              call: "POST /visit-cases/${case_id}/slot-holds"
              payload: { appointment_slot_id: "${slot_c2}", visit_type: "IMAGING", listed_price_cents: 100005, sequencing_priority: 2, expected_case_version: "${case_v3}" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { visit_2: $.data.id }
            - &case_v_after_hold2
              call: "GET /visit-cases/${case_id}"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { case_v4: $.data.version }
            - &hold_3
              call: "POST /visit-cases/${case_id}/slot-holds"
              payload: { appointment_slot_id: "${slot_n1}", visit_type: "CONSULT", listed_price_cents: 100007, sequencing_priority: 3, expected_case_version: "${case_v4}" }
              as: IntakeCoordinator
              as_user_id: "ic-anna"
              captures: { visit_3: $.data.id }
          trigger:
            - call: "GET /visit-cases/${case_id}/itinerary"
              payload: {}
              as: IntakeCoordinator
              as_user_id: "ic-anna"
          assert:
            - "Itinerary.provisional_total_cents == 285015 (per-visit round_half_up of 95002.85 -> 95003, 95004.75 -> 95005, 95006.65 -> 95007, summed)"
            - "Itinerary.final_total_cents == 285014 (285014.25 rounded once)"
            - "Itinerary.provisional_total_cents - Itinerary.final_total_cents == 1"

      - name: deposit_estimate_tier_floor_vs_final_variant_dependency
        grounds:
          - calculations.deposit_estimate
          - entities.FinancialClearance.fields.required_deposit_cents
          - entities.EstimateLetter.fields.deposit_amount_cents
        distinguishing_aspect: "The deposit calculation is a second dual-variant surface on a different entity domain (FinancialClearance/EstimateLetter, not Itinerary): at approval time the tier floor seeds the deposit from the care-team base estimate (2 specialties -> 300000 -> 60000), while a later estimate letter re-derives the deposit from the FINAL itinerary variant (285014 -> 57003), so the two deposit figures diverge on the same case."
        test_recipe:
          setup:
            - "Same happy-path chain as itinerary_estimate_provisional_vs_final_rounding_order through the three holds; clearance CLEARED after the 60000 deposit."
          setup_api_calls:
            - *clock
            - *svc_card
            - *svc_neur
            - *slot_c1
            - *slot_c2
            - *slot_n1
            - *ref_dom
            - *rec_1
            - *rec_verify
            - *ref_submit
            - *case_create
            - *case_approve
            - *case_v_after_approve
            - *deposit
            - *case_v_after_deposit
            - *hold_1
            - *case_v_after_hold1
            - *hold_2
            - *case_v_after_hold2
            - *hold_3
          trigger:
            - call: "POST /visit-cases/${case_id}/estimate-letters"
              payload: {}
              as: FinancialCounselor
              as_user_id: "fc-cora"
              captures: { letter_id: $.data.id }
          assert:
            - "VisitCase.${case_id}.deposit_amount_cents == 60000 (approval-time tier floor: 2 specialties * 150000 = 300000 -> 20% tier)"
            - "EstimateLetter.${letter_id}.final_estimate_cents == 285014"
            - "EstimateLetter.${letter_id}.deposit_amount_cents == 57003 (round_half_up(285014 * 0.20))"
            - "the two deposit figures differ by 2997, evidencing the tier-floor seed vs final-variant re-derivation"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: itinerary_estimate_tiered_discount_international_multiplier
        grounds:
