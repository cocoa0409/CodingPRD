      - name: store_manager_mismatch_forbidden
        claim_type: cross_entity_validation
        grounds: ["validations[priority=8]", "errors[ERR_STORE_MANAGER_MISMATCH]", roles]
        distinguishing_aspect: "entity_backed identity: RetailerManager X-User-ID must equal the agreement's store_id — store B's manager cannot confirm store A's visit."
        test_recipe:
          setup: ["two stores with ACTIVE agreements; visit on agreement A with counts submitted"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: JobberAdmin }
            - { call: "POST /programs", payload: { name: "OwnCo" }, as: JobberAdmin, captures: { prog: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "Own A", store_code: "OA1", total_facings: 50 }, as: JobberAdmin, captures: { storeA: "$.data.id" } }
            - { call: "POST /stores", payload: { name: "Own B", store_code: "OB1", total_facings: 50 }, as: JobberAdmin, captures: { storeB: "$.data.id" } }
            - { call: "POST /agreements", payload: { program_id: "${prog}", store_id: "${storeA}", base_margin_pct: 0.25, shrink_retailer_share_pct: 0.5, restock_value_cap_cents: 50000 }, as: JobberAdmin, captures: { agrA: "$.data.id" } }
