              payload: {}
              as: FundingOfficer
              captures: { av: "$.data.available_cents", en: "$.data.encumbered_cents", di: "$.data.disbursed_cents" }
          assert:
            - "After the encumbrance: FundingSource.${fs}.available_cents == 5000, encumbered_cents == 5000, disbursed_cents == 0 (sum 10000)"
            - "After the 2000-cent disbursement: ScholarshipAward.${aw}.status == PARTIALLY_DISBURSED, disbursed_cents == 2000; FundingSource.${fs}.available_cents == 5000, encumbered_cents == 3000, disbursed_cents == 2000 (sum 10000)"
            - "After the release: ScholarshipAward.${aw}.status == RELEASED and ScholarshipAward.${aw}.encumbered_cents == 2000"
            - "After the release: FundingSource.${fs}.available_cents == 8000, encumbered_cents == 0, disbursed_cents == 2000 (sum 10000, equal to total_budget_cents)"
            - "Enrollment.${e1}.funding_status == RELEASED"
