          - endpoints[POST /baselines/{baseline_id}/reject]
          - errors[ERR_BASELINE_NOT_APPROVED]
        distinguishing_aspect: "Rejecting a baseline is terminal for the Baseline yet fires NONE of the approval cascade: the enrollment stays ACCEPTED (never reaches ACTIVE) and the field stays MAPPED, so a quantification run against the rejected baseline fails with ERR_BASELINE_NOT_APPROVED."
        test_recipe:
          setup:
            - "an ACCEPTED enrollment with one PROPOSED HISTORICAL_DATA baseline (the chain of second_qc_decision_on_a_passed_packet_is_rejected stopped before approve)"
          setup_api_calls:
