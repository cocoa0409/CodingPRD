  # =====================================================================
  # Section: cross_cutting_layers
  # =====================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_version_alert_create_after_cascade
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[alert-queue-stale-group]", "endpoints['POST /watch/alerts']"]
        distinguishing_aspect: "Client observes group version V, a block registration advances the group to V+1, and the client's alert create carrying expected_watch_group_version == V is rejected ERR_STALE_VERSION (412); re-reading and retrying with the fresh version succeeds."
        test_recipe:
          setup: ["group created (version 1 observed); then a block is registered (cascade bumps group version to 3: block create does not bump, register cascade bumps +1, member create bumps +1)"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "OCC Watch", precinct_code: "L01" }
              as: ProgramCoordinator
              captures: { wg: $.data.id, wg_v: $.data.version }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "1-1 Occ St", household_count: 4 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "POST /watch/alerts"
              payload: { watch_group_id: "${wg}", alert_kind: "SAFETY_TIP", audience_scope: "GROUP", scheduled_send_at: "2026-08-09T12:00:00Z", expected_watch_group_version: "${wg_v}" }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { wg_fresh: $.data.version }
            - call: "POST /watch/alerts"
              payload: { watch_group_id: "${wg}", alert_kind: "SAFETY_TIP", audience_scope: "GROUP", scheduled_send_at: "2026-08-09T12:00:00Z", expected_watch_group_version: "${wg_fresh}" }
              as: ProgramCoordinator
              captures: { ok: $.data.id }
          assert:
            - "err == ERR_STALE_VERSION (register cascade bumped the group past the observed ${wg_v} == 1)"
            - "the retry with the fresh version succeeds (201)"

      - name: occ_stale_version_captain_assign_double_submit
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[captain-assign-stale-block]", "endpoints['POST /watch/blocks/{id}/captain-assignments']"]
        distinguishing_aspect: "Two sequential captain-assign creates carrying the same expected_block_version: the first succeeds (bumps Block.version), the second fails ERR_STALE_VERSION (412) — deterministic with strictly sequential requests."
        test_recipe:
          setup: ["group + REGISTERED block (version 2 after register) + 2 ACTIVE members"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "OCC2 Watch", precinct_code: "L02" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "2-2 Occ St", household_count: 4 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
              captures: { b_v: $.data.version }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "OC1", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m1: $.data.id }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "OC2", contact_channel: "EMAIL" }
              as: ProgramCoordinator
              captures: { m2: $.data.id }
          trigger:
            - call: "POST /watch/blocks/${b1}/captain-assignments"
              payload: { member_id: "${m1}", expected_block_version: "${b_v}" }
              as: ProgramCoordinator
              captures: { a1: $.data.id }
            - call: "POST /watch/blocks/${b1}/captain-assignments"
              payload: { member_id: "${m2}", expected_block_version: "${b_v}" }
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "a1 created (201)"
            - "err == ERR_STALE_VERSION (the first create advanced Block.version past ${b_v})"

      - name: derived_field_reconciliation_last_incident_at
        claim_type: derived_field_reconciliation
        grounds: [entities.Block.fields.last_incident_at, state_machines.IncidentReport.UNDER_REVIEW_to_CORROBORATED]
        distinguishing_aspect: "Block.last_incident_at tracks the latest CORROBORATED/CLEARED report's occurred_at: null before any corroboration, then equals the corroborated report's occurred_at; dismissing a different report does NOT move it."
        test_recipe:
          setup: ["group + block + member + ACTIVE agreement; report A (occurred 2026-07-10) corroborated; report B (occurred 2026-07-20) UNDER_REVIEW then DISMISSED"]
          setup_api_calls:
