              as: SiteOpsLead
            - call: "POST /ocr/waves/${wave_s1_id}/lock-roster"
              payload: {}
              as: RaceDirector
            - call: "POST /ocr/waves/${wave_s1_id}/release"
              payload: {}
              as: RaceDirector
            - call: "POST /ocr/waves/${wave_s1_id}/start"
              payload: {}
              as: RaceDirector
            - call: "POST /ocr/staff-assignments/${sa2_id}/vacate"
              payload: { reason: "Marshal pulled to the medical tent" }
              as: SafetyOfficer
          trigger:
            - call: "POST /ocr/entries/${entry1_id}/attempts"
              payload: { obstacle_id: "${o1_id}", outcome: "SKIPPED_UNMARSHALED" }
              as: ObstacleMarshal
              as_user_id: "STAFF-1"
            - call: "POST /ocr/entries/${entry1_id}/attempts"
              payload: { obstacle_id: "${o2_id}", outcome: "COMPLETED" }
              as: ObstacleMarshal
              as_user_id: "STAFF-1"
            - call: "POST /ocr/entries/${entry1_id}/attempts"
              payload: { obstacle_id: "${o2_id}", outcome: "SKIPPED_UNMARSHALED" }
              as: ObstacleMarshal
              as_user_id: "STAFF-1"
          assert:
            - "Obstacle.${o1_id}.staffing_state == MARSHALED and Obstacle.${o2_id}.staffing_state == UNSTAFFED after the vacate"
            - "The first trigger call returns 409 with data.error_id == ERR_OBSTACLE_MARSHALED: station 1 is staffed, so SKIPPED_UNMARSHALED is a false record"
            - "The second trigger call returns 409 with data.error_id == ERR_OBSTACLE_UNMARSHALED: station 2 has nobody to witness a COMPLETED run"
            - "The third trigger call returns 201 with ObstacleAttempt.outcome == SKIPPED_UNMARSHALED and recorded_by_user_id == STAFF-1"
            - "GET /ocr/entries/${entry1_id}/attempts returns total_count 1: neither refused attempt was persisted"
            - "Wave.${wave_s1_id}.release_status is still STARTED — the vacate cascade only holds heats still in SCHEDULED"
            - "Course.${course_id}.readiness_posture == RESTRICTED and bottleneck_capacity_pph == 0, because station 2 now clears nobody"

      - name: an_operation_valid_now_creates_a_future_shift_collision
        claim_type: Temporal validation
        excluded_because:
          difficulty_instance: staff_travel_buffer_accepts_an_exact_fifteen_minute_gap_and_rejects_one_second_less
          rationale: "§1.8 pins the priority-20 pairwise geometry to the second across two courses, which is the temporal-validation claim for staff shifts."

      - name: the_state_error_answers_before_the_capacity_and_safety_errors
        claim_type: Priority conflict
        excluded_because:
          difficulty_instance: held_wave_returns_state_error_not_the_course_safety_or_bottleneck_error
          rationale: "§1.8 stacks a HELD heat against the priority-12 safety gate and the priority-32 bottleneck gate and asserts the priority-9 state error wins."

      - name: the_waiver_gate_outranks_the_capacity_gate_on_registration
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: unsigned_waiver_outranks_the_full_roster_on_the_same_registration
          rationale: "§1.8 violates priority 13 and priority 31 on one registration call and asserts ERR_WAIVER_REQUIRED, which is exactly this ordering claim."

      - name: release_depends_on_a_state_two_levels_up_the_hierarchy
        claim_type: Cross-entity validation
        excluded_because:
          difficulty_instance: wave_release_blocked_by_the_courses_publication_state_two_levels_up
          rationale: "§1.8 drives the priority-10 check from the parent course's publication state and then satisfies it, covering both directions of the cross-entity claim."

      - name: the_corral_budget_is_an_aggregate_over_overlapping_heats
        claim_type: Aggregate validation
        excluded_because:
          difficulty_instance: three_overlapping_heats_share_the_corral_budget_and_the_window_rolls_forward
          rationale: "§1.8 accepts two heats individually and refuses the third on the collective corral load, then shows the window rolling forward."

      - name: the_clearance_state_conditions_the_runners_fate_at_the_gun
        claim_type: Conditional validation
        excluded_because:
          difficulty_instance: entry_fate_at_the_gun_is_decided_by_the_participants_clearance_state
          rationale: "§1.8 splits a single heat's roster by progress_status at the start and asserts the per-entry outcome, covering the conditional branch of the start fan-out."

  - section: endpoints
    instances:
      - name: the_participant_surface_creates_reads_and_filters_without_an_update
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /ocr/participants]
          - endpoints[GET /ocr/participants/{id}]
          - endpoints[GET /ocr/participants]
        distinguishing_aspect: "The Participant surface is create / read / list plus one action: there is no PATCH or DELETE, and the only mutation after creation is the waiver, which is what moves the row between the two clearance_status filter buckets."
        test_recipe:
          setup:
            - "No domain rows are needed; the logical clock is left at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /ocr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RaceDirector
          trigger:
            - call: "POST /ocr/participants"
              payload: { full_name: "Ada Lovelace", birth_year: 1995, email: "ada@example.com", chip_id: "CHIP-401" }
              as: SiteOpsLead
              captures: { p1_id: $.data.id }
            - call: "GET /ocr/participants/${p1_id}"
              payload: {}
              as: SiteOpsLead
            - call: "GET /ocr/participants"
              payload: { clearance_status: "PENDING", limit: 10, offset: 0 }
              as: SiteOpsLead
            - call: "POST /ocr/participants/${p1_id}/waiver"
              payload: { signature_name: "Ada Lovelace" }
              as: Participant
              as_user_id: "${p1_id}"
            - call: "GET /ocr/participants"
              payload: { clearance_status: "PENDING", limit: 10, offset: 0 }
              as: SiteOpsLead
            - call: "GET /ocr/participants"
              payload: { clearance_status: "CLEARED", limit: 10, offset: 0 }
              as: SiteOpsLead
          assert:
            - "The create returns 201 with Participant.${p1_id}.waiver_signed == false, clearance_status == PENDING, medical_flags == [] and version == 1"
            - "The read returns the same row byte for byte on the declared fields, including chip_id CHIP-401"
            - "The first list call returns total_count 1 with the row present"
            - "The waiver call returns 200 with waiver_signed == true and clearance_status == CLEARED"
            - "The second list call returns total_count 0 for clearance_status PENDING and the third returns total_count 1 for CLEARED, so the filter reads the recomputed field"
            - "The waiver bumped Participant.${p1_id}.version to 2; no PATCH or DELETE route exists for Participant, so this is the only mutation path"

      - name: a_passing_inspection_verifies_the_task_and_books_its_bond_share
