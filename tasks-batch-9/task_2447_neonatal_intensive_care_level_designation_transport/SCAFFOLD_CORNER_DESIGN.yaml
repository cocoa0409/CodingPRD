            - "${e_period_schema} == ERR_INVALID_REQUEST with HTTP 400 — period_end must exceed period_start"
            - "The third call succeeds: SurveillanceReport.${rep_ok}.status == DRAFT with period_start exactly at the unit's created_at, which is inside the allowed range"
            - "GET /surveillance-reports reports total_count 1"

      - name: second_open_review_for_the_same_unit_is_refused
        claim_type: violation_to_error
        grounds:
          - validations.priority_14
          - errors[ERR_REVIEW_ALREADY_OPEN]
          - state_machines[DesignationReview].terminal_states
        distinguishing_aspect: |
          "Open" is defined by state, not by existence: a second review is
          refused while the first is DRAFT/SUBMITTED/RETURNED/VERIFIED, and
          becomes legal the moment the first reaches the terminal DENIED — which
          is what lets a suspended unit ever re-apply.
        test_recipe:
          setup:
            - "The clock is at 2026-08-01T00:00:00Z, the standards are declared, Regional NICU A holds no credentials or equipment, and a DRAFT LEVEL_III review is open."
          setup_api_calls:
