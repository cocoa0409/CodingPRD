          - errors.ERR_STORE_NOT_FOUND
        distinguishing_aspect: "In a flat topology both foreign keys in the body are integrity-checked independently: an unknown sku_id returns ERR_SKU_NOT_FOUND and an unknown store_id returns ERR_STORE_NOT_FOUND, each before the row is written."
