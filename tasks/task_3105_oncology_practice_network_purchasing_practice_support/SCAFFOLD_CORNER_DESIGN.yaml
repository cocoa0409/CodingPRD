          - state_machines.Practice.DEPARTING_to_AFFILIATED
        distinguishing_aspect: "A derived holdback is reconciled back to zero by the bounding action: departure notice raises the practice's unsettled balance by the withheld rebate, and withdrawing the notice returns it exactly — no drift after the round trip."
        test_recipe:
          setup:
            - "Practice P with one RECLAIMED qualification created by its own departure notice; the practice is DEPARTING with a withdrawal still available."
          setup_api_calls:
