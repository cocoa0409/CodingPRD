# =============================================================================
# Corporate Travel Management (TMC) — Seed Tables (SCAFFOLD.yaml)
# §1.0–§1.7. Difficulty (§1.8) and Corner (§1.9) designs live in sibling files.
# =============================================================================

scenario: |
  Corporate Travel Management (TMC): traveler profile & policy, booking-tool & approval,
  negotiated-rate & preferred-vendor, duty-of-care & traveler-tracking, unused-ticket &
  exchange, savings/reporting, VIP & group, invoice/reconciliation

domain_name: corporate-travel-tmc
api_prefix: /tmc

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers
  entity_topology: flat
  # Peer entities under a single /tmc namespace, linked by foreign keys in bodies;
  # no resource nesting in URL paths. UnusedTicketCredit<->Booking form a cyclic ref.
  state_machine_shape: cyclic
  # TripRequest (PENDING->DRAFT revision loop) and NegotiatedRate (ACTIVE<->EXHAUSTED)
  # are both non-linear; Invoice has a DISPUTED->RECONCILED loop.
  relationship_patterns:
    - one_to_many
    - flat_with_references
    - cross_aggregate
    - self_referential   # Booking -> UnusedTicketCredit -> Booking cycle
  role_model: segregation_of_duties
  # Approver (a Traveler of MANAGER/EXECUTIVE grade) cannot approve their own TripRequest.
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: TravelPolicy
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Policy name" }
      - { name: region, type: string, source: input, description: "Region this policy governs (e.g., NA, EMEA)" }
      - { name: max_air_class, type: enum, source: input, description: "Highest allowed air class", constraints: "one of ECONOMY, PREMIUM_ECONOMY, BUSINESS, FIRST" }
      - { name: max_hotel_nightly_cents, type: integer, source: input, description: "Max allowed hotel nightly rate in cents" }
      - { name: advance_purchase_days, type: integer, source: input, description: "Minimum whole days between booking creation time and segment departure" }
      - { name: requires_manager_approval_over_cents, type: integer, source: input, description: "Estimated trip cost at or above this needs at least MANAGER approval" }
      - { name: requires_exec_approval_over_cents, type: integer, source: input, description: "Estimated trip cost at or above this needs EXEC approval" }
      - { name: exchange_penalty_cents, type: integer, source: input, description: "Flat fee charged on every ticket exchange" }
      - { name: credit_validity_days, type: integer, source: input, description: "Whole days an unused-ticket credit remains redeemable after issuance" }

  - name: Traveler
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Traveler full name" }
      - { name: email, type: string, source: input, description: "Traveler email (unique among ACTIVE travelers)" }
      - { name: grade, type: enum, source: input, description: "Employee grade", constraints: "one of STANDARD, MANAGER, EXECUTIVE, VIP" }
      - { name: policy_id, type: string, source: input, description: "FK -> TravelPolicy.id; the policy governing this traveler" }
      - { name: home_iata, type: string, source: input, description: "Home airport IATA code" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Vendor name" }
      - { name: vendor_type, type: enum, source: input, description: "Vendor category", constraints: "one of AIR, HOTEL, CAR" }
      - { name: is_preferred, type: boolean, source: input, description: "Whether vendor is on the preferred list", default: false }
      - { name: capacity, type: integer, source: input, description: "Aggregate block capacity (seats/rooms) available to overlapping group bookings" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: "ACTIVE" }

  - name: NegotiatedRate
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; vendor offering this rate" }
      - { name: rate_code, type: string, source: input, description: "Contract/rate code" }
      - { name: origin, type: string, source: input, description: "Origin IATA (matched exactly against a booking route)" }
      - { name: destination, type: string, source: input, description: "Destination IATA (matched exactly against a booking route)" }
      - { name: negotiated_fare_cents, type: integer, source: input, description: "Contracted fare in cents" }
      - { name: market_fare_cents, type: integer, source: input, description: "Reference market fare used for savings computation" }
      - { name: cap_usage_count, type: integer, source: input, description: "Maximum number of bookings that may consume this rate" }
      - { name: valid_from, type: datetime, source: input, description: "Rate becomes effective at this instant (inclusive)" }
      - { name: valid_to, type: datetime, source: input, description: "Rate stops being effective after this instant (inclusive)" }
      - { name: consumed_count, type: integer, source: computed, description: "Count of TICKETED/EXCHANGED bookings referencing this rate", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | EXPIRED", default: "ACTIVE" }

  - name: TripRequest
    parent: null
    common_fields: true
    fields:
      - { name: traveler_id, type: string, source: input, description: "FK -> Traveler.id; owner of the trip" }
      - { name: origin, type: string, source: input, description: "Origin IATA" }
      - { name: destination, type: string, source: input, description: "Destination IATA" }
      - { name: depart_date, type: datetime, source: input, description: "Planned outbound instant" }
      - { name: return_date, type: datetime, source: input, description: "Planned return instant" }
      - { name: purpose, type: string, source: input, description: "Trip purpose" }
      - { name: market_estimate_cents, type: integer, source: input, description: "Traveler-supplied fallback market estimate used when no negotiated rate matches the route" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Provisional forward-looking cost computed at submit (see calc estimate_provisional_cost)" }
      - { name: actual_cost_cents, type: integer, source: computed, description: "Final chronological cost = sum of non-cancelled Booking.fare_cents (see calc actual_cost_final)", default: 0 }
      - { name: approval_level_required, type: enum, source: computed, description: "NONE | MANAGER | EXEC computed from estimated_cost_cents at submit", default: "NONE" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_MANAGER | PENDING_EXEC | APPROVED | BOOKED | CANCELLED", default: "DRAFT" }

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - { name: trip_request_id, type: string, source: input, description: "FK -> TripRequest.id; the trip this segment belongs to" }
      - { name: traveler_id, type: string, source: computed, description: "FK -> Traveler.id; copied from the trip request's traveler" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; vendor providing the segment" }
      - { name: negotiated_rate_id, type: string, source: input, description: "FK -> NegotiatedRate.id; rate consumed by this booking (nullable)" }
      - { name: segment_type, type: enum, source: input, description: "AIR | HOTEL | CAR" }
      - { name: fare_basis, type: enum, source: input, description: "REFUNDABLE | NONREFUNDABLE" }
      - { name: fare_cents, type: integer, source: input, description: "Gross fare in cents for this segment" }
      - { name: credit_applied_cents, type: integer, source: computed, description: "Portion of fare covered by a redeemed unused-ticket credit", default: 0 }
      - { name: exchange_fee_cents, type: integer, source: computed, description: "Exchange penalty charged when this booking was produced by an exchange", default: 0 }
      - { name: depart_datetime, type: datetime, source: input, description: "Segment start instant" }
      - { name: return_datetime, type: datetime, source: input, description: "Segment end instant" }
      - { name: status, type: enum, source: system, description: "TICKETED | EXCHANGED | CANCELLED | REFUNDED", default: "TICKETED" }

  - name: GroupBooking
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; vendor holding the block" }
      - { name: organizer_traveler_id, type: string, source: input, description: "FK -> Traveler.id; organizer of the group" }
      - { name: block_size, type: integer, source: input, description: "Number of seats/rooms held (must be >= 1)" }
      - { name: confirmed_count, type: integer, source: system, description: "Seats/rooms confirmed so far", default: 0 }
      - { name: start_date, type: datetime, source: input, description: "Block start instant (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Block end instant (inclusive)" }
      - { name: status, type: enum, source: system, description: "HELD | CONFIRMED | RELEASED | CANCELLED", default: "HELD" }

  - name: UnusedTicketCredit
    parent: null
    common_fields: true
    fields:
      - { name: traveler_id, type: string, source: system, description: "FK -> Traveler.id; owner of the credit" }
      - { name: origin_booking_id, type: string, source: system, description: "FK -> Booking.id; the cancelled NONREFUNDABLE booking that produced this credit" }
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; vendor the credit is restricted to" }
      - { name: redeemed_by_booking_id, type: string, source: system, description: "FK -> Booking.id; booking that fully redeemed this credit (nullable)" }
      - { name: face_value_cents, type: integer, source: system, description: "Original credit value = cancelled booking fare" }
      - { name: residual_value_cents, type: integer, source: computed, description: "face_value_cents minus total applied (see calc credit_residual_value)" }
      - { name: expiry_date, type: datetime, source: system, description: "Instant after which the credit is no longer redeemable" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | PARTIALLY_USED | REDEEMED | EXPIRED", default: "AVAILABLE" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; vendor that issued the invoice" }
      - { name: billing_period, type: string, source: input, description: "Billing period label (e.g., 2026-08)" }
      - { name: invoiced_total_cents, type: integer, source: input, description: "Total the vendor billed" }
      - { name: reconciled_total_cents, type: integer, source: computed, description: "System-computed matched total incl. per-line mgmt fee (see calc invoice_reconciliation)", default: 0 }
      - { name: variance_cents, type: integer, source: computed, description: "invoiced_total_cents - reconciled_total_cents", default: 0 }
      - { name: status, type: enum, source: system, description: "RECEIVED | RECONCILED | DISPUTED | PAID", default: "RECEIVED" }

  - name: InvoiceLine
    parent: Invoice
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: system, description: "FK -> Invoice.id; parent invoice" }
      - { name: booking_id, type: string, source: input, description: "FK -> Booking.id; booking this line bills for (nullable = unmatched charge)" }
      - { name: billed_amount_cents, type: integer, source: input, description: "Amount the vendor billed on this line" }
      - { name: matched_amount_cents, type: integer, source: computed, description: "Contracted booking fare matched to this line (0 when unmatched)", default: 0 }
      - { name: match_status, type: enum, source: computed, description: "MATCHED | PRICE_VARIANCE | UNMATCHED", default: "UNMATCHED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Traveler
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /tmc/travelers/{id}/suspend"
        actor: TravelManager
        preconditions: []
        side_effects:
          - "CASCADE (depth 2, hop 1): every TripRequest of this traveler in {DRAFT, PENDING_MANAGER, PENDING_EXEC} transitions to CANCELLED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /tmc/travelers/{id}/reactivate"
        actor: TravelManager
        preconditions: []
        side_effects: []

  - entity: NegotiatedRate
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (on Booking create/exchange that raises consumed_count to cap_usage_count)"
        actor: system
        preconditions:
          - "consumed_count >= cap_usage_count after the booking consumes the rate"
        side_effects: []
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (on Booking cancel/refund/exchange-away that lowers consumed_count below cap_usage_count)"
        actor: system
        preconditions:
          - "consumed_count < cap_usage_count and now <= valid_to"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /tmc/maintenance/run-sweep (when now > valid_to)"
        actor: TravelManager | system
        preconditions:
          - "current logical clock is strictly after valid_to"
        side_effects: []
      - from: EXHAUSTED
        to: EXPIRED
        trigger: "POST /tmc/maintenance/run-sweep (when now > valid_to)"
        actor: TravelManager | system
        preconditions:
          - "current logical clock is strictly after valid_to"
        side_effects: []

  - entity: TripRequest
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /tmc/trip-requests/{id}/submit (when approval_level_required == NONE)"
        actor: Traveler
        preconditions:
          - "owning Traveler.status == ACTIVE (else ERR_TRAVELER_SUSPENDED)"
          - "approval_level_required == NONE"
        side_effects: []
      - from: DRAFT
        to: PENDING_MANAGER
        trigger: "POST /tmc/trip-requests/{id}/submit (when approval_level_required in {MANAGER, EXEC})"
        actor: Traveler
        preconditions:
          - "owning Traveler.status == ACTIVE (else ERR_TRAVELER_SUSPENDED)"
          - "approval_level_required != NONE"
        side_effects: []
      - from: PENDING_MANAGER
        to: APPROVED
        trigger: "POST /tmc/trip-requests/{id}/approve (when approval_level_required == MANAGER)"
        actor: Approver
        preconditions:
          - "acting Approver X-User-ID != trip.traveler_id (else ERR_SELF_APPROVAL)"
          - "acting Approver grade in {MANAGER, EXECUTIVE, VIP}"
        side_effects: []
      - from: PENDING_MANAGER
        to: PENDING_EXEC
        trigger: "POST /tmc/trip-requests/{id}/approve (when approval_level_required == EXEC)"
        actor: Approver
        preconditions:
          - "acting Approver X-User-ID != trip.traveler_id (else ERR_SELF_APPROVAL)"
          - "acting Approver grade in {MANAGER, EXECUTIVE, VIP}"
        side_effects: []
      - from: PENDING_EXEC
        to: APPROVED
        trigger: "POST /tmc/trip-requests/{id}/approve"
        actor: Approver
        preconditions:
          - "acting Approver X-User-ID != trip.traveler_id (else ERR_SELF_APPROVAL)"
          - "acting Approver grade == EXECUTIVE (else ERR_APPROVAL_RANK_TOO_LOW)"
        side_effects: []
      - from: PENDING_MANAGER
        to: DRAFT
        trigger: "POST /tmc/trip-requests/{id}/reject"
        actor: Approver
        preconditions:
          - "acting Approver X-User-ID != trip.traveler_id (else ERR_SELF_APPROVAL)"
        side_effects: ["revision loop: trip returns to DRAFT for editing"]
      - from: PENDING_EXEC
        to: DRAFT
        trigger: "POST /tmc/trip-requests/{id}/reject"
        actor: Approver
        preconditions:
          - "acting Approver X-User-ID != trip.traveler_id (else ERR_SELF_APPROVAL)"
        side_effects: ["revision loop: trip returns to DRAFT for editing"]
      - from: APPROVED
        to: BOOKED
        trigger: "system (on first Booking create for this trip via POST /tmc/bookings)"
        actor: system
        preconditions: []
        side_effects: ["actual_cost_cents recomputed (calc actual_cost_final)"]
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /tmc/trip-requests/{id}/cancel"
        actor: Traveler | TravelManager
        preconditions: []
        side_effects: []
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /tmc/trip-requests/{id}/cancel"
        actor: Traveler | TravelManager
        preconditions: []
        side_effects:
          - "CASCADE (depth 3, hop 1): every non-terminal Booking of this trip transitions to CANCELLED or REFUNDED"
          - "CASCADE (depth 3, hop 2, via Booking cancel): each cancelled NONREFUNDABLE Booking issues an UnusedTicketCredit AND decrements its NegotiatedRate.consumed_count"
          - "CASCADE (depth 3, hop 3, via rate decrement): a NegotiatedRate whose consumed_count drops below cap_usage_count transitions EXHAUSTED -> ACTIVE"

  - entity: Booking
    initial_state: TICKETED
    terminal_states: [EXCHANGED, CANCELLED, REFUNDED]
    transitions:
      - from: TICKETED
        to: EXCHANGED
        trigger: "POST /tmc/bookings/{id}/exchange"
        actor: Traveler
        preconditions:
          - "trip.status == BOOKED"
          - "now <= depart_datetime (cannot exchange after departure)"
        side_effects:
          - "a new TICKETED Booking is created with fare_cents = new_fare_cents and exchange_fee_cents = policy.exchange_penalty_cents (calc exchange_settlement)"
          - "if new fare is lower: an UnusedTicketCredit for the residual (calc exchange_settlement) is issued to the traveler"
          - "old booking's NegotiatedRate.consumed_count is unchanged if same rate reused; recomputed otherwise"
      - from: TICKETED
        to: CANCELLED
        trigger: "POST /tmc/bookings/{id}/cancel (when fare_basis == NONREFUNDABLE)"
        actor: Traveler
        preconditions:
          - "fare_basis == NONREFUNDABLE"
        side_effects:
          - "issue UnusedTicketCredit with face_value_cents = fare_cents, residual_value_cents = fare_cents, expiry_date = created_at + policy.credit_validity_days"
          - "decrement NegotiatedRate.consumed_count (calc rate_usage_consumption); may trigger EXHAUSTED -> ACTIVE"
          - "TripRequest.actual_cost_cents recomputed"
      - from: TICKETED
        to: REFUNDED
        trigger: "POST /tmc/bookings/{id}/cancel (when fare_basis == REFUNDABLE)"
        actor: Traveler
        preconditions:
          - "fare_basis == REFUNDABLE"
        side_effects:
          - "no credit issued (cash refund out of band)"
          - "decrement NegotiatedRate.consumed_count (calc rate_usage_consumption); may trigger EXHAUSTED -> ACTIVE"
          - "TripRequest.actual_cost_cents recomputed"

  - entity: GroupBooking
    initial_state: HELD
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /tmc/group-bookings/{id}/confirm"
        actor: TravelManager
        preconditions:
          - "confirmed_count <= block_size (else ERR_INVALID_REQUEST)"
        side_effects: []
      - from: HELD
        to: CANCELLED
        trigger: "POST /tmc/group-bookings/{id}/cancel"
        actor: TravelManager
        preconditions: []
        side_effects: ["releases held capacity back to the vendor"]
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /tmc/group-bookings/{id}/release"
        actor: TravelManager
        preconditions: []
        side_effects: ["releases confirmed capacity back to the vendor"]

  - entity: UnusedTicketCredit
    initial_state: AVAILABLE
    terminal_states: [REDEEMED, EXPIRED]
    transitions:
      - from: AVAILABLE
        to: PARTIALLY_USED
        trigger: "system (on Booking create with redeem_credit_id when residual remains after applying)"
        actor: system
        preconditions:
          - "credit_applied_cents < residual_value_cents_before"
        side_effects: ["residual_value_cents recomputed (calc credit_residual_value)"]
      - from: AVAILABLE
        to: REDEEMED
        trigger: "system (on Booking create with redeem_credit_id that consumes the full residual)"
        actor: system
        preconditions:
          - "credit_applied_cents == residual_value_cents_before"
        side_effects: ["redeemed_by_booking_id set to the new booking; residual_value_cents = 0"]
      - from: PARTIALLY_USED
        to: REDEEMED
        trigger: "system (on Booking create with redeem_credit_id that consumes the remaining residual)"
        actor: system
        preconditions:
          - "credit_applied_cents == residual_value_cents_before"
        side_effects: ["redeemed_by_booking_id set; residual_value_cents = 0"]
      - from: AVAILABLE
        to: EXPIRED
        trigger: "POST /tmc/maintenance/run-sweep (when now > expiry_date)"
        actor: TravelManager | system
        preconditions:
          - "current logical clock strictly after expiry_date"
        side_effects: []
      - from: PARTIALLY_USED
        to: EXPIRED
        trigger: "POST /tmc/maintenance/run-sweep (when now > expiry_date)"
        actor: TravelManager | system
        preconditions:
          - "current logical clock strictly after expiry_date"
        side_effects: []

  - entity: Invoice
    initial_state: RECEIVED
    terminal_states: [PAID]
    transitions:
      - from: RECEIVED
        to: RECONCILED
        trigger: "POST /tmc/invoices/{id}/reconcile (when variance_cents == 0)"
        actor: FinanceOfficer
        preconditions:
          - "variance_cents (calc invoice_reconciliation) == 0"
        side_effects:
          - "reconciled_total_cents, variance_cents, per-line matched_amount_cents and match_status recomputed"
      - from: RECEIVED
        to: DISPUTED
        trigger: "POST /tmc/invoices/{id}/reconcile (when variance_cents != 0)"
        actor: FinanceOfficer
        preconditions:
          - "variance_cents (calc invoice_reconciliation) != 0"
        side_effects:
          - "reconciled_total_cents, variance_cents, per-line matched_amount_cents and match_status recomputed"
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /tmc/invoices/{id}/resolve-dispute"
        actor: FinanceOfficer
        preconditions:
          - "an adjusted invoiced_total_cents was applied so that variance_cents == 0 (else ERR_INVALID_STATE)"
        side_effects: ["variance_cents recomputed to 0"]
      - from: RECONCILED
        to: PAID
        trigger: "POST /tmc/invoices/{id}/pay"
        actor: FinanceOfficer
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-create-stale-trip
    parent_entity: TripRequest
    write_endpoint: "POST /tmc/bookings"
    occ_field: "expected_trip_request_version"
    description: |
      Creating a Booking against a TripRequest whose version has advanced since
      the client last observed it is rejected. A TripRequest is multi-segment:
      creating one segment legitimately advances the trip (bumps its version and
      moves it APPROVED -> BOOKED). A second segment create that still carries the
      stale trip version the client read before the first segment is rejected on
      the stale-version check, because the trip's derived cost and booked-segment
      set it was validated against are no longer current.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimate_provisional_cost
    trigger: "POST /tmc/trip-requests/{id}/submit"
    algorithm: forward_looking
    formula: |
      # Provisional cost = the cheapest matching negotiated fare if one exists,
      # else the traveler-supplied market estimate. Assumes the traveler WILL use
      # the preferred rate (forward-looking optimism).
      candidates = NegotiatedRate where
        origin == trip.origin AND destination == trip.destination
        AND status == ACTIVE
        AND vendor.status == ACTIVE
        AND valid_from <= now <= valid_to
      rank candidates by negotiated_fare_cents ASC, then created_at ASC
      if candidates is empty:
        estimated_cost_cents = trip.market_estimate_cents
      else:
        estimated_cost_cents = candidates[0].negotiated_fare_cents
      # approval level derived from the provisional estimate
      if estimated_cost_cents >= policy.requires_exec_approval_over_cents:
        approval_level_required = EXEC
      elif estimated_cost_cents >= policy.requires_manager_approval_over_cents:
        approval_level_required = MANAGER
      else:
        approval_level_required = NONE
    input_set: "ACTIVE NegotiatedRate rows matching the trip route within their validity window; policy thresholds"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "at submit (forward-looking)"
        difference: "uses the best AVAILABLE negotiated fare (or market fallback), not what was actually booked"

  - name: actual_cost_final
    trigger: "system (on Booking create, cancel, refund, exchange; TripRequest cancel)"
    algorithm: chronological
    formula: |
      # Final cost = chronological running sum of what was actually booked.
      actual_cost_cents = sum(
        b.fare_cents - b.credit_applied_cents
        for b in Bookings where b.trip_request_id == trip.id
        AND b.status in {TICKETED, EXCHANGED}
      )
    input_set: "Bookings of the trip in status TICKETED or EXCHANGED (excludes CANCELLED and REFUNDED)"
    precision: "integer cents"
    variants:
      - name: final
        when: "after real bookings exist (chronological)"
        difference: "sums the fares actually ticketed net of applied credit, which can diverge from the provisional estimate"

  - name: realized_vs_potential_savings
    trigger: "GET /tmc/vendors/{id}/savings-report"
    algorithm: aggregation
    formula: |
      # realized: chronological — savings actually captured on bookings that USED a rate of this vendor
      realized_savings_cents = sum(
        rate.market_fare_cents - b.fare_cents
        for b in Bookings where b.status in {TICKETED, EXCHANGED}
        AND b.negotiated_rate_id is not null
        AND rate.vendor_id == vendor.id
      )
      # potential: forward-looking — savings had EVERY booking on this vendor used the vendor's
      # best matching rate, whether or not it actually did
      potential_savings_cents = sum(
        best_market - best_negotiated
        for b in Bookings where b.status in {TICKETED, EXCHANGED} AND b.vendor_id == vendor.id
        where best rate = cheapest NegotiatedRate of vendor matching b route by negotiated_fare_cents ASC, created_at ASC
        (contribute 0 when no matching vendor rate exists)
      )
    input_set: "realized: bookings that referenced a vendor rate; potential: all vendor bookings whether or not a rate was used"
    precision: "integer cents"
    variants:
      - name: realized
        when: "chronological, only rate-consuming bookings"
        difference: "counts savings only where a negotiated rate was actually applied"
      - name: potential
        when: "forward-looking, all vendor bookings"
        difference: "counts savings that WOULD have accrued if every eligible booking used the best rate"

  - name: exchange_settlement
    trigger: "POST /tmc/bookings/{id}/exchange"
    algorithm: threshold
    formula: |
      # Combinatorial (>=3 inputs: old fare, new fare, penalty), nested max + conditional.
      penalty = policy.exchange_penalty_cents
      new_booking.fare_cents = new_fare_cents
      new_booking.exchange_fee_cents = penalty
      residual_credit_cents = max(0, old_booking.fare_cents - new_fare_cents - penalty)
      amount_due_cents      = max(0, (new_fare_cents + penalty) - old_booking.fare_cents)
      # if residual_credit_cents > 0 -> issue an UnusedTicketCredit of that value to the traveler
    input_set: "old booking fare, new fare, policy penalty"
    constants: {}
    precision: "integer cents"

  - name: rate_usage_consumption
    trigger: "system (on Booking create/exchange consume; Booking cancel/refund release)"
    algorithm: aggregation
    formula: |
      consumed_count = count(
        b for b in Bookings
        where b.negotiated_rate_id == rate.id AND b.status in {TICKETED, EXCHANGED}
      )
      # invariant: cap_usage_count == remaining_capacity + consumed_count, where remaining_capacity >= 0
      # status: ACTIVE while consumed_count < cap_usage_count; EXHAUSTED at consumed_count >= cap_usage_count
    input_set: "Bookings referencing the rate in status TICKETED or EXCHANGED"
    precision: "integer count"

  - name: credit_residual_value
    trigger: "system (on UnusedTicketCredit issuance and on each redemption via Booking create)"
    algorithm: aggregation
    formula: |
      applied_total = sum(b.credit_applied_cents for b in Bookings whose redemption drew on this credit)
      residual_value_cents = face_value_cents - applied_total
      # invariant: face_value_cents == residual_value_cents + applied_total  (value never created or destroyed)
      # on a redeeming Booking create: credit_applied_cents = min(residual_value_cents_before, booking.fare_cents)
    input_set: "the credit's face value and the sum of amounts applied across redeeming bookings"
    precision: "integer cents"

  - name: invoice_reconciliation
    trigger: "POST /tmc/invoices/{id}/reconcile"
    algorithm: aggregation
    formula: |
      MGMT_FEE_RATE = 0.035
      for each line in invoice.lines:
        if line.booking_id is null:
          line.matched_amount_cents = 0
          line.match_status = UNMATCHED
        else:
          line.matched_amount_cents = booking.fare_cents - booking.credit_applied_cents
          if line.billed_amount_cents == line.matched_amount_cents:
            line.match_status = MATCHED
          else:
            line.match_status = PRICE_VARIANCE
        # per-line management fee rounded to whole cents BEFORE summing (pinned order)
        line_fee = round_half_up(line.matched_amount_cents * MGMT_FEE_RATE)
      reconciled_total_cents = sum(line.matched_amount_cents + round_half_up(line.matched_amount_cents * MGMT_FEE_RATE) for all lines)
      variance_cents = invoice.invoiced_total_cents - reconciled_total_cents
      # ROUNDING ORDER IS PINNED: round each line's fee to whole cents, THEN sum.
      # (sum-then-round would yield a different total by a cent or two.)
    input_set: "all InvoiceLine rows of the invoice; each matched to its booking's net fare"
    constants:
      MGMT_FEE_RATE: 0.035
    precision: "2 -> whole cents, round_half_up, per-line before summation"

  - name: group_capacity_check
    trigger: "POST /tmc/group-bookings"
    algorithm: aggregation
    formula: |
      # Aggregate capacity over OVERLAPPING blocks on the same vendor (closed intervals).
      overlap(a, b) = a.start_date <= b.end_date AND b.start_date <= a.end_date
      held_or_confirmed = GroupBooking where vendor_id == new.vendor_id AND status in {HELD, CONFIRMED}
      occupied = sum(g.block_size for g in held_or_confirmed if overlap(g, new))
      if occupied + new.block_size > vendor.capacity: reject ERR_VENDOR_CAPACITY_EXCEEDED
    input_set: "HELD/CONFIRMED group bookings on the vendor whose date interval overlaps the new block"
    precision: "integer count"

  - name: traveler_overlap_check
    trigger: "POST /tmc/bookings"
    algorithm: interval_merge
    formula: |
      # Per-traveler double-booking guard. Half-open intervals [depart_datetime, return_datetime):
      # back-to-back (existing.return_datetime == new.depart_datetime) is ALLOWED.
      overlap(a, b) = a.depart_datetime < b.return_datetime AND b.depart_datetime < a.return_datetime
      existing = Bookings where traveler_id == trip.traveler_id AND status == TICKETED
      if any e in existing with overlap(e, new): reject ERR_TRAVELER_DOUBLE_BOOKED
    input_set: "TICKETED bookings of the same traveler"
    precision: "instant comparison, half-open"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and valid"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All referenced resource ids (path + body FKs) exist; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, amounts/counts positive, block_size >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource in a valid state for the transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: state
    check: "OCC: expected_trip_request_version matches TripRequest.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /tmc/bookings"

  - priority: 7
    category: business_safety
    check: "Approver must not be the trip's own traveler (segregation of duties)"
    error_id: ERR_SELF_APPROVAL
    http_status: 403
    applies_to: "POST /tmc/trip-requests/{id}/approve, POST /tmc/trip-requests/{id}/reject"

  - priority: 8
    category: business_safety
    check: "Owning traveler must be ACTIVE for submit/booking; approver rank sufficient for EXEC step"
    error_id: ERR_TRAVELER_SUSPENDED
    http_status: 409
    applies_to: "POST /tmc/trip-requests/{id}/submit, POST /tmc/bookings"

  - priority: 9
    category: business_temporal
    check: "Booking departure must be at least policy.advance_purchase_days whole days after now (>=)"
    error_id: ERR_ADVANCE_PURCHASE_VIOLATION
    http_status: 409
    applies_to: "POST /tmc/bookings"

  - priority: 10
    category: business_temporal
    check: "Traveler must not already have a TICKETED booking overlapping the segment interval (half-open)"
    error_id: ERR_TRAVELER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /tmc/bookings"

  - priority: 11
    category: business_referential
    check: "Referenced NegotiatedRate must be ACTIVE and within validity window; Vendor must be ACTIVE"
    error_id: ERR_RATE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /tmc/bookings"

  - priority: 12
    category: business_referential
    check: "Redeemed UnusedTicketCredit must be AVAILABLE/PARTIALLY_USED, not expired, owned by the traveler, and for the same vendor"
    error_id: ERR_CREDIT_UNAVAILABLE
    http_status: 409
    applies_to: "POST /tmc/bookings, POST /tmc/bookings/{id}/exchange"

  - priority: 13
    category: business_constraint
    check: "For a HOTEL segment, fare_cents (per-stay nightly proxy) must not exceed policy.max_hotel_nightly_cents; AIR/CAR segments carry no amount cap"
    error_id: ERR_POLICY_VIOLATION
    http_status: 409
    applies_to: "POST /tmc/bookings"

  - priority: 14
    category: business_constraint
    check: "Group block capacity: occupied overlapping blocks + new block_size <= vendor.capacity"
    error_id: ERR_VENDOR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /tmc/group-bookings"

  - priority: 15
    category: business_fiscal
    check: "Booking requires the trip to be APPROVED or BOOKED (approval gate satisfied)"
    error_id: ERR_APPROVAL_REQUIRED
    http_status: 409
    applies_to: "POST /tmc/bookings"

  - priority: 16
    category: business_fiscal
    check: "Approver rank must match the pending step (EXECUTIVE required to clear PENDING_EXEC)"
    error_id: ERR_APPROVAL_RANK_TOO_LOW
    http_status: 409
    applies_to: "POST /tmc/trip-requests/{id}/approve"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock / maintenance (test-driving + ops) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [TravelManager, FinanceOfficer, System]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced to to_iso8601"]

  - method: POST
    path: "/tmc/maintenance/run-sweep"
    description: "Expire NegotiatedRates past valid_to and UnusedTicketCredits past expiry_date relative to the current logical clock."
    roles: [TravelManager, System]
    code: 200
    input: []
    output: null
    side_effects:
      - "NegotiatedRate ACTIVE/EXHAUSTED -> EXPIRED when now > valid_to"
      - "UnusedTicketCredit AVAILABLE/PARTIALLY_USED -> EXPIRED when now > expiry_date"

  # --- TravelPolicy ---
  - method: POST
    path: "/tmc/travel-policies"
    description: "Create a TravelPolicy"
    roles: [TravelManager]
    code: 201
    input: [name, region, max_air_class, max_hotel_nightly_cents, advance_purchase_days, requires_manager_approval_over_cents, requires_exec_approval_over_cents, exchange_penalty_cents, credit_validity_days]
    output: TravelPolicy
    side_effects: []

  - method: GET
    path: "/tmc/travel-policies/{id}"
    description: "Get a TravelPolicy"
    roles: [TravelManager, Traveler, Approver, FinanceOfficer]
    code: 200
    input: []
    output: TravelPolicy
    side_effects: []

  # --- Traveler ---
  - method: POST
    path: "/tmc/travelers"
    description: "Create a Traveler"
    roles: [TravelManager]
    code: 201
    input: [full_name, email, grade, policy_id, home_iata]
    output: Traveler
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/tmc/travelers/{id}"
    description: "Get a Traveler"
    roles: [TravelManager, Traveler, Approver, FinanceOfficer]
    code: 200
    input: []
    output: Traveler
    side_effects: []

  - method: GET
    path: "/tmc/travelers"
    description: "List Travelers (reverse-reachability for Traveler.policy_id)"
    roles: [TravelManager, Traveler, Approver, FinanceOfficer]
    code: 200
    input: ["policy_id?", "status?"]
    output: "Traveler[]"
    side_effects: []

  - method: POST
    path: "/tmc/travelers/{id}/suspend"
    description: "Suspend a Traveler"
    roles: [TravelManager]
    code: 200
    input: []
    output: Traveler
    side_effects: ["status -> SUSPENDED", "cascade-cancel the traveler's non-approved TripRequests"]

  - method: POST
    path: "/tmc/travelers/{id}/reactivate"
    description: "Reactivate a suspended Traveler"
    roles: [TravelManager]
    code: 200
    input: []
    output: Traveler
    side_effects: ["status -> ACTIVE"]

  # --- Vendor ---
  - method: POST
    path: "/tmc/vendors"
    description: "Create a Vendor"
    roles: [TravelManager]
    code: 201
    input: [name, vendor_type, "is_preferred?", capacity]
    output: Vendor
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/tmc/vendors/{id}"
    description: "Get a Vendor"
    roles: [TravelManager, Traveler, Approver, FinanceOfficer]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/tmc/vendors"
    description: "List Vendors"
    roles: [TravelManager, Traveler, Approver, FinanceOfficer]
    code: 200
    input: ["vendor_type?", "is_preferred?", "status?"]
    output: "Vendor[]"
    side_effects: []

  - method: POST
    path: "/tmc/vendors/{id}/deactivate"
    description: "Deactivate a Vendor"
    roles: [TravelManager]
    code: 200
    input: []
    output: Vendor
    side_effects: ["status -> INACTIVE"]

  - method: GET
    path: "/tmc/vendors/{id}/savings-report"
    description: "Computed realized vs potential savings for the vendor (calc realized_vs_potential_savings)"
    roles: [TravelManager, FinanceOfficer]
    code: 200
    input: []
    output: "{ realized_savings_cents: integer, potential_savings_cents: integer, booked_count: integer }"
    side_effects: []

  # --- NegotiatedRate ---
  - method: POST
    path: "/tmc/negotiated-rates"
    description: "Create a NegotiatedRate"
    roles: [TravelManager]
    code: 201
    input: [vendor_id, rate_code, origin, destination, negotiated_fare_cents, market_fare_cents, cap_usage_count, valid_from, valid_to]
    output: NegotiatedRate
    side_effects: ["status=ACTIVE, consumed_count=0"]

  - method: GET
    path: "/tmc/negotiated-rates/{id}"
    description: "Get a NegotiatedRate"
    roles: [TravelManager, Traveler, Approver, FinanceOfficer]
    code: 200
    input: []
    output: NegotiatedRate
    side_effects: []

  - method: GET
    path: "/tmc/negotiated-rates"
    description: "List NegotiatedRates (reverse-reachability for NegotiatedRate.vendor_id)"
    roles: [TravelManager, Traveler, Approver, FinanceOfficer]
    code: 200
    input: ["vendor_id?", "origin?", "destination?", "status?"]
    output: "NegotiatedRate[]"
    side_effects: []

  # --- TripRequest ---
  - method: POST
    path: "/tmc/trip-requests"
    description: "Create a TripRequest (DRAFT)"
    roles: [Traveler]
    code: 201
    input: [traveler_id, origin, destination, depart_date, return_date, purpose, market_estimate_cents]
    output: TripRequest
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/tmc/trip-requests/{id}"
    description: "Get a TripRequest"
    roles: [TravelManager, Traveler, Approver, FinanceOfficer]
    code: 200
    input: []
    output: TripRequest
    side_effects: []

  - method: GET
    path: "/tmc/trip-requests"
    description: "List TripRequests (reverse-reachability for TripRequest.traveler_id)"
    roles: [TravelManager, Traveler, Approver, FinanceOfficer]
    code: 200
    input: ["traveler_id?", "status?"]
    output: "TripRequest[]"
    side_effects: []

  - method: POST
    path: "/tmc/trip-requests/{id}/submit"
    description: "Submit a DRAFT TripRequest for approval routing"
    roles: [Traveler]
    code: 200
    input: []
    output: TripRequest
    side_effects:
      - "compute estimated_cost_cents and approval_level_required (calc estimate_provisional_cost)"
      - "status -> APPROVED (if NONE) or PENDING_MANAGER"

  - method: POST
    path: "/tmc/trip-requests/{id}/approve"
    description: "Approver advances a pending TripRequest"
    roles: [Approver]
    code: 200
    input: []
    output: TripRequest
    side_effects: ["status -> PENDING_EXEC or APPROVED per approval_level_required"]

  - method: POST
    path: "/tmc/trip-requests/{id}/reject"
    description: "Approver rejects a pending TripRequest back to DRAFT (revision loop)"
    roles: [Approver]
    code: 200
    input: ["reason?"]
    output: TripRequest
    side_effects: ["status -> DRAFT"]

  - method: POST
    path: "/tmc/trip-requests/{id}/cancel"
    description: "Cancel an APPROVED or BOOKED TripRequest"
    roles: [Traveler, TravelManager]
    code: 200
    input: []
    output: TripRequest
    side_effects:
      - "status -> CANCELLED"
      - "cascade-cancel non-terminal Bookings (depth-3 chain: booking cancel -> credit + rate release -> rate EXHAUSTED->ACTIVE)"

  # --- Booking ---
  - method: POST
    path: "/tmc/bookings"
    description: "Create a Booking (segment) against an APPROVED/BOOKED TripRequest. OCC-guarded on the trip version."
    roles: [Traveler]
    code: 201
    input: [trip_request_id, vendor_id, "negotiated_rate_id?", segment_type, fare_basis, fare_cents, depart_datetime, return_datetime, "redeem_credit_id?", expected_trip_request_version]
    output: Booking
    side_effects:
      - "increments TripRequest.version by 1"
      - "TripRequest APPROVED -> BOOKED on first segment; actual_cost_cents recomputed (calc actual_cost_final)"
      - "if negotiated_rate_id: consume rate (calc rate_usage_consumption); ACTIVE -> EXHAUSTED at cap"
      - "if redeem_credit_id: apply credit (calc credit_residual_value); credit AVAILABLE->PARTIALLY_USED/REDEEMED"
      - "traveler_id copied from trip"

  - method: GET
    path: "/tmc/bookings/{id}"
    description: "Get a Booking"
    roles: [TravelManager, Traveler, Approver, FinanceOfficer]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/tmc/bookings"
    description: "List Bookings (reverse-reachability for Booking.trip_request_id / traveler_id / vendor_id / negotiated_rate_id)"
    roles: [TravelManager, Traveler, Approver, FinanceOfficer]
    code: 200
    input: ["trip_request_id?", "traveler_id?", "vendor_id?", "negotiated_rate_id?", "status?"]
    output: "Booking[]"
    side_effects: []

  - method: POST
    path: "/tmc/bookings/{id}/exchange"
    description: "Exchange a TICKETED booking for a new fare; old -> EXCHANGED, new TICKETED created"
    roles: [Traveler]
    code: 201
    input: [new_fare_cents, "new_vendor_id?", "new_negotiated_rate_id?", "new_depart_datetime?", "new_return_datetime?"]
    output: Booking
    side_effects:
      - "old booking -> EXCHANGED; new TICKETED booking created (calc exchange_settlement)"
      - "exchange_fee_cents = policy.exchange_penalty_cents on the new booking"
      - "if downgrade residual > 0: issue UnusedTicketCredit"

  - method: POST
    path: "/tmc/bookings/{id}/cancel"
    description: "Cancel a TICKETED booking; NONREFUNDABLE -> CANCELLED (+credit), REFUNDABLE -> REFUNDED"
    roles: [Traveler]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "status -> CANCELLED or REFUNDED per fare_basis"
      - "NONREFUNDABLE: issue UnusedTicketCredit (face=fare_cents)"
      - "decrement NegotiatedRate.consumed_count; may trigger EXHAUSTED -> ACTIVE"
      - "TripRequest.actual_cost_cents recomputed"

  # --- GroupBooking ---
  - method: POST
    path: "/tmc/group-bookings"
    description: "Hold a group block on a vendor (capacity-checked over overlapping blocks)"
    roles: [TravelManager]
    code: 201
    input: [vendor_id, organizer_traveler_id, block_size, start_date, end_date]
