              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
            - call: "GET /memberships/${ms2_id}"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
          trigger:
            - call: "GET /leagues/${lg_id}"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
