            - "422 ERR_CHASSIS_WARRANTY_VOIDING_INTERFACE — a DIRECT_SPLICE on a J1939_CAN chassis computes warranty_impact VOIDS and customer_warranty_waiver_ack defaulted to false"
            - "409 ERR_SLOT_INVALID_STATE — close is only defined from IN_BUILD, and the slot is still SCHEDULED"
            - "the slot start and the first body-install both return 200 (build_status IN_BUILD, body_install_status INSTALLED)"
            - "409 ERR_BODY_ALREADY_INSTALLED on the second body-install — not ERR_ORDER_INVALID_STATE, because priority 82 owns this dimension"
            - "every rejected call left the store untouched: GET /upfit/chassis?limit=50 still reports total_count 1, GET /upfit/build-configurations reports 3, and UpfitOrder.${uo_np}.committed_pto_flow_gpm is still 0"

  # =========================================================================
  # 7. From Table 7 (RBAC) — role_model: segregation_of_duties
  # =========================================================================
  - section: rbac
    instances:

      - name: production_scheduler_owns_the_order_book_end_to_end
        claim_type: Can perform all exclusive_operations and shared_operations
        grounds:
          - rbac.ProductionScheduler
          - endpoints.POST_/upfit/upfit-orders
          - endpoints.POST_/upfit/build-slots
        distinguishing_aspect: |
          Every operation §1.7 grants ProductionScheduler exclusively must succeed for that role on
          one order — open, allocate, release, book a slot, cancel the slot — and its shared read
          right must reach entities it can never write, such as a body spec and an approved weight
          certification. An implementation that guards routes by resource family rather than by the
          §1.7 lists tends to leak reads or lose the slot-cancel right.
        test_recipe:
          setup:
            - "Catalog and an inspected F550 unit exist; eng-1 submits the engineering package so that the release right can be exercised by ps-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/chassis-models"
              payload: { code: "F550-DRW-84CA", make: "FORD", gvwr_lb: 19500, front_gawr_lb: 7000, rear_gawr_lb: 14706, wheelbase_in: 200, cab_to_axle_in: 84, curb_front_axle_lb: 4820, curb_rear_axle_lb: 2680, max_aux_amp_draw: 60, electrical_bus: "J1939_CAN", pto_provision: "FULL", pto_max_flow_gpm: 18, body_builder_book_rev: "BBB-2026.1", incomplete_vehicle_document_rev: "IVD-2026.1" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cm_a: "$.data.id" }
