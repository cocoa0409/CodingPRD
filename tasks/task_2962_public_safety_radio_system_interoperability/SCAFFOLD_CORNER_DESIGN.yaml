            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_prc_id}", serial_number: "PRC0003", radio_id: 33003, model: "PORTABLE", priority_class: 3 }
              as: AgencyRadioManager
              as_user_id: "${agency_prc_id}"
              captures: { unit_prc3: "$.data.id" }
            - call: "POST /radio-system/units/${unit_prc5}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_prc_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_prc_id}"
            - call: "POST /radio-system/units/${unit_prc3}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_prc_id}" }
              as: AgencyRadioManager
