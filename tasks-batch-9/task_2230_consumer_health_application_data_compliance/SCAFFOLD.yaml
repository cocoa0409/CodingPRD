    output: GeofenceCampaign
    side_effects: ["creates the campaign in PLANNED", "runs calculations.geofence_standoff STEP 3 and writes standoff_meters"]
  - method: GET
    path: "/health-data/geofence-campaigns/{id}"
    description: "Reads one geofence campaign"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    output: GeofenceCampaign
    side_effects: []
  - method: GET
    path: "/health-data/geofence-campaigns"
    description: "Lists geofence campaigns, filterable by zone or purpose"
    roles: [PlatformAdmin, PrivacyOfficer, ComplianceApprover, DataSteward, SecurityEngineer]
    code: 200
    input: ["geofence_zone_id?", "processing_purpose_id?", "state?", "limit?", "offset?"]
