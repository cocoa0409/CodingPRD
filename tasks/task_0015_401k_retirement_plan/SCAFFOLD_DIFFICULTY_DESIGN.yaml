            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 10000000 }
              as: PlanAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /contribution-periods/${cp_id}/close"
              payload: {}
              as: PlanAdmin
            - call: "POST /loans"
              payload: { participant_id: "${p_id}", principal_cents: 20000, term_months: 12, annual_interest_rate_bps: 700 }
              as: PlanAdmin
              captures: { loan_id: $.data.id }
            - call: "POST /participants/${p_id}/suspend"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /loans/${loan_id}/disburse"
              payload: {}
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "$.data.error_id == ERR_INVALID_STATE"
            - "Loan.${loan_id}.status == REQUESTED"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: loan_active_interval_overlap_half_open
        grounds:
          - validations[priority=12]
          - errors[ERR_LOAN_ALREADY_OUTSTANDING]
          - state_machines.Loan.REQUESTED_to_DISBURSED
        distinguishing_aspect: |
          Interval semantics: continuous half-open active-interval [DISBURSED,
          terminal). Two Loans on the same Participant cannot have overlapping
          DISBURSED intervals; the second DISBURSE while a prior loan is still
          DISBURSED is rejected with ERR_LOAN_ALREADY_OUTSTANDING. Different
          interval geometry from instance 2 (discrete annual bucket).
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE plan; ENROLLED participant with high balances; one DISBURSED loan still active; second loan REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
