# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2770 - Fitness Franchise Membership & Territory Administration
# 9 rule_ids x 2 instances = 18 instances. Every numeric assert below was computed
# by executing the §1.3 formulas and their constants as code, then pinned as a literal.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: royalty_reported_basis_vs_verified_basis_diverge_on_same_period
        grounds:
          - calculations.royalty_due
          - entities.RoyaltyReport.fields.reported_royalty_cents
          - entities.RoyaltyReport.fields.royalty_due_cents
          - entities.RoyaltyReport.fields.variance_pct
          - state_machines.RoyaltyReport.SUBMITTED_to_DISPUTED
          - entities.Franchisee.fields.royalty_rate_bps
        distinguishing_aspect: |
          The revenue-domain variant pair: on one RoyaltyReport the reported_basis variant multiplies the
          franchisee's self-declared head count by the brand list price (3 x 4500 = 13500 -> 878 cents of
          royalty) while the verified_basis variant sums the two agreements' actually-pinned
          effective_monthly_dues_cents (3666 + 4500 = 8166 -> 531 cents), so the same period yields two
          different royalty figures 347 cents apart and a variance_pct of 50.00 that disputes the report.
        test_recipe:
          setup:
            - "One franchisee at 650 bps owning one OPEN club in CA, one PUBLISHED CORE12 plan at 4500 cents monthly dues with a 3600-cent floor."
            - "An APPROVED 12.5% promotion and an ACTIVE corporate account at 4.5% credit, both applicable to that plan."
            - "Two ACTIVE agreements at that club: one discounted to 3666 cents (promotion + corporate + multi-club), one at the undiscounted 4500 cents."
            - "Logical clock advanced to 2026-09-05 so that the 2026-08 period is closed."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Gulf Coast Fitness LLC", contact_email: "ops@gulfcoastfit.example", royalty_rate_bps: 650, national_account_eligible: false }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t1_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t1_id}", name: "Alpha Fitness Downtown", opened_on: "2021-06-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /franchise/clubs/${c1_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/plan-templates"
              payload: { code: "CORE12", monthly_dues_cents: 4500, initiation_fee_cents: 4900, term_months: 12, cancellation_notice_days: 30, floor_price_cents: 3600 }
              as: BrandAdministrator
              captures: { pt_id: $.data.id }
            - call: "POST /franchise/plan-templates/${pt_id}/publish"
              payload: {}
              as: BrandAdministrator
            - call: "POST /franchise/promotions"
              payload: { franchisee_id: "${f1_id}", plan_template_id: "${pt_id}", code: "SUMMER125", discount_pct: 0.125, starts_on: "2026-07-01", ends_on: "2026-09-30" }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { promo_id: $.data.id }
            - call: "POST /franchise/promotions/${promo_id}/review"
              payload: { decision: "APPROVE" }
              as: BrandAdministrator
            - call: "POST /franchise/corporate-accounts"
              payload: { name: "Meridian Logistics", corporate_credit_pct: 0.045, allocation_method: "USAGE_SHARE" }
              as: BrandAdministrator
              captures: { ca_id: $.data.id }
            - call: "POST /franchise/members"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@example.com", home_state_code: "CA" }
              as: ClubManager
              as_user_id: "${c1_id}"
              captures: { m1_id: $.data.id }
            - call: "POST /franchise/members"
              payload: { full_name: "Ben Oduya", email: "ben.oduya@example.com", home_state_code: "CA" }
              as: ClubManager
              as_user_id: "${c1_id}"
              captures: { m2_id: $.data.id }
            - call: "GET /franchise/clubs/${c1_id}"
              payload: {}
              as: BrandAdministrator
              captures: { c1_v1: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { member_id: "${m1_id}", home_club_id: "${c1_id}", plan_template_id: "${pt_id}", expected_club_version: "${c1_v1}", signed_on: "2026-08-01", multi_club_access: true, promotion_id: "${promo_id}", corporate_account_id: "${ca_id}" }
              as: ClubManager
              as_user_id: "${c1_id}"
              captures: { ag1_id: $.data.id }
            - call: "GET /franchise/clubs/${c1_id}"
              payload: {}
              as: BrandAdministrator
              captures: { c1_v2: $.data.version }
            - call: "POST /franchise/agreements"
              payload: { member_id: "${m2_id}", home_club_id: "${c1_id}", plan_template_id: "${pt_id}", expected_club_version: "${c1_v2}", signed_on: "2026-08-01", multi_club_access: false }
              as: ClubManager
              as_user_id: "${c1_id}"
              captures: { ag2_id: $.data.id }
            - call: "POST /franchise/billing-events"
              payload: { agreement_id: "${ag1_id}", event_type: "DUES_POSTED", amount_cents: 3666, occurred_on: "2026-08-01", due_on: "2026-09-05" }
              as: BillingPartner
            - call: "POST /franchise/billing-events"
              payload: { agreement_id: "${ag1_id}", event_type: "PAYMENT_RECEIVED", amount_cents: 3666, occurred_on: "2026-08-02" }
              as: BillingPartner
            - call: "POST /franchise/billing-events"
              payload: { agreement_id: "${ag2_id}", event_type: "DUES_POSTED", amount_cents: 4500, occurred_on: "2026-08-01", due_on: "2026-09-05" }
              as: BillingPartner
            - call: "POST /franchise/billing-events"
              payload: { agreement_id: "${ag2_id}", event_type: "PAYMENT_RECEIVED", amount_cents: 4500, occurred_on: "2026-08-02" }
              as: BillingPartner
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: BrandAdministrator
          trigger:
            - call: "POST /franchise/royalty-reports"
              payload: { franchisee_id: "${f1_id}", period_month: "2026-08", reported_member_count: 3 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { rr_id: $.data.id }
          assert:
            - "RoyaltyReport.${rr_id}.verified_member_count == 2"
            - "RoyaltyReport.${rr_id}.verified_dues_basis_cents == 8166"
            - "RoyaltyReport.${rr_id}.reported_dues_basis_cents == 13500"
            - "RoyaltyReport.${rr_id}.royalty_due_cents == 531"
            - "RoyaltyReport.${rr_id}.reported_royalty_cents == 878"
            - "RoyaltyReport.${rr_id}.reported_royalty_cents - RoyaltyReport.${rr_id}.royalty_due_cents == 347"
            - "RoyaltyReport.${rr_id}.variance_pct == 50.00"
            - "RoyaltyReport.${rr_id}.status == DISPUTED"
            - "Franchisee.${f1_id}.disputed_royalty_count == 1"
            - "Franchisee.${f1_id}.compliance_score == 90"
            - "Franchisee.${f1_id}.status == ACTIVE"

      - name: inspection_standard_cycle_vs_accelerated_cycle_diverge_on_identical_subscores
        grounds:
          - calculations.inspection_score
          - entities.FacilityInspection.fields.variant_applied
          - entities.FacilityInspection.fields.refresh_cycle_months_applied
          - entities.FacilityInspection.fields.refresh_pts
          - entities.Club.fields.equipment_compliance_state
          - state_machines.FacilityInspection.SCHEDULED_to_SCORED
        distinguishing_aspect: |
          The facility-domain variant pair, on a different entity and metric from the royalty pair: two
          clubs receive the identical four sub-scores (78 / 86 / 80, oldest equipment 54 months), but the
          pre-2020 club is graded on the 42-month accelerated refresh cycle and earns 0 refresh points for
          a final score of 69 (NON_COMPLIANT), while the post-2020 club is graded on the 60-month brand
          cycle, earns 10 refresh points and scores 70 (WATCH) - the two variants straddle
          REMEDIATION_SCORE_THRESHOLD on identical inputs.
        test_recipe:
          setup:
            - "One franchisee owning two OPEN CA clubs in two separate territories: Legacy (opened 2019-06-01) and Modern (opened 2021-06-01)."
            - "One SCHEDULED inspection per club, dated 2026-07-10 (Legacy) and 2026-07-20 (Modern), both at or before the default clock date 2026-08-01."
            - "No agreements and no royalty reports exist, so the only compliance input is the inspection fail streak."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Two Coast Fitness LLC", contact_email: "ops@twocoastfit.example", royalty_rate_bps: 650, national_account_eligible: false }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t_legacy_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.5, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t_modern_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t_legacy_id}", name: "Legacy Club", opened_on: "2019-06-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c_legacy_id: $.data.id }
            - call: "POST /franchise/clubs/${c_legacy_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t_modern_id}", name: "Modern Club", opened_on: "2021-06-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c_modern_id: $.data.id }
            - call: "POST /franchise/clubs/${c_modern_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/inspections"
              payload: { club_id: "${c_legacy_id}", inspection_date: "2026-07-10" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { insp_legacy_id: $.data.id }
            - call: "POST /franchise/inspections"
              payload: { club_id: "${c_modern_id}", inspection_date: "2026-07-20" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
              captures: { insp_modern_id: $.data.id }
          trigger:
            - call: "POST /franchise/inspections/${insp_legacy_id}/score"
              payload: { equipment_condition_pts: 78, cleanliness_pts: 86, safety_pts: 80, equipment_age_months_max: 54 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
            - call: "POST /franchise/inspections/${insp_modern_id}/score"
              payload: { equipment_condition_pts: 78, cleanliness_pts: 86, safety_pts: 80, equipment_age_months_max: 54 }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          assert:
            - "FacilityInspection.${insp_legacy_id}.variant_applied == ACCELERATED_CYCLE"
            - "FacilityInspection.${insp_legacy_id}.refresh_cycle_months_applied == 42"
            - "FacilityInspection.${insp_legacy_id}.refresh_pts == 0"
            - "FacilityInspection.${insp_legacy_id}.score == 69"
            - "FacilityInspection.${insp_legacy_id}.status == REMEDIATION_REQUIRED"
            - "Club.${c_legacy_id}.equipment_compliance_state == NON_COMPLIANT"
            - "Club.${c_legacy_id}.status == SUSPENDED"
            - "FacilityInspection.${insp_modern_id}.variant_applied == STANDARD_CYCLE"
            - "FacilityInspection.${insp_modern_id}.refresh_cycle_months_applied == 60"
            - "FacilityInspection.${insp_modern_id}.refresh_pts == 10"
            - "FacilityInspection.${insp_modern_id}.score == 70"
            - "FacilityInspection.${insp_modern_id}.status == CLOSED"
            - "Club.${c_modern_id}.equipment_compliance_state == WATCH"
            - "Club.${c_modern_id}.status == OPEN"
            - "FacilityInspection.${insp_modern_id}.score - FacilityInspection.${insp_legacy_id}.score == 1"
            - "Franchisee.${f1_id}.inspection_fail_streak == 0"
            - "Franchisee.${f1_id}.compliance_score == 100"

  - rule_id: combinatorial_formula
    instances:
      - name: effective_dues_rounds_each_discount_component_before_summing
        grounds:
          - calculations.effective_monthly_dues
          - entities.MembershipAgreement.fields.promo_discount_cents
          - entities.MembershipAgreement.fields.corporate_credit_cents
          - entities.MembershipAgreement.fields.multi_club_credit_cents
          - entities.MembershipAgreement.fields.effective_monthly_dues_cents
          - entities.MembershipPlanTemplate.fields.floor_price_cents
        distinguishing_aspect: |
          Mode (b) - nested rounding where the order decides the cents. All three discount components land on
          exactly .5 fractions against the 4500-cent base (562.5, 202.5, 67.5), so the scaffold's pinned
          round-each-then-sum order yields 563 + 203 + 68 = 834 and effective_monthly_dues_cents == 3666,
          whereas the forbidden sum-then-round order yields 833 and 3667. The one-cent gap is the whole test.
        test_recipe:
          setup:
            - "One franchisee owning one OPEN CA club, one PUBLISHED CORE12 plan at 4500 cents with a 3600-cent floor."
            - "An APPROVED promotion at discount_pct 0.125 whose window 2026-07-01..2026-09-30 contains the default clock date 2026-08-01."
            - "An ACTIVE corporate account at corporate_credit_pct 0.045."
            - "One registered member, and the club's current version read immediately before the write."
          setup_api_calls:
            - call: "POST /franchise/franchisees"
              payload: { legal_name: "Harbor Fit Group LLC", contact_email: "ops@harborfit.example", royalty_rate_bps: 650, national_account_eligible: false }
              as: BrandAdministrator
              captures: { f1_id: $.data.id }
            - call: "POST /franchise/territories"
              payload: { franchisee_id: "${f1_id}", center_lat: 34.0, center_lng: -118.0, protected_radius_km: 5.0, state_code: "CA" }
              as: BrandAdministrator
              captures: { t1_id: $.data.id }
            - call: "POST /franchise/clubs"
              payload: { territory_id: "${t1_id}", name: "Harbor Club", opened_on: "2021-06-01", guest_fee_cents: 1250 }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /franchise/clubs/${c1_id}/open"
              payload: {}
              as: FranchiseOwner
              as_user_id: "${f1_id}"
            - call: "POST /franchise/plan-templates"
              payload: { code: "CORE12", monthly_dues_cents: 4500, initiation_fee_cents: 4900, term_months: 12, cancellation_notice_days: 30, floor_price_cents: 3600 }
              as: BrandAdministrator
              captures: { pt_id: $.data.id }
            - call: "POST /franchise/plan-templates/${pt_id}/publish"
              payload: {}
              as: BrandAdministrator
            - call: "POST /franchise/promotions"
              payload: { franchisee_id: "${f1_id}", plan_template_id: "${pt_id}", code: "SUMMER125", discount_pct: 0.125, starts_on: "2026-07-01", ends_on: "2026-09-30" }
              as: FranchiseOwner
              as_user_id: "${f1_id}"
              captures: { promo_id: $.data.id }
            - call: "POST /franchise/promotions/${promo_id}/review"
              payload: { decision: "APPROVE" }
              as: BrandAdministrator
            - call: "POST /franchise/corporate-accounts"
              payload: { name: "Meridian Logistics", corporate_credit_pct: 0.045, allocation_method: "USAGE_SHARE" }
              as: BrandAdministrator
              captures: { ca_id: $.data.id }
            - call: "POST /franchise/members"
              payload: { full_name: "Ana Reyes", email: "ana.reyes@example.com", home_state_code: "CA" }
              as: ClubManager
              as_user_id: "${c1_id}"
              captures: { m1_id: $.data.id }
            - call: "GET /franchise/clubs/${c1_id}"
              payload: {}
              as: BrandAdministrator
              captures: { c1_v: $.data.version }
          trigger:
            - call: "POST /franchise/agreements"
              payload: { member_id: "${m1_id}", home_club_id: "${c1_id}", plan_template_id: "${pt_id}", expected_club_version: "${c1_v}", signed_on: "2026-08-01", multi_club_access: true, promotion_id: "${promo_id}", corporate_account_id: "${ca_id}" }
              as: ClubManager
              as_user_id: "${c1_id}"
              captures: { ag1_id: $.data.id }
          assert:
            - "MembershipAgreement.${ag1_id}.monthly_dues_base_cents == 4500"
            - "MembershipAgreement.${ag1_id}.promo_discount_cents == 563"
            - "MembershipAgreement.${ag1_id}.corporate_credit_cents == 203"
            - "MembershipAgreement.${ag1_id}.multi_club_credit_cents == 68"
            - "MembershipAgreement.${ag1_id}.effective_monthly_dues_cents == 3666"
            - "MembershipAgreement.${ag1_id}.effective_monthly_dues_cents != 3667"
            - "MembershipAgreement.${ag1_id}.state_code == CA"
            - "MembershipAgreement.${ag1_id}.agreement_status == PENDING"
            - "MembershipAgreement.${ag1_id}.dues_status == CURRENT"

      - name: settlement_rebate_tier_keyed_only_on_net_before_rebate
        grounds:
          - calculations.usage_settlement_net
          - entities.UsageSettlement.fields.net_before_rebate_cents
          - entities.UsageSettlement.fields.rebate_pct
          - entities.UsageSettlement.fields.volume_rebate_cents
          - entities.UsageSettlement.fields.net_payable_cents
          - entities.GuestUsageEvent.fields.usage_fee_cents
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency whose evaluation order the scaffold pins. Gross guest fees
          of 105000 cents sit in the 6% rebate tier, but the admin hold of 8400 drops net_before_rebate_cents
          to 96600, which sits in the 3% tier; the scaffold keys the tier on net_before_rebate_cents only, so
          volume_rebate_cents == 2898 and net_payable_cents == 93702, while keying it on the gross would give
          5796 and 90804.
