        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[negotiation-open-stale-intake]
        distinguishing_aspect: "Two sequential open-negotiation calls on the same IntakeRequest: the first succeeds and bumps version; the second carrying the stale expected_intake_request_version fails 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["ROUTED IntakeRequest with version captured"]
          setup_api_calls:
            - call: "POST /users"
              payload: { email: "bo_occ1@x.com", display_name: "BO", primary_role: "BUSINESS_OWNER" }
              as: OpsAdmin
