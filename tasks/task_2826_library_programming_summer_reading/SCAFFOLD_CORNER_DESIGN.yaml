            - call: "POST /library/programs"
              payload: { branch_id: "${br}", title: "Craft Hour B", age_group: "SCHOOL_AGE", delivery_mode: "IN_BRANCH", registration_policy: "REGISTRATION", start_utc: "2026-08-12T15:00:00.000Z", end_utc: "2026-08-12T16:00:00.000Z", attendance_target: 10, attendance_cap: 20, supply_sku: "CRAFT-KIT", supply_units_per_attendee: 1, materials_budget_cents: 50000, presenter_fee_budget_cents: 200000 }
