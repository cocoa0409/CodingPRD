              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /device-lots"
              payload: { device_type: "SHEATH", catalog_code: "SHT-7F", lot_number: "L-2026-F", expires_on: "2027-06-30", received_quantity: 3, unit_cost_cents: 15000 }
              as: CenterAdmin
              captures: { lot_id: $.data.id, lot_v1: $.data.version }
            - call: "POST /vascular-accesses"
              payload: { patient_id: "${pat_id}", access_type: "AVG", laterality: "LEFT", site: "FOREARM", placed_on: "2026-05-01" }
              as: AccessCoordinator
              captures: { acc_id: $.data.id }
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "PLACED" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "MATURING" }
              as: AccessCoordinator
            - call: "POST /vascular-accesses/${acc_id}/status"
              payload: { to_status: "IN_USE" }
              as: AccessCoordinator
            - call: "POST /surveillance-readings"
              payload: { access_id: "${acc_id}", reported_by_facility_id: "${fac_id}", reading_at: "2026-07-28T08:00:00Z", access_flow_ml_min: 900, venous_pressure_mmhg: 100, recirculation_pct: 2.0, kind: "ROUTINE" }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
            - call: "POST /referrals"
              payload: { access_id: "${acc_id}", referring_facility_id: "${fac_id}", suspected_problem: "THROMBOSIS", clinical_narrative: "clotted graft", missed_treatment_count: 0 }
              as: FacilityCoordinator
              as_user_id: "${fac_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/triage"
              payload: {}
              as: AccessCoordinator
              captures: { ref_v: $.data.version }
            - call: "POST /procedures"
              payload: { referral_id: "${ref_id}", room_id: "${room_id}", primary_operator_id: "${op_id}", procedure_type: "THROMBECTOMY", sedation_level: "NONE", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z", expected_referral_version: "${ref_v}" }
              as: AccessCoordinator
              captures: { proc_id: $.data.id }
            - call: "POST /procedures/${proc_id}/device-usages"
              payload: { device_lot_id: "${lot_id}", quantity: 3, expected_device_lot_version: "${lot_v1}" }
              as: Interventionalist
              as_user_id: "${op_id}"
              captures: { du_id: $.data.id }
            - call: "GET /device-lots/${lot_id}"
              payload: {}
              as: CenterAdmin
              captures: { lot_v2: $.data.version }
          trigger:
            - call: "POST /procedures/${proc_id}/device-usages"
              payload: { device_lot_id: "${lot_id}", quantity: 1, expected_device_lot_version: "${lot_v2}" }
              as: Interventionalist
              as_user_id: "${op_id}"
          assert:
            - "the 3-unit reservation succeeded at the inclusive boundary: headroom was 3 - 0 == 3 against a request of 3"
            - "after that reservation DeviceLot.${lot_id}.quantity_on_hand == 3, quantity_reserved == 3, status == AVAILABLE"
            - "the 1-unit request returns 409 ERR_LOT_DEPLETED: headroom is 3 - 3 == 0"
            - "the rejection is not 412: expected_device_lot_version ${lot_v2} matches the lot's current version, so the OCC check at priority 9 passes and the stock rule at priority 30 is what fires"
            - "the rejection creates nothing: GET /device-usages?procedure_id=${proc_id} still returns total_count 1"
            - "DeviceLot.${lot_id}.status is still AVAILABLE and NOT DEPLETED - exhausted headroom is not depletion, since quantity_on_hand is still 3"
            - "DeviceLot.${lot_id}.version is unchanged by the failed call"
            - "DeviceUsage.${du_id}.state == RESERVED with consumed_at and released_at both null"

      - name: infection_attribution_window_is_thirty_whole_days_inclusive
        grounds:
          - calculations.infection_attribution
          - entities.InfectionEvent.fields.days_post_procedure
          - entities.InfectionEvent.fields.attributable
          - calculations.access_intervention_burden
        distinguishing_aspect: |
          days_post_procedure is a FLOORED whole-day count of elapsed seconds from discharged_at,
          and the window is 0..30 inclusive. Against a discharge at 2026-08-01T10:00:00Z an onset
          at 2026-08-31T10:00:00Z is exactly 2592000 seconds, i.e. day 30, and IS attributable,
          while an onset one second past 31 days (2026-09-01T10:00:01Z) floors to 31 and is NOT.
          Only the attributable event moves attributable_infection_count and therefore the
          intervention burden, so the boundary is observable on a second entity.
        test_recipe:
          setup:
            - "one FEE_FOR_SERVICE patient, one IN_USE AVG access, one ROUTINE referral"
