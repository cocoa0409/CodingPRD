          - entities.Table.fields.occupied_seats
        distinguishing_aspect: "Conserved quantity = seat occupancy (different quantity than money): occupied_seats == sum of seats_used of live assignments; assign (+3) then delete (-3) returns occupied_seats to 0 with no drift."
