            - "CC starts 44 min after CA ends: err == ERR_TRAY_RESERVATION_TIME_CONFLICT (strict inequality: 12:44 < 12:00+45)"
            - "Only 2 reservations exist on tray ${tr} (list response total_count == 2), both RESERVED"

  - rule_id: compensating_invariant
    instances:
      - name: reserve_release_roundtrip_conserves_sterile_pool
        grounds:
          - state_machines.TrayReservation.RESERVED_to_RELEASED
          - state_machines.ORCase.TRAYS_RESERVED_to_SCHEDULED
          - concurrency_rules[reservation-create-stale-case]
        distinguishing_aspect: |
          Conserved quantity: the per-template STERILE tray pool cardinality and
          the case's status. The forward action (reservation create) plus its
          compensating action (reservation release) must leave
          count(trays of the template with status STERILE) == 2 unchanged across
          the pair, reservation RK terminally RELEASED, and the case back at
          SCHEDULED — zero drift in either quantity.
        test_recipe:
          setup:
            - "Template, technicians A and S, sterilizer; trays k1 and k2 STERILE via one shared load (expiry 2026-05-31T03:00:00Z)"
            - "Case CK (2026-05-10T09:00-11:00) created, version captured; exactly 2 STERILE trays exist for the template"
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "ONC-01", name: "Oncology Set", specialty: "ONC", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
