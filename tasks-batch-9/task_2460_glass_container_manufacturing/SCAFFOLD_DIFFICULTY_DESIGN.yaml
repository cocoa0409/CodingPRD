    instances:
      - name: refractory_remaining_exactly_five_percent_flips_posture_to_rebuild_due
        grounds:
          - calculations.furnace_posture_derivation
          - calculations.refractory_wear
          - state_machines.Campaign.ACTIVE_to_WIND_DOWN
          - entities.Furnace.fields.refractory_remaining_pct
        distinguishing_aspect: |
          The REBUILD_DUE comparison is inclusive at exactly 5.00. Two furnaces take identical
          950.00 wear: the one with refractory_life_total_units 1000.00 lands on exactly 5.00 and must
          become REBUILD_DUE with its campaign auto-wound-down, while the one with 1005.00 lands on
          5.47 and must stay RESTRICTED with its campaign still ACTIVE. A strict "<" comparison or a
          rounding slip in either direction breaks exactly one of the two arms.
