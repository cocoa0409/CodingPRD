          trigger:
            - call: "POST /outage-events/${o_id}/exclusion-actions"
              payload: { action: "APPROVE" }
              as: ComplianceAuditor
              as_user_id: "auditor-1"
          assert:
            - "before the trigger: OutageEvent.${o_id}.state == EXCLUSION_REVIEW and pre_exclusion_state == CLASSIFIED; ChargingPort.${p_id}.service_state == OUT_OF_SERVICE; Station.${st_id}.status == SUSPENDED with suspension_source == AUTOMATIC"
            - "HTTP status == 200"
            - "OutageEvent.${o_id}.state == EXCLUDED and excluded_at == \"2026-08-01T06:00:00Z\" and pre_exclusion_state == CLASSIFIED"
            - "ChargingPort.${p_id}.service_state == IN_SERVICE (conditional cascade fired because pre_exclusion_state was CLASSIFIED)"
            - "Station.${st_id}.out_of_service_port_count == 0 and status == OPERATIONAL and suspension_source == NONE"
