      - name: invoice_void_compensation_cascade
        grounds:
          - state_machines.Invoice.ISSUED_to_VOID
          - state_machines.Fine.APPLIED_to_PENDING
          - state_machines.Customer.ACTIVE_to_SUSPENDED
          - entities.Customer.fields.outstanding_balance_cents
        distinguishing_aspect: |
          Depth-3 transitive cascade from POST invoices/{id}/void (different trigger
          than the scale ticket): void -> (1) Invoice ISSUED -> VOID, (2) Customer
          outstanding_balance_cents -= total_cents, (3) swept fines APPLIED -> PENDING;
          and the cascade deliberately does NOT auto-reinstate the SUSPENDED customer
          (manual reinstate is a separate transition), proving link selectivity.
