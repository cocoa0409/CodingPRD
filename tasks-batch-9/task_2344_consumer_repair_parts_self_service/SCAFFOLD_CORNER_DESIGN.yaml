      - name: risk_index_rounds_half_up_to_ninety_seven_for_a_non_serviceable_high_voltage_part
        claim_type: precision
        grounds:
          - calculations.self_repair_risk_index.formula
          - calculations.self_repair_risk_index.constants.INSTALL_MINUTES_NORMALIZER
          - calculations.self_repair_eligibility_decision.formula[step 3]
        distinguishing_aspect: |
          The weighted sum is exactly 0.965, so the index must be 97 (half-up) and
          not 96 (truncation); the install weight also saturates at 1 because 200
          minutes exceeds the 120-minute normalizer, and the index is still written
          even though the decision is BLOCKED_TIER.
        test_recipe:
          setup:
            - "Profile US-CA; model CRX-C207 with repairability_tier TIER_D_NON_SERVICEABLE; part SKU-C207-HV PUBLISHED with safety_class SAFETY_RESTRICTED_HIGH_VOLTAGE and a compatibility row at install_minutes 200, self_service_eligible false; NO manual revision at all."
