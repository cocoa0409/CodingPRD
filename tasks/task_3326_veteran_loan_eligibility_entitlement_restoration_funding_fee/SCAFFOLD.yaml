scenario: |
  Veteran Loan Eligibility, Entitlement Restoration & Funding Fee (Veterans United Home Loans): eligibility determination from service history with certificate of eligibility retrieval and character of discharge review, entitlement calculation including remaining entitlement after a prior loan and restoration on sale or refinance, funding fee determination by service category, down payment and first or subsequent use with exemption for disability compensation, appraisal ordering through the program's assignment process with minimum property requirement repairs, occupancy certification and permitted exceptions for deployed service members, residual income and debt ratio underwriting differing from conventional guidelines, assumption of an existing loan by a qualified buyer with entitlement substitution, refinance seasoning and net tangible benefit tests

domain_name: "veteran-loan-eligibility"
api_prefix: "/va-loans"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - selector_policy
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (16 entities)
# =============================================================================
entities:
  - name: Veteran
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Veteran full legal name" }
      - { name: ssn_last4, type: string, source: input, description: "Last 4 digits of SSN", constraints: "exactly 4 digits" }
      - { name: service_category, type: enum, source: input, description: "Service category driving funding-fee table selection", constraints: "REGULAR_MILITARY | RESERVES_NATIONAL_GUARD" }
      - { name: character_of_discharge, type: enum, source: input, description: "Overall character of discharge reviewed at COE issuance", constraints: "HONORABLE | GENERAL | OTHER_THAN_HONORABLE | BAD_CONDUCT | DISHONORABLE" }
      - { name: receives_disability_compensation, type: boolean, source: input, description: "True when the veteran receives VA disability compensation; exempts the funding fee" }
      - { name: is_surviving_spouse, type: boolean, source: input, default: false, description: "True for an eligible surviving spouse applying in place of the veteran" }
      - { name: total_qualifying_service_days, type: integer, source: computed, description: "Sum of qualifying_days over this veteran's ServicePeriods (calc qualifying_service_days)" }
      - { name: has_issued_coe, type: boolean, source: computed, description: "True iff this veteran has a CertificateOfEligibility in state ISSUED" }
      - { name: charged_loan_count, type: integer, source: computed, description: "Count of this veteran's Loans with entitlement_charged_cents > 0 and closing_status in {CLOSED, PAID_IN_FULL} and the charge not fully restored" }

  - name: ServicePeriod
    parent: Veteran
    common_fields: true
    fields:
      - { name: veteran_id, type: string, source: input, description: "FK -> Veteran.id; owner of this service period" }
      - { name: branch, type: enum, source: input, description: "Branch of service", constraints: "ARMY | NAVY | AIR_FORCE | MARINES | COAST_GUARD | SPACE_FORCE" }
      - { name: start_date, type: datetime, source: input, description: "First day of the period, ISO date" }
      - { name: end_date, type: datetime, source: input, description: "Last day of the period, ISO date; inclusive (closed interval)" }
      - { name: discharge_character, type: enum, source: input, description: "Character of discharge for this period", constraints: "HONORABLE | GENERAL | OTHER_THAN_HONORABLE | BAD_CONDUCT | DISHONORABLE" }
      - { name: qualifying_days, type: integer, source: computed, description: "(end_date - start_date).days + 1 when discharge_character in {HONORABLE, GENERAL}, else 0" }

  - name: CertificateOfEligibility
    parent: Veteran
    common_fields: true
    fields:
      - { name: veteran_id, type: string, source: input, description: "FK -> Veteran.id; subject of the COE request" }
      - { name: status, type: enum, source: computed, description: "COE lifecycle state", constraints: "REQUESTED | DENIED | RECONSIDERATION | ISSUED" }
      - { name: entitlement_code, type: enum, source: input, description: "Entitlement code asserted on the request", constraints: "ERA_WWII | ERA_KOREA | ERA_VIETNAM | ERA_PEACETIME | ERA_GULF | RESTORED | UNREIMBURSED_SURVIVING_SPOUSE" }
      - { name: denial_reason, type: string, source: computed, description: "Machine-set reason on the latest denial (DISCHARGE_INELIGIBLE or INSUFFICIENT_SERVICE); null when not denied" }
      - { name: reconsideration_count, type: integer, source: computed, default: 0, description: "Number of DENIED -> RECONSIDERATION transitions taken; hard cap 2" }
      - { name: issued_at, type: datetime, source: computed, description: "Logical-clock timestamp of issuance; null until ISSUED" }

  - name: EntitlementAccount
    parent: Veteran
    common_fields: true
    fields:
      - { name: veteran_id, type: string, source: computed, description: "FK -> Veteran.id; the 1:1 account is created automatically with the Veteran" }
      - { name: basic_entitlement_cents, type: integer, source: system, default: 3600000, description: "Basic entitlement, fixed $36,000.00" }
      - { name: county_limit_cents, type: integer, source: system, default: 76655000, description: "Conforming county loan limit used for bonus entitlement, fixed $766,550.00" }
      - { name: total_charged_cents, type: integer, source: computed, description: "Sum of entitlement charges posted at loan closings, never decremented" }
      - { name: total_restored_cents, type: integer, source: computed, description: "Sum of entitlement restored by granted EntitlementRestorationRequests or assumption substitution" }
      - { name: remaining_base_cents, type: integer, source: computed, description: "BASE_ONLY variant: max(0, basic_entitlement_cents - (total_charged_cents - total_restored_cents))" }
      - { name: remaining_with_bonus_cents, type: integer, source: computed, description: "WITH_BONUS variant: max(0, county_limit_cents/4 - (total_charged_cents - total_restored_cents))" }

  - name: Loan
    parent: Veteran
    common_fields: true
    fields:
      - { name: veteran_id, type: string, source: input, description: "FK -> Veteran.id; borrower" }
      - { name: coe_id, type: string, source: input, description: "FK -> CertificateOfEligibility.id; must be ISSUED and belong to veteran_id" }
      - { name: purpose, type: enum, source: input, description: "Loan purpose", constraints: "PURCHASE | IRRRL | CASH_OUT_REFINANCE" }
      - { name: property_region, type: enum, source: input, description: "Region of the subject property; drives appraisal assignment and residual-income table", constraints: "NORTHEAST | MIDWEST | SOUTH | WEST" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Purchase price; for refinances equals payoff balance of the prior loan" }
      - { name: down_payment_cents, type: integer, source: input, description: "Down payment in cents; 0 allowed" }
      - { name: loan_amount_cents, type: integer, source: computed, description: "purchase_price_cents - down_payment_cents" }
      - { name: interest_rate_percent, type: number, source: input, description: "Note rate, percent with 3 decimal places (e.g. 6.500)" }
      - { name: rate_type, type: enum, source: input, description: "FIXED | ARM" }
      - { name: term_months, type: integer, source: input, default: 360, description: "Amortization term in months" }
      - { name: originator_user_id, type: string, source: system, description: "X-User-ID of the LoanOfficer who created the loan; segregation-of-duties marker" }
      - { name: underwriting_status, type: enum, source: computed, description: "Parallel state dimension 1", constraints: "SUBMITTED | APPROVED | DENIED" }
      - { name: closing_status, type: enum, source: computed, description: "Parallel state dimension 2", constraints: "NOT_CLOSED | CLOSED | PAID_IN_FULL" }
      - { name: loan_use, type: enum, source: computed, description: "FIRST_USE iff borrower charged_loan_count == 0 at creation, else SUBSEQUENT_USE", constraints: "FIRST_USE | SUBSEQUENT_USE" }
      - { name: entitlement_charged_cents, type: integer, source: computed, default: 0, description: "Entitlement charged at close; min(round(loan_amount_cents * 0.25), remaining_with_bonus_cents)" }
      - { name: down_payment_pct, type: number, source: computed, description: "round_half_up(down_payment_cents * 100 / purchase_price_cents, 4)" }
      - { name: closing_date, type: datetime, source: computed, description: "Set at close; null until CLOSED" }
      - { name: first_payment_due_date, type: datetime, source: computed, description: "Set at close from close payload; null until CLOSED" }
      - { name: payoff_type, type: enum, source: computed, description: "Set by record-payoff", constraints: "SALE | REFINANCE_PAYOFF", default: null }

  - name: FundingFeeAssessment
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: computed, description: "FK -> Loan.id; created automatically with the Loan" }
      - { name: exempt, type: boolean, source: computed, description: "True iff veteran receives_disability_compensation OR is_surviving_spouse at assessment time" }
      - { name: fee_rate, type: number, source: computed, description: "Rate selected by funding_fee_calc; 0 when exempt" }
      - { name: assessed_fee_cents, type: integer, source: computed, description: "floor(loan_amount_cents * fee_rate / 100) * 100 — truncated DOWN to whole dollars; 0 when exempt" }
      - { name: collected_cents, type: integer, source: computed, default: 0, description: "Set to assessed_fee_cents at loan close" }
      - { name: refunded_cents, type: integer, source: computed, default: 0, description: "Set to collected_cents by a retroactive-exemption refund" }
      - { name: status, type: enum, source: computed, description: "ASSESSED | COLLECTED | REFUNDED" }

  - name: Appraiser
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Appraiser name" }
      - { name: region, type: enum, source: input, description: "Coverage region", constraints: "NORTHEAST | MIDWEST | SOUTH | WEST" }
      - { name: max_open_assignments, type: integer, source: input, default: 3, description: "Capacity ceiling for concurrent ASSIGNED appraisals" }
      - { name: open_assignment_count, type: integer, source: computed, default: 0, description: "Count of Appraisals assigned to this appraiser in state ASSIGNED or REPAIRS_REQUIRED" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive appraisers are excluded from assignment" }

  - name: Appraisal
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; subject loan" }
      - { name: appraiser_id, type: string, source: computed, description: "FK -> Appraiser.id; set by the assignment selector policy; null while REQUESTED (queued)" }
      - { name: status, type: enum, source: computed, description: "REQUESTED (queued, unassigned) | ASSIGNED | REPAIRS_REQUIRED | VALUE_ISSUED | CANCELLED" }
      - { name: appraised_value_cents, type: integer, source: computed, description: "Notice-of-value amount set by submit-report outcome VALUE_ISSUED" }
      - { name: report_round, type: integer, source: computed, default: 0, description: "Number of submit-report calls completed on this appraisal" }

  - name: RepairRequirement
    parent: Appraisal
    common_fields: true
    fields:
      - { name: appraisal_id, type: string, source: computed, description: "FK -> Appraisal.id; MPR repair created by a submit-report outcome REPAIRS_REQUIRED" }
      - { name: description, type: string, source: input, description: "Minimum property requirement defect description" }
      - { name: required_for_clearance, type: boolean, source: input, default: true, description: "When true, loan cannot close until this repair is VERIFIED or WAIVED" }
      - { name: status, type: enum, source: computed, description: "OPEN | COMPLETED | VERIFIED | WAIVED" }

  - name: OccupancyCertificate
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: computed, description: "FK -> Loan.id; created automatically in state CERTIFIED at loan close" }
      - { name: certification_date, type: datetime, source: computed, description: "Equals loan closing_date" }
      - { name: move_in_deadline, type: datetime, source: computed, description: "closing_date + 60 days (inclusive)" }
      - { name: status, type: enum, source: computed, description: "CERTIFIED | SATISFIED | EXCEPTED | VIOLATED" }
      - { name: exception_type, type: enum, source: computed, description: "NONE | DEPLOYMENT", default: "NONE" }

  - name: DeploymentException
    parent: Veteran
    common_fields: true
    fields:
      - { name: veteran_id, type: string, source: input, description: "FK -> Veteran.id; deployed borrower" }
      - { name: deployment_start, type: datetime, source: input, description: "Half-open window start [start, end)" }
      - { name: deployment_end, type: datetime, source: input, description: "Half-open window end; end == another window's start is NOT an overlap" }
      - { name: orders_reference, type: string, source: input, description: "Deployment orders document reference" }

  - name: UnderwritingDecision
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; decided loan" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding Underwriter; must differ from loan.originator_user_id" }
      - { name: gross_monthly_income_cents, type: integer, source: input, description: "Stable gross monthly income" }
      - { name: new_housing_payment_cents, type: integer, source: input, description: "Proposed total monthly housing payment" }
      - { name: other_obligations_annual_cents, type: array, source: input, description: "Array of ANNUAL recurring obligation amounts in cents; converted per-item (round_half_up(item/12)) before summing" }
      - { name: family_size, type: integer, source: input, description: "Household size for residual income table (1..7; >5 adds per-member rows)" }
      - { name: region, type: enum, source: input, description: "Residual-income table region", constraints: "NORTHEAST | MIDWEST | SOUTH | WEST" }
      - { name: other_obligations_monthly_cents, type: integer, source: computed, description: "sum(round_half_up(item/12)) over other_obligations_annual_cents" }
      - { name: residual_income_cents, type: integer, source: computed, description: "gross_monthly_income_cents - new_housing_payment_cents - other_obligations_monthly_cents" }
      - { name: residual_required_cents, type: integer, source: computed, description: "Table lookup by (region, family_size) from residual_income_calc constants" }
      - { name: dti_percent, type: number, source: computed, description: "round_half_up(100 * (new_housing_payment_cents + other_obligations_monthly_cents) / gross_monthly_income_cents, 2)" }
      - { name: dti_only_pass, type: boolean, source: computed, description: "Conventional-style variant: dti_percent <= 41.00 (no residual gate)" }
      - { name: outcome, type: enum, source: computed, description: "VA method: APPROVED iff residual_income_cents >= residual_required_cents AND (dti_percent <= 41.00 OR residual_income_cents >= 1.2 * residual_required_cents); else DENIED", constraints: "APPROVED | DENIED" }

  - name: AssumptionRequest
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; existing loan to be assumed" }
      - { name: buyer_name, type: string, source: input, description: "Assuming buyer name" }
      - { name: buyer_is_veteran, type: boolean, source: input, description: "True when the buyer is program-eligible" }
      - { name: buyer_veteran_id, type: string, source: input, description: "FK -> Veteran.id; required when buyer_is_veteran is true, else must be omitted" }
      - { name: substitute_entitlement, type: boolean, source: input, description: "True to substitute buyer entitlement for the seller's; requires buyer_is_veteran" }
      - { name: release_of_liability, type: boolean, source: input, description: "Request release of the original borrower's liability" }
      - { name: status, type: enum, source: computed, description: "SUBMITTED | APPROVED" }

  - name: RefinanceRequest
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; existing loan being refinanced" }
      - { name: refinance_type, type: enum, source: input, description: "IRRRL (streamline) | CASH_OUT", constraints: "IRRRL | CASH_OUT" }
      - { name: new_rate_percent, type: number, source: input, description: "Proposed note rate, 3 decimal places" }
      - { name: new_rate_type, type: enum, source: input, description: "FIXED | ARM" }
      - { name: flat_costs_cents, type: integer, source: input, description: "Allowable closing costs other than the funding fee" }
      - { name: seasoning_days, type: integer, source: computed, description: "min((clock - closing_date).days, (clock - first_payment_due_date).days) at evaluate time" }
      - { name: ntb_rate_satisfied, type: boolean, source: computed, description: "Rate-reduction NTB leg from refinance_seasoning_ntb_calc" }
      - { name: recoupment_months, type: integer, source: computed, description: "ceil(allowable_costs_cents / monthly_savings_cents); IRRRL only" }
      - { name: ntb_satisfied, type: boolean, source: computed, description: "IRRRL: ntb_rate_satisfied AND recoupment_months <= 36; CASH_OUT: ntb_rate_satisfied" }
      - { name: status, type: enum, source: computed, description: "SUBMITTED | SUPERSEDED | APPROVED | REJECTED" }

  - name: EntitlementRestorationRequest
    parent: Veteran
    common_fields: true
    fields:
      - { name: veteran_id, type: string, source: input, description: "FK -> Veteran.id; borrower seeking restoration" }
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan whose charge is to be restored" }
      - { name: restoration_type, type: enum, source: input, description: "SALE_PAYOFF (loan sold and paid) | REFINANCE_PAYOFF (paid by a refinance) | ONE_TIME_RESTORATION (paid in full but retained property; usable once per veteran)", constraints: "SALE_PAYOFF | REFINANCE_PAYOFF | ONE_TIME_RESTORATION" }
      - { name: restored_amount_cents, type: integer, source: computed, description: "Equals the loan's entitlement_charged_cents at grant time" }
      - { name: status, type: enum, source: computed, description: "SUBMITTED | GRANTED" }

  - name: AuditEvent
    parent: null
    common_fields: false
    fields:
      - { name: entity_type, type: string, source: system, description: "Entity name of the mutated resource" }
      - { name: entity_id, type: string, source: system, description: "Id of the mutated resource" }
      - { name: action, type: string, source: system, description: "Endpoint action name (e.g. close, deny, refund)" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the caller" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the caller" }
      - { name: detail, type: string, source: system, description: "Short machine-generated summary of the mutation" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: CertificateOfEligibility
    initial_state: REQUESTED
    terminal_states: [ISSUED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /va-loans/coe-requests/{id}/issue"
        actor: ProgramAdmin
        preconditions:
          - "veteran.character_of_discharge in {HONORABLE, GENERAL}"
          - "veteran.total_qualifying_service_days >= 90 when service_category == REGULAR_MILITARY, >= 180 when RESERVES_NATIONAL_GUARD (waived when is_surviving_spouse)"
          - "every id in payload service_period_ids exists and belongs to this veteran"
        side_effects:
          - "status ISSUED; issued_at = logical clock; veteran.has_issued_coe recomputed true"
          - "AuditEvent appended (action=issue)"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /va-loans/coe-requests/{id}/deny"
        actor: ProgramAdmin
        preconditions: ["coe in REQUESTED"]
        side_effects:
          - "status DENIED; denial_reason set from failing gate (DISCHARGE_INELIGIBLE or INSUFFICIENT_SERVICE)"
          - "CASCADE A link 1: every Loan of this veteran with underwriting_status == SUBMITTED becomes underwriting_status DENIED"
          - "CASCADE A link 2 (caused by link 1): every Appraisal of each such denied Loan in state REQUESTED or ASSIGNED becomes CANCELLED"
          - "CASCADE A link 3 (caused by link 2): each affected Appraiser.open_assignment_count decremented per cancelled ASSIGNED appraisal"
          - "CASCADE A link 4 (caused by link 3): appraisal_queue_promotion runs per freed appraiser — earliest-created still-REQUESTED Appraisal in that appraiser's region becomes ASSIGNED and that appraiser's open_assignment_count increments"
          - "AuditEvent appended (action=deny)"
      - from: DENIED
        to: RECONSIDERATION
        trigger: "POST /va-loans/coe-requests/{id}/reconsider"
        actor: LoanOfficer
        preconditions: ["reconsideration_count < 2 (else ERR_RECONSIDERATION_EXHAUSTED)"]
        side_effects:
          - "status RECONSIDERATION; reconsideration_count += 1"
          - "AuditEvent appended (action=reconsider)"
      - from: RECONSIDERATION
        to: ISSUED
        trigger: "POST /va-loans/coe-requests/{id}/issue"
        actor: ProgramAdmin
        preconditions: ["same gates as REQUESTED->ISSUED"]
        side_effects: ["status ISSUED; issued_at = logical clock; veteran.has_issued_coe recomputed true"]
      - from: RECONSIDERATION
        to: DENIED
        trigger: "POST /va-loans/coe-requests/{id}/deny"
        actor: ProgramAdmin
        preconditions: ["coe in RECONSIDERATION"]
        side_effects: ["status DENIED; denial_reason refreshed; CASCADE A links 1-4 fire exactly as from REQUESTED"]

  - entity: Loan
    initial_state: "underwriting_status=SUBMITTED, closing_status=NOT_CLOSED"
    terminal_states: ["(APPROVED, PAID_IN_FULL)", "(DENIED, NOT_CLOSED)"]
    transitions:
      - from: "underwriting_status=SUBMITTED"
        to: "underwriting_status=APPROVED"
        trigger: "POST /va-loans/loans/{id}/underwriting-decisions with computed outcome APPROVED"
        actor: Underwriter
        preconditions:
          - "loan.underwriting_status == SUBMITTED"
          - "deciding Underwriter X-User-ID != loan.originator_user_id (segregation of duties)"
          - "computed outcome == APPROVED (else the DENIED transition fires)"
        side_effects:
          - "UnderwritingDecision persisted with computed fields"
          - "loan.underwriting_status = APPROVED; loan.version += 1"
          - "AuditEvent appended (action=underwriting_decision)"
      - from: "underwriting_status=SUBMITTED"
        to: "underwriting_status=DENIED"
        trigger: "POST /va-loans/loans/{id}/underwriting-decisions with computed outcome DENIED"
        actor: Underwriter
        preconditions: ["same as APPROVED transition except computed outcome == DENIED"]
        side_effects:
          - "UnderwritingDecision persisted"
          - "loan.underwriting_status = DENIED; loan.version += 1"
          - "cascade: this loan's Appraisals in REQUESTED or ASSIGNED become CANCELLED, appraiser counts decremented, queue promotion runs"
          - "AuditEvent appended (action=underwriting_decision)"
      - from: "closing_status=NOT_CLOSED"
        to: "closing_status=CLOSED"
        trigger: "POST /va-loans/loans/{id}/close"
        actor: LoanOfficer
        preconditions:
          - "loan.underwriting_status == APPROVED (else ERR_LOAN_NOT_CLOSABLE)"
          - "an Appraisal of this loan is in VALUE_ISSUED and its appraised_value_cents >= loan.purchase_price_cents"
          - "no RepairRequirement of any Appraisal of this loan has required_for_clearance == true and status in {OPEN, COMPLETED} (else ERR_REPAIRS_OUTSTANDING)"
          - "entitlement feasibility: loan_amount_cents <= 4 * entitlement_account.remaining_with_bonus_cents, else required down payment round_half_up((loan_amount_cents - 4 * remaining_with_bonus_cents) * 0.25) must be covered by down_payment_cents (else ERR_INSUFFICIENT_ENTITLEMENT)"
        side_effects:
          - "CASCADE B link 1: closing_status = CLOSED; closing_date and first_payment_due_date set from payload; loan.version += 1"
          - "CASCADE B link 2 (caused by link 1): loan.entitlement_charged_cents = min(round_half_up(loan_amount_cents * 0.25), account.remaining_with_bonus_cents); FundingFeeAssessment.status ASSESSED -> COLLECTED with collected_cents = assessed_fee_cents"
          - "CASCADE B link 3 (caused by link 2): EntitlementAccount.total_charged_cents += entitlement_charged_cents; remaining_base_cents and remaining_with_bonus_cents recomputed"
          - "CASCADE B link 4 (caused by link 3): Veteran.charged_loan_count recomputed; OccupancyCertificate created for this loan in state CERTIFIED with move_in_deadline = closing_date + 60 days"
          - "AuditEvent appended (action=close)"
      - from: "closing_status=CLOSED"
        to: "closing_status=PAID_IN_FULL"
        trigger: "POST /va-loans/loans/{id}/record-payoff"
        actor: LoanOfficer
        preconditions: ["loan.closing_status == CLOSED (else ERR_INVALID_STATE)"]
        side_effects:
          - "closing_status = PAID_IN_FULL; payoff_type set from payload; loan.version += 1"
          - "AuditEvent appended (action=record_payoff)"

  - entity: Appraisal
    initial_state: REQUESTED
    terminal_states: [VALUE_ISSUED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: ASSIGNED
        trigger: "system assignment at POST /va-loans/loans/{id}/appraisal-requests creation, or queue promotion when an appraiser slot frees"
        actor: system
        preconditions:
          - "selector policy candidate set non-empty: active appraisers whose region == loan.property_region AND open_assignment_count < max_open_assignments"
        side_effects:
          - "appraiser_id set per selector policy (rank open_assignment_count ASC, tie-break Appraiser.created_at ASC)"
          - "chosen Appraiser.open_assignment_count += 1"
        note: "when the candidate set is empty the Appraisal stays REQUESTED (queued); this is NOT an error"
      - from: ASSIGNED
        to: VALUE_ISSUED
        trigger: "POST /va-loans/appraisal-requests/{id}/submit-report with outcome VALUE_ISSUED"
        actor: Appraiser
        preconditions:
          - "appraisal.status == ASSIGNED or REPAIRS_REQUIRED"
          - "acting Appraiser id == appraisal.appraiser_id (else ERR_APPRAISAL_NOT_ASSIGNED)"
          - "no required_for_clearance RepairRequirement of this appraisal in status OPEN or COMPLETED"
        side_effects:
          - "status VALUE_ISSUED; appraised_value_cents set; report_round += 1; appraiser.open_assignment_count -= 1; queue promotion runs for that appraiser"
          - "AuditEvent appended (action=submit_report)"
      - from: ASSIGNED
        to: REPAIRS_REQUIRED
        trigger: "POST /va-loans/appraisal-requests/{id}/submit-report with outcome REPAIRS_REQUIRED"
        actor: Appraiser
        preconditions: ["same as VALUE_ISSUED transition; repairs array must be non-empty"]
        side_effects:
          - "status REPAIRS_REQUIRED; one RepairRequirement created per repairs[] entry in state OPEN; report_round += 1"
          - "AuditEvent appended (action=submit_report)"
      - from: REPAIRS_REQUIRED
        to: VALUE_ISSUED
        trigger: "POST /va-loans/appraisal-requests/{id}/submit-report with outcome VALUE_ISSUED"
        actor: Appraiser
        preconditions: ["same as ASSIGNED->VALUE_ISSUED (all clearance repairs must be VERIFIED or WAIVED)"]
        side_effects: ["status VALUE_ISSUED; appraised_value_cents set; appraiser.open_assignment_count -= 1; queue promotion runs"]
      - from: REPAIRS_REQUIRED
        to: REPAIRS_REQUIRED
        trigger: "POST /va-loans/appraisal-requests/{id}/submit-report with outcome REPAIRS_REQUIRED"
        actor: Appraiser
        preconditions: ["same appraiser ownership gate"]
        side_effects: ["new RepairRequirements appended in OPEN; prior repairs unchanged; report_round += 1 (self-loop re-inspection round)"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "cascade from Loan denial or COE denial"
        actor: system
        preconditions: []
        side_effects: ["status CANCELLED"]
      - from: ASSIGNED
        to: CANCELLED
        trigger: "cascade from Loan denial or COE denial"
        actor: system
        preconditions: []
        side_effects: ["status CANCELLED; appraiser.open_assignment_count -= 1; queue promotion runs"]

  - entity: RepairRequirement
    initial_state: OPEN
    terminal_states: [VERIFIED, WAIVED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /va-loans/repair-requirements/{id}/complete"
        actor: LoanOfficer
        preconditions: ["repair.status == OPEN", "parent Appraisal.status == REPAIRS_REQUIRED"]
        side_effects: ["status COMPLETED; updated_at refreshed"]
      - from: COMPLETED
        to: VERIFIED
        trigger: "POST /va-loans/repair-requirements/{id}/verify"
        actor: Appraiser
        preconditions: ["repair.status == COMPLETED", "acting Appraiser id == parent Appraisal.appraiser_id"]
        side_effects: ["status VERIFIED"]
      - from: OPEN
        to: WAIVED
        trigger: "POST /va-loans/repair-requirements/{id}/waive"
        actor: ProgramAdmin
        preconditions: ["repair.status == OPEN (segregation: LoanOfficer may NOT waive)"]
        side_effects: ["status WAIVED; AuditEvent appended (action=waive_repair)"]

  - entity: OccupancyCertificate
    initial_state: CERTIFIED
    terminal_states: [SATISFIED, EXCEPTED, VIOLATED]
    transitions:
      - from: CERTIFIED
        to: SATISFIED
        trigger: "POST /va-loans/occupancy-certificates/{id}/verify-occupancy"
        actor: LoanOfficer
        preconditions: ["payload move_in_date <= move_in_deadline"]
        side_effects: ["status SATISFIED"]
      - from: CERTIFIED
        to: EXCEPTED
        trigger: "POST /va-loans/occupancy-certificates/{id}/verify-occupancy"
        actor: LoanOfficer
        preconditions:
          - "payload move_in_date > move_in_deadline"
          - "a DeploymentException of the loan's veteran exists whose half-open window [deployment_start, deployment_end) contains move_in_deadline"
        side_effects: ["status EXCEPTED; exception_type = DEPLOYMENT"]
      - from: CERTIFIED
        to: VIOLATED
        trigger: "POST /va-loans/occupancy-certificates/{id}/verify-occupancy"
        actor: LoanOfficer
        preconditions: ["payload move_in_date > move_in_deadline", "no covering DeploymentException"]
        side_effects: ["status VIOLATED; AuditEvent appended (action=occupancy_violation)"]

  - entity: FundingFeeAssessment
    initial_state: ASSESSED
    terminal_states: [REFUNDED]
    transitions:
      - from: ASSESSED
        to: COLLECTED
        trigger: "cascade from POST /va-loans/loans/{id}/close"
        actor: system
        preconditions: []
        side_effects: ["collected_cents = assessed_fee_cents"]
      - from: COLLECTED
        to: REFUNDED
        trigger: "POST /va-loans/funding-fee-assessments/{id}/refund"
        actor: ProgramAdmin
        preconditions:
          - "assessment.status == COLLECTED (else ERR_FEE_NOT_REFUNDABLE)"
          - "payload disability_evidence == true (retroactive exemption determination)"
        side_effects:
          - "refunded_cents = collected_cents; status REFUNDED; exempt recomputed true"
          - "AuditEvent appended (action=refund)"

  - entity: AssumptionRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /va-loans/assumption-requests/{id}/approve"
        actor: Underwriter
        preconditions:
          - "loan.closing_status == CLOSED (not PAID_IN_FULL)"
          - "when substitute_entitlement: buyer_is_veteran must be true, buyer_veteran_id must exist, and buyer account remaining_with_bonus_cents >= loan.entitlement_charged_cents (else ERR_ASSUMPTION_INELIGIBLE)"
        side_effects:
          - "status APPROVED"
          - "when substitute_entitlement: buyer EntitlementAccount.total_charged_cents += loan.entitlement_charged_cents; seller EntitlementAccount.total_restored_cents += loan.entitlement_charged_cents; both accounts' remaining fields recomputed; both veterans' charged_loan_count recomputed"
          - "AuditEvent appended (action=approve_assumption)"

  - entity: RefinanceRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "a later POST /va-loans/loans/{id}/refinance-requests on the same loan succeeds"
        actor: system
        preconditions: []
        side_effects: ["prior SUBMITTED request becomes SUPERSEDED when the new request is created"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /va-loans/refinance-requests/{id}/evaluate"
        actor: Underwriter
        preconditions: ["seasoning_days >= 210 (else ERR_SEASONING_NOT_MET)", "ntb_satisfied == true (else ERR_NTB_NOT_SATISFIED)"]
        side_effects: ["status APPROVED; AuditEvent appended (action=evaluate_refinance)"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /va-loans/refinance-requests/{id}/evaluate"
        actor: Underwriter
        preconditions: ["seasoning_days >= 210", "ntb_satisfied == false"]
        side_effects: ["status REJECTED"]

  - entity: EntitlementRestorationRequest
    initial_state: SUBMITTED
    terminal_states: [GRANTED]
    transitions:
      - from: SUBMITTED
        to: GRANTED
        trigger: "POST /va-loans/entitlement-restoration-requests/{id}/grant"
        actor: ProgramAdmin
        preconditions:
          - "loan.closing_status == PAID_IN_FULL (else ERR_LOAN_NOT_PAID_OFF)"
          - "restoration_type SALE_PAYOFF requires loan.payoff_type == SALE; REFINANCE_PAYOFF requires payoff_type == REFINANCE_PAYOFF; ONE_TIME_RESTORATION requires the veteran has no prior GRANTED ONE_TIME_RESTORATION request"
        side_effects:
          - "restored_amount_cents = loan.entitlement_charged_cents; status GRANTED"
          - "EntitlementAccount.total_restored_cents += restored_amount_cents; remaining fields recomputed; veteran.charged_loan_count recomputed"
          - "AuditEvent appended (action=grant_restoration)"

# =============================================================================
# Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: refinance-create-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /va-loans/loans/{id}/refinance-requests"
    occ_field: "expected_loan_version"
    description: |
      Creating a RefinanceRequest against a Loan whose version has advanced
      since the client last observed it is rejected. Creating a new request
      legitimately supersedes a prior SUBMITTED one, so a client holding a
      stale loan view would silently supersede a request it never saw; the
      stale expected_loan_version is therefore refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: qualifying_service_days
    trigger: "on ServicePeriod creation; Veteran.total_qualifying_service_days recomputed"
    algorithm: interval_merge
    formula: |
      for each ServicePeriod p of the veteran:
        if p.discharge_character in {HONORABLE, GENERAL}:
          p.qualifying_days = (p.end_date - p.start_date).days + 1   # closed interval, inclusive
        else:
          p.qualifying_days = 0
      veteran.total_qualifying_service_days = sum(p.qualifying_days)
      Overlap rejection (create-time, NOT merged): closed-interval semantics —
      a new period is rejected when NOT (new.end_date < existing.start_date OR new.start_date > existing.end_date)
      for any existing period of the same veteran; touching endpoints (new.start_date == existing.end_date) COLLIDE.
    input_set: "all ServicePeriods of the veteran, any discharge character"
    constants:
      MIN_DAYS_REGULAR_MILITARY: 90
      MIN_DAYS_RESERVES_NATIONAL_GUARD: 180
    precision: "integer days"
    variants: []

  - name: remaining_entitlement_calc
    trigger: "recomputed on every Loan close (charge), every restoration grant, and every entitlement-substituting assumption approval"
    algorithm: aggregation
    formula: |
      in_use = total_charged_cents - total_restored_cents
      remaining_base_cents       = max(0, basic_entitlement_cents - in_use)
      remaining_with_bonus_cents = max(0, county_limit_cents / 4 - in_use)
      Close-time feasibility (pinned): required_down_cents =
        0 when loan_amount_cents <= 4 * remaining_with_bonus_cents
        else round_half_up((loan_amount_cents - 4 * remaining_with_bonus_cents) * 0.25)
      Charge posted at close: entitlement_charged_cents = min(round_half_up(loan_amount_cents * 0.25), remaining_with_bonus_cents)
    input_set: "EntitlementAccount of the borrower; all of the veteran's Loans with closing_status in {CLOSED, PAID_IN_FULL} contribute via total_charged_cents"
    constants:
      BASIC_ENTITLEMENT_CENTS: 3600000
      COUNTY_LIMIT_CENTS: 76655000
      GUARANTY_FRACTION: 0.25
    precision: "integer cents; round_half_up where noted"
    variants:
      - name: base_only
        when: "exposed as EntitlementAccount.remaining_base_cents"
        difference: "caps guaranty capacity at $36,000.00; identical inputs yield remaining_base 0 once a $300,000 loan has charged $75,000, while with_bonus still yields $116,637.50"
      - name: with_bonus
        when: "exposed as EntitlementAccount.remaining_with_bonus_cents; used by close-time feasibility"
        difference: "guaranty capacity is 25% of the county limit ($191,637.50), so the same charge history leaves a strictly larger remaining entitlement"

  - name: funding_fee_calc
    trigger: "on Loan creation; FundingFeeAssessment created with computed fields"
    algorithm: tiered_pricing
    formula: |
      if veteran.receives_disability_compensation OR veteran.is_surviving_spouse:
        exempt = true; fee_rate = 0; assessed_fee_cents = 0
      else:
        dp_pct = round_half_up(down_payment_cents * 100 / purchase_price_cents, 4)
        if purpose == IRRRL: fee_rate = 0.50
        elif purpose == CASH_OUT_REFINANCE:
          fee_rate = 2.15 if loan_use == FIRST_USE else 3.30        # down payment NOT considered
        else:                                                        # PURCHASE
          if loan_use == FIRST_USE:
            fee_rate = 2.15 if dp_pct < 5.0000 else (1.50 if dp_pct < 10.0000 else 1.25)
          else:
            fee_rate = 3.30 if dp_pct < 5.0000 else (1.50 if dp_pct < 10.0000 else 1.25)
        assessed_fee_cents = floor(loan_amount_cents * fee_rate / 100 / 100) * 100
        # i.e. fee dollars truncated DOWN to the nearest whole dollar
    input_set: "the Loan being created plus its borrower Veteran (exemption flags, loan_use)"
    constants:
      FIRST_USE_LT5: 2.15
      FIRST_USE_5_TO_10: 1.50
      FIRST_USE_GE10: 1.25
      SUBSEQUENT_LT5: 3.30
      SUBSEQUENT_5_TO_10: 1.50
      SUBSEQUENT_GE10: 1.25
      IRRRL_RATE: 0.50
      CASHOUT_FIRST: 2.15
      CASHOUT_SUBSEQUENT: 3.30
      TIER_BOUNDARY_LOW: 5.0000
      TIER_BOUNDARY_HIGH: 10.0000
    precision: "dp_pct at 4 decimal places round_half_up; fee truncated DOWN to whole dollars (floor to 100 cents)"
    variants:
      - name: financed_vs_cash
        when: "fee financing choice does not change assessed_fee_cents in this scaffold; the variant that matters is exemption"
        difference: "exempt == true forces fee 0 regardless of tier; the same loan for a non-exempt veteran prices the tiered rate"
      - name: subsequent_use
        when: "borrower has any prior charged loan (charged_loan_count > 0 at creation)"
        difference: "the <5% down-payment tier jumps 2.15% -> 3.30% on PURCHASE while the 5%-and-up tiers are unchanged"

  - name: dti_calc
    trigger: "on POST underwriting-decisions; computes dti_percent and other_obligations_monthly_cents"
    algorithm: aggregation
    formula: |
      # PINNED rounding order (nested rounding, mode b): convert each ANNUAL
      # obligation to monthly FIRST, rounding each item, THEN sum:
      other_obligations_monthly_cents = sum(round_half_up(item / 12) for item in other_obligations_annual_cents)
      # (the rejected alternative — sum the annual items, then divide by 12 and
      # round once — yields a different total, e.g. [12500,12500,12500] gives
      # 3126 under the pinned order vs 3125 under the alternative)
      total_monthly_debts = new_housing_payment_cents + other_obligations_monthly_cents
      dti_percent = round_half_up(100 * total_monthly_debts / gross_monthly_income_cents, 2)
      dti gate: dti_percent <= 41.00 passes; 41.00 exactly passes; 41.01 fails
      unless the residual compensating factor applies (see residual_income_calc)
    input_set: "payload of a single UnderwritingDecision"
    constants:
      DTI_LIMIT: 41.00
    precision: "2 decimal places, round_half_up; per-item monthly conversion rounded BEFORE summing"
    variants: []

  - name: residual_income_calc
    trigger: "on POST underwriting-decisions; computes residual_income_cents and residual_required_cents"
    algorithm: threshold
    formula: |
      residual_income_cents = gross_monthly_income_cents - new_housing_payment_cents - other_obligations_monthly_cents
      residual_required_cents = TABLE[region][min(family_size, 5)] + max(0, family_size - 5) * OVER_FIVE_STEP
      residual gate: residual_income_cents >= residual_required_cents (equality passes)
      compensating factor: when dti_percent > 41.00, outcome may still be APPROVED
      iff residual_income_cents >= round_half_up(residual_required_cents * 1.2)
    input_set: "payload of a single UnderwritingDecision"
    constants:
      TABLE_NORTHEAST: [45000, 75500, 90900, 102500, 106200]
      TABLE_MIDWEST: [44100, 73800, 88900, 100300, 103900]
      TABLE_SOUTH: [44100, 73800, 88900, 100300, 103900]
      TABLE_WEST: [49100, 82300, 99000, 111700, 115800]
      OVER_FIVE_STEP: 8000
      COMPENSATING_FACTOR: 1.2
    precision: "integer cents"
    variants:
      - name: dti_only
        when: "exposed as UnderwritingDecision.dti_only_pass (conventional-style benchmark, NOT the decision gate)"
        difference: "ignores the residual gate entirely; identical income data can yield dti_only_pass true while the VA outcome is DENIED for insufficient residual income"

  - name: refinance_seasoning_ntb_calc
    trigger: "on POST refinance-requests/{id}/evaluate"
    algorithm: threshold
    formula: |
      # PINNED evaluation order (mode c — circular-looking dependency resolved):
      # the funding fee depends on the new base, the costs include the fee, and
      # the new payment depends on the costs. Evaluate strictly in this order:
      (1) new_base_cents = loan.loan_amount_cents                      # payoff balance carried over
      (2) fee_cents = floor(new_base_cents * 0.005 / 100) * 100        # IRRRL 0.50% truncated to whole dollars; CASH_OUT uses funding_fee_calc rate
      (3) allowable_costs_cents = fee_cents + flat_costs_cents
      (4) new_principal_cents = new_base_cents + allowable_costs_cents
      (5) old_payment_cents = round_half_up(amortize(loan.loan_amount_cents, loan.interest_rate_percent, 360))
          new_payment_cents = round_half_up(amortize(new_principal_cents, new_rate_percent, 360))
          amortize(P, annual_pct, n) = P * r * (1+r)^n / ((1+r)^n - 1) with r = annual_pct/100/12
      (6) monthly_savings_cents = old_payment_cents - new_payment_cents
      (7) recoupment_months = ceil(allowable_costs_cents / monthly_savings_cents) when monthly_savings_cents > 0 else 999999
      seasoning_days = min((clock - loan.closing_date).days, (clock - loan.first_payment_due_date).days)
      seasoning gate: seasoning_days >= 210 (210 exactly passes)
      rate NTB: reduction = loan.interest_rate_percent - new_rate_percent
        loan FIXED -> new FIXED: reduction >= 0.50
        loan FIXED -> new ARM:   reduction >= 2.00
        loan ARM   -> new FIXED: always satisfied
        loan ARM   -> new ARM:   reduction >= 0.50
      ntb_satisfied (IRRRL) = rate leg AND recoupment_months <= 36
      ntb_satisfied (CASH_OUT) = rate leg only
    input_set: "the RefinanceRequest, its parent Loan, and the logical clock"
    constants:
      SEASONING_DAYS: 210
      IRRRL_FEE_RATE: 0.50
      RECOUPMENT_LIMIT_MONTHS: 36
      NTB_FIXED_TO_FIXED: 0.50
      NTB_FIXED_TO_ARM: 2.00
      TERM_MONTHS: 360
    precision: "payments round_half_up to whole cents; recoupment_months = ceiling division"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Veteran role may only act on the subtree of the veteran whose id == X-User-ID", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all endpoints under /va-loans/veterans/{id} when role == Veteran" }
  - { priority: 4, category: auth, check: "segregation of duties: underwriting decision rejected when X-User-ID == loan.originator_user_id", error_id: ERR_UNDERWRITER_IS_ORIGINATOR, http_status: 403, applies_to: "POST /va-loans/loans/{id}/underwriting-decisions" }
  - { priority: 5, category: existence, check: "path ids resolve left-to-right (veteran, then loan/coe/appraisal/etc.)", error_id: ERR_VETERAN_NOT_FOUND, http_status: 404, applies_to: "endpoints with {id} path params (specific variant per segment)" }
  - { priority: 6, category: existence, check: "request-shape: required fields present, types correct, ssn_last4 four digits (malformed shape -> ERR_VALIDATION; undeclared enum member -> ERR_INVALID_ENUM)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all mutating endpoints" }
  - { priority: 7, category: state, check: "target entity is in a state that permits the transition (generic invalid-from rejection)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 8, category: state, check: "loan creation requires an ISSUED COE of the same veteran", error_id: ERR_COE_NOT_ISSUED, http_status: 409, applies_to: "POST /va-loans/veterans/{id}/loans" }
  - { priority: 9, category: state, check: "close requires underwriting_status APPROVED", error_id: ERR_LOAN_NOT_CLOSABLE, http_status: 409, applies_to: "POST /va-loans/loans/{id}/close" }
  - { priority: 10, category: state, check: "restoration grant requires loan PAID_IN_FULL", error_id: ERR_LOAN_NOT_PAID_OFF, http_status: 409, applies_to: "POST /va-loans/entitlement-restoration-requests/{id}/grant" }
  - { priority: 11, category: state, check: "fee refund requires status COLLECTED", error_id: ERR_FEE_NOT_REFUNDABLE, http_status: 409, applies_to: "POST /va-loans/funding-fee-assessments/{id}/refund" }
  - { priority: 12, category: state, check: "COE reconsideration cap 2", error_id: ERR_RECONSIDERATION_EXHAUSTED, http_status: 409, applies_to: "POST /va-loans/coe-requests/{id}/reconsider" }
  - { priority: 13, category: state, check: "submit-report only by the assigned appraiser on an ASSIGNED or REPAIRS_REQUIRED appraisal", error_id: ERR_APPRAISAL_NOT_ASSIGNED, http_status: 409, applies_to: "POST /va-loans/appraisal-requests/{id}/submit-report" }
  - { priority: 14, category: state, check: "OCC: expected_loan_version must equal Loan.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /va-loans/loans/{id}/refinance-requests" }
  - { priority: 15, category: business_safety, check: "character of discharge in {HONORABLE, GENERAL} for COE issue", error_id: ERR_DISCHARGE_INELIGIBLE, http_status: 422, applies_to: "POST /va-loans/coe-requests/{id}/issue" }
  - { priority: 16, category: business_safety, check: "total_qualifying_service_days >= category minimum (90 regular / 180 guard; waived for surviving spouse)", error_id: ERR_INSUFFICIENT_SERVICE, http_status: 422, applies_to: "POST /va-loans/coe-requests/{id}/issue" }
  - { priority: 17, category: business_referential, check: "every service_period_ids entry exists and belongs to the COE's veteran (checked AFTER safety gates)", error_id: ERR_SERVICE_PERIOD_MISMATCH, http_status: 422, applies_to: "POST /va-loans/coe-requests/{id}/issue" }
  - { priority: 18, category: business_referential, check: "coe_id belongs to path veteran; buyer_veteran_id exists when required", error_id: ERR_SERVICE_PERIOD_MISMATCH, http_status: 422, applies_to: "POST /va-loans/veterans/{id}/loans, POST /va-loans/loans/{id}/assumption-requests" }
  - { priority: 19, category: business_temporal, check: "closed-interval overlap rejection for a veteran's ServicePeriods (touching endpoints collide)", error_id: ERR_SERVICE_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /va-loans/veterans/{id}/service-periods" }
  - { priority: 20, category: business_temporal, check: "half-open overlap rejection for a veteran's DeploymentException windows (end == start allowed)", error_id: ERR_DEPLOYMENT_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /va-loans/veterans/{id}/deployment-exceptions" }
  - { priority: 21, category: business_temporal, check: "refinance seasoning_days >= 210 at evaluate", error_id: ERR_SEASONING_NOT_MET, http_status: 422, applies_to: "POST /va-loans/refinance-requests/{id}/evaluate" }
  - { priority: 22, category: business_constraint, check: "net tangible benefit evaluated AFTER seasoning: when ntb_satisfied is false the request transitions to REJECTED (persisted), never an error response", error_id: ERR_SEASONING_NOT_MET, http_status: 422, applies_to: "POST /va-loans/refinance-requests/{id}/evaluate" }
  - { priority: 23, category: business_constraint, check: "no clearance-required repair in OPEN or COMPLETED at close / at VALUE_ISSUED report", error_id: ERR_REPAIRS_OUTSTANDING, http_status: 409, applies_to: "POST /va-loans/loans/{id}/close, POST /va-loans/appraisal-requests/{id}/submit-report" }
  - { priority: 24, category: business_constraint, check: "assumption buyer eligibility (veteran status, substitution capacity, loan CLOSED)", error_id: ERR_ASSUMPTION_INELIGIBLE, http_status: 422, applies_to: "POST /va-loans/assumption-requests/{id}/approve" }
  - { priority: 25, category: business_constraint, check: "0 <= down_payment_cents <= purchase_price_cents", error_id: ERR_INVALID_DOWN_PAYMENT, http_status: 422, applies_to: "POST /va-loans/veterans/{id}/loans" }
  - { priority: 26, category: business_fiscal, check: "entitlement feasibility at close (bonus-tier guaranty covers loan or down payment covers the shortfall)", error_id: ERR_INSUFFICIENT_ENTITLEMENT, http_status: 422, applies_to: "POST /va-loans/loans/{id}/close" }

