          assert:
            - "${e_second_review} == ERR_STATEMENT_NOT_REVIEWABLE with HTTP 409"
            - "FinancialStatement.${fs1}.status is still ACCEPTED with reviewed_by_user_id == u-ca-1 and version == 2"
            - "${e_second_complete} == ERR_QC_REVIEW_NOT_OPEN with HTTP 409"
            - "QualityControlReview.${q1}.status == COMPLETED, outcome == PASS (not FAIL), findings_count == 2, critical_findings_count == 0"
            - "QualityControlReview.${q1}.completed_at == 2026-08-01T00:00:00Z and version == 2"

      - name: defect_cure_and_suspense_clearance_are_each_single_shot
        claim_type: idempotency
        grounds:
          - validations[priority 25]
          - validations[priority 26]
          - state_machines.Defect.terminal_states
          - state_machines.SuspenseCondition.terminal_states
        distinguishing_aspect: |
          Once a Defect is CURED it accepts neither a second cure NOR a waive —
          both endpoints share ERR_DEFECT_NOT_OPEN — and a CLEARED condition
          refuses a second clear with ERR_CONDITION_NOT_OPEN. The retries also
          leave the loan roll-ups alone: open_defect_count and
          open_suspense_count stay 0 and review_cycle_count stays 1, so a
          replayed request cannot double-decrement the counters.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CHAIN-APPROVED seller ${s1}, product ${p_conf}, commitment ${c1}, loan ${l1} in IN_REVIEW"
            - "one CURABLE LOW defect ${d1} (cure_deadline_at 2026-08-16T00:00:00Z) and one condition ${cd1} (due_at 2026-08-08T00:00:00Z) — the loan is SUSPENDED"
            - "the defect is cured and the condition cleared, returning the loan to IN_REVIEW with review_cycle_count 1"
          setup_api_calls:
            - call: "POST /correspondent/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
