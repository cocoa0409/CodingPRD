          Category pair business_safety/not-verified (priority 5,
          ERR_CLIENT_NOT_VERIFIED) vs business_safety/waiver (priority 7,
          ERR_WAIVER_MISSING) — a different ordered pair than instance 1.
          A HELD appointment whose client is UNVERIFIED and that has NO waiver
          returns the higher-priority ERR_CLIENT_NOT_VERIFIED.
        test_recipe:
          setup:
            - "One Artist; one Chair; one UNVERIFIED Client; one HELD appointment with deposit met but no waiver."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: StudioManager
            - call: "POST /studio/artists"
              payload: { display_name: "P7 Artist", discipline: "TATTOO", hourly_rate_cents: 18000, commission_pct: 0.70 }
              as: StudioManager
              captures: { artist_id: $.data.id }
            - call: "POST /studio/chairs"
              payload: { label: "P7 Chair", cleanup_buffer_minutes: 30 }
              as: StudioManager
              captures: { chair_id: $.data.id, chair_v: $.data.version }
            - call: "POST /studio/clients"
              payload: { full_name: "P7 Client", email: "p7@x.com", date_of_birth: "1990-02-02" }
              as: Anonymous
              captures: { client_id: $.data.id }
            - call: "POST /studio/appointments"
              payload: { artist_id: "${artist_id}", client_id: "${client_id}", chair_id: "${chair_id}", expected_chair_version: "${chair_v}", pricing_mode: "HOURLY", hourly_rate_cents: 18000, estimated_minutes: 180, start_at: "2026-06-10T10:00:00Z", end_at: "2026-06-10T13:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { ap_id: $.data.id, ap_v: $.data.version }
            - call: "POST /studio/appointments/${ap_id}/deposits"
              payload: { amount_cents: 10800, expected_appointment_version: "${ap_v}" }
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /studio/appointments/${ap_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_CLIENT_NOT_VERIFIED"
            - "trigger response HTTP status == 422"

