              captures: { cl_lo_id: $.data.id }
            - call: "POST /contracts/${ctr_lo_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_lo_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_x_id}", facility_item_code: "FAC-RNK-X", par_qty: 50, reorder_point: 10 }
