            - call: "POST /ocean-billing/return-locations"
              payload: { location_code: "LOC-1", terminal_id: "${term_oak}", accepts_equipment_types: ["DRY40"], daily_empty_capacity: 10 }
              as: EquipmentController
            - call: "POST /ocean-billing/containers"
              payload: { container_number: "MATU0000144", equipment_type: "DRY40", customer_account_id: "${acct_l}", service_contract_id: "${ctr_l}", terminal_id: "${term_oak}", discharge_ts: "2026-08-31T12:00:00Z", available_ts: "2026-09-01T12:00:00Z" }
              as: TerminalOperator
              captures: { cntr_l: $.data.id }
            - call: "POST /ocean-billing/containers/${cntr_l}/mark-available"
              payload: {}
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_l}/gate-out"
              payload: { slot_override: true, slot_override_reason: "waived" }
              as: TerminalOperator
            - call: "POST /ocean-billing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-29T12:00:00Z" }
              as: TerminalOperator
            - call: "POST /ocean-billing/containers/${cntr_l}/return-empty"
              payload: {}
              as: EquipmentController
            - call: "POST /ocean-billing/containers/${cntr_l}/issue-invoice"
              payload: {}
