            - "MarginCall.${call2_id}.call_amount_usd == 4000.00"
            - "MarginCall.${call2_id}.id != MarginCall.${call1_id}.id"

  - rule_id: transitive_cascade
    instances:
      - name: delivery_apply_settles_contract_lifts_hedge_recomputes_desk
        grounds:
