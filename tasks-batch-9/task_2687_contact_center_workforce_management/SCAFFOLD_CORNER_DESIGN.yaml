  - section: rbac
    instances:
      - name: capacity_planner_exclusive_planning_cycle_creation_returns_unauthorized
        claim_type: other_role_exclusive_operations_denied
        grounds:
          - roles.CapacityPlanner.exclusive_operations
          - validations[priority=20]
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: |
          POST /planning-cycles is CapacityPlanner-exclusive, so all seven other declared roles are
          refused with ERR_UNAUTHORIZED (403) -- including PartnerRep, which is additionally absent
          from the roles list of the cycle read endpoint. Authorization is evaluated at priority 20,
          BEFORE body shape at 25 and before path-id resolution at 30, so a well-formed payload from
          the wrong role and a deliberately malformed payload from the wrong role both answer 403
          rather than ERR_VALIDATION, and no PlanningCycle row is created by any of the attempts.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CapacityPlanner
          trigger:
            - call: "POST /planning-cycles"
              payload: { name: "W37-WA", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13" }
              as: WorkforceAnalyst
              captures: { e_wa: "$.data.error_id" }
            - call: "POST /planning-cycles"
              payload: { name: "W37-SM", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13" }
              as: SchedulingManager
              captures: { e_sm: "$.data.error_id" }
            - call: "POST /planning-cycles"
              payload: { name: "W37-IC", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13" }
              as: IntradayController
              captures: { e_ic: "$.data.error_id" }
            - call: "POST /planning-cycles"
              payload: { name: "W37-TC", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13" }
              as: TeamCoach
              captures: { e_tc: "$.data.error_id" }
            - call: "POST /planning-cycles"
              payload: { name: "W37-SRC", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13" }
              as: SourcingManager
              captures: { e_src: "$.data.error_id" }
            - call: "POST /planning-cycles"
              payload: { horizon_start_date: "2026-09-13", horizon_end_date: "2026-09-07" }
              as: TeamCoach
              captures: { e_shape: "$.data.error_id" }
            - call: "GET /planning-cycles"
              payload: {}
              as: CapacityPlanner
          assert:
            - "e_wa, e_sm, e_ic, e_tc and e_src are all \"ERR_UNAUTHORIZED\" with status 403"
            - "e_shape == \"ERR_UNAUTHORIZED\" too: priority 20 fires before the priority-25 body check, so the missing `name` and the reversed horizon are never reported"
            - "the final list read answers total_count 0 -- six refused attempts created nothing"
            - "the same payload as CapacityPlanner answers 201, proving the endpoint itself works"

      - name: request_missing_x_user_id_header_returns_unauthenticated
        claim_type: other_role_exclusive_operations_denied
        grounds:
          - validations[priority=10]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          Priority 10 covers three distinct authentication faults and all three answer
          ERR_UNAUTHENTICATED (401), never 403 and never 422: X-User-ID absent, X-User-Role absent,
          and X-User-Role naming a role that is not one of the eight declared in §1.7. The last case
          is what separates authentication from authorization -- an undeclared role name is not
          "some role that lacks permission", it is an unauthenticated request. Authentication also
          precedes path-id resolution, so an unauthenticated GET on a nonexistent id is 401 and not
          404.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; empty database."
            - "The four trigger calls below are issued with deliberately broken identity headers; the `as:` values name the intended sender only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CapacityPlanner
          trigger:
            # X-User-Role: CapacityPlanner is sent, X-User-ID is omitted entirely.
            - call: "POST /planning-cycles"
              payload: { name: "W37-NOID", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13" }
              as: CapacityPlanner
              captures: { e_no_id: "$.data.error_id" }
            # X-User-ID: u-planner-1 is sent, X-User-Role is omitted entirely.
            - call: "POST /planning-cycles"
              payload: { name: "W37-NOROLE", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13" }
              as: CapacityPlanner
              as_user_id: "u-planner-1"
              captures: { e_no_role: "$.data.error_id" }
            # Both headers present, but X-User-Role: PayrollClerk is not a declared role.
            - call: "POST /planning-cycles"
              payload: { name: "W37-BADROLE", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13" }
              as: PayrollClerk
              as_user_id: "u-payroll-1"
              captures: { e_bad_role: "$.data.error_id" }
            # Undeclared role reading a nonexistent id: 401 wins over the 404.
            - call: "GET /planning-cycles/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: PayrollClerk
              as_user_id: "u-payroll-1"
              captures: { e_bad_role_read: "$.data.error_id" }
            - call: "GET /planning-cycles"
              payload: {}
              as: CapacityPlanner
          assert:
            - "e_no_id == \"ERR_UNAUTHENTICATED\" with status 401"
            - "e_no_role == \"ERR_UNAUTHENTICATED\" with status 401"
            - "e_bad_role == \"ERR_UNAUTHENTICATED\", not ERR_UNAUTHORIZED: an undeclared role fails authentication at priority 10"
            - "e_bad_role_read == \"ERR_UNAUTHENTICATED\" and NOT ERR_PLANNING_CYCLE_NOT_FOUND -- priority 10 precedes priority 30"
            - "the final list read answers total_count 0 -- no cycle was created by any unauthenticated attempt"

      - name: agent_cannot_bid_on_behalf_of_another_agent
        claim_type: peer_roles
        grounds:
          - roles.Agent.identity
          - errors.ERR_OWNERSHIP_VIOLATION
        distinguishing_aspect: |
          Agent is entity_backed:Agent, so the acting X-User-ID must equal the Agent row the write
          touches. A1 submitting a bid whose agent_id is A2, and A1 withdrawing A2's own bid, both
          answer ERR_OWNERSHIP_VIOLATION (403) -- a 403 that is NOT ERR_UNAUTHORIZED, because the
          role is correct and only the identity is wrong. The same two calls from A2 succeed, so the
          refusal is identity-scoped rather than a blanket denial, and A2's bid is never mutated by
          the impostor.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; OPEN cycle W37-OWNBID with one Monday VOICE_EN template (2 slots)."
            - "Two VOICE_EN agents A1 (E-001) and A2 (E-002); bid round R-1 moved to OPEN."
            - "A2 has already submitted its own bid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SchedulingManager
            - call: "POST /planning-cycles"
              payload: { name: "W37-OWNBID", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13", interval_minutes: 30, requirement_basis: "MAX_OF_BOTH", ot_budget_cents: 1000000, intraday_alert_short_threshold: 99 }
              as: CapacityPlanner
              captures: { cyc_id: "$.data.id" }
            - call: "POST /labor-agreements"
              payload: { code: "LA-CORE", min_rest_hours: 11, max_weekly_hours: 45, max_consecutive_days: 6, vto_min_notice_hours: 12, preference_honor_floor_pct: 0.50, ot_premium_multiplier: 1.00 }
              as: CapacityPlanner
              captures: { la_id: "$.data.id" }
            - call: "POST /agents"
              payload: { labor_agreement_id: "${la_id}", employee_code: "E-001", full_name: "Agent One", skills: ["VOICE_EN"], seniority_rank: 1, weekly_contracted_hours: 37.5, hourly_rate_cents: 2400 }
              as: SchedulingManager
              captures: { ag1_id: "$.data.id" }
            - call: "POST /agents"
              payload: { labor_agreement_id: "${la_id}", employee_code: "E-002", full_name: "Agent Two", skills: ["VOICE_EN"], seniority_rank: 2, weekly_contracted_hours: 37.5, hourly_rate_cents: 2400 }
              as: SchedulingManager
              captures: { ag2_id: "$.data.id" }
            - call: "POST /shift-templates"
              payload: { planning_cycle_id: "${cyc_id}", code: "T-MON", skill_code: "VOICE_EN", start_time_local: "08:00", duration_minutes: 480, days_of_week: [0], slots_total: 2, unpaid_break_minutes: 30 }
              as: SchedulingManager
              captures: { t_mon: "$.data.id" }
            - call: "POST /bid-rounds"
              payload: { planning_cycle_id: "${cyc_id}", code: "R-1", max_reopen_count: 2 }
              as: SchedulingManager
              captures: { r1_id: "$.data.id" }
            - call: "POST /bid-rounds/${r1_id}/status"
              payload: { target_status: "OPEN" }
              as: SchedulingManager
            - call: "POST /shift-bids"
              payload: { bid_round_id: "${r1_id}", agent_id: "${ag2_id}", preference_template_ids: ["${t_mon}"] }
              as: Agent
              as_user_id: "${ag2_id}"
              captures: { bid2_id: "$.data.id", bid2_status: "$.data.status" }
          trigger:
            - call: "POST /shift-bids"
              payload: { bid_round_id: "${r1_id}", agent_id: "${ag2_id}", preference_template_ids: ["${t_mon}"] }
              as: Agent
              as_user_id: "${ag1_id}"
              captures: { e_impostor: "$.data.error_id" }
            - call: "POST /shift-bids/${bid2_id}/withdraw"
              payload: {}
              as: Agent
              as_user_id: "${ag1_id}"
              captures: { e_withdraw: "$.data.error_id" }
            - call: "GET /shift-bids/${bid2_id}"
              payload: {}
              as: SchedulingManager
              captures: { bid2_after: "$.data.status", bid2_owner: "$.data.agent_id" }
            - call: "POST /shift-bids"
              payload: { bid_round_id: "${r1_id}", agent_id: "${ag1_id}", preference_template_ids: ["${t_mon}"] }
              as: Agent
              as_user_id: "${ag1_id}"
              captures: { own_ok: "$.data.status" }
          assert:
            - "bid2_status == \"SUBMITTED\""
            - "e_impostor == \"ERR_OWNERSHIP_VIOLATION\" with status 403, not ERR_UNAUTHORIZED and not ERR_DUPLICATE_BID"
            - "e_withdraw == \"ERR_OWNERSHIP_VIOLATION\": withdrawal is scoped to the bid's own agent"
            - "bid2_after == \"SUBMITTED\" and bid2_owner == ${ag2_id} -- untouched"
            - "own_ok == \"SUBMITTED\": the identical call for A1's own agent_id succeeds"

      - name: proposer_cannot_commit_own_allocation
        claim_type: segregation_of_duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - state_machines.PartnerAllocation.PROPOSED_to_COMMITTED
        distinguishing_aspect: |
          Both sides of the allocation commitment are SourcingManager operations, so the split is by
          X-User-ID and not by role: u-src-1 proposed the row, therefore u-src-1 cannot commit it
          even while holding the CORRECT expected_partner_version. That last detail is the trap --
          the segregation check must fire on a request that would otherwise have passed the
          optimistic-concurrency gate, and the refusal must leave the partner's version untouched so
          the version u-src-2 then presents is still the one it read.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; OPEN cycle W37-SOD with FG-P and its 2026-09-07 grid (2 intervals of 82)."
            - "ACTIVE partner P1 (CHAT_EN, rate 10000 millicents, interval_max 50, floor 10, threshold 0.8500, DELIVERED_ONLY) registered by u-src-1."
            - "One PROPOSED allocation of 20 on the first interval, proposed by u-src-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SourcingManager
            - call: "POST /planning-cycles"
              payload: { name: "W37-SOD", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13", interval_minutes: 30, requirement_basis: "MAX_OF_BOTH", ot_budget_cents: 1000000, intraday_alert_short_threshold: 99 }
              as: CapacityPlanner
              captures: { cyc_id: "$.data.id" }
            - call: "POST /forecast-groups"
