        grounds: ["state_machines.ConstructionShift.status.SCHEDULED_to_CANCELLED", "state_machines.ShiftAssignment.status.RESERVED_to_CANCELLED", entities.VolunteerProfile.fields.assigned_hours_committed, entities.VolunteerProfile.fields.no_show_strikes, calculations.volunteer_hour_capacity_invariant]
        distinguishing_aspect: "Compensation pattern: cancelling an OPEN shift cancels BOTH the RESERVED and the CONFIRMED seat, drops confirmed_general_count back to 0 and refunds each volunteer's 4.00 hours to exactly the pre-reservation value — and explicitly records no no-show strike, unlike the completion fork."
        test_recipe:
          setup:
            - "Canonical program with a READY_TO_BUILD site and an OPEN 4-hour shift (2026-08-05T08:00 to 12:00, 2 general seats). Volunteer A is CONFIRMED and volunteer B is RESERVED, so confirmed_general_count is 1 and both profiles carry assigned_hours_committed 4.0."
