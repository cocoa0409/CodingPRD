      - name: corner_missing_or_unknown_role_header_is_401_before_anything_else
        claim_type: Violation → Error
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 10/11 run before existence and before RBAC: a request with no X-User-ID and a request whose X-User-Role is Broker both return 401 ERR_UNAUTHENTICATED even when the path id does not exist, so 401 pre-empts the 404 that the same path would otherwise produce."
        test_recipe:
          setup:
            - "Empty database, logical clock at its 2026-08-01T00:00:00Z default."
            - "HEADER MANIPULATION: the `as:` values below are the lint-visible placeholders only. trigger[0] must be issued with the X-User-ID header OMITTED entirely; trigger[1] with X-User-ID present but blank; trigger[2] with X-User-Role replaced by the undeclared value Broker; trigger[3] with both headers present and valid (the control)."
          setup_api_calls:
            - call: "POST /inland-marine/policies"
              payload: { policyholder_name: "Header Control Co", territory_code: "T2_URBAN", effective_date: "2026-08-01", expiration_date: "2027-08-01", minimum_premium_cents: 100000 }
              as: Underwriter
              captures: { pol: $.data.id }
