  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: occ_plan_amend_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /api/plans requires expected_plan_version equal to the current Plan.version: after activation advances it to 2, a PATCH carrying the pre-activation version 1 is rejected 412 while one carrying 2 succeeds and advances the version to 3."
        test_recipe:
          setup: ["plan created (version 1) and activated (version 2)"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan OC", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v1: $.data.version }
          trigger:
            - call: "PATCH /api/plans/${plan_id}"
              payload: { processing_lag_days: 45, expected_plan_version: "${plan_v1} - 1" }
              as: PlanSponsor
              captures: { stale_err: $.data.error_id }
            - call: "PATCH /api/plans/${plan_id}"
              payload: { processing_lag_days: 45, expected_plan_version: "${plan_v1}" }
              as: PlanSponsor
              captures: { plan_v2: $.data.version, lag: $.data.processing_lag_days }
          assert:
            - "${stale_err} == ERR_STALE_VERSION (412; expression evaluates to version 1, which no longer matches)"
            - "${lag} == 45 and ${plan_v2} == 3 (successful amend increments Plan.version by 1)"
      - name: occ_window_create_stale_plan
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[window-create-stale-plan]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "POST /api/election-windows is OCC-guarded: a create carrying the version observed before another window was created is rejected 412; refetching the version and retrying succeeds."
        test_recipe:
          setup: ["ACTIVE plan at version 2; client observes version 2; first window create advances Plan to version 3"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan OW", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window1_id: $.data.id }
          trigger:
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2028, general_open_date: "2027-10-01", general_close_date: "2027-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { stale_err: $.data.error_id }
            - call: "GET /api/plans/${plan_id}"
              as: PlanSponsor
              captures: { plan_v2: $.data.version }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2028, general_open_date: "2027-10-01", general_close_date: "2027-12-31", expected_plan_version: "${plan_v2}" }
              as: PlanSponsor
              captures: { window2_id: $.data.id }
          assert:
            - "${stale_err} == ERR_STALE_VERSION (the first window create advanced Plan.version to 3, so the observed version 2 is stale)"
            - "retry with ${plan_v2} == 3 succeeds: ${window2_id} created"
      - name: occ_crediting_run_stale_plan
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[crediting-run-stale-plan]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "POST /api/crediting-runs is OCC-guarded: after run R1 advances Plan.version to 3, a second run carrying version 2 is rejected 412 — each run must be posted against a freshly observed plan version."
        test_recipe:
          setup: ["ACTIVE plan at version 2; R1 posted with version 2"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan OR", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/crediting-runs"
              payload: { plan_id: "${plan_id}", period_start: "2027-01-01", period_end: "2027-02-01", expected_plan_version: "${plan_v}" }
              as: BenefitsAdministrator
              captures: { run1_id: $.data.id }
          trigger:
            - call: "POST /api/crediting-runs"
              payload: { plan_id: "${plan_id}", period_start: "2027-02-01", period_end: "2027-03-01", expected_plan_version: "${plan_v}" }
              as: BenefitsAdministrator
              captures: { stale_err: $.data.error_id }
            - call: "GET /api/plans/${plan_id}"
              as: PlanSponsor
              captures: { plan_v2: $.data.version }
            - call: "POST /api/crediting-runs"
              payload: { plan_id: "${plan_id}", period_start: "2027-02-01", period_end: "2027-03-01", expected_plan_version: "${plan_v2}" }
              as: BenefitsAdministrator
              captures: { run2_id: $.data.id }
          assert:
            - "${stale_err} == ERR_STALE_VERSION"
            - "retry with ${plan_v2} == 3 succeeds: ${run2_id} created with status POSTED"
      - name: occ_specified_list_create_stale_plan
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[specified-list-create-stale-plan]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "POST /api/specified-employee-lists is OCC-guarded: a second create carrying the version observed before the first list was created is rejected 412 (supersede-style create requires a fresh baseline)."
        test_recipe:
          setup: ["ACTIVE plan at version 2; list L1 created with version 2 (Plan advances to 3); L1 left in DRAFT"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan OL", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/specified-employee-lists"
              payload: { plan_id: "${plan_id}", identification_date: "2026-12-31", effective_date: "2027-04-01", expected_plan_version: "${plan_v}" }
              as: ComplianceOfficer
              captures: { list1_id: $.data.id }
          trigger:
            - call: "POST /api/specified-employee-lists"
              payload: { plan_id: "${plan_id}", identification_date: "2027-12-31", effective_date: "2028-04-01", expected_plan_version: "${plan_v}" }
              as: ComplianceOfficer
              captures: { stale_err: $.data.error_id }
          assert:
            - "${stale_err} == ERR_STALE_VERSION (OCC at priority 5 fires before the ERR_DRAFT_LIST_EXISTS uniqueness check at priority 9.1)"
      - name: derived_fields_reconcile_on_finding_lifecycle
        claim_type: derived_field_reconciliation
        grounds: ["entities.Plan.fields.document_posture", "entities.Plan.fields.open_findings_count", "state_machines.DocumentFinding"]
        distinguishing_aspect: "Plan.document_posture and open_findings_count track DocumentFinding children through the full correction cycle: 0/COMPLIANT -> 1/FAILURE_OPEN on report -> 1/FAILURE_OPEN on file -> 0/COMPLIANT on CORRECTED adjudication."
        test_recipe:
          setup: ["ACTIVE plan with no findings"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan DR", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
          trigger:
            - call: "POST /api/document-findings"
              payload: { plan_id: "${plan_id}", description: "Missing six-month delay clause", failure_year: 2026 }
              as: ComplianceOfficer
              captures: { finding_id: $.data.id, deadline: $.data.correction_deadline }
            - call: "GET /api/plans/${plan_id}"
              as: PlanSponsor
              captures: { posture1: $.data.document_posture, count1: $.data.open_findings_count }
            - call: "POST /api/document-findings/${finding_id}/file-correction"
              payload: { correction_text: "Insert six-month delay language per 409A" }
              as: ComplianceOfficer
            - call: "POST /api/document-findings/${finding_id}/adjudicate"
              payload: { outcome: "CORRECTED" }
              as: PlanSponsor
            - call: "GET /api/plans/${plan_id}"
              as: PlanSponsor
              captures: { posture2: $.data.document_posture, count2: $.data.open_findings_count }
          assert:
            - "${deadline} == 2028-12-31"
            - "${posture1} == FAILURE_OPEN and ${count1} == 1"
            - "DocumentFinding.${finding_id}.status == CORRECTED"
            - "${posture2} == COMPLIANT and ${count2} == 0 (derived fields reconcile with source children)"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_visibility_after_mutation
        claim_type: immediate_consistency
        grounds: ["complexity_profile", "calculations.account_balances"]
        distinguishing_aspect: "Consistency is immediate: the post-deferral response entry and a follow-up GET in the same logical instant already show the provisional balance at 100000, and the settle-entries response itself carries the updated settled balance — no read-after-write lag anywhere."
        test_recipe:
          setup: ["funded setup through LOCKED election; account at zero"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan IM", effective_date: "2026-01-01", distribution_events_allowed: ["SEPARATION"], officer_comp_threshold_cents: 20000000 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/notional-funds"
              payload: { plan_id: "${plan_id}", ticker: "FIX5", crediting_mode: "FIXED_RATE", annual_rate_bp: 500 }
              as: PlanSponsor
              captures: { fund_id: $.data.id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-IM", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${participant_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { account_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${participant_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { election_id: $.data.id }
            - call: "POST /api/deferral-elections/${election_id}/submit"
              as: Participant
              as_user_id: "${participant_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/deferral-elections/${election_id}/post-deferral"
              payload: { amount_cents: 100000, service_period_start: "2027-01-01", service_period_end: "2027-01-31" }
              as: BenefitsAdministrator
              captures: { entry_status: $.data.entry_status }
            - call: "GET /api/accounts/${account_id}"
              as: BenefitsAdministrator
              captures: { prov: $.data.provisional_balance_cents, settled0: $.data.settled_balance_cents }
            - call: "POST /api/accounts/${account_id}/settle-entries"
              as: BenefitsAdministrator
              captures: { settled1: $.data.settled_balance_cents }
          assert:
            - "${entry_status} == PENDING"
            - "${prov} == 100000 and ${settled0} == 0 (read-your-write, same logical instant)"
            - "${settled1} == 100000 (settle response carries the recomputed settled balance)"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_plan_not_active_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLAN_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: plan_suspend_resume_cycle_with_gate
          rationale: "Asserted mid-cycle in the named §1.8 instance (participant create blocked while SUSPENDED)."
      - name: error_plan_document_lapsed_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLAN_DOCUMENT_LAPSED]"]
        excluded_because:
          difficulty_instance: document_lapse_beats_insufficient_balance_on_pay
          rationale: "The LAPSED_FAILURE pay gate is the winning error of the named §1.8 priority-conflict instance."
      - name: error_event_not_confirmed_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_EVENT_NOT_CONFIRMED]"]
        excluded_because:
          difficulty_instance: distribution_verify_gated_by_case_determination
          rationale: "The unverified-case verify failure is the first trigger of the named §1.8 cross-entity instance."
      - name: error_window_overlap_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_WINDOW_OVERLAP]"]
        excluded_because:
          difficulty_instance: window_overlap_closed_interval_touching_conflict
          rationale: "Touching-date rejection is the negative branch of the named §1.8 overlap instance."
      - name: error_crediting_period_overlap_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREDITING_PERIOD_OVERLAP]"]
        excluded_because:
          difficulty_instance: crediting_period_half_open_adjacency_allowed
          rationale: "The strictly-inside-period rejection is the negative branch of the named §1.8 overlap instance."
      - name: error_fraction_contradiction_gate
        claim_type: violation_to_error
        grounds: ["errors[ERR_SERVICE_FRACTION_CONTRADICTS_OUTCOME]"]
        excluded_because:
          difficulty_instance: separation_fraction_plan_variant_determination_flip
          rationale: "The LIBERAL_20 leg of the named §1.8 dual-variant instance triggers this error."
      - name: error_stale_version_occurrence
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: occ_plan_amend_stale_version
          rationale: "ERR_STALE_VERSION (412) is asserted on all four OCC-guarded endpoints in the cross_cutting_layers section; the cited name anchors the family."
      - name: distribution_pay_before_date_not_payable
        claim_type: temporal_validation
        grounds: ["state_machines.DistributionRequest.SCHEDULED_to_PAYABLE", "errors[ERR_DISTRIBUTION_NOT_PAYABLE]"]
        distinguishing_aspect: "A request in SCHEDULED whose payment date has not yet arrived is not payable: pay at clock 2027-05-31 against a 2027-06-01 schedule fails ERR_DISTRIBUTION_NOT_PAYABLE; at exactly 2027-06-01 the sweep flips it to PAYABLE and pay succeeds (inclusive date boundary on a third metric: payment date)."
        test_recipe:
          setup: ["vested participant; account with 100000 settled; FIXED_TIME request for 40000 verified and scheduled to 2027-06-01; clock at 2027-05-31"]
          setup_api_calls:
            - call: "POST /api/plans"
              payload: { name: "Plan PD", effective_date: "2026-01-01", distribution_events_allowed: ["FIXED_TIME"], officer_comp_threshold_cents: 20000000, vesting_cliff_years: 3 }
              as: PlanSponsor
              captures: { plan_id: $.data.id }
            - call: "POST /api/plans/${plan_id}/activate"
              as: PlanSponsor
              captures: { plan_v: $.data.version }
            - call: "POST /api/notional-funds"
              payload: { plan_id: "${plan_id}", ticker: "FIX5", crediting_mode: "FIXED_RATE", annual_rate_bp: 500 }
              as: PlanSponsor
              captures: { fund_id: $.data.id }
            - call: "POST /api/election-windows"
              payload: { plan_id: "${plan_id}", plan_year: 2027, general_open_date: "2026-10-01", general_close_date: "2026-12-31", expected_plan_version: "${plan_v}" }
              as: PlanSponsor
              captures: { window_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-PD", hire_date: "2023-08-03", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { participant_id: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${participant_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { account_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${participant_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { election_id: $.data.id }
            - call: "POST /api/deferral-elections/${election_id}/submit"
              as: Participant
              as_user_id: "${participant_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections/${election_id}/post-deferral"
              payload: { amount_cents: 100000, service_period_start: "2027-01-01", service_period_end: "2027-01-31" }
              as: BenefitsAdministrator
            - call: "POST /api/accounts/${account_id}/settle-entries"
              as: BenefitsAdministrator
            - call: "POST /api/distribution-requests"
              payload: { account_id: "${account_id}", event_type: "FIXED_TIME", fixed_date: "2027-06-01", requested_amount_cents: 40000 }
              as: Participant
              as_user_id: "${participant_id}"
              captures: { req_id: $.data.id }
            - call: "POST /api/distribution-requests/${req_id}/verify-event"
              as: ComplianceOfficer
            - call: "POST /api/distribution-requests/${req_id}/schedule"
              as: BenefitsAdministrator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-31T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/distribution-requests/${req_id}/pay"
              as: BenefitsAdministrator
              captures: { early_err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/distribution-requests/${req_id}/pay"
              as: BenefitsAdministrator
              captures: { paid: $.data.status }
          assert:
            - "${early_err} == ERR_DISTRIBUTION_NOT_PAYABLE (still SCHEDULED at 2027-05-31)"
            - "${paid} == PAID (sweep flipped to PAYABLE at exactly 2027-06-01, inclusive)"
            - "Account.${account_id}.settled_balance_cents == 60000"
