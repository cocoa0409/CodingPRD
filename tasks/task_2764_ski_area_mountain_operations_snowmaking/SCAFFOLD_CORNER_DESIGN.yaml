      - name: the_park_gates_are_re_armed_by_every_rebuild_and_evaluated_in_priority_order
        claim_type: cascading_validation
        grounds:
          - validations[priority=29]
          - validations[priority=30]
          - errors[ERR_PARK_NOT_INSPECTED]
          - errors[ERR_PARK_RISK_TOO_HIGH]
          - state_machines.TerrainArea.PARK_INSPECTED_to_PARK_CLOSED
          - calculations.park_risk_score
        distinguishing_aspect: |
          Tearing the park down drops the OPEN area to PATROL_HOLD and clears the inspection, so both
          park gates must be re-satisfied from scratch - the inspection first (29), then the risk ceiling
          (30). PATROL_HOLD is the only source state from which these two gates are observable at all: on
          a PREP or READY area the readiness re-evaluation intercepts the same conditions and priority 12
          reports first. The rebuild at 7 features scores 84.0 and is still accepted as a build, because
          the risk ceiling is a gate on the opening decision and never on the build itself.
        test_recipe:
          setup:
            - "A PARK class area with a 5-feature park (risk 34.0), inspected by P1, OPEN on a published day plan served by an OPEN lift."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
