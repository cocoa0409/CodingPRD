# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task_1030
# Breadth probe over §1.1-§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ------------------------------------------------------------------ Entities
  - section: entities
    instances:
      - name: product_create_returns_all_fields
        claim_type: Creation
        grounds: [entities.Product, endpoints]
        distinguishing_aspect: "POST /products with all required fields returns 201 and echoes model_name/category/brand/msrp_cents plus recall_status=NONE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { model_name: "Elna 720", category: "SEWING_MACHINE", brand: "Elna", msrp_cents: 95000, warranty_months: 18 }
              as: StoreManager
              captures: { prod_id: $.data.id }
          assert:
            - "response status code == 201"
            - "Product.${prod_id}.recall_status == NONE"
            - "Product.${prod_id}.warranty_months == 18"

      - name: product_default_warranty_months_applied
        claim_type: Defaults
        grounds: [entities.Product.fields.warranty_months]
        distinguishing_aspect: "Omitting warranty_months applies the default 12."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { model_name: "Basic Vac", category: "VACUUM", brand: "Generic", msrp_cents: 20000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
          assert:
            - "Product.${prod_id}.warranty_months == 12"

      - name: product_missing_category_rejected
        claim_type: Required Fields
        grounds: [entities.Product.fields.category, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /products without the required category field is rejected ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { model_name: "No Cat", brand: "Generic", msrp_cents: 10000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "response status code == 400"

      - name: product_invalid_category_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.Product.fields.category, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A category outside {SEWING_MACHINE,VACUUM,PART,ACCESSORY} is rejected ERR_VALIDATION."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { model_name: "Bad Enum", category: "TOASTER", brand: "Generic", msrp_cents: 10000 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: product_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_PRODUCT_NOT_FOUND]"]
        distinguishing_aspect: "GET /products/{id} with an unknown UUID returns ERR_PRODUCT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PRODUCT_NOT_FOUND"
            - "response status code == 404"

      - name: inventory_item_defaults_in_stock
        claim_type: Computed Fields
        grounds: [entities.InventoryItem.fields.status]
        distinguishing_aspect: "A newly intaken InventoryItem has status IN_STOCK regardless of any client-supplied status."
        test_recipe:
          setup: ["One Product."]
          setup_api_calls:
            - call: "POST /products"
              payload: { model_name: "Stk Model", category: "VACUUM", brand: "Generic", msrp_cents: 30000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-STK", condition: "NEW", acquisition_cost_cents: 18000, list_price_cents: 30000 }
              as: StoreManager
              captures: { item_id: $.data.id }
          assert:
            - "InventoryItem.${item_id}.status == IN_STOCK"

      - name: customer_loyalty_tier_recompute_gold
        claim_type: Computed Fields
        grounds: [calculations.loyalty_tier_recompute, entities.Customer.fields.loyalty_tier, entities.Customer.fields.lifetime_spend_cents]
        distinguishing_aspect: "After a COMPLETED sale pushing lifetime_spend to 540000 (>= 500000), loyalty_tier recomputes to GOLD."
        test_recipe:
          setup: ["One Customer (STANDARD); one Product; one IN_STOCK item; a RESERVED order sale_price 500000, no trade-in, no store credit."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Tier Cust", email: "tier@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Premium 5000", category: "SEWING_MACHINE", brand: "Bernina", msrp_cents: 600000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-P5", condition: "NEW", acquisition_cost_cents: 400000, list_price_cents: 600000 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", sale_price_cents: 500000 }
              as: SalesAssociate
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /sales-orders/${so_id}/complete"
              payload: {}
              as: SalesAssociate
          assert:
            - "SalesOrder.${so_id}.total_due_cents == 540000"
            - "Customer.${cust_id}.lifetime_spend_cents == 540000"
            - "Customer.${cust_id}.loyalty_tier == GOLD"

  # ------------------------------------------------------------- State machines
  - section: state_machines
    instances:
      - name: sales_order_complete_from_cancelled_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.SalesOrder.RESERVED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Completing a CANCELLED SalesOrder returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A CANCELLED SalesOrder (created then cancelled)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Inv1", email: "inv1@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "M1", category: "VACUUM", brand: "G", msrp_cents: 30000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "S1", condition: "NEW", acquisition_cost_cents: 20000, list_price_cents: 30000 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", sale_price_cents: 29000 }
              as: SalesAssociate
              captures: { so_id: $.data.id }
            - call: "POST /sales-orders/${so_id}/cancel"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /sales-orders/${so_id}/complete"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "SalesOrder.${so_id}.status == CANCELLED"

      - name: repair_close_from_intake_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.RepairTicket.READY_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Closing a ticket still in INTAKE (not READY) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A RepairTicket in INTAKE."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "RT Cust", email: "rt@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "RT Model", category: "SEWING_MACHINE", brand: "G", msrp_cents: 50000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}" }
              as: ServiceTech
              captures: { rt_id: $.data.id }
          trigger:
            - call: "POST /repair-tickets/${rt_id}/close"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: special_order_fulfill_from_requested_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.SpecialOrder.RECEIVED_to_FULFILLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Fulfilling a REQUESTED special order (before RECEIVED) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A REQUESTED SpecialOrder."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "SO Cust", email: "so@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "SO Model", category: "SEWING_MACHINE", brand: "G", msrp_cents: 80000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 2, unit_price_cents: 80000, deposit_cents: 20000 }
              as: SalesAssociate
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /special-orders/${so_id}/fulfill"
              payload: {}
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: inventory_scrap_from_sold_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.InventoryItem.IN_STOCK_to_SCRAPPED, "errors[ERR_ITEM_NOT_AVAILABLE]"]
        distinguishing_aspect: "Scrapping a SOLD unit (consumed as a part) returns ERR_ITEM_NOT_AVAILABLE, since only IN_STOCK units may be scrapped."
        test_recipe:
          setup: ["A PART unit consumed onto a repair (now SOLD)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Sc Cust", email: "sc2@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Sc Machine", category: "VACUUM", brand: "G", msrp_cents: 40000 }
              as: StoreManager
              captures: { machine_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Sc Part", category: "PART", brand: "G", msrp_cents: 4000 }
              as: StoreManager
              captures: { part_prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${part_prod_id}", condition: "NEW", acquisition_cost_cents: 1000, list_price_cents: 4000 }
              as: StoreManager
              captures: { part_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", product_id: "${machine_id}" }
              as: ServiceTech
              captures: { rt_id: $.data.id }
            - call: "POST /repair-tickets/${rt_id}/quote"
              payload: { diagnosis: "d", labor_hours: 1.0 }
              as: ServiceTech
            - call: "POST /repair-tickets/${rt_id}/approve"
              payload: {}
              as: SalesAssociate
            - call: "POST /repair-tickets/${rt_id}/consume-part"
              payload: { inventory_item_id: "${part_id}" }
              as: ServiceTech
          trigger:
            - call: "POST /inventory-items/${part_id}/scrap"
              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ITEM_NOT_AVAILABLE"
            - "InventoryItem.${part_id}.status == SOLD"

      - name: product_double_recall_rejected
        claim_type: Idempotency
        grounds: [state_machines.Product.NONE_to_RECALLED, "errors[ERR_ALREADY_RECALLED]"]
        distinguishing_aspect: "Issuing a recall on an already RECALLED product returns ERR_ALREADY_RECALLED."
        test_recipe:
          setup: ["A RECALLED Product."]
          setup_api_calls:
            - call: "POST /products"
              payload: { model_name: "Rec Model", category: "SEWING_MACHINE", brand: "G", msrp_cents: 60000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/recall"
              payload: { recall_reason: "first" }
              as: StoreManager
          trigger:
            - call: "POST /products/${prod_id}/recall"
              payload: { recall_reason: "second" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ALREADY_RECALLED"

      - name: rental_days_computed_on_create
        claim_type: Side Effect Execution
        grounds: [calculations.rental_days, entities.RentalAgreement.fields.rental_days]
        distinguishing_aspect: "A rental over [07-02,07-06) computes rental_days = ceil(4 days) = 4 at creation."
        test_recipe:
          setup: ["One Customer, Product, IN_STOCK item."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "RD Cust", email: "rd@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "RD Vac", category: "VACUUM", brand: "G", msrp_cents: 22000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-RD", condition: "REFURBISHED", acquisition_cost_cents: 8000, list_price_cents: 22000 }
              as: StoreManager
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", start_at: "2026-07-02T00:00:00Z", due_at: "2026-07-06T00:00:00Z", daily_rate_cents: 2000, deposit_cents: 5000 }
              as: SalesAssociate
              captures: { r_id: $.data.id }
          assert:
            - "RentalAgreement.${r_id}.rental_days == 4"
            - "RentalAgreement.${r_id}.status == ACTIVE"

      - name: rental_late_fee_on_late_return
        claim_type: Side Effect Execution
        grounds: [calculations.rental_late_fee, entities.RentalAgreement.fields.late_fee_cents, state_machines.RentalAgreement.ACTIVE_to_RETURNED]
        distinguishing_aspect: "Returning 3 days after due_at at daily_rate 2000 yields late_fee = ceil(3)*2000*1.5 = 9000 and total_charge = 4*2000 + 9000 = 17000."
        test_recipe:
          setup: ["An ACTIVE rental [07-02,07-06), daily_rate 2000, deposit 5000."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "LF Cust", email: "lf@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "LF Vac", category: "VACUUM", brand: "G", msrp_cents: 22000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-LF", condition: "REFURBISHED", acquisition_cost_cents: 8000, list_price_cents: 22000 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /rental-agreements"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", start_at: "2026-07-02T00:00:00Z", due_at: "2026-07-06T00:00:00Z", daily_rate_cents: 2000, deposit_cents: 5000 }
              as: SalesAssociate
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /rental-agreements/${r_id}/return"
              payload: { returned_at: "2026-07-09T00:00:00Z" }
              as: SalesAssociate
          assert:
            - "RentalAgreement.${r_id}.late_fee_cents == 9000"
            - "RentalAgreement.${r_id}.total_charge_cents == 17000"
            - "RentalAgreement.${r_id}.status == RETURNED"

      - name: class_session_complete_marks_attended
        claim_type: Side Effect Execution
        grounds: [state_machines.ClassSession.SCHEDULED_to_COMPLETED, state_machines.ClassEnrollment.ENROLLED_to_CANCELLED]
        distinguishing_aspect: "Completing a session flips its ENROLLED enrollments to ATTENDED."
        test_recipe:
          setup: ["A SCHEDULED session (fee 0) with one ENROLLED customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "At Cust", email: "at@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /class-sessions"
              payload: { title: "Att Class", machine_type: "SEWING", start_at: "2026-08-06T10:00:00Z", end_at: "2026-08-06T11:00:00Z", capacity: 3, fee_cents: 0 }
              as: StoreManager
              captures: { cs_id: $.data.id }
            - call: "POST /class-sessions/${cs_id}/enrollments"
              payload: { customer_id: "${cust_id}" }
              as: SalesAssociate
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /class-sessions/${cs_id}/complete"
              payload: {}
              as: StoreManager
          assert:
            - "ClassSession.${cs_id}.status == COMPLETED"
            - "ClassEnrollment.${e_id}.status == ATTENDED"

  # --------------------------------------------------------------- Calculations
  - section: calculations
    instances:
      - name: trade_in_estimate_fair_schedule
        claim_type: Constants Applied
        grounds: [calculations.trade_in_appraisal, entities.SalesOrder.fields.trade_in_estimate_cents]
        distinguishing_aspect: "A FAIR-condition trade-in yields estimate 25000 from the schedule at reservation."
        test_recipe:
          setup: ["One Customer, Product, IN_STOCK item."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Fair Cust", email: "fair@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Fair Model", category: "SEWING_MACHINE", brand: "G", msrp_cents: 90000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-F", condition: "NEW", acquisition_cost_cents: 60000, list_price_cents: 90000 }
              as: StoreManager
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /sales-orders"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", sale_price_cents: 85000, trade_in_model: "Old Brother", trade_in_condition: "FAIR" }
              as: SalesAssociate
              captures: { so_id: $.data.id }
          assert:
            - "SalesOrder.${so_id}.trade_in_estimate_cents == 25000"

      - name: repair_invoice_warranty_waives_labor
        claim_type: Variant Selection
        grounds: [calculations.repair_invoice, entities.RepairTicket.fields.is_warranty]
        distinguishing_aspect: "For a warranty ticket, the final invoice equals parts only (5000): labor (27000 est) is waived."
        test_recipe:
          setup: ["A warranty RepairTicket quoted at 3.0h, in IN_REPAIR, with one 5000 part consumed."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "War Cust", email: "war@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "War Machine", category: "SEWING_MACHINE", brand: "G", msrp_cents: 70000 }
              as: StoreManager
              captures: { machine_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "War Part", category: "PART", brand: "G", msrp_cents: 5000 }
              as: StoreManager
              captures: { part_prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${part_prod_id}", condition: "NEW", acquisition_cost_cents: 2000, list_price_cents: 5000 }
              as: StoreManager
              captures: { part_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", product_id: "${machine_id}", is_warranty: true }
              as: ServiceTech
              captures: { rt_id: $.data.id }
            - call: "POST /repair-tickets/${rt_id}/quote"
              payload: { diagnosis: "d", labor_hours: 3.0 }
              as: ServiceTech
            - call: "POST /repair-tickets/${rt_id}/approve"
              payload: {}
              as: SalesAssociate
            - call: "POST /repair-tickets/${rt_id}/consume-part"
              payload: { inventory_item_id: "${part_id}" }
              as: ServiceTech
          trigger:
            - call: "POST /repair-tickets/${rt_id}/complete"
              payload: {}
              as: ServiceTech
          assert:
            - "RepairTicket.${rt_id}.labor_estimate_cents == 27000"
            - "RepairTicket.${rt_id}.final_invoice_cents == 5000"

  # ---------------------------------------------------------------- Validations
  - section: validations
    instances:
      - name: sales_order_create_nonexistent_customer_not_found
        claim_type: Cross-entity validation
        grounds: ["validations[priority=4]", "errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "Creating a sales order with an unknown customer_id returns ERR_CUSTOMER_NOT_FOUND (404)."
        test_recipe:
          setup: ["One Product with one IN_STOCK item; no such customer."]
          setup_api_calls:
            - call: "POST /products"
              payload: { model_name: "NF Model", category: "VACUUM", brand: "G", msrp_cents: 30000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-NF", condition: "NEW", acquisition_cost_cents: 20000, list_price_cents: 30000 }
              as: StoreManager
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /sales-orders"
              payload: { customer_id: "00000000-0000-4000-8000-000000000000", inventory_item_id: "${item_id}", sale_price_cents: 29000 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CUSTOMER_NOT_FOUND"
            - "response status code == 404"

      - name: repair_approve_ownership_denied_for_wrong_customer
        claim_type: Priority Ordering
        grounds: ["validations[priority=3]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "A Customer approving a repair ticket they do not own (X-User-ID != ticket.customer_id) is denied ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Ticket owned by c1 in AWAITING_APPROVAL; c2 is a different customer."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Own1", email: "own1@x.com" }
              as: SalesAssociate
              captures: { c1_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Own2", email: "own2@x.com" }
              as: SalesAssociate
              captures: { c2_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Own Model", category: "SEWING_MACHINE", brand: "G", msrp_cents: 50000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${c1_id}", product_id: "${prod_id}" }
              as: ServiceTech
              captures: { rt_id: $.data.id }
            - call: "POST /repair-tickets/${rt_id}/quote"
              payload: { diagnosis: "d", labor_hours: 1.0 }
              as: ServiceTech
          trigger:
            - call: "POST /repair-tickets/${rt_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${c2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"
            - "response status code == 403"

  # ------------------------------------------------------------------ Endpoints
  - section: endpoints
    instances:
      - name: special_order_amend_occ_success
        claim_type: Computed read
        grounds: [endpoints, entities.SpecialOrder.fields.balance_due_cents, entities.SpecialOrder.fields.version]
        distinguishing_aspect: "PATCH with the current expected_special_order_version succeeds: quantity updates to 5, balance_due recomputes (5*80000-20000=380000), version increments to 2."
        test_recipe:
          setup: ["A REQUESTED SpecialOrder (qty 2, unit 80000, deposit 20000, version 1)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Occ Cust", email: "occ@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Occ Model", category: "SEWING_MACHINE", brand: "G", msrp_cents: 80000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 2, unit_price_cents: 80000, deposit_cents: 20000 }
              as: SalesAssociate
              captures: { so_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "PATCH /special-orders/${so_id}"
              payload: { quantity: 5, expected_special_order_version: "${v0}" }
              as: SalesAssociate
              captures: { v1: $.data.version }
          assert:
            - "SpecialOrder.${so_id}.quantity == 5"
            - "SpecialOrder.${so_id}.balance_due_cents == 380000"
            - "SpecialOrder.${so_id}.version == 2"

      - name: special_order_amend_stale_version_conflict
        claim_type: Conditional action
        grounds: ["concurrency_rules[special-order-amend-stale]", "validations[priority=13]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second PATCH reusing the pre-amend version (${v0}) after the version already advanced to 2 is rejected ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A SpecialOrder amended once so its version is now 2, while the client still holds v0=1."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Stale Cust", email: "stale@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Stale Model", category: "SEWING_MACHINE", brand: "G", msrp_cents: 80000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 2, unit_price_cents: 80000, deposit_cents: 20000 }
              as: SalesAssociate
              captures: { so_id: $.data.id, v0: $.data.version }
            - call: "PATCH /special-orders/${so_id}"
              payload: { quantity: 3, expected_special_order_version: "${v0}" }
              as: SalesAssociate
          trigger:
            - call: "PATCH /special-orders/${so_id}"
              payload: { quantity: 9, expected_special_order_version: "${v0}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "response status code == 412"

      - name: list_products_pagination_envelope
        claim_type: Standard CRUD
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /products?limit=2&offset=0 over 3 products returns 2 items with total_count=3 and has_more=true in the envelope."
        test_recipe:
          setup: ["Three products created."]
          setup_api_calls:
            - call: "POST /products"
              payload: { model_name: "P1", category: "VACUUM", brand: "G", msrp_cents: 10000 }
              as: StoreManager
            - call: "POST /products"
              payload: { model_name: "P2", category: "VACUUM", brand: "G", msrp_cents: 10000 }
              as: StoreManager
            - call: "POST /products"
              payload: { model_name: "P3", category: "VACUUM", brand: "G", msrp_cents: 10000 }
              as: StoreManager
          trigger:
            - call: "GET /products?limit=2&offset=0"
              payload: {}
              as: StoreManager
          assert:
            - "response data length == 2"
            - "response meta total_count == 3"
            - "response meta has_more == true"

      - name: fk_reverse_inventory_by_product
        claim_type: Cross-reference link
        grounds: [entities.InventoryItem.fields.product_id, endpoints]
        distinguishing_aspect: "GET /inventory-items?product_id={id} returns exactly the units of that product (reverse FK reachability)."
        test_recipe:
          setup: ["A Product with two IN_STOCK items."]
          setup_api_calls:
            - call: "POST /products"
              payload: { model_name: "Fk Model", category: "VACUUM", brand: "G", msrp_cents: 30000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-A", condition: "NEW", acquisition_cost_cents: 18000, list_price_cents: 30000 }
              as: StoreManager
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-B", condition: "NEW", acquisition_cost_cents: 18000, list_price_cents: 30000 }
              as: StoreManager
          trigger:
            - call: "GET /inventory-items?product_id=${prod_id}"
              payload: {}
              as: StoreManager
          assert:
            - "response data length == 2"

  # --------------------------------------------------------------------- Errors
  - section: errors
    instances:
      - name: consume_part_non_part_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_NOT_A_PART]"]
        distinguishing_aspect: "Consuming a non-PART (VACUUM) inventory item onto a ticket returns ERR_NOT_A_PART."
        test_recipe:
          setup: ["A ticket in IN_REPAIR and an IN_STOCK VACUUM (non-part) item."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Np Cust", email: "np@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Np Machine", category: "SEWING_MACHINE", brand: "G", msrp_cents: 50000 }
              as: StoreManager
              captures: { machine_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Np Vac", category: "VACUUM", brand: "G", msrp_cents: 30000 }
              as: StoreManager
              captures: { vac_prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${vac_prod_id}", serial_number: "SN-NV", condition: "NEW", acquisition_cost_cents: 18000, list_price_cents: 30000 }
              as: StoreManager
              captures: { vac_item_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", product_id: "${machine_id}" }
              as: ServiceTech
              captures: { rt_id: $.data.id }
            - call: "POST /repair-tickets/${rt_id}/quote"
              payload: { diagnosis: "d", labor_hours: 1.0 }
              as: ServiceTech
            - call: "POST /repair-tickets/${rt_id}/approve"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /repair-tickets/${rt_id}/consume-part"
              payload: { inventory_item_id: "${vac_item_id}" }
              as: ServiceTech
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_A_PART"

      - name: trade_in_out_of_band_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_TRADE_IN_OUT_OF_BAND]"]
        distinguishing_aspect: "Completing with final 60000 vs GOOD estimate 40000 (|delta|=20000 > 15000 band) and no recall returns ERR_TRADE_IN_OUT_OF_BAND."
        test_recipe:
          setup: ["A RESERVED order with GOOD trade-in (estimate 40000); product NOT recalled."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Band Cust", email: "band@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Band Model", category: "SEWING_MACHINE", brand: "G", msrp_cents: 110000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${prod_id}", serial_number: "SN-BD", condition: "NEW", acquisition_cost_cents: 70000, list_price_cents: 110000 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /sales-orders"
              payload: { customer_id: "${cust_id}", inventory_item_id: "${item_id}", sale_price_cents: 100000, trade_in_model: "Old", trade_in_condition: "GOOD" }
              as: SalesAssociate
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /sales-orders/${so_id}/complete"
              payload: { trade_in_final_cents: 60000 }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TRADE_IN_OUT_OF_BAND"
            - "SalesOrder.${so_id}.status == RESERVED"

  # ----------------------------------------------------------------------- RBAC
  - section: rbac
    instances:
      - name: products_create_denied_for_servicetech
        claim_type: exclusive_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "ServiceTech calling POST /products (a StoreManager-exclusive op) is denied ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { model_name: "X", category: "VACUUM", brand: "G", msrp_cents: 10000 }
              as: ServiceTech
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"
            - "response status code == 403"

      - name: consume_part_denied_for_salesassociate
        claim_type: exclusive_denied
        grounds: [roles, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "SalesAssociate calling consume-part (a ServiceTech-exclusive op) is denied ERR_FORBIDDEN."
        test_recipe:
          setup: ["A ticket in IN_REPAIR and an IN_STOCK PART item."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Rb Cust", email: "rb@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Rb Machine", category: "SEWING_MACHINE", brand: "G", msrp_cents: 50000 }
              as: StoreManager
              captures: { machine_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Rb Part", category: "PART", brand: "G", msrp_cents: 3000 }
              as: StoreManager
              captures: { part_prod_id: $.data.id }
            - call: "POST /inventory-items"
              payload: { product_id: "${part_prod_id}", condition: "NEW", acquisition_cost_cents: 1000, list_price_cents: 3000 }
              as: StoreManager
              captures: { part_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", product_id: "${machine_id}" }
              as: ServiceTech
              captures: { rt_id: $.data.id }
            - call: "POST /repair-tickets/${rt_id}/quote"
              payload: { diagnosis: "d", labor_hours: 1.0 }
              as: ServiceTech
            - call: "POST /repair-tickets/${rt_id}/approve"
              payload: {}
              as: SalesAssociate
          trigger:
            - call: "POST /repair-tickets/${rt_id}/consume-part"
              payload: { inventory_item_id: "${part_id}" }
              as: SalesAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN"

  # -------------------------------------------------------- Cross-cutting layers
  - section: cross_cutting
    instances:
      - name: occ_version_increments_on_every_special_order_write
        claim_type: optimistic_concurrency
        grounds: [entities.SpecialOrder.fields.version, state_machines.SpecialOrder.REQUESTED_to_RECEIVED]
        distinguishing_aspect: "SpecialOrder.version increments by 1 on each mutation: receive advances version 1 -> 2."
        test_recipe:
          setup: ["A REQUESTED SpecialOrder (version 1)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Vv Cust", email: "vv@x.com" }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { model_name: "Vv Model", category: "SEWING_MACHINE", brand: "G", msrp_cents: 80000 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /special-orders"
              payload: { customer_id: "${cust_id}", product_id: "${prod_id}", quantity: 1, unit_price_cents: 80000, deposit_cents: 10000 }
              as: SalesAssociate
              captures: { so_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /special-orders/${so_id}/receive"
              payload: {}
              as: SalesAssociate
              captures: { v1: $.data.version }
          assert:
            - "SpecialOrder.${so_id}.version == 2"
            - "SpecialOrder.${so_id}.status == RECEIVED"

  # ---------------------------------------------------------- Excluded (in §1.8)
  - section: state_machines
    instances:
      - name: rental_overlap_excluded
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=8]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rental_half_open_item_overlap
          rationale: "The rental half-open overlap rejection is asserted by the named §1.8 instance."

      - name: class_capacity_boundary_excluded
        claim_type: Precondition Enforcement
        grounds: [entities.ClassSession.fields.capacity]
        excluded_because:
          difficulty_instance: boundary_precision_check / class_capacity_ge_boundary_waitlists
          rationale: "The >= capacity waitlist boundary is asserted by the named §1.8 instance."

      - name: sale_recall_block_excluded
        claim_type: Precondition Enforcement
        grounds: ["validations[priority=7]"]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / sale_complete_blocked_by_product_recall
          rationale: "The recall-blocks-completion dependency is asserted by the named §1.8 instance."
