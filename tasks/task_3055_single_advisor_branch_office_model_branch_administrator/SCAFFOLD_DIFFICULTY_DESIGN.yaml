              as: HomeOfficeAdmin
              captures: { eval1_outcome: $.data.outcome }
            - call: "POST /branch-office/production-records"
              payload: { advisor_id: "${adv_id}", gross_commission_cents: 6000, payout_rate: 1.0, posted_at: "2026-03-15T00:00:00Z" }
              as: HomeOfficeAdmin
            - call: "POST /branch-office/training-programs/${tp_id}/submit-milestone"
              payload: {}
              as: Advisor
              as_user_id: "${adv_id}"
          trigger:
            - call: "POST /branch-office/training-programs/${tp_id}/evaluate"
              payload: { window_end: "2026-04-01T00:00:00Z" }
              as: HomeOfficeAdmin
              captures: { eval2_outcome: $.data.outcome, eval2_prod: $.data.production_cents }
          assert:
            - "First MilestoneEvaluation.outcome == FAIL and TrainingProgram status went REMEDIATION (loop, not FAILED — only one prior FAIL allowed)"
            - "TrainingProgram.${tp_id}.status after second evaluate == COMPLETED"
            - "Second MilestoneEvaluation.production_cents == 11000 (cumulative from program start_date)"
            - "Advisor.${adv_id}.status == VALIDATED"

