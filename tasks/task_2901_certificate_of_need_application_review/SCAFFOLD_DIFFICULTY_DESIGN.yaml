        grounds:
          - state_machines.Appeal.HEARD_to_REVERSED
          - state_machines.Application.APPROVED_to_DENIED
          - state_machines.Certificate.ISSUED_to_REVOKED
          - state_machines.BatchingCycle.DECIDED_to_COMPARATIVE_REVIEW
