        claim_type: computed_read
        grounds:
          - endpoints[GET /distribution/branches/{branchId}/performance-score]
          - calculations.branch_performance_score
        distinguishing_aspect: "The score endpoint is a pure read whose result depends on a query-string variant and on the snapshot history, so it can disagree with the branch's persisted performance_band without writing anything."
        excluded_because:
          difficulty_instance: branch_score_point_in_time_vs_trailing_blend_band_divergence
          rationale: "That §1.8 instance already reads the endpoint under both variants, shows the two bands diverging on identical snapshots, and asserts the persisted band and version are untouched — a plain computed-read test would assert a strict subset."

      - name: unwind_closure_is_allowed_only_inside_the_window_and_reverses_everything
        claim_type: conditional_action
        grounds:
          - endpoints[POST /distribution/consolidation-cases/{caseId}/unwind-closure]
          - state_machines.ConsolidationCase.transitions.CLOSURE_EXECUTED_to_UNWOUND
          - calculations.deposit_conservation_invariant
        distinguishing_aspect: "The action is conditional on two independent facts — the 30-day clock and the absence of any observation — and when permitted it must reverse every ledger movement exactly."
        excluded_because:
          difficulty_instance: unwind_closure_restores_market_deposit_ledger_exactly
          rationale: "That §1.8 instance executes, unwinds and re-reads every affected balance to prove zero drift on the branch, market and property carry ledgers; the conditional-action claim is fully contained in it."

  - section: errors
