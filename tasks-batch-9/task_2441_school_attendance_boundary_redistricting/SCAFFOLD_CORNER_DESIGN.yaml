scaffold_corner_design:
- section: entities
  instances:
  - name: study_creation_returns_every_declared_field
    claim_type: creation
    grounds:
    - entities.BoundaryStudy
    - endpoints[POST /redistricting/studies]
    - response_envelope
    distinguishing_aspect: 'A single POST with every required input returns 201 and the full BoundaryStudy projection: the seven input fields echoed verbatim, the five system/computed fields at their declared defaults (SETUP, false, null, 0, 0, false) and the four common fields, wrapped in the §1.0 success envelope with response_type ''object''.'
    test_recipe:
      setup:
      - Empty database. The logical clock is pinned to 2026-09-01T00:00:00Z so created_at is deterministic.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: DistrictPlanner
        as_user_id: planner-1
      trigger:
      - call: POST /redistricting/studies
        payload:
          name: 2028 Elementary Boundary Study
          district_name: Riverbend USD
          target_school_year: 2028
          horizon_years: 5
          capacity_target_low_pct: 85.0
          capacity_target_high_pct: 100.0
          portables_count_toward_capacity: true
          required_program_types:
          - DUAL_LANGUAGE
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          nst_id: $.data.id
      assert:
      - HTTP status is 201
      - The response body has meta.api_request_id, meta.api_request_timestamp and response_type == "object"
      - BoundaryStudy.${nst_id}.name == 2028 Elementary Boundary Study and district_name == Riverbend USD
      - BoundaryStudy.${nst_id}.target_school_year == 2028 and horizon_years == 5
      - BoundaryStudy.${nst_id}.capacity_target_low_pct == 85.00 and capacity_target_high_pct == 100.00
      - BoundaryStudy.${nst_id}.portables_count_toward_capacity == true and required_program_types == ["DUAL_LANGUAGE"]
      - BoundaryStudy.${nst_id}.status == SETUP and comment_intake_open == false and data_locked_at == null
      - BoundaryStudy.${nst_id}.resident_student_total == 0 and enrolled_of_record_total == 0 and projection_stale == false
      - BoundaryStudy.${nst_id}.version == 1 and id, created_at and updated_at are all non-null
  - name: school_retrieval_returns_stored_and_derived_capacity
    claim_type: retrieval
    grounds:
    - entities.School
    - endpoints[GET /redistricting/schools/{id}]
    - entities.School.fields.effective_capacity_seats
    distinguishing_aspect: 'GET by id returns exactly what POST stored plus the two derived fields: effective_capacity_seats 540 (core 500 + 40 portables, because this study''s portables_count_toward_capacity is true) and enrolled_students_of_record 500 (A-01''s 300 plus A-02''s 200 residents currently pointing at Cedar).'
    test_recipe:
      setup:
      - The Riverbend study is in SETUP with Cedar Elementary (core 500, portable 40, hosts DUAL_LANGUAGE) and Birch Elementary (core 400, portable 0).
      - Areas A-01 (300 residents) and A-02 (200 residents) have current_school_id Cedar; A-03 (150) points at Birch.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/studies
        payload:
          name: 2028 Elementary Boundary Study
          district_name: Riverbend USD
          target_school_year: 2028
          horizon_years: 5
          capacity_target_low_pct: 85.0
          capacity_target_high_pct: 100.0
          portables_count_toward_capacity: true
          required_program_types:
          - DUAL_LANGUAGE
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          st_id: $.data.id
      - call: POST /redistricting/studies/${st_id}/schools
        payload:
          name: Cedar Elementary
          level: ELEMENTARY
          core_capacity_seats: 500
          portable_capacity_seats: 40
          program_types:
          - DUAL_LANGUAGE
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          s1_id: $.data.id
      - call: POST /redistricting/studies/${st_id}/schools
        payload:
          name: Birch Elementary
          level: ELEMENTARY
          core_capacity_seats: 400
          portable_capacity_seats: 0
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          s2_id: $.data.id
      - call: POST /redistricting/planning-areas
        payload:
          study_id: ${st_id}
          area_code: A-01
          grade_band: ELEMENTARY
          current_school_id: ${s1_id}
          resident_student_count: 300
          frl_student_count: 90
          ell_student_count: 40
          median_household_income_usd: 78000
          annual_absorption_cap_units: 120
          travel_options:
          - school_id: ${s1_id}
            walk_distance_miles: 0.6
            bus_minutes: 10
            has_safe_route: true
          - school_id: ${s2_id}
            walk_distance_miles: 2.2
            bus_minutes: 22
            has_safe_route: false
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          a1_id: $.data.id
      - call: POST /redistricting/planning-areas
        payload:
          study_id: ${st_id}
          area_code: A-02
          grade_band: ELEMENTARY
          current_school_id: ${s1_id}
          resident_student_count: 200
          frl_student_count: 100
          ell_student_count: 30
          median_household_income_usd: 52000
          annual_absorption_cap_units: 150
          travel_options:
          - school_id: ${s1_id}
            walk_distance_miles: 1.4
            bus_minutes: 9
            has_safe_route: false
          - school_id: ${s2_id}
            walk_distance_miles: 0.8
            bus_minutes: 12
            has_safe_route: true
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          a2_id: $.data.id
      - call: POST /redistricting/planning-areas
        payload:
          study_id: ${st_id}
          area_code: A-03
          grade_band: ELEMENTARY
          current_school_id: ${s2_id}
          resident_student_count: 150
          frl_student_count: 30
          ell_student_count: 10
          median_household_income_usd: 96000
          annual_absorption_cap_units: 90
          travel_options:
          - school_id: ${s1_id}
            walk_distance_miles: 3.0
            bus_minutes: 26
            has_safe_route: false
          - school_id: ${s2_id}
            walk_distance_miles: 0.9
            bus_minutes: 14
            has_safe_route: true
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          a3_id: $.data.id
      - call: POST /redistricting/area-adjacencies
        payload:
          area_id: ${a1_id}
          neighbor_area_id: ${a2_id}
          shared_boundary_length_ft: 5200
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/area-adjacencies
        payload:
          area_id: ${a2_id}
          neighbor_area_id: ${a3_id}
          shared_boundary_length_ft: 4100
        as: DistrictPlanner
        as_user_id: planner-1
      trigger:
      - call: GET /redistricting/schools/${s1_id}
        payload: {}
        as: DistrictPlanner
        as_user_id: planner-1
      assert:
      - HTTP status is 200 and response_type == "object"
      - School.${s1_id}.study_id == ${st_id} and name == Cedar Elementary and level == ELEMENTARY
      - School.${s1_id}.core_capacity_seats == 500 and portable_capacity_seats == 40
      - School.${s1_id}.program_types == ["DUAL_LANGUAGE"] and status == ACTIVE
      - School.${s1_id}.effective_capacity_seats == 540
      - School.${s1_id}.enrolled_students_of_record == 500
      - School.${s1_id}.version == 1
  - name: planning_area_listing_paginates_with_total_count_and_has_more
