              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Enrollment.${eid}.seat_status == RELEASED (state violation)"
            - "Program.${pid}.posture == LOCKDOWN (business_safety violation)"
            - "Both rules violated; priority 6 (state) < priority 7 (business_safety) so state wins"
            - "error_id == ERR_INVALID_STATE (not ERR_PROGRAM_LOCKED_DOWN)"

      - name: business_temporal_vs_business_referential_schedule_with_bad_room_and_overlap
        grounds:
          - validations[priority=14]
          - validations[priority=5]
        distinguishing_aspect: |
          Pair: existence (priority 5, ERR_REFERENCE_NOT_FOUND for nonexistent
          room_id) vs business_temporal (priority 14, ERR_ROOM_OVERLAP). When the
          room_id references a non-existent room AND would also overlap if it
          existed, the existence error wins because priority 5 < priority 14.
