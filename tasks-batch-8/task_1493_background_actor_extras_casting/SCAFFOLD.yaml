  - { method: POST, path: "/central-casting/vouchers/{id}/issue", description: "DRAFT -> ISSUED; runs voucher_gross_final (event replay, APPROVED bumps only)", roles: [CastingAssociate], code: 200, input: [], output: Voucher, side_effects: ["all computed pay fields stored; issued_by/at set; version +1"] }
  - { method: POST, path: "/central-casting/vouchers/{id}/dispute", description: "ISSUED -> DISPUTED (owner actor); auto-removes from OPEN batch, recomputes batch gross and production exposure", roles: [BackgroundActor], code: 200, input: ["reason?"], output: Voucher, side_effects: ["batch removal cascade; production exposure recompute; version +1"] }
  - { method: POST, path: "/central-casting/vouchers/{id}/adjust", description: "ISSUED|DISPUTED|REJECTED -> ISSUED with recomputation (OCC on voucher version)", roles: [CastingAssociate], code: 200, input: [expected_voucher_version, "note?"], output: Voucher, side_effects: ["voucher_gross_final recomputed; adjusted_by_user_id set; increments Voucher.version by 1"] }

