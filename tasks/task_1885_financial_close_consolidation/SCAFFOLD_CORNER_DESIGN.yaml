  # ===========================================================================
  # Section 5 — Endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_periods_pagination_envelope
        claim_type: listing
        grounds: ["endpoints.\"GET /close/periods\"", "response_envelope"]
        distinguishing_aspect: "GET /close/periods returns the standard pagination envelope: limit/offset/total_count/has_more with default limit 10."
        test_recipe:
          setup: ["Three periods created"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - { call: "POST /close/periods", payload: { fiscal_year: 2026, fiscal_period: 1, period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }, as: Controller }
            - { call: "POST /close/periods", payload: { fiscal_year: 2026, fiscal_period: 2, period_start: "2026-02-01T00:00:00Z", period_end: "2026-02-28T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }, as: Controller }
            - { call: "POST /close/periods", payload: { fiscal_year: 2026, fiscal_period: 3, period_start: "2026-03-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", reporting_currency: USD, materiality_threshold_minor: 10000 }, as: Controller }
          trigger:
            - call: "GET /close/periods"
              payload: { limit: 2, offset: 0 }
              as: Controller
          assert:
            - "response envelope has response_type == array and data is a list"
            - "pagination meta exposes total_count == 3 and has_more == true for limit 2 offset 0"
            - "default limit is 10 per response_envelope.pagination_defaults"

      - name: get_period_returns_stored_fields
        claim_type: retrieval
        grounds: ["endpoints.\"GET /close/periods/{id}\""]
        distinguishing_aspect: "GET /close/periods/{id} returns the persisted fiscal_year, fiscal_period, reporting_currency, and computed close_posture."
        test_recipe:
          setup: ["One period created (not yet opened)"]
          setup_api_calls:
            - { call: "POST /close/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: Controller }
            - call: "POST /close/periods"
              payload: { fiscal_year: 2026, fiscal_period: 7, period_start: "2026-07-01T00:00:00Z", period_end: "2026-07-31T00:00:00Z", reporting_currency: EUR, materiality_threshold_minor: 2500 }
              as: Controller
              captures: { per_id: $.data.id }
          trigger:
            - call: "GET /close/periods/${per_id}"
              payload: {}
              as: Auditor
              captures: { fy: $.data.fiscal_year, fp: $.data.fiscal_period, rc: $.data.reporting_currency, st: $.data.status }
          assert:
            - "GET returns fiscal_year == 2026, fiscal_period == 7, reporting_currency == EUR"
            - "status == SCHEDULED (initial state before open)"

