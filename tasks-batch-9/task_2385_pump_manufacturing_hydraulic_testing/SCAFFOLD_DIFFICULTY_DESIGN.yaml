  - rule_id: transitive_cascade
    instances:
      - name: scrap_disposition_cascades_lot_quarantine_build_short_package_hold_kit_release
        grounds:
          - state_machines.CastingLot.ACCEPTED_to_QUARANTINED
          - state_machines.BuildOrder.TESTED_to_CASTING_SHORT
          - state_machines.PumpPackage.CONFIGURED_to_HELD
          - state_machines.KitAllocation.RESERVED_to_RELEASED
          - calculations.casting_yield_ledger
          - endpoints["POST /casting-defects/{id}/disposition"]
        distinguishing_aspect: |
          Four-level chain from ONE call: disposition SCRAP -> lot ledger reconciled and lot
          QUARANTINED (hop 1) -> newest bound non-terminal BuildOrder to CASTING_SHORT with
          committed_build_count decremented (hop 2) -> that order's PumpPackage to HELD with
          promised_ship_date cleared (hop 3) -> every RESERVED KitAllocation on the order
          RELEASED with RepairKit stock restored (hop 4). Implementations that stop after the
          lot, or that release the kit without holding the package, fail on different asserts.
        test_recipe:
          setup:
            - "Master data as in rule 1 instance 1 with PatternAsset wear_threshold 20."
            - "APPROVED Selection on APP-1001, CastingLot H-9001 with qty_poured 1, ACCEPTED (qty_accepted 1)."
            - "BuildOrder SN-0001 bound to that lot (committed_build_count 1), ASSEMBLED then TESTED via a certified TestRun, and PumpPackage PKG-A CONFIGURED with promised_ship_date 2026-09-20."
            - "RepairKit RK-HSC14-G2 with 5 units received; KitAllocation of 2 units RESERVED against SN-0001, leaving qty_on_hand 3 and qty_reserved 2."
            - "One REPORTED CRITICAL CastingDefect on the lot with affected_qty 1, reported by the FoundryPartner."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
