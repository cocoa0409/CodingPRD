              as_user_id: "psa-ops"
            - call: "POST /governance/plans/${planc_id}/charter/adopt"
              payload: { quorum_min_voting_members: 5, voting_threshold_pct: 0.6000, max_voting_seats: 1, charter_doc_ref: "CHTR-CVH-2026-A" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/plans/${planc_id}/charter/adopt"
              payload: { quorum_min_voting_members: 2, voting_threshold_pct: 0.6000, max_voting_seats: 3, charter_doc_ref: "CHTR-CVH-2026-A" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
          assert:
            - "call 1 returned 409 with data.error_id == ERR_CHARTER_SEATS_INSUFFICIENT: one voting seat is short of the floor of 2, and Plan.${planc_id}.charter_status is still DRAFT with version unchanged"
            - "call 2 returned 409 with data.error_id == ERR_DUPLICATE_RESOURCE: (plan_id, seat_code) is the uniqueness tuple, so C-CHAIR collides even with a different seat_class and voting flag"
            - "call 3 returned 201 for the same seat_index 2 that call 2 tried — seat_index carries no uniqueness constraint, only seat_code does"
            - "call 4 returned 409 with data.error_id == ERR_CHARTER_SEATS_INSUFFICIENT again: the new seat is non-voting, and the aggregate counts only voting == true seats, so adding it changed nothing"
            - "call 5 returned 201: the plan now holds 2 voting seats and 2 non-voting seats, and 2 <= Plan.max_voting_seats 3, so the create-side cap is satisfied"
            - "call 6 returned 409 with data.error_id == ERR_CHARTER_SEATS_INSUFFICIENT from the OPPOSITE direction: the floor of 2 is met, but 2 voting seats exceed the max_voting_seats == 1 carried in this body — the same error_id for too few and for too many"
            - "call 7 returned 400 with data.error_id == ERR_INVALID_REQUEST: quorum_min_voting_members 4 > max_voting_seats 3 is a body-shape contradiction caught at priority 38, well before the seat aggregate"
            - "call 8, which violates BOTH the shape rule (5 > 1) and the seat ceiling (2 voting seats > 1), returned 400 ERR_INVALID_REQUEST — priority 38 outranks the 409 aggregate"
            - "call 9 returned 200: charter_status == ADOPTED, charter_adopted_quarter_index == 0, and quorum_min_voting_members / voting_threshold_pct / max_voting_seats were overwritten from the body"
            - "Plan.${planc_id}.menu_posture is still FROZEN after adoption: the posture recompute needs an ADOPTED IPS and quorum_min ACTIVE voting members too, neither of which exists yet"
            - "the collision in call 2 named ${planc_id} on both sides: nothing in the response mentions any other plan's C-CHAIR, so the constraint is the plan-scoped pair (plan_id, seat_code) and never seat_code alone"
            - "SPEC CONFLICT recorded, not asserted: §1.6 gives ERR_CHARTER_SEATS_INSUFFICIENT the condition 'would leave fewer filled voting seats than quorum_min_voting_members', while §1.2 counts non-RETIRED voting SEATS (filled or not) against a floor of 2 and against the submitted max — three different readings of one error id."

      - name: the_criteria_gate_runs_before_the_gate_that_says_which_ips_is_current
        claim_type: Cascading validation
        grounds:
          - validations.priority_55_ERR_FUND_FAILS_IPS_CRITERIA
          - validations.priority_62_ERR_NO_ADOPTED_IPS
          - validations.priority_63_ERR_IPS_VERSION_STALE
          - calculations.ips_eligibility
        distinguishing_aspect: "Rule 55 evaluates a candidate fund against 'the plan's ADOPTED IPS', but it sits at a LOWER priority number than rules 62 and 63, which are the rules that establish that an adopted IPS exists and that the target row is pinned to it. The recipe adopts a stricter IPS-2026-B under a slot still pinned to IPS-2026-A and shows the inversion in both directions: a fund that passes A's expense cap but fails B's is rejected 422 on the criteria of the NEW policy while the staleness of the slot goes unmentioned, and only a fund that satisfies B gets far enough to hear the 409 staleness complaint. A bare plan with no IPS at all supplies the 62 case, which is reachable at slot create and structurally unreachable at seat-fund."
        test_recipe:
          setup:
            - "chain_l3: main plan with IPS-2026-A ADOPTED (min_track_record_quarters 12, expense_peer_multiple 1.25 so the cap on a peer median of 40 bps is floor(50) == 50), five CORE slots seated, occupied 5 / available 1, posture OPEN."
            - "IPS-2026-B is drafted stricter — min_track_record_quarters 24 and expense_peer_multiple 1.10, so the same peer median of 40 bps yields floor(44) == 44 — then carried and adopted through meeting 6, which supersedes IPS-2026-A."
            - "Two slots straddle the adoption: a REAL_ASSETS slot created BEFORE it (ips_id pinned to IPS-2026-A) and an EMERGING_MKTS slot created AFTER it (pinned to IPS-2026-B)."
