# =============================================================================
# §1.9 Scaffold Corner Design — breadth probe for
# task_2269 Home Electrification Assessment & Panel Upgrade Rebate
#
# Taxonomy: references/claim-extraction-guide.md. `section:` values are the
# guide's nine sections; `claim_type:` values are its per-section rows.
#
# Shared fixture vocabulary (every instance still spells its own chain out in
# full; this is orientation only):
#
#   BASE PROGRAM   POST /programs as ProgramAdmin "admin-1" with only
#                  name / state_code / budget_total_cents, then
#                  POST /programs/{id}/status new_status=OPEN. Every other
#                  program parameter is left at its §1.1 default:
#                  reservation_ttl_days 120, extension_window_days 30,
#                  max_extension_days 60, max_extensions_per_reservation 1,
#                  low/moderate/standard caps 1400000 / 800000 / 300000,
#                  cost shares 1.00 / 0.50 / 0.30, AMI thresholds 80.0 / 150.0,
#                  group_cap_cents 800000, panel_upgrade_cap_cents 400000,
#                  federal_credit_pct 0.3, federal_credit_cap_cents 200000,
#                  max_combined_benefit_pct 1.0, max_remediations_per_project 1,
#                  quality_suspension_threshold 70, recertification_threshold 75.
#   BASE MEASURE   HP-HVAC-01: HVAC, unit 800000, cap 800000, HVAC_GROUP,
#                  required_panel_capacity_amps 200, anchor, sort_order 10.
#   BASE HOUSEHOLD household_size 4, existing_panel_amps 200, income
#                  8000000 against county median 10000000 -> ami_percent 80.0
#                  -> LOW tier, rebate_cap_cents 1400000, cost share 1.00.
#   BASE PROJECT   one HP-HVAC-01 line, planned_quantity 1,
#                  estimated_cost_cents 1000000 ->
#                  line = min(800000, 800000, floor(1000000 * 1.00)) = 800000,
#                  provisional_total_incentive_cents 800000.
#   ACTORS         admin-1 (ProgramAdmin), reviewer-1 and reviewer-2
#                  (ProgramReviewer, kept distinct for segregation of duties),
#                  household id as the Applicant X-User-ID, contractor id as the
#                  Contractor X-User-ID, inspector id as the FieldInspector
#                  X-User-ID.
#   CLOCK          default logical clock 2026-08-01T00:00:00Z unless an instance
#                  moves it with POST /_clock/set_current_utc.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: program_creation_returns_declared_fields_and_draft_status
        claim_type: creation
        grounds:
          - entities.Program
          - endpoints.POST_/programs
          - response_envelope.success
        distinguishing_aspect: |
          A program created with only its three required inputs returns 201
          carrying every §1.1 Program field, with version 1, status DRAFT and
          budget_available_cents mirroring budget_total_cents while the other
          three buckets are 0.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Base", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "Trigger call 1 returns 201 and the envelope is { meta: { api_request_id, api_request_timestamp }, response_type: \"object\", data: {...} }"
            - "Program.${prog_id}.status == DRAFT, version == 1, and id / created_at / updated_at are all present and non-null"
            - "Program.${prog_id}.name == \"HEEHRA 2026 Base\", state_code == \"CO\", budget_total_cents == 50000000"
            - "Program.${prog_id}.budget_available_cents == 50000000, budget_reserved_cents == 0, budget_committed_cents == 0, budget_clawed_back_cents == 0"
            - "Trigger call 2 returns the same field values, so nothing about the create response was request-only"

      - name: household_retrieval_returns_stored_values_and_unassigned_tier_fields
        claim_type: retrieval
        grounds:
          - entities.Household
          - endpoints.GET_/households/{id}
        distinguishing_aspect: |
          GET /households/{id} echoes every stored input field verbatim and
          reports the tier fields in their pre-verification state: ami_percent
          null, income_tier null, and the three cent counters at 0 — a
          household is created with no entitlement at all.
        test_recipe:
          setup:
            - "One OPEN program (BASE PROGRAM)."
            - "One household registered with BASE HOUSEHOLD inputs and no income verification yet."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Retrieval", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Ana Reyes", email: "ana@example.com", service_address_line1: "9 Aspen Ct", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
          trigger:
            - call: "GET /households/${hh_id}"
              payload: {}
              as: Applicant
              as_user_id: "${hh_id}"
          assert:
            - "Returns 200 with Household.${hh_id}.program_id == ${prog_id}, applicant_name == \"Ana Reyes\", email == \"ana@example.com\", service_address_line1 == \"9 Aspen Ct\", county_code == \"CO-031\", utility_territory_code == \"XCEL-CO\", household_size == 4, existing_panel_amps == 200"
            - "Household.${hh_id}.ami_percent == null and income_tier == null"
            - "Household.${hh_id}.rebate_cap_cents == 0, lifetime_cap_remaining_cents == 0, encumbered_cents == 0"
            - "Household.${hh_id}.version == 1 and a second identical GET still reports version 1 — reads never bump the version"

      - name: catalog_listing_paginates_and_filters_by_category
        claim_type: listing
        grounds:
          - endpoints.GET_/programs/{id}/measure-catalog-items
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three catalog items in two categories, limit/offset and the
          category filter interact exactly once: limit 2 reports total_count 3
          with has_more true, offset 2 reports the remaining single item with
          has_more false, and category=WATER_HEATING reports total_count 1 —
          the count reflects the FILTERED set, not the table.
        test_recipe:
          setup:
            - "One DRAFT program is enough — catalog items need no program state."
            - "Three catalog items: HP-HVAC-01 (HVAC), WH-HPWH-01 (WATER_HEATING) and EN-INSUL-01 (ENVELOPE)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Catalog", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, measure_cap_cents: 800000, combined_cap_group: "HVAC_GROUP", sort_order: 10, required_panel_capacity_amps: 200, qualifies_as_appliance_anchor: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "WH-HPWH-01", measure_name: "Heat-pump water heater", category: "WATER_HEATING", unit_incentive_cents: 175000, measure_cap_cents: 175000, combined_cap_group: "WATER_GROUP", sort_order: 20, required_panel_capacity_amps: 150, qualifies_as_appliance_anchor: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "EN-INSUL-01", measure_name: "Attic insulation and air sealing", category: "ENVELOPE", unit_incentive_cents: 160000, measure_cap_cents: 160000, combined_cap_group: "NONE", sort_order: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /programs/${prog_id}/measure-catalog-items"
              payload: { limit: 2, offset: 0 }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /programs/${prog_id}/measure-catalog-items"
              payload: { limit: 2, offset: 2 }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /programs/${prog_id}/measure-catalog-items"
              payload: { category: "WATER_HEATING" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /programs/${prog_id}/measure-catalog-items"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          assert:
            - "Trigger call 1 returns 200 with response_type \"array\", exactly 2 items, total_count 3, has_more true, limit 2, offset 0"
            - "Trigger call 2 returns exactly 1 item, total_count 3, has_more false"
            - "Trigger call 3 returns exactly 1 item with measure_code \"WH-HPWH-01\", total_count 1 and has_more false — the filter narrows the count"
            - "Trigger call 4 omits limit/offset and returns all 3 items with the declared defaults limit 10, offset 0, has_more false"

      - name: unknown_program_id_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_PROGRAM_NOT_FOUND
          - validations.priority_5
          - endpoints.GET_/programs/{id}
        distinguishing_aspect: |
          A syntactically valid but unknown UUID in the path is a
          priority-5 existence failure: 404 ERR_PROGRAM_NOT_FOUND with the
          error envelope, not an empty 200 body.
        test_recipe:
          setup:
            - "One unrelated program exists, so the store is non-empty and the 404 cannot come from an empty table."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Decoy", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /programs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { missing_error_id: $.data.error_id }
          assert:
            - "Returns 404 with response_type \"error\" and data.error_id == \"ERR_PROGRAM_NOT_FOUND\""
            - "data.message is a non-empty string"
            - "The unrelated Program.${prog_id} is untouched and still retrievable"

      - name: household_create_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.Household.fields.household_size
          - entities.Household.fields.existing_panel_amps
          - validations.priority_3
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Every §1.5 input listed without a trailing `?` is mandatory: omitting
          household_size, and separately omitting existing_panel_amps, each
          returns 400 ERR_INVALID_REQUEST at priority 3 and creates no
          Household row.
        test_recipe:
          setup:
            - "One OPEN program (BASE PROGRAM)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Required", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Bea Cruz", email: "bea@example.com", service_address_line1: "1 Birch Rd", county_code: "CO-031", utility_territory_code: "XCEL-CO", existing_panel_amps: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err_no_size: $.data.error_id }
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Bea Cruz", email: "bea@example.com", service_address_line1: "1 Birch Rd", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err_no_amps: $.data.error_id }
          assert:
            - "Trigger call 1 returns 400 with data.error_id == \"ERR_INVALID_REQUEST\" (household_size missing)"
            - "Trigger call 2 returns 400 with data.error_id == \"ERR_INVALID_REQUEST\" (existing_panel_amps missing)"
            - "GET /programs/${prog_id}/households as ProgramAdmin returns total_count 0 — neither rejected call created a partial row"

      - name: program_and_catalog_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.Program
          - entities.MeasureCatalogItem
          - endpoints.POST_/programs
          - endpoints.POST_/programs/{id}/measure-catalog-items
        distinguishing_aspect: |
          Omitting every optional input yields exactly the §1.1 `default:`
          values, pinned as literals: program_year 2026, reservation_ttl_days
          120, extension_window_days 30, max_extension_days 60,
          max_extensions_per_reservation 1, caps 1400000 / 800000 / 300000,
          shares 1.00 / 0.50 / 0.30, thresholds 80.0 / 150.0, group_cap_cents
          800000, panel_upgrade_cap_cents 400000, federal_credit_pct 0.3,
          federal_credit_cap_cents 200000, max_combined_benefit_pct 1.0,
          max_remediations_per_project 1, quality_suspension_threshold 70,
          recertification_threshold 75 — and on the catalog item max_quantity
          1, required_panel_capacity_amps 0, upgraded_capacity_amps 0, the four
          booleans false and active true.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Defaults", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "EN-INSUL-01", measure_name: "Attic insulation and air sealing", category: "ENVELOPE", unit_incentive_cents: 160000, measure_cap_cents: 160000, combined_cap_group: "NONE", sort_order: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { item_id: $.data.id }
          assert:
            - "Program.${prog_id}.program_year == 2026, reservation_ttl_days == 120, extension_window_days == 30, max_extension_days == 60, max_extensions_per_reservation == 1"
            - "Program.${prog_id}.low_tier_cap_cents == 1400000, moderate_tier_cap_cents == 800000, standard_tier_cap_cents == 300000"
            - "Program.${prog_id}.low_tier_cost_share_pct == 1.0, moderate_tier_cost_share_pct == 0.5, standard_tier_cost_share_pct == 0.3"
            - "Program.${prog_id}.ami_low_threshold_pct == 80.0, ami_moderate_threshold_pct == 150.0"
            - "Program.${prog_id}.group_cap_cents == 800000, panel_upgrade_cap_cents == 400000"
            - "Program.${prog_id}.federal_credit_pct == 0.3, federal_credit_cap_cents == 200000, max_combined_benefit_pct == 1.0"
            - "Program.${prog_id}.max_remediations_per_project == 1, quality_suspension_threshold == 70, recertification_threshold == 75"
            - "MeasureCatalogItem.${item_id}.max_quantity == 1, required_panel_capacity_amps == 0, upgraded_capacity_amps == 0"
            - "MeasureCatalogItem.${item_id}.is_panel_upgrade == false, requires_qualifying_appliance == false, qualifies_as_appliance_anchor == false, standard_tier_eligible == false, active == true"

      - name: household_computed_tier_fields_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Household.fields.income_tier
          - entities.Household.fields.rebate_cap_cents
          - entities.Household.fields.ami_percent
          - calculations.income_tier_assignment
        distinguishing_aspect: |
          income_tier, ami_percent and rebate_cap_cents are `source: computed`:
          a create payload that asserts LOW / 12.3 / 9999999 is ignored
          outright (they stay null / null / 0), and the only writer is
          income_tier_assignment on VERIFY, which then produces 80.0 / LOW /
          1400000.
        test_recipe:
          setup:
            - "One OPEN program (BASE PROGRAM)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Computed", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Cai Nkemi", email: "cai@example.com", service_address_line1: "7 Cedar Ln", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200, income_tier: "LOW", ami_percent: 12.3, rebate_cap_cents: 9999999, lifetime_cap_remaining_cents: 9999999 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id, ignored_input_error_id: $.data.error_id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /income-verifications/${iv_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          assert:
            - "Trigger call 1 returns 201 and Household.${hh_id}.income_tier == null, ami_percent == null, rebate_cap_cents == 0, lifetime_cap_remaining_cents == 0 — every client-supplied computed value was discarded"
            - "After trigger call 3: Household.${hh_id}.ami_percent == 80.0, income_tier == LOW, rebate_cap_cents == 1400000, lifetime_cap_remaining_cents == 1400000, encumbered_cents == 0"
            - "IncomeVerification.${iv_id}.computed_ami_percent == 80.0, assigned_income_tier == LOW, assigned_cap_cents == 1400000"
            - "Household.${hh_id}.version == 2 after verification — exactly one write reached the household"

      - name: system_fields_generated_and_status_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Program.fields.status
          - entities.IncomeVerification.fields.submitted_by_user_id
          - entities.IncomeVerification.fields.verified_by_user_id
        distinguishing_aspect: |
          `source: system` fields are never client-writable: a POST /programs
          body carrying status OPEN and a fabricated version 99 still yields
          status DRAFT and version 1, and the actor-tracking fields
          submitted_by_user_id / verified_by_user_id are stamped from the
          X-User-ID header of the respective call, not from the body.
        test_recipe:
          setup:
            - "Nothing beyond the calls below."
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 System", state_code: "CO", budget_total_cents: 50000000, status: "OPEN", version: 99, budget_available_cents: 1 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, ignored_input_error_id: $.data.error_id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Dev Rao", email: "dev@example.com", service_address_line1: "4 Dogwood Dr", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4, verified_by_user_id: "reviewer-9" }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /income-verifications/${iv_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          assert:
            - "Trigger call 1 returns 201 with Program.${prog_id}.status == DRAFT, version == 1 and budget_available_cents == 50000000 — the body's status, version and budget_available_cents were all ignored"
            - "Program.${prog_id}.id is server-generated and differs from any value in the request body; created_at and updated_at are server timestamps"
            - "After trigger call 4: IncomeVerification.${iv_id}.submitted_by_user_id == ${hh_id} (the X-User-ID of the filing Applicant) and verified_by_user_id == null — the body's \"reviewer-9\" was discarded"
            - "After trigger call 5: IncomeVerification.${iv_id}.verified_by_user_id == \"reviewer-1\" and verified_at is non-null"
            - "Program.${prog_id}.version == 2 after trigger call 2 — the status transition, not the create body, is what advances it"

      - name: enum_and_numeric_range_constraints_rejected
        claim_type: type_constraints
        grounds:
          - entities.MeasureCatalogItem.fields.category
          - entities.MeasureCatalogItem.fields.unit_incentive_cents
          - entities.Household.fields.household_size
          - validations.priority_3
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          Four distinct §1.1 constraint kinds all land on the same priority-3
          error: an out-of-enum category ("SOLAR"), negative money
          (unit_incentive_cents -1), a below-range integer (household_size 0)
          and an out-of-enum transition target (new_status "PAUSED") each
          return 400 ERR_INVALID_REQUEST and write nothing.
        test_recipe:
          setup:
            - "One OPEN program (BASE PROGRAM) with no catalog items and no households."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Types", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "PV-SOLAR-01", measure_name: "Rooftop solar", category: "SOLAR", unit_incentive_cents: 500000, measure_cap_cents: 500000, combined_cap_group: "NONE", sort_order: 40 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err_enum: $.data.error_id }
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "EN-INSUL-01", measure_name: "Attic insulation", category: "ENVELOPE", unit_incentive_cents: -1, measure_cap_cents: 160000, combined_cap_group: "NONE", sort_order: 30 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err_negative: $.data.error_id }
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Eli Park", email: "eli@example.com", service_address_line1: "2 Elm St", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 0, existing_panel_amps: 100 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err_range: $.data.error_id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "PAUSED" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err_status_enum: $.data.error_id }
          assert:
            - "All four trigger calls return 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "The out-of-enum category is rejected before any existence or state check — GET /programs/${prog_id}/measure-catalog-items returns total_count 0"
            - "GET /programs/${prog_id}/households returns total_count 0"
            - "Program.${prog_id}.status is still OPEN and version is unchanged by the rejected status call"

      - name: inspector_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.Inspector
          - entities.EligibleMeasure
          - entities.ClawbackAction
          - endpoints.GET_/inspectors/{id}
        distinguishing_aspect: |
          The three `common_fields: false` entities — Inspector,
          EligibleMeasure and ClawbackAction — carry no `version` and no
          `updated_at`, and §1.5 declares no PATCH, PUT or DELETE anywhere in
          the API, so an inspector's certification can only be superseded by
          creating another Inspector row.
        test_recipe:
          setup:
            - "One DRAFT program is sufficient — inspectors are created directly under a program."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Immutable", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /inspectors"
              payload: { program_id: "${prog_id}", inspector_name: "Fern Oyelaran", certification_id: "INS-11", certification_expires_on: "2027-12-31" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { insp_id: $.data.id }
            - call: "GET /inspectors/${insp_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "Trigger call 1 returns 201 with Inspector.${insp_id}.id and created_at present, and NO version field and NO updated_at field in data"
            - "Trigger call 2 returns the identical payload, with inspector_name == \"Fern Oyelaran\", certification_id == \"INS-11\", certification_expires_on == \"2027-12-31\""
            - "§1.5 declares no PATCH / PUT / DELETE endpoint for Inspector (or for any entity), so the row is immutable by construction"
            - "GET /programs/${prog_id}/inspectors returns total_count 1"

      - name: catalog_item_requires_existing_parent_program
        claim_type: parent_relationships
        grounds:
          - entities.MeasureCatalogItem.fields.program_id
          - validations.priority_5
          - validations.priority_6
          - errors.ERR_PROGRAM_NOT_FOUND
        distinguishing_aspect: |
          The parent program is validated from BOTH directions: an unknown
          program in the PATH (priority 5) and an unknown program_id in the
          BODY of POST /households (priority 6) both return 404
          ERR_PROGRAM_NOT_FOUND, and the same body against the real program
          succeeds.
        test_recipe:
          setup:
            - "One real DRAFT program exists so the 404s cannot be an empty-table artifact."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Parent", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /programs/00000000-0000-4000-8000-0000000000aa/measure-catalog-items"
              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, measure_cap_cents: 800000, combined_cap_group: "HVAC_GROUP", sort_order: 10 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err_path_parent: $.data.error_id }
            - call: "POST /households"
              payload: { program_id: "00000000-0000-4000-8000-0000000000aa", applicant_name: "Gil Amara", email: "gil@example.com", service_address_line1: "6 Fir Ave", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err_body_parent: $.data.error_id }
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Gil Amara", email: "gil@example.com", service_address_line1: "6 Fir Ave", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
          assert:
            - "Trigger call 1 returns 404 with data.error_id == \"ERR_PROGRAM_NOT_FOUND\" (path parent, priority 5)"
            - "Trigger call 2 returns 404 with data.error_id == \"ERR_PROGRAM_NOT_FOUND\" (body reference, priority 6)"
            - "Trigger call 3 returns 201 with Household.${hh_id}.program_id == ${prog_id}"
            - "GET /programs/${prog_id}/measure-catalog-items returns total_count 0 — the rejected catalog item was not silently attached to the real program"

      - name: cross_program_body_reference_rejected
        claim_type: foreign_key_validation
        grounds:
          - validations.priority_6
          - errors.ERR_CONTRACTOR_NOT_FOUND
          - endpoints.POST_/assessments
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          The topology is flat, so cross-aggregate integrity is a same-program
          check rather than a URL-nesting one: an assessment whose household
          belongs to program A and whose contractor belongs to program B is
          refused with 404 ERR_CONTRACTOR_NOT_FOUND at priority 6 — before the
          priority-9 OCC check and before the priority-11 contractor-fitness
          check, both of which would otherwise also have something to say.
        test_recipe:
          setup:
            - "Two OPEN programs, A and B, each with the BASE MEASURE catalog item."
            - "Household HH-A and ENROLLED_ACTIVE contractor CTR-A both under program A; HH-A is LOW tier."
            - "Contractor CTR-B under program B, left in PENDING_ENROLLMENT — its enrollment state is irrelevant because the FK check fires first."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Program A", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_a: $.data.id }
            - call: "POST /programs/${prog_a}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_a}/measure-catalog-items"
              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, measure_cap_cents: 800000, combined_cap_group: "HVAC_GROUP", sort_order: 10, required_panel_capacity_amps: 200, qualifies_as_appliance_anchor: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Program B", state_code: "NM", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_b: $.data.id }
            - call: "POST /programs/${prog_b}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_a}", applicant_name: "Hana Ito", email: "hana@example.com", service_address_line1: "3 Hazel St", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_a: $.data.id }
            - call: "POST /households/${hh_a}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_a}"
              captures: { iv_a: $.data.id }
            - call: "POST /income-verifications/${iv_a}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /contractors"
              payload: { program_id: "${prog_a}", business_name: "Program A Mechanical", license_number: "MC-2001", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_a: $.data.id }
            - call: "POST /contractors/${ctr_a}/enrollment-decision"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /contractors"
              payload: { program_id: "${prog_b}", business_name: "Program B Mechanical", license_number: "MC-2002", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_b: $.data.id }
            - call: "GET /households/${hh_a}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { hh_a_v: $.data.version }
          trigger:
            - call: "POST /assessments"
              payload: { household_id: "${hh_a}", contractor_id: "${ctr_b}", assessed_panel_amps: 200, expected_household_version: "${hh_a_v}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { err_cross_program: $.data.error_id }
            - call: "POST /assessments"
              payload: { household_id: "${hh_a}", contractor_id: "${ctr_a}", assessed_panel_amps: 200, expected_household_version: "${hh_a_v}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_a}"
              captures: { asm_id: $.data.id }
          assert:
            - "Trigger call 1 returns 404 with data.error_id == \"ERR_CONTRACTOR_NOT_FOUND\" — Contractor.${ctr_b} exists but not within Household.${hh_a}'s program"
            - "Trigger call 1 returns neither 412 ERR_STALE_HOUSEHOLD_VERSION nor 409 ERR_CONTRACTOR_NOT_ACTIVE, even though ${ctr_b} is PENDING_ENROLLMENT"
            - "No Assessment was created by trigger call 1: GET /assessments?household_id=${hh_a} as ProgramReviewer returns total_count 1 after trigger call 2 and would have returned 0 before it"
            - "Trigger call 2 returns 201 with Assessment.${asm_id}.status == PENDING_REVIEW, qualified_measure_count == 1 and effective_panel_amps == 200"
            - "Household.${hh_a}.version was NOT bumped by the rejected trigger call 1 — the identical expected_household_version ${hh_a_v} is still current for trigger call 2"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: program_status_walks_draft_open_suspended_open
        claim_type: valid_transition
        grounds:
          - state_machines.Program.DRAFT_to_OPEN
          - state_machines.Program.OPEN_to_SUSPENDED
          - state_machines.Program.SUSPENDED_to_OPEN
          - endpoints.POST_/programs/{id}/status
        distinguishing_aspect: |
          Each declared Program transition fires on its own trigger and each
          one bumps version by exactly 1, so a DRAFT -> OPEN -> SUSPENDED ->
          OPEN walk ends at status OPEN with version 4.
        test_recipe:
          setup:
            - "One DRAFT program (BASE PROGRAM), version 1."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Walk", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "SUSPENDED", status_note: "Quarterly appropriation review" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "Trigger call 1 returns 200 with Program.${prog_id}.status == OPEN and version == 2"
            - "Trigger call 2 returns 200 with status == SUSPENDED and version == 3"
            - "Trigger call 3 returns 200 with status == OPEN and version == 4"
            - "No budget field changed across the three transitions: budget_available_cents == 50000000, budget_reserved_cents == 0, budget_committed_cents == 0, budget_clawed_back_cents == 0"
            - "GET /programs?status=OPEN as ProgramAdmin returns total_count 1 and GET /programs?status=SUSPENDED returns total_count 0"

      - name: newly_created_entities_start_in_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Program.initial_state
          - state_machines.Contractor.initial_state
          - state_machines.Assessment.initial_state
          - state_machines.RebateProject.initial_state
          - state_machines.ProjectMeasure.initial_state
          - entities.IncomeVerification.fields.status
        distinguishing_aspect: |
          Six state-bearing entities are created in one chain and every one
          lands in its §1.2 `initial_state` with no shortcut: Program DRAFT,
          IncomeVerification SUBMITTED, Contractor PENDING_ENROLLMENT,
          Assessment PENDING_REVIEW, RebateProject DRAFT, and each
          ProjectMeasure at install_status PLANNED / verification_status
          PENDING.
        test_recipe:
          setup:
            - "One OPEN program with the BASE MEASURE catalog item."
            - "A LOW-tier household (verified) and an ENROLLED_ACTIVE contractor are needed to reach an assessment and a project; a SECOND contractor is created and left undecided so its initial state can be observed."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Initial", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /programs/${prog_id}/measure-catalog-items"
              payload: { measure_code: "HP-HVAC-01", measure_name: "Ducted air-source heat pump", category: "HVAC", unit_incentive_cents: 800000, measure_cap_cents: 800000, combined_cap_group: "HVAC_GROUP", sort_order: 10, required_panel_capacity_amps: 200, qualifies_as_appliance_anchor: true }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Iris Bello", email: "iris@example.com", service_address_line1: "5 Iris Way", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /contractors"
              payload: { program_id: "${prog_id}", business_name: "Initial State Mechanical", license_number: "MC-3001", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr_id: $.data.id }
            - call: "POST /contractors/${ctr_id}/enrollment-decision"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv_id: $.data.id }
            - call: "POST /contractors"
              payload: { program_id: "${prog_id}", business_name: "Undecided Electric", license_number: "MC-3002", license_expires_on: "2027-06-30", insurance_expires_on: "2027-06-30" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { ctr2_id: $.data.id }
            - call: "POST /income-verifications/${iv_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "GET /households/${hh_id}"
              payload: {}
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { hh_v: $.data.version }
            - call: "POST /assessments"
              payload: { household_id: "${hh_id}", contractor_id: "${ctr_id}", assessed_panel_amps: 200, expected_household_version: "${hh_v}", measures: [ { measure_code: "HP-HVAC-01", proposed_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { asm_id: $.data.id }
            - call: "POST /assessments/${asm_id}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /rebate-projects"
              payload: { household_id: "${hh_id}", assessment_id: "${asm_id}", contractor_id: "${ctr_id}", income_verification_id: "${iv_id}", estimated_project_cost_cents: 1000000, measures: [ { measure_code: "HP-HVAC-01", planned_quantity: 1, estimated_cost_cents: 1000000 } ] }
              as: Contractor
              as_user_id: "${ctr_id}"
              captures: { proj_id: $.data.id }
          assert:
            - "IncomeVerification.${iv_id}.status == SUBMITTED immediately after trigger call 1, with verified_by_user_id == null and assigned_income_tier == null"
            - "Contractor.${ctr2_id}.status == PENDING_ENROLLMENT with quality_score_rolling == 100, completed_inspection_count == 0 and suspension_reason == null"
            - "Assessment.${asm_id}.status == PENDING_REVIEW immediately after trigger call 5, with approved_by_user_id == null"
            - "RebateProject.${proj_id}.status == DRAFT with submission_count == 0, remediation_count == 0, conditional_pass_flag == false, disbursed_amount_cents == 0 and final_total_incentive_cents == null"
            - "GET /rebate-projects/${proj_id}/measures returns 1 line with install_status == PLANNED, verification_status == PENDING, rejection_reason == null and provisional_incentive_cents == 800000"
            - "Program.${prog_id} was created DRAFT — the OPEN status in setup is the result of an explicit transition, not of creation"

      - name: second_income_verification_after_verified_rejected
        claim_type: precondition_enforcement
        grounds:
          - errors.ERR_INCOME_TIER_ALREADY_VERIFIED
          - validations.priority_8
          - endpoints.POST_/households/{id}/income-verifications
          - endpoints.POST_/income-verifications/{id}/verify
        distinguishing_aspect: |
          Once a household holds a VERIFIED IncomeVerification, the precondition
          is enforced on BOTH doors: filing another verification and verifying a
          second SUBMITTED one each return 409
          ERR_INCOME_TIER_ALREADY_VERIFIED, and the household's tier and cap
          stay at their first-verification values.
        test_recipe:
          setup:
            - "One OPEN program (BASE PROGRAM)."
            - "A household with a VERIFIED income verification at 80.0% AMI: income 8000000, county median 10000000, size 4 -> LOW tier, cap 1400000."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Verify Once", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Jonah Vex", email: "jonah@example.com", service_address_line1: "8 Juniper Rd", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv1_id: $.data.id }
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 4000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { iv2_id: $.data.id }
            - call: "POST /income-verifications/${iv1_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /households/${hh_id}/income-verifications"
              payload: { annual_household_income_cents: 4000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_id}"
              captures: { err_refile: $.data.error_id }
            - call: "POST /income-verifications/${iv2_id}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
              captures: { err_reverify: $.data.error_id }
            - call: "POST /income-verifications/${iv2_id}/verify"
              payload: { decision: "REJECT", reviewer_notes: "Superseded by the verified filing" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          assert:
            - "Trigger call 1 returns 409 with data.error_id == \"ERR_INCOME_TIER_ALREADY_VERIFIED\""
            - "Trigger call 2 returns 409 with data.error_id == \"ERR_INCOME_TIER_ALREADY_VERIFIED\" — the pre-existing SUBMITTED filing ${iv2_id} cannot be promoted either"
            - "Trigger call 3 returns 200 with IncomeVerification.${iv2_id}.status == REJECTED — rejecting a redundant filing is still allowed"
            - "Household.${hh_id}.income_tier == LOW, ami_percent == 80.0 and rebate_cap_cents == 1400000 throughout — the 40.0% figures in the refused filings never reached the household"
            - "GET /households/${hh_id}/income-verifications?status=VERIFIED as ProgramReviewer returns total_count 1"

      - name: new_assessment_supersedes_prior_live_assessment
        claim_type: side_effect_execution
        grounds:
          - state_machines.Assessment.PENDING_REVIEW_to_SUPERSEDED
          - state_machines.Assessment.APPROVED_to_SUPERSEDED
          - endpoints.POST_/assessments
        distinguishing_aspect: |
          Creating an assessment for a household that already has a live one
          moves the prior row to SUPERSEDED as a declared side effect — from
          PENDING_REVIEW and, on the third assessment, from APPROVED — while
