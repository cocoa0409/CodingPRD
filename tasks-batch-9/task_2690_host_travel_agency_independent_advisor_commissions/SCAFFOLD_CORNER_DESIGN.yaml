            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "${sched_id}", effective_date: "2026-01-01", post_departure_advisor_pct: 0.50, expected_advisor_version: "${adv_v0}" }
              as: HostOperations
            - call: "POST /host-agency/settlement-runs"
              payload: { period_month: "2026-06" }
              as: HostOperations
              captures: { run_open_id: $.data.id }
            - call: "POST /host-agency/settlement-runs"
              payload: { period_month: "2026-07" }
              as: HostOperations
              captures: { run_id: $.data.id, run_status0: $.data.status, run_count0: $.data.statement_count }
          trigger:
            - call: "POST /host-agency/settlement-runs/${run_open_id}/post"
              payload: {}
              as: HostController
              as_user_id: "ctrl-2"
              captures: { err_not_calculated: $.data.error_id }
            - call: "POST /host-agency/settlement-runs/${run_id}/calculate"
              payload: {}
              as: HostController
              as_user_id: "ctrl-1"
              captures: { calc_status: $.data.status, calc_count: $.data.statement_count }
            - call: "POST /host-agency/settlement-runs/${run_id}/post"
              payload: {}
              as: HostController
              as_user_id: "ctrl-2"
              captures: { post_status: $.data.status, post_count: $.data.statement_count }
          assert:
            - "OPEN AT CREATION: run_status0 == OPEN and run_count0 == 0"
            - "POST WITHOUT CALCULATE: HTTP 409 and err_not_calculated == ERR_INVALID_RUN_STATE; SettlementRun.${run_open_id}.status is still OPEN"
            - "EMPTY CALCULATE SUCCEEDS: calc_status == CALCULATED and calc_count == 0"
            - "EMPTY POST SUCCEEDS: post_count == 0 and post_status == CLOSED, because §1.5 declares that a run with statement_count == 0 goes straight to CLOSED instead of resting in POSTED"
            - "SettlementRun.${run_id} totals are all 0: gross_commission_cents, advisor_share_total_cents, chargeback_total_cents, platform_fee_total_cents, marketing_fund_total_cents and net_payout_total_cents"
            - "Advisor.${adv_id}.lifetime_settled_share_cents == 0 — posting an empty run recognises nothing"
            - "GET /host-agency/advisor-statements reports total_count == 0"

