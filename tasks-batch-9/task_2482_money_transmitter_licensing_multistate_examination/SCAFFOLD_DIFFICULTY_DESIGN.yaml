          assert:
            - "StateLicense.${lic_ca_id}.license_status == SUSPENDED and bond_status == CANCELLATION_NOTICED"
            - "DelegateAuthorization.${auth_id}.status == SUSPENDED"
            - "Delegate.${del_id}.status == SUSPENDED and oversight_hold == true"
            - "StateLicense.${lic_ca_id}.active_delegate_count == 0"
            - "Delegate.${del_id}.authorized_state_count == 0"
            - "Delegate.${del_id}.oversight_score == 85 (unchanged — the cascade suspends, it does not re-score)"

