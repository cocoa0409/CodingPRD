              payload: { grid_cells: ["37N122W-01"], requested_alt_ft: 350, window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { auth_id: $.data.id }
            - call: "POST /_laanc/decision"
              payload: { authorization_id: "${auth_id}", outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /flights/${flight_id}/release"
              payload: {}
              as: FlightDirector
              as_user_id: "fd-1"
            - call: "POST /flights/${flight_id}/launch"
              payload: {}
              as: DispatchOperator
              as_user_id: "op-1"
            - call: "POST /incidents"
              payload: { drone_id: "${drone_id}", severity: "CRITICAL", category: "AIRSPACE_DEVIATION", narrative: "Drifted outside the authorized grid cell", flight_id: "${flight_id}" }
              as: DispatchOperator
