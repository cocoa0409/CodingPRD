# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Field Service & Warranty Depot Repair. Breadth probe over §1.1–§1.7 claims
# not already covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Logical clock default: 2026-08-01T00:00:00Z unless set_current_utc is called.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: customer_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Customer.fields.credit_limit_cents, entities.Customer.fields.loyalty_tier, entities.Customer.fields.deposit_exposure_cents]
        distinguishing_aspect: "Omitting credit_limit_cents and loyalty_tier yields defaults 100000 and STANDARD; computed deposit_exposure_cents starts 0 and client-supplied values for it are ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
          trigger:
            - { call: "GET /depot/customers/${cust}", as: IntakeAgent, payload: {} }
          assert:
            - "Customer.credit_limit_cents == 100000 (default applied)"
            - "Customer.loyalty_tier == 'STANDARD' (default applied)"
            - "Customer.deposit_exposure_cents == 0 (computed field initialized)"
            - "Customer.version == 1 and id is a prefix-free UUID"

      - name: unit_creation_duplicate_serial_rejected
        claim_type: type_constraints
        grounds: [entities.Unit.fields.serial_number, "errors[ERR_DUPLICATE_SERIAL]", "validations[priority=12]"]
        distinguishing_aspect: "Second unit with the same serial_number is rejected with ERR_DUPLICATE_SERIAL while a different serial succeeds."
        test_recipe:
          setup: ["model + customer exist"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" } }
          trigger:
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_SERIAL (http 409)"

      - name: unit_creation_invalid_channel_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Unit.fields.channel, "errors[ERR_VALIDATION]", "validations[priority=27]"]
        distinguishing_aspect: "channel='WHOLESALE' is not a declared enum member and fails payload validation with ERR_VALIDATION (http 400)."
        test_recipe:
          setup: ["model + customer exist"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "WHOLESALE", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (http 400)"

      - name: unit_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds: [entities.Unit.fields.purchase_date, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required purchase_date on POST /depot/units yields ERR_VALIDATION; the unit is not created."
        test_recipe:
          setup: ["model + customer exist"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", ship_date: "2026-01-01" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION"

      - name: rma_creation_unit_customer_mismatch_rejected
        claim_type: creation
        grounds: ["validations[priority=10]", "errors[ERR_UNIT_CUSTOMER_MISMATCH]"]
        distinguishing_aspect: "Creating an RMA whose unit belongs to a different customer fails referential validation with ERR_UNIT_CUSTOMER_MISMATCH (422)."
        test_recipe:
          setup: ["two customers; unit owned by customer A"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust_a: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust B", email: "b@x.com" }, captures: { cust_b: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust_a}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
          trigger:
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust_b}", unit_id: "${unit}", reported_issue: "wrong owner" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNIT_CUSTOMER_MISMATCH (http 422)"

      - name: rma_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_RMA_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a well-formed but unknown RMA UUID returns ERR_RMA_NOT_FOUND (404), not a generic 500."
        test_recipe:
          setup: ["one customer exists (non-empty DB)"]
          setup_api_calls:
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" } }
          trigger:
            - { call: "GET /depot/rmas/00000000-0000-0000-0000-000000000000", as: IntakeAgent, payload: {} , captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RMA_NOT_FOUND (http 404)"

      - name: notification_event_created_on_authorize
        claim_type: computed_fields
        grounds: [entities.NotificationEvent.fields.event_type, state_machines.ServiceRMA.DRAFT_to_AUTHORIZED]
        distinguishing_aspect: "authorize emits exactly one RMA_AUTHORIZED NotificationEvent addressed to the customer's email; NotificationEvent is append-only (no update endpoint, no version field)."
        test_recipe:
          setup: ["DRAFT RMA for in-warranty unit"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
          trigger:
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "GET /depot/rmas/${rma}/notifications", as: IntakeAgent, captures: { ev0: "$.data[0].event_type", rcpt0: "$.data[0].recipient" } }
          assert:
            - "exactly 1 NotificationEvent exists for the RMA"
            - "NotificationEvent[0].event_type == RMA_AUTHORIZED"
            - "NotificationEvent[0].recipient == 'a@x.com'"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: rma_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.ServiceRMA]
        distinguishing_aspect: "A newly created RMA starts in DRAFT with a system-assigned rma_number and version 1."
        test_recipe:
          setup: ["model, customer, unit exist"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
          trigger:
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id, st: $.data.status, num: $.data.rma_number, v: $.data.version } }
          assert:
            - "ServiceRMA.status == DRAFT"
            - "ServiceRMA.rma_number matches 'RMA-' prefixed sequence"
            - "ServiceRMA.version == 1"
            - "ServiceRMA.service_option == STANDARD (default)"

      - name: receive_on_draft_rejected_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ServiceRMA, "errors[ERR_INVALID_RMA_STATE]"]
        distinguishing_aspect: "receive is only valid from AUTHORIZED; calling it on a DRAFT RMA fails with ERR_INVALID_RMA_STATE and no received_at is pinned."
        test_recipe:
          setup: ["DRAFT RMA exists"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
          trigger:
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_RMA_STATE"
            - "ServiceRMA.${rma}.status == DRAFT and received_at is null"

      - name: cancel_on_cancelled_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ServiceRMA, "errors[ERR_INVALID_RMA_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel on the same RMA is rejected with ERR_INVALID_RMA_STATE."
        test_recipe:
          setup: ["RMA cancelled once"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/cancel", as: IntakeAgent, payload: {} }
          trigger:
            - { call: "POST /depot/rmas/${rma}/cancel", as: IntakeAgent, payload: {} , captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_RMA_STATE"
            - "ServiceRMA.${rma}.status == CANCELLED"

      - name: quote_double_approve_rejected
        claim_type: idempotency
        grounds: [state_machines.Quote, "errors[ERR_INVALID_QUOTE_STATE]"]
        distinguishing_aspect: "Approving an already-APPROVED quote fails with ERR_INVALID_QUOTE_STATE; the first approval's effects (RMA IN_REPAIR) are not duplicated."
        test_recipe:
          setup: ["OOW RMA with Q1 APPROVED; RMA in IN_REPAIR"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2024-01-01", ship_date: "2024-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 20, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 1 } ] } }
            - { call: "GET /depot/rmas/${rma}/quotes", as: DepotTechnician, captures: { q1: "$.data[0].id" } }
            - { call: "POST /depot/quotes/${q1}/approve", as: Customer, as_user_id: "${cust}", payload: { payment_reference: "pay-1" } }
          trigger:
            - { call: "POST /depot/quotes/${q1}/approve", as: Customer, as_user_id: "${cust}", payload: { payment_reference: "pay-2" }, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_QUOTE_STATE"
            - "Quote.${q1}.payment_reference == 'pay-1' (first approval preserved)"

      - name: qa_fail_rework_loop_increments_counter
        claim_type: valid_transition
        grounds: [state_machines.ServiceRMA.QA_HOLD_to_IN_REPAIR, entities.ServiceRMA.fields.rework_count]
        distinguishing_aspect: "qa-release outcome=FAIL loops QA_HOLD -> IN_REPAIR with rework_count incremented to 1; the RMA can be repaired again (cyclic shape)."
        test_recipe:
          setup: ["In-warranty RMA in QA_HOLD with one CONSUMED repair line"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-PWR-01", description: "No power", severity: "HIGH" }, captures: { fc: $.data.id } }
            - { call: "POST /depot/parts", as: DepotManager, payload: { sku: "P1", name: "Power board", unit_cost_cents: 5000, initial_stock: 10 }, captures: { part: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/receive", as: IntakeAgent, payload: { serial_number: "SN-1" } }
            - { call: "POST /depot/rmas/${rma}/triage", as: IntakeAgent, payload: { primary_failure_code_id: "${fc}" } }
            - { call: "POST /depot/rmas/${rma}/diagnose", as: DepotTechnician, as_user_id: "tech-1", payload: { labor_minutes_est: 10, repairability: "REPAIRABLE", planned_parts: [ { part_id: "${part}", quantity: 1 } ] }, captures: { rma_v: $.data.version } }
            - { call: "POST /depot/rmas/${rma}/parts", as: DepotTechnician, as_user_id: "tech-1", payload: { part_id: "${part}", quantity: 1, failure_code_id: "${fc}", expected_rma_version: "${rma_v}" } }
            - { call: "POST /depot/rmas/${rma}/repair-complete", as: DepotTechnician, as_user_id: "tech-1", payload: {} }
          trigger:
            - { call: "POST /depot/rmas/${rma}/qa-release", as: DepotTechnician, as_user_id: "tech-2", payload: { outcome: "FAIL" } }
          assert:
            - "ServiceRMA.${rma}.status == IN_REPAIR (rework loop)"
            - "ServiceRMA.${rma}.rework_count == 1"

      - name: cancel_authorized_releases_reserved_loaner
        claim_type: side_effect_execution
        grounds: [state_machines.ServiceRMA.AUTHORIZED_to_CANCELLED, state_machines.LoanerReservation.RESERVED_to_CANCELLED]
        distinguishing_aspect: "Cancelling an AUTHORIZED RMA cascades: its RESERVED reservation is cancelled, the loaner unit returns to AVAILABLE, and deposit exposure drops back to 0."
        test_recipe:
          setup: ["AUTHORIZED LOANER RMA with RESERVED reservation on LU-1 (deposit 40000)"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com", credit_limit_cents: 100000 }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/loaner-units", as: DepotManager, payload: { asset_tag: "LU-1", model_id: "${mdl}", condition_grade: "A", deposit_value_cents: 40000 }, captures: { lu: $.data.id } }
            - { call: "POST /depot/rmas", as: IntakeAgent, payload: { customer_id: "${cust}", unit_id: "${unit}", reported_issue: "dead", service_option: "LOANER" }, captures: { rma: $.data.id } }
            - { call: "POST /depot/rmas/${rma}/authorize", as: IntakeAgent, payload: {} }
            - { call: "POST /depot/rmas/${rma}/loaner-reservations", as: IntakeAgent, payload: { loaner_unit_id: "${lu}", start_date: "2026-08-01", end_date: "2026-08-20" }, captures: { res: $.data.id } }
          trigger:
            - { call: "POST /depot/rmas/${rma}/cancel", as: IntakeAgent, payload: {} }
          assert:
            - "ServiceRMA.${rma}.status == CANCELLED"
            - "LoanerReservation.${res}.status == CANCELLED"
            - "LoanerUnit.${lu}.status == AVAILABLE"
            - "Customer.${cust}.deposit_exposure_cents == 0"

      - name: escalate_contain_after_resolve_rejected
        claim_type: invalid_transition
        grounds: [state_machines.EngineeringEscalation, "errors[ERR_INVALID_ESCALATION_STATE]"]
        distinguishing_aspect: "contain is valid only from OPEN/ACKNOWLEDGED; after resolve the escalation is MONITORING and contain fails with ERR_INVALID_ESCALATION_STATE."
        test_recipe:
          setup: ["manual escalation on RMA, resolved (MONITORING)"]
          setup_api_calls:
            - { call: "POST /depot/product-models", as: DepotManager, payload: { model_code: "M1", description: "m", standard_warranty_days: 365, replacement_cost_cents: 100000, flat_rate_repair_cents: 15000, labor_rate_cents_per_minute: 200, replace_threshold_pct: 60, sla_turnaround_business_days: 5 }, captures: { mdl: $.data.id } }
            - { call: "POST /depot/customers", as: IntakeAgent, payload: { name: "Cust A", email: "a@x.com" }, captures: { cust: $.data.id } }
            - { call: "POST /depot/units", as: IntakeAgent, payload: { serial_number: "SN-1", model_id: "${mdl}", customer_id: "${cust}", channel: "RETAIL", purchase_date: "2026-01-01", ship_date: "2026-01-01" }, captures: { unit: $.data.id } }
            - { call: "POST /depot/failure-codes", as: EngineeringLead, payload: { code: "F-BAT-09", description: "Battery", severity: "CRITICAL" }, captures: { fc: $.data.id } }
