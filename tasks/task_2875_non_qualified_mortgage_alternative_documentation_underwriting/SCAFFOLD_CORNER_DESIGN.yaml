        distinguishing_aspect: "Both halves of priority 31 map to the same error id: an exception filed against OV-SAT (which the 700-FICO borrower already satisfies at a 660 threshold) and a second exception filed against the genuinely breached OV-BREACH while the first is still PENDING_REVIEW each return ERR_OVERLAY_NOT_BREACHED with HTTP 422."
