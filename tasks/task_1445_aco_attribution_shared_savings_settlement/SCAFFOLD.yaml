# =============================================================================
# PRD Benchmark Scaffold — ACO Attribution & Shared Savings Settlement
# =============================================================================

scenario: |
  ACO Attribution & Shared Savings Settlement (Medicare Shared Savings ACO): beneficiary attribution methodology & alignment run, benchmark calculation & risk adjustment, quality gate performance & scoring, expenditure tracking against benchmark with truncation, shared savings/loss calculation & distribution to participants, high-cost claimant review, data-sharing/opt-out handling, appeal of attribution & financial reconciliation

domain_name: aco-shared-savings
api_prefix: /aco

complexity_profile:
  primary_archetype: Ledger reconciliation          # provisional vs final settlement books over identical claims
  secondary_archetype: Compliance / audit           # opt-out privacy gate, appeal loop, segregation of duties
  complexity_layers:
    - dual_variant_calculation                      # PROSPECTIVE vs RETROSPECTIVE attribution; PROVISIONAL vs FINAL benchmark
    - cascading_side_effects                        # opt-out / high-cost / appeal cascades into settlement STALE + distribution VOIDED
    - rate_threshold_triggers                       # MSR/MLRR, quality tiers, truncation cap, high-cost flag
    - optimistic_concurrency                        # OCC on AgreementPeriod.version for run/benchmark/settlement creation
  entity_topology: flat                             # peer resources addressed at top level; FK links in bodies; nested action endpoints only
  state_machine_shape: cyclic                       # Appeal rebuttal loop, QualityScore reject/resubmit loop, Settlement reopen loop
  relationship_patterns: [one_to_many, many_to_many, polymorphic, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AgreementPeriod
    parent: null
    common_fields: true
    fields:
      - { name: aco_tax_id, type: string, source: input, description: "ACO taxpayer identifier; period spans for the same aco_tax_id must not overlap (closed-interval semantics)" }
      - { name: aco_name, type: string, source: input, description: "Display name of the ACO" }
      - { name: performance_start_date, type: string, source: input, description: "ISO date, first day of performance year (inclusive)" }
      - { name: performance_end_date, type: string, source: input, description: "ISO date, last day of performance year (INCLUSIVE — closed interval); must be >= performance_start_date" }
      - { name: track, type: enum, source: input, description: "ONE_SIDED | TWO_SIDED", constraints: "enum {ONE_SIDED, TWO_SIDED}" }
      - { name: status, type: enum, source: system, description: "SETUP | OPEN | ASSIGNMENT_LOCKED | SETTLED", default: SETUP }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: agreement_period_id, type: string, source: input, description: "FK -> AgreementPeriod.id; owning period" }
      - { name: tin, type: string, source: input, description: "Participant TIN; unique within agreement_period_id" }
      - { name: legal_name, type: string, source: input, description: "Participant legal name" }
      - { name: share_weight_bp, type: integer, source: input, description: "Distribution weight in basis points; integer > 0; weights across participants need not sum to 10000 (relative weights)" }

  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - { name: medicare_id, type: string, source: input, description: "Beneficiary MBI; globally unique" }
      - { name: birth_year, type: integer, source: input, description: "4-digit birth year; age at period start = performance_start_year - birth_year" }
      - { name: dual_eligible, type: boolean, source: input, description: "Medicare/Medicaid dual eligibility flag", default: false }
      - { name: disabled, type: boolean, source: input, description: "Disability flag", default: false }
      - { name: esrd, type: boolean, source: input, description: "End-stage renal disease flag", default: false }

  - name: DataSharingElection
    parent: null
    common_fields: false   # append-only event log: id + created_at only, no version/updated_at
    fields:
      - { name: beneficiary_id, type: string, source: system, description: "FK -> Beneficiary.id; taken from URL path" }
      - { name: direction, type: enum, source: input, description: "OPT_OUT | OPT_IN", constraints: "enum {OPT_OUT, OPT_IN}" }
      - { name: effective_date, type: string, source: input, description: "ISO date the election takes effect; multiple elections allowed, latest effective_date wins (tie: latest created_at)" }

  - name: AlignmentRun
    parent: null
    common_fields: true
    fields:
      - { name: agreement_period_id, type: string, source: system, description: "FK -> AgreementPeriod.id; taken from URL path" }
      - { name: methodology, type: enum, source: input, description: "PROSPECTIVE | RETROSPECTIVE", constraints: "enum {PROSPECTIVE, RETROSPECTIVE}" }
      - { name: window_start_date, type: string, source: input, description: "ISO date, claim inclusion window start (inclusive); half-open semantics" }
      - { name: window_end_date, type: string, source: input, description: "ISO date, claim inclusion window end (EXCLUSIVE); half-open [start, end)" }
      - { name: records_created_count, type: integer, source: computed, description: "Number of AttributionRecords generated by this run" }
      - { name: status, type: enum, source: system, description: "COMPLETED | SUPERSEDED | LOCKED", default: COMPLETED }

  - name: AttributionRecord
    parent: null
    common_fields: true
    fields:
      - { name: agreement_period_id, type: string, source: system, description: "FK -> AgreementPeriod.id" }
      - { name: beneficiary_id, type: string, source: computed, description: "FK -> Beneficiary.id; beneficiary with >=1 included claim" }
      - { name: alignment_run_id, type: string, source: system, description: "FK -> AlignmentRun.id; run that produced this record" }
      - { name: participant_id, type: string, source: computed, description: "FK -> Participant.id; plurality winner of qualified visit costs" }
      - { name: plurality_cost_cents, type: integer, source: computed, description: "Winning participant's summed allowed_amount_cents inside the window" }
      - { name: methodology, type: enum, source: system, description: "PROSPECTIVE | RETROSPECTIVE copied from the producing AlignmentRun" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL | UNDER_APPEAL | OVERTURNED | EXCLUDED_OPT_OUT | SUPERSEDED", default: PROVISIONAL }

  - name: ClaimLine
    parent: null
    common_fields: true
    fields:
      - { name: agreement_period_id, type: string, source: input, description: "FK -> AgreementPeriod.id" }
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id" }
      - { name: participant_id, type: string, source: input, required: false, description: "FK -> Participant.id; rendering participant (optional for PART_A, drives attribution plurality for PART_B)" }
      - { name: service_date, type: string, source: input, description: "ISO date of service; must lie within [performance_start_date, performance_end_date] (closed)" }
      - { name: allowed_amount_cents, type: integer, source: input, description: "Allowed amount in cents; integer > 0" }
      - { name: claim_type, type: enum, source: input, description: "PART_A | PART_B", constraints: "enum {PART_A, PART_B}" }
      - { name: review_excluded, type: boolean, source: computed, description: "True once a CONFIRMED_EXCLUSION HighCostReview sweeps this claim out of the expenditure input set", default: false }
      - { name: status, type: enum, source: system, description: "RECEIVED | ADJUDICATED | VOIDED", default: RECEIVED }

  - name: Benchmark
    parent: null
    common_fields: true
    fields:
      - { name: agreement_period_id, type: string, source: system, description: "FK -> AgreementPeriod.id; taken from URL path" }
      - { name: variant, type: enum, source: input, description: "PROVISIONAL | FINAL", constraints: "enum {PROVISIONAL, FINAL}" }
      - { name: beneficiary_months, type: integer, source: computed, description: "12 x count of included AttributionRecords (variant-dependent status set)" }
      - { name: risk_score_sum, type: number, source: computed, description: "Sum of per-beneficiary risk scores, 2 decimal places" }
      - { name: update_factor_used, type: number, source: computed, description: "1.030 for PROVISIONAL, 1.021 for FINAL" }
      - { name: total_benchmark_cents, type: integer, source: computed, description: "round_half_up(risk_score_sum x PMPM_BASE_CENTS x 12 x update_factor_used)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED | LOCKED", default: ACTIVE }

  - name: QualityScore
    parent: null
    common_fields: true
    fields:
      - { name: agreement_period_id, type: string, source: input, description: "FK -> AgreementPeriod.id" }
      - { name: measure_code, type: string, source: input, description: "Measure identifier; unique per agreement_period_id across ALL scores (resubmit edits in place)" }
      - { name: numerator, type: integer, source: input, description: "Performance numerator; >= 0 and <= denominator" }
      - { name: denominator, type: integer, source: input, description: "Performance denominator; > 0" }
      - { name: max_points, type: integer, source: input, description: "Maximum points for this measure; > 0" }
      - { name: performance_rate, type: number, source: computed, description: "numerator / denominator, 4 decimal places round_half_up" }
      - { name: earned_points, type: number, source: computed, description: "performance_rate x max_points, 2 decimal places round_half_up" }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of the QualityReporter who created/last resubmitted this score (segregation-of-duties anchor)" }
      - { name: status, type: enum, source: system, description: "REPORTED | VALIDATED | REJECTED", default: REPORTED }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: agreement_period_id, type: string, source: system, description: "FK -> AgreementPeriod.id; taken from URL path" }
      - { name: benchmark_id, type: string, source: computed, description: "FK -> Benchmark.id; the ACTIVE FINAL-variant benchmark this settlement computed against" }
      - { name: expenditure_total_cents, type: integer, source: computed, description: "Truncated expenditure total at computation time (see expenditure_aggregation_with_truncation)" }
      - { name: gross_savings_cents, type: integer, source: computed, description: "benchmark.total_benchmark_cents - expenditure_total_cents (may be negative)" }
      - { name: msr_threshold_cents, type: integer, source: computed, description: "round_half_up(0.02 x benchmark total); savings eligible iff gross >= this" }
      - { name: quality_score_snapshot, type: number, source: computed, description: "Aggregate quality score at computation time, 4 decimals" }
      - { name: quality_multiplier_snapshot, type: number, source: computed, description: "Tiered multiplier at computation time, 4 decimals" }
      - { name: shared_savings_pre_sequestration_cents, type: integer, source: computed, description: "min(round(gross x base_rate x multiplier), savings cap); 0 when MSR not met or gross < 0" }
      - { name: sequestration_levy_cents, type: integer, source: computed, description: "round_half_up(0.02 x shared_savings_pre_sequestration_cents) — levy base is the PRE-sequestration amount" }
      - { name: net_shared_savings_cents, type: integer, source: computed, description: "shared_savings_pre_sequestration_cents - sequestration_levy_cents" }
      - { name: shared_loss_cents, type: integer, source: computed, description: "Negative-or-zero; max(round(gross x 0.40), -loss cap) for TWO_SIDED when |gross| >= MLRR; else 0" }
      - { name: distributable_pool_cents, type: integer, source: computed, description: "net_shared_savings_cents when positive, else 0" }
      - { name: reconciliation_balance_cents, type: integer, source: computed, description: "sum(POSTED CREDIT adjustments) - sum(POSTED DEBIT adjustments)", default: 0 }
      - { name: last_distribution_run_by_user_id, type: string, source: system, description: "X-User-ID of the SettlementActuary who last ran distribution-runs (segregation-of-duties anchor); null until first run" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical-clock timestamp of FINAL transition; appeal window anchor; null until finalized" }
      - { name: status, type: enum, source: system, description: "PROPOSED | STALE | SUPERSEDED | FINAL | SETTLED | REOPENED", default: PROPOSED }

  - name: DistributionLine
    parent: null
    common_fields: true
    fields:
      - { name: settlement_id, type: string, source: system, description: "FK -> Settlement.id; taken from URL path" }
      - { name: participant_id, type: string, source: computed, description: "FK -> Participant.id" }
      - { name: amount_cents, type: integer, source: computed, description: "floor(pool x weight / sum_weights) plus remainder pennies per distribution_waterfall_allocation" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | PAID | VOIDED", default: PENDING }

  - name: HighCostReview
    parent: null
    common_fields: true
    fields:
      - { name: agreement_period_id, type: string, source: system, description: "FK -> AgreementPeriod.id" }
      - { name: beneficiary_id, type: string, source: system, description: "FK -> Beneficiary.id; flagged claimant" }
      - { name: flagged_expenditure_cents, type: integer, source: system, description: "Beneficiary YTD adjudicated total at flag time" }
      - { name: dismissal_reason, type: enum, source: system, description: "MANUAL | THRESHOLD_FALLEN; null while FLAGGED", constraints: "enum {MANUAL, THRESHOLD_FALLEN} or null" }
      - { name: determined_by_user_id, type: string, source: system, description: "X-User-ID of determining MedicalReviewOfficer; null while FLAGGED" }
      - { name: rationale, type: string, source: input, required: false, description: "Optional determination rationale" }
      - { name: status, type: enum, source: system, description: "FLAGGED | CONFIRMED_EXCLUSION | DISMISSED", default: FLAGGED }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: agreement_period_id, type: string, source: input, description: "FK -> AgreementPeriod.id" }
      - { name: subject_type, type: enum, source: input, description: "ATTRIBUTION | SETTLEMENT", constraints: "enum {ATTRIBUTION, SETTLEMENT}" }
      - { name: subject_id, type: string, source: input, description: "Polymorphic reference (NOT a foreign key): subject_type=ATTRIBUTION -> AttributionRecord.id; subject_type=SETTLEMENT -> Settlement.id; must belong to agreement_period_id" }
      - { name: filed_by_participant_id, type: string, source: system, description: "FK -> Participant.id; equals X-User-ID of the ParticipantRepresentative filer" }
      - { name: grounds, type: string, source: input, description: "Free-text grounds for the appeal" }
      - { name: round_count, type: integer, source: system, description: "Number of rebuttal rounds filed; rebuttal rejected when round_count >= 2", default: 0 }
      - { name: decided_outcome, type: enum, source: system, description: "UPHELD | DENIED; null until decided", constraints: "enum {UPHELD, DENIED} or null" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW | REBUTTAL | UPHELD | DENIED", default: UNDER_REVIEW }

  - name: ReconciliationAdjustment
    parent: null
    common_fields: true
    fields:
      - { name: settlement_id, type: string, source: system, description: "FK -> Settlement.id; taken from URL path" }
      - { name: appeal_id, type: string, source: input, required: false, description: "FK -> Appeal.id; optional causal appeal" }
      - { name: direction, type: enum, source: input, description: "CREDIT | DEBIT", constraints: "enum {CREDIT, DEBIT}" }
      - { name: amount_cents, type: integer, source: input, description: "Adjustment magnitude; integer > 0" }
      - { name: reason_code, type: string, source: input, description: "Operator reason code" }
      - { name: status, type: enum, source: system, description: "POSTED | REVERSED", default: POSTED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AgreementPeriod
    initial_state: SETUP
    terminal_states: [SETTLED]
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "POST /aco/agreement-periods/{id}/open"
        actor: AcoAdministrator
        preconditions:
          - "status == SETUP (else ERR_PERIOD_NOT_OPEN)"
        side_effects:
          - "increments AgreementPeriod.version by 1"
      - from: OPEN
        to: ASSIGNMENT_LOCKED
        trigger: "POST /aco/agreement-periods/{id}/lock-assignment"
        actor: AcoAdministrator
        preconditions:
          - "status == OPEN (else ERR_PERIOD_NOT_OPEN)"
        side_effects:
          - "cascade down: every AttributionRecord of this period in PROVISIONAL -> FINAL"
          - "cascade down: every AlignmentRun of this period in COMPLETED -> LOCKED"
          - "increments AgreementPeriod.version by 1"
      - from: ASSIGNMENT_LOCKED
        to: SETTLED
        trigger: "system bubble-up: a Settlement of this period reaches SETTLED"
        actor: system
        preconditions:
          - "a Settlement of this period transitions to SETTLED"
        side_effects:
          - "increments AgreementPeriod.version by 1"

  - entity: AlignmentRun
    initial_state: COMPLETED
    terminal_states: [SUPERSEDED, LOCKED]
    transitions:
      - from: COMPLETED
        to: SUPERSEDED
        trigger: "system: a newer AlignmentRun with the same (agreement_period_id, methodology) is created"
        actor: system
        preconditions: []
        side_effects:
          - "cascade down: the superseded run's AttributionRecords in PROVISIONAL -> SUPERSEDED"
      - from: COMPLETED
        to: LOCKED
        trigger: "system cascade from AgreementPeriod lock-assignment"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AttributionRecord
    initial_state: PROVISIONAL
    terminal_states: [OVERTURNED, EXCLUDED_OPT_OUT, SUPERSEDED]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "system cascade from AgreementPeriod lock-assignment"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROVISIONAL
        to: SUPERSEDED
        trigger: "system cascade from AlignmentRun supersede"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROVISIONAL
        to: EXCLUDED_OPT_OUT
        trigger: "system cascade from POST /aco/beneficiaries/{id}/data-sharing-elections (OPT_OUT)"
        actor: system
        preconditions:
          - "election direction == OPT_OUT and effective_date <= performance_end_date of the record's period"
        side_effects:
          - "linked Settlement of the period in PROPOSED -> STALE (expenditure/attribution basis changed)"
      - from: FINAL
        to: EXCLUDED_OPT_OUT
        trigger: "system cascade from POST /aco/beneficiaries/{id}/data-sharing-elections (OPT_OUT)"
        actor: system
        preconditions:
          - "election direction == OPT_OUT and effective_date <= performance_end_date of the record's period"
        side_effects:
          - "linked Settlement of the period in PROPOSED -> STALE"
      - from: FINAL
        to: UNDER_APPEAL
        trigger: "system cascade from POST /aco/appeals with subject_type=ATTRIBUTION"
        actor: system
        preconditions:
          - "record.status == FINAL (else appeal rejected ERR_APPEAL_SUBJECT_STATE)"
        side_effects: []
      - from: UNDER_APPEAL
        to: FINAL
        trigger: "system cascade from POST /aco/appeals/{id}/decide outcome=DENIED"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_APPEAL
        to: OVERTURNED
        trigger: "system cascade from POST /aco/appeals/{id}/decide outcome=UPHELD"
        actor: system
        preconditions: []
        side_effects:
          - "linked Settlement of the period in PROPOSED -> STALE"

  - entity: ClaimLine
    initial_state: RECEIVED
    terminal_states: [VOIDED]
    transitions:
      - from: RECEIVED
        to: ADJUDICATED
        trigger: "POST /aco/claims/{id}/adjudicate"
        actor: ClaimsProcessor
        preconditions:
          - "claim.status == RECEIVED (else ERR_CLAIM_INVALID_STATE)"
          - "period status == OPEN (else ERR_PERIOD_NOT_OPEN)"
        side_effects:
          - "run high_cost_flag_threshold: if beneficiary YTD ADJUDICATED total for the period (including this claim) >= 10000000 cents AND no FLAGGED HighCostReview exists for (beneficiary, period) -> create HighCostReview FLAGGED"
      - from: ADJUDICATED
        to: VOIDED
        trigger: "POST /aco/claims/{id}/void"
        actor: ClaimsProcessor
        preconditions:
          - "claim.status == ADJUDICATED (else ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "recompute beneficiary YTD: if a FLAGGED HighCostReview exists for (beneficiary, period) and YTD dropped below 10000000 -> review FLAGGED -> DISMISSED with dismissal_reason=THRESHOLD_FALLEN"
          - "linked Settlement of the period in PROPOSED -> STALE"

  - entity: Benchmark
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, LOCKED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a new Benchmark with the same (agreement_period_id, variant) is created"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: LOCKED
        trigger: "system: version-pinning on POST /aco/settlements/{id}/finalize — pins the settlement's referenced benchmark"
        actor: system
        preconditions: []
        side_effects: []

  - entity: QualityScore
    initial_state: REPORTED
    terminal_states: [VALIDATED]
    transitions:
      - from: REPORTED
        to: VALIDATED
        trigger: "POST /aco/quality-scores/{id}/review outcome=VALIDATED"
        actor: QualityAuditor
        preconditions:
          - "score.status == REPORTED (else ERR_SCORE_INVALID_STATE)"
          - "segregation of duties: X-User-ID != reported_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: REPORTED
        to: REJECTED
        trigger: "POST /aco/quality-scores/{id}/review outcome=REJECTED"
        actor: QualityAuditor
        preconditions:
          - "score.status == REPORTED (else ERR_SCORE_INVALID_STATE)"
          - "segregation of duties: X-User-ID != reported_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: REJECTED
        to: REPORTED
        trigger: "POST /aco/quality-scores/{id}/resubmit (corrected numerator/denominator)"
        actor: QualityReporter
        preconditions:
          - "score.status == REJECTED (else ERR_SCORE_INVALID_STATE)"
        side_effects:
          - "recompute performance_rate and earned_points; refresh reported_by_user_id to the resubmitting user"

  - entity: Settlement
    initial_state: PROPOSED
    terminal_states: [SETTLED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: STALE
        trigger: "system cascade: claim voided, opt-out exclusion, high-cost confirmed exclusion, or attribution overturned in this period"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system: a new Settlement is created for the same period"
        actor: system
        preconditions: []
        side_effects: []
      - from: STALE
        to: SUPERSEDED
        trigger: "system: a new Settlement is created for the same period"
        actor: system
        preconditions: []
        side_effects: []
      - from: REOPENED
        to: SUPERSEDED
        trigger: "system: a new Settlement is created for the same period"
        actor: system
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: FINAL
        trigger: "POST /aco/settlements/{id}/finalize"
        actor: SettlementActuary
        preconditions:
          - "settlement.status in {PROPOSED, REOPENED} (else ERR_SETTLEMENT_NOT_PROPOSED)"
          - "no QualityScore of the period in REPORTED or REJECTED (else ERR_QUALITY_SCORES_INCOMPLETE)"
          - "no HighCostReview of the period in FLAGGED (else ERR_PENDING_REVIEWS_EXIST)"
        side_effects:
          - "version-pin: referenced Benchmark (ACTIVE, FINAL variant) -> LOCKED"
          - "set finalized_at to current logical clock"
      - from: REOPENED
        to: FINAL
        trigger: "POST /aco/settlements/{id}/finalize"
        actor: SettlementActuary
        preconditions:
          - "settlement.status in {PROPOSED, REOPENED} (else ERR_SETTLEMENT_NOT_PROPOSED)"
          - "no QualityScore of the period in REPORTED or REJECTED (else ERR_QUALITY_SCORES_INCOMPLETE)"
          - "no HighCostReview of the period in FLAGGED (else ERR_PENDING_REVIEWS_EXIST)"
        side_effects:
          - "version-pin: referenced Benchmark (ACTIVE, FINAL variant) -> LOCKED"
          - "set finalized_at to current logical clock"
      - from: FINAL
        to: SETTLED
        trigger: "system bubble-up: all non-VOIDED DistributionLines of this settlement are PAID"
        actor: system
        preconditions:
          - "count(DistributionLine with status in {PENDING, APPROVED}) == 0 and at least one PAID line exists"
        side_effects:
          - "bubble up: AgreementPeriod ASSIGNMENT_LOCKED -> SETTLED"
      - from: FINAL
        to: REOPENED
        trigger: "POST /aco/settlements/{id}/reopen OR system cascade from appeal UPHELD on subject_type=SETTLEMENT"
        actor: SettlementActuary | system
        preconditions:
          - "settlement.status == FINAL (else ERR_SETTLEMENT_NOT_FINAL for the manual endpoint)"
        side_effects:
          - "recompute all computed money fields against current inputs (expenditure, ACTIVE FINAL benchmark, VALIDATED quality)"
          - "compensation cascade: DistributionLines in PENDING or APPROVED -> VOIDED (PAID lines are untouched; recovered via ReconciliationAdjustment)"

  - entity: DistributionLine
    initial_state: PENDING
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /aco/distribution-lines/{id}/approve"
        actor: DistributionApprover
        preconditions:
          - "line.status == PENDING (else ERR_DISTRIBUTION_INVALID_STATE)"
          - "segregation of duties: X-User-ID != settlement.last_distribution_run_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: APPROVED
        to: PAID
        trigger: "POST /aco/distribution-lines/{id}/pay"
        actor: DistributionApprover
        preconditions:
          - "line.status == APPROVED (else ERR_DISTRIBUTION_INVALID_STATE)"
        side_effects:
          - "bubble up: if this was the last non-PAID non-VOIDED line -> Settlement FINAL -> SETTLED -> AgreementPeriod ASSIGNMENT_LOCKED -> SETTLED"
      - from: PENDING
        to: VOIDED
        trigger: "system cascade from Settlement reopen"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: VOIDED
        trigger: "system cascade from Settlement reopen"
        actor: system
        preconditions: []
        side_effects: []

  - entity: HighCostReview
    initial_state: FLAGGED
    terminal_states: [CONFIRMED_EXCLUSION, DISMISSED]
    transitions:
      - from: FLAGGED
        to: CONFIRMED_EXCLUSION
        trigger: "POST /aco/high-cost-reviews/{id}/determine outcome=CONFIRMED_EXCLUSION"
        actor: MedicalReviewOfficer
        preconditions:
          - "review.status == FLAGGED (else ERR_REVIEW_NOT_FLAGGED)"
        side_effects:
          - "cascade link 2: every ADJUDICATED ClaimLine of this beneficiary in this period gets review_excluded=true"
          - "cascade link 3: linked Settlement of the period in PROPOSED -> STALE"
      - from: FLAGGED
        to: DISMISSED
        trigger: "POST /aco/high-cost-reviews/{id}/determine outcome=DISMISSED (dismissal_reason=MANUAL) OR system auto-dismiss on claim void (dismissal_reason=THRESHOLD_FALLEN)"
        actor: MedicalReviewOfficer | system
        preconditions:
          - "review.status == FLAGGED (else ERR_REVIEW_NOT_FLAGGED for the manual endpoint)"
        side_effects: []

  - entity: Appeal
    initial_state: UNDER_REVIEW
    terminal_states: [UPHELD, DENIED]
    transitions:
      - from: UNDER_REVIEW
        to: REBUTTAL
        trigger: "POST /aco/appeals/{id}/rebuttals"
        actor: ParticipantRepresentative
        preconditions:
          - "appeal.status == UNDER_REVIEW (else ERR_APPEAL_INVALID_STATE)"
          - "appeal.round_count < 2 (else ERR_APPEAL_ROUND_LIMIT)"
          - "X-User-ID == appeal.filed_by_participant_id (else ERR_UNAUTHORIZED)"
        side_effects:
          - "round_count += 1"
      - from: REBUTTAL
        to: UNDER_REVIEW
        trigger: "POST /aco/appeals/{id}/resume-review"
        actor: AppealsOfficer
        preconditions:
          - "appeal.status == REBUTTAL (else ERR_APPEAL_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /aco/appeals/{id}/decide outcome=UPHELD"
        actor: AppealsOfficer
        preconditions:
          - "appeal.status == UNDER_REVIEW (else ERR_APPEAL_INVALID_STATE)"
        side_effects:
          - "subject_type=ATTRIBUTION: subject AttributionRecord UNDER_APPEAL -> OVERTURNED, then linked Settlement PROPOSED -> STALE"
          - "subject_type=SETTLEMENT: subject Settlement FINAL -> REOPENED (recompute) and its PENDING/APPROVED DistributionLines -> VOIDED"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /aco/appeals/{id}/decide outcome=DENIED"
        actor: AppealsOfficer
        preconditions:
          - "appeal.status == UNDER_REVIEW (else ERR_APPEAL_INVALID_STATE)"
        side_effects:
          - "subject_type=ATTRIBUTION: subject AttributionRecord UNDER_APPEAL -> FINAL"
          - "subject_type=SETTLEMENT: no subject mutation"

  - entity: ReconciliationAdjustment
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /aco/reconciliation-adjustments/{id}/reverse"
        actor: SettlementActuary
        preconditions:
          - "adjustment.status == POSTED (else ERR_ADJUSTMENT_NOT_POSTED)"
        side_effects:
          - "recompute Settlement.reconciliation_balance_cents over POSTED adjustments only"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version — true races only)
# =============================================================================
concurrency_rules:
  - rule_id: occ-alignment-run-create
    parent_entity: AgreementPeriod
    write_endpoint: "POST /aco/agreement-periods/{id}/alignment-runs"
    occ_field: "expected_agreement_period_version"
    description: |
      Creating an AlignmentRun against an AgreementPeriod whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just completed an alignment run (which
      legitimately supersedes the prior run's provisional records) or opened /
      locked the period, making the current writer's view of the period stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: occ-benchmark-create
    parent_entity: AgreementPeriod
    write_endpoint: "POST /aco/agreement-periods/{id}/benchmarks"
    occ_field: "expected_agreement_period_version"
    description: |
      Computing a Benchmark against an AgreementPeriod whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created a benchmark of the same
      variant (which legitimately supersedes the prior ACTIVE benchmark) and
      the current writer's view of the period is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: occ-settlement-create
    parent_entity: AgreementPeriod
    write_endpoint: "POST /aco/agreement-periods/{id}/settlements"
    occ_field: "expected_agreement_period_version"
    description: |
      Creating a Settlement against an AgreementPeriod whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created a settlement (which
      legitimately supersedes the prior PROPOSED/STALE settlement) and the
      current writer's view of the period is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: attribution_alignment_run
    trigger: "POST /aco/agreement-periods/{id}/alignment-runs"
    algorithm: aggregation
    formula: |
      included_claims = ClaimLine where agreement_period_id == period.id
        AND claim_type == 'PART_B'
        AND status IN {RECEIVED, ADJUDICATED}
        AND window_start_date <= service_date < window_end_date          # half-open
        AND NOT opted_out_as_of(beneficiary, window_end_date)
      opted_out_as_of(b, d) = the latest DataSharingElection of b with
        effective_date <= d (tie: latest created_at) has direction == OPT_OUT
      for each beneficiary with >=1 included claim:
        group included claims by participant_id (claims with null participant_id are ignored)
        winner = participant with max sum(allowed_amount_cents)
          tie-break 1: max claim count
          tie-break 2: Participant.created_at ASC
        create AttributionRecord(PROVISIONAL, participant_id=winner,
          plurality_cost_cents=winning sum, methodology=run.methodology)
      then: prior AlignmentRuns of same (period, methodology) -> SUPERSEDED,
            their PROVISIONAL records -> SUPERSEDED
    input_set: "PART_B claims in {RECEIVED, ADJUDICATED} with service_date in [window_start, window_end); opted-out beneficiaries excluded as of window_end_date"
    constants:
      PMPM_BASE_CENTS: 100000
    precision: "integer cents; no rounding"
    variants:
      - name: PROSPECTIVE
        when: "methodology == PROSPECTIVE"
        difference: "window must satisfy window_end_date <= performance_start_date (prior-year alignment window); same claims yield a different assignment set than RETROSPECTIVE because disjoint windows select disjoint claims"
      - name: RETROSPECTIVE
        when: "methodology == RETROSPECTIVE"
        difference: "window must satisfy performance_start_date <= window_start_date AND window_end_date <= performance_end_date + 1 day"

  - name: benchmark_risk_adjustment
    trigger: "POST /aco/agreement-periods/{id}/benchmarks"
    algorithm: aggregation
    formula: |
      risk_score(b) = 1.00
        + 0.25 if b.dual_eligible
        + 0.40 if b.esrd
        + 0.15 if b.disabled
        + 0.05 if (performance_start_year - b.birth_year) >= 75
      included_records(b, variant):
        PROVISIONAL: AttributionRecord.status IN {PROVISIONAL, FINAL, UNDER_APPEAL}
        FINAL:       AttributionRecord.status IN {FINAL, UNDER_APPEAL}
      risk_score_sum = sum over included distinct beneficiaries of risk_score(b)   # 2-decimal exact
      beneficiary_months = 12 x count(included beneficiaries)
      update_factor_used = 1.030 (PROVISIONAL) | 1.021 (FINAL)
      total_benchmark_cents = round_half_up(risk_score_sum x 100000 x 12 x update_factor_used)
      # rounding order pinned: NO per-beneficiary rounding; multiply the exact sum once, round once at the end
      on success: prior Benchmark of same (period, variant) ACTIVE -> SUPERSEDED
    input_set: "Attributed beneficiaries of the period filtered by variant-dependent record status set; EXCLUDED_OPT_OUT / OVERTURNED / SUPERSEDED never included"
    constants:
      PMPM_BASE_CENTS: 100000
      MONTHS_PER_YEAR: 12
      UPDATE_FACTOR_PROVISIONAL: 1.030
      UPDATE_FACTOR_FINAL: 1.021
      RISK_DUAL: 0.25
      RISK_ESRD: 0.40
      RISK_DISABLED: 0.15
      RISK_AGED_75_PLUS: 0.05
    precision: "risk scores exact 2-decimal; total rounded once, round_half_up to integer cents"
    variants:
      - name: PROVISIONAL
        when: "variant == PROVISIONAL"
        difference: "includes PROVISIONAL records and uses UPDATE_FACTOR_PROVISIONAL 1.030 — identical attribution data yields a different total than FINAL"
      - name: FINAL
        when: "variant == FINAL"
        difference: "includes only FINAL/UNDER_APPEAL records and uses UPDATE_FACTOR_FINAL 1.021"

  - name: expenditure_aggregation_with_truncation
    trigger: "GET /aco/agreement-periods/{id}/expenditure-summary; also recomputed inside settlement create and reopen"
    algorithm: aggregation
    formula: |
      attributed(b) = exists AttributionRecord of period for b with status IN {FINAL, UNDER_APPEAL}
      included_claims = ClaimLine where agreement_period_id == period.id
        AND status == ADJUDICATED
        AND review_excluded == false
        AND attributed(beneficiary)
        AND NOT opted_out_as_of(beneficiary, service_date)   # latest election with effective_date <= service_date is OPT_OUT
      for each beneficiary: total_b = min(sum(included claims of b), TRUNCATION_CAP_CENTS)
      raw_adjudicated_total_cents = sum of included claims BEFORE truncation
      truncated_total_cents = sum(total_b)
      truncated_away_cents = raw_adjudicated_total_cents - truncated_total_cents
      included_beneficiary_count = count of beneficiaries with >=1 included claim
      excluded_claim_count = count of ADJUDICATED claims excluded by the opt-out / review / attribution filters
      # truncation boundary pinned: truncation applies only when beneficiary sum > TRUNCATION_CAP_CENTS;
      # a sum exactly == TRUNCATION_CAP_CENTS is NOT truncated
    input_set: "ADJUDICATED claims of FINAL/UNDER_APPEAL-attributed beneficiaries, minus opt-out (as of service_date) and CONFIRMED_EXCLUSION review exclusions"
    constants:
      TRUNCATION_CAP_CENTS: 20000000
    precision: "integer cents; no rounding"

  - name: high_cost_flag_threshold
    trigger: "POST /aco/claims/{id}/adjudicate (flag) and POST /aco/claims/{id}/void (auto-dismiss)"
    algorithm: threshold
    formula: |
      ytd(b, period) = sum(allowed_amount_cents) over ClaimLine of (b, period) with status == ADJUDICATED
      on adjudicate: if ytd >= HIGH_COST_THRESHOLD_CENTS AND no FLAGGED HighCostReview exists for (b, period)
        -> create HighCostReview(FLAGGED, flagged_expenditure_cents = ytd)
      on void: if a FLAGGED review exists for (b, period) AND ytd < HIGH_COST_THRESHOLD_CENTS
        -> review -> DISMISSED with dismissal_reason=THRESHOLD_FALLEN
      # boundary pinned: ytd exactly == HIGH_COST_THRESHOLD_CENTS FLAGS (>=), one cent below does not
    input_set: "ADJDICATED claims of the beneficiary within the period"
    constants:
      HIGH_COST_THRESHOLD_CENTS: 10000000
    precision: "integer cents"

  - name: quality_gate_scoring
    trigger: "recomputed inside settlement create and reopen; per-score fields computed on POST/resubmit"
    algorithm: weighted_scoring
    formula: |
      per score: performance_rate = round_half_up(numerator / denominator, 4)
                 earned_points    = round_half_up(performance_rate x max_points, 2)
      aggregate: quality_score = round_half_up( sum(earned_points) / sum(max_points) over VALIDATED scores, 4 )
                 # zero VALIDATED scores -> quality_score = 0.0000
      multiplier:  quality_score >= 0.7000            -> 1.0000
                   0.5000 <= quality_score < 0.7000   -> round_half_up(quality_score / 0.7000, 4)
                   quality_score < 0.5000             -> 0.0000
      base_rate:   track ONE_SIDED -> 0.40 ; track TWO_SIDED -> 0.60
      # combinatorial mode (a): inputs {track, per-measure rate/points, tier thresholds} with
      # nested conditional branches; boundaries pinned: ==0.7000 full, ==0.5000 partial
    input_set: "QualityScores of the period with status VALIDATED only"
    constants:
      QUALITY_FULL_THRESHOLD: 0.7000
      QUALITY_PARTIAL_THRESHOLD: 0.5000
      BASE_RATE_ONE_SIDED: 0.40
      BASE_RATE_TWO_SIDED: 0.60
    precision: "rates 4 decimals round_half_up; earned_points 2 decimals round_half_up"

  - name: shared_savings_settlement
    trigger: "POST /aco/agreement-periods/{id}/settlements (create) and POST /aco/settlements/{id}/reopen (recompute)"
    algorithm: threshold
    formula: |
      B = ACTIVE FINAL-variant Benchmark.total_benchmark_cents       (error ERR_NO_ACTIVE_BENCHMARK if none)
      E = expenditure_aggregation_with_truncation.truncated_total_cents
      gross_savings_cents = B - E
      msr_threshold_cents = round_half_up(0.02 x B)
      if gross_savings_cents >= 0:
        eligible = gross_savings_cents >= msr_threshold_cents        # == MSR passes (>= pinned)
        shared_savings_pre_sequestration_cents =
          eligible ? min( round_half_up(gross x base_rate x quality_multiplier),
                          round_half_up(0.10 x B) ) : 0
        # combinatorial mode (c) circular-looking pin: the sequestration levy is computed on the
        # PRE-sequestration amount, NOT on the post-levy payment; evaluation order is fixed as:
        sequestration_levy_cents = round_half_up(0.02 x shared_savings_pre_sequestration_cents)
        net_shared_savings_cents = shared_savings_pre_sequestration_cents - sequestration_levy_cents
        shared_loss_cents = 0
      else:
        mlrr_threshold_cents = round_half_up(0.02 x B)
        if track == TWO_SIDED AND abs(gross) >= mlrr_threshold_cents:
          shared_loss_cents = max( round_half_up(gross x 0.40), -round_half_up(0.05 x B) )   # loss cap floor
        else: shared_loss_cents = 0
        shared_savings_pre_sequestration_cents = 0; sequestration_levy_cents = 0; net_shared_savings_cents = 0
      distributable_pool_cents = max(net_shared_savings_cents, 0)
    input_set: "ACTIVE FINAL benchmark + truncated expenditure + VALIDATED quality snapshot at computation time"
    constants:
      MSR_RATE: 0.02
      MLRR_RATE: 0.02
      SAVINGS_CAP_RATE: 0.10
      LOSS_CAP_RATE: 0.05
      LOSS_SHARE_RATE_TWO_SIDED: 0.40
      SEQUESTRATION_RATE: 0.02
    precision: "integer cents, round_half_up at each pinned step"

  - name: distribution_waterfall_allocation
    trigger: "POST /aco/settlements/{id}/distribution-runs"
    algorithm: waterfall_allocation
    formula: |
      pool = settlement.distributable_pool_cents            (error ERR_NO_DISTRIBUTABLE_POOL when pool <= 0)
      participants = Participant where agreement_period_id == period.id AND share_weight_bp > 0
      W = sum(share_weight_bp)
      # combinatorial mode (b) rounding order pinned: FLOOR PER LINE FIRST, then remainder pennies;
      # this differs from naive round-half-up per line (which can drift off-pool)
      for each participant i: line_i = floor(pool x weight_i / W)         # integer floor to cents
      remainder = pool - sum(line_i)                                       # always < count(participants)
      allocation order: share_weight_bp DESC, tie-break Participant.created_at ASC
      hand out +1 cent per line in allocation order until remainder exhausted (at most one pass)
      create DistributionLine(PENDING, amount_cents = final line amount) per participant
      invariant: sum(created lines) == pool exactly
    input_set: "Participants of the period with share_weight_bp > 0"
    constants: {}
    precision: "integer cents; floor per line then remainder pennies"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and non-empty", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is in the endpoint's roles list; ParticipantRepresentative ownership: appeals/rebuttals only where X-User-ID == filed_by_participant_id, distribution-line/appeal reads narrowed to own participant", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body schema: required fields present, types valid, enum members valid, unknown fields rejected", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "Path-template ids resolve left-to-right; body FK references (agreement_period_id, beneficiary_id, participant_id, appeal_id) resolve", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "OCC optimistic-concurrency precondition: expected_agreement_period_version must equal the period's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /aco/agreement-periods/{id}/alignment-runs, POST /aco/agreement-periods/{id}/benchmarks, POST /aco/agreement-periods/{id}/settlements" }
  - { priority: 6, category: state, check: "Period posture gates: POST/adjudicate claims and POST alignment-runs require OPEN (ERR_PERIOD_NOT_OPEN); POST benchmarks and POST settlements require ASSIGNMENT_LOCKED (ERR_PERIOD_NOT_LOCKED); POST quality-scores requires OPEN or ASSIGNMENT_LOCKED (ERR_PERIOD_NOT_OPEN); ATTRIBUTION-subject appeals require ASSIGNMENT_LOCKED (ERR_PERIOD_NOT_LOCKED)", error_id: ERR_PERIOD_NOT_OPEN, http_status: 409, applies_to: "POST /aco/claims, POST /aco/claims/{id}/adjudicate, POST /aco/agreement-periods/{id}/alignment-runs, POST /aco/agreement-periods/{id}/benchmarks, POST /aco/agreement-periods/{id}/settlements, POST /aco/quality-scores, POST /aco/appeals" }
  - { priority: 7, category: state, check: "Entity transition preconditions: claim RECEIVED->ADJUDICATED / ADJUDICATED->VOIDED; score REPORTED/REJECTED gates; settlement PROPOSED|REOPENED for finalize, FINAL for reopen/distribution-runs, no {FINAL,SETTLED} settlement exists at create (ERR_SETTLEMENT_ALREADY_FINAL); line PENDING/APPROVED gates; review FLAGGED; appeal UNDER_REVIEW/REBUTTAL gates; adjustment POSTED; appeal subject in appealable state (record FINAL / settlement FINAL -> ERR_APPEAL_SUBJECT_STATE)", error_id: ERR_CLAIM_INVALID_STATE, http_status: 409, applies_to: "state transition endpoints" }
  - { priority: 8, category: business_safety, check: "Segregation of duties: quality review X-User-ID != reported_by_user_id; distribution approve X-User-ID != settlement.last_distribution_run_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /aco/quality-scores/{id}/review, POST /aco/distribution-lines/{id}/approve" }
  - { priority: 9, category: business_safety, check: "Privacy: claim ingestion rejected when the beneficiary's latest DataSharingElection with effective_date <= service_date is OPT_OUT", error_id: ERR_BENEFICIARY_OPTED_OUT, http_status: 422, applies_to: "POST /aco/claims" }
  - { priority: 10, category: business_constraint, check: "Uniqueness/overlap/round-cap: period spans for same aco_tax_id (CLOSED interval — new.start <= existing.end AND existing.start <= new.end conflicts, adjacency conflicts); alignment windows for same (period, methodology) (HALF-OPEN — adjacency allowed); one QualityScore per (period, measure_code); distribution-runs rejected when non-VOIDED lines exist; rebuttal round_count < 2", error_id: ERR_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /aco/agreement-periods, POST /aco/agreement-periods/{id}/alignment-runs, POST /aco/quality-scores, POST /aco/settlements/{id}/distribution-runs, POST /aco/appeals/{id}/rebuttals" }
  - { priority: 11, category: business_temporal, check: "Date placement: claim service_date within [performance_start_date, performance_end_date]; alignment window placement per methodology (PROSPECTIVE end <= performance_start_date; RETROSPECTIVE within performance span); SETTLEMENT-subject appeals filed within 30 days of settlement.finalized_at per logical clock (ERR_APPEAL_WINDOW_EXPIRED)", error_id: ERR_DATE_OUTSIDE_PERIOD, http_status: 422, applies_to: "POST /aco/claims, POST /aco/agreement-periods/{id}/alignment-runs, POST /aco/appeals" }
  - { priority: 12, category: business_referential, check: "Cross-entity referential: appeal subject belongs to agreement_period_id (ERR_APPEAL_SUBJECT_MISMATCH); settlement create requires an ACTIVE FINAL-variant benchmark (ERR_NO_ACTIVE_BENCHMARK) and zero RECEIVED claims in period (ERR_UNADJUDICATED_CLAIMS_EXIST); finalize requires no REPORTED/REJECTED scores (ERR_QUALITY_SCORES_INCOMPLETE) and no FLAGGED reviews (ERR_PENDING_REVIEWS_EXIST)", error_id: ERR_APPEAL_SUBJECT_MISMATCH, http_status: 409, applies_to: "POST /aco/appeals, POST /aco/agreement-periods/{id}/settlements, POST /aco/settlements/{id}/finalize" }
  - { priority: 13, category: business_fiscal, check: "Distribution run requires distributable_pool_cents > 0", error_id: ERR_NO_DISTRIBUTABLE_POOL, http_status: 422, applies_to: "POST /aco/settlements/{id}/distribution-runs" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/aco/agreement-periods", description: "Create an agreement period (status SETUP)", roles: [AcoAdministrator], code: 201, input: [aco_tax_id, aco_name, performance_start_date, performance_end_date, track], output: AgreementPeriod, side_effects: [] }
  - { method: GET, path: "/aco/agreement-periods/{id}", description: "Fetch one agreement period", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: [], output: AgreementPeriod, side_effects: [] }
  - { method: POST, path: "/aco/agreement-periods/{id}/open", description: "SETUP -> OPEN", roles: [AcoAdministrator], code: 200, input: [], output: AgreementPeriod, side_effects: ["increments AgreementPeriod.version by 1"] }
  - { method: POST, path: "/aco/agreement-periods/{id}/lock-assignment", description: "OPEN -> ASSIGNMENT_LOCKED; finalizes provisional attribution records and locks completed runs", roles: [AcoAdministrator], code: 200, input: [], output: AgreementPeriod, side_effects: ["AttributionRecord PROVISIONAL -> FINAL (all in period)", "AlignmentRun COMPLETED -> LOCKED (all in period)", "increments AgreementPeriod.version by 1"] }
  - { method: GET, path: "/aco/agreement-periods/{id}/expenditure-summary", description: "Computed read: expenditure_aggregation_with_truncation over current data", roles: [AcoAdministrator, SettlementActuary], code: 200, input: [], output: "{ raw_adjudicated_total_cents: integer, truncated_total_cents: integer, truncated_away_cents: integer, included_beneficiary_count: integer, excluded_claim_count: integer }", side_effects: [] }

  - { method: POST, path: "/aco/participants", description: "Add a participant TIN to a period", roles: [AcoAdministrator], code: 201, input: [agreement_period_id, tin, legal_name, share_weight_bp], output: Participant, side_effects: [] }
  - { method: GET, path: "/aco/participants/{id}", description: "Fetch one participant", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: [], output: Participant, side_effects: [] }
  - { method: GET, path: "/aco/participants", description: "List participants, optional filter; sorted created_at ASC", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: ["agreement_period_id?"], output: "Participant[]", side_effects: [] }

  - { method: POST, path: "/aco/beneficiaries", description: "Register a beneficiary", roles: [AcoAdministrator], code: 201, input: [medicare_id, birth_year, "dual_eligible?", "disabled?", "esrd?"], output: Beneficiary, side_effects: [] }
  - { method: GET, path: "/aco/beneficiaries/{id}", description: "Fetch one beneficiary", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: [], output: Beneficiary, side_effects: [] }
  - { method: POST, path: "/aco/beneficiaries/{id}/data-sharing-elections", description: "Append an OPT_OUT/OPT_IN election; OPT_OUT cascades attribution exclusion + settlement STALE", roles: [AcoAdministrator], code: 201, input: [direction, effective_date], output: DataSharingElection, side_effects: ["AttributionRecord {PROVISIONAL, FINAL, UNDER_APPEAL} -> EXCLUDED_OPT_OUT when OPT_OUT effective_date <= period.performance_end_date", "Settlement PROPOSED -> STALE for affected periods"] }
  - { method: GET, path: "/aco/beneficiaries/{id}/data-sharing-elections", description: "List elections of a beneficiary, sorted effective_date ASC then created_at ASC", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: [], output: "DataSharingElection[]", side_effects: [] }

  - { method: POST, path: "/aco/agreement-periods/{id}/alignment-runs", description: "Run attribution (OCC on period version); generates PROVISIONAL AttributionRecords; supersedes prior same-methodology run", roles: [AcoAdministrator], code: 201, input: [methodology, window_start_date, window_end_date, expected_agreement_period_version], output: AlignmentRun, side_effects: ["runs attribution_alignment_run", "prior same-methodology AlignmentRun COMPLETED -> SUPERSEDED and its PROVISIONAL records -> SUPERSEDED", "increments AgreementPeriod.version by 1"] }
  - { method: GET, path: "/aco/alignment-runs/{id}", description: "Fetch one alignment run", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: [], output: AlignmentRun, side_effects: [] }
  - { method: GET, path: "/aco/alignment-runs", description: "List alignment runs, optional filters; sorted created_at ASC", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: ["agreement_period_id?", "methodology?", "status?"], output: "AlignmentRun[]", side_effects: [] }

  - { method: GET, path: "/aco/attribution-records/{id}", description: "Fetch one attribution record", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: [], output: AttributionRecord, side_effects: [] }
  - { method: GET, path: "/aco/attribution-records", description: "List attribution records, optional filters; sorted created_at ASC", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: ["agreement_period_id?", "beneficiary_id?", "alignment_run_id?", "participant_id?", "status?"], output: "AttributionRecord[]", side_effects: [] }

  - { method: POST, path: "/aco/claims", description: "Ingest a claim line (status RECEIVED); period must be OPEN; opt-out privacy gate applies", roles: [ClaimsProcessor], code: 201, input: [agreement_period_id, beneficiary_id, "participant_id?", service_date, allowed_amount_cents, claim_type], output: ClaimLine, side_effects: [] }
  - { method: GET, path: "/aco/claims/{id}", description: "Fetch one claim", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: [], output: ClaimLine, side_effects: [] }
  - { method: GET, path: "/aco/claims", description: "List claims, optional filters; sorted created_at ASC", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: ["agreement_period_id?", "beneficiary_id?", "participant_id?", "status?"], output: "ClaimLine[]", side_effects: [] }
  - { method: POST, path: "/aco/claims/{id}/adjudicate", description: "RECEIVED -> ADJUDICATED; fires high_cost_flag_threshold", roles: [ClaimsProcessor], code: 200, input: [], output: ClaimLine, side_effects: ["may create HighCostReview FLAGGED when YTD >= 10000000", "increments ClaimLine.version by 1"] }
  - { method: POST, path: "/aco/claims/{id}/void", description: "ADJUDICATED -> VOIDED; auto-dismisses FLAGGED review when YTD falls below threshold; stales PROPOSED settlement", roles: [ClaimsProcessor], code: 200, input: ["reason?"], output: ClaimLine, side_effects: ["HighCostReview FLAGGED -> DISMISSED (THRESHOLD_FALLEN) when YTD < 10000000", "Settlement PROPOSED -> STALE", "increments ClaimLine.version by 1"] }

  - { method: POST, path: "/aco/agreement-periods/{id}/benchmarks", description: "Compute a benchmark (OCC on period version); supersedes prior ACTIVE benchmark of same variant", roles: [AcoAdministrator], code: 201, input: [variant, expected_agreement_period_version], output: Benchmark, side_effects: ["runs benchmark_risk_adjustment", "prior same-variant Benchmark ACTIVE -> SUPERSEDED", "increments AgreementPeriod.version by 1"] }
  - { method: GET, path: "/aco/benchmarks/{id}", description: "Fetch one benchmark", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: [], output: Benchmark, side_effects: [] }
  - { method: GET, path: "/aco/benchmarks", description: "List benchmarks, optional filters; sorted created_at ASC", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: ["agreement_period_id?", "variant?", "status?"], output: "Benchmark[]", side_effects: [] }

  - { method: POST, path: "/aco/quality-scores", description: "Report a quality measure score (status REPORTED); one per (period, measure_code)", roles: [QualityReporter], code: 201, input: [agreement_period_id, measure_code, numerator, denominator, max_points], output: QualityScore, side_effects: ["computes performance_rate and earned_points", "sets reported_by_user_id from X-User-ID"] }
  - { method: GET, path: "/aco/quality-scores/{id}", description: "Fetch one quality score", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: [], output: QualityScore, side_effects: [] }
  - { method: GET, path: "/aco/quality-scores", description: "List quality scores, optional filters; sorted created_at ASC", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: ["agreement_period_id?", "status?"], output: "QualityScore[]", side_effects: [] }
  - { method: POST, path: "/aco/quality-scores/{id}/review", description: "REPORTED -> VALIDATED | REJECTED; reviewer must differ from reporter", roles: [QualityAuditor], code: 200, input: [outcome, "reviewer_note?"], output: QualityScore, side_effects: ["increments QualityScore.version by 1"] }
  - { method: POST, path: "/aco/quality-scores/{id}/resubmit", description: "REJECTED -> REPORTED with corrected numerator/denominator; recomputes rate/points", roles: [QualityReporter], code: 200, input: [numerator, denominator], output: QualityScore, side_effects: ["recomputes performance_rate and earned_points", "refreshes reported_by_user_id", "increments QualityScore.version by 1"] }

  - { method: POST, path: "/aco/agreement-periods/{id}/settlements", description: "Compute a settlement (OCC on period version); supersedes prior PROPOSED/STALE/REOPENED settlement", roles: [SettlementActuary], code: 201, input: [expected_agreement_period_version], output: Settlement, side_effects: ["runs expenditure_aggregation_with_truncation + quality_gate_scoring + shared_savings_settlement", "prior Settlement in {PROPOSED, STALE, REOPENED} -> SUPERSEDED", "increments AgreementPeriod.version by 1"] }
  - { method: GET, path: "/aco/settlements/{id}", description: "Fetch one settlement", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: [], output: Settlement, side_effects: [] }
  - { method: GET, path: "/aco/settlements", description: "List settlements, optional filters; sorted created_at ASC", roles: [AcoAdministrator, ClaimsProcessor, QualityReporter, QualityAuditor, SettlementActuary, DistributionApprover, MedicalReviewOfficer, AppealsOfficer, ParticipantRepresentative], code: 200, input: ["agreement_period_id?", "benchmark_id?", "status?"], output: "Settlement[]", side_effects: [] }
  - { method: POST, path: "/aco/settlements/{id}/finalize", description: "PROPOSED|REOPENED -> FINAL; pins benchmark LOCKED; pool==0 continues to SETTLED", roles: [SettlementActuary], code: 200, input: [], output: Settlement, side_effects: ["Benchmark ACTIVE(FINAL) -> LOCKED", "sets finalized_at", "increments Settlement.version by 1"] }
  - { method: POST, path: "/aco/settlements/{id}/reopen", description: "FINAL -> REOPENED; recomputes amounts; voids PENDING/APPROVED distribution lines", roles: [SettlementActuary], code: 200, input: ["reason?"], output: Settlement, side_effects: ["recomputes all computed money fields", "DistributionLine {PENDING, APPROVED} -> VOIDED", "increments Settlement.version by 1"] }
  - { method: POST, path: "/aco/settlements/{id}/distribution-runs", description: "Generate PENDING DistributionLines per distribution_waterfall_allocation; requires FINAL and pool > 0; one live run at a time", roles: [SettlementActuary], code: 201, input: [], output: "{ created_count: integer, allocated_total_cents: integer, settlement_id: string }", side_effects: ["runs distribution_waterfall_allocation", "sets settlement.last_distribution_run_by_user_id", "increments Settlement.version by 1"] }

  - { method: GET, path: "/aco/distribution-lines/{id}", description: "Fetch one distribution line (ParticipantRepresentative: own participant's lines only)", roles: [AcoAdministrator, SettlementActuary, DistributionApprover, ParticipantRepresentative], code: 200, input: [], output: DistributionLine, side_effects: [] }
  - { method: GET, path: "/aco/distribution-lines", description: "List distribution lines, optional filters (ParticipantRepresentative narrowed to own); sorted amount_cents DESC then created_at ASC", roles: [AcoAdministrator, SettlementActuary, DistributionApprover, ParticipantRepresentative], code: 200, input: ["settlement_id?", "participant_id?", "status?"], output: "DistributionLine[]", side_effects: [] }
  - { method: POST, path: "/aco/distribution-lines/{id}/approve", description: "PENDING -> APPROVED; approver must differ from distribution runner", roles: [DistributionApprover], code: 200, input: [], output: DistributionLine, side_effects: ["increments DistributionLine.version by 1"] }
  - { method: POST, path: "/aco/distribution-lines/{id}/pay", description: "APPROVED -> PAID; last payment bubbles Settlement -> SETTLED -> period SETTLED", roles: [DistributionApprover], code: 200, input: [], output: DistributionLine, side_effects: ["maybe Settlement FINAL -> SETTLED and AgreementPeriod ASSIGNMENT_LOCKED -> SETTLED", "increments DistributionLine.version by 1"] }

  - { method: GET, path: "/aco/high-cost-reviews/{id}", description: "Fetch one high-cost review", roles: [AcoAdministrator, ClaimsProcessor, MedicalReviewOfficer, SettlementActuary], code: 200, input: [], output: HighCostReview, side_effects: [] }
  - { method: GET, path: "/aco/high-cost-reviews", description: "List high-cost reviews, optional filters; sorted created_at ASC", roles: [AcoAdministrator, ClaimsProcessor, MedicalReviewOfficer, SettlementActuary], code: 200, input: ["agreement_period_id?", "beneficiary_id?", "status?"], output: "HighCostReview[]", side_effects: [] }
  - { method: POST, path: "/aco/high-cost-reviews/{id}/determine", description: "FLAGGED -> CONFIRMED_EXCLUSION (excludes claims, stales settlement) | DISMISSED (MANUAL)", roles: [MedicalReviewOfficer], code: 200, input: [outcome, "rationale?"], output: HighCostReview, side_effects: ["CONFIRMED_EXCLUSION: beneficiary's ADJUDICATED claims in period get review_excluded=true", "CONFIRMED_EXCLUSION: Settlement PROPOSED -> STALE", "sets determined_by_user_id", "increments HighCostReview.version by 1"] }

  - { method: POST, path: "/aco/appeals", description: "File an appeal (status UNDER_REVIEW); SETTLEMENT subjects within 30 days of finalized_at; ATTRIBUTION subjects move FINAL -> UNDER_APPEAL", roles: [ParticipantRepresentative], code: 201, input: [agreement_period_id, subject_type, subject_id, grounds], output: Appeal, side_effects: ["subject AttributionRecord FINAL -> UNDER_APPEAL", "sets filed_by_participant_id = X-User-ID"] }
  - { method: GET, path: "/aco/appeals/{id}", description: "Fetch one appeal", roles: [AcoAdministrator, SettlementActuary, AppealsOfficer, ParticipantRepresentative], code: 200, input: [], output: Appeal, side_effects: [] }
  - { method: GET, path: "/aco/appeals", description: "List appeals, optional filters (ParticipantRepresentative narrowed to own filings); sorted created_at ASC", roles: [AcoAdministrator, SettlementActuary, AppealsOfficer, ParticipantRepresentative], code: 200, input: ["agreement_period_id?", "filed_by_participant_id?", "status?"], output: "Appeal[]", side_effects: [] }
  - { method: POST, path: "/aco/appeals/{id}/rebuttals", description: "UNDER_REVIEW -> REBUTTAL; round_count += 1; cap 2 rounds", roles: [ParticipantRepresentative], code: 200, input: [memo], output: Appeal, side_effects: ["round_count += 1", "increments Appeal.version by 1"] }
  - { method: POST, path: "/aco/appeals/{id}/resume-review", description: "REBUTTAL -> UNDER_REVIEW", roles: [AppealsOfficer], code: 200, input: [], output: Appeal, side_effects: ["increments Appeal.version by 1"] }
  - { method: POST, path: "/aco/appeals/{id}/decide", description: "UNDER_REVIEW -> UPHELD | DENIED; UPHELD cascades into subject (attribution overturn / settlement reopen)", roles: [AppealsOfficer], code: 200, input: [outcome, "rationale?"], output: Appeal, side_effects: ["UPHELD on ATTRIBUTION: record UNDER_APPEAL -> OVERTURNED, Settlement PROPOSED -> STALE", "UPHELD on SETTLEMENT: Settlement FINAL -> REOPENED, DistributionLines {PENDING, APPROVED} -> VOIDED", "DENIED on ATTRIBUTION: record UNDER_APPEAL -> FINAL", "increments Appeal.version by 1"] }

  - { method: POST, path: "/aco/settlements/{id}/reconciliation-adjustments", description: "Post a CREDIT/DEBIT adjustment against a FINAL/SETTLED/REOPENED settlement", roles: [SettlementActuary], code: 201, input: [direction, amount_cents, reason_code, "appeal_id?"], output: ReconciliationAdjustment, side_effects: ["recomputes Settlement.reconciliation_balance_cents"] }
  - { method: GET, path: "/aco/reconciliation-adjustments/{id}", description: "Fetch one adjustment", roles: [AcoAdministrator, SettlementActuary, AppealsOfficer], code: 200, input: [], output: ReconciliationAdjustment, side_effects: [] }
  - { method: GET, path: "/aco/reconciliation-adjustments", description: "List adjustments, optional filters; sorted created_at ASC", roles: [AcoAdministrator, SettlementActuary, AppealsOfficer], code: 200, input: ["settlement_id?", "appeal_id?", "status?"], output: "ReconciliationAdjustment[]", side_effects: [] }
  - { method: POST, path: "/aco/reconciliation-adjustments/{id}/reverse", description: "POSTED -> REVERSED; recomputes settlement reconciliation balance", roles: [SettlementActuary], code: 200, input: [], output: ReconciliationAdjustment, side_effects: ["recomputes Settlement.reconciliation_balance_cents", "increments ReconciliationAdjustment.version by 1"] }

  - { method: POST, path: "/aco/_clock/set_current_utc", description: "Test-driving logical clock. Startup default (before any set call) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time.", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["sets the logical clock"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/empty X-User-Role or X-User-ID header" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not allowed on endpoint, or ParticipantRepresentative acting outside own participant scope" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Reviewer == reporter on quality review, or approver == distribution runner on line approve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, bad type, bad enum member, or unknown field in request body" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_agreement_period_version does not match the period's current version (OCC)" }
  - { id: ERR_PERIOD_NOT_OPEN, http: 409, condition: "Operation requires period status OPEN (claims, adjudication, alignment runs, quality reporting) or period is in SETUP for open-transition" }
  - { id: ERR_PERIOD_NOT_LOCKED, http: 409, condition: "Operation requires period status ASSIGNMENT_LOCKED (benchmarks, settlements, attribution-subject appeals)" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "Period span for same aco_tax_id overlaps existing period under CLOSED-interval semantics (adjacency conflicts)" }
  - { id: ERR_ALIGNMENT_WINDOW_OVERLAP, http: 409, condition: "Alignment window overlaps an existing COMPLETED/LOCKED run of same (period, methodology) under HALF-OPEN semantics (adjacency allowed)" }
  - { id: ERR_BENEFICIARY_OPTED_OUT, http: 422, condition: "Claim ingestion for a beneficiary whose latest election with effective_date <= service_date is OPT_OUT" }
  - { id: ERR_DATE_OUTSIDE_PERIOD, http: 422, condition: "Claim service_date outside period span, or alignment window misplaced for its methodology" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "Claim transition precondition failed (adjudicate requires RECEIVED; void requires ADJUDICATED)" }
  - { id: ERR_UNADJUDICATED_CLAIMS_EXIST, http: 409, condition: "Settlement create while any claim of the period is still RECEIVED" }
  - { id: ERR_NO_ACTIVE_BENCHMARK, http: 409, condition: "Settlement create without an ACTIVE FINAL-variant benchmark" }
  - { id: ERR_DUPLICATE_MEASURE_SCORE, http: 409, condition: "Second QualityScore for the same (agreement_period_id, measure_code)" }
  - { id: ERR_SCORE_INVALID_STATE, http: 409, condition: "Review requires REPORTED; resubmit requires REJECTED" }
  - { id: ERR_QUALITY_SCORES_INCOMPLETE, http: 409, condition: "Settlement finalize while any score of the period is REPORTED or REJECTED" }
  - { id: ERR_PENDING_REVIEWS_EXIST, http: 409, condition: "Settlement finalize while any HighCostReview of the period is FLAGGED" }
  - { id: ERR_SETTLEMENT_NOT_PROPOSED, http: 409, condition: "Finalize requires settlement status PROPOSED or REOPENED" }
  - { id: ERR_SETTLEMENT_NOT_FINAL, http: 409, condition: "Reopen / distribution-runs / adjustment create require settlement status FINAL (adjustments also allow SETTLED, REOPENED)" }
  - { id: ERR_SETTLEMENT_ALREADY_FINAL, http: 409, condition: "Settlement create while a settlement in {FINAL, SETTLED} exists for the period" }
  - { id: ERR_DISTRIBUTION_RUN_EXISTS, http: 409, condition: "Distribution run while non-VOIDED lines already exist for the settlement" }
  - { id: ERR_DISTRIBUTION_INVALID_STATE, http: 409, condition: "Approve requires PENDING; pay requires APPROVED" }
  - { id: ERR_NO_DISTRIBUTABLE_POOL, http: 422, condition: "Distribution run with distributable_pool_cents <= 0" }
  - { id: ERR_REVIEW_NOT_FLAGGED, http: 409, condition: "Determine requires review status FLAGGED" }
  - { id: ERR_APPEAL_INVALID_STATE, http: 409, condition: "Rebuttal/decide require UNDER_REVIEW; resume-review requires REBUTTAL" }
  - { id: ERR_APPEAL_ROUND_LIMIT, http: 422, condition: "Rebuttal when round_count >= 2" }
  - { id: ERR_APPEAL_SUBJECT_STATE, http: 409, condition: "Appeal subject not in appealable state (record must be FINAL; settlement must be FINAL)" }
  - { id: ERR_APPEAL_SUBJECT_MISMATCH, http: 422, condition: "Appeal subject_id does not belong to the given agreement_period_id" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "SETTLEMENT-subject appeal filed more than 30 days after settlement.finalized_at (logical clock)" }
  - { id: ERR_ADJUSTMENT_NOT_POSTED, http: 409, condition: "Reverse requires adjustment status POSTED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AcoAdministrator
    description: "ACO operations administrator: periods, participants, beneficiaries, elections, alignment runs, benchmarks"
    identity: opaque
    exclusive_operations: ["POST /aco/agreement-periods", "POST /aco/agreement-periods/{id}/open", "POST /aco/agreement-periods/{id}/lock-assignment", "POST /aco/participants", "POST /aco/beneficiaries", "POST /aco/beneficiaries/{id}/data-sharing-elections", "POST /aco/agreement-periods/{id}/alignment-runs", "POST /aco/agreement-periods/{id}/benchmarks"]
    shared_operations: ["GET reads across resources", "GET /aco/agreement-periods/{id}/expenditure-summary"]
  - name: ClaimsProcessor
    description: "Claims intake and adjudication operator"
    identity: opaque
    exclusive_operations: ["POST /aco/claims", "POST /aco/claims/{id}/adjudicate", "POST /aco/claims/{id}/void"]
    shared_operations: ["GET reads across resources"]
  - name: QualityReporter
    description: "Reports quality measure scores; cannot review own reports (segregation of duties)"
    identity: opaque
    exclusive_operations: ["POST /aco/quality-scores", "POST /aco/quality-scores/{id}/resubmit"]
    shared_operations: ["GET reads across resources"]
  - name: QualityAuditor
    description: "Validates or rejects reported quality scores; must not be the reporting user"
    identity: opaque
    exclusive_operations: ["POST /aco/quality-scores/{id}/review"]
    shared_operations: ["GET reads across resources"]
  - name: SettlementActuary
    description: "Computes, finalizes, reopens settlements; runs distributions; posts/reverses reconciliation adjustments"
    identity: opaque
    exclusive_operations: ["POST /aco/agreement-periods/{id}/settlements", "POST /aco/settlements/{id}/finalize", "POST /aco/settlements/{id}/reopen", "POST /aco/settlements/{id}/distribution-runs", "POST /aco/settlements/{id}/reconciliation-adjustments", "POST /aco/reconciliation-adjustments/{id}/reverse"]
    shared_operations: ["GET reads across resources", "GET /aco/agreement-periods/{id}/expenditure-summary"]
  - name: DistributionApprover
    description: "Approves and pays distribution lines; must not be the user who ran the distribution (segregation of duties)"
    identity: opaque
    exclusive_operations: ["POST /aco/distribution-lines/{id}/approve", "POST /aco/distribution-lines/{id}/pay"]
    shared_operations: ["GET reads across resources"]
  - name: MedicalReviewOfficer
    description: "Determines flagged high-cost claimant reviews"
    identity: opaque
    exclusive_operations: ["POST /aco/high-cost-reviews/{id}/determine"]
    shared_operations: ["GET reads across resources"]
  - name: AppealsOfficer
    description: "Returns rebuttals to review and decides appeals"
    identity: opaque
    exclusive_operations: ["POST /aco/appeals/{id}/resume-review", "POST /aco/appeals/{id}/decide"]
    shared_operations: ["GET reads across resources"]
  - name: ParticipantRepresentative
    description: "Files appeals and rebuttals on behalf of their participant organization; sees only own distribution lines and filings"
    identity: "entity_backed:Participant"
    exclusive_operations: ["POST /aco/appeals", "POST /aco/appeals/{id}/rebuttals"]
    shared_operations: ["GET reads across resources (narrowed to own participant scope)"]
  - name: PlatformAdmin
    description: "Platform operator; drives the logical test clock only"
    identity: opaque
    exclusive_operations: ["POST /aco/_clock/set_current_utc"]
    shared_operations: []
