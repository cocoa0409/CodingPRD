          - state_machines.Entry.REGISTERED_to_DNS
          - state_machines.Entry.CHECKED_IN_to_STARTED
        distinguishing_aspect: |
          The dependency runs sideways rather than up the hierarchy, and it bites twice on two
          different endpoints. A MEDICALLY_HELD participant passes the priority-13 waiver rule
          (the waiver IS signed) so registration succeeds, then fails the priority-14 clearance
          rule at check-in. Because there is no clearing transition, the Wave start transition
          later sorts the same roster by each entry's own progress_status: the cleared runner
