  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: material_lot_gallon_ledger_invariant
        grounds:
          - entities.MaterialLot.fields.on_hand_gallons
          - state_machines.WorkOrder.PENDING_to_SCHEDULED
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
          - state_machines.WorkOrder.IN_PROGRESS_to_CURING
        distinguishing_aspect: |
          Conserved quantity GALLONS: delivered == reserved + consumed +
          wasted + on_hand must hold after reserve (schedule), after release
          (cancel), and after consume (finish-application) — forward and
          compensating actions leave zero drift in the lot ledger.
        test_recipe:
          setup:
            - "Lot delivered 100 gal; WO1 (1200 sqft, 17 gal reservation) scheduled; WO2 (2000 sqft, 28 gal) scheduled then cancelled; WO1 started and finished with gallons_used 15"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OfficeAdmin }
            - { call: "POST /api/customers", payload: { name: "Acme Parking LLC", customer_type: "COMMERCIAL", email: "ops@acme.example", phone: "555-0100" }, as: OfficeAdmin, captures: { cust_id: "$.data.id" } }
