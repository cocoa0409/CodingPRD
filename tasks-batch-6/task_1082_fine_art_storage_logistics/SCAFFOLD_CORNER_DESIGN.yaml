              as_user_id: "${self_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_OWNERSHIP_REQUIRED"

  # ---- Cross-Cutting Complexity Layers -------------------------------------
  - section: cross_cutting
    instances:
      - name: appraisal_stale_artwork_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[appraisal-supersede-stale-artwork]"]
        distinguishing_aspect: "After one appraisal advances Artwork.version, a second appraisal carrying the original (now stale) expected_artwork_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["artwork; first appraisal created (bumps artwork.version)"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C20", client_type: "INSTITUTION", billing_email: "c20@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "OCC", artist: "O", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id, art_v1: $.data.version }
            - call: "POST /appraisals"
              payload: { artwork_id: "${art_id}", method: "FAIR_MARKET", comparable_base_cents: 1000000, appraiser_name: "A", expected_artwork_version: "${art_v1}" }
              as: Registrar
              captures: { appr1_id: $.data.id }
          trigger:
            - call: "POST /appraisals"
              payload: { artwork_id: "${art_id}", method: "FAIR_MARKET", comparable_base_cents: 900000, appraiser_name: "A", expected_artwork_version: "${art_v1}" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "response.http_status == 412"

      - name: policy_stale_artwork_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[policy-supersede-stale-artwork]"]
        distinguishing_aspect: "After one policy advances Artwork.version, a second policy carrying the original (now stale) expected_artwork_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["artwork; first policy created (bumps artwork.version)"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C21", client_type: "INSTITUTION", billing_email: "c21@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "OCC2", artist: "O", size_class: "SMALL", fragility_class: "LOW", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id, art_v1: $.data.version }
            - call: "POST /policies"
              payload: { artwork_id: "${art_id}", coverage_type: "STORAGE_ONLY", insured_value_cents: 1000000, effective_start: "2026-05-01T00:00:00Z", effective_end: "2027-05-01T00:00:00Z", expected_artwork_version: "${art_v1}" }
              as: Registrar
              captures: { policy1_id: $.data.id }
          trigger:
            - call: "POST /policies"
              payload: { artwork_id: "${art_id}", coverage_type: "ALL_RISK", insured_value_cents: 1200000, effective_start: "2026-05-01T00:00:00Z", effective_end: "2027-05-01T00:00:00Z", expected_artwork_version: "${art_v1}" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "response.http_status == 412"

      - name: transport_completed_cascade_returns_artwork_to_storage
        claim_type: cascading_side_effects
        grounds:
          - state_machines.TransportJob.IN_PROGRESS_to_COMPLETED
          - state_machines.Artwork.IN_TRANSIT_to_IN_STORAGE
          - state_machines.Crate.IN_USE_to_READY
        distinguishing_aspect: "Completing a transport moves the artwork IN_TRANSIT->IN_STORAGE and the crate IN_USE->READY, and finalizes transport_charge from actual_hours (round(2*9000)+0 = 18000)."
        test_recipe:
          setup: ["artwork IN_STORAGE, READY crate, crew, transport SCHEDULED then IN_PROGRESS"]
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "C22", client_type: "DEALER", billing_email: "c22@x.example" }
              as: Registrar
              captures: { client_id: $.data.id }
            - call: "POST /vaults"
              payload: { name: "V22", climate_class: "AMBIENT", capacity_slots: 3 }
              as: Registrar
              captures: { vault_id: $.data.id }
            - call: "POST /artworks"
              payload: { client_id: "${client_id}", title: "Casc", artist: "C", size_class: "MEDIUM", fragility_class: "MEDIUM", climate_class: "AMBIENT" }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /storage-placements"
              payload: { artwork_id: "${art_id}", vault_id: "${vault_id}", start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { placement_id: $.data.id }
            - call: "POST /crates"
              payload: { artwork_id: "${art_id}", crate_type: "HARD", internal_length_cm: 100, internal_width_cm: 70, internal_height_cm: 12 }
              as: Coordinator
              captures: { crate_id: $.data.id }
            - call: "POST /crates/${crate_id}/state"
              payload: { to_status: "READY" }
              as: Coordinator
            - call: "POST /crews"
              payload: { name: "Crew F", crew_size: 2, certification_level: "FINE_ART" }
              as: Coordinator
              captures: { crew_id: $.data.id }
            - call: "POST /transport-jobs"
              payload: { artwork_id: "${art_id}", crate_id: "${crate_id}", crew_id: "${crew_id}", origin_location: "A", destination_location: "B", scheduled_start: "2026-06-01T09:00:00Z", scheduled_end: "2026-06-01T11:00:00Z", requires_rigging: false, estimated_hours: 2 }
              as: Coordinator
              captures: { job_id: $.data.id }
            - call: "POST /transport-jobs/${job_id}/state"
              payload: { to_status: "IN_PROGRESS" }
              as: Coordinator
          trigger:
            - call: "POST /transport-jobs/${job_id}/state"
              payload: { to_status: "COMPLETED", actual_hours: 2 }
