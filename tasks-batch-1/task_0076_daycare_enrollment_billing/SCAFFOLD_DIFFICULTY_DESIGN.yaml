          - state_machines.Enrollment.ACCEPTED_to_ACTIVE
          - calculations.monthly_net_tuition
        distinguishing_aspect: "Conserved quantity = count of ACTIVE sibling enrollments at sibling_discount_pct==0 (the anchor) per Family, which must stay exactly 1 while >=1 sibling is ACTIVE. Withdrawing the elder anchor re-anchors the younger to 0% (net rises 62999->69999), preserving the single-anchor invariant — a different conserved quantity than account_balance."
        test_recipe:
          setup:
            - "TIER_B family, base 99999, capacity 2; elder (anchor 0%, net 69999) and younger (10%, net 62999) both ACTIVE"
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "TIER_B", max_fpl_ratio_pct: 185, parent_share_pct: 70 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "FULL_PAY", max_fpl_ratio_pct: 999999, parent_share_pct: 100 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 2, base_monthly_tuition_cents: 99999 }
              as: CenterDirector
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 5000000, household_size: 4 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "Elder", birthdate: "2024-01-10" }
              as: CenterDirector
              captures: { elder_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "Younger", birthdate: "2024-02-10", sibling_group_id: "${elder_id}" }
              as: CenterDirector
              captures: { younger_id: $.data.id }
            - call: "POST /enrollments"
              payload: { child_id: "${elder_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v0}" }
              as: CenterDirector
              captures: { enr_elder_id: $.data.id }
            - call: "POST /enrollments/${enr_elder_id}/accept"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
            - call: "POST /enrollments/${enr_elder_id}/activate"
              payload: {}
              as: CenterDirector
            - call: "GET /classrooms/${room_id}"
              payload: {}
              as: CenterDirector
              captures: { room_v1: $.data.version }
            - call: "POST /enrollments"
              payload: { child_id: "${younger_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v1}" }
              as: CenterDirector
              captures: { enr_younger_id: $.data.id }
            - call: "POST /enrollments/${enr_younger_id}/accept"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
            - call: "POST /enrollments/${enr_younger_id}/activate"
              payload: {}
              as: CenterDirector
          trigger:
            - call: "POST /enrollments/${enr_elder_id}/withdraw"
              payload: {}
              as: CenterDirector
              captures: { st: $.data.status }
          assert:
            - "Enrollment.${enr_elder_id}.status == WITHDRAWN"
            - "Enrollment.${enr_younger_id}.sibling_discount_pct == 0"
            - "Enrollment.${enr_younger_id}.monthly_net_tuition_cents == 69999"
