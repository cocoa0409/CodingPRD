            - call: "POST /orders/${order_id}/reserve"
              payload: {}
              as: StoreAssociate
              captures: { sub: "$.data.subtotal_cents", td: "$.data.tier_discount_cents", ds: "$.data.discounted_subtotal_cents"}
            - call: "POST /orders/${order_id}/payments"
              payload: { action: "AUTHORIZE" }
