        grounds: ["roles[SanctionsScreener]", "endpoints[POST /wire-ops/_screening/simulate]", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "The screening simulation hook is restricted to the SanctionsScreener role so tests cannot have operators self-serve screening outcomes."
        test_recipe:
          setup:
            - "Customer CR9 (MEDIUM), Account AR9, Beneficiary BR9, Wire WR9 (100000) created (INITIATED)"
