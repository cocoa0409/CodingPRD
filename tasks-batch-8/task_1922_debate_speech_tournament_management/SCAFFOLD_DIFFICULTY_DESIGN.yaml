      - name: break_win_threshold_boundary
        grounds:
          - calculations.break_determination
          - calculations.prelim_standings_ranking
          - calculations.opponent_strength
          - entities.EventDivision.fields.bracket_size
        distinguishing_aspect: |
          Metric: prelim win count against win_threshold = floor(2/2)+1 = 2 (exact >=
          boundary): entries with 2 wins break, an entry with exactly threshold-1 = 1 win
          does not, even though it ranks third of six. Endpoint: POST /divisions/{id}/determine-breaks.
        test_recipe:
          setup:
            - "Tournament (prelim_round_count 2) with DEBATE/CX/VARSITY division; schools A,B,C with 2 confirmed entries each; school E with 3 committed judges; locked; round 1 pairings (A1,B1),(A2,C1),(B2,C2) tabulated with A1 28/26, A2 28/24, B2 27/25; round 2 pairings (A1,B2),(A2,C2),(B1,C1) tabulated with A1 30/23, A2 29/23, C1 26/22 over B1. Final wins: A1 2, A2 2, B2 1, C1 1, C2 1, B1 0."
