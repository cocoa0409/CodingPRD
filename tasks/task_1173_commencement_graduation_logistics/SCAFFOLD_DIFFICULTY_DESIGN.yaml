# =============================================================================
# Task 1173 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 difficulty rules x 2 instances = 18 instances.
# All arithmetic in assert: lines was pre-computed from the §1.3 formulas.
# Standard ceremony fixture deadlines: regalia 2026-05-10, ticket 2026-05-15,
# pronunciation 2026-05-20, ceremony_date 2026-06-01T15:00:00Z.
# Logical clock default: 2026-05-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: honor_provisional_combined_vs_final_institutional
        grounds:
          - calculations.honor_gpa_designation
          - entities.Graduate.fields.honor_tier
          - state_machines.Ceremony.AUDIT_OPEN_to_AUDIT_LOCKED
        distinguishing_aspect: |
          Graduate-domain dual variant: the COMBINED variant (includes transfer
          credits) yields MAGNA_CUM_LAUDE while the INSTITUTIONAL variant (final,
          at lock-audit) yields CUM_LAUDE for the SAME graduate data — different
          entity domain (Graduate) than the ticket-pool instance below.
        test_recipe:
          setup:
            - "Ceremony in AUDIT_OPEN; one graduate with institutional 45cr/162.0qp (3.600) and transfer 30cr/118.2qp"
            - "combined GPA = 280.2/75 = 3.736 -> MAGNA_CUM_LAUDE; institutional GPA = 3.600 -> CUM_LAUDE"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/ceremonies/${c}/open-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Dana Dual", email: "dana@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 162.0, transfer_gpa_credits: 30, transfer_quality_points: 118.2, credits_completed: 120, credits_required: 120, outstanding_hold_count: 0 }
              as: RegistrarOfficer
              captures: { g: $.data.id }
          trigger:
            - call: "POST /api/graduates/${g}/audits"
              payload: {}
              as: RegistrarOfficer
              captures: { a_result: $.data.result, a_prov: $.data.provisional_honor_tier }
            - call: "POST /api/ceremonies/${c}/lock-audit"
              payload: {}
              as: CommitteeChair
          assert:
            - "audit response: result == PASS and provisional_honor_tier == MAGNA_CUM_LAUDE (COMBINED variant: 280.2/75 = 3.736 >= 3.700)"
            - "immediately after the audit: Graduate.${g}.honor_tier == MAGNA_CUM_LAUDE and honor_basis == COMBINED"
            - "after lock-audit: Graduate.${g}.honor_tier == CUM_LAUDE and honor_basis == INSTITUTIONAL (162.0/45 = 3.600, >= 3.500 but < 3.700) — identical stored data, different tier per variant"

      - name: ticket_provisional_vs_final_waterfall_under_rain
        grounds:
          - calculations.ticket_pool_waterfall
          - entities.TicketAllocation.fields.provisional_granted_count
          - state_machines.Ceremony.FAIR_to_RAIN_PLAN_ACTIVE
        distinguishing_aspect: |
          TicketAllocation-domain dual variant: the PROVISIONAL variant (FAIR
          pool 20 at request time) grants GY 4 tickets, while the FINAL variant
          after rain-plan activation (pool shrinks to floor(6 * 2.0) = 12)
          grants GY 0 and waitlists it — different entity domain than the
          Graduate-honor instance above.
        test_recipe:
          setup:
            - "Venue MAIN cap 10, rain venue cap 6; ceremony ratio 2.0, base cap 4, honor bonus 2 (FAIR pool 20, rain pool 12)"
            - "Three eligible graduates with requests posted during AUDIT_OPEN: GX SUMMA req 6, GZ MAGNA req 6, GY NONE req 4"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: false }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Rain Hall", address: "2 College Ave", total_capacity: 6, accessible_capacity: 1, indoor: true }
              as: VenueCoordinator
              captures: { vr: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", rain_venue_id: "${vr}", ticket_ratio: 2.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/ceremonies/${c}/open-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Gail Summa", email: "gx@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 175.5, transfer_gpa_credits: 0, transfer_quality_points: 0, credits_completed: 120, credits_required: 120, outstanding_hold_count: 0 }
              as: RegistrarOfficer
              captures: { gx: $.data.id }
            - call: "POST /api/graduates/${gx}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "GET /api/graduates/${gx}/ticket-allocations"
              payload: {}
              as: RegistrarOfficer
              captures: { ax: "$.data[0].id", axv: "$.data[0].version" }
            - call: "POST /api/ticket-allocations/${ax}/request"
              payload: { requested_count: 6, expected_ticket_allocation_version: "${axv}" }
              as: Graduate
              as_user_id: "${gx}"
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Zoe Magna", email: "gz@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 170.0, transfer_gpa_credits: 0, transfer_quality_points: 0, credits_completed: 120, credits_required: 120, outstanding_hold_count: 0 }
              as: RegistrarOfficer
              captures: { gz: $.data.id }
            - call: "POST /api/graduates/${gz}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "GET /api/graduates/${gz}/ticket-allocations"
              payload: {}
              as: RegistrarOfficer
              captures: { az: "$.data[0].id", azv: "$.data[0].version" }
            - call: "POST /api/ticket-allocations/${az}/request"
              payload: { requested_count: 6, expected_ticket_allocation_version: "${azv}" }
              as: Graduate
              as_user_id: "${gz}"
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Yan None", email: "gy@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 153.0, transfer_gpa_credits: 0, transfer_quality_points: 0, credits_completed: 120, credits_required: 120, outstanding_hold_count: 0 }
              as: RegistrarOfficer
              captures: { gy: $.data.id }
            - call: "POST /api/graduates/${gy}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "GET /api/graduates/${gy}/ticket-allocations"
              payload: {}
              as: RegistrarOfficer
              captures: { ay: "$.data[0].id", ayv: "$.data[0].version", ay_prov: "$.data[0].provisional_granted_count" }
            - call: "POST /api/ticket-allocations/${ay}/request"
              payload: { requested_count: 4, expected_ticket_allocation_version: "${ayv}" }
              as: Graduate
              as_user_id: "${gy}"
              captures: { ay_prov_after: $.data.provisional_granted_count }
          trigger:
            - call: "POST /api/ceremonies/${c}/lock-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/ceremonies/${c}/activate-rain-plan"
              payload: {}
              as: VenueCoordinator
            - call: "POST /api/ceremonies/${c}/run-ticket-waterfall"
              payload: {}
              as: CommitteeChair
              captures: { pool_rem: $.data.pool_remaining }
          assert:
            - "GY allocation provisional_granted_count == 4 (PROVISIONAL estimate under FAIR pool 20, stored at request time)"
            - "after rain activation + FINAL waterfall: GY granted_count == 0, status == WAITLISTED, waitlist_position == 1"
            - "GX granted_count == 6 (SUMMA rank first) and GZ granted_count == 6; rain pool == floor(6 * 2.0) == 12 exhausts exactly"
            - "run-ticket-waterfall response pool_remaining == 0"
            - "same request data (4 tickets) yields 4 provisionally and 0 finally — variant divergence on TicketAllocation"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: waterfall_multi_input_entitlement_ordering
        grounds:
          - calculations.ticket_pool_waterfall
          - entities.TicketAllocation.fields.entitlement_count
        distinguishing_aspect: |
          Mode (a) combinatorial: >= 3 inputs (honor_tier, requested_count,
          base cap, honor bonus, pool state) with nested min() and a
          state-conditional bonus branch; waterfall order pins honor_rank DESC,
          requested_count DESC, created_at ASC. Distinct mode from the
          per-line-rounding regalia instance below.
        test_recipe:
          setup:
            - "Venue cap 10; ceremony ratio 2.0 (pool 20), base cap 4, honor bonus 2"
            - "GA SUMMA req 6, GC MAGNA req 6, GB NONE req 4 — all requested during AUDIT_OPEN"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 2.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/ceremonies/${c}/open-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Ann Summa", email: "ga@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 175.5, transfer_gpa_credits: 0, transfer_quality_points: 0, credits_completed: 120, credits_required: 120, outstanding_hold_count: 0 }
              as: RegistrarOfficer
              captures: { ga: $.data.id }
            - call: "POST /api/graduates/${ga}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "GET /api/graduates/${ga}/ticket-allocations"
              payload: {}
              as: RegistrarOfficer
              captures: { aa: "$.data[0].id", aav: "$.data[0].version" }
            - call: "POST /api/ticket-allocations/${aa}/request"
              payload: { requested_count: 6, expected_ticket_allocation_version: "${aav}" }
              as: Graduate
              as_user_id: "${ga}"
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Cid Magna", email: "gc@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 170.0, transfer_gpa_credits: 0, transfer_quality_points: 0, credits_completed: 120, credits_required: 120, outstanding_hold_count: 0 }
              as: RegistrarOfficer
              captures: { gc: $.data.id }
            - call: "POST /api/graduates/${gc}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "GET /api/graduates/${gc}/ticket-allocations"
              payload: {}
              as: RegistrarOfficer
              captures: { ac: "$.data[0].id", acv: "$.data[0].version" }
            - call: "POST /api/ticket-allocations/${ac}/request"
              payload: { requested_count: 6, expected_ticket_allocation_version: "${acv}" }
              as: Graduate
              as_user_id: "${gc}"
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Bob None", email: "gb@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 153.0, transfer_gpa_credits: 0, transfer_quality_points: 0, credits_completed: 120, credits_required: 120, outstanding_hold_count: 0 }
              as: RegistrarOfficer
              captures: { gb: $.data.id }
            - call: "POST /api/graduates/${gb}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "GET /api/graduates/${gb}/ticket-allocations"
              payload: {}
              as: RegistrarOfficer
              captures: { ab: "$.data[0].id", abv: "$.data[0].version" }
            - call: "POST /api/ticket-allocations/${ab}/request"
              payload: { requested_count: 4, expected_ticket_allocation_version: "${abv}" }
              as: Graduate
              as_user_id: "${gb}"
            - call: "POST /api/ceremonies/${c}/lock-audit"
              payload: {}
              as: CommitteeChair
          trigger:
            - call: "POST /api/ceremonies/${c}/run-ticket-waterfall"
              payload: {}
              as: CommitteeChair
              captures: { wf_pool: $.data.pool_remaining, wf_granted: $.data.granted_total, wf_processed: $.data.processed_count, wf_waitlisted: $.data.waitlisted_count }
          assert:
            - "waterfall order is GA (SUMMA) -> GC (MAGNA) -> GB (NONE): GA granted_count == 6, GC granted_count == 6, GB granted_count == 4"
            - "entitlement_count snapshots: GA == 6 (4+2 honor bonus), GC == 6, GB == 4 (no bonus)"
            - "response: granted_total == 16, processed_count == 3, waitlisted_count == 0, pool_remaining == 4"
            - "Ceremony.${c}.ticket_pool_total == 20 (floor(10 * 2.0)) and ticket_pool_remaining == 4"

      - name: regalia_per_line_discount_rounding_order
        grounds:
          - calculations.regalia_pricing
          - entities.RegaliaOrder.fields.discount_cents
        distinguishing_aspect: |
          Mode (b) combinatorial: nested rounding where order matters — the
          scaffold pins per-line round_half_up THEN sum; sum-then-round yields
          discount 4522 / total 25625 and is WRONG. Distinct mode from the
          multi-input waterfall instance above.
        test_recipe:
          setup:
            - "One graduate; clock at default 2026-05-01T00:00:00Z (before regalia_order_deadline 2026-05-10, so no late fee)"
            - "Order lines chosen so per-line rounding diverges from aggregate rounding: 10029/10049/10069 cents at 15% (line fractions .35 each)"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Reg Ivy", email: "reg@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 160.0, transfer_gpa_credits: 0, transfer_quality_points: 0, credits_completed: 120, credits_required: 120, outstanding_hold_count: 0 }
              as: RegistrarOfficer
              captures: { g: $.data.id }
          trigger:
            - call: "POST /api/graduates/${g}/regalia-orders"
              payload: { items: [ { item_type: "GOWN", size: "M", quantity: 1, unit_price_cents: 10029 }, { item_type: "HOOD", size: "NA", quantity: 1, unit_price_cents: 10049 }, { item_type: "CAP", size: "M", quantity: 1, unit_price_cents: 10069 } ] }
              as: Graduate
              as_user_id: "${g}"
              captures: { o_sub: $.data.subtotal_cents, o_dis: $.data.discount_cents, o_late: $.data.late_fee_cents, o_tot: $.data.total_cents }
          assert:
            - "subtotal_cents == 30147 (>= 20000 -> 15% tier keyed on PRE-discount subtotal)"
            - "discount_cents == 4521 (per-line round_half_up: 1504 + 1507 + 1510)"
            - "late_fee_cents == 0 and total_cents == 25626"
            - "sum-then-round would give discount 4522 and total 25625 — the pinned per-line-then-sum order is the only correct result"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: diploma_correction_reprint_cycle
        grounds:
          - state_machines.Diploma.ISSUED_to_CORRECTION_REQUESTED
          - state_machines.Diploma.CORRECTION_REQUESTED_to_REPRINT_QUEUED
          - state_machines.Diploma.REPRINT_QUEUED_to_PRINTED
          - state_machines.Diploma.PRINTED_to_ISSUED
        distinguishing_aspect: |
          Diploma has a true cycle ISSUED -> CORRECTION_REQUESTED ->
          REPRINT_QUEUED -> PRINTED -> ISSUED (post-ceremony correction loop).
          Different entity AND different non-linear shape (cycle) than the
          Ceremony parallel-dimensions instance below.
        test_recipe:
          setup:
            - "Ceremony COMMENCED; one SUMMA graduate with an ISSUED diploma (printed_name 'Jonathan Public')"
            - "segregation of duties: batch creator reg-a-1, releaser reg-b-1"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: true }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/ceremonies/${c}/open-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/graduates"
              payload: { ceremony_id: "${c}", full_name: "Jonathan Public", email: "jon@x.edu", institutional_gpa_credits: 45, institutional_quality_points: 175.5, transfer_gpa_credits: 0, transfer_quality_points: 0, credits_completed: 120, credits_required: 120, outstanding_hold_count: 0 }
              as: RegistrarOfficer
              captures: { g: $.data.id }
            - call: "POST /api/graduates/${g}/audits"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /api/ceremonies/${c}/lock-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/ceremonies/${c}/print-batches"
              payload: {}
              as: RegistrarOfficer
              as_user_id: "reg-a-1"
              captures: { b1: $.data.id }
            - call: "POST /api/print-batches/${b1}/diplomas"
              payload: { graduate_id: "${g}", printed_name: "Jonathan Public" }
              as: RegistrarOfficer
              captures: { d: $.data.id }
            - call: "POST /api/print-batches/${b1}/release"
              payload: {}
              as: RegistrarOfficer
              as_user_id: "reg-b-1"
            - call: "POST /api/print-batches/${b1}/mark-printed"
              payload: {}
              as: RegistrarOfficer
            - call: "POST /api/graduates/${g}/reader-card"
              payload: { phonetic_spelling: "JON-uh-thun PUB-lik" }
              as: Graduate
              as_user_id: "${g}"
            - call: "POST /api/ceremonies/${c}/mark-ready"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/ceremonies/${c}/commence"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/diplomas/${d}/issue"
              payload: {}
              as: CommitteeChair
          trigger:
            - call: "POST /api/diplomas/${d}/corrections"
              payload: { corrected_name: "Johnathan Public" }
              as: Graduate
              as_user_id: "${g}"
            - call: "POST /api/ceremonies/${c}/print-batches"
              payload: {}
              as: RegistrarOfficer
              as_user_id: "reg-a-1"
              captures: { b2: $.data.id }
            - call: "POST /api/diplomas/${d}/correction-decision"
              payload: { decision: "APPROVED" }
              as: RegistrarOfficer
              captures: { d_status: $.data.status, d_batch: $.data.print_batch_id, d_name: $.data.printed_name, d_corr: $.data.correction_count }
            - call: "POST /api/print-batches/${b2}/release"
              payload: {}
              as: RegistrarOfficer
              as_user_id: "reg-b-1"
            - call: "POST /api/print-batches/${b2}/mark-printed"
              payload: {}
              as: RegistrarOfficer
              captures: { b2_status: $.data.status }
            - call: "POST /api/diplomas/${d}/issue"
              payload: {}
              as: CommitteeChair
              captures: { d_final: $.data.status }
          assert:
            - "after correction approval: status == REPRINT_QUEUED, print_batch_id == ${b2}, printed_name == 'Johnathan Public', correction_count == 1"
            - "after reprint batch mark-printed: Diploma.${d}.status == PRINTED (batch b2 PRINTED)"
            - "after second issue: status == ISSUED — full cycle ISSUED -> CORRECTION_REQUESTED -> REPRINT_QUEUED -> PRINTED -> ISSUED traversed"
            - "pinned_honor_tier == SUMMA_CUM_LAUDE throughout (re-pinned from unchanged honor at correction approval)"

      - name: ceremony_posture_weather_parallel_dimensions
        grounds:
          - state_machines.Ceremony.FAIR_to_RAIN_PLAN_ACTIVE
          - state_machines.Ceremony.RAIN_PLAN_ACTIVE_to_FAIR
          - entities.Ceremony.fields.weather_mode
          - entities.Ceremony.fields.readiness_posture
        distinguishing_aspect: |
          Ceremony carries two PARALLEL state dimensions — readiness_posture and
          weather_mode — that evolve independently (weather toggles FAIR->RAIN->
          FAIR while posture stays AUDIT_LOCKED). Different entity and different
          non-linear shape (parallel dimensions) than the Diploma cycle above.
        test_recipe:
          setup:
            - "Ceremony AUDIT_LOCKED with rain_venue configured; one audited graduate (allocation never requested — waterfall skips requested_count 0)"
          setup_api_calls:
            - call: "POST /api/venues"
              payload: { name: "Main Arena", address: "1 College Ave", total_capacity: 10, accessible_capacity: 2, indoor: false }
              as: VenueCoordinator
              captures: { v: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Rain Hall", address: "2 College Ave", total_capacity: 6, accessible_capacity: 1, indoor: true }
              as: VenueCoordinator
              captures: { vr: $.data.id }
            - call: "POST /api/ceremonies"
              payload: { name: "Spring Commencement", ceremony_date: "2026-06-01T15:00:00Z", venue_id: "${v}", rain_venue_id: "${vr}", ticket_ratio: 1.0, guest_ticket_base_cap: 4, honor_bonus_tickets: 2, pronunciation_deadline: "2026-05-20T00:00:00Z", ticket_request_deadline: "2026-05-15T00:00:00Z", regalia_order_deadline: "2026-05-10T00:00:00Z" }
              as: CommitteeChair
              captures: { c: $.data.id }
            - call: "POST /api/ceremonies/${c}/open-audit"
              payload: {}
              as: CommitteeChair
            - call: "POST /api/graduates"
