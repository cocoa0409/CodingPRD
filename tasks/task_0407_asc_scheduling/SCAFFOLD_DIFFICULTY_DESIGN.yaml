          - state_machines.SurgeonBlock.HELD_to_RELEASED
          - state_machines.SurgeonBlock.CONFIRMED_to_RELEASED
          - entities.SurgeonBlock.fields.status
        distinguishing_aspect: |
          Different entity (SurgeonBlock): branching shape HELD -> {CONFIRMED, RELEASED} with both
          CONFIRMED and HELD converging to terminal RELEASED — not a linear pipeline. Confirm then
          release reaches RELEASED via the CONFIRMED branch.
        test_recipe:
          setup:
            - "Facility/OR/surgeon/day; one HELD block [480,600) with no cases; then CONFIRMED."
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC F", turnover_minutes: 25, hp_validity_days: 30 }
