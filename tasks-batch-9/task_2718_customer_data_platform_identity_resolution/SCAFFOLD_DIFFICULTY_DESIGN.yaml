            - "the setup dispatch of ${act_a_id} returned status 200 with status DISPATCHED, proving the identical call succeeds while the Segment is APPROVED"
            - "the retention run response governance_expired_segment_count == 1"
            - "the retention run response paused_activation_count == 1"
            - "Segment.${seg_id}.status == GOVERNANCE_EXPIRED"
            - "Activation.${act_a_id}.status == PAUSED"
            - "Activation.${act_a_id}.paused_reason == GOVERNANCE_EXPIRED"
            - "the trigger returns status 409"
            - "the trigger response body error_id == ERR_GOVERNANCE_NOT_APPROVED"
            - "Activation.${act_b_id}.status == DRAFT"
            - "Activation.${act_b_id}.dispatched_at == null"
            - "Activation.${act_b_id}.dispatched_hash_count == 0"
            - "Destination.${dest_b_id}.remaining_daily_hash_quota == 1000"
            - "Segment.${seg_id}.active_activation_count == 0"

      - name: deletion_propagate_depends_on_suppression_legal_hold_state
        grounds:
          - validations[priority=27]
          - errors[ERR_LEGAL_HOLD_ACTIVE]
          - state_machines.DeletionRequest.RECEIVED_to_BLOCKED_LEGAL_HOLD
          - state_machines.SuppressionEntry.ACTIVE_to_RELEASED
          - endpoints[POST /cdp/suppression-entries/{suppressionId}/release]
        distinguishing_aspect: |
          Entity pair DeletionRequest -> SuppressionEntry (no entity shared with the Activation ->
          Segment pair): the very same propagate call on the very same RECEIVED request fails with
          ERR_LEGAL_HOLD_ACTIVE while a LEGAL_HOLD SuppressionEntry is ACTIVE and succeeds into
          PROPAGATING once that entry is RELEASED, and the failed attempt itself parks the request
          in BLOCKED_LEGAL_HOLD until the release drives it back to RECEIVED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem HOLD_SRC and one PROMOTED batch of a single fully valid record, so one RESOLVED / NORMAL Profile exists."
            - "One ACTIVE Destination DEST_HOLD with deletion_ack_sla_hours 72, so exactly one destination qualifies for propagation."
            - "One DeletionRequest in RECEIVED for that profile, which drove the subject to DELETION_PENDING and minted its system PRIVACY_DELETE suppression."
            - "One LEGAL_HOLD SuppressionEntry created by u_privacy over [2026-08-01T00:00:00Z, null); per the PRECEDENCE EXCEPTION note in §1.2 it is stored ACTIVE while the subject's privacy_status stays DELETION_PENDING."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
