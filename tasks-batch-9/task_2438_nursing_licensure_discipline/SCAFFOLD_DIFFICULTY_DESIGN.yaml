  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: renewal_denial_moves_fee_to_credit_conserving_the_ledger
        grounds:
          - calculations.renewal_fee_assessment
          - state_machines.RenewalApplication.CE_VERIFIED_to_DENIED
          - entities.Nurse.fields.fee_paid_total_cents
          - entities.Nurse.fields.fee_credit_cents
          - entities.RenewalApplication.fields.fee_applied_cents
        distinguishing_aspect: |
          The conserved quantity is the fee ledger identity
          Nurse.fee_paid_total_cents == Nurse.fee_credit_cents + sum of fee_applied_cents over
          non-WITHDRAWN renewals. It reads 12000 == 0 + 12000 before the denial and
          12000 == 12000 + 0 after it: the compensating action moves the money sideways instead of
          decrementing fee_paid_total_cents, so an implementation that "refunds" by subtracting
          from the total leaves the identity intact but loses the audit trail, and one that credits
          without zeroing fee_applied_cents double-counts. Only the exact pairing balances.
        test_recipe:
          setup:
            - "Board OH keeps renewal_base_fee_cents 12000 and ce_hours_required 30.00."
            - "The clock is at 2028-07-01, before the license's 2028-08-01 expiry, so late_days is 0, no late tier applies and fee_applied_cents is exactly 12000."
            - "The renewal is paid (fee_paid_cents 12000, Nurse.fee_paid_total_cents 12000, Nurse.fee_credit_cents 0), carries one accredited 1800-minute LIVE_CONTACT record worth 30.00 hours, is SUBMITTED and reaches CE_VERIFIED with audit_status NOT_SELECTED."
          setup_api_calls:
            - call: "POST /state-board-configs"
