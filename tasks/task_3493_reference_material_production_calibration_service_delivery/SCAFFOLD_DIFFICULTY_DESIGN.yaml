              payload: { service_id: "${svc}", standard_description: "Fluke 5720A working standard", calibrated_by_lab: "NIST-EE", calibrated_date: "2026-06-01T00:00:00Z", calibration_due_date: "2027-06-01T00:00:00Z", uncertainty_contribution: 0.1 }
              as: Metrologist
            - call: "POST /metrology/customers"
              payload: { name: "Cal Cust", tier: GENERAL, credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_cal: $.data.id }
            - call: "POST /metrology/calibration-orders"
              payload: { service_id: "${svc}", artifact_description: "DMN reference", measurement_points: 4, expedite_requested: false }
              as: Customer
              as_user_id: "${c_cal}"
              captures: { cal_o: $.data.id, cal_o_quoted: $.data.quoted_fee_cents }
          trigger:
            - call: "POST /metrology/calibration-orders/${cal_o}/transitions"
              payload: { to: SCHEDULED, scheduled_start: "2026-10-05T09:00:00Z", scheduled_end: "2026-10-05T11:00:00Z" }
              as: CalibrationCoordinator
              captures: { cal_fee: $.data.final_fee_cents }
            - call: "POST /metrology/calibration-orders/${cal_o}/transitions"
              payload: { to: IN_MEASUREMENT }
              as: Metrologist
            - call: "POST /metrology/calibration-orders/${cal_o}/transitions"
              payload: { to: MEASUREMENT_HOLD }
              as: Metrologist
            - call: "POST /metrology/calibration-orders/${cal_o}/transitions"
              payload: { to: IN_MEASUREMENT }
              as: Metrologist
            - call: "POST /metrology/calibration-orders/${cal_o}/transitions"
              payload: { to: COMPLETED, result: IN_TOLERANCE, measured_correction: 0.003 }
              as: Metrologist
              captures: { cal_final_status: $.data.status, cal_result: $.data.result }
          assert:
            - "cal_o_quoted == 26000"
            - "cal_fee == 26000 (standard branch: multiplier not applied)"
            - "cal_final_status == COMPLETED"
            - "cal_result == IN_TOLERANCE"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: pt_evaluation_fail_cascade_to_credit_hold
        grounds:
          - state_machines.PTRound.ANALYSIS_OPEN_to_EVALUATION
          - calculations.pt_evaluation
          - calculations.accreditation_standing
        distinguishing_aspect: |
          Depth-3 cascade from the EVALUATION trigger: evaluation -> result
          EVALUATED with flag FAIL (link 1) -> customer.pt_fail_count reaches 3 and
          accreditation_standing flips to SUSPENDED (link 2) -> credit_hold = true
          blocks new sales orders (link 3); at 2 fails (PROBATION) orders still succeed.
        test_recipe:
          setup:
            - "program P; lot L in IN_DISTRIBUTION with UNWEIGHTED cert (value 102.0, expanded_uncertainty 4.0, validity 365), total 10, qc 4"
            - "customer C_LAB; rounds R1,R2 closed after one FAIL each (z = 3.0); probe order between R2 and R3 succeeds"
          setup_api_calls:
            - call: "POST /metrology/programs"
              payload: { program_code: "NIST-RM-07", name: "RM Program 7", material_unit_price_cents: 1000, discount_pct_federal: 0, discount_pct_accredited_lab: 10, discount_pct_general: 0, handling_fee_threshold_cents: 10000, handling_fee_flat_cents: 500, expedite_multiplier_pct: 150, daily_lab_capacity_minutes: 480 }
              as: ProgramAdmin
