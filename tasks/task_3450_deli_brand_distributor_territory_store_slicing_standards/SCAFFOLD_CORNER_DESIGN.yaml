            - { call: "POST /api/accounts", payload: { name: "Store A", channel: "INDEPENDENT_GROCER", territory_id: "${t1}" }, as: DistributorRep, as_user_id: "${d1}", captures: { a1: $.data.id } }
            - { call: "POST /api/accounts/${a1}/review", payload: { decision: "APPROVE" }, as: BrandAdmin }
            - { call: "POST /api/slicers", payload: { account_id: "${a1}", label: "S1", dedicated_allergen: "NONE" }, as: RetailManager, as_user_id: "${a1}", captures: { s1: $.data.id } }
            - { call: "POST /api/service-visits", payload: { account_id: "${a1}", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T10:00:00Z" }, as: DistributorRep, as_user_id: "${d1}", captures: { v1: $.data.id } }
            - { call: "POST /api/service-visits/${v1}/submit", payload: { score: 90, rotation_compliant: true, slicer_presentation_ok: true, cleaned_slicer_ids: [ "${s1}" ] }, as: DistributorRep, as_user_id: "${d1}" }
          trigger:
            - { call: "POST /api/opened-product-logs", payload: { product_id: "${p1}", slicer_id: "${s1}", opened_at: "2026-09-02T01:00:00Z" }, as: RetailManager, as_user_id: "${a1}", captures: { err: $.data.error_id } }
            - { call: "POST /api/opened-product-logs", payload: { product_id: "${p1}", slicer_id: "${s1}", opened_at: "2026-09-01T23:00:00Z" }, as: RetailManager, as_user_id: "${a1}", captures: { g1: $.data.id } }
          assert:
            - "err == ERR_ALLERGEN_CROSS_CONTACT for opened_at +25h after the cleaning (cleaning at 2026-09-01T00:00:00Z, clock time of submit)"
            - "OpenedProductLog.${g1}.status == OPEN for opened_at +23h after the cleaning"
        note: "the clock is at the default 2026-09-01T00:00:00Z when the visit is submitted, so cleaning_verified_at == 2026-09-01T00:00:00Z"

      - name: delivery_of_unauthorized_product_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=10"]', 'errors[ERR_PRODUCT_NOT_AUTHORIZED]']
        distinguishing_aspect: "The product is orderable by the distributor but not deliverable to an account lacking an AUTHORIZED authorization."
        test_recipe:
          setup: ["full order+allocation chain for P1 but NO authorization for account A1"]
          setup_api_calls:
            - { call: "POST /api/distributors", payload: { code: "D1", name: "Dist One" }, as: BrandAdmin, captures: { d1: $.data.id } }
