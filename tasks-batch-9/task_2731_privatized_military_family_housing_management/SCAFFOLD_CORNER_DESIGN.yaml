          setup:
            - "One installation with the declared defaults, holding unit B-200 (3BR SFH, SENIOR_ENLISTED) created FIRST and unit A-101 (2BR TOWNHOME, JUNIOR_ENLISTED) created SECOND."
            - "Sponsor 1 (E5, bedroom_eligibility 2) applied with pcs_orders_date 2026-08-25."
            - "Sponsor 2 (E5, bedroom_eligibility 2) applied with pcs_orders_date 2026-08-20 - the earliest control date of the three."
            - "Sponsor 3 (E7, so SENIOR_ENLISTED, with a spouse and sons born 2014-05-01 and 2018-04-10 giving bedroom_eligibility 3) applied with pcs_orders_date 2026-08-22."
            - "The logical clock stands at 2026-08-25T00:00:00Z; offer_response_hours is the default 72."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00Z" }
