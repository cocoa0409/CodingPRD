      - name: per_session_rounding_before_summation_pins_1_14_not_1_13
        grounds:
          - calculations.topic_hours_ledger
          - entities.AttendanceRecord.fields.credited_hours
          - entities.Recruit.fields.per_topic_credited_hours
          - endpoints[GET /recruits/{recruitId}/certification-progress]
        distinguishing_aspect: |
          ROUND_HALF_UP is applied PER AttendanceRecord row BEFORE summation. Three PARTIAL rows of
          0.50 present hours each give 0.50 * 0.75 = 0.375, which rounds to 0.38 per row and sums to
          1.14. Summing the unrounded products first (1.125) and rounding once at the end gives 1.13.
          The two evaluation orders differ by exactly one cent on a three-row set, and the same
          rounding order is what makes the recruit's per-topic map, the recruit total and the class
          ledger reconcile; a single terminal rounding leaves all three one cent low.
