            - call: "POST /violations"
              payload: { seller_id: "${sb_id}", policy_rule_id: "${rule_b}", listing_id: "${l2}", reporter_type: "BUYER", evidence_reference: "EV-YA-0001" }
              as: PolicyInvestigator
