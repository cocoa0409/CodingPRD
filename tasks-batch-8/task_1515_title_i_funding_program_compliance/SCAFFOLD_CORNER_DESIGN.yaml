              payload: { expected_grant_version: "${gv_stale}" }
              as: FederalProgramsDirector
              captures: { err: "$.data.error_id" }
          assert:
            - "412 error_id == ERR_STALE_GRANT_VERSION (grant version advanced by N1's certification)"
            - "N2 remains DRAFT; N1 remains the sole CERTIFIED snapshot"

