              as: ProgramAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vendor-contracts"
              payload: { site_id: "${site_id}", employer_id: "${emp_std}", vendor_name: "CareNearSite LLC", fee_model: "PER_VISIT", per_visit_fee_cents: 9500, fte_hourly_rate_cents: 14000, minimum_guarantee_cents: 100000, quota_visits_total: 20 }
