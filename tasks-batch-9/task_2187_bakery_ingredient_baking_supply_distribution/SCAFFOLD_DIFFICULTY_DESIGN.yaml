            - "WarehouseZone.${zone_nut_id}.on_hand_lb == 5000"
            - "WarehouseZone.${zone_nut_id}.status == OPEN"

  - rule_id: compensating_invariant
    instances:
      - name: conserved_pounds_of_inventory_allocate_then_deallocate_restores_every_bucket
        grounds:
          - calculations.lot_inventory_conservation
          - state_machines.Order.NEW_to_ALLOCATED
          - state_machines.Order.ALLOCATED_to_NEW
          - entities.Lot.fields.quantity_reserved_lb
          - entities.WarehouseZone.fields.on_hand_lb
        distinguishing_aspect: |
          Conserved quantity #1 = POUNDS OF INVENTORY on a Lot. The forward action (allocate,
          reserving 15000 of 50000 lb) and its compensating action (deallocate) must restore
          on_hand 50000 / reserved 0 / consumed 0 individually - not merely keep the sum at
          quantity_received_lb 50000 - and WarehouseZone.on_hand_lb must swing 50000 -> 35000 ->
          50000 with it. Deliberate subtlety: the deallocated line becomes UNALLOCATED (not
          RELEASED) and its parent Order returns to NEW, so it stays inside the
          exposure_provisional input set and allergen_risk_score remains 55.00 / AMBER.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z; customer Conservation Bakery ACTIVE, credit_limit_cents 5000000, min_drop_cents 25000."
            - "Flour SKU FLR-HRW-50 (GLUTEN, list 42, index NONE) with lot LOT-FLR-9001 of 50000 lb in OPEN GLUTEN zone Z-GLU-01 (zone on_hand_lb 50000)."
            - "One BAGGED order with a single 15000 lb flour line, submitted (total_cents 620267, pricing_status PROVISIONAL); no route stop exists, so deallocate is permitted."
          setup_api_calls:
            - call: "POST /bakery-distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /bakery-distribution/customers"
              payload: { legal_name: "Conservation Bakery", allergen_program: "STANDARD", credit_limit_cents: 5000000, min_drop_cents: 25000 }
              as: AccountManager
              as_user_id: "am-1"
              captures: { cust_id: $.data.id }
            - call: "POST /bakery-distribution/products"
              payload: { sku: "FLR-HRW-50", category: "FLOUR", allergen_class: "GLUTEN", bulk_capable: true, shelf_life_days: 180, index_code: "NONE", list_price_cents_per_lb: 42, min_rotation_days: 30 }
              as: PricingController
              as_user_id: "pc-1"
              captures: { flour_id: $.data.id }
            - call: "POST /bakery-distribution/warehouse-zones"
              payload: { zone_code: "Z-GLU-01", allergen_class: "GLUTEN" }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { zone_glu_id: $.data.id }
            - call: "POST /bakery-distribution/lots"
              payload: { lot_code: "LOT-FLR-9001", product_id: "${flour_id}", zone_id: "${zone_glu_id}", manufactured_on: "2026-07-15T00:00:00Z", quantity_received_lb: 50000 }
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { lot_id: $.data.id }
            - call: "POST /bakery-distribution/orders"
              payload: { customer_id: "${cust_id}", delivery_mode: "BAGGED", requested_delivery_on: "2026-09-15T00:00:00Z" }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/lines"
              payload: { product_id: "${flour_id}", quantity_lb: 15000 }
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { line_id: $.data.id }
            - call: "POST /bakery-distribution/orders/${order_id}/submit"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_id}"
              captures: { tot: $.data.total_cents }
          trigger:
            - call: "POST /bakery-distribution/orders/${order_id}/allocate"
              payload: {}
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { fs_alloc: $.data.fulfillment_status }
            - call: "GET /bakery-distribution/lots/${lot_id}"
              payload: {}
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { on_hand_mid: $.data.quantity_on_hand_lb, reserved_mid: $.data.quantity_reserved_lb, consumed_mid: $.data.quantity_consumed_lb }
            - call: "POST /bakery-distribution/orders/${order_id}/deallocate"
              payload: {}
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { fs_dealloc: $.data.fulfillment_status }
            - call: "GET /bakery-distribution/lots/${lot_id}"
              payload: {}
              as: WarehouseOperator
              as_user_id: "wo-1"
              captures: { on_hand_after: $.data.quantity_on_hand_lb, reserved_after: $.data.quantity_reserved_lb, consumed_after: $.data.quantity_consumed_lb, received_after: $.data.quantity_received_lb }
          assert:
            - "${tot} == 620267"
            - "${fs_alloc} == ALLOCATED"
            - "${on_hand_mid} == 35000"
            - "${reserved_mid} == 15000"
            - "${consumed_mid} == 0"
            - "${fs_dealloc} == NEW"
            - "${on_hand_after} == 50000"
            - "${reserved_after} == 0"
            - "${consumed_after} == 0"
            - "${received_after} == 50000"
            - "50000 + 0 + 0 == 50000 (lot_inventory_conservation holds and each bucket is back to its pre-allocation value)"
            - "OrderLine.${line_id}.allocation_status == UNALLOCATED"
            - "OrderLine.${line_id}.lot_id == null"
            - "OrderLine.${line_id}.silo_id == null"
