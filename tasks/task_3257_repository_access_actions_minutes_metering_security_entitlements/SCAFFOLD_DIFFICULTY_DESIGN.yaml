# =============================================================================
# task_3257 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 difficulty rules × 2 instances each = 18 instances
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: seat_count_projection_vs_cycle_snapshot
        grounds:
          - calculations.active_committer_seat_count
          - entities.Enterprise.fields.used_seats
          - entities.UserAccount.fields.is_active_committer
        distinguishing_aspect: |
          Same seats data, two variants on the Enterprise/UserAccount domain:
          mode=CYCLE evaluates the trailing 90-day window at the current clock,
          while mode=PROJECTED excludes seats whose last commit ages out within
          the next 30 days — so a user whose only commit is 70 days old counts
          in CYCLE but not in PROJECTED.
        test_recipe:
          setup:
            - "Enterprise with purchased_seats=5; one Organization"
            - "User u1 with a CommitEvent 70 days before the clock (inside the 90-day window, but aging out within 30 days)"
            - "User u2 with a CommitEvent 10 days before the clock (safely inside both windows)"
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "TEAM" }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
            - call: "POST /users"
              payload: { login: "u1", email: "u1@x.com" }
              as: EnterpriseAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /users"
              payload: { login: "u2", email: "u2@x.com" }
              as: EnterpriseAdmin
              captures: { u2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: EnterpriseAdmin
            - call: "POST /commit-events"
              payload: { author_user_id: "${u1_id}", organization_id: "${org_id}", committed_at: "2026-06-23T00:00:00Z" }
              as: OrgAdmin
            - call: "POST /commit-events"
              payload: { author_user_id: "${u2_id}", organization_id: "${org_id}", committed_at: "2026-08-22T00:00:00Z" }
              as: OrgAdmin
          trigger:
            - call: "GET /enterprises/${ent_id}/seat-usage"
              payload: { mode: "CYCLE" }
              as: EnterpriseAdmin
              captures: { cycle_used: $.data.used_seats }
            - call: "GET /enterprises/${ent_id}/seat-usage"
              payload: { mode: "PROJECTED" }
              as: EnterpriseAdmin
              captures: { proj_used: $.data.used_seats }
          assert:
            - "cycle_used == 2"
            - "proj_used == 1"
            - "cycle_used != proj_used"

      - name: minutes_allowance_vs_overage_variants
        grounds:
          - calculations.actions_minutes_billing
          - entities.WorkflowRun.fields.billing_status
          - entities.WorkflowRun.fields.overage_cost_cents
        distinguishing_aspect: |
          Same metering data on the WorkflowRun/Organization domain, two
          settlement variants: a run that fits the remaining allowance settles
          ALLOWANCE_APPLIED with overage_cost_cents == 0, while an identical
          run dispatched after the allowance is exhausted settles BILLED with
          overage_cost_cents == ceil(minutes × rate).
        test_recipe:
          setup:
            - "Enterprise + FREE Organization (included_actions_minutes = 500)"
            - "Repository r1; clock at default 2026-09-01"
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "FREE" }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
            - call: "POST /repositories"
              payload: { organization_id: "${org_id}", name: "repo1", visibility: "PRIVATE" }
              as: OrgAdmin
              captures: { repo_id: $.data.id, repo_v: $.data.version }
          trigger:
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "HOSTED", os_type: "LINUX", requested_minutes: 500, expected_repository_version: "${repo_v}" }
              as: OrgAdmin
              captures: { run1_id: $.data.id }
            - call: "POST /workflow-runs/${run1_id}/transition"
              payload: { action: "START" }
              as: RunnerAgent
            - call: "POST /workflow-runs/${run1_id}/transition"
              payload: { action: "COMPLETE" }
              as: RunnerAgent
              captures: { run1_billing: $.data.billing_status, run1_overage: $.data.overage_cost_cents }
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "HOSTED", os_type: "LINUX", requested_minutes: 500, expected_repository_version: "${repo_v} + 1" }
              as: OrgAdmin
              captures: { run2_id: $.data.id }
            - call: "POST /workflow-runs/${run2_id}/transition"
              payload: { action: "START" }
              as: RunnerAgent
            - call: "POST /workflow-runs/${run2_id}/transition"
              payload: { action: "COMPLETE" }
              as: RunnerAgent
              captures: { run2_billing: $.data.billing_status, run2_overage: $.data.overage_cost_cents }
          assert:
            - "run1_billing == ALLOWANCE_APPLIED"
            - "run1_overage == 0"
            - "run2_billing == BILLED"
            - "run2_overage == 400   # ceil(500 × 0.8)"
            - "Organization.${org_id}.consumed_actions_minutes == 1000"

  - rule_id: combinatorial_formula
    instances:
      - name: minutes_per_run_ceil_rounding_order
        grounds:
          - calculations.actions_minutes_billing
          - entities.WorkflowRun.fields.overage_cost_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-run-then-sum for
          overage charges — five separate 1-minute LINUX overage runs cost
          5 × ceil(1 × 0.8) = 5¢, whereas the forbidden sum-then-round order
          would give ceil(5 × 0.8) = 4¢.
        test_recipe:
          setup:
            - "Enterprise + FREE Organization with included_actions_minutes exhausted to exactly 0 remaining"
            - "Repository r1"
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "FREE" }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
            - call: "POST /repositories"
              payload: { organization_id: "${org_id}", name: "repo1" }
              as: OrgAdmin
              captures: { repo_id: $.data.id, repo_v: $.data.version }
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "HOSTED", os_type: "LINUX", requested_minutes: 500, expected_repository_version: "${repo_v}" }
              as: OrgAdmin
              captures: { run0_id: $.data.id }
            - call: "POST /workflow-runs/${run0_id}/transition"
              payload: { action: "START" }
              as: RunnerAgent
            - call: "POST /workflow-runs/${run0_id}/transition"
              payload: { action: "COMPLETE" }
              as: RunnerAgent
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "HOSTED", os_type: "LINUX", requested_minutes: 1, expected_repository_version: "${repo_v} + 1" }
              as: OrgAdmin
              captures: { run1_id: $.data.id }
            - call: "POST /workflow-runs/${run1_id}/transition"
              payload: { action: "START" }
              as: RunnerAgent
            - call: "POST /workflow-runs/${run1_id}/transition"
              payload: { action: "COMPLETE" }
              as: RunnerAgent
              captures: { run1_overage: $.data.overage_cost_cents }
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "HOSTED", os_type: "LINUX", requested_minutes: 1, expected_repository_version: "${repo_v} + 2" }
              as: OrgAdmin
              captures: { run2_id: $.data.id }
            - call: "POST /workflow-runs/${run2_id}/transition"
              payload: { action: "START" }
              as: RunnerAgent
            - call: "POST /workflow-runs/${run2_id}/transition"
              payload: { action: "COMPLETE" }
              as: RunnerAgent
              captures: { run2_overage: $.data.overage_cost_cents }
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "HOSTED", os_type: "LINUX", requested_minutes: 1, expected_repository_version: "${repo_v} + 3" }
              as: OrgAdmin
              captures: { run3_id: $.data.id }
            - call: "POST /workflow-runs/${run3_id}/transition"
              payload: { action: "START" }
              as: RunnerAgent
            - call: "POST /workflow-runs/${run3_id}/transition"
              payload: { action: "COMPLETE" }
              as: RunnerAgent
              captures: { run3_overage: $.data.overage_cost_cents }
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "HOSTED", os_type: "LINUX", requested_minutes: 1, expected_repository_version: "${repo_v} + 4" }
              as: OrgAdmin
              captures: { run4_id: $.data.id }
            - call: "POST /workflow-runs/${run4_id}/transition"
              payload: { action: "START" }
              as: RunnerAgent
            - call: "POST /workflow-runs/${run4_id}/transition"
              payload: { action: "COMPLETE" }
              as: RunnerAgent
              captures: { run4_overage: $.data.overage_cost_cents }
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "HOSTED", os_type: "LINUX", requested_minutes: 1, expected_repository_version: "${repo_v} + 5" }
              as: OrgAdmin
              captures: { run5_id: $.data.id }
            - call: "POST /workflow-runs/${run5_id}/transition"
              payload: { action: "START" }
              as: RunnerAgent
            - call: "POST /workflow-runs/${run5_id}/transition"
              payload: { action: "COMPLETE" }
              as: RunnerAgent
              captures: { run5_overage: $.data.overage_cost_cents }
          trigger:
            - call: "GET /organizations/${org_id}"
              as: Any
          assert:
            - "run1_overage == 1   # ceil(1 × 0.8) per run"
            - "run2_overage == 1"
            - "run3_overage == 1"
            - "run4_overage == 1"
            - "run5_overage == 1"
            - "run1_overage + run2_overage + run3_overage + run4_overage + run5_overage == 5   # round-per-run-then-sum; sum-then-round would give 4"
            - "Organization.${org_id}.consumed_actions_minutes == 505"

      - name: minutes_allowance_waterfall_partial_crossing
        grounds:
          - calculations.actions_minutes_billing
          - entities.Organization.fields.consumed_actions_minutes
        distinguishing_aspect: |
          Mode (a) formula with ≥3 inputs and non-linear interaction: settlement
          combines os multiplier (×2.0 WINDOWS), remaining allowance (nested
          min/max), and the partial-crossing branch — a run straddling the
          allowance boundary is split: part ALLOWANCE-covered, part BILLED at
          the overage rate, never all-or-nothing.
        test_recipe:
          setup:
            - "Enterprise + TEAM Organization (included_actions_minutes = 3000)"
            - "Repository r1; 2990 allowance minutes already consumed"
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "TEAM" }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
            - call: "POST /repositories"
              payload: { organization_id: "${org_id}", name: "repo1" }
              as: OrgAdmin
              captures: { repo_id: $.data.id, repo_v: $.data.version }
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "HOSTED", os_type: "LINUX", requested_minutes: 2990, expected_repository_version: "${repo_v}" }
              as: OrgAdmin
              captures: { run0_id: $.data.id }
            - call: "POST /workflow-runs/${run0_id}/transition"
              payload: { action: "START" }
              as: RunnerAgent
            - call: "POST /workflow-runs/${run0_id}/transition"
              payload: { action: "COMPLETE" }
              as: RunnerAgent
          trigger:
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "HOSTED", os_type: "WINDOWS", requested_minutes: 10, expected_repository_version: "${repo_v} + 1" }
              as: OrgAdmin
              captures: { run1_id: $.data.id }
            - call: "POST /workflow-runs/${run1_id}/transition"
              payload: { action: "START" }
              as: RunnerAgent
            - call: "POST /workflow-runs/${run1_id}/transition"
              payload: { action: "COMPLETE" }
              as: RunnerAgent
              captures: { r1_billing: $.data.billing_status, r1_overage: $.data.overage_cost_cents, r1_billed: $.data.billed_minutes }
          assert:
            - "r1_billed == 20   # 10 × 2.0 WINDOWS multiplier"
            - "r1_billing == BILLED   # remaining allowance 10 < billed 20: partial crossing settles BILLED"
            - "r1_overage == 16   # ceil((20 - 10) × 1.6) — only the excess 10 minutes charged, at the WINDOWS overage rate"
            - "Organization.${org_id}.consumed_actions_minutes == 3010"

  - rule_id: non_linear_state_machine
    instances:
      - name: workflow_run_parallel_dimensions
        grounds:
          - state_machines.WorkflowRun
          - entities.WorkflowRun.fields.execution_status
          - entities.WorkflowRun.fields.billing_status
        distinguishing_aspect: |
          WorkflowRun carries two independent state dimensions: execution_status
          (QUEUED → RUNNING → terminal) and billing_status (METERED →
          ALLOWANCE_APPLIED/BILLED, or → REFUNDED) — a QUEUED run cancelled
          before start flips billing to REFUNDED while execution is CANCELLED
          with zero minutes consumed, proving the dimensions evolve independently.
        test_recipe:
          setup:
            - "Enterprise + TEAM Organization + Repository"
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "TEAM" }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
            - call: "POST /repositories"
              payload: { organization_id: "${org_id}", name: "repo1" }
              as: OrgAdmin
              captures: { repo_id: $.data.id, repo_v: $.data.version }
          trigger:
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "HOSTED", os_type: "MACOS", requested_minutes: 60, expected_repository_version: "${repo_v}" }
              as: OrgAdmin
              captures: { run_id: $.data.id, q_billing: $.data.billing_status }
            - call: "POST /workflow-runs/${run_id}/transition"
              payload: { action: "CANCEL" }
              as: OrgAdmin
              captures: { c_exec: $.data.execution_status, c_billing: $.data.billing_status, c_billed: $.data.billed_minutes }
            - call: "GET /organizations/${org_id}"
              as: Any
              captures: { org_consumed: $.data.consumed_actions_minutes }
          assert:
            - "q_billing == METERED"
            - "c_exec == CANCELLED"
            - "c_billing == REFUNDED"
            - "c_billed == 0   # QUEUED runs were never metered"
            - "org_consumed == 0"

      - name: enterprise_sso_cyclic_reenforcement
        grounds:
          - state_machines.Enterprise
          - entities.Enterprise.fields.sso_enforcement
        distinguishing_aspect: |
          Enterprise.sso_enforcement is cyclic (ENFORCED → SUSPENDED → ENFORCED)
          and the cycle is non-destructive: re-enforcement from SUSPENDED does
          NOT replay the PAT-revocation cascade that fires on first enforcement
          from CONFIGURING.
        test_recipe:
          setup:
            - "Enterprise with one ACTIVE Organization; sso_enforcement advanced DISABLED → CONFIGURING → ENFORCED (first enforcement, cascade fires on zero tokens)"
            - "A PAT created after first enforcement (UNRESTRICTED policy → ACTIVE)"
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5, pat_policy: "UNRESTRICTED" }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "TEAM" }
              as: EnterpriseAdmin
            - call: "POST /users"
              payload: { login: "u1", email: "u1@x.com" }
              as: EnterpriseAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /enterprises/${ent_id}/sso/transition"
              payload: { action: "CONFIGURE" }
              as: EnterpriseAdmin
            - call: "POST /enterprises/${ent_id}/sso/transition"
              payload: { action: "ENFORCE" }
              as: EnterpriseAdmin
              captures: { sso1: $.data.sso_enforcement }
            - call: "POST /users/${u1_id}/personal-access-tokens"
              payload: { enterprise_id: "${ent_id}", scopes: ["REPO"] }
              as: UserAccount
              as_user_id: "${u1_id}"
              captures: { tok_id: $.data.id, tok_status: $.data.status }
          trigger:
            - call: "POST /enterprises/${ent_id}/sso/transition"
              payload: { action: "SUSPEND" }
              as: EnterpriseAdmin
              captures: { sso2: $.data.sso_enforcement }
            - call: "POST /enterprises/${ent_id}/sso/transition"
              payload: { action: "ENFORCE" }
              as: EnterpriseAdmin
              captures: { sso3: $.data.sso_enforcement }
            - call: "GET /users/${u1_id}/personal-access-tokens"
              as: EnterpriseAdmin
              captures: { tok_after: "$.data[0].status" }
          assert:
            - "sso1 == ENFORCED"
            - "sso2 == SUSPENDED"
            - "sso3 == ENFORCED   # cyclic return to ENFORCED"
            - "tok_after == ACTIVE   # re-enforcement is non-destructive: no revocation cascade on the SUSPENDED → ENFORCED leg"

  - rule_id: transitive_cascade
    instances:
      - name: sso_enforcement_depth3_cascade
        grounds:
          - state_machines.Enterprise.CONFIGURING_to_ENFORCED
          - state_machines.PersonalAccessToken.ACTIVE_to_REVOKED
          - state_machines.MarketplaceAppInstallation.INSTALLED_to_SUSPENDED
          - entities.AuditLogEvent.fields.action
        distinguishing_aspect: |
          Depth-3 cascade originating from SSO enforcement: ENFORCE revokes an
          ACTIVE UNRESTRICTED-era PAT (link 1), the revocation emits an
          AuditLogEvent pat.revoked_by_sso (link 2, caused by the revocation,
          not by the ENFORCE call directly), and ADMIN_ORG-scoped app
          installations drop to SUSPENDED (link 3).
        test_recipe:
          setup:
            - "Enterprise (UNRESTRICTED pat policy) + ACTIVE Organization + one installed app with ADMIN_ORG scope + one ACTIVE PAT with REPO scope"
            - "sso_enforcement advanced DISABLED → CONFIGURING"
            - "Audit log stream STREAMING so emitted events are marked streamed=true"
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5, pat_policy: "UNRESTRICTED" }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "TEAM" }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
            - call: "POST /users"
              payload: { login: "u1", email: "u1@x.com" }
              as: EnterpriseAdmin
              captures: { u1_id: $.data.id }
            - call: "POST /users/${u1_id}/personal-access-tokens"
              payload: { enterprise_id: "${ent_id}", scopes: ["REPO"] }
              as: UserAccount
              as_user_id: "${u1_id}"
              captures: { tok_id: $.data.id }
            - call: "POST /organizations/${org_id}/app-installations"
              payload: { app_slug: "ci-bot", permission_scopes: ["ADMIN_ORG"] }
              as: OrgAdmin
              captures: { app_id: $.data.id }
            - call: "POST /app-installations/${app_id}/transition"
              payload: { action: "INSTALL" }
              as: OrgAdmin
              captures: { app_status: $.data.status }
            - call: "POST /enterprises/${ent_id}/audit-log-stream/toggle"
              payload: {}
              as: EnterpriseAdmin
              captures: { stream_status: $.data.audit_log_stream_status }
            - call: "POST /enterprises/${ent_id}/sso/transition"
              payload: { action: "CONFIGURE" }
              as: EnterpriseAdmin
          trigger:
            - call: "POST /enterprises/${ent_id}/sso/transition"
              payload: { action: "ENFORCE" }
              as: EnterpriseAdmin
            - call: "GET /users/${u1_id}/personal-access-tokens"
              as: EnterpriseAdmin
              captures: { tok_after: "$.data[0].status" }
            - call: "GET /enterprises/${ent_id}/audit-log-events"
              payload: {}
              as: EnterpriseAdmin
          assert:
            - "stream_status == STREAMING"
            - "app_status == INSTALLED"
            - "tok_after == REVOKED   # link 1: PAT revoked by enforcement"
            - "app installation ${app_id} status == SUSPENDED   # link 3: ADMIN_ORG-scoped app suspended"
            - "audit log contains action=pat.revoked_by_sso with streamed == true   # link 2: revocation emitted the audit event"
            - "audit log contains action=sso.enforced"

      - name: org_suspend_depth3_cascade
        grounds:
          - state_machines.Organization.ACTIVE_to_SUSPENDED
          - state_machines.SelfHostedRunner.ACTIVE_to_OFFLINE
          - state_machines.WorkflowRun.QUEUED_to_CANCELLED
          - calculations.actions_minutes_billing
        distinguishing_aspect: |
          Depth-3 cascade originating from organization suspension: SUSPEND
          drops an ACTIVE runner to OFFLINE (link 1), a QUEUED run of the org
          flips to CANCELLED (link 2), and the run's billing_status flips
          METERED → REFUNDED with consumed_actions_minutes unchanged because
          QUEUED runs were never metered (link 3, caused by the cancellation).
          Originates from a different trigger than sso_enforcement_depth3_cascade.
        test_recipe:
          setup:
            - "Enterprise + ACTIVE Organization + heartbeated ACTIVE self-hosted runner + one dispatched QUEUED run (not yet started)"
          setup_api_calls:
            - call: "POST /enterprises"
              payload: { name: "E1", purchased_seats: 5 }
              as: EnterpriseAdmin
              captures: { ent_id: $.data.id }
            - call: "POST /organizations"
              payload: { enterprise_id: "${ent_id}", login: "org1", plan_tier: "TEAM" }
              as: EnterpriseAdmin
              captures: { org_id: $.data.id }
            - call: "POST /repositories"
              payload: { organization_id: "${org_id}", name: "repo1" }
              as: OrgAdmin
              captures: { repo_id: $.data.id, repo_v: $.data.version }
            - call: "POST /organizations/${org_id}/runners"
              payload: { name: "r1", os_type: "LINUX", labels: ["gpu"] }
              as: OrgAdmin
              captures: { runner_id: $.data.id }
            - call: "POST /runners/${runner_id}/heartbeat"
              payload: {}
              as: RunnerAgent
              captures: { runner_status: $.data.status }
            - call: "POST /repositories/${repo_id}/workflow-runs"
              payload: { runner_kind: "SELF_HOSTED", os_type: "LINUX", requested_minutes: 30, runner_id: "${runner_id}", expected_repository_version: "${repo_v}" }
              as: OrgAdmin
              captures: { run_id: $.data.id }
          trigger:
            - call: "POST /organizations/${org_id}/transition"
              payload: { action: "SUSPEND" }
              as: EnterpriseAdmin
              captures: { org_status: $.data.status, org_consumed: $.data.consumed_actions_minutes }
          assert:
            - "runner_status == ACTIVE   # pre-cascade baseline"
            - "org_status == SUSPENDED"
            - "SelfHostedRunner.${runner_id}.status == OFFLINE   # link 1"
