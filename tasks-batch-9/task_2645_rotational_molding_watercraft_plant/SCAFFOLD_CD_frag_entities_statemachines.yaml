            - "ProductionOrder.${po}.version is identical before and after the third clock step, and status is still 'BLOCKED_RESIN' with blocked_reason 'NO_QUALIFIED_RESIN_LOT' — a no-op cascade writes nothing"

      # ------------------------------------------------------------------ stubs
      - name: sm_branching_fork_from_scheduled_cycle_diverges_to_oven_or_abort
        claim_type: "Shape: branching"
        grounds:
          - state_machines.MoldingCycle.SCHEDULED_to_OVEN_RUNNING
          - state_machines.MoldingCycle.SCHEDULED_to_ABORTED
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: "non_linear_state_machine / molding_cycle_scheduled_fork_with_divergent_abort_compensation"
          rationale: "That instance drives two sibling cycles out of the same SCHEDULED state down the two outgoing edges in one run and then contrasts their compensation: the started branch consumes its charge irreversibly while the aborted branch returns it to available_kg. It already asserts both fork legs, their divergent side effects and the fact that the legs never reconverge."

      - name: sm_cyclic_finished_unit_rework_loop_terminates_at_rework_count_two
        claim_type: "Shape: cyclic"
        grounds:
          - state_machines.FinishedUnit.build_status.INSPECTED_to_REWORK
          - state_machines.FinishedUnit.build_status.REWORK_to_TRIMMED
          - entities.FinishedUnit.fields.rework_count
        excluded_because:
          difficulty_instance: "non_linear_state_machine / finished_unit_rework_loop_edge_closed_by_logistics_axis"
          rationale: "The rework loop is traversed there to its termination condition, including the rework_count ceiling and the point at which the loop edge is closed off by the parallel logistics axis — a superset of 'the entity can loop back and the loop count is respected'."

      - name: sm_backward_edge_shipment_unseal_clears_quote_and_requires_reseal
        claim_type: "Shape: cyclic"
        grounds:
          - state_machines.Shipment.SEALED_to_LOADING
          - endpoints.POST_/shipments/{shipment_id}/unseal
          - calculations.shipment_freight
        excluded_because:
          difficulty_instance: "non_linear_state_machine / shipment_unseal_revert_forces_requote_on_a_new_discount_tier"
          rationale: "That instance takes the SEALED -> LOADING backward edge, asserts that the quote fields are cleared, then re-seals at a different utilisation and asserts the new tier — it covers the loop edge and proves the revert is not a no-op, which is more than the shape row asks for."

      - name: sm_cascade_down_demold_service_due_aborts_sibling_scheduled_cycles
        claim_type: "Side effect pattern: Cascade down"
        grounds:
          - state_machines.Mold.AVAILABLE_to_MAINTENANCE
          - state_machines.MoldingCycle.SCHEDULED_to_ABORTED
          - state_machines.ResinCharge.RESERVED_to_RELEASED
        excluded_because:
          difficulty_instance: "transitive_cascade / demold_service_cascade_unblocks_three_resin_blocked_orders"
          rationale: "CASCADE-B is driven there from its head (a demould that pushes cycles_since_service onto the service interval) through all five links, including the abort of the sibling SCHEDULED cycles on that mould and the release of their charges. The corner asserted here for CASCADE-E would be a duplicate for CASCADE-B."

      - name: sm_cross_entity_order_blocks_and_unblocks_on_resin_lot_state
        claim_type: "Side effect pattern: Cross-entity"
        grounds:
          - state_machines.ProductionOrder.READY_TO_SCHEDULE_to_BLOCKED_RESIN
          - state_machines.ProductionOrder.BLOCKED_RESIN_to_READY_TO_SCHEDULE
          - state_machines.ResinLot.AVAILABLE_to_QUARANTINED
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / production_order_blocks_on_resin_lot_quarantine_and_unblocks_on_release"
          rationale: "That instance quarantines the lot, asserts the order's induced BLOCKED_RESIN state and blocked_reason, then releases the quarantine and asserts the return edge — entity A changes, entity B's state and fields are verified in both directions."

      - name: sm_guarded_store_blocked_by_frozen_warehouse_posture
        claim_type: "Shape: guarded transitions"
        grounds:
          - state_machines.FinishedUnit.logistics_status.UNALLOCATED_to_STORED
          - state_machines.Warehouse.RESTRICTED_to_FROZEN
          - errors.ERR_WAREHOUSE_FROZEN
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / finished_unit_store_gated_by_warehouse_frozen_posture"
          rationale: "The store transition is exercised there against all three postures of the target site, including the FROZEN refusal and the successful store once the posture relaxes — exactly the 'A -> B only if entity C is in state X' claim, with the boundary arithmetic of the posture thresholds on top."

      - name: sm_ledger_sync_resin_mass_three_buckets_across_reserve_consume_release
        claim_type: "Side effect pattern: Ledger sync"
        grounds:
          - entities.ResinLot.fields.available_kg
          - entities.ResinLot.fields.reserved_kg
          - entities.ResinLot.fields.consumed_kg
          - state_machines.ResinCharge.RESERVED_to_CONSUMED
          - state_machines.ResinCharge.RESERVED_to_RELEASED
        excluded_because:
          difficulty_instance: "compensating_invariant / resin_mass_ledger_conserved_across_reserve_release_and_irreversible_consume"
          rationale: "That instance reconciles the lot's three mass buckets before and after every charge event and asserts the sum against received_kg at each step, which is the strongest possible form of the before/after ledger reconciliation this row asks for."

      - name: sm_ledger_sync_warranty_reserve_and_paid_across_approve_and_void
        claim_type: "Side effect pattern: Ledger sync"
        grounds:
          - entities.ProductModel.fields.warranty_reserve_cents
          - entities.ProductModel.fields.warranty_paid_cents
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.WarrantyClaim.APPROVED_to_VOID
        excluded_because:
          difficulty_instance: "compensating_invariant / warranty_reserve_ledger_conserved_across_approve_and_void"
          rationale: "The claim's approval moves money from the model's reserve to its paid bucket and the void moves it back; that instance asserts both buckets after each transition and the conserved total throughout, so the ancestor-field sync is already pinned in both directions."

      - name: sm_compensation_release_storage_reverses_footprint_with_anchor_promotion
        claim_type: "Side effect pattern: Compensation"
        grounds:
          - state_machines.FinishedUnit.logistics_status.STORED_to_UNALLOCATED
          - entities.Warehouse.fields.committed_cube_m3
          - entities.FinishedUnit.fields.is_zone_anchor
        excluded_because:
          difficulty_instance: "compensating_invariant / storage_footprint_conserved_with_asymmetric_anchor_promotion"
          rationale: "Releasing a stored hull is the compensating half of the store, and that instance shows the reversal is asymmetric: when the anchor leaves, a follower is promoted and the site's committed cube is recomputed rather than simply decremented. It asserts the no-drift end state after the round trip."

      - name: sm_precondition_oven_arm_window_conflict_on_cycle_create
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ProductionOrder.READY_TO_SCHEDULE_to_IN_PRODUCTION
          - errors.ERR_OVEN_WINDOW_CONFLICT
          - calculations.oven_arm_window_check
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / oven_arm_half_open_span_with_symmetric_changeover_buffer"
          rationale: "That instance probes the arm precondition at four adjacent instants around the buffered half-open span (inside, exactly at the boundary, one second past it, and on a different arm), so the precondition's error and its exact geometry are both already asserted."

      - name: sm_precondition_cooling_bay_aggregate_slot_capacity_on_cycle_create
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ProductionOrder.READY_TO_SCHEDULE_to_IN_PRODUCTION
          - errors.ERR_COOLING_BAY_CAPACITY_EXCEEDED
          - calculations.cooling_bay_slot_check
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / cooling_bay_closed_interval_aggregate_slot_capacity"
          rationale: "The bay's aggregate capacity precondition is driven there to saturation and one past it on a CLOSED interval, including the touching-endpoint case that distinguishes the bay's geometry from the oven arm's — a strict superset of this corner."
