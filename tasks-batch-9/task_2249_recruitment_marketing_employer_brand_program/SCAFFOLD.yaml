    side_effects: []
  - method: GET
    path: "/nurture-campaigns"
    description: "List campaigns by program, job family or state."
    roles: [BrandProgramLead, CommunityManager, RecruitingOps]
    code: 200
    input: ["program_id?", "job_family_id?", "state?", "limit?", "offset?"]
    output: NurtureCampaign[]
    side_effects: []
  - method: GET
    path: "/nurture-sends/{sendId}"
    description: "Read one immutable send-evaluation row including outcome and window_send_count_at_eval."
    roles: [BrandProgramLead, CommunityManager, RecruitingOps]
    code: 200
    input: []
    output: NurtureSend
    side_effects: []
  - method: GET
    path: "/nurture-sends"
    description: "List send-evaluation rows by campaign, member or outcome, ordered by sequence_no ascending."
    roles: [BrandProgramLead, CommunityManager, RecruitingOps]
    code: 200
    input: ["campaign_id?", "member_id?", "outcome?", "limit?", "offset?"]
    output: NurtureSend[]
    side_effects: []
  - method: POST
    path: "/employer-reviews"
    description: "Ingest an employer review observed on a review platform; the response deadline follows from the rating."
    roles: [CommunityManager, RecruitingOps]
    code: 201
    input: ["program_id", "platform", "external_ref", "rating", "posted_at"]
    output: EmployerReview
    side_effects:
      - "Computes response_due_at per calculations.review_response_deadline (24h for rating <= 2, 72h for rating == 3, 168h for rating >= 4, measured from posted_at)."
      - "Sets state NEW, sla_status PENDING, rejection_count 0 and recomputes calculations.program_brand_health_score for the program."
  - method: POST
    path: "/employer-reviews/{reviewId}/triage"
    description: "Triage a new review, deciding whether it needs a public response."
    roles: [CommunityManager]
    code: 200
    input: ["note?"]
    output: EmployerReview
    side_effects:
      - "Moves state NEW -> TRIAGED, sets updated_at and increments version by 1."
  - method: POST
    path: "/employer-reviews/{reviewId}/draft-response"
    description: "Draft or redraft the public response text. Records the drafting user for the later segregation-of-duties check."
    roles: [CommunityManager]
    code: 200
    input: ["response_body"]
    output: EmployerReview
    side_effects:
      - "Stores response_body, sets drafted_by_user_id to the acting X-User-ID, moves state TRIAGED or DRAFTING -> DRAFTING, sets updated_at and increments version by 1."
  - method: POST
    path: "/employer-reviews/{reviewId}/submit-legal"
    description: "Send the drafted response to legal review."
    roles: [CommunityManager]
    code: 200
    input: []
    output: EmployerReview
    side_effects:
      - "Moves state DRAFTING -> LEGAL_REVIEW, sets updated_at and increments version by 1."
  - method: POST
    path: "/employer-reviews/{reviewId}/legal-review"
    description: "Approve or reject the response under legal review. The approver's X-User-ID must differ from drafted_by_user_id; a rejection sends it back to drafting and increments rejection_count."
    roles: [ComplianceReviewer]
    code: 200
    input: ["decision", "note?"]
    output: EmployerReview
    side_effects:
      - "APPROVE moves state LEGAL_REVIEW -> RESPONSE_PUBLISHED, sets approved_by_user_id and responded_at, sets sla_status MET when responded_at <= response_due_at and BREACHED otherwise, and recomputes calculations.program_brand_health_score."
      - "REJECT moves state LEGAL_REVIEW -> DRAFTING and increments rejection_count by 1."
      - "Sets updated_at and increments version by 1 on the review and, when the score moved, on the program."
  - method: POST
    path: "/employer-reviews/{reviewId}/close"
    description: "Close a triaged review without a public response; only permitted for ratings of 4 or 5."
    roles: [CommunityManager]
    code: 200
    input: ["note?"]
    output: EmployerReview
    side_effects:
      - "Moves state TRIAGED -> CLOSED_NO_RESPONSE, sets sla_status MET and recomputes calculations.program_brand_health_score."
      - "Sets updated_at and increments version by 1."
  - method: GET
    path: "/employer-reviews/{reviewId}"
    description: "Read one employer review including response_due_at, sla_status, rejection_count and the drafting and approving user ids."
    roles: [BrandProgramLead, ComplianceReviewer, CommunityManager, RecruitingOps]
    code: 200
    input: []
    output: EmployerReview
    side_effects: []
  - method: GET
    path: "/employer-reviews"
    description: "List employer reviews by program, platform, state or SLA status, ordered by posted_at ascending then created_at ascending."
    roles: [BrandProgramLead, ComplianceReviewer, CommunityManager, RecruitingOps]
    code: 200
    input: ["program_id?", "platform?", "state?", "sla_status?", "external_ref?", "limit?", "offset?"]
    output: EmployerReview[]
    side_effects: []
  - method: POST
    path: "/event-presences"
    description: "Plan a career-fair or campus brand presence for a job family at a venue."
    roles: [MediaBuyer]
    code: 201
    input: ["program_id", "job_family_id", "venue_code", "start_at", "end_at", "booth_cost_cents"]
    output: EventPresence
    side_effects:
      - "Sets state PLANNED, reserved_cents 0 and confirmed_at null. No budget is committed until confirmation."
  - method: POST
    path: "/event-presences/{presenceId}/confirm"
    description: "Confirm a planned presence. Enforces the 48-hour recruiter-team buffer per job family and reserves the booth cost from the family-dedicated then flex buckets."
    roles: [MediaBuyer]
    code: 200
    input: []
    output: EventPresence
    side_effects:
      - "Runs the event variant of calculations.media_budget_waterfall, writing RESERVE BudgetLedgerEntry rows with source_type EVENT_PRESENCE and reason EVENT_RESERVATION, and sets reserved_cents to booth_cost_cents."
      - "Moves state PLANNED -> CONFIRMED, sets confirmed_at, raises Program.committed_budget_cents and JobFamily.reserved_cents and increments Program.version by 1."
      - "Sets updated_at and increments version by 1."
  - method: POST
    path: "/event-presences/{presenceId}/complete"
    description: "Mark a confirmed presence as completed once its window has closed; the reservation converts to spend."
    roles: [MediaBuyer]
    code: 200
    input: []
    output: EventPresence
    side_effects:
      - "Moves state CONFIRMED -> COMPLETED, leaves reserved_cents at booth_cost_cents and writes no ledger entry."
      - "Sets updated_at and increments version by 1."
  - method: POST
    path: "/event-presences/{presenceId}/cancel"
    description: "Cancel a planned or confirmed presence, releasing any reservation."
    roles: [MediaBuyer]
    code: 200
    input: ["reason?"]
    output: EventPresence
    side_effects:
      - "A CONFIRMED presence writes one RELEASE BudgetLedgerEntry per outstanding RESERVE entry with reason EVENT_CANCELLED and sets reserved_cents 0, restoring Program.committed_budget_cents and JobFamily.reserved_cents to their pre-confirmation values; a PLANNED presence writes nothing."
      - "Moves state to CANCELLED, sets updated_at and increments version by 1 on the presence and, when money moved, on the program."
  - method: GET
    path: "/event-presences/{presenceId}"
    description: "Read one event presence including state, reserved_cents and confirmed_at."
    roles: [BrandProgramLead, MediaBuyer, RecruitingOps, CommunityManager]
    code: 200
    input: []
    output: EventPresence
    side_effects: []
  - method: GET
    path: "/event-presences"
    description: "List event presences by program, job family or state, ordered by start_at ascending then created_at ascending."
    roles: [BrandProgramLead, MediaBuyer, RecruitingOps, CommunityManager]
    code: 200
    input: ["program_id?", "job_family_id?", "state?", "venue_code?", "limit?", "offset?"]
    output: EventPresence[]
    side_effects: []
  - method: GET
    path: "/budget-ledger-entries/{entryId}"
    description: "Read one immutable budget ledger entry."
    roles: [BrandProgramLead, MediaBuyer, RecruitingOps]
    code: 200
    input: []
    output: BudgetLedgerEntry
    side_effects: []
  - method: GET
    path: "/budget-ledger-entries"
    description: "List budget ledger entries by program, job family, bucket or source, ordered by sequence_no ascending. Sum of delta_cents over a program equals Program.committed_budget_cents."
    roles: [BrandProgramLead, MediaBuyer, RecruitingOps]
    code: 200
    input: ["program_id?", "job_family_id?", "bucket?", "entry_type?", "source_type?", "source_id?", "limit?", "offset?"]
    output: BudgetLedgerEntry[]
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or naming a role outside the RBAC matrix, on an endpoint that does not list Anonymous."
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The acting role is not listed in the called endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Candidate calls consent-change on a TalentCommunityMember whose id differs from the acting X-User-ID."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting X-User-ID equals the id that performed the paired upstream step - persona drafted_by_user_id on review, posting optimized_by_user_id on compliance-review, review drafted_by_user_id on legal-review."
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Request body fails the endpoint input schema - missing required field, wrong type, unknown enum member, negative money or count, malformed ISO 8601 datetime, or end before start."
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset negative."
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "programId path segment or program_id body field does not resolve."
  - id: ERR_JOB_FAMILY_NOT_FOUND
    http: 404
    condition: "familyId path segment or a job_family_id / interest_job_family_id body field does not resolve."
  - id: ERR_CHANNEL_NOT_FOUND
    http: 404
    condition: "channelId path segment or channel_id body field does not resolve."
  - id: ERR_PERSONA_NOT_FOUND
    http: 404
    condition: "personaId path segment or persona_id body field does not resolve."
  - id: ERR_POSTING_NOT_FOUND
    http: 404
    condition: "postingId path segment or job_posting_id body field does not resolve."
  - id: ERR_FLIGHT_NOT_FOUND
    http: 404
    condition: "flightId path segment or media_flight_id body field does not resolve."
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "applicationId path segment or application_id body field does not resolve."
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "memberId path segment or member_id body field does not resolve."
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "campaignId path segment or campaign_id body field does not resolve."
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "reviewId path segment does not resolve."
  - id: ERR_PRESENCE_NOT_FOUND
    http: 404
    condition: "presenceId path segment does not resolve."
  - id: ERR_RECORD_NOT_FOUND
    http: 404
    condition: "signalId, touchpointId, sendId or entryId path segment of an immutable event row does not resolve."
  - id: ERR_DUPLICATE_FAMILY_CODE
    http: 409
    condition: "A JobFamily with the same code already exists inside the program."
  - id: ERR_DUPLICATE_MEMBER_EMAIL
    http: 409
    condition: "A TalentCommunityMember with the same email already exists inside the program."
  - id: ERR_DUPLICATE_REVIEW_REF
    http: 409
    condition: "An EmployerReview with the same external_ref already exists for the platform."
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version supplied to POST /media-flights differs from the program's current version."
  - id: ERR_STALE_POSTING_VERSION
    http: 412
    condition: "expected_posting_version supplied to the optimize call differs from the posting's current version."
  - id: ERR_PERSONA_NOT_DRAFT
    http: 409
    condition: "Submitting a persona whose state is not DRAFT."
  - id: ERR_PERSONA_NOT_IN_REVIEW
    http: 409
    condition: "Reviewing a persona whose state is not IN_REVIEW."
  - id: ERR_PERSONA_NOT_APPROVED
    http: 409
    condition: "Retiring a persona whose state is not APPROVED."
  - id: ERR_NO_RESEARCH_SIGNALS
    http: 409
    condition: "A persona has no ChannelPreferenceSignal inside its research window when submitted for review."
  - id: ERR_INSUFFICIENT_RESEARCH_CONFIDENCE
    http: 409
    condition: "A persona's mix_confidence_pct is below 40 when submitted for review."
  - id: ERR_PERSONA_IN_USE
    http: 409
    condition: "Retiring the last APPROVED persona of a family that still has a PUBLISHED or SUSPENDED job posting."
  - id: ERR_POSTING_NOT_OPTIMIZABLE
    http: 409
    condition: "Optimizing a posting whose content_status is not DRAFT or OPTIMIZED."
  - id: ERR_POSTING_NOT_PUBLISHABLE
    http: 409
    condition: "Publishing a posting whose content_status is not OPTIMIZED or SUSPENDED."
  - id: ERR_POSTING_ALREADY_ARCHIVED
    http: 409
    condition: "Archiving a posting whose content_status is already ARCHIVED."
  - id: ERR_POSTING_ALREADY_CLEARED
    http: 409
    condition: "A CLEAR compliance decision on a posting whose compliance_status is already CLEARED."
  - id: ERR_POSTING_ALREADY_FLAGGED
    http: 409
    condition: "A FLAG compliance decision on a posting whose compliance_status is already FLAGGED."
  - id: ERR_PAY_RANGE_INVALID
    http: 409
    condition: "pay_range_max_cents below pay_range_min_cents, or either bound absent when the posting is optimized or published - advertising accuracy."
  - id: ERR_EEO_STATEMENT_MISSING
    http: 409
    condition: "A compliance CLEAR decision or a publish attempt on a posting whose eeo_statement_included is false."
  - id: ERR_UNSUBSTANTIATED_CLAIM
    http: 409
    condition: "A compliance CLEAR decision on a posting that carries a superlative claim with no substantiation_url."
  - id: ERR_POSTING_COMPLIANCE_NOT_CLEARED
    http: 409
    condition: "Publishing a posting, activating or resuming a flight on it, or submitting an application to it while compliance_status is not CLEARED."
  - id: ERR_NO_APPROVED_PERSONA
    http: 409
    condition: "Publishing a posting whose job family has no APPROVED CandidatePersona."
  - id: ERR_OPTIMIZATION_SCORE_TOO_LOW
    http: 409
    condition: "Publishing a posting whose optimization_score is below 70."
  - id: ERR_POSTING_NOT_PUBLISHED
    http: 409
    condition: "Activating or resuming a flight, or submitting an application, while the posting's content_status is not PUBLISHED."
  - id: ERR_CHANNEL_NOT_PAYABLE
    http: 409
    condition: "Reserving a paid flight on a channel whose channel_type is not JOB_BOARD, SOCIAL or PROGRAMMATIC."
  - id: ERR_FLIGHT_TOO_SHORT
    http: 409
    condition: "flight_days below the channel's min_flight_days."
  - id: ERR_FLIGHT_WINDOW_OVERLAP
    http: 409
    condition: "A non-terminal flight on the same channel and job family already covers part of the requested half-open window; touching windows are allowed."
  - id: ERR_CHANNEL_DAILY_CAPACITY_EXCEEDED
    http: 409
    condition: "The sum of daily_cap_cents over the requested flight and every intersecting non-terminal flight on the channel exceeds Channel.daily_capacity_cents."
  - id: ERR_MEDIA_BUDGET_EXHAUSTED
    http: 409
    condition: "The dedicated-then-pool-then-flex waterfall cannot fund the flight's total_cost_cents, a resume re-reservation, or an event presence's booth_cost_cents in full."
  - id: ERR_FLIGHT_NOT_RESERVED
    http: 409
    condition: "Activating a flight whose state is not RESERVED."
  - id: ERR_BRAND_HEALTH_GATE
    http: 409
    condition: "Activating a flight while Program.brand_health_score is below 55.00."
  - id: ERR_FLIGHT_NOT_RESUMABLE
    http: 409
    condition: "Resuming a flight whose state is not PAUSED_PACING or SUSPENDED_CONTENT."
  - id: ERR_CHANNEL_THROTTLED
    http: 409
    condition: "Resuming a flight on a channel whose pacing_status is THROTTLED."
  - id: ERR_FLIGHT_NOT_COMPLETABLE
    http: 409
    condition: "Completing a flight whose state is not ACTIVE or PAUSED_PACING."
  - id: ERR_FLIGHT_WINDOW_OPEN
    http: 409
    condition: "Completing a flight before the logical clock reaches end_date T00:00:00Z."
  - id: ERR_FLIGHT_ALREADY_TERMINAL
    http: 409
    condition: "Cancelling or recording spend on a flight whose state is COMPLETED or CANCELLED."
  - id: ERR_SPEND_EXCEEDS_RESERVATION
    http: 409
    condition: "Recorded spend would push MediaFlight.spent_cents above total_cost_cents."
  - id: ERR_APPLICATION_NOT_STARTED
    http: 409
    condition: "Submitting an application whose status is not STARTED."
  - id: ERR_APPLICATION_NOT_SUBMITTED
    http: 409
    condition: "Screening an application whose status is not SUBMITTED."
  - id: ERR_APPLICATION_NOT_SCREENED
    http: 409
    condition: "Deciding QUALIFIED on an application whose status is not SCREENED."
  - id: ERR_APPLICATION_NOT_DECIDABLE
    http: 409
    condition: "Deciding DISQUALIFIED on an application whose status is neither SCREENED nor QUALIFIED."
  - id: ERR_NO_ELIGIBLE_TOUCHPOINT
    http: 409
    condition: "Qualifying an application with no Touchpoint inside the 30-day attribution lookback window."
  - id: ERR_CONSENT_ALREADY_RESOLVED
    http: 409
    condition: "Confirming consent for a member who is no longer PENDING_CONFIRMATION, or changing consent on an UNSUBSCRIBED member."
  - id: ERR_CONSENT_TOKEN_INVALID
    http: 422
    condition: "The supplied consent_token does not match the member's issued token."
  - id: ERR_CONSENT_TRANSITION_INVALID
    http: 409
    condition: "PAUSE on a member who is not SUBSCRIBED, or RESUME on a member who is not PAUSED."
  - id: ERR_CAMPAIGN_NOT_DRAFT
    http: 409
    condition: "Scheduling a campaign whose state is not DRAFT."
  - id: ERR_SCHEDULE_IN_PAST
    http: 409
    condition: "scheduled_for is before the logical clock."
  - id: ERR_CAMPAIGN_NOT_SCHEDULED
    http: 409
    condition: "Dispatching a campaign whose state is not SCHEDULED."
  - id: ERR_DISPATCH_TOO_EARLY
    http: 409
    condition: "Dispatching before the logical clock reaches scheduled_for."
  - id: ERR_NO_CONSENTED_AUDIENCE
    http: 409
    condition: "No member of the campaign's audience is SUBSCRIBED at dispatch time."
  - id: ERR_SEND_QUOTA_EXCEEDED
    http: 409
    condition: "max_sends exceeds the program's remaining send quota (send_quota_total minus send_quota_used)."
  - id: ERR_CAMPAIGN_ALREADY_TERMINAL
    http: 409
    condition: "Cancelling a campaign whose state is DISPATCHED or CANCELLED."
  - id: ERR_REVIEW_NOT_NEW
    http: 409
    condition: "Triaging a review whose state is not NEW."
  - id: ERR_REVIEW_NOT_DRAFTABLE
    http: 409
    condition: "Drafting a response on a review whose state is neither TRIAGED nor DRAFTING."
  - id: ERR_REVIEW_NOT_DRAFTING
    http: 409
    condition: "Submitting to legal a review whose state is not DRAFTING."
  - id: ERR_RESPONSE_BODY_MISSING
    http: 409
    condition: "Submitting to legal a review with no stored response_body."
  - id: ERR_REVIEW_NOT_IN_LEGAL_REVIEW
    http: 409
    condition: "Recording a legal decision on a review whose state is not LEGAL_REVIEW."
  - id: ERR_REVIEW_NOT_CLOSABLE
    http: 409
    condition: "Closing a review whose state is not TRIAGED."
  - id: ERR_RESPONSE_REQUIRED
    http: 409
    condition: "Closing a review with rating 3 or below without a published response."
  - id: ERR_PRESENCE_NOT_PLANNED
