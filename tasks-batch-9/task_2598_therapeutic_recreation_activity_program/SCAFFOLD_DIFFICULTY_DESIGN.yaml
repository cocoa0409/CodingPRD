              captures: { room_id: $.data.id }
            - call: "POST /recreation/sessions"
              payload: { program_id: "${prog_id}", room_id: "${room_id}", starts_at: "2026-08-03T09:00:00Z", ends_at: "2026-08-03T10:00:00Z", assigned_staff_count: 2 }
              as: ActivityDirector
              captures: { sess_id: $.data.id }
