            - *cx_banner
            - call: "POST /point-cycles"
              payload: { banner_id: "${cb_id}", cycle_month: "2026-07", opens_at: "2026-07-01T00:00:00Z", closes_at: "2026-07-31T23:59:59.999Z" }
              as: ProgramAdmin
              captures: { c_jul: $.data.id }
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_member
            - *cx_household
            - *cx_link
            - *cx_link_activate
            - call: "POST /purchase-transactions"
              payload: { member_id: "${cm_id}", site_id: "${cg_id}", transacted_at: "2026-07-15T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 70000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { cjul_tx_id: $.data.id }
            - call: "POST /purchase-transactions/${cjul_tx_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${cg_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /point-cycles/${c_jul}/begin-close"
              payload: {}
              as: LoyaltySupervisor
            - call: "POST /point-cycles/${c_jul}/close"
              payload: {}
              as: LoyaltySupervisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /point-cycles/${c_aug}/begin-close"
              payload: {}
              as: LoyaltySupervisor
          trigger:
            - call: "POST /point-cycles/${c_aug}/close"
              payload: {}
              as: LoyaltySupervisor
              as_user_id: "sup-1"
              captures: { roll_expired: $.data.expired_points_total, roll_rolled: $.data.rolled_over_points_total, roll_swept: $.data.swept_member_count }
          assert:
            - "${roll_expired} == 200, ${roll_rolled} == 500 and ${roll_swept} == 1"
            - "GET /point-ledger-entries?member_id=${cm_id}&entry_type=EXPIRY returns meta total_count == 1 with points_delta == -700 and lot_expires_at == null"
            - "GET /point-ledger-entries?member_id=${cm_id}&entry_type=ROLLOVER returns meta total_count == 1 with points_delta == 500 and lot_expires_at == \"2026-09-30T23:59:59.999Z\""
            - "Member.${cm_id}.available_points == 500"
            - "PointCycle.${c_jul}.expired_points_total == 0 (the July close saw nothing expiring)"

      - name: points_summary_projection_reports_pending_authorizations_without_writing
        claim_type: Correct Result
        grounds:
          - calculations.points_summary_projection
          - endpoints.GET_/members/{id}/points-summary
        distinguishing_aspect: "The forecast read separates spendable from committed points: with 500 accrued and 300 authorised at the pump it reports available_points 200 and pending_authorized_points 300, projected_expiring_points 0 (the lot outlives the open cycle), projected_available_after_close 200 — and it advances no version and writes no ledger row."
        test_recipe:
          setup:
            - "Banner CORE with cycles, grocery site, owned fuel centre and a member holding 500 points from a 50000-cent basket, with one AUTHORIZED redemption debiting 300; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - *cx_clock
            - *cx_banner
            - *cx_aug
            - *cx_sep
            - *cx_grocery
            - *cx_fuel
            - *cx_member
            - call: "POST /purchase-transactions"
              payload: { member_id: "${cm_id}", site_id: "${cg_id}", transacted_at: "2026-08-01T00:00:00Z", lines: [{ category: "GROCERY", amount_cents: 50000, quantity: 1 }] }
              as: StoreOperator
              as_user_id: "${cg_id}"
              captures: { cproj_tx_id: $.data.id }
            - call: "POST /purchase-transactions/${cproj_tx_id}/post"
              payload: {}
              as: StoreOperator
              as_user_id: "${cg_id}"
            - call: "GET /members/${cm_id}"
              payload: {}
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { cmv_proj: $.data.version }
            - call: "POST /fuel-redemptions"
              payload: { member_id: "${cm_id}", site_id: "${cf_id}", alt_id_presented: "6660000001", points_committed: 300, expected_member_version: "${cmv_proj}" }
              as: PumpTerminal
              as_user_id: "${cf_id}"
              captures: { cproj_r_id: $.data.id }
          trigger:
            - call: "GET /members/${cm_id}/points-summary"
              payload: {}
              as: Member
              as_user_id: "${cm_id}"
              captures: { sum_available: $.data.available_points, sum_pending: $.data.pending_authorized_points, sum_cycle: $.data.open_cycle_id, sum_after: $.data.projected_available_after_close }
          assert:
            - "the response status is 200, ${sum_available} == 200 and ${sum_pending} == 300"
            - "${sum_cycle} == \"${c_aug}\""
            - "the response reports projected_expiring_points == 0 and projected_rollover_points == 0"
            - "${sum_after} == 200"
            - "Member.${cm_id}.version is unchanged by the read and GET /point-ledger-entries?member_id=${cm_id} still returns meta total_count == 2"

  # ===========================================================================
  - section: validations
    instances:

      - name: missing_auth_headers_are_refused_before_any_id_is_looked_up
        claim_type: Priority Ordering
        grounds:
          - validations[priority=10]
          - validations[priority=30]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Priority 10 runs ahead of priority 30: a request with no X-User-Role / X-User-ID against a banner id that does not exist answers 401 ERR_UNAUTHENTICATED, not 404 ERR_BANNER_NOT_FOUND, so the API never confirms or denies the existence of a resource to an unauthenticated caller."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no banner with the probed id exists."
          setup_api_calls:
            - *cx_clock
          trigger:
            - call: "GET /banners/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: "(request sent with neither X-User-Role nor X-User-ID)"
              captures: { noauth_err: $.data.error_id }
            - call: "GET /banners/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: "(X-User-Role: NotARole, X-User-ID: u1)"
              captures: { badrole_err: $.data.error_id }
          assert:
            - "both responses are HTTP 401 with ${noauth_err} == \"ERR_UNAUTHENTICATED\" and ${badrole_err} == \"ERR_UNAUTHENTICATED\""
            - "neither response carries an ERR_BANNER_NOT_FOUND body"

      - name: a_forbidden_role_is_refused_before_the_unknown_path_id
        claim_type: Priority Ordering
        grounds:
          - validations[priority=20]
          - validations[priority=30]
          - rbac.ProgramAdmin.exclusive_operations
        distinguishing_aspect: "Priority 20 outranks priority 30: a StoreOperator suspending a banner id that does not exist answers 403 ERR_UNAUTHORIZED rather than 404, proving role screening happens before path resolution."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no banner with the probed id exists."
          setup_api_calls:
            - *cx_clock
          trigger:
            - call: "POST /banners/00000000-0000-4000-8000-000000000002/suspend"
              payload: {}
              as: StoreOperator
              as_user_id: "site-x"
              captures: { role_err: $.data.error_id }
          assert:
            - "the response status is 403 and ${role_err} == \"ERR_UNAUTHORIZED\""

      - name: body_reference_ids_are_resolved_in_declared_input_order
        claim_type: Cascading validation
        grounds:
          - validations[priority=32]
          - endpoints.POST_/household-links
        distinguishing_aspect: "Priority 32 walks body ids in the order the endpoint's input lists them: with BOTH household_id and member_id unresolvable, POST /household-links answers ERR_HOUSEHOLD_NOT_FOUND (household_id is listed first) and only reports ERR_MEMBER_NOT_FOUND once the household resolves."
        test_recipe:
          setup:
