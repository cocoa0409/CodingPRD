        grounds:
          - state_machines.Match.dispute_OPEN_to_UNDER_REVIEW
          - state_machines.Match.dispute_UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.Match.dispute_NEEDS_INFO_to_UNDER_REVIEW
          - state_machines.Match.dispute_UNDER_REVIEW_to_REJECTED
          - validations[priority=18]
          - errors[ERR_INVALID_DISPUTE_STATE]
        distinguishing_aspect: |
          A second, independent cycle on a different entity and a different state dimension
          (Match.dispute_status rather than Team.status): UNDER_REVIEW <-> NEEDS_INFO is
          traversed twice before terminating in REJECTED, and the cycle has no iteration
          counter — the only exit is an explicit UPHOLD or REJECT from UNDER_REVIEW. The
          instance also pins that REJECT is illegal while the dispute sits in NEEDS_INFO,
          which is what an implementation that collapses the two review states would miss.
