              as: SchedulerAdmin
            - call: "POST /api/physicians"
              payload: { full_name: "Dr A", specialty: "CARDIOLOGY", employment_type: "STAFF" }
              as: SchedulerAdmin
              captures: { p1_id: $.data.id }
            - call: "GET /api/call-slots?program_id=${prog_id}&date=2026-09-08"
              as: SchedulerAdmin
              captures: { slot_id: $.data.0.id }
          trigger:
            - call: "POST /api/call-assignments"
