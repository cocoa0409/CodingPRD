          trigger:
            - { call: "PUT /api/providers/${prov_id}/contract", payload: { contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-06-30T23:59:59Z", visit_rate_cents: 1600, expected_provider_version: "${prov_v}" }, as: BenefitsAdmin, captures: { prov_v2: $.data.version } }
            - { call: "PUT /api/providers/${prov_id}/contract", payload: { contract_start: "2026-01-01T00:00:00Z", contract_end: "2026-03-31T23:59:59Z", visit_rate_cents: 1700, expected_provider_version: "${prov_v}" }, as: BenefitsAdmin, captures: { err: $.data.error_id } }
          assert:
            - "first PUT succeeds and Provider.version == ${prov_v} + 1"
            - "second PUT with the stale ${prov_v} error_id == ERR_STALE_VERSION; http 412"

