              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg1_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg2_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg3_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg4_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /schedule-versions/${sv_id}/validate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
            - call: "POST /filing-submissions"
              payload: { schedule_version_id: "${sv_id}", distribution_system: "IATA_SSIM", change_window: "EXPEDITED" }
