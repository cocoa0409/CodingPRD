# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Transient-Occupancy / Hotel-Tax Administration — Expert
# Logical-clock startup default: 2026-05-01T00:00:00Z
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: operator_create_returns_pending_no_certificate
        claim_type: Creation
        grounds: [entities.Operator.fields.status, entities.Operator.fields.certificate_number]
        distinguishing_aspect: "POST /operators returns 201 with status=PENDING, certificate_number null, account_balance_cents 0."
        test_recipe:
          setup: ["A jurisdiction exists"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J1", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
          trigger:
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "New Op", filing_frequency: "QUARTERLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
          assert:
            - "Operator.${op}.status == PENDING"
            - "Operator.${op}.certificate_number == null"
            - "Operator.${op}.account_balance_cents == 0"

      - name: jurisdiction_defaults_applied
        claim_type: Defaults
        grounds: [entities.Jurisdiction.fields.refund_interest_monthly_bps, entities.Jurisdiction.fields.exemption_min_stay_nights]
        distinguishing_aspect: "Omitting optional jurisdiction fields applies defaults interest 100, refund 50, lien_threshold 500000, min_stay 30."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { name: "JDef", tax_rate_bps: 1000 }
              as: TaxAdmin
              captures: { jur: $.data.id }
          assert:
            - "Jurisdiction.${jur}.interest_rate_monthly_bps == 100"
            - "Jurisdiction.${jur}.refund_interest_monthly_bps == 50"
            - "Jurisdiction.${jur}.lien_threshold_cents == 500000"
            - "Jurisdiction.${jur}.exemption_min_stay_nights == 30"

      - name: return_gross_receipts_computed_from_lines
        claim_type: Computed Fields
        grounds: [entities.TaxReturn.fields.gross_receipts_cents, entities.TaxReturn.fields.line_items]
        distinguishing_aspect: "gross_receipts_cents is computed as the sum of line_items gross (250000+750000=1000000), not client-set."
        test_recipe:
          setup: ["Active operator with two properties"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J2", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op G", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "PA", address: "1 St" }
              as: TaxAdmin
              captures: { pa: $.data.id }
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "PB", address: "2 St" }
              as: TaxAdmin
              captures: { pb: $.data.id }
          trigger:
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${pa}", gross_receipts_cents: 250000 }, { property_id: "${pb}", gross_receipts_cents: 750000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
          assert:
            - "TaxReturn.${ret}.gross_receipts_cents == 1000000"
            - "TaxReturn.${ret}.filing_status == DRAFT"
            - "TaxReturn.${ret}.settlement_status == UNPAID"

      - name: operator_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /operators/{unknown uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /operators/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: TaxAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: operator_create_missing_required_filing_frequency
        claim_type: Required Fields
        grounds: [entities.Operator.fields.filing_frequency, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /operators without filing_frequency returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A jurisdiction exists"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J3", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
          trigger:
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "NoFreq" }
              as: TaxAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

  - section: state_machines
    instances:
      - name: verify_after_reject_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ExemptionClaim.CLAIMED_to_VERIFIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Verifying an already REJECTED exemption returns ERR_INVALID_STATE; terminal REJECTED is locked."
        test_recipe:
          setup: ["Active operator; DRAFT return; one exemption REJECTED"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J4", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op R", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "3 St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /exemptions"
              payload: { tax_return_id: "${ret}", exemption_type: "GOVERNMENT", guest_ref: "G-1", amount_cents: 100000 }
              as: TaxAdmin
              captures: { ex: $.data.id }
            - call: "POST /exemptions/${ex}/reject"
              payload: {}
              as: TaxAdmin
          trigger:
            - call: "POST /exemptions/${ex}/verify"
              payload: {}
              as: TaxAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "ExemptionClaim.${ex}.status == REJECTED"

      - name: operator_activate_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Operator.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Activating an already ACTIVE operator returns ERR_INVALID_STATE (transitions are not idempotent)."
        test_recipe:
          setup: ["Operator activated once"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J5", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op S", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
          trigger:
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: amend_return_under_issued_assessment_rejected
        claim_type: guarded_transition
        grounds: [state_machines.TaxReturn.FILED_to_AMENDED, "errors[ERR_RETURN_UNDER_ASSESSMENT]"]
        distinguishing_aspect: "Amending a return whose period is covered by an ISSUED assessment returns ERR_RETURN_UNDER_ASSESSMENT."
        test_recipe:
          setup: ["Active operator; FILED return period 2026-04; audit ISSUED an assessment covering that period"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J6", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op T", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "4 St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
            - call: "POST /audits"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z" }
              as: Auditor
              captures: { aud: $.data.id }
            - call: "POST /audits/${aud}/begin-fieldwork"
              payload: {}
              as: Auditor
            - call: "POST /audits/${aud}/assessments"
              payload: { audited_taxable_cents: 2000000, classification: "NEGLIGENCE" }
              as: Auditor
              captures: { asmt: $.data.id }
            - call: "POST /assessments/${asmt}/issue"
              payload: {}
              as: TaxAdmin
          trigger:
            - call: "POST /returns/${ret}/amend"
              payload: { line_items: [ { property_id: "${prop}", gross_receipts_cents: 900000 } ] }
              as: Operator
              as_user_id: "${op}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RETURN_UNDER_ASSESSMENT"
            - "TaxReturn.${ret}.filing_status == FILED"

      - name: appeal_full_cycle_reduced_decision
        claim_type: cyclic
        grounds: [state_machines.Appeal.INFO_REQUESTED_to_UNDER_REVIEW, state_machines.Appeal.UNDER_REVIEW_to_DECIDED, state_machines.Assessment.APPEALED_to_FINAL]
        distinguishing_aspect: "Appeal loops UNDER_REVIEW->INFO_REQUESTED->UNDER_REVIEW (round_count 1) then DECIDED/REDUCED drives Assessment to FINAL at reduced total."
        test_recipe:
          setup: ["Active operator; ISSUED assessment total 660000; appeal SUBMITTED then one info round"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J7", tax_rate_bps: 1200, lien_threshold_cents: 500000 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op U", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "5 St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
            - call: "POST /audits"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z" }
              as: Auditor
              captures: { aud: $.data.id }
            - call: "POST /audits/${aud}/begin-fieldwork"
              payload: {}
              as: Auditor
            - call: "POST /audits/${aud}/assessments"
              payload: { audited_taxable_cents: 6000000, classification: "NEGLIGENCE" }
              as: Auditor
              captures: { asmt: $.data.id }
            - call: "POST /assessments/${asmt}/issue"
              payload: {}
              as: TaxAdmin
            - call: "POST /assessments/${asmt}/appeals"
              payload: { grounds: "overstated" }
              as: Operator
              as_user_id: "${op}"
              captures: { ap: $.data.id }
            - call: "POST /appeals/${ap}/begin-review"
              payload: {}
              as: TaxAdmin
            - call: "POST /appeals/${ap}/request-info"
              payload: {}
              as: TaxAdmin
            - call: "POST /appeals/${ap}/provide-info"
              payload: {}
              as: Operator
              as_user_id: "${op}"
          trigger:
            - call: "POST /appeals/${ap}/decide"
              payload: { decision: "REDUCED", reduced_total_cents: 400000 }
              as: TaxAdmin
          assert:
            - "Appeal.${ap}.status == DECIDED"
            - "Appeal.${ap}.round_count == 1"
            - "Assessment.${asmt}.status == FINAL"

  - section: endpoints
    instances:
      - name: list_returns_for_operator_fk_reverse
        claim_type: Listing
        grounds: [endpoints, entities.TaxReturn.fields.operator_id]
        distinguishing_aspect: "GET /operators/{id}/returns returns the operator's returns as an array (FK reverse-reachability)."
        test_recipe:
          setup: ["Active operator with one DRAFT return"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J8", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op V", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "6 St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
          trigger:
            - call: "GET /operators/${op}/returns"
              payload: {}
              as: Operator
              as_user_id: "${op}"
          assert:
            - "response.response_type == array"
            - "response.data length == 1"
            - "response.data[0].id == ${ret}"

      - name: list_ledger_entries_for_operator_fk_reverse
        claim_type: Listing
        grounds: [endpoints, entities.LedgerEntry.fields.operator_id]
        distinguishing_aspect: "GET /operators/{id}/ledger-entries returns the append-only ledger; after file+clear it holds TAX_DUE and REMITTANCE rows summing to 0."
        test_recipe:
          setup: ["Active operator; return FILED tax 120000; remittance 120000 CLEARED"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J9", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op W", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "7 St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
            - call: "POST /remittances"
              payload: { tax_return_id: "${ret}", remitter: "OPERATOR", amount_cents: 120000 }
              as: TaxAdmin
              captures: { rem: $.data.id }
            - call: "POST /remittances/${rem}/clear"
              payload: {}
              as: TaxAdmin
          trigger:
            - call: "GET /operators/${op}/ledger-entries"
              payload: {}
              as: TaxAdmin
          assert:
            - "response.response_type == array"
            - "response.data length == 2"
            - "Operator.${op}.account_balance_cents == 0"

      - name: list_operators_pagination
        claim_type: Listing
        grounds: [endpoints, response_envelope.pagination_fields]
        distinguishing_aspect: "GET /operators honors limit/offset and returns pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two operators registered in the jurisdiction"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J10", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op A", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op1: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op B", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op2: $.data.id }
          trigger:
            - call: "GET /operators"
              payload: { jurisdiction_id: "${jur}", limit: 1, offset: 0 }
              as: TaxAdmin
          assert:
            - "response.response_type == array"
            - "response.data length == 1"
            - "response.meta has total_count == 2"
            - "response.meta has_more == true"

  - section: rbac
    instances:
      - name: auditor_cannot_issue_assessment_forbidden
        claim_type: role_denied
        grounds: [roles.Auditor, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Auditor calling POST /assessments/{id}/issue returns ERR_FORBIDDEN — four-eyes: issuance is TaxAdmin-only."
        test_recipe:
          setup: ["Active operator; PROPOSED assessment from an audit"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J11", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op X2", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "8 St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
            - call: "POST /audits"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z" }
              as: Auditor
              captures: { aud: $.data.id }
            - call: "POST /audits/${aud}/begin-fieldwork"
              payload: {}
              as: Auditor
            - call: "POST /audits/${aud}/assessments"
              payload: { audited_taxable_cents: 2000000, classification: "NEGLIGENCE" }
              as: Auditor
              captures: { asmt: $.data.id }
          trigger:
            - call: "POST /assessments/${asmt}/issue"
              payload: {}
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN"
            - "Assessment.${asmt}.status == PROPOSED"

      - name: operator_role_forbidden_on_register_operator
        claim_type: role_denied
        grounds: [roles.Operator, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Operator role calling POST /operators (TaxAdmin-only) returns ERR_FORBIDDEN."
        test_recipe:
          setup: ["A jurisdiction and an activated operator exist"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J12", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op Y2", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
          trigger:
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Sneaky", filing_frequency: "MONTHLY" }
              as: Operator
              as_user_id: "${op}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: unauthenticated_missing_headers_rejected
        claim_type: unauthenticated
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no/invalid user-context headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /jurisdictions"
              payload: { name: "J13", tax_rate_bps: 1200 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  - section: validations
    instances:
      - name: exemptions_exceeding_gross_rejected_on_file
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_RECEIPTS_MISMATCH]"]
        distinguishing_aspect: "Filing a return whose honored exemptions (1,200,000) exceed gross (1,000,000) returns ERR_RECEIPTS_MISMATCH."
        test_recipe:
          setup: ["Active operator; DRAFT return gross 1,000,000; one GOV exemption 1,200,000"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J14", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op Z2", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "9 St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /exemptions"
              payload: { tax_return_id: "${ret}", exemption_type: "GOVERNMENT", guest_ref: "G-1", amount_cents: 1200000 }
              as: TaxAdmin
              captures: { ex: $.data.id }
          trigger:
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RECEIPTS_MISMATCH"
            - "TaxReturn.${ret}.filing_status == DRAFT"

      - name: platform_not_registered_blocks_agreement_activate
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_PLATFORM_NOT_REGISTERED]"]
        distinguishing_aspect: "Activating an OTA agreement on an unregistered platform returns ERR_PLATFORM_NOT_REGISTERED."
        test_recipe:
          setup: ["Active operator; unregistered OTA platform; PROPOSED agreement"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J15", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op AA", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /ota-platforms"
              payload: { name: "Unreg", registered: false }
              as: TaxAdmin
              captures: { plat: $.data.id }
            - call: "POST /ota-agreements"
              payload: { operator_id: "${op}", platform_id: "${plat}", collection_method: "NET", effective_date: "2026-01-01T00:00:00Z", end_date: "2026-04-01T00:00:00Z" }
              as: TaxAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /ota-agreements/${ag}/activate"
              payload: {}
              as: TaxAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PLATFORM_NOT_REGISTERED"
            - "OTAAgreement.${ag}.status == PROPOSED"

      - name: refund_exceeds_overpayment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_REFUND_EXCEEDS_OVERPAYMENT]"]
        distinguishing_aspect: "Approving a refund of 100000 when the operator holds no overpayment credit (balance 0) returns ERR_REFUND_EXCEEDS_OVERPAYMENT."
        test_recipe:
          setup: ["Active operator, balance 0; a REQUESTED refund claim of 100000"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J16", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op BB", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /refund-claims"
              payload: { operator_id: "${op}", reason: "OVERPAYMENT", principal_cents: 100000, overpayment_date: "2026-04-01T00:00:00Z" }
              as: TaxAdmin
              captures: { rc: $.data.id }
          trigger:
            - call: "POST /refund-claims/${rc}/approve"
              payload: {}
              as: TaxAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_REFUND_EXCEEDS_OVERPAYMENT"
            - "RefundClaim.${rc}.status == REQUESTED"

      - name: propose_assessment_no_returns_in_period
        claim_type: violation_to_error
        grounds: [state_machines.Audit.FIELDWORK_to_PROPOSED, "errors[ERR_NO_RETURNS_IN_PERIOD]"]
        distinguishing_aspect: "Proposing an assessment when the audit period has no FILED/AMENDED returns returns ERR_NO_RETURNS_IN_PERIOD."
        test_recipe:
          setup: ["Active operator with no returns; audit OPENED->FIELDWORK"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J17", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op CC", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /audits"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z" }
              as: Auditor
              captures: { aud: $.data.id }
            - call: "POST /audits/${aud}/begin-fieldwork"
              payload: {}
              as: Auditor
          trigger:
            - call: "POST /audits/${aud}/assessments"
              payload: { audited_taxable_cents: 500000, classification: "NEGLIGENCE" }
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NO_RETURNS_IN_PERIOD"
            - "Audit.${aud}.status == FIELDWORK"

      - name: close_operator_with_open_audit_rejected
        claim_type: violation_to_error
        grounds: [state_machines.Operator.ACTIVE_to_CLOSED, "errors[ERR_AUDIT_IN_PROGRESS]"]
        distinguishing_aspect: "Closing an operator (balance 0) while an audit is OPENED returns ERR_AUDIT_IN_PROGRESS."
        test_recipe:
          setup: ["Active operator, balance 0; an OPENED audit"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J18", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op DD", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /audits"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z" }
              as: Auditor
              captures: { aud: $.data.id }
          trigger:
            - call: "POST /operators/${op}/close"
              payload: {}
              as: TaxAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_AUDIT_IN_PROGRESS"
            - "Operator.${op}.status == ACTIVE"

  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_operator_version_on_lien_record
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[lien-record-stale-operator]", "errors[ERR_STALE_OPERATOR_VERSION]"]
        distinguishing_aspect: "Recording a lien with an operator version captured before an intervening CLEARED remittance bumped it returns ERR_STALE_OPERATOR_VERSION (412)."
        test_recipe:
          setup:
            - "DELINQUENT operator: past-due FILED return gross 5,000,000 (tax 600,000, balance 600,000)"
            - "Operator version captured; then a partial remittance of 50,000 CLEARED (balance 550,000, still DELINQUENT, version advanced)"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J19", tax_rate_bps: 1200, lien_threshold_cents: 500000 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op EE", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "10 St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 5000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
            - call: "GET /operators/${op}"
              payload: {}
              as: TaxAdmin
              captures: { op_v: $.data.version }
            - call: "POST /remittances"
              payload: { tax_return_id: "${ret}", remitter: "OPERATOR", amount_cents: 50000 }
              as: TaxAdmin
              captures: { rem: $.data.id }
            - call: "POST /remittances/${rem}/clear"
              payload: {}
              as: TaxAdmin
          trigger:
            - call: "POST /operators/${op}/liens"
              payload: { expected_operator_version: "${op_v}" }
              as: TaxAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_STALE_OPERATOR_VERSION"

      - name: assessment_abated_reverses_ledger_on_appeal
        claim_type: cascading_side_effects
        grounds: [state_machines.Assessment.APPEALED_to_ABATED, calculations.operator_account_balance]
        distinguishing_aspect: "An appeal DECIDED/ABATED posts an ABATEMENT ledger entry reversing the ASSESSMENT debit, returning account_balance to 0 (no drift)."
        test_recipe:
          setup: ["ISSUED assessment total 660000 (operator DELINQUENT); appeal SUBMITTED and under review"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "J20", tax_rate_bps: 1200, lien_threshold_cents: 500000 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op FF", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "11 St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
            - call: "POST /remittances"
              payload: { tax_return_id: "${ret}", remitter: "OPERATOR", amount_cents: 120000 }
              as: TaxAdmin
              captures: { rem: $.data.id }
            - call: "POST /remittances/${rem}/clear"
              payload: {}
              as: TaxAdmin
            - call: "POST /audits"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z" }
              as: Auditor
              captures: { aud: $.data.id }
            - call: "POST /audits/${aud}/begin-fieldwork"
              payload: {}
              as: Auditor
            - call: "POST /audits/${aud}/assessments"
              payload: { audited_taxable_cents: 6000000, classification: "NEGLIGENCE" }
              as: Auditor
              captures: { asmt: $.data.id }
            - call: "POST /assessments/${asmt}/issue"
              payload: {}
              as: TaxAdmin
            - call: "POST /assessments/${asmt}/appeals"
              payload: { grounds: "not liable" }
              as: Operator
              as_user_id: "${op}"
              captures: { ap: $.data.id }
            - call: "POST /appeals/${ap}/begin-review"
              payload: {}
              as: TaxAdmin
          trigger:
            - call: "POST /appeals/${ap}/decide"
              payload: { decision: "ABATED" }
              as: TaxAdmin
          assert:
            - "Assessment.${asmt}.status == ABATED"
            - "Operator.${op}.account_balance_cents == 0"
            - "Operator.${op}.status == ACTIVE"

