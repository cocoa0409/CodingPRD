              payload: { engagement_id: "${eng}", party_type: "POA", display_name: "Ruth Whitfield", email: "ruth@example.com" }
              as: MOVE_MANAGER
              captures: { ppoa: "$.data.id" }
            - call: "POST /authority-records"
              payload: { engagement_id: "${eng}", holder_party_id: "${ppoa}", authority_scope: "FULL", effective_from_utc: "2026-05-01T00:00:00.000Z", effective_to_utc: "2026-12-31T00:00:00.000Z", approval_ceiling_cents: 400000 }
              as: MOVE_MANAGER
              captures: { auth: "$.data.id" }
            - call: "POST /authority-records/${auth}/activate"
              payload: {}
              as: MOVE_MANAGER
          trigger:
            - call: "POST /authority-records/${auth}/suspend"
              payload: { reason: "Family dispute over the POA" }
              as: MOVE_MANAGER
            - call: "POST /authority-records/${auth}/reinstate"
              payload: {}
              as: MOVE_MANAGER
            - call: "POST /authority-records/${auth}/revoke"
              payload: { reason: "Client revoked the POA" }
              as: CLIENT
              as_user_id: "${cl}"
