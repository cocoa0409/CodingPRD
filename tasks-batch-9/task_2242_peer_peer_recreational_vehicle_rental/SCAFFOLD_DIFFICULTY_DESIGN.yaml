      - name: date_collision_409_outranks_plan_class_ineligibility_422
        grounds: >-
          §1.4 priority 24 ERR_LISTING_DATES_UNAVAILABLE (409) versus priority 34
          ERR_PLAN_CLASS_NOT_ELIGIBLE (422), with the half-open interval plus
          one-night turnaround buffer of priority 24.
        distinguishing_aspect: >-
          Both violated rules sit far apart in the ordering (24 versus 34) and the
          winning one is a temporal-overlap rule whose own boundary is subtle: the
          live booking occupies [2026-08-29, 2026-09-02) and the buffer pushes the
          next legal start to 2026-09-03, so a 2026-09-02 start still collides.
          The request also names a plan whose eligible_vehicle_classes omit
          TRAVEL_TRAILER. The correct answer is 409 ERR_LISTING_DATES_UNAVAILABLE;
          moving the start one day later to 2026-09-03 clears priority 24 and
          exposes 422 ERR_PLAN_CLASS_NOT_ELIGIBLE from the very same plan choice.
        test_recipe:
          setup: >-
            Canonical marketplace with booking B1 CONFIRMED over
            2026-08-29..2026-09-02, plus a CLASS_A-only protection plan.
          setup_api_calls:
            - *c_clock
