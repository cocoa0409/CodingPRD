      - name: strike_count_ignores_cancel_cascade_rejections_and_lands_exactly_on_probation
        claim_type: input_set_filtering
        grounds:
          - calculations.supplier_qualification_posture
          - calculations.supplier_qualification_posture.input_set
          - calculations.supplier_qualification_posture.constants.PROBATION_STRIKES
          - state_machines.FiberReceipt.SAMPLED_to_REJECTED
          - endpoints.POST_fiber_purchase_orders_id_cancel
        distinguishing_aspect: "Three FiberReceipt rows of this supplier end in status REJECTED, but the one flipped by the purchase-order cancel cascade carries dispositioned_by_user_id == null and must NOT be counted: contamination_strike_count is 2, not 3. Two strikes hits PROBATION_STRIKES on the inclusive boundary, so qualification_status is PROBATION (not QUALIFIED, and not SUSPENDED which needs 4) and probation_entered_at is stamped with the logical clock. Because a REJECT creates no inventory lot and adds no tonnage, received_net_tons stays 0.00 on both orders."
        test_recipe:
          setup: ["Supplier Delta Fiber Recovery with two CONFIRMED purchase orders on OCC_11 (max_contamination_pct 3.00, no downgrade target). PO-1 (400.00 tons) carries two SAMPLED receipts at 5.00% weighted contamination, both sampled by lab-a; one of them has already been REJECTED by lab-b, giving the supplier its first strike. PO-2 (100.00 tons) carried a third SAMPLED receipt and was then cancelled, which flipped that receipt to REJECTED with dispositioned_by_user_id left null."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MillPlanner
              as_user_id: "planner-1"
