            - { call: "POST /royalty-agreements", payload: { site_id: "${site}", landowner_name: "LW", base_rate_per_ton: 0.25, tier_threshold_tons: 50, tier_rate_per_ton: 0.40, effective_from: "2026-01-01" }, as: FinanceClerk, captures: { agrA: $.data.id } }
          trigger:
            - { call: "POST /royalty-agreements/${agrA}/amendments", payload: { base_rate_per_ton: 0.30, tier_threshold_tons: 60, tier_rate_per_ton: 0.45, effective_from: "2026-07-01" }, as: FinanceClerk, as_user_id: "fc-1", captures: { agrB: $.data.id } }
            - { call: "POST /royalty-agreements/${agrA}/amendments", payload: { base_rate_per_ton: 0.35, tier_threshold_tons: 70, tier_rate_per_ton: 0.50, effective_from: "2026-08-01" }, as: FinanceClerk, as_user_id: "fc-1", captures: { err: $.data.error_id } }
          assert:
            - "RoyaltyAgreement.${agrB}.status == ACTIVE with supersedes_agreement_id == ${agrA} and base_rate_per_ton == 0.30"
            - "RoyaltyAgreement.${agrA}.status == SUPERSEDED with effective_to == 2026-07-01 and version incremented to 2"
            - "second amendment against SUPERSEDED A: error_id == ERR_INVALID_STATE (http 409)"
            - "GET /royalty-agreements?supersedes_agreement_id=${agrA} returns exactly [${agrB}]"

      - name: stockpile_close_not_empty_rejected
        claim_type: violation_to_error
        grounds: [state_machines.Stockpile, "errors[ERR_STOCKPILE_NOT_EMPTY]"]
        distinguishing_aspect: "Close requires on_hand == 0 AND reserved == 0; a pile holding 100 t fails with ERR_STOCKPILE_NOT_EMPTY."
        test_recipe:
          setup: ["site; spec; pile on_hand 100.0"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id, pile_v: $.data.version } }
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 100.0, reason: "opening survey", expected_stockpile_version: "${pile_v}" }, as: SiteManager }
          trigger:
            - { call: "POST /stockpiles/${pile}/close", payload: {}, as: SiteManager, as_user_id: "sm-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_STOCKPILE_NOT_EMPTY (http 409); Stockpile.${pile}.status stays OPEN"

      - name: bond_release_coverage_floor_and_exact_boundary
        claim_type: boundary_edge
        grounds: [state_machines.ReclamationBond, "errors[ERR_BOND_BELOW_REQUIRED]"]
        distinguishing_aspect: "Coverage check is >= : releasing 22001 against required 78000 fails (77999 < 78000); releasing exactly 22000 leaves coverage == required and succeeds."
        test_recipe:
          setup: ["site rate 12000; bond 100000 POSTED; B1 (1400, 5.0 ac) MINED_OUT; B2 (1380, 3.0 ac) RECLAMATION_IN_PROGRESS -> bond_required 78000.00"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 100000 }, as: FinanceClerk, captures: { bond: $.data.id, bond_v: $.data.version } }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B1", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { b1: $.data.id } }
            - { call: "POST /benches/${b1}/release", payload: {}, as: SiteManager }
            - { call: "POST /benches/${b1}/mark-mined-out", payload: {}, as: SiteManager }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B2", elevation_ft: 1380, acreage: 3.0 }, as: SiteManager, captures: { b2: $.data.id } }
            - { call: "POST /benches/${b2}/release", payload: {}, as: SiteManager }
            - { call: "POST /benches/${b2}/mark-mined-out", payload: {}, as: SiteManager }
            - { call: "POST /benches/${b2}/start-reclamation", payload: {}, as: SiteManager }
          trigger:
            - { call: "POST /reclamation-bonds/${bond}/release", payload: { release_amount_usd: 22001, expected_reclamation_bond_version: "${bond_v}" }, as: FinanceClerk, as_user_id: "fc-1", captures: { err: $.data.error_id } }
            - { call: "POST /reclamation-bonds/${bond}/release", payload: { release_amount_usd: 22000, expected_reclamation_bond_version: "${bond_v}" }, as: FinanceClerk, as_user_id: "fc-1" }
          assert:
            - "release 22001: error_id == ERR_BOND_BELOW_REQUIRED (http 409) — coverage 77999 < 78000"
            - "release 22000 succeeds: coverage exactly 78000 >= 78000 (inclusive floor); ReclamationBond.${bond}.status == PARTIALLY_RELEASED, released_usd == 22000"
            - "the rejected first attempt did not consume the version: the second call with the same ${bond_v} succeeded"

      - name: spec_retired_blocks_order_create
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SPEC_RETIRED]"]
        distinguishing_aspect: "Creating an order against a RETIRED spec fails; existing quoted orders are unaffected."
        test_recipe:
          setup: ["site; spec A57 retired; zone active"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /product-specs/${spec}/retire", payload: {}, as: QuarryAdmin }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
          trigger:
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 30 }, as: SalesAgent, as_user_id: "sa-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_SPEC_RETIRED (http 409); no order created"

      - name: zone_inactive_blocks_order_create
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_ZONE_INACTIVE]"]
        distinguishing_aspect: "Creating an order against an INACTIVE zone fails with ERR_ZONE_INACTIVE."
        test_recipe:
          setup: ["site; spec active; zone deactivated"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /freight-zones/${zone}/deactivate", payload: {}, as: QuarryAdmin }
          trigger:
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 30 }, as: SalesAgent, as_user_id: "sa-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_ZONE_INACTIVE (http 409); no order created"

      - name: permit_acreage_cap_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_PERMIT_ACREAGE_EXCEEDED]"]
        distinguishing_aspect: "Releasing B2 (4.0 ac) would push disturbance to 9.0 > permitted 8.0 ac — the permit cap (a regulatory check at priority 7) rejects it while posture is OPERATING."
        test_recipe:
          setup: ["site permitted 8.0 ac, rate 12000; bond 200000 posted (posture OPERATING); B1 (1500 ft, 5.0 ac) RELEASED; B2 (1600 ft, 4.0 ac) PLANNED"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 8.0, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 200000 }, as: FinanceClerk }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B1", elevation_ft: 1500, acreage: 5.0 }, as: SiteManager, captures: { b1: $.data.id } }
            - { call: "POST /benches/${b1}/release", payload: {}, as: SiteManager }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B2", elevation_ft: 1600, acreage: 4.0 }, as: SiteManager, captures: { b2: $.data.id } }
          trigger:
            - { call: "POST /benches/${b2}/release", payload: {}, as: SiteManager, as_user_id: "sm-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_PERMIT_ACREAGE_EXCEEDED (http 409): 5.0 + 4.0 = 9.0 > 8.0 permitted"
            - "Bench.${b2}.status stays PLANNED; disturbed_acres stays 5.0"

      - name: approve_requires_bench_released
        claim_type: cross_entity_validation
        grounds: [state_machines.ShotPlan.SUBMITTED_to_APPROVED, "errors[ERR_BENCH_NOT_RELEASED]"]
        distinguishing_aspect: "Approval is gated on the BENCH's state (cross-entity): a plan on a PLANNED bench fails with ERR_BENCH_NOT_RELEASED even though the plan itself is correctly SUBMITTED."
        test_recipe:
          setup: ["site; bench PLANNED (never released); plan SUBMITTED by bf-1"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B1", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id } }
            - { call: "POST /shot-plans", payload: { bench_id: "${bench}", hole_count: 20, burden_ft: 8, spacing_ft: 10, hole_depth_ft: 40, explosive_per_hole_lbs: 50 }, as: BlastForeman, as_user_id: "bf-1", captures: { plan: $.data.id } }
            - { call: "POST /shot-plans/${plan}/submit", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
          trigger:
            - { call: "POST /shot-plans/${plan}/approve", payload: {}, as: SiteManager, as_user_id: "sm-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_BENCH_NOT_RELEASED (http 409); ShotPlan.${plan}.status stays SUBMITTED"

      - name: adjustment_over_capacity_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_STOCKPILE_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "A positive adjustment that would push on_hand_tons (4000.0) + delta (1500.0) = 5500.0 above capacity_tons 5000 is rejected; on_hand is unchanged."
        test_recipe:
          setup: ["site; spec; stockpile capacity 5000 with on_hand 4000.0 after a first adjustment"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id, pile_v: $.data.version } }
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 4000.0, reason: "opening survey", expected_stockpile_version: "${pile_v}" }, as: SiteManager, captures: { pile_v2: $.data.version } }
          trigger:
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 1500.0, reason: "survey overcredited", expected_stockpile_version: "${pile_v2}" }, as: SiteManager, as_user_id: "sm-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_STOCKPILE_CAPACITY_EXCEEDED (http 409): 4000.0 + 1500.0 > 5000"
            - "Stockpile.${pile}.on_hand_tons stays 4000.0 and version stays 2 (rejection mutates nothing)"

      - name: run_void_reversal_blocked_after_shipment
        claim_type: compensating_invariant_guard
        grounds: [state_machines.PlantRun, "errors[ERR_REVERSAL_BLOCKED]"]
        distinguishing_aspect: "A run's void is refused once part of its credit has shipped out: crediting 620 t then selling 100 t leaves on_hand 520 < 620, so void fails with ERR_REVERSAL_BLOCKED."
        test_recipe:
          setup:
            - "site OPERATING; fired shot; certified belt scale; pile capacity 10000; run COMPLETED crediting 620.0"
            - "order qty 200 CONFIRMED against the pile; one ticket net 100.000 COMPLETED (gross 228000, tare 28000, max_payload 250000)"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /reclamation-bonds", payload: { site_id: "${site}", surety_name: "SuretyCo", amount_usd: 100000 }, as: FinanceClerk }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B1", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager, captures: { bench: $.data.id } }
            - { call: "POST /benches/${bench}/release", payload: {}, as: SiteManager }
            - { call: "POST /shot-plans", payload: { bench_id: "${bench}", hole_count: 20, burden_ft: 8, spacing_ft: 10, hole_depth_ft: 40, explosive_per_hole_lbs: 50 }, as: BlastForeman, as_user_id: "bf-1", captures: { plan: $.data.id } }
            - { call: "POST /shot-plans/${plan}/submit", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/approve", payload: {}, as: SiteManager, as_user_id: "sm-1" }
            - { call: "POST /training-records", payload: { miner_name: "Blaster One", miner_user_id: "bf-1", course_type: "TASK_TRAINING", completed_on: "2026-01-15" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:00:00Z" }, as: QuarryAdmin }
            - { call: "POST /shot-plans/${plan}/start-drilling", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/complete-drilling", payload: { drilled_hole_count: 20 }, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/load", payload: { loaded_explosive_lbs: 1000 }, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "POST /shot-plans/${plan}/fire", payload: {}, as: BlastForeman, as_user_id: "bf-1" }
            - { call: "GET /muckpiles", payload: { shot_plan_id: "${plan}" }, as: PlantOperator, as_user_id: "po-1", captures: { mp: "$.data[0].id" } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 10000 }, as: SiteManager, captures: { pile: $.data.id } }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "BELT-01", scale_type: "BELT" }, as: QuarryAdmin, captures: { belt: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${belt}", calibrated_on: "2026-02-02", as_found_error_pct: 0.10, as_left_error_pct: 0.05 }, as: QuarryAdmin }
            - { call: "POST /plant-runs", payload: { site_id: "${site}", muckpile_id: "${mp}", belt_scale_id: "${belt}", circuit_line: "PRIMARY" }, as: PlantOperator, as_user_id: "po-1", captures: { run: $.data.id } }
            - { call: "POST /plant-runs/${run}/start", payload: {}, as: PlantOperator, as_user_id: "po-1" }
            - { call: "POST /plant-runs/${run}/complete", payload: { input_tons: 620.0, outputs: [ { stockpile_id: "${pile}", product_spec_id: "${spec}", tons: 620.0 } ] }, as: PlantOperator, as_user_id: "po-1" }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /royalty-agreements", payload: { site_id: "${site}", landowner_name: "LW", base_rate_per_ton: 0.25, tier_threshold_tons: 50, tier_rate_per_ton: 0.40, effective_from: "2026-01-01" }, as: FinanceClerk }
            - { call: "POST /scales", payload: { site_id: "${site}", scale_code: "TRUCK-01", scale_type: "TRUCK" }, as: QuarryAdmin, captures: { scale: $.data.id } }
            - { call: "POST /scale-calibrations", payload: { scale_id: "${scale}", calibrated_on: "2026-02-02", as_found_error_pct: 0.10, as_left_error_pct: 0.10 }, as: QuarryAdmin }
            - { call: "POST /sales-orders", payload: { site_id: "${site}", product_spec_id: "${spec}", freight_zone_id: "${zone}", customer_name: "ACME", quantity_tons: 200 }, as: SalesAgent, as_user_id: "sa-1", captures: { ord: $.data.id } }
            - { call: "POST /sales-orders/${ord}/confirm", payload: {}, as: SalesAgent, as_user_id: "sa-1" }
            - { call: "POST /queue-entries", payload: { site_id: "${site}", truck_id: "TRK-1", priority_class: "CONTRACT", certified_tare_lbs: 28000, max_payload_lbs: 250000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { qe: $.data.id } }
            - { call: "POST /queue-entries/call-next", payload: { site_id: "${site}" }, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets", payload: { queue_entry_id: "${qe}", sales_order_id: "${ord}", scale_id: "${scale}", gross_lbs: 228000 }, as: ScaleHouseOperator, as_user_id: "sh-1", captures: { tkt: $.data.id } }
            - { call: "POST /queue-entries/${qe}/begin-scale-out", payload: {}, as: ScaleHouseOperator, as_user_id: "sh-1" }
            - { call: "POST /scale-tickets/${tkt}/weigh-out", payload: { tare_lbs: 28000 }, as: ScaleHouseOperator, as_user_id: "sh-1" }
          trigger:
            - { call: "POST /plant-runs/${run}/void", payload: {}, as: PlantOperator, as_user_id: "po-1", captures: { err: $.data.error_id } }
          assert:
            - "trigger error_id == ERR_REVERSAL_BLOCKED (http 409): pile on_hand 520.0 < credited 620.0"
            - "PlantRun.${run}.production_status stays COMPLETED; pile and muckpile unchanged"

  # ---------------------------------------------------------------------------
  # Section 5: Endpoints (envelope, pagination, filters, computed reads)
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: pagination_defaults_and_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "A bare list call applies the fixed envelope: limit defaults to 10, offset 0, and meta carries api_request_id; single-site list reports total_count 1, has_more false."
        test_recipe:
          setup: ["one site"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin }
          trigger:
            - { call: "GET /sites", payload: {}, as: SiteManager, as_user_id: "sm-1" }
          assert:
            - "response envelope: meta.api_request_id present; response_type == array"
            - "pagination: limit == 10, offset == 0, total_count == 1, has_more == false"

      - name: pagination_limit_offset_with_filter
        claim_type: listing
        grounds: [response_envelope, entities.Bench.fields.site_id]
        distinguishing_aspect: "limit/offset window the filtered list deterministically: 3 benches, limit 2 -> 2 items with has_more true; offset 2 -> the final item with has_more false; total_count always 3."
        test_recipe:
          setup: ["site with 3 benches"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B1", elevation_ft: 1400, acreage: 5.0 }, as: SiteManager }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B2", elevation_ft: 1380, acreage: 3.0 }, as: SiteManager }
            - { call: "POST /benches", payload: { site_id: "${site}", bench_label: "B3", elevation_ft: 1360, acreage: 2.0 }, as: SiteManager }
          trigger:
            - { call: "GET /benches", payload: { site_id: "${site}", limit: 2 }, as: SiteManager, as_user_id: "sm-1" }
            - { call: "GET /benches", payload: { site_id: "${site}", limit: 2, offset: 2 }, as: SiteManager, as_user_id: "sm-1" }
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2 (offset 2): 1 item, total_count == 3, has_more == false"

      - name: filtered_list_reverse_reachability
        claim_type: retrieval
        grounds: [entities.ScaleTicket.fields.sales_order_id]
        distinguishing_aspect: "GET /scale-tickets?sales_order_id= returns exactly the tickets created against that order (FK reverse reachability through the filtered list)."
        test_recipe:
          setup: ["full ticketing chain; two COMPLETED tickets on order O, plus one ticket on a second order O2"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Quarry Q1", permitted_acres: 200, bond_rate_per_acre_usd: 12000 }, as: QuarryAdmin, captures: { site: $.data.id } }
            - { call: "POST /product-specs", payload: { spec_code: "A57", category: "COARSE", gradation_bands: [ { sieve: "1.5in", min_pct: 90, max_pct: 100 } ], base_price_per_ton: 12.50 }, as: QuarryAdmin, captures: { spec: $.data.id } }
            - { call: "POST /freight-zones", payload: { zone_code: "Z-LOCAL", distance_miles: 25, base_freight_per_ton: 6.00 }, as: QuarryAdmin, captures: { zone: $.data.id } }
            - { call: "POST /stockpiles", payload: { site_id: "${site}", product_spec_id: "${spec}", capacity_tons: 5000 }, as: SiteManager, captures: { pile: $.data.id, pile_v: $.data.version } }
            - { call: "POST /stockpiles/${pile}/adjustments", payload: { delta_tons: 500.0, reason: "opening survey", expected_stockpile_version: "${pile_v}" }, as: SiteManager }
