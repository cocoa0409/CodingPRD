            - call: "POST /optical/lens-options"
              payload: { code: "M160", category: "MATERIAL", base_price_cents: 6000, material_index: 1.60 }
              as: PlatformAdmin
              captures: { m160_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Wanda Rranty", email: "wanda@x.com", dob: "1990-09-09T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -2.00, od_cylinder: 0.00, os_sphere: -2.00, os_cylinder: 0.00, pd_mm: 62.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m160_id}", delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /optical/orders/${ord_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /optical/lab-orders?order_id=${ord_id}"
              as: LabTechnician
              captures: { lab_id: "$.data[0].id" }
            - call: "POST /optical/lab-orders/${lab_id}/start"
              payload: {}
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/qc"
              payload: { result: "PASS" }
              as: LabTechnician
            - call: "POST /optical/lab-orders/${lab_id}/ship"
              payload: {}
              as: LabTechnician
              captures: { lab_v_shipped: $.data.version }
          trigger:
            - call: "POST /optical/warranty-claims"
              payload: { lab_order_id: "${lab_id}", customer_id: "${cust_id}", reason: "CUSTOMER_DAMAGE", expected_lab_order_version: "${lab_v_shipped}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
            - call: "POST /optical/lab-orders/${lab_id}/deliver"
              payload: {}
              as: StoreAssociate
              captures: { lab_v_delivered: $.data.version }
            - call: "POST /optical/warranty-claims"
              payload: { lab_order_id: "${lab_id}", customer_id: "${cust_id}", reason: "CUSTOMER_DAMAGE", expected_lab_order_version: "${lab_v_delivered}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wc_id: $.data.id }
          assert:
            - "The pre-delivery attempt returns HTTP 409 and ${err} == ERR_LAB_ORDER_NOT_DELIVERED"
            - "The post-delivery attempt returns HTTP 201"
            - "LabOrder.${lab_id}.status == DELIVERED"
            - "LabOrder.${lab_id}.delivered_at == '2026-05-01T00:00:00.000Z'"
            - "WarrantyClaim.${wc_id}.status == OPEN"
            - "WarrantyClaim.${wc_id}.customer_charge_cents == 4500"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: exam_half_open_interval_with_trailing_buffer_on_store
        grounds:
          - overlap_rules[EXAM_CHAIR_OVERLAP]
          - validations[priority=69]
          - errors[ERR_EXAM_SLOT_CONFLICT]
          - entities.Store.fields.buffer_minutes
          - entities.Store.fields.exam_chairs
        distinguishing_aspect: |
          Interval semantics A — HALF-OPEN [start, end) plus a TRAILING buffer, on the Store
          resource: an existing 10:00-10:30 exam at a 1-chair store with buffer_minutes 10
          occupies [10:00, 10:40), so a 10:35 booking collides (gap 5 < 10) while a 10:40 booking
          does NOT (touching half-open intervals are disjoint — the exact opposite of the closed
          kit-window rule).
        test_recipe:
          setup:
            - "Store with exam_chairs 1 and buffer_minutes 10."
            - "Customer with a BOOKED exam from 2026-06-01T10:00:00Z to 2026-06-01T10:30:00Z."
          setup_api_calls:
            - call: "POST /optical/stores"
              payload: { name: "SoHo", exam_chairs: 1, buffer_minutes: 10, status: "OPEN" }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Eve Xam", email: "eve@x.com", dob: "1990-10-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/exam-appointments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T10:30:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt1_id: $.data.id }
          trigger:
            - call: "POST /optical/exam-appointments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", start_at: "2026-06-01T10:35:00Z", end_at: "2026-06-01T11:05:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
            - call: "POST /optical/exam-appointments"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", start_at: "2026-06-01T10:40:00Z", end_at: "2026-06-01T11:10:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt2_id: $.data.id }
          assert:
            - "The 10:35 booking returns HTTP 409 and ${err} == ERR_EXAM_SLOT_CONFLICT"
            - "The 10:40 booking returns HTTP 201"
            - "ExamAppointment.${appt2_id}.status == BOOKED"
            - "GET /optical/exam-appointments?store_id=${store_id} returns total_count == 2"

      - name: kit_window_closed_interval_touching_dates_collide_for_customer
        grounds:
          - overlap_rules[CUSTOMER_KIT_WINDOW_OVERLAP]
          - validations[priority=67]
          - errors[ERR_TRYON_WINDOW_CONFLICT]
          - entities.HomeTryOnKit.fields.ship_date
          - entities.HomeTryOnKit.fields.due_date
        distinguishing_aspect: |
          Interval semantics B — CLOSED [ship_date, due_date] with BOTH endpoints inclusive, on a
          different resource (the Customer's single kit slot, capacity 1): a new kit whose
          ship_date EQUALS the outstanding kit's due_date (2026-05-15) COLLIDES, whereas the
          Store exam rule lets identical touching boundaries through. Shifting one day to
          2026-05-16 clears it.
        test_recipe:
          setup:
            - "Frame with tryon_stock 2 (so the availability rule at priority 68 never fires and the window rule at 67 is what we observe)."
            - "Customer holds a REQUESTED kit over the closed window 2026-05-05..2026-05-15."
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-013", name: "Wright", brand: "WP", price_cents: 9500, tryon_stock: 2, min_pd_mm: 50.0, max_pd_mm: 75.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Tessa Touch", email: "tessa@x.com", dob: "1996-06-06T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/home-try-on-kits"
              payload: { customer_id: "${cust_id}", frame_ids: ["${frame_id}"], ship_date: "2026-05-05T00:00:00Z", due_date: "2026-05-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { kit_a: $.data.id }
          trigger:
            - call: "POST /optical/home-try-on-kits"
              payload: { customer_id: "${cust_id}", frame_ids: ["${frame_id}"], ship_date: "2026-05-15T00:00:00Z", due_date: "2026-05-25T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
            - call: "POST /optical/home-try-on-kits"
              payload: { customer_id: "${cust_id}", frame_ids: ["${frame_id}"], ship_date: "2026-05-16T00:00:00Z", due_date: "2026-05-26T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { kit_b: $.data.id }
          assert:
            - "The touching-endpoint kit returns HTTP 409 and ${err} == ERR_TRYON_WINDOW_CONFLICT"
            - "The 2026-05-16 kit returns HTTP 201"
            - "HomeTryOnKit.${kit_b}.status == REQUESTED"
            - "Frame.${frame_id}.tryon_available == 0"
            - "GET /optical/customers/${cust_id}/home-try-on-kits returns total_count == 2"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: frame_benefit_dollars_conserved_across_claim_supersede_and_cancel
        grounds:
          - invariants[INV_FRAME_BENEFIT_DOLLARS]
          - state_machines.InsuranceClaim.SUBMITTED_to_VOID
          - entities.InsuranceClaim.fields.reserved_frame_benefit_cents
          - entities.InsurancePolicy.fields.frame_allowance_remaining_cents
          - concurrency_rules[claim-create-stale-order]
        distinguishing_aspect: |
          Conserved quantity #1 — MONEY (frame-allowance dollars). Through a claim supersede and a
          subsequent order cancel, the identity
          policy.frame_allowance_remaining_cents + SUM(reserved_frame_benefit_cents over non-VOID
          claims) == policy.frame_allowance_cents == 15000 holds at every step: 0 + 15000 after
          supersede, 15000 + 0 after cancel. No drift.
        test_recipe:
          setup:
            - "IN_NETWORK policy with frame_allowance_cents 15000; customer enrolled."
            - "Order confirmed: the auto-minted claim reserved 15000c, driving frame_allowance_remaining_cents to 0."
          setup_api_calls:
            - call: "POST /optical/insurance-policies"
              payload: { member_id: "VSP-004", network: "IN_NETWORK", frame_allowance_cents: 15000, lens_copay_cents: 2500, annual_max_cents: 30000, plan_year_start: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /optical/frames"
              payload: { sku: "FRM-014", name: "Percey", brand: "WP", price_cents: 19500, tryon_stock: 1, min_pd_mm: 54.0, max_pd_mm: 70.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/lens-options"
              payload: { code: "M167", category: "MATERIAL", base_price_cents: 12000, material_index: 1.67 }
              as: PlatformAdmin
              captures: { m167_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Ivy Nvariant", email: "ivy@x.com", dob: "1990-11-11T00:00:00Z", insurance_policy_id: "${pol_id}" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/prescriptions"
              payload: { customer_id: "${cust_id}", od_sphere: -5.50, od_cylinder: -1.00, os_sphere: -5.00, os_cylinder: 0.00, pd_mm: 63.0, issued_at: "2026-04-01T00:00:00Z", expires_at: "2027-04-01T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /optical/prescriptions/${rx_id}/verify"
              payload: { decision: "VERIFIED" }
              as: OpticianVerifier
            - call: "POST /optical/orders"
              payload: { customer_id: "${cust_id}", prescription_id: "${rx_id}", frame_id: "${frame_id}", material_option_id: "${m167_id}", delivery_method: "SHIP" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /optical/orders/${ord_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v: $.data.version }
            - call: "GET /optical/insurance-claims?order_id=${ord_id}"
              as: BenefitsAdmin
              captures: { claim_old: "$.data[0].id" }
          trigger:
            - call: "POST /optical/insurance-claims"
              payload: { order_id: "${ord_id}", service_lines: [{ code: "92004", billed_cents: 12000 }], expected_order_version: "${ord_v}" }
              as: BenefitsAdmin
              captures: { claim_new: $.data.id }
            - call: "POST /optical/orders/${ord_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "InsuranceClaim.${claim_old}.status == VOID"
            - "InsuranceClaim.${claim_old}.reserved_frame_benefit_cents == 15000"
            - "InsuranceClaim.${claim_new}.reserved_frame_benefit_cents == 15000"
            - "InsuranceClaim.${claim_new}.status == VOID (after the cancel)"
            - "InsurancePolicy.${pol_id}.frame_allowance_remaining_cents == 15000"
            - "InsurancePolicy.${pol_id}.frame_allowance_cents == 15000"
            - "Order.${ord_id}.active_claim_id == null"

      - name: tryon_sample_units_conserved_across_kit_request_and_return
        grounds:
          - invariants[INV_TRYON_SAMPLE_UNITS]
          - entities.Frame.fields.tryon_available
          - entities.Frame.fields.tryon_stock
          - entities.TryOnKitItem.fields.outcome
          - state_machines.HomeTryOnKit.SHIPPED_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity #2 — PHYSICAL UNITS, not money. The identity
          frame.tryon_available + COUNT(PENDING TryOnKitItem on that frame) == frame.tryon_stock
          == 2 holds before (2 + 0), during (1 + 1) and after (2 + 0) the kit's life, and the KEPT
          outcome releases the sample exactly as RETURNED does — no unit is leaked by the
          customer's decision to buy.
        test_recipe:
          setup:
            - "Frame with tryon_stock 2 (tryon_available 2 at creation)."
            - "Customer requested a kit holding that frame, so tryon_available dropped to 1 and one PENDING item exists."
            - "Kit shipped; clock still at its 2026-05-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /optical/frames"
              payload: { sku: "FRM-015", name: "Wright", brand: "WP", price_cents: 9500, tryon_stock: 2, min_pd_mm: 50.0, max_pd_mm: 75.0 }
              as: PlatformAdmin
              captures: { frame_id: $.data.id }
            - call: "POST /optical/customers"
              payload: { full_name: "Sam Ple", email: "sam@x.com", dob: "1997-07-07T00:00:00Z" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /optical/home-try-on-kits"
              payload: { customer_id: "${cust_id}", frame_ids: ["${frame_id}"], ship_date: "2026-05-05T00:00:00Z", due_date: "2026-05-15T00:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { kit_id: $.data.id }
            - call: "GET /optical/frames/${frame_id}"
              as: StoreAssociate
              captures: { avail_mid: $.data.tryon_available }
            - call: "POST /optical/home-try-on-kits/${kit_id}/ship"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /optical/home-try-on-kits/${kit_id}/return"
              payload: { kept_frame_ids: ["${frame_id}"] }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "${avail_mid} == 1 (mid-flight: 1 available + 1 PENDING == tryon_stock 2)"
            - "Frame.${frame_id}.tryon_available == 2"
            - "Frame.${frame_id}.tryon_stock == 2"
            - "The single TryOnKitItem on kit ${kit_id} has outcome == KEPT"
            - "GET /optical/frames/${frame_id}/try-on-kit-items?outcome=PENDING returns total_count == 0"
            - "HomeTryOnKit.${kit_id}.kept_count == 1"
