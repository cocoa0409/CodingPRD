              as: StudioAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st1_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T13:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses1_id: $.data.id, ses1_v1: $.data.version }
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${ses1_id}", talent_id: "${ph_id}", role_on_set: "PHOTOGRAPHER", call_time: "2026-08-03T09:00:00Z", wrap_time: "2026-08-03T13:00:00Z", expected_session_version: "${ses1_v1}" }
              as: Producer
              captures: { bk1_id: $.data.id }
            - call: "POST /studio/talent-bookings/${bk1_id}/confirm"
              payload: {}
              as: Producer
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st2_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T12:59:00Z", scheduled_end: "2026-08-03T17:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses2_id: $.data.id, ses2_v1: $.data.version }
          trigger:
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${ses2_id}", talent_id: "${ph_id}", role_on_set: "PHOTOGRAPHER", call_time: "2026-08-03T12:59:00Z", wrap_time: "2026-08-03T16:59:00Z", expected_session_version: "${ses2_v1}" }
              as: Producer
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${ses2_id}", talent_id: "${ph_id}", role_on_set: "PHOTOGRAPHER", call_time: "2026-08-03T13:00:00Z", wrap_time: "2026-08-03T17:00:00Z", expected_session_version: "${ses2_v1}" }
              as: Producer
              captures: { bk3_id: $.data.id }
          assert:
            - "first candidate (12:59 call): status == 409 and error_id == \"ERR_TALENT_OVERLAP\""
            - "the rejected attempt leaves ShootSession.${ses2_id}.version unchanged, so the same expected_session_version is still current"
            - "second candidate (13:00 call): status == 201"
            - "TalentBooking.${bk3_id}.booking_state == \"HELD\""
            - "TalentBooking.${bk3_id}.booked_minutes == 240"
            - "TalentBooking.${bk3_id}.regular_minutes == 240 and TalentBooking.${bk3_id}.overtime_minutes == 0"
            - "TalentBooking.${bk3_id}.charge_cents == 48000"
            - "TalentProfile.${ph_id}.booked_minutes_today == 480"

      - name: still_life_station_admits_two_concurrent_occupations_and_refuses_the_third
        grounds:
          - validations[priority=40].ERR_STATION_OVERLAP
          - entities.Station.fields.max_concurrent_sessions
          - entities.Station.fields.daily_capacity_minutes
          - endpoints[POST /studio/shoot-sessions]
        distinguishing_aspect: |
          The same overlap rule with K = 2 instead of K = 1: two fully identical 09:00-13:00
          occupations coexist on one STILL_LIFE station and the third identical one is refused,
          while a disjoint 13:00-17:00 occupation is still admitted. The refusal is a concurrency
          ceiling, not a minute budget - 720 committed minutes stay far below the 1440 capacity.
        test_recipe:
          setup:
            - "Station SL-1: station_type STILL_LIFE, daily_capacity_minutes 1440, buffer_minutes 0, max_concurrent_sessions 2, calibrated to 2026-12-31. Clock 2026-08-03T08:00:00Z."
            - "Two sessions already occupy the identical window 2026-08-03 09:00-13:00."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/stations"
              payload: { station_code: "SL-1", station_type: "STILL_LIFE", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 2, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { st_id: $.data.id }
            - call: "POST /studio/studio-providers"
              payload: { provider_code: "INHOUSE", provider_kind: "IN_HOUSE", station_hour_rate_cents: 18500, retouch_rate_cents_per_asset: 900, sla_hours: 12, quality_score: 92.00, style_quote_cents: 0, capacity_assets_per_day: 40 }
              as: StudioAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T13:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses1_id: $.data.id }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T13:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses2_id: $.data.id }
          trigger:
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T13:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T13:00:00Z", scheduled_end: "2026-08-03T17:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses4_id: $.data.id }
          assert:
            - "both setup creations returned HTTP 201 (K = 2 concurrent occupations are legal)"
            - "third identical candidate: status == 409 and error_id == \"ERR_STATION_OVERLAP\""
            - "disjoint candidate (13:00-17:00): status == 201"
            - "ShootSession.${ses4_id}.session_state == \"BOOKED\""
            - "Station.${st_id}.committed_minutes_today == 720"
            - "720 < Station.${st_id}.daily_capacity_minutes (1440), so the refusal was the concurrency ceiling"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancelling_a_held_booking_returns_exactly_its_minutes_to_the_talent_day
        grounds:
          - state_machines.TalentBooking.HELD_to_CANCELLED
          - entities.TalentProfile.fields.booked_minutes_today
          - endpoints[POST /studio/talent-bookings/{booking_id}/cancel]
        distinguishing_aspect: |
          Minute-ledger invariant: booked_minutes_today must equal the sum of booked_minutes over
          non-CANCELLED bookings at every point. Two 240-minute holds take it to 480 and cancelling
          one returns it to exactly 240 - not 0 and not 480 - while the money ledger stays at 0
          because neither hold was ever confirmed.
        test_recipe:
          setup:
            - "Photographer Pia Ren (max_daily_minutes 480). Sessions S1 (MODEL-1, 09:00-13:00) and S2 (MODEL-2, 13:00-17:00)."
            - "Two HELD bookings of 240 minutes each are filed, one per session; neither is confirmed."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/stations"
              payload: { station_code: "MODEL-1", station_type: "MODEL", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { st1_id: $.data.id }
            - call: "POST /studio/stations"
              payload: { station_code: "MODEL-2", station_type: "MODEL", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { st2_id: $.data.id }
            - call: "POST /studio/studio-providers"
              payload: { provider_code: "INHOUSE", provider_kind: "IN_HOUSE", station_hour_rate_cents: 18500, retouch_rate_cents_per_asset: 900, sla_hours: 12, quality_score: 92.00, style_quote_cents: 0, capacity_assets_per_day: 40 }
              as: StudioAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /studio/talent-profiles"
              payload: { full_name: "Pia Ren", talent_type: "PHOTOGRAPHER", hourly_rate_cents: 12000, day_rate_cents: 80000, minimum_call_hours: 4, max_daily_minutes: 480 }
              as: StudioAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st1_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T13:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses1_id: $.data.id, ses1_v1: $.data.version }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st2_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T13:00:00Z", scheduled_end: "2026-08-03T17:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses2_id: $.data.id, ses2_v1: $.data.version }
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${ses1_id}", talent_id: "${ph_id}", role_on_set: "PHOTOGRAPHER", call_time: "2026-08-03T09:00:00Z", wrap_time: "2026-08-03T13:00:00Z", expected_session_version: "${ses1_v1}" }
              as: Producer
              captures: { bk1_id: $.data.id }
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${ses2_id}", talent_id: "${ph_id}", role_on_set: "PHOTOGRAPHER", call_time: "2026-08-03T13:00:00Z", wrap_time: "2026-08-03T17:00:00Z", expected_session_version: "${ses2_v1}" }
              as: Producer
              captures: { bk2_id: $.data.id }
          trigger:
            - call: "POST /studio/talent-bookings/${bk2_id}/cancel"
              payload: { reason: "second half dropped from the brief" }
              as: Producer
          assert:
            - "TalentProfile.${ph_id}.booked_minutes_today == 480 before the cancel"
            - "TalentBooking.${bk2_id}.booking_state == \"CANCELLED\""
            - "TalentBooking.${bk2_id}.booked_minutes == 240"
            - "TalentProfile.${ph_id}.booked_minutes_today == 240"
            - "TalentBooking.${bk1_id}.booking_state == \"HELD\""
            - "ShootSession.${ses1_id}.committed_talent_cost_cents == 0"
            - "ShootSession.${ses2_id}.committed_talent_cost_cents == 0"

      - name: cancelling_a_confirmed_booking_unwinds_the_session_money_commitment_to_zero
        grounds:
          - state_machines.TalentBooking.CONFIRMED_to_CANCELLED
          - entities.ShootSession.fields.committed_talent_cost_cents
          - calculations.talent_booking_charge
          - endpoints[POST /studio/talent-bookings/{booking_id}/cancel]
        distinguishing_aspect: |
          A different ledger and a different edge: cancelling from CONFIRMED (rather than HELD) must
          also reverse money, taking committed_talent_cost_cents from exactly 48000 back to 0 with
          no residue, and it must reverse it by the booking's own charge_cents rather than
          recomputing a rate - the stored charge and the reversal are the same number.
        test_recipe:
          setup:
            - "Photographer Pia Ren (hourly 12000, minimum_call_hours 4) is CONFIRMED on a MODEL-1 session 09:00-13:00; 240 minutes at 12000/hour is 48000 cents."
            - "The session budget_cap_cents is 500000, so the confirmation posts cleanly."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/stations"
              payload: { station_code: "MODEL-1", station_type: "MODEL", daily_capacity_minutes: 1440, buffer_minutes: 0, max_concurrent_sessions: 1, calibrated_until: "2026-12-31T00:00:00Z" }
              as: StudioAdmin
              captures: { st_id: $.data.id }
            - call: "POST /studio/studio-providers"
              payload: { provider_code: "INHOUSE", provider_kind: "IN_HOUSE", station_hour_rate_cents: 18500, retouch_rate_cents_per_asset: 900, sla_hours: 12, quality_score: 92.00, style_quote_cents: 0, capacity_assets_per_day: 40 }
              as: StudioAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /studio/talent-profiles"
              payload: { full_name: "Pia Ren", talent_type: "PHOTOGRAPHER", hourly_rate_cents: 12000, day_rate_cents: 80000, minimum_call_hours: 4, max_daily_minutes: 480 }
              as: StudioAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /studio/shoot-sessions"
              payload: { station_id: "${st_id}", provider_id: "${pr_id}", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T13:00:00Z", required_usage_scope: "ECOM_ONLY", budget_cap_cents: 500000 }
              as: Producer
              captures: { ses_id: $.data.id, ses_v1: $.data.version }
            - call: "POST /studio/talent-bookings"
              payload: { session_id: "${ses_id}", talent_id: "${ph_id}", role_on_set: "PHOTOGRAPHER", call_time: "2026-08-03T09:00:00Z", wrap_time: "2026-08-03T13:00:00Z", expected_session_version: "${ses_v1}" }
              as: Producer
              captures: { bk_id: $.data.id }
            - call: "POST /studio/talent-bookings/${bk_id}/confirm"
              payload: {}
              as: Producer
          trigger:
            - call: "POST /studio/talent-bookings/${bk_id}/cancel"
              payload: { reason: "photographer released" }
              as: Producer
          assert:
            - "TalentBooking.${bk_id}.charge_cents == 48000"
            - "ShootSession.${ses_id}.committed_talent_cost_cents == 48000 before the cancel"
            - "TalentBooking.${bk_id}.booking_state == \"CANCELLED\""
            - "ShootSession.${ses_id}.committed_talent_cost_cents == 0"
            - "TalentProfile.${ph_id}.booked_minutes_today == 0"
            - "ShootSession.${ses_id}.session_state == \"BOOKED\""

      - name: vendor_outstanding_count_drains_the_same_way_for_a_return_and_for_a_write_off
        grounds:
          - calculations.custody_ledger_counters
          - entities.Vendor.fields.outstanding_sample_count
          - entities.Vendor.fields.late_return_count
          - state_machines.Sample.RETURN_PENDING_to_RETURNED
          - state_machines.Sample.RECEIVED_to_LOST
        distinguishing_aspect: |
          An item-count invariant with two different exit doors: outstanding_sample_count must equal
          the number of samples in a non-terminal custody state, so an on-time return and a
          write-off each decrement it by exactly one (2 -> 1 -> 0), yet only the write-off adds a
          strike, keeping late_return_count at 1 while the count reaches 0.
        test_recipe:
          setup:
            - "Vendor NRTH with sample_sla_days 14. Samples SMP-3001 and SMP-3002 are RECEIVED at clock 2026-08-01T00:00:00Z (outstanding 2, strikes 0)."
            - "SMP-3001 is moved to RETURN_PENDING; SMP-3002 stays RECEIVED."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/vendors"
              payload: { name: "Northline Apparel", vendor_code: "NRTH", sample_sla_days: 14 }
              as: StudioAdmin
              captures: { v_id: $.data.id }
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-3001", vendor_id: "${v_id}", declared_style_number: "TOP1001" }
              as: SampleCoordinator
              captures: { smpA_id: $.data.id }
            - call: "POST /studio/samples/${smpA_id}/receive"
              payload: {}
              as: SampleCoordinator
            - call: "POST /studio/samples/${smpA_id}/custody-move"
              payload: { to_state: "RETURN_PENDING" }
              as: SampleCoordinator
            - call: "POST /studio/samples"
              payload: { barcode: "SMP-3002", vendor_id: "${v_id}", declared_style_number: "TOP1002" }
              as: SampleCoordinator
              captures: { smpB_id: $.data.id }
            - call: "POST /studio/samples/${smpB_id}/receive"
              payload: {}
              as: SampleCoordinator
          trigger:
            - call: "POST /studio/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /studio/samples/${smpA_id}/return"
              payload: { condition_note: "clean, five days early" }
              as: SampleCoordinator
            - call: "POST /studio/samples/${smpB_id}/report-lost"
              payload: { reason: "never arrived on the rack" }
              as: SampleCoordinator
          assert:
            - "Vendor.${v_id}.outstanding_sample_count == 2 before the trigger"
            - "Sample.${smpA_id}.custody_state == \"RETURNED\" and return_days_late == 0"
            - "Vendor.${v_id}.outstanding_sample_count == 1 after the return"
            - "Sample.${smpB_id}.custody_state == \"LOST\""
            - "Vendor.${v_id}.outstanding_sample_count == 0"
            - "Vendor.${v_id}.late_return_count == 1"
            - "Vendor.${v_id}.coordination_hold == false"
