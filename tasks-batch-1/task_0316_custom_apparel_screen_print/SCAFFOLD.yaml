    roles: [ShopManager]
    code: 201
    input: ["shop_id", "name", "teardown_buffer_min?"]
    output: Press
    side_effects: []

  - method: GET
    path: "/presses/{id}"
    description: "Get a Press"
    roles: [ShopManager, ArtStaff]
    code: 200
    input: []
    output: Press
    side_effects: []

  - method: GET
    path: "/presses"
    description: "List Presses (filter by shop_id) — FK reverse-reachability for Press.shop_id"
    roles: [ShopManager, ArtStaff]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: "Press[]"
    side_effects: []

  # ---- EmbroideryStation ----
  - method: POST
    path: "/embroidery-stations"
    description: "Create an EmbroideryStation"
    roles: [ShopManager]
    code: 201
    input: ["shop_id", "name", "head_count?"]
    output: EmbroideryStation
    side_effects: []

  - method: GET
    path: "/embroidery-stations/{id}"
    description: "Get an EmbroideryStation"
    roles: [ShopManager, ArtStaff]
    code: 200
    input: []
    output: EmbroideryStation
    side_effects: []

  - method: GET
    path: "/embroidery-stations"
    description: "List EmbroideryStations (filter by shop_id) — FK reverse-reachability for EmbroideryStation.shop_id"
    roles: [ShopManager, ArtStaff]
    code: 200
    input: ["shop_id?", "limit?", "offset?"]
    output: "EmbroideryStation[]"
    side_effects: []

  # ---- Order ----
  - method: POST
    path: "/orders"
    description: "Create a draft Order"
    roles: [ShopManager, Customer]
    code: 201
    input: ["shop_id", "customer_id", "requested_ship_date", "reorder_of_order_id?"]
    output: Order
    side_effects: ["fulfillment_status=DRAFT, billing_status=UNBILLED; reorder source validated if provided"]

  - method: GET
    path: "/orders/{id}"
    description: "Get an Order"
    roles: [ShopManager, ArtStaff, Customer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List Orders — FK reverse-reachability for Order.shop_id, Order.customer_id, Order.reorder_of_order_id"
    roles: [ShopManager, ArtStaff, Customer]
    code: 200
    input: ["shop_id?", "customer_id?", "reorder_of_order_id?", "fulfillment_status?", "billing_status?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []

  - method: POST
    path: "/orders/{id}/lines"
    description: "Add an OrderLine"
    roles: [ShopManager, Customer]
    code: 201
    input: ["garment_style_id", "decoration_method_id", "color", "num_locations", "num_colors?", "stitch_count?", "size_run"]
    output: OrderLine
    side_effects: ["line_qty computed from size_run"]

  - method: GET
    path: "/orders/{id}/lines"
    description: "List OrderLines of an Order (sub-resource; satisfies OrderLine.order_id)"
    roles: [ShopManager, ArtStaff, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []

  - method: GET
    path: "/order-lines/{id}"
    description: "Get an OrderLine"
    roles: [ShopManager, ArtStaff, Customer]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: GET
    path: "/order-lines"
    description: "List OrderLines (filtered) — FK reverse-reachability for OrderLine.order_id, .garment_style_id, .decoration_method_id"
    roles: [ShopManager, ArtStaff, Customer]
    code: 200
    input: ["order_id?", "garment_style_id?", "decoration_method_id?", "limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []

  - method: POST
    path: "/orders/{id}/confirm"
    description: "Confirm an Order (price + reserve blanks + deposit)"
    roles: [ShopManager]
    code: 200
    input: []
    output: Order
    side_effects:
      - "compute Quote (ESTIMATE), set is_rush, create reservations, set deposit, increment Customer.outstanding_deposit_cents, increments Order.version by 1, fulfillment_status -> CONFIRMED"

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an Order (release reservations, void proofs, refund deposit)"
    roles: [ShopManager, Customer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "fulfillment_status -> CANCELLED; release ACTIVE reservations; void non-terminal proofs; decrement Customer.outstanding_deposit_cents; deposit_paid_cents -> 0"

  - method: POST
    path: "/orders/{id}/invoice"
    description: "Invoice a FULFILLED Order (final consumption-based total)"
    roles: [ShopManager]
    code: 200
    input: []
    output: Order
