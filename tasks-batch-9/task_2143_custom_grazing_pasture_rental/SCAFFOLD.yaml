# =============================================================================
# PRD Benchmark seed tables — Custom Grazing & Pasture Rental (task 2143)
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2143. Custom Grazing & Pasture Rental (custom grazier):
  pasture inventory & carrying capacity assessment, contract terms (per head per day vs gain),
  cattle receiving/weighing & shrink allowance, health protocol & treatment cost allocation,
  water/fence infrastructure responsibility, weight-out settlement & disputed gain,
  weather/drought early removal, liability & death loss terms

domain_name: custom-grazing-pasture-rental
api_prefix: /grazing

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Step 0 — Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # GrazingContract is a three-way junction (Grazier x CattleOwner x Pasture);
  # Settlement is a junction (GrazingContract x CattleLot x RangeConsultant);
  # InfrastructureTicket is a junction (Pasture x GrazingContract). Cross-aggregate
  # references dominate; there is no single ownership tree.

  state_machine_shape: cyclic
  # Settlement runs ISSUED -> DISPUTED -> ADJUDICATED -> ISSUED negotiation rounds.
  # GrazingContract additionally carries two independent state dimensions
  # (lifecycle_status x billing_status); InfrastructureTicket forks
  # OPEN -> {ASSIGNED_GRAZIER | ASSIGNED_OWNER} -> REPAIRED with divergent
  # cost-allocation side effects per branch.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: segregation_of_duties
  # The RangeConsultant who authored a pasture's effective CapacityAssessment is
  # barred from adjudicating a disputed Settlement on a contract for that pasture.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 46 endpoints / 40 error codes / 11 calculations / 7 state machines.

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Grazier
    parent: null
    common_fields: true
    fields:
      - { name: business_name, type: string, source: input, description: "Trading name of the custom grazing operation" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code where the operation is based", constraints: "exactly 2 uppercase letters" }
      - { name: liability_carrier, type: string, source: input, description: "Name of the grazier's livestock liability insurer" }

  - name: CattleOwner
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the cattle owner entity" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code of record", constraints: "exactly 2 uppercase letters" }
      - { name: brand_registration, type: string, source: input, description: "Registered livestock brand identifier" }
      - { name: credit_limit_cents, type: integer, source: input, default: 500000, description: "Maximum unpaid settlement exposure tolerated before the owner is flagged DELINQUENT", constraints: ">= 0" }
      - { name: open_settlement_balance_cents, type: integer, source: computed, default: 0, description: "Sum of total_due_cents over every Settlement of this owner whose status is in {ISSUED, DISPUTED, ADJUDICATED, FINAL} (see calculations.owner_open_balance)" }
      - { name: credit_status, type: enum, source: computed, default: GOOD_STANDING, description: "Derived standing recomputed on every settlement status change", constraints: "GOOD_STANDING | DELINQUENT" }

  - name: RangeConsultant
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Consultant's full name" }
      - { name: certification_number, type: string, source: input, description: "Certified rangeland professional number" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code of certification", constraints: "exactly 2 uppercase letters" }

  - name: Pasture
    parent: Grazier
    common_fields: true
    fields:
      - { name: grazier_id, type: string, source: system, description: "FK -> Grazier.id; owning grazier, taken from the X-User-ID header on create" }
      - { name: name, type: string, source: input, description: "Pasture unit name" }
      - { name: acres, type: number, source: input, description: "Grazeable acreage of the unit", constraints: "> 0" }
      - { name: forage_type, type: enum, source: input, description: "Dominant forage stand", constraints: "NATIVE_RANGE | IMPROVED_PASTURE | COOL_SEASON_MIX | WARM_SEASON_MIX" }
      - { name: water_source_type, type: enum, source: input, description: "Primary stock-water source", constraints: "WELL | CREEK | PIPELINE | POND" }
      - { name: fence_class, type: enum, source: input, description: "Perimeter fence classification", constraints: "CLASS_A | CLASS_B | CLASS_C" }
      - { name: prior_season_head_days, type: integer, source: input, default: 0, description: "Actual head-days carried the previous season; sole input of the STOCKING_HISTORY capacity method", constraints: ">= 0" }
      - { name: operational_status, type: enum, source: system, default: DRAFT, description: "Lifecycle of the pasture record itself", constraints: "DRAFT | AVAILABLE | CLOSED" }
      - { name: effective_assessment_id, type: string, source: computed, default: null, description: "FK -> CapacityAssessment.id; the assessment currently in force — the one with the greatest assessment_date, tie-break greatest created_at; null until the first assessment is filed" }
      - { name: rated_aum, type: number, source: computed, default: 0, description: "Animal-unit-months carried by the effective assessment; 0 while effective_assessment_id is null" }
      - { name: rated_head_days, type: integer, source: computed, default: 0, description: "Season head-day budget carried by the effective assessment; 0 while effective_assessment_id is null" }
      - { name: committed_head_days, type: integer, source: computed, default: 0, description: "Sum of committed_head_days over GrazingContracts on this pasture whose lifecycle_status is in {PENDING_SIGNATURE, ACTIVE, EARLY_REMOVAL_PENDING}" }
      - { name: capacity_utilization_pct, type: number, source: computed, default: 0, description: "round_half_up(committed_head_days / rated_head_days * 100, 2); 0 when rated_head_days == 0" }
      - { name: stocked_head_count, type: integer, source: computed, default: 0, description: "Sum over CattleLots on this pasture with status in {ON_FEED, REMOVAL_SCHEDULED} of (head_count_received - confirmed_death_head)" }
      - { name: drought_destock_flag, type: boolean, source: system, default: false, description: "Set true by the drought trigger in calculations.drought_trigger; cleared by a recovery reading" }
      - { name: open_critical_ticket_count, type: integer, source: computed, default: 0, description: "Count of InfrastructureTickets on this pasture with severity == CRITICAL and status in {OPEN, ASSIGNED_GRAZIER, ASSIGNED_OWNER}" }
      - { name: grazing_posture, type: enum, source: computed, default: OPEN, description: "Derived gate over all child stocking operations, per calculations.pasture_grazing_posture", constraints: "OPEN | RESTRICTED | DESTOCK_ORDERED | CLOSED" }

  - name: CapacityAssessment
    parent: Pasture
    common_fields: false
    fields:
      - { name: pasture_id, type: string, source: system, description: "FK -> Pasture.id; the pasture assessed, taken from the path" }
      - { name: assessor_id, type: string, source: system, description: "FK -> RangeConsultant.id; author of the assessment, taken from the X-User-ID header" }
      - { name: method, type: enum, source: input, description: "Which carrying-capacity algorithm variant produced the rating", constraints: "DRY_MATTER | STOCKING_HISTORY" }
      - { name: forage_dry_matter_lbs_per_acre, type: number, source: input, default: 0, description: "Standing dry-matter yield; required when method == DRY_MATTER, ignored when method == STOCKING_HISTORY", constraints: ">= 0" }
      - { name: utilization_pct, type: number, source: input, description: "Harvest-efficiency take-half-leave-half factor", constraints: "> 0 and <= 60" }
      - { name: assessment_date, type: datetime, source: input, description: "Calendar date the range was walked; drives which assessment is effective" }
      - { name: rated_aum, type: number, source: computed, description: "Animal-unit-months rating produced by the selected method" }
      - { name: rated_head_days, type: integer, source: computed, description: "Season head-day budget produced by the selected method" }

  - name: DroughtReading
    parent: Pasture
    common_fields: false
    fields:
      - { name: pasture_id, type: string, source: system, description: "FK -> Pasture.id; the pasture read, taken from the path" }
      - { name: reading_date, type: datetime, source: input, description: "Calendar date of the drought observation" }
      - { name: drought_index, type: integer, source: input, description: "US Drought Monitor D-scale value", constraints: "0..5" }
      - { name: forage_remaining_pct, type: number, source: input, description: "Standing forage remaining as a percentage of the season's start", constraints: "0..100" }
      - { name: consecutive_severe_count, type: integer, source: computed, description: "Length of the unbroken run of readings with drought_index >= 3 ending at this reading" }
      - { name: triggered_destock, type: boolean, source: computed, description: "True when this reading flipped Pasture.drought_destock_flag from false to true" }

  - name: GrazingContract
    parent: null
    common_fields: true
    fields:
      - { name: grazier_id, type: string, source: system, description: "FK -> Grazier.id; taken from the X-User-ID header on create" }
      - { name: cattle_owner_id, type: string, source: input, description: "FK -> CattleOwner.id; the counterparty placing cattle" }
      - { name: pasture_id, type: string, source: input, description: "FK -> Pasture.id; the pasture the cattle will run on" }
      - { name: billing_mode, type: enum, source: input, description: "Which base-charge algorithm governs the settlement", constraints: "PER_HEAD_PER_DAY | PER_POUND_OF_GAIN" }
      - { name: rate_cents, type: integer, source: input, description: "Cents per head-day when billing_mode == PER_HEAD_PER_DAY; cents per pound of shrunk gain when billing_mode == PER_POUND_OF_GAIN", constraints: "> 0" }
      - { name: shrink_pct, type: number, source: input, default: 0, description: "Pencil-shrink allowance applied to the IN scale ticket", constraints: "0..10" }
      - { name: out_shrink_pct, type: number, source: input, default: 0, description: "Pencil-shrink allowance applied to INTERIM and OUT scale tickets", constraints: "0..10" }
      - { name: head_count_committed, type: integer, source: input, description: "Head the owner commits to deliver; also the basis of the min-days floor and the gain cap", constraints: "> 0" }
      - { name: head_value_cents, type: integer, source: input, description: "Declared per-head value used to price grazier-liable death loss", constraints: "> 0" }
      - { name: start_date, type: datetime, source: input, description: "First day of the grazing window (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Last day of the grazing window (exclusive — windows are half-open [start_date, end_date))" }
      - { name: min_days, type: integer, source: input, default: 60, description: "Minimum days-on-feed the owner guarantees", constraints: ">= 0" }
      - { name: treatment_cost_split_pct, type: integer, source: input, default: 0, description: "Grazier's percentage share of a ROUTINE_PROTOCOL treatment's total cost", constraints: "0..100" }
      - { name: water_responsibility, type: enum, source: input, description: "Who bears WATER infrastructure repair cost absent a cause override", constraints: "GRAZIER | OWNER | SHARED" }
      - { name: fence_responsibility, type: enum, source: input, description: "Who bears FENCE infrastructure repair cost absent a cause override", constraints: "GRAZIER | OWNER | SHARED" }
      - { name: infrastructure_owner_cap_cents, type: integer, source: input, default: 100000, description: "Per-ticket ceiling on the owner's matrix share of a repair", constraints: ">= 0" }
      - { name: death_loss_terms, type: enum, source: input, description: "Liability regime for dead head", constraints: "OWNER_BEARS_ALL | GRAZIER_SHARE_ABOVE_THRESHOLD" }
      - { name: death_loss_threshold_pct, type: number, source: input, default: 2.0, description: "Percentage of head_count_received the owner absorbs before grazier liability begins; only read when death_loss_terms == GRAZIER_SHARE_ABOVE_THRESHOLD", constraints: "0..100" }
      - { name: signature_ref, type: string, source: system, default: null, description: "Owner's signature reference captured at sign time" }
      - { name: committed_head_days, type: integer, source: computed, description: "head_count_committed * (end_date - start_date) in whole days" }
      - { name: lifecycle_status, type: enum, source: system, default: DRAFT, description: "Contract lifecycle dimension — evolves independently of billing_status", constraints: "DRAFT | PENDING_SIGNATURE | SUSPENDED | ACTIVE | EARLY_REMOVAL_PENDING | COMPLETED | TERMINATED" }
      - { name: billing_status, type: enum, source: system, default: UNBILLED, description: "Settlement dimension — evolves independently of lifecycle_status", constraints: "UNBILLED | SETTLEMENT_ISSUED | SETTLED" }
      - { name: early_removal_reason, type: enum, source: system, default: null, description: "Why the cattle came off early; drives the early_removal_adjustment_cents term", constraints: "DROUGHT | OWNER_ELECTED | GRAZIER_ELECTED" }
      - { name: early_removal_effective_date, type: datetime, source: system, default: null, description: "Date the cattle must be off the pasture" }

  - name: CattleLot
    parent: GrazingContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: system, description: "FK -> GrazingContract.id; taken from the path on create" }
      - { name: scheduled_head_count, type: integer, source: input, description: "Head the delivery is booked for", constraints: "> 0" }
      - { name: scheduled_delivery_date, type: datetime, source: input, description: "Booked delivery date" }
      - { name: head_count_received, type: integer, source: system, default: 0, description: "Head actually counted off the truck at receiving" }
      - { name: gross_weight_in_lbs, type: number, source: system, default: 0, description: "Lot-level gross weight on the IN scale ticket" }
      - { name: shrunk_weight_in_lbs, type: number, source: computed, default: 0, description: "IN weight after the contract pencil shrink, per calculations.shrunk_weight" }
      - { name: in_date, type: datetime, source: system, default: null, description: "weighed_at of the IN WeightEvent" }
      - { name: head_count_out, type: integer, source: system, default: 0, description: "Head counted on the OUT scale ticket" }
      - { name: gross_weight_out_lbs, type: number, source: system, default: 0, description: "Lot-level gross weight on the OUT scale ticket" }
      - { name: shrunk_weight_out_lbs, type: number, source: computed, default: 0, description: "OUT weight after out_shrink_pct, per calculations.shrunk_weight" }
      - { name: out_date, type: datetime, source: system, default: null, description: "weighed_at of the OUT WeightEvent" }
      - { name: confirmed_death_head, type: integer, source: computed, default: 0, description: "Sum of head_lost over DeathLossReports on this lot with status == CONFIRMED" }
      - { name: days_on_feed, type: integer, source: computed, default: 0, description: "floor((out_date - in_date) in days); 0 until the OUT event lands" }
      - { name: scheduled_removal_date, type: datetime, source: system, default: null, description: "Date the lot must be gone once the contract enters EARLY_REMOVAL_PENDING" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Lot lifecycle", constraints: "SCHEDULED | RECEIVING_HELD | ON_FEED | REMOVAL_SCHEDULED | WEIGHED_OUT | CLOSED" }

  - name: WeightEvent
    parent: CattleLot
    common_fields: false
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> CattleLot.id; taken from the path" }
      - { name: event_type, type: enum, source: input, description: "Which scale ticket this is", constraints: "IN | INTERIM | OUT" }
      - { name: gross_weight_lbs, type: number, source: input, description: "Lot-level gross weight on the ticket", constraints: "> 0" }
      - { name: head_count, type: integer, source: input, description: "Head across the scale", constraints: "> 0" }
      - { name: scale_ticket_ref, type: string, source: input, description: "Certified scale ticket reference" }
      - { name: weighed_at, type: datetime, source: input, description: "Timestamp on the scale ticket" }
      - { name: shrink_pct_applied, type: number, source: computed, description: "contract.shrink_pct for IN events, contract.out_shrink_pct for INTERIM and OUT events" }
      - { name: shrunk_weight_lbs, type: number, source: computed, description: "Lot-level shrunk weight, per calculations.shrunk_weight" }

  - name: HealthTreatment
    parent: CattleLot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> CattleLot.id; taken from the path" }
      - { name: protocol_code, type: string, source: input, description: "Health-protocol code applied" }
      - { name: classification, type: enum, source: input, description: "Cost-allocation class of the intervention", constraints: "ROUTINE_PROTOCOL | THERAPEUTIC | PREVENTIVE_EMERGENCY" }
      - { name: treatment_date, type: datetime, source: input, description: "Date the animals were worked" }
      - { name: withdrawal_days, type: integer, source: input, default: 0, description: "Drug withdrawal period in days; defines the closed interval [treatment_date, treatment_date + withdrawal_days]", constraints: ">= 0" }
      - { name: head_treated, type: integer, source: input, description: "Head worked", constraints: "> 0" }
      - { name: drug_cost_cents, type: integer, source: input, description: "Pharmaceutical cost", constraints: ">= 0" }
      - { name: labor_cost_cents, type: integer, source: input, description: "Chute-and-labor cost", constraints: ">= 0" }
      - { name: total_cost_cents, type: integer, source: computed, description: "drug_cost_cents + labor_cost_cents" }
      - { name: owner_share_cents, type: integer, source: computed, description: "Owner's rounded share, per calculations.treatment_cost_allocation" }
      - { name: grazier_share_cents, type: integer, source: computed, description: "total_cost_cents - owner_share_cents" }
      - { name: review_note, type: string, source: system, default: null, description: "Free-text note captured at review time" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "Review state of the treatment charge", constraints: "RECORDED | APPROVED | DISPUTED | VOIDED" }

  - name: DeathLossReport
    parent: CattleLot
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> CattleLot.id; taken from the path" }
      - { name: death_date, type: datetime, source: input, description: "Date the head were found dead; also the chronological key of the liability sweep" }
      - { name: head_lost, type: integer, source: input, description: "Head lost in this event", constraints: "> 0" }
      - { name: cause, type: enum, source: input, description: "Attributed cause of death", constraints: "DISEASE | PREDATOR | WEATHER | INFRASTRUCTURE_FAILURE | UNKNOWN" }
      - { name: necropsy_performed, type: boolean, source: input, default: false, description: "Whether a necropsy backed the cause attribution" }
      - { name: owner_liable_head, type: integer, source: computed, default: 0, description: "Head of this report the owner absorbs, per calculations.death_loss_liability" }
      - { name: grazier_liable_head, type: integer, source: computed, default: 0, description: "head_lost - owner_liable_head" }
      - { name: credit_cents, type: integer, source: computed, default: 0, description: "Settlement credit owed to the owner for grazier-liable head" }
      - { name: review_note, type: string, source: system, default: null, description: "Free-text note captured at review time" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "Verification state of the report", constraints: "REPORTED | CONFIRMED | REJECTED | VOIDED" }

  - name: InfrastructureTicket
    parent: Pasture
    common_fields: true
    fields:
      - { name: pasture_id, type: string, source: input, description: "FK -> Pasture.id; the pasture whose water or fence failed" }
      - { name: contract_id, type: string, source: input, description: "FK -> GrazingContract.id; the contract whose responsibility matrix and owner cap govern the cost split" }
      - { name: asset_type, type: enum, source: input, description: "Which infrastructure class failed", constraints: "WATER | FENCE" }
      - { name: severity, type: enum, source: input, description: "CRITICAL tickets gate the pasture posture; MAJOR and MINOR do not", constraints: "CRITICAL | MAJOR | MINOR" }
      - { name: description, type: string, source: input, description: "Free-text description of the failure" }
      - { name: reported_at, type: datetime, source: input, description: "When the failure was reported" }
      - { name: cause, type: enum, source: system, default: null, description: "Cause determined at repair time; LIVESTOCK_DAMAGE and NEGLECT override the responsibility matrix", constraints: "WEAR | STORM | LIVESTOCK_DAMAGE | NEGLECT" }
      - { name: repair_party, type: enum, source: system, default: null, description: "Which side was assigned to front the repair; selects the divergent branch", constraints: "GRAZIER | OWNER" }
      - { name: repair_cost_cents, type: integer, source: system, default: 0, description: "Invoiced repair cost captured at completion", constraints: ">= 0" }
      - { name: repair_completed_at, type: datetime, source: system, default: null, description: "When the repair was signed off" }
      - { name: responsible_party, type: enum, source: computed, default: null, description: "Matrix outcome after cause overrides, per calculations.infrastructure_cost_allocation", constraints: "GRAZIER | OWNER | SHARED" }
      - { name: owner_share_cents, type: integer, source: computed, default: 0, description: "Signed amount the settlement charges the owner; negative on the OWNER-repair branch (a credit back to the owner)" }
      - { name: grazier_share_cents, type: integer, source: computed, default: 0, description: "repair_cost_cents - matrix_owner_share_cents on both branches" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Ticket lifecycle", constraints: "OPEN | ASSIGNED_GRAZIER | ASSIGNED_OWNER | REPAIRED | BILLED" }

  - name: Settlement
    parent: GrazingContract
    common_fields: true
    fields:
      - { name: contract_id, type: string, source: input, description: "FK -> GrazingContract.id; the contract being settled" }
      - { name: lot_id, type: string, source: input, description: "FK -> CattleLot.id; the weighed-out lot being settled" }
      - { name: adjudicator_id, type: string, source: system, default: null, description: "FK -> RangeConsultant.id; the consultant who ruled on the latest dispute round; null until adjudication" }
      - { name: gain_method, type: enum, source: computed, default: PROVISIONAL_PRORATED, description: "Which gain algorithm produced shrunk_gain_lbs, per calculations.settlement_gain", constraints: "PROVISIONAL_PRORATED | FINAL_ADJUDICATED | SPLIT_MIDPOINT" }
      - { name: days_on_feed, type: integer, source: computed, default: 0, description: "Snapshot of CattleLot.days_on_feed at computation time" }
      - { name: billable_head_days, type: integer, source: computed, default: 0, description: "Head-days after the min-days floor; only non-zero when billing_mode == PER_HEAD_PER_DAY" }
      - { name: adjusted_in_weight_lbs, type: number, source: computed, default: 0, description: "In-weight attributed to the head that actually walked off, per the selected gain method" }
      - { name: shrunk_gain_lbs, type: number, source: computed, default: 0, description: "shrunk_weight_out_lbs - adjusted_in_weight_lbs (or the midpoint under SPLIT_MIDPOINT)" }
      - { name: average_daily_gain, type: number, source: computed, default: 0, description: "shrunk_gain_lbs / (head_count_out * days_on_feed), round_half_up to 4 decimals; selects the ADG rate tier" }
      - { name: base_charge_cents, type: integer, source: computed, default: 0, description: "Grazing charge, per calculations.settlement_base_charge" }
      - { name: treatment_charge_cents, type: integer, source: computed, default: 0, description: "Sum of owner_share_cents over the lot's HealthTreatments with status == APPROVED (round-per-treatment then sum)" }
      - { name: infrastructure_charge_cents, type: integer, source: computed, default: 0, description: "Sum of owner_share_cents over InfrastructureTickets on this contract with status in {REPAIRED, BILLED}; may be negative" }
      - { name: death_loss_credit_cents, type: integer, source: computed, default: 0, description: "Sum of credit_cents over the lot's DeathLossReports with status == CONFIRMED" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "base_charge_cents + treatment_charge_cents + infrastructure_charge_cents - death_loss_credit_cents" }
      - { name: early_removal_adjustment_cents, type: integer, source: computed, default: 0, description: "Signed adjustment keyed on contract.early_removal_reason; negative is a credit to the owner" }
      - { name: volume_rebate_cents, type: integer, source: computed, default: 0, description: "Tiered rebate keyed on (subtotal_cents + early_removal_adjustment_cents), NOT on total_due_cents" }
      - { name: total_due_cents, type: integer, source: computed, default: 0, description: "subtotal_cents + early_removal_adjustment_cents - volume_rebate_cents" }
      - { name: dispute_round, type: integer, source: system, default: 0, description: "Number of disputes opened so far; capped by MAX_DISPUTE_ROUNDS" }
      - { name: disputed_field, type: enum, source: system, default: null, description: "What the owner contests", constraints: "SHRUNK_GAIN_LBS | TREATMENT_CHARGE | DEATH_LOSS_CREDIT" }
      - { name: claimed_shrunk_gain_lbs, type: number, source: system, default: null, description: "The owner's own gain figure, used by the SPLIT_MIDPOINT resolution" }
      - { name: resolution, type: enum, source: system, default: null, description: "The adjudicator's ruling on the latest round", constraints: "UPHELD_GRAZIER | UPHELD_OWNER | SPLIT_MIDPOINT" }
      - { name: dispute_note, type: string, source: system, default: null, description: "Owner's note captured when the dispute was opened" }
      - { name: adjudication_note, type: string, source: system, default: null, description: "Adjudicator's note captured at ruling time" }
      - { name: void_reason, type: string, source: system, default: null, description: "Reason captured when the settlement was voided" }
      - { name: issued_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the most recent issue or reissue; restarts the dispute window" }
      - { name: dispute_opened_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the most recent dispute" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Settlement lifecycle; ADJUDICATED can cycle back to ISSUED", constraints: "DRAFT | ISSUED | DISPUTED | ADJUDICATED | FINAL | VOID" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- Pasture --
  - entity: Pasture
    dimension: operational_status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: AVAILABLE
        trigger: "POST /grazing/pastures/{id}/status with to_status = AVAILABLE"
        actor: Grazier
        preconditions:
          - "pasture.operational_status == DRAFT"
          - "X-User-ID == pasture.grazier_id"
          - "at least one CapacityAssessment exists for this pasture (empty set is rejected with ERR_NO_CAPACITY_ASSESSMENT)"
        side_effects:
          - "recompute Pasture.effective_assessment_id, Pasture.rated_aum, Pasture.rated_head_days (calculations.capacity_assessment_rating)"
          - "recompute Pasture.capacity_utilization_pct and Pasture.grazing_posture (calculations.pasture_grazing_posture)"
          - "increments Pasture.version by 1"
      - from: DRAFT
        to: CLOSED
        trigger: "POST /grazing/pastures/{id}/status with to_status = CLOSED"
        actor: Grazier
        preconditions:
          - "pasture.operational_status == DRAFT"
          - "X-User-ID == pasture.grazier_id"
        side_effects:
          - "sets Pasture.grazing_posture = CLOSED"
          - "increments Pasture.version by 1"
      - from: AVAILABLE
        to: CLOSED
        trigger: "POST /grazing/pastures/{id}/status with to_status = CLOSED"
        actor: Grazier
        preconditions:
          - "pasture.operational_status == AVAILABLE"
          - "X-User-ID == pasture.grazier_id"
          - "no GrazingContract on this pasture has lifecycle_status in {PENDING_SIGNATURE, SUSPENDED, ACTIVE, EARLY_REMOVAL_PENDING} (else ERR_PASTURE_HAS_ACTIVE_CONTRACTS)"
        side_effects:
          - "sets Pasture.grazing_posture = CLOSED"
          - "increments Pasture.version by 1"
      - from: AVAILABLE
        to: AVAILABLE
        trigger: "POST /grazing/pastures/{id}/capacity-assessments (a new assessment supersedes the prior effective one)"
        actor: RangeConsultant
        preconditions:
          - "pasture.operational_status in {DRAFT, AVAILABLE}"
          - "request body carries expected_pasture_version equal to Pasture.version (else ERR_STALE_PASTURE_VERSION)"
        side_effects:
          - "recompute Pasture.effective_assessment_id (greatest assessment_date, tie-break greatest created_at)"
          - "recompute Pasture.rated_aum and Pasture.rated_head_days from the new effective assessment"
          - "recompute Pasture.capacity_utilization_pct and Pasture.grazing_posture"
          - "increments Pasture.version by 1"
    note: |
      Pasture.grazing_posture is NOT a transition-driven field. It is recomputed from
      calculations.pasture_grazing_posture after every mutation that touches
      operational_status, drought_destock_flag, open_critical_ticket_count or
      capacity_utilization_pct, with the fixed precedence
      CLOSED > DESTOCK_ORDERED > RESTRICTED > OPEN.

  # --------------------------------------------- GrazingContract / lifecycle --
  - entity: GrazingContract
    dimension: lifecycle_status
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED]
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURE
        trigger: "POST /grazing/contracts/{id}/submit"
        actor: Grazier
        preconditions:
          - "contract.lifecycle_status == DRAFT"
          - "X-User-ID == contract.grazier_id"
          - "pasture.operational_status == AVAILABLE (else ERR_PASTURE_NOT_AVAILABLE)"
          - "pasture.committed_head_days + contract.committed_head_days <= pasture.rated_head_days (strict > is rejected with ERR_CAPACITY_EXCEEDED; equality is accepted)"
        side_effects:
          - "recompute Pasture.committed_head_days and Pasture.capacity_utilization_pct"
          - "recompute Pasture.grazing_posture"
          - "increments GrazingContract.version by 1"
      - from: PENDING_SIGNATURE
        to: ACTIVE
        trigger: "POST /grazing/contracts/{id}/sign"
        actor: CattleOwner
        preconditions:
          - "contract.lifecycle_status == PENDING_SIGNATURE"
          - "X-User-ID == contract.cattle_owner_id"
          - "no other GrazingContract on the same pasture with lifecycle_status in {ACTIVE, EARLY_REMOVAL_PENDING} conflicts under calculations.grazing_window_conflict (else ERR_GRAZING_WINDOW_OVERLAP)"
          - "owner.credit_status == GOOD_STANDING (else ERR_OWNER_DELINQUENT)"
        side_effects:
          - "stores GrazingContract.signature_ref"
          - "recompute Pasture.grazing_posture"
          - "increments GrazingContract.version by 1"
      - from: PENDING_SIGNATURE
        to: SUSPENDED
        trigger: "system — CattleOwner.credit_status flips GOOD_STANDING -> DELINQUENT (cascade link 3 of calculations.owner_open_balance)"
        actor: system
        preconditions:
          - "contract.lifecycle_status == PENDING_SIGNATURE"
          - "contract.cattle_owner_id == the owner whose credit_status just flipped to DELINQUENT"
        side_effects:
          - "increments GrazingContract.version by 1"
        note: "Only PENDING_SIGNATURE contracts suspend; ACTIVE contracts are untouched by delinquency."
      - from: SUSPENDED
        to: PENDING_SIGNATURE
        trigger: "system — CattleOwner.credit_status flips DELINQUENT -> GOOD_STANDING (compensating cascade)"
        actor: system
        preconditions:
          - "contract.lifecycle_status == SUSPENDED"
          - "contract.cattle_owner_id == the owner whose credit_status just returned to GOOD_STANDING"
        side_effects:
          - "increments GrazingContract.version by 1"
      - from: ACTIVE
        to: EARLY_REMOVAL_PENDING
        trigger: "POST /grazing/contracts/{id}/early-removal, or system drought cascade from calculations.drought_trigger"
        actor: Grazier | CattleOwner | system
        preconditions:
          - "contract.lifecycle_status == ACTIVE"
          - "when the actor is Grazier or CattleOwner, at least one CattleLot on this contract has status in {ON_FEED, REMOVAL_SCHEDULED}; the system drought cascade moves EVERY ACTIVE contract on the pasture regardless of lot state"
          - "when actor is CattleOwner the reason must be OWNER_ELECTED; when actor is Grazier the reason must be GRAZIER_ELECTED (else ERR_EARLY_REMOVAL_NOT_PERMITTED); the system cascade always sets DROUGHT"
          - "when reason == OWNER_ELECTED, (effective_date - lot.in_date) in whole days >= contract.min_days (else ERR_MIN_DAYS_NOT_MET); DROUGHT and GRAZIER_ELECTED waive this check"
        side_effects:
          - "sets GrazingContract.early_removal_reason and GrazingContract.early_removal_effective_date"
          - "cascade: every CattleLot on this contract with status == ON_FEED moves to REMOVAL_SCHEDULED and takes scheduled_removal_date = early_removal_effective_date"
          - "increments GrazingContract.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /grazing/contracts/{id}/early-removal on a contract with no lot on the ground"
        actor: Grazier | CattleOwner
        preconditions:
          - "contract.lifecycle_status == ACTIVE"
          - "no CattleLot on this contract has status in {ON_FEED, REMOVAL_SCHEDULED, WEIGHED_OUT}"
          - "reason matches the acting role as above"
        side_effects:
          - "sets GrazingContract.early_removal_reason and GrazingContract.early_removal_effective_date"
          - "recompute Pasture.committed_head_days, Pasture.capacity_utilization_pct and Pasture.grazing_posture (a TERMINATED contract leaves the committed set)"
          - "increments GrazingContract.version by 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system — the contract's Settlement reaches FINAL"
        actor: system
        preconditions:
          - "contract.lifecycle_status == ACTIVE"
        side_effects:
          - "cascade: the settled CattleLot moves WEIGHED_OUT -> CLOSED"
          - "recompute Pasture.committed_head_days, Pasture.capacity_utilization_pct, Pasture.stocked_head_count and Pasture.grazing_posture"
          - "increments GrazingContract.version by 1"
      - from: EARLY_REMOVAL_PENDING
        to: COMPLETED
        trigger: "system — the contract's Settlement reaches FINAL"
        actor: system
        preconditions:
          - "contract.lifecycle_status == EARLY_REMOVAL_PENDING"
        side_effects:
          - "cascade: the settled CattleLot moves WEIGHED_OUT -> CLOSED"
          - "recompute Pasture.committed_head_days, Pasture.capacity_utilization_pct, Pasture.stocked_head_count and Pasture.grazing_posture"
          - "increments GrazingContract.version by 1"

  # ----------------------------------------------- GrazingContract / billing --
  - entity: GrazingContract
    dimension: billing_status
    initial_state: UNBILLED
    terminal_states: [SETTLED]
    transitions:
      - from: UNBILLED
        to: SETTLEMENT_ISSUED
        trigger: "system — POST /grazing/settlements/{id}/issue on a settlement of this contract"
        actor: system
        preconditions:
          - "contract.billing_status == UNBILLED"
        side_effects:
          - "increments GrazingContract.version by 1"
        note: "Independent of lifecycle_status: a contract may be SETTLEMENT_ISSUED while still ACTIVE, or COMPLETED while still UNBILLED is impossible only because COMPLETED is reached through FINAL."
      - from: SETTLEMENT_ISSUED
        to: UNBILLED
        trigger: "system — POST /grazing/settlements/{id}/void on the issued settlement"
        actor: system
        preconditions:
          - "contract.billing_status == SETTLEMENT_ISSUED"
        side_effects:
          - "increments GrazingContract.version by 1"
      - from: SETTLEMENT_ISSUED
        to: SETTLED
        trigger: "system — the settlement reaches FINAL"
        actor: system
        preconditions:
          - "contract.billing_status == SETTLEMENT_ISSUED"
        side_effects:
          - "increments GrazingContract.version by 1"

  # -------------------------------------------------------------- CattleLot --
  - entity: CattleLot
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: RECEIVING_HELD
        trigger: "system — Pasture.grazing_posture leaves OPEN (cascade link 2 of the critical-ticket and drought cascades)"
        actor: system
        preconditions:
          - "lot.status == SCHEDULED"
          - "the lot's contract.pasture_id == the pasture whose posture just changed"
        side_effects:
          - "increments CattleLot.version by 1"
      - from: RECEIVING_HELD
        to: SCHEDULED
        trigger: "system — Pasture.grazing_posture returns to OPEN"
        actor: system
        preconditions:
          - "lot.status == RECEIVING_HELD"
        side_effects:
          - "increments CattleLot.version by 1"
      - from: SCHEDULED
        to: ON_FEED
        trigger: "POST /grazing/lots/{id}/receive"
        actor: Grazier
        preconditions:
          - "lot.status == SCHEDULED"
          - "X-User-ID == contract.grazier_id"
          - "contract.lifecycle_status == ACTIVE (else ERR_CONTRACT_INVALID_STATE)"
          - "pasture.grazing_posture == OPEN (else ERR_PASTURE_POSTURE_BLOCKED)"
        side_effects:
          - "creates a WeightEvent with event_type = IN carrying the receiving scale ticket"
          - "sets head_count_received, gross_weight_in_lbs, in_date"
          - "computes shrunk_weight_in_lbs via calculations.shrunk_weight"
          - "recompute Pasture.stocked_head_count"
          - "increments CattleLot.version by 1"
      - from: ON_FEED
        to: REMOVAL_SCHEDULED
        trigger: "system — the lot's contract enters EARLY_REMOVAL_PENDING"
        actor: system
        preconditions:
          - "lot.status == ON_FEED"
        side_effects:
          - "sets CattleLot.scheduled_removal_date = contract.early_removal_effective_date"
          - "increments CattleLot.version by 1"
      - from: ON_FEED
        to: WEIGHED_OUT
        trigger: "POST /grazing/lots/{id}/weight-events with event_type = OUT"
        actor: Grazier
        preconditions:
          - "lot.status == ON_FEED"
          - "X-User-ID == contract.grazier_id"
          - "weighed_at falls outside every withdrawal interval of the lot's HealthTreatments with status in {RECORDED, DISPUTED, APPROVED} (else ERR_WITHDRAWAL_PERIOD_ACTIVE)"
          - "head_count <= head_count_received - confirmed_death_head (else ERR_HEAD_COUNT_INCONSISTENT)"
        side_effects:
          - "sets head_count_out, gross_weight_out_lbs, out_date, days_on_feed"
          - "computes shrunk_weight_out_lbs via calculations.shrunk_weight"
          - "recompute Pasture.stocked_head_count"
          - "increments CattleLot.version by 1"
      - from: REMOVAL_SCHEDULED
        to: WEIGHED_OUT
        trigger: "POST /grazing/lots/{id}/weight-events with event_type = OUT"
        actor: Grazier
        preconditions:
          - "lot.status == REMOVAL_SCHEDULED"
          - "same withdrawal-interval and head-count preconditions as the ON_FEED -> WEIGHED_OUT transition"
        side_effects:
          - "same as the ON_FEED -> WEIGHED_OUT transition"
      - from: WEIGHED_OUT
        to: CLOSED
        trigger: "system — the lot's Settlement reaches FINAL"
        actor: system
        preconditions:
          - "lot.status == WEIGHED_OUT"
        side_effects:
          - "recompute Pasture.stocked_head_count"
          - "increments CattleLot.version by 1"

  # --------------------------------------------------------- HealthTreatment --
  - entity: HealthTreatment
    initial_state: RECORDED
    terminal_states: [APPROVED, VOIDED]
    transitions:
      - from: RECORDED
        to: APPROVED
        trigger: "POST /grazing/treatments/{id}/review with decision = APPROVE"
        actor: CattleOwner
        preconditions:
          - "treatment.status == RECORDED"
          - "X-User-ID == contract.cattle_owner_id"
        side_effects:
          - "the treatment's owner_share_cents becomes eligible for Settlement.treatment_charge_cents"
          - "increments HealthTreatment.version by 1"
      - from: RECORDED
        to: DISPUTED
        trigger: "POST /grazing/treatments/{id}/review with decision = DISPUTE"
        actor: CattleOwner
        preconditions:
          - "treatment.status == RECORDED"
          - "X-User-ID == contract.cattle_owner_id"
        side_effects:
          - "the lot can no longer be settled while any treatment is RECORDED or DISPUTED (ERR_OPEN_TREATMENT_REVIEW)"
          - "increments HealthTreatment.version by 1"
      - from: DISPUTED
        to: APPROVED
        trigger: "POST /grazing/treatments/{id}/review with decision = APPROVE"
        actor: CattleOwner
        preconditions:
          - "treatment.status == DISPUTED"
          - "X-User-ID == contract.cattle_owner_id"
        side_effects:
          - "the treatment's owner_share_cents becomes eligible for Settlement.treatment_charge_cents"
          - "increments HealthTreatment.version by 1"
      - from: RECORDED
        to: VOIDED
        trigger: "POST /grazing/treatments/{id}/review with decision = VOID"
        actor: Grazier
        preconditions:
          - "treatment.status == RECORDED"
          - "X-User-ID == contract.grazier_id"
        side_effects:
          - "the treatment is excluded from Settlement.treatment_charge_cents and from every withdrawal-interval check"
          - "increments HealthTreatment.version by 1"
      - from: DISPUTED
        to: VOIDED
        trigger: "POST /grazing/treatments/{id}/review with decision = VOID"
        actor: Grazier
        preconditions:
          - "treatment.status == DISPUTED"
          - "X-User-ID == contract.grazier_id"
        side_effects:
          - "the treatment is excluded from Settlement.treatment_charge_cents and from every withdrawal-interval check"
          - "increments HealthTreatment.version by 1"

  # --------------------------------------------------------- DeathLossReport --
  - entity: DeathLossReport
    initial_state: REPORTED
    terminal_states: [REJECTED, VOIDED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /grazing/death-losses/{id}/review with decision = CONFIRM"
        actor: RangeConsultant
        preconditions:
          - "report.status == REPORTED"
        side_effects:
          - "recompute owner_liable_head, grazier_liable_head and credit_cents for EVERY CONFIRMED report on the lot via the chronological sweep in calculations.death_loss_liability"
          - "recompute CattleLot.confirmed_death_head"
          - "recompute Pasture.stocked_head_count"
          - "increments DeathLossReport.version by 1"
      - from: REPORTED
        to: REJECTED
        trigger: "POST /grazing/death-losses/{id}/review with decision = REJECT"
        actor: RangeConsultant
        preconditions:
          - "report.status == REPORTED"
        side_effects:
          - "no ledger movement; owner_liable_head, grazier_liable_head and credit_cents stay 0"
          - "increments DeathLossReport.version by 1"
      - from: CONFIRMED
        to: VOIDED
        trigger: "POST /grazing/death-losses/{id}/review with decision = VOID"
        actor: Grazier
        preconditions:
          - "report.status == CONFIRMED"
          - "X-User-ID == contract.grazier_id"
          - "the lot's Settlement, if any, has status in {DRAFT, VOID} (a settled lot cannot have its death record rewritten)"
        side_effects:
          - "sets this report's owner_liable_head, grazier_liable_head and credit_cents to 0"
          - "recompute the chronological sweep for the remaining CONFIRMED reports on the lot"
          - "recompute CattleLot.confirmed_death_head"
          - "recompute Pasture.stocked_head_count — restoring it to its pre-CONFIRM value (head-count conservation invariant)"
          - "increments DeathLossReport.version by 1"

  # ----------------------------------------------------- InfrastructureTicket --
  - entity: InfrastructureTicket
    initial_state: OPEN
    terminal_states: [BILLED]
    transitions:
      - from: OPEN
        to: ASSIGNED_GRAZIER
        trigger: "POST /grazing/infrastructure-tickets/{id}/assign with repair_party = GRAZIER"
        actor: Grazier
        preconditions:
          - "ticket.status == OPEN"
          - "X-User-ID == pasture.grazier_id"
        side_effects:
          - "sets repair_party = GRAZIER"
          - "increments InfrastructureTicket.version by 1"
      - from: OPEN
        to: ASSIGNED_OWNER
        trigger: "POST /grazing/infrastructure-tickets/{id}/assign with repair_party = OWNER"
        actor: Grazier
        preconditions:
          - "ticket.status == OPEN"
          - "X-User-ID == pasture.grazier_id"
        side_effects:
          - "sets repair_party = OWNER"
          - "increments InfrastructureTicket.version by 1"
      - from: ASSIGNED_GRAZIER
        to: REPAIRED
        trigger: "POST /grazing/infrastructure-tickets/{id}/complete"
        actor: Grazier
        preconditions:
          - "ticket.status == ASSIGNED_GRAZIER"
          - "X-User-ID == pasture.grazier_id"
        side_effects:
          - "GRAZIER branch: owner_share_cents = matrix_owner_share_cents (a positive charge to the owner); grazier_share_cents = repair_cost_cents - matrix_owner_share_cents"
          - "recompute Pasture.open_critical_ticket_count"
          - "cascade: Pasture.grazing_posture recomputed; if it returns to OPEN every CattleLot on the pasture with status == RECEIVING_HELD moves back to SCHEDULED"
          - "increments InfrastructureTicket.version by 1"
      - from: ASSIGNED_OWNER
        to: REPAIRED
        trigger: "POST /grazing/infrastructure-tickets/{id}/complete"
        actor: CattleOwner
        preconditions:
          - "ticket.status == ASSIGNED_OWNER"
          - "X-User-ID == contract.cattle_owner_id"
        side_effects:
          - "OWNER branch: owner_share_cents = -(repair_cost_cents - matrix_owner_share_cents) (a NEGATIVE settlement line — the grazier reimburses the owner); grazier_share_cents = repair_cost_cents - matrix_owner_share_cents"
          - "recompute Pasture.open_critical_ticket_count"
          - "cascade: Pasture.grazing_posture recomputed; if it returns to OPEN every CattleLot on the pasture with status == RECEIVING_HELD moves back to SCHEDULED"
          - "increments InfrastructureTicket.version by 1"
      - from: REPAIRED
        to: BILLED
        trigger: "system — a Settlement on this ticket's contract is issued"
        actor: system
        preconditions:
          - "ticket.status == REPAIRED"
          - "ticket.contract_id == the settled contract"
        side_effects:
          - "increments InfrastructureTicket.version by 1"

  # ------------------------------------------------------------- Settlement --
  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [FINAL, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /grazing/settlements/{id}/issue"
        actor: Grazier
        preconditions:
          - "settlement.status == DRAFT"
          - "X-User-ID == contract.grazier_id"
        side_effects:
          - "stamps issued_at from the logical clock (starts the DISPUTE_WINDOW_DAYS (= 10) window)"
          - "cascade link 1: recompute CattleOwner.open_settlement_balance_cents and CattleOwner.credit_status"
          - "cascade link 2: if credit_status flips to DELINQUENT, every GrazingContract of that owner in PENDING_SIGNATURE moves to SUSPENDED"
          - "GrazingContract.billing_status UNBILLED -> SETTLEMENT_ISSUED"
          - "every InfrastructureTicket on the contract with status == REPAIRED moves to BILLED"
          - "increments Settlement.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /grazing/settlements/{id}/void"
        actor: Grazier
        preconditions:
          - "settlement.status == DRAFT"
          - "X-User-ID == contract.grazier_id"
        side_effects:
          - "stores void_reason"
          - "increments Settlement.version by 1"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /grazing/settlements/{id}/dispute"
        actor: CattleOwner
        preconditions:
          - "settlement.status == ISSUED"
          - "X-User-ID == contract.cattle_owner_id"
          - "current logical clock <= issued_at + DISPUTE_WINDOW_DAYS (= 10) (else ERR_DISPUTE_WINDOW_CLOSED)"
          - "settlement.dispute_round < MAX_DISPUTE_ROUNDS (else ERR_DISPUTE_ROUNDS_EXHAUSTED)"
        side_effects:
          - "increments dispute_round by 1; stores disputed_field, claimed_shrunk_gain_lbs, dispute_note; stamps dispute_opened_at"
          - "increments Settlement.version by 1"
      - from: ISSUED
        to: FINAL
        trigger: "POST /grazing/settlements/{id}/finalize"
        actor: Grazier | CattleOwner
        preconditions:
          - "settlement.status == ISSUED"
          - "acting CattleOwner must be contract.cattle_owner_id; acting Grazier must be contract.grazier_id"
          - "when the actor is Grazier, current logical clock >= issued_at + DISPUTE_WINDOW_DAYS (= 10) (else ERR_DISPUTE_WINDOW_OPEN); a CattleOwner may accept at any time inside the window"
        side_effects:
          - "cascade link 1: GrazingContract.billing_status SETTLEMENT_ISSUED -> SETTLED and lifecycle_status {ACTIVE, EARLY_REMOVAL_PENDING} -> COMPLETED"
          - "cascade link 2: the settled CattleLot moves WEIGHED_OUT -> CLOSED"
          - "cascade link 3: Pasture.committed_head_days, capacity_utilization_pct, stocked_head_count and grazing_posture recomputed"
          - "recompute CattleOwner.open_settlement_balance_cents and CattleOwner.credit_status"
          - "increments Settlement.version by 1"
      - from: ISSUED
        to: VOID
        trigger: "POST /grazing/settlements/{id}/void"
        actor: Grazier
        preconditions:
          - "settlement.status == ISSUED"
          - "X-User-ID == contract.grazier_id"
        side_effects:
          - "stores void_reason"
          - "compensating cascade link 1: recompute CattleOwner.open_settlement_balance_cents (this settlement leaves the sum) and CattleOwner.credit_status"
          - "compensating cascade link 2: if credit_status returns to GOOD_STANDING, every GrazingContract of that owner in SUSPENDED moves back to PENDING_SIGNATURE"
          - "GrazingContract.billing_status SETTLEMENT_ISSUED -> UNBILLED"
          - "increments Settlement.version by 1"
      - from: DISPUTED
        to: ADJUDICATED
        trigger: "POST /grazing/settlements/{id}/adjudicate"
        actor: RangeConsultant
        preconditions:
          - "settlement.status == DISPUTED"
          - "X-User-ID != the assessor_id of the pasture's effective CapacityAssessment (else ERR_ADJUDICATOR_CONFLICT)"
        side_effects:
          - "stores adjudicator_id (= X-User-ID), resolution and adjudication_note"
          - "sets gain_method from the resolution: UPHELD_GRAZIER -> PROVISIONAL_PRORATED, UPHELD_OWNER -> FINAL_ADJUDICATED, SPLIT_MIDPOINT -> SPLIT_MIDPOINT"
          - "recomputes adjusted_in_weight_lbs, shrunk_gain_lbs, average_daily_gain, base_charge_cents, subtotal_cents, early_removal_adjustment_cents, volume_rebate_cents and total_due_cents"
          - "recompute CattleOwner.open_settlement_balance_cents and CattleOwner.credit_status"
          - "increments Settlement.version by 1"
      - from: ADJUDICATED
        to: ISSUED
        trigger: "POST /grazing/settlements/{id}/reissue"
        actor: Grazier
        preconditions:
          - "settlement.status == ADJUDICATED"
          - "X-User-ID == contract.grazier_id"
        side_effects:
          - "restamps issued_at from the logical clock, restarting the dispute window (this closes the negotiation cycle ISSUED -> DISPUTED -> ADJUDICATED -> ISSUED)"
          - "dispute_round is NOT changed by reissue; only dispute increments it"
          - "increments Settlement.version by 1"
      - from: ADJUDICATED
        to: FINAL
        trigger: "POST /grazing/settlements/{id}/finalize"
        actor: Grazier | CattleOwner
        preconditions:
          - "settlement.status == ADJUDICATED"
          - "acting CattleOwner must be contract.cattle_owner_id; acting Grazier must be contract.grazier_id"
        side_effects:
          - "same cascade as the ISSUED -> FINAL transition"
        note: "No dispute-window gate applies from ADJUDICATED — a ruling has already been rendered."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: assessment-create-stale-pasture
    parent_entity: Pasture
    write_endpoint: "POST /grazing/pastures/{id}/capacity-assessments"
    occ_field: "expected_pasture_version"
    description: |
      Filing a CapacityAssessment against a Pasture whose version has advanced since
      the client last read it is rejected. A newly filed assessment legitimately
      supersedes the prior effective one and rewrites rated_aum and rated_head_days,
      so a writer holding a stale view of the pasture would be re-rating a capacity
      picture that no longer exists.
    error_id: ERR_STALE_PASTURE_VERSION
    http_status: 412

  - rule_id: settlement-create-stale-contract
    parent_entity: GrazingContract
    write_endpoint: "POST /grazing/settlements"
    occ_field: "expected_contract_version"
    description: |
      Drafting a Settlement against a GrazingContract whose version has advanced since
      the client last read it is rejected. A new settlement legitimately supersedes a
      voided predecessor and re-freezes the contract's billing dimension, so a writer
      whose view of the contract predates the void (or predates a cascaded lifecycle
      move) would be pricing against superseded terms.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
# Global rounding convention: `round_half_up(x, n)` rounds x to n decimal places
# using ROUND_HALF_UP (0.5 always rounds away from zero). Money is integer cents.
# Weights are whole pounds. Percentages are 2 decimals. ADG is 4 decimals.
calculations:

  - name: capacity_assessment_rating
    trigger: "POST /grazing/pastures/{id}/capacity-assessments"
    algorithm: weighted_scoring
    formula: |
      # base = DRY_MATTER method
      usable_forage_lbs = pasture.acres * assessment.forage_dry_matter_lbs_per_acre
                          * (assessment.utilization_pct / 100)
      rated_aum        = round_half_up(usable_forage_lbs / AUM_DEMAND_LBS_PER_MONTH, 2)
      rated_head_days  = floor(usable_forage_lbs / DAILY_DEMAND_LBS)
    input_set: |
      Reads only pasture.acres plus the two assessment inputs. Prior assessments are
      never averaged in. After the row is written, Pasture.effective_assessment_id is
      re-selected as the CapacityAssessment on that pasture with the greatest
      assessment_date; when two share the greatest assessment_date the one with the
      greater created_at wins; Pasture.rated_aum and Pasture.rated_head_days are
      copied from that row.
    constants:
      AUM_DEMAND_LBS_PER_MONTH: 790
      DAILY_DEMAND_LBS: 26
      HISTORY_SAFETY_FACTOR: 0.85
      DAYS_PER_MONTH: 30.4
    precision: "rated_aum: 2 decimal places round_half_up; rated_head_days: integer, floor"
    variants:
      - name: DRY_MATTER
        when: "assessment.method == DRY_MATTER"
        difference: "The base formula above. forage_dry_matter_lbs_per_acre is required."
      - name: STOCKING_HISTORY
        when: "assessment.method == STOCKING_HISTORY"
        difference: |
          Ignores forage_dry_matter_lbs_per_acre, acres and utilization_pct entirely and
          rates the unit off last season's realised carry:
            rated_head_days = floor(pasture.prior_season_head_days * HISTORY_SAFETY_FACTOR)
            rated_aum       = round_half_up(pasture.prior_season_head_days
                                            * HISTORY_SAFETY_FACTOR / DAYS_PER_MONTH, 2)
          For acres=1200, forage=1800, utilization=25, prior_season_head_days=5000 the two
          methods disagree: DRY_MATTER gives rated_aum 683.54 / rated_head_days 20769,
          STOCKING_HISTORY gives rated_aum 139.80 / rated_head_days 4250.

  - name: pasture_grazing_posture
    trigger: "recomputed after any mutation of Pasture.operational_status, Pasture.drought_destock_flag, Pasture.open_critical_ticket_count or Pasture.capacity_utilization_pct"
    algorithm: constraint_propagation
    formula: |
      capacity_utilization_pct =
          0 if pasture.rated_head_days == 0
          else round_half_up(pasture.committed_head_days / pasture.rated_head_days * 100, 2)

      # fixed precedence — first match wins
      if pasture.operational_status == CLOSED:            grazing_posture = CLOSED
      elif pasture.drought_destock_flag == true:          grazing_posture = DESTOCK_ORDERED
      elif pasture.open_critical_ticket_count > 0
           or capacity_utilization_pct > 100:             grazing_posture = RESTRICTED
      else:                                               grazing_posture = OPEN
    input_set: |
      committed_head_days sums GrazingContract.committed_head_days over contracts on this
      pasture with lifecycle_status IN {PENDING_SIGNATURE, ACTIVE, EARLY_REMOVAL_PENDING}
      (DRAFT, SUSPENDED, COMPLETED and TERMINATED contracts are excluded).
      open_critical_ticket_count counts InfrastructureTickets on this pasture with
      severity == CRITICAL and status IN {OPEN, ASSIGNED_GRAZIER, ASSIGNED_OWNER}.
    constants: {}
    precision: "capacity_utilization_pct: 2 decimal places round_half_up"

  - name: shrunk_weight
    trigger: "POST /grazing/lots/{id}/receive (IN event) and POST /grazing/lots/{id}/weight-events (INTERIM and OUT events)"
    algorithm: aggregation
    formula: |
      shrink_pct_applied = contract.shrink_pct      if event_type == IN
                           contract.out_shrink_pct  if event_type in {INTERIM, OUT}

      # PINNED ROUNDING ORDER: shrink is applied to the LOT-LEVEL gross weight and the
      # product is rounded ONCE to whole pounds. Dividing by head, rounding a per-head
      # shrunk weight and multiplying back is explicitly NOT the rule.
      shrunk_weight_lbs = round_half_up(gross_weight_lbs * (1 - shrink_pct_applied / 100), 0)
    input_set: |
      One scale ticket at a time. head_count is recorded on the WeightEvent but never
      participates in the shrink arithmetic.
    constants: {}
    precision: "whole pounds, round_half_up"
    variants:
      - name: LOT_LEVEL_ROUNDING
        when: "always — this is the pinned order"
        difference: |
          gross 63745 lb at shrink 3.5% over 150 head yields 61514 lb.
        note_on_rejected_order: |
          The per-head-then-multiply order (63745/150 = 424.9666.. -> shrink -> 410 -> x150)
          yields 61500 lb, a 14 lb divergence. Implementations MUST produce 61514.

  - name: treatment_cost_allocation
    trigger: "POST /grazing/lots/{id}/treatments"
    algorithm: tiered_pricing
    formula: |
      total_cost_cents = drug_cost_cents + labor_cost_cents

      owner_share_pct =
          100 - contract.treatment_cost_split_pct   if classification == ROUTINE_PROTOCOL
          100                                       if classification == THERAPEUTIC
          0                                         if classification == PREVENTIVE_EMERGENCY

      # PINNED: the OWNER side is the rounded side; the grazier absorbs the residual cent.
      owner_share_cents   = round_half_up(total_cost_cents * owner_share_pct / 100, 0)
      grazier_share_cents = total_cost_cents - owner_share_cents
    input_set: "One treatment row at a time; the contract supplies treatment_cost_split_pct."
    constants: {}
    precision: "integer cents, round_half_up on the owner side only"
    variants:
      - name: ROUND_PER_TREATMENT_THEN_SUM
        when: "Settlement.treatment_charge_cents aggregates the lot's APPROVED treatments"
        difference: |
          treatment_charge_cents = sum over HealthTreatment t on the lot with
          t.status == APPROVED of t.owner_share_cents — i.e. each row is rounded when it
          is recorded and the settlement sums the ALREADY-ROUNDED values.
        note_on_rejected_order: |
          With treatment_cost_split_pct = 33 and rows (1625 ROUTINE, 1250 ROUTINE,
          5700 THERAPEUTIC) the pinned order gives 1089 + 838 + 5700 = 7627 cents.
          Summing first and rounding once ((1625+1250) * 0.67 = 1926.25 -> 1926, + 5700)
          gives 7626 — one cent low. Implementations MUST produce 7627.

  - name: death_loss_liability
    trigger: "POST /grazing/death-losses/{id}/review with decision CONFIRM or VOID — the sweep is re-run over every CONFIRMED report on the lot"
    algorithm: chronological
    formula: |
      # Ordered sweep. Sort the lot's CONFIRMED DeathLossReports by death_date ASC,
      # tie-break created_at ASC. `running_head` starts at 0 and accumulates head_lost
      # of the rows already swept.
      threshold_head = floor(lot.head_count_received * contract.death_loss_threshold_pct / 100)

      for each report r in sweep order:
          if r.cause == INFRASTRUCTURE_FAILURE:
              # override — a failed water or fence is always the grazier's exposure
              r.owner_liable_head   = 0
              r.grazier_liable_head = r.head_lost
          elif contract.death_loss_terms == OWNER_BEARS_ALL:
              r.owner_liable_head   = r.head_lost
              r.grazier_liable_head = 0
          else:   # GRAZIER_SHARE_ABOVE_THRESHOLD
              r.owner_liable_head   = min(r.head_lost, max(0, threshold_head - running_head))
              r.grazier_liable_head = r.head_lost - r.owner_liable_head
          r.credit_cents = round_half_up(r.grazier_liable_head
                                         * contract.head_value_cents
                                         * DEATH_CREDIT_PCT / 100, 0)
          running_head += r.head_lost      # every confirmed head counts toward the run,
                                           # including INFRASTRUCTURE_FAILURE head
    input_set: |
      Only DeathLossReports with status == CONFIRMED enter the sweep, in death_date ASC
      order with created_at ASC as the tie-break. REPORTED, REJECTED and VOIDED rows are
      excluded and carry owner_liable_head = grazier_liable_head = credit_cents = 0.
      A single report may straddle the threshold and split its head between the parties.
    constants:
      DEATH_CREDIT_PCT: 60
    precision: "integer cents, round_half_up; head counts are integers"
    variants:
      - name: OWNER_BEARS_ALL
        when: "contract.death_loss_terms == OWNER_BEARS_ALL"
        difference: "Every non-INFRASTRUCTURE_FAILURE head is owner-liable; credit_cents is 0 for those rows regardless of how many head die."
      - name: GRAZIER_SHARE_ABOVE_THRESHOLD
        when: "contract.death_loss_terms == GRAZIER_SHARE_ABOVE_THRESHOLD"
        difference: |
          The owner absorbs the first `threshold_head` head chronologically; everything
          above is grazier-liable at DEATH_CREDIT_PCT of head_value_cents. For 150 head
          received, threshold 2.0% (threshold_head = 3), head_value 140000 and reports
          (2026-08-20 x2 DISEASE, 2026-09-05 x2 DISEASE) the split is 2/0 then 1/1, and
          death_loss_credit_cents totals 84000. Under OWNER_BEARS_ALL the same two
          reports produce 0.

  - name: infrastructure_cost_allocation
    trigger: "POST /grazing/infrastructure-tickets/{id}/complete"
    algorithm: waterfall_allocation
    formula: |
      base_party = contract.water_responsibility  if ticket.asset_type == WATER
                   contract.fence_responsibility  if ticket.asset_type == FENCE

      # cause overrides beat the matrix
      responsible_party = OWNER    if ticket.cause == LIVESTOCK_DAMAGE
                          GRAZIER  if ticket.cause == NEGLECT
                          base_party otherwise            # WEAR, STORM

      raw_owner_share_cents = 0                                                  if responsible_party == GRAZIER
                              repair_cost_cents                                  if responsible_party == OWNER
                              round_half_up(repair_cost_cents
                                            * INFRA_SHARED_OWNER_PCT / 100, 0)   if responsible_party == SHARED

      matrix_owner_share_cents   = min(raw_owner_share_cents,
                                       contract.infrastructure_owner_cap_cents)
      matrix_grazier_share_cents = repair_cost_cents - matrix_owner_share_cents

      # divergent per-branch assignment
      if ticket.status (before this call) == ASSIGNED_GRAZIER:
          owner_share_cents   = matrix_owner_share_cents          # positive charge
      else:  # ASSIGNED_OWNER — the owner already paid the vendor
          owner_share_cents   = -matrix_grazier_share_cents       # negative: a credit
      grazier_share_cents = matrix_grazier_share_cents
    input_set: "One ticket; the governing contract supplies the responsibility matrix and the per-ticket owner cap."
    constants:
      INFRA_SHARED_OWNER_PCT: 50
    precision: "integer cents, round_half_up"

  - name: drought_trigger
    trigger: "POST /grazing/pastures/{id}/drought-readings"
    algorithm: threshold
    formula: |
      # Order the pasture's DroughtReadings by reading_date DESC, tie-break created_at DESC,
      # starting with the row just written.
      consecutive_severe_count = length of the unbroken leading run of readings whose
                                 drought_index >= DROUGHT_SEVERE_INDEX

      triggered_destock =
          true  if pasture.drought_destock_flag == false
                and ( consecutive_severe_count >= DROUGHT_CONSECUTIVE_REQUIRED
                      or this_reading.forage_remaining_pct <= DROUGHT_FORAGE_FLOOR_PCT )
          false otherwise

      if triggered_destock:
          pasture.drought_destock_flag = true
      elif pasture.drought_destock_flag == true
           and this_reading.drought_index <= DROUGHT_RECOVERY_INDEX
           and this_reading.forage_remaining_pct > DROUGHT_FORAGE_FLOOR_PCT:
          pasture.drought_destock_flag = false      # recovery
    input_set: |
      Every DroughtReading on the pasture participates in the run count; the run is read
      backwards from the newest reading_date and stops at the first row with
      drought_index < DROUGHT_SEVERE_INDEX.
    constants:
      DROUGHT_SEVERE_INDEX: 3
      DROUGHT_CONSECUTIVE_REQUIRED: 2
      DROUGHT_FORAGE_FLOOR_PCT: 20
      DROUGHT_RECOVERY_INDEX: 1
      DROUGHT_NOTICE_DAYS: 15
    precision: "integer comparisons; forage_remaining_pct compared at 2 decimal places"
    variants:
      - name: CONSECUTIVE_RUN_TRIGGER
        when: "consecutive_severe_count >= 2"
        difference: "A single reading at index 3 does not trigger; the second consecutive one does. Index 2 breaks the run."
      - name: FORAGE_FLOOR_TRIGGER
        when: "forage_remaining_pct <= 20 on a single reading"
        difference: "Fires on the first reading regardless of drought_index and regardless of the run length; 20.00 triggers, 20.01 does not."

  - name: settlement_gain
    trigger: "POST /grazing/settlements (initial computation) and POST /grazing/settlements/{id}/adjudicate (recomputation under the ruled method)"
    algorithm: forward_looking
    formula: |
      shrunk_in  = lot.shrunk_weight_in_lbs
      shrunk_out = lot.shrunk_weight_out_lbs
      head_recv  = lot.head_count_received
      head_out   = lot.head_count_out

      # PROVISIONAL_PRORATED — the grazier's book: value the head that walked off at the
      # lot's AVERAGE IN weight.
      avg_in_per_head        = shrunk_in / head_recv                 # unrounded
      adjusted_in_weight_lbs = round_half_up(avg_in_per_head * head_out, 0)
      shrunk_gain_lbs        = shrunk_out - adjusted_in_weight_lbs

      average_daily_gain = round_half_up(shrunk_gain_lbs
                                         / (head_out * lot.days_on_feed), 4)
    input_set: |
      Exactly one IN WeightEvent and exactly one OUT WeightEvent on the lot. INTERIM
      events are recorded for the owner's information and are never read by this rule.
    constants: {}
    precision: "adjusted_in_weight_lbs and shrunk_gain_lbs: whole pounds round_half_up; average_daily_gain: 4 decimals round_half_up"
    variants:
      - name: PROVISIONAL_PRORATED
        when: "settlement.gain_method == PROVISIONAL_PRORATED (creation, and after an UPHELD_GRAZIER ruling)"
        difference: "The base formula. For shrunk_in 61514 / 150 head received and 146 head out at shrunk_out 74970, adjusted_in = 59874 and shrunk_gain_lbs = 15096."
      - name: FINAL_ADJUDICATED
        when: "settlement.gain_method == FINAL_ADJUDICATED (after an UPHELD_OWNER ruling)"
        difference: |
          The owner's book: deduct the missing head at the lot's AVERAGE OUT weight
          instead of its average IN weight.
            avg_out_per_head       = shrunk_out / head_out
            adjusted_in_weight_lbs = round_half_up(shrunk_in
                                                   - avg_out_per_head * (head_recv - head_out), 0)
            shrunk_gain_lbs        = shrunk_out - adjusted_in_weight_lbs
          On the same figures adjusted_in = 59460 and shrunk_gain_lbs = 15510 — 414 lb
          more gain than PROVISIONAL_PRORATED on identical scale tickets.
      - name: SPLIT_MIDPOINT
        when: "settlement.gain_method == SPLIT_MIDPOINT (after a SPLIT_MIDPOINT ruling)"
        difference: |
          shrunk_gain_lbs = round_half_up((provisional_gain_lbs
                                           + settlement.claimed_shrunk_gain_lbs) / 2, 0)
          and adjusted_in_weight_lbs = shrunk_out - shrunk_gain_lbs. On the same figures
          with a claim of 15400 lb the midpoint is 15248 lb.

  - name: settlement_base_charge
    trigger: "POST /grazing/settlements and POST /grazing/settlements/{id}/adjudicate"
    algorithm: tiered_pricing
    formula: |
      if contract.billing_mode == PER_HEAD_PER_DAY:
          # dead head stop accruing on their death_date
          raw_head_days = lot.head_count_received * lot.days_on_feed
                          - sum over CONFIRMED DeathLossReport d on the lot of
                              ( d.head_lost * floor((lot.out_date - d.death_date) in days) )
          billable_head_days = max(raw_head_days,
                                   contract.head_count_committed * contract.min_days)
          base_charge_cents  = round_half_up(billable_head_days * contract.rate_cents, 0)

      else:   # PER_POUND_OF_GAIN
          billable_head_days = 0
          adg = settlement.average_daily_gain          # already rounded to 4 decimals
          tier_multiplier = ADG_TIER_1_MULT if adg <  ADG_TIER_2_FLOOR
                            ADG_TIER_2_MULT if adg >= ADG_TIER_2_FLOOR and adg < ADG_TIER_3_FLOOR
                            ADG_TIER_3_MULT if adg >= ADG_TIER_3_FLOOR
          capped_gain_lbs = min(settlement.shrunk_gain_lbs,
                                contract.head_count_committed * GAIN_CAP_LBS_PER_HEAD)
          base_charge_cents = round_half_up(capped_gain_lbs
                                            * contract.rate_cents * tier_multiplier, 0)
    input_set: |
      One lot. The head-day deduction reads only CONFIRMED DeathLossReports; REPORTED,
      REJECTED and VOIDED rows never reduce head-days. The min-days floor uses
      head_count_committed (the contracted head), never head_count_received.
    constants:
      ADG_TIER_2_FLOOR: 1.50
      ADG_TIER_3_FLOOR: 2.25
      ADG_TIER_1_MULT: 1.00
      ADG_TIER_2_MULT: 1.10
      ADG_TIER_3_MULT: 1.20
      GAIN_CAP_LBS_PER_HEAD: 250
    precision: "integer cents, round_half_up; tier selection uses the 4-decimal average_daily_gain"

  - name: settlement_total
    trigger: "POST /grazing/settlements and POST /grazing/settlements/{id}/adjudicate"
    algorithm: waterfall_allocation
    formula: |
      # STRICTLY ORDERED — each step reads only values produced by earlier steps.
      # 1
      base_charge_cents           = calculations.settlement_base_charge
      # 2  round-per-treatment then sum
      treatment_charge_cents      = sum of t.owner_share_cents over the lot's
                                    HealthTreatments with status == APPROVED
      # 3  signed; the OWNER-repair branch contributes negative values
      infrastructure_charge_cents = sum of k.owner_share_cents over InfrastructureTickets
                                    with contract_id == settlement.contract_id and
                                    status IN {REPAIRED, BILLED}
      # 4
      death_loss_credit_cents     = sum of d.credit_cents over the lot's
                                    DeathLossReports with status == CONFIRMED
      # 5
      subtotal_cents = base_charge_cents + treatment_charge_cents
                       + infrastructure_charge_cents - death_loss_credit_cents
      # 6  signed adjustment keyed on the contract's early-removal reason
      early_removal_adjustment_cents =
          -round_half_up(subtotal_cents * DROUGHT_WAIVER_PCT / 100, 0)        if reason == DROUGHT
          +round_half_up(subtotal_cents * OWNER_EARLY_PENALTY_PCT / 100, 0)   if reason == OWNER_ELECTED
          -round_half_up(subtotal_cents * GRAZIER_EARLY_CREDIT_PCT / 100, 0)  if reason == GRAZIER_ELECTED
          0                                                                   if reason is null
      # 7  THE REBATE TIER IS KEYED ON rebate_base, NOT ON total_due_cents
      rebate_base_cents = subtotal_cents + early_removal_adjustment_cents
      rebate_pct = 0.0 if rebate_base_cents <  REBATE_TIER_1_FLOOR
                   1.0 if REBATE_TIER_1_FLOOR <= rebate_base_cents < REBATE_TIER_2_FLOOR
                   2.0 if rebate_base_cents >= REBATE_TIER_2_FLOOR
      volume_rebate_cents = round_half_up(rebate_base_cents * rebate_pct / 100, 0)
      # 8
      total_due_cents = subtotal_cents + early_removal_adjustment_cents - volume_rebate_cents
    input_set: |
      Steps 2-4 are aggregations with explicit status filters; no other rows contribute.
      Step 7 is the circular-looking term: the rebate percentage is a function of a
      figure the rebate itself reduces. The evaluation order above pins it to the
      PRE-rebate base. Worked contrast: rebate_base 1508800 sits in the 2.0% tier, so
      volume_rebate_cents = 30176 and total_due_cents = 1478624 — even though 1478624
      itself falls in the 1.0% tier. Keying the tier on total_due_cents (30176 -> 15088)
      is explicitly wrong.
    constants:
      DROUGHT_WAIVER_PCT: 5
      OWNER_EARLY_PENALTY_PCT: 8
      GRAZIER_EARLY_CREDIT_PCT: 10
      REBATE_TIER_1_FLOOR: 500000
      REBATE_TIER_2_FLOOR: 1500000
    precision: "integer cents, round_half_up at every rounding site"

  - name: owner_open_balance
    trigger: "recomputed after every Settlement status change (issue, dispute, adjudicate, reissue, finalize, void)"
    algorithm: aggregation
    formula: |
      open_settlement_balance_cents =
          sum of s.total_due_cents over every Settlement s whose
          s.status IN {ISSUED, DISPUTED, ADJUDICATED, FINAL}
          and whose contract.cattle_owner_id == owner.id

      credit_status = DELINQUENT      if open_settlement_balance_cents > owner.credit_limit_cents
                      GOOD_STANDING   otherwise
    input_set: |
      DRAFT and VOID settlements are excluded. The comparison is strict `>`: a balance
      exactly equal to credit_limit_cents leaves the owner in GOOD_STANDING.
    constants: {}
    precision: "integer cents; no rounding — the sum is over already-rounded totals"

  - name: grazing_window_conflict
    trigger: "POST /grazing/contracts/{id}/sign"
    algorithm: interval_merge
    formula: |
      # Windows are HALF-OPEN [start_date, end_date) AND carry a mandatory rest period.
      # For each other contract `o` on the same pasture with
      # o.lifecycle_status IN {ACTIVE, EARLY_REMOVAL_PENDING}:
      overlaps = (new.start_date < o.end_date) and (o.start_date < new.end_date)

      gap_after  = (new.start_date - o.end_date) in whole days     # positive when new follows o
      gap_before = (o.start_date - new.end_date) in whole days     # positive when new precedes o

      conflict = overlaps
                 or (gap_after  >= 0 and gap_after  < REST_DAYS_BUFFER)
                 or (gap_before >= 0 and gap_before < REST_DAYS_BUFFER)

      if any conflict -> ERR_GRAZING_WINDOW_OVERLAP
    input_set: |
      Only ACTIVE and EARLY_REMOVAL_PENDING contracts on the same pasture occupy the
      window. DRAFT, PENDING_SIGNATURE, SUSPENDED, COMPLETED and TERMINATED contracts are
      invisible to this check.
    constants:
      REST_DAYS_BUFFER: 14
    precision: "whole days; boundaries are exact — a 14-day gap is accepted, a 13-day gap is rejected"

# =============================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the FIRST failing rule determines the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header is present and is one of Grazier, CattleOwner, RangeConsultant, PlatformAdmin"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "for the entity_backed roles (Grazier, CattleOwner, RangeConsultant) X-User-ID is present and resolves to an existing row of that entity type"
    error_id: ERR_PARTY_NOT_FOUND
    http_status: 404
    applies_to: "all except POST /grazing/graziers, POST /grazing/cattle-owners, POST /grazing/range-consultants, POST /_clock/set_current_utc"

  - priority: 4
    category: existence
    check: "every id in the request path resolves, validated left-to-right"
    error_id: "ERR_PASTURE_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_LOT_NOT_FOUND | ERR_TREATMENT_NOT_FOUND | ERR_DEATH_LOSS_NOT_FOUND | ERR_TICKET_NOT_FOUND | ERR_SETTLEMENT_NOT_FOUND | ERR_PARTY_NOT_FOUND"
    http_status: 404
    applies_to: "every path-parameterised endpoint"

  - priority: 5
    category: existence
    check: "every id carried in the request body resolves (cattle_owner_id, pasture_id, contract_id, lot_id)"
    error_id: "ERR_PARTY_NOT_FOUND | ERR_PASTURE_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_LOT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /grazing/contracts, POST /grazing/infrastructure-tickets, POST /grazing/settlements"

  - priority: 6
    category: business_constraint
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every list endpoint"

  - priority: 7
    category: business_constraint
    check: "the request body carries every required field, every enum value is a declared member, and every numeric field satisfies its declared range (acres > 0, utilization_pct in (0, 60], shrink_pct in [0, 10], drought_index in [0, 5], head counts and weights > 0, event_type on POST /grazing/lots/{id}/weight-events restricted to INTERIM or OUT)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "every write endpoint"

  - priority: 8
    category: auth
    check: "the acting entity_backed principal owns the target: Grazier == pasture.grazier_id or contract.grazier_id; CattleOwner == contract.cattle_owner_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "every resource-scoped write endpoint"

  - priority: 9
    category: state
    check: "expected_pasture_version / expected_contract_version equals the parent's current version"
    error_id: "ERR_STALE_PASTURE_VERSION | ERR_STALE_CONTRACT_VERSION"
    http_status: 412
    applies_to: "POST /grazing/pastures/{id}/capacity-assessments, POST /grazing/settlements"

  - priority: 10
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2 (this rule covers the acting contract's lifecycle_status when a child operation names it as a precondition)"
    error_id: "ERR_PASTURE_INVALID_STATE | ERR_CONTRACT_INVALID_STATE | ERR_LOT_INVALID_STATE | ERR_TREATMENT_INVALID_STATE | ERR_DEATH_LOSS_INVALID_STATE | ERR_TICKET_INVALID_STATE | ERR_SETTLEMENT_INVALID_STATE"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 11
    category: business_safety
    check: "an OUT weight event's weighed_at date does not fall inside the CLOSED interval [treatment_date, treatment_date + withdrawal_days] of any HealthTreatment on the lot with status in {RECORDED, DISPUTED, APPROVED}"
    error_id: ERR_WITHDRAWAL_PERIOD_ACTIVE
    http_status: 409
    applies_to: "POST /grazing/lots/{id}/weight-events"

  - priority: 12
    category: business_safety
    check: "pasture.grazing_posture == OPEN"
    error_id: ERR_PASTURE_POSTURE_BLOCKED
    http_status: 409
    applies_to: "POST /grazing/contracts/{id}/lots, POST /grazing/lots/{id}/receive"

  - priority: 13
    category: business_safety
    check: "the adjudicating RangeConsultant is not the assessor_id of the pasture's effective CapacityAssessment (segregation of duties)"
    error_id: ERR_ADJUDICATOR_CONFLICT
    http_status: 403
    applies_to: "POST /grazing/settlements/{id}/adjudicate"

  - priority: 14
    category: business_referential
    check: "the contract's pasture has operational_status == AVAILABLE"
    error_id: ERR_PASTURE_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /grazing/contracts/{id}/submit"

  - priority: 15
    category: business_referential
    check: "the pasture has at least one CapacityAssessment before it may be moved to AVAILABLE (empty-set rejection)"
    error_id: ERR_NO_CAPACITY_ASSESSMENT
    http_status: 409
    applies_to: "POST /grazing/pastures/{id}/status"

  - priority: 16
    category: business_temporal
    check: "no conflict under calculations.grazing_window_conflict against the pasture's ACTIVE and EARLY_REMOVAL_PENDING contracts"
    error_id: ERR_GRAZING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /grazing/contracts/{id}/sign"

  - priority: 17
    category: business_temporal
    check: "the dispute window is still open: current logical clock <= settlement.issued_at + DISPUTE_WINDOW_DAYS (= 10)"
    error_id: ERR_DISPUTE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /grazing/settlements/{id}/dispute"

  - priority: 18
    category: business_temporal
    check: "a Grazier finalizing a settlement in status ISSUED must wait out the window: current logical clock >= settlement.issued_at + DISPUTE_WINDOW_DAYS (= 10). A CattleOwner may accept at any time, and neither role is gated from ADJUDICATED."
    error_id: ERR_DISPUTE_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /grazing/settlements/{id}/finalize"

  - priority: 19
    category: business_temporal
    check: "an OWNER_ELECTED early removal happens no earlier than contract.min_days after the lot's in_date (DROUGHT and GRAZIER_ELECTED waive this)"
    error_id: ERR_MIN_DAYS_NOT_MET
    http_status: 422
    applies_to: "POST /grazing/contracts/{id}/early-removal"

  - priority: 20
    category: business_constraint
    check: "reason matches the acting role: CattleOwner may only submit OWNER_ELECTED, Grazier may only submit GRAZIER_ELECTED"
    error_id: ERR_EARLY_REMOVAL_NOT_PERMITTED
    http_status: 409
    applies_to: "POST /grazing/contracts/{id}/early-removal"

  - priority: 21
    category: business_constraint
    check: "settlement.dispute_round < MAX_DISPUTE_ROUNDS (2)"
    error_id: ERR_DISPUTE_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /grazing/settlements/{id}/dispute"

  - priority: 22
    category: business_constraint
    check: "head counts stay consistent: an OUT weight event's head_count <= lot.head_count_received - lot.confirmed_death_head; a death report's head_lost <= lot.head_count_received - lot.confirmed_death_head"
    error_id: ERR_HEAD_COUNT_INCONSISTENT
    http_status: 422
    applies_to: "POST /grazing/lots/{id}/weight-events, POST /grazing/lots/{id}/death-losses"

  - priority: 23
    category: business_constraint
    check: "no GrazingContract on the pasture has lifecycle_status in {PENDING_SIGNATURE, SUSPENDED, ACTIVE, EARLY_REMOVAL_PENDING} when closing it"
    error_id: ERR_PASTURE_HAS_ACTIVE_CONTRACTS
    http_status: 409
    applies_to: "POST /grazing/pastures/{id}/status"

  - priority: 24
    category: business_referential
    check: "every HealthTreatment on the lot has status in {APPROVED, VOIDED} — no RECORDED or DISPUTED row is left open"
    error_id: ERR_OPEN_TREATMENT_REVIEW
    http_status: 409
    applies_to: "POST /grazing/settlements"

  - priority: 25
    category: business_referential
    check: "the lot has exactly one WeightEvent with event_type == OUT (the empty-set case is rejected)"
    error_id: ERR_NO_OUT_WEIGHT
    http_status: 409
    applies_to: "POST /grazing/settlements"

  - priority: 26
    category: business_fiscal
    check: "the contract's CattleOwner has credit_status == GOOD_STANDING"
    error_id: ERR_OWNER_DELINQUENT
    http_status: 409
    applies_to: "POST /grazing/contracts/{id}/sign"

  - priority: 27
    category: business_fiscal
    check: "pasture.committed_head_days + contract.committed_head_days <= pasture.rated_head_days (strict > is rejected; equality passes)"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /grazing/contracts/{id}/submit"

# =============================================================================
# 1.5 API Endpoint Table   (all business paths sit under the /grazing prefix;
#     /_clock is the single test-driving namespace)
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- registry --
  - method: POST
    path: "/grazing/graziers"
    description: "Register a custom grazing operation. The returned id is the X-User-ID a Grazier acts under."
    roles: [PlatformAdmin]
    code: 201
    input: [business_name, state_code, liability_carrier]
    output: Grazier
    side_effects: []

  - method: POST
    path: "/grazing/cattle-owners"
    description: "Register a cattle owner. The returned id is the X-User-ID a CattleOwner acts under."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, state_code, brand_registration, "credit_limit_cents?"]
    output: CattleOwner
    side_effects: ["initialises open_settlement_balance_cents to 0 and credit_status to GOOD_STANDING"]

  - method: GET
    path: "/grazing/cattle-owners/{id}"
    description: "Read a cattle owner including the derived balance and credit standing."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: []
    output: CattleOwner
    side_effects: []

  - method: POST
    path: "/grazing/range-consultants"
    description: "Register a certified rangeland consultant. The returned id is the X-User-ID a RangeConsultant acts under."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, certification_number, state_code]
    output: RangeConsultant
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint. Sets the server's logical clock, which stamps Settlement.issued_at and Settlement.dispute_opened_at and drives every dispute-window comparison. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["advances or rewinds the logical clock; no entity is mutated"]

  # ----------------------------------------------------------------- pasture --
  - method: POST
    path: "/grazing/pastures"
    description: "Create a pasture unit in DRAFT. grazier_id is taken from X-User-ID."
    roles: [Grazier]
    code: 201
    input: [name, acres, forage_type, water_source_type, fence_class, "prior_season_head_days?"]
    output: Pasture
    side_effects: ["operational_status = DRAFT; grazing_posture = OPEN; rated_aum = 0; rated_head_days = 0"]

  - method: GET
    path: "/grazing/pastures/{id}"
    description: "Read one pasture including every derived capacity and posture field."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: []
    output: Pasture
    side_effects: []

  - method: GET
    path: "/grazing/pastures"
    description: "List pastures with filters. Also the reverse-reachability channel for Pasture.grazier_id and Pasture.effective_assessment_id."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: ["grazier_id?", "operational_status?", "grazing_posture?", "effective_assessment_id?", "limit?", "offset?"]
    output: Pasture[]
    side_effects: []

  - method: POST
    path: "/grazing/pastures/{id}/status"
    description: "Drive the pasture's own lifecycle: DRAFT -> AVAILABLE (requires at least one assessment), DRAFT -> CLOSED, AVAILABLE -> CLOSED (requires no live contracts)."
    roles: [Grazier]
    code: 200
    input: [to_status]
    output: Pasture
    side_effects:
      - "recomputes effective_assessment_id, rated_aum, rated_head_days, capacity_utilization_pct and grazing_posture"
      - "increments Pasture.version by 1"

  - method: POST
    path: "/grazing/pastures/{id}/capacity-assessments"
    description: "File a carrying-capacity assessment. The new row supersedes the prior effective assessment, so the call is guarded by optimistic concurrency on the pasture."
    roles: [RangeConsultant]
    code: 201
    input: [expected_pasture_version, method, "forage_dry_matter_lbs_per_acre?", utilization_pct, assessment_date]
    output: CapacityAssessment
    side_effects:
      - "computes rated_aum and rated_head_days via calculations.capacity_assessment_rating"
      - "re-selects Pasture.effective_assessment_id and copies rated_aum / rated_head_days onto the pasture"
      - "recomputes Pasture.capacity_utilization_pct and Pasture.grazing_posture"
      - "increments Pasture.version by 1"

  - method: GET
    path: "/grazing/capacity-assessments/{id}"
    description: "Read one capacity assessment."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: []
    output: CapacityAssessment
    side_effects: []

  - method: GET
    path: "/grazing/capacity-assessments"
    description: "List assessments. Reverse-reachability channel for CapacityAssessment.pasture_id and CapacityAssessment.assessor_id."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: ["pasture_id?", "assessor_id?", "limit?", "offset?"]
    output: CapacityAssessment[]
    side_effects: []

  - method: POST
    path: "/grazing/pastures/{id}/drought-readings"
    description: "File a drought observation. Two consecutive readings at index >= 3, or a single reading at forage_remaining_pct <= 20, order a destock."
    roles: [RangeConsultant]
    code: 201
    input: [reading_date, drought_index, forage_remaining_pct]
    output: DroughtReading
    side_effects:
      - "computes consecutive_severe_count and triggered_destock via calculations.drought_trigger"
      - "cascade link 1: sets Pasture.drought_destock_flag and recomputes Pasture.grazing_posture (DESTOCK_ORDERED)"
      - "cascade link 2: every GrazingContract on the pasture with lifecycle_status == ACTIVE moves to EARLY_REMOVAL_PENDING with early_removal_reason = DROUGHT and early_removal_effective_date = reading_date + DROUGHT_NOTICE_DAYS"
      - "cascade link 3: every CattleLot on those contracts with status == ON_FEED moves to REMOVAL_SCHEDULED with scheduled_removal_date = early_removal_effective_date, and every CattleLot with status == SCHEDULED moves to RECEIVING_HELD"
      - "on a recovery reading the flag clears, posture returns to OPEN and RECEIVING_HELD lots move back to SCHEDULED"

  - method: GET
    path: "/grazing/pastures/{id}/drought-readings"
    description: "List a pasture's drought readings, newest reading_date first. Reverse-reachability channel for DroughtReading.pasture_id."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: DroughtReading[]
    side_effects: []

  # ---------------------------------------------------------------- contract --
  - method: POST
    path: "/grazing/contracts"
    description: "Draft a custom-grazing contract. grazier_id is taken from X-User-ID; committed_head_days is derived from the window and the committed head."
    roles: [Grazier]
    code: 201
    input: [cattle_owner_id, pasture_id, billing_mode, rate_cents, "shrink_pct?", "out_shrink_pct?", head_count_committed, head_value_cents, start_date, end_date, "min_days?", "treatment_cost_split_pct?", water_responsibility, fence_responsibility, "infrastructure_owner_cap_cents?", death_loss_terms, "death_loss_threshold_pct?"]
    output: GrazingContract
    side_effects: ["lifecycle_status = DRAFT; billing_status = UNBILLED; computes committed_head_days"]

  - method: GET
    path: "/grazing/contracts/{id}"
    description: "Read one contract with both state dimensions."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: []
    output: GrazingContract
    side_effects: []

  - method: GET
    path: "/grazing/contracts"
    description: "List contracts with filters. Reverse-reachability channel for GrazingContract.grazier_id, .cattle_owner_id and .pasture_id."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: ["grazier_id?", "cattle_owner_id?", "pasture_id?", "lifecycle_status?", "billing_status?", "limit?", "offset?"]
    output: GrazingContract[]
    side_effects: []

  - method: POST
    path: "/grazing/contracts/{id}/submit"
    description: "DRAFT -> PENDING_SIGNATURE. Books the contract's head-days against the pasture's carrying budget."
    roles: [Grazier]
    code: 200
    input: []
    output: GrazingContract
    side_effects:
      - "recomputes Pasture.committed_head_days, Pasture.capacity_utilization_pct and Pasture.grazing_posture"
      - "increments GrazingContract.version by 1"

  - method: POST
    path: "/grazing/contracts/{id}/sign"
    description: "PENDING_SIGNATURE -> ACTIVE. Enforces the rest-buffer window check and the owner's credit standing."
    roles: [CattleOwner]
    code: 200
    input: [signature_ref]
    output: GrazingContract
    side_effects:
      - "stores signature_ref"
      - "recomputes Pasture.grazing_posture"
      - "increments GrazingContract.version by 1"

  - method: POST
    path: "/grazing/contracts/{id}/early-removal"
    description: "ACTIVE -> EARLY_REMOVAL_PENDING when cattle are on the ground, ACTIVE -> TERMINATED when they are not. reason must match the acting role."
    roles: [Grazier, CattleOwner]
    code: 200
    input: [reason, effective_date]
    output: GrazingContract
    side_effects:
      - "sets early_removal_reason and early_removal_effective_date"
      - "cascade: ON_FEED lots move to REMOVAL_SCHEDULED with scheduled_removal_date = effective_date"
      - "on TERMINATED, recomputes Pasture.committed_head_days, Pasture.capacity_utilization_pct and Pasture.grazing_posture"
      - "increments GrazingContract.version by 1"

  # --------------------------------------------------------------------- lot --
  - method: POST
    path: "/grazing/contracts/{id}/lots"
    description: "Book a delivery of cattle against an ACTIVE contract. The lot starts SCHEDULED."
    roles: [Grazier]
    code: 201
    input: [scheduled_head_count, scheduled_delivery_date]
    output: CattleLot
    side_effects: ["status = SCHEDULED"]

  - method: GET
    path: "/grazing/contracts/{id}/lots"
    description: "List a contract's lots. Reverse-reachability channel for CattleLot.contract_id."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CattleLot[]
    side_effects: []

  - method: GET
    path: "/grazing/lots/{id}"
    description: "Read one lot with its receiving, shrink and weigh-out figures."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: []
    output: CattleLot
    side_effects: []

  - method: POST
    path: "/grazing/lots/{id}/receive"
    description: "SCHEDULED -> ON_FEED. Records the IN scale ticket and applies the contract pencil shrink."
    roles: [Grazier]
    code: 200
    input: [head_count_received, gross_weight_lbs, scale_ticket_ref, received_at]
    output: CattleLot
    side_effects:
      - "creates a WeightEvent with event_type = IN"
      - "computes shrunk_weight_in_lbs via calculations.shrunk_weight"
      - "recomputes Pasture.stocked_head_count"
      - "increments CattleLot.version by 1"

  - method: POST
    path: "/grazing/lots/{id}/weight-events"
    description: "Record an INTERIM or OUT scale ticket. An OUT event drives the lot to WEIGHED_OUT and is gated by the drug-withdrawal windows."
    roles: [Grazier]
    code: 201
    input: [event_type, gross_weight_lbs, head_count, scale_ticket_ref, weighed_at]
    output: WeightEvent
    side_effects:
      - "computes shrink_pct_applied and shrunk_weight_lbs via calculations.shrunk_weight"
      - "on OUT: sets CattleLot.head_count_out, gross_weight_out_lbs, shrunk_weight_out_lbs, out_date, days_on_feed and moves the lot to WEIGHED_OUT"
      - "on OUT: recomputes Pasture.stocked_head_count"
      - "increments CattleLot.version by 1 on OUT"

  - method: GET
    path: "/grazing/lots/{id}/weight-events"
    description: "List a lot's scale tickets, oldest weighed_at first. Reverse-reachability channel for WeightEvent.lot_id."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: ["event_type?", "limit?", "offset?"]
    output: WeightEvent[]
    side_effects: []

  # ------------------------------------------------------------- health care --
  - method: POST
    path: "/grazing/lots/{id}/treatments"
    description: "Record a health-protocol treatment and split its cost per the contract's allocation terms."
    roles: [Grazier]
    code: 201
    input: [protocol_code, classification, treatment_date, withdrawal_days, head_treated, drug_cost_cents, labor_cost_cents]
    output: HealthTreatment
    side_effects:
      - "computes total_cost_cents, owner_share_cents and grazier_share_cents via calculations.treatment_cost_allocation"
      - "status = RECORDED — which blocks settlement until reviewed and opens a withdrawal interval"

  - method: GET
    path: "/grazing/lots/{id}/treatments"
    description: "List a lot's treatments. Reverse-reachability channel for HealthTreatment.lot_id."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HealthTreatment[]
    side_effects: []

  - method: POST
    path: "/grazing/treatments/{id}/review"
    description: "Review a treatment charge. APPROVE and DISPUTE are the CattleOwner's; VOID is the Grazier's."
    roles: [CattleOwner, Grazier]
    code: 200
    input: [decision, "note?"]
    output: HealthTreatment
    side_effects:
      - "moves the treatment through §1.2's HealthTreatment machine and stores review_note"
      - "APPROVED rows become eligible for Settlement.treatment_charge_cents; VOIDED rows leave both the charge basis and the withdrawal-interval set"
      - "increments HealthTreatment.version by 1"

  # -------------------------------------------------------------- death loss --
  - method: POST
    path: "/grazing/lots/{id}/death-losses"
    description: "Report dead head against a lot. The report starts REPORTED and carries no liability until a consultant confirms it."
    roles: [Grazier]
    code: 201
    input: [death_date, head_lost, cause, "necropsy_performed?"]
    output: DeathLossReport
    side_effects: ["status = REPORTED; owner_liable_head, grazier_liable_head and credit_cents stay 0"]

  - method: GET
    path: "/grazing/lots/{id}/death-losses"
    description: "List a lot's death-loss reports. Reverse-reachability channel for DeathLossReport.lot_id."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DeathLossReport[]
    side_effects: []

  - method: POST
    path: "/grazing/death-losses/{id}/review"
    description: "CONFIRM or REJECT the report (RangeConsultant), or VOID a previously confirmed one (Grazier). Every decision re-runs the chronological liability sweep over the lot."
    roles: [RangeConsultant, Grazier]
    code: 200
    input: [decision, "note?"]
    output: DeathLossReport
    side_effects:
      - "re-runs calculations.death_loss_liability over every CONFIRMED report on the lot"
      - "recomputes CattleLot.confirmed_death_head and Pasture.stocked_head_count"
      - "increments DeathLossReport.version by 1"

  # ---------------------------------------------------------- infrastructure --
  - method: POST
    path: "/grazing/infrastructure-tickets"
    description: "Open a water or fence failure ticket against a pasture and the contract whose responsibility matrix governs it. A CRITICAL ticket restricts the pasture immediately."
    roles: [Grazier, CattleOwner]
    code: 201
    input: [pasture_id, contract_id, asset_type, severity, description, reported_at]
    output: InfrastructureTicket
    side_effects:
      - "status = OPEN"
      - "cascade link 1: recomputes Pasture.open_critical_ticket_count and Pasture.grazing_posture (CRITICAL -> RESTRICTED)"
      - "cascade link 2: when the posture leaves OPEN, every CattleLot on the pasture with status == SCHEDULED moves to RECEIVING_HELD"

  - method: GET
    path: "/grazing/infrastructure-tickets/{id}"
    description: "Read one infrastructure ticket including its computed cost split."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: []
    output: InfrastructureTicket
    side_effects: []

  - method: GET
    path: "/grazing/infrastructure-tickets"
    description: "List tickets with filters. Reverse-reachability channel for InfrastructureTicket.pasture_id and .contract_id."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: ["pasture_id?", "contract_id?", "status?", "severity?", "limit?", "offset?"]
    output: InfrastructureTicket[]
    side_effects: []

  - method: POST
    path: "/grazing/infrastructure-tickets/{id}/assign"
    description: "OPEN -> ASSIGNED_GRAZIER or ASSIGNED_OWNER. Selects which branch of the cost-allocation fork the repair will take."
    roles: [Grazier]
    code: 200
    input: [repair_party]
    output: InfrastructureTicket
    side_effects: ["sets repair_party", "increments InfrastructureTicket.version by 1"]

  - method: POST
    path: "/grazing/infrastructure-tickets/{id}/complete"
    description: "ASSIGNED_* -> REPAIRED. Captures the invoiced cost and the determined cause, then allocates the split along the assigned branch."
    roles: [Grazier, CattleOwner]
    code: 200
    input: [repair_cost_cents, cause, completed_at]
    output: InfrastructureTicket
    side_effects:
      - "computes responsible_party, owner_share_cents and grazier_share_cents via calculations.infrastructure_cost_allocation"
      - "recomputes Pasture.open_critical_ticket_count and Pasture.grazing_posture"
      - "when the posture returns to OPEN, every RECEIVING_HELD lot on the pasture moves back to SCHEDULED"
      - "increments InfrastructureTicket.version by 1"

  # -------------------------------------------------------------- settlement --
  - method: POST
    path: "/grazing/settlements"
    description: "Draft the weight-out settlement for a weighed-out lot. Guarded by optimistic concurrency on the contract because a new draft supersedes a voided predecessor."
    roles: [Grazier]
    code: 201
    input: [contract_id, lot_id, expected_contract_version]
    output: Settlement
    side_effects:
      - "computes every derived money field via calculations.settlement_gain, settlement_base_charge and settlement_total under gain_method = PROVISIONAL_PRORATED"
      - "status = DRAFT; dispute_round = 0"
      - "increments GrazingContract.version by 1"

  - method: GET
    path: "/grazing/settlements/{id}"
    description: "Read one settlement with the full charge breakdown."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/grazing/settlements"
    description: "List settlements with filters. Reverse-reachability channel for Settlement.contract_id, .lot_id and .adjudicator_id."
    roles: [Grazier, CattleOwner, RangeConsultant, PlatformAdmin]
    code: 200
    input: ["contract_id?", "lot_id?", "adjudicator_id?", "status?", "limit?", "offset?"]
    output: Settlement[]
    side_effects: []

  - method: POST
    path: "/grazing/settlements/{id}/issue"
    description: "DRAFT -> ISSUED. Stamps issued_at from the logical clock, posts the charge to the owner's balance and bills any repaired infrastructure tickets."
    roles: [Grazier]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "stamps issued_at from the logical clock"
      - "recomputes CattleOwner.open_settlement_balance_cents and CattleOwner.credit_status"
      - "cascade: a flip to DELINQUENT suspends every PENDING_SIGNATURE contract of that owner"
      - "GrazingContract.billing_status UNBILLED -> SETTLEMENT_ISSUED"
      - "REPAIRED InfrastructureTickets on the contract move to BILLED"
      - "increments Settlement.version by 1"

  - method: POST
    path: "/grazing/settlements/{id}/dispute"
    description: "ISSUED -> DISPUTED. Opens a negotiation round inside the dispute window."
    roles: [CattleOwner]
    code: 200
    input: [disputed_field, claimed_shrunk_gain_lbs, "note?"]
    output: Settlement
    side_effects:
      - "increments dispute_round by 1; stores disputed_field, claimed_shrunk_gain_lbs and dispute_note; stamps dispute_opened_at"
      - "increments Settlement.version by 1"

  - method: POST
    path: "/grazing/settlements/{id}/adjudicate"
    description: "DISPUTED -> ADJUDICATED. An independent consultant rules on the gain, which re-prices the settlement under the ruled method."
    roles: [RangeConsultant]
    code: 200
    input: [resolution, "note?"]
    output: Settlement
    side_effects:
      - "stores adjudicator_id (X-User-ID), resolution and adjudication_note"
      - "sets gain_method from the resolution and recomputes every derived money field"
      - "recomputes CattleOwner.open_settlement_balance_cents and CattleOwner.credit_status"
      - "increments Settlement.version by 1"

  - method: POST
    path: "/grazing/settlements/{id}/reissue"
    description: "ADJUDICATED -> ISSUED. Closes the negotiation cycle and restarts the dispute window."
    roles: [Grazier]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "restamps issued_at from the logical clock; dispute_round is unchanged"
      - "increments Settlement.version by 1"

  - method: POST
    path: "/grazing/settlements/{id}/finalize"
    description: "ISSUED or ADJUDICATED -> FINAL. Locks the settlement, settles and completes the contract and closes the lot."
    roles: [Grazier, CattleOwner]
    code: 200
    input: []
    output: Settlement
    side_effects:
      - "GrazingContract.billing_status -> SETTLED and lifecycle_status -> COMPLETED"
      - "the settled CattleLot moves WEIGHED_OUT -> CLOSED"
      - "recomputes Pasture.committed_head_days, capacity_utilization_pct, stocked_head_count and grazing_posture"
      - "recomputes CattleOwner.open_settlement_balance_cents and CattleOwner.credit_status"
      - "increments Settlement.version by 1"

  - method: POST
    path: "/grazing/settlements/{id}/void"
    description: "DRAFT or ISSUED -> VOID. Backs the charge out of the owner's balance and reinstates any contract suspended by it."
    roles: [Grazier]
    code: 200
    input: [reason]
    output: Settlement
    side_effects:
      - "stores void_reason"
      - "recomputes CattleOwner.open_settlement_balance_cents and CattleOwner.credit_status"
      - "cascade: a return to GOOD_STANDING moves every SUSPENDED contract of that owner back to PENDING_SIGNATURE"
      - "GrazingContract.billing_status SETTLEMENT_ISSUED -> UNBILLED"
      - "increments Settlement.version by 1"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,           http: 401, condition: "X-User-Role header missing or not one of the four declared roles" }
  - { id: ERR_FORBIDDEN_ROLE,            http: 403, condition: "The acting role is not listed for the endpoint in §1.5" }
  - { id: ERR_NOT_RESOURCE_OWNER,        http: 403, condition: "The acting entity_backed principal is not the grazier or cattle owner of the target resource" }
  - { id: ERR_VALIDATION,                http: 422, condition: "Missing required body field, unknown enum member, or a numeric field outside its declared range" }
  - { id: ERR_INVALID_PAGINATION,        http: 400, condition: "limit outside [1, 100] or offset negative" }
  - { id: ERR_PARTY_NOT_FOUND,           http: 404, condition: "A Grazier, CattleOwner or RangeConsultant id (header or body) does not resolve" }
  - { id: ERR_PASTURE_NOT_FOUND,         http: 404, condition: "pasture_id does not resolve" }
  - { id: ERR_ASSESSMENT_NOT_FOUND,      http: 404, condition: "capacity assessment id does not resolve" }
  - { id: ERR_CONTRACT_NOT_FOUND,        http: 404, condition: "contract_id does not resolve" }
  - { id: ERR_LOT_NOT_FOUND,             http: 404, condition: "lot_id does not resolve" }
  - { id: ERR_TREATMENT_NOT_FOUND,       http: 404, condition: "treatment id does not resolve" }
  - { id: ERR_DEATH_LOSS_NOT_FOUND,      http: 404, condition: "death-loss report id does not resolve" }
  - { id: ERR_TICKET_NOT_FOUND,          http: 404, condition: "infrastructure ticket id does not resolve" }
  - { id: ERR_SETTLEMENT_NOT_FOUND,      http: 404, condition: "settlement id does not resolve" }
  - { id: ERR_STALE_PASTURE_VERSION,     http: 412, condition: "expected_pasture_version does not match Pasture.version" }
  - { id: ERR_STALE_CONTRACT_VERSION,    http: 412, condition: "expected_contract_version does not match GrazingContract.version" }
  - { id: ERR_PASTURE_INVALID_STATE,     http: 409, condition: "The requested pasture status transition is not declared from the current operational_status" }
  - { id: ERR_CONTRACT_INVALID_STATE,    http: 409, condition: "The contract's lifecycle_status or billing_status does not permit the requested operation" }
  - { id: ERR_LOT_INVALID_STATE,         http: 409, condition: "The lot's status does not permit the requested operation" }
  - { id: ERR_TREATMENT_INVALID_STATE,   http: 409, condition: "The treatment's status does not permit the requested review decision" }
  - { id: ERR_DEATH_LOSS_INVALID_STATE,  http: 409, condition: "The death-loss report's status does not permit the requested review decision" }
  - { id: ERR_TICKET_INVALID_STATE,      http: 409, condition: "The ticket's status does not permit assign or complete" }
  - { id: ERR_SETTLEMENT_INVALID_STATE,  http: 409, condition: "The settlement's status does not permit the requested transition" }
  - { id: ERR_WITHDRAWAL_PERIOD_ACTIVE,  http: 409, condition: "An OUT scale ticket falls inside a live drug withdrawal interval on the lot" }
  - { id: ERR_PASTURE_POSTURE_BLOCKED,   http: 409, condition: "The pasture's grazing_posture is not OPEN, so no cattle may be booked onto or received onto it" }
  - { id: ERR_ADJUDICATOR_CONFLICT,      http: 403, condition: "The adjudicating consultant authored the pasture's effective capacity assessment" }
  - { id: ERR_NO_CAPACITY_ASSESSMENT,    http: 409, condition: "A pasture with zero capacity assessments cannot be moved to AVAILABLE" }
  - { id: ERR_PASTURE_NOT_AVAILABLE,     http: 409, condition: "The contract's pasture is not in operational_status AVAILABLE" }
  - { id: ERR_PASTURE_HAS_ACTIVE_CONTRACTS, http: 409, condition: "A pasture with live contracts cannot be closed" }
  - { id: ERR_GRAZING_WINDOW_OVERLAP,    http: 409, condition: "The contract's window overlaps another live contract on the pasture, or falls inside its 14-day rest buffer" }
  - { id: ERR_DISPUTE_WINDOW_CLOSED,     http: 409, condition: "The dispute window on the settlement has elapsed" }
  - { id: ERR_DISPUTE_WINDOW_OPEN,       http: 409, condition: "A Grazier tried to finalize an ISSUED settlement before its dispute window elapsed" }
  - { id: ERR_MIN_DAYS_NOT_MET,          http: 422, condition: "An owner-elected early removal falls short of the contract's minimum days on feed" }
  - { id: ERR_EARLY_REMOVAL_NOT_PERMITTED, http: 409, condition: "The early-removal reason does not match the acting role" }
  - { id: ERR_DISPUTE_ROUNDS_EXHAUSTED,  http: 409, condition: "The settlement has already used its two dispute rounds" }
  - { id: ERR_HEAD_COUNT_INCONSISTENT,   http: 422, condition: "An OUT head count or a reported death exceeds the head still alive on the lot" }
  - { id: ERR_OPEN_TREATMENT_REVIEW,     http: 409, condition: "The lot still carries a RECORDED or DISPUTED health treatment" }
  - { id: ERR_NO_OUT_WEIGHT,             http: 409, condition: "The lot has no OUT scale ticket, so there is no gain to settle" }
  - { id: ERR_OWNER_DELINQUENT,          http: 409, condition: "The cattle owner's open settlement balance exceeds their credit limit" }
  - { id: ERR_CAPACITY_EXCEEDED,         http: 409, condition: "Committing the contract's head-days would push the pasture past its rated carrying budget" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Grazier
    description: "The custom grazier — owns pastures, drafts contracts, receives and weighs cattle, records treatments and death losses, and prepares settlements."
    identity: "entity_backed:Grazier"
    exclusive_operations:
      - "POST /grazing/pastures"
      - "POST /grazing/pastures/{id}/status"
      - "POST /grazing/contracts"
      - "POST /grazing/contracts/{id}/submit"
      - "POST /grazing/contracts/{id}/lots"
      - "POST /grazing/lots/{id}/receive"
      - "POST /grazing/lots/{id}/weight-events"
      - "POST /grazing/lots/{id}/treatments"
      - "POST /grazing/lots/{id}/death-losses"
      - "POST /grazing/infrastructure-tickets/{id}/assign"
      - "POST /grazing/settlements"
      - "POST /grazing/settlements/{id}/issue"
      - "POST /grazing/settlements/{id}/reissue"
      - "POST /grazing/settlements/{id}/void"
    shared_operations:
      - "POST /grazing/contracts/{id}/early-removal (reason must be GRAZIER_ELECTED)"
      - "POST /grazing/treatments/{id}/review (decision VOID only)"
      - "POST /grazing/death-losses/{id}/review (decision VOID only)"
      - "POST /grazing/infrastructure-tickets"
      - "POST /grazing/infrastructure-tickets/{id}/complete (ASSIGNED_GRAZIER branch only)"
      - "POST /grazing/settlements/{id}/finalize (only after the dispute window elapses)"
      - "every GET endpoint"

  - name: CattleOwner
    description: "The customer placing cattle — signs contracts, reviews treatment charges, disputes settlements and accepts them."
    identity: "entity_backed:CattleOwner"
    exclusive_operations:
      - "POST /grazing/contracts/{id}/sign"
      - "POST /grazing/settlements/{id}/dispute"
    shared_operations:
      - "POST /grazing/contracts/{id}/early-removal (reason must be OWNER_ELECTED)"
      - "POST /grazing/treatments/{id}/review (decisions APPROVE and DISPUTE only)"
      - "POST /grazing/infrastructure-tickets"
      - "POST /grazing/infrastructure-tickets/{id}/complete (ASSIGNED_OWNER branch only)"
      - "POST /grazing/settlements/{id}/finalize (acceptance, permitted at any time)"
      - "every GET endpoint"

  - name: RangeConsultant
    description: "Independent certified rangeland professional — rates carrying capacity, files drought readings, verifies death losses and adjudicates disputed gain. Barred from adjudicating on a pasture they themselves rated."
    identity: "entity_backed:RangeConsultant"
    exclusive_operations:
      - "POST /grazing/pastures/{id}/capacity-assessments"
      - "POST /grazing/pastures/{id}/drought-readings"
      - "POST /grazing/settlements/{id}/adjudicate"
    shared_operations:
      - "POST /grazing/death-losses/{id}/review (decisions CONFIRM and REJECT only)"
      - "every GET endpoint"

  - name: PlatformAdmin
    description: "Operator of the marketplace — registers the three party types and drives the logical clock. Holds no business authority over pastures, contracts or settlements."
    identity: "opaque"
    exclusive_operations:
      - "POST /grazing/graziers"
      - "POST /grazing/cattle-owners"
      - "POST /grazing/range-consultants"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"
