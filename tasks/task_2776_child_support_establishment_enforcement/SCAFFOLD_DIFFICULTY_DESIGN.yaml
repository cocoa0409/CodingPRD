              as: CaseWorker
              captures: { ls_snapshot: $.data.arrears_certified_snapshot_cents, ls_threshold: $.data.eligibility_threshold_cents, ls_status: $.data.status }
          assert:
            - "${monthly} == 75000"
            - "${principal} == 298000  # 75000*3 + 73000"
            - "${receivable_agg} == 3345  # aggregate_month_end: 740 + 1115 + 1490"
            - "${err_below} == \"ERR_ARREARS_BELOW_ENFORCEMENT_THRESHOLD\"  # HTTP 409; 298000 + 1855 = 299855 < 300000, 145 cents short"
            - "${cbr_snapshot} == 299855  # statutory variant, NOT 298000 + 3345 = 301345"
            - "${cbr_threshold} == 100000"
            - "${cbr_status} == \"PROPOSED\"  # the same certified figure clears the CREDIT_BUREAU_REPORT row"
            - "${ls_snapshot} == 300000  # 298145 principal + 1855 statutory interest; the new 145 charge is due 2026-10-15 so it accrues 0 whole months"
            - "${ls_threshold} == 300000"
            - "${ls_status} == \"PROPOSED\"  # exactly at the threshold is eligible because the gate is >="

      - name: payment_to_case_with_no_open_charges_is_all_unapplied_credit
        grounds:
          - calculations.payment_allocation_waterfall
          - calculations.payment_distribution_split
          - entities.PaymentTransaction.fields.unapplied_credit_cents
          - entities.SupportCase.fields.unapplied_credit_cents
          - endpoints[POST /child-support/cases/{case_id}/payments]
        distinguishing_aspect: |
          A 60000 payment against a case whose ENTERED order has produced zero
          ObligationCharge rows must fall through all five allocation buckets to
          the empty-set boundary and land 60000 in unapplied_credit_cents with
          every applied_* bucket at 0 — and because nothing was distributable,
          disbursed_to_cp_cents and retained_by_state_cents are both 0 while the
          three-way invariant still sums to amount_cents.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
