            - "FY2025 collections_cents == 5189521 (only the 2026-05-10 vintages), expenditures_cents == 0, refunds_cents == 0."
            - "FY2025 unexpended_cents == 5189521, refund_obligation_cents == 0 and earliest_deadline_at == '2031-05-10T00:00:00Z'."
