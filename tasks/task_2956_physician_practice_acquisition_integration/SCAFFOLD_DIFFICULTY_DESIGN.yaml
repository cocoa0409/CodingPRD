  # ===========================================================================
  # Rule 9 — Compensating invariants over different conserved quantities
  #   quantity 1 : money (retention pool committed + available == total)
  #   quantity 2 : record counts (validated + defect + unprocessed == record_count)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: retention_pool_restored_exactly_after_offer_rescind
        grounds:
          - calculations.retention_pool_ledger
          - calculations.retention_bonus_award
          - state_machines.StaffTransitionOffer.status.DRAFT_to_EXTENDED
          - state_machines.StaffTransitionOffer.status.EXTENDED_to_RESCINDED
          - validations[priority=45]
        distinguishing_aspect: |
          Conserved quantity is MONEY: retention_pool_committed_cents +
          retention_pool_available_cents equals retention_pool_total_cents at every
          observable point, and RESCINDED releases the committed award to the exact
          cent so the ledger returns byte-identical to its pre-EXTENDED reading —
          no residue, no double release. Distinct from the record-count
          conservation of the migration instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition driven to deal_status DILIGENCE with retention_pool_total_cents 3000000, retention_pool_committed_cents 0 and retention_pool_available_cents 3000000."
            - "One BILLER StaffTransitionOffer in status DRAFT with legacy_annual_wage_cents 5282350, legacy_pto_hours 104 and credited_service_months 84."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /physicians"
              payload: { acquisition_id: "${acq_id}", npi: "1548392017", full_name: "Amara Vance MD", specialty: "PRIMARY_CARE", board_certified: true, state_license_expires_on: "2028-06-30" }
              as: DealLead
              as_user_id: "dl-1"
              captures: { phys_id: "$.data.id" }
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "DILIGENCE" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "POST /staff-transition-offers"
              payload: { acquisition_id: "${acq_id}", staff_member_name: "Dana Whitfield", role_code: "BILLER", legacy_annual_wage_cents: 5282350, legacy_pto_hours: 104, credited_service_months: 84, offer_expires_on: "2026-09-15" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { offer_id: "$.data.id" }
          trigger:
            - call: "POST /staff-transition-offers/${offer_id}/status"
              payload: { target_status: "EXTENDED" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /staff-transition-offers/${offer_id}/status"
              payload: { target_status: "RESCINDED", note: "Position eliminated in the day-one org chart." }
              as: IntegrationManager
              as_user_id: "im-1"
          assert:
            - "at creation StaffTransitionOffer.${offer_id}.offered_annual_wage_cents == 5572880 and retention_bonus_cents == 557288 and status == DRAFT"
            - "at creation Acquisition.${acq_id}.retention_pool_committed_cents == 0 and retention_pool_available_cents == 3000000 (DRAFT offers commit nothing)"
            - "after EXTENDED, Acquisition.${acq_id}.retention_pool_committed_cents == 557288 and retention_pool_available_cents == 2442712, and 557288 + 2442712 == 3000000"
            - "after RESCINDED, Acquisition.${acq_id}.retention_pool_committed_cents == 0 and retention_pool_available_cents == 3000000 — identical to the pre-EXTENDED reading"
            - "StaffTransitionOffer.${offer_id}.retention_bonus_cents == 557288 is retained on the rescinded row; only the pool ledger is released"
            - "re-issuing the RESCINDED request returns ERR_INVALID_STATE_TRANSITION (409) and the pool is not credited twice"
            - "a second EXTENDED attempt on the RESCINDED offer returns ERR_INVALID_STATE_TRANSITION (409), so the released capacity cannot be re-committed by the same row"
            - "the released capacity is genuinely reusable: a fresh PRACTICE_MANAGER offer with legacy_annual_wage_cents 12000000, legacy_pto_hours 160 and credited_service_months 200 yields retention_bonus_cents 1500000 and extends successfully, leaving committed 1500000 and available 1500000"

      - name: ehr_record_count_conserved_across_fail_and_requeue
        grounds:
          - calculations.ehr_reconciliation_match_rate
          - entities.EhrMigrationBatch.fields.unprocessed_count
          - state_machines.EhrMigrationBatch.status.LOADED_to_FAILED
          - state_machines.EhrMigrationBatch.status.FAILED_to_STAGED
          - validations[priority=28]
        distinguishing_aspect: |
          Conserved quantity is RECORD COUNTS, not money: validated_count +
          defect_count + unprocessed_count equals record_count at every observable
          point, and REQUEUE compensates a failed reconciliation by zeroing the
          two processed buckets and returning the full 20000 to unprocessed —
          restoring the batch to its byte-identical post-STAGED counters while
          retry_count advances as the one non-conserved bookkeeping field.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Acquisition in deal_status SOURCING."
            - "One EhrMigrationBatch with record_count 20000 driven to status LOADED with all counters zero."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /acquisitions"
              payload: { target_practice_name: "Lakeside Family Medicine", specialty: "PRIMARY_CARE", structure: "ASSET", malpractice_policy_form: "OCCURRENCE", annual_malpractice_premium_cents: 4800000, trailing_annual_collections_cents: 500000000, target_close_on: "2026-11-01", required_staff_headcount: 5, retention_pool_total_cents: 3000000, escrow_total_cents: 10000000 }
              as: DealLead
              as_user_id: "dl-1"
              captures: { acq_id: "$.data.id" }
            - call: "POST /ehr-migration-batches"
              payload: { acquisition_id: "${acq_id}", batch_label: "CHARTS-A", source_system: "ATHENA", chart_type: "STRUCTURED", record_count: 20000, contains_minor_records: false, last_encounter_on: "2026-07-15" }
              as: IntegrationManager
              as_user_id: "im-1"
              captures: { batch_id: "$.data.id" }
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "EXTRACT" }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "LOAD" }
              as: IntegrationManager
              as_user_id: "im-1"
          trigger:
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "RECONCILE", validated_count: 19899, defect_count: 101, note: "Allergy list mismatches." }
              as: IntegrationManager
              as_user_id: "im-1"
            - call: "POST /ehr-migration-batches/${batch_id}/progress"
              payload: { action: "REQUEUE", note: "Remapping the allergy dictionary before the second pass." }
              as: IntegrationManager
              as_user_id: "im-1"
          assert:
            - "after the failed RECONCILE, EhrMigrationBatch.${batch_id}.validated_count == 19899, defect_count == 101, unprocessed_count == 0 and 19899 + 101 + 0 == 20000"
            - "after the failed RECONCILE, EhrMigrationBatch.${batch_id}.match_rate_bps == 9949 and status == FAILED and retry_count == 1"
            - "after REQUEUE, EhrMigrationBatch.${batch_id}.validated_count == 0, defect_count == 0, unprocessed_count == 20000 and 0 + 0 + 20000 == 20000"
            - "after REQUEUE, EhrMigrationBatch.${batch_id}.match_rate_bps == 0 and status == STAGED and retry_count == 1 (the counters are compensated; the retry tally is not)"
            - "EhrMigrationBatch.${batch_id}.record_count == 20000 is never mutated by any progress action"
            - "a RECONCILE with validated_count 19900 and defect_count 200 returns ERR_MIGRATION_COUNT_INVALID (422) precisely because the buckets would sum to 20100 and break the invariant, and every counter stays at its post-REQUEUE reading"
            - "driving EXTRACT, LOAD then a second sub-threshold RECONCILE with 19899 / 101 sets retry_count 2 and status FAILED with the invariant still holding; a third such cycle yields status ABORTED with retry_count 3, validated_count 19899, defect_count 101, unprocessed_count 0"
