            - call: "GET /stores/${s1}"
              as: LPAdmin
              as_user_id: adm-1
          assert:
            - "status_before == PAID_IN_FULL"
            - "RestitutionPayment.${pay1}.status == RETURNED"
            - "link 1: CivilDemand.${dd}.fees_incurred_cents == 2500 and paid_to_date_cents == 50000 and outstanding_cents == 107500  # 130000 + 2500 - 50000"
            - "link 2: CivilDemand.${dd}.status == PARTIALLY_PAID"
