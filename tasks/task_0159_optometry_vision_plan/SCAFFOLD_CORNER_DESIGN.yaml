      - name: missing_auth_headers_unauthenticated
        claim_type: role_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unknown/absent X-User-Role returns ERR_UNAUTHENTICATED 401 before any other check."
