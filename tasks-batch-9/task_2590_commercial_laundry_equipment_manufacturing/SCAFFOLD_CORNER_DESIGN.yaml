# §1.9 Scaffold Corner Design (breadth walk) for task 2590 — commercial laundry equipment
# manufacturing. The nine sections below are the nine sections of
# references/claim-extraction-guide.md; every `claim_type:` is a row label from that guide's
# per-section tables, snake_cased. Instances already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml
# carry an `excluded_because:` stub and no test_recipe.
# Fixtures reuse the §1.8 naming conventions (u-pe-01 ProductEngineer, u-co-01 / u-prep-01 /
# u-rev-e / u-rev-w ComplianceOfficers, u-pm-01 PlantManager, u-ta-01 TrainingAdministrator,
# u-cm-01 ChannelManager, u-wa-01 WarrantyAnalyst) and the mandatory startup logical clock
# 2026-08-01T00:00:00Z.
scaffold_corner_design:
  - section: entities
    instances:
      - name: machine_model_creation_returns_declared_field_set
        claim_type: creation
        grounds:
          - entities.MachineModel
          - endpoints[POST /clm/machine-models]
          - response_envelope
        distinguishing_aspect: "A create with every required input returns 201 and the full declared MachineModel shape inside the §1.0 success envelope, with all derived counters seeded at their documented zero values and version 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000, max_rework_cycles: 2, min_first_pass_yield_pct: 80.00 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "response_type == object and meta.api_request_id and meta.api_request_timestamp are present"
            - "MachineModel.${m1}.certification_state == DRAFT"
            - "MachineModel.${m1}.suspended_reason == NONE"
            - "MachineModel.${m1}.accepted_unit_count == 0 and scrapped_unit_count == 0 and quality_hold_unit_count == 0"
            - "MachineModel.${m1}.first_pass_yield_pct == 0.00"
            - "MachineModel.${m1}.rebate_program_codes == [] and rebate_amount_cents == 0"
            - "MachineModel.${m1}.version == 1"

      - name: machine_model_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /clm/machine-models/{id}]
          - entities.MachineModel.fields.list_price_cents
        distinguishing_aspect: "GET by id echoes the stored row byte-for-byte on the input fields and does not advance version."
        test_recipe:
          setup: ["one MachineModel VND-40-C created by u-pe-01"]
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "VND-40-C", product_line: "VENDED", capacity_rating_lb: 40, rated_water_gal_per_cwt: 0.95, rated_kwh_per_cwt: 0.38, drum_alloy_grade: "AISI_316", payment_module_options: ["COIN", "CARD", "MOBILE"], list_price_cents: 780000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m2: $.data.id }
          trigger:
            - call: "GET /clm/machine-models/${m2}"
              as: ChannelManager
              as_user_id: "u-cm-01"
          assert:
            - "the trigger returns HTTP 200"
            - "MachineModel.${m2}.model_code == VND-40-C"
            - "MachineModel.${m2}.payment_module_options == [COIN, CARD, MOBILE]"
            - "MachineModel.${m2}.list_price_cents == 780000"
            - "MachineModel.${m2}.version == 1 (a read never mutates)"

      - name: machine_model_listing_paginates_and_filters
        claim_type: listing
        grounds:
          - endpoints[GET /clm/machine-models]
          - response_envelope
        distinguishing_aspect: "The list endpoint filters on product_line and honours limit/offset, reporting total_count over the FILTERED set (2), not the whole table (3), with has_more true when a page is truncated."
        test_recipe:
          setup: ["two ON_PREMISES models and one VENDED model"]
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-80-A", product_line: "ON_PREMISES", capacity_rating_lb: 80, rated_water_gal_per_cwt: 1.15, rated_kwh_per_cwt: 0.44, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1450000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
            - call: "POST /clm/machine-models"
              payload: { model_code: "VND-40-C", product_line: "VENDED", capacity_rating_lb: 40, rated_water_gal_per_cwt: 0.95, rated_kwh_per_cwt: 0.38, drum_alloy_grade: "AISI_316", payment_module_options: ["COIN"], list_price_cents: 780000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
          trigger:
            - call: "GET /clm/machine-models"
              payload: { product_line: "ON_PREMISES", limit: 1, offset: 0 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
          assert:
            - "the trigger returns HTTP 200 with response_type == array"
            - "data contains exactly 1 element"
            - "meta.total_count == 2"
            - "meta.limit == 1 and meta.offset == 0"
            - "meta.has_more == true"

      - name: machine_model_get_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_MODEL_NOT_FOUND]
          - endpoints[GET /clm/machine-models/{id}]
        distinguishing_aspect: "A syntactically valid but unknown UUID on the model read path returns 404 ERR_MODEL_NOT_FOUND rather than 200 with an empty body."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /clm/machine-models/00000000-0000-4000-8000-000000000000"
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 404"
            - "${err} == ERR_MODEL_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: build_order_create_missing_serial_number_rejected
        claim_type: required_fields
        grounds:
          - endpoints[POST /clm/build-orders]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: "serial_number has source input with no default, so omitting it returns 400 ERR_INVALID_REQUEST and creates no BuildOrder row."
        test_recipe:
          setup: ["one MachineModel OPL-60-A"]
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /clm/build-orders"
              payload: { model_id: "${m1}", planned_start_at: "2026-08-01T07:00:00Z" }
              as: PlantManager
              as_user_id: "u-pm-01"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /clm/build-orders?model_id=${m1} returns 0 items"

      - name: machine_model_defaults_applied_when_optionals_omitted
        claim_type: defaults
        grounds:
          - entities.MachineModel.fields.max_rework_cycles
          - entities.MachineModel.fields.min_first_pass_yield_pct
        distinguishing_aspect: "Omitting both optional inputs yields exactly max_rework_cycles 2 and min_first_pass_yield_pct 80.00, the declared defaults, rather than null or 0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /clm/machine-models"
              payload: { model_code: "TUN-300-I", product_line: "INDUSTRIAL_TUNNEL", capacity_rating_lb: 300, rated_water_gal_per_cwt: 0.85, rated_kwh_per_cwt: 0.55, drum_alloy_grade: "DUPLEX_2205", payment_module_options: [], list_price_cents: 9800000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m3: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "MachineModel.${m3}.max_rework_cycles == 2"
            - "MachineModel.${m3}.min_first_pass_yield_pct == 80.00"
            - "MachineModel.${m3}.certification_state == DRAFT"

      - name: station_log_labor_minutes_floors_partial_minute
        claim_type: computed_fields
        grounds:
          - calculations.station_occupation_window
          - entities.StationLog.fields.labor_minutes
          - entities.StationLog.fields.occupation_to
        distinguishing_aspect: "A 45-minute-30-second operation stores labor_minutes 45 (floor, never round-half-up to 46) while occupation_to carries the full 30-minute changeover buffer past the real completion instant, at 09:15:30Z."
        test_recipe:
          setup:
            - "Certified OPL-60-A, station DRUM-01 with changeover_buffer_minutes 30, technician T-100 holding DRUM_FAB"
            - "BuildOrder SN-0001 in ON_FLOOR"
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
            - call: "POST /clm/machine-models/${m1}/certification-dossiers"
              payload: { measured_water_gal_per_cwt: 1.05, measured_kwh_per_cwt: 0.40, test_cycle_count: 120 }
              as: ComplianceOfficer
              as_user_id: "u-prep-01"
              captures: { d1: $.data.id }
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "ENERGY", decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-rev-e"
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "WATER", decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-rev-w"
            - call: "POST /clm/assembly-stations"
              payload: { station_code: "DRUM-01", station_type: "DRUM_FAB", parallel_capacity: 1, changeover_buffer_minutes: 30, supported_product_lines: ["ON_PREMISES", "VENDED"] }
              as: PlantManager
              as_user_id: "u-pm-01"
              captures: { st_drum: $.data.id }
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-100", full_name: "Ann Ito", employer: "FACTORY" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t1: $.data.id }
            - call: "POST /clm/technicians/${t1}/certification-actions"
              payload: { action: "GRANT", scopes: ["DRUM_FAB"], expires_on: "2027-06-30T00:00:00Z" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/build-orders"
              payload: { model_id: "${m1}", serial_number: "SN-0001", planned_start_at: "2026-08-01T07:00:00Z" }
              as: PlantManager
              as_user_id: "u-pm-01"
              captures: { b1: $.data.id }
            - call: "POST /clm/build-orders/${b1}/release-to-floor"
              as: PlantManager
              as_user_id: "u-pm-01"
          trigger:
            - call: "POST /clm/build-orders/${b1}/station-logs"
              payload: { station_id: "${st_drum}", station_type: "DRUM_FAB", started_at: "2026-08-01T08:00:00Z", completed_at: "2026-08-01T08:45:30Z", outcome: "PASS" }
              as: Technician
              as_user_id: "${t1}"
              captures: { log1: $.data.id }
          assert:
            - "StationLog.${log1}.labor_minutes == 45"
            - "StationLog.${log1}.occupation_from == 2026-08-01T08:00:00Z"
            - "StationLog.${log1}.occupation_to == 2026-08-01T09:15:30Z"
            - "StationLog.${log1}.technician_id == ${t1}"
            - "BuildOrder.${b1}.labor_minutes_total == 45"
            - "BuildOrder.${b1}.build_state == DRUM_DONE"

      - name: technician_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.Technician
          - entities.Technician.fields.cert_state
          - entities.Technician.fields.revocation_count
        distinguishing_aspect: "id is a bare server-minted UUID with no type prefix, created_at/updated_at/version are server-stamped, and the certification fields start at UNCERTIFIED / [] / 0 with no client say in any of them."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-100", full_name: "Ann Ito", employer: "FACTORY" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t1: $.data.id }
          assert:
            - "the trigger returns HTTP 201"
            - "${t1} matches the bare-UUID form 8-4-4-4-12 with no prefix"
            - "Technician.${t1}.version == 1"
            - "Technician.${t1}.created_at == 2026-08-01T00:00:00.000Z and updated_at == created_at"
            - "Technician.${t1}.cert_state == UNCERTIFIED"
            - "Technician.${t1}.cert_scopes == [] and cert_expires_on == null"
            - "Technician.${t1}.revocation_count == 0 and last_cert_action_at == null"
            - "Technician.${t1}.distributor_id == null"

      - name: machine_model_unknown_product_line_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.MachineModel.fields.product_line
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "product_line is a closed enum of ON_PREMISES | VENDED | INDUSTRIAL_TUNNEL, so the near-miss value ON_PREMISE is refused with 400 ERR_INVALID_REQUEST instead of being stored verbatim."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-B", product_line: "ON_PREMISE", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "GET /clm/machine-models returns 0 items"

      - name: station_log_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - entities.StationLog
          - endpoints[GET /clm/station-logs/{id}]
        distinguishing_aspect: "StationLog is declared common_fields: false, so its read shape exposes id and created_at but no updated_at and no version, and §1.5 declares no update or delete endpoint for it at all — the floor record is append-only."
        test_recipe:
          setup:
            - "Certified OPL-60-A, station DRUM-01, technician T-100 with DRUM_FAB, BuildOrder SN-0001 in ON_FLOOR with one PASS drum log"
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
            - call: "POST /clm/machine-models/${m1}/certification-dossiers"
              payload: { measured_water_gal_per_cwt: 1.05, measured_kwh_per_cwt: 0.40, test_cycle_count: 120 }
              as: ComplianceOfficer
              as_user_id: "u-prep-01"
              captures: { d1: $.data.id }
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "ENERGY", decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-rev-e"
            - call: "POST /clm/certification-dossiers/${d1}/reviews"
              payload: { dimension: "WATER", decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "u-rev-w"
            - call: "POST /clm/assembly-stations"
              payload: { station_code: "DRUM-01", station_type: "DRUM_FAB", parallel_capacity: 1, changeover_buffer_minutes: 30, supported_product_lines: ["ON_PREMISES"] }
              as: PlantManager
              as_user_id: "u-pm-01"
              captures: { st_drum: $.data.id }
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-100", full_name: "Ann Ito", employer: "FACTORY" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t1: $.data.id }
            - call: "POST /clm/technicians/${t1}/certification-actions"
              payload: { action: "GRANT", scopes: ["DRUM_FAB"], expires_on: "2027-06-30T00:00:00Z" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/build-orders"
              payload: { model_id: "${m1}", serial_number: "SN-0001", planned_start_at: "2026-08-01T07:00:00Z" }
              as: PlantManager
              as_user_id: "u-pm-01"
              captures: { b1: $.data.id }
            - call: "POST /clm/build-orders/${b1}/release-to-floor"
              as: PlantManager
              as_user_id: "u-pm-01"
            - call: "POST /clm/build-orders/${b1}/station-logs"
              payload: { station_id: "${st_drum}", station_type: "DRUM_FAB", started_at: "2026-08-01T08:00:00Z", completed_at: "2026-08-01T09:00:00Z", outcome: "PASS" }
              as: Technician
              as_user_id: "${t1}"
              captures: { log1: $.data.id }
          trigger:
            - call: "GET /clm/station-logs/${log1}"
              as: PlantManager
              as_user_id: "u-pm-01"
          assert:
            - "the trigger returns HTTP 200"
            - "StationLog.${log1} exposes id and created_at"
            - "StationLog.${log1} exposes no version field and no updated_at field"
            - "StationLog.${log1}.outcome == PASS and defect_code == NONE"
            - "no PUT, PATCH or DELETE route exists for /clm/station-logs/{id} in §1.5"

      - name: certification_dossier_under_unknown_model_not_found
        claim_type: parent_relationships
        grounds:
          - entities.CertificationDossier.fields.model_id
          - errors[ERR_MODEL_NOT_FOUND]
          - endpoints[POST /clm/machine-models/{id}/certification-dossiers]
        distinguishing_aspect: "The dossier is a child of MachineModel, so creating one under an unknown model id returns 404 ERR_MODEL_NOT_FOUND and no orphan dossier is persisted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /clm/machine-models/00000000-0000-4000-8000-000000000000/certification-dossiers"
              payload: { measured_water_gal_per_cwt: 1.05, measured_kwh_per_cwt: 0.40, test_cycle_count: 120 }
              as: ComplianceOfficer
              as_user_id: "u-prep-01"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 404"
            - "${err} == ERR_MODEL_NOT_FOUND"

      - name: quote_lines_link_many_quotes_to_many_models
        claim_type: topology
        grounds:
          - entities.QuoteLine.fields.quote_id
          - entities.QuoteLine.fields.model_id
          - endpoints[GET /clm/quote-lines]
        distinguishing_aspect: "QuoteLine is the many-to-many junction of the graph topology: one model appears on two different quotes and one quote carries two different models, and the model-filtered junction read returns exactly the 2 lines that reference OPL-60-A."
        test_recipe:
          setup:
            - "Models OPL-60-A and VND-40-C; Distributor D-01"
            - "Quote Q1 with lines for both models; Quote Q2 with a line for OPL-60-A"
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m1: $.data.id }
            - call: "POST /clm/machine-models"
              payload: { model_code: "VND-40-C", product_line: "VENDED", capacity_rating_lb: 40, rated_water_gal_per_cwt: 0.95, rated_kwh_per_cwt: 0.38, drum_alloy_grade: "AISI_316", payment_module_options: ["COIN", "CARD", "MOBILE"], list_price_cents: 780000 }
              as: ProductEngineer
              as_user_id: "u-pe-01"
              captures: { m2: $.data.id }
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { dist: $.data.id }
            - call: "POST /clm/quotes"
              payload: { distributor_id: "${dist}", customer_name: "Sudz Express", laundromat_site_code: "SITE-77", stated_credit_score: 715, financing_program: "NONE", down_payment_cents: 0, package_discount_pct: 0.00, freight_cents: 0 }
              as: Distributor
              as_user_id: "${dist}"
              captures: { q1: $.data.id, q1_v0: $.data.version }
            - call: "POST /clm/quotes/${q1}/lines"
              payload: { model_id: "${m1}", quantity: 1, payment_module: "NONE", line_discount_pct: 0.00, expected_quote_version: "${q1_v0}" }
              as: Distributor
              as_user_id: "${dist}"
            - call: "GET /clm/quotes/${q1}"
              as: Distributor
              as_user_id: "${dist}"
              captures: { q1_v1: $.data.version }
            - call: "POST /clm/quotes/${q1}/lines"
              payload: { model_id: "${m2}", quantity: 1, payment_module: "COIN", line_discount_pct: 0.00, expected_quote_version: "${q1_v1}" }
              as: Distributor
              as_user_id: "${dist}"
            - call: "POST /clm/quotes"
              payload: { distributor_id: "${dist}", customer_name: "Wash Barn LLC", laundromat_site_code: "SITE-88", stated_credit_score: 700, financing_program: "NONE", down_payment_cents: 0, package_discount_pct: 0.00, freight_cents: 0 }
              as: Distributor
              as_user_id: "${dist}"
              captures: { q2: $.data.id, q2_v0: $.data.version }
            - call: "POST /clm/quotes/${q2}/lines"
              payload: { model_id: "${m1}", quantity: 2, payment_module: "NONE", line_discount_pct: 0.00, expected_quote_version: "${q2_v0}" }
              as: Distributor
              as_user_id: "${dist}"
          trigger:
            - call: "GET /clm/quote-lines"
              payload: { model_id: "${m1}" }
              as: ChannelManager
              as_user_id: "u-cm-01"
          assert:
