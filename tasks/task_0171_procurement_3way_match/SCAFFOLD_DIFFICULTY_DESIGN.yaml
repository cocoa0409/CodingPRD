              as: Matcher
              as_user_id: "matcher-m1"
              captures: { ms_over: $.data.match_status }
          assert:
            - "Invoice.${inv_ok_id}.match_status == MATCHED (1050 == floor(1000*1.05) passes <=)"
            - "Invoice.${inv_over_id}.match_status == EXCEPTION with a MatchException reason == PRICE_OVER_TOLERANCE (1051 fails)"

      - name: on_time_rate_empty_receipt_set_defaults_to_100_pct
        grounds:
          - calculations.on_time_delivery_rate
          - entities.VendorScorecard.fields.on_time_rate_pct
        distinguishing_aspect: |
          EMPTY-COLLECTION / ZERO-COUNT edge on POST /vendor-scorecards: a scorecard period with
          zero POSTED receipts (total_count == 0) yields on_time_rate_pct == 100 by the explicit
          empty-set default, not 0 and not a division error. A distinct metric and endpoint from
          the numeric price-tolerance boundary.
        test_recipe:
          setup:
            - "A Vendor exists with no goods receipts in (or out of) the scored period."
          setup_api_calls:
            - call: "POST /procurement/_clock/set_current_utc"
