# ===========================================================================
# 1.9 Scaffold Corner Design (Claim Coverage Index)
# Task 2566 - Tax-Exempt Bond Financed Multifamily Development
#
# Breadth companion to SCAFFOLD_DIFFICULTY_DESIGN.yaml. Every row of
# references/claim-extraction-guide.md that applies to this scaffold appears
# below exactly once, either as a real instance with a test_recipe or as an
# excluded_because stub that names the §1.8 instance which already covers it.
# Every element cited in grounds is declared in SCAFFOLD.yaml §1.1-§1.7 and
# every numeric literal was computed by executing the cited §1.3 formula.
#
# COMPACT FIXTURE (CF) - the four-unit chain most instances below reuse.
# It is deliberately smaller than the ten-unit §1.8 fixture so that a corner
# test needs at most a couple of dozen calls, yet it still satisfies the
# set-aside election and lands the fifty-percent test exactly on 5000 bps:
#   Developer "Harborview Partners" (tax_id 81-1000001)
#   CapPool 2026: base 500,000,000 + carryforward 100,000,000 = 600,000,000
#   Project "Harborview Annex": total_units 4, total_floor_space_sqft 3400,
#     land 40,000,000 + depreciable 360,000,000 -> aggregate_basis 400,000,000,
#     election MIN_40_60
#   Units 101 (800 sqft) and 102 (900 sqft): RESTRICTED, bedroom_count 2,
#     ami_percent 60, utility_allowance 12,000, market_rent 150,000
#     -> restricted_rent_cents 109,500 each
#   Units 201 and 202 (850 sqft each): MARKET, bedroom_count 1
#     -> 800 + 900 + 850 + 850 = 3400 sqft, designated_unit_count 4
#   Derived: unit_fraction 5000 bps, floor_space_fraction 5000 bps,
#     applicable_fraction 5000 bps, set_aside_ratio 5000 bps, satisfied true
#   RegulatoryAgreement: MIN_40_60, compliance 15 years, extended use 30 years,
#     county "King", recorded by HfaComplianceOfficer "hfa-comp-1"
#   VolumeCapAllocation: requested 200,000,000, awarded 200,000,000,
#     expiry 2027-06-30, decided by HfaAllocationOfficer "hfa-alloc-1"
#   BondIssue: eligible 190,000,000 + capitalized interest 6,000,000,
#     bond_yield 450 bps, investment_yield 200 bps -> issuance_allowance
#     3,920,000, par exactly 200,000,000, negative-arbitrage allowance
#     4,000,000; issued 2026-09-15 by BondTrustee "trustee-1"
#     -> provisional_fifty_percent_ratio_bps = 200,000,000 / 400,000,000
#        = exactly 5000, automatic_credit_triggered true
#   CostCertification: land 40,000,000, depreciable 360,000,000, eligible
#     355,000,000 -> certified_aggregate_basis 400,000,000, so the final
#     variant on 200,000,000 of funded proceeds is also exactly 5000 bps
#   CreditAllocation at 400 bps: qualified_basis
#     floor(355,000,000*800/3400) + floor(355,000,000*900/3400)
#     = 83,529,411 + 93,970,588 = 177,499,999 (the project-level shortcut
#     floor(355,000,000*1700/3400) = 177,500,000 is the WRONG answer),
#     annual_credit 7,100,000, total_credit 71,000,000
#   Logical clock stays at its declared default 2026-08-01T00:00:00Z unless an
#   instance sets it explicitly.
# ===========================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: developer_creation_returns_active_status_and_zero_active_projects
        claim_type: creation
        grounds:
          - endpoints[POST /developers]
          - entities.Developer.fields.status
          - entities.Developer.fields.sanction_reason
          - entities.Developer.fields.active_project_count
          - roles[HfaAllocationOfficer].exclusive_operations
        distinguishing_aspect: |
          Creation with the three declared input fields returns 201 and the
          three system/computed fields at their declared defaults - status
          ACTIVE, sanction_reason null, active_project_count 0 - and version 1.
          An implementation that leaves active_project_count null, or that omits
          the common_fields block on the create response, fails.
        test_recipe:
          setup:
            - "No setup at all: POST /developers is the root of every chain in this domain and depends on no other row."
          setup_api_calls: []
          trigger:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Developer.${dev_id}.name == 'Harborview Partners'"
            - "Developer.${dev_id}.tax_id == '81-1000001'"
            - "Developer.${dev_id}.contact_email == 'ops@harborview.test'"
            - "Developer.${dev_id}.status == ACTIVE"
            - "Developer.${dev_id}.sanction_reason == null"
            - "Developer.${dev_id}.active_project_count == 0"
            - "Developer.${dev_id}.version == 1"
            - "Developer.${dev_id}.id, created_at and updated_at are all present and non-null"

      - name: project_read_returns_every_derived_fraction_after_designation
        claim_type: retrieval
        grounds:
          - endpoints[GET /projects/{id}]
          - entities.Project.fields.aggregate_basis_cents
          - entities.Project.fields.restricted_unit_count
          - entities.Project.fields.market_unit_count
          - entities.Project.fields.designated_unit_count
          - entities.Project.fields.unit_fraction_bps
          - entities.Project.fields.floor_space_fraction_bps
          - entities.Project.fields.applicable_fraction_bps
          - calculations.applicable_fraction
        distinguishing_aspect: |
          The read-back of a CF project with all four units designated must
          expose the stored input fields AND the recomputed fractions
          (5000/5000/5000 bps on 2 restricted units of 800+900 sqft against
          total_units 4 and 3400 sqft). An implementation that computes the
          fractions only at write time and serves a stale snapshot on GET
          fails, as does one that returns them only from the list endpoint.
        test_recipe:
          setup:
            - "CF developer, project and all four unit rows; nothing else."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 800, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "102", bedroom_count: 2, floor_space_sqft: 900, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "201", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "202", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
          trigger:
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
          assert:
            - "HTTP status is 200"
            - "Project.${proj_id}.total_units == 4 and total_floor_space_sqft == 3400"
            - "Project.${proj_id}.aggregate_basis_cents == 400000000"
            - "Project.${proj_id}.restricted_unit_count == 2"
            - "Project.${proj_id}.market_unit_count == 2"
            - "Project.${proj_id}.employee_unit_count == 0"
            - "Project.${proj_id}.designated_unit_count == 4"
            - "Project.${proj_id}.unit_fraction_bps == 5000"
            - "Project.${proj_id}.floor_space_fraction_bps == 5000"
            - "Project.${proj_id}.applicable_fraction_bps == 5000"
            - "Project.${proj_id}.set_aside_ratio_bps == 5000 and set_aside_satisfied == true"
            - "Project.${proj_id}.development_status == PLANNING and compliance_status == UNRESTRICTED"
            - "Project.${proj_id}.provisional_fifty_percent_ratio_bps == null and final_fifty_percent_ratio_bps == null"

      - name: unit_restriction_list_paginates_with_limit_offset_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /unit-restrictions]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - complexity_profile.consistency_model
        distinguishing_aspect: |
          On the CF project's four unit rows the list endpoint must report
          total_count 4 for the whole filtered set (not the size of the page),
          has_more true at limit 2 offset 0 and has_more false at limit 2 offset
          2, and it must echo the requested limit and offset rather than the
          declared defaults limit 10 / offset 0. A third read filtered to
          designation RESTRICTED must report total_count 2, proving the filter
          is applied before the count.
        test_recipe:
          setup:
            - "CF developer, project and all four unit rows (101 and 102 RESTRICTED, 201 and 202 MARKET)."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 800, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "102", bedroom_count: 2, floor_space_sqft: 900, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "201", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "202", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
          trigger:
            - call: "GET /unit-restrictions"
              payload: { project_id: "${proj_id}", limit: 2, offset: 0 }
              as: HfaComplianceOfficer
              as_user_id: "hfa-comp-1"
            - call: "GET /unit-restrictions"
              payload: { project_id: "${proj_id}", limit: 2, offset: 2 }
              as: HfaComplianceOfficer
              as_user_id: "hfa-comp-1"
            - call: "GET /unit-restrictions"
              payload: { project_id: "${proj_id}", designation: "RESTRICTED" }
              as: HfaComplianceOfficer
              as_user_id: "hfa-comp-1"
          assert:
            - "first read: response_type == 'array', data holds exactly 2 UnitRestriction rows"
            - "first read: limit == 2, offset == 0, total_count == 4, has_more == true"
            - "second read: data holds exactly 2 rows, limit == 2, offset == 2, total_count == 4, has_more == false"
            - "second read returns no row that the first read returned (offset actually skips)"
            - "third read: limit == 10 and offset == 0 (the declared pagination defaults), total_count == 2, has_more == false"
            - "third read: every returned row has designation == RESTRICTED"

      - name: unknown_path_ids_return_the_entity_specific_not_found_code_for_all_fourteen_entities
        claim_type: not_found
        grounds:
          - validations[priority=50]
          - errors[ERR_DEVELOPER_NOT_FOUND]
          - errors[ERR_INVESTOR_NOT_FOUND]
          - errors[ERR_CAP_POOL_NOT_FOUND]
          - errors[ERR_PROJECT_NOT_FOUND]
          - errors[ERR_ALLOCATION_NOT_FOUND]
          - errors[ERR_BOND_ISSUE_NOT_FOUND]
          - errors[ERR_DRAW_REQUEST_NOT_FOUND]
          - errors[ERR_UNIT_RESTRICTION_NOT_FOUND]
          - errors[ERR_REG_AGREEMENT_NOT_FOUND]
          - errors[ERR_COST_CERT_NOT_FOUND]
          - errors[ERR_CREDIT_ALLOCATION_NOT_FOUND]
          - errors[ERR_DELIVERY_NOT_FOUND]
          - errors[ERR_COMPLIANCE_REPORT_NOT_FOUND]
          - errors[ERR_INSPECTION_NOT_FOUND]
        distinguishing_aspect: |
          Fourteen entities each own a distinct 404 code, so a single shared
          ERR_NOT_FOUND is wrong. Every read below uses the same syntactically
          valid but unstored id and the same permitted role, isolating the
          entity-to-code mapping of validations[priority=50] as the only
          variable.
        test_recipe:
          setup:
            - "Empty server: no row of any entity is created, so every id below is unstored."
          setup_api_calls: []
          trigger:
            - call: "GET /developers/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { err_dev: $.data.error_id }
            - call: "GET /investors/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
            - call: "GET /cap-pools/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
            - call: "GET /projects/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
            - call: "GET /volume-cap-allocations/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
            - call: "GET /bond-issues/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
            - call: "GET /draw-requests/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
            - call: "GET /unit-restrictions/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
            - call: "GET /regulatory-agreements/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
            - call: "GET /cost-certifications/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
            - call: "GET /credit-allocations/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
            - call: "GET /investor-deliveries/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
            - call: "GET /compliance-reports/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
            - call: "GET /physical-inspections/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
          assert:
            - "every one of the fourteen reads returns HTTP 404 with response_type == 'error'"
            - "captured err_dev == 'ERR_DEVELOPER_NOT_FOUND'"
            - "the codes returned, in call order, are exactly ERR_DEVELOPER_NOT_FOUND, ERR_INVESTOR_NOT_FOUND, ERR_CAP_POOL_NOT_FOUND, ERR_PROJECT_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_BOND_ISSUE_NOT_FOUND, ERR_DRAW_REQUEST_NOT_FOUND, ERR_UNIT_RESTRICTION_NOT_FOUND, ERR_REG_AGREEMENT_NOT_FOUND, ERR_COST_CERT_NOT_FOUND, ERR_CREDIT_ALLOCATION_NOT_FOUND, ERR_DELIVERY_NOT_FOUND, ERR_COMPLIANCE_REPORT_NOT_FOUND, ERR_INSPECTION_NOT_FOUND"
            - "no two of the fourteen responses carry the same error_id"

      - name: unit_creation_missing_required_market_rent_cents_returns_4XX_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /unit-restrictions]
          - validations[priority=40]
          - errors[ERR_INVALID_REQUEST]
          - entities.UnitRestriction.fields.market_rent_cents
          - entities.UnitRestriction.fields.ami_percent
        distinguishing_aspect: |
          market_rent_cents carries no default, so omitting it is a 400 even
          though the row could arithmetically be stored; ami_percent DOES carry
          a default of null, so omitting it on a MARKET row is accepted. The
          pair separates "declared input with no default" from "declared input
          with a default", and no UnitRestriction row may exist afterwards.
        test_recipe:
          setup:
            - "CF developer and project only; no unit rows yet."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "201", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "201", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: 10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { unit_id: $.data.id }
          assert:
            - "first call returns HTTP 400 and captured err_id == 'ERR_INVALID_REQUEST'"
            - "second call returns HTTP 201 with ami_percent == null and restricted_rent_cents == null"
            - "UnitRestriction.${unit_id}.status == PROPOSED"
            - "Project.${proj_id}.designated_unit_count == 1 (the rejected call stored nothing)"
            - "Project.${proj_id}.market_unit_count == 1 and restricted_unit_count == 0"

      - name: cap_pool_created_without_carryforward_applies_the_declared_zero_default
        claim_type: defaults
        grounds:
          - endpoints[POST /cap-pools]
          - entities.CapPool.fields.carryforward_cents
          - entities.CapPool.fields.total_cap_cents
          - entities.CapPool.fields.pool_status
          - calculations.cap_pool_availability
        distinguishing_aspect: |
          Omitting the optional carryforward_cents must apply the declared
          default 0 and flow it through the whole availability identity
          (total 500,000,000, reserved 0, committed 0, available 500,000,000,
          awardable 500,000,000, pool_status OPEN). An implementation that
          leaves the field null and then propagates null into total_cap_cents,
          or that treats the absent key as an error, fails.
        test_recipe:
          setup:
            - "Nothing: the pool is the second root row of the domain and needs no parent."
          setup_api_calls: []
          trigger:
            - call: "POST /cap-pools"
              payload: { program_year: 2026, base_cap_cents: 500000000 }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { pool_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "CapPool.${pool_id}.carryforward_cents == 0"
            - "CapPool.${pool_id}.total_cap_cents == 500000000"
            - "CapPool.${pool_id}.reserved_cents == 0 and committed_cents == 0"
            - "CapPool.${pool_id}.available_cents == 500000000 and awardable_cents == 500000000"
            - "CapPool.${pool_id}.pool_status == OPEN"
            - "CapPool.${pool_id}.version == 1"

      - name: project_computed_basis_and_fraction_fields_are_recomputed_and_body_input_ignored
        claim_type: computed_fields
        grounds:
          - endpoints[POST /projects]
          - validations[priority=40]
          - entities.Project.fields.aggregate_basis_cents
          - entities.Project.fields.applicable_fraction_bps
          - entities.Project.fields.set_aside_satisfied
          - calculations.applicable_fraction
        distinguishing_aspect: |
          validations[priority=40] declares that unknown keys are ignored rather
          than rejected, so a body that also carries aggregate_basis_cents 999,
          applicable_fraction_bps 9999 and set_aside_satisfied true must be
          accepted with 201 while every one of those computed fields is derived
          from scratch: 400,000,000 for the basis and, with no unit rows yet,
          0 bps for all three fractions and false for set_aside_satisfied.
        test_recipe:
          setup:
            - "CF developer only."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60", aggregate_basis_cents: 999, applicable_fraction_bps: 9999, set_aside_satisfied: true, automatic_credit_triggered: true }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
          assert:
            - "HTTP status is 201 (the unknown keys are ignored, not rejected)"
            - "Project.${proj_id}.aggregate_basis_cents == 400000000"
            - "Project.${proj_id}.applicable_fraction_bps == 0"
            - "Project.${proj_id}.unit_fraction_bps == 0 and floor_space_fraction_bps == 0"
            - "Project.${proj_id}.set_aside_ratio_bps == 0 and set_aside_satisfied == false"
            - "Project.${proj_id}.automatic_credit_triggered == false"
            - "Project.${proj_id}.provisional_fifty_percent_ratio_bps == null"
            - "Developer.${dev_id}.active_project_count == 1"

      - name: developer_system_fields_are_server_owned_and_body_input_ignored
        claim_type: system_fields
        grounds:
          - endpoints[POST /developers]
          - validations[priority=40]
          - entities.Developer.fields.status
          - entities.Developer.fields.sanction_reason
          - state_machines.Developer.initial_state
        distinguishing_aspect: |
          A create body that tries to seed id, status, sanction_reason, version
          and created_at must be accepted while every one of those fields comes
          from the server: the id differs from the supplied string, status is
          the declared initial state ACTIVE rather than the supplied DEBARRED,
          sanction_reason stays null and version is 1 rather than 7.
        test_recipe:
          setup:
            - "Nothing."
          setup_api_calls: []
          trigger:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test", id: "dev-forced-1", status: "DEBARRED", sanction_reason: "seeded", version: 7, created_at: "2001-01-01T00:00:00Z" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "Developer.${dev_id}.id != 'dev-forced-1'"
            - "Developer.${dev_id}.status == ACTIVE"
            - "Developer.${dev_id}.sanction_reason == null"
            - "Developer.${dev_id}.version == 1"
            - "Developer.${dev_id}.created_at != '2001-01-01T00:00:00Z'"
            - "GET /developers/dev-forced-1 returns HTTP 404 with error_id ERR_DEVELOPER_NOT_FOUND"

      - name: out_of_set_enum_and_zero_unit_count_are_rejected_by_the_body_rule
        claim_type: type_constraints
        grounds:
          - endpoints[POST /projects]
          - endpoints[POST /unit-restrictions]
          - validations[priority=40]
          - errors[ERR_INVALID_REQUEST]
          - entities.Project.fields.set_aside_election
          - entities.Project.fields.total_units
          - entities.UnitRestriction.fields.designation
        distinguishing_aspect: |
          Three separate type constraints of validations[priority=40] are
          probed against one fixture: an enum outside {MIN_20_50, MIN_40_60,
          AVG_INCOME}, a *_units field of 0 where the entity requires at least
          one, and a negative *_cents field. All three are 400 ERR_INVALID_REQUEST
          and none of them may store a row, which separates body validation
          from the business rules at priority 110 and above.
        test_recipe:
          setup:
            - "CF developer and project (the project is needed only so the third probe has a resolvable FK)."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Bad Election", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_30_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_enum: $.data.error_id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Zero Units", total_units: 0, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_units: $.data.error_id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "201", bedroom_count: 1, floor_space_sqft: 850, designation: "MARKET", utility_allowance_cents: -10000, market_rent_cents: 180000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_cents: $.data.error_id }
          assert:
            - "all three calls return HTTP 400"
            - "captured err_enum == 'ERR_INVALID_REQUEST'"
            - "captured err_units == 'ERR_INVALID_REQUEST'"
            - "captured err_cents == 'ERR_INVALID_REQUEST'"
            - "Developer.${dev_id}.active_project_count == 1 (neither rejected project was stored)"
            - "Project.${proj_id}.designated_unit_count == 0"

      - name: project_with_unknown_developer_id_returns_developer_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[POST /projects]
          - validations[priority=60]
          - errors[ERR_DEVELOPER_NOT_FOUND]
          - entities.Project.fields.developer_id
        distinguishing_aspect: |
          Project.developer_id is the sponsor FK every developer-scoped write
          keys off, so an unstored developer_id must fail with the DEVELOPER
          404 - not ERR_PROJECT_NOT_FOUND (no project exists yet) and not
          ERR_INVALID_REQUEST (the body is well formed). The follow-up create
          with the stored id proves the fixture itself is sound.
        test_recipe:
          setup:
            - "One CF developer exists; the id used in the trigger is a different, unstored one."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { developer_id: "22222222-2222-4222-8222-222222222222", name: "Orphan Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "22222222-2222-4222-8222-222222222222"
              captures: { err_id: $.data.error_id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
          assert:
            - "first call returns HTTP 404 and captured err_id == 'ERR_DEVELOPER_NOT_FOUND'"
            - "second call returns HTTP 201 and Project.${proj_id}.developer_id == ${dev_id}"
            - "Developer.${dev_id}.active_project_count == 1"

      - name: flat_topology_bond_issue_with_two_bad_foreign_keys_reports_the_first_in_declaration_order
        claim_type: foreign_key_references_validated
        grounds:
          - complexity_profile.entity_topology
          - endpoints[POST /bond-issues]
          - validations[priority=60]
          - errors[ERR_PROJECT_NOT_FOUND]
          - errors[ERR_ALLOCATION_NOT_FOUND]
          - entities.BondIssue.fields.project_id
          - entities.BondIssue.fields.volume_cap_allocation_id
        distinguishing_aspect: |
          The topology is flat, so BondIssue carries two independent FKs and
          validations[priority=60] pins their resolution order to the §1.1
          declaration order: project_id first. A body with BOTH keys unstored
          returns ERR_PROJECT_NOT_FOUND, while a body with a good project and a
          bad allocation returns ERR_ALLOCATION_NOT_FOUND - the pair proves the
          order rather than merely that a 404 happens.
        test_recipe:
          setup:
            - "CF developer and project only. No cap pool award and no allocation row exist, so the second probe's allocation id is unstored while its project id resolves."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /bond-issues"
              payload: { project_id: "33333333-3333-4333-8333-333333333333", volume_cap_allocation_id: "44444444-4444-4444-8444-444444444444", eligible_cost_cents: 190000000, capitalized_interest_cents: 6000000, bond_yield_bps: 450, investment_yield_bps: 200 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_both: $.data.error_id }
            - call: "POST /bond-issues"
              payload: { project_id: "${proj_id}", volume_cap_allocation_id: "44444444-4444-4444-8444-444444444444", eligible_cost_cents: 190000000, capitalized_interest_cents: 6000000, bond_yield_bps: 450, investment_yield_bps: 200 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_alloc: $.data.error_id }
          assert:
            - "both calls return HTTP 404"
            - "captured err_both == 'ERR_PROJECT_NOT_FOUND' (declaration order, not ERR_ALLOCATION_NOT_FOUND)"
            - "captured err_alloc == 'ERR_ALLOCATION_NOT_FOUND'"
            - "no BondIssue row exists: GET /bond-issues with project_id ${proj_id} returns total_count == 0"

  - section: state_machines
    instances:
      - name: newly_created_rows_open_in_their_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.VolumeCapAllocation.initial_state
          - state_machines.RegulatoryAgreement.initial_state
          - state_machines.CostCertification.initial_state
          - state_machines.UnitRestriction.initial_state
          - entities.VolumeCapAllocation.fields.decision_round
          - entities.CostCertification.fields.submission_round
          - entities.UnitRestriction.fields.status
        distinguishing_aspect: |
          Four machines declare four different initial states and two of them
          declare non-zero-vs-zero round counters: an allocation opens PENDING
          with decision_round 1, a certification opens DRAFT with
          submission_round 0 (the first submit makes it 1), an agreement opens
          DRAFT and a unit opens PROPOSED. An implementation that copies one
          initial state across the domain, or that starts submission_round at 1,
          fails.
        test_recipe:
          setup:
            - "CF developer, cap pool and project. No unit rows, no award, nothing issued."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /cap-pools"
              payload: { program_year: 2026, base_cap_cents: 500000000, carryforward_cents: 100000000 }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { pool_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /volume-cap-allocations"
              payload: { project_id: "${proj_id}", cap_pool_id: "${pool_id}", requested_amount_cents: 200000000, requested_closing_date: "2026-09-15T00:00:00Z" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { alloc_id: $.data.id }
            - call: "POST /regulatory-agreements"
              payload: { project_id: "${proj_id}", set_aside_election: "MIN_40_60", compliance_period_years: 15, extended_use_years: 30, recording_county: "King" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /cost-certifications"
              payload: { project_id: "${proj_id}", certified_land_cost_cents: 40000000, certified_depreciable_basis_cents: 360000000, certified_eligible_basis_cents: 355000000, preparer_name: "Nolan CPA" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { cc_id: $.data.id }
            - call: "POST /unit-restrictions"
              payload: { project_id: "${proj_id}", unit_number: "101", bedroom_count: 2, floor_space_sqft: 800, designation: "RESTRICTED", ami_percent: 60, utility_allowance_cents: 12000, market_rent_cents: 150000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { unit_id: $.data.id }
          assert:
            - "VolumeCapAllocation.${alloc_id}.status == PENDING"
            - "VolumeCapAllocation.${alloc_id}.decision_round == 1"
            - "VolumeCapAllocation.${alloc_id}.awarded_amount_cents == null and expiry_date == null"
            - "RegulatoryAgreement.${ra_id}.status == DRAFT"
            - "RegulatoryAgreement.${ra_id}.instrument_number == null and amendment_count == 0"
            - "CostCertification.${cc_id}.status == DRAFT"
            - "CostCertification.${cc_id}.submission_round == 0"
            - "UnitRestriction.${unit_id}.status == PROPOSED"
            - "UnitRestriction.${unit_id}.restricted_rent_cents == 109500 and imputed_household_size == 3"
            - "Project.${proj_id}.development_status == PLANNING and compliance_status == UNRESTRICTED"

      - name: denying_a_pending_allocation_stamps_the_reason_and_releases_the_reservation
        claim_type: valid_transition
        grounds:
          - state_machines.VolumeCapAllocation.PENDING_to_DENIED
          - endpoints[POST /volume-cap-allocations/{id}/decision]
          - entities.VolumeCapAllocation.fields.denial_reason
          - entities.VolumeCapAllocation.fields.decided_by_user_id
          - calculations.cap_pool_availability
          - concurrency_rules[award-decision-stale-cap-pool]
        distinguishing_aspect: |
          The PENDING -> DENIED transition is the cheapest place where all four
          declared effects must land together: status, denial_reason,
          decided_by_user_id, and the pool recomputation that drops
          reserved_cents from 200,000,000 back to 0 while committed_cents stays
          0. It is also the positive half of the OCC guard - the version
          captured from the pool read is accepted - and the pool version is
          exactly 3 (1 at creation, 2 after the allocation reserved cap, 3 after
          this denial).
        test_recipe:
          setup:
            - "CF developer, cap pool (total 600,000,000) and project."
            - "One PENDING allocation for 200,000,000, which reserves that amount against the pool."
            - "A pool read taken immediately before the decision so the OCC guard carries the current version."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /cap-pools"
              payload: { program_year: 2026, base_cap_cents: 500000000, carryforward_cents: 100000000 }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { pool_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /volume-cap-allocations"
              payload: { project_id: "${proj_id}", cap_pool_id: "${pool_id}", requested_amount_cents: 200000000, requested_closing_date: "2026-09-15T00:00:00Z" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { alloc_id: $.data.id }
            - call: "GET /cap-pools/${pool_id}"
              payload: {}
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { pool_v: $.data.version, reserved_before: $.data.reserved_cents }
          trigger:
            - call: "POST /volume-cap-allocations/${alloc_id}/decision"
              payload: { decision: "DENY", denial_reason: "scoring below the funding line", expected_cap_pool_version: "${pool_v}" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
          assert:
            - "HTTP status is 200"
            - "captured reserved_before == 200000000 and captured pool_v == 2"
            - "VolumeCapAllocation.${alloc_id}.status == DENIED"
            - "VolumeCapAllocation.${alloc_id}.denial_reason == 'scoring below the funding line'"
            - "VolumeCapAllocation.${alloc_id}.decided_by_user_id == 'hfa-alloc-1'"
            - "VolumeCapAllocation.${alloc_id}.awarded_amount_cents == null and expiry_date == null"
            - "VolumeCapAllocation.${alloc_id}.decision_round == 1"
            - "CapPool.${pool_id}.reserved_cents == 0 and committed_cents == 0"
            - "CapPool.${pool_id}.available_cents == 600000000 and awardable_cents == 600000000"
            - "CapPool.${pool_id}.pool_status == OPEN"
            - "CapPool.${pool_id}.version == 3"
            - "Project.${proj_id}.financing_stalled == false and volume_cap_deferral_count == 0"

      - name: returning_or_revising_a_pending_allocation_has_no_outgoing_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.VolumeCapAllocation.AWARDED_to_RETURNED
          - state_machines.VolumeCapAllocation.DEFERRED_to_PENDING
          - validations[priority=81]
          - errors[ERR_ALLOCATION_STATE_INVALID]
        distinguishing_aspect: |
          From PENDING the only outgoing triggers are the decision endpoint and
          the system deferral, so both developer-driven triggers - return, whose
          only source state is AWARDED, and revise, whose sources are DEFERRED,
          DENIED and RETURNED - must fail with the allocation's own 409 while
          the row keeps status PENDING, decision_round 1 and its reservation
          against the pool.
        test_recipe:
          setup:
            - "CF developer, cap pool and project with one PENDING allocation for 200,000,000."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /cap-pools"
              payload: { program_year: 2026, base_cap_cents: 500000000, carryforward_cents: 100000000 }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { pool_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /volume-cap-allocations"
              payload: { project_id: "${proj_id}", cap_pool_id: "${pool_id}", requested_amount_cents: 200000000, requested_closing_date: "2026-09-15T00:00:00Z" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /volume-cap-allocations/${alloc_id}/return"
              payload: { return_reason: "sponsor withdrew" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_return: $.data.error_id }
            - call: "POST /volume-cap-allocations/${alloc_id}/revise"
              payload: { requested_amount_cents: 150000000, requested_closing_date: "2026-10-15T00:00:00Z" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_revise: $.data.error_id }
          assert:
            - "both calls return HTTP 409"
            - "captured err_return == 'ERR_ALLOCATION_STATE_INVALID'"
            - "captured err_revise == 'ERR_ALLOCATION_STATE_INVALID'"
            - "VolumeCapAllocation.${alloc_id}.status == PENDING"
            - "VolumeCapAllocation.${alloc_id}.requested_amount_cents == 200000000 (the revise did not overwrite it)"
            - "VolumeCapAllocation.${alloc_id}.decision_round == 1 and return_reason == null"
            - "CapPool.${pool_id}.reserved_cents == 200000000 and version == 2"

      - name: debarred_sponsor_admits_no_further_sanction_action
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Developer.terminal_states
          - state_machines.Developer.ACTIVE_to_DEBARRED
          - endpoints[POST /developers/{id}/sanctions]
          - validations[priority=81]
          - errors[ERR_DEVELOPER_NOT_ACTIVE]
          - entities.Developer.fields.sanction_reason
        distinguishing_aspect: |
          DEBARRED is the Developer machine's only terminal state and the
          machine declares no outgoing transition from it, so a repeated DEBAR
          and a REINSTATE - which would otherwise be legal from SUSPENDED -
          are both refused, and the sanction_reason recorded by the successful
          DEBAR survives untouched. Version must stay at the value the DEBAR
          left, proving the refused calls wrote nothing.
        test_recipe:
          setup:
            - "One CF developer, still ACTIVE at version 1."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /developers/${dev_id}/sanctions"
              payload: { action: "DEBAR", reason: "material misrepresentation in the application" }
              as: HfaComplianceOfficer
              as_user_id: "hfa-comp-1"
            - call: "POST /developers/${dev_id}/sanctions"
              payload: { action: "DEBAR", reason: "second debarment attempt" }
              as: HfaComplianceOfficer
              as_user_id: "hfa-comp-1"
              captures: { err_debar: $.data.error_id }
            - call: "POST /developers/${dev_id}/sanctions"
              payload: { action: "REINSTATE", reason: "appeal granted" }
              as: HfaComplianceOfficer
              as_user_id: "hfa-comp-1"
              captures: { err_reinstate: $.data.error_id }
          assert:
            - "first call returns HTTP 200 with Developer.${dev_id}.status == DEBARRED and version == 2"
            - "second and third calls both return HTTP 409"
            - "captured err_debar == 'ERR_DEVELOPER_NOT_ACTIVE'"
            - "captured err_reinstate == 'ERR_DEVELOPER_NOT_ACTIVE'"
            - "Developer.${dev_id}.status == DEBARRED"
            - "Developer.${dev_id}.sanction_reason == 'material misrepresentation in the application'"
            - "Developer.${dev_id}.version == 2"

      - name: recording_an_already_recorded_agreement_is_refused_because_no_trigger_replays
        claim_type: idempotency
        grounds:
          - state_machines.RegulatoryAgreement.DRAFT_to_RECORDED
          - state_machines.RegulatoryAgreement.AMENDMENT_PENDING_to_RECORDED
          - validations[priority=81]
          - errors[ERR_REG_AGREEMENT_STATE_INVALID]
          - entities.RegulatoryAgreement.fields.instrument_number
          - entities.RegulatoryAgreement.fields.amendment_count
        distinguishing_aspect: |
          §1.4 priority 81 states there is no idempotent replay anywhere in this
          domain, so a second record with a DIFFERENT instrument_number must be
          refused rather than quietly overwriting: RECORDED has an incoming
          record trigger only from AMENDMENT_PENDING. The first instrument
          number survives and amendment_count stays 0, which is what separates
          "rejected replay" from "accepted re-recording".
        test_recipe:
          setup:
            - "CF developer, project and all four units, so designated_unit_count == total_units == 4 and set_aside_satisfied is true."
            - "One agreement created (MIN_40_60, 15 and 30 years, King county) and recorded once with instrument_number KC-2026-0001."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Harborview Partners", tax_id: "81-1000001", contact_email: "ops@harborview.test" }
              as: HfaAllocationOfficer
              as_user_id: "hfa-alloc-1"
              captures: { dev_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", name: "Harborview Annex", total_units: 4, total_floor_space_sqft: 3400, land_cost_cents: 40000000, depreciable_basis_cents: 360000000, set_aside_election: "MIN_40_60" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /unit-restrictions"
