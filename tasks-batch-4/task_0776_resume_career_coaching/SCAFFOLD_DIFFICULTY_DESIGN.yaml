            - call: "POST /orders/${o2}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /orders/${o2}"
              payload: {}
              as: CareerAdmin
              captures: { v_o2: $.data.version }
            - call: "POST /orders/${o2}/sessions"
              payload: { coach_id: "${coach_id}", session_type: "COACHING", scheduled_start: "2026-04-01T10:00:00Z", scheduled_end: "2026-04-01T11:00:00Z", expected_order_version: "${v_o2}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { sess_o2: $.data.id }
            - call: "POST /orders"
