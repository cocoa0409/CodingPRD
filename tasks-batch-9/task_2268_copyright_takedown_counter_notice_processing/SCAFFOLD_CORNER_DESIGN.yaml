        claim_type: ledger_sync
        grounds:
          - state_machines.NoticeClaim.RESTORATION_SCHEDULED->RESTORED.side_effects
          - entities.Account.fields.available_content_count
        distinguishing_aspect: "Disabling and restoring a claim must leave Account.available_content_count reconciled with the item states."
        excluded_because:
          difficulty_instance: claim_restoration_returns_available_content_count_to_the_pre_disable_value
          rationale: "The §1.8 instance reconciles the derived counter before and after the disable/restore round trip, so a separate ledger-sync recipe would duplicate it."
      - name: reference_file_quarantine_cascades_only_to_non_terminal_claims
        claim_type: conditional_cascade
        grounds:
          - state_machines.ReferenceFile.ACTIVE->QUARANTINED.side_effects
          - state_machines.RightsHolder.ENROLLED->SUSPENDED.side_effects
        distinguishing_aspect: "Quarantine withdraws only the non-terminal claims that selected the file; UPHELD claims and PENDING files must be left alone."
        excluded_because:
          difficulty_instance: substantiated_misrepresentation_cascades_suspension_quarantine_withdrawal_and_void
          rationale: "The §1.8 instance already exercises the suspension-driven quarantine with a mix of ACTIVE and PENDING files and terminal and non-terminal claims, pinning exactly which children move."
