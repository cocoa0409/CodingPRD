              captures: { expired_affiliations: "$.data.expired_affiliation_count" }
          trigger:
            - call: "POST /retrans/agreements/${agr_id}/execute"
              payload: { execution_note: "Countersigned by second counsel" }
              as: GroupCounsel
              as_user_id: "counsel-2"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "${expired_affiliations} == 1"
            - "AffiliationAgreement.${aff_id}.status == EXPIRED"
            - "HTTP status is 422"
            - "${err_id} == \"ERR_AFFILIATION_NOT_ACTIVE\""
            - "CarriageAgreement.${agr_id}.execution_status == PENDING_EXECUTION (unchanged)"
            - "CarriageAgreement.${agr_id}.network_approval_status == NETWORK_APPROVED (the guard is on the affiliation, not the network dimension)"
            - "CarriageAgreement.${agr_id}.executed_at_utc == null"
            - "Offer.${off_id}.status == ACCEPTED (the earlier submission stays valid)"

      - name: settlement_true_up_guarded_on_subscriber_report_adjustment_state
        grounds:
          - validations[priority=19]
          - state_machines.SubscriberReport.UNDER_AUDIT_to_ADJUSTED
          - state_machines.FeeSettlement.ISSUED_to_TRUED_UP
          - entities.SubscriberReport.fields.audit_adjustment_subscribers
          - entities.FeeSettlement.fields.basis_variant
          - calculations.subscriber_basis_determination
        distinguishing_aspect: |
          A different entity pair from the affiliation instance — (FeeSettlement, SubscriberReport) —
          and a guard that opens rather than closes over time: the identical true-up call is refused
          with ERR_TRUE_UP_NOT_REQUIRED while the report is still REPORTED with a zero adjustment,
          then succeeds unchanged once an audit finding is substantiated and the report reaches
          ADJUSTED. The settlement's own state is ISSUED in both attempts, so only the counterpart
          entity's state can explain the difference.
