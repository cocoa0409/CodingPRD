          - "roles.ComplianceAnalyst"
          - "errors.ERR_UNAUTHORIZED_ROLE"
        distinguishing_aspect: "Fraud confirm is exclusive to ComplianceAnalyst; DataOps (which can exclude transactions) is rejected 403."
