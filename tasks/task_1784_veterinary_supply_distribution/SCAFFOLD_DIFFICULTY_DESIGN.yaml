    distinguishing_aspect: "Entity pair Order -> ManufacturerAuthorization (different pair than\nOrder -> Clinic): a SUBMITTED order carrying an Rx line cannot be\napproved while the matching authorization\
      \ is PENDING \u2014 the gate is\nthe authorization's lifecycle state plus validity window.\n"
    test_recipe:
