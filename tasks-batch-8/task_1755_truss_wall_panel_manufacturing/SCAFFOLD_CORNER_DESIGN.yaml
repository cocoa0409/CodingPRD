  - section: errors
    instances:
      - name: seal_with_expired_license_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_ENGINEER_LICENSE_EXPIRED]"]
        distinguishing_aspect: "Engineer license_expiry 2026-01-01 < default clock 2026-08-01 blocks sealing a properly submitted design; expiry exactly == clock would pass (>= semantics)."
        test_recipe:
          setup: ["job confirmed; design TR-01 in SEAL_REQUESTED submitted by eng1; engX license expired 2026-01-01; engY license expiry exactly 2026-08-01T00:00:00Z (equal to default clock)"]
          setup_api_calls:
