              payload: { program_id: "${prog_id}", account_name: "Harborline Crew", arrival_date: "2026-10-05", night_count: 2, room_count: 5, rate_cents: 20000, expected_program_version: "${prog_v3}" }
              as: CommercialDirector
              as_user_id: "cd-1"
              captures: { block_1: "$.data.id" }
            - call: "POST /pre-opening/programs/${prog_id}/suspend-booking"
              payload: { reason: "Sales pause" }
              as: CommercialDirector
              as_user_id: "cd-1"
