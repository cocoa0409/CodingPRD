        grounds:
          - state_machines.Call.handling_status.WRAP_UP_to_COMPLETED
          - state_machines.ClientAccount.status.ACTIVE_to_SUSPENDED
          - entities.BillingPeriod.fields.overage_charge_cents
          - entities.Appointment.fields.status
          - entities.CalendarSlot.fields.booked_count
        distinguishing_aspect: |
          Depth-4 cascade, each link caused by the prior: (1) call complete bills
          and bumps BillingPeriod.overage_charge_cents to/over hard_cap; (2) that
          ledger crossing bubbles ClientAccount ACTIVE -> SUSPENDED; (3) the
          SUSPEND transition cancels every non-terminal Appointment; (4) each
          cancellation decrements its CalendarSlot.booked_count. No fan-out — each
          hop fires because the previous hop mutated its source.
