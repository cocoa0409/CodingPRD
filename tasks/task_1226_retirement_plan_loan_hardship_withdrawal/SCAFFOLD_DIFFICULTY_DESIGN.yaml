# =============================================================================
# Task 1226: Retirement Plan Loan & Hardship Withdrawal — §1.8 Difficulty Design
# 9 rules x 2 instances = 18 instances
# Canonical fixture constants used across instances:
#   default plan policy: max_loans_outstanding=1, min_loan 100,000c,
#   max_loan 5,000,000c, term<=60mo, rate 500bps, THIRTY_360, refinance off,
#   refi lookback 12mo, suspension 6mo, FULL_DOCUMENTATION, withholding 2000bps,
#   chains [PLAN_SPONSOR, RECORDKEEPER_ADMIN]; clock default 2026-05-01T00:00:00Z.
#   1,000,000c / 500bps / 12mo schedule (30/360): payment 85,607c;
#   installments 1..5 interest portions 4,167 / 3,827 / 3,487 / 3,144 / 2,801;
#   outstanding after installment 1 paid: 918,560c.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: amortization_day_count_variants_diverge
        grounds:
          - calculations.amortization_schedule
          - entities.Plan.fields.day_count_convention
          - entities.LoanInstallment.fields.interest_portion_cents
        distinguishing_aspect: |
          Entity domain Loan: identical principal/term/rate/disbursed_on under two
          plans differing only in day_count_convention produce different installment
          interest portions (THIRTY_360 4,167c vs ACT_360 4,306c for installment 1,
          whose period spans 31 actual days from 2026-05-01 to 2026-06-01) while the
          level payment formula is shared (85,607c).
        test_recipe:
          setup:
            - "Plan A (THIRTY_360) and Plan B (ACT_360), each with a participant vested 10,000,000c"
            - "Both participants hold an identical 1,000,000c / 12-month loan fully approved and disbursed at clock 2026-05-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan A", day_count_convention: "THIRTY_360" }, as: RecordkeeperAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /plans", payload: { name: "Plan B", day_count_convention: "ACT_360" }, as: RecordkeeperAdmin, captures: { plan_b: "$.data.id" } }
            - { call: "POST /plans/${plan_a}/participants", payload: { full_name: "Pat A", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { pa: "$.data.id" } }
            - { call: "POST /plans/${plan_b}/participants", payload: { full_name: "Pat B", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { pb: "$.data.id" } }
            - { call: "POST /participants/${pa}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${pa}", captures: { loan_a: "$.data.id" } }
            - { call: "POST /participants/${pb}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${pb}", captures: { loan_b: "$.data.id" } }
            - { call: "GET /loans/${loan_a}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { a_t1: "$.data[0].id", a_t2: "$.data[1].id" } }
            - { call: "GET /loans/${loan_b}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { b_t1: "$.data[0].id", b_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${a_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${a_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /approval-tasks/${b_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${b_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_a}/disburse", payload: {}, as: RecordkeeperAdmin }
            - { call: "POST /loans/${loan_b}/disburse", payload: {}, as: RecordkeeperAdmin }
          trigger:
            - { call: "GET /loans/${loan_a}/installments", payload: {}, as: RecordkeeperAdmin, captures: { a_i1_interest: "$.data[0].interest_portion_cents", a_i1_pmt: "$.data[0].scheduled_amount_cents" } }
            - { call: "GET /loans/${loan_b}/installments", payload: {}, as: RecordkeeperAdmin, captures: { b_i1_interest: "$.data[0].interest_portion_cents", b_i1_pmt: "$.data[0].scheduled_amount_cents" } }
          assert:
            - "captured a_i1_interest == 4167"
            - "captured b_i1_interest == 4306"
            - "captured a_i1_pmt == 85607 and captured b_i1_pmt == 85607"
            - "captured a_i1_interest != captured b_i1_interest"

      - name: hardship_gross_up_net_vs_gross_variants
        grounds:
          - calculations.hardship_gross_up
          - entities.HardshipRequest.fields.amount_semantics
          - entities.HardshipRequest.fields.gross_withdrawal_cents
        distinguishing_aspect: |
          Entity domain HardshipRequest (distinct from Loan above): identical
          amount_cents=800,000 under withholding 2000bps produces gross_withdrawal
          1,006,250c with net 800,000c under amount_semantics=NET, versus
          gross 800,000c with net 635,000c under GROSS — the NET variant also
          selects fee tier LOW because provisional gross 1,000,000c equals the
          1,000,000c threshold (<= boundary).
        test_recipe:
          setup:
            - "One plan (withholding default 2000bps) with participants P1 and P2, each vested 20,000,000c, no suspension"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan GU" }, as: RecordkeeperAdmin, captures: { plan_gu: "$.data.id" } }
            - { call: "POST /plans/${plan_gu}/participants", payload: { full_name: "Net Ned", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_net: "$.data.id" } }
            - { call: "POST /plans/${plan_gu}/participants", payload: { full_name: "Gross Greta", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_gross: "$.data.id" } }
          trigger:
            - { call: "POST /participants/${p_net}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 800000, amount_semantics: "NET" }, as: Participant, as_user_id: "${p_net}", captures: { h_net: "$.data.id", net_gross: "$.data.gross_withdrawal_cents", net_wh: "$.data.withholding_cents", net_fee: "$.data.fee_cents", net_net: "$.data.net_disbursed_cents" } }
            - { call: "POST /participants/${p_gross}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 800000, amount_semantics: "GROSS" }, as: Participant, as_user_id: "${p_gross}", captures: { g_gross: "$.data.gross_withdrawal_cents", g_wh: "$.data.withholding_cents", g_fee: "$.data.fee_cents", g_net: "$.data.net_disbursed_cents" } }
          assert:
            - "captured net_gross == 1006250 and net_wh == 201250 and net_fee == 5000 and net_net == 800000"
            - "captured g_gross == 800000 and g_wh == 160000 and g_fee == 5000 and g_net == 635000"
            - "captured net_gross != captured g_gross for identical amount_cents input"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: loan_maximum_nested_min_max
        grounds:
          - calculations.loan_maximum_amount
          - endpoints["GET /participants/{id}/loan-eligibility"]
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear nested min/max interaction:
          vested_component floor(12,000,000c * 0.5)=6,000,000c, IRC cap 5,000,000c,
          plan cap 4,000,000c; the plan cap binds, so max_loan_amount_cents is
          exactly 4,000,000c and the 4,000,001c request is rejected.
        test_recipe:
          setup:
            - "Plan with max_loan_amount_cents=4,000,000; participant vested 12,000,000c with no loan history (high-water mark 0, current outstanding 0)"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan MinMax", max_loan_amount_cents: 4000000 }, as: RecordkeeperAdmin, captures: { plan_mm: "$.data.id" } }
            - { call: "POST /plans/${plan_mm}/participants", payload: { full_name: "Min Max", vested_balance_cents: 12000000 }, as: RecordkeeperAdmin, captures: { p_mm: "$.data.id" } }
            - { call: "GET /participants/${p_mm}/loan-eligibility", payload: {}, as: RecordkeeperAdmin, captures: { elig_max: "$.data.max_loan_amount_cents" } }
          trigger:
            - { call: "POST /participants/${p_mm}/loans", payload: { principal_amount_cents: 4000000, term_months: 12 }, as: Participant, as_user_id: "${p_mm}", captures: { loan_mm: "$.data.id" } }
            - { call: "POST /plans/${plan_mm}/participants", payload: { full_name: "Over Oliver", vested_balance_cents: 12000000 }, as: RecordkeeperAdmin, captures: { p_mm2: "$.data.id" } }
            - { call: "POST /participants/${p_mm2}/loans", payload: { principal_amount_cents: 4000001, term_months: 12 }, as: Participant, as_user_id: "${p_mm2}", captures: { over_err: "$.data.error_id" } }
          assert:
            - "captured elig_max == 4000000"
            - "the 4,000,000c request succeeds and Loan.${loan_mm}.lifecycle_status == REQUESTED"
            - "captured over_err == ERR_LOAN_LIMIT_EXCEEDED"

      - name: amortization_final_installment_rounding_remainder
        grounds:
          - calculations.amortization_schedule
          - entities.LoanInstallment.fields.scheduled_amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters (distinct from mode (a)
          above): the pinned order rounds the level payment once (85,607c), then
          each installment's interest; the final installment absorbs the remainder
          (85,612c != 85,607c) so the principal portions sum to exactly the
          1,000,000c principal. Sum-then-round would instead show a flat 85,607c
          final row and drift 5c on principal.
        test_recipe:
          setup:
            - "Default-policy plan; participant vested 10,000,000c; loan 1,000,000c / 12 months approved and disbursed at 2026-05-01"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Round" }, as: RecordkeeperAdmin, captures: { plan_rd: "$.data.id" } }
            - { call: "POST /plans/${plan_rd}/participants", payload: { full_name: "Round Rhonda", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_rd: "$.data.id" } }
            - { call: "POST /participants/${p_rd}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${p_rd}", captures: { loan_rd: "$.data.id" } }
            - { call: "GET /loans/${loan_rd}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { rd_t1: "$.data[0].id", rd_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${rd_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${rd_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_rd}/disburse", payload: {}, as: RecordkeeperAdmin }
          trigger:
            - { call: "GET /loans/${loan_rd}/installments", payload: { limit: 100 }, as: RecordkeeperAdmin, captures: { i1_pmt: "$.data[0].scheduled_amount_cents", i12_pmt: "$.data[11].scheduled_amount_cents", i12_prin: "$.data[11].principal_portion_cents", i12_int: "$.data[11].interest_portion_cents" } }
          assert:
            - "captured i1_pmt == 85607"
            - "captured i12_pmt == 85612 and i12_prin == 85257 and i12_int == 355"
            - "captured i12_pmt != captured i1_pmt"
            - "sum over the 12 rows' principal_portion_cents == 1000000 and sum of scheduled_amount_cents == 1027289"

      - name: hardship_gross_up_pinned_evaluation_order
        grounds:
          - calculations.hardship_gross_up
          - entities.HardshipRequest.fields.fee_cents
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order
          (distinct from modes (a) and (b)): the fee tier keys on the gross while
          the gross derives from the fee; the scaffold pins provisional-gross-first.
          NET 800,001c pushes provisional gross to 1,000,001.25c > 1,000,000c, so
          the fee jumps to 7,500c and final gross is 1,009,376c — iterating to a
          fixed point instead would select fee on the final gross and diverge.
        test_recipe:
          setup:
            - "Default-policy plan; participant vested 20,000,000c, no suspension"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Circ" }, as: RecordkeeperAdmin, captures: { plan_ci: "$.data.id" } }
            - { call: "POST /plans/${plan_ci}/participants", payload: { full_name: "Circ Ciri", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_ci: "$.data.id" } }
          trigger:
            - { call: "POST /participants/${p_ci}/hardship-requests", payload: { reason_category: "TUITION", amount_cents: 800001, amount_semantics: "NET" }, as: Participant, as_user_id: "${p_ci}", captures: { ci_gross: "$.data.gross_withdrawal_cents", ci_wh: "$.data.withholding_cents", ci_fee: "$.data.fee_cents", ci_net: "$.data.net_disbursed_cents" } }
          assert:
            - "captured ci_fee == 7500"
            - "captured ci_gross == 1009376 and ci_wh == 201875 and ci_net == 800001"
            - "ci_gross - ci_wh - ci_fee == 800001 exactly (evaluation order reproduces the requested net)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_parallel_dimensions_and_repaid_revert_cycle
        grounds:
          - state_machines.Loan.CURRENT_to_DELINQUENT
          - state_machines.Loan.DELINQUENT_to_CURRENT
          - state_machines.Loan.DISBURSED_to_REPAID
          - state_machines.Loan.REPAID_to_DISBURSED
        distinguishing_aspect: |
          Entity Loan: two independent state dimensions evolve independently —
          lifecycle stays DISBURSED while delinquency cycles
          CURRENT -> DELINQUENT -> CURRENT via missed-then-cured installment 1 —
          and lifecycle itself cycles DISBURSED -> REPAID -> DISBURSED when a full
          payoff remittance is later reversed.
        test_recipe:
          setup:
            - "Default-policy plan; participant vested 10,000,000c; loan 1,000,000c / 12mo disbursed 2026-05-01 (installment 1 due 2026-06-01, scheduled 85,607c)"
            - "Clock advanced to 2026-06-02 with no remittance posted (installment 1 MISSED, loan DELINQUENT, cure deadline 2026-09-30)"
            - "Curing remittance 85,607c with pay_date 2026-09-30 posted (installment CURED, loan CURRENT)"
            - "Full payoff remittance 1,027,289 - 85,607 = 941,682c posted 2026-10-01 -> outstanding 0, loan REPAID"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Par" }, as: RecordkeeperAdmin, captures: { plan_par: "$.data.id" } }
            - { call: "POST /plans/${plan_par}/participants", payload: { full_name: "Par Perry", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_par: "$.data.id" } }
            - { call: "POST /participants/${p_par}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${p_par}", captures: { loan_par: "$.data.id" } }
            - { call: "GET /loans/${loan_par}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { par_t1: "$.data[0].id", par_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${par_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${par_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_par}/disburse", payload: {}, as: RecordkeeperAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: RecordkeeperAdmin }
            - { call: "POST /participants/${p_par}/remittances", payload: { amount_cents: 85607, pay_date: "2026-09-30T00:00:00Z" }, as: PayrollProvider, captures: { remit_cure: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: RecordkeeperAdmin }
            - { call: "POST /participants/${p_par}/remittances", payload: { amount_cents: 941682, pay_date: "2026-10-01T00:00:00Z" }, as: PayrollProvider, captures: { remit_payoff: "$.data.id" } }
            - { call: "GET /loans/${loan_par}", payload: {}, as: RecordkeeperAdmin, captures: { par_lc_repaid: "$.data.lifecycle_status", par_dq_repaid: "$.data.delinquency_status" } }
          trigger:
            - { call: "POST /remittances/${remit_payoff}/reverse", payload: {}, as: RecordkeeperAdmin }
            - { call: "GET /loans/${loan_par}", payload: {}, as: RecordkeeperAdmin, captures: { par_lc_final: "$.data.lifecycle_status", par_out_final: "$.data.outstanding_principal_cents", par_dq_final: "$.data.delinquency_status" } }
            - { call: "GET /loans/${loan_par}/installments", payload: { limit: 100 }, as: RecordkeeperAdmin, captures: { par_i1_status: "$.data[0].status", par_i2_status: "$.data[1].status", par_i6_status: "$.data[5].status" } }
          assert:
            - "during setup: after the 2026-06-02 clock advance Loan.delinquency_status == DELINQUENT while lifecycle_status == DISBURSED"
            - "after the curing remittance Loan.delinquency_status == CURRENT and installment 1 status == CURED"
            - "captured par_lc_repaid == REPAID and par_dq_repaid == CURRENT after the payoff remittance"
            - "after reversal: captured par_lc_final == DISBURSED and par_out_final == 918560 (REPAID -> DISBURSED revert)"
            - "captured par_i1_status == CURED (kept) and par_i2_status == MISSED (due 2026-07-01, unpaid again, past due at clock 2026-10-01) and par_i6_status == PENDING (due 2026-11-01, still future)"
            - "captured par_dq_final == DELINQUENT (the payoff's cure is undone; recomputed cure deadline 2026-12-31 not yet passed)"

      - name: hardship_review_document_cycle
        grounds:
          - state_machines.HardshipRequest.UNDER_REVIEW_to_PENDING_DOCUMENTS
          - state_machines.HardshipRequest.PENDING_DOCUMENTS_to_UNDER_REVIEW
          - state_machines.ApprovalTask.PENDING_to_DOCS_REQUESTED
          - state_machines.ApprovalTask.DOCS_REQUESTED_to_PENDING
        distinguishing_aspect: |
          Entity HardshipRequest (different entity from Loan): a cyclic review
          loop UNDER_REVIEW -> PENDING_DOCUMENTS -> UNDER_REVIEW driven by a
          REQUEST_DOCS decision, and the ApprovalTask itself cycles
          PENDING -> DOCS_REQUESTED -> PENDING, allowing the same step to be
          re-decided APPROVE afterward.
        test_recipe:
          setup:
            - "Default FULL_DOCUMENTATION plan; participant vested 20,000,000c; hardship request 800,000c GROSS for MEDICAL with no documents uploaded"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Cyc" }, as: RecordkeeperAdmin, captures: { plan_cyc: "$.data.id" } }
            - { call: "POST /plans/${plan_cyc}/participants", payload: { full_name: "Cyc Cy", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_cyc: "$.data.id" } }
            - { call: "POST /participants/${p_cyc}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 800000, amount_semantics: "GROSS" }, as: Participant, as_user_id: "${p_cyc}", captures: { h_cyc: "$.data.id" } }
            - { call: "GET /hardship-requests/${h_cyc}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { cyc_t1: "$.data[0].id", cyc_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${cyc_t1}/decide", payload: { decision: "REQUEST_DOCS" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "GET /hardship-requests/${h_cyc}", payload: {}, as: RecordkeeperAdmin, captures: { cyc_status_mid: "$.data.status" } }
            - { call: "POST /hardship-requests/${h_cyc}/documents", payload: { document_type: "MEDICAL_BILL", amount_cents: 800000, description: "hospital invoice" }, as: Participant, as_user_id: "${p_cyc}" }
            - { call: "GET /hardship-requests/${h_cyc}", payload: {}, as: RecordkeeperAdmin, captures: { cyc_status_back: "$.data.status" } }
            - { call: "GET /approval-tasks/${cyc_t1}", payload: {}, as: RecordkeeperAdmin, captures: { cyc_t1_status: "$.data.status" } }
          trigger:
            - { call: "POST /approval-tasks/${cyc_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${cyc_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "GET /hardship-requests/${h_cyc}", payload: {}, as: RecordkeeperAdmin, captures: { cyc_status_final: "$.data.status" } }
          assert:
            - "captured cyc_status_mid == PENDING_DOCUMENTS after REQUEST_DOCS"
            - "captured cyc_status_back == UNDER_REVIEW after the document upload (cycle closed)"
            - "captured cyc_t1_status == PENDING (the same task reopened)"
            - "captured cyc_status_final == APPROVED after re-deciding the cycled step and the final step"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: cure_expiry_cascade_deemed_tax_event_eligibility_lock
        grounds:
          - state_machines.Loan.DELINQUENT_to_DEEMED
          - calculations.distribution_taxable_amount
          - entities.Participant.fields.loan_eligibility_locked_until
          - errors[ERR_LOAN_ELIGIBILITY_LOCKED]
        distinguishing_aspect: |
          Trigger: logical-clock advance past the cure deadline. Chain depth 4,
          each link caused by the previous: clock -> Loan delinquency DEEMED ->
          DEEMED creates TaxEvent (LOAN_DEEMED, taxable 1,014,625c = 1,000,000c
          outstanding + 14,625c four unpaid due interest portions through the
          2026-09-30 quarter-end cutoff) -> TaxEvent increments
          Participant.ytd_taxable_distributions_cents and sets
          loan_eligibility_locked_until = 2027-10-01 -> the lock gates a new loan
          request with ERR_LOAN_ELIGIBILITY_LOCKED.
        test_recipe:
          setup:
            - "Default-policy plan; participant vested 10,000,000c; loan 1,000,000c / 12mo disbursed 2026-05-01; no remittances; clock advanced to 2026-06-02 (installment 1 MISSED, DELINQUENT, cure deadline 2026-09-30)"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Deem" }, as: RecordkeeperAdmin, captures: { plan_dm: "$.data.id" } }
            - { call: "POST /plans/${plan_dm}/participants", payload: { full_name: "Deem Dana", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_dm: "$.data.id" } }
            - { call: "POST /participants/${p_dm}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${p_dm}", captures: { loan_dm: "$.data.id" } }
            - { call: "GET /loans/${loan_dm}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { dm_t1: "$.data[0].id", dm_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${dm_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${dm_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_dm}/disburse", payload: {}, as: RecordkeeperAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: RecordkeeperAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-01T00:00:00Z" }, as: RecordkeeperAdmin }
            - { call: "GET /loans/${loan_dm}", payload: {}, as: RecordkeeperAdmin, captures: { dm_dq: "$.data.delinquency_status", dm_lc: "$.data.lifecycle_status" } }
            - { call: "GET /participants/${p_dm}/tax-events", payload: {}, as: RecordkeeperAdmin, captures: { dm_tax_id: "$.data[0].id", dm_tax_amt: "$.data[0].taxable_amount_cents", dm_tax_year: "$.data[0].tax_year", dm_tax_src: "$.data[0].source_type" } }
            - { call: "GET /participants/${p_dm}", payload: {}, as: RecordkeeperAdmin, captures: { dm_ytd: "$.data.ytd_taxable_distributions_cents", dm_lock: "$.data.loan_eligibility_locked_until" } }
            - { call: "POST /participants/${p_dm}/loans", payload: { principal_amount_cents: 100000, term_months: 12 }, as: Participant, as_user_id: "${p_dm}", captures: { dm_lock_err: "$.data.error_id" } }
          assert:
            - "captured dm_dq == DEEMED and captured dm_lc == DISBURSED (parallel dimensions: deemed affects delinquency only)"
            - "captured dm_tax_src == LOAN_DEEMED and dm_tax_amt == 1014625 and dm_tax_year == 2026"
            - "captured dm_ytd == 1014625"
            - "captured dm_lock == 2027-10-01T00:00:00Z (deemed_on 2026-10-01 + 12 calendar months)"
            - "captured dm_lock_err == ERR_LOAN_ELIGIBILITY_LOCKED"

      - name: termination_offset_cascade_tax_events
        grounds:
          - state_machines.Participant.ACTIVE_to_TERMINATED
          - state_machines.Loan.DISBURSED_to_OFFSET
          - calculations.distribution_taxable_amount
          - entities.Participant.fields.vested_balance_cents
        distinguishing_aspect: |
          Different trigger from the clock-driven deem cascade: PATCH employment
          termination. Chain depth 3: termination -> each DISBURSED loan OFFSET
          -> each OFFSET creates a LOAN_OFFSET TaxEvent (cutoff = terminated_on
          2026-08-15, so 3 unpaid due interest portions = 11,481c; taxable
          1,011,481c) -> Participant.ytd_taxable_distributions_cents and
          loan_eligibility_locked_until updated per event; the ACTIVE
          ContributionElection also terminates.
        test_recipe:
          setup:
            - "Default-policy plan; participant vested 10,000,000c with an ACTIVE election; loan 1,000,000c / 12mo disbursed 2026-05-01; no remittances; clock 2026-08-15 (installments due 06-01/07-01/08-01 unpaid)"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Term" }, as: RecordkeeperAdmin, captures: { plan_tm: "$.data.id" } }
            - { call: "POST /plans/${plan_tm}/participants", payload: { full_name: "Term Tom", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_tm: "$.data.id" } }
            - { call: "PUT /participants/${p_tm}/contribution-election", payload: { deferral_pct: 0.1 }, as: Participant, as_user_id: "${p_tm}" }
            - { call: "POST /participants/${p_tm}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${p_tm}", captures: { loan_tm: "$.data.id" } }
            - { call: "GET /loans/${loan_tm}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { tm_t1: "$.data[0].id", tm_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${tm_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${tm_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_tm}/disburse", payload: {}, as: RecordkeeperAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: RecordkeeperAdmin }
          trigger:
            - { call: "PATCH /participants/${p_tm}", payload: { employment_status: "TERMINATED", terminated_on: "2026-08-15T00:00:00Z" }, as: RecordkeeperAdmin }
            - { call: "GET /loans/${loan_tm}", payload: {}, as: RecordkeeperAdmin, captures: { tm_lc: "$.data.lifecycle_status" } }
            - { call: "GET /participants/${p_tm}/tax-events", payload: {}, as: RecordkeeperAdmin, captures: { tm_tax_src: "$.data[0].source_type", tm_tax_amt: "$.data[0].taxable_amount_cents", tm_tax_year: "$.data[0].tax_year" } }
            - { call: "GET /participants/${p_tm}", payload: {}, as: RecordkeeperAdmin, captures: { tm_ytd: "$.data.ytd_taxable_distributions_cents", tm_lock: "$.data.loan_eligibility_locked_until", tm_cs: "$.data.contribution_status" } }
          assert:
            - "captured tm_lc == OFFSET"
            - "captured tm_tax_src == LOAN_OFFSET and tm_tax_amt == 1011481 and tm_tax_year == 2026"
            - "captured tm_ytd == 1011481"
            - "captured tm_lock == 2027-08-15T00:00:00Z (terminated_on 2026-08-15 + 12 calendar months)"
            - "captured tm_cs == TERMINATED"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_refinance_over_limit
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_LOAN_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair state vs business_fiscal: a refinance request whose
          target loan is already REPAID (state violation, priority 6) AND whose
          cash_out_cents would push the new principal above the participant's
          loan maximum (fiscal violation, priority 12) must return
          ERR_INVALID_STATE, never ERR_LOAN_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Default-policy plan; participant vested 10,000,000c; loan 1,000,000c / 12mo disbursed 2026-05-01 and fully repaid (remittances 85,607c on 2026-06-01 and 941,682c on 2026-06-02 -> REPAID)"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Prio1" }, as: RecordkeeperAdmin, captures: { plan_p1: "$.data.id", plan_p1_v: "$.data.version" } }
            - { call: "POST /plans/${plan_p1}/participants", payload: { full_name: "Prio Pam", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_p1: "$.data.id" } }
            - { call: "POST /participants/${p_p1}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${p_p1}", captures: { loan_p1: "$.data.id" } }
            - { call: "GET /loans/${loan_p1}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { p1_t1: "$.data[0].id", p1_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${p1_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${p1_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_p1}/disburse", payload: {}, as: RecordkeeperAdmin }
            - { call: "POST /participants/${p_p1}/remittances", payload: { amount_cents: 85607, pay_date: "2026-06-01T00:00:00Z" }, as: PayrollProvider }
            - { call: "POST /participants/${p_p1}/remittances", payload: { amount_cents: 941682, pay_date: "2026-06-02T00:00:00Z" }, as: PayrollProvider }
            - { call: "PUT /plans/${plan_p1}/policy", payload: { expected_plan_version: "${plan_p1_v}", allows_refinance: true, refinance_min_months_since_disbursement: 0 }, as: RecordkeeperAdmin }
          trigger:
            - { call: "POST /loans/${loan_p1}/refinance", payload: { cash_out_cents: 9000000 }, as: RecordkeeperAdmin, captures: { p1_err: "$.data.error_id" } }
          assert:
            - "captured p1_err == ERR_INVALID_STATE (not ERR_LOAN_LIMIT_EXCEEDED) even though cash_out 9,000,000c would breach the fiscal limit"

      - name: safety_beats_temporal_on_hardship_final_approval
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_SUBSTANTIATION_INCOMPLETE]
          - errors[ERR_SUSPENSION_OVERLAP]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_temporal (different
          pair from state vs fiscal): at the final APPROVE of a FULL_DOCUMENTATION
          hardship with zero documents uploaded (safety violation, priority 9)
          while the participant has an ACTIVE suspension from an earlier hardship
          (temporal violation, priority 10), the decision must return
          ERR_SUBSTANTIATION_INCOMPLETE.
        test_recipe:
          setup:
            - "Default FULL_DOCUMENTATION plan; participant vested 20,000,000c"
            - "Hardship H1 (200,000c GROSS, MEDICAL, documented, fully approved, PAID at clock 2026-05-01 -> suspension ACTIVE until 2026-11-01)"
            - "Hardship H2 (300,000c GROSS, FUNERAL) created BEFORE the clock check matters: created while suspension ACTIVE must be rejected, so H2 is created first at 2026-05-01 before H1 is paid; then H1 is approved+paid, opening the suspension window; H2 step 1 approved; H2 has no documents"
            - "Order pinned: H2 created before H1 payment so its create passes; the suspension overlap then exists only at H2's final-approval re-check"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Prio2" }, as: RecordkeeperAdmin, captures: { plan_p2: "$.data.id" } }
            - { call: "POST /plans/${plan_p2}/participants", payload: { full_name: "Prio Pete", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_p2: "$.data.id" } }
            - { call: "POST /participants/${p_p2}/hardship-requests", payload: { reason_category: "FUNERAL", amount_cents: 300000, amount_semantics: "GROSS" }, as: Participant, as_user_id: "${p_p2}", captures: { h2: "$.data.id" } }
            - { call: "POST /participants/${p_p2}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 200000, amount_semantics: "GROSS" }, as: Participant, as_user_id: "${p_p2}", captures: { h1: "$.data.id" } }
            - { call: "POST /hardship-requests/${h1}/documents", payload: { document_type: "MEDICAL_BILL", amount_cents: 200000 }, as: Participant, as_user_id: "${p_p2}" }
            - { call: "GET /hardship-requests/${h1}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { h1_t1: "$.data[0].id", h1_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${h1_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${h1_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /hardship-requests/${h1}/pay", payload: {}, as: RecordkeeperAdmin }
            - { call: "GET /hardship-requests/${h2}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { h2_t1: "$.data[0].id", h2_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${h2_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
          trigger:
            - { call: "POST /approval-tasks/${h2_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01", captures: { p2_err: "$.data.error_id" } }
          assert:
            - "captured p2_err == ERR_SUBSTANTIATION_INCOMPLETE (not ERR_SUSPENSION_OVERLAP) although both the zero-document safety check and the active-suspension temporal check fail at the final approve"
            - "HardshipRequest.${h2}.status remains UNDER_REVIEW"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: loan_request_at_exact_vested_ratio_boundary
        grounds:
          - calculations.loan_maximum_amount
          - errors[ERR_LOAN_LIMIT_EXCEEDED]
          - validations[priority=12]
        distinguishing_aspect: |
          Metric: principal-versus-50%-vested ratio on POST /participants/{id}/loans.
          vested 10,000,000c makes the vested component exactly 5,000,000c, equal
          to the IRC cap and the default plan cap; principal exactly 5,000,000c is
          accepted (inclusive <= boundary) and 5,000,001c is rejected with
          ERR_LOAN_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Default-policy plan (cap 5,000,000c); participants P1 and P2 each vested exactly 10,000,000c, no loan history"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Bnd" }, as: RecordkeeperAdmin, captures: { plan_bn: "$.data.id" } }
            - { call: "POST /plans/${plan_bn}/participants", payload: { full_name: "Exact Eva", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_b1: "$.data.id" } }
            - { call: "POST /plans/${plan_bn}/participants", payload: { full_name: "Over Olaf", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_b2: "$.data.id" } }
          trigger:
            - { call: "POST /participants/${p_b1}/loans", payload: { principal_amount_cents: 5000000, term_months: 60 }, as: Participant, as_user_id: "${p_b1}", captures: { loan_b1: "$.data.id" } }
            - { call: "POST /participants/${p_b2}/loans", payload: { principal_amount_cents: 5000001, term_months: 60 }, as: Participant, as_user_id: "${p_b2}", captures: { b2_err: "$.data.error_id" } }
          assert:
            - "the exact-boundary request succeeds: Loan.${loan_b1}.lifecycle_status == REQUESTED and principal_amount_cents == 5000000"
            - "captured b2_err == ERR_LOAN_LIMIT_EXCEEDED for one cent over"

      - name: refinance_at_max_loans_outstanding_boundary
        grounds:
          - calculations.refinance_terms
          - errors[ERR_MAX_LOANS_OUTSTANDING]
          - validations[priority=11]
        distinguishing_aspect: |
          Different metric and endpoint from the ratio boundary: integer count of
          loans in {REQUESTED, APPROVED, DISBURSED} on POST /loans/{id}/refinance
          (vs POST /participants/{id}/loans). At max_loans_outstanding=1 with one
          DISBURSED loan, a fresh loan request is rejected with
          ERR_MAX_LOANS_OUTSTANDING, but a refinance of that same loan succeeds
          because the old loan leaves the counted set atomically (count stays 1).
        test_recipe:
          setup:
            - "Plan with max_loans_outstanding=1, allows_refinance=true, refinance_min_months_since_disbursement=0; participant vested 10,000,000c; loan 500,000c / 12mo disbursed 2026-05-01 (count == 1 == max)"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan MaxRefi", allows_refinance: true, refinance_min_months_since_disbursement: 0 }, as: RecordkeeperAdmin, captures: { plan_mr: "$.data.id" } }
            - { call: "POST /plans/${plan_mr}/participants", payload: { full_name: "Max Mia", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_mr: "$.data.id" } }
            - { call: "POST /participants/${p_mr}/loans", payload: { principal_amount_cents: 500000, term_months: 12 }, as: Participant, as_user_id: "${p_mr}", captures: { loan_mr: "$.data.id" } }
            - { call: "GET /loans/${loan_mr}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { mr_t1: "$.data[0].id", mr_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${mr_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${mr_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_mr}/disburse", payload: {}, as: RecordkeeperAdmin }
          trigger:
            - { call: "POST /participants/${p_mr}/loans", payload: { principal_amount_cents: 100000, term_months: 12 }, as: Participant, as_user_id: "${p_mr}", captures: { mr_count_err: "$.data.error_id" } }
            - { call: "POST /loans/${loan_mr}/refinance", payload: { cash_out_cents: 0 }, as: RecordkeeperAdmin, captures: { mr_new_loan: "$.data.id", mr_new_prin: "$.data.principal_amount_cents", mr_new_lc: "$.data.lifecycle_status" } }
            - { call: "GET /loans/${loan_mr}", payload: {}, as: RecordkeeperAdmin, captures: { mr_old_lc: "$.data.lifecycle_status", mr_old_out: "$.data.outstanding_principal_cents" } }
          assert:
            - "captured mr_count_err == ERR_MAX_LOANS_OUTSTANDING at the count boundary for a fresh request"
            - "captured mr_new_lc == DISBURSED and mr_new_prin == 510000 (500,000 outstanding + 0 accrued due interest + 0 cash-out + 10,000 refi fee)"
            - "captured mr_old_lc == REFINANCED and mr_old_out == 0"
            - "count of the participant's loans in {REQUESTED, APPROVED, DISBURSED} is still exactly 1"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: loan_disburse_gated_by_plan_status
        grounds:
          - state_machines.Loan.APPROVED_to_DISBURSED
          - state_machines.Plan.ACTIVE_to_FROZEN
          - errors[ERR_PLAN_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Plan -> Loan: a fully APPROVED loan cannot disburse while
          its Plan is FROZEN; unfreezing the plan re-enables the same transition
          with no change to the loan itself.
        test_recipe:
          setup:
            - "Default-policy plan; participant vested 10,000,000c; loan 1,000,000c / 12mo fully approved (lifecycle APPROVED), then plan frozen"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Gate" }, as: RecordkeeperAdmin, captures: { plan_gt: "$.data.id" } }
            - { call: "POST /plans/${plan_gt}/participants", payload: { full_name: "Gate Gail", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_gt: "$.data.id" } }
            - { call: "POST /participants/${p_gt}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${p_gt}", captures: { loan_gt: "$.data.id" } }
            - { call: "GET /loans/${loan_gt}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { gt_t1: "$.data[0].id", gt_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${gt_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${gt_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /plans/${plan_gt}/freeze", payload: {}, as: PlanSponsor, as_user_id: "sponsor-01" }
          trigger:
            - { call: "POST /loans/${loan_gt}/disburse", payload: {}, as: RecordkeeperAdmin, captures: { gt_err: "$.data.error_id" } }
            - { call: "POST /plans/${plan_gt}/unfreeze", payload: {}, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /loans/${loan_gt}/disburse", payload: {}, as: RecordkeeperAdmin, captures: { gt_lc: "$.data.lifecycle_status", gt_dq: "$.data.delinquency_status" } }
          assert:
            - "captured gt_err == ERR_PLAN_NOT_ACTIVE while the plan is FROZEN"
            - "after unfreeze: captured gt_lc == DISBURSED and gt_dq == CURRENT"

      - name: election_restart_gated_by_suspension_expiry
        grounds:
          - state_machines.ContributionElection.SUSPENDED_to_ACTIVE
          - state_machines.SuspensionRecord.ACTIVE_to_EXPIRED
          - errors[ERR_SUSPENSION_STILL_ACTIVE]
        distinguishing_aspect: |
          Different entity pair: SuspensionRecord -> ContributionElection. A
          SUSPENDED election cannot restart while the suspension record is ACTIVE
          (clock 2026-12-09 < ends_on 2026-12-10); once the clock reaches ends_on
          the record EXPIREs and the identical restart call succeeds — the
          suspension expiry does not itself reactivate the election.
        test_recipe:
          setup:
            - "Plan with 1-step hardship chain [RECORDKEEPER_ADMIN]; participant vested 20,000,000c with ACTIVE election"
            - "Hardship 800,000c NET MEDICAL with an 800,000c document, approved and paid at clock 2026-06-10 -> suspension [2026-06-10, 2026-12-10), election SUSPENDED"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Restart", hardship_approval_chain: ["RECORDKEEPER_ADMIN"] }, as: RecordkeeperAdmin, captures: { plan_rs: "$.data.id" } }
            - { call: "POST /plans/${plan_rs}/participants", payload: { full_name: "Restart Rae", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_rs: "$.data.id" } }
            - { call: "PUT /participants/${p_rs}/contribution-election", payload: { deferral_pct: 0.08 }, as: Participant, as_user_id: "${p_rs}" }
            - { call: "POST /participants/${p_rs}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 800000, amount_semantics: "NET" }, as: Participant, as_user_id: "${p_rs}", captures: { h_rs: "$.data.id" } }
            - { call: "POST /hardship-requests/${h_rs}/documents", payload: { document_type: "MEDICAL_BILL", amount_cents: 800000 }, as: Participant, as_user_id: "${p_rs}" }
            - { call: "GET /hardship-requests/${h_rs}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { rs_t1: "$.data[0].id" } }
            - { call: "POST /approval-tasks/${rs_t1}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-10T00:00:00Z" }, as: RecordkeeperAdmin }
            - { call: "POST /hardship-requests/${h_rs}/pay", payload: {}, as: RecordkeeperAdmin }
            - { call: "GET /participants/${p_rs}/contribution-election", payload: {}, as: RecordkeeperAdmin, captures: { rs_el_mid: "$.data[0].status" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-09T00:00:00Z" }, as: RecordkeeperAdmin }
          trigger:
            - { call: "POST /participants/${p_rs}/contribution-election/restart", payload: {}, as: Participant, as_user_id: "${p_rs}", captures: { rs_err: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-10T00:00:00Z" }, as: RecordkeeperAdmin }
            - { call: "POST /participants/${p_rs}/contribution-election/restart", payload: {}, as: Participant, as_user_id: "${p_rs}", captures: { rs_el_final: "$.data.status" } }
            - { call: "GET /participants/${p_rs}", payload: {}, as: RecordkeeperAdmin, captures: { rs_cs_final: "$.data.contribution_status" } }
          assert:
            - "captured rs_el_mid == SUSPENDED after the hardship payment cascade"
            - "captured rs_err == ERR_SUSPENSION_STILL_ACTIVE at 2026-12-09 (one day before ends_on)"
            - "at 2026-12-10 (ends_on, half-open boundary): captured rs_el_final == ACTIVE and rs_cs_final == ACTIVE"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: hardship_suspension_window_overlap_rejected
        grounds:
          - calculations.suspension_window
          - errors[ERR_SUSPENSION_OVERLAP]
          - validations[priority=10]
        distinguishing_aspect: |
          Resource: Participant suspension windows; interval semantics: forward
          half-open duration [starts_on, ends_on). A second hardship created one
          day before ends_on (2026-11-01 window from a 2026-05-01 payment) is
          rejected with ERR_SUSPENSION_OVERLAP; the identical request at exactly
          ends_on is accepted.
        test_recipe:
          setup:
            - "Plan with 1-step hardship chain [RECORDKEEPER_ADMIN]; participant vested 20,000,000c"
            - "Hardship H1 200,000c GROSS MEDICAL documented, approved, paid at clock 2026-05-01 -> suspension [2026-05-01, 2026-11-01)"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Overlap", hardship_approval_chain: ["RECORDKEEPER_ADMIN"] }, as: RecordkeeperAdmin, captures: { plan_ov: "$.data.id" } }
            - { call: "POST /plans/${plan_ov}/participants", payload: { full_name: "Over Ove", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_ov: "$.data.id" } }
            - { call: "POST /participants/${p_ov}/hardship-requests", payload: { reason_category: "MEDICAL", amount_cents: 200000, amount_semantics: "GROSS" }, as: Participant, as_user_id: "${p_ov}", captures: { h_ov: "$.data.id" } }
            - { call: "POST /hardship-requests/${h_ov}/documents", payload: { document_type: "MEDICAL_BILL", amount_cents: 200000 }, as: Participant, as_user_id: "${p_ov}" }
            - { call: "GET /hardship-requests/${h_ov}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { ov_t1: "$.data[0].id" } }
            - { call: "POST /approval-tasks/${ov_t1}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /hardship-requests/${h_ov}/pay", payload: {}, as: RecordkeeperAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-31T00:00:00Z" }, as: RecordkeeperAdmin }
          trigger:
            - { call: "POST /participants/${p_ov}/hardship-requests", payload: { reason_category: "FUNERAL", amount_cents: 100000, amount_semantics: "GROSS" }, as: Participant, as_user_id: "${p_ov}", captures: { ov_err: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: RecordkeeperAdmin }
            - { call: "POST /participants/${p_ov}/hardship-requests", payload: { reason_category: "FUNERAL", amount_cents: 100000, amount_semantics: "GROSS" }, as: Participant, as_user_id: "${p_ov}", captures: { h_ov2: "$.data.id" } }
          assert:
            - "captured ov_err == ERR_SUSPENSION_OVERLAP at 2026-10-31 (inside the half-open window)"
            - "at exactly ends_on 2026-11-01 the request succeeds: HardshipRequest.${h_ov2}.status == UNDER_REVIEW"

      - name: refinance_lookback_window_violation
        grounds:
          - calculations.refinance_terms
          - errors[ERR_REFINANCE_LOOKBACK_VIOLATION]
          - entities.Plan.fields.refinance_min_months_since_disbursement
        distinguishing_aspect: |
          Different resource and different interval semantics: a backward-looking
          closed calendar window on the Loan resource — refinance requires
          disbursed_on <= today - plan.refinance_min_months_since_disbursement
          calendar months (2 in this plan). Disbursed 2026-05-01: at 2026-06-15
          the cutoff is 2026-04-15 and the lookback fails
          (ERR_REFINANCE_LOOKBACK_VIOLATION); at exactly 2026-07-01 the cutoff is
          2026-05-01 and disbursed_on equals it (inclusive boundary) so the
          refinance succeeds — a DELINQUENT-but-not-DEEMED loan remains
          refinanceable, and accrued unpaid due interest (2,083c + 1,914c for the
          two unpaid due installments) folds into the new principal.
        test_recipe:
          setup:
            - "Plan with allows_refinance=true, refinance_min_months_since_disbursement=2; participant vested 10,000,000c; loan 500,000c / 12mo disbursed at clock 2026-05-01; clock at 2026-06-15 (installment 1 MISSED, DELINQUENT, cure deadline 2026-09-30 not yet passed)"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Lookback", allows_refinance: true, refinance_min_months_since_disbursement: 2 }, as: RecordkeeperAdmin, captures: { plan_lb: "$.data.id" } }
            - { call: "POST /plans/${plan_lb}/participants", payload: { full_name: "Back Blake", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_lb: "$.data.id" } }
            - { call: "POST /participants/${p_lb}/loans", payload: { principal_amount_cents: 500000, term_months: 12 }, as: Participant, as_user_id: "${p_lb}", captures: { loan_lb: "$.data.id" } }
            - { call: "GET /loans/${loan_lb}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { lb_t1: "$.data[0].id", lb_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${lb_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${lb_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_lb}/disburse", payload: {}, as: RecordkeeperAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-15T00:00:00Z" }, as: RecordkeeperAdmin }
          trigger:
            - { call: "POST /loans/${loan_lb}/refinance", payload: { cash_out_cents: 0 }, as: RecordkeeperAdmin, captures: { lb_err: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: RecordkeeperAdmin }
            - { call: "POST /loans/${loan_lb}/refinance", payload: { cash_out_cents: 0 }, as: RecordkeeperAdmin, captures: { lb_new: "$.data.id", lb_prin: "$.data.principal_amount_cents" } }
          assert:
            - "captured lb_err == ERR_REFINANCE_LOOKBACK_VIOLATION at 2026-06-15 (cutoff 2026-04-15 < disbursed_on 2026-05-01)"
            - "at exactly 2026-07-01 (cutoff equals disbursed_on) the refinance succeeds: Loan.${lb_new}.principal_amount_cents == 513997 (500,000 outstanding + 2,083 + 1,914 accrued unpaid due interest for installments due 2026-06-01 and 2026-07-01 + 0 cash-out + 10,000 fee)"
            - "captured lb_prin == 513997"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: remittance_post_then_reverse_conserves_outstanding_principal
        grounds:
          - state_machines.PayrollRemittance.POSTED_to_REVERSED
          - calculations.remittance_waterfall_allocation
          - entities.Loan.fields.outstanding_principal_cents
        distinguishing_aspect: |
          Conserved quantity: Loan.outstanding_principal_cents. Posting an
          85,607c remittance moves outstanding from 1,000,000c to 918,560c;
          reversing that exact remittance restores outstanding to exactly
          1,000,000c and installment 1 to PENDING with paid_amount_cents 0 —
          post-then-reverse leaves the named quantity bit-identical.
        test_recipe:
          setup:
            - "Default-policy plan; participant vested 10,000,000c; loan 1,000,000c / 12mo disbursed 2026-05-01; baseline outstanding 1,000,000c captured"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Inv1" }, as: RecordkeeperAdmin, captures: { plan_iv: "$.data.id" } }
            - { call: "POST /plans/${plan_iv}/participants", payload: { full_name: "Inv Ivan", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_iv: "$.data.id" } }
            - { call: "POST /participants/${p_iv}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${p_iv}", captures: { loan_iv: "$.data.id" } }
            - { call: "GET /loans/${loan_iv}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { iv_t1: "$.data[0].id", iv_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${iv_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${iv_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_iv}/disburse", payload: {}, as: RecordkeeperAdmin, captures: { iv_out_base: "$.data.outstanding_principal_cents" } }
          trigger:
            - { call: "POST /participants/${p_iv}/remittances", payload: { amount_cents: 85607, pay_date: "2026-05-15T00:00:00Z" }, as: PayrollProvider, captures: { remit_iv: "$.data.id" } }
            - { call: "GET /loans/${loan_iv}", payload: {}, as: RecordkeeperAdmin, captures: { iv_out_mid: "$.data.outstanding_principal_cents" } }
            - { call: "POST /remittances/${remit_iv}/reverse", payload: {}, as: RecordkeeperAdmin, captures: { iv_remit_status: "$.data.status" } }
            - { call: "GET /loans/${loan_iv}", payload: {}, as: RecordkeeperAdmin, captures: { iv_out_final: "$.data.outstanding_principal_cents" } }
            - { call: "GET /loans/${loan_iv}/installments", payload: {}, as: RecordkeeperAdmin, captures: { iv_i1_status: "$.data[0].status", iv_i1_paid: "$.data[0].paid_amount_cents" } }
          assert:
            - "captured iv_out_base == 1000000"
            - "captured iv_out_mid == 918560 after posting (81,440c principal of installment 1)"
            - "captured iv_remit_status == REVERSED"
            - "captured iv_out_final == 1000000 exactly (invariant: post + reverse conserves outstanding_principal_cents)"
            - "captured iv_i1_status == PENDING and iv_i1_paid == 0"

      - name: refinance_conserves_total_outstanding_modulo_cashout_and_fee
        grounds:
          - calculations.refinance_terms
          - state_machines.Loan.DISBURSED_to_REFINANCED
          - entities.Loan.fields.refinances_loan_id
        distinguishing_aspect: |
          Different conserved quantity: the participant-level aggregate sum of
          outstanding_principal_cents across all loans. A refinance after one paid
          installment (outstanding 918,560c, no accrued due interest) with
          cash_out 0 moves the aggregate from 918,560c to 928,560c — a delta of
          exactly cash_out_cents + REFI_FEE_CENTS (10,000c) — while the old loan's
          outstanding zeroes out under REFINANCED.
        test_recipe:
          setup:
            - "Plan with allows_refinance=true, refinance_min_months_since_disbursement=0; participant vested 10,000,000c"
            - "Loan 1,000,000c / 12mo disbursed 2026-05-01; installment 1 paid in full (remittance 85,607c on 2026-06-01) -> outstanding 918,560c"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan Inv2", allows_refinance: true, refinance_min_months_since_disbursement: 0 }, as: RecordkeeperAdmin, captures: { plan_i2: "$.data.id" } }
            - { call: "POST /plans/${plan_i2}/participants", payload: { full_name: "Inv Ingrid", vested_balance_cents: 10000000 }, as: RecordkeeperAdmin, captures: { p_i2: "$.data.id" } }
            - { call: "POST /participants/${p_i2}/loans", payload: { principal_amount_cents: 1000000, term_months: 12 }, as: Participant, as_user_id: "${p_i2}", captures: { loan_i2: "$.data.id" } }
            - { call: "GET /loans/${loan_i2}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { i2_t1: "$.data[0].id", i2_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${i2_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${i2_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_i2}/disburse", payload: {}, as: RecordkeeperAdmin }
            - { call: "POST /participants/${p_i2}/remittances", payload: { amount_cents: 85607, pay_date: "2026-06-01T00:00:00Z" }, as: PayrollProvider }
            - { call: "GET /loans/${loan_i2}", payload: {}, as: RecordkeeperAdmin, captures: { i2_out_before: "$.data.outstanding_principal_cents", i2_ver_before: "$.data.version" } }
          trigger:
            - { call: "POST /loans/${loan_i2}/refinance", payload: { cash_out_cents: 0 }, as: RecordkeeperAdmin, captures: { i2_new_id: "$.data.id", i2_new_prin: "$.data.principal_amount_cents", i2_new_out: "$.data.outstanding_principal_cents", i2_new_ref: "$.data.refinances_loan_id" } }
            - { call: "GET /loans/${loan_i2}", payload: {}, as: RecordkeeperAdmin, captures: { i2_old_out: "$.data.outstanding_principal_cents", i2_old_lc: "$.data.lifecycle_status" } }
          assert:
            - "captured i2_out_before == 918560"
            - "captured i2_new_prin == 928560 and i2_new_out == 928560"
            - "captured i2_old_out == 0 and i2_old_lc == REFINANCED"
            - "invariant: (i2_new_out + i2_old_out) - i2_out_before == 10000 == cash_out_cents + REFI_FEE_CENTS"
            - "captured i2_new_ref == the old loan id ${loan_i2}"
