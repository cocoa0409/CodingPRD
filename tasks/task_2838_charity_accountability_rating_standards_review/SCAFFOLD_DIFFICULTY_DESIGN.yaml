            - "After the revoke: met 7, not_met 1, waived 0, not_applicable 0 (sum still 8), ACCOUNTABILITY raw_points == 21 and normalized_score == 87.50 again"
            - "After the revoke: RatingCycle.${c1}.failed_standard_count == 1, weighted_sum_provisional == 84.63, standards_penalty_points == 1.50, provisional_composite_score == 83.13 and provisional_grade == MEETS_STANDARDS - every figure is bit-identical to the pre-waiver state"
            - "StandardEvaluation.${se_failed}.waiver_reason == null and waived_by_user_id == null after the revoke"
            - "Only the version counters advanced: StandardEvaluation.${se_failed}.version, GovernanceProfile.${g1}.version and RatingCycle.${c1}.version are each 2 higher than before the waiver"

      - name: accountability_penalty_ledger_conserved_across_substantiate_and_reverse
        grounds:
          - endpoints.POST_/complaints/{complaint_id}/reverse-finding
          - state_machines.Complaint.SUBSTANTIATED_to_INVESTIGATING
          - state_machines.DimensionScore.STALE_to_COMPUTED
          - entities.RatingCycle.fields.accountability_penalty_points
          - entities.DimensionScore.fields.penalty_points
        distinguishing_aspect: |
          The conserved quantity is a POINT LEDGER rather than a partition
          cardinality, and it is conserved across a different action pair
          (substantiate / reverse-finding) driven by a different role
          (MethodologyAdmin reversing a RatingAnalyst's finding). The ledger runs
          0 -> 12 -> 0 while the ACCOUNTABILITY row round-trips through a state
          change as well as a value change, STALE and back to COMPUTED, with the
          override-free recomputation proving no residue was left behind.
        test_recipe:
          setup:
            - "Methodology M1 adopted and effective, logical clock at 2026-09-01T00:00:00Z"
            - "A fully documented FY2025 cycle scored at 84.63 with composite 83.13"
            - "A DONOR complaint alleging MISUSE_OF_FUNDS with 2 documents has been triaged INVESTIGATE"
          setup_api_calls:
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15, dimension_floor_score: 40.0 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
            - call: "POST /methodology-versions/${m1}/open-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/close-comment"
