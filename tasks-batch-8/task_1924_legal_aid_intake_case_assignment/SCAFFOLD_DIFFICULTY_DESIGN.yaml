          - validations[priority=26]
          - errors[ERR_GRANT_PERIOD_OVERLAP]
          - entities.GrantProgram.fields.period_end
        distinguishing_aspect: |
          Resource = GrantProgram (scoped per funder), interval semantics = CLOSED [start, end]: a second program
          for the SAME funder whose start date equals the first program's end date (2026-12-31) IS an overlap and
          is rejected; the identical date range under a DIFFERENT funder succeeds. Boundary touch is a conflict
          here — the exact opposite of the half-open referral-window semantics in the sibling instance.
        test_recipe:
          setup:
            - "Grant G1: funder LSC, closed period [2026-01-01, 2026-12-31]"
          setup_api_calls:
            - { call: "POST /grant-programs", payload: { name: "LSC 2026", funder: "LSC", period_start: "2026-01-01", period_end: "2026-12-31", allowed_case_types: ["EVICTION_DEFENSE"], allowed_counties: ["CountyA"], income_cap_percentage: 125.00, per_case_rate_cents: 10000, total_budget_cents: 50000 }, as: ProgramDirector, captures: { g1_id: "$.data.id" } }
          trigger:
            - { call: "POST /grant-programs", payload: { name: "LSC 2027", funder: "LSC", period_start: "2026-12-31", period_end: "2027-06-30", allowed_case_types: ["EVICTION_DEFENSE"], allowed_counties: ["CountyA"], income_cap_percentage: 125.00, per_case_rate_cents: 10000, total_budget_cents: 50000 }, as: ProgramDirector, captures: { err: "$.data.error_id" } }
            - { call: "POST /grant-programs", payload: { name: "OTHER 2027", funder: "OTHER", period_start: "2026-12-31", period_end: "2027-06-30", allowed_case_types: ["EVICTION_DEFENSE"], allowed_counties: ["CountyA"], income_cap_percentage: 125.00, per_case_rate_cents: 10000, total_budget_cents: 50000 }, as: ProgramDirector, captures: { g3_id: "$.data.id" } }
          assert:
            - "Same-funder boundary touch: error_id == ERR_GRANT_PERIOD_OVERLAP (closed interval: 2026-12-31 belongs to both periods)"
            - "Different-funder identical dates: GrantProgram.${g3_id} created successfully (overlap scope is per funder)"

  - rule_id: compensating_invariant
    instances:
      - name: caseload_units_conserved_assign_then_close
        grounds:
          - calculations.caseload_load
          - state_machines.Case.PENDING_ASSIGNMENT_to_OPEN
          - state_machines.Case.OPEN_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity = StaffMember weighted caseload units: assign (forward, +5) paired with close
          (compensating, -5) returns weighted_open_units to EXACTLY its pre-action value; invariant formula
          weighted_open_units == SUM(case_weight over assigned OPEN cases) holds at every probe. The sibling
          conserves a different quantity (grant budget cents).
        test_recipe:
          setup:
            - "Attorney max_units 40, weighted_open_units == 0; EXTENDED case PENDING_ASSIGNMENT"
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "FAMILY_DV", venue: "FAMILY_COURT", priority_base_weight: 60, extended_eligible: true }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["FAMILY_DV"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Sup One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["FAMILY_DV"], max_units: 4 }, as: ProgramDirector, captures: { sup_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Att One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["FAMILY_DV"], max_units: 40 }, as: ProgramDirector, captures: { att_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Inv", residence_county: "CountyA", household_size: 2, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false, vulnerability_factors: ["DV_SURVIVOR"] }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "FAMILY_DV", opposing_party_name: "Abuser", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/open-case", payload: { service_level: "EXTENDED" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case_id: "$.data.id", case_v: "$.data.version" } }
          trigger:
            - { call: "POST /cases/${case_id}/assign", payload: { attorney_id: "${att_id}", expected_case_version: "${case_v}" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
            - { call: "GET /staff-members/${att_id}/caseload", payload: {}, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { load_mid: "$.data.weighted_open_units", count_mid: "$.data.open_case_count" } }
            - { call: "POST /cases/${case_id}/close", payload: { outcome_code: "SETTLEMENT", closure_reason: "settled" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
            - { call: "GET /staff-members/${att_id}/caseload", payload: {}, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { load_end: "$.data.weighted_open_units", count_end: "$.data.open_case_count" } }
          assert:
            - "Before assign: weighted_open_units == 0; after assign: == 5; after close: == 0 (forward + compensating actions cancel exactly)"
            - "open_case_count: 0 -> 1 -> 0 (raw-count variant tracks the same invariant)"

      - name: grant_cents_conserved_reserve_then_release
        grounds:
          - calculations.grant_reservation_drawdown
          - state_machines.Case.OPEN_to_CLOSED
          - entities.GrantProgram.fields.available_cents
        distinguishing_aspect: |
          Conserved quantity = grant budget cents: reserved_cents + spent_cents + available_cents ==
          total_budget_cents at EVERY probe, and reserve (+13,333) paired with a NON-BILLABLE close (release,
          -13,333) returns available_cents to exactly 100,000 with spent_cents unchanged at 0. Different
          conserved quantity from the caseload-units sibling.
        test_recipe:
          setup:
            - "Grant (rate 33,333, budget 100,000, covers CONSUMER_DEBT/CountyA); ADVICE_ONLY grant-funded case opened (PENDING_ASSIGNMENT)"
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "CONSUMER_DEBT", venue: "MUNICIPAL_COURT", priority_base_weight: 30, extended_eligible: false }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["CONSUMER_DEBT"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /staff-members", payload: { full_name: "Sup One", staff_type: "ATTORNEY", admitted_counties: ["CountyA"], practice_areas: ["CONSUMER_DEBT"], max_units: 40 }, as: ProgramDirector, captures: { sup_id: "$.data.id" } }
            - { call: "POST /grant-programs", payload: { name: "Debt Fund", funder: "LSC", period_start: "2026-01-01", period_end: "2026-12-31", allowed_case_types: ["CONSUMER_DEBT"], allowed_counties: ["CountyA"], income_cap_percentage: 150.00, per_case_rate_cents: 33333, total_budget_cents: 100000 }, as: ProgramDirector, captures: { grant_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Grant", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "CONSUMER_DEBT", opposing_party_name: "Collector Inc", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
            - { call: "POST /intake-applications/${app_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/decide-eligibility", payload: { determination: "ELIGIBLE" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/conflict-checks", payload: { result: "CLEAR" }, as: IntakeSpecialist, as_user_id: "${intake_id}" }
            - { call: "POST /intake-applications/${app_id}/open-case", payload: { service_level: "ADVICE_ONLY", grant_program_id: "${grant_id}" }, as: SupervisingAttorney, as_user_id: "${sup_id}", captures: { case_id: "$.data.id" } }
          trigger:
            - { call: "GET /grant-programs/${grant_id}/utilization", payload: {}, as: ProgramDirector, captures: { r_mid: "$.data.reserved_cents", s_mid: "$.data.spent_cents", a_mid: "$.data.available_cents" } }
            - { call: "POST /cases/${case_id}/close", payload: { outcome_code: "REFERRED_OUT", closure_reason: "sent to pro bono" }, as: SupervisingAttorney, as_user_id: "${sup_id}" }
            - { call: "GET /grant-programs/${grant_id}/utilization", payload: {}, as: ProgramDirector, captures: { r_end: "$.data.reserved_cents", s_end: "$.data.spent_cents", a_end: "$.data.available_cents" } }
          assert:
            - "After open: reserved_cents == 13333, spent_cents == 0, available_cents == 86667 (sum == 100000 == total_budget_cents)"
            - "After non-billable close (REFERRED_OUT): reserved_cents == 0, spent_cents == 0, available_cents == 100000 — full restoration, zero drift"
            - "Case.${case_id}.funding_status == GRANT_RELEASED (not GRANT_SPENT) for the non-billable outcome"
