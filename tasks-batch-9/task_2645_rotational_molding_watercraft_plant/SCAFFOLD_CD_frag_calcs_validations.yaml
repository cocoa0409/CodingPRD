            - "no anchor promotion happens on that release because no sibling was occupying the group — ${fu2} had been refused, so Warehouse.${wh}.committed_cube_m3 falls to 0.0000 and utilization_pct to 0.00"
            - "the re-attempted store of ${fu2} now succeeds and it becomes the new anchor at stored_footprint_cube_m3 1.2000 with build_ahead_committed_qty back to 1"
            - "the final store of ${fu1} fails 422 ERR_BUILD_AHEAD_CAP_EXCEEDED again — the cap is a live count, not a once-per-unit allowance"
            - "Warehouse.${wh}.committed_cube_m3 == 1.2000, utilization_pct == 1.20 and posture == NORMAL at the end; each store consumed one Warehouse version, which is why every store re-reads it"

      - name: calc_variant_selection_build_ahead_window_boundary_then_out_of_window
        claim_type: Variant Selection
        grounds:
          - calculations.build_ahead_commitment.variants.IN_WINDOW
          - calculations.build_ahead_commitment.variants.OUT_OF_WINDOW
          - errors.ERR_BUILD_AHEAD_WINDOW_MISMATCH
        distinguishing_aspect: "The same store request on the same hull is refused with ERR_BUILD_AHEAD_WINDOW_MISMATCH one day before window_start_on, accepted on window_start_on itself, and — once the cap is full — still reports WINDOW_MISMATCH rather than CAP_EXCEEDED one day after window_end_on, so the variant is selected before the cap is ever consulted."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. DemandForecastBucket DFB-CVH2 forecasts 3 units at 60.00 pct — build_ahead_cap_qty 1 — with an inclusive window of 2026-09-01..2026-09-30."
            - "ProductionOrder PO-CVH for 2 units carries that bucket and targets WH-CVA."
