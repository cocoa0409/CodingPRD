              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
            - call: "POST /farming-plans"
              payload: { block_id: "${b1_id}", plan_year: 2026, quality_target: "PREMIUM", pruning_budget_per_acre: 420.00, canopy_budget_per_acre: 310.00, irrigation_budget_per_acre: 180.00, pest_budget_per_acre: 265.00, seasonal_water_cap_inches: 9.000 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /farming-plans/${p1_id}/return-for-revision"
              payload: { revision_note: "Trim the pest budget" }
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { rev_error: $.data.error_id }
            - call: "GET /farming-plans/${p1_id}"
              payload: {}
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { p1_status: $.data.plan_status, p1_rev: $.data.revision_count, p1_v: $.data.version }
          assert:
            - "HTTP status is 409"
            - "error_id == ERR_PLAN_NOT_SUBMITTED"
