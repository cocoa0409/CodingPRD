        distinguishing_aspect: "Starting from the same entity pair as the default cascade, this chain reaches depth 4 through a different triggering transition (suspension, not default declaration): Participant -> ClearingMemberDeposit -> NetPosition -> ClearingFund, so the two cascades share no triggering transition."
