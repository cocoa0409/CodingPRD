            - "trigger call 5: total == available + committed + spent == 500000"

      - name: budget_adjustments_keep_the_desk_ledger_identity_and_refuse_to_go_negative
        claim_type: ledger_sync
        grounds:
          - endpoints[POST /records-desk/desks/{id}/budget-adjustments]
          - calculations.desk_fee_budget_ledger
          - validations[priority=270]
          - errors[ERR_FEE_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          adjust() moves BOTH total and available by the signed delta and leaves committed and spent
          alone, so the conserved identity total == available + committed + spent must survive a positive
          delta, a negative delta, and a rejected over-withdrawal. The refusal test is
          available + delta < 0 - NOT total + delta < 0 - so with 4000 committed out of 100000 a delta of
          -96001 must fail while -96000 succeeds and drives available to exactly 0.
        test_recipe:
          setup:
            - "Desk with fee_budget_total_cents 100000; Agency with search_fee_cents_per_hour 4000 and page_fee_cents 0."
            - "One request fee-determined without a waiver at 1.0 search hours and 0 pages, committing exactly 4000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 100000, retention_policy_days: 365 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "County Assessor", jurisdiction_code: "CA-COUNTY", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: true, appeal_venue: "INTERNAL", appeal_decision_days: 20, search_fee_cents_per_hour: 4000, page_fee_cents: 0, max_waiver_cents: 0 }
              as: RecordsCoordinator
              captures: { agency_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_id}", subject_summary: "Ledger probe", requested_format: "CSV", estimated_page_count: 0, waiver_requested: false, public_interest_score: 0, expected_desk_version: "${desk_v}" }
              as: RecordsCoordinator
              captures: { req_id: $.data.id }
            - call: "POST /records-desk/records-requests/${req_id}/submit"
              payload: {}
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_id}/fee-determination"
              payload: { search_hours: 1.0, billed_page_count: 0 }
              as: RecordsCoordinator
          trigger:
            - call: "GET /records-desk/desks/${desk_id}"
              as: ManagingEditor
              captures: { v_before: $.data.version }
            - call: "POST /records-desk/desks/${desk_id}/budget-adjustments"
              payload: { delta_cents: 25000, reason: "Q4 records-fee top-up." }
              as: ManagingEditor
            - call: "POST /records-desk/desks/${desk_id}/budget-adjustments"
              payload: { delta_cents: -25000, reason: "Reverse the top-up to restore the opening balance." }
              as: ManagingEditor
            - call: "POST /records-desk/desks/${desk_id}/budget-adjustments"
              payload: { delta_cents: -96001, reason: "Over-withdrawal: one cent past available." }
              as: ManagingEditor
              captures: { e1: $.data.error_id }
            - call: "POST /records-desk/desks/${desk_id}/budget-adjustments"
              payload: { delta_cents: -96000, reason: "Withdraw the entire available balance." }
              as: ManagingEditor
          assert:
            - "trigger call 1: total == 100000, available == 96000, committed == 4000, spent == 0 (the fee determination committed 1.0 * 4000 + 0 * 0 == 4000 with no waiver requested)"
            - "trigger call 2: HTTP 200; total == 125000, available == 121000, committed == 4000, spent == 0 - both total and available moved by +25000"
            - "trigger call 3: HTTP 200; total == 100000, available == 96000, committed == 4000, spent == 0 - a negative delta is accepted while available covers it"
            - "trigger call 4: HTTP 402 with error_id == \"ERR_FEE_BUDGET_EXCEEDED\" - available (96000) + delta (-96001) would be -1, even though total (100000) + delta is still positive"
            - "trigger call 4 leaves the ledger untouched: total == 100000, available == 96000, committed == 4000"
            - "trigger call 5: HTTP 200; total == 4000, available == 0, committed == 4000, spent == 0 - the boundary delta is accepted and available lands exactly on 0"
            - "the identity total == available + committed + spent holds after every one of the five calls"
            - "Desk.version increased by exactly 1 per ACCEPTED adjustment and not at all for the rejected one"

      - name: expert_verdict_adjusts_the_finding_the_reviewer_and_the_investigation_together
        claim_type: cross_entity
        grounds:
          - state_machines.ReviewAssignment.ASSIGNED_to_COMPLETED
          - state_machines.Finding.DOC_MATCHED_to_SME_CONFIRMED
          - entities.ExpertReviewer.fields.active_assignment_count
          - calculations.reviewer_capacity_window
        distinguishing_aspect: |
          One verdict call must move three other entities: the assignment completes, the linked Finding
          crosses from doc_matched into sme_confirmed while finding_count stays put, AND the reviewer's
          active_assignment_count DECREMENTS - freeing window capacity, which is the non-obvious part.
          The freed capacity is then proved by booking a third overlapping window against a reviewer
          whose ceiling is 2, which would have been refused a moment earlier.
        test_recipe:
          setup:
            - "Desk, Investigation, one AnalysisRun, two DOC_MATCHED Findings f1 and f2."
            - "One ExpertReviewer with max_concurrent_assignments 2, holding two overlapping ASSIGNED windows a1 (on f1) and a2 (on f2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 365 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/investigations"
              payload: { desk_id: "${desk_id}", headline: "Cross entity probe", publication_mode: "METHODOLOGY_ONLY" }
              as: ManagingEditor
              captures: { inv_id: $.data.id }
            - call: "GET /records-desk/investigations/${inv_id}"
              as: DataReporter
              captures: { inv_v: $.data.version }
            - call: "POST /records-desk/analysis-runs"
              payload: { investigation_id: "${inv_id}", code_repo_ref: "git@desk/cross", code_commit_sha: "9999999999999999999999999999999999999999", container_digest: "sha256:9999999999999999999999999999999999999999999999999999999999999999", compute_cost_cents: 1000, labor_hours: 1.0, expected_investigation_version: "${inv_v}" }
              as: DataReporter
              as_user_id: "rep-001"
              captures: { run_id: $.data.id }
            - call: "POST /records-desk/findings"
              payload: { investigation_id: "${inv_id}", analysis_run_id: "${run_id}", claim_text: "Finding one." }
              as: DataReporter
              as_user_id: "rep-001"
              captures: { f1_id: $.data.id }
            - call: "POST /records-desk/findings"
              payload: { investigation_id: "${inv_id}", analysis_run_id: "${run_id}", claim_text: "Finding two." }
              as: DataReporter
              as_user_id: "rep-001"
              captures: { f2_id: $.data.id }
            - call: "POST /records-desk/findings/${f1_id}/document-match"
              payload: { source_document_ref: "BOX-2/DOC-0011", matched_page: 2 }
              as: DataReporter
            - call: "POST /records-desk/findings/${f2_id}/document-match"
              payload: { source_document_ref: "BOX-2/DOC-0012", matched_page: 5 }
              as: DataReporter
            - call: "POST /records-desk/expert-reviewers"
              payload: { name: "Dr. Ana Reyes", affiliation: "State University Housing Lab", expertise_code: "HOUSING", max_concurrent_assignments: 2 }
              as: ManagingEditor
              captures: { rev_id: $.data.id }
            - call: "POST /records-desk/review-assignments"
              payload: { reviewer_id: "${rev_id}", finding_id: "${f1_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z" }
              as: ManagingEditor
              captures: { a1_id: $.data.id }
            - call: "POST /records-desk/review-assignments"
              payload: { reviewer_id: "${rev_id}", finding_id: "${f2_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z" }
              as: ManagingEditor
              captures: { a2_id: $.data.id }
          trigger:
            - call: "POST /records-desk/review-assignments/${a1_id}/verdict"
              payload: { verdict: "CONFIRMED", rationale: "Both tables reconcile with the certified source pages." }
              as: ExpertReviewer
              as_user_id: "${rev_id}"
            - call: "GET /records-desk/findings/${f1_id}"
              as: ManagingEditor
            - call: "GET /records-desk/expert-reviewers/${rev_id}"
              as: ManagingEditor
            - call: "GET /records-desk/investigations/${inv_id}"
              as: ManagingEditor
            - call: "POST /records-desk/review-assignments"
              payload: { reviewer_id: "${rev_id}", finding_id: "${f1_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z" }
              as: ManagingEditor
              captures: { a3_id: $.data.id }
          assert:
            - "trigger call 1: HTTP 200; ReviewAssignment.status == \"COMPLETED\", verdict == \"CONFIRMED\", rationale recorded"
            - "trigger call 2: Finding.verification_status == \"SME_CONFIRMED\" and sme_verdict_rationale == \"Both tables reconcile with the certified source pages.\" - the rationale is COPIED onto the finding"
            - "trigger call 3: ExpertReviewer.active_assignment_count == 1 - completing an assignment DECREMENTS the live count"
            - "trigger call 4: finding_count == 2, unverified_finding_count == 0, doc_matched_finding_count == 1, sme_confirmed_finding_count == 1, sme_disputed_finding_count == 0"
            - "trigger call 4: analysis_readiness == \"NOT_READY\" - one finding is still merely doc_matched"
            - "trigger call 5: HTTP 201 - the window freed by the completed a1 admits a third overlapping assignment under the same ceiling of 2, which proves the decrement is real capacity and not cosmetic"
            - "the assignment a2 is untouched: GET /records-desk/review-assignments/${a2_id} reports status == \"ASSIGNED\""

      - name: cascade_down_from_a_parent_state_change_is_covered_by_the_difficulty_design
        claim_type: cascade_down
        grounds:
          - state_machines.RecordsRequest.APPEAL_FILED_to_LITIGATION_AUTHORIZED
          - endpoints[POST /records-desk/appeals/{id}/decision]
        excluded_because:
          difficulty_instance: appeal_denial_five_hop_litigation_cascade
          rationale: |
            The DENIED prong of the appeal decision is the scaffold's deepest downward cascade (request ->
            litigation counter -> desk posture -> investigation hold -> enclave session cancellation), and
            that instance already walks all five hops end to end and asserts that only non-terminal
            children are touched. A second cascade-down instance here would re-run the same chain.

      - name: parallel_state_dimensions_are_covered_by_the_difficulty_design
        claim_type: parallel
        grounds:
          - state_machines.AnalysisRun
          - entities.AnalysisRun.fields.code_review_status
          - entities.AnalysisRun.fields.cost_allocation_status
        excluded_because:
          difficulty_instance: analysis_run_parallel_review_and_allocation_dimensions
          rationale: |
            AnalysisRun's two independent dimensions are exactly that instance's subject: it drives each
            dimension while holding the other fixed and asserts the four-way combined state, including
            that peer review never touches cost_allocation_status and vice versa.

      - name: compound_parent_state_derived_from_children_is_covered_by_the_difficulty_design
        claim_type: compound
        grounds:
          - calculations.investigation_analysis_readiness
          - entities.Investigation.fields.analysis_readiness
        excluded_because:
          difficulty_instance: verification_revocation_preserves_the_finding_count_partition
          rationale: |
            Investigation.analysis_readiness is the compound parent state derived from child AnalysisRun
            and Finding state. That instance re-derives it after a child finding is un-verified and after
            two assignments are released, and asserts the partition identity is preserved while the
            parent falls out of FINDINGS_LOCKED.

      - name: guarded_cross_entity_transitions_are_covered_by_the_difficulty_design
        claim_type: guarded transitions
        grounds:
          - state_machines.Dataset.RAW_to_CLEANING
          - errors[ERR_SOURCE_REQUEST_UNRESOLVED]
        excluded_because:
          difficulty_instance: dataset_delivery_gated_on_parent_records_request_status
          rationale: |
            The delivery transition's guard is a cross-entity precondition on the parent RecordsRequest's
            status. That instance sweeps the guard across every status of the parent - refusing from
            DRAFT, AWAITING_AGENCY_RESPONSE, CLARIFICATION_REQUESTED, DENIED and WITHDRAWN, admitting
            from RELEASED and PARTIALLY_RELEASED - which is broader than a single guarded-transition probe.

      - name: compensating_reversal_of_side_effects_is_covered_by_the_difficulty_design
        claim_type: compensation
        grounds:
          - state_machines.RecordsRequest.AWAITING_AGENCY_RESPONSE_to_WITHDRAWN
          - endpoints[POST /records-desk/records-requests/{id}/withdrawal]
        excluded_because:
          difficulty_instance: request_withdrawal_restores_the_desk_fee_ledger_without_drift
          rationale: |
            Withdrawal is the scaffold's compensating action, and that instance reverses a fee
            determination and an appeal filing together, asserting the desk ledger returns to its exact
            opening triple with no drift and that the retained gross/net figures are not rewritten.

      - name: conditional_cascade_gated_on_child_state_is_covered_by_the_difficulty_design
        claim_type: conditional cascade
        grounds:
          - state_machines.Investigation.FINDINGS_LOCKED_to_HOLD_LEGAL_REVIEW
          - calculations.desk_security_posture
        excluded_because:
          difficulty_instance: investigation_publication_gated_on_desk_security_posture
          rationale: |
            The posture cascade applies only to investigations in specific states and only to BOOKED
            enclave sessions. That instance drives the desk through OPEN, RESTRICTED and LOCKDOWN and
            asserts which children are affected at each posture, which is the conditional-cascade claim in
            its strongest form.

  - section: calculations
    instances:
      - name: statutory_deadline_counts_calendar_days_and_business_days_differently
        claim_type: correct_result
        grounds:
          - calculations.statutory_deadline
          - entities.Agency.fields.deadline_basis
          - entities.Agency.fields.holiday_dates
        distinguishing_aspect: |
          One submit instant, three agencies, three different due dates: CALENDAR_DAYS 30 days from
          2026-08-03 lands on 2026-09-02; BUSINESS_DAYS 10 days lands on 2026-08-17 because eight weekend
          days are skipped; and the same BUSINESS_DAYS agency with 2026-08-14 declared a holiday lands on
          2026-08-18. The holiday must be skipped WITHOUT consuming one of the ten days, which is the
          error a naive "subtract holidays from n" implementation makes.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T09:00:00Z (a Monday). One Desk."
            - "Agency cal-30: CALENDAR_DAYS, initial_response_days 30, no holidays."
            - "Agency biz-10: BUSINESS_DAYS, initial_response_days 10, no holidays."
            - "Agency biz-10-hol: BUSINESS_DAYS, initial_response_days 10, holiday_dates [\"2026-08-14\"] (a Friday)."
            - "One RecordsRequest against each, all submitted at the same instant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
              payload: { name: "Metro Investigations Desk", fee_budget_total_cents: 500000, retention_policy_days: 365 }
              as: ManagingEditor
              captures: { desk_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "Calendar Basis Board", jurisdiction_code: "CA-CAL", statute_name: "CPRA", initial_response_days: 30, deadline_basis: "CALENDAR_DAYS", tolling_allowed: false, appeal_venue: "INTERNAL", appeal_decision_days: 30, search_fee_cents_per_hour: 0, page_fee_cents: 0, max_waiver_cents: 0 }
              as: RecordsCoordinator
              captures: { agency_cal_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "Business Basis Board", jurisdiction_code: "CA-BIZ", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: false, appeal_venue: "INTERNAL", appeal_decision_days: 30, search_fee_cents_per_hour: 0, page_fee_cents: 0, max_waiver_cents: 0 }
              as: RecordsCoordinator
              captures: { agency_biz_id: $.data.id }
            - call: "POST /records-desk/agencies"
              payload: { name: "Business Basis Board With Holiday", jurisdiction_code: "CA-HOL", statute_name: "CPRA", initial_response_days: 10, deadline_basis: "BUSINESS_DAYS", tolling_allowed: false, appeal_venue: "INTERNAL", appeal_decision_days: 30, search_fee_cents_per_hour: 0, page_fee_cents: 0, max_waiver_cents: 0, holiday_dates: ["2026-08-14"] }
              as: RecordsCoordinator
              captures: { agency_hol_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v1: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_cal_id}", subject_summary: "Calendar basis probe", requested_format: "CSV", estimated_page_count: 0, waiver_requested: false, public_interest_score: 0, expected_desk_version: "${desk_v1}" }
              as: RecordsCoordinator
              captures: { req_cal_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v2: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_biz_id}", subject_summary: "Business basis probe", requested_format: "CSV", estimated_page_count: 0, waiver_requested: false, public_interest_score: 0, expected_desk_version: "${desk_v2}" }
              as: RecordsCoordinator
              captures: { req_biz_id: $.data.id }
            - call: "GET /records-desk/desks/${desk_id}"
              as: RecordsCoordinator
              captures: { desk_v3: $.data.version }
            - call: "POST /records-desk/records-requests"
              payload: { desk_id: "${desk_id}", agency_id: "${agency_hol_id}", subject_summary: "Holiday basis probe", requested_format: "CSV", estimated_page_count: 0, waiver_requested: false, public_interest_score: 0, expected_desk_version: "${desk_v3}" }
              as: RecordsCoordinator
              captures: { req_hol_id: $.data.id }
          trigger:
            - call: "POST /records-desk/records-requests/${req_cal_id}/submit"
              payload: {}
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_biz_id}/submit"
              payload: {}
              as: RecordsCoordinator
            - call: "POST /records-desk/records-requests/${req_hol_id}/submit"
              payload: {}
              as: RecordsCoordinator
          assert:
            - "trigger call 1: due_at_strict == \"2026-09-02T23:59:59.000Z\" (2026-08-03 plus 30 CALENDAR days: 28 days reaches 2026-08-31, 2 more reaches 2026-09-02)"
            - "trigger call 2: due_at_strict == \"2026-08-17T23:59:59.000Z\" (10 BUSINESS days: Aug 4,5,6,7,10,11,12,13,17 is nine and Aug 18 would be ten - no: the ten are Aug 4,5,6,7,10,11,12,13,14,17)"
            - "trigger call 3: due_at_strict == \"2026-08-18T23:59:59.000Z\" - Friday 2026-08-14 is a declared holiday, so it is skipped without consuming one of the ten days and the count runs one business day further"
            - "every submitted_at == \"2026-08-03T09:00:00Z\" and every due_at_tolled == the same request's due_at_strict, because tolled_days_total == 0"
            - "every deadline carries the DEADLINE_TIME_OF_DAY suffix exactly - \"T23:59:59.000Z\", with millisecond precision and not \"T23:59:59Z\""
            - "the three due dates are pairwise different even though the submit instant and initial_response_days pairing are shared, so the basis and the holiday list are both genuinely read from the Agency"

      - name: cost_allocation_includes_only_clean_locked_datasets
        claim_type: input_set_filtering
        grounds:
          - calculations.analysis_cost_allocation
          - endpoints[POST /records-desk/analysis-runs/{id}/cost-allocation]
          - entities.Dataset.fields.allocated_cost_cents
        distinguishing_aspect: |
          The allocable set is defined by STATUS, not by membership: a CLEANING dataset with 800 records
          sits on the same investigation as a CLEAN_LOCKED dataset with 200 records, and the entire
          11500-cent run cost must land on the 200-record dataset. If the filter is missing, the shares
          become 2300 / 9200 and the locked dataset is short by 9200 cents - and the excluded dataset's
          allocated_cost_cents must remain untouched at 0 rather than being written as 0.
        test_recipe:
          setup:
            - "Desk, Agency, one RELEASED RecordsRequest, one Investigation."
            - "Dataset ds-locked: delivered CSV, record_count 200, one field documented, CLEAN_LOCKED."
            - "Dataset ds-cleaning: delivered CSV, record_count 800, left in CLEANING."
            - "One AnalysisRun with compute_cost_cents 5000 and labor_hours 1.0 (total 11500)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: ManagingEditor
            - call: "POST /records-desk/desks"
