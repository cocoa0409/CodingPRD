          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Dr Drew", contact_email: "drew@x.com" }
              as: BrokerOps
              captures: { s_id: $.data.id }
            - call: "POST /customers"
              payload: { name: "Dr Dora", contact_email: "dora@x.com", credit_limit_cents: 50000, urgency_tier: "STANDARD" }
