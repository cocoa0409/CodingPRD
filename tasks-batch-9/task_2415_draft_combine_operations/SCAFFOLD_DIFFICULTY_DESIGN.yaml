  - rule_id: boundary_precision_check
    instances:
      - name: selection_clock_expires_at_the_deadline_instant_not_one_millisecond_before
        grounds:
          - calculations.selection_clock_deadline
          - state_machines.DraftPick.ON_CLOCK_to_PASSED
          - entities.DraftPick.fields.pass_reason
          - entities.DraftPick.fields.on_clock_started_at
        distinguishing_aspect: |
          An advance at 2027-04-22T18:09:59.999Z leaves overall pick 1 ON_CLOCK with
          passed_count 0, and an advance at exactly 18:10:00.000Z expires it, because expiry
          uses current_utc >= deadline_at. The cascade must then pin overall pick 2's
          on_clock_started_at to the expired pick's deadline_at (18:10:00.000Z, not the call
          instant) so its round-1 ten-minute deadline is 18:20:00.000Z.
        test_recipe:
          setup:
            - "DraftCycle 2027 rounds_count 2 in DRAFT_LIVE with clubs ELM (draft_order_index 1) and HAR (draft_order_index 2)"
            - "Overall pick 1 is ON_CLOCK from 2027-04-22T18:00:00.000Z with deadline_at 18:10:00.000Z and timeouts_used 0"
            - "An advance issued at 18:09:59.999Z already returned passed_count 0 and changed nothing"
            - "The clock is then set to exactly 2027-04-22T18:10:00.000Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-02T00:00:00.000Z" }
