# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine §0.5 Difficulty Rules, >= 2 instances each (>= 18 total).
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7.
# All formula-derived asserts are literals pre-computed against §1.3.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: super_score_section_best_vs_best_sitting
        grounds:
          - calculations.super_score
          - calculations.sitting_composite
          - state_machines.Registration.SCORED_to_RELEASED
          - entities.ScoreReport.fields.super_composite
        distinguishing_aspect: |
          Super Score takes the per-section max across two RELEASED SAT sittings
          (1440), which strictly exceeds the best single sitting composite (1400);
          this calc operates on the ScoreReport/Registration scoring domain.
        test_recipe:
          setup:
            - "A center with ample capacity and two SAT sessions; one candidate, CHECKED_IN on both sittings, both scored and RELEASED."
            - "Sitting A section_scores {RW:700, MATH:680} (composite 1380); sitting B {RW:660, MATH:740} (composite 1400)."
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 50, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Ada", legal_last_name: "Lovelace", date_of_birth: "2008-12-10", home_state_code: "CA", id_document_state_code: "CA" }
              as: Candidate
              captures: { cand_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_a_id: $.data.id, sess_a_v: $.data.version }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-10-03", window_start_utc: "2026-10-03T13:00:00.000Z", window_end_utc: "2026-10-03T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_b_id: $.data.id, sess_b_v: $.data.version }
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_a_id}", candidate_id: "${cand_id}", expected_test_session_version: "${sess_a_v}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_a_id: $.data.id }
            - call: "POST /registrations/${reg_a_id}/confirm"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "POST /registrations/${reg_a_id}/id-verifications"
              payload: { presented_first_name: "Ada", presented_last_name: "Lovelace", presented_id_state_code: "CA" }
              as: TestCenterAdmin
            - call: "POST /registrations/${reg_a_id}/check-in"
              payload: {}
              as: TestCenterAdmin
            - call: "POST /registrations/${reg_a_id}/score-reports"
              payload: { exam_type: "SAT", section_scores: { READING_WRITING: 700, MATH: 680 } }
              as: ScoreOps
            - call: "POST /registrations/${reg_a_id}/release-score"
              payload: {}
              as: ScoreOps
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_b_id}", candidate_id: "${cand_id}", expected_test_session_version: "${sess_b_v}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_b_id: $.data.id }
            - call: "POST /registrations/${reg_b_id}/confirm"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "POST /registrations/${reg_b_id}/id-verifications"
              payload: { presented_first_name: "Ada", presented_last_name: "Lovelace", presented_id_state_code: "CA" }
              as: TestCenterAdmin
            - call: "POST /registrations/${reg_b_id}/check-in"
              payload: {}
              as: TestCenterAdmin
            - call: "POST /registrations/${reg_b_id}/score-reports"
              payload: { exam_type: "SAT", section_scores: { READING_WRITING: 660, MATH: 740 } }
              as: ScoreOps
          trigger:
            - call: "POST /registrations/${reg_b_id}/release-score"
              payload: {}
              as: ScoreOps
              captures: { reg_b_sr: $.data.id }
          assert:
            - "GET /score-reports?registration_id=${reg_b_id} -> data[0].sitting_composite == 1400"
            - "GET /score-reports?registration_id=${reg_b_id} -> data[0].super_composite == 1440"
            - "GET /score-reports?registration_id=${reg_a_id} -> data[0].super_composite == 1440"
            - "super_composite (1440) != max sitting composite (1400) — section-best, not best-sitting"

      - name: tiered_refund_days_before_test_date_not_since_registration
        grounds:
          - calculations.tiered_refund
          - state_machines.Registration.CONFIRMED_to_CANCELLED
          - entities.Registration.fields.refund_tier
          - entities.TestCenter.fields.net_revenue_cents
        distinguishing_aspect: |
          The refund tier is keyed on days between clock_now and the session
          test_date (14 days -> PARTIAL_75 -> 4500 of 6000), NOT on days since the
          registration's created_at; this calc operates on the Registration cost
          domain, a different entity domain than super_score.
        test_recipe:
          setup:
            - "Candidate has a CONFIRMED registration (paid 6000) on a session dated 2026-09-01; clock set to exactly 14 days before."
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 50, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Ada", legal_last_name: "Lovelace", date_of_birth: "2008-12-10", home_state_code: "CA", id_document_state_code: "CA" }
              as: Candidate
              captures: { cand_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: TestCenterAdmin
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_id}", expected_test_session_version: "${sess_v}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/confirm"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-18T00:00:00.000Z" }
              as: TestCenterAdmin
          trigger:
            - call: "POST /registrations/${reg_id}/cancel"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
          assert:
            - "Registration.${reg_id}.refund_tier == PARTIAL_75"
            - "Registration.${reg_id}.amount_refunded_cents == 4500"
            - "Registration.${reg_id}.lifecycle_status == CANCELLED"
            - "GET /test-centers/${center_id} -> data.net_revenue_cents == 1500  (6000 charged - 4500 refunded)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ap_fee_per_line_round_then_sum_diverges_from_sum_then_round
        grounds:
          - calculations.ap_fee_settlement
          - endpoints[POST /registrations]
          - entities.Registration.fields.amount_paid_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: with base_fee_cents 10001 and
          fee_reduction_pct 0.5, per-line round_half_up then sum yields 15003,
          whereas sum-then-round yields 15002; the scaffold pins per-line-then-sum.
        test_recipe:
          setup:
            - "An AP session bundling 3 exam line items at base_fee_cents 10001 each with a per-order fee_reduction_pct of 0.5."
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "AP Center", state_code: "TX", room_capacity_standard: 50, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Grace", legal_last_name: "Hopper", date_of_birth: "2008-01-01", home_state_code: "TX", id_document_state_code: "TX" }
              as: Candidate
              captures: { cand_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "AP", exam_subject: "AP_CALC_BC", test_date: "2027-05-10", window_start_utc: "2027-05-10T13:00:00.000Z", window_end_utc: "2027-05-10T16:00:00.000Z", base_fee_cents: 10001 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
          trigger:
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_id}", expected_test_session_version: "${sess_v}", fee_reduction_pct: 0.5 }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
          assert:
            - "Registration.${reg_id}.amount_paid_cents == 15003"
            - "Registration.${reg_id}.amount_paid_cents != 15002  (sum-then-round is wrong)"

      - name: standby_promotion_score_weighted_nonlinear_tier_plus_capped_recency
        grounds:
          - calculations.standby_promotion_score
          - state_machines.StandbyEntry.WAITING_to_OFFERED
          - entities.StandbyEntry.fields.promotion_score
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear: promotion_score = tier_weight (branch on
          priority_tier) + min(waited_hours,48); a FEE_WAIVER entry at 0 waited
          hours (300) outranks a GENERAL entry at 100 waited hours (capped to 148),
          a different combinatorial mode than the ap_fee rounding instance.
        test_recipe:
          setup:
            - "A full standard pool (capacity 1, one CONFIRMED registration). Two WAITING standby entries: GENERAL joined ~100h earlier, FEE_WAIVER joined now. Cancelling the confirmed seat must promote the FEE_WAIVER entry."
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Tiny Center", state_code: "NY", room_capacity_standard: 1, room_capacity_accommodated: 1 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: TestCenterAdmin
            - call: "POST /candidates"
              payload: { legal_first_name: "Holder", legal_last_name: "One", date_of_birth: "2008-01-01", home_state_code: "NY", id_document_state_code: "NY" }
              as: Candidate
              captures: { cand_hold: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Gen", legal_last_name: "Eral", date_of_birth: "2008-02-02", home_state_code: "NY", id_document_state_code: "NY" }
              as: Candidate
              captures: { cand_gen: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Fee", legal_last_name: "Waiver", date_of_birth: "2008-03-03", home_state_code: "NY", id_document_state_code: "NY" }
              as: Candidate
              captures: { cand_fw: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_hold}", expected_test_session_version: "${sess_v0}" }
              as: Candidate
              as_user_id: "${cand_hold}"
              captures: { reg_hold: $.data.id }
            - call: "POST /registrations/${reg_hold}/confirm"
              payload: {}
              as: Candidate
              as_user_id: "${cand_hold}"
            - call: "POST /standby-entries"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_gen}", priority_tier: "GENERAL" }
              as: Candidate
              as_user_id: "${cand_gen}"
              captures: { sb_gen: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T04:00:00.000Z" }
              as: TestCenterAdmin
            - call: "POST /standby-entries"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_fw}", priority_tier: "FEE_WAIVER" }
              as: Candidate
              as_user_id: "${cand_fw}"
              captures: { sb_fw: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_hold}/cancel"
              payload: {}
              as: Candidate
              as_user_id: "${cand_hold}"
          assert:
            - "StandbyEntry.${sb_fw}.status == OFFERED  (FEE_WAIVER score 300 > GENERAL score 148)"
            - "StandbyEntry.${sb_fw}.promotion_score == 300"
            - "StandbyEntry.${sb_gen}.status == WAITING"
            - "StandbyEntry.${sb_fw}.offered_registration_id is non-null"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: accommodation_more_info_cycle_back_to_review
        grounds:
          - state_machines.AccommodationRequest.UNDER_REVIEW_to_MORE_INFO_NEEDED
          - state_machines.AccommodationRequest.MORE_INFO_NEEDED_to_UNDER_REVIEW
          - state_machines.AccommodationRequest.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          AccommodationRequest cycles UNDER_REVIEW -> MORE_INFO_NEEDED -> UNDER_REVIEW
          (a true cycle edge) before final APPROVED; the non-linear shape lives on
          the AccommodationRequest entity.
        test_recipe:
          setup:
            - "A 504-eligible candidate with a RESERVED registration and a SUBMITTED accommodation request taken to UNDER_REVIEW then MORE_INFO_NEEDED."
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 50, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Ivy", legal_last_name: "Stone", date_of_birth: "2008-04-04", home_state_code: "CA", id_document_state_code: "CA", has_active_504_iep: true }
              as: Candidate
              captures: { cand_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_id}", expected_test_session_version: "${sess_v}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /accommodation-requests"
              payload: { candidate_id: "${cand_id}", target_registration_id: "${reg_id}", accommodation_type: "EXTENDED_TIME_50", basis: "PLAN_504" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { acc_id: $.data.id }
            - call: "POST /accommodation-requests/${acc_id}/begin-review"
              payload: {}
              as: AccommodationReviewer
            - call: "POST /accommodation-requests/${acc_id}/request-info"
              payload: { reviewer_note: "Need current evaluation" }
              as: AccommodationReviewer
          trigger:
            - call: "POST /accommodation-requests/${acc_id}/resubmit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "POST /accommodation-requests/${acc_id}/approve"
              payload: {}
              as: AccommodationReviewer
          assert:
            - "After resubmit, AccommodationRequest.${acc_id}.status passed through UNDER_REVIEW again (cycle)"
            - "AccommodationRequest.${acc_id}.status == APPROVED"
            - "Registration.${reg_id}.seat_kind == ACCOMMODATED"

      - name: registration_parallel_axes_lifecycle_and_score_independent
        grounds:
          - state_machines.Registration.RESERVED_to_CONFIRMED
          - state_machines.Registration.PENDING_to_SCORED
          - state_machines.Registration.SCORED_to_RELEASED
          - entities.Registration.fields.lifecycle_status
          - entities.Registration.fields.score_status
        distinguishing_aspect: |
          Registration carries two independent state axes (lifecycle_status and
          score_status) that advance on different triggers; the non-linear
          (parallel-dimension) shape lives on the Registration entity, distinct
          from AccommodationRequest.
        test_recipe:
          setup:
            - "A registration driven to CHECKED_IN on axis 1; axis 2 then advances PENDING->SCORED->RELEASED while lifecycle stays CHECKED_IN."
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Bay Center", state_code: "CA", room_capacity_standard: 50, room_capacity_accommodated: 5 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Ada", legal_last_name: "Lovelace", date_of_birth: "2008-12-10", home_state_code: "CA", id_document_state_code: "CA" }
              as: Candidate
              captures: { cand_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v: $.data.version }
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_id}", expected_test_session_version: "${sess_v}" }
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { reg_id: $.data.id }
            - call: "POST /registrations/${reg_id}/confirm"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "POST /registrations/${reg_id}/id-verifications"
              payload: { presented_first_name: "Ada", presented_last_name: "Lovelace", presented_id_state_code: "CA" }
              as: TestCenterAdmin
            - call: "POST /registrations/${reg_id}/check-in"
              payload: {}
              as: TestCenterAdmin
            - call: "POST /registrations/${reg_id}/score-reports"
              payload: { exam_type: "SAT", section_scores: { READING_WRITING: 600, MATH: 600 } }
              as: ScoreOps
          trigger:
            - call: "POST /registrations/${reg_id}/release-score"
              payload: {}
              as: ScoreOps
          assert:
            - "Registration.${reg_id}.lifecycle_status == CHECKED_IN  (axis 1 unchanged by scoring)"
            - "Registration.${reg_id}.score_status == RELEASED  (axis 2 advanced independently)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_frees_seat_promotes_standby_mints_offer_hold_depth3
        grounds:
          - state_machines.Registration.CONFIRMED_to_CANCELLED
          - state_machines.StandbyEntry.WAITING_to_OFFERED
          - entities.StandbyEntry.fields.offered_registration_id
          - entities.Registration.fields.is_standby_origin
        distinguishing_aspect: |
          Depth-3 chain: cancel Registration (A) -> session STANDARD seat pool
          decremented (B) -> top WAITING StandbyEntry promoted to OFFERED (C) ->
          promotion mints a new offer-hold Registration and links it (D). Each hop
          is caused by the previous one, not by the original cancel.
        test_recipe:
          setup:
            - "Standard pool capacity 1, filled by one CONFIRMED registration; one WAITING GENERAL standby entry."
          setup_api_calls:
            - call: "POST /test-centers"
              payload: { name: "Tiny Center", state_code: "NY", room_capacity_standard: 1, room_capacity_accommodated: 1 }
              as: TestCenterAdmin
              captures: { center_id: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Holder", legal_last_name: "One", date_of_birth: "2008-01-01", home_state_code: "NY", id_document_state_code: "NY" }
              as: Candidate
              captures: { cand_hold: $.data.id }
            - call: "POST /candidates"
              payload: { legal_first_name: "Alt", legal_last_name: "Ernate", date_of_birth: "2008-02-02", home_state_code: "NY", id_document_state_code: "NY" }
              as: Candidate
              captures: { cand_alt: $.data.id }
            - call: "POST /test-sessions"
              payload: { test_center_id: "${center_id}", exam_type: "SAT", exam_subject: "GENERAL", test_date: "2026-09-01", window_start_utc: "2026-09-01T13:00:00.000Z", window_end_utc: "2026-09-01T17:00:00.000Z", base_fee_cents: 6000 }
              as: TestCenterAdmin
              captures: { sess_id: $.data.id, sess_v0: $.data.version }
            - call: "POST /registrations"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_hold}", expected_test_session_version: "${sess_v0}" }
              as: Candidate
              as_user_id: "${cand_hold}"
              captures: { reg_hold: $.data.id }
            - call: "POST /registrations/${reg_hold}/confirm"
              payload: {}
              as: Candidate
              as_user_id: "${cand_hold}"
            - call: "POST /standby-entries"
              payload: { test_session_id: "${sess_id}", candidate_id: "${cand_alt}", priority_tier: "GENERAL" }
              as: Candidate
              as_user_id: "${cand_alt}"
              captures: { sb_alt: $.data.id }
          trigger:
            - call: "POST /registrations/${reg_hold}/cancel"
              payload: {}
              as: Candidate
              as_user_id: "${cand_hold}"
          assert:
            - "StandbyEntry.${sb_alt}.status == OFFERED"
            - "StandbyEntry.${sb_alt}.offered_registration_id is non-null (offer-hold minted)"
            - "GET /standby-entries?test_session_id=${sess_id} -> the offer-hold Registration has is_standby_origin == true and lifecycle_status == RESERVED"
            - "GET /test-sessions/${sess_id} -> data.standard_seats_reserved == 1 (freed seat re-taken by the hold)"

      - name: accommodation_approve_binds_seat_and_recomputes_minutes_depth2
        grounds:
          - state_machines.AccommodationRequest.UNDER_REVIEW_to_APPROVED
          - calculations.allotted_minutes
          - entities.Registration.fields.allotted_minutes
          - entities.Registration.fields.seat_kind
        distinguishing_aspect: |
          Depth-2 chain from a different trigger: approve AccommodationRequest (A)
          -> bind target Registration and flip seat_kind to ACCOMMODATED, moving
          the seat between pools (B); that binding itself recomputes the
          Registration.allotted_minutes from the time multiplier (C).
        test_recipe:
          setup:
