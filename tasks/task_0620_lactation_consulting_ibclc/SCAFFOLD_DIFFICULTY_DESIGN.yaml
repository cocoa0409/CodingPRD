              captures: { client_a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { practice_id: "${prac_id}", to_iso8601: "2026-06-10T15:00:00Z" }
              as: PracticeAdmin
            - call: "POST /consults"
              payload: { practice_id: "${prac_id}", client_id: "${client_a_id}", consultant_id: "${cons_id}", consult_type: "TELEHEALTH", scheduled_start_utc: "2026-06-10T15:00:00Z", scheduled_end_utc: "2026-06-10T16:00:00Z", pay_method: "SELF_PAY" }
              as: FrontDesk
              captures: { consult_a_id: $.data.id }
