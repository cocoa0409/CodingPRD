        distinguishing_aspect: "Taking one of two AVAILABLE lockers OUT_OF_SERVICE drops available_locker_count from 2 to 1 while nominal_locker_count stays 2."
        test_recipe:
          setup: ["Bank with two AVAILABLE lockers."]
