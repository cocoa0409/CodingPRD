              as: Operator
            - call: "POST /accounts"
              payload: { email: "ov1@x.com", full_name: "OV1", residence_country: "US" }
              as: Anonymous
              captures: { acc_o1: $.data.id }
            - call: "POST /accounts/${acc_o1}/kyc-applications"
              payload: { requested_tier: "TIER_1" }
              as: Trader
              as_user_id: "${acc_o1}"
            - call: "POST /accounts/${acc_o1}/kyc-decisions"
              payload: { decision: "APPROVE" }
              as: Operator
            - call: "GET /accounts/${acc_o1}"
              as: Trader
              as_user_id: "${acc_o1}"
              captures: { v_o1a: $.data.version }
            - call: "POST /withdrawal-addresses"
              payload: { account_id: "${acc_o1}", asset: "BTC", chain_address: "0xDUP", label: "first", expected_account_version: "${v_o1a}" }
              as: Trader
              as_user_id: "${acc_o1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T12:00:00Z" }
              as: Operator
            - call: "GET /accounts/${acc_o1}"
              as: Trader
              as_user_id: "${acc_o1}"
              captures: { v_o1b: $.data.version }
          trigger:
            - call: "POST /withdrawal-addresses"
              payload: { account_id: "${acc_o1}", asset: "BTC", chain_address: "0xDUP", label: "dup", expected_account_version: "${v_o1b}" }
              as: Trader
