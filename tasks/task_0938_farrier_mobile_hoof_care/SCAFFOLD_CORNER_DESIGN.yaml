        grounds: ["concurrency_rules[activate-prescription-stale-case]", "validations[priority=26]", "errors[ERR_STALE_CASE_VERSION]"]
        distinguishing_aspect: "Activating the first prescription bumped the case's version, so activating a sibling with the version read at case creation is rejected 412 ERR_STALE_CASE_VERSION and the incumbent stays ACTIVE."
        test_recipe:
          setup: ["A severity-2 case whose version was captured at creation, one prescription already activated, and a second still DRAFT."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
