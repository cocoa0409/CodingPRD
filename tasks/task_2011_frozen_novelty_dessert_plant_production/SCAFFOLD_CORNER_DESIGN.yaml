      - call: POST /mix-batches
        payload:
          batch_code: MB-1
          product_id: ${p_bar}
          litres_produced: 500
        as: ProductionPlanner
        captures:
          m1: $.data.id
      - call: POST /mix-batches/${m1}/pasteurize
        as: LineOperator
        as_user_id: op_1
      - call: POST /mix-batches/${m1}/release
        as: QAManager
        as_user_id: qa_1
      - call: POST /production-runs
        payload:
          run_code: R-T
