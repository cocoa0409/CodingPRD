scaffold_difficulty_design:

  # =========================================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: disposal_points_manual_vs_ai_scoring
        grounds:
          - calculations.disposal_points_award
          - calculations.disposal_points_award.variants.manual_scoring
          - calculations.disposal_points_award.variants.ai_scoring
          - entities.Disposal.fields.scoring_method
          - entities.Disposal.fields.awarded_points
        distinguishing_aspect: |
          Same disposal inputs (community, household, resident, declared_category=RECYCLABLE, actual_category=RECYCLABLE, weight_kg=2.0, accuracy_score=0.50, base_rate_per_kg=10) produce Disposal.awarded_points==15 under scoring_method=MANUAL (multiplier=0.50+0.50*0.50=0.75; base_points=round(10*2.0*0.75)=15) but Disposal.awarded_points==14 under scoring_method=AI (stepwise multiplier=0.70 because 0.50<=accuracy_score<0.80; base_points=round(10*2.0*0.70)=14). The dual variants live on the Disposal entity domain, where the *accuracy multiplier formula itself* changes shape across scoring_method while every other input is identical.
        test_recipe:
          setup:
            - "POST /communities with timezone=UTC -> Community c"
            - "POST /communities/{c}/households -> Household h1"
            - "POST /communities/{c}/households/{h1}/residents (relation=HEAD) -> Resident r1; verify identity to VERIFIED/ACTIVE"
            - "POST /communities/{c}/point-rules with category=RECYCLABLE, base_rate_per_kg=10, daily_cap_points=10000, bonus_consecutive_threshold_days=99, peak_period_start_hour=0, peak_period_end_hour=0, category_bonus_flat=0 -> PointRule pr; activate at now()"
            - "Advance clock 1 hour"
          trigger:
            - "POST /communities/{c}/households/{h1}/disposals with scoring_method=MANUAL, accuracy_score=0.5, weight_kg=2.0, actual_category=RECYCLABLE, evidence_uri='x://e1' -> D_manual"
            - "POST /communities/{c}/households/{h1}/disposals with scoring_method=AI,     accuracy_score=0.5, weight_kg=2.0, actual_category=RECYCLABLE, evidence_uri='x://e2' -> D_ai"
          assert:
            - "D_manual.awarded_points == 15"
            - "D_ai.awarded_points == 14"
            - "D_manual.awarded_points != D_ai.awarded_points"

      - name: ranking_score_weekly_vs_monthly_window
        grounds:
          - calculations.ranking_score
          - calculations.ranking_score.variants.weekly_window
          - calculations.ranking_score.variants.monthly_window
          - entities.RankingPeriod.fields.granularity
          - entities.RankingPeriod.fields.leaderboard
        distinguishing_aspect: |
          The same underlying set of COMMITTED disposals (raw_score=100 for the only contributing household, in a 7-day calendar window) lands at RankingPeriod.leaderboard[0].score==100 when granularity=WEEKLY (no normalization) and at RankingPeriod.leaderboard[0].score==429 when the same 7-day data is read inside a 7-day MONTHLY window (score = round(100 * 30/7) = round(428.57) = 429). The dual-variant logic operates on RankingPeriod entity domain (different from Disposal), and the *aggregation normalization* changes across granularity while every disposal is identical.
        test_recipe:
          setup:
            - "Community c, household h1, ACTIVE resident r1, ACTIVE PointRule (RECYCLABLE base_rate_per_kg=10)"
            - "Submit 5 disposals over 7 calendar days (one per day, days 1..5 then skip days 6..7) each weight_kg=2.0, MANUAL, accuracy=1.0 (multiplier=1.00); each awards round(10*2.0*1.0)=20 points -> total earned=100"
            - "Create RankingPeriod p_week (granularity=WEEKLY, dimension=HOUSEHOLD, window=[day0, day7))"
            - "Create RankingPeriod p_month (granularity=MONTHLY, dimension=HOUSEHOLD, window=[day0, day7))"
            - "Advance clock to day 8"
          trigger:
            - "POST /communities/{c}/ranking-periods/{p_week}/close"
            - "POST /communities/{c}/ranking-periods/{p_month}/close"
          assert:
            - "p_week.leaderboard[0].subject_id == h1 and p_week.leaderboard[0].score == 100"
            - "p_month.leaderboard[0].subject_id == h1 and p_month.leaderboard[0].score == 429"
            - "p_week.leaderboard[0].score != p_month.leaderboard[0].score"

  # =========================================================================
  # Rule 2: Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: disposal_points_tiered_multiplier_with_bonuses_and_cap
        grounds:
          - calculations.disposal_points_award
          - entities.PointRule.fields.bonus_consecutive_threshold_days
          - entities.PointRule.fields.bonus_consecutive_multiplier
          - entities.PointRule.fields.peak_period_start_hour
          - entities.PointRule.fields.peak_period_end_hour
          - entities.PointRule.fields.daily_cap_points
          - entities.Disposal.fields.awarded_points
          - entities.Disposal.fields.cap_overflow_points
        distinguishing_aspect: |
          Mode (a): the awarded_points formula has FOUR interacting inputs (effective_weight_kg, accuracy_multiplier from scoring_method+score, consecutive-streak bonus delta, peak-period flat bonus) with non-linear interaction — the consecutive_bonus is computed as round((base_points)*(multiplier-1.0)) which depends on base_points which depends on the accuracy_multiplier branch chosen — and the daily cap clamps the sum AFTER bonuses, then splits awarded vs cap_overflow non-linearly. With base_rate_per_kg=10, weight_kg=4.0, AI accuracy_score=0.85 (multiplier=1.00), consecutive_streak hit (bonus_multiplier=1.20), peak_period_bonus_flat=5: base_points=round(10*4.0*1.00)=40, consecutive_bonus=round(40*0.20)=8, peak_bonus=5, raw=53; with daily_cap=200 and 150 already credited today, headroom=50 -> awarded_points=50, cap_overflow_points=3.
        test_recipe:
          setup:
            - "Community c, household h1, verified ACTIVE resident r1"
            - "Active PointRule: base_rate_per_kg=10, bonus_consecutive_threshold_days=1, bonus_consecutive_multiplier=1.20, peak_period_start_hour=8, peak_period_end_hour=10, peak_period_bonus_flat=5, category_bonus_flat=0, daily_cap_points=200"
            - "Advance clock to 2026-01-01T08:30:00Z"
            - "Burn 150 points first by submitting earlier disposals today (e.g., 1x weight_kg=15.0 SCALE accuracy=1.0 -> base_points=150) so already_credited_today=150"
            - "Resident.consecutive_disposal_days >= 1 (the just-submitted earlier disposal triggers streak)"
          trigger:
            - "POST disposal at 08:30 UTC, scoring_method=AI, accuracy_score=0.85, weight_kg=4.0, actual_category=RECYCLABLE, evidence_uri='x://t'"
          assert:
            - "disposal.awarded_points == 50"
            - "disposal.cap_overflow_points == 3"
            - "disposal.awarded_points + disposal.cap_overflow_points == 53"

      - name: ranking_score_per_subject_round_then_sum_order
        grounds:
          - calculations.ranking_score
          - entities.RankingPeriod.fields.leaderboard
          - entities.Disposal.fields.awarded_points
        distinguishing_aspect: |
          Mode (b): per-subject ranking score nests rounding — each Disposal.awarded_points is rounded to an integer at commit time, and the period score sums those already-rounded integers. The scaffold pins this order: "round per disposal, then sum"; the alternative "sum raw fractional points, then round at period close" would yield a different integer in edge cases. Concretely with 3 disposals on subject h1 that each compute raw 12.4/12.4/12.4 points: per-disposal rounding gives 12+12+12=36 (each rounds down because 12.4 < 12.5), whereas sum-then-round would give round(37.2)=37. The scaffold pins 36 as the correct WEEKLY score.
        test_recipe:
          setup:
            - "Active PointRule with base_rate_per_kg=6.20 to manufacture 12.4 raw per disposal at weight_kg=2.0, MANUAL, accuracy_score=1.0 -> base_points=round(6.20*2.0*1.00)=round(12.4)=12 each (banker-vs-half-up — we use round_half_up; 12.4 rounds to 12)"
            - "Submit 3 such disposals on 3 consecutive calendar days inside week window [day0, day7)"
            - "Create WEEKLY RankingPeriod p covering [day0, day7)"
            - "Advance clock to day 8"
          trigger:
            - "POST /communities/{c}/ranking-periods/{p}/close"
          assert:
            - "p.leaderboard[0].subject_id == h1"
            - "p.leaderboard[0].score == 36"
            - "p.leaderboard[0].score != 37  # sum-then-round path is forbidden by pinned order"

      - name: rule_effectiveness_tier_pinned_before_score
        grounds:
          - calculations.rule_effectiveness_score
          - entities.PointRule.fields.id
        distinguishing_aspect: |
          Mode (c): the rule_effectiveness_score has a circular-looking dependency — the chosen WEIGHT_VECTOR depends on participation_tier, which depends on participation count; if the implementation incorrectly re-derived the tier from the weighted score, the result would differ. The scaffold pins the evaluation order: tier is computed from raw participation count BEFORE weights are applied; the final score never feeds back into tier selection. With 12 participating households (>=10 so tier=MEDIUM, weights {accuracy:0.40, misjudgment:0.40, participation:0.20}), avg_accuracy=0.9, misjudgment_ratio=1/12, participation_normalized=min(1.0, 12/100)=0.12: score = round(100*(0.40*0.9 + 0.40*(1 - 1/12) + 0.20*0.12), 1) = round(100*(0.36 + 0.36667 + 0.024), 1) = round(75.067, 1) = 75.1. If the implementation re-derived tier from this score (a naive impl might invent a score-threshold for HIGH), it would pick wrong weights and arrive at a different number; the scaffold pins MEDIUM regardless.
        test_recipe:
          setup:
            - "Active PointRule pr"
            - "Create 12 households, each with one verified ACTIVE resident, each with at least one COMMITTED disposal applying pr at accuracy_score=0.9; exactly 1 of those disposals is CORRECTED (misjudgment_ratio = 1/12, formula uses exact double)"
            - "Pin: avg_accuracy across all 12 disposals = (12*0.9)/12 = 0.9; misjudgment_ratio = 1/12 exact; participation_normalized = 12/100 = 0.12"
          trigger:
            - "GET /communities/{c}/point-rules/{pr}/effectiveness"
          assert:
            - "response.data.participation == 12"
            - "response.data.participation_tier == 'MEDIUM'"
            - "response.data.score == 75.1"
            - "response.data.participation_tier != 'HIGH'  # would mis-pick if implementation derived tier from score"

  # =========================================================================
  # Rule 3: Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: violation_cyclic_appeal_cycle
        grounds:
          - state_machines.Violation
          - state_machines.Violation.NEW_to_APPEALED
          - state_machines.Violation.APPEALED_to_UNDER_REVIEW
          - state_machines.Violation.UNDER_REVIEW_to_UPHELD
          - state_machines.Violation.UPHELD_to_APPEALED
          - state_machines.Violation.UNDER_REVIEW_to_OVERTURNED
          - entities.Violation.fields.appeal_round
        distinguishing_aspect: |
          The Violation state machine has a true cycle: NEW -> APPEALED -> UNDER_REVIEW -> UPHELD -> APPEALED (round 2) -> UNDER_REVIEW -> {UPHELD | OVERTURNED}. The cycle is round-bounded (Violation.appeal_round <= 2). After two trips around the cycle, an attempted third appeal MUST fail with ERR_VIOLATION_REAPPEAL_LIMIT. This is structurally distinct from a linear pipeline and lives on the Violation entity (different entity from the second instance).
        test_recipe:
          setup:
            - "Community c, household h1, verified ACTIVE resident r1"
            - "POST /communities/{c}/violations creates Violation v (type=MIS_SORTING) with appeal_deadline_at = occurred_at + APPEAL_WINDOW_DAYS"
          trigger:
            - "POST .../appeal as Resident -> v.status=APPEALED, v.appeal_round=1"
            - "POST .../accept-review as AppealReviewer -> v.status=UNDER_REVIEW"
            - "POST .../decide with decision=UPHOLD as AppealReviewer -> v.status=UPHELD"
            - "POST .../appeal as Resident -> v.status=APPEALED, v.appeal_round=2"
            - "POST .../accept-review -> UNDER_REVIEW"
            - "POST .../decide UPHOLD -> UPHELD"
            - "POST .../appeal as Resident -> rejected"
          assert:
            - "After first round: v.appeal_round == 1 and v.status visited APPEALED, UNDER_REVIEW, UPHELD in sequence"
            - "After second appeal: v.appeal_round == 2 and v.status == APPEALED (cycle exercised)"
            - "Third appeal returns 409 ERR_VIOLATION_REAPPEAL_LIMIT"

      - name: redemption_order_branching_with_revert
        grounds:
          - state_machines.RedemptionOrder
          - state_machines.RedemptionOrder.SUBMITTED_to_CONFIRMED
          - state_machines.RedemptionOrder.SUBMITTED_to_REJECTED
          - state_machines.RedemptionOrder.CONFIRMED_to_FULFILLED
          - state_machines.RedemptionOrder.FULFILLED_to_DELIVERED
          - state_machines.RedemptionOrder.FULFILLED_to_RETURNED
        distinguishing_aspect: |
          RedemptionOrder has a branching shape with a divergent terminal set: SUBMITTED forks into {CONFIRMED, REJECTED}, then CONFIRMED -> FULFILLED forks into {DELIVERED, RETURNED}. The RETURNED branch is compensating (re-credits MallItem.stock and Household.points_balance) whereas DELIVERED is terminal-no-effect. This is branching fork-join on a different entity (RedemptionOrder) from the cyclic instance above (Violation).
        test_recipe:
          setup:
            - "Community c, household h1, verified ACTIVE resident r1 with points_balance=100"
            - "POST mall-items with cost_points=30, stock=5, channel=STATION -> MallItem m"
            - "POST /communities/{c}/redemption-orders quantity=2, mall_item_id=m, resident_id=r1, household_id=h1 -> Order o (status=SUBMITTED)"
          trigger:
            - "POST /communities/{c}/redemption-orders/{o}/confirm -> CONFIRMED; stock=3, points_balance=40"
            - "POST .../fulfill -> FULFILLED"
            - "POST .../return reason='wrong item' -> RETURNED; stock=5, points_balance=100"
            - "(separate order) POST .../reject on a fresh SUBMITTED order -> REJECTED (no stock/points movement)"
          assert:
            - "After return: MallItem.stock == 5 (restored)"
            - "After return: Household.points_balance == 100 (refunded)"
            - "RedemptionOrder reaches terminal state in {REJECTED, DELIVERED, RETURNED} depending on path"
            - "The return-branch and deliver-branch produce structurally different side-effect sets"

  # =========================================================================
  # Rule 4: Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: violation_overturn_cascade_depth_three
        grounds:
          - state_machines.Violation.UNDER_REVIEW_to_OVERTURNED
          - state_machines.Disposal.COMMITTED_to_CORRECTED
          - calculations.violation_deduction
          - entities.PointsTransaction.fields.kind
          - entities.RankingPeriod.fields.leaderboard
          - entities.Household.fields.points_balance
        distinguishing_aspect: |
          Trigger: AppealReviewer's OVERTURN decision on the FIRST chronological violation V1 of (resident, violation_type). Cascade depth 3: (A) V1.status flips UNDER_REVIEW -> OVERTURNED, which appends PointsTransaction kind=VIOLATION_REVERSAL; (B) that PointsTransaction.append ITSELF then triggers a recompute on each subsequent UNCONTESTED V_i (i>=2) of same (resident, type) — V_i.repeat_count_in_window drops by one, V_i.escalation_multiplier drops to a lower tier, V_i.final_deduction_points decreases, and EACH such V_i appends its own PointsTransaction kind=MISJUDGMENT_ADJUSTMENT; (C) those new PointsTransaction rows ITSELF then trigger invalidation of any OPEN RankingPeriod whose window contains either V1.occurred_at or V_i.occurred_at, setting RankingPeriod.leaderboard = []. Each link is caused by the previous link's mutation, not directly by the OVERTURN call.
        test_recipe:
          setup:
            - "Community c, household h1, verified ACTIVE resident r1"
            - "Active PointRule pr (RECYCLABLE base_rate_per_kg=10, daily_cap=10000)"
            - "Create RankingPeriod p (WEEKLY, dimension=HOUSEHOLD, window covers all violations below)"
            - "Submit Violation V1 type=MIS_SORTING at t0: repeat_count=1, multiplier=1.00, final=20, balance -=20"
            - "Submit Violation V2 type=MIS_SORTING at t0+1d: repeat_count=2, multiplier=1.50, final=30, balance -=30"
            - "Submit Violation V3 type=MIS_SORTING at t0+2d: repeat_count=3, multiplier=2.00, final=40, balance -=40"
            - "Initial household.points_balance after creation = -90"
            - "Resident appeals V1; admin accepts review; reviewer decides OVERTURN"
          trigger:
            - "POST /communities/{c}/violations/{V1}/decide with decision=OVERTURN"
          assert:
            - "Link 1 (depth 1): V1.status == OVERTURNED and PointsTransaction with kind=VIOLATION_REVERSAL amount=+20 was appended for V1"
            - "Link 2 (depth 2): V2.final_deduction_points was recomputed from 30 to 20 (repeat now=1, multiplier=1.00) and PointsTransaction kind=MISJUDGMENT_ADJUSTMENT amount=+10 was appended; V3.final_deduction_points was recomputed from 40 to 30 (repeat now=2, multiplier=1.50) and PointsTransaction kind=MISJUDGMENT_ADJUSTMENT amount=+10 was appended"
            - "Link 3 (depth 3): RankingPeriod p.leaderboard == [] (invalidated because V1.occurred_at falls in its window and the cascade above mutated points)"
            - "Household.points_balance == -90 + 20 + 10 + 10 == -50"

      - name: disposal_correct_cascade_depth_two
        grounds:
          - state_machines.Disposal.COMMITTED_to_CORRECTED
          - calculations.disposal_points_award
          - calculations.consecutive_disposal_days
          - entities.PointsTransaction.fields.kind
          - entities.Household.fields.points_balance
          - entities.RankingPeriod.fields.leaderboard
        distinguishing_aspect: |
          Trigger: CommunityAdmin's CORRECT on a previously COMMITTED disposal (different trigger from instance 1). Cascade depth 2: (A) Disposal.status COMMITTED -> CORRECTED with a smaller accuracy_score, which appends PointsTransaction kind=MISJUDGMENT_ADJUSTMENT (negative); (B) that PointsTransaction.append ITSELF then invalidates any OPEN RankingPeriod whose window contains disposal_time, setting leaderboard = []. Depth ≥ 2, originating from a non-violation trigger.
        test_recipe:
          setup:
            - "Community c, household h1, verified ACTIVE resident r1"
            - "Active PointRule pr (RECYCLABLE base_rate_per_kg=10, daily_cap=10000)"
            - "Create OPEN RankingPeriod p_open (WEEKLY, dimension=HOUSEHOLD, window covers t0)"
            - "POST disposal at t0, MANUAL, accuracy_score=1.0, weight_kg=2.0 -> awarded_points=20, household.points_balance=20"
          trigger:
            - "POST .../disposals/{disposal_id}/correct with accuracy_score=0.5, reason='AI re-check'"
          assert:
            - "Link 1: PointsTransaction with kind=MISJUDGMENT_ADJUSTMENT amount=-5 was appended (new awarded = round(10*2.0*0.75)=15; delta = 15-20 = -5)"
            - "Link 2: RankingPeriod p_open.leaderboard == [] (invalidated by the points mutation appended in Link 1)"
            - "Household.points_balance == 15"

  # =========================================================================
  # Rule 5: Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: appeal_window_expired_vs_invalid_state
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors.ERR_INVALID_STATE
          - errors.ERR_APPEAL_WINDOW_EXPIRED
          - state_machines.Violation.NEW_to_APPEALED
        distinguishing_aspect: |
          Two checks fail simultaneously on POST .../violations/{id}/appeal: the violation is already in UPHELD state (state-category check, priority=6) AND the appeal deadline has passed (business_temporal-category check, priority=7). The scaffold's priority ordering REQUIRES ERR_INVALID_STATE wins over ERR_APPEAL_WINDOW_EXPIRED when both fail. This pair is (state, business_temporal). Distinct from instance 2's pair below.
        test_recipe:
          setup:
            - "Community c, h1, verified ACTIVE r1"
            - "POST violation v (occurred_at = t0, appeal_deadline_at = t0 + APPEAL_WINDOW_DAYS)"
            - "Resident appeals v -> APPEALED; admin accept-review -> UNDER_REVIEW; reviewer UPHELD"
            - "v.appeal_round == 1, v.status == UPHELD (state-check would fail because UPHELD permits re-appeal only if appeal_round < 2 — but for THIS test, simulate appeal_round=2 to make state-check fail unambiguously; OR use the simpler version: after first UPHELD, drive a second UPHELD via cycle, putting appeal_round at 2)"
            - "After UPHELD twice, advance clock past appeal_deadline_at"
          trigger:
            - "POST .../violations/{v}/appeal as Resident"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_INVALID_STATE'  # state(priority=6) wins"
            - "data.error_id != 'ERR_APPEAL_WINDOW_EXPIRED'"

      - name: insufficient_points_vs_insufficient_stock_priority
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - errors.ERR_INSUFFICIENT_STOCK
          - errors.ERR_INSUFFICIENT_POINTS
          - state_machines.RedemptionOrder.SUBMITTED_to_CONFIRMED
        distinguishing_aspect: |
          Two checks fail simultaneously on POST .../redemption-orders/{id}/confirm: MallItem.stock < quantity (business_constraint, priority=13) AND Household.points_balance < total_cost_points (business_fiscal, priority=14). The scaffold pins the stock check ahead of the points check (constraint precedes fiscal) — confirm returns ERR_INSUFFICIENT_STOCK rather than ERR_INSUFFICIENT_POINTS when both fail. This pair is (business_constraint, business_fiscal), distinct from the (state, business_temporal) pair above.
        test_recipe:
          setup:
            - "Community c, h1, verified ACTIVE r1 with points_balance = 5 (very low)"
            - "POST mall-item cost_points=100, stock=0, channel=ONLINE"
            - "POST redemption-order quantity=1, mall_item_id=m -> Order o (SUBMITTED)"
            - "Note: total_cost_points=100, but points_balance=5 AND stock=0 — both fail"
          trigger:
            - "POST /communities/{c}/redemption-orders/{o}/confirm"
          assert:
            - "HTTP status == 409"
            - "data.error_id == 'ERR_INSUFFICIENT_STOCK'  # priority 13 wins over priority 14"
            - "data.error_id != 'ERR_INSUFFICIENT_POINTS'"

  # =========================================================================
  # Rule 6: Boundary-precision checks on different metrics / endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: daily_cap_exact_boundary
        grounds:
          - calculations.disposal_points_award
          - entities.PointRule.fields.daily_cap_points
          - entities.Disposal.fields.awarded_points
          - entities.Disposal.fields.cap_overflow_points
        distinguishing_aspect: |
          Boundary at the daily-cap threshold for the POST disposal endpoint. The formula uses headroom = max(0, daily_cap_points - already_credited_today); with daily_cap_points=200 and already_credited_today==200 exactly, headroom=0 — the next raw=10 disposal MUST award 0 (not 10), cap_overflow=10. Crucially, the boundary is INCLUSIVE: hitting exactly the cap still allows a zero-award disposal to commit (rather than rejecting it). This is a numeric-threshold boundary on the awarded_points metric, on the POST disposal endpoint.
        test_recipe:
          setup:
            - "Active PointRule with base_rate_per_kg=10, daily_cap_points=200, no bonuses (peak_period_start_hour=0, peak_period_end_hour=0, bonus_consecutive_threshold_days=999)"
            - "Submit a 'soaker' disposal weight_kg=20.0, MANUAL, accuracy_score=1.0 -> raw=200, awarded=200 (cap met exactly), cap_overflow=0"
          trigger:
            - "POST a follow-up disposal at same calendar day, weight_kg=1.0, MANUAL, accuracy_score=1.0 -> raw=10"
          assert:
            - "follow_up.awarded_points == 0"
            - "follow_up.cap_overflow_points == 10"
            - "Household.points_balance == 200 (unchanged by follow_up)"

      - name: ranking_publish_empty_leaderboard
        grounds:
          - calculations.ranking_score
          - state_machines.RankingPeriod.CLOSED_to_PUBLISHED
          - validations[priority=19]
          - errors.ERR_RANKING_EMPTY
          - entities.RankingPeriod.fields.leaderboard
        distinguishing_aspect: |
          Empty-set boundary on the POST /ranking-periods/{id}/publish endpoint (different endpoint from instance 1). A RankingPeriod whose window contains zero eligible disposals AND zero eligible violations has leaderboard==[] at close time. Publishing such a period MUST be rejected with ERR_RANKING_EMPTY (422). The boundary is the empty-collection edge — not a numeric threshold.
        test_recipe:
          setup:
            - "Community c (otherwise empty — no households / disposals contribute in the window)"
            - "Create RankingPeriod p (WEEKLY, HOUSEHOLD, window=[day0, day7))"
            - "Advance clock to day 8"
            - "POST .../ranking-periods/{p}/close -> p.status=CLOSED, p.leaderboard=[]"
          trigger:
            - "POST /communities/{c}/ranking-periods/{p}/publish"
          assert:
            - "HTTP status == 422"
            - "data.error_id == 'ERR_RANKING_EMPTY'"
            - "p.status == 'CLOSED'  # publish was rejected; status unchanged"

  # =========================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: disposal_requires_resident_active_and_rule_active
        grounds:
          - state_machines.Disposal.PENDING_to_COMMITTED
          - entities.Resident.fields.identity_status
          - entities.Resident.fields.account_status
          - entities.PointRule.fields.status
          - validations[priority=8]
          - validations[priority=9]
          - errors.ERR_RESIDENT_INACTIVE
          - errors.ERR_NO_ACTIVE_RULE
        distinguishing_aspect: |
          The Disposal entity's PENDING->COMMITTED transition depends on two SEPARATE cross-entity preconditions: (i) the Resident must be in (identity_status=VERIFIED AND account_status=ACTIVE) — failure produces ERR_RESIDENT_INACTIVE; (ii) some PointRule with (community_id, actual_category) must be in status=ACTIVE at disposal_time — failure produces ERR_NO_ACTIVE_RULE. Entity pair: Disposal↔Resident and Disposal↔PointRule. Distinct from the second instance below (RedemptionOrder↔Household).
        test_recipe:
          setup:
            - "Community c, h1, resident r1 freshly created (identity_status=PENDING, account_status=INACTIVE)"
            - "No PointRule active yet in c"
          trigger:
            - "POST disposal as r1 BEFORE verification -> rejected"
            - "Verify r1 to VERIFIED/ACTIVE"
            - "POST disposal as r1 BEFORE any rule activated -> rejected"
            - "Activate a PointRule covering RECYCLABLE"
            - "POST disposal as r1 with category=RECYCLABLE -> committed"
          assert:
            - "Pre-verify call: HTTP 422 with error_id == 'ERR_RESIDENT_INACTIVE'"
            - "Post-verify, no-rule call: HTTP 422 with error_id == 'ERR_NO_ACTIVE_RULE'"
            - "Post-rule-active call: HTTP 201, Disposal.status == 'COMMITTED'"

      - name: redemption_confirm_requires_household_balance_and_stock
        grounds:
          - state_machines.RedemptionOrder.SUBMITTED_to_CONFIRMED
          - entities.Household.fields.points_balance
          - entities.MallItem.fields.stock
          - validations[priority=13]
          - validations[priority=14]
          - errors.ERR_INSUFFICIENT_STOCK
          - errors.ERR_INSUFFICIENT_POINTS
        distinguishing_aspect: |
          The RedemptionOrder entity's SUBMITTED->CONFIRMED transition depends on TWO separate sibling-entity states: (i) MallItem.stock >= quantity (entity pair RedemptionOrder↔MallItem); (ii) Household.points_balance >= total_cost_points (entity pair RedemptionOrder↔Household). The pairs differ from instance 1's pairs (Disposal↔Resident / Disposal↔PointRule), exercising a second pair of cross-entity dependencies.
        test_recipe:
          setup:
            - "Community c, household h1 with points_balance=50 (insufficient)"
            - "MallItem m: cost_points=100, stock=10 (sufficient)"
            - "POST redemption-order quantity=1 -> Order o, SUBMITTED, total_cost_points=100"
          trigger:
            - "POST /communities/{c}/redemption-orders/{o}/confirm"
          assert:
            - "HTTP 409 with error_id == 'ERR_INSUFFICIENT_POINTS'  # stock OK, points fail"
            - "Order.status remains SUBMITTED"
            - "After topping up points_balance to >=100: confirm succeeds, Order.status == CONFIRMED"

  # =========================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: point_rule_active_window_no_overlap_per_category
        grounds:
          - state_machines.PointRule.DRAFT_to_ACTIVE
          - state_machines.PointRule.ACTIVE_to_RETIRED
          - entities.PointRule.fields.activated_at
          - entities.PointRule.fields.retired_at
          - entities.PointRule.fields.status
          - errors.ERR_RULE_ALREADY_ACTIVE
        distinguishing_aspect: |
          PointRule active-window semantics: each rule occupies a half-open time interval [activated_at, retired_at) on the resource axis (community_id, category). At any instant, AT MOST ONE rule per (community_id, category) may have status=ACTIVE; the geometric treatment is "active state acts as a current-time-pointed predicate, not a stored interval", so the conflict is detected at activate time rather than at create time. Trying to activate rule B while rule A is ACTIVE for the same (community_id, category) yields ERR_RULE_ALREADY_ACTIVE. The resource is PointRule. Distinct interval semantics from instance 2 below (which uses stored half-open windows with contiguity).
        test_recipe:
          setup:
            - "Community c"
            - "POST point-rule pr_A (category=RECYCLABLE, ...) -> DRAFT"
            - "POST .../pr_A/activate at t0 -> ACTIVE"
            - "POST point-rule pr_B (category=RECYCLABLE, different rates) -> DRAFT"
          trigger:
            - "POST /communities/{c}/point-rules/{pr_B}/activate at t1 > t0 (without retiring pr_A first)"
          assert:
            - "HTTP 409 with error_id == 'ERR_RULE_ALREADY_ACTIVE'"
            - "After POST .../pr_A/retire: activating pr_B succeeds"

      - name: ranking_period_no_overlap_contiguous_per_dimension
        grounds:
          - entities.RankingPeriod.fields.window_start
          - entities.RankingPeriod.fields.window_end
          - entities.RankingPeriod.fields.granularity
          - entities.RankingPeriod.fields.dimension
          - validations[priority=18]
          - errors.ERR_RANKING_PERIOD_OVERLAP
        distinguishing_aspect: |
          RankingPeriod window semantics: each period occupies a stored half-open interval [window_start, window_end) on the resource axis (community_id, granularity, dimension). Geometry: WEEKLY and MONTHLY periods MUST be contiguous (next.window_start == prev.window_end) with no gap; YEARLY is overlap-only. Overlap detection uses half-open arithmetic — period A=[d0, d7), period B=[d6, d13) overlaps because d7 > d6 AND d0 < d13. This is a DIFFERENT interval geometry from instance 1 (which had no stored interval at all — instead a current-state predicate); the resource is RankingPeriod, different from PointRule.
        test_recipe:
          setup:
            - "Community c"
            - "POST ranking-period p_A (granularity=WEEKLY, dimension=HOUSEHOLD, window=[d0, d7))"
          trigger:
            - "POST ranking-period p_B (granularity=WEEKLY, dimension=HOUSEHOLD, window=[d6, d13))  # overlaps"
            - "POST ranking-period p_C (granularity=WEEKLY, dimension=HOUSEHOLD, window=[d8, d15))  # non-contiguous (gap d7..d8)"
          assert:
            - "p_B creation returns HTTP 409 with error_id == 'ERR_RANKING_PERIOD_OVERLAP'"
            - "p_C creation returns HTTP 409 with error_id == 'ERR_RANKING_PERIOD_OVERLAP'  # contiguity required"
            - "POST ranking-period p_D (window=[d7, d14)) succeeds (exactly contiguous, no overlap)"

  # =========================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: redemption_return_balance_plus_open_redemptions_invariant
        grounds:
          - state_machines.RedemptionOrder.SUBMITTED_to_CONFIRMED
          - state_machines.RedemptionOrder.FULFILLED_to_RETURNED
          - entities.Household.fields.points_balance
          - entities.RedemptionOrder.fields.total_cost_points
          - entities.PointsTransaction.fields.kind
        distinguishing_aspect: |
          Conserved quantity Q1 = Household.points_balance + sum(RedemptionOrder.total_cost_points for orders with status IN {CONFIRMED, FULFILLED}). On confirm: balance decreases by total_cost_points, sum increases by total_cost_points -> Q1 unchanged. On return (FULFILLED -> RETURNED): balance increases by total_cost_points, sum decreases by total_cost_points (because RETURNED is NOT in {CONFIRMED, FULFILLED}) -> Q1 unchanged. The compensating pair (confirm, return) leaves Q1 invariant. The conserved quantity is *points + in-flight-redemption-points* — a redemption-balance reserve.
        test_recipe:
          setup:
            - "Community c, h1 with initial points_balance=200"
            - "MallItem m: cost_points=50, stock=10"
            - "POST redemption-order quantity=2 (total_cost_points=100) -> SUBMITTED"
            - "Snapshot Q1_before_confirm = balance(200) + sum_in_flight(0) = 200"
          trigger:
            - "POST .../confirm -> CONFIRMED. Snapshot Q1_after_confirm = balance + sum_in_flight"
            - "POST .../fulfill -> FULFILLED. Snapshot Q1_after_fulfill = balance + sum_in_flight"
            - "POST .../return -> RETURNED. Snapshot Q1_after_return = balance + sum_in_flight"
          assert:
            - "Q1_after_confirm == 100 + 100 == 200 == Q1_before_confirm"
            - "Q1_after_fulfill == 100 + 100 == 200"
            - "Q1_after_return == 200 + 0 == 200 == Q1_before_confirm  # invariant holds across confirm+return pair"

      - name: violation_overturn_lifetime_disposal_points_invariant
        grounds:
          - state_machines.Violation.NEW_to_APPEALED
          - state_machines.Violation.UNDER_REVIEW_to_OVERTURNED
          - entities.Household.fields.lifetime_points_earned
          - calculations.violation_deduction
          - entities.PointsTransaction.fields.kind
        distinguishing_aspect: |
          Conserved quantity Q2 = Household.lifetime_points_earned (cumulative positive points earned from disposals only, NOT touched by violations or redemptions). Violations do NOT change lifetime_points_earned (deduction lives on points_balance only). Therefore, the lifecycle (NEW -> APPEALED -> UNDER_REVIEW -> OVERTURNED) MUST leave lifetime_points_earned unchanged from its pre-violation value. This is a different conserved quantity from Q1 above — Q1 is a balance-reserve sum (mutable across operations), Q2 is a monotonic earnings ledger that violations cannot decrement.
        test_recipe:
          setup:
            - "Community c, h1, verified ACTIVE r1"
            - "Active PointRule pr (RECYCLABLE base_rate_per_kg=10, daily_cap=10000)"
            - "POST 3 disposals each weight_kg=2.0 MANUAL accuracy=1.0 (awarded=20 each) -> lifetime_points_earned=60, points_balance=60"
            - "Snapshot Q2_before = lifetime_points_earned == 60"
            - "POST violation v (MIS_SORTING) -> final_deduction=20, points_balance=40, lifetime_points_earned unchanged at 60"
          trigger:
            - "Resident appeals v"
            - "AppealReviewer accept-review -> UNDER_REVIEW"
            - "AppealReviewer decide OVERTURN -> OVERTURNED"
          assert:
            - "Household.lifetime_points_earned == 60 == Q2_before  # invariant: violation lifecycle never touches this quantity"
            - "Household.points_balance == 60  # back to pre-violation balance because deduction reversed"
            - "PointsTransaction stream contains: 3x DISPOSAL_CREDIT(+20), 1x VIOLATION_DEBIT(-20), 1x VIOLATION_REVERSAL(+20)"
