              as: BranchTeller
              as_user_id: "u-teller-1"
            - call: "POST /exchange-transactions/${txn_id}/settle"
              payload: {}
              as: BranchTeller
              as_user_id: "u-teller-1"
          trigger:
            - call: "POST /exchange-transactions/${txn_id}/reverse"
              payload: { reversal_reason: "teller keyed the wrong denomination mix" }
              as: BranchManager
              as_user_id: "u-mgr-1"
          assert:
            - "immediately after the settle and before the reversal: InventoryPosition.${pos_id}.total_minor_units == 251000 and usd_equivalent_cents == 272826 and Branch.${br_id}.vault_utilization_bps == 136"
            - "after the reversal: InventoryPosition.${pos_id}.total_minor_units == 270000, byte-equal to ${total_before}"
            - "after the reversal: InventoryPosition.${pos_id}.usd_equivalent_cents == 293478, byte-equal to ${usd_before}"
            - "after the reversal: denomination_mix available_note_count is 20 for 10000, 10 for 5000 and 10 for 2000 - the per-denomination breakdown is restored, not just the total"
            - "after the reversal: Branch.${br_id}.vault_usd_equivalent_cents == 293478 and vault_utilization_bps == 147 and posture == OPEN"
            - "after the reversal: ExchangeTransaction.${txn_id}.settlement_status == REVERSED and reversed_at is the logical clock"
            - "after the reversal: Customer.${cust_id}.rolling_30d_settled_usd_cents == 0 and structuring_risk_score == 0 and structuring_risk_tier == NORMAL"
