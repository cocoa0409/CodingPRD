            - "Crew.${crew_id}.booked_minutes == 0"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_resale_below_reserve
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_LOT_NOT_SELLABLE]
        distinguishing_aspect: |
          A second sale on an already-SOLD lot whose current (day-3) markdown price 2500 is below its
          reserve 5000 violates both the state rule (priority 6) and the fiscal reserve rule (priority 10);
          the lower-priority state error ERR_LOT_NOT_SELLABLE is returned, not ERR_BELOW_RESERVE.
        test_recipe:
          setup:
            - "Lot list 10000 reserve 5000 sold on day 1 (price 7500); clock advanced to day 3 where markdown price would be 2500 (< reserve); lot is SOLD"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /estate/clients", payload: { name: "Io Owner", phone: "555-0188" }, as: PlatformAdmin, captures: { cli_id: "$.data.id" } }
            - { call: "POST /estate/projects", payload: { client_id: "${cli_id}", address: "9 Vine St", estimated_total_value_cents: 100000 }, as: PlatformAdmin, captures: { proj_id: "$.data.id" } }
