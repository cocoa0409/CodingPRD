            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 400000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s}", quantity: 600, opening_cost_basis_cents: 480000 }, as: Advisor, captures: { pos: $.data.id } }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { pv: $.data.version } }
            - { call: "POST /advisory/rebalance-proposals", payload: { portfolio_id: "${p}", trigger_type: MANUAL, expected_portfolio_version: "${pv}" }, as: Advisor, captures: { prop: $.data.id, tb: $.data.total_buys_cents, ts: $.data.total_sells_cents } }
          trigger:
            - { call: "GET /advisory/trade-instructions", payload: { proposal_id: "${prop}" }, as: Advisor, captures: { rows: $.data } }
            - { call: "POST /advisory/rebalance-proposals/${prop}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/rebalance-proposals/${prop}/execute", as: Advisor, captures: { st: $.data.status } }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { tot: $.data.total_value_cents } }
          assert:
            - "total_buys_cents == 0 and total_sells_cents == 0 and len(${rows}) == 0 (empty trade list)"
            - "approve succeeds (scan over zero trades blocks nothing); execute succeeds -> EXECUTED"
            - "total_value_cents == 1000000 unchanged; Position.${pos} quantity 600 basis 480000 unchanged"
      - name: tax_aware_model_excludes_no_trade_restricted_lots
        claim_type: input_set_filtering
        grounds:
          - "calculations.withdrawal_impact_model"
          - "entities.RestrictedListEntry.fields.restriction_level"
        distinguishing_aspect: "TAX_AWARE skips lots under an ACTIVE NO_TRADE restriction even when they carry the best (most negative) gain-per-unit: the loss lot LOT3 is excluded, so the plan sells LOT1 x50 instead (proceeds 50000, tax 1000)."
        test_recipe:
          setup: ["P3 fixture; ACTIVE NO_TRADE restriction on EIB [2026-08-01, 2026-09-01); W TAX_AWARE 150000"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Restr", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 60.00, band_pct: 5.00 }, { asset_class: INTL_EQUITY, target_pct: 20.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 20.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 100000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "EQA", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s1: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EQB", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s2: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "EIB", asset_class: INTL_EQUITY, initial_price_cents: 500 }, as: ComplianceOfficer, captures: { s3: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s1}", quantity: 100, opening_cost_basis_cents: 90000 }, as: Advisor, captures: { lot1: $.data.id } }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s2}", quantity: 100, opening_cost_basis_cents: 40000 }, as: Advisor }
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "${s3}", quantity: 200, opening_cost_basis_cents: 110000 }, as: Advisor }
            - { call: "POST /advisory/restricted-list-entries", payload: { security_id: "${s3}", restriction_level: NO_TRADE, effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: 150000, funding_mode: TAX_AWARE }, as: Advisor, captures: { w: $.data.id } }
          trigger:
            - { call: "POST /advisory/withdrawal-requests/${w}/model-impact", as: Advisor, captures: { pr: $.data.modeled_proceeds_cents, tx: $.data.modeled_tax_cost_cents } }
          assert:
            - "modeled_plan == exactly 1 lot: position ${lot1} (EQA) quantity 50 est_proceeds_cents 50000 — the EIB loss lot is EXCLUDED despite lowest gain-per-unit"
            - "modeled_proceeds_cents == 50000 and modeled_tax_cost_cents == 1000 (relief 45000, gain 5000, 20%)"
      - name: buy_selector_price_rank_then_created_at_tiebreak
        claim_type: correct_result
        grounds:
          - "calculations.rebalance_trade_generation"
        distinguishing_aspect: "BUY security selection: rank by price_cents ASC, tie-break created_at ASC, empty pool -> cash absorbs. Three same-class candidates pin both rules across two generations."
        test_recipe:
          setup: ["portfolio cash 100000 only; targets US 50.00/5.00 + CASH 50.00/5.00 (US 0% -> BREACHED); US securities: BUZ @1000 created first, BQY @1000 created second, BQX @1000 created third"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Sel", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: US_EQUITY, target_pct: 50.00, band_pct: 5.00 }, { asset_class: CASH_EQUIVALENT, target_pct: 50.00, band_pct: 5.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P", tax_status: TAX_DEFERRED }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios/${p}/cash-movements", payload: { direction: DEPOSIT, amount_cents: 100000, occurred_at: "2026-08-01T00:00:00Z" }, as: Advisor }
            - { call: "POST /advisory/securities", payload: { ticker: "BUZ", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { sz: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "BQY", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { sy: $.data.id } }
            - { call: "POST /advisory/securities", payload: { ticker: "BQX", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { sx: $.data.id } }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { pv1: $.data.version } }
            - { call: "POST /advisory/rebalance-proposals", payload: { portfolio_id: "${p}", trigger_type: DRIFT_BREACH, expected_portfolio_version: "${pv1}" }, as: Advisor, captures: { g1: $.data.id } }
            - { call: "GET /advisory/trade-instructions", payload: { proposal_id: "${g1}" }, as: Advisor, captures: { t1sec: "$.data[0].security_id", t1q: "$.data[0].quantity" } }
          trigger:
            - { call: "POST /advisory/securities/${sy}/reprice", payload: { new_price_cents: 900 }, as: ComplianceOfficer }
            - { call: "GET /advisory/portfolios/${p}", as: Advisor, captures: { pv2: $.data.version } }
            - { call: "POST /advisory/rebalance-proposals", payload: { portfolio_id: "${p}", trigger_type: DRIFT_BREACH, expected_portfolio_version: "${pv2}" }, as: Advisor, captures: { g2: $.data.id } }
            - { call: "GET /advisory/trade-instructions", payload: { proposal_id: "${g2}" }, as: Advisor, captures: { t2sec: "$.data[0].security_id", t2q: "$.data[0].quantity" } }
          assert:
            - "generation 1 (all candidates @1000, tie): BUY security_id == ${sz} (BUZ, earliest created_at), quantity == 50 (floor(50000/1000))"
            - "generation 2 after BQY repriced to 900: BUY security_id == ${sy} (cheapest), quantity == 55 (floor(50000/900)); G1 EXPIRED via supersede"
            - "no BUY is emitted for the CASH_EQUIVALENT class in either generation (cash sleeve absorbs)"
      - name: drift_band_boundary_difficulty
        claim_type: correct_result
        grounds:
          - "calculations.drift_assessment"
        excluded_because:
          difficulty_instance: drift_band_equality_is_not_a_breach
          rationale: "Strict-> band boundary with bps rounding asserted there."
      - name: withdrawal_variant_math_difficulty
        claim_type: variant_divergence
        grounds:
          - "calculations.withdrawal_impact_model"
        excluded_because:
          difficulty_instance: withdrawal_pro_rata_vs_tax_aware_divergence
          rationale: "Both variants computed and asserted with literals there."
      - name: performance_variant_math_difficulty
        claim_type: variant_divergence
        grounds:
          - "calculations.performance_return"
        excluded_because:
          difficulty_instance: performance_twr_vs_dietz_divergence
          rationale: "TWR 413 vs Dietz 417 asserted there."
      - name: rebalance_rounding_and_waterfall_difficulty
        claim_type: precision
        grounds:
          - "calculations.rebalance_trade_generation"
          - "calculations.rebalance_cash_waterfall"
        excluded_because:
          difficulty_instance: rebalance_per_line_tax_rounding_mode_b
          rationale: "Per-line rounding order (1003 vs 1002) and waterfall trim are asserted in rebalance_per_line_tax_rounding_mode_b and rebalance_waterfall_pinned_eval_order_mode_c."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: shape_validation_fires_before_path_existence
        claim_type: priority_ordering
        grounds:
          - "validations[priority=4]"
          - "validations[priority=5]"
        distinguishing_aspect: "A request violating shape (new_price_cents 0) AND existence (random security id) returns the shape error first: 400 ERR_INVALID_REQUEST, not 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /advisory/securities/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/reprice", payload: { new_price_cents: 0 }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "http 400 ERR_INVALID_REQUEST (priority 4 shape) — not ERR_NOT_FOUND (priority 5)"
      - name: body_foreign_key_reference_must_exist
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_INVALID_REFERENCE]"
        distinguishing_aspect: "A well-formed body referencing a non-existent security_id (position create) or benchmark_id (IPS create) yields 422 ERR_INVALID_REFERENCE, not 404 and not 400."
        test_recipe:
          setup: ["ACTIVE client with ACTIVE IPS (CASH 100/50); ACTIVE portfolio; ACTIVE client2 without IPS"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Ref", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: CASH_EQUIVALENT, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/portfolios/${p}/activate", as: Advisor }
          trigger:
            - { call: "POST /advisory/positions", payload: { portfolio_id: "${p}", security_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", quantity: 1, opening_cost_basis_cents: 100 }, as: Advisor, captures: { err1: $.data.error_id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", objective_text: "Y", risk_tolerance_score: 50 }, as: Advisor, captures: { err2: $.data.error_id } }
          assert:
            - "both calls: http 422 ERR_INVALID_REFERENCE"
      - name: withdrawal_amount_must_be_positive
        claim_type: violation_to_error
        grounds:
          - "validations[priority=4]"
          - "entities.WithdrawalRequest.fields.amount_cents"
        distinguishing_aspect: "amount_cents 0 or negative is rejected 400 at creation; amount 1 cent is accepted."
        test_recipe:
          setup: ["ACTIVE client; portfolio exists (creation of a withdrawal is not gated on portfolio lifecycle)"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "Amt", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P", tax_status: TAXABLE }, as: Advisor, captures: { p: $.data.id } }
          trigger:
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: 0, funding_mode: PRO_RATA }, as: Advisor, captures: { err0: $.data.error_id } }
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: -5, funding_mode: PRO_RATA }, as: Advisor, captures: { errn: $.data.error_id } }
            - { call: "POST /advisory/withdrawal-requests", payload: { portfolio_id: "${p}", amount_cents: 1, funding_mode: PRO_RATA }, as: Advisor, captures: { st: $.data.status } }
          assert:
            - "0 and -5: http 400 ERR_INVALID_REQUEST"
            - "1 cent: 201, status SUBMITTED"
      - name: date_range_validation_across_three_endpoints
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_INVALID_DATE_RANGE]"
        distinguishing_aspect: "effective_from >= effective_to (restriction create), period_start > period_end (report create), and terminating an already-EXPIRED entry all map to ERR_INVALID_DATE_RANGE."
        test_recipe:
          setup: ["security; client+portfolio+benchmark for the report case; one restriction entry entirely in the past (EXPIRED at default clock 2026-08-01)"]
          setup_api_calls:
            - { call: "POST /advisory/securities", payload: { ticker: "EQR", asset_class: US_EQUITY, initial_price_cents: 1000 }, as: ComplianceOfficer, captures: { s: $.data.id } }
            - { call: "POST /advisory/restricted-list-entries", payload: { security_id: "${s}", restriction_level: NO_BUY, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-07-31T00:00:00Z" }, as: ComplianceOfficer, captures: { rl: $.data.id } }
            - { call: "POST /advisory/clients", payload: { full_name: "DR", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/portfolios", payload: { client_id: "${c}", name: "P", tax_status: TAX_EXEMPT }, as: Advisor, captures: { p: $.data.id } }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
          trigger:
            - { call: "POST /advisory/restricted-list-entries", payload: { security_id: "${s}", restriction_level: NO_BUY, effective_from: "2026-09-10T00:00:00Z", effective_to: "2026-09-10T00:00:00Z" }, as: ComplianceOfficer, captures: { err1: $.data.error_id } }
            - { call: "POST /advisory/performance-reports", payload: { portfolio_id: "${p}", benchmark_id: "${b}", period_start: "2026-08-31", period_end: "2026-08-01", calculation_method: TIME_WEIGHTED, beginning_value_cents: 0, ending_value_cents: 0, benchmark_return_bps: 0 }, as: Advisor, captures: { err2: $.data.error_id } }
            - { call: "POST /advisory/restricted-list-entries/${rl}/terminate", as: ComplianceOfficer, captures: { err3: $.data.error_id } }
          assert:
            - "empty half-open window (from == to): 422 ERR_INVALID_DATE_RANGE"
            - "report with period_start > period_end: 422 ERR_INVALID_DATE_RANGE"
            - "terminate of already-EXPIRED entry: 422 ERR_INVALID_DATE_RANGE"
      - name: amendment_requires_at_least_one_change_lever
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_AMENDMENT_EMPTY_CHANGES]"
        distinguishing_aspect: "Creating an amendment with zero proposed_* levers is 422 ERR_AMENDMENT_EMPTY_CHANGES."
        test_recipe:
          setup: ["ACTIVE client with ACTIVE IPS"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "AE", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: CASH_EQUIVALENT, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
          trigger:
            - { call: "POST /advisory/ips-amendments", payload: { ips_id: "${i}" }, as: Advisor, as_user_id: "adv-1", captures: { err: $.data.error_id } }
          assert:
            - "http 422 ERR_AMENDMENT_EMPTY_CHANGES"
      - name: duplicate_vote_rejected_and_count_stable
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_DUPLICATE_VOTE]"
        distinguishing_aspect: "A second vote by the same voter_user_id on the same amendment is 422 ERR_DUPLICATE_VOTE; approve_votes stays 1."
        test_recipe:
          setup: ["ACTIVE IPS; amendment SUBMITTED; one APPROVE vote by cm-1 recorded"]
          setup_api_calls:
            - { call: "POST /advisory/clients", payload: { full_name: "DV", risk_tolerance_score: 50 }, as: Advisor, captures: { c: $.data.id } }
            - { call: "POST /advisory/clients/${c}/activate", as: Advisor }
            - { call: "POST /advisory/benchmarks", payload: { name: "Bench" }, as: ComplianceOfficer, captures: { b: $.data.id } }
            - { call: "POST /advisory/ips-policies", payload: { client_id: "${c}", benchmark_id: "${b}", objective_text: "X", risk_tolerance_score: 50 }, as: Advisor, captures: { i: $.data.id } }
            - { call: "PUT /advisory/ips-policies/${i}/allocation-targets", payload: { targets: [ { asset_class: CASH_EQUIVALENT, target_pct: 100.00, band_pct: 50.00 } ] }, as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/submit", as: Advisor }
            - { call: "POST /advisory/ips-policies/${i}/compliance-approve", as: ComplianceOfficer }
            - { call: "POST /advisory/ips-policies/${i}/client-sign", as: Client, as_user_id: "${c}" }
            - { call: "POST /advisory/ips-amendments", payload: { ips_id: "${i}", proposed_objective_text: "New" }, as: Advisor, as_user_id: "adv-1", captures: { am: $.data.id } }
            - { call: "POST /advisory/ips-amendments/${am}/submit", as: Advisor, as_user_id: "adv-1" }
            - { call: "POST /advisory/ips-amendments/${am}/vote", payload: { decision: APPROVE }, as: CommitteeMember, as_user_id: "cm-1" }
          trigger:
            - { call: "POST /advisory/ips-amendments/${am}/vote", payload: { decision: REJECT }, as: CommitteeMember, as_user_id: "cm-1", captures: { err: $.data.error_id } }
          assert:
            - "second vote by cm-1 (even with a different decision): 422 ERR_DUPLICATE_VOTE"
            - "approve_votes == 1, reject_votes == 0, status == SUBMITTED"
      - name: proposer_cannot_vote_on_own_amendment
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_SOD_SELF_VOTE]"
        distinguishing_aspect: "Segregation of duties: the amendment's proposed_by_user_id may not vote — even wearing the CommitteeMember role; 422 ERR_SOD_SELF_VOTE and no vote recorded."
        test_recipe:
          setup: ["ACTIVE IPS; amendment created by adv-1 and SUBMITTED"]
