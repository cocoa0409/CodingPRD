          setup:
            - "A COMMERCIAL payer and account ES9 with a 12000-cent PATIENT-attributed credit refunded through batch B-ES9 issued 2026-08-20 (gross 12000, fee 280, net 11720) with payee_state_code CA."
            - "The aging sweep at 2027-02-16 moved the check to STALE, and an EscheatmentRecord with basis ISSUE_DATE was opened, giving escheat_due_at 2029-08-19 and due_diligence_open_at 2029-04-21."
