      - name: excluded_cascading_validation_down_a_recomputation_chain
        claim_type: Cascading validation
        excluded_because:
          difficulty_instance: collection_cascades_erosion_to_reinstatement_premium_to_cedent_exposure
          rationale: |
            The Cascading validation claim — one write re-validating and recomputing a chain of
            dependent aggregates, each hop bound by its own rule — is asserted by §1.8 rule 4, where a
            settled CLAIM_COLLECTION erodes Layer.limit_eroded_minor, triggers the reinstatement
            premium booking and lands on Cedent.outstanding_reinstatement_premium_minor, with the
            collectible ceiling re-checked at every hop.

  - section: endpoints
    instances:
      - name: layer_create_read_update_round_trip_and_the_update_window_closing
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST /programs/{program_id}/layers
          - endpoints.GET /layers/{layer_id}
          - endpoints.PATCH /layers/{layer_id}
          - endpoints.GET /layers
          - endpoints.GET /programs/{program_id}/layers
          - validations[priority=24]
          - calculations.layer_technical_premium.trigger
        distinguishing_aspect: |
          Layer is the only entity in the domain with an update endpoint, and the update window is
          narrow: PATCH is legal while the layer is OPEN and the program is DRAFT **or**
          SUBMISSION_READY, it re-prices quoted_gross_premium_minor on every accepted edit, and it
          slams shut the instant the layer is offered to a market. There is no DELETE anywhere in
          §1.5 — structures are abandoned by withdrawing the program, never removed — so the CRUD
          round trip is Create / Read / Update / List with no Delete leg.
        test_recipe:
          setup:
            - "A DRAFT program with a CATASTROPHE layer (base_rate 8.0000 -> quoted_gross_premium_minor 97125000) and a QUOTA_SHARE layer."
