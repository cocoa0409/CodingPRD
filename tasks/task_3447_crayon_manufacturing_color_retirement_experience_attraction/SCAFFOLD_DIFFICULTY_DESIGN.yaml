              payload: { action: ADVANCE, packed_counts: [{ color_id: "${c_id}", count: 1000 }] }
              as: PlatformAdmin
          assert:
            - "the over-tolerance advance landed in ON_HOLD (${hold_stage} == ON_HOLD) with stage_before_hold == PACKING and hold_reason == QUALITY"
            - "at the hold, packing_penalty_cents == 169 (round_half_up(6 * 18.75 * 1.5)) and packing_variance_units == 6"
            - "the inventory-lots GET issued at the hold returned 0 rows (no lot is created for a held run)"
            - "after RESUME and the corrected advance: stage == COMPLETED, packing_penalty_cents == 0 (recomputed), boxes_produced == 125, waste_units == 0"
            - "GET /crayon-works/production-runs/${r1_id}/inventory-lots then shows exactly 1 lot, AVAILABLE, boxes_received == 125, boxes_on_hand == 125"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: batch_retro_rejection_cascades_recall_runs_lots_allocations_lines
        grounds:
          - state_machines.PigmentBatch.CERTIFIED_to_REJECTED
          - state_machines.ProductionRun.COMPLETED_to_QUARANTINED
          - state_machines.RetailAllocation.COMMITTED_to_SHORTED
          - state_machines.LicensedLine.APPROVED_to_SUSPENDED
          - state_machines.RecallCase
          - calculations.recall_severity_classification
        distinguishing_aspect: "Depth-4 cascade triggered by certification-decision REJECT: batch -> RecallCase (link 1) -> ProductionRun QUARANTINED (link 2) -> InventoryLot QUARANTINED (link 3) -> COMMITTED RetailAllocation SHORTED (link 4); a fifth branch suspends the APPROVED LicensedLine off the run hop. Severity pins CLASS_II at exactly 1000 affected units."
