        claim_type: role_denial
        grounds: [roles.PlatformAdmin, roles.Radiologist, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Radiologist is not in POST /hospitals roles: even an authenticated entity-backed radiologist gets ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["one radiologist exists"]
          setup_api_calls:
            - { call: "POST /telerad/radiologists", payload: { full_name: "RB Rad", subspecialties: ["BODY"], license_states: ["CA"] }, as: PlatformAdmin, captures: { rad: $.data.id } }
          trigger:
            - { call: "POST /telerad/hospitals", payload: { name: "Nope Hosp", state_code: "CA" }, as: Radiologist, as_user_id: "${rad}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED; http 403"

      - name: hospital_user_cannot_create_study_for_other_hospital
        claim_type: role_denial
        grounds: [roles.ClientHospitalUser, "validations[priority=2]", "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Ownership binding: a ClientHospitalUser whose X-User-ID is hospital h1 cannot create a study naming hospital h2 (ERR_UNAUTHORIZED fires at priority 2, before state checks)."
        test_recipe:
          setup: ["hospitals h1 and h2 exist"]
          setup_api_calls:
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp H1", state_code: "CA" }, as: PlatformAdmin, captures: { h1: $.data.id } }
            - { call: "POST /telerad/hospitals", payload: { name: "Hosp H2", state_code: "TX" }, as: PlatformAdmin, captures: { h2: $.data.id } }
          trigger:
            - { call: "POST /telerad/studies", payload: { hospital_id: "${h2}", accession_number: "ACC-XH", modality: "CT", body_part_group: "NEURO", priority: "ROUTINE", patient_ref: "XH" }, as: ClientHospitalUser, as_user_id: "${h1}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED; http 403; no study created"

      - name: radiologist_cannot_accept_others_assignment
        claim_type: role_denial
        grounds: [roles.Radiologist, state_machines.Study.ASSIGNED_to_IN_PROGRESS, "errors[ERR_UNAUTHORIZED]"]
