  - rule_id: cross_entity_state_dependency
    instances:
      - name: authorize_requires_pssr_approved
        grounds:
          - state_machines.MocRequest.IMPLEMENTED_PSSR_PENDING_to_STARTUP_AUTHORIZED
          - state_machines.Pssr.IN_FIELD_to_APPROVED
          - errors[ERR_PSSR_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair MocRequest × Pssr: authorize-startup is gated on a DIFFERENT entity's
          state — a linked Pssr must be APPROVED. The same request fails with
          ERR_PSSR_NOT_APPROVED before the PSSR approve, and succeeds after it.
        test_recipe:
          setup:
            - "Unit U (NORMAL), study CURRENT; REQ/REV(CHEMICAL)/APP/LEAD(PSSR_CERTIFIED) exist"
            - "PERMANENT MOC M at IMPLEMENTED_PSSR_PENDING with full training coverage (1 published update, 1 completed assignment)"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/pha-studies", payload: { method: "HAZOP", initial_validated_at: "2026-04-01" }, as: PsmManager }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Rev", employee_ref: "E-REV", qualifications: ["CHEMICAL"] }, as: PsmAdmin, captures: { rev_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "App", employee_ref: "E-APP" }, as: PsmAdmin, captures: { app_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Lead", employee_ref: "E-LEAD", qualifications: ["PSSR_CERTIFIED"] }, as: PsmAdmin, captures: { lead_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/moc-requests", payload: { title: "M", description: "d", discipline: "CHEMICAL" }, as: Requester, as_user_id: "${req_id}", captures: { m_id: $.data.id } }
            - { call: "POST /psm/moc-requests/${m_id}/classify", payload: { change_class: "PERMANENT", screening_severity: 2, screening_likelihood: 2 }, as: PsmManager }
            - { call: "POST /psm/moc-requests/${m_id}/submit", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "GET /psm/moc-requests/${m_id}/technical-reviews", as: PsmManager, captures: { r_id: "$.data[0].id" } }
            - { call: "POST /psm/technical-reviews/${r_id}/submit-verdict", payload: { design_basis_ok: true, codes_standards_ok: true, relief_systems_ok: true, materials_compat_ok: true, severity_score: 2, likelihood_score: 2, detection_score: 1, verdict: "ACCEPT" }, as: TechnicalReviewer, as_user_id: "${rev_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/approve", payload: {}, as: OpsApprover, as_user_id: "${app_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/procedure-updates", payload: { document_ref: "SOP-1" }, as: TrainingCoordinator, captures: { pu: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pu}/training-assignments", payload: { personnel_id: "${req_id}" }, as: TrainingCoordinator, captures: { ta: $.data.id } }
            - { call: "POST /psm/procedure-updates/${pu}/publish", payload: {}, as: TrainingCoordinator }
            - { call: "POST /psm/training-assignments/${ta}/complete", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/mark-implemented", payload: {}, as: Requester, as_user_id: "${req_id}" }
          trigger:
            - { call: "POST /psm/moc-requests/${m_id}/authorize-startup", payload: {}, as: PsmManager, captures: { err1: $.data.error_id } }
            - { call: "GET /psm/moc-requests/${m_id}", as: PsmManager, captures: { v1: $.data.version } }
            - { call: "POST /psm/moc-requests/${m_id}/pssrs", payload: { field_window_start: "2026-05-01", field_window_end: "2026-05-05", expected_moc_version: "${v1}" }, as: PssrLead, as_user_id: "${lead_id}", captures: { p_id: $.data.id } }
            - { call: "POST /psm/pssrs/${p_id}/begin-fieldwork", payload: {}, as: PssrLead, as_user_id: "${lead_id}" }
            - { call: "POST /psm/pssrs/${p_id}/approve", payload: {}, as: PssrLead, as_user_id: "${lead_id}" }
            - { call: "POST /psm/moc-requests/${m_id}/authorize-startup", payload: {}, as: PsmManager }
          assert:
            - "First authorize rejected: error_id == ERR_PSSR_NOT_APPROVED (no APPROVED Pssr existed)"
            - "After Pssr.${p_id}.status == APPROVED: second authorize succeeds; MocRequest.${m_id}.status == STARTUP_AUTHORIZED"

      - name: audit_close_requires_corrective_closure
        grounds:
          - state_machines.Audit.REPORTED_to_CLOSED
          - state_machines.AuditFinding.ACTION_ASSIGNED_to_CLOSED
          - state_machines.ActionItem.SUBMITTED_FOR_VERIFICATION_to_VERIFIED_CLOSED
          - errors[ERR_AUDIT_OPEN_FINDINGS]
        distinguishing_aspect: |
          Entity pair Audit × ActionItem (different pair than MOC×PSSR): audit close is
          gated on child findings, whose closure is itself gated on the corrective
          ActionItem reaching VERIFIED_CLOSED — a two-level cross-entity dependency.
        test_recipe:
          setup:
            - "Unit U; REQ (assignee), AUD (lead) exist"
            - "Audit AU with one MINOR_NC finding F whose corrective ActionItem CA (P2) is OPEN"
          setup_api_calls:
            - { call: "POST /psm/units", payload: { name: "U", unit_code: "U1", pha_cycle_months: 12 }, as: PsmAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Req", employee_ref: "E-REQ" }, as: PsmAdmin, captures: { req_id: $.data.id } }
            - { call: "POST /psm/personnel", payload: { full_name: "Aud", employee_ref: "E-AUD" }, as: PsmAdmin, captures: { aud_id: $.data.id } }
            - { call: "POST /psm/units/${u_id}/audits", payload: { title: "au", lead_auditor_id: "${aud_id}", field_window_start: "2026-05-01", field_window_end: "2026-05-10" }, as: PsmManager, captures: { au_id: $.data.id } }
            - { call: "POST /psm/audits/${au_id}/begin-fieldwork", payload: {}, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "POST /psm/audits/${au_id}/report", payload: { findings: [{ title: "f", severity: "MINOR_NC", assignee_id: "${req_id}" }] }, as: Auditor, as_user_id: "${aud_id}" }
            - { call: "GET /psm/audits/${au_id}/findings", as: PsmManager, captures: { f_id: "$.data[0].id", ca_id: "$.data[0].corrective_action_id" } }
          trigger:
            - { call: "POST /psm/audits/${au_id}/close", payload: {}, as: PsmManager, captures: { err: $.data.error_id } }
            - { call: "POST /psm/action-items/${ca_id}/start", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "POST /psm/action-items/${ca_id}/evidence-items", payload: { file_ref: "s3://ev/fix.pdf", description: "Fix report" }, as: Requester, as_user_id: "${req_id}" }
            - { call: "POST /psm/action-items/${ca_id}/submit-verification", payload: {}, as: Requester, as_user_id: "${req_id}" }
            - { call: "POST /psm/action-items/${ca_id}/verify", payload: {}, as: PsmManager }
            - { call: "POST /psm/audits/${au_id}/close", payload: {}, as: PsmManager }
          assert:
            - "First close rejected: error_id == ERR_AUDIT_OPEN_FINDINGS (open_finding_count == 1)"
            - "After corrective item verified: AuditFinding.${f_id}.status == CLOSED (bubble-up) and Audit.${au_id}.open_finding_count == 0"
            - "Second close succeeds: Audit.${au_id}.status == CLOSED"

  - rule_id: resource_temporal_overlap
