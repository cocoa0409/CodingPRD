  # ===========================================================================
  # SECTION 9 — CONSISTENCY MODEL (immediate: every derived field a write
  # touches is already correct in that write's own response body)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: dispatch_response_shows_audience_and_quota_in_the_same_response
        claim_type: immediate
        grounds:
          - endpoints[POST /cdp/activations/{activationId}/dispatch]
          - calculations.activation_audience_resolution
          - entities.Destination.fields.remaining_daily_hash_quota
        distinguishing_aspect: "The dispatch response is already fully reconciled: candidate_count, audience_size, suppressed_count and dispatched_hash_count are present in the very body that performed the write, and an immediate read of the destination shows the quota already decremented — nothing lags behind a second call."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem and one PROMOTED batch of two fully valid records at postal_code 10001, one with an EMAIL/MARKETING OPT_IN and one with an EMAIL/MARKETING OPT_OUT, so the segment has two candidates and one activatable member."
            - "One ACTIVE EMAIL Destination (daily_hash_quota 300, min_audience_size 1, min_match_rate 0.10) and one APPROVED Segment with a DRAFT Activation."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DataPlatformAdmin
              as_user_id: "u_admin"
            - call: "POST /cdp/source-systems"
              payload:
                code: "CM_IMMED"
                display_name: "Immediate Consistency Feed"
                channel_type: "TRANSACTIONS"
                trust_tier: 3
              as: DataPlatformAdmin
              as_user_id: "u_admin"
              captures: { src_id: "$.data.id" }
            - call: "POST /cdp/ingest-batches"
              payload:
                source_system_id: "${src_id}"
                batch_label: "Immediate Consistency Pair"
                records:
