            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
          trigger:
            - call: "POST /cosmetics/facilities/${fac_id}/inspections"
              payload: { inspection_type: "GMP_ROUTINE", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-05T00:00:00Z" }
