# =============================================================================
# Task: task_3275_small_business_accounting_subscription_payroll_add_advisor
# §1.0–§1.7 scaffold. §1.8 / §1.9 live in sibling files.
# =============================================================================

scenario: |
  Small Business Accounting Subscription, Payroll Add-On & Advisor Channel
  (Intuit QuickBooks): subscription tiers gating features such as inventory,
  project profitability and user counts with upgrade prompts, payroll add-on
  with tax filing service levels and per-employee pricing, bank feed
  connections with transaction categorization rules and reconciliation
  workflows, accountant and advisor channel where professionals manage client
  subscriptions with wholesale discount billing, client data file access,
  permission levels and transfer of billing between accountant and client,
  migration from desktop to online products with data conversion limitations,
  application ecosystem integrations with data sync conflicts, subscription
  cancellation with read-only data access and export obligations.

domain_name: small-business-accounting
api_prefix: /api

# =============================================================================
# §0 Complexity Profile — Expert+ band, pushed for max difficulty
# =============================================================================
complexity_profile:
  primary_archetype: access_control_matrix    # advisor channel, billing transfer, permission levels
  secondary_archetype: pricing_engine         # tiered subscription + payroll per-employee + wholesale discount
  complexity_layers:
    - optimistic_concurrency                  # OCC on Subscription.version for plan-change / billing transfer
    - cascading_side_effects                  # cancel → suspend children → revoke grants → lock recon
    - dual_variant_calculation                # MRR provisional vs final, reconciliation delta projected vs locked
    - conditional_feature_flags               # tier feature gating on SubscriptionPlan.feature_flags
    - rate_threshold_triggers                 # user-seat boundary, payroll employee tier boundaries
    - derived_field_reconciliation            # Reconciliation.difference_cents recomputed from txns

  entity_topology: hybrid                     # companies subtree + flat advisor channel + cross-cutting
  state_machine_shape: cyclic                 # Subscription has ACTIVE->SUSPENDED->ACTIVE cycle and
                                              # CANCELLED_READ_ONLY -> REACTIVATED loop; BillingTransfer
                                              # cycles through accept/decline; BankTransaction has
                                              # CATEGORIZED <-> UNCATEGORIZED; parallel dims on
                                              # Subscription (billing_status x lifecycle_status)
  relationship_patterns:
    - one_to_many
    - many_to_many                            # AccessGrant bridges AccountantUser <-> ClientCompany
    - cross_aggregate                         # BillingTransfer references both firm-owned and client-owned billing
    - polymorphic                             # Invoice.billing_owner: FIRM | CLIENT, price source switches
  role_model: delegated_authority             # client grants/revokes accountant access; firm grants to staff
  consistency_model: immediate                # all mutations atomic per request

  entity_count_target: 14
  endpoint_count_target: 55
  error_code_count_target: 30

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AccountantFirm
    parent: null
    common_fields: true
    fields:
      - { name: firm_name, type: string, source: input, description: "Display name of the practice" }
      - { name: wholesale_discount_pct, type: number, source: input, description: "Wholesale billing discount, e.g. 0.30 = 30% off list; range 0..0.50", constraints: "0 <= value <= 0.50, two-decimal precision" }
      - { name: proadvisor_tier, type: enum, source: input, description: "SILVER | GOLD | PLATINUM — drives maximum wholesale_discount_pct ceiling (0.20/0.35/0.50)", constraints: "SILVER | GOLD | PLATINUM" }
      - { name: firm_status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED", constraints: "ACTIVE | SUSPENDED | CLOSED" }

  - name: AccountantUser
    parent: AccountantFirm
    common_fields: true
    fields:
      - { name: firm_id, type: string, source: input, description: "FK -> AccountantFirm.id; owning firm" }
      - { name: full_name, type: string, source: input, description: "Advisor's name" }
      - { name: email, type: string, source: input, description: "Login email; unique within firm" }
      - { name: is_firm_admin, type: boolean, source: input, description: "Firm admin can invite/remove other users and manage billing transfer", default: false }
      - { name: user_status, type: enum, source: system, description: "ACTIVE | DISABLED", constraints: "ACTIVE | DISABLED" }

  - name: ClientCompany
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal entity name" }
      - { name: admin_email, type: string, source: input, description: "Primary admin contact" }
      - { name: home_country, type: string, source: input, description: "ISO 3166-1 alpha-2 country code; used for tax behavior", constraints: "2 uppercase letters" }
      - { name: data_region, type: enum, source: input, description: "US | EU | UK — drives export format", constraints: "US | EU | UK" }
      - { name: company_status, type: enum, source: system, description: "ACTIVE | READ_ONLY | PURGED", constraints: "ACTIVE | READ_ONLY | PURGED" }
      - { name: primary_admin_user_id, type: string, source: system, description: "FK -> CompanyUser.id of the primary admin (set on first user create)" }

  - name: CompanyUser
    parent: ClientCompany
    common_fields: true
    fields:
      - { name: company_id, type: string, source: input, description: "FK -> ClientCompany.id" }
      - { name: email, type: string, source: input, description: "Login email; unique within company" }
      - { name: display_name, type: string, source: input, description: "Human name" }
      - { name: permission_level, type: enum, source: input, description: "PRIMARY_ADMIN | COMPANY_ADMIN | STANDARD | REPORTS_ONLY | TIME_TRACKING", constraints: "PRIMARY_ADMIN | COMPANY_ADMIN | STANDARD | REPORTS_ONLY | TIME_TRACKING" }
      - { name: user_status, type: enum, source: system, description: "INVITED | ACTIVE | DISABLED", constraints: "INVITED | ACTIVE | DISABLED" }

