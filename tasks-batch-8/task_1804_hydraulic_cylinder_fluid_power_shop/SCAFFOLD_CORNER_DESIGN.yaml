            - { call: "POST /fluid-power/work-orders", payload: { cylinder_id: "${cyl_id}", tier: "STANDARD", promised_hours: 96, complaint: "leak" }, as: ServiceAdvisor, captures: { wo_id: "$.data.id" } }
            - { call: "POST /fluid-power/inventory-items", payload: { material: "CHROME_ROD", diameter_mm: 45, length_mm: 800, cost_per_mm_cents: 42 }, as: ShopAdmin, captures: { item_a: "$.data.id" } }
            - { call: "POST /fluid-power/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:01Z" }, as: ShopAdmin }
            - { call: "POST /fluid-power/inventory-items", payload: { material: "CHROME_ROD", diameter_mm: 45, length_mm: 800, cost_per_mm_cents: 42 }, as: ShopAdmin, captures: { item_b: "$.data.id" } }
          trigger:
            - { call: "POST /fluid-power/stock-reservations", payload: { work_order_id: "${wo_id}", material: "CHROME_ROD", diameter_mm: 45, cut_length_mm: 497 }, as: ServiceAdvisor, captures: { res1: "$.data.id", res1_scrap: "$.data.scrap_length_mm", res1_item: "$.data.inventory_item_id" } }
            - { call: "POST /fluid-power/stock-reservations", payload: { work_order_id: "${wo_id}", material: "CHROME_ROD", diameter_mm: 45, cut_length_mm: 498 }, as: ServiceAdvisor, captures: { res2: "$.data.id", res2_scrap: "$.data.scrap_length_mm", res2_charge: "$.data.scrap_charge_cents", res2_item: "$.data.inventory_item_id" } }
          assert:
            - "reservation 1 (cut 497, required 500) drew on ${item_a}: item A length_mm == 300, status AVAILABLE, scrap_length_mm == 0"
            - "reservation 2 (cut 498, required 501) drew on ${item_b}: remnant 299 < 300 => item B length_mm == 0, status DEPLETED"
            - "StockReservation.${res2}.scrap_length_mm == 299 and scrap_charge_cents == 12558  # 299 x 42"
            - "tie-break note: item A and B have equal length; A was created first (created_at ASC) so reservation 1 takes A"

