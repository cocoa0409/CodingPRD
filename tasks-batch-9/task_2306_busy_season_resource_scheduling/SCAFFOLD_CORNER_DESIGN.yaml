# =============================================================================
# §1.9 Scaffold Corner Design — task_2306 busy-season resource scheduling
#
# Breadth probe: a row-by-row walk of references/claim-extraction-guide.md
# against this scaffold's §1.1-§1.7 surface. Sections and claim_type values are
# taken from that guide only. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:` stubs.
#
# Clock convention (identical to §1.8): the logical clock starts at
# 2026-08-01T00:00:00Z (Saturday, ISO week 2026-07-27) and every chain sets it
# explicitly through POST /scheduling/_clock/set_current_utc.
# Mondays used as ISO week starts: 2026-07-27, 2026-08-03, 2026-08-10,
# 2026-08-17, 2026-08-24, 2026-08-31, 2026-09-07.
#
# Standing fixture arithmetic reused below (calculations.effective_weekly_cap):
#   with no prior-week logged hours the tier is GREEN -> TIER_MULTIPLIER 1.25,
#   so base_weekly_cap_hours 40.00 -> effective 50.00 -> daily capacity 10.00,
#   and base 45.00 -> effective 56.25 -> daily capacity 11.25.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Guide section 1 — Entities
  # ===========================================================================
  - section: entities
    instances:

      - name: client_creation_pie_sets_rotation_limit_five
        claim_type: creation
        grounds:
          - entities.Client.fields.public_interest_entity
          - entities.Client.fields.partner_rotation_limit_years
          - entities.Client.fields.engagement_count
          - endpoints[POST /scheduling/clients]
        distinguishing_aspect: |
          A client created with public_interest_entity true reports
          partner_rotation_limit_years 5 (ROTATION_LIMIT_PIE), not the standard 7, in the
          201 body itself — the limit is computed at creation, not at engagement time.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /scheduling/clients"
              payload: { name: "Aurora Federal Bancorp", industry_code: "FINANCIAL_SERVICES", public_interest_entity: true, fiscal_year_end: "2026-12-31" }
              as: FirmAdmin
          assert:
            - "HTTP 201"
            - "response.data.name == 'Aurora Federal Bancorp'"
            - "response.data.industry_code == 'FINANCIAL_SERVICES'"
            - "response.data.public_interest_entity == true"
            - "response.data.fiscal_year_end == '2026-12-31'"
            - "response.data.partner_rotation_limit_years == 5"
            - "response.data.engagement_count == 0"
            - "response.data.version == 1"

      - name: client_omitted_public_interest_entity_defaults_false_with_limit_seven
        claim_type: defaults
        grounds:
          - entities.Client.fields.public_interest_entity
          - entities.Client.fields.partner_rotation_limit_years
          - endpoints[POST /scheduling/clients]
        distinguishing_aspect: |
          Omitting the optional public_interest_entity input stores false and flips the
          computed partner_rotation_limit_years to 7 (ROTATION_LIMIT_STANDARD), proving the
          default is applied before the rotation limit is derived.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /scheduling/clients"
              payload: { name: "Meridian Manufacturing", industry_code: "MANUFACTURING", fiscal_year_end: "2026-12-31" }
              as: FirmAdmin
          assert:
            - "HTTP 201"
            - "response.data.public_interest_entity == false"
            - "response.data.partner_rotation_limit_years == 7"
            - "response.data.engagement_count == 0"

      - name: staff_member_computed_capacity_fields_derived_on_creation
        claim_type: computed_fields
        grounds:
          - entities.StaffMember.fields.review_capable
          - entities.StaffMember.fields.effective_weekly_cap_hours
          - entities.StaffMember.fields.daily_capacity_hours
          - entities.StaffMember.fields.workload_status
          - entities.StaffMember.fields.turnover_risk_band
          - calculations.effective_weekly_cap
          - calculations.staff_daily_capacity
        distinguishing_aspect: |
          A brand-new DOMESTIC MANAGER with base_weekly_cap_hours 45.00 and no history is
          already carrying the GREEN tier multiplier 1.25: effective_weekly_cap_hours
          56.25 and daily_capacity_hours 11.25 (56.25 / STANDARD_WORK_DAYS_PER_WEEK 5),
          with both burnout scores 0.00 and turnover_risk_band LOW.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-03T09:00:00Z (Monday, current ISO week 2026-08-03)."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Dana Whitfield", level: "MANAGER", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 45.00, hourly_bill_rate: 260.00 }
              as: FirmAdmin
          assert:
            - "HTTP 201"
            - "response.data.review_capable == true"
            - "response.data.committed_hours_current_week == 0.00"
            - "response.data.effective_weekly_cap_hours == 56.25"
            - "response.data.daily_capacity_hours == 11.25"
            - "response.data.workload_status == 'GREEN'"
            - "response.data.burnout_risk_score_actual == 0.00"
            - "response.data.burnout_risk_score_committed == 0.00"
            - "response.data.turnover_risk_band == 'LOW'"

      - name: offshore_manager_computed_review_capable_false
        claim_type: computed_fields
        grounds:
          - entities.StaffMember.fields.review_capable
          - entities.StaffMember.fields.service_center
          - validations[priority=22]
        distinguishing_aspect: |
          review_capable is a conjunction, not a level test: an OFFSHORE MANAGER — senior
          enough by level — still reports review_capable false because service_center is
          not DOMESTIC, while effective_weekly_cap_hours 50.00 is unaffected.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Ravi Menon", level: "MANAGER", service_center: "OFFSHORE", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 40.00, hourly_bill_rate: 95.00 }
              as: FirmAdmin
          assert:
            - "HTTP 201"
            - "response.data.level == 'MANAGER'"
            - "response.data.service_center == 'OFFSHORE'"
            - "response.data.review_capable == false"
            - "response.data.effective_weekly_cap_hours == 50.00"
            - "response.data.daily_capacity_hours == 10.00"

      - name: staff_member_system_fields_generated_on_creation
        claim_type: system_fields
        grounds:
          - entities.StaffMember
          - endpoints[POST /scheduling/staff-members]
          - endpoints[GET /scheduling/staff-members/{staff_member_id}]
        distinguishing_aspect: |
          The server mints id, created_at, updated_at and version 1 for a StaffMember: the
          creation body carries none of them, yet an immediate GET by the returned id
          replays the same row with version still 1 (no write has occurred since).
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Sam Oyelaran", level: "SENIOR", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 40.00, hourly_bill_rate: 180.00 }
              as: FirmAdmin
              captures: { s1_id: $.data.id }
          trigger:
            - call: "GET /scheduling/staff-members/${s1_id}"
              payload: {}
              as: FirmAdmin
          assert:
            - "HTTP 200"
            - "response.data.id == ${s1_id} (a server-generated UUID, not supplied by the caller)"
            - "response.data.version == 1"
            - "response.data.created_at is a non-null ISO-8601 timestamp"
            - "response.data.updated_at is a non-null ISO-8601 timestamp"
            - "response.data.full_name == 'Sam Oyelaran'"
            - "response.data.base_weekly_cap_hours == 40.00"

      - name: engagement_retrieval_returns_initial_status_and_derived_bands
        claim_type: retrieval
        grounds:
          - entities.Engagement.fields.status
          - entities.Engagement.fields.pre_block_status
          - entities.Engagement.fields.staffing_completion_pct
          - entities.Engagement.fields.schedule_risk_band
          - calculations.engagement_schedule_risk
          - endpoints[GET /scheduling/engagements/{engagement_id}]
        distinguishing_aspect: |
          A freshly created engagement with no phases reads back staffing_completion_pct
          0.00 yet schedule_risk_band LOW, because days_to_deadline is 73 (2026-08-03 ->
          2026-10-15) — above both HIGH_DAYS 30 and MEDIUM_DAYS 60 — so neither
          completion branch can fire.
        test_recipe:
          setup:
            - "Logical clock 2026-08-03T09:00:00Z; client MERIDIAN (MANUFACTURING, non-PIE); DOMESTIC partner P1."
            - "Engagement E1 created with deadline 2026-10-15 and budget_fee_amount 6000.00; no phases exist."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /scheduling/clients"
              payload: { name: "Meridian Manufacturing", industry_code: "MANUFACTURING", public_interest_entity: false, fiscal_year_end: "2026-12-31" }
              as: FirmAdmin
              captures: { c_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Pat Rowe", level: "PARTNER", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 45.00, hourly_bill_rate: 400.00 }
              as: FirmAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2026, deadline_date: "2026-10-15", budget_fee_amount: 6000.00 }
              as: SchedulingManager
              captures: { e1_id: $.data.id }
          trigger:
            - call: "GET /scheduling/engagements/${e1_id}"
              payload: {}
              as: EngagementPartner
              as_user_id: "${p1_id}"
          assert:
            - "HTTP 200"
            - "response.data.status == 'SETUP'"
            - "response.data.pre_block_status == null"
            - "response.data.client_block_count == 0"
            - "response.data.scope_change_count == 0"
            - "response.data.staffing_completion_pct == 0.00"
            - "response.data.schedule_risk_band == 'LOW'"
            - "response.data.realization_pct_provisional == 0.00"
            - "response.data.realization_pct_final == 0.00"
            - "response.data.version == 1"

      - name: assignment_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /scheduling/assignments]
          - validations[priority=7]
        distinguishing_aspect: |
          Three bookings on one phase, read with limit 2: the first page returns exactly 2
          rows with total_count 3 and has_more true, and offset 2 returns the remaining 1
          row with has_more false — total_count counts the filtered set, not the page.
        test_recipe:
          setup:
            - "Logical clock 2026-08-03T09:00:00Z; MERIDIAN client, DOMESTIC partner P1, DOMESTIC senior S1 (base cap 40.00 -> daily capacity 10.00)."
            - "Engagement E1 (deadline 2026-10-15) with phase PH1 FIELDWORK expecting 45.00 hours in 2026-08-03..2026-08-31, requires SENIOR + MANUFACTURING + CPA."
            - "Three PROPOSED bookings of S1 on PH1, each 5.00 hours over a 5-day half-open window (daily_hours 1.00), so PH1 is PARTIALLY_STAFFED at 15.00 staffed hours."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /scheduling/clients"
              payload: { name: "Meridian Manufacturing", industry_code: "MANUFACTURING", public_interest_entity: false, fiscal_year_end: "2026-12-31" }
              as: FirmAdmin
              captures: { c_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Pat Rowe", level: "PARTNER", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 45.00, hourly_bill_rate: 400.00 }
              as: FirmAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Sam Oyelaran", level: "SENIOR", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 40.00, hourly_bill_rate: 180.00 }
              as: FirmAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2026, deadline_date: "2026-10-15", budget_fee_amount: 6000.00 }
              as: SchedulingManager
              captures: { e1_id: $.data.id }
            - call: "POST /scheduling/engagement-phases"
              payload: { engagement_id: "${e1_id}", phase_type: "FIELDWORK", expected_hours: 45.00, window_start_date: "2026-08-03", window_end_date: "2026-08-31", required_level: "SENIOR", required_industry_specialization: "MANUFACTURING", requires_cpa_licensed: true }
              as: SchedulingManager
              captures: { ph1_id: $.data.id }
            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "${ph1_id}", staff_member_id: "${s1_id}", start_date: "2026-08-03", end_date: "2026-08-08", allocated_hours: 5.00 }
              as: SchedulingManager
              captures: { a1_id: $.data.id }
            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "${ph1_id}", staff_member_id: "${s1_id}", start_date: "2026-08-10", end_date: "2026-08-15", allocated_hours: 5.00 }
              as: SchedulingManager
              captures: { a2_id: $.data.id }
            - call: "POST /scheduling/assignments"
              payload: { engagement_phase_id: "${ph1_id}", staff_member_id: "${s1_id}", start_date: "2026-08-17", end_date: "2026-08-22", allocated_hours: 5.00 }
              as: SchedulingManager
              captures: { a3_id: $.data.id }
          trigger:
            - call: "GET /scheduling/assignments?engagement_phase_id=${ph1_id}&limit=2&offset=0"
              payload: {}
              as: SchedulingManager
            - call: "GET /scheduling/assignments?engagement_phase_id=${ph1_id}&limit=2&offset=2"
              payload: {}
              as: SchedulingManager
          assert:
            - "first trigger: HTTP 200, response.data.total_count == 3, response.data.limit == 2, response.data.offset == 0, response.data.has_more == true, and exactly 2 Assignment rows are returned"
            - "second trigger: HTTP 200, response.data.total_count == 3, response.data.offset == 2, response.data.has_more == false, and exactly 1 Assignment row is returned"
            - "every returned row has engagement_phase_id == ${ph1_id}, staffing_status == 'PROPOSED', allocated_hours == 5.00 and daily_hours == 1.00"

      - name: unknown_ids_return_entity_specific_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_CLIENT_NOT_FOUND]
          - errors[ERR_STAFF_MEMBER_NOT_FOUND]
          - errors[ERR_ENGAGEMENT_NOT_FOUND]
          - errors[ERR_PHASE_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_RESTRICTION_NOT_FOUND]
          - errors[ERR_REVIEW_WINDOW_NOT_FOUND]
          - errors[ERR_RESCHEDULE_PLAN_NOT_FOUND]
          - errors[ERR_WAIVER_NOT_FOUND]
        distinguishing_aspect: |
          Priority 4 resolves the path id against the specific entity type of the route, so
          the same syntactically valid but unknown UUID produces nine DIFFERENT error_ids
          across the nine GET-by-id routes — never a single generic ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty database except the clock; the UUID 00000000-0000-0000-0000-0000000000ff exists in no table."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "GET /scheduling/clients/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: FirmAdmin
              captures: { err_client: $.data.error_id }
            - call: "GET /scheduling/staff-members/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: FirmAdmin
              captures: { err_staff: $.data.error_id }
            - call: "GET /scheduling/engagements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: FirmAdmin
              captures: { err_engagement: $.data.error_id }
            - call: "GET /scheduling/engagement-phases/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: FirmAdmin
              captures: { err_phase: $.data.error_id }
            - call: "GET /scheduling/assignments/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: FirmAdmin
              captures: { err_assignment: $.data.error_id }
            - call: "GET /scheduling/independence-restrictions/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: FirmAdmin
              captures: { err_restriction: $.data.error_id }
            - call: "GET /scheduling/review-capacity-windows/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: FirmAdmin
              captures: { err_window: $.data.error_id }
            - call: "GET /scheduling/reschedule-plans/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: FirmAdmin
              captures: { err_plan: $.data.error_id }
            - call: "GET /scheduling/workload-waivers/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: FirmAdmin
              captures: { err_waiver: $.data.error_id }
          assert:
            - "every one of the nine triggers returns HTTP 404"
            - "${err_client} == 'ERR_CLIENT_NOT_FOUND'"
            - "${err_staff} == 'ERR_STAFF_MEMBER_NOT_FOUND'"
            - "${err_engagement} == 'ERR_ENGAGEMENT_NOT_FOUND'"
            - "${err_phase} == 'ERR_PHASE_NOT_FOUND'"
            - "${err_assignment} == 'ERR_ASSIGNMENT_NOT_FOUND'"
            - "${err_restriction} == 'ERR_RESTRICTION_NOT_FOUND'"
            - "${err_window} == 'ERR_REVIEW_WINDOW_NOT_FOUND'"
            - "${err_plan} == 'ERR_RESCHEDULE_PLAN_NOT_FOUND'"
            - "${err_waiver} == 'ERR_WAIVER_NOT_FOUND'"

      - name: engagement_create_missing_required_budget_fee_amount_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /scheduling/engagements]
        distinguishing_aspect: |
          budget_fee_amount has source input with no default, so omitting it fails at
          priority 6 with ERR_INVALID_REQUEST and no Engagement row is created — the
          client's engagement_count stays 0.
        test_recipe:
          setup:
            - "Logical clock 2026-08-03T09:00:00Z; MERIDIAN client and DOMESTIC partner P1 exist."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /scheduling/clients"
              payload: { name: "Meridian Manufacturing", industry_code: "MANUFACTURING", public_interest_entity: false, fiscal_year_end: "2026-12-31" }
              as: FirmAdmin
              captures: { c_id: $.data.id }
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Pat Rowe", level: "PARTNER", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 45.00, hourly_bill_rate: 400.00 }
              as: FirmAdmin
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /scheduling/engagements"
              payload: { client_id: "${c_id}", engagement_partner_staff_id: "${p1_id}", service_line: "AUDIT", busy_season_year: 2026, deadline_date: "2026-10-15" }
              as: SchedulingManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err_id} == 'ERR_INVALID_REQUEST'"
            - "a follow-up GET /scheduling/clients/${c_id} as FirmAdmin still reports engagement_count == 0"

      - name: staff_member_create_with_undeclared_level_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.StaffMember.fields.level
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          'DIRECTOR' is not a declared member of StaffMember.level, so priority 6 rejects
          the creation with ERR_INVALID_REQUEST even though every other field is inside its
          range — enum membership is checked, not just presence and type.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FirmAdmin
          trigger:
            - call: "POST /scheduling/staff-members"
              payload: { full_name: "Jess Nakamura", level: "DIRECTOR", service_center: "DOMESTIC", industry_specialization: "MANUFACTURING", cpa_licensed: true, base_weekly_cap_hours: 40.00, hourly_bill_rate: 180.00 }
              as: FirmAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err_id} == 'ERR_INVALID_REQUEST'"
            - "a follow-up GET /scheduling/staff-members?level=SENIOR as FirmAdmin reports total_count == 0"

      - name: time_entry_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.TimeEntry
          - endpoints[POST /scheduling/time-entries]
          - endpoints[GET /scheduling/assignments/{id}/time-entries]
        distinguishing_aspect: |
          TimeEntry is declared common_fields false: the row read back through the
          sub-resource listing carries assignment_id, work_date, hours and entry_type but
          no version and no updated_at, and §1.5 declares no update or delete route for it.
        test_recipe:
          setup:
            - "Logical clock 2026-08-05T09:00:00Z; MERIDIAN client, partner P1, DOMESTIC senior S1 (base cap 40.00 -> daily capacity 10.00)."
            - "Engagement E1 with phase PH1 FIELDWORK 45.00 hours in 2026-08-03..2026-08-31; S1 booked 20.00 hours over [2026-08-03, 2026-08-10) (daily_hours 2.86) and driven to ACTIVE with PH1 IN_PROGRESS."
            - "S1 logs one 4.00-hour EXECUTION entry on 2026-08-04."
          setup_api_calls:
            - call: "POST /scheduling/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: FirmAdmin
            - call: "POST /scheduling/clients"
              payload: { name: "Meridian Manufacturing", industry_code: "MANUFACTURING", public_interest_entity: false, fiscal_year_end: "2026-12-31" }
              as: FirmAdmin
              captures: { c_id: $.data.id }
            - call: "POST /scheduling/staff-members"
