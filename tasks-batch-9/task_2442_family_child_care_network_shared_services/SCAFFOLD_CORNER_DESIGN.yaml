      - name: cyclic_shape_negotiation_loop_termination_condition
        claim_type: cyclic
        grounds:
          - state_machines.MembershipAgreement.COUNTERED_to_SENT
          - entities.MembershipAgreement.fields.round_index
        excluded_because:
          difficulty_instance: non_linear_state_machine / membership_agreement_negotiation_cycle_bounded_at_three_rounds
          rationale: "The SENT <-> COUNTERED loop and its round_index termination condition are the whole subject of the named §1.8 instance."

      - name: parallel_shape_independent_staffing_and_billing_dimensions
        claim_type: parallel
        grounds:
          - entities.SubstituteAssignment.fields.staffing_status
          - entities.SubstituteAssignment.fields.billing_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / substitute_assignment_parallel_status_dimensions_with_decline_reoffer_loop
          rationale: "The named §1.8 instance asserts that invoice moves billing_status while staffing_status stays COMPLETED."

      - name: guarded_transition_claim_submit_requires_active_contract
        claim_type: guarded transitions
        grounds:
          - validations[priority=10]
          - errors[ERR_CONTRACT_NOT_ACTIVE]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / remittance_post_blocked_while_referenced_contract_suspended_for_quality
          rationale: "The named §1.8 instance is exactly the cross-entity guard, asserted both as refusal and as success after the guard clears."

      - name: cascade_down_provider_probation_suspends_contracts
        claim_type: Cascade down
        grounds:
          - state_machines.Provider.ACTIVE_to_PROBATION
          - state_machines.SubsidyContract.ACTIVE_to_SUSPENDED_FOR_QUALITY
        excluded_because:
          difficulty_instance: transitive_cascade / quality_escalation_cascade_depth_four_review_provider_contract_claim_revenue
          rationale: "The named §1.8 instance walks the full four-hop downward cascade end to end."

      - name: cross_entity_enrollment_status_change_adjusts_contract_slots
        claim_type: Cross-entity
        grounds:
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
          - entities.SubsidyContract.fields.committed_slots
        excluded_because:
          difficulty_instance: transitive_cascade / enrollment_withdraw_cascade_depth_three_status_slot_release_revenue
          rationale: "The named §1.8 instance asserts the contract's committed_slots and available_slots before and after the enrollment's own status change."

      - name: ledger_sync_claim_state_change_updates_contract_claimed_amount
        claim_type: Ledger sync
        grounds:
          - entities.SubsidyContract.fields.claimed_amount_cents
          - state_machines.SubsidyClaim.SUBMITTED_to_REJECTED
        excluded_because:
          difficulty_instance: compensating_invariant / claim_rejection_conserves_contract_claimed_authorization_ledger
          rationale: "The named §1.8 instance reconciles the ancestor's derived claimed_amount_cents before and after each child state change."

      - name: compensation_remittance_reversal_undoes_every_allocation
        claim_type: Compensation
        grounds:
          - state_machines.Remittance.POSTED_to_REVERSED
        excluded_because:
          difficulty_instance: compensating_invariant / remittance_reversal_conserves_contract_remitted_cents_ledger
          rationale: "The named §1.8 instance asserts zero drift across the forward post and its compensating reversal."

  - section: Calculations
    instances:
      - name: substitute_selection_applies_all_three_ranking_keys_in_order
        claim_type: Correct Result
        grounds:
          - calculations.substitute_selection
          - entities.Substitute.fields.hourly_rate_cents
          - entities.Substitute.fields.assignment_count_completed
          - endpoints[POST /fccn/substitute-assignments]
        distinguishing_aspect: "With two substitutes tied at hourly_rate_cents 2200 and a third at 2500, the selector picks the earlier-created tied candidate first, then — once that one has assignment_count_completed 1 — picks the other tied candidate, and never picks the 2500 candidate."
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Provider P1 ACTIVE in county_tier STANDARD."
            - "Substitutes created in this order: S_B at 2200, S_C at 2200, S_A at 2500 — all serving STANDARD with credential_level NONE and clearance_expires_on 2026-12-31."
          setup_api_calls:
            - call: "POST /fccn/providers/apply"
              payload: { legal_name: "Alvarez Family Child Care", county_tier: "STANDARD", license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z", capacity_slots: 6 }
              as: Anonymous
              captures: { p1: $.data.id }
            - call: "POST /fccn/providers/${p1}/license-verification"
              payload: { license_number: "FCC-1001", license_expires_on: "2027-06-30T00:00:00Z" }
              as: NetworkAdmin
              captures: { pv1: $.data.version }
            - call: "POST /fccn/membership-agreements"
              payload: { provider_id: "${p1}", network_fee_pct: 6.0, shared_services: ["SUBSTITUTE_POOL"], effective_on: "2026-08-01T00:00:00Z", expected_provider_version: "${pv1}" }
              as: NetworkAdmin
              captures: { ag1: $.data.id }
            - call: "POST /fccn/membership-agreements/${ag1}/execute"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/substitutes"
              payload: { full_name: "Bea Ramirez", credential_level: "NONE", clearance_expires_on: "2026-12-31T00:00:00Z", hourly_rate_cents: 2200, service_county_tiers: ["STANDARD"] }
              as: NetworkAdmin
              captures: { s_b: $.data.id }
            - call: "POST /fccn/substitutes"
              payload: { full_name: "Cleo Danner", credential_level: "NONE", clearance_expires_on: "2026-12-31T00:00:00Z", hourly_rate_cents: 2200, service_county_tiers: ["STANDARD"] }
              as: NetworkAdmin
              captures: { s_c: $.data.id }
            - call: "POST /fccn/substitutes"
              payload: { full_name: "Ada Nkemelu", credential_level: "NONE", clearance_expires_on: "2026-12-31T00:00:00Z", hourly_rate_cents: 2500, service_county_tiers: ["STANDARD"] }
              as: NetworkAdmin
              captures: { s_a: $.data.id }
          trigger:
            - call: "POST /fccn/substitute-assignments"
              payload: { provider_id: "${p1}", start_at: "2026-08-05T08:00:00Z", end_at: "2026-08-05T12:00:00Z", reason: "ILLNESS", min_credential_level: "NONE" }
              as: Provider
              as_user_id: "${p1}"
              captures: { sa1: $.data.id, pick1: $.data.substitute_id }
            - call: "POST /fccn/substitute-assignments/${sa1}/accept"
              as: Substitute
              as_user_id: "${s_b}"
            - call: "POST /fccn/substitute-assignments/${sa1}/complete"
              as: Provider
              as_user_id: "${p1}"
            - call: "POST /fccn/substitute-assignments"
              payload: { provider_id: "${p1}", start_at: "2026-08-06T08:00:00Z", end_at: "2026-08-06T12:00:00Z", reason: "ILLNESS", min_credential_level: "NONE" }
              as: Provider
              as_user_id: "${p1}"
              captures: { sa2: $.data.id, pick2: $.data.substitute_id }
          assert:
            - "${pick1} == ${s_b} (cheapest tier, and created before ${s_c} on the created_at tiebreak)"
            - "Substitute.${s_b}.assignment_count_completed == 1 after the complete call"
            - "${pick2} == ${s_c} (still the cheapest tier, now preferred because ${s_b} has assignment_count_completed 1)"
            - "${pick1} != ${s_a} and ${pick2} != ${s_a} (the 2500 candidate is never selected while a 2200 candidate is available)"
            - "SubstituteAssignment.${sa2}.staffing_status == OFFERED"

      - name: quality_score_input_set_excludes_scheduled_visits
