              as: ComplianceAuditor
              as_user_id: "aud-1"
              captures: { audit_id: $.data.id }
            - call: "GET /trade-marketing/customers/${cust_id}"
              payload: {}
              as: ComplianceAuditor
              as_user_id: "aud-1"
          assert:
            - "ComplianceAudit.${audit_id}.status == SCHEDULED and .version == 1"
            - "ComplianceAudit.${audit_id}.findings_count == 0 and .recovery_claim_amount == 0.00 and .issued_at == null"
            - "Customer.${cust_id}.audit_status == AUDIT_IN_PROGRESS"
            - "Customer.${cust_id}.trading_status == ACTIVE and .compliance_penalty_points == 0 and .credit_hold_reason == null"

