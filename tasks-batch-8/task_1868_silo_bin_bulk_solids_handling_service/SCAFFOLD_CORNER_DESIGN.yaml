            - "ticket remains APPROVED"

      - name: sod_issuer_equals_entrant_rejected
        claim_type: violation_to_error
        grounds:
          - "state_machines.EntryPermit.DRAFT_to_ISSUED"
          - "errors[ERR_SOD_ISSUER_EQUALS_ENTRANT]"
        distinguishing_aspect: "Segregation of duties: a SafetyOfficer whose X-User-ID equals the entrant_technician_id cannot issue the permit (ERR_SOD_ISSUER_EQUALS_ENTRANT)."
        test_recipe:
          setup: ["Site, vessel, technician TTs; entry ticket APPROVED; permit in DRAFT naming TTs as entrant."]
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "SD Site", state_code: "IA" }
              as: ServiceManager
              captures: { ssd: $.data.id }
            - call: "POST /vessels"
