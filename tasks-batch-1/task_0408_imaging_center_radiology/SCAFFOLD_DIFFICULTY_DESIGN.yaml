# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Imaging Center & Radiology Workflow (RIS/PACS) — Expert tier
# 9 rules × ≥2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: rvu_first_signoff_vs_addendum_resign
        grounds:
          - calculations.rvu_credit
          - state_machines.ImagingExam.READ_COMPLETE_to_SIGNED_OFF
          - state_machines.RadiologyReport.FINAL_to_AMENDED
          - entities.Staff.fields.signed_rvu_total
        distinguishing_aspect: |
          Same exam/report inputs credit full RVU (amend_factor 1.0) on first sign-off but
          AMEND_FACTOR (0.5) on the addendum re-sign — the dual-variant subject is
          work-RVU accounting on the Staff/RadiologyReport domain.
        test_recipe:
          setup:
            - "Center C with one MRI modality (base_rvu 2.0, requires_prior_auth false), one MRI room, one technologist credentialed MRI, one radiologist credentialed MRI."
            - "An order (STAT, requires_contrast true) driven to SIGNED_OFF; report FINAL with rvu_credited 3.75 and radiologist signed_rvu_total 3.75."
            - "Center clock at 2026-06-01T09:40:00Z (sign-off time)."
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C", critical_ack_sla_minutes: 60, repeat_rate_threshold_pct: 8.0 }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { imaging_center_id: "${c_id}", to_iso8601: "2026-06-01T08:00:00Z" }
              as: CenterAdmin
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "MRI", name: "MRI 3T", base_rvu: 2.0, requires_prior_auth: false }
              as: CenterAdmin
              captures: { mri_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/rooms"
              payload: { modality_id: "${mri_id}", name: "MR-1" }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "TECHNOLOGIST", full_name: "T", credentialed_modalities: ["MRI"] }
              as: CenterAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "RADIOLOGIST", full_name: "R", credentialed_modalities: ["MRI"] }
              as: CenterAdmin
              captures: { rad_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${mri_id}", patient_mrn: "M1", ordering_provider_npi: "N1", priority: "STAT", requires_contrast: true }
              as: SchedulingClerk
              captures: { ord_id: $.data.id }
            - call: "POST /imaging-orders/${ord_id}/benefit-check"
              payload: {}
              as: SchedulingClerk
            - call: "POST /imaging-orders/${ord_id}/clear-screening"
              payload: {}
              as: Nurse
              as_user_id: "${rad_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /imaging-orders/${ord_id}/exams"
              payload: { room_id: "${room_id}", technologist_id: "${tech_id}", scheduled_start_utc: "2026-06-01T09:00:00Z", scheduled_end_utc: "2026-06-01T09:30:00Z", expected_imaging_order_version: "${ord_v}" }
              as: SchedulingClerk
              captures: { exam_id: $.data.id, exam_v: $.data.version }
            - call: "POST /imaging-exams/${exam_id}/check-in"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/start-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/image-series"
              payload: { series_label: "AX T2" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { ser_id: $.data.id }
            - call: "POST /image-series/${ser_id}/finalize"
              payload: { outcome: "ACCEPTED" }
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { imaging_center_id: "${c_id}", to_iso8601: "2026-06-01T09:00:00Z" }
              as: CenterAdmin
            - call: "POST /imaging-exams/${exam_id}/finish-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/claim-read"
              payload: { expected_imaging_exam_version: "${exam_v}" }
              as: Radiologist
              as_user_id: "${rad_id}"
              captures: { exam_v2: $.data.version }
            - call: "POST /imaging-exams/${exam_id}/reports"
              payload: { findings_text: "ok", has_critical_finding: false }
              as: Radiologist
              as_user_id: "${rad_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /radiology-reports/${rep_id}/finalize"
              payload: {}
              as: Radiologist
              as_user_id: "${rad_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { imaging_center_id: "${c_id}", to_iso8601: "2026-06-01T09:40:00Z" }
              as: CenterAdmin
            - call: "POST /imaging-exams/${exam_id}/sign-off"
              payload: {}
              as: Radiologist
              as_user_id: "${rad_id}"
          trigger:
            - call: "POST /imaging-orders/${ord_id}/request-addendum"
              payload: {}
              as: Radiologist
              as_user_id: "${rad_id}"
            - call: "POST /radiology-reports/${rep_id}/finalize"
              payload: {}
              as: Radiologist
              as_user_id: "${rad_id}"
          assert:
            - "Before trigger: RadiologyReport.${rep_id}.rvu_credited == 3.75 AND Staff.${rad_id}.signed_rvu_total == 3.75"
            - "After trigger: RadiologyReport.${rep_id}.status == AMENDED AND RadiologyReport.${rep_id}.rvu_credited == 1.88"
            - "After trigger: Staff.${rad_id}.signed_rvu_total == 1.88"

      - name: screening_contrast_vs_non_contrast_variant
        grounds:
          - calculations.screening_decision
          - state_machines.ContrastScreening.PENDING_to_CLEARED
          - state_machines.ContrastScreening.PENDING_to_BLOCKED
          - entities.ContrastScreening.fields.blocking_reason
        distinguishing_aspect: |
          Identical low egfr_value (29) and contrast-allergy inputs route to BLOCKED under the
          contrast variant but CLEARED under the non-contrast variant — the dual-variant subject
          is renal/allergy safety gating on the ContrastScreening domain, distinct from RVU accounting.
        test_recipe:
          setup:
            - "Center C with one MRI modality (requires_prior_auth false)."
            - "Order A requires_contrast true; Order B requires_contrast false. Both have a screening with egfr_value 29, has_contrast_allergy true, is_pregnant false, metal_implant_unsafe false."
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C" }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "MRI", name: "MRI", base_rvu: 2.0, requires_prior_auth: false }
              as: CenterAdmin
              captures: { mri_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "NURSE", full_name: "N", credentialed_modalities: ["MRI"] }
              as: CenterAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${mri_id}", patient_mrn: "MA", ordering_provider_npi: "N1", requires_contrast: true }
              as: SchedulingClerk
              captures: { ord_a: $.data.id }
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${mri_id}", patient_mrn: "MB", ordering_provider_npi: "N1", requires_contrast: false }
              as: SchedulingClerk
              captures: { ord_b: $.data.id }
            - call: "POST /imaging-orders/${ord_a}/contrast-screenings"
              payload: { egfr_value: 29, has_contrast_allergy: true, is_pregnant: false, metal_implant_unsafe: false }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { scr_a: $.data.id }
            - call: "POST /imaging-orders/${ord_b}/contrast-screenings"
              payload: { egfr_value: 29, has_contrast_allergy: true, is_pregnant: false, metal_implant_unsafe: false }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { scr_b: $.data.id }
          trigger:
            - call: "POST /contrast-screenings/${scr_a}/evaluate"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /contrast-screenings/${scr_b}/evaluate"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
          assert:
            - "ContrastScreening.${scr_a}.outcome == BLOCKED AND ContrastScreening.${scr_a}.blocking_reason == CONTRAST_ALLERGY"
            - "ContrastScreening.${scr_b}.outcome == CLEARED AND ContrastScreening.${scr_b}.blocking_reason == null"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: rvu_nonlinear_stat_contrast_interaction
        grounds:
          - calculations.rvu_credit
          - entities.Modality.fields.base_rvu
          - entities.ImagingOrder.fields.priority
          - entities.ImagingOrder.fields.requires_contrast
        distinguishing_aspect: |
          Mode (a): rvu = round((base_rvu * STAT_MULTIPLIER + CONTRAST_ADDON) * amend_factor, 2)
          has ≥3 inputs (base_rvu, priority, requires_contrast, amend state) with conditional
          branches and a tiered STAT multiplier; rounding applied ONCE to the final product.
        test_recipe:
          setup:
            - "Center C with one CT modality base_rvu 3.0 (requires_prior_auth false), CT room, tech+rad credentialed CT."
            - "Order STAT requires_contrast true driven to SIGNED_OFF; expected rvu = (3.0*1.5 + 0.75)*1.0 = 5.25."
            - "Center clock at 2026-06-01T09:40:00Z at sign-off."
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C", repeat_rate_threshold_pct: 8.0 }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { imaging_center_id: "${c_id}", to_iso8601: "2026-06-01T08:00:00Z" }
              as: CenterAdmin
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "CT", name: "CT", base_rvu: 3.0, requires_prior_auth: false }
              as: CenterAdmin
              captures: { ct_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/rooms"
              payload: { modality_id: "${ct_id}", name: "CT-1" }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "TECHNOLOGIST", full_name: "T", credentialed_modalities: ["CT"] }
              as: CenterAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "RADIOLOGIST", full_name: "R", credentialed_modalities: ["CT"] }
              as: CenterAdmin
              captures: { rad_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "NURSE", full_name: "N", credentialed_modalities: ["CT"] }
              as: CenterAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${ct_id}", patient_mrn: "M1", ordering_provider_npi: "N1", priority: "STAT", requires_contrast: true }
              as: SchedulingClerk
              captures: { ord_id: $.data.id }
            - call: "POST /imaging-orders/${ord_id}/benefit-check"
              payload: {}
              as: SchedulingClerk
            - call: "POST /imaging-orders/${ord_id}/contrast-screenings"
              payload: { egfr_value: 90, has_contrast_allergy: false, is_pregnant: false, metal_implant_unsafe: false }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { scr_id: $.data.id }
            - call: "POST /contrast-screenings/${scr_id}/evaluate"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /imaging-orders/${ord_id}/clear-screening"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /imaging-orders/${ord_id}/exams"
              payload: { room_id: "${room_id}", technologist_id: "${tech_id}", scheduled_start_utc: "2026-06-01T09:00:00Z", scheduled_end_utc: "2026-06-01T09:30:00Z", expected_imaging_order_version: "${ord_v}" }
              as: SchedulingClerk
              captures: { exam_id: $.data.id, exam_v: $.data.version }
            - call: "POST /imaging-exams/${exam_id}/check-in"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/start-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/image-series"
              payload: { series_label: "AX" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { ser_id: $.data.id }
            - call: "POST /image-series/${ser_id}/finalize"
              payload: { outcome: "ACCEPTED" }
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { imaging_center_id: "${c_id}", to_iso8601: "2026-06-01T09:00:00Z" }
              as: CenterAdmin
            - call: "POST /imaging-exams/${exam_id}/finish-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/claim-read"
              payload: { expected_imaging_exam_version: "${exam_v}" }
              as: Radiologist
              as_user_id: "${rad_id}"
            - call: "POST /imaging-exams/${exam_id}/reports"
              payload: { findings_text: "ok" }
              as: Radiologist
              as_user_id: "${rad_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /radiology-reports/${rep_id}/finalize"
              payload: {}
              as: Radiologist
              as_user_id: "${rad_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { imaging_center_id: "${c_id}", to_iso8601: "2026-06-01T09:40:00Z" }
              as: CenterAdmin
          trigger:
            - call: "POST /imaging-exams/${exam_id}/sign-off"
              payload: {}
              as: Radiologist
              as_user_id: "${rad_id}"
          assert:
            - "RadiologyReport.${rep_id}.rvu_credited == 5.25"
            - "Staff.${rad_id}.signed_rvu_total == 5.25"

      - name: screening_precedence_pregnancy_over_allergy_order
        grounds:
          - calculations.screening_decision
          - state_machines.ContrastScreening.PENDING_to_BLOCKED
          - entities.ContrastScreening.fields.blocking_reason
        distinguishing_aspect: |
          Mode (c): a multi-condition evaluation whose result depends on pinned precedence —
          pregnancy is checked before contrast-allergy, so a screening that trips BOTH pregnancy
          AND allergy reports blocking_reason PREGNANCY (not CONTRAST_ALLERGY); the order is fixed.
        test_recipe:
          setup:
            - "Center C, one CT modality (requires_prior_auth false), one nurse credentialed CT."
            - "Order requires_contrast true; screening is_pregnant true AND has_contrast_allergy true, egfr_value 10."
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C" }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "CT", name: "CT", base_rvu: 3.0, requires_prior_auth: false }
              as: CenterAdmin
              captures: { ct_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "NURSE", full_name: "N", credentialed_modalities: ["CT"] }
              as: CenterAdmin
              captures: { nurse_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${ct_id}", patient_mrn: "M1", ordering_provider_npi: "N1", requires_contrast: true }
              as: SchedulingClerk
              captures: { ord_id: $.data.id }
            - call: "POST /imaging-orders/${ord_id}/contrast-screenings"
              payload: { egfr_value: 10, has_contrast_allergy: true, is_pregnant: true, metal_implant_unsafe: false }
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { scr_id: $.data.id }
          trigger:
            - call: "POST /contrast-screenings/${scr_id}/evaluate"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
          assert:
            - "ContrastScreening.${scr_id}.outcome == BLOCKED"
            - "ContrastScreening.${scr_id}.blocking_reason == PREGNANCY"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: report_addendum_cycle_final_amended_loop
        grounds:
          - state_machines.RadiologyReport.FINAL_to_AMENDED
          - state_machines.ImagingOrder.SIGNED_OFF_to_ADDENDUM_REQUESTED
          - entities.RadiologyReport.fields.addendum_count
        distinguishing_aspect: |
          RadiologyReport is cyclic: FINAL -> (addendum reopen sets DRAFT, addendum_count+1) ->
          finalize -> AMENDED, and the loop can repeat (addendum_count reaches 2 on a second pass);
          this is a cycle, not a linear pipeline.
        test_recipe:
          setup:
            - "An order driven to SIGNED_OFF with report FINAL, addendum_count 0 (reuse the rvu_first_signoff_vs_addendum_resign setup chain through sign-off)."
            - "Center clock at 2026-06-01T09:40:00Z."
          setup_api_calls:
            - call: "POST /imaging-centers"
              payload: { name: "C", repeat_rate_threshold_pct: 8.0 }
              as: CenterAdmin
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { imaging_center_id: "${c_id}", to_iso8601: "2026-06-01T08:00:00Z" }
              as: CenterAdmin
            - call: "POST /imaging-centers/${c_id}/modalities"
              payload: { modality_type: "XRAY", name: "XR", base_rvu: 1.0, requires_prior_auth: false }
              as: CenterAdmin
              captures: { xr_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/rooms"
              payload: { modality_id: "${xr_id}", name: "XR-1" }
              as: CenterAdmin
              captures: { room_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "TECHNOLOGIST", full_name: "T", credentialed_modalities: ["XRAY"] }
              as: CenterAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/staff"
              payload: { staff_role: "RADIOLOGIST", full_name: "R", credentialed_modalities: ["XRAY"] }
              as: CenterAdmin
              captures: { rad_id: $.data.id }
            - call: "POST /imaging-centers/${c_id}/imaging-orders"
              payload: { modality_id: "${xr_id}", patient_mrn: "M1", ordering_provider_npi: "N1", priority: "ROUTINE", requires_contrast: false }
              as: SchedulingClerk
              captures: { ord_id: $.data.id }
            - call: "POST /imaging-orders/${ord_id}/benefit-check"
              payload: {}
              as: SchedulingClerk
            - call: "POST /imaging-orders/${ord_id}/clear-screening"
              payload: {}
              as: Nurse
              as_user_id: "${rad_id}"
              captures: { ord_v: $.data.version }
            - call: "POST /imaging-orders/${ord_id}/exams"
              payload: { room_id: "${room_id}", technologist_id: "${tech_id}", scheduled_start_utc: "2026-06-01T09:00:00Z", scheduled_end_utc: "2026-06-01T09:30:00Z", expected_imaging_order_version: "${ord_v}" }
              as: SchedulingClerk
              captures: { exam_id: $.data.id, exam_v: $.data.version }
            - call: "POST /imaging-exams/${exam_id}/check-in"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/start-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/image-series"
              payload: { series_label: "PA" }
              as: Technologist
              as_user_id: "${tech_id}"
              captures: { ser_id: $.data.id }
            - call: "POST /image-series/${ser_id}/finalize"
              payload: { outcome: "ACCEPTED" }
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { imaging_center_id: "${c_id}", to_iso8601: "2026-06-01T09:00:00Z" }
              as: CenterAdmin
            - call: "POST /imaging-exams/${exam_id}/finish-acquisition"
              payload: {}
              as: Technologist
              as_user_id: "${tech_id}"
            - call: "POST /imaging-exams/${exam_id}/claim-read"
              payload: { expected_imaging_exam_version: "${exam_v}" }
              as: Radiologist
              as_user_id: "${rad_id}"
            - call: "POST /imaging-exams/${exam_id}/reports"
              payload: { findings_text: "ok" }
              as: Radiologist
              as_user_id: "${rad_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /radiology-reports/${rep_id}/finalize"
              payload: {}
              as: Radiologist
              as_user_id: "${rad_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { imaging_center_id: "${c_id}", to_iso8601: "2026-06-01T09:40:00Z" }
              as: CenterAdmin
            - call: "POST /imaging-exams/${exam_id}/sign-off"
              payload: {}
              as: Radiologist
              as_user_id: "${rad_id}"
          trigger:
            - call: "POST /imaging-orders/${ord_id}/request-addendum"
              payload: {}
              as: Radiologist
              as_user_id: "${rad_id}"
            - call: "POST /radiology-reports/${rep_id}/finalize"
              payload: {}
              as: Radiologist
              as_user_id: "${rad_id}"
            - call: "POST /imaging-orders/${ord_id}/request-addendum"
              payload: {}
              as: Radiologist
              as_user_id: "${rad_id}"
            - call: "POST /radiology-reports/${rep_id}/finalize"
              payload: {}
              as: Radiologist
              as_user_id: "${rad_id}"
          assert:
            - "RadiologyReport.${rep_id}.status == AMENDED"
            - "RadiologyReport.${rep_id}.addendum_count == 2"
            - "ImagingOrder.${ord_id}.status == SIGNED_OFF"

      - name: order_branch_signed_off_to_addendum_loop
        grounds:
          - state_machines.ImagingOrder.SIGNED_OFF_to_ADDENDUM_REQUESTED
          - state_machines.ImagingOrder.ADDENDUM_REQUESTED_to_SIGNED_OFF
          - entities.ImagingOrder.fields.report_turnaround_minutes
        distinguishing_aspect: |
          ImagingOrder is non-linear: from terminal-looking SIGNED_OFF it branches into the
          ADDENDUM_REQUESTED side-loop and returns to SIGNED_OFF — a different entity than
          RadiologyReport, with turnaround GROWING across the loop (40.0 -> 120.0 minutes).
        test_recipe:
          setup:
            - "An XRAY ROUTINE order at SIGNED_OFF, acquired 09:00, signed 09:40 (turnaround 40.0)."
          setup_api_calls:
            - call: "POST /imaging-centers"
