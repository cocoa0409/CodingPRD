              as_user_id: "lo-1"
            - call: "POST /rehab/draw-requests/${draw2_id}/pay"
              payload: {}
              as: LoanOfficer
              as_user_id: "lo-1"
            - call: "POST /rehab/loans/${loan_id}/close-out"
              payload: { completion_date: "2026-11-30" }
              as: LoanOfficer
              as_user_id: "lo-1"
          assert:
            - "checkpoint 0 (before the lien): ProgramYear.${py_id} committed 0, disbursed 0, uncommitted 50000000; triad 50000000 == 50000000"
            - "checkpoint 1 (lien recorded): committed 3200000, disbursed 25000, uncommitted 46775000; triad 50000000 == 46775000 + 3200000 + 25000"
            - "checkpoint 2 (first draw paid, 2000000 requested): DrawRequest.${draw1_id}.retainage_cents == 200000 and net_payment_cents == 1800000"
            - "checkpoint 2: RehabLoan.${loan_id} contract_earned_cents 2000000, retainage_held_cents 200000, disbursed_cents 1825000, status DISBURSING"
            - "checkpoint 2: committed 1400000, disbursed 1825000, uncommitted 46775000; triad still 50000000"
            - "checkpoint 3 (final draw paid, 1000000 requested): DrawRequest.${draw2_id}.retainage_cents == 0 and net_payment_cents == 1200000 (the held 200000 rides out with it)"
            - "checkpoint 3: RehabLoan.${loan_id} contract_earned_cents 3000000, retainage_held_cents 0, disbursed_cents 3025000, status still DISBURSING because 3025000 != principal 3225000"
            - "checkpoint 3: committed 200000, disbursed 3025000, uncommitted 46775000; triad still 50000000"
            - "checkpoint 4 (close-out): the 200000 unspent commitment is released, so committed 0, disbursed 3025000, uncommitted 46975000; triad 50000000 == 46975000 + 0 + 3025000"
            - "checkpoint 4: RehabLoan.${loan_id}.principal_cents == 3025000, monthly_payment_cents == 29210 (recomputed down from 31141), status SERVICING, forgiveness_start_date 2026-11-30"
            - "checkpoint 4: RehabApplication.${app_id}.workflow_state == CLOSED and warranty_expires_at == 2027-11-30"
            - "checkpoint 4: Contractor.${c1_id}.on_time_completion_count == 1"
            - "no checkpoint ever shows a negative committed_amount_cents or uncommitted_amount_cents"

      - name: contractor_reinstatement_restores_the_solicitation_bid_census_without_drift
        grounds:
          - state_machines.Contractor.SUSPENDED_to_APPROVED
          - state_machines.Bid.WITHDRAWN_BY_PROGRAM_to_RESPONSIVE
          - state_machines.BidSolicitation.FAILED_to_TABULATED
          - state_machines.RehabApplication.BID_FAILED_to_BID_OPEN
          - entities.BidSolicitation.fields.responsive_bid_count
          - entities.BidSolicitation.fields.bid_count
          - entities.BidSolicitation.fields.reopen_count
          - calculations.bid_tabulation_and_ranking
        distinguishing_aspect: |
          The conserved quantity is not money but a derived census and its ranking: the pair
          (bid_count, responsive_bid_count) plus the rank assignment on a solicitation. Suspension
          knocks the census from (2, 2) to (1, 1) and fails the solicitation; the compensating
          reinstatement must restore exactly (2, 2) with the same rank 1 / rank 2 assignment and
          leave reopen_count at 0 — no rebid, no renumbering, no drift.
