          trigger:
            - { call: "POST /spice/production-runs", payload: { line_id: "${ln}", formula_id: "${f}", blend_run_id: "${br}", quantity_kg: 10, window_start: "2026-09-07T08:00:00Z", window_end: "2026-09-07T12:00:00Z", expected_line_version: "${ln_v1}" }, as: ProductionScheduler, captures: { r1: $.data.id, r1_co: $.data.changeover_class_required } }
            - { call: "GET /spice/lines/${ln}", payload: {}, as: ProductionScheduler, captures: { ln_v2: $.data.version } }
            - { call: "POST /spice/production-runs", payload: { line_id: "${ln}", formula_id: "${f}", blend_run_id: "${br}", quantity_kg: 10, window_start: "2026-09-07T12:00:00Z", window_end: "2026-09-07T16:00:00Z", expected_line_version: "${ln_v2}" }, as: ProductionScheduler, captures: { r2: $.data.id, r2_pred: $.data.predecessor_run_id, r2_co: $.data.changeover_class_required } }
            - { call: "GET /spice/lines/${ln}", payload: {}, as: ProductionScheduler, captures: { ln_v3: $.data.version } }
            - { call: "POST /spice/production-runs", payload: { line_id: "${ln}", formula_id: "${f}", blend_run_id: "${br}", quantity_kg: 10, window_start: "2026-09-07T11:00:00Z", window_end: "2026-09-07T13:00:00Z", expected_line_version: "${ln_v3}" }, as: ProductionScheduler, captures: { err: $.data.error_id } }
          assert:
            - "R1 [08:00,12:00) scheduled (201); ${r1_co} == NONE (no predecessor)"
            - "R2 [12:00,16:00) scheduled (201): adjacency at exactly window_end == window_start is NOT an overlap under half-open semantics"
            - "${r2_pred} == ${r1} and ${r2_co} == NONE (identical formula/brand/allergen set)"
            - "R3 [11:00,13:00) rejected: ${err} == ERR_LINE_WINDOW_CONFLICT (intersects both R1 and R2)"

      - name: reservation_aggregate_pool_semantics
        grounds:
          - validations[priority=29]
          - calculations.weekly_line_capacity
        distinguishing_aspect: |
          Different interval semantics on a different resource: CapacityReservation
          windows MAY overlap freely — the gate is aggregate capacity of the
          intersected ISO week (surge week 44 pool = 6250 kg), not pairwise
          exclusion. Two fully-overlapping 3000 kg reservations pass; a third
          300 kg reservation that merely tips the sum over the pool is rejected.
        test_recipe:
          setup:
            - "line LN capacity_kg_per_shift 1000 (surge-week pool floor(1000*5*1.25) = 6250 kg for ISO week 44: 2026-10-26..2026-11-02)"
          setup_api_calls:
            - { call: "POST /spice/lines", payload: { name: "Line-H", capacity_kg_per_shift: 1000, supported_changeover_classes: [NONE, DRY_CLEAN, WET_WASH, FULL_SANITATION] }, as: PlatformAdmin, captures: { ln: $.data.id } }
          trigger:
            - { call: "POST /spice/reservations", payload: { line_id: "${ln}", window_start: "2026-10-26T00:00:00Z", window_end: "2026-11-02T00:00:00Z", reserved_kg_per_week: 3000 }, as: ProductionScheduler, captures: { ra: $.data.id } }
            - { call: "POST /spice/reservations", payload: { line_id: "${ln}", window_start: "2026-10-26T00:00:00Z", window_end: "2026-11-02T00:00:00Z", reserved_kg_per_week: 3000 }, as: ProductionScheduler, captures: { rb: $.data.id } }
            - { call: "POST /spice/reservations", payload: { line_id: "${ln}", window_start: "2026-10-26T00:00:00Z", window_end: "2026-11-02T00:00:00Z", reserved_kg_per_week: 300 }, as: ProductionScheduler, captures: { err: $.data.error_id } }
            - { call: "POST /spice/reservations", payload: { line_id: "${ln}", window_start: "2026-09-07T00:00:00Z", window_end: "2026-09-14T00:00:00Z", reserved_kg_per_week: 3000 }, as: ProductionScheduler, captures: { rd: $.data.id } }
          assert:
            - "RA created (201) and RB created (201): identical fully-overlapping windows are allowed — no pairwise exclusion for reservations"
            - "RC rejected: ${err} == ERR_RESERVATION_OVER_COMMIT (6000 + 300 > 6250 surge pool of ISO week 44)"
            - "RD created (201): same 3000 kg in ISO week 37 is unaffected by week-44 consumption — pools are per (line, ISO week)"

  - rule_id: compensating_invariant
    instances:
      - name: lot_mass_conservation_across_commit_and_void
        grounds:
          - state_machines.BlendRun.blend_commit
          - state_machines.BlendRun.blend_void_committed
          - entities.RawLot.fields.quantity_remaining_kg
        distinguishing_aspect: |
          Conserved quantity: raw-lot MASS. INV-1 (quantity_kg ==
          quantity_remaining_kg + quantity_consumed_kg + quantity_wasted_kg)
          holds at creation, after a commit moves 40 kg remaining->consumed, and
          after the compensating void moves it back — literal 100 == 60+40+0 and
          100 == 100+0+0.
