              payload: { driver_id: "${driver_id}", tractor_id: "${tractor_id}", trailer_id: "${trailer_id}" }
              as: TransportManager
              captures: { v_after_assign: $.data.version }
          trigger:
            - call: "POST /fleet/trips/${trip_id}/backhaul-assignments"
              payload: { backhaul_offer_id: "${offer_a}", expected_trip_version: "${v_read}" }
              as: TransportManager
              captures: { stale_err: $.data.error_id }
            - call: "GET /fleet/trips/${trip_id}"
              payload: {}
              as: TransportManager
              captures: { v_now: $.data.version, link_before: $.data.backhaul_offer_id }
            - call: "POST /fleet/trips/${trip_id}/backhaul-assignments"
              payload: { backhaul_offer_id: "${offer_a}", expected_trip_version: "${v_now}" }
              as: TransportManager
              captures: { linked_a: $.data.backhaul_offer_id, credit_a: $.data.backhaul_credit_cents, v_after_link: $.data.version }
            - call: "POST /fleet/trips/${trip_id}/backhaul-assignments"
              payload: { backhaul_offer_id: "${offer_b}", expected_trip_version: "${v_now}" }
              as: TransportManager
              captures: { stale_relink_err: $.data.error_id }
            - call: "GET /fleet/trips/${trip_id}"
              payload: {}
              as: TransportManager
              captures: { link_still: $.data.backhaul_offer_id, v_unchanged: $.data.version }
            - call: "POST /fleet/trips/${trip_id}/backhaul-assignments"
              payload: { backhaul_offer_id: "${offer_b}", expected_trip_version: "${v_unchanged}" }
              as: TransportManager
              captures: { linked_b: $.data.backhaul_offer_id, v_after_relink: $.data.version }
          assert:
            - "${v_create} == 1, ${v_read} == 2 after the stop append and ${v_after_assign} == 3 - every write to the trip increments its version by exactly 1"
            - "${stale_err} == ERR_STALE_TRIP_VERSION with HTTP 412 - the version the client read went stale through an unrelated staffing write"
            - "${link_before} == null and ${v_now} == 3 - the refused link changed nothing, not even the version"
            - "${linked_a} == ${offer_a} with ${credit_a} == 0 (OFF-C1A is still PROPOSED, so no credit is booked) and ${v_after_link} == 4"
            - "${stale_relink_err} == ERR_STALE_TRIP_VERSION - the OCC gate is evaluated before the supersession logic, so the holder of the pre-link version cannot displace OFF-C1A"
            - "${link_still} == ${offer_a} and ${v_unchanged} == 4"
            - "${linked_b} == ${offer_b} and ${v_after_relink} == 5 - with the current version the supersession proceeds"

      - name: a_bid_is_guarded_by_the_board_version_that_other_bidders_keep_moving
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[bid-create-stale-posting]
          - errors.ERR_STALE_POSTING_VERSION
          - state_machines[RouteBid].transitions[SUBMITTED->WITHDRAWN]
        distinguishing_aspect: "The RoutePosting has no update endpoint at all, so its version can only be moved by writes to other rows: each accepted bid and each withdrawal bumps it. A bidder who read the board before someone else bid is therefore refused with ERR_STALE_POSTING_VERSION (412) on a posting nobody ever edited, and the refusal leaves bid_count untouched."
        test_recipe:
          setup:
            - "P-C2 is OPEN in DOM-C2 with bid_close_at 2026-09-15. Drivers D-C2A, D-C2B and D-C2C are ACTIVE with safety_score 100."
