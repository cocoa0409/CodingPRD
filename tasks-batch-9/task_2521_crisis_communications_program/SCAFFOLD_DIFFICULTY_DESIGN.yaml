  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_existence_outranks_incident_state_on_notice_create
        grounds:
          - validations.priority_6_foreign_key_existence
          - validations.priority_11_incident_response_state
          - errors.ERR_STATEMENT_NOT_FOUND
          - errors.ERR_INCIDENT_NOT_ACTIVATED
          - endpoints.POST_/crisis/stakeholder-notices
        distinguishing_aspect: |
          Two rules are violated by one call — an unresolvable statement_id (existence, priority 6) and a
          still-MONITORING incident (state, priority 11) — and the response must be the 404
          ERR_STATEMENT_NOT_FOUND, never the 409 ERR_INCIDENT_NOT_ACTIVATED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "An incident exists in response_state MONITORING (never activated)."
            - "No Statement rows exist at all, so the statement_id in the body cannot resolve."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crisis/team-members"
              payload: { full_name: "Dana Ruiz", org_title: "VP Operations" }
              as: ProgramAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /crisis/team-members"
              payload: { full_name: "Ivo Berg", org_title: "Comms Director" }
              as: ProgramAdmin
              captures: { comms_id: $.data.id }
            - call: "POST /crisis/incidents"
              payload: { title: "Unverified rumour about a supplier", scenario_code: "SUPPLY_CHAIN" }
              as: IncidentLead
              as_user_id: "${lead_id}"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /crisis/stakeholder-notices"
              payload: { incident_id: "${inc_id}", statement_id: "00000000-0000-0000-0000-0000000000ff", audience: "EMPLOYEE", estimated_reach: 1000 }
              as: CommsLead
              as_user_id: "${comms_id}"
          assert:
            - "response status == 404"
            - "response data.error_id == ERR_STATEMENT_NOT_FOUND"
            - "response data.error_id != ERR_INCIDENT_NOT_ACTIVATED"
            - "no StakeholderNotice row was created for Incident.${inc_id}"
            - "Incident.${inc_id}.response_state == MONITORING"

      - name: priority_task_state_outranks_review_deadline_on_decide
        grounds:
          - validations.priority_10_transition_from_state
          - validations.priority_20_review_deadline
          - errors.ERR_APPROVAL_TASK_NOT_PENDING
          - errors.ERR_REVIEW_DEADLINE_PASSED
          - state_machines.ApprovalTask.PENDING_to_APPROVED
