              as: Policyholder
              as_user_id: "${ph}"
              captures: { err: $.data.error_id }
          assert:
            - "response data.error_id == ERR_INVALID_STATE"
            - "response status == 409"

      - name: settle_partial_damage_returns_partial_requires_repair
        claim_type: Invalid Transitions
        grounds: [state_machines.Claim.APPROVED_to_SETTLED, "validations[priority=19]", "errors[ERR_PARTIAL_REQUIRES_REPAIR]"]
        distinguishing_aspect: "Direct /settle on an APPROVED PARTIAL_DAMAGE claim returns ERR_PARTIAL_REQUIRES_REPAIR (409); it must settle via RepairOrder closure."
        test_recipe:
          setup: ["ACTIVE policy; an APPROVED PARTIAL_DAMAGE claim (no repair order yet)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
