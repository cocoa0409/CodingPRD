        grounds:
          - state_machines.MeasurementSpec.SUBMITTED_to_CORRECTION_REQUESTED
          - state_machines.MeasurementSpec.CORRECTION_REQUESTED_to_SUBMITTED
          - calculations.spec_grade_tolerance_verification
          - calculations.vendor_reliability_score
        distinguishing_aspect: |
          The cycle belongs to MeasurementSpec: a SUBMITTED specification whose CHEST grade breaks
          tolerance falls back to CORRECTION_REQUESTED and re-enters SUBMITTED through resubmit,
          arriving at VERIFIED with revision_round 1 while the vendor keeps the 2500-cent debit
          and the 9700 reliability score the loop cost.
