  - section: cross_cutting_complexity_layers
    instances:
      - name: the_petition_version_gate_sits_between_existence_and_business_rules
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[0]
          - errors.ERR_STALE_PETITION_VERSION
          - validations[priority=8]
          - entities.Petition.fields.version
          - endpoints.POST_voter_lists
        distinguishing_aspect: |
          The list-create OCC gate has four separable behaviours: the omitted expected_petition_version is a
          422 and not a 412, a stale value is a 412 that writes nothing at all, the gate is subordinate to the
          existence checks (a bad agreement id with a stale version answers 404) and to the role check (a
          forbidden role with a stale version answers 403), and a successful create bumps Petition.version by
          exactly one - which is why the caller must re-read before the second list and why the replay of a
          successful body conflicts.
        test_recipe:
          setup:
            - "petition 07-RC-340701 in ELECTION_SET with a stipulated agreement whose voter_list_due_at is 2026-08-24T23:59:59Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
