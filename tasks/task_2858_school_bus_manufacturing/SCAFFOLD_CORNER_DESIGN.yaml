              as_user_id: "compliance-01"
              captures: { nv_id: $.data.id }
            - call: "POST /state-spec-profiles/${nv_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { published_first: $.data.published_at, nv_status: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-01"
          trigger:
            - call: "POST /state-spec-profiles/${nv_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { err_republish: $.data.error_id }
            - call: "GET /state-spec-profiles/${nv_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "compliance-01"
              captures: { published_after: $.data.published_at, status_after: $.data.status }
          assert:
            - "the second publish fails 409 ERR_PROFILE_NOT_DRAFT"
            - "StateSpecProfile.${nv_id}.status == PUBLISHED and published_at == 2026-08-15T00:00:00Z, not the current clock 2026-09-01T00:00:00Z"
            - "superseded_by_profile_id is still null — a profile never supersedes itself"

      - name: award_fans_out_rejecting_sibling_bids_and_awarding_the_solicitation
        claim_type: side_effect_execution
        grounds:
          - state_machines.Bid.SUBMITTED_to_AWARDED
          - state_machines.Bid.SUBMITTED_to_REJECTED
