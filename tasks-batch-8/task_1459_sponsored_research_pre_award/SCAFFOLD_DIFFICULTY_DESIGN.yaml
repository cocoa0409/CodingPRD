              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2025-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
