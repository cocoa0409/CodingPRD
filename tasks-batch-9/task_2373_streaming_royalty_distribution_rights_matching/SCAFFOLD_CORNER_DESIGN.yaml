            - "Both usage-batch creates return HTTP 201 and the period ends up with two batches."
            - "The analyst-filed registration returns HTTP 201 with payee_holder_id equal to the label — priority 6 did NOT fire, because the ownership rule constrains RightsHolderUser callers, not analysts acting on a claimant's behalf."
            - "The clock is settable by the RegulatoryOfficer and by a RightsHolderUser; the last set leaves current_utc at 2026-08-03T00:00:00Z."
            - "GET endpoints answer for every role: the officer reads a work and lists usage batches (2 rows), and the holder lists its own registrations (1 row)."

