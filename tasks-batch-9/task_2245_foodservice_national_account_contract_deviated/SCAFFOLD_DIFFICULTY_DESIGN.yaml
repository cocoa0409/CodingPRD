          setup:
            - "Operator DTG, manufacturer SNF, DC-PHX with out_of_market_fee_per_case_cents 275."
            - "Product P-BOUND with avg_cost_cents 4850 so the unbounded PROTEIN AVG_COST DOLLARS_PER_CASE 150 tier prices every case at exactly 5000."
            - "Contract DESERT-2026 ACTIVE with allow_out_of_market true and a single OUT_OF_MARKET coverage carrying service_fee_waived false, so only the extended-value threshold can waive the fee."
