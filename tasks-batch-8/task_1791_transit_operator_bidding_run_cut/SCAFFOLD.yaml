    input: []
    output: PayRecord[]
    side_effects: []
  - method: POST
    path: "/api/absence-cases"
    description: "Report an operator absence"
    roles: [SchedulingOfficer, Operator]
    code: 201
    input: [operator_id, absence_date, reason_code]
    output: AbsenceCase
    side_effects: []
  - method: GET
    path: "/api/absence-cases"
    description: "List absence cases"
    roles: [SchedulingOfficer, Operator, UnionRep]
    code: 200
    input: ["limit?", "offset?", "operator_id?", "status?", "covering_assignment_id?"]
    output: AbsenceCase[]
    side_effects: []
  - method: GET
    path: "/api/absence-cases/{id}"
    description: "Fetch one absence case"
    roles: [SchedulingOfficer, Operator, UnionRep]
    code: 200
    input: []
    output: AbsenceCase
    side_effects: []
  - method: POST
    path: "/api/absence-cases/{id}/cover"
    description: "Cover an absence from the extra board or via OT offer (OCC on case version)"
    roles: [SchedulingOfficer]
    code: 200
    input: [allow_overtime, expected_absence_case_version]
    output: AbsenceCase
    side_effects: ["creates covering DailyAssignment", "absent operator's assignment -> NO_SHOW", "AbsenceCase REPORTED->COVERED", "increments AbsenceCase.version by 1"]
  - method: POST
    path: "/api/absence-cases/{id}/declare-uncovered"
    description: "Declare an absence uncoverable"
    roles: [SchedulingOfficer]
    code: 200
    input: []
    output: AbsenceCase
    side_effects: ["AbsenceCase REPORTED->UNCOVERED", "absent operator's assignment -> CANCELLED", "increments AbsenceCase.version by 1"]
  - method: POST
    path: "/api/absence-cases/{id}/close"
    description: "Close a resolved absence case"
    roles: [SchedulingOfficer]
    code: 200
    input: []
    output: AbsenceCase
    side_effects: ["AbsenceCase -> CLOSED", "increments AbsenceCase.version by 1"]
  - method: POST
    path: "/api/sign-up-periods/{id}/vacation-slots"
    description: "Create a vacation week slot with capacity"
    roles: [SchedulingOfficer]
    code: 201
    input: [week_start_date, capacity]
    output: VacationSlot
    side_effects: []
  - method: GET
    path: "/api/sign-up-periods/{id}/vacation-slots"
    description: "List vacation slots of a period"
    roles: [SchedulingOfficer, Operator, UnionRep]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: VacationSlot[]
    side_effects: []
  - method: POST
    path: "/api/vacation-slots/{id}/grant"
    description: "Grant a vacation week to an operator by seniority order"
    roles: [SchedulingOfficer]
    code: 200
    input: [operator_id]
    output: VacationSlot
    side_effects: ["allocated_count += 1", "Operator.vacation_hours_balance -= 40", "slot OPEN->FULLY_ALLOCATED at capacity", "increments VacationSlot.version by 1"]
  - method: POST
    path: "/api/vacation-slots/{id}/close"
    description: "Close a vacation slot"
    roles: [SchedulingOfficer]
    code: 200
    input: []
    output: VacationSlot
    side_effects: ["VacationSlot -> CLOSED", "increments VacationSlot.version by 1"]
  - method: POST
    path: "/api/grievance-cases"
    description: "File a grievance"
    roles: [Operator, UnionRep]
    code: 201
    input: [filed_by_operator_id, sign_up_period_id, category, detail]
    output: GrievanceCase
    side_effects: []
  - method: GET
    path: "/api/grievance-cases"
    description: "List grievance cases"
    roles: [SchedulingOfficer, Operator, UnionRep]
    code: 200
    input: ["limit?", "offset?", "status?", "category?", "sign_up_period_id?", "filed_by_operator_id?"]
    output: GrievanceCase[]
    side_effects: []
  - method: GET
    path: "/api/grievance-cases/{id}"
    description: "Fetch one grievance case"
    roles: [SchedulingOfficer, Operator, UnionRep]
    code: 200
    input: []
    output: GrievanceCase
    side_effects: []
  - method: POST
    path: "/api/grievance-cases/{id}/uphold"
    description: "Uphold a grievance; credits remedy minutes on OT_EQUALIZATION"
    roles: [UnionRep]
    code: 200
    input: ["remedy_minutes?"]
    output: GrievanceCase
    side_effects: ["GrievanceCase FILED->UPHELD", "Operator.weekly_ot_minutes_accum += remedy_minutes for filed_by_operator_id", "increments GrievanceCase.version by 1"]
  - method: POST
    path: "/api/grievance-cases/{id}/dismiss"
    description: "Dismiss a grievance"
    roles: [UnionRep]
    code: 200
    input: []
    output: GrievanceCase
    side_effects: ["GrievanceCase FILED->DISMISSED", "increments GrievanceCase.version by 1"]
  - method: POST
    path: "/api/grievance-cases/{id}/withdraw"
    description: "Filing operator withdraws a grievance"
    roles: [Operator]
    code: 200
    input: []
    output: GrievanceCase
    side_effects: ["GrievanceCase FILED->WITHDRAWN", "increments GrievanceCase.version by 1"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or unknown X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Authenticated role not permitted for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body-referenced FK (run_id, operator_id, sign_up_period_id) does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state permitting the operation"
  - id: ERR_INVALID_RUN_PIECES
    http: 422
    condition: "pieces[] overlap, are non-ascending, or have release <= report"
  - id: ERR_DUPLICATE_RUN_NUMBER
    http: 409
    condition: "run_number already exists within (sign_up_period_id, schedule_revision)"
  - id: ERR_DUPLICATE_PREFERENCE
    http: 409
    condition: "operator already has a SUBMITTED bid with this preference_rank in the same sign-up"
  - id: ERR_DATE_OUT_OF_RANGE
    http: 422
    condition: "date outside the sign-up effective window"
  - id: ERR_RUN_NOT_BIDDABLE
    http: 422
    condition: "run_id does not belong to the sign-up period or is not biddable"
  - id: ERR_SPREAD_LIMIT_EXCEEDED
    http: 422
    condition: "run spread exceeds spread_limit_minutes under strict creation"
  - id: ERR_INVALID_ACTUAL_MINUTES
    http: 422
    condition: "actual_platform_minutes missing, <= 0, or > 960"
  - id: ERR_INSUFFICIENT_VACATION_BALANCE
    http: 422
    condition: "operator vacation_hours_balance < 40 at grant"
  - id: ERR_VACATION_SLOT_FULL
    http: 409
    condition: "vacation slot allocated_count already == capacity"
  - id: ERR_NO_COVER_AVAILABLE
    http: 409
    condition: "no eligible extra-board or OT candidate to cover the absence"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the parent resource's current version"
  - id: ERR_GRIEVANCE_PRECONDITION
    http: 422
    condition: "OT_EQUALIZATION uphold attempted without an evidenced lower-accumulator operator"
  - id: ERR_VALIDATION
    http: 400
    condition: "Generic malformed request body (missing required field, wrong type)"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: SchedulingOfficer
    description: "Transit agency scheduling office staff; runs the cut, pick, board, and absence desk"
    identity: "opaque"
    exclusive_operations:
      - "create/cut/post/lock/implement/cancel sign-up periods"
      - "create runs and schedule revisions"
      - "adjudicate picks; suspend/reinstate/retire/promote operators"
      - "create vacation slots, grant and close them"
      - "cover or declare-uncovered absence cases; mark no-show"
    shared_operations:
      - "read any entity list/detail"
  - name: Operator
    description: "Union transit operator bidding on runs and working assignments"
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "submit and withdraw own bid entries"
      - "dispute pay on own assignments"
      - "withdraw own grievances"
    shared_operations:
      - "read sign-up periods, runs, bid entries, board slots, assignments, pay records of own assignments, vacation slots, grievances"
      - "report own absence"
  - name: PayrollClerk
    description: "Timekeeping and pay validation clerk"
    identity: "opaque"
    exclusive_operations:
      - "close out daily assignments with actual minutes"
      - "finalize pay"
    shared_operations:
      - "read assignments, pay records, runs, operators"
  - name: UnionRep
    description: "Union representative adjudicating grievances"
    identity: "opaque"
    exclusive_operations:
      - "uphold or dismiss grievance cases"
    shared_operations:
      - "file grievances on behalf of operators"
      - "read sign-up periods, runs, bid entries, board slots, assignments, grievances, absence cases"
