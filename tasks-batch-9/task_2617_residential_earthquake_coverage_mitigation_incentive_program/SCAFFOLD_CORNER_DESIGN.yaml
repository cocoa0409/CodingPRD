              as: ParticipatingInsurer
              as_user_id: "${ins_id}"
              captures: { pol_1: $.data.id }
            - call: "POST /eqp/policies"
              payload: { dwelling_id: "${dw_1}", insurer_id: "${ins_id}", accepted_offer_id: "${off_1}", deductible_pct: 15, contents_sublimit_cents: 4000000, loss_of_use_sublimit_cents: 1000000 }
              as: ParticipatingInsurer
