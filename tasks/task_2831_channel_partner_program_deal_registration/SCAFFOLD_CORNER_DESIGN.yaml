            - "ConflictCase.${case_vs_id}.recommended_resolution_coverage_first == GRANT_SUBJECT and recommended_resolution == GRANT_SUBJECT"
            - "ConflictCase.${case_vs_id}.recommended_resolution_registration_first == GRANT_SUBJECT (stored even though it was not applied)"
            - "ConflictCase.${case_vs_id}.status == OPEN, escalation_level == 0, subject_registration_id == ${r_vs_id}, counter_registration_id == null"
            - "Account.${acc_vs_id}.direct_pursuit_declared_at == 2026-04-05T00:00:00.000Z and coverage_state == CHANNEL_PROTECTED"

