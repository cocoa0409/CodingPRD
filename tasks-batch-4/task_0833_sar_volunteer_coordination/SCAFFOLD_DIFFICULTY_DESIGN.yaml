          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Invariant Res", incident_type: "AIR_SEARCH", ics_incident_number: "OR-2026-0017" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/tasks"
              payload: { incident_id: "${inc_id}", task_number: "T-1", task_type: "AIR_RECON", segment_area_sqkm: 20.0, planned_searcher_hours: 4, planned_start: "2026-05-02T06:00:00Z", planned_end: "2026-05-02T20:00:00Z" }
              as: Coordinator
              captures: { task_id: $.data.id }
            - call: "POST /sar/resources"
              payload: { name: "Boat B1", resource_type: "BOAT" }
              as: Coordinator
              captures: { res_id: $.data.id, r_v0: $.data.version }
            - call: "POST /sar/resource-assignments"
              payload: { resource_id: "${res_id}", task_id: "${task_id}", window_start: "2026-05-02T09:00:00Z", window_end: "2026-05-02T11:00:00Z", expected_resource_version: "${r_v0}" }
              as: Coordinator
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /sar/resource-assignments/${asg_id}/cancel"
              payload: {}
              as: Coordinator
          assert:
            - "ResourceAssignment.${asg_id}.status == CANCELLED"
            - "Resource.${res_id}.active_assignment_count == 0"
            - "Resource.${res_id}.status == AVAILABLE"

      - name: reimbursement_ledger_conserved
        grounds:
          - state_machines.ReimbursementClaim.SUBMITTED_to_APPROVED
          - state_machines.ReimbursementClaim.APPROVED_to_REJECTED
          - entities.Incident.fields.total_approved_reimbursement_cents
        distinguishing_aspect: |
          Conserved quantity = Incident.total_approved_reimbursement_cents (a
          monetary ledger, distinct from a resource count): approve credits
          12000c then reject-from-APPROVED debits 12000c, restoring the ledger
          to its pre-approval 0.
        test_recipe:
          setup:
            - "DEMOBILIZING incident with a SUBMITTED claim (0 tracks; declared 40mi, 2 meals, 1 lodging => final 12000c); ledger starts at 0."
          setup_api_calls:
            - call: "POST /sar/incidents"
              payload: { name: "Ledger Inc", incident_type: "URBAN", ics_incident_number: "OR-2026-0018" }
              as: Coordinator
              captures: { inc_id: $.data.id }
            - call: "POST /sar/incidents/${inc_id}/activate"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/incidents/${inc_id}/demobilize"
              payload: {}
              as: IncidentCommander
            - call: "POST /sar/teams"
              payload: { name: "Oscar Ground", team_type: "GROUND", base_location: "Bend" }
              as: Coordinator
              captures: { team_id: $.data.id }
            - call: "POST /sar/members"
              payload: { team_id: "${team_id}", full_name: "Ola Vol", email: "ola@x.org", member_role: "SEARCHER" }
              as: Coordinator
              captures: { m_id: $.data.id }
            - call: "POST /sar/reimbursement-claims"
              payload: { member_id: "${m_id}", incident_id: "${inc_id}", declared_mileage_miles: 40, meal_count: 2, lodging_nights: 1 }
              as: Coordinator
              captures: { claim_id: $.data.id }
            - call: "POST /sar/reimbursement-claims/${claim_id}/submit"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /sar/reimbursement-claims/${claim_id}/approve"
              payload: {}
              as: FinanceOfficer
          trigger:
            - call: "POST /sar/reimbursement-claims/${claim_id}/reject"
              payload: {}
              as: FinanceOfficer
          assert:
            - "ReimbursementClaim.${claim_id}.final_amount_cents == 12000"
            - "ReimbursementClaim.${claim_id}.status == REJECTED"
            - "Incident.${inc_id}.total_approved_reimbursement_cents == 0"
