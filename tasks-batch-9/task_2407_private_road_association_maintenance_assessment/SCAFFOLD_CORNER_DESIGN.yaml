          rationale: "ERR_WORK_WINDOW_CONFLICT is triggered there on a one-day overlap, with the touching-window case shown to pass."

      - name: paving_cure_buffer_violation_code
        claim_type: triggerability
        excluded_because:
          difficulty_instance: work_windows_touch_legally_overlap_illegally_and_respect_the_paving_cure_buffer
          rationale: "The same instance triggers ERR_PAVING_CURE_BUFFER_VIOLATION at cure day 2 and shows day 3 passing, so the code and its boundary are both covered."

      - name: restriction_days_exceeded_code
        claim_type: triggerability
        excluded_because:
