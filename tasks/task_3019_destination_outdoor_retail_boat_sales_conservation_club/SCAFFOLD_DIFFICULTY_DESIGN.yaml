# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
#   Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules
#   of §0.5. Instances: 2 per rule, 18 total.
#
# Order-independent handling of test_recipe chains
# ------------------------------------------------
# A test recipe is a partially-ordered set of steps. setup_api_calls entries and
# trigger entries are both step TYPES, and callers MAY interleave them in any
# order — a trigger step is not required to be the last operation in the
# instance. Therefore a setup:` description was never sufficient to pin the
# observable state in the presence of cascades. Every recipe below that exposes
# a cascade therefore pins an ordered list of read steps, written as read
# pseudo-calls with a `GET` `call:` and no `as:` key, at each place where a
# distinct snapshot must be compared. Each read step is labelled R<n> in the
# prose; snapshots are compared only between the read positions named in the
# assert lines.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: permit_fee_rounding_order_divergence
        grounds:
          - calculations.permit_fee
          - calculations.permit_remit_snapshot
          - state_machines.PermitRemitBatch.transitions.TRANSMITTED_to_CORRECTED
          - entities.PermitSale.fields.fee_cents
          - validations[priority=13]
        distinguishing_aspect: |
          The two permit_fee variants price the same sale differently by exactly
          one cent, and the divergence is carried into a signed
          PermitRemitBatch.remit_variance_cents of 1, which is a different sign
          than the settlement divergence of the boat-deal domain — so the two
          Rule-1 instances expose dual-variant logic on different subjects and
          with different algebraic polarity.
        test_recipe:
          setup:
            - "One store with a remittance window of 2026-09-01T00:00Z to 2026-09-30T00:00Z and a logical clock at 2026-09-10T00:00Z."
            - "Two ISSUED permit sales in that window: sale A is FISHING/RESIDENT with term_days 7 and land_access_units 3, sale B is FISHING/RESIDENT with term_days 7 and land_access_units 35000."
            - "The batch is sealed, so its frozen gross snapshot is already written."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_pf@x.com", full_name: "Perry Fisher", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/permit-remit-batches"
              payload: { window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T00:00:00Z" }
              as: RemitAdmin
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /stores/${st_id}/permit-sales"
              payload: { member_id: "${m_id}", permit_type: "FISHING", residency_class: "RESIDENT", term_days: 7, land_access_units: 3, agent_user_id: "clerk_4471", permit_remit_batch_id: "${b_id}", expected_remit_batch_version: "${b_v}" }
              as: PermitClerk
              captures: { sA_id: $.data.id }
            - call: "GET /stores/permit-remit-batches/${b_id}"
              as: RemitAdmin
              captures: { b_v2: $.data.version }
            - call: "POST /stores/${st_id}/permit-sales"
              payload: { member_id: "${m_id}", permit_type: "FISHING", residency_class: "RESIDENT", term_days: 7, land_access_units: 35000, agent_user_id: "clerk_4471", permit_remit_batch_id: "${b_id}", expected_remit_batch_version: "${b_v2}" }
              as: PermitClerk
              captures: { sB_id: $.data.id }
            - call: "POST /stores/permit-remit-batches/${b_id}/seal"
              payload: { remitter_admin_user_id: "remit_9001" }
              as: RemitAdmin
            - call: "POST /stores/permit-remit-batches/${b_id}/transmit"
              payload: {}
              as: RemitAdmin
            - call: "POST /stores/permit-remit-batches/${b_id}/acknowledge"
              payload: { agency_ack_no: "MO-ACK-778812" }
              as: AgencyOperator
            - call: "GET /stores/permit-remit-batches/${b_id}"
              as: RemitAdmin
              captures: { ack_v: $.data.version }
          trigger:
            - call: "POST /stores/permit-remit-batches/${b_id}/reject-correction"
              payload: { sale_id: "${sA_id}", revised_fee_cents: 3239 }
              as: AgencyOperator
            - call: "GET /stores/permit-sales/${sA_id}"
              as: RemitAdmin
            - call: "GET /stores/permit-remit-batches/${b_id}"
              as: RemitAdmin
          assert:
            - "before the correction PermitRemitBatch.${b_id}.gross_fee_cents == 443938 (sale A priced at 3238 and sale B at 440700 under the exact_rational variant)"
            - "after the correction PermitSale.${sA_id}.fee_cents == 3239 and PermitSale.${sA_id}.status == CORRECTED"
            - "PermitRemitBatch.${b_id}.gross_fee_cents == 443938 (the frozen snapshot did not move)"
            - "PermitRemitBatch.${b_id}.interpretative_gross_cents == 443939"
            - "PermitRemitBatch.${b_id}.remit_variance_cents == 1 and its sign is positive, the opposite polarity of the boat-deal settlement variance"

      - name: boat_deal_settlement_basis_divergence
        grounds:
          - calculations.boat_deal_contract_price
          - calculations.delivery_settlement_variance
          - calculations.deal_fee_and_tax_relay
          - entities.BoatDeal.fields.settlement_variance_cents
          - validations[priority=20]
        distinguishing_aspect: |
          The quote variant and the contracted variant of boat_deal_contract_price
          differ by the rigging fee plus an accessory rounding hop (11125000 vs
          11220000), and the delivered fee basis adds a 25000-cent delivery-prep
          charge into the tax base — a materially larger divergence than the
          permit domain's one-cent rounding divergence.
        test_recipe:
          setup:
            - "One store with a logical clock at 2026-09-01T00:00Z and a boat unit priced 9000000 / 1800000 / 350000 in NEW condition."
            - "One member whose club card status is PENDING, so the tier credit rate is 50 basis points at both bases."
            - "A quoted deal on that unit, funded in full, with its BOAT_TITLE filing submitted."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_du@x.com", full_name: "Dana Undertow", donation_opt_in: true }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-9001", model_name: "Angler 190", unit_price_cents: 9000000, motor_price_cents: 1800000, trailer_price_cents: 350000, unit_condition: "NEW", hull_id_no: "HIN9001AA000" }
              as: DealDeskClerk
              captures: { bu_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-deals"
              payload: { member_id: "${m_id}", boat_unit_id: "${bu_id}" }
              as: DealDeskClerk
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "GET /stores/boat-deals/${d_id}"
              as: DealDeskClerk
            - call: "POST /stores/boat-deals/${d_id}/contract"
              payload: { expected_deal_version: "${d_v}" }
              as: DealDeskClerk
              captures: { d_v2: $.data.version, tf_id: $.data.title_filing_id }
            - call: "POST /stores/boat-deals/${d_id}/funding"
              payload: { amount_cents: 12102193, expected_deal_version: "${d_v2}" }
              as: FinanceAdmin
          trigger:
            - call: "GET /stores/boat-deals/${d_id}"
              as: FinanceAdmin
            - call: "POST /stores/title-filings/${tf_id}/submit"
              payload: {}
              as: TitleClerk
            - call: "POST /stores/title-filings/${tf_id}/issue"
              payload: { agency_reference: "MO-TTL-55201" }
              as: TitleClerk
          assert:
            - "at the quote read BoatDeal.${d_id}.contract_price_cents == 11125000 (rigging fee excluded, accessory discount 25000 applied)"
            - "after contracting BoatDeal.${d_id}.contract_price_cents == 11220000 (the contracted_settlement_price variant adds the 95000-cent rigging fee)"
            - "the delta between the two variants is exactly 95000 cents for identical hull, motor, trailer and trade inputs"
            - "at the delivered read BoatDeal.${d_id}.settlement_variance_cents == 5075"
            - "BoatDeal.${d_id}.balance_due_cents == 0"

  # ===========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: trade_in_credit_waterfall_branch
        grounds:
          - calculations.trade_in_credit
          - calculations.boat_deal_contract_price
          - entities.TradeInAppraisal.fields.accepted_credit_cents
          - entities.BoatUnit.fields.prior_title_no
          - validations[priority=16]
        distinguishing_aspect: |
          Mode (a): trade_in_credit is a three-input non-linear formula whose two
          branches read foreign entity state — the offer amount, the
          BoatUnit.prior_title_no branch (200 basis point penalty when non-null)
          and the Member.club_card_status branch (300 basis point rebate when
          ACTIVE) — so two appraisals with an identical 50000-cent offer on two
          units of the same model settle 1000 cents apart purely because one unit
          carries a prior title.
        test_recipe:
          setup:
            - "A store at clock 2026-09-01T00:00Z and one club member whose club_card_status is NONE."
            - "Two USED boat units of the same model, unit A carrying a prior title number and unit B carrying none."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_ti@x.com", full_name: "Tate Inwood", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-TR-A", model_name: "Bay 170", unit_price_cents: 4000000, unit_condition: "USED", hull_id_no: "HINTRADEA001", prior_title_no: "MO-TTL-OLD-0091" }
              as: DealDeskClerk
              captures: { bu_a_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-TR-B", model_name: "Bay 170", unit_price_cents: 4000000, unit_condition: "USED", hull_id_no: "HINTRADEB001" }
              as: DealDeskClerk
              captures: { bu_b_id: $.data.id }
            - call: "POST /stores/${st_id}/appraisals"
              payload: { member_id: "${m_id}", boat_unit_id: "${bu_a_id}", offer_amount_cents: 50000 }
              as: DealDeskClerk
              captures: { ap_a_id: $.data.id }
            - call: "POST /stores/${st_id}/appraisals"
              payload: { member_id: "${m_id}", boat_unit_id: "${bu_b_id}", offer_amount_cents: 50000 }
              as: DealDeskClerk
              captures: { ap_b_id: $.data.id }
          trigger:
            - call: "POST /stores/appraisals/${ap_a_id}/accept"
              payload: {}
              as: DealDeskClerk
            - call: "GET /stores/appraisals/${ap_a_id}"
              as: DealDeskClerk
            - call: "POST /stores/appraisals/${ap_b_id}/accept"
              payload: {}
              as: DealDeskClerk
            - call: "GET /stores/appraisals/${ap_b_id}"
              as: DealDeskClerk
          assert:
            - "TradeInAppraisal.${ap_a_id}.status == ACCEPTED and TradeInAppraisal.${ap_a_id}.accepted_credit_cents == 49000 (50000 offer, no ACTIVE-card rebate, minus the 2% prior-title penalty)"
            - "TradeInAppraisal.${ap_b_id}.status == ACCEPTED and TradeInAppraisal.${ap_b_id}.accepted_credit_cents == 50000 (the same offer with a null prior_title_no takes the zero-penalty branch)"
            - "the two appraisals carry identical offer_amount_cents == 50000 yet differ by exactly 1000 cents, which only the prior_title_no branch can explain"
            - "an identical offer for a member whose club_card_status is ACTIVE credits 51500, so the card-status branch moves the credit the other way"

      - name: boat_deal_priced_fee_nested_rounding_order
        grounds:
          - calculations.deal_fee_and_tax_relay
          - calculations.intake_project_charge
          - entities.BoatDeal.fields.total_fee_cents
          - entities.ServiceIntake.fields.project_charge_cents
          - validations[priority=22]
        distinguishing_aspect: |
          Mode (b) nested rounding with the order pinned: the boat-deal tax is
          rounded once on the whole base that already excludes the title fee
          (fee_base 11220000 + doc fee 59900 at 7.25% yields exactly 817793), so
          rounding the doc fee or the title fee separately lands on a different
          cent; intake_project_charge pins the opposite mode (a max() clamp applied
          after the sum) on the same scaffold.
        test_recipe:
          setup:
            - "A store at logical clock 2026-09-01T00:00Z with one NEW 9000000/1800000/350000 boat unit and one club member."
            - "A quoted deal on that unit whose BOAT_TITLE filing already exists."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_rr@x.com", full_name: "Rae Rund", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-9001", model_name: "Angler 190", unit_price_cents: 9000000, motor_price_cents: 1800000, trailer_price_cents: 350000, unit_condition: "NEW", hull_id_no: "HIN9001AA000" }
              as: DealDeskClerk
              captures: { bu_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-deals"
              payload: { member_id: "${m_id}", boat_unit_id: "${bu_id}" }
              as: DealDeskClerk
              captures: { d_id: $.data.id, d_v: $.data.version }
          trigger:
            - call: "POST /stores/boat-deals/${d_id}/contract"
              payload: { expected_deal_version: "${d_v}" }
              as: DealDeskClerk
            - call: "GET /stores/boat-deals/${d_id}"
              as: DealDeskClerk
          assert:
            - "BoatDeal.${d_id}.contract_price_cents == 11220000"
            - "BoatDeal.${d_id}.total_fee_cents == 882193 (doc 59900 + title 4500 + tax 817793)"
            - "the tax component is exactly 817793, which is round_half_up((11220000 + 59900) * 0.0725) — rounding per component instead lands on 817794 or 817792"
            - "BoatDeal.${d_id}.balance_due_cents == 12102193"

  # ===========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: boat_deal_cyclic_title_rejection_revert
        grounds:
          - state_machines.BoatDeal.transitions.DELIVERED_to_CONTRACTED
          - state_machines.BoatDeal.transitions.CONTRACTED_to_DELIVERED
          - state_machines.TitleFiling.transitions.SUBMITTED_to_ISSUED
          - calculations.delivery_settlement_variance
          - validations[priority=12]
        distinguishing_aspect: |
          BoatDeal exposes a cycle (DELIVERED -> CONTRACTED -> DELIVERED), which
          is a different non-linearity than the AttractionSession fork-join:
          the same deal row is driven forward twice through the identical
          transition and its settlement variance is zeroed on the revert hop.
        test_recipe:
          setup:
            - "A store at clock 2026-09-01T00:00Z, a boat unit, a member and a contracted deal whose filing has been submitted and issued."
            - "One RIGGING service order on that deal, with its own LoadingBayBooking, driven to DELIVERED so rigging_status is COMPLETE."
            - "One OVERSIZE_CARRYOUT OrderFulfillment on that rigging order, already RELEASED so that the rigging order can be delivered."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_cy@x.com", full_name: "Cy Crank", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-units"
              payload: { stock_no: "BU-9001", model_name: "Angler 190", unit_price_cents: 9000000, motor_price_cents: 1800000, trailer_price_cents: 350000, unit_condition: "NEW", hull_id_no: "HIN9001AA000" }
              as: DealDeskClerk
              captures: { bu_id: $.data.id }
            - call: "POST /stores/${st_id}/boat-deals"
              payload: { member_id: "${m_id}", boat_unit_id: "${bu_id}" }
              as: DealDeskClerk
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /stores/boat-deals/${d_id}/contract"
              payload: { expected_deal_version: "${d_v}" }
              as: DealDeskClerk
              captures: { d_v2: $.data.version, tf_id: $.data.title_filing_id }
            - call: "POST /stores/title-filings/${tf_id}/submit"
              payload: {}
              as: TitleClerk
            - call: "POST /stores/title-filings/${tf_id}/issue"
              payload: { agency_reference: "MO-TTL-55201" }
              as: TitleClerk
            - call: "POST /stores/boat-deals/${d_id}/funding"
              payload: { amount_cents: 12102193, expected_deal_version: "${d_v2}" }
              as: FinanceAdmin
              captures: { d_v3: $.data.version }
            - call: "POST /stores/${st_id}/service-orders"
              payload: { boat_unit_id: "${bu_id}", order_kind: "RIGGING", promised_lead_days: 5, deal_id: "${d_id}", boat_deal_id: "${d_id}" }
              as: ServiceWriter
              captures: { so_id: $.data.id }
            - call: "POST /stores/${st_id}/bay-bookings"
              payload: { bay_no: 1, member_id: "${m_id}", service_order_id: "${so_id}", booked_start_utc: "2026-09-08T09:00:00Z", booked_end_utc: "2026-09-08T10:00:00Z" }
              as: ReceivingManager
              captures: { bk_id: $.data.id, bk_v: $.data.version }
            - call: "POST /stores/${st_id}/order-fulfillments"
              payload: { member_id: "${m_id}", order_kind: "OVERSIZE_CARRYOUT", pre_service_order_id: "${so_id}", booking_id: "${bk_id}", expected_booking_version: "${bk_v}" }
              as: ReceivingManager
              captures: { of_id: $.data.id }
            - call: "POST /stores/service-orders/${so_id}/schedule"
              payload: {}
              as: ServiceTechnician
            - call: "POST /stores/service-orders/${so_id}/start"
              payload: {}
              as: ServiceTechnician
            - call: "POST /stores/service-orders/${so_id}/complete"
              payload: {}
              as: ServiceTechnician
            - call: "POST /stores/service-orders/${so_id}/deliver"
              payload: {}
              as: ServiceTechnician
            - call: "POST /stores/bay-bookings/${bk_id}/check-in"
              payload: {}
              as: ReceivingManager
            - call: "POST /stores/order-fulfillments/${of_id}/release"
              payload: { rm_cross_check_code: "rm_7741" }
              as: ReceivingManager
            - call: "GET /stores/boat-deals/${d_id}"
              as: DealDeskClerk
          trigger:
            - call: "POST /stores/title-filings/${tf_id}/reject"
              payload: { rejection_reason: "agency rejected the lien block" }
              as: AgencyOperator
            - call: "GET /stores/boat-deals/${d_id}"
              as: DealDeskClerk
            - call: "GET /stores/boat-units/${bu_id}"
              as: DealDeskClerk
          assert:
            - "R0 is the GET issued as the last setup step; R1 is the GET issued immediately after the reject step"
            - "at R0 BoatDeal.${d_id}.deal_stage == DELIVERED and BoatDeal.${d_id}.settlement_variance_cents == 5075"
            - "at R1 BoatDeal.${d_id}.deal_stage == CONTRACTED, the cyclic revert hop, not a terminal state"
            - "at R1 BoatDeal.${d_id}.title_status == NOT_STARTED and BoatDeal.${d_id}.settlement_variance_cents == 0"
            - "at R1 BoatUnit.${bu_id}.status == AVAILABLE"
            - "at R1 BoatDeal.${d_id}.rigging_status == SCHEDULED, the fourth hop of the revert chain"
            - "BoatDeal.${d_id}.deal_stage is not SETTLED at R1, so the CONTRACTED -> DELIVERED transition can fire again"

      - name: attraction_session_fork_join_posture_gate
        grounds:
          - state_machines.AttractionSession.transitions.REQUESTED_to_CONFIRMED
          - state_machines.AttractionSession.transitions.REQUESTED_to_WAITLIST_FALLBACK
          - state_machines.AttractionSession.transitions.WAITLIST_FALLBACK_to_CONFIRMED
          - calculations.attraction_posture
          - calculations.event_dwell_charge
          - validations[priority=8]
        distinguishing_aspect: |
          AttractionSession exposes a fork-join rather than a cycle: a request
          forks to CONFIRMED or to WAITLIST_FALLBACK and both branches rejoin at
          CONFIRMED, with divergent side-effect sets per branch and a posture gate
          read from the parent Store that can flip between the two attempts.
        test_recipe:
          setup:
            - "A store with dwell_capacity_minutes 60000 at clock 2026-09-01T00:00Z and an AQUARIUM venue with capacity_units 40 and dwell_cost_minutes 30."
            - "One published FREE_DEMO offering on that venue, whose flat 15-minute dwell charge is already committed."
            - "One confirmed session for member M1 with party_size 39, which leaves one unit of venue capacity."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 40, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { at_id: $.data.id }
            - call: "POST /stores/attractions/${at_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_w1@x.com", full_name: "Wren One", donation_opt_in: false }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /stores/${st_id}/members"
