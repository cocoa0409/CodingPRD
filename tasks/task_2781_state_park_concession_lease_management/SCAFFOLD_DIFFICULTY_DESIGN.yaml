      - name: lease_fee_ledger_conserved_when_audit_findings_are_withdrawn
        grounds:
          - state_machines.AuditEngagement.FINAL_to_WITHDRAWN
          - state_machines.GrossReceiptsReport.RESTATED_to_ACCEPTED
          - state_machines.FeeReconciliation.SUPERSEDED_to_PENDING_PAYMENT
          - state_machines.FeeReconciliation.PENDING_PAYMENT_to_VOIDED
          - state_machines.ComplianceAction.NOTICE_ISSUED_to_RESCINDED
          - state_machines.Lease.compliance_status.DEFICIENT_to_COMPLIANT
          - entities.Lease.fields.outstanding_fee_balance_cents
        distinguishing_aspect: |
          A different conserved quantity: the lease's fee ledger. Withdrawing the findings
          must restore Lease.outstanding_fee_balance_cents to exactly the pre-audit
          1,300,000 — not to 0 (which is what an implementation that merely voids the
          replacement row and forgets to un-supersede the original produces) and not to
          3,786,000 or 2,486,000 (which is what one that leaves the replacement counted, or
