            - "cross-segment exactly-30-minute gap: signup for S4 created 201 REQUESTED (${sg4_status}) — 13:30 >= 13:00 + 30min passes at the boundary"

  - rule_id: compensating_invariant
    instances:
      - name: seat_conservation_cancel_promote_pair
        grounds:
          - calculations.shift_fill_posture
          - entities.Shift.fields.confirmed_count
          - state_machines.Signup.WAITLISTED_to_APPROVED
        distinguishing_aspect: |
          Conserved quantity: OCCUPIED SEATS. Pin: confirmed_count ==
          |signups in {APPROVED, CONFIRMED, CHECKED_IN, COMPLETED}|. A cancel
          (-1 seat) atomically paired with its compensating waitlist promotion
          (+1 seat) leaves the count unchanged (1 -> 0 -> 1, observed 1 == 1)
          and the shift back at FULL.
        test_recipe:
          setup:
            - "Shift headcount 1; S1 (V1) APPROVED occupying the seat, shift FULL; S2 (V2, returning) WAITLISTED"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Two", date_of_birth: "2000-01-02", is_returning: true }, as: Anonymous, captures: { v2: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/volunteers/${v2}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v2}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg2: $.data.id } }
            - { call: "GET /volunteer-ops/shifts/${sh}", as: VolunteerCoordinator, captures: { cnt_pre: $.data.confirmed_count, st_pre: $.data.status } }
          trigger:
            - { call: "POST /volunteer-ops/signups/${sg1}/cancel", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "GET /volunteer-ops/shifts/${sh}", as: VolunteerCoordinator, captures: { cnt_post: $.data.confirmed_count, st_post: $.data.status } }
            - { call: "GET /volunteer-ops/signups/${sg2}", as: VolunteerCoordinator, captures: { sg2_st: $.data.status } }
          assert:
            - "before: confirmed_count == 1 and status == FULL (${cnt_pre}/${st_pre})"
            - "after the cancel+promotion pair: confirmed_count == 1 and status == FULL (${cnt_post}/${st_post}) — occupied-seat invariant holds"
            - "the compensating promotion landed on Signup.${sg2}: status == APPROVED (${sg2_st})"
            - "invariant formula: confirmed_count == count(signups in {APPROVED,CONFIRMED,CHECKED_IN,COMPLETED}) — drift would show as cnt_post != cnt_pre"

      - name: stock_conservation_issue_return_pair
        grounds:
          - entities.SupplyInventory.fields.quantity_issued
          - state_machines.DistributionRecord.ISSUED_to_RETURNED
        distinguishing_aspect: |
          Conserved quantity: UNISSUED STOCK (quantity_total - quantity_issued), a
          different quantity than seats. Pin: quantity_issued == count of
          DistributionRecords (kind=SUPPLY_ITEM, status=ISSUED). An issue (+1)
          paired with its compensating return (-1) leaves the inventory exactly at
          its pre-issue value.
        test_recipe:
          setup:
            - "Event RACE_DAY; signup CHECKED_IN; inventory SAFETY_VEST quantity_total 3, quantity_issued 0"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T06:00:00Z", end_at: "2026-10-04T14:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/supply-inventories", payload: { event_id: "${ev}", item_code: "SAFETY_VEST", description: "Vest", quantity_total: 3 }, as: VolunteerCoordinator, captures: { inv: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg1}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/events/${ev}/lock-signups", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T06:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events/${ev}/start-race-day", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/signups/${sg1}/check-in", payload: {}, as: VolunteerCoordinator }
            - { call: "GET /volunteer-ops/supply-inventories/${inv}", as: VolunteerCoordinator, captures: { q0: $.data.quantity_issued } }
          trigger:
            - { call: "POST /volunteer-ops/distribution-records", payload: { signup_id: "${sg1}", kind: SUPPLY_ITEM, inventory_id: "${inv}" }, as: VolunteerCoordinator, captures: { d1: $.data.id } }
            - { call: "GET /volunteer-ops/supply-inventories/${inv}", as: VolunteerCoordinator, captures: { q1: $.data.quantity_issued } }
            - { call: "POST /volunteer-ops/distribution-records/${d1}/return", payload: {}, as: VolunteerCoordinator, captures: { d1_st: $.data.status } }
            - { call: "GET /volunteer-ops/supply-inventories/${inv}", as: VolunteerCoordinator, captures: { q2: $.data.quantity_issued } }
          assert:
            - "issue moved quantity_issued 0 -> 1 (${q0} -> ${q1})"
            - "compensating return moved it back 1 -> 0 (${q2} == ${q0}) — unissued stock conserved"
            - "DistributionRecord.${d1}.status == RETURNED (${d1_st}) with returned_at set"

      - name: credit_conservation_dispute_reverify_pair
        grounds:
          - calculations.fundraising_credit
          - state_machines.HourLog.DISPUTED_to_VERIFIED
          - state_machines.HourLog.PENDING_VERIFICATION_to_DISPUTED
        distinguishing_aspect: |
          Conserved quantity: SETTLED MONEY (cents), a different quantity than
          seats or stock units. Pin: settled_credit_cents == tier_credit(sum of
          VERIFIED effective hours). A dispute (removes the log from the settled
          pool) paired with its compensating re-verify (restores it) leaves the
          group's settled credit byte-identical: 2000 -> 0 -> 2000.
        test_recipe:
          setup:
            - "Group G; V1 with one 4h VERIFIED log (settled 2000); then the log is disputed and re-verified"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16, credit_weight: 1.0 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T06:00:00Z", end_at: "2026-10-04T10:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/fundraising-groups", payload: { event_id: "${ev}", name: "Track Club", charity_code: "CHARITY-TC" }, as: EventDirector, captures: { grp: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01", group_id: "${grp}" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg1}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/events/${ev}/lock-signups", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T06:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events/${ev}/start-race-day", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/signups/${sg1}/check-in", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-10-04T10:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/signups/${sg1}/check-out", payload: {}, as: VolunteerCoordinator }
            - { call: "GET /volunteer-ops/hour-logs?signup_id=${sg1}", as: VolunteerCoordinator, captures: { hl1: "$.data[0].id" } }
            - { call: "POST /volunteer-ops/hour-logs/${hl1}/verify", payload: {}, as: VolunteerCoordinator }
            - { call: "GET /volunteer-ops/fundraising-groups/${grp}/credit-summary", as: EventDirector, captures: { c_pre: $.data.settled_credit_cents } }
          trigger:
            - { call: "POST /volunteer-ops/hour-logs/${hl1}/dispute", payload: {}, as: VolunteerCoordinator }
            - { call: "GET /volunteer-ops/fundraising-groups/${grp}/credit-summary", as: EventDirector, captures: { c_mid: $.data.settled_credit_cents } }
            - { call: "POST /volunteer-ops/hour-logs/${hl1}/verify", payload: {}, as: VolunteerCoordinator }
            - { call: "GET /volunteer-ops/fundraising-groups/${grp}/credit-summary", as: EventDirector, captures: { c_post: $.data.settled_credit_cents, t_post: $.data.total_settled_credit_cents } }
          assert:
            - "settled before dispute == 2000 (${c_pre}: 4.00 verified h x 500)"
            - "settled during dispute == 0 (${c_mid}: DISPUTED logs leave the settled pool)"
            - "settled after re-verify == 2000 (${c_post} == ${c_pre}) — the dispute+reverify pair conserves settled credit exactly"
            - "total_settled_credit_cents after re-verify == 2100 (${t_post}: match 5% of 2000 restored too)"
