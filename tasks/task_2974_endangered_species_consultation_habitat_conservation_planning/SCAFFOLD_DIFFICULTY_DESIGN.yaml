            - "hop 5: GET /consultations/${consultation_id} reports status == 'REINITIATION_REQUIRED', reinitiation_count == 1 and reinitiation_triggered_at == '2027-05-20T00:00:00.000Z'"
            - "hop 6: GET /proponents/${proponent_id} reports open_reinitiation_count == 1, compliance_variant_applied == 'ROLLING_12_MONTH' (R1's period_end 2026-12-31 lies inside [2026-05-21, 2027-05-20]) and compliance_standing_score == 82.00 (a single OPEN_REINITIATION event of weight 18, age 0 days, so no decay)"
            - "the late R2 contributes NO penalty to that score: it is still SUBMITTED, and only ACCEPTED-and-late reports count"
            - "the funding fields are untouched by the whole cascade: endowment_required_cents == 5026514 and endowment_secured_cents == 5026514 with funding_status == 'FULLY_ASSURED'"
            - "POST /consultations/${consultation_id}/biological-assessment then unwinds hops 4 and 5 only — the consultation returns to 'UNDER_REVIEW', the action to 'FORMAL_CONSULTATION' with reinitiation_reason 'NONE', while the permit stays 'SUSPENDED' and the plan stays 'SUSPENDED_IMPLEMENTATION'"

      - name: species_uplisting_cascade_four_hops_from_registry_write
        grounds:
          - endpoints["POST /species/{id}/listing-change"]
          - entities.Species.fields.listing_change_count
          - entities.PresenceDetermination.fields.requires_reevaluation
          - state_machines[ProjectAction].transitions["CONSULTATION_CONCLUDED -> REINITIATION_PENDING"]
          - state_machines[Consultation].transitions["OPINION_ISSUED -> REINITIATION_REQUIRED"]
          - entities.Proponent.fields.open_reinitiation_count
          - complexity_profile.complexity_layers["cascading_side_effects"]
        distinguishing_aspect: >-
          DEPTH 4, triggered by a WILDLIFE-AGENCY REGISTRY WRITE on a Species
          row that the proponent neither owns nor references directly — the
          opposite direction of travel from the take-exceedance instance, which
          starts inside the proponent's own subtree. The cascade is also
          CONDITIONAL at hop 2: only presence determinations of the uplisted
          species, and only those in PRESENT or PRESUMED_PRESENT, are flagged,
          and the reinitiation_reason recorded at hop 3 is SPECIES_UPLISTED
          rather than TAKE_EXCEEDANCE.
        test_recipe:
          setup:
            - "The canonical registry chain at clock 2026-10-01 with both species, the bank, the proponent, the 200.00-acre NON_FEDERAL action, PD1 (SP-E, PRESENT, cites CHU-1) and PD2 (SP-T, PRESUMED_PRESENT)."
            - "The effect determination lands on LAA, the biological assessment is submitted and the biological opinion is issued, so the Consultation is OPINION_ISSUED and the ProjectAction is CONSULTATION_CONCLUDED with reinitiation_reason NONE. No HCP exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
