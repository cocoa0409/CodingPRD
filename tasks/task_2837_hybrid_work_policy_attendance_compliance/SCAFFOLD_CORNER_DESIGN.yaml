              as_user_id: "hrbp-1"
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-B1", work_email: "eb1@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_B", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e_b1: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-B2", work_email: "eb2@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_B", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e_b1}", iso_week: "2026-W37", week_start_date: "2026-09-07" }
              as: SystemIntegration
              as_user_id: "sys-1"
              captures: { w_b1: $.data.id }
            - call: "POST /attendance-weeks/${w_b1}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-08", minutes_present: 480, dedupe_key: "B1-0908" }
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "POST /attendance-weeks/${w_b1}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-09", minutes_present: 480, dedupe_key: "B1-0909" }
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "POST /attendance-weeks/${w_b1}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-10", minutes_present: 480, dedupe_key: "B1-0910" }
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "POST /attendance-weeks/${w_b1}/finalize"
              payload: {}
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "POST /policy-cycles/${cyc_id}/posture"
              payload: { target_posture: "RECALIBRATING", note: "boundary measurement" }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { cyc_v2: $.data.version }
            - call: "POST /recalibration-reviews"
              payload: { policy_cycle_id: "${cyc_id}", review_label: "R-EDGE", proposed_days_in_office_delta: 0 }
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
              captures: { rev1: $.data.id }
          trigger:
            - call: "POST /recalibration-reviews/${rev1}/submit"
              payload: {}
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
            - call: "POST /recalibration-reviews/${rev1}/decision"
              payload: { decision: "ADOPT", expected_policy_cycle_version: "${cyc_v2}", decision_reason: "no change, measures are exactly on target" }
              as: ComplianceAuditor
              as_user_id: "aud-1"
            - call: "GET /teams/${t_a}"
              payload: {}
              as: WorkplaceProgramOffice
              as_user_id: "wpo-1"
          assert:
            - "Call 1: collaboration_index == 60.00 - T-A is the only team with a settled week and its sub_score is round_half_up(100 * 3 / 5, 2) == 60.00 - and meets_collaboration_target == true because the comparison is INCLUSIVE against the 60.00 target"
            - "Call 1: qualifying_band_count == 2 with BAND_A at 100.00 (2 of 2 compliant, neither has a week) and BAND_B at 50.00 (B2 compliant, B1 in BREACH), so equity_variance_pct == 50.00"
            - "Call 1: equity_flag == false even though equity_variance_pct EQUALS equity_variance_threshold_pct - the comparison is STRICT, and a threshold of 49.99 would have flipped it to true"
            - "Call 1: PolicyCycle.${cyc_id}.aggregate_compliance_rate == round_half_up(100 * 3 / 4, 2) == 75.00 and total_space_chargeback_cents == 0"
            - "Call 2: HTTP 200 with state == 'ADOPTED' - the strict equity comparison is what makes this adoption legal; an inclusive one would have answered ERR_EQUITY_FLAG_BLOCKS_ADOPTION"
            - "Call 2: posture back to 'OPEN', PolicyCycle.version == 3, decided_by_user_id == 'aud-1'"
            - "Call 3: Team.${t_a}.expected_days_in_office_per_week is STILL 3 and entitled_seats is still 10 - a zero delta adopts without moving anything, so the adoption path is proven independent of the shift arithmetic"

      - name: both_credited_day_variants_run_on_the_same_evidence
        claim_type: dual_variant_calculation
        grounds:
          - calculations.credited_office_days.variants
        excluded_because:
          difficulty_instance: credited_days_union_versus_corroborated
          rationale: "That §1.8 instance is the layer's canonical test: identical signal sets, two teams differing only in signal_corroboration_required, divergent credited_days and the variant_applied stamp on each week. The §1.9 calculations section already defers to it."

      - name: one_finalize_propagates_through_six_causal_links
        claim_type: cascading_side_effects
        grounds:
          - state_machines.AttendanceWeek.OPEN_to_FINALIZED.side_effects
        excluded_because:
          difficulty_instance: finalize_week_depth_six_to_cycle_totals
          rationale: "That §1.8 instance walks the full depth-six chain from week to cycle roll-ups, and employee_separation_fan_out_cascade plus exception_approval_depth_five_relief_cascade cover the fan-out and the reversal directions. The §1.9 consistency instance re-reads the same chain for visibility timing only."

      - name: the_neighborhood_occ_carrier_under_a_competing_ceiling
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[seat-allocation-create-stale-neighborhood]
        excluded_because:
          difficulty_instance: stale_neighborhood_version_outranks_seat_entitlement
          rationale: "That §1.8 instance covers the third OCC carrier together with its precedence against the band-70 entitlement ceiling. The §1.9 instances above already assert the two remaining carriers and the no-bump-on-failure property of this one."

  - section: consistency_model
    instances:

      - name: every_derived_field_is_current_in_the_same_response_and_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.AttendanceWeek.OPEN_to_FINALIZED.side_effects
        distinguishing_aspect: "The declared model is IMMEDIATE, so a single finalize must leave nothing to settle: the finalize response itself carries the recomputed week, and four separate reads issued straight afterwards - employee, team, cycle and the newly created escalation case - must already agree with it. No field may require a second call, a retry or a delay to become correct."
        test_recipe:
          setup:
            - "Cycle, team T-A (12 planned, 3 expected days), employee E-1001 with no classification (required_days 5, multiplier 1.5), and an OPEN 2026-W37 week carrying three 480-minute BADGE signals."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN66", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-A", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t_a: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-1001", work_email: "e1001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id }
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e1_id}", iso_week: "2026-W37", week_start_date: "2026-09-07" }
              as: SystemIntegration
              as_user_id: "sys-1"
              captures: { w37: $.data.id }
            - call: "POST /attendance-weeks/${w37}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-08", minutes_present: 480, dedupe_key: "B-0908" }
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "POST /attendance-weeks/${w37}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-09", minutes_present: 480, dedupe_key: "B-0909" }
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "POST /attendance-weeks/${w37}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-10", minutes_present: 480, dedupe_key: "B-0910" }
              as: SystemIntegration
              as_user_id: "sys-1"
          trigger:
            - call: "POST /attendance-weeks/${w37}/finalize"
              payload: {}
              as: SystemIntegration
              as_user_id: "sys-1"
            - call: "GET /employees/${e1_id}"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "GET /teams/${t_a}"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "GET /policy-cycles/${cyc_id}"
              payload: {}
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
            - call: "GET /escalation-cases?employee_id=${e1_id}"
              payload: { employee_id: "${e1_id}" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { case_id: "$.data[0].id" }
            - call: "GET /attendance-weeks?employee_id=${e1_id}&status=FINALIZED"
              payload: { employee_id: "${e1_id}", status: "FINALIZED" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
          assert:
            - "Call 1: the finalize RESPONSE ITSELF already carries required_days 5, credited_days 3, relief_days_credited 0, shortfall_days 2, variant_applied 'SIGNAL_UNION', status 'FINALIZED' and finalized_at '2026-09-01T09:00:00Z' - no follow-up read is needed to see them"
            - "Call 2: Employee.${e1_id} already reads cumulative_shortfall_days 2, consecutive_breach_weeks 1, non_compliance_pressure round_half_up(2 * 1.5 + 1 * 1.0, 2) == 4.00, compliance_state 'BREACH' and escalation_stage 'WRITTEN_WARNING'"
            - "Call 3: Team.${t_a} already reads escalated_headcount 1 and formal_action_count 1"
            - "Call 4: PolicyCycle.${cyc_id} already reads aggregate_compliance_rate round_half_up(100 * 0 / 1, 2) == 0.00 and formal_action_total 1"
            - "Call 5: the EscalationCase created by the cascade is already listable, total_count == 1, stage == 'WRITTEN_WARNING' (the cascade opened it at COACHING and advanced it in the same call), opened_pressure == 4.00, discretionary_hold == false and prior_case_id == null"
            - "Call 6: total_count == 1 and has_more == false, so the status index reflects the transition immediately as well"
            - "Repeating calls 2 to 6 a second time returns byte-identical bodies apart from meta.api_request_id - nothing settles late and nothing drifts on re-read"
