            - call: "POST /pace/disbursements"
              payload: { application_id: "${a1}", completion_certificate_id: "${cc1}", contractor_id: "${c1}", amount_cents: 1500000 }
              as: FundingOfficer
              as_user_id: "u_fund_r"
              captures: { err_payable: $.data.error_id }
            - call: "POST /pace/disbursements"
              payload: { application_id: "${a1}", completion_certificate_id: "${cc1}", contractor_id: "${c1}", amount_cents: 1200000 }
              as: FundingOfficer
