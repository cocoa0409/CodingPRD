          trigger:
            - { call: "POST /v1/commissioning-checklists/${cc_ag}/submit", payload: {}, as: ProjectManager, captures: { cc_ag_err: $.data.error_id } }
            - { call: "POST /v1/alignment-records/${ar_ag}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/commissioning-checklists/${cc_ag}/submit", payload: {}, as: ProjectManager, captures: { cc_ag_status: $.data.status } }
          assert:
            - "First submit fails with error_id ERR_ALIGNMENT_OUTSTANDING (a RECORDED record is still pending review)"
            - "After accepting the PASS record, submit succeeds: CommissioningChecklist.${cc_ag}.status == SUBMITTED (${cc_ag_status})"

  - rule_id: resource_temporal_overlap
    instances:
      - name: crane_booking_half_open_adjacency
        grounds:
          - calculations.crane_window_commitment
          - validations[priority=24]
        distinguishing_aspect: |
          Half-open interval semantics on the crane_ref booking pool (via POST /v1/lift-permits):
          a window starting exactly when another ends ([10:00,14:00) then [14:00,18:00)) is NOT a
          conflict, while true overlap ([13:00,15:00)) is. Sibling uses buffered-gap semantics on
          a different resource (lockout feeders).
        test_recipe:
          setup:
            - "Project in INSTALLING with approved rigging plan; crane CR-9 booked 2026-08-10 10:00-14:00 (ISSUED); clock 2026-08-08"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Crane Pool Job", customer_name: "Acme", site_address: "16 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_o: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_o}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_o: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_o}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_o}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_o}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_o: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_o}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_o}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/projects/${p_o}/advance", payload: {}, as: ProjectManager, captures: { p_o_v: $.data.version } }
            - { call: "POST /v1/rigging-plans", payload: { project_id: "${p_o}", expected_project_version: "${p_o_v}", lift_weight_tons: 40, crane_model: "GROVE GMK5250", planned_crane_capacity_tons: 50, rigging_config: SINGLE_CRANE }, as: SiteSupervisor, captures: { rp_o: $.data.id } }
            - { call: "POST /v1/rigging-plans/${rp_o}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/rigging-plans/${rp_o}/review", payload: { outcome: APPROVED }, as: ProjectManager }
            - { call: "POST /v1/lift-permits", payload: { project_id: "${p_o}", crane_ref: "CR-9", lift_starts_at: "2026-08-10T10:00:00Z", lift_ends_at: "2026-08-10T14:00:00Z", road_permit_required: false }, as: SiteSupervisor, captures: { lp_o1: $.data.id } }
          trigger:
            - { call: "POST /v1/lift-permits", payload: { project_id: "${p_o}", crane_ref: "CR-9", lift_starts_at: "2026-08-10T14:00:00Z", lift_ends_at: "2026-08-10T18:00:00Z", road_permit_required: false }, as: SiteSupervisor, captures: { lp_o2: $.data.id, lp_o2_status: $.data.status } }
            - { call: "POST /v1/lift-permits", payload: { project_id: "${p_o}", crane_ref: "CR-9", lift_starts_at: "2026-08-10T13:00:00Z", lift_ends_at: "2026-08-10T15:00:00Z", road_permit_required: false }, as: SiteSupervisor, captures: { lp_o3_err: $.data.error_id } }
            - { call: "POST /v1/lift-permits", payload: { project_id: "${p_o}", crane_ref: "CR-10", lift_starts_at: "2026-08-10T13:00:00Z", lift_ends_at: "2026-08-10T15:00:00Z", road_permit_required: false }, as: SiteSupervisor, captures: { lp_o4: $.data.id, lp_o4_status: $.data.status } }
          assert:
            - "Adjacent window [14:00,18:00) on CR-9 succeeds (${lp_o2_status} == ISSUED) — half-open adjacency is not a conflict"
            - "Overlapping window [13:00,15:00) on CR-9 fails with error_id ERR_CRANE_WINDOW_CONFLICT"
            - "Same window on a different crane CR-10 succeeds (${lp_o4_status} == ISSUED) — the pool is per crane_ref"

      - name: lockout_buffer_clearance
        grounds:
          - validations[priority=23]
        distinguishing_aspect: |
          Buffered-gap interval semantics on the feeder lockout pool (via POST /v1/lockout-windows):
          a new window must keep >= 30 minutes clearance — a gap of exactly 30 minutes passes while
          15 minutes fails; adjacency (gap 0) would also fail, unlike the crane pool's half-open rule.
          Different resource entity and different interval arithmetic from the sibling instance.
        test_recipe:
          setup:
            - "Project with ACTIVE safety plan; existing SCHEDULED lockout on feeder F-1 for 2026-08-10 10:00-14:00; clock at default 2026-08-01"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "LOTO Job", customer_name: "Acme", site_address: "17 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_w2: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_w2}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_w2: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_w2}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/lockout-windows", payload: { project_id: "${p_w2}", feeder_id: "F-1", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T14:00:00Z" }, as: SafetyOfficer, captures: { lw_w1: $.data.id } }
          trigger:
            - { call: "POST /v1/lockout-windows", payload: { project_id: "${p_w2}", feeder_id: "F-1", starts_at: "2026-08-10T14:30:00Z", ends_at: "2026-08-10T16:00:00Z" }, as: SafetyOfficer, captures: { lw_w2: $.data.id, lw_w2_status: $.data.status } }
            - { call: "POST /v1/lockout-windows", payload: { project_id: "${p_w2}", feeder_id: "F-1", starts_at: "2026-08-10T14:15:00Z", ends_at: "2026-08-10T15:00:00Z" }, as: SafetyOfficer, captures: { lw_w3_err: $.data.error_id } }
            - { call: "POST /v1/lockout-windows", payload: { project_id: "${p_w2}", feeder_id: "F-2", starts_at: "2026-08-10T11:00:00Z", ends_at: "2026-08-10T12:00:00Z" }, as: SafetyOfficer, captures: { lw_w4: $.data.id, lw_w4_status: $.data.status } }
          assert:
            - "Gap of exactly 30 minutes (14:30 start) succeeds (${lw_w2_status} == SCHEDULED) — buffer rule is >="
            - "Gap of 15 minutes (14:15 start) fails with error_id ERR_LOCKOUT_CONFLICT"
            - "Overlapping window on a different feeder F-2 succeeds (${lw_w4_status} == SCHEDULED) — the buffer is per feeder_id"

  - rule_id: compensating_invariant
    instances:
      - name: labor_approve_reject_conserves_rollup
        grounds:
          - state_machines.LaborEntry.APPROVED_to_REJECTED
          - calculations.project_cost_rollup
        distinguishing_aspect: |
          Conserved quantity is approved labor CENTS: approve (adds total_cost_cents) followed by
          its compensating reject-from-APPROVED (subtracts the same amount) leaves
          Project.approved_labor_cents identical to its pre-approve value. Sibling conserves
          crane-HOURS — a different quantity.
        test_recipe:
          setup:
            - "Project with one 8h MW_JOURNEYMAN DAY labor entry (total_cost_cents 84800), submitted by sup-1"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Invariant Job", customer_name: "Acme", site_address: "18 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_i: $.data.id } }
            - { call: "POST /v1/labor-entries", payload: { project_id: "${p_i}", worker_ref: "U-9001", classification: MW_JOURNEYMAN, work_date: "2026-08-08", hours_worked: 8, shift: DAY }, as: SiteSupervisor, captures: { le_i: $.data.id } }
            - { call: "POST /v1/labor-entries/${le_i}/submit", payload: {}, as: SiteSupervisor, as_user_id: sup-1 }
            - { call: "GET /v1/projects/${p_i}", payload: {}, as: ProjectManager, captures: { p_i_pre: $.data.approved_labor_cents } }
          trigger:
            - { call: "POST /v1/labor-entries/${le_i}/approve", payload: {}, as: PayrollClerk, as_user_id: pay-1 }
            - { call: "GET /v1/projects/${p_i}", payload: {}, as: ProjectManager, captures: { p_i_mid: $.data.approved_labor_cents } }
            - { call: "POST /v1/labor-entries/${le_i}/reject", payload: { reason: "duplicate timecard" }, as: PayrollClerk, as_user_id: pay-2 }
            - { call: "GET /v1/projects/${p_i}", payload: {}, as: ProjectManager, captures: { p_i_post: $.data.approved_labor_cents } }
          assert:
            - "Before approve: approved_labor_cents == 0 (${p_i_pre})"
            - "After approve: approved_labor_cents == 84800 (${p_i_mid})"
            - "After compensating reject: approved_labor_cents == 0 (${p_i_post} == ${p_i_pre}) — invariant holds with zero drift"
            - "LaborEntry.${le_i}.status == REJECTED"

      - name: crane_booking_create_cancel_conserves_commitment
        grounds:
          - state_machines.LiftPermit.ISSUED_to_CANCELLED
          - calculations.crane_window_commitment
        distinguishing_aspect: |
          Conserved quantity is committed crane-HOURS per crane_ref: create (commits 4.0 hours)
          followed by its compensating cancel (releases them) returns the crane_ref pool to zero,
          observably allowing an identical window to be rebooked without conflict. Sibling
          conserves labor cents — a different quantity.
        test_recipe:
          setup:
            - "Project in INSTALLING with approved rigging plan; clock 2026-08-08"
          setup_api_calls:
            - { call: "POST /v1/projects", payload: { name: "Release Job", customer_name: "Acme", site_address: "19 Plant Rd", billing_mode: TM, contract_amount_cents: 5000000, equipment_hourly_rate_cents: 45000, retainage_pct: 0.10, ot_basis: DAILY_OT }, as: ProjectManager, captures: { p_k: $.data.id } }
            - { call: "POST /v1/safety-plans", payload: { project_id: "${p_k}", plan_document_ref: "DOC-SP-1", loto_procedure_ref: "DOC-LOTO-1" }, as: SafetyOfficer, captures: { sp_k: $.data.id } }
            - { call: "POST /v1/safety-plans/${sp_k}/activate", payload: {}, as: SafetyOfficer }
            - { call: "POST /v1/projects/${p_k}/advance", payload: {}, as: ProjectManager }
            - { call: "POST /v1/site-surveys", payload: { project_id: "${p_k}", survey_date: "2026-08-01", anchor_bolt_count: 24, anchor_tolerance_mm: 3.0, anchor_measured_max_deviation_mm: 1.5, overhead_clearance_mm: 6000, foundation_pour_date: "2026-08-01T00:00:00Z" }, as: SiteSupervisor, captures: { ss_k: $.data.id } }
            - { call: "POST /v1/site-surveys/${ss_k}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T00:00:00Z" }, as: ProjectManager }
            - { call: "POST /v1/site-surveys/${ss_k}/review", payload: { outcome: ACCEPTED }, as: ProjectManager }
            - { call: "POST /v1/projects/${p_k}/advance", payload: {}, as: ProjectManager, captures: { p_k_v: $.data.version } }
            - { call: "POST /v1/rigging-plans", payload: { project_id: "${p_k}", expected_project_version: "${p_k_v}", lift_weight_tons: 40, crane_model: "GROVE GMK5250", planned_crane_capacity_tons: 50, rigging_config: SINGLE_CRANE }, as: SiteSupervisor, captures: { rp_k: $.data.id } }
            - { call: "POST /v1/rigging-plans/${rp_k}/submit", payload: {}, as: SiteSupervisor }
            - { call: "POST /v1/rigging-plans/${rp_k}/review", payload: { outcome: APPROVED }, as: ProjectManager }
          trigger:
            - { call: "POST /v1/lift-permits", payload: { project_id: "${p_k}", crane_ref: "CR-5", lift_starts_at: "2026-08-10T10:00:00Z", lift_ends_at: "2026-08-10T14:00:00Z", road_permit_required: false }, as: SiteSupervisor, captures: { lp_k1: $.data.id, lp_k1_dur: $.data.duration_hours } }
            - { call: "POST /v1/lift-permits/${lp_k1}/cancel", payload: {}, as: SiteSupervisor, captures: { lp_k1_status: $.data.status } }
            - { call: "POST /v1/lift-permits", payload: { project_id: "${p_k}", crane_ref: "CR-5", lift_starts_at: "2026-08-10T10:00:00Z", lift_ends_at: "2026-08-10T14:00:00Z", road_permit_required: false }, as: SiteSupervisor, captures: { lp_k2: $.data.id, lp_k2_status: $.data.status } }
          assert:
            - "Created window commits duration_hours == 4.0 (${lp_k1_dur}) to crane CR-5"
            - "Cancel releases the commitment: LiftPermit.${lp_k1}.status == CANCELLED (${lp_k1_status})"
            - "Rebooking the identical window succeeds (${lp_k2_status} == ISSUED) — committed hours returned to zero with no drift"
