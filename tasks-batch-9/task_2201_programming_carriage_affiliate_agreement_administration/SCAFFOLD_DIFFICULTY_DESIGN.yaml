  # ===========================================================================
  # RULE 8 — resource_temporal_overlap
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    rule_summary: >-
      Two contended resources with deliberately OPPOSITE interval semantics, plus
      an aggregate-capacity resource. RightsWindow uses half-open [start, end)
      with strict < and no buffer, so a zero-length gap is legal but a one-second
      overlap is not. BlackoutRule uses closed [start, end] plus a 24-hour
      separation buffer with <=, so a gap of EXACTLY 24 hours is illegal on the
      same key where the window resource happily accepts a gap of zero. The third
      instance replaces pairwise exclusion with a counted ceiling of three
      simultaneous non-exclusive licensees, and shows the slot being recycled.
    instances:

      - instance_id: RT-1
        name: rights_window_adjacency_legal_but_one_second_overlap_rejected
        grounds:
          - calculations.rights_window_occupancy
          - validations[priority=60]
          - errors[ERR_WINDOW_EXCLUSIVITY_CONFLICT]
          - entities.RightsWindow.fields.concurrent_licensee_count
        title: "RightsWindow half-open [start, end): a zero gap is legal, a one-second overlap is not"
        resource: "RightsWindow occupancy on key (content_title_id, platform, territory_code) = (t1, STREAMING, US)"
        interval_semantics: "HALF-OPEN [window_start, window_end), strict < on both sides, no separation buffer. prev.window_end == next.window_start does NOT overlap."
        rationale: >-
          Licensing windows are contiguous by design — a distributor's September
          window is meant to hand straight over to its October window with no dark
          second in between — so back-to-back adjacency must be legal. That forces
          strict inequality on both comparisons, which in turn makes the smallest
          possible violation a single second of true intersection.
        distinguishing_aspect: >-
          Three clears on the same key: [09-01, 09-08) succeeds with
          concurrent_licensee_count == 0; the abutting [09-08, 09-15) also succeeds
          with concurrent_licensee_count == 0 even though its start equals the
          first window's end; and a one-second window [09-07T23:59:59,
          09-08T00:00:00) is rejected 409 ERR_WINDOW_EXCLUSIVITY_CONFLICT. An
          implementation using <= on either comparison fails the second clear; one
          using a day-granularity comparison misses the third.
        test_recipe:
          setup: >-
            Northgate's agreement runs 2024-01-01..2027-12-31 and a fully cleared
            title premieres on linear 2026-08-15, so every STREAMING window below
            clears the 7-day holdback and lies inside the term. Three EXCLUSIVE
            STREAMING/US windows are planned: the first week of September, the
            abutting second week, and a one-second window that ends exactly where
            the second begins but starts one second before the first one ends.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Northgate Cable Systems"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 4000000
                credit_limit_cents: 500000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d1_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d1_id}"
                contract_code: "NG-2024-01"
                term_start_date: "2024-01-01T00:00:00Z"
                term_end_date: "2027-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 42.0000
                escalator_pct: 0.04
                penetration_floor_pct: 0.85
                committed_tier: "EXPANDED_BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a1_id: "id"
            - call: "POST /carriage/agreements/${a1_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a1_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/content-titles"
              payload:
                title: "Grand Finale Special"
                home_territory_code: "US"
                linear_premiere_at: "2026-08-15T00:00:00Z"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                t1_id: "id"
            - call: "POST /carriage/content-titles/${t1_id}/rights-status"
              payload:
                rights_status: "OWNED_CLEARED"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
            - call: "POST /carriage/rights-windows"
              payload:
                agreement_id: "${a1_id}"
                content_title_id: "${t1_id}"
                platform: "STREAMING"
                territory_code: "US"
                window_start: "2026-09-01T00:00:00Z"
                window_end: "2026-09-08T00:00:00Z"
                exclusivity: "EXCLUSIVE"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                wA_id: "id"
            - call: "POST /carriage/rights-windows/${wA_id}/lifecycle"
              payload:
                action: "CLEAR"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                wA_status: "status"
                wA_count: "concurrent_licensee_count"
            - call: "POST /carriage/rights-windows"
              payload:
                agreement_id: "${a1_id}"
                content_title_id: "${t1_id}"
                platform: "STREAMING"
                territory_code: "US"
                window_start: "2026-09-08T00:00:00Z"
                window_end: "2026-09-15T00:00:00Z"
                exclusivity: "EXCLUSIVE"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                wB_id: "id"
            - call: "POST /carriage/rights-windows/${wB_id}/lifecycle"
              payload:
                action: "CLEAR"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
