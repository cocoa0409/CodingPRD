      - name: ingredient_lot_qc_pass_requires_supplier_qualified
        grounds:
          - state_machines.IngredientLot.PENDING_QC_to_QC_PASSED
          - validations[priority=9]
        distinguishing_aspect: |
          IngredientLot.qc-pass depends on Supplier.qualification_status == QUALIFIED
          (cross-entity: IngredientLot -> Supplier). A lot from a PENDING_AUDIT supplier
