  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: screen_occupancy_half_open_so_next_show_may_start_exactly_at_blocked_until
        grounds:
          - calculations.screen_slot_block
          - validations[priority=14]
          - errors[ERR_SCREEN_SLOT_CONFLICT]
          - entities.Showtime.blocked_until
          - entities.Venue.turnaround_minutes
        distinguishing_aspect: |
          Resource: the venue's single SCREEN. Interval semantics: HALF-OPEN [start_at, blocked_until), with
          the turnaround appended to the tail only. A showtime therefore may start at the exact millisecond the
          previous one's block ends, and is refused one minute earlier. Contrast the sibling instances: the KDM
          resource uses a CLOSED interval where touching IS a collision, and the ingest-lane resource permits
          overlap outright up to a count.
        test_recipe:
          setup:
