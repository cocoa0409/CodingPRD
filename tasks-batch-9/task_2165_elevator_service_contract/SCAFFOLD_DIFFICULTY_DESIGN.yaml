              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/callbacks"
              payload: { car_id: "${v1_id}", callback_type: "MALFUNCTION", out_of_service: false }
              as: BuildingManager
              as_user_id: "bm-v"
              captures: { cbv_id: $.data.id }
            - call: "POST /elevator-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T11:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/callbacks/${cbv_id}/arrive"
              payload: {}
              as: ServiceContractor
              as_user_id: "sc-v"
            - call: "POST /elevator-program/callbacks/${cbv_id}/clear"
              payload: { resolution_note: "late arrival" }
              as: ServiceContractor
              as_user_id: "sc-v"
            - call: "POST /elevator-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /elevator-program/contracts/${kv_id}"
              payload: {}
