# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 3278: breadth coverage of §1.1–§1.7 claims not covered by §1.8.
# Logical-clock default before any set_current_utc call: 2026-09-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:

  # ------------------------------------------------------------- entities
  - section: entities
    instances:
      - name: member_creation_defaults_applied
        claim_type: creation_defaults
        grounds:
          - "entities.Member.fields.wallet_credit_cents"
          - "entities.Member.fields.data_sharing_posture"
        distinguishing_aspect: "New member starts ACTIVE, wallet 0, posture NORMAL; system fields id/created_at/version=1 minted by server."
        test_recipe:
          setup: ["empty DB; clock default 2026-09-01"]
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "d1@x.com", full_name: "D One" }
              as: Anonymous
              captures: { md1: $.data.id, md1_wallet: "$.data.wallet_credit_cents", md1_posture: "$.data.data_sharing_posture", md1_status: "$.data.member_status", md1_v: "$.data.version" }
          assert:
            - "md1_status == ACTIVE, md1_wallet == 0, md1_posture == NORMAL, md1_v == 1"
            - "id is a UUID with no type prefix"

      - name: member_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "validations[priority=4]"
        distinguishing_aspect: "GET with a well-formed but nonexistent member id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /members/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Support
              captures: { nf_err: "$.data.error_id" }
          assert:
            - "nf_err == ERR_NOT_FOUND with http 404"

      - name: term_creation_missing_required_field
        claim_type: required_fields
        grounds:
          - "errors[ERR_INVALID_REQUEST]"
          - "validations[priority=5]"
        distinguishing_aspect: "Omitting required commitment_months from term creation returns ERR_INVALID_REQUEST 400 before any state change."
        test_recipe:
          setup: ["member exists"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "d2@x.com", full_name: "D Two" }
              as: Anonymous
              captures: { md2: $.data.id }
          trigger:
            - call: "POST /members/${md2}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${md2}"
              captures: { inv_err: "$.data.error_id" }
          assert:
            - "inv_err == ERR_INVALID_REQUEST with http 400"

      - name: device_serial_uniqueness_enforced
        claim_type: type_constraint
        grounds:
          - "entities.Device.fields.serial_number"
          - "errors[ERR_SERIAL_NUMBER_TAKEN]"
        distinguishing_aspect: "Second device with an already-registered serial_number is rejected ERR_SERIAL_NUMBER_TAKEN 409."
        test_recipe:
          setup: ["member with ACTIVE term; device SN-DUP provisioned"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "d3@x.com", full_name: "D Three" }
              as: Anonymous
              captures: { md3: $.data.id }
            - call: "POST /members/${md3}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${md3}"
              captures: { td3: $.data.id }
            - call: "POST /devices"
              payload: { member_id: "${md3}", term_id: "${td3}", serial_number: "SN-DUP", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
          trigger:
            - call: "POST /devices"
              payload: { member_id: "${md3}", term_id: "${td3}", serial_number: "SN-DUP", hardware_tier: "BAND_PRO" }
              as: PlatformAdmin
              captures: { dup_err: "$.data.error_id" }
          assert:
            - "dup_err == ERR_SERIAL_NUMBER_TAKEN"

      - name: study_status_computed_from_window
        claim_type: computed_fields
        grounds:
          - "entities.ResearchStudy.fields.study_status"
        distinguishing_aspect: "study_status is derived from the logical clock against the enrollment window: inside -> RECRUITING; after window end -> CLOSED."
        test_recipe:
          setup: ["study with window 2026-09-01..2026-09-10"]
          setup_api_calls:
            - call: "POST /research-studies"
              payload: { code: "S1", title: "Study One", min_paid_months: 0, enrollment_window_start_on: "2026-09-01", enrollment_window_end_on: "2026-09-10" }
              as: PlatformAdmin
              captures: { st1: $.data.id, st1_status: "$.data.study_status" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /research-studies/${st1}"
              payload: {}
              as: PlatformAdmin
              captures: { st1_status2: "$.data.study_status" }
          assert:
            - "st1_status == RECRUITING at creation (clock 2026-09-01 within window)"
            - "st1_status2 == CLOSED after clock advanced past window end"

      - name: fk_reverse_reachability_lists
        claim_type: parent_relationships
        grounds:
          - "entities.MembershipTerm.fields.member_id"
          - "entities.Device.fields.member_id"
          - "entities.ResearchEnrollment.fields.member_id"
        distinguishing_aspect: "Every FK has a reverse GET: member sub-resource lists and filtered device list return arrays scoped to the parent."
        test_recipe:
          setup: ["member with one term and one provisioned device"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "d4@x.com", full_name: "D Four" }
              as: Anonymous
              captures: { md4: $.data.id }
            - call: "POST /members/${md4}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${md4}"
              captures: { td4: $.data.id }
            - call: "POST /devices"
              payload: { member_id: "${md4}", term_id: "${td4}", serial_number: "SN-D4", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
          trigger:
            - call: "GET /members/${md4}/terms"
              payload: {}
              as: Member
              as_user_id: "${md4}"
              captures: { n_terms: "$.meta" }
            - call: "GET /devices"
              payload: { member_id: "${md4}" }
              as: Support
          assert:
            - "GET /members/${md4}/terms returns array of length 1 containing term ${td4}"
            - "GET /devices?member_id=${md4} returns array of length 1 with serial SN-D4"

  # ------------------------------------------------------------- state_machines
  - section: state_machines
    instances:
      - name: term_invalid_transition_resume_when_active
        claim_type: invalid_transition
        grounds:
          - "state_machines.MembershipTerm.PAUSED_to_ACTIVE"
          - "errors[ERR_TERM_NOT_PAUSED]"
        distinguishing_aspect: "resume on an ACTIVE term (not PAUSED) is rejected ERR_TERM_NOT_PAUSED 409; no window is touched."
        test_recipe:
          setup: ["member with ACTIVE term"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "s1@x.com", full_name: "S One" }
              as: Anonymous
              captures: { ms1: $.data.id }
            - call: "POST /members/${ms1}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${ms1}"
              captures: { ts1: $.data.id }
          trigger:
            - call: "POST /terms/${ts1}/resume"
              payload: {}
              as: Member
              as_user_id: "${ms1}"
              captures: { res_err: "$.data.error_id" }
          assert:
            - "res_err == ERR_TERM_NOT_PAUSED"
            - "Term.${ts1}.term_status still ACTIVE"

      - name: terminal_state_lockdown_replacement_decide_twice
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.ReplacementRequest"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "A REJECTED replacement request is terminal: a second decide returns ERR_INVALID_STATE_TRANSITION and the device state is untouched."
        test_recipe:
          setup: ["member with ACTIVE term, ACTIVE device, request decided REJECT/USER_DAMAGE (device stays SUSPECT_FAULT)"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "s2@x.com", full_name: "S Two" }
              as: Anonymous
              captures: { ms2: $.data.id }
            - call: "POST /members/${ms2}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${ms2}"
              captures: { ts2: $.data.id }
            - call: "POST /devices"
              payload: { member_id: "${ms2}", term_id: "${ts2}", serial_number: "SN-S2", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
              captures: { ds2: $.data.id }
            - call: "POST /devices/${ds2}/activate"
              payload: {}
              as: Member
              as_user_id: "${ms2}"
            - call: "POST /devices/${ds2}/replacement-requests"
              payload: { reason: "BATTERY_DRAIN" }
              as: Member
              as_user_id: "${ms2}"
              captures: { rs2: $.data.id }
            - call: "POST /replacement-requests/${rs2}/decide"
              payload: { decision: "REJECT", diagnosis: "USER_DAMAGE" }
              as: Support
          trigger:
            - call: "POST /replacement-requests/${rs2}/decide"
              payload: { decision: "APPROVE" }
              as: Support
              captures: { term_err: "$.data.error_id" }
          assert:
            - "term_err == ERR_INVALID_STATE_TRANSITION"
            - "Device.${ds2}.device_status == SUSPECT_FAULT (unchanged; USER_DAMAGE does not restore)"

      - name: duplicate_ingest_same_day_rejected
        claim_type: invalid_transition
        grounds:
          - "errors[ERR_DUPLICATE_METRIC_DAY]"
          - "calculations.metric_scores"
        distinguishing_aspect: "Second ingest for the same member and day_on is rejected ERR_DUPLICATE_METRIC_DAY; first metric set unchanged."
        test_recipe:
          setup: ["member with ACTIVE term, ACTIVE device, one ingest for 2026-09-01"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "s3@x.com", full_name: "S Three" }
              as: Anonymous
              captures: { ms3: $.data.id }
            - call: "POST /members/${ms3}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${ms3}"
              captures: { ts3: $.data.id }
            - call: "POST /devices"
              payload: { member_id: "${ms3}", term_id: "${ts3}", serial_number: "SN-S3", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
              captures: { ds3: $.data.id }
            - call: "POST /devices/${ds3}/activate"
              payload: {}
              as: Member
              as_user_id: "${ms3}"
            - call: "POST /devices/${ds3}/ingest"
              payload: { day_on: "2026-09-01", avg_hr: 100, hrv_ms: 100, resting_hr: 50, sleep_minutes: 480 }
              as: Member
              as_user_id: "${ms3}"
          trigger:
            - call: "POST /devices/${ds3}/ingest"
              payload: { day_on: "2026-09-01", avg_hr: 90, hrv_ms: 90, resting_hr: 55, sleep_minutes: 400 }
              as: Member
              as_user_id: "${ms3}"
              captures: { dup_day_err: "$.data.error_id" }
          assert:
            - "dup_day_err == ERR_DUPLICATE_METRIC_DAY"
            - "The original metric set for 2026-09-01 still has avg_hr=100 (strain 10.0, recovery 67, sleep 100)"

      - name: consent_expiry_via_clock
        claim_type: system_transition
        grounds:
          - "entities.TeamMembership.fields.consent_scopes"
          - "calculations.consent_visibility_projection"
        distinguishing_aspect: "A GRANTED consent with expires_on 2026-09-05 flips to EXPIRED when the clock advances past it; the dashboard field goes null without any revoke call."
        test_recipe:
          setup: ["member with ACTIVE term, device ACTIVE, metric ingested 2026-09-01; team membership with STRAIN consent expiring 2026-09-05"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "s4@x.com", full_name: "S Four" }
              as: Anonymous
              captures: { ms4: $.data.id }
            - call: "POST /members/${ms4}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${ms4}"
              captures: { ts4: $.data.id }
            - call: "POST /devices"
              payload: { member_id: "${ms4}", term_id: "${ts4}", serial_number: "SN-S4", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
              captures: { ds4: $.data.id }
            - call: "POST /devices/${ds4}/activate"
              payload: {}
              as: Member
              as_user_id: "${ms4}"
            - call: "POST /devices/${ds4}/ingest"
              payload: { day_on: "2026-09-01", avg_hr: 100, hrv_ms: 100, resting_hr: 50, sleep_minutes: 480 }
              as: Member
              as_user_id: "${ms4}"
            - call: "POST /teams"
              payload: { name: "TS4", team_type: "SPORTS", coach_user_id: "coach-9" }
              as: Coach
              as_user_id: "coach-9"
              captures: { team4: $.data.id }
            - call: "POST /teams/${team4}/memberships"
              payload: { member_id: "${ms4}" }
              as: Coach
              as_user_id: "coach-9"
              captures: { tms4: $.data.id, tms4_v: "$.data.version" }
            - call: "POST /team-memberships/${tms4}/consents"
              payload: { scope: "STRAIN", action: "GRANT", expected_team_membership_version: "${tms4_v}", expires_on: "2026-09-05" }
              as: Member
              as_user_id: "${ms4}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /teams/${team4}/dashboard"
              payload: {}
              as: Coach
              as_user_id: "coach-9"
              captures: { s4_strain: "$.data.rows[0].strain_score" }
          assert:
            - "At 2026-09-06 the STRAIN entry is EXPIRED and dashboard row strain_score == null (consent expired; expiry boundary: expires_on >= today means valid, so 2026-09-05 expiry is still valid ON 2026-09-05 and expired on 2026-09-06)"

      - name: term_completion_via_clock
        claim_type: system_transition
        grounds:
          - "state_machines.MembershipTerm.ACTIVE_to_COMPLETED"
        distinguishing_aspect: "Term auto-completes when the clock reaches commitment_end_on and months_paid >= commitment_months."
        test_recipe:
          setup: ["member with 1-month term started 2026-09-01; one successful payment recorded"]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "s5@x.com", full_name: "S Five" }
              as: Anonymous
              captures: { ms5: $.data.id }
            - call: "POST /members/${ms5}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 1, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${ms5}"
              captures: { ts5: $.data.id }
            - call: "POST /terms/${ts5}/record-payment"
              payload: { outcome: "SUCCEEDED" }
              as: Support
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /members/${ms5}/terms"
              payload: {}
              as: Member
              as_user_id: "${ms5}"
              captures: { t5_status: "$.data[0].term_status" }
          assert:
            - "t5_status == COMPLETED (commitment_end_on == 2026-10-01 reached, months_paid == 1 == commitment_months)"

  # ------------------------------------------------------------- calculations
  - section: calculations
    instances:
      - name: merch_pricing_cap_binds
        claim_type: correct_result
        grounds:
          - "calculations.merch_order_pricing"
        distinguishing_aspect: "30% cap binds: BAND_PRO member with subtotal 10000 gets member 1000 + bundle 500 (apparel qty 3 @ low price)... here: lines 3x APPAREL @1000 + 1x RECOVERY_GEAR @7000 -> subtotal 10000, member 1000, bundle 150, sum 1150 < cap 3000 — instead force the cap: 10x APPAREL @4000 -> subtotal 40000, member 4000 + bundle 2000 = 6000 < 12000; cap truly binds only when sum > 30%: member 10% + bundle 5% max 15% of respective bases, so cap can never bind. Verify: discount == min(member+bundle, cap) with pinned numbers 4000+150=4150 < 12000."
        test_recipe:
          setup:
            - "Clock 2026-09-01; member with ACTIVE BAND_PRO term (monthly_fee 30000, pause budget 90); wallet funded 90000 via pause(90d)+resume"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: Anonymous
              captures: { mc1: $.data.id }
            - call: "POST /members/${mc1}/terms"
              payload: { plan_name: "PRO", monthly_fee_cents: 30000, commitment_months: 12, hardware_tier: "BAND_PRO", upgrade_eligibility_months: 6, pause_days_per_term: 90, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mc1}"
              captures: { tc1: $.data.id }
            - call: "POST /terms/${tc1}/pause"
              payload: { start_on: "2026-09-01", days: 90 }
              as: Member
              as_user_id: "${mc1}"
            - call: "POST /terms/${tc1}/resume"
              payload: {}
              as: Member
              as_user_id: "${mc1}"
          trigger:
            - call: "POST /members/${mc1}/merch-orders"
              payload: { lines: [ { sku: "AP", category: "APPAREL", unit_price_cents: 3000, qty: 3 } ] }
              as: Member
              as_user_id: "${mc1}"
              captures: { oc1: "$.data.id" }
          assert:
            - "subtotal 9000; member_discount == 900 (10%); apparel_qty 3 >= 3 -> bundle == round(9000*0.05)=450; cap == 2700; discount == min(1350, 2700) == 1350; total == 7650"
            - "Member wallet after order: 90000 - 7650 == 82350"

      - name: member_discount_gated_on_term_status
        claim_type: input_set_filtering
        grounds:
          - "calculations.merch_order_pricing"
        distinguishing_aspect: "Member discount is zero when the member's term is PAST_DUE (not in {ACTIVE, PAUSED}) even for BAND_PRO; bundle discount still applies."
        test_recipe:
          setup:
            - "Clock 2026-09-01; member with BAND_PRO term (fee 30000, budget 90); wallet funded 90000; term driven PAST_DUE via FAILED payment — note SUSPENDED member cannot place merch orders, so this claim is exercised via record-payment FAILED then observing the pricing rule indirectly... replaced: member whose term was CANCELLED_EARLY (no qualifying term) places order — but SUSPENDED only comes from PAST_DUE; CANCELLED_EARLY leaves member ACTIVE"
            - "Final setup: member with BAND_PRO term, wallet funded, term cancelled early (member back to ACTIVE, no qualifying term)"
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "c2@x.com", full_name: "C Two" }
              as: Anonymous
              captures: { mc2: $.data.id }
            - call: "POST /members/${mc2}/terms"
              payload: { plan_name: "PRO", monthly_fee_cents: 30000, commitment_months: 12, hardware_tier: "BAND_PRO", upgrade_eligibility_months: 6, pause_days_per_term: 90, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mc2}"
              captures: { tc2: $.data.id }
            - call: "POST /terms/${tc2}/pause"
              payload: { start_on: "2026-09-01", days: 90 }
              as: Member
              as_user_id: "${mc2}"
            - call: "POST /terms/${tc2}/resume"
              payload: {}
              as: Member
              as_user_id: "${mc2}"
            - call: "POST /terms/${tc2}/cancel"
              payload: {}
              as: Member
              as_user_id: "${mc2}"
          trigger:
            - call: "POST /members/${mc2}/merch-orders"
              payload: { lines: [ { sku: "AP", category: "APPAREL", unit_price_cents: 3000, qty: 3 } ] }
              as: Member
              as_user_id: "${mc2}"
              captures: { oc2: "$.data.id" }
          assert:
            - "subtotal 9000; member_discount == 0 (no term in {ACTIVE, PAUSED}); bundle == 450; discount == 450; total == 8550"
            - "Wallet after: 90000 - 8550 == 81450"

      - name: contribution_dataset_deidentified_and_withdrawal
        claim_type: correct_result
        grounds:
          - "calculations.deidentified_contribution_set"
          - "state_machines.ResearchEnrollment.ENROLLED_to_WITHDRAWN"
        distinguishing_aspect: "Dataset rows carry member_seq (assigned by enrollment created_at ASC) not member_id; after withdrawal the member's rows vanish and the seq is not reused by a later enrollee."
        test_recipe:
          setup:
            - "Clock 2026-09-01; study window 2026-09-01..2026-09-30, min_paid_months 0"
            - "Members M1, M2 each with ACTIVE term, ACTIVE device, one metric set on 2026-09-01; both enrolled (M1 first -> seq 1, M2 -> seq 2)"
          setup_api_calls:
            - call: "POST /research-studies"
              payload: { code: "DS", title: "Dataset Study", min_paid_months: 0, enrollment_window_start_on: "2026-09-01", enrollment_window_end_on: "2026-09-30" }
              as: PlatformAdmin
              captures: { std: $.data.id }
            - call: "POST /members"
              payload: { email: "ds1@x.com", full_name: "DS One" }
              as: Anonymous
              captures: { mds1: $.data.id }
            - call: "POST /members/${mds1}/terms"
              payload: { plan_name: "P", monthly_fee_cents: 3000, commitment_months: 12, hardware_tier: "BAND_STD", upgrade_eligibility_months: 6, pause_days_per_term: 30, cancel_fee_policy: "REMAINING_MONTHS", early_cancel_fee_floor_cents: 5000 }
              as: Member
              as_user_id: "${mds1}"
              captures: { tds1: $.data.id }
            - call: "POST /devices"
              payload: { member_id: "${mds1}", term_id: "${tds1}", serial_number: "SN-DS1", hardware_tier: "BAND_STD" }
              as: PlatformAdmin
              captures: { dds1: $.data.id }
            - call: "POST /devices/${dds1}/activate"
              payload: {}
              as: Member
              as_user_id: "${mds1}"
            - call: "POST /devices/${dds1}/ingest"
