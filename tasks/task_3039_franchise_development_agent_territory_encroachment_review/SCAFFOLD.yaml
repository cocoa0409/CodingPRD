    side_effects: []
  - method: GET
    path: "/stores/{id}/protests"
    description: "List protests filed by this store"
    roles: [FranchisorOps, DevelopmentAgent, Franchisee]
    code: 200
    input: []
    output: Protest[]
    side_effects: []
  - method: GET
    path: "/stores/{id}/transfer-requests"
    description: "List transfer requests of this store"
    roles: [FranchisorOps, Franchisee]
    code: 200
    input: []
    output: TransferRequest[]
    side_effects: []
  - method: GET
    path: "/stores/{id}/remodel-mandates"
    description: "List remodel mandates of this store"
    roles: [FranchisorOps, DevelopmentAgent, Franchisee]
    code: 200
    input: []
    output: RemodelMandate[]
    side_effects: []
  - method: GET
    path: "/stores/{id}/inspections"
    description: "List inspections of this store"
    roles: [FranchisorOps, Inspector]
    code: 200
    input: []
    output: Inspection[]
    side_effects: []
  - method: GET
    path: "/stores/{id}/promotion-votes"
    description: "List promotion votes of this store"
    roles: [FranchisorOps, Franchisee]
    code: 200
    input: []
    output: PromotionVote[]
    side_effects: []
  - method: GET
    path: "/stores/{id}/funding-disputes"
    description: "List funding disputes of this store"
    roles: [FranchisorOps, Franchisee]
    code: 200
    input: []
    output: FundingDispute[]
    side_effects: []

  # --- SiteApplication / ImpactStudy ---
  - method: POST
    path: "/site-applications"
    description: "Create a site application (DRAFT); OCC-guarded on the territory"
    roles: [DevelopmentAgent]
    code: 201
    input: [territory_id, applicant_franchisee_id, proposed_address, proposed_lat, proposed_lng, proposed_open_date, expected_territory_version]
    output: SiteApplication
    side_effects: ["status=DRAFT, revision_count=0", "increments Territory.version by 1"]
  - method: GET
    path: "/site-applications/{id}"
    description: "Get a site application"
    roles: [FranchisorOps, DevelopmentAgent]
    code: 200
    input: []
    output: SiteApplication
    side_effects: []
  - method: POST
    path: "/site-applications/{id}/submit"
    description: "Submit (or resubmit after revision request)"
    roles: [DevelopmentAgent]
    code: 200
    input: []
    output: SiteApplication
    side_effects: ["DRAFT->SUBMITTED or REVISION_REQUESTED->SUBMITTED (revision_count += 1, study VOID)"]
  - method: POST
    path: "/site-applications/{id}/request-revision"
    description: "Request revisions from IMPACT_REVIEW"
    roles: [FranchisorOps]
    code: 200
    input: [revision_notes]
    output: SiteApplication
    side_effects: ["IMPACT_REVIEW->REVISION_REQUESTED"]
  - method: POST
    path: "/site-applications/{id}/approve"
    description: "Approve a site application (requires FINAL impact study)"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: SiteApplication
    side_effects: ["IMPACT_REVIEW->APPROVED; approved_on set; PIPELINE Store created; open_store_count recomputed"]
  - method: POST
    path: "/site-applications/{id}/reject"
    description: "Reject a site application"
    roles: [FranchisorOps]
    code: 200
    input: [reason]
    output: SiteApplication
    side_effects: ["IMPACT_REVIEW->REJECTED; study VOID"]
  - method: POST
    path: "/site-applications/{id}/withdraw"
    description: "Withdraw a non-terminal application"
    roles: [DevelopmentAgent]
    code: 200
    input: []
    output: SiteApplication
    side_effects: ["->WITHDRAWN; study VOID; approved PIPELINE store TERMINATED"]
  - method: GET
    path: "/site-applications/{id}/stores"
    description: "List stores produced by this application (length 0 or 1)"
    roles: [FranchisorOps, DevelopmentAgent]
    code: 200
    input: []
    output: Store[]
    side_effects: []
  - method: GET
    path: "/site-applications/{id}/protests"
    description: "List protests against an application"
    roles: [FranchisorOps, DevelopmentAgent, Franchisee]
    code: 200
    input: []
    output: Protest[]
    side_effects: []
  - method: POST
    path: "/site-applications/{id}/impact-studies"
    description: "Create the impact study (SUBMITTED -> IMPACT_REVIEW)"
    roles: [FranchisorOps]
    code: 201
    input: [radius_miles]
    output: ImpactStudy
    side_effects: ["status=PROVISIONAL; provisional_impact_cents and affected_store_count computed (provisional variant)"]
  - method: GET
    path: "/site-applications/{id}/impact-studies"
    description: "List impact studies of an application"
    roles: [FranchisorOps, DevelopmentAgent]
    code: 200
    input: []
    output: ImpactStudy[]
    side_effects: []
  - method: GET
    path: "/impact-studies/{id}"
    description: "Get an impact study"
    roles: [FranchisorOps, DevelopmentAgent]
    code: 200
    input: []
    output: ImpactStudy
    side_effects: []
  - method: POST
    path: "/impact-studies/{id}/finalize"
    description: "Finalize an impact study (final variant recompute)"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: ImpactStudy
    side_effects: ["PROVISIONAL->FINAL; final_impact_cents computed (final variant)"]

  # --- Protest ---
  - method: POST
    path: "/protests"
    description: "File an encroachment protest against an APPROVED application"
    roles: [Franchisee]
    code: 201
    input: [site_application_id, protesting_store_id, grounds]
    output: Protest
    side_effects: ["status=FILED; application APPROVED->PROTESTED"]
  - method: GET
    path: "/protests/{id}"
    description: "Get a protest"
    roles: [FranchisorOps, DevelopmentAgent, Franchisee, Mediator]
    code: 200
    input: []
    output: Protest
    side_effects: []
  - method: GET
    path: "/protests"
    description: "List protests"
    roles: [FranchisorOps, Mediator]
    code: 200
    input: ["protesting_franchisee_id?", "status?", "limit?", "offset?"]
    output: Protest[]
    side_effects: []
  - method: POST
    path: "/protests/{id}/begin-review"
    description: "Move protest FILED -> UNDER_REVIEW"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: Protest
    side_effects: []
  - method: POST
    path: "/protests/{id}/send-to-mediation"
    description: "Send protest to mediation"
    roles: [FranchisorOps]
    code: 200
    input: [mediator_ref, mediation_deadline]
    output: Protest
    side_effects: ["UNDER_REVIEW->MEDIATION; mediator_ref and mediation_deadline set"]
  - method: POST
    path: "/protests/{id}/record-mediation-outcome"
    description: "Mediator records outcome (segregation: only the assigned mediator)"
    roles: [Mediator]
    code: 200
    input: [outcome]
    output: Protest
    side_effects: ["MEDIATION -> RESOLVED_UPHELD / RESOLVED_REJECTED / MEDIATION_FAILED; application side effects per branch"]
  - method: POST
    path: "/protests/{id}/resolve"
    description: "Franchisor resolves a protest directly or after escalation (segregation: not the mediator)"
    roles: [FranchisorOps]
    code: 200
    input: [resolution]
    output: Protest
    side_effects: ["UNDER_REVIEW/ESCALATED -> RESOLVED_UPHELD / RESOLVED_REJECTED; application side effects per branch"]
  - method: POST
    path: "/protests/{id}/escalate"
    description: "Escalate a failed mediation"
    roles: [Franchisee]
    code: 200
    input: []
    output: Protest
    side_effects: ["MEDIATION_FAILED->ESCALATED"]

  # --- TransferRequest ---
  - method: POST
    path: "/transfer-requests"
    description: "Create a transfer/resale request (PENDING); OCC-guarded on the store"
    roles: [Franchisee]
    code: 201
    input: [store_id, buyer_franchisee_id, sale_price_cents, expected_store_version]
    output: TransferRequest
    side_effects: ["status=PENDING; transfer_fee_cents computed and frozen; increments Store.version by 1"]
  - method: GET
    path: "/transfer-requests/{id}"
    description: "Get a transfer request"
    roles: [FranchisorOps, Franchisee]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []
  - method: POST
    path: "/transfer-requests/{id}/advance-to-training"
    description: "Advance PENDING -> BUYER_TRAINING (buyer enrollment must exist)"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["PENDING->BUYER_TRAINING; if the buyer's enrollment is already COMPLETED the request immediately advances to PENDING_APPROVAL in the same call"]
  - method: POST
    path: "/transfer-requests/{id}/approve"
    description: "Approve PENDING_APPROVAL (buyer training COMPLETED required)"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: TransferRequest
    side_effects: []
  - method: POST
    path: "/transfer-requests/{id}/reject"
    description: "Reject a transfer request"
    roles: [FranchisorOps]
    code: 200
    input: [reason]
    output: TransferRequest
    side_effects: []
  - method: POST
    path: "/transfer-requests/{id}/complete"
    description: "Complete an approved transfer; ownership flips"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["APPROVED->COMPLETED; Store.franchisee_id := buyer; increments Store.version by 1"]
  - method: POST
    path: "/transfer-requests/{id}/cancel"
    description: "Seller cancels a non-terminal transfer request"
    roles: [Franchisee]
    code: 200
    input: []
    output: TransferRequest
    side_effects: ["->CANCELLED"]

  # --- TrainingEnrollment ---
  - method: POST
    path: "/training-enrollments"
    description: "Enroll a franchisee in a training program"
    roles: [FranchisorOps]
    code: 201
    input: [franchisee_id, program_code, expires_on]
    output: TrainingEnrollment
    side_effects: ["status=ENROLLED"]
  - method: GET
    path: "/training-enrollments/{id}"
    description: "Get an enrollment (lazy EXPIRED applied on read)"
    roles: [FranchisorOps, Franchisee]
    code: 200
    input: []
    output: TrainingEnrollment
    side_effects: []
  - method: POST
    path: "/training-enrollments/{id}/record-result"
    description: "Record training result; score >= 80 completes"
    roles: [FranchisorOps]
    code: 200
    input: [score]
    output: TrainingEnrollment
    side_effects: ["ENROLLED->COMPLETED or FAILED; linked BUYER_TRAINING transfer requests advance or revert"]

  # --- RemodelMandate ---
  - method: POST
    path: "/remodel-mandates"
    description: "Issue a remodel mandate"
    roles: [FranchisorOps]
    code: 201
    input: [store_id, due_by, financing_option, estimated_cost_cents]
    output: RemodelMandate
    side_effects: ["status=ISSUED; DA_LOAN requires store territory's agent status ACTIVE"]
  - method: GET
    path: "/remodel-mandates/{id}"
    description: "Get a remodel mandate (lazy OVERDUE applied on read)"
    roles: [FranchisorOps, DevelopmentAgent, Franchisee]
    code: 200
    input: []
    output: RemodelMandate
    side_effects: []
  - method: POST
    path: "/remodel-mandates/{id}/schedule"
    description: "Schedule closure window (ISSUED or OVERDUE)"
    roles: [DevelopmentAgent]
    code: 200
    input: [closure_start, closure_end]
    output: RemodelMandate
    side_effects: ["->SCHEDULED; downtime_days computed"]
  - method: POST
    path: "/remodel-mandates/{id}/begin"
    description: "Begin the remodel inside the closure window"
    roles: [Franchisee]
    code: 200
    input: []
    output: RemodelMandate
    side_effects: ["SCHEDULED->IN_PROGRESS; Store OPEN->CLOSED_FOR_REMODEL"]
  - method: POST
    path: "/remodel-mandates/{id}/complete"
    description: "Complete the remodel"
    roles: [Franchisee]
    code: 200
    input: []
    output: RemodelMandate
    side_effects: ["IN_PROGRESS->COMPLETED; Store CLOSED_FOR_REMODEL->OPEN; downtime_charge_cents computed"]
  - method: POST
    path: "/remodel-mandates/{id}/waive"
    description: "Waive an open mandate"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: RemodelMandate
    side_effects: ["->WAIVED"]

  # --- Inspection ---
  - method: POST
    path: "/inspections"
    description: "Schedule an inspection"
    roles: [FranchisorOps]
    code: 201
    input: [store_id, scheduled_on, inspector_ref]
    output: Inspection
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/inspections/{id}"
    description: "Get an inspection"
    roles: [FranchisorOps, Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/inspections/{id}/record-findings"
    description: "Inspector records category scores (segregation: only assigned inspector)"
    roles: [Inspector]
    code: 200
    input: [food_safety_score, cleanliness_score, operations_score, critical_violations]
    output: Inspection
    side_effects: ["SCHEDULED->CONDUCTED; final_score computed (per-category rounding pinned)"]
  - method: POST
    path: "/inspections/{id}/finalize"
    description: "Franchisor finalizes (segregation: not the inspector); outcome cascades to store"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: Inspection
    side_effects: ["CONDUCTED->FINALIZED; outcome per thresholds; Store cascade (PROBATION / TERMINATION_PENDING / back to OPEN)"]

  # --- Promotion / Vote ---
  - method: POST
    path: "/promotions"
    description: "Create a national promotion (PROPOSED)"
    roles: [FranchisorOps]
    code: 201
    input: [name, voting_open, voting_close, active_start, active_end, base_cost_per_store_cents]
    output: Promotion
    side_effects: ["status=PROPOSED; tallies 0"]
  - method: GET
    path: "/promotions/{id}"
    description: "Get a promotion"
    roles: [FranchisorOps, DevelopmentAgent, Franchisee]
    code: 200
    input: []
    output: Promotion
    side_effects: []
  - method: POST
    path: "/promotions/{id}/open-voting"
    description: "Open the voting window"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: Promotion
    side_effects: ["PROPOSED->VOTING"]
  - method: POST
    path: "/promotions/{id}/close-voting"
    description: "Close voting; quorum met -> APPROVED with funding allocation, else REJECTED"
    roles: [FranchisorOps]
    code: 200
    input: ["force_reject?"]
    output: Promotion
    side_effects: ["tallies and eligible_voter_count computed; on APPROVED: store_share_cents and total_pool_cents per promotion_funding_allocation"]
  - method: POST
    path: "/promotions/{id}/activate"
    description: "Activate an approved promotion (per-territory overlap capacity enforced)"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: Promotion
    side_effects: ["APPROVED->ACTIVE"]
  - method: POST
    path: "/promotions/{id}/close"
    description: "Close an active promotion after its window (no OPEN disputes)"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: Promotion
    side_effects: ["ACTIVE->CLOSED"]
  - method: GET
    path: "/promotions/{id}/votes"
    description: "List votes of a promotion"
    roles: [FranchisorOps, DevelopmentAgent, Franchisee]
    code: 200
    input: []
    output: PromotionVote[]
    side_effects: []
  - method: GET
    path: "/promotions/{id}/funding-disputes"
    description: "List funding disputes of a promotion"
    roles: [FranchisorOps, DevelopmentAgent, Franchisee]
    code: 200
    input: []
    output: FundingDispute[]
    side_effects: []
  - method: POST
    path: "/promotions/{id}/votes"
    description: "Cast a ballot for a store"
    roles: [Franchisee]
    code: 201
    input: [store_id, ballot]
    output: PromotionVote
    side_effects: ["retracted=false; promotion tallies recomputed"]
  - method: GET
    path: "/promotion-votes/{id}"
    description: "Get a vote"
    roles: [FranchisorOps, Franchisee]
    code: 200
    input: []
    output: PromotionVote
    side_effects: []
  - method: POST
    path: "/promotion-votes/{id}/retract"
    description: "Retract a live ballot while voting is open"
    roles: [Franchisee]
    code: 200
    input: []
    output: PromotionVote
    side_effects: ["retracted=true; promotion tallies recomputed"]

  # --- FundingDispute ---
  - method: POST
    path: "/funding-disputes"
    description: "Dispute the funding share charged to a participating store"
    roles: [Franchisee]
    code: 201
    input: [promotion_id, store_id, disputed_amount_cents, reason]
    output: FundingDispute
    side_effects: ["status=OPEN"]
  - method: GET
    path: "/funding-disputes/{id}"
    description: "Get a funding dispute"
    roles: [FranchisorOps, Franchisee]
    code: 200
    input: []
    output: FundingDispute
    side_effects: []
  - method: POST
    path: "/funding-disputes/{id}/resolve"
    description: "Resolve a dispute: DA absorbs, franchisee pays, or franchisor absorbs"
    roles: [FranchisorOps]
    code: 200
    input: [resolution]
    output: FundingDispute
    side_effects: ["OPEN -> RESOLVED_DA_ABSORBS / RESOLVED_FRANCHISEE_PAYS / RESOLVED_FRANCHISOR_ABSORBS"]

  # --- FeeStatement ---
  - method: POST
    path: "/fee-statements/generate"
    description: "Generate a provisional fee statement for an agent+territory+period"
    roles: [FranchisorOps]
    code: 201
    input: [development_agent_id, territory_id, period_start, period_end]
    output: FeeStatement
    side_effects: ["status=PROVISIONAL, variant=PROVISIONAL_ESTIMATE; gross/da/franchisor computed (provisional variant)"]
  - method: GET
    path: "/fee-statements/{id}"
    description: "Get a fee statement"
    roles: [FranchisorOps, DevelopmentAgent]
    code: 200
    input: []
    output: FeeStatement
    side_effects: []
  - method: POST
    path: "/fee-statements/{id}/finalize"
    description: "Finalize: recompute under the final variant"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: FeeStatement
    side_effects: ["PROVISIONAL->FINALIZED; variant=FINAL_RECONCILIATION; amounts recomputed"]
  - method: POST
    path: "/fee-statements/{id}/settle"
    description: "Settle a finalized statement (conservation invariant re-verified)"
    roles: [FranchisorOps]
    code: 200
    input: []
    output: FeeStatement
    side_effects: ["FINALIZED->SETTLED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or empty X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted on endpoint, or entity-backed ownership check failed" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, out-of-range number, non-whole-week statement period" }
  - { id: ERR_TERRITORY_NOT_FOUND, http: 404, condition: "Territory id does not resolve" }
  - { id: ERR_AGENT_NOT_FOUND, http: 404, condition: "DevelopmentAgent id does not resolve" }
  - { id: ERR_FRANCHISEE_NOT_FOUND, http: 404, condition: "Franchisee id does not resolve" }
  - { id: ERR_STORE_NOT_FOUND, http: 404, condition: "Store id does not resolve" }
  - { id: ERR_SITE_APPLICATION_NOT_FOUND, http: 404, condition: "SiteApplication id does not resolve" }
  - { id: ERR_IMPACT_STUDY_NOT_FOUND, http: 404, condition: "ImpactStudy id does not resolve" }
  - { id: ERR_PROTEST_NOT_FOUND, http: 404, condition: "Protest id does not resolve" }
  - { id: ERR_TRANSFER_REQUEST_NOT_FOUND, http: 404, condition: "TransferRequest id does not resolve" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "TrainingEnrollment id does not resolve" }
  - { id: ERR_MANDATE_NOT_FOUND, http: 404, condition: "RemodelMandate id does not resolve" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Inspection id does not resolve" }
  - { id: ERR_PROMOTION_NOT_FOUND, http: 404, condition: "Promotion id does not resolve" }
  - { id: ERR_VOTE_NOT_FOUND, http: 404, condition: "PromotionVote id does not resolve" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "FundingDispute id does not resolve" }
  - { id: ERR_STATEMENT_NOT_FOUND, http: 404, condition: "FeeStatement id does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid from-state for the requested transition (includes terminal lockdown and duplicate live impact study)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the parent resource's current version" }
  - { id: ERR_AGENT_NOT_ACTIVE, http: 422, condition: "Development agent not ACTIVE (assignment requires ACTIVE; reassignment requires UNDERPERFORMING; DA_LOAN financing requires ACTIVE agent)" }
  - { id: ERR_TERRITORY_UNASSIGNED, http: 422, condition: "Territory is UNASSIGNED or REASSIGNMENT_PENDING where ASSIGNED is required, or statement territory not assigned to the named agent" }
  - { id: ERR_STORE_NOT_OPEN, http: 422, condition: "Store not OPEN where OPEN is required (protest filer, remodel schedule)" }
  - { id: ERR_STORE_NOT_TRANSFERABLE, http: 422, condition: "Store in TERMINATION_PENDING or TERMINATED blocks transfer approval/completion" }
  - { id: ERR_BUYER_TRAINING_INCOMPLETE, http: 422, condition: "Buyer lacks an ENROLLED/COMPLETED (advance) or COMPLETED (approve) TRANSFER_BUYER training enrollment" }
  - { id: ERR_IMPACT_STUDY_NOT_FINAL, http: 422, condition: "Site approval requires the application's impact study in status FINAL" }
  - { id: ERR_PROTEST_WINDOW_EXPIRED, http: 422, condition: "Protest filed more than 30 days after the application's approved_on" }
  - { id: ERR_MEDIATION_DEADLINE_PASSED, http: 422, condition: "Mediation outcome recorded after mediation_deadline" }
  - { id: ERR_VOTING_CLOSED, http: 422, condition: "Vote cast or retracted outside [voting_open, voting_close)" }
  - { id: ERR_PROTEST_ALREADY_FILED, http: 409, condition: "A non-terminal protest already exists for this (store, application)" }
  - { id: ERR_ALREADY_VOTED, http: 409, condition: "A live (non-retracted) ballot already exists for this (store, promotion)" }
  - { id: ERR_FISCAL_PERIOD_OVERLAP, http: 409, condition: "A non-settled fee statement overlaps the requested period for the same agent and territory" }
  - { id: ERR_CLOSURE_WINDOW_OVERLAP, http: 422, condition: "Closure window [start, end) intersects another SCHEDULED/IN_PROGRESS closure window of the same store" }
  - { id: ERR_CLOSURE_BUFFER_VIOLATION, http: 422, condition: "closure_start is less than 7 days after a prior closure_end of the same store" }
  - { id: ERR_PROMOTION_OVERLAP_EXCEEDED, http: 422, condition: "Activation would give a territory 2 or more overlapping ACTIVE promotions" }
  - { id: ERR_QUORUM_NOT_MET, http: 422, condition: "close-voting without quorum (two-thirds FOR and half turnout) and without force_reject" }
  - { id: ERR_DISPUTE_AMOUNT_MISMATCH, http: 422, condition: "disputed_amount_cents does not equal the promotion's computed store_share_cents" }
  - { id: ERR_PROMOTION_NOT_ACTIVE, http: 422, condition: "Funding disputes and participation checks require the promotion ACTIVE" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; only drives the logical clock (test-driving surface)."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
  - name: FranchisorOps
    description: "Franchisor operations staff; administers territories, agents, franchisees, stores, approvals, inspections finalization, promotions, disputes, and fee statements."
    identity: opaque
    exclusive_operations:
      - "POST /territories, /territories/{id}/assign-agent, /territories/{id}/initiate-reassignment"
      - "POST /development-agents and agent flag/clear/terminate"
      - "POST /franchisees, /stores, /stores/{id}/open, /stores/{id}/terminate"
      - "POST impact study create/finalize; site approve/reject/request-revision"
      - "POST protest begin-review/send-to-mediation/resolve"
      - "POST transfer advance/approve/reject/complete; training enrollment create/record-result"
      - "POST remodel mandate create/waive; inspection create/finalize"
      - "POST promotion create/open-voting/close-voting/activate/close; dispute resolve; fee statement generate/finalize/settle"
    shared_operations:
      - "GET on all business resources"
  - name: DevelopmentAgent
    description: "Third-party development agent; owns site applications and remodel scheduling inside its assigned territory (X-User-ID must equal the territory's assigned_agent_id)."
    identity: "entity_backed:DevelopmentAgent"
    exclusive_operations:
      - "POST /site-applications, /site-applications/{id}/submit, /site-applications/{id}/withdraw"
      - "POST /remodel-mandates/{id}/schedule"
    shared_operations:
      - "GET territories, stores, applications, studies, mandates, promotions, fee statements"
  - name: Franchisee
    description: "Store owner; files protests, votes, creates/cancels transfer requests for owned stores, raises funding disputes, begins/completes remodels (X-User-ID must equal the owning Franchisee id)."
    identity: "entity_backed:Franchisee"
    exclusive_operations:
      - "POST /protests, /protests/{id}/escalate"
      - "POST /transfer-requests, /transfer-requests/{id}/cancel"
      - "POST /promotions/{id}/votes, /promotion-votes/{id}/retract"
      - "POST /funding-disputes"
      - "POST /remodel-mandates/{id}/begin, /remodel-mandates/{id}/complete"
    shared_operations:
      - "GET own stores, transfers, votes, disputes, mandates, promotions"
  - name: Mediator
    description: "External mediator; records mediation outcomes only (segregation: cannot resolve protests)."
    identity: opaque
    exclusive_operations:
      - "POST /protests/{id}/record-mediation-outcome"
    shared_operations:
      - "GET /protests/{id}, GET /protests"
  - name: Inspector
    description: "Field inspector; records inspection findings only (segregation: cannot finalize inspections)."
    identity: opaque
    exclusive_operations:
      - "POST /inspections/{id}/record-findings"
    shared_operations:
      - "GET /inspections/{id}, GET /stores/{id}/inspections"
