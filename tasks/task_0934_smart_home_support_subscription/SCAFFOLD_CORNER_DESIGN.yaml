  - section: validations
    instances:
      - name: suspended_household_gate_preempts_every_downstream_rule
        claim_type: Violation to Error
        grounds: ["gate_precedence[1]", "validations[priority=23]", "errors[ERR_ACCOUNT_SUSPENDED]", "state_machines.Household.account.ACTIVE_to_SUSPENDED"]
        distinguishing_aspect: "Once account_status is SUSPENDED, a device claim that would ALSO breach the 1-device cap reports ERR_ACCOUNT_SUSPENDED (403) at priority 23, never the fiscal ERR_DEVICE_CAP_EXCEEDED at priority 50."
        test_recipe:
          setup: ["Clock 2026-05-01T00:00:00Z; a PRO plan with included_device_count 1; a household with an OWNER, an ACTIVE subscription (allow_overage false) and one device already claimed; the household is then suspended by the platform."]
          setup_api_calls:
            - call: "POST /smart-home-support/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /smart-home-support/subscription-plans"
              payload: { tier: "PRO", monthly_fee_cents: 9999, included_device_count: 1, overage_fee_cents_per_device: 299, coverage_mode: "TWENTY_FOUR_SEVEN", first_response_minutes_p1: 30, first_response_minutes_p2: 120, first_response_minutes_p3: 480, onsite_resolution_hours_p1: 24, onsite_resolution_hours_p2: 48, onsite_resolution_hours_p3: 96, warranty_extension_months: 12, included_install_credits: 3, advance_replacement_eligible: true }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /smart-home-support/households"
              payload: { name: "Gate House", region_code: "NWA", billing_email: "gate@example.com" }
              as: PlatformAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /smart-home-support/households/${h_id}/members"
              payload: { full_name: "Gat E", email: "gat@example.com", member_role: "OWNER" }
              as: PlatformAdmin
              captures: { own_id: "$.data.id" }
            - call: "POST /smart-home-support/subscriptions"
              payload: { household_id: "${h_id}", plan_id: "${plan_id}", allow_overage: false }
              as: PlatformAdmin
            - call: "POST /smart-home-support/device-catalog"
              payload: { model_code: "HUB-X1", display_name: "Hub X1", device_class: "HUB", serial_prefix: "HBX", base_warranty_months: 24, requires_install: true, manufacturer_service_only: false, msrp_cents: 24900, current_firmware_version: "1.0.0" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_id}", serial_number: "HBX000001", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
            - call: "POST /smart-home-support/households/${h_id}/account-status"
              payload: { account_status: "SUSPENDED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /smart-home-support/devices/claim"
              payload: { household_id: "${h_id}", catalog_entry_id: "${cat_id}", serial_number: "HBX000002", purchase_date: "2026-04-01" }
              as: Owner
              as_user_id: "${own_id}"
