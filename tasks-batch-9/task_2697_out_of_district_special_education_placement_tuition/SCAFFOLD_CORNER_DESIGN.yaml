scaffold_corner_design:

  # ===========================================================================
  # Table 1 (Entities) - creation / retrieval / listing / not-found / required
  # fields / defaults / computed / system fields / type constraints, plus the
  # `flat` topology row (foreign-key reference validation).
  # ===========================================================================
  - section: entities
    instances:
      - name: student_creation_returns_all_declared_fields
        claim_type: Creation
        grounds:
          - "entities.Student"
          - "endpoints.POST_students"
          - "response_envelope.success"
        distinguishing_aspect: |
          A create must return HTTP 201 with the full envelope (meta.api_request_id,
          response_type object, data) and every §1.1 Student field materialised - the six
          required inputs echoed verbatim, the two optional booleans as supplied, and all three
          computed fields at their declared defaults.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z. Empty database otherwise."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /ood-placements/students"
              payload: { state_student_id: "SS-C001", full_name: "Ada Whitcombe", district_of_residence: "Northvale USD", disability_category: "MULTIPLE_DISABILITIES", iep_effective_date: "2026-08-15", lre_current_setting: "SEPARATE_CLASS_UNDER_40", medicaid_eligible: true, medicaid_consent_on_file: true }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { stu_id: $.data.id }
          assert:
            - "The trigger returns HTTP 201"
            - "meta.api_request_id is present and response_type == object"
            - "data.state_student_id == SS-C001, data.full_name == Ada Whitcombe, data.district_of_residence == Northvale USD"
            - "data.disability_category == MULTIPLE_DISABILITIES, data.iep_effective_date == 2026-08-15, data.lre_current_setting == SEPARATE_CLASS_UNDER_40"
            - "data.medicaid_eligible == true and data.medicaid_consent_on_file == true"
            - "data.placement_status == NONE, data.high_cost_flag == false, data.projected_state_recovery_cents == 0"
            - "data.id is a non-empty string and data.version == 1"
      - name: transport_route_retrieval_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - "entities.TransportRoute"
          - "endpoints.GET_transport_routes_id"
        distinguishing_aspect: |
          A single-resource GET must return the same row the create returned, including the
          seats_available = seat_capacity create side effect, and must not re-derive or reset it.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
            - "One TransportRoute R-C01 with seat_capacity 6, daily_rate_cents 5400, service window 400..620."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/transport-routes"
              payload: { route_code: "R-C01", seat_capacity: 6, daily_rate_cents: 5400, service_window_start_min: 400, service_window_end_min: 620 }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { route_id: $.data.id }
          trigger:
            - call: "GET /ood-placements/transport-routes/${route_id}"
              payload: {}
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
          assert:
            - "The trigger returns HTTP 200 with response_type == object"
            - "data.id == ${route_id} and data.route_code == R-C01"
            - "data.seat_capacity == 6, data.seats_committed == 0, data.seats_available == 6"
            - "data.daily_rate_cents == 5400, data.service_window_start_min == 400, data.service_window_end_min == 620"
      - name: transport_route_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - "entities.TransportRoute"
          - "endpoints.GET_transport_routes"
          - "response_envelope.pagination_fields"
        distinguishing_aspect: |
          The list endpoint must report the pagination quartet against the FULL match set, not
          the returned page: with three routes and limit 2, total_count is 3 and has_more is
          true; at offset 2 the page holds one row and has_more is false. An implementation that
          sets total_count from len(page) reports 2 then 1.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
            - "Exactly three TransportRoute rows created in order R-C11, R-C12, R-C13."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/transport-routes"
              payload: { route_code: "R-C11", seat_capacity: 4, daily_rate_cents: 5000, service_window_start_min: 360, service_window_end_min: 600 }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { r1: $.data.id }
            - call: "POST /ood-placements/transport-routes"
              payload: { route_code: "R-C12", seat_capacity: 4, daily_rate_cents: 5000, service_window_start_min: 360, service_window_end_min: 600 }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { r2: $.data.id }
            - call: "POST /ood-placements/transport-routes"
              payload: { route_code: "R-C13", seat_capacity: 4, daily_rate_cents: 5000, service_window_start_min: 360, service_window_end_min: 600 }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { r3: $.data.id }
          trigger:
            - call: "GET /ood-placements/transport-routes"
              payload: { limit: 2, offset: 0 }
              as: TeamChair
              as_user_id: "u-chair-1"
            - call: "GET /ood-placements/transport-routes"
              payload: { limit: 2, offset: 2 }
              as: TeamChair
              as_user_id: "u-chair-1"
          assert:
            - "The first list returns HTTP 200 with response_type == array, total_count == 3, has_more == true, limit == 2, offset == 0 and exactly 2 rows"
            - "The first page rows are ${r1} then ${r2} in created_at ASC order"
            - "The second list returns total_count == 3, has_more == false, offset == 2 and exactly 1 row, which is ${r3}"
      - name: unknown_placement_id_returns_not_found
        claim_type: Not Found
        grounds:
          - "endpoints.GET_placements_id"
          - "errors[ERR_PLACEMENT_NOT_FOUND]"
          - "validations[priority=3]"
        distinguishing_aspect: |
          A path id that matches no row must produce the priority-3 path-existence 404 with the
          entity-specific error_id, not a 200 with an empty body and not a 500.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z. No Placement rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "GET /ood-placements/placements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
          assert:
            - "The trigger returns HTTP 404 with response_type == error"
            - "data.error_id == ERR_PLACEMENT_NOT_FOUND"
            - "data.message is a non-empty string"
      - name: student_create_missing_district_of_residence_rejected
        claim_type: Required Fields
        grounds:
          - "entities.Student.fields.district_of_residence"
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: |
          district_of_residence is source: input with no default, so omitting it must fail the
          priority-4 shape check with ERR_INVALID_REQUEST (400) - before any FK resolution - and
          persist nothing.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z. No Student rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /ood-placements/students"
              payload: { state_student_id: "SS-C002", full_name: "Bo Nakashima", disability_category: "AUTISM", iep_effective_date: "2026-08-15", lre_current_setting: "RESOURCE_40_79" }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
          assert:
            - "The trigger returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "A follow-up GET /ood-placements/students as PlacementCoordinator returns total_count == 0"
      - name: student_medicaid_flags_default_to_false
        claim_type: Defaults
        grounds:
          - "entities.Student.fields.medicaid_eligible"
          - "entities.Student.fields.medicaid_consent_on_file"
          - "endpoints.POST_students"
        distinguishing_aspect: |
          medicaid_eligible and medicaid_consent_on_file are optional inputs whose declared
          default is false; omitting them must yield false, not null and not true, and the
          defaults must be persisted rather than only present in the create response.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /ood-placements/students"
              payload: { state_student_id: "SS-C003", full_name: "Cleo Marchetti", district_of_residence: "Northvale USD", disability_category: "OTHER_HEALTH_IMPAIRMENT", iep_effective_date: "2026-08-15", lre_current_setting: "GENERAL_ED_80_PLUS" }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { stu_id: $.data.id }
          assert:
            - "The trigger returns HTTP 201 with data.medicaid_eligible == false and data.medicaid_consent_on_file == false"
            - "A follow-up GET /ood-placements/students/${stu_id} as PlacementCoordinator returns medicaid_eligible == false and medicaid_consent_on_file == false"
            - "data.placement_status == NONE and data.high_cost_flag == false at their own declared defaults"
      - name: funding_claim_computed_fields_are_server_derived
        claim_type: Computed Fields
        grounds:
          - "entities.FundingClaim.fields.billable_service_hours"
          - "entities.FundingClaim.fields.eligible_base_cents"
          - "entities.FundingClaim.fields.tier_rate"
          - "entities.FundingClaim.fields.reimbursable_amount_cents"
          - "entities.FundingClaim.fields.source"
          - "calculations.funding_claim_reimbursable"
        distinguishing_aspect: |
          POST /ood-placements/funding-claims accepts only placement_id, claim_type and
          fiscal_year; every money and rate field on the row is computed. A MEDICAID claim must
          derive billable_service_hours 7.5 from the medicaid_billable addendum ONLY (the 5.5 OT
          hours are excluded), eligible_base_cents 67500 at MEDICAID_HOURLY_RATE_CENTS 9000,
          tier_rate 0.5432 (FMAP_PCT) and reimbursable_amount_cents 36666, and must stamp
          source MANUAL / status ELIGIBLE / submitted_at null itself.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z advanced to 2026-09-01T08:00:00Z then 2026-11-02T09:00:00Z."
            - "DistrictFiscalAccount FY2027 authorized_cents 100000000."
            - "One student with medicaid_eligible true and medicaid_consent_on_file true."
            - "One ACTIVE DAY Placement at Harbor Academy with two ACTIVE addenda: A1 SPEECH 2.0 h/week medicaid_billable true, A2 OT 1.5 h/week medicaid_billable false."
            - "One VERIFIED AttendanceRecord 2026-10-05..2026-11-01 reporting 7.5 h on A1 and 5.5 h on A2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/fiscal-accounts"
              payload: { fiscal_year: 2027, account_code: "OOD-TUITION-2027", authorized_cents: 100000000 }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { acct_id: $.data.id }
            - call: "POST /ood-placements/private-schools"
              payload: { name: "Harbor Academy", state_approval_id: "SA-7781", approval_status: "APPROVED", residential_capable: true, medicaid_provider_number: "MP-4410" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
              captures: { sch_id: $.data.id, sch_v: $.data.version }
            - call: "POST /ood-placements/tuition-rate-schedules"
              payload: { school_id: "${sch_id}", fiscal_year: 2027, day_rate_cents: 32000, residential_rate_cents: 51500, service_hourly_rate_cents: 11000, effective_from: "2026-07-01", effective_to: "2027-06-30", approval_state: "STATE_APPROVED", expected_school_version: "${sch_v}" }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { rs_id: $.data.id }
            - call: "POST /ood-placements/students"
              payload: { state_student_id: "SS-C004", full_name: "Dara Villanueva", district_of_residence: "Northvale USD", disability_category: "AUTISM", iep_effective_date: "2026-08-15", lre_current_setting: "RESOURCE_40_79", medicaid_eligible: true, medicaid_consent_on_file: true }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { stu_id: $.data.id }
            - call: "POST /ood-placements/placement-decisions"
              payload: { student_id: "${stu_id}", recommended_placement_type: "DAY", lre_justification: "Two quarters of in-district resource room support produced no measurable progress on the communication goals.", continuum_options_considered: [{ setting: "GENERAL_EDUCATION_WITH_SUPPORTS", rejected_reason: "No progress." }, { setting: "RESOURCE_ROOM", rejected_reason: "Insufficient intensity." }, { setting: "SELF_CONTAINED_CLASS", rejected_reason: "No certified program." }] }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { dec_id: $.data.id }
            - call: "POST /ood-placements/placement-decisions/${dec_id}/submit"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /ood-placements/placement-decisions/${dec_id}/approve"
              payload: { reviewer_notes: "Approved." }
              as: TeamChair
              as_user_id: "u-chair-1"
            - call: "POST /ood-placements/placements"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", decision_id: "${dec_id}", rate_schedule_id: "${rs_id}", fiscal_account_id: "${acct_id}", placement_type: "DAY", start_date: "2026-09-01", end_date: "2027-06-15", contracted_instructional_days: 180, contracted_residential_nights: 0, transportation_required: false }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { pl_id: $.data.id }
            - call: "POST /ood-placements/placements/${pl_id}/execute-contract"
              payload: {}
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T08:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/placements/${pl_id}/activate"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /ood-placements/service-addenda"
              payload: { placement_id: "${pl_id}", service_type: "SPEECH", authorized_hours_per_week: 2.0, contract_weeks: 36, medicaid_billable: true }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { add1_id: $.data.id }
            - call: "POST /ood-placements/service-addenda/${add1_id}/authorize"
              payload: {}
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
            - call: "POST /ood-placements/service-addenda"
              payload: { placement_id: "${pl_id}", service_type: "OT", authorized_hours_per_week: 1.5, contract_weeks: 36, medicaid_billable: false }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { add2_id: $.data.id }
            - call: "POST /ood-placements/service-addenda/${add2_id}/authorize"
              payload: {}
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-02T09:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/attendance-records"
              payload: { placement_id: "${pl_id}", period_start: "2026-10-05", period_end: "2026-11-01", days_enrolled: 20, days_attended: 16, days_absent_unexcused: 4, residential_nights: 0, service_delivery_lines: [{ service_addendum_id: "${add1_id}", hours_delivered: 7.5 }, { service_addendum_id: "${add2_id}", hours_delivered: 5.5 }] }
              as: SchoolBillingAgent
              as_user_id: "${sch_id}"
              captures: { ar_id: $.data.id }
            - call: "POST /ood-placements/attendance-records/${ar_id}/verify"
              payload: { decision: "ACCEPT" }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
          trigger:
            - call: "POST /ood-placements/funding-claims"
              payload: { placement_id: "${pl_id}", claim_type: "MEDICAID", fiscal_year: 2027 }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { fc_id: $.data.id }
          assert:
            - "The trigger returns HTTP 201"
            - "data.billable_service_hours == 7.5 - the 5.5 non-billable OT hours are excluded"
            - "data.eligible_base_cents == 67500"
            - "data.tier_rate == 0.5432"
            - "data.reimbursable_amount_cents == 36666"
            - "data.source == MANUAL and data.status == ELIGIBLE"
            - "data.submitted_at == null and data.state_claim_reference == null"
            - "A follow-up GET /ood-placements/students/${stu_id} shows projected_state_recovery_cents == 36666"
      - name: fiscal_account_system_fields_are_server_generated
        claim_type: System Fields
        grounds:
          - "entities.DistrictFiscalAccount"
          - "endpoints.POST_fiscal_accounts"
        distinguishing_aspect: |
          id, created_at, updated_at and version are system fields the client never supplies,
          and available_cents is seeded from authorized_cents by the create side effect. A brand
          new account must read authorized 6250000 / available 6250000 / encumbered 0 /
          disbursed 0 at version 1, satisfying the ledger identity from birth.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
          trigger:
            - call: "POST /ood-placements/fiscal-accounts"
              payload: { fiscal_year: 2027, account_code: "OOD-CORNER-A", authorized_cents: 6250000 }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { acct_id: $.data.id }
          assert:
            - "The trigger returns HTTP 201 with data.id a non-empty server-minted string"
            - "data.created_at and data.updated_at are ISO 8601 strings and data.version == 1"
            - "data.authorized_cents == 6250000, data.available_cents == 6250000, data.encumbered_cents == 0, data.disbursed_cents == 0"
            - "6250000 == 6250000 + 0 + 0 - the fiscal identity holds at creation"
      - name: placement_type_outside_enum_rejected
        claim_type: Type Constraints
        grounds:
          - "entities.Placement.fields.placement_type"
          - "validations[priority=4]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: |
          placement_type is constrained to {DAY, RESIDENTIAL}; a third value must be refused at
          priority 4 with ERR_INVALID_REQUEST (400), ahead of the body-FK existence check at
          priority 5 - so the fully valid student/school/decision/schedule/account ids in the
          same payload do not rescue it, and no Placement row and no encumbrance are created.
        test_recipe:
          setup:
            - "Clock at the default 2026-08-01T00:00:00Z."
            - "DistrictFiscalAccount FY2027 authorized_cents 100000000, Harbor Academy APPROVED with a STATE_APPROVED FY2027 schedule, one student, one APPROVED PlacementDecision recommending DAY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
            - call: "POST /ood-placements/fiscal-accounts"
              payload: { fiscal_year: 2027, account_code: "OOD-TUITION-2027", authorized_cents: 100000000 }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { acct_id: $.data.id }
            - call: "POST /ood-placements/private-schools"
              payload: { name: "Harbor Academy", state_approval_id: "SA-7781", approval_status: "APPROVED", residential_capable: true, medicaid_provider_number: "MP-4410" }
              as: SystemAdmin
              as_user_id: "u-admin-1"
              captures: { sch_id: $.data.id, sch_v: $.data.version }
            - call: "POST /ood-placements/tuition-rate-schedules"
              payload: { school_id: "${sch_id}", fiscal_year: 2027, day_rate_cents: 32000, residential_rate_cents: 51500, service_hourly_rate_cents: 11000, effective_from: "2026-07-01", effective_to: "2027-06-30", approval_state: "STATE_APPROVED", expected_school_version: "${sch_v}" }
              as: FiscalOfficer
              as_user_id: "u-fiscal-1"
              captures: { rs_id: $.data.id }
            - call: "POST /ood-placements/students"
              payload: { state_student_id: "SS-C005", full_name: "Elio Barrantes", district_of_residence: "Northvale USD", disability_category: "AUTISM", iep_effective_date: "2026-08-15", lre_current_setting: "RESOURCE_40_79" }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { stu_id: $.data.id }
            - call: "POST /ood-placements/placement-decisions"
              payload: { student_id: "${stu_id}", recommended_placement_type: "DAY", lre_justification: "Two quarters of in-district resource room support produced no measurable progress on the communication goals.", continuum_options_considered: [{ setting: "GENERAL_EDUCATION_WITH_SUPPORTS", rejected_reason: "No progress." }, { setting: "RESOURCE_ROOM", rejected_reason: "Insufficient intensity." }, { setting: "SELF_CONTAINED_CLASS", rejected_reason: "No certified program." }] }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
              captures: { dec_id: $.data.id }
            - call: "POST /ood-placements/placement-decisions/${dec_id}/submit"
              payload: {}
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
            - call: "POST /ood-placements/placement-decisions/${dec_id}/approve"
              payload: { reviewer_notes: "Approved." }
              as: TeamChair
              as_user_id: "u-chair-1"
          trigger:
            - call: "POST /ood-placements/placements"
              payload: { student_id: "${stu_id}", school_id: "${sch_id}", decision_id: "${dec_id}", rate_schedule_id: "${rs_id}", fiscal_account_id: "${acct_id}", placement_type: "HYBRID", start_date: "2026-09-01", end_date: "2027-06-15", contracted_instructional_days: 180, contracted_residential_nights: 0, transportation_required: false }
              as: PlacementCoordinator
              as_user_id: "u-coord-1"
          assert:
            - "The trigger returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
