  - section: errors
    instances:
      - name: request_with_a_missing_auth_header_or_an_invalid_role_is_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MISSING_AUTH_HEADER]
          - errors[ERR_INVALID_ROLE]
          - validations[priority=1]
        distinguishing_aspect: "The two auth failures are distinguished and both outrank every business rule: a present-but-empty X-User-ID is treated as absent and yields ERR_MISSING_AUTH_HEADER, while a well-formed but unknown role string yields ERR_INVALID_ROLE, and neither degrades into the 403 ERR_UNAUTHORIZED that a known-but-disallowed role would produce."
        test_recipe:
          setup:
            - "No domain state is required; the clock is pinned only so the responses are reproducible."
            - "Header cases are sent as empty strings, never as whitespace: an empty X-User-ID header is the missing-header case."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FranchiseDevelopmentManager
          trigger:
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection", tier: "UPSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: BrandStandardsDirector
              as_user_id: ""
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection", tier: "UPSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: ""
              as_user_id: bsd-01
            - call: "POST /brands"
              payload: { code: "SOLARIS", name: "Solaris Collection", tier: "UPSCALE", base_royalty_rate_pct: 5.00, marketing_fund_rate_pct: 2.50, protected_radius_miles: 5.00, min_room_count: 80, standard_term_years: 20 }
              as: RegionalDirector
              as_user_id: rd-01
          assert:
            - "Trigger 1: HTTP 401 with data.error_id == ERR_MISSING_AUTH_HEADER"
            - "Trigger 2: HTTP 401 with data.error_id == ERR_MISSING_AUTH_HEADER (an empty role header is a missing header, not an invalid role)"
            - "Trigger 3: HTTP 401 with data.error_id == ERR_INVALID_ROLE"
            - "No Brand row was created by any of the three calls: GET /brands/{any id} is impossible because no id was minted, and a later valid POST /brands with code SOLARIS succeeds rather than returning ERR_BRAND_CODE_TAKEN"

