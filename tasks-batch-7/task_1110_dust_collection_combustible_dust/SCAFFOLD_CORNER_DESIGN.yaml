scaffold_corner_design:
  # =====================================================================
  # From Table 1 (Entities)
  # =====================================================================
  - section: entities
    instances:
      - name: site_creation_required_fields_and_defaults
        claim_type: creation
        grounds:
          - entities.Site
        distinguishing_aspect: "POST /sites with all required fields returns 201 with posture=CONDITIONAL (initial), posture_score=100, counters zeroed."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "A", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
          trigger:
            - call: "GET /api/sites/${s}"
              as: ComplianceEngineer
          assert:
            - "Site.${s}.posture == CONDITIONAL"
            - "Site.${s}.open_critical_findings == 0"
            - "Site.${s}.open_overdue_housekeeping == 0"
            - "Site.${s}.hot_work_in_progress == 0"

      - name: site_get_non_existent_returns_not_found
        claim_type: not_found
        grounds:
          - entities.Site
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a random UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ComplianceEngineer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: dust_sample_input_field_kst_zero_yields_st0_noncombustible
        claim_type: defaults
        grounds:
          - entities.DustSample.fields.combustible
          - calculations.kst_classify
        distinguishing_aspect: "kst=0 -> sample_class=ST0, combustible=false (boundary at exact zero)."
        test_recipe:
          setup: ["Site exists"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
          trigger:
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "inert", kst_bar_m_per_s: 0, pmax_bar_g: 0.1, mie_mj: 1000, lab_report_ref: "L" }
              as: ComplianceEngineer
              captures: { samp: $.data.id }
          assert:
            - "DustSample.${samp}.sample_class == ST0"
            - "DustSample.${samp}.combustible == false"

      - name: collector_computed_air_to_cloth_ratio
        claim_type: computed_fields
        grounds:
          - entities.Collector.fields.air_to_cloth_ratio
        distinguishing_aspect: "air_to_cloth_ratio is server-computed = design_airflow_acfm / filter_area_ft2; client-supplied value (if any) ignored."
        test_recipe:
          setup: ["Site + DustSample"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "d", kst_bar_m_per_s: 100, pmax_bar_g: 8, mie_mj: 10, lab_report_ref: "L" }
              as: ComplianceEngineer
              captures: { samp: $.data.id }
          trigger:
            - call: "POST /api/sites/${s}/collectors"
              payload: { tag: "C", dust_sample_id: "${samp}", design_airflow_acfm: 5000, filter_area_ft2: 1000, internal_volume_m3: 8, installed_vent_area_m2: 500 }
              as: ComplianceEngineer
              captures: { col: $.data.id }
          assert:
            - "Collector.${col}.air_to_cloth_ratio == 5.0"

      - name: site_id_fk_reverse_reachable
        claim_type: parent_relationship
        grounds:
          - entities.DustSample.fields.site_id
          - entities.Collector.fields.site_id
        distinguishing_aspect: "Every child collection is reachable via GET /sites/{id}/<collection>; the fk site_id filter is also exposed on list endpoints where applicable."
        test_recipe:
          setup: ["Site with 2 dust samples"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "a", kst_bar_m_per_s: 10, pmax_bar_g: 8, mie_mj: 10, lab_report_ref: "L" }
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "b", kst_bar_m_per_s: 20, pmax_bar_g: 8, mie_mj: 10, lab_report_ref: "L" }
              as: ComplianceEngineer
          trigger:
            - call: "GET /api/sites/${s}/dust-samples"
              as: ComplianceEngineer
          assert:
            - "total_count == 2"
            - "every returned row has site_id == ${s}"

  # =====================================================================
  # From Table 2 (State Machines)
  # =====================================================================
  - section: state_machines
    instances:
      - name: collector_draft_to_decommissioned_invalid
        claim_type: invalid_transition
        grounds:
          - state_machines.Collector
        distinguishing_aspect: "DRAFT -> DECOMMISSIONED is not a valid transition; only OUT_OF_SERVICE -> DECOMMISSIONED is. Returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Site, Collector in DRAFT"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "d", kst_bar_m_per_s: 100, pmax_bar_g: 8, mie_mj: 10, lab_report_ref: "L" }
              as: ComplianceEngineer
              captures: { samp: $.data.id }
            - call: "POST /api/sites/${s}/collectors"
              payload: { tag: "C", dust_sample_id: "${samp}", design_airflow_acfm: 5000, filter_area_ft2: 1000, internal_volume_m3: 8, installed_vent_area_m2: 500 }
              as: ComplianceEngineer
              captures: { col: $.data.id }
          trigger:
            - call: "POST /api/sites/${s}/collectors/${col}/decommission"
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Collector.${col}.status == DRAFT"

      - name: hotwork_permit_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.HotWorkPermit
        distinguishing_aspect: "Once a permit is VOIDED it cannot transition further; calling /start on a VOIDED permit returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Permit VOIDED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/hot-work-permits"
              payload: { work_description: "W", issuer_id: "sm-1", performer_id: "hp-1", valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-05-01T04:00:00Z", fire_watch_minutes_after: 30 }
              as: SafetyManager
              captures: { p: $.data.id }
            - call: "POST /api/sites/${s}/hot-work-permits/${p}/void"
              as: SafetyManager
          trigger:
            - call: "POST /api/sites/${s}/hot-work-permits/${p}/start"
              as: HotWorkPerformer
              as_user_id: "hp-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HotWorkPermit.${p}.status == VOIDED"

      - name: inspection_accept_requires_all_findings_terminal
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Inspection
        distinguishing_aspect: "SUBMITTED -> ACCEPTED blocked while any finding is not VERIFIED or WITHDRAWN."
        test_recipe:
          setup: ["Inspection with one OPEN finding, inspection SUBMITTED"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/inspections"
              payload: { inspector_kind: "AHJ", inspector_ref: "r", conducted_at: "2026-05-01T00:00:00Z" }
              as: InspectorUser
              captures: { insp: $.data.id }
            - call: "POST /api/sites/${s}/inspections/${insp}/findings"
              payload: { severity: "MINOR", description: "f", due_at: "2026-06-01T00:00:00Z" }
              as: InspectorUser
            - call: "POST /api/sites/${s}/inspections/${insp}/submit"
              as: InspectorUser
          trigger:
            - call: "POST /api/sites/${s}/inspections/${insp}/accept"
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Inspection.${insp}.status == SUBMITTED"

      - name: finding_reopen_increments_critical_counter
        claim_type: side_effect_execution
        grounds:
          - state_machines.InspectionFinding
        distinguishing_aspect: "Excluded — already covered by Rule-9 instance `critical_finding_counter_invariant_under_resolve_and_reopen`."
        excluded_because:
          difficulty_instance: compensating_invariant / critical_finding_counter_invariant_under_resolve_and_reopen
          rationale: "Rule-9 instance asserts the increment on REOPENED as the compensating half of the conserved-quantity invariant."

      - name: capa_action_overdue_auto_transition_via_clock
        claim_type: valid_transition
        grounds:
          - state_machines.CAPAAction
        distinguishing_aspect: "OPEN -> OVERDUE auto-fires when current clock passes due_at; verified by reading the CAPAAction after clock advance."
        test_recipe:
          setup: ["Incident with CAPA due 2026-05-02"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/incidents"
              payload: { occurred_at: "2026-05-01T00:00:00Z", kind: "NEAR_MISS", description: "d", severity: "MINOR", root_cause_code: "HOUSEKEEPING", investigation_lead_id: "inv-1" }
              as: ComplianceManager
              captures: { inc: $.data.id }
            - call: "POST /api/sites/${s}/incidents/${inc}/capa-actions"
              payload: { description: "a", owner_id: "inv-1", due_at: "2026-05-02T00:00:00Z" }
              as: IncidentInvestigator
              captures: { capa: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/sites/${s}/incidents/${inc}"
              as: ComplianceEngineer
          assert:
            - "Incident.${inc}.capa_open_count == 1"

  # =====================================================================
  # From Table 3 (Calculations)
  # =====================================================================
  - section: calculations
    instances:
      - name: housekeeping_schedule_no_audits_is_overdue
        claim_type: correct_result
        grounds:
          - calculations.housekeeping_schedule
        distinguishing_aspect: "When last_audit_at is null the program's current_posture MUST be OVERDUE (never-audited programs are non-compliant)."
        test_recipe:
          setup: ["Program created, no audits recorded"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/housekeeping-programs"
              payload: { name: "P", target_accumulation_g_per_m2: 1.0, frequency_hours: 24 }
              as: ComplianceEngineer
              captures: { prog: $.data.id }
          trigger:
            - call: "GET /api/sites/${s}/housekeeping-programs/${prog}"
              as: ComplianceEngineer
          assert:
            - "HousekeepingProgram.${prog}.current_posture == OVERDUE"
            - "HousekeepingProgram.${prog}.next_due_at is null"

      - name: housekeeping_audit_pass_threshold_uses_snapshot
        claim_type: constants_applied
        grounds:
          - entities.HousekeepingAudit.fields.pass_threshold_g_per_m2
          - entities.HousekeepingAudit.fields.pass
        distinguishing_aspect: "pass_threshold is snapshotted at audit creation; subsequent program.target changes do NOT retroactively change a prior audit's pass/fail."
        test_recipe:
          setup: ["Program threshold 1.0; audit created with measured 1.5 (fail). Then program target updated to 2.0"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/housekeeping-programs"
              payload: { name: "P", target_accumulation_g_per_m2: 1.0, frequency_hours: 24 }
              as: ComplianceEngineer
              captures: { prog: $.data.id }
            - call: "POST /api/sites/${s}/housekeeping-programs/${prog}/audits"
              payload: { auditor_id: "aud-1", measured_accumulation_g_per_m2: 1.5, scheduled_for: "2026-05-01T00:00:00Z" }
              as: HousekeepingAuditor
              captures: { aud: $.data.id }
          trigger:
            - call: "POST /api/sites/${s}/housekeeping-programs/${prog}/audits/${aud}/record"
              as: HousekeepingAuditor
              as_user_id: "aud-1"
          assert:
            - "HousekeepingAudit.${aud}.pass_threshold_g_per_m2 == 1.0"
            - "HousekeepingAudit.${aud}.pass == false"
            - "HousekeepingAudit.${aud}.status == RECORDED"

      - name: site_posture_stop_work_overrides_high_score
        claim_type: correct_result
        grounds:
          - calculations.site_posture_derivation
        distinguishing_aspect: "STOP_WORK overrides the numeric bands regardless of posture_score: 2 critical findings force STOP_WORK even when other penalties are zero and score is still in the COMPLIANT band."
        test_recipe:
          setup: ["Site with exactly 2 OPEN CRITICAL findings and nothing else"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/inspections"
              payload: { inspector_kind: "AHJ", inspector_ref: "r", conducted_at: "2026-05-01T00:00:00Z" }
              as: InspectorUser
              captures: { insp: $.data.id }
            - call: "POST /api/sites/${s}/inspections/${insp}/findings"
              payload: { severity: "CRITICAL", description: "f1", due_at: "2026-06-01T00:00:00Z" }
              as: InspectorUser
            - call: "POST /api/sites/${s}/inspections/${insp}/findings"
              payload: { severity: "CRITICAL", description: "f2", due_at: "2026-06-01T00:00:00Z" }
              as: InspectorUser
            - call: "POST /api/sites/${s}/recompute_posture"
              as: PlatformAdmin
          trigger:
            - call: "GET /api/sites/${s}"
              as: ComplianceEngineer
          assert:
            - "Site.${s}.open_critical_findings == 2"
            - "Site.${s}.posture == STOP_WORK"

      - name: dp_reading_slope_detection_rising
        claim_type: correct_result
        grounds:
          - calculations.dp_trend_derivation
        distinguishing_aspect: "3 readings [2.0, 3.0, 4.0] (delta=2.0 >= 1.5) -> RISING. 3 readings [2.0, 2.5, 3.0] (delta=1.0 < 1.5) -> STABLE."
        test_recipe:
          setup: ["Collector in service"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "d", kst_bar_m_per_s: 100, pmax_bar_g: 8, mie_mj: 10, lab_report_ref: "L" }
              as: ComplianceEngineer
              captures: { samp: $.data.id }
            - call: "POST /api/sites/${s}/collectors"
              payload: { tag: "C", dust_sample_id: "${samp}", design_airflow_acfm: 5000, filter_area_ft2: 1000, internal_volume_m3: 8, installed_vent_area_m2: 500 }
              as: ComplianceEngineer
              captures: { col: $.data.id }
            - call: "POST /api/sites/${s}/collectors/${col}/commission"
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/collectors/${col}/dp-readings"
              payload: { dp_inwc: 2.0 }
              as: ComplianceEngineer
            - call: "POST /api/sites/${s}/collectors/${col}/dp-readings"
              payload: { dp_inwc: 2.5 }
              as: ComplianceEngineer
          trigger:
            - call: "POST /api/sites/${s}/collectors/${col}/dp-readings"
              payload: { dp_inwc: 3.0 }
              as: ComplianceEngineer
            - call: "GET /api/sites/${s}/collectors/${col}"
              as: ComplianceEngineer
          assert:
            - "Collector.${col}.dp_trend == STABLE"

  # =====================================================================
  # From Table 4 (Validations)
  # =====================================================================
  - section: validations
    instances:
      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Request without X-User-Role header returns 401 ERR_UNAUTHENTICATED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/sites"
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED"

      - name: wrong_role_returns_unauthorized
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "HousekeepingAuditor cannot create a DustSample (role not in endpoint roles); returns 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["Site"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
          trigger:
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "d", kst_bar_m_per_s: 100, pmax_bar_g: 8, mie_mj: 10, lab_report_ref: "L" }
              as: HousekeepingAuditor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED"

      - name: invalid_enum_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - validations[priority=28]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Passing severity=SUPER_CRITICAL (not in declared enum) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Site + Inspection"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/inspections"
              payload: { inspector_kind: "AHJ", inspector_ref: "r", conducted_at: "2026-05-01T00:00:00Z" }
              as: InspectorUser
              captures: { insp: $.data.id }
          trigger:
            - call: "POST /api/sites/${s}/inspections/${insp}/findings"
              payload: { severity: "SUPER_CRITICAL", description: "f", due_at: "2026-06-01T00:00:00Z" }
              as: InspectorUser
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: permit_window_invalid_over_24h
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_PERMIT_WINDOW_INVALID]
        distinguishing_aspect: "valid_to > valid_from + 24h returns ERR_PERMIT_WINDOW_INVALID at issue time."
        test_recipe:
          setup: ["Site"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
          trigger:
            - call: "POST /api/sites/${s}/hot-work-permits"
              payload: { work_description: "W", issuer_id: "sm-1", performer_id: "hp-1", valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-05-03T00:00:00Z", fire_watch_minutes_after: 30 }
              as: SafetyManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PERMIT_WINDOW_INVALID"

      - name: permit_fire_watch_below_30_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_FIRE_WATCH_TOO_SHORT]
        distinguishing_aspect: "fire_watch_minutes_after=29 returns ERR_FIRE_WATCH_TOO_SHORT; =30 succeeds (boundary >=30 inclusive)."
        test_recipe:
          setup: ["Site"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
          trigger:
            - call: "POST /api/sites/${s}/hot-work-permits"
              payload: { work_description: "W", issuer_id: "sm-1", performer_id: "hp-1", valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-05-01T04:00:00Z", fire_watch_minutes_after: 29 }
              as: SafetyManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FIRE_WATCH_TOO_SHORT"

      - name: sod_dha_author_cannot_approve_own
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_SOD_VIOLATION]
        distinguishing_aspect: "DHA.author_id == approver X-User-ID returns ERR_SOD_VIOLATION; segregation-of-duties check fires even though the role is permitted."
        test_recipe:
          setup: ["Site, DHA authored by user 'mgr-1', then approver tries as X-User-ID 'mgr-1'"]
          setup_api_calls:
            - call: "POST /api/sites"
              payload: { name: "S", address: "x", ahj_authority: "j", insurer_id: "FM-1" }
              as: PlatformAdmin
              captures: { s: $.data.id }
            - call: "POST /api/sites/${s}/dust-samples"
              payload: { material_name: "d", kst_bar_m_per_s: 100, pmax_bar_g: 8, mie_mj: 10, lab_report_ref: "L" }
              as: ComplianceEngineer
              captures: { samp: $.data.id }
            - call: "POST /api/sites/${s}/dhas"
              payload: { title: "T", author_id: "mgr-1" }
              as: ComplianceEngineer
              captures: { dha: $.data.id }
            - call: "POST /api/sites/${s}/dhas/${dha}/samples/${samp}"
              as: ComplianceEngineer
