            - { call: "POST /hotline/cases/${c1}/assignments", payload: { expected_case_version: "${c1_v}" }, as: IntakeSpecialist, as_user_id: "${s_int}", captures: { a1: $.data.id } }
            - { call: "POST /hotline/assignments/${a1}/screen", payload: { outcome: CLEAR }, as: IntakeSpecialist, as_user_id: "${s_int}" }
          trigger:
            - { call: "POST /hotline/interviews", payload: { case_id: "${c1}", interviewee_role: WITNESS, interviewee_identifier: "w-1", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { err_id: "$.data.error_id" } }
            - { call: "POST /hotline/assignments/${a1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/interviews", payload: { case_id: "${c1}", interviewee_role: WITNESS, interviewee_identifier: "w-1", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { iv1: $.data.id, iv1_st: $.data.status, iv1_inv: $.data.investigator_id } }
          assert:
            - "trigger[0]: err_id == ERR_CASE_NOT_UNDER_INVESTIGATION (case was ASSIGNED)"
            - "trigger[2] after activation: iv1_st == SCHEDULED and iv1_inv == ${s_inv}"

      - name: closure_entry_gated_by_active_legal_hold
        grounds:
          - state_machines.HotlineCase.DETERMINATION_REVIEW_to_CLOSURE_READY
          - state_machines.LegalHold.ACTIVE_to_RELEASED
          - errors[ERR_LEGAL_HOLD_FREEZE]
          - entities.HotlineCase.fields.posture
        distinguishing_aspect: |
          Entity pair HotlineCase -> LegalHold (different pair than Interview -> HotlineCase):
          the DETERMINATION_REVIEW -> CLOSURE_READY transition is rejected while any hold
          on the case is ACTIVE, and proceeds once a second officer releases the hold.
        test_recipe:
          setup:
            - "Staff: intake, off1, off2, inv; UNSUBSTANTIATED determination SUBMITTED (case in DETERMINATION_REVIEW); ACTIVE legal hold placed by off1"
          setup_api_calls:
