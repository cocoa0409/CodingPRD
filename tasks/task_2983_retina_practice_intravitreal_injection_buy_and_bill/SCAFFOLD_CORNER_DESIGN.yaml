            - "both plans remain at their pre-request version and status MAINTENANCE-free (LOADING), unchanged by the rejections"

      - name: corner_lot_uniqueness_and_lot_state_gates_including_a_pre_empted_recall_guard
        claim_type: priority_ordering
        grounds:
          - validations.priority_13
          - validations.priority_35
          - validations.priority_40
          - errors[ERR_DUPLICATE_LOT_NUMBER]
          - errors[ERR_LOT_STATE_INVALID]
          - errors[ERR_RECALL_ALREADY_OPEN]
        distinguishing_aspect: "Lot number uniqueness is scoped to (drug_id, lot_number) — the same lot number on a different drug is accepted; quarantine/release are state-gated in both directions; a second recall on the same lot is ERR_RECALL_ALREADY_OPEN, but once the lot is RECALLED the priority-13 state gate PRE-EMPTS priority 40, so releasing it returns ERR_LOT_STATE_INVALID rather than ERR_RECALL_ALREADY_OPEN."
        test_recipe:
          setup:
            - "Drug REF with lot RX-9001 AVAILABLE, plus a second drug BIO-A for the cross-drug uniqueness probe"
          setup_api_calls:
            - *k_clk
            - *k_drug_ref
            - *k_drug_bio_a
            - *k_lot
          trigger:
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9001", expiration_date: "2027-09-30T00:00:00Z", received_date: "2026-07-15T00:00:00Z", unit_acquisition_cost_cents: 132000, vials_received: 2 }
              as: PharmacyTech
              captures: { k_lg_dup: $.data.error_id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_bio_a_id}", lot_number: "RX-9001", expiration_date: "2027-09-30T00:00:00Z", received_date: "2026-07-15T00:00:00Z", unit_acquisition_cost_cents: 96000, vials_received: 2 }
              as: PharmacyTech
              captures: { k_lg_crossdrug_id: $.data.id, k_lg_crossdrug_status: $.data.status }
            - call: "POST /drug-lots/${k_lot_id}/release"
              as: ComplianceOfficer
              captures: { k_lg_release_available: $.data.error_id }
            - call: "POST /drug-lots/${k_lot_id}/quarantine"
              payload: { quarantine_reason: "Visible particulate reported by pharmacy" }
              as: PharmacyTech
              captures: { k_lg_q1: $.data.status }
            - call: "POST /drug-lots/${k_lot_id}/quarantine"
              payload: { quarantine_reason: "Duplicate quarantine attempt" }
              as: PharmacyTech
              captures: { k_lg_q2: $.data.error_id }
            - call: "POST /drug-lots/${k_lot_id}/release"
              as: ComplianceOfficer
              captures: { k_lg_release_ok: $.data.status }
            - call: "POST /lot-recalls"
              payload: { drug_lot_id: "${k_lot_id}", recall_class: "CLASS_III", reason: "Manufacturer label defect" }
              as: ComplianceOfficer
              captures: { k_lg_recall_id: $.data.id, k_lg_recall_status: $.data.status }
            - call: "POST /lot-recalls"
              payload: { drug_lot_id: "${k_lot_id}", recall_class: "CLASS_II", reason: "Second recall on the same lot" }
              as: ComplianceOfficer
              captures: { k_lg_recall_dup: $.data.error_id }
            - call: "POST /drug-lots/${k_lot_id}/release"
              as: ComplianceOfficer
              captures: { k_lg_release_recalled: $.data.error_id }
          assert:
            - "${k_lg_dup} == \"ERR_DUPLICATE_LOT_NUMBER\" with HTTP 409"
            - "${k_lg_crossdrug_status} == AVAILABLE — the same lot number under a different drug_id is a distinct key"
            - "${k_lg_release_available} == \"ERR_LOT_STATE_INVALID\" (release requires QUARANTINED) and ${k_lg_q2} == \"ERR_LOT_STATE_INVALID\" (quarantine requires AVAILABLE), both HTTP 409"
            - "${k_lg_q1} == QUARANTINED and ${k_lg_release_ok} == AVAILABLE with all 5 vials back IN_STOCK"
            - "${k_lg_recall_status} == INITIATED and ${k_lg_recall_dup} == \"ERR_RECALL_ALREADY_OPEN\" with HTTP 409"
            - "${k_lg_release_recalled} == \"ERR_LOT_STATE_INVALID\" — priority 13 fires before priority 40 on the RECALLED lot"

      - name: corner_quarantining_a_lot_blocks_documentation_and_new_selection_by_two_different_errors
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_26
          - validations.priority_27
          - errors[ERR_LOT_NOT_AVAILABLE]
          - errors[ERR_NO_ELIGIBLE_VIAL]
          - errors[ERR_VIAL_STATE_INVALID]
        distinguishing_aspect: "A quarantine that lands between reservation and documentation splits into two different rejections: the already-reserved vial's parent lot is no longer AVAILABLE, so documenting it is ERR_LOT_NOT_AVAILABLE (priority 27), while a brand-new encounter finds no candidate at all and is ERR_NO_ELIGIBLE_VIAL (priority 26). ERR_VIAL_STATE_INVALID is the defensive guard behind both: lot quarantine leaves the RESERVED vial RESERVED, so the lot-level check always answers first."
        test_recipe:
          setup:
            - "the corner prologue with DRAFT encounter ENC-NP holding one RESERVED vial of RX-9001"
            - "the lot then quarantined by pharmacy, which moves only its IN_STOCK vials"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - *k_enc_np
            - call: "POST /drug-lots/${k_lot_id}/quarantine"
              payload: { quarantine_reason: "Cold-chain excursion during transit" }
              as: PharmacyTech
              captures: { k_vg_lot_status: $.data.status, k_vg_lot_reserved: $.data.vials_reserved, k_vg_lot_quarantined: $.data.vials_quarantined }
            - call: "POST /imaging-studies"
              payload: { patient_id: "${k_pt_np_id}", eye: "OD", study_datetime: "2026-08-01T02:00:00Z", central_subfield_thickness_um: 415, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 56 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_vg_img_id: $.data.id }
            - call: "GET /treatment-plans/${k_plan_np_id}"
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_vg_plan_v: $.data.version }
          trigger:
            - call: "POST /injection-encounters/${k_enc_np_id}/document"
              payload: { administered_dose_ml: 0.06, injection_site_prep_confirmed: true, post_injection_iop_mmhg: 15 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_vg_doc: $.data.error_id }
            - call: "GET /vials?drug_lot_id=${k_lot_id}&status=RESERVED"
              as: PharmacyTech
              captures: { k_vg_vial_status: "$.data[0].status" }
          assert:
            - "${k_vg_lot_status} == QUARANTINED with ${k_vg_lot_quarantined} == 4 and ${k_vg_lot_reserved} == 1 — the reserved vial was not swept"
            - "${k_vg_doc} == \"ERR_LOT_NOT_AVAILABLE\" with HTTP 409 and the encounter still DRAFT"
            - "${k_vg_vial_status} == RESERVED — this is why ERR_VIAL_STATE_INVALID cannot be provoked from outside: every declared path that removes a vial from RESERVED (recall, plan suspension, void) also voids the holding encounter in the same request, so the priority-27 lot check or the encounter's own state gate answers first; the guard exists for internal reservation attempts only"
            - "a fresh encounter created for the same plan while the lot is QUARANTINED is rejected with ERR_NO_ELIGIBLE_VIAL (priority 26) — a different error for the same physical cause"

      - name: corner_unique_keys_and_reference_drug_integrity_are_enforced_per_key
