              payload: { presenting_needs: ["FOOD"], urgency: "ROUTINE", household_size: 1, disability_flag: false }
              as: Caseworker
              captures: { i6_id: $.data.id }
            - call: "POST /intakes/${i6_id}/screen"
              payload: {}
              as: Caseworker
            - call: "POST /clients/${c6_id}/consent-grants"
              payload: { provider_id: "${p6_id}", scope: "BASIC_CONTACT" }
              as: Client
              as_user_id: "${c6_id}"
              captures: { cg6_id: $.data.id }
            - call: "POST /intakes/${i6_id}/referrals"
              payload: { program_id: "${prog6_id}", consent_grant_id: "${cg6_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r6a_id: $.data.id }
            - call: "POST /referrals/${r6a_id}/accept"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p6_id}"
            - call: "POST /referrals/${r6a_id}/start-service"
              payload: {}
              as: ProviderStaff
              as_user_id: "${p6_id}"
            - call: "POST /referrals/${r6a_id}/outcome-reports"
              payload: { outcome: "FULLY_MET", service_hours: 5.0, follow_up_needed: false }
              as: ProviderStaff
              as_user_id: "${p6_id}"
              captures: { or6a_id: $.data.id }
            # Bring 4 more referrals into PROPOSED to push intake_posture to RESTRICTED (4/5=0.80)
            - call: "POST /intakes/${i6_id}/referrals"
              payload: { program_id: "${prog6_id}", consent_grant_id: "${cg6_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r6b_id: $.data.id }
            - call: "POST /intakes/${i6_id}/referrals"
              payload: { program_id: "${prog6_id}", consent_grant_id: "${cg6_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r6c_id: $.data.id }
            - call: "POST /intakes/${i6_id}/referrals"
              payload: { program_id: "${prog6_id}", consent_grant_id: "${cg6_id}", transport_mode: "CAR" }
              as: Caseworker
              captures: { r6d_id: $.data.id }
          trigger:
            # After setup: R6a in SERVICE_IN_PROGRESS + R6b, R6c, R6d PROPOSED = 4 slots taken / 5 total
            # = 0.80 utilization → intake_posture == RESTRICTED (system posture transition from OPEN
            # happens as a side-effect of the last create). Then this trigger generates a FunderReport
            # that includes OR6a → advances funder_reporting_posture OPEN → LOCKED but must NOT
            # change intake_posture.
            - call: "POST /funders/${f6_id}/reports"
              payload: { reporting_period_start: "2026-05-01T00:00:00Z", reporting_period_end: "2026-07-01T00:00:00Z", rounding_variant: "SUM_THEN_ROUND" }
              as: PlatformAdmin
