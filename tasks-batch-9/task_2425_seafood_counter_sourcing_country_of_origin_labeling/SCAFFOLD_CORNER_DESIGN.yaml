              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 2 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T14:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 2, reading_at: "2026-08-01T09:00:00Z", temperature_c: 5.0, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/ice-bed-readings"
              payload: { counter_id: "${counter_id}", case_slot: 2, reading_at: "2026-08-01T13:00:00Z", temperature_c: 4.9, taken_by_user_id: "assoc-7" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "GET /seafood-ops/excursions"
              payload: { counter_id: "${counter_id}", status: "OPEN" }
