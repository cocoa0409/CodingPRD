          - state_machines.PromotionalPlan.ACCRUING_to_PAID
          - state_machines.PromotionalPlan.DEFAULTED_to_ACCRUING
          - calculations.payoff_ledger_projection
          - entities.PromotionalPlan.fields.final_settlement_amount_cents
        distinguishing_aspect: "A conserved balance-sheet quantity, the plan's outstanding balance, defined as B = principal_cents + deferred_interest_accrued_cents + sum of ledger INCREASE amounts - sum of ledger DECREASE amounts: a payoff's forward effect and the corresponding reinstatement leave B exactly unchanged once the ledger delta is replayed, so the quantity carries no drift across the PAID -> reinstate -> ACCRUING round trip."
