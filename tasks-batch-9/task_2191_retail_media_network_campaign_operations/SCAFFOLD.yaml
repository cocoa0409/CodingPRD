# =============================================================================
# PRD Benchmark Scaffold — task_2191_retail_media_network_campaign_operations
# Sections §1.0 through §1.7 (§1.8 / §1.9 live in sibling design files)
# =============================================================================

scenario: |
  2191. Retail Media Network Campaign Operations (retailer media network): advertiser
  onboarding & budget setup, sponsored placement auction & relevance ranking, on-site vs
  off-site campaign coordination, closed-loop sales attribution & incrementality
  measurement, catalog/product eligibility & out-of-stock pausing, self-serve vs managed
  service workflows, invoicing/deduction against trade funds, measurement dispute &
  reporting SLA

domain_name: retail-media-network-campaign-ops
api_prefix: /rmn

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: temporal windowing
  complexity_layers:
    - selector policy
    - dual-variant calculation
    - cascading side effects
    - optimistic concurrency

  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: expert_plus
  entity_count: 15
  state_machine_count: 13
  concurrency_rule_count: 6
  calculation_count: 18
  validation_count: 79
  endpoint_count: 101
  error_code_count: 79
  role_count: 8

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Advertiser
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Advertiser legal entity name" }
      - { name: brand_code, type: string, source: input, description: "Short brand code; unique across all Advertiser rows regardless of onboarding_status", constraints: "uppercase A-Z0-9, 3-12 chars, globally unique" }
      - { name: service_model, type: enum, source: input, description: "Whether the advertiser self-manages or is agency-managed", constraints: "SELF_SERVE | MANAGED", default: SELF_SERVE }
      - { name: onboarding_status, type: enum, source: system, description: "Onboarding lifecycle state", constraints: "DRAFT | SUBMITTED | KYC_REVIEW | CREDIT_HOLD | ACTIVE | SUSPENDED | REJECTED | TERMINATED", default: DRAFT }
      - { name: parent_advertiser_id, type: string, source: input, description: "FK -> Advertiser.id; nullable; agency umbrella parent whose credit_limit_cents backstops this child brand", constraints: "nullable; must not equal own id; parent must have parent_advertiser_id == null (one level only)" }
      - { name: account_manager_user_id, type: string, source: input, description: "Opaque AccountManager operator id owning the managed workflow; nullable", constraints: "required when service_model == MANAGED; must be null when service_model == SELF_SERVE" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum unsettled credit exposure permitted for this advertiser", default: 0, constraints: ">= 0" }
      - { name: credit_exposure_cents, type: integer, source: computed, description: "Sum of committed_total_cents over own BudgetPlan rows with plan_status IN {APPROVED, ACTIVE, EXHAUSTED} plus net_cash_due_cents over own Invoice rows with invoice_status IN {ISSUED, DISPUTED, ADJUSTED}" }
      - { name: kyc_document_count, type: integer, source: input, description: "Count of KYC documents attached at onboarding submission", default: 0 }
      - { name: suspension_reason, type: enum, source: system, description: "Why the advertiser is currently suspended", constraints: "NONE | CREDIT_BREACH | COMPLIANCE | MANUAL", default: NONE }
      - { name: self_serve_daily_spend_cap_cents, type: integer, source: input, description: "Hard per-day spend ceiling applied only when service_model == SELF_SERVE", default: 500000 }
      - { name: managed_service_fee_pct, type: number, source: input, description: "Managed-service fee rate applied to gross spend on invoices", default: 0.0, constraints: "0.0 <= x <= 0.20; must be 0.0 when service_model == SELF_SERVE" }
      - { name: dispute_credit_balance_cents, type: integer, source: computed, description: "Sum of approved_credit_cents over MeasurementDispute rows with dispute_status == UPHELD whose Invoice has invoice_status != SETTLED" }
      - { name: onboarding_submitted_by_user_id, type: string, source: system, description: "Opaque operator id that submitted onboarding; used for segregation-of-duties checks" }
      - { name: kyc_decided_by_user_id, type: string, source: system, description: "Opaque CreditAnalyst id that rendered the KYC/credit decision; nullable" }

  - name: BudgetPlan
    parent: null
    common_fields: true
    fields:
      - { name: advertiser_id, type: string, source: input, description: "FK -> Advertiser.id; owner of this budget plan" }
      - { name: fiscal_period_code, type: string, source: input, description: "Retailer fiscal period label", constraints: "^\\d{4}-Q[1-4]$" }
      - { name: plan_status, type: enum, source: system, description: "Budget plan approval and consumption state", constraints: "DRAFT | PENDING_APPROVAL | APPROVED | ACTIVE | EXHAUSTED | CLOSED | REJECTED", default: DRAFT }
      - { name: committed_total_cents, type: integer, source: input, description: "Total funds committed for the period across cash and trade funds", constraints: ">= 100000" }
      - { name: trade_fund_share_cents, type: integer, source: input, description: "Portion of committed_total_cents to be drawn from the advertiser's TradeFundAccount", default: 0, constraints: "0 <= x <= committed_total_cents" }
      - { name: cash_share_cents, type: integer, source: computed, description: "committed_total_cents - trade_fund_share_cents" }
      - { name: reserved_cents, type: integer, source: computed, description: "Sum of Campaign.allocated_budget_cents over Campaign rows on this plan with delivery_status IN {SCHEDULED, DELIVERING, PAUSED}" }
      - { name: consumed_cents, type: integer, source: computed, description: "Sum of AuctionEvent.settled_spend_cents over AuctionEvent rows with status == SETTLED whose winning LineItem belongs to a Campaign on this plan, plus sum of Campaign.offsite_reported_spend_cents for those campaigns" }
      - { name: available_cents, type: integer, source: computed, description: "committed_total_cents + top_up_total_cents - reserved_cents - consumed_cents; may be negative only via over-delivery" }
      - { name: top_up_total_cents, type: integer, source: computed, description: "Cumulative sum of accepted top-up amounts on this plan" }
      - { name: window_start_at, type: datetime, source: input, description: "Inclusive start of the plan spend window" }
      - { name: window_end_at, type: datetime, source: input, description: "Exclusive end of the plan spend window" }
      - { name: submitted_by_user_id, type: string, source: system, description: "Opaque operator id that submitted the plan for approval; nullable in DRAFT" }
      - { name: approved_by_user_id, type: string, source: system, description: "Opaque CreditAnalyst id that approved the plan; nullable" }
      - { name: revision_round, type: integer, source: system, description: "Number of times the plan has been returned for revision", default: 0 }
      - { name: exhausted_at, type: datetime, source: system, description: "Timestamp when available_cents first reached <= 0; nullable" }

  - name: TradeFundAccount
    parent: null
    common_fields: true
    fields:
      - { name: advertiser_id, type: string, source: input, description: "FK -> Advertiser.id; owner of the trade fund pool" }
      - { name: fiscal_period_code, type: string, source: input, description: "Fiscal period this pool covers", constraints: "^\\d{4}-Q[1-4]$; unique per (advertiser_id, fiscal_period_code)" }
      - { name: account_status, type: enum, source: system, description: "Trade fund pool state", constraints: "OPEN | FROZEN | RECONCILING | CLOSED", default: OPEN }
      - { name: accrual_basis, type: enum, source: input, description: "How accruals are justified", constraints: "PURCHASE_VOLUME | FIXED", default: PURCHASE_VOLUME }
      - { name: deduction_cap_pct, type: number, source: input, description: "Maximum fraction of an invoice's gross_spend_cents that may be deducted from this pool", default: 0.6, constraints: "0.0 <= x <= 1.0" }
      - { name: accrued_cents, type: integer, source: computed, description: "Cumulative sum of accrual amounts posted to this account" }
      - { name: reserved_cents, type: integer, source: computed, description: "Sum of BudgetPlan.trade_fund_share_cents over plans of the same (advertiser_id, fiscal_period_code) with plan_status IN {APPROVED, ACTIVE}" }
      - { name: deducted_cents, type: integer, source: computed, description: "Sum of Invoice.trade_fund_deduction_cents over Invoice rows referencing this account with invoice_status IN {ISSUED, DISPUTED, ADJUSTED, SETTLED}" }
      - { name: available_cents, type: integer, source: computed, description: "accrued_cents - reserved_cents - deducted_cents; never allowed below 0" }
      - { name: frozen_reason, type: enum, source: system, description: "Why the pool is frozen", constraints: "NONE | AUDIT | OVERDRAWN | MANUAL", default: NONE }
      - { name: last_reconciled_at, type: datetime, source: system, description: "Timestamp of the last reconciliation sweep; nullable" }

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: advertiser_id, type: string, source: input, description: "FK -> Advertiser.id; campaign owner" }
      - { name: budget_plan_id, type: string, source: input, description: "FK -> BudgetPlan.id; plan funding this campaign" }
      - { name: name, type: string, source: input, description: "Campaign display name" }
      - { name: channel_mix, type: enum, source: input, description: "Which media channels this campaign coordinates", constraints: "ONSITE_ONLY | OFFSITE_ONLY | OMNI" }
      - { name: delivery_status, type: enum, source: system, description: "Delivery dimension of the parallel state machine", constraints: "DRAFT | PENDING_REVIEW | SCHEDULED | DELIVERING | PAUSED | COMPLETED | REJECTED | ARCHIVED", default: DRAFT }
      - { name: billing_status, type: enum, source: system, description: "Billing dimension of the parallel state machine, evolving independently of delivery_status", constraints: "UNBILLED | ACCRUING | PENDING_INVOICE | INVOICED | DISPUTED | RECONCILED", default: UNBILLED }
      - { name: flight_start_at, type: datetime, source: input, description: "Inclusive campaign flight start" }
      - { name: flight_end_at, type: datetime, source: input, description: "Exclusive campaign flight end" }
      - { name: pacing_mode, type: enum, source: input, description: "Budget pacing strategy", constraints: "EVEN | ACCELERATED", default: EVEN }
      - { name: daily_cap_cents, type: integer, source: input, description: "Advertiser-declared daily spend ceiling for this campaign", constraints: ">= 1000" }
      - { name: allocated_budget_cents, type: integer, source: input, description: "Amount reserved from the BudgetPlan for this campaign", constraints: ">= 100000" }
      - { name: attribution_model, type: enum, source: input, description: "Closed-loop attribution variant applied to this campaign's AttributedSale rows", constraints: "LAST_TOUCH | FRACTIONAL", default: LAST_TOUCH }
      - { name: attribution_window_days, type: integer, source: input, description: "Lookback window in days from engagement to retail sale", default: 14, constraints: "1 <= x <= 30" }
      - { name: delivered_spend_cents, type: integer, source: computed, description: "Sum of AuctionEvent.settled_spend_cents over SETTLED auctions won by this campaign's LineItem rows" }
      - { name: offsite_reported_spend_cents, type: integer, source: input, description: "Off-site platform self-reported spend for this campaign, posted by BillingOps during reconciliation", default: 0 }
      - { name: offsite_variance_pct, type: number, source: computed, description: "Signed relative variance between offsite_reported_spend_cents and the on-site logged off-site spend" }
      - { name: attributed_revenue_cents, type: integer, source: computed, description: "Sum of AttributedSale.attributed_credit_cents over this campaign's LineItem rows" }
      - { name: incremental_revenue_cents, type: integer, source: computed, description: "Incremental revenue taken from the campaign's PUBLISHED IncrementalityStudy with the latest window_end_at" }
      - { name: roas, type: number, source: computed, description: "attributed_revenue_cents / (delivered_spend_cents + offsite_reported_spend_cents)" }
      - { name: iroas, type: number, source: computed, description: "incremental_revenue_cents / (delivered_spend_cents + offsite_reported_spend_cents)" }
      - { name: pacing_index, type: number, source: computed, description: "Ratio of actual spend to ideal even-pacing spend at the current clock position" }
      - { name: oos_paused_line_item_count, type: integer, source: computed, description: "Count of this campaign's LineItem rows with line_item_status == OOS_PAUSED" }
      - { name: review_decided_by_user_id, type: string, source: system, description: "Opaque operator id that approved or rejected the campaign for delivery; nullable" }
      - { name: submitted_for_review_by_user_id, type: string, source: system, description: "Opaque operator id that submitted the campaign for review; nullable" }

  - name: PlacementSlot
    parent: null
    common_fields: true
    fields:
      - { name: slot_code, type: string, source: input, description: "Unique inventory slot code", constraints: "globally unique" }
      - { name: channel, type: enum, source: input, description: "Whether the slot is retailer-owned on-site inventory or syndicated off-site inventory", constraints: "ONSITE | OFFSITE" }
      - { name: page_type, type: enum, source: input, description: "Surface the slot renders on", constraints: "SEARCH_RESULTS | CATEGORY_BROWSE | PRODUCT_DETAIL | HOMEPAGE | OFFSITE_SOCIAL | OFFSITE_DISPLAY" }
      - { name: position_index, type: integer, source: input, description: "Rendering position within the surface; 1 is topmost", constraints: ">= 1" }
      - { name: max_concurrent_line_items, type: integer, source: input, description: "Aggregate capacity: number of LineItem rows whose flight windows may overlap on this slot", constraints: ">= 1" }
      - { name: floor_cpc_cents, type: integer, source: input, description: "Reserve price; a quality-adjusted bid below this is filtered from the auction", constraints: ">= 1" }
      - { name: exclusivity_category_code, type: string, source: input, description: "When non-null, at most one overlapping LineItem per category may occupy this slot; nullable" }
      - { name: buffer_minutes, type: integer, source: input, description: "Adjacency buffer applied only when channel == OFFSITE; two flights on this slot must be separated by at least this many minutes", default: 0, constraints: ">= 0" }
      - { name: slot_status, type: enum, source: system, description: "Inventory availability state", constraints: "OPEN | MAINTENANCE | RETIRED", default: OPEN }
      - { name: relevance_weight, type: number, source: input, description: "Exponent gamma applied to relevance_score when computing quality_adjusted_score on this slot", default: 1.0, constraints: "0.5 <= x <= 2.0" }
      - { name: occupancy_count, type: integer, source: computed, description: "Count of LineItem rows on this slot with line_item_status IN {ELIGIBLE, SERVING, OOS_PAUSED, MANUAL_PAUSED}" }

  - name: LineItem
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; parent campaign" }
      - { name: placement_slot_id, type: string, source: input, description: "FK -> PlacementSlot.id; inventory slot this line item occupies" }
      - { name: line_item_status, type: enum, source: system, description: "Line item serving lifecycle", constraints: "DRAFT | PENDING_ELIGIBILITY | ELIGIBLE | SERVING | OOS_PAUSED | MANUAL_PAUSED | REJECTED | ENDED", default: DRAFT }
      - { name: bid_cents, type: integer, source: input, description: "Advertiser raw bid per billable event", constraints: ">= 1" }
      - { name: bid_type, type: enum, source: input, description: "Billing unit for the bid", constraints: "CPC | CPM", default: CPC }
      - { name: flight_start_at, type: datetime, source: input, description: "Inclusive line item flight start; must lie within the campaign flight" }
      - { name: flight_end_at, type: datetime, source: input, description: "Exclusive line item flight end; must lie within the campaign flight" }
      - { name: daily_budget_cents, type: integer, source: input, description: "Per-day spend ceiling for this line item", constraints: ">= 100" }
      - { name: category_code, type: string, source: input, description: "Merchandising category this line item competes in; matched against PlacementSlot.exclusivity_category_code" }
      - { name: keyword_match_terms, type: array, source: input, description: "Lowercased match terms used for relevance scoring against the auction query" }
      - { name: reserved_cents, type: integer, source: computed, description: "daily_budget_cents multiplied by the number of whole days in the line item flight window" }
      - { name: spend_cents, type: integer, source: computed, description: "Sum of AuctionEvent.settled_spend_cents over SETTLED auctions this line item won" }
      - { name: eligible_product_count, type: integer, source: computed, description: "Count of ProductAssignment rows for this line item with assignment_status == ACTIVE whose CatalogProduct.eligibility_status == ELIGIBLE" }
      - { name: relevance_score, type: number, source: computed, description: "Per-auction relevance in [0.0, 1.0]; recomputed at ranking time and persisted as the latest ranked value" }
      - { name: quality_adjusted_score, type: number, source: computed, description: "Latest ranking score produced by the relevance_adjusted_bid_ranking calculation" }
      - { name: priority_tier, type: enum, source: computed, description: "Tie-break tier derived from the owning Advertiser.service_model and the campaign's remaining budget", constraints: "TIER_1 | TIER_2 | TIER_3" }
      - { name: pause_reason, type: enum, source: system, description: "Reason the line item is not serving", constraints: "NONE | OUT_OF_STOCK | MANUAL | BUDGET_EXHAUSTED | CATALOG_RESTRICTED", default: NONE }
      - { name: last_pause_at, type: datetime, source: system, description: "Timestamp of the most recent pause transition; nullable" }
      - { name: eligibility_decided_by_user_id, type: string, source: system, description: "Opaque CatalogOps id that approved or rejected serving eligibility; nullable" }

  - name: CatalogProduct
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Retailer stock keeping unit", constraints: "globally unique" }
      - { name: category_code, type: string, source: input, description: "Merchandising category code" }
      - { name: title, type: string, source: input, description: "Product title used for relevance term matching" }
      - { name: price_cents, type: integer, source: input, description: "Current retail price", constraints: ">= 1" }
      - { name: in_stock_units, type: integer, source: system, description: "Current sellable units; mutated only by stock adjustments", default: 0, constraints: ">= 0" }
      - { name: min_stock_units_for_serving, type: integer, source: input, description: "Serving threshold; the product is out of stock for advertising purposes when in_stock_units < this value", default: 3, constraints: ">= 0" }
      - { name: eligibility_status, type: enum, source: system, description: "Advertising eligibility state", constraints: "ELIGIBLE | OUT_OF_STOCK | RESTRICTED | DELISTED", default: ELIGIBLE }
      - { name: restricted_reason, type: enum, source: system, description: "Why the product is restricted from advertising", constraints: "NONE | AGE_RESTRICTED | REGULATORY | BRAND_SAFETY", default: NONE }
      - { name: margin_pct, type: number, source: input, description: "Gross margin fraction used by the relevance model", default: 0.2, constraints: "0.0 <= x <= 0.9" }
      - { name: last_stock_change_at, type: datetime, source: system, description: "Timestamp of the last stock adjustment; nullable" }

  - name: ProductAssignment
    parent: null
    common_fields: true
    fields:
      - { name: line_item_id, type: string, source: input, description: "FK -> LineItem.id; line item promoting the product" }
      - { name: catalog_product_id, type: string, source: input, description: "FK -> CatalogProduct.id; promoted product" }
      - { name: assignment_status, type: enum, source: system, description: "Whether this product currently contributes to serving", constraints: "ACTIVE | PAUSED_OOS | PAUSED_RESTRICTED | REMOVED", default: ACTIVE }
      - { name: is_hero, type: boolean, source: input, description: "Hero products receive a relevance boost and are required for a line item to be eligible", default: false }
      - { name: relevance_contribution, type: number, source: computed, description: "Per-product contribution to the owning line item's relevance_score" }
      - { name: removed_at, type: datetime, source: system, description: "Timestamp when the assignment was removed; nullable" }

  - name: AuctionEvent
    parent: null
    common_fields: true
    fields:
      - { name: placement_slot_id, type: string, source: input, description: "FK -> PlacementSlot.id; slot being auctioned" }
      - { name: winning_line_item_id, type: string, source: system, description: "FK -> LineItem.id; nullable until the auction is awarded" }
      - { name: status, type: enum, source: system, description: "Auction lifecycle state", constraints: "OPEN | RANKED | AWARDED | NO_FILL | SETTLED", default: OPEN }
      - { name: request_context_query, type: string, source: input, description: "Lowercased shopper query or browse context term used for relevance matching" }
      - { name: shopper_segment, type: enum, source: input, description: "Shopper cohort for the request", constraints: "NEW | RETURNING | LOYALTY" }
      - { name: requested_at, type: datetime, source: system, description: "Logical clock time at which the auction was opened" }
      - { name: candidate_count, type: integer, source: computed, description: "Number of AuctionBid rows created at ranking time, including filtered ones" }
      - { name: winner_score, type: number, source: computed, description: "quality_adjusted_score of the rank-1 unfiltered bid; nullable" }
      - { name: second_best_score, type: number, source: computed, description: "quality_adjusted_score of the rank-2 unfiltered bid; nullable when only one candidate survived filtering" }
      - { name: clearing_price_cents, type: integer, source: computed, description: "Second-price clearing amount charged to the winner; nullable until awarded" }
      - { name: settled_spend_cents, type: integer, source: computed, description: "Amount actually posted to ledgers at settlement; 0 for NO_FILL auctions" }
      - { name: no_fill_reason, type: enum, source: system, description: "Why no winner was selected", constraints: "NONE | NO_ELIGIBLE_CANDIDATES | ALL_BELOW_FLOOR | BUDGET_EXHAUSTED", default: NONE }

  - name: AuctionBid
    parent: null
    common_fields: false
    fields:
      - { name: auction_event_id, type: string, source: input, description: "FK -> AuctionEvent.id; auction this bid participated in" }
      - { name: line_item_id, type: string, source: input, description: "FK -> LineItem.id; bidding line item" }
      - { name: raw_bid_cents, type: integer, source: system, description: "LineItem.bid_cents snapshot at ranking time" }
      - { name: relevance_score, type: number, source: system, description: "Relevance in [0.0, 1.0] computed for this auction context" }
      - { name: quality_adjusted_score, type: number, source: computed, description: "Ranking score; see relevance_adjusted_bid_ranking" }
      - { name: rank, type: integer, source: computed, description: "1-based rank among unfiltered bids; null for filtered bids" }
      - { name: outcome, type: enum, source: computed, description: "Bid disposition", constraints: "WON | LOST | FILTERED_INELIGIBLE | FILTERED_BELOW_FLOOR" }
      - { name: filter_reason, type: enum, source: computed, description: "Why the bid was filtered before ranking", constraints: "NONE | NOT_SERVING | NO_ELIGIBLE_PRODUCTS | ZERO_TERM_OVERLAP | DAILY_BUDGET_EXHAUSTED | BELOW_FLOOR", default: NONE }

  - name: EngagementEvent
    parent: null
    common_fields: false
    fields:
      - { name: line_item_id, type: string, source: input, description: "FK -> LineItem.id; line item that was engaged with" }
      - { name: auction_event_id, type: string, source: input, description: "FK -> AuctionEvent.id; auction that produced the impression" }
      - { name: catalog_product_id, type: string, source: input, description: "FK -> CatalogProduct.id; product rendered in the creative" }
      - { name: event_type, type: enum, source: input, description: "Kind of engagement", constraints: "IMPRESSION | CLICK | OFFSITE_VIEW" }
      - { name: occurred_at, type: datetime, source: input, description: "When the engagement happened; must lie inside the winning line item flight window" }
      - { name: shopper_hash, type: string, source: input, description: "Pseudonymous shopper identifier used to join engagements to retail sales" }
      - { name: channel, type: enum, source: computed, description: "Copied from the auction slot channel", constraints: "ONSITE | OFFSITE" }
      - { name: billable_cents, type: integer, source: computed, description: "Amount this event contributes to the auction's settled spend; 0 for non-billable event types" }

  - name: AttributedSale
    parent: null
    common_fields: true
    fields:
      - { name: engagement_event_id, type: string, source: input, description: "FK -> EngagementEvent.id; engagement credited with the sale" }
      - { name: line_item_id, type: string, source: system, description: "FK -> LineItem.id; copied from the credited engagement" }
      - { name: catalog_product_id, type: string, source: input, description: "FK -> CatalogProduct.id; product actually purchased" }
      - { name: retail_order_ref, type: string, source: input, description: "Retailer order reference", constraints: "unique per (retail_order_ref, catalog_product_id, line_item_id)" }
      - { name: sale_cents, type: integer, source: input, description: "Gross retail sale amount for the purchased line", constraints: ">= 1" }
      - { name: units, type: integer, source: input, description: "Units purchased", constraints: ">= 1" }
      - { name: occurred_at, type: datetime, source: input, description: "Retail sale timestamp" }
      - { name: match_type, type: enum, source: computed, description: "Derived from the credited engagement event_type", constraints: "CLICK_THROUGH | VIEW_THROUGH" }
      - { name: attribution_model_applied, type: enum, source: system, description: "Campaign.attribution_model snapshot at ingestion time", constraints: "LAST_TOUCH | FRACTIONAL" }
      - { name: attribution_weight, type: number, source: computed, description: "Weight assigned to this engagement under the applied model" }
      - { name: attributed_credit_cents, type: integer, source: computed, description: "Revenue credited to the line item; see attributed_sales_credit" }
      - { name: within_window, type: boolean, source: computed, description: "True when occurred_at - engagement.occurred_at is within the campaign attribution window" }
      - { name: restated, type: boolean, source: system, description: "True when a published IncrementalityStudy invalidation forced a credit restatement", default: false }

  - name: IncrementalityStudy
    parent: null
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: input, description: "FK -> Campaign.id; campaign under measurement" }
      - { name: supersedes_study_id, type: string, source: input, description: "FK -> IncrementalityStudy.id; nullable; prior study this restatement replaces" }
      - { name: study_status, type: enum, source: system, description: "Measurement lifecycle state", constraints: "DESIGNED | RUNNING | MEASURING | PUBLISHED | INVALIDATED", default: DESIGNED }
      - { name: design_method, type: enum, source: input, description: "Holdout construction method; drives the incremental_sales_lift variant", constraints: "GEO_HOLDOUT | USER_HOLDOUT" }
      - { name: holdout_pct, type: number, source: input, description: "Fraction of the audience withheld from exposure", constraints: "0.05 <= x <= 0.50" }
      - { name: exposed_group_size, type: integer, source: input, description: "Exposed cohort size", constraints: ">= 1" }
      - { name: control_group_size, type: integer, source: input, description: "Control cohort size", constraints: ">= 1" }
      - { name: exposed_conversions, type: integer, source: input, description: "Converting shoppers in the exposed cohort", default: 0 }
      - { name: control_conversions, type: integer, source: input, description: "Converting shoppers in the control cohort", default: 0 }
      - { name: exposed_sales_cents, type: integer, source: input, description: "Gross sales observed in the exposed cohort", default: 0 }
      - { name: control_sales_cents, type: integer, source: input, description: "Gross sales observed in the control cohort", default: 0 }
      - { name: lift_pct, type: number, source: computed, description: "Relative lift produced by the incremental_sales_lift calculation" }
      - { name: incremental_sales_cents, type: integer, source: computed, description: "Incremental sales attributable to the campaign under the selected design_method variant" }
      - { name: significance_score, type: number, source: computed, description: "Normalized effect-size score used for the significance gate" }
      - { name: significance_flag, type: boolean, source: computed, description: "True when significance_score >= SIGNIFICANCE_MIN" }
      - { name: window_start_at, type: datetime, source: input, description: "Inclusive measurement window start" }
      - { name: window_end_at, type: datetime, source: input, description: "Exclusive measurement window end" }
      - { name: published_by_user_id, type: string, source: system, description: "Opaque MeasurementAnalyst id that published the study; nullable" }
      - { name: invalidated_reason, type: enum, source: system, description: "Why a published study was invalidated", constraints: "NONE | DATA_DEFECT | HOLDOUT_CONTAMINATION | SUPERSEDED", default: NONE }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: advertiser_id, type: string, source: input, description: "FK -> Advertiser.id; billed party" }
      - { name: budget_plan_id, type: string, source: input, description: "FK -> BudgetPlan.id; plan whose consumption is billed" }
      - { name: trade_fund_account_id, type: string, source: input, description: "FK -> TradeFundAccount.id; pool the deduction is drawn from; nullable when the plan has no trade fund share" }
      - { name: invoice_status, type: enum, source: system, description: "Invoice lifecycle state", constraints: "DRAFT | ISSUED | DISPUTED | ADJUSTED | SETTLED | WRITTEN_OFF", default: DRAFT }
      - { name: billing_period_code, type: string, source: input, description: "Billing period label", constraints: "^\\d{4}-(0[1-9]|1[0-2])$; unique per (advertiser_id, billing_period_code)" }
      - { name: onsite_spend_cents, type: integer, source: computed, description: "Sum of AuctionEvent.settled_spend_cents for SETTLED auctions on ONSITE slots won by the plan's campaigns within the billing period" }
      - { name: offsite_spend_cents, type: integer, source: computed, description: "Sum of Campaign.offsite_reported_spend_cents over the plan's campaigns, capped by the off-site variance rule" }
      - { name: gross_spend_cents, type: integer, source: computed, description: "onsite_spend_cents + offsite_spend_cents" }
      - { name: managed_service_fee_cents, type: integer, source: computed, description: "Managed-service fee charged on gross spend; 0 for SELF_SERVE advertisers" }
      - { name: trade_fund_deduction_cents, type: integer, source: computed, description: "Amount deducted from the trade fund pool; see invoice_settlement_waterfall" }
      - { name: dispute_credit_cents, type: integer, source: computed, description: "Sum of approved_credit_cents over UPHELD MeasurementDispute rows on this invoice" }
      - { name: net_cash_due_cents, type: integer, source: computed, description: "Cash payable after fee, deduction and dispute credit; floored at 0" }
      - { name: variance_pct, type: number, source: computed, description: "Off-site reported versus logged variance for the billing period" }
      - { name: adjustment_round, type: integer, source: system, description: "Number of adjustments applied after issuance", default: 0 }
      - { name: issued_at, type: datetime, source: system, description: "Issuance timestamp; nullable while DRAFT" }
      - { name: due_at, type: datetime, source: computed, description: "issued_at plus NET_TERMS_DAYS; nullable while DRAFT" }
      - { name: settled_at, type: datetime, source: system, description: "Settlement timestamp; nullable" }
      - { name: issued_by_user_id, type: string, source: system, description: "Opaque BillingOps id that issued the invoice; nullable" }

  - name: MeasurementDispute
    parent: null
    common_fields: true
    fields:
      - { name: invoice_id, type: string, source: input, description: "FK -> Invoice.id; disputed invoice" }
      - { name: line_item_id, type: string, source: input, description: "FK -> LineItem.id; nullable; line item the dispute narrows to" }
      - { name: dispute_status, type: enum, source: system, description: "Dispute lifecycle state", constraints: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | UPHELD | REJECTED | ESCALATED | WITHDRAWN", default: SUBMITTED }
      - { name: dispute_category, type: enum, source: input, description: "Measurement claim category; drives the SLA clock", constraints: "IMPRESSION_DISCREPANCY | ATTRIBUTION_WINDOW | OFFSITE_SPEND_VARIANCE | INCREMENTALITY_RESTATEMENT" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Credit amount the advertiser claims", constraints: ">= 1" }
      - { name: approved_credit_cents, type: integer, source: computed, description: "Credit actually granted at resolution; 0 unless dispute_status == UPHELD" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock time at filing" }
      - { name: sla_response_hours, type: integer, source: computed, description: "Response SLA in hours derived from dispute_category and Advertiser.service_model" }
      - { name: sla_due_at, type: datetime, source: computed, description: "filed_at plus sla_response_hours" }
      - { name: first_response_at, type: datetime, source: system, description: "Timestamp of the first review action; nullable" }
      - { name: info_request_count, type: integer, source: system, description: "Number of times additional information was requested", default: 0 }
      - { name: review_rounds, type: integer, source: system, description: "Number of times the dispute entered UNDER_REVIEW", default: 0 }
      - { name: sla_breached, type: boolean, source: computed, description: "True when the first response landed after sla_due_at or no response exists and the clock is past sla_due_at", default: false }
      - { name: escalation_level, type: integer, source: system, description: "0 = none, 1 = escalated by SLA breach, 2 = escalated by round exhaustion", default: 0 }
      - { name: assigned_analyst_user_id, type: string, source: system, description: "Opaque MeasurementAnalyst id owning the review; nullable" }
      - { name: resolved_by_user_id, type: string, source: system, description: "Opaque operator id that resolved the dispute; nullable" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Advertiser
    state_field: onboarding_status
    initial_state: DRAFT
    terminal_states: [REJECTED, TERMINATED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rmn/advertisers/{id}/submit-onboarding"
        actor: AccountManager | AdvertiserUser | NetworkAdmin
        preconditions:
          - "advertiser.kyc_document_count >= 2"
          - "advertiser.service_model == MANAGED implies advertiser.account_manager_user_id is not null"
          - "advertiser.parent_advertiser_id is null OR the parent Advertiser has onboarding_status == ACTIVE"
        side_effects:
          - "sets advertiser.onboarding_submitted_by_user_id = X-User-ID"
          - "increments Advertiser.version by 1"
      - from: SUBMITTED
        to: KYC_REVIEW
        trigger: "POST /rmn/advertisers/{id}/kyc-decision with decision=START_REVIEW"
        actor: CreditAnalyst
        preconditions: ["X-User-ID != advertiser.onboarding_submitted_by_user_id (segregation of duties)"]
        side_effects: ["sets advertiser.kyc_decided_by_user_id = X-User-ID", "increments Advertiser.version by 1"]
      - from: KYC_REVIEW
        to: ACTIVE
        trigger: "POST /rmn/advertisers/{id}/kyc-decision with decision=APPROVE"
        actor: CreditAnalyst
        preconditions:
          - "X-User-ID != advertiser.onboarding_submitted_by_user_id (segregation of duties)"
          - "advertiser.credit_limit_cents >= 100000 OR advertiser.parent_advertiser_id is not null"
        side_effects:
          - "sets advertiser.suspension_reason = NONE"
          - "recomputes advertiser.credit_exposure_cents via advertiser_credit_exposure"
          - "increments Advertiser.version by 1"
      - from: KYC_REVIEW
        to: CREDIT_HOLD
        trigger: "POST /rmn/advertisers/{id}/kyc-decision with decision=HOLD"
        actor: CreditAnalyst
        preconditions: ["X-User-ID != advertiser.onboarding_submitted_by_user_id"]
        side_effects: ["increments Advertiser.version by 1"]
        note: "Divergent branch of the KYC fork; unlike APPROVE it does not clear suspension_reason and does not enable budget-plan approval."
      - from: CREDIT_HOLD
        to: KYC_REVIEW
        trigger: "POST /rmn/advertisers/{id}/submit-onboarding (re-submission after remediation)"
        actor: AccountManager | AdvertiserUser
        preconditions: ["advertiser.kyc_document_count >= 3 (remediation requires one extra document)"]
        side_effects:
          - "sets advertiser.onboarding_submitted_by_user_id = X-User-ID"
          - "increments Advertiser.version by 1"
        note: "Cycle: CREDIT_HOLD -> KYC_REVIEW -> CREDIT_HOLD may repeat."
      - from: KYC_REVIEW
        to: REJECTED
        trigger: "POST /rmn/advertisers/{id}/kyc-decision with decision=REJECT"
        actor: CreditAnalyst
        preconditions: ["X-User-ID != advertiser.onboarding_submitted_by_user_id"]
        side_effects: ["increments Advertiser.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rmn/advertisers/{id}/suspend, or system on credit-exposure breach during invoice issuance"
        actor: CreditAnalyst | NetworkAdmin | system
        preconditions: ["advertiser.onboarding_status == ACTIVE"]
        side_effects:
          - "sets advertiser.suspension_reason to the supplied reason (CREDIT_BREACH when system-triggered)"
          - "CASCADE L1: every Campaign of this advertiser with delivery_status IN {SCHEDULED, DELIVERING} transitions to PAUSED"
          - "CASCADE L2: each Campaign entering PAUSED by L1 transitions every own LineItem with line_item_status IN {ELIGIBLE, SERVING} to MANUAL_PAUSED with pause_reason = MANUAL"
          - "CASCADE L3: each LineItem entering MANUAL_PAUSED by L2 recomputes PlacementSlot.occupancy_count on its slot (value unchanged; MANUAL_PAUSED remains an occupying status)"
          - "increments Advertiser.version by 1, and Campaign.version / LineItem.version by 1 for every row mutated by L1 and L2"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rmn/advertisers/{id}/reinstate"
        actor: CreditAnalyst | NetworkAdmin
        preconditions:
          - "advertiser.credit_exposure_cents <= advertiser.credit_limit_cents"
          - "no Invoice of this advertiser has invoice_status == ISSUED with due_at < clock_now"
        side_effects:
          - "sets advertiser.suspension_reason = NONE"
          - "does NOT auto-resume campaigns; each Campaign must be resumed explicitly"
          - "increments Advertiser.version by 1"
        note: "Cycle: ACTIVE -> SUSPENDED -> ACTIVE may repeat any number of times."
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /rmn/advertisers/{id}/terminate"
        actor: NetworkAdmin
        preconditions:
          - "every Invoice of this advertiser has invoice_status IN {SETTLED, WRITTEN_OFF}"
          - "no BudgetPlan of this advertiser has plan_status IN {PENDING_APPROVAL, APPROVED, ACTIVE}"
        side_effects:
          - "every Campaign of this advertiser with delivery_status != ARCHIVED transitions to ARCHIVED, releasing BudgetPlan.reserved_cents"
          - "every TradeFundAccount of this advertiser with account_status IN {OPEN, FROZEN} transitions to CLOSED"
          - "increments Advertiser.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /rmn/advertisers/{id}/terminate"
        actor: NetworkAdmin
        preconditions: ["same as ACTIVE -> TERMINATED"]
        side_effects: ["same as ACTIVE -> TERMINATED"]

  - entity: BudgetPlan
    state_field: plan_status
    initial_state: DRAFT
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: DRAFT
        to: PENDING_APPROVAL
        trigger: "POST /rmn/budget-plans/{id}/submit"
        actor: AccountManager | AdvertiserUser
        preconditions:
          - "plan.committed_total_cents >= 100000"
          - "plan.trade_fund_share_cents == 0 OR a TradeFundAccount exists for (plan.advertiser_id, plan.fiscal_period_code) with account_status == OPEN"
          - "plan.trade_fund_share_cents <= that TradeFundAccount.available_cents"
        side_effects:
          - "sets plan.submitted_by_user_id = X-User-ID"
          - "recomputes plan.cash_share_cents = committed_total_cents - trade_fund_share_cents"
          - "increments BudgetPlan.version by 1"
      - from: PENDING_APPROVAL
        to: DRAFT
        trigger: "POST /rmn/budget-plans/{id}/return-for-revision"
        actor: CreditAnalyst
        preconditions: ["plan.revision_round < MAX_REVISION_ROUNDS (3)"]
        side_effects:
          - "increments plan.revision_round by 1"
          - "clears plan.submitted_by_user_id"
          - "increments BudgetPlan.version by 1"
        note: "Cycle: DRAFT -> PENDING_APPROVAL -> DRAFT, bounded at 3 rounds."
      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /rmn/budget-plans/{id}/return-for-revision when plan.revision_round == MAX_REVISION_ROUNDS"
        actor: CreditAnalyst
        preconditions: ["plan.revision_round == 3"]
        side_effects:
          - "releases the trade fund reservation: TradeFundAccount.reserved_cents recomputed downward and available_cents recomputed upward"
          - "increments BudgetPlan.version by 1"
      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /rmn/budget-plans/{id}/approve"
        actor: CreditAnalyst
        preconditions:
          - "X-User-ID != plan.submitted_by_user_id (segregation of duties)"
          - "Advertiser(plan.advertiser_id).onboarding_status == ACTIVE"
          - "advertiser.credit_exposure_cents + plan.cash_share_cents <= advertiser.credit_limit_cents, where an advertiser with a non-null parent_advertiser_id uses the parent's credit_limit_cents"
          - "no other BudgetPlan of the same advertiser with plan_status IN {APPROVED, ACTIVE} has a window overlapping [plan.window_start_at, plan.window_end_at)"
        side_effects:
          - "sets plan.approved_by_user_id = X-User-ID"
          - "recomputes TradeFundAccount.reserved_cents and available_cents for the matching pool"
          - "recomputes Advertiser.credit_exposure_cents"
          - "increments BudgetPlan.version by 1"
      - from: APPROVED
        to: ACTIVE
        trigger: "System on the first Campaign of this plan reaching delivery_status == DELIVERING, or POST /_ops/run-daily-checkpoint when clock_now >= plan.window_start_at"
        actor: system
        preconditions: ["clock_now >= plan.window_start_at", "Advertiser.onboarding_status == ACTIVE"]
        side_effects: ["increments BudgetPlan.version by 1"]
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "System when budget_plan_available recomputation yields available_cents <= 0 after an auction settlement or an off-site spend posting"
        actor: system
        preconditions: ["plan.available_cents <= 0"]
        side_effects:
          - "sets plan.exhausted_at = clock_now"
          - "CASCADE L1: every Campaign on this plan with delivery_status == DELIVERING transitions to PAUSED"
          - "CASCADE L2: each Campaign entering PAUSED by L1 transitions every own LineItem with line_item_status == SERVING to MANUAL_PAUSED with pause_reason = BUDGET_EXHAUSTED"
          - "increments BudgetPlan.version by 1 plus Campaign.version / LineItem.version for every mutated row"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "POST /rmn/budget-plans/{id}/top-up"
        actor: CreditAnalyst | AccountManager
        preconditions:
          - "top_up_amount_cents >= 50000"
          - "Advertiser.onboarding_status == ACTIVE"
          - "clock_now < plan.window_end_at"
        side_effects:
          - "increases plan.top_up_total_cents by top_up_amount_cents and recomputes plan.available_cents"
          - "clears plan.exhausted_at"
          - "recomputes Advertiser.credit_exposure_cents"
          - "increments BudgetPlan.version by 1"
        note: "Cycle: ACTIVE -> EXHAUSTED -> ACTIVE. Campaigns paused by the EXHAUSTED cascade are NOT auto-resumed."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /rmn/budget-plans/{id}/close"
        actor: BillingOps
        preconditions:
          - "clock_now >= plan.window_end_at"
          - "no Campaign on this plan has delivery_status IN {SCHEDULED, DELIVERING, PAUSED}"
          - "every Invoice referencing this plan has invoice_status IN {SETTLED, WRITTEN_OFF}"
        side_effects:
          - "releases residual trade fund reservation: TradeFundAccount.reserved_cents recomputed downward, available_cents upward"
          - "recomputes Advertiser.credit_exposure_cents"
          - "increments BudgetPlan.version by 1"
      - from: EXHAUSTED
        to: CLOSED
        trigger: "POST /rmn/budget-plans/{id}/close"
        actor: BillingOps
        preconditions: ["same as ACTIVE -> CLOSED"]
        side_effects: ["same as ACTIVE -> CLOSED"]

  - entity: TradeFundAccount
    state_field: account_status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: FROZEN
        trigger: "POST /rmn/trade-fund-accounts/{id}/freeze, or system when a deduction posting would drive available_cents below 0"
        actor: BillingOps | NetworkAdmin | system
        preconditions: ["account.account_status == OPEN"]
        side_effects:
          - "sets account.frozen_reason (OVERDRAWN when system-triggered, otherwise the supplied reason)"
          - "increments TradeFundAccount.version by 1"
      - from: FROZEN
        to: OPEN
        trigger: "POST /rmn/trade-fund-accounts/{id}/unfreeze, or system when a dispute credit restores available_cents to >= 0 while frozen_reason == OVERDRAWN"
        actor: BillingOps | NetworkAdmin | system
        preconditions: ["account.available_cents >= 0"]
        side_effects:
          - "sets account.frozen_reason = NONE"
          - "CASCADE: any BudgetPlan of the same (advertiser_id, fiscal_period_code) with plan_status == EXHAUSTED and available_cents > 0 transitions to ACTIVE"
          - "increments TradeFundAccount.version by 1"
        note: "Cycle: OPEN -> FROZEN -> OPEN."
      - from: OPEN
        to: RECONCILING
        trigger: "POST /_ops/run-daily-checkpoint when clock_now >= end of the account fiscal period"
        actor: system
        preconditions: ["every Invoice referencing this account has invoice_status IN {SETTLED, WRITTEN_OFF, ADJUSTED}"]
        side_effects:
          - "sets account.last_reconciled_at = clock_now"
          - "recomputes account.available_cents"
          - "increments TradeFundAccount.version by 1"
      - from: RECONCILING
        to: CLOSED
        trigger: "POST /rmn/trade-fund-accounts/{id}/freeze is rejected in this state; closure occurs via POST /_ops/run-daily-checkpoint one day after last_reconciled_at"
        actor: system
        preconditions: ["account.reserved_cents == 0", "clock_now >= account.last_reconciled_at + 24h"]
        side_effects: ["increments TradeFundAccount.version by 1"]
      - from: OPEN
        to: CLOSED
        trigger: "System cascade from Advertiser ACTIVE|SUSPENDED -> TERMINATED"
        actor: system
        preconditions: ["Advertiser.onboarding_status transitioning to TERMINATED"]
        side_effects: ["sets account.frozen_reason = NONE", "increments TradeFundAccount.version by 1"]
      - from: FROZEN
        to: CLOSED
        trigger: "System cascade from Advertiser ACTIVE|SUSPENDED -> TERMINATED"
        actor: system
        preconditions: ["Advertiser.onboarding_status transitioning to TERMINATED"]
        side_effects: ["increments TradeFundAccount.version by 1"]

  - entity: Campaign
    state_field: delivery_status
    initial_state: DRAFT
    terminal_states: [REJECTED, ARCHIVED]
    note: "Parallel dimension 1 of 2 on Campaign. delivery_status and billing_status advance independently; no transition on one dimension is allowed to write the other dimension's field."
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /rmn/campaigns/{id}/submit-for-review"
        actor: AdvertiserUser | AccountManager
        preconditions:
          - "BudgetPlan(campaign.budget_plan_id).plan_status IN {APPROVED, ACTIVE}"
          - "campaign has at least one LineItem with line_item_status IN {PENDING_ELIGIBILITY, ELIGIBLE}"
          - "campaign.allocated_budget_cents <= BudgetPlan.available_cents"
          - "campaign.channel_mix != ONSITE_ONLY implies at least one own LineItem sits on a PlacementSlot with channel == OFFSITE"
        side_effects:
          - "sets campaign.submitted_for_review_by_user_id = X-User-ID"
          - "increments Campaign.version by 1"
      - from: PENDING_REVIEW
        to: SCHEDULED
        trigger: "POST /rmn/campaigns/{id}/review-decision with decision=APPROVE"
        actor: NetworkAdmin | AccountManager
        preconditions:
          - "X-User-ID != campaign.submitted_for_review_by_user_id (segregation of duties)"
          - "Advertiser(campaign.advertiser_id).onboarding_status == ACTIVE"
          - "clock_now < campaign.flight_end_at"
        side_effects:
          - "sets campaign.review_decided_by_user_id = X-User-ID"
          - "recomputes BudgetPlan.reserved_cents and BudgetPlan.available_cents (campaign.allocated_budget_cents now reserved)"
          - "recomputes Advertiser.credit_exposure_cents"
          - "increments Campaign.version and BudgetPlan.version by 1"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /rmn/campaigns/{id}/review-decision with decision=REJECT"
        actor: NetworkAdmin | AccountManager
        preconditions: ["X-User-ID != campaign.submitted_for_review_by_user_id"]
        side_effects:
          - "sets campaign.review_decided_by_user_id = X-User-ID"
          - "every own LineItem with line_item_status IN {DRAFT, PENDING_ELIGIBILITY, ELIGIBLE} transitions to REJECTED"
          - "BudgetPlan.reserved_cents is NOT changed (nothing was reserved in PENDING_REVIEW)"
          - "increments Campaign.version by 1"
        note: "Divergent branch of the review fork: unlike APPROVE it reserves nothing and terminates all child line items."
      - from: SCHEDULED
        to: DELIVERING
        trigger: "POST /rmn/campaigns/{id}/activate, or POST /_ops/run-daily-checkpoint when clock_now >= campaign.flight_start_at"
        actor: AdvertiserUser | AccountManager | NetworkAdmin | system
        preconditions:
          - "clock_now >= campaign.flight_start_at AND clock_now < campaign.flight_end_at"
          - "Advertiser.onboarding_status == ACTIVE"
          - "BudgetPlan.plan_status IN {APPROVED, ACTIVE}"
        side_effects:
          - "if BudgetPlan.plan_status == APPROVED it transitions to ACTIVE"
          - "recomputes campaign.pacing_index via campaign_pacing_allowance"
          - "sets campaign.billing_status from UNBILLED to ACCRUING on the billing dimension"
          - "increments Campaign.version by 1"
      - from: DELIVERING
        to: PAUSED
        trigger: "POST /rmn/campaigns/{id}/pause, or system cascade from Advertiser suspension, BudgetPlan exhaustion, or all-line-items-paused roll-up"
        actor: AdvertiserUser | AccountManager | NetworkAdmin | system
        preconditions: ["campaign.delivery_status == DELIVERING"]
        side_effects:
          - "when actor is not system: every own LineItem with line_item_status == SERVING transitions to MANUAL_PAUSED with pause_reason = MANUAL"
          - "BudgetPlan.reserved_cents unchanged (PAUSED remains a reserving status)"
          - "increments Campaign.version by 1 and LineItem.version by 1 for each mutated line item"
      - from: PAUSED
        to: DELIVERING
        trigger: "POST /rmn/campaigns/{id}/resume"
        actor: AdvertiserUser | AccountManager | NetworkAdmin
        preconditions:
          - "Advertiser.onboarding_status == ACTIVE"
          - "BudgetPlan.plan_status == ACTIVE AND BudgetPlan.available_cents > 0"
          - "clock_now < campaign.flight_end_at"
          - "campaign has at least one own LineItem with line_item_status IN {ELIGIBLE, MANUAL_PAUSED}"
        side_effects:
          - "every own LineItem with line_item_status == MANUAL_PAUSED and pause_reason IN {MANUAL, BUDGET_EXHAUSTED} transitions to SERVING with pause_reason = NONE"
          - "LineItem rows with line_item_status == OOS_PAUSED are NOT resumed"
          - "recomputes campaign.pacing_index"
          - "increments Campaign.version by 1 and LineItem.version by 1 for each resumed line item"
        note: "Cycle: DELIVERING -> PAUSED -> DELIVERING may repeat."
      - from: DELIVERING
        to: COMPLETED
        trigger: "POST /rmn/campaigns/{id}/complete, or POST /_ops/run-daily-checkpoint when clock_now >= campaign.flight_end_at"
        actor: AccountManager | NetworkAdmin | system
        preconditions: ["clock_now >= campaign.flight_end_at OR actor is not system"]
        side_effects:
          - "every own LineItem with line_item_status IN {ELIGIBLE, SERVING, OOS_PAUSED, MANUAL_PAUSED} transitions to ENDED"
          - "each LineItem entering ENDED decrements PlacementSlot.occupancy_count on its slot"
          - "recomputes BudgetPlan.reserved_cents downward (COMPLETED is not a reserving status) and BudgetPlan.available_cents upward"
          - "sets campaign.billing_status from ACCRUING to PENDING_INVOICE on the billing dimension"
          - "increments Campaign.version, BudgetPlan.version, and each mutated LineItem.version / PlacementSlot.version by 1"
      - from: PAUSED
        to: COMPLETED
        trigger: "POST /_ops/run-daily-checkpoint when clock_now >= campaign.flight_end_at"
        actor: system
        preconditions: ["clock_now >= campaign.flight_end_at"]
        side_effects: ["same as DELIVERING -> COMPLETED"]
      - from: COMPLETED
        to: ARCHIVED
        trigger: "POST /rmn/campaigns/{id}/archive"
        actor: NetworkAdmin | BillingOps
        preconditions:
          - "campaign.billing_status IN {RECONCILED, UNBILLED}"
          - "no MeasurementDispute references a LineItem of this campaign with dispute_status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, ESCALATED}"
        side_effects:
          - "recomputes BudgetPlan.reserved_cents and available_cents"
          - "increments Campaign.version and BudgetPlan.version by 1"
      - from: SCHEDULED
        to: ARCHIVED
        trigger: "POST /rmn/campaigns/{id}/archive"
        actor: NetworkAdmin | AccountManager
        preconditions: ["campaign.delivered_spend_cents == 0"]
        side_effects:
          - "every own LineItem with line_item_status IN {ELIGIBLE, PENDING_ELIGIBILITY, DRAFT} transitions to ENDED, each decrementing PlacementSlot.occupancy_count"
          - "releases the reservation: BudgetPlan.reserved_cents decreases by campaign.allocated_budget_cents and BudgetPlan.available_cents increases by the same amount"
          - "recomputes Advertiser.credit_exposure_cents"
          - "increments Campaign.version, BudgetPlan.version, Advertiser.version by 1"
        note: "Compensating action for SCHEDULED reservation; conserves BudgetPlan budget identity."

  - entity: Campaign
    state_field: billing_status
    initial_state: UNBILLED
    terminal_states: [RECONCILED]
    note: "Parallel dimension 2 of 2 on Campaign. Advances on billing events only; a campaign may be DELIVERING while INVOICED, or COMPLETED while still ACCRUING."
    transitions:
      - from: UNBILLED
        to: ACCRUING
        trigger: "System when campaign.delivery_status becomes DELIVERING, or on the first AuctionEvent settlement won by one of its line items"
        actor: system
        preconditions: ["campaign.delivery_status IN {DELIVERING, PAUSED}"]
        side_effects: ["recomputes campaign.delivered_spend_cents", "increments Campaign.version by 1"]
      - from: ACCRUING
        to: PENDING_INVOICE
        trigger: "System when campaign.delivery_status becomes COMPLETED, or POST /rmn/campaigns/{id}/offsite-reconciliation is posted after flight_end_at"
        actor: system
        preconditions: ["clock_now >= campaign.flight_end_at OR campaign.delivery_status == COMPLETED"]
        side_effects:
          - "recomputes campaign.offsite_variance_pct via offsite_spend_reconciliation"
          - "increments Campaign.version by 1"
      - from: PENDING_INVOICE
        to: INVOICED
        trigger: "POST /rmn/invoices/{id}/issue covering this campaign"
        actor: BillingOps
        preconditions: ["an Invoice on the campaign's budget_plan_id transitions DRAFT -> ISSUED"]
        side_effects: ["increments Campaign.version by 1"]
      - from: INVOICED
        to: DISPUTED
        trigger: "POST /rmn/measurement-disputes referencing a LineItem of this campaign"
        actor: AdvertiserUser | AccountManager
        preconditions: ["dispute.line_item_id belongs to this campaign"]
        side_effects: ["increments Campaign.version by 1"]
      - from: DISPUTED
        to: INVOICED
        trigger: "System when every MeasurementDispute on this campaign's line items reaches a terminal status other than UPHELD"
        actor: system
        preconditions: ["no MeasurementDispute on this campaign has dispute_status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, ESCALATED}", "no such dispute has dispute_status == UPHELD"]
        side_effects: ["increments Campaign.version by 1"]
        note: "Cycle: INVOICED -> DISPUTED -> INVOICED may repeat while the invoice stays unsettled."
      - from: DISPUTED
        to: RECONCILED
        trigger: "System when the covering Invoice reaches invoice_status IN {SETTLED, WRITTEN_OFF} after adjustment"
        actor: system
        preconditions: ["Invoice.invoice_status IN {SETTLED, WRITTEN_OFF}"]
        side_effects: ["recomputes campaign.roas and campaign.iroas", "increments Campaign.version by 1"]
      - from: INVOICED
        to: RECONCILED
        trigger: "System when the covering Invoice reaches invoice_status IN {SETTLED, WRITTEN_OFF}"
        actor: system
        preconditions: ["Invoice.invoice_status IN {SETTLED, WRITTEN_OFF}"]
        side_effects: ["recomputes campaign.roas and campaign.iroas", "increments Campaign.version by 1"]

  - entity: PlacementSlot
    state_field: slot_status
    initial_state: OPEN
    terminal_states: [RETIRED]
    transitions:
      - from: OPEN
        to: MAINTENANCE
        trigger: "PATCH /rmn/placement-slots/{id} with slot_status=MAINTENANCE"
        actor: NetworkAdmin
        preconditions: ["slot.slot_status == OPEN"]
        side_effects:
          - "every LineItem on this slot with line_item_status == SERVING transitions to MANUAL_PAUSED with pause_reason = MANUAL"
          - "future POST /rmn/auction-events on this slot are rejected"
          - "increments PlacementSlot.version by 1 and LineItem.version by 1 per mutated row"
      - from: MAINTENANCE
        to: OPEN
        trigger: "PATCH /rmn/placement-slots/{id} with slot_status=OPEN"
        actor: NetworkAdmin
        preconditions: ["slot.slot_status == MAINTENANCE"]
        side_effects: ["increments PlacementSlot.version by 1"]
        note: "Cycle: OPEN -> MAINTENANCE -> OPEN."
      - from: MAINTENANCE
        to: RETIRED
        trigger: "PATCH /rmn/placement-slots/{id} with slot_status=RETIRED"
        actor: NetworkAdmin
        preconditions: ["slot.occupancy_count == 0"]
        side_effects: ["increments PlacementSlot.version by 1"]

  - entity: CatalogProduct
    state_field: eligibility_status
    initial_state: ELIGIBLE
    terminal_states: [DELISTED]
    transitions:
      - from: ELIGIBLE
        to: OUT_OF_STOCK
        trigger: "POST /rmn/catalog-products/{id}/stock-adjustments driving in_stock_units < min_stock_units_for_serving"
        actor: CatalogOps | system
        preconditions: ["resulting in_stock_units < product.min_stock_units_for_serving", "product.eligibility_status == ELIGIBLE"]
        side_effects:
          - "sets product.last_stock_change_at = clock_now"
          - "CASCADE L1: every ProductAssignment referencing this product with assignment_status == ACTIVE transitions to PAUSED_OOS"
          - "CASCADE L2: each ProductAssignment entering PAUSED_OOS recomputes LineItem.eligible_product_count on its line item; a LineItem whose recomputed eligible_product_count reaches 0 and whose line_item_status == SERVING transitions to OOS_PAUSED with pause_reason = OUT_OF_STOCK"
          - "CASCADE L3: each LineItem entering OOS_PAUSED increments Campaign.oos_paused_line_item_count on its campaign; a Campaign whose every non-ENDED LineItem is now in {OOS_PAUSED, MANUAL_PAUSED} and whose delivery_status == DELIVERING transitions to PAUSED"
          - "increments CatalogProduct.version by 1 plus the version of every ProductAssignment, LineItem and Campaign mutated by L1-L3"
      - from: OUT_OF_STOCK
        to: ELIGIBLE
        trigger: "POST /rmn/catalog-products/{id}/stock-adjustments restoring in_stock_units >= min_stock_units_for_serving"
        actor: CatalogOps | system
        preconditions: ["resulting in_stock_units >= product.min_stock_units_for_serving"]
        side_effects:
          - "every ProductAssignment referencing this product with assignment_status == PAUSED_OOS transitions to ACTIVE"
          - "each such ProductAssignment recomputes LineItem.eligible_product_count; a LineItem with line_item_status == OOS_PAUSED whose recomputed eligible_product_count >= 1 transitions to SERVING with pause_reason = NONE only when its Campaign.delivery_status == DELIVERING, otherwise it transitions to ELIGIBLE"
          - "recomputes Campaign.oos_paused_line_item_count"
          - "increments CatalogProduct.version by 1 plus every mutated row's version"
        note: "Cycle: ELIGIBLE -> OUT_OF_STOCK -> ELIGIBLE. Compensating action that conserves the slot occupancy identity."
      - from: ELIGIBLE
        to: RESTRICTED
        trigger: "POST /rmn/catalog-products/{id}/restrict"
        actor: CatalogOps | NetworkAdmin
        preconditions: ["restricted_reason != NONE"]
        side_effects:
          - "every ProductAssignment referencing this product with assignment_status IN {ACTIVE, PAUSED_OOS} transitions to PAUSED_RESTRICTED"
          - "each affected LineItem recomputes eligible_product_count; a LineItem with line_item_status IN {SERVING, ELIGIBLE} whose recomputed eligible_product_count reaches 0 transitions to OOS_PAUSED with pause_reason = CATALOG_RESTRICTED"
          - "increments CatalogProduct.version by 1 plus every mutated row's version"
      - from: RESTRICTED
        to: ELIGIBLE
        trigger: "POST /rmn/catalog-products/{id}/reinstate"
        actor: NetworkAdmin
        preconditions: ["product.in_stock_units >= product.min_stock_units_for_serving"]
        side_effects:
          - "sets product.restricted_reason = NONE"
          - "every ProductAssignment referencing this product with assignment_status == PAUSED_RESTRICTED transitions to ACTIVE"
          - "affected LineItem rows with pause_reason == CATALOG_RESTRICTED and line_item_status == OOS_PAUSED transition to ELIGIBLE"
          - "increments CatalogProduct.version by 1 plus every mutated row's version"
        note: "Cycle: ELIGIBLE -> RESTRICTED -> ELIGIBLE."
      - from: RESTRICTED
        to: DELISTED
        trigger: "POST /rmn/catalog-products/{id}/delist"
        actor: NetworkAdmin
        preconditions: ["product.eligibility_status == RESTRICTED"]
        side_effects:
          - "every ProductAssignment referencing this product transitions to REMOVED with removed_at = clock_now"
          - "each affected LineItem recomputes eligible_product_count; one reaching 0 while line_item_status IN {SERVING, ELIGIBLE, OOS_PAUSED} transitions to ENDED"
          - "increments CatalogProduct.version by 1 plus every mutated row's version"
      - from: OUT_OF_STOCK
        to: DELISTED
        trigger: "POST /rmn/catalog-products/{id}/delist"
        actor: NetworkAdmin
        preconditions: ["product.in_stock_units == 0"]
        side_effects: ["same as RESTRICTED -> DELISTED"]

  - entity: ProductAssignment
    state_field: assignment_status
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: PAUSED_OOS
        trigger: "System cascade from CatalogProduct ELIGIBLE -> OUT_OF_STOCK"
        actor: system
        preconditions: ["CatalogProduct.eligibility_status becoming OUT_OF_STOCK"]
        side_effects: ["sets relevance_contribution to 0.0", "recomputes LineItem.eligible_product_count", "increments ProductAssignment.version by 1"]
      - from: PAUSED_OOS
        to: ACTIVE
        trigger: "System cascade from CatalogProduct OUT_OF_STOCK -> ELIGIBLE"
        actor: system
        preconditions: ["CatalogProduct.eligibility_status becoming ELIGIBLE"]
        side_effects: ["recomputes relevance_contribution and LineItem.eligible_product_count", "increments ProductAssignment.version by 1"]
      - from: ACTIVE
        to: PAUSED_RESTRICTED
        trigger: "System cascade from CatalogProduct ELIGIBLE -> RESTRICTED"
        actor: system
        preconditions: ["CatalogProduct.eligibility_status becoming RESTRICTED"]
        side_effects: ["sets relevance_contribution to 0.0", "recomputes LineItem.eligible_product_count", "increments ProductAssignment.version by 1"]
      - from: PAUSED_OOS
        to: PAUSED_RESTRICTED
        trigger: "System cascade from CatalogProduct OUT_OF_STOCK -> RESTRICTED"
        actor: system
        preconditions: ["CatalogProduct.eligibility_status becoming RESTRICTED"]
        side_effects: ["increments ProductAssignment.version by 1"]
      - from: PAUSED_RESTRICTED
        to: ACTIVE
        trigger: "System cascade from CatalogProduct RESTRICTED -> ELIGIBLE"
        actor: system
        preconditions: ["CatalogProduct.eligibility_status becoming ELIGIBLE"]
        side_effects: ["recomputes relevance_contribution and LineItem.eligible_product_count", "increments ProductAssignment.version by 1"]
      - from: ACTIVE
        to: REMOVED
        trigger: "DELETE /rmn/product-assignments/{id}, or system cascade from CatalogProduct -> DELISTED"
        actor: AdvertiserUser | AccountManager | CatalogOps | system
        preconditions:
          - "LineItem(line_item_id).line_item_status != ENDED"
          - "when the actor is not system: the line item retains at least one other ProductAssignment with assignment_status == ACTIVE and is_hero == true, unless the line item is in DRAFT"
        side_effects:
          - "sets removed_at = clock_now"
          - "recomputes LineItem.eligible_product_count and LineItem.relevance_score"
          - "increments ProductAssignment.version and LineItem.version by 1"
      - from: PAUSED_OOS
        to: REMOVED
        trigger: "DELETE /rmn/product-assignments/{id}, or system cascade from CatalogProduct -> DELISTED"
        actor: AdvertiserUser | AccountManager | CatalogOps | system
        preconditions: ["LineItem.line_item_status != ENDED"]
        side_effects: ["same as ACTIVE -> REMOVED"]
      - from: PAUSED_RESTRICTED
        to: REMOVED
        trigger: "DELETE /rmn/product-assignments/{id}, or system cascade from CatalogProduct -> DELISTED"
        actor: AdvertiserUser | AccountManager | CatalogOps | system
        preconditions: ["LineItem.line_item_status != ENDED"]
        side_effects: ["same as ACTIVE -> REMOVED"]

  - entity: LineItem
    state_field: line_item_status
    initial_state: DRAFT
    terminal_states: [REJECTED, ENDED]
    transitions:
      - from: DRAFT
        to: PENDING_ELIGIBILITY
        trigger: "POST /rmn/line-items/{id}/submit-eligibility"
        actor: AdvertiserUser | AccountManager
        preconditions:
          - "line_item.eligible_product_count >= 1"
          - "at least one ProductAssignment on this line item has is_hero == true and assignment_status == ACTIVE"
          - "Campaign(campaign_id).delivery_status IN {DRAFT, PENDING_REVIEW, SCHEDULED, DELIVERING}"
        side_effects: ["increments LineItem.version by 1"]
      - from: PENDING_ELIGIBILITY
        to: ELIGIBLE
        trigger: "POST /rmn/line-items/{id}/eligibility-decision with decision=APPROVE"
        actor: CatalogOps
        preconditions:
          - "every ProductAssignment on this line item with assignment_status == ACTIVE references a CatalogProduct with eligibility_status == ELIGIBLE"
          - "PlacementSlot(placement_slot_id).slot_status == OPEN"
          - "the count of LineItem rows on the same slot with line_item_status IN {ELIGIBLE, SERVING, OOS_PAUSED, MANUAL_PAUSED} whose [flight_start_at, flight_end_at) overlaps this line item's window is < PlacementSlot.max_concurrent_line_items"
          - "when PlacementSlot.exclusivity_category_code is non-null and equals this line item's category_code, no other overlapping LineItem on the slot shares that category_code"
        side_effects:
          - "sets line_item.eligibility_decided_by_user_id = X-User-ID"
          - "increments PlacementSlot.occupancy_count by 1"
          - "recomputes line_item.reserved_cents via line_item_reservation"
          - "increments LineItem.version and PlacementSlot.version by 1"
      - from: PENDING_ELIGIBILITY
        to: REJECTED
        trigger: "POST /rmn/line-items/{id}/eligibility-decision with decision=REJECT"
        actor: CatalogOps
        preconditions: ["line_item.line_item_status == PENDING_ELIGIBILITY"]
        side_effects:
          - "sets line_item.eligibility_decided_by_user_id = X-User-ID"
          - "PlacementSlot.occupancy_count is NOT incremented"
          - "every ProductAssignment on this line item transitions to REMOVED"
          - "increments LineItem.version by 1"
        note: "Divergent branch of the eligibility fork: APPROVE occupies slot capacity, REJECT releases the product assignments instead."
      - from: ELIGIBLE
        to: SERVING
        trigger: "POST /rmn/line-items/{id}/activate, or system when the owning Campaign reaches DELIVERING"
        actor: AdvertiserUser | AccountManager | system
        preconditions:
          - "Campaign(campaign_id).delivery_status == DELIVERING"
          - "Advertiser.onboarding_status == ACTIVE"
          - "BudgetPlan.plan_status == ACTIVE AND BudgetPlan.available_cents >= line_item.daily_budget_cents"
          - "clock_now >= line_item.flight_start_at AND clock_now < line_item.flight_end_at"
          - "line_item.eligible_product_count >= 1"
        side_effects:
          - "sets line_item.pause_reason = NONE"
          - "recomputes line_item.priority_tier via line_item_priority_tier"
          - "increments LineItem.version by 1"
      - from: SERVING
        to: OOS_PAUSED
        trigger: "System cascade when eligible_product_count reaches 0 through catalog out-of-stock or restriction"
        actor: system
        preconditions: ["line_item.eligible_product_count == 0"]
        side_effects:
          - "sets line_item.pause_reason = OUT_OF_STOCK (or CATALOG_RESTRICTED when the trigger was a restriction)"
          - "sets line_item.last_pause_at = clock_now"
          - "increments Campaign.oos_paused_line_item_count by 1"
          - "PlacementSlot.occupancy_count unchanged"
          - "increments LineItem.version and Campaign.version by 1"
      - from: OOS_PAUSED
        to: SERVING
        trigger: "System cascade when eligible_product_count returns to >= 1 while Campaign.delivery_status == DELIVERING"
        actor: system
        preconditions: ["line_item.eligible_product_count >= 1", "Campaign.delivery_status == DELIVERING", "clock_now < line_item.flight_end_at"]
        side_effects:
          - "sets line_item.pause_reason = NONE"
          - "decrements Campaign.oos_paused_line_item_count by 1"
          - "increments LineItem.version and Campaign.version by 1"
        note: "Cycle: SERVING -> OOS_PAUSED -> SERVING may repeat with every stock swing."
      - from: OOS_PAUSED
        to: ELIGIBLE
        trigger: "System cascade when eligible_product_count returns to >= 1 while Campaign.delivery_status != DELIVERING"
        actor: system
        preconditions: ["line_item.eligible_product_count >= 1", "Campaign.delivery_status IN {SCHEDULED, PAUSED}"]
        side_effects: ["sets line_item.pause_reason = NONE", "decrements Campaign.oos_paused_line_item_count by 1", "increments LineItem.version and Campaign.version by 1"]
      - from: SERVING
        to: MANUAL_PAUSED
        trigger: "POST /rmn/line-items/{id}/pause, or system cascade from Campaign pause / Advertiser suspension / BudgetPlan exhaustion / slot maintenance"
        actor: AdvertiserUser | AccountManager | system
        preconditions: ["line_item.line_item_status == SERVING"]
        side_effects:
          - "sets line_item.pause_reason (MANUAL, BUDGET_EXHAUSTED per the trigger) and last_pause_at = clock_now"
          - "increments LineItem.version by 1"
      - from: MANUAL_PAUSED
        to: SERVING
        trigger: "POST /rmn/line-items/{id}/resume, or system cascade from Campaign resume"
        actor: AdvertiserUser | AccountManager | system
        preconditions:
          - "Campaign.delivery_status == DELIVERING"
          - "line_item.eligible_product_count >= 1"
          - "BudgetPlan.available_cents >= line_item.daily_budget_cents"
          - "clock_now < line_item.flight_end_at"
        side_effects: ["sets line_item.pause_reason = NONE", "increments LineItem.version by 1"]
        note: "Cycle: SERVING -> MANUAL_PAUSED -> SERVING."
      - from: SERVING
        to: ENDED
        trigger: "POST /rmn/line-items/{id}/end, or system cascade from Campaign completion"
        actor: AdvertiserUser | AccountManager | system
        preconditions: ["no AuctionEvent won by this line item has status IN {OPEN, RANKED, AWARDED}"]
        side_effects:
          - "decrements PlacementSlot.occupancy_count by 1"
          - "recomputes BudgetPlan.reserved_cents and available_cents"
          - "increments LineItem.version, PlacementSlot.version, BudgetPlan.version by 1"
        note: "Compensating action for the ELIGIBLE occupancy grant; conserves the slot occupancy identity."
      - from: ELIGIBLE
        to: ENDED
        trigger: "POST /rmn/line-items/{id}/end, or system cascade from Campaign completion or archive"
        actor: AdvertiserUser | AccountManager | system
        preconditions: ["line_item.spend_cents == 0"]
        side_effects: ["same as SERVING -> ENDED"]
      - from: OOS_PAUSED
        to: ENDED
        trigger: "POST /rmn/line-items/{id}/end, or system cascade from Campaign completion"
        actor: AdvertiserUser | AccountManager | system
        preconditions: ["no AuctionEvent won by this line item has status IN {OPEN, RANKED, AWARDED}"]
        side_effects: ["same as SERVING -> ENDED"]
      - from: MANUAL_PAUSED
        to: ENDED
        trigger: "POST /rmn/line-items/{id}/end, or system cascade from Campaign completion"
        actor: AdvertiserUser | AccountManager | system
        preconditions: ["no AuctionEvent won by this line item has status IN {OPEN, RANKED, AWARDED}"]
        side_effects: ["same as SERVING -> ENDED"]

  - entity: AuctionEvent
    state_field: status
    initial_state: OPEN
    terminal_states: [SETTLED]
    transitions:
      - from: OPEN
        to: RANKED
        trigger: "POST /rmn/auction-events/{id}/rank"
        actor: AuctionService
        preconditions: ["auction.status == OPEN", "PlacementSlot(placement_slot_id).slot_status == OPEN"]
        side_effects:
          - "creates one AuctionBid row per candidate LineItem on the slot, applying the eligibility filter and the relevance_adjusted_bid_ranking calculation"
          - "sets auction.candidate_count, auction.winner_score, auction.second_best_score"
          - "persists relevance_score and quality_adjusted_score on each ranked LineItem"
          - "increments AuctionEvent.version by 1 and each ranked LineItem.version by 1"
      - from: RANKED
        to: AWARDED
        trigger: "POST /rmn/auction-events/{id}/award"
        actor: AuctionService
        preconditions: ["at least one AuctionBid on this auction has outcome not in {FILTERED_INELIGIBLE, FILTERED_BELOW_FLOOR}"]
        side_effects:
          - "sets auction.winning_line_item_id to the rank-1 bid's line_item_id and that bid's outcome = WON; every other unfiltered bid's outcome = LOST"
          - "sets auction.clearing_price_cents via second_price_clearing"
          - "sets auction.no_fill_reason = NONE"
          - "increments AuctionEvent.version by 1"
        note: "Divergent branch A of the award fork: reserves clearing price against the winner."
      - from: RANKED
        to: NO_FILL
        trigger: "POST /rmn/auction-events/{id}/award when no unfiltered bid survives"
        actor: AuctionService
        preconditions: ["every AuctionBid on this auction has outcome IN {FILTERED_INELIGIBLE, FILTERED_BELOW_FLOOR}"]
        side_effects:
          - "leaves auction.winning_line_item_id null and auction.clearing_price_cents null"
          - "sets auction.no_fill_reason = NO_ELIGIBLE_CANDIDATES when candidate_count == 0 or every bid was FILTERED_INELIGIBLE, otherwise ALL_BELOW_FLOOR"
          - "sets auction.settled_spend_cents = 0"
          - "increments AuctionEvent.version by 1"
        note: "Divergent branch B of the award fork: no ledger movement at all, and the auction still terminates through SETTLED."
      - from: AWARDED
        to: SETTLED
        trigger: "POST /rmn/auction-events/{id}/settle"
        actor: BillingOps | AuctionService
        preconditions:
          - "at least one EngagementEvent exists on this auction with event_type == IMPRESSION"
          - "BudgetPlan of the winning line item's campaign has plan_status IN {ACTIVE, EXHAUSTED}"
        side_effects:
          - "sets auction.settled_spend_cents via auction_settlement_amount"
          - "CASCADE L1: increases LineItem.spend_cents and Campaign.delivered_spend_cents by settled_spend_cents"
          - "CASCADE L2: the Campaign spend increase recomputes BudgetPlan.consumed_cents and BudgetPlan.available_cents; a plan whose recomputed available_cents <= 0 and plan_status == ACTIVE transitions to EXHAUSTED"
          - "CASCADE L3: the plan entering EXHAUSTED pauses every DELIVERING Campaign on it, which in turn moves every SERVING LineItem of those campaigns to MANUAL_PAUSED with pause_reason = BUDGET_EXHAUSTED"
          - "recomputes Campaign.pacing_index"
          - "increments AuctionEvent.version by 1 plus every mutated row's version"
      - from: NO_FILL
        to: SETTLED
        trigger: "POST /rmn/auction-events/{id}/settle"
        actor: BillingOps | AuctionService
        preconditions: ["auction.status == NO_FILL"]
        side_effects: ["sets auction.settled_spend_cents = 0", "no ledger recomputation occurs", "increments AuctionEvent.version by 1"]

  - entity: IncrementalityStudy
    state_field: study_status
    initial_state: DESIGNED
    terminal_states: [INVALIDATED]
    transitions:
      - from: DESIGNED
        to: RUNNING
        trigger: "POST /rmn/incrementality-studies/{id}/start"
        actor: MeasurementAnalyst
        preconditions:
          - "Campaign(campaign_id).delivery_status IN {SCHEDULED, DELIVERING}"
          - "clock_now >= study.window_start_at"
          - "no other IncrementalityStudy on the same campaign with study_status IN {RUNNING, MEASURING, PUBLISHED} has a window within WASHOUT_DAYS (7) of this study's window"
        side_effects: ["increments IncrementalityStudy.version by 1"]
      - from: RUNNING
        to: MEASURING
        trigger: "POST /rmn/incrementality-studies/{id}/measure"
        actor: MeasurementAnalyst
        preconditions:
          - "clock_now >= study.window_end_at"
          - "study.exposed_group_size >= 1 AND study.control_group_size >= 1"
        side_effects:
          - "sets study.lift_pct, study.incremental_sales_cents, study.significance_score, study.significance_flag via incremental_sales_lift"
          - "increments IncrementalityStudy.version by 1"
      - from: MEASURING
        to: PUBLISHED
        trigger: "POST /rmn/incrementality-studies/{id}/publish"
        actor: MeasurementAnalyst
        preconditions:
          - "study.significance_flag == true"
          - "no other IncrementalityStudy on the same campaign has study_status == PUBLISHED with an overlapping window"
        side_effects:
          - "sets study.published_by_user_id = X-User-ID"
          - "sets Campaign.incremental_revenue_cents from this study and recomputes Campaign.iroas"
          - "if study.supersedes_study_id is non-null, that study transitions PUBLISHED -> INVALIDATED with invalidated_reason = SUPERSEDED"
          - "increments IncrementalityStudy.version and Campaign.version by 1"
      - from: PUBLISHED
        to: INVALIDATED
        trigger: "POST /rmn/incrementality-studies/{id}/invalidate, or system cascade when a superseding study is published"
        actor: MeasurementAnalyst | NetworkAdmin | system
        preconditions: ["study.study_status == PUBLISHED"]
        side_effects:
          - "sets study.invalidated_reason"
          - "CASCADE L1: Campaign.incremental_revenue_cents is recomputed from the remaining PUBLISHED study with the greatest window_end_at, falling back to 0 when none remains, and Campaign.iroas is recomputed"
          - "CASCADE L2: the campaign's incremental revenue change marks every AttributedSale on the campaign's line items with occurred_at inside [study.window_start_at, study.window_end_at) as restated = true"
          - "CASCADE L3: each restated AttributedSale recomputes Campaign.attributed_revenue_cents and Campaign.roas"
          - "increments IncrementalityStudy.version, Campaign.version and every restated AttributedSale.version by 1"
      - from: MEASURING
        to: INVALIDATED
        trigger: "POST /rmn/incrementality-studies/{id}/invalidate"
        actor: MeasurementAnalyst | NetworkAdmin
        preconditions: ["study.study_status == MEASURING"]
        side_effects: ["sets study.invalidated_reason", "no campaign-level recomputation occurs because the study was never published", "increments IncrementalityStudy.version by 1"]
      - from: INVALIDATED
        to: MEASURING
        trigger: "POST /rmn/incrementality-studies/{id}/measure (re-measurement after a data defect is corrected)"
        actor: MeasurementAnalyst
        preconditions: ["study.invalidated_reason == DATA_DEFECT", "clock_now < study.window_end_at + 30 days"]
        side_effects:
          - "sets study.invalidated_reason = NONE"
          - "recomputes lift_pct, incremental_sales_cents, significance_score, significance_flag"
          - "increments IncrementalityStudy.version by 1"
        note: "Cycle: MEASURING -> PUBLISHED -> INVALIDATED -> MEASURING is permitted only for DATA_DEFECT invalidations."

  - entity: Invoice
    state_field: invoice_status
    initial_state: DRAFT
    terminal_states: [SETTLED, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /rmn/invoices/{id}/issue"
        actor: BillingOps
        preconditions:
          - "Advertiser(advertiser_id).onboarding_status IN {ACTIVE, SUSPENDED}"
          - "every Campaign on invoice.budget_plan_id has billing_status IN {PENDING_INVOICE, INVOICED, RECONCILED}"
          - "invoice.trade_fund_account_id is null OR TradeFundAccount.account_status == OPEN"
          - "invoice.gross_spend_cents >= 1"
        side_effects:
          - "recomputes onsite_spend_cents, offsite_spend_cents, gross_spend_cents, managed_service_fee_cents, trade_fund_deduction_cents and net_cash_due_cents via invoice_settlement_waterfall in that pinned order"
          - "sets issued_at = clock_now, due_at = clock_now + NET_TERMS_DAYS, issued_by_user_id = X-User-ID"
          - "increases TradeFundAccount.deducted_cents by trade_fund_deduction_cents and decreases its available_cents by the same amount"
          - "a TradeFundAccount whose recomputed available_cents would fall below 0 transitions OPEN -> FROZEN with frozen_reason = OVERDRAWN and the deduction is capped at the pool's available_cents"
          - "recomputes Advertiser.credit_exposure_cents; an Advertiser whose recomputed credit_exposure_cents > credit_limit_cents transitions ACTIVE -> SUSPENDED with suspension_reason = CREDIT_BREACH"
          - "every Campaign on the plan with billing_status == PENDING_INVOICE transitions to INVOICED"
          - "increments Invoice.version by 1 plus every mutated row's version"
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /rmn/measurement-disputes referencing this invoice"
        actor: AdvertiserUser | AccountManager
        preconditions: ["clock_now < invoice.due_at + DISPUTE_GRACE_DAYS"]
        side_effects:
          - "the referenced Campaign transitions billing_status INVOICED -> DISPUTED"
          - "increments Invoice.version by 1"
      - from: DISPUTED
        to: ISSUED
        trigger: "System when every MeasurementDispute on this invoice reaches REJECTED or WITHDRAWN"
        actor: system
        preconditions: ["no MeasurementDispute on this invoice has dispute_status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, ESCALATED, UPHELD}"]
        side_effects: ["increments Invoice.version by 1"]
        note: "Cycle: ISSUED -> DISPUTED -> ISSUED may repeat while the invoice remains unsettled."
      - from: DISPUTED
        to: ADJUSTED
        trigger: "POST /rmn/invoices/{id}/adjust"
        actor: BillingOps
        preconditions:
          - "at least one MeasurementDispute on this invoice has dispute_status == UPHELD"
          - "invoice.adjustment_round < MAX_ADJUSTMENT_ROUNDS (2)"
        side_effects:
          - "increments invoice.adjustment_round by 1"
          - "recomputes dispute_credit_cents, trade_fund_deduction_cents and net_cash_due_cents via invoice_settlement_waterfall"
          - "reverses the excess trade fund deduction: TradeFundAccount.deducted_cents decreases and available_cents increases by the delta"
          - "recomputes Advertiser.credit_exposure_cents and Advertiser.dispute_credit_balance_cents"
          - "increments Invoice.version by 1 plus every mutated row's version"
      - from: ADJUSTED
        to: SETTLED
        trigger: "POST /rmn/invoices/{id}/settle"
        actor: BillingOps
        preconditions:
          - "no MeasurementDispute on this invoice has dispute_status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, ESCALATED}"
          - "paid_amount_cents == invoice.net_cash_due_cents"
        side_effects:
          - "sets settled_at = clock_now"
          - "every Campaign on the plan with billing_status IN {INVOICED, DISPUTED} transitions to RECONCILED, recomputing roas and iroas"
          - "recomputes Advertiser.credit_exposure_cents and Advertiser.dispute_credit_balance_cents"
          - "increments Invoice.version by 1 plus every mutated row's version"
      - from: ISSUED
        to: SETTLED
        trigger: "POST /rmn/invoices/{id}/settle"
        actor: BillingOps
        preconditions:
          - "no MeasurementDispute on this invoice has dispute_status IN {SUBMITTED, UNDER_REVIEW, INFO_REQUESTED, ESCALATED}"
          - "paid_amount_cents == invoice.net_cash_due_cents"
        side_effects: ["same as ADJUSTED -> SETTLED"]
      - from: ISSUED
        to: WRITTEN_OFF
        trigger: "POST /rmn/invoices/{id}/write-off"
        actor: NetworkAdmin
        preconditions:
          - "clock_now >= invoice.due_at + WRITE_OFF_DAYS (60)"
          - "X-User-ID != invoice.issued_by_user_id (segregation of duties)"
        side_effects:
          - "fully reverses the trade fund deduction: TradeFundAccount.deducted_cents decreases by trade_fund_deduction_cents and available_cents increases by the same amount, restoring the pool identity accrued_cents == available_cents + reserved_cents + deducted_cents"
          - "a TradeFundAccount with frozen_reason == OVERDRAWN whose available_cents becomes >= 0 transitions FROZEN -> OPEN"
          - "every Campaign on the plan with billing_status IN {INVOICED, DISPUTED} transitions to RECONCILED"
          - "recomputes Advertiser.credit_exposure_cents"
          - "increments Invoice.version by 1 plus every mutated row's version"
        note: "Compensating action for DRAFT -> ISSUED; conserves the trade fund pool identity."
      - from: ADJUSTED
        to: WRITTEN_OFF
        trigger: "POST /rmn/invoices/{id}/write-off"
        actor: NetworkAdmin
        preconditions: ["same as ISSUED -> WRITTEN_OFF"]
        side_effects: ["same as ISSUED -> WRITTEN_OFF, using the post-adjustment trade_fund_deduction_cents"]

  - entity: MeasurementDispute
    state_field: dispute_status
    initial_state: SUBMITTED
    terminal_states: [UPHELD, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /rmn/measurement-disputes/{id}/start-review"
        actor: MeasurementAnalyst
        preconditions:
          - "Invoice(invoice_id).invoice_status == DISPUTED"
          - "dispute.dispute_category != INCREMENTALITY_RESTATEMENT OR the referenced campaign has at least one IncrementalityStudy with study_status IN {PUBLISHED, INVALIDATED}"
        side_effects:
          - "sets first_response_at = clock_now when null, assigned_analyst_user_id = X-User-ID, review_rounds = review_rounds + 1"
          - "recomputes sla_breached via dispute_sla_clock (true when first_response_at > sla_due_at)"
          - "increments MeasurementDispute.version by 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /rmn/measurement-disputes/{id}/request-info"
        actor: MeasurementAnalyst
        preconditions: ["dispute.info_request_count < MAX_INFO_REQUESTS (2)"]
        side_effects:
          - "increments info_request_count by 1"
          - "extends sla_due_at by INFO_REQUEST_EXTENSION_HOURS (48) and recomputes sla_response_hours accordingly"
          - "increments MeasurementDispute.version by 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /rmn/measurement-disputes/{id}/provide-info"
        actor: AdvertiserUser | AccountManager
        preconditions: ["clock_now < dispute.sla_due_at"]
        side_effects:
          - "increments review_rounds by 1"
          - "recomputes sla_breached"
          - "increments MeasurementDispute.version by 1"
        note: "Cycle: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW, bounded by MAX_INFO_REQUESTS = 2."
      - from: INFO_REQUESTED
        to: ESCALATED
        trigger: "POST /_ops/run-daily-checkpoint when clock_now >= dispute.sla_due_at and no information was provided"
        actor: system
        preconditions: ["clock_now >= dispute.sla_due_at"]
        side_effects:
          - "sets sla_breached = true and escalation_level = 1"
          - "increments MeasurementDispute.version by 1"
      - from: UNDER_REVIEW
        to: ESCALATED
        trigger: "POST /_ops/run-daily-checkpoint when clock_now >= dispute.sla_due_at, or POST /rmn/measurement-disputes/{id}/request-info when info_request_count == MAX_INFO_REQUESTS"
        actor: system | MeasurementAnalyst
        preconditions: ["clock_now >= dispute.sla_due_at OR dispute.info_request_count == 2"]
        side_effects:
          - "sets sla_breached = true when the trigger was the clock, and escalation_level = 1 for an SLA breach or 2 for round exhaustion"
          - "increments MeasurementDispute.version by 1"
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /rmn/measurement-disputes/{id}/resolve with decision=UPHOLD"
        actor: MeasurementAnalyst | NetworkAdmin
        preconditions:
          - "X-User-ID != the published_by_user_id of the campaign's latest PUBLISHED IncrementalityStudy when dispute_category == INCREMENTALITY_RESTATEMENT (segregation of duties)"
          - "approved_credit_amount_cents <= dispute.claimed_amount_cents"
          - "Invoice.invoice_status == DISPUTED"
        side_effects:
          - "sets approved_credit_cents via dispute_credit_award and resolved_by_user_id = X-User-ID"
          - "CASCADE L1: Invoice.dispute_credit_cents is recomputed and the Invoice transitions DISPUTED -> ADJUSTED with net_cash_due_cents and trade_fund_deduction_cents recomputed via invoice_settlement_waterfall"
          - "CASCADE L2: the invoice adjustment lowers TradeFundAccount.deducted_cents and raises its available_cents; a pool with frozen_reason == OVERDRAWN whose available_cents becomes >= 0 transitions FROZEN -> OPEN"
          - "CASCADE L3: the pool returning to OPEN transitions any BudgetPlan of the same (advertiser_id, fiscal_period_code) with plan_status == EXHAUSTED and available_cents > 0 to ACTIVE"
          - "recomputes Advertiser.dispute_credit_balance_cents and credit_exposure_cents"
          - "increments MeasurementDispute.version by 1 plus every mutated row's version"
      - from: ESCALATED
        to: UPHELD
        trigger: "POST /rmn/measurement-disputes/{id}/resolve with decision=UPHOLD"
        actor: NetworkAdmin
        preconditions:
          - "dispute.escalation_level >= 1"
          - "approved_credit_amount_cents <= dispute.claimed_amount_cents"
        side_effects:
          - "same as UNDER_REVIEW -> UPHELD, and additionally applies the SLA-breach uplift inside dispute_credit_award"
          - "increments MeasurementDispute.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /rmn/measurement-disputes/{id}/resolve with decision=REJECT"
        actor: MeasurementAnalyst | NetworkAdmin
        preconditions: ["dispute.sla_breached == false"]
        side_effects:
          - "sets approved_credit_cents = 0 and resolved_by_user_id = X-User-ID"
          - "when no other non-terminal dispute remains on the invoice, the Invoice transitions DISPUTED -> ISSUED and each affected Campaign transitions billing_status DISPUTED -> INVOICED"
          - "increments MeasurementDispute.version by 1 plus every mutated row's version"
        note: "Divergent branch of the resolve fork: no ledger movement, and the invoice returns to ISSUED rather than ADJUSTED."
      - from: ESCALATED
        to: REJECTED
        trigger: "POST /rmn/measurement-disputes/{id}/resolve with decision=REJECT"
        actor: NetworkAdmin
        preconditions: ["dispute.escalation_level == 2"]
        side_effects: ["same as UNDER_REVIEW -> REJECTED"]
        note: "An SLA-breach escalation (escalation_level == 1) can no longer be rejected; it must be upheld."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /rmn/measurement-disputes/{id}/withdraw"
        actor: AdvertiserUser | AccountManager
        preconditions: ["dispute.dispute_status == SUBMITTED"]
        side_effects:
          - "when no other non-terminal dispute remains on the invoice, the Invoice transitions DISPUTED -> ISSUED and each affected Campaign transitions billing_status DISPUTED -> INVOICED"
          - "increments MeasurementDispute.version by 1 plus every mutated row's version"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /rmn/measurement-disputes/{id}/withdraw"
        actor: AdvertiserUser | AccountManager
        preconditions: ["dispute.dispute_status == INFO_REQUESTED"]
        side_effects: ["same as SUBMITTED -> WITHDRAWN"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent entity's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: budget-plan-create-stale-advertiser
    parent_entity: Advertiser
    write_endpoint: "POST /rmn/budget-plans"
    occ_field: "expected_advertiser_version"
    description: |
      Creating a BudgetPlan against an Advertiser whose version has advanced since
      the client last observed it is rejected. A newly created DRAFT plan for a
      fiscal period legitimately supersedes any prior DRAFT plan for that same
      (advertiser_id, fiscal_period_code), so a writer holding a stale view of the
      advertiser would silently discard budget setup work performed after its read.
    error_id: ERR_STALE_ADVERTISER_VERSION
    http_status: 412

  - rule_id: line-item-create-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /rmn/line-items"
    occ_field: "expected_campaign_version"
    description: |
      Creating a LineItem against a Campaign whose version has advanced since the
      client last observed it is rejected. Line-item creation legitimately consumes
      PlacementSlot capacity and rewrites the campaign's channel coverage, so a
      writer whose view of the campaign predates another line-item creation would
      base its slot and flight-window choices on superseded campaign state.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

  - rule_id: product-assignment-create-stale-line-item
    parent_entity: LineItem
    write_endpoint: "POST /rmn/product-assignments"
    occ_field: "expected_line_item_version"
    description: |
      Creating a ProductAssignment against a LineItem whose version has advanced
      since the client last observed it is rejected. A new assignment marked
      is_hero legitimately supersedes the previous hero assignment on the same line
      item, so a stale writer would demote a hero product chosen after its read.
    error_id: ERR_STALE_LINE_ITEM_VERSION
    http_status: 412

  - rule_id: trade-fund-deduction-stale-account
    parent_entity: TradeFundAccount
    write_endpoint: "POST /rmn/trade-fund-accounts/{id}/deductions"
    occ_field: "expected_trade_fund_account_version"
    description: |
      Posting a manual trade fund deduction against a TradeFundAccount whose version
      has advanced since the client last observed it is rejected. Manual deductions
      are legitimate at any available_cents >= amount, so the check exists purely to
      stop a writer from drawing against a pool balance it read before an earlier
      deduction, accrual or invoice-driven recomputation changed it.
    error_id: ERR_STALE_TRADE_FUND_VERSION
    http_status: 412

  - rule_id: dispute-create-stale-invoice
    parent_entity: Invoice
    write_endpoint: "POST /rmn/measurement-disputes"
    occ_field: "expected_invoice_version"
    description: |
      Filing a MeasurementDispute against an Invoice whose version has advanced
      since the client last observed it is rejected. Filing is legitimate for any
      ISSUED or DISPUTED invoice inside the grace window, so the check exists to
      stop a writer from claiming an amount computed against a net_cash_due_cents
      figure that an earlier dispute, adjustment or credit already changed.
    error_id: ERR_STALE_INVOICE_VERSION
    http_status: 412

  - rule_id: study-create-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /rmn/incrementality-studies"
    occ_field: "expected_campaign_version"
    description: |
      Creating an IncrementalityStudy against a Campaign whose version has advanced
      since the client last observed it is rejected. A restatement study carrying a
      supersedes_study_id legitimately replaces the campaign's currently published
      measurement, so a stale writer would restate a measurement figure that a
      newer study already replaced.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: relevance_score_composition
    trigger: "POST /rmn/auction-events/{id}/rank — once per candidate LineItem, before ranking"
    algorithm: weighted_scoring
    formula: |
      terms         = line_item.keyword_match_terms                       # lowercased list
      query_tokens  = auction.request_context_query split on single spaces  # lowercased
      term_overlap  = count of distinct t in terms such that t is an exact member of query_tokens
      overlap_ratio = 0.0 when len(terms) == 0 else term_overlap / len(terms)
      active_set    = ProductAssignment rows with line_item_id == line_item.id
                      AND assignment_status == ACTIVE
                      AND CatalogProduct.eligibility_status == ELIGIBLE
      margin_avg    = 0.0 when active_set is empty
                      else sum(CatalogProduct.margin_pct over active_set) / count(active_set)
      hero_boost    = 0.10 when active_set contains at least one row with is_hero == true else 0.00
      segment_bonus = SEGMENT_BONUS[auction.shopper_segment]
      relevance_score = round_half_up(min(1.0000,
                          0.60 * overlap_ratio + 0.25 * margin_avg + hero_boost + segment_bonus), 4)
      ProductAssignment.relevance_contribution = round_half_up(
                          0.25 * CatalogProduct.margin_pct / max(1, count(active_set)), 4)
                          for each row in active_set, 0.0000 for every other row
    input_set: "Candidate LineItem rows on auction.placement_slot_id; only ProductAssignment rows with assignment_status == ACTIVE whose CatalogProduct.eligibility_status == ELIGIBLE contribute to margin_avg and hero_boost."
    constants:
      SEGMENT_BONUS_NEW: 0.00
      SEGMENT_BONUS_RETURNING: 0.03
      SEGMENT_BONUS_LOYALTY: 0.06
    precision: "4 decimal places, round_half_up; relevance_score is clamped to [0.0000, 1.0000]"

  - name: relevance_adjusted_bid_ranking
    trigger: "POST /rmn/auction-events/{id}/rank — produces every AuctionBid row and its rank"
    algorithm: weighted_scoring
    formula: |
      # --- CANDIDATE SET -------------------------------------------------------
      # Only LineItem rows with placement_slot_id == auction.placement_slot_id enter
      # the pool at all; rows on other slots produce no AuctionBid row.
      # Each pool member is evaluated against the ordered filter chain below and the
      # FIRST failing clause fixes AuctionBid.filter_reason:
      #  1. NOT_SERVING            line_item_status != SERVING
      #                            OR Campaign.delivery_status != DELIVERING
      #                            OR Advertiser.onboarding_status != ACTIVE
      #                            OR BudgetPlan.plan_status != ACTIVE
      #                            OR auction.requested_at < flight_start_at
      #                            OR auction.requested_at >= flight_end_at
      #  2. NO_ELIGIBLE_PRODUCTS   line_item.eligible_product_count == 0
      #  3. ZERO_TERM_OVERLAP      relevance_score == 0.0000
      #  4. DAILY_BUDGET_EXHAUSTED headroom_cents <= 0
      #  5. BELOW_FLOOR            quality_adjusted_score < PlacementSlot.floor_cpc_cents
      # Clauses 1-4 yield outcome = FILTERED_INELIGIBLE; clause 5 yields
      # outcome = FILTERED_BELOW_FLOOR. Rows passing all five are unfiltered.
      #
      # --- SCORE ---------------------------------------------------------------
      day_window    = [floor_to_utc_day(clock_now), floor_to_utc_day(clock_now) + 24h)
      spend_today(x)= sum of AuctionEvent.settled_spend_cents over AuctionEvent rows with
                      status == SETTLED, requested_at inside day_window, whose
                      winning_line_item_id resolves to x (line item, its campaign, or any
                      campaign of the advertiser, depending on the caller)
      headroom_cents = min( line_item.daily_budget_cents - spend_today(line_item),
                            campaign.daily_cap_cents      - spend_today(campaign),
                            advertiser.self_serve_daily_spend_cap_cents - spend_today(advertiser)
                              when advertiser.service_model == SELF_SERVE,
                            else line_item.daily_budget_cents - spend_today(line_item) )
      effective_bid_cents    = min(line_item.bid_cents, headroom_cents)
      quality_adjusted_score = round_half_up(
                                 effective_bid_cents
                                 * (relevance_score ** PlacementSlot.relevance_weight)
                                 * TIER_MULTIPLIER[line_item.priority_tier], 4)
      #
      # --- RANKING -------------------------------------------------------------
      # Unfiltered bids are ordered by:
      #   (1) quality_adjusted_score DESC
      #   (2) effective_bid_cents DESC
      #   (3) priority_tier ASC in the fixed order TIER_1, TIER_2, TIER_3
      #   (4) LineItem.created_at ASC   (never LineItem.id)
      # rank is assigned 1..N over that ordering; filtered bids get rank = null.
      # EMPTY POOL / ALL FILTERED: the auction takes the RANKED -> NO_FILL branch with
      # no_fill_reason = NO_ELIGIBLE_CANDIDATES when candidate_count == 0 or every bid is
      # FILTERED_INELIGIBLE, and ALL_BELOW_FLOOR when at least one bid is
      # FILTERED_BELOW_FLOOR and none is unfiltered.
      auction.candidate_count    = count of AuctionBid rows created
      auction.winner_score       = quality_adjusted_score of rank 1, null when none
      auction.second_best_score  = quality_adjusted_score of rank 2, null when N < 2
    input_set: "LineItem rows on the auctioned slot only. Rows in DRAFT, PENDING_ELIGIBILITY, ELIGIBLE, OOS_PAUSED, MANUAL_PAUSED, REJECTED or ENDED all produce FILTERED_INELIGIBLE bid rows with filter_reason = NOT_SERVING; they are never ranked."
    constants:
      TIER_MULTIPLIER_TIER_1: 1.10
      TIER_MULTIPLIER_TIER_2: 1.00
      TIER_MULTIPLIER_TIER_3: 0.90
    precision: "quality_adjusted_score to 4 decimal places, round_half_up; effective_bid_cents and headroom_cents are integers"

  - name: line_item_priority_tier
    trigger: "POST /rmn/line-items/{id}/activate and every LineItem transition into SERVING; also recomputed at ranking time"
    algorithm: threshold
    formula: |
      denom = BudgetPlan.committed_total_cents + BudgetPlan.top_up_total_cents
      remaining_ratio = 0.0 when denom == 0 else BudgetPlan.available_cents / denom
      if Advertiser.service_model == MANAGED AND remaining_ratio >= 0.50 -> TIER_1
      elif Advertiser.service_model == MANAGED OR remaining_ratio >= 0.20 -> TIER_2
      else -> TIER_3
    input_set: "The BudgetPlan referenced by the line item's Campaign and the Advertiser owning that campaign."
    constants:
      TIER_1_RATIO_MIN: 0.50
      TIER_2_RATIO_MIN: 0.20
    precision: "remaining_ratio compared without rounding; a ratio of exactly 0.50 yields TIER_1 for MANAGED and exactly 0.20 yields TIER_2 for SELF_SERVE"

  - name: second_price_clearing
    trigger: "POST /rmn/auction-events/{id}/award on the RANKED -> AWARDED branch"
    algorithm: threshold
    formula: |
      winner    = the AuctionBid with rank == 1
      runner_up = the AuctionBid with rank == 2, may not exist
      winner_multiplier = (winner.relevance_score ** PlacementSlot.relevance_weight)
                          * TIER_MULTIPLIER[winner line item priority_tier]
      raw = PlacementSlot.floor_cpc_cents when runner_up does not exist
            else (auction.second_best_score / winner_multiplier) + 1
      # ceil is applied to raw exactly once, BEFORE the clamp; clamping first and then
      # ceiling is not the specified order and can differ by one cent.
      clearing_price_cents = max(PlacementSlot.floor_cpc_cents,
                                 min(winner.effective_bid_cents, ceil(raw)))
    input_set: "The two highest-ranked unfiltered AuctionBid rows of the auction; filtered rows never participate."
    constants:
      SECOND_PRICE_INCREMENT_CENTS: 1
    precision: "integer cents; ceil applied once to raw before the max/min clamp"

  - name: auction_settlement_amount
    trigger: "POST /rmn/auction-events/{id}/settle on the AWARDED -> SETTLED branch"
    algorithm: aggregation
    formula: |
      bid_type = winning LineItem.bid_type
      if bid_type == CPC:
        billable = EngagementEvent rows with auction_event_id == auction.id AND event_type == CLICK
        settled_spend_cents = auction.clearing_price_cents * count(billable)
        each billable event billable_cents = auction.clearing_price_cents
        every non-billable event billable_cents = 0
      if bid_type == CPM:
        billable = EngagementEvent rows with auction_event_id == auction.id
                   AND event_type IN {IMPRESSION, OFFSITE_VIEW}
        # sum-then-round is pinned at the auction level
        settled_spend_cents = round_half_up(auction.clearing_price_cents * count(billable) / 1000)
        per_event_floor = floor(auction.clearing_price_cents / 1000)
        remainder = settled_spend_cents - per_event_floor * count(billable)
        each billable event billable_cents = per_event_floor, and the remainder cents are
        added one cent at a time to the billable events ordered by occurred_at ASC, then by
        created_at ASC (never by id), until the remainder is exhausted
      NO_FILL auctions settle at settled_spend_cents = 0 with no per-event billing.
    input_set: "EngagementEvent rows attached to this auction only; events on other auctions of the same line item are excluded."
    constants:
      CPM_DIVISOR: 1000
    precision: "integer cents; the auction total is rounded once from the aggregate product, then distributed to events with an explicit remainder waterfall"

  - name: attributed_sales_credit
    trigger: "POST /rmn/attributed-sales (ingestion) and every recomputation of Campaign.attributed_revenue_cents"
    algorithm: projection
    formula: |
      E = EngagementEvent(sale.engagement_event_id); L = LineItem(E.line_item_id); C = Campaign(L.campaign_id)
      window_hours   = C.attribution_window_days * 24
      within_window  = sale.occurred_at >= E.occurred_at
                       AND (sale.occurred_at - E.occurred_at) < window_hours
      match_type     = CLICK_THROUGH when E.event_type == CLICK else VIEW_THROUGH
      candidates     = EngagementEvent rows with shopper_hash == sale.shopper_hash_of_E
                       AND catalog_product_id == sale.catalog_product_id
                       AND occurred_at inside [sale.occurred_at - window_hours, sale.occurred_at]
                       AND line_item_id belongs to a Campaign whose delivery_status != REJECTED
      if not within_window: attribution_weight = 0.0 and attributed_credit_cents = 0
      # --- VARIANT SELECTION on C.attribution_model ---------------------------
      LAST_TOUCH:
        credited = the candidate with the greatest occurred_at; ties broken by event_type in
                   the fixed order CLICK, OFFSITE_VIEW, IMPRESSION, then by created_at ASC
        attribution_weight = 1.0 when E is credited else 0.0
      FRACTIONAL:
        w_i = MATCH_WEIGHT[candidate.event_type] for each candidate
        attribution_weight = round_half_up(MATCH_WEIGHT[E.event_type] / sum(w_i), 4)
      # --- ROUNDING ORDER (PINNED) --------------------------------------------
      attributed_credit_cents = round_half_up(sale.sale_cents * attribution_weight)
      Campaign.attributed_revenue_cents = sum of the already-rounded attributed_credit_cents
        over AttributedSale rows on the campaign's line items with restated == false.
        Rounding per AttributedSale row FIRST and summing the rounded values SECOND is the
        specified order; summing the unrounded products and rounding once at the campaign
        level is a different figure and is NOT the specified behavior.
    input_set: "AttributedSale rows whose line item belongs to the campaign and whose restated flag is false. Rows with within_window == false contribute 0 and are still persisted."
    constants:
      MATCH_WEIGHT_CLICK: 1.0
      MATCH_WEIGHT_OFFSITE_VIEW: 0.4
      MATCH_WEIGHT_IMPRESSION: 0.2
    precision: "attribution_weight to 4 decimals round_half_up; attributed_credit_cents integer cents round_half_up; per-row rounding precedes summation"
    variants:
      - name: LAST_TOUCH
        when: "Campaign.attribution_model == LAST_TOUCH"
        difference: "All credit lands on the single latest qualifying engagement; every other engagement on the same shopper and product receives 0, so one AttributedSale row carries the whole sale_cents and the rest carry 0."
      - name: FRACTIONAL
        when: "Campaign.attribution_model == FRACTIONAL"
        difference: "Credit is split across all qualifying engagements in proportion to MATCH_WEIGHT, so identical engagement and sale data produce a strictly smaller per-row credit and a campaign total that differs from LAST_TOUCH by the rounding of every split share."

  - name: incremental_sales_lift
    trigger: "POST /rmn/incrementality-studies/{id}/measure, and re-measurement after a DATA_DEFECT invalidation"
    algorithm: dual_variant_statistical
    formula: |
      exposed_rate = study.exposed_conversions / study.exposed_group_size
      control_rate = study.control_conversions / study.control_group_size
      # --- VARIANT SELECTION on study.design_method ---------------------------
      GEO_HOLDOUT (rate-ratio basis):
        lift_pct = 1.0000 when control_rate == 0
                   else round_half_up((exposed_rate / control_rate) - 1.0, 4)
        incremental_sales_cents = round_half_up(
                   study.exposed_sales_cents * (lift_pct / (1.0 + lift_pct)))
                   when lift_pct > 0, else 0
      USER_HOLDOUT (scaled-control-difference basis):
        scaled_control_sales = study.control_sales_cents
                               * (study.exposed_group_size / study.control_group_size)
        incremental_sales_cents = round_half_up(
                   max(0, study.exposed_sales_cents - scaled_control_sales))
        lift_pct = 1.0000 when scaled_control_sales == 0
                   else round_half_up((study.exposed_sales_cents - scaled_control_sales)
                                      / scaled_control_sales, 4)
      significance_score = round_half_up(
                   abs(exposed_rate - control_rate) * sqrt(min(study.exposed_group_size,
                                                               study.control_group_size)), 4)
      significance_flag  = significance_score >= SIGNIFICANCE_MIN
      Campaign.incremental_revenue_cents = incremental_sales_cents of the PUBLISHED study on
      that campaign with the greatest window_end_at; ties broken by created_at ASC; 0 when
      the campaign has no PUBLISHED study.
    input_set: "Only the study's own cohort counters. Studies with study_status == INVALIDATED never feed Campaign.incremental_revenue_cents."
    constants:
      SIGNIFICANCE_MIN: 1.96
    precision: "lift_pct and significance_score to 4 decimals round_half_up; incremental_sales_cents integer cents round_half_up"
    variants:
      - name: GEO_HOLDOUT
        when: "study.design_method == GEO_HOLDOUT"
        difference: "Incremental sales are derived from the conversion-rate ratio and applied multiplicatively to exposed sales, so cohort size imbalance does not enter the sales figure at all."
      - name: USER_HOLDOUT
        when: "study.design_method == USER_HOLDOUT"
        difference: "Incremental sales are the exposed sales minus the control sales rescaled by the cohort size ratio, so identical counters yield a different incremental_sales_cents than GEO_HOLDOUT whenever the exposed and control conversion rates differ from the exposed and control sales ratio."

  - name: offsite_spend_reconciliation
    trigger: "POST /rmn/campaigns/{id}/offsite-reconciliation, and re-evaluated at invoice issuance"
    algorithm: threshold
    formula: |
      logged_offsite_cents = sum of AuctionEvent.settled_spend_cents over AuctionEvent rows
        with status == SETTLED whose placement_slot_id resolves to a PlacementSlot with
        channel == OFFSITE and whose winning_line_item_id belongs to this campaign
      offsite_variance_pct =
        0.00   when logged_offsite_cents == 0 AND campaign.offsite_reported_spend_cents == 0
        100.00 when logged_offsite_cents == 0 AND campaign.offsite_reported_spend_cents > 0
        else round_half_up(((campaign.offsite_reported_spend_cents - logged_offsite_cents)
                            / logged_offsite_cents) * 100, 2)
      # --- BASIS SELECTION (dual variant) -------------------------------------
      basis = LOGGED_BASIS   when abs(offsite_variance_pct) >= VARIANCE_TOLERANCE_PCT
              REPORTED_BASIS when abs(offsite_variance_pct) <  VARIANCE_TOLERANCE_PCT
      Invoice.offsite_spend_cents contribution for this campaign =
              logged_offsite_cents                       under LOGGED_BASIS
              campaign.offsite_reported_spend_cents      under REPORTED_BASIS
      Invoice.variance_pct = the maximum abs(offsite_variance_pct) over the plan's campaigns;
      ties broken by campaign.created_at ASC.
    input_set: "SETTLED auctions on OFFSITE slots only; ONSITE auctions never enter logged_offsite_cents. Campaign rows with delivery_status == REJECTED are excluded from the invoice roll-up."
    constants:
      VARIANCE_TOLERANCE_PCT: 2.00
    precision: "offsite_variance_pct to 2 decimals round_half_up; a variance of exactly 2.00 selects LOGGED_BASIS"
    variants:
      - name: LOGGED_BASIS
        when: "abs(offsite_variance_pct) >= 2.00"
        difference: "Billing falls back to the retailer's own auction ledger, so the invoice ignores the platform-reported figure entirely and the advertiser is billed less than reported when the platform over-reported."
      - name: REPORTED_BASIS
        when: "abs(offsite_variance_pct) < 2.00"
        difference: "Billing accepts the platform-reported figure, so for identical auction data an invoice can differ from the LOGGED_BASIS result by the whole reported-minus-logged delta."

  - name: invoice_settlement_waterfall
    trigger: "POST /rmn/invoices/{id}/issue and POST /rmn/invoices/{id}/adjust"
    algorithm: waterfall_allocation
    formula: |
      # STEPS MUST BE EVALUATED IN THIS ORDER. The tier lookup in STEP 7 is keyed on
      # billable_before_funds, NOT on net_cash_due_cents; keying it on the cash figure
      # would make the deduction depend on itself. This ordering is the pinned resolution
      # of that apparent circularity.
      STEP 1  onsite_spend_cents = sum of AuctionEvent.settled_spend_cents over SETTLED
              auctions on ONSITE slots whose winning line item belongs to a Campaign with
              budget_plan_id == invoice.budget_plan_id and whose requested_at falls in
              [first instant of invoice.billing_period_code, first instant of the next month)
      STEP 2  offsite_spend_cents = sum over those campaigns of the basis chosen by
              offsite_spend_reconciliation
      STEP 3  gross_spend_cents = onsite_spend_cents + offsite_spend_cents
      STEP 4  managed_service_fee_cents = round_half_up(
                gross_spend_cents * Advertiser.managed_service_fee_pct)
      STEP 5  dispute_credit_cents = sum of approved_credit_cents over MeasurementDispute
              rows on this invoice with dispute_status == UPHELD
      STEP 6  billable_before_funds = max(0, gross_spend_cents + managed_service_fee_cents
                                             - dispute_credit_cents)
      STEP 7  deduction_tier_pct = 0.20 when billable_before_funds < 1000000
                                   0.35 when 1000000 <= billable_before_funds < 5000000
                                   0.50 when billable_before_funds >= 5000000
      STEP 8  deduction_ceiling = min(
                round_half_up(gross_spend_cents * TradeFundAccount.deduction_cap_pct),
                round_half_up(billable_before_funds * deduction_tier_pct),
                TradeFundAccount.available_cents,
                BudgetPlan.trade_fund_share_cents - (sum of trade_fund_deduction_cents over
                  other Invoice rows on the same budget_plan_id with invoice_status IN
                  {ISSUED, DISPUTED, ADJUSTED, SETTLED}))
      STEP 9  trade_fund_deduction_cents = max(0, deduction_ceiling)
              (0 when invoice.trade_fund_account_id is null)
      STEP 10 net_cash_due_cents = max(0, billable_before_funds - trade_fund_deduction_cents)
    input_set: "SETTLED auctions inside the billing month for campaigns on the invoice's budget plan; UPHELD disputes on this invoice only. NO_FILL auctions contribute 0."
    constants:
      DEDUCTION_TIER_1_MAX_CENTS: 1000000
      DEDUCTION_TIER_2_MAX_CENTS: 5000000
      DEDUCTION_TIER_1_PCT: 0.20
      DEDUCTION_TIER_2_PCT: 0.35
      DEDUCTION_TIER_3_PCT: 0.50
      NET_TERMS_DAYS: 30
      DISPUTE_GRACE_DAYS: 15
      WRITE_OFF_DAYS: 60
      MAX_ADJUSTMENT_ROUNDS: 2
    precision: "integer cents throughout; each round_half_up inside STEP 4 and STEP 8 is applied to that step's product before the min in STEP 8, never to the final min result"

  - name: campaign_pacing_allowance
    trigger: "POST /_ops/run-daily-checkpoint, every AuctionEvent settlement, and Campaign SCHEDULED -> DELIVERING / PAUSED -> DELIVERING"
    algorithm: waterfall_allocation
    formula: |
      total_days   = whole 24h periods in [campaign.flight_start_at, campaign.flight_end_at)
      elapsed_days = max(0, whole 24h periods in [campaign.flight_start_at, clock_now))
                     clipped above at total_days
      ideal_spend_cents = 0 when total_days == 0
                          else round_half_up(campaign.allocated_budget_cents
                                             * (elapsed_days / total_days))
      pacing_index = 0.0000 when ideal_spend_cents == 0
                     else round_half_up(campaign.delivered_spend_cents / ideal_spend_cents, 4)
      remaining_days   = max(1, total_days - elapsed_days)
      remaining_budget = max(0, campaign.allocated_budget_cents - campaign.delivered_spend_cents)
      base_allowance = floor(remaining_budget / remaining_days)  when pacing_mode == EVEN
                       remaining_budget                          when pacing_mode == ACCELERATED
      catchup_applied = pacing_mode == EVEN AND pacing_index < PACING_CATCHUP_THRESHOLD
      daily_allowance_cents = min(campaign.daily_cap_cents,
                                  floor(base_allowance * PACING_CATCHUP_FACTOR)
                                    when catchup_applied else base_allowance)
    input_set: "The campaign's own delivered_spend_cents (SETTLED auctions only) and allocated_budget_cents; off-site reported spend does NOT feed pacing."
    constants:
      PACING_CATCHUP_THRESHOLD: 0.80
      PACING_CATCHUP_FACTOR: 1.25
    precision: "pacing_index to 4 decimals round_half_up; allowance in integer cents with floor applied before the daily_cap_cents clamp; a pacing_index of exactly 0.8000 does NOT trigger catch-up"

  - name: slot_occupancy_overlap
    trigger: "POST /rmn/line-items and POST /rmn/line-items/{id}/eligibility-decision with decision=APPROVE"
    algorithm: interval_merge
    formula: |
      # GEOMETRY: half-open intervals [flight_start_at, flight_end_at).
      # Two windows A and B overlap iff A.start < B.end AND B.start < A.end.
      # Adjacency is therefore NOT a collision: A.end == B.start is allowed.
      occupying = LineItem rows on the same placement_slot_id with line_item_status IN
                  {ELIGIBLE, SERVING, OOS_PAUSED, MANUAL_PAUSED}, excluding the candidate itself
      # RULE A — aggregate capacity (applies to every slot regardless of channel)
      overlap_count = count of rows in `occupying` whose window overlaps the candidate window
      capacity_ok   = overlap_count < PlacementSlot.max_concurrent_line_items
      # RULE B — category exclusivity (applies only when the slot names a category)
      exclusivity_ok = true when PlacementSlot.exclusivity_category_code is null
                       OR PlacementSlot.exclusivity_category_code != candidate.category_code
                       else no row in `occupying` overlapping the candidate window has
                            category_code == candidate.category_code
      # RULE C — OFFSITE adjacency buffer (applies only when channel == OFFSITE and
      # buffer_minutes > 0). The candidate window is inflated by buffer_minutes on BOTH
      # sides before the overlap predicate is applied, so touching and near-touching
      # windows DO collide under this rule even though they pass RULE A.
      buffered_start = candidate.flight_start_at - buffer_minutes
      buffered_end   = candidate.flight_end_at   + buffer_minutes
      buffer_ok = true when PlacementSlot.channel == ONSITE OR buffer_minutes == 0
                  else no row in `occupying` overlaps [buffered_start, buffered_end)
      PlacementSlot.occupancy_count = count of rows in `occupying` (window-independent)
    input_set: "LineItem rows on the same slot in an occupying status; DRAFT, PENDING_ELIGIBILITY, REJECTED and ENDED rows are excluded from all three rules."
    constants:
      OVERLAP_SEMANTICS: "half_open_start_inclusive_end_exclusive"
    precision: "timestamp comparison at millisecond resolution; buffer_minutes converted to whole minutes before inflation"

  - name: study_window_washout
    trigger: "POST /rmn/incrementality-studies and POST /rmn/incrementality-studies/{id}/start"
    algorithm: interval_merge
    formula: |
      # GEOMETRY: gap-based, NOT plain overlap. Two measurement windows on the same
      # campaign collide when the clear gap between them is strictly less than
      # WASHOUT_DAYS, so even fully disjoint windows separated by 3 days collide.
      others = IncrementalityStudy rows with the same campaign_id and study_status IN
               {RUNNING, MEASURING, PUBLISHED}, excluding the candidate itself
      for each other O:
        gap_hours = (candidate.window_start_at - O.window_end_at) in hours when
                    candidate.window_start_at >= O.window_end_at
                    (O.window_start_at - candidate.window_end_at) in hours when
                    O.window_start_at >= candidate.window_end_at
                    else -1 (the windows genuinely overlap)
        collides = gap_hours < WASHOUT_DAYS * 24
      washout_ok = no O collides
      # A candidate carrying supersedes_study_id == O.id is EXEMPT from the washout rule
      # against that single O, because a restatement deliberately re-measures the same window.
    input_set: "IncrementalityStudy rows on the same campaign in RUNNING, MEASURING or PUBLISHED. DESIGNED and INVALIDATED studies never block a new window."
    constants:
      WASHOUT_DAYS: 7
    precision: "gap measured in whole hours; a gap of exactly 168 hours passes (>= comparison against WASHOUT_DAYS * 24)"

  - name: dispute_sla_clock
    trigger: "POST /rmn/measurement-disputes (filing), every review transition, and POST /_ops/run-daily-checkpoint"
    algorithm: threshold
    formula: |
      base_hours = SLA_BASE_HOURS[dispute.dispute_category]
      managed_reduction = 24 when Advertiser.service_model == MANAGED else 0
      sla_response_hours = max(SLA_FLOOR_HOURS,
                               base_hours - managed_reduction
                               + INFO_REQUEST_EXTENSION_HOURS * dispute.info_request_count)
      sla_due_at = dispute.filed_at + sla_response_hours hours
      # BOUNDARY ASYMMETRY (deliberate):
      #   a first response landing exactly AT sla_due_at is NOT a breach (strict >)
      #   an absent first response with clock_now exactly AT sla_due_at IS a breach (>=)
      sla_breached = true when dispute.first_response_at is not null
                          AND dispute.first_response_at > sla_due_at
                     true when dispute.first_response_at is null
                          AND clock_now >= sla_due_at
                     else false
    input_set: "The dispute's own filed_at, info_request_count and first_response_at, plus the service_model of the Advertiser owning the disputed invoice."
    constants:
      SLA_BASE_HOURS_IMPRESSION_DISCREPANCY: 72
      SLA_BASE_HOURS_ATTRIBUTION_WINDOW: 120
      SLA_BASE_HOURS_OFFSITE_SPEND_VARIANCE: 96
      SLA_BASE_HOURS_INCREMENTALITY_RESTATEMENT: 240
      INFO_REQUEST_EXTENSION_HOURS: 48
      SLA_FLOOR_HOURS: 24
      MAX_INFO_REQUESTS: 2
    precision: "whole hours; sla_due_at stored as ISO 8601 UTC with three fractional digits"

  - name: dispute_credit_award
    trigger: "POST /rmn/measurement-disputes/{id}/resolve with decision=UPHOLD"
    algorithm: threshold
    formula: |
      C = Campaign of dispute.line_item_id (null when line_item_id is null)
      evidence_cap =
        IMPRESSION_DISCREPANCY     -> round_half_up(invoice.onsite_spend_cents * 0.25)
        ATTRIBUTION_WINDOW         -> sum of attributed_credit_cents over AttributedSale rows
                                      with line_item_id == dispute.line_item_id and
                                      within_window == false
        OFFSITE_SPEND_VARIANCE     -> max(0, C.offsite_reported_spend_cents
                                             - logged_offsite_cents(C))
        INCREMENTALITY_RESTATEMENT -> round_half_up(invoice.gross_spend_cents
                                      * (1.0 - min(1.0, C.iroas / IROAS_TARGET)))
      uplift = SLA_BREACH_UPLIFT when dispute.sla_breached == true
                                  AND dispute.escalation_level == 1
               else 1.00
      approved_credit_cents = min(request.approved_credit_amount_cents,
                                  dispute.claimed_amount_cents,
                                  round_half_up(evidence_cap * uplift),
                                  invoice.net_cash_due_cents + invoice.trade_fund_deduction_cents)
      A REJECTED or WITHDRAWN dispute always has approved_credit_cents == 0.
    input_set: "The disputed Invoice's pre-adjustment figures and the AttributedSale / AuctionEvent rows of the disputed line item's campaign only."
    constants:
      IMPRESSION_EVIDENCE_PCT: 0.25
      IROAS_TARGET: 3.0
      SLA_BREACH_UPLIFT: 1.10
    precision: "integer cents; round_half_up applied to evidence_cap * uplift before the outer min, never after"

  - name: budget_plan_available
    trigger: "Every Campaign reservation change, AuctionEvent settlement, off-site spend posting, top-up, and plan close"
    algorithm: aggregation
    formula: |
      reserved_cents = sum of Campaign.allocated_budget_cents over Campaign rows with
                       budget_plan_id == plan.id AND delivery_status IN
                       {SCHEDULED, DELIVERING, PAUSED}
      consumed_cents = sum of AuctionEvent.settled_spend_cents over AuctionEvent rows with
                       status == SETTLED whose winning_line_item_id resolves to a LineItem
                       whose Campaign.budget_plan_id == plan.id
                     + sum of Campaign.offsite_reported_spend_cents over Campaign rows with
                       budget_plan_id == plan.id AND delivery_status != REJECTED
      available_cents = plan.committed_total_cents + plan.top_up_total_cents
                        - reserved_cents - consumed_cents
      # CONSERVATION INVARIANT (budget cents):
      #   committed_total_cents + top_up_total_cents
      #     == available_cents + reserved_cents + consumed_cents
      # must hold after EVERY mutation. A Campaign PENDING_REVIEW -> SCHEDULED reservation
      # followed by its compensating SCHEDULED -> ARCHIVED release must return
      # available_cents to the exact value it held before the reservation.
    input_set: "Campaign rows in a reserving status for reserved_cents; SETTLED auctions and posted off-site spend for consumed_cents. DRAFT, PENDING_REVIEW, COMPLETED, REJECTED and ARCHIVED campaigns reserve nothing."
    constants:
      MIN_TOP_UP_CENTS: 50000
      MAX_REVISION_ROUNDS: 3
    precision: "integer cents; no rounding occurs"

  - name: trade_fund_available
    trigger: "Every accrual, manual deduction, BudgetPlan approval, invoice issuance, invoice adjustment and write-off"
    algorithm: aggregation
    formula: |
      accrued_cents  = cumulative sum of every accrual amount posted to this account
      reserved_cents = sum of BudgetPlan.trade_fund_share_cents over BudgetPlan rows with the
                       same (advertiser_id, fiscal_period_code) AND plan_status IN
                       {APPROVED, ACTIVE}
      deducted_cents = sum of Invoice.trade_fund_deduction_cents over Invoice rows with
                       trade_fund_account_id == account.id AND invoice_status IN
                       {ISSUED, DISPUTED, ADJUSTED, SETTLED}
                     + sum of every manual deduction amount posted to this account
      available_cents = accrued_cents - reserved_cents - deducted_cents
      # CONSERVATION INVARIANT (trade fund cents):
      #   accrued_cents == available_cents + reserved_cents + deducted_cents
      # must hold after EVERY mutation. An Invoice DRAFT -> ISSUED deduction followed by its
      # compensating ISSUED -> WRITTEN_OFF reversal must return available_cents to the exact
      # value it held before issuance, with accrued_cents unchanged throughout.
    input_set: "Accruals and manual deductions on this account, plus invoices referencing it in a non-DRAFT, non-WRITTEN_OFF status. DRAFT and WRITTEN_OFF invoices contribute 0 to deducted_cents."
    constants:
      MIN_ACCRUAL_CENTS: 1000
    precision: "integer cents; available_cents is never allowed to go below 0 by a manual deduction, but invoice issuance may drive it to 0 with the excess capped"

  - name: advertiser_credit_exposure
    trigger: "BudgetPlan approval / close / top-up, Campaign review approval and archive, Invoice issuance / adjustment / settlement / write-off"
    algorithm: aggregation
    formula: |
      plan_exposure = sum of BudgetPlan.committed_total_cents over BudgetPlan rows with
                      advertiser_id == advertiser.id AND plan_status IN
                      {APPROVED, ACTIVE, EXHAUSTED}
      invoice_exposure = sum of Invoice.net_cash_due_cents over Invoice rows with
                      advertiser_id == advertiser.id AND invoice_status IN
                      {ISSUED, DISPUTED, ADJUSTED}
      credit_exposure_cents = plan_exposure + invoice_exposure
      effective_limit_cents = Advertiser(parent_advertiser_id).credit_limit_cents when
                              advertiser.parent_advertiser_id is not null
                              else advertiser.credit_limit_cents
      dispute_credit_balance_cents = sum of MeasurementDispute.approved_credit_cents over
                              disputes with dispute_status == UPHELD whose Invoice has
                              advertiser_id == advertiser.id AND invoice_status != SETTLED
    input_set: "Own BudgetPlan and Invoice rows in the listed statuses only; child advertisers do NOT roll up into a parent's exposure, but a child evaluates its limit against the parent's credit_limit_cents."
    constants:
      MIN_APPROVAL_CREDIT_LIMIT_CENTS: 100000
    precision: "integer cents; no rounding occurs"

  - name: line_item_reservation
    trigger: "LineItem PENDING_ELIGIBILITY -> ELIGIBLE and every subsequent flight-window change"
    algorithm: aggregation
    formula: |
      flight_days     = whole 24h periods in [line_item.flight_start_at, line_item.flight_end_at)
      reserved_cents  = line_item.daily_budget_cents * max(1, flight_days)
      eligible_product_count = count of ProductAssignment rows with line_item_id ==
                        line_item.id AND assignment_status == ACTIVE whose CatalogProduct
                        has eligibility_status == ELIGIBLE
      spend_cents     = sum of AuctionEvent.settled_spend_cents over AuctionEvent rows with
                        status == SETTLED AND winning_line_item_id == line_item.id
    input_set: "Own ProductAssignment rows in ACTIVE status with an ELIGIBLE product; PAUSED_OOS, PAUSED_RESTRICTED and REMOVED assignments count 0."
    constants:
      MIN_FLIGHT_DAYS: 1
    precision: "integer cents; a flight shorter than 24h reserves exactly one day of daily_budget_cents"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST failing row determines the response error_id and status)
# =============================================================================
validations:
  - { priority: 1,  category: auth, check: "X-User-Role and X-User-ID headers are both present and non-blank", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth, check: "X-User-Role is one of NetworkAdmin, AccountManager, AdvertiserUser, CreditAnalyst, MeasurementAnalyst, BillingOps, CatalogOps, AuctionService", error_id: ERR_UNKNOWN_ROLE, http_status: 401, applies_to: "all" }
  - { priority: 3,  category: auth, check: "The acting role appears in the endpoint's roles list", error_id: ERR_ROLE_NOT_PERMITTED, http_status: 403, applies_to: "all" }
  - { priority: 4,  category: auth, check: "When X-User-Role == AdvertiserUser, X-User-ID equals the Advertiser.id that owns the targeted resource, resolved through campaign_id -> Campaign.advertiser_id, line_item_id -> Campaign.advertiser_id, invoice_id -> Invoice.advertiser_id or budget_plan_id -> BudgetPlan.advertiser_id", error_id: ERR_NOT_RESOURCE_OWNER, http_status: 403, applies_to: "every endpoint whose roles include AdvertiserUser" }
  - { priority: 5,  category: business_constraint, check: "Request body contains every required input field with the declared type; enum fields carry a declared member; integer cent fields are >= their stated minimum", error_id: ERR_VALIDATION, http_status: 422, applies_to: "all POST, PUT, PATCH" }
  - { priority: 6,  category: business_constraint, check: "limit is an integer in [1, 100] and offset is an integer >= 0", error_id: ERR_INVALID_PAGINATION, http_status: 400, applies_to: "all list GET endpoints" }
  - { priority: 7,  category: existence, check: "Advertiser id in the path or in advertiser_id / parent_advertiser_id exists", error_id: ERR_ADVERTISER_NOT_FOUND, http_status: 404, applies_to: "all endpoints referencing an advertiser" }
  - { priority: 8,  category: existence, check: "BudgetPlan id in the path or in budget_plan_id exists", error_id: ERR_BUDGET_PLAN_NOT_FOUND, http_status: 404, applies_to: "all endpoints referencing a budget plan" }
  - { priority: 9,  category: existence, check: "TradeFundAccount id in the path or in trade_fund_account_id exists", error_id: ERR_TRADE_FUND_ACCOUNT_NOT_FOUND, http_status: 404, applies_to: "all endpoints referencing a trade fund account" }
  - { priority: 10, category: existence, check: "Campaign id in the path or in campaign_id exists", error_id: ERR_CAMPAIGN_NOT_FOUND, http_status: 404, applies_to: "all endpoints referencing a campaign" }
  - { priority: 11, category: existence, check: "PlacementSlot id in the path or in placement_slot_id exists", error_id: ERR_PLACEMENT_SLOT_NOT_FOUND, http_status: 404, applies_to: "all endpoints referencing a placement slot" }
  - { priority: 12, category: existence, check: "LineItem id in the path or in line_item_id exists", error_id: ERR_LINE_ITEM_NOT_FOUND, http_status: 404, applies_to: "all endpoints referencing a line item" }
  - { priority: 13, category: existence, check: "CatalogProduct id in the path or in catalog_product_id exists", error_id: ERR_CATALOG_PRODUCT_NOT_FOUND, http_status: 404, applies_to: "all endpoints referencing a catalog product" }
  - { priority: 14, category: existence, check: "ProductAssignment id in the path exists", error_id: ERR_PRODUCT_ASSIGNMENT_NOT_FOUND, http_status: 404, applies_to: "GET and DELETE /rmn/product-assignments/{id}" }
  - { priority: 15, category: existence, check: "AuctionEvent id in the path or in auction_event_id exists", error_id: ERR_AUCTION_EVENT_NOT_FOUND, http_status: 404, applies_to: "all endpoints referencing an auction event" }
  - { priority: 16, category: existence, check: "EngagementEvent id in the path or in engagement_event_id exists", error_id: ERR_ENGAGEMENT_EVENT_NOT_FOUND, http_status: 404, applies_to: "GET /rmn/engagement-events/{id}, POST /rmn/attributed-sales" }
  - { priority: 17, category: existence, check: "IncrementalityStudy id in the path or in supersedes_study_id exists", error_id: ERR_STUDY_NOT_FOUND, http_status: 404, applies_to: "all endpoints referencing a study" }
  - { priority: 18, category: existence, check: "Invoice id in the path or in invoice_id exists", error_id: ERR_INVOICE_NOT_FOUND, http_status: 404, applies_to: "all endpoints referencing an invoice" }
  - { priority: 19, category: existence, check: "MeasurementDispute id in the path exists", error_id: ERR_DISPUTE_NOT_FOUND, http_status: 404, applies_to: "all /rmn/measurement-disputes/{id}/* endpoints" }
  - { priority: 20, category: state, check: "expected_advertiser_version equals the current Advertiser.version", error_id: ERR_STALE_ADVERTISER_VERSION, http_status: 412, applies_to: "POST /rmn/budget-plans" }
  - { priority: 21, category: state, check: "expected_campaign_version equals the current Campaign.version", error_id: ERR_STALE_CAMPAIGN_VERSION, http_status: 412, applies_to: "POST /rmn/line-items, POST /rmn/incrementality-studies" }
  - { priority: 22, category: state, check: "expected_line_item_version equals the current LineItem.version", error_id: ERR_STALE_LINE_ITEM_VERSION, http_status: 412, applies_to: "POST /rmn/product-assignments" }
  - { priority: 23, category: state, check: "expected_trade_fund_account_version equals the current TradeFundAccount.version", error_id: ERR_STALE_TRADE_FUND_VERSION, http_status: 412, applies_to: "POST /rmn/trade-fund-accounts/{id}/deductions" }
  - { priority: 24, category: state, check: "expected_invoice_version equals the current Invoice.version", error_id: ERR_STALE_INVOICE_VERSION, http_status: 412, applies_to: "POST /rmn/measurement-disputes" }
  - { priority: 25, category: state, check: "The targeted Advertiser has onboarding_status NOT IN {REJECTED, TERMINATED}", error_id: ERR_ADVERTISER_TERMINATED, http_status: 409, applies_to: "every mutating endpoint that resolves to an advertiser" }
  - { priority: 26, category: state, check: "The requested Advertiser onboarding transition is declared in §1.2 for the current onboarding_status", error_id: ERR_INVALID_ONBOARDING_TRANSITION, http_status: 409, applies_to: "POST /rmn/advertisers/{id}/submit-onboarding, kyc-decision, suspend, reinstate, terminate" }
  - { priority: 27, category: state, check: "Advertiser.onboarding_status == ACTIVE where the transition requires an active advertiser (budget plan approval, campaign review approval, line item activation, campaign resume, study start)", error_id: ERR_ADVERTISER_NOT_ACTIVE, http_status: 409, applies_to: "POST /rmn/budget-plans/{id}/approve, /rmn/campaigns/{id}/review-decision, /rmn/campaigns/{id}/resume, /rmn/line-items/{id}/activate, /rmn/incrementality-studies/{id}/start" }
  - { priority: 28, category: state, check: "The requested BudgetPlan transition is declared for the current plan_status", error_id: ERR_PLAN_INVALID_STATE, http_status: 409, applies_to: "POST /rmn/budget-plans/{id}/submit, approve, return-for-revision, top-up, close" }
  - { priority: 29, category: state, check: "BudgetPlan.plan_status IN {APPROVED, ACTIVE} when a campaign is submitted for review, and == ACTIVE when a campaign is resumed or a line item activated", error_id: ERR_PLAN_NOT_FUNDABLE, http_status: 409, applies_to: "POST /rmn/campaigns/{id}/submit-for-review, /rmn/campaigns/{id}/resume, /rmn/line-items/{id}/activate" }
  - { priority: 30, category: state, check: "The requested Campaign delivery transition is declared for the current delivery_status", error_id: ERR_INVALID_CAMPAIGN_TRANSITION, http_status: 409, applies_to: "POST /rmn/campaigns/{id}/submit-for-review, review-decision, pause, resume, complete, archive" }
  - { priority: 31, category: state, check: "Campaign.delivery_status == DELIVERING when a line item is activated or resumed", error_id: ERR_CAMPAIGN_NOT_DELIVERING, http_status: 409, applies_to: "POST /rmn/line-items/{id}/activate, POST /rmn/line-items/{id}/resume" }
  - { priority: 32, category: state, check: "The requested LineItem transition is declared for the current line_item_status", error_id: ERR_LINE_ITEM_INVALID_STATE, http_status: 409, applies_to: "POST /rmn/line-items/{id}/submit-eligibility, eligibility-decision, activate, pause, resume, end" }
  - { priority: 33, category: state, check: "PlacementSlot.slot_status == OPEN when a line item is approved for eligibility or an auction is opened on the slot; a RETIRED slot can never be reopened", error_id: ERR_SLOT_NOT_OPEN, http_status: 409, applies_to: "POST /rmn/line-items/{id}/eligibility-decision, POST /rmn/auction-events, PATCH /rmn/placement-slots/{id}" }
  - { priority: 34, category: state, check: "CatalogProduct.eligibility_status != DELISTED for any assignment, restrict, reinstate or stock adjustment", error_id: ERR_PRODUCT_DELISTED, http_status: 409, applies_to: "POST /rmn/product-assignments, POST /rmn/catalog-products/{id}/stock-adjustments, restrict, reinstate, delist" }
  - { priority: 35, category: state, check: "The requested AuctionEvent transition is declared for the current status; ranking requires OPEN, awarding requires RANKED, settling requires AWARDED or NO_FILL", error_id: ERR_AUCTION_INVALID_STATE, http_status: 409, applies_to: "POST /rmn/auction-events/{id}/rank, award, settle" }
  - { priority: 36, category: state, check: "The requested IncrementalityStudy transition is declared for the current study_status", error_id: ERR_STUDY_INVALID_STATE, http_status: 409, applies_to: "POST /rmn/incrementality-studies/{id}/start, measure, publish, invalidate" }
  - { priority: 37, category: state, check: "The requested Invoice transition is declared for the current invoice_status", error_id: ERR_INVOICE_INVALID_STATE, http_status: 409, applies_to: "POST /rmn/invoices/{id}/issue, adjust, settle, write-off" }
  - { priority: 38, category: state, check: "The requested MeasurementDispute transition is declared for the current dispute_status", error_id: ERR_DISPUTE_INVALID_STATE, http_status: 409, applies_to: "POST /rmn/measurement-disputes/{id}/start-review, request-info, provide-info, resolve, withdraw" }
  - { priority: 39, category: state, check: "TradeFundAccount.account_status == OPEN for accruals, manual deductions and invoice issuance drawing on the pool; FROZEN, RECONCILING and CLOSED all reject", error_id: ERR_TRADE_FUND_FROZEN, http_status: 409, applies_to: "POST /rmn/trade-fund-accounts/{id}/accruals, deductions, POST /rmn/invoices/{id}/issue" }
  - { priority: 40, category: business_safety, check: "X-User-ID differs from the operator recorded for the preceding step: onboarding_submitted_by_user_id on kyc-decision, submitted_by_user_id on budget plan approve, submitted_for_review_by_user_id on campaign review-decision, issued_by_user_id on invoice write-off, and the latest PUBLISHED study's published_by_user_id on an INCREMENTALITY_RESTATEMENT dispute resolve", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /rmn/advertisers/{id}/kyc-decision, /rmn/budget-plans/{id}/approve, /rmn/campaigns/{id}/review-decision, /rmn/invoices/{id}/write-off, /rmn/measurement-disputes/{id}/resolve" }
  - { priority: 41, category: business_safety, check: "Every CatalogProduct referenced by a new ProductAssignment or by a line item being approved for eligibility has eligibility_status == ELIGIBLE; a RESTRICTED product is refused regardless of any other defect in the request", error_id: ERR_PRODUCT_RESTRICTED, http_status: 422, applies_to: "POST /rmn/product-assignments, POST /rmn/line-items/{id}/eligibility-decision" }
  - { priority: 42, category: business_safety, check: "kyc_document_count >= 2 on first onboarding submission and >= 3 on a re-submission from CREDIT_HOLD", error_id: ERR_KYC_DOCUMENTS_INSUFFICIENT, http_status: 422, applies_to: "POST /rmn/advertisers/{id}/submit-onboarding" }
  - { priority: 43, category: business_safety, check: "A MeasurementDispute with sla_breached == true and escalation_level == 1 cannot be resolved with decision=REJECT", error_id: ERR_SLA_BREACH_REJECTION_FORBIDDEN, http_status: 409, applies_to: "POST /rmn/measurement-disputes/{id}/resolve" }
  - { priority: 44, category: business_safety, check: "IncrementalityStudy.significance_flag == true before publication", error_id: ERR_STUDY_NOT_SIGNIFICANT, http_status: 422, applies_to: "POST /rmn/incrementality-studies/{id}/publish" }
  - { priority: 45, category: business_safety, check: "A SELF_SERVE advertiser carries managed_service_fee_pct == 0.0 and account_manager_user_id == null; a MANAGED advertiser carries a non-null account_manager_user_id", error_id: ERR_SERVICE_MODEL_CONFLICT, http_status: 422, applies_to: "POST /rmn/advertisers, PATCH /rmn/advertisers/{id}" }
  - { priority: 46, category: business_temporal, check: "LineItem [flight_start_at, flight_end_at) lies entirely inside the owning Campaign [flight_start_at, flight_end_at), with flight_start_at strictly before flight_end_at", error_id: ERR_FLIGHT_WINDOW_OUTSIDE_CAMPAIGN, http_status: 422, applies_to: "POST /rmn/line-items" }
  - { priority: 47, category: business_temporal, check: "Campaign [flight_start_at, flight_end_at) lies entirely inside the BudgetPlan [window_start_at, window_end_at)", error_id: ERR_FLIGHT_WINDOW_OUTSIDE_PLAN, http_status: 422, applies_to: "POST /rmn/campaigns" }
  - { priority: 48, category: business_temporal, check: "No other BudgetPlan of the same advertiser with plan_status IN {APPROVED, ACTIVE} has a window overlapping the plan window under half-open semantics", error_id: ERR_PLAN_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /rmn/budget-plans/{id}/approve" }
  - { priority: 49, category: business_temporal, check: "EngagementEvent.occurred_at lies inside the winning line item [flight_start_at, flight_end_at) and at or after AuctionEvent.requested_at", error_id: ERR_ENGAGEMENT_OUTSIDE_FLIGHT, http_status: 422, applies_to: "POST /rmn/engagement-events" }
  - { priority: 50, category: business_temporal, check: "The study window satisfies study_window_washout against every RUNNING, MEASURING or PUBLISHED study on the same campaign, unless the candidate supersedes that exact study", error_id: ERR_STUDY_WASHOUT_VIOLATION, http_status: 409, applies_to: "POST /rmn/incrementality-studies, POST /rmn/incrementality-studies/{id}/start" }
  - { priority: 51, category: business_temporal, check: "clock_now < Invoice.due_at + DISPUTE_GRACE_DAYS when a dispute is filed, and clock_now >= Invoice.due_at + WRITE_OFF_DAYS when an invoice is written off", error_id: ERR_DISPUTE_WINDOW_CLOSED, http_status: 409, applies_to: "POST /rmn/measurement-disputes, POST /rmn/invoices/{id}/write-off" }
  - { priority: 52, category: business_temporal, check: "clock_now >= IncrementalityStudy.window_end_at when measuring, and clock_now >= window_start_at when starting", error_id: ERR_STUDY_WINDOW_NOT_ELAPSED, http_status: 409, applies_to: "POST /rmn/incrementality-studies/{id}/start, POST /rmn/incrementality-studies/{id}/measure" }
  - { priority: 53, category: business_constraint, check: "slot_occupancy_overlap RULE A holds: the number of overlapping occupying line items on the slot is strictly less than max_concurrent_line_items", error_id: ERR_SLOT_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /rmn/line-items/{id}/eligibility-decision" }
  - { priority: 54, category: business_constraint, check: "slot_occupancy_overlap RULE B holds: no overlapping occupying line item on an exclusivity slot shares the candidate's category_code", error_id: ERR_SLOT_CATEGORY_EXCLUSIVE, http_status: 409, applies_to: "POST /rmn/line-items/{id}/eligibility-decision" }
  - { priority: 55, category: business_constraint, check: "slot_occupancy_overlap RULE C holds: on an OFFSITE slot with buffer_minutes > 0, no occupying line item overlaps the candidate window inflated by buffer_minutes on both sides", error_id: ERR_SLOT_BUFFER_CONFLICT, http_status: 409, applies_to: "POST /rmn/line-items/{id}/eligibility-decision" }
  - { priority: 56, category: business_constraint, check: "brand_code is unique across all Advertiser rows", error_id: ERR_DUPLICATE_BRAND_CODE, http_status: 409, applies_to: "POST /rmn/advertisers" }
  - { priority: 57, category: business_constraint, check: "sku is unique across all CatalogProduct rows and slot_code is unique across all PlacementSlot rows", error_id: ERR_DUPLICATE_RESOURCE_CODE, http_status: 409, applies_to: "POST /rmn/catalog-products, POST /rmn/placement-slots" }
  - { priority: 58, category: business_constraint, check: "(advertiser_id, fiscal_period_code) is unique across TradeFundAccount rows", error_id: ERR_DUPLICATE_TRADE_FUND_PERIOD, http_status: 409, applies_to: "POST /rmn/trade-fund-accounts" }
  - { priority: 59, category: business_constraint, check: "(retail_order_ref, catalog_product_id, line_item_id) is unique across AttributedSale rows", error_id: ERR_DUPLICATE_ATTRIBUTED_SALE, http_status: 409, applies_to: "POST /rmn/attributed-sales" }
  - { priority: 60, category: business_constraint, check: "(advertiser_id, billing_period_code) is unique across Invoice rows", error_id: ERR_DUPLICATE_INVOICE_PERIOD, http_status: 409, applies_to: "POST /rmn/invoices" }
  - { priority: 61, category: business_constraint, check: "A line item submitted for eligibility has at least one ProductAssignment with assignment_status == ACTIVE and is_hero == true; removing the last hero assignment from a non-DRAFT line item is refused", error_id: ERR_HERO_ASSIGNMENT_REQUIRED, http_status: 422, applies_to: "POST /rmn/line-items/{id}/submit-eligibility, DELETE /rmn/product-assignments/{id}" }
  - { priority: 62, category: business_constraint, check: "eligible_product_count >= 1 when submitting a line item for eligibility or activating it", error_id: ERR_NO_ELIGIBLE_PRODUCTS, http_status: 422, applies_to: "POST /rmn/line-items/{id}/submit-eligibility, POST /rmn/line-items/{id}/activate" }
  - { priority: 63, category: business_constraint, check: "parent_advertiser_id differs from the advertiser's own id and the referenced parent itself has parent_advertiser_id == null and onboarding_status == ACTIVE", error_id: ERR_PARENT_ADVERTISER_INVALID, http_status: 422, applies_to: "POST /rmn/advertisers, PATCH /rmn/advertisers/{id}" }
  - { priority: 64, category: business_constraint, check: "A campaign with channel_mix == ONSITE_ONLY has no line item on an OFFSITE slot, a campaign with channel_mix == OFFSITE_ONLY has no line item on an ONSITE slot, and an OMNI campaign has at least one line item on each channel before review submission", error_id: ERR_OFFSITE_CHANNEL_MISMATCH, http_status: 422, applies_to: "POST /rmn/line-items, POST /rmn/campaigns/{id}/submit-for-review" }
  - { priority: 65, category: business_constraint, check: "info_request_count < MAX_INFO_REQUESTS before another information request is issued", error_id: ERR_MAX_INFO_REQUESTS_EXCEEDED, http_status: 409, applies_to: "POST /rmn/measurement-disputes/{id}/request-info" }
  - { priority: 66, category: business_constraint, check: "adjustment_round < MAX_ADJUSTMENT_ROUNDS before another adjustment is applied, and revision_round <= MAX_REVISION_ROUNDS on a plan revision", error_id: ERR_MAX_ROUNDS_EXCEEDED, http_status: 409, applies_to: "POST /rmn/invoices/{id}/adjust, POST /rmn/budget-plans/{id}/return-for-revision" }
  - { priority: 67, category: business_referential, check: "All cross-referenced rows resolve to the same Advertiser: a campaign's budget_plan_id belongs to campaign.advertiser_id, a line item's campaign belongs to the acting advertiser, an attributed sale's engagement belongs to the same line item, and an invoice's trade_fund_account_id belongs to invoice.advertiser_id", error_id: ERR_CROSS_ADVERTISER_REFERENCE, http_status: 422, applies_to: "POST /rmn/campaigns, POST /rmn/line-items, POST /rmn/product-assignments, POST /rmn/attributed-sales, POST /rmn/invoices" }
  - { priority: 68, category: business_referential, check: "Invoice.trade_fund_account_id references a TradeFundAccount whose fiscal_period_code equals the BudgetPlan.fiscal_period_code of invoice.budget_plan_id", error_id: ERR_FISCAL_PERIOD_MISMATCH, http_status: 422, applies_to: "POST /rmn/invoices" }
  - { priority: 69, category: business_referential, check: "EngagementEvent.line_item_id equals AuctionEvent.winning_line_item_id of the referenced auction, and catalog_product_id is assigned to that line item with assignment_status == ACTIVE", error_id: ERR_ENGAGEMENT_AUCTION_MISMATCH, http_status: 422, applies_to: "POST /rmn/engagement-events" }
  - { priority: 70, category: business_referential, check: "supersedes_study_id references an IncrementalityStudy on the same campaign_id with study_status == PUBLISHED", error_id: ERR_SUPERSEDED_STUDY_INVALID, http_status: 422, applies_to: "POST /rmn/incrementality-studies" }
  - { priority: 71, category: business_fiscal, check: "trade_fund_share_cents <= committed_total_cents and daily_cap_cents <= allocated_budget_cents; for a SELF_SERVE advertiser daily_cap_cents <= self_serve_daily_spend_cap_cents", error_id: ERR_CAP_EXCEEDS_PARENT_LIMIT, http_status: 422, applies_to: "POST /rmn/budget-plans, POST /rmn/campaigns" }
  - { priority: 72, category: business_fiscal, check: "Campaign.allocated_budget_cents <= BudgetPlan.available_cents at review submission, and LineItem.daily_budget_cents <= BudgetPlan.available_cents at activation and resume", error_id: ERR_PLAN_BUDGET_INSUFFICIENT, http_status: 402, applies_to: "POST /rmn/campaigns/{id}/submit-for-review, POST /rmn/line-items/{id}/activate, POST /rmn/line-items/{id}/resume, POST /rmn/campaigns/{id}/resume" }
  - { priority: 73, category: business_fiscal, check: "credit_exposure_cents + cash_share_cents <= effective_limit_cents at plan approval, where effective_limit_cents is the parent advertiser's credit_limit_cents when parent_advertiser_id is non-null", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /rmn/budget-plans/{id}/approve" }
  - { priority: 74, category: business_fiscal, check: "TradeFundAccount.available_cents >= the requested amount for a manual deduction and >= plan.trade_fund_share_cents at plan submission", error_id: ERR_TRADE_FUND_INSUFFICIENT, http_status: 402, applies_to: "POST /rmn/trade-fund-accounts/{id}/deductions, POST /rmn/budget-plans/{id}/submit" }
  - { priority: 75, category: business_fiscal, check: "top_up_amount_cents >= MIN_TOP_UP_CENTS and accrual_amount_cents >= MIN_ACCRUAL_CENTS", error_id: ERR_AMOUNT_BELOW_MINIMUM, http_status: 422, applies_to: "POST /rmn/budget-plans/{id}/top-up, POST /rmn/trade-fund-accounts/{id}/accruals" }
  - { priority: 76, category: business_fiscal, check: "claimed_amount_cents <= Invoice.net_cash_due_cents + Invoice.trade_fund_deduction_cents at filing", error_id: ERR_CLAIM_EXCEEDS_INVOICE, http_status: 422, applies_to: "POST /rmn/measurement-disputes" }
  - { priority: 77, category: business_fiscal, check: "approved_credit_amount_cents <= dispute.claimed_amount_cents at resolution", error_id: ERR_CREDIT_EXCEEDS_CLAIM, http_status: 422, applies_to: "POST /rmn/measurement-disputes/{id}/resolve" }
  - { priority: 78, category: business_fiscal, check: "paid_amount_cents equals Invoice.net_cash_due_cents exactly", error_id: ERR_SETTLEMENT_AMOUNT_MISMATCH, http_status: 422, applies_to: "POST /rmn/invoices/{id}/settle" }
  - { priority: 79, category: business_fiscal, check: "Invoice.gross_spend_cents >= 1 at issuance; an invoice with nothing to bill cannot be issued", error_id: ERR_NOTHING_TO_INVOICE, http_status: 422, applies_to: "POST /rmn/invoices/{id}/issue" }

# =============================================================================
# §1.5 API Endpoint Table  (flat surface under /rmn; every entity exposes a
# single-resource GET plus a filtered collection GET so every FK in §1.1 is
# reverse-reachable)
# =============================================================================
endpoints:
  # --- test-driving / operational ------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the logical clock used by every window, flight, pacing, SLA and net-terms rule. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default) and never falls back to real wall-clock time."
    roles: [NetworkAdmin]
    code: 200
    input: ["current_utc"]
    output: null
    side_effects: ["sets logical clock_now", "does NOT re-evaluate derived fields; use POST /_ops/run-daily-checkpoint for that"]
  - method: POST
    path: "/_ops/run-daily-checkpoint"
    description: "Deterministic daily sweep at the current logical clock: recomputes campaign_pacing_allowance, refreshes dispute_sla_clock breach flags, closes elapsed flights and exhausts drained budget plans."
    roles: [NetworkAdmin]
    code: 200
    input: ["as_of_date?"]
    output: null
    side_effects: ["recomputes Campaign.pacing_index", "sets MeasurementDispute.sla_breached where the clock has passed sla_due_at with no first_response_at", "transitions Campaign DELIVERING -> COMPLETED where flight_end_at <= clock_now", "transitions BudgetPlan ACTIVE -> EXHAUSTED where available_cents == 0, cascading the EXHAUSTED chain in §1.2"]
  # --- Advertiser -----------------------------------------------------------
  - method: POST
    path: "/rmn/advertisers"
    description: "Registers an advertiser in DRAFT onboarding_status under either the SELF_SERVE or MANAGED service model."
    roles: [NetworkAdmin, AccountManager]
    code: 201
    input: ["legal_name", "brand_code", "service_model", "credit_limit_cents", "parent_advertiser_id?", "account_manager_user_id?", "managed_service_fee_pct?", "self_serve_daily_spend_cap_cents?"]
    output: Advertiser
    side_effects: ["creates Advertiser with onboarding_status=DRAFT, credit_exposure_cents=0, dispute_credit_balance_cents=0, kyc_document_count=0, version=1"]
  - method: GET
    path: "/rmn/advertisers"
    description: "Lists advertisers; filtering by parent_advertiser_id resolves an agency umbrella's child brands."
    roles: [NetworkAdmin, AccountManager, CreditAnalyst, BillingOps, MeasurementAnalyst]
    code: 200
    input: ["parent_advertiser_id?", "onboarding_status?", "service_model?", "brand_code?", "limit?", "offset?"]
    output: Advertiser[]
    side_effects: []
  - method: GET
    path: "/rmn/advertisers/{id}"
    description: "Reads one advertiser including computed credit_exposure_cents and dispute_credit_balance_cents."
    roles: [NetworkAdmin, AccountManager, CreditAnalyst, BillingOps, MeasurementAnalyst, AdvertiserUser]
    code: 200
    input: []
    output: Advertiser
    side_effects: []
  - method: PATCH
    path: "/rmn/advertisers/{id}"
    description: "Amends advertiser commercial terms while onboarding_status is DRAFT, KYC_REVIEW, CREDIT_HOLD or ACTIVE."
    roles: [NetworkAdmin, AccountManager]
    code: 200
    input: ["legal_name?", "service_model?", "credit_limit_cents?", "parent_advertiser_id?", "account_manager_user_id?", "managed_service_fee_pct?", "self_serve_daily_spend_cap_cents?"]
    output: Advertiser
    side_effects: ["recomputes advertiser_credit_exposure headroom", "increments Advertiser.version by 1"]
  - method: POST
    path: "/rmn/advertisers/{id}/submit-onboarding"
    description: "Submits onboarding paperwork, moving DRAFT or CREDIT_HOLD through SUBMITTED into KYC_REVIEW."
    roles: [NetworkAdmin, AccountManager, AdvertiserUser]
    code: 200
    input: ["kyc_document_count"]
    output: Advertiser
    side_effects: ["sets onboarding_submitted_by_user_id to the acting X-User-ID", "sets onboarding_status=KYC_REVIEW", "increments Advertiser.version by 1"]
  - method: POST
    path: "/rmn/advertisers/{id}/kyc-decision"
    description: "Branching KYC fork from KYC_REVIEW: APPROVE -> ACTIVE, HOLD -> CREDIT_HOLD, REJECT -> REJECTED."
    roles: [NetworkAdmin, CreditAnalyst]
    code: 200
    input: ["decision", "decision_note?", "adjusted_credit_limit_cents?"]
    output: Advertiser
    side_effects: ["sets kyc_decided_by_user_id to the acting X-User-ID", "APPROVE opens the advertiser for budget plan approval; HOLD blocks approval until a re-submission carrying >= 3 documents; REJECT is terminal", "increments Advertiser.version by 1"]
  - method: POST
    path: "/rmn/advertisers/{id}/suspend"
    description: "Suspends an ACTIVE advertiser and runs the depth-3 suspension cascade."
    roles: [NetworkAdmin, CreditAnalyst]
    code: 200
    input: ["suspension_reason"]
    output: Advertiser
    side_effects: ["L1: every DELIVERING Campaign of the advertiser -> PAUSED", "L2: every SERVING LineItem of those campaigns -> MANUAL_PAUSED with pause_reason=ADVERTISER_SUSPENDED, releasing LineItem.reserved_cents into BudgetPlan.available_cents", "L3: PlacementSlot.occupancy_count decremented once per released line item", "increments Advertiser.version by 1"]
  - method: POST
    path: "/rmn/advertisers/{id}/reinstate"
    description: "Returns a SUSPENDED advertiser to ACTIVE without automatically resuming any paused campaign."
    roles: [NetworkAdmin, CreditAnalyst]
    code: 200
    input: ["reinstatement_note?"]
    output: Advertiser
    side_effects: ["clears suspension_reason", "campaigns and line items stay paused until explicitly resumed", "increments Advertiser.version by 1"]
  - method: POST
    path: "/rmn/advertisers/{id}/terminate"
    description: "Terminates an advertiser from SUSPENDED, closing every open financial container."
    roles: [NetworkAdmin]
    code: 200
    input: ["termination_reason"]
    output: Advertiser
    side_effects: ["L1: every non-CLOSED BudgetPlan -> CLOSED, releasing reserved_cents", "L2: every OPEN or FROZEN TradeFundAccount -> CLOSED", "L3: every non-ARCHIVED Campaign -> ARCHIVED", "increments Advertiser.version by 1"]
  - method: GET
    path: "/rmn/advertisers/{id}/credit-summary"
    description: "Computed read returning the advertiser_credit_exposure inputs and headroom, including the parent umbrella limit when parent_advertiser_id is non-null."
    roles: [NetworkAdmin, CreditAnalyst, BillingOps, AdvertiserUser]
    code: 200
    input: []
    output: Advertiser
    side_effects: []
  # --- BudgetPlan -----------------------------------------------------------
  - method: POST
    path: "/rmn/budget-plans"
    description: "Opens a DRAFT budget plan for one advertiser and fiscal period, splitting the commitment between trade-fund share and cash share. Optimistically concurrent against the advertiser."
    roles: [NetworkAdmin, AccountManager, AdvertiserUser]
    code: 201
    input: ["advertiser_id", "fiscal_period_code", "committed_total_cents", "trade_fund_share_cents", "window_start_at", "window_end_at", "expected_advertiser_version"]
    output: BudgetPlan
    side_effects: ["creates BudgetPlan with plan_status=DRAFT, cash_share_cents = committed_total_cents - trade_fund_share_cents, reserved_cents=0, consumed_cents=0, top_up_total_cents=0, revision_round=0", "runs budget_plan_available so available_cents == committed_total_cents", "increments Advertiser.version by 1"]
  - method: GET
    path: "/rmn/budget-plans"
    description: "Lists budget plans, filterable by owning advertiser, fiscal period and status."
    roles: [NetworkAdmin, AccountManager, CreditAnalyst, BillingOps, AdvertiserUser]
    code: 200
    input: ["advertiser_id?", "fiscal_period_code?", "plan_status?", "limit?", "offset?"]
    output: BudgetPlan[]
    side_effects: []
  - method: GET
    path: "/rmn/budget-plans/{id}"
    description: "Reads one budget plan with the live committed / reserved / consumed / available decomposition."
    roles: [NetworkAdmin, AccountManager, CreditAnalyst, BillingOps, AdvertiserUser]
    code: 200
    input: []
    output: BudgetPlan
    side_effects: []
  - method: POST
    path: "/rmn/budget-plans/{id}/submit"
    description: "Submits a DRAFT plan for approval, reserving the requested trade-fund share against the matching fiscal-period fund account."
    roles: [NetworkAdmin, AccountManager, AdvertiserUser]
    code: 200
    input: ["submission_note?"]
    output: BudgetPlan
    side_effects: ["sets plan_status=PENDING_APPROVAL", "sets submitted_by_user_id to the acting X-User-ID", "moves trade_fund_share_cents from TradeFundAccount.available_cents into TradeFundAccount.reserved_cents, preserving accrued == available + reserved + deducted", "increments BudgetPlan.version by 1"]
  - method: POST
    path: "/rmn/budget-plans/{id}/approve"
    description: "Approves a PENDING_APPROVAL plan into APPROVED and immediately into ACTIVE, checking advertiser credit headroom and plan-window exclusivity."
    roles: [NetworkAdmin, CreditAnalyst]
    code: 200
    input: ["approval_note?"]
    output: BudgetPlan
    side_effects: ["sets plan_status=ACTIVE", "sets approved_by_user_id to the acting X-User-ID (must differ from submitted_by_user_id)", "adds cash_share_cents to Advertiser.credit_exposure_cents", "increments BudgetPlan.version by 1"]
  - method: POST
    path: "/rmn/budget-plans/{id}/return-for-revision"
    description: "Returns a PENDING_APPROVAL plan to DRAFT for rework, incrementing revision_round; the cycle is bounded by MAX_REVISION_ROUNDS."
    roles: [NetworkAdmin, CreditAnalyst]
    code: 200
    input: ["revision_reason"]
    output: BudgetPlan
    side_effects: ["sets plan_status=DRAFT and revision_round = revision_round + 1", "releases the reserved trade-fund share back to TradeFundAccount.available_cents", "increments BudgetPlan.version by 1"]
  - method: POST
    path: "/rmn/budget-plans/{id}/top-up"
    description: "Adds cash headroom to an ACTIVE or EXHAUSTED plan; an EXHAUSTED plan returns to ACTIVE and its paused campaigns become resumable."
    roles: [NetworkAdmin, AccountManager, CreditAnalyst]
    code: 200
    input: ["top_up_amount_cents", "top_up_reason?"]
    output: BudgetPlan
    side_effects: ["adds top_up_amount_cents to top_up_total_cents and to available_cents via budget_plan_available", "adds top_up_amount_cents to Advertiser.credit_exposure_cents", "clears exhausted_at and sets plan_status=ACTIVE when the plan was EXHAUSTED", "increments BudgetPlan.version by 1"]
  - method: POST
    path: "/rmn/budget-plans/{id}/close"
    description: "Closes an ACTIVE or EXHAUSTED plan once its window has elapsed, compensating every outstanding reservation."
    roles: [NetworkAdmin, BillingOps]
    code: 200
    input: ["closure_note?"]
    output: BudgetPlan
    side_effects: ["sets plan_status=CLOSED", "releases reserved_cents to available_cents so committed + top_up == available + consumed", "releases the unspent trade-fund reservation back to TradeFundAccount.available_cents", "reduces Advertiser.credit_exposure_cents by the unconsumed cash share", "increments BudgetPlan.version by 1"]
  # --- TradeFundAccount -----------------------------------------------------
  - method: POST
    path: "/rmn/trade-fund-accounts"
    description: "Opens the co-op / trade-fund pool an advertiser's media deductions draw from for one fiscal period."
    roles: [NetworkAdmin, BillingOps]
    code: 201
