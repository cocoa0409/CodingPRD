# =============================================================================
# PRD Benchmark Seed Tables — Branding & Design Studio (Expert tier)
# =============================================================================
scenario: |
  Branding & Design Studio: project & scope (logo/identity/web), discovery &
  moodboard, concept rounds & revision limit, asset/brand-guide delivery &
  handoff, milestone billing & deposit, stock/font licensing, change-order,
  retainer/care-plan

domain_name: branding-design-studio
api_prefix: /studios

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation        # provisional vs final deposit reconciliation
    - cascading_side_effects          # project activation / cancellation cascades
    - derived_field_reconciliation    # contract_value recomputed from approved change orders
    - rate_threshold_triggers         # revision limit + retainer overage tiers
    - optimistic_concurrency          # OCC on Project.version for change-order create

  entity_topology: hybrid
  # Project is a hierarchy root (Moodboard, Concept, Milestone, Deliverable,
  # CareCycle nest), while Client, Invoice, License, ChangeOrder, Retainer link
  # via foreign keys — a tree with cross-cutting flat associations.

  state_machine_shape: cyclic
  # Concept revision rounds (PRESENTED -> IN_REVISION -> PRESENTED) and Retainer
  # pause/resume (ACTIVE -> PAUSED -> ACTIVE) are cyclic; Project is compound
  # (its valid transitions depend on child Moodboard/Concept/Milestone states);
  # Invoice and Milestone are linear pipelines.

  relationship_patterns:
    - one_to_many        # Project -> Milestone/Concept/Deliverable/Moodboard
    - cross_aggregate    # Invoice references Milestone; License references Project
    - flat_reference     # ChangeOrder, Retainer, License link by FK

  role_model: peer_roles
  # Designer owns creative artifacts (Moodboard/Concept/Deliverable), Client
  # approves/rejects and owns its own projects, StudioOps owns money objects
  # (Milestone/Invoice/License/ChangeOrder/Retainer). Billing operator is opaque.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Studio
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Studio display name" }
      - { name: tax_rate, type: number, source: input, description: "Sales-tax fraction applied to milestone invoice taxable amount (e.g. 0.0825)", default: 0.0 }
      - { name: license_markup_pct, type: number, source: input, description: "Markup fraction added to pass-through stock/font license cost when billed to client", default: 0.0 }

  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: input, description: "FK -> Studio.id; studio that owns this client record" }
      - { name: company_name, type: string, source: input, description: "Client company name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ARCHIVED", default: "ACTIVE", constraints: "ACTIVE, ARCHIVED" }

  - name: Project
    parent: Studio
    common_fields: true
    fields:
      - { name: studio_id, type: string, source: system, description: "FK -> Studio.id; parent studio from path" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; client commissioning this project" }
      - { name: title, type: string, source: input, description: "Project title" }
      - { name: service_type, type: enum, source: input, description: "Engagement type", constraints: "LOGO, IDENTITY, WEB" }
      - { name: deposit_pct, type: number, source: input, description: "Fraction of contract value required as deposit before delivery (e.g. 0.30)" }
      - { name: status, type: enum, source: system, description: "Lifecycle stage", default: "DRAFT", constraints: "DRAFT, DISCOVERY, CONCEPT, DELIVERY, HANDOFF, COMPLETED, CANCELLED" }
      - { name: base_scope_cents, type: integer, source: computed, description: "Sum of milestone.amount_cents snapshotted when project leaves DRAFT (activation); 0 while DRAFT" }
      - { name: contract_value_cents, type: integer, source: computed, description: "= base_scope_cents + sum(ChangeOrder.delta_cents for change orders with status=APPROVED on this project); recomputed on every change-order approval" }
      - { name: provisional_deposit_cents, type: integer, source: computed, description: "round_half_up(base_scope_cents * deposit_pct); locked at activation, never recomputed afterward" }
      - { name: final_deposit_cents, type: integer, source: computed, description: "round_half_up(contract_value_cents * deposit_pct); recomputed on change-order approval and read at delivery reconciliation" }
      - { name: deposit_collected_cents, type: integer, source: computed, description: "Cumulative deposit cash recorded against this project via deposit payments", default: 0 }

  - name: Moodboard
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; parent project from path" }
      - { name: title, type: string, source: input, description: "Moodboard title" }
      - { name: status, type: enum, source: system, description: "Discovery moodboard lifecycle", default: "DRAFT", constraints: "DRAFT, SUBMITTED, APPROVED, REJECTED" }

  - name: Concept
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; parent project from path" }
      - { name: label, type: string, source: input, description: "Concept route label (e.g. 'Route A')" }
      - { name: revision_limit, type: integer, source: input, description: "Maximum number of paid-for revision rounds before overage applies", default: 3 }
      - { name: rounds_used, type: integer, source: computed, description: "Count of PRESENTED->IN_REVISION transitions taken on this concept", default: 0 }
      - { name: status, type: enum, source: system, description: "Concept review lifecycle (cyclic via revisions)", default: "DRAFT", constraints: "DRAFT, PRESENTED, IN_REVISION, APPROVED, REJECTED" }

  - name: Milestone
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; parent project from path" }
      - { name: name, type: string, source: input, description: "Milestone name (e.g. 'Discovery complete')" }
      - { name: amount_cents, type: integer, source: input, description: "Billable amount for this milestone in cents", constraints: ">= 0" }
      - { name: sequence_index, type: integer, source: input, description: "Order of this milestone within the project; unique per project" }
      - { name: status, type: enum, source: system, description: "Billing lifecycle", default: "PENDING", constraints: "PENDING, INVOICED, PAID, WAIVED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; project this invoice belongs to" }
      - { name: milestone_id, type: string, source: input, description: "FK -> Milestone.id; milestone being invoiced" }
      - { name: gross_cents, type: integer, source: computed, description: "Snapshot of milestone.amount_cents at issue time" }
      - { name: deposit_credit_cents, type: integer, source: computed, description: "Deposit applied to this invoice = min(round_half_up(gross_cents * project.deposit_pct), remaining uncredited deposit_collected_cents)" }
      - { name: tax_cents, type: integer, source: computed, description: "= round_half_up((gross_cents - deposit_credit_cents) * studio.tax_rate); computed on the credited taxable base before any late fee" }
      - { name: late_fee_cents, type: integer, source: computed, description: "Tiered late fee on net at MARK_OVERDUE; 0 while not overdue", default: 0 }
      - { name: net_due_cents, type: integer, source: computed, description: "= (gross_cents - deposit_credit_cents) + tax_cents + late_fee_cents" }
      - { name: due_date, type: datetime, source: input, description: "Payment due date (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "Invoice lifecycle", default: "ISSUED", constraints: "ISSUED, OVERDUE, PAID, VOID" }

  - name: Deliverable
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; parent project from path" }
      - { name: asset_type, type: enum, source: input, description: "Deliverable asset class", constraints: "LOGO_PRIMARY, LOGO_MARK, COLOR_TOKENS, TYPOGRAPHY, BRAND_GUIDE, WEB_KIT" }
      - { name: is_required_for_handoff, type: boolean, source: input, description: "Whether this asset must be ACCEPTED before project handoff", default: true }
      - { name: status, type: enum, source: system, description: "Delivery lifecycle", default: "PENDING", constraints: "PENDING, DELIVERED, ACCEPTED, REVISION_REQUESTED" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; project consuming this stock/font license" }
      - { name: kind, type: enum, source: input, description: "License asset kind", constraints: "STOCK, FONT" }
      - { name: cost_cents, type: integer, source: input, description: "Studio's pass-through acquisition cost in cents", constraints: ">= 0" }
      - { name: billable_cents, type: integer, source: computed, description: "= round_half_up(cost_cents * (1 + studio.license_markup_pct)); each license rounded independently before any project total sums them (round-per-line then sum)" }
      - { name: valid_from, type: datetime, source: input, description: "Inclusive start of the license usage window (ISO 8601 UTC)" }
      - { name: valid_until, type: datetime, source: input, description: "Inclusive end of the license usage window (ISO 8601 UTC); closed interval [valid_from, valid_until]" }
      - { name: status, type: enum, source: system, description: "License lifecycle", default: "RESERVED", constraints: "RESERVED, CLEARED, BILLED, VOIDED" }

  - name: ChangeOrder
    parent: null
    common_fields: true
    fields:
      - { name: project_id, type: string, source: input, description: "FK -> Project.id; project this change order amends" }
      - { name: reason, type: enum, source: input, description: "Why scope changes", constraints: "SCOPE_ADD, EXTRA_REVISION, RUSH" }
      - { name: concept_id, type: string, source: input, description: "FK -> Concept.id; concept granted extra revisions when reason=EXTRA_REVISION; null otherwise", default: null }
      - { name: extra_revisions, type: integer, source: input, description: "Additional revision rounds granted to concept_id when reason=EXTRA_REVISION; 0 otherwise", default: 0 }
      - { name: delta_cents, type: integer, source: input, description: "Contract-value delta in cents; may be positive or negative" }
      - { name: status, type: enum, source: system, description: "Change-order lifecycle", default: "PROPOSED", constraints: "PROPOSED, APPROVED, REJECTED" }

  - name: Retainer
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; client on this care-plan retainer" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Fixed monthly care-plan fee in cents", constraints: ">= 0" }
      - { name: included_hours, type: integer, source: input, description: "Care hours included before overage tiers apply each cycle", default: 10 }
      - { name: tier1_rate_cents, type: integer, source: input, description: "Per-hour overage rate for the first 5 overage hours" }
      - { name: tier2_rate_cents, type: integer, source: input, description: "Per-hour overage rate beyond the first 5 overage hours" }
      - { name: status, type: enum, source: system, description: "Retainer lifecycle (cyclic via pause/resume)", default: "ACTIVE", constraints: "ACTIVE, PAUSED, CANCELLED" }

  - name: CareCycle
    parent: Retainer
    common_fields: true
    fields:
      - { name: retainer_id, type: string, source: system, description: "FK -> Retainer.id; parent retainer from path" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the billing cycle (ISO 8601 UTC); half-open window [period_start, period_end)" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of the billing cycle (ISO 8601 UTC); half-open window [period_start, period_end)" }
      - { name: hours_used, type: integer, source: input, description: "Care hours logged in this cycle", default: 0 }
      - { name: overage_cents, type: integer, source: computed, description: "Tiered overage = (min(max(hours_used-included,0),5))*tier1_rate_cents + (max(hours_used-included-5,0))*tier2_rate_cents; 0 until cycle closed", default: 0 }
      - { name: billed_cents, type: integer, source: computed, description: "= retainer.monthly_fee_cents + overage_cents; set at CLOSE", default: 0 }
      - { name: status, type: enum, source: system, description: "Cycle lifecycle", default: "OPEN", constraints: "OPEN, CLOSED, BILLED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Project (compound: gated by child Moodboard/Concept/Milestone/Deliverable states) ----
  - entity: Project
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: DISCOVERY
        trigger: "POST /studios/{studioId}/projects/{projectId}/activate"
        actor: StudioOps
        preconditions:
          - "Project has >= 1 Milestone (ERR_NO_MILESTONES)"
          - "client_id references a Client with status=ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
        side_effects:
          - "base_scope_cents := sum(amount_cents for milestones of this project)"
          - "contract_value_cents := base_scope_cents (no approved change orders yet)"
          - "provisional_deposit_cents := round_half_up(base_scope_cents * deposit_pct) — locked, never recomputed"
          - "final_deposit_cents := round_half_up(contract_value_cents * deposit_pct)"

      - from: DISCOVERY
        to: CONCEPT
        trigger: "POST /studios/{studioId}/projects/{projectId}/advance"
        actor: StudioOps
        preconditions:
          - "At least one Moodboard exists for the project with status=APPROVED (ERR_MOODBOARD_NOT_APPROVED)"
        side_effects: []
        note: "Cross-entity: Project may leave DISCOVERY only when a child Moodboard is APPROVED."

      - from: CONCEPT
        to: DELIVERY
        trigger: "POST /studios/{studioId}/projects/{projectId}/advance"
        actor: StudioOps
        preconditions:
          - "At least one Concept for the project has status=APPROVED (ERR_NO_APPROVED_CONCEPT)"
        side_effects: []
        note: "Cross-entity: Project may leave CONCEPT only when a child Concept is APPROVED."

      - from: DELIVERY
        to: HANDOFF
        trigger: "POST /studios/{studioId}/projects/{projectId}/advance"
        actor: StudioOps
        preconditions:
          - "Every Deliverable with is_required_for_handoff=true has status=ACCEPTED (ERR_DELIVERABLES_INCOMPLETE)"
          - "deposit_collected_cents >= final_deposit_cents (ERR_DEPOSIT_UNPAID)"
        side_effects:
          - "All RESERVED/CLEARED Licenses for this project transition to BILLED (cascade; see License machine)"

      - from: HANDOFF
        to: COMPLETED
        trigger: "POST /studios/{studioId}/projects/{projectId}/complete"
        actor: StudioOps
        preconditions:
          - "No Invoice for this project has status IN {ISSUED, OVERDUE} (ERR_OPEN_INVOICES)"
        side_effects:
          - "All PENDING Milestones with amount_cents=0 transition to WAIVED"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /studios/{studioId}/projects/{projectId}/cancel"
        actor: StudioOps
        preconditions: []
        side_effects: []

      - from: DISCOVERY
        to: CANCELLED
        trigger: "POST /studios/{studioId}/projects/{projectId}/cancel"
        actor: StudioOps
        preconditions: []
        side_effects:
          - "Cascade down: every Moodboard not in a terminal state (DRAFT, SUBMITTED) transitions to REJECTED"
          - "Cascade down: every PROPOSED ChangeOrder on this project transitions to REJECTED"
          - "Cascade down: every Concept not APPROVED/REJECTED transitions to REJECTED"
          - "Cascade: every ISSUED/OVERDUE Invoice on this project transitions to VOID"
          - "Cascade: every RESERVED/CLEARED License on this project transitions to VOIDED"

      - from: CONCEPT
        to: CANCELLED
        trigger: "POST /studios/{studioId}/projects/{projectId}/cancel"
        actor: StudioOps
        preconditions: []
        side_effects:
          - "Cascade down: every Concept not APPROVED/REJECTED transitions to REJECTED"
          - "Cascade down: every PROPOSED ChangeOrder on this project transitions to REJECTED"
          - "Cascade: every ISSUED/OVERDUE Invoice on this project transitions to VOID"
          - "Cascade: every RESERVED/CLEARED License on this project transitions to VOIDED"

  # ---- Moodboard (linear with reject revert) ----
  - entity: Moodboard
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /studios/{studioId}/projects/{projectId}/moodboards/{moodboardId}/submit"
        actor: Designer
        preconditions:
          - "Parent Project.status=DISCOVERY (ERR_PROJECT_WRONG_STAGE)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /studios/{studioId}/projects/{projectId}/moodboards/{moodboardId}/approve"
        actor: Client
        preconditions:
          - "Parent Project.status=DISCOVERY (ERR_PROJECT_WRONG_STAGE)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /studios/{studioId}/projects/{projectId}/moodboards/{moodboardId}/reject"
        actor: Client
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /studios/{studioId}/projects/{projectId}/moodboards/{moodboardId}/submit"
        actor: Designer
        preconditions:
          - "Parent Project.status=DISCOVERY (ERR_PROJECT_WRONG_STAGE)"
        side_effects: []

  # ---- Concept (cyclic: revision loop) ----
  - entity: Concept
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: DRAFT
        to: PRESENTED
        trigger: "POST /studios/{studioId}/projects/{projectId}/concepts/{conceptId}/present"
        actor: Designer
        preconditions:
          - "Parent Project.status=CONCEPT (ERR_PROJECT_WRONG_STAGE)"
        side_effects: []
      - from: PRESENTED
        to: IN_REVISION
        trigger: "POST /studios/{studioId}/projects/{projectId}/concepts/{conceptId}/request-revision"
        actor: Client
        preconditions:
          - "rounds_used < effective_revision_limit, where effective_revision_limit = revision_limit + sum(extra_revisions for APPROVED ChangeOrders with reason=EXTRA_REVISION and concept_id=this concept) (ERR_REVISION_LIMIT_REACHED)"
        side_effects:
          - "rounds_used += 1 (this is the round counter; the check uses pre-increment rounds_used)"
      - from: IN_REVISION
        to: PRESENTED
        trigger: "POST /studios/{studioId}/projects/{projectId}/concepts/{conceptId}/present"
        actor: Designer
        preconditions:
          - "Parent Project.status=CONCEPT (ERR_PROJECT_WRONG_STAGE)"
        side_effects: []
      - from: PRESENTED
        to: APPROVED
        trigger: "POST /studios/{studioId}/projects/{projectId}/concepts/{conceptId}/approve"
        actor: Client
        preconditions: []
        side_effects:
          - "Bubble up: parent Project becomes eligible to advance CONCEPT->DELIVERY"
      - from: PRESENTED
        to: REJECTED
        trigger: "POST /studios/{studioId}/projects/{projectId}/concepts/{conceptId}/reject"
        actor: Client
        preconditions: []
        side_effects: []

  # ---- Milestone (linear billing pipeline) ----
  - entity: Milestone
    initial_state: PENDING
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: PENDING
        to: INVOICED
        trigger: "POST /studios/{studioId}/invoices (issue invoice for milestone)"
        actor: BillingOps
        preconditions:
          - "Parent Project.status IN {DELIVERY, HANDOFF} (ERR_PROJECT_WRONG_STAGE)"
          - "amount_cents > 0 (ERR_ZERO_AMOUNT_MILESTONE)"
        side_effects:
          - "Cross-entity: a new Invoice is created in ISSUED with gross/credit/tax/net computed (ledger sync)"
      - from: INVOICED
        to: PAID
        trigger: "POST /studios/{studioId}/invoices/{invoiceId}/pay"
        actor: BillingOps
        preconditions:
          - "The invoice for this milestone has status IN {ISSUED, OVERDUE} (ERR_INVALID_STATE)"
        side_effects:
          - "Cross-entity: the Invoice transitions to PAID (bubble of payment)"
      - from: PENDING
        to: WAIVED
        trigger: "System: Project HANDOFF->COMPLETED for zero-amount milestone"
        actor: system
        preconditions:
          - "amount_cents = 0"
        side_effects: []

  # ---- Invoice (linear with overdue revert dimension) ----
  - entity: Invoice
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: OVERDUE
        trigger: "POST /studios/{studioId}/invoices/{invoiceId}/mark-overdue"
        actor: BillingOps
        preconditions:
          - "current logical clock > due_date (ERR_NOT_YET_DUE)"
        side_effects:
          - "late_fee_cents recomputed via tiered late-fee calc; net_due_cents recomputed = (gross-credit)+tax+late_fee"
      - from: ISSUED
        to: PAID
        trigger: "POST /studios/{studioId}/invoices/{invoiceId}/pay"
        actor: BillingOps
        preconditions: []
        side_effects:
          - "Cross-entity: parent Milestone transitions PENDING/INVOICED -> PAID"
      - from: OVERDUE
        to: PAID
        trigger: "POST /studios/{studioId}/invoices/{invoiceId}/pay"
        actor: BillingOps
        preconditions: []
        side_effects:
          - "Cross-entity: parent Milestone transitions INVOICED -> PAID"
      - from: ISSUED
        to: VOID
        trigger: "System: Project cancellation cascade"
        actor: system
        preconditions: []
        side_effects:
          - "Cross-entity: parent Milestone reverts INVOICED -> PENDING"
      - from: OVERDUE
        to: VOID
        trigger: "System: Project cancellation cascade"
        actor: system
        preconditions: []
        side_effects:
          - "Cross-entity: parent Milestone reverts INVOICED -> PENDING"

  # ---- Deliverable (branching: accept vs revision-request) ----
  - entity: Deliverable
    initial_state: PENDING
    terminal_states: [ACCEPTED]
    transitions:
      - from: PENDING
        to: DELIVERED
        trigger: "POST /studios/{studioId}/projects/{projectId}/deliverables/{deliverableId}/deliver"
        actor: Designer
        preconditions:
          - "Parent Project.status IN {DELIVERY, HANDOFF} (ERR_PROJECT_WRONG_STAGE)"
        side_effects: []
      - from: DELIVERED
        to: ACCEPTED
        trigger: "POST /studios/{studioId}/projects/{projectId}/deliverables/{deliverableId}/accept"
        actor: Client
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: REVISION_REQUESTED
        trigger: "POST /studios/{studioId}/projects/{projectId}/deliverables/{deliverableId}/request-revision"
        actor: Client
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: DELIVERED
        trigger: "POST /studios/{studioId}/projects/{projectId}/deliverables/{deliverableId}/deliver"
        actor: Designer
        preconditions:
          - "Parent Project.status IN {DELIVERY, HANDOFF} (ERR_PROJECT_WRONG_STAGE)"
        side_effects: []

  # ---- License (linear with void) ----
  - entity: License
    initial_state: RESERVED
    terminal_states: [BILLED, VOIDED]
    transitions:
      - from: RESERVED
        to: CLEARED
        trigger: "POST /studios/{studioId}/licenses/{licenseId}/clear"
        actor: StudioOps
        preconditions:
          - "Parent Project.status NOT IN {COMPLETED, CANCELLED} (ERR_PROJECT_WRONG_STAGE)"
        side_effects: []
      - from: CLEARED
        to: BILLED
        trigger: "System: Project DELIVERY->HANDOFF cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: BILLED
        trigger: "System: Project DELIVERY->HANDOFF cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: VOIDED
        trigger: "System: Project cancellation cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLEARED
        to: VOIDED
        trigger: "System: Project cancellation cascade"
        actor: system
        preconditions: []
        side_effects: []

  # ---- ChangeOrder (branching: approve vs reject; approval mutates Project ledger) ----
  - entity: ChangeOrder
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /studios/{studioId}/change-orders/{changeOrderId}/approve"
        actor: Client
        preconditions:
          - "Parent Project.status NOT IN {COMPLETED, CANCELLED, HANDOFF} (ERR_PROJECT_WRONG_STAGE)"
          - "Parent Project.status != DRAFT (ERR_PROJECT_NOT_ACTIVATED)"
        side_effects:
          - "Ledger sync: contract_value_cents := base_scope_cents + sum(delta_cents of APPROVED change orders incl. this one)"
          - "final_deposit_cents := round_half_up(contract_value_cents * deposit_pct)"
          - "increments Project.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /studios/{studioId}/change-orders/{changeOrderId}/reject"
        actor: Client
        preconditions: []
        side_effects: []

  # ---- Retainer (cyclic: pause/resume) ----
  - entity: Retainer
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /studios/{studioId}/retainers/{retainerId}/pause"
        actor: StudioOps
        preconditions:
          - "No CareCycle on this retainer has status=OPEN (ERR_OPEN_CYCLE)"
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /studios/{studioId}/retainers/{retainerId}/resume"
        actor: StudioOps
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /studios/{studioId}/retainers/{retainerId}/cancel"
        actor: StudioOps
        preconditions:
          - "No CareCycle on this retainer has status=OPEN (ERR_OPEN_CYCLE)"
        side_effects: []
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /studios/{studioId}/retainers/{retainerId}/cancel"
        actor: StudioOps
        preconditions: []
        side_effects: []

  # ---- CareCycle (linear billing) ----
  - entity: CareCycle
    initial_state: OPEN
    terminal_states: [BILLED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /studios/{studioId}/retainers/{retainerId}/care-cycles/{careCycleId}/close"
        actor: StudioOps
        preconditions:
          - "current logical clock >= period_end (ERR_CYCLE_NOT_ENDED)"
        side_effects:
          - "overage_cents := tiered overage over hours_used; billed_cents := monthly_fee_cents + overage_cents"
      - from: CLOSED
        to: BILLED
        trigger: "POST /studios/{studioId}/retainers/{retainerId}/care-cycles/{careCycleId}/bill"
        actor: BillingOps
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: change-order-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /studios/{studioId}/change-orders"
    occ_field: "expected_project_version"
    description: |
      Creating a ChangeOrder against a Project whose version has advanced since
      the client last observed it is rejected with a stale-version error. A prior
      approved change order legitimately bumps the project's version (its approval
      mutates contract_value_cents and final_deposit_cents); a writer still holding
      the older project version is therefore working from a stale ledger view and
      its create is rejected so it must re-read before proposing a new amount.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: project_deposit_dual_variant
    trigger: "Project DRAFT->DISCOVERY activation (provisional) and ChangeOrder approval / DELIVERY reconciliation (final)"
    algorithm: forward_looking
    formula: |
      base_scope_cents = sum(milestone.amount_cents for all milestones of project)   # snapshot at activation
      provisional_deposit_cents = round_half_up(base_scope_cents * deposit_pct)        # locked at activation
      contract_value_cents = base_scope_cents + sum(co.delta_cents for co in change_orders where co.status == APPROVED)
      final_deposit_cents = round_half_up(contract_value_cents * deposit_pct)          # recomputed on every CO approval
    input_set: "Milestones counted at activation snapshot; change orders counted only when status=APPROVED"
    constants: {}
    precision: "round_half_up to whole cents"
    variants:
      - name: provisional
        when: "At activation, before any change order is approved"
        difference: "Uses base_scope_cents only; value is frozen and never recomputed even after change orders approve"
      - name: final
        when: "At delivery reconciliation, after change orders may have approved"
        difference: "Uses contract_value_cents (= base + approved deltas); diverges from provisional whenever any change order is APPROVED"

  - name: invoice_net_due
    trigger: "Milestone PENDING->INVOICED (issue) and Invoice ISSUED->OVERDUE (late fee)"
    algorithm: tiered_pricing
    formula: |
      gross_cents = milestone.amount_cents
      deposit_credit_cents = min( round_half_up(gross_cents * project.deposit_pct),
                                  project.deposit_collected_cents - already_credited_deposit_cents )
      taxable_cents = gross_cents - deposit_credit_cents
      tax_cents = round_half_up(taxable_cents * studio.tax_rate)        # tax computed on credited base, BEFORE late fee
      # late fee added only at MARK_OVERDUE, tiered on net-before-fee:
      net_before_fee = taxable_cents + tax_cents
      days_overdue = ceil((clock - due_date) in whole days)
      if days_overdue <= 0:   late_fee_cents = 0
      elif days_overdue <= 30: late_fee_cents = round_half_up(net_before_fee * 0.015)
      else:                    late_fee_cents = round_half_up(net_before_fee * 0.030)
      net_due_cents = net_before_fee + late_fee_cents
    input_set: "Deposit credit drawn from project.deposit_collected_cents not yet consumed by earlier invoices, in milestone sequence_index order (ascending; tie-break created_at ascending)"
    constants:
      LATE_TIER1_RATE: 0.015
      LATE_TIER2_RATE: 0.030
      LATE_TIER1_MAX_DAYS: 30
    precision: "round_half_up to whole cents; tax rounded once on taxable base; late fee rounded once on net_before_fee"
    variants:
      - name: at_issue
        when: "Invoice ISSUED — not overdue"
        difference: "late_fee_cents = 0; net_due_cents = taxable + tax"
      - name: overdue
        when: "Invoice marked OVERDUE after due_date"
        difference: "adds tiered late fee on net_before_fee; tier flips at days_overdue boundary 30 (<=30 vs >30)"

  - name: license_billable_rollup
    trigger: "License creation (per-line billable) and Project DELIVERY->HANDOFF (project license total)"
    algorithm: aggregation
    formula: |
      # Per-line: each license is marked up and rounded independently:
      license.billable_cents = round_half_up(license.cost_cents * (1 + studio.license_markup_pct))
      # Project rollup pins ROUND-PER-LINE-THEN-SUM (not sum-then-round):
      project_license_total_cents = sum( license.billable_cents
                                          for license in licenses(project)
                                          where license.status IN {RESERVED, CLEARED, BILLED} )
    input_set: "Licenses with status IN {RESERVED, CLEARED, BILLED}; VOIDED excluded"
    constants: {}
    precision: "round_half_up to whole cents PER LINE before summing; the sum itself needs no further rounding"
    variants:
      - name: per_line_then_sum
        when: "Always — this is the pinned order"
        difference: "Rounds each license.billable_cents, then sums; differs from sum-then-round when markup produces .5-cent fractions on multiple lines"

  - name: retainer_cycle_overage
    trigger: "CareCycle OPEN->CLOSED"
    algorithm: tiered_pricing
    formula: |
      raw_overage_hours = max(0, hours_used - retainer.included_hours)
      tier1_hours = min(raw_overage_hours, 5)
      tier2_hours = max(0, raw_overage_hours - 5)
      overage_cents = tier1_hours * retainer.tier1_rate_cents + tier2_hours * retainer.tier2_rate_cents
      billed_cents  = retainer.monthly_fee_cents + overage_cents
    input_set: "hours_used recorded on the cycle; included_hours and tier rates read from parent retainer"
    constants:
      TIER1_HOURS_CAP: 5
    precision: "integer cents (rates are whole cents per whole hour)"
    variants:
      - name: within_included
        when: "hours_used <= included_hours"
        difference: "overage_cents = 0; billed_cents = monthly_fee_cents"
      - name: tier2_engaged
        when: "hours_used > included_hours + 5"
        difference: "second tier rate applies to hours beyond the first 5 overage hours; boundary at exactly +5 overage hours stays entirely tier1"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC; entity_backed roles must own the targeted resource"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path/body-referenced resource exists, validated left-to-right in the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed; required fields present; enum members valid; numeric fields within declared constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 5
    category: state
    check: "Optimistic concurrency: expected_project_version matches current Project.version on change-order create"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to: "POST /studios/{studioId}/change-orders"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 7
    category: business_temporal
    check: "Cross-stage gate: parent Project is in the stage required for this child operation"
    error_id: ERR_PROJECT_WRONG_STAGE
    http_status: 409
    applies_to: "moodboard/concept/deliverable/milestone/license operations"

  - priority: 8
    category: business_temporal
    check: "Interval-overlap rejections: License windows on a project must not overlap (closed [from,until]); CareCycle windows on a retainer must not overlap (half-open [start,end))"
    error_id: ERR_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST .../licenses, POST .../care-cycles"

  - priority: 9
    category: business_safety
    check: "Concept revision limit: a request-revision that would push rounds_used past effective_revision_limit is rejected"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST .../concepts/{conceptId}/request-revision"

  - priority: 10
    category: business_referential
    check: "Stage-advance/handoff gates depend on sibling/child entity states (moodboard approved, concept approved, deliverables accepted, no open invoices)"
    error_id: "ERR_MOODBOARD_NOT_APPROVED / ERR_NO_APPROVED_CONCEPT / ERR_DELIVERABLES_INCOMPLETE / ERR_OPEN_INVOICES"
    http_status: 409
    applies_to: "POST .../projects/{projectId}/advance, .../complete"

  - priority: 11
    category: business_fiscal
    check: "Deposit gate: project may not enter HANDOFF until deposit_collected_cents >= final_deposit_cents"
    error_id: ERR_DEPOSIT_UNPAID
    http_status: 402
    applies_to: "POST .../projects/{projectId}/advance (DELIVERY->HANDOFF)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock for deadline/expiry determinism. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [BillingOps, StudioOps]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock set to the supplied instant"]

  # ---- Studio ----
  - method: POST
    path: "/studios"
    description: "Create a Studio (tenant root)"
    roles: [StudioOps]
    code: 201
    input: ["name", "tax_rate?", "license_markup_pct?"]
    output: Studio
    side_effects: []
  - method: GET
    path: "/studios/{studioId}"
    description: "Get a Studio"
    roles: [StudioOps, BillingOps, Designer, Client]
    code: 200
    input: []
    output: Studio
    side_effects: []

  # ---- Client ----
  - method: POST
    path: "/studios/{studioId}/clients"
    description: "Register a Client under a studio"
    roles: [StudioOps]
    code: 201
    input: [company_name, contact_email]
    output: Client
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/studios/{studioId}/clients/{clientId}"
    description: "Get a Client"
    roles: [StudioOps, BillingOps, Client]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/clients"
    description: "List clients of a studio (reverse-reachability for Client.studio_id)"
    roles: [StudioOps, BillingOps]
    code: 200
    input: ["studio_id?", "limit?", "offset?"]
    output: Client[]
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/clients/{clientId}/archive"
    description: "Archive a Client (ACTIVE->ARCHIVED)"
    roles: [StudioOps]
    code: 200
    input: []
    output: Client
    side_effects: ["status=ARCHIVED"]

  # ---- Project ----
  - method: POST
    path: "/studios/{studioId}/projects"
    description: "Create a Project in DRAFT"
    roles: [StudioOps]
    code: 201
    input: [client_id, title, service_type, deposit_pct]
    output: Project
    side_effects: ["status=DRAFT; base_scope_cents=0; contract_value_cents=0; deposit_collected_cents=0"]
  - method: GET
    path: "/studios/{studioId}/projects/{projectId}"
    description: "Get a Project (computed ledger fields included)"
    roles: [StudioOps, BillingOps, Designer, Client]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/projects"
    description: "List projects of a studio; filter by client_id (reverse-reachability for Project.client_id and Project.studio_id)"
    roles: [StudioOps, BillingOps, Client]
    code: 200
    input: ["client_id?", "studio_id?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/projects/{projectId}/deposits"
    description: "Record a deposit cash payment against the project ledger"
    roles: [BillingOps]
    code: 201
    input: [amount_cents]
    output: Project
    side_effects: ["deposit_collected_cents += amount_cents"]
  - method: POST
    path: "/studios/{studioId}/projects/{projectId}/activate"
    description: "Activate project DRAFT->DISCOVERY; snapshot base scope and deposits"
    roles: [StudioOps]
    code: 200
    input: []
    output: Project
    side_effects: ["snapshot base_scope_cents, provisional_deposit_cents (locked), contract_value_cents, final_deposit_cents"]
  - method: POST
    path: "/studios/{studioId}/projects/{projectId}/advance"
    description: "Advance project to next stage (DISCOVERY->CONCEPT->DELIVERY->HANDOFF) with stage gates"
    roles: [StudioOps]
    code: 200
    input: []
    output: Project
    side_effects: ["Stage gates enforced; DELIVERY->HANDOFF bills licenses"]
  - method: POST
    path: "/studios/{studioId}/projects/{projectId}/complete"
    description: "Complete project HANDOFF->COMPLETED"
    roles: [StudioOps]
    code: 200
    input: []
    output: Project
    side_effects: ["Zero-amount PENDING milestones -> WAIVED"]
  - method: POST
    path: "/studios/{studioId}/projects/{projectId}/cancel"
    description: "Cancel project; cascade reject/void of children"
    roles: [StudioOps]
    code: 200
    input: []
    output: Project
    side_effects: ["Cascade: moodboards/concepts/change-orders REJECTED; invoices VOID; licenses VOIDED; invoiced milestones revert PENDING"]

  # ---- Moodboard ----
  - method: POST
    path: "/studios/{studioId}/projects/{projectId}/moodboards"
    description: "Create a Moodboard"
    roles: [Designer]
    code: 201
    input: [title]
    output: Moodboard
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/studios/{studioId}/projects/{projectId}/moodboards"
    description: "List moodboards of a project (reverse-reachability for Moodboard.project_id)"
    roles: [StudioOps, Designer, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: Moodboard[]
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/projects/{projectId}/moodboards/{moodboardId}"
    description: "Get a Moodboard"
    roles: [StudioOps, Designer, Client]
    code: 200
    input: []
    output: Moodboard
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/projects/{projectId}/moodboards/{moodboardId}/submit"
    description: "Designer submits moodboard for client review (DRAFT/REJECTED->SUBMITTED)"
    roles: [Designer]
    code: 200
    input: []
    output: Moodboard
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/projects/{projectId}/moodboards/{moodboardId}/approve"
    description: "Client approves moodboard (SUBMITTED->APPROVED)"
    roles: [Client]
    code: 200
    input: []
    output: Moodboard
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/projects/{projectId}/moodboards/{moodboardId}/reject"
    description: "Client rejects moodboard (SUBMITTED->REJECTED)"
    roles: [Client]
    code: 200
    input: []
    output: Moodboard
    side_effects: []

  # ---- Concept ----
  - method: POST
    path: "/studios/{studioId}/projects/{projectId}/concepts"
    description: "Create a Concept route"
    roles: [Designer]
    code: 201
    input: ["label", "revision_limit?"]
    output: Concept
    side_effects: ["status=DRAFT; rounds_used=0"]
  - method: GET
    path: "/studios/{studioId}/projects/{projectId}/concepts"
    description: "List concepts of a project (reverse-reachability for Concept.project_id)"
    roles: [StudioOps, Designer, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: Concept[]
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/projects/{projectId}/concepts/{conceptId}"
    description: "Get a Concept"
    roles: [StudioOps, Designer, Client]
    code: 200
    input: []
    output: Concept
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/projects/{projectId}/concepts/{conceptId}/present"
    description: "Designer presents concept (DRAFT/IN_REVISION->PRESENTED)"
    roles: [Designer]
    code: 200
    input: []
    output: Concept
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/projects/{projectId}/concepts/{conceptId}/request-revision"
    description: "Client requests a revision round (PRESENTED->IN_REVISION); enforces revision limit"
    roles: [Client]
    code: 200
    input: []
    output: Concept
    side_effects: ["rounds_used += 1 on success"]
  - method: POST
    path: "/studios/{studioId}/projects/{projectId}/concepts/{conceptId}/approve"
    description: "Client approves concept (PRESENTED->APPROVED)"
    roles: [Client]
    code: 200
    input: []
    output: Concept
    side_effects: []
  - method: POST
    path: "/studios/{studioId}/projects/{projectId}/concepts/{conceptId}/reject"
    description: "Client rejects concept (PRESENTED->REJECTED)"
    roles: [Client]
    code: 200
    input: []
    output: Concept
    side_effects: []

  # ---- Milestone ----
  - method: POST
    path: "/studios/{studioId}/projects/{projectId}/milestones"
    description: "Create a Milestone (only while Project DRAFT)"
    roles: [StudioOps]
    code: 201
    input: [name, amount_cents, sequence_index]
    output: Milestone
    side_effects: ["status=PENDING"]
  - method: GET
    path: "/studios/{studioId}/projects/{projectId}/milestones"
    description: "List milestones of a project (reverse-reachability for Milestone.project_id)"
    roles: [StudioOps, BillingOps, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: Milestone[]
    side_effects: []
  - method: GET
    path: "/studios/{studioId}/projects/{projectId}/milestones/{milestoneId}"
    description: "Get a Milestone"
    roles: [StudioOps, BillingOps, Client]
    code: 200
    input: []
    output: Milestone
    side_effects: []

  # ---- Invoice ----
  - method: POST
    path: "/studios/{studioId}/invoices"
    description: "Issue an Invoice for a milestone (Milestone PENDING->INVOICED); computes gross/credit/tax/net"
    roles: [BillingOps]
    code: 201
    input: [milestone_id, due_date]
    output: Invoice
    side_effects: ["Invoice ISSUED; deposit credit + tax computed; milestone INVOICED"]
  - method: GET
    path: "/studios/{studioId}/invoices/{invoiceId}"
    description: "Get an Invoice"
