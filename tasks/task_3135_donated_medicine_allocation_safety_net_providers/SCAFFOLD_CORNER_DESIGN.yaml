        claim_type: violation_to_error
        grounds:
          - validations.priority_16_business_constraint
          - errors.ERR_DONOR_NOT_ACTIVE
        distinguishing_aspect: "Lot intake against a SUSPENDED donor is rejected with 409 ERR_DONOR_NOT_ACTIVE."
