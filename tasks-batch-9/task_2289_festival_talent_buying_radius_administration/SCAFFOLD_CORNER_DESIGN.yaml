  - section: errors
    instances:

      - name: unauthenticated_requests_rejected_before_shape_and_existence
        claim_type: error_triggerable
        grounds:
          - validations[priority 1]
          - validations[priority 2]
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority 5]
        distinguishing_aspect: |
          Priority 1 runs before the body is parsed, so a request with no X-User-Role
          header and a body missing three required fields is still a 401 rather than
          the 422 of priority 5, and priority 2 treats an unrecognised role string
          ("Promoter") as an authentication failure rather than the 403 of priority 3.
          Both leave no row behind.
        test_recipe:
          setup:
            - "Canonical base fixture. The first probe carries no X-User-Role header at all; the second carries X-User-Role: Promoter."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest: "$.data.id", fest_v: "$.data.version" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 0.5, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_h: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "MID_CARD", tier_rank: 2, allocation_pct: 0.3, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_m: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "EMERGING", tier_rank: 3, allocation_pct: 0.2, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_e: "$.data.id" }
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_a: "$.data.id" }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 100 }
              as: TalentBuyer
              captures: { artist_n: "$.data.id" }
          trigger:
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Ghost Signal LLC" }
              captures: { e_no_header: "$.data.error_id" }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Ghost Signal LLC", performing_name: "Ghost Signal", primary_genre: "ROCK", agency: "Meridian Talent", draw_score: 30 }
              as: Promoter
              captures: { e_bad_role: "$.data.error_id" }
            - call: "GET /festival-ops/offers"
              payload: { festival_id: "${fest}" }
              as: Promoter
              captures: { e_bad_role_read: "$.data.error_id" }
          assert:
            - "first call: HTTP 401 with error_id ERR_UNAUTHENTICATED even though the body is also invalid - priority 1 precedes priority 5"
            - "second call: HTTP 401 with error_id ERR_UNAUTHENTICATED, not 403 ERR_ROLE_NOT_PERMITTED"
            - "third call: HTTP 401 on a read as well - the rule applies to every endpoint including the logical clock"
            - "every failure body carries data.error_id and data.message with meta.api_request_id present"
            - "GET /festival-ops/artists/${artist_n} still returns 200 and no \"Ghost Signal\" row exists"

      - name: remaining_not_found_ids_are_entity_specific
        claim_type: error_triggerable
        grounds:
          - validations[priority 10]
          - errors[ERR_STAGE_NOT_FOUND]
          - errors[ERR_BUDGET_TIER_NOT_FOUND]
          - errors[ERR_ARTIST_NOT_FOUND]
          - errors[ERR_RADIUS_CLAUSE_NOT_FOUND]
          - errors[ERR_COMPETING_PERFORMANCE_NOT_FOUND]
          - errors[ERR_RIDER_ITEM_NOT_FOUND]
          - errors[ERR_ADVANCE_PACKET_NOT_FOUND]
          - errors[ERR_PAYMENT_INSTALLMENT_NOT_FOUND]
          - errors[ERR_ANNOUNCEMENT_WAVE_NOT_FOUND]
        distinguishing_aspect: |
          Nine collections, nine distinct 404 ids, one unknown UUID: this closes the
          existence half of the catalog that the festival / offer / booking probe left
          open, and proves the id is chosen from the addressed collection rather than
          from a single shared NOT_FOUND constant.
        test_recipe:
          setup:
            - "Canonical base fixture; the probed UUID belongs to no row in any collection."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest: "$.data.id", fest_v: "$.data.version" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 0.5, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_h: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "MID_CARD", tier_rank: 2, allocation_pct: 0.3, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_m: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "EMERGING", tier_rank: 3, allocation_pct: 0.2, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_e: "$.data.id" }
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_a: "$.data.id" }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 100 }
              as: TalentBuyer
              captures: { artist_n: "$.data.id" }
          trigger:
            - call: "GET /festival-ops/stages/aaaaaaaa-0000-4000-8000-000000000001"
              as: ProductionManager
              captures: { e_stage: "$.data.error_id" }
            - call: "GET /festival-ops/budget-tiers/aaaaaaaa-0000-4000-8000-000000000002"
              as: TalentBuyer
              captures: { e_tier: "$.data.error_id" }
            - call: "GET /festival-ops/artists/aaaaaaaa-0000-4000-8000-000000000003"
              as: TalentBuyer
              captures: { e_artist: "$.data.error_id" }
            - call: "GET /festival-ops/radius-clauses/aaaaaaaa-0000-4000-8000-000000000004"
              as: BusinessAffairs
              captures: { e_clause: "$.data.error_id" }
            - call: "GET /festival-ops/competing-performances/aaaaaaaa-0000-4000-8000-000000000005"
              as: BusinessAffairs
              captures: { e_perf: "$.data.error_id" }
            - call: "GET /festival-ops/rider-items/aaaaaaaa-0000-4000-8000-000000000006"
              as: ProductionManager
              captures: { e_rider: "$.data.error_id" }
            - call: "GET /festival-ops/advance-packets/aaaaaaaa-0000-4000-8000-000000000007"
              as: ProductionManager
              captures: { e_packet: "$.data.error_id" }
            - call: "GET /festival-ops/payment-installments/aaaaaaaa-0000-4000-8000-000000000008"
              as: FinanceController
              captures: { e_inst: "$.data.error_id" }
            - call: "GET /festival-ops/announcement-waves/aaaaaaaa-0000-4000-8000-000000000009"
              as: TalentBuyer
              captures: { e_wave: "$.data.error_id" }
          assert:
            - "first call: HTTP 404 ERR_STAGE_NOT_FOUND"
            - "second call: HTTP 404 ERR_BUDGET_TIER_NOT_FOUND"
            - "third call: HTTP 404 ERR_ARTIST_NOT_FOUND"
            - "fourth call: HTTP 404 ERR_RADIUS_CLAUSE_NOT_FOUND"
            - "fifth call: HTTP 404 ERR_COMPETING_PERFORMANCE_NOT_FOUND"
            - "sixth call: HTTP 404 ERR_RIDER_ITEM_NOT_FOUND"
            - "seventh call: HTTP 404 ERR_ADVANCE_PACKET_NOT_FOUND"
            - "eighth call: HTTP 404 ERR_PAYMENT_INSTALLMENT_NOT_FOUND"
            - "ninth call: HTTP 404 ERR_ANNOUNCEMENT_WAVE_NOT_FOUND"

      - name: three_distinct_403_ids_are_not_interchangeable
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_ARTIST_SCOPE_VIOLATION]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority 3]
          - validations[priority 13]
          - validations[priority 42]
        distinguishing_aspect: |
          All three ids are 403 but they come from three different rules at three
          different priorities: a role that is not on the endpoint at all (3), a role
          that is on the endpoint but addressing another artist's row (13), and a role
          that owns the endpoint but submitted the very packet it is adjudicating (42).
          Collapsing them into one generic 403 loses the distinction the RBAC model is
          built on.
        test_recipe:
          setup:
            - "Canonical base fixture plus Vela Roan (ROCK, draw 72) with her own accepted booking, and an accepted Nova Kade booking."
            - "Nova Kade's advance packet was created and submitted by ProductionManager user pm-001."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest: "$.data.id", fest_v: "$.data.version" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 0.5, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_h: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "MID_CARD", tier_rank: 2, allocation_pct: 0.3, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_m: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "EMERGING", tier_rank: 3, allocation_pct: 0.2, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_e: "$.data.id" }
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/stages"
              payload: { festival_id: "${fest}", name: "Aurora Main", capacity: 24000, daily_curfew_minute: 1380, daily_program_minutes_cap: 600, changeover_buffer_minutes: 30, is_flagship: true }
              as: ProductionManager
              captures: { stage_a: "$.data.id" }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Nova Kade LLC", performing_name: "Nova Kade", primary_genre: "ELECTRONIC", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 100 }
              as: TalentBuyer
              captures: { artist_n: "$.data.id" }
            - call: "POST /festival-ops/artists"
              payload: { legal_name: "Vela Roan Touring Ltd", performing_name: "Vela Roan", primary_genre: "ROCK", agency: "Meridian Talent", draw_score: 72, default_radius_miles: 100 }
              as: TalentBuyer
              captures: { artist_v: "$.data.id" }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest}", artist_id: "${artist_n}", budget_tier_id: "${tier_h}", stage_id: "${stage_a}", guarantee_cents: 1800000, billing_position: 1, set_length_minutes: 90, slot_start_utc: "2026-12-04T21:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04" }
              as: TalentBuyer
              captures: { offer_1: "$.data.id" }
            - call: "POST /festival-ops/offers/${offer_1}/issue"
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${offer_1}/accept"
              as: ArtistRep
              as_user_id: "${artist_n}"
              captures: { bk: "$.data.id" }
            - call: "POST /festival-ops/offers"
              payload: { festival_id: "${fest}", artist_id: "${artist_v}", budget_tier_id: "${tier_h}", stage_id: "${stage_a}", guarantee_cents: 1800000, billing_position: 2, set_length_minutes: 90, slot_start_utc: "2026-12-04T18:00:00Z", offer_expires_utc: "2026-09-15T00:00:00Z", radius_miles: 150, window_start_date: "2026-10-05", window_end_date: "2027-01-04" }
              as: TalentBuyer
              captures: { offer_v: "$.data.id" }
            - call: "POST /festival-ops/offers/${offer_v}/issue"
              as: TalentBuyer
            - call: "POST /festival-ops/offers/${offer_v}/accept"
              as: ArtistRep
              as_user_id: "${artist_v}"
              captures: { bk_v: "$.data.id" }
            - call: "POST /festival-ops/advance-packets"
              payload: { booking_id: "${bk}", stage_plot_ref: "SP-AURORA-1", input_channel_count: 48, monitor_mix_count: 8, travel_party_size: 12 }
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { pk_1: "$.data.id" }
            - call: "POST /festival-ops/advance-packets/${pk_1}/submit"
              as: ProductionManager
              as_user_id: "pm-001"
          trigger:
            - call: "POST /festival-ops/bookings/${bk}/countersign"
              as: FinanceController
              captures: { e_role: "$.data.error_id" }
            - call: "POST /festival-ops/bookings/${bk}/rider-items"
              payload: { category: "TECHNICAL", description: "Extra wedge monitors", quantity: 2, unit_cost_cents: 40000 }
              as: ArtistRep
              as_user_id: "${artist_v}"
              captures: { e_scope: "$.data.error_id" }
            - call: "POST /festival-ops/advance-packets/${pk_1}/approve"
              as: ProductionManager
              as_user_id: "pm-001"
              captures: { e_sod: "$.data.error_id" }
            - call: "POST /festival-ops/advance-packets/${pk_1}/approve"
              as: ProductionManager
              as_user_id: "pm-002"
          assert:
            - "first call: HTTP 403 with error_id ERR_ROLE_NOT_PERMITTED - countersign is BusinessAffairs-only, so FinanceController never reaches the state checks"
            - "second call: HTTP 403 with error_id ERR_ARTIST_SCOPE_VIOLATION - Vela Roan's rep may post rider lines, just not on Nova Kade's booking"
            - "third call: HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES for pm-001 approving the packet pm-001 submitted"
            - "fourth call: HTTP 200 with data.status == \"APPROVED\" and data.approved_by_user_id == \"pm-002\""
            - "GET /festival-ops/bookings/${bk}/rider-items returns total_count 0 - the scope violation created nothing"

      - name: allocation_percentages_and_wave_phase_mismatches_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority 70]
          - errors[ERR_ALLOCATION_PCT_INVALID]
          - validations[priority 36]
          - errors[ERR_WAVE_PHASE_MISMATCH]
          - validations[priority 63]
          - errors[ERR_EMPTY_WAVE]
        distinguishing_aspect: |
          Two catalog entries that only a malformed waterfall or a phase-crossed wave
          can reach. The tier-less festival and the 0.90 sum are the same error id from
          the same rule, and neither failure consumes Festival.version - the third
          allocate succeeds with the very version the two rejections were issued with.
          The wave probes then pin priority 36 ahead of priority 63: an empty wave
          planned for the wrong phase answers ERR_WAVE_PHASE_MISMATCH, and only once
          the phase matches does the emptiness surface.
        test_recipe:
          setup:
            - "A festival with no BudgetTier rows at all; ${fest_v} is the version captured at creation."
            - "Two waves are then planned on that festival, wave 1 for PRESALE (the festival's current announcement_phase) and wave 2 for TIER1_ONSALE; neither has any assignment."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest: "$.data.id", fest_v: "$.data.version" }
          trigger:
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
              captures: { e_no_tiers: "$.data.error_id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 0.6, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_h: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "MID_CARD", tier_rank: 2, allocation_pct: 0.3, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_m: "$.data.id" }
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
              captures: { e_short_sum: "$.data.error_id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "EMERGING", tier_rank: 3, allocation_pct: 0.1, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_e: "$.data.id" }
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
              as: TalentBuyer
            - call: "POST /festival-ops/announcement-waves"
              payload: { festival_id: "${fest}", wave_number: 2, phase: "TIER1_ONSALE", scheduled_reveal_utc: "2026-10-01T12:00:00Z" }
              as: TalentBuyer
              captures: { wave_2: "$.data.id" }
            - call: "POST /festival-ops/announcement-waves/${wave_2}/lock"
              as: TalentBuyer
              captures: { e_phase: "$.data.error_id" }
            - call: "POST /festival-ops/announcement-waves"
              payload: { festival_id: "${fest}", wave_number: 1, phase: "PRESALE", scheduled_reveal_utc: "2026-09-10T12:00:00Z" }
              as: TalentBuyer
              captures: { wave_1: "$.data.id" }
            - call: "POST /festival-ops/announcement-waves/${wave_1}/lock"
              as: TalentBuyer
              captures: { e_empty: "$.data.error_id" }
          assert:
            - "first call: HTTP 422 with error_id ERR_ALLOCATION_PCT_INVALID for a festival with zero tiers"
            - "fourth call: HTTP 422 with error_id ERR_ALLOCATION_PCT_INVALID when the declared percentages sum to 0.90"
            - "sixth call: HTTP 200 with the same ${fest_v} in the body - the two rejections left Festival.version untouched"
            - "sixth call: GET /festival-ops/festivals/${fest}/budget-tiers shows allocation_cents 5700000 / 2850000 / 950000 summing to the 9500000 allocatable"
            - "eighth call: HTTP 409 with error_id ERR_WAVE_PHASE_MISMATCH, not ERR_EMPTY_WAVE, for the TIER1_ONSALE wave while the festival is still in PRESALE"
            - "tenth call: HTTP 409 with error_id ERR_EMPTY_WAVE once the phase matches - priority 36 precedes priority 63"
            - "GET /festival-ops/announcement-waves returns both waves with status \"PLANNED\""

  - section: rbac
    instances:

      - name: artist_rep_is_denied_every_festival_scoped_collection
        claim_type: role_denied
        grounds:
          - roles.ArtistRep.identity_binding
          - validations[priority 3]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          ArtistRep is not merely scoped on Festival, BudgetTier and Stage rows - the
          role is absent from those endpoints entirely, so the answer is
          ERR_ROLE_NOT_PERMITTED at priority 3 rather than ERR_ARTIST_SCOPE_VIOLATION
          at 13, and it holds for reads as well as writes. The same caller is fully
          authorised on its own offer read, which proves the header is valid.
        test_recipe:
          setup:
            - "Canonical base fixture with one DRAFT Nova Kade offer; every call is made as ArtistRep with X-User-Id equal to Nova Kade's artist id."
          setup_api_calls:
            - call: "POST /festival-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TalentBuyer
            - call: "POST /festival-ops/festivals"
              payload: { name: "Harbor Lights Festival", edition_year: 2026, market_latitude: 47.6062, market_longitude: -122.3321, event_start_date: "2026-12-04", event_end_date: "2026-12-06", talent_budget_cents: 10000000, contingency_reserve_pct: 0.05 }
              as: TalentBuyer
              captures: { fest: "$.data.id", fest_v: "$.data.version" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "HEADLINER", tier_rank: 1, allocation_pct: 0.5, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_h: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "MID_CARD", tier_rank: 2, allocation_pct: 0.3, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_m: "$.data.id" }
            - call: "POST /festival-ops/budget-tiers"
              payload: { festival_id: "${fest}", tier_code: "EMERGING", tier_rank: 3, allocation_pct: 0.2, max_slots: 5, genre_focus: "MIXED" }
              as: TalentBuyer
              captures: { tier_e: "$.data.id" }
            - call: "POST /festival-ops/festivals/${fest}/allocate-tiers"
              payload: { expected_festival_version: "${fest_v}" }
