scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: giveaway_provisional_vs_final_divergence
        grounds:
          - calculations.giveaway_calc
          - entities.ProductionRun.fields.giveaway_provisional_pct
          - entities.ProductionRun.fields.giveaway_final_pct
          - entities.WeightCheck.fields.is_reject
        distinguishing_aspect: |
          Entity domain ProductionRun/WeightCheck: identical recorded checks yield
          giveaway_provisional_pct == -0.87 (all checks, raw mean) but
          giveaway_final_pct == 0.25 (rejects excluded, per-check rounding before
          averaging) — the two variants disagree on BOTH input set and rounding order.
        test_recipe:
          setup:
            - "FRYER product declared 100.0 g, tne 1.5 g (reject threshold: strictly below 97.0 g), giveaway_max 3.0"
            - "line with BOTH type, oil capacity 100; run scheduled [2026-08-02T08:00:00Z, 2026-08-02T10:00:00Z) and started at exactly 08:00"
            - "three weight checks recorded: 100.15 g, 100.25 g (non-rejects), 96.99 g (reject)"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", lbs_planned: 2000, cases_planned: 100, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: PlantManager
            - call: "POST /snack-mfg/production-runs/${run_id}/start"
              as: LineOperator
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.15, lbs_fried_since_last_check: 0, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.25, lbs_fried_since_last_check: 0, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 96.99, lbs_fried_since_last_check: 0, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
          trigger:
            - call: "GET /snack-mfg/production-runs/${run_id}"
              as: PlantManager
          assert:
            - "ProductionRun.${run_id}.giveaway_provisional_pct == -0.87"
            - "ProductionRun.${run_id}.giveaway_final_pct == 0.25"
            - "the third WeightCheck (96.99 g) has is_reject == true; the first two have is_reject == false"

      - name: freshness_dsd_vs_warehouse_window_divergence
        grounds:
          - calculations.freshness_window
          - entities.Shipment.fields.freshness_days_at_plan
          - entities.Shipment.fields.planned_route
        distinguishing_aspect: |
          Entity domain Shipment: for the same completed run, the WAREHOUSE variant
          (receipt remaining = at-dispatch remaining minus transit_days, exclusive
          >10) and the DSD variant (at-dispatch remaining, inclusive >=4) produce
          different route resolutions — AUTO yields WAREHOUSE at 17 remaining days
          but DSD at 11 remaining days with transit 1 (receipt == 10, ineligible).
        test_recipe:
          setup:
            - "product shelf_life_days 30; run completed at the default clock 2026-08-01T00:00:00Z with 10 accepted cases and quality PASSED"
            - "shipment S2 planned at 2026-08-14 (remaining 17, transit 1 -> receipt 16 > 10) resolves WAREHOUSE"
            - "shipment S1 planned at 2026-08-20 (remaining 11, transit 1 -> receipt 10, not > 10) resolves DSD"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T02:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /snack-mfg/production-runs/${run_id}/start"
              as: LineOperator
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.0, lbs_fried_since_last_check: 100, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "POST /snack-mfg/production-runs/${run_id}/complete"
              payload: { lbs_produced: 100, cases_produced: 10, rejected_cases: 0, seasoning_actual_pct: 4.0 }
              as: LineOperator
            - call: "POST /snack-mfg/production-runs/${run_id}/quality-disposition"
              payload: { disposition: PASS }
              as: QualityTechnician
            - call: "POST /snack-mfg/shipments"
              payload: { run_id: "${run_id}", cases: 2, requested_route: AUTO, transit_days: 1 }
              as: RoutePlanner
              captures: { s2_id: $.data.id }
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T00:00:00Z" }
              as: PlantManager
            - call: "POST /snack-mfg/shipments/${s2_id}/plan"
              as: RoutePlanner
            - call: "POST /snack-mfg/shipments"
              payload: { run_id: "${run_id}", cases: 2, requested_route: AUTO, transit_days: 1 }
              as: RoutePlanner
              captures: { s1_id: $.data.id }
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlantManager
          trigger:
            - call: "POST /snack-mfg/shipments/${s1_id}/plan"
              as: RoutePlanner
          assert:
            - "Shipment.${s2_id}.planned_route == WAREHOUSE and freshness_days_at_plan == 17"
            - "Shipment.${s1_id}.planned_route == DSD and freshness_days_at_plan == 11"
            - "identical run data resolves differently because the WAREHOUSE variant subtracts transit_days and applies an exclusive >10 threshold while DSD applies an inclusive >=4"

  - rule_id: combinatorial_formula
    instances:
      - name: tpm_dilution_with_temp_factor_composition
        grounds:
          - calculations.tpm_degradation
          - entities.FryerOil.fields.tpm_pct
          - entities.FryerOil.fields.current_gallons
        distinguishing_aspect: |
          Mode (a): tpm_pct after TOP_OFF dilution (8.5 * 94/100 -> 7.99) then a
          4000-lb accrual at temp factor 1.5 (|186.0-180.0| = 6.0 > 5.0) yields
          19.99 — a 4-input non-linear composition (pre-tpm, gallons, top-off
          gallons, conditional temp factor); any linear or reordered evaluation
          gives a different stored value.
        test_recipe:
          setup:
            - "line oil capacity 100 (initial charge 100 gal, tpm 0.5); run of the FRYER product (target 180.0 C) started at 2026-08-02T08:00:00Z"
            - "check 1 fries 4000 lbs at exactly target temp (factor 1.0): tpm 8.5, absorbed 6.000 gal, gallons 94"
            - "TOP_OFF 6 gal at 700 cents/gal (OCC on oil version): gallons 100, tpm diluted to 7.99"
            - "check 2 fries 4000 lbs at 186.0 C (factor 1.5): tpm 19.99, gallons 94"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", lbs_planned: 8000, cases_planned: 400, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: PlantManager
            - call: "POST /snack-mfg/production-runs/${run_id}/start"
              as: LineOperator
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.2, lbs_fried_since_last_check: 4000, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "GET /snack-mfg/fryer-oils"
              as: PlantManager
              captures: { oil_id: "$.data[0].id", oil_v: "$.data[0].version" }
            - call: "POST /snack-mfg/oil-movements"
              payload: { fryer_oil_id: "${oil_id}", movement_type: TOP_OFF, gallons: 6, unit_price_cents_per_gal: 700, expected_oil_version: "${oil_v}" }
              as: LineOperator
          trigger:
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.2, lbs_fried_since_last_check: 4000, avg_fry_temp_c: 186.0 }
              as: QualityTechnician
          assert:
            - "FryerOil.${oil_id}.tpm_pct == 19.99"
            - "FryerOil.${oil_id}.current_gallons == 94"
            - "FryerOil.${oil_id}.state == ACTIVE (19.99 < 27.0 threshold not crossed)"

      - name: giveaway_final_pinned_rounding_order
        grounds:
          - calculations.giveaway_calc
          - entities.ProductionRun.fields.giveaway_final_pct
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — round each non-reject
          check's giveaway to 0.1 g FIRST (0.15 -> 0.2, 0.25 -> 0.3), then average
          (0.25), then round the percent to 2 decimals (0.25); the alternative
          order (average raw values 0.20, round at the end) yields 0.20, so the
          orders observably diverge on identical data.
        test_recipe:
          setup:
            - "product declared 100.0 g, tne 1.5 g; run started at 2026-08-02T08:00:00Z"
            - "two non-reject checks recorded: 100.15 g and 100.25 g"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", lbs_planned: 2000, cases_planned: 100, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: PlantManager
            - call: "POST /snack-mfg/production-runs/${run_id}/start"
              as: LineOperator
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.15, lbs_fried_since_last_check: 0, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.25, lbs_fried_since_last_check: 0, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
          trigger:
            - call: "GET /snack-mfg/production-runs/${run_id}"
              as: PlantManager
          assert:
            - "ProductionRun.${run_id}.giveaway_final_pct == 0.25"
            - "ProductionRun.${run_id}.giveaway_provisional_pct == 0.2 (no rejects here; provisional is the raw-mean order and lands on 0.20 while the pinned FINAL order lands on 0.25)"

      - name: margin_actual_pinned_evaluation_order
        grounds:
          - calculations.margin_calc
          - calculations.seasoning_dosing
          - entities.ProductionRun.fields.margin_standard_cents
          - entities.ProductionRun.fields.margin_actual_cents
          - entities.ProductionRun.fields.locked_oil_price_cents_per_gal
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned — accepted_cases (95, from
          rejected_cases) is fixed BEFORE oil costing, the ACTUAL oil price is the
          in-window weighted TOP_OFF average (700, not the locked 500), and each
          component rounds to integer cents at its own step; margin_standard
          (165925, locked basis at start) and margin_actual (138068) diverge on
          identical product/run parameters.
        test_recipe:
          setup:
            - "product: case_revenue 4000, seasoning target 4.0 pct, standard oil price 500, min_margin 1000"
            - "run lbs_planned 2000 / cases_planned 100 started at 2026-08-02T08:00:00Z with no prior oil movement -> locked_oil_price 500 -> margin_standard_cents 165925"
            - "one check (100.2 g, 1000 lbs at target temp), then TOP_OFF 1.5 gal at 700 inside the run window"
            - "complete with lbs_produced 2000, cases_produced 100, rejected_cases 5, seasoning_actual_pct 4.4"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_id: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_id}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", lbs_planned: 2000, cases_planned: 100, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: PlantManager
            - call: "POST /snack-mfg/production-runs/${run_id}/start"
              as: LineOperator
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run_id}", bag_weight_g: 100.2, lbs_fried_since_last_check: 1000, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "GET /snack-mfg/fryer-oils"
              as: PlantManager
              captures: { oil_id: "$.data[0].id", oil_v: "$.data[0].version" }
            - call: "POST /snack-mfg/oil-movements"
              payload: { fryer_oil_id: "${oil_id}", movement_type: TOP_OFF, gallons: 1.5, unit_price_cents_per_gal: 700, expected_oil_version: "${oil_v}" }
              as: LineOperator
            - call: "POST /snack-mfg/production-runs/${run_id}/complete"
              payload: { lbs_produced: 2000, cases_produced: 100, rejected_cases: 5, seasoning_actual_pct: 4.4 }
              as: LineOperator
          trigger:
            - call: "GET /snack-mfg/production-runs/${run_id}/cost-summary"
              as: PlantManager
          assert:
            - "cost-summary.margin_standard_cents == 165925"
            - "cost-summary.margin_actual_cents == 138068"
            - "cost-summary.margin_actual_per_case_cents == 1453"
            - "cost-summary.accepted_cases == 95"
            - "ProductionRun.${run_id}.locked_oil_price_cents_per_gal == 500 while the ACTUAL variant priced oil at 700 (weighted in-window TOP_OFF)"

  - rule_id: non_linear_state_machine
    instances:
      - name: changeover_swab_fail_cleaning_cycle
        grounds:
          - state_machines.Changeover.CLEANING_to_CLEANING
          - state_machines.Changeover.CLEANING_to_SWAB_PENDING
          - state_machines.Changeover.SWAB_PENDING_to_VALIDATED
          - state_machines.Changeover.VALIDATED_to_APPLIED
        distinguishing_aspect: |
          Changeover is cyclic: a FAIL swab loops SWAB evaluation back into
          CLEANING (swab_attempts increments, swab_result resets to null), and the
          machine only reaches the APPLIED terminal by being consumed by a run
          start — not by validation alone.
        test_recipe:
          setup:
            - "run1 of a DAIRY/CHEESE product completed on the line, so line.current_allergen_profile == [DAIRY]"
            - "run2 of an allermen-free PLAIN product created afterwards -> auto-created Changeover REQUIRED with required_level FULL_WASH (allergen removal)"
            - "begin-cleaning by op-1 -> CLEANING; swab FAIL -> back to CLEANING; swab PASS -> SWAB_PENDING; validate by qt-1 -> VALIDATED; run2 start consumes it -> APPLIED"
          setup_api_calls:
            - call: "POST /snack-mfg/products"
              payload: { name: "Cheese Puffs", process_type: FRYER, allergen_profile: [DAIRY], flavor_group: CHEESE, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_dairy: $.data.id }
            - call: "POST /snack-mfg/products"
              payload: { name: "Plain Chips", process_type: FRYER, allergen_profile: [], flavor_group: PLAIN, declared_net_weight_g: 100.0, tne_g: 1.5, giveaway_target_pct: 2.0, giveaway_max_pct: 3.0, shelf_life_days: 30, seasoning_target_pct: 4.0, fry_target_temp_c: 180.0, standard_oil_price_cents_per_gal: 500, case_revenue_cents: 4000, min_margin_cents_per_case: 1000, bags_per_case: 12 }
              as: PlantManager
              captures: { p_plain: $.data.id }
            - call: "POST /snack-mfg/lines"
              payload: { name: "Line 1", line_type: BOTH, oil_capacity_gallons: 100 }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_dairy}", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T10:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run1_id: $.data.id }
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: PlantManager
            - call: "POST /snack-mfg/production-runs/${run1_id}/start"
              as: LineOperator
            - call: "POST /snack-mfg/weight-checks"
              payload: { run_id: "${run1_id}", bag_weight_g: 100.0, lbs_fried_since_last_check: 100, avg_fry_temp_c: 180.0 }
              as: QualityTechnician
            - call: "POST /snack-mfg/production-runs/${run1_id}/complete"
              payload: { lbs_produced: 100, cases_produced: 10, rejected_cases: 0, seasoning_actual_pct: 4.0 }
              as: LineOperator
            - call: "GET /snack-mfg/lines/${line_id}"
              as: PlantManager
              captures: { line_v2: $.data.version }
            - call: "POST /snack-mfg/production-runs"
              payload: { line_id: "${line_id}", product_id: "${p_plain}", scheduled_start: "2026-08-02T12:00:00Z", scheduled_end: "2026-08-02T14:00:00Z", lbs_planned: 100, cases_planned: 10, expected_line_version: "${line_v2}" }
              as: PlantManager
              captures: { run2_id: $.data.id }
            - call: "GET /snack-mfg/changeovers"
              as: PlantManager
              captures: { co_id: "$.data[0].id" }
            - call: "POST /snack-mfg/changeovers/${co_id}/begin-cleaning"
              as: LineOperator
              as_user_id: "op-1"
            - call: "POST /snack-mfg/changeovers/${co_id}/record-swab"
              payload: { result: FAIL }
              as: QualityTechnician
              as_user_id: "qt-1"
            - call: "POST /snack-mfg/changeovers/${co_id}/record-swab"
              payload: { result: PASS }
              as: QualityTechnician
              as_user_id: "qt-1"
            - call: "POST /snack-mfg/changeovers/${co_id}/validate"
              as: QualityTechnician
              as_user_id: "qt-1"
            - call: "POST /snack-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T12:00:00Z" }
              as: PlantManager
          trigger:
            - call: "POST /snack-mfg/production-runs/${run2_id}/start"
              as: LineOperator
              as_user_id: "op-2"
          assert:
            - "Changeover.${co_id}.status == APPLIED and consumed_by_run_id == ${run2_id}"
            - "Changeover.${co_id}.swab_attempts == 2 (the FAIL loop counted)"
            - "Changeover.${co_id}.cleaned_by_user_id == op-1 and validated_by_user_id == qt-1"
            - "ProductionRun.${run2_id}.execution_status == RUNNING"

      - name: run_execution_quality_parallel_dimensions
        grounds:
