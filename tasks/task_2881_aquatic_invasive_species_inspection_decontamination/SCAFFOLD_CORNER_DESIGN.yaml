            - call: "POST /watercraft"
              payload: { registration_number: "MT-3100", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 18, last_water_body_id: "${wb_prior}" }
              as: ProgramAdmin
              captures: { wc_id: $.data.id, wc_version: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
