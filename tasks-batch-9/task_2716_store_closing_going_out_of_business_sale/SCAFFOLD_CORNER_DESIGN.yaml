      - name: lease_negotiation_cycle_bounded_by_max_rounds
        claim_type: cyclic
        grounds:
          - state_machines[LeaseDisposition].transitions[LANDLORD_COUNTERED -> OFFER_SENT]
          - validations[priority=73]
        distinguishing_aspect: "The OFFER_SENT <-> LANDLORD_COUNTERED loop must terminate at MAX_NEGOTIATION_ROUNDS (3) rather than cycling forever."
        excluded_because:
          difficulty_instance: lease_disposition_counter_offer_cycle_terminates_at_third_round
          rationale: "That difficulty instance walks the loop through all three rounds and asserts the fourth offer fails with ERR_MAX_NEGOTIATION_ROUNDS, which is exactly the cyclic-shape claim."

      - name: employee_parallel_state_dimensions_move_independently
        claim_type: parallel
        grounds:
          - state_machines[Employee]
          - complexity_profile.state_machine_shape
        distinguishing_aspect: "employment_status and bonus_status are independent dimensions: an employment action must not move the bonus dimension and a bonus settlement must not move the employment dimension."
        excluded_because:
          difficulty_instance: employee_employment_and_bonus_dimensions_advance_independently
          rationale: "That instance advances each dimension separately on the same employee and pins the resulting combined state, covering the parallel-shape claim in full."

      - name: close_selling_cascade_reaches_the_engagement_expense_split
        claim_type: Cascade down
        grounds:
          - state_machines[Store].transitions[SELLING -> CLOSED].side_effects
          - complexity_profile.complexity_layers[cascading_side_effects]
        distinguishing_aspect: "The six declared hops of close-selling must all fire in order, ending in an auto-generated PAYROLL expense that is split between the parties."
        excluded_because:
          difficulty_instance: close_selling_six_hop_chain_from_store_to_engagement_expense_split
          rationale: "That instance asserts every one of the six hops with pre-computed literals, including the auto-generated expense amount and both engagement shares."

      - name: license_revocation_cascades_into_the_engagement_projection
        claim_type: Cross-entity
        grounds:
          - state_machines[GobLicense].transitions[APPROVED -> REVOKED].side_effects
          - state_machines[Store].transitions[SELLING -> SUSPENDED].side_effects
        distinguishing_aspect: "A licence revocation must propagate through store suspension and stage closure into the store and engagement projections."
        excluded_because:
          difficulty_instance: license_revoke_five_hop_chain_from_license_to_engagement_shortfall
          rationale: "That instance pins each of the five hops, including the engagement projected_shortfall_cents figure at the end of the chain."

      - name: stage_activation_is_guarded_by_the_licence_period
        claim_type: guarded transitions
        grounds:
          - state_machines[MarkdownStage].transitions[ARMED -> ACTIVE].preconditions
          - validations[priority=52]
        distinguishing_aspect: "ARMED -> ACTIVE is guarded by a different entity's state and period: the store's APPROVED licence must cover the stage's own half-open window."
        excluded_because:
          difficulty_instance: stage_activation_requires_license_period_to_cover_that_stage_window
          rationale: "That instance activates one stage successfully and fails a second stage whose window runs one day past the licence period end, which is precisely the guarded-transition claim."

      - name: engagement_closes_when_the_final_settlement_finalizes
        claim_type: Bubble up
        grounds:
          - state_machines[Settlement].transitions[ACCEPTED -> FINALIZED].side_effects
          - state_machines[Engagement].transitions[WIND_DOWN -> CLOSED]
        distinguishing_aspect: "Finalizing the FINAL settlement is the only way the engagement reaches CLOSED, and it must also settle every APPROVED expense item."
        excluded_because:
          difficulty_instance: final_settlement_finalize_requires_every_lease_disposition_terminal
          rationale: "That instance drives the engagement all the way to CLOSED through the finalize endpoint and asserts the expense items become SETTLED, covering the bubble-up claim."

