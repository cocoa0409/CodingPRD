  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default is exactly 2026-08-01T00:00:00Z; before any set call the logical clock reads this default and never falls back to wall-clock time. All YYYY-MM-DD stamps derive from this clock's UTC date."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/blank/unknown role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not listed in the endpoint's roles" }
  - { id: ERR_WRONG_SUBCONTRACTOR, http: 403, condition: "SubcontractorRep X-User-ID is not the responsible/addressed subcontractor for this resource" }
  - { id: ERR_REVIEWER_NOT_ASSIGNED, http: 403, condition: "Reviewer X-User-ID is not the reviewer assigned to this revision/RFI" }
  - { id: ERR_PROJECT_NOT_FOUND, http: 404, condition: "projectId does not exist" }
  - { id: ERR_SPEC_SECTION_NOT_FOUND, http: 404, condition: "spec section id does not exist (or belongs to another project)" }
  - { id: ERR_SUBCONTRACTOR_NOT_FOUND, http: 404, condition: "subcontractor id does not exist in this project" }
  - { id: ERR_REVIEWER_NOT_FOUND, http: 404, condition: "reviewer id does not exist in this project" }
  - { id: ERR_SUBMITTAL_NOT_FOUND, http: 404, condition: "submittal id does not exist" }
  - { id: ERR_REVISION_NOT_FOUND, http: 404, condition: "revision id does not exist" }
  - { id: ERR_RFI_NOT_FOUND, http: 404, condition: "RFI id does not exist" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "impact assessment id does not exist" }
  - { id: ERR_ACTIVITY_NOT_FOUND, http: 404, condition: "installation activity id does not exist" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "owner report id does not exist" }
  - { id: ERR_LONG_LEAD_ITEM_NOT_FOUND, http: 404, condition: "long-lead item id does not exist" }
  - { id: ERR_DISTRIBUTION_NOT_FOUND, http: 404, condition: "distribution record id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, duplicate kind in required_submittal_kinds, or conditionally-required estimate missing at answer" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "end_date <= start_date on an activity window, or period_end < period_start on a report" }
  - { id: ERR_STALE_PROJECT_VERSION, http: 412, condition: "expected_project_version does not match Project.version (OCC)" }
  - { id: ERR_STALE_SUBMITTAL_VERSION, http: 412, condition: "expected_submittal_version does not match Submittal.version (OCC)" }
  - { id: ERR_PROJECT_NOT_ACTIVE, http: 409, condition: "Child mutation requires posture == ACTIVE (register generation also accepts SETUP)" }
  - { id: ERR_INVALID_PROJECT_STATE, http: 409, condition: "Project transition invoked from the wrong posture (e.g., activate when not SETUP, close when not CLOSEOUT, PATCH when not SETUP)" }
  - { id: ERR_SPEC_SECTION_NOT_DRAFT, http: 409, condition: "activate/PATCH requires section status == DRAFT" }
  - { id: ERR_SPEC_SECTION_NOT_ACTIVE, http: 409, condition: "lock requires section status == ACTIVE" }
  - { id: ERR_SUBMITTAL_NOT_ACCEPTING_REVISIONS, http: 409, condition: "New revision requires review_status IN {REGISTERED, RETURNED_NEEDS_RESUBMIT}" }
  - { id: ERR_SUBMITTAL_NOT_APPROVED, http: 409, condition: "release-for-construction requires review_status == APPROVED" }
  - { id: ERR_SUBMITTAL_NOT_DISTRIBUTED, http: 409, condition: "close requires review_status == DISTRIBUTED" }
  - { id: ERR_SUBMITTAL_TERMINAL, http: 409, condition: "Operation targets a VOID or CLOSED submittal (revision create, RFI link, void again)" }
  - { id: ERR_REVISION_NOT_SUBMITTED, http: 409, condition: "route requires revision status == SUBMITTED" }
  - { id: ERR_REVISION_NOT_UNDER_REVIEW, http: 409, condition: "return requires revision status == UNDER_REVIEW" }
  - { id: ERR_RFI_INVALID_STATE, http: 409, condition: "RFI transition invoked from a wrong status (route requires OPEN, answer requires ROUTED, reopen/close/distribute require ANSWERED, void excludes terminal)" }
  - { id: ERR_ASSESSMENT_NOT_ESTIMATED, http: 409, condition: "price requires assessment status == ESTIMATED" }
  - { id: ERR_ASSESSMENT_NOT_PRICED, http: 409, condition: "accept/waive/dispute require PRICED; reprice requires DISPUTED" }
  - { id: ERR_DISTRIBUTION_NOT_QUEUED, http: 409, condition: "send requires record status == QUEUED" }
  - { id: ERR_DISTRIBUTION_NOT_SENT, http: 409, condition: "acknowledge requires record status == SENT" }
  - { id: ERR_ACTIVITY_NOT_PLANNED, http: 409, condition: "release requires activity status == PLANNED" }
  - { id: ERR_ACTIVITY_NOT_RELEASED, http: 409, condition: "complete requires activity status == RELEASED" }
  - { id: ERR_REPORT_NOT_DRAFT, http: 409, condition: "publish requires report status == DRAFT" }
  - { id: ERR_DEFERRAL_NOT_PENDING, http: 409, condition: "decide-deferral requires deferral_status == DEFERRAL_REQUESTED; request-deferral requires deferral_status == NONE" }
  - { id: ERR_LLI_INVALID_ADVANCE, http: 409, condition: "advance target is not exactly the next procurement step" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "accept invoked by the same X-User-ID that priced the assessment" }
  - { id: ERR_SUBCONTRACTOR_SUSPENDED, http: 409, condition: "Responsible subcontractor standing == SUSPENDED blocks new revision submissions" }
  - { id: ERR_DISCIPLINE_MISMATCH, http: 409, condition: "Explicit reviewer_id whose discipline != required discipline of the section/RFI" }
  - { id: ERR_REVIEWER_AT_CAPACITY, http: 409, condition: "Explicit reviewer_id whose open_review_count >= review_capacity" }
  - { id: ERR_NO_ELIGIBLE_REVIEWER, http: 409, condition: "reviewer_selector candidate set is empty (no ACTIVE reviewer of the discipline below capacity)" }
  - { id: ERR_ALREADY_DISTRIBUTED, http: 409, condition: "distribute called when RFI distribution records already exist" }
  - { id: ERR_NO_DISTRIBUTION_TARGETS, http: 409, condition: "RFI affected-subcontractor set is empty" }
  - { id: ERR_CREW_WINDOW_CONFLICT, http: 409, condition: "crew_window_conflict_check failed for the subcontractor's committed windows" }
  - { id: ERR_SUBMITTAL_NOT_RELEASED, http: 409, condition: "Installation release requires governing submittal review_status IN {RELEASED, DISTRIBUTED, CLOSED}" }
  - { id: ERR_OPEN_RFI_BLOCKS_RELEASE, http: 409, condition: "Installation release blocked by an OPEN or ROUTED RFI referencing the governing submittal" }
  - { id: ERR_OPEN_RFI_BLOCKS_CLOSE, http: 409, condition: "Submittal close blocked by an OPEN or ROUTED RFI referencing it" }
  - { id: ERR_LONG_LEAD_NOT_DELIVERED, http: 409, condition: "Installation release on a long-lead submittal requires LongLeadItem.status == DELIVERED" }
  - { id: ERR_CLOSEOUT_BLOCKED, http: 409, condition: "begin-closeout precondition failed (open submittals/RFIs/assessments/records/activities/DRAFT reports)" }
  - { id: ERR_ASSESSMENT_OPEN_ON_CLOSE, http: 409, condition: "RFI close blocked by a non-terminal ImpactAssessment" }
  - { id: ERR_REOPEN_BLOCKED_BY_PRICED_ASSESSMENT, http: 409, condition: "RFI reopen blocked while an ImpactAssessment holds a reservation (PRICED or DISPUTED); waive or accept it first" }
  - { id: ERR_CONTINGENCY_EXHAUSTED, http: 402, condition: "Reservation would make contingency_available_cents negative" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; owns project creation/settings and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /v1/projects"
      - "PATCH /v1/projects/{id}"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: ProjectManager
    description: "GC project manager; lifecycle transitions, expediting, impact acceptance, daily scan, voids, activity release"
    identity: opaque
    exclusive_operations:
      - "POST /v1/projects/{id}/activate | suspend | resume | begin-closeout | close | run-daily-scan"
      - "POST /v1/projects/{id}/reviewers, PATCH /v1/reviewers/{id}"
      - "POST /v1/submittals/{id}/void, POST /v1/submittals/{id}/decide-deferral"
      - "POST /v1/long-lead-items/{id}/expedite"
      - "POST /v1/rfis/{id}/void"
      - "POST /v1/impact-assessments/{id}/accept | waive"
      - "POST /v1/installation-activities/{id}/release | cancel"
    shared_operations: ["all GET endpoints"]

  - name: ProjectEngineer
    description: "GC project engineer; builds the register, routes reviews/RFIs, distributes, prices impacts, publishes owner reports"
    identity: opaque
    exclusive_operations:
      - "POST /v1/projects/{id}/spec-sections (+ PATCH/activate/lock)"
      - "POST /v1/projects/{id}/subcontractors"
      - "PATCH /v1/submittals/{id}, POST /v1/submittals/{id}/request-deferral | release-for-construction | close"
      - "POST /v1/revisions/{id}/route"
      - "POST /v1/projects/{id}/rfis, POST /v1/rfis/{id}/route | reopen | distribute | close"
      - "POST /v1/impact-assessments/{id}/price | reprice"
      - "POST /v1/distribution-records/{id}/send"
      - "POST /v1/projects/{id}/installation-activities, POST /v1/installation-activities/{id}/complete"
      - "POST /v1/projects/{id}/owner-reports, POST /v1/owner-reports/{id}/publish"
      - "PATCH /v1/long-lead-items/{id}, POST /v1/long-lead-items/{id}/advance"
    shared_operations: ["all GET endpoints"]

  - name: Reviewer
    description: "Design-team reviewer (architect/engineer); returns submittal revisions and answers RFIs assigned to them"
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /v1/revisions/{id}/return"
      - "POST /v1/rfis/{id}/answer"
    shared_operations: ["all GET endpoints"]

  - name: SubcontractorRep
    description: "Subcontractor representative; submits revisions for own sections, raises RFIs, acknowledges distributions addressed to their company"
    identity: "entity_backed:Subcontractor"
    exclusive_operations:
      - "POST /v1/submittals/{id}/revisions"
      - "POST /v1/distribution-records/{id}/acknowledge"
    shared_operations: ["POST /v1/projects/{id}/rfis (shared with ProjectEngineer)", "all GET endpoints"]

  - name: OwnerRep
    description: "Owner representative; receives reports, disputes priced impacts"
    identity: opaque
    exclusive_operations:
      - "POST /v1/impact-assessments/{id}/dispute"
    shared_operations: ["all GET endpoints"]
