        claim_type: rbac_deny
        grounds: ["validations[priority=6]", "errors[ERR_SELF_ACTION_FORBIDDEN]", roles]
        distinguishing_aspect: "Segregation of duties: the same CoveredPerson id that owns the request cannot decide it, even though ComplianceOfficer is the correct role — ERR_SELF_ACTION_FORBIDDEN (403), not ERR_UNAUTHORIZED."
