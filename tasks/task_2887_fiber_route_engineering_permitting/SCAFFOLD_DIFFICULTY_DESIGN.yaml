              as: RouteEngineer
              captures: { seg_id: $.data.id }
            - call: "POST /walkouts"
              payload: { segment_id: "${seg_id}", walked_on: "2026-08-11", obstruction_count: 0, conduit_available_confirmed: false, surveyor_note: "first pass" }
              as: FieldSurveyor
              captures: { wo1_id: $.data.id }
            - call: "POST /pole-observations"
              payload: { walkout_id: "${wo1_id}", pole_tag: "P-001", pole_owner: "TELCO", condition_grade: "A", available_vertical_clearance_in: 48, existing_attachment_count: 2 }
              as: FieldSurveyor
            - call: "POST /walkouts/${wo1_id}/submit"
              payload: {}
              as: FieldSurveyor
            - call: "POST /walkouts/${wo1_id}/review"
              payload: { decision: "ACCEPTED" }
              as: RouteEngineer
              as_user_id: "eng-alice"
            - call: "GET /routes/${route_id}"
              payload: {}
              as: RouteEngineer
              captures: { rv1: $.data.version }
            - call: "POST /segments/${seg_id}/construction-method"
              payload: { method: "AERIAL", expected_route_version: "${rv1}" }
              as: RouteEngineer
            - call: "POST /segments/${seg_id}/bid-ready-estimate"
              payload: {}
              as: RouteEngineer
            - call: "POST /routes/${route_id}/lock-scope"
              payload: {}
