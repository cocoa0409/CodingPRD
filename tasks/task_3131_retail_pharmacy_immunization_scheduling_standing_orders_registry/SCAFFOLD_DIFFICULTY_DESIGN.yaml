            - "VaccineLot.${lot_l1}.status == QUARANTINED after the 9.5C excursion reading (second cycle entry, reason EXCURSION)"
            - "captured lot_status_retired == RETIRED and lot_doses_retired == 0 (write-off)"
            - "second retire trigger returns 409 ERR_LOT_NOT_RETIRABLE — RETIRED is terminal and the cycle cannot re-open"

  # ===========================================================================
  # Rule 4 — transitive_cascade (≥2 instances, depth ≥3 and ≥2, DIFFERENT triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: administer_fanin_chain_appointment_record_lot_registry_observation_event
        grounds:
          - state_machines.ImmunizationAppointment.CONSENTED_to_VACCINATED
          - state_machines.ClinicEvent.PLANNED_to_ACTIVE
          - calculations.adjudicated_charge
          - calculations.clinic_event_reconciliation
        distinguishing_aspect: |
          Depth-3 chain originating from the administer trigger: administer →
          (hop 1) ImmunizationRecord created with adjudicated charge AND
          VaccineLot.doses_available decremented → (hop 2) the record creation
          itself spawns RegistrySubmission (PENDING, due_at computed) AND
          ObservationSession (IN_PROGRESS, required_minutes derived) → (hop 3)
          because the appointment is attached to an ACTIVE ClinicEvent, the
          event's doses_administered increments — a value later consumed by the
          reconciliation calculation at close. Each hop is caused by the
          previous hop's mutation, not by the original request.
        test_recipe:
          setup:
            - "Store S (CA); product FLU cvx 141 cash 5000; protocol CA+FLU deadline 24h; high-risk patient P4 (30-min observation)"
            - "Lot L1 of FLU, RELEASED, 10 doses; ClinicEvent E created PLANNED on lot L1 with doses_reserved 4, window 10:00–12:00"
            - "Clock advanced into the event window → E ACTIVE → lot.doses_available 10 − 4 = 6 (checkout)"
            - "Walk-in appointment for P4 at 11:00 consented and ready to administer against lot L1 with clinic_event_id E"
          setup_api_calls:
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: StoreManager
            - call: "POST /immunization/stores"
              payload: { store_number: "S-700", state_code: "CA", address_line: "7 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0, observation_minutes: 15 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_flu}", authority_type: "STANDING_ORDER", min_patient_age_years: 0, registry_format: "FLAT_FILE_CSV", registry_deadline_hours: 24, max_doses_per_patient_per_day: 2 }
              as: ComplianceOfficer
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat Four", date_of_birth: "1980-01-01", state_code: "CA", high_risk_flag: true }
              as: PharmacyTechnician
              captures: { pat_p4: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 10 }
              as: StoreManager
              captures: { lot_l1: $.data.id }
            - call: "POST /immunization/clinic-events"
              payload: { store_id: "${store_s}", employer_name: "Acme Corp", event_start: "2026-09-01T10:00:00Z", event_end: "2026-09-01T12:00:00Z", mobile_lot_id: "${lot_l1}", doses_reserved: 4 }
              as: StoreManager
              captures: { event_e: $.data.id }
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:30:00Z" }
              as: StoreManager
            - call: "GET /immunization/clinic-events/${event_e}"
              as: StoreManager
              captures: { event_status: $.data.status }
            - call: "GET /immunization/lots/${lot_l1}"
              as: StoreManager
              captures: { lot_avail_after_checkout: $.data.doses_available, lot_v_after_checkout: $.data.version }
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p4}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-01T11:00:00Z", is_walk_in: true }
              as: PharmacyTechnician
              captures: { appt_a: $.data.id, appt_a_v: $.data.version }
            - call: "POST /immunization/appointments/${appt_a}/check-in"
              as: PharmacyTechnician
              as_user_id: "user-tech-1"
            - call: "POST /immunization/appointments/${appt_a}/questionnaire"
              payload: { answers: { FEVER_TODAY: false, PREGNANT: false, IMMUNOCOMPROMISED: false, PRIOR_ANAPHYLAXIS: false } }
              as: PharmacyTechnician
            - call: "POST /immunization/appointments/${appt_a}/review-consent"
              payload: { expected_appointment_version: "${appt_a_v + 2}", outcome: "CLEAR" }
              as: Pharmacist
              as_user_id: "user-pharm-1"
          trigger:
            - call: "POST /immunization/appointments/${appt_a}/administer"
              payload: { lot_id: "${lot_l1}", expected_lot_version: "${lot_v_after_checkout}", clinic_event_id: "${event_e}" }
              as: Immunizer
              as_user_id: "user-imm-1"
              captures: { rec_id: $.data.id, rec_charge: $.data.charge_cents, rec_channel: $.data.billing_channel }
            - call: "GET /immunization/immunization-records/${rec_id}/registry-submissions"
              as: ComplianceOfficer
              captures: { sub_status: "$.data[0].status", sub_due: "$.data[0].due_at" }
            - call: "GET /immunization/immunization-records/${rec_id}/observation-sessions"
              as: Pharmacist
              captures: { obs_status: "$.data[0].status", obs_minutes: "$.data[0].required_minutes" }
            - call: "GET /immunization/clinic-events/${event_e}"
              as: StoreManager
              captures: { event_admin: $.data.doses_administered }
            - call: "GET /immunization/lots/${lot_l1}"
              as: StoreManager
              captures: { lot_avail_final: $.data.doses_available }
          assert:
            - "captured rec_charge == 5000 and rec_channel == CASH (no insurance on P4)"
            - "captured lot_avail_after_checkout == 6 (10 − 4 reserved at activation)"
            - "captured lot_avail_final == 5 (6 − 1 administered; the reserved pool is not double-charged)"
            - "captured sub_status == PENDING and sub_due == 2026-09-02T10:30:00Z (administered 10:30 + 24h)"
            - "captured obs_status == IN_PROGRESS and obs_minutes == 30 (high_risk_flag overrides product.observation_minutes 15)"
            - "captured event_admin == 1 (hop 3: the event counter moved because the record was created under it)"

      - name: excursion_quarantine_cascade_to_release_and_cumulative_regrade
        grounds:
          - state_machines.VaccineLot.RELEASED_to_QUARANTINED
          - state_machines.VaccineLot.QUARANTINED_to_RELEASED
          - calculations.excursion_severity_charge.variants.cumulative_excursion_minutes
          - state_machines.ImmunizationAppointment.SCREENED_to_CONSENTED
        distinguishing_aspect: |
          Depth-2 chain originating from a different trigger (temperature
          reading post, not administer): excursion reading → (hop 1)
          VaccineLot auto-QUARANTINED with severity tier computed → (hop 2)
          the quarantined lot fails review-consent's eligible-lot precondition
          for a SCREENED appointment at the same store, blocking the
          appointment's CONSENTED transition with ERR_NO_ELIGIBLE_LOT — the
          reading's mutation, not the review request, removed eligibility.
        test_recipe:
          setup:
            - "Store S (CA); product FLU cvx 141 fridge band 2.0–8.0C; protocol ACTIVE; adult patient P5"
            - "Lot L1 is the ONLY lot of FLU at S (RELEASED, 5 doses)"
            - "Appointment A for P5 walked through check-in and questionnaire to SCREENED"
            - "A temperature reading of 12.0C is posted against L1 (delta 4.0 → MODERATE excursion)"
          setup_api_calls:
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:55:00Z" }
              as: StoreManager
            - call: "POST /immunization/stores"
              payload: { store_number: "S-800", state_code: "CA", address_line: "8 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0, observation_minutes: 15 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_flu}", authority_type: "STANDING_ORDER", min_patient_age_years: 0, registry_format: "HL7_VXU", registry_deadline_hours: 24, max_doses_per_patient_per_day: 2 }
              as: ComplianceOfficer
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat Five", date_of_birth: "1980-01-01", state_code: "CA" }
              as: PharmacyTechnician
              captures: { pat_p5: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 5 }
              as: StoreManager
              captures: { lot_l1: $.data.id }
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p5}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-01T10:00:00Z", is_walk_in: true }
              as: PharmacyTechnician
              captures: { appt_a: $.data.id, appt_a_v: $.data.version }
            - call: "POST /immunization/appointments/${appt_a}/check-in"
              as: PharmacyTechnician
              as_user_id: "user-tech-1"
            - call: "POST /immunization/appointments/${appt_a}/questionnaire"
              payload: { answers: { FEVER_TODAY: false, PREGNANT: false, IMMUNOCOMPROMISED: false, PRIOR_ANAPHYLAXIS: false } }
              as: PharmacyTechnician
            - call: "GET /immunization/appointments/${appt_a}"
              as: Pharmacist
              captures: { appt_v_now: $.data.version }
            - call: "POST /immunization/lots/${lot_l1}/temperature-readings"
              payload: { recorded_at: "2026-09-01T09:58:00Z", temperature_c: 12.0 }
              as: StoreManager
              captures: { reading_tier: $.data.excursion_severity_tier }
          trigger:
            - call: "POST /immunization/appointments/${appt_a}/review-consent"
              payload: { expected_appointment_version: "${appt_v_now}", outcome: "CLEAR" }
              as: Pharmacist
              as_user_id: "user-pharm-1"
          assert:
            - "captured reading_tier == MODERATE (delta 12.0 − 8.0 = 4.0; 2.0 < 4.0 <= 5.0)"
            - "VaccineLot.${lot_l1}.status == QUARANTINED with quarantine_reason == EXCURSION (hop 1)"
            - "review-consent trigger returns 409 ERR_NO_ELIGIBLE_LOT — hop 2: the lot's quarantine, caused by the reading, removed the appointment's only eligible lot"
            - "ImmunizationAppointment.${appt_a}.status remains SCREENED after the failed review"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2 instances, DIFFERENT category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: review_consent_stale_occ_beats_contraindication
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - concurrency_rules[questionnaire-review-stale-appointment]
          - errors[ERR_STALE_APPOINTMENT_VERSION]
          - errors[ERR_CONTRAINDICATION_DETECTED]
        distinguishing_aspect: |
          Category pair state(OCC, priority 4) vs business_safety
          (contraindication, priority 6): a review-consent request that BOTH
          carries a stale expected_appointment_version AND belongs to a
          questionnaire with contraindication_detected = true must return 412
          ERR_STALE_APPOINTMENT_VERSION, never the 422 safety error — the OCC
          gate runs before any business rule.
        test_recipe:
          setup:
            - "Store S (CA); product FLU; protocol ACTIVE; patient P6 with allergy_flags [EGG] (a hard contraindication for FLU)"
            - "Lot L1 RELEASED 5 doses; walk-in appointment A at 10:00; checked in; questionnaire submitted (contraindication_detected computed true)"
            - "Pharmacist captured appointment version BEFORE the questionnaire call, so the version they hold is one behind"
          setup_api_calls:
            - call: "POST /immunization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:55:00Z" }
              as: StoreManager
            - call: "POST /immunization/stores"
              payload: { store_number: "S-900", state_code: "CA", address_line: "9 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0, observation_minutes: 15 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/state-protocols"
              payload: { state_code: "CA", vaccine_product_id: "${prod_flu}", authority_type: "STANDING_ORDER", min_patient_age_years: 0, registry_format: "HL7_VXU", registry_deadline_hours: 24, max_doses_per_patient_per_day: 2 }
              as: ComplianceOfficer
            - call: "POST /immunization/patients"
              payload: { full_name: "Pat Six", date_of_birth: "1980-01-01", state_code: "CA", allergy_flags: ["EGG"] }
              as: PharmacyTechnician
              captures: { pat_p6: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 5 }
              as: StoreManager
            - call: "POST /immunization/appointments"
              payload: { store_id: "${store_s}", patient_id: "${pat_p6}", vaccine_product_id: "${prod_flu}", slot_start: "2026-09-01T10:00:00Z", is_walk_in: true }
              as: PharmacyTechnician
              captures: { appt_a: $.data.id, appt_a_v: $.data.version }
            - call: "POST /immunization/appointments/${appt_a}/check-in"
              as: PharmacyTechnician
              as_user_id: "user-tech-1"
            - call: "GET /immunization/appointments/${appt_a}"
              as: Pharmacist
              captures: { appt_v_stale: $.data.version }
            - call: "POST /immunization/appointments/${appt_a}/questionnaire"
              payload: { answers: { FEVER_TODAY: false, PREGNANT: false, IMMUNOCOMPROMISED: false, PRIOR_ANAPHYLAXIS: false } }
              as: PharmacyTechnician
          trigger:
            - call: "POST /immunization/appointments/${appt_a}/review-consent"
              payload: { expected_appointment_version: "${appt_v_stale}", outcome: "CLEAR" }
              as: Pharmacist
              as_user_id: "user-pharm-1"
          assert:
            - "trigger returns HTTP 412 with error_id ERR_STALE_APPOINTMENT_VERSION (questionnaire bumped the appointment version past ${appt_v_stale})"
            - "the response is NOT 422 ERR_CONTRAINDICATION_DETECTED even though the questionnaire's contraindication_detected == true — priority 4 (state/OCC) beats priority 6 (business_safety)"
            - "ImmunizationAppointment.${appt_a}.status remains SCREENED"

      - name: clinic_event_create_insufficient_doses_beats_over_reservation
        grounds:
          - validations[priority=15]
          - validations[priority=16]
          - errors[ERR_INSUFFICIENT_DOSES]
          - errors[ERR_MOBILE_LOT_OVER_RESERVED]
        distinguishing_aspect: |
          Category pair business_fiscal (raw capacity, priority 15) vs
          business_constraint (overlapping-reservation aggregate, priority
          16): a new event whose doses_reserved exceeds the lot's
          doses_available outright AND would also break the overlapping-window
          aggregate must return 422 ERR_INSUFFICIENT_DOSES — the raw-capacity
          check is checked first even though both rules would fire.
        test_recipe:
          setup:
            - "Store S (CA); product FLU; lot L1 RELEASED with doses_available 10, expires 2027-01-01"
            - "Existing PLANNED event E1 on lot L1: window 10:00–12:00, doses_reserved 6"
            - "New event E2 request: window 11:00–13:00 (overlaps E1), doses_reserved 11 — exceeds raw capacity 10 (priority 15) and also 11 > 10 − 6 = 4 (priority 16)"
          setup_api_calls:
            - call: "POST /immunization/stores"
              payload: { store_number: "S-1000", state_code: "CA", address_line: "10 Main St" }
              as: StoreManager
              captures: { store_s: $.data.id }
            - call: "POST /immunization/vaccine-products"
              payload: { cvx_code: "141", name: "Influenza Quadrivalent", min_patient_age_years: 0, doses_per_series: 1, cash_price_cents: 5000, fridge_temp_min_c: 2.0, fridge_temp_max_c: 8.0, observation_minutes: 15 }
              as: ComplianceOfficer
              captures: { prod_flu: $.data.id }
            - call: "POST /immunization/stores/${store_s}/lots"
              payload: { vaccine_product_id: "${prod_flu}", lot_number: "L1", expiration_date: "2027-01-01", doses_received: 10 }
              as: StoreManager
              captures: { lot_l1: $.data.id }
            - call: "POST /immunization/clinic-events"
              payload: { store_id: "${store_s}", employer_name: "Acme Corp", event_start: "2026-09-01T10:00:00Z", event_end: "2026-09-01T12:00:00Z", mobile_lot_id: "${lot_l1}", doses_reserved: 6 }
              as: StoreManager
              captures: { event_e1: $.data.id }
          trigger:
            - call: "POST /immunization/clinic-events"
              payload: { store_id: "${store_s}", employer_name: "Beta LLC", event_start: "2026-09-01T11:00:00Z", event_end: "2026-09-01T13:00:00Z", mobile_lot_id: "${lot_l1}", doses_reserved: 11 }
              as: StoreManager
          assert:
            - "trigger returns HTTP 422 with error_id ERR_INSUFFICIENT_DOSES (11 > 10 raw capacity)"
            - "the response is NOT ERR_MOBILE_LOT_OVER_RESERVED even though 11 > 10 − 6 also holds — priority 15 (business_fiscal) beats priority 16 (business_constraint)"

  # ===========================================================================
