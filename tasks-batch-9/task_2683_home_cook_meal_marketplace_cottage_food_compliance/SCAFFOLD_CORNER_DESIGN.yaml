              payload: {}
              as: SafetyOfficer
              as_user_id: so-2
              captures: { score_8w: "$.data.safety_score", prov_8w: "$.data.provisional_safety_score", standing_8w: "$.data.compliance_standing" }
          assert:
            - "${score_1} == 88 and ${standing_1} == CLEAR: a single MODERATE charge of 12 keeps the cook in the CLEAR band, so no standing transition fires even though safety_score is rewritten"
            - "${score_after} == 63, ${standing_after} == WARNED, ${reason_after} == SAFETY_SCORE_WARN (12 + 25 = 37 at decay 1.00)"
            - "${score_7w} == 63 and ${standing_7w} == WARNED: at 55 days the incidents are floor(55/7) == 7 whole weeks old, still below DECAY_STEP_1_WEEKS"
            - "${score_8w} == 81 and ${standing_8w} == CLEAR: at 56 days weeks == 8, decay 0.50, charge 18.5, round_half_up(18.5) == 19, 100 - 19 == 81"
