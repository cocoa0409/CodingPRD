              captures: { dev_id: $.data.id }
            - call: "POST /api/developers/${dev_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/apps"
              payload: { developer_id: "${dev_id}", name: "RBAC App", category: "GAMES", listed_countries: ["US"] }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /api/policy-cases"
              payload: { app_id: "${app_id}", category: "MALWARE", severity: "HIGH" }
