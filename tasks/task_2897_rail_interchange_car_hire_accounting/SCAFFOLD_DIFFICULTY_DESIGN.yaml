# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2897_rail_interchange_car_hire_accounting
#
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1-§1.7.
# Every numeric literal in `assert:` was produced by executing the relevant
# calculations[].formula with the declared global_constants and the CarType XM
# rate row that each setup chain creates.
#
# Shared fixture conventions (re-created from empty DB inside every instance):
#   railroads     BN "Bear Northern Railway", CX "Coast Express Lines",
#                 NS "North Summit RR" (only where a third road is needed)
#   car type      XM: PER_DIEM, free_time_hours 4, per_diem_rate_cents 2350,
#                 tier2_threshold_days 2, tier2_per_diem_rate_cents 3100,
#                 mileage_rate_millicents_per_mile 2350, loaded_mileage_only true
#   junctions     JCT-CHI (CX,BN), JCT-STL (CX,BN), JCT-DEN (NS,BN)
#   clock         starts at the server default 2026-08-01T00:00:00Z and is driven
#                 forward only by POST /_clock/set_current_utc
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: settlement_statement_as_reported_vs_reconciled_diverge_by_4676
        grounds:
          - calculations.settlement_statement
          - calculations.clearinghouse_fee
          - entities.SettlementCycle.fields.as_reported_net_cents
          - entities.SettlementCycle.fields.reconciled_net_cents
          - entities.SettlementCycle.fields.dispute_adjustment_cents
          - state_machines.Dispute.OPEN_to_ACCEPTED
        distinguishing_aspect: |
          The SAME three-line cycle, read with variant AS_REPORTED, nets 18614 and,
          read with variant RECONCILED after one accepted dispute of 4700, nets 13938 —
          a divergence of 4676, not 4700, because the clearinghouse fee is re-tiered on
          the smaller basis (94 vs 70). This instance lives in the money/settlement
          domain; the second dual_variant_calc instance lives in the repair-liability
          domain and produces a different responsible RAILROAD rather than a different
          amount.
        test_recipe:
          setup:
            - "Railroads BN and CX registered and ACTIVE; car type XM registered; junction JCT-CHI connects CX and BN."
            - "Three CX-owned cars each make one round trip onto BN and back, producing three CLOSED BN-handled segments with net_hire_cents 8775, 5233 and 4700."
            - "Settlement cycle for payer BN / payee CX, period 2026-08, computed at logical time 2026-09-01T00:00:00Z and exchanged."
            - "BN disputes the 4700 empty-movement line for its full amount and CX accepts it from OPEN with no counter."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
              as: ClearinghouseAdmin
              captures: { jct_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100001", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car1_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100002", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car2_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100003", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car3_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-29T10:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car1_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-26T06:00:00Z", odometer_miles: 12000, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car1_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${bn_id}", receiving_road_id: "${cx_id}", interchange_at: "2026-08-29T10:00:00Z", odometer_miles: 12415, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${bn_id}"
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car2_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-27T00:00:00Z", odometer_miles: 5000, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car2_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${bn_id}", receiving_road_id: "${cx_id}", interchange_at: "2026-08-28T12:00:00Z", odometer_miles: 5227, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${bn_id}"
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car3_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-27T06:00:00Z", odometer_miles: 800, load_status: "EMPTY" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car3_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${bn_id}", receiving_road_id: "${cx_id}", interchange_at: "2026-08-28T18:00:00Z", odometer_miles: 990, load_status: "EMPTY" }
              as: InterchangeClerk
              as_user_id: "${bn_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/settlement-cycles"
              payload: { payer_road_id: "${bn_id}", payee_road_id: "${cx_id}", period_month: "2026-08" }
              as: CarHireAccountant
              as_user_id: "${cx_id}"
              captures: { cycle_id: "$.data.id" }
            - call: "POST /car-hire/settlement-cycles/${cycle_id}/compute"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${cx_id}"
            - call: "POST /car-hire/settlement-cycles/${cycle_id}/exchange"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${cx_id}"
            - call: "GET /car-hire/hire-movements?car_id=${car3_id}&handling_road_id=${bn_id}&status=CLOSED"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${bn_id}"
              captures: { m3_id: "$.data[0].id" }
            - call: "GET /car-hire/settlement-cycles/${cycle_id}"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${bn_id}"
              captures: { cyc_v: "$.data.version" }
            - call: "POST /car-hire/disputes"
              payload: { settlement_cycle_id: "${cycle_id}", movement_id: "${m3_id}", dispute_reason: "HIRE_RATE_MISAPPLIED", disputed_amount_cents: 4700, expected_cycle_version: "${cyc_v}" }
              as: CarHireAccountant
              as_user_id: "${bn_id}"
              captures: { dispute_id: "$.data.id" }
            - call: "POST /car-hire/disputes/${dispute_id}/accept"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${cx_id}"
          trigger:
            - call: "GET /car-hire/settlement-cycles/${cycle_id}/statement?variant=AS_REPORTED"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${cx_id}"
              captures: { as_reported_net: "$.data.net_settlement_cents" }
            - call: "GET /car-hire/settlement-cycles/${cycle_id}/statement?variant=RECONCILED"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${cx_id}"
              captures: { reconciled_net: "$.data.net_settlement_cents" }
          assert:
            - "statement(AS_REPORTED).movement_line_count == 3"
            - "statement(AS_REPORTED).gross_hire_cents == 18708"
            - "statement(AS_REPORTED).dispute_adjustment_cents == 0"
            - "statement(AS_REPORTED).pre_fee_net_cents == 18708"
            - "statement(AS_REPORTED).clearinghouse_fee_cents == 94"
            - "statement(AS_REPORTED).net_settlement_cents == 18614"
            - "statement(RECONCILED).dispute_adjustment_cents == -4700"
            - "statement(RECONCILED).pre_fee_net_cents == 14008"
            - "statement(RECONCILED).clearinghouse_fee_cents == 70"
            - "statement(RECONCILED).net_settlement_cents == 13938"
            - "18614 - 13938 == 4676 and 4676 != 4700 (the fee re-tiered from 94 to 70)"
            - "Dispute.${dispute_id}.status == ACCEPTED and Dispute.${dispute_id}.resolution_amount_cents == 4700"
            - "CarHireMovement.${m3_id}.net_hire_cents == 4700 and CarHireMovement.${m3_id}.adjusted_net_hire_cents == 0"
            - "SettlementCycle.${cycle_id}.as_reported_net_cents == 18614 and SettlementCycle.${cycle_id}.reconciled_net_cents == 13938"

      - name: repair_responsibility_handling_line_vs_owner_rule_picks_different_road
        grounds:
          - calculations.repair_responsibility_determination
          - calculations.repair_bill_amount
          - entities.RepairBill.fields.defect_class
          - entities.RepairBill.fields.responsibility_rule_applied
          - state_machines.RepairBill.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Two bills identical in car, custody history, defect_occurred_at, labor_hours
          and material_cents differ ONLY in defect_class; HANDLING_DAMAGE resolves
          responsible_road_id to the handling road BN (== billing road, so
          handling_fee_cents 0 and total_cents 45250) while NORMAL_WEAR resolves it to
          the owner road CX (!= billing road, so handling_fee_cents 3394 and
          total_cents 48644). The variant switch changes an IDENTIFIER, not just an
          amount — that is what separates this instance from the settlement-statement one.
        test_recipe:
          setup:
            - "Railroads BN and CX ACTIVE; car type XM; junction JCT-CHI connects CX and BN."
            - "CX-owned car CX 100004 is delivered to BN at 2026-08-26T00:00:00Z, so BN's segment is OPEN and covers 2026-08-26T12:00:00Z."
            - "BN reports the car bad-order at 2026-08-27T00:00:00Z, then drafts two bills against it: one HANDLING_DAMAGE, one NORMAL_WEAR, both labor_hours 3.5 and material_cents 12000, both billed by BN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
              as: ClearinghouseAdmin
              captures: { jct_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100004", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car4_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-26T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car4_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-26T00:00:00Z", odometer_miles: 4000, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-27T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/cars/${car4_id}/bad-order-report"
              payload: { reported_at: "2026-08-27T00:00:00Z", defect_code: "WHEEL-FLAT" }
              as: InterchangeClerk
              as_user_id: "${bn_id}"
            - call: "POST /car-hire/repair-bills"
              payload: { car_id: "${car4_id}", billing_road_id: "${bn_id}", defect_code: "WHEEL-FLAT", defect_class: "HANDLING_DAMAGE", defect_occurred_at: "2026-08-26T12:00:00Z", labor_hours: 3.5, material_cents: 12000 }
              as: RepairBillingAgent
              as_user_id: "${bn_id}"
              captures: { bill_dmg_id: "$.data.id" }
            - call: "POST /car-hire/repair-bills"
              payload: { car_id: "${car4_id}", billing_road_id: "${bn_id}", defect_code: "WHEEL-FLAT", defect_class: "NORMAL_WEAR", defect_occurred_at: "2026-08-26T12:00:00Z", labor_hours: 3.5, material_cents: 12000 }
              as: RepairBillingAgent
              as_user_id: "${bn_id}"
              captures: { bill_wear_id: "$.data.id" }
          trigger:
            - call: "POST /car-hire/repair-bills/${bill_dmg_id}/submit"
              payload: {}
              as: RepairBillingAgent
              as_user_id: "${bn_id}"
            - call: "POST /car-hire/repair-bills/${bill_wear_id}/submit"
              payload: {}
              as: RepairBillingAgent
              as_user_id: "${bn_id}"
          assert:
            - "RepairBill.${bill_dmg_id}.responsibility_rule_applied == HANDLING_LINE_RULE"
            - "RepairBill.${bill_dmg_id}.responsible_road_id == ${bn_id}"
            - "RepairBill.${bill_dmg_id}.labor_cents == 33250"
            - "RepairBill.${bill_dmg_id}.subtotal_cents == 45250"
            - "RepairBill.${bill_dmg_id}.handling_fee_cents == 0"
            - "RepairBill.${bill_dmg_id}.total_cents == 45250"
            - "RepairBill.${bill_wear_id}.responsibility_rule_applied == OWNER_RESPONSIBILITY_RULE"
            - "RepairBill.${bill_wear_id}.responsible_road_id == ${cx_id}"
            - "RepairBill.${bill_wear_id}.subtotal_cents == 45250"
            - "RepairBill.${bill_wear_id}.handling_fee_cents == 3394"
            - "RepairBill.${bill_wear_id}.total_cents == 48644"
            - "RepairBill.${bill_dmg_id}.responsible_road_id != RepairBill.${bill_wear_id}.responsible_road_id"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: hire_time_component_requires_free_time_subtraction_before_day_ceiling
        grounds:
          - calculations.hire_time_component
          - global_constants.FEE_TIER_BREAK_CENTS
          - entities.CarType.fields.free_time_hours
          - entities.CarType.fields.tier2_threshold_days
          - entities.CarHireMovement.fields.chargeable_days
        distinguishing_aspect: |
          The four steps (elapsed_hours -> subtract free_time_hours -> ceil to whole
          days -> apply the two per-diem tiers) must run in exactly that order. A
          76.00h segment yields chargeable_hours 72.00, chargeable_days 3 and
          time_component_cents 7800 (2*2350 + 1*3100). Ceiling first
          (ceil(76/24) = 4 days) would give 10900; subtracting free time after the
          ceiling (4 days minus 4h) would give 7800 by coincidence for a different
          reason, so the assertion also pins chargeable_days == 3 and
          chargeable_hours == 72.00 to force the exact intermediate values.
        test_recipe:
          setup:
            - "Railroads BN and CX ACTIVE; car type XM with free_time_hours 4, per_diem_rate_cents 2350, tier2_threshold_days 2, tier2_per_diem_rate_cents 3100."
            - "CX-owned car CX 100001 is delivered to BN at 2026-08-26T06:00:00Z and returned to CX at 2026-08-29T10:00:00Z (76.00 elapsed hours), 415 loaded miles."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
              as: ClearinghouseAdmin
              captures: { jct_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100001", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-29T10:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car1_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-26T06:00:00Z", odometer_miles: 12000, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
          trigger:
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car1_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${bn_id}", receiving_road_id: "${cx_id}", interchange_at: "2026-08-29T10:00:00Z", odometer_miles: 12415, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${bn_id}"
            - call: "GET /car-hire/hire-movements?car_id=${car1_id}&handling_road_id=${bn_id}&status=CLOSED"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${bn_id}"
              captures: { m1_id: "$.data[0].id" }
          assert:
            - "CarHireMovement.${m1_id}.start_at == 2026-08-26T06:00:00Z and CarHireMovement.${m1_id}.end_at == 2026-08-29T10:00:00Z (76.00 elapsed hours)"
            - "CarHireMovement.${m1_id}.chargeable_hours == 72.00"
            - "CarHireMovement.${m1_id}.chargeable_days == 3"
            - "CarHireMovement.${m1_id}.time_component_cents == 7800"
            - "CarHireMovement.${m1_id}.mileage_component_cents == 975"
            - "CarHireMovement.${m1_id}.gross_hire_cents == 8775"
            - "CarHireMovement.${m1_id}.net_hire_cents == 8775"
            - "CarHireMovement.${m1_id}.status == CLOSED"
            - "time_component_cents != 10900 (the value produced by ceiling elapsed_hours before subtracting free time)"

      - name: mileage_component_rounds_per_movement_then_sums_not_sum_then_rounds
        grounds:
          - calculations.hire_mileage_component
          - calculations.settlement_statement
          - entities.CarHireMovement.fields.start_odometer_miles
          - entities.CarHireMovement.fields.mileage_component_cents
        distinguishing_aspect: |
          Two lines of 415 and 227 loaded miles at 2350 millicents/mile produce
          975.25 and 533.45 cents. Rounding each line half-up first gives 975 + 533
          = 1508 and a cycle gross of 14008; summing the raw products
          (1508.70) and rounding once gives 1509 and a gross of 14009. The
          one-cent difference is only observable at the cycle level, which is why the
          assertion pins both the per-line values and the aggregate.
        test_recipe:
          setup:
            - "Railroads BN and CX ACTIVE; car type XM; junction JCT-CHI."
            - "Two CX-owned cars each complete one BN segment: car 1 for 76.00h and 415 loaded miles, car 2 for 36.00h and 227 loaded miles."
            - "Settlement cycle payer BN / payee CX for 2026-08 is created after the period ends."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
