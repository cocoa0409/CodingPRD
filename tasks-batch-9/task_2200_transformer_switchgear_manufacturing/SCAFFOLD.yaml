  # --- FactoryAcceptanceTest ------------------------------------------------
  - id: create_factory_acceptance_test
    method: POST
    path: "/factory-acceptance-tests"
    description: "Request a FAT for an order, or a retest naming the failed predecessor via retest_of_fat_id"
    roles: [TestEngineer, QualityEngineer]
    code: 201
    input: [engineered_order_id, test_duration_hours, witness_required, requires_impulse, "retest_of_fat_id?"]
    output: FactoryAcceptanceTest
    side_effects: ["status := REQUESTED", "attempt_number := predecessor.attempt_number + 1 when retest_of_fat_id present, else 1", "a retest reverts order.fulfillment_status FAT_COMPLETE -> IN_PRODUCTION once scheduled"]
  - id: list_factory_acceptance_tests
    method: GET
    path: "/factory-acceptance-tests"
    description: "Filtered list resolving the order, bay and retest-chain FKs"
    roles: [PlantAdmin, TestEngineer, QualityEngineer, WitnessCoordinator, CustomerWitness, ComplianceOfficer, ContractAdmin]
    code: 200
    input: ["engineered_order_id?", "test_bay_id?", "retest_of_fat_id?", "status?", "witness_required?", "limit?", "offset?"]
    output: FactoryAcceptanceTest[]
    side_effects: []
  - id: get_factory_acceptance_test
    method: GET
    path: "/factory-acceptance-tests/{id}"
    description: "Read one FAT"
    roles: [PlantAdmin, TestEngineer, QualityEngineer, WitnessCoordinator, CustomerWitness, ComplianceOfficer, ContractAdmin]
    code: 200
    input: []
    output: FactoryAcceptanceTest
    side_effects: []
  - id: schedule_factory_acceptance_test
    method: POST
    path: "/factory-acceptance-tests/{id}/schedule"
    description: "REQUESTED -> BAY_SCHEDULED; claims a bay window per calc bay_occupation_window"
    roles: [TestEngineer]
    code: 200
    input: [test_bay_id, window_start_at]
    output: FactoryAcceptanceTest
    side_effects: ["status := BAY_SCHEDULED", "window_end_at := window_start_at + test_duration_hours", "TestBay.scheduled_hours_total increases", "a retest reverts order.fulfillment_status FAT_COMPLETE -> IN_PRODUCTION", "increments EngineeredOrder.version by 1"]
  - id: start_factory_acceptance_test
    method: POST
    path: "/factory-acceptance-tests/{id}/start"
    description: "BAY_SCHEDULED or WITNESS_CONFIRMED -> IN_PROGRESS"
    roles: [TestEngineer]
    code: 200
    input: [run_by_user_id]
    output: FactoryAcceptanceTest
    side_effects: ["status := IN_PROGRESS, started_at := logical clock"]
  - id: conclude_factory_acceptance_test
    method: POST
    path: "/factory-acceptance-tests/{id}/conclude"
    description: "IN_PROGRESS -> PASSED or FAILED per result"
    roles: [TestEngineer, QualityEngineer]
    code: 200
    input: [result]
    output: FactoryAcceptanceTest
    side_effects: ["status := PASSED or FAILED, concluded_at := logical clock", "on PASS: order.fulfillment_status IN_PRODUCTION -> FAT_COMPLETE and every COMMITTED ComponentAllocation on the order -> CONSUMED", "on FAIL: any ComplianceLabel pinning a TestReport of this test -> VOIDED", "recompute order_production_posture", "increments EngineeredOrder.version by 1"]
  - id: abandon_factory_acceptance_test
    method: POST
    path: "/factory-acceptance-tests/{id}/abandon"
    description: "REQUESTED, BAY_SCHEDULED, WITNESS_CONFIRMED, IN_PROGRESS or FAILED -> ABANDONED (terminal)"
    roles: [TestEngineer, PlantAdmin]
    code: 200
    input: ["reason?"]
    output: FactoryAcceptanceTest
    side_effects: ["status := ABANDONED", "every non-terminal WitnessAssignment on this test -> RELEASED", "bay window freed"]

