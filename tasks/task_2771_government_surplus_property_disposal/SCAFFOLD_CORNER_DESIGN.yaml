              as: AgencyOfficer
              as_user_id: "${ag}"
              captures: { a1: "$.data.id", a1_v: "$.data.version" }
            - call: "POST /turn-ins/${ti}/submit"
              payload: {}
              as: AgencyOfficer
              as_user_id: "${ag}"
            - call: "POST /assets/${a1}/condition-assessments"
              payload: { condition_code: "C6", functional: true, repair_cost_estimate_cents: 0, assessed_on: "2026-07-31", expected_asset_version: "${a1_v}" }
