  - method: GET
    path: /branch-office/administrators/{id}
    description: Fetch one administrator.
    roles: [HomeOfficeAdmin, BranchAdministrator]
    code: 200
    input: []
    output: BranchOfficeAdministrator
    side_effects: []
  - method: GET
    path: /branch-office/administrators
    description: List administrators; optional branch_id filter.
