              as: Trustee
              as_user_id: "trust-0001"
              captures: { fee_at_1m: $.data.computed_commission_cents }
          assert:
            - "fee_at_1m == 5325000  # 125000 + 450000 + 4750000 + 0 — exact $1M boundary lands entirely inside tier 3"

      - name: waterfall_prorata_floor_then_remainder_to_last_claim
        grounds:
          - calculations.waterfall_allocation
          - entities.Dividend.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. Three allowed claims of
          100,000 cents each share a pool of 100,000. Floor-per-claim-then-
          remainder-to-last yields 33,333 / 33,333 / 33,334 (ordered by
          claim_number ASC); a sum-then-round or round-each-half-up scheme would
          give 33,333/33,333/33,333 (losing a cent) or 33,334 everywhere
          (inventing two cents). Different modes from instance 1 (which is (a)).
        test_recipe:
          setup:
            - "Case in DISTRIBUTION with three ALLOWED GENERAL_UNSECURED claims of 100,000 cents each (claim_numbers 1,2,3 in filing order)"
            - "Estate cash exactly 100,000 cents (one sale netting 100,000)"
