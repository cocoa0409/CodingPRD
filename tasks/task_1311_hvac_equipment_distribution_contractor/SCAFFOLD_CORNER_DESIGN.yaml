            - call: "POST /api/v1/contractors"
              payload: { company_name: "OccRebate Co", license_number: "LIC-C501" }
              as: DistributorAdmin
              captures: { cor_id: $.data.id }
            - call: "POST /api/v1/equipment-models"
              payload: { model_number: "OU-O501", equipment_type: "CONDENSER", refrigerant_type: "R454B", capacity_btuh: 36000, family_code: "FAM-X7", list_price_cents: 500000 }
              as: DistributorAdmin
