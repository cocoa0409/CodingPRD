- section: errors
  instances:
  - name: unknown_path_ids_return_the_entity_specific_not_found
    claim_type: violation_to_error
    grounds:
    - validations[priority=6]
    - errors.ERR_VENUE_NOT_FOUND
    - errors.ERR_EVENT_NOT_FOUND
    - errors.ERR_RISK_ASSESSMENT_NOT_FOUND
    - errors.ERR_PLAN_NOT_FOUND
    - errors.ERR_POST_NOT_FOUND
    - errors.ERR_ASSIGNMENT_NOT_FOUND
    - errors.ERR_GUARD_NOT_FOUND
    - errors.ERR_SUBCONTRACTOR_NOT_FOUND
    - errors.ERR_LANE_NOT_FOUND
    - errors.ERR_INCIDENT_NOT_FOUND
    - errors.ERR_READING_NOT_FOUND
    - errors.ERR_REVIEW_NOT_FOUND
    distinguishing_aspect: |
      §1.6 declares twelve DISTINCT 404 identifiers rather than one generic NOT_FOUND, so the claim is that each path resource maps to its own error id — an implementation with a single shared 404 constant passes any one of these probes and fails eleven. The AfterActionReview case is the only one that must be reached through an action endpoint, because §1.5 declares no single-review read.
    test_recipe:
      setup:
      - logical clock at 2026-09-01T00:00:00Z
      - Venue "Harbor Arena" (gross_capacity 8000, door_count 1) with zones ZF (FLOOR, 200 sqm), ZI (CONCOURSE, 100 sqm, ingress) and ZE (EXIT_CORRIDOR, 50 sqm); SecurityEvent with expected_attendance 200,
        doors_open_at 2026-09-12T17:00:00Z, event_start_at 18:30:00Z, event_end_at 22:30:00Z; RiskAssessment APPROVED at version 3 (composite_threat_score 3.75, T1, required_total_staff 5, required_supervisors
        1, required_screening_lanes 2, minimum_staffing_cost_floor_cents 36000); logical clock 2026-09-01T00:00:00Z
      - the literal UUID 11111111-1111-4111-8111-111111111111 names no row of any entity
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: SystemOperator
      - call: POST /event-security/venues
        payload:
          name: Harbor Arena
          gross_capacity: 8000
          door_count: 1
          egress_capacity_per_minute: 500
          perimeter_length_m: 400
          alcohol_licensed: false
          prior_incident_rate: 0
        as: SecurityDirector
        captures:
          venue_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZF
          zone_type: FLOOR
          floor_area_sqm: 200
          posted_capacity: 300
          exit_units: 3
          post_slot_capacity: 12
          is_ingress_zone: false
        as: SecurityDirector
        captures:
          zf_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZI
          zone_type: CONCOURSE
          floor_area_sqm: 100
          posted_capacity: 150
          exit_units: 2
          post_slot_capacity: 12
          is_ingress_zone: true
        as: SecurityDirector
        captures:
          zi_id: $.data.id
      - call: POST /event-security/venues/${venue_id}/zones
        payload:
          zone_code: ZE
          zone_type: EXIT_CORRIDOR
          floor_area_sqm: 50
          posted_capacity: 80
          exit_units: 1
          post_slot_capacity: 6
          is_ingress_zone: false
        as: SecurityDirector
        captures:
          ze_id: $.data.id
      - call: POST /event-security/security-events
        payload:
          venue_id: ${venue_id}
          event_name: Autumn Gala
          event_type: CONCERT
          doors_open_at: '2026-09-12T17:00:00Z'
          event_start_at: '2026-09-12T18:30:00Z'
          event_end_at: '2026-09-12T22:30:00Z'
          expected_attendance: 200
          alcohol_served: false
          vip_present: false
        as: SecurityDirector
        captures:
          event_id: $.data.id
      - call: POST /event-security/security-events/${event_id}/risk-assessments
        payload:
          threat_level_input: LOW
          protest_likelihood: NONE
          crowd_profile: SEATED
          ingress_door_count: 1
          layout_complexity_score: 1
          history_incident_rate: 0
        as: RiskAnalyst
        as_user_id: analyst-1
        captures:
          ra_id: $.data.id
      - call: POST /event-security/risk-assessments/${ra_id}/decision
        payload:
          action: SUBMIT
        as: RiskAnalyst
        as_user_id: analyst-1
      - call: POST /event-security/risk-assessments/${ra_id}/decision
        payload:
          action: APPROVE
        as: SecurityDirector
        as_user_id: director-1
      - call: GET /event-security/security-events/${event_id}
        payload: {}
        as: SecurityDirector
        captures:
          event_v: $.data.version
      trigger:
      - call: GET /event-security/venues/11111111-1111-4111-8111-111111111111
        payload: {}
        as: SecurityDirector
        as_user_id: director-1
      - call: GET /event-security/security-events/11111111-1111-4111-8111-111111111111
        payload: {}
        as: SecurityDirector
        as_user_id: director-1
      - call: GET /event-security/risk-assessments/11111111-1111-4111-8111-111111111111
        payload: {}
        as: SecurityDirector
        as_user_id: director-1
      - call: GET /event-security/staffing-plans/11111111-1111-4111-8111-111111111111
        payload: {}
        as: SecurityDirector
        as_user_id: director-1
      - call: GET /event-security/posts/11111111-1111-4111-8111-111111111111
        payload: {}
        as: StaffingCoordinator
      - call: GET /event-security/post-assignments/11111111-1111-4111-8111-111111111111
        payload: {}
        as: StaffingCoordinator
      - call: GET /event-security/guards/11111111-1111-4111-8111-111111111111
        payload: {}
        as: CredentialAuditor
      - call: GET /event-security/subcontractors/11111111-1111-4111-8111-111111111111
        payload: {}
        as: CredentialAuditor
      - call: GET /event-security/screening-lanes/11111111-1111-4111-8111-111111111111
        payload: {}
        as: StaffingCoordinator
      - call: GET /event-security/density-readings/11111111-1111-4111-8111-111111111111
        payload: {}
        as: StaffingCoordinator
      - call: GET /event-security/incidents/11111111-1111-4111-8111-111111111111
        payload: {}
        as: IncidentCommander
        as_user_id: commander-1
      - call: POST /event-security/after-action-reviews/11111111-1111-4111-8111-111111111111/decision
        payload:
          action: SUBMIT
        as: IncidentCommander
        as_user_id: commander-1
      assert:
      - the venue read returns 404 with data.error_id == "ERR_VENUE_NOT_FOUND"
      - the event read returns 404 with data.error_id == "ERR_EVENT_NOT_FOUND"
      - the risk-assessment read returns 404 with data.error_id == "ERR_RISK_ASSESSMENT_NOT_FOUND"
      - the staffing-plan read returns 404 with data.error_id == "ERR_PLAN_NOT_FOUND"
      - the post read returns 404 with data.error_id == "ERR_POST_NOT_FOUND"
      - the post-assignment read returns 404 with data.error_id == "ERR_ASSIGNMENT_NOT_FOUND"
      - the guard read returns 404 with data.error_id == "ERR_GUARD_NOT_FOUND"
      - the subcontractor read returns 404 with data.error_id == "ERR_SUBCONTRACTOR_NOT_FOUND"
      - the screening-lane read returns 404 with data.error_id == "ERR_LANE_NOT_FOUND"
      - the density-reading read returns 404 with data.error_id == "ERR_READING_NOT_FOUND"
      - the incident read returns 404 with data.error_id == "ERR_INCIDENT_NOT_FOUND"
      - the after-action-review decision returns 404 with data.error_id == "ERR_REVIEW_NOT_FOUND", not a 409 state error — the path resource is resolved before the action is dispatched
      - every one of the twelve responses carries the error envelope with a non-empty data.message and no data payload beyond error_id and message
