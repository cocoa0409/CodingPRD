  - rule_id: cross_entity_state_dependency
    instances:
      - name: release_blocked_until_agreement_rescission_window_closes
        grounds:
          - validations[priority=22]
          - errors[ERR_RESCISSION_PERIOD_ACTIVE]
          - state_machines.Disbursement.REQUESTED_to_RELEASED
          - entities.FinancingAgreement.fields.rescission_expires_at
          - calculations.rescission_window_expiry
        distinguishing_aspect: |
          Entity pair = Disbursement x FinancingAgreement. The Disbursement is itself perfectly
          valid (REQUESTED, within its certificate and within the payable cap) and the failure comes
          entirely from a field on a DIFFERENT entity: the agreement's rescission_expires_at. The
          same call is replayed one instant later and succeeds, so the dependency is on the other
          entity's temporal state and nothing else.
        test_recipe:
          setup:
            - "Clock 2026-08-12T00:00:00Z. One SOLAR_PV product (25y, cap 300000), one contractor serving 06073."
