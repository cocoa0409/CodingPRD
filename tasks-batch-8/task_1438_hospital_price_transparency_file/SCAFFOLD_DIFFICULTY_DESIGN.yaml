# =============================================================================
# §1.8 Scaffold Difficulty Design — Hospital Price Transparency
# 9 Difficulty Rules x 2 instances = 18 instances.
# Every setup_api_calls / trigger chain replays from empty-DB against §1.5.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: derived_disclosure_exact_min_vs_mix_weighted
        grounds:
          - calculations.derived_disclosure
          - calculations.standard_charge_extrema
          - entities.StandardChargeRecord.fields.derived_disclosure_cents
          - entities.StandardChargeRecord.fields.derivation_method
        distinguishing_aspect: |
          Entity domain = StandardChargeRecord (rate derivation). Same rate universe yields
          derived_disclosure_cents == 55000 under MIX_WEIGHTED (a DERIVED_ONLY contract contributes)
          but == 40000 under EXACT_MIN after the DERIVED_ONLY contract terminates — two valid
          derivation algorithms produce different numbers for the same record.
        test_recipe:
          setup:
            - "Facility F (defaults); item SI gross 100000; payer PA with DISCLOSE_ALLOWED contract CA (annual_volume 100) and rate 40% -> 40000 ACTIVE; payer PB with DERIVED_ONLY contract CB (annual_volume 300) and rate 60% -> 60000 ACTIVE; cycle CY OPEN; record R1 (cash 50000) in DRAFT"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-F1", bed_count: 100 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PB", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pb: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pb}", confidentiality_clause: "DERIVED_ONLY", annual_volume: 300, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { cb: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI brain", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${cb}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 60 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${cb}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { r1: $.data.id, mix_method: $.data.derivation_method, mix_derived: $.data.derived_disclosure_cents, mix_min: $.data.min_negotiated_cents } }
          trigger:
            - { call: "POST /transparency/payer-contracts/${cb}/terminate", as: ContractManager }
            - { call: "GET /transparency/standard-charge-records/${r1}", as: TransparencyOfficer, captures: { exact_method: $.data.derivation_method, exact_derived: $.data.derived_disclosure_cents } }
          assert:
            - "setup capture: R1.derivation_method == MIX_WEIGHTED and R1.derived_disclosure_cents == 55000 (floor((40000*100 + 60000*300)/400))"
            - "setup capture: R1.min_negotiated_cents == 40000 (DERIVED_ONLY contract excluded from extrema)"
            - "after terminate: R1.derivation_method == EXACT_MIN and R1.derived_disclosure_cents == 40000"
            - "MIX_WEIGHTED (55000) != EXACT_MIN (40000) for the same record and overlapping rate data"

      - name: penalty_accrual_simple_vs_tiered
        grounds:
          - calculations.penalty_accrual
          - entities.Facility.fields.penalty_policy
          - entities.Facility.fields.penalty_accrued_cents
          - state_machines.Facility.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Entity domain = Facility (CMS enforcement penalty), distinct from the charge-record domain.
          Identical rejection timestamp, clock position, and bed_count yield 90000 cents under SIMPLE
          and 30000 cents under TIERED — facility-level configuration selects between two valid
          accrual algorithms producing different numbers.
        test_recipe:
          setup:
            - "Facility FS (penalty_policy SIMPLE, bed_count 25) and Facility FT (penalty_policy TIERED, bed_count 25), each with: one ACTIVE DISCLOSE_ALLOWED contract + 40% rate, one ACTIVE item (gross 100000), one ANNUAL cycle [2026-01-01, 2027-01-01) with one VALIDATED record (cash 50000), frozen, SEALED file VALID, cycle PUBLISHED, attestation SUBMITTED for 2026, then cms-decision REJECT_ATTESTATION with plan_due_date 2026-09-01T00:00:00Z at default clock 2026-08-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "FS", cms_certification_number: "CCN-FS", bed_count: 25, penalty_policy: "SIMPLE" }, as: PlatformAdmin, captures: { fs: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PFS", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pfs: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fs}", payer_id: "${pfs}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { cfs: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fs}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { ifs: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${cfs}", service_item_id: "${ifs}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${cfs}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fs}", cycle_type: "ANNUAL", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cyfs: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fs}", publication_cycle_id: "${cyfs}", service_item_id: "${ifs}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { rfs: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${rfs}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cyfs}/freeze", as: TransparencyOfficer, captures: { cyfs_v: $.data.version } }
            - { call: "POST /transparency/machine-readable-files", payload: { publication_cycle_id: "${cyfs}", file_format: "JSON", expected_publication_cycle_version: "${cyfs_v}" }, as: TransparencyOfficer, captures: { ffs: $.data.id } }
            - { call: "POST /transparency/machine-readable-files/${ffs}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cyfs}/publish", as: TransparencyOfficer }
            - { call: "POST /transparency/facilities/${fs}/submit-attestation", payload: { attestation_year: 2026 }, as: ComplianceAuditor }
            - { call: "POST /transparency/facilities/${fs}/cms-decision", payload: { decision: "REJECT_ATTESTATION", plan_due_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /transparency/facilities", payload: { name: "FT", cms_certification_number: "CCN-FT", bed_count: 25, penalty_policy: "TIERED" }, as: PlatformAdmin, captures: { ft: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PFT", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pft: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${ft}", payer_id: "${pft}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { cft: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${ft}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { ift: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${cft}", service_item_id: "${ift}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${cft}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${ft}", cycle_type: "ANNUAL", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cyft: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${ft}", publication_cycle_id: "${cyft}", service_item_id: "${ift}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { rft: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${rft}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cyft}/freeze", as: TransparencyOfficer, captures: { cyft_v: $.data.version } }
            - { call: "POST /transparency/machine-readable-files", payload: { publication_cycle_id: "${cyft}", file_format: "JSON", expected_publication_cycle_version: "${cyft_v}" }, as: TransparencyOfficer, captures: { fft: $.data.id } }
            - { call: "POST /transparency/machine-readable-files/${fft}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cyft}/publish", as: TransparencyOfficer }
            - { call: "POST /transparency/facilities/${ft}/submit-attestation", payload: { attestation_year: 2026 }, as: ComplianceAuditor }
            - { call: "POST /transparency/facilities/${ft}/cms-decision", payload: { decision: "REJECT_ATTESTATION", plan_due_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /transparency/facilities/${fs}", as: TransparencyOfficer, captures: { pen_s: $.data.penalty_accrued_cents, st_s: $.data.attestation_status } }
            - { call: "GET /transparency/facilities/${ft}", as: TransparencyOfficer, captures: { pen_t: $.data.penalty_accrued_cents } }
          assert:
            - "FS.penalty_accrued_cents == 90000 (3 days * 30000, SIMPLE)"
            - "FT.penalty_accrued_cents == 30000 (3 days * 10000, TIERED tier1 for bed_count 25)"
            - "FS.attestation_status == REJECTED (clock 2026-08-04 < plan_due_date 2026-09-01, no escalation)"
            - "identical days/bed_count diverge purely by penalty_policy variant"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: consumer_display_price_min_branch
        grounds:
          - calculations.consumer_display_price
          - "endpoints: GET /transparency/shoppable-service-lists/{id}/display"
        distinguishing_aspect: |
          Rule-2 mode (a): >= 3 inputs with non-linear interaction — nested min over
          {gross, discounted_cash, derived_disclosure} plus a confidentiality-driven branch
          (MIX_WEIGHTED derived value 55000 undercuts cash 60000 and gross 100000, so the
          payer-derived figure, not the cash price, wins the consumer display minimum).
        test_recipe:
          setup:
            - "Facility F (shoppable_min_entries 1, mandated_min_entries 1); item SI (SHOPPABLE, mandated, gross 100000); contract CA DISCLOSE_ALLOWED vol 100 rate 40% -> 40000; contract CB DERIVED_ONLY vol 300 rate 60% -> 60000; cycle published with record R1 (cash 60000; derived MIX_WEIGHTED 55000); shoppable list L (entry SI, no bundles) CERTIFIED then PUBLISHED"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-D1", bed_count: 100, shoppable_min_entries: 1, mandated_min_entries: 1 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PB", payer_type: "MEDICARE_ADVANTAGE" }, as: ContractManager, captures: { pb: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pb}", confidentiality_clause: "DERIVED_ONLY", annual_volume: 300, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { cb: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI brain", service_class: "SHOPPABLE", gross_charge_cents: 100000, cms_shoppable_mandated: true }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${cb}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 60 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${cb}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 60000 }, as: TransparencyOfficer, captures: { r1: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${r1}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cy}/freeze", as: TransparencyOfficer, captures: { cy_v: $.data.version } }
            - { call: "POST /transparency/machine-readable-files", payload: { publication_cycle_id: "${cy}", file_format: "JSON", expected_publication_cycle_version: "${cy_v}" }, as: TransparencyOfficer, captures: { f1: $.data.id } }
            - { call: "POST /transparency/machine-readable-files/${f1}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cy}/publish", as: TransparencyOfficer }
            - { call: "POST /transparency/shoppable-service-lists", payload: { facility_id: "${fac}", title: "Shoppable", entries: [ { service_item_id: "${si}", display_name: "MRI Brain", bundled_ancillary_item_ids: [], include_conditional_ancillaries: false, display_order: 1 } ] }, as: TransparencyOfficer, captures: { lst: $.data.id } }
            - { call: "POST /transparency/shoppable-service-lists/${lst}/certify", as: TransparencyOfficer }
            - { call: "POST /transparency/shoppable-service-lists/${lst}/publish", as: TransparencyOfficer }
          trigger:
            - { call: "GET /transparency/shoppable-service-lists/${lst}/display", as: Consumer }
          assert:
            - "display.entries[0].package_price_cents == 55000 (min(100000, 60000, 55000) + 0 bundle)"
            - "display.entries[0].package_price_cents != 60000 — the MIX_WEIGHTED derived disclosure beats discounted cash in the nested min"
            - "display.stale_any == false (pinned record version matches current)"

      - name: bundle_ancillary_per_item_floor_rounding
        grounds:
          - calculations.bundle_ancillary_rounding
          - calculations.consumer_display_price
        distinguishing_aspect: |
          Rule-2 mode (b): nested rounding order pinned — each ancillary contributes
          floor(gross * 0.90) BEFORE summation. Two ancillaries at 333 cents yield 299+299 = 598
          under the pinned order; the forbidden sum-then-round yields floor(666*0.9) = 599.
          The one-cent divergence is observable in package_price_cents (40598 vs 40599).
        test_recipe:
          setup:
            - "Facility F (shoppable_min_entries 1, mandated_min_entries 1); shoppable item SI (mandated, gross 100000); ancillary items AN1, AN2 (service_class ANCILLARY, ancillary_inclusion ALWAYS_BUNDLED, gross 333 each); DISCLOSE contract CA vol 100 rate 40% -> 40000; cycle published with record R1 (cash 60000, EXACT_MIN derived 40000); list L with entry {SI, bundled [AN1, AN2], include_conditional_ancillaries false} CERTIFIED then PUBLISHED"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-D2", bed_count: 100, shoppable_min_entries: 1, mandated_min_entries: 1 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI brain", service_class: "SHOPPABLE", gross_charge_cents: 100000, cms_shoppable_mandated: true }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "J2400", code_type: "HCPCS", description: "Injection", service_class: "ANCILLARY", gross_charge_cents: 333, ancillary_inclusion: "ALWAYS_BUNDLED" }, as: TransparencyOfficer, captures: { an1: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "A4650", code_type: "HCPCS", description: "Supply kit", service_class: "ANCILLARY", gross_charge_cents: 333, ancillary_inclusion: "ALWAYS_BUNDLED" }, as: TransparencyOfficer, captures: { an2: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 60000 }, as: TransparencyOfficer, captures: { r1: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${r1}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cy}/freeze", as: TransparencyOfficer, captures: { cy_v: $.data.version } }
            - { call: "POST /transparency/machine-readable-files", payload: { publication_cycle_id: "${cy}", file_format: "CSV", expected_publication_cycle_version: "${cy_v}" }, as: TransparencyOfficer, captures: { f1: $.data.id } }
            - { call: "POST /transparency/machine-readable-files/${f1}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cy}/publish", as: TransparencyOfficer }
            - { call: "POST /transparency/shoppable-service-lists", payload: { facility_id: "${fac}", title: "Shoppable", entries: [ { service_item_id: "${si}", display_name: "MRI pkg", bundled_ancillary_item_ids: [ "${an1}", "${an2}" ], include_conditional_ancillaries: false, display_order: 1 } ] }, as: TransparencyOfficer, captures: { lst: $.data.id } }
            - { call: "POST /transparency/shoppable-service-lists/${lst}/certify", as: TransparencyOfficer }
            - { call: "POST /transparency/shoppable-service-lists/${lst}/publish", as: TransparencyOfficer }
          trigger:
            - { call: "GET /transparency/shoppable-service-lists/${lst}/display", as: Consumer }
          assert:
            - "display.entries[0].package_price_cents == 40598 (min(100000, 60000, 40000)=40000 + floor(333*0.9)=299 + 299)"
            - "package_price_cents != 40599 — the forbidden sum-then-round order (40000 + floor(666*0.9)=599) is off by exactly one cent"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_renegotiation_cycle_restores_editable_rates
        grounds:
          - state_machines.PayerContract.ACTIVE_to_RENEGOTIATING
          - state_machines.PayerContract.RENEGOTIATING_to_ACTIVE
          - state_machines.PayerNegotiatedRate.ACTIVE_to_DRAFT
        distinguishing_aspect: |
          Entity = PayerContract (cyclic A->B->A). ACTIVE -> RENEGOTIATING -> ACTIVE loops once;
          while ACTIVE a rate PATCH fails ERR_RATE_LOCKED, inside the loop the same PATCH succeeds,
          and re-activation materializes the amended 50000-cent amount — proving the cycle is real,
          not a one-way pipeline.
        test_recipe:
          setup:
            - "Facility F; payer PA; contract CA (DISCLOSE_ALLOWED, 2026-01-01..2026-12-31) ACTIVE with rate RA PERCENT_OF_GROSS 40 on item SI (gross 100000) -> RA ACTIVE, amount 40000"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-S1", bed_count: 100 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager, captures: { ra: $.data.id } }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "PATCH /transparency/payer-negotiated-rates/${ra}", payload: { rate_percent: 50 }, as: ContractManager, captures: { locked_err: $.data.error_id } }
            - { call: "POST /transparency/payer-contracts/${ca}/renegotiate", payload: { effective_end: "2027-06-30T00:00:00Z" }, as: ContractManager, captures: { st_mid: $.data.status } }
            - { call: "PATCH /transparency/payer-negotiated-rates/${ra}", payload: { rate_percent: 50 }, as: ContractManager, captures: { amt_draft: $.data.negotiated_amount_cents } }
          trigger:
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager, captures: { st_end: $.data.status } }
            - { call: "GET /transparency/payer-negotiated-rates/${ra}", as: ContractManager, captures: { amt_end: $.data.negotiated_amount_cents, rate_st: $.data.status } }
          assert:
            - "PATCH while ACTIVE failed: locked_err == ERR_RATE_LOCKED"
            - "mid-loop: contract.status == RENEGOTIATING and PATCH succeeded with negotiated_amount_cents == 50000"
            - "after re-activation: contract.status == ACTIVE (cycle ACTIVE->RENEGOTIATING->ACTIVE completed)"
            - "rate.status == ACTIVE and rate.negotiated_amount_cents == 50000"

      - name: mrf_parallel_dimensions_invalidate_and_revalidate_loop
        grounds:
          - state_machines.MachineReadableFile.UNVALIDATED_to_INVALID
          - state_machines.MachineReadableFile.INVALID_to_VALID
          - state_machines.MachineReadableFile.SEALED_to_SUPERSEDED
          - calculations.mrf_schema_validation
        distinguishing_aspect: |
          Entity = MachineReadableFile (parallel dimensions generation_status x validation_status,
          plus a validation loop). The file stays SEALED on the generation dimension while validation
          flips UNVALIDATED -> INVALID (payer_count 2 < 3); remediation raises payer_count to exactly 3,
          a regenerated file supersedes the old SEALED one, and re-validation closes INVALID -> VALID.
        test_recipe:
          setup:
            - "Facility F (min_records_per_cycle 1); payers PA (contract DISCLOSE_ALLOWED vol 100, rate 40% -> 40000) and PB (contract AGGREGATE_ONLY vol 300, rate 60% -> 60000) ACTIVE; item SI gross 100000; cycle CY FROZEN with one VALIDATED record (cash 50000); file F1 generated"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-S2", bed_count: 100, min_records_per_cycle: 1 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PB", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pb: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PC", payer_type: "MEDICAID_MANAGED" }, as: ContractManager, captures: { pc: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pb}", confidentiality_clause: "AGGREGATE_ONLY", annual_volume: 300, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { cb: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${cb}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 60 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${cb}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { r1: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${r1}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cy}/freeze", as: TransparencyOfficer, captures: { cy_v1: $.data.version } }
            - { call: "POST /transparency/machine-readable-files", payload: { publication_cycle_id: "${cy}", file_format: "JSON", expected_publication_cycle_version: "${cy_v1}" }, as: TransparencyOfficer, captures: { f1: $.data.id } }
            - { call: "POST /transparency/machine-readable-files/${f1}/validate", as: TransparencyOfficer, captures: { v1_status: $.data.validation_status } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pc}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 50, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { cc: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${cc}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 50 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${cc}/activate", as: ContractManager }
            - { call: "GET /transparency/publication-cycles/${cy}", as: TransparencyOfficer, captures: { cy_v2: $.data.version } }
          trigger:
            - { call: "POST /transparency/machine-readable-files", payload: { publication_cycle_id: "${cy}", file_format: "JSON", expected_publication_cycle_version: "${cy_v2}" }, as: TransparencyOfficer, captures: { f2: $.data.id } }
            - { call: "POST /transparency/machine-readable-files/${f2}/validate", as: TransparencyOfficer, captures: { v2_status: $.data.validation_status } }
            - { call: "GET /transparency/publication-cycles/${cy}/machine-readable-files", as: TransparencyOfficer }
          assert:
            - "F1 first validate: validation_status == INVALID with validation_errors containing DEIDENTIFICATION_VIOLATION (payer_count 2 < 3) while generation_status stayed SEALED"
            - "F2 validate: validation_status == VALID (payer_count exactly 3 passes the >= 3 threshold) — INVALID -> VALID loop closed via regeneration"
            - "F1 generation_status == SUPERSEDED after F2 creation; exactly one SEALED file (F2) remains for the cycle"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: gross_patch_cascades_to_cycle_rollup
        grounds:
          - state_machines.ServiceItem.ACTIVE_to_ACTIVE
          - calculations.negotiated_amount_materialization
          - calculations.standard_charge_extrema
          - entities.PublicationCycle.fields.derived_rollup_cents
          - concurrency_rules[occ-service-item-patch]
        distinguishing_aspect: |
          Depth-3 chain triggered by PATCH /service-items/{id}: item mutation recomputes the rate
          (link 1: 40000 -> 80000), the rate mutation recomputes the VALIDATED record's extrema
          (link 2: derived 40000 -> 80000 while the record's gross snapshot stays 100000), and the
          record mutation recomputes the cycle's derived_rollup_cents and bumps cycle.version
          (link 3: rollup 40000 -> 80000, total_gross_cents unchanged at 100000).
        test_recipe:
          setup:
            - "Facility F; payer PA; contract CA DISCLOSE_ALLOWED ACTIVE; item SI gross 100000 (version 1); rate RA 40% ACTIVE amount 40000; cycle CY OPEN with record R1 VALIDATED (cash 50000; min/max/derived 40000); CY at version 3, validated_record_count 1, total_gross_cents 100000, derived_rollup_cents 40000"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-C1", bed_count: 100 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id, si_v: $.data.version } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager, captures: { ra: $.data.id } }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { r1: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${r1}/validate", as: TransparencyOfficer }
            - { call: "GET /transparency/publication-cycles/${cy}", as: TransparencyOfficer, captures: { cy_v_pre: $.data.version, rollup_pre: $.data.derived_rollup_cents, gross_pre: $.data.total_gross_cents } }
          trigger:
            - { call: "PATCH /transparency/service-items/${si}", payload: { gross_charge_cents: 200000, expected_service_item_version: "${si_v}" }, as: TransparencyOfficer }
            - { call: "GET /transparency/payer-negotiated-rates/${ra}", as: TransparencyOfficer, captures: { amt_post: $.data.negotiated_amount_cents } }
            - { call: "GET /transparency/standard-charge-records/${r1}", as: TransparencyOfficer, captures: { min_post: $.data.min_negotiated_cents, der_post: $.data.derived_disclosure_cents, snap_post: $.data.gross_charge_cents } }
            - { call: "GET /transparency/publication-cycles/${cy}", as: TransparencyOfficer, captures: { cy_v_post: $.data.version, rollup_post: $.data.derived_rollup_cents, gross_post: $.data.total_gross_cents } }
          assert:
            - "pre-cascade: rollup_pre == 40000 and gross_pre == 100000 and cy_v_pre == 3 (create 1, record create 2, validate 3)"
            - "link 1: rate.negotiated_amount_cents == 80000 (floor(200000 * 40 / 100))"
            - "link 2: record.min_negotiated_cents == 80000 and record.derived_disclosure_cents == 80000 while record.gross_charge_cents == 100000 (snapshot semantics preserved)"
            - "link 3: cycle.derived_rollup_cents == 80000, cycle.total_gross_cents == 100000 (unchanged), cycle.version == 4"

      - name: contract_terminate_cascades_to_record_extrema
        grounds:
          - state_machines.PayerContract.ACTIVE_to_TERMINATED
          - state_machines.PayerNegotiatedRate.ACTIVE_to_INACTIVE
          - calculations.standard_charge_extrema
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (POST /payer-contracts/{id}/terminate, not an item
          PATCH): the contract mutation flips its rate ACTIVE -> INACTIVE (link 1), and the rate
          mutation recomputes the DRAFT record's extrema (link 2: max_negotiated_cents collapses
          60000 -> 40000 as the terminated payer's rate leaves the input set).
        test_recipe:
          setup:
            - "Facility F; payers PA, PB; contracts CA (DISCLOSE_ALLOWED vol 100) and CB (DISCLOSE_ALLOWED vol 300) ACTIVE; item SI gross 100000; rates RA 40% -> 40000, RB 60% -> 60000 ACTIVE; cycle CY OPEN; record R1 DRAFT (cash 50000; min 40000, max 60000, derived 40000 EXACT_MIN)"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-C2", bed_count: 100 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PB", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pb: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pb}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 300, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { cb: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${cb}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 60 }, as: ContractManager, captures: { rb: $.data.id } }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${cb}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { r1: $.data.id, max_pre: $.data.max_negotiated_cents } }
          trigger:
            - { call: "POST /transparency/payer-contracts/${cb}/terminate", as: ContractManager }
            - { call: "GET /transparency/payer-negotiated-rates/${rb}", as: TransparencyOfficer, captures: { rb_st: $.data.status } }
            - { call: "GET /transparency/standard-charge-records/${r1}", as: TransparencyOfficer, captures: { max_post: $.data.max_negotiated_cents, min_post: $.data.min_negotiated_cents, der_post: $.data.derived_disclosure_cents } }
          assert:
            - "pre-terminate: record.max_negotiated_cents == 60000 (two DISCLOSE_ALLOWED rates in the input set)"
            - "link 1: rate RB.status == INACTIVE after contract terminate"
            - "link 2: record.max_negotiated_cents == 40000 and record.min_negotiated_cents == 40000 and derived_disclosure_cents == 40000 (EXACT_MIN over the single remaining rate)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: rate_create_missing_item_and_locked_contract_returns_not_found
        grounds:
          - "validations[priority=3]"
          - "validations[priority=4]"
          - errors[ERR_SERVICE_ITEM_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_EDITABLE]
        distinguishing_aspect: |
          Error-category pair = existence (P3) vs state (P4). The rate create fails existence
          (service_item_id references a nonexistent item) AND state (contract is ACTIVE, not
          editable); the 404 ERR_SERVICE_ITEM_NOT_FOUND must win over 409 ERR_CONTRACT_NOT_EDITABLE.
        test_recipe:
          setup:
            - "Facility F; payer PA; contract CA ACTIVE (no rates needed)"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-V1", bed_count: 100 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
          trigger:
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "00000000-0000-0000-0000-000000000000", rate_type: "FEE_SCHEDULE_FLAT", flat_amount_cents: 1000 }, as: ContractManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SERVICE_ITEM_NOT_FOUND with http 404 — existence (priority 3) beats state (priority 4) even though the contract is also not editable"

      - name: discrepancy_create_unpublished_cycle_and_mismatched_record
        grounds:
          - "validations[priority=4]"
          - "validations[priority=7]"
          - errors[ERR_CYCLE_NOT_PUBLISHED]
          - errors[ERR_RECORD_CYCLE_MISMATCH]
        distinguishing_aspect: |
          Error-category pair = state (P4) vs business_referential (P7) — a different pair than
          existence-vs-state. The discrepancy references a cycle that is not PUBLISHED AND a record
          belonging to a different cycle; ERR_CYCLE_NOT_PUBLISHED (409) must win over
          ERR_RECORD_CYCLE_MISMATCH (422).
        test_recipe:
          setup:
            - "Facility F; item SI; cycle CY1 MONTHLY [2026-08-01, 2026-09-01) OPEN; cycle CY2 MONTHLY [2026-09-01, 2026-10-01) OPEN (adjacent half-open, no overlap); record R2 in CY2 (DRAFT, cash 50000)"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-V2", bed_count: 100 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy1: $.data.id } }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy2: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy2}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /transparency/discrepancy-reports", payload: { publication_cycle_id: "${cy1}", standard_charge_record_id: "${r2}", reporter_type: "CONSUMER", description: "price looks wrong" }, as: Consumer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CYCLE_NOT_PUBLISHED with http 409 — state (priority 4) beats business_referential (priority 7) even though R2 also belongs to CY2, not CY1"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: certify_count_boundary_exactly_at_minimum
        grounds:
          - calculations.shoppable_count_aggregation
          - errors[ERR_SHOPPABLE_COUNT_BELOW_MINIMUM]
          - state_machines.ShoppableServiceList.DRAFT_to_CERTIFIED
        distinguishing_aspect: |
          Metric = shoppable entry count; endpoint = POST .../certify. With facility
          shoppable_min_entries == 2: a 1-entry list fails ERR_SHOPPABLE_COUNT_BELOW_MINIMUM while a
          2-entry list passes (>= semantics — exactly at the minimum certifies).
        test_recipe:
          setup:
            - "Facility F (shoppable_min_entries 2, mandated_min_entries 1); item SI1 (SHOPPABLE, cms_shoppable_mandated true); item SI2 (SHOPPABLE, mandated false); list L1 with entries [SI1]; list L2 with entries [SI1, SI2]"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-B1", bed_count: 100, shoppable_min_entries: 2, mandated_min_entries: 1 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI brain", service_class: "SHOPPABLE", gross_charge_cents: 100000, cms_shoppable_mandated: true }, as: TransparencyOfficer, captures: { si1: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70450", code_type: "CPT", description: "CT head", service_class: "SHOPPABLE", gross_charge_cents: 80000 }, as: TransparencyOfficer, captures: { si2: $.data.id } }
            - { call: "POST /transparency/shoppable-service-lists", payload: { facility_id: "${fac}", title: "L1", entries: [ { service_item_id: "${si1}", display_name: "MRI", bundled_ancillary_item_ids: [], include_conditional_ancillaries: false, display_order: 1 } ] }, as: TransparencyOfficer, captures: { l1: $.data.id, l1_count: $.data.entry_count } }
            - { call: "POST /transparency/shoppable-service-lists", payload: { facility_id: "${fac}", title: "L2", entries: [ { service_item_id: "${si1}", display_name: "MRI", bundled_ancillary_item_ids: [], include_conditional_ancillaries: false, display_order: 1 }, { service_item_id: "${si2}", display_name: "CT", bundled_ancillary_item_ids: [], include_conditional_ancillaries: false, display_order: 2 } ] }, as: TransparencyOfficer, captures: { l2: $.data.id } }
          trigger:
            - { call: "POST /transparency/shoppable-service-lists/${l1}/certify", as: TransparencyOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /transparency/shoppable-service-lists/${l2}/certify", as: TransparencyOfficer, captures: { l2_status: $.data.status } }
          assert:
            - "L1 (entry_count 1 < 2): error_id == ERR_SHOPPABLE_COUNT_BELOW_MINIMUM, http 422"
            - "L2 (entry_count 2 >= 2, mandated 1 >= 1): status == CERTIFIED — exact-equality passes the >= boundary"

      - name: penalty_accrual_day_zero_and_day_one_boundary
        grounds:
          - calculations.penalty_accrual
          - entities.Facility.fields.penalty_accrued_cents
        distinguishing_aspect: |
          Metric = elapsed whole days since rejected_at; endpoints = POST /_clock/set_current_utc +
          GET /facilities/{id}. At exactly 0 elapsed seconds the penalty is 0; at exactly 86400
          seconds it is 30000 — the floor(day_count) boundary bites at precisely one day, and the
          facility has not escalated (clock still before plan_due_date).
        test_recipe:
          setup:
            - "Facility FS (SIMPLE, bed_count 25) with full publish chain (DISCLOSE contract + 40% rate, item gross 100000, ANNUAL cycle [2026-01-01, 2027-01-01), record VALIDATED, file VALID, cycle PUBLISHED), attestation SUBMITTED for 2026, REJECTED at default clock 2026-08-01T00:00:00Z with plan_due_date 2026-09-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "FS", cms_certification_number: "CCN-B2", bed_count: 25, penalty_policy: "SIMPLE" }, as: PlatformAdmin, captures: { fs: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PFS", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pfs: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fs}", payer_id: "${pfs}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { cfs: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fs}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { ifs: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${cfs}", service_item_id: "${ifs}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${cfs}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fs}", cycle_type: "ANNUAL", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cyfs: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fs}", publication_cycle_id: "${cyfs}", service_item_id: "${ifs}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { rfs: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${rfs}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cyfs}/freeze", as: TransparencyOfficer, captures: { cyfs_v: $.data.version } }
            - { call: "POST /transparency/machine-readable-files", payload: { publication_cycle_id: "${cyfs}", file_format: "JSON", expected_publication_cycle_version: "${cyfs_v}" }, as: TransparencyOfficer, captures: { ffs: $.data.id } }
            - { call: "POST /transparency/machine-readable-files/${ffs}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cyfs}/publish", as: TransparencyOfficer }
            - { call: "POST /transparency/facilities/${fs}/submit-attestation", payload: { attestation_year: 2026 }, as: ComplianceAuditor }
            - { call: "POST /transparency/facilities/${fs}/cms-decision", payload: { decision: "REJECT_ATTESTATION", plan_due_date: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /transparency/facilities/${fs}", as: ComplianceAuditor, captures: { pen0: $.data.penalty_accrued_cents, st0: $.data.attestation_status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /transparency/facilities/${fs}", as: ComplianceAuditor, captures: { pen1: $.data.penalty_accrued_cents, st1: $.data.attestation_status } }
          assert:
            - "at rejected_at itself: penalty_accrued_cents == 0 (floor(0 s / 86400) = 0 days), attestation_status == REJECTED"
            - "at exactly +86400 s: penalty_accrued_cents == 30000 (floor = 1 day x 30000, SIMPLE), attestation_status == REJECTED (2026-08-02 < plan_due_date 2026-09-01)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: record_create_blocked_when_cycle_not_open
        grounds:
          - state_machines.StandardChargeRecord.DRAFT_to_VALIDATED
          - errors[ERR_CYCLE_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair = StandardChargeRecord -> PublicationCycle. A record create is rejected with
          ERR_CYCLE_NOT_OPEN once the owning cycle has left OPEN (FROZEN), and the same rejection
          recurs after PUBLISHED — the child operation is gated by the parent's lifecycle state.
        test_recipe:
          setup:
            - "Facility F; contract+rate ACTIVE (DISCLOSE, 40%); item SI gross 100000; cycle CY OPEN -> record R1 -> validate -> freeze (CY now FROZEN)"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-X1", bed_count: 100 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { r1: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${r1}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cy}/freeze", as: TransparencyOfficer }
          trigger:
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 51000 }, as: TransparencyOfficer, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CYCLE_NOT_OPEN (http 409) — record extraction is blocked because PublicationCycle.status == FROZEN, not OPEN"

      - name: service_item_retire_blocked_by_certified_list
        grounds:
          - state_machines.ServiceItem.ACTIVE_to_RETIRED
          - errors[ERR_ITEM_IN_CERTIFIED_LIST]
        distinguishing_aspect: |
          Entity pair = ServiceItem -> ShoppableServiceList (a different pair than record->cycle).
          Retiring an item referenced by a CERTIFIED list fails ERR_ITEM_IN_CERTIFIED_LIST, while an
          item referenced only by a DRAFT list retires cleanly — the sibling list's state gates the
          item's transition.
        test_recipe:
          setup:
            - "Facility F (shoppable_min_entries 1, mandated_min_entries 1); item SI1 (SHOPPABLE, mandated) referenced by list L1 (CERTIFIED); item SI2 (SHOPPABLE) referenced only by list L2 (DRAFT)"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-X2", bed_count: 100, shoppable_min_entries: 1, mandated_min_entries: 1 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000, cms_shoppable_mandated: true }, as: TransparencyOfficer, captures: { si1: $.data.id, si1_v: $.data.version } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70450", code_type: "CPT", description: "CT head", service_class: "SHOPPABLE", gross_charge_cents: 80000 }, as: TransparencyOfficer, captures: { si2: $.data.id, si2_v: $.data.version } }
            - { call: "POST /transparency/shoppable-service-lists", payload: { facility_id: "${fac}", title: "L1", entries: [ { service_item_id: "${si1}", display_name: "MRI", bundled_ancillary_item_ids: [], include_conditional_ancillaries: false, display_order: 1 } ] }, as: TransparencyOfficer, captures: { l1: $.data.id } }
            - { call: "POST /transparency/shoppable-service-lists/${l1}/certify", as: TransparencyOfficer }
            - { call: "POST /transparency/shoppable-service-lists", payload: { facility_id: "${fac}", title: "L2", entries: [ { service_item_id: "${si2}", display_name: "CT", bundled_ancillary_item_ids: [], include_conditional_ancillaries: false, display_order: 1 } ] }, as: TransparencyOfficer, captures: { l2: $.data.id } }
          trigger:
            - { call: "PATCH /transparency/service-items/${si1}", payload: { status: "RETIRED", expected_service_item_version: "${si1_v}" }, as: TransparencyOfficer, captures: { err: $.data.error_id } }
            - { call: "PATCH /transparency/service-items/${si2}", payload: { status: "RETIRED", expected_service_item_version: "${si2_v}" }, as: TransparencyOfficer, captures: { si2_st: $.data.status } }
          assert:
            - "SI1 retire: error_id == ERR_ITEM_IN_CERTIFIED_LIST (http 409) — L1 is CERTIFIED"
            - "SI2 retire succeeds: status == RETIRED — L2 is still DRAFT so the guard does not bite"
            - "SI1 remains ACTIVE after the failed retire"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: contract_window_touching_endpoints_conflict
        grounds:
          - errors[ERR_CONTRACT_WINDOW_OVERLAP]
          - state_machines.PayerContract.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Interval semantics = CLOSED on the (facility, payer) resource: [2026-01-01, 2026-06-30] and
          [2026-06-30, 2026-12-31] merely TOUCH at 2026-06-30 and that adjacency IS a conflict
          (inclusive end), while [2026-07-01, 2026-12-31] with a one-day gap activates cleanly.
        test_recipe:
          setup:
            - "Facility F; payer PA; contract C1 [2026-01-01, 2026-06-30] ACTIVE; contract C2 [2026-06-30, 2026-12-31] DRAFT (touching C1's inclusive end); contract C3 [2026-07-01, 2026-12-31] DRAFT (one-day gap)"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-T1", bed_count: 100 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-06-30T00:00:00Z" }, as: ContractManager, captures: { c1: $.data.id } }
            - { call: "POST /transparency/payer-contracts/${c1}/activate", as: ContractManager }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-06-30T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { c2: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-07-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { c3: $.data.id } }
          trigger:
            - { call: "POST /transparency/payer-contracts/${c2}/activate", as: ContractManager, captures: { err: $.data.error_id } }
            - { call: "POST /transparency/payer-contracts/${c3}/activate", as: ContractManager, captures: { c3_st: $.data.status } }
          assert:
            - "C2 activate: error_id == ERR_CONTRACT_WINDOW_OVERLAP (http 409) — C2.effective_start == C1.effective_end intersects under CLOSED semantics"
            - "C3 activate: status == ACTIVE — a strict gap (2026-07-01 > 2026-06-30) does not intersect"
            - "C2 remains DRAFT after the failed activate"

      - name: cycle_period_adjacency_allowed
        grounds:
          - errors[ERR_CYCLE_PERIOD_OVERLAP]
          - entities.PublicationCycle.fields.period_start
        distinguishing_aspect: |
          Interval semantics = HALF-OPEN on the (facility, cycle_type) resource — geometrically
          DIFFERENT from the contract rule: [2026-08-01, 2026-09-01) and [2026-09-01, 2026-10-01)
          touch at 2026-09-01 and that adjacency is ALLOWED; a truly overlapping third window is
          rejected; and an ANNUAL cycle containing all of them is allowed because the resource is
          partitioned by cycle_type.
        test_recipe:
          setup:
            - "Facility F; cycle M1 MONTHLY [2026-08-01, 2026-09-01) OPEN"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-T2", bed_count: 100 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { m1: $.data.id } }
          trigger:
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { m2: $.data.id, m2_st: $.data.status } }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-09-30T00:00:00Z", period_end: "2026-11-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "ANNUAL", period_start: "2026-01-01T00:00:00Z", period_end: "2027-01-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { a1: $.data.id, a1_st: $.data.status } }
          assert:
            - "M2 created with status == OPEN — period_start == M1.period_end is adjacency, not overlap, under HALF-OPEN semantics"
            - "M3 create: error_id == ERR_CYCLE_PERIOD_OVERLAP (http 409) — [2026-09-30, 2026-11-01) overlaps M2 [2026-09-01, 2026-10-01)"
            - "A1 (ANNUAL, containing M1..M3's span) created with status == OPEN — the resource is partitioned by cycle_type"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: correction_apply_conserves_cycle_record_count
        grounds:
          - state_machines.DiscrepancyReport.CORRECTION_APPROVED_to_CORRECTED
          - state_machines.StandardChargeRecord.FLAGGED_to_SUPERSEDED
          - entities.PublicationCycle.fields.validated_record_count
        distinguishing_aspect: |
          Conserved quantity = COUNT of active records in the cycle: apply-correction moves the
          FLAGGED record out of the {VALIDATED, PUBLISHED, FLAGGED} set and the replacement enters
          it directly as PUBLISHED, so validated_record_count is invariant (1 before, 1 after) even
          as total_gross_cents moves by exactly the correction delta (100000 -> 80000).
        test_recipe:
          setup:
            - "Facility F; contract CA DISCLOSE_ALLOWED ACTIVE with 40% rate; item SI gross 100000; cycle CY published with single record R1 (cash 50000, gross 100000); discrepancy D CONFIRMED against (CY, R1) so R1 is FLAGGED; correction proposed (gross 80000) by officer-a and approved by officer-b"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-I1", bed_count: 100 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { r1: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${r1}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cy}/freeze", as: TransparencyOfficer, captures: { cy_v: $.data.version } }
            - { call: "POST /transparency/machine-readable-files", payload: { publication_cycle_id: "${cy}", file_format: "JSON", expected_publication_cycle_version: "${cy_v}" }, as: TransparencyOfficer, captures: { f1: $.data.id } }
            - { call: "POST /transparency/machine-readable-files/${f1}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cy}/publish", as: TransparencyOfficer }
            - { call: "POST /transparency/discrepancy-reports", payload: { publication_cycle_id: "${cy}", standard_charge_record_id: "${r1}", reporter_type: "CONSUMER", description: "gross looks inflated" }, as: Consumer, captures: { d1: $.data.id } }
            - { call: "POST /transparency/discrepancy-reports/${d1}/triage", payload: { outcome: "CONFIRMED" }, as: ComplianceAuditor }
            - { call: "POST /transparency/discrepancy-reports/${d1}/propose-correction", payload: { proposed_gross_charge_cents: 80000 }, as: TransparencyOfficer, as_user_id: "officer-a" }
            - { call: "POST /transparency/discrepancy-reports/${d1}/approve-correction", as: TransparencyOfficer, as_user_id: "officer-b" }
            - { call: "GET /transparency/publication-cycles/${cy}", as: TransparencyOfficer, captures: { cnt_pre: $.data.validated_record_count, gross_cy_pre: $.data.total_gross_cents } }
          trigger:
            - { call: "POST /transparency/discrepancy-reports/${d1}/apply-correction", as: TransparencyOfficer, as_user_id: "officer-a", captures: { d1_st: $.data.status } }
            - { call: "GET /transparency/publication-cycles/${cy}", as: TransparencyOfficer, captures: { cnt_post: $.data.validated_record_count, gross_cy_post: $.data.total_gross_cents } }
            - { call: "GET /transparency/standard-charge-records/${r1}", as: TransparencyOfficer, captures: { r1_st: $.data.status } }
            - { call: "GET /transparency/standard-charge-records?supersedes_id=${r1}", as: TransparencyOfficer, captures: { r2: "$.data[0].id", r2_st: "$.data[0].status", r2_gross: "$.data[0].gross_charge_cents" } }
          assert:
            - "pre-apply: validated_record_count == 1 and total_gross_cents == 100000"
            - "post-apply: validated_record_count == 1 — INVARIANT: the active-record count is conserved across the supersede pair (R1 leaves, R2 enters)"
            - "post-apply: total_gross_cents == 80000 (delta exactly -20000)"
            - "R1.status == SUPERSEDED; replacement R2.status == PUBLISHED with supersedes_id == R1.id and gross_charge_cents == 80000"
            - "discrepancy.status == CORRECTED"

      - name: compensating_corrections_restore_total_gross
        grounds:
          - state_machines.DiscrepancyReport.CORRECTION_APPROVED_to_CORRECTED
          - entities.PublicationCycle.fields.total_gross_cents
          - entities.StandardChargeRecord.fields.supersedes_id
        distinguishing_aspect: |
          Conserved quantity = MONETARY total (different type than the record-count invariant):
          a forward correction (gross 100000 -> 70000) followed by its compensating correction
          (70000 -> 100000) returns cycle.total_gross_cents to exactly its original value — no drift
          across the two supersede hops, and the lineage chain R3 -> R2 -> R1 is fully queryable.
        test_recipe:
          setup:
            - "Facility F; contract/rate ACTIVE; item SI gross 100000; cycle CY published with record R1 (gross 100000, cash 50000); discrepancy D1 fully applied with proposed_gross 70000 producing R2 (PUBLISHED); discrepancy D2 against R2 CONFIRMED with proposed gross 100000 approved"
          setup_api_calls:
            - { call: "POST /transparency/facilities", payload: { name: "F", cms_certification_number: "CCN-I2", bed_count: 100 }, as: PlatformAdmin, captures: { fac: $.data.id } }
            - { call: "POST /transparency/payers", payload: { name: "PA", payer_type: "COMMERCIAL" }, as: ContractManager, captures: { pa: $.data.id } }
            - { call: "POST /transparency/payer-contracts", payload: { facility_id: "${fac}", payer_id: "${pa}", confidentiality_clause: "DISCLOSE_ALLOWED", annual_volume: 100, effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z" }, as: ContractManager, captures: { ca: $.data.id } }
            - { call: "POST /transparency/service-items", payload: { facility_id: "${fac}", code: "70551", code_type: "CPT", description: "MRI", service_class: "SHOPPABLE", gross_charge_cents: 100000 }, as: TransparencyOfficer, captures: { si: $.data.id } }
            - { call: "POST /transparency/payer-negotiated-rates", payload: { contract_id: "${ca}", service_item_id: "${si}", rate_type: "PERCENT_OF_GROSS", rate_percent: 40 }, as: ContractManager }
            - { call: "POST /transparency/payer-contracts/${ca}/activate", as: ContractManager }
            - { call: "POST /transparency/publication-cycles", payload: { facility_id: "${fac}", cycle_type: "MONTHLY", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", schema_version: "v2.0.0" }, as: TransparencyOfficer, captures: { cy: $.data.id } }
            - { call: "POST /transparency/standard-charge-records", payload: { facility_id: "${fac}", publication_cycle_id: "${cy}", service_item_id: "${si}", discounted_cash_cents: 50000 }, as: TransparencyOfficer, captures: { r1: $.data.id } }
            - { call: "POST /transparency/standard-charge-records/${r1}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cy}/freeze", as: TransparencyOfficer, captures: { cy_v: $.data.version } }
            - { call: "POST /transparency/machine-readable-files", payload: { publication_cycle_id: "${cy}", file_format: "JSON", expected_publication_cycle_version: "${cy_v}" }, as: TransparencyOfficer, captures: { f1: $.data.id } }
            - { call: "POST /transparency/machine-readable-files/${f1}/validate", as: TransparencyOfficer }
            - { call: "POST /transparency/publication-cycles/${cy}/publish", as: TransparencyOfficer }
            - { call: "POST /transparency/discrepancy-reports", payload: { publication_cycle_id: "${cy}", standard_charge_record_id: "${r1}", reporter_type: "PAYER", description: "gross should be 70000" }, as: ContractManager, captures: { d1: $.data.id } }
            - { call: "POST /transparency/discrepancy-reports/${d1}/triage", payload: { outcome: "CONFIRMED" }, as: ComplianceAuditor }
            - { call: "POST /transparency/discrepancy-reports/${d1}/propose-correction", payload: { proposed_gross_charge_cents: 70000 }, as: TransparencyOfficer, as_user_id: "officer-a" }
            - { call: "POST /transparency/discrepancy-reports/${d1}/approve-correction", as: TransparencyOfficer, as_user_id: "officer-b" }
            - { call: "POST /transparency/discrepancy-reports/${d1}/apply-correction", as: TransparencyOfficer, as_user_id: "officer-a" }
            - { call: "GET /transparency/standard-charge-records?supersedes_id=${r1}", as: TransparencyOfficer, captures: { r2: "$.data[0].id" } }
            - { call: "POST /transparency/discrepancy-reports", payload: { publication_cycle_id: "${cy}", standard_charge_record_id: "${r2}", reporter_type: "INTERNAL", description: "original 100000 was correct" }, as: TransparencyOfficer, captures: { d2: $.data.id } }
            - { call: "POST /transparency/discrepancy-reports/${d2}/triage", payload: { outcome: "CONFIRMED" }, as: ComplianceAuditor }
            - { call: "POST /transparency/discrepancy-reports/${d2}/propose-correction", payload: { proposed_gross_charge_cents: 100000 }, as: TransparencyOfficer, as_user_id: "officer-b" }
            - { call: "POST /transparency/discrepancy-reports/${d2}/approve-correction", as: TransparencyOfficer, as_user_id: "officer-a" }
          trigger:
            - { call: "POST /transparency/discrepancy-reports/${d2}/apply-correction", as: TransparencyOfficer, as_user_id: "officer-b" }
            - { call: "GET /transparency/publication-cycles/${cy}", as: TransparencyOfficer, captures: { gross_end: $.data.total_gross_cents, cnt_end: $.data.validated_record_count } }
            - { call: "GET /transparency/standard-charge-records?supersedes_id=${r2}", as: TransparencyOfficer, captures: { r3: "$.data[0].id", r3_st: "$.data[0].status", r3_gross: "$.data[0].gross_charge_cents" } }
          assert:
            - "after forward+compensating pair: cycle.total_gross_cents == 100000 — the original monetary total is restored exactly, no drift"
            - "cycle.validated_record_count == 1 still (one active record per supersede hop)"
            - "R3.status == PUBLISHED with gross_charge_cents == 100000 and supersedes_id == R2.id; R1 and R2 both SUPERSEDED"
