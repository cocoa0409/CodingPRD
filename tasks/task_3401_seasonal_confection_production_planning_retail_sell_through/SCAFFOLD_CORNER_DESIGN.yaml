            - call: "POST /confection/production-runs/${run_id}/complete"
              payload: { produced_units: 10, warehouse_id: "${wh_id}" }
              as: ProductionPlanner
            - *c_g4
            - *c_adv_inprod
            - *c_clock_0715
            - *c_g5
            - *c_adv_ship
            - *c_clock_0920
            - *c_g6
            - *c_adv_onshelf
            - *c_clock_1115
            - *c_g7
            - *c_adv_disposition
            - call: "POST /confection/disposition-orders"
              payload: { program_id: "${prog_id}", product_id: "${prod_id}", warehouse_id: "${wh_id}", units: 10, channel: "DESTRUCTION" }
