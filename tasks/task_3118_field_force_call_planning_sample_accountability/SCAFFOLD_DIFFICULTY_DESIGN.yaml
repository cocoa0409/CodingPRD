# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3118_field_force_call_planning_sample_accountability
#
# Depth probe: 2+ instances per Difficulty Rule (§0.5). Every instance grounds
# in SCAFFOLD.yaml §1.1–§1.7 and ships a verbatim-executable test_recipe.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rep_available_units_forward_vs_confirmed_during_open_transfer
        grounds:
          - calculations.rep_available_units
          - entities.RepLotBalance.fields.qty_available_forward
          - entities.RepLotBalance.fields.qty_available_confirmed
        distinguishing_aspect: |
          Entity domain = RepLotBalance (rep inventory). With one REQUESTED
          (not yet accepted) transfer of 8 units out of an issued balance of
          50, the forward_looking variant reports 42 while the confirmed_ledger
          variant reports 50 — same ledger row, same inputs, two documented
          variants diverging by exactly the in-transit reserve.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Region R1; Territory T1 (cycle 2026-09-01..2026-12-01) and Territory T2 in R1."
            - "Sender rep S in T1, receiver rep V in T2 (both ACTIVE, no managers needed)."
            - "Product P (non-controlled); lot L1 expires 2027-06-01 with 500 units received; 50 units issued to S."
            - "A REQUESTED transfer of 8 units on L1 from S to V exists."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "NE-01", name: "Northeast" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
              payload: { territory_code: "T1", name: "Boston North", cycle_start_date: "2026-09-01T00:00:00Z", cycle_end_date: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
              payload: { territory_code: "T2", name: "Boston South", cycle_start_date: "2026-09-01T00:00:00Z", cycle_end_date: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { t2_id: $.data.id }
            - call: "POST /field-force/territories/${t1_id}/representatives"
              payload: { employee_id: "E1001", full_name: "Sender Sam", hire_date: "2024-01-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { rep_s: $.data.id }
            - call: "POST /field-force/territories/${t2_id}/representatives"
              payload: { employee_id: "E1002", full_name: "Receiver Vic", hire_date: "2024-01-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { rep_v: $.data.id }
            - call: "POST /field-force/products"
              payload: { ndc_code: "0006-0001", brand_name: "Brandex", controlled: false, per_visit_max_units: 10, annual_max_units_per_prescriber: 100, storage_temp_min_c: 2.0, storage_temp_max_c: 8.0 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /field-force/products/${p_id}/sample-lots"
              payload: { lot_number: "LOT-A1", expiration_date: "2027-06-01T00:00:00Z", quantity_received: 500 }
              as: PlatformAdmin
              captures: { lot_id: $.data.id, lot_v: $.data.version }
            - call: "POST /field-force/representatives/${rep_s}/lot-balances"
              payload: { lot_id: "${lot_id}", quantity: 50 }
              as: PlatformAdmin
              captures: { bal_s: $.data.id }
            - call: "POST /field-force/sample-transfers"
              payload: { to_rep_id: "${rep_v}", lot_id: "${lot_id}", quantity: 8, reason_code: "REBALANCE", documentation_note: "Rebalancing stock ahead of Q4 push", expected_lot_version: "${lot_v} + 1" }
              as: FieldRep
              as_user_id: "${rep_s}"
          trigger:
            - call: "GET /field-force/lot-balances/${bal_s}"
              payload: {}
              as: FieldRep
              as_user_id: "${rep_s}"
          assert:
            - "RepLotBalance.${bal_s}.qty_available_forward == 42"
            - "RepLotBalance.${bal_s}.qty_available_confirmed == 50"
            - "RepLotBalance.${bal_s}.qty_in_transit_out == 8"
            - "qty_available_confirmed - qty_available_forward == 8 (the divergence is exactly the open reserve)"

