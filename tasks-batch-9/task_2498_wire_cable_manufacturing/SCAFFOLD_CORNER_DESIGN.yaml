              payload: {}
              as: ProcessEngineer
              captures: { s3_quality_after: $.data.quality_state, s3_process_after: $.data.process_state }
            - call: "GET /production-lots/${lot_s1}"
              payload: {}
              as: ProcessEngineer
              captures: { s1_quality_after: $.data.quality_state }
            - call: "POST /production-lots/${lot_s3}/process-steps"
              payload: { step: "DRAWING" }
              as: ProcessEngineer
              captures: { e_quarantined_lot: $.data.error_id }
          assert:
            - "the setup arithmetic is exact: ${s1_consumed} == 100.00, ${s2_consumed} == 10.00, ${s3_consumed} == 20.00 and ${s1_conc} == 85.94 (27.5 / 32.0), so the lots fail on the electrical test, not on dimensions"
            - "${s1_hipot_result} == \"FAIL\" (2.4 kV against the 2.5 kV LV_600 requirement) which is what makes the lot dispositionable"
            - "the first scrap posts the mass: ${s1_process} == \"SCRAP_CLOSED\", ${s1_quality} == \"SCRAPPED\", ${rod_scrapped_at_boundary} == 100.00, ${rod_committed_at_boundary} == 30.00, ${rod_remaining_at_boundary} == 870.00"
            - "at exactly the threshold nothing fires: round(100 * 100.00 / 1000.00, 2) == 10.00 which is NOT > 10.0, so ${rod_status_at_boundary} == \"RECEIVED\" and ${s3_quality_at_boundary} == \"PENDING\""
            - "the second scrap of only 10.00 lbs tips it: ${rod_scrapped_after} == 110.00, round(100 * 110.00 / 1000.00, 2) == 11.00 > 10.0, so ${rod_status_after} == \"QUARANTINED\""
            - "the ledger still closes after the cascade: ${rod_remaining_after} == 870.00, ${rod_committed_after} == 20.00, 870.00 + 20.00 + 110.00 == 1000.00"
            - "the cascade reaches exactly the innocent bystander: ${s3_quality_after} == \"QUARANTINED\" while ${s3_process_after} == \"QUEUED\" is untouched"
            - "the cascade skips lots that are not PENDING: ${s1_quality_after} == \"SCRAPPED\" and ${s2_quality} == \"SCRAPPED\" - neither the causing lot nor the earlier scrapped lot is rewritten to QUARANTINED"
            - "${e_quarantined_lot} == \"ERR_INVALID_LOT_STATE\" with HTTP 409: QUEUED -> DRAWN requires quality_state IN {PENDING, REWORK}, so the quarantine really does stop the bystander lot from being produced"

      - name: layers_compose_on_one_request
        claim_type: layer_interaction
        grounds:
          - validations[priority=35]
          - validations[priority=72]
          - validations[priority=80]
          - complexity_profile.layers
        distinguishing_aspect: "POST /shipments carries three of the four declared layers at once - an OCC guard, a quantity threshold and a fiscal threshold - plus the widest side-effect fan-out in the system. With all three armed simultaneously the 412 fires first and nothing else runs; each repair exposes exactly the next rung, and only the last attempt executes the cascade."
        test_recipe:
          setup:
            - "Order SO-1001 for 6.000 kft with two released lots: LOT-A packaged 5000 ft on reel R-001 (deposit 450.00) and LOT-B packaged 2000 ft on reel R-002 (deposit 300.00)."
            - "The first shipment of 5000 ft is made legitimately, which bumps the order version and charges the 450.00 deposit; the credit limit is then dropped to 400.00 so the account is already on CREDIT_HOLD when the second shipment is attempted."
