            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${s12}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "LACERATION", benefit_amount_cents: 5000, max_occurrences_per_year: 1, lifetime_max_cents: 500000 }], monthly_premium_cents: 3000, wellness_benefit_cents: 5000, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { sch12: $.data.id } }
