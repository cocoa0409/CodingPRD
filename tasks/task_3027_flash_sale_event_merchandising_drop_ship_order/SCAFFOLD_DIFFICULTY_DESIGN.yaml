              payload: { event_id: "${event_a_id}", vendor_sku: "A-1", unit_price_cents: 400, vendor_unit_cost_cents: 200, allocation_units: 5, reveal_at: "2026-09-05T00:00:00Z" }
              as: Merchandiser
            - call: "POST /events/${event_a_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Event B", starts_at: "2026-09-10T00:00:00Z", ends_at: "2026-09-11T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_b_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_b_id}", vendor_sku: "B-1", unit_price_cents: 400, vendor_unit_cost_cents: 200, allocation_units: 5, reveal_at: "2026-09-10T00:00:00Z" }
              as: Merchandiser
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Event C adjacent to A", starts_at: "2026-09-06T00:00:00Z", ends_at: "2026-09-07T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_c_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_c_id}", vendor_sku: "C-1", unit_price_cents: 400, vendor_unit_cost_cents: 200, allocation_units: 5, reveal_at: "2026-09-06T00:00:00Z" }
              as: Merchandiser
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Event D spanning both", starts_at: "2026-09-06T12:00:00Z", ends_at: "2026-09-09T12:00:00Z", ship_time_quote_days: 14 }
