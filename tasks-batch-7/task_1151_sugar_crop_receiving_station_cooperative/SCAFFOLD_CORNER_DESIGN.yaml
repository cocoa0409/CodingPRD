  - section: calculations
    instances:
      - name: provisional_factor_clamped_at_minimum
        claim_type: correct_result
        grounds: [calculations.payment_factor]
        distinguishing_aspect: "PROVISIONAL clamps to 0.70: quick sugar 8.00 gives raw base 0.68, clamped to exactly 0.7000; provisional value uses the clamped factor."
        test_recipe:
          setup: ["campaign (base 5500), member, station, booking CONFIRMED; ticket weighed 60000/32000 (net 28000 lbs = 14.0 t); quick sample sugar 8.00 trash 2.00"]
          setup_api_calls:
            - { call: "POST /api/campaigns", payload: { name: "C", window_start: "2026-09-15T00:00:00Z", window_end: "2026-11-20T00:00:00Z", base_price_cents_per_ton: 5500 }, as: COOP_ADMIN, captures: { camp_id: $.data.id } }
