              captures: { x1_link2: $.data.id }
          assert:
            - "the stale create fails 412 with error_id ERR_STALE_VERSION"
            - "PurchaseOrder.${x1_po}.version == 2 after the first link create (OCC parent bump)"
            - "the retry with the fresh version succeeds 201; PurchaseOrder.${x1_po}.version == 3"

