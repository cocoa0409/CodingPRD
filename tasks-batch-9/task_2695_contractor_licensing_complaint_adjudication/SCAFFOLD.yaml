# =============================================================================
# task_2695 — Contractor Licensing & Complaint Adjudication
# State contractors licensing board: classification, qualification, coverage
# monitoring, complaint adjudication, discipline, and consumer recovery fund.
# §1.0–§1.7. (§1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
#             §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2695. Contractor Licensing & Complaint Adjudication (state contractors licensing board): license classification by trade with examination, experience and financial responsibility requirements, bond and insurance verification with continuous coverage monitoring, qualifying individual designation, responsible managing employee rules and entity relationship changes, consumer complaint intake with jurisdiction screening and mediation attempts, investigation, citation issuance and disciplinary hearings with sanction ladders, recovery fund claims for consumers harmed by licensed contractors with payment caps and license suspension until repayment, unlicensed practice enforcement and sting operations, license renewal, continuing education and reinstatement after suspension

domain_name: contractor-licensing-board
api_prefix: /licensing

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §0.1–§0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection directly under /licensing; parentage is
  # expressed only through FK fields (no entity nested inside another entity's
  # URL path except the immutable ExamResult event log under its qualifier).

  state_machine_shape: cyclic
  # LicenseApplication SUBMITTED->DEFICIENT->SUBMITTED (cure loop, capped),
  # Complaint MEDIATION->INVESTIGATION->MEDIATION (remand loop, capped),
  # License ACTIVE->SUSPENDED->ACTIVE and ACTIVE->EXPIRED->ACTIVE, plus a
  # parallel dimension on License (status x compliance_posture) and a
  # branching fork-join on Citation (appeal branch vs default-final branch).

  relationship_patterns:
    - one_to_many
    - many_to_many          # License <-> QualifyingIndividual via QualifierAssignment
    - self_referential      # License.predecessor_license_id -> License.id
    - cross_aggregate       # RecoveryFundClaim spans Consumer, Complaint, License, RecoveryFundAccount

  role_model: segregation_of_duties
  # The investigator who built the case may not preside over its hearing; the
  # presiding officer alone may render its decision; the fund adjudicator is a
  # separate office from both.

  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: TradeClassification
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Statutory classification code, e.g. C-10", constraints: "unique; 2-8 chars" }
      - { name: name, type: string, source: input, description: "Trade name, e.g. Electrical" }
      - { name: hazard_tier, type: integer, source: input, description: "Public-hazard tier driving bond size, penalty multiplier and sanction weight", constraints: "1 | 2 | 3" }
      - { name: min_experience_months, type: integer, source: input, description: "Journey-level experience months a qualifying individual must show", constraints: ">= 0" }
      - { name: min_net_worth_cents, type: integer, source: input, description: "Financial-responsibility minimum declared net worth in cents", constraints: ">= 0" }
      - { name: required_bond_amount_cents, type: integer, source: input, description: "Minimum contractor bond face amount in cents" }
      - { name: required_ce_hours, type: integer, source: input, description: "Continuing-education hours required per renewal term" }
      - { name: renewal_base_fee_cents, type: integer, source: input, description: "Base renewal fee in cents before surcharges and fund assessment" }
      - { name: mediation_required, type: boolean, source: input, default: true, description: "When true, an accepted complaint against a live license is routed to MEDIATION before INVESTIGATION" }

  - name: RecoveryFundAccount
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Appropriation year the pool belongs to", constraints: "unique" }
      - { name: initial_balance_cents, type: integer, source: input, description: "Appropriated pool size in cents; immutable after creation" }
      - { name: per_claim_cap_cents, type: integer, source: input, description: "Statutory maximum award for a single claim" }
      - { name: per_license_aggregate_cap_cents, type: integer, source: input, description: "Statutory maximum total awards chargeable to one license, lifetime" }
      - { name: balance_cents, type: integer, source: computed, description: "= initial_balance_cents - SUM(RecoveryFundClaim.paid_amount_cents WHERE fund_account_id = this.id AND status IN {PAID, REIMBURSED}) + SUM(RecoveryFundClaim.repaid_amount_cents WHERE fund_account_id = this.id)" }

  - name: Licensee
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered business name of the contracting entity" }
      - { name: entity_type, type: enum, source: input, description: "Business form of the licensee", constraints: "SOLE_PROPRIETOR | PARTNERSHIP | CORPORATION | LLC" }
      - { name: contact_email, type: string, source: input, description: "Board-of-record contact address" }
      - { name: unpaid_penalty_cents, type: integer, source: computed, default: 0, description: "= SUM(Citation.civil_penalty_cents - Citation.penalty_paid_cents) over Citations whose license_id belongs to this Licensee AND Citation.status IN {FINAL, AFFIRMED, MODIFIED}" }
      - { name: outstanding_recovery_payout_cents, type: integer, source: computed, default: 0, description: "= SUM(License.outstanding_recovery_repayment_cents) over Licenses WHERE licensee_id = this.id" }

  - name: QualifyingIndividual
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legal name of the person qualifying one or more licenses" }
      - { name: verified_experience_months, type: integer, source: input, description: "Board-verified journey-level experience in months" }
      - { name: active_qualification_count, type: integer, source: computed, default: 0, description: "= COUNT(QualifierAssignment WHERE qualifying_individual_id = this.id AND status = ACTIVE)" }

  - name: ExamResult
    parent: QualifyingIndividual
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-generated identifier; declared explicitly because this entity carries no common_fields block (no version, no updated_at — the exam record is immutable)" }
      - { name: created_at, type: datetime, source: system, description: "Server-stamped creation timestamp from the logical clock" }
      - { name: qualifying_individual_id, type: string, source: input, description: "FK -> QualifyingIndividual.id; taken from the request path" }
      - { name: exam_type, type: enum, source: input, description: "Which statutory examination was sat", constraints: "TRADE | LAW_AND_BUSINESS" }
      - { name: trade_code, type: string, source: input, description: "TradeClassification.code the TRADE exam covers; must be omitted when exam_type = LAW_AND_BUSINESS", constraints: "required iff exam_type = TRADE" }
      - { name: score, type: integer, source: input, description: "Raw scaled score", constraints: "0..100" }
      - { name: passed, type: boolean, source: computed, description: "= score >= EXAM_PASS_SCORE (70); exact 70 passes" }
      - { name: taken_on, type: string, source: input, description: "ISO date (YYYY-MM-DD) the exam was sat" }
      - { name: expires_on, type: string, source: computed, description: "= taken_on + EXAM_VALIDITY_MONTHS (48); a passed exam stops satisfying eligibility once the logical clock date is > expires_on" }

  - name: LicenseApplication
    parent: null
    common_fields: true
    fields:
      - { name: licensee_id, type: string, source: input, description: "FK -> Licensee.id; the applying contracting entity" }
      - { name: classification_id, type: string, source: input, description: "FK -> TradeClassification.id; the trade being applied for" }
      - { name: qualifying_individual_id, type: string, source: input, description: "FK -> QualifyingIndividual.id; person offered as qualifier for this application" }
      - { name: predecessor_license_id, type: string, source: input, description: "FK -> License.id; nullable, required when application_type = REINSTATEMENT and names the REVOKED or long-EXPIRED license being replaced" }
      - { name: application_type, type: enum, source: input, description: "Filing basis", constraints: "ORIGINAL | ADDITIONAL_CLASSIFICATION | REINSTATEMENT" }
      - { name: education_credential, type: enum, source: input, default: NONE, description: "Credential offered as partial experience substitution", constraints: "NONE | APPRENTICESHIP | TWO_YEAR_DEGREE | FOUR_YEAR_DEGREE" }
      - { name: declared_net_worth_cents, type: integer, source: input, description: "Declared net worth for the financial-responsibility test" }
      - { name: credited_experience_months, type: integer, source: computed, description: "Output of calculations.credited_experience_months; recomputed on submit and on cure" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Application lifecycle state", constraints: "DRAFT | SUBMITTED | DEFICIENT | APPROVED | DENIED | WITHDRAWN" }
      - { name: deficiency_round_count, type: integer, source: computed, default: 0, description: "Number of DEFICIENT decisions issued on this application; the MAX_DEFICIENCY_ROUNDS-th (3rd) deficiency finding lands the application in DENIED instead of DEFICIENT" }
      - { name: deficiency_reason, type: string, source: system, description: "Last deficiency narrative; null unless a DEFICIENT decision has been issued" }
      - { name: denial_reason, type: string, source: system, description: "Denial narrative; null unless status = DENIED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of the most recent DRAFT->SUBMITTED or DEFICIENT->SUBMITTED transition" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: licensee_id, type: string, source: system, description: "FK -> Licensee.id; copied from the approved application" }
      - { name: classification_id, type: string, source: system, description: "FK -> TradeClassification.id; copied from the approved application" }
      - { name: application_id, type: string, source: system, description: "FK -> LicenseApplication.id; the application whose APPROVED decision minted this license" }
      - { name: qualifying_individual_id, type: string, source: system, description: "FK -> QualifyingIndividual.id; nullable, the currently ACTIVE qualifier of record" }
      - { name: predecessor_license_id, type: string, source: system, description: "FK -> License.id; nullable self-reference, set when the minting application was a REINSTATEMENT" }
      - { name: license_number, type: string, source: system, description: "Board license number", constraints: "unique" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Licensure dimension of the parallel state machine", constraints: "ACTIVE | SUSPENDED | EXPIRED | REVOKED" }
      - { name: compliance_posture, type: enum, source: computed, default: COMPLIANT, description: "Compliance dimension of the parallel state machine; output of calculations.license_compliance_posture", constraints: "COMPLIANT | CONDITIONAL | NON_COMPLIANT" }
      - { name: issued_on, type: string, source: system, description: "ISO date the license was minted, from the logical clock" }
      - { name: expires_on, type: string, source: system, description: "ISO date the term ends; = issued_on + LICENSE_TERM_MONTHS (24) at issuance" }
      - { name: suspension_reason, type: enum, source: system, description: "Why the license sits in SUSPENDED; null otherwise", constraints: "RECOVERY_FUND_PAYOUT | BOND_LAPSE | DISCIPLINARY" }
      - { name: suspension_until, type: string, source: system, description: "ISO date before which reinstatement is barred; null for indefinite (repayment- or coverage-conditioned) suspensions" }
      - { name: ce_hours_completed, type: number, source: computed, default: 0, description: "Continuing-education hours banked toward the current term; reset to 0 by a successful renewal and by reinstatement" }
      - { name: outstanding_recovery_repayment_cents, type: integer, source: computed, default: 0, description: "= SUM(RecoveryFundClaim.paid_amount_cents - RecoveryFundClaim.repaid_amount_cents) over claims WHERE license_id = this.id AND status IN {PAID, REIMBURSED}" }
      - { name: recovery_paid_to_date_cents, type: integer, source: computed, default: 0, description: "= SUM(RecoveryFundClaim.paid_amount_cents) over claims WHERE license_id = this.id AND status IN {PAID, REIMBURSED}" }
      - { name: recovery_encumbered_cents, type: integer, source: computed, default: 0, description: "= SUM(RecoveryFundClaim.awarded_amount_cents) over claims WHERE license_id = this.id AND status IN {APPROVED, PAID, REIMBURSED}; drives the per-license aggregate cap" }
      - { name: last_renewed_on, type: string, source: system, description: "ISO date of the most recent successful renewal; null before the first renewal" }
      - { name: renewal_count, type: integer, source: computed, default: 0, description: "Number of successful renewals on this license" }
      - { name: last_renewal_fee_cents, type: integer, source: computed, description: "Fee assessed by calculations.renewal_fee on the most recent successful renewal; null before the first renewal" }

  - name: CoverageRecord
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id; the license the policy protects" }
      - { name: coverage_type, type: enum, source: input, description: "Instrument class", constraints: "BOND | GENERAL_LIABILITY | WORKERS_COMP" }
      - { name: carrier_name, type: string, source: input, description: "Surety or insurer of record" }
      - { name: policy_number, type: string, source: input, description: "Carrier policy or bond number" }
      - { name: amount_cents, type: integer, source: input, description: "Face amount of the bond or per-occurrence limit in cents" }
      - { name: effective_date, type: string, source: input, description: "ISO date the coverage period opens (inclusive)" }
      - { name: expiration_date, type: string, source: input, description: "ISO date the coverage period closes (EXCLUSIVE — coverage does not exist on this date)" }
      - { name: status, type: enum, source: system, default: PENDING_VERIFICATION, description: "Verification lifecycle", constraints: "PENDING_VERIFICATION | VERIFIED | REJECTED | CANCELLED | LAPSED" }
      - { name: verified_on, type: string, source: system, description: "ISO date the analyst confirmed the instrument with the carrier; null until VERIFIED" }
      - { name: cancellation_date, type: string, source: system, description: "ISO date the carrier cancellation took effect; null unless CANCELLED" }

  - name: QualifierAssignment
    parent: null
    common_fields: true
    fields:
      - { name: license_id, type: string, source: input, description: "FK -> License.id; license being qualified" }
      - { name: qualifying_individual_id, type: string, source: input, description: "FK -> QualifyingIndividual.id; the designated person" }
      - { name: relationship_type, type: enum, source: input, description: "Statutory relationship of the qualifier to the licensee", constraints: "RESPONSIBLE_MANAGING_OFFICER | RESPONSIBLE_MANAGING_EMPLOYEE" }
      - { name: ownership_pct, type: number, source: input, default: 0, description: "Percentage of the licensee owned by the qualifier; RESPONSIBLE_MANAGING_OFFICER requires >= 10" }
      - { name: effective_from, type: string, source: input, description: "ISO date designation begins (INCLUSIVE)" }
      - { name: effective_to, type: string, source: input, description: "ISO date designation ends (INCLUSIVE — the designation still occupies the qualifier on this date); nullable for an open-ended designation, which occupies every date >= effective_from" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Designation lifecycle", constraints: "ACTIVE | WITHDRAWN | SUSPENDED_BY_LICENSE | TERMINATED_BY_REVOCATION" }
      - { name: withdrawn_on, type: string, source: system, description: "ISO date the designation was withdrawn; null unless WITHDRAWN" }

  - name: Consumer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Complaining consumer's legal name" }
      - { name: contact_email, type: string, source: input, description: "Contact address of record" }
      - { name: mailing_state, type: string, source: input, description: "Two-letter state code of the consumer's mailing address" }

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - { name: consumer_id, type: string, source: input, description: "FK -> Consumer.id; the complaining party" }
      - { name: license_id, type: string, source: input, description: "FK -> License.id; nullable — omitted when the accused party holds no license (unlicensed-practice allegation)" }
      - { name: subject_business_name, type: string, source: input, description: "Trade name of the accused party; required when license_id is omitted" }
      - { name: alleged_loss_cents, type: integer, source: input, description: "Consumer's claimed out-of-pocket damage in cents" }
      - { name: contract_date, type: string, source: input, description: "ISO date the consumer signed with the accused party" }
      - { name: work_completed_on, type: string, source: input, description: "ISO date work stopped or was abandoned; nullable, defaults to contract_date for statute-of-limitations math" }
      - { name: description, type: string, source: input, description: "Narrative of the allegation" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "Adjudication lifecycle", constraints: "RECEIVED | MEDIATION | INVESTIGATION | CITATION_ISSUED | CLOSED_RESOLVED | CLOSED_UNFOUNDED | CLOSED_SANCTIONED | DISMISSED_NO_JURISDICTION | WITHDRAWN" }
      - { name: mediation_round_count, type: integer, source: computed, default: 0, description: "Number of times this complaint has entered MEDIATION; capped by MAX_MEDIATION_ROUNDS (2)" }
      - { name: mediation_deadline, type: string, source: system, description: "ISO date the current mediation attempt lapses; = clock date + MEDIATION_WINDOW_DAYS (30) on each entry to MEDIATION" }
      - { name: settlement_amount_cents, type: integer, source: system, default: 0, description: "Cash the consumer actually received through mediation; offsets any later recovery-fund award" }
      - { name: jurisdiction_basis, type: enum, source: system, description: "Screening outcome basis; null until screened", constraints: "LICENSED_SUBJECT | UNLICENSED_PRACTICE" }
      - { name: dismissal_reason, type: string, source: system, description: "Why jurisdiction was declined; null unless DISMISSED_NO_JURISDICTION" }

  - name: Investigation
    parent: null
    common_fields: true
    fields:
      - { name: complaint_id, type: string, source: input, description: "FK -> Complaint.id; nullable — null exactly when origin = STING" }
      - { name: subject_license_id, type: string, source: input, description: "FK -> License.id; nullable — null when the target holds no license" }
      - { name: subject_business_name, type: string, source: input, description: "Trade name of the target; required when subject_license_id is omitted" }
      - { name: origin, type: enum, source: input, description: "How the case reached enforcement", constraints: "COMPLAINT | STING" }
      - { name: assigned_investigator_user_id, type: string, source: system, description: "X-User-ID of the Investigator who opened the case; the only actor allowed to close it and to issue its citation" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Investigation lifecycle", constraints: "OPEN | SUBSTANTIATED | UNSUBSTANTIATED" }
      - { name: finding_severity, type: enum, source: system, description: "Severity found at closure; null while OPEN or when UNSUBSTANTIATED", constraints: "MINOR | SERIOUS | EGREGIOUS" }
      - { name: evidence_summary, type: string, source: system, description: "Closure narrative; null while OPEN" }
      - { name: opened_on, type: string, source: system, description: "ISO date the case opened, from the logical clock" }
      - { name: closed_on, type: string, source: system, description: "ISO date the case closed; null while OPEN" }

  - name: Citation
    parent: null
    common_fields: true
    fields:
      - { name: investigation_id, type: string, source: input, description: "FK -> Investigation.id; the SUBSTANTIATED case being cited" }
      - { name: license_id, type: string, source: system, description: "FK -> License.id; nullable, copied from investigation.subject_license_id" }
      - { name: classification_id, type: string, source: input, description: "FK -> TradeClassification.id; the trade whose hazard_tier grades the penalty and the sanction. When the investigation names a licensed subject this must equal that License.classification_id" }
      - { name: subject_type, type: enum, source: computed, description: "= LICENSED when license_id is non-null, else UNLICENSED; doubles the penalty base and adds sanction points", constraints: "LICENSED | UNLICENSED" }
      - { name: violation_code, type: string, source: input, description: "Statutory violation reference, e.g. B-7109" }
      - { name: severity, type: enum, source: computed, description: "Copied from investigation.finding_severity at issuance", constraints: "MINOR | SERIOUS | EGREGIOUS" }
      - { name: civil_penalty_cents, type: integer, source: computed, description: "Output of calculations.citation_civil_penalty; overwritten by the POST_HEARING_RECALCULATION variant when a hearing decides the appeal" }
      - { name: penalty_variant, type: enum, source: computed, default: INITIAL_ASSESSMENT, description: "Which calculations.citation_civil_penalty variant produced the stored civil_penalty_cents", constraints: "INITIAL_ASSESSMENT | POST_HEARING_RECALCULATION" }
      - { name: penalty_paid_cents, type: integer, source: computed, default: 0, description: "Cents actually remitted against civil_penalty_cents" }
      - { name: prior_final_citation_count, type: integer, source: computed, default: 0, description: "= COUNT(other Citations WHERE license_id = this.license_id AND status IN {FINAL, AFFIRMED, MODIFIED, SATISFIED}); recomputed when the penalty is recalculated and when a sanction is graded" }
      - { name: correction_due_date, type: string, source: input, description: "ISO date by which the order of correction must be performed" }
      - { name: correction_completed_on, type: string, source: system, description: "ISO date the correction was accepted; null until compliance is filed" }
      - { name: issued_on, type: string, source: system, description: "ISO date of issuance, from the logical clock" }
      - { name: appeal_deadline, type: string, source: computed, description: "= issued_on + APPEAL_WINDOW_DAYS (15); an appeal filed when the clock date is > appeal_deadline is barred" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "Citation lifecycle across the appeal branch and the default-final branch", constraints: "ISSUED | APPEAL_REQUESTED | HEARING_SCHEDULED | AFFIRMED | MODIFIED | VACATED | FINAL | SATISFIED" }

  - name: DisciplinaryHearing
    parent: null
    common_fields: true
    fields:
      - { name: citation_id, type: string, source: input, description: "FK -> Citation.id; the appealed citation on the calendar" }
      - { name: presiding_officer_user_id, type: string, source: input, description: "X-User-ID of the HearingOfficer who will preside; must differ from the citation's investigation.assigned_investigator_user_id" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "ISO 8601 UTC start of the hearing block" }
      - { name: scheduled_end_utc, type: datetime, source: input, description: "ISO 8601 UTC end of the hearing block", constraints: "> scheduled_start_utc" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Hearing lifecycle", constraints: "SCHEDULED | DECIDED" }
      - { name: decision, type: enum, source: system, description: "Disposition of the appeal; null while SCHEDULED", constraints: "AFFIRM | MODIFY | VACATE" }
      - { name: modified_penalty_cents, type: integer, source: system, description: "Penalty substituted by the officer on a MODIFY decision; null otherwise" }
      - { name: sanction_points, type: integer, source: computed, description: "Output of calculations.sanction_points; null until DECIDED" }
      - { name: sanction_tier, type: enum, source: computed, description: "Ladder rung selected by sanction_points; null until DECIDED and always null on a VACATE decision", constraints: "LETTER_OF_REPRIMAND | PROBATION | SUSPENSION_30 | SUSPENSION_90 | REVOCATION" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of the decision; null while SCHEDULED" }

  - name: RecoveryFundClaim
    parent: null
    common_fields: true
    fields:
      - { name: fund_account_id, type: string, source: input, description: "FK -> RecoveryFundAccount.id; the appropriation the claim is charged to" }
      - { name: complaint_id, type: string, source: input, description: "FK -> Complaint.id; the underlying adjudicated complaint" }
      - { name: consumer_id, type: string, source: system, description: "FK -> Consumer.id; copied from the complaint at filing" }
      - { name: license_id, type: string, source: system, description: "FK -> License.id; copied from the complaint at filing — a claim against an unlicensed subject is not fileable" }
      - { name: basis, type: enum, source: input, description: "Statutory basis for reaching the fund", constraints: "FINAL_CITATION | COURT_JUDGMENT" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Loss the consumer asks the fund to cover" }
      - { name: judgment_amount_cents, type: integer, source: input, description: "Unsatisfied civil judgment amount; required iff basis = COURT_JUDGMENT" }
      - { name: judgment_docket_number, type: string, source: input, description: "Court docket reference; required iff basis = COURT_JUDGMENT" }
      - { name: judgment_entered_on, type: string, source: input, description: "ISO date judgment was entered; required iff basis = COURT_JUDGMENT; the fund may not be reached until clock date >= judgment_entered_on + JUDGMENT_RIPENING_DAYS (90)" }
      - { name: estimated_award_cents, type: integer, source: computed, description: "Output of the preliminary_estimate variant of calculations.recovery_award, stamped at filing and never revised" }
      - { name: awarded_amount_cents, type: integer, source: computed, description: "Output of the final_award variant of calculations.recovery_award, stamped at adjudication; null while FILED" }
      - { name: paid_amount_cents, type: integer, source: computed, default: 0, description: "Cents actually disbursed to the consumer; equals awarded_amount_cents unless the pro-rata distribution reduced it" }
      - { name: repaid_amount_cents, type: integer, source: computed, default: 0, description: "Cents the licensee has reimbursed to the fund against this claim" }
      - { name: status, type: enum, source: system, default: FILED, description: "Claim lifecycle", constraints: "FILED | APPROVED | DENIED | PAID | REIMBURSED" }
      - { name: denial_reason, type: string, source: system, description: "Why the claim was denied; null unless DENIED" }
      - { name: adjudicated_on, type: string, source: system, description: "ISO date of the APPROVED/DENIED decision; null while FILED" }
      - { name: paid_on, type: string, source: system, description: "ISO date of disbursement; null until PAID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------- cyclic ----
  - entity: LicenseApplication
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /licensing/license-applications/{id}/submit"
        actor: Licensee
        preconditions:
          - "X-User-ID == application.licensee_id"
          - "application.status == DRAFT"
          - "the application's QualifyingIndividual has an ExamResult with exam_type = LAW_AND_BUSINESS, passed = true, and expires_on >= clock date"
          - "the application's QualifyingIndividual has an ExamResult with exam_type = TRADE, trade_code == classification.code, passed = true, and expires_on >= clock date"
          - "calculations.credited_experience_months >= classification.min_experience_months"
          - "application.declared_net_worth_cents >= classification.min_net_worth_cents"
          - "when application_type = REINSTATEMENT: predecessor_license_id is non-null and that License.status IN {REVOKED, EXPIRED}"
        side_effects:
          - "credited_experience_months recomputed from calculations.credited_experience_months"
          - "submitted_at = logical clock timestamp"
          - "deficiency_reason cleared to null"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /licensing/license-applications/{id}/decision with outcome = DEFICIENT"
        actor: LicensingAnalyst
        preconditions:
          - "application.status == SUBMITTED"
          - "application.deficiency_round_count <= MAX_DEFICIENCY_ROUNDS - 2 (i.e. 0 or 1) — the third finding denies instead"
        side_effects:
          - "deficiency_round_count += 1"
          - "deficiency_reason = request deficiency_reason"
        note: "Cure loop: the applicant may re-submit from DEFICIENT, which returns the row to SUBMITTED."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /licensing/license-applications/{id}/decision with outcome = DEFICIENT when deficiency_round_count == MAX_DEFICIENCY_ROUNDS - 1 (2)"
        actor: LicensingAnalyst
        preconditions:
          - "application.status == SUBMITTED"
          - "application.deficiency_round_count == 2"
        side_effects:
          - "deficiency_round_count = 3"
          - "deficiency_reason = request deficiency_reason"
          - "denial_reason = 'EXCESSIVE_DEFICIENCY_ROUNDS'"
        note: "Automatic threshold denial — the same request body that produced DEFICIENT twice produces DENIED on the third pass."
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /licensing/license-applications/{id}/cure"
        actor: Licensee
        preconditions:
          - "X-User-ID == application.licensee_id"
          - "application.status == DEFICIENT"
          - "all DRAFT->SUBMITTED eligibility preconditions hold against the cured field values"
        side_effects:
          - "declared_net_worth_cents / education_credential / qualifying_individual_id replaced when supplied"
          - "credited_experience_months recomputed"
          - "submitted_at = logical clock timestamp"
        note: "Closes the SUBMITTED -> DEFICIENT -> SUBMITTED cycle."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /licensing/license-applications/{id}/decision with outcome = APPROVED"
        actor: LicensingAnalyst
        preconditions:
          - "application.status == SUBMITTED"
          - "both required ExamResults still satisfy expires_on >= clock date at decision time"
          - "COUNT(QualifierAssignment WHERE qualifying_individual_id = application.qualifying_individual_id AND status = ACTIVE AND interval occupies the clock date) < MAX_CONCURRENT_QUALIFICATIONS (2)"
        side_effects:
          - "cascade hop 1: a License row is created — status = ACTIVE, licensee_id / classification_id / predecessor_license_id copied from the application, application_id = this application, issued_on = clock date, expires_on = issued_on + LICENSE_TERM_MONTHS (24), license_number minted, ce_hours_completed = 0"
          - "cascade hop 2 (caused by hop 1, not by the decision): because a License row now exists with no qualifier of record, a QualifierAssignment is created — license_id = the new License, qualifying_individual_id = application.qualifying_individual_id, relationship_type = RESPONSIBLE_MANAGING_EMPLOYEE, ownership_pct = 0, effective_from = license.issued_on, effective_to = null, status = ACTIVE — and License.qualifying_individual_id is set to it"
          - "cascade hop 3 (caused by hop 2): because that assignment entered ACTIVE, QualifyingIndividual.active_qualification_count += 1"
          - "cascade hop 4 (caused by hop 1): because the new License has no VERIFIED BOND CoverageRecord covering its issued_on, calculations.license_compliance_posture stamps License.compliance_posture = NON_COMPLIANT"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /licensing/license-applications/{id}/decision with outcome = DENIED"
        actor: LicensingAnalyst
        preconditions: ["application.status == SUBMITTED"]
        side_effects: ["denial_reason = request denial_reason"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /licensing/license-applications/{id}/withdraw"
        actor: Licensee
        preconditions: ["X-User-ID == application.licensee_id", "application.status IN {DRAFT, SUBMITTED, DEFICIENT}"]
        side_effects: ["no cross-entity effect"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /licensing/license-applications/{id}/withdraw"
        actor: Licensee
        preconditions: ["X-User-ID == application.licensee_id"]
        side_effects: ["no cross-entity effect"]
      - from: DEFICIENT
        to: WITHDRAWN
        trigger: "POST /licensing/license-applications/{id}/withdraw"
        actor: Licensee
        preconditions: ["X-User-ID == application.licensee_id"]
        side_effects: ["no cross-entity effect"]

  # ------------------------------------------- parallel dimensions + cyclic ---
  - entity: License
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event — cascade hop of POST /licensing/recovery-fund-claims/{id}/pay"
        actor: system
        preconditions:
          - "the paying claim's license_id == this License.id"
          - "license.status == ACTIVE (a license already SUSPENDED keeps its earlier suspension_reason)"
        side_effects:
          - "suspension_reason = RECOVERY_FUND_PAYOUT, suspension_until = null (indefinite until repayment)"
          - "outstanding_recovery_repayment_cents recomputed (now > 0), compliance_posture recomputed to NON_COMPLIANT"
          - "cascade: every QualifierAssignment on this license with status = ACTIVE moves to SUSPENDED_BY_LICENSE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event — cascade hop of POST /licensing/coverage-records/{id}/cancel or of POST /licensing/compliance-sweeps when a BOND record LAPSES"
        actor: system
        preconditions:
          - "no CoverageRecord with coverage_type = BOND AND status = VERIFIED AND effective_date <= clock date < expiration_date remains on this license"
          - "license.status == ACTIVE"
        side_effects:
          - "suspension_reason = BOND_LAPSE, suspension_until = null"
          - "compliance_posture recomputed to NON_COMPLIANT"
          - "cascade: every QualifierAssignment on this license with status = ACTIVE moves to SUSPENDED_BY_LICENSE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event — cascade hop of POST /licensing/disciplinary-hearings/{id}/decide with sanction_tier IN {SUSPENSION_30, SUSPENSION_90}"
        actor: system
        preconditions: ["license.status IN {ACTIVE, EXPIRED}"]
        side_effects:
          - "suspension_reason = DISCIPLINARY, suspension_until = clock date + 30 days (SUSPENSION_30) or + 90 days (SUSPENSION_90)"
          - "cascade: every QualifierAssignment on this license with status = ACTIVE moves to SUSPENDED_BY_LICENSE"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licensing/licenses/{id}/recovery-repayments — the credit that brings outstanding_recovery_repayment_cents to exactly 0"
        actor: Licensee
        preconditions:
          - "license.suspension_reason == RECOVERY_FUND_PAYOUT"
          - "outstanding_recovery_repayment_cents == 0 after the credit is applied"
        side_effects:
          - "suspension_reason = null, suspension_until = null"
          - "cascade: every QualifierAssignment on this license with status = SUSPENDED_BY_LICENSE returns to ACTIVE, and each of those assignments bumps its QualifyingIndividual.active_qualification_count by +1"
          - "compliance_posture recomputed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /licensing/licenses/{id}/reinstate"
        actor: LicensingAnalyst
        preconditions:
          - "license.status == SUSPENDED"
          - "suspension_until is null OR clock date >= suspension_until"
          - "SUM over this license's Citations of (civil_penalty_cents - penalty_paid_cents) WHERE status IN {FINAL, AFFIRMED, MODIFIED} == 0"
          - "outstanding_recovery_repayment_cents == 0"
          - "a CoverageRecord with coverage_type = BOND, status = VERIFIED, effective_date <= clock date < expiration_date exists"
          - "ce_hours_completed >= classification.required_ce_hours"
        side_effects:
          - "suspension_reason = null, suspension_until = null"
          - "ce_hours_completed reset to 0"
          - "cascade: QualifierAssignments in SUSPENDED_BY_LICENSE return to ACTIVE, each bumping its QualifyingIndividual.active_qualification_count by +1"
          - "compliance_posture recomputed"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /licensing/compliance-sweeps (ops-run checkpoint) when clock date > license.expires_on"
        actor: LicensingAnalyst
        preconditions: ["license.status == ACTIVE", "clock date > license.expires_on"]
        side_effects:
          - "compliance_posture recomputed"
          - "QualifierAssignments are deliberately untouched — the qualifier of record survives a lapse"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /licensing/licenses/{id}/renew (delinquent renewal)"
        actor: Licensee
        preconditions:
          - "X-User-ID == license.licensee_id"
          - "clock date <= license.expires_on + DELINQUENT_GRACE_DAYS (90)"
          - "compliance_posture != NON_COMPLIANT"
          - "ce_hours_completed >= classification.required_ce_hours - CE_SHORTFALL_GRACE_HOURS (4)"
        side_effects:
          - "last_renewal_fee_cents computed by calculations.renewal_fee (delinquency surcharge branch taken)"
          - "expires_on = clock date + LICENSE_TERM_MONTHS (24)"
          - "last_renewed_on = clock date, renewal_count += 1, ce_hours_completed reset to 0"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /licensing/licenses/{id}/renew"
        actor: Licensee
        preconditions:
          - "X-User-ID == license.licensee_id"
          - "clock date <= license.expires_on + DELINQUENT_GRACE_DAYS (90)"
          - "compliance_posture != NON_COMPLIANT"
          - "ce_hours_completed >= classification.required_ce_hours - CE_SHORTFALL_GRACE_HOURS (4)"
        side_effects:
          - "last_renewal_fee_cents computed by calculations.renewal_fee"
          - "when clock date <= expires_on (timely): expires_on = previous expires_on + LICENSE_TERM_MONTHS (24) — anchored on the OLD expiry, NOT on the clock, and no delinquency surcharge is assessed"
          - "when clock date > expires_on (delinquent, sweep not yet run): expires_on = clock date + LICENSE_TERM_MONTHS (24) and the delinquency surcharge is assessed"
          - "last_renewed_on = clock date, renewal_count += 1, ce_hours_completed reset to 0"
        note: "Self-loop on the licensure dimension; the compliance dimension is untouched by renewal. NORMATIVE: the timely-vs-delinquent branch is keyed on the CLOCK relative to expires_on, never on License.status — a licence whose term has run but which no compliance sweep has flipped to EXPIRED yet still renews on the delinquent branch."
      - from: ACTIVE
        to: REVOKED
        trigger: "system event — cascade hop of POST /licensing/disciplinary-hearings/{id}/decide with sanction_tier = REVOCATION"
        actor: system
        preconditions: ["license.status IN {ACTIVE, SUSPENDED, EXPIRED}"]
        side_effects:
          - "suspension_reason = null, suspension_until = null"
          - "cascade: every QualifierAssignment on this license with status IN {ACTIVE, SUSPENDED_BY_LICENSE} moves to TERMINATED_BY_REVOCATION; License.qualifying_individual_id = null"
          - "compliance_posture recomputed to NON_COMPLIANT"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system event — cascade hop of POST /licensing/disciplinary-hearings/{id}/decide with sanction_tier = REVOCATION"
        actor: system
        preconditions: ["license.status == SUSPENDED"]
        side_effects:
          - "same cascade as ACTIVE -> REVOKED"

  # ------------------------------------------------------- coverage records ---
  - entity: CoverageRecord
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED, CANCELLED, LAPSED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /licensing/coverage-records/{id}/verification with outcome = VERIFY"
        actor: LicensingAnalyst
        preconditions:
          - "record.status == PENDING_VERIFICATION"
          - "when coverage_type = BOND: amount_cents >= classification.required_bond_amount_cents of the license's classification"
          - "no other CoverageRecord on the same license with the same coverage_type and status = VERIFIED overlaps [effective_date, expiration_date)"
        side_effects:
          - "verified_on = clock date"
          - "License.compliance_posture recomputed by calculations.license_compliance_posture"
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /licensing/coverage-records/{id}/verification with outcome = REJECT"
        actor: LicensingAnalyst
        preconditions: ["record.status == PENDING_VERIFICATION"]
        side_effects: ["License.compliance_posture recomputed (unchanged unless this was the only candidate instrument)"]
      - from: VERIFIED
        to: CANCELLED
        trigger: "POST /licensing/coverage-records/{id}/cancel"
        actor: LicensingAnalyst
        preconditions:
          - "record.status == VERIFIED"
          - "cancellation_date >= record.effective_date"
        side_effects:
          - "cascade hop 1: cancellation_date stored and expiration_date rewritten to cancellation_date, so the record no longer covers any date >= cancellation_date"
          - "cascade hop 2 (caused by hop 1): License.compliance_posture recomputed — NON_COMPLIANT when the cancelled instrument was the license's only BOND covering the clock date; and in that case License.status ACTIVE -> SUSPENDED with suspension_reason = BOND_LAPSE"
          - "cascade hop 3 (caused by hop 2): because the License entered SUSPENDED, every QualifierAssignment on it with status = ACTIVE moves to SUSPENDED_BY_LICENSE"
          - "cascade hop 4 (caused by hop 3): because those assignments left ACTIVE, each QualifyingIndividual.active_qualification_count decreases by 1"
      - from: VERIFIED
        to: LAPSED
        trigger: "POST /licensing/compliance-sweeps (ops-run checkpoint) when clock date >= record.expiration_date"
        actor: LicensingAnalyst
        preconditions: ["record.status == VERIFIED", "clock date >= record.expiration_date"]
        side_effects:
          - "License.compliance_posture recomputed; when no VERIFIED BOND covers the clock date the License moves ACTIVE -> SUSPENDED with suspension_reason = BOND_LAPSE, which in turn suspends its ACTIVE QualifierAssignments and decrements each qualifier's active_qualification_count"

  # ------------------------------------------------- qualifier designations ---
  - entity: QualifierAssignment
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN, TERMINATED_BY_REVOCATION]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /licensing/qualifier-assignments/{id}/withdraw"
        actor: LicensingAnalyst
        preconditions:
          - "assignment.status == ACTIVE"
          - "withdrawn_on >= assignment.effective_from"
        side_effects:
          - "withdrawn_on stored; effective_to rewritten to withdrawn_on"
          - "QualifyingIndividual.active_qualification_count -= 1"
          - "when License.qualifying_individual_id == assignment.qualifying_individual_id, License.qualifying_individual_id = null and License.compliance_posture is recomputed (a license with no qualifier of record is NON_COMPLIANT)"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "system event — a newer QualifierAssignment created on the same license supersedes this designation"
        actor: system
        preconditions: ["assignment.status == ACTIVE", "the superseding assignment's relationship_type == this assignment's relationship_type"]
        side_effects:
          - "withdrawn_on = clock date; effective_to rewritten to clock date"
          - "QualifyingIndividual.active_qualification_count -= 1 for the superseded person"
      - from: ACTIVE
        to: SUSPENDED_BY_LICENSE
        trigger: "system event — cascade hop of a License transition into SUSPENDED"
        actor: system
        preconditions: ["assignment.status == ACTIVE"]
        side_effects: ["QualifyingIndividual.active_qualification_count -= 1"]
      - from: SUSPENDED_BY_LICENSE
        to: ACTIVE
        trigger: "system event — cascade hop of a License transition SUSPENDED -> ACTIVE (repayment completion or reinstatement)"
        actor: system
        preconditions: ["assignment.status == SUSPENDED_BY_LICENSE", "assignment.effective_to is null OR clock date <= assignment.effective_to"]
        side_effects: ["QualifyingIndividual.active_qualification_count += 1"]
      - from: ACTIVE
        to: TERMINATED_BY_REVOCATION
        trigger: "system event — cascade hop of a License transition into REVOKED"
        actor: system
        preconditions: ["assignment.status == ACTIVE"]
        side_effects: ["QualifyingIndividual.active_qualification_count -= 1", "effective_to rewritten to clock date"]
      - from: SUSPENDED_BY_LICENSE
        to: TERMINATED_BY_REVOCATION
        trigger: "system event — cascade hop of a License transition into REVOKED"
        actor: system
        preconditions: ["assignment.status == SUSPENDED_BY_LICENSE"]
        side_effects: ["active_qualification_count unchanged (the slot was already released on suspension)", "effective_to rewritten to clock date"]

  # ------------------------------------------------------ complaints: cyclic --
  - entity: Complaint
    initial_state: RECEIVED
    terminal_states: [CLOSED_RESOLVED, CLOSED_UNFOUNDED, CLOSED_SANCTIONED, DISMISSED_NO_JURISDICTION, WITHDRAWN]
    transitions:
      - from: RECEIVED
        to: MEDIATION
        trigger: "POST /licensing/complaints/{id}/screen with jurisdiction_finding = ACCEPTED — mediation branch"
        actor: LicensingAnalyst
        preconditions:
          - "complaint.status == RECEIVED"
          - "complaint.license_id is non-null AND that License.status IN {ACTIVE, SUSPENDED, EXPIRED}"
          - "the License's TradeClassification.mediation_required == true"
          - "alleged_loss_cents >= MIN_JURISDICTIONAL_LOSS_CENTS (50000)"
          - "clock date <= COALESCE(work_completed_on, contract_date) + STATUTE_OF_LIMITATIONS_MONTHS (48)"
          - "License.issued_on <= complaint.contract_date"
        side_effects:
          - "jurisdiction_basis = LICENSED_SUBJECT"
          - "mediation_round_count = 1"
          - "mediation_deadline = clock date + MEDIATION_WINDOW_DAYS (30)"
      - from: RECEIVED
        to: INVESTIGATION
        trigger: "POST /licensing/complaints/{id}/screen with jurisdiction_finding = ACCEPTED — direct-enforcement branch"
        actor: LicensingAnalyst
        preconditions:
          - "complaint.status == RECEIVED"
          - "complaint.license_id is null (unlicensed subject) OR the License.status == REVOKED OR the License's TradeClassification.mediation_required == false"
          - "alleged_loss_cents >= MIN_JURISDICTIONAL_LOSS_CENTS (50000)"
          - "clock date <= COALESCE(work_completed_on, contract_date) + STATUTE_OF_LIMITATIONS_MONTHS (48)"
        side_effects:
          - "jurisdiction_basis = UNLICENSED_PRACTICE when license_id is null, else LICENSED_SUBJECT"
          - "mediation_round_count stays 0 and mediation_deadline stays null — the divergent branch never opens a mediation window"
        note: "Fork: the two ACCEPTED branches carry different side-effect sets; the branch is chosen by the subject License's state and its classification's mediation_required flag, never by the request body."
      - from: RECEIVED
        to: DISMISSED_NO_JURISDICTION
        trigger: "POST /licensing/complaints/{id}/screen with jurisdiction_finding = REJECTED"
        actor: LicensingAnalyst
        preconditions: ["complaint.status == RECEIVED", "rejection_reason is supplied"]
        side_effects: ["dismissal_reason = request rejection_reason", "jurisdiction_basis stays null"]
      - from: MEDIATION
        to: CLOSED_RESOLVED
        trigger: "POST /licensing/complaints/{id}/mediation-outcome with outcome = SETTLED"
        actor: LicensingAnalyst
        preconditions: ["complaint.status == MEDIATION", "settlement_amount_cents >= 1"]
        side_effects: ["settlement_amount_cents = request settlement_amount_cents"]
      - from: MEDIATION
        to: INVESTIGATION
        trigger: "POST /licensing/complaints/{id}/mediation-outcome with outcome = FAILED"
        actor: LicensingAnalyst
        preconditions: ["complaint.status == MEDIATION"]
        side_effects: ["settlement_amount_cents = request settlement_amount_cents when supplied (partial settlement), else unchanged", "mediation_deadline = null"]
      - from: INVESTIGATION
        to: MEDIATION
        trigger: "POST /licensing/complaints/{id}/remand-to-mediation"
        actor: Investigator
        preconditions:
          - "complaint.status == INVESTIGATION"
          - "complaint.mediation_round_count < MAX_MEDIATION_ROUNDS (2)"
          - "no Citation has been issued on any Investigation of this complaint"
        side_effects:
          - "mediation_round_count += 1"
          - "mediation_deadline = clock date + MEDIATION_WINDOW_DAYS (30)"
          - "every Investigation on this complaint with status = OPEN is left OPEN (the case is parked, not closed)"
        note: "Closes the MEDIATION -> INVESTIGATION -> MEDIATION cycle; the second remand is barred by the round cap."
      - from: INVESTIGATION
        to: CLOSED_UNFOUNDED
        trigger: "system event — cascade hop of POST /licensing/investigations/{id}/close with finding = UNSUBSTANTIATED"
        actor: system
        preconditions: ["complaint.status == INVESTIGATION"]
        side_effects: ["no monetary effect"]
      - from: INVESTIGATION
        to: CITATION_ISSUED
        trigger: "system event — cascade hop of POST /licensing/citations"
        actor: system
        preconditions: ["complaint.status == INVESTIGATION"]
        side_effects: ["no monetary effect"]
      - from: CITATION_ISSUED
        to: CLOSED_SANCTIONED
        trigger: "system event — cascade hop of POST /licensing/citations/{id}/finalize, or of POST /licensing/disciplinary-hearings/{id}/decide with decision IN {AFFIRM, MODIFY}"
        actor: system
        preconditions: ["complaint.status == CITATION_ISSUED"]
        side_effects: ["the complaint becomes a FINAL_CITATION basis for a RecoveryFundClaim"]
      - from: CITATION_ISSUED
        to: CLOSED_UNFOUNDED
        trigger: "system event — cascade hop of POST /licensing/disciplinary-hearings/{id}/decide with decision = VACATE"
        actor: system
        preconditions: ["complaint.status == CITATION_ISSUED"]
        side_effects: ["no monetary effect"]
      - from: RECEIVED
        to: WITHDRAWN
        trigger: "POST /licensing/complaints/{id}/withdraw"
        actor: Consumer
        preconditions: ["X-User-ID == complaint.consumer_id", "complaint.status IN {RECEIVED, MEDIATION, INVESTIGATION}"]
        side_effects: ["any OPEN Investigation on this complaint stays OPEN — enforcement is not consumer-controlled"]
      - from: MEDIATION
        to: WITHDRAWN
        trigger: "POST /licensing/complaints/{id}/withdraw"
        actor: Consumer
        preconditions: ["X-User-ID == complaint.consumer_id"]
        side_effects: ["mediation_deadline = null"]
      - from: INVESTIGATION
        to: WITHDRAWN
        trigger: "POST /licensing/complaints/{id}/withdraw"
        actor: Consumer
        preconditions: ["X-User-ID == complaint.consumer_id"]
        side_effects: ["any OPEN Investigation on this complaint stays OPEN"]

  # ------------------------------------------------------------ enforcement ---
  - entity: Investigation
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, UNSUBSTANTIATED]
    transitions:
      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /licensing/investigations/{id}/close with finding = SUBSTANTIATED"
        actor: Investigator
        preconditions:
          - "investigation.status == OPEN"
          - "X-User-ID == investigation.assigned_investigator_user_id"
          - "finding_severity is supplied"
          - "when origin = COMPLAINT: the linked Complaint.status == INVESTIGATION"
        side_effects: ["finding_severity, evidence_summary and closed_on stored", "the linked Complaint stays in INVESTIGATION awaiting a citation"]
      - from: OPEN
        to: UNSUBSTANTIATED
        trigger: "POST /licensing/investigations/{id}/close with finding = UNSUBSTANTIATED"
        actor: Investigator
        preconditions:
          - "investigation.status == OPEN"
          - "X-User-ID == investigation.assigned_investigator_user_id"
        side_effects:
          - "evidence_summary and closed_on stored, finding_severity stays null"
          - "cascade: when origin = COMPLAINT and the linked Complaint.status == INVESTIGATION, the Complaint moves to CLOSED_UNFOUNDED"

  - entity: Citation
    initial_state: ISSUED
    terminal_states: [VACATED, SATISFIED]
    transitions:
      - from: ISSUED
        to: APPEAL_REQUESTED
        trigger: "POST /licensing/citations/{id}/appeal"
        actor: Licensee
        preconditions:
          - "citation.status == ISSUED"
          - "citation.license_id is non-null AND X-User-ID == that License.licensee_id"
          - "clock date <= citation.appeal_deadline"
        side_effects: ["appeal grounds recorded in the citation's audit trail; civil_penalty_cents untouched"]
        note: "Appeal branch of the fork."
      - from: ISSUED
        to: FINAL
        trigger: "POST /licensing/citations/{id}/finalize"
        actor: LicensingAnalyst
        preconditions:
          - "citation.status == ISSUED"
          - "clock date > citation.appeal_deadline"
        side_effects:
          - "the INITIAL_ASSESSMENT penalty becomes collectable: Licensee.unpaid_penalty_cents increases by (civil_penalty_cents - penalty_paid_cents)"
          - "cascade: the Complaint behind the citation's Investigation moves CITATION_ISSUED -> CLOSED_SANCTIONED"
          - "License.compliance_posture recomputed to at least CONDITIONAL because unpaid_penalty_cents > 0"
        note: "Default-final branch of the fork — no penalty recalculation, no sanction ladder."
      - from: APPEAL_REQUESTED
        to: HEARING_SCHEDULED
        trigger: "system event — cascade hop of POST /licensing/disciplinary-hearings"
        actor: system
        preconditions: ["citation.status == APPEAL_REQUESTED"]
        side_effects: ["none beyond the status change"]
      - from: HEARING_SCHEDULED
        to: AFFIRMED
        trigger: "system event — cascade hop of POST /licensing/disciplinary-hearings/{id}/decide with decision = AFFIRM"
        actor: system
        preconditions: ["citation.status == HEARING_SCHEDULED"]
        side_effects:
          - "civil_penalty_cents overwritten by the POST_HEARING_RECALCULATION variant of calculations.citation_civil_penalty (which re-reads prior_final_citation_count and applies the 25% mitigation credit when the decide request supplied correction_verified_on <= correction_due_date); penalty_variant = POST_HEARING_RECALCULATION"
          - "correction_completed_on = the decide request's correction_verified_on when supplied"
          - "Licensee.unpaid_penalty_cents increases by the recalculated (civil_penalty_cents - penalty_paid_cents)"
          - "the sanction ladder result is applied to the License (see DisciplinaryHearing SCHEDULED -> DECIDED)"
      - from: HEARING_SCHEDULED
        to: MODIFIED
        trigger: "system event — cascade hop of POST /licensing/disciplinary-hearings/{id}/decide with decision = MODIFY"
        actor: system
        preconditions: ["citation.status == HEARING_SCHEDULED"]
        side_effects:
          - "civil_penalty_cents = hearing.modified_penalty_cents; penalty_variant = POST_HEARING_RECALCULATION"
          - "Licensee.unpaid_penalty_cents increases by the modified (civil_penalty_cents - penalty_paid_cents)"
      - from: HEARING_SCHEDULED
        to: VACATED
        trigger: "system event — cascade hop of POST /licensing/disciplinary-hearings/{id}/decide with decision = VACATE"
        actor: system
        preconditions: ["citation.status == HEARING_SCHEDULED"]
        side_effects:
          - "civil_penalty_cents set to 0 and penalty_variant = POST_HEARING_RECALCULATION"
          - "no sanction is applied to the License and no penalty is added to Licensee.unpaid_penalty_cents"
          - "cascade: the Complaint behind the citation's Investigation moves CITATION_ISSUED -> CLOSED_UNFOUNDED"
      - from: FINAL
        to: SATISFIED
        trigger: "POST /licensing/citations/{id}/comply"
        actor: Licensee
        preconditions:
          - "citation.status IN {FINAL, AFFIRMED, MODIFIED}"
          - "X-User-ID == the License.licensee_id of citation.license_id"
          - "penalty_paid_cents + request penalty_payment_cents == civil_penalty_cents (payment in full, no overpayment)"
        side_effects:
          - "penalty_paid_cents brought to civil_penalty_cents; correction_completed_on = request corrected_on"
          - "Licensee.unpaid_penalty_cents decreases by the amount remitted"
          - "License.compliance_posture recomputed (returns to COMPLIANT when nothing else is outstanding)"
      - from: AFFIRMED
        to: SATISFIED
        trigger: "POST /licensing/citations/{id}/comply"
        actor: Licensee
        preconditions: ["same as FINAL -> SATISFIED"]
        side_effects: ["same as FINAL -> SATISFIED"]
      - from: MODIFIED
        to: SATISFIED
        trigger: "POST /licensing/citations/{id}/comply"
        actor: Licensee
        preconditions: ["same as FINAL -> SATISFIED"]
        side_effects: ["same as FINAL -> SATISFIED"]

  - entity: DisciplinaryHearing
    initial_state: SCHEDULED
    terminal_states: [DECIDED]
    transitions:
      - from: SCHEDULED
        to: DECIDED
        trigger: "POST /licensing/disciplinary-hearings/{id}/decide"
        actor: HearingOfficer
        preconditions:
          - "hearing.status == SCHEDULED"
          - "X-User-ID == hearing.presiding_officer_user_id"
          - "citation.status == HEARING_SCHEDULED"
          - "clock timestamp >= hearing.scheduled_start_utc"
          - "when decision = MODIFY: modified_penalty_cents is supplied and <= STATUTORY_MAX_PENALTY_CENTS (1500000)"
        side_effects:
          - "decision, decided_at stored"
          - "on AFFIRM: the citation's civil_penalty_cents is recalculated by the POST_HEARING_RECALCULATION variant, then sanction_points = calculations.sanction_points and sanction_tier is read off the ladder"
          - "on MODIFY: civil_penalty_cents = modified_penalty_cents, then sanction_points / sanction_tier computed the same way"
          - "on VACATE: sanction_points and sanction_tier stay null"
          - "cascade (AFFIRM/MODIFY): sanction_tier = LETTER_OF_REPRIMAND or PROBATION leaves License.status untouched and only restamps compliance_posture (PROBATION is a CONDITIONAL trigger inside calculations.license_compliance_posture, so a licence that independently qualifies as NON_COMPLIANT stays NON_COMPLIANT); SUSPENSION_30 / SUSPENSION_90 move the License into SUSPENDED with suspension_reason = DISCIPLINARY; REVOCATION moves the License into REVOKED, which in turn terminates its QualifierAssignments, which in turn decrements each qualifier's active_qualification_count"
          - "cascade: the Complaint behind the citation moves CITATION_ISSUED -> CLOSED_SANCTIONED on AFFIRM/MODIFY, or -> CLOSED_UNFOUNDED on VACATE"

  # ----------------------------------------------------------- recovery fund --
  - entity: RecoveryFundClaim
    initial_state: FILED
    terminal_states: [DENIED, REIMBURSED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /licensing/recovery-fund-claims/{id}/adjudicate with outcome = APPROVE"
        actor: FundAdjudicator
        preconditions:
          - "claim.status == FILED"
          - "when basis = FINAL_CITATION: the linked Complaint.status == CLOSED_SANCTIONED"
          - "when basis = COURT_JUDGMENT: the linked Complaint.status IN {MEDIATION, INVESTIGATION, CITATION_ISSUED, CLOSED_SANCTIONED} AND clock date >= judgment_entered_on + JUDGMENT_RIPENING_DAYS (90)"
          - "calculations.recovery_award final_award variant returns a value >= 1"
        side_effects:
          - "awarded_amount_cents = final_award, adjudicated_on = clock date"
          - "License.recovery_encumbered_cents recomputed (the award now counts against the per-license aggregate cap even though no cash has moved)"
      - from: FILED
        to: DENIED
        trigger: "POST /licensing/recovery-fund-claims/{id}/adjudicate with outcome = DENY, or with outcome = APPROVE when the final_award computes to 0"
        actor: FundAdjudicator
        preconditions: ["claim.status == FILED"]
        side_effects:
          - "denial_reason = request denial_reason, or 'AGGREGATE_CAP_EXHAUSTED' when an APPROVE request computed a zero award"
          - "awarded_amount_cents = 0, adjudicated_on = clock date"
      - from: APPROVED
        to: PAID
        trigger: "POST /licensing/recovery-fund-claims/{id}/pay"
        actor: FundAdjudicator
        preconditions:
          - "claim.status == APPROVED"
          - "RecoveryFundAccount.balance_cents >= 1"
        side_effects:
          - "cascade hop 1: calculations.recovery_prorata_distribution runs over every APPROVED claim on this claim's license; each one's paid_amount_cents is stamped, status becomes PAID and paid_on = clock date — including sibling claims that were not the request target"
          - "cascade hop 2 (caused by hop 1): RecoveryFundAccount.balance_cents falls by the total disbursed; License.recovery_paid_to_date_cents and License.outstanding_recovery_repayment_cents rise by the same total; Licensee.outstanding_recovery_payout_cents rises with it"
          - "cascade hop 3 (caused by hop 2): because outstanding_recovery_repayment_cents is now > 0, the License moves ACTIVE -> SUSPENDED with suspension_reason = RECOVERY_FUND_PAYOUT and compliance_posture = NON_COMPLIANT"
          - "cascade hop 4 (caused by hop 3): because the License entered SUSPENDED, every ACTIVE QualifierAssignment on it moves to SUSPENDED_BY_LICENSE, and each of those decrements its QualifyingIndividual.active_qualification_count by 1"
      - from: PAID
        to: REIMBURSED
        trigger: "system event — cascade hop of POST /licensing/licenses/{id}/recovery-repayments once repaid_amount_cents == paid_amount_cents"
        actor: system
        preconditions: ["claim.status == PAID", "repaid_amount_cents == paid_amount_cents after the credit"]
        side_effects:
          - "RecoveryFundAccount.balance_cents rises by the repaid amount; License.outstanding_recovery_repayment_cents falls to 0 when this was the last unreimbursed claim"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — see §0.2)
# =============================================================================
concurrency_rules:
  - rule_id: qualifier-assign-stale-license
    parent_entity: License
    write_endpoint: "POST /licensing/qualifier-assignments"
    occ_field: "expected_license_version"
    description: |
      Designating a qualifier on a License whose version has advanced since the
      client last read it is rejected. A new designation legitimately supersedes
      the license's prior designation of the same relationship_type, so the
      write cannot be rejected by any state precondition — the stale-version
      check is what stops a writer from superseding a designation it never saw.
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412

  - rule_id: repayment-stale-license
    parent_entity: License
    write_endpoint: "POST /licensing/licenses/{id}/recovery-repayments"
    occ_field: "expected_license_version"
    description: |
      Crediting a recovery-fund repayment against a License whose version has
      advanced since the client last read it is rejected. Partial repayments are
      legitimately repeatable, so a later credit computed against a stale view of
      outstanding_recovery_repayment_cents would silently over- or under-pay.
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412

  - rule_id: claim-pay-stale-fund-account
    parent_entity: RecoveryFundAccount
    write_endpoint: "POST /licensing/recovery-fund-claims/{id}/pay"
    occ_field: "expected_fund_account_version"
    description: |
      Disbursing an APPROVED claim against a RecoveryFundAccount whose version
      has advanced since the client last read it is rejected. Approvals do not
      encumber the pool, so a disbursement on any other claim changes the
      balance this payment's pro-rata factor is computed from; the payment is
      otherwise perfectly legal and no state precondition would stop it.
    error_id: ERR_STALE_FUND_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:

  - name: credited_experience_months
    algorithm_type: threshold
    trigger: "POST /licensing/license-applications/{id}/submit and POST /licensing/license-applications/{id}/cure (stamped onto LicenseApplication.credited_experience_months)"
    inputs:
      - "QualifyingIndividual.verified_experience_months of application.qualifying_individual_id"
      - "LicenseApplication.education_credential"
      - "TradeClassification.min_experience_months of application.classification_id"
    formula: |
      base_months        = min(qi.verified_experience_months, EXPERIENCE_CAP_MONTHS)
      raw_edu_credit     = EDU_CREDIT_MONTHS[application.education_credential]
      edu_credit_ceiling = floor(classification.min_experience_months * EDU_SUBSTITUTION_SHARE)
      allowed_edu_credit = min(raw_edu_credit, edu_credit_ceiling)
      credited           = min(base_months + allowed_edu_credit, EXPERIENCE_CAP_MONTHS)
      -- eligibility test elsewhere: credited >= classification.min_experience_months (>= , so exact equality passes)
    constants:
      EXPERIENCE_CAP_MONTHS: 96
      EDU_SUBSTITUTION_SHARE: 0.50
      EDU_CREDIT_MONTHS: { NONE: 0, APPRENTICESHIP: 12, TWO_YEAR_DEGREE: 18, FOUR_YEAR_DEGREE: 36 }
    rounding: "floor on edu_credit_ceiling; all other terms are integers"
    worked_example: |
      min_experience_months = 48, verified_experience_months = 24, education_credential = FOUR_YEAR_DEGREE
        base_months        = 24
        raw_edu_credit     = 36
        edu_credit_ceiling = floor(48 * 0.50) = 24        <-- the credential is clipped
        allowed_edu_credit = min(36, 24) = 24
        credited           = min(24 + 24, 96) = 48        -> 48 >= 48, submit succeeds
      Same inputs with verified_experience_months = 23 -> credited = 47 -> ERR_EXPERIENCE_INSUFFICIENT.

  - name: license_compliance_posture
    algorithm_type: constraint_propagation
    trigger: "recomputed and restamped onto License.compliance_posture on every write that can change its inputs: coverage verification / rejection / cancellation / lapse, qualifier designation and withdrawal, citation finalization / hearing decision / compliance payment, recovery-fund payment and repayment, license issuance, renewal, reinstatement, revocation, and POST /licensing/compliance-sweeps"
    inputs:
      - "CoverageRecord rows on this license (coverage_type, status, effective_date, expiration_date)"
      - "License.outstanding_recovery_repayment_cents, License.qualifying_individual_id, License.status"
      - "Citation rows on this license (status, civil_penalty_cents, penalty_paid_cents)"
      - "the most recent DECIDED DisciplinaryHearing on a Citation of this license (sanction_tier)"
      - "the logical clock date"
    formula: |
      has_bond = EXISTS CoverageRecord WHERE license_id = license.id
                   AND coverage_type = BOND AND status = VERIFIED
                   AND effective_date <= clock_date < expiration_date        -- half-open
      has_gl   = EXISTS CoverageRecord WHERE license_id = license.id
                   AND coverage_type = GENERAL_LIABILITY AND status = VERIFIED
                   AND effective_date <= clock_date < expiration_date
      unpaid   = SUM(civil_penalty_cents - penalty_paid_cents) over Citations
                   WHERE license_id = license.id AND status IN {FINAL, AFFIRMED, MODIFIED}
      probation = (latest DECIDED hearing on this license has sanction_tier = PROBATION
                   AND license.status = ACTIVE)

      IF NOT has_bond
         OR license.outstanding_recovery_repayment_cents > 0
         OR license.qualifying_individual_id IS NULL
         OR license.status = REVOKED                     -> NON_COMPLIANT
      ELSE IF unpaid > 0 OR NOT has_gl OR probation       -> CONDITIONAL
      ELSE                                                -> COMPLIANT
    constants: {}
    rounding: "n/a"
    worked_example: |
      Freshly minted license, no coverage yet, qualifier assigned by the approval cascade
        -> has_bond = false -> NON_COMPLIANT
      BOND verified, no GENERAL_LIABILITY -> CONDITIONAL
      BOND + GENERAL_LIABILITY verified, no unpaid penalty, no probation -> COMPLIANT
      ...then the sole QualifierAssignment is withdrawn -> qualifying_individual_id IS NULL -> NON_COMPLIANT
      (the licensure dimension License.status is untouched by all of the above)

  - name: bond_continuity_gap_days
    algorithm_type: interval_merge
    trigger: "POST /licensing/licenses/{id}/renew (gate) and POST /licensing/compliance-sweeps (reported)"
    inputs:
      - "CoverageRecord rows WHERE license_id = license.id AND coverage_type = BOND AND status IN {VERIFIED, LAPSED, CANCELLED}"
      - "License.issued_on, License.last_renewed_on, the logical clock date"
    formula: |
      window_start = COALESCE(license.last_renewed_on, license.issued_on)     -- inclusive
      window_end   = clock_date                                              -- inclusive
      intervals    = [ [r.effective_date, r.expiration_date) for r in qualifying BOND records ]
                     -- half-open: a record with expiration_date = D does NOT cover D
                     -- CANCELLED records use their rewritten expiration_date (= cancellation_date)
      merged       = merge_overlapping_and_adjacent(intervals)
                     -- [a, b) and [b, c) are adjacent and merge into [a, c) with no gap
      gap_days     = COUNT of dates D in [window_start, window_end] such that
                     no merged interval [s, e) satisfies s <= D < e
    constants: {}
    rounding: "exact day counting; no partial days"
    worked_example: |
      window = [2025-08-01, 2026-08-01], clock = 2026-08-01
        BOND #1 VERIFIED  [2024-08-01, 2025-08-01)   -- ends the day the window opens
        BOND #2 LAPSED    [2025-08-01, 2026-02-01)   -- adjacent to #1, merges
        BOND #3 VERIFIED  [2026-02-01, 2027-02-01)   -- adjacent to #2, merges
        merged = [2024-08-01, 2027-02-01)  -> gap_days = 0            renewal allowed
      Move BOND #3 to [2026-02-02, 2027-02-01):
        merged = [2024-08-01, 2026-02-01) and [2026-02-02, 2027-02-01)
        -> 2026-02-01 is uncovered -> gap_days = 1 -> ERR_COVERAGE_CONTINUITY_GAP
      Note the LAPSED record still counts: coverage that existed and then lapsed was real
      coverage. Only PENDING_VERIFICATION and REJECTED records are excluded.

  - name: renewal_fee
    algorithm_type: tiered_pricing
    trigger: "POST /licensing/licenses/{id}/renew (returned as renewal_fee_cents)"
    inputs:
      - "TradeClassification.renewal_base_fee_cents and required_ce_hours"
      - "License.ce_hours_completed, License.expires_on, the logical clock date"
    formula: |
      -- STAGE ORDER IS NORMATIVE. The three stages compose in exactly this order and the
      -- assessment tier is chosen from the stage-2 subtotal, never from the final total.
      shortfall_hours = max(0, classification.required_ce_hours - license.ce_hours_completed)
      stage1 = classification.renewal_base_fee_cents
               + CE_SHORTFALL_FEE_CENTS_PER_HOUR * shortfall_hours
      is_delinquent = (clock_date > license.expires_on)
      stage2 = stage1 + (is_delinquent
                         ? round_half_up(DELINQUENCY_SURCHARGE_RATE * stage1)
                         : 0)
      assessment_rate = (stage2 >= FUND_ASSESSMENT_TIER_THRESHOLD_CENTS
                         ? FUND_ASSESSMENT_RATE_HIGH
                         : FUND_ASSESSMENT_RATE_LOW)
      renewal_fee_cents = stage2 + round_half_up(assessment_rate * stage2)
    constants:
      CE_SHORTFALL_FEE_CENTS_PER_HOUR: 5000
      CE_SHORTFALL_GRACE_HOURS: 4
      DELINQUENCY_SURCHARGE_RATE: 0.50
      FUND_ASSESSMENT_TIER_THRESHOLD_CENTS: 100000
      FUND_ASSESSMENT_RATE_LOW: 0.10
      FUND_ASSESSMENT_RATE_HIGH: 0.15
    rounding: "round_half_up to whole cents, applied independently at each stage; never round once at the end"
    worked_example: |
      renewal_base_fee_cents = 45000, required_ce_hours = 8, ce_hours_completed = 4,
      expires_on = 2026-06-30, clock = 2026-08-01 (delinquent, 32 days into the 90-day grace)
        shortfall_hours   = 4
        stage1            = 45000 + 5000*4        = 65000
        stage2            = 65000 + round(32500)  = 97500
        assessment_rate   = 97500 < 100000        -> 0.10        <-- read off stage2
        renewal_fee_cents = 97500 + round(9750)   = 107250
      The trap: choosing the rate from the finished total (97500 + 14625 = 112125 >= 100000)
      yields 112125, and re-tiering after the assessment is applied is wrong.
      Timely renewal of the same license (clock = 2026-06-30):
        stage2 = stage1 = 65000 -> rate 0.10 -> 65000 + 6500 = 71500

  - name: citation_civil_penalty
    algorithm_type: weighted_scoring
    trigger: "POST /licensing/citations (stamped as INITIAL_ASSESSMENT) and POST /licensing/disciplinary-hearings/{id}/decide with decision = AFFIRM (restamped as POST_HEARING_RECALCULATION)"
    variants:
      - name: INITIAL_ASSESSMENT
        when: "at issuance"
        differs_by: "prior_final_citation_count is evaluated as of issuance and the mitigation credit can never apply, because no order of correction can have been verified before the citation that orders it exists"
      - name: POST_HEARING_RECALCULATION
        when: "when a hearing AFFIRMS the citation"
        differs_by: "prior_final_citation_count is re-evaluated as of the decision (citations that became FINAL while the appeal was pending now count) and the mitigation credit applies when the decide request supplies correction_verified_on and that date is <= the citation's correction_due_date"
    inputs:
      - "Citation.severity (copied from investigation.finding_severity)"
      - "Citation.subject_type (LICENSED / UNLICENSED)"
      - "TradeClassification.hazard_tier of citation.classification_id"
      - "Citation.prior_final_citation_count (recomputed at the moment the variant runs)"
      - "the decide request's correction_verified_on and the Citation.correction_due_date (POST_HEARING_RECALCULATION only)"
    formula: |
      base              = SEVERITY_BASE_CENTS[citation.severity]
      subject_mult      = SUBJECT_MULTIPLIER[citation.subject_type]
      hazard_mult       = 1.0 + HAZARD_STEP * (classification.hazard_tier - 1)
      prior_mult        = 1.0 + PRIOR_STEP * min(citation.prior_final_citation_count, PRIOR_COUNT_CAP)
      mitigation_mult   = (variant = POST_HEARING_RECALCULATION
                           AND request.correction_verified_on IS NOT NULL
                           AND request.correction_verified_on <= citation.correction_due_date)
                          ? (1.0 - MITIGATION_CREDIT_RATE) : 1.0
      raw               = base * subject_mult * hazard_mult * prior_mult * mitigation_mult
      civil_penalty     = min(round_half_up(raw), STATUTORY_MAX_PENALTY_CENTS)
      -- multiply every factor first, round ONCE, then clamp
    constants:
      SEVERITY_BASE_CENTS: { MINOR: 50000, SERIOUS: 250000, EGREGIOUS: 750000 }
      SUBJECT_MULTIPLIER: { LICENSED: 1.0, UNLICENSED: 2.0 }
      HAZARD_STEP: 0.25
      PRIOR_STEP: 0.20
      PRIOR_COUNT_CAP: 3
      MITIGATION_CREDIT_RATE: 0.25
      STATUTORY_MAX_PENALTY_CENTS: 1500000
    rounding: "round_half_up ONCE on the fully multiplied product, then clamp to STATUTORY_MAX_PENALTY_CENTS"
    worked_example: |
      (1) INITIAL_ASSESSMENT, severity SERIOUS, LICENSED, hazard_tier 3, no priors
          250000 * 1.0 * 1.50 * 1.00 = 375000                      -> 375000
      (2) POST_HEARING_RECALCULATION of the same citation after two of the licensee's other
          citations went FINAL during the appeal, no correction filed
          250000 * 1.0 * 1.50 * 1.40 = 525000                      -> 525000
      (3) Same as (2) but the officer verified the order of correction as performed on time
          250000 * 1.0 * 1.50 * 1.40 * 0.75 = 393750               -> 393750
      (3b) SERIOUS, LICENSED, hazard_tier 3, no priors, correction verified on time
          250000 * 1.0 * 1.50 * 1.00 * 0.75 = 281250               -> 281250
      (4) INITIAL_ASSESSMENT, severity EGREGIOUS, UNLICENSED, hazard_tier 3, no priors
          750000 * 2.0 * 1.50 * 1.00 = 2250000 -> clamped          -> 1500000
      (5) MINOR, LICENSED, hazard_tier 2, one prior
          50000 * 1.0 * 1.25 * 1.20 = 75000                        -> 75000

  - name: sanction_points
    algorithm_type: weighted_scoring
    trigger: "POST /licensing/disciplinary-hearings/{id}/decide with decision IN {AFFIRM, MODIFY} (stamped onto DisciplinaryHearing.sanction_points and sanction_tier)"
    inputs:
      - "Citation.severity, Citation.subject_type, Citation.prior_final_citation_count (as of the decision)"
      - "License.compliance_posture and License.outstanding_recovery_repayment_cents of citation.license_id (read BEFORE the sanction is applied)"
    formula: |
      points = SEVERITY_POINTS[citation.severity]
             + PRIOR_POINTS_PER_CITATION * min(citation.prior_final_citation_count, PRIOR_COUNT_CAP)
             + POSTURE_POINTS[license.compliance_posture]      -- 0 when the subject is unlicensed
             + (citation.subject_type = UNLICENSED ? UNLICENSED_POINTS : 0)
             + (license IS NOT NULL AND license.outstanding_recovery_repayment_cents > 0
                ? RECOVERY_DEBT_POINTS : 0)
      -- NORMATIVE: license.compliance_posture is read as it stood immediately BEFORE this
      -- decision's cascades (the pre-decision posture), so the penalty this same decision
      -- affirms never feeds back into its own sanction tier.
      sanction_tier = LETTER_OF_REPRIMAND if points <= 2
                      PROBATION           if 3 <= points <= 5
                      SUSPENSION_30       if 6 <= points <= 8
                      SUSPENSION_90       if 9 <= points <= 11
                      REVOCATION          if points >= 12
    constants:
      SEVERITY_POINTS: { MINOR: 1, SERIOUS: 3, EGREGIOUS: 6 }
      PRIOR_POINTS_PER_CITATION: 2
      PRIOR_COUNT_CAP: 3
      POSTURE_POINTS: { COMPLIANT: 0, CONDITIONAL: 1, NON_COMPLIANT: 2 }
      UNLICENSED_POINTS: 3
      RECOVERY_DEBT_POINTS: 2
    rounding: "integer arithmetic only"
    worked_example: |
      (a) EGREGIOUS, 1 prior FINAL citation, posture CONDITIONAL, licensed, no recovery debt
          6 + 2*1 + 1 + 0 + 0 = 9  -> SUSPENSION_90 (license SUSPENDED for 90 days)
      (b) EGREGIOUS, 1 prior citation that is SATISFIED, posture COMPLIANT, licensed, no debt
          6 + 2*1 + 0 + 0 + 0 = 8  -> SUSPENSION_30 (license SUSPENDED for 30 days)
      (c) SERIOUS, no priors, posture COMPLIANT, licensed  -> 3 -> PROBATION (status untouched,
          posture forced to CONDITIONAL)
      (d) EGREGIOUS, 3 priors, posture NON_COMPLIANT, licensed, recovery debt outstanding
          6 + 6 + 2 + 0 + 2 = 16 -> REVOCATION
      (a) and (b) differ by exactly one point and land on adjacent rungs.

  - name: recovery_award
    algorithm_type: waterfall_allocation
    trigger: "POST /licensing/recovery-fund-claims (preliminary_estimate) and POST /licensing/recovery-fund-claims/{id}/adjudicate with outcome = APPROVE (final_award)"
    variants:
      - name: preliminary_estimate
        when: "at filing, stamped onto RecoveryFundClaim.estimated_award_cents and never revised"
        differs_by: "clamps only by the per-claim cap; it ignores the mediation settlement already in the consumer's hands, ignores the judgment amount, and ignores the license's remaining aggregate room"
      - name: final_award
        when: "at adjudication, stamped onto RecoveryFundClaim.awarded_amount_cents"
        differs_by: "subtracts the complaint's settlement_amount_cents, additionally clamps a COURT_JUDGMENT claim by judgment_amount_cents, and clamps by the license's remaining per-license aggregate room"
    inputs:
      - "RecoveryFundClaim.claimed_amount_cents, basis, judgment_amount_cents"
      - "Complaint.settlement_amount_cents of claim.complaint_id"
      - "RecoveryFundAccount.per_claim_cap_cents and per_license_aggregate_cap_cents"
      - "License.recovery_encumbered_cents of claim.license_id"
    formula: |
      -- preliminary_estimate
      estimated_award_cents = min(claim.claimed_amount_cents, account.per_claim_cap_cents)

      -- final_award
      gross      = (claim.basis = COURT_JUDGMENT)
                   ? min(claim.claimed_amount_cents, claim.judgment_amount_cents)
                   : claim.claimed_amount_cents
      net        = max(0, gross - complaint.settlement_amount_cents)
      per_claim  = min(net, account.per_claim_cap_cents)
      aggregate_room = max(0, account.per_license_aggregate_cap_cents
                              - license.recovery_encumbered_cents)
      final_award = min(per_claim, aggregate_room)
      -- final_award is NOT limited by account.balance_cents: approving a claim encumbers the
      -- license's aggregate room but moves no cash, so the pool can be oversubscribed.
      -- final_award = 0 -> the adjudication lands in DENIED with denial_reason
      --                    'AGGREGATE_CAP_EXHAUSTED'
    constants: {}
    rounding: "integer cents throughout"
    worked_example: |
      per_claim_cap_cents = 1500000, per_license_aggregate_cap_cents = 2000000,
      claimed_amount_cents = 1200000, basis = FINAL_CITATION,
      complaint settled in mediation for 300000, license.recovery_encumbered_cents = 0
        estimated_award_cents = min(1200000, 1500000)            = 1200000
        final_award           = min(1200000 - 300000, 1500000, 2000000) = 900000
      Divergence between the two variants is exactly the 300000 settlement.
      A second claim on the same license claiming 1500000 with no settlement:
        aggregate_room = 2000000 - 900000 = 1100000
        final_award    = min(1500000, 1500000, 1100000)          = 1100000

  - name: recovery_prorata_distribution
    algorithm_type: aggregation
    trigger: "POST /licensing/recovery-fund-claims/{id}/pay"
    inputs:
      - "every RecoveryFundClaim WHERE license_id = target_claim.license_id AND status = APPROVED, ordered by created_at ASC"
      - "RecoveryFundAccount.balance_cents"
    formula: |
      cohort        = APPROVED claims on the target claim's license, ordered by created_at ASC
      total_awarded = SUM(c.awarded_amount_cents for c in cohort)
      IF account.balance_cents >= total_awarded:
          c.paid_amount_cents = c.awarded_amount_cents for every c in cohort
      ELSE:
          c.paid_amount_cents = floor(c.awarded_amount_cents * account.balance_cents
                                      / total_awarded)          -- integer arithmetic
          residual = account.balance_cents - SUM(paid_amount_cents)
          distribute residual one cent at a time to cohort members in created_at ASC order
          until residual = 0
      every cohort member moves APPROVED -> PAID with paid_on = clock_date, including claims
      that were not the request target
    constants: {}
    rounding: "floor per claim, then deterministic one-cent residual distribution in created_at ASC order (never by id, never by claim size)"
    worked_example: |
      balance_cents = 900000; cohort A awarded 700000 (created first), B awarded 400000
        total_awarded = 1100000 > 900000, so pro-rata applies
        A: floor(700000 * 900000 / 1100000) = floor(572727.27) = 572727
        B: floor(400000 * 900000 / 1100000) = floor(327272.72) = 327272
        residual = 900000 - 899999 = 1 -> to A (earlier created_at)
        A.paid_amount_cents = 572728, B.paid_amount_cents = 327272
      Afterwards: account.balance_cents = initial 900000 - 900000 = 0, and the license's
      outstanding_recovery_repayment_cents = 900000, which suspends it.

# =============================================================================
# §1.4 Validation Rules — evaluated in ascending `priority` order.
# The FIRST rule whose condition is violated determines the response. Bands:
#   1-9   request plumbing (auth, role, schema, existence, ownership, paging)
#   10-19 optimistic concurrency
#   20-29 state
#   40-49 business_safety
#   50-59 business_referential
#   60-69 business_temporal
#   70-79 business_constraint
#   80-89 business_fiscal
# =============================================================================
validations:

  # ---------------------------------------------------- request plumbing ------
  - priority: 1
    category: auth
    rule: "X-User-ID and X-User-Role headers must both be present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    applies_to: "every endpoint except POST /_clock/set_current_utc"

  - priority: 2
    category: role
    rule: "X-User-Role must appear in the endpoint's allowed_roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    applies_to: "every endpoint except POST /_clock/set_current_utc"

  - priority: 3
    category: schema
    rule: "required body fields present; types match; enum values in range; integer money fields are JSON integers (not strings) and >= 0; ISO dates parse as YYYY-MM-DD and ISO datetimes as RFC3339 UTC; scheduled_end_utc > scheduled_start_utc; effective_to (when supplied) >= effective_from; expiration_date > effective_date; score in 0..100; hazard_tier in {1,2,3}; ownership_pct in 0..100"
    error_id: ERR_INVALID_REQUEST
    applies_to: "all write endpoints"

  - priority: 4
    category: existence
    rule: "the entity named by the {id} path parameter must exist"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    applies_to: "every path-parameterised endpoint"

  - priority: 5
    category: existence
    rule: "every FK supplied in the request body must resolve to an existing row (licensee_id, classification_id, qualifying_individual_id, predecessor_license_id, license_id, complaint_id, investigation_id, citation_id, consumer_id, fund_account_id)"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    applies_to: "all write endpoints carrying FKs"

  - priority: 6
    category: ownership
    rule: "a Licensee actor may only act on LicenseApplications, Licenses and Citations belonging to its own Licensee row; a Consumer actor may only act on Complaints whose consumer_id equals its own Consumer row"
    error_id: ERR_NOT_RESOURCE_OWNER
    applies_to: "POST /licensing/license-applications/{id}/submit, /cure, /withdraw; POST /licensing/licenses/{id}/renew, /ce-credits, /recovery-repayments; POST /licensing/citations/{id}/appeal, /comply; POST /licensing/complaints/{id}/withdraw"

  - priority: 7
    category: pagination
    rule: "limit must be an integer in 1..100 and offset an integer >= 0"
    error_id: ERR_INVALID_REQUEST
    applies_to: "all list endpoints"

  # ------------------------------------------------ optimistic concurrency ----
  - priority: 10
    category: concurrency
    rule: "expected_license_version must equal the current License.version"
    error_id: ERR_STALE_LICENSE_VERSION
    applies_to: "POST /licensing/qualifier-assignments, POST /licensing/licenses/{id}/recovery-repayments"

  - priority: 11
    category: concurrency
    rule: "expected_fund_account_version must equal the current RecoveryFundAccount.version"
    error_id: ERR_STALE_FUND_ACCOUNT_VERSION
    applies_to: "POST /licensing/recovery-fund-claims/{id}/pay"

  # ------------------------------------------------------------ state ---------
  - priority: 20
    category: state
    rule: "LicenseApplication.status must be in the transition's `from` set for the requested action (submit: DRAFT; cure: DEFICIENT; decision: SUBMITTED; withdraw: DRAFT|SUBMITTED|DEFICIENT)"
    error_id: ERR_APPLICATION_STATE_INVALID
    applies_to: "POST /licensing/license-applications/{id}/submit, /cure, /decision, /withdraw"

  - priority: 20
    category: state
    rule: "License.status must be in the transition's `from` set (renew: ACTIVE|EXPIRED; reinstate: SUSPENDED; ce-credits: ACTIVE|SUSPENDED|EXPIRED; recovery-repayments: SUSPENDED|ACTIVE with outstanding_recovery_repayment_cents > 0); a REVOKED license accepts no action at all"
    error_id: ERR_LICENSE_STATE_INVALID
    applies_to: "POST /licensing/licenses/{id}/renew, /reinstate, /ce-credits, /recovery-repayments; POST /licensing/coverage-records; POST /licensing/qualifier-assignments"

  - priority: 20
    category: state
    rule: "CoverageRecord.status must be PENDING_VERIFICATION for verification and VERIFIED for cancellation"
    error_id: ERR_COVERAGE_STATE_INVALID
    applies_to: "POST /licensing/coverage-records/{id}/verification, /cancel"

  - priority: 20
    category: state
    rule: "QualifierAssignment.status must be ACTIVE to be withdrawn"
    error_id: ERR_ASSIGNMENT_STATE_INVALID
    applies_to: "POST /licensing/qualifier-assignments/{id}/withdraw"

  - priority: 20
    category: state
    rule: "Complaint.status must be in the transition's `from` set (screen: RECEIVED; mediation-outcome: MEDIATION; remand-to-mediation: INVESTIGATION; withdraw: RECEIVED|MEDIATION|INVESTIGATION); a complaint that is the parent of a new Investigation must be in INVESTIGATION"
    error_id: ERR_COMPLAINT_STATE_INVALID
    applies_to: "POST /licensing/complaints/{id}/screen, /mediation-outcome, /remand-to-mediation, /withdraw; POST /licensing/investigations"

  - priority: 20
    category: state
    rule: "Investigation.status must be OPEN to be closed"
    error_id: ERR_INVESTIGATION_STATE_INVALID
    applies_to: "POST /licensing/investigations/{id}/close"

  - priority: 20
    category: state
    rule: "Citation.status must be in the transition's `from` set (appeal: ISSUED; finalize: ISSUED; comply: FINAL|AFFIRMED|MODIFIED; hearing creation: APPEAL_REQUESTED)"
    error_id: ERR_CITATION_STATE_INVALID
    applies_to: "POST /licensing/citations/{id}/appeal, /finalize, /comply; POST /licensing/disciplinary-hearings"

  - priority: 20
    category: state
    rule: "DisciplinaryHearing.status must be SCHEDULED to be decided"
    error_id: ERR_HEARING_STATE_INVALID
    applies_to: "POST /licensing/disciplinary-hearings/{id}/decide"

  - priority: 20
    category: state
    rule: "RecoveryFundClaim.status must be FILED to be adjudicated and APPROVED to be paid"
    error_id: ERR_CLAIM_STATE_INVALID
    applies_to: "POST /licensing/recovery-fund-claims/{id}/adjudicate, /pay"

  - priority: 22
    category: state
    rule: "a Citation may only be issued on an Investigation whose status is SUBSTANTIATED (finding_severity non-null)"
    error_id: ERR_INVESTIGATION_NOT_SUBSTANTIATED
    applies_to: "POST /licensing/citations"

  - priority: 23
    category: state
    rule: "a claim with basis = FINAL_CITATION may only be APPROVED when its Complaint.status == CLOSED_SANCTIONED; a claim with basis = COURT_JUDGMENT may only be APPROVED when its Complaint.status is in {MEDIATION, INVESTIGATION, CITATION_ISSUED, CLOSED_SANCTIONED}"
    error_id: ERR_CLAIM_BASIS_NOT_ESTABLISHED
    applies_to: "POST /licensing/recovery-fund-claims/{id}/adjudicate"

  - priority: 24
    category: state
    rule: "Complaint.mediation_round_count must be < MAX_MEDIATION_ROUNDS (2) to remand to mediation, and no Citation may yet exist on any Investigation of the complaint"
    error_id: ERR_MEDIATION_ROUNDS_EXHAUSTED
    applies_to: "POST /licensing/complaints/{id}/remand-to-mediation"

  # -------------------------------------------------------- business_safety ---
  - priority: 40
    category: business_safety
    rule: "presiding_officer_user_id must differ from the assigned_investigator_user_id of the citation's Investigation"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    applies_to: "POST /licensing/disciplinary-hearings"

  - priority: 41
    category: business_safety
    rule: "calculations.bond_continuity_gap_days must be 0 over the expiring term"
    error_id: ERR_COVERAGE_CONTINUITY_GAP
    applies_to: "POST /licensing/licenses/{id}/renew"

  - priority: 42
    category: business_safety
    rule: "a VERIFIED BOND CoverageRecord covering the clock date (effective_date <= clock < expiration_date) must exist"
    error_id: ERR_BOND_COVERAGE_MISSING
    applies_to: "POST /licensing/licenses/{id}/reinstate"

  - priority: 43
    category: business_safety
    rule: "License.compliance_posture must not be NON_COMPLIANT"
    error_id: ERR_LICENSE_NOT_COMPLIANT
    applies_to: "POST /licensing/licenses/{id}/renew"

  - priority: 44
    category: business_safety
    rule: "X-User-ID must equal DisciplinaryHearing.presiding_officer_user_id"
    error_id: ERR_NOT_PRESIDING_OFFICER
    applies_to: "POST /licensing/disciplinary-hearings/{id}/decide"

  - priority: 45
    category: business_safety
    rule: "X-User-ID must equal Investigation.assigned_investigator_user_id"
    error_id: ERR_NOT_ASSIGNED_INVESTIGATOR
    applies_to: "POST /licensing/investigations/{id}/close, POST /licensing/citations"

  - priority: 46
    category: business_safety
    rule: "reinstatement requires every FINAL/AFFIRMED/MODIFIED Citation on the license to be fully paid and License.outstanding_recovery_repayment_cents == 0"
    error_id: ERR_OUTSTANDING_OBLIGATIONS
    applies_to: "POST /licensing/licenses/{id}/reinstate"

  # --------------------------------------------------- business_referential ---
  - priority: 50
    category: business_referential
    rule: "when the citation's Investigation names a licensed subject, classification_id must equal that License.classification_id"
    error_id: ERR_CLASSIFICATION_MISMATCH
    applies_to: "POST /licensing/citations"

  - priority: 51
    category: business_referential
    rule: "the qualifying individual must hold a passed, unexpired LAW_AND_BUSINESS ExamResult and a passed, unexpired TRADE ExamResult whose trade_code equals the application's classification code"
    error_id: ERR_EXAM_REQUIREMENT_UNMET
    applies_to: "POST /licensing/license-applications/{id}/submit, /cure; POST /licensing/license-applications/{id}/decision with outcome = APPROVED"

  - priority: 52
    category: business_referential
    rule: "the qualifying individual's designations occupying the effective date must number fewer than MAX_CONCURRENT_QUALIFICATIONS (2) — counting QualifierAssignments with status = ACTIVE whose [effective_from, effective_to] window (effective_to INCLUSIVE, null = open-ended) contains the new designation's effective_from"
    error_id: ERR_QUALIFIER_CAPACITY_EXCEEDED
    applies_to: "POST /licensing/qualifier-assignments; POST /licensing/license-applications/{id}/decision with outcome = APPROVED"

  - priority: 53
    category: business_referential
    rule: "relationship_type = RESPONSIBLE_MANAGING_OFFICER requires ownership_pct >= RMO_MIN_OWNERSHIP_PCT (10)"
    error_id: ERR_OWNERSHIP_PCT_INSUFFICIENT
    applies_to: "POST /licensing/qualifier-assignments"

  - priority: 54
    category: business_referential
    rule: "a recovery-fund claim may only be filed on a Complaint whose license_id is non-null — the fund does not reach unlicensed operators"
    error_id: ERR_UNLICENSED_SUBJECT_NOT_CLAIMABLE
    applies_to: "POST /licensing/recovery-fund-claims"

  - priority: 55
    category: business_referential
    rule: "complaint_id must be non-null when origin = COMPLAINT and must be omitted when origin = STING; subject_business_name is required when subject_license_id is omitted"
    error_id: ERR_INVESTIGATION_ORIGIN_MISMATCH
    applies_to: "POST /licensing/investigations"

  - priority: 56
    category: business_referential
    rule: "at most one RecoveryFundClaim per Complaint may exist in a status other than DENIED"
    error_id: ERR_DUPLICATE_CLAIM
    applies_to: "POST /licensing/recovery-fund-claims"

  - priority: 57
    category: business_referential
    rule: "application_type = REINSTATEMENT requires predecessor_license_id to be supplied, to belong to the same licensee_id, to carry the same classification_id, and to be in status REVOKED or EXPIRED; every other application_type requires predecessor_license_id to be omitted"
    error_id: ERR_PREDECESSOR_LICENSE_INVALID
    applies_to: "POST /licensing/license-applications, POST /licensing/license-applications/{id}/submit"

  - priority: 58
    category: business_referential
    rule: "judgment_amount_cents, judgment_docket_number and judgment_entered_on are required when basis = COURT_JUDGMENT and must be omitted when basis = FINAL_CITATION"
    error_id: ERR_JUDGMENT_FIELDS_MISMATCH
    applies_to: "POST /licensing/recovery-fund-claims"

  # ------------------------------------------------------ business_temporal ---
  - priority: 60
    category: business_temporal
    rule: "the clock date must be <= Citation.appeal_deadline"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    applies_to: "POST /licensing/citations/{id}/appeal"

  - priority: 61
    category: business_temporal
    rule: "the clock date must be > Citation.appeal_deadline — a citation cannot be defaulted to FINAL while the appeal window is still open"
    error_id: ERR_APPEAL_WINDOW_OPEN
    applies_to: "POST /licensing/citations/{id}/finalize"

  - priority: 62
    category: business_temporal
    rule: "effective_from must be >= License.issued_on and (when supplied) effective_to must be <= License.expires_on"
    error_id: ERR_ASSIGNMENT_EFFECTIVE_DATE_INVALID
    applies_to: "POST /licensing/qualifier-assignments"

  - priority: 63
    category: business_temporal
    rule: "no other CoverageRecord on the same license with the same coverage_type and status = VERIFIED may overlap [effective_date, expiration_date) — the interval is HALF-OPEN, so a record starting exactly on another's expiration_date does not overlap"
    error_id: ERR_COVERAGE_PERIOD_OVERLAP
    applies_to: "POST /licensing/coverage-records/{id}/verification"

  - priority: 64
    category: business_temporal
    rule: "no other SCHEDULED DisciplinaryHearing for the same presiding_officer_user_id may overlap [scheduled_start_utc, scheduled_end_utc) — HALF-OPEN, so a hearing starting exactly when another ends is allowed"
    error_id: ERR_HEARING_SLOT_CONFLICT
    applies_to: "POST /licensing/disciplinary-hearings"

  - priority: 65
    category: business_temporal
    rule: "the clock date must be <= COALESCE(work_completed_on, contract_date) + STATUTE_OF_LIMITATIONS_MONTHS (48)"
    error_id: ERR_STATUTE_OF_LIMITATIONS_EXPIRED
    applies_to: "POST /licensing/complaints/{id}/screen with jurisdiction_finding = ACCEPTED"

  - priority: 66
    category: business_temporal
    rule: "when the complaint names a license, contract_date must be >= that License.issued_on — conduct predating licensure is outside the board's jurisdiction over the licensee"
    error_id: ERR_CONTRACT_PREDATES_LICENSE
    applies_to: "POST /licensing/complaints/{id}/screen with jurisdiction_finding = ACCEPTED"

  - priority: 67
    category: business_temporal
    rule: "the clock date must be >= judgment_entered_on + JUDGMENT_RIPENING_DAYS (90) — the judgment must have gone 90 days unsatisfied before the fund is reachable; day 90 itself is ripe, day 89 is not"
    error_id: ERR_JUDGMENT_NOT_RIPE
    applies_to: "POST /licensing/recovery-fund-claims/{id}/adjudicate with outcome = APPROVE and basis = COURT_JUDGMENT"

  - priority: 68
    category: business_temporal
    rule: "renewal must occur no later than expires_on + DELINQUENT_GRACE_DAYS (90); the 90th day still renews, the 91st does not"
    error_id: ERR_RENEWAL_WINDOW_CLOSED
    applies_to: "POST /licensing/licenses/{id}/renew"

  - priority: 69
    category: business_temporal
    rule: "when License.suspension_until is non-null the clock date must be >= suspension_until"
    error_id: ERR_SUSPENSION_PERIOD_ACTIVE
    applies_to: "POST /licensing/licenses/{id}/reinstate"

  - priority: 69
    category: business_temporal
    rule: "the clock timestamp must be >= DisciplinaryHearing.scheduled_start_utc"
    error_id: ERR_HEARING_NOT_CONVENED
    applies_to: "POST /licensing/disciplinary-hearings/{id}/decide"

  # ---------------------------------------------------- business_constraint ---
  - priority: 70
    category: business_constraint
    rule: "on renewal, License.ce_hours_completed must be >= classification.required_ce_hours - CE_SHORTFALL_GRACE_HOURS (4) — a shortfall inside the grace band is billable, a larger one is fatal; on reinstatement the full classification.required_ce_hours is demanded with no grace band"
    error_id: ERR_CE_HOURS_INSUFFICIENT
    applies_to: "POST /licensing/licenses/{id}/renew, POST /licensing/licenses/{id}/reinstate"

  - priority: 71
    category: business_constraint
    rule: "calculations.credited_experience_months must be >= classification.min_experience_months"
    error_id: ERR_EXPERIENCE_INSUFFICIENT
    applies_to: "POST /licensing/license-applications/{id}/submit, /cure"

  - priority: 72
    category: business_constraint
    rule: "declared_net_worth_cents must be >= classification.min_net_worth_cents"
    error_id: ERR_NET_WORTH_INSUFFICIENT
    applies_to: "POST /licensing/license-applications/{id}/submit, /cure"

  - priority: 73
    category: business_constraint
    rule: "when coverage_type = BOND, amount_cents must be >= classification.required_bond_amount_cents of the license's classification"
    error_id: ERR_BOND_AMOUNT_INSUFFICIENT
    applies_to: "POST /licensing/coverage-records/{id}/verification with outcome = VERIFY"

  - priority: 74
    category: business_constraint
    rule: "alleged_loss_cents must be >= MIN_JURISDICTIONAL_LOSS_CENTS (50000) for jurisdiction to be accepted"
    error_id: ERR_LOSS_BELOW_JURISDICTIONAL_MINIMUM
    applies_to: "POST /licensing/complaints/{id}/screen with jurisdiction_finding = ACCEPTED"

  - priority: 75
    category: business_constraint
    rule: "modified_penalty_cents must be supplied for decision = MODIFY, must be omitted otherwise, and must be <= STATUTORY_MAX_PENALTY_CENTS (1500000)"
    error_id: ERR_PENALTY_EXCEEDS_STATUTORY_MAX
    applies_to: "POST /licensing/disciplinary-hearings/{id}/decide"

  - priority: 76
    category: business_constraint
    rule: "a Licensee may not hold two LicenseApplications for the same classification_id in a non-terminal status (DRAFT, SUBMITTED, DEFICIENT)"
    error_id: ERR_DUPLICATE_APPLICATION
    applies_to: "POST /licensing/license-applications"

  - priority: 77
    category: business_constraint
    rule: "ce_hours must be > 0 and the cumulative ce_hours_completed after the credit must not exceed CE_HOURS_TERM_CEILING (40)"
    error_id: ERR_CE_HOURS_CEILING_EXCEEDED
    applies_to: "POST /licensing/licenses/{id}/ce-credits"

  # -------------------------------------------------------- business_fiscal ---
  - priority: 80
    category: business_fiscal
    rule: "RecoveryFundAccount.balance_cents must be >= 1 to disburse"
    error_id: ERR_FUND_BALANCE_EXHAUSTED
    applies_to: "POST /licensing/recovery-fund-claims/{id}/pay"

  - priority: 81
    category: business_fiscal
    rule: "penalty_payment_cents must exactly equal civil_penalty_cents - penalty_paid_cents; partial payment and overpayment are both refused"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    applies_to: "POST /licensing/citations/{id}/comply"

  - priority: 82
    category: business_fiscal
    rule: "repayment_amount_cents must be >= 1 and <= License.outstanding_recovery_repayment_cents"
    error_id: ERR_REPAYMENT_EXCEEDS_OUTSTANDING
    applies_to: "POST /licensing/licenses/{id}/recovery-repayments"

  - priority: 83
    category: business_fiscal
    rule: "claimed_amount_cents must be >= 1 and <= Complaint.alleged_loss_cents — the fund cannot be asked for more than the loss the consumer pleaded"
    error_id: ERR_CLAIM_EXCEEDS_ALLEGED_LOSS
    applies_to: "POST /licensing/recovery-fund-claims"

# =============================================================================
# §1.5 API Endpoint Table
# Every business path lives under the /licensing prefix. Path parameters use the
# {id} template form throughout. Money is integer cents everywhere.
# =============================================================================
endpoints:

  # ----------------------------------------------- logical clock (test-driving)
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock to an arbitrary instant so deadline, expiry, ripening and window rules are deterministic. MANDATORY DEFAULT: before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. Every timestamp the API stamps (created_at, issued_on, submitted_at, decided_at, paid_on, sweep dates) is read from this clock."
    roles: [BoardAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["no entity is mutated; subsequent reads of the clock return current_utc"]

  # --------------------------------------------------------------- reference ---
  - method: POST
    path: "/licensing/trade-classifications"
    description: "Creates a statutory trade classification with its examination, experience, financial-responsibility, bond, CE and fee parameters."
    roles: [BoardAdmin]
    code: 201
    input: [code, name, hazard_tier, min_experience_months, min_net_worth_cents, required_bond_amount_cents, required_ce_hours, renewal_base_fee_cents, "mediation_required?"]
