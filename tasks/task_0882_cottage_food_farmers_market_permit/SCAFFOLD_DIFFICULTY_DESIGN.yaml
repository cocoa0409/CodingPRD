      - name: sales_ledger_conserved_on_void
        grounds:
          - state_machines.SalesRecord.RECORDED_to_VOIDED
          - entities.Producer.fields.ytd_gross_sales_cents
        distinguishing_aspect: |
          Conserved quantity is money: Producer.ytd_gross_sales_cents == sum of RECORDED
          SalesRecord.gross_amount_cents; voiding the single 40000 sale returns ytd to 0.
        test_recipe:
          setup:
            - "REGISTERED producer, ISSUED permit, APPROVED product, manifest APPROVED, one RECORDED sale of 40000"
          setup_api_calls:
            - call: "POST /cottage-food/allowed-food-policies"
