            - "${lost_map} == { RATE_TOO_HIGH: 2200, DATES_UNAVAILABLE: 600 } - two keys only, no zero-valued entries for the other five enum members"
            - "${definite_nights} == 0 and ${cost} == null"
            - "a report over [2026-09-01, 2026-10-01) shows lost_opportunity_count 0 and an empty map - the losses are pinned to the window by updated_at"

      - name: incentive_cap_nests_the_band_ladder_the_yield_ceiling_and_coverage
        claim_type: tiered_pricing_boundary
        grounds:
          - calculations.incentive_cap
        excluded_because:
          difficulty_instance: "combinatorial_formula / incentive_cap_nests_band_ladder_yield_ceiling_and_coverage_factor"
          rationale: "That instance pins the full nested composition - marginal band ladder, tier-rate yield ceiling, coverage factor and fund residual clamp - to the single literal 13304.25."

      - name: hotel_committed_peak_is_a_nightly_maximum_not_a_running_sum
        claim_type: aggregation
        grounds:
          - calculations.hotel_nightly_block_capacity
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / hotel_nightly_capacity_admits_touching_windows_and_rejects_a_shared_night"
          rationale: "That instance asserts committed_peak_rooms == 400 (a max) against committed_room_nights == 1500 (a sum) on the same hotel, plus the touching-window admission and the shared-night rejection."

      - name: hall_conflict_buffer_is_a_strict_comparison_at_the_turnaround_edge
        claim_type: interval_merge_boundary
        grounds:
          - calculations.hall_occupation_conflict
        excluded_because:
          difficulty_instance: "boundary_precision_check / hall_turnaround_buffer_allows_exactly_48h_gap_and_rejects_47h"
          rationale: "That instance probes the buffered-window comparison at exactly 48 hours (admitted) and at 47 hours (ERR_HALL_WINDOW_CONFLICT) on two identical halls."

  - section: validations
    instances:
      - name: rate_ceiling_is_inclusive_and_an_over_ceiling_offer_is_refused
        claim_type: violation_to_error
        grounds:
          - validations[priority 27 ERR_RATE_CEILING_EXCEEDED]
          - entities.Opportunity.fields.rate_ceiling_amount
        distinguishing_aspect: "One cent over the 219.00 ceiling is 422 ERR_RATE_CEILING_EXCEEDED while exactly 219.00 is accepted, and the same rule also guards the room count: offering 601 rooms from a 600-room property fails with the identical error even at a legal rate."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; hotel Harborview Grand 600 committable; QUALIFIED opportunity with rate_ceiling_amount 219.00, peak_rooms_requested 1000; one INVITED commitment ${c_id} for 500 rooms"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /meeting-planners"
              payload: { org_name: "Continental Dental Assembly", contact_email: "meetings@cda.org" }
              as: BureauAdmin
              captures: { planner_id: $.data.id }
            - call: "POST /hotels"
              payload: { name: "Harborview Grand", committable_rooms: 600, walk_distance_blocks: 2 }
              as: BureauAdmin
              captures: { hotel_id: $.data.id }
            - call: "POST /opportunities"
              payload: { planner_id: "${planner_id}", event_name: "CDA Annual 2028", arrival_date: "2028-04-10", departure_date: "2028-04-12", peak_rooms_requested: 1000, total_room_nights_requested: 1800, attendance_estimate: 8000, exhibit_sqft_requested: 200000, rate_ceiling_amount: 219.00 }
              as: SalesManager
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/qualify"
              payload: {}
              as: SalesManager
              captures: { opp_v: $.data.version }
            - call: "POST /room-block-commitments"
              payload: { opportunity_id: "${opp_id}", hotel_id: "${hotel_id}", rooms_peak_invited: 500, expected_opportunity_version: "${opp_v}" }
              as: SalesManager
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /room-block-commitments/${c_id}/offer"
              payload: { rooms_peak_offered: 500, rate_offered_amount: 219.01, cutoff_days_before_arrival: 30 }
              as: HotelPartner
              as_user_id: ${hotel_id}
              captures: { err_rate: $.data.error_id }
            - call: "POST /room-block-commitments/${c_id}/offer"
              payload: { rooms_peak_offered: 601, rate_offered_amount: 210.00, cutoff_days_before_arrival: 30 }
              as: HotelPartner
              as_user_id: ${hotel_id}
              captures: { err_rooms: $.data.error_id }
            - call: "POST /room-block-commitments/${c_id}/offer"
              payload: { rooms_peak_offered: 500, rate_offered_amount: 219.00, cutoff_days_before_arrival: 30 }
              as: HotelPartner
              as_user_id: ${hotel_id}
              captures: { status_ok: $.data.status, rate_ok: $.data.rate_offered_amount, round_ok: $.data.offer_round, cutoff_ok: $.data.cutoff_date }
          assert:
            - "first two calls: HTTP 422 with error_id ERR_RATE_CEILING_EXCEEDED - ${err_rate} and ${err_rooms}"
            - "the commitment is still INVITED after both refusals, with offer_round 0 and rate_offered_amount null"
            - "third call: HTTP 200, ${status_ok} == OFFERED, ${rate_ok} == 219.00, ${round_ok} == 1, ${cutoff_ok} == 2028-03-11 - the ceiling comparison is <=, not <"

      - name: duplicate_invite_is_refused_until_the_live_row_is_withdrawn
        claim_type: conditional_validation
        grounds:
          - validations[priority 26 ERR_DUPLICATE_COMMITMENT]
          - state_machines[RoomBlockCommitment INVITED -> WITHDRAWN]
        distinguishing_aspect: "The uniqueness rule is scoped to live statuses only: a second invite for the same (opportunity, hotel) pair is 409 ERR_DUPLICATE_COMMITMENT while the first is INVITED, but once that row is WITHDRAWN the identical invite succeeds and produces a distinct commitment id with offer_round back at 0."
        test_recipe:
          setup:
            - "the setup of rate_ceiling_is_inclusive_and_an_over_ceiling_offer_is_refused, with ${c_id} left INVITED"
          setup_api_calls:
            - call: "GET /room-block-commitments?opportunity_id=${opp_id}"
              payload: {}
              as: SalesManager
          trigger:
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { v_dup: $.data.version }
            - call: "POST /room-block-commitments"
              payload: { opportunity_id: "${opp_id}", hotel_id: "${hotel_id}", rooms_peak_invited: 400, expected_opportunity_version: "${v_dup}" }
              as: SalesManager
              captures: { err_dup: $.data.error_id }
            - call: "POST /room-block-commitments/${c_id}/withdraw"
              payload: { withdraw_reason: "INVITE_DECLINED" }
              as: HotelPartner
              as_user_id: ${hotel_id}
              captures: { w_status: $.data.status, w_reason: $.data.withdraw_reason }
            - call: "GET /opportunities/${opp_id}"
              payload: {}
              as: SalesManager
              captures: { v_after_withdraw: $.data.version }
            - call: "POST /room-block-commitments"
              payload: { opportunity_id: "${opp_id}", hotel_id: "${hotel_id}", rooms_peak_invited: 400, expected_opportunity_version: "${v_after_withdraw}" }
              as: SalesManager
              captures: { c2_id: $.data.id, c2_status: $.data.status, c2_round: $.data.offer_round }
          assert:
            - "second invite: HTTP 409 and ${err_dup} == ERR_DUPLICATE_COMMITMENT"
            - "${w_status} == WITHDRAWN and ${w_reason} == INVITE_DECLINED"
            - "re-invite: HTTP 201 with ${c2_id} != ${c_id}, ${c2_status} == INVITED and ${c2_round} == 0"
            - "GET /room-block-commitments?opportunity_id=${opp_id} returns total_count == 2 - the withdrawn row is retained as history, not deleted"

      - name: pickup_nights_must_be_inside_the_event_range_and_unique_per_night
        claim_type: temporal_validation
        grounds:
          - validations[priority 23 ERR_PICKUP_NIGHT_OUT_OF_RANGE and ERR_DUPLICATE_PICKUP_NIGHT]
          - entities.PickupRecord
        distinguishing_aspect: "The event range is half-open, so the departure night 2028-04-12 is out of range exactly like the pre-arrival night 2028-04-09, and a second record for an already-reported night is a different error (ERR_DUPLICATE_PICKUP_NIGHT) from an out-of-range one - both 422, both leaving picked_up_room_nights untouched."
        test_recipe:
          setup:
            - "CANONICAL DEFINITE CHAIN with the clock moved to 2028-04-13T00:00:00Z, but with NO pickup rows reported yet; commitment ${c_a_id} (Harborview, 500 rooms committed) is COMMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-04-13T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /room-block-commitments/${c_a_id}/pickup-records"
              payload: { night_date: "2028-04-12", rooms_picked_up: 100, rate_charged_amount: 214.33 }
              as: HotelPartner
              as_user_id: ${hotel_a_id}
              captures: { err_departure: $.data.error_id }
            - call: "POST /room-block-commitments/${c_a_id}/pickup-records"
              payload: { night_date: "2028-04-09", rooms_picked_up: 100, rate_charged_amount: 214.33 }
              as: HotelPartner
              as_user_id: ${hotel_a_id}
              captures: { err_early: $.data.error_id }
            - call: "POST /room-block-commitments/${c_a_id}/pickup-records"
              payload: { night_date: "2028-04-10", rooms_picked_up: 400, rate_charged_amount: 214.33 }
              as: HotelPartner
              as_user_id: ${hotel_a_id}
              captures: { pr_id: $.data.id, revenue: $.data.room_night_revenue_amount }
            - call: "POST /room-block-commitments/${c_a_id}/pickup-records"
              payload: { night_date: "2028-04-10", rooms_picked_up: 50, rate_charged_amount: 214.33 }
              as: HotelPartner
              as_user_id: ${hotel_a_id}
              captures: { err_dup: $.data.error_id }
            - call: "GET /room-block-commitments/${c_a_id}"
              payload: {}
              as: SalesManager
              captures: { picked: $.data.picked_up_room_nights }
          assert:
            - "${err_departure} == ERR_PICKUP_NIGHT_OUT_OF_RANGE (HTTP 422) - 2028-04-12 is the departure date and is excluded"
            - "${err_early} == ERR_PICKUP_NIGHT_OUT_OF_RANGE (HTTP 422)"
            - "the accepted row: HTTP 201 with ${revenue} == 85732.00 (400 * 214.33)"
            - "${err_dup} == ERR_DUPLICATE_PICKUP_NIGHT (HTTP 422) - a correction is not an upsert"
            - "${picked} == 400 - neither rejected call moved the counter; Hotel.${hotel_a_id}.pickup_room_nights == 400"

      - name: submit_checks_support_letters_before_block_coverage
        claim_type: priority_ordering
        grounds:
          - validations[priority 30 ERR_SUPPORT_LETTERS_INSUFFICIENT]
          - validations[priority 31 ERR_BLOCK_COVERAGE_INSUFFICIENT]
        distinguishing_aspect: "A bid that violates both gates at once - one letter and 50.00 coverage - must return the priority-30 letters error, and only after two DISTINCT letter types are attached does the same call fall through to the priority-31 coverage error. Two letters of the same type do not satisfy the letters gate."
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; TIER_C planner; fund FY2028 budget 500000.00; hotels Harborview 600 and Bayside 400; QUALIFIED opportunity peak_rooms_requested 1000, total_room_nights_requested 1800, rate_ceiling_amount 219.00, arrival 2028-04-10, departure 2028-04-12; one FIRST-rank hold on Grand Hall A; only Harborview committed at 500 rooms with cutoff 30 (coverage 50.00)"
            - "BidPackage ${bid_id} prepared by sales-11, incentive of 100.00 requested by sales-11 and APPROVED by approver-01 against ${fund_id} (fee 5.00, total charge 105.00, payback 563.14), so the package is APPROVED with one MAYOR support letter attached"
          setup_api_calls:
            - call: "POST /bid-packages/${bid_id}/support-letters"
              payload: { organization_name: "Office of the Mayor", letter_type: "MAYOR" }
              as: SalesManager
              captures: { letter_count_1: $.data.id }
          trigger:
            - call: "POST /bid-packages/${bid_id}/submit"
              payload: { response_due_at: "2026-09-01T00:00:00Z" }
              as: SalesManager
              captures: { err_letters: $.data.error_id }
            - call: "POST /bid-packages/${bid_id}/support-letters"
              payload: { organization_name: "Mayor's Office Annex", letter_type: "MAYOR" }
              as: SalesManager
              captures: { same_type_letter_id: $.data.id }
