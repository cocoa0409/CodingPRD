# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2716_store_closing_going_out_of_business_sale
#
# Nine rule_ids from §0.5, two differentiated instances each (18 total).
# Every numeric literal in every `assert:` was computed by executing the
# corresponding §1.3 formula with its declared constants.
# Logical clock default before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: store_recovery_projected_vs_realized_diverge_on_one_store
        grounds:
          - calculations.store_projected_recovery_estimate
          - entities.Store.fields.projected_gross_recovery_cents
          - entities.Store.fields.realized_gross_recovery_cents
          - entities.Store.fields.planned_avg_discount_pct
          - entities.Engagement.fields.projected_shortfall_cents
          - endpoints[GET /engagements/{id}/recovery-summary]
        distinguishing_aspect: |
          The PROJECTED variant is a forward-looking category-sell-through estimate discounted
          by the average of the ARMED/ACTIVE markdown stages, while the REALIZED variant sums
          only POSTED sales days; on the very same stored data the projected ratio is 1.3930
          and the realized ratio is 0.2400, a gap no single-variant implementation can produce.
        test_recipe:
          setup:
            - "One NY jurisdiction requiring a GOB licence, max_sale_days 60, cooling-off 30 days, augmentation cap 0.10"
            - "One GUARANTEED engagement (guaranty_pct 1.50, expense_responsibility SHARED at 0.40) that has been approved and is ACTIVE"
            - "One store SELLING under an APPROVED licence for 2026-09-15..2026-10-14, holding two ORIGINAL lots worth 5,000,000 cents of cost across 1,200 units"
            - "Two markdown stages: stage 1 ACTIVE at 0.20 discount, stage 2 ARMED at 0.40 discount, so planned_avg_discount_pct is 0.3000"
            - "Exactly one POSTED sales day: 1,200,000 cents of ORIGINAL net sales on 300 ORIGINAL units"
            - "Logical clock at 2026-09-20T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { code: "NY", name: "New York", gob_license_required: true, max_sale_days: 60, license_cooling_off_days: 30, max_augmentation_ratio: 0.10, augmentation_disclosure_required: true, advertising_disclosure_required: false, surrender_notice_days: 10, prohibited_claim_codes: ["LOWEST_PRICES_EVER"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { j_ny: $.data.id }
            - call: "POST /engagements"
              payload: { retailer_name: "Halloran Stores", liquidator_name: "Meridian Liquidation", economics_model: "GUARANTEED", guaranty_pct: 1.50, hybrid_retailer_excess_pct: 0, expense_responsibility: "SHARED", shared_expense_liquidator_pct: 0.40, sale_start_date: "2026-09-15", target_end_date: "2026-11-30" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { eng: $.data.id }
            - call: "POST /engagements/${eng}/stores"
              payload: { jurisdiction_id: "${j_ny}", store_code: "S-101", address_line: "12 Main St" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { st: $.data.id }
            - call: "POST /stores/${st}/inventory-lots"
              payload: { category: "APPAREL", source: "ORIGINAL", units_initial: 1000, unit_cost_cents: 2000, unit_retail_cents: 5000 }
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /stores/${st}/inventory-lots"
              payload: { category: "ELECTRONICS", source: "ORIGINAL", units_initial: 200, unit_cost_cents: 15000, unit_retail_cents: 30000 }
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /engagements/${eng}/submit-for-approval"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /engagements/${eng}/approval-decision"
              payload: { decision: "APPROVE" }
              as: RetailerController
              as_user_id: "rc-1"
            - call: "POST /stores/${st}/gob-licenses"
              payload: { license_number: "NY-GOB-0001", period_start_date: "2026-09-15", period_end_date: "2026-10-14", advertising_claim_codes: ["EVERYTHING_MUST_GO"] }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { lic: $.data.id }
            - call: "POST /gob-licenses/${lic}/decision"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "GET /stores/${st}"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { st_v1: $.data.version }
            - call: "POST /stores/${st}/markdown-stages"
              payload: { stage_index: 1, discount_pct: 0.20, sell_through_target_pct: 0.30, window_start_date: "2026-09-15", window_end_date: "2026-09-29", expected_store_version: "${st_v1}" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { stg1: $.data.id }
            - call: "GET /stores/${st}"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { st_v2: $.data.version }
            - call: "POST /stores/${st}/markdown-stages"
              payload: { stage_index: 2, discount_pct: 0.40, sell_through_target_pct: 0.60, window_start_date: "2026-09-29", window_end_date: "2026-10-13", expected_store_version: "${st_v2}" }
              as: LiquidationConsultant
              as_user_id: "lc-1"
              captures: { stg2: $.data.id }
            - call: "POST /markdown-stages/${stg1}/activate"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: SystemOperator
            - call: "POST /stores/${st}/sales-days"
              payload: { business_date: "2026-09-16", original_net_sales_cents: 1200000, augmentation_net_sales_cents: 0, original_units_sold: 300, augmentation_units_sold: 0 }
              as: StoreManager
              as_user_id: "${st}"
              captures: { sd1: $.data.id }
            - call: "POST /sales-days/${sd1}/review"
              payload: { decision: "POST" }
              as: RetailerController
              as_user_id: "rc-1"
          trigger:
            - call: "GET /engagements/${eng}/recovery-summary"
              payload: {}
              as: LiquidationConsultant
              as_user_id: "lc-1"
          assert:
            - "recovery-summary.planned_avg_discount_pct == 0.3000"
            - "recovery-summary.projected_gross_recovery_cents == 6965000"
            - "recovery-summary.projected_recovery_ratio == 1.3930"
            - "recovery-summary.realized_gross_recovery_cents == 1200000"
            - "recovery-summary.realized_recovery_ratio == 0.2400"
            - "recovery-summary.original_cost_value_cents == 5000000"
            - "recovery-summary.guaranty_amount_cents == 7500000"
            - "recovery-summary.projected_shortfall_cents == 535000"
            - "recovery-summary.projected_gross_recovery_cents != recovery-summary.realized_gross_recovery_cents"
            - "Store.${st}.realized_sell_through_pct == 0.2500"

      - name: settlement_provisional_vs_final_basis_diverge_on_one_engagement
        grounds:
          - calculations.engagement_settlement_split
          - entities.Settlement.fields.settlement_basis
          - entities.Settlement.fields.recovery_ratio
          - entities.Settlement.fields.fee_rate
          - state_machines.Settlement.DRAFT_to_PROPOSED
          - validations[priority=77]
        distinguishing_aspect: |
          The PROVISIONAL basis pulls PENDING_REVIEW sales days and SUBMITTED expenses into the
          split while FINAL admits only POSTED days and APPROVED/SETTLED expenses, so on the same
          engagement PROVISIONAL yields recovery_ratio 0.9200 / retailer_proceeds 4,730,000 and
          FINAL yields 0.8400 / 4,410,000 — a different inclusion set, not a different formula.
        test_recipe:
          setup:
            - "One FEE_BASED engagement (guaranty_pct 0, expense_responsibility SHARED at 0.40) with one store closed and the engagement in WIND_DOWN"
            - "Two ORIGINAL lots worth 5,000,000 cents of cost; one received augmentation consignment of 200 units at 2,000 cents cost (ratio 0.0800, inside the 0.10 cap)"
            - "Two POSTED sales days: 1,800,000 ORIGINAL on 400 units, and 2,400,000 ORIGINAL plus 600,000 AUGMENTATION on 500 + 150 units"
            - "One PENDING_REVIEW sales day of 400,000 ORIGINAL on 100 units that FINAL must ignore"
            - "One APPROVED expense of 250,000 cents and one SUBMITTED expense of 100,000 cents that FINAL must ignore"
            - "A PROVISIONAL settlement already proposed, then superseded by a FINAL settlement"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
