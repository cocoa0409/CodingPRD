          - roles.StudioOwner
          - errors.ERR_UNAUTHORIZED_ROLE
          - endpoints.POST_/wellness/class-sessions
        distinguishing_aspect: "Scheduling is a StudioOwner-exclusive operation, so a Client identity presenting a well-formed body is refused with ERR_UNAUTHORIZED_ROLE and nothing is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. GROWTH studio with a payroll period, template, instructor and one client."
          setup_api_calls:
            - *g_tier_growth
            - *g_clock_jun
            - *g_studio_ok
            - call: "POST /wellness/payroll-periods"
              payload: { studio_id: "${studio_ok_id}", period_index: 1, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-30T23:59:59Z" }
              as: StudioOwner
              as_user_id: "${studio_ok_id}"
              captures: { pp_ok_id: $.data.id }
            - call: "POST /wellness/class-templates"
              payload: { studio_id: "${studio_ok_id}", name: "Reformer Flow 50", duration_minutes: 50, base_price_cents: 4000, default_capacity: 2, credit_cost: 1, is_off_peak: true, buffer_minutes: 15 }
