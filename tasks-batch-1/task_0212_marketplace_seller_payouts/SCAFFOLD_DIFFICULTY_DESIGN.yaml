scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_net_provisional_vs_final_diverge_after_partial_refund
        grounds:
          - calculations.order_net_earnings
          - entities.Order.fields.net_earnings_cents
          - state_machines.Order.PENDING_to_AVAILABLE
          - state_machines.Refund.REQUESTED_to_APPLIED
        distinguishing_aspect: |
          The provisional variant (Order creation, refund ignored) and the final variant
          (maturation, subtracts refunded gross minus its proportional commission) produce
          different net_earnings_cents on the SAME Order entity (8130 vs 4730); this is the
          Order-domain member of the dual-variant pair.
        test_recipe:
          setup:
            - "ELECTRONICS FeeSchedule active (commission_bps 1500, fixed 50, proc 290bps+30, maturation_days 7)"
            - "ACTIVE seller; Order gross 10000 created (provisional net 8130); partial refund 4000 APPLIED before maturation"
            - "Clock advanced past settled_at + 7 days so the order matures and net finalizes"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
              captures: { sched_id: $.data.id }
            - call: "POST /sellers"
              payload: { legal_name: "Acme LLC", email: "acme@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1234" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /sellers/${seller_id}/kyc/submit"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /sellers/${seller_id}/kyc/decision"
              payload: { decision: "APPROVE" }
              as: PlatformReviewer
              as_user_id: "reviewer-1"
            - call: "POST /sellers/${seller_id}/w9/submit"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /payout-methods"
              payload: { seller_id: "${seller_id}", method_type: "ACH", account_last4: "5678", currency: "USD" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { pm_id: $.data.id, mdc: $.data.micro_deposit_code }
            - call: "POST /payout-methods/${pm_id}/verify"
              payload: { micro_deposit_code: "${mdc}" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /sellers/${seller_id}/w9/approve"
              payload: {}
              as: PlatformReviewer
              as_user_id: "reviewer-1"
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 10000 }
              as: PlatformFinance
              captures: { order_id: $.data.id, net_prov: $.data.net_earnings_cents }
            - call: "POST /refunds"
              payload: { order_id: "${order_id}", refund_amount_cents: 4000, reason: "DAMAGED" }
              as: PlatformFinance
              captures: { refund_id: $.data.id }
            - call: "POST /refunds/${refund_id}/apply"
              payload: {}
              as: PlatformFinance
          trigger:
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformFinance
          assert:
            - "Order.${order_id}.net_earnings_cents == 4730"
            - "net_prov captured at creation == 8130"
            - "Order.${order_id}.settlement_status == AVAILABLE"

      - name: seller_risk_score_recomputed_on_chargeback_distinct_from_order_cost
        grounds:
          - calculations.seller_risk_score
          - entities.Seller.fields.seller_risk_score
          - entities.Seller.fields.risk_tier
          - state_machines.Chargeback.RECEIVED_to_LOST
        distinguishing_aspect: |
          seller_risk_score is a weighted risk calculation on the Seller domain (not Order cost
          accounting); with 1 order and 1 chargeback the score is 60 and risk_tier flips to HIGH,
          demonstrating dual-variant logic on a second, structurally different subject entity.
        test_recipe:
          setup:
            - "ACTIVE seller with exactly one Order (gross 10000)"
            - "One Chargeback RECEIVED against that order (chargeback_rate = 1/1 = 1.0)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "Beta Inc", email: "beta@x.com", country_code: "US", tax_classification: "C_CORP", tin_last4: "2222" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 10000 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /chargebacks"
              payload: { order_id: "${order_id}" }
              as: PlatformFinance
              captures: { cb_id: $.data.id }
          assert:
            - "Seller.${seller_id}.seller_risk_score == 60"
            - "Seller.${seller_id}.risk_tier == HIGH"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes {a,b,c}
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: payout_reserve_tiered_rate_selection_by_risk_tier
        grounds:
          - calculations.payout_amount
          - entities.Payout.fields.reserve_withheld_cents
          - entities.Payout.fields.payout_amount_cents
          - state_machines.Payout.SCHEDULED_to_RELEASED
        distinguishing_aspect: |
          MODE (a): non-linear formula with ≥3 inputs (available pool, risk_tier, and the
          tier-selected reserve_pct branch). With available pool 6630 at HIGH tier (50%) the
          reserve is 3315 and payout 3315 — tier selection is a conditional branch on Seller state.
        test_recipe:
          setup:
            - "ACTIVE seller, ELECTRONICS schedule (reserve_high=50)"
            - "Order1 gross 10000 matured AVAILABLE (proceeds +8130); a Chargeback RECEIVED on Order1 posts a -1500 fee (AVAILABLE) and pushes risk_tier to HIGH"
            - "Available pool = 8130 - 1500 = 6630; Order1 still clawback_status NONE so it is swept"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "Gamma Co", email: "gamma@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "3333" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /sellers/${seller_id}/kyc/submit"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /sellers/${seller_id}/kyc/decision"
              payload: { decision: "APPROVE" }
              as: PlatformReviewer
              as_user_id: "reviewer-1"
            - call: "POST /sellers/${seller_id}/w9/submit"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /payout-methods"
              payload: { seller_id: "${seller_id}", method_type: "ACH", account_last4: "5678", currency: "USD" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { pm_id: $.data.id, mdc: $.data.micro_deposit_code }
            - call: "POST /payout-methods/${pm_id}/verify"
              payload: { micro_deposit_code: "${mdc}" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /sellers/${seller_id}/w9/approve"
              payload: {}
              as: PlatformReviewer
              as_user_id: "reviewer-1"
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 10000 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /chargebacks"
              payload: { order_id: "${order_id}" }
              as: PlatformFinance
            - call: "POST /payouts"
              payload: { seller_id: "${seller_id}" }
              as: PlatformFinance
              captures: { payout_id: $.data.id }
            - call: "GET /sellers/${seller_id}"
              payload: {}
              as: PlatformFinance
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /payouts/${payout_id}/release"
              payload: { expected_seller_version: "${sv}" }
              as: PlatformFinance
              as_user_id: "finance-2"
          assert:
            - "Payout.${payout_id}.reserve_withheld_cents == 3315"
            - "Payout.${payout_id}.payout_amount_cents == 3315"

      - name: order_net_round_per_component_then_sum_pinned_order
        grounds:
          - calculations.order_net_earnings
          - entities.Order.fields.commission_cents
          - entities.Order.fields.processing_fee_cents
          - entities.Order.fields.net_earnings_cents
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters — each fee component is round_half_up'd
          to whole cents BEFORE summation. For gross 12345: commission=round(1851.75)=1852,
          processing=round(358.005)=358+30=388, net=12345-1852-50-388=10055. A sum-then-round
          implementation would diverge on the fractional cents.
        test_recipe:
          setup:
            - "ELECTRONICS schedule active; seller exists; Order gross 12345"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "Delta Ltd", email: "delta@x.com", country_code: "GB", tax_classification: "LLC", tin_last4: "4444" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 12345 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.commission_cents == 1852"
            - "Order.${order_id}.processing_fee_cents == 388"
            - "Order.${order_id}.net_earnings_cents == 10055"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: dispute_cycle_under_review_seller_responded_repeats
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_SELLER_RESPONDED
          - state_machines.Dispute.SELLER_RESPONDED_to_UNDER_REVIEW
          - entities.Dispute.fields.response_round
        distinguishing_aspect: |
          Dispute is CYCLIC: UNDER_REVIEW→SELLER_RESPONDED→UNDER_REVIEW repeats, with response_round
          incrementing each respond. After two full cycles response_round == 2 and status is UNDER_REVIEW —
          a non-linear loop on the Dispute entity.
        test_recipe:
          setup:
            - "Seller + Order exist; a Dispute FILED then driven through two review/respond cycles"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /fee-schedules"
              payload: { category: "MEDIA", commission_bps: 1200, fixed_fee_cents: 40, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "Echo LLC", email: "echo@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "5555" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "MEDIA", gross_amount_cents: 9000 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
            - call: "POST /disputes"
              payload: { order_id: "${order_id}", claim_type: "ITEM_NOT_RECEIVED" }
              as: PlatformReviewer
              as_user_id: "reviewer-1"
              captures: { dispute_id: $.data.id }
            - call: "POST /disputes/${dispute_id}/open-review"
              payload: {}
              as: PlatformReviewer
              as_user_id: "reviewer-1"
            - call: "POST /disputes/${dispute_id}/respond"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /disputes/${dispute_id}/open-review"
              payload: {}
              as: PlatformReviewer
              as_user_id: "reviewer-1"
          trigger:
            - call: "POST /disputes/${dispute_id}/respond"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
          assert:
            - "Dispute.${dispute_id}.dispute_status == SELLER_RESPONDED"
            - "Dispute.${dispute_id}.response_round == 2"

      - name: order_parallel_settlement_and_clawback_dimensions_evolve_independently
        grounds:
          - state_machines.Order.PENDING_to_AVAILABLE
          - state_machines.Order_clawback.NONE_to_REFUND_CLAWED
          - entities.Order.fields.settlement_status
          - entities.Order.fields.clawback_status
        distinguishing_aspect: |
          Order carries two PARALLEL state dimensions: settlement_status (PENDING→AVAILABLE) and
          clawback_status (NONE→REFUND_CLAWED) evolve on different triggers on the same row. A
          partial refund flips clawback_status to REFUND_CLAWED while settlement_status stays PENDING —
          a different entity from the cyclic Dispute machine.
        test_recipe:
          setup:
            - "ACTIVE seller; Order gross 10000 PENDING; partial refund 3000 APPLIED before maturation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "Foxtrot Inc", email: "foxtrot@x.com", country_code: "US", tax_classification: "C_CORP", tin_last4: "6666" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 10000 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
            - call: "POST /refunds"
              payload: { order_id: "${order_id}", refund_amount_cents: 3000, reason: "BUYER_REMORSE" }
              as: PlatformFinance
              captures: { refund_id: $.data.id }
          trigger:
            - call: "POST /refunds/${refund_id}/apply"
              payload: {}
              as: PlatformFinance
          assert:
            - "Order.${order_id}.clawback_status == REFUND_CLAWED"
            - "Order.${order_id}.settlement_status == PENDING"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payout_release_cascade_order_paid_then_ledger_then_balance_depth3
        grounds:
          - state_machines.Payout.SCHEDULED_to_RELEASED
          - state_machines.Order.AVAILABLE_to_PAID
          - entities.LedgerEntry.fields.hold_state
          - entities.Seller.fields.available_balance_cents
        distinguishing_aspect: |
          Depth ≥ 3 chain from POST /payouts/{id}/release: (A) Payout SCHEDULED→RELEASED →
          (B) that release flips each swept Order AVAILABLE→PAID → (C) the PAID flip together with the
          PAYOUT ledger posting drives seller.available_balance_cents to 0. Each link is caused by the
          prior link, not directly by the release call.
        test_recipe:
          setup:
            - "ACTIVE STANDARD seller (reserve 0); one Order gross 10000 matured AVAILABLE (+8130); payout scheduled"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "Hotel LLC", email: "hotel@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "8888" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /sellers/${seller_id}/kyc/submit"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /sellers/${seller_id}/kyc/decision"
              payload: { decision: "APPROVE" }
              as: PlatformReviewer
              as_user_id: "reviewer-1"
            - call: "POST /sellers/${seller_id}/w9/submit"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /payout-methods"
              payload: { seller_id: "${seller_id}", method_type: "ACH", account_last4: "5678", currency: "USD" }
              as: Seller
              as_user_id: "${seller_id}"
              captures: { pm_id: $.data.id, mdc: $.data.micro_deposit_code }
            - call: "POST /payout-methods/${pm_id}/verify"
              payload: { micro_deposit_code: "${mdc}" }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /sellers/${seller_id}/w9/approve"
              payload: {}
              as: PlatformReviewer
              as_user_id: "reviewer-1"
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 10000 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /payouts"
              payload: { seller_id: "${seller_id}" }
              as: PlatformFinance
              captures: { payout_id: $.data.id }
            - call: "GET /sellers/${seller_id}"
              payload: {}
              as: PlatformFinance
              captures: { sv: $.data.version }
          trigger:
            - call: "POST /payouts/${payout_id}/release"
              payload: { expected_seller_version: "${sv}" }
              as: PlatformFinance
              as_user_id: "finance-2"
          assert:
            - "Order.${order_id}.settlement_status == PAID"
            - "Payout.${payout_id}.payout_amount_cents == 8130"
            - "Seller.${seller_id}.available_balance_cents == 0"

      - name: refund_apply_cascade_clawback_then_ledger_then_balance_depth2
        grounds:
          - state_machines.Refund.REQUESTED_to_APPLIED
          - state_machines.Order_clawback.NONE_to_REFUND_CLAWED
          - entities.LedgerEntry.fields.amount_cents
          - entities.Seller.fields.pending_balance_cents
        distinguishing_aspect: |
          Depth ≥ 2 chain from POST /refunds/{id}/apply (DIFFERENT trigger than payout release):
          (A) Refund REQUESTED→APPLIED → (B) the apply posts a REFUND_CLAWBACK LedgerEntry (-3400)
          which drives down seller.pending_balance_cents. The ledger posting is caused by the
          state change, not by the request directly.
        test_recipe:
          setup:
            - "ACTIVE seller; Order gross 10000 PENDING (provisional proceeds 8130 PENDING); refund 4000 REQUESTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "India LLC", email: "india@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "9999" }
              as: PlatformReviewer
              captures: { seller_id: $.data.id }
            - call: "POST /orders"
              payload: { seller_id: "${seller_id}", category: "ELECTRONICS", gross_amount_cents: 10000 }
              as: PlatformFinance
              captures: { order_id: $.data.id }
            - call: "POST /refunds"
              payload: { order_id: "${order_id}", refund_amount_cents: 4000, reason: "NOT_AS_DESCRIBED" }
              as: PlatformFinance
              captures: { refund_id: $.data.id }
          trigger:
            - call: "POST /refunds/${refund_id}/apply"
              payload: {}
              as: PlatformFinance
          assert:
            - "Order.${order_id}.clawback_status == REFUND_CLAWED"
            - "Refund.${refund_id}.clawback_cents == 3400"
            - "Seller.${seller_id}.pending_balance_cents == 4730"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: seller_not_active_outranks_nothing_to_pay_on_release
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - errors[ERR_SELLER_NOT_ACTIVE]
          - errors[ERR_NOTHING_TO_PAY]
        distinguishing_aspect: |
          Category pair STATE (priority 7, ERR_SELLER_NOT_ACTIVE) vs BUSINESS_FISCAL (priority 14,
          ERR_NOTHING_TO_PAY). A SUSPENDED seller with zero available balance releasing a payout fails
          both; the higher-priority STATE check wins → ERR_SELLER_NOT_ACTIVE, not ERR_NOTHING_TO_PAY.
        test_recipe:
          setup:
            - "ACTIVE seller activated, then SUSPENDED; a payout scheduled while seller had zero AVAILABLE balance"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformFinance
            - call: "POST /fee-schedules"
              payload: { category: "ELECTRONICS", commission_bps: 1500, fixed_fee_cents: 50, payment_processing_bps: 290, payment_processing_fixed_cents: 30, reserve_pct_standard: 0, reserve_pct_elevated: 20, reserve_pct_high: 50, maturation_days: 7 }
              as: PlatformFinance
            - call: "POST /sellers"
              payload: { legal_name: "Juliet LLC", email: "juliet@x.com", country_code: "US", tax_classification: "LLC", tin_last4: "1212" }
              as: PlatformReviewer
