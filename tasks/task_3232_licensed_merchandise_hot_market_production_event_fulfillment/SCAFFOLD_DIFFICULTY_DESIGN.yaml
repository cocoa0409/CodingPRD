            - call: "PUT /designs/${dsg8_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg8_v}" }
              as: LicensingOps
              as_user_id: "${lic8_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic8_id}", design_id: "${dsg8_id}", team_code: "PHI", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { po8_id: $.data.id, po8_v: $.data.version }
            - call: "POST /production-orders/${po8_id}/layers"
              payload: { expected_production_order_version: "${po8_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
              captures: { po8_v2: $.data.version, lay8_id: "$.data.layer_ids[0]" }
            - call: "POST /print-layers/${lay8_id}/print"
              payload: { printed_qty: 20 }
              as: PrintOperator
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${po8_id}", channel: "EVENT_POPUP", destination_code: "ATL_POPUP", quantity: 100 }
              as: FulfillmentCoordinator
              captures: { fo8_id: $.data.id, fo8_total_before: $.data.requested_wholesale_cents }
          trigger:
            - call: "POST /print-layers/${lay8_id}/print-failure"
              payload: { failed_qty: 20 }
              as: PrintOperator
            - call: "GET /production-orders/${po8_id}"
              payload: {}
              as: ProductionPlanner
              captures: { hop2_base_units: $.data.base_units_printed }
            - call: "GET /fulfillment-orders/${fo8_id}"
              payload: {}
              as: FulfillmentCoordinator
              captures: { hop2_status: $.data.status, hop2_total: $.data.requested_wholesale_cents }
          assert:
            - "ProductionOrder.${po8_id}.base_units_printed == 0"
            - "FulfillmentOrder.${fo8_id}.status == DISTRESSED"
            - "FulfillmentOrder.${fo8_id}.requested_wholesale_cents == 0"
            - "the order's wholesale total fell from 900 to 0 only after the layer's committed quantity collapsed"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: terminal_run_ship_prefers_state_over_capacity
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: "A ship request that both targets a retired run and overships its picked units returns ERR_INVALID_STATE, not ERR_CAPACITY_EXCEEDED — the state/state pair resolves in favour of the lower priority number, which is the opposite outcome from the counterfeit pair."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LIC9, TRACTOR design DSG9 APPROVED, run PO9 committed with a BASE layer of 20, one order of 20 units picked in full, then the run retired."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "NBL Priority", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { lic9_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lic9_id}", team_code: "BOS", garment_sku: "TRACTOR", design_name: "BOS Priority Tractor" }
              as: DesignOps
              captures: { dsg9_id: $.data.id, dsg9_v: $.data.version }
            - call: "PUT /designs/${dsg9_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg9_v}" }
              as: LicensingOps
              as_user_id: "${lic9_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic9_id}", design_id: "${dsg9_id}", team_code: "BOS", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { po9_id: $.data.id, po9_v: $.data.version }
            - call: "POST /production-orders/${po9_id}/layers"
              payload: { expected_production_order_version: "${po9_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
              captures: { po9_v2: $.data.version }
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${po9_id}", channel: "VENUE_RETAIL", destination_code: "BOS_VENUE", quantity: 20 }
              as: FulfillmentCoordinator
              captures: { fo9_id: $.data.id }
            - call: "POST /fulfillment-orders/${fo9_id}/pick"
              payload: { expected_production_order_version: "${po9_v2}", quantity: 20, pick_remark: "pick-p9" }
              as: FulfillmentCoordinator
            - call: "POST /production-orders/${po9_id}/retire"
              payload: { retire_reason: "DEMAND_COLLAPSE", destroy_mode: "DESTROY" }
              as: ProductionPlanner
          trigger:
            - call: "POST /fulfillment-orders/${fo9_id}/ship"
              payload: { quantity: 999, carrier: "GROUND", sla_hours: 48 }
              as: FulfillmentCoordinator
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "the response error_id is ERR_INVALID_STATE"
            - "the response error_id is not ERR_CAPACITY_EXCEEDED"
            - "FulfillmentOrder.${fo9_id}.shipped_qty == 0"
            - "FulfillmentOrder.${fo9_id}.status == DISTRESSED"

      - name: counterfeit_confirmation_prefers_safety_over_referential
        grounds:
          - validations[priority=11]
          - errors[ERR_LISTING_UNVERIFIED]
          - errors[ERR_COUNTERFEIT_OVERCOUNT]
        distinguishing_aspect: "Enforcing a report whose listing cannot be verified and whose suspect quantity exceeds the observed unit count returns ERR_LISTING_UNVERIFIED (business_referential), not ERR_COUNTERFEIT_OVERCOUNT (business_constraint) — the referential pair outranks the constraint pair here, the mirror image of the terminal-run ship case."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LIC10 with an unverifiable marketplace listing UNVERIFIED-LISTING-42, and an open counterfeit report of 100 observed units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "NBL Enforcement", league_code: "NBL", royalty_rate_pct: 0.08, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { lic10_id: $.data.id }
            - call: "POST /counterfeit-reports"
              payload: { licensor_id: "${lic10_id}", venue_code: "ATL_POPUP", online_listing_id: "UNVERIFIED-LISTING-42", unit_count: 100, suspect_quantity: 0, detected_at: "2026-09-01T00:00:00Z" }
              as: EnforcementAgent
              captures: { cr10_id: $.data.id }
          trigger:
            - call: "POST /counterfeit-reports/${cr10_id}/enforce"
              payload: { infringement_confirmed: true, suspect_quantity: 150 }
              as: EnforcementAgent
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "the response error_id is ERR_LISTING_UNVERIFIED"
            - "the response error_id is not ERR_COUNTERFEIT_OVERCOUNT"
            - "CounterfeitReport.${cr10_id}.report_status == OPEN"
            - "CounterfeitReport.${cr10_id}.total_exposure_cents == 0"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: reopen_window_boundary_at_committed_plus_48h
        grounds:
          - validations[priority=7]
          - state_machines.ProductionOrder.PRINTING_to_COMMITTED
          - errors[ERR_EVENT_WINDOW_CLOSED]
        distinguishing_aspect: "The reopen window is inclusive at exactly committed_at + 48 hours and rejects one second later, so the same print-failure call flips polarity purely on the clock instant — a strict-versus-inclusive boundary on a datetime metric reachable only through the clock endpoint."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LIC11, TRACTOR design DSG11 APPROVED, run PO11 committed with a BASE layer of 20 and printed to 20 units."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /licensors"
              payload: { name: "NBL Boundary", league_code: "NBL", royalty_rate_pct: 0.1, minimum_guarantee_cents: 100000 }
              as: PlatformAdmin
              captures: { lic11_id: $.data.id }
            - call: "POST /designs"
              payload: { licensor_id: "${lic11_id}", team_code: "NYC", garment_sku: "TRACTOR", design_name: "NYC Boundary Tractor" }
              as: DesignOps
              captures: { dsg11_id: $.data.id, dsg11_v: $.data.version }
            - call: "PUT /designs/${dsg11_id}/licensor-decision"
              payload: { decision: "APPROVE", expected_design_version: "${dsg11_v}" }
              as: LicensingOps
              as_user_id: "${lic11_id}"
            - call: "POST /production-orders"
              payload: { licensor_id: "${lic11_id}", design_id: "${dsg11_id}", team_code: "NYC", trigger_type: "STANDARD", expected_demand_qty: 5000, unit_cost_cents: 900 }
              as: ProductionPlanner
              captures: { po11_id: $.data.id, po11_v: $.data.version }
            - call: "POST /production-orders/${po11_id}/layers"
              payload: { expected_production_order_version: "${po11_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
              captures: { lay11_id: "$.data.layer_ids[0]" }
            - call: "POST /print-layers/${lay11_id}/print"
              payload: { printed_qty: 20 }
              as: PrintOperator
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /production-orders/${po11_id}"
              payload: {}
              as: ProductionPlanner
              captures: { po11_committed_at: $.data.committed_at }
            - call: "POST /print-layers/${lay11_id}/print-failure"
              payload: { failed_qty: 40 }
              as: PrintOperator
            - call: "GET /production-orders/${po11_id}"
              payload: {}
              as: ProductionPlanner
              captures: { po11_status_at_edge: $.data.status }
          assert:
            - "PrintLayer ${lay11_id}.committed_qty == 0 at the exact 48-hour edge"
            - "ProductionOrder.${po11_id}.status == COMMITTED at the exact 48-hour edge, because the reducer reverts PRINTING"
            - "ProductionOrder.${po11_id}.base_units_printed == 0"

      - name: reservation_hour_boundary_at_rush_sla_edge
        grounds:
          - validations[priority=7]
          - calculations.rush_delivery_commitment
          - errors[ERR_RUSH_COMMITMENT_BREACH]
        distinguishing_aspect: "A capacity window that starts within 24 hours of needed_by is classified RUSH and weighted 0.9, while the same window one second further out is STANDARD and weighted 0.1 — the 24-hour classification edge is the boundary, and it moves the written rush_delivery_points from 18.00 to 2.00."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Licensor LIC12 and a BASE capacity window of 20 units starting at 2026-09-01T01:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
