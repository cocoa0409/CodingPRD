              payload: { disposition: "RESTERILIZE" }
              as: QualityReleaseOfficer
              as_user_id: "qro-1"
          assert:
            - "hop 1: AdverseEvent.${ae_id}.status == RESTERILIZE_APPROVED and disposition == RESTERILIZE"
            - "hop 2: Lot.${lot1_id}.status == RECALLED and quarantine_reason == ADVERSE_EVENT"
            - "hop 2: GET /sterilization/lots?parent_lot_id=${lot1_id} returns total_count == 1"
            - "hop 2: the successor lot has lot_code == L-001-R1, resterilization_count == 1, cumulative_dose_kgy == 30.00, status == RECEIVED, residual_status == NOT_APPLICABLE, total_pallet_count == 2"
            - "hop 3: ProductQualification.${q5_id}.status == SUSPENDED and next_audit_due_at is null"
            - "hop 3: the successor lot has schedulable == false"
            - "Lot.${lot1_id}.release_dose_kgy == 30.00 and cumulative_dose_kgy == 30.00 (the parent keeps its own ledger)"

  # ===========================================================================
  # Rule 5 - Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: start_state_check_outranks_chamber_maintenance_safety_check
        grounds:
          - validations[priority=45]
          - validations[priority=65]
          - errors[ERR_CYCLE_NOT_READY]
          - errors[ERR_CHAMBER_UNAVAILABLE]
          - state_machines.Chamber.AVAILABLE_to_MAINTENANCE
        distinguishing_aspect: |
          Category pair `state` (priority 45) versus `business_safety` (priority
          65): a start request against a cycle still in LOADING whose chamber has
          been put into MAINTENANCE violates both rules, and the state rule wins,
          so the response is ERR_CYCLE_NOT_READY and never ERR_CHAMBER_UNAVAILABLE.
        test_recipe:
          setup:
            - "A GAMMA cycle sits in LOADING with one load position and both required dosimeters placed, but readiness has never been signed off."
            - "The chamber backing that cycle has been moved to MAINTENANCE."
          setup_api_calls:
            - call: "POST /sterilization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: RegulatoryAdmin
            - call: "POST /sterilization/customers"
              payload: { name: "Acme Medical", account_code: "ACME-01", contracted_modalities: ["ETO", "GAMMA"] }
              as: RegulatoryAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sterilization/products"
              payload: { customer_id: "${cust_id}", product_code: "P1", pallet_mass_kg: 120.0, pallet_volume_m3: 1.2, max_allowed_dose_kgy: 45.0, max_cumulative_dose_kgy: 60.0, eto_residual_limit_ppm: 4.0, ech_residual_limit_ppm: 9.0, requires_aeration: false }
              as: RegulatoryAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /sterilization/emission-permits"
              payload: { permit_code: "AP-2026", permit_year: 2026, annual_allowance_kg: 1000.0, max_concurrent_eto_cycles: 2 }
              as: RegulatoryAdmin
              captures: { permit_id: $.data.id }
            - call: "POST /sterilization/chambers"
              payload: { permit_id: "${permit_id}", chamber_code: "CH-G1", modality: "GAMMA", pallet_capacity: 8, turnaround_minutes: 30, abatement_efficiency_pct: 0.0 }
              as: RegulatoryAdmin
              captures: { chg1_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes"
              payload: { recipe_code: "RG", modality: "GAMMA", density_min_g_per_cm3: 0.1000, density_max_g_per_cm3: 0.1060, target_dose_kgy: 30.0, min_dose_kgy: 27.0, max_dose_kgy: 45.0, dose_basis: "ROUTINE_MEAN", aeration_base_hours: 0, required_min_zone_dosimeters: 1, required_routine_dosimeters: 1, required_biological_indicators: 0 }
              as: RegulatoryAdmin
              captures: { rg_id: $.data.id }
            - call: "POST /sterilization/cycle-recipes/${rg_id}/approve"
              payload: {}
              as: RegulatoryAdmin
            - call: "POST /sterilization/qualifications"
              payload: { product_id: "${p1_id}", recipe_id: "${rg_id}", method: "VDMAX_25", verification_dose_kgy: 12.5, sal_exponent: 6 }
              as: RegulatoryAdmin
              captures: { q1_id: $.data.id }
            - call: "POST /sterilization/qualifications/${q1_id}/dose-audits"
              payload: { performed_at: "2026-08-05T00:00:00Z", samples_tested: 100, positives: 0, verification_dose_kgy_applied: 12.5 }
              as: RegulatoryAdmin
            - call: "POST /sterilization/lots"
              payload: { customer_id: "${cust_id}", product_id: "${p1_id}", lot_code: "L-001", total_pallet_count: 2 }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { lot1_id: $.data.id }
            - call: "POST /sterilization/cycles"
              payload: { chamber_id: "${chg1_id}", recipe_id: "${rg_id}", cycle_code: "C-001", scheduled_start_at: "2026-08-11T00:00:00Z", scheduled_end_at: "2026-08-11T06:00:00Z" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { cyc_id: $.data.id, cyc_v0: $.data.version }
            - call: "POST /sterilization/cycles/${cyc_id}/load-positions"
              payload: { lot_id: "${lot1_id}", position_index: 1, zone: "MIN_DOSE", pallet_count: 2, expected_cycle_version: "${cyc_v0}" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { pos1_id: $.data.id }
            - call: "POST /sterilization/load-positions/${pos1_id}/indicators"
              payload: { indicator_type: "DOSIMETER", placement_zone: "MIN_DOSE", serial_code: "D-MIN" }
              as: CycleOperator
              as_user_id: "op-1"
              captures: { d_min_id: $.data.id }
            - call: "POST /sterilization/load-positions/${pos1_id}/indicators"
              payload: { indicator_type: "DOSIMETER", placement_zone: "ROUTINE", serial_code: "D-RT" }
