# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of testable claims
# Brow & Lash Studio (task_0637)
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_studio_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Studio.fields.status
          - endpoints
        distinguishing_aspect: "POST /studios with only name applies defaults deposit_rate_pct=0.20, late_cancel_cutoff_hours=24, noshow_strike_window_days=90, noshow_strike_threshold=3; status=OPEN."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
          assert:
            - "Response status == 201"
            - "Studio.${studio_id}.deposit_rate_pct == 0.20"
            - "Studio.${studio_id}.late_cancel_cutoff_hours == 24"
            - "Studio.${studio_id}.noshow_strike_threshold == 3"
            - "Studio.${studio_id}.status == OPEN"

      - name: get_studio_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_STUDIO_NOT_FOUND]"
        distinguishing_aspect: "GET /studios/{unknown UUID} returns ERR_STUDIO_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /studios/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404"
            - "data.error_id == ERR_STUDIO_NOT_FOUND"

      - name: service_type_missing_required_field_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ServiceType.fields.code
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /studios/{id}/service-types omitting base_price_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Studio exists."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
          trigger:
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "FULL_SET", name: "Full Set", duration_minutes: 120, credit_cost: 4, category: "PREMIUM" }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: service_type_invalid_enum_code_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ServiceType.fields.code
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST service-types with code='OMBRE' (not in FULL_SET/FILL/LIFT/TINT) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Studio exists."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
          trigger:
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "OMBRE", name: "Ombre", duration_minutes: 90, base_price_cents: 9000, credit_cost: 3, category: "PREMIUM" }
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: appointment_computed_end_utc_and_deposit
        claim_type: Computed Fields
        grounds:
          - entities.Appointment.fields.end_utc
          - entities.Appointment.fields.deposit_cents
        distinguishing_aspect: "On cash booking, end_utc = start_utc + duration_minutes and deposit_cents = round_half_up(base_price_cents*deposit_rate_pct); client-supplied values for these are ignored (not accepted as input)."
        test_recipe:
          setup: ["Studio deposit_rate 0.20; FULL_SET 120 min base 12000; sanitized master tech; clock set."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow", deposit_rate_pct: 0.20 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "FULL_SET", name: "Full Set", duration_minutes: 120, base_price_cents: 12000, credit_cost: 4, category: "PREMIUM", requires_patch_test: false }
              as: StudioManager
              captures: { full_st_id: $.data.id }
            - call: "POST /lash-techs"
              payload: { studio_id: "${studio_id}", full_name: "Mara", skill_level: 3, station_number: 1 }
              as: StudioManager
              captures: { tech1_id: $.data.id }
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${full_st_id}", start_utc: "2026-06-10T20:00:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { appt_id: $.data.id }
          assert:
            - "Appointment.${appt_id}.end_utc == 2026-06-10T22:00:00Z"
            - "Appointment.${appt_id}.deposit_cents == 2400"
            - "Appointment.${appt_id}.credits_charged == 0"

      - name: member_email_unique_within_studio
        claim_type: Type Constraints
        grounds:
          - entities.Member.fields.email
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Creating a second Member with an email already used in the same studio returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Studio with one member ada@x.com."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
          trigger:
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada Two", email: "ada@x.com" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: credit_ledger_entry_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.CreditLedgerEntry.fields.delta
        distinguishing_aspect: "CreditLedgerEntry has common_fields:false — only id+created_at; it is append-only with no update endpoint and no version field, and is read solely via the credit-ledger list."
        test_recipe:
          setup: ["Membership enrolled with initial_credits=4 → one GRANT ledger entry exists."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /membership-plans"
              payload: { studio_id: "${studio_id}", tier: "ESSENTIAL", monthly_credit_allotment: 4, monthly_fee_cents: 6900 }
              as: StudioManager
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}", cycle_anchor_utc: "2026-01-15T00:00:00Z", initial_credits: 4 }
              as: FrontDesk
              captures: { ms_id: $.data.id }
          trigger:
            - call: "GET /memberships/${ms_id}/credit-ledger"
              payload: {}
              as: FrontDesk
          assert:
            - "Response status == 200; response_type == array"
            - "Exactly one CreditLedgerEntry with reason==GRANT and delta==4 is returned"
            - "Each returned entry has id and created_at but no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: complete_appointment_from_already_completed_returns_not_booked
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Appointment.BOOKED_to_COMPLETED
          - "errors[ERR_APPOINTMENT_NOT_BOOKED]"
        distinguishing_aspect: "Completing an Appointment already COMPLETED returns ERR_APPOINTMENT_NOT_BOOKED (409); no side effects fire."
        test_recipe:
          setup: ["Cash FULL_SET appointment completed once; clock past its start."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "FULL_SET", name: "Full Set", duration_minutes: 120, base_price_cents: 12000, credit_cost: 4, category: "PREMIUM", requires_patch_test: false }
              as: StudioManager
              captures: { full_st_id: $.data.id }
            - call: "POST /lash-techs"
              payload: { studio_id: "${studio_id}", full_name: "Mara", skill_level: 3, station_number: 1 }
              as: StudioManager
              captures: { tech1_id: $.data.id }
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:00:00Z" }
              as: StudioManager
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${full_st_id}", start_utc: "2026-06-10T12:00:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { appt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T12:30:00Z" }
              as: StudioManager
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: LashTech
              as_user_id: "${tech1_id}"
          trigger:
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: LashTech
              as_user_id: "${tech1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_APPOINTMENT_NOT_BOOKED"

      - name: complete_before_start_returns_not_started
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Appointment.BOOKED_to_COMPLETED
          - "errors[ERR_APPOINTMENT_NOT_STARTED]"
        distinguishing_aspect: "Completing a BOOKED appointment while clock < start_utc returns ERR_APPOINTMENT_NOT_STARTED (409)."
        test_recipe:
          setup: ["BOOKED cash FULL_SET starting in the future; clock before start."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "FULL_SET", name: "Full Set", duration_minutes: 120, base_price_cents: 12000, credit_cost: 4, category: "PREMIUM", requires_patch_test: false }
              as: StudioManager
              captures: { full_st_id: $.data.id }
            - call: "POST /lash-techs"
              payload: { studio_id: "${studio_id}", full_name: "Mara", skill_level: 3, station_number: 1 }
              as: StudioManager
              captures: { tech1_id: $.data.id }
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:00:00Z" }
              as: StudioManager
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${full_st_id}", start_utc: "2026-06-10T20:00:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /appointments/${appt_id}/complete"
              payload: {}
              as: LashTech
              as_user_id: "${tech1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_APPOINTMENT_NOT_STARTED"

      - name: settle_dues_from_active_returns_invalid_membership_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Membership.PAST_DUE_to_ACTIVE
          - "errors[ERR_INVALID_MEMBERSHIP_STATE]"
        distinguishing_aspect: "settle-dues on an ACTIVE (not PAST_DUE) membership returns ERR_INVALID_MEMBERSHIP_STATE (409)."
        test_recipe:
          setup: ["ACTIVE membership."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /membership-plans"
              payload: { studio_id: "${studio_id}", tier: "ESSENTIAL", monthly_credit_allotment: 4, monthly_fee_cents: 6900 }
              as: StudioManager
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}", cycle_anchor_utc: "2026-01-15T00:00:00Z" }
              as: FrontDesk
              captures: { ms_id: $.data.id }
          trigger:
            - call: "POST /memberships/${ms_id}/settle-dues"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_MEMBERSHIP_STATE"

      - name: reactivate_while_strikes_active_returns_strikes_still_active
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Membership.SUSPENDED_to_ACTIVE
          - "errors[ERR_STRIKES_STILL_ACTIVE]"
        distinguishing_aspect: "Reactivating a SUSPENDED membership while noshow_strike_count is still >= threshold (strikes not aged out) returns ERR_STRIKES_STILL_ACTIVE (409)."
        test_recipe:
          setup: ["Membership SUSPENDED via 3 in-window no-shows; clock NOT advanced past the window so strikes remain active."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow", noshow_strike_threshold: 3, noshow_strike_window_days: 90 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /membership-plans"
              payload: { studio_id: "${studio_id}", tier: "ESSENTIAL", monthly_credit_allotment: 4, monthly_fee_cents: 6900 }
              as: StudioManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "TINT", name: "Tint", duration_minutes: 30, base_price_cents: 4000, credit_cost: 2, category: "STANDARD", requires_patch_test: false }
              as: StudioManager
              captures: { tint_st_id: $.data.id }
            - call: "POST /lash-techs"
              payload: { studio_id: "${studio_id}", full_name: "Mara", skill_level: 1, station_number: 1 }
              as: StudioManager
              captures: { tech1_id: $.data.id }
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-10T00:00:00Z" }
              as: StudioManager
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}", cycle_anchor_utc: "2026-01-15T00:00:00Z" }
              as: FrontDesk
              captures: { ms_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${tint_st_id}", start_utc: "2026-06-10T07:00:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { a1: $.data.id }
            - call: "POST /appointments/${a1}/mark-no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${tint_st_id}", start_utc: "2026-06-10T07:30:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { a2: $.data.id }
            - call: "POST /appointments/${a2}/mark-no-show"
              payload: {}
              as: FrontDesk
            - call: "POST /appointments"
              payload: { member_id: "${member_id}", service_type_id: "${tint_st_id}", start_utc: "2026-06-10T08:00:00Z", pay_with_credits: false }
              as: FrontDesk
              captures: { a3: $.data.id }
            - call: "POST /appointments/${a3}/mark-no-show"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /memberships/${ms_id}/reactivate"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "Membership.${ms_id}.status == SUSPENDED before the call"
            - "Response status == 409"
            - "data.error_id == ERR_STRIKES_STILL_ACTIVE"

      - name: revoke_patch_test_from_revoked_returns_not_valid
        claim_type: Idempotency
        grounds:
          - state_machines.ConsentPatchTest.VALID_to_REVOKED
          - "errors[ERR_PATCH_TEST_NOT_VALID]"
        distinguishing_aspect: "Revoking a ConsentPatchTest already REVOKED returns ERR_PATCH_TEST_NOT_VALID (409)."
        test_recipe:
          setup: ["Member with one patch test, revoked once."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /patch-tests"
              payload: { member_id: "${member_id}", administered_utc: "2026-06-01T00:00:00Z", consent_signed: true }
              as: FrontDesk
              captures: { pt_id: $.data.id }
            - call: "POST /patch-tests/${pt_id}/revoke"
              payload: {}
              as: StudioManager
          trigger:
            - call: "POST /patch-tests/${pt_id}/revoke"
              payload: {}
              as: StudioManager
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_PATCH_TEST_NOT_VALID"

      - name: spawn_next_from_paused_returns_invalid_schedule_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RecurringFillSchedule.ACTIVE_to_PAUSED
          - "errors[ERR_INVALID_SCHEDULE_STATE]"
        distinguishing_aspect: "spawn-next on a PAUSED schedule returns ERR_INVALID_SCHEDULE_STATE (409) — spawn requires ACTIVE."
        test_recipe:
          setup: ["ACTIVE membership; ACTIVE schedule then PAUSED."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /membership-plans"
              payload: { studio_id: "${studio_id}", tier: "PREMIER", monthly_credit_allotment: 8, monthly_fee_cents: 9900 }
              as: StudioManager
              captures: { plan_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "FILL", name: "Fill", duration_minutes: 60, base_price_cents: 6000, credit_cost: 1, category: "STANDARD", requires_patch_test: false }
              as: StudioManager
              captures: { fill_st_id: $.data.id }
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${member_id}", plan_id: "${plan_id}", cycle_anchor_utc: "2026-01-15T00:00:00Z", initial_credits: 8 }
              as: FrontDesk
              captures: { ms_id: $.data.id, ms_v: $.data.version }
            - call: "POST /recurring-schedules"
              payload: { member_id: "${member_id}", service_type_id: "${fill_st_id}", cadence_days: 14, first_start_utc: "2026-06-15T10:00:00Z" }
              as: FrontDesk
              captures: { sched_id: $.data.id }
            - call: "POST /recurring-schedules/${sched_id}/pause"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /recurring-schedules/${sched_id}/spawn-next"
              payload: { expected_membership_version: "${ms_v}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "RecurringFillSchedule.${sched_id}.status == PAUSED"
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_SCHEDULE_STATE"

      - name: appointment_initial_state_is_booked
        claim_type: Initial State
        grounds:
          - state_machines.Appointment
          - entities.Appointment.fields.status
        distinguishing_aspect: "A freshly created Appointment has status == BOOKED."
        test_recipe:
          setup: ["Sanitized tech + cash FULL_SET service; clock set."]
          setup_api_calls:
            - call: "POST /studios"
              payload: { name: "Glow" }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /service-types"
              payload: { studio_id: "${studio_id}", code: "FULL_SET", name: "Full Set", duration_minutes: 120, base_price_cents: 12000, credit_cost: 4, category: "PREMIUM", requires_patch_test: false }
              as: StudioManager
              captures: { full_st_id: $.data.id }
            - call: "POST /lash-techs"
              payload: { studio_id: "${studio_id}", full_name: "Mara", skill_level: 3, station_number: 1 }
              as: StudioManager
              captures: { tech1_id: $.data.id }
            - call: "POST /sanitation-logs"
              payload: { lash_tech_id: "${tech1_id}", sanitized_at_utc: "2026-06-10T09:00:00Z" }
              as: StudioManager
            - call: "POST /members"
              payload: { studio_id: "${studio_id}", full_name: "Ada", email: "ada@x.com" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T10:00:00Z" }
              as: StudioManager
          trigger:
            - call: "POST /appointments"
