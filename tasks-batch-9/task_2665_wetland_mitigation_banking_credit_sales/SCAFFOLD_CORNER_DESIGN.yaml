      - name: failed_review_cascade_across_five_entities
        claim_type: conditional_cascade
        grounds:
          - state_machines.MonitoringReport.transitions[review_status=SUBMITTED->ACCEPTED]
          - state_machines.ReleaseMilestone.transitions[CLAIMED->DEFERRED]
        excluded_because:
          difficulty_instance: transitive_cascade / failed_year3_review_cascades_five_hops_to_sale_cancellation
          rationale: "The full FAIL-review fan-out (report -> compliance -> remedial action -> milestone deferral -> hold -> sale cancellation) is the subject of the named §1.8 instance, which asserts every hop."

      - name: cleared_remedial_action_restores_deferred_milestone
        claim_type: compensation
        grounds:
          - state_machines.RemedialAction.transitions[REINSPECTION->CLEARED]
          - state_machines.ReleaseMilestone.transitions[DEFERRED->CLAIMED]
        excluded_because:
          difficulty_instance: transitive_cascade / cleared_remedial_action_cascades_three_hops_restoring_availability
          rationale: "The CLEARED cascade (action -> milestone un-deferral -> HOLD_RELEASED -> posture back to OPEN) is asserted hop-by-hop by the named §1.8 instance."

      - name: returned_monitoring_report_keeps_compliance_unevaluated
        claim_type: conditional_cascade
        grounds:
          - state_machines.MonitoringReport.transitions[review_status=SUBMITTED->RETURNED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / monitoring_report_return_leaves_compliance_dimension_unevaluated
          rationale: "The RETURN branch's orthogonal-dimension behaviour (review_status moves, compliance_status stays UNEVALUATED, return_count increments, the window slot is released) is the named §1.8 instance."

      - name: remedial_action_reinspection_loop_reaches_failed
        claim_type: cascade_down
        grounds:
          - state_machines.RemedialAction.transitions[REINSPECTION->OPEN]
          - state_machines.RemedialAction.transitions[REINSPECTION->FAILED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / remedial_action_reinspection_cycle_terminates_at_third_round
          rationale: "The OPEN -> WORK_SUBMITTED -> REINSPECTION -> OPEN cycle and its round-3 termination into FAILED/SUSPENDED are walked by the named §1.8 instance."

      - name: returned_prospectus_resubmission_increments_revision_round
        claim_type: ledger_sync
        grounds:
          - state_machines.Prospectus.transitions[UNDER_REVIEW->REVISION_REQUESTED]
          - entities.Prospectus.fields.revision_round
        excluded_because:
          difficulty_instance: non_linear_state_machine / prospectus_revision_cycle_resets_tallies_then_approves_in_round_two
          rationale: "Revision-round bookkeeping (tallies reset to 0, round-1 votes retained but no longer counted, approval in round 2) is asserted by the named §1.8 instance."

