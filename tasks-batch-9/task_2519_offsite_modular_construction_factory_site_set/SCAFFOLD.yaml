    output: DesignPackage
    side_effects: ["freeze_state = DRAFT", "computes factory_compatibility_score per calculations.design_factory_compatibility_score", "rejects a stale expected_project_version with ERR_STALE_PROJECT_VERSION (412)", "increments Project.version by 1", "version initialised to 1"]

  - method: GET
    path: "/modular/design-packages/{packageId}"
    description: "read one design package with its freeze state and factory compatibility score"
    roles: [ProgramAdmin, DesignEngineer, FactoryProductionManager, StateProgramOfficer, AuthorityHavingJurisdiction]
    code: 200
    input: []
    output: DesignPackage
    side_effects: []

  - method: GET
    path: "/modular/design-packages"
    description: "list design packages of a project, or the packages superseding a given revision"
    roles: [ProgramAdmin, DesignEngineer, FactoryProductionManager, StateProgramOfficer]
    code: 200
    input: ["project_id?", "supersedes_package_id?", "freeze_state?", "connection_detail_state?", "limit?", "offset?"]
    output: DesignPackage[]
    side_effects: []

  - method: POST
    path: "/modular/design-packages/{packageId}/submit"
    description: "submit a design revision for freeze review, recording the submitting engineer"
    roles: [DesignEngineer]
    code: 200
    input: ["module_split_count?", "open_connection_conflicts?", "field_scope_items_open?", "connection_detail_state?", "review_note?"]
    output: DesignPackage
    side_effects: ["freeze_state DRAFT|REVISION_REQUIRED -> IN_REVIEW", "revision_round += 1", "submitted_by_user_id = X-User-ID", "recomputes factory_compatibility_score", "increments DesignPackage.version by 1"]

  - method: POST
    path: "/modular/design-packages/{packageId}/review-decision"
    description: "freeze the design or send it back for revision; a different engineer than the submitter must decide"
    roles: [DesignEngineer]
    code: 200
    input: [decision, "review_note?"]
    output: DesignPackage
    side_effects: ["decision FREEZE: freeze_state IN_REVIEW -> FROZEN, reviewed_by_user_id = X-User-ID, project.phase -> DESIGN_FROZEN", "decision RETURN_FOR_REVISION: freeze_state IN_REVIEW -> REVISION_REQUIRED and submitted_by_user_id cleared", "FREEZE requires factory_compatibility_score >= 70", "on FREEZE, fires the five-link supersession cascade: predecessor FROZEN -> SUPERSEDED, its APPROVED pinning permits -> CONDITIONS_ISSUED, project.permit_posture re-derived, SLOTTED modules reverted to PLANNED, factory.committed_line_minutes released", "increments DesignPackage.version and Project.version by 1"]

  # ---- ModuleUnit ----------------------------------------------------------
  - method: POST
    path: "/modular/modules"
    description: "create a volumetric module against a design package, with shipping envelope dimensions and its position in the set sequence"
    roles: [FactoryProductionManager]
    code: 201
    input: [project_id, design_package_id, module_code, set_sequence_index, width_in, length_in, height_in, gross_weight_lb, "pair_role?", "pair_group_code?", "connection_scope_owner?"]
    output: ModuleUnit
    side_effects: ["classifies envelope_class per calculations.module_envelope_class", "production_status = PLANNED, qc_status = PENDING, site_status = AT_FACTORY", "station_index = 0, wip_earned_cents = 0, exposure_open_hours = 0", "version initialised to 1"]

  - method: GET
    path: "/modular/modules/{moduleId}"
    description: "read one module across all three of its state dimensions plus its line slot, pick window and WIP value"
    roles: [ProgramAdmin, FactoryProductionManager, SiteSuperintendent, ThirdPartyInspector, TransportCoordinator, LenderDrawAdministrator, WarrantyAdjudicator]
    code: 200
    input: []
    output: ModuleUnit
    side_effects: ["refreshes exposure_open_hours against the current logical clock"]

  - method: GET
    path: "/modular/modules"
    description: "list modules filtered by project, design package, shipment or any of the three status dimensions"
    roles: [ProgramAdmin, FactoryProductionManager, SiteSuperintendent, ThirdPartyInspector, TransportCoordinator, LenderDrawAdministrator, WarrantyAdjudicator]
    code: 200
    input: ["project_id?", "design_package_id?", "shipment_id?", "production_status?", "qc_status?", "site_status?", "envelope_class?", "limit?", "offset?"]
    output: ModuleUnit[]
    side_effects: []

  - method: POST
    path: "/modular/modules/{moduleId}/schedule-line-slot"
    description: "claim a takt window on the production line; the achieved takt degrades with how many modules already occupy the line at that instant"
    roles: [FactoryProductionManager]
    code: 200
    input: [line_slot_start]
    output: ModuleUnit
    side_effects: ["production_status PLANNED -> SLOTTED", "computes line_slot_minutes and line_slot_end per calculations.line_slot_schedule", "factory.committed_line_minutes += line_slot_minutes and increments Factory.version by 1", "increments ModuleUnit.version by 1"]

  - method: POST
    path: "/modular/modules/{moduleId}/release-line-slot"
    description: "compensating action — give the takt window back and return the plant capacity ledger to its prior value"
    roles: [FactoryProductionManager]
    code: 200
    input: ["reason?"]
    output: ModuleUnit
    side_effects: ["production_status SLOTTED -> PLANNED", "factory.committed_line_minutes -= line_slot_minutes and increments Factory.version by 1", "clears line_slot_start / line_slot_end and sets line_slot_minutes = 0", "re-derives project.phase", "increments ModuleUnit.version and Project.version by 1"]

  - method: POST
    path: "/modular/modules/{moduleId}/advance-station"
    description: "advance the module along the line, moving its station_index and its work-in-progress value"
    roles: [FactoryProductionManager]
    code: 200
    input: ["stations_advanced?"]
    output: ModuleUnit
    side_effects: ["production_status SLOTTED -> IN_LINE on the first advance; IN_LINE -> IN_LINE while station_index stays below factory.station_count; IN_LINE -> LINE_COMPLETE when it reaches factory.station_count", "recomputes wip_earned_cents per calculations.module_wip_earned_cents (station_progress)", "on LINE_COMPLETE, releases factory.committed_line_minutes and increments Factory.version by 1", "recomputes basis_earned_cents / requested_cents of the project's DRAFT DrawRequests", "re-derives project.phase", "increments ModuleUnit.version and Project.version by 1"]

  - method: POST
    path: "/modular/modules/{moduleId}/schedule-pick"
    description: "plan the crane pick — radius, rigging weight and an exclusive crane window expanded by the project's rigging buffer"
    roles: [SiteSuperintendent]
    code: 200
    input: [pick_window_start, pick_window_end, pick_radius_ft, rigging_weight_lb]
    output: ModuleUnit
    side_effects: ["computes crane_utilization_pct per calculations.crane_pick_feasibility and rejects an infeasible pick", "persists pick_window_start / pick_window_end / pick_radius_ft / rigging_weight_lb", "increments ModuleUnit.version by 1"]

  - method: POST
    path: "/modular/modules/{moduleId}/execute-set"
    description: "set the module on the foundation — re-checks crane feasibility against the current forecast, the dual permit posture, the pinned design revision, weather exposure of already-open modules and the set sequence policy"
    roles: [SiteSuperintendent]
    code: 200
    input: ["set_note?"]
    output: ModuleUnit
    side_effects: ["site_status DELIVERED -> SET", "set_at = current clock instant, exposure_open_hours = 0", "project.modules_set_count += 1 and project.phase -> SETTING", "increments ModuleUnit.version and Project.version by 1"]

  - method: POST
    path: "/modular/modules/{moduleId}/close-connections"
    description: "sign off module-to-module and site-built connections, ending weather exposure and freezing warranty allocation on the module's adjudicated defect claims"
    roles: [SiteSuperintendent]
    code: 200
    input: ["field_scope_signed_off", "connection_scope_owner?", "connected_note?"]
    output: ModuleUnit
    side_effects: ["site_status SET -> CONNECTED", "connected_at = current clock instant and exposure_open_hours frozen at (connected_at - set_at)", "project.modules_connected_count += 1 and project.phase -> CLOSEOUT once every planned module is connected", "every DefectClaim of this module in status ADJUDICATED transitions to CLOSED", "increments ModuleUnit.version, Project.version and each affected DefectClaim.version by 1"]

