        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[settlement-create-stale-farm]', entities.Farm.fields.version, 'errors[ERR_STALE_FARM_VERSION]']
        distinguishing_aspect: "Two sequential settlement creates carrying the same observed Farm.version: the first succeeds and bumps Farm.version; the second (now stale) is rejected ERR_STALE_FARM_VERSION (412)."
        test_recipe:
          setup: ["A farm whose one cycle is fully fulfilled and SETTLED, ready to settle; Farm.version observed just before settling."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
