  - name: err_plan_not_required_returns_422
    claim_type: violation_to_error
    grounds:
    - errors[ERR_PLAN_NOT_REQUIRED]
    - validations[priority=23]
    - calculations.outcome_oe_ratio
    distinguishing_aspect: The review is FINALIZED and the OCC token is fresh, so priorities 6 and 9 both
      pass; the plan is refused because flag_level is NONE (oe_ratio 1.0000) - only WATCH or FLAGGED invites
      a plan.
    test_recipe:
      setup:
      - A FINALIZED review with cohort_size 25 and observed_survivor_count 20 yields expected_survivor_count
        20.0, oe_ratio 1.0000, flag_level NONE and requires_improvement_plan false.
      - rev_v1 was read AFTER finalization, so the quoted review version is current.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /programs
        payload:
          name: Northlake Transplant Center
          center_code: NLT-01
          organ_type: KIDNEY
          cooling_off_days: 7
          follow_up_completeness_threshold_pct: 80
          follow_up_compliance_threshold_pct: 75
          expected_one_year_survival_rate: 0.8
          donor_fund_pool_cents: 5000000
          lost_wage_daily_cap_cents: 30000
          lost_wage_weekly_cap_cents: 150000
        as: ProgramAdmin
        captures:
          prog_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Quality Officer One
          staff_role: QUALITY_OFFICER
          npi: '1000000005'
        as: ProgramAdmin
        captures:
          qo_id: $.data.id
      - call: POST /outcome-reviews
        payload:
          program_id: ${prog_id}
          period_start_on: '2025-01-01'
          period_end_on: '2025-12-31'
          cohort_size: 25
