            - "ServiceAgreement.${agr_id}.reserve_committed_accrual_cents == 2196000"
            - "ServiceAgreement.${agr_id}.reserve_committed_settled_cents == 930000"
            - "ServiceAgreement.${agr_id}.reserve_available_cents == 10004000"
            - "ServiceAgreement.${agr_id}.settlement_variance_cents == -1266000"
            - "ServiceAgreement.${agr_id}.status == ACTIVE"
  - rule_id: combinatorial_formula
    instances:
      - name: bid_evaluated_price_bond_tier_keyed_on_base_not_on_total
        grounds:
          - calculations.bid_evaluated_price
          - entities.Project.fields.base_bid_amount_cents
          - entities.Project.fields.bond_premium_cents
          - entities.Project.fields.contingency_cents
          - entities.Project.fields.evaluated_bid_price_cents
          - validations[priority=54]
        distinguishing_aspect: |
          Mode (c) - circular-looking dependency with a pinned evaluation order. BOND_RATE_TIERS is
          keyed on base_bid_amount_cents (96949116, which sits under the 100000000 tier ceiling and
          therefore draws the 1.25% rate), NOT on the evaluated total it helps produce; had the tier
          been keyed on the evaluated total (100099962 > 100000000) the rate would drop to 1.00%,
          bond_premium_cents would be 969491 and evaluated_bid_price_cents 99857589, so the pinned
          order is falsifiable from the response alone.
        test_recipe:
          setup:
            - "logical clock left at its startup value 2026-08-01T00:00:00.000Z"
            - "single-stage DISINFECTION project: TECH-DIS-A at unit_capex_cents_per_mgd 12000000, one ACCEPTED profile at design_flow_mgd 4.000 / peak_factor 1.500, one ACTIVE ECOLI_CFU_100ML objective"
            - "TreatmentStage DISINFECTION at design_flow_mgd 6.000 with equipment_base_cost_cents 72000000"
            - "EquipmentPackage D-100 APPROVED at design_pressure_psig 110 with code_stamp_required NONE"
            - "one PRE_APPROVED OrEqualSubmittal on the project and Project.delivery_posture ON_TRACK"
          setup_api_calls:
            - call: "POST /water-treatment/material-specs"
              payload: { code: "MAT-316L", max_chloride_ppm: 200.0, max_temp_c: 80.0, max_pressure_psig: 300, ph_min: 4.0, ph_max: 11.0, asme_u_capable: true, nsf61_certified: true, awwa_compliant: true, cost_index: 1.10, service_classes_allowed: ["NEUTRAL", "CHLORINATED", "CAUSTIC"] }
              as: PlatformAdmin
              captures: { mat_316l_id: "$.data.id" }
            - call: "POST /water-treatment/process-technologies"
              payload: { code: "TECH-DIS-A", name: "Closed-vessel UV reactor train", role: "DISINFECTION", max_feed_turbidity_ntu: 50.0, max_feed_tds_mg_l: 3000.0, min_design_flow_mgd: 0.500, max_design_flow_mgd: 20.000, unit_capex_cents_per_mgd: 12000000, energy_kwh_per_mg: 90.0, footprint_sf_per_mgd: 200.0, requires_code_stamp: "NONE", chemical_service_class: "CHLORINATED", consumable_item_code: "UV-LAMP-40", status: "ACTIVE" }
              as: PlatformAdmin
              captures: { tech_dis_id: "$.data.id" }
            - call: "POST /water-treatment/projects"
              payload: { name: "Northgate WTP Membrane Upgrade", owner_agency_name: "City of Northgate", procurement_type: "MUNICIPAL_BID", bid_due_at: "2026-09-15T00:00:00.000Z", guarantee_deadline_at: "2027-06-30T00:00:00.000Z", footprint_allowance_sf_per_stage: 6000.0 }
              as: ContractsAdministrator
              as_user_id: "ca-1"
              captures: { proj_id: "$.data.id" }
            - call: "POST /water-treatment/projects/${proj_id}/influent-profiles"
              payload: { sample_label: "RAW-2026-07", design_flow_mgd: 4.000, peak_factor: 1.500, turbidity_ntu: 12.0, tds_mg_l: 800.0, toc_mg_l: 3.2, chloride_mg_l: 150.0, temperature_c: 22.0, ph: 7.4 }
              as: ApplicationEngineer
              as_user_id: "eng-1"
              captures: { prof_id: "$.data.id" }
            - call: "POST /water-treatment/influent-profiles/${prof_id}/qa-decision"
              payload: { decision: "ACCEPT" }
              as: QualityEngineer
              as_user_id: "qa-1"
            - call: "POST /water-treatment/projects/${proj_id}/treatment-objectives"
              payload: { parameter: "ECOLI_CFU_100ML", limit_value: 1.000, basis: "MONTHLY_AVERAGE", regulatory_driver: "40 CFR 141.63 TCR" }
