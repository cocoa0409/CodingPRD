# §1.9 Scaffold Corner Design — task_2221 Hotel Pre-Opening Program Management
# Walks references/claim-extraction-guide.md against §1.1–§1.7 of SCAFFOLD.yaml.
# All nine guide sections are covered. Corners already carried by §1.8 instances are
# recorded as excluded_because stubs citing the covering difficulty instance by name.

scaffold_corner_design:

  # ============================================================================
  # SECTION 1 — entities
  # ============================================================================
  - section: entities
    instances:
      - name: program_create_applies_declared_defaults_for_omitted_tuning_fields
        claim_type: defaults
        grounds:
          - "§1.1 PreOpeningProgram declares licensing_buffer_days default 14, rework_buffer_days default 3, slip_tolerance_days default 10, stabilization_window_days default 30, schedule_state default PLANNING, commercial_state default BOOKING_CLOSED, readiness_posture default MOBILIZING, readiness_score default 0.0 and all counters default 0; §1.5 POST /pre-opening/programs marks the four tuning fields optional."
        distinguishing_aspect: "The create omits all four optional tuning inputs, so the response must show licensing_buffer_days 14, rework_buffer_days 3, slip_tolerance_days 10 and stabilization_window_days 30 rather than nulls or zeroes."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
          trigger:
            - call: "POST /pre-opening/programs"
              payload:
                property_name: "Cobalt Bay Hotel"
                brand_code: "CBH"
                room_count: 120
                construction_start_date: "2026-09-01"
                target_opening_date: "2027-05-01"
                storage_capacity_pallets: 40
                relocation_rate_cents: 25000
                guarantee_penalty_cents: 150000
                room_night_ceiling: 200
                contingency_liability_cap_cents: 50000000
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
          assert:
            - "response status is 201"
            - "data.licensing_buffer_days == 14"
            - "data.rework_buffer_days == 3"
            - "data.slip_tolerance_days == 10"
            - "data.stabilization_window_days == 30"
            - "data.schedule_state == 'PLANNING'"
            - "data.commercial_state == 'BOOKING_CLOSED'"
            - "data.readiness_posture == 'MOBILIZING'"
            - "data.readiness_score == 0.0"
            - "data.critical_path_milestone_count == 0"
            - "data.issued_mandatory_permit_count == 0"
            - "data.required_system_count == 0"
            - "data.certified_system_count == 0"
            - "data.hiring_plan_count == 0"
            - "data.departments_ready_count == 0"
            - "data.committed_room_nights == 0"
            - "data.contingency_liability_cents == 0"
            - "data.payroll_accrual_cents == 0"
            - "data.schedule_slip_days == 0"
            - "data.projected_opening_date_optimistic == null"
            - "data.projected_opening_date_committed == null"
            - "data.soft_opening_date == null"
            - "data.version == 1"

      - name: program_get_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - "§1.5 GET /pre-opening/programs/{id} returns the PreOpeningProgram row; §1.1 lists property_name, brand_code and room_count as input-sourced fields."
        distinguishing_aspect: "The GET returns the same field values the create response carried, including the system fields id, version 1 and created_at, so the row was persisted and not merely echoed."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload:
                property_name: "Cobalt Bay Hotel"
                brand_code: "CBH"
                room_count: 120
                construction_start_date: "2026-09-01"
                target_opening_date: "2027-05-01"
                storage_capacity_pallets: 40
                relocation_rate_cents: 25000
                guarantee_penalty_cents: 150000
                room_night_ceiling: 200
                contingency_liability_cap_cents: 50000000
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "GET /pre-opening/programs/${prog_id}"
              as: QualityInspector
              as_user_id: "qi-1"
          assert:
            - "response status is 200"
            - "data.id == ${prog_id}"
            - "data.property_name == 'Cobalt Bay Hotel'"
            - "data.brand_code == 'CBH'"
            - "data.room_count == 120"
            - "data.construction_start_date == '2026-09-01'"
            - "data.storage_capacity_pallets == 40"

      - name: milestone_list_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - "§1.0 pagination declares limit default 10 with fields limit/offset/total_count/has_more; §1.5 GET /pre-opening/milestones is a list endpoint with a program_id filter."
        distinguishing_aspect: "With three milestones and limit 2, page one reports total_count 3 and has_more true while page two at offset 2 reports total_count 3 and has_more false — the envelope counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "Three milestones on that program: STRUCTURE_TOPPED_OUT (30 days, planned_start 2026-09-01), MEP_ROUGH_IN (20 days, 2026-10-01) and INTERIOR_FIT_OUT (25 days, 2026-10-21), all NOT_STARTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload:
                property_name: "Cobalt Bay Hotel"
                brand_code: "CBH"
                room_count: 120
                construction_start_date: "2026-09-01"
                target_opening_date: "2027-05-01"
                storage_capacity_pallets: 40
                relocation_rate_cents: 25000
                guarantee_penalty_cents: 150000
                room_night_ceiling: 200
                contingency_liability_cap_cents: 50000000
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "STRUCTURE_TOPPED_OUT", name: "Structure topped out", duration_days: 30, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              as_user_id: "cm-1"
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "MEP_ROUGH_IN", name: "MEP rough-in", duration_days: 20, planned_start_date: "2026-10-01" }
              as: ConstructionManager
              as_user_id: "cm-1"
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "INTERIOR_FIT_OUT", name: "Interior fit-out", duration_days: 25, planned_start_date: "2026-10-21" }
              as: ConstructionManager
              as_user_id: "cm-1"
          trigger:
            - call: "GET /pre-opening/milestones?program_id=${prog_id}&limit=2&offset=0"
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "GET /pre-opening/milestones?program_id=${prog_id}&limit=2&offset=2"
              as: ProgramDirector
              as_user_id: "pd-1"
          assert:
            - "first response status is 200"
            - "first response meta pagination total_count == 3"
            - "first response returns 2 milestone rows"
            - "first response has_more == true"
            - "second response returns 1 milestone row"
            - "second response has_more == false"
            - "second response total_count == 3"

      - name: milestone_get_with_unknown_id_returns_milestone_not_found
        claim_type: not_found
        grounds:
          - "§1.6 declares ERR_MILESTONE_NOT_FOUND (404); §1.4 priority 4 existence checks resolve path ids before any business rule."
        distinguishing_aspect: "The unresolvable id yields the entity-specific ERR_MILESTONE_NOT_FOUND at 404, not a generic 404 body and not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
          trigger:
            - call: "GET /pre-opening/milestones/99999999-9999-4999-8999-999999999999"
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { err_nf: "$.data.error_id" }
          assert:
            - "response status is 404"
            - "data.error_id == 'ERR_MILESTONE_NOT_FOUND'"

      - name: milestone_create_without_duration_days_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "§1.1 Milestone.duration_days is source input with no default; §1.4 priority 3 raises ERR_INVALID_REQUEST for missing required inputs, before the priority 4 existence check."
        distinguishing_aspect: "duration_days has source input with no declared default, so omitting it is ERR_INVALID_REQUEST at 400 and no Milestone row is written."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload:
                property_name: "Cobalt Bay Hotel"
                brand_code: "CBH"
                room_count: 120
                construction_start_date: "2026-09-01"
                target_opening_date: "2027-05-01"
                storage_capacity_pallets: 40
                relocation_rate_cents: 25000
                guarantee_penalty_cents: 150000
                room_night_ceiling: 200
                contingency_liability_cap_cents: 50000000
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "STRUCTURE_TOPPED_OUT", name: "Structure topped out", planned_start_date: "2026-09-01" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { err_req: "$.data.error_id" }
          assert:
            - "response status is 400"
            - "data.error_id == 'ERR_INVALID_REQUEST'"

      - name: permit_application_with_unknown_permit_type_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "§1.1 PermitApplication.permit_type is an enum limited to CERTIFICATE_OF_OCCUPANCY, LIQUOR_LICENSE, FOOD_SERVICE, ELEVATOR, FIRE_ALARM and SIGNAGE; §1.4 priority 3 rejects out-of-enum values with ERR_INVALID_REQUEST."
        distinguishing_aspect: "A permit_type outside the six declared enum members fails enum closure at 400 before any §1.4 business rule about the gating milestone is consulted."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "One milestone STRUCTURE_TOPPED_OUT (30 days, planned_start 2026-09-01) in state NOT_STARTED, usable as gating_milestone_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload:
                property_name: "Cobalt Bay Hotel"
                brand_code: "CBH"
                room_count: 120
                construction_start_date: "2026-09-01"
                target_opening_date: "2027-05-01"
                storage_capacity_pallets: 40
                relocation_rate_cents: 25000
                guarantee_penalty_cents: 150000
                room_night_ceiling: 200
                contingency_liability_cap_cents: 50000000
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "STRUCTURE_TOPPED_OUT", name: "Structure topped out", duration_days: 30, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_a: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/permit-applications"
              payload: { program_id: "${prog_id}", gating_milestone_id: "${ms_a}", permit_type: "POOL_PERMIT", review_days: 21 }
              as: LicensingCoordinator
              as_user_id: "lc-1"
              captures: { err_enum: "$.data.error_id" }
          assert:
            - "response status is 400"
            - "data.error_id == 'ERR_INVALID_REQUEST'"

      - name: milestone_dependency_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - "§1.1 MilestoneDependency sets common_fields false, so it has no version and no updated_at; §1.5 exposes only POST /pre-opening/milestone-dependencies and GET /pre-opening/milestones/{id}/dependencies — no update or delete route."
        distinguishing_aspect: "MilestoneDependency is declared common_fields false, so its create response carries id and created_at but no version and no updated_at, and §1.5 exposes no update or delete endpoint for it."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "Two milestones STRUCTURE_TOPPED_OUT (30 days) and MEP_ROUGH_IN (20 days), both NOT_STARTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload:
                property_name: "Cobalt Bay Hotel"
                brand_code: "CBH"
                room_count: 120
                construction_start_date: "2026-09-01"
                target_opening_date: "2027-05-01"
                storage_capacity_pallets: 40
                relocation_rate_cents: 25000
                guarantee_penalty_cents: 150000
                room_night_ceiling: 200
                contingency_liability_cap_cents: 50000000
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "STRUCTURE_TOPPED_OUT", name: "Structure topped out", duration_days: 30, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_a: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "MEP_ROUGH_IN", name: "MEP rough-in", duration_days: 20, planned_start_date: "2026-10-01" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_b: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/milestone-dependencies"
              payload: { predecessor_milestone_id: "${ms_a}", successor_milestone_id: "${ms_b}", dependency_type: "FINISH_START", lag_days: 0 }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { dep_ab: "$.data.id" }
          assert:
            - "response status is 201"
            - "data.predecessor_milestone_id == ${ms_a}"
            - "data.successor_milestone_id == ${ms_b}"
            - "data.dependency_type == 'FINISH_START'"
            - "data.lag_days == 0"
            - "data does not contain the key version"
            - "data does not contain the key updated_at"

      - name: hire_create_under_unknown_hiring_plan_returns_hiring_plan_not_found
        claim_type: parent_relationships
        grounds:
          - "§1.1 Hire declares parent DepartmentHiringPlan; §1.6 declares ERR_HIRING_PLAN_NOT_FOUND (404); §1.4 priority 4 resolves the parent reference before any priority 7 state check."
        distinguishing_aspect: "The parent FK is resolved before the wave-date and headcount rules, so an unknown hiring_plan_id returns ERR_HIRING_PLAN_NOT_FOUND at 404 even though the rest of the payload is valid."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
          trigger:
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "99999999-9999-4999-8999-999999999999", full_name: "R. Alvarez", hourly_rate_cents: 2500, scheduled_hours_per_day: 8, start_date: "2026-09-15" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { err_plan: "$.data.error_id" }
          assert:
            - "response status is 404"
            - "data.error_id == 'ERR_HIRING_PLAN_NOT_FOUND'"

      - name: punch_item_blocks_certificate_of_occupancy_derived_from_severity
        claim_type: computed_fields
        grounds:
          - "§1.1 PunchListItem.blocks_certificate_of_occupancy is source computed as severity == CRITICAL AND state != VERIFIED, so a MAJOR item is false and a CRITICAL item is true regardless of any client-supplied value."
        distinguishing_aspect: "blocks_certificate_of_occupancy is computed as severity CRITICAL AND state != VERIFIED, so a CRITICAL item reads true while a MAJOR item on the same milestone reads false, and a client-supplied value could not have produced the pair."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "One milestone STRUCTURE_TOPPED_OUT (30 days) in state NOT_STARTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload:
                property_name: "Cobalt Bay Hotel"
                brand_code: "CBH"
                room_count: 120
                construction_start_date: "2026-09-01"
                target_opening_date: "2027-05-01"
                storage_capacity_pallets: 40
                relocation_rate_cents: 25000
                guarantee_penalty_cents: 150000
                room_night_ceiling: 200
                contingency_liability_cap_cents: 50000000
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "STRUCTURE_TOPPED_OUT", name: "Structure topped out", duration_days: 30, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_a: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/punch-list-items"
              payload: { program_id: "${prog_id}", milestone_id: "${ms_a}", description: "Corridor paint touch-up", severity: "MAJOR" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { punch_major: "$.data.id" }
            - call: "POST /pre-opening/punch-list-items"
              payload: { program_id: "${prog_id}", milestone_id: "${ms_a}", description: "Stair pressurization fan inoperative", severity: "CRITICAL" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { punch_critical: "$.data.id" }
          assert:
            - "first response status is 201"
            - "first response data.state == 'OPEN'"
            - "first response data.rejection_count == 0"
            - "first response data.blocks_certificate_of_occupancy == false"
            - "second response data.severity == 'CRITICAL'"
            - "second response data.blocks_certificate_of_occupancy == true"

      - name: budget_line_response_carries_system_generated_id_and_version
        claim_type: system_fields
        grounds:
          - "§1.1 BudgetLine inherits the §1.0 common fields id, created_at, updated_at and version, all source system; §1.5 POST /pre-opening/budget-lines accepts no id in its input list so any client-supplied id is ignored."
        distinguishing_aspect: "id, created_at, updated_at and version are system fields: the create response mints them, version starts at 1, and the derived committed_cents, spent_cents and available_cents are seeded from authorized_cents rather than from the request."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload:
                property_name: "Cobalt Bay Hotel"
                brand_code: "CBH"
                room_count: 120
                construction_start_date: "2026-09-01"
                target_opening_date: "2027-05-01"
                storage_capacity_pallets: 40
                relocation_rate_cents: 25000
                guarantee_penalty_cents: 150000
                room_night_ceiling: 200
                contingency_liability_cap_cents: 50000000
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/budget-lines"
              payload: { program_id: "${prog_id}", category: "SETUP", authorized_cents: 1000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { bl_id: "$.data.id" }
          assert:
            - "response status is 201"
            - "data.id is a system-generated identifier and is present"
            - "data.created_at is present"
            - "data.updated_at is present"
            - "data.version == 1"
            - "data.authorized_cents == 1000000"
            - "data.committed_cents == 0"
            - "data.spent_cents == 0"
            - "data.available_cents == 1000000"

      - name: milestone_dependency_junction_links_two_milestones_and_is_readable_from_both_sides
        claim_type: graph
        grounds:
          - "§1.0 complexity_profile.entity_topology is graph and MilestoneDependency is the junction entity; §1.5 GET /pre-opening/milestones/{id}/dependencies accepts a role filter so the same edge is visible from the predecessor and from the successor."
        distinguishing_aspect: "The junction row is reachable from either endpoint of the edge: the predecessor lists it with role PREDECESSOR and the successor with role SUCCESSOR, which is what entity_topology graph requires of a many-to-many link."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "Two milestones STRUCTURE_TOPPED_OUT (20 days) and MEP_ROUGH_IN (20 days) joined by one FINISH_START dependency with lag_days 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload:
                property_name: "Cobalt Bay Hotel"
                brand_code: "CBH"
                room_count: 120
                construction_start_date: "2026-09-01"
                target_opening_date: "2027-05-01"
                storage_capacity_pallets: 40
                relocation_rate_cents: 25000
                guarantee_penalty_cents: 150000
                room_night_ceiling: 200
                contingency_liability_cap_cents: 50000000
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "STRUCTURE_TOPPED_OUT", name: "Structure topped out", duration_days: 30, planned_start_date: "2026-09-01" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_a: "$.data.id" }
            - call: "POST /pre-opening/milestones"
              payload: { program_id: "${prog_id}", code: "MEP_ROUGH_IN", name: "MEP rough-in", duration_days: 20, planned_start_date: "2026-10-01" }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { ms_b: "$.data.id" }
            - call: "POST /pre-opening/milestone-dependencies"
              payload: { predecessor_milestone_id: "${ms_a}", successor_milestone_id: "${ms_b}", dependency_type: "FINISH_START", lag_days: 2 }
              as: ConstructionManager
              as_user_id: "cm-1"
              captures: { dep_ab: "$.data.id" }
          trigger:
            - call: "GET /pre-opening/milestones/${ms_a}/dependencies?role=PREDECESSOR"
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "GET /pre-opening/milestones/${ms_b}/dependencies?role=SUCCESSOR"
              as: ProgramDirector
              as_user_id: "pd-1"
          assert:
            - "first response status is 200"
            - "first response returns 1 dependency row whose id == ${dep_ab}"
            - "first response row successor_milestone_id == ${ms_b}"
            - "second response status is 200"
            - "second response returns 1 dependency row whose id == ${dep_ab}"
            - "second response row predecessor_milestone_id == ${ms_a}"
            - "second response row lag_days == 2"

