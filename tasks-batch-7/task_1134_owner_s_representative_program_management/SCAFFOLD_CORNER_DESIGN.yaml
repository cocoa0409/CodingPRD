            - { call: "POST /baselines/${bl}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "GET /programs/${prog}", payload: {}, as: OwnerRepPM, as_user_id: "pm-1", captures: { pv2: $.data.version } }
            - { call: "POST /baselines/${bl}/decide", payload: { decision: "APPROVE", expected_program_version: "${pv2}" }, as: Owner, as_user_id: "owner-1" }
            - { call: "POST /programs/${prog}/activate", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts", payload: { program_id: "${prog}", vendor_name: "V1", contract_type: "CONTRACTOR", solicitation_estimate_cents: 400000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { ct1: $.data.id } }
            - { call: "POST /contracts/${ct1}/begin-negotiation", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
            - { call: "POST /contracts/${ct1}/execute", payload: { awarded_amount_cents: 400000 }, as: OwnerRepExecutive, as_user_id: "exec-1" }
            - { call: "POST /change-orders", payload: { contract_id: "${ct1}", title: "CO-A", reason: "r", amount_cents: 50000 }, as: OwnerRepPM, as_user_id: "pm-1", captures: { coa: $.data.id } }
            - { call: "POST /change-orders/${coa}/submit", payload: {}, as: OwnerRepPM, as_user_id: "pm-1" }
