        captures:
          tf_loc_id: $.data.id
      - call: POST /interconnection/tariff-filings/${tf_loc_id}/approve
        payload: {}
        as: RegulatoryAffairsSpecialist
      - call: POST /interconnection/traffic-factor-filings
        payload:
          carrier_id: ${car_id}
          expected_carrier_version: ${car_v0}
          quarter: 2026Q3
          reported_piu_pct: 50.00
          reported_plu_pct: 10.00
        as: AccessBillingAnalyst
        captures:
