              as: GiftAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response data.error_id == ERR_INSTALLMENT_FREQUENCY_MISMATCH"

      - name: household_primary_not_member_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=17]", "errors[ERR_PRIMARY_NOT_MEMBER]"]
        distinguishing_aspect: "PATCH /households/{id} setting primary_donor_id to a donor whose household_id != this household returns ERR_PRIMARY_NOT_MEMBER (422)."
