          - validations.priority_62
        distinguishing_aspect: |
          Two cycles whose oven windows are IDENTICAL to the second coexist on
          arm 1 and arm 2 of the same station (the DIFFERENT_ARM_SAME_STATION
          variant ignores the changeover buffer entirely), while a third cycle
          with that same window on arm 1 is refused 409 ERR_OVEN_WINDOW_CONFLICT
          — and the refusal comes from priority 62, before the mould pool at
          priority 70 and before the build quota at priority 79, both of which
          would also have failed.
        test_recipe:
          setup:
            - "Two moulds MLD-CD-1 and MLD-CD-2 for PM-CD-KM, each cavity_count 2 and cycles_since_service 0, so two cycles can run concurrently."
            - "OvenStation OVN-CD-1 has arm_count 2 and changeover_buffer_min 15; CoolingBay BAY-CD-1 has concurrent_slot_capacity 2."
            - "ProductionOrder PO-CD-4 (ordered_qty 4) is released, and cycles CYC-A on arm 1 and CYC-B on arm 2 both occupy exactly 2026-08-01T09:00:00Z to 10:00:00Z with 30 minutes of cooling."
