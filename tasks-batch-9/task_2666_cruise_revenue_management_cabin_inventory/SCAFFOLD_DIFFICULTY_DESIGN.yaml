            - "Base lower fares are 145000 on RAL-A, 144995 on RAL-B and 144000 on RAL-C."
            - "Each sailing takes one OPTION booking of 2 adults, so gross ticket revenue is 290000 / 289990 / 288000 and projected onboard revenue is 110000 on all three."
