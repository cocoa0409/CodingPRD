  - section: cross_cutting_layers
    instances:
      - name: occ_booking_patch_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-patch-stale-version]", "errors[ERR_STALE_BOOKING_VERSION]"]
        distinguishing_aspect: "Stale-version OCC on PATCH: a client holding version 1 patches successfully (version -> 2); a second PATCH still carrying expected_booking_version 1 is rejected 412 ERR_STALE_BOOKING_VERSION; retrying with 2 succeeds (version -> 3)."
        test_recipe:
          setup: ["booking B (SCHEDULED) at version 1"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-OC1", full_name: "Pat Oc1", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Oc1", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-OC1", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-03T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id, bv1: $.data.version } }
          trigger:
            - { call: "PATCH /endoscopy/bookings/${b1}", payload: { expected_booking_version: "${bv1}", notes: "first" }, as: SchedulingCoordinator, captures: { bv2: $.data.version } }
            - { call: "PATCH /endoscopy/bookings/${b1}", payload: { expected_booking_version: "${bv1}", notes: "stale" }, as: SchedulingCoordinator, captures: { err: $.data.error_id } }
            - { call: "PATCH /endoscopy/bookings/${b1}", payload: { expected_booking_version: "${bv2}", notes: "fresh" }, as: SchedulingCoordinator, captures: { bv3: $.data.version, b_notes: $.data.notes } }
          assert:
            - "First PATCH: version == 2"
            - "Second PATCH with stale version 1: error_id == ERR_STALE_BOOKING_VERSION (412); notes still 'first'"
            - "Third PATCH with current version 2: succeeds, version == 3, notes == 'fresh'"
      - name: occ_reschedule_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[booking-reschedule-stale-version]", "errors[ERR_STALE_BOOKING_VERSION]"]
        distinguishing_aspect: "Stale-version OCC on reschedule: after an unrelated notes PATCH bumps the booking to version 2, a reschedule carrying expected_booking_version 1 is rejected 412 even though the booking is still SCHEDULED (the state machine alone would have allowed it)."
        test_recipe:
          setup: ["booking B (SCHEDULED, version 1), then a notes PATCH advances it to version 2"]
          setup_api_calls:
            - { call: "POST /endoscopy/patients", payload: { mrn: "MRN-OC2", full_name: "Pat Oc2", date_of_birth: "1990-05-05" }, as: SchedulingCoordinator, captures: { p1: $.data.id } }
            - { call: "POST /endoscopy/providers", payload: { full_name: "Dr Oc2", specialty: "GASTROENTEROLOGY" }, as: UnitAdmin, captures: { dr1: $.data.id } }
            - { call: "POST /endoscopy/procedure-types", payload: { code: "COLONO", display_name: "Colonoscopy", base_duration_minutes: 40, prep_protocol: "SPLIT_DOSE", colonoscopy_family: true, adr_relevant: true, required_scope_type: "COLONOSCOPE" }, as: UnitAdmin, captures: { t_col: $.data.id } }
            - { call: "POST /endoscopy/rooms", payload: { name: "R-OC2", room_class: "STANDARD", supports_anesthesia: true }, as: UnitAdmin, captures: { r1: $.data.id } }
            - { call: "POST /endoscopy/bookings", payload: { patient_id: "${p1}", provider_id: "${dr1}", procedure_type_id: "${t_col}", room_id: "${r1}", scheduled_start: "2026-08-03T09:00:00Z", indication: "SCREENING", anesthesia_type: "NONE" }, as: SchedulingCoordinator, captures: { b1: $.data.id, bv1: $.data.version } }
            - { call: "PATCH /endoscopy/bookings/${b1}", payload: { expected_booking_version: "${bv1}", notes: "bump" }, as: SchedulingCoordinator }
          trigger:
            - { call: "POST /endoscopy/bookings/${b1}/reschedule", payload: { expected_booking_version: "${bv1}", new_scheduled_start: "2026-08-05T09:00:00Z" }, as: SchedulingCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_STALE_BOOKING_VERSION (412) — the booking is still SCHEDULED, so only the OCC precondition rejects"
            - "No replacement booking created: GET /endoscopy/bookings?rescheduled_from_id=${b1} returns []"
      - name: occ_quarantine_release_stale_version_rejected
