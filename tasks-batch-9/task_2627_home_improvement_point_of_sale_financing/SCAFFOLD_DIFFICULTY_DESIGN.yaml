            - "COMPENSATED — MERCHANT SIDE: after trigger step 3, Merchant.${merch_id}.funded_volume_cents == 0, holdback_reserve_cents == 0, holdback_target_cents == 0 (the REVERSED draw leaves the trailing-180 window) and reserve_coverage_bps == 10000 through the zero-target guard"
            - "COMPENSATED — LOAN SIDE: LoanAccount.${loan_id}.principal_balance_cents == 0, total_funded_cents == 0, accrued_deferred_interest_cents == 0, promo_payoff_cents == 0, standard_payoff_cents == 0, first_funding_on == null"
            - "COMPENSATED — PROJECT SIDE: Project.${proj_id}.settled_funded_cents == 0, funded_pct_bps == 0, completion_status == IN_PROGRESS"
            - "COMPENSATED — MILESTONE SIDE: ProjectMilestone.${ms1_id}.is_funded == false and status is still VERIFIED, so Project.${proj_id}.verified_release_bps == 3000 and max_fundable_now_cents == 1050000, exactly the pre-draw headroom"
            - "NO DRIFT: every restored figure equals the pre-draw snapshot literal, even though the settlement wrote two independently rounded amounts (47145 and 42000)"
            - "NOT CONSERVED (by design): LoanAccount.${loan_id}.version == 3 (1 at origination, 2 at settlement, 3 at reversal) and Merchant.${merch_id}.version == 5 (3 at approval, 4 at settlement, 5 at reversal)"
            - "NOT CONSERVED (by design): FundingDraw.${draw_id}.status == REVERSED with reversal_reason_code == MERCHANT_BILLING_ERROR, settled_on retained as 2026-08-01, and funded_amount_cents still 1050000 — the row keeps its history"
            - "the milestone is re-drawable: a fresh POST /funding-draws against ${ms1_id} for 1050000 would pass priority 18 and priority 50 again"

      - name: chargeback_waterfall_conserves_the_claim_across_three_buckets
        grounds:
          - calculations.chargeback_allocation_waterfall
          - state_machines.DisputeCase.MERCHANT_RESPONSE_PENDING_to_RESOLVED_CONSUMER_FAVOR
          - entities.DisputeCase.fields.chargeback_absorbed_from_reserve_cents
          - entities.Merchant.fields.settlement_offset_receivable_cents
          - entities.Merchant.fields.program_write_off_cents
          - endpoints.POST_/dispute-cases/{id}/resolution
        distinguishing_aspect: |
          CONSERVED QUANTITY: the CHARGEBACK CLAIM PARTITION —
          absorbed + receivable + write_off must equal chargeback_amount_cents exactly, and
          the same total must appear as the signed sum of the three merchant-side ledger
          movements (-96002 reserve, +1200025 receivable, +1104023 write-off). This is a
          partition invariant, not a restoration invariant: unlike the reversal instance the
          funding ledger is deliberately NOT unwound — Merchant.funded_volume_cents and
          holdback_target_cents both stay put while the claim is redistributed, and the only
          rounding in the whole waterfall is the receivable cap.
        test_recipe:
          setup:
            - "Program, APPROVED merchant (version 3), ACTIVE enrollment (negotiated 449 bps), ACTIVATED application, PROMO_ACTIVE LoanAccount."
            - "Project 3500000 with milestones 1 (3000 bps) and 2 (4000 bps)."
            - "Draw 1 of 1000050 NEXT_DAY settled by sa-1 (withheld 40002), then milestone 2 verified, then draw 2 of 1400000 STANDARD_3DAY settled by sa-1 (withheld 56000)."
            - "State before resolution: holdback_reserve 96002, holdback_target 96002, reserve_coverage 10000, funded_volume 2400050, settled_funded 2400050, principal 2400050, settlement_offset_receivable 0, program_write_off 0."
            - "The Consumer files a dispute claiming the whole 2400050 — exactly Project.settled_funded_cents, so the priority-53 gate passes on its inclusive boundary."
            - "The case is resolved by sa-2, not sa-1, because sa-1 is released_by_user_id on both SETTLED draws (priority 11 segregation of duties)."
            - "Everything happens on 2026-08-01, so the trailing-180 window holds both draws and the receivable cap is sized on 2400050."
          setup_api_calls:
            - call: "POST /trade-rules"
              payload: { trade_type: "ROOFING", max_ticket_cents: 5000000, holdback_pct_bps: 500, max_precompletion_release_bps: 7000, velocity_cap_cents: 15000000, requires_completion_certificate: true, min_license_months: 6 }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /promotion-plans"
              payload: { code: "DI12-ROOF", promotion_type: "DEFERRED_INTEREST", promo_term_months: 12, deferred_apr_bps: 2699, post_promo_apr_bps: 2699, merchant_discount_bps: 525, min_ticket_cents: 100000, max_ticket_cents: 5000000, disclosure_template_version: "DI-2026.2", allowed_trade_types: ["ROOFING", "GENERAL_REMODEL"] }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { plan_id: "$.data.id" }
            - call: "POST /merchants"
              payload: { legal_name: "Summit Roofing LLC", trade_type: "ROOFING", state_code: "TX", contact_email: "ops@summitroof.example" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { merch_id: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses"
              payload: { trade_type: "ROOFING", license_number: "TX-RCF-88120", state_code: "TX", effective_from: "2026-01-01", expires_on: "2027-06-30" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { lic_id: "$.data.id" }
            - call: "POST /merchants/${merch_id}/licenses/${lic_id}/verification"
              payload: { outcome: "VERIFIED", verification_note: "State board record matched" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/enrollment-submission"
              payload: { attestation_ref: "ATT-2026-0801" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /merchants/${merch_id}/enrollment-decision"
              payload: { decision: "APPROVE", decision_note: "Licence verified" }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
            - call: "POST /merchants/${merch_id}/promotion-enrollments"
              payload: { promotion_plan_id: "${plan_id}", window_start_date: "2026-08-01", window_end_date: "2026-12-31", negotiated_discount_bps: 449 }
              as: ProgramUnderwriter
              as_user_id: "uw-1"
              captures: { enr_id: "$.data.id" }
            - call: "POST /consumers"
              payload: { full_name: "Dana Ruiz", ssn_last4: "4417", annual_income_cents: 9600000, fico_score: 742, state_code: "TX" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { cons_id: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { merchant_id: "${merch_id}", consumer_id: "${cons_id}", promotion_plan_id: "${plan_id}", project_amount_cents: 3500000 }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { app_id: "$.data.id" }
            - call: "POST /credit-applications/${app_id}/disclosure-delivery"
              payload: { disclosure_template_version: "DI-2026.2" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /credit-applications/${app_id}/disclosure-acknowledgement"
              payload: { consumer_signature_ref: "SIG-DANA-1" }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /credit-applications/${app_id}/acceptance"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "GET /loan-accounts?application_id=${app_id}"
              as: ServicingAgent
              as_user_id: "sa-1"
              captures: { loan_id: "$.data[0].id" }
            - call: "POST /projects"
              payload: { application_id: "${app_id}", scope_description: "Full roof replacement, 32 squares", contract_amount_cents: 3500000 }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { proj_id: "$.data.id" }
            - call: "POST /projects/${proj_id}/milestones"
              payload: { sequence_no: 1, name: "Tear-off and deck inspection", release_pct_bps: 3000, requires_consumer_signoff: true }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { ms1_id: "$.data.id" }
            - call: "POST /projects/${proj_id}/milestones"
              payload: { sequence_no: 2, name: "Shingle installation", release_pct_bps: 4000, requires_consumer_signoff: true }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { ms2_id: "$.data.id" }
            - call: "POST /projects/${proj_id}/milestones/${ms1_id}/claim"
              payload: { evidence_ref: "PHOTO-TEAROFF-1" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /projects/${proj_id}/milestones/${ms1_id}/verification"
              payload: { outcome: "VERIFY" }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "GET /loan-accounts/${loan_id}"
              as: ServicingAgent
              as_user_id: "sa-1"
              captures: { loan_v1: "$.data.version" }
            - call: "POST /funding-draws"
              payload: { loan_account_id: "${loan_id}", project_milestone_id: "${ms1_id}", requested_amount_cents: 1000050, settlement_speed: "NEXT_DAY", expected_loan_account_version: "${loan_v1}" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { draw1_id: "$.data.id" }
            - call: "POST /funding-draws/${draw1_id}/settlement"
              payload: { decision: "SETTLE" }
              as: ServicingAgent
              as_user_id: "sa-1"
            - call: "POST /projects/${proj_id}/milestones/${ms2_id}/claim"
              payload: { evidence_ref: "PHOTO-SHINGLE-1" }
              as: Merchant
              as_user_id: "${merch_id}"
            - call: "POST /projects/${proj_id}/milestones/${ms2_id}/verification"
              payload: { outcome: "VERIFY" }
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "GET /loan-accounts/${loan_id}"
              as: ServicingAgent
              as_user_id: "sa-1"
              captures: { loan_v2: "$.data.version" }
            - call: "POST /funding-draws"
              payload: { loan_account_id: "${loan_id}", project_milestone_id: "${ms2_id}", requested_amount_cents: 1400000, settlement_speed: "STANDARD_3DAY", expected_loan_account_version: "${loan_v2}" }
              as: Merchant
              as_user_id: "${merch_id}"
              captures: { draw2_id: "$.data.id" }
            - call: "POST /funding-draws/${draw2_id}/settlement"
              payload: { decision: "SETTLE" }
              as: ServicingAgent
              as_user_id: "sa-1"
            - call: "POST /dispute-cases"
              payload: { loan_account_id: "${loan_id}", project_id: "${proj_id}", claimed_incomplete_amount_cents: 2400050, description: "Roof left open, gutters never installed" }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { case_id: "$.data.id" }
            - call: "GET /merchants/${merch_id}"
              as: ServicingAgent
              as_user_id: "sa-2"
              captures: { merch_v: "$.data.version" }
          trigger:
            - call: "POST /dispute-cases/${case_id}/resolution"
              payload: { outcome: "CONSUMER_FAVOR", expected_merchant_version: "${merch_v}" }
              as: ServicingAgent
              as_user_id: "sa-2"
            - call: "GET /merchants/${merch_id}"
              as: ServicingAgent
              as_user_id: "sa-2"
            - call: "GET /loan-accounts/${loan_id}"
              as: ServicingAgent
              as_user_id: "sa-2"
            - call: "GET /projects/${proj_id}"
              as: ServicingAgent
              as_user_id: "sa-2"
            - call: "GET /merchants/${merch_id}/promotion-enrollments"
              as: ServicingAgent
              as_user_id: "sa-2"
            - call: "GET /funding-draws?merchant_id=${merch_id}"
              as: ServicingAgent
              as_user_id: "sa-2"
          assert:
            - "PRE-RESOLUTION: ${merch_v} == 5 (1 registration, 2 submission, 3 approval, 4 draw-1 settlement, 5 draw-2 settlement); opening the dispute did not increment Merchant.version"
            - "PRE-RESOLUTION: DisputeCase.${case_id}.status == MERCHANT_RESPONSE_PENDING, opened_on == 2026-08-01, response_due_at == 2026-08-11T00:00:00Z, chargeback_amount_cents == 0"
            - "BUCKET 1: DisputeCase.${case_id}.chargeback_absorbed_from_reserve_cents == 96002 == min(2400050, 96002) — the reserve fills first and exactly"
            - "BUCKET 2: DisputeCase.${case_id}.chargeback_receivable_cents == 1200025 == min(2304048, round_half_up(2400050 * 5000 / 10000))"
            - "BUCKET 3: DisputeCase.${case_id}.chargeback_write_off_cents == 1104023 == 2304048 - 1200025"
            - "PARTITION CONSERVED: 96002 + 1200025 + 1104023 == 2400050 == DisputeCase.${case_id}.chargeback_amount_cents, with no rounding slack anywhere in the sum"
            - "LEDGER MIRRORS THE PARTITION: Merchant.${merch_id}.holdback_reserve_cents == 0 (was 96002), settlement_offset_receivable_cents == 1200025 (was 0), program_write_off_cents == 1104023 (was 0), so -96002 + 1200025 + 1104023 == 2400050"
            - "NOT RESTORED (the contrast with the reversal instance): Merchant.${merch_id}.funded_volume_cents is still 2400050 and holdback_target_cents is still 96002 — coverage is recomputed against the UNCHANGED target"
            - "NOT RESTORED: trigger step 6 shows both draws still status == SETTLED with holdback_withheld_cents 40002 and 56000; a consumer-favor resolution never reverses draws, which would debit the same advance twice"
            - "LOAN SIDE: LoanAccount.${loan_id}.principal_balance_cents == 0 (2400050 - 2400050), balance_status is still CURRENT (only a Payment can reach PAID_OFF) and promo_status is still PROMO_ACTIVE"
            - "CASCADE hop 3: Merchant.${merch_id}.reserve_coverage_bps == 0 == round_half_up(0 * 10000 / 96002), which is below RESERVE_SUSPENSION_BPS 5000, so enrollment_status == SUSPENDED with suspension_reason_code == RESERVE_COVERAGE"
            - "CASCADE hop 4: trigger step 5 shows MerchantPromotionEnrollment.${enr_id}.status == SUSPENDED"
            - "PROJECT SIDE: Project.${proj_id}.completion_status == ABANDONED, disputed_amount_cents == 0 (the case is terminal), settled_funded_cents == 2400050, funded_pct_bps == 6857, max_fundable_now_cents == 0"
            - "SCORECARD: Merchant.${merch_id}.dispute_rate_bps == 10000, portfolio_grade == D, termination_recommended == true, risk_tier == STANDARD (2 SETTLED draws < MIN_SEASONED_DRAWS 5)"
            - "DisputeCase.${case_id}.status == RESOLVED_CONSUMER_FAVOR, resolved_by_user_id == sa-2, resolved_on == 2026-08-01; Merchant.${merch_id}.version == 6 and LoanAccount.${loan_id}.version == 4"
