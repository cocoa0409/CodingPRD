            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", vendor_id: "${vendor_id}", sku_code: "DRSS-I3", color_code: "CORAL", lifecycle_stage: "NEW", unit_cost_cents: 2500, retail_price_cents: 7500 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_i3: $.data.id }
            - call: "POST /otb/assortment-items"
              payload: { option_plan_id: "${op1_id}", vendor_id: "${vendor_id}", sku_code: "DRSS-I4", color_code: "OLIVE", lifecycle_stage: "CARRYOVER", unit_cost_cents: 2500, retail_price_cents: 6900, prior_season_sell_through_bps: 6800 }
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { item_i4: $.data.id }
          trigger:
            - call: "POST /otb/assortment-items/${item_i1}/adopt"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
            - call: "POST /otb/assortment-items/${item_i2}/adopt"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
            - call: "POST /otb/assortment-items/${item_i3}/adopt"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
            - call: "POST /otb/assortment-items/${item_i3}/adopt"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
              captures: { repeat_adopt_error: $.data.error_id }
            - call: "POST /otb/assortment-items/${item_i1}/close"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
            - call: "POST /otb/assortment-items/${item_i4}/adopt"
              payload: {}
              as: CategoryBuyer
              as_user_id: "buyer-1"
          assert:
            - "state 0, at slotting: OptionPlan.${op1_id}.option_slots_total == 14, option_slots_assigned == 0, option_slots_open == 14, so 0 + 14 == 14; creating four AssortmentItems changed none of these three numbers - creation does not reserve a slot, only adoption does"
            - "state 1, after adopting I1: option_slots_assigned == 1 and option_slots_open == 13, sum 14; AssortmentItem.${item_i1}.status == ADOPTED with planned_units == 276 and sell_through_bps == 7455 (CARRYOVER_BASIS: 7100 * 10500 / 10000)"
            - "state 2, after adopting I2: option_slots_assigned == 2 and option_slots_open == 12, sum 14; AssortmentItem.${item_i2}.sell_through_bps == 6300 (CARRYOVER_BASIS: 6000 * 10500 / 10000)"
            - "state 3, after adopting I3: option_slots_assigned == 3 and option_slots_open == 11, sum 14; AssortmentItem.${item_i3}.sell_through_bps == 6325 (NEW_ITEM_BASIS: 5500 * 11500 * 10000 / 1e8), confirming the slot ledger is independent of which variant priced the item"
            - "the repeated adopt of ${item_i3} returns HTTP 409 with ${repeat_adopt_error} == ERR_INVALID_STATE (the item is already ADOPTED, and ADOPTED -> ADOPTED is not declared), and it consumes NO slot: option_slots_assigned is still 3 and option_slots_open still 11, and OptionPlan.${op1_id}.version did not advance across the failed call"
            - "state 4, after closing I1: AssortmentItem.${item_i1}.status == CLOSED, option_slots_assigned == 2 and option_slots_open == 12, sum 14; option_slots_total is still 14 and target_units_per_option is still 276 - the pinned capacity is never recomputed by item traffic"
            - "the closed item keeps its computed history: AssortmentItem.${item_i1}.planned_units == 276 and sell_through_bps == 7455 survive the close, so the slot release is not implemented by blanking the item"
            - "state 5, after adopting I4: the freed slot is genuinely reusable - option_slots_assigned == 3 and option_slots_open == 11 with total still 14, and AssortmentItem.${item_i4}.sell_through_bps == 7140 (6800 * 10500 / 10000). A decrement-only implementation would have refused this adopt or driven option_slots_open to 10"
            - "the count is reconstructible from the item rows at every state: option_slots_assigned equals the number of AssortmentItems on ${op1_id} with status in {ADOPTED, IN_SEASON, CHASED, CANCELLED_IN_SEASON} - 3 at state 5, with ${item_i1} excluded as CLOSED and no DEFERRED or PROPOSED item counted"
            - "no drift across the whole walk: option_slots_total == option_slots_assigned + option_slots_open holds at all six observed states, option_slots_open never exceeds 14 and never goes negative, and the failed adopt is the control showing rejected writes leave the invariant untouched"
