              payload: { promotion_id: "${promo_b_id}" }
              as: DeductionSpecialist
              as_user_id: "ded-1"
            - call: "GET /trade-marketing/promotions/${promo_a_id}"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { promo_a_v: $.data.version }
            - call: "GET /trade-marketing/promotions/${promo_b_id}"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { promo_b_v: $.data.version, bal_b: $.data.accrued_balance }
          trigger:
            - call: "POST /trade-marketing/deductions/${ded_a_id}/validate"
              payload: { expected_promotion_version: "${promo_a_v}" }
              as: TradeFinanceAnalyst
