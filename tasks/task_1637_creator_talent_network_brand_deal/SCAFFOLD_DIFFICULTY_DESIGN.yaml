            - { call: "POST /creators/${c_id}/transition", payload: { to_state: "ACTIVE" }, as: TalentManager }
            - { call: "POST /brands", payload: { name: "BA", industry: "FINANCE" }, as: BrandManager, captures: { b1: $.data.id } }
            - { call: "POST /brands", payload: { name: "BB", industry: "FINANCE" }, as: BrandManager, captures: { b2: $.data.id } }
