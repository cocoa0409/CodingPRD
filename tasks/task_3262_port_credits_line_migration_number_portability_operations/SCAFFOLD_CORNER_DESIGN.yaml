          - entities.MigrationRequest.fields.cutover_completed_at
        distinguishing_aspect: "A migration whose cutover is scheduled for a future instant stays at CUTOVER_SCHEDULED with nothing carried, and only the clock advance past that instant produces CUTOVER_COMPLETE with the number and balances carried."
        test_recipe:
          setup:
            - "One FAMILY account and one ACTIVE PREPAID line with prepaid_balance_cents 20000"
            - "A migration request whose requested_cutover_at is 2026-10-01T00:00:00Z"
            - "Logical clock exactly 2026-09-02T00:00:00Z"
          setup_api_calls:
