      - name: one_operative_weighing_record_per_request
        claim_type: violation_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_DUPLICATE_OPERATIVE_RECORD]"
          - "entities.WeighingRecord.fields.inspection_request_id"
        distinguishing_aspect: "The uniqueness rule is scoped by the other record's STATE rather than by mere existence: it counts weighing records in WEIGHED or SUPERVISED, so a request that already has one refuses a second, and the rule is evaluated as a precondition of the create call itself, so nothing about weighing_status changes."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DELEGATED area with supervision_required false, a certified scale of capacity 400000, an inspector holding WEIGHING and a CORN request with GRADING and WEIGHING requested."
            - "One accepted six-draft weighing record, so weighing_status is WEIGHED."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED", supervision_required: false }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Prairie Coop", account_code: "PRC-114", contact_email: "billing@prairie.example" }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-1411", full_name: "W. Weigher", endorsements: ["WEIGHING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SCALE", asset_code: "SCALE-DUP", model: "HopperMax 400", capacity_lbs: 400000, tolerance_lbs: 20.0 }
              captures: { scale: "$.data.id" }
            - call: POST /grain-inspection/equipment/${scale}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z", test_error_lbs: 5.0 }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "LOADING", lot_identifier: "LOT-WDUP", declared_quantity_bushels: 3600, requested_services: ["GRADING", "WEIGHING"] }
              captures: { req: "$.data.id" }
            - call: POST /grain-inspection/weighing-records
              as: LicensedInspector
              payload:
                inspection_request_id: "${req}"
                scale_id: "${scale}"
                weigher_inspector_id: "${insp}"
                dockage_pct: 1.5
                drafts:
                  - { gross_lbs: 55000, tare_lbs: 21300 }
                  - { gross_lbs: 55000, tare_lbs: 21100 }
                  - { gross_lbs: 55200, tare_lbs: 21100 }
                  - { gross_lbs: 55300, tare_lbs: 21000 }
                  - { gross_lbs: 55500, tare_lbs: 21000 }
                  - { gross_lbs: 55700, tare_lbs: 21000 }
              captures: { wr1: "$.data.id", nb: "$.data.net_bushels" }
          trigger:
            - call: POST /grain-inspection/weighing-records
              as: LicensedInspector
              payload:
                inspection_request_id: "${req}"
                scale_id: "${scale}"
                weigher_inspector_id: "${insp}"
                drafts:
                  - { gross_lbs: 40000, tare_lbs: 15000 }
              captures: { err: "$.data.error_id" }
          assert:
            - "422 ERR_DUPLICATE_OPERATIVE_RECORD"
            - "GET /grain-inspection/weighing-records?inspection_request_id=${req} -> total_count 1 and GET /grain-inspection/inspection-requests/${req} -> weighing_status still WEIGHED"
            - "certified_quantity_bushels still equals the first record's net_bushels 3609.27, so the refused create left no partial effect"
            - "A second FINAL grading result with appeal_id null on a request that already has one -> 422 ERR_DUPLICATE_OPERATIVE_RECORD as well, since the rule is a precondition of the create rather than a state transition"
            - "The same body against a different request in the same area -> 201, confirming the scope is the inspection request"

      - name: watch_window_bounds_are_checked_at_creation_and_at_start
        claim_type: temporal_validation
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_WATCH_WINDOW_INVALID]"
          - "state_machines.VesselWatch.status.SCHEDULED_to_IN_PROGRESS"
          - "endpoints[POST /grain-inspection/vessel-watches/{id}/start]"
        distinguishing_aspect: "One error code covers two different predicates at two different moments: an ordering check on the body at creation, and a half-open containment check against the logical clock at start, where window_start_at is inclusive and window_end_at exclusive."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z."
            - "A DESIGNATED area with concurrent_watch_capacity 2, an ACTIVE supervisor holding SUPERVISION, and a CORN request that includes EXPORT_SUPERVISION."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
