scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: guarantee_eligibility_final_best_vs_provisional_latest
        grounds:
          - calculations.score_improvement_guarantee_eligibility
          - entities.Enrollment.fields.best_practice_score
          - entities.Student.fields.diagnostic_score
          - state_machines.Enrollment.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          The two variants operate on the Enrollment/Student score domain: the FINAL variant
          (cohort conclude) uses best_practice_score = max over COMPLETED PRACTICE attempts, while
          the PROVISIONAL analytics read uses the LATEST attempt's scaled_score; with a later attempt
          scoring lower than an earlier one, the projected improvement differs from the final improvement.
        test_recipe:
          setup:
            - "Published SAT course (scale 1600, guarantee_min_delta 200, required_practice_tests 1, required_attendance_pct 0.0, materials_access_days 30)."
            - "A SCHEDULED cohort (seat_capacity 5, total_sessions 4, SELF format so attendance ignored), student enrolled+ACTIVE."
            - "Diagnostic scored to 1000; two PRACTICE attempts scored: first 1150, second (latest) 1050."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /courses"
              payload: { exam_type: "SAT", format: "SELF", title: "SAT Self", list_price_cents: 120000, baseline_scale_max: 1600, guarantee_min_delta: 200, required_practice_tests: 1, required_attendance_pct: 0.0, materials_access_days: 30 }
              as: Registrar
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /instructors"
              payload: { full_name: "Iris", certified_exam_types: ["SAT"], max_concurrent_cohorts: 3 }
              as: Registrar
              captures: { inst_id: $.data.id }
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cohort_id: $.data.id, cohort_v0: $.data.version }
            - call: "POST /cohorts/${cohort_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
              captures: { cohort_v1: $.data.version }
            - call: "POST /students/register"
              payload: { email: "s1@x.com", full_name: "Stu One" }
              as: Anonymous
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}", expected_cohort_version: "${cohort_v1}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /installment-plans"
              payload: { enrollment_id: "${enr_id}", num_installments: 1 }
              as: Registrar
              captures: { plan_id: $.data.id }
            - call: "POST /installment-plans/${plan_id}/payments"
              payload: { amount_cents: 120000 }
              as: Registrar
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /practice-attempts"
              payload: { enrollment_id: "${enr_id}", attempt_type: "DIAGNOSTIC", raw_correct: 50, total_items: 80 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { diag_id: $.data.id }
            - call: "POST /practice-attempts/${diag_id}/score"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /practice-attempts"
              payload: { enrollment_id: "${enr_id}", attempt_type: "PRACTICE", raw_correct: 575, total_items: 800 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /practice-attempts/${p1_id}/score"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /practice-attempts"
              payload: { enrollment_id: "${enr_id}", attempt_type: "PRACTICE", raw_correct: 525, total_items: 800 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { p2_id: $.data.id }
            - call: "POST /practice-attempts/${p2_id}/score"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
          trigger:
            - call: "GET /enrollments/${enr_id}/analytics"
              payload: {}
              as: Student
              as_user_id: "${stu_id}"
              captures: { best: $.data.best_practice_score }
          assert:
            # diagnostic 50/80 -> 0.625*1600 = 1000 ; p1 575/800 -> 0.71875*1600 = 1150 ; p2 525/800 -> 0.65625*1600 = 1050
            - "Enrollment.${enr_id}.best_practice_score == 1150"
            - "Student.${stu_id}.diagnostic_score == 1000"
            - "Provisional projected improvement uses latest (1050-1000 = 50); final best-based improvement uses best (1150-1000 = 150); the two differ (50 != 150)."

      - name: guarantee_refund_financed_vs_paid_up_front
        grounds:
          - calculations.guarantee_refund_amount
          - entities.InstallmentPlan.fields.amount_paid_cents
          - entities.Enrollment.fields.price_paid_cents
          - state_machines.GuaranteeClaim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          This dual-variant operates on the InstallmentPlan money domain (a DIFFERENT entity domain
          than the score-improvement calc): the financed variant refunds plan.amount_paid_cents (51000,
          one of two installments), while the paid-up-front variant refunds Enrollment.price_paid_cents
          in full (102000). Same approval action, two refund figures depending on financing presence.
        test_recipe:
          setup:
            - "Published SAT course (EARLYBIRD coupon => price 102000), guarantee_min_delta 200."
            - "Student ACTIVE in a concluded cohort with guarantee_status ELIGIBLE (best 1100, diag 1000 -> delta 100 < 200), financed via a 2-installment plan with exactly one 51000 payment made."
            - "GuaranteeClaim filed with resolution REFUND and moved UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /courses"
              payload: { exam_type: "SAT", format: "SELF", title: "SAT Self", list_price_cents: 120000, baseline_scale_max: 1600, guarantee_min_delta: 200, required_practice_tests: 1, required_attendance_pct: 0.0, materials_access_days: 30 }
              as: Registrar
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /instructors"
              payload: { full_name: "Iris", certified_exam_types: ["SAT"], max_concurrent_cohorts: 3 }
              as: Registrar
              captures: { inst_id: $.data.id }
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cohort_id: $.data.id }
            - call: "POST /cohorts/${cohort_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
              captures: { cohort_v1: $.data.version }
            - call: "POST /students/register"
              payload: { email: "s2@x.com", full_name: "Stu Two" }
              as: Anonymous
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}", expected_cohort_version: "${cohort_v1}", coupon_code: "EARLYBIRD" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /installment-plans"
              payload: { enrollment_id: "${enr_id}", num_installments: 2 }
              as: Registrar
              captures: { plan_id: $.data.id }
            - call: "POST /installment-plans/${plan_id}/payments"
              payload: { amount_cents: 51000 }
              as: Registrar
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /practice-attempts"
              payload: { enrollment_id: "${enr_id}", attempt_type: "DIAGNOSTIC", raw_correct: 50, total_items: 80 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { diag_id: $.data.id }
            - call: "POST /practice-attempts/${diag_id}/score"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /practice-attempts"
              payload: { enrollment_id: "${enr_id}", attempt_type: "PRACTICE", raw_correct: 550, total_items: 800 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /practice-attempts/${p1_id}/score"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Registrar
            - call: "POST /cohorts/${cohort_id}/start"
              payload: {}
              as: Registrar
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: Registrar
            - call: "POST /cohorts/${cohort_id}/conclude"
              payload: {}
              as: Registrar
            - call: "POST /guarantee-claims"
              payload: { enrollment_id: "${enr_id}", resolution: "REFUND" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /guarantee-claims/${claim_id}/review"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /guarantee-claims/${claim_id}/approve"
              payload: {}
              as: Registrar
              captures: { refund: $.data.refund_amount_cents }
          assert:
            # price: 120000 - round(120000*0.15)=18000 -> 102000 ; plan paid 51000 of 2 installments
            - "Enrollment.${enr_id}.price_paid_cents == 102000"
            - "GuaranteeClaim.${claim_id}.refund_amount_cents == 51000"
            - "InstallmentPlan.${plan_id}.status == REFUNDED"
            - "A paid-up-front enrollment (no InstallmentPlan) would instead refund price_paid_cents in full, not 51000."

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: scaled_score_rounds_product_once_not_ratio_first
        grounds:
          - calculations.practice_test_scaled_score
          - calculations.practice_test_scaled_score.variants.scaled_score_rounding
          - entities.PracticeAttempt.fields.scaled_score
          - state_machines.PracticeAttempt.STARTED_to_COMPLETED
        distinguishing_aspect: |
          Mode (b) nested-rounding-order: with raw_correct=1, total_items=16, SAT scale 1600, the pinned
          order (round the PRODUCT once: round(0.0625*1600)=100) diverges from the forbidden order
          (round ratio to 2dp first: round(0.06,2)*1600 = 96). The scaffold pins product-first.
        test_recipe:
          setup:
            - "Published SAT course (scale 1600). Student ACTIVE in an enrollable cohort."
            - "A STARTED PRACTICE attempt with raw_correct=1, total_items=16."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /courses"
              payload: { exam_type: "SAT", format: "SELF", title: "SAT", list_price_cents: 100000, baseline_scale_max: 1600, guarantee_min_delta: 200, required_practice_tests: 1, required_attendance_pct: 0.0, materials_access_days: 30 }
              as: Registrar
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /instructors"
              payload: { full_name: "Iris", certified_exam_types: ["SAT"], max_concurrent_cohorts: 3 }
              as: Registrar
              captures: { inst_id: $.data.id }
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cohort_id: $.data.id }
            - call: "POST /cohorts/${cohort_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
              captures: { cohort_v1: $.data.version }
            - call: "POST /students/register"
              payload: { email: "s3@x.com", full_name: "Stu Three" }
              as: Anonymous
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}", expected_cohort_version: "${cohort_v1}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /installment-plans"
              payload: { enrollment_id: "${enr_id}", num_installments: 1 }
              as: Registrar
              captures: { plan_id: $.data.id }
            - call: "POST /installment-plans/${plan_id}/payments"
              payload: { amount_cents: 100000 }
              as: Registrar
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /practice-attempts"
              payload: { enrollment_id: "${enr_id}", attempt_type: "PRACTICE", raw_correct: 1, total_items: 16 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { att_id: $.data.id }
          trigger:
            - call: "POST /practice-attempts/${att_id}/score"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { score: $.data.scaled_score }
          assert:
            - "PracticeAttempt.${att_id}.scaled_score == 100"
            - "PracticeAttempt.${att_id}.status == COMPLETED"

      - name: guarantee_eligibility_three_input_nonlinear_gate
        grounds:
          - calculations.score_improvement_guarantee_eligibility
          - entities.Enrollment.fields.guarantee_status
          - entities.Enrollment.fields.completed_practice_count
          - entities.Enrollment.fields.sessions_attended
          - state_machines.Enrollment.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          Mode (a) >=3-input non-linear gate: ELIGIBLE requires the conjunction of attendance_ok
          (sessions_attended/total_sessions >= required_attendance_pct, branched off Course.format),
          practice_ok (completed_practice_count >= required_practice_tests), have_scores, AND
          guarantee_missed; with 3/4 sessions (0.75) below required 0.80 the gate yields INELIGIBLE
          even though improvement (100) fell short — a single failing factor flips the conjunction.
        test_recipe:
          setup:
            - "Published SAT LIVE course (required_attendance_pct 0.80, required_practice_tests 1, guarantee_min_delta 200, total_sessions 4)."
            - "Student ACTIVE; attendance recorded as 3 of 4 sessions (0.75); diagnostic 1000, best 1100 (delta 100 < 200)."
            - "Cohort started and concluded so the enrollment ACTIVE->COMPLETED guarantee eval runs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /courses"
              payload: { exam_type: "SAT", format: "LIVE", title: "SAT Live", list_price_cents: 100000, baseline_scale_max: 1600, guarantee_min_delta: 200, required_practice_tests: 1, required_attendance_pct: 0.80, materials_access_days: 30 }
              as: Registrar
              captures: { course_id: $.data.id }
            - call: "POST /courses/${course_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /instructors"
              payload: { full_name: "Iris", certified_exam_types: ["SAT"], max_concurrent_cohorts: 3 }
              as: Registrar
              captures: { inst_id: $.data.id }
            - call: "POST /cohorts"
              payload: { course_id: "${course_id}", seat_capacity: 5, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-30T00:00:00Z", total_sessions: 4 }
              as: Registrar
              captures: { cohort_id: $.data.id }
            - call: "POST /cohorts/${cohort_id}/schedule"
              payload: { instructor_id: "${inst_id}" }
              as: Registrar
              captures: { cohort_v1: $.data.version }
            - call: "POST /students/register"
              payload: { email: "s4@x.com", full_name: "Stu Four" }
              as: Anonymous
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", cohort_id: "${cohort_id}", expected_cohort_version: "${cohort_v1}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /installment-plans"
              payload: { enrollment_id: "${enr_id}", num_installments: 1 }
              as: Registrar
              captures: { plan_id: $.data.id }
            - call: "POST /installment-plans/${plan_id}/payments"
              payload: { amount_cents: 100000 }
              as: Registrar
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${enr_id}/attendance"
              payload: { sessions_attended: 3 }
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /practice-attempts"
              payload: { enrollment_id: "${enr_id}", attempt_type: "DIAGNOSTIC", raw_correct: 50, total_items: 80 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { diag_id: $.data.id }
            - call: "POST /practice-attempts/${diag_id}/score"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /practice-attempts"
              payload: { enrollment_id: "${enr_id}", attempt_type: "PRACTICE", raw_correct: 550, total_items: 800 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /practice-attempts/${p1_id}/score"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Registrar
            - call: "POST /cohorts/${cohort_id}/start"
              payload: {}
              as: Registrar
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /cohorts/${cohort_id}/conclude"
              payload: {}
              as: Registrar
          assert:
            # attendance 3/4 = 0.75 < 0.80 -> attendance_ok false -> INELIGIBLE despite delta 100 < 200
            - "Enrollment.${enr_id}.guarantee_status == INELIGIBLE"
            - "Enrollment.${enr_id}.status == COMPLETED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: guarantee_claim_branch_refund_vs_retake
        grounds:
          - state_machines.GuaranteeClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.GuaranteeClaim.UNDER_REVIEW_to_REJECTED
          - entities.GuaranteeClaim.fields.resolution
          - entities.Enrollment.fields.guarantee_status
        distinguishing_aspect: |
          GuaranteeClaim is a branching (fork-join) machine on the GuaranteeClaim entity: UNDER_REVIEW
          forks to APPROVED (whose side-effects further branch REFUND vs RETAKE with divergent effect
          sets: refund+plan-refunded vs materials-extension) or to REJECTED (enrollment INELIGIBLE).
        test_recipe:
          setup:
            - "An ELIGIBLE enrollment with a RETAKE guarantee claim moved UNDER_REVIEW (delta 100 < 200)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: Registrar
            - call: "POST /courses"
