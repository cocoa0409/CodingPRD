      - name: passthrough_admin_fee_tier_pinned_to_step2_base
        grounds:
          - calculations.passthrough_reconciliation_settlement
          - entities.ScheduleCycle.fields.passthrough_settlement_usd
          - entities.PassThroughClaim.fields.allowed_amount_usd
          - state_machines.PassThroughClaim.ACTUAL_SUBMITTED_to_RECONCILED
        distinguishing_aspect: |
          Mode (c) — the admin-fee TIER is selected from the Step-2 base total
          (exactly 100000.00, the inclusive ADMIN_TIER_1_USD boundary → 0.030) and
          is never re-derived from the Step-5 settlement (103000.00, which would
          fall in the 0.020 tier and produce 102060.00). It also pins the FUEL
          uncapped / AIRPORT_FEES tolerance-capped Step-1 split: 98000.00 allowed
          in full, 2000.00 allowed under a 2090.00 cap.
        test_recipe:
          setup:
            - "ACTIVE agreement with one base (no fleet or crew needed)."
            - "OPEN cycle 2026-09 with published_departures 5 and no legs."
            - "FUEL claim: estimate 90000.00, actual 98000.00 (uncapped category). AIRPORT_FEES claim: estimate 1900.00, actual 2000.00 (10% tolerance cap 2090.00)."
            - "Both claims submitted by user ops-1 and reconciled by a different user, admin-1."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "STL", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 5 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/pass-through-claims"
              payload: { cycle_id: "${cyc}", category: "FUEL", estimated_amount_usd: 90000.00 }
              as: RegionalOpsController
              as_user_id: "ops-1"
              captures: { pt_fuel: $.data.id }
            - call: "POST /cpa/pass-through-claims"
              payload: { cycle_id: "${cyc}", category: "AIRPORT_FEES", estimated_amount_usd: 1900.00 }
              as: RegionalOpsController
              as_user_id: "ops-1"
              captures: { pt_fee: $.data.id }
            - call: "POST /cpa/pass-through-claims/${pt_fuel}/submit-actual"
              payload: { actual_amount_usd: 98000.00, supporting_doc_ref: "FUEL-TIER-01" }
              as: RegionalOpsController
              as_user_id: "ops-1"
            - call: "POST /cpa/pass-through-claims/${pt_fee}/submit-actual"
              payload: { actual_amount_usd: 2000.00, supporting_doc_ref: "FEES-TIER-01" }
              as: RegionalOpsController
              as_user_id: "ops-1"
            - call: "POST /cpa/pass-through-claims/${pt_fuel}/reconcile"
              payload: { decision: "APPROVE" }
              as: CPAAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /cpa/pass-through-claims/${pt_fee}/reconcile"
              payload: { decision: "APPROVE" }
              as: CPAAdministrator
              as_user_id: "admin-1"
          assert:
            - "PassThroughClaim.${pt_fuel}.allowed_amount_usd == 98000.00 (FUEL has no tolerance cap)"
            - "PassThroughClaim.${pt_fuel}.variance_usd == 8000.00"
            - "PassThroughClaim.${pt_fee}.allowed_amount_usd == 2000.00 (under the 2090.00 cap, so the actual passes through)"
            - "PassThroughClaim.${pt_fee}.variance_usd == 100.00"
            - "ScheduleCycle.${cyc}.passthrough_settlement_usd == 103000.00 — base 100000.00 at the inclusive tier-1 boundary, admin fee 3000.00 at 0.030"
            - "ScheduleCycle.${cyc}.passthrough_settlement_usd != 102060.00 — re-deriving the tier from the fee-inclusive total is the pinned wrong answer"
            - "PassThroughClaim.${pt_fee}.status == RECONCILED and PassThroughClaim.${pt_fee}.reconciled_by_user_id == \"admin-1\""

  - rule_id: non_linear_state_machine
    instances:
      - name: cancellation_claim_dispute_reclassify_cycle_bounded_at_two_rounds
        grounds:
          - state_machines.CancellationClaim.CLASSIFIED_to_DISPUTED
          - state_machines.CancellationClaim.DISPUTED_to_CLASSIFIED
          - entities.CancellationClaim.fields.dispute_round
          - validations[priority=58]
          - errors[ERR_DISPUTE_ROUNDS_EXHAUSTED]
        distinguishing_aspect: |
          A true CYCLE, not a ladder: the claim re-enters CLASSIFIED twice after
          leaving it, with a different classification each pass (CONTROLLABLE →
          UNCONTROLLABLE → CONTROLLABLE), and the loop is bounded by a counter
          rather than by the state alphabet — the third dispute from an otherwise
          legal CLASSIFIED state is rejected with ERR_DISPUTE_ROUNDS_EXHAUSTED.
        test_recipe:
          setup:
            - "ACTIVE agreement, one base, one LINE_QUALIFIED captain, one REGIONAL_OWNED tail IN_SERVICE."
            - "OPEN cycle 2026-09 with published_departures 10 and one CANCELLED leg, so exactly one CancellationClaim exists."
            - "The claim has already been driven CLASSIFIED → DISPUTED → CLASSIFIED twice, so dispute_round == 2 and status == CLASSIFIED with classification CONTROLLABLE."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "MKE", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 2 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-5001", seat: "CAPTAIN", hire_class_date: "2026-06-01" }
              as: RegionalOpsController
              captures: { p1: $.data.id }
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N601RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac1: $.data.id }
            - call: "POST /cpa/aircraft/${ac1}/induct"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 10 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM4401", origin: "MKE", destination: "ORD", scheduled_departure_utc: "2026-09-03T08:00:00Z", scheduled_arrival_utc: "2026-09-03T09:00:00Z", planned_block_hours: 1.000 }
              as: MainlineScheduler
              captures: { l1: $.data.id }
            - call: "POST /cpa/flight-legs/${l1}/cancel"
              payload: { cause_code: "MAINTENANCE" }
              as: RegionalOpsController
            - call: "GET /cpa/cancellation-claims"
              payload: { leg_id: "${l1}" }
              as: CPAAdministrator
              captures: { cl: "$.data[0].id" }
            - call: "POST /cpa/cancellation-claims/${cl}/classify"
              payload: { classification: "CONTROLLABLE" }
              as: MainlineScheduler
            - call: "POST /cpa/cancellation-claims/${cl}/dispute"
              payload: { dispute_note: "Maintenance was caused by a mainline-supplied part" }
              as: RegionalOpsController
            - call: "POST /cpa/cancellation-claims/${cl}/classify"
              payload: { classification: "UNCONTROLLABLE" }
              as: MainlineScheduler
            - call: "POST /cpa/cancellation-claims/${cl}/dispute"
              payload: { dispute_note: "Second review requested with maintenance log attached" }
              as: RegionalOpsController
            - call: "POST /cpa/cancellation-claims/${cl}/classify"
              payload: { classification: "CONTROLLABLE" }
              as: MainlineScheduler
          trigger:
            - call: "POST /cpa/cancellation-claims/${cl}/dispute"
              payload: { dispute_note: "Third dispute attempt" }
              as: RegionalOpsController
          assert:
            - "HTTP 409 with error.code == ERR_DISPUTE_ROUNDS_EXHAUSTED"
            - "CancellationClaim.${cl}.status == CLASSIFIED"
            - "CancellationClaim.${cl}.dispute_round == 2"
            - "CancellationClaim.${cl}.classification == CONTROLLABLE — the second pass through CLASSIFIED overwrote UNCONTROLLABLE"
            - "CancellationClaim.${cl}.effective_classification == CONTROLLABLE — provisional attribution, unchanged by any classify call because status != FINALIZED"
            - "ScheduleCycle.${cyc}.cancelled_controllable_count == 1 and ScheduleCycle.${cyc}.cancelled_uncontrollable_count == 0 — the whole loop moved no cycle counter"
            - "ScheduleCycle.${cyc}.metric_completed_departures == 9 and ScheduleCycle.${cyc}.departure_ledger_total == 10"

      - name: brand_audit_two_independent_status_dimensions
        grounds:
          - state_machines.BrandAudit.finding_status=OPEN_to_finding_status=ACKNOWLEDGED
          - state_machines.BrandAudit.remediation_status=NOT_STARTED_to_remediation_status=IN_PROGRESS
          - state_machines.BrandAudit.remediation_status=IN_PROGRESS_to_remediation_status=VERIFIED
          - state_machines.BrandAudit.finding_status=ACKNOWLEDGED_to_finding_status=CLOSED
          - validations[priority=63]
          - errors[ERR_REMEDIATION_NOT_VERIFIED]
        distinguishing_aspect: |
          Not a linear chain: BrandAudit carries TWO orthogonal state dimensions that
          advance through different endpoints and different roles, and the terminal
          finding transition is gated on the OTHER dimension — closing an
          ACKNOWLEDGED finding fails with ERR_REMEDIATION_NOT_VERIFIED while
          remediation is only IN_PROGRESS, then succeeds after VERIFIED, with each
          dimension provably untouched by the other's transitions.
        test_recipe:
          setup:
            - "ACTIVE agreement with one base."
            - "One MAJOR brand audit with findings_count 2 on that base (finding_status OPEN, remediation_status NOT_STARTED)."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "IND", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 1 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/brand-audits"
              payload: { base_id: "${base}", audit_scope: "UNIFORM", findings_count: 2, severity: "MAJOR" }
              as: BrandAuditor
              captures: { au: $.data.id }
            - call: "POST /cpa/brand-audits/${au}/acknowledge"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/brand-audits/${au}/remediation"
              payload: { to_remediation_status: "IN_PROGRESS" }
              as: RegionalOpsController
          trigger:
            - call: "POST /cpa/brand-audits/${au}/close"
              payload: {}
              as: BrandAuditor
            - call: "POST /cpa/brand-audits/${au}/remediation"
              payload: { to_remediation_status: "VERIFIED", evidence_ref: "UNIFORM-FIX-PHOTOS-01" }
              as: RegionalOpsController
            - call: "POST /cpa/brand-audits/${au}/close"
              payload: {}
              as: BrandAuditor
          assert:
            - "The first close attempt returns HTTP 409 with error.code == ERR_REMEDIATION_NOT_VERIFIED"
            - "Immediately after that rejection BrandAudit.${au}.finding_status == ACKNOWLEDGED and BrandAudit.${au}.remediation_status == IN_PROGRESS"
            - "The acknowledge call left BrandAudit.${au}.remediation_status == NOT_STARTED at the time — the finding dimension moved alone"
            - "The IN_PROGRESS remediation call left BrandAudit.${au}.finding_status == ACKNOWLEDGED — the remediation dimension moved alone"
            - "After the VERIFIED remediation call BrandAudit.${au}.remediation_status == VERIFIED and BrandAudit.${au}.evidence_ref == \"UNIFORM-FIX-PHOTOS-01\""
            - "The second close call returns HTTP 200 and BrandAudit.${au}.finding_status == CLOSED"

  - rule_id: transitive_cascade
    instances:
      - name: claim_finalize_five_hop_cascade_unwinds_issued_invoice
        grounds:
          - state_machines.CancellationClaim.CLASSIFIED_to_FINALIZED
          - state_machines.Scorecard.PUBLISHED_to_STALE
          - state_machines.Invoice.ISSUED_to_VOIDED
          - state_machines.ScheduleCycle.SETTLED_to_CLOSED
          - entities.Agreement.fields.settled_to_date_usd
          - entities.Invoice.fields.void_reason
