              captures: { agcc_status: $.data.status, agcc_v2: $.data.version }
          assert:
            - "Stale activate (expected ${agcc_v} - 1) returns error_id == ERR_STALE_VERSION (http 412)"
            - "Fresh activate succeeds: status == ACTIVE and version == ${agcc_v} + 1"

