      - name: pinned_scope_authorship_gates_quality_review_open
        grounds:
          - entities.ScopeDefinition.fields.authored_by_user_id
          - state_machines.QualityReview.initial_state_OPEN
          - validations.priority_16.ERR_SEGREGATION_OF_DUTIES
          - validations.priority_23.ERR_INVALID_WORK_STATE
        distinguishing_aspect: |
          The only instance where the remote state is not a status enum but an identity
          field, and the only one that resolves to 403 rather than 409. The full agreement
          chain is clean here - the EngagementAgreement is EXECUTED, the engagement was
          started, a milestone was HELD and the engagement was submitted - so
          Engagement.work_status == SUBMITTED, exactly what POST
          /engagements/{id}/quality-reviews requires, and priority 23 passes. The review
          round is nevertheless refused because the pinned ScopeDefinition two hops away
          carries authored_by_user_id == "ss-1" and the caller presents X-User-ID "ss-1",
          tripping priority 16. That rung is auth-category, so it fires before every state
          and business rung, and it reads a field on an entity the request never names:
          the request path mentions only the Engagement. Note also why the agreement gate
          cannot be the gate on THIS endpoint: quality-review creation is absent from
          priority 36's applies_to list, and an unexecuted agreement would merely keep the
          engagement below SUBMITTED, which surfaces as ERR_INVALID_WORK_STATE (already
          covered by instances 2 and 3). Naive implementers compare the reviewer against
          the engagement's volunteer or the partner contact - both of which differ from
          "ss-1" - and admit the review.
        test_recipe:
          setup:
            - "Cycle 2026-Q1 open with 10 slots; LARGE partner; SENIOR volunteer at 150.00/h, vetted with LEGAL_CONTRACTS proficiency 4 verified."
            - "One HARD availability window [2026-01-05, 2026-03-01) offering 300.00 hours."
            - "One ProjectRequest scoped by ScopingSpecialist ss-1 at estimated_hours 40.00 x complexity_factor 1.00, so ScopeDefinition.authored_by_user_id == ss-1; single deliverable weighted 100.00 covering all 40.00 hours."
