            - call: "POST /tprm/due-diligence-packages/${p_cw2}/approve"
              payload: { expected_engagement_version: "${e_cw2_v}" }
              as: RiskOfficer
            - call: "POST /tprm/engagements/${e_cw2}/contracts"
