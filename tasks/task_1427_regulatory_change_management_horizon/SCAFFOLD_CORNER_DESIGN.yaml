      is rejected 412; the version number only advances on success.'
    test_recipe:
      setup:
      - One ACTIVE obligation; register observed at version 1
      setup_api_calls:
      - call: POST /compliance/regulatory-changes
        payload:
          citation: OC-2
          title: t
          summary: s
          feed_source: MANUAL_ENTRY
          jurisdiction: US-FED
          regulator: OCC
          published_at: '2026-07-01T00:00:00Z'
          effective_date: '2026-12-01T00:00:00Z'
          severity_hint: LOW
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ch: $.data.id
      - call: POST /compliance/regulatory-changes/${ch}/triage
        payload:
          verdict: APPLICABLE
          rationale: r
        as: ComplianceOfficer
        as_user_id: officer-b
      - call: POST /compliance/obligations
        payload:
          obligation_code: OBL-OC-2
          title: Obl
          regulatory_change_id: ${ch}
          criticality: LOW
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ob: $.data.id
      - call: POST /compliance/obligations/${ob}/activate
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
      - call: GET /compliance/obligation-register
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          reg_v: $.data.version
      trigger:
      - call: POST /compliance/obligation-register/publish
        payload:
          expected_register_version: ${reg_v}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          v1: $.data.version_number
      - call: POST /compliance/obligation-register/publish
        payload:
          expected_register_version: ${reg_v}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          err: $.data.error_id
      - call: GET /compliance/obligation-register
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          reg_v2: $.data.version
          reg_cvn: $.data.current_version_number
      assert:
      - 'First publish succeeds: version_number == 1'
      - 'Second publish with the same captured version: ERR_STALE_REGISTER_VERSION
        (412)'
      - 'Register advanced exactly once: version == 2, current_version_number == 1'
  - name: occ_policy_approve_stale_control_version
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules[policy-approve-stale-control]
    - errors[ERR_STALE_CONTROL_VERSION]
    distinguishing_aspect: 'OCC on Control.version: approving update B with the control
      version captured before update A''s approval is rejected 412, because each approval
      legitimately advances the control''s policy lineage.'
    test_recipe:
      setup:
      - Control (version 1) with two policy updates A and B both PENDING_APPROVAL
      setup_api_calls:
      - call: POST /compliance/controls
        payload:
          control_code: CTL-OC-3
          title: Ctl
          owner_department: COMP
          review_frequency_days: 90
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ct: $.data.id
          ct_v1: $.data.version
      - call: POST /compliance/policy-updates
        payload:
          control_id: ${ct}
          title: A
          change_summary: a
          effective_date: '2026-08-20T00:00:00Z'
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          puA: $.data.id
      - call: POST /compliance/policy-updates/${puA}/submit
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
      - call: POST /compliance/policy-updates
        payload:
          control_id: ${ct}
          title: B
          change_summary: b
          effective_date: '2026-09-01T00:00:00Z'
        as: ComplianceOfficer
        as_user_id: officer-b
        captures:
          puB: $.data.id
      - call: POST /compliance/policy-updates/${puB}/submit
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-b
      trigger:
      - call: POST /compliance/policy-updates/${puA}/approve
        payload:
          expected_control_version: ${ct_v1}
        as: ComplianceManager
        as_user_id: manager-1
        captures:
          puA_nvp: $.data.new_policy_version
      - call: POST /compliance/policy-updates/${puB}/approve
        payload:
          expected_control_version: ${ct_v1}
        as: ComplianceManager
        as_user_id: manager-1
        captures:
          err: $.data.error_id
      - call: GET /compliance/controls/${ct}
        payload: {}
        as: ComplianceOfficer
        as_user_id: officer-a
        captures:
          ct_v2: $.data.version
      - call: POST /compliance/policy-updates/${puB}/approve
        payload:
          expected_control_version: ${ct_v2}
        as: ComplianceManager
        as_user_id: manager-1
        captures:
          puB_st: $.data.status
          puB_nvp: $.data.new_policy_version
      assert:
      - 'Approve A with fresh version: APPROVED, new_policy_version == 2, control.version
        advances to 2'
      - 'Approve B with the pre-A version: ERR_STALE_CONTROL_VERSION (412)'
      - 'Approve B with the re-read version: APPROVED, new_policy_version == 3 (snapshot
        moves with the control)'
