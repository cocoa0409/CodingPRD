      - name: the_two_elapsed_readings_diverge_on_the_same_attempt_set
        claim_type: Variant Divergence
        excluded_because:
          difficulty_instance: entry_elapsed_provisional_gun_reading_vs_official_chip_reading
          rationale: "§1.8 computes both variants on one entry and pins the delta — the provisional gun reading of 2520 against the official chip reading of 2363 — including the SKIPPED_UNMARSHALED penalty that only the official variant voids."

      - name: each_variant_is_selected_by_the_operation_that_stamps_it
        claim_type: Variant Selection
        excluded_because:
          difficulty_instance: entry_elapsed_provisional_gun_reading_vs_official_chip_reading
          rationale: "The same §1.8 instance asserts that finish stamps only the provisional fields and that the official fields stay unset until the wave closes or an adjudication lands, which is the variant-selection claim."

      - name: the_switch_from_per_task_to_final_rounding_reconciles_on_the_ledger
        claim_type: Reconciliation
        excluded_because:
          difficulty_instance: restoration_bond_per_task_rounding_vs_final_closeout_rounding
          rationale: "§1.8 books the 1-cent remainder from the per-task sum of 999999 onto the largest-area verified task at final closeout and re-checks the venue ledger, which is exactly the reconciliation-on-switch claim."

      - name: cent_rounding_order_is_pinned_per_variant
        claim_type: Precision
        excluded_because:
          difficulty_instance: restoration_bond_per_task_rounding_vs_final_closeout_rounding
          rationale: "The round-then-sum against sum-then-round divergence in whole cents is the entire subject of that §1.8 instance."

      - name: the_staffing_step_sits_inside_two_nested_minimums
        claim_type: threshold
        excluded_because:
          difficulty_instance: obstacle_effective_rate_step_staffing_inside_nested_min_with_corral_cap
          rationale: "§1.8 walks the staffing_factor step at 1.00, 0.60 and 0.00 with the bypass relief and the corral cap both active, covering every threshold branch of the effective-rate formula."

      - name: the_late_penalty_composes_ceiling_days_a_cap_and_a_remainder
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: final_closeout_late_penalty_composes_ceil_days_min_cap_and_remainder
          rationale: "§1.8 drives the closeout waterfall end to end: ceil(hours_late / 24) days, the min() cap against gross_total, the net_total allocation and the remainder placement."

      - name: adjacent_corral_windows_do_not_overlap
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: corral_occupancy_exact_adjacency_is_free_and_the_equality_sum_passes
          rationale: "§1.8 asserts the half-open geometry at the exact 6-minute boundary and the inclusive equality of the aggregate sum against corral_throughput_capacity."

      - name: overlapping_corral_windows_share_one_capacity_budget
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: three_overlapping_heats_share_the_corral_budget_and_the_window_rolls_forward
          rationale: "§1.8 stacks three heats inside one rolling corral window and asserts the accept / reject / accept sequence as the window advances, which covers the overlapping-interval aggregate."

      - name: the_staff_travel_buffer_inflates_both_ends_of_the_shift
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: staff_travel_buffer_accepts_an_exact_fifteen_minute_gap_and_rejects_one_second_less
          rationale: "§1.8 pins the buffer-inflated pairwise geometry to the second, which is the boundary claim for this interval algorithm."

