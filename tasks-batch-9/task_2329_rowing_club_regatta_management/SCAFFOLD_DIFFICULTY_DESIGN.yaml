  - rule_id: transitive_cascade
    instances:
      - name: condemn_hull_cascade_report_shell_entry_lane_heat_depth_five
        grounds:
          - state_machines.DamageReport.TRIAGED_to_CONDEMNED
          - state_machines.Shell.DAMAGED_to_RETIRED
          - state_machines.RegattaEntry.CONFIRMED_to_SCRATCHED
          - state_machines.RaceLane.PENDING_to_VOIDED
          - state_machines.Heat.LANES_ASSIGNED_to_SCHEDULED
          - calculations.scratch_refund
          - entities.Regatta.fields.net_fee_cents
        distinguishing_aspect: |
          A depth-5 chain triggered by DamageReport TRIAGED -> CONDEMNED: the report's
          condemnation retires the Shell, the retirement scratches the hull's CONFIRMED
          RegattaEntry, that scratch voids the entry's PENDING RaceLane, and the voided lane
