    description: "Get an enrollment"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: []
    output: NurtureEnrollment
    side_effects: []
  - method: GET
    path: "/crm/nurture-enrollments"
    description: "List enrollments"
    roles: [TeamAdmin, TeamLeader, Agent, ReferralPartner]
    code: 200
    input: ["campaign_id?", "lead_id?", "status?"]
    output: NurtureEnrollment[]
    side_effects: []
  - method: POST
    path: "/crm/nurture-enrollments/{enrollmentId}/exit"
    description: "Manually exit an ENROLLED/PAUSED enrollment (exit_reason MANUAL)"
    roles: [TeamLeader, TeamAdmin]
    code: 200
    input: []
    output: NurtureEnrollment
    side_effects: ["status -> EXITED"]

  # --- ReferralPartner ---
  - method: POST
