  # ==========================================================================
  # Cross-Cutting Complexity Layers
  # ==========================================================================
  - section: cross_cutting_layers
    instances:
      - name: reclassify_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[dispute-reclassify-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on DisputeCase.version: reclassify carrying the version observed at intake (1) after classify advanced it (2) fails with 412 ERR_STALE_VERSION; carrying the current version succeeds and bumps to 3."
        test_recipe:
          setup: ["Old account, txn 15000, dispute received 2026-08-03 (version 1), classified fraud (version 2)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "OCC", initial_balance_cents: 50000 }
              as: BankAdmin
              captures: { ocacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${ocacct}", merchant_name: "OCC", amount_cents: 15000, transaction_type: "POS_PIN", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { octx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${octx}", error_type: "UNAUTHORIZED", claim_amount_cents: 15000, claimed_report_delay_days: 1 }
              as: Cardholder
              as_user_id: "${ocacct}"
              captures: { occase: $.data.id, oc_v1: $.data.version }
            - call: "POST /disputes/${occase}/classify"
              payload: { is_fraud_claim: true, verified_report_delay_days: 1 }
              as: DisputeInvestigator
              captures: { oc_v2: $.data.version }
          trigger:
            - call: "POST /disputes/${occase}/reclassify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 1, expected_dispute_version: "${oc_v1}" }
              as: DisputeInvestigator
              captures: { err: $.data.error_id }
            - call: "POST /disputes/${occase}/reclassify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 1, expected_dispute_version: "${oc_v2}" }
              as: DisputeInvestigator
              captures: { oc_v3: $.data.version, fraud2: $.data.is_fraud_claim }
          assert:
            - "err == ERR_STALE_VERSION (stale expected_dispute_version rejected with 412)"
            - "oc_v3 == 3 and fraud2 == false (current version succeeds and increments)"
      - name: liability_tier_boundary_day_2_vs_3
        claim_type: rate_threshold_trigger
        grounds: [calculations.consumer_liability_holdback]
        distinguishing_aspect: "Tier boundary precision: fraud delay of exactly 2 days keeps the 5000 cap (credit 95000 on a 100000 claim) while 3 days jumps to the 50000 cap (credit 50000)."
        test_recipe:
          setup: ["Old account balance 300000; two VISA POS_PIN txns 100000 posted 2026-07-01; two fraud disputes received 2026-08-03 with delays 2 and 3, both classified fraud"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Tier", initial_balance_cents: 300000 }
              as: BankAdmin
              captures: { tiacct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${tiacct}", merchant_name: "T-A", amount_cents: 100000, transaction_type: "POS_PIN", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { titx1: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${tiacct}", merchant_name: "T-B", amount_cents: 100000, transaction_type: "POS_PIN", network: "VISA", posted_at: "2026-07-01T11:00:00Z" }
              as: BankAdmin
              captures: { titx2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${titx1}", error_type: "UNAUTHORIZED", claim_amount_cents: 100000, claimed_report_delay_days: 2 }
              as: Cardholder
              as_user_id: "${tiacct}"
              captures: { tic1: $.data.id }
            - call: "POST /disputes"
              payload: { card_transaction_id: "${titx2}", error_type: "UNAUTHORIZED", claim_amount_cents: 100000, claimed_report_delay_days: 3 }
              as: Cardholder
              as_user_id: "${tiacct}"
              captures: { tic2: $.data.id }
            - call: "POST /disputes/${tic1}/classify"
              payload: { is_fraud_claim: true, verified_report_delay_days: 2 }
              as: DisputeInvestigator
            - call: "POST /disputes/${tic2}/classify"
              payload: { is_fraud_claim: true, verified_report_delay_days: 3 }
              as: DisputeInvestigator
          trigger:
            - call: "POST /disputes/${tic1}/grant-provisional-credit"
              payload: {}
              as: IntakeAgent
              captures: { amt1: $.data.amount_cents }
            - call: "POST /disputes/${tic2}/grant-provisional-credit"
              payload: {}
              as: IntakeAgent
              captures: { amt2: $.data.amount_cents }
          assert:
            - "amt1 == 95000 (delay == 2 is still tier 1: min(5000, 100000) holdback)"
            - "amt2 == 50000 (delay == 3 crosses to tier 2: min(50000, 100000) holdback)"
      - name: arbitration_won_creates_recovery_and_finalizes_credit
        claim_type: cascading_side_effects
        grounds: [state_machines.Chargeback.SECOND_PRESENTED_to_CLOSED_WON, calculations.recovery_waterfall, calculations.case_network_fees]
        distinguishing_aspect: "Escalate WON at ARBITRATION books LOSS_RECOGNIZED 47800 (final credit 20000 + fees 27800) paired with RECOVERY_RECEIVED 20000, finalizes the credit, and resolves the case cardholder-favor: outstanding_loss_cents == 27800."
        test_recipe:
          setup: ["Old account balance 100000; VISA ECOMMERCE txn 20000 posted 2026-07-01; non-fraud dispute classified, credit 20000 granted; chargeback filed, representment REJECTED -> SECOND_PRESENTED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: BankAdmin
            - call: "POST /card-accounts"
              payload: { cardholder_name: "Arb", initial_balance_cents: 100000 }
              as: BankAdmin
              captures: { aracct: $.data.id }
            - call: "POST /card-transactions"
              payload: { card_account_id: "${aracct}", merchant_name: "ARB", amount_cents: 20000, transaction_type: "ECOMMERCE", network: "VISA", posted_at: "2026-07-01T10:00:00Z" }
              as: BankAdmin
              captures: { artx: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: BankAdmin
            - call: "POST /disputes"
              payload: { card_transaction_id: "${artx}", error_type: "SERVICE_NOT_RECEIVED", claim_amount_cents: 20000, claimed_report_delay_days: 10 }
              as: Cardholder
              as_user_id: "${aracct}"
              captures: { arcase: $.data.id }
            - call: "POST /disputes/${arcase}/classify"
              payload: { is_fraud_claim: false, verified_report_delay_days: 10 }
              as: DisputeInvestigator
            - call: "POST /disputes/${arcase}/grant-provisional-credit"
              payload: {}
              as: IntakeAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: BankAdmin
            - call: "POST /chargebacks"
              payload: { dispute_case_id: "${arcase}", reason_code: "V13_1" }
              as: ChargebackAnalyst
              captures: { arcb: $.data.id }
            - call: "POST /chargebacks/${arcb}/representments"
              payload: { merchant_ref: "MR-A", evidence_documents: [{ doc_type: "RECEIPT", reference: "a-1" }] }
              as: ChargebackAnalyst
            - call: "POST /chargebacks/${arcb}/review-representment"
              payload: { decision: "REJECT" }
              as: ChargebackAnalyst
          trigger:
            - call: "POST /chargebacks/${arcb}/escalate"
              payload: { stage: "ARBITRATION", outcome: "WON" }
              as: ChargebackAnalyst
              captures: { arbst: $.data.status, arbfees: $.data.fees_total_cents }
            - call: "GET /disputes/${arcase}"
              payload: {}
              as: FinanceOfficer
              captures: { arcase_st: $.data.status, arout: $.data.outstanding_loss_cents, arkeeps: $.data.cardholder_keeps_cents }
            - call: "GET /disputes/${arcase}/provisional-credits"
              payload: {}
              as: FinanceOfficer
              captures: { arpc_st: "$.data[0].status", arpc_fin: "$.data[0].final_amount_cents" }
          assert:
            - "arbst == CLOSED_WON and arbfees == 27800"
            - "arcase_st == RESOLVED_CARDHOLDER_FAVOR and arkeeps == 20000"
            - "arpc_st == FINALIZED and arpc_fin == 20000"
            - "arout == 27800 (LOSS 47800 minus RECOVERY 20000)"

