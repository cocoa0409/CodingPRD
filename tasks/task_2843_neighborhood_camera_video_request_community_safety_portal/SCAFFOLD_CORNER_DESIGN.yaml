          - roles.PlatformAdmin.notes
          - errors.ERR_SEGREGATION_OF_DUTIES
          - validations[priority=7]
          - entities.ModerationCase.fields.opened_by_user_id
          - entities.TransparencyReport.fields.compiled_by_user_id
        distinguishing_aspect: "The same duty split applies to two opaque-identity roles where the separated pair is tracked only by X-User-ID: mod-1 cannot decide the case mod-1 opened, admin-1 cannot certify the report admin-1 compiled, and in both cases a second holder of the very same role succeeds immediately afterwards."
        test_recipe:
          setup:
