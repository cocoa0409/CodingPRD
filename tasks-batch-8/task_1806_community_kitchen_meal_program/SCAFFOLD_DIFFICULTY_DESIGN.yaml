  - rule_id: combinatorial_formula
    instances:
      - name: portion_commitment_rescue_cap_mode_a
        grounds:
          - calculations.portion_commitment
          - endpoints["POST /kitchen/menu-items/{id}/allocations"]
          - errors[ERR_CAPACITY_FULL]
        distinguishing_aspect: |
          Mode (a): allowed allocation = min(requested, batch.remaining_servings,
          item uncovered need, RESCUE_CAP_RATIO * batch.quantity_servings) with a
          conditional branch on source_type == RESCUE — a 4-input nested-min with
          a state-conditional branch; requesting 70 against cap 50 rejects even
          though remaining (100) and uncovered need (80) both exceed 70.
        test_recipe:
          setup:
            - "Clock 2026-08-10T08:00:00Z; site S; RESCUE batch R quantity 100 ACCEPTED (rescue cap = 0.5 * 100 = 50)."
            - "MenuDay D (DRAFT, 2026-08-11) with item I planned_servings 80."
          setup_api_calls:
