        constraints: "MINOR | MODERATE | SEVERE | MEDICAL_EMERGENCY"
      - name: reaction_codes
        type: array
        source: input
        description: "Observed reaction codes."
        constraints: "subset of {REDNESS, SWELLING, DISCHARGE, EMBEDDED_BACK, INFECTION, ALLERGIC_REACTION, KELOID, NERVE_DAMAGE}"
      - name: escalation_status
        type: enum
        source: system
        description: "Escalation ladder position."
        constraints: "LOGGED | TRIAGED | ESCALATED | RESOLVED | REFUND_ISSUED | REOPENED"
        default: LOGGED
      - name: refund_amount_cents
        type: integer
        source: computed
