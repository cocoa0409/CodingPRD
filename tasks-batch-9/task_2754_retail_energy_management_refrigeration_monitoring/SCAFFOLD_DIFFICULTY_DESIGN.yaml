      - name: standard_publish_supersession_cascade_depth_three
        grounds:
          - state_machines.SetpointStandard.transitions.standard_publish
          - state_machines.SetpointStandard.transitions.standard_superseded
          - state_machines.Store.transitions.bms_degrade_on_standard_superseded
          - state_machines.Store.transitions.posture_raise_constrained
          - validations[priority=100]
        distinguishing_aspect: |
          Publishing a successor standard cascades three links along a path that
          touches no refrigeration entity at all: (1) the predecessor
          PUBLISHED -> SUPERSEDED, (2) every Store bound to the predecessor whose
          bms_status == ACTIVE -> DEGRADED, (3) each such Store recomputes
          energy_posture NORMAL -> CONSTRAINED. Store.active_standard_id is NOT
          rewritten - the binding stays stale on purpose - and a store still in
          COMMISSIONING is untouched by link 2.
        test_recipe:
          setup:
            - "two HOT_HUMID / EXPRESS stores commissioned against the same PUBLISHED SUMMER standard; store A activated (ACTIVE), store B left in COMMISSIONING"
            - "a DRAFT successor standard for the same (HOT_HUMID, EXPRESS, SUMMER) triple naming the predecessor in supersedes_standard_id, which validations[priority=100] admits as the one legal duplicate"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-TC3-A", climate_zone: "HOT_HUMID", store_format: "EXPRESS", floor_area_sqft: 16000 }
              as: PlatformAdmin
              captures: { store_a_id: "$.data.id", store_a_v1: "$.data.version" }
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-TC3-B", climate_zone: "HOT_HUMID", store_format: "EXPRESS", floor_area_sqft: 17500 }
              as: PlatformAdmin
              captures: { store_b_id: "$.data.id", store_b_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "HOT_HUMID", store_format: "EXPRESS", season: "SUMMER", cooling_setpoint_f: 75.0, heating_setpoint_f: 69.0, deadband_f: 2.0, lighting_lux_target: 600 }
              as: EnergyManager
              captures: { std_v1_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_v1_id}/publish"
              payload: {}
              as: EnergyManager
              captures: { std_v1_status: "$.data.status" }
            - call: "POST /energy-ops/stores/${store_a_id}/bms-commissioning"
              payload: { standard_id: "${std_v1_id}", expected_store_version: "${store_a_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_a_id}/bms-activation"
              payload: {}
              as: EnergyManager
              captures: { store_a_status: "$.data.bms_status", store_a_posture: "$.data.energy_posture" }
            - call: "POST /energy-ops/stores/${store_b_id}/bms-commissioning"
              payload: { standard_id: "${std_v1_id}", expected_store_version: "${store_b_v1}" }
              as: EnergyManager
              captures: { store_b_status: "$.data.bms_status" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "HOT_HUMID", store_format: "EXPRESS", season: "SUMMER", cooling_setpoint_f: 76.0, heating_setpoint_f: 69.0, deadband_f: 2.5, lighting_lux_target: 550, supersedes_standard_id: "${std_v1_id}" }
              as: EnergyManager
              captures: { std_v2_id: "$.data.id", std_v2_status: "$.data.status" }
          trigger:
            - call: "POST /energy-ops/setpoint-standards/${std_v2_id}/publish"
              payload: {}
              as: EnergyManager
              as_user_id: "u_manager_tc3"
          assert:
            - "${std_v1_status} == PUBLISHED"
            - "${store_a_status} == ACTIVE"
            - "${store_a_posture} == NORMAL"
            - "${store_b_status} == COMMISSIONING"
            - "${std_v2_status} == DRAFT"
            - "SetpointStandard.${std_v2_id}.status == PUBLISHED"
            - "SetpointStandard.${std_v2_id}.published_by_user_id == u_manager_tc3"
            - "SetpointStandard.${std_v2_id}.published_at_iso == 2026-08-01T00:00:00Z"
            - "SetpointStandard.${std_v1_id}.status == SUPERSEDED"
            - "Store.${store_a_id}.bms_status == DEGRADED"
            - "Store.${store_a_id}.energy_posture == CONSTRAINED"
            - "Store.${store_a_id}.active_standard_id == ${std_v1_id}"
            - "Store.${store_b_id}.bms_status == COMMISSIONING"
            - "Store.${store_b_id}.energy_posture == NORMAL"
            - "Store.${store_b_id}.active_standard_id == ${std_v1_id}"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: override_window_conflict_outranks_budget_exceeded
        grounds:
          - validations[priority=101]
          - validations[priority=120]
          - errors.ERR_OVERRIDE_WINDOW_CONFLICT
          - errors.ERR_OVERRIDE_BUDGET_EXCEEDED
          - calculations.lighting_override_projection
        distinguishing_aspect: |
          A business_constraint rule (101, temporal overlap of the same store and
          zone) versus a business_fiscal rule (120, monthly override energy
          allowance). One request violates both: expect ERR_OVERRIDE_WINDOW_CONFLICT
          (409). Moving the same 240.00 kWh request to the adjacent non-overlapping
          window leaves only rule 120 violated and yields
          ERR_OVERRIDE_BUDGET_EXCEEDED (422), proving the ordering rather than a
          hard-coded winner.
        test_recipe:
          setup:
            - "one MIXED / SUPERCENTER store with BMS ACTIVE, energy_posture NORMAL and override_budget_kwh_month 500.0"
            - "clock 2026-08-01T00:00:00Z, so every August start_iso counts toward the same calendar month"
            - "one SCHEDULED SALES_FLOOR override for 2026-08-10T00:00Z-08:00Z at 37.5 kW, charging 300.00 kWh of the 500.0 allowance"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-PP1", climate_zone: "MIXED", store_format: "SUPERCENTER", floor_area_sqft: 120000, override_budget_kwh_month: 500.0 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "MIXED", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 74.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "SALES_FLOOR", override_type: "SCHEDULE_EXTEND", start_iso: "2026-08-10T00:00:00Z", end_iso: "2026-08-10T08:00:00Z", zone_load_kw: 37.5, requested_reason: "overnight resets" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { ovr_a_id: "$.data.id", ovr_a_state: "$.data.state", ovr_a_kwh: "$.data.projected_kwh" }
          trigger:
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "SALES_FLOOR", override_type: "SCHEDULE_EXTEND", start_iso: "2026-08-10T07:00:00Z", end_iso: "2026-08-10T09:00:00Z", zone_load_kw: 120.0, requested_reason: "both rules violated at once" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { conflict_error: "$.data.error_id" }
            - call: "POST /energy-ops/stores/${store_id}/lighting-overrides"
              payload: { zone: "SALES_FLOOR", override_type: "SCHEDULE_EXTEND", start_iso: "2026-08-10T08:00:00Z", end_iso: "2026-08-10T10:00:00Z", zone_load_kw: 120.0, requested_reason: "budget only" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { budget_error: "$.data.error_id" }
          assert:
            - "${ovr_a_state} == SCHEDULED"
            - "${ovr_a_kwh} == 300.00"
            - "Store.${store_id}.override_kwh_used_month == 300.00"
            - "${conflict_error} == ERR_OVERRIDE_WINDOW_CONFLICT"
            - "the first trigger returns HTTP 409"
            - "${budget_error} == ERR_OVERRIDE_BUDGET_EXCEEDED"
            - "the second trigger returns HTTP 422 because 300.00 + 240.00 == 540.00 > 500.0 and the 08:00Z start does not intersect the half-open [00:00Z, 08:00Z) window"
            - "Store.${store_id}.override_kwh_used_month == 300.00 (neither rejected request charged anything)"
            - "GET /energy-ops/stores/${store_id}/lighting-overrides returns exactly 1 row"

      - name: dr_state_invalid_outranks_food_safety_hold
        grounds:
          - validations[priority=63]
          - validations[priority=80]
          - errors.ERR_DR_EVENT_STATE_INVALID
          - errors.ERR_FOOD_SAFETY_HOLD
          - state_machines.DemandResponseEvent.transitions.dr_activate
        distinguishing_aspect: |
          A different error-category pair from the override instance: a state rule
          (63, activation requires event_state NOTIFIED) against a business_safety
          rule (80, no activation while the store is LOCKED). Activating a still
          SCHEDULED event on a LOCKED store violates both and must return
          ERR_DR_EVENT_STATE_INVALID; activating a NOTIFIED event on the same LOCKED
          store violates only rule 80 and returns ERR_FOOD_SAFETY_HOLD.
        test_recipe:
          setup:
            - "clock 2026-08-01T07:00:00Z for the whole scenario"
            - "one COLD / SUPERCENTER store with BMS ACTIVE and two utility accounts"
            - "account 1 carries event A for 2026-08-01T05:00Z-06:00Z, left in SCHEDULED (never notified, so the lock cascade cannot opt it out)"
            - "three breaching readings drive an excursion to ESCALATED and the store to LOCKED"
            - "account 2 then gets three on-peak baseline intervals and event B for 2026-08-01T06:30Z-07:30Z, notified AFTER the lock so it sits in NOTIFIED on a LOCKED store"
          setup_api_calls:
            - call: "POST /energy-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T07:00:00Z" }
              as: PlatformAdmin
            - call: "POST /energy-ops/stores"
              payload: { code: "STR-PP2", climate_zone: "COLD", store_format: "SUPERCENTER", floor_area_sqft: 118000 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /energy-ops/setpoint-standards"
              payload: { climate_zone: "COLD", store_format: "SUPERCENTER", season: "SUMMER", cooling_setpoint_f: 73.0, heating_setpoint_f: 68.0, deadband_f: 2.0, lighting_lux_target: 750 }
              as: EnergyManager
              captures: { std_id: "$.data.id" }
            - call: "POST /energy-ops/setpoint-standards/${std_id}/publish"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-commissioning"
              payload: { standard_id: "${std_id}", expected_store_version: "${store_v1}" }
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/bms-activation"
              payload: {}
              as: EnergyManager
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Northern Grid", rate_schedule_code: "TOU-A", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_1_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_1_id}/demand-response-events"
              payload: { program_code: "CPP-2026", curtailment_start_iso: "2026-08-01T05:00:00Z", curtailment_end_iso: "2026-08-01T06:00:00Z", target_reduction_kw: 150.0 }
              as: EnergyManager
              captures: { event_a_id: "$.data.id", event_a_state: "$.data.event_state" }
            - call: "POST /energy-ops/stores/${store_id}/refrigeration-cases"
              payload: { case_code: "CASE-PP2-01", case_type: "LOW_TEMP", product_class: "FROZEN", alarm_high_f: 5.0, alarm_low_f: -20.0, product_value_usd: 21000.00 }
              as: EnergyManager
              captures: { case_id: "$.data.id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 8.0, reading_iso: "2026-08-01T04:00:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 9.5, reading_iso: "2026-08-01T04:15:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { exc_id: "$.data.excursion_id" }
            - call: "POST /energy-ops/refrigeration-cases/${case_id}/readings"
              payload: { temp_f: 11.0, reading_iso: "2026-08-01T06:00:00Z" }
              as: BmsGateway
              as_user_id: "${store_id}"
              captures: { locked_posture: "$.data.store_energy_posture", exc_state: "$.data.excursion_state" }
            - call: "POST /energy-ops/stores/${store_id}/utility-accounts"
              payload: { utility_name: "Northern Grid", rate_schedule_code: "TOU-B", rate_family: "TOU_DEMAND", demand_charge_per_kw: 14.50, rate_on_peak: 0.1450, rate_off_peak: 0.0800 }
              as: EnergyManager
              captures: { acct_2_id: "$.data.id" }
            - call: "POST /energy-ops/utility-accounts/${acct_2_id}/demand-intervals"
              payload: { intervals: [ { interval_start_iso: "2026-07-31T14:00:00Z", kw_demand: 1290.5, is_on_peak: true }, { interval_start_iso: "2026-07-31T15:00:00Z", kw_demand: 1275.0, is_on_peak: true }, { interval_start_iso: "2026-07-31T16:00:00Z", kw_demand: 1245.0, is_on_peak: true } ] }
              as: EnergyAnalyst
