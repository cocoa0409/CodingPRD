      - name: stocking_order_type_rejected_for_a_reseller_partner
        claim_type: violation_error
        grounds:
          - validations[priority=6]
          - errors[ERR_PARTNER_TYPE_NOT_ELIGIBLE]
          - entities.Partner.partner_type
        distinguishing_aspect: "order_type STOCKING is legal only for a DISTRIBUTOR: the same list price is refused with ERR_PARTNER_TYPE_NOT_ELIGIBLE 422 for a RESELLER and priced as DROP_SHIP without the 0.02 stocking allowance."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00.000Z; one REGISTERED RESELLER partner with no registration."
            - "As DROP_SHIP: prelim_margin 0.10, prelim_net 900,000 -> NONE -> margin_pct 0.1000, invoice 900,000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
