          assert:
            - "response 409 and e == ERR_CARD_HAS_OPEN_DISPUTES"
            - "CardAccount.${acct_id}.status still OPEN"

      - name: provisioning_session_state_beats_card_account_restricted
        claim_type: Priority conflict
        grounds:
          - validations.priority_6
          - validations.priority_12
        distinguishing_aspect: "Priority pair state (6) vs business_referential (12): a tokenize whose session state is valid (VERIFIED) but whose card account is CLOSED fails at priority 12 with ERR_CARD_ACCOUNT_RESTRICTED — proving the state gate passed and the referential gate fired; a session in a bad state would instead surface priority 6 first."
