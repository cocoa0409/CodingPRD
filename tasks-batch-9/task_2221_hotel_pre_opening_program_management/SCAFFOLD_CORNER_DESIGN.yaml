  - section: validations
    instances:
      - name: hire_start_date_before_wave_start_returns_start_before_wave
        claim_type: violation_to_error
        grounds:
          - "§1.4 priority 3 business_constraint covers the staggered-start rule and §1.6 declares ERR_START_BEFORE_WAVE (422) for a Hire whose start_date precedes its DepartmentHiringPlan.wave_start_date."
        distinguishing_aspect: "start_date 2026-09-09 is one day before the department wave, so the create is refused with ERR_HIRE_START_BEFORE_WAVE at 422 and the plan's offered_count stays 0."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' (120 rooms, construction_start_date 2026-09-01, target_opening_date 2027-05-01, storage_capacity_pallets 40, room_night_ceiling 200, contingency_liability_cap_cents 50000000) in schedule_state PLANNING, commercial_state BOOKING_CLOSED, version 1."
            - "One ROOMS DepartmentHiringPlan with headcount_target 4 and wave_start_date 2026-09-10, offered_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /pre-opening/programs"
              payload: { property_name: "Cobalt Bay Hotel", brand_code: "CBH", room_count: 120, construction_start_date: "2026-09-01", target_opening_date: "2027-05-01", storage_capacity_pallets: 40, relocation_rate_cents: 25000, guarantee_penalty_cents: 150000, room_night_ceiling: 200, contingency_liability_cap_cents: 50000000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: "$.data.id" }
            - call: "POST /pre-opening/hiring-plans"
              payload: { program_id: "${prog_id}", department: "ROOMS", headcount_target: 4, wave_start_date: "2026-09-10" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { plan_rooms: "$.data.id" }
          trigger:
            - call: "POST /pre-opening/hires"
              payload: { hiring_plan_id: "${plan_rooms}", full_name: "A. Early", hourly_rate_cents: 2500, scheduled_hours_per_day: 8, start_date: "2026-09-05" }
              as: TalentManager
              as_user_id: "tm-1"
              captures: { err_wave: "$.data.error_id" }
          assert:
