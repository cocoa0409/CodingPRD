              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { mark_league: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Keystone Sport Group", contact_email: "ops@keystone.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
