      - name: omitting_the_method_selects_the_rollover_variant_and_changes_the_classification
        claim_type: variant_selection
        grounds:
          - calculations.correction_materiality_classification
          - calculations.control_deficiency_severity
          - calculations.cycle_unresolved_deficiency_weight
          - state_machines.PostFilingCorrection.DRAFT_to_ASSESSED
          - state_machines.ReportingCycle.NONE_to_UNDER_EVALUATION
          - endpoints["POST /disclosure/corrections/{id}/transitions"]
        distinguishing_aspect: |
          The variant is chosen by CONTEXT, not by data: with identical stored figures (error 400000,
          current-period income 10000000, prior-period income 12000000, cumulative prior 300000),
          omitting `method` on ASSESS must apply DEFAULT_MATERIALITY_METHOD == ROLLOVER, which ignores
          cumulative_prior_uncorrected_amount entirely and yields materiality_pct 4.00 -> REVISION. The
          knock-on chain is variant-dependent and is asserted too: the deficiency's severity_score is
          round(max(4.00, 2.00) * 0.6, 2) == 2.40 -> SIGNIFICANT_DEFICIENCY -> deficiency_weight 4.80,
          and because the classification is REVISION rather than RESTATEMENT the cycle's
          restatement_stage stays UNDER_EVALUATION instead of advancing to RESTATEMENT_DECLARED.
