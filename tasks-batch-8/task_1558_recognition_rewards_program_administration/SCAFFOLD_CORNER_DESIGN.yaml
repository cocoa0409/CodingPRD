  # ===========================================================================
  # Section: cross_cutting_layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_program_patch_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[program-config-stale-update]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH /api/programs/{id} with a stale expected_program_version is rejected 412 ERR_STALE_VERSION; replaying with the fresh version succeeds."
        test_recipe:
          setup: ["program created (version 1), then one successful PATCH moves it to version 2"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 1000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id, v0: $.data.version } }
            - { call: "PATCH /api/programs/${prog}", payload: { max_points_per_nomination: 2000, expected_program_version: "${v0}" }, as: HRAdmin, captures: { v1: $.data.version } }
          trigger:
            - { call: "PATCH /api/programs/${prog}", payload: { duplicate_window_days: 45, expected_program_version: "${v0}" }, as: HRAdmin, captures: { err: $.data.error_id } }
            - { call: "PATCH /api/programs/${prog}", payload: { duplicate_window_days: 45, expected_program_version: "${v1}" }, as: HRAdmin, captures: { dw: $.data.duplicate_window_days, v2: $.data.version } }
          assert:
            - "${err} == ERR_STALE_VERSION"
            - "${dw} == 45 and ${v2} == 3"

      - name: occ_nomination_approve_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[nomination-approve-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "An approver who read the nomination at version N is rejected 412 when the nominator resubmitted meanwhile (version advanced to N+2 via return+resubmit), because the reviewed content changed under them."
        test_recipe:
          setup: ["nomination returned for revision then resubmitted with changed points; approver holds the pre-return version"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 5000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin }
            - { call: "POST /api/employees", payload: { employee_ref: "M1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Nominee", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E2", full_name: "Nominator", department_id: "${dept}", hire_date: "2022-01-01", state_code: "CA" }, as: HRAdmin, captures: { n8r: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: PEER, points_requested: 100, reason_code: TEAMWORK, message: "v1", idempotency_key: "occ-nom-1" }, as: Employee, as_user_id: "${n8r}", captures: { nom: $.data.id, nom_v1: $.data.version } }
            - { call: "POST /api/nominations/${nom}/return-for-revision", payload: { feedback: "more detail" }, as: Manager, as_user_id: "${mgr}" }
            - { call: "POST /api/nominations/${nom}/resubmit", payload: { points_requested: 150, message: "v3" }, as: Employee, as_user_id: "${n8r}", captures: { nom_v3: $.data.version } }
          trigger:
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v1}" }, as: HRAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v3}" }, as: HRAdmin, captures: { st: $.data.status } }
          assert:
            - "${err} == ERR_STALE_VERSION"
            - "${st} == APPROVED"

      - name: occ_budget_adjustment_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[budget-adjustment-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "POST /api/budgets/{id}/adjustments with a stale expected_budget_version (an approval moved reserved->committed and bumped the version) is rejected 412; retrying with the fresh version applies."
        test_recipe:
          setup: ["budget with one approved nomination; client holds the pre-approval version"]
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "P", max_points_per_nomination: 10000, point_cost_rate_cents: 0.5, state_rate_map: { CA: 0.093 } }, as: HRAdmin, captures: { prog: $.data.id } }
            - { call: "POST /api/programs/${prog}/activate", payload: {}, as: HRAdmin }
            - { call: "POST /api/departments", payload: { name: "Eng", chargeback_account_code: "GL-ENG" }, as: HRAdmin, captures: { dept: $.data.id } }
            - { call: "POST /api/budgets", payload: { program_id: "${prog}", department_id: "${dept}", period_start_date: "2026-01-01", period_end_date: "2027-01-01", allocated_points: 10000 }, as: FinanceAdmin, captures: { bud: $.data.id, bud_v1: $.data.version } }
            - { call: "POST /api/employees", payload: { employee_ref: "M1", full_name: "Mgr", department_id: "${dept}", hire_date: "2020-03-01", state_code: "CA" }, as: HRAdmin, captures: { mgr: $.data.id } }
            - { call: "POST /api/employees", payload: { employee_ref: "E1", full_name: "Emp", department_id: "${dept}", manager_id: "${mgr}", hire_date: "2021-06-15", state_code: "CA" }, as: HRAdmin, captures: { emp: $.data.id } }
            - { call: "POST /api/nominations", payload: { program_id: "${prog}", nominee_id: "${emp}", type: MANAGER, points_requested: 700, reason_code: DELIVERY, message: "g", idempotency_key: "occ-bud-1" }, as: Manager, as_user_id: "${mgr}", captures: { nom: $.data.id, nom_v: $.data.version } }
            - { call: "POST /api/nominations/${nom}/approve", payload: { expected_nomination_version: "${nom_v}" }, as: HRAdmin }
          trigger:
            - { call: "POST /api/budgets/${bud}/adjustments", payload: { delta_allocated_points: 5000, reason: "stale topup", expected_budget_version: "${bud_v1}" }, as: FinanceAdmin, captures: { err: $.data.error_id } }
            - { call: "GET /api/budgets/${bud}", payload: {}, as: FinanceAdmin, captures: { bud_v2: $.data.version } }
            - { call: "POST /api/budgets/${bud}/adjustments", payload: { delta_allocated_points: 5000, reason: "fresh topup", expected_budget_version: "${bud_v2}" }, as: FinanceAdmin, captures: { alloc: $.data.allocated_points } }
          assert:
            - "${err} == ERR_STALE_VERSION"
            - "${alloc} == 15000"
            - "${bud_v2} > ${bud_v1} (nomination submit and approve each bumped the budget version)"

      - name: ledger_reconciliation_after_mixed_ops
        claim_type: derived_field_reconciliation
        grounds: [entities.Employee.fields.available_points, entities.PointLedgerEntry.fields.points]
        distinguishing_aspect: "After a mixed sequence (grant 3000, hold 1000, settle 400 of a different 400-point order, return-path refund), employee.available_points + held_points equals the exact sum of signed ledger points — derived fields reconcile with the append-only ledger."
