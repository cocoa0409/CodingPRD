            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}", zone: "ZONE_A", delivery_address: "1 Buf St", requested_gallons: 5, delivery_window_start: "2026-05-02T09:00:00Z", delivery_window_end: "2026-05-02T10:00:00Z" }
