              payload: { state_plan_id: "${plan_a}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_a: "$.data.id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_a}", event_code: "TOR", fips_codes: ["20173"], relay_class: "MANDATORY", priority: 1, forward_delay_seconds: 0 }
              captures: { rule_a: "$.data.id" }
          trigger:
