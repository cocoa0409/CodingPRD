scaffold_corner_design:
  - section: entities
    instances:
      - name: community_create_with_all_required_fields
        claim_type: creation
        grounds:
          - entities.Community
          - endpoints[POST /communities]
        distinguishing_aspect: "POST /communities with only the two required fields returns 201 and every declared field, including the computed ones at their initial values."
        test_recipe:
          setup:
            - "Empty database; the logical clock reads its mandatory startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING", "MEMORY_CARE"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id, c_v: $.data.version, c_pending: $.data.pending_dietitian_review_count, c_active: $.data.active_menu_cycle_id, c_cap: $.data.guest_meal_sponsor_cap_cents, c_tol: $.data.variance_tolerance_cents, c_created: $.data.created_at, c_updated: $.data.updated_at }
          assert:
            - "HTTP 201 and ${c_id} is a non-empty server-generated string"
            - "${c_v} == 1"
            - "${c_pending} == 0 and ${c_active} == null"
            - "${c_cap} == 20000 and ${c_tol} == 5000"
            - "${c_created} == ${c_updated} == 2026-08-01T00:00:00Z (the startup logical clock, never wall-clock time)"
            - "response_type == object and meta.api_request_id is present per the §1.0 envelope"
      - name: venue_get_returns_stored_and_initialised_fields
        claim_type: retrieval
        grounds:
          - entities.DiningVenue
          - endpoints[GET /venues/{id}]
        distinguishing_aspect: "GET /venues/{id} echoes exactly what POST /venues stored, including the three fields the create side-effect initialises rather than accepts."
        test_recipe:
          setup:
            - "One community, one SATELLITE venue created with seat_capacity 4 and care_levels_served MEMORY_CARE."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["MEMORY_CARE"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /venues"
              payload: { community_id: "${c_id}", name: "Aldergate Satellite", venue_kind: "SATELLITE", seat_capacity: 4, care_levels_served: ["MEMORY_CARE"] }
              as: ProgramAdministrator
              captures: { v_id: $.data.id }
          trigger:
            - call: "GET /venues/${v_id}"
              payload: {}
              as: SatelliteKitchenLead
              captures: { g_community: $.data.community_id, g_kind: $.data.venue_kind, g_cap: $.data.seat_capacity, g_status: $.data.status, g_posture: $.data.temp_compliance_posture, g_count: $.data.consecutive_temp_violation_count, g_v: $.data.version }
          assert:
            - "${g_community} == ${c_id} and ${g_kind} == SATELLITE and ${g_cap} == 4"
            - "${g_status} == OPEN, ${g_posture} == COMPLIANT and ${g_count} == 0"
            - "${g_v} == 1 (no write has touched the venue since creation)"
      - name: community_residents_list_paginates_with_total_count
        claim_type: listing
        grounds:
          - endpoints[GET /communities/{id}/residents]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The sub-resource list endpoint reports total_count over the whole filtered set while returning only the requested page, and has_more flips on the last page."
        test_recipe:
          setup:
            - "One community with exactly three ACTIVE residents."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Resident One", care_level: "ASSISTED_LIVING", baseline_weight_kg: 70.0 }
              as: ProgramAdministrator
              captures: { r1_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Resident Two", care_level: "ASSISTED_LIVING", baseline_weight_kg: 71.0 }
              as: ProgramAdministrator
              captures: { r2_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Resident Three", care_level: "ASSISTED_LIVING", baseline_weight_kg: 72.0 }
              as: ProgramAdministrator
              captures: { r3_id: $.data.id }
          trigger:
            - call: "GET /communities/${c_id}/residents"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdministrator
              captures: { p1_total: $.meta.total_count, p1_has_more: $.meta.has_more, p1_first: "$.data[0].id" }
            - call: "GET /communities/${c_id}/residents"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdministrator
              captures: { p2_total: $.meta.total_count, p2_has_more: $.meta.has_more, p2_first: "$.data[0].id" }
          assert:
            - "page 1 returns exactly 2 rows, ${p1_total} == 3 and ${p1_has_more} == true"
            - "page 2 returns exactly 1 row, ${p2_total} == 3 and ${p2_has_more} == false"
            - "${p1_first} == ${r1_id} and ${p2_first} == ${r3_id} (created_at ASC ordering, never id ordering)"
            - "meta.limit == 2 and meta.offset matches the request on both pages"
      - name: resident_get_unknown_id_not_found
        claim_type: not_found
        grounds:
          - errors[id=ERR_RESIDENT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unknown resident id on a path parameter returns the entity-specific 404, not a generic 400 or an empty 200."
        test_recipe:
          setup:
            - "One community exists; no resident has ever been created."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
          trigger:
            - call: "GET /residents/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ClinicalStaff
              captures: { nf_error: $.data.error_id, nf_message: $.data.message }
          assert:
            - "${nf_error} == ERR_RESIDENT_NOT_FOUND with HTTP 404"
            - "${nf_message} is a non-empty human-readable string"
            - "response_type == error per the §1.0 error envelope"
      - name: venue_create_missing_required_seat_capacity_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[id=ERR_INVALID_REQUEST]
          - endpoints[POST /venues]
        distinguishing_aspect: "seat_capacity has source input and no default, so omitting it is refused by the shape check at priority 3 before any existence or business rule runs."
        test_recipe:
          setup:
            - "One community exists."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /venues"
              payload: { community_id: "${c_id}", name: "Aldergate Main Dining", venue_kind: "MAIN_DINING", care_levels_served: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { req_error: $.data.error_id, req_message: $.data.message }
          assert:
            - "${req_error} == ERR_INVALID_REQUEST with HTTP 400"
            - "${req_message} names the missing field seat_capacity"
            - "no DiningVenue row was created: GET /communities/${c_id}/venues returns total_count 0"
      - name: venue_create_omitted_optional_fields_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.DiningVenue.fields.seating_turn_minutes
          - entities.DiningVenue.fields.turnover_buffer_minutes
          - entities.Community.fields.guest_meal_sponsor_cap_cents
        distinguishing_aspect: "Omitting seating_turn_minutes and turnover_buffer_minutes yields exactly 60 and 20 — the values the venue interval arithmetic then uses — while an explicit value overrides them."
        test_recipe:
          setup:
            - "One community exists."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /venues"
              payload: { community_id: "${c_id}", name: "Aldergate Default Dining", venue_kind: "MAIN_DINING", seat_capacity: 6, care_levels_served: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { d_turn: $.data.seating_turn_minutes, d_buffer: $.data.turnover_buffer_minutes }
            - call: "POST /venues"
              payload: { community_id: "${c_id}", name: "Aldergate Fast Turn Bistro", venue_kind: "BISTRO", seat_capacity: 6, care_levels_served: ["ASSISTED_LIVING"], seating_turn_minutes: 45, turnover_buffer_minutes: 5 }
              as: ProgramAdministrator
              captures: { e_turn: $.data.seating_turn_minutes, e_buffer: $.data.turnover_buffer_minutes }
          assert:
            - "${d_turn} == 60 and ${d_buffer} == 20"
            - "${e_turn} == 45 and ${e_buffer} == 5 (explicit values are not overwritten by the defaults)"
      - name: ticket_billed_amount_client_supplied_value_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.MealServiceTicket.fields.billed_amount_cents
          - calculations.ticket_billed_amount
        distinguishing_aspect: "billed_amount_cents has source computed; a client-supplied value in the create payload is discarded and the RESIDENT LUNCH rate of 650 is stored instead."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One community, one MAIN_DINING venue with seat_capacity 6, posture COMPLIANT."
            - "One ACTIVE resident with an APPROVED, ACTIVE REGULAR/THIN diet order."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /venues"
              payload: { community_id: "${c_id}", name: "Aldergate Main Dining", venue_kind: "MAIN_DINING", seat_capacity: 6, care_levels_served: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { v_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Ada Whitlock", care_level: "ASSISTED_LIVING", baseline_weight_kg: 68.0 }
              as: ProgramAdministrator
              captures: { r_id: $.data.id, r_v: $.data.version }
            - call: "POST /diet-orders"
              payload: { resident_id: "${r_id}", texture_level: "REGULAR", liquid_consistency: "THIN", expected_resident_version: "${r_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { do_id: $.data.id }
            - call: "POST /diet-orders/${do_id}/dietitian-review"
              payload: { decision: "APPROVE" }
              as: RegisteredDietitian
              as_user_id: "rd-1"
          trigger:
            - call: "POST /meal-tickets"
              payload: { venue_id: "${v_id}", ticket_type: "RESIDENT", service_date: "2026-08-10", meal_period: "LUNCH", resident_id: "${r_id}", billed_amount_cents: 1, status: "BILLED" }
              as: DiningServicesManager
              captures: { t_amount: $.data.billed_amount_cents, t_status: $.data.status, t_voided: $.data.voided_amount_cents }
          assert:
            - "${t_amount} == 650 — the supplied 1 is ignored and calculation ticket_billed_amount decides"
            - "${t_status} == ISSUED — the supplied BILLED is ignored, the state machine's initial_state decides"
            - "${t_voided} == 0"
      - name: menu_cycle_system_fields_stamped_on_create
        claim_type: system_fields
        grounds:
          - entities.MenuCycle
          - endpoints[POST /menu-cycles]
        distinguishing_aspect: "id, created_at, updated_at and version are stamped by the server from the logical clock, and version starts at 1 before any action endpoint touches the row."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T07:30:00Z."
            - "One community exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T07:30:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /menu-cycles"
              payload: { community_id: "${c_id}", cycle_number: 1, week_count: 2, effective_start_date: "2026-08-10", effective_end_date: "2026-08-23" }
              as: DiningServicesManager
              captures: { mc_id: $.data.id, mc_created: $.data.created_at, mc_updated: $.data.updated_at, mc_v: $.data.version, mc_status: $.data.status, mc_round: $.data.refresh_round, mc_index: $.data.refresh_index, mc_tier: $.data.refresh_tier }
          assert:
            - "${mc_created} == ${mc_updated} == 2026-08-05T07:30:00Z"
            - "${mc_v} == 1"
            - "${mc_status} == DRAFT, ${mc_round} == 0, ${mc_index} == 0.00 and ${mc_tier} == ADVISORY"
            - "${mc_id} is server-generated and is never used as an ordering or tie-break input anywhere"
      - name: diet_order_create_invalid_enum_texture_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.DietOrder.fields.texture_level
          - validations[priority=3]
          - errors[id=ERR_INVALID_REQUEST]
        distinguishing_aspect: "texture_level is a closed enum of four values; a plausible-but-undeclared value (SOFT) is refused at priority 3, ahead of the OCC check the same payload would also fail because the captured resident version has since been bumped."
        test_recipe:
          setup:
            - "One community and one ACTIVE resident whose version was captured as 1 at creation."
            - "A first diet order was then created for that resident, which bumped Resident.version to 2, so the still-held ${r_v} is now stale."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Bram Halvorsen", care_level: "ASSISTED_LIVING", baseline_weight_kg: 75.0 }
              as: ProgramAdministrator
              captures: { r_id: $.data.id, r_v: $.data.version }
            - call: "POST /diet-orders"
              payload: { resident_id: "${r_id}", texture_level: "BITE_SIZED", liquid_consistency: "THIN", expected_resident_version: "${r_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { do_first_id: $.data.id }
            - call: "GET /residents/${r_id}"
              payload: {}
              as: ClinicalStaff
              captures: { r_v2: $.data.version }
          trigger:
            - call: "POST /diet-orders"
              payload: { resident_id: "${r_id}", texture_level: "SOFT", liquid_consistency: "THIN", expected_resident_version: "${r_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { enum_error: $.data.error_id, enum_message: $.data.message }
          assert:
            - "${r_v} == 1 and ${r_v2} == 2 (the first order bumped the resident)"
            - "${enum_error} == ERR_INVALID_REQUEST with HTTP 400"
            - "${enum_error} != ERR_STALE_VERSION (priority 3 outranks priority 10, even though ${r_v} is genuinely stale)"
            - "${enum_message} names texture_level"
            - "GET /diet-orders?resident_id=${r_id} still returns total_count 1, only ${do_first_id}"
      - name: intake_observation_immutable_has_no_version_field
        claim_type: immutability
        grounds:
          - entities.IntakeObservation
          - endpoints[POST /residents/{id}/intake-observations]
          - endpoints[GET /residents/{id}/intake-observations]
        distinguishing_aspect: "IntakeObservation is declared common_fields: false — the create response and the list rows carry id and created_at but no version and no updated_at, and §1.5 exposes no update or delete route for it."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "One community and one ACTIVE resident."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Cleo Barrington", care_level: "ASSISTED_LIVING", baseline_weight_kg: 64.0 }
              as: ProgramAdministrator
              captures: { r_id: $.data.id }
          trigger:
            - call: "POST /residents/${r_id}/intake-observations"
              payload: { observation_date: "2026-08-10", meal_period: "BREAKFAST", intake_pct: 90 }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { obs_id: $.data.id, obs_created: $.data.created_at, obs_recorded_by: $.data.recorded_by_user_id }
            - call: "GET /residents/${r_id}/intake-observations"
              payload: { meal_period: "BREAKFAST" }
              as: ClinicalStaff
              captures: { list_id: "$.data[0].id", list_intake: "$.data[0].intake_pct" }
          assert:
            - "${obs_created} == 2026-08-10T09:00:00Z and ${obs_recorded_by} == cs-1"
            - "the create response contains no version and no updated_at key"
            - "${list_id} == ${obs_id} and ${list_intake} == 90"
            - "§1.5 declares no PUT, PATCH or DELETE route for intake observations, so the row can never be edited"
      - name: diet_order_create_unknown_resident_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=5]
          - errors[id=ERR_RESIDENT_NOT_FOUND]
          - entities.DietOrder.fields.resident_id
        distinguishing_aspect: "A body foreign key is validated for existence at priority 5, before the priority 10 OCC comparison it could not possibly pass, so an unknown resident_id yields 404 and not 412."
        test_recipe:
          setup:
            - "One community and one real ACTIVE resident, whose version is captured only so the OCC field can carry a server-issued value."
            - "The resident_id sent in the body belongs to no row."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${c_id}", full_name: "Vera Lindholm", care_level: "ASSISTED_LIVING", baseline_weight_kg: 63.0 }
              as: ProgramAdministrator
              captures: { real_r_id: $.data.id, real_r_v: $.data.version }
          trigger:
            - call: "POST /diet-orders"
              payload: { resident_id: "22222222-2222-4222-8222-222222222222", texture_level: "PUREED", liquid_consistency: "MILDLY_THICK", expected_resident_version: "${real_r_v}" }
              as: ClinicalStaff
              as_user_id: "cs-1"
              captures: { fk_error: $.data.error_id, fk_message: $.data.message }
          assert:
            - "${fk_error} == ERR_RESIDENT_NOT_FOUND with HTTP 404"
            - "${fk_error} != ERR_STALE_VERSION"
            - "no DietOrder row was created: GET /diet-orders returns total_count 0"
      - name: reservation_venue_from_another_community_returns_422
        claim_type: cross_reference_integrity
        grounds:
          - validations[priority=6]
          - errors[id=ERR_CROSS_COMMUNITY_REFERENCE]
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat topology means the two FKs on a reservation are only coherent if they agree on the community; a resident of community A booked into a venue of community B is refused at priority 6, ahead of the diet-order and capacity gates."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T09:00:00Z."
            - "Two communities A and B, each offering ASSISTED_LIVING."
            - "Resident RA belongs to community A; venue VB belongs to community B and serves ASSISTED_LIVING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T09:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { ca_id: $.data.id }
            - call: "POST /communities"
              payload: { name: "Brookdale Belmont", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { cb_id: $.data.id }
            - call: "POST /venues"
              payload: { community_id: "${cb_id}", name: "Belmont Main Dining", venue_kind: "MAIN_DINING", seat_capacity: 10, care_levels_served: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { vb_id: $.data.id, vb_v: $.data.version }
            - call: "POST /residents"
              payload: { community_id: "${ca_id}", full_name: "Dara Winslow", care_level: "ASSISTED_LIVING", baseline_weight_kg: 66.0 }
              as: ProgramAdministrator
              captures: { ra_id: $.data.id }
          trigger:
            - call: "POST /seating-reservations"
              payload: { resident_id: "${ra_id}", venue_id: "${vb_id}", service_date: "2026-08-11", meal_period: "LUNCH", seat_start_utc: "2026-08-11T12:00:00Z", party_size: 1, expected_venue_version: "${vb_v}" }
              as: DiningServicesManager
              captures: { xc_error: $.data.error_id, xc_message: $.data.message }
          assert:
            - "${xc_error} == ERR_CROSS_COMMUNITY_REFERENCE with HTTP 422"
            - "${xc_error} != ERR_DIET_ORDER_NOT_VERIFIED — priority 6 runs before priority 16, even though the resident has no approved order either"
            - "no SeatingReservation row was created and DiningVenue.${vb_id}.version is still ${vb_v}"

  - section: state_machines
    instances:
      - name: menu_cycle_draft_to_signoff_to_published_happy_path
        claim_type: valid_transition
        grounds:
          - state_machines.MenuCycle.DRAFT_to_PENDING_DIETITIAN_SIGNOFF
          - state_machines.MenuCycle.PENDING_DIETITIAN_SIGNOFF_to_PUBLISHED
          - entities.Community.fields.active_menu_cycle_id
        distinguishing_aspect: "Each declared trigger moves the cycle exactly one step, publish stamps signed_off_by_user_id with the acting dietitian, and the community's derived active_menu_cycle_id only appears once the cycle is PUBLISHED."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T08:00:00Z."
            - "One community with a DRAFT MenuCycle (2026-08-10 to 2026-08-16, week_count 1) owning one allergen-free REGULAR LUNCH item at day_index 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T08:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /communities"
              payload: { name: "Brookdale Aldergate", care_levels_offered: ["ASSISTED_LIVING"] }
              as: ProgramAdministrator
              captures: { c_id: $.data.id, active_before: $.data.active_menu_cycle_id }
            - call: "POST /menu-cycles"
              payload: { community_id: "${c_id}", cycle_number: 1, week_count: 1, effective_start_date: "2026-08-10", effective_end_date: "2026-08-16" }
              as: DiningServicesManager
              captures: { mc_id: $.data.id, status_draft: $.data.status }
            - call: "POST /menu-cycles/${mc_id}/items"
              payload: { item_code: "REG-COD", name: "Baked Cod", day_index: 1, meal_period: "LUNCH", base_texture: "REGULAR" }
              as: DiningServicesManager
