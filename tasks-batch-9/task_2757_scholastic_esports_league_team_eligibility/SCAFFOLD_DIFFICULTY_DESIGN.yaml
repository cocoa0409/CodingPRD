            - "season_match_point_pool_conservation holds at both ends: 3 == 3 + 0 while forfeited, and 0 == 0 + 0 after the reversal"
            - "Team.${tm_a_id}.wins, losses, draws, games_won and games_lost are all 0 throughout, because a forfeit never touched them and the reversal must not invent them"
