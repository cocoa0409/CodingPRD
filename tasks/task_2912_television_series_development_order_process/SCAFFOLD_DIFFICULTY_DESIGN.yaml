      - name: negotiation_open_then_withdrawn_restores_the_slate_episode_invariant
        grounds:
          - calculations.slate_episode_inventory
          - entities.Slate.fields.reserved_episode_count
          - entities.Slate.fields.available_episode_count
          - entities.Slate.fields.posture
          - endpoints["POST /negotiations"]
          - endpoints["POST /development-projects/{id}/abandon"]
        distinguishing_aspect: |
          Conserved quantity = episode inventory, an integer count rather than money,
          and the compensation is INDIRECT: the reservation is released by abandoning
          the project (which withdraws the negotiation as a cascade side effect),
          not by a matching inverse call on the negotiation itself. The invariant
          episode_capacity == available + reserved + committed must close, and posture
          must fall back to OPEN.
        test_recipe:
          setup:
            - "one PILOT_DELIVERED project with a CERTIFIED screening at 63.8, on a slate with episode_capacity 20"
            - "one open negotiation at episode_count 10, status NETWORK_OFFER"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
