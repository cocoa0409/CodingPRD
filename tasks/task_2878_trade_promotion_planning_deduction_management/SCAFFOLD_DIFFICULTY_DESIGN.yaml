              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "POST /trade-marketing/promotions/${promo_a_id}/tactics"
              payload: { tactic_type: "TPR", planned_units: 8000, window_start: "2026-08-03", window_end: "2026-08-31", rate_per_case: 1.25 }
              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "POST /trade-marketing/promotions/${promo_e_id}/documents"
              payload: { doc_class: "EVIDENCE", doc_type: "SCAN_DATA", covers_tactic_type: "TPR", received_at: "2026-08-03T00:00:00.000Z", units_verified: 1800 }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { doc_e_id: $.data.id }
            - call: "POST /trade-marketing/documents/${doc_e_id}/verify"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/promotions/${promo_a_id}/documents"
              payload: { doc_class: "EVIDENCE", doc_type: "SCAN_DATA", covers_tactic_type: "TPR", received_at: "2026-08-03T00:00:00.000Z", units_verified: 1800 }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { doc_a_id: $.data.id }
            - call: "POST /trade-marketing/documents/${doc_a_id}/verify"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/volume-facts"
              payload: { customer_id: "${cust_e_id}", brand_id: "${brand_id}", fact_type: "SHIPMENT", period_start: "2026-08-03", units: 2000, source: "EDI_856" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/volume-facts"
              payload: { customer_id: "${cust_a_id}", brand_id: "${brand_id}", fact_type: "SHIPMENT", period_start: "2026-08-03", units: 2000, source: "EDI_856" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/promotions/${promo_e_id}/submit"
              payload: {}
              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "POST /trade-marketing/promotions/${promo_e_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
            - call: "POST /trade-marketing/promotions/${promo_a_id}/submit"
              payload: {}
              as: KeyAccountManager
              as_user_id: "kam-1"
            - call: "POST /trade-marketing/promotions/${promo_a_id}/approve"
              payload: {}
              as: TradeMarketingDirector
              as_user_id: "dir-1"
            - call: "POST /trade-marketing/promotion-activation-runs"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/promotions/${promo_e_id}/accruals"
              payload: { period_start: "2026-08-03" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/promotions/${promo_a_id}/accruals"
              payload: { period_start: "2026-08-03" }
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
            - call: "POST /trade-marketing/deductions"
              payload: { customer_id: "${cust_e_id}", claim_reference: "CB-EV-0001", claimed_amount: 3000.00, deduction_date: "2026-09-07" }
              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { ded_e_id: $.data.id }
            - call: "POST /trade-marketing/deductions/${ded_e_id}/match"
              payload: { promotion_id: "${promo_e_id}" }
              as: DeductionSpecialist
              as_user_id: "ded-1"
            - call: "POST /trade-marketing/deductions"
              payload: { customer_id: "${cust_a_id}", claim_reference: "CB-AC-0001", claimed_amount: 3000.00, deduction_date: "2026-09-07" }
              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { ded_a_id: $.data.id }
            - call: "POST /trade-marketing/deductions/${ded_a_id}/match"
              payload: { promotion_id: "${promo_a_id}" }
              as: DeductionSpecialist
              as_user_id: "ded-1"
            - call: "GET /trade-marketing/promotions/${promo_e_id}"
              payload: {}
              as: TradeFinanceAnalyst
              as_user_id: "fin-1"
              captures: { promo_e_v: $.data.version }
            - call: "GET /trade-marketing/promotions/${promo_a_id}"
              payload: {}
