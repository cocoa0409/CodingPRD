            - "after ISSUED->ACKNOWLEDGED the same approve succeeds and CollectionScope.${s1}.status == APPROVED"

      - name: report_legal_review_requires_all_findings_final
        grounds:
          - state_machines.CaseReport.DRAFT_to_LEGAL_REVIEW
          - state_machines.Finding.CALIBRATED_to_FINAL
          - errors[ERR_FINDINGS_NOT_FINAL]
