# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_1614 airport-noise-abatement. 9 rules x 2-3 instances = 26 instances.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: correlation_strict_and_relaxed_variants_diverge
        grounds:
          - calculations.correlation_confidence_score
          - state_machines.NoiseComplaint.UNDER_REVIEW_to_CORRELATED
        distinguishing_aspect: |
          Same flight + same complainant zone: a complaint at dt=120s resolves under the
          STRICT variant (score 84.0) while one at dt=301s falls through to the RELAXED
          variant (score 71.2) — identical candidate flight, different variant selection
          and score. Entity domain: NoiseComplaint x FlightOperation (correlation).
        test_recipe:
          setup:
            - "Complainant in zone Z1; operator with one OPERATED flight at 2026-07-15T12:00:00Z in zone Z1"
            - "Two complaints from that complainant at occurred_at 12:02:00Z (dt=120) and 12:05:01Z (dt=301), both UNDER_REVIEW"
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "Corr One", email: "corr1@x.com", address_line: "1 Jet Way", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/operators", payload: { name: "Air One", iata_code: "AO", contact_email: "ops@airone.example" }, as: NoiseOfficeAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /noise-program/flight-operations", payload: { flight_number: "AO100", operator_id: "${op_id}", aircraft_type: "B738", engine_class: "STAGE_4", operation_type: "DEPARTURE", runway_code: "09L", scheduled_at: "2026-07-15T11:55:00Z", zone_code: "Z1" }, as: NoiseOfficeAdmin, captures: { fl_id: $.data.id } }
            - { call: "PATCH /noise-program/flight-operations/${fl_id}", payload: { status: "OPERATED", actual_at: "2026-07-15T12:00:00Z" }, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-15T12:02:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}", captures: { c1_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-15T12:05:01Z", channel: "PHONE", disturbance_type: "SLEEP_DISTURBANCE" }, as: Complainant, as_user_id: "${comp_id}", captures: { c2_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints/${c1_id}/begin-review", payload: {}, as: NoiseAnalyst, captures: { c1_v: $.data.version } }
            - { call: "POST /noise-program/noise-complaints/${c2_id}/begin-review", payload: {}, as: NoiseAnalyst, captures: { c2_v: $.data.version } }
          trigger:
            - { call: "POST /noise-program/noise-complaints/${c1_id}/correlate", payload: { flight_id: "${fl_id}", expected_complaint_version: "${c1_v}" }, as: NoiseAnalyst, captures: { c1_conf: $.data.correlation_confidence, c1_var: $.data.correlation_variant_used } }
            - { call: "POST /noise-program/noise-complaints/${c2_id}/correlate", payload: { flight_id: "${fl_id}", expected_complaint_version: "${c2_v}" }, as: NoiseAnalyst, captures: { c2_conf: $.data.correlation_confidence, c2_var: $.data.correlation_variant_used } }
          assert:
            - "c1_var == STRICT and c1_conf == 84.0 (100 - 40*(120/300))"
            - "c2_var == RELAXED and c2_conf == 71.2 (85 - 55*(301/1200))"
            - "NoiseComplaint.${c1_id}.substantiation_eligible == true and NoiseComplaint.${c2_id}.substantiation_eligible == true"
            - "FlightOperation.${fl_id}.linked_complaint_count == 2"

      - name: parcel_dnl_preliminary_final_variants_flip_eligibility
        grounds:
          - calculations.parcel_dnl_exposure
          - state_machines.NoiseStudy.PUBLIC_REVIEW_to_ADOPTED
        distinguishing_aspect: |
          Identical parcel inputs (measured 64.8, modeled 67.0): PRELIMINARY variant
          (study not ADOPTED) yields effective 65.5 -> INCOMPATIBLE_RESIDENTIAL /
          insulation_eligible true; FINAL variant (study ADOPTED) yields 64.8 ->
          COMPATIBLE_WITH_MEASURES / false. Entity domain: LandUseParcel x NoiseStudy.
        test_recipe:
          setup:
            - "Study in PUBLIC_REVIEW with one RESIDENTIAL parcel (measured 64.8, modeled 67.0)"
          setup_api_calls:
            - { call: "POST /noise-program/noise-studies", payload: { title: "Part150 Alpha", baseline_year: 2025 }, as: StudyCoordinator, captures: { st_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/start-data-collection", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/parcels", payload: { parcel_ref: "P-100", land_use: "RESIDENTIAL", dnl_db_measured: 64.8, dnl_db_modeled: 67.0, zone_code: "Z1" }, as: StudyCoordinator, captures: { p_id: $.data.id, eff_pre: $.data.dnl_db_effective, elig_pre: $.data.insulation_eligible } }
            - { call: "POST /noise-program/noise-studies/${st_id}/release-draft", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/open-public-comment", payload: {}, as: StudyCoordinator }
          trigger:
            - { call: "POST /noise-program/noise-studies/${st_id}/adopt", payload: {}, as: NoiseOfficeAdmin }
            - { call: "GET /noise-program/land-use-parcels/${p_id}", payload: {}, as: StudyCoordinator, captures: { eff_post: $.data.dnl_db_effective, compat_post: $.data.compatibility_status, elig_post: $.data.insulation_eligible } }
          assert:
            - "eff_pre == 65.5 and elig_pre == true (PRELIMINARY: 67.0 - 1.5)"
            - "eff_post == 64.8, compat_post == COMPATIBLE_WITH_MEASURES, elig_post == false (FINAL: measured verbatim)"

      - name: grant_provisional_vs_final_obligation_reconciled
        grounds:
          - calculations.grant_obligation_split
          - state_machines.SoundInsulationApplication_Funding.GRANT_COMMITTED_to_REIMBURSED
        distinguishing_aspect: |
          Same application, same tier: PROVISIONAL obligation on est_cost 7,777,777 cents
          totals 8,805,555; FINAL obligation on actual_cost 7,000,000 totals 7,950,000;
          the 855,555-cent delta is released reserved->available at disburse.
          Entity domain: SoundInsulationApplication x InsulationFund.
        test_recipe:
          setup:
            - "ACTIVE fund FY2027 (20,000,000) with intake covering the default clock 2026-08-01"
            - "ADOPTED study; RESIDENTIAL parcel (measured 72.0, modeled 73.0); application ELIGIBLE_TIER1 on est_cost 7,777,777"
          setup_api_calls:
            - { call: "POST /noise-program/insulation-funds", payload: { fiscal_year: "FY2027", total_allocation_cents: 20000000, intake_opens_at: "2026-07-01T00:00:00Z", intake_closes_at: "2026-09-30T00:00:00Z" }, as: NoiseOfficeAdmin, captures: { fund_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies", payload: { title: "Part150 Beta", baseline_year: 2025 }, as: StudyCoordinator, captures: { st_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/start-data-collection", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/parcels", payload: { parcel_ref: "P-200", land_use: "RESIDENTIAL", dnl_db_measured: 72.0, dnl_db_modeled: 73.0, zone_code: "Z2" }, as: StudyCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/release-draft", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/open-public-comment", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/adopt", payload: {}, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/sound-insulation-applications", payload: { parcel_id: "${p_id}", dwelling_type: "SINGLE_FAMILY", rooms_count: 5, est_cost_cents: 7777777 }, as: CommunityLiaison, captures: { app_id: $.data.id } }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/submit", payload: {}, as: CommunityLiaison }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/begin-screening", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/record-decision", payload: { decision: "ELIGIBLE_TIER1" }, as: StudyCoordinator }
            - { call: "GET /noise-program/insulation-funds/${fund_id}", payload: {}, as: NoiseOfficeAdmin, captures: { fund_v: $.data.version } }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/issue-offer", payload: { expected_fund_version: "${fund_v}" }, as: NoiseOfficeAdmin, captures: { offered: $.data.offered_amount_cents } }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/accept-offer", payload: {}, as: CommunityLiaison }
          trigger:
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/disburse", payload: { actual_cost_cents: 7000000 }, as: NoiseOfficeAdmin, captures: { disbursed: $.data.disbursed_cents } }
            - { call: "GET /noise-program/insulation-funds/${fund_id}", payload: {}, as: NoiseOfficeAdmin, captures: { f_avail: $.data.available_cents, f_res: $.data.reserved_cents, f_dis: $.data.disbursed_cents } }
          assert:
            - "offered == 8805555 (PROVISIONAL: 7,777,777 + 777,778 + 250,000)"
            - "disbursed == 7950000 (FINAL: 7,000,000 + 700,000 + 250,000)"
            - "f_avail == 12050000 and f_res == 0 and f_dis == 7950000"
            - "SoundInsulationApplication.${app_id}.funding_status == REIMBURSED"

  - rule_id: combinatorial_formula
    instances:
      - name: grant_split_round_per_component_then_sum_pinned
        grounds:
          - calculations.grant_obligation_split
        distinguishing_aspect: |
          Mode (b) nested rounding: TIER1 est_cost 1,111,115 -> structure 1,111,115,
          contingency round(111,111.5)=111,112, admin round(55,555.75)=55,556, total
          1,277,783. Forbidden sum-then-round order yields 1,277,782 — one cent apart.
        test_recipe:
          setup:
            - "ACTIVE fund FY2027 (5,000,000, intake covering 2026-08-01); ADOPTED study; SCHOOL parcel (measured 66.0, modeled 67.5) -> INCOMPATIBLE_RESIDENTIAL and institution (TIER1 permitted)"
            - "Application ELIGIBLE_TIER1 with est_cost_cents 1,111,115"
          setup_api_calls:
            - { call: "POST /noise-program/insulation-funds", payload: { fiscal_year: "FY2027", total_allocation_cents: 5000000, intake_opens_at: "2026-07-01T00:00:00Z", intake_closes_at: "2026-09-30T00:00:00Z" }, as: NoiseOfficeAdmin, captures: { fund_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies", payload: { title: "Part150 Gamma", baseline_year: 2025 }, as: StudyCoordinator, captures: { st_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/start-data-collection", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/parcels", payload: { parcel_ref: "P-300", land_use: "SCHOOL", dnl_db_measured: 66.0, dnl_db_modeled: 67.5, zone_code: "Z3" }, as: StudyCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/release-draft", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/open-public-comment", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/adopt", payload: {}, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/sound-insulation-applications", payload: { parcel_id: "${p_id}", dwelling_type: "SINGLE_FAMILY", rooms_count: 3, est_cost_cents: 1111115 }, as: CommunityLiaison, captures: { app_id: $.data.id } }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/submit", payload: {}, as: CommunityLiaison }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/begin-screening", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/record-decision", payload: { decision: "ELIGIBLE_TIER1" }, as: StudyCoordinator }
            - { call: "GET /noise-program/insulation-funds/${fund_id}", payload: {}, as: NoiseOfficeAdmin, captures: { fund_v: $.data.version } }
          trigger:
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/issue-offer", payload: { expected_fund_version: "${fund_v}" }, as: NoiseOfficeAdmin, captures: { offered: $.data.offered_amount_cents } }
          assert:
            - "offered == 1277783 (per-component rounding then sum; naive sum-then-round gives 1277782)"
            - "InsulationFund.${fund_id}.reserved_cents == 1277783 after issue"

      - name: curfew_score_tiered_engine_weights_and_grace_band
        grounds:
          - calculations.curfew_compliance_score
        distinguishing_aspect: |
          Mode (a) combinatorial: score combines engine-class tier weights (1.5/1.0/0.5),
          grace-band exclusion (minute 1334 in grace -> movement but not violation;
          1335 -> violation), applies_to scope (ARRIVAL not matched by DEPARTURE rule),
          and standing multiplier read BEFORE recompute. Result: movements 3,
          violations 2, score 800.0, standing WATCH.
        test_recipe:
          setup:
            - "Curfew rule: runway 09L, YEAR_ROUND, window [1320,1439], DEPARTURE, grace 15, effective all 2026"
            - "Operator with 4 OPERATED flights: F1 STAGE_3 DEP 22:35 (violation 150), F2 STAGE_5 DEP 22:40 (violation 50), F3 STAGE_4 DEP 22:34 (grace: movement only), F4 STAGE_4 ARR 22:50 (scope miss)"
          setup_api_calls:
            - { call: "POST /noise-program/operators", payload: { name: "Air Two", iata_code: "AT", contact_email: "ops@airtwo.example" }, as: NoiseOfficeAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /noise-program/curfew-rules", payload: { runway_code: "09L", season: "YEAR_ROUND", window_start_minute: 1320, window_end_minute: 1439, applies_to: "DEPARTURE", grace_minutes: 15, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/flight-operations", payload: { flight_number: "AT1", operator_id: "${op_id}", aircraft_type: "MD88", engine_class: "STAGE_3", operation_type: "DEPARTURE", runway_code: "09L", scheduled_at: "2026-08-10T22:30:00Z", zone_code: "Z1" }, as: NoiseOfficeAdmin, captures: { f1: $.data.id } }
            - { call: "POST /noise-program/flight-operations", payload: { flight_number: "AT2", operator_id: "${op_id}", aircraft_type: "A21N", engine_class: "STAGE_5", operation_type: "DEPARTURE", runway_code: "09L", scheduled_at: "2026-08-11T22:30:00Z", zone_code: "Z1" }, as: NoiseOfficeAdmin, captures: { f2: $.data.id } }
            - { call: "POST /noise-program/flight-operations", payload: { flight_number: "AT3", operator_id: "${op_id}", aircraft_type: "B738", engine_class: "STAGE_4", operation_type: "DEPARTURE", runway_code: "09L", scheduled_at: "2026-08-12T22:30:00Z", zone_code: "Z1" }, as: NoiseOfficeAdmin, captures: { f3: $.data.id } }
            - { call: "POST /noise-program/flight-operations", payload: { flight_number: "AT4", operator_id: "${op_id}", aircraft_type: "B738", engine_class: "STAGE_4", operation_type: "ARRIVAL", runway_code: "09L", scheduled_at: "2026-08-12T22:45:00Z", zone_code: "Z1" }, as: NoiseOfficeAdmin, captures: { f4: $.data.id } }
            - { call: "PATCH /noise-program/flight-operations/${f1}", payload: { status: "OPERATED", actual_at: "2026-08-10T22:35:00Z" }, as: NoiseOfficeAdmin, captures: { f1_mv: $.data.curfew_movement, f1_vi: $.data.curfew_violation } }
            - { call: "PATCH /noise-program/flight-operations/${f2}", payload: { status: "OPERATED", actual_at: "2026-08-11T22:40:00Z" }, as: NoiseOfficeAdmin }
            - { call: "PATCH /noise-program/flight-operations/${f3}", payload: { status: "OPERATED", actual_at: "2026-08-12T22:34:00Z" }, as: NoiseOfficeAdmin, captures: { f3_mv: $.data.curfew_movement, f3_vi: $.data.curfew_violation } }
            - { call: "PATCH /noise-program/flight-operations/${f4}", payload: { status: "OPERATED", actual_at: "2026-08-12T22:50:00Z" }, as: NoiseOfficeAdmin, captures: { f4_mv: $.data.curfew_movement } }
          trigger:
            - { call: "GET /noise-program/operators/${op_id}/compliance-summary", payload: { quarter: "2026-Q3" }, as: NoiseAnalyst, captures: { s_mov: $.data.curfew_movements, s_vio: $.data.curfew_violations, s_score: $.data.score, s_stand: $.data.standing } }
          assert:
            - "f1_mv == true and f1_vi == true; f3_mv == true and f3_vi == false; f4_mv == false"
            - "s_mov == 3 and s_vio == 2"
            - "s_score == 800.0 (1000 - 150 - 50) and s_stand == WATCH"

      - name: annoyance_tier_keyed_on_base_index_only
        grounds:
          - calculations.community_annoyance_index
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: base_index 38.5 keys tier MODERATE
          (+6 bonus) -> final 44.5; the tier MUST NOT be re-keyed to HIGH after the
          bonus even though 44.5 >= 40. Zone inputs: 4 distinct complainants (30d),
          9 substantiated complaints (90d), 11 curfew violations (90d).
        test_recipe:
          setup:
            - "Clock at 2026-08-20; zone ZA: 4 complainants; 9 complaints all correlated to one OPERATED flight at dt=120 zone-match (confidence 84.0) and closed SUBSTANTIATED"
            - "11 STAGE_4 DEPARTURE flights at 22:35 under a YEAR_ROUND DEPARTURE rule [1320,1439] grace 15 -> 11 violations in zone ZA"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/operators", payload: { name: "Air Three", iata_code: "A3", contact_email: "ops@airthree.example" }, as: NoiseOfficeAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /noise-program/curfew-rules", payload: { runway_code: "27R", season: "YEAR_ROUND", window_start_minute: 1320, window_end_minute: 1439, applies_to: "DEPARTURE", grace_minutes: 15, effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/complainants", payload: { full_name: "ZA One", email: "za1@x.com", address_line: "1 ZA St", zone_code: "ZA" }, as: CommunityLiaison, captures: { ca1: $.data.id } }
            - { call: "POST /noise-program/complainants", payload: { full_name: "ZA Two", email: "za2@x.com", address_line: "2 ZA St", zone_code: "ZA" }, as: CommunityLiaison, captures: { ca2: $.data.id } }
            - { call: "POST /noise-program/complainants", payload: { full_name: "ZA Three", email: "za3@x.com", address_line: "3 ZA St", zone_code: "ZA" }, as: CommunityLiaison, captures: { ca3: $.data.id } }
            - { call: "POST /noise-program/complainants", payload: { full_name: "ZA Four", email: "za4@x.com", address_line: "4 ZA St", zone_code: "ZA" }, as: CommunityLiaison, captures: { ca4: $.data.id } }
            - { call: "POST /noise-program/flight-operations", payload: { flight_number: "A3DAY", operator_id: "${op_id}", aircraft_type: "B738", engine_class: "STAGE_4", operation_type: "DEPARTURE", runway_code: "27R", scheduled_at: "2026-08-10T11:55:00Z", zone_code: "ZA" }, as: NoiseOfficeAdmin, captures: { day_flight: $.data.id } }
            - { call: "PATCH /noise-program/flight-operations/${day_flight}", payload: { status: "OPERATED", actual_at: "2026-08-10T12:00:00Z" }, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${ca1}", occurred_at: "2026-08-10T12:02:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${ca1}", captures: { k1: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${ca1}", occurred_at: "2026-08-10T12:02:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${ca1}", captures: { k2: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${ca1}", occurred_at: "2026-08-10T12:02:00Z", channel: "APP", disturbance_type: "LOW_FLYING" }, as: Complainant, as_user_id: "${ca1}", captures: { k3: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${ca2}", occurred_at: "2026-08-10T12:02:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${ca2}", captures: { k4: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${ca2}", occurred_at: "2026-08-10T12:02:00Z", channel: "PHONE", disturbance_type: "OTHER" }, as: Complainant, as_user_id: "${ca2}", captures: { k5: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${ca3}", occurred_at: "2026-08-10T12:02:00Z", channel: "EMAIL", disturbance_type: "VIBRATION" }, as: Complainant, as_user_id: "${ca3}", captures: { k6: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${ca3}", occurred_at: "2026-08-10T12:02:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${ca3}", captures: { k7: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${ca4}", occurred_at: "2026-08-10T12:02:00Z", channel: "APP", disturbance_type: "SLEEP_DISTURBANCE" }, as: Complainant, as_user_id: "${ca4}", captures: { k8: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${ca4}", occurred_at: "2026-08-10T12:02:00Z", channel: "WEB", disturbance_type: "GROUND_RUNUP" }, as: Complainant, as_user_id: "${ca4}", captures: { k9: $.data.id } }
            - { call: "POST /noise-program/noise-complaints/${k1}/begin-review", payload: {}, as: NoiseAnalyst, captures: { k1v: $.data.version } }
            - { call: "POST /noise-program/noise-complaints/${k2}/begin-review", payload: {}, as: NoiseAnalyst, captures: { k2v: $.data.version } }
            - { call: "POST /noise-program/noise-complaints/${k3}/begin-review", payload: {}, as: NoiseAnalyst, captures: { k3v: $.data.version } }
            - { call: "POST /noise-program/noise-complaints/${k4}/begin-review", payload: {}, as: NoiseAnalyst, captures: { k4v: $.data.version } }
            - { call: "POST /noise-program/noise-complaints/${k5}/begin-review", payload: {}, as: NoiseAnalyst, captures: { k5v: $.data.version } }
            - { call: "POST /noise-program/noise-complaints/${k6}/begin-review", payload: {}, as: NoiseAnalyst, captures: { k6v: $.data.version } }
            - { call: "POST /noise-program/noise-complaints/${k7}/begin-review", payload: {}, as: NoiseAnalyst, captures: { k7v: $.data.version } }
