            - { call: "POST /audit-work-orders/${wo}/assign", payload: { auditor_id: "${aud}" }, as: AuditManager }
            - { call: "POST /audit-work-orders/${wo}/records-requests", payload: { request_type: "PAYROLL_SUMMARY" }, as: AuditManager, captures: { req1: "$.data.id" } }
            - { call: "POST /records-requests/${req1}/receive", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { wo_v1: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_a}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z", gross_payroll_dollars: 40000, expected_work_order_version: "${wo_v1}" }, as: Auditor, as_user_id: "${aud}", captures: { al1: "$.data.id" } }
            - { call: "POST /payroll-allocations/${al1}/verify", payload: {}, as: Auditor, as_user_id: "${aud}" }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { tot1: "$.data.total_premium_base_dollars", wo_v2: "$.data.version" } }
            - { call: "POST /audit-work-orders/${wo}/payroll-allocations", payload: { class_code_id: "${cc_a}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", gross_payroll_dollars: 5000, expected_work_order_version: "${wo_v2}" }, as: Auditor, as_user_id: "${aud}", captures: { al2: "$.data.id" } }
            - { call: "GET /audit-work-orders/${wo}", payload: {}, as: AuditManager, captures: { tot2: "$.data.total_premium_base_dollars" } }
