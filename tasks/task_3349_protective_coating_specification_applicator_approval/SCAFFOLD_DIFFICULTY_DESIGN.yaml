            - call: "POST /coating/work-orders/${wo2_id}/applications/${ca2_id}/inspection-reports"
              payload:
                spot_dft_readings_mils: [10.0, 11.0, 12.0]
                adhesion_readings_psi: [600]
                holiday_count: 0
                tested_area_m2: 10.0
