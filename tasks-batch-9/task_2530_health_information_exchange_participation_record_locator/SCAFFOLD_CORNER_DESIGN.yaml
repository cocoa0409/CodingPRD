        excluded_because:
          difficulty_instance: cross_entity_state_dependency / locator_query_blocked_until_the_ccda_feed_leaves_provisioning
          rationale: "The blocked and permitted arms of the feed-state dependency are asserted there."
  - section: Endpoints
    instances:
      - name: consent_policy_create_read_and_list_round_trip
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_hie_consent_policies
          - endpoints.GET_hie_consent_policies_id
          - endpoints.GET_hie_consent_policies
          - entities.ConsentPolicy
          - errors.ERR_CONSENT_POLICY_NOT_FOUND
        distinguishing_aspect: |
          The create/read/list triad must agree on one row: the POST response, the single GET and the
          filtered list all report status DRAFT, directive_count 0, activated_by_user_id null and version
          1, and the list envelope carries total_count 1 / has_more false with the ?status=DRAFT filter
          applied. A GET on an unknown id returns ERR_CONSENT_POLICY_NOT_FOUND rather than an empty
          envelope. There is no update and no delete endpoint for this entity: generations are replaced
          by supersession, never edited.
        test_recipe:
          setup:
            - "No fixtures."
          setup_api_calls: []
          trigger:
            - call: "POST /hie/consent-policies"
              payload: { policy_version: "STATEWIDE-2026.3", model: "OPT_IN", sensitive_categories_segmented: ["BEHAVIORAL_HEALTH", "SUD"], default_share_for_treatment: false, effective_from: "2026-10-01T00:00:00Z", effective_until: "2027-10-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "privacy-policy-1"
              captures: { polE1_id: $.data.id, polE1_status: $.data.status, polE1_count: $.data.directive_count, polE1_actor: $.data.activated_by_user_id, polE1_ver: $.data.version, polE1_until: $.data.effective_until }
            - call: "GET /hie/consent-policies/${polE1_id}"
              payload: {}
              as: PrivacyOfficer
              captures: { polE1_r_version_label: $.data.policy_version, polE1_r_model: $.data.model, polE1_r_segmented: $.data.sensitive_categories_segmented, polE1_r_default: $.data.default_share_for_treatment, polE1_r_from: $.data.effective_from, polE1_r_status: $.data.status }
            - call: "GET /hie/consent-policies"
              payload: { status: "DRAFT" }
              as: PrivacyOfficer
              captures: { polE1_l_id: "$.data[0].id", polE1_l_status: "$.data[0].status" }
            - call: "GET /hie/consent-policies/00000000-0000-4000-8000-0000000000e1"
              payload: {}
              as: PrivacyOfficer
              captures: { errE1: $.data.error_id }
          assert:
            - "${polE1_status} == DRAFT"
            - "${polE1_count} == 0"
            - "${polE1_actor} == null"
            - "${polE1_ver} == 1"
            - "${polE1_until} == 2027-10-01T00:00:00Z"
            - "${polE1_r_version_label} == STATEWIDE-2026.3"
            - "${polE1_r_model} == OPT_IN"
            - "${polE1_r_segmented} == [BEHAVIORAL_HEALTH, SUD]"
            - "${polE1_r_default} == false"
            - "${polE1_r_from} == 2026-10-01T00:00:00Z"
            - "${polE1_r_status} == DRAFT"
            - "${polE1_l_id} == ${polE1_id}"
            - "${polE1_l_status} == DRAFT"
            - "meta.total_count == 1 and meta.has_more == false on the filtered list"
            - "${errE1} == ERR_CONSENT_POLICY_NOT_FOUND"
      - name: feed_suspend_and_restore_round_trip_removes_and_returns_the_sample_set
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_hie_data_feeds_id_status_transitions
          - state_machines.DataFeed.DEGRADED_to_SUSPENDED
          - state_machines.DataFeed.SUSPENDED_to_MONITORED
          - calculations.participant_quality_score.input_set
        distinguishing_aspect: |
          The action endpoint is exercised in both directions on the same feed, and each direction must
          re-run the scorecard: SUSPEND drops the feed's only sample from the qualifying set, so
          quality_score becomes null and grade UNGRADED even though sample_count stays 1; RESTORE puts it
          back and the score returns to exactly 98.78 grade A. The DataFeed.version increments on each
          transition (1 -> 2 after the first sample, 3 after SUSPEND, 4 after RESTORE) and
          status_reason is set by SUSPEND and cleared by RESTORE.
        test_recipe:
          setup:
            - "One participant at CONFORMANCE_TESTING with one ADT feed carrying a single clean sample (reject_rate 0.0125), so the feed is MONITORED and the participant scores 98.78 grade A."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Juniper Bluff Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 60000, primary_contact_email: "hie@juniperbluff.example" }
              as: HieAdmin
              captures: { pE2_id: $.data.id }
            - call: "POST /hie/participants/${pE2_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pE2_id}"
            - call: "POST /hie/participants/${pE2_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
              captures: { pE2_ver: $.data.version }
            - call: "POST /hie/participants/${pE2_id}/data-feeds"
              payload: { feed_type: "ADT", expected_participant_version: "${pE2_ver}" }
              as: HieAdmin
              captures: { feedE2_id: $.data.id, feedE2_v1: $.data.version, feedE2_gen: $.data.generation }
            - call: "POST /hie/data-feeds/${feedE2_id}/quality-samples"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", messages_received: 8000, messages_rejected: 100, required_fields_missing_count: 200, duplicate_count: 50, timeliness_p95_seconds: 250 }
              as: HieAdmin
            - call: "GET /hie/data-feeds/${feedE2_id}"
              payload: {}
              as: HieAdmin
              captures: { feedE2_status_1: $.data.status, feedE2_v2: $.data.version, feedE2_rate: $.data.latest_reject_rate }
            - call: "GET /hie/participants/${pE2_id}/scorecard"
              payload: {}
              as: HieAdmin
              captures: { scE2_score_1: $.data.quality_score, scE2_grade_1: $.data.grade, scE2_samples_1: $.data.samples_counted }
          trigger:
            - call: "POST /hie/data-feeds/${feedE2_id}/status-transitions"
              payload: { action: "SUSPEND", reason: "Interface engine migration window" }
              as: HieAdmin
              captures: { feedE2_status_2: $.data.status, feedE2_reason_2: $.data.status_reason, feedE2_v3: $.data.version, feedE2_count_2: $.data.sample_count }
            - call: "GET /hie/participants/${pE2_id}/scorecard"
              payload: {}
              as: HieAdmin
              captures: { scE2_samples_2: $.data.samples_counted, scE2_score_2: $.data.quality_score, scE2_grade_2: $.data.grade }
            - call: "POST /hie/data-feeds/${feedE2_id}/status-transitions"
              payload: { action: "RESTORE" }
              as: HieAdmin
              captures: { feedE2_status_3: $.data.status, feedE2_reason_3: $.data.status_reason, feedE2_v4: $.data.version }
            - call: "GET /hie/participants/${pE2_id}/scorecard"
              payload: {}
              as: HieAdmin
              captures: { scE2_samples_3: $.data.samples_counted, scE2_score_3: $.data.quality_score, scE2_grade_3: $.data.grade }
          assert:
            - "${feedE2_gen} == 1"
            - "${feedE2_v1} == 1"
            - "${feedE2_status_1} == MONITORED"
            - "${feedE2_v2} == 2"
            - "${feedE2_rate} == 0.0125"
            - "${scE2_score_1} == 98.78"
            - "${scE2_grade_1} == A"
            - "${scE2_samples_1} == 1"
            - "${feedE2_status_2} == SUSPENDED"
            - "${feedE2_reason_2} == Interface engine migration window"
            - "${feedE2_v3} == 3"
            - "${feedE2_count_2} == 1"
            - "${scE2_samples_2} == 0"
            - "${scE2_score_2} == null"
            - "${scE2_grade_2} == UNGRADED"
            - "${feedE2_status_3} == MONITORED"
            - "${feedE2_reason_3} == null"
            - "${feedE2_v4} == 4"
            - "${scE2_samples_3} == 1"
            - "${scE2_score_3} == 98.78"
            - "${scE2_grade_3} == A"
      - name: cluster_scoped_subscription_requires_both_endpoints_of_the_association
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_hie_participants_id_notification_subscriptions
          - endpoints.GET_hie_notification_subscriptions
          - errors.ERR_CLUSTER_NOT_FOUND
          - errors.ERR_PARTICIPANT_NOT_FOUND
          - validations.priority_8
        distinguishing_aspect: |
          A CLUSTER-scoped subscription is a link between a Participant (path) and an IdentityCluster
          (body), and both ends are resolved before anything is written: an unknown cluster_id in the body
          returns ERR_CLUSTER_NOT_FOUND (priority 8) and an unknown participant in the path returns
          ERR_PARTICIPANT_NOT_FOUND (priority 7), while the valid request creates a row that is
          retrievable from the subscriber side and from the cluster side through the
          ?cluster_id= filter.
        test_recipe:
          setup:
            - "A PROBABILISTIC_ONLY generation is ACTIVE and one participant at CONFORMANCE_TESTING has contributed one record, creating one ACTIVE cluster."
          setup_api_calls:
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "REF-PROB-E3", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfgE3_id: $.data.id }
            - call: "POST /hie/match-threshold-configs/${cfgE3_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
            - call: "POST /hie/participants"
              payload: { legal_name: "Kestrel Point Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 72000, primary_contact_email: "hie@kestrelpoint.example" }
              as: HieAdmin
              captures: { pE3_id: $.data.id }
