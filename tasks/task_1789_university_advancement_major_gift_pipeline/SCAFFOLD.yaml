# =============================================================================
# SCAFFOLD — University Advancement & Major Gift Pipeline
# =============================================================================

scenario: |
  University Advancement & Major Gift Pipeline (university development office): prospect research & capacity/affinity rating, portfolio assignment & moves-management stages, proposal & ask amount approval, gift agreement terms & naming opportunity, pledge schedule & reminder/write-off, restricted-fund establishment & stewardship report, campaign counting rules & credit splits, donor recognition society levels

domain_name: university-advancement
api_prefix: /advancement

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Fundraiser
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Fundraiser full name" }
      - { name: email, type: string, source: input, description: "Work email" }
      - { name: max_prospect_count, type: integer, source: input, description: "Portfolio capacity: maximum number of ACTIVE PortfolioAssignments", constraints: "positive integer" }
      - { name: max_open_ask_cents, type: integer, source: input, description: "Portfolio capacity: maximum aggregate open ask amount in cents", constraints: "positive integer" }
      - { name: current_prospect_count, type: integer, source: computed, default: 0, description: "Count of PortfolioAssignments with status ACTIVE for this fundraiser" }
      - { name: current_open_ask_cents, type: integer, source: computed, default: 0, description: "Sum of ask_amount_cents over Proposals in OPEN_PROPOSAL_STATES {UNDER_REVIEW, NEGOTIATING, APPROVED} whose prospect has an ACTIVE assignment to this fundraiser" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE", constraints: "initial ACTIVE; INACTIVE via deactivate" }

  - name: Prospect
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Prospect name" }
      - { name: prospect_type, type: enum, source: input, description: "INDIVIDUAL | ORGANIZATION" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: spouse_prospect_id, type: string, source: input, required: false, default: null, description: "FK -> Prospect.id; optional household link used for soft-credit suggestions" }
      - { name: research_status, type: enum, source: system, description: "IDENTIFIED | IN_SCREENING | RATED | DISQUALIFIED (cyclic: RATED -> IN_SCREENING on new assessment)" }
      - { name: moves_stage, type: enum, source: system, description: "QUALIFICATION | CULTIVATION | SOLICITATION | NEGOTIATION | STEWARDSHIP | CLOSED_LOST (parallel dimension to research_status)" }
      - { name: capacity_band, type: enum, source: system, default: null, description: "A | B | C | D | E, copied from the rated ResearchAssessment" , constraints: "null until first APPROVED assessment"}
      - { name: affinity_score, type: integer, source: system, default: null, description: "0-100, copied from the rated ResearchAssessment" }
      - { name: rated_assessment_id, type: string, source: system, default: null, description: "FK -> ResearchAssessment.id; currently effective approved assessment" }
      - { name: rated_adjusted_capacity_cents, type: integer, source: system, default: null, description: "Adjusted capacity copied from rated assessment; ask-amount ceiling at proposal submit" }
      - { name: lifetime_given_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over non-reversed GiftPayments with donor_prospect_id = this prospect" }
      - { name: outstanding_pledge_cents, type: integer, source: computed, default: 0, description: "Sum of outstanding_cents over Pledges with status ACTIVE for this prospect" }
      - { name: recognition_society_id, type: string, source: computed, default: null, description: "FK -> RecognitionSociety.id; highest level whose threshold_cash_cents <= CASH_ONLY recognition total; null when below all levels" }

  - name: ResearchAssessment
    parent: Prospect
    common_fields: true
    fields:
      - { name: prospect_id, type: string, source: system, description: "FK -> Prospect.id" }
      - { name: assessed_capacity_cents, type: integer, source: input, description: "Raw estimated giving capacity in cents", constraints: "positive integer" }
      - { name: engagement_score, type: integer, source: input, description: "0-100 engagement indicator" }
      - { name: philanthropy_score, type: integer, source: input, description: "0-100 philanthropy indicator" }
      - { name: recency_score, type: integer, source: input, description: "0-100 recency indicator" }
      - { name: evidence_tier, type: enum, source: input, description: "SELF_REPORTED | PUBLIC_RECORD | VERIFIED_DOCUMENT" }
      - { name: adjusted_capacity_cents, type: integer, source: computed, default: null, description: "= floor(assessed_capacity_cents * evidence multiplier); computed at approval" }
      - { name: capacity_band_result, type: enum, source: computed, default: null, description: "A | B | C | D | E from adjusted_capacity_cents; computed at approval" }
      - { name: affinity_score_result, type: integer, source: computed, default: null, description: "Weighted affinity 0-100; computed at approval" }
      - { name: created_by, type: string, source: system, description: "X-User-ID of the ProspectResearcher who created the assessment" }
      - { name: reviewed_by, type: string, source: system, default: null, description: "X-User-ID of the AdvancementDirector who reviewed" }
      - { name: review_rationale, type: string, source: input, required: false, default: null, description: "Optional rationale captured at review" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | SUPERSEDED" }

  - name: PortfolioAssignment
    parent: Fundraiser
    common_fields: true
    fields:
      - { name: fundraiser_id, type: string, source: system, description: "FK -> Fundraiser.id" }
      - { name: prospect_id, type: string, source: input, description: "FK -> Prospect.id" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED" }
      - { name: released_reason, type: enum, source: system, default: null, description: "GRADUATED | REBALANCING | DISQUALIFIED; set at release" }

  - name: Proposal
    parent: null
    common_fields: true
    fields:
      - { name: prospect_id, type: string, source: input, description: "FK -> Prospect.id" }
      - { name: proposal_type, type: enum, source: input, description: "OUTRIGHT | PLEDGE | PLANNED" }
      - { name: ask_amount_cents, type: integer, source: input, description: "Ask amount in cents", constraints: "positive integer" }
      - { name: designation_purpose, type: string, source: input, description: "Free-text designation" }
      - { name: approval_tier, type: enum, source: computed, default: null, description: "STANDARD | MAJOR | PRINCIPAL, computed at submit by approval_tier_determination" }
      - { name: effective_ask_cents, type: integer, source: computed, default: null, description: "Ask after type multiplier, used for tier thresholds; computed at submit" }
      - { name: pinned_capacity_band, type: enum, source: system, default: null, description: "Prospect.capacity_band pinned at submit time" }
      - { name: submitted_by, type: string, source: system, description: "X-User-ID of submitting GiftOfficer" }
      - { name: approvals_received, type: integer, source: system, default: 0, description: "Count of distinct VPAdvancement approvals (PRINCIPAL quorum = 2)" }
      - { name: approver_ids, type: array, source: system, default: [], description: "X-User-ID values of approvers who have approved this review round" }
      - { name: decided_by, type: string, source: system, default: null, description: "X-User-ID of the final decision-maker" }
      - { name: decision_rationale, type: string, source: system, default: null, description: "Rationale captured at review" }
      - { name: approved_at, type: datetime, source: system, default: null, description: "Logical clock timestamp when APPROVED; expiry = approved_at + 90 days" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_REVIEW | NEGOTIATING | RETURNED | APPROVED | REJECTED | SUPERSEDED | EXPIRED (cyclic via PATCH back to DRAFT)" }

  - name: NamingOpportunity
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Opportunity name (e.g., building, chair)" }
      - { name: category, type: enum, source: input, description: "BUILDING | ENDOWED_CHAIR | SCHOLARSHIP | PROGRAM" }
      - { name: price_floor_cents, type: integer, source: input, description: "Minimum agreement amount required to claim", constraints: "positive integer" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | RESERVED | OCCUPIED | RETIRED (cyclic: RESERVED/OCCUPIED -> AVAILABLE)" }
      - { name: reserved_by_agreement_id, type: string, source: system, default: null, description: "FK -> GiftAgreement.id; agreement holding the current reservation" }
      - { name: reserved_until, type: datetime, source: system, default: null, description: "Half-open reservation end: hold is [presented_at, reserved_until); expiry at exactly reserved_until" }

  - name: GiftAgreement
    parent: null
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: input, description: "FK -> Proposal.id (must be APPROVED)" }
      - { name: prospect_id, type: string, source: system, description: "FK -> Prospect.id; copied from proposal" }
      - { name: restriction_type, type: enum, source: input, description: "UNRESTRICTED | RESTRICTED_CURRENT_USE | ENDOWED" }
      - { name: purpose_code, type: string, source: input, required: false, default: null, description: "Required iff restriction_type != UNRESTRICTED" }
      - { name: naming_opportunity_id, type: string, source: input, required: false, default: null, description: "FK -> NamingOpportunity.id; optional naming claim" }
      - { name: agreement_amount_cents, type: integer, source: input, description: "Must equal the proposal's ask_amount_cents exactly", constraints: "positive integer, == proposal.ask_amount_cents" }
      - { name: reservation_expires_at, type: datetime, source: system, default: null, description: "Copied from NamingOpportunity.reserved_until at present time" }
      - { name: signature_status, type: enum, source: system, description: "DRAFT | PENDING_SIGNATURE | EXECUTED | RESCINDED" }
      - { name: compliance_status, type: enum, source: system, description: "COMPLIANT | STEWARDSHIP_LAPSED (parallel dimension, cyclic)" }

  - name: RestrictedFund
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: system, description: "FK -> GiftAgreement.id; establishing agreement" }
      - { name: purpose_code, type: string, source: system, description: "Copied from agreement" }
      - { name: is_endowed, type: boolean, source: system, description: "True when restriction_type == ENDOWED" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "Sum of non-reversed GiftPayments credited to this fund minus disbursements" }
      - { name: minimum_activation_cents, type: integer, source: system, default: 2500000, description: "Copied from constant MINIMUM_ACTIVATION_CENTS at establishment" }
      - { name: trailing_market_values, type: array, source: system, default: [], description: "List of {quarter_end, value_cents}, appended via valuations endpoint; quarter_end unique per fund" }
      - { name: spendable_fy_cents, type: integer, source: computed, default: 0, description: "Endowment spending allowance for the current fiscal year (endowed funds only; 0 for current-use)" }
      - { name: allowance_remaining_cents, type: integer, source: computed, default: 0, description: "spendable_fy_cents minus disbursements posted in the current fiscal year" }
      - { name: status, type: enum, source: system, description: "PENDING_MINIMUM | ACTIVE | SPENDING_FROZEN | CLOSED" }

  - name: Pledge
    parent: null
    common_fields: true
    fields:
      - { name: agreement_id, type: string, source: input, description: "FK -> GiftAgreement.id (must be EXECUTED, proposal_type PLEDGE)" }
      - { name: prospect_id, type: string, source: system, description: "FK -> Prospect.id; copied from agreement" }
      - { name: fund_id, type: string, source: system, default: null, description: "FK -> RestrictedFund.id; copied from agreement's established fund (null for UNRESTRICTED)" }
      - { name: campaign_id, type: string, source: input, required: false, default: null, description: "FK -> Campaign.id; optional campaign booking" }
      - { name: total_amount_cents, type: integer, source: input, description: "Pledge face value in cents", constraints: "positive integer" }
      - { name: installment_count, type: integer, source: input, description: "Number of installments", constraints: "integer 1..120" }
      - { name: frequency, type: enum, source: input, description: "MONTHLY | QUARTERLY | ANNUAL" }
      - { name: first_due_date, type: datetime, source: input, description: "Due date of installment 1" }
      - { name: written_off_cents, type: integer, source: computed, default: 0, description: "Total written off via approved PledgeWriteOffs" }
      - { name: outstanding_cents, type: integer, source: computed, description: "= sum(amount_cents - paid_cents - written_off_cents) over installments" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FULFILLED | WRITTEN_OFF | CANCELLED" }

  - name: PledgeInstallment
    parent: Pledge
    common_fields: true
    fields:
      - { name: pledge_id, type: string, source: system, description: "FK -> Pledge.id" }
      - { name: sequence_number, type: integer, source: system, description: "1-based schedule order" }
      - { name: due_date, type: datetime, source: system, description: "Computed from first_due_date + (sequence_number-1) x frequency with month-end clamping" }
      - { name: amount_cents, type: integer, source: system, description: "From installment_schedule_generation (front-loaded remainder)" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Sum of non-reversed applied allocations" }
      - { name: written_off_cents, type: integer, source: computed, default: 0, description: "Amount covered by approved write-offs" }
      - { name: reminder_count, type: integer, source: system, default: 0, description: "Number of reminders sent; max MAX_REMINDERS = 3" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | REMINDED | OVERDUE | PAID | WRITTEN_OFF" }

  - name: PledgeWriteOff
    parent: Pledge
    common_fields: true
    fields:
      - { name: pledge_id, type: string, source: system, description: "FK -> Pledge.id" }
      - { name: amount_cents, type: integer, source: input, description: "Amount to write off; must be <= pledge outstanding at request time", constraints: "positive integer" }
      - { name: reason, type: enum, source: input, description: "UNCOLLECTIBLE | DONOR_HARDSHIP | DUPLICATE | OTHER" }
      - { name: requested_by, type: string, source: system, description: "X-User-ID of requester" }
      - { name: decided_by, type: string, source: system, default: null, description: "X-User-ID of reviewing AdvancementDirector (must differ from requested_by)" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }

  - name: GiftPayment
    parent: null
    common_fields: true
    fields:
      - { name: donor_prospect_id, type: string, source: input, description: "FK -> Prospect.id (hard-credit donor)" }
      - { name: pledge_id, type: string, source: input, required: false, default: null, description: "FK -> Pledge.id; payment applies to its installments" }
      - { name: fund_id, type: string, source: input, required: false, default: null, description: "FK -> RestrictedFund.id; direct fund gift or must equal pledge.fund_id" }
      - { name: campaign_id, type: string, source: input, required: false, default: null, description: "FK -> Campaign.id; payment counts toward campaign when within counting window" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount", constraints: "positive integer" }
      - { name: received_at, type: datetime, source: input, description: "Date payment was received; drives campaign window test" }
      - { name: payment_method, type: enum, source: input, description: "CHECK | WIRE | CARD | STOCK" }
      - { name: corporate_matched, type: boolean, source: input, default: false, description: "Matched gifts count at MATCHED_GIFT_FACTOR (0.5) in campaign totals" }
      - { name: splits, type: array, source: input, required: false, default: null, description: "Optional list of {prospect_id, credit_type, split_pct}; exactly one HARD split to donor_prospect_id; integer percents summing to 100" }
      - { name: applied_allocations, type: array, source: computed, default: [], description: "Waterfall result: list of {installment_id, applied_cents} in (due_date ASC, sequence_number ASC) order" }
      - { name: reversed, type: boolean, source: system, default: false, description: "Set true by reverse endpoint" }
      - { name: reversed_at, type: datetime, source: system, default: null, description: "Logical clock timestamp of reversal" }

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Campaign name" }
      - { name: goal_cents, type: integer, source: input, description: "Campaign goal", constraints: "positive integer" }
      - { name: counting_start, type: datetime, source: input, description: "Inclusive counting window start" }
      - { name: counting_end, type: datetime, source: input, description: "Inclusive counting window end; must be > counting_start" }
      - { name: face_value_counted_cents, type: integer, source: computed, default: 0, description: "FACE_VALUE_BOOKING variant total" }
      - { name: cash_counted_cents, type: integer, source: computed, default: 0, description: "CASH_RECEIPTS variant total" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED | REPORTED" }

  - name: CampaignCreditSplit
    parent: Campaign
    common_fields: true
    fields:
      - { name: campaign_id, type: string, source: system, description: "FK -> Campaign.id; null when the payment has no campaign" }
      - { name: gift_payment_id, type: string, source: system, description: "FK -> GiftPayment.id" }
      - { name: prospect_id, type: string, source: system, description: "FK -> Prospect.id; credit recipient" }
      - { name: credit_type, type: enum, source: system, description: "HARD | SOFT" }
      - { name: split_pct, type: integer, source: system, description: "Integer percent 1..100 from request" }
      - { name: amount_cents, type: integer, source: computed, description: "From credit_split_rounding; largest split absorbs rounding residual" }

  - name: StewardshipReport
    parent: RestrictedFund
    common_fields: true
    fields:
      - { name: fund_id, type: string, source: system, description: "FK -> RestrictedFund.id" }
      - { name: period_start, type: datetime, source: input, description: "Closed-interval period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Closed-interval period end (inclusive); must be > period_start" }
      - { name: due_date, type: datetime, source: system, description: "= period_end + 90 days" }
      - { name: narrative, type: string, source: input, required: false, default: null, description: "Optional report narrative" }
      - { name: submitted_by, type: string, source: system, default: null, description: "X-User-ID of submitter" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | DELIVERED | OVERDUE" }

  - name: RecognitionSociety
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Society name" }
      - { name: level, type: enum, source: input, description: "BRONZE | SILVER | GOLD | PLATINUM; unique across societies" }
      - { name: threshold_cash_cents, type: integer, source: input, description: "CASH_ONLY total at or above which a prospect qualifies (>=)", constraints: "positive integer" }
      - { name: benefits_text, type: string, source: input, required: false, default: null, description: "Optional benefits description" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Prospect
    initial_state: "research_status=IDENTIFIED, moves_stage=QUALIFICATION (parallel dimensions)"
    terminal_states: [research_status=DISQUALIFIED, moves_stage=CLOSED_LOST]
    transitions:
      - from: research_status=IDENTIFIED
        to: research_status=IN_SCREENING
        trigger: "POST /advancement/prospects/{prospectId}/assessments (first assessment created)"
        actor: ProspectResearcher
        preconditions:
          - "prospect.research_status in {IDENTIFIED, RATED} (ERR_INVALID_MOVES_TRANSITION if DISQUALIFIED)"
        side_effects:
          - "prospect.research_status := IN_SCREENING; prospect.version += 1"
        note: "Creating an assessment for a RATED prospect re-opens screening (cyclic re-rating)."
      - from: research_status=RATED
        to: research_status=IN_SCREENING
        trigger: "POST /advancement/prospects/{prospectId}/assessments (re-screen)"
        actor: ProspectResearcher
        preconditions: []
        side_effects:
          - "prospect.research_status := IN_SCREENING; prospect.capacity_band/affinity_score/rated_assessment_id/rated_adjusted_capacity_cents remain from prior rating until a new approval"
          - "prospect.version += 1"
      - from: research_status=IN_SCREENING
        to: research_status=RATED
        trigger: "POST /advancement/assessments/{assessmentId}/review with decision=APPROVE"
        actor: AdvancementDirector
        preconditions:
          - "assessment.status == SUBMITTED (ERR_ASSESSMENT_NOT_REVIEWABLE)"
          - "reviewer X-User-ID != assessment.created_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "run capacity_affinity_rating; copy adjusted_capacity_cents, capacity_band_result, affinity_score_result onto assessment"
          - "prospect.research_status := RATED; prospect.capacity_band := result band; prospect.affinity_score := result affinity; prospect.rated_assessment_id := assessment.id; prospect.rated_adjusted_capacity_cents := adjusted_capacity_cents"
          - "any other ResearchAssessment of the same prospect with status APPROVED transitions to SUPERSEDED"
          - "prospect.version += 1"
      - from: "research_status in {IDENTIFIED, IN_SCREENING, RATED}"
        to: research_status=DISQUALIFIED
        trigger: "POST /advancement/prospects/{prospectId}/disqualify"
        actor: ProspectResearcher | AdvancementDirector
        preconditions:
          - "prospect.research_status != DISQUALIFIED (ERR_INVALID_MOVES_TRANSITION)"
        side_effects:
          - "every PortfolioAssignment with prospect_id = this prospect and status ACTIVE transitions to RELEASED with released_reason=DISQUALIFIED; owning Fundraiser.current_prospect_count decremented per release"
          - "every Proposal with prospect_id = this prospect and status in {DRAFT, UNDER_REVIEW, NEGOTIATING, RETURNED} transitions to REJECTED with decision_rationale='PROSPECT_DISQUALIFIED'; owning fundraisers' current_open_ask_cents recomputed"
          - "prospect.moves_stage unchanged; prospect.version += 1"
      - from: moves_stage=QUALIFICATION
        to: moves_stage=CULTIVATION
        trigger: "POST /advancement/prospects/{prospectId}/moves {target_stage: CULTIVATION}"
        actor: GiftOfficer (acting officer must hold an ACTIVE assignment; ERR_NOT_PROSPECT_OWNER)
        preconditions:
          - "prospect.moves_stage == QUALIFICATION (ERR_INVALID_MOVES_TRANSITION)"
          - "prospect.research_status != DISQUALIFIED (ERR_INVALID_MOVES_TRANSITION)"
        side_effects: ["prospect.version += 1"]
      - from: moves_stage=CULTIVATION
        to: moves_stage=SOLICITATION
        trigger: "POST /advancement/prospects/{prospectId}/moves {target_stage: SOLICITATION}"
        actor: GiftOfficer
        preconditions:
          - "prospect.moves_stage == CULTIVATION (ERR_INVALID_MOVES_TRANSITION)"
          - "prospect.research_status == RATED (ERR_PROSPECT_NOT_RATED)"
        side_effects: ["prospect.version += 1"]
      - from: moves_stage=SOLICITATION
        to: moves_stage=NEGOTIATION
        trigger: "POST /advancement/prospects/{prospectId}/moves {target_stage: NEGOTIATION}"
        actor: GiftOfficer
        preconditions:
          - "prospect.moves_stage == SOLICITATION (ERR_INVALID_MOVES_TRANSITION)"
          - "exists a Proposal with prospect_id = this prospect and status == APPROVED (ERR_INVALID_MOVES_TRANSITION)"
        side_effects: ["prospect.version += 1"]
      - from: "moves_stage in {SOLICITATION, NEGOTIATION, STEWARDSHIP}"
        to: moves_stage=CULTIVATION
        trigger: "POST /advancement/prospects/{prospectId}/moves {target_stage: CULTIVATION}"
        actor: GiftOfficer
        preconditions:
          - "prospect.moves_stage in {SOLICITATION, NEGOTIATION, STEWARDSHIP} (ERR_INVALID_MOVES_TRANSITION)"
        side_effects: ["prospect.version += 1"]
        note: "Backward moves make the moves pipeline cyclic (recultivation loops)."
      - from: moves_stage=CULTIVATION
        to: moves_stage=QUALIFICATION
        trigger: "POST /advancement/prospects/{prospectId}/moves {target_stage: QUALIFICATION}"
        actor: GiftOfficer
        preconditions:
          - "prospect.moves_stage == CULTIVATION (ERR_INVALID_MOVES_TRANSITION)"
        side_effects: ["prospect.version += 1"]
      - from: "moves_stage in {CULTIVATION, SOLICITATION, NEGOTIATION}"
        to: moves_stage=STEWARDSHIP
        trigger: "system (side effect of POST /advancement/agreements/{agreementId}/execute for this prospect)"
        actor: system
        preconditions: []
        side_effects: ["prospect.version += 1"]
        note: "Direct API move to STEWARDSHIP is forbidden (ERR_INVALID_MOVES_TRANSITION); only agreement execution lands here."
      - from: "moves_stage in {QUALIFICATION, CULTIVATION, SOLICITATION, NEGOTIATION, STEWARDSHIP}"
        to: moves_stage=CLOSED_LOST
        trigger: "POST /advancement/prospects/{prospectId}/moves {target_stage: CLOSED_LOST}"
        actor: GiftOfficer
        preconditions:
          - "prospect.moves_stage != CLOSED_LOST (ERR_INVALID_MOVES_TRANSITION)"
        side_effects: ["prospect.version += 1"]

  - entity: ResearchAssessment
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /advancement/assessments/{assessmentId}/review {decision: APPROVE}"
        actor: AdvancementDirector
        preconditions:
          - "assessment.status == SUBMITTED (ERR_ASSESSMENT_NOT_REVIEWABLE)"
          - "reviewer X-User-ID != assessment.created_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "run capacity_affinity_rating and copy results onto assessment and prospect (see Prospect RATED transition)"
          - "prior APPROVED assessment of same prospect -> SUPERSEDED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /advancement/assessments/{assessmentId}/review {decision: REJECT}"
        actor: AdvancementDirector
        preconditions:
          - "assessment.status == SUBMITTED (ERR_ASSESSMENT_NOT_REVIEWABLE)"
          - "reviewer X-User-ID != assessment.created_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
        note: "Prospect remains IN_SCREENING; a rejected rating never updates the prospect."
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (a newer assessment of the same prospect reaches APPROVED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PortfolioAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /advancement/assignments/{assignmentId}/release"
        actor: AdvancementDirector
        preconditions:
          - "assignment.status == ACTIVE (ERR_INVALID_MOVES_TRANSITION)"
        side_effects:
          - "fundraiser.current_prospect_count -= 1; fundraiser.current_open_ask_cents recomputed (subtract open proposals of this prospect)"
          - "fundraiser.version += 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "system (prospect disqualified)"
        actor: system
        preconditions: []
        side_effects:
          - "released_reason := DISQUALIFIED; fundraiser counters recomputed; fundraiser.version += 1"

  - entity: Proposal
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, EXPIRED]
    transitions:
      - from: "DRAFT | RETURNED | REJECTED | NEGOTIATING"
        to: UNDER_REVIEW
        trigger: "POST /advancement/proposals/{proposalId}/submit"
        actor: GiftOfficer (owner of the prospect's ACTIVE assignment)
        preconditions:
          - "proposal.status in {DRAFT, RETURNED, REJECTED, NEGOTIATING} (ERR_PROPOSAL_STATE_FORBIDS)"
          - "ask_amount_cents <= prospect.rated_adjusted_capacity_cents (ERR_ASK_EXCEEDS_CAPACITY)"
        side_effects:
          - "run approval_tier_determination; set approval_tier and effective_ask_cents"
          - "pinned_capacity_band := prospect.capacity_band; submitted_by := X-User-ID"
          - "approvals_received := 0; approver_ids := []; decided_by := null"
          - "owning fundraiser.current_open_ask_cents recomputed; fundraiser.version += 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /advancement/proposals/{proposalId}/review {decision: APPROVE}"
        actor: "AdvancementDirector when approval_tier == STANDARD; VPAdvancement when approval_tier in {MAJOR, PRINCIPAL} (ERR_TIER_APPROVAL_ROLE_VIOLATION otherwise)"
        preconditions:
          - "proposal.status == UNDER_REVIEW (ERR_PROPOSAL_NOT_UNDER_REVIEW)"
          - "reviewer X-User-ID != proposal.submitted_by (ERR_SEGREGATION_OF_DUTIES)"
          - "reviewer X-User-ID not already in approver_ids (ERR_DUPLICATE_APPROVAL)"
          - "STANDARD: exactly 1 approval; MAJOR: exactly 1 VP approval; PRINCIPAL: 2 distinct VP approvals (quorum) — first PRINCIPAL approval leaves status UNDER_REVIEW with approvals_received=1"
        side_effects:
          - "approvals_received += 1; approver_ids += reviewer; on final approval: decided_by := reviewer, approved_at := current logical clock"
          - "any other Proposal of the same prospect with status APPROVED -> SUPERSEDED"
          - "owning fundraiser.current_open_ask_cents unchanged (APPROVED remains in OPEN_PROPOSAL_STATES)"
      - from: UNDER_REVIEW
        to: NEGOTIATING
        trigger: "POST /advancement/proposals/{proposalId}/review {decision: NEGOTIATE}"
        actor: AdvancementDirector | VPAdvancement (tier-role rule as APPROVE)
        preconditions:
          - "proposal.status == UNDER_REVIEW (ERR_PROPOSAL_NOT_UNDER_REVIEW)"
          - "reviewer X-User-ID != proposal.submitted_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["decision_rationale captured"]
      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /advancement/proposals/{proposalId}/review {decision: RETURN}"
        actor: AdvancementDirector | VPAdvancement (tier-role rule as APPROVE)
        preconditions:
          - "proposal.status == UNDER_REVIEW (ERR_PROPOSAL_NOT_UNDER_REVIEW)"
          - "reviewer X-User-ID != proposal.submitted_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["decision_rationale captured"]
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /advancement/proposals/{proposalId}/review {decision: REJECT}"
        actor: AdvancementDirector | VPAdvancement (tier-role rule as APPROVE)
        preconditions:
          - "proposal.status == UNDER_REVIEW (ERR_PROPOSAL_NOT_UNDER_REVIEW)"
          - "reviewer X-User-ID != proposal.submitted_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by := reviewer; owning fundraiser.current_open_ask_cents recomputed (proposal leaves OPEN_PROPOSAL_STATES); fundraiser.version += 1"
      - from: "NEGOTIATING | RETURNED | REJECTED"
        to: DRAFT
        trigger: "PATCH /advancement/proposals/{proposalId} (edit ask_amount_cents / designation_purpose)"
        actor: GiftOfficer (owner)
        preconditions:
          - "proposal.status in {DRAFT, NEGOTIATING, RETURNED, REJECTED} (ERR_PROPOSAL_STATE_FORBIDS)"
        side_effects:
          - "status := DRAFT; approval_tier/effective_ask_cents/pinned_capacity_band cleared to null; approvals_received := 0; approver_ids := []"
          - "owning fundraiser.current_open_ask_cents recomputed if the proposal had been in an open state; fundraiser.version += 1"
        note: "The UNDER_REVIEW -> NEGOTIATING/RETURNED/REJECTED -> DRAFT -> UNDER_REVIEW loop is the cyclic negotiation path."
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (another proposal of the same prospect reaches APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "owning fundraiser.current_open_ask_cents recomputed (SUPERSEDED is not in OPEN_PROPOSAL_STATES); fundraiser.version += 1"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (clock sweep: current_utc > approved_at + 90 days and no GiftAgreement references this proposal)"
        actor: system
        preconditions: []
        side_effects:
          - "owning fundraiser.current_open_ask_cents recomputed; fundraiser.version += 1"

  - entity: GiftAgreement
    initial_state: "signature_status=DRAFT, compliance_status=COMPLIANT (parallel dimensions)"
    terminal_states: [signature_status=RESCINDED]
    transitions:
      - from: signature_status=DRAFT
        to: signature_status=PENDING_SIGNATURE
        trigger: "POST /advancement/agreements/{agreementId}/present"
        actor: GiftOfficer (owner)
        preconditions:
          - "signature_status == DRAFT (ERR_AGREEMENT_INVALID_STATE)"
          - "if naming_opportunity_id present: opportunity.status == AVAILABLE (ERR_NAMING_OPPORTUNITY_UNAVAILABLE)"
        side_effects:
          - "if naming_opportunity_id present: opportunity.status := RESERVED; reserved_by_agreement_id := agreement.id; reserved_until := current_utc + 14 days; agreement.reservation_expires_at := reserved_until; opportunity.version += 1"
      - from: signature_status=PENDING_SIGNATURE
        to: signature_status=EXECUTED
        trigger: "POST /advancement/agreements/{agreementId}/execute"
        actor: VPAdvancement
        preconditions:
          - "signature_status == PENDING_SIGNATURE (ERR_AGREEMENT_INVALID_STATE)"
          - "if naming_opportunity_id present: opportunity.status == RESERVED and reserved_by_agreement_id == agreement.id and current_utc < reservation_expires_at (ERR_RESERVATION_EXPIRED when lapsed; ERR_NAMING_OPPORTUNITY_UNAVAILABLE when held by another)"
        side_effects:
          - "if naming claimed: opportunity.status := OCCUPIED; opportunity.version += 1"
          - "if restriction_type in {RESTRICTED_CURRENT_USE, ENDOWED}: create RestrictedFund {agreement_id, purpose_code, is_endowed, balance_cents=0, status=PENDING_MINIMUM, minimum_activation_cents=MINIMUM_ACTIVATION_CENTS}"
          - "prospect.moves_stage := STEWARDSHIP (from CULTIVATION/SOLICITATION/NEGOTIATION); prospect.version += 1"
      - from: "signature_status in {DRAFT, PENDING_SIGNATURE, EXECUTED}"
        to: signature_status=RESCINDED
        trigger: "POST /advancement/agreements/{agreementId}/rescind"
        actor: VPAdvancement
        preconditions:
          - "signature_status != RESCINDED (ERR_AGREEMENT_INVALID_STATE)"
          - "no non-reversed GiftPayment references this agreement's pledge or its fund (ERR_RESCIND_BLOCKED_BY_PAYMENTS)"
        side_effects:
          - "if opportunity RESERVED/OCCUPIED by this agreement: opportunity.status := AVAILABLE, reserved_by_agreement_id := null, reserved_until := null; opportunity.version += 1"
          - "pledge of this agreement (if any) -> CANCELLED"
          - "established RestrictedFund (if any, balance must be 0) -> CLOSED"
      - from: compliance_status=COMPLIANT
        to: compliance_status=STEWARDSHIP_LAPSED
        trigger: "system (clock sweep: a StewardshipReport of this agreement's fund transitions to OVERDUE)"
        actor: system
        preconditions: []
        side_effects: ["agreement.version += 1"]
      - from: compliance_status=STEWARDSHIP_LAPSED
        to: compliance_status=COMPLIANT
        trigger: "system (the OVERDUE StewardshipReport reaches DELIVERED)"
        actor: system
        preconditions: []
        side_effects: ["agreement.version += 1"]

  - entity: RestrictedFund
    initial_state: PENDING_MINIMUM
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_MINIMUM
        to: ACTIVE
        trigger: "system (after a GiftPayment credit: balance_cents >= minimum_activation_cents)"
        actor: system
        preconditions: []
        side_effects: ["fund.version += 1"]
      - from: ACTIVE
        to: PENDING_MINIMUM
        trigger: "system (after a GiftPayment reversal or disbursement: balance_cents < minimum_activation_cents)"
        actor: system
        preconditions: []
        side_effects: ["fund.version += 1"]
      - from: ACTIVE
        to: SPENDING_FROZEN
        trigger: "system (clock sweep: a StewardshipReport of this fund transitions to OVERDUE)"
        actor: system
        preconditions: []
        side_effects:
          - "establishing GiftAgreement.compliance_status := STEWARDSHIP_LAPSED; agreement.version += 1"
          - "fund.version += 1"
      - from: SPENDING_FROZEN
        to: ACTIVE
        trigger: "system (the OVERDUE StewardshipReport reaches DELIVERED and no other report of this fund is OVERDUE)"
        actor: system
        preconditions: []
        side_effects:
          - "establishing GiftAgreement.compliance_status := COMPLIANT; agreement.version += 1"
          - "fund.version += 1"
      - from: "PENDING_MINIMUM | ACTIVE | SPENDING_FROZEN"
        to: CLOSED
        trigger: "system (establishing agreement rescinded with balance_cents == 0)"
        actor: system
        preconditions: []
        side_effects: ["fund.version += 1"]

  - entity: Pledge
    initial_state: ACTIVE
    terminal_states: [FULFILLED, WRITTEN_OFF, CANCELLED]
    transitions:
      - from: ACTIVE
        to: FULFILLED
        trigger: "system (after a GiftPayment allocation: every installment is PAID and written_off_cents == 0 on the pledge)"
        actor: system
        preconditions: []
        side_effects:
          - "prospect.outstanding_pledge_cents recomputed; prospect.version += 1"
          - "pledge.version += 1"
      - from: ACTIVE
        to: WRITTEN_OFF
        trigger: "system (after an approved PledgeWriteOff or payment: no installment remains in {SCHEDULED, REMINDED, OVERDUE} and at least one installment has written_off_cents > 0)"
        actor: system
        preconditions: []
        side_effects:
          - "campaign face_value_counted_cents decremented by written amount (FACE_VALUE_BOOKING nets out write-offs)"
          - "prospect.outstanding_pledge_cents recomputed; recognition recompute; prospect.version += 1"
          - "pledge.version += 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system (establishing agreement rescinded)"
        actor: system
        preconditions: []
        side_effects:
          - "prospect.outstanding_pledge_cents recomputed; campaign face_value_counted_cents nets out the unwritten remaining balance; prospect.version += 1"
          - "pledge.version += 1"

  - entity: PledgeInstallment
    initial_state: SCHEDULED
    terminal_states: [PAID, WRITTEN_OFF]
    transitions:
      - from: SCHEDULED
        to: REMINDED
        trigger: "POST /advancement/installments/{installmentId}/remind"
        actor: DonorRelationsOfficer
        preconditions:
          - "installment.status in {SCHEDULED, REMINDED, OVERDUE} (ERR_INSTALLMENT_NOT_REMINDABLE)"
          - "reminder_count < MAX_REMINDERS (3) (ERR_REMINDER_LIMIT_EXCEEDED)"
        side_effects: ["reminder_count += 1; installment.version += 1"]
      - from: "REMINDED | OVERDUE"
        to: REMINDED
        trigger: "POST /advancement/installments/{installmentId}/remind"
        actor: DonorRelationsOfficer
        preconditions:
          - "reminder_count < MAX_REMINDERS (3) (ERR_REMINDER_LIMIT_EXCEEDED)"
        side_effects: ["reminder_count += 1; installment.version += 1"]
      - from: "SCHEDULED | REMINDED"
        to: OVERDUE
        trigger: "system (clock sweep: current_utc > due_date + 30 days, strict >)"
        actor: system
        preconditions: []
        side_effects: ["installment.version += 1"]
      - from: "SCHEDULED | REMINDED | OVERDUE"
        to: PAID
        trigger: "system (a GiftPayment allocation brings paid_cents == amount_cents and written_off_cents == 0)"
        actor: system
        preconditions: []
        side_effects:
          - "pledge.outstanding_cents recomputed; if all installments PAID -> pledge FULFILLED"
          - "fund credit, campaign cash, prospect lifetime/recognition recomputes (see GiftPayment side effects)"
      - from: "SCHEDULED | REMINDED | OVERDUE"
        to: WRITTEN_OFF
        trigger: "system (an approved PledgeWriteOff allocation covers amount_cents fully with paid_cents == 0)"
        actor: system
        preconditions: []
        side_effects: ["pledge.outstanding_cents recomputed; pledge status re-evaluated"]
      - from: PAID
        to: "SCHEDULED | REMINDED | OVERDUE"
        trigger: "system (the covering GiftPayment is reversed)"
        actor: system
        preconditions: []
        side_effects:
          - "paid_cents reduced by reversed allocations; status recomputed: OVERDUE when current_utc > due_date + 30 days, else REMINDED when reminder_count > 0, else SCHEDULED"
          - "pledge status re-evaluated (FULFILLED -> ACTIVE)"

  - entity: PledgeWriteOff
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /advancement/write-offs/{writeOffId}/review {decision: APPROVE}"
        actor: AdvancementDirector
        preconditions:
          - "write_off.status == PENDING (ERR_WRITE_OFF_NOT_PENDING)"
          - "reviewer X-User-ID != requested_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "amount_cents allocated to installments latest-first (due_date DESC, sequence_number DESC); each fully covered installment with paid_cents == 0 -> WRITTEN_OFF; partial coverage adds to installment.written_off_cents; an installment with paid_cents > 0 that becomes fully covered -> PAID"
          - "pledge.written_off_cents += amount; pledge.outstanding_cents recomputed; pledge status re-evaluated (WRITTEN_OFF when no open installments remain and some written_off_cents > 0)"
          - "campaign face_value_counted_cents nets out written amount; prospect outstanding/recognition recomputed"
      - from: PENDING
        to: REJECTED
        trigger: "POST /advancement/write-offs/{writeOffId}/review {decision: REJECT}"
        actor: AdvancementDirector
        preconditions:
          - "write_off.status == PENDING (ERR_WRITE_OFF_NOT_PENDING)"
          - "reviewer X-User-ID != requested_by (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []

  - entity: NamingOpportunity
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: RESERVED
        trigger: "system (POST /advancement/agreements/{agreementId}/present claims it)"
        actor: system
        preconditions: []
        side_effects: ["reserved_by_agreement_id and reserved_until set (half-open window [now, now + 14 days))"]
      - from: RESERVED
        to: OCCUPIED
        trigger: "system (holding agreement executed)"
        actor: system
        preconditions: []
        side_effects: ["reserved_until kept for audit"]
      - from: RESERVED
        to: AVAILABLE
        trigger: "system (clock sweep: current_utc >= reserved_until, i.e. the half-open end is free; or holding agreement rescinded)"
        actor: system
        preconditions: []
        side_effects: ["reserved_by_agreement_id := null; reserved_until := null"]
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "system (holding agreement rescinded)"
        actor: system
        preconditions: []
        side_effects: ["reserved_by_agreement_id := null; reserved_until := null"]
      - from: "AVAILABLE | RESERVED"
        to: RETIRED
        trigger: "POST /advancement/naming-opportunities/{opportunityId}/retire"
        actor: VPAdvancement
        preconditions:
          - "opportunity.status in {AVAILABLE, RESERVED} (ERR_NAMING_OPPORTUNITY_UNAVAILABLE when OCCUPIED or RETIRED)"
        side_effects: ["a RESERVED opportunity's holding agreement keeps signature_status but loses its claim; execute then fails ERR_NAMING_OPPORTUNITY_UNAVAILABLE"]

  - entity: StewardshipReport
    initial_state: DRAFT
    terminal_states: [DELIVERED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /advancement/stewardship-reports/{reportId}/submit"
        actor: DonorRelationsOfficer
        preconditions:
          - "report.status in {DRAFT, OVERDUE} (ERR_REPORT_TRANSITION_INVALID)"
        side_effects: ["submitted_by := X-User-ID"]
      - from: OVERDUE
        to: SUBMITTED
        trigger: "POST /advancement/stewardship-reports/{reportId}/submit"
        actor: DonorRelationsOfficer
        preconditions: []
        side_effects: ["catch-up path; fund/agreement remain frozen until DELIVERED"]
      - from: SUBMITTED
        to: DELIVERED
        trigger: "POST /advancement/stewardship-reports/{reportId}/deliver"
        actor: DonorRelationsOfficer
        preconditions:
          - "report.status == SUBMITTED (ERR_REPORT_TRANSITION_INVALID)"
        side_effects:
          - "if no other report of the fund is OVERDUE: fund SPENDING_FROZEN -> ACTIVE; establishing agreement.compliance_status := COMPLIANT"
      - from: DRAFT
        to: OVERDUE
        trigger: "system (clock sweep: current_utc > due_date, strict >)"
        actor: system
        preconditions: []
        side_effects:
          - "fund ACTIVE -> SPENDING_FROZEN (PENDING_MINIMUM funds are not frozen)"
          - "establishing agreement.compliance_status := STEWARDSHIP_LAPSED"

  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [REPORTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /advancement/campaigns/{campaignId}/activate"
        actor: VPAdvancement
        preconditions:
          - "campaign.status == DRAFT (ERR_CAMPAIGN_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /advancement/campaigns/{campaignId}/close"
        actor: VPAdvancement
        preconditions:
          - "campaign.status == ACTIVE (ERR_CAMPAIGN_INVALID_STATE)"
        side_effects: ["counted totals frozen at close; later payments/write-offs referencing it are rejected"]
      - from: CLOSED
        to: REPORTED
        trigger: "POST /advancement/campaigns/{campaignId}/report"
        actor: VPAdvancement
        preconditions:
          - "campaign.status == CLOSED (ERR_CAMPAIGN_INVALID_STATE)"
        side_effects: []

  - entity: Fundraiser
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /advancement/fundraisers/{fundraiserId}/deactivate"
        actor: VPAdvancement
        preconditions:
          - "fundraiser.status == ACTIVE (ERR_INVALID_MOVES_TRANSITION)"
          - "fundraiser.current_prospect_count == 0 (ERR_FUNDRAISER_HAS_ACTIVE_ASSIGNMENTS)"
        side_effects: ["fundraiser.version += 1"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: proposal-create-stale-prospect
    parent_entity: Prospect
    write_endpoint: "POST /advancement/proposals"
    occ_field: expected_prospect_version
    description: |
      Creating a Proposal against a Prospect whose version has advanced since the
      client last observed it is rejected with ERR_STALE_VERSION. This captures the
      case where another writer has just mutated the prospect (e.g., a new
      assessment approval changed the capacity band, or a moves-stage change), so
      the writer's view of the prospect's rating context is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: assignment-create-stale-fundraiser
    parent_entity: Fundraiser
    write_endpoint: "POST /advancement/fundraisers/{fundraiserId}/assignments"
    occ_field: expected_fundraiser_version
    description: |
      Creating a PortfolioAssignment against a Fundraiser whose version has
      advanced since the client last observed it is rejected with
      ERR_STALE_VERSION. This captures the case where another writer has just
      assigned or released a prospect on the same fundraiser (mutating
      current_prospect_count / current_open_ask_cents), so the writer's capacity
      view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: capacity_affinity_rating
    trigger: "POST /advancement/assessments/{assessmentId}/review with decision=APPROVE"
    algorithm: weighted_scoring
    description: "Derives adjusted capacity, capacity band, and affinity score from one ResearchAssessment."
    formula: |
      mult = EVIDENCE_MULTIPLIER[assessment.evidence_tier]
      adjusted_capacity_cents = floor(assessment.assessed_capacity_cents * mult)
      band = A if adjusted_capacity_cents >= BAND_A_MIN
             else B if >= BAND_B_MIN
             else C if >= BAND_C_MIN
             else D if >= BAND_D_MIN
             else E            # band thresholds use >= (inclusive lower bound)
      affinity_score_result = round_half_up(0.5*engagement_score + 0.3*philanthropy_score + 0.2*recency_score)  # integer 0..100
    input_set: "Exactly the ResearchAssessment being approved; no other rows participate."
    constants:
      EVIDENCE_MULTIPLIER_SELF_REPORTED: 0.6
      EVIDENCE_MULTIPLIER_PUBLIC_RECORD: 0.8
      EVIDENCE_MULTIPLIER_VERIFIED_DOCUMENT: 1.0
      BAND_A_MIN: 1000000000
      BAND_B_MIN: 100000000
      BAND_C_MIN: 25000000
      BAND_D_MIN: 5000000
    precision: "integer cents (floor for capacity); affinity integer, round_half_up"

  - name: campaign_counted_totals
    trigger: "Recomputed on every GiftPayment create/reverse, every Pledge create, every approved PledgeWriteOff, and every Pledge cancellation that references the campaign."
    algorithm: aggregation
    description: "Campaign totals under two official counting variants; both are stored denormalized on Campaign."
    formula: |
      FACE_VALUE_BOOKING:
        face = sum over Pledges p where p.campaign_id == campaign.id
               and p.created_at within [counting_start, counting_end] inclusive
               and p.status in {ACTIVE, FULFILLED, WRITTEN_OFF}:
               (p.total_amount_cents - p.written_off_cents)
             + sum over GiftPayments g where g.campaign_id == campaign.id
               and g.pledge_id is null and not g.reversed
               and g.received_at within [counting_start, counting_end] inclusive:
               (g.amount_cents * (MATCHED_GIFT_FACTOR if g.corporate_matched else 1))
        # CANCELLED pledges contribute 0 (their remaining balance nets out on cancel;
        # written_off_cents netting applies only to WRITTEN_OFF/ACTIVE/FULFILLED rows).
      CASH_RECEIPTS:
        cash = sum over GiftPayments g where g.campaign_id == campaign.id
               and not g.reversed
               and g.received_at within [counting_start, counting_end] inclusive:
               (g.amount_cents * (MATCHED_GIFT_FACTOR if g.corporate_matched else 1))
        # Matched amounts are floor(g.amount_cents * 0.5) per payment.
      Both variants: amounts multiplied by MATCHED_GIFT_FACTOR use floor per payment.
    input_set: "Pledges booked to the campaign (status ACTIVE/FULFILLED/WRITTEN_OFF, created in window) for FACE; non-reversed payments received in window for CASH. CLOSED/REPORTED campaigns keep the totals frozen at close time."
    constants:
      MATCHED_GIFT_FACTOR: 0.5
    precision: "integer cents; matched amounts floored per payment before summing"
    variants:
      - name: FACE_VALUE_BOOKING
        when: "Board/booking reporting; counts booked pledges net of write-offs plus outright (non-pledge) payments"
        difference: "Counts pledge face value at booking even when no cash received; ignores pledge-linked payments"
      - name: CASH_RECEIPTS
        when: "Cash-flow reporting; counts only non-reversed payments received in the window"
        difference: "Ignores unpaid pledge balances entirely; counts pledge-linked payments that FACE excludes"

  - name: recognition_society_scoring
    trigger: "Recomputed on every GiftPayment create/reverse, Pledge create, approved PledgeWriteOff, and Pledge cancellation touching the prospect; membership also re-read by GET /advancement/prospects/{prospectId}/recognition."
    algorithm: threshold
    description: "Two totals per prospect; membership uses CASH_ONLY, projection uses COMPREHENSIVE."
    formula: |
      CASH_ONLY      = prospect.lifetime_given_cents
      COMPREHENSIVE  = prospect.lifetime_given_cents
                     + sum of outstanding_cents over Pledges with status ACTIVE for the prospect
                     + sum of CampaignCreditSplit.amount_cents with credit_type SOFT and prospect_id = prospect.id
                       whose GiftPayment is not reversed
      member_level    = highest RecognitionSociety.level with threshold_cash_cents <= CASH_ONLY   (>= boundary; null if none)
      projected_level = highest RecognitionSociety.level with threshold_cash_cents <= COMPREHENSIVE (null if none)
      Level rank order: BRONZE < SILVER < GOLD < PLATINUM. Ties between societies of equal threshold: the society with the lower level rank wins; further ties broken by created_at ASC.
    input_set: "Non-reversed payments hard-credited to the prospect (CASH_ONLY); ACTIVE pledges + non-reversed SOFT splits (COMPREHENSIVE additions)."
    constants: {}
    precision: "integer cents"
    variants:
      - name: CASH_ONLY
        when: "Official recognition society membership"
        difference: "Counts only settled hard-credit cash; pledges and soft credits excluded"
      - name: COMPREHENSIVE
        when: "Projection shown in the recognition read endpoint"
        difference: "Adds ACTIVE pledge outstanding balances and soft credits; same prospect can project higher than its membership"

  - name: approval_tier_determination
    trigger: "POST /advancement/proposals/{proposalId}/submit"
    algorithm: threshold
    description: "Maps a proposal to an approval tier using 4 inputs with conditional branches (combinatorial mode a)."
    formula: |
      effective_ask_cents = round_half_up(ask_amount_cents * TYPE_MULTIPLIER[proposal_type])
      base_tier = STANDARD  if effective_ask_cents <  TIER_MAJOR_MIN
                  MAJOR     if TIER_MAJOR_MIN <= effective_ask_cents <  TIER_PRINCIPAL_MIN
                  PRINCIPAL if effective_ask_cents >= TIER_PRINCIPAL_MIN   # >= boundary
      # Trusted-capacity shift: an INDIVIDUAL prospect with pinned band A shifts one tier down
      # (PRINCIPAL->MAJOR, MAJOR->STANDARD, STANDARD stays STANDARD).
      # ORGANIZATION prospects never shift (no personal-relationship discount).
      if prospect.prospect_type == INDIVIDUAL and prospect.capacity_band == A:
          tier = one_step_down(base_tier)
      else:
          tier = base_tier
      Approval requirement: STANDARD -> one AdvancementDirector approval;
      MAJOR -> one VPAdvancement approval; PRINCIPAL -> two distinct VPAdvancement approvals.
    input_set: "The proposal being submitted plus its prospect's prospect_type and current capacity_band (pinned onto the proposal at submit)."
    constants:
      TYPE_MULTIPLIER_OUTRIGHT: 1.0
      TYPE_MULTIPLIER_PLEDGE: 1.0
      TYPE_MULTIPLIER_PLANNED: 0.5
      TIER_MAJOR_MIN: 25000000
      TIER_PRINCIPAL_MIN: 100000000
    precision: "integer cents; effective_ask round_half_up"

  - name: credit_split_rounding
    trigger: "POST /advancement/gift-payments when the optional splits array is present"
    algorithm: waterfall_allocation
    description: "Allocates a payment across credit splits; nested rounding with a pinned order (combinatorial mode b)."
    formula: |
      Validate: exactly one split with credit_type HARD and prospect_id == donor_prospect_id;
      all split_pct integers in 1..100; sum(split_pct) == 100 (ERR_SPLIT_PERCENT_SUM_INVALID).
      Order: sort splits by (split_pct ASC, request array index ASC).
      For every split except the LAST in that order (the largest split):
          amount = round_half_up(payment.amount_cents * split_pct / 100)
      Last (largest) split: amount = payment.amount_cents - sum(previous rounded amounts)
      # Rounding the largest split first and giving the residual to the smallest would
      # produce different cents; the pinned order is smallest-rounded-first, largest absorbs.
      Tie between equal percentages: request array index ASC (first listed is 'smaller').
      CampaignCreditSplit rows are created for every split. When the payment has a
      campaign_id, each row's campaign_id equals it; without a campaign, campaign_id is null.
      Only the HARD split's amount_cents enters campaign_counted_totals (when campaign present);
      SOFT splits count only in recognition_society_scoring's COMPREHENSIVE variant.
    input_set: "The splits array of the payment being created."
    constants: {}
    precision: "integer cents; round_half_up per non-largest split, residual absorbed by largest"

  - name: installment_schedule_generation
    trigger: "POST /advancement/pledges"
    algorithm: waterfall_allocation
    description: "Generates PledgeInstallment rows with front-loaded cent remainder and calendar-pinned due dates."
    formula: |
      base = floor(total_amount_cents / installment_count)
      remainder = total_amount_cents - base * installment_count
      installments 1..remainder get base + 1 cent; the rest get base
      # Front-loaded: the EARLIEST-due installments absorb the remainder cents.
      # (Alternative 'last installment absorbs' would shift cents to the final row; pinned otherwise.)
      due_date(i) = first_due_date advanced by (i-1) frequency steps;
      MONTHLY = +1 calendar month, QUARTERLY = +3 months, ANNUAL = +1 year;
      day-of-month clamps to the last day of the target month (e.g., Jan 31 + 1 month = Feb 28/29).
      outstanding_cents = total_amount_cents at creation.
    input_set: "The pledge being created."
    constants:
      MAX_INSTALLMENTS: 120
    precision: "integer cents"

  - name: endowment_spending_allowance
    trigger: "Recomputed on read of RestrictedFund and before every POST /advancement/funds/{fundId}/disburse; also refreshed when valuations are appended or the clock crosses a fiscal-year boundary."
    algorithm: forward_looking
    description: "Endowment spending rule with a pinned evaluation order that breaks the circular-looking dependency between disbursements, market values, and future allowances (combinatorial mode c)."
    formula: |
      Applies to endowed funds only; current-use funds have spendable_fy_cents == 0 and
      disbursements limited by balance_cents alone.
      Fiscal year FY(d): July 1 - June 30; FY start = July 1 of (year(d) if month(d) >= 7 else year(d)-1).
      Evaluation order (pinned): the current fiscal year's allowance uses ONLY quarter-ends
      STRICTLY BEFORE the current FY start. Disbursements and valuations recorded during the
      current FY never change the current FY's spendable figure; they only affect later FYs.
      quarters = up to 12 most recent trailing_market_values entries with quarter_end < FY_start(current_utc)
      if count(quarters) < MIN_QUARTERS (4): spendable_fy_cents = 0
      else: spendable_fy_cents = round_half_up(SPENDING_RATE * avg(value_cents over quarters))
      allowance_remaining_cents = spendable_fy_cents - sum of disbursement amounts posted with
                                  created_at inside the current FY
      Disbursement cap: amount_cents <= min(allowance_remaining_cents, balance_cents)
      (ERR_SPENDING_ALLOWANCE_EXCEEDED otherwise).
    input_set: "The fund's trailing_market_values (quarter_end strictly before current FY start, at most 12 most recent, at least 4) and current-FY disbursements."
    constants:
      SPENDING_RATE: 0.045
      MIN_QUARTERS: 4
      MAX_QUARTERS: 12
    precision: "integer cents, round_half_up on the product"

  - name: pledge_outstanding_balance
    trigger: "Recomputed after every GiftPayment create/reverse and every approved PledgeWriteOff touching the pledge."
    algorithm: aggregation
    description: "Pledge outstanding from installment-level fields; write-off allocation order pinned latest-first."
    formula: |
      Per installment: open_cents = amount_cents - paid_cents - written_off_cents
      outstanding_cents = sum(open_cents) over all installments
      Payment waterfall order: installments with open_cents > 0 sorted (due_date ASC, sequence_number ASC);
      each receives min(payment remaining, open_cents).
      Write-off allocation order: installments with open_cents > 0 sorted (due_date DESC, sequence_number DESC);
      each receives min(write-off remaining, open_cents) added to written_off_cents.
      Installment terminal status: PAID when paid_cents == amount_cents and written_off_cents == 0;
      WRITTEN_OFF when written_off_cents == amount_cents and paid_cents == 0;
      fully covered with paid_cents > 0 -> PAID.
      Pledge status: FULFILLED when all installments PAID; WRITTEN_OFF when no installment remains
      in {SCHEDULED, REMINDED, OVERDUE} and any written_off_cents > 0; else ACTIVE.
    input_set: "The pledge's installments and non-reversed payment allocations."
    constants: {}
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority — first match wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Request body well-formed: required fields present, types correct, enum values in their declared sets, integer money fields positive; unknown fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: "Path parameters resolve left-to-right: prospect -> assessment/assignment; fundraiser -> assignment; proposal -> agreement; pledge -> installment/write-off; fund -> report; campaign; payment; society; naming opportunity"
    error_id: ERR_PROSPECT_NOT_FOUND | ERR_FUNDRAISER_NOT_FOUND | ERR_PROPOSAL_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_PLEDGE_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_FUND_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: business_constraint
    check: "GiftOfficer ownership: X-User-ID must equal fundraiser_id of an ACTIVE PortfolioAssignment for the prospect being acted on (moves, proposal create/submit/PATCH, agreement create/present, pledge create, write-off request)"
    error_id: ERR_NOT_PROSPECT_OWNER
    http_status: 403
    applies_to: ["POST /advancement/prospects/{prospectId}/moves", "POST /advancement/proposals", "POST /advancement/proposals/{proposalId}/submit", "PATCH /advancement/proposals/{proposalId}", "POST /advancement/proposals/{proposalId}/agreements", "POST /advancement/agreements/{agreementId}/present", "POST /advancement/pledges", "POST /advancement/pledges/{pledgeId}/write-offs"]
  - priority: 6
    category: auth
    check: "Segregation of duties: reviewer/decider X-User-ID must differ from the resource's created_by/submitted_by/requested_by; PRINCIPAL second approval must come from a VP not already in approver_ids (ERR_DUPLICATE_APPROVAL)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /advancement/assessments/{assessmentId}/review", "POST /advancement/proposals/{proposalId}/review", "POST /advancement/write-offs/{writeOffId}/review"]
  - priority: 7
    category: business_constraint
    check: "OCC: expected_prospect_version / expected_fundraiser_version must equal the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /advancement/proposals", "POST /advancement/fundraisers/{fundraiserId}/assignments"]
  - priority: 8
    category: state
    check: "Entity-specific state preconditions per state machine (proposal editable/submittable/under review; agreement presentable/executable; pledge active; installment remindable; write-off pending; payment not reversed; campaign DRAFT/ACTIVE/CLOSED as required; fundraiser active; assessment submitted; report draft/submitted)"
    error_id: ERR_PROPOSAL_STATE_FORBIDS | ERR_PROPOSAL_NOT_UNDER_REVIEW | ERR_AGREEMENT_INVALID_STATE | ERR_PLEDGE_NOT_ACTIVE | ERR_INSTALLMENT_NOT_REMINDABLE | ERR_WRITE_OFF_NOT_PENDING | ERR_PAYMENT_ALREADY_REVERSED | ERR_CAMPAIGN_INVALID_STATE | ERR_FUNDRAISER_INACTIVE | ERR_ASSESSMENT_NOT_REVIEWABLE | ERR_REPORT_TRANSITION_INVALID | ERR_INVALID_MOVES_TRANSITION | ERR_PROSPECT_NOT_RATED | ERR_PROSPECT_NOT_SOLICITABLE | ERR_FUND_NOT_ACTIVE | ERR_PROPOSAL_NOT_APPROVED
    http_status: 409
    applies_to: all
  - priority: 9
    category: business_safety
    check: "Stewardship/compliance gates: payment crediting a fund with status SPENDING_FROZEN rejected; disbursement from a SPENDING_FROZEN fund rejected"
    error_id: ERR_STEWARDSHIP_LAPSED | ERR_FUND_SPENDING_FROZEN
    http_status: 409
    applies_to: ["POST /advancement/gift-payments", "POST /advancement/funds/{fundId}/disburse"]
  - priority: 10
    category: business_referential
    check: "Cross-reference consistency: when a payment carries both pledge_id and fund_id, fund_id must equal the pledge's fund_id (both null is allowed); a payment to a fund uses the fund that actually receives the money"
    error_id: ERR_FUND_PLEDGE_MISMATCH
    http_status: 422
    applies_to: [POST /advancement/gift-payments]
  - priority: 11
    category: business_constraint
    check: "Capacity and tier rules: fundraiser ACTIVE assignment count must stay < max_prospect_count at creation (reject when count >= max); at proposal submit, owning fundraiser's current_open_ask_cents + ask_amount_cents must be <= max_open_ask_cents (equality allowed); proposal tier-role mapping; naming opportunity availability and price floor; agreement amount equals approved ask; pledge-per-agreement uniqueness; society level uniqueness; quarter valuation uniqueness; one ACTIVE assignment per prospect"
    error_id: ERR_PORTFOLIO_CAPACITY_EXCEEDED | ERR_OPEN_ASK_LOAD_EXCEEDED | ERR_NAMING_OPPORTUNITY_UNAVAILABLE | ERR_PLEDGE_ALREADY_EXISTS | ERR_DUPLICATE_SOCIETY_LEVEL | ERR_DUPLICATE_QUARTER_VALUATION | ERR_PROSPECT_ALREADY_ASSIGNED (409) ; ERR_TIER_APPROVAL_ROLE_VIOLATION (403) ; ERR_BELOW_NAMING_FLOOR | ERR_AGREEMENT_AMOUNT_MISMATCH | ERR_PLEDGE_TYPE_REQUIRED | ERR_ASK_EXCEEDS_CAPACITY (422)
    http_status: 409
    applies_to: all
  - priority: 12
    category: business_temporal
    check: "Temporal windows: naming reservation not expired at execute (ERR_RESERVATION_EXPIRED); stewardship report periods must not overlap under closed-interval semantics (sharing an endpoint date is a conflict); campaign counting window must contain received_at / pledge created_at"
    error_id: ERR_RESERVATION_EXPIRED | ERR_REPORT_PERIOD_OVERLAP (409) ; ERR_OUTSIDE_COUNTING_WINDOW (422)
    http_status: 409
    applies_to: ["POST /advancement/agreements/{agreementId}/execute", "POST /advancement/funds/{fundId}/reports", "POST /advancement/gift-payments", "POST /advancement/pledges"]
  - priority: 13
    category: business_fiscal
    check: "Money limits: payment amount <= pledge outstanding when pledge-linked; write-off amount <= pledge outstanding; splits percentages sum to 100; disbursement <= min(allowance_remaining_cents, balance_cents)"
    error_id: ERR_PAYMENT_EXCEEDS_OUTSTANDING | ERR_WRITE_OFF_EXCEEDS_OUTSTANDING | ERR_SPLIT_PERCENT_SUM_INVALID | ERR_SPENDING_ALLOWANCE_EXCEEDED
    http_status: 422
    applies_to: ["POST /advancement/gift-payments", "POST /advancement/pledges/{pledgeId}/write-offs", "POST /advancement/funds/{fundId}/disburse"]

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# Path parameters are always written {id}. All list GETs accept limit?/offset?
# and return the §1.0 pagination envelope.
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/advancement/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default (before any set) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time. to_iso8601 must be strictly later than the current logical time (ERR_INVALID_REQUEST otherwise). Setting the clock runs all time-based sweeps: installments past due_date + 30 days become OVERDUE; APPROVED proposals older than 90 days without an agreement become EXPIRED; naming reservations whose reserved_until has been reached are released; DRAFT stewardship reports past due_date become OVERDUE (cascading fund SPENDING_FROZEN and agreement STEWARDSHIP_LAPSED)."
    roles: [AdvancementDirector, VPAdvancement]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["installment overdue sweep", "proposal expiry sweep", "naming reservation expiry sweep", "stewardship report overdue sweep with fund/agreement cascade"]

  # --- Fundraisers & portfolio assignments ---
  - method: POST
    path: "/advancement/fundraisers"
    description: "Create a fundraiser (gift officer) with portfolio capacity limits"
    roles: [VPAdvancement]
    code: 201
    input: [display_name, email, max_prospect_count, max_open_ask_cents]
    output: Fundraiser
    side_effects: ["status ACTIVE; current_prospect_count = 0; current_open_ask_cents = 0"]
  - method: GET
    path: "/advancement/fundraisers/{id}"
    description: "Get a fundraiser including computed capacity counters"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: []
    output: Fundraiser
    side_effects: []
  - method: POST
    path: "/advancement/fundraisers/{id}/deactivate"
    description: "Deactivate a fundraiser; requires zero ACTIVE assignments"
    roles: [VPAdvancement]
    code: 200
    input: []
    output: Fundraiser
    side_effects: ["fundraiser.status := INACTIVE; increments Fundraiser.version by 1"]
  - method: POST
    path: "/advancement/fundraisers/{id}/assignments"
    description: "Assign a prospect to a fundraiser's portfolio (OCC on fundraiser version)"
    roles: [AdvancementDirector]
    code: 201
    input: [prospect_id, expected_fundraiser_version]
    output: PortfolioAssignment
    side_effects:
      - "fundraiser.current_prospect_count += 1; fundraiser.current_open_ask_cents recomputed (adds the prospect's open proposals)"
      - "increments Fundraiser.version by 1"
  - method: GET
    path: "/advancement/fundraisers/{id}/assignments"
    description: "List assignments of a fundraiser"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PortfolioAssignment[]"
    side_effects: []
  - method: POST
    path: "/advancement/assignments/{id}/release"
    description: "Release an ACTIVE assignment"
    roles: [AdvancementDirector]
    code: 200
    input: [released_reason]
    output: PortfolioAssignment
    side_effects:
      - "fundraiser.current_prospect_count -= 1; fundraiser.current_open_ask_cents recomputed"
      - "increments Fundraiser.version by 1"

  # --- Prospects ---
  - method: POST
    path: "/advancement/prospects"
    description: "Create a prospect (research_status IDENTIFIED, moves_stage QUALIFICATION)"
    roles: [ProspectResearcher]
    code: 201
    input: [full_name, prospect_type, contact_email, "spouse_prospect_id?"]
    output: Prospect
    side_effects: []
  - method: GET
    path: "/advancement/prospects/{id}"
    description: "Get a prospect including computed giving aggregates and recognition_society_id"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: []
    output: Prospect
    side_effects: []
  - method: GET
    path: "/advancement/prospects"
    description: "List prospects with filters (also the reverse-lookup channel for spouse_prospect_id, rated_assessment_id, recognition_society_id)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["research_status?", "moves_stage?", "capacity_band?", "spouse_prospect_id?", "rated_assessment_id?", "recognition_society_id?", "limit?", "offset?"]
    output: "Prospect[]"
    side_effects: []
  - method: POST
    path: "/advancement/prospects/{id}/disqualify"
    description: "Disqualify a prospect; releases ACTIVE assignments and rejects open proposals"
    roles: [ProspectResearcher, AdvancementDirector]
    code: 200
    input: []
    output: Prospect
    side_effects: ["cascade: assignments RELEASED (DISQUALIFIED), open proposals REJECTED, fundraiser counters recomputed", "increments Prospect.version by 1"]
  - method: POST
    path: "/advancement/prospects/{id}/moves"
    description: "Advance or loop the moves-management stage; acting GiftOfficer must hold the ACTIVE assignment"
    roles: [GiftOfficer]
    code: 200
    input: [target_stage, "note?"]
    output: Prospect
    side_effects: ["increments Prospect.version by 1"]
  - method: GET
    path: "/advancement/prospects/{id}/assignments"
    description: "List assignments of a prospect (reverse FK lookup)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PortfolioAssignment[]"
    side_effects: []
  - method: GET
    path: "/advancement/prospects/{id}/credit-splits"
    description: "List credit splits where the prospect receives credit (reverse FK lookup)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["credit_type?", "limit?", "offset?"]
    output: "CampaignCreditSplit[]"
    side_effects: []
  - method: GET
    path: "/advancement/prospects/{id}/recognition"
    description: "Computed read: recognition totals under both variants and derived society levels"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: []
    output: { cash_total_cents: integer, comprehensive_total_cents: integer, soft_credit_cents: integer, member_level: string, projected_level: string }
    side_effects: []
  - method: POST
    path: "/advancement/prospects/{id}/assessments"
    description: "Create a research assessment (immediately SUBMITTED); moves prospect to IN_SCREENING"
    roles: [ProspectResearcher]
    code: 201
    input: [assessed_capacity_cents, engagement_score, philanthropy_score, recency_score, evidence_tier]
    output: ResearchAssessment
    side_effects: ["prospect.research_status := IN_SCREENING (from IDENTIFIED or RATED)", "increments Prospect.version by 1"]
  - method: GET
    path: "/advancement/prospects/{id}/assessments"
    description: "List assessments of a prospect (reverse FK lookup)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ResearchAssessment[]"
    side_effects: []

  # --- Assessments ---
  - method: POST
    path: "/advancement/assessments/{id}/review"
    description: "Approve or reject a SUBMITTED assessment; approval rates the prospect and supersedes the prior APPROVED assessment"
    roles: [AdvancementDirector]
    code: 200
    input: [decision, "review_rationale?"]
    output: ResearchAssessment
    side_effects: ["on APPROVE: run capacity_affinity_rating; prospect rated; prior APPROVED assessment SUPERSEDED", "increments Prospect.version by 1 on approval"]

  # --- Proposals ---
  - method: GET
    path: "/advancement/prospects/{id}/proposals"
    description: "List proposals of a prospect (reverse FK lookup)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Proposal[]"
    side_effects: []
  - method: POST
    path: "/advancement/proposals"
    description: "Create a DRAFT proposal for a prospect (OCC on prospect version). Prospect must be RATED, in moves stage CULTIVATION/SOLICITATION/NEGOTIATION, not DISQUALIFIED, and actively assigned to the acting officer."
    roles: [GiftOfficer]
    code: 201
    input: [prospect_id, proposal_type, ask_amount_cents, designation_purpose, expected_prospect_version]
    output: Proposal
    side_effects: ["increments Prospect.version by 1"]
  - method: GET
    path: "/advancement/proposals/{id}"
    description: "Get a proposal"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: []
    output: Proposal
    side_effects: []
  - method: PATCH
    path: "/advancement/proposals/{id}"
    description: "Edit a proposal in DRAFT/NEGOTIATING/RETURNED/REJECTED; resets it to DRAFT and clears tier/quorum fields"
    roles: [GiftOfficer]
    code: 200
    input: ["ask_amount_cents?", "designation_purpose?"]
    output: Proposal
    side_effects: ["proposal.status := DRAFT; approval_tier/effective_ask_cents/pinned_capacity_band := null; approvals_received := 0; approver_ids := []", "fundraiser.current_open_ask_cents recomputed; increments Fundraiser.version by 1 when the proposal had been open"]
  - method: POST
    path: "/advancement/proposals/{id}/submit"
    description: "Submit for approval: computes tier, pins capacity band, enforces ask ceiling vs rated adjusted capacity"
    roles: [GiftOfficer]
    code: 200
    input: []
    output: Proposal
    side_effects: ["run approval_tier_determination; pin capacity band; status := UNDER_REVIEW", "fundraiser.current_open_ask_cents recomputed; increments Fundraiser.version by 1"]
  - method: POST
    path: "/advancement/proposals/{id}/review"
    description: "Decide a proposal under review; tier determines the allowed role; PRINCIPAL requires two distinct VPAdvancement approvals"
    roles: [AdvancementDirector, VPAdvancement]
    code: 200
    input: [decision, "decision_rationale?"]
    output: Proposal
    side_effects: ["on final APPROVE: status APPROVED, approved_at set, other APPROVED proposals of the prospect SUPERSEDED", "on REJECT: fundraiser open-ask recomputed; increments Fundraiser.version by 1"]

  # --- Gift agreements ---
  - method: POST
    path: "/advancement/proposals/{id}/agreements"
    description: "Draft a gift agreement from an APPROVED proposal; amount must equal the ask; naming floor enforced at draft time"
    roles: [GiftOfficer]
    code: 201
    input: [restriction_type, agreement_amount_cents, "purpose_code?", "naming_opportunity_id?"]
    output: GiftAgreement
    side_effects: []
  - method: GET
    path: "/advancement/agreements/{id}"
    description: "Get a gift agreement (both status dimensions)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: []
    output: GiftAgreement
    side_effects: []
  - method: GET
    path: "/advancement/agreements"
    description: "List agreements with filters (reverse FK lookups for proposal_id, prospect_id, naming_opportunity_id)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["proposal_id?", "prospect_id?", "naming_opportunity_id?", "signature_status?", "limit?", "offset?"]
    output: "GiftAgreement[]"
    side_effects: []
  - method: POST
    path: "/advancement/agreements/{id}/present"
    description: "Present for signature; claims the naming opportunity with a 14-day half-open reservation"
    roles: [GiftOfficer]
    code: 200
    input: []
    output: GiftAgreement
    side_effects: ["naming opportunity RESERVED with reserved_until = current_utc + 14 days; increments NamingOpportunity.version by 1 when claimed"]
  - method: POST
    path: "/advancement/agreements/{id}/execute"
    description: "Execute a presented agreement; validates the naming reservation; establishes the restricted fund; prospect moves to STEWARDSHIP"
    roles: [VPAdvancement]
    code: 200
    input: []
    output: GiftAgreement
    side_effects: ["naming opportunity OCCUPIED when claimed", "RestrictedFund created (PENDING_MINIMUM) for restricted types", "prospect.moves_stage := STEWARDSHIP; increments Prospect.version by 1"]
  - method: POST
    path: "/advancement/agreements/{id}/rescind"
    description: "Rescind an agreement with no non-reversed payments; releases naming, cancels pledge, closes empty fund"
    roles: [VPAdvancement]
    code: 200
    input: []
    output: GiftAgreement
    side_effects: ["naming opportunity released to AVAILABLE when held", "pledge CANCELLED", "established fund CLOSED when balance_cents == 0"]
  - method: GET
    path: "/advancement/agreements/{id}/naming-reservations"
    description: "List naming opportunities currently reserved/occupied by this agreement (reverse FK lookup, 0..1 rows)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: "NamingOpportunity[]"
    side_effects: []

  # --- Naming opportunities ---
  - method: POST
    path: "/advancement/naming-opportunities"
    description: "Create a naming opportunity with a price floor"
    roles: [VPAdvancement]
    code: 201
    input: [name, category, price_floor_cents]
    output: NamingOpportunity
    side_effects: ["status AVAILABLE"]
  - method: GET
    path: "/advancement/naming-opportunities/{id}"
    description: "Get a naming opportunity"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: []
    output: NamingOpportunity
    side_effects: []
  - method: POST
    path: "/advancement/naming-opportunities/{id}/retire"
    description: "Retire an AVAILABLE or RESERVED opportunity"
    roles: [VPAdvancement]
    code: 200
    input: []
    output: NamingOpportunity
    side_effects: ["status := RETIRED"]

  # --- Pledges, installments, write-offs ---
  - method: POST
    path: "/advancement/pledges"
    description: "Create a pledge on an EXECUTED agreement whose proposal_type is PLEDGE; generates the installment schedule; optional campaign booking (campaign must be ACTIVE and the booking inside its window)"
    roles: [GiftOfficer]
    code: 201
    input: [agreement_id, total_amount_cents, installment_count, frequency, first_due_date, "campaign_id?"]
    output: Pledge
    side_effects: ["run installment_schedule_generation (front-loaded remainder)", "fund_id copied from agreement fund", "prospect.outstanding_pledge_cents recomputed; increments Prospect.version by 1", "campaign face_value_counted_cents recomputed when booked"]
  - method: GET
    path: "/advancement/pledges/{id}"
    description: "Get a pledge"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: []
    output: Pledge
    side_effects: []
  - method: GET
    path: "/advancement/pledges"
    description: "List pledges with filters (reverse FK lookups for agreement_id, fund_id, campaign_id, prospect_id)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["agreement_id?", "fund_id?", "campaign_id?", "prospect_id?", "status?", "limit?", "offset?"]
    output: "Pledge[]"
    side_effects: []
  - method: GET
    path: "/advancement/pledges/{id}/installments"
    description: "List installments of a pledge in schedule order (reverse FK lookup)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PledgeInstallment[]"
    side_effects: []
  - method: POST
    path: "/advancement/installments/{id}/remind"
    description: "Send a pledge reminder; max MAX_REMINDERS = 3 per installment"
    roles: [DonorRelationsOfficer]
    code: 200
    input: []
    output: PledgeInstallment
    side_effects: ["reminder_count += 1; status := REMINDED; increments PledgeInstallment.version by 1"]
  - method: POST
    path: "/advancement/pledges/{id}/write-offs"
    description: "Request a pledge write-off (PENDING); amount must not exceed outstanding"
    roles: [GiftOfficer, FinanceSteward]
    code: 201
    input: [amount_cents, reason]
    output: PledgeWriteOff
    side_effects: []
  - method: GET
    path: "/advancement/pledges/{id}/write-offs"
    description: "List write-off requests of a pledge (reverse FK lookup)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PledgeWriteOff[]"
    side_effects: []
  - method: POST
    path: "/advancement/write-offs/{id}/review"
    description: "Approve or reject a PENDING write-off; approver must differ from requester (segregation of duties)"
    roles: [AdvancementDirector]
    code: 200
    input: [decision, "review_rationale?"]
    output: PledgeWriteOff
    side_effects: ["on APPROVE: latest-first installment allocation; pledge status re-evaluated; campaign FACE total netted; prospect outstanding/recognition recomputed"]

  # --- Gift payments ---
  - method: POST
    path: "/advancement/gift-payments"
    description: "Record a gift payment; waterfall-applies to pledge installments, credits funds, counts toward campaigns, records credit splits"
    roles: [FinanceSteward]
    code: 201
    input: [donor_prospect_id, amount_cents, received_at, payment_method, "pledge_id?", "fund_id?", "campaign_id?", "corporate_matched?", "splits?"]
    output: GiftPayment
    side_effects:
      - "waterfall allocation to pledge installments (due_date ASC, sequence_number ASC); installments reaching paid_cents == amount_cents with no write-off become PAID"
      - "pledge outstanding recomputed; pledge FULFILLED when all installments PAID"
      - "credited fund balance_cents += amount (pledge's fund for pledge-linked payments, else payload fund); fund PENDING_MINIMUM -> ACTIVE when balance >= minimum_activation_cents"
      - "campaign totals recomputed (both variants; matched factor 0.5 floor per payment)"
      - "credit_split_rounding creates CampaignCreditSplit rows when splits present"
      - "prospect lifetime_given_cents/outstanding_pledge_cents/recognition recomputed; increments Prospect.version by 1"
  - method: GET
    path: "/advancement/gift-payments/{id}"
    description: "Get a gift payment including applied_allocations"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: []
    output: GiftPayment
    side_effects: []
  - method: GET
    path: "/advancement/gift-payments"
    description: "List gift payments with filters (reverse FK lookups)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["pledge_id?", "fund_id?", "campaign_id?", "donor_prospect_id?", "limit?", "offset?"]
    output: "GiftPayment[]"
    side_effects: []
  - method: POST
    path: "/advancement/gift-payments/{id}/reverse"
    description: "Reverse a payment; un-applies allocations and reconciles every derived field the payment touched"
    roles: [FinanceSteward]
    code: 200
    input: []
    output: GiftPayment
    side_effects: ["installment paid_cents reduced; PAID installments revert (OVERDUE when past grace, REMINDED when reminder_count > 0, else SCHEDULED)", "pledge FULFILLED -> ACTIVE recomputation", "fund balance decremented; ACTIVE -> PENDING_MINIMUM when below minimum", "campaign totals decremented", "prospect aggregates/recognition recomputed"]
  - method: GET
    path: "/advancement/gift-payments/{id}/credit-splits"
    description: "List credit splits of a payment (reverse FK lookup)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["credit_type?", "limit?", "offset?"]
    output: "CampaignCreditSplit[]"
    side_effects: []

  # --- Restricted funds ---
  - method: GET
    path: "/advancement/funds/{id}"
    description: "Get a restricted fund including spendable_fy_cents and allowance_remaining_cents"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: []
    output: RestrictedFund
    side_effects: []
  - method: GET
    path: "/advancement/funds"
    description: "List restricted funds with filters (reverse FK lookup for agreement_id)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["agreement_id?", "status?", "limit?", "offset?"]
    output: "RestrictedFund[]"
    side_effects: []
  - method: POST
    path: "/advancement/funds/{id}/valuations"
    description: "Append a quarter-end market valuation; quarter_end unique per fund"
    roles: [FinanceSteward]
    code: 201
    input: [quarter_end, value_cents]
    output: RestrictedFund
    side_effects: ["trailing_market_values appended; spendable_fy_cents/allowance_remaining_cents recomputed; increments RestrictedFund.version by 1"]
  - method: POST
    path: "/advancement/funds/{id}/disburse"
    description: "Disburse from a fund; endowed funds capped by min(allowance_remaining_cents, balance_cents); current-use funds capped by balance_cents"
    roles: [FinanceSteward]
    code: 200
    input: [amount_cents, purpose_note]
    output: RestrictedFund
    side_effects: ["balance_cents -= amount; allowance_remaining_cents recomputed; ACTIVE -> PENDING_MINIMUM when balance drops below minimum; increments RestrictedFund.version by 1"]
  - method: POST
    path: "/advancement/funds/{id}/reports"
    description: "Create a stewardship report for a closed period; periods must not overlap under closed-interval semantics; due_date = period_end + 90 days"
    roles: [DonorRelationsOfficer]
    code: 201
    input: [period_start, period_end, "narrative?"]
    output: StewardshipReport
    side_effects: ["due_date := period_end + 90 days; status DRAFT"]
  - method: GET
    path: "/advancement/funds/{id}/reports"
    description: "List stewardship reports of a fund (reverse FK lookup)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "StewardshipReport[]"
    side_effects: []

  # --- Stewardship reports ---
  - method: POST
    path: "/advancement/stewardship-reports/{id}/submit"
    description: "Submit a DRAFT or OVERDUE report"
    roles: [DonorRelationsOfficer]
    code: 200
    input: []
    output: StewardshipReport
    side_effects: ["status := SUBMITTED; submitted_by set"]
  - method: POST
    path: "/advancement/stewardship-reports/{id}/deliver"
    description: "Deliver a SUBMITTED report; unfreezes the fund and restores agreement compliance when no other report is OVERDUE"
    roles: [DonorRelationsOfficer]
    code: 200
    input: []
    output: StewardshipReport
    side_effects: ["fund SPENDING_FROZEN -> ACTIVE when clear", "agreement compliance_status := COMPLIANT when clear"]

  # --- Campaigns ---
  - method: POST
    path: "/advancement/campaigns"
    description: "Create a campaign with an inclusive counting window [counting_start, counting_end]"
    roles: [VPAdvancement]
    code: 201
    input: [name, goal_cents, counting_start, counting_end]
    output: Campaign
    side_effects: ["status DRAFT; totals zeroed"]
  - method: GET
    path: "/advancement/campaigns/{id}"
    description: "Get a campaign"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: POST
    path: "/advancement/campaigns/{id}/activate"
    description: "Activate a DRAFT campaign"
    roles: [VPAdvancement]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: POST
    path: "/advancement/campaigns/{id}/close"
    description: "Close an ACTIVE campaign; totals freeze"
    roles: [VPAdvancement]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: POST
    path: "/advancement/campaigns/{id}/report"
    description: "Mark a CLOSED campaign as REPORTED (terminal)"
    roles: [VPAdvancement]
    code: 200
    input: []
    output: Campaign
    side_effects: []
  - method: GET
    path: "/advancement/campaigns/{id}/totals"
    description: "Computed read: both counting variants side by side"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: []
    output: { face_value_counted_cents: integer, cash_counted_cents: integer, goal_cents: integer, status: string }
    side_effects: []
  - method: GET
    path: "/advancement/campaigns/{id}/credit-splits"
    description: "List credit splits booked to a campaign (reverse FK lookup)"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["credit_type?", "limit?", "offset?"]
    output: "CampaignCreditSplit[]"
    side_effects: []

  # --- Recognition societies ---
  - method: POST
    path: "/advancement/recognition-societies"
    description: "Configure a recognition society level; level is unique across societies"
    roles: [DonorRelationsOfficer]
    code: 201
    input: [name, level, threshold_cash_cents, "benefits_text?"]
    output: RecognitionSociety
    side_effects: ["prospect recognition_society_id values recomputed lazily on next recognition read"]
  - method: GET
    path: "/advancement/recognition-societies"
    description: "List recognition societies"
    roles: [GiftOfficer, ProspectResearcher, AdvancementDirector, VPAdvancement, DonorRelationsOfficer, FinanceSteward]
    code: 200
    input: ["limit?", "offset?"]
    output: "RecognitionSociety[]"
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- auth / role / request shape ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not listed for the endpoint" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Reviewer/decider X-User-ID equals the resource's created_by / submitted_by / requested_by" }
  - { id: ERR_NOT_PROSPECT_OWNER, http: 403, condition: "GiftOfficer acts on a prospect without an ACTIVE assignment to that officer" }
  - { id: ERR_TIER_APPROVAL_ROLE_VIOLATION, http: 403, condition: "Reviewer role does not match the proposal's computed approval tier (STANDARD=AdvancementDirector, MAJOR/PRINCIPAL=VPAdvancement)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, wrong type, enum value outside declared set, non-positive money integer, unknown field, or malformed splits structure" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_prospect_version / expected_fundraiser_version does not match the parent's current version" }
  # --- not found (left-to-right path resolution) ---
  - { id: ERR_PROSPECT_NOT_FOUND, http: 404, condition: "prospectId path segment or prospect_id body reference does not resolve" }
  - { id: ERR_FUNDRAISER_NOT_FOUND, http: 404, condition: "fundraiser id path segment does not resolve" }
  - { id: ERR_PROPOSAL_NOT_FOUND, http: 404, condition: "proposal id path segment does not resolve" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "agreement id path segment or agreement_id body reference does not resolve" }
  - { id: ERR_PLEDGE_NOT_FOUND, http: 404, condition: "pledge id path segment or pledge_id body reference does not resolve" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "payment id path segment does not resolve" }
  - { id: ERR_FUND_NOT_FOUND, http: 404, condition: "fund id path segment or fund_id body reference does not resolve" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "campaign id path segment or campaign_id body reference does not resolve" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "assessment, assignment, installment, write-off, report, naming-opportunity, or society id does not resolve" }
  # --- state preconditions ---
  - { id: ERR_INVALID_MOVES_TRANSITION, http: 409, condition: "Moves-stage jump not allowed by the moves state machine; also used for disqualify/release/deactivate from a forbidding state and for assessment creation on a DISQUALIFIED prospect" }
  - { id: ERR_PROSPECT_NOT_RATED, http: 409, condition: "Proposal creation or SOLICITATION move requires research_status == RATED" }
  - { id: ERR_PROSPECT_NOT_SOLICITABLE, http: 409, condition: "Proposal creation requires moves_stage in {CULTIVATION, SOLICITATION, NEGOTIATION}" }
  - { id: ERR_FUNDRAISER_INACTIVE, http: 409, condition: "Assignment creation against an INACTIVE fundraiser" }
  - { id: ERR_FUNDRAISER_HAS_ACTIVE_ASSIGNMENTS, http: 409, condition: "Deactivation attempted while current_prospect_count > 0" }
  - { id: ERR_ASSESSMENT_NOT_REVIEWABLE, http: 409, condition: "Assessment review attempted when status != SUBMITTED" }
  - { id: ERR_PROPOSAL_STATE_FORBIDS, http: 409, condition: "PATCH or submit attempted from a proposal state that does not allow it (e.g., UNDER_REVIEW, APPROVED, SUPERSEDED, EXPIRED)" }
  - { id: ERR_PROPOSAL_NOT_UNDER_REVIEW, http: 409, condition: "Review attempted when proposal status != UNDER_REVIEW" }
  - { id: ERR_PROPOSAL_NOT_APPROVED, http: 409, condition: "Agreement creation attempted on a proposal that is not APPROVED (includes EXPIRED and SUPERSEDED)" }
  - { id: ERR_AGREEMENT_INVALID_STATE, http: 409, condition: "Present/execute/rescind attempted from a forbidding signature_status" }
  - { id: ERR_RESCIND_BLOCKED_BY_PAYMENTS, http: 409, condition: "Rescind attempted while a non-reversed GiftPayment references the agreement's pledge or fund" }
  - { id: ERR_PLEDGE_NOT_ACTIVE, http: 409, condition: "Payment or write-off request against a pledge not in ACTIVE status" }
  - { id: ERR_PLEDGE_ALREADY_EXISTS, http: 409, condition: "Second pledge attempted on the same agreement" }
  - { id: ERR_INSTALLMENT_NOT_REMINDABLE, http: 409, condition: "Reminder attempted on a PAID or WRITTEN_OFF installment" }
  - { id: ERR_REMINDER_LIMIT_EXCEEDED, http: 409, condition: "Reminder attempted when reminder_count == MAX_REMINDERS (3)" }
  - { id: ERR_WRITE_OFF_NOT_PENDING, http: 409, condition: "Write-off review attempted when status != PENDING" }
  - { id: ERR_PAYMENT_ALREADY_REVERSED, http: 409, condition: "Reverse attempted on an already-reversed payment" }
  - { id: ERR_CAMPAIGN_INVALID_STATE, http: 409, condition: "Campaign action or payment/pledge booking against a campaign in a forbidding status" }
  - { id: ERR_FUND_NOT_ACTIVE, http: 409, condition: "Payment or disbursement referencing a CLOSED fund" }
  - { id: ERR_REPORT_TRANSITION_INVALID, http: 409, condition: "Report submit/deliver attempted from a forbidding status" }
  - { id: ERR_PROSPECT_ALREADY_ASSIGNED, http: 409, condition: "Assignment creation for a prospect that already has an ACTIVE assignment" }
  # --- business safety / compliance ---
  - { id: ERR_STEWARDSHIP_LAPSED, http: 409, condition: "Payment would credit a fund in SPENDING_FROZEN status (overdue stewardship report)" }
  - { id: ERR_FUND_SPENDING_FROZEN, http: 409, condition: "Disbursement attempted from a SPENDING_FROZEN fund" }
  # --- business referential ---
  - { id: ERR_FUND_PLEDGE_MISMATCH, http: 422, condition: "Payment carries both pledge_id and fund_id and fund_id != pledge.fund_id (null-safe comparison)" }
  # --- business constraint ---
  - { id: ERR_PORTFOLIO_CAPACITY_EXCEEDED, http: 409, condition: "Assignment would violate fundraiser.max_prospect_count (reject when current_prospect_count >= max)" }
  - { id: ERR_OPEN_ASK_LOAD_EXCEEDED, http: 409, condition: "Assignment would push current_open_ask_cents above max_open_ask_cents" }
  - { id: ERR_NAMING_OPPORTUNITY_UNAVAILABLE, http: 409, condition: "Naming claim or execution when the opportunity is RESERVED by another agreement, OCCUPIED, or RETIRED" }
  - { id: ERR_ASK_EXCEEDS_CAPACITY, http: 422, condition: "At proposal submit, ask_amount_cents > prospect.rated_adjusted_capacity_cents" }
  - { id: ERR_BELOW_NAMING_FLOOR, http: 422, condition: "Agreement claims a naming opportunity but agreement_amount_cents < price_floor_cents" }
  - { id: ERR_AGREEMENT_AMOUNT_MISMATCH, http: 422, condition: "agreement_amount_cents != the approved proposal's ask_amount_cents" }
  - { id: ERR_PLEDGE_TYPE_REQUIRED, http: 422, condition: "Pledge creation on an agreement whose proposal_type != PLEDGE" }
  - { id: ERR_DUPLICATE_SOCIETY_LEVEL, http: 409, condition: "Recognition society created with a level that already exists" }
  - { id: ERR_DUPLICATE_QUARTER_VALUATION, http: 409, condition: "Valuation appended for a quarter_end already recorded on the fund" }
  - { id: ERR_DUPLICATE_APPROVAL, http: 409, condition: "Second approval on the same proposal review round from a VP already in approver_ids" }
  # --- business temporal ---
  - { id: ERR_RESERVATION_EXPIRED, http: 409, condition: "Execute attempted when the agreement's naming reservation window has lapsed" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "Stewardship report period overlaps an existing report under closed-interval semantics (shared endpoint dates count as overlap)" }
  - { id: ERR_OUTSIDE_COUNTING_WINDOW, http: 422, condition: "Payment received_at or pledge booking falls outside the campaign's inclusive counting window" }
  # --- business fiscal ---
  - { id: ERR_PAYMENT_EXCEEDS_OUTSTANDING, http: 422, condition: "Pledge-linked payment amount_cents > pledge.outstanding_cents" }
  - { id: ERR_WRITE_OFF_EXCEEDS_OUTSTANDING, http: 422, condition: "Write-off amount_cents > pledge.outstanding_cents at request time" }
  - { id: ERR_SPLIT_PERCENT_SUM_INVALID, http: 422, condition: "Splits present but sum(split_pct) != 100, or no exactly-one HARD split to the donor" }
  - { id: ERR_SPENDING_ALLOWANCE_EXCEEDED, http: 422, condition: "Disbursement amount_cents > min(allowance_remaining_cents, balance_cents)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: GiftOfficer
    description: "Frontline fundraiser; owns a prospect portfolio via PortfolioAssignment and drives moves, proposals, agreements, and pledges for owned prospects. X-User-ID must equal the Fundraiser entity id."
    identity: "entity_backed:Fundraiser"
    exclusive_operations:
      - "POST /advancement/prospects/{id}/moves"
      - "POST /advancement/proposals"
      - "PATCH /advancement/proposals/{id}"
      - "POST /advancement/proposals/{id}/submit"
      - "POST /advancement/proposals/{id}/agreements"
      - "POST /advancement/agreements/{id}/present"
      - "POST /advancement/pledges"
    shared_operations:
      - "POST /advancement/pledges/{id}/write-offs (shared with FinanceSteward)"
      - "All GET endpoints"
  - name: ProspectResearcher
    description: "Research analyst; creates prospects and assessments, disqualifies prospects. Operational identity not tied to a persisted entity."
    identity: "opaque"
    exclusive_operations:
      - "POST /advancement/prospects"
      - "POST /advancement/prospects/{id}/assessments"
    shared_operations:
      - "POST /advancement/prospects/{id}/disqualify (shared with AdvancementDirector)"
      - "All GET endpoints"
  - name: AdvancementDirector
    description: "Director; manages portfolios, reviews assessments and STANDARD proposals, reviews write-offs, may set the clock. Operational identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /advancement/fundraisers/{id}/assignments"
      - "POST /advancement/assignments/{id}/release"
      - "POST /advancement/assessments/{id}/review"
      - "POST /advancement/write-offs/{id}/review"
    shared_operations:
      - "POST /advancement/proposals/{id}/review (STANDARD tier only; shared with VPAdvancement which covers all tiers)"
      - "POST /advancement/prospects/{id}/disqualify (shared with ProspectResearcher)"
      - "POST /advancement/_clock/set_current_utc (shared with VPAdvancement)"
      - "All GET endpoints"
  - name: VPAdvancement
    description: "Vice president for advancement; approves MAJOR/PRINCIPAL proposals, executes and rescinds agreements, owns campaigns, fundraisers, and naming inventory. Operational identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /advancement/fundraisers"
      - "POST /advancement/fundraisers/{id}/deactivate"
      - "POST /advancement/naming-opportunities"
      - "POST /advancement/naming-opportunities/{id}/retire"
      - "POST /advancement/agreements/{id}/execute"
      - "POST /advancement/agreements/{id}/rescind"
      - "POST /advancement/campaigns + activate/close/report"
    shared_operations:
      - "POST /advancement/proposals/{id}/review (MAJOR/PRINCIPAL tiers; STANDARD shared with AdvancementDirector)"
      - "POST /advancement/_clock/set_current_utc (shared with AdvancementDirector)"
      - "All GET endpoints"
  - name: DonorRelationsOfficer
    description: "Stewardship and recognition owner; sends pledge reminders, files stewardship reports, configures recognition societies. Operational identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /advancement/installments/{id}/remind"
      - "POST /advancement/funds/{id}/reports"
      - "POST /advancement/stewardship-reports/{id}/submit"
      - "POST /advancement/stewardship-reports/{id}/deliver"
      - "POST /advancement/recognition-societies"
    shared_operations:
      - "All GET endpoints"
  - name: FinanceSteward
    description: "Gift accounting; records and reverses payments, posts fund valuations, disburses from funds. Operational identity."
    identity: "opaque"
    exclusive_operations:
      - "POST /advancement/gift-payments"
      - "POST /advancement/gift-payments/{id}/reverse"
      - "POST /advancement/funds/{id}/valuations"
      - "POST /advancement/funds/{id}/disburse"
    shared_operations:
      - "POST /advancement/pledges/{id}/write-offs (shared with GiftOfficer)"
      - "All GET endpoints"
