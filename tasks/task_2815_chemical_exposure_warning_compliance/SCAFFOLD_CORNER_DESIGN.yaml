        grounds:
          - validations[priority=73]
          - errors[ERR_MATERIAL_CYCLE]
          - entities.Material.fields.bom_depth
        distinguishing_aspect: |
          MAX_BOM_DEPTH is 4 measured in edges, so a five-material chain (depths 0..4) is legal and a
          sixth child at depth 5 is refused. The same error also covers the graph corners that a pure
          depth counter would miss: a material naming itself as parent, and a material naming its own
          descendant as parent.
        test_recipe:
          setup:
            - "One supplier exists and a chain RM-L0 <- RM-L1 <- RM-L2 <- RM-L3 <- RM-L4 has been built, each child pointing at the previous material with parent_mass_fraction 0.5."
