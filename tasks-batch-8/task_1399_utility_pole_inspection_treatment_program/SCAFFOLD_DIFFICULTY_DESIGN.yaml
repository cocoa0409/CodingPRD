              as_user_id: "${cr_id}"
            - call: "POST /pole-program/treatment-work-orders/${o1}/qa-review"
              payload: { decision: PASS }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o2: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o2}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o2}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
            - call: "POST /pole-program/treatment-work-orders/${o2}/qa-review"
              payload: { decision: PASS }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o3: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o3}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o3}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
            - call: "POST /pole-program/treatment-work-orders/${o3}/qa-review"
              payload: { decision: PASS }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o4: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o4}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o4}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
            - call: "POST /pole-program/treatment-work-orders/${o4}/qa-review"
              payload: { decision: FAIL }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "POST /pole-program/treatment-work-orders"
              payload: { pole_id: "${p_id}", product_code: CCA_WRAP, cost_cents: 17500 }
              as: ProgramManager
              captures: { o5: $.data.id }
            - call: "POST /pole-program/treatment-work-orders/${o5}/schedule"
              payload: { crew_id: "${cr_id}", work_start_date: "2026-08-10", work_end_date: "2026-08-12" }
              as: ProgramManager
            - call: "POST /pole-program/treatment-work-orders/${o5}/apply"
              payload: {}
              as: Contractor
              as_user_id: "${cr_id}"
          trigger:
            - call: "POST /pole-program/treatment-work-orders/${o5}/qa-review"
              payload: { decision: FAIL }
              as: QAReviewer
              as_user_id: "qa-1"
            - call: "GET /pole-program/contractor-crews/${cr_id}"
              payload: {}
              as: ProgramManager
              captures: { st: $.data.status, rq: $.data.quality_score_rolling }
          assert:
            - "ContractorCrew.${cr_id}.quality_score_rolling == 60.00 after the second FAIL (last5 P,P,P,F,F)"
            - "ContractorCrew.${cr_id}.status == SUSPENDED (cascade fired because 60.00 < 70.00)"
            - "TreatmentWorkOrder.${o5}.qa_fail_events == 1"

      - name: warranty_honor_retreat_chain_depth2
        grounds:
          - state_machines.WarrantyClaim.FILED_to_HONORED
          - entities.TreatmentWorkOrder.fields.is_warranty_retreat
          - entities.Pole.fields.open_treatment_count
        distinguishing_aspect: |
          Depth-2 chain from a third trigger (claim adjudicate HONOR): honoring mutates the claim
          and auto-creates a no-cost retreat TreatmentWorkOrder (link 1); the order creation
          increments Pole.open_treatment_count (link 2) — distinct from the qa-accept and
          qa-fail cascades.
        test_recipe:
          setup:
            - "Pole P-WT with a VERIFIED PENTA_GEL order applied at 2026-08-01 (warranty_end 2034-08-01); one FILED claim"
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-WT", species: SOUTHERN_PINE, original_class: "3", install_date: "1990-01-01", gis_lat: 45.0, gis_lon: -122.0, gis_tag: "URBAN", height_ft: 40 }
              as: ProgramManager
              captures: { p_id: $.data.id }
