scaffold_corner_design:

  # =====================================================================
  # Section 1 — Entities
  # =====================================================================
  - section: entities
    instances:
      - name: creation_member_returns_all_fields
        claim_type: Creation
        grounds:
          - entities.Member
        distinguishing_aspect: "POST /members with email, display_name, home_neighborhood returns 201 and body includes system-generated id, version=1, trust_tier=UNVERIFIED, balances at 0."
        test_recipe:
          setup:
            - "Fresh DB; clock at default 2026-03-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "e-corn-1@x.com", display_name: "N1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m: $.data.id, v: $.data.version, tier: $.data.trust_tier, bal: $.data.chronological_balance_minutes, susp: $.data.is_suspended }
          assert:
            - "HTTP status == 201"
            - "Member.${m}.version == 1"
            - "Member.${m}.trust_tier == UNVERIFIED"
            - "Member.${m}.chronological_balance_minutes == 0"
            - "Member.${m}.is_suspended == false"

      - name: retrieval_member_by_id
        claim_type: Retrieval
        grounds:
          - entities.Member
        distinguishing_aspect: "GET /members/{id} returns the same fields the create response returned, unchanged."
        test_recipe:
          setup:
            - "One Member created with email n2@x.com."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "e-corn-2@x.com", display_name: "N2", home_neighborhood: "NW-02" }
              as: Anonymous
              captures: { m: $.data.id }
          trigger:
            - call: "GET /members/${m}"
              payload: {}
              as: Member
              as_user_id: "${m}"
              captures: { email: $.data.email, hood: $.data.home_neighborhood }
          assert:
            - "Member.${m}.email == 'e-corn-2@x.com'"
            - "Member.${m}.home_neighborhood == 'NW-02'"

      - name: listing_members_pagination_defaults
        claim_type: Listing
        grounds:
          - entities.Member
          - response_envelope.pagination_defaults
        distinguishing_aspect: "GET /members returns paginated envelope with total_count and has_more; default limit=10."
        test_recipe:
          setup:
            - "Create 12 members (n1..n12)."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "p1@x.com", display_name: "P1", home_neighborhood: "NW-01" }
              as: Anonymous
            - call: "POST /members"
              payload: { email: "p2@x.com", display_name: "P2", home_neighborhood: "NW-01" }
              as: Anonymous
            - call: "POST /members"
              payload: { email: "p3@x.com", display_name: "P3", home_neighborhood: "NW-01" }
              as: Anonymous
            - call: "POST /members"
              payload: { email: "p4@x.com", display_name: "P4", home_neighborhood: "NW-01" }
              as: Anonymous
            - call: "POST /members"
              payload: { email: "p5@x.com", display_name: "P5", home_neighborhood: "NW-01" }
              as: Anonymous
            - call: "POST /members"
              payload: { email: "p6@x.com", display_name: "P6", home_neighborhood: "NW-01" }
              as: Anonymous
            - call: "POST /members"
              payload: { email: "p7@x.com", display_name: "P7", home_neighborhood: "NW-01" }
              as: Anonymous
            - call: "POST /members"
              payload: { email: "p8@x.com", display_name: "P8", home_neighborhood: "NW-01" }
              as: Anonymous
            - call: "POST /members"
              payload: { email: "p9@x.com", display_name: "P9", home_neighborhood: "NW-01" }
              as: Anonymous
            - call: "POST /members"
              payload: { email: "p10@x.com", display_name: "P10", home_neighborhood: "NW-01" }
              as: Anonymous
            - call: "POST /members"
              payload: { email: "p11@x.com", display_name: "P11", home_neighborhood: "NW-01" }
              as: Anonymous
            - call: "POST /members"
              payload: { email: "p12@x.com", display_name: "P12", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { last: $.data.id }
          trigger:
            - call: "GET /members"
              payload: {}
              as: PlatformAdmin
          assert:
            - "meta.total_count == 12"
            - "data has 10 items (default limit)"
            - "meta.has_more == true"

      - name: not_found_member_by_bogus_id
        claim_type: Not Found
        grounds:
          - errors[ERR_RESOURCE_NOT_FOUND]
        distinguishing_aspect: "GET /members/{bogus-uuid} returns 404 ERR_RESOURCE_NOT_FOUND."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_RESOURCE_NOT_FOUND"

      - name: required_field_missing_email_on_member_create
        claim_type: Required Fields
        grounds:
          - validations[priority=14]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /members with display_name and home_neighborhood but no email returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { display_name: "N", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: defaults_offer_required_trust_tier
        claim_type: Defaults
        grounds:
          - entities.SkillOffer.fields.required_trust_tier
        distinguishing_aspect: "POST /skill-offers omitting required_trust_tier defaults to UNVERIFIED."
        test_recipe:
          setup:
            - "One member M provides."
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "def-m@x.com", display_name: "M", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m: $.data.id }
          trigger:
            - call: "POST /skill-offers"
              payload: { member_id: "${m}", skill_code: "GARDENING", title: "G", minutes_per_session: 60 }
              as: Member
              as_user_id: "${m}"
              captures: { o: $.data.id, tier: $.data.required_trust_tier }
          assert:
            - "SkillOffer.${o}.required_trust_tier == UNVERIFIED"

      - name: computed_field_verified_credential_count_ignores_input
        claim_type: Computed Fields
        grounds:
          - entities.Member.fields.verified_credential_count
        distinguishing_aspect: "verified_credential_count is source:computed; attempting to set it via a client field is ignored (or rejected as unknown field)."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "cmp@x.com", display_name: "N", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m: $.data.id, vc: $.data.verified_credential_count }
          assert:
            - "Member.${m}.verified_credential_count == 0 (server-computed default)"

      - name: system_field_created_at_and_version_generated
        claim_type: System Fields
        grounds:
          - entities.Member
        distinguishing_aspect: "created_at and version are system-generated on POST /members; client value ignored."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "POST /members"
              payload: { email: "sys@x.com", display_name: "N", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m: $.data.id, ca: $.data.created_at, ua: $.data.updated_at, v: $.data.version }
          assert:
            - "Member.${m}.version == 1 (system-generated, not client-supplied)"
            - "Member.${m}.created_at exists (ISO8601 UTC)"

      - name: type_constraint_invalid_enum_trust_tier
        claim_type: Type Constraints
        grounds:
          - entities.SkillOffer.fields.required_trust_tier
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /skill-offers with required_trust_tier='SUPERSTAR' (not in enum) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "enum@x.com", display_name: "N", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m: $.data.id }
          trigger:
            - call: "POST /skill-offers"
              payload: { member_id: "${m}", skill_code: "G", title: "G", minutes_per_session: 60, required_trust_tier: "SUPERSTAR" }
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: minutes_per_session_multiple_of_15_boundary
        claim_type: Type Constraints
        grounds:
          - entities.SkillOffer.fields.minutes_per_session
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "minutes_per_session=17 (not multiple of 15) is rejected; =15 is accepted."
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "mps@x.com", display_name: "N", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m: $.data.id }
          trigger:
            - call: "POST /skill-offers"
              payload: { member_id: "${m}", skill_code: "G", title: "G", minutes_per_session: 17 }
              as: Member
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: immutability_ledger_entry_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.LedgerEntry
        distinguishing_aspect: "LedgerEntry has common_fields:false — no PUT/PATCH/DELETE endpoints declared in §1.5; ledger is append-only."
        test_recipe:
          setup: []
          setup_api_calls: []
          trigger:
            - call: "GET /ledger-entries"
              payload: {}
              as: PlatformAdmin
          assert:
            - "GET /ledger-entries returns 200 with empty list — read is the only surface."
            - "Confirm §1.5 declares no PUT/PATCH/DELETE for /ledger-entries* (structural claim)."

  # =====================================================================
  # Section 2 — State Machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: exchange_initial_state_is_scheduled
        claim_type: Initial State
        grounds:
          - state_machines.Exchange.initial_state
        distinguishing_aspect: "Newly created Exchange starts with status=SCHEDULED."
        test_recipe:
          setup:
            - "Requester M1 (seeded 240 min), provider M2, offer o1 (60 min), request r1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "is-m1@x.com", display_name: "M1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "is-m2@x.com", display_name: "M2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m1}", delta_minutes: 240, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /skill-offers"
              payload: { member_id: "${m2}", skill_code: "G", title: "G", minutes_per_session: 60 }
              as: Member
              as_user_id: "${m2}"
              captures: { o1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m1}", skill_code: "G", needed_minutes: 60, earliest_start_utc: "2026-03-02T10:00:00Z", latest_start_utc: "2026-03-02T18:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /exchanges"
              payload: { offer_id: "${o1}", request_id: "${r1}", scheduled_start_utc: "2026-03-02T10:00:00Z", committed_minutes: 60 }
              as: Member
              as_user_id: "${m1}"
              captures: { e1: $.data.id, s: $.data.status }
          assert:
            - "Exchange.${e1}.status == SCHEDULED"

      - name: exchange_terminal_lockdown_no_transition_from_settled
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Exchange.terminal_states
        distinguishing_aspect: "From SETTLED, no transitions allowed; POST /exchanges/{id}/cancel returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Exchange e1 driven to SETTLED via full lifecycle."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "tl-m1@x.com", display_name: "M1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "tl-m2@x.com", display_name: "M2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m1}", delta_minutes: 240, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /skill-offers"
              payload: { member_id: "${m2}", skill_code: "G", title: "G", minutes_per_session: 60 }
              as: Member
              as_user_id: "${m2}"
              captures: { o1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m1}", skill_code: "G", needed_minutes: 60, earliest_start_utc: "2026-03-02T10:00:00Z", latest_start_utc: "2026-03-02T18:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
            - call: "POST /exchanges"
              payload: { offer_id: "${o1}", request_id: "${r1}", scheduled_start_utc: "2026-03-02T10:00:00Z", committed_minutes: 60 }
              as: Member
              as_user_id: "${m1}"
              captures: { e1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T11:30:00Z" }
              as: PlatformAdmin
            - call: "POST /exchanges/${e1}/mark-delivered"
              payload: {}
              as: Member
              as_user_id: "${m2}"
            - call: "POST /exchanges/${e1}/settle"
              payload: {}
              as: Member
              as_user_id: "${m1}"
          trigger:
            - call: "POST /exchanges/${e1}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: exchange_cancelled_from_delivered_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Exchange
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancel on DELIVERED (past scheduled_start_utc) is not in the transition table; returns ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Exchange e1 in DELIVERED (past start)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "it-m1@x.com", display_name: "M1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "it-m2@x.com", display_name: "M2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m1}", delta_minutes: 240, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /skill-offers"
              payload: { member_id: "${m2}", skill_code: "G", title: "G", minutes_per_session: 60 }
              as: Member
              as_user_id: "${m2}"
              captures: { o1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m1}", skill_code: "G", needed_minutes: 60, earliest_start_utc: "2026-03-02T10:00:00Z", latest_start_utc: "2026-03-02T18:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
            - call: "POST /exchanges"
              payload: { offer_id: "${o1}", request_id: "${r1}", scheduled_start_utc: "2026-03-02T10:00:00Z", committed_minutes: 60 }
              as: Member
              as_user_id: "${m1}"
              captures: { e1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T11:30:00Z" }
              as: PlatformAdmin
            - call: "POST /exchanges/${e1}/mark-delivered"
              payload: {}
              as: Member
              as_user_id: "${m2}"
          trigger:
            - call: "POST /exchanges/${e1}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: skill_request_expiry_bubble_up_on_clock_advance
        claim_type: Valid Transition
        grounds:
          - state_machines.SkillRequest.OPEN_to_EXPIRED
        distinguishing_aspect: "Advancing clock past latest_start_utc auto-transitions OPEN SkillRequests to EXPIRED."
        test_recipe:
          setup:
            - "Member M1 has SkillRequest r1 OPEN with latest_start_utc=2026-03-02T18:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "exp-m1@x.com", display_name: "M1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m1}", skill_code: "G", needed_minutes: 60, earliest_start_utc: "2026-03-02T10:00:00Z", latest_start_utc: "2026-03-02T18:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /skill-requests/${r1}"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { s: $.data.status }
          assert:
            - "SkillRequest.${r1}.status == EXPIRED"

      - name: exchange_cancel_bubble_up_to_skill_request_open
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Exchange.SCHEDULED_to_CANCELLED
          - state_machines.SkillRequest.MATCHED_to_OPEN
        distinguishing_aspect: "Cancelling a SCHEDULED Exchange bubbles up: the linked SkillRequest transitions MATCHED -> OPEN."
        test_recipe:
          setup:
            - "Exchange e1 SCHEDULED with request r1 (MATCHED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "b-m1@x.com", display_name: "M1", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m1: $.data.id }
            - call: "POST /members"
              payload: { email: "b-m2@x.com", display_name: "M2", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m2: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m1}", delta_minutes: 240, memo: "seed" }
              as: PlatformAdmin
            - call: "POST /skill-offers"
              payload: { member_id: "${m2}", skill_code: "G", title: "G", minutes_per_session: 60 }
              as: Member
              as_user_id: "${m2}"
              captures: { o1: $.data.id }
            - call: "POST /skill-requests"
              payload: { member_id: "${m1}", skill_code: "G", needed_minutes: 60, earliest_start_utc: "2026-03-05T10:00:00Z", latest_start_utc: "2026-03-05T18:00:00Z" }
              as: Member
              as_user_id: "${m1}"
              captures: { r1: $.data.id }
            - call: "POST /exchanges"
              payload: { offer_id: "${o1}", request_id: "${r1}", scheduled_start_utc: "2026-03-05T10:00:00Z", committed_minutes: 60 }
              as: Member
              as_user_id: "${m1}"
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /exchanges/${e1}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { s_e: $.data.status }
            - call: "GET /skill-requests/${r1}"
              payload: {}
              as: Member
              as_user_id: "${m1}"
              captures: { s_r: $.data.status }
          assert:
            - "Exchange.${e1}.status == CANCELLED"
            - "SkillRequest.${r1}.status == OPEN"

      - name: cycle_exchange_delivered_disputed_delivered
        claim_type: Cyclic Transition
        grounds:
          - state_machines.Exchange
        excluded_because:
          difficulty_instance: exchange_delivered_disputed_delivered_cycle
          rationale: "Covered by Rule 3 instance #1 in SCAFFOLD_DIFFICULTY_DESIGN.yaml."

  # =====================================================================
  # Section 3 — Calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: chronological_balance_after_admin_adjust
        claim_type: Correct Result
        grounds:
          - calculations.chronological_balance
        distinguishing_aspect: "Two ADMIN_ADJUSTMENT entries of +180 and -30 yield chronological_balance_minutes=150."
        test_recipe:
          setup:
            - "Member M created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
              payload: { email: "chb@x.com", display_name: "N", home_neighborhood: "NW-01" }
              as: Anonymous
              captures: { m: $.data.id }
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m}", delta_minutes: 180, memo: "seed A" }
              as: PlatformAdmin
            - call: "POST /_ledger/admin-adjust"
              payload: { member_id: "${m}", delta_minutes: -30, memo: "adj B" }
              as: PlatformAdmin
          trigger:
            - call: "GET /members/${m}"
              payload: {}
              as: PlatformAdmin
              captures: { chr: $.data.chronological_balance_minutes }
          assert:
            - "Member.${m}.chronological_balance_minutes == 150"

      - name: forward_looking_deducts_scheduled_and_delivered
        claim_type: Variant Divergence
        grounds:
          - calculations.forward_looking_balance
        excluded_because:
          difficulty_instance: forward_looking_vs_chronological_balance_on_member
          rationale: "Covered by Rule 1 instance #1."

      - name: trust_tier_boundary_first_matching_branch
        claim_type: Correct Result
        grounds:
          - calculations.trust_tier
        excluded_because:
          difficulty_instance: trust_tier_tiered_selection_mode_a
          rationale: "Covered by Rule 2 instance #2."

      - name: no_show_strikes_out_of_window_dropped
        claim_type: Input Set Filtering
