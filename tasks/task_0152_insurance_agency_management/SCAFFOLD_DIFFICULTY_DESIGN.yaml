      - name: appointment_activate_blocked_by_expired_license
        grounds:
          - state_machines.Appointment.APPROVED_to_ACTIVE
          - entities.License.fields.status
          - validations[priority=10]
          - errors[ERR_LICENSE_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair Appointment->License: an APPROVED appointment cannot activate
          when the producer's matching License computed status != ACTIVE (here the
          license has EXPIRED at server-now) -> ERR_LICENSE_NOT_ACTIVE. Different
          pair than Policy->Carrier above.
        test_recipe:
          setup:
            - "ACTIVE carrier, ACTIVE producer with a CA AUTO license expiring 2026-06-15; an APPROVED appointment; clock advanced to 2026-07-01 so the license is EXPIRED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /carriers"
              payload: { name: "Carrier C7b", naic_code: "77002", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
