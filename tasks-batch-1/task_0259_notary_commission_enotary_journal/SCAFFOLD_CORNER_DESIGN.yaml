              as: Anonymous
              captures: { nota: $.data.id }
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx}", face_value_cents: 1000000, coverage_start_at: "2026-06-01T00:00:00Z", coverage_end_at: "2030-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond1: $.data.id }
            - call: "POST /bonds/${bond1}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/commission"
              payload: {}
              as: CommissionAuthority
            - call: "POST /notaries/${nota}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "POST /bonds"
              payload: { notary_id: "${nota}", jurisdiction_id: "${jx}", face_value_cents: 1000000, coverage_start_at: "2030-06-01T00:00:01Z", coverage_end_at: "2034-06-01T00:00:00Z" }
              as: CommissionAuthority
              captures: { bond2: $.data.id }
            - call: "POST /bonds/${bond2}/activate"
              payload: {}
              as: CommissionAuthority
            - call: "GET /notaries/${nota}"
              payload: {}
              as: CommissionAuthority
              captures: { vcur: $.data.version }
          trigger:
            - call: "POST /renewals"
              payload: { notary_id: "${nota}", expected_notary_version: "${vcur}", new_bond_id: "${bond2}" }
              as: CommissionAuthority
              captures: { rnw: $.data.id }
          assert:
            - "response status code == 201"
            - "Renewal.${rnw}.status == SUBMITTED"
            - "Notary.${nota}.version == ${vcur} + 1"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: session_complete_immediate_fee_visible_in_response
        claim_type: immediate
        grounds:
          - state_machines.Session.ACTIVE_to_COMPLETED
          - entities.Session.fields.session_total_fee_cents
        excluded_because:
          difficulty_instance: dual_variant_calc / session_fee_per_act_vs_aggregate_cap
          rationale: "Immediate visibility of stamped session_total_fee_cents in the complete response is asserted by the dual-variant §1.8 instance (4100 / 3700)."

      - name: complaint_settle_immediate_bond_ledger_visible
        claim_type: immediate
        grounds:
          - state_machines.Complaint.SUBSTANTIATED_to_SETTLED
          - entities.Bond.fields.remaining_cents
        excluded_because:
          difficulty_instance: compensating_invariant / bond_settlement_conserves_face_value
          rationale: "Immediate post-settle bond ledger (claims_paid/remaining) visibility asserted by the bond-conservation §1.8 instance."
