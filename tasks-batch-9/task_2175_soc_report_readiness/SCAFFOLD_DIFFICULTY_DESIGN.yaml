  - rule_id: resource_temporal_overlap
    instances:
      - name: evidence_periods_on_a_control_are_half_open_so_adjacency_is_legal
        grounds:
          - validations[priority=230]
          - errors[ERR_EVIDENCE_PERIOD_OVERLAP]
          - entities.EvidenceRequest.fields.period_start
          - entities.EvidenceRequest.fields.period_end
        distinguishing_aspect: |
          Interval semantics 1 — HALF-OPEN [period_start, period_end) occupation on the Control
          resource: a period beginning exactly at the previous period's period_end is accepted, while
          a period straddling an existing one is rejected with ERR_EVIDENCE_PERIOD_OVERLAP. Adjacency
          is legal here, which is the opposite of the BridgeLetter rule below.
        test_recipe:
          setup:
            - "Engagement 'Skyline' exists in status SCOPING."
            - "Control E-01 exists on that engagement with no EvidenceRequest rows yet."
          setup_api_calls:
            - call: "POST /soc/engagements"
              payload: { client_name: "Skyline", report_type: "SOC_2_TYPE_2", observation_period_start: "2026-09-01T00:00:00.000Z", observation_period_end: "2026-11-30T00:00:00.000Z", required_criteria_categories: ["SECURITY"], max_distribution_recipients: 5 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { eng: $.data.id }
            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "E-01", title: "Monthly log review", frequency: "MONTHLY", automation: "MANUAL", risk_rating: "MODERATE", population_size: 20 }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { e01: $.data.id }
          trigger:
            - call: "POST /soc/evidence-requests"
              payload: { control_id: "${e01}", period_index: 0, period_start: "2026-09-01T00:00:00.000Z", period_end: "2026-10-01T00:00:00.000Z" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { er_a: $.data.id, due_a: $.data.due_date }
            - call: "POST /soc/evidence-requests"
              payload: { control_id: "${e01}", period_index: 1, period_start: "2026-10-01T00:00:00.000Z", period_end: "2026-11-01T00:00:00.000Z" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { er_b: $.data.id }
            - call: "POST /soc/evidence-requests"
              payload: { control_id: "${e01}", period_index: 2, period_start: "2026-10-15T00:00:00.000Z", period_end: "2026-11-15T00:00:00.000Z" }
              as: ComplianceLead
              as_user_id: "cl-1"
              captures: { err_overlap: $.data.error_id }
          assert:
            - "EvidenceRequest.${er_a}.status == SCHEDULED"
            - "${due_a} == 2026-10-06T00:00:00.000Z"
            - "EvidenceRequest.${er_b}.status == SCHEDULED and its period_start equals EvidenceRequest.${er_a}.period_end (adjacency accepted)"
            - "${err_overlap} == ERR_EVIDENCE_PERIOD_OVERLAP with HTTP status 409"
            - "GET /soc/evidence-requests?control_id=${e01} returns total_count == 2"
            - "Control.${e01}.evidence_scheduled_count == 2"

