  # =====================================================================================
  # RULE 8 — resource_temporal_overlap
  # Two instances with DIFFERENT interval semantics on DIFFERENT resource entities:
  #   (a) Municipality council chamber — half-open datetime intervals + trailing buffer,
  #   (b) ServiceProvider crew capacity — CLOSED date intervals where a touching day overlaps.
  # =====================================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: chamber_buffered_half_open_interval_admits_exact_touch_only
        grounds:
          - calculations.hearing_chamber_occupation
          - validations[priority=67]
          - entities.Municipality.fields.hearing_changeover_buffer_minutes
          - entities.PublicHearing.fields.scheduled_start_at
        distinguishing_aspect: |
          Resource Municipality (one council chamber, capacity 1) under HALF-OPEN datetime intervals
          extended by a 30-minute trailing changeover buffer: an 18:00-20:00 hearing occupies
          [18:00, 20:30), so a candidate starting 20:15 is rejected with ERR_HEARING_SLOT_CONFLICT
          while a candidate starting at exactly 20:30 is admitted — the shared instant is free.
        test_recipe:
          setup:
            - "One Municipality with hearing_changeover_buffer_minutes 30."
            - "Two certified AnnexationCases A and B in that municipality, each with its own four parcels under distinct APNs."
            - "Case A already has a SCHEDULED hearing for 2026-09-10T18:00:00Z to 2026-09-10T20:00:00Z."
