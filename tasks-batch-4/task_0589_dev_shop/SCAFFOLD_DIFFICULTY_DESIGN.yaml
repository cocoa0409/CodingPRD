              payload: { target_status: "IN_PROGRESS" }
              as: Engineer
              as_user_id: "eng-001"
            - call: "POST /time-entries"
              payload: { ticket_id: "${t1_id}", work_date: "2026-05-05", hours: 8.95 }
              as: Engineer
              as_user_id: "eng-001"
              captures: { te1_id: $.data.id }
            - call: "POST /time-entries/${te1_id}/review"
              payload: { decision: "APPROVE" }
              as: DeliveryLead
              as_user_id: "pm-001"
            - call: "POST /time-entries"
              payload: { ticket_id: "${t1_id}", work_date: "2026-05-06", hours: 0.05 }
              as: Engineer
              as_user_id: "eng-001"
              captures: { te2_id: $.data.id }
          trigger:
            - call: "POST /time-entries/${te2_id}/review"
