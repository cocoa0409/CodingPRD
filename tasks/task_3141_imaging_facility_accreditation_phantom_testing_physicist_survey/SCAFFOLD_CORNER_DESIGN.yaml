    - entities.ClinicalImageSubmission.fields.deficiency_deadline_at
    - entities.ModalityUnit.fields.deficiency_open_count
    distinguishing_aspect: With the immediate consistency model the deficiency outcome, its computed score, its deadline and the unit's recomputed deficiency_open_count are all visible in the responding envelope and on the very next read with no intervening write.
    test_recipe:
      setup:
      - Logical clock 2026-09-05T00:00:00Z.
