            - call: "POST /withdrawals/${w_id}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Withdrawal.${w_id}.status == DRAFT"

      - name: withdrawal_submit_blocked_by_account_restricted_status
        grounds:
          - state_machines.Withdrawal.DRAFT_to_SUBMITTED
          - state_machines.Account.OPEN_to_RESTRICTED
          - entities.Account.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Different entity pair from instance 1: Withdrawal × Account
          (instance 1 used Withdrawal × BeneficiaryChange). Withdrawal /submit
          requires Account.status == OPEN; with Account in RESTRICTED the
          submit fails.
        test_recipe:
          setup:
            - "Account a moved OPEN → RESTRICTED."
            - "Withdrawal w (HIGHER_ED 50000) in DRAFT on a."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "D12", state_code: "CA", federal_tax_id_last4: "1111", email: "d12@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B12", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "POST /contributions"
              payload: { account_id: "${a_id}", amount_cents: 200000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c_id: $.data.id }
            - call: "POST /contributions/${c_id}/post"
              payload: {}
              as: CustodianAgent
            - call: "POST /withdrawals"
              payload: { account_id: "${a_id}", amount_cents: 50000, expense_class: "HIGHER_ED_TUITION" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { w_id: $.data.id }
            - call: "POST /accounts/${a_id}/restrict"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /withdrawals/${w_id}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Withdrawal.${w_id}.status == DRAFT"

  # ============================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: k12_annual_cap_aggregate_capacity_interval_on_account
        grounds:
          - calculations.k12_excess_calc
          - constants.K12_ANNUAL_CAP_CENTS
          - entities.Account.fields.ytd_qualified_k12_cents
        distinguishing_aspect: |
          Interval semantics: aggregate-capacity within a calendar-year
          interval on a resource (Account). Multiple K-12 withdrawals
          collide when their cumulative qualified amount within the
          tax_year exceeds K12_ANNUAL_CAP_CENTS. The "overlap" is the sum
          of all DISBURSED K-12 withdrawal amounts in the year competing
          for the $10k cap; the new withdrawal's k12_excess_cents quantifies
          the over-allocation. Resource: Account. Distinct semantics from
          instance 2's adjacency-on-timestamp.
        test_recipe:
          setup:
            - "Account a with posted contribution=2000000."
            - "W1 K_12_TUITION 800000 disbursed (ytd=800000)."
            - "W2 K_12_TUITION 500000 submitted; projected ytd=1300000; k12_excess expected=300000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "D13", state_code: "CA", federal_tax_id_last4: "1111", email: "d13@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B13", date_of_birth: "2015-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "POST /contributions"
              payload: { account_id: "${a_id}", amount_cents: 2000000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c_id: $.data.id }
            - call: "POST /contributions/${c_id}/post"
              payload: {}
              as: CustodianAgent
              captures: { a_v1: $.data.version }
            - call: "POST /withdrawals"
              payload: { account_id: "${a_id}", amount_cents: 800000, expense_class: "K_12_TUITION" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { w1_id: $.data.id }
            - call: "POST /withdrawals/${w1_id}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
            - call: "POST /withdrawals/${w1_id}/approve"
              payload: { expected_account_version: "${a_v1}" }
              as: ComplianceOfficer
              captures: { a_v2: $.data.version }
            - call: "POST /withdrawals/${w1_id}/disburse"
              payload: {}
              as: CustodianAgent
              captures: { a_v3: $.data.version }
            - call: "POST /withdrawals"
              payload: { account_id: "${a_id}", amount_cents: 500000, expense_class: "K_12_TUITION" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { w2_id: $.data.id }
            - call: "POST /withdrawals/${w2_id}/submit"
              payload: {}
              as: AccountOwner
              as_user_id: "${d_id}"
          trigger:
            - call: "POST /withdrawals/${w2_id}/approve"
              payload: { expected_account_version: "${a_v3}" }
              as: ComplianceOfficer
              captures: { w2_k12: $.data.k12_excess_cents }
          assert:
            - "Withdrawal.${w2_id}.k12_excess_cents == 300000"
            - "Withdrawal.${w2_id}.status == APPROVED"

      - name: contribution_reverse_72h_strict_adjacency_window_on_contribution
        grounds:
          - validations[priority=17]
          - state_machines.Contribution.POSTED_to_REVERSED
          - errors[ERR_REVERSE_WINDOW_CLOSED]
        distinguishing_aspect: |
          Interval semantics: strict-adjacency on timestamp (open boundary)
          on a different resource entity (Contribution). The reverse window
          is a 72-hour half-open interval [posted_at_utc, posted_at_utc+72h).
          A reverse at exactly +72h fails (strict <); a reverse at
          +71h59m59s succeeds. Distinct from instance 1's aggregate-capacity
          semantics over a year-long interval.
        test_recipe:
          setup:
            - "Account a with POSTED contribution c (amount=100000) at 2026-03-01T00:00:00.000Z."
            - "Clock advanced to 2026-03-04T00:00:00.000Z exactly (=+72h)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "D14", state_code: "CA", federal_tax_id_last4: "1111", email: "d14@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B14", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "POST /contributions"
              payload: { account_id: "${a_id}", amount_cents: 100000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c_id: $.data.id }
            - call: "POST /contributions/${c_id}/post"
              payload: {}
              as: CustodianAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-04T00:00:00.000Z" }
              as: CustodianAgent
          trigger:
            - call: "POST /contributions/${c_id}/reverse"
              payload: {}
              as: CustodianAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_REVERSE_WINDOW_CLOSED"
            - "Contribution.${c_id}.status == POSTED"

  # ============================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ============================================================
  - rule_id: compensating_invariant
    instances:
      - name: contribution_post_reverse_preserves_account_balance_cents
        grounds:
          - state_machines.Contribution.DRAFT_to_POSTED
          - state_machines.Contribution.POSTED_to_REVERSED
          - entities.Account.fields.account_balance_cents
          - entities.Account.fields.total_basis_cents
        distinguishing_aspect: |
          Conserved quantity (numeric ledger): Account.account_balance_cents
          AND Account.total_basis_cents return to their pre-POST values
          after the matched POST + REVERSE pair, within the 72h window.
          Invariant pinned: balance_after_reverse == balance_before_post AND
          basis_after_reverse == basis_before_post.
        test_recipe:
          setup:
            - "Account a OPEN, balance=0 basis=0 before any contribution."
            - "Contribution c (100000 LUMP_SUM) posted at 2026-03-01."
            - "Within 72h (clock at 2026-03-02), c reversed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "D15", state_code: "CA", federal_tax_id_last4: "1111", email: "d15@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B15", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id }
            - call: "GET /accounts/${a_id}"
              payload: {}
              as: CustodianAgent
              captures: { bal_pre: $.data.account_balance_cents, basis_pre: $.data.total_basis_cents }
            - call: "POST /contributions"
              payload: { account_id: "${a_id}", amount_cents: 100000, contribution_kind: "LUMP_SUM" }
              as: CustodianAgent
              captures: { c_id: $.data.id }
            - call: "POST /contributions/${c_id}/post"
              payload: {}
              as: CustodianAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00.000Z" }
              as: CustodianAgent
          trigger:
            - call: "POST /contributions/${c_id}/reverse"
              payload: {}
              as: CustodianAgent
              captures: { c_status: $.data.status }
            - call: "GET /accounts/${a_id}"
              payload: {}
              as: CustodianAgent
              captures: { bal_post: $.data.account_balance_cents, basis_post: $.data.total_basis_cents }
          assert:
            - "Contribution.${c_id}.status == REVERSED"
            - "Account.${a_id}.account_balance_cents == 0"
            - "Account.${a_id}.total_basis_cents == 0"
            - "bal_post == bal_pre AND basis_post == basis_pre"

      - name: beneficiary_change_round_trip_preserves_account_beneficiary_id
        grounds:
          - state_machines.BeneficiaryChange.PENDING_to_APPROVED
          - entities.Account.fields.beneficiary_id
        distinguishing_aspect: |
          Conserved quantity (categorical FK identity, distinct from instance 1's
          numeric ledger): Account.beneficiary_id. Forward action: approve
          BeneficiaryChange b1→b2. Compensating action: approve a SECOND
          BeneficiaryChange b2→b1. Invariant: final
          Account.beneficiary_id == initial beneficiary_id (b1).
        test_recipe:
          setup:
            - "Donor d, Beneficiaries b1 and b2 (both CHILD)."
            - "Account a created with beneficiary_id=b1 (initial)."
            - "BeneficiaryChange bc1 (b1→b2) created and approved → a.beneficiary_id=b2."
            - "BeneficiaryChange bc2 (b2→b1) created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: CustodianAgent
            - call: "POST /donors"
              payload: { full_name: "D16", state_code: "CA", federal_tax_id_last4: "1111", email: "d16@x.com" }
              as: CustodianAgent
              captures: { d_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B16a", date_of_birth: "2008-06-01", relationship_class: "CHILD", federal_tax_id_last4: "2222" }
              as: CustodianAgent
              captures: { b1_id: $.data.id }
            - call: "POST /beneficiaries"
              payload: { full_name: "B16b", date_of_birth: "2010-06-01", relationship_class: "CHILD", federal_tax_id_last4: "3333" }
              as: CustodianAgent
              captures: { b2_id: $.data.id }
            - call: "POST /accounts"
              payload: { donor_id: "${d_id}", beneficiary_id: "${b1_id}" }
              as: CustodianAgent
              captures: { a_id: $.data.id, a_v0: $.data.version }
            - call: "POST /beneficiary-changes"
              payload: { account_id: "${a_id}", to_beneficiary_id: "${b2_id}" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { bc1_id: $.data.id }
            - call: "POST /beneficiary-changes/${bc1_id}/approve"
              payload: { expected_account_version: "${a_v0}" }
              as: ComplianceOfficer
              captures: { a_v1: $.data.version }
            - call: "POST /beneficiary-changes"
              payload: { account_id: "${a_id}", to_beneficiary_id: "${b1_id}" }
              as: AccountOwner
              as_user_id: "${d_id}"
              captures: { bc2_id: $.data.id }
          trigger:
            - call: "POST /beneficiary-changes/${bc2_id}/approve"
              payload: { expected_account_version: "${a_v1}" }
              as: ComplianceOfficer
              captures: { a_v2: $.data.version }
            - call: "GET /accounts/${a_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { a_ben: $.data.beneficiary_id }
          assert:
            - "Account.${a_id}.beneficiary_id == ${b1_id}"
            - "BeneficiaryChange.${bc2_id}.status == APPROVED"
