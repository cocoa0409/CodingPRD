            - call: "GET /compliance/sites/${site_id}"
              payload: {}
              as: ComplianceManager
              captures: { risk: "$.data.risk_exposure_score" }
          assert:
            - "Site.${site_id}.risk_exposure_score == 11.00"

      - name: vpat_issue_revoke_conserves_certification_count
        grounds:
          - state_machines.VpatReport.ISSUED_to_REVOKED
          - state_machines.Certification.GRANTED_to_REVOKED
          - entities.Certification.fields.status
        distinguishing_aspect: >-
          DIFFERENT conserved quantity = count of GRANTED Certifications for a site: granting a certification
          raises it 0->1, revoking the backing VPAT (cascading the cert GRANTED->REVOKED) restores it to 0 with
          no GRANTED cert left dangling.
        test_recipe:
          setup:
            - "Org+ACTIVE sub+Site; COMPLETED scan all findings RESOLVED; VPAT ISSUED; one GRANTED Certification."
          setup_api_calls:
            - call: "POST /compliance/organizations"
              payload: { legal_name: "Tau", contact_email: "t@tau.test" }
              as: PlatformAdmin
              captures: { org_id: "$.data.id" }
            - call: "POST /compliance/subscriptions"
              payload: { organization_id: "${org_id}", tier: "MANAGED" }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { sub_id: "$.data.id", sub_v: "$.data.version" }
            - call: "POST /compliance/sites"
              payload: { organization_id: "${org_id}", url: "https://tau.test", audited_page_count: 15 }
              as: OrgAdmin
              as_user_id: "${org_id}"
              captures: { site_id: "$.data.id" }
            - call: "POST /compliance/subscriptions/${sub_id}/activate"
              payload: { expected_subscription_version: "${sub_v}" }
              as: OrgAdmin
              as_user_id: "${org_id}"
            - call: "POST /compliance/scans"
              payload: { site_id: "${site_id}", wcag_target_level: "AA" }
              as: AuditEngineer
              captures: { scan_id: "$.data.id" }
            - call: "POST /compliance/scans/${scan_id}/start"
              payload: {}
              as: AuditEngineer
            - call: "POST /compliance/scans/${scan_id}/complete"
              payload: { findings: [ { wcag_criterion: "1.4.3", severity: "CRITICAL" } ] }
              as: AuditEngineer
            - call: "GET /compliance/findings?scan_id=${scan_id}"
              payload: {}
              as: AuditEngineer
              captures: { f_id: "$.data[0].id" }
            - call: "POST /compliance/remediation-tasks"
              payload: { finding_id: "${f_id}", assigned_vendor_id: "vendor-1", estimated_effort_hours: 2 }
              as: RemediationVendor
              captures: { task_id: "$.data.id" }
            - call: "POST /compliance/remediation-tasks/${task_id}/begin"
              payload: {}
              as: RemediationVendor
            - call: "POST /compliance/remediation-tasks/${task_id}/submit"
              payload: {}
              as: RemediationVendor
            - call: "POST /compliance/retest-runs"
              payload: { finding_id: "${f_id}", remediation_task_id: "${task_id}", outcome: "PASS" }
              as: AuditEngineer
            - call: "POST /compliance/vpat-reports"
              payload: { site_id: "${site_id}", source_scan_id: "${scan_id}" }
              as: ComplianceManager
              captures: { vpat_id: "$.data.id" }
            - call: "GET /compliance/scans/${scan_id}"
              payload: {}
              as: ComplianceManager
              captures: { scan_v: "$.data.version" }
            - call: "POST /compliance/vpat-reports/${vpat_id}/issue"
              payload: { expected_scan_version: "${scan_v}" }
              as: ComplianceManager
            - call: "POST /compliance/certifications"
              payload: { site_id: "${site_id}", vpat_report_id: "${vpat_id}" }
              as: ComplianceManager
              captures: { cert_id: "$.data.id" }
          trigger:
            - call: "POST /compliance/vpat-reports/${vpat_id}/revoke"
              payload: {}
              as: ComplianceManager
            - call: "GET /compliance/certifications/${cert_id}"
              payload: {}
              as: ComplianceManager
              captures: { cstatus: "$.data.status" }
          assert:
            - "Certification.${cert_id}.status == REVOKED"
