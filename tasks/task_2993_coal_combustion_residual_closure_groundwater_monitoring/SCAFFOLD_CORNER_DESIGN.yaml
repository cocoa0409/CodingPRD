  - section: errors
    instances:
      - name: unauthenticated_unknown_role_and_unknown_professional_are_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED
          - errors.ERR_PROFESSIONAL_NOT_FOUND
          - validations.priority_1_ERR_UNAUTHENTICATED
          - validations.priority_2_ERR_UNAUTHORIZED
          - validations.priority_3_ERR_PROFESSIONAL_NOT_FOUND
        distinguishing_aspect: |
          The three authentication gates are the first three priorities and must stay distinguishable: an
          empty X-User-Role is 401, a syntactically fine but undeclared role is 403 ERR_UNAUTHORIZED, and a
          declared entity-backed role whose X-User-ID does not resolve to a QualifiedProfessional is 404
          ERR_PROFESSIONAL_NOT_FOUND — not 401 and not 403. An implementation that authenticates by looking
          the user up first collapses the first case into the third.
        test_recipe:
          setup:
            - "No fixtures beyond one real professional, so the failures cannot be data-dependent"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Mia Chen", license_number: "HG-33003", license_state: "NC", discipline: "HYDROGEOLOGY" }
              as: UtilityAdmin
              captures: { hg_id: $.data.id }
          trigger:
            - call: "GET /ccr/units"
              as: ""
              captures: { error_id: $.data.error_id }
            - call: "GET /ccr/units"
              as: "AshCzar"
              captures: { error_id: $.data.error_id }
            - call: "GET /ccr/sampling-events"
              as: Hydrogeologist
              as_user_id: "9f1e7a52-0000-4000-8000-000000000001"
              captures: { error_id: $.data.error_id }
            - call: "GET /ccr/sampling-events"
              as: Hydrogeologist
              as_user_id: "${hg_id}"
          assert:
            - "trigger call 1 returns HTTP 401 with error_id ERR_UNAUTHENTICATED, sent with X-User-Role as the empty string (not whitespace)"
            - "trigger call 2 returns HTTP 403 with error_id ERR_UNAUTHORIZED because AshCzar is not one of the seven declared roles"
            - "trigger call 3 returns HTTP 404 with error_id ERR_PROFESSIONAL_NOT_FOUND, proving the header-shape gate ran before the lookup"
            - "trigger call 4 returns HTTP 200 with an empty paginated envelope, proving the same route works once the id resolves"
            - "every error body carries both error_id and message"

      - name: discipline_gate_rejects_the_wrong_discipline_on_three_endpoints
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DISCIPLINE_NOT_QUALIFIED
          - validations.priority_15_ERR_DISCIPLINE_NOT_QUALIFIED
          - entities.QualifiedProfessional.fields.discipline
        distinguishing_aspect: |
          Role and discipline are two independent gates. A professional may hold the right role header and
          still be unqualified: GEOTECHNICAL may sign the engineering certification but not the cost
          certification, HYDROGEOLOGY may not sign a stability assessment, and STATISTICS may not register a
          well. Each is 403 ERR_DISCIPLINE_NOT_QUALIFIED, never ERR_UNAUTHORIZED, and the same request
          succeeds when the qualified professional signs it.
        test_recipe:
          setup:
            - "Four professionals covering GEOTECHNICAL, CIVIL, HYDROGEOLOGY and STATISTICS, one clean unit and one DRAFT plan"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
              as: UtilityAdmin
              captures: { pe_geo_id: $.data.id }
            - call: "POST /ccr/professionals"
              payload: { full_name: "Owen Park", license_number: "PE-22002", license_state: "NC", discipline: "CIVIL" }
              as: UtilityAdmin
              captures: { pe_civil_id: $.data.id }
            - call: "POST /ccr/professionals"
              payload: { full_name: "Mia Chen", license_number: "HG-33003", license_state: "NC", discipline: "HYDROGEOLOGY" }
              as: UtilityAdmin
              captures: { hg_id: $.data.id }
            - call: "POST /ccr/professionals"
              payload: { full_name: "Rae Novak", license_number: "ST-44004", license_state: "NC", discipline: "STATISTICS" }
              as: UtilityAdmin
              captures: { st_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0144", unit_name: "Ash Pond 144", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /ccr/closure-plans"
              payload: { unit_id: "${unit_id}", plan_code: "CP-0144", selected_method: "CLOSURE_IN_PLACE", in_place_capital_usd_cents: 100000000, in_place_annual_care_usd_cents: 1000000, removal_capital_usd_cents: 900000000, removal_annual_care_usd_cents: 1000000, care_period_years: 30 }
              as: UtilityAdmin
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /ccr/closure-plans/${plan_id}/cost-certification"
              payload: { certified_on: "2026-08-01", cost_basis_note: "Unit-price bid tabulation, 2026 dollars, 3 percent discount basis" }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-07-15", factor_of_safety_static: 1.60, factor_of_safety_seismic: 1.10, factor_of_safety_liquefaction: 1.30 }
              as: ProfessionalEngineer
              as_user_id: "${hg_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "BG-01", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 22.00, screen_bottom_ft: 42.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${st_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/closure-plans/${plan_id}/cost-certification"
              payload: { certified_on: "2026-08-01", cost_basis_note: "Unit-price bid tabulation, 2026 dollars, 3 percent discount basis" }
              as: ProfessionalEngineer
              as_user_id: "${pe_civil_id}"
          assert:
            - "trigger call 1 returns HTTP 403 with error_id ERR_DISCIPLINE_NOT_QUALIFIED: GEOTECHNICAL is qualified for the engineering certification only"
            - "trigger call 2 returns HTTP 403 with error_id ERR_DISCIPLINE_NOT_QUALIFIED: HYDROGEOLOGY may not sign a stability assessment"
            - "trigger call 3 returns HTTP 403 with error_id ERR_DISCIPLINE_NOT_QUALIFIED: well registration requires HYDROGEOLOGY"
            - "trigger call 4 returns HTTP 200 and sets ClosurePlan.${plan_id}.cost_certified_by == ${pe_civil_id} with cost_certified_on 2026-08-01"
            - "after all four calls no StabilityAssessment and no MonitoringWell row exists for ${unit_id}"
            - "ClosurePlan.${plan_id}.status == COST_CERTIFIED after trigger call 4, taking the DRAFT to COST_CERTIFIED fork branch, and engineering_certified_by is still null"

      - name: begin_closure_separates_the_missing_plan_from_the_missed_deadline
        claim_type: error_triggerable
        grounds:
          - errors.ERR_NO_APPROVED_CLOSURE_PLAN
          - errors.ERR_CLOSURE_DEADLINE_MISSED
          - validations.priority_18_ERR_INVALID_UNIT_STATE
          - validations.priority_45_ERR_NO_APPROVED_CLOSURE_PLAN
          - validations.priority_46_ERR_CLOSURE_DEADLINE_MISSED
        distinguishing_aspect: |
          Both errors live behind the same action and the state gate deliberately lets an ACTIVE unit through
          so the missing plan is reported as ERR_NO_APPROVED_CLOSURE_PLAN rather than ERR_INVALID_UNIT_STATE.
          The deadline error is then only reachable on a unit that already has an APPROVED plan and whose
          posting obligations are satisfied, because an unposted obligation would freeze the unit and return
          ERR_UNIT_FROZEN at the earlier priority 29 instead.
        test_recipe:
          setup:
            - "Unit A ACTIVE with no closure plan at all"
            - "Unit B fully approved with both postings filed, then the clock moved one day past its 2031-03-31 deadline"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
