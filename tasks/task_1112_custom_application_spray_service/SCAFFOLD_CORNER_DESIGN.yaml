# =============================================================================
# Task 1112 — §1.9 Scaffold Corner Design (Coverage Index for non-difficulty
# claims). Sections follow references/claim-extraction-guide.md. Instances
# already covered by §1.8 appear as excluded_because stubs.
# =============================================================================

scaffold_corner_design:
  # ========================================================== entities =====
  - section: entities
    instances:
      - name: customer_creation_applies_defaults
        claim_type: creation
        grounds: [entities.Customer.fields.outstanding_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /api/customers returns 201 with server id/created_at/version==1 and computed outstanding_cents == 0; client-supplied outstanding_cents is ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/customers", payload: { name: "Solo Farm", billing_email: "s@farm.test", rate_per_acre_cents: 900, credit_limit_cents: 500000 }, as: CoopAdmin, captures: { c_id: $.data.id, c_out: $.data.outstanding_cents, c_v: $.data.version } }
          assert:
            - "Customer.${c_id}.outstanding_cents == 0"
            - "Customer.${c_id}.version == 1 and id is a server-minted UUID"

      - name: field_create_missing_required_acres
        claim_type: required_fields
        grounds: [entities.Field.fields.acres, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Missing required input acres on field creation is rejected with ERR_VALIDATION (400) before any existence or business check."
        test_recipe:
          setup: ["one customer exists"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Solo Farm", billing_email: "s@farm.test", rate_per_acre_cents: 900, credit_limit_cents: 500000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /api/fields", payload: { customer_id: "${c_id}", label: "No Acres", crop: "CORN", buffer_clearance_ft: 100 }, as: Grower, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
          assert:
            - "trigger error == ERR_VALIDATION (http 400)"

      - name: get_nonexistent_work_order_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=5]"]
        distinguishing_aspect: "GET on a well-formed but unknown work-order UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/work-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "trigger error == ERR_NOT_FOUND (http 404)"

      - name: work_order_create_with_nonexistent_field_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.WorkOrder.fields.field_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Flat topology FK integrity: creating a work order whose field_id does not exist fails ERR_NOT_FOUND even though the caller's customer exists."
        test_recipe:
          setup: ["one customer exists"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Solo Farm", billing_email: "s@farm.test", rate_per_acre_cents: 900, credit_limit_cents: 500000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
          trigger:
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", prescription_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", acres_to_treat: 10 }, as: Grower, as_user_id: "${c_id}", captures: { err: $.data.error_id } }
          assert:
            - "trigger error == ERR_NOT_FOUND"

      - name: product_create_invalid_category_enum
        claim_type: type_constraints
        grounds: [entities.Product.fields.category, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "category must be one of HERBICIDE | INSECTICIDE | FUNGICIDE; any other string fails with ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/products", payload: { name: "Mystery", epa_registration_no: "EPA-9", category: "RODENTICIDE", rei_hours: 24, max_wind_mph: 10, min_temp_f: 40, max_temp_f: 85, required_buffer_ft: 0, unit_cost_cents: 1000, markup_pct: 10 }, as: CoopAdmin, captures: { err: $.data.error_id } }
          assert:
            - "trigger error == ERR_VALIDATION"

      - name: schedule_with_inverted_window_returns_invalid_request
        claim_type: type_constraints
        grounds: [state_machines.WorkOrder.DRAFT_to_SCHEDULED, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "scheduled_start >= scheduled_end is a shape-level rejection (ERR_VALIDATION) distinct from the prescription-window business error."
        test_recipe:
          setup:
            - "Base fixture (C1/F1/P1/P2/RX1 APPROVED/AP1/EQ1 calibrated); WO1 in DRAFT"
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Green Acres", billing_email: "g1@farm.test", rate_per_acre_cents: 1200, credit_limit_cents: 2000000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /api/fields", payload: { customer_id: "${c_id}", label: "North 40", crop: "CORN", acres: 100, buffer_clearance_ft: 300 }, as: Grower, as_user_id: "${c_id}", captures: { f_id: $.data.id } }
            - { call: "POST /api/products", payload: { name: "WeedOut", epa_registration_no: "EPA-100-1", category: "HERBICIDE", rei_hours: 24, max_wind_mph: 10, min_temp_f: 40, max_temp_f: 85, required_buffer_ft: 100, unit_cost_cents: 5000, markup_pct: 10 }, as: CoopAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/products", payload: { name: "FungiStop", epa_registration_no: "EPA-200-2", category: "FUNGICIDE", rei_hours: 48, max_wind_mph: 15, min_temp_f: 50, max_temp_f: 90, required_buffer_ft: 0, unit_cost_cents: 2500, markup_pct: 20 }, as: CoopAdmin, captures: { p2: $.data.id } }
            - { call: "POST /api/prescriptions", payload: { field_id: "${f_id}", season_year: 2026, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T23:59:59Z", carrier_gpa: 12, lines: [ { product_id: "${p1}", rate_per_acre: 1.5 }, { product_id: "${p2}", rate_per_acre: 0.4 } ] }, as: Agronomist, captures: { rx: $.data.id } }
            - { call: "GET /api/fields/${f_id}", as: CoopAdmin, captures: { f_v: $.data.version } }
            - { call: "POST /api/prescriptions/${rx}/approve", payload: { expected_field_version: "${f_v}" }, as: Agronomist }
            - { call: "POST /api/applicators", payload: { display_name: "Ann", license_no: "L-100", license_expires_on: "2027-01-01T00:00:00Z", license_categories: ["HERBICIDE", "FUNGICIDE"] }, as: CoopAdmin, captures: { ap: $.data.id } }
            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-1", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq}", target_gpa: 20.0, measured_gpa: 20.5 }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f_id}", prescription_id: "${rx}", acres_to_treat: 100 }, as: Grower, as_user_id: "${c_id}", captures: { wo: $.data.id } }
          trigger:
            - { call: "POST /api/work-orders/${wo}/schedule", payload: { applicator_id: "${ap}", equipment_id: "${eq}", scheduled_start: "2026-05-10T11:00:00Z", scheduled_end: "2026-05-10T08:00:00Z" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "trigger error == ERR_VALIDATION (start >= end)"

      - name: calibration_records_are_immutable_log
        claim_type: immutability
        grounds: [entities.CalibrationRecord]
        distinguishing_aspect: "CalibrationRecord exposes no update/delete path: posting a second record leaves the first untouched and both visible via the filtered list."
        test_recipe:
          setup: ["applicator and equipment exist"]
          setup_api_calls:
            - { call: "POST /api/applicators", payload: { display_name: "Ann", license_no: "L-100", license_expires_on: "2027-01-01T00:00:00Z", license_categories: ["HERBICIDE"] }, as: CoopAdmin, captures: { ap: $.data.id } }
            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-1", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eq: $.data.id } }
          trigger:
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq}", target_gpa: 20.0, measured_gpa: 20.5 }, as: Applicator, as_user_id: "${ap}", captures: { cal1: $.data.id } }
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq}", target_gpa: 20.0, measured_gpa: 20.6 }, as: Applicator, as_user_id: "${ap}" }
            - { call: "GET /api/calibration-records", as: CoopAdmin, captures: { first: "$.data[0].id", first_err: "$.data[0].error_pct" } }
          assert:
            - "GET /api/calibration-records?equipment_id returns 2 records"
            - "first record (${cal1}) still present with error_pct == 2.5 (unchanged by the later post)"

      - name: computed_rei_until_covered_by_difficulty
        claim_type: computed_fields
        grounds: [entities.Field.fields.rei_until]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / start_blocked_by_field_rei
          rationale: "rei_until value 2026-05-12T10:30:00Z is asserted there as the gate's anchor."

  # ===================================================== state_machines =====
  - section: state_machines
    instances:
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds: [state_machines.WorkOrder, state_machines.Prescription, state_machines.Applicator, state_machines.Equipment]
        distinguishing_aspect: "New entities start in their declared initial states: WorkOrder DRAFT (applicator_id null), Prescription DRAFT, Applicator ACTIVE, Equipment AVAILABLE with calibration_valid_until null."
        test_recipe:
          setup: ["one customer, one field, one prescription draft, one applicator, one equipment"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Solo Farm", billing_email: "s@farm.test", rate_per_acre_cents: 900, credit_limit_cents: 500000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /api/fields", payload: { customer_id: "${c_id}", label: "F", crop: "CORN", acres: 100, buffer_clearance_ft: 300 }, as: Grower, as_user_id: "${c_id}", captures: { f_id: $.data.id } }
            - { call: "POST /api/products", payload: { name: "WeedOut", epa_registration_no: "EPA-100-1", category: "HERBICIDE", rei_hours: 24, max_wind_mph: 10, min_temp_f: 40, max_temp_f: 85, required_buffer_ft: 100, unit_cost_cents: 5000, markup_pct: 10 }, as: CoopAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/prescriptions", payload: { field_id: "${f_id}", season_year: 2026, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T23:59:59Z", carrier_gpa: 12, lines: [ { product_id: "${p1}", rate_per_acre: 1.5 } ] }, as: Agronomist, captures: { rx: $.data.id, rx_st: $.data.status } }
            - { call: "POST /api/applicators", payload: { display_name: "Ann", license_no: "L-100", license_expires_on: "2027-01-01T00:00:00Z", license_categories: ["HERBICIDE"] }, as: CoopAdmin, captures: { ap: $.data.id, ap_st: $.data.status } }
            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-1", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eq: $.data.id, eq_st: $.data.status, eq_valid: $.data.calibration_valid_until } }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f_id}", prescription_id: "${rx}", acres_to_treat: 100 }, as: Grower, as_user_id: "${c_id}", captures: { wo: $.data.id, wo_st: $.data.status, wo_appl: $.data.applicator_id } }
          trigger: []
          assert:
            - "WorkOrder.${wo}.status == DRAFT and applicator_id == null and estimated_total_cents == null"
            - "Prescription.${rx}.status == DRAFT"
            - "Applicator.${ap}.status == ACTIVE with penalty_points_lifetime == 0"
            - "Equipment.${eq}.status == AVAILABLE and calibration_valid_until == null"

      - name: complete_from_scheduled_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete is only valid from IN_PROGRESS; a SCHEDULED (never started) work order rejects it with ERR_INVALID_STATE — the assigned applicator matches, so the state rule is what fires."
        test_recipe:
          setup: ["Base fixture; WO1 SCHEDULED 2026-05-10 08:00-11:00Z but never started"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Green Acres", billing_email: "g1@farm.test", rate_per_acre_cents: 1200, credit_limit_cents: 2000000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /api/fields", payload: { customer_id: "${c_id}", label: "North 40", crop: "CORN", acres: 100, buffer_clearance_ft: 300 }, as: Grower, as_user_id: "${c_id}", captures: { f_id: $.data.id } }
            - { call: "POST /api/products", payload: { name: "WeedOut", epa_registration_no: "EPA-100-1", category: "HERBICIDE", rei_hours: 24, max_wind_mph: 10, min_temp_f: 40, max_temp_f: 85, required_buffer_ft: 100, unit_cost_cents: 5000, markup_pct: 10 }, as: CoopAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/prescriptions", payload: { field_id: "${f_id}", season_year: 2026, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T23:59:59Z", carrier_gpa: 12, lines: [ { product_id: "${p1}", rate_per_acre: 1.5 } ] }, as: Agronomist, captures: { rx: $.data.id } }
            - { call: "GET /api/fields/${f_id}", as: CoopAdmin, captures: { f_v: $.data.version } }
            - { call: "POST /api/prescriptions/${rx}/approve", payload: { expected_field_version: "${f_v}" }, as: Agronomist }
            - { call: "POST /api/applicators", payload: { display_name: "Ann", license_no: "L-100", license_expires_on: "2027-01-01T00:00:00Z", license_categories: ["HERBICIDE"] }, as: CoopAdmin, captures: { ap: $.data.id } }
            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-1", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq}", target_gpa: 20.0, measured_gpa: 20.5 }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f_id}", prescription_id: "${rx}", acres_to_treat: 100 }, as: Grower, as_user_id: "${c_id}", captures: { wo: $.data.id } }
            - { call: "POST /api/work-orders/${wo}/schedule", payload: { applicator_id: "${ap}", equipment_id: "${eq}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T11:00:00Z" }, as: Dispatcher }
          trigger:
            - { call: "POST /api/work-orders/${wo}/complete", payload: { lines: [ { product_id: "${p1}", actual_rate_per_acre: 1.5 } ] }, as: Applicator, as_user_id: "${ap}", captures: { err: $.data.error_id } }
          assert:
            - "trigger error == ERR_INVALID_STATE (SCHEDULED, not IN_PROGRESS)"

      - name: cancel_already_cancelled_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WorkOrder.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a second cancel is rejected ERR_INVALID_STATE and no side effects fire."
        test_recipe:
          setup: ["one customer + field + draft prescription + DRAFT work order"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Solo Farm", billing_email: "s@farm.test", rate_per_acre_cents: 900, credit_limit_cents: 500000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /api/fields", payload: { customer_id: "${c_id}", label: "F", crop: "CORN", acres: 100, buffer_clearance_ft: 300 }, as: Grower, as_user_id: "${c_id}", captures: { f_id: $.data.id } }
            - { call: "POST /api/products", payload: { name: "WeedOut", epa_registration_no: "EPA-100-1", category: "HERBICIDE", rei_hours: 24, max_wind_mph: 10, min_temp_f: 40, max_temp_f: 85, required_buffer_ft: 100, unit_cost_cents: 5000, markup_pct: 10 }, as: CoopAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/prescriptions", payload: { field_id: "${f_id}", season_year: 2026, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T23:59:59Z", carrier_gpa: 12, lines: [ { product_id: "${p1}", rate_per_acre: 1.5 } ] }, as: Agronomist, captures: { rx: $.data.id } }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f_id}", prescription_id: "${rx}", acres_to_treat: 100 }, as: Grower, as_user_id: "${c_id}", captures: { wo: $.data.id } }
            - { call: "POST /api/work-orders/${wo}/cancel", as: Dispatcher }
          trigger:
            - { call: "POST /api/work-orders/${wo}/cancel", as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "trigger error == ERR_INVALID_STATE (terminal lockdown)"

      - name: approve_already_approved_prescription_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Prescription.DRAFT_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Re-approving an APPROVED prescription repeats the trigger; the second attempt is not idempotent — it is rejected ERR_INVALID_STATE because the from-state DRAFT no longer holds."
        test_recipe:
          setup: ["customer, field, product, DRAFT prescription"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Solo Farm", billing_email: "s@farm.test", rate_per_acre_cents: 900, credit_limit_cents: 500000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /api/fields", payload: { customer_id: "${c_id}", label: "F", crop: "CORN", acres: 100, buffer_clearance_ft: 300 }, as: Grower, as_user_id: "${c_id}", captures: { f_id: $.data.id } }
            - { call: "POST /api/products", payload: { name: "WeedOut", epa_registration_no: "EPA-100-1", category: "HERBICIDE", rei_hours: 24, max_wind_mph: 10, min_temp_f: 40, max_temp_f: 85, required_buffer_ft: 100, unit_cost_cents: 5000, markup_pct: 10 }, as: CoopAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/prescriptions", payload: { field_id: "${f_id}", season_year: 2026, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T23:59:59Z", carrier_gpa: 12, lines: [ { product_id: "${p1}", rate_per_acre: 1.5 } ] }, as: Agronomist, captures: { rx: $.data.id } }
            - { call: "GET /api/fields/${f_id}", as: CoopAdmin, captures: { f_v: $.data.version } }
            - { call: "POST /api/prescriptions/${rx}/approve", payload: { expected_field_version: "${f_v}" }, as: Agronomist }
            - { call: "GET /api/fields/${f_id}", as: CoopAdmin, captures: { f_v2: $.data.version } }
          trigger:
            - { call: "POST /api/prescriptions/${rx}/approve", payload: { expected_field_version: "${f_v2}" }, as: Agronomist, captures: { err: $.data.error_id } }
          assert:
            - "trigger error == ERR_INVALID_STATE (already APPROVED; fresh OCC version does not rescue a bad from-state)"

      - name: complete_creates_application_record_snapshot
        claim_type: side_effect_execution
        grounds: [state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED, entities.ApplicationRecord.fields.applicator_id]
        distinguishing_aspect: "Completion's side effects are all observable: exactly one ApplicationRecord exists (SUBMITTED) snapshotting applicator and times, with started_at == 2026-05-10T08:00:00Z and completed_at == 2026-05-10T10:30:00Z."
        test_recipe:
          setup: ["Base fixture; WO1 started 08:00, completed 10:30 on 2026-05-10"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Green Acres", billing_email: "g1@farm.test", rate_per_acre_cents: 1200, credit_limit_cents: 2000000 }, as: CoopAdmin, captures: { c_id: $.data.id } }
            - { call: "POST /api/fields", payload: { customer_id: "${c_id}", label: "North 40", crop: "CORN", acres: 100, buffer_clearance_ft: 300 }, as: Grower, as_user_id: "${c_id}", captures: { f_id: $.data.id } }
            - { call: "POST /api/products", payload: { name: "WeedOut", epa_registration_no: "EPA-100-1", category: "HERBICIDE", rei_hours: 24, max_wind_mph: 10, min_temp_f: 40, max_temp_f: 85, required_buffer_ft: 100, unit_cost_cents: 5000, markup_pct: 10 }, as: CoopAdmin, captures: { p1: $.data.id } }
            - { call: "POST /api/prescriptions", payload: { field_id: "${f_id}", season_year: 2026, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T23:59:59Z", carrier_gpa: 12, lines: [ { product_id: "${p1}", rate_per_acre: 1.5 } ] }, as: Agronomist, captures: { rx: $.data.id } }
            - { call: "GET /api/fields/${f_id}", as: CoopAdmin, captures: { f_v: $.data.version } }
            - { call: "POST /api/prescriptions/${rx}/approve", payload: { expected_field_version: "${f_v}" }, as: Agronomist }
            - { call: "POST /api/applicators", payload: { display_name: "Ann", license_no: "L-100", license_expires_on: "2027-01-01T00:00:00Z", license_categories: ["HERBICIDE"] }, as: CoopAdmin, captures: { ap: $.data.id } }
            - { call: "POST /api/equipment", payload: { unit_label: "Sprayer-1", tank_capacity_gal: 400 }, as: CoopAdmin, captures: { eq: $.data.id } }
            - { call: "POST /api/calibration-records", payload: { equipment_id: "${eq}", target_gpa: 20.0, measured_gpa: 20.5 }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/work-orders", payload: { customer_id: "${c_id}", field_id: "${f_id}", prescription_id: "${rx}", acres_to_treat: 100 }, as: Grower, as_user_id: "${c_id}", captures: { wo: $.data.id } }
            - { call: "POST /api/work-orders/${wo}/schedule", payload: { applicator_id: "${ap}", equipment_id: "${eq}", scheduled_start: "2026-05-10T08:00:00Z", scheduled_end: "2026-05-10T11:00:00Z" }, as: Dispatcher }
            - { call: "POST /api/weather-observations", payload: { observed_at: "2026-05-10T07:30:00Z", wind_mph: 8, temp_f: 65, inversion_present: false }, as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T08:00:00Z" }, as: CoopAdmin }
            - { call: "POST /api/work-orders/${wo}/start", as: Applicator, as_user_id: "${ap}" }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T10:30:00Z" }, as: CoopAdmin }
          trigger:
