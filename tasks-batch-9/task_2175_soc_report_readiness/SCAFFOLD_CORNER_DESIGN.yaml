            - "the criterion-anchored gap has trust_criterion_id == ${cc}, control_id == null and severity == HIGH"
            - "Engagement.${eng}.base_debt_points == 16"
            - "Engagement.${eng}.gap_posture == RESTRICTED"
            - "Engagement.${eng}.readiness_assessed_at == 2026-08-01T00:00:00.000Z"

      - name: corner_exception_projection_variant_divergence
        claim_type: variant_divergence
