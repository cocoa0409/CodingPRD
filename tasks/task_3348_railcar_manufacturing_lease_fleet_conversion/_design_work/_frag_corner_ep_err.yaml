            - "The control proves the approver is otherwise authorised: POST /substitution-endorsements/${e2_id}/approve by the same X-User-ID user-op-9 returns HTTP 200 with data.status == ${e2_after} == \"APPROVED\""
            - "data.version == ${e2_version} == 2 on the approved endorsement, so the approval's own version increment landed"

      - name: error_not_found_unresolvable_component_path_id_returns_404
        claim_type: Violation → Error
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
          - "GET /api/v1/components/{id}"
        distinguishing_aspect: "A path-templated component id that resolves to no persisted row is rejected by priority 3 with ERR_NOT_FOUND and HTTP 404, while the identical call against a created component returns 200 — so the 404 is id-specific rather than endpoint-wide."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "One real component WS-N1 exists so the 404 cannot be blamed on an empty store."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/components"
              payload: { part_number: "WS-N1", component_class: "WHEELSET", unit_cost_cents: 1000, lead_time_days: 5 }
              as: SupplyChainCoordinator
              captures: { ws_id: $.data.id }
          trigger:
            - call: "GET /api/v1/components/00000000-0000-0000-0000-0000000000d1"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
            - call: "GET /api/v1/components/${ws_id}"
              payload: {}
              as: PlatformAdmin
              captures: { real_id: $.data.id, real_part: $.data.part_number }
          assert:
            - "The unresolvable path id returns HTTP 404 with data.error_id == ${err_id} == \"ERR_NOT_FOUND\""
            - "The control read on the created component returns HTTP 200 with data.id == ${real_id} == ${ws_id} and data.part_number == ${real_part} == \"WS-N1\""
            - "Priority 3 resolves path ids left to right and precedes payload and state rules; this GET carries no body, so no later rule can pre-empt it"
            - "A syntactically well-formed UUID that names nothing is treated exactly like any other unresolvable id"
            - "The failed lookup is side-effect free: the Component row count stays at 1 and no row is created or mutated"

