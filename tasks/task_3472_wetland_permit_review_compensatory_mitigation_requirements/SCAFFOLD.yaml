# =============================================================================
# Scaffold: Wetland Permit Review & Compensatory Mitigation (USACE-style)
# Difficulty target: beyond Expert — dense coupling, 13 entities, branching +
# cyclic + dual-dimension state machines, 7 interlocking calculations,
# 30-rule validation stack, 6-role RBAC with segregation of duties.
# =============================================================================

scenario: |
  Wetland Permit Review & Compensatory Mitigation Requirements (US Army Corps of Engineers): jurisdictional determination establishing whether waters are regulated with delineation review and appeal rights, permit pathway selection between general permits with streamlined conditions and individual permits with public notice, alternatives analysis requiring avoidance and minimization before compensation is considered, public interest review balancing economic, environmental and navigation considerations with agency comments, compensatory mitigation requirements with credit purchase from banks, in-lieu fee programs or permittee-responsible mitigation, mitigation ratios varying by resource type, location and timing lag, permit conditions, monitoring and long-term stewardship obligations, enforcement of unauthorized fill with restoration orders and after-the-fact permits

domain_name: wetland-permit-review
api_prefix: /wetland-permits

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (13 entities, flat topology)
# All resource enum values are producible by declared transitions or system
# initialization (see state_machines). All list endpoints sort by created_at
# ascending unless the endpoint description pins a different key.
# =============================================================================
entities:
  - name: Applicant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the permit applicant" }
      - { name: organization_type, type: enum, source: input, description: "INDIVIDUAL | CORPORATION | GOVERNMENT | NONPROFIT" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: prior_violation_count, type: integer, source: computed, description: "Count of EnforcementCase rows with responsible_applicant_id = this applicant and case_status != OPENED" }

  - name: WatersSite
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: input, description: "FK -> Applicant.id; owner of the site" }
      - { name: site_name, type: string, source: input, description: "Site name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code where the site sits" }
      - { name: watershed_code, type: string, source: input, description: "8-digit HUC watershed code" }
      - { name: total_acres, type: number, source: input, description: "Total site acreage; must be > 0" }
      - { name: resource_types_present, type: array, source: input, description: "Non-empty subset of EMERGENT_MARSH | FORESTED_WETLAND | OPEN_WATER | STREAM" }

  - name: JurisdictionalDetermination
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> WatersSite.id" }
      - { name: jd_type, type: enum, source: input, description: "PRELIMINARY | APPROVED; only APPROVED carries appeal rights" }
      - { name: determination, type: enum, source: input, description: "JURISDICTIONAL | NON_JURISDICTIONAL" }
      - { name: rationale, type: string, source: input, description: "Delineation review rationale" }
      - { name: issued_date, type: datetime, source: system, description: "Logical clock value at issue; null while DRAFT" }
      - { name: expiration_date, type: datetime, source: computed, description: "issued_date + 1825 days; null while DRAFT" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | REVERSED" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: jd_id, type: string, source: input, description: "FK -> JurisdictionalDetermination.id" }
      - { name: appellant_applicant_id, type: string, source: system, description: "FK -> Applicant.id; set from X-User-ID at filing" }
      - { name: grounds_text, type: string, source: input, description: "Appeal grounds" }
      - { name: filed_date, type: datetime, source: system, description: "Logical clock value at filing" }
      - { name: decided_date, type: datetime, source: system, description: "Logical clock value at decision; null while FILED" }
      - { name: decision_rationale, type: string, source: system, description: "Copied from the decide payload; null while FILED" }
      - { name: status, type: enum, source: system, description: "FILED | SUSTAINED | DENIED" }

  - name: PermitApplication
    parent: null
    common_fields: true
    fields:
      - { name: applicant_id, type: string, source: system, description: "FK -> Applicant.id; set from X-User-ID at creation" }
      - { name: site_id, type: string, source: input, description: "FK -> WatersSite.id" }
      - { name: jd_id, type: string, source: input, description: "FK -> JurisdictionalDetermination.id; replaced by new_jd_id on resubmit from SUSPENDED_PENDING_JD" }
      - { name: pathway, type: enum, source: input, description: "GENERAL | INDIVIDUAL | ATF_GENERAL | ATF_INDIVIDUAL" }
      - { name: general_permit_code, type: string, source: input, description: "Required iff pathway is GENERAL or ATF_GENERAL; must be NWP-29 or NWP-39" }
      - { name: impacts, type: array, source: input, description: "Non-empty array of {resource_type, impact_acres}; resource_type must be in the site's resource_types_present; impact_acres > 0" }
      - { name: total_impact_acres, type: number, source: computed, description: "Sum of impacts[].impact_acres" }
      - { name: is_after_the_fact, type: boolean, source: computed, description: "true iff pathway is ATF_GENERAL or ATF_INDIVIDUAL" }
      - { name: enforcement_case_id, type: string, source: input, description: "FK -> EnforcementCase.id; required iff is_after_the_fact" }
      - { name: project_purpose, type: string, source: input, description: "Project purpose statement" }
      - { name: estimated_cost_dollars, type: number, source: input, description: "Estimated project cost; >= 0" }
      - { name: submitted_date, type: datetime, source: system, description: "Logical clock at most recent successful submit; null while never submitted" }
      - { name: screening_reviewer_id, type: string, source: system, description: "X-User-ID captured at screening BEGIN; used by the segregation-of-duties gate at render-decision" }
      - { name: pir_score, type: number, source: computed, description: "Public interest review score computed at advance-to-decision (individual pathways only); null otherwise" }
      - { name: pir_outcome, type: enum, source: computed, description: "FAVORABLE | UNFAVORABLE; null until computed (individual pathways only)" }
      - { name: compensatory_mitigation_required, type: boolean, source: computed, description: "true iff total_impact_acres > 0.10 (strictly greater)" }
      - { name: notice_status, type: enum, source: system, description: "Independent notice dimension: NONE | PUBLISHED | COMMENT_PERIOD_CLOSED" }
      - { name: notice_published_date, type: datetime, source: system, description: "Logical clock at publish-notice; null until published" }
      - { name: comment_period_days, type: integer, source: system, description: "Comment window length set at publish-notice; default 30, range 15..60" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | SCREENING | RETURNED_TO_APPLICANT | ALTERNATIVES_REVIEW | PUBLIC_NOTICE_OPEN | DECISION_PENDING | ISSUED | DENIED | WITHDRAWN | SUSPENDED_PENDING_JD" }

  - name: AlternativesAnalysis
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> PermitApplication.id" }
      - { name: avoidance_demonstrated, type: boolean, source: input, description: "Whether avoidance of waters impacts is demonstrated" }
      - { name: avoidance_narrative, type: string, source: input, description: "Avoidance narrative" }
      - { name: minimization_steps, type: array, source: input, description: "Array of minimization step descriptions" }
      - { name: ledpa_conclusion, type: enum, source: input, description: "PROPOSED_IS_LEDPA | ALTERNATIVE_IS_LEDPA | UNDETERMINED" }
      - { name: offsite_alternatives_considered, type: integer, source: input, description: "Count of offsite alternatives considered; >= 0" }
      - { name: revision_count, type: integer, source: system, description: "Starts at 0; +1 on each PATCH that returns the analysis from REVISION_REQUESTED to SUBMITTED" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | REVISION_REQUESTED | ACCEPTED | REJECTED" }

  - name: AgencyComment
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> PermitApplication.id" }
      - { name: agency, type: enum, source: input, description: "EPA | FWS | NMFS | STATE_WATER_QUALITY | TRIBAL_AUTHORITY" }
      - { name: comment_type, type: enum, source: input, description: "ADVISORY | SUBSTANTIVE_OBJECTION | CONCURRENCE" }
      - { name: comment_text, type: string, source: input, description: "Comment body" }
      - { name: filed_date, type: datetime, source: system, description: "Logical clock at filing" }
      - { name: resolution_text, type: string, source: system, description: "Copied from the resolve payload; null while FILED" }
      - { name: status, type: enum, source: system, description: "FILED | RESOLVED" }

  - name: MitigationPlan
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> PermitApplication.id" }
      - { name: mechanism, type: enum, source: input, description: "BANK_CREDITS | IN_LIEU_FEE | PERMITTEE_RESPONSIBLE | COMBINATION" }
      - { name: financial_assurance_dollars, type: number, source: input, default: 0, description: "Posted financial assurance; >= 0" }
      - { name: stewardship_entity_name, type: string, source: input, description: "Long-term stewardship entity name; required for PERMITTEE_RESPONSIBLE and COMBINATION" }
      - { name: long_term_stewardship_secured, type: boolean, source: input, default: false, description: "Whether a long-term stewardship agreement is executed" }
      - { name: required_credits_by_type, type: object, source: computed, description: "Provisional credits per resource type computed at creation (see mitigation_credit_requirement, provisional variant)" }
      - { name: final_credits_required_by_type, type: object, source: computed, description: "Final credits per resource type recomputed at secure-credits (final variant); null until secured" }
      - { name: ilf_fee_due_dollars, type: number, source: computed, description: "In-lieu fee computed at creation for IN_LIEU_FEE and COMBINATION mechanisms; null otherwise" }
      - { name: ilf_fee_paid_dollars, type: number, source: system, description: "Amount accepted at pay-in-lieu-fee; 0 until paid" }
      - { name: assurance_required_dollars, type: number, source: computed, description: "Financial assurance required for PERMITTEE_RESPONSIBLE and COMBINATION; null otherwise" }
      - { name: secured_date, type: datetime, source: system, description: "Logical clock when the plan reached CREDITS_SECURED; null until then" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | CREDITS_SECURED | ACTIVE | COMPLETED | DEFAULTED | CANCELLED" }

  - name: MitigationBank
    parent: null
    common_fields: true
    fields:
      - { name: bank_name, type: string, source: input, description: "Bank name" }
      - { name: sponsor_name, type: string, source: input, description: "Bank sponsor name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code the bank operates in" }
      - { name: service_area_watersheds, type: array, source: input, description: "Non-empty array of 8-digit HUC codes the bank serves" }
      - { name: credit_capacity, type: object, source: input, description: "Approved capacity per resource type, e.g. {FORESTED_WETLAND: 20}; missing types are 0; values >= 0" }
      - { name: base_price_per_credit, type: object, source: input, description: "Base price in dollars per credit per resource type; values > 0 for types with capacity" }
      - { name: credits_reserved_by_type, type: object, source: computed, description: "Sum of credits over this bank's CreditTransactions with status RESERVED, per resource type" }
      - { name: credits_purchased_by_type, type: object, source: computed, description: "Sum of credits over this bank's CreditTransactions with status PURCHASED, per resource type" }
      - { name: available_credits_by_type, type: object, source: computed, description: "credit_capacity minus reserved minus purchased, per resource type" }
      - { name: revenue_dollars, type: number, source: computed, description: "Sum of total_price_dollars over PURCHASED transactions minus sum over REFUNDED transactions" }
      - { name: status, type: enum, source: system, description: "PENDING_APPROVAL | OPERATIONAL | SUSPENDED" }

  - name: CreditTransaction
    parent: null
    common_fields: true
    fields:
      - { name: bank_id, type: string, source: input, description: "FK -> MitigationBank.id" }
      - { name: plan_id, type: string, source: input, description: "FK -> MitigationPlan.id" }
      - { name: resource_type, type: enum, source: input, description: "EMERGENT_MARSH | FORESTED_WETLAND | OPEN_WATER | STREAM; must be a key of the plan's required_credits_by_type" }
      - { name: credits, type: number, source: input, description: "Credits to reserve; > 0" }
      - { name: price_per_credit_dollars, type: number, source: computed, description: "Tier-adjusted unit price stamped at purchase; null while RESERVED" }
      - { name: total_price_dollars, type: number, source: computed, description: "round_half_up(credits * price_per_credit_dollars, 2) stamped at purchase; null while RESERVED" }
      - { name: status, type: enum, source: system, description: "RESERVED | PURCHASED | RELEASED | REFUNDED" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> PermitApplication.id; set at render-decision ISSUE" }
      - { name: permit_number, type: string, source: system, description: "WP- plus a 4-digit zero-padded sequential count of issued permits starting at 1 (WP-0001); count-based, never id-derived" }
      - { name: issue_date, type: datetime, source: system, description: "Logical clock at issuance" }
      - { name: expiration_date, type: datetime, source: computed, description: "issue_date + 1825 days" }
      - { name: special_conditions, type: array, source: system, description: "Pinned per pathway. GENERAL and ATF_GENERAL: [\"SC-GP-01: Erosion and sediment controls must be maintained for the duration of the authorized work\", \"SC-GP-02: Work must be completed within the general permit activity limits\"]. INDIVIDUAL and ATF_INDIVIDUAL: [\"SC-IP-01: Five years of mitigation monitoring reports are required\", \"SC-IP-02: Long-term stewardship must be maintained by the designated stewardship entity\", \"SC-IP-03: Compensatory mitigation must remain secured for the life of the project\"]" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACTIVE | SUSPENDED | CLOSED | EXPIRED" }

  - name: MonitoringReport
    parent: null
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> Permit.id" }
      - { name: plan_id, type: string, source: system, description: "FK -> MitigationPlan.id" }
      - { name: period_index, type: integer, source: system, description: "1..5, assigned at schedule generation" }
      - { name: due_date, type: datetime, source: system, description: "permit.issue_date + 365 * period_index days" }
      - { name: coverage_start, type: datetime, source: input, description: "Coverage interval start supplied at submit" }
      - { name: coverage_end, type: datetime, source: input, description: "Coverage interval end supplied at submit; must be > coverage_start" }
      - { name: findings_text, type: string, source: input, description: "Monitoring findings supplied at submit" }
      - { name: submitted_date, type: datetime, source: system, description: "Logical clock at most recent submit; null until first submit" }
      - { name: outcome, type: enum, source: system, description: "ACCEPTED | DEFICIENT; null until reviewed" }
      - { name: deficiency_notes, type: string, source: system, description: "Copied from review payload when outcome is DEFICIENT; null otherwise" }
      - { name: status, type: enum, source: system, description: "DUE | OVERDUE | SUBMITTED | ACCEPTED | DEFICIENT" }

  - name: EnforcementCase
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> WatersSite.id" }
      - { name: responsible_applicant_id, type: string, source: input, description: "FK -> Applicant.id; the responsible party" }
      - { name: unauthorized_fill_acres, type: number, source: input, description: "Acres of unauthorized fill; >= 0 (0 only for system-created MONITORING_BREACH referrals)" }
      - { name: description, type: string, source: input, description: "Violation description" }
      - { name: case_source, type: enum, source: system, description: "MANUAL | MONITORING_BREACH" }
      - { name: opened_by_officer_id, type: string, source: system, description: "X-User-ID at creation; SYSTEM for MONITORING_BREACH referrals" }
      - { name: opened_date, type: datetime, source: system, description: "Logical clock at creation" }
      - { name: confirmed_date, type: datetime, source: system, description: "Logical clock at confirm-violation; null until confirmed; penalty accrual starts here" }
      - { name: penalty_accrued_dollars, type: number, source: computed, description: "Daily accrual per enforcement_penalty_accrual, evaluated against the current logical clock" }
      - { name: penalty_final_dollars, type: number, source: system, description: "Penalty fixed at case closure (good-faith offset applied on RESTORATION track); null until CLOSED" }
      - { name: resolution_track, type: enum, source: system, description: "Independent resolution dimension: NONE | RESTORATION | AFTER_THE_FACT_PERMIT" }
      - { name: atf_application_id, type: string, source: input, description: "FK -> PermitApplication.id; supplied at set-resolution when track is AFTER_THE_FACT_PERMIT" }
      - { name: restoration_deadline, type: datetime, source: system, description: "confirmed-time clock + 90 days on RESTORATION track; +60 days from extension on grant-extension; null on ATF track" }
      - { name: extension_used, type: boolean, source: system, description: "false until grant-extension; one extension maximum" }
      - { name: case_status, type: enum, source: system, description: "OPENED | VIOLATION_CONFIRMED | RESOLUTION_PENDING | DEFAULTED | CLOSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: JurisdictionalDetermination
    initial_state: DRAFT
    terminal_states: [REVERSED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /wetland-permits/jurisdictional-determinations/{id}/issue"
        actor: DistrictEngineer
        preconditions:
          - "No other JurisdictionalDetermination for the same site_id has status ISSUED with expiration_date >= current clock (ERR_ACTIVE_JD_EXISTS)"
        side_effects:
          - "issued_date := current logical clock"
          - "expiration_date := issued_date + 1825 days"
      - from: ISSUED
        to: REVERSED
        trigger: "system (an Appeal for this JD is decided SUSTAINED)"
        actor: system
        preconditions: []
        side_effects:
          - "Every PermitApplication with jd_id = this JD and status in {SUBMITTED, SCREENING, RETURNED_TO_APPLICANT, ALTERNATIVES_REVIEW, PUBLIC_NOTICE_OPEN, DECISION_PENDING} transitions to SUSPENDED_PENDING_JD"
          - "For each such application, every CreditTransaction of the application's MitigationPlan(s) with status RESERVED transitions to RELEASED (bank inventory restored)"
    note: "Expiry is lazy: an ISSUED JD whose expiration_date < current clock is treated as expired at validation time (ERR_JD_EXPIRED at submit; it no longer blocks a new JD issue). There is no EXPIRED status value."

  - entity: Appeal
    initial_state: FILED
    terminal_states: [SUSTAINED, DENIED]
    transitions:
      - from: FILED
        to: SUSTAINED
        trigger: "POST /wetland-permits/appeals/{id}/decide with outcome SUSTAINED"
        actor: DistrictEngineer
        preconditions: []
        side_effects:
          - "decided_date := current logical clock; decision_rationale copied from payload"
          - "The referenced JurisdictionalDetermination transitions ISSUED -> REVERSED (firing its full cascade)"
      - from: FILED
        to: DENIED
        trigger: "POST /wetland-permits/appeals/{id}/decide with outcome DENIED"
        actor: DistrictEngineer
        preconditions: []
        side_effects:
          - "decided_date := current logical clock; decision_rationale copied from payload"

  - entity: PermitApplication
    initial_state: DRAFT
    terminal_states: [ISSUED, DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /wetland-permits/applications/{id}/submit"
        actor: Applicant
        preconditions:
          - "jd.status == ISSUED (ERR_JD_INVALID_STATE)"
          - "jd.determination == JURISDICTIONAL (ERR_JD_NOT_JURISDICTIONAL)"
          - "current clock <= jd.expiration_date (ERR_JD_EXPIRED)"
          - "If pathway GENERAL or ATF_GENERAL: general_permit_code in {NWP-29, NWP-39}, total_impact_acres <= 0.50, and every impacts[].resource_type in {EMERGENT_MARSH, STREAM} (ERR_GENERAL_PERMIT_INELIGIBLE)"
          - "If after-the-fact: linked EnforcementCase exists with case_status in {VIOLATION_CONFIRMED, RESOLUTION_PENDING} (ERR_CASE_INVALID_STATE)"
        side_effects:
          - "submitted_date := current logical clock"
      - from: RETURNED_TO_APPLICANT
        to: SUBMITTED
        trigger: "POST /wetland-permits/applications/{id}/submit"
        actor: Applicant
        preconditions: ["Same as DRAFT -> SUBMITTED"]
        side_effects: ["submitted_date := current logical clock"]
      - from: SUSPENDED_PENDING_JD
        to: SUBMITTED
        trigger: "POST /wetland-permits/applications/{id}/submit with new_jd_id"
        actor: Applicant
        preconditions:
          - "new_jd_id is present and references a JD for the same site_id with status ISSUED, determination JURISDICTIONAL, and expiration_date >= current clock (ERR_JD_NOT_FOUND / ERR_JD_INVALID_STATE / ERR_JD_NOT_JURISDICTIONAL / ERR_JD_EXPIRED)"
        side_effects:
          - "jd_id := new_jd_id"
          - "submitted_date := current logical clock"
      - from: SUBMITTED
        to: SCREENING
        trigger: "POST /wetland-permits/applications/{id}/screening with action BEGIN"
        actor: Reviewer
        preconditions: []
        side_effects:
          - "screening_reviewer_id := X-User-ID of the invoking Reviewer"
      - from: SCREENING
        to: RETURNED_TO_APPLICANT
        trigger: "POST /wetland-permits/applications/{id}/screening with action RETURN"
        actor: Reviewer
        preconditions: []
        side_effects: []
      - from: SCREENING
        to: ALTERNATIVES_REVIEW
        trigger: "POST /wetland-permits/applications/{id}/screening with action APPROVE (pathway INDIVIDUAL or ATF_INDIVIDUAL)"
        actor: Reviewer
        preconditions: []
        side_effects: []
      - from: SCREENING
        to: DECISION_PENDING
        trigger: "POST /wetland-permits/applications/{id}/screening with action APPROVE (pathway GENERAL or ATF_GENERAL)"
        actor: Reviewer
        preconditions: []
        side_effects:
          - "General-permit streamlined path: skips alternatives review, public notice, and public interest review entirely"
      - from: ALTERNATIVES_REVIEW
        to: PUBLIC_NOTICE_OPEN
        trigger: "POST /wetland-permits/applications/{id}/publish-notice"
        actor: Reviewer
        preconditions:
          - "The application's AlternativesAnalysis has status ACCEPTED (ERR_AA_NOT_ACCEPTED)"
          - "notice_status == NONE (ERR_NOTICE_ALREADY_PUBLISHED)"
        side_effects:
          - "notice_status := PUBLISHED"
          - "notice_published_date := current logical clock"
          - "comment_period_days := payload value or 30 (must be in 15..60, else ERR_INVALID_REQUEST)"
      - from: PUBLIC_NOTICE_OPEN
        to: DECISION_PENDING
        trigger: "POST /wetland-permits/applications/{id}/advance-to-decision"
        actor: Reviewer
        preconditions:
          - "notice_status == COMMENT_PERIOD_CLOSED (ERR_NOTICE_PERIOD_STILL_OPEN)"
          - "No AgencyComment of this application has comment_type SUBSTANTIVE_OBJECTION and status FILED (ERR_UNRESOLVED_AGENCY_OBJECTIONS)"
        side_effects:
          - "pir_score and pir_outcome computed per public_interest_review_score and stored"
      - from: DECISION_PENDING
        to: ISSUED
        trigger: "POST /wetland-permits/applications/{id}/render-decision with outcome ISSUE"
        actor: DistrictEngineer
        preconditions:
          - "X-User-ID != screening_reviewer_id (ERR_SEGREGATION_OF_DUTIES)"
          - "If pathway INDIVIDUAL or ATF_INDIVIDUAL: pir_outcome == FAVORABLE (ERR_PUBLIC_INTEREST_UNFAVORABLE)"
          - "If after-the-fact: linked EnforcementCase has resolution_track == AFTER_THE_FACT_PERMIT and atf_application_id == this application (ERR_CASE_INVALID_STATE)"
          - "If compensatory_mitigation_required: a MitigationPlan of this application has status CREDITS_SECURED (ERR_MITIGATION_NOT_SECURED)"
        side_effects:
          - "A Permit is created: application_id, permit_number WP-#### sequential, issue_date := clock, expiration_date := issue_date + 1825 days, special_conditions per pathway set, status ISSUED"
          - "The application's CREDITS_SECURED MitigationPlan transitions to ACTIVE"
          - "If the application has a CREDITS_SECURED plan: 5 MonitoringReports are generated (period_index 1..5, due_date = issue_date + 365*period_index days, status DUE)"
          - "If after-the-fact: the linked EnforcementCase transitions RESOLUTION_PENDING -> CLOSED and penalty_final_dollars := penalty_accrued_dollars at this clock (no good-faith offset on the ATF track)"
      - from: DECISION_PENDING
        to: DENIED
        trigger: "POST /wetland-permits/applications/{id}/render-decision with outcome DENY"
        actor: DistrictEngineer
        preconditions:
          - "X-User-ID != screening_reviewer_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Credit compensation cascade: every CreditTransaction of this application's MitigationPlan(s) with status RESERVED -> RELEASED; every PURCHASED -> REFUNDED (bank inventory and revenue restored)"
          - "Every non-terminal MitigationPlan of this application -> CANCELLED"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /wetland-permits/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects: ["Same credit compensation cascade and plan CANCELLED as DENIED"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /wetland-permits/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects: ["Same credit compensation cascade and plan CANCELLED as DENIED"]
      - from: SCREENING
        to: WITHDRAWN
        trigger: "POST /wetland-permits/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects: ["Same credit compensation cascade and plan CANCELLED as DENIED"]
      - from: RETURNED_TO_APPLICANT
        to: WITHDRAWN
        trigger: "POST /wetland-permits/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects: ["Same credit compensation cascade and plan CANCELLED as DENIED"]
      - from: ALTERNATIVES_REVIEW
        to: WITHDRAWN
        trigger: "POST /wetland-permits/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects: ["Same credit compensation cascade and plan CANCELLED as DENIED"]
      - from: PUBLIC_NOTICE_OPEN
        to: WITHDRAWN
        trigger: "POST /wetland-permits/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects: ["Same credit compensation cascade and plan CANCELLED as DENIED"]
      - from: DECISION_PENDING
        to: WITHDRAWN
        trigger: "POST /wetland-permits/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects: ["Same credit compensation cascade and plan CANCELLED as DENIED"]
      - from: SUSPENDED_PENDING_JD
        to: WITHDRAWN
        trigger: "POST /wetland-permits/applications/{id}/withdraw"
        actor: Applicant
        preconditions: []
        side_effects: ["Plan CANCELLED if non-terminal (no RESERVED transactions remain; they were released at suspension)"]
      - from: SUBMITTED
        to: SUSPENDED_PENDING_JD
        trigger: "system (the application's JD transitions to REVERSED)"
        actor: system
        preconditions: []
        side_effects: ["CreditTransactions of the application's plans in RESERVED -> RELEASED"]
      - from: SCREENING
        to: SUSPENDED_PENDING_JD
        trigger: "system (JD REVERSED)"
        actor: system
        preconditions: []
        side_effects: ["Same RESERVED -> RELEASED cascade"]
      - from: RETURNED_TO_APPLICANT
        to: SUSPENDED_PENDING_JD
        trigger: "system (JD REVERSED)"
        actor: system
        preconditions: []
        side_effects: ["Same RESERVED -> RELEASED cascade"]
      - from: ALTERNATIVES_REVIEW
        to: SUSPENDED_PENDING_JD
        trigger: "system (JD REVERSED)"
        actor: system
        preconditions: []
        side_effects: ["Same RESERVED -> RELEASED cascade"]
      - from: PUBLIC_NOTICE_OPEN
        to: SUSPENDED_PENDING_JD
        trigger: "system (JD REVERSED)"
        actor: system
        preconditions: []
        side_effects: ["Same RESERVED -> RELEASED cascade"]
      - from: DECISION_PENDING
        to: SUSPENDED_PENDING_JD
        trigger: "system (JD REVERSED)"
        actor: system
        preconditions: []
        side_effects: ["Same RESERVED -> RELEASED cascade"]

  - entity: PermitApplication.notice_status
    initial_state: NONE
    terminal_states: [COMMENT_PERIOD_CLOSED]
    transitions:
      - from: NONE
        to: PUBLISHED
        trigger: "POST /wetland-permits/applications/{id}/publish-notice"
        actor: Reviewer
        preconditions: ["application status ALTERNATIVES_REVIEW; AA ACCEPTED; notice_status NONE"]
        side_effects: ["notice_published_date and comment_period_days set"]
      - from: PUBLISHED
        to: COMMENT_PERIOD_CLOSED
        trigger: "system on POST /_clock/set_current_utc when the new clock is strictly greater than notice_published_date + comment_period_days days"
        actor: system
        preconditions: []
        side_effects: []
    note: "Independent state dimension on PermitApplication; evolves orthogonally to the main status while the application is PUBLIC_NOTICE_OPEN. Boundary: a clock exactly equal to published+period leaves the window PUBLISHED (strictly-greater comparison)."

  - entity: AlternativesAnalysis
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /wetland-permits/alternatives-analyses/{id}/review with verdict ACCEPT"
        actor: Reviewer
        preconditions:
          - "avoidance_demonstrated == true AND minimization_steps has >= 2 entries AND ledpa_conclusion == PROPOSED_IS_LEDPA (ERR_LEDPA_NOT_DEMONSTRATED)"
        side_effects: []
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /wetland-permits/alternatives-analyses/{id}/review with verdict REQUEST_REVISION"
        actor: Reviewer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /wetland-permits/alternatives-analyses/{id}/review with verdict REJECT"
        actor: Reviewer
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "PATCH /wetland-permits/alternatives-analyses/{id}"
        actor: Applicant
        preconditions: []
        side_effects: ["revision_count += 1"]

  - entity: AgencyComment
    initial_state: FILED
    terminal_states: [RESOLVED]
    transitions:
      - from: FILED
        to: RESOLVED
        trigger: "POST /wetland-permits/agency-comments/{id}/resolve"
        actor: Reviewer
        preconditions: []
        side_effects: ["resolution_text copied from payload"]

  - entity: MitigationPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, DEFAULTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /wetland-permits/mitigation-plans/{id}/submit"
        actor: Applicant
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /wetland-permits/mitigation-plans/{id}/review with verdict APPROVE"
        actor: Reviewer
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /wetland-permits/mitigation-plans/{id}/review with verdict REQUEST_REVISION"
        actor: Reviewer
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "PATCH /wetland-permits/mitigation-plans/{id}"
        actor: Applicant
        preconditions: []
        side_effects: ["Computed fields recomputed from the new inputs"]
      - from: APPROVED
        to: CREDITS_SECURED
        trigger: "POST /wetland-permits/mitigation-plans/{id}/secure-credits (BANK_CREDITS, PERMITTEE_RESPONSIBLE, COMBINATION) or POST /wetland-permits/mitigation-plans/{id}/pay-in-lieu-fee (IN_LIEU_FEE)"
        actor: Applicant
        preconditions:
          - "BANK_CREDITS: for every resource type, sum of PURCHASED transaction credits >= final_credits_required_by_type[type] (ERR_CREDITS_NOT_SECURED); mechanism IN_LIEU_FEE is rejected at secure-credits (ERR_PLAN_INVALID_STATE)"
          - "PERMITTEE_RESPONSIBLE: financial_assurance_dollars >= recomputed assurance_required_dollars AND long_term_stewardship_secured == true (ERR_INSUFFICIENT_FINANCIAL_ASSURANCE)"
          - "COMBINATION: per type, PURCHASED credits >= round_half_up(0.5 * final_required[type], 2) AND financial_assurance_dollars >= round_half_up(0.5 * assurance_required_dollars, 2) AND long_term_stewardship_secured == true (ERR_CREDITS_NOT_SECURED / ERR_INSUFFICIENT_FINANCIAL_ASSURANCE)"
        side_effects:
          - "final_credits_required_by_type computed per the final variant of mitigation_credit_requirement and stored"
          - "secured_date := current logical clock"
      - from: CREDITS_SECURED
        to: ACTIVE
        trigger: "system (the application transitions to ISSUED)"
        actor: system
        preconditions: []
        side_effects: ["5 MonitoringReports generated per monitoring_schedule_generation"]
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (the plan's 5th MonitoringReport transitions to ACCEPTED)"
        actor: system
        preconditions: ["All 5 reports of this plan have status ACCEPTED"]
        side_effects: []
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system (the linked Permit transitions to EXPIRED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "system (application DENIED or WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system (application DENIED or WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REVISION_REQUESTED
        to: CANCELLED
        trigger: "system (application DENIED or WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: CANCELLED
        trigger: "system (application DENIED or WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CREDITS_SECURED
        to: CANCELLED
        trigger: "system (application DENIED or WITHDRAWN)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: MitigationBank
    initial_state: PENDING_APPROVAL
    terminal_states: []
    transitions:
      - from: PENDING_APPROVAL
        to: OPERATIONAL
        trigger: "POST /wetland-permits/mitigation-banks/{id}/approve"
        actor: DistrictEngineer
        preconditions: []
        side_effects: []
      - from: OPERATIONAL
        to: SUSPENDED
        trigger: "POST /wetland-permits/mitigation-banks/{id}/suspend"
        actor: DistrictEngineer
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: OPERATIONAL
        trigger: "POST /wetland-permits/mitigation-banks/{id}/approve"
        actor: DistrictEngineer
        preconditions: []
        side_effects: []

  - entity: CreditTransaction
    initial_state: RESERVED
    terminal_states: [RELEASED, REFUNDED]
    transitions:
      - from: RESERVED
        to: PURCHASED
        trigger: "POST /wetland-permits/credit-transactions/{id}/purchase"
        actor: Applicant
        preconditions: []
        side_effects:
          - "price_per_credit_dollars and total_price_dollars stamped per bank_credit_pricing (tier evaluated on the pre-transaction purchased fraction)"
          - "Bank credits_purchased_by_type / available_credits_by_type / revenue_dollars recomputed"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /wetland-permits/credit-transactions/{id}/release, or system (application withdrawn/denied/suspended)"
        actor: Applicant
        preconditions: []
        side_effects: ["Bank credits_reserved_by_type / available_credits_by_type recomputed"]
      - from: PURCHASED
        to: REFUNDED
        trigger: "system (application withdrawn or denied)"
        actor: system
        preconditions: []
        side_effects: ["Bank inventory and revenue_dollars recomputed (refund restores both)"]

  - entity: Permit
    initial_state: ISSUED
    terminal_states: [CLOSED, EXPIRED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /wetland-permits/permits/{id}/commence-work"
        actor: Applicant
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (a MonitoringReport of this permit is OVERDUE for more than 60 days; evaluated on clock advance)"
        actor: system
        preconditions: []
        side_effects:
          - "An EnforcementCase is auto-created: case_source MONITORING_BREACH, site_id and responsible_applicant_id from the permit's application, unauthorized_fill_acres 0, opened_by_officer_id SYSTEM, case_status OPENED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /wetland-permits/permits/{id}/reinstate"
        actor: DistrictEngineer
        preconditions:
          - "No MonitoringReport of this permit has status OVERDUE (ERR_REPORTS_OVERDUE_EXIST)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /wetland-permits/permits/{id}/close"
        actor: DistrictEngineer
        preconditions:
          - "All 5 MonitoringReports of this permit have status ACCEPTED and the MitigationPlan has status COMPLETED (ERR_MONITORING_INCOMPLETE)"
        side_effects: []
      - from: ISSUED
        to: EXPIRED
        trigger: "system on POST /_clock/set_current_utc when the new clock is strictly greater than expiration_date"
        actor: system
        preconditions: []
        side_effects: ["The linked MitigationPlan in ACTIVE transitions to DEFAULTED"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system on POST /_clock/set_current_utc when the new clock is strictly greater than expiration_date"
        actor: system
        preconditions: []
        side_effects: ["The linked MitigationPlan in ACTIVE transitions to DEFAULTED"]

  - entity: MonitoringReport
    initial_state: DUE
    terminal_states: [ACCEPTED]
    transitions:
      - from: DUE
        to: SUBMITTED
        trigger: "POST /wetland-permits/monitoring-reports/{id}/submit"
        actor: Applicant
        preconditions:
          - "coverage_start < coverage_end (ERR_INVALID_REQUEST)"
          - "period_index 1: coverage_start == permit.issue_date; period_index i>1: coverage_start == the coverage_end most recently submitted (SUBMITTED or ACCEPTED) for period_index i-1 (ERR_COVERAGE_INTERVAL_CONFLICT)"
        side_effects: ["submitted_date := current logical clock"]
      - from: OVERDUE
        to: SUBMITTED
        trigger: "POST /wetland-permits/monitoring-reports/{id}/submit"
        actor: Applicant
        preconditions: ["Same coverage rules as DUE -> SUBMITTED"]
        side_effects: ["submitted_date := current logical clock"]
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /wetland-permits/monitoring-reports/{id}/submit"
        actor: Applicant
        preconditions: ["Same coverage rules as DUE -> SUBMITTED"]
        side_effects: ["submitted_date := current logical clock"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /wetland-permits/monitoring-reports/{id}/review with outcome ACCEPTED"
        actor: Reviewer
        preconditions: []
        side_effects:
          - "outcome := ACCEPTED"
          - "If all 5 reports of the plan are now ACCEPTED: the MitigationPlan transitions ACTIVE -> COMPLETED"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /wetland-permits/monitoring-reports/{id}/review with outcome DEFICIENT"
        actor: Reviewer
        preconditions: ["deficiency_notes must be present in the payload (ERR_INVALID_REQUEST)"]
        side_effects: ["outcome := DEFICIENT; deficiency_notes copied from payload"]
      - from: DUE
        to: OVERDUE
        trigger: "system on POST /_clock/set_current_utc when the new clock is strictly greater than due_date"
        actor: system
        preconditions: []
        side_effects: ["If the new clock is also strictly greater than due_date + 60 days and the permit is ACTIVE: the permit transitions to SUSPENDED and a MONITORING_BREACH EnforcementCase is auto-created (see Permit machine)"]

  - entity: EnforcementCase
    initial_state: OPENED
    terminal_states: [CLOSED]
    transitions:
      - from: OPENED
        to: VIOLATION_CONFIRMED
        trigger: "POST /wetland-permits/enforcement-cases/{id}/confirm-violation"
        actor: EnforcementOfficer
        preconditions:
          - "X-User-ID != opened_by_officer_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["confirmed_date := current logical clock; penalty accrual begins"]
      - from: VIOLATION_CONFIRMED
        to: RESOLUTION_PENDING
        trigger: "POST /wetland-permits/enforcement-cases/{id}/set-resolution"
        actor: EnforcementOfficer
        preconditions:
          - "track RESTORATION: no further requirement"
          - "track AFTER_THE_FACT_PERMIT: atf_application_id present, references an existing application whose enforcement_case_id == this case (ERR_APPLICATION_NOT_FOUND / ERR_CASE_INVALID_STATE)"
        side_effects:
          - "resolution_track := payload track"
          - "track RESTORATION: restoration_deadline := current clock + 90 days"
          - "track AFTER_THE_FACT_PERMIT: atf_application_id stored"
      - from: RESOLUTION_PENDING
        to: CLOSED
        trigger: "POST /wetland-permits/enforcement-cases/{id}/verify-restoration (RESTORATION track only)"
        actor: EnforcementOfficer
        preconditions:
          - "resolution_track == RESTORATION (ERR_CASE_INVALID_STATE)"
        side_effects:
          - "penalty_final_dollars := round_half_up(penalty_accrued_dollars * 0.5, 2) — good-faith offset for timely restoration"
      - from: RESOLUTION_PENDING
        to: CLOSED
        trigger: "system (the linked after-the-fact application transitions to ISSUED)"
        actor: system
        preconditions: ["resolution_track == AFTER_THE_FACT_PERMIT"]
        side_effects: ["penalty_final_dollars := penalty_accrued_dollars (no offset on the ATF track)"]
      - from: RESOLUTION_PENDING
        to: DEFAULTED
        trigger: "system on POST /_clock/set_current_utc when resolution_track == RESTORATION and the new clock is strictly greater than restoration_deadline"
        actor: system
        preconditions: []
        side_effects: []
      - from: DEFAULTED
        to: RESOLUTION_PENDING
        trigger: "POST /wetland-permits/enforcement-cases/{id}/grant-extension"
        actor: DistrictEngineer
        preconditions:
          - "extension_used == false (ERR_EXTENSION_ALREADY_USED)"
        side_effects:
          - "restoration_deadline := current clock + 60 days"
          - "extension_used := true"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: application-patch-stale-version
    parent_entity: PermitApplication
    write_endpoint: "PATCH /wetland-permits/applications/{id}"
    occ_field: "expected_application_version"
    description: |
      A PATCH to a PermitApplication (allowed while DRAFT or RETURNED_TO_APPLICANT,
      neither of which changes status on PATCH) whose expected_application_version
      no longer equals the application's current version is rejected. This covers
      the case where a prior PATCH by the same applicant has already advanced the
      version since the client last observed the application, so the client's
      edits are based on a stale record.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: plan-patch-stale-version
    parent_entity: MitigationPlan
    write_endpoint: "PATCH /wetland-permits/mitigation-plans/{id}"
    occ_field: "expected_plan_version"
    description: |
      A PATCH to a MitigationPlan whose expected_plan_version no longer equals
      the plan's current version is rejected. A PATCH while DRAFT leaves the
      plan in DRAFT, so a second PATCH carrying the earlier observed version is
      not caught by any state precondition; only the version check rejects it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: mitigation_credit_requirement
    trigger: "MitigationPlan creation (provisional variant) and secure-credits / pay-in-lieu-fee (final variant)"
    algorithm: tiered_pricing
    formula: |
      For each impacts[] line of the linked application, keyed by resource_type:
        base_ratio: EMERGENT_MARSH 2.0 | FORESTED_WETLAND 3.0 | OPEN_WATER 1.5 | STREAM 1.0
        atf_multiplier: 1.5 if application.is_after_the_fact else 1.0
        provisional credits[type] = round_half_up(impact_acres * base_ratio * 1.0 * 1.0 * atf_multiplier, 2)
        final      credits[type] = round_half_up(impact_acres * base_ratio * location_multiplier * lag_multiplier * atf_multiplier, 2)
      where, for the final variant evaluated at secure-credits:
        lag_days = (current clock) - (application.submitted_date), in whole days
        lag_multiplier: lag_days <= 365 -> 1.0 ; 366..730 -> 1.10 ; > 730 -> 1.20
        location_multiplier: 1.0 iff every PURCHASED CreditTransaction of this plan is from a bank
          whose service_area_watersheds contains the site watershed_code; otherwise 1.25.
          (For PERMITTEE_RESPONSIBLE: location_multiplier is 1.0; for IN_LIEU_FEE the fee is
          fixed at creation from the provisional credits and never recomputed.)
      required_credits_by_type = provisional map; final_credits_required_by_type = final map.
      Multiplier application order is pinned: base_ratio, then location, then lag, then ATF.
    input_set: "impacts[] of the linked application; site watershed_code; PURCHASED CreditTransactions of this plan; application.submitted_date"
    constants:
      RATIO_EMERGENT_MARSH: 2.0
      RATIO_FORESTED_WETLAND: 3.0
      RATIO_OPEN_WATER: 1.5
      RATIO_STREAM: 1.0
      LOCATION_MULT_IN_BASIN: 1.0
      LOCATION_MULT_OUT_OF_BASIN: 1.25
      LAG_TIER1_MAX_DAYS: 365
      LAG_TIER2_MAX_DAYS: 730
      LAG_MULT_TIER1: 1.0
      LAG_MULT_TIER2: 1.10
      LAG_MULT_TIER3: 1.20
      ATF_MULTIPLIER: 1.5
    precision: "credits per resource type rounded half-up to 2 decimal places per line, then stored per type"
    variants:
      - name: provisional
        when: "at plan creation"
        difference: "location_multiplier and lag_multiplier are both fixed at 1.0 (no bank chosen yet, no lag elapsed)"
      - name: final
        when: "at secure-credits"
        difference: "location and lag multipliers evaluated from the actual banks used and the actual elapsed days; identical plan data yields a larger requirement whenever lag_days > 365 or an out-of-basin bank was used"

  - name: in_lieu_fee_amount
    trigger: "MitigationPlan creation when mechanism is IN_LIEU_FEE or COMBINATION"
    algorithm: aggregation
    formula: |
      ilf_fee_due_dollars = SUM over resource types of
        round_half_up(required_credits_by_type[type] * ILF_RATE_PER_CREDIT[type], 2)
      Rounding order is pinned: each per-type line is rounded to cents FIRST, then the
      rounded lines are summed. (Summing unrounded products and rounding once at the end
      yields different cents and is forbidden.)
    input_set: "required_credits_by_type (provisional) at plan creation"
    constants:
      ILF_RATE_EMERGENT_MARSH: 40000
      ILF_RATE_FORESTED_WETLAND: 55000
      ILF_RATE_OPEN_WATER: 30000
      ILF_RATE_STREAM: 25000
    precision: "2 decimal places per line, round_half_up; total is the exact sum of rounded lines"

  - name: public_interest_review_score
    trigger: "POST /wetland-permits/applications/{id}/advance-to-decision (individual pathways only)"
    algorithm: weighted_scoring
    formula: |
      steps = count of minimization_steps on the application's ACCEPTED AlternativesAnalysis
      secured_bonus = 20.0 if the application's MitigationPlan status is in {CREDITS_SECURED, ACTIVE, COMPLETED} else 0.0
      unresolved_advisory = count of AgencyComments of this application with comment_type ADVISORY and status FILED
      concurrence_count = count of AgencyComments of this application with comment_type CONCURRENCE (any status)
      environmental_standard = (-10.0 * total_impact_acres) + (5.0 * steps) + secured_bonus - (15.0 * unresolved_advisory) + (5.0 * concurrence_count)
      environmental_atf      = (-15.0 * total_impact_acres) + (5.0 * steps) + secured_bonus - (15.0 * unresolved_advisory) + (5.0 * concurrence_count) - 10.0
      environmental = environmental_atf if is_after_the_fact else environmental_standard
      economic = clamp((estimated_cost_dollars - 250000.0) / 10000.0, -100.0, 100.0)
      navigation = -10.0 if any impacts[] line has resource_type in {OPEN_WATER, STREAM} else 15.0
      pir_score = round_half_up(0.40 * environmental + 0.35 * economic + 0.25 * navigation, 2)
      pir_outcome = FAVORABLE if pir_score >= 0.0 else UNFAVORABLE
    input_set: "the application's impacts, estimated_cost_dollars, is_after_the_fact; its ACCEPTED AlternativesAnalysis; its AgencyComments; its MitigationPlan status"
    constants:
      W_ENVIRONMENTAL: 0.40
      W_ECONOMIC: 0.35
      W_NAVIGATION: 0.25
      ECONOMIC_NEUTRAL_DOLLARS: 250000.0
      ECONOMIC_SCALE_DOLLARS: 10000.0
    precision: "pir_score rounded half-up to 2 decimal places; components unrounded until the final weighted sum"
    variants:
      - name: standard
        when: "pathway INDIVIDUAL"
        difference: "environmental harm term is -10.0 per impacted acre"
      - name: after_the_fact_deterrence
        when: "pathway ATF_INDIVIDUAL"
        difference: "environmental harm term is -15.0 per impacted acre plus a flat -10.0 deterrence adjustment; identical application data yields a strictly lower pir_score"

  - name: enforcement_penalty_accrual
    trigger: "read of penalty_accrued_dollars (evaluated against the current logical clock); fixed into penalty_final_dollars at case closure"
    algorithm: chronological
    formula: |
      days = whole days elapsed from confirmed_date to the current clock (floor of the
        difference in seconds / 86400); 0 while unconfirmed
      penalty_accrued_dollars = min(unauthorized_fill_acres * PENALTY_RATE_PER_ACRE_DAY * days, PENALTY_CAP_DOLLARS)
      At closure:
        RESTORATION track (verify-restoration on or before restoration_deadline, including an
          extended deadline): penalty_final_dollars = round_half_up(penalty_accrued_dollars * 0.5, 2)
        AFTER_THE_FACT_PERMIT track (closed by permit issuance): penalty_final_dollars = penalty_accrued_dollars
    input_set: "the case's unauthorized_fill_acres, confirmed_date, resolution_track; the current logical clock"
    constants:
      PENALTY_RATE_PER_ACRE_DAY: 250.0
      PENALTY_CAP_DOLLARS: 500000.0
      RESTORATION_GOOD_FAITH_OFFSET: 0.5
      RESTORATION_DEADLINE_DAYS: 90
      EXTENSION_DAYS: 60
    precision: "2 decimal places, round_half_up at final fixation; accrual itself is exact"
    variants:
      - name: restoration_track
        when: "resolution_track == RESTORATION"
        difference: "good-faith offset halves the accrued penalty at closure when restoration is verified on or before the deadline"
      - name: atf_track
        when: "resolution_track == AFTER_THE_FACT_PERMIT"
        difference: "no offset; penalty keeps accruing until the ATF permit is issued and is fixed in full at closure"

  - name: bank_credit_pricing
    trigger: "CreditTransaction purchase"
    algorithm: tiered_pricing
    formula: |
      Let pre_purchased = bank.credits_purchased_by_type[resource_type] BEFORE this purchase
        (only PURCHASED transactions count; RESERVED hold inventory but do not move the price tier).
      sold_fraction = pre_purchased / credit_capacity[resource_type] (0 when capacity is 0)
      tier_multiplier: sold_fraction < 0.5 -> 1.0 ; 0.5 <= sold_fraction < 0.8 -> 1.15 ; sold_fraction >= 0.8 -> 1.30
      price_per_credit_dollars = round_half_up(base_price_per_credit[resource_type] * tier_multiplier, 2)
      total_price_dollars = round_half_up(credits * price_per_credit_dollars, 2)
      Evaluation order is pinned: the tier is computed from the pre-transaction fraction and
      this purchase's own credits NEVER move its own tier. (Using the post-transaction
      fraction prices the same purchase differently and is forbidden.)
    input_set: "the bank's credit_capacity, base_price_per_credit, and PURCHASED CreditTransactions; this transaction's resource_type and credits"
    constants:
      TIER1_MAX_FRACTION: 0.5
      TIER2_MAX_FRACTION: 0.8
      TIER1_MULT: 1.0
      TIER2_MULT: 1.15
      TIER3_MULT: 1.30
    precision: "2 decimal places, round_half_up; unit price rounded first, then multiplied"

  - name: bank_credit_inventory
    trigger: "CreditTransaction create, purchase, release, and system refund/release cascades"
    algorithm: aggregation
    formula: |
      For each resource type:
        credits_reserved_by_type[t]  = sum of credits over this bank's transactions with status RESERVED and resource_type t
        credits_purchased_by_type[t] = sum of credits over this bank's transactions with status PURCHASED and resource_type t
        available_credits_by_type[t] = credit_capacity[t] - credits_reserved_by_type[t] - credits_purchased_by_type[t]
      Conserved quantity (compensating invariant): for every (bank, type),
        credit_capacity[t] == available_credits_by_type[t] + credits_reserved_by_type[t] + credits_purchased_by_type[t]
        at all times; a create-then-release pair and a purchase-then-refund pair each leave
        available_credits_by_type[t] unchanged.
      revenue_dollars = sum of total_price_dollars over PURCHASED transactions
                        - sum of total_price_dollars over REFUNDED transactions
    input_set: "all CreditTransactions of the bank"
    precision: "credits at 2 decimal places; revenue in dollars at 2 decimal places"

  - name: monitoring_schedule_generation
    trigger: "PermitApplication render-decision ISSUE when a CREDITS_SECURED MitigationPlan exists"
    algorithm: projection
    formula: |
      Generate exactly MONITORING_REPORT_COUNT MonitoringReports for the new permit and plan:
        period_index i in 1..5
        due_date[i] = permit.issue_date + (365 * i) days
        status = DUE
      Reports are listed sorted by period_index ascending.
    input_set: "the new Permit's issue_date"
    constants:
      MONITORING_REPORT_COUNT: 5
      MONITORING_INTERVAL_DAYS: 365
      OVERDUE_BREACH_DAYS: 60
    precision: "dates are exact day arithmetic from issue_date"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers must be present, and X-User-Role must be one of the six declared roles"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "The role must appear in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path {id} segments must reference existing entities, validated left-to-right"
    error_id: "ERR_APPLICANT_NOT_FOUND | ERR_SITE_NOT_FOUND | ERR_JD_NOT_FOUND | ERR_APPEAL_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_AA_NOT_FOUND | ERR_COMMENT_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_BANK_NOT_FOUND | ERR_CREDIT_TXN_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_CASE_NOT_FOUND (by resource type)"
    http_status: 404
    applies_to: "all single-entity GET/PATCH/action endpoints"
  - priority: 4
    category: auth
    check: "Ownership: when the role is Applicant, X-User-ID must equal the applicant that owns the target resource (application.applicant_id; site.applicant_id for appeals; the parent application's applicant_id for alternatives-analyses, mitigation-plans, credit-transactions, monitoring-reports, permits)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Applicant-scoped write endpoints: POST /appeals; POST/PATCH /applications + submit/withdraw; POST/PATCH /alternatives-analyses; POST/PATCH /mitigation-plans + submit/secure-credits/pay-in-lieu-fee; POST /credit-transactions + purchase/release; POST /permits/{id}/commence-work; POST /monitoring-reports/{id}/submit"
  - priority: 5
    category: existence
    check: "Body FK fields must reference existing entities: site_id, jd_id, new_jd_id, application_id, bank_id, plan_id, enforcement_case_id, atf_application_id"
    error_id: "ERR_SITE_NOT_FOUND | ERR_JD_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_BANK_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_CASE_NOT_FOUND (by field)"
    http_status: 404
    applies_to: "POST /sites, POST /jurisdictional-determinations, POST /appeals, POST /applications, POST /applications/{id}/submit, POST /alternatives-analyses, POST /agency-comments, POST /mitigation-plans, POST /credit-transactions, POST /enforcement-cases, POST /enforcement-cases/{id}/set-resolution"
  - priority: 6
    category: business_constraint
    check: "Request shape: required fields present, enums valid, numbers in range, impacts non-empty with resource_type in the site's resource_types_present and impact_acres > 0; ATF pathways require enforcement_case_id whose case's responsible_applicant_id equals the applicant; GENERAL/ATF_GENERAL require general_permit_code present; comment_period_days in 15..60; stewardship_entity_name required for PERMITTEE_RESPONSIBLE and COMBINATION"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 7
    category: state
    check: "The target entity must be in a state from which the invoked transition is defined; for POST /applications/{id}/submit this row also covers the referenced JD not being ISSUED, the linked plan not being APPROVED at credit-transaction creation, and a bank not being OPERATIONAL"
    error_id: "ERR_JD_INVALID_STATE | ERR_APPEAL_INVALID_STATE | ERR_APPLICATION_INVALID_STATE | ERR_AA_INVALID_STATE | ERR_PLAN_INVALID_STATE | ERR_CREDIT_TXN_INVALID_STATE | ERR_PERMIT_INVALID_STATE | ERR_REPORT_INVALID_STATE | ERR_CASE_INVALID_STATE | ERR_BANK_NOT_OPERATIONAL (by entity)"
    http_status: 409
    applies_to: "all action endpoints and PATCH endpoints"
  - priority: 8
    category: state
    check: "OCC: expected_application_version / expected_plan_version must equal the entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /wetland-permits/applications/{id}; PATCH /wetland-permits/mitigation-plans/{id}"
  - priority: 9
    category: business_temporal
    check: "Only APPROVED JDs carry appeal rights: jd_type must be APPROVED"
    error_id: ERR_JD_NOT_APPEALABLE
    http_status: 422
    applies_to: "POST /appeals"
  - priority: 10
    category: business_temporal
    check: "Appeal filing window: filed_date - jd.issued_date <= 60 days (exactly 60 days is allowed)"
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /appeals"
  - priority: 11
    category: business_temporal
    check: "At submit, the referenced JD must be unexpired: current clock <= jd.expiration_date"
    error_id: ERR_JD_EXPIRED
    http_status: 409
    applies_to: "POST /applications/{id}/submit"
  - priority: 12
    category: business_temporal
    check: "Agency comments may be filed only while the application's notice_status is PUBLISHED"
    error_id: ERR_COMMENT_PERIOD_CLOSED
    http_status: 422
    applies_to: "POST /agency-comments"
  - priority: 13
    category: business_temporal
    check: "advance-to-decision requires notice_status == COMMENT_PERIOD_CLOSED"
    error_id: ERR_NOTICE_PERIOD_STILL_OPEN
    http_status: 422
    applies_to: "POST /applications/{id}/advance-to-decision"
  - priority: 14
    category: business_safety
    check: "Segregation of duties: render-decision X-User-ID != the application's screening_reviewer_id; confirm-violation X-User-ID != the case's opened_by_officer_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /applications/{id}/render-decision; POST /enforcement-cases/{id}/confirm-violation"
  - priority: 15
    category: business_safety
    check: "General-permit eligibility at create and submit: general_permit_code in {NWP-29, NWP-39}, total_impact_acres <= 0.50 (0.50 exactly is eligible), every impact resource_type in {EMERGENT_MARSH, STREAM}"
    error_id: ERR_GENERAL_PERMIT_INELIGIBLE
    http_status: 422
    applies_to: "POST /applications (pathway GENERAL|ATF_GENERAL); POST /applications/{id}/submit"
  - priority: 16
    category: business_safety
    check: "LEDPA gate at AA accept: avoidance_demonstrated == true AND len(minimization_steps) >= 2 AND ledpa_conclusion == PROPOSED_IS_LEDPA"
    error_id: ERR_LEDPA_NOT_DEMONSTRATED
    http_status: 422
    applies_to: "POST /alternatives-analyses/{id}/review with verdict ACCEPT"
  - priority: 17
    category: business_safety
    check: "Individual pathways: render-decision ISSUE requires pir_outcome == FAVORABLE"
    error_id: ERR_PUBLIC_INTEREST_UNFAVORABLE
    http_status: 422
    applies_to: "POST /applications/{id}/render-decision with outcome ISSUE"
  - priority: 18
    category: business_referential
    check: "At submit, the referenced JD must have determination JURISDICTIONAL (its ISSUED state is checked at priority 7)"
    error_id: ERR_JD_NOT_JURISDICTIONAL
    http_status: 422
    applies_to: "POST /applications/{id}/submit"
  - priority: 19
    category: business_referential
    check: "Sequencing: avoidance and minimization before compensation — plan creation for INDIVIDUAL/ATF_INDIVIDUAL requires the application's AA status ACCEPTED; publish-notice likewise requires AA ACCEPTED. (GENERAL/ATF_GENERAL plan creation instead requires application status DECISION_PENDING, checked at priority 7.)"
    error_id: ERR_AA_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /mitigation-plans; POST /applications/{id}/publish-notice"
  - priority: 20
    category: business_referential
    check: "advance-to-decision requires zero AgencyComments of this application with comment_type SUBSTANTIVE_OBJECTION and status FILED"
    error_id: ERR_UNRESOLVED_AGENCY_OBJECTIONS
    http_status: 422
    applies_to: "POST /applications/{id}/advance-to-decision"
  - priority: 21
    category: business_referential
    check: "ATF linkage: application create requires the linked case to have case_status in {VIOLATION_CONFIRMED, RESOLUTION_PENDING}; set-resolution AFTER_THE_FACT_PERMIT requires the application's enforcement_case_id == this case; render-decision ISSUE (ATF) requires case resolution_track == AFTER_THE_FACT_PERMIT and atf_application_id == this application"
    error_id: ERR_CASE_INVALID_STATE
    http_status: 409
    applies_to: "POST /applications; POST /enforcement-cases/{id}/set-resolution; POST /applications/{id}/render-decision"
  - priority: 22
    category: business_constraint
    check: "JD issue: no other JD of the same site may have status ISSUED with expiration_date >= current clock"
    error_id: ERR_ACTIVE_JD_EXISTS
    http_status: 409
    applies_to: "POST /jurisdictional-determinations/{id}/issue"
  - priority: 23
    category: business_constraint
    check: "At most one Appeal per JD"
    error_id: ERR_APPEAL_ALREADY_FILED
    http_status: 409
    applies_to: "POST /appeals"
  - priority: 24
    category: business_constraint
    check: "At most one AlternativesAnalysis per application; at most one published notice per application; at most one MitigationPlan per application with status not in {COMPLETED, DEFAULTED, CANCELLED}"
    error_id: "ERR_AA_ALREADY_EXISTS | ERR_NOTICE_ALREADY_PUBLISHED | ERR_ACTIVE_PLAN_EXISTS"
    http_status: 409
    applies_to: "POST /alternatives-analyses; POST /applications/{id}/publish-notice; POST /mitigation-plans"
  - priority: 25
    category: business_constraint
    check: "Bank credit reservations require bank.state_code == the site state_code of the plan's application"
    error_id: ERR_OUT_OF_SERVICE_AREA
    http_status: 422
    applies_to: "POST /credit-transactions"
  - priority: 26
    category: business_constraint
    check: "Monitoring coverage intervals: period 1 coverage_start == permit.issue_date; period i>1 coverage_start == coverage_end of the report with period_index i-1 in status SUBMITTED or ACCEPTED; coverage_start < coverage_end. No gaps and no overlaps between sibling reports."
    error_id: ERR_COVERAGE_INTERVAL_CONFLICT
    http_status: 409
    applies_to: "POST /monitoring-reports/{id}/submit"
  - priority: 27
    category: business_fiscal
    check: "Reservation requires bank status OPERATIONAL (priority 7) and available_credits_by_type[resource_type] >= requested credits (exact equality is allowed)"
    error_id: ERR_INSUFFICIENT_CREDIT_INVENTORY
    http_status: 422
    applies_to: "POST /credit-transactions"
  - priority: 28
    category: business_fiscal
    check: "secure-credits: BANK_CREDITS requires per-type PURCHASED credits >= final_credits_required_by_type[type]; PERMITTEE_RESPONSIBLE and COMBINATION require financial_assurance_dollars >= (recomputed) assurance_required_dollars (half for COMBINATION) and long_term_stewardship_secured == true"
    error_id: "ERR_CREDITS_NOT_SECURED | ERR_INSUFFICIENT_FINANCIAL_ASSURANCE"
    http_status: 422
    applies_to: "POST /mitigation-plans/{id}/secure-credits"
  - priority: 29
    category: business_fiscal
    check: "pay-in-lieu-fee: amount_dollars must equal ilf_fee_due_dollars exactly"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /mitigation-plans/{id}/pay-in-lieu-fee"
  - priority: 30
    category: business_fiscal
    check: "render-decision ISSUE requires a CREDITS_SECURED plan when compensatory_mitigation_required; reinstate requires zero OVERDUE reports; close requires 5 ACCEPTED reports and a COMPLETED plan"
    error_id: "ERR_MITIGATION_NOT_SECURED | ERR_REPORTS_OVERDUE_EXIST | ERR_MONITORING_INCOMPLETE"
    http_status: 422
    applies_to: "POST /applications/{id}/render-decision; POST /permits/{id}/reinstate; POST /permits/{id}/close"
  - priority: 31
    category: business_temporal
    check: "The logical clock is strictly monotonic: to_iso8601 must be strictly greater than the current logical clock value"
    error_id: ERR_CLOCK_REGRESSION
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

# =============================================================================
# §1.5 API Endpoint Table (67 endpoints)
# Every list endpoint supports the response_envelope pagination fields and
# sorts by created_at ascending unless the description pins another key.
# =============================================================================
endpoints:
  # --- Applicant ---
  - method: POST
    path: "/wetland-permits/applicants"
    description: "Register an applicant"
    roles: [SystemAdmin]
    code: 201
    input: [legal_name, organization_type, contact_email]
    output: Applicant
    side_effects: ["prior_violation_count initialized to 0"]
  - method: GET
    path: "/wetland-permits/applicants/{id}"
    description: "Get one applicant (Applicant role may only read its own id)"
    roles: [SystemAdmin, Applicant]
    code: 200
    input: []
    output: Applicant
    side_effects: []

  # --- WatersSite ---
  - method: POST
    path: "/wetland-permits/sites"
    description: "Register a waters site for an applicant"
    roles: [SystemAdmin]
    code: 201
    input: [applicant_id, site_name, state_code, watershed_code, total_acres, resource_types_present]
    output: WatersSite
    side_effects: []
  - method: GET
    path: "/wetland-permits/sites"
    description: "List sites, optionally filtered by applicant_id"
    roles: [SystemAdmin, Applicant, Reviewer, DistrictEngineer, AgencyReviewer, EnforcementOfficer]
    code: 200
    input: ["applicant_id?", "limit?", "offset?"]
    output: "WatersSite[]"
    side_effects: []
  - method: GET
    path: "/wetland-permits/sites/{id}"
    description: "Get one site"
    roles: [SystemAdmin, Applicant, Reviewer, DistrictEngineer, AgencyReviewer, EnforcementOfficer]
    code: 200
    input: []
    output: WatersSite
    side_effects: []

  # --- JurisdictionalDetermination ---
  - method: POST
    path: "/wetland-permits/jurisdictional-determinations"
    description: "Create a jurisdictional determination in DRAFT"
    roles: [Reviewer]
    code: 201
    input: [site_id, jd_type, determination, rationale]
    output: JurisdictionalDetermination
    side_effects: ["status DRAFT"]
  - method: GET
    path: "/wetland-permits/jurisdictional-determinations"
    description: "List JDs, optionally filtered"
    roles: [SystemAdmin, Applicant, Reviewer, DistrictEngineer, AgencyReviewer, EnforcementOfficer]
    code: 200
    input: ["site_id?", "jd_type?", "status?", "limit?", "offset?"]
    output: "JurisdictionalDetermination[]"
    side_effects: []
  - method: GET
    path: "/wetland-permits/jurisdictional-determinations/{id}"
    description: "Get one JD"
    roles: [SystemAdmin, Applicant, Reviewer, DistrictEngineer, AgencyReviewer, EnforcementOfficer]
    code: 200
    input: []
    output: JurisdictionalDetermination
    side_effects: []
  - method: POST
    path: "/wetland-permits/jurisdictional-determinations/{id}/issue"
    description: "Issue a DRAFT JD (sets issued_date/expiration_date; enforces one live JD per site)"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: JurisdictionalDetermination
    side_effects: ["status DRAFT -> ISSUED; issued_date := clock; expiration_date := issued_date + 1825 days"]

  # --- Appeal ---
  - method: POST
    path: "/wetland-permits/appeals"
    description: "File an appeal of an ISSUED APPROVED JD within 60 days of issuance; appellant is X-User-ID and must own the site's applicant"
    roles: [Applicant]
    code: 201
    input: [jd_id, grounds_text]
    output: Appeal
    side_effects: ["status FILED; filed_date := clock; appellant_applicant_id := X-User-ID"]
  - method: GET
    path: "/wetland-permits/appeals"
    description: "List appeals, optionally filtered"
    roles: [SystemAdmin, Applicant, Reviewer, DistrictEngineer, AgencyReviewer, EnforcementOfficer]
    code: 200
    input: ["jd_id?", "appellant_applicant_id?", "status?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []
  - method: GET
    path: "/wetland-permits/appeals/{id}"
    description: "Get one appeal"
    roles: [SystemAdmin, Applicant, Reviewer, DistrictEngineer, AgencyReviewer, EnforcementOfficer]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: POST
    path: "/wetland-permits/appeals/{id}/decide"
    description: "Decide a FILED appeal; outcome SUSTAINED reverses the JD and fires the suspension cascade"
    roles: [DistrictEngineer]
    code: 200
    input: [outcome, decision_rationale]
    output: Appeal
    side_effects: ["status FILED -> SUSTAINED|DENIED; on SUSTAINED the JD REVERSED cascade runs (applications -> SUSPENDED_PENDING_JD, their RESERVED credit transactions -> RELEASED)"]

  # --- PermitApplication ---
  - method: POST
    path: "/wetland-permits/applications"
    description: "Create a permit application in DRAFT; applicant_id is set from X-User-ID"
    roles: [Applicant]
    code: 201
    input: [site_id, jd_id, pathway, impacts, project_purpose, estimated_cost_dollars, "general_permit_code?", "enforcement_case_id?"]
    output: PermitApplication
    side_effects: ["total_impact_acres, is_after_the_fact, compensatory_mitigation_required computed; notice_status NONE"]
  - method: GET
    path: "/wetland-permits/applications"
    description: "List applications, optionally filtered"
    roles: [SystemAdmin, Applicant, Reviewer, DistrictEngineer, AgencyReviewer, EnforcementOfficer]
    code: 200
    input: ["applicant_id?", "site_id?", "jd_id?", "status?", "enforcement_case_id?", "limit?", "offset?"]
    output: "PermitApplication[]"
    side_effects: []
  - method: GET
    path: "/wetland-permits/applications/{id}"
    description: "Get one application"
    roles: [SystemAdmin, Applicant, Reviewer, DistrictEngineer, AgencyReviewer, EnforcementOfficer]
    code: 200
    input: []
    output: PermitApplication
    side_effects: []
  - method: PATCH
    path: "/wetland-permits/applications/{id}"
    description: "Edit a DRAFT or RETURNED_TO_APPLICANT application; OCC-guarded; status unchanged"
    roles: [Applicant]
    code: 200
    input: [expected_application_version, "site_id?", "jd_id?", "pathway?", "impacts?", "project_purpose?", "estimated_cost_dollars?", "general_permit_code?", "enforcement_case_id?"]
    output: PermitApplication
    side_effects: ["increments PermitApplication.version by 1; computed fields recomputed"]
  - method: POST
    path: "/wetland-permits/applications/{id}/submit"
    description: "Submit from DRAFT or RETURNED_TO_APPLICANT; from SUSPENDED_PENDING_JD requires new_jd_id"
    roles: [Applicant]
    code: 200
    input: ["new_jd_id?"]
    output: PermitApplication
    side_effects: ["status -> SUBMITTED; submitted_date := clock; jd_id replaced when new_jd_id given"]
  - method: POST
    path: "/wetland-permits/applications/{id}/screening"
    description: "Reviewer screening action: BEGIN (SUBMITTED->SCREENING, records screening_reviewer_id), RETURN (SCREENING->RETURNED_TO_APPLICANT), APPROVE (SCREENING->ALTERNATIVES_REVIEW for individual pathways, ->DECISION_PENDING for general pathways)"
    roles: [Reviewer]
    code: 200
    input: [action, "return_reason?"]
    output: PermitApplication
    side_effects: ["status transition per action; BEGIN captures screening_reviewer_id from X-User-ID"]
  - method: POST
    path: "/wetland-permits/applications/{id}/publish-notice"
    description: "Publish the public notice (individual pathways; requires AA ACCEPTED); moves application to PUBLIC_NOTICE_OPEN"
    roles: [Reviewer]
    code: 200
