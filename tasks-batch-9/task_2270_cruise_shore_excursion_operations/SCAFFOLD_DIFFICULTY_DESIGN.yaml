  - rule_id: cross_entity_state_dependency
    instances:

      - name: excursion_publish_is_gated_on_the_owning_operator_reaching_approved
        grounds:
          - state_machines.Excursion.PENDING_REVIEW_to_PUBLISHED
          - state_machines.TourOperator.SUBMITTED_to_APPROVED
          - state_machines.ExcursionDeparture.SCHEDULED_to_SELLING
          - validations[28].ERR_OPERATOR_NOT_APPROVED
          - endpoints[POST /shore-excursions/excursions/{excursionId}/catalog-actions]
        distinguishing_aspect: |
          Entity pair Excursion x TourOperator: the Excursion transition is legal on its own dimension —
          the row is PENDING_REVIEW with non-empty languages — yet it is refused purely because the
          TourOperator sits in SUBMITTED. Approving the operator changes nothing on the Excursion row, and
          the identical PUBLISH request then succeeds and drags the SCHEDULED departure to SELLING.
        test_recipe:
          setup:
            - "Cozumel is an ALONGSIDE port with a meeting point admitting 4 concurrent groups."
            - "One operator has a clean INITIAL audit of raw_score 82 and has been SUBMITTED but not yet APPROVED."
            - "That operator owns one PREMIUM excursion at base_price_cents 12000 sitting in PENDING_REVIEW with languages [EN, ES]."
            - "Port call V2609 is OPEN_FOR_SALE and one departure meeting 2026-09-15T09:00:00Z is SCHEDULED because the excursion is not published yet."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
