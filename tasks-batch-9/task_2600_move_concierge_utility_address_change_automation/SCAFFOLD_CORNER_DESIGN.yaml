      - name: derived_field_reconciliation_feed_accrual_equals_the_ledger_share_sum
        claim_type: derived_field_reconciliation
        grounds:
          - entities.FeedSource.fields.accrued_share_cents
          - calculations.referral_attributed_share_cents
          - entities.RevenueShareLedgerEntry.fields.entry_type
        distinguishing_aspect: |
          The one denormalized total in the model, reconciled against its own ledger across two
          placements with different payout models and then after a reversal removes one of them:
          accrued_share_cents must equal the signed sum of the feed's FEED_SOURCE_SHARE and
          FEED_SOURCE_SHARE_REVERSAL entries at every step, so a reversal that posts a compensating
          row but forgets the rollup, or decrements the rollup without posting the row, both fail.
