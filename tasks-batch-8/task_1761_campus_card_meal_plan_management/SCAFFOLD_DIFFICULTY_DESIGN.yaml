  - rule_id: cross_entity_state_dependency
    instances:
      - name: enrollment_requires_term_open_or_scheduled
        grounds:
          - state_machines.Term.OPEN_to_CLOSED
          - validations[priority=10]
          - errors[ERR_TERM_NOT_OPEN]
        distinguishing_aspect: |
          Entity pair MealPlanEnrollment x Term: enrollment assignment is legal while the term
          is SCHEDULED or OPEN, but once the term is CLOSED the same request is rejected with
          ERR_TERM_NOT_OPEN — enrollment validity is gated by the term machine's state.
        test_recipe:
          setup:
            - "Term FALLXS ran SCHEDULED -> OPEN -> CLOSED (clock moved past end_date); plan COMM5-XS published; holder U8001 ACTIVE"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/terms"
              payload: { term_code: "FALLXS", name: "Fall XS", start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-13T23:59:59Z", add_drop_deadline: "2026-09-20T23:59:59Z", total_weeks: 16, proration_mode: "WEEKLY" }
              as: DiningServicesManager
              captures: { term_id: "$.data.id" }
            - call: "POST /api/meal-plans"
              payload: { plan_code: "COMM5-XS", name: "C5 XS", weekly_swipe_allowance: 5, dining_dollar_allocation_cents: 10000, price_cents: 90000, eligible_holder_types: ["STUDENT_COMMUTER"] }
              as: DiningServicesManager
              captures: { plan_id: "$.data.id" }
            - { call: "POST /api/meal-plans/${plan_id}/publish", payload: {}, as: DiningServicesManager }
            - { call: "POST /api/terms/${term_id}/open", payload: {}, as: DiningServicesManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-14T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/terms/${term_id}/close", payload: {}, as: DiningServicesManager }
            - call: "POST /api/card-holders"
              payload: { university_id: "U8001", full_name: "Pat Late", email: "pat@x.edu", holder_type: "STUDENT_COMMUTER", housing_status: "COMMUTER" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
          trigger:
            - call: "POST /api/card-holders/${h_id}/enrollments"
              payload: { plan_id: "${plan_id}", term_id: "${term_id}" }
              as: DiningServicesManager
              captures: { err: "$.data.error_id" }
          assert:
            - "Response error_id == ERR_TERM_NOT_OPEN (http 409): CLOSED term blocks enrollment"
            - "No MealPlanEnrollment row is created for the holder in this term"

      - name: grant_reinstate_requires_card_active
        grounds:
          - state_machines.AccessGrant.SUSPENDED_to_ACTIVE
          - state_machines.CampusCard.ACTIVE_to_LOST_FROZEN
          - errors[ERR_CARD_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair AccessGrant x CampusCard (different pair than enrollment x term):
          reinstating a CARD_FROZEN-suspended grant while the card is LOST_FROZEN is rejected
          with ERR_CARD_NOT_ACTIVE even though the grant itself is in a reinstatable state.
        test_recipe:
          setup:
            - "Holder U8002 with photo-verified card; zone LIB-X; ACTIVE grant g on the card; card then reported lost (grant auto-SUSPENDED with CARD_FROZEN)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U8002", full_name: "Quinn Resident", email: "quinn@x.edu", holder_type: "STUDENT_RESIDENT", housing_status: "ON_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { card_id: "$.data.id" }
            - call: "POST /api/cards/${card_id}/photos"
              payload: { image_ref: "img://quinn" }
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { photo_id: "$.data.id" }
            - { call: "POST /api/photos/${photo_id}/review", payload: { decision: "APPROVED" }, as: CardOfficeAdmin }
            - { call: "POST /api/cards/${card_id}/activate", payload: {}, as: CardOfficeAdmin }
            - call: "POST /api/door-zones"
              payload: { zone_code: "LIB-X", building: "Library", security_level: "STANDARD", access_windows: [{ day_of_week: "TUE", start_minute: 480, end_minute: 1080 }] }
              as: SecurityOfficer
              captures: { z_id: "$.data.id" }
            - call: "POST /api/cards/${card_id}/access-grants"
              payload: { zone_id: "${z_id}", clearance: "STANDARD", valid_from: "2026-08-01T00:00:00Z", valid_until: "2027-08-01T00:00:00Z" }
              as: SecurityOfficer
              captures: { g_id: "$.data.id" }
            - { call: "POST /api/cards/${card_id}/report-lost", payload: {}, as: CardHolder, as_user_id: "${h_id}" }
          trigger:
            - call: "POST /api/access-grants/${g_id}/reinstate"
              payload: {}
              as: SecurityOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "Response error_id == ERR_CARD_NOT_ACTIVE (http 409): grant state machine is guarded by the card machine"
            - "AccessGrant.${g_id}.status remains SUSPENDED with suspended_reason == CARD_FROZEN"

  - rule_id: resource_temporal_overlap
    instances:
      - name: grant_half_open_overlap_adjacency
        grounds:
          - validations[priority=13]
          - errors[ERR_GRANT_OVERLAP]
          - entities.AccessGrant.fields.valid_until
        distinguishing_aspect: |
          Resource AccessGrant uses HALF-OPEN interval semantics [valid_from, valid_until): a new
          grant whose valid_from equals the existing grant's valid_until is adjacent and allowed;
          overlapping by one second is rejected. Different interval semantics and resource than
          the settlement-period instance.
        test_recipe:
          setup:
            - "Holder U9001 with ACTIVE card; zone GYM; grant g1 ACTIVE over [2026-09-01T00:00:00Z, 2026-10-01T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U9001", full_name: "Rae Resident", email: "rae@x.edu", holder_type: "STUDENT_RESIDENT", housing_status: "ON_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { card_id: "$.data.id" }
            - call: "POST /api/cards/${card_id}/activate"
              payload: { allow_provisional: true }
              as: CardOfficeAdmin
            - call: "POST /api/door-zones"
              payload: { zone_code: "GYM", building: "Athletics", security_level: "STANDARD", access_windows: [{ day_of_week: "MON", start_minute: 360, end_minute: 1320 }] }
              as: SecurityOfficer
              captures: { z_id: "$.data.id" }
            - call: "POST /api/cards/${card_id}/access-grants"
              payload: { zone_id: "${z_id}", clearance: "STANDARD", valid_from: "2026-09-01T00:00:00Z", valid_until: "2026-10-01T00:00:00Z" }
              as: SecurityOfficer
              captures: { g1_id: "$.data.id" }
          trigger:
            - call: "POST /api/cards/${card_id}/access-grants"
              payload: { zone_id: "${z_id}", clearance: "STANDARD", valid_from: "2026-10-01T00:00:00Z", valid_until: "2026-11-01T00:00:00Z" }
              as: SecurityOfficer
              captures: { g2_id: "$.data.id", g2_status: "$.data.status" }
            - call: "POST /api/cards/${card_id}/access-grants"
              payload: { zone_id: "${z_id}", clearance: "STANDARD", valid_from: "2026-09-15T00:00:00Z", valid_until: "2026-12-01T00:00:00Z" }
              as: SecurityOfficer
              captures: { err: "$.data.error_id" }
          assert:
            - "Adjacent grant (valid_from == prior valid_until) is created: http 201, status ACTIVE — half-open semantics permit touching endpoints"
            - "Intersecting grant (2026-09-15 lies inside g1) is rejected: ERR_GRANT_OVERLAP (http 409)"
            - "Exactly 2 grants exist for (card, zone) after the three calls"

      - name: settlement_closed_closed_touch_overlap
        grounds:
          - validations[priority=13]
          - errors[ERR_SETTLEMENT_PERIOD_OVERLAP]
          - entities.MerchantSettlement.fields.period_end
        distinguishing_aspect: |
          Resource MerchantSettlement uses CLOSED-CLOSED interval semantics: a new period whose
          start touches the existing period's end day (2026-09-30) CONFLICTS — the opposite
          treatment from the half-open grant adjacency. Only 2026-10-01 onward is conflict-free.
        test_recipe:
          setup:
            - "Term SETT26D; ACTIVE merchant MOVL; settlement s1 exists over [2026-09-01T00:00:00Z, 2026-09-30T23:59:59Z] (DRAFT counts as occupying)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-05T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/terms"
              payload: { term_code: "SETT26D", name: "Settle D", start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-13T23:59:59Z", add_drop_deadline: "2026-09-20T23:59:59Z", total_weeks: 16, proration_mode: "WEEKLY" }
              as: DiningServicesManager
              captures: { term_id: "$.data.id" }
            - call: "POST /api/merchants"
              payload: { merchant_code: "M-OVL", legal_name: "Overlap Grocer", category: "GROCERY", commission_bps: 275, commission_mode: "PER_TRANSACTION", contact_email: "ovl@x.com" }
              as: BursarOffice
              captures: { m_id: "$.data.id" }
            - { call: "POST /api/merchants/${m_id}/activate", payload: {}, as: BursarOffice }
            - call: "POST /api/merchants/${m_id}/settlements"
              payload: { term_id: "${term_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T23:59:59Z" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { s1_id: "$.data.id" }
          trigger:
            - call: "POST /api/merchants/${m_id}/settlements"
              payload: { term_id: "${term_id}", period_start: "2026-09-30T00:00:00Z", period_end: "2026-10-31T23:59:59Z" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /api/merchants/${m_id}/settlements"
              payload: { term_id: "${term_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-10-31T23:59:59Z" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { s2_id: "$.data.id", s2_status: "$.data.status" }
          assert:
            - "Period starting 2026-09-30 (a day inside s1's closed-closed span) is rejected: ERR_SETTLEMENT_PERIOD_OVERLAP (http 409)"
            - "Period starting 2026-10-01 is created: http 201, status DRAFT"
            - "Contrast pinned: grant adjacency (touching half-open endpoints) is allowed while settlement day-sharing conflicts"

  - rule_id: compensating_invariant
    instances:
      - name: purchase_reversal_balance_conservation
        grounds:
          - calculations.ledger_balance_recompute
          - state_machines.CardTransaction.UNDER_DISPUTE_to_REVERSED
          - state_machines.Dispute.OPENED_to_RESOLVED_FOR_CARDHOLDER
        distinguishing_aspect: |
          Conserved quantity: DecliningBalanceAccount.balance_cents == signed ledger sum. The
          forward action (PURCHASE 1200) paired with its compensating action (dispute resolved
          FOR_CARDHOLDER posting PURCHASE_REVERSAL 1200) restores the balance to exactly 5000.
        test_recipe:
          setup:
            - "Holder U10001 with photo-verified ACTIVE card; CAMPUS_CASH funded 5000; one 1200-cent purchase posted (balance 3800)"
            - "Dispute filed on the purchase (reason DUPLICATE_CHARGE)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U10001", full_name: "Sam Resident", email: "sam@x.edu", holder_type: "STUDENT_RESIDENT", housing_status: "ON_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { card_id: "$.data.id" }
            - call: "POST /api/cards/${card_id}/photos"
              payload: { image_ref: "img://sam" }
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { photo_id: "$.data.id" }
            - { call: "POST /api/photos/${photo_id}/review", payload: { decision: "APPROVED" }, as: CardOfficeAdmin }
            - { call: "POST /api/cards/${card_id}/activate", payload: {}, as: CardOfficeAdmin }
            - call: "POST /api/card-holders/${h_id}/accounts"
              payload: { account_type: "CAMPUS_CASH" }
              as: BursarOffice
              captures: { acct_id: "$.data.id" }
            - { call: "POST /api/accounts/${acct_id}/funding", payload: { amount_cents: 5000, idempotency_key: "fund-sam" }, as: BursarOffice }
            - call: "POST /api/transactions"
              payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 1200, idempotency_key: "sam-t1" }
              as: PointOfSale
              captures: { tx_id: "$.data.id" }
            - call: "POST /api/transactions/${tx_id}/disputes"
              payload: { reason_code: "DUPLICATE_CHARGE" }
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { d_id: "$.data.id" }
          trigger:
            - call: "POST /api/disputes/${d_id}/resolve"
              payload: { outcome: "FOR_CARDHOLDER", resolution_note: "duplicate confirmed" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
            - call: "GET /api/accounts/${acct_id}"
              payload: {}
              as: BursarOffice
              captures: { bal: "$.data.balance_cents" }
            - call: "GET /api/transactions/${tx_id}"
              payload: {}
              as: FraudAnalyst
              captures: { tx_status: "$.data.status" }
            - call: "GET /api/ledger-entries"
              payload: { account_id: "${acct_id}" }
              as: BursarOffice
              captures: { entry_count: "$.data[2].amount_cents" }
          assert:
            - "CardTransaction.${tx_id}.status == REVERSED"
            - "DecliningBalanceAccount.${acct_id}.balance_cents == 5000 (invariant: purchase + reversal conserve the pre-purchase balance)"
            - "Ledger holds exactly 3 entries: FUND 5000, PURCHASE 1200, PURCHASE_REVERSAL 1200; signed sum == balance_cents"
            - "running_balance_cents sequence is 5000, 3800, 5000 in entry_sequence order"

      - name: dispute_carryover_gross_conservation
        grounds:
          - calculations.dispute_carryover_sweep
          - calculations.merchant_settlement_sweep
          - state_machines.CardTransaction.UNDER_DISPUTE_to_POSTED
        distinguishing_aspect: |
          Conserved quantity: merchant gross across settlements — sum of gross_cents over
          non-REJECTED settlements plus unsettled POSTED amounts equals the sum of all
          non-REVERSED transaction amounts. A disputed transaction excluded from settlement 1
          and carried into settlement 2 leaves the combined gross at 3497. Different conserved
          quantity than the account-balance instance.
        test_recipe:
          setup:
            - "Term SETT26E; ACTIVE merchant MCRY (PER_TRANSACTION, 275 bps); holder with verified card, CAMPUS_CASH funded 10000"
            - "Three 999-cent merchant transactions at 2026-09-05; tx3 disputed (SERVICE_NOT_RECEIVED); settlement s1 for September submitted (excludes tx3)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-05T12:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/terms"
              payload: { term_code: "SETT26E", name: "Settle E", start_date: "2026-08-24T00:00:00Z", end_date: "2026-12-13T23:59:59Z", add_drop_deadline: "2026-09-20T23:59:59Z", total_weeks: 16, proration_mode: "WEEKLY" }
              as: DiningServicesManager
              captures: { term_id: "$.data.id" }
            - call: "POST /api/merchants"
              payload: { merchant_code: "M-CRY", legal_name: "Carry Cafe", category: "COFFEE", commission_bps: 275, commission_mode: "PER_TRANSACTION", contact_email: "cry@x.com" }
              as: BursarOffice
              captures: { m_id: "$.data.id" }
            - { call: "POST /api/merchants/${m_id}/activate", payload: {}, as: BursarOffice }
            - call: "POST /api/card-holders"
              payload: { university_id: "U10002", full_name: "Tess Resident", email: "tess@x.edu", holder_type: "STUDENT_RESIDENT", housing_status: "ON_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { card_id: "$.data.id" }
            - call: "POST /api/cards/${card_id}/photos"
              payload: { image_ref: "img://tess" }
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { photo_id: "$.data.id" }
            - { call: "POST /api/photos/${photo_id}/review", payload: { decision: "APPROVED" }, as: CardOfficeAdmin }
            - { call: "POST /api/cards/${card_id}/activate", payload: {}, as: CardOfficeAdmin }
            - call: "POST /api/card-holders/${h_id}/accounts"
              payload: { account_type: "CAMPUS_CASH" }
              as: BursarOffice
              captures: { acct_id: "$.data.id" }
            - { call: "POST /api/accounts/${acct_id}/funding", payload: { amount_cents: 10000, idempotency_key: "fund-tess" }, as: BursarOffice }
            - { call: "POST /api/transactions", payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 999, idempotency_key: "cry-1", merchant_id: "${m_id}" }, as: MerchantUser, as_user_id: "${m_id}" }
            - { call: "POST /api/transactions", payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 999, idempotency_key: "cry-2", merchant_id: "${m_id}" }, as: MerchantUser, as_user_id: "${m_id}" }
            - call: "POST /api/transactions"
              payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 999, idempotency_key: "cry-3", merchant_id: "${m_id}" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { tx3_id: "$.data.id" }
            - { call: "POST /api/transactions/${tx3_id}/disputes", payload: { reason_code: "SERVICE_NOT_RECEIVED" }, as: CardHolder, as_user_id: "${h_id}", captures: { d_id: "$.data.id" } }
            - call: "POST /api/merchants/${m_id}/settlements"
              payload: { term_id: "${term_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-30T23:59:59Z" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { s1_id: "$.data.id" }
            - call: "POST /api/settlements/${s1_id}/submit"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { s1_gross: "$.data.gross_cents", s1_count: "$.data.transaction_count" }
          trigger:
            - { call: "POST /api/disputes/${d_id}/resolve", payload: { outcome: "FOR_MERCHANT", resolution_note: "service rendered" }, as: FraudAnalyst, as_user_id: "fraud-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-10T12:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/transactions", payload: { card_id: "${card_id}", tender_type: "CAMPUS_CASH", amount_cents: 500, idempotency_key: "cry-4", merchant_id: "${m_id}" }, as: MerchantUser, as_user_id: "${m_id}" }
            - call: "POST /api/merchants/${m_id}/settlements"
              payload: { term_id: "${term_id}", period_start: "2026-10-01T00:00:00Z", period_end: "2026-10-31T23:59:59Z" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { s2_id: "$.data.id" }
            - call: "POST /api/settlements/${s2_id}/submit"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { s2_gross: "$.data.gross_cents", s2_comm: "$.data.commission_cents", s2_count: "$.data.transaction_count", s2_carried: "$.data.carried_from_settlement_id" }
          assert:
            - "Settlement 1 (September): gross_cents == 1998 and transaction_count == 2 (disputed 999 excluded)"
            - "After FOR_MERCHANT resolution, tx3 returns to POSTED and is sweep-eligible"
            - "Settlement 2 (October): gross_cents == 1499 (carried 999 + new 500), commission_cents == 41, transaction_count == 2"
            - "MerchantSettlement.${s2_id}.carried_from_settlement_id == ${s1_id}"
            - "Invariant: 1998 + 1499 == 3497 == sum of all four non-REVERSED transaction amounts (999 x 3 + 500)"

      - name: replacement_single_active_card_conservation
        grounds:
          - state_machines.CampusCard.ACTIVE_to_REPLACED
          - entities.CampusCard.fields.replaced_by_card_id
          - errors[ERR_ACTIVE_CARD_EXISTS]
        distinguishing_aspect: |
          Conserved quantity: the count of non-terminal cards per holder (an entity-count
          invariant, not money). Replacement is a forward action (mint successor) paired with
          its compensation (retire predecessor) leaving exactly one non-terminal card before
          and after; direct issuance of a second card is refused outright.
        test_recipe:
          setup:
            - "Holder U10003 with photo-verified ACTIVE card c1"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-25T09:00:00Z" }, as: PlatformAdmin }
            - call: "POST /api/card-holders"
              payload: { university_id: "U10003", full_name: "Uma Resident", email: "uma@x.edu", holder_type: "STUDENT_RESIDENT", housing_status: "ON_CAMPUS" }
              as: CardOfficeAdmin
              captures: { h_id: "$.data.id" }
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { c1: "$.data.id" }
            - call: "POST /api/cards/${c1}/photos"
              payload: { image_ref: "img://uma" }
              as: CardHolder
              as_user_id: "${h_id}"
              captures: { photo_id: "$.data.id" }
            - { call: "POST /api/photos/${photo_id}/review", payload: { decision: "APPROVED" }, as: CardOfficeAdmin }
            - call: "POST /api/cards/${c1}/activate"
              payload: {}
              as: CardOfficeAdmin
              captures: { c1_v: "$.data.version" }
          trigger:
            - call: "POST /api/card-holders/${h_id}/cards"
              payload: { expires_at: "2027-08-24T00:00:00Z" }
              as: CardOfficeAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /api/cards/${c1}/replacement"
              payload: { reason: "LOST", expected_card_version: "${c1_v}" }
              as: CardOfficeAdmin
              captures: { c2: "$.data.id", c2_status: "$.data.lifecycle_status", c2_photo: "$.data.photo_status" }
            - call: "GET /api/cards/${c1}"
              payload: {}
              as: CardOfficeAdmin
              captures: { c1_status: "$.data.lifecycle_status", c1_repl: "$.data.replaced_by_card_id" }
          assert:
            - "Second direct issuance is rejected: ERR_ACTIVE_CARD_EXISTS (http 409)"
            - "After replacement: CampusCard.${c1}.lifecycle_status == REPLACED and replaced_by_card_id == ${c2}"
            - "CampusCard.${c2}.lifecycle_status == ACTIVE with photo_status == APPROVED inherited (photo was approved)"
            - "Exactly one non-terminal card exists for the holder before and after the replacement (count invariant)"
            - "CampusCard.${c2}.replacement_fee_cents == 2500 (ordinal 1, LOST)"
