            - call: "POST /displacement-lodgings"
              payload: { hazard_case_id: "${hz_id}", lease_id: "${l1_id}", start_date: "2026-09-19", end_date: "2026-09-20", nightly_rate_cents: 22000, occupants_count: 4 }
