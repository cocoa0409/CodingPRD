  - rule_id: boundary_precision_check
    instances:
      - name: availability_exactly_at_guarantee_earns_no_credit
        grounds:
          - calculations.availability_credit
          - validations[priority=15]
        distinguishing_aspect: |
          Numeric threshold boundary on availability_pct: with 73 downtime hours
          against 730 fleet-hours the availability is exactly 90.00 and the
          strictly-below rule earns no credit; adding 73 more hours (146 total,
          80.00) earns 200000 cents, proving the credit fires only when the
          rounded availability falls strictly below the 90.0 guarantee — and the
          boundary itself (== guarantee) never fires.
        test_recipe:
          setup:
            - "Site with APPROVED assessment forklift_count 1 (fleet_hours 730) and ACTIVE agreement: guarantee 90.0, monthly_fee 2000000 cents"
            - "DowntimeReport month 2026-10 with downtime_hours 73 (exactly at the 90.00 boundary), then a second report of 73 more hours (146 total, clearly below)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-BND", name: "Boundary Site", address: "3 Threshold Rd", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments"
              payload: { forklift_count: 1, duty_cycle_hours_per_day: 8.0, peak_shift_hours: 8, safety_findings_json: "{\"ok\": true}" }
              as: SiteManager
              captures: { ass: $.data.id }
            - call: "POST /api/sites/${site_id}/assessments/${ass}/submit"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/assessments/${ass}/approve"
              payload: {}
              as: SafetyOfficer
            - call: "POST /api/sites/${site_id}/service-agreements"
              payload: { coverage_start: "2026-10-01", coverage_end: "2027-09-30", availability_guarantee_pct: 90.0, monthly_fee_cents: 2000000 }
              as: SiteManager
              captures: { agr: $.data.id }
            - call: "POST /api/sites/${site_id}/service-agreements/${agr}/activate"
              payload: {}
              as: SiteManager
            - call: "POST /api/sites/${site_id}/downtime-reports"
              payload: { month: "2026-10", forklift_id: "FL-B1", downtime_hours: 73.0 }
              as: SiteManager
          trigger:
            - call: "GET /api/sites/${site_id}/availability-report"
              payload: { month: "2026-10" }
              as: BillingOperator
              captures: { pct1: $.data.availability_pct, cred1: $.data.credit_cents }
            - call: "POST /api/sites/${site_id}/downtime-reports"
              payload: { month: "2026-10", forklift_id: "FL-B2", downtime_hours: 73.0 }
              as: SiteManager
            - call: "GET /api/sites/${site_id}/availability-report"
              payload: { month: "2026-10" }
              as: BillingOperator
              captures: { pct2: $.data.availability_pct, cred2: $.data.credit_cents }
          assert:
            - "first read: downtime_hours == 73.0, availability_pct == 90.0 and credit_cents == 0 (exactly at guarantee, strictly-below does not fire)"
            - "second read: downtime_hours == 146.0, availability_pct == 80.0 and credit_cents == 200000 (ROUND_HALF_UP(2000000 x 0.10, 0)) — the same endpoint and guarantee, only the metric moved across the boundary"
      - name: indoor_storage_at_exactly_200kg_accepted
        grounds:
          - validations[priority=8]
          - entities.FuelingStation.fields.storage_capacity_kg
        distinguishing_aspect: |
          Different metric and endpoint than the availability boundary: the
          INDOOR fire-code storage cap accepts exactly 200 kg (<=, boundary
          inclusive) but rejects 200.01 kg with ERR_INDOOR_STORAGE_EXCEEDED on
          the station-creation endpoint.
        test_recipe:
          setup:
            - "Site ACTIVE; clock at 2026-10-01"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { code: "S-CAP", name: "Cap Site", address: "4 Storage Ln", baseline_labor_rate_per_hour: 30.0 }
              as: SiteManager
              captures: { site_id: $.data.id }
          trigger:
