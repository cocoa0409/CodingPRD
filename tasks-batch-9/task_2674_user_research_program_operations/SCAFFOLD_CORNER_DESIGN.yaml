              as_user_id: "u_res_1"
            - call: "POST /studies/${study_id}/recruitments"
              payload: { participant_id: "${p1_id}", screening_answers: { segment: "POWER_USER", locale: "en-US", answers: ["A1", "X9"] } }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { r1_id: $.data.id }
            - call: "POST /studies/${study_id}/recruitments"
              payload: { participant_id: "${p2_id}", screening_answers: { segment: "POWER_USER", locale: "de-DE", answers: ["A1"] } }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { r2_id: $.data.id }
            - call: "POST /studies/${study_id}/recruitments"
              payload: { participant_id: "${p3_id}", screening_answers: { segment: "POWER_USER", locale: "en-US", answers: ["A1", "A2", "A7"] } }
              as: Researcher
