  # ===========================================================================
  # Section: errors (triggerability not already covered)
  # ===========================================================================
  - section: errors
    instances:
      - name: error_posting_not_open_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_POSTING_NOT_OPEN]"]
        excluded_because:
          difficulty_instance: "posting_initial_state_is_draft (corner, entities-adjacent) exercises ERR_POSTING_NOT_OPEN via application into a DRAFT posting"
          rationale: "Asserted as the failure path of the named corner instance."

      - name: error_schedule_overlap_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCHEDULE_OVERLAP]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / rate_schedule_half_open_adjacency_allowed_overlap_rejected"
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_stale_faculty_version_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_FACULTY_VERSION]"]
        excluded_because:
          difficulty_instance: "validations section corner stale_faculty_version_occ_on_contract_issue"
          rationale: "Asserted as the failure path of the named corner instance (both OCC rules)."

      - name: error_payroll_close_order_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_PAYROLL_CLOSE_ORDER]"]
        excluded_because:
          difficulty_instance: "state_machines corner payroll_period_double_close_and_lock_ordering"
          rationale: "Asserted as one of the two failure paths of the named corner instance."

      - name: error_revision_limit_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_REVISION_LIMIT]"]
        excluded_because:
          difficulty_instance: "non_linear_state_machine / application_revision_cycle_with_cap"
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_cancellation_policy_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CANCELLATION_POLICY]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / low_enrollment_cancel_at_exact_min_enrollment_rejected"
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: error_load_cap_exceeded_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_LOAD_CAP_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / referential_beats_fiscal_on_contract_issuance (as the losing error) and validations corner load_cap_overage_boundary_exact_allowance_passes (as the direct failure)"
          rationale: "Directly asserted in the validations corner instance."

      - name: error_segregation_of_duties_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]"]
        excluded_because:
          difficulty_instance: "validations corner segregation_of_duties_same_reviewer_blocked"
          rationale: "Asserted as the failure path of the named corner instance."

      - name: error_credentials_incomplete_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREDENTIALS_INCOMPLETE]"]
        excluded_because:
          difficulty_instance: "validations corners approve_blocked_by_pending_credential and approve_blocked_when_verified_tier_below_minimum"
          rationale: "Asserted in both named corner instances."

