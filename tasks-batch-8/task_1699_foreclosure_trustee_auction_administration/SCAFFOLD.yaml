# =============================================================================
# SCAFFOLD — Foreclosure Trustee & Auction Administration
# =============================================================================
scenario: |
  Foreclosure Trustee & Auction Administration (foreclosure trustee company): default referral & notice of default recording, statutory notice periods & publication requirements, reinstatement/payoff quote & tracking, sale postponement & bidding instructions from beneficiary, auction conduct & third-party bidder qualification, trustee's deed issuance & recording, surplus funds distribution & claims, litigation/bankruptcy stay handling

domain_name: foreclosure-trustee-auction
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: hybrid          # case-rooted tree + flat FK peers (sales, disbursements)
  state_machine_shape: parallel    # lifecycle x hold posture on ForeclosureCase; cycles on AuctionSale/NoticeOfTrusteeSale
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Beneficiary (lender/investor) legal name" }
      - { name: reference_code, type: string, source: input, description: "Unique client reference code", constraints: "unique across all beneficiaries" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED", constraints: "enum: ACTIVE, SUSPENDED" }
      - { name: total_outstanding_advances_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over all CostAdvance rows with status == APPROVED belonging to cases of this beneficiary" }

  - name: ForeclosureCase
    parent: null
    common_fields: true
    fields:
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id; owning beneficiary" }
      - { name: loan_reference, type: string, source: input, description: "Loan number supplied at referral", constraints: "unique across all cases" }
      - { name: borrower_name, type: string, source: input, description: "Borrower full name" }
      - { name: property_address, type: string, source: input, description: "Subject property street address" }
      - { name: county_code, type: string, source: input, description: "County where the property sits (recording jurisdiction)" }
      - { name: unpaid_principal_balance_cents, type: integer, source: input, description: "UPB at referral, integer cents > 0" }
      - { name: monthly_payment_cents, type: integer, source: input, description: "Scheduled monthly P&I payment, integer cents > 0" }
      - { name: months_in_arrears, type: integer, source: input, description: "Count of full missed monthly payments at referral, >= 1" }
      - { name: late_fee_per_month_cents, type: integer, source: input, description: "Contractual late charge per missed month, integer cents >= 0" }
      - { name: note_rate_pct, type: number, source: input, description: "Annual note interest rate in percent, e.g. 7.2" }
      - { name: last_interest_paid_date, type: datetime, source: input, description: "Date through which interest is paid (YYYY-MM-DD); payoff interest accrues from the day after" }
      - { name: prepayment_penalty_applies, type: boolean, source: input, default: false, description: "Whether payoff quotes include the 2% prepayment penalty" }
      - { name: distribution_method, type: enum, source: input, description: "Surplus waterfall variant", constraints: "enum: STATUTORY_PRIORITY, PRO_RATA; immutable after creation" }
      - { name: lifecycle_status, type: enum, source: system, default: REFERRED, description: "REFERRED | NOD_RECORDED | NOTS_RECORDED | SALE_SCHEDULED | SOLD | DEED_RECORDED | CLOSED | REINSTATED | PAID_OFF | CANCELLED" }
      - { name: hold_status, type: enum, source: computed, default: CLEAR, description: "Posture derived from StayOrder children: BANKRUPTCY_STAY if any ACTIVE stay of type BANKRUPTCY_*; else LITIGATION_HOLD if any ACTIVE stay of type LITIGATION_HOLD; else CLEAR" }
      - { name: reinstatement_deadline_date, type: datetime, source: computed, description: "recording_date of the currently RECORDED NoticeOfDefault + 90 days; null when no RECORDED NOD" }
      - { name: undistributed_surplus_cents, type: integer, source: computed, default: 0, description: "Surplus proceeds not yet paid out: set at auction close, decremented by every non-REVERSED Disbursement of recipient_type CLAIMANT or BORROWER_RESIDUE" }

  - name: NoticeOfDefault
    parent: ForeclosureCase
    common_fields: true
    fields:
      - { name: foreclosure_case_id, type: string, source: system, description: "FK -> ForeclosureCase.id; parent case" }
      - { name: recording_date, type: datetime, source: input, description: "Date the NOD was recorded (YYYY-MM-DD); MUST equal the current logical-clock UTC date" }
      - { name: instrument_number, type: string, source: input, description: "County recorder instrument number" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | RESCINDED", constraints: "enum: RECORDED, RESCINDED" }
      - { name: rescinded_at, type: datetime, source: system, description: "Timestamp of rescission; null while RECORDED" }

  - name: NoticeOfTrusteeSale
    parent: ForeclosureCase
    common_fields: true
    fields:
      - { name: foreclosure_case_id, type: string, source: system, description: "FK -> ForeclosureCase.id; parent case" }
      - { name: recording_date, type: datetime, source: input, description: "Date the NOTS was recorded (YYYY-MM-DD); MUST equal the current logical-clock UTC date" }
      - { name: instrument_number, type: string, source: input, description: "County recorder instrument number" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | PUBLICATION_COMPLETE | SALE_SCHEDULED | CONCLUDED | VOIDED" }
      - { name: postponement_count, type: integer, source: system, default: 0, description: "Number of Postponement events recorded against sales of this NOTS" }
      - { name: first_publication_date, type: datetime, source: computed, description: "run_date of the earliest Publication child; null until first publication" }

  - name: Publication
    parent: NoticeOfTrusteeSale
    common_fields: true
    fields:
      - { name: notice_of_trustee_sale_id, type: string, source: system, description: "FK -> NoticeOfTrusteeSale.id; parent NOTS" }
      - { name: run_date, type: datetime, source: input, description: "Date the advertisement ran (YYYY-MM-DD); <= current logical-clock date" }
      - { name: newspaper_name, type: string, source: input, description: "Newspaper of general circulation" }
      - { name: run_index, type: integer, source: system, description: "1-based sequence number within the parent NOTS, assigned in creation order" }
      - { name: status, type: enum, source: system, default: RUN, description: "RUN | AFFIDAVIT_FILED", constraints: "enum: RUN, AFFIDAVIT_FILED" }
      - { name: affidavit_filed_at, type: datetime, source: system, description: "Timestamp the affidavit of publication was filed; null while RUN" }

  - name: AuctionSale
    parent: null
    common_fields: true
    fields:
      - { name: foreclosure_case_id, type: string, source: system, description: "FK -> ForeclosureCase.id; case being sold" }
      - { name: notice_of_trustee_sale_id, type: string, source: system, description: "FK -> NoticeOfTrusteeSale.id; authorizing NOTS" }
      - { name: venue_name, type: string, source: input, description: "Auction venue identifier (schedule-conflict resource)" }
      - { name: scheduled_sale_start_at, type: datetime, source: input, description: "Scheduled auction start (ISO8601 UTC); sales occupy [start, start+60min)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | CONDUCTED | CLOSED | VOIDED" }
      - { name: opening_bid_cents, type: integer, source: computed, description: "Snapshot of the ACTIVE BiddingInstruction.opening_bid_cents at conduct time; null until CONDUCTED" }
      - { name: winner_type, type: enum, source: computed, description: "THIRD_PARTY | BENEFICIARY; null until CLOSED", constraints: "enum: THIRD_PARTY, BENEFICIARY" }
      - { name: winning_bid_cents, type: integer, source: computed, description: "Winning amount: highest qualifying Bid, else opening_bid_cents (beneficiary credit bid); null until CLOSED" }
      - { name: winning_bidder_registration_id, type: string, source: computed, description: "Winning BidderRegistration id when winner_type == THIRD_PARTY; null otherwise" }
      - { name: total_debt_at_close_cents, type: integer, source: computed, description: "unpaid_principal_balance_cents + accrued interest from last_interest_paid_date to close date; null until CLOSED" }
      - { name: closed_at, type: datetime, source: system, description: "Timestamp of close; null until CLOSED" }

  - name: Postponement
    parent: AuctionSale
    common_fields: false
    fields:
      - { name: auction_sale_id, type: string, source: system, description: "FK -> AuctionSale.id; postponed sale" }
      - { name: prior_sale_start_at, type: datetime, source: system, description: "scheduled_sale_start_at before this postponement" }
      - { name: new_sale_start_at, type: datetime, source: input, description: "New auction start (ISO8601 UTC); must be > prior start and <= prior start + 30 days" }
      - { name: reason, type: enum, source: input, description: "BENEFICIARY_REQUEST | TRUSTEE_DISCRETION | MUTUAL_AGREEMENT | OPERATION_OF_LAW | BANKRUPTCY_STAY" }
      - { name: announced_via, type: enum, source: input, description: "ADVANCE | AT_SALE", constraints: "enum: ADVANCE, AT_SALE" }

  - name: BidderRegistration
    parent: AuctionSale
    common_fields: true
    fields:
      - { name: auction_sale_id, type: string, source: system, description: "FK -> AuctionSale.id; sale the bidder registers for" }
      - { name: bidder_name, type: string, source: input, description: "Third-party bidder legal name" }
      - { name: bidder_email, type: string, source: input, description: "Bidder contact email" }
      - { name: deposit_cents, type: integer, source: input, description: "Cashier's-check deposit tendered, integer cents > 0" }
      - { name: required_deposit_cents, type: integer, source: computed, description: "max(1000000, round_half_up(0.01 * opening_reference)) where opening_reference = ACTIVE BiddingInstruction.opening_bid_cents if one exists, else case.unpaid_principal_balance_cents; computed at review time" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | QUALIFIED | DISQUALIFIED | DEPOSIT_APPLIED | REFUND_PENDING | REFUNDED" }
      - { name: disqualification_reason, type: string, source: system, description: "Reason recorded on disqualify; null otherwise" }

  - name: Bid
    parent: AuctionSale
    common_fields: false
    fields:
      - { name: auction_sale_id, type: string, source: system, description: "FK -> AuctionSale.id; sale bid upon" }
      - { name: bidder_registration_id, type: string, source: input, description: "FK -> BidderRegistration.id; bidding registration (must equal X-User-ID of a ThirdPartyBidder caller)" }
      - { name: amount_cents, type: integer, source: input, description: "Bid amount, integer cents > 0" }
      - { name: placed_at, type: datetime, source: system, description: "Server timestamp at acceptance" }

  - name: BiddingInstruction
    parent: ForeclosureCase
    common_fields: true
    fields:
      - { name: foreclosure_case_id, type: string, source: system, description: "FK -> ForeclosureCase.id; case instructed on" }
      - { name: opening_bid_cents, type: integer, source: input, description: "Beneficiary opening bid, integer cents > 0; must be <= max_bid_cents" }
      - { name: max_bid_cents, type: integer, source: input, description: "Beneficiary maximum authorized bid, integer cents > 0" }
      - { name: strategy, type: enum, source: input, description: "OPENING_ONLY | UP_TO_MAX", constraints: "enum: OPENING_ONLY, UP_TO_MAX" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED | WITHDRAWN | EXECUTED | EXPIRED" }

  - name: Quote
    parent: ForeclosureCase
    common_fields: true
    fields:
      - { name: foreclosure_case_id, type: string, source: system, description: "FK -> ForeclosureCase.id; case quoted" }
      - { name: quote_type, type: enum, source: input, description: "REINSTATEMENT | PAYOFF", constraints: "enum: REINSTATEMENT, PAYOFF" }
      - { name: good_through_date, type: datetime, source: input, description: "Date (YYYY-MM-DD) through which the quoted figures are good; must be >= current clock date" }
      - { name: arrears_cents, type: integer, source: computed, description: "REINSTATEMENT: monthly_payment * months_in_arrears; PAYOFF: 0" }
      - { name: late_fees_cents, type: integer, source: computed, description: "REINSTATEMENT: late_fee_per_month * months_in_arrears; PAYOFF: 0" }
      - { name: costs_cents, type: integer, source: computed, description: "Sum of CostAdvance.amount_cents with status == APPROVED on the case at issuance" }
      - { name: interest_cents, type: integer, source: computed, description: "REINSTATEMENT: per-diem on (arrears+late_fees) from RECORDED NOD recording_date to good_through_date; PAYOFF: per-diem on principal from last_interest_paid_date to good_through_date" }
      - { name: trustee_fee_cents, type: integer, source: computed, description: "REINSTATEMENT: 50000 flat; PAYOFF: 25000 flat" }
      - { name: prepayment_penalty_cents, type: integer, source: computed, description: "PAYOFF and case.prepayment_penalty_applies: round_half_up(2% * principal); else 0" }
      - { name: total_cents, type: integer, source: computed, description: "Sum of the six line items above (each already integer cents; per-line rounding then sum, pinned by calculation quote_amounts)" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | ACCEPTED | SUPERSEDED | EXPIRED | VOIDED" }
      - { name: accepted_at, type: datetime, source: system, description: "Timestamp of acceptance; null until ACCEPTED" }

  - name: CostAdvance
    parent: ForeclosureCase
    common_fields: true
    fields:
      - { name: foreclosure_case_id, type: string, source: system, description: "FK -> ForeclosureCase.id; case advanced against" }
      - { name: category, type: enum, source: input, description: "PUBLICATION | RECORDING | POSTING | LEGAL | PROPERTY_PRESERVATION | OTHER" }
      - { name: amount_cents, type: integer, source: input, description: "Advanced amount, integer cents > 0" }
      - { name: incurred_date, type: datetime, source: input, description: "Date the cost was incurred (YYYY-MM-DD); <= current clock date" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | APPROVED | DENIED | REIMBURSED" }
      - { name: denial_reason, type: string, source: system, description: "Reason recorded on deny; null otherwise" }
      - { name: submitted_by_beneficiary_id, type: string, source: system, description: "Beneficiary id from X-User-ID of the submitting caller" }

  - name: StayOrder
    parent: ForeclosureCase
    common_fields: true
    fields:
      - { name: foreclosure_case_id, type: string, source: system, description: "FK -> ForeclosureCase.id; stayed case" }
      - { name: stay_type, type: enum, source: input, description: "BANKRUPTCY_CHAPTER_7 | BANKRUPTCY_CHAPTER_11 | BANKRUPTCY_CHAPTER_13 | LITIGATION_HOLD" }
      - { name: court_case_number, type: string, source: input, description: "Court docket / bankruptcy case number" }
      - { name: filed_at, type: datetime, source: input, description: "Filing timestamp; must be <= current clock time" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RELEASED", constraints: "enum: ACTIVE, RELEASED" }
      - { name: released_at, type: datetime, source: system, description: "Release timestamp; null while ACTIVE" }
      - { name: release_court_order_reference, type: string, source: system, description: "Court order reference supplied at release; null while ACTIVE" }

  - name: TrusteesDeed
    parent: AuctionSale
    common_fields: true
    fields:
      - { name: auction_sale_id, type: string, source: system, description: "FK -> AuctionSale.id; sale the deed conveys under" }
      - { name: grantee_name, type: string, source: computed, description: "Winning bidder name, or beneficiary name when winner_type == BENEFICIARY" }
      - { name: status, type: enum, source: system, default: DRAFTED, description: "DRAFTED | RECORDED | VOIDED", constraints: "enum: DRAFTED, RECORDED, VOIDED" }
      - { name: recorded_at, type: datetime, source: system, description: "Recording timestamp; null until RECORDED" }

  - name: SurplusClaim
    parent: ForeclosureCase
    common_fields: true
    fields:
      - { name: foreclosure_case_id, type: string, source: system, description: "FK -> ForeclosureCase.id; case with surplus" }
      - { name: claimant_name, type: string, source: input, description: "Claimant legal name" }
      - { name: claimant_type, type: enum, source: input, description: "JUNIOR_LIENHOLDER | BORROWER | JUDGMENT_CREDITOR" }
      - { name: priority_rank, type: integer, source: input, description: "Lien priority tier; 1 is senior-most; lower numbers pay first" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount claimed, integer cents > 0" }
      - { name: filed_date, type: datetime, source: input, description: "Date claim received (YYYY-MM-DD); must equal current clock date and be <= close date + 180 days" }
      - { name: approved_amount_cents, type: integer, source: system, description: "Amount approved at review (<= claimed_amount_cents); null until APPROVED" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "Cumulative amount disbursed to this claim via non-REVERSED Disbursements" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | APPROVED | DENIED | PAID | EXPIRED" }
      - { name: denial_reason, type: string, source: system, description: "Reason recorded on deny; null otherwise" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the CaseManager who filed the claim (segregation-of-duties anchor)" }

  - name: Disbursement
    parent: ForeclosureCase
    common_fields: true
    fields:
      - { name: foreclosure_case_id, type: string, source: system, description: "FK -> ForeclosureCase.id; case disbursed for" }
      - { name: surplus_claim_id, type: string, source: system, description: "FK -> SurplusClaim.id; populated only when recipient_type == CLAIMANT; null otherwise" }
      - { name: recipient_type, type: enum, source: system, description: "TRUSTEE_FEE | BENEFICIARY_COST_REIMBURSEMENT | BENEFICIARY_DEBT_PAYOFF | CLAIMANT | BORROWER_RESIDUE" }
      - { name: amount_cents, type: integer, source: system, description: "Disbursed amount, integer cents > 0" }
      - { name: distribution_run_index, type: integer, source: system, description: "1-based index of the distribute-surplus run that created this row" }
      - { name: status, type: enum, source: system, default: CLEARED, description: "CLEARED | REVERSED", constraints: "enum: CLEARED, REVERSED" }
      - { name: reversal_reason, type: string, source: system, description: "Reason recorded on reverse; null otherwise" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Beneficiary
    initial_state: ACTIVE
    terminal_states: [SUSPENDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/beneficiaries/{id}/suspend"
        actor: TrusteeAdmin
        preconditions: ["beneficiary.status == ACTIVE"]
        side_effects:
          - "blocks subsequent NOD recording on all of the beneficiary's cases (ERR_BENEFICIARY_SUSPENDED)"
          - "increments Beneficiary.version by 1"

  - entity: ForeclosureCase
    initial_state: REFERRED
    terminal_states: [CLOSED, REINSTATED, PAID_OFF, CANCELLED]
    transitions:
      - from: REFERRED
        to: NOD_RECORDED
        trigger: "POST /api/foreclosure-cases/{id}/notices-of-default"
        actor: CaseManager
        preconditions:
          - "case.lifecycle_status == REFERRED"
          - "case.hold_status == CLEAR (no ACTIVE StayOrder)"
          - "beneficiary.status == ACTIVE"
          - "recording_date == current logical-clock UTC date"
        side_effects:
          - "creates NoticeOfDefault(status=RECORDED)"
          - "case.reinstatement_deadline_date := recording_date + 90 days"
          - "increments ForeclosureCase.version by 1"
      - from: NOD_RECORDED
        to: NOTS_RECORDED
        trigger: "POST /api/foreclosure-cases/{id}/notices-of-trustee-sale"
        actor: CaseManager
        preconditions:
          - "case.lifecycle_status == NOD_RECORDED"
          - "case.hold_status == CLEAR"
          - "current clock date >= case.reinstatement_deadline_date (NOD recording + 90 days; exactly on the deadline day is allowed)"
          - "a NoticeOfDefault with status == RECORDED exists on the case"
          - "no NoticeOfTrusteeSale with status IN {RECORDED, PUBLICATION_COMPLETE, SALE_SCHEDULED} exists on the case"
          - "recording_date == current logical-clock UTC date"
        side_effects:
          - "creates NoticeOfTrusteeSale(status=RECORDED)"
          - "increments ForeclosureCase.version by 1"
      - from: NOTS_RECORDED
        to: SALE_SCHEDULED
        trigger: "POST /api/notices-of-trustee-sale/{id}/schedule-sale"
        actor: CaseManager
        preconditions:
          - "case.lifecycle_status == NOTS_RECORDED"
          - "case.hold_status == CLEAR"
          - "nots.status == PUBLICATION_COMPLETE (exactly 3 Publication children, all AFFIDAVIT_FILED)"
          - "scheduled_sale_start_at >= nots.first_publication_date + 20 days"
          - "scheduled_sale_start_at >= nots.recording_date + 14 days"
          - "no other AuctionSale with same venue_name, status IN {SCHEDULED, CONDUCTED}, whose [start, start+60min) half-open interval overlaps the requested one"
        side_effects:
          - "creates AuctionSale(status=SCHEDULED, foreclosure_case_id, notice_of_trustee_sale_id, venue_name, scheduled_sale_start_at)"
          - "nots.status := SALE_SCHEDULED"
          - "increments ForeclosureCase.version by 1"
      - from: SALE_SCHEDULED
        to: SOLD
        trigger: "POST /api/auction-sales/{id}/close"
        actor: Auctioneer
        preconditions:
          - "case.lifecycle_status == SALE_SCHEDULED"
          - "sale.status == CONDUCTED"
          - "case.hold_status == CLEAR"
        side_effects:
          - "sale.status := CLOSED; sets winner_type, winning_bid_cents, winning_bidder_registration_id, total_debt_at_close_cents, closed_at"
          - "parent NoticeOfTrusteeSale.status := CONCLUDED"
          - "ACTIVE BiddingInstruction on the case -> EXECUTED"
          - "winning BidderRegistration QUALIFIED -> DEPOSIT_APPLIED; every other QUALIFIED registration -> REFUND_PENDING"
          - "case.undistributed_surplus_cents := surplus_amount (calculation surplus_and_obligations; 0 when winning_bid <= obligations)"
          - "creates CLEARED Disbursements for proceeds application, in order: TRUSTEE_FEE (trustee_compensation_fee), one BENEFICIARY_COST_REIMBURSEMENT per APPROVED CostAdvance in created_at ASC (advances -> REIMBURSED), BENEFICIARY_DEBT_PAYOFF (min(remaining, total_debt_at_close_cents)); each debits the sale proceeds before surplus is computed"
      - from: SOLD
        to: DEED_RECORDED
        trigger: "POST /api/trustees-deeds/{id}/record"
        actor: CaseManager
        preconditions:
          - "case.lifecycle_status == SOLD"
          - "deed.status == DRAFTED"
          - "current clock datetime <= sale.closed_at + 15 days, unless request carries court_order_extension: true"
        side_effects:
          - "deed.status := RECORDED; recorded_at := now"
          - "increments ForeclosureCase.version by 1"
      - from: DEED_RECORDED
        to: CLOSED
        trigger: "POST /api/foreclosure-cases/{id}/distribute-surplus (final reconciliation pass)"
        actor: CaseManager
        preconditions:
          - "case.lifecycle_status == DEED_RECORDED"
          - "case.undistributed_surplus_cents == 0 after this run"
          - "no SurplusClaim with status IN {FILED, APPROVED} remains on the case"
        side_effects:
          - "increments ForeclosureCase.version by 1"
      - from: SOLD
        to: NOTS_RECORDED
        trigger: "POST /api/auction-sales/{id}/void"
        actor: Auctioneer
        preconditions:
          - "case.lifecycle_status == SOLD"
          - "sale.status IN {CONDUCTED, CLOSED}"
          - "no TrusteesDeed with status == RECORDED exists for the sale"
          - "no Disbursement with recipient_type IN {CLAIMANT, BORROWER_RESIDUE} exists for the case (surplus distribution not started)"
        side_effects:
          - "sale.status := VOIDED"
          - "TrusteesDeed DRAFTED -> VOIDED for the sale"
          - "BidderRegistration DEPOSIT_APPLIED -> REFUND_PENDING"
          - "every CLEARED proceeds-application Disbursement from this sale (TRUSTEE_FEE, BENEFICIARY_COST_REIMBURSEMENT, BENEFICIARY_DEBT_PAYOFF) -> REVERSED (compensation)"
          - "every CostAdvance set REIMBURSED by this sale's close -> APPROVED (compensation)"
          - "case.undistributed_surplus_cents := 0"
          - "parent NoticeOfTrusteeSale.status := PUBLICATION_COMPLETE (publications remain valid; cycle re-entry point)"
          - "increments ForeclosureCase.version by 1"
        note: "Backward edge SALE_SCHEDULED -> SOLD -> NOTS_RECORDED -> SALE_SCHEDULED forms the sale-retry cycle."
      - from: NOD_RECORDED
        to: REINSTATED
        trigger: "POST /api/quotes/{id}/accept with quote_type == REINSTATEMENT"
        actor: CaseManager
        preconditions:
          - "quote.status == ISSUED and quote not past good_through_date"
          - "case.lifecycle_status IN {NOD_RECORDED, NOTS_RECORDED, SALE_SCHEDULED}"
          - "if an AuctionSale in SCHEDULED/CONDUCTED exists: current clock date <= reinstatement cutoff (sale date minus 5 business days, weekend-skip)"
          - "tendered_amount_cents == quote.total_cents"
        side_effects:
          - "RECORDED NoticeOfDefault -> RESCINDED (cascade)"
          - "increments ForeclosureCase.version by 1"
      - from: NOTS_RECORDED
        to: REINSTATED
        trigger: "POST /api/quotes/{id}/accept with quote_type == REINSTATEMENT"
        actor: CaseManager
        preconditions: ["same as NOD_RECORDED -> REINSTATED"]
        side_effects:
          - "RECORDED NoticeOfDefault -> RESCINDED"
          - "NoticeOfTrusteeSale in RECORDED/PUBLICATION_COMPLETE -> VOIDED"
          - "increments ForeclosureCase.version by 1"
      - from: SALE_SCHEDULED
        to: REINSTATED
        trigger: "POST /api/quotes/{id}/accept with quote_type == REINSTATEMENT"
        actor: CaseManager
        preconditions: ["same as NOD_RECORDED -> REINSTATED, including the 5-business-day cutoff against the scheduled sale"]
        side_effects:
          - "RECORDED NoticeOfDefault -> RESCINDED"
          - "NoticeOfTrusteeSale SALE_SCHEDULED -> CONCLUDED"
          - "AuctionSale SCHEDULED -> VOIDED"
          - "every QUALIFIED BidderRegistration -> REFUND_PENDING"
          - "ACTIVE BiddingInstruction -> EXPIRED"
          - "increments ForeclosureCase.version by 1"
      - from: REFERRED
        to: PAID_OFF
        trigger: "POST /api/quotes/{id}/accept with quote_type == PAYOFF"
        actor: CaseManager
        preconditions:
          - "quote.status == ISSUED and not past good_through_date"
          - "case.lifecycle_status IN {REFERRED, NOD_RECORDED, NOTS_RECORDED, SALE_SCHEDULED}"
          - "tendered_amount_cents == quote.total_cents"
        side_effects:
          - "every CostAdvance with status == APPROVED -> REIMBURSED (beneficiary repaid inside payoff)"
          - "every other Quote ISSUED -> VOIDED"
          - "increments ForeclosureCase.version by 1"
      - from: NOD_RECORDED
        to: PAID_OFF
        trigger: "POST /api/quotes/{id}/accept with quote_type == PAYOFF"
        actor: CaseManager
        preconditions: ["same as REFERRED -> PAID_OFF"]
        side_effects:
          - "RECORDED NoticeOfDefault -> RESCINDED"
          - "every CostAdvance APPROVED -> REIMBURSED"
          - "every other Quote ISSUED -> VOIDED"
          - "increments ForeclosureCase.version by 1"
      - from: NOTS_RECORDED
        to: PAID_OFF
        trigger: "POST /api/quotes/{id}/accept with quote_type == PAYOFF"
        actor: CaseManager
        preconditions: ["same as REFERRED -> PAID_OFF"]
        side_effects:
          - "RECORDED NoticeOfDefault -> RESCINDED"
          - "NoticeOfTrusteeSale RECORDED/PUBLICATION_COMPLETE -> VOIDED"
          - "every CostAdvance APPROVED -> REIMBURSED"
          - "every other Quote ISSUED -> VOIDED"
          - "increments ForeclosureCase.version by 1"
      - from: SALE_SCHEDULED
        to: PAID_OFF
        trigger: "POST /api/quotes/{id}/accept with quote_type == PAYOFF"
        actor: CaseManager
        preconditions: ["same as REFERRED -> PAID_OFF"]
        side_effects:
          - "RECORDED NoticeOfDefault -> RESCINDED"
          - "NoticeOfTrusteeSale SALE_SCHEDULED -> CONCLUDED"
          - "AuctionSale SCHEDULED -> VOIDED"
          - "every QUALIFIED BidderRegistration -> REFUND_PENDING"
          - "ACTIVE BiddingInstruction -> EXPIRED"
          - "every CostAdvance APPROVED -> REIMBURSED"
          - "every other Quote ISSUED -> VOIDED"
          - "increments ForeclosureCase.version by 1"
      - from: NOD_RECORDED
        to: CANCELLED
        trigger: "POST /api/notices-of-default/{id}/rescind"
        actor: CaseManager
        preconditions:
          - "nod.status == RECORDED"
          - "case.lifecycle_status IN {NOD_RECORDED, NOTS_RECORDED, SALE_SCHEDULED}"
        side_effects:
          - "nod.status := RESCINDED"
          - "every Quote ISSUED -> VOIDED"
          - "increments ForeclosureCase.version by 1"
      - from: NOTS_RECORDED
        to: CANCELLED
        trigger: "POST /api/notices-of-default/{id}/rescind"
        actor: CaseManager
        preconditions: ["same as NOD_RECORDED -> CANCELLED"]
        side_effects:
          - "nod.status := RESCINDED"
          - "NoticeOfTrusteeSale RECORDED/PUBLICATION_COMPLETE -> VOIDED"
          - "every Quote ISSUED -> VOIDED"
          - "increments ForeclosureCase.version by 1"
      - from: SALE_SCHEDULED
        to: CANCELLED
        trigger: "POST /api/notices-of-default/{id}/rescind"
        actor: CaseManager
        preconditions: ["same as NOD_RECORDED -> CANCELLED"]
        side_effects:
          - "nod.status := RESCINDED"
          - "NoticeOfTrusteeSale SALE_SCHEDULED -> VOIDED"
          - "AuctionSale SCHEDULED -> VOIDED"
          - "every QUALIFIED BidderRegistration -> REFUND_PENDING"
          - "ACTIVE BiddingInstruction -> EXPIRED"
          - "every Quote ISSUED -> VOIDED"
          - "increments ForeclosureCase.version by 1"

  - entity: NoticeOfTrusteeSale
    initial_state: RECORDED
    terminal_states: [CONCLUDED, VOIDED]
    transitions:
      - from: RECORDED
        to: PUBLICATION_COMPLETE
        trigger: "system (bubble-up): third Publication child reaches AFFIDAVIT_FILED"
        actor: system
        preconditions:
          - "exactly 3 Publication children exist, all with status == AFFIDAVIT_FILED, gaps already enforced at creation"
        side_effects:
          - "nots.first_publication_date already set (earliest run_date)"
      - from: PUBLICATION_COMPLETE
        to: SALE_SCHEDULED
        trigger: "POST /api/notices-of-trustee-sale/{id}/schedule-sale"
        actor: CaseManager
        preconditions: ["see ForeclosureCase NOTS_RECORDED -> SALE_SCHEDULED"]
        side_effects:
          - "creates AuctionSale SCHEDULED; case.lifecycle_status := SALE_SCHEDULED"
      - from: SALE_SCHEDULED
        to: CONCLUDED
        trigger: "POST /api/auction-sales/{id}/close"
        actor: Auctioneer
        preconditions: ["see ForeclosureCase SALE_SCHEDULED -> SOLD"]
        side_effects: ["covered by case transition"]
      - from: SALE_SCHEDULED
        to: PUBLICATION_COMPLETE
        trigger: "POST /api/auction-sales/{id}/void (sale rewind cycle)"
        actor: Auctioneer
        preconditions: ["see ForeclosureCase SOLD -> NOTS_RECORDED (void)"]
        side_effects: ["case.lifecycle_status := NOTS_RECORDED; a fresh AuctionSale may be scheduled against this NOTS"]
        note: "Backward edge; with close this forms the PUBLICATION_COMPLETE -> SALE_SCHEDULED -> CONCLUDED|retry cycle."
      - from: RECORDED
        to: VOIDED
        trigger: "POST /api/notices-of-default/{id}/rescind (cascade) or stay auto-postponement overflow (cascade)"
        actor: system
        preconditions: ["parent case cascade only; never a direct endpoint"]
        side_effects:
          - "when triggered by postponement overflow (postponement_count == 3 and another postponement is forced): the SCHEDULED AuctionSale -> VOIDED and case.lifecycle_status SALE_SCHEDULED -> NOD_RECORDED (re-notice required)"
      - from: PUBLICATION_COMPLETE
        to: VOIDED
        trigger: "POST /api/notices-of-default/{id}/rescind (cascade) or reinstatement acceptance (cascade)"
        actor: system
        preconditions: ["parent case cascade only"]
        side_effects: ["case lifecycle already transitioned by the cascade trigger"]
      - from: SALE_SCHEDULED
        to: VOIDED
        trigger: "POST /api/notices-of-default/{id}/rescind (cascade)"
        actor: system
        preconditions: ["parent case cascade only"]
        side_effects: ["AuctionSale SCHEDULED -> VOIDED by the same cascade"]

  - entity: Publication
    initial_state: RUN
    terminal_states: [AFFIDAVIT_FILED]
    transitions:
      - from: RUN
        to: AFFIDAVIT_FILED
        trigger: "POST /api/publications/{id}/file-affidavit"
        actor: CaseManager
        preconditions:
          - "publication.status == RUN"
          - "parent NOTS status IN {RECORDED, PUBLICATION_COMPLETE}"
          - "current clock date >= publication.run_date"
        side_effects:
          - "affidavit_filed_at := now"
          - "if this is the 3rd AFFIDAVIT_FILED child: parent NOTS RECORDED -> PUBLICATION_COMPLETE (bubble-up)"

  - entity: Quote
    initial_state: ISSUED
    terminal_states: [ACCEPTED, SUPERSEDED, EXPIRED, VOIDED]
    transitions:
      - from: ISSUED
        to: ACCEPTED
        trigger: "POST /api/quotes/{id}/accept"
        actor: CaseManager
        preconditions: ["see ForeclosureCase reinstatement/payoff transitions"]
        side_effects: ["accepted_at := now; case lifecycle transition per quote_type"]
      - from: ISSUED
        to: SUPERSEDED
        trigger: "POST /api/foreclosure-cases/{id}/quotes (new quote of the same quote_type)"
        actor: CaseManager
        preconditions: ["new quote creation succeeds"]
        side_effects: ["prior ISSUED quote of same quote_type on the case -> SUPERSEDED"]
      - from: ISSUED
        to: EXPIRED
        trigger: "system (lazy derivation): any read of the quote, or an accept attempt, while clock date > good_through_date surfaces status EXPIRED"
        actor: system
        preconditions: ["current clock date > quote.good_through_date"]
        side_effects:
          - "the value EXPIRED is derived, not stored: an accept attempt on such a quote fails with ERR_QUOTE_EXPIRED (business_temporal), not ERR_INVALID_QUOTE_STATE"
        note: "ERR_INVALID_QUOTE_STATE covers stored-terminal statuses ACCEPTED/SUPERSEDED/VOIDED only."
      - from: ISSUED
        to: VOIDED
        trigger: "cascade: case reaches REINSTATED / PAID_OFF / CANCELLED by another path"
        actor: system
        preconditions: ["parent case terminal transition"]
        side_effects: []

  - entity: AuctionSale
    initial_state: SCHEDULED
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /api/auction-sales/{id}/postponements"
        actor: Auctioneer
        preconditions:
          - "sale.status == SCHEDULED"
          - "parent NOTS.postponement_count < 3 (a 4th postponement is rejected)"
          - "new_sale_start_at > sale.scheduled_sale_start_at and <= sale.scheduled_sale_start_at + 30 days"
          - "no venue overlap at the new start (same half-open [start, start+60min) rule as schedule-sale)"
          - "expected_auction_sale_version == sale.version (OCC)"
        side_effects:
          - "creates Postponement(prior_sale_start_at, new_sale_start_at, reason, announced_via)"
          - "sale.scheduled_sale_start_at := new_sale_start_at"
          - "parent NOTS.postponement_count += 1"
          - "increments AuctionSale.version by 1"
        note: "Self-loop cycle; the 3-postponement cap bounds it."
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "POST /api/auction-sales/{id}/conduct"
        actor: Auctioneer
        preconditions:
          - "sale.status == SCHEDULED"
          - "case.lifecycle_status == SALE_SCHEDULED"
          - "case.hold_status == CLEAR"
          - "current clock UTC date == calendar date of sale.scheduled_sale_start_at"
          - "an ACTIVE BiddingInstruction exists on the case"
        side_effects:
          - "sale.opening_bid_cents := ACTIVE BiddingInstruction.opening_bid_cents (snapshot)"
          - "increments AuctionSale.version by 1"
      - from: CONDUCTED
        to: CLOSED
        trigger: "POST /api/auction-sales/{id}/close"
        actor: Auctioneer
        preconditions: ["see ForeclosureCase SALE_SCHEDULED -> SOLD"]
        side_effects: ["see ForeclosureCase SALE_SCHEDULED -> SOLD (winner selection per calculation winner_determination)"]
      - from: CONDUCTED
        to: VOIDED
        trigger: "POST /api/auction-sales/{id}/void"
        actor: Auctioneer
        preconditions: ["see ForeclosureCase SOLD -> NOTS_RECORDED; CONDUCTED sale may be voided same-day before close"]
        side_effects: ["case.lifecycle_status := NOTS_RECORDED; parent NOTS SALE_SCHEDULED -> PUBLICATION_COMPLETE"]
      - from: SCHEDULED
        to: VOIDED
        trigger: "cascade: reinstatement accept / payoff accept / NOD rescind / stay postponement overflow"
        actor: system
        preconditions: ["parent case cascade only"]
        side_effects: ["QUALIFIED BidderRegistration -> REFUND_PENDING (via case cascade)"]

  - entity: BidderRegistration
    initial_state: PENDING
    terminal_states: [DISQUALIFIED, DEPOSIT_APPLIED, REFUNDED]
    transitions:
      - from: PENDING
        to: QUALIFIED
        trigger: "POST /api/bidder-registrations/{id}/review with decision == QUALIFY"
        actor: Auctioneer
        preconditions:
          - "registration.status == PENDING"
          - "sale.status IN {SCHEDULED, CONDUCTED}"
          - "registration.deposit_cents >= registration.required_deposit_cents (equal is sufficient)"
        side_effects: ["increments BidderRegistration.version by 1"]
      - from: PENDING
        to: DISQUALIFIED
        trigger: "POST /api/bidder-registrations/{id}/review with decision == DISQUALIFY"
        actor: Auctioneer
        preconditions:
          - "registration.status == PENDING"
          - "reason is non-empty"
        side_effects: ["disqualification_reason := reason"]
      - from: QUALIFIED
        to: DISQUALIFIED
        trigger: "POST /api/bidder-registrations/{id}/review with decision == DISQUALIFY"
        actor: Auctioneer
        preconditions:
          - "registration.status == QUALIFIED"
          - "registration has placed no Bid on the sale"
          - "sale.status != CLOSED"
          - "reason is non-empty"
        side_effects: ["disqualification_reason := reason"]
      - from: QUALIFIED
        to: DEPOSIT_APPLIED
        trigger: "system (cascade): sale close designates this registration as winner"
        actor: system
        preconditions: ["winning_bidder_registration_id == this registration"]
        side_effects: []
      - from: QUALIFIED
        to: REFUND_PENDING
        trigger: "system (cascade): sale close with another winner, sale void, or case terminal transition"
        actor: system
        preconditions: ["sale concluded/voided and this registration did not win"]
        side_effects: []
      - from: REFUND_PENDING
        to: REFUNDED
        trigger: "POST /api/bidder-registrations/{id}/refund"
        actor: Auctioneer
        preconditions: ["registration.status == REFUND_PENDING"]
        side_effects: ["deposit released; no other field changes"]

  - entity: BiddingInstruction
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, WITHDRAWN, EXECUTED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /api/foreclosure-cases/{id}/bidding-instructions (new instruction on same case)"
        actor: Beneficiary
        preconditions: ["new instruction creation succeeds (OCC on case version)"]
        side_effects: ["prior ACTIVE instruction on the case -> SUPERSEDED"]
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /api/bidding-instructions/{id}/withdraw"
        actor: Beneficiary
        preconditions:
          - "instruction.status == ACTIVE"
          - "case.lifecycle_status IN {NOTS_RECORDED, SALE_SCHEDULED}"
          - "no AuctionSale of the case in status CONDUCTED"
        side_effects: []
      - from: ACTIVE
        to: EXECUTED
        trigger: "system (cascade): sale close consumes the instruction"
        actor: system
        preconditions: ["sale CLOSED on the instruction's case"]
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (cascade): case reaches REINSTATED / PAID_OFF / CANCELLED"
        actor: system
        preconditions: ["parent case terminal transition"]
        side_effects: []

  - entity: CostAdvance
    initial_state: SUBMITTED
    terminal_states: [DENIED, REIMBURSED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/cost-advances/{id}/review with decision == APPROVE"
        actor: CaseManager
        preconditions: ["advance.status == SUBMITTED", "case.lifecycle_status NOT IN {CLOSED, REINSTATED, PAID_OFF, CANCELLED}"]
        side_effects:
          - "beneficiary.total_outstanding_advances_cents += amount_cents"
          - "increments CostAdvance.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /api/cost-advances/{id}/review with decision == DENY"
        actor: CaseManager
        preconditions: ["advance.status == SUBMITTED", "denial_reason is non-empty"]
        side_effects: ["denial_reason := reason"]
      - from: APPROVED
        to: REIMBURSED
        trigger: "system (cascade): payoff acceptance, or sale close creating the BENEFICIARY_COST_REIMBURSEMENT Disbursement"
        actor: system
        preconditions: ["covering payoff accepted or covering Disbursement created"]
        side_effects: ["beneficiary.total_outstanding_advances_cents -= amount_cents"]
      - from: REIMBURSED
        to: APPROVED
        trigger: "system (cascade): sale void reverses the sale's proceeds-application disbursements"
        actor: system
        preconditions: ["advance was reimbursed by the voided sale's close"]
        side_effects: ["beneficiary.total_outstanding_advances_cents += amount_cents"]

  - entity: SurplusClaim
    initial_state: FILED
    terminal_states: [DENIED, PAID, EXPIRED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /api/surplus-claims/{id}/review with decision == APPROVE"
        actor: CaseManager
        preconditions:
          - "claim.status == FILED"
          - "case.lifecycle_status IN {SOLD, DEED_RECORDED}"
          - "0 < approved_amount_cents <= claim.claimed_amount_cents"
          - "X-User-ID != claim.filed_by_user_id (segregation of duties)"
        side_effects: ["approved_amount_cents := input value"]
      - from: FILED
        to: DENIED
        trigger: "POST /api/surplus-claims/{id}/review with decision == DENY"
        actor: CaseManager
        preconditions:
          - "claim.status == FILED"
          - "X-User-ID != claim.filed_by_user_id (segregation of duties)"
          - "denial_reason is non-empty"
        side_effects: ["denial_reason := reason"]
      - from: APPROVED
        to: PAID
        trigger: "system (cascade): distribution run brings paid_cents to approved_amount_cents"
        actor: system
        preconditions: ["paid_cents == approved_amount_cents after run"]
        side_effects: []
      - from: FILED
        to: EXPIRED
        trigger: "system (lazy derivation): any read of the claim while clock date > claims deadline (sale closed_at + 180 days) surfaces status EXPIRED"
        actor: system
        preconditions: ["claim still FILED past deadline; case has a CLOSED sale"]
        side_effects:
          - "derived, not stored; EXPIRED claims are excluded from the surplus_waterfall input set"

  - entity: Disbursement
    initial_state: CLEARED
    terminal_states: [REVERSED]
    transitions:
      - from: CLEARED
        to: REVERSED
        trigger: "POST /api/disbursements/{id}/reverse"
        actor: TrusteeAdmin
        preconditions:
          - "disbursement.status == CLEARED"
          - "reversal_reason is non-empty"
          - "case.lifecycle_status != CLOSED"
        side_effects:
          - "if recipient_type == CLAIMANT: linked SurplusClaim.paid_cents -= amount_cents; if paid_cents drops below approved_amount_cents, claim PAID -> APPROVED"
          - "if recipient_type IN {CLAIMANT, BORROWER_RESIDUE}: case.undistributed_surplus_cents += amount_cents"
          - "if recipient_type == BENEFICIARY_COST_REIMBURSEMENT: covering CostAdvance stays REIMBURSED (reversal is accounting-only)"
          - "increments Disbursement.version by 1"
        note: "Compensating action for the funds-conservation invariant (calculation funds_conservation)."

  - entity: TrusteesDeed
    initial_state: DRAFTED
    terminal_states: [RECORDED, VOIDED]
    transitions:
      - from: DRAFTED
        to: RECORDED
        trigger: "POST /api/trustees-deeds/{id}/record"
        actor: CaseManager
        preconditions: ["see ForeclosureCase SOLD -> DEED_RECORDED"]
        side_effects: ["case.lifecycle_status := DEED_RECORDED"]
      - from: DRAFTED
        to: VOIDED
        trigger: "system (cascade): sale void"
        actor: system
        preconditions: ["parent sale voided before recording"]
        side_effects: []

  - entity: StayOrder
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /api/stay-orders/{id}/release"
        actor: CaseManager
        preconditions:
          - "stay.status == ACTIVE"
          - "release_court_order_reference is non-empty"
        side_effects:
          - "released_at := now; release_court_order_reference := input"
          - "case.hold_status recomputed (CLEAR when this was the last ACTIVE stay)"
          - "increments ForeclosureCase.version by 1"

# Posture note (compound gating): ForeclosureCase.hold_status is a computed
# posture over StayOrder children and gates every forward lifecycle transition
# (NOD record, NOTS record, schedule-sale, conduct, close) per validations[ERR_ACTIVE_STAY].
# Quotes, bidding instructions, and cost advances remain allowed under hold.

# =============================================================================
# 1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: quote-create-stale-case
    parent_entity: ForeclosureCase
    write_endpoint: "POST /api/foreclosure-cases/{id}/quotes"
    occ_field: "expected_foreclosure_case_version"
    description: |
      Issuing a Quote against a ForeclosureCase whose version has advanced
      since the client last observed it is rejected. A new quote legitimately
      supersedes the prior ISSUED quote of the same type, so a writer holding
      a stale case view must be refused rather than silently superseding a
      quote it never saw.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: bidding-instruction-create-stale-case
    parent_entity: ForeclosureCase
    write_endpoint: "POST /api/foreclosure-cases/{id}/bidding-instructions"
    occ_field: "expected_foreclosure_case_version"
    description: |
      Creating a BiddingInstruction against a ForeclosureCase whose version
      has advanced since the beneficiary last observed it is rejected. A new
      instruction legitimately supersedes the prior ACTIVE one, so a stale
      writer must be refused rather than displacing an instruction it never
      saw.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
  - rule_id: postponement-create-stale-sale
    parent_entity: AuctionSale
    write_endpoint: "POST /api/auction-sales/{id}/postponements"
    occ_field: "expected_auction_sale_version"
    description: |
      Postponing an AuctionSale whose version has advanced since the client
      last observed it is rejected. Successive postponements are legitimate,
      so the only sound rejection basis is the staleness of the client's
      view of the sale (scheduled start, status, version).
    error_id: ERR_STALE_SALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: per_diem_interest
    trigger: "invoked by quote_amounts and total_debt_at_close"
    algorithm: chronological
    formula: |
      per_diem_cents = round_half_up(base_cents * note_rate_pct / 100 / 365)
      interest_cents = per_diem_cents * ((to_date - from_date).days)
      Rounding order is pinned: the per-diem is rounded to integer cents FIRST,
      then multiplied by the day count. Never round after multiplication.
      Day count is a simple calendar difference (from excluded, to included).
    input_set: "base_cents and date range as directed by the calling rule"
    constants:
      DAYS_IN_YEAR: 365
    precision: "integer cents; round_half_up at the per-diem step only"

  - name: quote_amounts
    trigger: "POST /api/foreclosure-cases/{id}/quotes (issuance); stored on Quote line fields"
    algorithm: aggregation
    formula: |
      costs_cents = SUM(CostAdvance.amount_cents WHERE case = this AND status == APPROVED)
      if quote_type == REINSTATEMENT:
        arrears_cents   = monthly_payment_cents * months_in_arrears
        late_fees_cents = late_fee_per_month_cents * months_in_arrears
        interest_cents  = per_diem_interest(arrears_cents + late_fees_cents,
                                            RECORDED_NOD.recording_date, good_through_date)
        trustee_fee_cents = 50000
        prepayment_penalty_cents = 0
      if quote_type == PAYOFF:
        arrears_cents = 0; late_fees_cents = 0
        interest_cents  = per_diem_interest(unpaid_principal_balance_cents,
                                            last_interest_paid_date, good_through_date)
        trustee_fee_cents = 25000
        prepayment_penalty_cents = prepayment_penalty_applies
                                   ? round_half_up(0.02 * unpaid_principal_balance_cents) : 0
      total_cents = arrears_cents + late_fees_cents + costs_cents + interest_cents
                    + trustee_fee_cents + prepayment_penalty_cents
      Evaluation order is pinned: per-line rounding first (all lines integer cents),
      then a single sum. Sum-then-round is FORBIDDEN.
    input_set: "case fields; CostAdvance rows with status == APPROVED only (SUBMITTED/DENIED/REIMBURSED excluded); RECORDED NoticeOfDefault (reinstatement interest anchor)"
    constants:
      REINSTATEMENT_FEE_CENTS: 50000
      PAYOFF_FEE_CENTS: 25000
      PREPAYMENT_PENALTY_PCT: 0.02
    precision: "integer cents, round_half_up per line"
    variants:
      - name: REINSTATEMENT
        when: "borrower cures arrears and continues the loan"
        difference: "sums arrears + late fees + costs + interest on (arrears+late_fees) from NOD recording + 50000 fee; excludes principal and prepayment penalty"
      - name: PAYOFF
        when: "borrower pays the loan in full"
        difference: "full principal + interest on principal from last_interest_paid_date + costs + 25000 fee + optional 2% penalty; excludes arrears/late-fee lines"

  - name: trustee_compensation_fee
    trigger: "POST /api/auction-sales/{id}/close"
    algorithm: threshold
    formula: |
      base_cents = (winner_type == THIRD_PARTY) ? winning_bid_cents : total_debt_at_close_cents
      fee_cents = min(FEE_CAP_CENTS, max(FEE_FLOOR_CENTS, round_half_up(FEE_PCT * base_cents)))
      Inputs: winning_bid_cents, total_debt_at_close_cents, winner_type (3+ inputs,
      conditional branch on winner_type, nested min/max around the proportional fee).
    input_set: "the closing AuctionSale"
    constants:
      FEE_PCT: 0.005
      FEE_FLOOR_CENTS: 75000
      FEE_CAP_CENTS: 475000
    precision: "integer cents, round_half_up on the proportional term"

  - name: surplus_and_obligations
    trigger: "POST /api/auction-sales/{id}/close"
    algorithm: waterfall_allocation
    formula: |
      total_debt_at_close_cents = unpaid_principal_balance_cents
                                  + per_diem_interest(principal, last_interest_paid_date, close_date)
      obligations = trustee_compensation_fee
                    + SUM(CostAdvance.amount_cents WHERE status == APPROVED)
                    + total_debt_at_close_cents
      surplus = max(0, winning_bid_cents - obligations)
      case.undistributed_surplus_cents := surplus
    input_set: "closing sale; case fields; APPROVED CostAdvance rows only"
    constants: {}
    precision: "integer cents"

  - name: minimum_next_bid
    trigger: "POST /api/auction-sales/{id}/bids (validation of amount_cents)"
    algorithm: threshold
    formula: |
      increment(base_cents) = max(MIN_INCREMENT_CENTS, round_half_up(INCREMENT_PCT * base_cents))
      if no Bid exists on the sale: required_min = opening_bid_cents + increment(opening_bid_cents)
      else: required_min = current_high_bid_cents + increment(current_high_bid_cents)
      Acceptance is >= required_min (a bid exactly at required_min is accepted).
    input_set: "bids on the sale in created_at ASC order; sale.opening_bid_cents"
    constants:
      MIN_INCREMENT_CENTS: 50000
      INCREMENT_PCT: 0.005
    precision: "integer cents, round_half_up on the proportional increment"

  - name: required_bidder_deposit
    trigger: "POST /api/bidder-registrations/{id}/review with decision == QUALIFY"
    algorithm: threshold
    formula: |
      opening_reference = ACTIVE BiddingInstruction.opening_bid_cents on the case
                          if one exists, else case.unpaid_principal_balance_cents
      required_deposit_cents = max(DEPOSIT_FLOOR_CENTS,
                                   round_half_up(DEPOSIT_PCT * opening_reference))
      Qualification requires deposit_cents >= required_deposit_cents (equal qualifies).
    input_set: "the registration; ACTIVE BiddingInstruction of the case (status filter explicit); case principal"
    constants:
      DEPOSIT_FLOOR_CENTS: 1000000
      DEPOSIT_PCT: 0.01
    precision: "integer cents, round_half_up"

  - name: winner_determination
    trigger: "POST /api/auction-sales/{id}/close"
    algorithm: aggregation
    formula: |
      candidates = Bid rows on the sale whose BidderRegistration.status == QUALIFIED
                   (registrations disqualified after bidding are excluded)
      if candidates empty -> winner_type = BENEFICIARY, winning_bid_cents = opening_bid_cents
      else winning bid = candidates ordered by amount_cents DESC, tie-break placed_at ASC
           (earlier placed_at wins); NEVER use id for ordering
      winner_type = THIRD_PARTY, winning_bid_cents = winning amount,
      winning_bidder_registration_id = that bid's registration
    input_set: "Bid rows joined to BidderRegistration with status == QUALIFIED at close"
    constants: {}
    precision: "integer cents"

  - name: surplus_waterfall
    trigger: "POST /api/foreclosure-cases/{id}/distribute-surplus"
    algorithm: waterfall_allocation
    formula: |
      eligible = SurplusClaim rows on the case with status == APPROVED and paid_cents < approved_amount_cents
      Process tiers in priority_rank ASC order (1 first). Within a tier:
        variant STATUTORY_PRIORITY: order by created_at ASC (never id);
          pay each min(unpaid, remaining).
        variant PRO_RATA: share_i = floor(remaining_tier_pool * unpaid_i / tier_unpaid_total);
          leftover cents (< tier size) are distributed one cent at a time in
          created_at ASC order until exhausted. The tier pool is the full remaining
          surplus when entering the tier; a tier is either fully satisfied or the
          run ends with the surplus exhausted inside that tier.
      Each payment creates a Disbursement(recipient_type=CLAIMANT, surplus_claim_id),
      increments claim.paid_cents, decrements case.undistributed_surplus_cents.
      Claim -> PAID when paid_cents == approved_amount_cents.
      When no eligible claims remain and undistributed_surplus_cents > 0 AND the
      claims deadline (close + 180 days) has passed OR no non-terminal claims exist:
      create Disbursement(recipient_type=BORROWER_RESIDUE) for the full remainder.
    input_set: "case.undistributed_surplus_cents; SurplusClaim rows status == APPROVED (FILED/DENIED/EXPIRED/fully-PAID excluded)"
    constants:
      CLAIMS_WINDOW_DAYS: 180
    precision: "integer cents; floor on pro-rata shares with deterministic cent remainder"
    variants:
      - name: STATUTORY_PRIORITY
        when: "case.distribution_method == STATUTORY_PRIORITY"
        difference: "within a tier, claims pay in strict created_at ASC filing order; an early large claim can starve later same-tier claims entirely"
      - name: PRO_RATA
        when: "case.distribution_method == PRO_RATA"
        difference: "within a tier, claims split the available pool proportionally to unpaid approved amounts with floor + created_at-ordered cent remainder; identical inputs yield different per-claim payouts than STATUTORY_PRIORITY"

  - name: reinstatement_window_dates
    trigger: "computed at NOD recording (deadline) and evaluated at quote acceptance (cutoff)"
    algorithm: chronological
    formula: |
      reinstatement_deadline_date = NOD.recording_date + 90 days
      reinstatement_cutoff_date   = scheduled sale date minus 5 business days,
                                    walking backward one calendar day at a time and
                                    counting only Mon-Fri (weekends skipped; no
                                    holiday calendar)
      Acceptance is allowed while current clock date <= reinstatement_cutoff_date
      (on the cutoff day itself is allowed). When no AuctionSale in
      SCHEDULED/CONDUCTED exists, no cutoff applies.
    input_set: "RECORDED NOD; the case's SCHEDULED/CONDUCTED AuctionSale if any"
    constants:
      REINSTATEMENT_PERIOD_DAYS: 90
      REINSTATEMENT_CUTOFF_BUSINESS_DAYS: 5
      NOTS_MIN_DAYS_BEFORE_SALE: 14
      FIRST_PUBLICATION_MIN_DAYS_BEFORE_SALE: 20
      PUBLICATION_MIN_GAP_DAYS: 7
      PUBLICATIONS_REQUIRED: 3
      MAX_POSTPONEMENTS_PER_NOTS: 3
      POSTPONEMENT_MAX_DAYS_PER_EVENT: 30
      DEED_RECORDING_DEADLINE_DAYS: 15
      CLAIMS_WINDOW_DAYS: 180
      AUCTION_DURATION_MINUTES: 60
    precision: "date arithmetic in whole days"

  - name: funds_conservation
    trigger: "invariant checked after every distribute-surplus run and every disbursement reversal"
    algorithm: aggregation
    formula: |
      For a CLOSED-sale case:
        SUM(Disbursement.amount_cents WHERE status == CLEARED
            AND recipient_type IN {CLAIMANT, BORROWER_RESIDUE})
        + case.undistributed_surplus_cents
        == surplus computed at close (winning_bid_cents - obligations)
      A disbursement paired with its reversal leaves this quantity unchanged.
    input_set: "Disbursement rows with status == CLEARED only"
    constants: {}
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; role is one of the declared roles", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "Beneficiary caller owns the target case (case.beneficiary_id == X-User-ID)", error_id: ERR_BENEFICIARY_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "Beneficiary-role calls touching a case (GET case, bidding-instructions, cost-advances)" }
  - { priority: 4, category: auth, check: "ThirdPartyBidder caller's X-User-ID equals payload.bidder_registration_id", error_id: ERR_BIDDER_OWNERSHIP_MISMATCH, http_status: 403, applies_to: "POST /api/auction-sales/{id}/bids" }
  - { priority: 5, category: existence, check: "Path ids resolve left-to-right (case, then child resources)", error_id: ERR_RESOURCE_NOT_FOUND, http_status: 404, applies_to: "all id-addressed endpoints" }
  - { priority: 6, category: existence, check: "Request body schema: required fields present, no unknown fields, enums valid, integer cents positive where required, and clock-consistency: NOD/NOTS recording_date and claim filed_date must equal the current logical-clock UTC date; stay filed_at and publication run_date must not be in the future", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all mutating endpoints" }
  - { priority: 7, category: state, check: "Target resource state permits the operation (per-entity machines)", error_id: ERR_INVALID_CASE_STATE, http_status: 409, applies_to: "all case-scoped mutating endpoints: record NOD/NOTS, schedule-sale, close, accept, rescind, distribute, surplus-claims create (requires SOLD|DEED_RECORDED), bidding-instructions create (requires NOTS_RECORDED|SALE_SCHEDULED), quotes create (requires non-terminal), cost-advances create (requires non-terminal), stay-orders create (requires non-terminal)" }
  - { priority: 8, category: state, check: "NOTS state permits the operation", error_id: ERR_INVALID_NOTS_STATE, http_status: 409, applies_to: "publications create, schedule-sale" }
  - { priority: 9, category: state, check: "Sale state permits the operation", error_id: ERR_INVALID_SALE_STATE, http_status: 409, applies_to: "postpone, conduct, close, void, bids, registrations, deed create" }
  - { priority: 10, category: state, check: "Quote status == ISSUED", error_id: ERR_INVALID_QUOTE_STATE, http_status: 409, applies_to: "POST /api/quotes/{id}/accept" }
  - { priority: 11, category: state, check: "BidderRegistration status permits operation", error_id: ERR_INVALID_REGISTRATION_STATE, http_status: 409, applies_to: "bidder review, refund, bids" }
  - { priority: 12, category: state, check: "SurplusClaim status == FILED for review", error_id: ERR_INVALID_CLAIM_STATE, http_status: 409, applies_to: "POST /api/surplus-claims/{id}/review" }
  - { priority: 13, category: state, check: "TrusteesDeed status == DRAFTED for record", error_id: ERR_INVALID_DEED_STATE, http_status: 409, applies_to: "POST /api/trustees-deeds/{id}/record" }
  - { priority: 14, category: state, check: "BiddingInstruction status == ACTIVE for withdraw", error_id: ERR_INVALID_INSTRUCTION_STATE, http_status: 409, applies_to: "POST /api/bidding-instructions/{id}/withdraw" }
  - { priority: 15, category: state, check: "StayOrder status == ACTIVE for release", error_id: ERR_STAY_NOT_ACTIVE, http_status: 409, applies_to: "POST /api/stay-orders/{id}/release" }
  - { priority: 16, category: state, check: "Disbursement status == CLEARED for reverse", error_id: ERR_INVALID_DISBURSEMENT_STATE, http_status: 409, applies_to: "POST /api/disbursements/{id}/reverse" }
  - { priority: 17, category: state, check: "OCC: expected_*_version equals the parent entity's current version", error_id: ERR_STALE_CASE_VERSION, http_status: 412, applies_to: "POST /api/foreclosure-cases/{id}/quotes; POST /api/foreclosure-cases/{id}/bidding-instructions" }
  - { priority: 18, category: state, check: "OCC: expected_auction_sale_version equals sale.version", error_id: ERR_STALE_SALE_VERSION, http_status: 412, applies_to: "POST /api/auction-sales/{id}/postponements" }
  - { priority: 19, category: business_safety, check: "case.hold_status == CLEAR for recording/noticing/sale-side actions (NOD, NOTS, schedule-sale, conduct, close)", error_id: ERR_ACTIVE_STAY, http_status: 409, applies_to: "notices-of-default create, notices-of-trustee-sale create, schedule-sale, conduct, close" }
  - { priority: 20, category: business_safety, check: "Segregation of duties: reviewer X-User-ID != claim.filed_by_user_id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /api/surplus-claims/{id}/review" }
  - { priority: 21, category: business_temporal, check: "NOTS recordable: clock date >= NOD recording_date + 90 days (equal allowed)", error_id: ERR_NOTS_TOO_EARLY, http_status: 422, applies_to: "POST /api/foreclosure-cases/{id}/notices-of-trustee-sale" }
  - { priority: 22, category: business_temporal, check: "Publication run_date >= latest sibling run_date + 7 days (equal allowed) and <= clock date", error_id: ERR_PUBLICATION_GAP_VIOLATION, http_status: 422, applies_to: "POST /api/notices-of-trustee-sale/{id}/publications" }
  - { priority: 23, category: business_constraint, check: "At most 3 Publications per NOTS", error_id: ERR_PUBLICATION_LIMIT, http_status: 422, applies_to: "POST /api/notices-of-trustee-sale/{id}/publications" }
  - { priority: 24, category: business_constraint, check: "schedule-sale requires NOTS PUBLICATION_COMPLETE", error_id: ERR_PUBLICATION_INCOMPLETE, http_status: 422, applies_to: "POST /api/notices-of-trustee-sale/{id}/schedule-sale" }
  - { priority: 25, category: business_temporal, check: "scheduled_sale_start_at >= first_publication_date + 20 days AND >= nots.recording_date + 14 days", error_id: ERR_SALE_DATE_TOO_SOON, http_status: 422, applies_to: "POST /api/notices-of-trustee-sale/{id}/schedule-sale" }
  - { priority: 26, category: business_temporal, check: "Venue conflict: no other sale same venue_name, status IN {SCHEDULED, CONDUCTED}, half-open [start, start+60min) overlap", error_id: ERR_AUCTION_SCHEDULE_CONFLICT, http_status: 409, applies_to: "schedule-sale, postponements" }
  - { priority: 27, category: business_constraint, check: "NOTS.postponement_count < 3 (3rd allowed, 4th rejected)", error_id: ERR_POSTPONEMENT_LIMIT, http_status: 422, applies_to: "POST /api/auction-sales/{id}/postponements" }
  - { priority: 28, category: business_temporal, check: "new_sale_start_at in (current_start, current_start + 30 days]", error_id: ERR_POSTPONEMENT_WINDOW, http_status: 422, applies_to: "POST /api/auction-sales/{id}/postponements" }
  - { priority: 29, category: business_temporal, check: "Quote not expired: clock date <= good_through_date at acceptance", error_id: ERR_QUOTE_EXPIRED, http_status: 422, applies_to: "POST /api/quotes/{id}/accept" }
  - { priority: 30, category: business_temporal, check: "REINSTATEMENT accept: clock date <= reinstatement cutoff when a sale is scheduled", error_id: ERR_REINSTATEMENT_CUTOFF_PASSED, http_status: 422, applies_to: "POST /api/quotes/{id}/accept" }
  - { priority: 31, category: business_fiscal, check: "tendered_amount_cents == quote.total_cents (exact match; short or over both rejected)", error_id: ERR_PAYMENT_SHORTFALL, http_status: 422, applies_to: "POST /api/quotes/{id}/accept" }
  - { priority: 32, category: business_constraint, check: "conduct requires an ACTIVE BiddingInstruction on the case", error_id: ERR_NO_ACTIVE_BIDDING_INSTRUCTION, http_status: 422, applies_to: "POST /api/auction-sales/{id}/conduct" }
  - { priority: 33, category: business_constraint, check: "opening_bid_cents <= max_bid_cents", error_id: ERR_OPENING_BID_EXCEEDS_MAX, http_status: 422, applies_to: "POST /api/foreclosure-cases/{id}/bidding-instructions" }
  - { priority: 34, category: business_fiscal, check: "registration.deposit_cents >= required_deposit_cents for QUALIFY (equal qualifies)", error_id: ERR_DEPOSIT_INSUFFICIENT, http_status: 422, applies_to: "POST /api/bidder-registrations/{id}/review" }
  - { priority: 35, category: business_fiscal, check: "bid amount_cents >= minimum_next_bid (equal accepted); bidder registration QUALIFIED; sale CONDUCTED", error_id: ERR_BID_TOO_LOW, http_status: 422, applies_to: "POST /api/auction-sales/{id}/bids" }
  - { priority: 36, category: business_temporal, check: "claim filed_date <= sale closed_at + 180 days (equal allowed) and == clock date", error_id: ERR_CLAIMS_DEADLINE_PASSED, http_status: 422, applies_to: "POST /api/foreclosure-cases/{id}/surplus-claims" }
  - { priority: 37, category: business_temporal, check: "deed record: clock <= closed_at + 15 days unless court_order_extension == true", error_id: ERR_DEED_RECORDING_LATE, http_status: 422, applies_to: "POST /api/trustees-deeds/{id}/record" }
  - { priority: 38, category: business_fiscal, check: "distribute-surplus requires undistributed_surplus_cents > 0 or pending approved claims or borrower residue work; else nothing to distribute", error_id: ERR_NO_DISTRIBUTABLE_SURPLUS, http_status: 422, applies_to: "POST /api/foreclosure-cases/{id}/distribute-surplus" }
  - { priority: 39, category: business_constraint, check: "sale void blocked when a RECORDED deed exists or any Disbursement from this sale exists", error_id: ERR_SALE_NOT_VOIDABLE, http_status: 409, applies_to: "POST /api/auction-sales/{id}/void" }
  - { priority: 41, category: business_temporal, check: "conduct requires clock UTC date == calendar date of scheduled_sale_start_at", error_id: ERR_SALE_NOT_TODAY, http_status: 422, applies_to: "POST /api/auction-sales/{id}/conduct" }
  - { priority: 42, category: business_constraint, check: "beneficiary.status == ACTIVE for NOD recording", error_id: ERR_BENEFICIARY_SUSPENDED, http_status: 422, applies_to: "POST /api/foreclosure-cases/{id}/notices-of-default" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/api/beneficiaries", description: "Onboard a beneficiary client", roles: [TrusteeAdmin], code: 201, input: [name, reference_code, contact_email], output: Beneficiary, side_effects: ["status := ACTIVE"] }
  - { method: GET, path: "/api/beneficiaries/{id}", description: "Read a beneficiary", roles: [TrusteeAdmin, CaseManager], code: 200, input: [], output: Beneficiary, side_effects: [] }
  - { method: POST, path: "/api/beneficiaries/{id}/suspend", description: "Suspend a beneficiary; its cases cannot record new NODs", roles: [TrusteeAdmin], code: 200, input: [], output: Beneficiary, side_effects: ["status := SUSPENDED"] }
  - { method: POST, path: "/api/foreclosure-cases", description: "Referral intake; creates case in REFERRED", roles: [CaseManager], code: 201, input: [beneficiary_id, loan_reference, borrower_name, property_address, county_code, unpaid_principal_balance_cents, monthly_payment_cents, months_in_arrears, late_fee_per_month_cents, note_rate_pct, last_interest_paid_date, distribution_method, "prepayment_penalty_applies?"], output: ForeclosureCase, side_effects: ["lifecycle_status := REFERRED"] }
  - { method: GET, path: "/api/foreclosure-cases", description: "List cases with filters and pagination", roles: [TrusteeAdmin, CaseManager, Auctioneer], code: 200, input: ["beneficiary_id?", "lifecycle_status?", "limit?", "offset?"], output: "ForeclosureCase[]", side_effects: [] }
  - { method: GET, path: "/api/foreclosure-cases/{id}", description: "Read a case; Beneficiary callers must own it", roles: [TrusteeAdmin, CaseManager, Auctioneer, Beneficiary], code: 200, input: [], output: ForeclosureCase, side_effects: [] }
  - { method: GET, path: "/api/foreclosure-cases/{id}/summary", description: "Computed read: posture, statutory deadlines, aggregates", roles: [TrusteeAdmin, CaseManager, Beneficiary], code: 200, input: [], output: "{ lifecycle_status: string, hold_status: string, active_stay_count: integer, reinstatement_deadline_date: string, reinstatement_cutoff_date: string, claims_deadline_date: string, undistributed_surplus_cents: integer, total_approved_costs_cents: integer }", side_effects: [] }
  - { method: POST, path: "/api/foreclosure-cases/{id}/notices-of-default", description: "Record the Notice of Default (REFERRED -> NOD_RECORDED)", roles: [CaseManager], code: 201, input: [recording_date, instrument_number], output: NoticeOfDefault, side_effects: ["case -> NOD_RECORDED", "reinstatement_deadline_date := recording_date + 90d", "case.version += 1"] }
  - { method: GET, path: "/api/foreclosure-cases/{id}/notices-of-default", description: "List NODs of a case", roles: [TrusteeAdmin, CaseManager, Auctioneer, Beneficiary], code: 200, input: ["limit?", "offset?"], output: "NoticeOfDefault[]", side_effects: [] }
  - { method: POST, path: "/api/notices-of-default/{id}/rescind", description: "Rescind the NOD; cascades case -> CANCELLED", roles: [CaseManager], code: 200, input: [], output: NoticeOfDefault, side_effects: ["case -> CANCELLED", "NOTS -> VOIDED", "SCHEDULED sale -> VOIDED", "QUALIFIED registrations -> REFUND_PENDING", "ACTIVE instructions -> EXPIRED", "ISSUED quotes -> VOIDED"] }
  - { method: POST, path: "/api/foreclosure-cases/{id}/notices-of-trustee-sale", description: "Record the Notice of Trustee's Sale (NOD_RECORDED -> NOTS_RECORDED); blocked before reinstatement deadline", roles: [CaseManager], code: 201, input: [recording_date, instrument_number], output: NoticeOfTrusteeSale, side_effects: ["case -> NOTS_RECORDED", "case.version += 1"] }
  - { method: GET, path: "/api/foreclosure-cases/{id}/notices-of-trustee-sale", description: "List NOTS of a case", roles: [TrusteeAdmin, CaseManager, Auctioneer, Beneficiary], code: 200, input: ["limit?", "offset?"], output: "NoticeOfTrusteeSale[]", side_effects: [] }
  - { method: GET, path: "/api/notices-of-trustee-sale/{id}", description: "Read a NOTS", roles: [TrusteeAdmin, CaseManager, Auctioneer, Beneficiary], code: 200, input: [], output: NoticeOfTrusteeSale, side_effects: [] }
  - { method: POST, path: "/api/notices-of-trustee-sale/{id}/publications", description: "Record a weekly publication run (max 3; >= 7-day gaps)", roles: [CaseManager], code: 201, input: [run_date, newspaper_name], output: Publication, side_effects: ["run_index assigned sequentially", "first_publication_date maintained on NOTS"] }
  - { method: GET, path: "/api/notices-of-trustee-sale/{id}/publications", description: "List publications of a NOTS", roles: [TrusteeAdmin, CaseManager, Auctioneer], code: 200, input: ["limit?", "offset?"], output: "Publication[]", side_effects: [] }
  - { method: POST, path: "/api/publications/{id}/file-affidavit", description: "File affidavit of publication; 3rd affidavit bubbles NOTS to PUBLICATION_COMPLETE", roles: [CaseManager], code: 200, input: [], output: Publication, side_effects: ["status := AFFIDAVIT_FILED", "NOTS bubble-up on 3rd affidavit"] }
  - { method: POST, path: "/api/notices-of-trustee-sale/{id}/schedule-sale", description: "Schedule the auction; creates AuctionSale SCHEDULED (case NOTS_RECORDED -> SALE_SCHEDULED)", roles: [CaseManager], code: 201, input: [venue_name, scheduled_sale_start_at], output: AuctionSale, side_effects: ["creates AuctionSale", "NOTS -> SALE_SCHEDULED", "case.version += 1"] }
  - { method: GET, path: "/api/auction-sales", description: "List auction sales with filters", roles: [TrusteeAdmin, CaseManager, Auctioneer, ThirdPartyBidder], code: 200, input: ["notice_of_trustee_sale_id?", "foreclosure_case_id?", "status?", "limit?", "offset?"], output: "AuctionSale[]", side_effects: [] }
  - { method: GET, path: "/api/auction-sales/{id}", description: "Read an auction sale", roles: [TrusteeAdmin, CaseManager, Auctioneer, ThirdPartyBidder], code: 200, input: [], output: AuctionSale, side_effects: [] }
  - { method: POST, path: "/api/foreclosure-cases/{id}/cost-advances", description: "Beneficiary submits a cost advance (SUBMITTED)", roles: [Beneficiary], code: 201, input: [category, amount_cents, incurred_date], output: CostAdvance, side_effects: ["submitted_by_beneficiary_id := X-User-ID"] }
  - { method: GET, path: "/api/foreclosure-cases/{id}/cost-advances", description: "List cost advances of a case", roles: [TrusteeAdmin, CaseManager, Beneficiary], code: 200, input: ["status?", "limit?", "offset?"], output: "CostAdvance[]", side_effects: [] }
  - { method: POST, path: "/api/cost-advances/{id}/review", description: "Trustee reviews an advance: APPROVE or DENY", roles: [CaseManager], code: 200, input: [decision, "denial_reason?"], output: CostAdvance, side_effects: ["APPROVE: status := APPROVED, beneficiary.total_outstanding_advances_cents += amount", "DENY: status := DENIED"] }
  - { method: POST, path: "/api/foreclosure-cases/{id}/quotes", description: "Issue a reinstatement or payoff quote; supersedes prior ISSUED quote of same type (OCC on case version)", roles: [CaseManager], code: 201, input: [quote_type, good_through_date, expected_foreclosure_case_version], output: Quote, side_effects: ["prior ISSUED same-type quote -> SUPERSEDED", "case.version += 1"] }
  - { method: GET, path: "/api/foreclosure-cases/{id}/quotes", description: "List quotes of a case", roles: [TrusteeAdmin, CaseManager, Beneficiary], code: 200, input: ["quote_type?", "status?", "limit?", "offset?"], output: "Quote[]", side_effects: [] }
  - { method: POST, path: "/api/quotes/{id}/accept", description: "Record borrower tender equal to quote.total_cents; drives case to REINSTATED or PAID_OFF", roles: [CaseManager], code: 200, input: [tendered_amount_cents], output: Quote, side_effects: ["quote -> ACCEPTED", "case lifecycle transition per quote_type with full cascade set"] }
  - { method: POST, path: "/api/foreclosure-cases/{id}/stay-orders", description: "File a bankruptcy/litigation stay; recomputes hold posture and auto-postpones a scheduled sale (overflow voids NOTS)", roles: [CaseManager], code: 201, input: [stay_type, court_case_number, filed_at], output: StayOrder, side_effects: ["case.hold_status recompute", "if a sale is SCHEDULED: auto-postpone it to current scheduled start + 30 days with a system Postponement (reason := BANKRUPTCY_STAY for BANKRUPTCY_* types, OPERATION_OF_LAW for LITIGATION_HOLD; announced_via := ADVANCE; this consumes one postponement against the 3-cap); when postponement_count == 3 already, the sale is instead VOIDED and the NOTS VOIDED (case rewinds SALE_SCHEDULED -> NOD_RECORDED)", "case.version += 1"] }
  - { method: GET, path: "/api/foreclosure-cases/{id}/stay-orders", description: "List stay orders of a case", roles: [TrusteeAdmin, CaseManager, Beneficiary], code: 200, input: ["status?", "limit?", "offset?"], output: "StayOrder[]", side_effects: [] }
  - { method: POST, path: "/api/stay-orders/{id}/release", description: "Release a stay with a court order reference", roles: [CaseManager], code: 200, input: [release_court_order_reference], output: StayOrder, side_effects: ["case.hold_status recompute", "case.version += 1"] }
  - { method: POST, path: "/api/foreclosure-cases/{id}/bidding-instructions", description: "Beneficiary submits bidding instructions; supersedes prior ACTIVE instruction (OCC on case version)", roles: [Beneficiary], code: 201, input: [opening_bid_cents, max_bid_cents, strategy, expected_foreclosure_case_version], output: BiddingInstruction, side_effects: ["prior ACTIVE instruction -> SUPERSEDED", "case.version += 1"] }
  - { method: GET, path: "/api/foreclosure-cases/{id}/bidding-instructions", description: "List bidding instructions of a case", roles: [TrusteeAdmin, CaseManager, Auctioneer, Beneficiary], code: 200, input: ["status?", "limit?", "offset?"], output: "BiddingInstruction[]", side_effects: [] }
  - { method: POST, path: "/api/bidding-instructions/{id}/withdraw", description: "Beneficiary withdraws an ACTIVE instruction", roles: [Beneficiary], code: 200, input: [], output: BiddingInstruction, side_effects: ["status := WITHDRAWN"] }
  - { method: POST, path: "/api/auction-sales/{id}/postponements", description: "Postpone a SCHEDULED sale (self-loop; max 3 per NOTS; <= +30d per event; OCC on sale version)", roles: [Auctioneer], code: 201, input: [new_sale_start_at, reason, announced_via, expected_auction_sale_version], output: Postponement, side_effects: ["sale.scheduled_sale_start_at updated", "NOTS.postponement_count += 1", "sale.version += 1"] }
  - { method: GET, path: "/api/auction-sales/{id}/postponements", description: "List postponements of a sale", roles: [TrusteeAdmin, CaseManager, Auctioneer], code: 200, input: ["limit?", "offset?"], output: "Postponement[]", side_effects: [] }
  - { method: POST, path: "/api/auction-sales/{id}/bidder-registrations", description: "Register a third-party bidder for a sale (PENDING)", roles: [Auctioneer], code: 201, input: [bidder_name, bidder_email, deposit_cents], output: BidderRegistration, side_effects: [] }
  - { method: GET, path: "/api/auction-sales/{id}/bidder-registrations", description: "List registrations of a sale", roles: [TrusteeAdmin, CaseManager, Auctioneer], code: 200, input: ["status?", "limit?", "offset?"], output: "BidderRegistration[]", side_effects: [] }
  - { method: GET, path: "/api/bidder-registrations/{id}", description: "Read a registration (ThirdPartyBidder limited to own id)", roles: [TrusteeAdmin, CaseManager, Auctioneer, ThirdPartyBidder], code: 200, input: [], output: BidderRegistration, side_effects: [] }
  - { method: POST, path: "/api/bidder-registrations/{id}/review", description: "Qualify or disqualify a registration; deposit threshold enforced", roles: [Auctioneer], code: 200, input: [decision, "reason?"], output: BidderRegistration, side_effects: ["required_deposit_cents computed", "QUALIFY: status := QUALIFIED", "DISQUALIFY: status := DISQUALIFIED"] }
  - { method: POST, path: "/api/auction-sales/{id}/bids", description: "Place a bid while sale is CONDUCTED; minimum-increment enforced", roles: [ThirdPartyBidder], code: 201, input: [bidder_registration_id, amount_cents], output: Bid, side_effects: ["Bid appended (immutable)"] }
  - { method: GET, path: "/api/auction-sales/{id}/bids", description: "List bids of a sale in placed_at ASC order", roles: [TrusteeAdmin, CaseManager, Auctioneer, ThirdPartyBidder], code: 200, input: ["limit?", "offset?"], output: "Bid[]", side_effects: [] }
  - { method: GET, path: "/api/bidder-registrations/{id}/bids", description: "List bids placed under a registration", roles: [TrusteeAdmin, CaseManager, Auctioneer, ThirdPartyBidder], code: 200, input: ["limit?", "offset?"], output: "Bid[]", side_effects: [] }
  - { method: POST, path: "/api/auction-sales/{id}/conduct", description: "Open the auction on its scheduled date; snapshots opening bid", roles: [Auctioneer], code: 200, input: [], output: AuctionSale, side_effects: ["status := CONDUCTED", "opening_bid_cents := ACTIVE instruction.opening_bid_cents", "sale.version += 1"] }
  - { method: POST, path: "/api/auction-sales/{id}/close", description: "Close the auction; winner determination, proceeds allocation, case -> SOLD", roles: [Auctioneer], code: 200, input: [], output: AuctionSale, side_effects: ["winner fields set", "NOTS -> CONCLUDED", "case -> SOLD", "undistributed_surplus_cents computed", "registrations settle (DEPOSIT_APPLIED / REFUND_PENDING)", "instruction -> EXECUTED", "case.version += 1"] }
  - { method: POST, path: "/api/auction-sales/{id}/void", description: "Void a conducted/closed sale (rewind cycle to NOTS_RECORDED)", roles: [Auctioneer], code: 200, input: [reason], output: AuctionSale, side_effects: ["sale -> VOIDED", "DRAFTED deed -> VOIDED", "DEPOSIT_APPLIED registration -> REFUND_PENDING", "case -> NOTS_RECORDED", "NOTS -> PUBLICATION_COMPLETE", "case.version += 1"] }
  - { method: POST, path: "/api/auction-sales/{id}/trustees-deeds", description: "Draft the trustee's deed to the winner (sale must be CLOSED)", roles: [CaseManager], code: 201, input: [], output: TrusteesDeed, side_effects: ["grantee_name computed from winner"] }
  - { method: GET, path: "/api/auction-sales/{id}/trustees-deeds", description: "List deeds of a sale (0 or 1 active)", roles: [TrusteeAdmin, CaseManager], code: 200, input: ["limit?", "offset?"], output: "TrusteesDeed[]", side_effects: [] }
  - { method: POST, path: "/api/trustees-deeds/{id}/record", description: "Record the deed within 15 days of close (or with court_order_extension)", roles: [CaseManager], code: 200, input: ["court_order_extension?"], output: TrusteesDeed, side_effects: ["status := RECORDED", "case -> DEED_RECORDED", "case.version += 1"] }
  - { method: POST, path: "/api/foreclosure-cases/{id}/surplus-claims", description: "File a surplus-funds claim (must be within claims window)", roles: [CaseManager], code: 201, input: [claimant_name, claimant_type, priority_rank, claimed_amount_cents, filed_date], output: SurplusClaim, side_effects: ["filed_by_user_id := X-User-ID"] }
  - { method: GET, path: "/api/foreclosure-cases/{id}/surplus-claims", description: "List claims of a case", roles: [TrusteeAdmin, CaseManager, Beneficiary], code: 200, input: ["status?", "limit?", "offset?"], output: "SurplusClaim[]", side_effects: [] }
  - { method: POST, path: "/api/surplus-claims/{id}/review", description: "Approve (with approved_amount_cents) or deny a claim; reviewer must differ from filer", roles: [CaseManager], code: 200, input: [decision, "approved_amount_cents?", "denial_reason?"], output: SurplusClaim, side_effects: ["APPROVE: status := APPROVED", "DENY: status := DENIED"] }
  - { method: POST, path: "/api/foreclosure-cases/{id}/distribute-surplus", description: "Run the surplus waterfall; creates Disbursements; final pass closes the case", roles: [CaseManager], code: 200, input: [], output: "{ run_index: integer, created_disbursement_count: integer, distributed_cents: integer, undistributed_surplus_cents: integer, case_status: string }", side_effects: ["per surplus_waterfall calculation", "case -> CLOSED when fully reconciled", "case.version += 1"] }
  - { method: GET, path: "/api/disbursements", description: "List disbursements with filters", roles: [TrusteeAdmin, CaseManager, Beneficiary], code: 200, input: ["foreclosure_case_id?", "surplus_claim_id?", "recipient_type?", "limit?", "offset?"], output: "Disbursement[]", side_effects: [] }
  - { method: GET, path: "/api/disbursements/{id}", description: "Read a disbursement", roles: [TrusteeAdmin, CaseManager], code: 200, input: [], output: Disbursement, side_effects: [] }
  - { method: POST, path: "/api/disbursements/{id}/reverse", description: "Reverse a CLEARED disbursement (compensating action)", roles: [TrusteeAdmin], code: 200, input: [reversal_reason], output: Disbursement, side_effects: ["status := REVERSED", "claim paid_cents rollback if CLAIMANT", "undistributed_surplus_cents restored if CLAIMANT/BORROWER_RESIDUE"] }
  - { method: POST, path: "/api/bidder-registrations/{id}/refund", description: "Refund a losing/voided bidder's deposit (REFUND_PENDING -> REFUNDED)", roles: [Auctioneer], code: 200, input: [], output: BidderRegistration, side_effects: ["status := REFUNDED"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving logical clock. Sets the server clock. Default at startup, before any call, is exactly 2026-08-01T00:00:00Z (never wall-clock). Advancing the clock fires system sweeps (quote expiry, claim expiry).", roles: [TrusteeAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["no automatic sweeps; quote and claim expiry are derived lazily (see Quote/SurplusClaim EXPIRED transitions)"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_BENEFICIARY_SUSPENDED, http: 422, condition: "NOD recording attempted on a case whose beneficiary is SUSPENDED" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not in the endpoint's roles list" }
  - { id: ERR_BENEFICIARY_OWNERSHIP_MISMATCH, http: 403, condition: "Beneficiary caller does not own the target case" }
  - { id: ERR_BIDDER_OWNERSHIP_MISMATCH, http: 403, condition: "ThirdPartyBidder caller's X-User-ID differs from payload bidder_registration_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Claim reviewer is the same user who filed the claim" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Any path id fails to resolve (checked left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field, invalid enum value, non-positive cents, malformed datetime, or uniqueness violation (loan_reference, reference_code)" }
  - { id: ERR_INVALID_CASE_STATE, http: 409, condition: "Case lifecycle_status does not permit the requested transition" }
  - { id: ERR_INVALID_NOTS_STATE, http: 409, condition: "NOTS status does not permit the requested operation" }
  - { id: ERR_INVALID_SALE_STATE, http: 409, condition: "AuctionSale status does not permit the requested operation" }
  - { id: ERR_INVALID_QUOTE_STATE, http: 409, condition: "Quote status != ISSUED at acceptance" }
  - { id: ERR_INVALID_REGISTRATION_STATE, http: 409, condition: "BidderRegistration status does not permit the operation (incl. bids from non-QUALIFIED registrations)" }
  - { id: ERR_INVALID_CLAIM_STATE, http: 409, condition: "SurplusClaim status != FILED at review" }
  - { id: ERR_INVALID_DEED_STATE, http: 409, condition: "TrusteesDeed status != DRAFTED at record; or deed creation attempted while a non-VOIDED deed already exists for the sale" }
  - { id: ERR_INVALID_INSTRUCTION_STATE, http: 409, condition: "BiddingInstruction status != ACTIVE at withdraw" }
  - { id: ERR_INVALID_DISBURSEMENT_STATE, http: 409, condition: "Disbursement status != CLEARED at reverse" }
  - { id: ERR_STAY_NOT_ACTIVE, http: 409, condition: "StayOrder status != ACTIVE at release" }
  - { id: ERR_ACTIVE_STAY, http: 409, condition: "case.hold_status != CLEAR; sale-side/recording action blocked by an ACTIVE stay" }
  - { id: ERR_SALE_NOT_VOIDABLE, http: 409, condition: "Sale void blocked: a RECORDED deed exists, or surplus distribution (CLAIMANT/BORROWER_RESIDUE disbursement) has started" }
  - { id: ERR_NOTS_TOO_EARLY, http: 422, condition: "Clock date before NOD recording + 90 days" }
  - { id: ERR_PUBLICATION_GAP_VIOLATION, http: 422, condition: "run_date earlier than latest sibling run_date + 7 days, or in the future" }
  - { id: ERR_PUBLICATION_LIMIT, http: 422, condition: "NOTS already has 3 publications" }
  - { id: ERR_PUBLICATION_INCOMPLETE, http: 422, condition: "schedule-sale attempted before PUBLICATION_COMPLETE" }
  - { id: ERR_SALE_DATE_TOO_SOON, http: 422, condition: "Sale start before first publication + 20d or NOTS recording + 14d" }
  - { id: ERR_AUCTION_SCHEDULE_CONFLICT, http: 409, condition: "Venue occupied: half-open [start, start+60min) overlap with another SCHEDULED/CONDUCTED sale at the same venue" }
  - { id: ERR_POSTPONEMENT_LIMIT, http: 422, condition: "NOTS.postponement_count already == 3" }
  - { id: ERR_POSTPONEMENT_WINDOW, http: 422, condition: "new start not within (current start, current start + 30 days]" }
  - { id: ERR_QUOTE_EXPIRED, http: 422, condition: "Clock date past quote.good_through_date at acceptance" }
  - { id: ERR_REINSTATEMENT_CUTOFF_PASSED, http: 422, condition: "Reinstatement tendered after sale date minus 5 business days" }
  - { id: ERR_PAYMENT_SHORTFALL, http: 422, condition: "tendered_amount_cents != quote.total_cents" }
  - { id: ERR_NO_ACTIVE_BIDDING_INSTRUCTION, http: 422, condition: "Conduct attempted with no ACTIVE BiddingInstruction on the case" }
  - { id: ERR_OPENING_BID_EXCEEDS_MAX, http: 422, condition: "opening_bid_cents > max_bid_cents" }
  - { id: ERR_DEPOSIT_INSUFFICIENT, http: 422, condition: "deposit_cents < required_deposit_cents at qualification review" }
  - { id: ERR_BID_TOO_LOW, http: 422, condition: "Bid amount below minimum_next_bid" }
  - { id: ERR_CLAIMS_DEADLINE_PASSED, http: 422, condition: "Claim filed after sale close + 180 days" }
  - { id: ERR_DEED_RECORDING_LATE, http: 422, condition: "Deed record after close + 15 days without court_order_extension" }
  - { id: ERR_SALE_NOT_TODAY, http: 422, condition: "conduct attempted when the clock UTC date differs from the scheduled sale date" }
  - { id: ERR_NO_DISTRIBUTABLE_SURPLUS, http: 422, condition: "Distribution run with zero undistributed surplus and no payable claims or residue work" }
  - { id: ERR_STALE_CASE_VERSION, http: 412, condition: "expected_foreclosure_case_version != case.version (OCC)" }
  - { id: ERR_STALE_SALE_VERSION, http: 412, condition: "expected_auction_sale_version != sale.version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TrusteeAdmin
    description: "Trustee company administrator: client onboarding, logical clock, disbursement reversals"
    identity: opaque
    exclusive_operations: ["POST /api/beneficiaries", "POST /_clock/set_current_utc", "POST /api/disbursements/{id}/reverse"]
    shared_operations: ["read access to cases, sales, lists"]
  - name: CaseManager
    description: "Trustee case manager: intake, noticing, publication, quotes, stays, claims filing/review, deeds, distribution"
    identity: opaque
    exclusive_operations: ["POST /api/foreclosure-cases", "POST /api/foreclosure-cases/{id}/notices-of-default", "POST /api/foreclosure-cases/{id}/notices-of-trustee-sale", "POST /api/notices-of-trustee-sale/{id}/schedule-sale", "POST /api/foreclosure-cases/{id}/quotes", "POST /api/quotes/{id}/accept", "POST /api/foreclosure-cases/{id}/stay-orders", "POST /api/stay-orders/{id}/release", "POST /api/cost-advances/{id}/review", "POST /api/foreclosure-cases/{id}/surplus-claims", "POST /api/surplus-claims/{id}/review", "POST /api/foreclosure-cases/{id}/distribute-surplus", "POST /api/auction-sales/{id}/trustees-deeds", "POST /api/trustees-deeds/{id}/record", "POST /api/notices-of-default/{id}/rescind", "publications + affidavits"]
    shared_operations: ["read access to all resources"]
  - name: Auctioneer
    description: "Licensed auctioneer: postponements, bidder registration/qualification, bid recording oversight, conduct/close/void, deposit refunds"
    identity: opaque
    exclusive_operations: ["POST /api/auction-sales/{id}/postponements", "POST /api/auction-sales/{id}/bidder-registrations", "POST /api/bidder-registrations/{id}/review", "POST /api/auction-sales/{id}/conduct", "POST /api/auction-sales/{id}/close", "POST /api/auction-sales/{id}/void", "POST /api/bidder-registrations/{id}/refund"]
    shared_operations: ["read access to cases, sales, bids"]
  - name: Beneficiary
    description: "Lender/investor owning the case; X-User-ID equals Beneficiary.id"
    identity: "entity_backed:Beneficiary"
    exclusive_operations: ["POST /api/foreclosure-cases/{id}/bidding-instructions", "POST /api/bidding-instructions/{id}/withdraw", "POST /api/foreclosure-cases/{id}/cost-advances"]
    shared_operations: ["read access to owned cases, quotes, claims, disbursements"]
  - name: ThirdPartyBidder
    description: "Qualified auction bidder; X-User-ID equals BidderRegistration.id"
    identity: "entity_backed:BidderRegistration"
    exclusive_operations: ["POST /api/auction-sales/{id}/bids"]
    shared_operations: ["read access to sales, bids, own registration"]
