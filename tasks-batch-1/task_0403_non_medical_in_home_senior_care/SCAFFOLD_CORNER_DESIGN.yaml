              as: Caregiver
              as_user_id: "${cg}"
            - call: "POST /invoices"
              payload: { agency_id: "${ag}", caregiver_id: "${cg}", client_id: "${cl}", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z" }
              as: BillingClerk
              captures: { inv: $.data.id }
            - call: "POST /invoices/${inv}/finalize"
              payload: {}
              as: BillingClerk
              captures: { iv_observed: $.data.version }
            - call: "POST /ltc-claims"
              payload: { client_id: "${cl}", invoice_id: "${inv}", insurer_name: "Ins", policy_number: "P1", covered_pct: 0.50, daily_benefit_max: 500, covered_days: 5, expected_invoice_version: "${iv_observed}" }
              as: BillingClerk
              captures: { claim1: $.data.id }
            - call: "POST /ltc-claims/${claim1}/submit"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /ltc-claims"
              payload: { client_id: "${cl}", invoice_id: "${inv}", insurer_name: "Ins2", policy_number: "P2", covered_pct: 0.60, daily_benefit_max: 500, covered_days: 5, expected_invoice_version: "${iv_observed}" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_INVOICE_VERSION"
            - "HTTP status == 412"

      - name: occ_correct_invoice_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[claim-assign-stale-invoice]", entities.LtcClaim.fields.expected_invoice_version]
        distinguishing_aspect: "Assigning a claim with expected_invoice_version equal to the current Invoice.version (read immediately after finalize) succeeds (201)."
