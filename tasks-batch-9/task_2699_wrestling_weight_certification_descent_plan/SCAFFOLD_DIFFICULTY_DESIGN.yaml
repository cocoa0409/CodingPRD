          assert:
            - "WeighIn.${wi_day0}.allowance_lbs == 4.0 (growth 4.0 + consecutive 0.0) and effective_limit_lbs == 154.0"
            - "WeighIn.${wi_day0}.result == PASS_WITH_ALLOWANCE — exactly on the inclusive bound, not PASS (154.0 > class 150) and not FAIL"
            - "WeighIn.${wi_day0}.below_minimum == false (154.0 >= 147.6)"
            - "WeighIn.${wi_day1}.allowance_lbs == 5.0 (growth 4.0 + consecutive min(1.0, 2.0)) and effective_limit_lbs == 155.0"
            - "WeighIn.${wi_day1}.result == FAIL — 155.1 is 0.1 lb over the limit; a value of 155.0 would have been PASS_WITH_ALLOWANCE"
            - "TournamentEntry.${entry_a}.status == WEIGHED_IN and latest_effective_weight_lbs == 154.0 (the FAIL on the later day never overwrites it)"
            - "Event.${event_id}.weighed_in_count == 1"

