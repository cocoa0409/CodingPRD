              as: Prescriber
              as_user_id: "${dr}"
              captures: { rx: $.data.id }
            - call: "POST /cgm/prescriptions/${rx}/coverage-verifications"
              payload: { payer_id: "${py}" }
              as: CoverageReviewer
              captures: { cv: $.data.id }
            - call: "POST /cgm/coverage-verifications/${cv}/decide"
              payload: { decision: "APPROVED" }
              as: CoverageReviewer
            - call: "POST /cgm/patients/${pt}/sensor-orders"
