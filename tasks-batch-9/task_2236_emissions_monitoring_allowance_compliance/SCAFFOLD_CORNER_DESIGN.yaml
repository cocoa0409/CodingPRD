  # ===========================================================================
  # From Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: layer_occ_daily_calibration_rejects_a_stale_system_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[daily-calibration-append-stale-system]
          - errors[ERR_STALE_MONITORING_SYSTEM_VERSION]
        distinguishing_aspect: "The second calibration replayed with the first call's expected_monitoring_system_version is refused with ERR_STALE_MONITORING_SYSTEM_VERSION and persists nothing, while the same body with the version returned by the first call succeeds."
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "U1 with one SO2 CEM at version 1"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
          trigger:
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
              captures: { cal1_id: $.data.id, cem_v2: $.data.monitoring_system_version_after }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T12:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 364.0 }
              as: QAAnalyst
              captures: { e_stale: $.data.error_id }
            - call: "GET /emissions/daily-calibrations"
              payload: { monitoring_system_id: "${cem_id}" }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v2}", calibration_utc: "2026-04-01T12:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 364.0 }
              as: QAAnalyst
              captures: { cal2_id: $.data.id, cem_v3: $.data.monitoring_system_version_after }
          assert:
            - "trigger 1 returns HTTP 201 with span_error_pct_of_span == 2.00, result == PASSED and monitoring_system_version_after == 2, so ${cem_v2} == 2"
            - "trigger 2 returns HTTP 412 with error_id == ERR_STALE_MONITORING_SYSTEM_VERSION"
            - "trigger 3 returns total_count == 1 — the refused calibration persisted nothing"
            - "MonitoringSystem.${cem_id}.version is still 2 after the refusal, so a stale write does not itself bump the version"
            - "trigger 4 returns HTTP 201 with span_error_pct_of_span == 1.00, result == PASSED and monitoring_system_version_after == 3 — exactly one increment per accepted write"
            - "MonitoringSystem.${cem_id}.cal_status == CAL_CURRENT and last_calibration_utc == 2026-04-01T12:00:00Z"

      - name: layer_occ_operating_hour_rejects_a_stale_report_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[operating-hour-append-stale-report]
          - errors[ERR_STALE_REPORT_VERSION]
        distinguishing_aspect: "The single-hour and bulk append endpoints share one report version counter, so a bulk call carrying the version that the preceding single append consumed is refused with ERR_STALE_REPORT_VERSION."
        test_recipe:
          setup:
            - "logical clock at 2026-04-02T00:00:00Z"
            - "U1 with a CERTIFIED SO2 CEM and an empty DRAFT 2026 Q2 report at version 1"
          setup_api_calls:
            - call: "POST /emissions/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T00:00:00Z" }
              as: RegulatoryReviewer
            - call: "POST /emissions/facilities"
              payload: { name: "Kestrel Generating Station", orispl_code: "7101", state_code: "OH", operator_org: "op_alpha", programs: ["ARP_SO2"], true_up_deadline_utc: "2027-03-01T00:00:00Z" }
              as: RegulatoryReviewer
              captures: { fac_id: $.data.id }
            - call: "POST /emissions/facilities/${fac_id}/units"
              payload: { unit_identifier: "U1", primary_fuel: "COAL", nameplate_capacity_mw: 600, max_rated_heat_input_mmbtu_hr: 6000, control_device: "FGD" }
              as: RegulatoryReviewer
              captures: { unit_id: $.data.id }
            - call: "POST /emissions/units/${unit_id}/monitoring-systems"
              payload: { parameter: "SO2", system_type: "CEM", span_value: 400.0, calibration_error_spec_pct: 2.5 }
              as: QAAnalyst
              captures: { cem_id: $.data.id, cem_v1: $.data.version }
            - call: "POST /emissions/monitoring-systems/${cem_id}/daily-calibrations"
              payload: { expected_monitoring_system_version: "${cem_v1}", calibration_utc: "2026-04-01T00:00:00Z", zero_reference_value: 0.0, zero_measured_value: 0.0, span_reference_value: 360.0, span_measured_value: 368.0 }
              as: QAAnalyst
            - call: "POST /emissions/monitoring-systems/${cem_id}/qa-status"
              payload: { action: "CERTIFY" }
              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
              payload: { year: 2026, quarter: 2 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { q2_id: $.data.id, q2_v1: $.data.version }
          trigger:
            - call: "POST /emissions/units/${unit_id}/operating-hours"
              payload: { expected_quarterly_report_version: "${q2_v1}", hour_begin_utc: "2026-04-01T00:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { h0_id: $.data.id, q2_v2: $.data.quarterly_report_version_after }
            - call: "POST /emissions/units/${unit_id}/operating-hours"
              payload: { expected_quarterly_report_version: "${q2_v1}", hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { e_stale_single: $.data.error_id }
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v1}", hours: [{ hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
              captures: { e_stale_bulk: $.data.error_id }
            - call: "GET /emissions/operating-hours"
              payload: { quarterly_report_id: "${q2_id}" }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
            - call: "POST /emissions/units/${unit_id}/operating-hours/bulk"
              payload: { expected_quarterly_report_version: "${q2_v2}", hours: [{ hour_begin_utc: "2026-04-01T01:00:00Z", op_time_fraction: 1.0, heat_input_method: "CEMS_FLOW_CO2", flow_scfh: 8000000.0, co2_conc_pct: 12.5, so2_conc_ppm: 220.0, nox_rate_lb_mmbtu: 0.180 }] }
              as: EmissionsReportPreparer
              as_user_id: "prep_1"
          assert:
            - "trigger 1 returns HTTP 201 with quarterly_report_version_after == 2, so ${q2_v2} == 2"
            - "trigger 2 returns HTTP 412 with error_id == ERR_STALE_REPORT_VERSION"
            - "trigger 3 returns HTTP 412 with error_id == ERR_STALE_REPORT_VERSION — the bulk endpoint shares the same counter as the single append"
            - "trigger 4 returns total_count == 1, so neither refusal persisted an hour, and QuarterlyReport.${q2_id}.version is still 2"
            - "trigger 5 returns HTTP 201 and QuarterlyReport.${q2_id}.version == 3 with operating_hour_count == 2"

      - name: layer_occ_transaction_proposal_rejects_a_stale_account_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allowance-transaction-create-stale-account]
          - errors[ERR_STALE_ACCOUNT_VERSION]
        excluded_because:
          difficulty_instance: priority_stale_account_version_beats_invalid_vintage_year
          rationale: "That instance settles a first transaction to advance the account version, replays the stale version, asserts ERR_STALE_ACCOUNT_VERSION wins over ERR_VINTAGE_YEAR_INVALID, and then succeeds with the current version."

      - name: layer_cascading_side_effects_reach_every_level
        claim_type: cascading_side_effects
        grounds:
          - state_machines.MonitoringSystem
          - state_machines.AllowanceAccount
        excluded_because:
          difficulty_instance: cascade_out_of_control_calibration_flips_hours_reverts_report_and_withdraws_event
          rationale: "That instance verifies the full four-link chain end to end, and cascade_true_up_shortfall_creates_penalty_flips_posture_and_restricts_dispatch plus cascade_reversing_true_up_surrender_unlocks_account_and_releases_dispatch cover the second chain and its compensation."

      - name: layer_dual_variant_calculation_produces_both_results
        claim_type: dual_variant_calculation
        grounds:
          - calculations.hourly_heat_input_and_mass
          - calculations.relative_accuracy_and_bias
        excluded_because:
          difficulty_instance: dual_variant_heat_input_cems_vs_appendix_d_same_hour_diverges
          rationale: "Both heat-input variants are asserted against literals there, and dual_variant_rata_reference_mean_vs_applicable_standard_flips_verdict does the same for the relative-accuracy denominator."

      - name: layer_bulk_operations_are_transactional
        claim_type: bulk_operations
        grounds:
          - endpoints[POST /emissions/units/{id}/operating-hours/bulk]
        excluded_because:
          difficulty_instance: combinatorial_report_total_so2_rounds_per_hour_before_summing
          rationale: "The all-succeed path with its single trailing recompute is asserted there; the partial-failure and size-bound halves are covered by ep_bulk_hour_append_is_all_or_nothing_and_spends_one_version in the endpoints section of this file."

      - name: layer_rate_threshold_triggers_fire_at_the_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.monitor_data_availability_pct
          - validations[priority=345]
        excluded_because:
          difficulty_instance: boundary_data_availability_exactly_at_floor_validates
          rationale: "That instance validates at exactly 80.0 and fails at 79.9 on the same report, which is the cumulative-threshold boundary claim; the instantaneous permit-limit threshold is covered by calc_rolling_limit_equality_is_in_compliance_not_exceeded here."

      - name: layer_derived_fields_reconcile_after_every_source_change
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Unit.fields.data_availability_pct
          - entities.QuarterlyReport.fields.total_so2_lbs
        excluded_because:
          difficulty_instance: invariant_hour_classification_partition_and_heat_input_survive_flip_and_substitution
          rationale: "The derived availability and report totals are re-asserted after an append, after a cascade reclassification and after a substitution, which covers create / update / source-change reconciliation."

  # ===========================================================================
  # From Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: consistency_every_derived_value_is_present_in_the_writing_response
