              payload: { tract_code: "28049000600", state_code: "MS", poverty_rate_pct: 12.00, mfi_ratio_pct: 95.00, unemployment_ratio: 0.80 }
              as: CertifyingAgency
              captures: { bad_tract_id: $.data.id }
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "MS", poverty_rate_pct: 32.00, mfi_ratio_pct: 55.00, unemployment_ratio: 1.80 }
              as: CertifyingAgency
              captures: { good_tract_id: $.data.id }
          trigger:
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${bad_tract_id}", legal_name: "Suburban Retail LLC", state_code: "MS", naics_code: "441110" }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000700", state_code: "MS", poverty_rate_pct: 16.00, mfi_ratio_pct: 85.00, unemployment_ratio: 1.00, contiguous_lic_tract_id: "${bad_tract_id}" }
              as: CertifyingAgency
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${good_tract_id}", legal_name: "Delta Foods LLC", state_code: "MS", naics_code: "311412" }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
              captures: { qalicb_id: $.data.id }
          assert:
            - "CensusTract.${bad_tract_id}.is_low_income_community == false, qualifies_by_contiguity == false, eligible_for_qlici == false, distress_tier == \"INELIGIBLE\""
            - "The QALICB in the ineligible tract returns HTTP 422 with error_id == \"ERR_TRACT_NOT_LIC_ELIGIBLE\""
            - "SECOND FORM — a new tract naming the INELIGIBLE tract as its contiguous LIC neighbour also returns HTTP 422 with error_id == \"ERR_TRACT_NOT_LIC_ELIGIBLE\", because the neighbour must itself be a low-income community"
            - "SATISFACTION — the QALICB in the SEVERE tract returns 201 with QALICB.${qalicb_id}.eligibility_status == \"PENDING\""
            - "GET /nmtc/census-tracts reports total_count == 2 — the refused contiguous tract was not created"

