            - { call: "POST /farm/labor-shifts", payload: { shift_date: "2026-08-24", role_type: "HARVEST_CREW", start_at: "2026-08-24T07:00:00Z", end_at: "2026-08-24T15:00:00Z", headcount_required: 2, planned_hourly_rate_cents: 2200 }, as: LaborPlanner, captures: { sh: "$.data.id", sh_v_draft: "$.data.version" } }
          trigger:
