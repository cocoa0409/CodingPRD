      - name: loan_read_reconciles_with_its_installment_schedule
        claim_type: computed_read
        grounds:
          - endpoints.GET_/loans/{id}
          - endpoints.GET_/loans/{id}/installments
          - entities.InstallmentLoan.fields.obligation_balance_cents
        distinguishing_aspect: |
          The derived fields on the loan read equal the schedule they summarise:
          obligation_balance_cents 113876 equals the sum of the 24 amount_due_cents values
          (23 x 4745 + 4741), monthly_installment_cents 4745 equals installment 1's amount_due
          but NOT installment 24's 4741, and premium_total_cents 23976 equals 24 x 999 — so a
          schedule generated from a rounded-up monthly figure would fail reconciliation by 4
          cents.
        test_recipe:
          setup:
            - "Handset B loan originated 2026-08-01, no payments."
          setup_api_calls:
            - call: "POST /device-models"
              payload: { sku: "MDL-B", display_name: "Handset B", retail_price_cents: 89900, monthly_protection_premium_cents: 999, trade_in_base_credit_cents: 45000, generation_year: 2026 }
