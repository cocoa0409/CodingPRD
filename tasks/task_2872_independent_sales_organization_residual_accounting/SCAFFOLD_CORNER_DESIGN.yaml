  - section: cross_cutting_complexity_layers
    instances:

      - name: occ_agent_version_guards_advance_funding
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[advance-create-stale-agent]
          - endpoints[POST /agents/{id}/advances].side_effects
        distinguishing_aspect: "The whole point of this rule is that advances legitimately stack, so nothing else blocks the second funding: only the version guard does. The first funding bumps Agent.version through its own side effect, so replaying the same expected_agent_version returns 412 ERR_STALE_AGENT_VERSION with no AgentAdvance row and no change to advance_outstanding_cents. A version bump from an unrelated write (PATCH /agents) invalidates a read just as effectively as one from another advance."
        test_recipe:
          setup: ["One agent with no advances. Each advance is 50000 cents at recoupment_pct 0.20, so the pair stays under both BOOTSTRAP_ADVANCE_CEILING_CENTS 250000 and MAX_TOTAL_RECOUPMENT_PCT 0.50 and no capacity rule can mask the OCC result."]
          setup_api_calls:
            - call: "POST /agents"
              payload: { name: "OCC Agent", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 50000, recoupment_pct: 0.20, first_recoupment_month: "2026-09", last_recoupment_month: "2027-02", funded_on: "2026-08-01", expected_agent_version: "${v1}" }
              as: IsoAdmin
              captures: { adv1: $.data.id }
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 50000, recoupment_pct: 0.20, first_recoupment_month: "2026-09", last_recoupment_month: "2027-02", funded_on: "2026-08-01", expected_agent_version: "${v1}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e1: $.data.error_id }
            - call: "GET /agents/${a1}"
              payload: {}
              as: IsoAdmin
              captures: { v2: $.data.version }
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 50000, recoupment_pct: 0.20, first_recoupment_month: "2026-09", last_recoupment_month: "2027-02", funded_on: "2026-08-02", expected_agent_version: "${v2}" }
              as: IsoAdmin
              captures: { adv2: $.data.id }
            - call: "GET /agents/${a1}"
              payload: {}
              as: IsoAdmin
              captures: { v3: $.data.version }
            - call: "PATCH /agents/${a1}"
              payload: { name: "OCC Agent Renamed" }
              as: IsoAdmin
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 10000, recoupment_pct: 0.05, first_recoupment_month: "2026-09", last_recoupment_month: "2027-02", funded_on: "2026-08-03", expected_agent_version: "${v3}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e2: $.data.error_id }
            - call: "GET /agent-advances"
              payload: { agent_id: "${a1}" }
              as: IsoAdmin
          assert:
            - "the first funding returns 201 with AgentAdvance.${adv1}.state ACTIVE, outstanding_cents 50000, cumulative_recouped_cents 0, months_recouped 0"
            - "${e1} == ERR_STALE_AGENT_VERSION with HTTP 412 — no state precondition blocks a second advance, only the version guard"
            - "${v2} == ${v1} + 1 — the successful funding incremented Agent.version exactly once, and the 412 did NOT increment it"
            - "after the 412: Agent.${a1}.advance_outstanding_cents is still 50000 and GET /agent-advances?agent_id=${a1} returns total_count 1"
            - "the retry with the refreshed ${v2} returns 201 (${adv2}) and Agent.${a1}.advance_outstanding_cents becomes 100000 with version ${v3} == ${v2} + 1"
            - "${e2} == ERR_STALE_AGENT_VERSION — the PATCH bumped the version, so a read taken before it is stale even though no advance was funded in between"
            - "the final GET /agent-advances?agent_id=${a1} returns total_count 2 — exactly the two accepted fundings"

      - name: occ_merchant_version_guards_agent_reassignment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[merchant-reassign-stale-merchant]
          - endpoints[POST /merchants/{id}/reassign-agent].side_effects
        distinguishing_aspect: "A reassignment would happily overwrite an ownership another writer just established, so the guard is the only protection. A PATCH that touches nothing but pricing still bumps Merchant.version and invalidates the read, and the refused reassignment must leave the portfolio counters on BOTH agents untouched — the cascade is all-or-nothing with the 412."
        test_recipe:
          setup: ["Program P1, agents A1 and A2, and merchant M1 owned by A1 and ACTIVE. The version is re-read after the activate so the captured value is fresh."]
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Owner", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A2 Target", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a2: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "GET /merchants/${m1}"
              payload: {}
              as: IsoAdmin
              captures: { mv1: $.data.version }
          trigger:
            - call: "PATCH /merchants/${m1}"
              payload: { per_transaction_fee_cents: 20 }
              as: IsoAdmin
              captures: { mv2: $.data.version }
            - call: "POST /merchants/${m1}/reassign-agent"
              payload: { new_agent_id: "${a2}", expected_merchant_version: "${mv1}" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e1: $.data.error_id }
            - call: "GET /agents/${a1}/portfolio-summary"
              payload: {}
              as: IsoAdmin
            - call: "POST /merchants/${m1}/reassign-agent"
              payload: { new_agent_id: "${a2}", expected_merchant_version: "${mv2}" }
