        grounds:
          - state_machines.EMEnrollment.APPROVED_to_ACTIVE
        excluded_because:
          difficulty_instance: em_activation_cascade_voids_notices_cancels_deployments_depth3
          rationale: "The APPROVED->ACTIVE cascade (mode flip, notice void, deployment cancel with day release) is asserted hop-by-hop by the named §1.8 instance."

      - name: delinquency_cascade_corner
        claim_type: side_effect_execution
        grounds:
          - state_machines.Invoice.ISSUED_to_OVERDUE
        excluded_because:
          difficulty_instance: overdue_invoice_delinquency_cascade_depth4
          rationale: "The OVERDUE->DELINQUENT->SUSPENDED->CANCELLED depth-4 cascade is asserted hop-by-hop by the named §1.8 instance."

      - name: notice_day_release_on_cancel_corner
        claim_type: side_effect_execution
        grounds:
          - state_machines.Deployment.SCHEDULED_to_CANCELLED
        excluded_because:
          difficulty_instance: notice_sea_day_invariant_create_then_cancel
          rationale: "The cancel reconciliation (reserved -= planned, remaining += planned) and the partition invariant are asserted by the named §1.8 compensating-invariant instance."

  # ===========================================================================
  # Section 3 — Calculations (Table 3): correct results, input-set filtering,
  # constants, precision. §1.8 covers: provisional/final divergence, fee
  # variants, per-line rounding order, selection scoring branch, EM threshold
  # boundary, commitment cap boundary, sea-day partition invariant.
  # ===========================================================================
  - section: calculations
    instances:
      - name: selection_sizing_empty_eligible_pool_not_an_error
        claim_type: correct_result
        grounds:
          - calculations.selection_run_sizing
          - entities.SelectionRun.fields.vessels_selected
          - entities.SelectionRun.fields.selection_deficit_sea_days
        distinguishing_aspect: |
          selection_run_sizing pins the empty-pool fallback as NON-error: with
          zero eligible vessels the run completes with vessels_selected == 0,
          vessels_evaluated == 0, and selection_deficit_sea_days ==
          required_observer_sea_days (no notices are created).
        test_recipe:
          setup:
            - "Fishery F ACTIVE; CoveragePlan P (projected 100/0 -> required 30) published; NO vessels exist in F"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-ES", name: "Empty Selection", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
            - call: "POST /observer-program/coverage-plans"
              payload: { fishery_id: "${fish_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", projected_fleet_effort_days: 100, projected_em_effort_days: 0 }
              as: ProgramCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /observer-program/coverage-plans/${plan_id}/publish"
              payload: {}
              as: ProgramCoordinator
              captures: { plan_v: $.data.version }
          trigger:
            - call: "POST /observer-program/coverage-plans/${plan_id}/selection-runs"
              payload: { notice_response_deadline: "2026-09-20T00:00:00Z", expected_coverage_plan_version: "${plan_v}" }
              as: ProgramCoordinator
              captures: { run_id: $.data.id, n_eval: $.data.vessels_evaluated, n_sel: $.data.vessels_selected, deficit: $.data.selection_deficit_sea_days }
          assert:
            - "SelectionRun.${run_id} is created (201) — empty pool is NOT an error"
            - "vessels_evaluated == 0 and vessels_selected == 0"
            - "selection_deficit_sea_days == 30 (== required_observer_sea_days when nothing selected)"
            - "GET /selection-notices?selection_run_id=${run_id} returns an empty array"
            - "CoveragePlan.${plan_id}.status == SELECTION_COMPLETED"

      - name: selection_scoring_excludes_vessels_with_open_notice_on_backfill
        claim_type: input_set_filtering
        grounds:
          - calculations.vessel_selection_scoring
          - state_machines.CoveragePlan.SELECTION_COMPLETED_to_SELECTION_COMPLETED
        distinguishing_aspect: |
          The eligibility filter excludes vessels holding an ISSUED|ACCEPTED
          notice under the same plan: on a backfill run (SELECTION_COMPLETED ->
          SELECTION_COMPLETED) the already-noticed vessel is NOT re-scored, so a
          second run over the same two-vessel pool selects only the previously
          unnoticed vessel.
        test_recipe:
          setup:
            - "Fishery F; operator OP; vessels V1 (score 100.0000: TRAWL priority gear, null recency) and V2 (score 80.0000: LONGLINE); plan P projected 1000/0 -> required 300 -> vessels_to_select 10 but pool only 2"
            - "Run 1 executed: N1 (V1, rank 1) and N2 (V2, rank 2) created; N1 ACCEPTED by OP, N2 left ISSUED"
            - "V3 registered and activated AFTER run 1 (TRAWL, null recency -> score 100.0000)"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-BF", name: "Backfill Fishery", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
            - call: "POST /observer-program/vessel-operators"
              payload: { legal_name: "Bf Ops LLC", license_number: "LIC-BF-1", contact_person_ref: "person-bf-op" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Bf1", permit_number: "PERMIT-BF-1", home_port: "Kodiak", length_ft: 55, gear_type: "TRAWL" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Bf2", permit_number: "PERMIT-BF-2", home_port: "Kodiak", length_ft: 55, gear_type: "LONGLINE" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { v2_id: $.data.id }
            - call: "PATCH /observer-program/vessels/${v1_id}"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
            - call: "PATCH /observer-program/vessels/${v2_id}"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
            - call: "POST /observer-program/coverage-plans"
              payload: { fishery_id: "${fish_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", projected_fleet_effort_days: 1000, projected_em_effort_days: 0 }
              as: ProgramCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /observer-program/coverage-plans/${plan_id}/publish"
              payload: {}
              as: ProgramCoordinator
              captures: { plan_v: $.data.version }
            - call: "POST /observer-program/coverage-plans/${plan_id}/selection-runs"
              payload: { notice_response_deadline: "2026-09-05T00:00:00Z", expected_coverage_plan_version: "${plan_v}" }
              as: ProgramCoordinator
              captures: { run1_id: $.data.id }
            - call: "GET /observer-program/selection-notices"
              payload: { selection_run_id: "${run1_id}", vessel_id: "${v1_id}" }
              as: ProgramCoordinator
              captures: { n1_id: "$.data[0].id" }
            - call: "POST /observer-program/selection-notices/${n1_id}/accept"
              payload: {}
              as: VesselOperator
              as_user_id: "${op_id}"
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Bf3", permit_number: "PERMIT-BF-3", home_port: "Kodiak", length_ft: 55, gear_type: "TRAWL" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { v3_id: $.data.id }
            - call: "PATCH /observer-program/vessels/${v3_id}"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
            - call: "GET /observer-program/coverage-plans/${plan_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { plan_v3: $.data.version }
          trigger:
            - call: "POST /observer-program/coverage-plans/${plan_id}/selection-runs"
              payload: { notice_response_deadline: "2026-09-25T00:00:00Z", expected_coverage_plan_version: "${plan_v3}" }
              as: ProgramCoordinator
              captures: { run2_id: $.data.id, r2_eval: $.data.vessels_evaluated, r2_sel: $.data.vessels_selected }
            - call: "GET /observer-program/selection-notices"
              payload: { selection_run_id: "${run2_id}" }
              as: ProgramCoordinator
              captures: { r2_notices: $.data }
          assert:
            - "Run 2 vessels_evaluated == 1 (only V3 eligible; V1 holds ACCEPTED N1 and V2 holds ISSUED N2 under this plan)"
            - "Run 2 vessels_selected == 1 and the sole new notice has vessel_id == ${v3_id}"
            - "SelectionRun.${run2_id}.run_index == 2 (1-based ordering by created_at ASC)"
            - "CoveragePlan.${plan_id}.status remains SELECTION_COMPLETED (self-loop transition)"

      - name: sea_day_accounting_return_reconciliation_split
        claim_type: correct_result
        grounds:
          - calculations.sea_day_accounting
          - entities.Deployment.fields.planned_sea_days
          - entities.Deployment.fields.actual_sea_days
        distinguishing_aspect: |
          Inclusive day counts and the return reconciliation split: a deployment
          scheduled 2026-09-10..2026-09-19 has planned_sea_days == 10; returning
          early on 2026-09-14 yields actual_sea_days == 5 and the notice moves
          reserved 10 -> 0, consumed 0 -> 5, remaining 20 -> 25 (remaining +=
          planned - actual == +5).
        test_recipe:
          setup:
            - "Notice N accepted (30 allocated); deployment D 2026-09-10..2026-09-19 boarded (AT_SEA)"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-SD", name: "Sea Day Fishery", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
            - call: "POST /observer-program/vessel-operators"
              payload: { legal_name: "Sd Ops LLC", license_number: "LIC-SD-1", contact_person_ref: "person-sd-op" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /observer-program/observers"
