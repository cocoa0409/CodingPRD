            - call: "POST /studio/samples"
              payload: { barcode: "SMP-1001", vendor_id: "${v_id}", declared_style_number: "TOP1002" }
              as: SampleCoordinator
            - call: "POST /studio/styles"
              payload: { style_number: "TOP1001", category: "APPAREL_TOP", vendor_id: "${v_id}", asset_profile_id: "${ap_id}" }
              as: StudioAdmin
          assert:
            - "first call: status == 409 and error_id == \"ERR_DUPLICATE_CODE\""
            - "second call: status == 409 and error_id == \"ERR_DUPLICATE_CODE\""
            - "third call: status == 409 and error_id == \"ERR_DUPLICATE_CODE\""
            - "fourth call: status == 409 and error_id == \"ERR_DUPLICATE_STYLE_NUMBER\""
            - "GET /studio/styles?limit=10&offset=0 still returns total_count == 1"

      - name: duplicate_shot_item_triple_is_refused_until_the_first_one_is_waived
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DUPLICATE_SHOT_ITEM]
          - validations[priority=36]
        distinguishing_aspect: "(style, ON_MODEL, FRONT) collides while the original is PLANNED, but the uniqueness scope excludes WAIVED rows, so the identical triple is accepted once the original has been waived."
        test_recipe:
          setup:
            - "Style TOP1001 owns one PLANNED required ON_MODEL/FRONT item."
          setup_api_calls:
            - call: "POST /studio/_clock/set_current_utc"
