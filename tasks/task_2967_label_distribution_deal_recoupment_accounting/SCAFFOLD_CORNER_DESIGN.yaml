      - name: physical_run_fiscal_breaches_are_each_triggerable
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVENTORY_OBLIGATION_BREACH
          - errors.ERR_RETURNS_EXCEED_SHIPPED
          - errors.ERR_LIQUIDATION_EXCEEDS_RESERVE
          - calculations[returns_reserve_obligation]
        distinguishing_aspect: |
          All three priority-12 fiscal rules on the physical axis are exercised on ONE run, each
          immediately followed by the legal version of the same call so that no rule can be satisfied
          by simply refusing everything. The inventory obligation is a ceil, not a round: 1020
          manufactured minus 1000 shipped leaves 20 against a required ceil(1000 * 0.0500) == 50.
          The liquidation ceiling is measured against reserve_held_cents (which the recorded returns
          have just RAISED), not against the original reserve, and a liquidation that lands exactly on
          the remaining held amount is accepted.
        test_recipe:
          setup:
            - "one Distributor with default_returns_reserve_pct 0.2000, one EXECUTED deal, one RELEASED vinyl release and one PLANNED run of 1020 units at 250 cents"
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Harbourside Physical", legal_entity: "Harbourside Physical Ltd", default_returns_reserve_pct: 0.2000 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { dist_id: $.data.id }
            - call: "POST /artists"
              payload: { legal_name: "Nadia Frost", email: "nadia@example.com" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { artist_id: $.data.id }
            - call: "POST /distribution-deals"
              payload: { distributor_id: "${dist_id}", deal_type: "DISTRIBUTION_FEE", distribution_fee_pct: 0.1500, term_start_date: "2026-01-01", term_end_date: "2026-12-31", territory_codes: ["US"], cross_collateralized: true, advance_amount_cents: 0, marketing_budget_cents: 0, objection_window_days: 30, post_term_collection_days: 90 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { deal_id: $.data.id }
            - call: "POST /releases"
              payload: { deal_id: "${deal_id}", primary_artist_id: "${artist_id}", upc: "099000000255", title: "Warehouse", planned_release_date: "2026-02-01", formats: ["VINYL"], advance_share_cents: 0 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { rel1_id: $.data.id }
            - call: "POST /distribution-deals/${deal_id}/execute"
              payload: { advance_payment_reference: "WIRE-X5-0001" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /releases/${rel1_id}/release"
              payload: { actual_release_date: "2026-02-01" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
            - call: "POST /physical-runs"
              payload: { release_id: "${rel1_id}", distributor_id: "${dist_id}", units_planned: 1020, unit_manufacturing_cost_cents: 250, window_start: "2026-04-01", window_end: "2026-06-30" }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { run_id: $.data.id }
            - call: "POST /physical-runs/${run_id}/manufacture"
              payload: { units_manufactured: 1020 }
              as: LabelAdmin
              as_user_id: "label-admin-01"
              captures: { run_cost: $.data.manufacturing_cost_cents }
          trigger:
            - call: "POST /physical-runs/${run_id}/ship"
              payload: { units_shipped: 1000, wholesale_unit_price_cents: 900 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { e_inventory: $.data.error_id }
            - call: "POST /physical-runs/${run_id}/ship"
              payload: { units_shipped: 900, wholesale_unit_price_cents: 900 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { run_reserve1: $.data.reserve_initial_cents, run_net1: $.data.physical_net_receipts_cents, run_pct1: $.data.effective_reserve_pct }
            - call: "POST /physical-runs/${run_id}/record-returns"
              payload: { returned_units: 901 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { e_returns: $.data.error_id }
            - call: "POST /physical-runs/${run_id}/record-returns"
              payload: { returned_units: 90 }
              as: DistributionPartner
              as_user_id: "${dist_id}"
              captures: { run_pct2: $.data.effective_reserve_pct, run_reserve2: $.data.reserve_initial_cents, run_held2: $.data.reserve_held_cents, run_net2: $.data.physical_net_receipts_cents, run_v2: $.data.version }
            - call: "POST /physical-runs/${run_id}/liquidate-reserve"
              payload: { expected_run_version: "${run_v2}", liquidation_pct: 0.6000 }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { run_held3: $.data.reserve_held_cents, run_liq3: $.data.reserve_liquidated_cents, run_rstatus3: $.data.reserve_status, run_v3: $.data.version }
            - call: "POST /physical-runs/${run_id}/liquidate-reserve"
              payload: { expected_run_version: "${run_v3}", liquidation_pct: 0.6000 }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { e_liquidation: $.data.error_id }
            - call: "POST /physical-runs/${run_id}/liquidate-reserve"
              payload: { expected_run_version: "${run_v3}", liquidation_pct: 0.4000 }
              as: RoyaltyAnalyst
              as_user_id: "analyst-01"
              captures: { run_held4: $.data.reserve_held_cents, run_liq4: $.data.reserve_liquidated_cents, run_rstatus4: $.data.reserve_status, run_status4: $.data.status }
          assert:
            - "${run_cost} == 255000 == 1020 * 250"
            - "${e_inventory} == \"ERR_INVENTORY_OBLIGATION_BREACH\" with HTTP 422: 1020 - 1000 == 20 is below ceil(1000 * 0.0500) == 50, and the run is still MANUFACTURED with units_shipped null"
            - "the 900-unit ship succeeds: 1020 - 900 == 120 >= ceil(900 * 0.0500) == 45; ${run_pct1} == 0.2000 (the distributor fallback, zero returns), ${run_reserve1} == 162000 == round_half_up(810000 * 0.2000) and ${run_net1} == 555000 == 810000 - 255000"
            - "${e_returns} == \"ERR_RETURNS_EXCEED_SHIPPED\" with HTTP 422 for 901 returns against 900 shipped, and units_returned is still 0"
            - "the 90-unit return gives returns_rate exactly 0.1000 -> tier 1, so ${run_pct2} == 0.2500, ${run_reserve2} == 202500 == round_half_up(810000 * 0.2500), ${run_held2} == 202500 and ${run_net2} == 474000 == (900 - 90) * 900 - 255000"
            - "the first liquidation of 0.6000 moves round_half_up(202500 * 0.6000) == 121500: ${run_held3} == 81000, ${run_liq3} == 121500 and ${run_rstatus3} == \"PARTIALLY_LIQUIDATED\""
            - "${e_liquidation} == \"ERR_LIQUIDATION_EXCEEDS_RESERVE\" with HTTP 422 for a second 0.6000: 121500 > reserve_held_cents 81000, and the OCC version supplied is current so this is not a 412"
            - "the 0.4000 liquidation is accepted at exactly the remaining held amount (round_half_up(202500 * 0.4000) == 81000 == 81000): ${run_held4} == 0, ${run_liq4} == 202500 == reserve_initial_cents, ${run_rstatus4} == \"LIQUIDATED\" and ${run_status4} == \"RECONCILED\""

      - name: audit_window_expires_365_days_after_finalization
        claim_type: error_triggerable
        grounds:
          - errors.ERR_AUDIT_WINDOW_EXPIRED
          - state_machines[ArtistStatement.audit_status].transitions[NONE->AUDIT_REQUESTED]
          - validations[priority 10 ERR_AUDIT_WINDOW_EXPIRED]
        distinguishing_aspect: |
          The audit right is measured from finalized_at and NOT from issued_at or period_end, and the
          365-day edge is inclusive. The clock is pushed one day past the edge (rejected) and then set
          back to the edge itself (accepted), which pins both the anchor field and the comparison
          direction with the same statement. An implementation anchored on issued_at accepts the first
          call, because issued_at is a month earlier than finalized_at here.
        test_recipe:
