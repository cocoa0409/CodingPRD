              as: HRBusinessPartner
              as_user_id: "hr-1"
              captures: { f2_err: $.data.error_id }
          assert:
            - "Finding.${f1}.substantiation_score_final == 0.70 exactly and status == CALIBRATED (>= boundary is inclusive)"
            - "Finding.${f2} calibrate with final score 0.65 fails with ERR_THRESHOLD_NOT_MET and stays DRAFT"

      - name: remediation_overdue_strict_greater_than
        grounds:
          - calculations.remediation_overdue_flag
          - entities.RemediationAction.fields.is_overdue
        distinguishing_aspect: |
          Boundary on a TIME metric via the remediation read endpoint (different
