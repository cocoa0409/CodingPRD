            - "trigger call 2 finds the minted draw in the very next call with total_count == 1, contingency_type == CONSTRUCTION, status == REQUESTED, amount == 30000.00 and requires_owner_approval == false (30000.00 > 50000.00 is false, the posture is OPEN and the origin is not SUBCONTRACTOR_DEFAULT_PREMIUM)"
            - "trigger call 3 returns 200 with the draw at status == POSTED and posted_at == 2026-08-01T00:00:00Z"
            - "trigger call 4, an independent read by a different role, agrees exactly with the state the post call reported: construction_contingency_remaining == 10000.00 (40000.00 - 30000.00), contingency_drawn_to_cost_total == 30000.00, and contingency_posture == OPEN because round(10000.00 / 40000.00, 4) == 0.2500 > 0.10"
            - "gmp_amount is still 1245897.60: 1000000.00 + 100000.00 + 11440.00 + 44457.60 + 50000.00 + 10000.00 + 30000.00, so the draw moved money between terms without moving the guaranteed maximum price"
