              as: HousingAgencyInspector
              captures: { insp_b: $.data.id }
            - call: "POST /inspections/${insp_a}/draw-sample"
              payload: { drawn_at: "2026-08-02T00:00:00.000Z" }
              as: HousingAgencyInspector
            - call: "POST /inspections/${insp_b}/draw-sample"
              payload: { drawn_at: "2026-08-02T00:10:00.000Z" }
              as: HousingAgencyInspector
            - call: "GET /sample-selections?inspection_id=${insp_a}&unit_id=${u1_id}"
              payload: {}
              as: HousingAgencyInspector
              captures: { sel_a: "$.data[0].id" }
            - call: "GET /sample-selections?inspection_id=${insp_b}&unit_id=${u1_id}"
              payload: {}
