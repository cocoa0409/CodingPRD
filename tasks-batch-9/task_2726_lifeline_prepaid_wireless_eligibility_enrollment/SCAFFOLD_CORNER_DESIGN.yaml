      - name: single_device_rule_fires_only_while_a_prior_handset_is_outstanding
        claim_type: conditional_validation
        grounds:
          - validations[priority=78]
          - calculations.device_issuance_freeze_window
          - errors[ERR_SINGLE_DEVICE_PER_SUBSCRIBER]
        distinguishing_aspect: |
          The rule is conditioned on the SUBSCRIBER's outstanding hardware rather than on the
          enrollment being issued to: the re-enrolled subscriber's fresh enrollment has
          last_device_issued_at null (so the 395-day freeze cannot apply) and device_status
          AWAITING_DEVICE (so priority 56 cannot apply), yet issuance is still refused
          because the FIRST enrollment's handset is still RECLAIM_PENDING. Returning that
          handset - the only state change - makes the identical request succeed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one ACTIVE carrier licensed in TX with cap 50 and two BASIC devices D1 and D2."
            - "Subscriber S1 enrolls (E1) at a clean dwelling and is issued D1."
            - "At 2026-09-01T00:00:00Z E1 is de-enrolled, which cascades D1 to RECLAIM_PENDING; the handset is deliberately NOT returned."
            - "At 2026-09-02T00:00:00Z S1 re-applies, is confirmed again and enrolls as E2 at the same dwelling (the slot was released when E1 closed)."
