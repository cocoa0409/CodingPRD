      - name: stale_run_version_rejects_the_second_liquidation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reserve-liquidation-stale-run]
          - endpoints[POST /physical-runs/{id}/liquidate-reserve]
          - validations[priority 7]
        distinguishing_aspect: |
          The reserve rules are OCC-guarded on a DIFFERENT parent (PhysicalRun) with a different
          error id, so an implementation that wires ERR_STALE_DEAL_VERSION into every 412 fails
          here. Partial liquidation is repeatable by design, so the replayed version is the only
