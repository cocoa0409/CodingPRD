  # =====================================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_repair_overlap_closed_buffer_thirty_versus_thirty_one_days
        grounds:
          - validations.priority_62.ERR_OVERLAPPING_REPAIR_CLAIM
          - entities.LaborOperation.fields.overlap_group
          - calculations.claim_edit_engine
          - entities.ClaimEdit.fields.edit_code
        distinguishing_aspect: |
          The contended resource is a (Vehicle, overlap_group) pair over a CLOSED +/- 30-day window,
          so a gap of exactly OVERLAP_BUFFER_DAYS collides and a gap of 31 days does not - and the
          31-day claim is not merely accepted, it is accepted WITH a REPEAT_REPAIR warn edit because
          the 180-day repeat window still contains it. One day of separation therefore moves the
          request from 409 to 201-plus-warning rather than from 409 to a clean 201, which a
          half-open or strictly-less-than comparison cannot reproduce.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z; CA profile; dealer D_OV at rate 10000 / markup 0.25."
            - "One vehicle VEH_OV and labor op OV-300 in overlap_group SUSP (BASIC, requires_causal_part false, standard 2.0 h)."
            - "An anchor claim CL_OV0 at repair_date 2026-04-10, left in SUBMITTED so it counts as an active occupant of the window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D-OV", name: "Overlap Dealer", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 10000, initial_parts_markup_pct: 0.25 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { dov_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VINO0000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { vehov_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "OV-300", description: "Suspension noise diagnosis", standard_time_hours: 2.0, max_time_hours: 2.5, category: "BASIC", requires_causal_part: false, overlap_group: "SUSP" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_ov_id: $.data.id }
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${dov_id}", vehicle_id: "${vehov_id}", labor_operation_id: "${lo_ov_id}", repair_order_number: "RO-OV-0", repair_date: "2026-04-10", odometer_at_repair: 20000, claimed_labor_hours: 2.0, claimed_parts_qty: 0, complaint_text: "Customer reports a clunk over rough pavement.", cause_text: "Suspension bushing play found during inspection.", correction_text: "Torqued the suspension fasteners to specification." }
              as: DealerWarrantyAdmin
              as_user_id: "${dov_id}"
              captures: { cl_ov0_id: $.data.id }
          trigger:
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${dov_id}", vehicle_id: "${vehov_id}", labor_operation_id: "${lo_ov_id}", repair_order_number: "RO-OV-30", repair_date: "2026-03-11", odometer_at_repair: 19000, claimed_labor_hours: 2.0, claimed_parts_qty: 0, complaint_text: "Customer reports a clunk over rough pavement.", cause_text: "Suspension bushing play found during inspection.", correction_text: "Torqued the suspension fasteners to specification." }
              as: DealerWarrantyAdmin
              as_user_id: "${dov_id}"
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${dov_id}", vehicle_id: "${vehov_id}", labor_operation_id: "${lo_ov_id}", repair_order_number: "RO-OV-31", repair_date: "2026-03-10", odometer_at_repair: 18900, claimed_labor_hours: 2.0, claimed_parts_qty: 0, complaint_text: "Customer reports a clunk over rough pavement.", cause_text: "Suspension bushing play found during inspection.", correction_text: "Torqued the suspension fasteners to specification." }
              as: DealerWarrantyAdmin
              as_user_id: "${dov_id}"
              captures: { cl_ov31_id: $.data.id }
          assert:
            - "gap of exactly 30 days (2026-03-11 against the 2026-04-10 anchor): HTTP 409 with error_id == ERR_OVERLAPPING_REPAIR_CLAIM, and no claim row is created"
            - "gap of 31 days (2026-03-10): HTTP 201 with WarrantyClaim.${cl_ov31_id}.status == SUBMITTED and provisional_total_cents == 20000"
            - "GET /warranty/claims/${cl_ov31_id}/edits with edit_code REPEAT_REPAIR returns exactly 1 item with severity == WARN (within REPEAT_REPAIR_WINDOW_DAYS 180 of the anchor)"
            - "the WARN edit did NOT suspend the claim: status is SUBMITTED, not SUSPENDED"
            - "the anchor claim WarrantyClaim.${cl_ov0_id} is untouched: status SUBMITTED, version unchanged"
            - "GET /warranty/claims?vehicle_id=${vehov_id} returns exactly 2 items"

      - name: audit_period_overlap_half_open_no_buffer_touching_endpoints
        grounds:
          - validations.priority_64.ERR_AUDIT_PERIOD_OVERLAP
          - entities.DealerAudit.fields.period_start
          - entities.DealerAudit.fields.period_end
          - concurrency_rules.audit-create-stale-dealer
        distinguishing_aspect: |
          The second contended resource in this domain uses the OPPOSITE interval convention from
          the first: dealer audit periods are HALF-OPEN with no buffer, so a new period starting one
          day before an existing period_end collides while a new period starting exactly ON that
          period_end is accepted. Holding both conventions straight in one implementation is the
          point - a shared interval helper tuned for the claim rule's closed 30-day buffer rejects
          the touching-endpoint audit that must succeed.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z; CA profile; dealer D_AP with no claims."
            - "Audit A_FIRST over [2026-01-01, 2026-07-01) left in SCHEDULED, which is one of the four statuses that occupy the dealer's period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D-AP", name: "Audit Period Dealer", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 10000, initial_parts_markup_pct: 0.25 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { dap_id: $.data.id, dap_version: $.data.version }
            - call: "POST /warranty/audits"
              payload: { dealer_id: "${dap_id}", period_start: "2026-01-01", period_end: "2026-07-01", sample_size: 1, lead_auditor_user_id: "auditor-lead-1", expected_dealer_version: "${dap_version}" }
              as: AuditManager
              as_user_id: "aum-user-1"
              captures: { audit_first_id: $.data.id }
            - call: "GET /warranty/dealers/${dap_id}"
              payload: {}
              as: AuditManager
              as_user_id: "aum-user-1"
              captures: { dap_version_2: $.data.version }
          trigger:
            - call: "POST /warranty/audits"
              payload: { dealer_id: "${dap_id}", period_start: "2026-06-30", period_end: "2026-12-31", sample_size: 1, lead_auditor_user_id: "auditor-lead-1", expected_dealer_version: "${dap_version_2}" }
              as: AuditManager
              as_user_id: "aum-user-1"
            - call: "POST /warranty/audits"
              payload: { dealer_id: "${dap_id}", period_start: "2026-07-01", period_end: "2026-12-31", sample_size: 1, lead_auditor_user_id: "auditor-lead-1", expected_dealer_version: "${dap_version_2}" }
              as: AuditManager
              as_user_id: "aum-user-1"
              captures: { audit_second_id: $.data.id }
          assert:
            - "one day of intersection (2026-06-30 start against a 2026-07-01 end): HTTP 409 with error_id == ERR_AUDIT_PERIOD_OVERLAP and no audit row created"
            - "touching endpoints (2026-07-01 start == the existing period_end): HTTP 201 with DealerAudit.${audit_second_id}.status == SCHEDULED"
            - "GET /warranty/audits?dealer_id=${dap_id} returns exactly 2 items"
            - "DealerAudit.${audit_first_id} is unchanged and still SCHEDULED"
            - "the rejected attempt did not consume the dealer's version, which is why the accepted call reuses the same expected_dealer_version"

  # =====================================================================================
  - rule_id: compensating_invariant
    instances:
      - name: late_part_return_reverses_non_return_debit_to_exact_zero
        grounds:
          - calculations.dealer_chargeback_balance
          - state_machines.PartsReturnRequest.status.NOT_RETURNED_to_RECEIVED
          - state_machines.Dealer.status.SUSPENDED_to_ACTIVE
          - state_machines.WarrantyClaim.payment_status.DEBITED_to_CREDIT_REINSTATED
          - entities.ChargebackLedgerEntry.fields.amount_cents
          - entities.PartsReturnRequest.fields.reversed_amount_cents
        distinguishing_aspect: |
          The invariant Dealer.chargeback_balance_cents == SUM(ledger.amount_cents) must survive a
          full undo: a 275250 non-return debit followed by a late return appends -275250 and the
          balance must return to EXACTLY 0, not to a rounded-off residue, while every downstream
          consequence unwinds too - the dealer leaves SUSPENDED for ACTIVE and the posture-suspended
          sibling claim returns to SUBMITTED. The compensation is an append, never an edit or a
          delete, so the ledger keeps both rows and the invariant is checked against their sum.
        test_recipe:
          setup:
            - "The non_return_sweep_depth_five_return_claim_ledger_posture_sibling fixture carried through the sweep at clock 2026-06-16: PartsReturnRequest PR_PWR is NOT_RETURNED with debit_amount_cents 275250, claim CLP is DEBITED, Dealer D_PWR is SUSPENDED with chargeback_balance_cents 275250 and one PARTS_NON_RETURN ledger row, and sibling claim CLS is SUSPENDED with a DEALER_POSTURE_HOLD edit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D-PWR", name: "Powertrain Dealer", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 13750, initial_parts_markup_pct: 0.40 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { dpwr_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VINP0000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { vehp_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VINS0000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { vehs_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "P7788-90", description: "Transmission assembly replacement", standard_time_hours: 3.0, max_time_hours: 4.0, category: "POWERTRAIN", requires_causal_part: true, causal_failure_group: "PWRTRN", overlap_group: "PWRTRN" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_pwr_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "D0001-00", description: "Diagnostic time only", standard_time_hours: 2.0, max_time_hours: 2.5, category: "BASIC", requires_causal_part: false, overlap_group: "DIAG" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_diag_id: $.data.id }
            - call: "POST /warranty/parts"
              payload: { part_number: "PWR-TRN-4410", description: "Transmission assembly", dealer_net_cents: 180000, failure_group: "PWRTRN", return_required: true, retention_days: 45 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { part_pwr_id: $.data.id }
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${dpwr_id}", vehicle_id: "${vehp_id}", labor_operation_id: "${lo_pwr_id}", causal_part_id: "${part_pwr_id}", repair_order_number: "RO-P-1", repair_date: "2026-04-10", odometer_at_repair: 45000, claimed_labor_hours: 3.0, claimed_parts_qty: 1, complaint_text: "Customer reports harsh shifting under load.", cause_text: "Internal transmission clutch pack failure confirmed.", correction_text: "Replaced the transmission assembly and road tested." }
              as: DealerWarrantyAdmin
              as_user_id: "${dpwr_id}"
              captures: { clp_id: $.data.id }
            - call: "POST /warranty/claims/${clp_id}/adjudicate"
              payload: { decision: "APPROVE", approved_labor_hours: 3.0, approved_parts_qty: 1 }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
            - call: "POST /warranty/claims/${clp_id}/pay"
              payload: {}
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${dpwr_id}", vehicle_id: "${vehs_id}", labor_operation_id: "${lo_diag_id}", repair_order_number: "RO-S-1", repair_date: "2026-04-20", odometer_at_repair: 20000, claimed_labor_hours: 2.0, claimed_parts_qty: 0, complaint_text: "Customer reports a dash warning lamp on.", cause_text: "Diagnostic scan traced a transient sensor code.", correction_text: "Cleared the code and verified no recurrence." }
              as: DealerWarrantyAdmin
              as_user_id: "${dpwr_id}"
              captures: { cls_id: $.data.id }
            - call: "GET /warranty/parts-returns"
              payload: { claim_id: "${clp_id}" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { pr_pwr_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-16T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/parts-returns/non-return-sweep"
              payload: {}
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
          trigger:
            - call: "POST /warranty/parts-returns/${pr_pwr_id}/receive"
              payload: { received_date: "2026-06-18" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
          assert:
            - "PartsReturnRequest.${pr_pwr_id}.status == RECEIVED with reversed_amount_cents == 275250 and debit_amount_cents still 275250 (the original debit is not erased)"
            - "exactly one new ledger row: source_type == LATE_RETURN_REVERSAL, claim_id == ${clp_id}, amount_cents == -275250, balance_after_cents == 0"
            - "GET /warranty/dealers/${dpwr_id}/ledger-entries returns exactly 2 items and Dealer.${dpwr_id}.chargeback_balance_cents == 0 == SUM(275250, -275250)"
            - "Dealer.${dpwr_id}.status == ACTIVE, back from SUSPENDED, with open_parts_return_count still 0 (the sweep already decremented it; the late receive must not decrement it twice into -1)"
            - "WarrantyClaim.${clp_id}.payment_status == CREDIT_REINSTATED with reinstated_amount_cents == 275250 and status still APPROVED"
            - "WarrantyClaim.${cls_id}.status == SUBMITTED again and its DEALER_POSTURE_HOLD edit has a non-null resolved_at"

      - name: claim_void_restores_open_parts_return_count_to_pre_submission_value
        grounds:
          - calculations.dealer_open_parts_return_count
          - state_machines.PartsReturnRequest.status.REQUESTED_to_WAIVED
          - state_machines.WarrantyClaim.status.SUBMITTED_to_VOID
          - entities.Dealer.fields.open_parts_return_count
          - endpoints.POST_/warranty/claims/{id}/void
        distinguishing_aspect: |
          The second compensating invariant is a COUNT rather than a money balance, and its
          compensation runs through a different entity's terminal state: submitting a claim whose
          causal part is return-required increments Dealer.open_parts_return_count to 1, and voiding
          that claim must waive the obligation and return the count to exactly its pre-submission 0
          - without ever appending a ledger row or debiting anything, since a VOID claim is never
          chargeable. An implementation that only decrements on receive or on sweep leaks the count
          upward forever.
        test_recipe:
          setup:
            - "Clock 2026-05-01T00:00:00Z; CA profile; dealer D_CNT at rate 13750 / markup 0.40 with open_parts_return_count 0 at creation."
            - "Vehicle VEH_CNT, labor op A1234-56 and part BRK-PAD-9931 (return_required true, retention_days 30)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D-CNT", name: "Count Dealer", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 13750, initial_parts_markup_pct: 0.40 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { dcnt_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VINC0000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { vehcnt_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "A1234-56", description: "Front brake pad replacement", standard_time_hours: 1.5, max_time_hours: 2.5, category: "BASIC", requires_causal_part: true, causal_failure_group: "BRAKE_FRONT", overlap_group: "BRAKE_FRONT" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_brake_id: $.data.id }
            - call: "POST /warranty/parts"
              payload: { part_number: "BRK-PAD-9931", description: "Front brake pad set", dealer_net_cents: 24799, failure_group: "BRAKE_FRONT", return_required: true, retention_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { part_brake_id: $.data.id }
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${dcnt_id}", vehicle_id: "${vehcnt_id}", labor_operation_id: "${lo_brake_id}", causal_part_id: "${part_brake_id}", repair_order_number: "RO-CNT-1", repair_date: "2026-04-10", odometer_at_repair: 20000, claimed_labor_hours: 1.5, claimed_parts_qty: 3, complaint_text: "Customer reports brake squeal at low speed.", cause_text: "Front brake pads worn beyond specification.", correction_text: "Replaced front brake pads and verified normal braking." }
              as: DealerWarrantyAdmin
              as_user_id: "${dcnt_id}"
              captures: { cl_cnt_id: $.data.id }
            - call: "GET /warranty/parts-returns"
              payload: { claim_id: "${cl_cnt_id}" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { pr_cnt_id: "$.data[0].id" }
          trigger:
            - call: "POST /warranty/claims/${cl_cnt_id}/void"
              payload: { void_reason: "Repair order belonged to a different vehicle." }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
          assert:
            - "before the void: Dealer.${dcnt_id}.open_parts_return_count == 1 and PartsReturnRequest.${pr_cnt_id}.status == REQUESTED with due_date 2026-05-31"
            - "after the void: WarrantyClaim.${cl_cnt_id}.status == VOID"
            - "PartsReturnRequest.${pr_cnt_id}.status == WAIVED with debit_amount_cents == 0 and reversed_amount_cents == 0"
            - "Dealer.${dcnt_id}.open_parts_return_count == 0, exactly its pre-submission value"
            - "no money moved: GET /warranty/dealers/${dcnt_id}/ledger-entries returns 0 items, chargeback_balance_cents == 0 and status == ACTIVE"
            - "the invariant restated: open_parts_return_count == COUNT(PartsReturnRequest of this dealer's claims with status == REQUESTED) == 0"
