          trigger:
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_UNAUTHORIZED'"

  # =====================================================================
  # CROSS-CUTTING COMPLEXITY LAYERS
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_version_accepted
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[autopay-mandate-supersede-stale]
        distinguishing_aspect: "Correct expected_homeowner_version on POST /homeowners/{id}/autopay-mandate succeeds (201), and Homeowner.version increments by 1."
        test_recipe:
          setup:
            - "Homeowner H (version=1); one existing ACTIVE AutopayMandate."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "hoccp@ex.com", full_name: "H OCC P" }
              as: HOAManager
              captures: { h_id: $.data.id, h_v: $.data.version }
            - call: "POST /homeowners/${h_id}/autopay-mandate"
              payload: { expected_homeowner_version: "${h_v}", max_charge_cents: 40000 }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { m1_id: $.data.id }
            - call: "GET /homeowners/${h_id}"
              payload: {}
              as: HOAManager
              captures: { h_v2: $.data.version }
          trigger:
            - call: "POST /homeowners/${h_id}/autopay-mandate"
              payload: { expected_homeowner_version: "${h_v2}", max_charge_cents: 80000 }
              as: Homeowner
              as_user_id: "${h_id}"
              captures: { m2_status: $.data.status }
            - call: "GET /homeowners/${h_id}/autopay-mandate"
              payload: {}
              as: HOAManager
              captures: { list: $.data }
          assert:
            - "h_v2 == 2"
            - "m2_status == 'ACTIVE'"
            - "len(list) == 2"

      - name: cascade_dep3_chain
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Assessment.PAID_to_OVERDUE
        distinguishing_aspect: "End-to-end 3-level cascade Payment→Assessment→Homeowner is verified via a single reverse."
        excluded_because:
          difficulty_instance: transitive_cascade / payment_reversal_depth_3_cascade
          rationale: "Fully covered by the depth-3 cascade instance."

      - name: dual_variant_delta_switch
        claim_type: dual_variant_calculation
        grounds:
          - calculations.homeowner_delinquency_score.variants
        distinguishing_aspect: "Switching grace_policy STRICT→LENIENT changes standing/booking_privilege on the same portfolio; the delta is deterministic."
        excluded_because:
          difficulty_instance: dual_variant_calc / delinquency_score_strict_vs_lenient
          rationale: "The instance triggers the same GET after switching grace_policy and asserts both scores."

      - name: threshold_delinquent_boundary_1500
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.homeowner_delinquency_score
          - entities.Homeowner.fields.standing
        distinguishing_aspect: "Homeowner.standing transitions MARGINAL→DELINQUENT at delinquency_score>=1500 exactly."
        test_recipe:
          setup:
            - "Homeowner H, Property P (monthly_dues_cents=100000 = $1000)."
            - "One assessment A due_date=2026-04-15; monthly_dues_cents=100000; amount_due=100000."
            - "Clock advanced to 2026-06-15 (61 days past due; age_days=61; weight = 1.0 + 2*0.5 = 2.0)."
            - "STRICT policy assumed (POST /_config/grace-policy STRICT). When the clock is advanced in a single jump to 2026-06-15, both OPEN→OVERDUE (stamp late_fee) and OVERDUE→DELINQUENT fire in that ordered sequence at that moment; days_overdue=61 at stamp time. Tier-4 (>=60 days), mult 1.0 (GOOD_STANDING at that instant): base=round(100000*0.15)=15000; scaled=15000; late_fee_cents=min(max(15000,5000),25000)=15000. Weight = 1+(61//30)*0.5 = 2.0."
            - "contribution = (100000-0+15000)*2.0 = 230000 cents; score = round(230000/100) = 2300 >= 1500 → DELINQUENT."
          setup_api_calls:
            - call: "POST /_config/grace-policy"
              payload: { grace_policy: "STRICT" }
              as: HOAManager
            - call: "POST /homeowners"
              payload: { email: "hth@ex.com", full_name: "H Th" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "36 Th Ln", monthly_dues_cents: 100000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: HOAManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: HOAManager
            - call: "GET /homeowners/${h_id}"
              payload: {}
              as: HOAManager
              captures: { score: $.data.delinquency_score, st: $.data.standing, bp: $.data.booking_privilege }
          assert:
            - "score == 2300"
            - "st == 'DELINQUENT'"
            - "bp == 'FROZEN'"

  # =====================================================================
  # CONSISTENCY MODEL
  # =====================================================================
  - section: consistency_model
    instances:
      - name: derived_field_immediate_visibility
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Property.fields.total_outstanding_cents
        distinguishing_aspect: "All derived fields (Homeowner.standing, Property.total_outstanding_cents, Motion.yes_count) are reconciled synchronously — same-request GET after a mutating POST reflects the change."
        test_recipe:
          setup:
            - "Homeowner H, Property P, one Assessment A ($300)."
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { email: "him@ex.com", full_name: "H Im" }
              as: HOAManager
              captures: { h_id: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h_id}", address: "37 Im Ln", monthly_dues_cents: 30000 }
              as: HOAManager
              captures: { p_id: $.data.id }
            - call: "POST /assessments"
              payload: { property_id: "${p_id}", billing_period_start: "2026-03-01T00:00:00Z", billing_period_end: "2026-04-01T00:00:00Z", due_date: "2026-05-15T00:00:00Z" }
              as: HOAManager
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /assessments/${a_id}/pay"
              payload: { amount_cents: 15000, method: "MANUAL" }
              as: Homeowner
              as_user_id: "${h_id}"
            - call: "GET /properties/${p_id}"
              payload: {}
              as: HOAManager
              captures: { out: $.data.total_outstanding_cents }
          assert:
            - "out == 15000"
