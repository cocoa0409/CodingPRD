  # =========================================================================
  # RULE 7 — cross_entity_state_dependency
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: ship_refused_because_owning_component_lifecycle_reached_sunset
        grounds:
          - validations[priority=8]
          - errors[ERR_COMPONENT_LIFECYCLE_BLOCKS_SHIP]
          - state_machines.DeprecationPlan.ANNOUNCED_to_SUNSET
          - state_machines.PlatformImplementation.PLANNED_to_SHIPPED
        distinguishing_aspect: |
          The blocking state lives on a DIFFERENT entity (Component.lifecycle_state == SUNSET,
          itself driven by a third entity, the DeprecationPlan) and on a DIFFERENT state
          dimension than the one being changed (PlatformImplementation.status). Nothing about the
          implementation is wrong: its accessibility evidence is clean and its
          token_compliance_ratio is 0.95, so only the cross-entity lifecycle gate can refuse it.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `design-guild`; Component `accordion` EXPERIMENTAL / ACTIVE"
            - "one WEB implementation still PLANNED, with a clean AUTOMATED AA audit (0/0/0) so the priority-13 ship gate is satisfied"
            - "a DeprecationPlan announced_at 2026-08-01, sunset_at 2026-08-20, removal_at 2026-09-25 (required_notice_days 14, actual 19), moved to ANNOUNCED by publishing its migration guide"
            - "the logical clock advanced to 2026-08-20T00:00:00.000Z and the plan advanced ANNOUNCED -> SUNSET, driving Component.lifecycle_state to SUNSET"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Design Guild", slug: "design-guild", platform_scope: "ALL", debt_budget_points: 40.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Accordion", slug: "accordion", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/components/${comp_id}/platform-implementations"
              payload: { platform: "WEB", package_name: "@ds/accordion-web", package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { impl_id: $.data.id, impl_status_initial: $.data.status }
            - call: "POST /design-system/platform-implementations/${impl_id}/accessibility-audits"
              payload: { method: "AUTOMATED", wcag_level: "AA", violations_critical: 0, violations_serious: 0, violations_moderate: 0, evidence_url: "https://ds.example.com/a11y/acc-auto-1" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { load_clean: $.data.defect_load }
            - call: "POST /design-system/components/${comp_id}/deprecation-plans"
              payload: { announced_at: "2026-08-01T00:00:00.000Z", sunset_at: "2026-08-20T00:00:00.000Z", removal_at: "2026-09-25T00:00:00.000Z", migration_guide_url: "https://ds.example.com/migrate/accordion" }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { plan_id: $.data.id }
            - call: "POST /design-system/deprecation-plans/${plan_id}/migration-guide"
              payload: { migration_guide_url: "https://ds.example.com/migrate/accordion", publish: true }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { plan_state_announced: $.data.state }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/deprecation-plans/${plan_id}/advance"
              payload: {}
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { plan_state_sunset: $.data.state }
            - call: "GET /design-system/components/${comp_id}"
              payload: {}
              as: DesignSystemLead
              captures: { comp_lifecycle: $.data.lifecycle_state }
          trigger:
            - call: "POST /design-system/platform-implementations/${impl_id}/ship"
              payload: { package_version: "1.0.0", token_compliance_ratio: 0.95 }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${impl_status_initial} == PLANNED and ${load_clean} == 0"
            - "${plan_state_announced} == ANNOUNCED and ${plan_state_sunset} == SUNSET"
            - "${comp_lifecycle} == SUNSET"
            - "${err} == ERR_COMPONENT_LIFECYCLE_BLOCKS_SHIP"
            - "HTTP status == 409"
            - "PlatformImplementation.${impl_id}.status == PLANNED and PlatformImplementation.${impl_id}.shipped_at == null"
            - "Component.${comp_id}.shipped_platform_count == 0 and Component.${comp_id}.coverage_state == NONE"
            - "Component.${comp_id}.maturity_level == EXPERIMENTAL (the lifecycle dimension moved, the maturity dimension did not)"

      - name: proposal_creation_refused_because_author_team_debt_state_is_frozen
        grounds:
          - validations[priority=29]
          - errors[ERR_TEAM_DEBT_FROZEN]
          - calculations.exception_debt_points
          - entities.Team.debt_state
        distinguishing_aspect: |
          A DIFFERENT blocking entity and a DIFFERENT dependency direction: the state that refuses
          the write sits on the caller's own Team (debt_state FROZEN), which is not the entity
          being created and is derived from a THIRD entity class (two APPROVED ExceptionGrants
          against a fourth entity, the substitute Component). No field of the proposal payload is
          invalid.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `overdrawn-team` with debt_budget_points 12.00"
            - "TokenSet `core` and Component `data-grid` EXPERIMENTAL / ACTIVE owned by that team"
            - "two ExceptionGrant rows ONE_OFF_COMPONENT / platform_scope WEB against `data-grid`, both APPROVED: 12 * 1.00 * 0.50 = 6.00 points each, so outstanding_debt_points reaches exactly 12.00 and debt_state flips to FROZEN (the freeze test is `>=`, the approval test is `<=`, so the second approval is admitted and is also the one that freezes the team)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /design-system/teams"
              payload: { name: "Overdrawn Team", slug: "overdrawn-team", platform_scope: "WEB", debt_budget_points: 12.00 }
              as: SystemAdmin
              captures: { team_id: $.data.id, debt_state_initial: $.data.debt_state }
            - call: "POST /design-system/token-sets"
              payload: { name: "Core", slug: "core", default_brand: "CORE", default_mode: "LIGHT" }
              as: DesignSystemLead
              captures: { ts_id: $.data.id }
            - call: "POST /design-system/components"
              payload: { name: "Data Grid", slug: "data-grid", owning_team_id: "${team_id}", docs_state: "DRAFT" }
              as: DesignSystemLead
              captures: { comp_id: $.data.id }
            - call: "POST /design-system/exception-grants"
              payload: { requesting_team_id: "${team_id}", substitute_for_component_id: "${comp_id}", exception_kind: "ONE_OFF_COMPONENT", platform_scope: "WEB", justification: "Bespoke pivot grid for the finance console.", expires_at: "2026-12-31T00:00:00.000Z" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { g1: $.data.id }
            - call: "POST /design-system/exception-grants"
              payload: { requesting_team_id: "${team_id}", substitute_for_component_id: "${comp_id}", exception_kind: "ONE_OFF_COMPONENT", platform_scope: "WEB", justification: "Bespoke tree grid for the admin console.", expires_at: "2026-12-31T00:00:00.000Z" }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { g2: $.data.id }
            - call: "POST /design-system/exception-grants/${g1}/decision"
              payload: { decision: "APPROVE", decision_notes: "Documented as debt." }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { pts1: $.data.debt_points }
            - call: "POST /design-system/exception-grants/${g2}/decision"
              payload: { decision: "APPROVE", decision_notes: "Documented as debt." }
              as: DesignSystemLead
              as_user_id: "lead-1"
              captures: { pts2: $.data.debt_points }
            - call: "GET /design-system/teams/${team_id}"
              payload: {}
              as: DesignSystemLead
              captures: { outstanding: $.data.outstanding_debt_points, debt_state_after: $.data.debt_state }
          trigger:
            - call: "POST /design-system/contribution-proposals"
              payload: { title: "Add virtualised rows to Data Grid", author_team_id: "${team_id}", target_component_id: "${comp_id}", pinned_token_set_id: "${ts_id}", proposal_kind: "ENHANCEMENT", touches_public_api: false }
              as: ContributingTeam
              as_user_id: "${team_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${debt_state_initial} == CLEAR"
            - "${pts1} == 6.00 and ${pts2} == 6.00"
            - "${outstanding} == 12.00 and ${debt_state_after} == FROZEN"
            - "${err} == ERR_TEAM_DEBT_FROZEN"
            - "HTTP status == 422"
            - "GET /design-system/contribution-proposals?author_team_id=${team_id} returns total_count == 0 (no proposal row was created)"
            - "Team.${team_id}.lifetime_debt_points == 12.00 (the refused proposal changed nothing)"

      - name: acceptance_refused_because_pinned_token_set_version_advanced_after_review
        grounds:
          - validations[priority=14]
          - errors[ERR_PINNED_TOKEN_SET_STALE]
          - state_machines.ContributionProposal.READY_FOR_ACCEPTANCE_to_ACCEPTED
          - entities.ContributionProposal.pinned_token_set_version
        distinguishing_aspect: |
          A THIRD blocking entity class and a version-valued rather than enum-valued dependency:
          the proposal is in the correct state, its OCC guard on the Component is fresh, its
          Release is DRAFT and its evidence set is complete — the only defect is that a fifth
          entity (DesignToken) mutated the pinned TokenSet's version after the engineering review,
          so the reviewed design no longer matches the tokens.
        test_recipe:
          setup:
            - "logical clock pinned at 2026-08-01T00:00:00.000Z"
            - "Team `platform-team`; TokenSet `core` at version 1; Component `stepper` EXPERIMENTAL / ACTIVE with coverage_state NONE"
            - "an ENHANCEMENT proposal against `stepper` pinning `core`, submitted (revision_round 1, pinned_token_set_version 1, required_evidence_kinds [A11Y_AUTOMATED, TOKEN_COMPLIANCE] because coverage_state is NONE so PLATFORM_PARITY is not required)"
            - "both required evidence kinds filed, DESIGN_CRITIQUE approved by `critic-1` and ENGINEERING_REVIEW approved by `eng-1`, so the proposal is READY_FOR_ACCEPTANCE"
            - "a DRAFT Release exists"
            - "one DesignToken is then added to `core`, taking TokenSet.version from 1 to 2 while the proposal still carries pinned_token_set_version 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
