      - name: rotation_slot_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=66]
          - errors.ERR_ROTATION_SLOT_OVERLAP
          - entities.CallRotationSlot.fields.window_start
          - entities.CallRotationSlot.fields.window_end
          - calculations.contract_coverage_posture
          - complexity_profile.primary_archetype
        distinguishing_aspect: |
          Resource = one perfusionist's personal call calendar, and the overlap test is the pure
          half-open interval rule with no buffer at all: a slot that starts at the exact instant
          another ends is accepted, while a one-minute intersection is rejected even though the two
          slots belong to different contracts and different slot types (the rule is deliberately
          holder-scoped and contract-blind). The same request also exercises the interval_merge
          side of contract_coverage_posture: a third slot nested wholly inside an existing
          PRIMARY_CALL window adds zero covered minutes, so the posture does not improve.
        test_recipe:
          setup:
            - "Two independent hospital contracts c1 and c2 and two perfusionists p1 and p2, with the logical clock left at its 2026-08-01T00:00:00Z default so the 72-hour coverage horizon is exactly [2026-08-01T00:00:00Z, 2026-08-04T00:00:00Z)."
            - "p1 already holds one PRIMARY_CALL slot on c1 spanning the entire horizon, [2026-08-01T00:00:00Z, 2026-08-04T00:00:00Z)."
            - "No cases, devices or certifications are needed: this instance is purely about interval admission."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, monthly_coverage_fee_cents: 1200000, prolonged_surcharge_pct: 0.15, prolonged_pump_threshold_minutes: 180, disposable_markup_pct: 0.20, disposable_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "Brackenridge Heart Institute", staffing_model: "PER_CASE", per_case_fee_cents: 380000, ecmo_hourly_fee_cents: 85000, monthly_case_cap: 4 }
              as: ContractAdmin
              captures: { c2: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Rafe Mbeki", employee_code: "EMP-1001", ecmo_privileged: true, career_case_count: 150 }
              as: ContractAdmin
              captures: { p1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Tom Vasquez", employee_code: "EMP-1003", ecmo_privileged: true, career_case_count: 90 }
              as: ContractAdmin
              captures: { p2: $.data.id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p1}", slot_type: "PRIMARY_CALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ContractAdmin
              captures: { slot_p1: $.data.id }
          trigger:
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c2}", perfusionist_id: "${p1}", slot_type: "BACKUP_CALL", window_start: "2026-08-03T23:59:00Z", window_end: "2026-08-05T00:00:00Z" }
              as: ContractAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c2}", perfusionist_id: "${p1}", slot_type: "BACKUP_CALL", window_start: "2026-08-04T00:00:00Z", window_end: "2026-08-05T00:00:00Z" }
              as: ContractAdmin
              captures: { slot_p1_next: $.data.id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p2}", slot_type: "PRIMARY_CALL", window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: ContractAdmin
              captures: { slot_p2_nested: $.data.id }
          assert:
            - "the first slot creation returns HTTP 409 with ${err_id} == ERR_ROTATION_SLOT_OVERLAP: the single overlapping minute [2026-08-03T23:59:00Z, 2026-08-04T00:00:00Z) is enough, and neither the different contract_id nor the different slot_type exempts it"
            - "GET /call-rotation-slots?perfusionist_id=${p1} still returns total_count == 1 after the refusal, so no partial row was written"
            - "the second slot creation returns HTTP 201 with CallRotationSlot.${slot_p1_next}.status == SCHEDULED: window_start == the incumbent slot's window_end is adjacency, not intersection, under half-open semantics"
            - "the third slot creation returns HTTP 201: CallRotationSlot.${slot_p2_nested} is accepted even though its window sits wholly inside ${slot_p1}'s window, because the overlap rule is scoped to a single perfusionist_id"
            - "HospitalContract.${c1}.coverage_posture == THIN after all three triggers: contract_coverage_posture merges ${slot_p1} and the nested ${slot_p2_nested} into one 4320-minute PRIMARY_CALL interval (not 5760), which equals the horizon, but BACKUP_CALL coverage on c1 is still 0 minutes and so fails the 0.5 ratio for COVERED"
            - "HospitalContract.${c2}.coverage_posture == UNCOVERED: ${slot_p1_next} lies entirely after the horizon end, so its clipped intersection is empty and contributes 0 covered minutes"

      - name: device_turnaround_buffer_rejects_gap_of_exactly_ninety_minutes
        grounds:
          - validations[priority=68]
          - errors.ERR_DEVICE_TURNAROUND_CONFLICT
          - calculations.device_reservation_ledger
          - state_machines.PerfusionDevice.AVAILABLE_to_RESERVED
          - entities.PerfusionDevice.fields.open_reservation_count
          - entities.BypassCase.fields.primary_device_id
        distinguishing_aspect: |
          A different resource class (a heart-lung machine rather than a person) under a different
          overlap algebra: the machine's held interval is widened by DEVICE_TURNAROUND_MINUTES on the
          incumbent side of each non-strict comparison, so two case windows that merely touch are
          still a conflict and the rejection boundary sits at a raw gap of exactly 90 minutes. The
          admission check at priority 34 deliberately tolerates a RESERVED machine, which is what
          makes this row - not the availability row - the one that answers, and the surviving second
          reservation proves open_reservation_count is a count rather than a boolean lock.
        test_recipe:
          setup:
            - "Shared fixture: contract c1 (per_case_fee_cents 400000, monthly_case_cap 5), surgeon s1 with an ACTIVE CABG preference card, p1 (career_case_count 150, CCP certification with cycle_credit_requirement 45 and a SUBMITTED 20-hour CE claim, ADMISSION readiness 0.694), chief, p2, and two heart-lung machines d1 (backup_device_id = d2) and d2."
            - "p1 holds a PRIMARY_CALL slot [2026-08-01T00:00:00Z, 2026-08-04T00:00:00Z) and p2 a BACKUP_CALL slot [2026-08-01T00:00:00Z, 2026-08-03T00:00:00Z), so c1's posture is COVERED."
            - "Case A is scheduled [2026-08-02T06:00:00Z, 2026-08-02T12:00:00Z), staffed with p1, and its pack is configured on d1 so d1 and d2 are both RESERVED with open_reservation_count 1."
            - "Case B is scheduled [2026-08-02T13:30:00Z, 2026-08-02T19:30:00Z) - a raw gap of exactly DEVICE_TURNAROUND_MINUTES (90) after case A - and case C is scheduled [2026-08-02T13:31:00Z, 2026-08-02T19:31:00Z), one minute later. Both are staffed with p1, which is admissible because neither window intersects case A's."
          setup_api_calls:
            - call: "POST /hospital-contracts"
              payload: { hospital_name: "St Aldate Cardiac Center", staffing_model: "COVERAGE_PLUS_PER_CASE", per_case_fee_cents: 400000, ecmo_hourly_fee_cents: 90000, monthly_case_cap: 5, monthly_coverage_fee_cents: 1200000, prolonged_surcharge_pct: 0.15, prolonged_pump_threshold_minutes: 180, disposable_markup_pct: 0.20, disposable_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { c1: $.data.id }
            - call: "POST /surgeons"
              payload: { full_name: "Dr Imani Cole", npi_code: "NPI-3300110", specialty: "ADULT_CARDIAC" }
              as: ContractAdmin
              captures: { s1: $.data.id }
            - call: "POST /preference-cards"
              payload: { surgeon_id: "${s1}", procedure_type: "CABG", standard_pump_minutes: 150, prime_volume_ml: 1500, pack_line_items: [ { line_code: "A_OXYGENATOR", quantity: 1, unit_cost_cents: 1055 }, { line_code: "B_TUBING_PACK", quantity: 1, unit_cost_cents: 1155 }, { line_code: "C_CANNULA_SET", quantity: 1, unit_cost_cents: 1255 } ], required_safety_check_codes: ["ACT_BASELINE", "CIRCUIT_INTEGRITY", "GAS_LINE"], blood_management_protocol: "STANDARD", min_hematocrit_pct: 22, revision: 1 }
              as: Surgeon
              as_user_id: "${s1}"
              captures: { pc1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Rafe Mbeki", employee_code: "EMP-1001", ecmo_privileged: true, career_case_count: 150 }
              as: ContractAdmin
              captures: { p1: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Nadia Oyelaran", employee_code: "EMP-1002", is_chief: true, career_case_count: 200 }
              as: ContractAdmin
              captures: { chief: $.data.id }
            - call: "POST /perfusionists"
              payload: { full_name: "Tom Vasquez", employee_code: "EMP-1003", ecmo_privileged: true, career_case_count: 90 }
              as: ContractAdmin
              captures: { p2: $.data.id }
            - call: "POST /perfusionists/${p1}/certifications"
              payload: { cert_code: "CCP", issued_on: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z", cycle_credit_requirement: 45 }
              as: ContractAdmin
              captures: { cert1: $.data.id }
            - call: "POST /perfusionists/${p1}/ce-activities"
              payload: { category: "CLINICAL", credit_hours: 20, activity_date: "2026-03-01T00:00:00Z", accreditation_body: "ABCP" }
              as: ContractAdmin
              captures: { ce1: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-002", device_class: "HEART_LUNG_MACHINE" }
              as: BiomedTech
              captures: { d2: $.data.id }
            - call: "POST /perfusion-devices"
              payload: { contract_id: "${c1}", asset_tag: "HLM-001", device_class: "HEART_LUNG_MACHINE", backup_device_id: "${d2}" }
              as: BiomedTech
              captures: { d1: $.data.id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p1}", slot_type: "PRIMARY_CALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-04T00:00:00Z" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { slot_p1: $.data.id }
            - call: "POST /call-rotation-slots"
              payload: { contract_id: "${c1}", perfusionist_id: "${p2}", slot_type: "BACKUP_CALL", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-03T00:00:00Z" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { slot_p2: $.data.id }
            - call: "POST /bypass-cases"
              payload: { contract_id: "${c1}", surgeon_id: "${s1}", procedure_type: "CABG", scheduled_start: "2026-08-02T06:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", acuity: "ELECTIVE" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { caseA: $.data.id, caseA_v: $.data.version }
            - call: "POST /bypass-cases/${caseA}/assign-perfusionist"
              payload: { perfusionist_id: "${p1}", expected_case_version: "${caseA_v}" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
            - call: "POST /bypass-cases/${caseA}/disposable-packs"
              payload: { primary_device_id: "${d1}" }
              as: Perfusionist
              as_user_id: "${p1}"
              captures: { packA: $.data.id }
            - call: "POST /bypass-cases"
              payload: { contract_id: "${c1}", surgeon_id: "${s1}", procedure_type: "CABG", scheduled_start: "2026-08-02T13:30:00Z", scheduled_end: "2026-08-02T19:30:00Z", acuity: "ELECTIVE" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { caseB: $.data.id, caseB_v: $.data.version }
            - call: "POST /bypass-cases/${caseB}/assign-perfusionist"
              payload: { perfusionist_id: "${p1}", expected_case_version: "${caseB_v}" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
            - call: "POST /bypass-cases"
              payload: { contract_id: "${c1}", surgeon_id: "${s1}", procedure_type: "CABG", scheduled_start: "2026-08-02T13:31:00Z", scheduled_end: "2026-08-02T19:31:00Z", acuity: "ELECTIVE" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
              captures: { caseC: $.data.id, caseC_v: $.data.version }
            - call: "POST /bypass-cases/${caseC}/assign-perfusionist"
              payload: { perfusionist_id: "${p1}", expected_case_version: "${caseC_v}" }
              as: ChiefPerfusionist
              as_user_id: "${chief}"
          trigger:
            - call: "POST /bypass-cases/${caseB}/disposable-packs"
              payload: { primary_device_id: "${d1}" }
              as: Perfusionist
              as_user_id: "${p1}"
              captures: { err_id: $.data.error_id }
            - call: "POST /bypass-cases/${caseC}/disposable-packs"
              payload: { primary_device_id: "${d1}" }
              as: Perfusionist
              as_user_id: "${p1}"
              captures: { packC: $.data.id }
          assert:
            - "before the triggers PerfusionDevice.${d1}.status == RESERVED with open_reservation_count == 1, and PerfusionDevice.${d2}.status == RESERVED with open_reservation_count == 1 (d2 is case A's resolved backup)"
            - "case B's pack configuration returns HTTP 409 with ${err_id} == ERR_DEVICE_TURNAROUND_CONFLICT: 13:30 <= 12:00 + 90 minutes and 06:00 <= 19:30 + 90 minutes, so the buffered closed-interval test collides on a raw gap of exactly 90 minutes"
            - "the refusal comes from priority 68 and not priority 34: both machines are merely RESERVED, which the availability row now admits"
            - "after the refusal BypassCase.${caseB}.bypass_status is still STAFFED, its primary_device_id and backup_device_id are still null, GET /disposable-packs?case_id=${caseB} returns total_count == 0, and both machines still report open_reservation_count == 1"
            - "case C's pack configuration returns HTTP 201: 13:31 > 12:00 + 90 minutes, so the one extra minute clears the buffer"
            - "after the success BypassCase.${caseC}.bypass_status == PACK_CONFIGURED with primary_device_id == ${d1} and backup_device_id == ${d2}, and DisposablePack.${packC}.pack_cost_cents == 3741"
            - "PerfusionDevice.${d1}.status == RESERVED with open_reservation_count == 2 and PerfusionDevice.${d2}.status == RESERVED with open_reservation_count == 2: one machine legitimately carries two non-colliding reservations at once"

      - name: perfusionist_aggregate_concurrent_case_capacity_rejects_third_overlap
        grounds:
          - validations[priority=69]
          - errors.ERR_PERFUSIONIST_CONCURRENT_CASE_LIMIT
          - calculations.device_reservation_ledger
          - calculations.perfusionist_readiness_score
          - entities.BypassCase.fields.assigned_perfusionist_id
          - entities.HospitalContract.fields.accrued_case_count
        distinguishing_aspect: |
          Aggregate rather than pairwise overlap: each individual pair of case windows is a perfectly
          legal double-booking (the first two assignments both succeed), and only the collective
          count of intersecting staffed cases breaks MAX_CONCURRENT_STAFFED_CASES. The comparison
          uses plain half-open intersection with no turnaround buffer, which is the opposite algebra
          to the device row at priority 68, and the resource is a person whose capacity is a count
          instead of a machine whose capacity is one window at a time. The rejection leaves the case
          unstaffed and unaccrued, so a second qualified perfusionist can immediately take it.
