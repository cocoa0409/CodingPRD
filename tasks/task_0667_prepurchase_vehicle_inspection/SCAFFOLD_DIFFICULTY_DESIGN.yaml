            - call: "POST /inspection-orders"
              payload: { account_id: "${acct_id}", vehicle_id: "${veh_b}", fee_schedule_id: "${fs_id}", location_lat: 34.0, location_lng: -118.0, rush_tier: "NONE" }
              as: AccountHolder
