  - rule_id: cross_entity_state_dependency
    instances:
      - name: application_approve_requires_verified_health_permit  # pair Application -> Permit
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_APPROVED
          - entities.Permit.fields.status
          - errors[ERR_NO_HEALTH_PERMIT]
        distinguishing_aspect: |
          Entity pair Application -> Permit: an UNDER_REVIEW application for a requires_health_permit
          category (PREPARED_FOOD) cannot move to APPROVED unless the owning Vendor has a VERIFIED HEALTH
          permit; with only a PENDING permit, approve returns ERR_NO_HEALTH_PERMIT.
