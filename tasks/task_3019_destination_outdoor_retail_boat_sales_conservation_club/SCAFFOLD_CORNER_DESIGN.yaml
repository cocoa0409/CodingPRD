              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/permit-remit-batches"
              payload: { window_start_utc: "2026-09-01T00:00:00Z", window_end_utc: "2026-09-30T00:00:00Z" }
              as: RemitAdmin
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /stores/${st_id}/permit-sales"
              payload: { member_id: "${m_id}", permit_type: "FISHING", residency_class: "RESIDENT", term_days: 7, land_access_units: 0, agent_user_id: "clerk_4471", permit_remit_batch_id: "${b_id}", expected_remit_batch_version: "${b_v}" }
              as: PermitClerk
              captures: { ps_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/ops-run"
              payload: {}
              as: StoreManager
            - call: "GET /stores/${st_id}"
              as: StoreManager
            - call: "POST /stores/${st_id}/ops-run"
              payload: {}
              as: PlatformAdmin
          assert:
            - "both checkpoints succeed with a 200 and a body carrying permit_remit_epoch"
            - "after the first checkpoint Store.${st_id}.permit_remit_epoch == 1"
            - "after the second checkpoint Store.${st_id}.permit_remit_epoch == 2, so the checkpoint is a commuting operation rather than a one-shot"
            - "Store.${st_id}.last_ops_run_at advances with each checkpoint"

  # =========================================================================
  # Section: cross_cutting_layers
  # =========================================================================
  - section: cross_cutting_layers
    instances:

      - name: occ_success_path_advances_the_parent_version
        claim_type: optimistic_concurrency
        grounds:
