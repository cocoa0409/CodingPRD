# =============================================================================
# SCAFFOLD — Driver Safety Camera Event Review & Coaching Workflow (Samsara-like)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Driver Safety Camera Event Review & Coaching Workflow (Samsara): camera and
  telematics event detection for harsh braking, following distance, distraction
  and seat belt use, event upload prioritization with bandwidth and retention
  policies, review queue where a safety manager confirms, dismisses or
  reclassifies each event, coaching session assignment with driver
  acknowledgment and repeat behavior escalation, safety scoring aggregation at
  driver, terminal and fleet level with leaderboard and incentive integration,
  privacy and driver relations considerations including inward-facing camera
  policies and union agreements, exoneration workflow using video evidence
  after a collision claim, retention of footage for litigation holds

domain_name: driver-safety-camera-coaching
api_prefix: /api

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - ops_run_checkpoint
  entity_topology: flat            # peer entities joined by FK references; sub-resource GETs only for reverse reachability
  state_machine_shape: cyclic      # review/reopen loops + coaching reassignment loops; FootageClip carries parallel dimensions
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic                  # SafetyScoreSnapshot.scope_id -> Driver | Terminal | Fleet
  role_model: segregation_of_duties  # event reviewer may not decide exoneration of the same event
  consistency_model: immediate
  difficulty_target: expert_plus

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: Fleet
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Fleet display name" }
      - { name: incentive_budget_cents, type: integer, source: input, description: "Season incentive budget cap in cents; >= 0" }
      - { name: posture, type: enum, source: system, description: "NORMAL | INCIDENT_LOCKDOWN; initial NORMAL", default: NORMAL }
      - { name: ops_run_index, type: integer, source: system, description: "Maintenance run counter, starts at 0, +1 per run-maintenance", default: 0 }
      - { name: retention_used_mb, type: integer, source: computed, description: "Sum of size_mb over fleet FootageClips whose upload_status != PURGED" }

  - name: Terminal
    parent: null
    common_fields: true
    fields:
      - { name: fleet_id, type: string, source: input, description: "FK -> Fleet.id" }
      - { name: name, type: string, source: input, description: "Terminal name" }
      - { name: region_code, type: string, source: input, description: "Two-letter region code" }
      - { name: safety_score_cached, type: number, source: computed, description: "Mean of member driver final scores, 2dp half-up; 100.00 when no drivers" }

  - name: UnionAgreement
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id" }
      - { name: agreement_code, type: string, source: input, description: "Unique-per-terminal agreement code" }
      - { name: inward_camera_allowed, type: boolean, source: input, description: "Whether inward-facing footage may be captured/reviewed" }
      - { name: live_view_allowed, type: boolean, source: input, description: "Whether live inward viewing is permitted" }
      - { name: audio_recording_allowed, type: boolean, source: input, description: "Whether audio may be recorded" }
      - { name: coaching_requires_steward_present, type: boolean, source: input, description: "Whether a union steward must attend coaching" }
      - { name: effective_from, type: datetime, source: input, description: "Closed window start (inclusive)" }
      - { name: effective_until, type: datetime, source: input, description: "Closed window end (inclusive); must be > effective_from" }
      - { name: status, type: enum, source: system, description: "DRAFT | RATIFIED | EXPIRED; initial DRAFT", default: DRAFT }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id" }
      - { name: employee_ref, type: string, source: input, description: "External HR reference; unique per fleet" }
      - { name: name, type: string, source: input, description: "Driver name" }
      - { name: hire_date, type: datetime, source: input, description: "Hire date" }
      - { name: inward_camera_consent, type: boolean, source: input, description: "Driver's signed consent to inward-facing capture" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | COACHING_HOLD | INACTIVE; initial ACTIVE", default: ACTIVE }
      - { name: confirmed_events_90d, type: integer, source: computed, description: "Count of driver's SafetyEvents status CONFIRMED with occurred_at in [clock-90d, clock] (inclusive both ends)" }
      - { name: safety_score_provisional, type: number, source: computed, description: "Provisional variant of driver_safety_score; recomputed on read" }
      - { name: safety_score_final, type: number, source: computed, description: "Final variant of driver_safety_score; recomputed on read" }
      - { name: incentive_tier, type: enum, source: computed, description: "GOLD | SILVER | BRONZE | NONE derived from safety_score_final" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: terminal_id, type: string, source: input, description: "FK -> Terminal.id" }
      - { name: vin, type: string, source: input, description: "Vehicle identification number; unique per fleet" }
      - { name: camera_unit_id, type: string, source: input, description: "Installed camera unit identifier" }
      - { name: bandwidth_tier, type: enum, source: input, description: "LOW | STANDARD | HIGH; upload priority multiplier" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DECOMMISSIONED; initial ACTIVE", default: ACTIVE }

  - name: CameraPolicy
    parent: null
    common_fields: true
    fields:
      - { name: fleet_id, type: string, source: input, description: "FK -> Fleet.id" }
      - { name: name, type: string, source: input, description: "Policy name" }
      - { name: retention_days_standard, type: integer, source: input, description: "Days non-collision footage is retained; >= 1" }
      - { name: retention_days_collision, type: integer, source: input, description: "Days collision footage is retained; >= retention_days_standard" }
      - { name: daily_upload_cap_mb, type: integer, source: input, description: "Fleet-wide daily upload cap in MB; >= 1" }
      - { name: inward_capture_enabled, type: boolean, source: input, description: "Whether inward-facing capture is enabled fleet-wide" }
      - { name: distraction_detection_enabled, type: boolean, source: input, description: "Whether DISTRACTION events may be ingested" }
      - { name: seatbelt_detection_enabled, type: boolean, source: input, description: "Whether SEAT_BELT events may be ingested" }
      - { name: effective_from, type: datetime, source: input, description: "Policy effective start" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | ARCHIVED; initial DRAFT; exactly one ACTIVE per fleet", default: DRAFT }

  - name: SafetyEvent
    parent: null
    common_fields: true
    fields:
      - { name: fleet_id, type: string, source: input, description: "FK -> Fleet.id" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: event_type, type: enum, source: input, description: "HARSH_BRAKE | FOLLOWING_DISTANCE | DISTRACTION | SEAT_BELT | COLLISION" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: occurred_at, type: datetime, source: input, description: "When the event occurred; must be <= logical clock" }
      - { name: detected_at, type: datetime, source: system, description: "Logical clock at ingest" }
      - { name: status, type: enum, source: system, description: "DETECTED | IN_REVIEW | CONFIRMED | DISMISSED | RECLASSIFIED | EXONERATED; initial DETECTED", default: DETECTED }
      - { name: upload_priority_score, type: integer, source: computed, description: "Computed at ingest by upload_priority_score rule; immutable afterwards" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical clock of the CONFIRM review; null until confirmed; reset to null on REOPEN" }
      - { name: review_count, type: integer, source: system, description: "Number of review actions applied; starts 0", default: 0 }

  - name: FootageClip
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> SafetyEvent.id" }
      - { name: camera_angle, type: enum, source: input, description: "FORWARD | INWARD | SIDE" }
      - { name: size_mb, type: integer, source: input, description: "Clip size in MB; >= 1" }
      - { name: captured_at, type: datetime, source: input, description: "Capture timestamp; must be <= logical clock" }
      - { name: upload_status, type: enum, source: system, description: "QUEUED | UPLOADING | UPLOADED | PURGED; initial QUEUED (parallel dimension 1)", default: QUEUED }
      - { name: retention_class, type: enum, source: system, description: "STANDARD | COLLISION | LITIGATION_HOLD; initial COLLISION if event_type COLLISION else STANDARD (parallel dimension 2)", default: STANDARD }
      - { name: uploaded_at, type: datetime, source: system, description: "Logical clock at upload-complete; null until UPLOADED" }
      - { name: purged_at, type: datetime, source: system, description: "Logical clock at purge; null until PURGED" }

  - name: ReviewDecision
    parent: null
    common_fields: false
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> SafetyEvent.id" }
      - { name: reviewer_id, type: string, source: system, description: "X-User-ID of the SafetyManager who took the action" }
      - { name: action, type: enum, source: system, description: "CONFIRM | DISMISS | RECLASSIFY | REOPEN" }
      - { name: prior_event_type, type: enum, source: system, description: "event_type before the action" }
      - { name: new_event_type, type: enum, source: system, description: "event_type after the action; null unless RECLASSIFY" }
      - { name: prior_severity, type: enum, source: system, description: "severity before the action" }
      - { name: new_severity, type: enum, source: system, description: "severity after the action; null unless RECLASSIFY" }
      - { name: rationale, type: string, source: system, description: "Reviewer-supplied rationale" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock when the decision was recorded" }

  - name: CoachingSession
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id" }
      - { name: event_id, type: string, source: system, description: "FK -> SafetyEvent.id; the confirmed event being coached" }
      - { name: assigned_by, type: string, source: system, description: "X-User-ID of assigning SafetyManager; SYSTEM when auto-created on CONFIRM" }
      - { name: starts_at, type: datetime, source: input, description: "Session window start (half-open, inclusive)" }
      - { name: ends_at, type: datetime, source: input, description: "Session window end (half-open, exclusive); must be > starts_at" }
      - { name: due_at, type: datetime, source: input, description: "Completion deadline; must be >= ends_at" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | ACKNOWLEDGED | OVERDUE | COMPLETED | CANCELLED; initial ASSIGNED", default: ASSIGNED }
      - { name: outcome, type: enum, source: system, description: "PASS | FAIL; null until COMPLETED" }
      - { name: reassign_count, type: integer, source: system, description: "Number of OVERDUE->ASSIGNED reassignments; starts 0", default: 0 }
      - { name: steward_required, type: boolean, source: computed, description: "True when the terminal has a RATIFIED agreement covering starts_at with coaching_requires_steward_present true" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock at completion; null until COMPLETED" }

  - name: EscalationCase
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id" }
      - { name: trigger_event_id, type: string, source: system, description: "FK -> SafetyEvent.id; the confirmation that crossed the threshold" }
      - { name: offense_count, type: integer, source: system, description: "driver.confirmed_events_90d at the moment the case opened" }
      - { name: window_days, type: integer, source: system, description: "Rolling window used; always 90", default: 90 }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | RESOLVED_ACTION | RESOLVED_NO_ACTION; initial OPEN", default: OPEN }
      - { name: resolution_note, type: string, source: system, description: "Resolution note; null until resolved" }

  - name: ExonerationClaim
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> SafetyEvent.id; must be CONFIRMED COLLISION" }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; set from the event's driver" }
      - { name: claim_ref, type: string, source: input, description: "External claim reference (insurer/claimant)" }
      - { name: police_report_ref, type: string, source: input, description: "Optional police report reference" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | EVIDENCE_REVIEW | EXONERATED | REJECTED; initial SUBMITTED", default: SUBMITTED }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock at submission" }
      - { name: decided_at, type: datetime, source: system, description: "Logical clock at decision; null until decided" }
      - { name: decided_by, type: string, source: system, description: "X-User-ID of deciding ClaimsAdjuster; null until decided" }

  - name: LitigationHold
    parent: null
    common_fields: true
    fields:
      - { name: fleet_id, type: string, source: input, description: "FK -> Fleet.id" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; required when scope DRIVER, null when scope EVENT" }
      - { name: event_id, type: string, source: input, description: "FK -> SafetyEvent.id; required when scope EVENT, null when scope DRIVER" }
      - { name: scope, type: enum, source: input, description: "DRIVER | EVENT" }
      - { name: reason, type: string, source: input, description: "Litigation reason / matter reference" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED; initial ACTIVE", default: ACTIVE }
      - { name: placed_at, type: datetime, source: system, description: "Logical clock at placement" }
      - { name: released_at, type: datetime, source: system, description: "Logical clock at release; null while ACTIVE" }
      - { name: placed_by, type: string, source: system, description: "X-User-ID of placing SafetyManager" }

  - name: SafetyScoreSnapshot
    parent: null
    common_fields: true
    fields:
      - { name: fleet_id, type: string, source: system, description: "FK -> Fleet.id" }
      - { name: scope_type, type: enum, source: input, description: "DRIVER | TERMINAL | FLEET" }
      - { name: scope_id, type: string, source: input, description: "Polymorphic reference (NOT a foreign key): Driver.id when DRIVER, Terminal.id when TERMINAL, null when FLEET" }
      - { name: period_start, type: datetime, source: input, description: "Scoring period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Scoring period end (inclusive); must be >= period_start" }
      - { name: status, type: enum, source: system, description: "PROVISIONAL | FINAL; PROVISIONAL when finalize false, FINAL when finalize true", default: PROVISIONAL }
      - { name: score, type: number, source: computed, description: "Provisional variant when status PROVISIONAL, final variant when status FINAL" }
      - { name: rank, type: integer, source: computed, description: "Driver-scope FINAL snapshots only: rank within fleet+period, 1 = highest score; null otherwise" }
      - { name: computed_at, type: datetime, source: system, description: "Logical clock at computation" }

  - name: IncentiveAward
    parent: null
    common_fields: true
    fields:
      - { name: fleet_id, type: string, source: system, description: "FK -> Fleet.id" }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id" }
      - { name: snapshot_id, type: string, source: system, description: "FK -> SafetyScoreSnapshot.id; snapshot that last priced this award" }
      - { name: period_start, type: datetime, source: system, description: "Copied from snapshot" }
      - { name: period_end, type: datetime, source: system, description: "Copied from snapshot" }
      - { name: tier, type: enum, source: system, description: "GOLD | SILVER | BRONZE | NONE", default: NONE }
      - { name: amount_cents, type: integer, source: system, description: "Priced from tier: GOLD 50000, SILVER 25000, BRONZE 10000, NONE 0", default: 0 }
      - { name: status, type: enum, source: system, description: "PROJECTED | APPROVED | PAID | FORFEITED; initial PROJECTED", default: PROJECTED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Fleet
    field: posture
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: INCIDENT_LOCKDOWN
        trigger: "POST /api/fleets/{id}/posture"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Increments Fleet.version; no child state changes (gate-only posture)"
      - from: INCIDENT_LOCKDOWN
        to: NORMAL
        trigger: "POST /api/fleets/{id}/posture"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Increments Fleet.version"

  - entity: UnionAgreement
    field: status
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: RATIFIED
        trigger: "POST /api/union-agreements/{id}/ratify"
        actor: PlatformAdmin
        preconditions:
          - "No other RATIFIED agreement for the same terminal whose closed window [effective_from, effective_until] shares any instant with this window (touching endpoints count as overlap)"
        side_effects:
          - "Increments UnionAgreement.version"
      - from: RATIFIED
        to: EXPIRED
        trigger: "POST /api/union-agreements/{id}/expire"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Increments UnionAgreement.version"

  - entity: Driver
    field: status
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/drivers/{id}/status (to_status SUSPENDED)"
        actor: SafetyManager
        preconditions: []
        side_effects: ["Increments Driver.version"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/drivers/{id}/status (to_status ACTIVE)"
        actor: SafetyManager
        preconditions: []
        side_effects: ["Increments Driver.version"]
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /api/drivers/{id}/status (to_status INACTIVE)"
        actor: SafetyManager
        preconditions: []
        side_effects: ["Increments Driver.version"]
      - from: SUSPENDED
        to: INACTIVE
        trigger: "POST /api/drivers/{id}/status (to_status INACTIVE)"
        actor: SafetyManager
        preconditions: []
        side_effects: ["Increments Driver.version"]
      - from: ACTIVE
        to: COACHING_HOLD
        trigger: "system (EscalationCase opened by confirmed_events_90d threshold crossing)"
        actor: system
        preconditions:
          - "Driver.confirmed_events_90d transitions from 2 to >= 3 as a result of the current CONFIRM"
        side_effects: ["Increments Driver.version"]
      - from: COACHING_HOLD
        to: ACTIVE
        trigger: "system (EscalationCase resolved CLOSED_NO_ACTION, or exoneration drops confirmed_events_90d below 3 with no OPEN/UNDER_REVIEW cases left)"
        actor: system
        preconditions:
          - "No EscalationCase for this driver in status OPEN or UNDER_REVIEW"
        side_effects: ["Increments Driver.version"]
      - from: COACHING_HOLD
        to: SUSPENDED
        trigger: "system (EscalationCase resolved ACTION_TAKEN)"
        actor: system
        preconditions: []
        side_effects: ["Increments Driver.version"]

  - entity: Vehicle
    field: status
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /api/vehicles/{id}/decommission"
        actor: PlatformAdmin
        preconditions:
          - "No SafetyEvent for this vehicle in status DETECTED or IN_REVIEW"
        side_effects: ["Increments Vehicle.version"]

  - entity: CameraPolicy
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/camera-policies/{id}/activate"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "The fleet's previously ACTIVE CameraPolicy (if any) transitions ACTIVE -> ARCHIVED in the same request"
          - "Increments this CameraPolicy.version"
      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /api/camera-policies/{id}/archive"
        actor: PlatformAdmin
        preconditions: []
        side_effects: ["Increments CameraPolicy.version"]
      - from: ACTIVE
        to: ARCHIVED
        trigger: "system (another policy of the same fleet is activated)"
        actor: system
        preconditions: []
        side_effects: ["Increments CameraPolicy.version"]

  - entity: SafetyEvent
    field: status
    initial_state: DETECTED
    terminal_states: [EXONERATED]
    transitions:
      - from: DETECTED
        to: IN_REVIEW
        trigger: "system (first FootageClip of this event reaches upload_status UPLOADED)"
        actor: system
        preconditions: []
        side_effects:
          - "Increments SafetyEvent.version"
          - "Recompute driver.safety_score_provisional (IN_REVIEW events enter the provisional input set)"
      - from: IN_REVIEW
        to: CONFIRMED
        trigger: "POST /api/safety-events/{id}/review (action CONFIRM)"
        actor: SafetyManager
        preconditions:
          - "Fleet.posture == NORMAL (else ERR_FLEET_LOCKED)"
          - "Driver.status IN {ACTIVE, COACHING_HOLD} (else ERR_DRIVER_NOT_ACTIVE)"
          - "Inward privacy gate (see validations priority 7)"
        side_effects:
          - "Append ReviewDecision(action CONFIRM); review_count += 1; confirmed_at = logical clock; version += 1"
          - "Cascade link 1: if severity IN {HIGH, CRITICAL}, auto-create CoachingSession(ASSIGNED, assigned_by SYSTEM, starts_at = clock, ends_at = clock + 7 days, due_at = clock + 7 days); auto-created sessions are exempt from the session-window overlap rule"
          - "Cascade link 2: recompute driver.confirmed_events_90d and both score variants"
          - "Cascade link 3: if confirmed_events_90d crosses to >= 3 (was 2 before this confirm), auto-open EscalationCase(OPEN, trigger_event_id = this event, offense_count = new count)"
          - "Cascade link 4: that EscalationCase opening transitions Driver.status ACTIVE -> COACHING_HOLD"
      - from: IN_REVIEW
        to: DISMISSED
        trigger: "POST /api/safety-events/{id}/review (action DISMISS)"
        actor: SafetyManager
        preconditions: []
        side_effects:
          - "Append ReviewDecision(action DISMISS); review_count += 1; version += 1"
          - "Recompute driver.safety_score_provisional (event leaves the provisional input set)"
      - from: IN_REVIEW
        to: RECLASSIFIED
        trigger: "POST /api/safety-events/{id}/review (action RECLASSIFY)"
        actor: SafetyManager
        preconditions:
          - "new_event_type or new_severity supplied and different from current"
        side_effects:
          - "Apply new_event_type / new_severity; append ReviewDecision(action RECLASSIFY); review_count += 1; version += 1"
      - from: RECLASSIFIED
        to: IN_REVIEW
        trigger: "POST /api/safety-events/{id}/review (action REOPEN)"
        actor: SafetyManager
        preconditions: []
        side_effects:
          - "Append ReviewDecision(action REOPEN); review_count += 1; confirmed_at unchanged (null); version += 1"
      - from: DISMISSED
        to: IN_REVIEW
        trigger: "POST /api/safety-events/{id}/review (action REOPEN)"
        actor: SafetyManager
        preconditions: []
        side_effects:
          - "Append ReviewDecision(action REOPEN); review_count += 1; version += 1"
      - from: CONFIRMED
        to: EXONERATED
        trigger: "system (ExonerationClaim decided EXONERATE)"
        actor: system
        preconditions:
          - "The claim references this event and its decision is EXONERATE"
        side_effects:
          - "confirmed_at reset to null; version += 1"
          - "Recompute driver.confirmed_events_90d and both score variants (exonerated events leave the final input set)"
          - "Compensation: CoachingSessions with event_id = this event in status ASSIGNED, ACKNOWLEDGED or OVERDUE transition to CANCELLED"
          - "Compensation: if the event's exoneration drops confirmed_events_90d below 3, every EscalationCase for this driver in status OPEN or UNDER_REVIEW whose window included this event auto-transitions to RESOLVED_NO_ACTION; if no OPEN/UNDER_REVIEW cases remain, Driver.status COACHING_HOLD -> ACTIVE"

  - entity: FootageClip
    field: upload_status
    note: "Parallel state dimensions on one row: upload_status (QUEUED->UPLOADING->UPLOADED->PURGED) evolves independently of retention_class (STANDARD|COLLISION<->LITIGATION_HOLD). A transition on one dimension never changes the other."
    initial_state: QUEUED
    terminal_states: [PURGED]
    transitions:
      - from: QUEUED
        to: UPLOADING
        trigger: "POST /api/footage-clips/{id}/upload-begin"
        actor: TelematicsIngest
        preconditions: []
        side_effects: ["Increments FootageClip.version"]
      - from: UPLOADING
        to: UPLOADED
        trigger: "POST /api/footage-clips/{id}/upload-complete"
        actor: TelematicsIngest
        preconditions:
          - "An ACTIVE CameraPolicy exists for the fleet (else ERR_ACTIVE_POLICY_REQUIRED)"
          - "daily_upload_bytes + size_mb <= policy.daily_upload_cap_mb (equality allowed; else ERR_DAILY_UPLOAD_CAP_EXCEEDED)"
        side_effects:
          - "uploaded_at = logical clock; version += 1"
          - "Fleet.retention_used_mb += size_mb"
          - "Bubble up: if this is the event's first UPLOADED clip, SafetyEvent DETECTED -> IN_REVIEW"
      - from: UPLOADED
        to: PURGED
        trigger: "POST /api/footage-clips/{id}/purge"
        actor: SafetyManager
        preconditions:
          - "No ACTIVE LitigationHold whose scope covers this clip's event or its driver (else ERR_LITIGATION_HOLD_ACTIVE)"
          - "Retention expired: retention_class STANDARD and clock >= captured_at + active policy retention_days_standard, OR retention_class COLLISION and clock >= captured_at + retention_days_collision (boundary inclusive; else ERR_RETENTION_NOT_EXPIRED). LITIGATION_HOLD class is never purgeable."
        side_effects:
          - "purged_at = logical clock; version += 1"
          - "Fleet.retention_used_mb -= size_mb"
      - from: "STANDARD or COLLISION (retention_class)"
        to: LITIGATION_HOLD (retention_class)
        trigger: "system (LitigationHold placed covering this clip)"
        actor: system
        preconditions: ["upload_status != PURGED"]
        side_effects: ["Increments FootageClip.version; upload_status untouched"]
      - from: LITIGATION_HOLD (retention_class)
        to: "STANDARD or COLLISION (retention_class)"
        trigger: "system (covering LitigationHold released)"
        actor: system
        preconditions: ["No other ACTIVE hold covers this clip"]
        side_effects:
          - "Increments FootageClip.version; upload_status untouched"
          - "Revert deterministically by event_type: COLLISION events -> COLLISION, all others -> STANDARD"

  - entity: CoachingSession
    field: status
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: ACKNOWLEDGED
        trigger: "POST /api/coaching-sessions/{id}/acknowledge"
        actor: Driver
        preconditions:
          - "X-User-ID equals session.driver_id (else ERR_FORBIDDEN)"
        side_effects: ["Increments CoachingSession.version"]
      - from: ASSIGNED
        to: OVERDUE
        trigger: "system (run-maintenance finds due_at < logical clock)"
        actor: system
        preconditions: []
        side_effects: ["Increments CoachingSession.version"]
      - from: ACKNOWLEDGED
        to: OVERDUE
        trigger: "system (run-maintenance finds due_at < logical clock)"
        actor: system
        preconditions: []
        side_effects: ["Increments CoachingSession.version"]
      - from: OVERDUE
        to: ASSIGNED
        trigger: "POST /api/coaching-sessions/{id}/reassign"
        actor: SafetyManager
        preconditions:
          - "New window does not overlap the driver's other occupying sessions"
        side_effects:
          - "reassign_count += 1; starts_at/ends_at/due_at replaced; version += 1"
      - from: ACKNOWLEDGED
        to: COMPLETED
        trigger: "POST /api/coaching-sessions/{id}/complete"
        actor: SafetyManager
        preconditions:
          - "Fleet.posture == NORMAL (else ERR_FLEET_LOCKED)"
        side_effects:
          - "outcome and completed_at set; version += 1"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /api/coaching-sessions/{id}/cancel or system (event exonerated)"
        actor: SafetyManager
        preconditions: []
        side_effects: ["Increments CoachingSession.version"]
      - from: OVERDUE
        to: CANCELLED
        trigger: "POST /api/coaching-sessions/{id}/cancel or system (event exonerated)"
        actor: SafetyManager
        preconditions: []
        side_effects: ["Increments CoachingSession.version"]

  - entity: EscalationCase
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED_ACTION, RESOLVED_NO_ACTION]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /api/escalation-cases/{id}/review"
        actor: SafetyManager
        preconditions: []
        side_effects: ["Increments EscalationCase.version"]
      - from: UNDER_REVIEW
        to: OPEN
        trigger: "POST /api/escalation-cases/{id}/send-back"
        actor: SafetyManager
        preconditions: []
        side_effects: ["Increments EscalationCase.version"]
      - from: UNDER_REVIEW
        to: RESOLVED_ACTION
        trigger: "POST /api/escalation-cases/{id}/resolve (resolution ACTION_TAKEN)"
        actor: SafetyManager
        preconditions: []
        side_effects:
          - "resolution_note set; version += 1"
          - "Driver.status COACHING_HOLD -> SUSPENDED"
      - from: UNDER_REVIEW
        to: RESOLVED_NO_ACTION
        trigger: "POST /api/escalation-cases/{id}/resolve (resolution CLOSED_NO_ACTION) or system (exoneration compensation)"
        actor: SafetyManager
        preconditions: []
        side_effects:
          - "resolution_note set; version += 1"
          - "If no other OPEN/UNDER_REVIEW cases for the driver: Driver.status COACHING_HOLD -> ACTIVE"

  - entity: ExonerationClaim
    field: status
    initial_state: SUBMITTED
    terminal_states: [EXONERATED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: EVIDENCE_REVIEW
        trigger: "POST /api/exoneration-claims/{id}/begin-review"
        actor: ClaimsAdjuster
        preconditions: []
        side_effects: ["Increments ExonerationClaim.version"]
      - from: EVIDENCE_REVIEW
        to: EXONERATED
        trigger: "POST /api/exoneration-claims/{id}/decide (decision EXONERATE)"
        actor: ClaimsAdjuster
        preconditions:
          - "Segregation of duties: X-User-ID must differ from the reviewer_id on the ReviewDecision that last confirmed the event (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_at / decided_by set; version += 1"
          - "SafetyEvent CONFIRMED -> EXONERATED with its full compensation cascade (see SafetyEvent machine)"
      - from: EVIDENCE_REVIEW
        to: REJECTED
        trigger: "POST /api/exoneration-claims/{id}/decide (decision REJECT)"
        actor: ClaimsAdjuster
        preconditions:
          - "Segregation of duties: X-User-ID must differ from the confirming reviewer_id"
        side_effects:
          - "decided_at / decided_by set; version += 1; event untouched"

  - entity: LitigationHold
    field: status
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /api/litigation-holds/{id}/release"
        actor: SafetyManager
        preconditions: []
        side_effects:
          - "released_at = logical clock; version += 1"
          - "Cascade: every covered FootageClip with retention_class LITIGATION_HOLD and no other ACTIVE covering hold reverts to its deterministic class (COLLISION events -> COLLISION, else STANDARD)"

  - entity: SafetyScoreSnapshot
    field: status
    initial_state: PROVISIONAL
    terminal_states: [FINAL]
    transitions:
      - from: PROVISIONAL
        to: FINAL
        trigger: "POST /api/fleets/{id}/score-snapshots/compute with finalize true creates the FINAL row directly; a snapshot row itself never mutates status after creation"
        actor: FleetAdmin
        preconditions:
          - "Fleet.posture == NORMAL (else ERR_FLEET_LOCKED)"
        side_effects:
          - "DRIVER scope: upsert IncentiveAward for (driver, period) — create PROJECTED or recompute amount_cents/tier in place; if recomputed tier is NONE, award transitions PROJECTED -> FORFEITED"
          - "DRIVER scope FINAL: recompute rank across all FINAL driver snapshots of the same fleet+period (score DESC, tie: fewer period-confirmed events ASC, tie: driver.created_at ASC)"

  - entity: IncentiveAward
    field: status
    initial_state: PROJECTED
    terminal_states: [PAID, FORFEITED]
    transitions:
      - from: PROJECTED
        to: APPROVED
        trigger: "POST /api/incentive-awards/{id}/approve"
        actor: FleetAdmin
        preconditions:
          - "The award's snapshot is FINAL (else ERR_SNAPSHOT_NOT_FINAL)"
          - "tier != NONE"
        side_effects: ["Increments IncentiveAward.version"]
      - from: PROJECTED
        to: FORFEITED
        trigger: "system (a FINAL snapshot recomputes the tier to NONE)"
        actor: system
        preconditions: []
        side_effects: ["Increments IncentiveAward.version"]
      - from: APPROVED
        to: PAID
        trigger: "POST /api/incentive-awards/{id}/pay"
        actor: FleetAdmin
        preconditions:
          - "sum(amount_cents over fleet awards in status APPROVED or PAID) <= fleet.incentive_budget_cents after this payment (equality allowed; else ERR_INCENTIVE_BUDGET_EXCEEDED)"
        side_effects: ["Increments IncentiveAward.version"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: event-review-stale-version
    parent_entity: SafetyEvent
    write_endpoint: "POST /api/safety-events/{id}/review"
    occ_field: expected_event_version
    description: |
      A review action carrying an expected_event_version that no longer equals
      the event's current version is rejected. This captures the case where a
      prior review action (or the auto-transition to IN_REVIEW) has advanced
      the event since the client last observed it, so the client's view of the
      review state is stale.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412
  - rule_id: camera-policy-update-stale-version
    parent_entity: CameraPolicy
    write_endpoint: "PATCH /api/camera-policies/{id}"
    occ_field: expected_policy_version
    description: |
      A policy patch carrying an expected_policy_version that no longer equals
      the policy's current version is rejected. This captures the case where a
      prior patch or status transition has advanced the policy since the client
      last observed it.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: upload_priority_score
    trigger: "SafetyEvent ingest (POST /api/safety-events); computed once, stored, never recomputed"
    algorithm: weighted_scoring
    formula: |
      age_hours = (detected_at - occurred_at) in whole hours (floor of seconds/3600)
      age_step = 4 if age_hours <= 6; else 2 if age_hours <= 24; else 1
      base = SEVERITY_WEIGHT[severity] * age_step * TIER_MULT[vehicle.bandwidth_tier]
      score = base + COLLISION_BOOST if event_type == COLLISION else base
      Review queue ordering (GET /api/fleets/{id}/safety-events): score DESC,
      tie -> occurred_at ASC, tie -> created_at ASC. id is never a tie-break input.
    input_set: "The ingested SafetyEvent plus its Vehicle.bandwidth_tier"
    constants:
      SEVERITY_WEIGHT: { LOW: 1, MEDIUM: 3, HIGH: 6, CRITICAL: 10 }
      TIER_MULT: { LOW: 1, STANDARD: 2, HIGH: 3 }
      COLLISION_BOOST: 1000
    precision: "integer arithmetic; no rounding"

  - name: driver_safety_score
    trigger: "Computed on read for Driver; recomputed after every review action, exoneration decision, clock move observed via run-maintenance; snapshot rows freeze the value at compute time"
    algorithm: aggregation
    formula: |
      For each SafetyEvent of the driver with occurred_at in [clock - 90d, clock] (inclusive):
        age_factor = 1.00 if (clock - occurred_at) <= 30 days exactly
                     else 0.33 if (clock - occurred_at) <= 90 days exactly
                     else EXCLUDE the event
        raw_penalty = SEVERITY_WEIGHT[event.severity] * PENALTY_FACTOR * age_factor
        per_event_penalty = round_half_up(raw_penalty, 2)        # ROUND PER EVENT FIRST
      total_penalty = sum(per_event_penalty)                     # THEN SUM (pinned order)
      score = clamp(100 - total_penalty, 0, 100)                 # exact 2dp decimal
      Input set by variant:
        provisional: event.status IN {IN_REVIEW, CONFIRMED, RECLASSIFIED}
        final:       event.status == CONFIRMED
      DISMISSED, EXONERATED and DETECTED events are excluded from both variants.
    input_set: "Driver's SafetyEvents filtered by variant-specific status set and rolling 90-day window"
    constants:
      SEVERITY_WEIGHT: { LOW: 1, MEDIUM: 3, HIGH: 6, CRITICAL: 10 }
      PENALTY_FACTOR: 2.5
      AGED_FACTOR: 0.33
      AGED_AFTER_DAYS: 30
      WINDOW_DAYS: 90
    precision: "2 decimal places, round_half_up; per-event rounding BEFORE summation (sum-then-round is the rejected order)"
    variants:
      - name: provisional
        when: "Live operational view, review queue, projected incentive pricing"
        difference: "Includes IN_REVIEW and RECLASSIFIED events at their current severity; final does not"
      - name: final
        when: "Season close, finalized snapshots, leaderboard, incentive payouts"
        difference: "Includes only CONFIRMED events; identical inputs yield a higher-or-equal score than provisional"

  - name: terminal_safety_score
    trigger: "Computed on read for Terminal.safety_score_cached and TERMINAL-scope snapshots"
    algorithm: aggregation
    formula: |
      score = round_half_up(mean(driver.safety_score_final over drivers of the terminal
              with status IN {ACTIVE, SUSPENDED, COACHING_HOLD}), 2)
      Empty driver set -> 100.00. INACTIVE drivers are excluded.
    input_set: "Terminal's non-INACTIVE drivers"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: fleet_safety_score
    trigger: "Computed for FLEET-scope snapshots"
    algorithm: aggregation
    formula: |
      score = round_half_up(mean(terminal_safety_score over terminals having at least
              one non-INACTIVE driver), 2)
      Fleet with no such terminal -> 100.00.
    input_set: "Fleet's terminals with at least one non-INACTIVE driver"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: leaderboard_rank
    trigger: "Creation of a DRIVER-scope FINAL snapshot (POST /api/fleets/{id}/score-snapshots/compute with finalize true)"
    algorithm: aggregation
    formula: |
      Candidate set: all DRIVER-scope FINAL snapshots of the same fleet with the same
      period_start and period_end.
      rank = 1 + count of candidates with (score > mine)
             OR (score == mine AND their period-confirmed-event-count < mine)
             OR (score == mine AND equal counts AND their driver.created_at < mine)
      period-confirmed-event-count = driver's SafetyEvents status CONFIRMED with
      occurred_at in [period_start, period_end] inclusive.
      id is never a tie-break input.
    input_set: "DRIVER-scope FINAL snapshots, same fleet, same period"
    constants: {}
    precision: "integer ranks, dense from 1"

  - name: incentive_pricing
    trigger: "DRIVER-scope snapshot compute (provisional prices a PROJECTED award; final reprices it in place)"
    algorithm: threshold
    formula: |
      tier = GOLD   if score >= 95.00
             SILVER if score >= 90.00
             BRONZE if score >= 80.00
             NONE   otherwise
      amount_cents = TIER_AMOUNT[tier]
      Boundary is inclusive on the threshold: 95.00 is GOLD, 94.99 is SILVER.
    input_set: "The snapshot's score field"
    constants:
      GOLD_MIN: 95.00
      SILVER_MIN: 90.00
      BRONZE_MIN: 80.00
      TIER_AMOUNT: { GOLD: 50000, SILVER: 25000, BRONZE: 10000, NONE: 0 }
    precision: "score compared at exactly 2dp; amounts are integer cents"
    variants:
      - name: projected
        when: "Award created/updated from a PROVISIONAL snapshot"
        difference: "Prices off the provisional score (includes unreviewed events), so the projected amount can differ from the final amount for identical period data"
      - name: final
        when: "Award repriced from a FINAL snapshot"
        difference: "Prices off the final score; recomputed tier NONE forfeits the award"

  - name: confirmed_events_90d
    trigger: "Every CONFIRM review and every EXONERATE decision touching the driver"
    algorithm: threshold
    formula: |
      count = number of driver's SafetyEvents with status == CONFIRMED and
              occurred_at in [clock - 90d, clock] (inclusive both ends)
      ESCALATION when a CONFIRM review moves count from 2 to >= 3:
        open EscalationCase(OPEN) and move Driver ACTIVE -> COACHING_HOLD.
      Boundary: exactly 90 days old counts (inclusive); the third event triggers
      (>= 3), the second does not.
    input_set: "Driver's CONFIRMED SafetyEvents in the rolling window"
    constants:
      ESCALATION_THRESHOLD: 3
      WINDOW_DAYS: 90
    precision: "integer count"

  - name: daily_upload_bytes
    trigger: "POST /api/footage-clips/{id}/upload-complete"
    algorithm: threshold
    formula: |
      used_mb = sum(size_mb) over FootageClips of the fleet with
                uploaded_at on the same UTC calendar day as the logical clock
      admitted iff used_mb + clip.size_mb <= ACTIVE policy.daily_upload_cap_mb
      Equality is admitted (<=, not <).
    input_set: "Fleet's clips already UPLOADED on the current UTC day"
    constants: {}
    precision: "integer MB"

  - name: retention_used_bytes
    trigger: "Clip upload-complete (+size_mb) and purge (-size_mb); hold place/release leaves it unchanged"
    algorithm: aggregation
    formula: |
      Fleet.retention_used_mb = sum(size_mb) over FootageClips of the fleet's events
      with upload_status != PURGED
    input_set: "Fleet's non-PURGED FootageClips"
    constants: {}
    precision: "integer MB"

  - name: coaching_overdue_sweep
    trigger: "POST /api/fleets/{id}/run-maintenance"
    algorithm: chronological
    formula: |
      ops_run_index += 1
      For each CoachingSession of the fleet with status IN {ASSIGNED, ACKNOWLEDGED}
      and due_at < logical clock (strictly past; due_at == clock is NOT overdue):
        status -> OVERDUE (process in order: due_at ASC, tie -> created_at ASC)
    input_set: "Fleet's occupying (non-terminal) CoachingSessions past due"
    constants: {}
    precision: "datetime comparison at second precision"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles; ownership rules (Driver acknowledges only own sessions, submits claims only for own events)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Request body is valid JSON; all required fields present; enum fields hold declared members; datetime fields parse; integer ranges respected; starts_at < ends_at; due_at >= ends_at"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints with a body"

  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right, each 404 with the resource-specific error"
    error_id: ERR_NOT_FOUND_GENERIC
    http_status: 404
    applies_to: "all endpoints with path ids (resolved to ERR_FLEET_NOT_FOUND / ERR_TERMINAL_NOT_FOUND / etc. by segment)"

  - priority: 5
    category: existence
    check: "Body foreign keys exist, checked in the order the endpoint's input list declares them"
    error_id: ERR_NOT_FOUND_GENERIC
    http_status: 404
    applies_to: "create endpoints with body FKs (resolved to ERR_TERMINAL_NOT_FOUND / ERR_DRIVER_NOT_FOUND / ERR_EVENT_NOT_FOUND / etc. by field)"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition exists (review requires IN_REVIEW/RECLASSIFIED/DISMISSED per action; acknowledge requires ASSIGNED; complete requires ACKNOWLEDGED; decide requires EVIDENCE_REVIEW; purge requires UPLOADED; etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Privacy/union gate: registering or reviewing an event with an INWARD FootageClip requires the fleet's ACTIVE policy inward_capture_enabled true AND (no RATIFIED agreement covers the driver's terminal at the logical clock OR that agreement's inward_camera_allowed is true) AND driver.inward_camera_consent is true. Segregation of duties on exoneration decide is also checked here."
    error_id: ERR_INWARD_FOOTAGE_RESTRICTED
    http_status: 422
    applies_to: "POST /api/footage-clips (INWARD), POST /api/safety-events/{id}/review; ERR_SEGREGATION_OF_DUTIES (403) on POST /api/exoneration-claims/{id}/decide; ERR_LITIGATION_HOLD_ACTIVE (409) on purge is checked here too"

  - priority: 8
    category: business_temporal
    check: "Window rules: exoneration claim submitted at clock <= confirmed_at + 30 days inclusive (else ERR_EXONERATION_WINDOW_EXPIRED); occurred_at / captured_at must not be after the logical clock (else ERR_EVENT_IN_FUTURE); manual coaching session window [starts_at, ends_at) must not overlap the driver's other occupying sessions (adjacency allowed; else ERR_SESSION_WINDOW_OVERLAP); union agreement ratify window [effective_from, effective_until] must not share any instant with another RATIFIED agreement of the same terminal, touching endpoints count as overlap (else ERR_AGREEMENT_WINDOW_OVERLAP)"
    error_id: ERR_EXONERATION_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /api/safety-events/{id}/exoneration-claims; POST /api/drivers/{id}/coaching-sessions; POST /api/coaching-sessions/{id}/reassign; POST /api/union-agreements/{id}/ratify"

  - priority: 9
    category: business_referential
    check: "Referenced-entity state: event CONFIRM requires Driver.status IN {ACTIVE, COACHING_HOLD} (ERR_DRIVER_NOT_ACTIVE) and Fleet.posture NORMAL (ERR_FLEET_LOCKED); claim submit requires event CONFIRMED and event_type COLLISION (ERR_CLAIM_REQUIRES_CONFIRMED_COLLISION); session create requires event CONFIRMED (ERR_EVENT_NOT_CONFIRMED); award approve requires FINAL snapshot (ERR_SNAPSHOT_NOT_FINAL); upload-complete requires an ACTIVE policy (ERR_ACTIVE_POLICY_REQUIRED)"
    error_id: ERR_DRIVER_NOT_ACTIVE
    http_status: 409
    applies_to: "review CONFIRM; claim submit; session create; award approve; upload-complete"

  - priority: 10
    category: business_constraint
    check: "Uniqueness/capacity: daily upload cap (ERR_DAILY_UPLOAD_CAP_EXCEEDED); one ACTIVE LitigationHold per driver and per event (ERR_ACTIVE_HOLD_EXISTS); one ACTIVE CameraPolicy per fleet is maintained by activate's auto-archive (manual archive of the ACTIVE policy rejected, ERR_POLICY_IN_USE); detection-disabled event types rejected (ERR_EVENT_TYPE_DISABLED); duplicate non-REJECTED claim per event (ERR_DUPLICATE_CLAIM); employee_ref and vin unique per fleet (ERR_DUPLICATE_RESOURCE)"
    error_id: ERR_DAILY_UPLOAD_CAP_EXCEEDED
    http_status: 422
    applies_to: "upload-complete; holds create; policy archive; event ingest; claim submit; driver/vehicle create"

  - priority: 11
    category: business_fiscal
    check: "Incentive budget: paying an award keeps sum(APPROVED + PAID amounts) <= fleet.incentive_budget_cents"
    error_id: ERR_INCENTIVE_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /api/incentive-awards/{id}/pay"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; declared first-class) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Sets the logical clock. Before any call the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: []

  # --- Fleet ---
  - method: POST
    path: "/api/fleets"
    description: "Create a fleet"
    roles: [PlatformAdmin]
    code: 201
    input: [name, incentive_budget_cents]
    output: Fleet
    side_effects: ["posture NORMAL, ops_run_index 0, retention_used_mb 0"]
  - method: GET
    path: "/api/fleets/{id}"
    description: "Get a fleet"
    roles: [PlatformAdmin, SafetyManager, ClaimsAdjuster, Driver, TelematicsIngest, FleetAdmin]
    code: 200
    input: []
    output: Fleet
    side_effects: []
  - method: POST
    path: "/api/fleets/{id}/posture"
    description: "Set fleet posture NORMAL | INCIDENT_LOCKDOWN"
    roles: [PlatformAdmin]
    code: 200
    input: [posture, "note?"]
    output: Fleet
