          difficulty_instance: compensating_invariant / dispute_reversal_and_goodwill_credit_return_the_redemption_ledger_to_zero
          rationale: "That §1.8 instance verifies the 201.5 -> 202 half-up rounding of employer_share_cents on the 8396 line and then reverses exactly 202, so both the rounding mode and its reversal precision are already asserted."

