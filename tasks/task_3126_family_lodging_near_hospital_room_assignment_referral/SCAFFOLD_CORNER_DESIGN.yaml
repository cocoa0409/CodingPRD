      - name: distribute_from_depleted_donation_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=4]', errors.ERR_DONATION_DEPLETED]
        distinguishing_aspect: "Once a donation is DEPLETED (distributed to zero), further distribution fails ERR_DONATION_DEPLETED (state), distinct from ERR_INSUFFICIENT_SUPPLY (quantity)."
        test_recipe:
          setup:
            - "House with a 4-unit PANTRY_STAPLE donation fully distributed (status DEPLETED)."
          setup_api_calls:
            - call: "POST /api/hospitals"
              payload: { name: "County Children's", city: "Springfield" }
              as: ProgramAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /api/houses"
              payload: { name: "Oak House", city: "Springfield", associated_hospital_id: "${hosp_id}" }
              as: ProgramAdmin
              captures: { house_id: $.data.id }
            - call: "POST /api/houses/${house_id}/in-kind-donations"
              payload: { donor_name: "Rotary Club", supply_category: "PANTRY_STAPLE", quantity_received: 4 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { don_id: $.data.id }
            - call: "POST /api/in-kind-donations/${don_id}/distribute"
              payload: { quantity: 4 }
              as: HouseManager
              as_user_id: "hm-1"
          trigger:
            - call: "POST /api/in-kind-donations/${don_id}/distribute"
              payload: { quantity: 1 }
              as: HouseManager
              as_user_id: "hm-1"
              captures: { err: $.data.error_id }
          assert:
            - "distributing exactly the remaining 4 units succeeded and set status DEPLETED"
            - "the follow-up distribution is rejected: status 409 and error_id == ERR_DONATION_DEPLETED (not ERR_INSUFFICIENT_SUPPLY)"
            - "InKindDonation.${don_id}.quantity_distributed == 4"

      - name: distribute_more_than_remaining_rejected
        claim_type: violation_to_error
        grounds: ['validations[priority=9]', errors.ERR_INSUFFICIENT_SUPPLY]
        distinguishing_aspect: "Distributing remaining+1 units from a RECEIVED donation fails ERR_INSUFFICIENT_SUPPLY while distributing exactly remaining succeeds — a quantity boundary at the donation level."
        test_recipe:
          setup:
            - "House with a 5-unit BABY_SUPPLY donation, status RECEIVED."
          setup_api_calls:
            - call: "POST /api/hospitals"
