          assert:
            - "the captured pre-trigger values are ${frank_posture_before} == INCOMPLETE and ${frank_status_before} == PENDING_CREDENTIALING"
            - "Credential.${cred_frank_coi_id}.status == VERIFIED"
            - "VendorRep.${rep_frank_id}.credential_posture == COMPLIANT"
            - "VendorRep.${rep_frank_id}.access_status == CREDENTIALED"
            - "VendorRep.${rep_frank_id}.ever_credentialed == true"
            - "VendorRep.${rep_frank_id}.suspension_reason == NONE"
