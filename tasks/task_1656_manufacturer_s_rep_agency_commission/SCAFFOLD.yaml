# =============================================================================
# SCAFFOLD.yaml — Manufacturer's Rep Agency & Commission Splits (task 1656)
# §1.0–§1.7 seed tables. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Manufacturer's Rep Agency & Commission Splits (independent rep firm): line card &
  territory agreement, order attribution (specify vs ship-to) & split rules, commission
  rate by product family & chargeback on returns, quota & line termination notice,
  project registration & protection period, sample/demo inventory, multi-rep
  collaboration split, statement reconciliation with principals.

domain_name: manufacturer-rep-agency-commission
api_prefix: /rep-agency

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation        # agency commission ledger vs principal statements
  secondary_archetype: temporal_windowing         # protection windows, notice periods, checkout buffers
  complexity_layers:
    - optimistic_concurrency                      # OCC on Principal.version and Order.version
    - cascading_side_effects                      # RMA receipt -> entry -> balance -> hold; termination sweep chain
    - dual_variant_calculation                    # chargeback original-vs-current rate; accrual-vs-cash expectation
    - rate_threshold_triggers                     # quota attainment tiers at exact breakpoints
  entity_topology: flat                           # peer entities joined by FK references, no URL nesting for reads
  state_machine_shape: cyclic                     # registration resubmit/renew loop, statement dispute loop, sample checkout loop
  relationship_patterns:
    - one_to_many                                 # Principal -> TerritoryAgreement / RateSchedule / CommissionStatement
    - many_to_many                                # OrderSplit junctions Order x Rep (per order line)
    - cross_aggregate                             # CommissionEntry references Order/Rep/Principal/Statement across aggregates
  role_model: segregation_of_duties               # Rep submits registrations, PrincipalOps approves; PrincipalOps uploads statements, AgencyAdmin settles
  consistency_model: immediate                    # every mutation + its cascades commit atomically in the request

# =============================================================================
# 1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Principal
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Manufacturer name" }
      - { name: annual_quota_cents, type: integer, source: input, description: "Annual sales quota the agency must hit on this line, in cents" }
      - { name: notice_period_days, type: integer, source: input, default: 90, description: "Days between termination notice and effective termination" }
      - { name: status, type: enum, source: system, description: "ACTIVE | NOTICE_PENDING | TERMINATED", constraints: "initial ACTIVE; NOTICE_PENDING after issue_termination_notice; TERMINATED by clock sweep at termination_effective_at" }
      - { name: termination_notice_issued_at, type: datetime, source: system, description: "Clock time when termination notice was issued; null until issued" }
      - { name: termination_effective_at, type: datetime, source: computed, description: "= termination_notice_issued_at + notice_period_days; null until issued" }
      - { name: credited_ytd_sales_cents, type: integer, source: computed, description: "Net invoiced sales credited toward quota for ytd_year; accumulates order line amounts at invoice time, reduced by return credits at RMA receipt" }
      - { name: ytd_year, type: integer, source: system, description: "Calendar year credited_ytd_sales_cents covers; initialized to clock year at creation; reset by clock sweep on year rollover" }

  - name: TerritoryAgreement
    parent: Principal
    common_fields: true
    fields:
      - { name: principal_id, type: string, source: system, description: "FK -> Principal.id; owning principal (path-scoped)" }
      - { name: territory_codes, type: array, source: input, description: "Sales territory codes this line card covers (e.g. [\"CA\",\"OR\"])" }
      - { name: exclusive, type: boolean, source: input, default: true, description: "Whether the agency is the exclusive rep in these territories" }
      - { name: specify_share_bp, type: integer, source: input, default: 6000, description: "Default basis-point share of the specifying rep when spec rep differs from ship-to rep (10000 = 100%)" }
      - { name: registered_protection_share_bp, type: integer, source: input, default: 10000, description: "Share the protected registered rep receives on protected lines" }
      - { name: effective_start, type: datetime, source: input, description: "Agreement effective start" }
      - { name: effective_end, type: datetime, source: input, description: "Optional agreement end; null = open-ended" }
      - { name: tail_period_days, type: integer, source: input, default: 180, description: "Days after termination effective date during which pre-termination orders may still be invoiced (tail commission)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED | EXPIRED", constraints: "at most one ACTIVE agreement per principal" }

  - name: RateSchedule
    parent: Principal
    common_fields: true
    fields:
      - { name: principal_id, type: string, source: system, description: "FK -> Principal.id; owning principal (path-scoped)" }
      - { name: family_rates, type: array, source: input, description: "Array of {family_code, base_rate_bp}; base commission rate per product family in basis points" }
      - { name: attainment_tiers, type: array, source: input, description: "Array of {min_attainment_bp, multiplier_bp} sorted ascending; tier applies when attainment_bp >= min_attainment_bp" }
      - { name: registration_bonus_bp, type: integer, source: input, default: 200, description: "Flat basis-point bonus added to the effective rate on registration-protected lines" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUPERSEDED", constraints: "creation supersedes the prior ACTIVE schedule atomically; at most one ACTIVE per principal" }
      - { name: effective_from, type: datetime, source: system, description: "Clock time at creation; rate lookup uses the schedule ACTIVE at invoice time" }

  - name: Rep
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Sales rep name" }
      - { name: territory_codes, type: array, source: input, description: "Territory codes this rep covers agency-wide", constraints: "must be disjoint from territory_codes of every other ACTIVE rep" }
      - { name: status, type: enum, source: system, description: "ACTIVE | COMMISSION_HOLD", constraints: "COMMISSION_HOLD when commission_balance_cents < REP_HOLD_FLOOR_CENTS; released when balance recovers to >= 0" }
      - { name: commission_balance_cents, type: integer, source: computed, description: "Sum over all CommissionEntry rows for this rep: ACCRUAL + ADJUSTMENT (signed) - chargebacks/payments/charges/recoveries as negative-signed entries" }
      - { name: outstanding_draw_cents, type: integer, source: input, default: 0, description: "Recoverable draw balance; reduced by DRAW_RECOVERY entries at statement settle" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Buyer account name" }
      - { name: spec_territory_code, type: string, source: input, description: "Territory of the customer's design/engineering location (specify side)" }
      - { name: ship_to_territory_code, type: string, source: input, description: "Default delivery territory (ship-to side)" }

  - name: ProjectRegistration
    parent: null
    common_fields: true
    fields:
      - { name: principal_id, type: string, source: input, description: "FK -> Principal.id; line the project is registered on" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; customer whose project is registered" }
      - { name: rep_id, type: string, source: system, description: "FK -> Rep.id; registering rep = X-User-ID of the acting Rep" }
      - { name: family_code, type: string, source: input, description: "Product family scope of the protection" }
      - { name: project_name, type: string, source: input, description: "Free-form project label" }
      - { name: submitted_at, type: datetime, source: system, description: "Clock time at (re)submission" }
      - { name: protection_start, type: datetime, source: system, description: "Set to approval clock time; window is half-open [protection_start, protection_end)" }
      - { name: protection_end, type: datetime, source: computed, description: "= protection_start + PROTECTION_DAYS + renewals_used * RENEWAL_DAYS" }
      - { name: renewals_used, type: integer, source: system, default: 0, description: "Number of renewals consumed; hard cap RENEWAL_LIMIT" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | EXPIRED | WITHDRAWN" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: principal_id, type: string, source: input, description: "FK -> Principal.id" }
      - { name: external_order_ref, type: string, source: input, description: "Principal's PO reference", constraints: "unique per principal among orders with fulfillment_status != CANCELLED" }
      - { name: placed_at, type: datetime, source: input, description: "Customer PO placement timestamp; must be <= current clock" }
      - { name: lines, type: array, source: input, description: "Array of {line_id (client-unique within order), family_code, quantity, unit_price_cents, spec_territory_code? (defaults to customer.spec_territory_code), ship_to_territory_code? (defaults to customer.ship_to_territory_code)}; system adds per-line shipped_qty=0, returned_qty=0, applied_rate_bp=null, commission_cents=null, protected_registration_id=null at creation; applied_rate_bp/commission_cents set at invoice" }
      - { name: fulfillment_status, type: enum, source: system, description: "PLACED | SHIPPED | INVOICED | PAID | CANCELLED (parallel dimension 1)" }
      - { name: commission_status, type: enum, source: system, description: "ATTRIBUTED | ACCRUED | SETTLED | CLOSED (parallel dimension 2, independent of fulfillment_status)", constraints: "ATTRIBUTED at creation, ACCRUED at invoice, SETTLED when a settled statement covers the order, CLOSED on cancel" }
      - { name: shipped_at, type: datetime, source: system, description: "Clock time of ship; null until shipped" }
      - { name: invoiced_at, type: datetime, source: system, description: "Clock time of invoice; null until invoiced" }
      - { name: paid_at, type: datetime, source: system, description: "Clock time of mark_paid; null until paid" }

  - name: OrderSplit
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id" }
      - { name: line_id, type: string, source: system, description: "Order.lines[].line_id this split row covers" }
      - { name: rep_id, type: string, source: system, description: "FK -> Rep.id; null iff role == HOUSE" }
      - { name: role, type: enum, source: system, description: "REGISTERED | SPECIFY | SHIP_TO | HOUSE | OVERRIDE", constraints: "precedence at attribution: REGISTERED > SPECIFY > SHIP_TO > HOUSE; OVERRIDE rows only via PUT splits" }
      - { name: share_bp, type: integer, source: system, description: "Basis points of the line's commission; rows for one line sum to exactly 10000" }
      - { name: is_override, type: boolean, source: system, default: false, description: "True once a PUT splits override replaced the attributed rows for the line" }

  - name: ReturnAuthorization
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id being returned against" }
      - { name: principal_id, type: string, source: system, description: "FK -> Principal.id; denormalized from order at creation" }
      - { name: lines, type: array, source: input, description: "Array of {line_id, qty}; qty per line <= shipped_qty - returned_qty - qty on REQUESTED/APPROVED RMAs for that line" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | CLOSED | EXPIRED" }
      - { name: provisional_chargeback_cents, type: integer, source: computed, description: "Estimate at APPROVED using the CURRENTLY active rate schedule (CURRENT_RATE variant); null until approved" }
      - { name: final_chargeback_cents, type: integer, source: computed, description: "Posted at receipt using each line's stored applied_rate_bp (ORIGINAL_RATE variant); null until receipt" }
      - { name: requested_at, type: datetime, source: system, description: "Clock time at creation" }
      - { name: approved_at, type: datetime, source: system, description: "Clock time at approval; null until approved" }
      - { name: received_at, type: datetime, source: system, description: "Clock time of warehouse receipt; null until received" }

  - name: CommissionEntry
    parent: null
    common_fields: false
    fields:
      - { name: rep_id, type: string, source: system, description: "FK -> Rep.id whose balance the entry moves" }
      - { name: principal_id, type: string, source: system, description: "FK -> Principal.id the entry belongs to" }
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; null for ADJUSTMENT without order, SAMPLE_CHARGE, and DRAW_RECOVERY" }
      - { name: statement_id, type: string, source: system, description: "FK -> CommissionStatement.id; set only on STATEMENT_PAYMENT and DRAW_RECOVERY entries, else null" }
      - { name: type, type: enum, source: system, description: "ACCRUAL | CHARGEBACK | ADJUSTMENT | STATEMENT_PAYMENT | DRAW_RECOVERY | SAMPLE_CHARGE" }
      - { name: amount_cents, type: integer, source: system, description: "Signed: ACCRUAL positive; CHARGEBACK / STATEMENT_PAYMENT / DRAW_RECOVERY / SAMPLE_CHARGE negative; ADJUSTMENT either sign (never zero)" }
      - { name: ref_line_id, type: string, source: system, description: "Order line_id or statement line_id the entry traces to; null when not applicable" }
      - { name: business_date, type: datetime, source: system, description: "Date the entry counts toward for statement expectation: ACCRUAL -> order.invoiced_at; CHARGEBACK -> rma.received_at; others -> entry clock time" }
      - { name: note, type: string, source: input, description: "Free-form note; only on ADJUSTMENT entries" }

  - name: CommissionStatement
    parent: null
    common_fields: true
    fields:
      - { name: principal_id, type: string, source: input, description: "FK -> Principal.id issuing the statement" }
      - { name: period_label, type: string, source: input, description: "Calendar month 'YYYY-MM'", constraints: "unique per principal" }
      - { name: lines, type: array, source: input, description: "Array of {line_id (client-unique within statement), external_order_ref, amount_cents}; system adds disposition=PENDING per line at creation" }
      - { name: stated_total_cents, type: integer, source: computed, description: "Sum of lines[].amount_cents" }
      - { name: expected_total_cents, type: integer, source: computed, description: "Accrual-basis expectation at start_reconciliation: sum of ACCRUAL + CHARGEBACK amounts for this principal whose business_date falls inside the period month; canonical basis" }
      - { name: expected_cash_basis_cents, type: integer, source: computed, description: "Cash-basis expectation (informational variant): ACCRUAL entries whose order.paid_at falls inside the period month, plus CHARGEBACK entries by business_date" }
      - { name: variance_cents, type: integer, source: computed, description: "= stated_total_cents - expected_total_cents at start_reconciliation" }
      - { name: status, type: enum, source: system, description: "RECEIVED | IN_RECONCILIATION | DISPUTED | SETTLED" }
      - { name: reconciled_at, type: datetime, source: system, description: "Clock time of last start_reconciliation; null until run" }
      - { name: settled_at, type: datetime, source: system, description: "Clock time of settle; null until settled" }

  - name: SampleUnit
    parent: null
    common_fields: true
    fields:
      - { name: principal_id, type: string, source: input, description: "FK -> Principal.id that consigned the demo unit" }
      - { name: serial_number, type: string, source: input, description: "Unit serial", constraints: "unique per principal" }
      - { name: family_code, type: string, source: input, description: "Product family of the unit" }
      - { name: value_cents, type: integer, source: input, description: "List value of the unit, basis of depreciation charges" }
      - { name: status, type: enum, source: system, description: "IN_STOCK | CHECKED_OUT | CONVERTED | WRITTEN_OFF" }

  - name: SampleCheckout
    parent: null
    common_fields: true
    fields:
      - { name: sample_unit_id, type: string, source: input, description: "FK -> SampleUnit.id being checked out" }
      - { name: rep_id, type: string, source: system, description: "FK -> Rep.id; borrower = X-User-ID of the acting Rep" }
      - { name: checked_out_at, type: datetime, source: system, description: "Clock time at checkout" }
      - { name: due_at, type: datetime, source: computed, description: "= checked_out_at + CHECKOUT_DAYS" }
      - { name: returned_at, type: datetime, source: system, description: "Clock time of return; null while OPEN" }
      - { name: condition_on_return, type: enum, source: input, description: "SELLABLE | DAMAGED; supplied on return" }
      - { name: charge_cents, type: integer, source: computed, description: "Charge posted on overdue sweep, damaged return, or conversion; null while OPEN with no charge" }
      - { name: status, type: enum, source: system, description: "OPEN | RETURNED | CONVERTED | CHARGED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Principal
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: NOTICE_PENDING
        trigger: "POST /rep-agency/principals/{id}/issue_termination_notice"
        actor: PrincipalOps
        preconditions:
          - "acting PrincipalOps owns this principal (X-User-ID == principalId)"
        side_effects:
          - "termination_notice_issued_at = current clock"
          - "termination_effective_at = current clock + notice_period_days"
      - from: NOTICE_PENDING
        to: ACTIVE
        trigger: "POST /rep-agency/principals/{id}/rescind_termination_notice"
        actor: PrincipalOps
        preconditions:
          - "acting PrincipalOps owns this principal"
          - "current clock < termination_effective_at (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "termination_notice_issued_at = null; termination_effective_at = null"
      - from: NOTICE_PENDING
        to: TERMINATED
        trigger: "system (clock sweep when current clock >= termination_effective_at)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link 1 -> every TerritoryAgreement of this principal in ACTIVE or SUSPENDED -> TERMINATED"
          - "each agreement TERMINATED is itself CASCADE link 2 -> every APPROVED ProjectRegistration for this principal -> EXPIRED"
          - "each expired registration is CASCADE link 3 -> re-attribution of non-override OrderSplit rows on orders of this principal with fulfillment_status IN {PLACED, SHIPPED} (REGISTERED share dropped, precedence re-resolved, protected_registration_id cleared)"

  - entity: TerritoryAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /rep-agency/agreements/{agreementId}/activate"
        actor: AgencyAdmin
        preconditions:
          - "no other ACTIVE agreement exists for the same principal (ERR_AGREEMENT_CONFLICT)"
          - "principal.status != TERMINATED (ERR_LINE_TERMINATED)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /rep-agency/agreements/{agreementId}/activate"
        actor: AgencyAdmin
        preconditions:
          - "no other ACTIVE agreement exists for the same principal (ERR_AGREEMENT_CONFLICT)"
          - "principal.status != TERMINATED (ERR_LINE_TERMINATED)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /rep-agency/agreements/{agreementId}/suspend"
        actor: AgencyAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (cascade link from Principal NOTICE_PENDING -> TERMINATED)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link -> APPROVED ProjectRegistrations for this principal -> EXPIRED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "system (cascade link from Principal NOTICE_PENDING -> TERMINATED)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link -> APPROVED ProjectRegistrations for this principal -> EXPIRED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep when effective_end is not null and current clock >= effective_end)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link -> APPROVED ProjectRegistrations for this principal -> EXPIRED"

  - entity: RateSchedule
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (creation of a newer RateSchedule for the same principal)"
        actor: system
        preconditions: []
        side_effects:
          - "the newly created schedule becomes the unique ACTIVE schedule"

  - entity: Rep
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: COMMISSION_HOLD
        trigger: "system (after any CommissionEntry posts, when commission_balance_cents < REP_HOLD_FLOOR_CENTS)"
        actor: system
        preconditions: []
        side_effects:
          - "gates: new ProjectRegistration submissions and SampleCheckouts by this rep are rejected (ERR_REP_ON_HOLD)"
      - from: COMMISSION_HOLD
        to: ACTIVE
        trigger: "system (after any CommissionEntry posts or clock sweep, when commission_balance_cents >= 0)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProjectRegistration
    initial_state: SUBMITTED
    terminal_states: [EXPIRED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /rep-agency/project-registrations/{registrationId}/approve"
        actor: PrincipalOps
        preconditions:
          - "acting PrincipalOps owns registration.principal_id"
          - "the principal's single ACTIVE TerritoryAgreement exists (ERR_AGREEMENT_NOT_ACTIVE)"
          - "no other APPROVED registration with same (principal_id, customer_id, family_code) whose [protection_start, protection_end) would overlap the new window [now, now + PROTECTION_DAYS) — half-open: new start == existing end is NOT an overlap (ERR_PROTECTION_WINDOW_OVERLAP)"
        side_effects:
          - "protection_start = current clock; protection_end = current clock + PROTECTION_DAYS"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /rep-agency/project-registrations/{registrationId}/reject"
        actor: PrincipalOps
        preconditions:
          - "acting PrincipalOps owns registration.principal_id"
        side_effects: []
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /rep-agency/project-registrations/{registrationId}/resubmit"
        actor: Rep
        preconditions:
          - "acting Rep owns registration.rep_id (ERR_FORBIDDEN_NOT_OWNER)"
          - "rep.status == ACTIVE (ERR_REP_ON_HOLD)"
        side_effects:
          - "submitted_at = current clock"
      - from: APPROVED
        to: APPROVED
        trigger: "POST /rep-agency/project-registrations/{registrationId}/renew"
        actor: Rep
        preconditions:
          - "acting Rep owns registration.rep_id (ERR_FORBIDDEN_NOT_OWNER)"
          - "current clock >= protection_end - RENEWAL_WINDOW_DAYS (ERR_RENEWAL_WINDOW_NOT_OPEN)"
          - "current clock < protection_end (ERR_RENEWAL_WINDOW_NOT_OPEN once lapsed)"
          - "renewals_used < RENEWAL_LIMIT (ERR_RENEWAL_LIMIT_REACHED)"
        side_effects:
          - "renewals_used += 1; protection_end += RENEWAL_DAYS"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (clock sweep when current clock >= protection_end, or cascade from principal termination / agreement expiry)"
        actor: system
        preconditions: []
        side_effects:
          - "CASCADE link -> re-attribution of non-override splits on uninvoiced orders (fulfillment_status IN {PLACED, SHIPPED}) whose lines referenced this registration"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /rep-agency/project-registrations/{registrationId}/withdraw"
        actor: Rep
        preconditions:
          - "acting Rep owns registration.rep_id (ERR_FORBIDDEN_NOT_OWNER)"
        side_effects: []
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /rep-agency/project-registrations/{registrationId}/withdraw"
        actor: Rep
        preconditions:
          - "acting Rep owns registration.rep_id (ERR_FORBIDDEN_NOT_OWNER)"
        side_effects:
          - "protection void from now; uninvoiced orders re-attributed as in EXPIRED cascade"

  - entity: Order
    initial_state: PLACED
    terminal_states: [CANCELLED]
    note: "Two parallel state dimensions evolve on one row: fulfillment_status (PLACED -> SHIPPED -> INVOICED -> PAID, or PLACED -> CANCELLED) and commission_status (ATTRIBUTED -> ACCRUED -> SETTLED, or CLOSED on cancel)."
    transitions:
      - from: PLACED
        to: SHIPPED
        trigger: "POST /rep-agency/orders/{orderId}/ship"
        actor: PrincipalOps
        preconditions:
          - "acting PrincipalOps owns order.principal_id"
        side_effects:
          - "shipped_at = current clock; every line shipped_qty = quantity"
      - from: SHIPPED
        to: INVOICED
        trigger: "POST /rep-agency/orders/{orderId}/invoice"
        actor: PrincipalOps
        preconditions:
          - "acting PrincipalOps owns order.principal_id"
          - "if principal.status == TERMINATED: order.placed_at < termination_effective_at AND current clock <= termination_effective_at + tail_period_days of the (now TERMINATED) agreement, else ERR_TAIL_PERIOD_EXPIRED"
        side_effects:
          - "invoiced_at = current clock; fulfillment -> INVOICED; commission_status ATTRIBUTED -> ACCRUED"
          - "run quota_attainment EXCLUDING this order -> select tier -> run order_line_commission per line -> store applied_rate_bp + commission_cents per line"
          - "run split_waterfall per line -> create one ACCRUAL CommissionEntry per (rep, order) summing that rep's per-line shares"
          - "THEN credited_ytd_sales_cents += sum of line amounts (order joins the YTD pool only after its own rate was fixed)"
      - from: INVOICED
        to: PAID
        trigger: "POST /rep-agency/orders/{orderId}/mark_paid"
        actor: PrincipalOps
        preconditions:
          - "acting PrincipalOps owns order.principal_id"
        side_effects:
          - "paid_at = current clock"
      - from: PLACED
        to: CANCELLED
        trigger: "POST /rep-agency/orders/{orderId}/cancel"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "commission_status -> CLOSED; OrderSplit rows retained for audit"

  - entity: ReturnAuthorization
    initial_state: REQUESTED
    terminal_states: [REJECTED, CLOSED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /rep-agency/rmas/{rmaId}/approve"
        actor: PrincipalOps
        preconditions:
          - "acting PrincipalOps owns rma.principal_id"
        side_effects:
          - "approved_at = current clock"
          - "run chargeback_amount variant CURRENT_RATE -> provisional_chargeback_cents"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /rep-agency/rmas/{rmaId}/reject"
        actor: PrincipalOps
        preconditions:
          - "acting PrincipalOps owns rma.principal_id"
        side_effects: []
      - from: APPROVED
        to: CLOSED
        trigger: "POST /rep-agency/rmas/{rmaId}/receive"
        actor: PrincipalOps
        preconditions:
          - "acting PrincipalOps owns rma.principal_id"
        side_effects:
          - "received_at = current clock"
          - "CASCADE link 1 -> run chargeback_amount variant ORIGINAL_RATE -> final_chargeback_cents; per line returned_qty += qty; create CHARGEBACK CommissionEntry rows (one per rep per order, split per the order's locked splits)"
          - "CASCADE link 2 -> each touched rep's commission_balance_cents recomputed (sum of entries)"
          - "CASCADE link 3 -> any touched rep whose balance < REP_HOLD_FLOOR_CENTS transitions ACTIVE -> COMMISSION_HOLD"
          - "principal.credited_ytd_sales_cents -= sum of returned line amounts (returned_qty * unit_price_cents), floored at 0"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (clock sweep when current clock >= approved_at + RMA_RECEIPT_WINDOW_DAYS without receipt)"
        actor: system
        preconditions: []
        side_effects:
          - "provisional_chargeback_cents discarded (set null); returned quantities unchanged"

  - entity: CommissionStatement
    initial_state: RECEIVED
    terminal_states: [SETTLED]
    transitions:
      - from: RECEIVED
        to: IN_RECONCILIATION
        trigger: "POST /rep-agency/statements/{statementId}/start_reconciliation"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "compute expected_total_cents (accrual) and expected_cash_basis_cents (cash variant); variance_cents = stated - expected"
          - "run statement_line_matching: each line disposition PENDING -> MATCHED | AMOUNT_VARIANCE | UNMATCHED_ORDER"
          - "reconciled_at = current clock"
      - from: IN_RECONCILIATION
        to: DISPUTED
        trigger: "POST /rep-agency/statements/{statementId}/lines/{lineId}/dispute"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "target line disposition -> DISPUTED"
      - from: DISPUTED
        to: IN_RECONCILIATION
        trigger: "POST /rep-agency/statements/{statementId}/respond_dispute with action=ACCEPT resolving the last DISPUTED line"
        actor: PrincipalOps
        preconditions:
          - "acting PrincipalOps owns statement.principal_id"
        side_effects:
          - "target line disposition -> RESOLVED; adjustment_amount_cents (if present) is queued for settle-time allocation to the matched order's splits"
      - from: DISPUTED
        to: DISPUTED
        trigger: "POST /rep-agency/statements/{statementId}/respond_dispute with action=REJECT, or ACCEPT while other lines remain DISPUTED"
        actor: PrincipalOps
        preconditions:
          - "acting PrincipalOps owns statement.principal_id"
        side_effects:
          - "REJECT: line stays DISPUTED; ACCEPT: line -> RESOLVED but statement remains DISPUTED"
      - from: IN_RECONCILIATION
        to: SETTLED
        trigger: "POST /rep-agency/statements/{statementId}/settle"
        actor: AgencyAdmin
        preconditions:
          - "no line in DISPUTED (ERR_UNRESOLVED_DISPUTES)"
          - "no line in PENDING | AMOUNT_VARIANCE | UNMATCHED_ORDER (ERR_LINES_NOT_DISPOSITIONED)"
        side_effects:
          - "for each line with |stated - expected| delta absorbed (MATCHED with nonzero delta, VARIANCE_ACCEPTED, RESOLVED with adjustment_amount_cents): create ADJUSTMENT entries allocated to the matched order's splits pro-rata by share_bp (largest-remainder)"
          - "for each rep with accruals on covered orders: create STATEMENT_PAYMENT entry = -(rep's accrued + rep's adjustment share)"
          - "run draw_recovery_waterfall per rep with outstanding_draw_cents > 0: create DRAW_RECOVERY entry; outstanding_draw_cents -= recovered"
          - "commission_status of every covered order -> SETTLED; settled_at = current clock"
          - "CASCADE -> rep balances recomputed; COMMISSION_HOLD release/engage re-evaluated"

  - entity: SampleUnit
    initial_state: IN_STOCK
    terminal_states: [CONVERTED, WRITTEN_OFF]
    transitions:
      - from: IN_STOCK
        to: CHECKED_OUT
        trigger: "POST /rep-agency/sample-checkouts (creates SampleCheckout, flips unit)"
        actor: Rep
        preconditions: []
        side_effects: []
      - from: CHECKED_OUT
        to: IN_STOCK
        trigger: "POST /rep-agency/sample-checkouts/{checkoutId}/return with condition_on_return=SELLABLE"
        actor: Rep
        preconditions: []
        side_effects: []
      - from: CHECKED_OUT
        to: WRITTEN_OFF
        trigger: "POST /rep-agency/sample-checkouts/{checkoutId}/return with condition_on_return=DAMAGED, OR system clock sweep on overdue checkout"
        actor: Rep | system
        preconditions: []
        side_effects:
          - "charge posted per sample_depreciation_charge (DAMAGED: 50% of depreciated value; overdue: full depreciated value)"
      - from: CHECKED_OUT
        to: CONVERTED
        trigger: "POST /rep-agency/sample-checkouts/{checkoutId}/convert (rep purchases the demo unit)"
        actor: Rep
        preconditions: []
        side_effects:
          - "charge posted = depreciated value at convert time"

  - entity: SampleCheckout
    initial_state: OPEN
    terminal_states: [RETURNED, CONVERTED, CHARGED]
    transitions:
      - from: OPEN
        to: RETURNED
        trigger: "POST /rep-agency/sample-checkouts/{checkoutId}/return"
        actor: Rep
        preconditions:
          - "acting Rep owns checkout.rep_id (ERR_FORBIDDEN_NOT_OWNER)"
        side_effects:
          - "returned_at = current clock; SELLABLE -> unit IN_STOCK, charge_cents = 0; DAMAGED -> unit WRITTEN_OFF, charge = 50% of depreciated value posted as SAMPLE_CHARGE entry"
      - from: OPEN
        to: CONVERTED
        trigger: "POST /rep-agency/sample-checkouts/{checkoutId}/convert"
        actor: Rep
        preconditions:
          - "acting Rep owns checkout.rep_id (ERR_FORBIDDEN_NOT_OWNER)"
        side_effects:
          - "charge_cents = depreciated value at convert; SAMPLE_CHARGE entry posted; unit -> CONVERTED"
      - from: OPEN
        to: CHARGED
        trigger: "system (clock sweep when current clock > due_at and still OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "charge_cents = depreciated value at sweep date; SAMPLE_CHARGE entry posted; unit -> WRITTEN_OFF"
          - "CASCADE -> rep balance recomputed -> COMMISSION_HOLD check"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: rate-schedule-supersede-stale-principal
    parent_entity: Principal
    write_endpoint: "POST /rep-agency/principals/{id}/rate-schedules"
    occ_field: "expected_principal_version"
    description: |
      Creating a RateSchedule supersedes the principal's currently ACTIVE
      schedule under normal product semantics, so a second create sent after
      the first completes would itself legitimately succeed — the conflict is
      invisible to state preconditions. The create is rejected when the
      client's expected_principal_version no longer matches Principal.version,
      because the supersede the client priced against is no longer current.
    error_id: ERR_STALE_PRINCIPAL_VERSION
    http_status: 412
  - rule_id: order-split-override-stale-order
    parent_entity: Order
    write_endpoint: "PUT /rep-agency/orders/{orderId}/splits"
    occ_field: "expected_order_version"
    description: |
      A splits override replaces the current split rows while the order stays
      in ATTRIBUTED commission_status, so a second override sent after another
      override completes would itself legitimately succeed — no state field
      distinguishes them. The override is rejected when expected_order_version
      is stale, because the client negotiated against split rows that have
      since been replaced.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quota_attainment
    trigger: "order invoice (rate selection), clock sweep (posture refresh)"
    algorithm: threshold
    formula: |
      evaluation_order (PINNED, removes the circular dependency):
        1. pool = credited_ytd_sales_cents  (BEFORE this order joins)
        2. attainment_bp = floor(pool * 10000 / principal.annual_quota_cents)
        3. tier = the attainment_tiers entry with the largest min_attainment_bp
           such that attainment_bp >= min_attainment_bp   (boundary INCLUSIVE)
        4. apply tier.multiplier_bp to the order being invoiced
        5. only then: credited_ytd_sales_cents += order line amounts
      Same-day orders are processed in Order.created_at ASC order (never id).
    input_set: "principal credited_ytd_sales_cents and annual_quota_cents; RateSchedule.attainment_tiers of the schedule ACTIVE at invoice time"
    constants:
      BOUNDARY_INCLUSIVE: true   # attainment_bp == min_attainment_bp qualifies
    precision: "attainment_bp is integer floor; no decimal rounding"
    variants: []

  - name: order_line_commission
    trigger: "order invoice"
    algorithm: tiered_pricing
    formula: |
      for each order line:
        base_bp        = family_rates[line.family_code].base_rate_bp
        mult_bp        = tier.multiplier_bp          # from quota_attainment
        effective_bp   = floor(base_bp * mult_bp / 10000)
                       + (registration_bonus_bp if line is protected else 0)
        net_amount     = line.quantity * line.unit_price_cents
        commission     = round_half_up(net_amount * effective_bp / 10000)
      A line is PROTECTED iff an APPROVED ProjectRegistration exists with
      matching (principal_id, customer_id, family_code) and
      protection_start <= order.placed_at < protection_end (half-open).
      >= 3 interacting inputs (family base rate, attainment tier multiplier,
      registration bonus) with nested floor + conditional branch.
    input_set: "order lines; ACTIVE RateSchedule; tier from quota_attainment; APPROVED ProjectRegistration match"
    constants: {}
    precision: "integer cents, round_half_up per line"
    variants: []

  - name: split_waterfall
    trigger: "order creation (attribution), PUT splits (override), order invoice (allocation)"
    algorithm: waterfall_allocation
    formula: |
      ATTRIBUTION (per line, precedence REGISTERED > SPECIFY > SHIP_TO > HOUSE):
        protected registration match -> single REGISTERED row: reg.rep gets
          agreement.registered_protection_share_bp; residual (if any) -> HOUSE row.
        else resolve spec_rep = unique ACTIVE Rep with line.spec_territory_code
          in territory_codes; ship_rep likewise for ship_to_territory_code:
          both found and equal     -> SPECIFY row 10000
          both found and different -> SPECIFY spec_rep agreement.specify_share_bp,
                                      SHIP_TO ship_rep (10000 - specify_share_bp)
          only one found           -> that role's row 10000
          neither found            -> HOUSE row (rep_id null) 10000
      ALLOCATION at invoice (per line):
        raw_r = line.commission_cents * row.share_bp / 10000
        floor each raw_r; distribute the residual cents one-by-one to rows
        ordered by share_bp DESC, tie-break Rep.created_at ASC (never id).
      INVARIANT: per line, share_bp sums to exactly 10000 and allocated cents
      sum to exactly line.commission_cents.
    input_set: "line splits (OrderSplit rows for the line), agreement split defaults, ACTIVE reps"
    constants: {}
    precision: "integer cents; largest-remainder allocation"
    variants: []

  - name: chargeback_amount
    trigger: "RMA approve (provisional), RMA receive (final)"
    algorithm: chronological
    formula: |
      per returned line: amount = round_half_up(qty * unit_price_cents * rate_bp / 10000)
      ROUNDING ORDER (PINNED): round each line first, then sum the rounded
      line amounts — never sum-then-round.
      final (at receive) uses rate_bp = line.applied_rate_bp stored at invoice
      (ORIGINAL_RATE variant); provisional (at approve) uses the rate the same
      family would earn NOW (CURRENT_RATE variant: current schedule base_bp *
      current tier multiplier, no registration bonus).
    input_set: "RMA lines; order lines (unit_price_cents, applied_rate_bp); ACTIVE RateSchedule + current tier for the provisional variant"
    constants: {}
    precision: "integer cents, round_half_up per line, then sum"
    variants:
      - name: CURRENT_RATE
        when: "RMA approval (provisional_chargeback_cents)"
        difference: "rates from the RateSchedule ACTIVE at approve time with the current attainment tier; ignores what was actually applied"
      - name: ORIGINAL_RATE
        when: "RMA receipt (final_chargeback_cents and posted CHARGEBACK entries)"
        difference: "uses each line's stored applied_rate_bp from invoice time; identical goods return a different amount whenever schedules or tiers moved"

  - name: statement_expectation
    trigger: "start_reconciliation"
    algorithm: aggregation
    formula: |
      period month P = [first instant of period_label month, first instant of next month)
      accrual (canonical expected_total_cents):
        sum over CommissionEntry of this principal of amount_cents where
        type IN {ACCRUAL, CHARGEBACK} and business_date in P
      cash (informational expected_cash_basis_cents):
        sum of ACCRUAL amounts whose order.paid_at in P, plus CHARGEBACK
        amounts whose business_date in P
      variance_cents = stated_total_cents - expected_total_cents
    input_set: "CommissionEntry rows for the principal; Order.paid_at; statement period_label"
    constants: {}
    precision: "integer cents"
    variants:
      - name: ACCRUAL_BASIS
        when: "expected_total_cents — the canonical reconciliation target"
        difference: "keys on invoice/receipt dates inside the period"
      - name: CASH_BASIS
        when: "expected_cash_basis_cents — informational comparison"
        difference: "keys ACCRUAL entries on order.paid_at instead of invoiced_at; identical ledger yields a different total whenever payment and invoice straddle the period boundary"

  - name: statement_line_matching
    trigger: "start_reconciliation"
    algorithm: threshold
    formula: |
      for each statement line:
        order = unique non-CANCELLED Order of this principal with
                external_order_ref == line.external_order_ref
        none -> UNMATCHED_ORDER
        else expected_line = sum of all CommissionEntry amounts for that order
             with business_date <= period end
        |line.amount_cents - expected_line| <= LINE_TOLERANCE_CENTS -> MATCHED
        else -> AMOUNT_VARIANCE
      Boundary: a delta of exactly LINE_TOLERANCE_CENTS is MATCHED (<=).
    input_set: "statement lines; orders of the principal; CommissionEntry rows per order"
    constants:
      LINE_TOLERANCE_CENTS: 25
    precision: "integer cents"
    variants: []

  - name: draw_recovery_waterfall
    trigger: "statement settle"
    algorithm: waterfall_allocation
    formula: |
      per rep with entries in this statement, in Rep.created_at ASC order:
        gross = rep's accrued share on covered orders + rep's adjustment share
        if gross <= 0: no payment, no recovery
        recovered = min(rep.outstanding_draw_cents,
                        floor(gross * DRAW_RECOVERY_BP / 10000))
        DRAW_RECOVERY entry = -recovered; outstanding_draw_cents -= recovered
        STATEMENT_PAYMENT entry = -(gross)   # recovery is inside the payout
      waterfall order: adjustments first (folded into gross), then draw
      recovery skimmed, remainder is the rep's cash payout (not persisted).
    input_set: "settled statement lines, covered orders' splits, rep outstanding_draw_cents"
    constants:
      DRAW_RECOVERY_BP: 5000   # 50% of gross
    precision: "integer cents, floor on recovery"
    variants: []

  - name: sample_depreciation_charge
    trigger: "checkout convert, damaged return, clock sweep on overdue checkout"
    algorithm: decay_function
    formula: |
      days = floor((event_clock - checkout.checked_out_at) / 24h)
      months_started = floor(days / 30)          # step decay per started month
      factor_bp = max(RESIDUAL_FLOOR_BP, 10000 - DEPRECIATION_STEP_BP * months_started)
      depreciated_value = round_half_up(unit.value_cents * factor_bp / 10000)
      charge:
        convert          -> depreciated_value
        overdue sweep    -> depreciated_value
        damaged return   -> round_half_up(depreciated_value * DAMAGED_RETURN_BP / 10000)
        sellable return  -> 0
    input_set: "SampleCheckout (checked_out_at), SampleUnit.value_cents, event clock, return condition"
    constants:
      DEPRECIATION_STEP_BP: 1500   # 15% of list per started 30-day month
      RESIDUAL_FLOOR_BP: 2000      # never charges below 20% of list
      DAMAGED_RETURN_BP: 5000      # damaged return charges 50% of depreciated value
    precision: "integer cents, round_half_up"
    variants: []

  - name: termination_tail_eligibility
    trigger: "order invoice when principal.status == TERMINATED"
    algorithm: threshold
    formula: |
      allowed iff order.placed_at < principal.termination_effective_at
      AND current_clock <= termination_effective_at + agreement.tail_period_days
      (tail window boundary INCLUSIVE)
      else ERR_TAIL_PERIOD_EXPIRED
    input_set: "order.placed_at, principal termination timestamps, agreement.tail_period_days"
    constants: {}
    precision: "timestamp comparison, inclusive tail end"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; role is one of the declared roles; for entity_backed roles the X-User-ID resolves to an existing entity instance"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Caller role is in the endpoint's allowed role list"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path ids and body FK ids (customer_id, principal_id, sample_unit_id, order_id, ...) exist; validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints
  - priority: 4
    category: auth
    check: "Ownership scoping: Rep acts only on own registrations/checkouts and orders where the rep holds a split; PrincipalOps acts only on resources of principal == X-User-ID"
    error_id: ERR_FORBIDDEN_NOT_OWNER
    http_status: 403
    applies_to: "ownership-scoped endpoints (approve/reject registrations, resubmit/renew/withdraw, PUT splits as Rep, RMA approve/reject/receive, statement create/respond_dispute, order ship/invoice/mark_paid, checkout return/convert)"
  - priority: 5
    category: state
    check: "Target resource state machine permits the transition (incl. terminal-state lockdown); RMA create additionally requires the linked order's fulfillment_status IN {SHIPPED, INVOICED, PAID}; sample checkout create requires the unit IN_STOCK; PUT splits requires order commission_status == ATTRIBUTED (ERR_SPLITS_LOCKED)"
    error_id: "ERR_INVALID_STATE_TRANSITION / ERR_SPLITS_LOCKED"
    http_status: 409
    applies_to: "all transition endpoints, RMA create, sample checkout create, PUT splits"
  - priority: 6
    category: state
    check: "OCC: expected_principal_version == Principal.version on rate-schedule create; expected_order_version == Order.version on PUT splits"
    error_id: ERR_STALE_PRINCIPAL_VERSION / ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /rep-agency/principals/{id}/rate-schedules, PUT /rep-agency/orders/{id}/splits"
  - priority: 7
    category: business_referential
    check: "Linked-entity gates: order create needs an ACTIVE agreement (ERR_AGREEMENT_NOT_ACTIVE), line territories covered by it (ERR_TERRITORY_NOT_COVERED), an ACTIVE rate schedule (ERR_NO_ACTIVE_RATE_SCHEDULE), known family codes (ERR_UNKNOWN_FAMILY_CODE); principal TERMINATED blocks new orders/registrations/samples (ERR_LINE_TERMINATED); principal NOTICE_PENDING blocks new registrations (ERR_LINE_UNDER_TERMINATION_NOTICE); rep COMMISSION_HOLD blocks registration submit and sample checkout (ERR_REP_ON_HOLD)"
    error_id: "ERR_AGREEMENT_NOT_ACTIVE / ERR_TERRITORY_NOT_COVERED / ERR_NO_ACTIVE_RATE_SCHEDULE / ERR_UNKNOWN_FAMILY_CODE / ERR_LINE_TERMINATED / ERR_LINE_UNDER_TERMINATION_NOTICE / ERR_REP_ON_HOLD"
    http_status: 409
    applies_to: "order create, registration submit/resubmit, sample unit create, sample checkout create"
  - priority: 8
    category: business_temporal
    check: "Window/overlap rules: registration protection overlap half-open (ERR_PROTECTION_WINDOW_OVERLAP), sample checkout blocked interval with inspection buffer (ERR_CHECKOUT_WINDOW_CONFLICT), renew window + cap (ERR_RENEWAL_WINDOW_NOT_OPEN / ERR_RENEWAL_LIMIT_REACHED), invoice tail window (ERR_TAIL_PERIOD_EXPIRED), placed_at <= clock (ERR_FUTURE_DATED), clock monotonic (ERR_CLOCK_REGRESSION)"
    error_id: "ERR_PROTECTION_WINDOW_OVERLAP / ERR_CHECKOUT_WINDOW_CONFLICT / ERR_RENEWAL_WINDOW_NOT_OPEN / ERR_RENEWAL_LIMIT_REACHED / ERR_TAIL_PERIOD_EXPIRED / ERR_FUTURE_DATED / ERR_CLOCK_REGRESSION"
    http_status: 409
    applies_to: "registration approve, sample checkout create, renew, order invoice, order create, clock set"
  - priority: 9
    category: business_constraint
    check: "Shape/uniqueness/sum rules: PUT splits must cover every line with share_bp summing to exactly 10000 per line (ERR_SPLIT_SUM_INVALID); external_order_ref unique per principal among non-CANCELLED orders (ERR_DUPLICATE_EXTERNAL_REF); period_label unique per principal (ERR_DUPLICATE_PERIOD_LABEL); serial_number unique per principal (ERR_DUPLICATE_SERIAL); rep territory_codes disjoint among ACTIVE reps (ERR_TERRITORY_COVERAGE_CONFLICT); at most one ACTIVE agreement (ERR_AGREEMENT_CONFLICT); malformed bodies, duplicate line ids, non-positive amounts (ERR_INVALID_REQUEST)"
    error_id: "ERR_SPLIT_SUM_INVALID / ERR_DUPLICATE_EXTERNAL_REF / ERR_DUPLICATE_PERIOD_LABEL / ERR_DUPLICATE_SERIAL / ERR_TERRITORY_COVERAGE_CONFLICT / ERR_AGREEMENT_CONFLICT / ERR_INVALID_REQUEST"
    http_status: 409
    applies_to: "create/update endpoints with constraint payloads"
  - priority: 10
    category: business_fiscal
    check: "Quantity/amount/settlement rules: RMA line qty <= shipped - returned - pending (ERR_RETURN_QTY_EXCEEDS_SHIPPED); settle blocked by DISPUTED lines (ERR_UNRESOLVED_DISPUTES) or un-dispositioned lines (ERR_LINES_NOT_DISPOSITIONED); ADJUSTMENT amount must be non-zero (ERR_INVALID_REQUEST)"
    error_id: "ERR_RETURN_QTY_EXCEEDS_SHIPPED / ERR_UNRESOLVED_DISPUTES / ERR_LINES_NOT_DISPOSITIONED"
    http_status: 409
    applies_to: "RMA create/receive, statement settle, adjustments"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- clock (test-driving; startup default clock is 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/rep-agency/_clock/set_current_utc"
    description: "Set the logical clock and synchronously run the epoch sweep (principal terminations, agreement expiry, registration expiry, RMA expiry, overdue sample charges, year rollover of credited_ytd_sales_cents, hold release). Before any set_current_utc call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [AgencyAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, swept_counts: object }
    side_effects:
      - "ERR_CLOCK_REGRESSION if to_iso8601 <= current clock"
      - "sweep: Principal NOTICE_PENDING->TERMINATED (+ cascades), TerritoryAgreement ACTIVE->EXPIRED at effective_end, ProjectRegistration APPROVED->EXPIRED at protection_end, RMA APPROVED->EXPIRED past receipt window, SampleCheckout OPEN->CHARGED past due_at, principal ytd rollover, COMMISSION_HOLD release"

  # --- Principal ---
  - method: POST
    path: "/rep-agency/principals"
    description: "Create a Principal"
    roles: [AgencyAdmin]
    code: 201
    input: [name, annual_quota_cents, "notice_period_days?"]
    output: Principal
    side_effects: ["status=ACTIVE, credited_ytd_sales_cents=0, ytd_year=clock year"]
  - method: GET
    path: "/rep-agency/principals"
    description: "List Principals"
    roles: [AgencyAdmin, PrincipalOps, Rep, Auditor]
    code: 200
    input: ["status?"]
    output: "Principal[]"
    side_effects: []
  - method: GET
    path: "/rep-agency/principals/{id}"
    description: "Get a Principal"
    roles: [AgencyAdmin, PrincipalOps, Rep, Auditor]
    code: 200
    input: []
    output: Principal
    side_effects: []
  - method: POST
    path: "/rep-agency/principals/{id}/issue_termination_notice"
    description: "Issue line termination notice (Principal ACTIVE -> NOTICE_PENDING)"
    roles: [PrincipalOps]
    code: 200
    input: []
    output: Principal
