              payload: { instrument: "ALUMINA_INDEX", region_code: "GLOBAL", observed_at: "2026-08-15T00:00:00Z", price_usd: 340.00 }
              as: TradingAnalyst
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "POWER_SPOT", region_code: "NA_NORTHWEST", observed_at: "2026-08-20T00:00:00Z", price_usd: 48.00 }
              as: EnergyManager
            - call: "POST /smelter-ops/hedge-positions"
              payload: { smelter_id: "${sm}", instrument: "LME_SWAP", volume_tonnes: 20000, strike_price_usd: 2400.00, delivery_month: "2026-09" }
              as: TradingAnalyst
            - call: "POST /smelter-ops/curtailment-decisions"
              payload: { potline_id: "${pl}", expected_potline_version: "${pv}", trigger_type: "METAL_PRICE", depth_pct: 50, planned_start: "2026-09-05T00:00:00Z", planned_end: "2026-10-05T00:00:00Z" }
              as: SmelterManager
              as_user_id: "mgr-1"
              captures: { dec: $.data.id }
            - call: "POST /smelter-ops/curtailment-decisions/${dec}/economic-approve"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
            - call: "POST /smelter-ops/curtailment-decisions/${dec}/labor-approve"
              payload: {}
              as: VPOperations
              as_user_id: "vp-1"
            - call: "POST /smelter-ops/labor-agreements/${la}/expire"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /smelter-ops/curtailment-decisions/${dec}/execute"
              payload: {}
              as: SmelterManager
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LABOR_AGREEMENT_INACTIVE (the only ACTIVE agreement was expired after approval)"
            - "CurtailmentDecision.${dec}.status remains APPROVED; Potline.${pl}.operating_status remains OPERATING"

  - rule_id: resource_temporal_overlap
    instances:
      - name: power_contract_half_open_adjacency
        grounds:
          - validations[priority=14]
          - state_machines.PowerContract.DRAFT_to_ACTIVE
          - errors[ERR_CONTRACT_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics = pairwise half-open exclusion on the smelter's
          contract resource: [2026-01-01, 2027-01-01) and [2027-01-01, 2028-01-01)
          touch but do not overlap (accepted), while [2026-12-31, 2027-07-01)
          intersects the first window by one day (rejected).
        test_recipe:
          setup:
            - "Smelter with one ACTIVE contract C1 covering [2026-01-01, 2027-01-01)."
          setup_api_calls:
            - call: "POST /smelter-ops/smelters"
              payload: { name: "Riverbend", region_code: "NA_NORTHWEST", rated_capacity_tpd: 1000, labor_headcount: 450 }
              as: PlatformAdmin
              captures: { sm: $.data.id }
            - call: "POST /smelter-ops/power-contracts"
              payload: { smelter_id: "${sm}", supplier_name: "Bonneville", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", components: [ { component_type: "FIXED", volume_mw: 150, fixed_price_per_mwh: 32.00 } ] }
              as: EnergyManager
              captures: { c1: $.data.id }
            - call: "POST /smelter-ops/power-contracts/${c1}/activate"
              payload: {}
              as: EnergyManager
            - call: "POST /smelter-ops/power-contracts"
              payload: { smelter_id: "${sm}", supplier_name: "Chelan", window_start: "2027-01-01T00:00:00Z", window_end: "2028-01-01T00:00:00Z", components: [ { component_type: "FIXED", volume_mw: 200, fixed_price_per_mwh: 35.00 } ] }
              as: EnergyManager
              captures: { c2: $.data.id }
            - call: "POST /smelter-ops/power-contracts"
              payload: { smelter_id: "${sm}", supplier_name: "Grant", window_start: "2026-12-31T00:00:00Z", window_end: "2027-07-01T00:00:00Z", components: [ { component_type: "FIXED", volume_mw: 100, fixed_price_per_mwh: 30.00 } ] }
              as: EnergyManager
              captures: { c3: $.data.id }
          trigger:
            - call: "POST /smelter-ops/power-contracts/${c2}/activate"
              payload: {}
              as: EnergyManager
            - call: "POST /smelter-ops/power-contracts/${c3}/activate"
              payload: {}
              as: EnergyManager
              captures: { err: $.data.error_id }
          assert:
            - "C2 activate succeeds: status == ACTIVE (window_start == C1.window_end is adjacency, not overlap)"
            - "C3 activate rejected: error_id == ERR_CONTRACT_WINDOW_OVERLAP (one-day intersection with C1's window)"
            - "PowerContract.${c3}.status remains DRAFT"

      - name: hedge_delivery_month_aggregate_capacity
        grounds:
          - validations[priority=24]
          - calculations.hedge_coverage
          - errors[ERR_HEDGE_VOLUME_EXCEEDS_EXPOSURE]
        distinguishing_aspect: |
          Different interval semantics than the contract-window instance: not
          pairwise interval exclusion but aggregate capacity on the (smelter,
          delivery_month) bucket — many hedges may share the month as long as
          their summed OPEN volume stays <= rated_capacity_tpd * 30; equality is
          allowed and the next 0.01t is rejected.
        test_recipe:
          setup:
            - "Smelter rated 1000 tpd (monthly capacity 30000t); no hedges yet."
          setup_api_calls:
            - call: "POST /smelter-ops/smelters"
              payload: { name: "Riverbend", region_code: "NA_NORTHWEST", rated_capacity_tpd: 1000, labor_headcount: 450 }
              as: PlatformAdmin
              captures: { sm: $.data.id }
          trigger:
            - call: "POST /smelter-ops/hedge-positions"
              payload: { smelter_id: "${sm}", instrument: "LME_SWAP", volume_tonnes: 18000, strike_price_usd: 2400.00, delivery_month: "2026-11" }
              as: TradingAnalyst
              captures: { h1: $.data.id }
            - call: "POST /smelter-ops/hedge-positions"
              payload: { smelter_id: "${sm}", instrument: "PREMIUM_SWAP", volume_tonnes: 12000, strike_price_usd: 380.00, delivery_month: "2026-11" }
              as: TradingAnalyst
              captures: { h2: $.data.id }
            - call: "POST /smelter-ops/hedge-positions"
              payload: { smelter_id: "${sm}", instrument: "LME_SWAP", volume_tonnes: 0.01, strike_price_usd: 2400.00, delivery_month: "2026-11" }
              as: TradingAnalyst
              captures: { err: $.data.error_id }
            - call: "GET /smelter-ops/smelters/${sm}"
              as: TradingAnalyst
              captures: { open_t: $.data.open_hedged_tonnes }
          assert:
            - "H1 (18000t) and H2 (12000t) both OPEN: summed volume 30000 == monthly capacity is allowed"
            - "H3 (0.01t) rejected with error_id == ERR_HEDGE_VOLUME_EXCEEDS_EXPOSURE"
            - "Smelter.${sm}.open_hedged_tonnes == 30000 after the rejection"

  - rule_id: compensating_invariant
    instances:
      - name: hedge_open_close_conserves_open_hedged_tonnes
        grounds:
          - entities.Smelter.fields.open_hedged_tonnes
          - state_machines.HedgePosition.OPEN_to_CLOSED
          - calculations.hedge_coverage
        distinguishing_aspect: |
          Conserved quantity = hedged tonnes: open_hedged_tonnes = sum of OPEN
          hedge volumes. Opening a 15000t position then closing it restores the
          baseline exactly (0), while realized PnL records the round trip.
        test_recipe:
          setup:
            - "Smelter 1000 tpd, no hedges; baseline open_hedged_tonnes == 0."
          setup_api_calls:
            - call: "POST /smelter-ops/smelters"
              payload: { name: "Riverbend", region_code: "NA_NORTHWEST", rated_capacity_tpd: 1000, labor_headcount: 450 }
              as: PlatformAdmin
              captures: { sm: $.data.id }
            - call: "GET /smelter-ops/smelters/${sm}"
              as: TradingAnalyst
              captures: { baseline: $.data.open_hedged_tonnes }
            - call: "POST /smelter-ops/hedge-positions"
              payload: { smelter_id: "${sm}", instrument: "LME_SWAP", volume_tonnes: 15000, strike_price_usd: 2400.00, delivery_month: "2026-10" }
              as: TradingAnalyst
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /smelter-ops/hedge-positions/${h1}/close"
              payload: { closed_price_usd: 2500.00 }
              as: TradingAnalyst
              captures: { pnl: $.data.realized_pnl_usd }
            - call: "GET /smelter-ops/smelters/${sm}"
              as: TradingAnalyst
              captures: { after: $.data.open_hedged_tonnes }
          assert:
            - "baseline open_hedged_tonnes == 0"
            - "after open: open_hedged_tonnes == 15000; after close: open_hedged_tonnes == 0 == baseline (invariant conserved)"
            - "HedgePosition.${h1}.realized_pnl_usd == 1500000.00 ((2500.00 - 2400.00) * 15000)"

      - name: decision_execute_reverse_conserves_curtailed_capacity
        grounds:
          - entities.Smelter.fields.curtailed_capacity_tpd
          - state_machines.CurtailmentDecision.APPROVED_to_EXECUTED
          - state_machines.CurtailmentDecision.EXECUTED_to_REVERSED
        distinguishing_aspect: |
          Different conserved quantity than hedged tonnes: curtailed capacity
          (curtailed_capacity_tpd = sum of capacity of potlines in
          {CURTAILED, IDLE, SHUTDOWN}). Execute then its compensating reverse
          returns the quantity to its pre-execute baseline of 0 with no drift.
        test_recipe:
          setup:
            - "Smelter 1000 tpd, two potlines (P1 500, P2 300), ACTIVE contract, labor agreement notice 0, hedge 20000t (2026-09), full price set, APPROVED decision depth 50 on P1; baseline curtailed_capacity_tpd == 0."
          setup_api_calls:
            - call: "POST /smelter-ops/smelters"
              payload: { name: "Riverbend", region_code: "NA_NORTHWEST", rated_capacity_tpd: 1000, labor_headcount: 450 }
              as: PlatformAdmin
              captures: { sm: $.data.id }
            - call: "POST /smelter-ops/power-contracts"
              payload: { smelter_id: "${sm}", supplier_name: "Bonneville", window_start: "2026-01-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z", components: [ { component_type: "FIXED", volume_mw: 150, fixed_price_per_mwh: 32.00 } ] }
              as: EnergyManager
              captures: { pc: $.data.id }
            - call: "POST /smelter-ops/power-contracts/${pc}/activate"
              payload: {}
              as: EnergyManager
            - call: "POST /smelter-ops/potlines"
              payload: { smelter_id: "${sm}", line_code: "P1", capacity_tpd: 500, amperage_ka: 320 }
              as: SmelterManager
              captures: { pl1: $.data.id, pv1: $.data.version }
            - call: "POST /smelter-ops/potlines"
              payload: { smelter_id: "${sm}", line_code: "P2", capacity_tpd: 300, amperage_ka: 280 }
              as: SmelterManager
            - call: "POST /smelter-ops/labor-agreements"
              payload: { smelter_id: "${sm}", union_name: "USW-2026", notice_period_days: 0, severance_weeks_per_year: 1.5 }
              as: PlatformAdmin
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "ALUMINUM_LME", region_code: "GLOBAL", observed_at: "2026-08-15T00:00:00Z", price_usd: 2400.00 }
              as: TradingAnalyst
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "REGIONAL_PREMIUM", region_code: "NA_NORTHWEST", observed_at: "2026-08-15T00:00:00Z", price_usd: 380.00 }
              as: TradingAnalyst
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "ALUMINA_INDEX", region_code: "GLOBAL", observed_at: "2026-08-15T00:00:00Z", price_usd: 340.00 }
              as: TradingAnalyst
            - call: "POST /smelter-ops/price-observations"
              payload: { instrument: "POWER_SPOT", region_code: "NA_NORTHWEST", observed_at: "2026-08-20T00:00:00Z", price_usd: 48.00 }
              as: EnergyManager
            - call: "POST /smelter-ops/hedge-positions"
              payload: { smelter_id: "${sm}", instrument: "LME_SWAP", volume_tonnes: 20000, strike_price_usd: 2400.00, delivery_month: "2026-09" }
              as: TradingAnalyst
            - call: "POST /smelter-ops/curtailment-decisions"
              payload: { potline_id: "${pl1}", expected_potline_version: "${pv1}", trigger_type: "METAL_PRICE", depth_pct: 50, planned_start: "2026-09-05T00:00:00Z", planned_end: "2026-10-05T00:00:00Z" }
              as: SmelterManager
              as_user_id: "mgr-1"
              captures: { dec: $.data.id }
            - call: "POST /smelter-ops/curtailment-decisions/${dec}/economic-approve"
              payload: {}
              as: Controller
              as_user_id: "ctrl-1"
            - call: "POST /smelter-ops/curtailment-decisions/${dec}/labor-approve"
              payload: {}
              as: VPOperations
              as_user_id: "vp-1"
            - call: "GET /smelter-ops/smelters/${sm}"
              as: SmelterManager
              captures: { baseline: $.data.curtailed_capacity_tpd }
          trigger:
            - call: "POST /smelter-ops/curtailment-decisions/${dec}/execute"
              payload: {}
              as: SmelterManager
              as_user_id: "mgr-1"
            - call: "POST /smelter-ops/curtailment-decisions/${dec}/reverse"
              payload: {}
              as: SmelterManager
              as_user_id: "mgr-1"
            - call: "GET /smelter-ops/smelters/${sm}"
              as: SmelterManager
              captures: { after: $.data.curtailed_capacity_tpd }
          assert:
            - "baseline curtailed_capacity_tpd == 0; after execute == 500; after reverse == 0 == baseline (invariant conserved)"
            - "CurtailmentDecision.${dec}.status == REVERSED"
            - "Potline.${pl1}.operating_status == OPERATING with active_decision_id == null and curtailment_depth_pct == 0"
