          - validations[priority=5]
          - errors[ERR_SPEC_NOT_QUALIFIED]
        distinguishing_aspect: |
          Entity pair ProductionOrder -> BottleSpec: scheduling is rejected while
          the spec is SUBMITTED and succeeds after the spec reaches QUALIFIED.
          The companion instance crosses a different pair (ProductionRun -> Mold).
        test_recipe:
          setup:
            - "Spec S1 is mid-qualification (IN_QUALIFICATION, not yet QUALIFIED) at the moment of the first schedule attempt; order O1 DRAFT for S1; line L1 exists"
          setup_api_calls:
