            - call: "POST /cases"
              payload: { clinic_id: "${clinic_id}", owner_id: "${owner_id}", pet_name: "Vd", species: "DOG", weight_lbs: 50, service_type: "PRIVATE", pickup_kind: "CLINIC", bill_to: "CLINIC_ACCOUNT" }
              as: CrematoryOperator
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transport-legs"
              payload: { origin_kind: "CLINIC", origin_label: "CL-D", driver_name: "L" }
              as: CrematoryOperator
              captures: { leg_id: $.data.id }
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "EN_ROUTE" }
              as: CrematoryOperator
            - call: "PATCH /transport-legs/${leg_id}"
              payload: { status: "ARRIVED" }
              as: CrematoryOperator
            - call: "POST /cases/${case_id}/receive"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches"
              payload: { retort_id: "${retort_id}", service_type: "PRIVATE", scheduled_start: "2026-04-04T08:00:00Z", scheduled_end: "2026-04-04T10:00:00Z" }
              as: CrematoryOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/assign-case"
              payload: { case_id: "${case_id}" }
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/load"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/fire"
              payload: {}
              as: CrematoryOperator
            - call: "POST /batches/${batch_id}/complete"
              payload: {}
              as: CrematoryOperator
            - call: "GET /cases/${case_id}"
              payload: {}
              as: CrematoryAdmin
              captures: { case_v: $.data.version }
            - call: "POST /cases/${case_id}/invoices"
              payload: { expected_case_version: "${case_v}" }
