              as: BrokerAdmin
            - call: "POST /brokerage/plans"
              payload: { name: "P2", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 7000, transaction_fee_cents: 20000, tiers: [ { threshold_company_dollar_cents: 2000000, broker_split_pct: 0.25 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { p2: $.data.id }
            - call: "POST /brokerage/plans/${p2}/activate"
              payload: {}
              as: BrokerAdmin
          trigger:
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${p1}", effective_from: "2025-09-01", expected_agent_version: "${ag_v}" }
              as: BrokerAdmin
              captures: { e1_st: $.data.status }
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${p2}", effective_from: "2026-03-01", expected_agent_version: "${ag_v}" }
              as: BrokerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "first create succeeds (${e1_st} == ACTIVE) and bumps Agent.version to ${ag_v} + 1"
            - "second create with the stale snapshot: http 412, ${err} == ERR_STALE_AGENT_VERSION"
            - "exactly one enrollment exists for the agent afterwards"

      - name: occ_plan_update_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[plan-update-stale-version]", "errors[ERR_STALE_PLAN_VERSION]"]
        distinguishing_aspect: "PUT /plans OCC: an edit at version N succeeds (N -> N+1); a second edit replaying version N is 412 ERR_STALE_PLAN_VERSION and applies nothing."
        test_recipe:
          setup: ["DRAFT plan at version 1 (captured from create)"]
          setup_api_calls:
            - call: "POST /brokerage/plans"
              payload: { name: "OccPlan", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { plan_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "PUT /brokerage/plans/${plan_id}"
              payload: { expected_plan_version: "${p_v}", name: "OccPlan v2", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6500, transaction_fee_cents: 25000, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { v2: $.data.version, eo2: $.data.eo_fee_cents }
            - call: "PUT /brokerage/plans/${plan_id}"
              payload: { expected_plan_version: "${p_v}", name: "OccPlan stale", royalty_pct: 0.07, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { err: $.data.error_id }
            - call: "GET /brokerage/plans/${plan_id}"
              payload: {}
              as: BrokerAdmin
              captures: { nm: $.data.name, roy: $.data.royalty_pct }
          assert:
            - "first PUT: ${v2} == ${p_v} + 1 and eo_fee_cents == 6500"
            - "second PUT (stale ${p_v}): http 412 ${err} == ERR_STALE_PLAN_VERSION"
            - "state unchanged after the stale write: name == 'OccPlan v2', royalty_pct == 0.06"

      - name: occ_agent_patch_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[agent-patch-stale-version]", "errors[ERR_STALE_AGENT_VERSION]"]
        distinguishing_aspect: "PATCH /agents OCC on the same parent as enrollment-create: a patch replaying an old version after an intervening activation is 412; the fresh-version patch succeeds."
        test_recipe:
          setup: ["agent created (version 1 captured) then activated (version 2)"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Patch Paul", email: "pp2@x.com", license_number: "LIC-OC2", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, v1: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
              captures: { v2: $.data.version }
          trigger:
            - call: "PATCH /brokerage/agents/${ag_id}"
              payload: { expected_agent_version: "${v1}", email: "stale@x.com" }
              as: BrokerAdmin
              captures: { err: $.data.error_id }
            - call: "PATCH /brokerage/agents/${ag_id}"
              payload: { expected_agent_version: "${v2}", email: "fresh@x.com" }
              as: BrokerAdmin
              captures: { em: $.data.email, v3: $.data.version }
          assert:
            - "stale patch (${v1} while at ${v2}): http 412 ${err} == ERR_STALE_AGENT_VERSION"
            - "fresh patch succeeds: email == 'fresh@x.com', version == ${v2} + 1"

      - name: cascading_side_effects_chain
        claim_type: cascading_side_effects
        grounds: [state_machines.Deal.CLOSED_to_SETTLED, state_machines.Deal.SETTLED_to_CLOSED]
        excluded_because:
          difficulty_instance: settle_shortfall_cascades_into_later_deal_recovery
          rationale: "The 3-link cascade (settle -> ledger accrual -> later-deal recovery leg shift) and the reversal cascade are asserted in the two §1.8 transitive_cascade instances."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds: [calculations.payout_waterfall, calculations.tax_1099_totals]
        excluded_because:
          difficulty_instance: provisional_estimate_vs_final_settlement_on_debit_shift
          rationale: "Both dual-variant pairs (estimate-vs-posted on Deal; cash-vs-accrual on TaxForm1099) are asserted by the §1.8 dual_variant_calc instances."

      - name: rate_threshold_triggers_layer
        claim_type: rate_threshold_triggers
        grounds: [calculations.royalty_with_cap, calculations.tier_split_with_cap_clip, calculations.tax_1099_totals]
        excluded_because:
          difficulty_instance: tax_1099_filing_threshold_inclusive_at_60000
          rationale: "Cumulative-threshold resets and inclusive boundaries (royalty cap clip inside mentor_split_window_third_deal_boundary; cap tier selection and 1099 threshold in §1.8 boundary instances)."

  # ==================================================================
  - section: consistency_model
    instances:
      - name: settle_response_immediately_reflects_all_mutations
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.Deal.CLOSED_to_SETTLED]
        distinguishing_aspect: "Immediate consistency: the 201 settle response already carries the full computed breakdown, and a subsequent GET of the agent, the window, the legs, and the ledger shows the same values with no reconciliation lag."
        test_recipe:
          setup: ["agent on P1 with debit 150000; deal gross 1000000 CLOSED"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Consist Cora", email: "cc2@x.com", license_number: "LIC-CS1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
              captures: { ag_v1: $.data.version }
            - call: "POST /brokerage/plans"
              payload: { name: "P1", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, mentor_split_pct: 0.10, mentor_deal_count: 3, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /brokerage/plans/${plan_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${plan_id}", effective_from: "2025-09-01", expected_agent_version: "${ag_v1}" }
              as: BrokerAdmin
            - call: "POST /brokerage/agents/${ag_id}/debit-adjustments"
              payload: { amount_cents: 150000, reason: "seed debit" }
              as: BrokerAdmin
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "110 Consistency Ct", gross_commission_cents: 1000000, closing_date: "2026-01-15" }
              as: TransactionCoordinator
              captures: { deal_id: $.data.id }
            - call: "POST /brokerage/deals/${deal_id}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/close"
              payload: {}
              as: TransactionCoordinator
          trigger:
            - call: "POST /brokerage/deals/${deal_id}/settle"
              payload: {}
              as: TransactionCoordinator
              captures: { s_id: $.data.id, s_net: $.data.agent_net_cents, s_rec: $.data.debit_recovery_cents }
            - call: "GET /brokerage/agents/${ag_id}"
              payload: {}
              as: BrokerAdmin
              captures: { deb: $.data.debit_balance_cents, cnt: $.data.settled_deal_count }
            - call: "GET /brokerage/anniversary-periods?agent_id=${ag_id}"
              payload: {}
              as: BrokerAdmin
              captures: { w_cd: "$.data[0].company_dollar_accrued_cents", w_roy: "$.data[0].royalty_accrued_cents" }
            - call: "GET /brokerage/disbursement-legs?settlement_id=${s_id}"
              payload: {}
              as: BrokerAdmin
              captures: { n_legs: "$.data.length()" }
            - call: "GET /brokerage/ledger-entries?agent_id=${ag_id}&entry_type=DEBIT_RECOVERY"
              payload: {}
              as: BrokerAdmin
              captures: { rec_amt: "$.data[0].amount_cents", rec_bal: "$.data[0].resulting_balance_cents" }
          assert:
            - "response: ${s_net} == 477000 and ${s_rec} == 150000 (fully computed in-request)"
            - "immediately after: debit_balance_cents == 0, settled_deal_count == 1"
            - "window: company_dollar_accrued_cents == 282000, royalty_accrued_cents == 60000"
            - "${n_legs} == 3 (ROYALTY 60000, COMPANY 463000, AGENT 477000)"
            - "ledger: DEBIT_RECOVERY entry amount -150000 with resulting_balance_cents 0"
