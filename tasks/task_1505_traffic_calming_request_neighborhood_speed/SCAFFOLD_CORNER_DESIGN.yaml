          - "errors[ERR_WORK_ORDER_NOT_FOUND]"
          - "errors[ERR_REMOVAL_REQUEST_NOT_FOUND]"
        distinguishing_aspect: "Every resource-scoped 404 in the catalog is triggerable: unknown ids for resident, study, plan, cycle, ballot, work order, and removal request each return their own domain-specific error_id."
        test_recipe:
          setup: ["empty DB (clock initialized)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
          trigger:
            - call: "GET /api/residents/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: CityAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /api/speed-studies/22222222-2222-4222-8222-222222222222"
              payload: {}
              as: CityAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /api/treatment-plans/33333333-3333-4333-8333-333333333333"
              payload: {}
              as: CityAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /api/funding-cycles/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: CityAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /api/ballots/55555555-5555-4555-8555-555555555555"
              payload: {}
              as: CityAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /api/installation-work-orders/66666666-6666-4666-8666-666666666666"
              payload: {}
              as: CityAdmin
              captures: { e6: $.data.error_id }
            - call: "GET /api/removal-requests/77777777-7777-4777-8777-777777777777"
              payload: {}
              as: CityAdmin
              captures: { e7: $.data.error_id }
          assert:
            - "e1 == ERR_RESIDENT_NOT_FOUND; e2 == ERR_STUDY_NOT_FOUND; e3 == ERR_PLAN_NOT_FOUND"
            - "e4 == ERR_CYCLE_NOT_FOUND; e5 == ERR_BALLOT_NOT_FOUND"
            - "e6 == ERR_WORK_ORDER_NOT_FOUND; e7 == ERR_REMOVAL_REQUEST_NOT_FOUND"

      - name: duplicate_cycle_year_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_DUPLICATE_CYCLE_YEAR]"
          - "validations[priority=8]"
        distinguishing_aspect: "cycle_year is unique citywide: a second cycle with the same year fails with ERR_DUPLICATE_CYCLE_YEAR."
        test_recipe:
          setup: ["cycle 2026 exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
