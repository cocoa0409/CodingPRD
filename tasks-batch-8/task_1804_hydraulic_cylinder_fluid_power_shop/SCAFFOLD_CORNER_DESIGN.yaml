    instances:
      - name: read_after_write_immediate_consistency
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: a cylinder read in the next request after creation returns every stored field exactly as written, with status ACTIVE and version 1 — no lag, no stale cache."
