# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2941 - Fresh-Cut Produce Processing
#
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7, walked section by section against
# references/claim-extraction-guide.md. Corners already asserted by a named
# §1.8 instance appear as excluded_because stubs with no test_recipe.
#
# CONVENTION - "the BASE chain": the 24 numbered setup_api_calls of the §1.8
# instance run_shelf_life_provisional_vs_final_diverges, which drive an empty
# database to a CLOSED run of 900 cases on line L1 and bind ${prod_id} ${prod_v}
# ${spec_id} ${line_id} ${ws_id} ${lot_id} ${rcpt_id} ${san_id} ${run_id}
# ${run_v2} ${hold_id}. "BASE steps 1..N" means only the first N of those calls;
# step 5 ends at the wash system, step 9 at the ACCEPTED receipt, step 13 at the
# VALIDATED clean, step 18 at the RUNNING run and step 23 at the CLOSED run.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: corner_product_create_returns_envelope_and_common_fields
        claim_type: Creation
        grounds:
          - entities.Product.fields.code
          - entities.Product.fields.active_spec_count
          - endpoints[POST /products]
        distinguishing_aspect: "A newly created Product echoes every declared input field, mints the four common fields with version 1, and reports active_spec_count 0 before any spec exists."
        test_recipe:
          setup: ["empty database", "the logical clock has not been moved, so it reads 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { code: "RML-SHRED", name: "Romaine Shred 1/4 inch", commodity_class: "LEAFY", allergen_group: "NONE", min_dwell_seconds: 90, min_spin_rpm: 800, min_antimicrobial_ppm: 20.0, base_shelf_life_days: 16, min_yield_pct: 55.00, hold_and_release_required: true }
              as: PlantAdmin
              captures: { pid: "$.data.id", pver: "$.data.version", pspecs: "$.data.active_spec_count", pcode: "$.data.code", pmin: "$.data.min_antimicrobial_ppm" }
          assert:
            - "HTTP 201 with response_type object and a meta block carrying api_request_id and api_request_timestamp"
            - "${pcode} == RML-SHRED and ${pmin} == 20.0: every declared input field is echoed unchanged"
            - "${pver} == 1 and ${pid} is a bare UUID with no type prefix; created_at and updated_at are ISO 8601 UTC with three fractional digits"
            - "${pspecs} == 0: the computed counter is present from the first response, not absent until a spec exists"

      - name: corner_products_list_pagination_reports_total_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /products]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three products stored, limit 2 offset 0 returns two rows with total_count 3 and has_more true, and offset 2 returns the last row with has_more false."
        test_recipe:
          setup: ["three products exist: RML-SHRED, CELR-DICE and SLAW-MIX"]
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "RML-SHRED", name: "Romaine Shred", commodity_class: "LEAFY", allergen_group: "NONE", min_dwell_seconds: 90, min_spin_rpm: 800, min_antimicrobial_ppm: 20.0, base_shelf_life_days: 16, min_yield_pct: 55.00, hold_and_release_required: true }
              as: PlantAdmin
            - call: "POST /products"
              payload: { code: "CELR-DICE", name: "Celery Dice", commodity_class: "ROOT", allergen_group: "CELERY", min_dwell_seconds: 120, min_spin_rpm: 800, min_antimicrobial_ppm: 25.0, base_shelf_life_days: 12, min_yield_pct: 60.00, hold_and_release_required: false }
              as: PlantAdmin
            - call: "POST /products"
              payload: { code: "SLAW-MIX", name: "Slaw Mix", commodity_class: "LEAFY", allergen_group: "SULFITE", min_dwell_seconds: 100, min_spin_rpm: 850, min_antimicrobial_ppm: 22.0, base_shelf_life_days: 14, min_yield_pct: 58.00, hold_and_release_required: true }
              as: PlantAdmin
          trigger:
            - call: "GET /products"
              payload: { limit: 2, offset: 0 }
              as: QAManager
              captures: { first_code: "$.data[0].code", second_code: "$.data[1].code" }
            - call: "GET /products"
              payload: { limit: 2, offset: 2 }
              as: QAManager
              captures: { third_code: "$.data[0].code" }
          assert:
            - "the first call returns exactly 2 rows with meta total_count 3 and has_more true"
            - "the second call returns exactly 1 row with total_count 3 and has_more false"
            - "${first_code}, ${second_code} and ${third_code} are the three distinct codes with no row repeated across the two pages"
            - "response_type is array on both calls"

      - name: corner_unknown_path_id_returns_entity_specific_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=10]
          - validations[priority=13]
        distinguishing_aspect: "Each {id} path segment reports its own entity's 404 error id rather than a generic one, and the error body carries error_id plus message inside data."
        test_recipe:
          setup: ["empty database", "the UUID 11111111-1111-4111-8111-111111111111 names no row of any entity"]
          setup_api_calls: []
          trigger:
            - call: "GET /products/11111111-1111-4111-8111-111111111111"
              as: QAManager
              captures: { e_product: "$.data.error_id", msg: "$.data.message" }
            - call: "GET /grower-lots/11111111-1111-4111-8111-111111111111"
              as: QAManager
              captures: { e_lot: "$.data.error_id" }
            - call: "GET /raw-receipts/11111111-1111-4111-8111-111111111111"
              as: QAManager
              captures: { e_receipt: "$.data.error_id" }
            - call: "GET /lines/11111111-1111-4111-8111-111111111111"
              as: QAManager
              captures: { e_line: "$.data.error_id" }
            - call: "GET /wash-systems/11111111-1111-4111-8111-111111111111"
              as: QAManager
              captures: { e_wash: "$.data.error_id" }
            - call: "GET /process-runs/11111111-1111-4111-8111-111111111111"
              as: QAManager
              captures: { e_run: "$.data.error_id" }
            - call: "POST /lot-consumptions/11111111-1111-4111-8111-111111111111/void"
              payload: { expected_process_run_version: "${missing_version}" }
              as: LineOperator
              captures: { e_cons: "$.data.error_id" }
            - call: "POST /finished-cases/11111111-1111-4111-8111-111111111111/ship"
              as: ShippingClerk
              captures: { e_case: "$.data.error_id" }
            - call: "POST /hold-records/11111111-1111-4111-8111-111111111111/release"
              as: QAManager
              captures: { e_hold: "$.data.error_id" }
            - call: "POST /sanitation-events/11111111-1111-4111-8111-111111111111/start"
              as: SanitationTech
              captures: { e_san: "$.data.error_id" }
            - call: "POST /environmental-swabs/11111111-1111-4111-8111-111111111111/result"
              payload: { result: "NEGATIVE" }
              as: QATechnician
              captures: { e_swab: "$.data.error_id" }
            - call: "POST /corrective-actions/11111111-1111-4111-8111-111111111111/start"
              as: QATechnician
              captures: { e_ca: "$.data.error_id" }
          assert:
            - "every call returns HTTP 404 with response_type error and a data block containing error_id and a non-empty ${msg}"
            - "${e_product} == ERR_PRODUCT_NOT_FOUND, ${e_lot} == ERR_GROWER_LOT_NOT_FOUND, ${e_receipt} == ERR_RAW_RECEIPT_NOT_FOUND, ${e_line} == ERR_LINE_NOT_FOUND, ${e_wash} == ERR_WASH_SYSTEM_NOT_FOUND, ${e_run} == ERR_PROCESS_RUN_NOT_FOUND"
            - "${e_cons} == ERR_LOT_CONSUMPTION_NOT_FOUND, ${e_case} == ERR_FINISHED_CASE_NOT_FOUND, ${e_hold} == ERR_HOLD_RECORD_NOT_FOUND, ${e_san} == ERR_SANITATION_EVENT_NOT_FOUND, ${e_swab} == ERR_ENVIRONMENTAL_SWAB_NOT_FOUND, ${e_ca} == ERR_CORRECTIVE_ACTION_NOT_FOUND"
            - "the void call reports the path 404 before ever examining its expected_process_run_version placeholder, because path segments resolve left to right and before any body field"

      - name: corner_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - validations[priority=4]
          - entities.Product.fields.min_yield_pct
        distinguishing_aspect: "Omitting the required min_yield_pct from a product create returns ERR_INVALID_REQUEST with HTTP 400 and stores nothing, while an unknown extra field would have been ignored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { code: "RML-SHRED", name: "Romaine Shred", commodity_class: "LEAFY", allergen_group: "NONE", min_dwell_seconds: 90, min_spin_rpm: 800, min_antimicrobial_ppm: 20.0, base_shelf_life_days: 16, hold_and_release_required: true }
              as: PlantAdmin
              captures: { err: "$.data.error_id" }
            - call: "GET /products"
              payload: { limit: 10, offset: 0 }
              as: PlantAdmin
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "the follow-up list returns total_count 0: a rejected create persists nothing"
            - "per priority 4 an unknown field carried alongside the required ones would have been ignored rather than rejected, so this failure is specifically about a missing required field"

      - name: corner_enum_and_sign_constraints_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=4]
          - entities.GrowerLot.fields.commodity_class
          - entities.GrowerLot.fields.water_source
        distinguishing_aspect: "An undeclared enum member, a malformed instant and a negative weight each fail the same priority-4 gate with ERR_INVALID_REQUEST before any business rule runs."
        test_recipe:
          setup: ["the logical clock is 2026-08-02T05:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T05:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /grower-lots"
              payload: { grower_code: "GRW-900", ranch_block: "B9", commodity_class: "HERB", harvest_datetime: "2026-08-01T08:00:00Z", water_source: "WELL", adjacent_animal_operation: false, preharvest_test_result: "NEGATIVE" }
              as: QATechnician
              captures: { e_enum: "$.data.error_id" }
            - call: "POST /grower-lots"
              payload: { grower_code: "GRW-901", ranch_block: "B9", commodity_class: "LEAFY", harvest_datetime: "2026-08-01", water_source: "WELL", adjacent_animal_operation: false, preharvest_test_result: "NEGATIVE" }
              as: QATechnician
              captures: { e_date: "$.data.error_id" }
            - call: "POST /lines"
              payload: { line_code: "L9", required_disassembly_component_count: -3, max_atp_rlu: 200 }
              as: PlantAdmin
              captures: { e_sign: "$.data.error_id" }
          assert:
            - "${e_enum} == ERR_INVALID_REQUEST: HERB is not a declared member of commodity_class"
            - "${e_date} == ERR_INVALID_REQUEST: a date-only string is not an ISO 8601 UTC instant"
            - "${e_sign} == ERR_INVALID_REQUEST: a negative component count is not a number of the right sign"
            - "all three are HTTP 400 and none of them creates a row"

      - name: corner_optional_prior_reject_count_defaults_to_zero
        claim_type: Defaults
        grounds:
          - entities.GrowerLot.fields.prior_rejected_receipt_count
          - calculations.grower_lot_risk_score
        distinguishing_aspect: "Omitting prior_rejected_receipt_count stores 0 rather than null, so the PREHARVEST score of an otherwise clean WELL-water lot is exactly 100."
        test_recipe:
          setup: ["the logical clock is 2026-08-02T05:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T05:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /grower-lots"
              payload: { grower_code: "GRW-910", ranch_block: "B10", commodity_class: "LEAFY", harvest_datetime: "2026-08-01T08:00:00Z", water_source: "WELL", adjacent_animal_operation: false, preharvest_test_result: "NEGATIVE" }
              as: QATechnician
              captures: { lot_id: "$.data.id", priors: "$.data.prior_rejected_receipt_count", st: "$.data.status" }
            - call: "POST /grower-lots/${lot_id}/approve"
              as: QAManager
              captures: { pre: "$.data.preharvest_risk_score", trail: "$.data.trailing_risk_score" }
          assert:
            - "${priors} == 0 and not null, and ${st} == PENDING_APPROVAL (the declared initial state)"
            - "${pre} == 100 and ${trail} == 100: with the default in place no penalty term applies"

      - name: corner_computed_receipt_fields_are_derived_server_side
        claim_type: Computed Fields
        grounds:
          - calculations.receipt_temperature_grade_and_accepted_weight
          - entities.RawReceipt.fields.net_weight_lb
          - entities.RawReceipt.fields.accepted_lb
          - entities.RawReceipt.fields.remaining_lb
        distinguishing_aspect: "net_weight_lb appears on the create response as gross minus tare, while accepted_lb and remaining_lb stay null until the disposition, and dispositioned_by_user_id is stamped from the header rather than the body."
        test_recipe:
          setup: ["BASE steps 1-7 have run, so an APPROVED lot G1 exists and the clock is 2026-08-02T05:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /raw-receipts"
              payload: { grower_lot_id: "${lot_id}", received_at: "2026-08-02T05:10:00Z", pulp_temp_c: 3.1, gross_weight_lb: 42000.00, tare_weight_lb: 2000.00 }
              as: ReceivingClerk
              as_user_id: "recv-7"
              captures: { rid: "$.data.id", net: "$.data.net_weight_lb", acc: "$.data.accepted_lb", rem: "$.data.remaining_lb", grade: "$.data.temp_grade", st: "$.data.status" }
            - call: "POST /raw-receipts/${rid}/disposition"
              payload: { decision: "ACCEPT", trim_loss_lb: 4000.00 }
              as: QATechnician
              as_user_id: "qat-9"
              captures: { acc2: "$.data.accepted_lb", rem2: "$.data.remaining_lb", by: "$.data.dispositioned_by_user_id", st2: "$.data.status" }
          assert:
            - "${net} == 40000.00 == round_half_up(42000.00 - 2000.00, 2), ${grade} == IN_SPEC and ${st} == PENDING_INSPECTION"
            - "${acc} and ${rem} are null on the create response: accepted pounds only exist after an ACCEPT decision"
            - "${acc2} == 36000.00 and ${rem2} == 36000.00 after the disposition"
            - "${st2} == ACCEPTED and ${by} == qat-9, taken from X-User-ID and never from the request body"
            - "per priority 4 a client that also sent net_weight_lb or accepted_lb in the body would see those keys ignored, with the computed values above unchanged"

      - name: corner_antimicrobial_reading_is_immutable
        claim_type: Immutability
        grounds:
          - entities.AntimicrobialReading.fields.sequence_no
          - endpoints[POST /wash-systems/{id}/antimicrobial-readings]
        distinguishing_aspect: "AntimicrobialReading is declared common_fields false, so its rows carry id and created_at but no version or updated_at, there is no endpoint that mutates one, and its ordering key is the server-minted sequence_no."
        test_recipe:
          setup: ["BASE steps 1-5 have run, so wash system W1 exists with 4000 gal and the clock is 2026-08-02T05:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /wash-systems/${ws_id}/antimicrobial-readings"
              payload: { reading_at: "2026-08-02T05:30:00Z", free_chlorine_ppm: 24.0, ph: 6.8, orp_mv: 700, turbidity_ntu: 1.2 }
              as: SanitationTech
              as_user_id: "sant-5"
              captures: { r1_id: "$.data.id", r1_seq: "$.data.sequence_no", r1_by: "$.data.taken_by_user_id", r1_target: "$.data.target_free_chlorine_ppm_at_reading", r1_below: "$.data.below_target" }
            - call: "POST /wash-systems/${ws_id}/antimicrobial-readings"
              payload: { reading_at: "2026-08-02T05:30:00Z", free_chlorine_ppm: 19.0, ph: 6.7, orp_mv: 690, turbidity_ntu: 1.4 }
              as: SanitationTech
              as_user_id: "sant-5"
              captures: { r2_seq: "$.data.sequence_no", r2_below: "$.data.below_target" }
            - call: "GET /wash-systems/${ws_id}"
              as: SanitationTech
              captures: { hw: "$.data.reading_sequence_high_water" }
          assert:
            - "both responses carry id and created_at but no version and no updated_at field at all"
            - "${r1_seq} == 1 and ${r2_seq} == 2: the two rows share an identical reading_at, and only sequence_no separates them deterministically"
            - "${hw} == 2 on the parent wash system"
            - "${r1_by} == sant-5, stamped from X-User-ID"
            - "${r1_target} == 20.0 and ${r1_below} == false; ${r2_below} == true because 19.0 is under the same 20.0 target"
            - "no PATCH, PUT or DELETE endpoint exists for a reading in §1.5, so the row is append-only history"

      - name: corner_customer_spec_requires_existing_parent_product
        claim_type: Parent Relationships
        grounds:
          - validations[priority=5]
          - validations[priority=24]
          - entities.CustomerSpec.fields.product_id
        distinguishing_aspect: "A spec create against an unknown product id fails with ERR_PRODUCT_NOT_FOUND before the optimistic-concurrency check on expected_product_version is ever evaluated."
        test_recipe:
          setup: ["one product exists with version 1"]
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "RML-SHRED", name: "Romaine Shred", commodity_class: "LEAFY", allergen_group: "NONE", min_dwell_seconds: 90, min_spin_rpm: 800, min_antimicrobial_ppm: 20.0, base_shelf_life_days: 16, min_yield_pct: 55.00, hold_and_release_required: true }
              as: PlantAdmin
              captures: { pid: "$.data.id", pver: "$.data.version" }
          trigger:
            - call: "POST /products/11111111-1111-4111-8111-111111111111/customer-specs"
              payload: { customer_code: "FSVC-NORTH", channel: "FOODSERVICE", max_shelf_life_days_offered: 14, min_remaining_shelf_life_days_at_ship: 10, atmosphere_required: "MAP_LOW_O2", case_net_weight_lb: 20.0, code_date_format: "JULIAN", expected_product_version: "${pver}" }
              as: PlantAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /products/${pid}/customer-specs"
              payload: { customer_code: "FSVC-NORTH", channel: "FOODSERVICE", max_shelf_life_days_offered: 14, min_remaining_shelf_life_days_at_ship: 10, atmosphere_required: "MAP_LOW_O2", case_net_weight_lb: 20.0, code_date_format: "JULIAN", expected_product_version: "${pver}" }
              as: PlantAdmin
              captures: { sid: "$.data.id", srev: "$.data.spec_revision", sst: "$.data.status", ssup: "$.data.superseded_at" }
            - call: "GET /products/${pid}/customer-specs"
              as: QAManager
              captures: { listed_id: "$.data[0].id" }
          assert:
            - "${err} == ERR_PRODUCT_NOT_FOUND with HTTP 404, even though the payload's expected_product_version was correct"
            - "${sid} exists on the valid parent with ${srev} == 1, ${sst} == ACTIVE and ${ssup} null"
            - "${listed_id} == ${sid}: the child is reachable from its parent through the declared sub-resource GET"

      - name: corner_duplicate_master_data_code_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=63]
          - errors[ERR_DUPLICATE_CODE]
        distinguishing_aspect: "Product.code, Line.line_code and WashSystem.system_code are unique plant-wide, while two CustomerSpec rows for the same product and channel are deliberately allowed because the newer one supersedes the older."
        test_recipe:
          setup: ["a product RML-SHRED, a line L1 and a wash system W1 already exist"]
          setup_api_calls:
            - call: "POST /products"
              payload: { code: "RML-SHRED", name: "Romaine Shred", commodity_class: "LEAFY", allergen_group: "NONE", min_dwell_seconds: 90, min_spin_rpm: 800, min_antimicrobial_ppm: 20.0, base_shelf_life_days: 16, min_yield_pct: 55.00, hold_and_release_required: true }
              as: PlantAdmin
              captures: { pid: "$.data.id", pver: "$.data.version" }
            - call: "POST /lines"
              payload: { line_code: "L1", required_disassembly_component_count: 12, max_atp_rlu: 200 }
              as: PlantAdmin
            - call: "POST /wash-systems"
              payload: { system_code: "W1", water_volume_gal: 4000, max_concurrent_runs: 2 }
              as: PlantAdmin
          trigger:
            - call: "POST /products"
              payload: { code: "RML-SHRED", name: "Romaine Shred Duplicate", commodity_class: "LEAFY", allergen_group: "NONE", min_dwell_seconds: 95, min_spin_rpm: 800, min_antimicrobial_ppm: 20.0, base_shelf_life_days: 15, min_yield_pct: 55.00, hold_and_release_required: true }
              as: PlantAdmin
              captures: { e_prod: "$.data.error_id" }
            - call: "POST /lines"
              payload: { line_code: "L1", required_disassembly_component_count: 8, max_atp_rlu: 180 }
              as: PlantAdmin
              captures: { e_line: "$.data.error_id" }
            - call: "POST /wash-systems"
              payload: { system_code: "W1", water_volume_gal: 2000, max_concurrent_runs: 1 }
              as: PlantAdmin
              captures: { e_wash: "$.data.error_id" }
          assert:
            - "${e_prod} == ERR_DUPLICATE_CODE, ${e_line} == ERR_DUPLICATE_CODE and ${e_wash} == ERR_DUPLICATE_CODE, all HTTP 409"
            - "the original three rows are unchanged, and GET /products returns total_count 1"

      - name: corner_run_planned_window_must_be_non_empty
        claim_type: Type Constraints
        grounds:
          - validations[priority=54]
          - entities.ProcessRun.fields.planned_end_at
        distinguishing_aspect: "The interval rule also carries the well-formedness clause, so planned_end_at equal to planned_start_at is refused with ERR_LINE_INTERVAL_CONFLICT rather than silently creating a zero-length occupancy."
        test_recipe:
          setup: ["execute BASE steps 1-5, so a product, spec, line L1 and wash system W1 exist and the line carries no runs"]
          setup_api_calls: []
          trigger:
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T07:00:00Z", planned_end_at: "2026-08-03T07:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { e_equal: "$.data.error_id" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T07:00:00Z", planned_end_at: "2026-08-03T06:00:00Z", crew_size: 6 }
              as: LineOperator
              captures: { e_inverted: "$.data.error_id" }
            - call: "POST /process-runs"
              payload: { line_id: "${line_id}", product_id: "${prod_id}", customer_spec_id: "${spec_id}", wash_system_id: "${ws_id}", planned_start_at: "2026-08-03T07:00:00Z", planned_end_at: "2026-08-03T07:00:01Z", crew_size: 6 }
              as: LineOperator
              captures: { ok_id: "$.data.id", ok_status: "$.data.run_status" }
          assert:
            - "${e_equal} == ERR_LINE_INTERVAL_CONFLICT with HTTP 409: planned_end_at must be strictly after planned_start_at"
            - "${e_inverted} == ERR_LINE_INTERVAL_CONFLICT for the inverted window"
            - "${ok_id} exists with ${ok_status} == SETUP for a one-second window, so the rule is strictly-greater and not a minimum-duration rule"

  - section: state_machines
    instances:

      - name: corner_every_entity_starts_in_its_declared_initial_state
        claim_type: Initial State
        grounds:
          - state_machines[GrowerLot].initial_state
          - state_machines[Line].initial_state
          - state_machines[WashSystem].initial_state
          - state_machines[ProcessRun].dimension=run_status.initial_state
          - state_machines[ProcessRun].dimension=disposition_status.initial_state
          - state_machines[SanitationEvent].initial_state
          - state_machines[EnvironmentalSwab].initial_state
        distinguishing_aspect: "Seven freshly created rows report the declared initial state of every machine in one sweep, including the Line whose RESTRICTED posture is derived rather than stored and the ProcessRun that starts in two initial states at once."
        test_recipe:
          setup: ["execute BASE steps 1-5, so product P_ROMAINE, spec S_FS, line L1 and wash system W1 exist and the clock reads 2026-08-02T05:00:00Z"]
          setup_api_calls: []
