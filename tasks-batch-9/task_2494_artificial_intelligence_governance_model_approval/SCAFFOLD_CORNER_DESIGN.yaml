            - "GET /inventory-summary still reports inventory_count 0 and ledger_reach_balance 0"

      - name: governance_officer_cannot_clear_a_domain_gate_forbidden
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds: [roles.BusinessReviewer.exclusive_operations, "errors[ERR_UNAUTHORIZED]", "endpoints[POST /review-gates/{id}/clear]"]
        distinguishing_aspect: "The denial runs in both directions: the GovernanceOfficer is not in the clear endpoint's roles list at all, so clearing a gate is 403 ERR_UNAUTHORIZED and not the gate-type mismatch code."
