            - "After the refusal, selected_remedy_option_id is still ${opt_oc3_rich}, specific_accrual_cents is still 7000000 and version is still 2"
            - "The second trigger call returns 200 with selected_remedy_option_id == \"${opt_oc3_cheap}\", specific_accrual_cents == 5500000 and version == 3"

      - name: corner_derived_significant_exposure_count_reconciles_on_every_source_change
        claim_type: derived_field_reconciliation
        grounds:
          - entities.AccrualPeriod.fields.significant_exposure_count
          - entities.AccrualPeriod.fields.requires_significant_exposure_disclosure
          - calculations.reserve_rollforward_disclosure
        distinguishing_aspect: "The derived pair is zero/false at period creation, flips to 1/true when a campaign crosses the 50000000-cent disclosure threshold, does NOT move for a second sub-threshold campaign, and the value is then frozen into the rollforward snapshot."
        test_recipe:
          setup:
            - "AccrualPeriod 2026-Q3 (OPEN) and family FAM-SE2 (cap 500000000)."
            - "FA-SE-BIG over 10000 units with a 14000-cent-per-unit option (parts 4000 + labor rhu(100*9500/100)=9500 + admin 500, take 10000) -> 140000000 cents."
            - "FA-SE-SMALL over 500 units with an 11000-cent-per-unit option -> 5500000 cents."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
              captures: { p_se2_id: $.data.id }
