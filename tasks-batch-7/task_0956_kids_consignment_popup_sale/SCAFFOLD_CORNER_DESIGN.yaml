          setup: ["Event in DRAFT with markdown rule R1 [2026-06-05, 2026-06-06) at 25%."]
          setup_api_calls:
            - { call: "POST /sale-events", payload: { name: "Fall Sale", intake_start: "2026-06-01T09:00:00Z", intake_end: "2026-06-03T18:00:00Z", presale_start: "2026-06-04T17:00:00Z", presale_end: "2026-06-04T20:00:00Z", sale_start: "2026-06-05T09:00:00Z", sale_end: "2026-06-07T15:00:00Z", pickup_deadline: "2026-06-07T18:00:00Z" }, as: EventOrganizer, captures: { ev_id: $.data.id } }
