# =============================================================================
# Task 1962 — School District Budget & Bond/Levy Election
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Sections follow references/claim-extraction-guide.md. Claims already exercised
# by a §1.8 difficulty instance are emitted as excluded_because stubs.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_fiscal_year_applies_system_defaults
        claim_type: creation
        grounds: [entities.FiscalYear]
        distinguishing_aspect: "A fiscal year is created DRAFT with computed aggregates zeroed and version 1; id/created_at are server-minted."
        test_recipe:
          setup: ["Empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id, st: $.data.status, v: $.data.version, fte: $.data.authorized_fte_total, opc: $.data.open_position_count }
          assert:
            - "HTTP 201; FiscalYear.${fy}.status == DRAFT and version == 1"
            - "authorized_fte_total == 0 and open_position_count == 0 (computed defaults)"
            - "created_at reflects the logical clock default 2026-08-01T00:00:00Z, not wall-clock time"

      - name: create_fiscal_year_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.FiscalYear.fields.fte_ceiling, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input fte_ceiling yields ERR_INVALID_REQUEST (400); no fiscal year is persisted."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000 }
              as: BusinessManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with http 400"
            - "GET /district/fiscal-years afterwards returns an empty list (total_count == 0)"

      - name: create_fiscal_year_end_before_start_returns_invalid_field_value
        claim_type: type_constraints
        grounds: [entities.FiscalYear.fields.end_date, "errors[ERR_INVALID_FIELD_VALUE]"]
        distinguishing_aspect: "end_date not after start_date is a semantic field error (422), distinct from a missing-field 400."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2028-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_FIELD_VALUE with http 422"

      - name: get_fiscal_year_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_FISCAL_YEAR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a well-formed but unknown fiscal-year id yields ERR_FISCAL_YEAR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /district/fiscal-years/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_FISCAL_YEAR_NOT_FOUND with http 404"

      - name: get_bond_project_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_BOND_PROJECT_NOT_FOUND]"]
        distinguishing_aspect: "The same not-found discipline applies to deep resources: unknown bond project id -> ERR_BOND_PROJECT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /district/bond-projects/00000000-0000-0000-0000-000000000000"
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BOND_PROJECT_NOT_FOUND with http 404"

      - name: fiscal_year_list_paginates_with_limit_and_offset
        claim_type: listing
        grounds: [response_envelope, endpoints.GET_/district/fiscal-years]
        distinguishing_aspect: "List endpoints honor envelope pagination: limit 10 returns the first 10 of 12 in created_at ASC order with has_more true; offset 10 returns the remaining 2 with has_more false."
        test_recipe:
          setup: ["Twelve fiscal years FY0001..FY0012 created in order"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY0001", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
            - call: "POST /district/fiscal-years"
              payload: { label: "FY0002", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
            - call: "POST /district/fiscal-years"
              payload: { label: "FY0003", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
            - call: "POST /district/fiscal-years"
              payload: { label: "FY0004", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
            - call: "POST /district/fiscal-years"
              payload: { label: "FY0005", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
            - call: "POST /district/fiscal-years"
              payload: { label: "FY0006", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
            - call: "POST /district/fiscal-years"
              payload: { label: "FY0007", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
            - call: "POST /district/fiscal-years"
              payload: { label: "FY0008", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
            - call: "POST /district/fiscal-years"
              payload: { label: "FY0009", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
            - call: "POST /district/fiscal-years"
              payload: { label: "FY0010", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
            - call: "POST /district/fiscal-years"
              payload: { label: "FY0011", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
            - call: "POST /district/fiscal-years"
              payload: { label: "FY0012", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
          trigger:
            - call: "GET /district/fiscal-years"
              payload: { limit: 10 }
              as: Auditor
              captures: { first_label: "$.data[0].label", tenth_label: "$.data[9].label" }
            - call: "GET /district/fiscal-years"
              payload: { limit: 10, offset: 10 }
              as: Auditor
              captures: { eleventh_label: "$.data[0].label", twelfth_label: "$.data[1].label" }
          assert:
            - "Page 1: data[0].label == FY0001 and data[9].label == FY0010 (created_at ASC), total_count == 12, has_more == true"
            - "Page 2 (offset 10): exactly 2 items — data[0].label == FY0011 and data[1].label == FY0012, has_more == false"

      - name: enrollment_projection_computes_weighted_pupils
        claim_type: computed_fields
        grounds: [calculations.weighted_pupil_projection, entities.EnrollmentProjection.fields.weighted_pupils_projected]
        distinguishing_aspect: "MIDDLE band weight 1.05: 800 projected pupils yields weighted_pupils_projected == 840 while the row stays PROVISIONAL with weighted_pupils_certified null."
        test_recipe:
          setup: ["FY2028 created and OPEN"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
          trigger:
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "MIDDLE", projected_pupils: 800 }
              as: BudgetAnalyst
              captures: { ep: $.data.id, w: $.data.weighted_pupils_projected, wc: $.data.weighted_pupils_certified, st: $.data.status }
          assert:
            - "weighted_pupils_projected == 840 (round_half_up(800 * 1.05, 0))"
            - "weighted_pupils_certified == null and status == PROVISIONAL until certification"

      - name: duplicate_grade_band_projection_rejected
        claim_type: type_constraints
        grounds: ["errors[ERR_DUPLICATE_GRADE_BAND]"]
        distinguishing_aspect: "One projection per grade band per fiscal year: the second ELEMENTARY row is rejected with ERR_DUPLICATE_GRADE_BAND (409)."
        test_recipe:
          setup: ["FY2028 OPEN with an ELEMENTARY projection of 1200"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 1200 }
              as: BudgetAnalyst
          trigger:
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 900 }
              as: BudgetAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DUPLICATE_GRADE_BAND with http 409"

      - name: certify_projection_computes_certified_weight
        claim_type: computed_fields
        grounds: [calculations.weighted_pupil_projection, entities.EnrollmentProjection.fields.weighted_pupils_certified]
        distinguishing_aspect: "Certifying HIGH with 1020 actual pupils computes weighted_pupils_certified == 1173 (1020 x 1.15) and flips status to CERTIFIED; the provisional weight 1150 is retained."
        test_recipe:
          setup: ["FY2028 OPEN with a HIGH projection of 1000 (weighted_pupils_projected 1150)"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "HIGH", projected_pupils: 1000 }
              as: BudgetAnalyst
              captures: { ep: $.data.id }
          trigger:
            - call: "POST /district/enrollment-projections/${ep}/certify"
              payload: { actual_pupils: 1020 }
              as: BusinessManager
              captures: { wc: $.data.weighted_pupils_certified, wp: $.data.weighted_pupils_projected, st: $.data.status }
          assert:
            - "weighted_pupils_certified == 1173 and weighted_pupils_projected still == 1150"
            - "status == CERTIFIED; version incremented to 2"

      - name: district_publication_is_immutable_without_version_field
        claim_type: immutability
        grounds: [entities.DistrictPublication]
        distinguishing_aspect: "DistrictPublication has common_fields false: the create response exposes id and created_at but no version/updated_at, and no update or delete endpoint exists for it."
        test_recipe:
          setup:
            - "FY2028 OPEN; proposal 1,000,000 BOARD_APPROVED with one project; measure drafted on the 2027-11-02 election; clock at 2027-08-15"
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
            - call: "POST /district/fiscal-years/${fy}/bond-proposals"
              payload: { question_title: "Bond Question A", purpose: "Roof", total_amount: 1000000 }
              as: BoardClerk
              captures: { bp: $.data.id }
            - call: "POST /district/bond-proposals/${bp}/projects"
              payload: { name: "Roof", site_code: "HS-01", estimated_cost: 1000000, construction_start: "2028-06-01", construction_end: "2028-08-15", priority_rank: 1 }
              as: BoardClerk
            - call: "POST /district/bond-proposals/${bp}/approve-board"
              as: BoardClerk
            - call: "POST /district/elections"
              payload: { election_date: "2027-11-02", election_type: "REGULAR" }
              as: BoardClerk
              captures: { el: $.data.id }
            - call: "POST /district/elections/${el}/ballot-measures"
              payload: { bond_proposal_id: "${bp}", ballot_language: "Shall the District issue bonds for roof repairs" }
              as: BoardClerk
              as_user_id: "clerk-drafter-1"
              captures: { bm: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-15T00:00:00Z" }
              as: BoardClerk
          trigger:
            - call: "POST /district/ballot-measures/${bm}/publications"
              payload: { publication_type: "FACTUAL", content: "Bond fact sheet" }
              as: BoardClerk
              captures: { pub: $.data.id, st: $.data.status }
          assert:
            - "HTTP 201; DistrictPublication.${pub}.status == PUBLISHED"
            - "Response contains id and created_at but NO version and NO updated_at keys (append-only record)"
            - "No PUT/PATCH/DELETE endpoint exists for publications (GET list is the only read channel)"

      - name: create_bond_project_extra_field_client_id_ignored_input
        claim_type: system_fields
        grounds: [entities.BondProject]
        distinguishing_aspect: "A client-supplied id in the create payload is ignored: the server-minted UUID is authoritative and never equals the supplied value."
        test_recipe:
          setup: ["FY2028 OPEN with bond proposal DRAFT"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
            - call: "POST /district/fiscal-years/${fy}/bond-proposals"
              payload: { question_title: "Bond Question A", purpose: "Roof", total_amount: 1000000 }
              as: BoardClerk
              captures: { bp: $.data.id }
          trigger:
            - call: "POST /district/bond-proposals/${bp}/projects"
              payload: { id: "00000000-1111-4111-8111-111111111111", name: "Roof", site_code: "HS-01", estimated_cost: 1000000, construction_start: "2028-06-01", construction_end: "2028-08-15", priority_rank: 1 }
              as: BoardClerk
              captures: { prj: $.data.id }
          assert:
            - "HTTP 201 and BondProject.${prj}.id != '00000000-1111-4111-8111-111111111111' (client-supplied id ignored)"
            - "created_at/updated_at are server-stamped from the logical clock"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: budget_version_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.BudgetVersion]
        distinguishing_aspect: "A newly created budget version starts in DRAFT with version_label v1 and null hearing_held_date/adopted_at."
        test_recipe:
          setup: ["FY2028 OPEN"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
          trigger:
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id, st: $.data.status, lbl: $.data.version_label }
          assert:
            - "BudgetVersion.${bv}.status == DRAFT and version_label == v1"
            - "hearing_held_date == null and adopted_at == null and total_appropriations == 0"

      - name: position_initial_state_proposed_before_adoption
        claim_type: initial_state
        grounds: [state_machines.Position]
        distinguishing_aspect: "A position created while its allocation is DRAFT starts PROPOSED (not OPEN); only the adoption cascade opens it."
        test_recipe:
          setup: ["FY2028 OPEN; ELEMENTARY projection 1200; budget version with ELEMENTARY allocation 3.0"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/enrollment-projections"
              payload: { grade_band: "ELEMENTARY", projected_pupils: 1200 }
              as: BudgetAnalyst
              captures: { ep: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
            - call: "POST /district/budget-versions/${bv}/staffing-allocations"
              payload: { grade_band: "ELEMENTARY", enrollment_projection_id: "${ep}", allocated_fte: 3.0 }
              as: BudgetAnalyst
              captures: { sa: $.data.id }
          trigger:
            - call: "POST /district/staffing-allocations/${sa}/positions"
              payload: { title: "Teacher 1", fte: 1.0, base_salary: 64000 }
              as: BudgetAnalyst
              captures: { p: $.data.id, st: $.data.status }
          assert:
            - "Position.${p}.status == PROPOSED (initial state while allocation is DRAFT)"
            - "incumbent_salary == null"

      - name: close_terminal_fiscal_year_rejected_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.FiscalYear, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal: a second close on a closed fiscal year is rejected with ERR_INVALID_STATE and no further version increment."
        test_recipe:
          setup: ["FY2028 with an ADOPTED budget version, then CLOSED"]
          setup_api_calls:
            - call: "POST /district/fiscal-years"
              payload: { label: "FY2028", start_date: "2027-07-01", end_date: "2028-06-30", eav_current: 500000000, eav_prior: 480000000, prior_year_extension: 9000000, outstanding_debt_principal: 4500000, fte_ceiling: 200 }
              as: BusinessManager
              captures: { fy: $.data.id }
            - call: "POST /district/fiscal-years/${fy}/open"
              as: BusinessManager
              captures: { fy_v: $.data.version }
            - call: "POST /district/fiscal-years/${fy}/budget-versions"
              payload: { expected_fiscal_year_version: "${fy_v}" }
              as: BudgetAnalyst
              captures: { bv: $.data.id }
            - call: "POST /district/budget-versions/${bv}/budget-lines"
              payload: { fund_code: "EDUCATION", function_code: "1100", object_code: "100", cost_center: "DISTRICT", appropriation_amount: 1000 }
              as: BudgetAnalyst
            - call: "POST /district/budget-versions/${bv}/revenue-estimates"
              payload: { operating_levy_request: 8500000, debt_service_levy: 1200000, other_revenue: 500000, cpi_rate: 0.034 }
              as: BusinessManager
            - call: "POST /district/budget-versions/${bv}/propose"
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: BoardClerk
            - call: "POST /district/budget-versions/${bv}/hearings"
              payload: { venue: "BOARD_ROOM", hearing_date: "2027-03-20" }
              as: BoardClerk
              captures: { h1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-20T09:00:00Z" }
              as: BoardClerk
            - call: "POST /district/public-hearings/${h1}/hold"
              as: BoardClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-27T09:00:00Z" }
              as: BoardClerk
            - call: "POST /district/budget-versions/${bv}/adopt"
              as: BoardClerk
            - call: "POST /district/fiscal-years/${fy}/close"
              as: BusinessManager
              captures: { st: $.data.status }
          trigger:
            - call: "POST /district/fiscal-years/${fy}/close"
              as: BusinessManager
              captures: { err: $.data.error_id }
          assert:
            - "First close succeeds: status == CLOSED"
            - "Second close rejected: ${err} == ERR_INVALID_STATE (CLOSED is terminal)"

      - name: canvass_already_canvassed_election_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Election, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANVASSED election cannot be canvassed again; the repeated trigger is rejected, not re-applied (idempotent terminal state)."
        test_recipe:
