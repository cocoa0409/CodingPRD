# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Community Fire Protection Evaluation & Class Assignment
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: staffing_variant_career_equivalent_vs_raw_headcount
        grounds:
          - calculations.staffing_credit
          - entities.FireDepartment.fields.dept_type
          - entities.ScoreSheet.fields.staffing_variant_used
        distinguishing_aspect: |
          FireDepartment-domain dual variant: an identical roster (4 career on duty,
          3 volunteers) scores 13.75 staffing points on a COMBINATION department
          (CAREER_EQUIVALENT, volunteer factor 0.5) but 15.00 on a CAREER department
          (RAW_HEADCOUNT, factor 1.0) — same inputs, different entity domain than the
          water-supply variant instance, different numeric result.
        test_recipe:
          setup:
            - "Community A with COMBINATION department (career 4, volunteers 3) driven to SCORING"
            - "Community B with CAREER department (identical staffing numbers) driven to SCORING"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "ComboTown", state_code: "TX", population: 5000, area_sq_miles: 20, rural_area_pct: 20, dept_type: "COMBINATION", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { ca_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${ca_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cya_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cya_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cya_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${ca_id}", as: EvaluationCoordinator, captures: { dept_a: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_a}", payload: { career_on_duty_per_shift: 4, volunteers_on_duty_avg: 3, training_hours_per_firefighter_annual: 0, coverage_pct_within_5mi: 0 }, as: FireChief, as_user_id: "${dept_a}" }
            - { call: "PATCH /ppc/communities/${ca_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cya_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cya_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cya_id}", as: FieldAnalyst, captures: { cya_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cya_id}/score-sheets", payload: { expected_cycle_version: "${cya_v}" }, as: FieldAnalyst, captures: { sheet_a: $.data.id } }
            - { call: "POST /ppc/communities", payload: { name: "CareerCity", state_code: "TX", population: 5000, area_sq_miles: 20, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { cb_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${cb_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cyb_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cyb_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cyb_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${cb_id}", as: EvaluationCoordinator, captures: { dept_b: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_b}", payload: { career_on_duty_per_shift: 4, volunteers_on_duty_avg: 3, training_hours_per_firefighter_annual: 0, coverage_pct_within_5mi: 0 }, as: FireChief, as_user_id: "${dept_b}" }
            - { call: "PATCH /ppc/communities/${cb_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cyb_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cyb_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cyb_id}", as: FieldAnalyst, captures: { cyb_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cyb_id}/score-sheets", payload: { expected_cycle_version: "${cyb_v}" }, as: FieldAnalyst, captures: { sheet_b: $.data.id } }
          trigger:
            - { call: "GET /ppc/score-sheets/${sheet_a}", as: FieldAnalyst }
            - { call: "GET /ppc/score-sheets/${sheet_b}", as: FieldAnalyst }
          assert:
            - "ScoreSheet.${sheet_a}.staffing_variant_used == CAREER_EQUIVALENT"
            - "ScoreSheet.${sheet_a}.staffing_points == 13.75"
            - "ScoreSheet.${sheet_b}.staffing_variant_used == RAW_HEADCOUNT"
            - "ScoreSheet.${sheet_b}.staffing_points == 15.00"
            - "identical rosters produce different staffing_points across the two variants"

      - name: water_variant_municipal_vs_rural_shuttle
        grounds:
          - calculations.water_supply_points
          - entities.WaterSupplySystem.fields.alternate_verified
          - entities.ScoreSheet.fields.water_variant_used
        distinguishing_aspect: |
          WaterSupplySystem-domain dual variant: one community with rural_area_pct 60
          flips from MUNICIPAL (hydrant-derived flow 18.00 + distribution 7.00) to
          RURAL_SHUTTLE (shuttle-derived 13.50 + 3.50) when the analyst verifies the
          alternate supply — water_total drops 35.00 -> 27.00 and adjusted total
          85.00 -> 77.00 on otherwise identical data; different entity domain than
          the staffing variant instance.
        test_recipe:
          setup:
            - "Rural community (rural_area_pct 60) with two certified hydrants (2172 and 1629 gpm), alternate shuttle 1500 gpm / 1 site recorded but not yet verified, cycle in SCORING with DRAFT sheet1 computed MUNICIPAL"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "RuralHaven", state_code: "TX", population: 3000, area_sq_miles: 60, rural_area_pct: 60, dept_type: "CAREER", needed_fire_flow_gpm: 2000, storage_capacity_gal: 0, supply_works_capacity_gpm: 2500, daily_consumption_gpm: 200 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 6, volunteers_on_duty_avg: 0, training_hours_per_firefighter_annual: 240, training_facility_level: "B", live_fire_training: true, coverage_pct_within_5mi: 50 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "POST /ppc/apparatus", payload: { department_id: "${dept_id}", kind: "ENGINE", pump_capacity_gpm: 1800 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "POST /ppc/apparatus", payload: { department_id: "${dept_id}", kind: "LADDER", ladder_height_ft: 80 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "GET /ppc/water-supply-systems?community_id=${c_id}", as: EvaluationCoordinator, captures: { sys_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/water-supply-systems/${sys_id}", payload: { alternate_shuttle_capacity_gpm: 1500, alternate_sites_count: 1 }, as: WaterUtilityManager, as_user_id: "${sys_id}" }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "Main & 1st" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { h1: $.data.id } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "Main & 5th" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { h2: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${h1}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 1200 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { t1: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${h2}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 900 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { t2: $.data.id } }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 2, avg_alarm_to_dispatch_seconds: 55, redundant_circuits: true, backup_power: true }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/flow-tests/${t1}/transition", payload: { target_state: "WITNESSED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${t1}/transition", payload: { target_state: "CERTIFIED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${t2}/transition", payload: { target_state: "WITNESSED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${t2}/transition", payload: { target_state: "CERTIFIED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v1: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v1}" }, as: FieldAnalyst, as_user_id: "analyst-1", captures: { sheet1: $.data.id } }
          trigger:
            - { call: "POST /ppc/water-supply-systems/${sys_id}/verify-alternate-supply", payload: {}, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v2: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v2}" }, as: FieldAnalyst, as_user_id: "analyst-1", captures: { sheet2: $.data.id } }
          assert:
            - "ScoreSheet.${sheet1}.water_variant_used == MUNICIPAL"
            - "ScoreSheet.${sheet1}.water_total_points == 35.00"
            - "ScoreSheet.${sheet1}.adjusted_total_points == 85.00"
            - "ScoreSheet.${sheet1}.base_class == 2 and split_class_beyond_hydrant == 4"
            - "ScoreSheet.${sheet2}.water_variant_used == RURAL_SHUTTLE"
            - "ScoreSheet.${sheet2}.flow_points == 13.50 and distribution_points == 3.50"
            - "ScoreSheet.${sheet2}.water_total_points == 27.00 and adjusted_total_points == 77.00"
            - "ScoreSheet.${sheet2}.base_class == 3 and split_class_beyond_hydrant == 3"
            - "ScoreSheet.${sheet1}.status == SUPERSEDED after the second create"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes a / b / c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: equipment_credit_nested_minmax_branches
        grounds:
          - calculations.equipment_credit
          - entities.Apparatus.fields.status
        distinguishing_aspect: |
          Mode (a) nested min/max with state-conditional branches: equipment credit
          combines a capped pump ratio (min(1, sum/1750) * 8), a ladder-height branch
          (>= 75 ft), a RESERVE-engine branch and a TANKER branch; swapping a 74-ft
          ladder for a 75-ft ladder moves equipment_points 14.00 -> 20.00 while every
          other input is unchanged.
        test_recipe:
          setup:
            - "CAREER community in SCORING with ENGINE 1800 gpm FRONTLINE, LADDER 74 ft FRONTLINE, one RESERVE ENGINE, one TANKER 1500 gal FRONTLINE"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "GearTown", state_code: "TX", population: 8000, area_sq_miles: 15, rural_area_pct: 10, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0, training_hours_per_firefighter_annual: 0, coverage_pct_within_5mi: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "POST /ppc/apparatus", payload: { department_id: "${dept_id}", kind: "ENGINE", pump_capacity_gpm: 1800 }, as: FireChief, as_user_id: "${dept_id}", captures: { eng1: $.data.id } }
            - { call: "POST /ppc/apparatus", payload: { department_id: "${dept_id}", kind: "LADDER", ladder_height_ft: 74 }, as: FireChief, as_user_id: "${dept_id}", captures: { lad74: $.data.id } }
            - { call: "POST /ppc/apparatus", payload: { department_id: "${dept_id}", kind: "ENGINE", pump_capacity_gpm: 1000 }, as: FireChief, as_user_id: "${dept_id}", captures: { eng2: $.data.id } }
            - { call: "PATCH /ppc/apparatus/${eng2}", payload: { status: "RESERVE" }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "POST /ppc/apparatus", payload: { department_id: "${dept_id}", kind: "TANKER", tank_capacity_gal: 1500 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v1: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v1}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
          trigger:
            - { call: "PATCH /ppc/apparatus/${lad74}", payload: { status: "OUT_OF_SERVICE" }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "POST /ppc/apparatus", payload: { department_id: "${dept_id}", kind: "LADDER", ladder_height_ft: 75 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v2: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v2}" }, as: FieldAnalyst, captures: { sheet2: $.data.id } }
          assert:
            - "ScoreSheet.${sheet1}.equipment_points == 14.00  (pump 8.00 + ladder 0.00 + reserve 3.00 + tanker 3.00)"
            - "ScoreSheet.${sheet2}.equipment_points == 20.00  (pump 8.00 + ladder 6.00 + reserve 3.00 + tanker 3.00)"
            - "the 74-ft ladder contributes 0 while the 75-ft ladder contributes 6.00 (LADDER_MIN_FT boundary)"

      - name: premium_rounding_order_provisional_vs_final
        grounds:
          - calculations.premium_amounts
          - entities.PremiumQuote.fields.provisional_premium_cents
          - entities.PremiumQuote.fields.final_premium_cents
        distinguishing_aspect: |
          Mode (b) nested rounding order: for coverage 25,000,000 cents at 333 bp with
          class-5 modifier 0.85 over 7 months, the PROVISIONAL variant (round once at
          the end) yields 412,781 cents while the FINAL variant (round per month then
          multiply) yields 412,783 cents — identical inputs, 2-cent delta purely from
          the pinned rounding order.
        test_recipe:
          setup:
            - "Community graded class 5 (adjusted total 55.14, modifier 0.85) with an EFFECTIVE classification; property within hydrant distance, insured value 200,000,000 cents"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Ratington", state_code: "TX", population: 20000, area_sq_miles: 12, rural_area_pct: 10, dept_type: "CAREER", needed_fire_flow_gpm: 1500, storage_capacity_gal: 0, supply_works_capacity_gpm: 1500, daily_consumption_gpm: 400 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 3, volunteers_on_duty_avg: 0, training_hours_per_firefighter_annual: 240, training_facility_level: "A", live_fire_training: true, coverage_pct_within_5mi: 50 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "POST /ppc/apparatus", payload: { department_id: "${dept_id}", kind: "ENGINE", pump_capacity_gpm: 1800 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "GET /ppc/water-supply-systems?community_id=${c_id}", as: EvaluationCoordinator, captures: { sys_id: "$.data[0].id" } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "Elm & 3rd" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { h1: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${h1}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 700 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { t1: $.data.id } }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 2, avg_alarm_to_dispatch_seconds: 120, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/flow-tests/${t1}/transition", payload: { target_state: "WITNESSED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${t1}/transition", payload: { target_state: "CERTIFIED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
            - { call: "POST /ppc/score-sheets/${sheet1}/finalize", payload: {}, as: FieldAnalyst }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "CLASSIFICATION_REVIEW" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/publish-classification", payload: { score_sheet_id: "${sheet1}" }, as: ClassRegistrar, as_user_id: "registrar-1", captures: { cl_id: $.data.id } }
            - { call: "POST /ppc/classifications/${cl_id}/activate", payload: { effective_from: "2026-09-01" }, as: ClassRegistrar, as_user_id: "registrar-1" }
            - { call: "POST /ppc/property-risk-profiles", payload: { community_id: "${c_id}", address: "10 Oak St", distance_to_nearest_hydrant_ft: 500, distance_to_nearest_station_road_miles: 2.0, construction_type: "MASONRY", insured_value_cents: 200000000 }, as: EvaluationCoordinator, captures: { prop_id: $.data.id } }
          trigger:
            - { call: "POST /ppc/premium-quotes", payload: { property_id: "${prop_id}", coverage_amount_cents: 25000000, base_rate_bp: 333, term_months: 7, coverage_start_date: "2027-01-01", coverage_end_date: "2027-07-31" }, as: Insurer, captures: { q_id: $.data.id } }
            - { call: "GET /ppc/communities/${c_id}", as: Insurer, captures: { c_v: $.data.version } }
            - { call: "POST /ppc/premium-quotes/${q_id}/bind", payload: { expected_community_version: "${c_v}" }, as: Insurer }
          assert:
            - "PremiumQuote.${q_id}.provisional_premium_cents == 412781 at creation (round-at-end variant)"
            - "PremiumQuote.${q_id}.status == BOUND after bind"
            - "PremiumQuote.${q_id}.final_premium_cents == 412783 (round-per-month variant: 58969 * 7)"
            - "final_premium_cents - provisional_premium_cents == 2 (rounding-order delta)"
            - "ScoreSheet.${sheet1}.adjusted_total_points == 55.14 and base_class == 5 (modifier 0.85 input verified)"

      - name: crr_cap_circular_evaluation_order
        grounds:
          - calculations.crr_credit
          - entities.ScoreSheet.fields.crr_effective_points
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the CRR
          credit is capped at 10% of a subtotal that itself excludes CRR. With
          subtotal 44.48 the percentage cap rounds to 4.45, so raw CRR 6.00 credits
          only 4.45 (not the flat 5.5 cap, not 6.00) and adjusted_total is 48.93 —
          any other evaluation order yields a different number.
        test_recipe:
          setup:
            - "COMBINATION community in SCORING producing fd 25.00 / water 14.48 / comms 5.00 (subtotal 44.48); three VERIFIED credits of 2.00 each (raw CRR 6.00)"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Prevburg", state_code: "TX", population: 6000, area_sq_miles: 30, rural_area_pct: 40, dept_type: "COMBINATION", needed_fire_flow_gpm: 3000, storage_capacity_gal: 0, supply_works_capacity_gpm: 1800, daily_consumption_gpm: 150 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 2, volunteers_on_duty_avg: 4, training_hours_per_firefighter_annual: 120, training_facility_level: "C", live_fire_training: false, coverage_pct_within_5mi: 50 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "POST /ppc/apparatus", payload: { department_id: "${dept_id}", kind: "ENGINE", pump_capacity_gpm: 1800 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "GET /ppc/water-supply-systems?community_id=${c_id}", as: EvaluationCoordinator, captures: { sys_id: "$.data[0].id" } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "Mill Rd" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { h1: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${h1}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 850 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { t1: $.data.id } }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 1, avg_alarm_to_dispatch_seconds: 75, redundant_circuits: true, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/risk-reduction-credits", payload: { cycle_id: "${cy_id}", program_type: "PREVENTION_INSPECTION", activity_points: 2.5, evidence_note: "inspection log" }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { cr1: $.data.id } }
            - { call: "POST /ppc/risk-reduction-credits", payload: { cycle_id: "${cy_id}", program_type: "CODE_ENFORCEMENT", activity_points: 3.0, evidence_note: "enforcement docket" }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { cr2: $.data.id } }
            - { call: "POST /ppc/risk-reduction-credits", payload: { cycle_id: "${cy_id}", program_type: "PUBLIC_EDUCATION", activity_points: 2.0, evidence_note: "school program" }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { cr3: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/flow-tests/${t1}/transition", payload: { target_state: "WITNESSED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${t1}/transition", payload: { target_state: "CERTIFIED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/risk-reduction-credits/${cr1}/transition", payload: { target_state: "VERIFIED" }, as: FieldAnalyst }
            - { call: "POST /ppc/risk-reduction-credits/${cr2}/transition", payload: { target_state: "VERIFIED" }, as: FieldAnalyst }
            - { call: "POST /ppc/risk-reduction-credits/${cr3}/transition", payload: { target_state: "VERIFIED" }, as: FieldAnalyst }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v: $.data.version } }
          trigger:
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
          assert:
            - "ScoreSheet.${sheet1}.subtotal_points == 44.48 (fd 25.00 + water 14.48 + comms 5.00)"
            - "ScoreSheet.${sheet1}.crr_raw_points == 6.00 (three items capped at 2.0 each)"
            - "ScoreSheet.${sheet1}.crr_effective_points == 4.45 (10% of subtotal, rounded, beats the 5.5 flat cap)"
            - "ScoreSheet.${sheet1}.adjusted_total_points == 48.93 and base_class == 6"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: community_reevaluation_loop_classified_to_classified
        grounds:
          - state_machines.Community.CLASSIFIED_to_REEVALUATION_REQUESTED
          - state_machines.Community.REEVALUATION_REQUESTED_to_UNDER_REEVALUATION
          - state_machines.Community.UNDER_REEVALUATION_to_CLASSIFIED
          - validations[priority=39]
        distinguishing_aspect: |
          Community machine is cyclic: CLASSIFIED -> REEVALUATION_REQUESTED ->
          UNDER_REEVALUATION -> CLASSIFIED, gated by the 12-month reevaluation window
          (clock-set to 2027-09-02 makes a classification effective 2026-09-01
          eligible), and the loop ends with the first classification SUPERSEDED.
        test_recipe:
          setup:
            - "Community fully graded to class 10 with EFFECTIVE classification dated 2026-09-01; logical clock advanced to 2027-09-02 (12 months + 1 day later)"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Loopville", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy1: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy1}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy1}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0, training_hours_per_firefighter_annual: 0, coverage_pct_within_5mi: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy1}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy1}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy1}", as: FieldAnalyst, captures: { cy1_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy1}/score-sheets", payload: { expected_cycle_version: "${cy1_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
            - { call: "POST /ppc/score-sheets/${sheet1}/finalize", payload: {}, as: FieldAnalyst }
            - { call: "POST /ppc/evaluation-cycles/${cy1}/transition", payload: { target_state: "CLASSIFICATION_REVIEW" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy1}/publish-classification", payload: { score_sheet_id: "${sheet1}" }, as: ClassRegistrar, as_user_id: "registrar-1", captures: { cl1: $.data.id } }
            - { call: "POST /ppc/classifications/${cl1}/activate", payload: { effective_from: "2026-09-01" }, as: ClassRegistrar, as_user_id: "registrar-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-09-02T00:00:00Z" }, as: EvaluationCoordinator }
          trigger:
            - { call: "POST /ppc/reevaluation-requests", payload: { community_id: "${c_id}", justification: "New tanker and training program completed", evidence_items: [{ doc_type: "IMPROVEMENT_REPORT", uri: "s3://docs/r1.pdf" }] }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /ppc/reevaluation-requests/${rq_id}/transition", payload: { target_state: "DOCUMENTATION_REVIEW" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/reevaluation-requests/${rq_id}/transition", payload: { target_state: "FIELD_REVERIFICATION" }, as: FieldAnalyst }
            - { call: "GET /ppc/communities/${c_id}", as: ClassRegistrar, captures: { c_v: $.data.version } }
            - { call: "POST /ppc/reevaluation-requests/${rq_id}/approve", payload: { expected_community_version: "${c_v}", field_analyst_id: "analyst-2" }, as: ClassRegistrar, as_user_id: "registrar-1" }
            - { call: "GET /ppc/evaluation-cycles?community_id=${c_id}&status=SCHEDULED", as: EvaluationCoordinator, captures: { cy2: "$.data[0].id" } }
            - { call: "POST /ppc/evaluation-cycles/${cy2}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy2}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy2}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy2}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy2}", as: FieldAnalyst, captures: { cy2_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy2}/score-sheets", payload: { expected_cycle_version: "${cy2_v}" }, as: FieldAnalyst, as_user_id: "analyst-2", captures: { sheet2: $.data.id } }
            - { call: "POST /ppc/score-sheets/${sheet2}/finalize", payload: {}, as: FieldAnalyst, as_user_id: "analyst-2" }
            - { call: "POST /ppc/evaluation-cycles/${cy2}/transition", payload: { target_state: "CLASSIFICATION_REVIEW" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy2}/publish-classification", payload: { score_sheet_id: "${sheet2}" }, as: ClassRegistrar, as_user_id: "registrar-1", captures: { cl2: $.data.id } }
            - { call: "POST /ppc/classifications/${cl2}/activate", payload: { effective_from: "2027-09-02" }, as: ClassRegistrar, as_user_id: "registrar-1" }
          assert:
            - "ReevaluationRequest.${rq_id}.status == APPROVED"
            - "Community.${c_id}.status == CLASSIFIED after the loop (traversed REEVALUATION_REQUESTED then UNDER_REEVALUATION)"
            - "Classification.${cl1}.status == SUPERSEDED and effective_until == 2027-09-02"
            - "Classification.${cl2}.status == EFFECTIVE"
            - "Community.${c_id}.current_class_number == 10 and next_evaluation_due_date == 2032-09-02"

      - name: cycle_dispute_rescore_loop
        grounds:
          - state_machines.EvaluationCycle.PUBLISHED_to_DISPUTED
          - state_machines.EvaluationCycle.DISPUTED_to_FIELD_VERIFICATION
          - state_machines.Appeal.DATA_VERIFICATION_to_ADJUDICATED_REVISED
          - state_machines.Classification.PUBLISHED_to_VACATED
        distinguishing_aspect: |
          EvaluationCycle machine loops: PUBLISHED -> DISPUTED (appeal filed) ->
          FIELD_VERIFICATION -> SCORING -> CLASSIFICATION_REVIEW -> PUBLISHED again
          via appeal adjudication; the appealed classification is VACATED and a
          replacement PUBLISHED from the rescore sheet — a revision cycle on a
          different entity than the Community loop instance.
        test_recipe:
          setup:
            - "Community graded to class 10; classification PUBLISHED (not yet activated); appeal FILED by the community official flips the cycle to DISPUTED"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Disputia", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0, training_hours_per_firefighter_annual: 0, coverage_pct_within_5mi: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
            - { call: "POST /ppc/score-sheets/${sheet1}/finalize", payload: {}, as: FieldAnalyst }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "CLASSIFICATION_REVIEW" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/publish-classification", payload: { score_sheet_id: "${sheet1}" }, as: ClassRegistrar, as_user_id: "registrar-1", captures: { cl1: $.data.id } }
            - { call: "POST /ppc/appeals", payload: { classification_id: "${cl1}", community_id: "${c_id}", grounds: "DATA_ERROR", evidence_items: [{ doc_type: "FLOW_TEST_AMENDMENT", uri: "s3://docs/a1.pdf" }] }, as: CommunityOfficial, as_user_id: "${c_id}", captures: { ap_id: $.data.id } }
            - { call: "POST /ppc/appeals/${ap_id}/transition", payload: { target_state: "DATA_VERIFICATION" }, as: FieldAnalyst, as_user_id: "analyst-1" }
          trigger:
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v2: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v2}" }, as: FieldAnalyst, as_user_id: "analyst-1", captures: { sheet2: $.data.id } }
            - { call: "POST /ppc/score-sheets/${sheet2}/finalize", payload: {}, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "CLASSIFICATION_REVIEW" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/appeals/${ap_id}/transition", payload: { target_state: "ADJUDICATED_REVISED", new_score_sheet_id: "${sheet2}" }, as: ClassRegistrar, as_user_id: "registrar-2" }
          assert:
            - "EvaluationCycle.${cy_id} was DISPUTED after appeal filing and returns to PUBLISHED after adjudication"
            - "Appeal.${ap_id}.status == ADJUDICATED_REVISED and adjudicated_by == registrar-2"
            - "Classification.${cl1}.status == VACATED"
            - "a new Classification exists with status PUBLISHED and score_sheet_id == ${sheet2}"
            - "ScoreSheet.${sheet1}.status == SUPERSEDED (finalize of the replacement sheet)"
            - "SoD holds: adjudicating registrar registrar-2 != original publisher registrar-1"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers, depth >= 3 and >= 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: flow_test_correction_cascade
        grounds:
          - state_machines.FlowTest.CERTIFIED_to_SUPERSEDED
          - entities.Hydrant.fields.max_flow_gpm
          - entities.WaterSupplySystem.fields.active_certified_flow_gpm
          - entities.ScoreSheet.fields.water_total_points
        distinguishing_aspect: |
          Depth-3 cascade from the flow-test CORRECTED trigger: correction supersedes
          the certified test (link 0), which recomputes the hydrant's max_flow_gpm
          (link 1: 1629 -> 1991), which recomputes the system aggregates (link 2:
          3801 -> 4163), which recomputes the DRAFT score sheet's water subscores
          (link 3: flow 15.20 -> 16.65, water 29.87 -> 31.32, adjusted 30.87 -> 32.32).
        test_recipe:
          setup:
            - "Community (NFF 3000, works 4000) in SCORING with hydrants A (2172 gpm) and B (1629 gpm) certified; DRAFT sheet1 exists with water 29.87"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Cascade City", state_code: "TX", population: 9000, area_sq_miles: 18, rural_area_pct: 10, dept_type: "CAREER", needed_fire_flow_gpm: 3000, storage_capacity_gal: 0, supply_works_capacity_gpm: 4000, daily_consumption_gpm: 500 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles", payload: { community_id: "${c_id}", field_analyst_id: "analyst-1", scheduled_open_date: "2026-09-01", data_freeze_date: "2026-12-01" }, as: EvaluationCoordinator, captures: { cy_id: $.data.id } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "INTAKE" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "DATA_COLLECTION" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/fire-departments?community_id=${c_id}", as: EvaluationCoordinator, captures: { dept_id: "$.data[0].id" } }
            - { call: "PATCH /ppc/fire-departments/${dept_id}", payload: { career_on_duty_per_shift: 0, training_hours_per_firefighter_annual: 0, coverage_pct_within_5mi: 0 }, as: FireChief, as_user_id: "${dept_id}" }
            - { call: "GET /ppc/water-supply-systems?community_id=${c_id}", as: EvaluationCoordinator, captures: { sys_id: "$.data[0].id" } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "A" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { ha: $.data.id } }
            - { call: "POST /ppc/hydrants", payload: { system_id: "${sys_id}", location_descriptor: "B" }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { hb: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${ha}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 1200 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { ta: $.data.id } }
            - { call: "POST /ppc/flow-tests", payload: { system_id: "${sys_id}", hydrant_id: "${hb}", test_date: "2026-08-15", static_psi: 80, residual_psi: 60, measured_flow_gpm: 900 }, as: WaterUtilityManager, as_user_id: "${sys_id}", captures: { tb: $.data.id } }
            - { call: "PATCH /ppc/communities/${c_id}/attest-comms", payload: { operators_on_duty_min: 0, avg_alarm_to_dispatch_seconds: 999, redundant_circuits: false, backup_power: false }, as: CommsSupervisor }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "FIELD_VERIFICATION" }, as: EvaluationCoordinator }
            - { call: "POST /ppc/flow-tests/${ta}/transition", payload: { target_state: "WITNESSED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${ta}/transition", payload: { target_state: "CERTIFIED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${tb}/transition", payload: { target_state: "WITNESSED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/flow-tests/${tb}/transition", payload: { target_state: "CERTIFIED" }, as: FieldAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
            - { call: "GET /ppc/evaluation-cycles/${cy_id}", as: FieldAnalyst, captures: { cy_v: $.data.version } }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/score-sheets", payload: { expected_cycle_version: "${cy_v}" }, as: FieldAnalyst, captures: { sheet1: $.data.id } }
          trigger:
            - { call: "POST /ppc/flow-tests/${tb}/transition", payload: { target_state: "CORRECTED", corrected_static_psi: 80, corrected_residual_psi: 60, corrected_measured_flow_gpm: 1100, correction_reason: "gauge recalibration" }, as: FieldAnalyst, as_user_id: "analyst-1", captures: { tb2: $.data.id } }
            - { call: "GET /ppc/hydrants/${hb}", as: FieldAnalyst }
            - { call: "GET /ppc/water-supply-systems/${sys_id}", as: FieldAnalyst }
            - { call: "GET /ppc/score-sheets/${sheet1}", as: FieldAnalyst }
          assert:
            - "FlowTest.${tb}.status == SUPERSEDED and FlowTest.${tb2}.supersedes_test_id == ${tb}"
            - "FlowTest.${tb2}.status == CERTIFIED and flow_at_20psi_gpm == 1991"
            - "Hydrant.${hb}.max_flow_gpm == 1991 (link 1)"
            - "WaterSupplySystem.${sys_id}.active_certified_flow_gpm == 4163 (link 2)"
            - "ScoreSheet.${sheet1}.flow_points == 16.65 and water_total_points == 31.32 and adjusted_total_points == 32.32 (link 3, DRAFT recompute)"
            - "before correction the same sheet had flow_points 15.20, water_total_points 29.87, adjusted_total_points 30.87"

      - name: classification_activation_cascade
        grounds:
          - state_machines.Classification.PUBLISHED_to_EFFECTIVE
          - state_machines.Classification.EFFECTIVE_to_SUPERSEDED
          - state_machines.PremiumQuote.QUOTED_to_EXPIRED
          - entities.Community.fields.current_class_number
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (classification activate, not flow
          correction): activation supersedes the prior EFFECTIVE classification
          (link 1), which rewrites the community denormalized class fields (link 2),
          which recomputes every property's applicable_class and EXPIRES only the
          QUOTED quotes pinned to the old classification (link 3) while the BOUND
          quote and the exposure ledger are untouched.
        test_recipe:
          setup:
            - "Community with EFFECTIVE classification cl1 (class 10), one property, one BOUND quote (10,000,000 cents coverage), one QUOTED quote (5,000,000); a second cycle has produced classification cl2 PUBLISHED from identical data"
          setup_api_calls:
            - { call: "POST /ppc/communities", payload: { name: "Triggerton", state_code: "TX", population: 4000, area_sq_miles: 40, rural_area_pct: 20, dept_type: "CAREER", needed_fire_flow_gpm: 1000, storage_capacity_gal: 0, supply_works_capacity_gpm: 500, daily_consumption_gpm: 100 }, as: EvaluationCoordinator, captures: { c_id: $.data.id } }
