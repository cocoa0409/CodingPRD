              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_CUSTOMER_SUSPENDED"
            - "Order.${order_id}.payment_status == PENDING"

      - name: ship_blocked_by_nonactive_subscription
        grounds:
          - validations[priority=7]
          - entities.BoxSubscription.fields.status
          - state_machines.BoxShipment.CURATED_to_SHIPPED
          - errors[ERR_SUBSCRIPTION_NOT_ACTIVE]
        distinguishing_aspect: |
          BoxShipment's CURATED->SHIPPED transition depends on the parent
