  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_vehicle_version_on_hold_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[vehicle-hold-stale-version]"
          - "errors[ERR_STALE_VERSION]"
          - "validations[priority=6]"
        distinguishing_aspect: "A hold carrying expected_vehicle_version one less than the vehicle's current version (after a prior mutation) is rejected with ERR_STALE_VERSION (412); the prior hold stands."
        test_recipe:
          setup: ["Two CONFIRMED ECON reservations and one ECON vehicle; the vehicle is first held for R1 (version advances), then a second hold for R2 carries the pre-hold version."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { veh1: $.data.id, veh1_ver_pre: $.data.version }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-002", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-08-01T10:00:00Z", dropoff_at: "2026-08-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res2: $.data.id }
            - call: "POST /reservations/${res2}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /vehicles/${veh1}/hold"
              payload: { reservation_id: "${res1}", expected_vehicle_version: "${veh1_ver_pre}" }
              as: RentalAgent
          trigger:
            - call: "POST /vehicles/${veh1}/hold"
              payload: { reservation_id: "${res2}", expected_vehicle_version: "${veh1_ver_pre}" }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 412"
            - "response data.error_id == ERR_STALE_VERSION"
            - "Vehicle.${veh1}.held_by_reservation_id == ${res1}"

      - name: occ_correct_vehicle_version_on_hold_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[vehicle-hold-stale-version]"
          - "state_machines.Vehicle.AVAILABLE_to_RESERVED"
        distinguishing_aspect: "A hold carrying the vehicle's current version succeeds, sets status RESERVED and increments version by one."
        test_recipe:
          setup: ["A CONFIRMED ECON reservation and a fresh ECON vehicle at version 1."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { veh1: $.data.id, veh1_ver: $.data.version }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
          trigger:
            - call: "POST /vehicles/${veh1}/hold"
              payload: { reservation_id: "${res1}", expected_vehicle_version: "${veh1_ver}" }
              as: RentalAgent
              captures: { veh1_ver_after: $.data.version }
          assert:
            - "Vehicle.${veh1}.status == RESERVED"
            - "Vehicle.${veh1}.held_by_reservation_id == ${res1}"
            - "Vehicle.${veh1}.version == 2"

      - name: tier_promotion_at_silver_threshold_inclusive_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - "calculations.member_tier"
          - "calculations.member_tier.constants.SILVER_THRESHOLD_POINTS"
          - "entities.LoyaltyMember.fields.tier"
        distinguishing_aspect: "Injecting lifetime_points == 500 (exactly the SILVER threshold, inclusive >=) makes the member's recomputed tier SILVER."
        test_recipe:
          setup: ["A member with injected lifetime_points exactly 500."]
          setup_api_calls:
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /_members/${mem1}/set_loyalty"
              payload: { lifetime_points: 500, points_balance: 500 }
              as: FleetManager
          trigger:
            - call: "GET /members/${mem1}"
              payload: {}
              as: RentalAgent
              captures: { tier: $.data.tier }
          assert:
            - "LoyaltyMember.${mem1}.tier == SILVER"

