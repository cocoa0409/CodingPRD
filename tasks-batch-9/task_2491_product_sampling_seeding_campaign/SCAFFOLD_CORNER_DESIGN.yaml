            - call: "POST /retailers"
              payload: { name: "Link Retailer" }
              as: PlatformAdmin
              captures: { rt1_id: $.data.id }
            - call: "POST /campaigns"
              payload: { name: "Link Campaign", objective_type: "REVIEW_ACQUISITION", target_segment_codes: ["URBAN_MILLENNIAL"], syndication_retailer_ids: ["${rt1_id}"], sampling_window_start: "2026-07-01T00:00:00Z", sampling_window_end: "2026-09-30T00:00:00Z", budget_total_cents: 1000000, min_review_word_count: 10, holdout_pct: 0.0 }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /kit-lines"
              payload: { campaign_id: "${camp_id}", component_sku: "HERO-1", component_role: "HERO_PRODUCT", unit_cost_cents: 1417, quantity_per_kit: 1, component_discount_pct: 0.8 }
              as: CampaignManager
            - call: "POST /campaigns/${camp_id}/open-screening"
              payload: {}
              as: CampaignManager
            - call: "POST /panelists"
              payload: { email: "lk1@example.com", display_name: "LK One", address_hash: "H-LK1", account_opened_at: "2026-01-01T00:00:00Z", segment_code: "URBAN_MILLENNIAL" }
              as: Anonymous
              captures: { p1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { campaign_id: "${camp_id}", panelist_id: "${p1_id}", screening_answers: { household_size: 3, attests_no_resale: true } }
              as: CampaignManager
              captures: { e1_id: $.data.id }
            - call: "POST /enrollments/${e1_id}/screen"
              payload: {}
              as: CampaignManager
            - call: "POST /campaigns/${camp_id}/activate-sampling"
              payload: {}
              as: CampaignManager
            - call: "POST /review-submissions"
              payload: { enrollment_id: "${e1_id}", headline: "Link draft", body_text: "The hero product worked well for my family and the insert card explained everything clearly.", star_rating: 4, disclosure_statement: "I received this product for free from the brand.", honest_opinion_attested: true }
              as: Panelist
              as_user_id: "${p1_id}"
              captures: { rv1_id: $.data.id }
