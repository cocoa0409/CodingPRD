  # ==========================================================================
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: germination_threshold_75_boundary
        grounds:
          - calculations.yield_projection
          - endpoints."POST /farm/batches/{id}/germination-check"
        distinguishing_aspect: |
          Metric: germination percent on the germination-check endpoint. Exactly 75.0 stays in
          the normal tier ladder (factor 0.75, replant_recommended false); 74.9 crosses the
          replant cliff (factor 0.50, replant_recommended true) — one decimal decides the flag.
        test_recipe:
          setup:
            - "Crop KALE-01 ACTIVE recipe (12.5 lb/tower); two SEEDED batches B1 (towers t1-t4) and B2 (towers t5-t8) of R-01 on WL-A"
          setup_api_calls:
            - { call: "POST /farm/crops", payload: { crop_code: "KALE-01", display_name: "Kale", category: "LEAFY_GREEN", margin_cents_per_lb: 300, floor_price_cents_per_lb: 100 }, as: FarmManager, captures: { c_kale: "$.data.id", c_kale_v: "$.data.version" } }
            - { call: "POST /farm/recipes", payload: { crop_id: "${c_kale}", light_hours_per_day: 16, light_ppfd_umol: 600, ec_target_ms: 1.8, ph_target: 5.8, temp_day_c: 22, temp_night_c: 18, humidity_pct: 65, co2_ppm: 900, days_to_harvest: 21, expected_yield_lb_per_tower: 12.5 }, as: Grower, captures: { r_kale: "$.data.id" } }
            - { call: "POST /farm/recipes/${r_kale}/activate", payload: { expected_crop_version: "${c_kale_v}" }, as: Grower }
            - { call: "POST /farm/water-loops", payload: { loop_code: "WL-A" }, as: FarmManager, captures: { wl_a: "$.data.id" } }
            - { call: "POST /farm/racks", payload: { rack_code: "R-01", water_loop_id: "${wl_a}", zone: "Z1", tower_count: 8 }, as: FarmManager, captures: { rk_1: "$.data.id" } }
            - { call: "GET /farm/racks/${rk_1}/towers", as: FarmManager, captures: { t1: "$.data[0].id", t2: "$.data[1].id", t3: "$.data[2].id", t4: "$.data[3].id", t5: "$.data[4].id", t6: "$.data[5].id", t7: "$.data[6].id", t8: "$.data[7].id" } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/batches", payload: { crop_id: "${c_kale}", tower_ids: ["${t1}", "${t2}", "${t3}", "${t4}"] }, as: Grower, captures: { b1: "$.data.id" } }
            - { call: "POST /farm/batches/${b1}/seed", as: Grower }
            - { call: "POST /farm/batches", payload: { crop_id: "${c_kale}", tower_ids: ["${t5}", "${t6}", "${t7}", "${t8}"] }, as: Grower, captures: { b2: "$.data.id" } }
            - { call: "POST /farm/batches/${b2}/seed", as: Grower }
          trigger:
            - { call: "POST /farm/batches/${b1}/germination-check", payload: { germination_rate_pct: 75.0 }, as: Grower, captures: { f1: "$.data.yield_factor", rr1: "$.data.replant_recommended", y1: "$.data.projected_yield_lb" } }
            - { call: "POST /farm/batches/${b2}/germination-check", payload: { germination_rate_pct: 74.9 }, as: Grower, captures: { f2: "$.data.yield_factor", rr2: "$.data.replant_recommended", y2: "$.data.projected_yield_lb" } }
          assert:
            - "B1 at exactly 75.0: yield_factor == 0.75, replant_recommended == false, projected_yield_lb == 37.50 (4 x 12.5 x 0.75)"
            - "B2 at 74.9: yield_factor == 0.50, replant_recommended == true, projected_yield_lb == 25.00 (4 x 12.5 x 0.50)"
            - "both batches transition to GROWING (the flag is advisory, not a state block)"

      - name: fill_rate_threshold_exact_equality_pays_nothing
        grounds:
          - calculations.contract_shortfall_penalty
          - calculations.contract_week_fill_rate
          - endpoints."POST /farm/contracts/{id}/settle-week"
        distinguishing_aspect: |
          Metric: final fill ratio on settle-week. 490/500 = 0.9800 exactly EQUALS the 0.98
          threshold -> penalty 0 (comparison is strictly-less); 489/500 = 0.9780 is strictly
          below -> penalty 1650 cents. A single shipped pound flips the penalty.
        test_recipe:
          setup:
            - "Crop KALE-01 ACTIVE recipe; two packed batches: B1 490.00 lb, B2 489.00 lb, both harvested 2026-08-24 and RELEASED (sanitation PASS 2026-08-22T03:30:00Z)"
