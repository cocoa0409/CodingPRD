        distinguishing_aspect: |
          Entity pair {Admission -> TreatmentPlan} (a DIFFERENT pair than Admission->Program):
          step-down requires the admission's TreatmentPlan to be ACTIVE; with the plan still
          DRAFT (unsigned) the step-down is rejected ERR_TREATMENT_PLAN_NOT_ACTIVE even
          though meal compliance would otherwise pass.
        test_recipe:
          setup:
            - "An ADMITTED RESIDENTIAL admission with a DRAFT (never activated) treatment plan and a meal plan at 0.85 over 4 events."
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Maple EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat L", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id, pv: $.data.version }
            - call: "POST /edt/assessments"
              payload: { patient_id: "${pid}", facility_id: "${fid}", medical_severity: 5, behavioral_severity: 5, psychiatric_severity: 4, motivation_level: 6 }
              as: Clinician
              captures: { asid: $.data.id }
            - call: "POST /edt/assessments/${asid}/finalize"
              payload: { expected_patient_version: "${pv}" }
              as: Clinician
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 14 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-15T00:00:00Z" }
              as: UtilizationReviewer
            - call: "POST /edt/admissions/${aid}/promote"
              as: Intake
            - call: "POST /edt/admissions/${aid}/admit"
              as: Intake
            - call: "POST /edt/treatment-plans"
              payload: { admission_id: "${aid}", facility_id: "${fid}", goals_total: 5 }
              as: Clinician
              captures: { tpid: $.data.id }
            - call: "POST /edt/meal-plans"
              payload: { admission_id: "${aid}", facility_id: "${fid}", required_meals_per_day: 4, supervision_level: "FULL" }
              as: Dietitian
              captures: { mpid: $.data.id }
            - call: "POST /edt/meal-events"
              payload: { meal_plan_id: "${mpid}", admission_id: "${aid}", meal_type: "BREAKFAST", completion_fraction: 0.9 }
              as: Dietitian
            - call: "POST /edt/meal-events"
              payload: { meal_plan_id: "${mpid}", admission_id: "${aid}", meal_type: "LUNCH", completion_fraction: 0.9 }
              as: Dietitian
            - call: "POST /edt/meal-events"
              payload: { meal_plan_id: "${mpid}", admission_id: "${aid}", meal_type: "DINNER", completion_fraction: 0.8 }
              as: Dietitian
            - call: "POST /edt/meal-events"
              payload: { meal_plan_id: "${mpid}", admission_id: "${aid}", meal_type: "SNACK", completion_fraction: 0.8 }
              as: Dietitian
          trigger:
            - call: "POST /edt/admissions/${aid}/step-down"
              as: Clinician
              captures: { err: $.data.error_id }
          assert:
            - "TreatmentPlan.${tpid}.status == DRAFT"
            - "response.data.error_id == ERR_TREATMENT_PLAN_NOT_ACTIVE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: authorization_extension_window_overlap_rejected
        grounds:
          - validations[priority=12]
          - state_machines.InsuranceAuthorization.APPROVED_to_APPROVED
          - entities.ConcurrentReview.fields.window_start_iso
          - entities.ConcurrentReview.fields.window_end_iso
        distinguishing_aspect: |
          On the InsuranceAuthorization resource, half-open-interval overlap semantics: an
          extension window [2026-01-05,2026-01-10) overlaps the already-APPROVED window
          [2026-01-01,2026-01-08) and is rejected ERR_AUTH_WINDOW_OVERLAP (overlap geometry).
        test_recipe:
          setup:
            - "An authorization APPROVED with window [2026-01-01,2026-01-08); covered_through 2026-01-08."
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Maple EDT" }
              as: Admin
              captures: { fid: $.data.id }
            - call: "POST /edt/programs"
              payload: { facility_id: "${fid}", level_of_care: "RESIDENTIAL", bed_capacity: 5 }
              as: Admin
              captures: { pgid: $.data.id }
            - call: "POST /edt/cohorts"
              payload: { program_id: "${pgid}", facility_id: "${fid}", name: "Adult AM", age_band: "ADULT", slot_capacity: 5 }
              as: Admin
              captures: { cid: $.data.id }
            - call: "POST /edt/patients"
              payload: { facility_id: "${fid}", full_name: "Pat M", age_band: "ADULT", bmi: 17.0 }
              as: Intake
              captures: { pid: $.data.id }
            - call: "POST /edt/admissions"
              payload: { patient_id: "${pid}", facility_id: "${fid}", program_id: "${pgid}", cohort_id: "${cid}", requested_length_of_stay_days: 14 }
              as: Intake
              captures: { aid: $.data.id }
            - call: "POST /edt/authorizations"
              payload: { admission_id: "${aid}", facility_id: "${fid}", payer_name: "BlueCo", daily_rate_cents: 100000, coinsurance_pct: 0.20 }
              as: UtilizationReviewer
              captures: { authid: $.data.id }
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-01T00:00:00Z", window_end_iso: "2026-01-08T00:00:00Z" }
              as: UtilizationReviewer
          trigger:
            - call: "POST /edt/reviews"
              payload: { authorization_id: "${authid}", facility_id: "${fid}", decision: "APPROVE", window_start_iso: "2026-01-05T00:00:00Z", window_end_iso: "2026-01-10T00:00:00Z" }
              as: UtilizationReviewer
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_AUTH_WINDOW_OVERLAP"
            - "InsuranceAuthorization.${authid}.days_authorized == 7"

      - name: authorization_extension_window_noncontiguous_rejected
        grounds:
          - validations[priority=13]
          - state_machines.InsuranceAuthorization.APPROVED_to_APPROVED
          - entities.InsuranceAuthorization.fields.covered_through_iso
        distinguishing_aspect: |
          On the same InsuranceAuthorization resource but with a DIFFERENT interval rule -
          contiguity/adjacency (gap=0) rather than overlap: an extension window
          [2026-01-10,2026-01-15) leaves a 2-day GAP after covered_through 2026-01-08 and
          is rejected ERR_AUTH_WINDOW_NONCONTIGUOUS (a window that neither overlaps nor
          abuts). Demonstrates adjacency semantics distinct from the overlap rule above.
        test_recipe:
          setup:
            - "An authorization APPROVED with window [2026-01-01,2026-01-08); covered_through 2026-01-08."
          setup_api_calls:
            - call: "POST /edt/facilities"
