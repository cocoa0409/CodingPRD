# =============================================================================
# §1.9 Scaffold Corner Design — Emergency Alert Compliance & Test Participation
# Breadth index derived from SCAFFOLD.yaml §1.1-§1.7 by walking
# references/claim-extraction-guide.md section by section. Corners already
# asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as `excluded_because:`
# stubs naming the covering §1.8 instance.
#
# Fixture conventions shared by every recipe below (identical to §1.8's):
#   * user ids  : adm-1 (ComplianceAdmin), eng-1 / eng-2 (StationEngineer,
#                 must appear in Station.engineer_user_ids), cert-1
#                 (CertifyingOfficer = Station.certification_officer_user_id),
#                 insp-1 (FieldInspector).
#   * clock     : the harness starts at 2026-08-01T00:00:00Z; every recipe that
#                 depends on "now" pins it with POST /_clock/set_current_utc.
#   * OCC       : every expected_station_version / expected_test_event_version
#                 value is captured from a GET issued immediately beforehand,
#                 because almost every write is a Station recompute event.
#   * literals  : every numeric assert below is pre-computed from §1.3's
#                 formulas and constants, never left as an expression.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 — entities
  # ===========================================================================
  - section: entities
    instances:

      - name: plan_creation_returns_draft_with_required_source_count_derived
        claim_type: creation
        grounds:
          - "§1.5 POST /state-plans input [state_code, plan_version_label, required_source_types, mandatory_relay_event_codes], code 201"
          - "§1.1 StatePlan.required_source_count 'Cardinality of required_source_types; recomputed on create'"
          - "§1.1 StatePlan.status default DRAFT, activated_at default null, superseded_at default null"
        distinguishing_aspect: "A create with three required source types returns 201 with required_source_count == 3 computed from the array (not echoed from input), status DRAFT and both timestamps null — so a freshly created plan is provably not yet usable by stations."
        test_recipe:
          setup:
            - "Empty database; clock at the harness default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
          trigger:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP", "NWS", "SATELLITE"], mandatory_relay_event_codes: ["EAN", "TOR"] }
              captures: { plan_id: "$.data.id" }
            - call: "GET /state-plans/${plan_id}"
              as: FieldInspector
              as_user_id: insp-1
          assert:
            - "HTTP 201 and response_type == 'object'"
            - "state_code == 'KS', plan_version_label == '2026-R1', required_source_types == ['PEP', 'NWS', 'SATELLITE'], mandatory_relay_event_codes == ['EAN', 'TOR']"
            - "required_source_count == 3"
            - "status == 'DRAFT', activated_at == null, superseded_at == null"
            - "GET /state-plans/${plan_id} returns the same field values in the same request cycle"

      - name: station_retrieval_echoes_stored_fields_and_provisioning_defaults
        claim_type: retrieval
        grounds:
          - "§1.5 GET /stations/{id} output Station"
          - "§1.1 Station.compliance_posture default PROVISIONING, compliance_score 'null while compliance_posture == PROVISIONING', compliance_variant_applied default null"
          - "§1.1 Station.accessible_source_count / silent_assignment_count / penalty_points_total / public_file_document_count / plan_revalidation_required / last_log_review_at defaults"
        distinguishing_aspect: "Immediately after create — before any recompute event — GET /stations/{id} returns compliance_posture PROVISIONING with compliance_score null and compliance_variant_applied null, while every counter is at its declared zero/false/null default."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 requiring PEP, activated; station KWEA created and never touched again."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1", "eng-2"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
          trigger:
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
          assert:
            - "state_plan_id == ${plan_id}, call_sign == 'KWEA', service_type == 'TV', engineer_user_ids == ['eng-1', 'eng-2'], certification_officer_user_id == 'cert-1'"
            - "compliance_posture == 'PROVISIONING', compliance_score == null, compliance_variant_applied == null"
            - "accessible_source_count == 0, silent_assignment_count == 0, penalty_points_total == 0, public_file_document_count == 0"
            - "plan_revalidation_required == false, last_log_review_at == null, version == 1"

      - name: relay_rule_listing_paginates_and_filters_by_plan
        claim_type: listing
        grounds:
          - "§1.5 GET /relay-rules input [state_plan_id?, event_code?, relay_class?, status?, limit?, offset?] output RelayRule[]"
          - "§1.0 pagination_fields ['limit', 'offset', 'total_count', 'has_more'] and pagination_defaults { limit: 10, min: 1, max: 100, offset: 0 }"
        distinguishing_aspect: "With three ACTIVE rules on one plan and one on another, limit 2 / offset 0 returns 2 rows with total_count 3 and has_more true, offset 2 returns the last row with has_more false, and the other plan's rule never appears — so the filter is applied before pagination, not after."
        test_recipe:
          setup:
            - "Two activated plans: KS 2026-R1 (three ACTIVE rules: TOR priority 10 fips ['20173'], TOR priority 20 fips [], RWT priority 30 fips []) and NE 2026-R1 (one rule TOR priority 10)."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_ks: "$.data.id" }
            - call: "POST /state-plans/${plan_ks}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "NE", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_ne: "$.data.id" }
            - call: "POST /state-plans/${plan_ne}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_ks}", event_code: "TOR", fips_codes: ["20173"], relay_class: "MANDATORY", priority: 10, forward_delay_seconds: 30 }
              captures: { rr1: "$.data.id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_ks}", event_code: "TOR", fips_codes: [], relay_class: "OPTIONAL", priority: 20 }
              captures: { rr2: "$.data.id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_ks}", event_code: "RWT", fips_codes: [], relay_class: "OPTIONAL", priority: 30 }
              captures: { rr3: "$.data.id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_ne}", event_code: "TOR", fips_codes: [], relay_class: "MANDATORY", priority: 10 }
              captures: { rr_ne: "$.data.id" }
          trigger:
            - call: "GET /relay-rules"
              as: FieldInspector
              as_user_id: insp-1
              payload: { state_plan_id: "${plan_ks}", limit: 2, offset: 0 }
            - call: "GET /relay-rules"
              as: FieldInspector
              as_user_id: insp-1
              payload: { state_plan_id: "${plan_ks}", limit: 2, offset: 2 }
            - call: "GET /relay-rules"
              as: FieldInspector
              as_user_id: insp-1
              payload: { state_plan_id: "${plan_ks}", event_code: "TOR", status: "ACTIVE" }
          assert:
            - "first page: response_type == 'array' with exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second page: exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "${rr_ne} appears on neither page — the state_plan_id filter is applied before the window is taken"
            - "the event_code TOR + status ACTIVE query returns exactly 2 rows, ${rr1} and ${rr2}, with total_count == 2 and has_more == false"

      - name: state_plan_get_with_unknown_id_not_found
        claim_type: not_found
        grounds:
          - "§1.6 ERR_STATE_PLAN_NOT_FOUND (404): 'referenced StatePlan id does not exist'"
          - "§1.5 GET /state-plans/{id}"
        distinguishing_aspect: "A syntactically valid UUID that was never minted returns ERR_STATE_PLAN_NOT_FOUND with HTTP 404 and the error envelope (response_type == 'error'), not an empty object or a 200."
        test_recipe:
          setup:
            - "One unrelated plan exists so the table is non-empty and the 404 cannot come from an empty collection."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "GET /state-plans/11111111-2222-4333-8444-555555555555"
              as: ComplianceAdmin
              as_user_id: adm-1
              captures: { err: "$.data.error_id" }
          assert:
            - "${err} == 'ERR_STATE_PLAN_NOT_FOUND' with HTTP 404 and response_type == 'error'"
            - "the existing plan ${plan_id} is untouched and still retrievable"

      - name: station_create_without_service_type_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "§1.5 POST /stations input [state_plan_id, call_sign, service_type, engineer_user_ids, certification_officer_user_id] (all required)"
          - "§1.6 ERR_INVALID_REQUEST (400): 'malformed body, unknown enum value, or a required field missing'"
          - "§1.4 priority 2 request-shape validation"
        distinguishing_aspect: "Omitting the required service_type is rejected with ERR_INVALID_REQUEST 400 before any FK lookup happens — the plan id in the same body is valid, so the 400 cannot be attributed to reference resolution, and no Station row is created."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 activated so the state_plan_id in the malformed body is a real, ACTIVE plan."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
          trigger:
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { err: "$.data.error_id" }
            - call: "GET /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}" }
          assert:
            - "${err} == 'ERR_INVALID_REQUEST' with HTTP 400"
            - "GET /stations filtered by state_plan_id == ${plan_id} returns total_count == 0 — the rejected create persisted nothing"

      - name: relay_rule_forward_delay_defaults_to_zero_when_omitted
        claim_type: defaults
        grounds:
          - "§1.5 POST /relay-rules input [state_plan_id, event_code, fips_codes, relay_class, priority, forward_delay_seconds?] (optional)"
          - "§1.1 RelayRule.forward_delay_seconds default 0, constraints '0..600'"
          - "§1.1 RelayRule.status default ACTIVE"
        distinguishing_aspect: "Omitting forward_delay_seconds stores 0 rather than null, and that 0 is what a matching alert copies into forward_delay_seconds_applied — the default is a real stored value, not an absent field papered over at read time."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 activated with mandatory_relay_event_codes []; station KWEA; one rule created WITHOUT forward_delay_seconds."
            - "Clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
          trigger:
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", event_code: "RWT", fips_codes: [], relay_class: "OPTIONAL", priority: 40 }
              captures: { rr_default: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "RWT", originator_sequence: "KSDEF-0001", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert_id: "$.data.id" }
          assert:
            - "rr_default.forward_delay_seconds == 0 (not null) and status == 'ACTIVE', specificity == 1"
            - "the alert matched rr_default: matched_relay_rule_id == ${rr_default}, relay_state == 'RELAY_PENDING', relay_class_applied == 'OPTIONAL'"
            - "forward_delay_seconds_applied == 0, copied from the defaulted rule"

      - name: relay_rule_specificity_computed_from_fips_codes
        claim_type: computed_fields
        grounds:
          - "§1.1 RelayRule.specificity '2 when fips_codes is non-empty (county-scoped), 1 when fips_codes is empty (statewide)'"
          - "§1.5 POST /relay-rules side effect 'specificity = 2 when fips_codes is non-empty else 1'"
        distinguishing_aspect: "specificity is derived from the fips_codes array at create time and is not an input: a county-scoped rule stores 2 and a statewide rule stores 1 in the same plan, which is exactly the primary sort key of relay_rule_selection."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 activated."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
          trigger:
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", event_code: "TOR", fips_codes: ["20173", "20177"], relay_class: "MANDATORY", priority: 10, forward_delay_seconds: 30 }
              captures: { rr_county: "$.data.id" }
            - call: "POST /relay-rules"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", event_code: "TOR", fips_codes: [], relay_class: "OPTIONAL", priority: 20, forward_delay_seconds: 0 }
              captures: { rr_state: "$.data.id" }
            - call: "GET /relay-rules/${rr_county}"
              as: FieldInspector
              as_user_id: insp-1
            - call: "GET /relay-rules/${rr_state}"
              as: FieldInspector
              as_user_id: insp-1
          assert:
            - "rr_county.specificity == 2 and fips_codes == ['20173', '20177']"
            - "rr_state.specificity == 1 and fips_codes == []"
            - "both rows have status == 'ACTIVE' and version == 1; neither accepted a client-supplied specificity"

      - name: state_plan_system_fields_minted_by_the_server
        claim_type: system_fields
        grounds:
          - "§1.1 StatePlan common_fields true (id, created_at, updated_at, version)"
          - "§1.5 POST /state-plans/{id}/activate side effects (status = ACTIVE, activated_at = logical clock now)"
        distinguishing_aspect: "id is a bare UUID with no type prefix, version starts at 1 and increments to 2 on the activate mutation, and updated_at advances with the logical clock while created_at does not — so all four common fields are server-minted rather than echoed."
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z for the create, then advanced to 2026-08-05T09:00:00Z before the activate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id", v_create: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
          trigger:
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "GET /state-plans/${plan_id}"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "${plan_id} is a bare UUID string with no type prefix (no 'plan_' segment)"
            - "${v_create} == 1 and after the activate version == 2 == ${v_create} + 1"
            - "created_at == '2026-08-01T00:00:00.000Z' (unchanged by the activate) while updated_at == '2026-08-05T09:00:00.000Z'"
            - "status == 'ACTIVE' and activated_at == '2026-08-05T09:00:00Z' — taken from the logical clock, not from the request"

      - name: verify_accessibility_out_of_range_measurements_rejected
        claim_type: type_constraints
        grounds:
          - "§1.1 AlertEvent.visual_crawl_seconds constraints '0..600', audio_loudness_lufs constraints '-60.0..0.0', caption_interaction 'one of {NONE, CAPTION_SUPPRESSED, CRAWL_OVERLAP}'"
          - "§1.5 POST /alert-events/{id}/verify-accessibility input [visual_crawl_seconds, audio_loudness_lufs, caption_interaction]"
          - "§1.6 ERR_INVALID_REQUEST (400)"
        distinguishing_aspect: "Each declared constraint is enforced independently — 601 seconds, +1.0 LUFS and an unknown caption enum are three separate 400s — and after all three rejections the alert is still ACCESSIBILITY_UNVERIFIED with accessibility_deficiency_points 0, so a valid measurement still succeeds afterwards."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 activated, no relay rules; station KWEA; one alert TOR/KSRNG-0001 at 2026-08-01T00:00:00Z (relay_state UNMATCHED_OPTIONAL, accessibility_state ACCESSIBILITY_UNVERIFIED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: [] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSRNG-0001", fips_codes: ["20173"], received_at: "2026-08-01T00:00:00Z" }
              captures: { alert_id: "$.data.id" }
          trigger:
            - call: "POST /alert-events/${alert_id}/verify-accessibility"
              as: StationEngineer
              as_user_id: eng-1
              payload: { visual_crawl_seconds: 601, audio_loudness_lufs: -24.0, caption_interaction: "NONE" }
              captures: { err_crawl: "$.data.error_id" }
            - call: "POST /alert-events/${alert_id}/verify-accessibility"
              as: StationEngineer
              as_user_id: eng-1
              payload: { visual_crawl_seconds: 60, audio_loudness_lufs: 1.0, caption_interaction: "NONE" }
              captures: { err_lufs: "$.data.error_id" }
            - call: "POST /alert-events/${alert_id}/verify-accessibility"
              as: StationEngineer
              as_user_id: eng-1
              payload: { visual_crawl_seconds: 60, audio_loudness_lufs: -24.0, caption_interaction: "CAPTIONS_OFF" }
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /alert-events/${alert_id}/verify-accessibility"
              as: StationEngineer
              as_user_id: eng-1
              payload: { visual_crawl_seconds: 600, audio_loudness_lufs: -60.0, caption_interaction: "NONE" }
          assert:
            - "${err_crawl} == 'ERR_INVALID_REQUEST' (400) — 601 > 600"
            - "${err_lufs} == 'ERR_INVALID_REQUEST' (400) — +1.0 is above the 0.0 ceiling"
            - "${err_enum} == 'ERR_INVALID_REQUEST' (400) — CAPTIONS_OFF is not in {NONE, CAPTION_SUPPRESSED, CRAWL_OVERLAP}"
            - "after the three rejections the alert still has accessibility_state == 'ACCESSIBILITY_UNVERIFIED', visual_crawl_seconds == 0, audio_loudness_lufs == null-or-unset and accessibility_deficiency_points == 0"
            - "the fourth call, using the extreme but legal bounds 600 / -60.0 / NONE, returns 200 with crawl_shortfall 0 and loudness_excess 34.0: accessibility_deficiency_points == 3.40 == round(min(8.00, 0.00 + 3.400 + 0.00 + 0.00), 2) and accessibility_state == 'ACCESSIBILITY_FAILED' (3.40 > 1.00)"

      - name: wireless_alert_notice_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - "§1.1 WirelessAlertNotice common_fields false (id and created_at only)"
          - "§1.5 endpoint set for WirelessAlertNotice: POST /wireless-alert-notices, GET /wireless-alert-notices/{id}, GET /wireless-alert-notices — no update, no action, no delete"
        distinguishing_aspect: "The entity exposes exactly three endpoints and its payload carries no version and no updated_at, so a second POST with the same station/sequence/event triple creates a SECOND independent row rather than mutating the first — immutability here means additive history, not uniqueness."
        test_recipe:
          setup:
