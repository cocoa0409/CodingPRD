      - name: unsupported_controls_package_is_rejected_at_configuration_creation
        claim_type: Violation -> Error
        grounds:
          - validations[priority=29]
          - errors[ERR_CONTROLS_PACKAGE_UNSUPPORTED]
          - entities.EquipmentModel.supported_controls_packages
        distinguishing_aspect: "supported_controls_packages is a closed allow-list on the model, not merely a hint for pricing: asking for TOUCH_PRO on a model that lists only STANDARD_DIAL returns ERR_CONTROLS_PACKAGE_UNSUPPORTED (422) and creates no ChainConfiguration, while the STANDARD_DIAL request on the same pair succeeds."
