          trigger:
            - call: "POST /registry/search-requests/${sr_id}/deadline-sweep"
              payload: {}
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { sweep1_last: "$.data.last_sweep_at" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-08T00:00:01Z" }
              as: RegistryOperations
              as_user_id: "ops-1"
            - call: "POST /registry/search-requests/${sr_id}/deadline-sweep"
              payload: {}
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { sweep2_last: "$.data.last_sweep_at" }
          assert:
            - "the three deadlines are ConfirmatoryTypingRequest.${ct1_id}.deadline_at == \"2026-08-08T00:00:00Z\", ${ct2_id} == \"2026-08-10T00:00:00Z\" (168h + 48h international grace), ${ct3_id} == \"2026-08-07T00:00:00Z\" (168h - 24h priority reduction)"
            - "after the first sweep at exactly 2026-08-08T00:00:00Z: ConfirmatoryTypingRequest.${ct3_id}.status == EXPIRED with expired_by_sweep_at == \"2026-08-08T00:00:00Z\", while ${ct1_id}.status == REQUESTED and ${ct2_id}.status == REQUESTED"
            - "MatchCandidate.${mc3_id}.status == TYPING_EXPIRED with ct_attempt_count 1; MatchCandidate.${mc1_id}.status is still TYPING_REQUESTED"
            - "SearchRequest.${sr_id}.last_sweep_at == \"2026-08-08T00:00:00Z\" and status still PRIMARY_ENGAGED"
            - "after the second sweep one second later: ConfirmatoryTypingRequest.${ct1_id}.status == EXPIRED with expired_by_sweep_at == \"2026-08-08T00:00:01Z\" and MatchCandidate.${mc1_id}.status == TYPING_EXPIRED with ct_attempt_count 1"
