  # =======================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # =======================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: abv_tolerance_equality_passes
        grounds:
          - calculations.abv_consistency_check
          - validations[priority=14]
        distinguishing_aspect: |
          Numeric threshold on abv_consistency_check: product target_abv=5.0,
          tolerance=0.3. Batch abv exactly 5.3 (== target+tolerance) passes
          (> vs >= pinned: rejection only when strictly greater). One
          hundredth more (5.31) would reject. Endpoint: POST
          /packaging-runs/{id}/complete.
        test_recipe:
          setup:
            - "Product p10 target_abv=5.0 tolerance=0.3 (default)"
            - "fb10 READY with original_gravity=13.4545, current=3.8181 (abv exactly 5.3)"
            # (13.4545 - 3.8181) * 0.55 = 9.6364 * 0.55 = 5.3000 -> 5.3
            # Easier: original=14.0, current=4.3636... -> abv = 9.6364*0.55 = 5.3
            # Use: original=14.0, current=4.3636 => diff=9.6364, abv=5.3000
            # Round_half_up to 0.1 -> 5.3 exactly. |5.3 - 5.0| = 0.3 == tolerance -> passes.
            - "pr10 SCHEDULED volume=50"
          setup_api_calls:
