            - "Shift re-read after the refusal: status is still OPEN and safety_briefing_reference == null"
            - "Trade seat confirmed: HTTP 200 with role == SKILLED_TRADE and status == CONFIRMED"
            - "Second lock: HTTP 200, status == LOCKED, safety_briefing_reference == SB-2026-08-05"
            - "The site re-read shows readiness_status == UNDER_CONSTRUCTION — the successful lock, not the refused one, moved the parent"

      - name: a_second_open_homebuyer_core_enrollment_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=34]", errors.ERR_DUPLICATE_ENROLLMENT, entities.EducationEnrollment.fields.curriculum_code, "endpoints.POST /homeownership/education-enrollments", "state_machines.EducationEnrollment.status"]
        distinguishing_aspect: "Uniqueness is scoped to the curriculum, not to the household: a household already holding an IN_PROGRESS HOMEBUYER_CORE enrollment is refused a second HOMEBUYER_CORE, yet the same household may open BUDGET_COACHING and HOME_MAINTENANCE enrollments in the same breath."
        setup_note: "Priority 34's other two errors, ERR_EDUCATION_NOT_COMPLETE and ERR_EDUCATION_EXPIRED, are unreachable at their only other site: POST /mortgage-applications/{id}/close requires status CLEARED_TO_CLOSE, which an application with incomplete or stale education never reaches, so priority 10's ERR_TRANSITION_NOT_ALLOWED pre-empts them."
        test_recipe:
          setup:
            - "Canonical program with a SELECTED household (composite 91.0) holding one adult APPLICANT. One HOMEBUYER_CORE enrollment requiring 2 modules exists and has recorded a single PASSED module, so it sits at IN_PROGRESS with passed_module_count 1."
