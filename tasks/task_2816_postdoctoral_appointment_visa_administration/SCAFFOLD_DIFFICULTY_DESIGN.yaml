# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# Task 2816 — Postdoctoral Appointment & Visa Administration
# 9 rule_id blocks x 2 instances = 18 instances.
# Every numeric assert literal below was produced by executing the §1.3
# formulas and their constants as code, not estimated.
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: visa_timeline_initial_filing_versus_post_rfe_refiling
        grounds:
          - calculations.visa_processing_timeline
          - state_machines.VisaCase.DOCS_PENDING_to_SUBMITTED
          - state_machines.VisaCase.RFE_RECEIVED_to_SUBMITTED
          - entities.VisaCase.fields.projection_variant
          - entities.VisaCase.fields.projected_decision_date
        distinguishing_aspect: |
          The two variants of visa_processing_timeline are selected by the
          from-state of the same submit-petition endpoint, and for one identical
          category (J1_RESEARCH_SCHOLAR) and one identical track (STANDARD) they
          apply different day counts to the filing instant — 21 days for
          initial_filing versus ceil(21 * 1.5) = 32 days for post_rfe_refiling —
          so the projection after re-filing is 32 days out, never 21.
        test_recipe:
          setup:
            - "One Indian-citizen scholar requiring sponsorship, one mentor with valid training, one VERIFIED NIH-scale federal grant."
            - "One 12-month appointment (2026-10-01 to 2027-09-30) at 68000.00 that has been offered and accepted, so a VisaCase exists in DOCS_PENDING with visa_category J1_RESEARCH_SCHOLAR and processing_track STANDARD."
            - "Logical clock at 2026-08-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /postdocs"
              payload: { full_name: "Ana Ruiz", email: "ana.ruiz@example.edu", citizenship_country: "IN", requires_sponsorship: true, phd_award_date: "2026-05-15", prior_external_months_in_rank: 0, o1_endorsement_on_file: false, j1_two_year_bar_flag: false, restricted_party_flag: false }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /faculty-mentors"
              payload: { full_name: "R. Okafor", department: "Molecular Biology", mentor_training_valid_through: "2028-12-31", max_concurrent_postdocs: 3 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_1"
              captures: { m1_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { sponsor_name: "NIH R01 GM-118", funding_type: "FEDERAL_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2026-09-01", award_end_date: "2027-12-31", annual_budget_usd: 400000.00, requires_mentoring_plan: false, requires_idp: false }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_1"
              captures: { f1_id: "$.data.id" }
            - call: "POST /funding-sources/${f1_id}/verification"
              payload: { decision: "VERIFY" }
              as: HRCompensationApprover
              as_user_id: "hr_appr_1"
            - call: "POST /appointments"
              payload: { postdoc_id: "${p1_id}", mentor_id: "${m1_id}", funding_source_id: "${f1_id}", title_classification: "POSTDOC_SCHOLAR_EMPLOYEE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 68000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_1"
              captures: { a1_id: "$.data.id" }
            - call: "POST /appointments/${a1_id}/issue-offer"
              payload: {}
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_1"
            - call: "POST /appointments/${a1_id}/accept-offer"
              payload: { processing_track: "STANDARD" }
              as: Postdoc
              as_user_id: "${p1_id}"
            - call: "GET /appointments/${a1_id}/visa-cases"
              payload: {}
              as: InternationalScholarAdvisor
              captures: { v1_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: InternationalScholarAdvisor
          trigger:
            - call: "POST /visa-cases/${v1_id}/submit-petition"
              payload: { processing_track: "STANDARD" }
              as: InternationalScholarAdvisor
              captures: { init_projected: "$.data.projected_decision_date", init_lawful: "$.data.earliest_lawful_start_date" }
            - call: "POST /visa-cases/${v1_id}/adjudication"
              payload: { outcome: "RFE", decision_note: "Request for evidence: proof of research-scholar status" }
              as: InternationalScholarAdvisor
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T09:00:00Z" }
              as: InternationalScholarAdvisor
            - call: "POST /visa-cases/${v1_id}/submit-petition"
              payload: { processing_track: "STANDARD" }
              as: InternationalScholarAdvisor
              captures: { refile_projected: "$.data.projected_decision_date", refile_lawful: "$.data.earliest_lawful_start_date" }
          assert:
            - "VisaCase.${v1_id}.visa_category == J1_RESEARCH_SCHOLAR"
            - "${init_projected} == 2026-08-26"
            - "${init_lawful} == 2026-09-05"
            - "VisaCase.${v1_id}.projection_variant == POST_RFE_REFILING after the second submit-petition"
            - "${refile_projected} == 2026-09-26"
            - "${refile_lawful} == 2026-10-06"
            - "VisaCase.${v1_id}.rfe_round_count == 1"
            - "VisaCase.${v1_id}.status == SUBMITTED"

      - name: export_risk_tier1_standard_versus_tier2_enhanced
        grounds:
          - calculations.export_control_risk_score
          - state_machines.ExportControlReview.QUEUED_to_CLEARED_WITH_CONDITIONS
          - state_machines.ExportControlReview.QUEUED_to_DENIED
          - entities.ExportControlReview.fields.screening_tier
          - entities.ExportControlReview.fields.risk_score
        distinguishing_aspect: |
          The two variants of export_control_risk_score are selected by the
          screening cycle depth, not by a from-state, and they differ in TWO
          structural ways at once: the country weight changes 12.5 -> 15.0 and
          the term-duration component appears only in tier_2_enhanced. With
          byte-identical reviewer inputs (CN citizenship, controlled technology,
          no restricted-party hit, FEDERAL_GRANT, 24-month term) cycle 1 scores
          56.3 and clears with conditions while cycle 2 scores 68.8 and is
          denied — a 12.5-point delta that also flips the outcome.
        test_recipe:
          setup:
            - "One Chinese-citizen scholar not requiring sponsorship, one mentor with valid training, one VERIFIED NIH-scale federal grant with a 500000.00 budget."
            - "One 24-month appointment (2026-10-01 to 2028-09-30) at 62000.00, offered, accepted, screened at cycle 1 with controlled_technology_flag true, and ACTIVE with compliance_status RESTRICTED."
            - "A renewal has been recommended and finalized, so the CH-D cascade has created a cycle-2 ExportControlReview in QUEUED and driven compliance_status back to PENDING_REVIEW."
            - "Logical clock at 2027-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /postdocs"
              payload: { full_name: "Wei Chen", email: "wei.chen@example.edu", citizenship_country: "CN", requires_sponsorship: false, phd_award_date: "2026-04-01", prior_external_months_in_rank: 0, o1_endorsement_on_file: false, j1_two_year_bar_flag: false, restricted_party_flag: false }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_2"
              captures: { p2_id: "$.data.id" }
            - call: "POST /faculty-mentors"
              payload: { full_name: "L. Hartmann", department: "Materials Science", mentor_training_valid_through: "2029-06-30", max_concurrent_postdocs: 3 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_2"
              captures: { m2_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { sponsor_name: "DOE BES-2211", funding_type: "FEDERAL_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2026-09-01", award_end_date: "2029-12-31", annual_budget_usd: 500000.00, requires_mentoring_plan: false, requires_idp: false }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_2"
              captures: { f2_id: "$.data.id" }
            - call: "POST /funding-sources/${f2_id}/verification"
              payload: { decision: "VERIFY" }
              as: HRCompensationApprover
              as_user_id: "hr_appr_1"
            - call: "POST /appointments"
              payload: { postdoc_id: "${p2_id}", mentor_id: "${m2_id}", funding_source_id: "${f2_id}", title_classification: "POSTDOC_ASSOCIATE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2028-09-30", annual_salary_usd: 62000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_2"
              captures: { a2_id: "$.data.id" }
            - call: "POST /appointments/${a2_id}/issue-offer"
              payload: {}
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_2"
            - call: "POST /appointments/${a2_id}/accept-offer"
              payload: {}
              as: Postdoc
              as_user_id: "${p2_id}"
            - call: "GET /appointments/${a2_id}/export-control-reviews"
              payload: { status: "QUEUED" }
              as: ExportControlReviewer
              captures: { ecr1_id: "$.data[0].id" }
            - call: "POST /export-control-reviews/${ecr1_id}/decision"
              payload: { restricted_party_hit: false, controlled_technology_flag: true }
              as: ExportControlReviewer
              as_user_id: "ecr_rev_1"
              captures: { cycle1_score: "$.data.risk_score", cycle1_tier: "$.data.screening_tier" }
            - call: "POST /appointments/${a2_id}/activate"
              payload: {}
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_2"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_2"
            - call: "POST /appointments/${a2_id}/reappointment-reviews"
              payload: {}
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_2"
              captures: { rr2_id: "$.data.id" }
            - call: "POST /reappointment-reviews/${rr2_id}/recommendation"
              payload: { recommendation: "RENEW", mentor_recommendation_note: "Strong progress; renew for a second year." }
              as: FacultyMentor
              as_user_id: "${m2_id}"
            - call: "POST /reappointment-reviews/${rr2_id}/finalize"
              payload: { decision: "RENEW" }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_2"
            - call: "GET /appointments/${a2_id}/export-control-reviews"
              payload: { status: "QUEUED" }
              as: ExportControlReviewer
              captures: { ecr2_id: "$.data[0].id", ecr2_cycle: "$.data[0].cycle_index" }
          trigger:
            - call: "POST /export-control-reviews/${ecr2_id}/decision"
              payload: { restricted_party_hit: false, controlled_technology_flag: true }
              as: ExportControlReviewer
              as_user_id: "ecr_rev_1"
              captures: { cycle2_score: "$.data.risk_score", cycle2_tier: "$.data.screening_tier" }
          assert:
            - "${cycle1_tier} == TIER_1_STANDARD"
            - "${cycle1_score} == 56.3"
            - "ExportControlReview.${ecr1_id}.status == CLEARED_WITH_CONDITIONS"
            - "${ecr2_cycle} == 2"
            - "${cycle2_tier} == TIER_2_ENHANCED"
            - "${cycle2_score} == 68.8"
            - "ExportControlReview.${ecr2_id}.status == DENIED"
            - "${cycle2_score} - ${cycle1_score} == 12.5"
            - "Appointment.${a2_id}.compliance_status == BLOCKED"
            - "Appointment.${a2_id}.appointment_status == TERMINATED"
            - "ReappointmentReview.${rr2_id}.service_months_at_review == 9"

  - rule_id: combinatorial_formula
    instances:

      - name: salary_floor_band_policy_class_and_title_composition
        grounds:
          - calculations.salary_floor_computation
          - calculations.months_in_rank_ledger
          - calculations.benefits_eligibility
          - entities.Appointment.fields.salary_floor_usd
          - entities.FundingSource.fields.salary_floor_policy
        distinguishing_aspect: |
          This is combinatorial mode (a): four independent inputs — the
          experience band derived from months_in_rank_at_start, the award's
          salary_floor_policy, a multiplicative employment_class factor, and an
          additive title uplift — compose into one floor, and no single input
          determines it. Three drafts on identical mentors and terms yield
          64008.00, 67284.00 and 57957.60 because each varies a different one of
          the four inputs.
        test_recipe:
          setup:
            - "Three scholars: one with 0 prior external months, one with 48 prior external months, one with 0 prior external months."
            - "Two awards: an NIH-scale FEDERAL_GRANT and an NIH-scale EXTERNAL_FELLOWSHIP, both with a 400000.00 budget."
            - "Three DRAFT appointments, all mentored by the same mentor, all with term 2026-10-01 to 2027-09-30 (12 months)."
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /faculty-mentors"
              payload: { full_name: "S. Adeyemi", department: "Biochemistry", mentor_training_valid_through: "2029-01-31", max_concurrent_postdocs: 3 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_3"
              captures: { m3_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { sponsor_name: "NIH R01 CA-901", funding_type: "FEDERAL_GRANT", salary_floor_policy: "NIH_SCALE", award_start_date: "2026-09-01", award_end_date: "2027-12-31", annual_budget_usd: 400000.00, requires_mentoring_plan: false, requires_idp: false }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_3"
              captures: { f3_grant_id: "$.data.id" }
            - call: "POST /funding-sources"
              payload: { sponsor_name: "Damon Runyon Fellowship", funding_type: "EXTERNAL_FELLOWSHIP", salary_floor_policy: "NIH_SCALE", award_start_date: "2026-09-01", award_end_date: "2027-12-31", annual_budget_usd: 400000.00, requires_mentoring_plan: false, requires_idp: false }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_3"
              captures: { f3_fellow_id: "$.data.id" }
            - call: "POST /postdocs"
              payload: { full_name: "Nia Boateng", email: "nia.b@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-06-01", prior_external_months_in_rank: 0 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_3"
              captures: { p3a_id: "$.data.id" }
            - call: "POST /postdocs"
              payload: { full_name: "Tomas Silva", email: "tomas.s@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2022-06-01", prior_external_months_in_rank: 48 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_3"
              captures: { p3b_id: "$.data.id" }
            - call: "POST /postdocs"
              payload: { full_name: "Ines Marchetti", email: "ines.m@example.edu", citizenship_country: "US", requires_sponsorship: false, phd_award_date: "2026-06-15", prior_external_months_in_rank: 0 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_3"
              captures: { p3c_id: "$.data.id" }
          trigger:
            - call: "POST /appointments"
              payload: { postdoc_id: "${p3a_id}", mentor_id: "${m3_id}", funding_source_id: "${f3_grant_id}", title_classification: "POSTDOC_SCHOLAR_EMPLOYEE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 68000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_3"
              captures: { a3a_id: "$.data.id", a3a_floor: "$.data.salary_floor_usd" }
            - call: "POST /appointments"
              payload: { postdoc_id: "${p3b_id}", mentor_id: "${m3_id}", funding_source_id: "${f3_grant_id}", title_classification: "POSTDOC_ASSOCIATE", employment_class: "EMPLOYEE", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 70000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_3"
              captures: { a3b_id: "$.data.id", a3b_floor: "$.data.salary_floor_usd" }
            - call: "POST /appointments"
              payload: { postdoc_id: "${p3c_id}", mentor_id: "${m3_id}", funding_source_id: "${f3_fellow_id}", title_classification: "POSTDOC_FELLOW", employment_class: "FELLOWSHIP", term_start_date: "2026-10-01", term_end_date: "2027-09-30", annual_salary_usd: 60000.00 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_3"
              captures: { a3c_id: "$.data.id", a3c_floor: "$.data.salary_floor_usd" }
          assert:
            - "${a3a_floor} == 64008.00"
            - "${a3b_floor} == 67284.00"
            - "${a3c_floor} == 57957.60"
            - "Appointment.${a3a_id}.months_in_rank_at_start == 0 and Appointment.${a3a_id}.cumulative_months_in_rank_at_end == 12"
            - "Appointment.${a3b_id}.months_in_rank_at_start == 48 and Appointment.${a3b_id}.cumulative_months_in_rank_at_end == 60"
            - "Appointment.${a3c_id}.months_in_rank_at_start == 0 and Appointment.${a3c_id}.cumulative_months_in_rank_at_end == 12"
            - "Appointment.${a3a_id}.term_months == 12 and Appointment.${a3b_id}.term_months == 12 and Appointment.${a3c_id}.term_months == 12"
            - "Appointment.${a3a_id}.benefits_package == EMPLOYEE_FULL"
            - "Appointment.${a3c_id}.benefits_package == FELLOWSHIP_STIPEND_ONLY"

      - name: encumbrance_pinned_rounding_order_and_base_keyed_fringe_tier
        grounds:
          - calculations.funding_encumbrance
          - state_machines.Appointment.DRAFT_to_OFFER_ISSUED
          - entities.Appointment.fields.encumbrance_usd
          - entities.Appointment.fields.fringe_rate
          - entities.FundingSource.fields.encumbered_usd
          - entities.FundingSource.fields.available_balance_usd
        distinguishing_aspect: |
          This is combinatorial modes (b) and (c) together, a different mode set
          from the salary-floor instance. Mode (b): rounding the fringe amount to
          cents before adding it to the rounded base gives 66626.95 where
          rounding once at the end gives 66626.96. Mode (c): the fringe band is
          keyed on the STEP-1 base (50860.27 -> 0.31), not on the STEP-4 total,
          which would key on 67898.46 and select 0.335 — a circular dependency
          the pinned evaluation order resolves.
        test_recipe:
          setup:
            - "Two VERIFIED NIH-scale FEDERAL_GRANT awards, each with a 400000.00 budget: one running 2026-09-01 to 2027-12-31, one running 2026-09-01 to 2027-06-30."
            - "Two scholars, one 12-month appointment each (2026-10-01 to 2027-09-30) at 68000.00 as POSTDOC_SCHOLAR_EMPLOYEE, both DRAFT."
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /faculty-mentors"
              payload: { full_name: "K. Villanueva", department: "Neuroscience", mentor_training_valid_through: "2029-03-31", max_concurrent_postdocs: 3 }
              as: PostdocAffairsOfficer
              as_user_id: "officer_pa_4"
