scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: sdat_posted_estimate_vs_actual_diverge_on_work_order
        grounds:
          - calculations.safe_drive_away_time
          - endpoints./work-orders/{id}/sdat-estimate
          - endpoints./work-orders/{id}/finish-install
          - entities.WorkOrder.fields.safe_drive_away_at
        distinguishing_aspect: |
          On the WorkOrder cure-time domain, the posted conservative estimate
          (worst band, 270 min) and the actual SDAT from the measured warm/dry
          reading (60 min) produce different safe-drive-away instants for the
          same finish-install clock — 13:30Z posted vs 10:00Z actual.
        test_recipe:
          setup:
            - "A REPLACE+ADAS work order in IN_SERVICE, fully readied; clock at 2026-06-13T09:00:00Z."
            - "Posted estimate read before install; actual stamped at finish-install with temp_c=24, humidity_pct=40 (WARM band, no dry penalty)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { full_name: "Dana Glass", email: "dana@x.com", phone: "555-0100", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "1HGCM82633A004352", make: "Honda", model: "Accord", model_year: 2021, adas_equipped: true, glass_part_number: "FW04123" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /glass-parts"
              payload: { oem_part_number: "FW04123", description: "Accord ADAS windshield", adas_compatible: true, unit_price_cents: 30000, on_hand_qty: 5 }
              as: ShopManager
              captures: { part_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Pat Install", can_mobile: false, adas_certified: true, home_state: "CA" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /service-bays"
              payload: { name: "Install Bay 1", bay_type: "INSTALL", cleanroom: false }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/damage-assessments"
              payload: { chip_count: 0, longest_crack_mm: 400, in_driver_primary_view: true, edge_distance_mm: 5 }
              as: ServiceAdvisor
              captures: { asmt_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/accept-assessment"
              payload: { assessment_id: "${asmt_id}" }
              as: ServiceAdvisor
              captures: { wo_v2: $.data.version }
            - call: "POST /part-orders"
              payload: { work_order_id: "${wo_id}", glass_part_id: "${part_id}", quantity: 1, expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments"
              payload: { work_order_id: "${wo_id}", technician_id: "${tech_id}", service_bay_id: "${bay_id}", service_location: "IN_SHOP", start_at: "2026-06-13T08:00:00Z", end_at: "2026-06-13T09:00:00Z" }
              as: ServiceAdvisor
              captures: { appt_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { appointment_id: "${appt_id}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments/${appt_id}/check-in"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "GET /work-orders/${wo_id}/sdat-estimate"
              payload: {}
              as: ServiceAdvisor
              captures: { posted_min: $.data.posted_sdat_minutes, posted_at: $.data.posted_safe_drive_away_at }
            - call: "POST /work-orders/${wo_id}/finish-install"
              payload: { temp_c: 24, humidity_pct: 40 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { actual_sdat: $.data.safe_drive_away_at }
          assert:
            - "GET sdat-estimate posted_sdat_minutes == 270"
            - "GET sdat-estimate posted_safe_drive_away_at == 2026-06-13T13:30:00.000Z"
            - "WorkOrder.${wo_id}.safe_drive_away_at == 2026-06-13T10:00:00.000Z"
            - "the actual SDAT (10:00Z) differs from the posted estimate (13:30Z)"

      - name: refund_full_vs_restock_diverge_on_payment
        grounds:
          - calculations.refund_amount
          - endpoints./payments/{id}/refund
          - entities.Payment.fields.refunded_amount_cents
          - entities.WorkOrder.fields.amount_paid_cents
        distinguishing_aspect: |
          On the Payment fiscal domain, refunding the same 56854-cent CAPTURED
          payment yields the full 56854 when the work order is pre-service
          (REPAIR or <IN_SERVICE) but 48326 (after a 15% = 8528 restock fee)
          once a REPLACE work order has reached IN_SERVICE — a different conserved
          quantity (money) and entity than the SDAT instance.
        test_recipe:
          setup:
            - "Work order A: REPLACE+ADAS, IN_SERVICE, paid 56854 in full, then payment refunded (restock applies)."
            - "Work order B: REPAIR, ASSESSED, paid 9657 in full, then payment refunded (no restock)."
            - "Clock at 2026-06-13T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { full_name: "Ray Refund", email: "ray@x.com", phone: "555-0101", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "2HGCM82633A004353", make: "Honda", model: "Civic", model_year: 2022, adas_equipped: true, glass_part_number: "FW04124" }
              as: ServiceAdvisor
              captures: { veh_a: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "3HGCM82633A004354", make: "Honda", model: "Fit", model_year: 2020, adas_equipped: false, glass_part_number: "FW04125" }
              as: ServiceAdvisor
              captures: { veh_b: $.data.id }
            - call: "POST /glass-parts"
              payload: { oem_part_number: "FW04124", description: "Civic ADAS windshield", adas_compatible: true, unit_price_cents: 30000, on_hand_qty: 5 }
              as: ShopManager
              captures: { part_a: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Tess Tech", can_mobile: false, adas_certified: true, home_state: "CA" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /service-bays"
              payload: { name: "Install Bay 2", bay_type: "INSTALL", cleanroom: false }
              as: ShopManager
              captures: { bay_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_a}" }
              as: ServiceAdvisor
              captures: { wo_a: $.data.id }
            - call: "POST /work-orders/${wo_a}/damage-assessments"
              payload: { chip_count: 0, longest_crack_mm: 400, in_driver_primary_view: true, edge_distance_mm: 5 }
              as: ServiceAdvisor
              captures: { asmt_a: $.data.id }
            - call: "POST /work-orders/${wo_a}/accept-assessment"
              payload: { assessment_id: "${asmt_a}" }
              as: ServiceAdvisor
              captures: { wo_a_v2: $.data.version }
            - call: "POST /part-orders"
              payload: { work_order_id: "${wo_a}", glass_part_id: "${part_a}", quantity: 1, expected_work_order_version: "${wo_a_v2}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments"
              payload: { work_order_id: "${wo_a}", technician_id: "${tech_id}", service_bay_id: "${bay_id}", service_location: "IN_SHOP", start_at: "2026-06-13T08:00:00Z", end_at: "2026-06-13T08:59:00Z" }
              as: ServiceAdvisor
              captures: { appt_a: $.data.id }
            - call: "POST /work-orders/${wo_a}/schedule"
              payload: { appointment_id: "${appt_a}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments/${appt_a}/check-in"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_a}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /payments"
              payload: { work_order_id: "${wo_a}", amount_cents: 56854, method: "CARD" }
              as: ServiceAdvisor
              captures: { pay_a: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_b}" }
              as: ServiceAdvisor
              captures: { wo_b: $.data.id }
            - call: "POST /work-orders/${wo_b}/damage-assessments"
              payload: { chip_count: 1, longest_crack_mm: 20, in_driver_primary_view: false, edge_distance_mm: 80 }
              as: ServiceAdvisor
              captures: { asmt_b: $.data.id }
            - call: "POST /work-orders/${wo_b}/accept-assessment"
              payload: { assessment_id: "${asmt_b}" }
              as: ServiceAdvisor
            - call: "POST /payments"
              payload: { work_order_id: "${wo_b}", amount_cents: 9657, method: "CARD" }
              as: ServiceAdvisor
              captures: { pay_b: $.data.id }
          trigger:
            - call: "POST /payments/${pay_a}/refund"
              payload: {}
              as: ShopManager
              captures: { refunded_a: $.data.refunded_amount_cents }
            - call: "POST /payments/${pay_b}/refund"
              payload: {}
              as: ShopManager
              captures: { refunded_b: $.data.refunded_amount_cents }
          assert:
            - "Payment.${pay_a}.refunded_amount_cents == 48326"
            - "Payment.${pay_b}.refunded_amount_cents == 9657"
            - "WorkOrder.${wo_a}.amount_paid_cents == 0 after refund"
            - "WorkOrder.${wo_b}.amount_paid_cents == 0 after refund"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: price_quote_conditional_branch_mode_a
        grounds:
          - calculations.price_quote
          - endpoints./work-orders/{id}/accept-assessment
          - entities.WorkOrder.fields.total_charge_cents
          - entities.Vehicle.fields.adas_equipped
        distinguishing_aspect: |
          Mode (a): price_quote takes 3+ inputs (service_decision, adas_equipped,
          SHOP_FEE_PCT) with conditional branches — base switches on REPAIR/REPLACE,
          adas_fee is added only for ADAS vehicles, and shop_fee is a sum-then-round
          percentage on (base+adas). REPLACE+ADAS = 32500+19900+round_half_up(52400*0.085=4454)=56854.
        test_recipe:
          setup:
            - "REPLACE+ADAS work order; accept-assessment computes total_charge_cents."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Quinn Quote", email: "quinn@x.com", phone: "555-0102", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "4HGCM82633A004355", make: "Toyota", model: "RAV4", model_year: 2023, adas_equipped: true, glass_part_number: "FW04126" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/damage-assessments"
              payload: { chip_count: 0, longest_crack_mm: 200, in_driver_primary_view: false, edge_distance_mm: 50 }
              as: ServiceAdvisor
              captures: { asmt_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/accept-assessment"
              payload: { assessment_id: "${asmt_id}" }
              as: ServiceAdvisor
              captures: { total: $.data.total_charge_cents, decision: $.data.service_decision }
          assert:
            - "WorkOrder.${wo_id}.service_decision == REPLACE"
            - "WorkOrder.${wo_id}.total_charge_cents == 56854"

      - name: trip_fee_circular_on_frozen_total_mode_c
        grounds:
          - calculations.schedule_trip_fee
          - calculations.price_quote
          - endpoints./work-orders/{id}/schedule
          - entities.WorkOrder.fields.total_charge_cents
        distinguishing_aspect: |
          Mode (c): the mobile trip fee is a percentage of the ALREADY-FROZEN
          total_charge_cents (which itself contains shop_fee), so the value is only
          well-defined once evaluation order is pinned (price_quote at accept then
          schedule_trip_fee at schedule, never recomputing the quote). REPAIR mobile
          out-of-state: frozen 9657 + round_half_up(9657*0.09=869.13->869)=10526.
        test_recipe:
          setup:
            - "REPAIR work order for an out-of-state (NV) customer; scheduled MOBILE."
            - "frozen quote 9657, then trip fee on top."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Tara Trip", email: "tara@x.com", phone: "555-0103", service_address_state: "NV" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "5HGCM82633A004356", make: "Mazda", model: "3", model_year: 2019, adas_equipped: false, glass_part_number: "FW04127" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Mo Mobile", can_mobile: true, adas_certified: false, home_state: "NV" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/damage-assessments"
              payload: { chip_count: 1, longest_crack_mm: 15, in_driver_primary_view: false, edge_distance_mm: 90 }
              as: ServiceAdvisor
              captures: { asmt_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/accept-assessment"
              payload: { assessment_id: "${asmt_id}" }
              as: ServiceAdvisor
              captures: { frozen_total: $.data.total_charge_cents }
            - call: "POST /service-appointments"
              payload: { work_order_id: "${wo_id}", technician_id: "${tech_id}", service_location: "MOBILE", start_at: "2026-06-14T15:00:00Z", end_at: "2026-06-14T16:00:00Z" }
              as: ServiceAdvisor
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { appointment_id: "${appt_id}" }
              as: ServiceAdvisor
              captures: { final_total: $.data.total_charge_cents }
          assert:
            - "WorkOrder.${wo_id}.total_charge_cents == 9657 immediately after accept-assessment (frozen quote)"
            - "WorkOrder.${wo_id}.total_charge_cents == 10526 after schedule (9657 + 869 out-of-state trip fee)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: recalibration_cyclic_fail_retry_loop
        grounds:
          - state_machines.RecalibrationJob.SCHEDULED_to_FAILED
          - state_machines.RecalibrationJob.FAILED_to_SCHEDULED
          - state_machines.RecalibrationJob.SCHEDULED_to_PASSED
        distinguishing_aspect: |
          RecalibrationJob is cyclic: SCHEDULED->FAILED->SCHEDULED->PASSED. The
          fail/retry loop returns to SCHEDULED while the parent WorkOrder stays
          AWAITING_RECALIBRATION, and only a later PASS advances the work order.
        test_recipe:
          setup:
            - "A REPLACE+ADAS work order in AWAITING_RECALIBRATION with a SCHEDULED RecalibrationJob (STATIC, certified tech, calibration bay)."
            - "Clock at 2026-06-13T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { full_name: "Cy Cycle", email: "cy@x.com", phone: "555-0104", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "6HGCM82633A004357", make: "Subaru", model: "Outback", model_year: 2022, adas_equipped: true, glass_part_number: "FW04128" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /glass-parts"
              payload: { oem_part_number: "FW04128", description: "Outback ADAS windshield", adas_compatible: true, unit_price_cents: 31000, on_hand_qty: 3 }
              as: ShopManager
              captures: { part_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Cal Cert", can_mobile: false, adas_certified: true, home_state: "CA" }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /service-bays"
              payload: { name: "Install Bay 3", bay_type: "INSTALL", cleanroom: false }
              as: ShopManager
              captures: { ibay_id: $.data.id }
            - call: "POST /service-bays"
              payload: { name: "Calib Bay 1", bay_type: "CALIBRATION", cleanroom: false }
              as: ShopManager
              captures: { cbay_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/damage-assessments"
              payload: { chip_count: 0, longest_crack_mm: 300, in_driver_primary_view: true, edge_distance_mm: 5 }
              as: ServiceAdvisor
              captures: { asmt_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/accept-assessment"
              payload: { assessment_id: "${asmt_id}" }
              as: ServiceAdvisor
              captures: { wo_v2: $.data.version }
            - call: "POST /part-orders"
              payload: { work_order_id: "${wo_id}", glass_part_id: "${part_id}", quantity: 1, expected_work_order_version: "${wo_v2}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments"
              payload: { work_order_id: "${wo_id}", technician_id: "${tech_id}", service_bay_id: "${ibay_id}", service_location: "IN_SHOP", start_at: "2026-06-13T08:00:00Z", end_at: "2026-06-13T08:59:00Z" }
              as: ServiceAdvisor
              captures: { appt_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/schedule"
              payload: { appointment_id: "${appt_id}" }
              as: ServiceAdvisor
            - call: "POST /service-appointments/${appt_id}/check-in"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/start-service"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/finish-install"
              payload: { temp_c: 25, humidity_pct: 40 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_v_fin: $.data.version }
            - call: "POST /recalibration-jobs"
              payload: { work_order_id: "${wo_id}", technician_id: "${tech_id}", service_bay_id: "${cbay_id}", calibration_type: "STATIC", start_at: "2026-06-13T09:10:00Z", end_at: "2026-06-13T09:40:00Z", expected_work_order_version: "${wo_v_fin}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { rc_id: $.data.id }
          trigger:
            - call: "POST /recalibration-jobs/${rc_id}/fail"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { st_failed: $.data.status }
            - call: "POST /recalibration-jobs/${rc_id}/retry"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { st_resched: $.data.status }
            - call: "POST /recalibration-jobs/${rc_id}/pass"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { st_passed: $.data.status }
          assert:
            - "RecalibrationJob.${rc_id}.status == FAILED after fail"
            - "WorkOrder.${wo_id}.status == AWAITING_RECALIBRATION while recalibration FAILED"
            - "RecalibrationJob.${rc_id}.status == SCHEDULED after retry"
            - "RecalibrationJob.${rc_id}.status == PASSED after pass"
            - "WorkOrder.${wo_id}.status == CURING after pass"

      - name: work_order_branch_install_to_curing_or_recalibration
        grounds:
          - state_machines.WorkOrder.IN_SERVICE_to_CURING
          - state_machines.WorkOrder.IN_SERVICE_to_AWAITING_RECALIBRATION
          - entities.WorkOrder.fields.recalibration_required
        distinguishing_aspect: |
          WorkOrder branches at finish-install: a REPLACE on an ADAS vehicle goes
          IN_SERVICE->AWAITING_RECALIBRATION, while a REPLACE on a non-ADAS vehicle
          goes IN_SERVICE->CURING — divergent side-effect sets (recalibration gate
          vs direct cure) on the same trigger; this is the WorkOrder entity, not
          the RecalibrationJob of the sibling instance.
        test_recipe:
          setup:
            - "Two REPLACE work orders both reaching IN_SERVICE: WO-X on an ADAS vehicle, WO-Y on a non-ADAS vehicle."
            - "Clock at 2026-06-13T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-13T09:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { full_name: "Bree Branch", email: "bree@x.com", phone: "555-0105", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "7HGCM82633A004358", make: "Ford", model: "Escape", model_year: 2023, adas_equipped: true, glass_part_number: "FW04129" }
              as: ServiceAdvisor
              captures: { veh_x: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "8HGCM82633A004359", make: "Ford", model: "Focus", model_year: 2016, adas_equipped: false, glass_part_number: "FW04130" }
              as: ServiceAdvisor
              captures: { veh_y: $.data.id }
            - call: "POST /glass-parts"
              payload: { oem_part_number: "FW04129", description: "Escape ADAS windshield", adas_compatible: true, unit_price_cents: 30500, on_hand_qty: 4 }
              as: ShopManager
              captures: { part_x: $.data.id }
            - call: "POST /glass-parts"
              payload: { oem_part_number: "FW04130", description: "Focus windshield", adas_compatible: false, unit_price_cents: 21000, on_hand_qty: 4 }
              as: ShopManager
              captures: { part_y: $.data.id }
            - call: "POST /technicians"
