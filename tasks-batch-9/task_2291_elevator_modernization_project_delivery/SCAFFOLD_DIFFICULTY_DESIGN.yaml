              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1000, max_concurrent_outages: 2, outage_buffer_hours: 4, tenant_notice_lead_hours: 72 }
              as: ProjectManager
