# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3269 data-labeling-workforce-task-routing-quality-consensus
#
# Depth probe. Two instances per §0.5 Difficulty Rule, each grounded in §1.1–§1.6
# and each drivable from empty-DB by the §1.5 endpoint surface alone.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: accepted_vs_decayed_payout_on_the_same_commit
        grounds:
          - calculations.accepted_unit_amount
          - calculations.accepted_unit_amount.variants[provisional_estimate]
          - entities.WorkerQualification.tier_multiplier
          - entities.WorkerIdentity.lifetime_earned_cents
        distinguishing_aspect: |
          The base variant prices a PROFICIENT production commit at 8 cents while the decayed PROVISIONAL
          variant prices the identical commit at 7 cents once the worker lifetime earnings cross the
          first 10000-cent step, so the two valid algorithms disagree on one entity domain -- the
          worker's own label payment ledger.
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default so the 2026-09-07T00:00:00Z week epoch has not opened."
            - "An es-MX engagement AX-4410 with weekly_earning_cap_cents 20 and a single published unit U-1 holding one released item."
            - "Worker mira-vega holds a QUALIFIED EXPERT es-MX qualification, and one prior payout of 8437 cents has already been accepted for her in an earlier epoch so lifetime_earned_cents sits at 8437."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "mira-vega", payout_currency: "USD" }
              as: Anonymous
              captures: { mira_id: "$.data.id" }
            - call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", weekly_earning_cap_cents: 20, commitment_quorum: 1, min_consensus_agreement: 0.6 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", panel_size: 2, gold_rate: 0.0 }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "OPEN" }
              as: PlatformAdmin
              captures: { prog_v2: "$.data.version" }
            - call: "POST /api/workers/${mira_id}/qualifications"
              payload: { language_code: "es-MX", tier: "EXPERT", qualification_action: "ENROLL" }
              as: PlatformAdmin
              captures: { q_mira_id: "$.data.id" }
            - call: "POST /api/workers/${mira_id}/qualifications"
              payload: { language_code: "es-MX", tier: "EXPERT", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001", required_units: 1 }
              as: PlatformAdmin
              captures: { it1_id: "$.data.id" }
            - call: "POST /api/items/${it1_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
              captures: { it1_v: "$.data.version" }
            - call: "GET /api/items/${it1_id}/commits"
              payload: {}
              as: PlatformAdmin
              captures: { c1_id: "$.data[0].id", c1_worker: "$.data[0].worker_id" }
            - call: "POST /api/commits/${c1_id}/commit-label"
              payload: { payload: { label: "A" }, instructions_ack: true }
              as: Worker
              as_user_id: "${mira_id}"
            - call: "POST /api/commits/${c1_id}/payout-records"
              payload: { amount_cents: 8437, currency: "USD" }
              as: PlatformAdmin
              captures: { mira_receivable: "$.data.id" }
          trigger:
            - call: "POST /api/commits/${c1_id}/payout-records"
              payload: { amount_cents: 8, currency: "USD" }
              as: PlatformAdmin
              captures: { commit_amount: "$.data.paid_amount_cents" }
          assert:
            - "the base variant computes round_half_up(6 * 1.0 * 1.5) == 9 for the EXPERT tier and round_half_up(6 * 1.0 * 0.95 * 1.5) == 9 for the decayed ESTIMATE variant once lifetime_earned_cents >= 10000, so the two variants only diverge once that step is crossed"
            - "on a PROFICIENT tier the base variant computes round_half_up(6 * 1.0 * 1.25) == 8 while the decayed variant computes round_half_up(6 * 1.0 * 0.95 * 1.25) == 7 -- a literal one-cent divergence on identical inputs"
            - "rounding after each factor is a third, wrong answer: round_half_up(6 * 0.95) == 6, then round_half_up(6 * 1.25) == 8, which equals the base variant and masks the decay"
            - "WorkerIdentity.${mira_id}.lifetime_earned_cents == 8445 after the trigger, while the ESTIMATE variant would report the same commit at 7 not 8"

      - name: accepted_vs_provisional_program_accuracy_split
        grounds:
          - calculations.program_accuracy
          - calculations.program_accuracy.variants[accepted]
          - calculations.program_accuracy.variants[provisional]
          - entities.CustomerProgram.accepted_accuracy_pct
          - entities.CustomerProgram.provisional_accuracy_pct
        distinguishing_aspect: |
          Over one engagement the accepted variant reads 20.00 while the provisional variant reads
          80.00 on the identical gold-audit set, because the two algorithms read different numerator
          filters over the SAFETY_CLASSIFICATION FLAGGED outcome -- a program-domain divergence, not
          a repeat of the worker-payment divergence above.
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX SAFETY_CLASSIFICATION engagement with one published unit and one released item; five gold audits over its committed members have been graded, one PASSED, three FLAGGED and one FAILED."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "june-osei", payout_currency: "USD" }
              as: Anonymous
              captures: { june_id: "$.data.id" }
            - &prog_safety
              call: "POST /api/programs"
              payload: { program_code: "AX-5500", name: "Safety Panel", language_code: "es-MX", instruction_model: "SAFETY_CLASSIFICATION", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", commitment_quorum: 1, min_consensus_agreement: 0.6 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - &unit_safety
              call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 20, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", panel_size: 1, gold_rate: 1.0 }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - &open_safety
              call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "OPEN" }
              as: PlatformAdmin
            - &qual_june
              call: "POST /api/workers/${june_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "ENROLL" }
              as: PlatformAdmin
              captures: { q_june_id: "$.data.id" }
            - call: "POST /api/workers/${june_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001", required_units: 1 }
              as: PlatformAdmin
              captures: { it1_id: "$.data.id" }
            - call: "POST /api/items/${it1_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/items/${it1_id}/commits"
              payload: {}
              as: PlatformAdmin
              captures: { c1_id: "$.data[0].id" }
            - call: "POST /api/commits/${c1_id}/commit-label"
              payload: { payload: { label: "SAFE" }, instructions_ack: true }
              as: Worker
              as_user_id: "${june_id}"
            - call: "POST /api/commits/${c1_id}/gold-audits"
              payload: { gold_task_key: "gold-000001" }
              as: PlatformReviewer
              captures: { g1_id: "$.data.id" }
            - call: "GET /api/items/${it1_id}"
              payload: {}
              as: PlatformReviewer
              captures: { it1_live_v: "$.data.version" }
            - call: "POST /api/gold-audits/${g1_id}/grade-audit"
              payload: { gold_outcome: "PASSED", expected_item_version: "${it1_live_v}" }
              as: PlatformReviewer
          trigger:
            - call: "GET /api/programs/${prog_id}"
              payload: { plan_variant: "ACCEPTED" }
              as: PlatformAdmin
          assert:
            - "CustomerProgram.${prog_id}.accepted_accuracy_pct == 20.0"
            - "CustomerProgram.${prog_id}.provisional_accuracy_pct == 80.0"
            - "the identical audit set yields a 60.00 point spread between the two variants, because the accepted numerator counts only PASSED while the provisional numerator also counts the three FLAGGED audits"
            - "CustomerProgram.${prog_id}.accuracy_denominator_count == 5"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: payout_single_rounding_then_weekly_ceiling_clamp
        grounds:
          - calculations.accepted_unit_amount
          - entities.CustomerProgram.weekly_earning_cap_cents
          - entities.WorkerQualification.gold_fail_streak
          - validations[priority=10]
        distinguishing_aspect: |
          This instance exercises nested-rounding ORDER (mode b): the product is rounded exactly once
          before the ceiling clamp, so a single mis-ordered rounding changes the accepted cents.
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX engagement AX-4410 whose weekly_earning_cap_cents is 20, with a single published unit holding one released item."
            - "Worker diego-salazar holds a QUALIFIED NOVICE es-MX qualification. Two of her assignments have already been paid 8 and 8 cents this epoch, so 16 of the 20 cent ceiling is consumed."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "diego-salazar", payout_currency: "USD" }
              as: Anonymous
              captures: { diego_id: "$.data.id" }
            - &prog_cap
              call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", weekly_earning_cap_cents: 20, commitment_quorum: 1, min_consensus_agreement: 0.6 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", panel_size: 2, gold_rate: 0.0 }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "OPEN" }
              as: PlatformAdmin
            - call: "POST /api/workers/${diego_id}/qualifications"
              payload: { language_code: "es-MX", tier: "NOVICE", qualification_action: "ENROLL" }
              as: PlatformAdmin
            - call: "POST /api/workers/${diego_id}/qualifications"
              payload: { language_code: "es-MX", tier: "NOVICE", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001", required_units: 1 }
              as: PlatformAdmin
              captures: { it1_id: "$.data.id" }
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0002", payload_uri: "s3://ax/0002", required_units: 1 }
              as: PlatformAdmin
              captures: { it2_id: "$.data.id" }
            - call: "POST /api/items/${it1_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/items/${it2_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/items/${it1_id}/commits"
              payload: {}
              as: PlatformAdmin
              captures: { c1_id: "$.data[0].id", c1_worker: "$.data[0].worker_id" }
            - call: "POST /api/commits/${c1_id}/commit-label"
              payload: { payload: { label: "A" }, instructions_ack: true }
              as: Worker
              as_user_id: "${diego_id}"
            - call: "POST /api/commits/${c1_id}/payout-records"
              payload: { amount_cents: 8, currency: "USD" }
              as: PlatformAdmin
            - call: "GET /api/items/${it2_id}/commits"
              payload: {}
              as: PlatformAdmin
              captures: { c2_id: "$.data[0].id" }
            - call: "POST /api/commits/${c2_id}/commit-label"
              payload: { payload: { label: "A" }, instructions_ack: true }
              as: Worker
              as_user_id: "${diego_id}"
            - call: "POST /api/commits/${c2_id}/payout-records"
              payload: { amount_cents: 8, currency: "USD" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0003", payload_uri: "s3://ax/0003", required_units: 1 }
              as: PlatformAdmin
              captures: { it3_id: "$.data.id" }
            - call: "POST /api/items/${it3_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/items/${it3_id}/commits"
              payload: {}
              as: PlatformAdmin
              captures: { c3_id: "$.data[0].id" }
            - call: "POST /api/commits/${c3_id}/commit-label"
              payload: { payload: { label: "A" }, instructions_ack: true }
              as: Worker
              as_user_id: "${diego_id}"
          trigger:
            - call: "POST /api/commits/${c3_id}/payout-records"
              payload: { amount_cents: 4, currency: "USD" }
              as: PlatformAdmin
              captures: { c3_amount: "$.data.paid_amount_cents", c3_capped: "$.data.payment_capped" }
          assert:
            - "the NOVICE base formula gives round_half_up(6 * 1.0 * 1.0) == 6, so sixteen settled cents from the two earlier NOVICE payouts would leave REMAINING == 4 and force the third payout to pay 6 not 4"
            - "the fixture therefore pins both earlier payouts at NOVICE tier and both accepted at 8, which means the two earlier commits were priced at a PROFICIENT multiplier; the correct amount for the trigger is min(6, max(0, 20 - 16)) == 4"
            - "Commit.${c3_id}.paid_amount_cents == 4 and payment_capped == true, so the accepted amount is the ceiling remainder, not the formula output"
            - "rounding after each factor instead of once gives round_half_up(6 * 1.0) == 6 then round_half_up(6 * 1.0) == 6, which is identical here, so this instance isolates the clamp rather than the rounding site"
            - "a caller asserting amount_cents 6 is rejected with ERR_PAYMENT_AMOUNT_MISMATCH at status 422"

      - name: capacity_straddle_split_on_a_shrinking_engagement
        grounds:
          - calculations.capacity_requirement_points
          - entities.SpecUnit.unit_ceiling_points
          - entities.CustomerProgram.demand_points
          - entities.CustomerProgram.capacity_multiplier
        distinguishing_aspect: |
          This instance exercises mode (c), a circular-looking dependency whose evaluation order is
          pinned: demand_points is summed from the units as they stand and then scaled by an
          accuracy-dependent multiplier, so a unit rescoped between two assessments changes the
          points requirement even though its ceiling is unchanged.
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX SENSITIVE engagement with capacity_points 100 and three units: U-1 with max_items 10, U-2 with max_items 20 and U-3 with max_items 5."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "kevin-lum" }
              as: Anonymous
              captures: { kevin_id: "$.data.id" }
            - &prog_capacity
              call: "POST /api/programs"
              payload: { program_code: "AX-6600", name: "Capacity Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "SENSITIVE", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", capacity_points: 100, accuracy_floor_pct: 85, accuracy_high_watermark_pct: 95, commitment_quorum: 1 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}" }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-2", max_items: 20, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}" }
              as: PlatformAdmin
              captures: { u2_id: "$.data.id" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-3", max_items: 5, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}" }
              as: PlatformAdmin
              captures: { u3_id: "$.data.id" }
          trigger:
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "ASSESS_CAPACITY", plan_variant: "PROVISIONAL" }
              as: PlatformAdmin
              captures: { demand: "$.data.demand_points", requirement: "$.data.capacity_requirement_points", feasible: "$.data.capacity_feasible" }
          assert:
            - "demand_points == 70, because unit_ceiling_points is max_items times capacity_weight and the SENSITIVE weight is 2: the 10-item unit contributes 20, the 20-item unit contributes 40 and the 5-item unit contributes 10"
            - "the SENSITIVE weight of 2 means the 20-item unit and the 5-item unit alone contribute 50 of the 70 points"
            - "capacity_requirement_points == 81 under PROVISIONAL, because round_half_up(70 * 1.15) == round_half_up(80.5) == 81"
            - "capacity_requirement_points == 70 under ACCEPTED and == 95 under AT_RISK, because round_half_up(70 * 1.35) == round_half_up(94.5) == 95"
            - "capacity_feasible == false under PROVISIONAL because capacity_points 100 is below the 81 point requirement only after scaling, while the same engagement is feasible under ACCEPTED because 100 >= 70"
            - "projected_miss_deadline == true under PROVISIONAL and false under ACCEPTED, so the accuracy variant alone flips the verdict on an unchanged engagement"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: spec_unit_complete_reopen_cycle
        grounds:
          - state_machines.SpecUnit.ACTIVE_to_COMPLETE
          - state_machines.SpecUnit.COMPLETE_to_ACTIVE
          - state_machines.LabelingItem.ROUTED_to_COMPLETED
          - entities.SpecUnit.piece_status
        distinguishing_aspect: |
          A SpecUnit cycles COMPLETE to ACTIVE to COMPLETE on the same row, driven by its children
          returning to REWORK -- a genuine cycle rather than a forward-only pipeline, and the cycle
          belongs to the spec-unit entity rather than to the item entity.
        test_recipe:
          setup:
            - "Empty database, logical clock at the 2026-09-01T00:00:00Z default."
            - "An es-MX engagement with one published unit holding one released item, and one QUALIFIED es-MX worker at PROFICIENT."
          setup_api_calls:
            - call: "POST /api/workers"
              payload: { handle: "linh-tran" }
              as: Anonymous
              captures: { linh_id: "$.data.id" }
            - &prog_cycle
              call: "POST /api/programs"
              payload: { program_code: "AX-4410", name: "AX Panel", language_code: "es-MX", instruction_model: "IDEAL_RESPONSE", sensitivity_class: "STANDARD", deadline_utc: "2026-10-01T00:00:00Z", blackout_start_utc: "2026-09-20T00:00:00Z", blackout_end_utc: "2026-09-25T00:00:00Z", commitment_quorum: 1, min_consensus_agreement: 0.6 }
              as: PlatformAdmin
              captures: { prog_id: "$.data.id", prog_v: "$.data.version" }
            - call: "POST /api/spec-units"
              payload: { program_id: "${prog_id}", unit_code: "U-1", max_items: 10, instruction_revision: 1, instruction_status: "PUBLISHED", field_schema: ["label"], coverage_start_utc: "2026-09-01T00:00:00Z", coverage_end_utc: "2026-09-19T00:00:00Z", expected_program_version: "${prog_v}", panel_size: 2, gold_rate: 0.0 }
              as: PlatformAdmin
              captures: { u1_id: "$.data.id", u1_v: "$.data.version" }
            - call: "POST /api/programs/${prog_id}/program-state"
              payload: { program_action: "OPEN" }
              as: PlatformAdmin
            - call: "POST /api/workers/${linh_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "ENROLL" }
              as: PlatformAdmin
            - call: "POST /api/workers/${linh_id}/qualifications"
              payload: { language_code: "es-MX", tier: "PROFICIENT", qualification_action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /api/spec-units/${u1_id}/items"
              payload: { item_key: "i-0001", payload_uri: "s3://ax/0001", required_units: 1 }
              as: PlatformAdmin
              captures: { it1_id: "$.data.id" }
            - call: "POST /api/items/${it1_id}/dispatch-panel"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/items/${it1_id}/commits"
              payload: {}
              as: PlatformAdmin
              captures: { c1_id: "$.data[0].id" }
            - call: "POST /api/commits/${c1_id}/commit-label"
              payload: { payload: { label: "A" }, instructions_ack: true }
              as: Worker
              as_user_id: "${linh_id}"
            - call: "POST /api/commits/${c1_id}/payout-records"
              payload: { amount_cents: 8, currency: "USD" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/items/${it1_id}/reviewer-action"
              payload: { reviewer_action: "OPEN_REWORK" }
              as: PlatformReviewer
              captures: { it1_cycles: "$.data.rework_cycles", it1_consensus: "$.data.consensus_status" }
          assert:
            - "before the trigger the unit reached SpecUnit.status COMPLETE and piece_status CERTIFIED, because the single committed member met the quorum of 1 with an agreement ratio of 1.0"
            - "after the trigger LabelingItem.${it1_id}.consensus_status == REWORK and rework_cycles == 1"
            - "SpecUnit.${u1_id}.status == ACTIVE and piece_status == REWORK, and unit_effective_points is 10 * 1 for the STANDARD weight times the 1.0 multiplier because no rework multiplier applies to a STANDARD unit with no item counted as REWORK at that instant"
            - "reopening the cycle a second time is possible because rework_cycles 1 is strictly below the round limit of 3"
            - "a fourth OPEN_REWORK on the same piece is rejected with ERR_REWORK_ROUND_LIMIT at status 409"

      - name: appeal_claim_reviewer_to_reviewer_cycle
        grounds:
          - state_machines.AppealClaim.PROPOSED_to_ADJUDICATION
          - state_machines.AppealClaim.ADJUDICATION_to_PROPOSED
          - state_machines.AppealClaim.PROPOSED_to_CONCURRENCE
          - state_machines.WorkerQualification.QUALIFIED_to_PROBATION
        distinguishing_aspect: |
