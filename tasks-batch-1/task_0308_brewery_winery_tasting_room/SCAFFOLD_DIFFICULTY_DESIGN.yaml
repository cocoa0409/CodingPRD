  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pos_pay_refund_conserves_product_on_hand
        grounds:
          - state_machines.TastingOrder.OPEN_to_PAID
          - state_machines.TastingOrder.PAID_to_REFUNDED
          - entities.Product.fields.on_hand_bottles
        distinguishing_aspect: |
          Conserved quantity = Product.on_hand_bottles. PAY removes 3 bottles
          (on_hand 10 -> 7); REFUND restores exactly 3 (7 -> 10). The forward+
          compensating pair leaves on_hand_bottles unchanged at its pre-PAY value 10.
        test_recipe:
          setup:
            - "ACTIVE product with 10 on-hand bottles, list 5000c; an OPEN tasting order, age verified, one BOTTLE line qty 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wineries"
              payload: { name: "Inv Co", ttb_permit_number: "INV-1", home_state_code: "CA" }
              as: ComplianceOfficer
              captures: { w: $.data.id }
            - call: "POST /batches"
              payload: { winery_id: "${w}", lot_code: "L1", beverage_class: "WINE", volume_in_gallons: 100, abv_percent: 13.5 }
              as: CellarManager
              captures: { b: $.data.id }
            - call: "POST /products"
              payload: { winery_id: "${w}", source_batch_id: "${b}", sku: "S1", vintage_year: 2024, bottle_volume_ml: 750, list_price_cents: 5000 }
              as: CellarManager
              captures: { p: $.data.id, pv0: $.data.version }
            - call: "POST /batches/${b}/transitions"
              payload: { action: "BEGIN_AGING" }
              as: CellarManager
            - call: "POST /batches/${b}/transitions"
              payload: { action: "OPEN_BOTTLING" }
              as: CellarManager
            - call: "POST /batches/${b}/bottling-runs"
              payload: { product_id: "${p}", requested_bottles: 10 }
              as: CellarManager
            - call: "POST /products/${p}/transitions"
              payload: { action: "ACTIVATE", expected_product_version: "${pv0}" }
              as: CellarManager
            - call: "POST /tasting-orders"
              payload: { winery_id: "${w}", guest_age_verified: true, line_items: [ { product_id: "${p}", kind: "BOTTLE", quantity: 3 } ] }
              as: TastingRoomStaff
              captures: { o: $.data.id }
          trigger:
            - call: "POST /tasting-orders/${o}/transitions"
              payload: { action: "PAY" }
              as: TastingRoomStaff
            - call: "POST /tasting-orders/${o}/transitions"
              payload: { action: "REFUND" }
              as: TastingRoomStaff
          assert:
            - "After PAY: Product.${p}.on_hand_bottles == 7"
            - "After REFUND: Product.${p}.on_hand_bottles == 10 (conserved, equals pre-PAY value)"

      - name: release_reserve_cancel_conserves_pool_bottles
        grounds:
          - state_machines.Shipment.SCHEDULED_to_CANCELLED
          - entities.AllocationRelease.fields.reserved_bottles
          - entities.AllocationRelease.fields.available_bottles
        distinguishing_aspect: |
          A different conserved quantity = AllocationRelease pool invariant
          reserved+committed+available == pool_bottles. Scheduling reserves 6
          (reserved 6, available 0 of pool 6); CANCEL frees 6 (reserved 0, available 6).
          The pool sum stays exactly pool_bottles=6 across the forward+compensating pair.
        test_recipe:
          setup:
            - "OPEN release of pool 6; a SCHEDULED shipment of 6 bottles (reserved=6, available=0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ComplianceOfficer
