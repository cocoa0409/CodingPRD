      - name: loan_closure_voids_only_unsatisfied_installments
        claim_type: cascade_down
        grounds:
          - state_machines.Installment.SCHEDULED_to_VOIDED
          - entities.Installment.fields.void_reason
        excluded_because:
          difficulty_instance: program_cancellation_cascade_loan_payoff_device_unlock_carrier_port_eligible
          rationale: |
            That §1.8 instance already proves the cascade-down claim in full: after a
            cancellation at 12 paid installments it asserts installments 13 and 24 VOIDED with
            void_reason LOAN_CLOSED, installment 12 still PAID, and exactly 12 VOIDED rows via
            GET /loans/{id}/installments?status=VOIDED — i.e. the parent's terminal move
            reaches every non-terminal child and no terminal one. A separate corner would only
            re-run the same assertions on a smaller schedule.

      - name: reversal_undoes_every_side_effect_of_the_original_posting
        claim_type: compensation
        grounds:
          - state_machines.Installment.PAID_to_SCHEDULED
          - entities.PaymentPosting.fields.reverses_posting_id
        excluded_because:
          difficulty_instance: payment_reversal_restores_loan_obligation_balance
          rationale: |
            The compensation claim is the whole point of that §1.8 instance: it reverses a
            12-installment payment and asserts every mirror-image field (paid_principal 0,
            paid_premium 0, paid_installment_count 0, obligation back to 113876 with zero
            drift, installments 1 and 12 back to SCHEDULED with paid_at null, 24 SCHEDULED
            rows) plus ERR_POSTING_ALREADY_REVERSED on the repeat. Nothing is left for a
            breadth corner.

      - name: upgrade_transition_is_guarded_by_the_handsets_activation_state
        claim_type: guarded_transitions
        grounds:
          - state_machines.UpgradeRequest.None_to_ELIGIBILITY_PASSED
          - validations.priority_62_ERR_DEVICE_NOT_ACTIVATED
        excluded_because:
          difficulty_instance: upgrade_request_requires_device_unit_activated
          rationale: |
            The cross-entity guard "loan -> ELIGIBILITY_PASSED only if its DeviceUnit is
            ACTIVATED" is exactly that §1.8 instance: it drives an otherwise perfectly
            eligible loan (12 paid, window open, CURRENT) into ERR_DEVICE_NOT_ACTIVATED with
            the handset UNACTIVATED, then activates and repeats the identical call to a 201.
            Both arms of the guard are already covered.

