    roles: [PlatformAdmin, ProgramAdmin, ComplianceOfficer, LeaseManager, IntakeSpecialist]
    code: 200
    input: ["status?", "household_id?", "limit?", "offset?"]
    output: "WaitlistEntry[]"
    side_effects: []

  - method: GET
    path: "/programs/{id}/households/{householdId}/waitlist-entries"
