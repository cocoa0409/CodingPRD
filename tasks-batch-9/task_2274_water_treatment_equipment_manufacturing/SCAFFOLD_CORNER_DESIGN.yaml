  - section: calculations
    instances:
      - name: process_selection_stamps_the_ranked_lifecycle_winner
        claim_type: correct_result
        grounds:
          - calculations.process_train_selection
          - calculations.stage_design_flow
          - entities.TreatmentStage.fields.evaluated_cost_cents
        distinguishing_aspect: |
          One ACTIVE TURBIDITY_NTU objective maps to a single FILTRATION stage sized on peak flow
          4.000 * 1.500 == 6.000 mgd, and TECH-FILT-A evaluates to capex 240000000 plus 20 years of
          energy 20 * ceil(250.0 * 6.000 * 365 * 12) == 131400000 plus a zero footprint penalty
          (5400.0 sf is inside the 6000.0 sf allowance), so evaluated_cost_cents is 371400000 while
          equipment_base_cost_cents keeps only the capex term.
        test_recipe:
          setup:
            - 'catalog holds MAT-316L and exactly one ACTIVE FILTRATION technology TECH-FILT-A'
            - 'one Project with an ACCEPTED InfluentProfile (design_flow_mgd 4.000, peak_factor 1.500)'
            - 'one ACTIVE TURBIDITY_NTU objective at limit_value 0.300'
          setup_api_calls:
            - call: "POST /water-treatment/_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /water-treatment/material-specs"
              payload: { code: "MAT-316L", max_chloride_ppm: 200.0, max_temp_c: 80.0, max_pressure_psig: 300, ph_min: 4.0, ph_max: 11.0, asme_u_capable: true, nsf61_certified: true, awwa_compliant: true, cost_index: 1.10, service_classes_allowed: ["NEUTRAL", "CHLORINATED", "CAUSTIC"] }
