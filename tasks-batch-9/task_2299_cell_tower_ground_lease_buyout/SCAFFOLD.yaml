scaffold_meta:
  task_id: 2299
  domain_name: cell-tower-lease-buyout
  scenario_verbatim: >-
    2299. Cell Tower Ground Lease Buyout & Easement Aggregation (wireless infrastructure lease
    acquirer): lease stream valuation from rent, escalators, remaining term and carrier tenancy
    quality, landowner outreach with lump-sum versus prepaid rent proposals, title review,
    mortgage consent and easement drafting for perpetual or long-term rights, tower company right
    of first refusal and consent provisions, revenue-share on future amendments and colocations,
    closing with recorded easement and rent redirection notices to tenants, portfolio financing
    collateralization and servicing of acquired streams, landowner disputes over access,
    interference and property use
  api_prefix: /lease-buyouts
  difficulty_band: beyond_expert

api_prefix: /lease-buyouts

response_envelope:
  success_shape:
    success: true
    data: "<object|array>"
  error_shape:
    success: false
    error:
      error_id: "<ERR_CODE>"
      message: "<human readable>"
  list_shape:
    success: true
    data:
      items: "<array>"
      total_count: "<int>"
      has_more: "<bool>"
  pagination:
    limit_default: 20
    limit_max: 100
    offset_default: 0
  auth:
    header: X-Role
    user_header: X-User-ID
    missing_header_error: ERR_UNAUTHENTICATED
    unknown_role_error: ERR_UNAUTHENTICATED
    wrong_role_error: ERR_UNAUTHORIZED
  common_fields:
    - id
    - created_at
    - updated_at
    - version
  money_unit: integer_cents
  rate_unit: basis_points
  rounding_mode: ROUND_HALF_UP
  logical_clock:
    default_current_utc: "2026-08-01T00:00:00Z"
    set_endpoint: POST /lease-buyouts/_clock/set_current_utc

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: graph
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

entities:
  - name: Portfolio
    common_fields: true
    description: Capital pool that funds lease-stream acquisitions.
    fields:
      - { name: name, type: string, source: input, required: true }
      - { name: program_code, type: string, source: input, required: true, unique: true }
      - { name: total_capital_cents, type: integer, source: input, required: true, min: 0 }
      - { name: committed_capital_cents, type: integer, source: computed, description: "Sum of total_commitment_cents over Deals in capital_state RESERVED or ESCROWED" }
      - { name: deployed_capital_cents, type: integer, source: computed, description: "Sum of total_commitment_cents over Deals in capital_state DISBURSED" }
      - { name: available_capital_cents, type: integer, source: computed, description: "total_capital_cents - committed_capital_cents - deployed_capital_cents" }
      - { name: utilization_bps, type: integer, source: computed, description: "See calculation portfolio_capital_ledger" }
      - { name: capital_posture, type: enum, source: computed, values: [OPEN, CONSTRAINED, FROZEN] }
      - { name: active_deal_count, type: integer, source: computed, description: "Count of Deals not in stage CLOSED, DEAD, ROFR_LOST, TERMINATED" }

  - name: FinancingFacility
    common_fields: true
    description: Warehouse facility collateralized by acquired lease streams.
    fields:
      - { name: portfolio_id, type: uuid, source: input, required: true, description: "FK -> Portfolio.id" }
      - { name: facility_name, type: string, source: input, required: true }
      - { name: advance_rate_bps, type: integer, source: input, required: true, min: 1, max: 9500 }
      - { name: valuation_basis, type: enum, source: input, required: true, values: [MARK_TO_MODEL, COST_BASIS] }
      - { name: carrier_concentration_limit_bps, type: integer, source: input, default: 5000, min: 1, max: 10000 }
      - { name: pledged_eligible_total_cents, type: integer, source: computed, description: "Sum of eligible_value_cents over CollateralPledges in status PLEDGED" }
      - { name: concentration_excess_cents, type: integer, source: computed, description: "See calculation facility_borrowing_base" }
      - { name: borrowing_base_cents, type: integer, source: computed, description: "See calculation facility_borrowing_base" }
      - { name: advances_outstanding_cents, type: integer, source: computed, description: "Sum of accepted advance amounts" }
      - { name: compliance_state, type: enum, source: computed, values: [COMPLIANT, BORROWING_BASE_DEFICIT] }
      - { name: pledged_stream_count, type: integer, source: computed }

  - name: TowerCompany
    common_fields: true
    description: Tower operator that may hold right of first refusal and consent rights.
    fields:
      - { name: legal_name, type: string, source: input, required: true }
      - { name: rofr_required, type: boolean, source: input, default: false }
      - { name: rofr_window_days, type: integer, source: input, default: 30, min: 1, max: 90 }
      - { name: notice_email, type: string, source: input, required: true }
      - { name: site_count, type: integer, source: computed }

  - name: TowerSite
    common_fields: true
    description: Physical tower location sitting on leased ground.
    fields:
      - { name: tower_company_id, type: uuid, source: input, required: true, description: "FK -> TowerCompany.id" }
      - { name: site_code, type: string, source: input, required: true, unique: true }
      - { name: state_code, type: string, source: input, required: true }
      - { name: ground_area_sqft, type: integer, source: input, required: true, min: 1 }
      - { name: structure_type, type: enum, source: input, required: true, values: [MONOPOLE, LATTICE, GUYED, ROOFTOP] }
      - { name: lease_stream_count, type: integer, source: computed }

  - name: Landowner
    common_fields: true
    description: Fee owner of the ground under a tower site; counterparty to outreach.
    fields:
      - { name: legal_name, type: string, source: input, required: true }
      - { name: entity_type, type: enum, source: input, required: true, values: [INDIVIDUAL, LLC, TRUST, CORPORATION, MUNICIPALITY] }
      - { name: contact_email, type: string, source: input, required: true }
      - { name: outreach_status, type: enum, source: computed, values: [NEW, CONTACTED, NEGOTIATING, UNDER_CONTRACT, CLOSED, DO_NOT_CONTACT], description: "Computed from Offer/Deal progression; settable to DO_NOT_CONTACT via PATCH" }
      - { name: open_dispute_count, type: integer, source: computed }

  - name: LeaseStream
    common_fields: true
    description: Ground lease rent stream targeted for buyout.
    fields:
      - { name: tower_site_id, type: uuid, source: input, required: true, description: "FK -> TowerSite.id" }
      - { name: landowner_id, type: uuid, source: input, required: true, description: "FK -> Landowner.id" }
      - { name: current_annual_rent_cents, type: integer, source: input, required: true, min: 1 }
      - { name: escalator_type, type: enum, source: input, required: true, values: [NONE, FIXED_PCT, CPI_CAPPED] }
      - { name: escalator_pct_bps, type: integer, source: input, default: 0, min: 0, max: 1000 }
      - { name: remaining_term_months, type: integer, source: input, required: true, min: 1, max: 600 }
      - { name: rent_redirection_status, type: enum, source: computed, values: [NOT_APPLICABLE, PARTIAL, SENT] }
      - { name: tenancy_quality_score, type: integer, source: computed, description: "See calculation tenancy_quality_score" }
      - { name: anchor_carrier_name, type: string, source: computed, description: "carrier_name of the earliest-created CarrierTenancy with tenancy_type ANCHOR and status ACTIVE or HOLDOVER; UNASSIGNED when none" }
      - { name: acquisition_status, type: enum, source: computed, values: [PROSPECT, UNDER_OFFER, ACQUIRED, LOST] }
      - { name: servicing_status, type: enum, source: computed, values: [PERFORMING, WATCHLIST, IMPAIRED, DELINQUENT] }
      - { name: cumulative_revenue_share_landowner_cents, type: integer, source: computed }
      - { name: cumulative_revenue_share_acquirer_cents, type: integer, source: computed }
      - { name: active_tenancy_count, type: integer, source: computed }

  - name: CarrierTenancy
    common_fields: true
    description: Carrier occupancy on a tower site contributing rent share and credit quality.
    fields:
      - { name: lease_stream_id, type: uuid, source: input, required: true, description: "FK -> LeaseStream.id" }
      - { name: carrier_name, type: string, source: input, required: true }
      - { name: carrier_credit_tier, type: enum, source: input, required: true, values: [INVESTMENT_GRADE, CROSSOVER, SPECULATIVE] }
      - { name: tenancy_type, type: enum, source: input, required: true, values: [ANCHOR, COLOCATION] }
      - { name: monthly_rent_share_cents, type: integer, source: input, required: true, min: 0 }
      - { name: term_end_date, type: date, source: input, required: true }
      - { name: status, type: enum, source: computed, values: [ACTIVE, HOLDOVER, TERMINATED] }
      - { name: redirection_notice_status, type: enum, source: computed, values: [NOT_APPLICABLE, PENDING, SENT] }
      - { name: quality_points, type: integer, source: computed, description: "Per-tenancy contribution from calculation tenancy_quality_score" }

  - name: StreamValuation
    common_fields: true
    description: Model valuation of a lease stream under one consideration method.
    fields:
      - { name: lease_stream_id, type: uuid, source: input, required: true, description: "FK -> LeaseStream.id" }
      - { name: method, type: enum, source: input, required: true, values: [LUMP_SUM_PERPETUAL, PREPAID_RENT_TERM] }
      - { name: prepaid_term_months, type: integer, source: input, default: 120, min: 12, max: 600 }
      - { name: tenancy_quality_score_snapshot, type: integer, source: computed }
      - { name: discount_rate_bps, type: integer, source: computed }
      - { name: growth_rate_bps, type: integer, source: computed }
      - { name: horizon_years, type: integer, source: computed }
      - { name: value_cents, type: integer, source: computed, description: "See calculation stream_valuation_value" }
      - { name: max_bid_cents, type: integer, source: computed, description: "See calculation valuation_max_bid_ceiling" }
      - { name: status, type: enum, source: computed, values: [DRAFT, APPROVED, SUPERSEDED, STALE] }
      - { name: approved_by_user_id, type: string, source: computed, nullable: true }
      - { name: approved_at, type: datetime, source: computed, nullable: true }

  - name: Deal
    common_fields: true
    description: Buyout transaction pinning a portfolio, a lease stream and an approved valuation.
    fields:
      - { name: portfolio_id, type: uuid, source: input, required: true, description: "FK -> Portfolio.id" }
      - { name: lease_stream_id, type: uuid, source: input, required: true, description: "FK -> LeaseStream.id" }
      - { name: valuation_id, type: uuid, source: input, required: true, description: "FK -> StreamValuation.id; pinned at creation and never re-resolved" }
      - { name: easement_type, type: enum, source: input, required: true, values: [PERPETUAL_EASEMENT, LONG_TERM_EASEMENT] }
      - { name: easement_term_years, type: integer, source: input, default: 0, min: 0, max: 99 }
      - { name: revenue_share_bps, type: integer, source: input, default: 2500, min: 0, max: 5000 }
      - { name: stage, type: enum, source: computed, values: [ORIGINATION, OUTREACH, CAPITAL_HOLD, NEGOTIATION, DILIGENCE, CLEAR_TO_CLOSE, CLOSED, DEAD, ROFR_LOST, TERMINATED] }
      - { name: capital_state, type: enum, source: computed, values: [UNCOMMITTED, RESERVED, ESCROWED, DISBURSED, RELEASED] }
      - { name: rofr_state, type: enum, source: computed, values: [NOT_REQUIRED, PENDING, WAIVED, WAIVED_BY_LAPSE, EXERCISED] }
      - { name: negotiation_rounds, type: integer, source: computed }
      - { name: agreed_consideration_cents, type: integer, source: computed, nullable: true }
      - { name: broker_fee_bps, type: integer, source: computed }
      - { name: broker_fee_cents, type: integer, source: computed }
      - { name: holdback_cents, type: integer, source: computed }
      - { name: net_landowner_proceeds_cents, type: integer, source: computed }
      - { name: total_commitment_cents, type: integer, source: computed }
      - { name: escrow_funded_cents, type: integer, source: computed }
      - { name: escrow_disbursed_cents, type: integer, source: computed }
      - { name: escrow_holdback_cents, type: integer, source: computed }
      - { name: escrow_refunded_cents, type: integer, source: computed }
      - { name: easement_status, type: enum, source: computed, values: [NOT_DRAFTED, DRAFTED, RECORDED] }
      - { name: recording_ref, type: string, source: computed, nullable: true }
      - { name: recorded_at, type: datetime, source: computed, nullable: true }
      - { name: closed_by_user_id, type: string, source: computed, nullable: true }

  - name: Offer
    common_fields: true
    description: Lump-sum or prepaid-rent proposal made to a landowner within a deal.
    fields:
      - { name: deal_id, type: uuid, source: input, required: true, description: "FK -> Deal.id" }
      - { name: offer_type, type: enum, source: input, required: true, values: [LUMP_SUM, PREPAID_RENT] }
      - { name: amount_cents, type: integer, source: input, required: true, min: 1 }
      - { name: prepaid_term_months, type: integer, source: input, default: 0, min: 0, max: 600 }
      - { name: expires_at, type: datetime, source: input, required: true }
      - { name: round_number, type: integer, source: computed }
      - { name: counter_amount_cents, type: integer, source: computed, nullable: true }
      - { name: status, type: enum, source: computed, values: [DRAFT, SENT, COUNTERED, ACCEPTED, REJECTED, LAPSED, WITHDRAWN] }
      - { name: sent_at, type: datetime, source: computed, nullable: true }
      - { name: decided_at, type: datetime, source: computed, nullable: true }
      - { name: decided_by_user_id, type: string, source: computed, nullable: true }

  - name: TitleReport
    common_fields: true
    description: Title review plus the parallel mortgage-consent track for a deal.
    fields:
      - { name: deal_id, type: uuid, source: input, required: true, description: "FK -> Deal.id" }
      - { name: review_status, type: enum, source: computed, values: [ORDERED, EXCEPTIONS_FOUND, CLEARED, FAILED] }
      - { name: consent_status, type: enum, source: computed, values: [NOT_REQUIRED, PENDING_REQUEST, REQUESTED, GRANTED, DENIED, EXPIRED] }
      - { name: mortgage_present, type: boolean, source: computed, default: false }
      - { name: lender_name, type: string, source: computed, nullable: true }
      - { name: exception_count, type: integer, source: computed }
      - { name: open_exception_count, type: integer, source: computed }
      - { name: consent_requested_at, type: datetime, source: computed, nullable: true }
      - { name: consent_expires_at, type: datetime, source: computed, nullable: true }
      - { name: snda_required, type: boolean, source: input, default: false }
      - { name: consent_decided_by_user_id, type: string, source: computed, nullable: true }
      - { name: ordered_at, type: datetime, source: computed }

  - name: RofrNotice
    common_fields: true
    description: Right-of-first-refusal notice served on the tower company.
    fields:
      - { name: deal_id, type: uuid, source: input, required: true, description: "FK -> Deal.id" }
      - { name: served_at, type: datetime, source: computed }
      - { name: window_start, type: datetime, source: computed }
      - { name: window_end, type: datetime, source: computed, description: "window_start + rofr_window_days, exclusive" }
      - { name: window_days_snapshot, type: integer, source: computed }
      - { name: status, type: enum, source: computed, values: [SERVED, WAIVED, EXERCISED, EXPIRED] }
      - { name: responded_at, type: datetime, source: computed, nullable: true }
      - { name: responded_by_user_id, type: string, source: computed, nullable: true }

  - name: DisputeCase
    common_fields: true
    description: Landowner dispute over access, interference or property use.
    fields:
      - { name: lease_stream_id, type: uuid, source: input, required: true, description: "FK -> LeaseStream.id" }
      - { name: dispute_type, type: enum, source: input, required: true, values: [ACCESS, INTERFERENCE, PROPERTY_USE] }
      - { name: description, type: string, source: input, required: true }
      - { name: raised_by_role, type: string, source: system }
      - { name: status, type: enum, source: computed, values: [OPEN, CURE_PENDING, REOPENED, UPHELD, DISMISSED, RESOLVED] }
      - { name: cure_attempts, type: integer, source: computed }
      - { name: cure_deadline, type: datetime, source: computed, nullable: true }
      - { name: resolved_at, type: datetime, source: computed, nullable: true }

  - name: CollateralPledge
    common_fields: true
    description: Pledge of an acquired lease stream to a financing facility for a period.
    fields:
      - { name: facility_id, type: uuid, source: input, required: true, description: "FK -> FinancingFacility.id" }
      - { name: lease_stream_id, type: uuid, source: input, required: true, description: "FK -> LeaseStream.id" }
      - { name: pledge_start_date, type: date, source: input, required: true }
      - { name: pledge_end_date, type: date, source: input, required: true }
      - { name: valuation_basis_snapshot, type: enum, source: computed, values: [MARK_TO_MODEL, COST_BASIS] }
      - { name: basis_value_cents, type: integer, source: computed }
      - { name: haircut_bps, type: integer, source: computed }
      - { name: eligible_value_cents, type: integer, source: computed, description: "See calculation pledge_eligible_value" }
      - { name: status, type: enum, source: computed, values: [PLEDGED, INELIGIBLE, RELEASED] }

  - name: AmendmentEvent
    common_fields: true
    description: Post-closing colocation, amendment or rent increase subject to revenue share.
    fields:
      - { name: lease_stream_id, type: uuid, source: input, required: true, description: "FK -> LeaseStream.id" }
      - { name: event_type, type: enum, source: input, required: true, values: [COLOCATION_ADDED, AMENDMENT, RENT_INCREASE] }
      - { name: gross_amount_cents, type: integer, source: input, required: true, min: 1 }
      - { name: pass_through_cost_cents, type: integer, source: input, default: 0, min: 0 }
      - { name: effective_date, type: date, source: input, required: true }
      - { name: effective_pass_through_cents, type: integer, source: computed }
      - { name: net_amount_cents, type: integer, source: computed }
      - { name: share_bps_applied, type: integer, source: computed }
      - { name: landowner_share_cents, type: integer, source: computed }
      - { name: acquirer_share_cents, type: integer, source: computed }
      - { name: status, type: enum, source: computed, values: [RECORDED, REVERSED] }
      - { name: reversal_reason, type: string, source: computed, nullable: true }

state_machines:
  - entity: Offer
    field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED, LAPSED, WITHDRAWN]
    shape: cyclic
    transitions:
      - { from: DRAFT, to: SENT, trigger: SEND, actor_roles: [AcquisitionAnalyst], preconditions: ["Deal.stage in {OUTREACH, NEGOTIATION}", "Landowner.outreach_status != DO_NOT_CONTACT", "amount_cents <= StreamValuation.max_bid_cents of the deal's pinned valuation", "no other Offer on the deal in status SENT or COUNTERED"], side_effects: ["set sent_at = current_utc", "increment Deal.negotiation_rounds then set round_number = Deal.negotiation_rounds", "Deal.stage -> NEGOTIATION", "Landowner.outreach_status -> CONTACTED when NEW"] }
      - { from: SENT, to: COUNTERED, trigger: COUNTER, actor_roles: [Landowner], preconditions: ["caller is the deal's landowner", "current_utc < expires_at", "counter_amount_cents > 0"], side_effects: ["set counter_amount_cents", "Landowner.outreach_status -> NEGOTIATING"] }
      - { from: COUNTERED, to: SENT, trigger: REVISE, actor_roles: [AcquisitionAnalyst], preconditions: ["Deal.negotiation_rounds < MAX_NEGOTIATION_ROUNDS", "revised amount_cents <= StreamValuation.max_bid_cents"], side_effects: ["increment Deal.negotiation_rounds", "set round_number = Deal.negotiation_rounds", "set amount_cents to revised amount", "clear counter_amount_cents", "set sent_at = current_utc"] }
      - { from: SENT, to: ACCEPTED, trigger: ACCEPT, actor_roles: [Landowner], preconditions: ["caller is the deal's landowner", "current_utc < expires_at", "Portfolio.capital_posture != FROZEN", "Portfolio.available_capital_cents >= deal total_commitment_cents"], side_effects: ["set decided_at, decided_by_user_id", "Deal.agreed_consideration_cents = amount_cents", "recompute deal settlement statement", "Deal.capital_state -> RESERVED", "Deal.stage -> DILIGENCE", "Landowner.outreach_status -> UNDER_CONTRACT", "Portfolio committed/available/utilization/posture recomputed"] }
      - { from: SENT, to: REJECTED, trigger: REJECT, actor_roles: [Landowner], preconditions: ["caller is the deal's landowner"], side_effects: ["set decided_at, decided_by_user_id"] }
      - { from: COUNTERED, to: REJECTED, trigger: REJECT, actor_roles: [Landowner], preconditions: ["caller is the deal's landowner"], side_effects: ["set decided_at, decided_by_user_id"] }
      - { from: SENT, to: LAPSED, trigger: LAPSE, actor_roles: [system], preconditions: ["current_utc >= expires_at"], side_effects: ["lazily applied on read or on any transition attempt"] }
      - { from: SENT, to: WITHDRAWN, trigger: WITHDRAW, actor_roles: [AcquisitionAnalyst], preconditions: [], side_effects: ["set decided_at"] }
      - { from: COUNTERED, to: WITHDRAWN, trigger: WITHDRAW, actor_roles: [AcquisitionAnalyst], preconditions: [], side_effects: ["set decided_at"] }

  - entity: Deal
    field: stage
    initial_state: ORIGINATION
    terminal_states: [CLOSED, DEAD, ROFR_LOST, TERMINATED]
    shape: branching
    transitions:
      - { from: ORIGINATION, to: OUTREACH, trigger: START_OUTREACH, actor_roles: [AcquisitionAnalyst], preconditions: ["pinned StreamValuation.status == APPROVED", "Landowner.outreach_status != DO_NOT_CONTACT"], side_effects: ["LeaseStream.acquisition_status -> UNDER_OFFER"] }
      - { from: OUTREACH, to: CAPITAL_HOLD, trigger: CAPITAL_FREEZE, actor_roles: [system], preconditions: ["Portfolio.capital_posture == FROZEN"], side_effects: ["cascaded from portfolio_capital_ledger recomputation"] }
      - { from: CAPITAL_HOLD, to: OUTREACH, trigger: CAPITAL_RESUME, actor_roles: [system], preconditions: ["Portfolio.capital_posture != FROZEN"], side_effects: ["cascaded when portfolio capital frees up"] }
      - { from: OUTREACH, to: NEGOTIATION, trigger: OFFER_SENT, actor_roles: [AcquisitionAnalyst], preconditions: ["an Offer on the deal reached SENT"], side_effects: [] }
      - { from: NEGOTIATION, to: DILIGENCE, trigger: OFFER_ACCEPTED, actor_roles: [Landowner], preconditions: ["Offer.status == ACCEPTED"], side_effects: ["capital_state -> RESERVED", "Deal.rofr_state -> PENDING when TowerCompany.rofr_required else NOT_REQUIRED"] }
      - { from: DILIGENCE, to: CLEAR_TO_CLOSE, trigger: DILIGENCE_JOIN, actor_roles: [system], preconditions: ["TitleReport.review_status == CLEARED", "TitleReport.consent_status in {NOT_REQUIRED, GRANTED}", "rofr_state in {NOT_REQUIRED, WAIVED, WAIVED_BY_LAPSE}"], side_effects: ["easement_status -> DRAFTED"] }
      - { from: CLEAR_TO_CLOSE, to: DILIGENCE, trigger: DILIGENCE_REOPEN, actor_roles: [system], preconditions: ["a join condition regressed (consent EXPIRED or a new title exception recorded)"], side_effects: ["easement_status -> NOT_DRAFTED"] }
      - { from: CLEAR_TO_CLOSE, to: CLOSED, trigger: CLOSE, actor_roles: [PortfolioManager], preconditions: ["capital_state == ESCROWED", "no DisputeCase on the lease stream in status OPEN, CURE_PENDING or REOPENED", "closing user differs from pinned valuation approved_by_user_id"], side_effects: ["capital_state -> DISBURSED", "easement_status -> RECORDED with recording_ref and recorded_at", "LeaseStream.acquisition_status -> ACQUIRED", "LeaseStream.servicing_status -> PERFORMING", "all ACTIVE/HOLDOVER CarrierTenancy.redirection_notice_status -> SENT", "LeaseStream.rent_redirection_status -> SENT", "Landowner.outreach_status -> CLOSED", "Portfolio deployed/committed/available/utilization/posture recomputed"] }
      - { from: DILIGENCE, to: ROFR_LOST, trigger: ROFR_EXERCISED, actor_roles: [TowerCompanyAgent], preconditions: ["RofrNotice.status == EXERCISED"], side_effects: ["capital_state -> RELEASED", "LeaseStream.acquisition_status -> LOST", "Portfolio committed/available/utilization/posture recomputed"] }
      - { from: DILIGENCE, to: DEAD, trigger: TITLE_FAILED, actor_roles: [system], preconditions: ["TitleReport.review_status == FAILED or consent_status == DENIED"], side_effects: ["capital_state -> RELEASED", "LeaseStream.acquisition_status -> LOST", "Portfolio capital recomputed"] }
      - { from: NEGOTIATION, to: DEAD, trigger: OFFER_EXHAUSTED, actor_roles: [AcquisitionAnalyst], preconditions: ["negotiation_rounds == MAX_NEGOTIATION_ROUNDS and latest Offer terminal without acceptance"], side_effects: ["LeaseStream.acquisition_status -> PROSPECT"] }
      - { from: DILIGENCE, to: TERMINATED, trigger: TERMINATE, actor_roles: [PortfolioManager], preconditions: [], side_effects: ["capital_state -> RELEASED", "LeaseStream.acquisition_status -> PROSPECT", "Portfolio capital recomputed"] }
      - { from: CLEAR_TO_CLOSE, to: TERMINATED, trigger: TERMINATE, actor_roles: [PortfolioManager], preconditions: [], side_effects: ["capital_state -> RELEASED with escrow_refunded_cents = escrow_funded_cents", "LeaseStream.acquisition_status -> PROSPECT", "Portfolio capital recomputed"] }

  - entity: Deal
    field: capital_state
    initial_state: UNCOMMITTED
    terminal_states: [DISBURSED, RELEASED]
    shape: parallel
    transitions:
      - { from: UNCOMMITTED, to: RESERVED, trigger: RESERVE, actor_roles: [system], preconditions: ["Offer accepted", "Portfolio.available_capital_cents >= total_commitment_cents", "Portfolio.capital_posture != FROZEN"], side_effects: ["Portfolio.committed_capital_cents increased by total_commitment_cents"] }
      - { from: RESERVED, to: ESCROWED, trigger: FUND_ESCROW, actor_roles: [TreasuryOfficer], preconditions: ["stage == CLEAR_TO_CLOSE"], side_effects: ["escrow_funded_cents = total_commitment_cents"] }
      - { from: ESCROWED, to: DISBURSED, trigger: DISBURSE, actor_roles: [PortfolioManager], preconditions: ["stage transition CLOSE succeeded"], side_effects: ["escrow_disbursed_cents = net_landowner_proceeds_cents + broker_fee_cents", "escrow_holdback_cents = holdback_cents", "Portfolio.deployed_capital_cents increased and committed decreased"] }
      - { from: RESERVED, to: RELEASED, trigger: RELEASE, actor_roles: [system], preconditions: ["stage moved to ROFR_LOST, DEAD or TERMINATED"], side_effects: ["Portfolio.committed_capital_cents decreased by total_commitment_cents"] }
      - { from: ESCROWED, to: RELEASED, trigger: RELEASE, actor_roles: [system], preconditions: ["stage moved to TERMINATED"], side_effects: ["escrow_refunded_cents = escrow_funded_cents", "Portfolio.committed_capital_cents decreased"] }

  - entity: TitleReport
    field: review_status
    initial_state: ORDERED
    terminal_states: [CLEARED, FAILED]
    shape: cyclic
    transitions:
      - { from: ORDERED, to: EXCEPTIONS_FOUND, trigger: RECORD_FINDINGS, actor_roles: [TitleOfficer], preconditions: ["exception_count > 0"], side_effects: ["set exception_count and open_exception_count", "set mortgage_present and lender_name", "consent_status -> PENDING_REQUEST when mortgage_present"] }
      - { from: ORDERED, to: CLEARED, trigger: RECORD_FINDINGS, actor_roles: [TitleOfficer], preconditions: ["exception_count == 0"], side_effects: ["consent_status -> NOT_REQUIRED when not mortgage_present else PENDING_REQUEST", "evaluate Deal DILIGENCE_JOIN"] }
      - { from: EXCEPTIONS_FOUND, to: EXCEPTIONS_FOUND, trigger: CURE_EXCEPTION, actor_roles: [TitleOfficer], preconditions: ["open_exception_count > 1"], side_effects: ["decrement open_exception_count"] }
      - { from: EXCEPTIONS_FOUND, to: CLEARED, trigger: CURE_EXCEPTION, actor_roles: [TitleOfficer], preconditions: ["open_exception_count == 1"], side_effects: ["open_exception_count -> 0", "evaluate Deal DILIGENCE_JOIN"] }
      - { from: EXCEPTIONS_FOUND, to: FAILED, trigger: FAIL, actor_roles: [TitleOfficer], preconditions: [], side_effects: ["Deal.stage -> DEAD", "Deal.capital_state -> RELEASED"] }
      - { from: CLEARED, to: EXCEPTIONS_FOUND, trigger: RECORD_FINDINGS, actor_roles: [TitleOfficer], preconditions: ["Deal.stage != CLOSED", "exception_count > 0"], side_effects: ["Deal DILIGENCE_REOPEN when stage == CLEAR_TO_CLOSE"] }

  - entity: TitleReport
    field: consent_status
    initial_state: NOT_REQUIRED
    terminal_states: [GRANTED, DENIED]
    shape: parallel
    notes: "CONSENT_VALIDITY_DAYS = 21 (whole days added to consent_requested_at; the resulting consent_expires_at is exclusive)."
    transitions:
      - { from: NOT_REQUIRED, to: PENDING_REQUEST, trigger: MORTGAGE_DISCOVERED, actor_roles: [TitleOfficer], preconditions: ["mortgage_present becomes true"], side_effects: [] }
      - { from: PENDING_REQUEST, to: REQUESTED, trigger: REQUEST_CONSENT, actor_roles: [TitleOfficer], preconditions: ["mortgage_present == true"], side_effects: ["set consent_requested_at = current_utc", "set consent_expires_at = consent_requested_at + CONSENT_VALIDITY_DAYS"] }
      - { from: REQUESTED, to: GRANTED, trigger: GRANT, actor_roles: [Lender], preconditions: ["current_utc < consent_expires_at"], side_effects: ["set consent_decided_by_user_id", "evaluate Deal DILIGENCE_JOIN"] }
      - { from: REQUESTED, to: DENIED, trigger: DENY, actor_roles: [Lender], preconditions: ["current_utc < consent_expires_at"], side_effects: ["set consent_decided_by_user_id", "Deal.stage -> DEAD", "Deal.capital_state -> RELEASED"] }
      - { from: REQUESTED, to: EXPIRED, trigger: CONSENT_LAPSE, actor_roles: [system], preconditions: ["current_utc >= consent_expires_at"], side_effects: ["lazily applied on read or transition attempt"] }
      - { from: EXPIRED, to: REQUESTED, trigger: REQUEST_CONSENT, actor_roles: [TitleOfficer], preconditions: ["Deal.stage != CLOSED"], side_effects: ["reset consent_requested_at and consent_expires_at", "Deal DILIGENCE_REOPEN when stage == CLEAR_TO_CLOSE"] }
      - { from: DENIED, to: REQUESTED, trigger: REQUEST_CONSENT, actor_roles: [TitleOfficer], preconditions: ["Deal.stage != CLOSED and != DEAD"], side_effects: ["reset consent window"] }

  - entity: RofrNotice
    field: status
    initial_state: SERVED
    terminal_states: [WAIVED, EXERCISED, EXPIRED]
    shape: branching
    transitions:
      - { from: SERVED, to: WAIVED, trigger: WAIVE, actor_roles: [TowerCompanyAgent], preconditions: ["caller is the site's tower company", "window_start <= current_utc < window_end"], side_effects: ["set responded_at, responded_by_user_id", "Deal.rofr_state -> WAIVED", "evaluate Deal DILIGENCE_JOIN"] }
      - { from: SERVED, to: EXERCISED, trigger: EXERCISE, actor_roles: [TowerCompanyAgent], preconditions: ["caller is the site's tower company", "window_start <= current_utc < window_end"], side_effects: ["set responded_at, responded_by_user_id", "Deal.rofr_state -> EXERCISED", "Deal.stage -> ROFR_LOST"] }
      - { from: SERVED, to: EXPIRED, trigger: WINDOW_LAPSE, actor_roles: [system], preconditions: ["current_utc >= window_end"], side_effects: ["Deal.rofr_state -> WAIVED_BY_LAPSE", "evaluate Deal DILIGENCE_JOIN", "lazily applied on read or transition attempt"] }

  - entity: DisputeCase
    field: status
    initial_state: OPEN
    terminal_states: [UPHELD, DISMISSED, RESOLVED]
    shape: cyclic
    transitions:
      - { from: OPEN, to: CURE_PENDING, trigger: START_CURE, actor_roles: [ServicingAgent], preconditions: ["cure_attempts < MAX_CURE_ATTEMPTS"], side_effects: ["increment cure_attempts", "set cure_deadline = current_utc + 30 days", "LeaseStream.servicing_status -> WATCHLIST when PERFORMING"] }
      - { from: CURE_PENDING, to: RESOLVED, trigger: CONFIRM_CURE, actor_roles: [Landowner], preconditions: ["caller is the stream's landowner"], side_effects: ["set resolved_at", "LeaseStream.servicing_status -> PERFORMING when no other non-terminal dispute", "recompute Landowner.open_dispute_count"] }
      - { from: CURE_PENDING, to: REOPENED, trigger: REOPEN, actor_roles: [Landowner], preconditions: ["caller is the stream's landowner"], side_effects: ["LeaseStream.servicing_status stays WATCHLIST"] }
      - { from: REOPENED, to: CURE_PENDING, trigger: START_CURE, actor_roles: [ServicingAgent], preconditions: ["cure_attempts < MAX_CURE_ATTEMPTS"], side_effects: ["increment cure_attempts", "reset cure_deadline"] }
      - { from: REOPENED, to: UPHELD, trigger: UPHOLD, actor_roles: [PlatformAdmin], preconditions: [], side_effects: ["set resolved_at", "LeaseStream.servicing_status -> IMPAIRED", "CollateralPledges on the stream in PLEDGED -> INELIGIBLE with eligible_value_cents 0", "facility borrowing base and compliance_state recomputed"] }
      - { from: OPEN, to: UPHELD, trigger: UPHOLD, actor_roles: [PlatformAdmin], preconditions: [], side_effects: ["set resolved_at", "LeaseStream.servicing_status -> IMPAIRED", "pledge and facility cascade as above"] }
      - { from: OPEN, to: DISMISSED, trigger: DISMISS, actor_roles: [PlatformAdmin], preconditions: [], side_effects: ["set resolved_at", "recompute Landowner.open_dispute_count"] }
      - { from: REOPENED, to: DISMISSED, trigger: DISMISS, actor_roles: [PlatformAdmin], preconditions: [], side_effects: ["set resolved_at", "LeaseStream.servicing_status -> PERFORMING when no other non-terminal dispute"] }

  - entity: StreamValuation
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, STALE]
    shape: branching
    transitions:
      - { from: DRAFT, to: APPROVED, trigger: APPROVE, actor_roles: [PortfolioManager], preconditions: ["LeaseStream.active_tenancy_count >= 1", "tenancy_quality_score_snapshot equals current LeaseStream.tenancy_quality_score"], side_effects: ["set approved_by_user_id, approved_at", "prior APPROVED valuation on the same stream -> SUPERSEDED"] }
      - { from: APPROVED, to: SUPERSEDED, trigger: SUPERSEDE, actor_roles: [system], preconditions: ["a newer valuation on the same stream was approved"], side_effects: [] }
      - { from: DRAFT, to: STALE, trigger: INVALIDATE, actor_roles: [system], preconditions: ["LeaseStream.tenancy_quality_score changed after this valuation was computed"], side_effects: [] }
      - { from: APPROVED, to: STALE, trigger: INVALIDATE, actor_roles: [system], preconditions: ["LeaseStream.tenancy_quality_score changed after approval", "no Deal has pinned this valuation in stage CLOSED"], side_effects: ["Deals pinning this valuation cannot advance past ORIGINATION"] }

  - entity: CollateralPledge
    field: status
    initial_state: PLEDGED
    terminal_states: [RELEASED]
    shape: cyclic
    transitions:
      - { from: PLEDGED, to: INELIGIBLE, trigger: MARK_INELIGIBLE, actor_roles: [system], preconditions: ["LeaseStream.servicing_status == IMPAIRED or DELINQUENT"], side_effects: ["eligible_value_cents -> 0", "facility pledged_eligible_total_cents, borrowing_base_cents, compliance_state recomputed"] }
      - { from: INELIGIBLE, to: PLEDGED, trigger: RESTORE, actor_roles: [system], preconditions: ["LeaseStream.servicing_status back to PERFORMING or WATCHLIST"], side_effects: ["eligible_value_cents recomputed", "facility borrowing base recomputed"] }
      - { from: PLEDGED, to: RELEASED, trigger: RELEASE, actor_roles: [TreasuryOfficer], preconditions: ["facility.compliance_state == COMPLIANT after the release recomputation"], side_effects: ["facility pledged_eligible_total_cents and borrowing_base_cents recomputed", "pledged_stream_count decremented"] }
      - { from: INELIGIBLE, to: RELEASED, trigger: RELEASE, actor_roles: [TreasuryOfficer], preconditions: [], side_effects: ["facility recomputed"] }

  - entity: LeaseStream
    field: servicing_status
    initial_state: PERFORMING
    terminal_states: []
    shape: parallel
    transitions:
      - { from: PERFORMING, to: WATCHLIST, trigger: DISPUTE_CURE_STARTED, actor_roles: [system], preconditions: ["a DisputeCase entered CURE_PENDING"], side_effects: ["pledge eligible_value_cents recomputed with WATCHLIST haircut", "facility borrowing base recomputed"] }
      - { from: WATCHLIST, to: PERFORMING, trigger: DISPUTE_CLEARED, actor_roles: [system], preconditions: ["no DisputeCase on the stream in OPEN, CURE_PENDING or REOPENED"], side_effects: ["pledge eligible_value_cents recomputed at full basis"] }
      - { from: WATCHLIST, to: IMPAIRED, trigger: DISPUTE_UPHELD, actor_roles: [system], preconditions: ["a DisputeCase reached UPHELD"], side_effects: ["pledges -> INELIGIBLE"] }
      - { from: PERFORMING, to: IMPAIRED, trigger: DISPUTE_UPHELD, actor_roles: [system], preconditions: ["a DisputeCase reached UPHELD"], side_effects: ["pledges -> INELIGIBLE"] }
      - { from: PERFORMING, to: DELINQUENT, trigger: ANCHOR_TENANCY_TERMINATED, actor_roles: [system], preconditions: ["acquisition_status == ACQUIRED", "the ANCHOR tenancy moved to TERMINATED leaving no ACTIVE or HOLDOVER anchor"], side_effects: ["anchor_carrier_name -> UNASSIGNED", "pledges -> INELIGIBLE"] }
      - { from: WATCHLIST, to: DELINQUENT, trigger: ANCHOR_TENANCY_TERMINATED, actor_roles: [system], preconditions: ["acquisition_status == ACQUIRED", "no ACTIVE or HOLDOVER anchor remains"], side_effects: ["pledges -> INELIGIBLE"] }

  - entity: LeaseStream
    field: acquisition_status
    initial_state: PROSPECT
    terminal_states: []
    shape: cyclic
    transitions:
      - { from: PROSPECT, to: UNDER_OFFER, trigger: DEAL_OUTREACH_STARTED, actor_roles: [system], preconditions: ["a Deal on the stream reached OUTREACH"], side_effects: [] }
      - { from: UNDER_OFFER, to: ACQUIRED, trigger: DEAL_CLOSED, actor_roles: [system], preconditions: ["a Deal on the stream reached CLOSED"], side_effects: ["rent_redirection_status -> SENT", "servicing_status -> PERFORMING"] }
      - { from: UNDER_OFFER, to: LOST, trigger: DEAL_LOST, actor_roles: [system], preconditions: ["a Deal on the stream reached ROFR_LOST or DEAD via title failure or consent denial"], side_effects: [] }
      - { from: UNDER_OFFER, to: PROSPECT, trigger: DEAL_ABANDONED, actor_roles: [system], preconditions: ["a Deal on the stream reached TERMINATED or DEAD via offer exhaustion"], side_effects: [] }

  - entity: AmendmentEvent
    field: status
    initial_state: RECORDED
    terminal_states: [REVERSED]
    shape: linear
    transitions:
      - { from: RECORDED, to: REVERSED, trigger: REVERSE, actor_roles: [ServicingAgent], preconditions: ["reversal_reason present"], side_effects: ["LeaseStream.cumulative_revenue_share_landowner_cents decreased by landowner_share_cents", "LeaseStream.cumulative_revenue_share_acquirer_cents decreased by acquirer_share_cents"] }

concurrency_rules:
  - name: valuation-create-stale-stream
    parent_entity: LeaseStream
    child_entity: StreamValuation
    write_endpoint: POST /lease-buyouts/lease-streams/{id}/valuations
    occ_field: expected_lease_stream_version
    error_id: ERR_STALE_LEASE_STREAM_VERSION
    status: 412
    rationale: >-
      A valuation snapshots the stream's tenancy_quality_score and rent terms. Any write that
      changes those inputs (adding a tenancy, changing a tenancy status) bumps LeaseStream.version,
      so a valuation request carrying an older version was computed against inputs that no longer
      hold and is rejected rather than silently written against changed inputs.

  - name: pledge-create-stale-facility
    parent_entity: FinancingFacility
    child_entity: CollateralPledge
    write_endpoint: POST /lease-buyouts/financing-facilities/{id}/pledges
    occ_field: expected_facility_version
    error_id: ERR_STALE_FACILITY_VERSION
    status: 412
    rationale: >-
      Pledge admission depends on the facility's current borrowing base, concentration headroom and
      compliance_state, all of which change on every pledge, release or advance. A request pinned
      to an older facility version was decided against superseded headroom and is rejected.

calculations:
  - name: tenancy_quality_score
    entity: LeaseStream
    output_field: tenancy_quality_score
    algorithm_type: weighted_scoring
    input_set: "CarrierTenancy rows on the lease stream with status ACTIVE or HOLDOVER"
    constants:
      CREDIT_POINTS_INVESTMENT_GRADE: 40
      CREDIT_POINTS_CROSSOVER: 25
      CREDIT_POINTS_SPECULATIVE: 10
      TYPE_MULTIPLIER_ANCHOR: "1.00"
      TYPE_MULTIPLIER_COLOCATION: "0.60"
      HOLDOVER_PENALTY_POINTS: 5
      SCORE_MIN: 0
      SCORE_MAX: 100
    formula: |
      For each tenancy in the input set, in ascending created_at order:
        base = CREDIT_POINTS[carrier_credit_tier]
        raw  = base * TYPE_MULTIPLIER[tenancy_type]
        points = round(raw, 2 decimal places, ROUND_HALF_UP)
        if status == HOLDOVER: points = points - HOLDOVER_PENALTY_POINTS
        if points < 0: points = 0
        CarrierTenancy.quality_points = round(points, 0, ROUND_HALF_UP)
      total = sum of the per-tenancy rounded 2dp `points` values (NOT of quality_points)
      score = round(total, 0, ROUND_HALF_UP) clamped to [SCORE_MIN, SCORE_MAX]
      With an empty input set the score is 0.
    rounding: "per-tenancy 2dp then a single final 0dp rounding; the intermediate 2dp rounding is pinned and must not be skipped"
    worked_examples:
      - { inputs: "1x INVESTMENT_GRADE ANCHOR ACTIVE", output: 40 }
      - { inputs: "1x INVESTMENT_GRADE ANCHOR ACTIVE + 2x SPECULATIVE ANCHOR ACTIVE", output: 60 }
      - { inputs: "1x INVESTMENT_GRADE ANCHOR ACTIVE + 1x INVESTMENT_GRADE COLOCATION HOLDOVER", output: 59 }
      - { inputs: "2x INVESTMENT_GRADE ANCHOR ACTIVE + 1x INVESTMENT_GRADE COLOCATION ACTIVE", output: 100, note: "104 before clamping" }

  - name: stream_valuation_value
    entity: StreamValuation
    output_field: value_cents
    algorithm_type: forward_looking
    variants:
      - name: LUMP_SUM_PERPETUAL
      - name: PREPAID_RENT_TERM
    input_set: "the LeaseStream's rent, escalator and remaining term, plus its tenancy_quality_score at valuation time"
    constants:
      PERPETUAL_HORIZON_YEARS: 40
      RENEWAL_RISK_HAIRCUT_BPS: 2000
      TERM_RISK_PREMIUM_BPS: 150
      PREPAID_HAIRCUT_BPS: 500
      CPI_ASSUMED_BPS: 250
      DISCOUNT_TIER_SCORE_80_BPS: 700
      DISCOUNT_TIER_SCORE_60_BPS: 850
      DISCOUNT_TIER_SCORE_40_BPS: 1000
      DISCOUNT_TIER_BELOW_40_BPS: 1250
    formula: |
      score = LeaseStream.tenancy_quality_score, snapshotted into tenancy_quality_score_snapshot.
      Base discount tier (threshold ladder, evaluated top down):
        score >= 80 -> 700 bps; score >= 60 -> 850 bps; score >= 40 -> 1000 bps; else 1250 bps.
      growth_rate_bps by escalator_type:
        NONE       -> 0
        FIXED_PCT  -> escalator_pct_bps
        CPI_CAPPED -> min(escalator_pct_bps, CPI_ASSUMED_BPS)
      Variant LUMP_SUM_PERPETUAL:
        discount_rate_bps = base tier
        horizon_years     = PERPETUAL_HORIZON_YEARS (40)
        contracted_years  = floor(LeaseStream.remaining_term_months / 12)
        For y in 1..horizon_years:
          rent_y = current_annual_rent_cents * (1 + growth_rate_bps/10000)^(y-1)
          df_y   = 1 / (1 + discount_rate_bps/10000)^y
          pv_y   = rent_y * df_y
          if y > contracted_years: pv_y = pv_y * (1 - RENEWAL_RISK_HAIRCUT_BPS/10000)
          pv_y   = round(pv_y, 0, ROUND_HALF_UP)
        value_cents = sum of the rounded pv_y
      Variant PREPAID_RENT_TERM:
        effective_months  = min(prepaid_term_months, LeaseStream.remaining_term_months)
        horizon_years     = floor(effective_months / 12)
        discount_rate_bps = base tier + TERM_RISK_PREMIUM_BPS
        For y in 1..horizon_years: rent_y, df_y, pv_y as above with NO renewal haircut,
          pv_y = round(pv_y, 0, ROUND_HALF_UP)
        gross = sum of the rounded pv_y
        value_cents = round(gross * (1 - PREPAID_HAIRCUT_BPS/10000), 0, ROUND_HALF_UP)
      Rounding order is pinned: per-year rounding before summation, and the prepaid haircut applied
      after summation. Summing unrounded years or applying the haircut per year is divergent.
    rounding: "per-year 0dp ROUND_HALF_UP then sum; prepaid haircut applied once to the sum"
    worked_examples:
      - { inputs: "rent 3600000, FIXED_PCT 300 bps, 180 months, score 40, LUMP_SUM_PERPETUAL", output: 44627011 }
      - { inputs: "same stream, PREPAID_RENT_TERM prepaid_term_months 120", output: 22028616 }
      - { inputs: "same stream, PREPAID_RENT_TERM prepaid_term_months 240 (clamped to 180 -> 15 years)", output: 27987934 }
      - { inputs: "same stream but score 60, LUMP_SUM_PERPETUAL", output: 52919246 }
      - { inputs: "same stream but score 59, LUMP_SUM_PERPETUAL", output: 44627011, note: "tier boundary; delta vs score 60 is 8292235" }
      - { inputs: "rent 3600000, CPI_CAPPED 400 bps, 180 months, score 40, LUMP_SUM_PERPETUAL", output: 42393442, note: "growth capped to 250 bps" }
      - { inputs: "rent 3600000, FIXED_PCT 400 bps, 180 months, score 40, LUMP_SUM_PERPETUAL", output: 49734665 }

  - name: valuation_max_bid_ceiling
    entity: StreamValuation
    output_field: max_bid_cents
    algorithm_type: threshold
    constants:
      MAX_BID_BPS: 10500
    formula: "max_bid_cents = round(value_cents * MAX_BID_BPS / 10000, 0, ROUND_HALF_UP)"
    rounding: "0dp ROUND_HALF_UP"
    worked_examples:
      - { inputs: "value_cents 44627011", output: 46858362 }

  - name: deal_settlement_statement
    entity: Deal
    output_field: total_commitment_cents
    algorithm_type: tiered_pricing
    input_set: "the accepted Offer amount plus the count of non-terminal DisputeCases on the lease stream at acceptance time"
    constants:
      BROKER_TIER_HIGH_THRESHOLD_CENTS: 30000000
      BROKER_TIER_HIGH_BPS: 150
      BROKER_TIER_MID_THRESHOLD_CENTS: 10000000
      BROKER_TIER_MID_BPS: 200
      BROKER_TIER_LOW_BPS: 250
      HOLDBACK_BPS_PER_OPEN_DISPUTE: 250
      HOLDBACK_CAP_BPS: 1000
    formula: |
      gross = Deal.agreed_consideration_cents (the accepted Offer.amount_cents)
      Broker tier is keyed on GROSS, never on net:
        gross >= 30000000 -> 150 bps; gross >= 10000000 -> 200 bps; else 250 bps
      broker_fee_cents = round(gross * broker_fee_bps / 10000, 0, ROUND_HALF_UP)
      open_disputes = count of DisputeCase on the lease stream in OPEN, CURE_PENDING or REOPENED
      holdback_bps  = min(open_disputes * HOLDBACK_BPS_PER_OPEN_DISPUTE, HOLDBACK_CAP_BPS)
      holdback_cents = round(gross * holdback_bps / 10000, 0, ROUND_HALF_UP)
      net_landowner_proceeds_cents = gross - holdback_cents
      total_commitment_cents = gross + broker_fee_cents
      Order is pinned: tier selection on gross, then fee, then holdback, then net. Selecting the
      tier on (gross - holdback) is divergent.
    rounding: "0dp ROUND_HALF_UP per component"
    worked_examples:
      - { inputs: "gross 36000000, 0 open disputes", output: "broker_fee_bps 150, broker_fee_cents 540000, holdback 0, net 36000000, total_commitment 36540000" }
      - { inputs: "gross 36000000, 1 open dispute", output: "holdback 900000, net 35100000, total_commitment 36540000" }
      - { inputs: "gross 36000000, 5 open disputes", output: "holdback_bps capped at 1000 -> holdback 3600000, net 32400000" }
      - { inputs: "gross 36000000, 1 open dispute, tier keyed on net (divergent)", output: "broker_fee_cents would be 526500" }
      - { inputs: "gross 30000000, 0 disputes", output: "150 bps -> broker_fee_cents 450000" }
      - { inputs: "gross 29999999, 0 disputes", output: "200 bps -> broker_fee_cents 600000" }

  - name: portfolio_capital_ledger
    entity: Portfolio
    output_field: utilization_bps
    algorithm_type: aggregation
    input_set: "Deals on the portfolio, partitioned by capital_state"
    constants:
      POSTURE_FROZEN_THRESHOLD_BPS: 9000
      POSTURE_CONSTRAINED_THRESHOLD_BPS: 7500
    formula: |
      committed_capital_cents = sum(total_commitment_cents) over Deals with capital_state in {RESERVED, ESCROWED}
      deployed_capital_cents  = sum(total_commitment_cents) over Deals with capital_state == DISBURSED
      available_capital_cents = total_capital_cents - committed_capital_cents - deployed_capital_cents
      used = committed_capital_cents + deployed_capital_cents
      utilization_bps = 0 when total_capital_cents == 0
                        else round(used * 10000 / total_capital_cents, 0, ROUND_HALF_UP)
      capital_posture = FROZEN when utilization_bps >= 9000
                        else CONSTRAINED when utilization_bps >= 7500
                        else OPEN
      Invariant: available_capital_cents + committed_capital_cents + deployed_capital_cents
                 == total_capital_cents at all times.
    rounding: "0dp ROUND_HALF_UP"
    worked_examples:
      - { inputs: "total 50000000, committed 36540000, deployed 0", output: "available 13460000, utilization_bps 7308, posture OPEN" }
      - { inputs: "total 40600000, committed 36540000", output: "utilization_bps exactly 9000, posture FROZEN" }
      - { inputs: "total 40610000, committed 36540000", output: "utilization_bps 8998, posture CONSTRAINED" }
      - { inputs: "total 48720000, committed 36540000", output: "utilization_bps exactly 7500, posture CONSTRAINED" }

  - name: facility_borrowing_base
    entity: FinancingFacility
    output_field: borrowing_base_cents
    algorithm_type: threshold
    variants:
      - name: MARK_TO_MODEL
      - name: COST_BASIS
    input_set: "CollateralPledge rows on the facility with status PLEDGED"
    constants: {}
    formula: |
      Each pledge's basis_value_cents is set at pledge creation from the facility's valuation_basis
      snapshot (see pledge_eligible_value). The facility aggregates:
        pledged_eligible_total_cents = sum(eligible_value_cents) over PLEDGED pledges
      Carrier concentration test, keyed on each pledged stream's anchor_carrier_name:
        gross = pledged_eligible_total_cents
        limit_amount = round(gross * carrier_concentration_limit_bps / 10000, 0, ROUND_HALF_UP)
        for each anchor carrier: carrier_total = sum(eligible_value_cents) of its pledges
        concentration_excess_cents = sum over carriers of max(0, carrier_total - limit_amount)
        eligible_after_concentration = gross - concentration_excess_cents
      borrowing_base_cents = round(eligible_after_concentration * advance_rate_bps / 10000, 0, ROUND_HALF_UP)
      compliance_state = BORROWING_BASE_DEFICIT when advances_outstanding_cents > borrowing_base_cents
                         else COMPLIANT
      Variant divergence: MARK_TO_MODEL bases each pledge on the stream's APPROVED valuation
      value_cents; COST_BASIS bases it on the closed Deal's total_commitment_cents.
    rounding: "0dp ROUND_HALF_UP on limit_amount and on the advance-rate application"
    worked_examples:
      - { inputs: "advance_rate 6500, one PERFORMING pledge, MARK_TO_MODEL eligible 44627011", output: "borrowing_base_cents 29007557" }
      - { inputs: "advance_rate 6500, one PERFORMING pledge, COST_BASIS eligible 36540000", output: "borrowing_base_cents 23751000" }
      - { inputs: "advance_rate 6500, one WATCHLIST pledge, MARK_TO_MODEL eligible 31238908", output: "borrowing_base_cents 20305290" }
      - { inputs: "advance_rate 6500, one IMPAIRED pledge", output: "eligible 0, borrowing_base_cents 0" }
      - { inputs: "advance_rate 6500, two pledges of 44627011 with the same anchor carrier, limit 5000 bps", output: "limit_amount 44627011, concentration_excess_cents 0, borrowing_base_cents 58015114" }
      - { inputs: "same two pledges, limit 4999 bps", output: "limit_amount 44618086, concentration_excess_cents 17850, borrowing_base_cents 58003512" }

  - name: pledge_eligible_value
    entity: CollateralPledge
    output_field: eligible_value_cents
    algorithm_type: threshold
    input_set: "the pledged LeaseStream's servicing_status and the facility's valuation_basis"
    constants:
      HAIRCUT_PERFORMING_BPS: 0
      HAIRCUT_WATCHLIST_BPS: 3000
      HAIRCUT_DELINQUENT_BPS: 5000
      HAIRCUT_IMPAIRED_BPS: 10000
    formula: |
      valuation_basis_snapshot = facility.valuation_basis at pledge creation
      basis_value_cents = MARK_TO_MODEL -> the stream's APPROVED StreamValuation.value_cents
                          COST_BASIS    -> the closed Deal's total_commitment_cents for that stream
      haircut_bps by LeaseStream.servicing_status:
        PERFORMING 0, WATCHLIST 3000, DELINQUENT 5000, IMPAIRED 10000
      eligible_value_cents = 0 when status is INELIGIBLE or RELEASED or servicing_status == IMPAIRED
                             else round(basis_value_cents * (1 - haircut_bps/10000), 0, ROUND_HALF_UP)
    rounding: "0dp ROUND_HALF_UP"
    worked_examples:
      - { inputs: "basis 44627011, PERFORMING", output: 44627011 }
      - { inputs: "basis 44627011, WATCHLIST", output: 31238908 }
      - { inputs: "basis 44627011, IMPAIRED", output: 0 }

  - name: amendment_revenue_share_split
    entity: AmendmentEvent
    output_field: landowner_share_cents
    algorithm_type: waterfall_allocation
    variants:
      - name: COLOCATION_ADDED
      - name: AMENDMENT
      - name: RENT_INCREASE
    input_set: "the AmendmentEvent gross amount and the closed Deal's revenue_share_bps for the stream"
    constants:
      AMENDMENT_PASS_THROUGH_CAP_BPS: 2000
      RENT_INCREASE_SHARE_DIVISOR: 2
    formula: |
      share_bps_applied and effective_pass_through_cents by event_type:
        COLOCATION_ADDED: effective_pass_through_cents = 0
                          share_bps_applied = Deal.revenue_share_bps
        AMENDMENT:        cap = round(gross_amount_cents * AMENDMENT_PASS_THROUGH_CAP_BPS / 10000, 0, ROUND_HALF_UP)
                          effective_pass_through_cents = min(pass_through_cost_cents, cap)
                          share_bps_applied = Deal.revenue_share_bps
        RENT_INCREASE:    effective_pass_through_cents = 0
                          share_bps_applied = floor(Deal.revenue_share_bps / RENT_INCREASE_SHARE_DIVISOR)
      net_amount_cents = gross_amount_cents - effective_pass_through_cents
      landowner_share_cents = round(net_amount_cents * share_bps_applied / 10000, 0, ROUND_HALF_UP)
      acquirer_share_cents  = net_amount_cents - landowner_share_cents
      LeaseStream cumulative fields accumulate the per-event rounded shares. Rounding is per event,
      never on the summed gross: summing first and rounding once is divergent.
      Invariant: cumulative_revenue_share_landowner_cents + cumulative_revenue_share_acquirer_cents
                 == sum(net_amount_cents) over RECORDED AmendmentEvents on the stream.
    rounding: "0dp ROUND_HALF_UP per event"
    worked_examples:
      - { inputs: "COLOCATION_ADDED gross 1000002, share 2500 bps", output: "landowner 250001, acquirer 750001" }
      - { inputs: "two such events", output: "cumulative landowner 500002, acquirer 1500002; sum-then-round would give 500001" }
      - { inputs: "AMENDMENT gross 1000002, pass_through 500000, share 2500 bps", output: "cap 200000, effective_pass_through 200000, net 800002, landowner 200001, acquirer 600001" }
      - { inputs: "RENT_INCREASE gross 1000002, share 2500 bps", output: "share_bps_applied 1250, landowner 125000, acquirer 875002" }

  - name: rofr_window_bounds
    entity: RofrNotice
    output_field: window_end
    algorithm_type: chronological
    input_set: "the serving timestamp and the TowerCompany's rofr_window_days at serving time"
    constants: {}
    formula: |
      window_days_snapshot = TowerCompany.rofr_window_days at serving time (later changes to the
      tower company do not move an already-served window)
      window_start = served_at = current_utc
      window_end   = window_start + window_days_snapshot days
      The window is half-open [window_start, window_end): a response exactly at window_end is
      rejected as ERR_INVALID_ROFR_STATE after the lazy WINDOW_LAPSE, and a new notice whose
      window_start equals a prior notice's window_end is permitted (adjacency allowed).
    rounding: "n/a"
    worked_examples:
      - { inputs: "served_at 2026-08-01T00:00:00Z, rofr_window_days 30", output: "window_end 2026-08-31T00:00:00Z" }
      - { inputs: "response at 2026-08-30T23:59:59Z", output: "inside the window" }
      - { inputs: "response at 2026-08-31T00:00:00Z", output: "outside the window; notice lapses" }

  - name: pledge_period_conflict_check
    entity: CollateralPledge
    output_field: status
    algorithm_type: interval_merge
    input_set: "existing CollateralPledge rows on the same lease_stream_id with status PLEDGED or INELIGIBLE"
    constants: {}
    formula: |
      A lease stream may be pledged to at most one facility over any given day. Pledge periods are
      CLOSED intervals [pledge_start_date, pledge_end_date] and adjacency is forbidden: a candidate
      conflicts when candidate.pledge_start_date <= existing.pledge_end_date AND
      candidate.pledge_end_date >= existing.pledge_start_date. A candidate starting on the exact day
      an existing pledge ends conflicts (ERR_PLEDGE_PERIOD_OVERLAP); starting the following day does
      not. RELEASED pledges are excluded from the input set.
      This closed/adjacency-forbidden convention is deliberately the opposite of the half-open,
      adjacency-allowed convention used by rofr_window_bounds.
    rounding: "n/a"
    worked_examples:
      - { inputs: "existing 2026-08-01..2026-12-31, candidate 2026-12-31..2027-06-30", output: "conflict" }
      - { inputs: "existing 2026-08-01..2026-12-31, candidate 2027-01-01..2027-06-30", output: "accepted" }
      - { inputs: "existing RELEASED 2026-08-01..2026-12-31, candidate 2026-10-01..2027-06-30", output: "accepted" }

validations:
  - { priority: 1,  name: authenticated, category: auth, rule: "X-Role header present and a known role", error_id: ERR_UNAUTHENTICATED, status: 401 }
  - { priority: 2,  name: role_permitted, category: rbac, rule: "the caller's role appears in the endpoint's allowed roles", error_id: ERR_UNAUTHORIZED, status: 403 }
  - { priority: 3,  name: path_resource_exists, category: existence, rule: "every id in the path resolves; checked outermost path segment first", error_id: "ERR_<ENTITY>_NOT_FOUND", status: 404 }
  - { priority: 4,  name: body_fk_exists, category: existence, rule: "every FK in the request body resolves", error_id: "ERR_<ENTITY>_NOT_FOUND", status: 404 }
  - { priority: 5,  name: request_shape, category: schema, rule: "required fields present, types/enums/min/max satisfied, dates parseable", error_id: ERR_INVALID_REQUEST, status: 400 }
  - { priority: 6,  name: caller_is_deal_landowner, category: ownership, rule: "a Landowner caller acting on an Offer or DisputeCase must be the landowner of the underlying lease stream", error_id: ERR_NOT_DEAL_LANDOWNER, status: 403 }
  - { priority: 7,  name: caller_is_rofr_holder, category: ownership, rule: "a TowerCompanyAgent caller responding to a RofrNotice must be the tower company of the notice's tower site", error_id: ERR_NOT_ROFR_HOLDER, status: 403 }
  - { priority: 8,  name: action_role_mismatch, category: rbac, rule: "the requested action verb is not permitted for the caller's role on this endpoint (for example a TitleOfficer sending GRANT)", error_id: ERR_ACTION_ROLE_MISMATCH, status: 403 }
  - { priority: 9,  name: segregation_of_duties, category: rbac, rule: "the PortfolioManager closing a deal must not be the user who approved the deal's pinned valuation", error_id: ERR_SEGREGATION_OF_DUTIES, status: 403 }
  - { priority: 10, name: lease_stream_version_current, category: concurrency, rule: "expected_lease_stream_version equals LeaseStream.version", error_id: ERR_STALE_LEASE_STREAM_VERSION, status: 412 }
  - { priority: 11, name: facility_version_current, category: concurrency, rule: "expected_facility_version equals FinancingFacility.version", error_id: ERR_STALE_FACILITY_VERSION, status: 412 }
  - { priority: 12, name: offer_state_allows_action, category: state, rule: "the requested Offer action is declared from the offer's current status", error_id: ERR_INVALID_OFFER_STATE, status: 409 }
  - { priority: 13, name: offer_not_expired, category: state, rule: "current_utc < Offer.expires_at for COUNTER, ACCEPT and REJECT", error_id: ERR_OFFER_EXPIRED, status: 409 }
  - { priority: 14, name: deal_stage_allows_action, category: state, rule: "the deal's stage permits the requested operation", error_id: ERR_INVALID_DEAL_STAGE, status: 409 }
  - { priority: 15, name: capital_state_allows_action, category: state, rule: "the deal's capital_state permits the requested capital operation", error_id: ERR_INVALID_CAPITAL_STATE, status: 409 }
  - { priority: 16, name: title_state_allows_action, category: state, rule: "the requested title or consent action is declared from the current review_status / consent_status", error_id: ERR_INVALID_TITLE_STATE, status: 409 }
  - { priority: 17, name: dispute_state_allows_action, category: state, rule: "the requested dispute action is declared from the dispute's current status", error_id: ERR_INVALID_DISPUTE_STATE, status: 409 }
  - { priority: 18, name: rofr_state_allows_action, category: state, rule: "the notice is still SERVED and inside its window", error_id: ERR_INVALID_ROFR_STATE, status: 409 }
  - { priority: 19, name: pledge_state_allows_action, category: state, rule: "the pledge is not already RELEASED", error_id: ERR_INVALID_PLEDGE_STATE, status: 409 }
  - { priority: 20, name: amendment_state_allows_action, category: state, rule: "the amendment event is RECORDED before it can be reversed", error_id: ERR_INVALID_AMENDMENT_STATE, status: 409 }
  - { priority: 21, name: valuation_approved, category: state, rule: "a Deal's pinned valuation must be APPROVED to start outreach", error_id: ERR_VALUATION_NOT_APPROVED, status: 409 }
  - { priority: 22, name: valuation_not_stale, category: state, rule: "a Deal's pinned valuation must not be STALE or SUPERSEDED when advancing the deal", error_id: ERR_VALUATION_STALE, status: 409 }
  - { priority: 23, name: landowner_contactable, category: business_safety, rule: "no Offer may be sent to a Landowner whose outreach_status is DO_NOT_CONTACT", error_id: ERR_LANDOWNER_DO_NOT_CONTACT, status: 422 }
  - { priority: 24, name: rofr_window_closed_before_close, category: business_safety, rule: "a deal may not reach CLEAR_TO_CLOSE or close while rofr_state is PENDING; checked on POST /deals/{id}/clear-to-close and on close", error_id: ERR_ROFR_WINDOW_OPEN, status: 422 }
  - { priority: 25, name: no_open_dispute_at_close, category: business_safety, rule: "no DisputeCase on the lease stream may be OPEN, CURE_PENDING or REOPENED at close", error_id: ERR_OPEN_DISPUTE_BLOCKS_CLOSE, status: 422 }
  - { priority: 26, name: mortgage_consent_present, category: business_referential, rule: "when the title report has mortgage_present, consent_status must be GRANTED before clearance or close; checked on POST /deals/{id}/clear-to-close and on close", error_id: ERR_MORTGAGE_CONSENT_MISSING, status: 422 }
  - { priority: 27, name: title_exceptions_closed, category: business_referential, rule: "TitleReport.open_exception_count must be 0 before clearance or close; checked on POST /deals/{id}/clear-to-close and on close", error_id: ERR_TITLE_EXCEPTIONS_OPEN, status: 422 }
  - { priority: 28, name: consent_only_when_mortgaged, category: business_constraint, rule: "REQUEST_CONSENT and consent decisions require mortgage_present", error_id: ERR_MORTGAGE_CONSENT_NOT_REQUIRED, status: 422 }
  - { priority: 29, name: offer_type_matches_valuation_method, category: business_constraint, rule: "LUMP_SUM offers require a LUMP_SUM_PERPETUAL pinned valuation and PREPAID_RENT offers require PREPAID_RENT_TERM", error_id: ERR_VALUATION_METHOD_MISMATCH, status: 422 }
  - { priority: 30, name: stream_has_active_tenancy, category: business_constraint, rule: "a valuation cannot be approved for a stream with no ACTIVE or HOLDOVER tenancy", error_id: ERR_NO_ACTIVE_TENANCY, status: 422 }
  - { priority: 31, name: stream_acquired_for_servicing, category: business_constraint, rule: "pledges and amendment events require LeaseStream.acquisition_status == ACQUIRED", error_id: ERR_STREAM_NOT_ACQUIRED, status: 422 }
  - { priority: 32, name: no_duplicate_active_deal, category: business_constraint, rule: "at most one non-terminal Deal per lease stream", error_id: ERR_DUPLICATE_ACTIVE_DEAL, status: 422 }
  - { priority: 33, name: single_outstanding_offer, category: business_constraint, rule: "at most one Offer per deal in status SENT or COUNTERED", error_id: ERR_OFFER_ALREADY_OUTSTANDING, status: 422 }
  - { priority: 34, name: negotiation_rounds_available, category: business_constraint, rule: "Deal.negotiation_rounds < MAX_NEGOTIATION_ROUNDS (3) before REVISE", error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED, status: 422 }
  - { priority: 35, name: cure_attempts_available, category: business_constraint, rule: "DisputeCase.cure_attempts < MAX_CURE_ATTEMPTS (3) before START_CURE", error_id: ERR_CURE_ATTEMPTS_EXHAUSTED, status: 422 }
  - { priority: 36, name: no_duplicate_open_dispute, category: business_constraint, rule: "at most one non-terminal DisputeCase per lease stream and dispute_type", error_id: ERR_DISPUTE_ALREADY_OPEN, status: 422 }
  - { priority: 37, name: rofr_window_not_overlapping, category: business_temporal, rule: "a new RofrNotice may not be served while another notice on the deal is still inside its half-open window", error_id: ERR_ROFR_WINDOW_OVERLAP, status: 422 }
  - { priority: 38, name: pledge_period_not_overlapping, category: business_temporal, rule: "no two non-released pledges on the same lease stream may cover overlapping or adjacent closed date intervals", error_id: ERR_PLEDGE_PERIOD_OVERLAP, status: 422 }
  - { priority: 39, name: offer_within_guardrail, category: business_fiscal, rule: "Offer.amount_cents <= pinned StreamValuation.max_bid_cents", error_id: ERR_OFFER_EXCEEDS_GUARDRAIL, status: 422 }
  - { priority: 40, name: portfolio_not_frozen, category: business_fiscal, rule: "the portfolio's capital_posture must not be FROZEN when reserving capital", error_id: ERR_PORTFOLIO_CAPITAL_FROZEN, status: 422 }
  - { priority: 41, name: portfolio_capital_sufficient, category: business_fiscal, rule: "Portfolio.available_capital_cents >= Deal.total_commitment_cents at acceptance", error_id: ERR_INSUFFICIENT_PORTFOLIO_CAPITAL, status: 402 }
  - { priority: 42, name: withdrawal_within_available, category: business_fiscal, rule: "a negative capital adjustment may not exceed available_capital_cents", error_id: ERR_CAPITAL_WITHDRAWAL_EXCEEDS_AVAILABLE, status: 422 }
  - { priority: 43, name: facility_not_in_deficit, category: business_fiscal, rule: "a pledge release that would leave advances_outstanding_cents above the recomputed borrowing base is rejected", error_id: ERR_BORROWING_BASE_DEFICIT, status: 422 }
  - { priority: 44, name: advance_within_borrowing_base, category: business_fiscal, rule: "advances_outstanding_cents + requested amount <= borrowing_base_cents", error_id: ERR_ADVANCE_EXCEEDS_BORROWING_BASE, status: 402 }

endpoints:
  # --- Portfolio & capital -------------------------------------------------
  - method: POST
    path: /lease-buyouts/portfolios
    roles: [PlatformAdmin]
    input: [name, program_code, total_capital_cents]
    output: Portfolio
    status: 201
    side_effects: ["utilization_bps 0, capital_posture OPEN, all derived capital fields initialized"]
  - method: GET
    path: /lease-buyouts/portfolios
    roles: [PlatformAdmin, PortfolioManager, AcquisitionAnalyst, TreasuryOfficer]
    input: ["capital_posture?", "limit?", "offset?"]
    output: Portfolio[]
    status: 200
  - method: GET
    path: /lease-buyouts/portfolios/{id}
    roles: [PlatformAdmin, PortfolioManager, AcquisitionAnalyst, TreasuryOfficer]
    input: []
    output: Portfolio
    status: 200
  - method: POST
    path: /lease-buyouts/portfolios/{id}/capital-adjustments
    roles: [PlatformAdmin]
    input: [delta_cents, memo]
    output: Portfolio
    status: 200
    side_effects: ["total_capital_cents adjusted", "utilization_bps and capital_posture recomputed", "OUTREACH deals cascade to CAPITAL_HOLD when posture becomes FROZEN and back to OUTREACH when it leaves FROZEN"]

  # --- Financing facility & collateral ------------------------------------
  - method: POST
    path: /lease-buyouts/financing-facilities
    roles: [TreasuryOfficer]
    input: [portfolio_id, facility_name, advance_rate_bps, valuation_basis, "carrier_concentration_limit_bps?"]
    output: FinancingFacility
    status: 201
  - method: GET
    path: /lease-buyouts/financing-facilities/{id}
    roles: [TreasuryOfficer, PortfolioManager, PlatformAdmin]
    input: []
    output: FinancingFacility
    status: 200
  - method: GET
    path: /lease-buyouts/portfolios/{id}/financing-facilities
    roles: [TreasuryOfficer, PortfolioManager, PlatformAdmin]
    input: ["compliance_state?", "limit?", "offset?"]
    output: FinancingFacility[]
    status: 200
  - method: POST
    path: /lease-buyouts/financing-facilities/{id}/pledges
    roles: [TreasuryOfficer]
    input: [lease_stream_id, pledge_start_date, pledge_end_date, expected_facility_version]
    output: CollateralPledge
    status: 201
    side_effects: ["valuation_basis_snapshot, basis_value_cents, haircut_bps, eligible_value_cents computed", "facility pledged_eligible_total_cents, concentration_excess_cents, borrowing_base_cents, compliance_state, pledged_stream_count recomputed"]
  - method: POST
    path: /lease-buyouts/financing-facilities/{id}/advances
    roles: [TreasuryOfficer]
    input: [amount_cents]
    output: FinancingFacility
    status: 200
    side_effects: ["advances_outstanding_cents increased", "compliance_state re-evaluated"]
  - method: GET
    path: /lease-buyouts/collateral-pledges
    roles: [TreasuryOfficer, PortfolioManager, PlatformAdmin, ServicingAgent]
    input: ["facility_id?", "lease_stream_id?", "status?", "limit?", "offset?"]
    output: CollateralPledge[]
    status: 200
  - method: GET
    path: /lease-buyouts/collateral-pledges/{id}
    roles: [TreasuryOfficer, PortfolioManager, PlatformAdmin, ServicingAgent]
    input: []
    output: CollateralPledge
    status: 200
  - method: POST
    path: /lease-buyouts/collateral-pledges/{id}/release
    roles: [TreasuryOfficer]
    input: []
    output: CollateralPledge
    status: 200
    side_effects: ["status -> RELEASED with eligible_value_cents 0", "facility borrowing base and compliance_state recomputed"]

  # --- Tower companies & sites -------------------------------------------
  - method: POST
    path: /lease-buyouts/tower-companies
    roles: [PlatformAdmin, AcquisitionAnalyst]
    input: [legal_name, notice_email, "rofr_required?", "rofr_window_days?"]
    output: TowerCompany
    status: 201
  - method: POST
    path: /lease-buyouts/tower-sites
    roles: [AcquisitionAnalyst, PlatformAdmin]
    input: [tower_company_id, site_code, state_code, ground_area_sqft, structure_type]
    output: TowerSite
    status: 201
    side_effects: ["TowerCompany.site_count incremented"]
  - method: GET
    path: /lease-buyouts/tower-sites
    roles: [AcquisitionAnalyst, PlatformAdmin, PortfolioManager, TitleOfficer]
    input: ["tower_company_id?", "state_code?", "structure_type?", "limit?", "offset?"]
    output: TowerSite[]
    status: 200
  - method: GET
    path: /lease-buyouts/tower-sites/{id}
    roles: [AcquisitionAnalyst, PlatformAdmin, PortfolioManager, TitleOfficer]
    input: []
    output: TowerSite
    status: 200

  # --- Landowners ---------------------------------------------------------
  - method: POST
    path: /lease-buyouts/landowners
    roles: [AcquisitionAnalyst, PlatformAdmin]
    input: [legal_name, entity_type, contact_email]
    output: Landowner
    status: 201
    side_effects: ["outreach_status initialized to NEW"]
  - method: GET
    path: /lease-buyouts/landowners/{id}
    roles: [AcquisitionAnalyst, PlatformAdmin, PortfolioManager, ServicingAgent, Landowner]
    input: []
    output: Landowner
    status: 200
  - method: PATCH
    path: /lease-buyouts/landowners/{id}
    roles: [AcquisitionAnalyst, PlatformAdmin]
    input: ["contact_email?", "suppress_outreach?"]
    output: Landowner
    status: 200
    side_effects: ["suppress_outreach true sets outreach_status to DO_NOT_CONTACT; false restores the progression-derived value"]

  # --- Lease streams & tenancies -----------------------------------------
  - method: POST
    path: /lease-buyouts/lease-streams
    roles: [AcquisitionAnalyst, PlatformAdmin]
    input: [tower_site_id, landowner_id, current_annual_rent_cents, escalator_type, remaining_term_months, "escalator_pct_bps?"]
    output: LeaseStream
    status: 201
    side_effects: ["TowerSite.lease_stream_count incremented", "tenancy_quality_score 0, anchor_carrier_name UNASSIGNED, acquisition_status PROSPECT, servicing_status PERFORMING, rent_redirection_status NOT_APPLICABLE"]
  - method: GET
    path: /lease-buyouts/lease-streams
    roles: [AcquisitionAnalyst, PlatformAdmin, PortfolioManager, TreasuryOfficer, ServicingAgent]
    input: ["tower_site_id?", "landowner_id?", "acquisition_status?", "servicing_status?", "limit?", "offset?"]
    output: LeaseStream[]
    status: 200
  - method: GET
    path: /lease-buyouts/lease-streams/{id}
    roles: [AcquisitionAnalyst, PlatformAdmin, PortfolioManager, TreasuryOfficer, ServicingAgent, Landowner]
    input: []
    output: LeaseStream
    status: 200
  - method: POST
    path: /lease-buyouts/lease-streams/{id}/tenancies
    roles: [AcquisitionAnalyst, ServicingAgent]
    input: [carrier_name, carrier_credit_tier, tenancy_type, monthly_rent_share_cents, term_end_date]
    output: CarrierTenancy
    status: 201
    side_effects: ["quality_points computed", "LeaseStream.tenancy_quality_score, anchor_carrier_name, active_tenancy_count recomputed and LeaseStream.version bumped", "DRAFT and APPROVED valuations on the stream become STALE", "redirection_notice_status PENDING and LeaseStream.rent_redirection_status PARTIAL when the stream is already ACQUIRED"]
  - method: GET
    path: /lease-buyouts/lease-streams/{id}/tenancies
    roles: [AcquisitionAnalyst, PlatformAdmin, PortfolioManager, ServicingAgent]
    input: ["status?", "tenancy_type?", "limit?", "offset?"]
    output: CarrierTenancy[]
    status: 200
  - method: POST
    path: /lease-buyouts/carrier-tenancies/{id}/status
    roles: [ServicingAgent]
    input: [status]
    output: CarrierTenancy
    status: 200
    side_effects: ["LeaseStream.tenancy_quality_score, anchor_carrier_name, active_tenancy_count recomputed and version bumped", "valuations on the stream become STALE", "LeaseStream.servicing_status -> DELINQUENT when an ACQUIRED stream loses its last ACTIVE/HOLDOVER anchor", "pledges on the stream cascade to INELIGIBLE and the facility borrowing base is recomputed"]

  # --- Valuations ---------------------------------------------------------
  - method: POST
    path: /lease-buyouts/lease-streams/{id}/valuations
    roles: [AcquisitionAnalyst]
    input: [method, expected_lease_stream_version, "prepaid_term_months?"]
    output: StreamValuation
    status: 201
    side_effects: ["tenancy_quality_score_snapshot, discount_rate_bps, growth_rate_bps, horizon_years, value_cents, max_bid_cents computed", "status DRAFT"]
  - method: GET
    path: /lease-buyouts/lease-streams/{id}/valuations
    roles: [AcquisitionAnalyst, PortfolioManager, PlatformAdmin, TreasuryOfficer]
    input: ["status?", "method?", "limit?", "offset?"]
    output: StreamValuation[]
    status: 200
  - method: POST
    path: /lease-buyouts/stream-valuations/{id}/approve
    roles: [PortfolioManager]
    input: []
    output: StreamValuation
    status: 200
    side_effects: ["status -> APPROVED with approved_by_user_id and approved_at", "any previously APPROVED valuation on the stream -> SUPERSEDED"]

  # --- Deals --------------------------------------------------------------
  - method: POST
    path: /lease-buyouts/deals
    roles: [AcquisitionAnalyst]
    input: [portfolio_id, lease_stream_id, valuation_id, easement_type, "easement_term_years?", "revenue_share_bps?"]
    output: Deal
    status: 201
    side_effects: ["valuation pinned", "stage ORIGINATION, capital_state UNCOMMITTED, rofr_state NOT_REQUIRED or PENDING per the tower company", "Portfolio.active_deal_count incremented"]
  - method: GET
    path: /lease-buyouts/deals
    roles: [AcquisitionAnalyst, PortfolioManager, PlatformAdmin, TreasuryOfficer, TitleOfficer]
    input: ["portfolio_id?", "lease_stream_id?", "valuation_id?", "stage?", "capital_state?", "limit?", "offset?"]
    output: Deal[]
    status: 200
  - method: GET
    path: /lease-buyouts/deals/{id}
    roles: [AcquisitionAnalyst, PortfolioManager, PlatformAdmin, TreasuryOfficer, TitleOfficer, Lender, Landowner, TowerCompanyAgent]
    input: []
    output: Deal
    status: 200
  - method: POST
    path: /lease-buyouts/deals/{id}/outreach
    roles: [AcquisitionAnalyst]
    input: []
    output: Deal
    status: 200
    side_effects: ["stage -> OUTREACH", "LeaseStream.acquisition_status -> UNDER_OFFER"]
  - method: POST
    path: /lease-buyouts/deals/{id}/terminate
    roles: [PortfolioManager]
    input: [reason]
    output: Deal
    status: 200
    side_effects: ["stage -> TERMINATED", "capital_state -> RELEASED with escrow refunded", "LeaseStream.acquisition_status -> PROSPECT", "Portfolio capital ledger recomputed"]
  - method: GET
    path: /lease-buyouts/deals/{id}/settlement
    roles: [AcquisitionAnalyst, PortfolioManager, PlatformAdmin, TreasuryOfficer]
    input: []
    output: "{ deal_id: uuid, agreed_consideration_cents: integer, broker_fee_bps: integer, broker_fee_cents: integer, holdback_cents: integer, net_landowner_proceeds_cents: integer, total_commitment_cents: integer, escrow_funded_cents: integer, escrow_disbursed_cents: integer, escrow_holdback_cents: integer, escrow_refunded_cents: integer }"
    status: 200

  # --- Offers -------------------------------------------------------------
  - method: POST
    path: /lease-buyouts/deals/{id}/offers
    roles: [AcquisitionAnalyst]
    input: [offer_type, amount_cents, expires_at, "prepaid_term_months?"]
    output: Offer
    status: 201
    side_effects: ["status DRAFT, round_number 0"]
  - method: GET
    path: /lease-buyouts/deals/{id}/offers
    roles: [AcquisitionAnalyst, PortfolioManager, PlatformAdmin, Landowner]
    input: ["status?", "limit?", "offset?"]
    output: Offer[]
    status: 200
  - method: POST
    path: /lease-buyouts/offers/{id}/transitions
    roles: [AcquisitionAnalyst, Landowner]
    input: [action, "amount_cents?", "counter_amount_cents?"]
    output: Offer
    status: 200
    side_effects: ["action in {SEND, REVISE, WITHDRAW} for AcquisitionAnalyst and {COUNTER, ACCEPT, REJECT} for Landowner", "ACCEPT recomputes the deal settlement statement, reserves portfolio capital and advances the deal to DILIGENCE", "SEND advances the deal to NEGOTIATION and moves the landowner to CONTACTED"]

  # --- Title & mortgage consent ------------------------------------------
  - method: POST
    path: /lease-buyouts/deals/{id}/title-reports
    roles: [AcquisitionAnalyst, TitleOfficer]
    input: ["snda_required?"]
    output: TitleReport
    status: 201
    side_effects: ["review_status ORDERED, consent_status NOT_REQUIRED, ordered_at = current_utc"]
  - method: GET
    path: /lease-buyouts/deals/{id}/title-reports
    roles: [AcquisitionAnalyst, TitleOfficer, PortfolioManager, PlatformAdmin, Lender]
    input: ["review_status?", "consent_status?", "limit?", "offset?"]
    output: TitleReport[]
    status: 200
  - method: GET
    path: /lease-buyouts/title-reports/{id}
    roles: [AcquisitionAnalyst, TitleOfficer, PortfolioManager, PlatformAdmin, Lender]
    input: []
    output: TitleReport
    status: 200
  - method: POST
    path: /lease-buyouts/title-reports/{id}/transitions
    roles: [TitleOfficer]
    input: [action, "exception_count?", "mortgage_present?", "lender_name?"]
    output: TitleReport
    status: 200
    side_effects: ["action in {RECORD_FINDINGS, CURE_EXCEPTION, CLEAR, FAIL, REQUEST_CONSENT}", "RECORD_FINDINGS sets exception_count/open_exception_count and flips consent_status to PENDING_REQUEST when mortgage_present", "reaching CLEARED evaluates the deal DILIGENCE_JOIN", "FAIL kills the deal and releases capital"]
  - method: POST
    path: /lease-buyouts/title-reports/{id}/consent-decision
    roles: [Lender]
    input: [decision]
    output: TitleReport
    status: 200
    side_effects: ["decision GRANT sets consent_status GRANTED and evaluates the deal DILIGENCE_JOIN", "decision DENY sets DENIED, moves the deal to DEAD and releases capital"]

  # --- ROFR ---------------------------------------------------------------
  - method: POST
    path: /lease-buyouts/deals/{id}/rofr-notices
    roles: [AcquisitionAnalyst]
    input: []
    output: RofrNotice
    status: 201
    side_effects: ["window_days_snapshot taken from the tower company", "window_start = served_at = current_utc, window_end = window_start + window_days_snapshot days (exclusive)", "Deal.rofr_state -> PENDING"]
  - method: GET
    path: /lease-buyouts/deals/{id}/rofr-notices
    roles: [AcquisitionAnalyst, PortfolioManager, PlatformAdmin, TowerCompanyAgent]
    input: ["status?", "limit?", "offset?"]
    output: RofrNotice[]
    status: 200
  - method: POST
    path: /lease-buyouts/rofr-notices/{id}/response
    roles: [TowerCompanyAgent]
    input: [decision]
    output: RofrNotice
    status: 200
    side_effects: ["decision WAIVE sets Deal.rofr_state WAIVED and evaluates the DILIGENCE_JOIN", "decision EXERCISE sets EXERCISED, moves the deal to ROFR_LOST, releases capital and marks the stream LOST"]

  # --- Escrow & closing ---------------------------------------------------
  - method: POST
    path: /lease-buyouts/deals/{id}/clear-to-close
    roles: [PortfolioManager, AcquisitionAnalyst]
    input: []
    output: Deal
    status: 200
    side_effects: ["explicit operator-driven evaluation of the DILIGENCE_JOIN from stage DILIGENCE", "on success stage -> CLEAR_TO_CLOSE and easement_status -> DRAFTED", "on failure returns the specific blocking error (ERR_ROFR_WINDOW_OPEN, ERR_TITLE_EXCEPTIONS_OPEN or ERR_MORTGAGE_CONSENT_MISSING) so a blocked deal is diagnosable", "the join is also evaluated automatically as a side effect of title clearance, consent grant and ROFR resolution"]
  - method: POST
    path: /lease-buyouts/deals/{id}/escrow-funding
    roles: [TreasuryOfficer]
    input: []
    output: Deal
    status: 200
    side_effects: ["capital_state -> ESCROWED with escrow_funded_cents = total_commitment_cents"]
  - method: POST
    path: /lease-buyouts/deals/{id}/close
    roles: [PortfolioManager]
    input: [recording_ref]
    output: Deal
    status: 200
    side_effects: ["stage -> CLOSED, capital_state -> DISBURSED, easement_status -> RECORDED", "escrow disbursed/holdback split applied", "LeaseStream.acquisition_status -> ACQUIRED and rent_redirection_status -> SENT", "every ACTIVE/HOLDOVER tenancy redirection_notice_status -> SENT", "Landowner.outreach_status -> CLOSED", "Portfolio deployed/committed/available/utilization/posture recomputed"]

  # --- Disputes -----------------------------------------------------------
  - method: POST
    path: /lease-buyouts/lease-streams/{id}/disputes
    roles: [Landowner, ServicingAgent, PlatformAdmin]
    input: [dispute_type, description]
    output: DisputeCase
    status: 201
    side_effects: ["status OPEN, cure_attempts 0", "Landowner.open_dispute_count incremented", "deal settlement holdback recomputed when the stream's deal has not yet closed"]
  - method: GET
    path: /lease-buyouts/lease-streams/{id}/disputes
    roles: [Landowner, ServicingAgent, PlatformAdmin, PortfolioManager]
    input: ["status?", "dispute_type?", "limit?", "offset?"]
    output: DisputeCase[]
    status: 200
  - method: GET
    path: /lease-buyouts/disputes/{id}
    roles: [Landowner, ServicingAgent, PlatformAdmin, PortfolioManager]
    input: []
    output: DisputeCase
    status: 200
  - method: POST
    path: /lease-buyouts/disputes/{id}/transitions
    roles: [ServicingAgent, Landowner, PlatformAdmin]
    input: [action]
    output: DisputeCase
    status: 200
    side_effects: ["action START_CURE for ServicingAgent, CONFIRM_CURE and REOPEN for Landowner, UPHOLD and DISMISS for PlatformAdmin", "START_CURE moves the stream to WATCHLIST and re-haircuts its pledges", "UPHOLD moves the stream to IMPAIRED, makes its pledges INELIGIBLE and recomputes the facility borrowing base and compliance_state"]

  # --- Amendment events & revenue share ----------------------------------
  - method: POST
    path: /lease-buyouts/lease-streams/{id}/amendment-events
    roles: [ServicingAgent]
    input: [event_type, gross_amount_cents, effective_date, "pass_through_cost_cents?"]
    output: AmendmentEvent
    status: 201
    side_effects: ["effective_pass_through_cents, net_amount_cents, share_bps_applied, landowner_share_cents, acquirer_share_cents computed", "LeaseStream cumulative revenue-share fields increased by the per-event rounded shares"]
  - method: GET
    path: /lease-buyouts/lease-streams/{id}/amendment-events
    roles: [ServicingAgent, PortfolioManager, PlatformAdmin, Landowner]
    input: ["event_type?", "status?", "limit?", "offset?"]
    output: AmendmentEvent[]
    status: 200
  - method: POST
    path: /lease-buyouts/amendment-events/{id}/reverse
    roles: [ServicingAgent]
    input: [reversal_reason]
    output: AmendmentEvent
    status: 200
    side_effects: ["status -> REVERSED", "LeaseStream cumulative revenue-share fields decreased by this event's shares"]

  # --- Test-driving clock -------------------------------------------------
  - method: POST
    path: /lease-buyouts/_clock/set_current_utc
    roles: [PlatformAdmin]
    input: [current_utc]
    output: "{ current_utc: datetime }"
    status: 200
    side_effects: ["sets the logical clock used by expiries, ROFR windows, consent validity and cure deadlines; default is 2026-08-01T00:00:00Z"]

errors:
  # auth / rbac
  - { error_id: ERR_UNAUTHENTICATED, status: 401, category: auth, message: "Missing or unknown X-Role header." }
  - { error_id: ERR_UNAUTHORIZED, status: 403, category: rbac, message: "Role not permitted for this endpoint." }
  - { error_id: ERR_ACTION_ROLE_MISMATCH, status: 403, category: rbac, message: "Action not permitted for the caller's role." }
  - { error_id: ERR_SEGREGATION_OF_DUTIES, status: 403, category: rbac, message: "The closing manager may not be the valuation approver." }
  - { error_id: ERR_NOT_DEAL_LANDOWNER, status: 403, category: ownership, message: "Caller is not the landowner of this lease stream." }
  - { error_id: ERR_NOT_ROFR_HOLDER, status: 403, category: ownership, message: "Caller is not the tower company holding this right of first refusal." }
  # schema
  - { error_id: ERR_INVALID_REQUEST, status: 400, category: schema, message: "Request body failed validation." }
  # existence
  - { error_id: ERR_PORTFOLIO_NOT_FOUND, status: 404, category: existence, message: "Portfolio not found." }
  - { error_id: ERR_FACILITY_NOT_FOUND, status: 404, category: existence, message: "Financing facility not found." }
  - { error_id: ERR_TOWER_COMPANY_NOT_FOUND, status: 404, category: existence, message: "Tower company not found." }
  - { error_id: ERR_TOWER_SITE_NOT_FOUND, status: 404, category: existence, message: "Tower site not found." }
  - { error_id: ERR_LANDOWNER_NOT_FOUND, status: 404, category: existence, message: "Landowner not found." }
  - { error_id: ERR_LEASE_STREAM_NOT_FOUND, status: 404, category: existence, message: "Lease stream not found." }
  - { error_id: ERR_TENANCY_NOT_FOUND, status: 404, category: existence, message: "Carrier tenancy not found." }
  - { error_id: ERR_VALUATION_NOT_FOUND, status: 404, category: existence, message: "Stream valuation not found." }
  - { error_id: ERR_DEAL_NOT_FOUND, status: 404, category: existence, message: "Deal not found." }
  - { error_id: ERR_OFFER_NOT_FOUND, status: 404, category: existence, message: "Offer not found." }
  - { error_id: ERR_TITLE_REPORT_NOT_FOUND, status: 404, category: existence, message: "Title report not found." }
  - { error_id: ERR_ROFR_NOTICE_NOT_FOUND, status: 404, category: existence, message: "ROFR notice not found." }
  - { error_id: ERR_DISPUTE_NOT_FOUND, status: 404, category: existence, message: "Dispute case not found." }
  - { error_id: ERR_PLEDGE_NOT_FOUND, status: 404, category: existence, message: "Collateral pledge not found." }
  - { error_id: ERR_AMENDMENT_NOT_FOUND, status: 404, category: existence, message: "Amendment event not found." }
  # concurrency
  - { error_id: ERR_STALE_LEASE_STREAM_VERSION, status: 412, category: concurrency, message: "expected_lease_stream_version does not match the lease stream's current version." }
  - { error_id: ERR_STALE_FACILITY_VERSION, status: 412, category: concurrency, message: "expected_facility_version does not match the facility's current version." }
  # state
  - { error_id: ERR_INVALID_OFFER_STATE, status: 409, category: state, message: "Offer is not in a state that allows this action." }
  - { error_id: ERR_OFFER_EXPIRED, status: 409, category: state, message: "Offer has expired." }
  - { error_id: ERR_INVALID_DEAL_STAGE, status: 409, category: state, message: "Deal stage does not allow this operation." }
  - { error_id: ERR_INVALID_CAPITAL_STATE, status: 409, category: state, message: "Deal capital state does not allow this operation." }
  - { error_id: ERR_INVALID_TITLE_STATE, status: 409, category: state, message: "Title report is not in a state that allows this action." }
  - { error_id: ERR_INVALID_DISPUTE_STATE, status: 409, category: state, message: "Dispute case is not in a state that allows this action." }
  - { error_id: ERR_INVALID_ROFR_STATE, status: 409, category: state, message: "ROFR notice is not open for a response." }
  - { error_id: ERR_INVALID_PLEDGE_STATE, status: 409, category: state, message: "Collateral pledge is not in a state that allows this action." }
  - { error_id: ERR_INVALID_AMENDMENT_STATE, status: 409, category: state, message: "Amendment event is not in a state that allows this action." }
  - { error_id: ERR_VALUATION_NOT_APPROVED, status: 409, category: state, message: "The pinned valuation is not approved." }
  - { error_id: ERR_VALUATION_STALE, status: 409, category: state, message: "The pinned valuation is stale or superseded." }
  # business safety / referential
  - { error_id: ERR_LANDOWNER_DO_NOT_CONTACT, status: 422, category: business_safety, message: "Landowner has been marked do-not-contact." }
  - { error_id: ERR_ROFR_WINDOW_OPEN, status: 422, category: business_safety, message: "The right-of-first-refusal window is still open." }
  - { error_id: ERR_OPEN_DISPUTE_BLOCKS_CLOSE, status: 422, category: business_safety, message: "An unresolved landowner dispute blocks closing." }
  - { error_id: ERR_MORTGAGE_CONSENT_MISSING, status: 422, category: business_referential, message: "Mortgagee consent has not been granted." }
  - { error_id: ERR_TITLE_EXCEPTIONS_OPEN, status: 422, category: business_referential, message: "Title exceptions remain open." }
  # business constraints
  - { error_id: ERR_MORTGAGE_CONSENT_NOT_REQUIRED, status: 422, category: business_constraint, message: "No mortgage is of record; consent is not applicable." }
  - { error_id: ERR_VALUATION_METHOD_MISMATCH, status: 422, category: business_constraint, message: "Offer type does not match the pinned valuation method." }
  - { error_id: ERR_NO_ACTIVE_TENANCY, status: 422, category: business_constraint, message: "The lease stream has no active carrier tenancy." }
  - { error_id: ERR_STREAM_NOT_ACQUIRED, status: 422, category: business_constraint, message: "The lease stream has not been acquired." }
  - { error_id: ERR_DUPLICATE_ACTIVE_DEAL, status: 422, category: business_constraint, message: "Another active deal already exists for this lease stream." }
  - { error_id: ERR_OFFER_ALREADY_OUTSTANDING, status: 422, category: business_constraint, message: "An offer is already outstanding on this deal." }
  - { error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED, status: 422, category: business_constraint, message: "The maximum number of negotiation rounds has been used." }
  - { error_id: ERR_CURE_ATTEMPTS_EXHAUSTED, status: 422, category: business_constraint, message: "The maximum number of cure attempts has been used." }
  - { error_id: ERR_DISPUTE_ALREADY_OPEN, status: 422, category: business_constraint, message: "An unresolved dispute of this type already exists for the lease stream." }
  # temporal
  - { error_id: ERR_ROFR_WINDOW_OVERLAP, status: 422, category: business_temporal, message: "Another ROFR notice window is still running on this deal." }
  - { error_id: ERR_PLEDGE_PERIOD_OVERLAP, status: 422, category: business_temporal, message: "Pledge period overlaps or abuts an existing pledge on this lease stream." }
  # fiscal
  - { error_id: ERR_OFFER_EXCEEDS_GUARDRAIL, status: 422, category: business_fiscal, message: "Offer amount exceeds the valuation's maximum bid." }
  - { error_id: ERR_PORTFOLIO_CAPITAL_FROZEN, status: 422, category: business_fiscal, message: "Portfolio capital posture is frozen." }
  - { error_id: ERR_INSUFFICIENT_PORTFOLIO_CAPITAL, status: 402, category: business_fiscal, message: "Portfolio available capital is insufficient for this commitment." }
  - { error_id: ERR_CAPITAL_WITHDRAWAL_EXCEEDS_AVAILABLE, status: 422, category: business_fiscal, message: "Capital withdrawal exceeds available capital." }
  - { error_id: ERR_BORROWING_BASE_DEFICIT, status: 422, category: business_fiscal, message: "The release would leave advances above the borrowing base." }
  - { error_id: ERR_ADVANCE_EXCEEDS_BORROWING_BASE, status: 402, category: business_fiscal, message: "Requested advance exceeds the facility borrowing base." }

rbac:
  role_model: segregation_of_duties
  user_header_semantics: >-
    X-User-ID identifies the acting principal. For entity-backed roles it must equal the backing
    entity's id (Landowner.id for Landowner, TowerCompany.id for TowerCompanyAgent). For
    PortfolioManager it is an opaque user string used by the segregation-of-duties check between
    valuation approval and deal closing.
  roles:
    - name: PlatformAdmin
      identity: opaque
      exclusive_operations:
        - POST /lease-buyouts/portfolios
        - POST /lease-buyouts/portfolios/{id}/capital-adjustments
        - POST /lease-buyouts/_clock/set_current_utc
        - "POST /lease-buyouts/disputes/{id}/transitions with action UPHOLD or DISMISS"
      shared_operations:
        - GET reads across all collections
        - POST /lease-buyouts/tower-companies
        - POST /lease-buyouts/tower-sites
        - POST /lease-buyouts/landowners
        - PATCH /lease-buyouts/landowners/{id}
        - POST /lease-buyouts/lease-streams
        - POST /lease-buyouts/lease-streams/{id}/disputes
    - name: AcquisitionAnalyst
      identity: opaque
      exclusive_operations:
        - POST /lease-buyouts/lease-streams/{id}/valuations
        - POST /lease-buyouts/deals
        - POST /lease-buyouts/deals/{id}/outreach
        - POST /lease-buyouts/deals/{id}/offers
        - POST /lease-buyouts/deals/{id}/rofr-notices
        - "POST /lease-buyouts/offers/{id}/transitions with action SEND, REVISE or WITHDRAW"
      shared_operations:
        - POST /lease-buyouts/tower-companies
        - POST /lease-buyouts/tower-sites
        - POST /lease-buyouts/landowners
        - PATCH /lease-buyouts/landowners/{id}
        - POST /lease-buyouts/lease-streams
        - POST /lease-buyouts/lease-streams/{id}/tenancies
        - POST /lease-buyouts/deals/{id}/title-reports
        - POST /lease-buyouts/deals/{id}/clear-to-close
        - GET reads on portfolios, streams, deals, offers, valuations, title reports
    - name: PortfolioManager
      identity: opaque
      exclusive_operations:
        - POST /lease-buyouts/stream-valuations/{id}/approve
        - POST /lease-buyouts/deals/{id}/close
        - POST /lease-buyouts/deals/{id}/terminate
      shared_operations:
        - POST /lease-buyouts/deals/{id}/clear-to-close
        - GET reads across portfolios, facilities, streams, deals, disputes
    - name: TreasuryOfficer
      identity: opaque
      exclusive_operations:
        - POST /lease-buyouts/financing-facilities
        - POST /lease-buyouts/financing-facilities/{id}/pledges
        - POST /lease-buyouts/financing-facilities/{id}/advances
        - POST /lease-buyouts/collateral-pledges/{id}/release
        - POST /lease-buyouts/deals/{id}/escrow-funding
      shared_operations:
        - GET reads on portfolios, facilities, pledges, streams, deals, settlement
    - name: TitleOfficer
      identity: opaque
      exclusive_operations:
        - POST /lease-buyouts/title-reports/{id}/transitions
      shared_operations:
        - POST /lease-buyouts/deals/{id}/title-reports
        - GET reads on deals, title reports, tower sites
    - name: Lender
      identity: opaque
      exclusive_operations:
        - POST /lease-buyouts/title-reports/{id}/consent-decision
      shared_operations:
        - GET /lease-buyouts/deals/{id}
        - GET /lease-buyouts/title-reports/{id}
        - GET /lease-buyouts/deals/{id}/title-reports
    - name: ServicingAgent
      identity: opaque
      exclusive_operations:
        - POST /lease-buyouts/carrier-tenancies/{id}/status
        - POST /lease-buyouts/lease-streams/{id}/amendment-events
        - POST /lease-buyouts/amendment-events/{id}/reverse
        - "POST /lease-buyouts/disputes/{id}/transitions with action START_CURE"
      shared_operations:
        - POST /lease-buyouts/lease-streams/{id}/tenancies
        - POST /lease-buyouts/lease-streams/{id}/disputes
        - GET reads on streams, tenancies, disputes, pledges, amendment events
    - name: Landowner
      identity: "entity_backed:Landowner"
      exclusive_operations:
        - "POST /lease-buyouts/offers/{id}/transitions with action COUNTER, ACCEPT or REJECT"
        - "POST /lease-buyouts/disputes/{id}/transitions with action CONFIRM_CURE or REOPEN"
      shared_operations:
        - POST /lease-buyouts/lease-streams/{id}/disputes
        - GET /lease-buyouts/landowners/{id}
        - GET /lease-buyouts/lease-streams/{id}
        - GET /lease-buyouts/deals/{id}
        - GET /lease-buyouts/deals/{id}/offers
        - GET /lease-buyouts/lease-streams/{id}/amendment-events
    - name: TowerCompanyAgent
      identity: "entity_backed:TowerCompany"
      exclusive_operations:
        - POST /lease-buyouts/rofr-notices/{id}/response
      shared_operations:
        - GET /lease-buyouts/deals/{id}
        - GET /lease-buyouts/deals/{id}/rofr-notices
