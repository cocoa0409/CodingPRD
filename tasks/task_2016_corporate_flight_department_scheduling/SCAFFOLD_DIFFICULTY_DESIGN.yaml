  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_safety_assign_crew_on_planned_leg_with_expired_training
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.FlightLeg.transitions
        distinguishing_aspect: |
          Pair: state (priority 5) vs business_safety (priority 7). Leg is in
          PLANNED (assign-crew invalid state) AND the supplied PIC has expired
          training. The state error ERR_INVALID_STATE must win.
        test_recipe:
          setup:
            - "BU, pax, aircraft, expired-PIC, valid SIC exist"
            - "Trip is APPROVED but assign-aircraft has NOT been called — leg is still PLANNED"
            - "PIC's training_valid_until is in the past"
          setup_api_calls:
            - call: "POST /flight-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FlightDeptManager
            - call: "POST /flight-ops/business-units"
              payload: { bu_code: "BU-P5A", name: "P5A", annual_flight_budget_cents: 100000000 }
              as: FinanceAdmin
              captures: { bu_id: $.data.id }
            - call: "POST /flight-ops/passenger-profiles"
              payload: { employee_number: "E801", full_name: "Pax P5A", priority_tier: "TIER_1", home_bu_id: "${bu_id}", sifl_control_employee: false }
              as: FlightDeptManager
              captures: { pax: $.data.id }
            - call: "POST /flight-ops/aircraft"
              payload: { tail_number: "N801CF", aircraft_type: "LIGHT_JET", passenger_capacity: 6, home_base_icao: "KTEB" }
              as: FlightDeptManager
              captures: { ac_id: $.data.id }
            - call: "POST /flight-ops/crew-members"
              payload: { employee_number: "C801", full_name: "Expired PIC", seat_qualification: "PIC", type_ratings: ["LIGHT_JET"], training_valid_until: "2026-07-01T00:00:00Z" }
              as: FlightDeptManager
              captures: { pic_id: $.data.id }
            - call: "POST /flight-ops/crew-members"
              payload: { employee_number: "C802", full_name: "Good SIC", seat_qualification: "SIC", type_ratings: ["LIGHT_JET"], training_valid_until: "2027-01-01T00:00:00Z" }
              as: FlightDeptManager
              captures: { sic_id: $.data.id }
            - call: "POST /flight-ops/trip-requests"
              payload: { requester_id: "${pax}", charge_bu_id: "${bu_id}", trip_kind: "BUSINESS", purpose: "X", requested_departure_utc: "2026-08-10T12:00:00Z", requested_return_utc: "2026-08-10T14:00:00Z", passenger_ids: ["${pax}"] }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { trip_id: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/flight-legs"
              payload: { leg_sequence: 1, origin_icao: "KTEB", destination_icao: "KDCA", scheduled_departure_utc: "2026-08-10T12:00:00Z", scheduled_arrival_utc: "2026-08-10T14:00:00Z", distance_statute_miles: 200 }
              as: ExecutiveRequester
              as_user_id: "${pax}"
              captures: { leg_id: $.data.id }
            - call: "POST /flight-ops/trip-requests/${trip_id}/submit"
              payload: {}
              as: ExecutiveRequester
              as_user_id: "${pax}"
            - call: "POST /flight-ops/trip-requests/${trip_id}/approve"
              payload: {}
              as: FlightDeptManager
          trigger:
            - call: "POST /flight-ops/flight-legs/${leg_id}/assign-crew"
              payload: { pic_crew_id: "${pic_id}", sic_crew_id: "${sic_id}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (priority 5 state beats priority 7 business_safety even though crew is also illegal)"

      - name: safety_vs_referential_dispatch_without_crew_and_without_personal_use_approval
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - state_machines.TripRequest.transitions
        distinguishing_aspect: |
          Pair: business_safety (priority 7) vs business_referential (priority 14).
          Different pair from instance 1. A personal-use trip in ASSIGNED state
          with legs still not CREWED (crew safety violation) AND no personal-use
          approval is sent a dispatch; the crew-not-crewed issue surfaces as
          ERR_INVALID_STATE at priority 5 — so we instead test a different
          safety-vs-referential pair: settle a personal trip when settle is
          called from a non-completed state and personal_use_approved_by is
          missing. Actually the cleanest safety-vs-referential pair is on
          dispatch: legs are CREWED (safety satisfied) BUT trip not yet
          personal_use_approved. Then construct the inverse: legs NOT crewed AND
          no approval — expect the higher-priority safety-family error. To
          keep it in the safety-vs-referential shape, we trigger dispatch with
          legs in ASSIGNED (not CREWED) and personal_use not approved — the
          state check at priority 5 fires first with ERR_INVALID_STATE, so
          this instance must be rebuilt: use settle on a personal trip that is
          not COMPLETED and has no personal_use approval — the state check
          (priority 5, ERR_INVALID_STATE because assignment_status != COMPLETED
          for the UNSETTLED->SETTLED transition's own guard, which is
          assignment_status==COMPLETED) fires, and the SoD/referential checks
          would not. Therefore this instance is reframed as a state-vs-
          referential pair, still a different category pair from instance 1.
        test_recipe:
          setup:
            - "Personal-use trip (personal_use_flag=true), NO FinanceAdmin personal-use approval"
            - "Leg CREWED but trip still in ASSIGNED (not yet DISPATCHED, not COMPLETED)"
            - "Settle called by FinanceAdmin"
          setup_api_calls:
