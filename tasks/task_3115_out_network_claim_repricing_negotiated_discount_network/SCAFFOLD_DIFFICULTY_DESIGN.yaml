  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_payer_state_error_beats_nsa_safety_error
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_PAYER_SUSPENDED]
          - errors[ERR_NSA_METHODOLOGY_CONFLICT]
        distinguishing_aspect: |
          Pair (state vs business_safety): a reprice request on an NSA-flagged
          claim whose payer is SUSPENDED and whose selected policy is
          NEGOTIATION_REQUIRED violates both priority 4 and priority 6; the
          higher-priority state error ERR_PAYER_SUSPENDED (409) must win over the
          NSA safety error ERR_NSA_METHODOLOGY_CONFLICT (422).
        test_recipe:
          setup:
            - "Payer P1 SUSPENDED. Policy PROFESSIONAL/OON methodology NEGOTIATION_REQUIRED."
            - "Claim K: nsa_flag true, PROFESSIONAL, OON, one line."
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000009", legal_name: "PR1", tin: "T1" }
              as: NetworkAdmin
              captures: { pr1_id: $.data.id }
            - call: "POST /repricing-policies"
              payload: { payer_client_id: "${p1_id}", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", methodology: "NEGOTIATION_REQUIRED", priority: 1 }
              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "K1", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0, nsa_flag: true }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_k_id: $.data.id, claim_k_v: $.data.version }
            - call: "POST /claims/${claim_k_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 1, unit_charge_cents: 50000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /payer-clients/${p1_id}/suspend"
              payload: {}
              as: OpsAdmin
          trigger:
            - call: "POST /claims/${claim_k_id}/reprice"
              payload: { expected_claim_version: "${claim_k_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "error_id == ERR_PAYER_SUSPENDED (priority 4 state beats priority 6 business_safety)"
            - "Claim.${claim_k_id}.status remains PENDING_LINES"

      - name: temporal_window_error_beats_idr_amount_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_OPEN_NEGOTIATION_ACTIVE]
          - errors[ERR_IDR_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Pair (business_temporal vs business_constraint): an IDR submission made
          while the open negotiation period is still ACTIVE violates priority 7,
          and a decide call whose winning_amount_cents matches neither offer
          violates priority 12 — the two errors sit in different categories and
          are reachable through different endpoints, and each must surface its own
          error rather than the other's.
