            - { call: "GET /reserve-accounts/${r_id}", as: MasterServicer, captures: { r_frozen: $.data.disbursement_frozen, r_elev: $.data.elevated_retainage } }
            - { call: "GET /loans/${l_id}/extension-options", as: MasterServicer, captures: { e_st: "$.data[0].status" } }
          assert:
            - "loan.servicing_status == PERFORMING"
            - "reserve.disbursement_frozen == false and elevated_retainage == false"
            - "option SUSPENDED -> AVAILABLE (window 2027-03-01 >= clock 2026-08-01)"
      - name: assessment_autocure_on_conforming_reassessment
        claim_type: valid_transition
        grounds:
          - "state_machines.CovenantAssessment.OPEN_to_CURED"
        excluded_because:
          difficulty_instance: dscr_ttm_vs_t3_quarterly_divergence
          rationale: "Loan B's three OPEN T3 assessments are asserted CURED by the conforming Q4 assessment in that difficulty instance."

  # ==================================================================
  - section: calculations
    instances:
      - name: appraisal_drop_opens_ltv_breach
        claim_type: correct_result
        grounds:
          - "calculations.ltv_calculation"
          - "endpoints[\"POST /properties/{id}/appraise\"]"
        distinguishing_aspect: "Re-appraisal downward to 900000000 with balance 800000000 yields LTV 0.8889 > 0.75 threshold -> OPEN LTV assessment and WATCHLIST posture."
        test_recipe:
          setup: ["clean loan, balance 800000000, ltv threshold 0.75; property initially appraised 2000000000"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "LTV Co", tax_id: "TX-LTV", contact_email: "ltv@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-LTV", original_principal_cents: 800000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.75, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/properties", payload: { address: "1 Value St", property_type: "OFFICE", appraised_value_cents: 2000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /properties/${p_id}/appraise", payload: { appraised_value_cents: 900000000, appraisal_date: "2026-07-01T00:00:00Z" }, as: MasterServicer }
            - { call: "GET /loans/${l_id}/covenant-assessments?assessment_type=LTV", as: MasterServicer, captures: { ltv_val: "$.data[0].computed_value", ltv_breach: "$.data[0].breach" } }
            - { call: "GET /loans/${l_id}", as: MasterServicer, captures: { l_srv: $.data.servicing_status, l_ltv: $.data.current_ltv } }
          assert:
            - "LTV assessment computed_value == 0.8889 (800000000/900000000, 4dp round_half_up), breach == true, status == OPEN"
            - "loan.current_ltv == 0.8889 and servicing_status == WATCHLIST"
      - name: stale_appraisal_makes_ltv_uncomputable_breach
        claim_type: input_set_filtering
        grounds:
          - "calculations.ltv_calculation"
        distinguishing_aspect: "Appraisals older than 24 months are excluded from the collateral set; with no in-date appraisal the LTV is null and the assessment is a breach by construction."
        test_recipe:
          setup: ["clean loan, ltv threshold 0.90; property whose only appraisal is dated 2024-06-01 (stale at default clock 2026-08-01)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Stale Co", tax_id: "TX-STL", contact_email: "stl@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-STL", original_principal_cents: 500000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/properties", payload: { address: "1 Stale St", property_type: "RETAIL", appraised_value_cents: 1000000000, appraisal_date: "2024-06-01T00:00:00Z" }, as: MasterServicer, captures: { p_id: $.data.id } }
          trigger:
            - { call: "POST /properties/${p_id}/appraise", payload: { appraised_value_cents: 1000000000, appraisal_date: "2024-06-01T00:00:00Z" }, as: MasterServicer }
            - { call: "GET /loans/${l_id}/covenant-assessments?assessment_type=LTV", as: MasterServicer, captures: { st_val: "$.data[0].computed_value", st_breach: "$.data[0].breach" } }
          assert:
            - "LTV assessment created with computed_value == null and breach == true (empty eligible collateral set)"
            - "loan.current_ltv == null; servicing_status == WATCHLIST"
      - name: ttm_uncomputable_before_four_quarters
        claim_type: input_set_filtering
        grounds:
          - "calculations.dscr_calculation"
        distinguishing_aspect: "TTM basis with fewer than 4 consecutive accepted quarters creates no assessment row at all (not a zero, not a breach)."
        test_recipe:
          setup: ["TTM loan; one accepted operating statement"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Short Co", tax_id: "TX-SHO", contact_email: "sho@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-SHO", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2026-04-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 10000000 }, as: Borrower, as_user_id: "${b_id}", captures: { s_id: $.data.id } }
            - { call: "POST /financial-statements/${s_id}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
          trigger:
            - { call: "GET /loans/${l_id}/covenant-assessments", as: MasterServicer }
          assert:
            - "assessment list empty (total_count == 0) — TTM uncomputable with 1 quarter"
            - "loan.current_dscr == null; servicing_status == PERFORMING"
      - name: elevated_retainage_floor_applied_when_watchlist
        claim_type: correct_result
        grounds:
          - "calculations.disbursement_waterfall"
          - "entities.ReserveAccount.fields.elevated_retainage"
        distinguishing_aspect: "While the loan is WATCHLIST (reserve elevated), funding a draw with retainage_pct 0.05 applies the 0.20 floor: retain 20000 of 100000 instead of 5000."
        test_recipe:
          setup:
            - "T3 loan threshold 1.20; reserve deposit 1000000 (v2); accepted operating statement NOI 15000000 -> DSCR 1.0000 < 1.20 -> WATCHLIST -> reserve elevated (v3)"
            - "draw of one line 100000 with retainage_pct 0.05, approved"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Floor Co", tax_id: "TX-FLR", contact_email: "flr@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-FLR", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.20, ltv_covenant_threshold: 0.90, dscr_basis: "T3_ANNUALIZED", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 0 }, as: MasterServicer, captures: { r_id: $.data.id } }
            - { call: "POST /reserve-accounts/${r_id}/deposits", payload: { amount_cents: 1000000 }, as: MasterServicer }
            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 15000000 }, as: Borrower, as_user_id: "${b_id}", captures: { s_id: $.data.id } }
            - { call: "POST /financial-statements/${s_id}/review", payload: { decision: "ACCEPT" }, as: MasterServicer }
            - { call: "GET /reserve-accounts/${r_id}", as: MasterServicer, captures: { r_v: $.data.version, r_elev: $.data.elevated_retainage } }
            - { call: "POST /reserve-accounts/${r_id}/disbursement-requests", payload: { purpose: "CAPITAL_REPAIR", line_items: [ { description: "hvac", amount_cents: 100000 } ], retainage_pct: 0.05, expected_reserve_account_version: "${r_v}" }, as: Borrower, as_user_id: "${b_id}", captures: { d_id: $.data.id } }
            - { call: "POST /disbursement-requests/${d_id}/review", payload: { decision: "APPROVE" }, as: MasterServicer }
          trigger:
            - { call: "POST /disbursement-requests/${d_id}/fund", as: MasterServicer, payload: {}, captures: { funded: $.data.funded_cents, retained: $.data.retained_cents } }
          assert:
            - "reserve.elevated_retainage == true before funding (WATCHLIST cascade)"
            - "funded_cents == 80000 and retained_cents == 20000 (0.20 floor overrides requested 0.05)"
            - "reserve.balance_cents == 920000 after funding"
      - name: extension_maturity_month_end_clamp
        claim_type: correct_result
        grounds:
          - "state_machines.ExtensionOption.AVAILABLE_to_EXERCISED"
        distinguishing_aspect: "Calendar-month arithmetic clamps to month end: maturity 2027-01-31 + 1 month -> 2027-02-28 (2027 not a leap year), not 2027-03-03 and not an error."
        test_recipe:
          setup: ["clean loan maturity 2027-01-31; option seq 1 window [2026-08-01, 2026-11-30], extension_months 1, fee_pct 0"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Clamp Co", tax_id: "TX-CLM", contact_email: "clm@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-CLM", original_principal_cents: 500000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2027-01-31T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/extension-options", payload: { option_seq: 1, exercise_window_start: "2026-08-01T00:00:00Z", exercise_window_end: "2026-11-30T00:00:00Z", extension_months: 1, fee_pct: 0 }, as: MasterServicer, captures: { e_id: $.data.id } }
          trigger:
            - { call: "POST /extension-options/${e_id}/exercise", as: Borrower, as_user_id: "${b_id}", payload: {}, captures: { fee: $.data.exercised_fee_cents } }
            - { call: "GET /loans/${l_id}", as: MasterServicer, captures: { mat: $.data.maturity_date } }
          assert:
            - "loan.maturity_date == 2027-02-28T00:00:00Z (month-end clamped)"
            - "exercised_fee_cents == 0 (fee_pct 0)"
      - name: extension_exercise_fee_and_maturity_shift
        claim_type: correct_result
        grounds:
          - "state_machines.ExtensionOption.AVAILABLE_to_EXERCISED"
        excluded_because:
          difficulty_instance: extension_exercise_gated_by_loan_payment_and_covenant
          rationale: "That difficulty instance asserts fee 1250000 and maturity shift 2027-06-30 -> 2028-06-30."
      - name: risk_score_entry_creation_at_threshold
        claim_type: correct_result
        grounds:
          - "calculations.watchlist_risk_score"
        excluded_because:
          difficulty_instance: watchlist_risk_score_tiered_with_synergy
          rationale: "Score 90 entry creation with escalation_review is asserted there; the < 70 no-entry states are asserted in its setup narration."
      - name: reserve_available_equals_balance_minus_held
        claim_type: correct_result
        grounds:
          - "entities.ReserveAccount.fields.available_cents"
        excluded_because:
          difficulty_instance: disbursement_amount_equals_available_balance
          rationale: "available_cents == 0 after full-balance hold is asserted there."
      - name: occ_assumption_create_happy_path
        claim_type: correct_result
        grounds:
          - "concurrency_rules[assumption-create-stale-loan]"
        excluded_because:
          difficulty_instance: assumption_fee_outstanding_vs_original_divergence
          rationale: "Both assumption creations there use a fresh expected_loan_version and succeed (201), proving OCC pass path."

  - section: state_machines
    instances:
      - name: estoppel_expiry_allows_fresh_request
        claim_type: valid_transition
        grounds:
          - "state_machines.EstoppelCertificate"
          - "errors[ERR_DUPLICATE_ACTIVE_ESTOPPEL]"
        distinguishing_aspect: "A PENDING estoppel past its due_date is swept to EXPIRED; only then may a new estoppel be requested for the same lease."
        test_recipe:
          setup: ["clean loan (origination 2026-08-01, maturity 2028-06-30) with property and a lease; estoppel due 2026-08-10"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Est Co", tax_id: "TX-EST", contact_email: "est@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-EST", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2026-08-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/properties", payload: { address: "1 Est St", property_type: "OFFICE", appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { p_id: $.data.id } }
            - { call: "POST /properties/${p_id}/leases", payload: { tenant_name: "T1", suite_ref: "STE-5", commencement_date: "2026-09-01T00:00:00Z", expiry_date: "2027-08-31T00:00:00Z", base_rent_cents_monthly: 100000, sqft: 1000, term_months: 12 }, as: Borrower, as_user_id: "${b_id}", captures: { le_id: $.data.id } }
            - { call: "POST /leases/${le_id}/estoppels", payload: { due_date: "2026-08-10T00:00:00Z" }, as: MasterServicer, captures: { es_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: MasterServicer }
          trigger:
            - { call: "GET /leases/${le_id}/estoppels", as: MasterServicer, captures: { es_st: "$.data[0].status" } }
            - { call: "POST /leases/${le_id}/estoppels", payload: { due_date: "2026-09-01T00:00:00Z" }, as: MasterServicer, captures: { es2_st: $.data.status } }
          assert:
            - "first estoppel status == EXPIRED after clock passes due_date (sweep)"
            - "second estoppel request succeeds (201) with status == PENDING — EXPIRED terminal does not block re-request"
      - name: insurance_expiry_sweep_creates_lapse_entry
        claim_type: side_effect_execution
        grounds:
          - "state_machines.InsurancePolicy.ACTIVE_to_EXPIRED"
          - "calculations.collection_cadence"
        distinguishing_aspect: "Clock sweep expires an out-of-date policy and, finding no other ACTIVE coverage of that type, creates an INSURANCE_LAPSE WatchlistEntry which lifts the loan to WATCHLIST."
        test_recipe:
          setup: ["clean loan (origination 2026-08-01, maturity 2028-06-30) with property; PROPERTY policy [2026-01-01, 2026-07-31] coverage >= balance created while clock is default 2026-08-01 (no sweep on create)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Lapse Co", tax_id: "TX-LAP", contact_email: "lap@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-LAP", original_principal_cents: 400000000, note_rate: 0.05, origination_date: "2026-08-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/properties", payload: { address: "1 Lapse St", property_type: "OFFICE", appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { p_id: $.data.id } }
            - { call: "POST /properties/${p_id}/insurance-policies", payload: { coverage_type: "PROPERTY", coverage_amount_cents: 400000000, start_date: "2026-01-01T00:00:00Z", end_date: "2026-07-31T00:00:00Z" }, as: Borrower, as_user_id: "${b_id}", captures: { pol_id: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: MasterServicer }
            - { call: "GET /properties/${p_id}/insurance-policies", as: MasterServicer, captures: { pol_st: "$.data[0].status" } }
            - { call: "GET /loans/${l_id}/watchlist-entries", as: MasterServicer, captures: { w_crit: "$.data[0].criterion" } }
            - { call: "GET /loans/${l_id}", as: MasterServicer, captures: { l_srv: $.data.servicing_status } }
          assert:
            - "policy status == EXPIRED"
            - "exactly one ACTIVE WatchlistEntry with criterion == INSURANCE_LAPSE"
            - "loan.servicing_status == WATCHLIST"
      - name: maturity_sweep_creates_risk_entry_then_maturity_default
        claim_type: side_effect_execution
        grounds:
          - "calculations.collection_cadence"
          - "state_machines.Loan.CURRENT_to_MATURITY_DEFAULT"
        distinguishing_aspect: "Approaching maturity (<= 180 days, balance > 0) creates a MATURITY_RISK entry; crossing maturity flips payment_status to MATURITY_DEFAULT. Two distinct sweep steps in pinned order."
        test_recipe:
          setup: ["clean loan origination 2026-08-01, maturity 2026-08-10, balance 500000000"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Mat Co", tax_id: "TX-MAT", contact_email: "mat@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-MAT", original_principal_cents: 500000000, note_rate: 0.05, origination_date: "2026-08-01T00:00:00Z", maturity_date: "2026-08-10T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: MasterServicer }
            - { call: "GET /loans/${l_id}/watchlist-entries", as: MasterServicer, captures: { m_crit: "$.data[0].criterion" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T00:00:00Z" }, as: MasterServicer }
            - { call: "GET /loans/${l_id}", as: MasterServicer, captures: { m_pay: $.data.payment_status } }
          assert:
            - "at 2026-08-05: one ACTIVE WatchlistEntry criterion == MATURITY_RISK (5 days to maturity <= 180)"
            - "at 2026-08-15: loan.payment_status == MATURITY_DEFAULT (clock >= maturity, balance 500000000 > 0)"
            - "no duplicate MATURITY_RISK entry created by the second sweep (idempotent)"

  # ==================================================================
  - section: validations
    instances:
      - name: request_missing_auth_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Request without X-User-Role/X-User-ID headers -> 401 ERR_UNAUTHENTICATED before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /borrowers", payload: { legal_name: "Anon", tax_id: "TX-ANO", contact_email: "anon@x.com" }, as: MasterServicer, captures: { err: $.data.error_id } }
          assert:
            - "when the realized request omits auth headers: 401 with error_id == ERR_UNAUTHENTICATED"
      - name: borrower_cannot_review_statement
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "endpoints[\"POST /financial-statements/{id}/review\"]"
        distinguishing_aspect: "Review endpoint is MasterServicer-only; a Borrower (even the owning one) -> 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["loan with one SUBMITTED operating statement"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Role Co", tax_id: "TX-ROL", contact_email: "rol@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-ROL", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "T3_ANNUALIZED", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 20000000 }, as: Borrower, as_user_id: "${b_id}", captures: { s_id: $.data.id } }
          trigger:
            - { call: "POST /financial-statements/${s_id}/review", payload: { decision: "ACCEPT" }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "403 with error_id == ERR_UNAUTHORIZED; statement remains SUBMITTED"
      - name: borrower_cannot_submit_statement_for_other_loan
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_OWNERSHIP_MISMATCH]"
        distinguishing_aspect: "Entity-backed Borrower writing into another borrower's loan chain -> 403 ERR_OWNERSHIP_MISMATCH (write scope check)."
        test_recipe:
          setup: ["borrowers A and B; loan owned by A"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Owner A", tax_id: "TX-OWA", contact_email: "a@x.com" }, as: MasterServicer, captures: { ba_id: $.data.id } }
            - { call: "POST /borrowers", payload: { legal_name: "Owner B", tax_id: "TX-OWB", contact_email: "b@x.com" }, as: MasterServicer, captures: { bb_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${ba_id}", loan_number: "LN-OWA", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { la_id: $.data.id } }
          trigger:
            - { call: "POST /loans/${la_id}/financial-statements", payload: { statement_type: "RENT_ROLL", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", occupancy_pct: 90 }, as: Borrower, as_user_id: "${bb_id}", captures: { err: $.data.error_id } }
          assert:
            - "403 with error_id == ERR_OWNERSHIP_MISMATCH"
      - name: borrower_read_other_loan_returns_not_found
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "Out-of-scope READS hide existence: Borrower B reading A's loan -> 404 ERR_NOT_FOUND, not 403 (read-scoping asymmetry vs writes)."
        test_recipe:
          setup: ["borrowers A and B; loan owned by A"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Reader A", tax_id: "TX-RDA", contact_email: "ra@x.com" }, as: MasterServicer, captures: { ba_id: $.data.id } }
            - { call: "POST /borrowers", payload: { legal_name: "Reader B", tax_id: "TX-RDB", contact_email: "rb@x.com" }, as: MasterServicer, captures: { bb_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${ba_id}", loan_number: "LN-RDA", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { la_id: $.data.id } }
          trigger:
            - { call: "GET /loans/${la_id}", as: Borrower, as_user_id: "${bb_id}", captures: { err: $.data.error_id } }
          assert:
            - "404 with error_id == ERR_NOT_FOUND (resource hidden, not forbidden)"
      - name: inspector_cannot_complete_others_inspection
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "state_machines.PropertyInspection.SCHEDULED_to_COMPLETED"
        distinguishing_aspect: "Completion is ownership-scoped to the assigned Inspector: a different inspector -> 403 ERR_OWNERSHIP_MISMATCH."
        test_recipe:
          setup: ["loan+property; inspectors I1 (assigned) and I2; one SCHEDULED inspection assigned to I1"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Insp Co", tax_id: "TX-INS", contact_email: "ins@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-INS", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/properties", payload: { address: "1 Insp St", property_type: "OFFICE", appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { p_id: $.data.id } }
            - { call: "POST /inspectors", payload: { full_name: "I One", license_no: "LIC-I1" }, as: MasterServicer, captures: { i1_id: $.data.id } }
            - { call: "POST /inspectors", payload: { full_name: "I Two", license_no: "LIC-I2" }, as: MasterServicer, captures: { i2_id: $.data.id } }
            - { call: "POST /properties/${p_id}/inspections", payload: { inspector_id: "${i1_id}", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: MasterServicer, captures: { in_id: $.data.id } }
          trigger:
            - { call: "POST /inspections/${in_id}/close", payload: { outcome: "COMPLETED", condition_rating: "GOOD" }, as: Inspector, as_user_id: "${i2_id}", captures: { err: $.data.error_id } }
          assert:
            - "403 with error_id == ERR_OWNERSHIP_MISMATCH; inspection remains SCHEDULED"
      - name: stale_version_checked_before_uniqueness
        claim_type: priority_ordering
        grounds:
          - "validations[priority=6]"
          - "validations[priority=25]"
          - "concurrency_rules[assumption-create-stale-loan]"
        distinguishing_aspect: "A second assumption create carrying a stale expected_loan_version while a non-terminal request exists must fail 412 ERR_STALE_VERSION — the OCC precondition (priority 6) precedes the uniqueness constraint (priority 25)."
        test_recipe:
          setup: ["clean loan (version 1 at creation); one assumption request already created (loan now version 2, non-terminal)"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "OCC Co", tax_id: "TX-OCC", contact_email: "occ@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-OCC", original_principal_cents: 500000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id, l_v: $.data.version } }
            - { call: "POST /loans/${l_id}/assumption-requests", payload: { proposed_assumptor_name: "First", proposed_assumptor_tax_id: "TX-F1", proposed_net_worth_cents: 100000000, expected_loan_version: "${l_v}" }, as: Borrower, as_user_id: "${b_id}", captures: { ar1_id: $.data.id } }
          trigger:
            - { call: "POST /loans/${l_id}/assumption-requests", payload: { proposed_assumptor_name: "Second", proposed_assumptor_tax_id: "TX-F2", proposed_net_worth_cents: 200000000, expected_loan_version: "${l_v}" }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "412 with error_id == ERR_STALE_VERSION (not 409 ERR_ASSUMPTION_IN_PROGRESS, although both conditions hold)"
      - name: waive_by_reviewing_user_rejected_sod
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_SEGREGATION_OF_DUTIES]"
        distinguishing_aspect: "Segregation of duties: the user who accepted the source statement cannot waive the resulting DSCR assessment, even with the SpecialServicer role -> 403 ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["T3 loan threshold 1.20; operating statement NOI 15000000 accepted by user ms_user_1 -> DSCR 1.0000 breach OPEN"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "SoD Co", tax_id: "TX-SOD", contact_email: "sod@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-SOD", original_principal_cents: 1000000000, note_rate: 0.06, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.20, ltv_covenant_threshold: 0.90, dscr_basis: "T3_ANNUALIZED", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 15000000 }, as: Borrower, as_user_id: "${b_id}", captures: { s_id: $.data.id } }
            - { call: "POST /financial-statements/${s_id}/review", payload: { decision: "ACCEPT" }, as: MasterServicer, as_user_id: "ms_user_1" }
            - { call: "GET /loans/${l_id}/covenant-assessments", as: MasterServicer, captures: { a_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /covenant-assessments/${a_id}/waive", payload: { waiver_reason: "self-waiver attempt" }, as: SpecialServicer, as_user_id: "ms_user_1", captures: { err: $.data.error_id } }
          assert:
            - "403 with error_id == ERR_SEGREGATION_OF_DUTIES; assessment remains OPEN"
      - name: duplicate_statement_period_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=17]"
        distinguishing_aspect: "Second operating statement for the same (loan, quarter) while the first is SUBMITTED -> 409 ERR_DUPLICATE_STATEMENT_PERIOD."
        test_recipe:
          setup: ["clean loan; one SUBMITTED OS for Q2'26"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Dup Co", tax_id: "TX-DUP", contact_email: "dup@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-DUP", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 5000000 }, as: Borrower, as_user_id: "${b_id}" }
          trigger:
            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 6000000 }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "409 with error_id == ERR_DUPLICATE_STATEMENT_PERIOD"
      - name: misaligned_statement_period_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=18]"
        distinguishing_aspect: "Period [2026-04-15, 2026-07-14] is not a calendar quarter -> 422 ERR_STATEMENT_PERIOD_MISALIGNED."
        test_recipe:
          setup: ["clean loan"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Mis Co", tax_id: "TX-MIS", contact_email: "mis@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-MIS", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
          trigger:
            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-15T00:00:00Z", period_end: "2026-07-14T00:00:00Z", net_operating_income_cents: 5000000 }, as: Borrower, as_user_id: "${b_id}", captures: { err: $.data.error_id } }
          assert:
            - "422 with error_id == ERR_STATEMENT_PERIOD_MISALIGNED"
      - name: resubmission_after_rejection_allowed
        claim_type: satisfaction_pass
        grounds:
          - "validations[priority=17]"
          - "state_machines.FinancialStatement.SUBMITTED_to_REJECTED"
        distinguishing_aspect: "The duplicate-period rule only blocks while a SUBMITTED/ACCEPTED row exists; after REJECT, a fresh statement for the same quarter succeeds (201)."
        test_recipe:
          setup: ["clean loan; OS Q2'26 submitted then REJECTED"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Resub Co", tax_id: "TX-RES", contact_email: "res@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-RES", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 5000000 }, as: Borrower, as_user_id: "${b_id}", captures: { s1_id: $.data.id } }
            - { call: "POST /financial-statements/${s1_id}/review", payload: { decision: "REJECT", rejection_reason: "unreconciled NOI" }, as: MasterServicer }
          trigger:
            - { call: "POST /loans/${l_id}/financial-statements", payload: { statement_type: "OPERATING_STATEMENT", period_start: "2026-04-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z", net_operating_income_cents: 5500000 }, as: Borrower, as_user_id: "${b_id}", captures: { s2_st: $.data.status } }
          assert:
            - "resubmission returns 201 with status == SUBMITTED"
            - "rejected statement retains rejection_reason 'unreconciled NOI'"
      - name: duplicate_reserve_account_type_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=22]"
        distinguishing_aspect: "Second TI_LC account on the same loan -> 409 ERR_DUPLICATE_RESERVE_ACCOUNT; a REPLACEMENT account on the same loan succeeds."
        test_recipe:
          setup: ["clean loan with one TI_LC reserve"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Res Co", tax_id: "TX-RSV", contact_email: "rsv@x.com" }, as: MasterServicer, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-RSV", original_principal_cents: 100000000, note_rate: 0.05, origination_date: "2025-01-01T00:00:00Z", maturity_date: "2028-06-30T00:00:00Z", dscr_covenant_threshold: 1.0, ltv_covenant_threshold: 0.90, dscr_basis: "TTM", assumption_fee_basis: "OUTSTANDING" }, as: MasterServicer, captures: { l_id: $.data.id } }
            - { call: "POST /loans/${l_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 0 }, as: MasterServicer }
          trigger:
            - { call: "POST /loans/${l_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 0 }, as: MasterServicer, captures: { err: $.data.error_id } }
            - { call: "POST /loans/${l_id}/reserve-accounts", payload: { account_type: "REPLACEMENT", target_balance_cents: 0 }, as: MasterServicer, captures: { r2_id: $.data.id } }
          assert:
            - "second TI_LC -> 409 ERR_DUPLICATE_RESERVE_ACCOUNT"
            - "REPLACEMENT creation succeeds (201) — uniqueness scope is (loan, account_type)"
      - name: extension_window_overlap_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=23]"
        distinguishing_aspect: "Option windows are closed intervals on the loan: [2027-01-15, 2027-03-01] overlapping [2026-12-01, 2027-01-31] -> 409 ERR_EXTENSION_WINDOW_OVERLAP."
        test_recipe:
