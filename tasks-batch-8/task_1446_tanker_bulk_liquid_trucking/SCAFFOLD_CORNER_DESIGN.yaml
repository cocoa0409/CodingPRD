            - { call: "POST /bulk-liquid/shipments/${s1}/plan", payload: { trailer_id: "${trl}", driver_id: "${drv}", rack_id: "${rack}", rack_window_start: "2026-08-02T10:00:00Z", rack_window_end: "2026-08-02T12:00:00Z" }, as: Dispatcher }
            - { call: "POST /bulk-liquid/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:30:00Z" }, as: FleetAdmin }
