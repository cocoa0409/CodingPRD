              as: Customer
              as_user_id: "${cust_id}"
              captures: { so_id: "$.data.id" }
            - call: "POST /special-orders/${so_id}/quote"
              payload: { quoted_price_cents: 10000 }
              as: Manager
              captures: { v_at_quoted: "$.data.version" }
            - call: "POST /special-orders/${so_id}/re-quote"
