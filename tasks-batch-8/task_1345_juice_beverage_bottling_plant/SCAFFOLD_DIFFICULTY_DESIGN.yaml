            - { call: "GET /v1/container-lots/${clot_id}", payload: {}, as: Any, captures: { res_before: $.data.quantity_reserved } }
          trigger:
            - { call: "POST /v1/batches/${batch1}/condemn", payload: {}, as: QAInspector, as_user_id: "qa-1" }
            - { call: "GET /v1/production-runs/${run1_id}", payload: {}, as: Any, captures: { run1_status: $.data.production_status, run1_v: $.data.version } }
            - { call: "GET /v1/container-lots/${clot_id}", payload: {}, as: Any, captures: { res_after: $.data.quantity_reserved, avail_after: $.data.quantity_available } }
            - { call: "POST /v1/production-runs", payload: { customer_id: "${cust_id}", formula_id: "${form_id}", container_type: "PET_473", planned_units: 800, unit_price_cents: 150 }, as: ProductionPlanner, captures: { run2_id: $.data.id, run2_v: $.data.version } }
