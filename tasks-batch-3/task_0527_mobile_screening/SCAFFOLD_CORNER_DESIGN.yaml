# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Mobile Health Screening & Wellness Events — Expert
# Breadth probe over §1.1–§1.7 claims NOT already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_mobile_unit_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.MobileUnit, endpoints.POST./mobile-units]
        distinguishing_aspect: "POST /mobile-units with name+modality+daily_capacity returns 201; response carries system id, created_at, version==1, and status defaulting to AVAILABLE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /mobile-units", payload: { name: "Van A", modality: "MAMMOGRAPHY", daily_capacity: 10 }, as: ProgramManager, captures: { uid: $.data.id, v: $.data.version, st: $.data.status } }
          assert:
            - "HTTP status == 201"
            - "MobileUnit.status == AVAILABLE"
            - "MobileUnit.version == 1"

      - name: create_appointment_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Appointment, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /appointments without slot_duration_min (a required input) returns ERR_INVALID_REQUEST (400) before any state work."
        test_recipe:
          setup: ["One PUBLISHED blood-panel event and one ACTIVE participant."]
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p1}", slot_start_min: 540 }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: create_participant_insurance_without_member_id_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Participant, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "pay_type INSURANCE requires insurance_member_id; omitting it returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "INSURANCE" }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: get_event_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.ScreeningEvent, "errors[ERR_EVENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /screening-events/{id} with a random UUID returns ERR_EVENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /screening-events/00000000-0000-4000-8000-000000000000", payload: {}, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_EVENT_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_participant_grant_defaults_strikes_zero_status_active
        claim_type: Defaults
        grounds: [entities.Participant.fields.no_show_strikes, entities.Participant.fields.status]
        distinguishing_aspect: "A freshly registered participant has no_show_strikes==0 and status==ACTIVE by default (system-sourced)."
        test_recipe:
          setup: ["One GRANT sponsor with a Grant."]
          setup_api_calls:
            - { call: "POST /sponsors", payload: { name: "GrantBody", sponsor_type: "GRANT", viewer_user_id: "sv2" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /grants", payload: { sponsor_id: "${sponsor_id}", name: "Fund", total_budget_cents: 10000 }, as: ProgramManager, captures: { grant_id: $.data.id } }
          trigger:
            - { call: "POST /participants", payload: { full_name: "Pat G", date_of_birth: "1975-01-01", pay_type: "GRANT", grant_id: "${grant_id}" }, as: ProgramManager, captures: { strikes: $.data.no_show_strikes, st: $.data.status } }
          assert:
            - "Participant.no_show_strikes == 0"
            - "Participant.status == ACTIVE"

      - name: list_participants_pagination_envelope
        claim_type: Listing
        grounds: [entities.Participant, endpoints.GET./participants]
        distinguishing_aspect: "GET /participants returns a paginated array envelope with total_count and has_more fields per §1.0 pagination_fields."
        test_recipe:
          setup: ["Two registered SELF_PAY participants."]
          setup_api_calls:
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "SELF_PAY" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "P2", date_of_birth: "1981-01-01", pay_type: "SELF_PAY" }, as: ProgramManager }
          trigger:
            - { call: "GET /participants", payload: { limit: 1, offset: 0 }, as: ProgramManager }
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "meta.has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: publish_already_published_event_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ScreeningEvent.DRAFT_to_PUBLISHED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Publishing an already-PUBLISHED event returns ERR_INVALID_STATE (409); no side effect fires and version does not advance beyond the first publish."
        test_recipe:
          setup: ["One PUBLISHED blood-panel event."]
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager, captures: { ev_v2: $.data.version } }
          trigger:
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v2}" }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "ScreeningEvent.${event_id}.status == PUBLISHED"

      - name: close_event_with_open_appointments_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.ScreeningEvent.PUBLISHED_to_CLOSED, "errors[ERR_OPEN_APPOINTMENTS_EXIST]"]
        distinguishing_aspect: "Closing a PUBLISHED event holding a CHECKED_IN (mid-screening) appointment returns ERR_OPEN_APPOINTMENTS_EXIST (409); event stays PUBLISHED. SCHEDULED appointments would NOT block closure, only in-progress ones do."
        test_recipe:
          setup: ["One PUBLISHED blood-panel event with one CHECKED_IN appointment (consent recorded, checked in)."]
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p1: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p1}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/check-in", payload: {}, as: ClinicalStaff }
          trigger:
            - { call: "POST /screening-events/${event_id}/close", payload: {}, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_OPEN_APPOINTMENTS_EXIST"
            - "ScreeningEvent.${event_id}.status == PUBLISHED"

      - name: cancel_terminal_event_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ScreeningEvent.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling an already-CANCELLED event returns ERR_INVALID_STATE (409) — terminal lockdown."
        test_recipe:
          setup: ["One CANCELLED blood-panel event (cancelled from DRAFT)."]
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id } }
            - { call: "POST /screening-events/${event_id}/cancel", payload: {}, as: ProgramManager }
          trigger:
            - { call: "POST /screening-events/${event_id}/cancel", payload: {}, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "ScreeningEvent.${event_id}.status == CANCELLED"

      - name: screen_without_credentialed_staff_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.Appointment.CHECKED_IN_to_SCREENED, "errors[ERR_NO_CREDENTIALED_STAFF]"]
        distinguishing_aspect: "Screening when no ACTIVE TECHNOLOGIST/PHLEBOTOMIST of the event modality exists returns ERR_NO_CREDENTIALED_STAFF (409); appointment stays CHECKED_IN and no Charge is created."
        test_recipe:
          setup: ["One PUBLISHED blood-panel event with a CHECKED_IN appointment; NO phlebotomist staff registered."]
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p1: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p1}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/check-in", payload: {}, as: ClinicalStaff }
          trigger:
            - { call: "POST /appointments/${appt_id}/screen", payload: {}, as: ClinicalStaff, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_NO_CREDENTIALED_STAFF"
            - "Appointment.${appt_id}.status == CHECKED_IN"

      - name: checkin_without_consent_returns_consent_required
        claim_type: precondition_enforcement
        grounds: [state_machines.Appointment.SCHEDULED_to_CHECKED_IN, "validations[priority=7]", "errors[ERR_CONSENT_REQUIRED]"]
        distinguishing_aspect: "Check-in on an appointment whose consent_signed is still false returns ERR_CONSENT_REQUIRED (409); appointment stays SCHEDULED."
        test_recipe:
          setup: ["One PUBLISHED blood-panel event with a SCHEDULED appointment that has NOT recorded consent."]
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p1: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p1}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
          trigger:
            - { call: "POST /appointments/${appt_id}/check-in", payload: {}, as: ClinicalStaff, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_CONSENT_REQUIRED"
            - "Appointment.${appt_id}.status == SCHEDULED"

      - name: no_show_before_event_closed_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.Appointment.SCHEDULED_to_NO_SHOW, "errors[ERR_EVENT_NOT_CLOSED]"]
        distinguishing_aspect: "Marking a no-show while the parent event is still PUBLISHED returns ERR_EVENT_NOT_CLOSED (409); no strike is added."
        test_recipe:
          setup: ["One PUBLISHED (not closed) blood-panel event with a SCHEDULED appointment."]
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p1: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p1}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
          trigger:
            - { call: "POST /appointments/${appt_id}/mark-no-show", payload: {}, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_EVENT_NOT_CLOSED"
            - "Appointment.${appt_id}.status == SCHEDULED"

      - name: referral_resolve_from_open_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Referral.SCHEDULED_FOLLOWUP_to_RESOLVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling resolve on an OPEN referral (skipping CONTACTED and SCHEDULED_FOLLOWUP) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["One OPEN referral from an ABNORMAL mammography result."]
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van A", modality: "MAMMOGRAPHY", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /staff", payload: { full_name: "Tech T", role_type: "TECHNOLOGIST", modality: "MAMMOGRAPHY" }, as: ProgramManager }
            - { call: "POST /staff", payload: { full_name: "Rad R", role_type: "RADIOLOGIST", modality: "MAMMOGRAPHY" }, as: ProgramManager }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "MAMMOGRAPHY", site_label: "L1", event_date: "2026-06-10", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "Pat A", date_of_birth: "1970-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { pa_id: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${pa_id}", slot_start_min: 560, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
            - { call: "POST /appointments/${appt_id}/consent", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/check-in", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/screen", payload: {}, as: ClinicalStaff }
            - { call: "POST /appointments/${appt_id}/deliver-result", payload: { result: "ABNORMAL", flagged_urgent: false }, as: ClinicalStaff }
            - { call: "GET /referrals?appointment_id=${appt_id}", payload: {}, as: PatientNavigator, captures: { ref_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /referrals/${ref_id}/resolve", payload: {}, as: PatientNavigator, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "Referral.${ref_id}.status == OPEN"

      - name: reminder_send_when_not_due_returns_error
        claim_type: precondition_enforcement
        grounds: [state_machines.Reminder.PENDING_to_SENT, "errors[ERR_REMINDER_NOT_DUE]"]
        distinguishing_aspect: "Sending a reminder before its send_at_min on event_date (logical clock still at the 2026-05-01 default, well before the 2026-06-11 event) returns ERR_REMINDER_NOT_DUE (409)."
        test_recipe:
          setup: ["Logical clock left at startup default 2026-05-01T00:00:00Z; one PENDING reminder on a SCHEDULED appointment for a 2026-06-11 event with send_at_min=500."]
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p1: $.data.id } }
            - { call: "POST /appointments", payload: { event_id: "${event_id}", participant_id: "${p1}", slot_start_min: 540, slot_duration_min: 30 }, as: ProgramManager, captures: { appt_id: $.data.id } }
            - { call: "POST /reminders", payload: { appointment_id: "${appt_id}", send_at_min: 500, channel: "SMS" }, as: ProgramManager, captures: { rem_id: $.data.id } }
          trigger:
            - { call: "POST /reminders/${rem_id}/send", payload: {}, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "response error_id == ERR_REMINDER_NOT_DUE"
            - "Reminder.${rem_id}.status == PENDING"

      - name: reminder_send_when_due_after_clock_advance_succeeds
        claim_type: valid_transition
        grounds: [state_machines.Reminder.PENDING_to_SENT, endpoints.POST./_clock/set_current_utc]
        distinguishing_aspect: "After advancing the logical clock to 2026-06-11T09:00:00Z (540 minutes-from-midnight >= send_at_min 500) a PENDING reminder on an active appointment sends successfully (SENT)."
        test_recipe:
          setup: ["One PENDING reminder (send_at_min=500) on a SCHEDULED appointment for a 2026-06-11 event; clock advanced to 2026-06-11T09:00:00Z."]
          setup_api_calls:
            - { call: "POST /mobile-units", payload: { name: "Van B", modality: "BLOOD_PANEL", daily_capacity: 10 }, as: ProgramManager, captures: { unit_id: $.data.id } }
            - { call: "POST /sponsors", payload: { name: "Acme", sponsor_type: "EMPLOYER", viewer_user_id: "sv1" }, as: ProgramManager, captures: { sponsor_id: $.data.id } }
            - { call: "POST /screening-events", payload: { sponsor_id: "${sponsor_id}", mobile_unit_id: "${unit_id}", modality: "BLOOD_PANEL", site_label: "L1", event_date: "2026-06-11", window_start_min: 540, window_end_min: 720 }, as: ProgramManager, captures: { event_id: $.data.id, ev_v: $.data.version } }
            - { call: "POST /screening-events/${event_id}/publish", payload: { expected_event_version: "${ev_v}" }, as: ProgramManager }
            - { call: "POST /participants", payload: { full_name: "P1", date_of_birth: "1980-01-01", pay_type: "SELF_PAY" }, as: ProgramManager, captures: { p1: $.data.id } }
