      - name: corner_cure_cycle_relinks_revisions_until_the_round_ceiling_stops_it
        claim_type: action_endpoint
        grounds:
          - endpoints.POST /document-presentations/{presentation_id}/cure
          - state_machines.DocumentPresentation.transitions.DISCREPANT_to_CURING
          - state_machines.DocumentPresentation.transitions.CURING_to_PRESENTED
          - entities.PresentationDocumentLink.fields.link_status
