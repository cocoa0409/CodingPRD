              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b1_v}" }
              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED", fuel_lbs: 200 }
              as: OperationsManager
              captures: { f1: $.data.id }
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
            - call: "POST /v1/customers"
              payload: { name: "Cara Diaz", email: "cara@x.com" }
              as: Anonymous
              captures: { c1: $.data.id }
            - call: "POST /v1/flights/${f1}/reservations"
              payload: { customer_id: "${c1}", party_size: 1, declared_weight_lbs: 180, photo_package_tier: "NONE" }
              as: Customer
              as_user_id: "${c1}"
              captures: { r1: $.data.id }
            - call: "POST /v1/reservations/${r1}/events"
              payload: { event_type: "CONFIRM", paid_cents: 29900 }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /v1/reservations/${r1}/passengers"
              payload: { name: "P A", weight_lbs: 180 }
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /v1/reservations/${r1}/events"
              payload: { event_type: "CHECK_IN", additional_paid_cents: 0 }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (flight SCHEDULED, not yet WEATHER_REVIEW)"

      - name: publish_requires_balloon_active
        grounds:
          - state_machines.Flight.DRAFT_to_SCHEDULED
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair Flight→Balloon: PUBLISH on a flight whose balloon is
          GROUNDED fails with ERR_BALLOON_GROUNDED — the flight's transition set
          is gated by the referenced balloon's state.
        test_recipe:
          setup:
            - "Balloon B1 grounded before the flight is published"
            - "Flight F1 in DRAFT referencing B1, GRANTED site, CURRENT pilot"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/launch-sites/${s1}/events"
              payload: { event_type: "GRANT_PERMISSION" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /v1/balloons/${b1}/events"
              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b1_v}" }
              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED", fuel_lbs: 200 }
              as: OperationsManager
              captures: { f1: $.data.id }
            - call: "POST /v1/balloons/${b1}/events"
              payload: { event_type: "GROUND" }
              as: OperationsManager
          trigger:
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BALLOON_GROUNDED"
            - "Flight.${f1}.status == DRAFT (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap: different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: balloon_half_open_window_overlap
        grounds:
          - validations[priority=15]
          - errors[ERR_BALLOON_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Resource: Balloon; semantics: half-open interval overlap on
          [dawn_window_start, dawn_window_end). Overlapping windows conflict, but
          a second flight whose window starts exactly at the first flight's
          dawn_window_end is ALLOWED (adjacent, half-open).
        test_recipe:
          setup:
            - "Balloon B1; flight F1 SCHEDULED window 05:30-07:00Z on 2026-08-10"
            - "Flight F2 (same balloon, second pilot P2 to avoid the pilot rule) window 06:30-08:00Z same date → overlap"
            - "Flight F3 (same balloon, pilot P2) window 07:00-08:30Z same date → adjacent, must pass"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/launch-sites/${s1}/events"
              payload: { event_type: "GRANT_PERMISSION" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /v1/balloons/${b1}/events"
              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b1_v}" }
              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
            - call: "POST /v1/pilots"
              payload: { name: "Jo Miles", certificate_number: "PC-3344", medical_expires_on: "2027-06-30", external_pic_hours_180d: 15.0, external_takeoffs_landings_90d: 4 }
              as: OperationsManager
              captures: { p2: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED", fuel_lbs: 200 }
              as: OperationsManager
              captures: { f1: $.data.id }
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T06:30:00Z", dawn_window_end: "2026-08-10T08:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p2}", kind: "SHARED", fuel_lbs: 200 }
              as: OperationsManager
              captures: { f2: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T07:00:00Z", dawn_window_end: "2026-08-10T08:30:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p2}", kind: "SHARED", fuel_lbs: 200 }
              as: OperationsManager
              captures: { f3: $.data.id }
          trigger:
            - call: "POST /v1/flights/${f2}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
              captures: { err_overlap: $.data.error_id }
            - call: "POST /v1/flights/${f3}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
          assert:
            - "F2 PUBLISH rejected: error_id == ERR_BALLOON_SCHEDULE_CONFLICT (06:30 start inside F1's [05:30, 07:00))"
            - "F3 PUBLISH succeeds: window starts exactly at F1's dawn_window_end — half-open adjacency is allowed"
            - "Flight.${f3}.status == SCHEDULED"

      - name: pilot_same_date_conflict
        grounds:
          - validations[priority=16]
          - errors[ERR_PILOT_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Resource: Pilot; semantics: date-granular (whole scheduled_date), NOT
          interval overlap — two non-overlapping windows on the same date still
          conflict for the same pilot, while a different date is free.
        test_recipe:
          setup:
            - "Pilot P1; flight F1 SCHEDULED 2026-08-10 window 05:30-07:00Z"
            - "Flight F2 same pilot, same date, disjoint window 12:00-13:30Z → conflict"
            - "Flight F3 same pilot, next date 2026-08-11 same window → allowed"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/launch-sites/${s1}/events"
              payload: { event_type: "GRANT_PERMISSION" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /v1/balloons/${b1}/events"
              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b1_v}" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N703AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b2: $.data.id, b2_v: $.data.version }
            - call: "POST /v1/balloons/${b2}/events"
              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b2_v}" }
              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED", fuel_lbs: 200 }
              as: OperationsManager
              captures: { f1: $.data.id }
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T12:00:00Z", dawn_window_end: "2026-08-10T13:30:00Z", launch_site_id: "${s1}", balloon_id: "${b2}", pilot_id: "${p1}", kind: "SHARED", fuel_lbs: 200 }
              as: OperationsManager
              captures: { f2: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-11", dawn_window_start: "2026-08-11T05:30:00Z", dawn_window_end: "2026-08-11T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b2}", pilot_id: "${p1}", kind: "SHARED", fuel_lbs: 200 }
              as: OperationsManager
              captures: { f3: $.data.id }
          trigger:
            - call: "POST /v1/flights/${f2}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
              captures: { err_same_date: $.data.error_id }
            - call: "POST /v1/flights/${f3}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
          assert:
            - "F2 PUBLISH rejected: error_id == ERR_PILOT_SCHEDULE_CONFLICT (disjoint window, same date)"
            - "F3 PUBLISH succeeds: different scheduled_date"
            - "Flight.${f3}.status == SCHEDULED"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant: different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: seat_inventory_conserved_across_book_and_cancel
        grounds:
          - entities.Flight.fields.seats_sold
          - entities.Flight.fields.seats_available
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: seat inventory. For any flight,
          seats_sold + seats_available == balloon.basket_capacity_passengers at
          all times; booking then cancelling a reservation returns the flight to
          the exact pre-booking inventory (no seat leakage).
        test_recipe:
          setup:
            - "SCHEDULED SHARED flight, balloon capacity 6"
            - "Reservation party 2 created and confirmed, then cancelled (clock 2026-08-08, early)"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/launch-sites/${s1}/events"
