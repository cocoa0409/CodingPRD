  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_duplicate_business_safety
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DUPLICATE_ACTIVE_ORDER]
        distinguishing_aspect: |
          Pair = state (priority 4) vs business_safety duplicate (priority 7):
          an order intake that would BOTH target a terminated employee's order
          list via a stale from-state AND duplicate an existing non-terminal
          (order_type, case_number) must surface ERR_NOT_FOUND/ERR_INVALID_STATE
          first — here we activate an already-ACTIVE order that also duplicates
          a sibling, proving state priority wins.
        test_recipe:
          setup:
            - "Employer, employee, two orders with same (CHILD_SUPPORT, CS-DUP): first is ACTIVE, second is EMPLOYEE_NOTIFIED"
            - "Trigger: activate the SECOND order (already past EMPLOYEE_NOTIFIED? no — activate is legal from EMPLOYEE_NOTIFIED). Instead trigger /validate on an order that is already VALIDATED and duplicates the first"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "CA", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 0.75, hourly_floor_cents: 0, fee_deductible_from_wages: true }
              as: employer_payroll_admin
            - call: "POST /authorities"
              payload: { name: "CSA", authority_type: "CHILD_SUPPORT_AGENCY", state_code: "CA", accepted_case_number_pattern: "^CS-" }
              as: employer_payroll_admin
              captures: { auth_cs: $.data.id }
            - call: "POST /employers"
              payload: { legal_name: "E", fein: "99-9999999", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "W", work_state_code: "CA", pay_frequency: "SEMIMONTHLY", hourly_rate_cents: 0, expected_employer_version: "${emp_v}" }
              as: payroll_specialist
              captures: { ee_id: $.data.id, ee_v: $.data.version }
            # First order: will be validated+active
            - call: "POST /employees/${ee_id}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "CS-DUP", order_type: "CHILD_SUPPORT", amount_model: "FIXED_AMOUNT_PER_PERIOD", amount_value: 1000, total_balance_cents: 100000, effective_date: "2026-08-01", expected_employee_version: "${ee_v}" }
              as: payroll_specialist
              captures: { ord_1: $.data.id }
            - call: "POST /orders/${ord_1}/validate"
              payload: {}
              as: payroll_specialist
            # Second order: same (type, case). Intake-time duplicate check fires at validate (state rule missing? no — both checks fire at validate; priority: existence/state first, then duplicate).
            - call: "GET /employees/${ee_id}"
              as: payroll_specialist
              captures: { ee_v2: $.data.version }
            - call: "POST /employees/${ee_id}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "CS-DUP", order_type: "CHILD_SUPPORT", amount_model: "FIXED_AMOUNT_PER_PERIOD", amount_value: 2000, total_balance_cents: 100000, effective_date: "2026-08-01", expected_employee_version: "${ee_v2}" }
              as: payroll_specialist
              captures: { ord_2: $.data.id }
            # Drive ord_2 to VALIDATED so a second validate is a state violation that ALSO would duplicate
            - call: "POST /orders/${ord_2}/reject"
              payload: { reason: "duplicate intake" }
              as: payroll_specialist
          trigger:
            # ord_2 is REJECTED (terminal). Calling validate is a state violation (priority 4)
            # AND ord_2 duplicates ord_1 (priority 7). State must win.
            - call: "POST /orders/${ord_2}/validate"
              payload: {}
              as: payroll_specialist
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_INVALID_STATE"
            - "trigger response error_id != ERR_DUPLICATE_ACTIVE_ORDER"

      - name: referential_beats_fiscal_occ
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_CASE_NUMBER_PATTERN]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          Pair = business_referential (priority 6) vs business_fiscal OCC
          (priority 8): an order intake whose case_number fails the authority
          pattern AND whose expected_employee_version is stale must surface
          ERR_CASE_NUMBER_PATTERN (referential) before ERR_STALE_VERSION —
          proving the referential-before-fiscal ordering across categories.
        test_recipe:
          setup:
            - "Employer, employee at version V; authority with pattern ^CS-"
            - "Between the client's read (version captured) and the intake call, another order creation bumps Employee.version so the OCC token is stale"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: employer_payroll_admin
            - call: "POST /state-rules"
              payload: { state_code: "CA", caps: { CHILD_SUPPORT: 0.50, FEDERAL_TAX_LEVY: 0.65, STUDENT_LOAN: 0.15, CREDITOR: 0.25 }, min_wage_multiplier: 0.75, hourly_floor_cents: 0, fee_deductible_from_wages: true }
              as: employer_payroll_admin
            - call: "POST /authorities"
              payload: { name: "CSA", authority_type: "CHILD_SUPPORT_AGENCY", state_code: "CA", accepted_case_number_pattern: "^CS-" }
              as: employer_payroll_admin
              captures: { auth_cs: $.data.id }
            - call: "POST /employers"
              payload: { legal_name: "E", fein: "10-1010101", remittance_timing: "SAME_DAY", payroll_calendar: { period_start: "2026-08-01", period_end: "2026-08-15", pay_date: "2026-08-15" }, administrative_fee_policy: "NONE" }
              as: employer_payroll_admin
              captures: { emp_id: $.data.id, emp_v: $.data.version }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", full_name: "W", work_state_code: "CA", pay_frequency: "SEMIMONTHLY", hourly_rate_cents: 0, expected_employer_version: "${emp_v}" }
              as: payroll_specialist
              captures: { ee_id: $.data.id, ee_v: $.data.version }
            # Bump employee version via a legitimate order creation
            - call: "POST /employees/${ee_id}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "CS-OK", order_type: "CHILD_SUPPORT", amount_model: "FIXED_AMOUNT_PER_PERIOD", amount_value: 1000, total_balance_cents: 100000, effective_date: "2026-08-01", expected_employee_version: "${ee_v}" }
              as: payroll_specialist
          trigger:
            # Now ee_v is stale AND case_number fails pattern. Referential (6) beats OCC (8).
            - call: "POST /employees/${ee_id}/orders"
              payload: { issuing_authority_id: "${auth_cs}", case_number: "BAD-1", order_type: "CHILD_SUPPORT", amount_model: "FIXED_AMOUNT_PER_PERIOD", amount_value: 1000, total_balance_cents: 100000, effective_date: "2026-08-01", expected_employee_version: "${ee_v}" }
              as: payroll_specialist
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_CASE_NUMBER_PATTERN"
            - "trigger response error_id != ERR_STALE_VERSION"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: floor_equality_zero_pool
        grounds:
          - calculations.withholding_waterfall
          - entities.PayStatement.fields.net_pay_cents
        distinguishing_aspect: |
          Metric = pool at the exact protected-floor boundary, reached via
          POST /payroll-runs/{id}/pay: when disposable_earnings_cents equals
          the TX hourly floor (hours 40 x 1000 = 40000 == DE 40000), pool is
          exactly 0 (>= vs >), the order awards 0, and net_pay == DE — no
          withholding may dip below the floor even by one cent.
        test_recipe:
          setup:
            - "TX employee, hourly_floor 1000; statement gross 60000, deductions 20000 -> DE 40000; hours 40 -> floor 40000"
            - "One ACTIVE CHILD_SUPPORT FIXED 5000 order"
