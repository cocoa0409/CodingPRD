            - "A DELETE DataRequest has been approved, so it is SCHEDULED with scheduled_purge_at = 2026-05-08T00:00:00Z."
          setup_api_calls:
            - call: "POST /dna/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
