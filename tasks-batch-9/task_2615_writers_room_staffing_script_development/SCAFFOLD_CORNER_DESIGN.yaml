      - name: a_conditional_clearance_decision_without_a_note_is_refused
        claim_type: conditional_validation
        grounds:
          - validations.priority_51_business_safety
          - errors.ERR_CONDITIONAL_NOTE_REQUIRED
          - errors.ERR_ITEM_ALREADY_DECIDED
          - calculations.clearance_risk_score
        distinguishing_aspect: |
          conditional_note is schema-optional, so its absence passes the priority 10 body check and must be
          caught at priority 51 with 422 ERR_CONDITIONAL_NOTE_REQUIRED - and only for the CONDITIONAL
          branch: the very same payload shape decides CLEARED without a note. The refused decision must
          leave the item SUBMITTED, so the retry with a note still works, while a third decision on the now
          decided item is refused at priority 30 with ERR_ITEM_ALREADY_DECIDED.
        test_recipe:
          setup:
            - "Review CR on A1 holds IT1 (DEPICTION, weight 25) and IT2 (NAME, weight 5), both SUBMITTED."
          setup_api_calls:
            - *C_AG
            - *C_SR
            - *C_W1
            - *C_W2
            - *C_SE
            - *C_AW1
            - *C_AW2
            - *C_RM
            - *C_OPEN
            - *C_S1
            - *C_ACC1
            - *C_GRV
            - *C_S2
            - *C_ACC2
            - *C_ACTIVATE
            - *C_EP1
            - *C_A1
            - *C_MLIST
            - *C_D1
            - *C_D2
            - *C_D3
            - *C_CR
            - *C_IT1
            - *C_IT2
          trigger:
            - call: "POST /clearance-items/${it1}/decide"
              payload: { decision: "CONDITIONAL" }
              as: LegalCounsel
            - call: "POST /clearance-items/${it1}/decide"
              payload: { decision: "CONDITIONAL", conditional_note: "Change the character's home state and re-submit for a read." }
              as: LegalCounsel
            - call: "POST /clearance-items/${it1}/decide"
              payload: { decision: "CLEARED" }
              as: LegalCounsel
            - call: "POST /clearance-items/${it2}/decide"
              payload: { decision: "CLEARED" }
              as: LegalCounsel
          assert:
            - "Trigger call 1 returns 422 ERR_CONDITIONAL_NOTE_REQUIRED and ClearanceItem.${it1}.decision is still SUBMITTED with risk_weight 25 and conditional_note null"
            - "Trigger call 2 returns 200: ClearanceItem.${it1}.decision == CONDITIONAL, risk_weight == 25 (25 * the CONDITIONAL multiplier 1) and the note is stored verbatim"
            - "ClearanceReview.${cr}.risk_score == 25, decided_item_count == 1, posture == CONDITIONAL (25 > 0 and 25 <= the escalation score 30)"
            - "Trigger call 3 returns 409 ERR_ITEM_ALREADY_DECIDED and the CONDITIONAL decision survives"
            - "Trigger call 4 returns 200 with no note required for a CLEARED decision: ClearanceItem.${it2}.risk_weight == 0, review risk_score == 25, decided_item_count == 2 and posture == CONDITIONAL"
            - "Episode.${ep1}.clearance_posture == CONDITIONAL"

