  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_single_active_finance_occupation
        grounds:
          - validations[priority=8]
          - entities.Vehicle.fields.status
          - state_machines.Lease.MATURING_to_RETURNED
        distinguishing_aspect: "Vehicle resource: a Vehicle can be occupied by at most one open finance contract at a time (point-occupation interval semantics: AVAILABLE->FINANCED on origination, released on payoff/return). A second origination while FINANCED collides (ERR_VEHICLE_UNAVAILABLE); after a lease RETURN releases it, re-origination succeeds."
