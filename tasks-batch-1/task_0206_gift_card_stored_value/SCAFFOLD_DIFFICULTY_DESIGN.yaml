# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Retail Gift Card & Stored-Value Program — EXPERT
# 9 rule_ids × ≥2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: balance_authorized_vs_settled_diverge_with_hold
        grounds:
          - calculations.card_balance_dual_variant
          - entities.GiftCard.fields.available_balance_cents
          - entities.GiftCard.fields.settled_balance_cents
          - entities.AuthorizationHold.fields.amount_cents
        distinguishing_aspect: |
          On a GiftCard the settled_balance variant ignores holds while the
          authorized_balance variant subtracts ACTIVE holds; with one 2000-cent
          hold on a 5000-cent card the two variants read 5000 vs 3000 — same card,
          two numbers (entity domain: GiftCard balance).
        test_recipe:
          setup:
            - "Program (reload_min 500, cap 100000); a CLEAR ACTIVE card with settled 5000; one ACTIVE hold of 2000 on it."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000, hold_ttl_seconds: 900 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 5000 }
              as: StoreAssociate
            - call: "POST /v1/holds"
              payload: { card_id: "${card}", amount_cents: 2000 }
              as: StoreAssociate
              captures: { hold: $.data.id }
          trigger:
            - call: "GET /v1/cards/${card}"
              payload: {}
              as: StoreAssociate
          assert:
            - "GiftCard.${card}.settled_balance_cents == 5000"
            - "GiftCard.${card}.pending_hold_cents == 2000"
            - "GiftCard.${card}.available_balance_cents == 3000"

      - name: breakage_recognize_vs_escheat_diverge_same_balance
        grounds:
          - calculations.breakage_dual_variant
          - entities.Program.fields.breakage_recognized_cents
          - entities.Program.fields.escheat_liability_cents
          - state_machines.GiftCard.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          The breakage calc operates on the Program revenue/liability domain (not
          GiftCard balance): a dormant 4000-cent card in a RECOGNIZE state books
          breakage_recognized_cents=4000, but in an ESCHEAT state (rate 0.60) books
          escheat_liability_cents=2400 — same residual, different number on a
          different entity domain than instance 1.
        test_recipe:
          setup:
            - "Program with two StateRules: FL RECOGNIZE expiration_allowed, CA ESCHEAT rate 0.60 expiration_allowed; two cards each settled 4000, one FL one CA; clock advanced 13 months past activation."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/state-rules"
              payload: { program_id: "${prog}", state_code: "FL", expiration_allowed: true, dormancy_fee_allowed: false, breakage_policy: "RECOGNIZE" }
              as: ProgramAdmin
            - call: "POST /v1/state-rules"
              payload: { program_id: "${prog}", state_code: "CA", expiration_allowed: true, dormancy_fee_allowed: false, breakage_policy: "ESCHEAT", escheat_rate: 0.60 }
              as: ProgramAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2025-01-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card_fl: $.data.id }
            - call: "POST /v1/cards/${card_fl}/activate"
              payload: { initial_load_cents: 4000 }
              as: StoreAssociate
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "CA" }
              as: StoreAssociate
              captures: { card_ca: $.data.id }
            - call: "POST /v1/cards/${card_ca}/activate"
              payload: { initial_load_cents: 4000 }
              as: StoreAssociate
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /v1/cards/${card_fl}/assess-dormancy"
              payload: {}
              as: ProgramAdmin
            - call: "POST /v1/cards/${card_ca}/assess-dormancy"
              payload: {}
              as: ProgramAdmin
            - call: "GET /v1/programs/${prog}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "GiftCard.${card_fl}.lifecycle_status == EXPIRED"
            - "GiftCard.${card_ca}.lifecycle_status == EXPIRED"
            - "Program.${prog}.breakage_recognized_cents == 4000"
            - "Program.${prog}.escheat_liability_cents == 2400"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: split_tender_waterfall_order_sensitive
        grounds:
          - calculations.split_tender_allocation
          - entities.Redemption.fields.card_id_order
          - entities.RedemptionLeg.fields.leg_amount_cents
          - state_machines.Redemption.DRAFT_to_SETTLED
        distinguishing_aspect: |
          Mode (a): waterfall allocation with >=3 inputs (demand + per-card avail +
          order) and nested min/break branching; demand 5000 over cards
          avail [3000,1500,4000] in order [A,B,C] yields legs A=3000,B=1500,C=500,
          a non-linear interaction distinct from the rounding mode of instance 2.
        test_recipe:
          setup:
            - "Three ACTIVE CLEAR cards A=3000, B=1500, C=4000 in one program; a DRAFT redemption requesting 5000 with card_id_order [A,B,C]."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { a: $.data.id }
            - call: "POST /v1/cards/${a}/activate"
              payload: { initial_load_cents: 3000 }
              as: StoreAssociate
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { b: $.data.id }
            - call: "POST /v1/cards/${b}/activate"
              payload: { initial_load_cents: 1500 }
              as: StoreAssociate
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { c: $.data.id }
            - call: "POST /v1/cards/${c}/activate"
              payload: { initial_load_cents: 4000 }
              as: StoreAssociate
            - call: "POST /v1/redemptions"
              payload: { program_id: "${prog}", requested_amount_cents: 5000, card_id_order: ["${a}", "${b}", "${c}"] }
              as: StoreAssociate
              captures: { red: $.data.id, rv: $.data.version }
          trigger:
            - call: "POST /v1/redemptions/${red}/settle"
              payload: { expected_redemption_version: "${rv}" }
              as: StoreAssociate
          assert:
            - "Redemption.${red}.status == SETTLED"
            - "Redemption.${red}.allocated_amount_cents == 5000"
            - "GiftCard.${a}.settled_balance_cents == 0"
            - "GiftCard.${b}.settled_balance_cents == 0"
            - "GiftCard.${c}.settled_balance_cents == 3500"

      - name: bulk_order_round_per_card_then_multiply
        grounds:
          - calculations.bulk_order_pricing
          - entities.BulkOrder.fields.net_invoice_cents
          - state_machines.BulkOrder.QUOTED_to_CONFIRMED
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — round each card's
          discounted price to whole cents (2413) THEN multiply by card_count 7 =
          16891, whereas sum-then-round would give 16888; the scaffold pins
          round-per-card-then-multiply, a different combinatorial axis than the
          waterfall of instance 1.
        test_recipe:
          setup:
            - "Program with b2b_discount_pct 0.035; corporate Customer; a QUOTED BulkOrder of card_count 7, face_value 2500."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", b2b_discount_pct: 0.035 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "corp@x.com", full_name: "Corp Co", residence_state_code: "FL", is_corporate: true }
              as: ProgramAdmin
              captures: { buyer: $.data.id }
            - call: "POST /v1/bulk-orders"
              payload: { program_id: "${prog}", buyer_customer_id: "${buyer}", card_count: 7, face_value_cents: 2500, state_code: "FL" }
              as: B2BBuyer
              as_user_id: "${buyer}"
              captures: { bo: $.data.id }
          trigger:
            - call: "POST /v1/bulk-orders/${bo}/confirm"
              payload: {}
              as: B2BBuyer
              as_user_id: "${buyer}"
          assert:
            - "BulkOrder.${bo}.status == CONFIRMED"
            - "BulkOrder.${bo}.net_invoice_cents == 16891"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: giftcard_parallel_lifecycle_and_risk_dimensions
        grounds:
          - state_machines.GiftCard.CLEAR_to_FLAGGED
          - state_machines.GiftCard.FLAGGED_to_FROZEN_RISK
          - entities.GiftCard.fields.lifecycle_status
          - entities.GiftCard.fields.risk_status
        distinguishing_aspect: |
          GiftCard carries two independent state dimensions: flagging then freezing
          drives risk_status CLEAR→FLAGGED→FROZEN_RISK while lifecycle_status stays
          ACTIVE throughout — parallel dimensions on one entity (GiftCard), distinct
          from the branching machine of instance 2.
        test_recipe:
          setup:
            - "An ACTIVE CLEAR card with settled 5000 and a single ACTIVE hold of 1000."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 5000 }
              as: StoreAssociate
            - call: "POST /v1/holds"
              payload: { card_id: "${card}", amount_cents: 1000 }
              as: StoreAssociate
              captures: { hold: $.data.id }
            - call: "POST /v1/cards/${card}/flag"
              payload: {}
              as: FraudAnalyst
          trigger:
            - call: "POST /v1/cards/${card}/freeze"
              payload: {}
              as: FraudAnalyst
            - call: "GET /v1/cards/${card}"
              payload: {}
              as: FraudAnalyst
          assert:
            - "GiftCard.${card}.risk_status == FROZEN_RISK"
            - "GiftCard.${card}.lifecycle_status == ACTIVE"
            - "GiftCard.${card}.pending_hold_cents == 0"
            - "GiftCard.${card}.settled_balance_cents == 5000"

      - name: refund_request_revision_loop_cycle
        grounds:
          - state_machines.RefundRequest.PENDING_to_NEEDS_REVISION
          - state_machines.RefundRequest.NEEDS_REVISION_to_PENDING
          - entities.RefundRequest.fields.requested_refund_cents
          - entities.RefundRequest.fields.status
        distinguishing_aspect: |
          RefundRequest cycles PENDING→NEEDS_REVISION→PENDING (a revision loop) and
          the resubmit overwrites requested_refund_cents; this cyclic shape sits on
          a different entity (RefundRequest) than the parallel GiftCard of instance 1.
        test_recipe:
          setup:
            - "An ACTIVE card owned by a customer; a PENDING RefundRequest of 1000 on it."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "cust@x.com", full_name: "Cust", residence_state_code: "FL" }
              as: ProgramAdmin
              captures: { cust: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL", owner_customer_id: "${cust}" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 5000 }
              as: StoreAssociate
            - call: "POST /v1/refunds"
              payload: { card_id: "${card}", requested_refund_cents: 1000 }
              as: Customer
              as_user_id: "${cust}"
              captures: { ref: $.data.id }
            - call: "POST /v1/refunds/${ref}/request-revision"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /v1/refunds/${ref}/resubmit"
              payload: { requested_refund_cents: 750 }
              as: Customer
              as_user_id: "${cust}"
          assert:
            - "RefundRequest.${ref}.status == PENDING"
            - "RefundRequest.${ref}.requested_refund_cents == 750"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: replacement_approve_three_hop_cascade
        grounds:
          - state_machines.ReplacementRequest.OPEN_to_APPROVED
          - state_machines.GiftCard.ACTIVE_to_VOIDED
          - calculations.replacement_transfer
          - entities.GiftCard.fields.replaced_by_card_id
        distinguishing_aspect: |
          Depth-3 chain from one trigger (approve): approve → old card ACTIVE→VOIDED
          (hop1) → that void posts a TRANSFER_OUT zeroing old card (hop2) → which
          posts a TRANSFER_IN crediting the freshly minted new card and recomputes
          Program.outstanding_liability (hop3); each hop caused by the prior, not by
          the original approve.
        test_recipe:
          setup:
            - "An ACTIVE CLEAR card owned by a customer with settled 3000; an OPEN ReplacementRequest (reason FRAUD) on it."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "cust@x.com", full_name: "Cust", residence_state_code: "FL" }
              as: ProgramAdmin
              captures: { cust: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "PHYSICAL", state_code: "FL", owner_customer_id: "${cust}" }
              as: StoreAssociate
              captures: { old: $.data.id }
            - call: "POST /v1/cards/${old}/activate"
              payload: { initial_load_cents: 3000 }
              as: StoreAssociate
              captures: { ov: $.data.version }
            - call: "POST /v1/replacements"
              payload: { old_card_id: "${old}", reason: "FRAUD" }
              as: FraudAnalyst
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /v1/replacements/${rep}/approve"
              payload: { expected_old_card_version: "${ov}" }
              as: FraudAnalyst
              captures: { newcard: $.data.new_card_id }
            - call: "GET /v1/cards/${old}"
              payload: {}
              as: FraudAnalyst
          assert:
            - "ReplacementRequest.${rep}.status == APPROVED"
            - "ReplacementRequest.${rep}.transferred_amount_cents == 3000"
            - "GiftCard.${old}.lifecycle_status == VOIDED"
            - "GiftCard.${old}.settled_balance_cents == 0"
            - "GiftCard.${old}.replaced_by_card_id == ${newcard}"
            - "GiftCard.${newcard}.settled_balance_cents == 3000"

      - name: bulk_activate_two_hop_cascade_liability
        grounds:
          - state_machines.BulkOrder.CONFIRMED_to_ACTIVATED
          - state_machines.GiftCard.INACTIVE_to_ACTIVE
          - entities.Program.fields.outstanding_liability_cents
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (bulk-order activate): activate →
          mint card_count cards each driven INACTIVE→ACTIVE with a LOAD (hop1) →
          Program.outstanding_liability recomputed to card_count*face_value (hop2);
          a distinct propagation pattern from the replacement cascade of instance 1.
        test_recipe:
          setup:
            - "Program; corporate buyer; a CONFIRMED BulkOrder of card_count 4, face_value 2500."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", b2b_discount_pct: 0.035 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "corp@x.com", full_name: "Corp", residence_state_code: "FL", is_corporate: true }
              as: ProgramAdmin
              captures: { buyer: $.data.id }
            - call: "POST /v1/bulk-orders"
              payload: { program_id: "${prog}", buyer_customer_id: "${buyer}", card_count: 4, face_value_cents: 2500, state_code: "FL" }
              as: B2BBuyer
              as_user_id: "${buyer}"
              captures: { bo: $.data.id }
            - call: "POST /v1/bulk-orders/${bo}/confirm"
              payload: {}
              as: B2BBuyer
              as_user_id: "${buyer}"
          trigger:
            - call: "POST /v1/bulk-orders/${bo}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "GET /v1/programs/${prog}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "BulkOrder.${bo}.status == ACTIVATED"
            - "Program.${prog}.outstanding_liability_cents == 10000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_invalid_beats_insufficient_balance
        grounds:
          - validations[priority=8]
          - validations[priority=14]
          - state_machines.Redemption.DRAFT_to_SETTLED
        distinguishing_aspect: |
          Error-category pair state(priority 8, ERR_INVALID_STATE) vs
          business_fiscal(priority 14, ERR_INSUFFICIENT_BALANCE): a redemption over a
          card that is INACTIVE AND under-funded must return ERR_INVALID_STATE (the
          higher-priority state check wins), not ERR_INSUFFICIENT_BALANCE.
        test_recipe:
          setup:
            - "One ACTIVE card (settled 100) and one INACTIVE card (never activated); a DRAFT redemption for 5000 with card_id_order [inactive, active]."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { inact: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { act: $.data.id }
            - call: "POST /v1/cards/${act}/activate"
              payload: { initial_load_cents: 1000 }
              as: StoreAssociate
            - call: "POST /v1/redemptions"
              payload: { program_id: "${prog}", requested_amount_cents: 5000, card_id_order: ["${inact}", "${act}"] }
              as: StoreAssociate
              captures: { red: $.data.id, rv: $.data.version }
          trigger:
            - call: "POST /v1/redemptions/${red}/settle"
              payload: { expected_redemption_version: "${rv}" }
              as: StoreAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "${eid} == ERR_INVALID_STATE"

      - name: referential_beats_constraint_on_bulk_quote
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - entities.BulkOrder.fields.buyer_customer_id
          - entities.BulkOrder.fields.card_count
        distinguishing_aspect: |
          Error-category pair business_referential(priority 5, ERR_REFERENCE_NOT_FOUND)
          vs business_constraint(priority 6, ERR_INVALID_REDEMPTION): a bulk-order
          quote (POST /v1/bulk-orders) naming a non-existent buyer AND card_count 0
          returns ERR_REFERENCE_NOT_FOUND (priority 5 beats 6) — a different category
          pair than instance 1.
        test_recipe:
          setup:
            - "A program exists; no customer with the referenced buyer id exists."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", b2b_discount_pct: 0.035 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /v1/bulk-orders"
              payload: { program_id: "${prog}", buyer_customer_id: "00000000-0000-4000-8000-000000000000", card_count: 0, face_value_cents: 2500, state_code: "FL" }
              as: ProgramAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 422"
            - "${eid} == ERR_REFERENCE_NOT_FOUND"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: dormancy_threshold_inclusive_at_exactly_twelve_months
        grounds:
          - calculations.dormancy_assessment
          - validations[priority=12]
          - state_machines.GiftCard.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Numeric threshold boundary on months_inactive via assess-dormancy: at
          exactly 12 whole months inactive the >= test is TRUE so the card expires;
          this >= boundary on a month-count metric is distinct from the empty/zero
          metric of instance 2.
        test_recipe:
          setup:
            - "FL StateRule (RECOGNIZE, expiration_allowed, dormancy_threshold_months 12); a card activated 2025-02-01 with settled 4000; clock at 2026-02-01 (exactly 12 months)."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/state-rules"
              payload: { program_id: "${prog}", state_code: "FL", expiration_allowed: true, dormancy_fee_allowed: false, breakage_policy: "RECOGNIZE", dormancy_threshold_months: 12 }
              as: ProgramAdmin
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2025-02-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 4000 }
              as: StoreAssociate
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /v1/cards/${card}/assess-dormancy"
              payload: {}
              as: ProgramAdmin
          assert:
            - "GiftCard.${card}.lifecycle_status == EXPIRED"
            - "Program.${prog}.breakage_recognized_cents == 4000"

      - name: empty_card_order_redemption_draft_rejected
        grounds:
          - validations[priority=6]
          - entities.Redemption.fields.card_id_order
          - errors[ERR_INVALID_REDEMPTION]
        distinguishing_aspect: |
          Empty-collection boundary on a different metric and endpoint: drafting a
          redemption with card_id_order = [] (zero cards) at POST /v1/redemptions is
          rejected with ERR_INVALID_REDEMPTION; the empty-set edge is distinct from
          the numeric >= threshold of instance 1.
        test_recipe:
          setup:
            - "A program exists."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /v1/redemptions"
              payload: { program_id: "${prog}", requested_amount_cents: 1000, card_id_order: [] }
              as: StoreAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 422"
            - "${eid} == ERR_INVALID_REDEMPTION"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: redemption_settle_requires_every_card_active
        grounds:
          - state_machines.Redemption.DRAFT_to_SETTLED
          - entities.GiftCard.fields.lifecycle_status
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair Redemption→GiftCard: Redemption DRAFT→SETTLED is blocked when
          any card in card_id_order is not ACTIVE (here one VOIDED card) →
          ERR_INVALID_STATE; the dependency crosses Redemption→GiftCard, distinct
          from the pair in instance 2.
        test_recipe:
          setup:
            - "One ACTIVE card (settled 5000) and one card VOIDED via an approved replacement; a DRAFT redemption for 1000 over [voided, active]."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { good: $.data.id }
            - call: "POST /v1/cards/${good}/activate"
              payload: { initial_load_cents: 5000 }
              as: StoreAssociate
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { bad: $.data.id }
            - call: "POST /v1/cards/${bad}/activate"
              payload: { initial_load_cents: 2000 }
              as: StoreAssociate
              captures: { badv: $.data.version }
            - call: "POST /v1/replacements"
              payload: { old_card_id: "${bad}", reason: "LOST" }
              as: FraudAnalyst
              captures: { rep: $.data.id }
            - call: "POST /v1/replacements/${rep}/approve"
              payload: { expected_old_card_version: "${badv}" }
              as: FraudAnalyst
            - call: "POST /v1/redemptions"
              payload: { program_id: "${prog}", requested_amount_cents: 1000, card_id_order: ["${bad}", "${good}"] }
              as: StoreAssociate
              captures: { red: $.data.id, rv: $.data.version }
          trigger:
            - call: "POST /v1/redemptions/${red}/settle"
              payload: { expected_redemption_version: "${rv}" }
              as: StoreAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "${eid} == ERR_INVALID_STATE"

      - name: reload_blocked_when_card_risk_frozen
        grounds:
          - state_machines.GiftCard.ACTIVE_to_ACTIVE
          - state_machines.GiftCard.FLAGGED_to_FROZEN_RISK
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair Reload(GiftCard.lifecycle)→GiftCard.risk_status: a reload on an
          ACTIVE card is rejected because the same card's risk_status is FROZEN_RISK →
          ERR_CARD_RISK_FROZEN; this couples the lifecycle action to the independent
          risk dimension, a different pairing than Redemption→GiftCard.lifecycle in
          instance 1.
        test_recipe:
          setup:
            - "An ACTIVE card with settled 5000, flagged then frozen (risk_status FROZEN_RISK)."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 5000 }
              as: StoreAssociate
            - call: "POST /v1/cards/${card}/flag"
              payload: {}
              as: FraudAnalyst
            - call: "POST /v1/cards/${card}/freeze"
              payload: {}
              as: FraudAnalyst
          trigger:
            - call: "POST /v1/cards/${card}/reload"
              payload: { amount_cents: 1000 }
              as: StoreAssociate
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "${eid} == ERR_CARD_RISK_FROZEN"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: dormancy_waiver_closed_interval_overlap_rejected
        grounds:
          - validations[priority=12]
          - entities.DormancyWaiver.fields.window_start
          - entities.DormancyWaiver.fields.window_end
          - errors[ERR_WAIVER_OVERLAP]
        distinguishing_aspect: |
          Resource GiftCard/DormancyWaiver with CLOSED-interval [start,end] semantics:
          a second waiver whose start equals the first waiver's end (touching
          endpoints) overlaps and is rejected — closed-interval adjacency counts as
          overlap, distinct from the half-open semantics of instance 2.
        test_recipe:
          setup:
            - "An ACTIVE card with one ACTIVE DormancyWaiver over [2026-01-01, 2026-06-01]."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL" }
              as: StoreAssociate
              captures: { card: $.data.id }
            - call: "POST /v1/cards/${card}/activate"
              payload: { initial_load_cents: 4000 }
              as: StoreAssociate
            - call: "POST /v1/dormancy-waivers"
              payload: { card_id: "${card}", window_start: "2026-01-01T00:00:00Z", window_end: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { w1: $.data.id }
          trigger:
            - call: "POST /v1/dormancy-waivers"
              payload: { card_id: "${card}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "response.status == 409"
            - "${eid} == ERR_WAIVER_OVERLAP"

      - name: promo_campaign_half_open_adjacent_allowed_overlap_rejected
        grounds:
          - validations[priority=12]
          - entities.PromoCampaign.fields.window_start
          - entities.PromoCampaign.fields.window_end
          - errors[ERR_CAMPAIGN_OVERLAP]
        distinguishing_aspect: |
          Resource Program/PromoCampaign with HALF-OPEN [start,end) semantics: a
          second campaign starting exactly at the first's window_end is ALLOWED
          (touching endpoints do not overlap under half-open), but one starting
          strictly before window_end is rejected — different interval arithmetic on a
          different resource than the closed-interval waiver of instance 1.
        test_recipe:
          setup:
            - "A program with one campaign over [2026-01-01, 2026-03-01)."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/campaigns"
              payload: { program_id: "${prog}", name: "Winter", bonus_pct: 0.10, window_start: "2026-01-01T00:00:00Z", window_end: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /v1/campaigns"
              payload: { program_id: "${prog}", name: "Spring", bonus_pct: 0.05, window_start: "2026-03-01T00:00:00Z", window_end: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /v1/campaigns"
              payload: { program_id: "${prog}", name: "Overlap", bonus_pct: 0.08, window_start: "2026-02-15T00:00:00Z", window_end: "2026-04-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "PromoCampaign.${c2}.status == SCHEDULED"
            - "response.status == 409"
            - "${eid} == ERR_CAMPAIGN_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: replacement_transfer_conserves_program_liability
        grounds:
          - calculations.replacement_transfer
          - state_machines.ReplacementRequest.OPEN_to_APPROVED
          - entities.Program.fields.outstanding_liability_cents
        distinguishing_aspect: |
          Conserved quantity = old_card.settled + new_card.settled (per-pair value):
          the forward TRANSFER_OUT and compensating TRANSFER_IN leave
          old.settled + new.settled == old.settled(pre) == 3000 and
          Program.outstanding_liability unchanged at 3000; a different conserved
          quantity than the redemption-reversal invariant of instance 2.
        test_recipe:
          setup:
            - "Only one card exists in the program: an ACTIVE card with settled 3000; an OPEN replacement on it. Program.outstanding_liability == 3000 before approval."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "PHYSICAL", state_code: "FL" }
              as: StoreAssociate
              captures: { old: $.data.id }
            - call: "POST /v1/cards/${old}/activate"
              payload: { initial_load_cents: 3000 }
              as: StoreAssociate
              captures: { ov: $.data.version }
            - call: "POST /v1/replacements"
              payload: { old_card_id: "${old}", reason: "DAMAGED" }
              as: FraudAnalyst
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /v1/replacements/${rep}/approve"
              payload: { expected_old_card_version: "${ov}" }
              as: FraudAnalyst
              captures: { newcard: $.data.new_card_id }
            - call: "GET /v1/programs/${prog}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "GiftCard.${old}.settled_balance_cents == 0"
            - "GiftCard.${newcard}.settled_balance_cents == 3000"
            - "Program.${prog}.outstanding_liability_cents == 3000"

      - name: full_refund_reversal_restores_card_balances
        grounds:
          - state_machines.RefundRequest.PENDING_to_APPLIED
          - state_machines.Redemption.SETTLED_to_VOIDED
          - entities.LedgerEntry.fields.reverses_entry_id
          - entities.Redemption.fields.allocated_amount_cents
        distinguishing_aspect: |
          Conserved quantity = each card's settled_balance across redeem-then-refund:
          a full-amount refund reverses every leg's REDEEM debit so card balances
          return to their pre-redemption values (A 3000, B 1500) and the redemption
          is VOIDED — settled-balance conservation, a different conserved quantity
          than the per-pair transfer of instance 1.
        test_recipe:
          setup:
            - "Two ACTIVE cards A=3000, B=1500 owned by a customer; a SETTLED redemption of 4500 over [A,B] (A→0, B→0); a PENDING full-amount RefundRequest of 4500 referencing that redemption on card A."
          setup_api_calls:
            - call: "POST /v1/programs"
              payload: { name: "Acme", reload_min_cents: 500, reload_max_balance_cents: 100000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "cust@x.com", full_name: "Cust", residence_state_code: "FL" }
              as: ProgramAdmin
              captures: { cust: $.data.id }
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL", owner_customer_id: "${cust}" }
              as: StoreAssociate
              captures: { a: $.data.id }
            - call: "POST /v1/cards/${a}/activate"
              payload: { initial_load_cents: 3000 }
              as: StoreAssociate
            - call: "POST /v1/cards"
              payload: { program_id: "${prog}", form_factor: "DIGITAL", state_code: "FL", owner_customer_id: "${cust}" }
              as: StoreAssociate
              captures: { b: $.data.id }
            - call: "POST /v1/cards/${b}/activate"
              payload: { initial_load_cents: 1500 }
              as: StoreAssociate
            - call: "POST /v1/redemptions"
              payload: { program_id: "${prog}", requested_amount_cents: 4500, card_id_order: ["${a}", "${b}"], customer_id: "${cust}" }
              as: StoreAssociate
              captures: { red: $.data.id, rv: $.data.version }
            - call: "POST /v1/redemptions/${red}/settle"
              payload: { expected_redemption_version: "${rv}" }
              as: StoreAssociate
            - call: "POST /v1/refunds"
              payload: { card_id: "${a}", requested_refund_cents: 4500, redemption_id: "${red}" }
              as: ProgramAdmin
              captures: { ref: $.data.id }
          trigger:
            - call: "POST /v1/refunds/${ref}/approve"
              payload: {}
              as: ProgramAdmin
            - call: "GET /v1/redemptions/${red}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "RefundRequest.${ref}.status == APPLIED"
            - "Redemption.${red}.status == VOIDED"
            - "GiftCard.${a}.settled_balance_cents == 3000"
            - "GiftCard.${b}.settled_balance_cents == 1500"
