          - entities.StatementLine.fields.admin_fee_cents
          - entities.RoyaltyStatement.fields.admin_fee_cents
        distinguishing_aspect: |
          The fee tier is a function of the payable amount and the payable amount is gross minus
          the fee, so the formula looks circular; the pinned order keys the tier on the LINE's
