      - name: request_with_a_blank_role_header_is_rejected_before_anything_else
        claim_type: role_denied
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          Priority 1 runs ahead of priority 4 existence and priority 3 schema, so an unauthenticated request
          that ALSO carries an unknown store id and a malformed body still answers 401 and not 404 or 400 -
          the ordering is the claim. A syntactically present but undeclared role (BaristaTrainee) is a
          different failure: the headers are there, so the answer is still 401 ERR_UNAUTHENTICATED per priority 1's
          check that X-User-Role is a DECLARED role, which the pair of calls below pins down explicitly.
        test_recipe:
          setup:
            - "no fixtures are required; the API is reachable and the logical clock is at its default 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /orders"
              payload: { store_id: "00000000-0000-0000-0000-000000000000", channel: "NOT_A_CHANNEL" }
              as: "(request sent with no X-User-Role and no X-User-ID header)"
              captures: { e_noauth: $.data.error_id }
            - call: "GET /stores/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: "(request sent with X-User-Role: BaristaTrainee, an undeclared role)"
              captures: { e_badrole: $.data.error_id }
            - call: "POST /menu-items"
              payload: { sku: "COFFEE-LG", name: "Large Coffee", station: "BEVERAGE", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 249, unit_food_cost_cents: 40, prep_seconds: 45, valid_dayparts: ["LUNCH"] }
              as: StoreTerminal
              captures: { e_role: $.data.error_id }
          assert:
            - "${e_noauth} == ERR_UNAUTHENTICATED"
            - "first trigger HTTP status == 401"
            - "${e_noauth} != ERR_STORE_NOT_FOUND"
            - "${e_noauth} != ERR_INVALID_REQUEST"
            - "${e_badrole} == ERR_UNAUTHENTICATED"
            - "second trigger HTTP status == 401"
            - "${e_role} == ERR_ROLE_NOT_PERMITTED"
            - "third trigger HTTP status == 403"
            - "no Order, Store or MenuItem row was created by any of the three calls"

  # =========================================================================
  # Section 8 - Cross-Cutting Complexity Layers. The active layers are
  # dual_variant_calculation, cascading_side_effects, rate_threshold_triggers,
  # optimistic_concurrency, derived_field_reconciliation and
  # pagination_with_filtering; claim_type is the layer name. Both §1.2.1
  # concurrency_rules get their own stale-version instance.
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_store_version_on_plan_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[store-plan-stale-store]
          - validations[priority=10]
          - errors[ERR_STALE_STORE_VERSION]
          - endpoints[POST /stores/{id}/staffing-plans]
        distinguishing_aspect: |
          The plan-create endpoint deliberately supersedes an existing plan for the same
          (store_id, service_date, daypart), so nothing about the STATE of the store or of plan A rejects a
          second create - only the version token does. Because a successful create itself increments
          Store.version, replaying the token the client held before the first create is exactly the
          lost-update the rule guards, and the retry with a freshly read version must then succeed AND
          leave plan A in SUPERSEDED. An implementation that ignores the token would silently produce two
          live plans or overwrite a plan the client never saw.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T06:00:00Z; store WAWA-0101 exists in its initial BREAKFAST daypart"
            - "the client reads the store once and keeps that version token as st_v"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id, st_v: $.data.version }
          trigger:
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "BREAKFAST", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_a: $.data.id }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "BREAKFAST", forecast_txn_count: 360, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { e_stale: $.data.error_id }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { st_v2: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "BREAKFAST", forecast_txn_count: 360, mto_share_bp: 5000, expected_store_version: "${st_v2}" }
              as: StoreManager
              captures: { plan_b: $.data.id, plan_b_status: $.data.status }
          assert:
            - "${e_stale} == ERR_STALE_STORE_VERSION"
            - "the stale create returns HTTP status 412"
            - "${st_v2} is exactly one greater than ${st_v} (the first create incremented Store.version)"
            - "${plan_b_status} == DRAFT"
            - "StaffingPlan.${plan_a}.status == SUPERSEDED"
            - "StaffingPlan.${plan_a}.forecast_txn_count == 300"
            - "StaffingPlan.${plan_b}.forecast_txn_count == 360"
            - "GET /stores/${store_id}/staffing-plans?service_date=2026-08-01 -> total_count == 2"
            - "GET /stores/${store_id}/staffing-plans?status=DRAFT -> total_count == 1"
            - "no third plan row exists - the 412 created nothing"

      - name: stale_expected_batch_version_on_discard_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[batch-discard-stale-batch]
          - validations[priority=10]
          - errors[ERR_STALE_BATCH_VERSION]
          - endpoints[POST /production-batches/{id}/discard]
        distinguishing_aspect: |
          Partial write-offs are repeatable by design: discarding 10 of 40 twice is a legal operation and no
          state precondition or quantity rule rejects the replay, so the version token is the ONLY thing
          that can distinguish an intentional second write-off from a double-submitted first one. This also
          proves that a 412 is inert - remaining_qty, discarded_qty and Store.waste_cost_cents_mtd are all
          unchanged by the rejected call, so the ledger never double-counts.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T06:00:00Z; store WAWA-0101 with unit BC-1 (135..185 F, 3 slots)"
            - "pretzel PRETZEL-SOFT: 199c retail, 40c food cost, hold 240 minutes"
            - "one batch of 40 pretzels baked and pulled into slot 1, so status HOLDING and remaining_qty 40"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST", "LUNCH"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T06:00:00Z" }
              as: KitchenAssociate
              captures: { batch_id: $.data.id }
            - call: "POST /production-batches/${batch_id}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches/${batch_id}/pull"
              payload: {}
              as: KitchenAssociate
              captures: { b_v: $.data.version, rem0: $.data.remaining_qty }
          trigger:
            - call: "POST /production-batches/${batch_id}/discard"
              payload: { qty: 10, reason: "QUALITY_REJECT", expected_batch_version: "${b_v}" }
              as: KitchenAssociate
              captures: { rem1: $.data.remaining_qty, disc1: $.data.discarded_qty }
            - call: "POST /production-batches/${batch_id}/discard"
              payload: { qty: 10, reason: "QUALITY_REJECT", expected_batch_version: "${b_v}" }
              as: KitchenAssociate
              captures: { e_stale: $.data.error_id }
            - call: "GET /production-batches/${batch_id}"
              payload: {}
              as: KitchenAssociate
              captures: { b_v2: $.data.version, rem_mid: $.data.remaining_qty }
            - call: "POST /production-batches/${batch_id}/discard"
              payload: { qty: 10, reason: "QUALITY_REJECT", expected_batch_version: "${b_v2}" }
              as: KitchenAssociate
              captures: { rem2: $.data.remaining_qty, disc2: $.data.discarded_qty }
          assert:
            - "${rem0} == 40"
            - "${rem1} == 30"
            - "${disc1} == 10"
            - "${e_stale} == ERR_STALE_BATCH_VERSION"
            - "the stale discard returns HTTP status 412"
            - "${rem_mid} == 30"
            - "${b_v2} is exactly one greater than ${b_v}"
            - "${rem2} == 20"
            - "${disc2} == 20"
            - "ProductionBatch.${batch_id}.status == HOLDING"
            - "Store.${store_id}.waste_cost_cents_mtd == 800"
            - "Store.${store_id}.hot_case_slots_used == 1"
            - "GET /production-batches/${batch_id}/waste-logs -> total_count == 2"
            - "GET /stores/${store_id}/readiness -> retail_waste_exposure_cents == 3980"

      - name: verified_corrective_action_resets_the_strike_counter
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.HoldingUnit.OPERATIONAL_to_IMPAIRED
          - state_machines.HoldingUnit.IMPAIRED_to_LOCKED_OUT
          - state_machines.HoldingUnit.IMPAIRED_to_OPERATIONAL
          - entities.HoldingUnit.consecutive_out_of_range_count
        distinguishing_aspect: |
          The lockout trigger is CONSECUTIVE, not cumulative: two out-of-range readings separated by a
          verified corrective action leave the unit merely IMPAIRED with a strike count of 1, whereas the
          same two readings back to back would lock it out. An implementation that counts lifetime
          out-of-range logs, or that forgets to zero the counter on verification, locks out a unit that has
          been repaired and would then demand a FoodSafetyLead for the next clearance. Note also that an
          in-range reading is NOT a reset - only verification is.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T06:00:00Z; store WAWA-0101 with unit BC-1 banded 135..185 F"
