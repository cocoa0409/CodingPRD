  - section: endpoints
    instances:

      - name: payoff_quote_with_explicit_application_order_does_not_persist
        claim_type: Computed read
        grounds:
          - endpoints[GET /judgments/{judgment_id}/payoff]
          - entities.Judgment.fields.application_order
          - calculations.judgment_payoff_replay
        distinguishing_aspect: "Quoting with application_order=PRINCIPAL_FIRST returns total_payoff_cents 4293767, yet the stored Judgment keeps application_order STATUTORY_ORDER and total_payoff_cents 4299064 — the quote is read-only."
        test_recipe:
          setup:
            - "A CA judgment entered 2026-01-01 with 5000000 cents principal at 1000 bps and 45000 cents filing costs, plus one 1000000-cent payment received 2026-03-02."
          setup_api_calls:
            - call: "POST /creditors"
              payload: { name: "Harbor Recovery LLC", contact_email: "ops@harbor.example" }
              as: CaseManager
              captures: { cred_id: $.data.id }
            - call: "POST /debtors"
              payload: { full_name: "Dana Reyes", state_code: "CA" }
              as: CaseManager
              captures: { dbt_id: $.data.id }
