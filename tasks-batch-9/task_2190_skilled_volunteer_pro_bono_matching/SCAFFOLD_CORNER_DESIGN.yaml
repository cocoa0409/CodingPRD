      - name: error_deliverable_weight_total_invalid_on_approve_below_one_hundred
        claim_type: error_triggerable
        grounds: ["errors[ERR_DELIVERABLE_WEIGHT_TOTAL_INVALID]", "validations[priority=47]", "endpoints[POST /scope-definitions/{id}/approve]"]
        distinguishing_aspect: "The rule is exactness, not a floor: a single deliverable at weight_pct 60.00 leaves the revision approvable in every other respect (DRAFT, owned by the caller) yet approval answers 422 ERR_DELIVERABLE_WEIGHT_TOTAL_INVALID, and the request stays SCOPING with active_scope_revision_no 0."
        test_recipe:
          setup: ["A SCOPING request with one DRAFT revision carrying a single 60.00-weight deliverable."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
