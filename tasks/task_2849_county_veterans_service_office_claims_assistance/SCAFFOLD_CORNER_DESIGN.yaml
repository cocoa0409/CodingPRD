  - section: errors
    instances:
      - name: corner_auth_header_faults_are_resolved_before_any_row_lookup
        claim_type: error_triggerable
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=4]
          - errors[ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_INVALID_ROLE]
          - errors[ERR_UNKNOWN_ACTOR]
        distinguishing_aspect: "The three header faults are distinguished from one another: omitting both auth headers gives ERR_MISSING_AUTH_HEADERS (401), sending X-User-Role Auditor gives ERR_INVALID_ROLE (401), and sending a well-formed CountyOfficer request whose X-User-ID matches no Representative row gives ERR_UNKNOWN_ACTOR (403) - each is returned even though the addressed veteran does exist."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "One Veteran vet so that the target row is never the reason for the failure."
            - "The first trigger call is issued with the X-User-Role and X-User-ID headers removed; the as: annotation records only the intended caller."
            - "The second trigger call is issued with X-User-Role set to the literal string Auditor, which is not one of the five declared roles."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/veterans"
              payload: { full_name: "Alex Rivera", date_of_birth: "1979-03-04", service_start_date: "2001-09-11", service_end_date: "2005-09-10", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 2, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
          trigger:
            - call: "GET /cvso/veterans/${vet}"
              payload: {}
              as: IntakeClerk
              captures: { err_missing: $.data.error_id }
            - call: "GET /cvso/veterans/${vet}"
              payload: {}
              as: IntakeClerk
              captures: { err_role: $.data.error_id }
            - call: "POST /cvso/veterans/${vet}/screen"
              payload: {}
              as: CountyOfficer
              as_user_id: "00000000-0000-0000-0000-0000000000ff"
              captures: { err_actor: $.data.error_id }
          assert:
            - "${err_missing} == ERR_MISSING_AUTH_HEADERS with HTTP status 401 on the header-less call"
            - "${err_role} == ERR_INVALID_ROLE with HTTP status 401 on the Auditor call"
            - "${err_actor} == ERR_UNKNOWN_ACTOR with HTTP status 403"
            - "no EligibilityScreen row is created by any of the three trigger calls"

      - name: corner_pagination_bounds_are_rejected_outside_one_to_one_hundred
        claim_type: error_triggerable
        grounds:
          - validations[priority=15]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "limit is bounded 1..100 inclusive and offset must be >= 0, so limit 0, limit 101 and offset -1 each return ERR_INVALID_PAGINATION (422) while limit 100 offset 0 succeeds on the same empty collection."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; no Representative rows are needed."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "GET /cvso/representatives"
              payload: { limit: 0, offset: 0 }
              as: SystemAdmin
              captures: { err_low: $.data.error_id }
            - call: "GET /cvso/representatives"
              payload: { limit: 101, offset: 0 }
              as: SystemAdmin
              captures: { err_high: $.data.error_id }
            - call: "GET /cvso/representatives"
              payload: { limit: 10, offset: -1 }
              as: SystemAdmin
              captures: { err_offset: $.data.error_id }
            - call: "GET /cvso/representatives"
              payload: { limit: 100, offset: 0 }
              as: SystemAdmin
              captures: { ok_total: $.pagination.total_count }
          assert:
            - "${err_low} == ERR_INVALID_PAGINATION"
            - "${err_high} == ERR_INVALID_PAGINATION"
            - "${err_offset} == ERR_INVALID_PAGINATION"
            - "HTTP status of the first three trigger calls == 422"
            - "HTTP status of the fourth trigger call == 200"
            - "${ok_total} == 0"

      - name: corner_undeclared_dispatch_action_returns_unknown_action
        claim_type: error_triggerable
        grounds:
          - validations[priority=12]
          - errors[ERR_UNKNOWN_ACTION]
        distinguishing_aspect: "SUSPEND is not among the accreditation endpoint's declared actions, so it returns ERR_UNKNOWN_ACTION (422) rather than the enum-shaped ERR_VALIDATION or the state-shaped ERR_INVALID_STATE_TRANSITION, and the row keeps accreditation_status PENDING at version 1."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "One PENDING Representative."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-601", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /cvso/representatives/${rep}/accreditation"
              payload: { action: "SUSPEND" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_UNKNOWN_ACTION"
            - "HTTP status == 422"
            - "Representative.${rep}.accreditation_status == PENDING"
            - "Representative.${rep}.version == 1"

      - name: corner_every_entity_specific_not_found_code_is_reachable
        claim_type: error_triggerable
        grounds:
          - validations[priority=30]
          - validations[priority=31]
          - validations[priority=32]
          - validations[priority=33]
          - validations[priority=34]
          - validations[priority=35]
          - validations[priority=36]
          - errors[ERR_DISCHARGE_DOCUMENT_NOT_FOUND]
          - errors[ERR_POA_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_EVIDENCE_ITEM_NOT_FOUND]
          - errors[ERR_EXAM_SITE_NOT_FOUND]
          - errors[ERR_EXAM_APPOINTMENT_NOT_FOUND]
          - errors[ERR_DECISION_REVIEW_NOT_FOUND]
          - errors[ERR_STATE_PROGRAM_NOT_FOUND]
          - errors[ERR_BENEFIT_APPLICATION_NOT_FOUND]
          - errors[ERR_OUTREACH_EVENT_NOT_FOUND]
