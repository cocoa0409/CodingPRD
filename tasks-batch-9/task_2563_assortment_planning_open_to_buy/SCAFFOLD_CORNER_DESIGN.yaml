        grounds:
          - state_machines.LocalizationOverlay.transitions.ACTIVE_to_EXPIRED
          - state_machines.LocalizationOverlay.transitions.DRAFT_to_ACTIVE
          - calculations.overlay_effective_multiplier
          - calculations.item_sell_through_forecast
          - endpoints[POST /otb/_clock/set_current_utc]
        distinguishing_aspect: "A transition on LocalizationOverlay is driven by an endpoint that names no overlay at all - advancing the logical clock past effective_end - and it writes fields on a different entity: the AssortmentItem's effective_overlay_multiplier_bps and sell_through_bps fall back to the un-overlaid values, so the forecast returns to exactly the number it held before activation while the item's version keeps climbing. Expiry is strictly after effective_end, so a clock reading equal to effective_end leaves the overlay ACTIVE."
