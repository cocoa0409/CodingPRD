              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/evidence"
              payload: { submission_type: "SAC_STUDY", submitted_by_party: "SHIPPER", reference_rate_cents_per_ton: 11200, verified_variable_cost_cents_per_ton: 10500 }
