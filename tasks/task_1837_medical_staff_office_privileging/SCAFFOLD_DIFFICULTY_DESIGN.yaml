  # =================================================================
  # Rule 4 — transitive_cascade (different triggers; depths 3 and 2)
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: credential_lapse_three_hop_cascade
        grounds:
          - state_machines.ExpirableCredential.CURRENT_to_LAPSED
          - state_machines.PrivilegeGrant.ACTIVE_to_SUSPENDED
          - calculations.credential_expiry_risk_window
        distinguishing_aspect: |
          Depth-3 cascade triggered by the clock: clock advance lapses a STATE_LICENSE
          credential (hop 1: ExpirableCredential CURRENT->LAPSED), which suspends every
          ACTIVE PrivilegeGrant whose criteria requires that kind (hop 2: grant
          ACTIVE->SUSPENDED with suspension_reason set), which recomputes
          member.active_privilege_line_count and flips privilege_posture FULL->NONE (hop 3).
        test_recipe:
          setup:
            - "Member L1 ACTIVE with grant ACTIVE for SURG-GENERAL (criteria requires board cert; we instead make the cascade fire on STATE_LICENSE via the mandatory-kind list in the LAPSED transition)"
            - "L1 holds STATE_LICENSE expiring 2026-08-10T00:00:00Z and BOARD_CERT expiring 2027-08-01"
            - "Grant reached ACTIVE via FPPE completion (fppe_case_count=1)"
            - "Clock starts at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /mso/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MedicalStaffCoordinator
