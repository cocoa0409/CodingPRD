  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: precheck_requires_patient_registered
        grounds:
          - state_machines.Appointment.SCHEDULED_to_PRE_CHECKED
          - state_machines.Patient.PRE_REGISTERED_to_REGISTERED
        distinguishing_aspect: |
          Entity pair Appointment -> Patient: the
          SCHEDULED -> PRE_CHECKED transition is only legal when the
          appointment's Patient is REGISTERED; a PRE_REGISTERED patient
          blocks pre-check even with a fresh ACTIVE eligibility check.
        test_recipe:
          setup:
            - "PRE_REGISTERED patient (complete-registration NOT called) with a policy and appointment and fresh ACTIVE eligibility check"
          setup_api_calls:
            - call: "POST /patient-access/patients"
              payload: { first_name: "Xdep", last_name: "One", date_of_birth: "1984-04-14", sex_at_birth: "M", primary_phone: "+15558000001" }
