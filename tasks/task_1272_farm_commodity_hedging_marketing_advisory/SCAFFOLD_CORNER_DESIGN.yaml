            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 1.00 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "FP Buyer", buyer_type: ELEVATOR, credit_rating: A }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 3000, fixed_price: 4.50, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c_flat: $.data.id } }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: HTA, bushels: 3000, contract_month: "2026-12", delivery_window_start: "2026-11-01", delivery_window_end: "2026-12-01" }, as: CommodityAdvisor, captures: { c_hta: $.data.id } }
          trigger:
            - { call: "POST /advisory/sales-contracts/${c_flat}/fix-price", payload: { fixation_price: 4.70 }, as: CommodityAdvisor, captures: { err1: $.data.error_id } }
            - { call: "POST /advisory/sales-contracts/${c_hta}/fix-price", payload: { fixation_price: 4.70 }, as: CommodityAdvisor, captures: { ep: $.data.effective_price, ps: $.data.pricing_status } }
            - { call: "POST /advisory/sales-contracts/${c_hta}/fix-price", payload: { fixation_price: 4.80 }, as: CommodityAdvisor, captures: { err2: $.data.error_id } }
          assert:
