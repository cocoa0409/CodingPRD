scaffold_corner_design:
  # =========================================================================
  # Section: entities — creation, defaults, not-found, system fields
  # =========================================================================
  - section: entities
    instances:
      - name: client_account_creation_applies_defaults
        claim_type: creation_with_defaults
        grounds:
          - entities.ClientAccount
          - endpoints[POST /bpo/client-accounts]
        distinguishing_aspect: "Omitting optional late_penalty_bps_per_day/scorecard weights applies defaults 250 / 0.5 / 0.3 / 0.2."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /bpo/client-accounts"
              payload: { client_code: "CDF", display_name: "Defaults Co", sla_hours_standard: 72, sla_hours_rush: 24 }
              as: PlatformAdmin
              captures: { cid: $.data.id }
          trigger:
            - call: "GET /bpo/client-accounts/${cid}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "ClientAccount.${cid}.late_penalty_bps_per_day == 250"
            - "ClientAccount.${cid}.scorecard_weight_turnaround == 0.5"
            - "ClientAccount.${cid}.scorecard_weight_quality == 0.3"
            - "ClientAccount.${cid}.scorecard_weight_revision == 0.2"
            - "ClientAccount.${cid}.status == ACTIVE"

      - name: client_account_invalid_sla_relationship_rejected
        claim_type: violation_to_error
        grounds:
          - entities.ClientAccount.fields.sla_hours_rush
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "sla_hours_rush must be < sla_hours_standard; submitting equal values returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /bpo/client-accounts"
              payload: { client_code: "CBAD", display_name: "Bad SLA", sla_hours_standard: 48, sla_hours_rush: 48 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: broker_get_returns_computed_composite_score
        claim_type: computed_field_correct
        grounds:
          - entities.Broker.fields.composite_score
          - endpoints[GET /bpo/brokers/{id}]
        distinguishing_aspect: "A freshly onboarded broker with no orders has composite_score == 100.00 (perfect baseline)."
        test_recipe:
          setup: ["one onboarded broker, no licenses yet, no orders"]
          setup_api_calls:
            - call: "POST /bpo/brokers"
              payload: { broker_code: "BNEW", full_name: "New Broker", email: "new@x.com", max_concurrent_orders: 5 }
              as: ComplianceOfficer
              captures: { bid: $.data.id }
          trigger:
            - call: "GET /bpo/brokers/${bid}"
              payload: {}
              as: ComplianceOfficer
              captures: { sc: $.data.composite_score }
          assert:
            - "Broker.${bid}.composite_score == 100.00"
            - "Broker.${bid}.status == PENDING_ONBOARDING"

      - name: property_not_found_returns_404
        claim_type: violation_to_error
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints[GET /bpo/properties/{id}]
        distinguishing_aspect: "GET with a random UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /bpo/properties/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: client_code_uniqueness_enforced
        claim_type: violation_to_error
        grounds:
          - entities.ClientAccount.fields.client_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Second POST with same client_code is rejected (uniqueness constraint)."
        test_recipe:
          setup: ["one client with code DUP"]
          setup_api_calls:
            - call: "POST /bpo/client-accounts"
              payload: { client_code: "DUP", display_name: "First", sla_hours_standard: 72, sla_hours_rush: 24 }
              as: PlatformAdmin
          trigger:
            - call: "POST /bpo/client-accounts"
              payload: { client_code: "DUP", display_name: "Second", sla_hours_standard: 96, sla_hours_rush: 24 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: broker_code_format_enforced
        claim_type: violation_to_error
        grounds:
          - entities.Broker.fields.broker_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "broker_code containing lowercase fails the ^[A-Z0-9]{3,12}$ pattern."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /bpo/brokers"
              payload: { broker_code: "lower1", full_name: "Bad", email: "bad@x.com", max_concurrent_orders: 5 }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: photo_evidence_immutable_no_version_field
        claim_type: immutability_enforced
        grounds:
          - entities.PhotoEvidence
        distinguishing_aspect: "PhotoEvidence has common_fields: false — response has id + created_at but no version field, and no update endpoint exists."
        test_recipe:
          setup: ["order IN_PROGRESS with broker; photo uploaded"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bpo/state-regulations"
              payload: { state_code: "KS", bpo_permitted: true, appraisal_required_for_interior: false, min_driveby_radius_miles: 1.0, min_interior_radius_miles: 0.5 }
              as: ComplianceOfficer
            - call: "POST /bpo/client-accounts"
              payload: { client_code: "CIM", display_name: "Imm Co", sla_hours_standard: 72, sla_hours_rush: 24 }
              as: PlatformAdmin
              captures: { cl_im: $.data.id }
            - call: "POST /bpo/brokers"
              payload: { broker_code: "BIM", full_name: "Im Broker", email: "bim@x.com", max_concurrent_orders: 5 }
              as: ComplianceOfficer
              captures: { brk_im: $.data.id }
            - call: "POST /bpo/brokers/${brk_im}/licenses"
              payload: { state_code: "KS", license_kind: "BPO", license_number: "L1", expires_on: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /bpo/brokers/${brk_im}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /bpo/properties"
              payload: { street_address: "1 S", city: "TOP", state_code: "KS", postal_code: "66601", living_area_sqft: 1000, lot_area_sqft: 3000, year_built: 1990, property_type: "SINGLE_FAMILY" }
              as: OperationsManager
              captures: { prop_im: $.data.id }
            - call: "POST /bpo/valuation-orders"
              payload: { property_id: "${prop_im}", order_kind: "BPO", inspection_level: "DRIVE_BY", priority: "STANDARD", agreed_fee_cents: 10000, client_id: "${cl_im}" }
              as: ClientAdmin
              as_user_id: "${cl_im}"
              captures: { ord_im: $.data.id, ord_im_v: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_im}/submit"
              payload: {}
              as: ClientAdmin
              as_user_id: "${cl_im}"
              captures: { ord_im_v2: $.data.version }
            - call: "POST /bpo/valuation-orders/${ord_im}/dispatch"
              payload: { broker_id: "${brk_im}", expected_order_version: "${ord_im_v2}" }
              as: DispatchCoordinator
            - call: "POST /bpo/valuation-orders/${ord_im}/accept"
              payload: {}
              as: Broker
              as_user_id: "${brk_im}"
            - call: "POST /bpo/valuation-orders/${ord_im}/photos"
              payload: { photo_kind: "FRONT", file_url: "https://x/f.jpg", captured_at: "2026-08-01T01:00:00Z" }
              as: Broker
              as_user_id: "${brk_im}"
              captures: { photo_im: $.data.id }
          trigger:
            - call: "GET /bpo/valuation-orders/${ord_im}/photos"
              payload: {}
              as: Broker
              as_user_id: "${brk_im}"
          assert:
            - "PhotoEvidence.${photo_im} has field id and created_at but NO version field"
            - "PhotoEvidence.${photo_im}.uploaded_by_broker_id == ${brk_im}"

  # =========================================================================
  # Section: state_machines — invalid-from rejection, terminal lockdown, etc.
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_from_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.ValuationOrder
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancel on a COMPLETED order is rejected; terminal state lockdown."
        test_recipe:
          setup: ["an order driven to COMPLETED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
