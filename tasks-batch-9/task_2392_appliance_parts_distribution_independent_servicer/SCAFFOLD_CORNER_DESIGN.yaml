# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
#   Task 2392 — Appliance Parts Distribution & Independent Servicer Network
#   Sections and claim_type values are taken verbatim from
#   references/claim-extraction-guide.md. Every money literal was produced by
#   executing the §1.3 formula with its declared constants.
#   Shared fixture vocabulary (same as §1.8):
#     PricingTier GOLD — electrical 0.15 / mechanical 0.20 / cosmetic 0.25 / sealed 0.10
#     Branch STL — will_call_enabled true, cutoff_hour_utc 20, surcharge 300
#     Branch DAL — will_call_enabled false, cutoff_hour_utc 18, surcharge 100
#     Part P1 W10-PUMP MECHANICAL 12999 / 5200 g  → GOLD unit 10399
#   Logical clock starts at 2026-08-01T00:00:00Z unless a chain sets it.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: part_created_with_lifecycle_and_core_defaults_applied
        claim_type: defaults
        grounds:
          - entities.Part.fields.lifecycle_status
          - entities.Part.fields.core_required
          - entities.Part.fields.core_deposit_cents
          - entities.Part.fields.superseded_by_part_id
          - endpoints.POST_/parts
        distinguishing_aspect: "A POST /parts body that omits lifecycle_status, core_required and core_deposit_cents yields lifecycle_status ACTIVE, core_required false, core_deposit_cents 0 and superseded_by_part_id null."
        test_recipe:
          setup:
            - "Empty catalog; no pricing tier or account is needed because Part has no FK parents."
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Part.${part_p1_id}.lifecycle_status == ACTIVE"
            - "Part.${part_p1_id}.core_required == false"
            - "Part.${part_p1_id}.core_deposit_cents == 0"
            - "Part.${part_p1_id}.superseded_by_part_id == null"
            - "Part.${part_p1_id}.list_price_cents == 12999"

      - name: part_get_by_id_returns_the_stored_catalog_row
        claim_type: retrieval
        grounds:
          - entities.Part
          - endpoints.GET_/parts/{id}
          - response_envelope.success
        distinguishing_aspect: "GET /parts/{id} returns the row exactly as written by POST /parts inside the fixed { meta, response_type, data } envelope with response_type object and no error_id under data."
        test_recipe:
          setup:
            - "One Part P1 W10-PUMP MECHANICAL list 12999 weight 5200 g."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
          trigger:
            - call: "GET /parts/${part_p1_id}"
              payload: {}
              as: Servicer
          assert:
            - "response.status == 200"
            - "response.response_type == object"
            - "response.data has no error_id key"
            - "response.data.id == ${part_p1_id}"
            - "response.data.part_number == W10-PUMP"
            - "response.data.category == MECHANICAL"
            - "response.data.weight_grams == 5200"

      - name: part_list_filters_by_category_and_honours_limit_offset
        claim_type: listing
        grounds:
          - entities.Part.fields.category
          - endpoints.GET_/parts
        distinguishing_aspect: "With two MECHANICAL parts and one ELECTRICAL part, GET /parts?category=MECHANICAL&limit=1&offset=1 returns exactly one row and it is the second MECHANICAL part, never the ELECTRICAL one."
        test_recipe:
          setup:
            - "Three parts: P1 W10-PUMP MECHANICAL, P4 W10-MOTOR MECHANICAL, P3 GE-BOARD ELECTRICAL."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-MOTOR", oem_code: "WHIRLPOOL", description: "Drive motor", category: "MECHANICAL", list_price_cents: 128000, weight_grams: 9000 }
              as: PricingAdmin
              captures: { part_p4_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "GE-BOARD", oem_code: "GE", description: "Main control board", category: "ELECTRICAL", list_price_cents: 128000, weight_grams: 400 }
              as: PricingAdmin
              captures: { part_p3_id: $.data.id }
          trigger:
            - call: "GET /parts?category=MECHANICAL&limit=1&offset=1"
              payload: {}
              as: PricingAdmin
          assert:
            - "response.status == 200"
            - "len(response.data) == 1"
            - "response.data[0].id == ${part_p4_id}"
            - "no returned row has category == ELECTRICAL"

      - name: get_part_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PART_NOT_FOUND]
          - endpoints.GET_/parts/{id}
        distinguishing_aspect: "GET /parts/{id} for an id that was never minted returns HTTP 404 with error_id ERR_PART_NOT_FOUND and data null."
        test_recipe:
          setup:
            - "One real Part exists so the collection is non-empty and the 404 cannot be an artefact of an empty table."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
          trigger:
            - call: "GET /parts/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PricingAdmin
              captures: { err_nf: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.response_type == error"
            - "response.data.error_id == ERR_PART_NOT_FOUND"
            - "response.data.message is a non-empty human-readable string"

      - name: create_part_with_missing_required_weight_grams_is_rejected
        claim_type: required_fields
        grounds:
          - entities.Part.fields.weight_grams
          - errors[ERR_INVALID_REQUEST]
          - validations[priority_3]
        distinguishing_aspect: "POST /parts without weight_grams — a required input with no default — returns HTTP 400 ERR_INVALID_REQUEST and creates no Part row."
        test_recipe:
          setup:
            - "Empty catalog."
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999 }
              as: PricingAdmin
              captures: { err_missing: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "GET /parts?part_number=W10-PUMP returns len(response.data) == 0"

      - name: create_part_with_out_of_range_category_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Part.fields.category
          - errors[ERR_INVALID_REQUEST]
          - validations[priority_3]
        distinguishing_aspect: "category ELECTRONIC is outside {ELECTRICAL, MECHANICAL, COSMETIC, SEALED_SYSTEM}, so POST /parts returns HTTP 400 ERR_INVALID_REQUEST rather than coercing it to ELECTRICAL."
        test_recipe:
          setup:
            - "Empty catalog."
          setup_api_calls: []
          trigger:
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "ELECTRONIC", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { err_enum: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "GET /parts?part_number=W10-PUMP returns len(response.data) == 0"

      - name: part_cert_level_and_returnability_are_computed_from_category
        claim_type: computed_fields
        grounds:
          - entities.Part.fields.cert_level_required
          - entities.Part.fields.is_returnable
          - entities.Part.fields.category
          - entities.Part.fields.lifecycle_status
        distinguishing_aspect: "cert_level_required and is_returnable are derived, never input: COSMETIC yields NONE/true, ELECTRICAL yields ADVANCED/false, SEALED_SYSTEM yields SEALED_SYSTEM/true, and a MECHANICAL part created NLA yields NONE/false."
        test_recipe:
          setup:
            - "Four parts differing only in category and lifecycle_status: COSMETIC ACTIVE, ELECTRICAL ACTIVE, SEALED_SYSTEM ACTIVE, MECHANICAL NLA."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "W10-KNOB", oem_code: "WHIRLPOOL", description: "Control knob", category: "COSMETIC", list_price_cents: 1002, weight_grams: 60 }
              as: PricingAdmin
              captures: { part_cos_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "GE-BOARD", oem_code: "GE", description: "Main control board", category: "ELECTRICAL", list_price_cents: 128000, weight_grams: 400 }
              as: PricingAdmin
              captures: { part_ele_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-COMP", oem_code: "WHIRLPOOL", description: "Sealed compressor", category: "SEALED_SYSTEM", list_price_cents: 320000, weight_grams: 12000, core_required: true, core_deposit_cents: 8500 }
              as: PricingAdmin
              captures: { part_seal_id: $.data.id }
          trigger:
            - call: "POST /parts"
              payload: { part_number: "W10-OLDBELT", oem_code: "WHIRLPOOL", description: "Discontinued drive belt", category: "MECHANICAL", list_price_cents: 4500, weight_grams: 300, lifecycle_status: "NLA" }
              as: PricingAdmin
              captures: { part_nla_id: $.data.id }
          assert:
            - "Part.${part_cos_id}.cert_level_required == NONE"
            - "Part.${part_cos_id}.is_returnable == true"
            - "Part.${part_ele_id}.cert_level_required == ADVANCED"
            - "Part.${part_ele_id}.is_returnable == false"
            - "Part.${part_seal_id}.cert_level_required == SEALED_SYSTEM"
            - "Part.${part_seal_id}.is_returnable == true"
            - "Part.${part_nla_id}.cert_level_required == NONE"
            - "Part.${part_nla_id}.is_returnable == false"

      - name: part_system_fields_are_server_generated_and_version_starts_at_one
        claim_type: system_fields
        grounds:
          - entities.Part
          - endpoints.POST_/parts
          - endpoints.POST_/parts/{id}/supersession
        distinguishing_aspect: "A freshly created Part carries a server-minted id, created_at, updated_at and version == 1; one supersession write moves it to version == 2 while created_at is unchanged."
        test_recipe:
          setup:
            - "Two parts P1 W10-PUMP and P1B W10-PUMP-B so a supersession target exists."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP-B", oem_code: "WHIRLPOOL", description: "Drain pump assembly rev B", category: "MECHANICAL", list_price_cents: 13500, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1b_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id, part_p1_v1: $.data.version }
          trigger:
            - call: "POST /parts/${part_p1_id}/supersession"
              payload: { superseded_by_part_id: "${part_p1b_id}", expected_part_version: "${part_p1_v1}" }
              as: PricingAdmin
          assert:
            - "${part_p1_v1} == 1"
            - "response.status == 200"
            - "Part.${part_p1_id}.version == 2"
            - "Part.${part_p1_id}.lifecycle_status == SUPERSEDED"
            - "Part.${part_p1_id}.superseded_by_part_id == ${part_p1b_id}"
            - "Part.${part_p1_id}.created_at is unchanged by the supersession write"
            - "Part.${part_p1b_id}.version == 1"

      - name: model_part_xref_is_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.ModelPartXref
          - endpoints.POST_/model-part-xrefs
          - endpoints.GET_/model-part-xrefs/{id}
          - endpoints.GET_/model-part-xrefs
        distinguishing_aspect: "ModelPartXref is declared common_fields false: its create response exposes no version field, §1.5 declares no PATCH or DELETE for the collection, and the row read back by id is byte-identical to the created row."
        test_recipe:
          setup:
            - "One Part P1 to point the cross-reference at."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /model-part-xrefs"
              payload: { model_number: "WTW5000DW1", part_id: "${part_p1_id}", position_code: "P-14", xref_source: "OEM_PUBLICATION" }
              as: PricingAdmin
              captures: { xref_id: $.data.id }
          trigger:
            - call: "GET /model-part-xrefs/${xref_id}"
              payload: {}
              as: Servicer
          assert:
            - "response.status == 200"
            - "response.data.model_number == WTW5000DW1"
            - "response.data.part_id == ${part_p1_id}"
            - "response.data.position_code == P-14"
            - "response.data.xref_source == OEM_PUBLICATION"
            - "response.data has no version field"
            - "§1.5 declares no PATCH /model-part-xrefs/{id} and no DELETE /model-part-xrefs/{id}"

      - name: technician_certification_rejects_an_unknown_servicer_account_parent
        claim_type: parent_relationships
        grounds:
          - entities.TechnicianCertification.fields.servicer_account_id
          - errors[ERR_SERVICER_ACCOUNT_NOT_FOUND]
          - validations[priority_5]
        distinguishing_aspect: "POST /technician-certifications with a servicer_account_id that no ServicerAccount row carries returns HTTP 404 ERR_SERVICER_ACCOUNT_NOT_FOUND and creates no certification."
        test_recipe:
          setup:
            - "One PricingTier and one real ServicerAccount exist so the parent table is non-empty."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
          trigger:
            - call: "POST /technician-certifications"
              payload: { servicer_account_id: "00000000-0000-0000-0000-0000000000aa", technician_name: "R. Diaz", oem_code: "WHIRLPOOL", cert_level: "ADVANCED", training_completed_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: WarrantyAdmin
              captures: { err_parent: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_SERVICER_ACCOUNT_NOT_FOUND"
            - "GET /technician-certifications?technician_name=R. Diaz returns len(response.data) == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: new_part_order_starts_draft_and_pending_credit
        claim_type: initial_state
        grounds:
          - state_machines.PartOrder.initial_state
          - entities.PartOrder.fields.fulfillment_status
          - entities.PartOrder.fields.settlement_status
          - entities.PartOrder.fields.pricing_basis
          - entities.PartOrder.fields.hold_reason
        distinguishing_aspect: "POST /part-orders lands on both dimensions' initial states simultaneously — fulfillment_status DRAFT and settlement_status PENDING_CREDIT — with hold_reason null, pricing_basis ORDER_DATE and every money field 0."
        test_recipe:
          setup:
            - "PricingTier GOLD, Branch STL with will_call_enabled true, one ServicerAccount on NET_30."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
          trigger:
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-2001" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
          assert:
            - "response.status == 201"
            - "PartOrder.${order_id}.fulfillment_status == DRAFT"
            - "PartOrder.${order_id}.settlement_status == PENDING_CREDIT"
            - "PartOrder.${order_id}.hold_reason == null"
            - "PartOrder.${order_id}.pricing_basis == ORDER_DATE"
            - "PartOrder.${order_id}.subtotal_cents == 0"
            - "PartOrder.${order_id}.freight_cents == 0"
            - "PartOrder.${order_id}.total_cents == 0"
            - "PartOrder.${order_id}.invoiced_total_cents == null"
            - "PartOrder.${order_id}.fulfilled_at == null"
            - "${order_v0} == 1"

      - name: fulfilling_a_draft_order_cannot_skip_allocation
        claim_type: invalid_transitions
        grounds:
          - state_machines.PartOrder.transitions.ALLOCATED_to_FULFILLED
          - errors[ERR_ORDER_STATE_INVALID]
          - validations[priority_11]
        distinguishing_aspect: "DRAFT -> FULFILLED is absent from the PartOrder table, so POST /part-orders/{id}/fulfill on a credit-approved but never-allocated order returns HTTP 422 ERR_ORDER_STATE_INVALID and leaves inventory reservations at 0."
        test_recipe:
          setup:
            - "GOLD tier; Branch STL; Part P1; NET_30 account; InventoryRecord (STL, P1) on_hand 10."
            - "A WILL_CALL order for 3 units of P1 is credit-approved but POST /allocate is never called, so fulfillment_status is still DRAFT."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
              captures: { branch_a_id: $.data.id }
            - call: "POST /parts"
              payload: { part_number: "W10-PUMP", oem_code: "WHIRLPOOL", description: "Drain pump assembly", category: "MECHANICAL", list_price_cents: 12999, weight_grams: 5200 }
              as: PricingAdmin
              captures: { part_p1_id: $.data.id }
            - call: "POST /servicer-accounts"
              payload: { business_name: "Ace Appliance Repair", oem_authorizations: ["WHIRLPOOL"], pricing_tier_id: "${tier_gold_id}", credit_terms: "NET_30", credit_limit_cents: 10000000, core_liability_limit_cents: 5000000 }
              as: CreditManager
              captures: { acct_s_id: $.data.id }
            - call: "POST /inventory-records"
              payload: { branch_id: "${branch_a_id}", part_id: "${part_p1_id}", on_hand_units: 10, reorder_point: 2 }
              as: PlatformAdmin
              captures: { inv_a_p1_id: $.data.id }
            - call: "POST /part-orders"
              payload: { servicer_account_id: "${acct_s_id}", fulfillment_mode: "WILL_CALL", pickup_branch_id: "${branch_a_id}", purchase_order_ref: "PO-2002" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /part-orders/${order_id}/lines"
              payload: { requested_part_id: "${part_p1_id}", quantity: 3, expected_part_order_version: "${order_v0}" }
              as: Servicer
              as_user_id: "${acct_s_id}"
              captures: { line_id: $.data.id }
            - call: "POST /part-orders/${order_id}/credit-decision"
              payload: { decision: "APPROVE", decision_note: "inside limit" }
              as: CreditManager
          trigger:
            - call: "POST /part-orders/${order_id}/fulfill"
              payload: { tracking_ref: "WILLCALL-2002" }
              as: BranchCounterRep
              as_user_id: "${branch_a_id}"
              captures: { err_state: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_ORDER_STATE_INVALID"
            - "PartOrder.${order_id}.fulfillment_status == DRAFT"
            - "PartOrder.${order_id}.fulfilled_at == null"
            - "PartOrder.${order_id}.invoiced_total_cents == null"
            - "OrderLine.${line_id}.line_status == RESOLVED"
            - "InventoryRecord.${inv_a_p1_id}.reserved_units == 0"
            - "InventoryRecord.${inv_a_p1_id}.available_units == 10"

      - name: cancelling_a_fulfilled_order_is_locked_out
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PartOrder.terminal_states
          - errors[ERR_ORDER_STATE_INVALID]
          - validations[priority_11]
        distinguishing_aspect: "FULFILLED is terminal on the fulfillment dimension, so POST /part-orders/{id}/cancel returns HTTP 422 ERR_ORDER_STATE_INVALID and the shipped line stays SHIPPED with the account's INVOICED exposure of 31197 intact."
        test_recipe:
          setup:
            - "GOLD tier; Branch STL; Part P1; NET_30 account with credit_limit_cents 10000000; InventoryRecord (STL, P1) on_hand 10."
            - "A WILL_CALL order for 3 units of P1 is credit-approved, allocated and fulfilled: subtotal 31197, freight 0, invoiced_total_cents 31197."
          setup_api_calls:
            - call: "POST /pricing-tiers"
              payload: { tier_code: "GOLD", name: "Gold Contract", discount_pct_electrical: 0.15, discount_pct_mechanical: 0.20, discount_pct_cosmetic: 0.25, discount_pct_sealed_system: 0.10, min_annual_volume_cents: 5000000 }
              as: PricingAdmin
              captures: { tier_gold_id: $.data.id }
            - call: "POST /branches"
              payload: { code: "STL", name: "St Louis DC", region_code: "MW", will_call_enabled: true, cutoff_hour_utc: 20, overnight_surcharge_cents: 300 }
              as: PlatformAdmin
