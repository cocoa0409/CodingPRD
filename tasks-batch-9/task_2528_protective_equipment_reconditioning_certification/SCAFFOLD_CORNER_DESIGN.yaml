              as: Technician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /repair-orders/${ro_id}/install"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_REPAIR_ORDER_STATE_INVALID"
            - "RepairOrder.${ro_id}.status == DRAFT"
            - "RepairOrder.${ro_id}.installed_by_user_id == null"
            - "ApprovedPart.${part_id}.on_hand_qty == 4"
            - "ApprovedPart.${part_id}.reserved_qty == 0"
            - "ApprovedPart.${part_id}.consumed_qty == 0"
            - "EquipmentUnit.${u1_id}.recon_status == REPAIR_PENDING"

      - name: verifying_a_repair_you_installed_yourself_rejected
        claim_type: Violation → Error
        grounds:
          - validations.v-segregation-repair-verify
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          Both callers carry the Technician role, so the role gate passes; the
          rejection is identity-based — X-User-ID tech-1 equals
          installed_by_user_id, so verify must fail with
          ERR_SEGREGATION_OF_DUTIES / 403 while verification_failure_count stays 0
          and the unit stays in REPAIR_PENDING. The same call as tech-2 succeeds.
        test_recipe:
          setup:
            - "one unit in REPAIR_PENDING with an INSTALLED RepairOrder whose installed_by_user_id is tech-1"
          setup_api_calls:
            - *k_clock
            - *k_acct
            - *k_waiver
            - *k_model
            - *k_part_ok
            - *k_ship1
            - *k_count1
            - *k_unit1
            - *k_accept1
            - *k_ident18
            - *k_disasm
            - *k_insp_ok
            - *k_bench
            - *k_cal
            - *k_test1
            - *k_impacts_repair
            - *k_determine_repair
            - *k_get_u1_v
            - *k_repair_order
            - *k_part_line
            - &k_submit
              call: "POST /repair-orders/${ro_id}/submit"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
            - &k_install
              call: "POST /repair-orders/${ro_id}/install"
              payload: {}
              as: Technician
              as_user_id: "tech-1"
          trigger:
            - call: "POST /repair-orders/${ro_id}/verify"
              payload: { outcome: "PASSED", note: "self-check" }
              as: Technician
              as_user_id: "tech-1"
              captures: { err_id: $.data.error_id }
          assert:
