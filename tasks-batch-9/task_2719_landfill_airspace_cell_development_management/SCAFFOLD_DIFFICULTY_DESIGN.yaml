            - "AerialSurvey.${s2_id}.status is still 'VOID' after trigger 6 — a terminal survey is never re-superseded or restored"

      - name: leachate_slot_occupancy_is_half_open_and_survives_state_changes
        grounds:
          - validations[priority=19]
          - validations[priority=26]
          - calculations.leachate_slot_occupancy
          - entities.TreatmentAgreement.fields.scheduled_gallons_today
          - state_machines.LeachateShipment.DISPATCHED_to_REJECTED_AT_GATE
        distinguishing_aspect: |
          Two independent capacity dimensions are consumed by the same interval: a HALF-OPEN
          overlap count against concurrent_slot_capacity, and a whole-day gallon total against
          daily_gallon_cap. Touching windows share no slot (start == other end) even though
          the CLOSED-interval survey rule in the sibling instance treats touching as a
          conflict, so an implementation with one shared interval helper fails one of the two.
          Occupancy also spans the status dimension: DISPATCHED still holds a slot, and only a
          terminal release (reject-at-gate) frees it — proven by replaying a rejected payload.
        test_recipe:
          setup:
            - "Landfill LF with TreatmentAgreement TA: daily_gallon_cap 20000, concurrent_slot_capacity 2, base_haul_fee 350.00, treatment_rate_per_kgal 62.50."
            - "Logical clock left at its startup default 2026-08-01T00:00:00Z, so all windows below fall on the current logical date."
            - "Shipments W1 [08:00, 12:00) 8000 gallons, W2 [10:00, 14:00) 4000 gallons, W4 [12:00, 16:00) 6000 gallons and W5 [16:00, 18:00) 2000 gallons, all on 2026-08-01 and all SCHEDULED."
          setup_api_calls:
            - call: "POST /landfills"
              payload: { name: "Ridgeview MSW", permit_number: "MSW-4417", permitted_total_airspace_cy: 5000000, design_footprint_sf: 400000, planned_density_tons_per_cy: 0.90, annual_tonnage_forecast: 300000, daily_load_limit: 200 }
              as: PlatformAdmin
              captures: { lf_id: $.data.id }
            - call: "POST /treatment-agreements"
              payload: { landfill_id: "${lf_id}", facility_name: "Valley POTW", daily_gallon_cap: 20000, concurrent_slot_capacity: 2, base_haul_fee: 350.00, treatment_rate_per_kgal: 62.50, effective_from: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { ta_id: $.data.id }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 8000, window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T12:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { w1_id: $.data.id }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 4000, window_start: "2026-08-01T10:00:00Z", window_end: "2026-08-01T14:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { w2_id: $.data.id }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 6000, window_start: "2026-08-01T12:00:00Z", window_end: "2026-08-01T16:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { w4_id: $.data.id }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 2000, window_start: "2026-08-01T16:00:00Z", window_end: "2026-08-01T18:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { w5_id: $.data.id }
            - call: "GET /treatment-agreements/${ta_id}"
              payload: {}
              as: EnvironmentalManager
              captures: { gal_after_setup: $.data.scheduled_gallons_today }
          trigger:
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 1000, window_start: "2026-08-01T11:00:00Z", window_end: "2026-08-01T13:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 1000, window_start: "2026-08-01T18:00:00Z", window_end: "2026-08-01T20:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /leachate-shipments/${w2_id}/cancel"
              payload: { gate_reason: "Tanker reassigned to a different site." }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { w2_state: $.data.status }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 4000, window_start: "2026-08-01T09:00:00Z", window_end: "2026-08-01T11:00:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { w6_id: $.data.id }
            - call: "POST /leachate-shipments/${w1_id}/dispatch"
              payload: { hauler_ref: "TNK-9" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { w1_state: $.data.status }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 1000, window_start: "2026-08-01T08:30:00Z", window_end: "2026-08-01T09:30:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
            - call: "POST /leachate-shipments/${w1_id}/reject-at-gate"
              payload: { gate_reason: "Load failed the POTW pretreatment screen." }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { w1_state2: $.data.status }
            - call: "POST /leachate-shipments"
              payload: { treatment_agreement_id: "${ta_id}", gallons: 1000, window_start: "2026-08-01T08:30:00Z", window_end: "2026-08-01T09:30:00Z" }
              as: SiteOperator
              as_user_id: "${lf_id}"
              captures: { w7_id: $.data.id, w7_state: $.data.status }
            - call: "GET /treatment-agreements/${ta_id}"
              payload: {}
              as: EnvironmentalManager
              captures: { gal_final: $.data.scheduled_gallons_today }
          assert:
            - "${gal_after_setup} == 20000 — the four setup shipments hit daily_gallon_cap EXACTLY, which is allowed; W4 starting at 12:00 does not overlap W1 ending at 12:00 under HALF-OPEN semantics, so W4 shared a slot only with W2"
            - "trigger 1 returns ERR_SLOT_CAPACITY_EXCEEDED with HTTP 409: [11:00, 13:00) overlaps W1, W2 and W4, so the count including the new shipment is 4 against concurrent_slot_capacity 2"
            - "trigger 2 returns ERR_DAILY_GALLON_CAP_EXCEEDED with HTTP 422: [18:00, 20:00) overlaps nothing, so the slot rule passes and the day total 20000 + 1000 is what fails"
            - "no shipment row is created by trigger 1 or trigger 2, and TreatmentAgreement.${ta_id}.scheduled_gallons_today is still 20000"
            - "${w2_state} == 'CANCELLED' and TreatmentAgreement.${ta_id}.scheduled_gallons_today == 16000 — exactly W2's 4000 gallons and its slot were released"
            - "trigger 4 succeeds: [09:00, 11:00) now overlaps only W1, so the count is 2, and the day total returns to exactly 20000"
            - "${w1_state} == 'DISPATCHED' and TreatmentAgreement.${ta_id}.scheduled_gallons_today is still 20000 — dispatching moves no gallons"
            - "trigger 6 returns ERR_SLOT_CAPACITY_EXCEEDED with HTTP 409: [08:30, 09:30) overlaps the DISPATCHED W1 and the SCHEDULED W6, proving DISPATCHED still occupies a slot"
            - "${w1_state2} == 'REJECTED_AT_GATE' and TreatmentAgreement.${ta_id}.scheduled_gallons_today == 12000"
            - "trigger 8 replays the EXACT payload rejected by trigger 6 and now succeeds with ${w7_state} == 'SCHEDULED', because the terminal rejection released W1's slot"
            - "${gal_final} == 13000 (W4 6000 + W5 2000 + W6 4000 + W7 1000); LeachateShipment.${w2_id}.status == 'CANCELLED' and LeachateShipment.${w1_id}.status == 'REJECTED_AT_GATE' both retain their gallons values unchanged"

  - rule_id: compensating_invariant
    instances:

      - name: day_amend_reverses_airspace_billing_and_posture_with_no_drift
        grounds:
          - state_machines.OperatingDay.CLOSED_to_AMENDED
          - state_machines.OperatingDay.AMENDED_to_CLOSED
          - state_machines.Cell.FULL_to_ACTIVE
          - calculations.daily_airspace_consumption
          - entities.Cell.fields.consumed_airspace_cy
          - entities.WasteLoad.fields.gate_charge_amount
        distinguishing_aspect: |
          Amending a closed day must undo a four-link cascade exactly: the cell's airspace
          ledger returns to its pre-close value, a FULL cell reverts to ACTIVE, the site's
          SUSPENDED_NO_AIRSPACE posture is lifted, suspended special-waste approvals are
          un-suspended, and finalized billing drops back to PROVISIONAL. The invariant has a
          deliberate ASYMMETRY that a naive "reverse everything" implementation breaks:
          gate_charge_amount survives the reversal while final_charge_amount and
          host_royalty_amount are cleared. Re-closing then reproduces the original numbers
          exactly, so any accumulating ledger (adding instead of recomputing) shows as drift.
        test_recipe:
          setup:
            - "Landfill LF with C-1 (design_airspace_cy 1000000) left at QA_CERTIFIED and C-2 (design_airspace_cy 200) driven to ACTIVE, so certified_airspace_cy is 1000200 and active_cell_count is 1."
