              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-G2", preferred_flag: true }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
          trigger:
            - call: "POST /plans/${plan_id}/testimonies"
              payload: { intervenor_id: "${int_id}", topic: "Premature", body: "Filed before review opened." }
              as: Intervener
              as_user_id: "${int_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PLAN_NOT_UNDER_REVIEW (HTTP 409); no testimony row is created"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: duplicate_snapshot_year_interval_key
        grounds:
          - validations[priority=7]
          - entities.ReliabilitySnapshot.fields.forecast_year
          - endpoints.POST_/portfolios/{portfolioId}/snapshots
        distinguishing_aspect: |
          Interval semantics = single-year occupancy with a state-flag-gated
          replacement exception: a second snapshot for an OCCUPIED (portfolio_id,
          forecast_year) slot is ERR_DUPLICATE_SNAPSHOT, but once a retire decision
          with retirement_year <= the snapshot's forecast_year flags the occupant
          (the retire invalidated its fleet basis), the same slot accepts a recompute
          — occupancy is cleared by the cascade flag, not by adjacency or timing.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Plan P DRAFT; BASE forecast 2030 (load 400); portfolio PF; COAL unit R 500 MW (in_service 2010) ACTIVE; snapshot S for 2030 computed (passes: margin -10.00? no — 450 - 460 = -10.00, FAILS is not required here; occupancy applies regardless of meets_requirement)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP Over1", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 400, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-O1", preferred_flag: true }
              as: UtilityPlanner
              captures: { pf_id: $.data.id, pf_v: $.data.version }
            - call: "POST /resources"
              payload: { unit_name: "COAL-O1", resource_type: "COAL", nameplate_mw: 500, in_service_year: 2010, fuel_type: "COAL" }
              as: UtilityPlanner
              captures: { res_id: $.data.id }
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2030, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pf_v}" }
              as: UtilityPlanner
          trigger:
            - call: "GET /portfolios/${pf_id}"
              payload: {}
              as: UtilityPlanner
              captures: { pfv_8: $.data.version }
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2030, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 5.00, expected_portfolio_version: "${pfv_8}" }
              as: UtilityPlanner
              captures: { err_dup: $.data.error_id }
            - call: "POST /resources/${res_id}/retire"
              payload: { retirement_year: 2028, plan_id: "${plan_id}" }
              as: UtilityPlanner
            - call: "GET /portfolios/${pf_id}"
              payload: {}
              as: UtilityPlanner
              captures: { pfv_9: $.data.version }
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2030, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 5.00, expected_portfolio_version: "${pfv_9}" }
              as: UtilityPlanner
              captures: { acc_after: $.data.accredited_supply_mw }
          assert:
            - "second snapshot for occupied (PF, 2030) fails with ERR_DUPLICATE_SNAPSHOT (409)"
            - "retire with retirement_year 2028 (<= 2030) flags the occupying snapshot and bumps portfolio version to 3"
            - "third call (same slot, occupant flagged) is accepted (201) and recomputes accredited_supply_mw == 0.00 with the DECIDED unit excluded for 2030 >= 2028"

      - name: deviation_report_year_collision_no_stale_exception
        grounds:
          - validations[priority=6]
          - entities.PlanDeviationReport.fields.report_year
          - endpoints.POST_/plans/{planId}/deviation-reports
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource entity: the
          (plan_id, report_year) slot is a HARD occupancy — collision is
          ERR_DUPLICATE_REPORT with NO stale-flag or replacement exception, unlike
          snapshots whose occupancy can be cleared by the retire cascade.
        test_recipe:
          setup:
            - "Clock 2026-08-01. Plan P APPROVED with approved snapshot for 2031 (baseline load 400)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans"
              payload: { plan_name: "IRP Over2", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2031, residential_mw: 400, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-O2", preferred_flag: true }
              as: UtilityPlanner
              captures: { pf_id: $.data.id, pf_v: $.data.version }
            - call: "POST /resources"
              payload: { unit_name: "SOL-O2", resource_type: "SOLAR", nameplate_mw: 1150, in_service_year: 2020, fuel_type: "SUN" }
              as: UtilityPlanner
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2031, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pf_v}" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/submit-for-review"
              payload: {}
              as: UtilityPlanner
              captures: { plan_v: $.data.version }
            - call: "POST /plans/${plan_id}/commission-review"
              payload: { decision: "APPROVE", expected_plan_version: "${plan_v}" }
              as: Commissioner
            - call: "POST /plans/${plan_id}/deviation-reports"
              payload: { report_year: 2031, actual_load_mw: 420 }
              as: UtilityPlanner
          trigger:
            - call: "POST /plans/${plan_id}/deviation-reports"
              payload: { report_year: 2031, actual_load_mw: 430 }
              as: UtilityPlanner
              captures: { err: $.data.error_id }
          assert:
            - "second report for (P, 2031) fails with ERR_DUPLICATE_REPORT (409) — hard occupancy, no exception path"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: candidate_committed_mw_invariant
        grounds:
          - calculations.accreditation_waterfall
          - state_machines.ProcurementCommitment.ISSUED_to_CANCELLED
          - entities.ResourceCandidate.fields.nameplate_mw
        distinguishing_aspect: |
          Conserved quantity = candidate remaining nameplate: for any candidate,
          nameplate_mw - sum(committed_mw over ISSUED/AWARDED commitments) is restored
          by the compensating cancel — issue 200 of 300 leaves 100, cancel returns the
          invariant to 300 available, verified by a subsequent 300-MW issue succeeding.
        test_recipe:
          setup:
            - "Clock 2026-08-01. Plan P APPROVED (reliability-met portfolio); candidate K 300 MW nameplate."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans"
              payload: { plan_name: "IRP Inv1", cycle_year: 2026, planning_horizon_years: 15 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2031, residential_mw: 400, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-I1", preferred_flag: true }
              as: UtilityPlanner
              captures: { pf_id: $.data.id, pf_v: $.data.version }
            - call: "POST /resources"
              payload: { unit_name: "SOL-I1", resource_type: "SOLAR", nameplate_mw: 1150, in_service_year: 2020, fuel_type: "SUN" }
              as: UtilityPlanner
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2031, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pf_v}" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/submit-for-review"
              payload: {}
              as: UtilityPlanner
              captures: { plan_v: $.data.version }
            - call: "POST /plans/${plan_id}/commission-review"
              payload: { decision: "APPROVE", expected_plan_version: "${plan_v}" }
              as: Commissioner
            - call: "POST /candidates"
              payload: { candidate_name: "K-INV", resource_type: "GAS_CT", nameplate_mw: 300, online_year: 2028, capex_usd_per_kw: 700, fixed_om_usd_per_kw_year: 12, fuel_type: "NATURAL_GAS", build_lead_years: 2 }
              as: UtilityPlanner
              captures: { cand_id: $.data.id }
            - call: "POST /plans/${plan_id}/procurement-commitments"
              payload: { candidate_id: "${cand_id}", committed_mw: 200, solicitation_type: "RFP" }
              as: UtilityPlanner
              captures: { com_id: $.data.id }
            - call: "POST /plans/${plan_id}/procurement-commitments"
              payload: { candidate_id: "${cand_id}", committed_mw: 150, solicitation_type: "RFP" }
              as: UtilityPlanner
              captures: { err_over: $.data.error_id }
          trigger:
            - call: "POST /procurement-commitments/${com_id}/cancel"
              payload: {}
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/procurement-commitments"
              payload: { candidate_id: "${cand_id}", committed_mw: 300, solicitation_type: "SELF_BUILD" }
              as: UtilityPlanner
              captures: { com2_id: $.data.id }
          assert:
            - "the 150-MW issue while 200 ISSUED fails with ERR_NAMEPLATE_EXCEEDED (200+150 > 300)"
            - "after cancel, a 300-MW issue succeeds (201) — the cancelled 200 is fully returned to the pool (invariant: nameplate == available again)"

      - name: retirement_fleet_accreditation_invariant
        grounds:
          - state_machines.Resource.ACTIVE_to_DECIDED
          - state_machines.Resource.DECIDED_to_ACTIVE
          - calculations.capacity_accreditation
        distinguishing_aspect: |
          DIFFERENT conserved quantity — fleet accredited MW: retire (ACTIVE->DECIDED
          with retirement_year 2031) removes 253.80 accredited MW from every snapshot
          year >= 2031, and the compensating cancel-retirement (DECIDED->ACTIVE while
          the deciding plan is DRAFT) restores the exact pre-retire accredited_supply_mw
          on recompute — no drift across the forward/compensating pair.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Plan P DRAFT; BASE forecast 2035; portfolio PF; COAL unit R 300 MW in_service 1985 ACTIVE; baseline snapshot 2035 computed (253.80 accredited from R: age capped logic not yet engaged since ACTIVE ages normally — age 50 -> der 0.90 floor, so accredited 300*0.90*0.90=243.00)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { plan_name: "IRP Inv2", cycle_year: 2026, planning_horizon_years: 20 }
              as: UtilityPlanner
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2035, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${plan_id}/portfolios"
              payload: { portfolio_name: "PF-I2", preferred_flag: true }
              as: UtilityPlanner
              captures: { pf_id: $.data.id, pf_v: $.data.version }
            - call: "POST /resources"
              payload: { unit_name: "COAL-INV", resource_type: "COAL", nameplate_mw: 300, in_service_year: 1985, fuel_type: "COAL" }
              as: UtilityPlanner
              captures: { res_id: $.data.id }
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2035, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pf_v}" }
              as: UtilityPlanner
              captures: { acc_pre: $.data.accredited_supply_mw }
          trigger:
            - call: "POST /resources/${res_id}/retire"
              payload: { retirement_year: 2031, plan_id: "${plan_id}" }
              as: UtilityPlanner
            - call: "POST /resources/${res_id}/cancel-retirement"
              payload: {}
              as: UtilityPlanner
            - call: "GET /portfolios/${pf_id}"
              payload: {}
              as: UtilityPlanner
              captures: { pfv_10: $.data.version }
            - call: "POST /portfolios/${pf_id}/snapshots"
              payload: { forecast_year: 2035, scenario_tag: "BASE", fuel_price_usd_per_mmbtu: 4.00, expected_portfolio_version: "${pfv_10}" }
              as: UtilityPlanner
              captures: { acc_post: $.data.accredited_supply_mw }
          assert:
            - "pre-retire accredited_supply_mw == 243.00 (age 50 at 2035 -> derate floor 0.90)"
            - "the retire+cancel pair leaves Resource.status == ACTIVE with retirement_year null, and bumps portfolio version twice (retire + cancel): 3 -> 5"
            - "the retire-flagged 2035 slot accepts replacement; the recomputed snapshot reports accredited_supply_mw == 243.00 exactly — forward action plus its compensation restores the conserved fleet-accreditation quantity with zero drift"
