            - "${inv_ef_opened_by} == \"OFFICER\" and ${inv_ef_risk} == 2.00 (a MANUAL-style officer-opened investigation with pair_id null scores only the site component: FRAUD_SITE_COMPONENT_PER_FLAGGED_RECORD 2.00 times a flagged_record_count of 1, and the insurance component needs a pair)"
            - "${inv_ef_state2} == \"SUBSTANTIATED\" and ${inv_ef_v2} == 2"
            - "HTTP 200 with $.data.state == REFERRED_LAW_ENFORCEMENT and $.data.referral_reference == \"USAO-AR-2026-0311\" and $.data.version == 3"
