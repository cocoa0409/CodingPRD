scenario: |
  2933. Craft Brewery Taproom & Self-Distribution Operations (regional craft brewery): brewer's
  notice and label approval prerequisites before a beer can be sold, batch and tank scheduling
  against taproom demand and packaging runs, taproom pour tracking, keg depletion and inventory
  reconciliation, self-distribution license limits and territory rules by state, wholesaler
  franchise implications when appointing a distributor, excise tax reporting by barrels removed
  and taproom versus distribution split, growler and crowler fill sanitation and labeling rules,
  event, festival and off-site permit management

domain_name: craft-brewery-taproom-self-distribution
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every collection is top-level; children carry FK fields in the request body
  # (Batch.beer_id, PackagingRun.batch_id, TaproomPour.keg_asset_id, ...) rather
  # than being nested in URL paths. `api_prefix: "/"` means all collections sit
  # at the API root; there is no single owning aggregate in the URL space.

  state_machine_shape: parallel
  # Beer carries two independent state dimensions (registration_state x label_state)
  # that advance on separate triggers. Tank (IDLE->OCCUPIED->DIRTY->IDLE), KegAsset
  # (EMPTY_DIRTY->CLEANED->FILLED->TAPPED->EMPTY_DIRTY), Brewery notice
  # (ACTIVE->SUSPENDED->ACTIVE), DistributorAppointment (ACTIVE->TERMINATION_REQUESTED
  # ->ACTIVE) and EventPermit (SUBMITTED->INFO_REQUESTED->SUBMITTED) are cyclic;
  # DistributionOrder and Beer filings branch (approve-or-reject).

  relationship_patterns:
    - one_to_many          # Beer -> Batch -> PackagingRun -> KegAsset -> TaproomPour
    - self_referential     # ExciseReport.amends_report_id -> ExciseReport.id
    - cross_aggregate      # DistributorAppointment gates DistributionOrder channel

  role_model: segregation_of_duties
  # BreweryAdmin proposes / prepares, ComplianceOfficer approves / files, and the
  # same X-User-ID may never occupy both sides of an appointment approval, an
  # excise filing, or a growler sanitation attestation. StateRegulator is the
  # external decision authority (brewer's notice, TTB filings, event permits).

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities, 58 endpoints, 13 state-machine dimensions over 11 entities,
  # 7 calculations, 2 OCC rules, 29 ordered validation rules, 64 error codes.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: Brewery
    parent: null
    common_fields: true
    note: "Singleton. Exactly one Brewery row may exist; it carries the federal brewer's notice that gates every sale."
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registered legal name of the brewery
        constraints: 1-120 chars
      - name: home_state_code
        type: string
        source: input
        description: Two-letter USPS code of the state where the brewery premises sit
        constraints: exactly 2 uppercase letters
      - name: ttb_brewers_notice_number
        type: string
        source: input
        description: TTB brewer's notice registry number as filed
        constraints: 1-32 chars
      - name: notice_status
        type: enum
        source: system
        default: PENDING_NOTICE
        description: Lifecycle of the federal brewer's notice; gates all sale operations
        constraints: "{PENDING_NOTICE, ACTIVE, SUSPENDED, REVOKED}"
      - name: notice_effective_utc
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which the notice was most recently made ACTIVE
      - name: suspension_reason
        type: string
        source: system
        default: null
        description: Reason text supplied by StateRegulator on the most recent SUSPEND or REVOKE
      - name: carry_in_taproom_bbl
        type: number
        source: system
        default: 0.000
        description: Pre-go-live taproom barrels removed this calendar year, set only by ytd-adjustments
        constraints: ">= 0, 3 decimal places"
      - name: carry_in_distribution_bbl
        type: number
        source: system
        default: 0.000
        description: Pre-go-live distribution barrels removed this calendar year, set only by ytd-adjustments
        constraints: ">= 0, 3 decimal places"
      - name: taproom_bbl_ytd
        type: number
        source: computed
        description: "carry_in_taproom_bbl + sum of taproom_bbl over ExciseReport rows with state == FILED (SUPERSEDED excluded)"
      - name: distribution_bbl_ytd
        type: number
        source: computed
        description: "carry_in_distribution_bbl + sum of distribution_bbl over ExciseReport rows with state == FILED (SUPERSEDED excluded)"
      - name: total_bbl_ytd
        type: number
        source: computed
        description: taproom_bbl_ytd + distribution_bbl_ytd
      - name: franchise_locked_state_codes
        type: array
        source: computed
        description: "Ascending-sorted state_code list of every StateLicense that has >= 1 DistributorAppointment with state == ACTIVE"

  - name: Beer
    parent: null
    common_fields: true
    note: "Two independent state dimensions: registration_state (TTB formula) and label_state (COLA)."
    fields:
      - name: name
        type: string
        source: input
        description: Brand name of the beer
        constraints: 1-80 chars, unique
      - name: style
        type: string
        source: input
        description: Style descriptor printed on the label
        constraints: 1-40 chars
      - name: abv_pct
        type: number
        source: input
        description: Alcohol by volume percentage
        constraints: ">= 0.5 and <= 20.0, 1 decimal place"
      - name: requires_formula
        type: boolean
        source: input
        default: true
        description: "true when the recipe uses non-traditional ingredients and therefore needs TTB formula approval; false mints registration_state FORMULA_EXEMPT at creation"
      - name: price_per_bbl_cents
        type: integer
        source: input
        description: Wholesale price per barrel in cents, used by the landed-cost calculation
        constraints: ">= 1"
      - name: registration_state
        type: enum
        source: system
        default: DRAFT
        description: "TTB formula dimension; DRAFT when requires_formula is true, FORMULA_EXEMPT when it is false"
        constraints: "{DRAFT, FORMULA_PENDING, FORMULA_APPROVED, FORMULA_EXEMPT}"
      - name: label_state
        type: enum
        source: system
        default: NO_LABEL
        description: COLA (certificate of label approval) dimension, advanced independently of registration_state
        constraints: "{NO_LABEL, COLA_PENDING, COLA_APPROVED, COLA_REVOKED}"
      - name: cola_id
        type: string
        source: system
        default: null
        description: Approval identifier recorded by StateRegulator when the label filing is APPROVED
      - name: label_fields
        type: object
        source: system
        default: null
        description: "Label content submitted with the LABEL filing: {brand_name, abv_statement, net_contents, health_warning}"
      - name: taproom_sellable
        type: boolean
        source: computed
        description: "true iff Brewery.notice_status == ACTIVE AND registration_state IN {FORMULA_APPROVED, FORMULA_EXEMPT}; taproom draft sales do NOT require a COLA"
      - name: distribution_sellable
        type: boolean
        source: computed
        description: "true iff Brewery.notice_status == ACTIVE AND registration_state IN {FORMULA_APPROVED, FORMULA_EXEMPT} AND label_state == COLA_APPROVED"

  - name: Tank
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Cellar identifier of the vessel
        constraints: 1-16 chars, unique
      - name: tank_type
        type: enum
        source: input
        description: Vessel class
        constraints: "{FERMENTER, BRITE}"
      - name: capacity_bbl
        type: number
        source: input
        description: Maximum working volume in barrels
        constraints: "> 0, 2 decimal places"
      - name: status
        type: enum
        source: system
        default: IDLE
        description: Cellar availability state, cycled by batch occupation and CIP
        constraints: "{IDLE, OCCUPIED, DIRTY, OUT_OF_SERVICE}"
      - name: last_cip_utc
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent passing clean-in-place
      - name: cip_cycle_count
        type: integer
        source: system
        default: 0
        description: Number of passing CIP cycles completed on this vessel
      - name: occupying_batch_id
        type: string
        source: system
        default: null
        description: "Back-reference mirror of Batch.tank_id for the Batch currently occupying the vessel; null unless status == OCCUPIED. Not an FK declaration - the owning side is Batch.tank_id."

  - name: Batch
    parent: null
    common_fields: true
    fields:
      - name: beer_id
        type: string
        source: input
        description: "FK -> Beer.id; the brand this batch produces"
      - name: tank_id
        type: string
        source: input
        description: "FK -> Tank.id; vessel reserved for the batch occupation interval"
      - name: batch_code
        type: string
        source: input
        description: Cellar batch code
        constraints: 1-24 chars, unique
      - name: planned_volume_bbl
        type: number
        source: input
        description: Volume the cellar intends to brew, in barrels
        constraints: "> 0, 2 decimal places"
      - name: brew_start_utc
        type: datetime
        source: input
        description: Inclusive start of the tank occupation interval
      - name: brew_end_utc
        type: datetime
        source: input
        description: Exclusive end of the tank occupation interval; must be strictly after brew_start_utc
      - name: loss_basis
        type: enum
        source: input
        default: PRO_RATA
        description: Selects which variant of packaging_loss_allocation runs when the batch closes
        constraints: "{PRO_RATA, LAST_RUN_ABSORBS}"
      - name: state
        type: enum
        source: system
        default: SCHEDULED
        description: Production lifecycle state
        constraints: "{SCHEDULED, BREWING, CONDITIONING, PACKAGED, DUMPED}"
      - name: actual_yield_bbl
        type: number
        source: system
        default: null
        description: Measured yield in barrels, recorded on the BREWING -> CONDITIONING transition
        constraints: "> 0, 3 decimal places"
      - name: packaged_bbl
        type: number
        source: computed
        default: 0.000
        description: "Sum of bbl_removed over PackagingRun rows for this batch with state == COMPLETED (VOIDED and PLANNED excluded)"
      - name: remaining_bbl
        type: number
        source: computed
        default: 0.000
        description: "coalesce(actual_yield_bbl, planned_volume_bbl) - packaged_bbl"
      - name: total_loss_bbl
        type: number
        source: computed
        default: null
        description: "Set when the batch reaches PACKAGED: actual_yield_bbl - packaged_bbl at closure"
      - name: dumped_reason
        type: string
        source: system
        default: null
        description: Free-text reason recorded on the transition to DUMPED

  - name: PackagingRun
    parent: null
    common_fields: true
    fields:
      - name: batch_id
        type: string
        source: input
        description: "FK -> Batch.id; the batch drawn down by this run"
      - name: run_code
        type: string
        source: input
        description: Packaging line run code
        constraints: 1-24 chars, unique
      - name: package_type
        type: enum
        source: input
        description: Container produced by the run
        constraints: "{HALF_BBL_KEG, QUARTER_BBL_KEG, CAN_CASE_24}"
      - name: destination
        type: enum
        source: input
        description: Whether the output is destined for the taproom or for distribution
        constraints: "{TAPROOM, DISTRIBUTION}"
      - name: units_planned
        type: integer
        source: input
        description: Container count the line intends to fill
        constraints: ">= 1"
      - name: units_produced
        type: integer
        source: system
        default: null
        description: Container count actually filled, recorded at completion
        constraints: ">= 1"
      - name: bbl_removed
        type: number
        source: computed
        default: 0.000
        description: "units_produced * BBL_PER_UNIT[package_type], 3 decimal places; reset to 0.000 when the run is VOIDED. BBL_PER_UNIT = {HALF_BBL_KEG: 0.500, QUARTER_BBL_KEG: 0.250, CAN_CASE_24: 0.073} (a 24-pack of 12 oz cans is 288 / 3968 barrels rounded to 3 dp)"
      - name: removed_at_utc
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of completion; this is the tax-determination instant for the barrels
      - name: state
        type: enum
        source: system
        default: PLANNED
        description: Run lifecycle
        constraints: "{PLANNED, COMPLETED, VOIDED}"
      - name: allocated_bbl
        type: number
        source: computed
        default: 0.000
        description: "Sum of allocation_lines[].bbl over DistributionOrder rows with state == ALLOCATED that cite this run"
      - name: shipped_bbl
        type: number
        source: computed
        default: 0.000
        description: "Sum of allocation_lines[].bbl over DistributionOrder rows with state == SHIPPED that cite this run"
      - name: available_bbl
        type: number
        source: computed
        default: 0.000
        description: "bbl_removed - allocated_bbl - shipped_bbl; the conserved packaged-inventory quantity"
      - name: kegs_filled_count
        type: integer
        source: system
        default: 0
        description: Number of KegAsset rows filled from this run
      - name: kegs_outstanding_count
        type: integer
        source: computed
        default: 0
        description: "Count of KegAsset rows with packaging_run_id == this run and state IN {FILLED, TAPPED, DEPLOYED}"
      - name: reconciliation_state
        type: enum
        source: system
        default: NOT_APPLICABLE
        description: "NOT_APPLICABLE for CAN_CASE_24 runs; OPEN once the first keg is filled; RECONCILED once kegs_outstanding_count returns to 0 with kegs_filled_count >= 1"
        constraints: "{NOT_APPLICABLE, OPEN, RECONCILED}"
      - name: keg_shrinkage_oz
        type: number
        source: computed
        default: null
        description: "Set at RECONCILED: sum of depletion_variance_oz over every KegAsset filled from this run"
      - name: loss_share_bbl
        type: number
        source: computed
        default: null
        description: Barrels of brewhouse-to-package loss charged to this run by packaging_loss_allocation when the batch closes
      - name: certified_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the CellarOperator who completed the run
      - name: voided_at_utc
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which the run was voided

  - name: KegAsset
    parent: null
    common_fields: true
    fields:
      - name: keg_serial
        type: string
        source: input
        description: Etched serial number of the physical keg
        constraints: 1-24 chars, unique
      - name: size_bbl
        type: number
        source: input
        description: Nominal keg volume in barrels
        constraints: "one of {0.5, 0.25}"
      - name: packaging_run_id
        type: string
        source: system
        default: null
        description: "FK -> PackagingRun.id; null until the keg is filled, cleared on return"
      - name: filled_beer_id
        type: string
        source: system
        default: null
        description: "FK -> Beer.id; brand currently in the keg, null until filled"
      - name: state
        type: enum
        source: system
        default: EMPTY_DIRTY
        description: Keg circulation state
        constraints: "{EMPTY_DIRTY, CLEANED, FILLED, TAPPED, DEPLOYED, DECOMMISSIONED}"
      - name: filled_volume_oz
        type: number
        source: system
        default: 0
        description: "size_bbl * OZ_PER_BBL recorded at fill time"
      - name: remaining_volume_oz
        type: number
        source: computed
        default: 0
        description: filled_volume_oz - poured_volume_oz
      - name: poured_volume_oz
        type: number
        source: computed
        default: 0
        description: "Sum of volume_oz over TaproomPour rows for this keg since the current fill"
      - name: returned_volume_oz
        type: number
        source: system
        default: null
        description: "returned_volume_gal * 128, recorded on the RETURN movement"
      - name: depletion_variance_oz
        type: number
        source: computed
        default: null
        description: "Set on RETURN: returned_volume_oz - remaining_volume_oz (negative means shrinkage)"
      - name: shrinkage_flagged
        type: boolean
        source: computed
        default: false
        description: "true iff abs(depletion_variance_oz) > KEG_SHRINKAGE_TOLERANCE_PCT * filled_volume_oz (strictly greater)"
      - name: cycle_count
        type: integer
        source: system
        default: 0
        description: Number of completed clean-fill-return cycles
      - name: last_cleaned_utc
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent passing keg wash
      - name: tapped_at_utc
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the most recent TAP movement; the whole-keg tax-determination instant
      - name: deployment_channel
        type: enum
        source: system
        default: null
        description: Channel the keg most recently left the cellar through
        constraints: "{TAPROOM, DISTRIBUTION, EVENT}"

  - name: TaproomPour
    parent: null
    common_fields: false
    note: "Append-only event log; carries only id and created_at. Growler and crowler fills are pours with a large container_type and mandatory sanitation plus label data."
    fields:
      - name: keg_asset_id
        type: string
        source: input
        description: "FK -> KegAsset.id; the tapped keg the pour draws from"
      - name: container_type
        type: enum
        source: input
        description: Vessel the beer was poured into
        constraints: "{SAMPLE_4OZ, HALF_PINT_8OZ, PINT_16OZ, CROWLER_32OZ, GROWLER_64OZ}"
      - name: volume_oz
        type: number
        source: computed
        description: "POUR_OZ[container_type]: 4 / 8 / 16 / 32 / 64"
      - name: price_cents
        type: integer
        source: input
        description: Amount charged for the pour in cents
        constraints: ">= 0"
      - name: poured_at_utc
        type: datetime
        source: system
        description: Logical-clock instant of the pour; the metered tax-determination instant
      - name: poured_by_user_id
        type: string
        source: system
        description: X-User-ID of the TaproomStaff member who recorded the pour
      - name: container_sanitized
        type: boolean
        source: input
        default: null
        description: Attestation that the growler or crowler was sanitized before filling; required when container_type IN {CROWLER_32OZ, GROWLER_64OZ}
      - name: sanitizer_ppm
        type: integer
        source: input
        default: null
        description: Measured sanitizer concentration in ppm; required when container_type IN {CROWLER_32OZ, GROWLER_64OZ}
      - name: contact_time_seconds
        type: integer
        source: input
        default: null
        description: Sanitizer contact time in seconds; required when container_type IN {CROWLER_32OZ, GROWLER_64OZ}
      - name: sanitation_verdict
        type: enum
        source: computed
        default: NOT_REQUIRED
        description: "Output of growler_sanitation_verdict; NOT_REQUIRED for draft pours. Only NOT_REQUIRED and PASS are ever persisted - a FAIL computation aborts the request with ERR_SANITATION_BELOW_STANDARD before the row is written."
        constraints: "{NOT_REQUIRED, PASS}"
      - name: attested_by_user_id
        type: string
        source: input
        default: null
        description: User id of the second person attesting the sanitation reading; required for growler and crowler fills and must differ from poured_by_user_id
      - name: label_fields
        type: object
        source: input
        default: null
        description: "Growler and crowler label content; every key of {brand_name, abv_statement, net_contents, health_warning, fill_date} must be present and non-blank"

  - name: StateLicense
    parent: null
    common_fields: true
    note: "One license per state; carries the self-distribution barrel cap, the territory rule and the franchise-protection flag."
    fields:
      - name: state_code
        type: string
        source: input
        description: Two-letter USPS code the license covers
        constraints: exactly 2 uppercase letters, unique
      - name: license_type
        type: enum
        source: input
        description: Whether the brewery may ship directly into the state or only through a wholesaler
        constraints: "{SELF_DISTRIBUTION, WHOLESALER_ONLY}"
      - name: annual_barrel_cap
        type: number
        source: input
        description: Maximum barrels the brewery may self-distribute into this state per calendar year
        constraints: ">= 0, 2 decimal places"
      - name: franchise_state
        type: boolean
        source: input
        description: true when the state grants statutory franchise protection to appointed wholesalers
      - name: termination_notice_days
        type: integer
        source: input
        default: 90
        description: Statutory notice period in days between a termination request and its effective instant
        constraints: ">= 0 and <= 365"
      - name: effective_from_utc
        type: datetime
        source: input
        description: Inclusive instant from which the license may be used
      - name: expires_at_utc
        type: datetime
        source: input
        description: Exclusive instant at which the license lapses; must be strictly after effective_from_utc
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: License availability; cascaded to SUSPENDED when the brewer's notice is suspended
        constraints: "{ACTIVE, SUSPENDED, EXPIRED}"
      - name: carry_in_barrels_ytd
        type: number
        source: system
        default: 0.000
        description: Pre-go-live barrels self-distributed into this state this calendar year, set only by ytd-adjustments
      - name: barrels_shipped_ytd
        type: number
        source: computed
        default: 0.000
        description: "carry_in_barrels_ytd + sum of allocated_bbl over DistributionOrder rows for this license with state == SHIPPED"
      - name: active_appointment_count
        type: integer
        source: computed
        default: 0
        description: "Count of DistributorAppointment rows for this license with state IN {ACTIVE, TERMINATION_REQUESTED}"

  - name: DistributorAppointment
    parent: null
    common_fields: true
    note: "Appointing a wholesaler in a franchise state permanently changes the brewery's options: self-distribution of the appointed brands is barred while the appointment lives, and termination requires good cause plus a statutory notice period."
    fields:
      - name: state_license_id
        type: string
        source: input
        description: "FK -> StateLicense.id; the state territory being appointed"
      - name: appointed_beer_id
        type: string
        source: input
        default: null
        description: "FK -> Beer.id; null appoints the wholesaler for every brand (ALL_BRANDS scope)"
      - name: distributor_name
        type: string
        source: input
        description: Legal name of the wholesaler
        constraints: 1-120 chars
      - name: brand_scope
        type: enum
        source: computed
        description: "SINGLE_BRAND when appointed_beer_id is non-null, ALL_BRANDS otherwise"
        constraints: "{ALL_BRANDS, SINGLE_BRAND}"
      - name: state
        type: enum
        source: system
        default: PROPOSED
        description: Appointment lifecycle
        constraints: "{PROPOSED, ACTIVE, TERMINATION_REQUESTED, TERMINATED}"
      - name: proposed_by_user_id
        type: string
        source: system
        description: X-User-ID of the BreweryAdmin who proposed the appointment
      - name: approved_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the ComplianceOfficer who approved it; must differ from proposed_by_user_id
      - name: activated_at_utc
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of approval
      - name: termination_requested_at_utc
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the termination request
      - name: termination_effective_utc
        type: datetime
        source: computed
        default: null
        description: "termination_requested_at_utc + StateLicense.termination_notice_days days when the license has franchise_state == true, otherwise equal to termination_requested_at_utc"
      - name: good_cause_code
        type: enum
        source: input
        default: null
        description: Statutory good-cause ground for termination; required in franchise states
        constraints: "{NONPAYMENT, BREACH_OF_CONTRACT, LOSS_OF_LICENSE, VOLUNTARY_MUTUAL}"
      - name: terminated_at_utc
        type: datetime
        source: system
        default: null
        description: Logical-clock instant at which the termination was finalized

  - name: DistributionOrder
    parent: null
    common_fields: true
    fields:
      - name: beer_id
        type: string
        source: input
        description: "FK -> Beer.id; the brand being shipped"
      - name: state_license_id
        type: string
        source: input
        description: "FK -> StateLicense.id; the license the shipment moves under"
      - name: appointment_id
        type: string
        source: computed
        default: null
        description: "FK -> DistributorAppointment.id; the ACTIVE appointment that captured this order, null for SELF_DISTRIBUTED channel"
      - name: order_code
        type: string
        source: input
        description: Sales order code
        constraints: 1-24 chars, unique
      - name: bbl_requested
        type: number
        source: input
        description: Barrels requested
        constraints: "> 0, 2 decimal places"
      - name: ship_to_state_code
        type: string
        source: input
        description: Destination state; must equal the license's state_code (territory rule)
        constraints: exactly 2 uppercase letters
      - name: distance_miles
        type: integer
        source: input
        description: One-way freight distance used by the landed-cost calculation
        constraints: ">= 0"
      - name: requested_ship_utc
        type: datetime
        source: input
        description: Requested removal instant
      - name: channel
        type: enum
        source: computed
        description: "WHOLESALER when an ACTIVE appointment covers (state_license_id, beer_id), SELF_DISTRIBUTED otherwise"
        constraints: "{SELF_DISTRIBUTED, WHOLESALER}"
      - name: product_cents
        type: integer
        source: computed
        description: "bbl_requested * Beer.price_per_bbl_cents, rounded to whole cents"
      - name: freight_cents
        type: integer
        source: computed
        description: Freight after the product-value volume-tier discount
      - name: franchise_fee_cents
        type: integer
        source: computed
        description: Statutory wholesaler margin applied to the subtotal on the WHOLESALER channel, 0 on SELF_DISTRIBUTED
      - name: landed_cost_cents
        type: integer
        source: computed
        description: product_cents + freight_cents + franchise_fee_cents
      - name: state
        type: enum
        source: system
        default: SUBMITTED
        description: Order lifecycle
        constraints: "{SUBMITTED, ALLOCATED, SHIPPED, REJECTED, CANCELLED}"
      - name: allocated_bbl
        type: number
        source: computed
        default: 0.000
        description: "Sum of allocation_lines[].bbl; equals bbl_requested while state IN {ALLOCATED, SHIPPED}, 0.000 otherwise"
      - name: allocation_lines
        type: array
        source: computed
        default: []
        description: "Ordered [{packaging_run_id, bbl}] produced by distribution_allocation_waterfall, in draw-down order"
      - name: rejection_reason
        type: enum
        source: system
        default: null
        description: Why the order was rejected
        constraints: "{NOTICE_SUSPENDED, LICENSE_NOT_ACTIVE, LABEL_REVOKED, INSUFFICIENT_INVENTORY, APPOINTMENT_ACTIVATED}"
      - name: cancel_reason
        type: string
        source: system
        default: null
        description: Free-text reason recorded on the transition to CANCELLED
      - name: shipped_at_utc
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of removal; the distribution tax-determination instant

  - name: ExciseReport
    parent: null
    common_fields: true
    note: "Period excise return. taproom_basis selects which variant of taproom_taxable_barrels runs, so two reports over identical data can disagree."
    fields:
      - name: period_start_utc
        type: datetime
        source: input
        description: Inclusive start of the reporting period
      - name: period_end_utc
        type: datetime
        source: input
        description: Exclusive end of the reporting period; must be strictly after period_start_utc
      - name: taproom_basis
        type: enum
        source: input
        description: Which taproom tax-determination method this return uses
        constraints: "{METERED_POUR, WHOLE_KEG_REMOVAL}"
      - name: amends_report_id
        type: string
        source: input
        default: null
        description: "FK -> ExciseReport.id; null for an original return, otherwise the FILED return this one supersedes"
      - name: taproom_bbl
        type: number
        source: computed
        description: Output of taproom_taxable_barrels under the selected basis, 3 decimal places
      - name: distribution_bbl
        type: number
        source: computed
        description: "Sum of allocated_bbl over DistributionOrder rows with state == SHIPPED and shipped_at_utc in [period_start_utc, period_end_utc), 3 decimal places"
      - name: total_taxable_bbl
        type: number
        source: computed
        description: taproom_bbl + distribution_bbl
      - name: ytd_bbl_before_period
        type: number
        source: computed
        description: "Brewery.carry_in_taproom_bbl + Brewery.carry_in_distribution_bbl + sum of total_taxable_bbl over ExciseReport rows with state == FILED and period_end_utc <= this period_start_utc"
      - name: federal_tax_cents
        type: integer
        source: computed
        description: Tiered federal excise component from federal_state_excise_tax
      - name: state_tax_cents
        type: integer
        source: computed
        description: State excise component with the taproom and distribution split rates
      - name: total_tax_due_cents
        type: integer
        source: computed
        description: federal_tax_cents + state_tax_cents
      - name: state
        type: enum
        source: system
        default: DRAFT
        description: Return lifecycle
        constraints: "{DRAFT, FILED, SUPERSEDED}"
      - name: prepared_by_user_id
        type: string
        source: system
        description: X-User-ID of the BreweryAdmin who created the draft
      - name: filed_by_user_id
        type: string
        source: system
        default: null
        description: X-User-ID of the ComplianceOfficer who filed it; must differ from prepared_by_user_id
      - name: filed_at_utc
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of filing

  - name: EventPermit
    parent: null
    common_fields: true
    fields:
      - name: featured_beer_id
        type: string
        source: input
        description: "FK -> Beer.id; the brand to be poured at the event"
      - name: event_name
        type: string
        source: input
        description: Public name of the festival or off-site event
        constraints: 1-120 chars
      - name: permit_type
        type: enum
        source: input
        description: Class of off-site authorization requested
        constraints: "{FESTIVAL, OFF_SITE_TASTING, FARMERS_MARKET}"
      - name: venue_state_code
        type: string
        source: input
        description: Two-letter USPS code of the venue's state
        constraints: exactly 2 uppercase letters
      - name: event_start_utc
        type: datetime
        source: input
        description: Inclusive start of the event window
      - name: event_end_utc
        type: datetime
        source: input
        description: Inclusive end of the event window; must be strictly after event_start_utc
      - name: requested_bbl
        type: number
        source: input
        description: Barrels the brewery intends to pour at the event
        constraints: "> 0, 2 decimal places"
      - name: state
        type: enum
        source: system
        default: DRAFT
        description: Permit lifecycle with an information-request loop
        constraints: "{DRAFT, SUBMITTED, INFO_REQUESTED, APPROVED, DENIED}"
      - name: info_request_note
        type: string
        source: system
        default: null
        description: Note recorded by StateRegulator on an INFO_REQUESTED decision
      - name: submission_count
        type: integer
        source: system
        default: 0
        description: Number of times the permit has been submitted, incremented on every DRAFT/INFO_REQUESTED -> SUBMITTED transition
      - name: decided_at_utc
        type: datetime
        source: system
        default: null
        description: Logical-clock instant of the terminal decision
      - name: denial_reason
        type: string
        source: system
        default: null
        description: Note recorded by StateRegulator on a DENIED decision

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  - entity: Brewery
    dimension: notice_status
    initial_state: PENDING_NOTICE
    terminal_states: [REVOKED]
    shape: cyclic
    transitions:
      - from: PENDING_NOTICE
        to: ACTIVE
        trigger: "POST /brewery/notice with action=ACTIVATE"
        actor: StateRegulator
        preconditions:
          - "notice_status == PENDING_NOTICE"
        side_effects:
          - "sets notice_effective_utc = current logical clock"
          - "clears suspension_reason"
          - "every Beer's taproom_sellable and distribution_sellable are re-derived"
          - "increments Brewery.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /brewery/notice with action=SUSPEND"
        actor: StateRegulator
        preconditions:
          - "notice_status == ACTIVE"
          - "reason is present and non-blank"
        side_effects:
          - "sets suspension_reason from the request"
          - "CASCADE HOP 1: every StateLicense with status == ACTIVE moves to status SUSPENDED"
          - "CASCADE HOP 2 (caused by hop 1, not by the notice change): for every StateLicense that just moved to SUSPENDED, each DistributionOrder citing it with state IN {SUBMITTED, ALLOCATED} moves to state REJECTED with rejection_reason = NOTICE_SUSPENDED"
          - "CASCADE HOP 3 (caused by hop 2): for every order that was ALLOCATED when hop 2 rejected it, each allocation_lines[] entry is released - the cited PackagingRun.allocated_bbl decreases by that line's bbl and PackagingRun.available_bbl increases by the same amount; the order's allocation_lines becomes [] and allocated_bbl becomes 0.000"
          - "every Beer's taproom_sellable and distribution_sellable become false"
          - "updated_at refreshed on every row touched by hops 1-3; version incremented on Brewery, each StateLicense, each DistributionOrder and each PackagingRun touched"
        note: "Depth-3 transitive cascade; each hop is caused by the previous hop's mutation."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /brewery/notice with action=REINSTATE"
        actor: StateRegulator
        preconditions:
          - "notice_status == SUSPENDED"
        side_effects:
          - "sets notice_effective_utc = current logical clock and clears suspension_reason"
          - "every StateLicense with status == SUSPENDED and expires_at_utc > current logical clock returns to status ACTIVE"
          - "orders rejected during suspension are NOT revived - REJECTED is terminal"
          - "increments Brewery.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /brewery/notice with action=REVOKE"
        actor: StateRegulator
        preconditions:
          - "notice_status == SUSPENDED"
          - "reason is present and non-blank"
        side_effects:
          - "sets suspension_reason from the request"
          - "every StateLicense moves to status SUSPENDED; no further sale operation of any kind is permitted"
          - "increments Brewery.version by 1"

  - entity: Beer
    dimension: registration_state
    initial_state: DRAFT
    terminal_states: []
    shape: branching
    note: "Advances independently of label_state - this is one of two parallel dimensions on the same row. When requires_formula == false the row is minted directly in FORMULA_EXEMPT and this machine never runs."
    transitions:
      - from: DRAFT
        to: FORMULA_PENDING
        trigger: "POST /beers/{beerId}/filings with filing_type=FORMULA"
        actor: ComplianceOfficer
        preconditions:
          - "registration_state == DRAFT"
          - "requires_formula == true"
          - "ingredient_list is present and non-empty"
        side_effects:
          - "label_state is untouched"
          - "increments Beer.version by 1"
      - from: FORMULA_PENDING
        to: FORMULA_APPROVED
        trigger: "POST /beers/{beerId}/filings/FORMULA/decision with decision=APPROVED"
        actor: StateRegulator
        preconditions:
          - "registration_state == FORMULA_PENDING"
        side_effects:
          - "re-derives taproom_sellable (becomes true when Brewery.notice_status == ACTIVE) and distribution_sellable"
          - "increments Beer.version by 1"
      - from: FORMULA_PENDING
        to: DRAFT
        trigger: "POST /beers/{beerId}/filings/FORMULA/decision with decision=REJECTED"
        actor: StateRegulator
        preconditions:
          - "registration_state == FORMULA_PENDING"
        side_effects:
          - "label_state is untouched, so a beer may hold COLA_APPROVED while its formula is back in DRAFT"
          - "increments Beer.version by 1"

  - entity: Beer
    dimension: label_state
    initial_state: NO_LABEL
    terminal_states: []
    shape: cyclic
    note: "Second parallel dimension on the same Beer row; a COLA gates distribution only - taproom draft sales never require it."
    transitions:
      - from: NO_LABEL
        to: COLA_PENDING
        trigger: "POST /beers/{beerId}/filings with filing_type=LABEL"
        actor: ComplianceOfficer
        preconditions:
          - "label_state IN {NO_LABEL, COLA_REVOKED}"
          - "label_fields is present with non-blank brand_name, abv_statement, net_contents and health_warning"
        side_effects:
          - "stores label_fields on the Beer"
          - "registration_state is untouched"
          - "increments Beer.version by 1"
      - from: COLA_REVOKED
        to: COLA_PENDING
        trigger: "POST /beers/{beerId}/filings with filing_type=LABEL (re-filing after revocation)"
        actor: ComplianceOfficer
        preconditions:
          - "label_state == COLA_REVOKED"
          - "label_fields is present and complete"
        side_effects:
          - "clears cola_id"
          - "increments Beer.version by 1"
      - from: COLA_PENDING
        to: COLA_APPROVED
        trigger: "POST /beers/{beerId}/filings/LABEL/decision with decision=APPROVED"
        actor: StateRegulator
        preconditions:
          - "label_state == COLA_PENDING"
          - "cola_id is present and non-blank"
        side_effects:
          - "stores cola_id; re-derives distribution_sellable"
          - "increments Beer.version by 1"
      - from: COLA_PENDING
        to: NO_LABEL
        trigger: "POST /beers/{beerId}/filings/LABEL/decision with decision=REJECTED"
        actor: StateRegulator
        preconditions:
          - "label_state == COLA_PENDING"
        side_effects:
          - "clears label_fields"
          - "increments Beer.version by 1"
      - from: COLA_APPROVED
        to: COLA_REVOKED
        trigger: "POST /beers/{beerId}/filings/LABEL/decision with decision=REVOKED"
        actor: StateRegulator
        preconditions:
          - "label_state == COLA_APPROVED"
        side_effects:
          - "distribution_sellable becomes false while taproom_sellable is unchanged"
          - "CASCADE HOP 1: every DistributionOrder for this beer with state IN {SUBMITTED, ALLOCATED} moves to REJECTED with rejection_reason = LABEL_REVOKED"
          - "CASCADE HOP 2 (caused by hop 1): every allocation line of each just-rejected order is released - PackagingRun.allocated_bbl decreases and available_bbl increases by the line's bbl"
          - "increments Beer.version by 1 and the version of every row touched"

  - entity: Tank
    dimension: status
    initial_state: IDLE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: IDLE
        to: OCCUPIED
        trigger: "POST /batches/{batchId}/start"
        actor: CellarOperator
        preconditions:
          - "status == IDLE (a DIRTY vessel must pass CIP first)"
        side_effects:
          - "sets occupying_batch_id to the starting Batch"
          - "increments Tank.version by 1"
      - from: OCCUPIED
        to: DIRTY
        trigger: "system: the occupying Batch reaches PACKAGED or DUMPED"
        actor: system
        preconditions:
          - "status == OCCUPIED"
        side_effects:
          - "clears occupying_batch_id"
          - "increments Tank.version by 1"
      - from: DIRTY
        to: IDLE
        trigger: "POST /tanks/{tankId}/service with action=CIP"
        actor: CellarOperator
        preconditions:
          - "status == DIRTY"
          - "growler_sanitation_verdict over (sanitizer_ppm, contact_time_seconds) evaluates to PASS"
        side_effects:
          - "sets last_cip_utc = current logical clock and increments cip_cycle_count by 1"
          - "increments Tank.version by 1"
      - from: IDLE
        to: OUT_OF_SERVICE
        trigger: "POST /tanks/{tankId}/service with action=TAKE_OUT_OF_SERVICE"
        actor: CellarOperator
        preconditions:
          - "status == IDLE"
        side_effects:
          - "increments Tank.version by 1"
      - from: OUT_OF_SERVICE
        to: IDLE
        trigger: "POST /tanks/{tankId}/service with action=RETURN_TO_SERVICE"
        actor: CellarOperator
        preconditions:
          - "status == OUT_OF_SERVICE"
        side_effects:
          - "increments Tank.version by 1"

  - entity: Batch
    dimension: state
    initial_state: SCHEDULED
    terminal_states: [PACKAGED, DUMPED]
    shape: branching
    transitions:
      - from: SCHEDULED
        to: BREWING
        trigger: "POST /batches/{batchId}/start"
        actor: CellarOperator
        preconditions:
          - "state == SCHEDULED"
          - "Brewery.notice_status == ACTIVE"
          - "the referenced Tank.status == IDLE"
        side_effects:
          - "Tank moves IDLE -> OCCUPIED and Tank.occupying_batch_id is set (cross-entity)"
          - "increments Batch.version by 1"
      - from: BREWING
        to: CONDITIONING
        trigger: "POST /batches/{batchId}/condition"
        actor: CellarOperator
        preconditions:
          - "state == BREWING"
          - "actual_yield_bbl > 0 and actual_yield_bbl <= Tank.capacity_bbl"
        side_effects:
          - "stores actual_yield_bbl; remaining_bbl becomes actual_yield_bbl - packaged_bbl"
          - "increments Batch.version by 1"
      - from: CONDITIONING
        to: PACKAGED
        trigger: "system: a PackagingRun completes and leaves remaining_bbl <= BATCH_CLOSE_REMAINDER_BBL"
        actor: system
        preconditions:
          - "state == CONDITIONING"
          - "remaining_bbl <= 1.000 after the completing run's bbl_removed is booked (<=, not <)"
        side_effects:
          - "sets total_loss_bbl = actual_yield_bbl - packaged_bbl"
          - "runs packaging_loss_allocation under the batch's loss_basis and writes loss_share_bbl onto every COMPLETED run of the batch"
          - "the occupying Tank moves OCCUPIED -> DIRTY (cross-entity)"
          - "increments Batch.version by 1"
      - from: SCHEDULED
        to: DUMPED
        trigger: "POST /batches/{batchId}/dump"
        actor: CellarOperator
        preconditions:
          - "state == SCHEDULED"
          - "dumped_reason present and non-blank"
        side_effects:
          - "the tank reservation is released; the Tank is untouched because it was never OCCUPIED by this batch"
          - "increments Batch.version by 1"
      - from: BREWING
        to: DUMPED
        trigger: "POST /batches/{batchId}/dump"
        actor: CellarOperator
        preconditions:
          - "state == BREWING"
          - "dumped_reason present and non-blank"
        side_effects:
          - "the occupying Tank moves OCCUPIED -> DIRTY (cross-entity)"
          - "increments Batch.version by 1"
      - from: CONDITIONING
        to: DUMPED
        trigger: "POST /batches/{batchId}/dump"
        actor: CellarOperator
        preconditions:
          - "state == CONDITIONING"
          - "no PackagingRun of this batch is in state PLANNED"
          - "dumped_reason present and non-blank"
        side_effects:
          - "the occupying Tank moves OCCUPIED -> DIRTY (cross-entity)"
          - "sets total_loss_bbl = actual_yield_bbl - packaged_bbl"
          - "increments Batch.version by 1"

  - entity: PackagingRun
    dimension: state
    initial_state: PLANNED
    terminal_states: [VOIDED]
    shape: branching
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /packaging-runs/{runId}/complete"
        actor: CellarOperator
        preconditions:
          - "state == PLANNED"
          - "Batch.state == CONDITIONING"
          - "Brewery.notice_status == ACTIVE"
          - "units_produced >= 1 and units_produced * BBL_PER_UNIT[package_type] <= Batch.remaining_bbl"
        side_effects:
          - "computes bbl_removed = round(units_produced * BBL_PER_UNIT[package_type], 3); sets removed_at_utc = current logical clock, certified_by_user_id = X-User-ID"
          - "available_bbl becomes bbl_removed; Batch.packaged_bbl increases and Batch.remaining_bbl decreases by bbl_removed (ledger sync)"
          - "when the resulting Batch.remaining_bbl <= 1.000 the Batch auto-transitions CONDITIONING -> PACKAGED (bubble up)"
          - "increments PackagingRun.version and Batch.version by 1"
      - from: PLANNED
        to: VOIDED
        trigger: "POST /packaging-runs/{runId}/void"
        actor: CellarOperator
        preconditions:
          - "state == PLANNED"
        side_effects:
          - "sets voided_at_utc; no ledger movement because bbl_removed is still 0.000"
          - "increments PackagingRun.version by 1"
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /packaging-runs/{runId}/void"
        actor: CellarOperator
        preconditions:
          - "state == COMPLETED"
          - "allocated_bbl == 0.000 and shipped_bbl == 0.000"
          - "kegs_filled_count == 0"
        side_effects:
          - "COMPENSATION: Batch.packaged_bbl decreases by the run's bbl_removed and Batch.remaining_bbl increases by the same amount, restoring Batch.actual_yield_bbl == packaged_bbl + remaining_bbl"
          - "sets bbl_removed = 0.000, available_bbl = 0.000, units_produced = null, voided_at_utc = current logical clock"
          - "if the Batch had auto-closed to PACKAGED it stays PACKAGED and total_loss_bbl is recomputed; loss_share_bbl of the voided run is cleared"
          - "increments PackagingRun.version and Batch.version by 1"

  - entity: PackagingRun
    dimension: reconciliation_state
    initial_state: NOT_APPLICABLE
    terminal_states: [RECONCILED]
    shape: compound
    note: "Second parallel dimension on PackagingRun, derived from the states of the kegs filled from the run."
    transitions:
      - from: NOT_APPLICABLE
        to: OPEN
        trigger: "POST /keg-assets/{kegAssetId}/fill against this run"
        actor: CellarOperator
        preconditions:
          - "package_type IN {HALF_BBL_KEG, QUARTER_BBL_KEG}"
        side_effects:
          - "kegs_filled_count and kegs_outstanding_count each increase by 1"
          - "increments PackagingRun.version by 1"
      - from: OPEN
        to: RECONCILED
        trigger: "system: the last outstanding keg of the run returns (kegs_outstanding_count reaches 0)"
        actor: system
        preconditions:
          - "kegs_outstanding_count == 0 after the returning keg is booked"
          - "kegs_filled_count >= 1"
        side_effects:
          - "sets keg_shrinkage_oz = sum of depletion_variance_oz over every KegAsset filled from this run"
          - "increments PackagingRun.version by 1"

  - entity: KegAsset
    dimension: state
    initial_state: EMPTY_DIRTY
    terminal_states: [DECOMMISSIONED]
    shape: cyclic
    transitions:
      - from: EMPTY_DIRTY
        to: CLEANED
        trigger: "POST /keg-assets/{kegAssetId}/clean"
        actor: CellarOperator
        preconditions:
          - "state == EMPTY_DIRTY"
          - "growler_sanitation_verdict over (sanitizer_ppm, contact_time_seconds) evaluates to PASS"
        side_effects:
          - "sets last_cleaned_utc = current logical clock; clears packaging_run_id, filled_beer_id, returned_volume_oz, depletion_variance_oz, shrinkage_flagged"
          - "increments KegAsset.version by 1"
      - from: CLEANED
        to: FILLED
        trigger: "POST /keg-assets/{kegAssetId}/fill"
        actor: CellarOperator
        preconditions:
          - "state == CLEANED"
          - "the referenced PackagingRun.state == COMPLETED"
          - "BBL_PER_UNIT[run.package_type] == this keg's size_bbl"
          - "run.kegs_filled_count < run.units_produced"
        side_effects:
          - "sets packaging_run_id, filled_beer_id (from run -> batch -> beer), filled_volume_oz = size_bbl * 3968, remaining_volume_oz = filled_volume_oz, poured_volume_oz = 0"
          - "the run's reconciliation_state moves NOT_APPLICABLE -> OPEN on the first fill; kegs_filled_count and kegs_outstanding_count increase by 1"
          - "increments KegAsset.version and PackagingRun.version by 1"
      - from: FILLED
        to: TAPPED
        trigger: "POST /keg-assets/{kegAssetId}/movements with movement_type=TAP"
        actor: CellarOperator | TaproomStaff
        preconditions:
          - "state == FILLED"
          - "Brewery.notice_status == ACTIVE"
          - "the filled Beer's taproom_sellable == true"
        side_effects:
          - "sets tapped_at_utc = current logical clock and deployment_channel = TAPROOM; this instant is what WHOLE_KEG_REMOVAL basis counts"
          - "increments KegAsset.version by 1"
      - from: FILLED
        to: DEPLOYED
        trigger: "POST /keg-assets/{kegAssetId}/movements with movement_type=DEPLOY_DISTRIBUTION or DEPLOY_EVENT"
        actor: CellarOperator
        preconditions:
          - "state == FILLED"
          - "Brewery.notice_status == ACTIVE"
          - "for DEPLOY_DISTRIBUTION the filled Beer's distribution_sellable == true; for DEPLOY_EVENT the beer must be featured on an EventPermit with state == APPROVED"
        side_effects:
          - "sets deployment_channel = DISTRIBUTION or EVENT"
          - "increments KegAsset.version by 1"
      - from: TAPPED
        to: EMPTY_DIRTY
        trigger: "POST /keg-assets/{kegAssetId}/movements with movement_type=RETURN"
        actor: CellarOperator | TaproomStaff
        preconditions:
          - "state == TAPPED"
          - "returned_volume_gal present, >= 0 and returned_volume_gal * 128 <= filled_volume_oz"
        side_effects:
          - "CASCADE HOP 1: sets returned_volume_oz = returned_volume_gal * 128, depletion_variance_oz = returned_volume_oz - remaining_volume_oz, shrinkage_flagged per keg_depletion_variance, cycle_count += 1"
          - "CASCADE HOP 2 (caused by hop 1): the owning PackagingRun.kegs_outstanding_count decreases by 1"
          - "CASCADE HOP 3 (caused by hop 2): when that count reaches 0 the run's reconciliation_state moves OPEN -> RECONCILED and keg_shrinkage_oz is written from the sum of every sibling keg's depletion_variance_oz"
          - "increments KegAsset.version and PackagingRun.version by 1"
      - from: DEPLOYED
        to: EMPTY_DIRTY
        trigger: "POST /keg-assets/{kegAssetId}/movements with movement_type=RETURN"
        actor: CellarOperator
        preconditions:
          - "state == DEPLOYED"
          - "returned_volume_gal present, >= 0 and returned_volume_gal * 128 <= filled_volume_oz"
        side_effects:
          - "same three-hop cascade as the TAPPED -> EMPTY_DIRTY return"
          - "increments KegAsset.version and PackagingRun.version by 1"
      - from: EMPTY_DIRTY
        to: DECOMMISSIONED
        trigger: "POST /keg-assets/{kegAssetId}/movements with movement_type=DECOMMISSION"
        actor: CellarOperator
        preconditions:
          - "state == EMPTY_DIRTY"
        side_effects:
          - "the keg leaves circulation permanently"
          - "increments KegAsset.version by 1"

  - entity: StateLicense
    dimension: status
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    shape: guarded
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: Brewery.notice_status moves ACTIVE -> SUSPENDED or SUSPENDED -> REVOKED"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "cascades to this license's SUBMITTED and ALLOCATED orders (rejection_reason NOTICE_SUSPENDED) and thence to run allocations"
          - "increments StateLicense.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: Brewery.notice_status moves SUSPENDED -> ACTIVE"
        actor: system
        preconditions:
          - "status == SUSPENDED"
          - "expires_at_utc > current logical clock"
        side_effects:
          - "increments StateLicense.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: lazy expiry re-evaluation on any request that reads this license"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "current logical clock >= expires_at_utc"
        side_effects:
          - "every DistributionOrder citing this license with state IN {SUBMITTED, ALLOCATED} moves to REJECTED with rejection_reason = LICENSE_NOT_ACTIVE, and each released allocation line decrements the cited run's allocated_bbl"
          - "increments StateLicense.version by 1"

  - entity: DistributorAppointment
    dimension: state
    initial_state: PROPOSED
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /distributor-appointments/{appointmentId}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "state == PROPOSED"
          - "X-User-ID != proposed_by_user_id (segregation of duties)"
          - "no other DistributorAppointment with state IN {ACTIVE, TERMINATION_REQUESTED} covers the same (state_license_id, brand scope)"
          - "the StateLicense.status == ACTIVE"
        side_effects:
          - "sets approved_by_user_id = X-User-ID and activated_at_utc = current logical clock"
          - "StateLicense.active_appointment_count increases by 1 and the state_code joins Brewery.franchise_locked_state_codes"
          - "CASCADE: every DistributionOrder with channel == SELF_DISTRIBUTED, state IN {SUBMITTED, ALLOCATED}, the same state_license_id and a beer inside this appointment's scope moves to REJECTED with rejection_reason = APPOINTMENT_ACTIVATED; each released allocation line decrements the cited run's allocated_bbl and increments its available_bbl"
          - "increments DistributorAppointment.version, StateLicense.version and every touched row's version by 1"
      - from: ACTIVE
        to: TERMINATION_REQUESTED
        trigger: "POST /distributor-appointments/{appointmentId}/termination with phase=REQUEST"
        actor: ComplianceOfficer
        preconditions:
          - "state == ACTIVE"
          - "when the StateLicense.franchise_state == true, good_cause_code is present"
        side_effects:
          - "sets termination_requested_at_utc = current logical clock and computes termination_effective_utc (request instant + termination_notice_days days in franchise states, otherwise the request instant)"
          - "self-distribution stays barred for the appointed scope until the termination is finalized"
          - "increments DistributorAppointment.version by 1"
      - from: TERMINATION_REQUESTED
        to: ACTIVE
        trigger: "POST /distributor-appointments/{appointmentId}/termination with phase=WITHDRAW"
        actor: ComplianceOfficer
        preconditions:
          - "state == TERMINATION_REQUESTED"
        side_effects:
          - "clears termination_requested_at_utc, termination_effective_utc and good_cause_code"
          - "increments DistributorAppointment.version by 1"
      - from: TERMINATION_REQUESTED
        to: TERMINATED
        trigger: "POST /distributor-appointments/{appointmentId}/termination with phase=FINALIZE"
        actor: ComplianceOfficer
        preconditions:
          - "state == TERMINATION_REQUESTED"
          - "current logical clock >= termination_effective_utc"
        side_effects:
          - "sets terminated_at_utc; StateLicense.active_appointment_count decreases by 1; the state_code leaves Brewery.franchise_locked_state_codes when no other appointment holds it"
          - "self-distribution of the previously appointed scope becomes available again"
          - "increments DistributorAppointment.version and StateLicense.version by 1"

  - entity: DistributionOrder
    dimension: state
    initial_state: SUBMITTED
    terminal_states: [SHIPPED, REJECTED, CANCELLED]
    shape: branching
    transitions:
      - from: SUBMITTED
        to: ALLOCATED
        trigger: "POST /distribution-orders/{orderId}/allocate"
        actor: BreweryAdmin
        preconditions:
          - "state == SUBMITTED"
          - "Brewery.notice_status == ACTIVE and StateLicense.status == ACTIVE"
          - "distribution_allocation_waterfall finds a candidate set whose summed available_bbl >= bbl_requested"
        side_effects:
          - "writes allocation_lines in draw-down order and sets allocated_bbl = bbl_requested"
          - "each cited PackagingRun.allocated_bbl increases and available_bbl decreases by that line's bbl (ledger sync)"
          - "increments DistributionOrder.version and every cited run's version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /distribution-orders/{orderId}/allocate when the candidate pool cannot cover the request"
        actor: BreweryAdmin
        preconditions:
          - "state == SUBMITTED"
          - "summed available_bbl over the candidate set < bbl_requested (including the empty-pool case)"
        side_effects:
          - "sets rejection_reason = INSUFFICIENT_INVENTORY; allocation_lines stays [] and allocated_bbl stays 0.000"
          - "no PackagingRun is touched"
          - "increments DistributionOrder.version by 1"
        note: "Branch B of the allocate fork; the endpoint answers 200 with the rejected order rather than an error body."
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /distribution-orders/{orderId}/ship"
        actor: BreweryAdmin
        preconditions:
          - "state == ALLOCATED"
          - "Brewery.notice_status == ACTIVE and StateLicense.status == ACTIVE"
          - "for channel SELF_DISTRIBUTED: StateLicense.barrels_shipped_ytd + allocated_bbl <= annual_barrel_cap"
        side_effects:
          - "sets shipped_at_utc = current logical clock"
          - "each cited PackagingRun moves the line's bbl from allocated_bbl to shipped_bbl, leaving available_bbl unchanged"
          - "StateLicense.barrels_shipped_ytd increases by allocated_bbl"
          - "increments DistributionOrder.version, StateLicense.version and every cited run's version by 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /distribution-orders/{orderId}/cancel"
        actor: BreweryAdmin
        preconditions:
          - "state == SUBMITTED"
          - "reason present and non-blank"
        side_effects:
          - "sets cancel_reason; no ledger movement because nothing was allocated"
          - "increments DistributionOrder.version by 1"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /distribution-orders/{orderId}/cancel"
        actor: BreweryAdmin
        preconditions:
          - "state == ALLOCATED"
          - "reason present and non-blank"
        side_effects:
          - "COMPENSATION: every allocation line is released - the cited PackagingRun.allocated_bbl decreases and available_bbl increases by that line's bbl, so bbl_removed == available_bbl + allocated_bbl + shipped_bbl still holds with the same bbl_removed"
          - "sets allocation_lines = [] and allocated_bbl = 0.000; sets cancel_reason"
          - "increments DistributionOrder.version and every cited run's version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system: notice suspension, license suspension or expiry, COLA revocation, or appointment activation"
        actor: system
        preconditions:
          - "state == SUBMITTED"
        side_effects:
          - "sets rejection_reason to NOTICE_SUSPENDED, LICENSE_NOT_ACTIVE, LABEL_REVOKED or APPOINTMENT_ACTIVATED per the originating cascade"
          - "increments DistributionOrder.version by 1"
      - from: ALLOCATED
        to: REJECTED
        trigger: "system: notice suspension, license suspension or expiry, COLA revocation, or appointment activation"
        actor: system
        preconditions:
          - "state == ALLOCATED"
        side_effects:
          - "sets rejection_reason per the originating cascade"
          - "releases every allocation line back to the cited PackagingRun rows (allocated_bbl down, available_bbl up)"
          - "increments DistributionOrder.version and every cited run's version by 1"

  - entity: ExciseReport
    dimension: state
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    shape: linear
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /excise-reports/{reportId}/file"
        actor: ComplianceOfficer
        preconditions:
          - "state == DRAFT"
          - "X-User-ID != prepared_by_user_id (segregation of duties)"
          - "current logical clock >= period_end_utc"
          - "when amends_report_id is null, no other FILED ExciseReport shares the same (period_start_utc, period_end_utc)"
          - "when amends_report_id is non-null, the target report's state == FILED"
        side_effects:
          - "recomputes taproom_bbl, distribution_bbl, ytd_bbl_before_period and the tax components at filing time, then freezes them"
          - "sets filed_by_user_id = X-User-ID and filed_at_utc = current logical clock"
          - "Brewery.taproom_bbl_ytd and distribution_bbl_ytd absorb this report's barrels"
          - "when amends_report_id is non-null, the amended report moves FILED -> SUPERSEDED and its barrels leave the YTD aggregates"
          - "increments ExciseReport.version by 1 (and the amended report's version)"
      - from: FILED
        to: SUPERSEDED
        trigger: "system: an amending ExciseReport that cites this row is filed"
        actor: system
        preconditions:
          - "state == FILED"
        side_effects:
          - "this report's barrels and taxes stop counting toward Brewery YTD aggregates"
          - "increments ExciseReport.version by 1"

  - entity: EventPermit
    dimension: state
    initial_state: DRAFT
    terminal_states: [APPROVED, DENIED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /event-permits/{permitId}/submit"
        actor: ComplianceOfficer
        preconditions:
          - "state == DRAFT"
          - "Brewery.notice_status == ACTIVE"
          - "the featured Beer's taproom_sellable == true"
        side_effects:
          - "increments submission_count by 1"
          - "increments EventPermit.version by 1"
      - from: SUBMITTED
        to: INFO_REQUESTED
        trigger: "POST /event-permits/{permitId}/decision with decision=INFO_REQUESTED"
        actor: StateRegulator
        preconditions:
          - "state == SUBMITTED"
          - "note present and non-blank"
        side_effects:
          - "stores info_request_note"
          - "increments EventPermit.version by 1"
      - from: INFO_REQUESTED
        to: SUBMITTED
        trigger: "POST /event-permits/{permitId}/submit (re-submission after an information request)"
        actor: ComplianceOfficer
        preconditions:
          - "state == INFO_REQUESTED"
          - "Brewery.notice_status == ACTIVE"
        side_effects:
          - "increments submission_count by 1 and clears info_request_note"
          - "increments EventPermit.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /event-permits/{permitId}/decision with decision=APPROVED"
        actor: StateRegulator
        preconditions:
          - "state == SUBMITTED"
          - "the count of APPROVED permits in the same venue_state_code whose closed [event_start_utc, event_end_utc] interval intersects this permit's closed interval is < MAX_CONCURRENT_OFFSITE_PERMITS_PER_STATE"
        side_effects:
          - "sets decided_at_utc; kegs may now be deployed with movement_type=DEPLOY_EVENT for the featured beer"
          - "increments EventPermit.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /event-permits/{permitId}/decision with decision=DENIED"
        actor: StateRegulator
        preconditions:
          - "state == SUBMITTED"
          - "note present and non-blank"
        side_effects:
          - "stores denial_reason and sets decided_at_utc"
          - "increments EventPermit.version by 1"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules (OCC on the parent's version only)
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: packaging-run-create-stale-batch
    parent_entity: Batch
    write_endpoint: "POST /packaging-runs"
    occ_field: "expected_batch_version"
    description: |
      Creating a PackagingRun against a Batch whose version has advanced since the
      client last observed it is rejected. The product spec lets a newly created run
      legitimately claim the batch's remaining barrels, so a second create against a
      stale view of the batch would otherwise succeed while planning against volume
      another run has already claimed.
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412
  - rule_id: appointment-create-stale-license
    parent_entity: StateLicense
    write_endpoint: "POST /distributor-appointments"
    occ_field: "expected_state_license_version"
    description: |
      Proposing a DistributorAppointment against a StateLicense whose version has
      advanced since the client last observed it is rejected. A newer proposal
      legitimately supersedes the territory scope a prior proposal staked out, so
      without the version check a client working from a stale license view would
      appoint a wholesaler over a scope that has already moved.
    error_id: ERR_STALE_LICENSE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------

calculations:
  - name: taproom_taxable_barrels
    trigger: "On POST /excise-reports (draft computation) and re-run at POST /excise-reports/{reportId}/file, where the values are frozen"
    algorithm: aggregation
    formula: |
      # ExciseReport.taproom_basis selects the variant. Both variants read the SAME
      # period window [period_start_utc, period_end_utc) - inclusive start, exclusive end.
      if taproom_basis == METERED_POUR:
          oz = sum(pour.volume_oz
                   for pour in TaproomPour
                   if period_start_utc <= pour.poured_at_utc < period_end_utc)
          taproom_bbl = round_half_up(oz / OZ_PER_BBL, 3)
      else:  # WHOLE_KEG_REMOVAL
          taproom_bbl = round_half_up(
              sum(keg.size_bbl
                  for keg in KegAsset
                  if keg.deployment_channel == 'TAPROOM'
                  and keg.tapped_at_utc is not None
                  and period_start_utc <= keg.tapped_at_utc < period_end_utc),
              3)
    input_set: |
      METERED_POUR: every TaproomPour row whose poured_at_utc falls in the window, regardless of
      container_type - a 4 oz sample counts exactly as much as its volume. Pours are append-only
      so no row ever leaves the set.
      WHOLE_KEG_REMOVAL: every KegAsset whose most recent TAP movement (tapped_at_utc) falls in the
      window and whose deployment_channel == TAPROOM. Kegs DEPLOYED to distribution or to an event
      are excluded; a keg tapped before period_start_utc is excluded even if it is still pouring
      inside the window.
    constants:
      OZ_PER_BBL: 3968
      POUR_OZ: "{SAMPLE_4OZ: 4, HALF_PINT_8OZ: 8, PINT_16OZ: 16, CROWLER_32OZ: 32, GROWLER_64OZ: 64}"
    precision: "3 decimal places, round_half_up"
    variants:
      - name: metered_pour
        when: "taproom_basis == METERED_POUR - the brewery meters what it actually serves"
        difference: |
          Taxes only the ounces recorded as pours. Beer still sitting in a tapped keg, and beer lost
          to foam or line cleaning, is untaxed until it is poured. A half-barrel keg tapped inside the
          window from which three 16 oz pints were pulled yields 48 / 3968 = 0.012 bbl.
      - name: whole_keg_removal
        when: "taproom_basis == WHOLE_KEG_REMOVAL - the brewery determines tax on the whole container at tap"
        difference: |
          Taxes the keg's full nominal size_bbl at the instant of the TAP movement and ignores every
          pour entirely. The same half-barrel keg with three pints pulled yields 0.500 bbl - a
          divergence of 0.488 bbl on identical underlying data.

  - name: packaging_loss_allocation
    trigger: "When a Batch transitions CONDITIONING -> PACKAGED (auto-close on the completing PackagingRun), and re-run on the compensating COMPLETED -> VOIDED run void"
    algorithm: waterfall_allocation
    formula: |
      runs = [r for r in PackagingRun if r.batch_id == batch.id and r.state == 'COMPLETED']
      runs.sort(key=lambda r: r.created_at)          # ascending; never by id
      total_loss = round_half_up(batch.actual_yield_bbl - batch.packaged_bbl, 3)
      if not runs or total_loss <= 0:
          for r in runs: r.loss_share_bbl = 0.000
          return
      if batch.loss_basis == 'PRO_RATA':
          # 1. proportional share per run, each rounded to 3 dp INDEPENDENTLY (nested rounding)
          for r in runs:
              r.loss_share_bbl = round_half_up(total_loss * r.bbl_removed / batch.packaged_bbl, 3)
          # 2. the rounding remainder is assigned in full to ONE run - never spread
          remainder = round_half_up(total_loss - sum(r.loss_share_bbl for r in runs), 3)
          if remainder != 0:
              winner = max(runs, key=lambda r: (r.bbl_removed, negate(r.created_at)))
              # largest bbl_removed wins; ties broken by EARLIEST created_at (created_at ASC)
              winner.loss_share_bbl = round_half_up(winner.loss_share_bbl + remainder, 3)
      else:  # LAST_RUN_ABSORBS
          for r in runs: r.loss_share_bbl = 0.000
          runs[-1].loss_share_bbl = total_loss   # last run by created_at ASC absorbs everything
      # invariant in BOTH variants: sum(loss_share_bbl) == total_loss exactly
    input_set: |
      Only PackagingRun rows of the closing batch with state == COMPLETED. PLANNED runs are not yet
      charged and VOIDED runs are excluded and have loss_share_bbl cleared to null. When a COMPLETED
      run of an already-PACKAGED batch is voided, total_loss_bbl is recomputed and the allocation is
      re-run over the surviving COMPLETED runs.
    constants:
      LOSS_ALLOCATION_DP: 3
    precision: "3 decimal places, round_half_up; the remainder assignment keeps the sum exact"
    variants:
      - name: pro_rata
        when: "Batch.loss_basis == PRO_RATA"
        difference: |
          Every completed run carries loss in proportion to its own bbl_removed, then a single run
          absorbs the rounding remainder. For a 16.000 bbl yield packaged by three runs of 5.000 bbl
          each (total_loss 1.000): each raw share is 1.000 * 5.000 / 15.000 = 0.3333... -> 0.333, the
          sum is 0.999, and the 0.001 remainder goes to the earliest-created run because all three tie
          on bbl_removed. Result: 0.334 / 0.333 / 0.333.
      - name: last_run_absorbs
        when: "Batch.loss_basis == LAST_RUN_ABSORBS"
        difference: |
          The final run by created_at ASC absorbs the entire loss and every earlier run carries
          0.000. The same three-run batch yields 0.000 / 0.000 / 1.000 - identical inputs, a
          completely different distribution.

  - name: federal_state_excise_tax
    trigger: "On POST /excise-reports and re-run at POST /excise-reports/{reportId}/file, where the amounts are frozen"
    algorithm: tiered_pricing
    formula: |
      total_bbl = round_half_up(taproom_bbl + distribution_bbl, 3)
      # --- federal: CBMA reduced rate up to the annual limit, then the standard rate.
      # ytd_bbl_before_period consumes the reduced tier BEFORE this period's barrels do.
      tier1_bbl = max(0, min(total_bbl, FED_TIER1_LIMIT_BBL - ytd_bbl_before_period))
      tier2_bbl = round_half_up(total_bbl - tier1_bbl, 3)
      federal_tax_cents = (round_half_up(tier1_bbl * FED_TIER1_RATE_CENTS_PER_BBL, 0)
                           + round_half_up(tier2_bbl * FED_TIER2_RATE_CENTS_PER_BBL, 0))
      # --- state: split rate, taproom barrels are taxed at the higher on-premise rate
      state_raw_cents = (round_half_up(taproom_bbl * STATE_TAPROOM_RATE_CENTS_PER_BBL, 0)
                         + round_half_up(distribution_bbl * STATE_DISTRIBUTION_RATE_CENTS_PER_BBL, 0))
      if ytd_bbl_before_period + total_bbl <= SMALL_BREWER_STATE_CREDIT_LIMIT_BBL:
          state_tax_cents = round_half_up(state_raw_cents * (1 - SMALL_BREWER_STATE_CREDIT_PCT), 0)
      else:
          state_tax_cents = state_raw_cents
      total_tax_due_cents = federal_tax_cents + state_tax_cents
    input_set: |
      taproom_bbl and distribution_bbl of the report under computation. ytd_bbl_before_period sums
      total_taxable_bbl over ExciseReport rows with state == FILED whose period_end_utc <= this
      report's period_start_utc, plus Brewery.carry_in_taproom_bbl + carry_in_distribution_bbl.
      SUPERSEDED reports never contribute; an amending report therefore sees the same
      ytd_bbl_before_period the superseded original saw.
    constants:
      FED_TIER1_LIMIT_BBL: 60000
      FED_TIER1_RATE_CENTS_PER_BBL: 350
      FED_TIER2_RATE_CENTS_PER_BBL: 1600
      STATE_TAPROOM_RATE_CENTS_PER_BBL: 1085
      STATE_DISTRIBUTION_RATE_CENTS_PER_BBL: 870
      SMALL_BREWER_STATE_CREDIT_PCT: 0.50
      SMALL_BREWER_STATE_CREDIT_LIMIT_BBL: 15000
    precision: |
      Each tier and each state component is rounded to whole cents independently with round_half_up
      BEFORE summation (nested rounding), so the total is not the rounding of the exact product.
      Barrel quantities carry 3 decimal places.

  - name: distribution_order_landed_cost
    trigger: "On POST /distribution-orders, before any state or ledger effect"
    algorithm: threshold
    formula: |
      # STEP ORDER IS PINNED. Each step consumes the rounded output of the previous step.
      # 1. product value
      product_cents = round_half_up(bbl_requested * beer.price_per_bbl_cents, 0)
      # 2. raw freight: a distance leg plus a volume leg, each rounded independently
      freight_raw_cents = (round_half_up(distance_miles * FREIGHT_PER_MILE_CENTS, 0)
                           + round_half_up(bbl_requested * FREIGHT_PER_BBL_CENTS, 0))
      # 3. volume discount tier chosen from the ROUNDED product_cents (step 1), never from the raw product
      if   product_cents >= FREIGHT_DISCOUNT_TIER3_CENTS: pct = FREIGHT_DISCOUNT_TIER3_PCT
      elif product_cents >= FREIGHT_DISCOUNT_TIER2_CENTS: pct = FREIGHT_DISCOUNT_TIER2_PCT
      elif product_cents >= FREIGHT_DISCOUNT_TIER1_CENTS: pct = FREIGHT_DISCOUNT_TIER1_PCT
      else:                                              pct = 0
      # 4. discount rounded on its own, then subtracted
      freight_cents = freight_raw_cents - round_half_up(freight_raw_cents * pct, 0)
      # 5. franchise fee applies to the subtotal (product + DISCOUNTED freight), WHOLESALER channel only
      subtotal_cents = product_cents + freight_cents
      franchise_fee_cents = (round_half_up(subtotal_cents * FRANCHISE_FEE_PCT, 0)
                             if channel == 'WHOLESALER' else 0)
      # 6. total
      landed_cost_cents = product_cents + freight_cents + franchise_fee_cents
    input_set: |
      The order's own bbl_requested and distance_miles, the price_per_bbl_cents of the referenced
      Beer read at creation time (a later price change does not restate a stored order), and the
      channel derived from whether an ACTIVE DistributorAppointment covers (state_license_id, beer_id).
    constants:
      FREIGHT_PER_MILE_CENTS: 30
      FREIGHT_PER_BBL_CENTS: 1200
      FREIGHT_DISCOUNT_TIER1_CENTS: 100000
      FREIGHT_DISCOUNT_TIER1_PCT: 0.10
      FREIGHT_DISCOUNT_TIER2_CENTS: 200000
      FREIGHT_DISCOUNT_TIER2_PCT: 0.20
      FREIGHT_DISCOUNT_TIER3_CENTS: 400000
      FREIGHT_DISCOUNT_TIER3_PCT: 0.30
      FRANCHISE_FEE_PCT: 0.03
    precision: |
      Whole cents at every step, round_half_up. Applying the discount to the un-rounded freight, or
      the franchise fee to the un-discounted subtotal, changes the answer - the pinned order above is
      the only correct one. Tier selection is inclusive at the boundary (>=): a product value of
      exactly 200000 cents takes the 0.20 tier, 199999 takes the 0.10 tier.

  - name: distribution_allocation_waterfall
    trigger: "On POST /distribution-orders/{orderId}/allocate"
    algorithm: waterfall_allocation
    formula: |
      candidates = [r for r in PackagingRun
                    if r.state == 'COMPLETED'
                    and r.destination == 'DISTRIBUTION'
                    and r.available_bbl > 0
                    and Batch[r.batch_id].beer_id == order.beer_id]
      candidates.sort(key=lambda r: (r.removed_at_utc, r.created_at))   # oldest stock first
      if sum(r.available_bbl for r in candidates) < order.bbl_requested:
          order.state = 'REJECTED'; order.rejection_reason = 'INSUFFICIENT_INVENTORY'
          return   # ALL-OR-NOTHING: not one barrel is reserved, no run is touched
      remaining = order.bbl_requested
      lines = []
      for r in candidates:
          if remaining <= 0: break
          take = min(r.available_bbl, remaining)
          lines.append({'packaging_run_id': r.id, 'bbl': round_half_up(take, 3)})
          r.allocated_bbl += take            # r.available_bbl falls by the same amount
          remaining = round_half_up(remaining - take, 3)
      order.allocation_lines = lines         # stored in draw-down order
      order.allocated_bbl = order.bbl_requested
      order.state = 'ALLOCATED'
    input_set: |
      Only COMPLETED runs whose destination is DISTRIBUTION and whose batch produced the order's beer.
      TAPROOM-destined runs are never drawn from even when idle stock is sitting there, PLANNED runs
      have no inventory yet, and VOIDED runs have available_bbl 0.000. The empty-candidate case is
      the same branch as the short-pool case: REJECTED with INSUFFICIENT_INVENTORY.
    constants:
      ALLOCATION_DP: 3
    precision: |
      3 decimal places, round_half_up, on every line. Ordering is strictly by removed_at_utc ASC with
      created_at ASC as the tie-break for two runs completed at the same logical instant; the row id
      is never consulted. A different order over the same pool produces different allocation_lines,
      so the sort is observable.

  - name: keg_depletion_variance
    trigger: "On POST /keg-assets/{kegAssetId}/movements with movement_type=RETURN, and again when the owning run reconciles"
    algorithm: aggregation
    formula: |
      returned_volume_oz    = round_half_up(returned_volume_gal * OZ_PER_GAL, 2)
      expected_oz           = keg.filled_volume_oz - keg.poured_volume_oz   # == remaining_volume_oz
      depletion_variance_oz = round_half_up(returned_volume_oz - expected_oz, 2)
      tolerance_oz          = round_half_up(KEG_SHRINKAGE_TOLERANCE_PCT * keg.filled_volume_oz, 2)
      shrinkage_flagged     = abs(depletion_variance_oz) > tolerance_oz     # STRICTLY greater
      # at reconciliation of the owning run:
      run.keg_shrinkage_oz = round_half_up(
          sum(k.depletion_variance_oz for k in KegAsset if k.packaging_run_id == run.id), 2)
    input_set: |
      poured_volume_oz sums only TaproomPour rows recorded since the current fill - a keg that has been
      cleaned and refilled starts from zero. The run-level roll-up sums depletion_variance_oz over every
      keg still linked to the run, including kegs whose own variance was inside tolerance.
    constants:
      OZ_PER_GAL: 128
      KEG_SHRINKAGE_TOLERANCE_PCT: 0.02
    precision: |
      Every ounce quantity and the tolerance carry 2 decimal places, round_half_up. The comparison is
      strictly greater: a half-barrel keg (1984.00 oz filled, tolerance 39.68 oz) returned with a
      variance of exactly -39.68 oz is NOT flagged, while -39.69 oz is.

  - name: growler_sanitation_verdict
    trigger: "On POST /taproom-pours for CROWLER_32OZ and GROWLER_64OZ containers, on POST /keg-assets/{kegAssetId}/clean, and on POST /tanks/{tankId}/service with action=CIP"
    algorithm: threshold
    formula: |
      # A blank/absent reading is a schema failure, not a FAIL verdict.
      in_band  = SANITIZER_MIN_PPM <= sanitizer_ppm <= SANITIZER_MAX_PPM   # BOTH bounds inclusive
      long_enough = contact_time_seconds >= SANITATION_MIN_CONTACT_SECONDS # inclusive
      verdict = 'PASS' if (in_band and long_enough) else 'FAIL'
      # 'FAIL' is never persisted: the request aborts with ERR_SANITATION_BELOW_STANDARD (422)
      # and no TaproomPour row, keg clean, or CIP cycle is recorded.
    input_set: |
      The sanitizer_ppm and contact_time_seconds submitted with the request. For draft pours
      (SAMPLE_4OZ, HALF_PINT_8OZ, PINT_16OZ) the calculation does not run at all and
      sanitation_verdict is persisted as NOT_REQUIRED.
    constants:
      SANITIZER_MIN_PPM: 150
      SANITIZER_MAX_PPM: 400
      SANITATION_MIN_CONTACT_SECONDS: 60
    precision: |
      Integer comparison, all three thresholds inclusive. 150 ppm passes and 149 fails; 400 ppm
      passes (over-concentration is a rinse hazard) and 401 fails; 60 seconds passes and 59 fails.

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; gaps left for insertion)
# ---------------------------------------------------------------------------

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-blank, and X-User-Role names a role declared in the RBAC matrix. A header supplied as an empty string counts as absent."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 12
    category: auth
    check: "The role named by X-User-Role appears in the endpoint's declared roles list. Evaluated before the request body is inspected, so a forbidden role on a malformed body still yields the 403."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 14
    category: existence
    check: |
      Request body and query schema: unknown-enum rejection, numeric range and decimal-place limits,
      required-field presence, datetime strings parseable as ISO-8601 UTC instants, and pagination
      guards (limit integer in [1, 100], offset integer >= 0). Conditional requirements count here
      too: container_type IN {CROWLER_32OZ, GROWLER_64OZ} makes container_sanitized, sanitizer_ppm,
      contact_time_seconds, attested_by_user_id and label_fields required, while draft container types
      must NOT carry them. Interval order is a schema concern: brew_end_utc > brew_start_utc,
      expires_at_utc > effective_from_utc, period_end_utc > period_start_utc, event_end_utc > event_start_utc.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints and every list endpoint that accepts limit/offset"

  - priority: 16
    category: existence
    check: "Path-parameter resources exist, validated left to right. Yields the entity-specific 404: ERR_BREWERY_NOT_FOUND, ERR_BEER_NOT_FOUND, ERR_TANK_NOT_FOUND, ERR_BATCH_NOT_FOUND, ERR_PACKAGING_RUN_NOT_FOUND, ERR_KEG_ASSET_NOT_FOUND, ERR_TAPROOM_POUR_NOT_FOUND, ERR_STATE_LICENSE_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_EVENT_PERMIT_NOT_FOUND."
    error_id: ERR_BEER_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 18
    category: existence
    check: "Foreign keys carried in the request body exist: Batch.beer_id and Batch.tank_id, PackagingRun.batch_id, KegAsset fill's packaging_run_id, TaproomPour.keg_asset_id, DistributorAppointment.state_license_id and appointed_beer_id, DistributionOrder.beer_id and state_license_id, ExciseReport.amends_report_id, EventPermit.featured_beer_id. Same entity-specific 404 vocabulary as priority 16."
    error_id: ERR_STATE_LICENSE_NOT_FOUND
    http_status: 404
    applies_to: "POST /batches, POST /packaging-runs, POST /keg-assets/{kegAssetId}/fill, POST /taproom-pours, POST /distributor-appointments, POST /distribution-orders, POST /excise-reports, POST /event-permits"

  - priority: 20
    category: business_referential
    check: "Uniqueness of the human-authored business codes: Beer.name, Tank.code, Batch.batch_code, PackagingRun.run_code, KegAsset.keg_serial, DistributionOrder.order_code, StateLicense.state_code."
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /beers, POST /tanks, POST /batches, POST /packaging-runs, POST /keg-assets, POST /state-licenses, POST /distribution-orders"

  - priority: 21
    category: business_constraint
    check: "At most one Brewery row may exist; a second POST /brewery is refused."
    error_id: ERR_BREWERY_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /brewery"

  - priority: 22
    category: state
    check: "Optimistic concurrency: expected_batch_version must equal the referenced Batch.version, and expected_state_license_version must equal the referenced StateLicense.version. Checked after existence so a bad id still yields the 404."
    error_id: ERR_STALE_BATCH_VERSION
    http_status: 412
    applies_to: "POST /packaging-runs (expected_batch_version), POST /distributor-appointments (expected_state_license_version -> ERR_STALE_LICENSE_VERSION)"

  - priority: 30
    category: state
    check: |
      The target resource is in a state from which the requested transition is declared in §1.2.
      Entity-specific errors: ERR_NOTICE_TRANSITION_INVALID (brewer's notice action not legal from
      notice_status), ERR_FILING_TRANSITION_INVALID (a FORMULA/LABEL filing or decision that the
      current registration_state or label_state does not permit), ERR_TANK_TRANSITION_INVALID,
      ERR_BATCH_TRANSITION_INVALID, ERR_RUN_TRANSITION_INVALID, ERR_KEG_TRANSITION_INVALID,
      ERR_ORDER_TRANSITION_INVALID, ERR_ORDER_NOT_ALLOCATED (ship attempted on an order whose state
      is not ALLOCATED), ERR_APPOINTMENT_TRANSITION_INVALID, ERR_REPORT_TRANSITION_INVALID,
      ERR_PERMIT_TRANSITION_INVALID. Terminal states reject every trigger through this rule.
    error_id: ERR_ORDER_NOT_ALLOCATED
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"

  - priority: 32
    category: state
    check: "Brewer's notice gating: Brewery.notice_status must be ACTIVE for batch start, run completion, keg TAP and DEPLOY movements, taproom pours, order submission, order allocation, order shipment and event-permit submission. PENDING_NOTICE, SUSPENDED and REVOKED all fail here."
    error_id: ERR_NOTICE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /batches/{batchId}/start, POST /packaging-runs/{runId}/complete, POST /keg-assets/{kegAssetId}/movements, POST /taproom-pours, POST /distribution-orders, POST /distribution-orders/{orderId}/allocate, POST /distribution-orders/{orderId}/ship, POST /event-permits/{permitId}/submit"

  - priority: 33
    category: state
    check: "Cross-entity state gates that are not the notice: ERR_TANK_NOT_IDLE (batch start against a tank whose status is not IDLE), ERR_BATCH_NOT_CONDITIONING (run completion while the batch is not CONDITIONING), ERR_KEG_NOT_TAPPED (pour recorded against a keg whose state is not TAPPED), ERR_RUN_NOT_COMPLETED (keg fill against a run that is still PLANNED or already VOIDED), ERR_LICENSE_NOT_ACTIVE (order create, allocate or ship under a license whose status is SUSPENDED or EXPIRED)."
    error_id: ERR_TANK_NOT_IDLE
    http_status: 409
    applies_to: "POST /batches/{batchId}/start, POST /packaging-runs/{runId}/complete, POST /taproom-pours, POST /keg-assets/{kegAssetId}/fill, POST /distribution-orders, POST /distribution-orders/{orderId}/allocate, POST /distribution-orders/{orderId}/ship"

  - priority: 34
    category: business_safety
    check: "Federal approval prerequisites on the beer. ERR_FORMULA_NOT_APPROVED when registration_state is neither FORMULA_APPROVED nor FORMULA_EXEMPT for any sale path (taproom pour, keg tap, keg deploy, order create). ERR_LABEL_NOT_APPROVED when label_state != COLA_APPROVED on a distribution path (order create, DEPLOY_DISTRIBUTION movement) - a COLA is never required for a taproom draft pour. ERR_EVENT_PERMIT_NOT_APPROVED when a DEPLOY_EVENT movement names a beer with no APPROVED EventPermit covering the current logical instant."
    error_id: ERR_LABEL_NOT_APPROVED
    http_status: 422
    applies_to: "POST /taproom-pours, POST /keg-assets/{kegAssetId}/movements, POST /distribution-orders"

  - priority: 40
    category: business_temporal
    check: "Tank occupation intervals may not overlap, and a mandatory CIP turnaround buffer separates them: for the requested Batch, no other Batch on the same tank whose state is in {SCHEDULED, BREWING, CONDITIONING} may have an interval [brew_start_utc, brew_end_utc) that overlaps [brew_start_utc - TANK_CIP_BUFFER_HOURS, brew_end_utc + TANK_CIP_BUFFER_HOURS). Intervals are half-open, so back-to-back runs separated by exactly TANK_CIP_BUFFER_HOURS = 12 are legal."
    error_id: ERR_TANK_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /batches"

  - priority: 41
    category: business_temporal
    check: "License validity window against the logical clock: ERR_LICENSE_NOT_YET_EFFECTIVE when current_utc < effective_from_utc, ERR_LICENSE_EXPIRED when current_utc >= expires_at_utc (the exclusive end means an instant exactly equal to expires_at_utc is already lapsed)."
    error_id: ERR_LICENSE_EXPIRED
    http_status: 409
    applies_to: "POST /distribution-orders, POST /distribution-orders/{orderId}/allocate, POST /distribution-orders/{orderId}/ship, POST /distributor-appointments"

  - priority: 42
    category: business_temporal
    check: "An excise return may only be filed once its period has closed: current_utc >= period_end_utc."
    error_id: ERR_PERIOD_NOT_CLOSED
    http_status: 422
    applies_to: "POST /excise-reports/{reportId}/file"

  - priority: 43
    category: business_temporal
    check: "A franchise termination may only be finalized once the statutory notice has run: current_utc >= termination_effective_utc."
    error_id: ERR_TERMINATION_NOTICE_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /distributor-appointments/{appointmentId}/termination with phase=FINALIZE"

  - priority: 44
    category: business_temporal
    check: "Off-site concurrency ceiling: an APPROVED decision is refused when the count of already-APPROVED permits in the same venue_state_code whose CLOSED interval [event_start_utc, event_end_utc] intersects this permit's closed interval is already MAX_CONCURRENT_OFFSITE_PERMITS_PER_STATE = 2. Because the intervals are closed, two events that merely touch at an endpoint DO intersect - unlike tank intervals, which are half-open."
    error_id: ERR_OFFSITE_EVENT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /event-permits/{permitId}/decision with decision=APPROVED"

  - priority: 46
    category: business_safety
    check: "Sanitation reading meets standard: growler_sanitation_verdict must evaluate to PASS. Applies to growler and crowler fills, keg washes and tank CIP cycles. A FAIL verdict is never persisted."
    error_id: ERR_SANITATION_BELOW_STANDARD
    http_status: 422
    applies_to: "POST /taproom-pours (CROWLER_32OZ, GROWLER_64OZ), POST /keg-assets/{kegAssetId}/clean, POST /tanks/{tankId}/service with action=CIP"

  - priority: 47
    category: business_safety
    check: "Growler and crowler label completeness: label_fields must carry non-blank brand_name, abv_statement, net_contents, health_warning and fill_date. Checked AFTER the sanitation reading, so a fill that is both under-sanitized and unlabelled reports ERR_SANITATION_BELOW_STANDARD."
    error_id: ERR_GROWLER_LABEL_INCOMPLETE
    http_status: 422
    applies_to: "POST /taproom-pours (CROWLER_32OZ, GROWLER_64OZ)"

  - priority: 50
    category: business_referential
    check: "Segregation of duties on the X-User-ID: an appointment may not be approved by its proposer, an excise return may not be filed by its preparer, and a growler or crowler fill's attested_by_user_id may not equal the pouring user."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /distributor-appointments/{appointmentId}/approve, POST /excise-reports/{reportId}/file, POST /taproom-pours"

  - priority: 51
    category: business_referential
    check: "Territory rule: DistributionOrder.ship_to_state_code must equal the referenced StateLicense.state_code, and an EventPermit's venue_state_code must match a StateLicense that exists for that state."
    error_id: ERR_TERRITORY_NOT_LICENSED
    http_status: 422
    applies_to: "POST /distribution-orders, POST /event-permits"

  - priority: 52
    category: business_referential
    check: |
      Franchise exclusivity. When an appointment with state IN {ACTIVE, TERMINATION_REQUESTED} covers
      (state_license_id, beer scope), POST /distribution-orders does NOT fail - the order's channel is
      forced to WHOLESALER and appointment_id is stamped, which is what pulls the franchise fee into the
      landed cost. The failure case is the mirror image: a license whose license_type == WHOLESALER_ONLY
      with NO covering live appointment cannot be shipped into at all, because the brewery has no
      self-distribution privilege there and no wholesaler to hand the beer to.
    error_id: ERR_WHOLESALER_APPOINTMENT_REQUIRED
    http_status: 422
    applies_to: "POST /distribution-orders"

  - priority: 53
    category: business_referential
    check: "Appointment scope must not double-cover a territory: no second DistributorAppointment may reach ACTIVE while another appointment with state IN {ACTIVE, TERMINATION_REQUESTED} covers the same state_license_id with an overlapping brand scope (ALL_BRANDS overlaps every scope; SINGLE_BRAND overlaps only the same appointed_beer_id)."
    error_id: ERR_DUPLICATE_APPOINTMENT_SCOPE
    http_status: 409
    applies_to: "POST /distributor-appointments/{appointmentId}/approve"

  - priority: 54
    category: business_referential
    check: "Good cause is mandatory when terminating an appointment in a franchise state: StateLicense.franchise_state == true requires good_cause_code on the REQUEST phase."
    error_id: ERR_GOOD_CAUSE_REQUIRED
    http_status: 422
    applies_to: "POST /distributor-appointments/{appointmentId}/termination with phase=REQUEST"

  - priority: 55
    category: business_referential
    check: "Excise period integrity: ERR_PERIOD_ALREADY_FILED when a non-amending return is filed for a (period_start_utc, period_end_utc) pair that another FILED return already covers; ERR_AMENDMENT_TARGET_NOT_FILED when amends_report_id points at a return whose state is DRAFT or SUPERSEDED rather than FILED."
    error_id: ERR_PERIOD_ALREADY_FILED
    http_status: 409
    applies_to: "POST /excise-reports/{reportId}/file"

  - priority: 56
    category: business_constraint
    check: "Volume and container constraints: ERR_TANK_CAPACITY_EXCEEDED (planned_volume_bbl or actual_yield_bbl above the tank's capacity_bbl), ERR_UNITS_EXCEED_BATCH_VOLUME (units_produced * BBL_PER_UNIT[package_type] above Batch.remaining_bbl), ERR_KEG_SIZE_MISMATCH (keg size_bbl not equal to BBL_PER_UNIT of the run's package_type, including any attempt to fill a keg from a CAN_CASE_24 run), ERR_RUN_UNITS_EXHAUSTED (kegs_filled_count already equals units_produced), ERR_POUR_EXCEEDS_KEG_VOLUME (POUR_OZ[container_type] above the keg's remaining_volume_oz), ERR_RETURN_EXCEEDS_FILL (returned_volume_gal * 128 above filled_volume_oz)."
    error_id: ERR_UNITS_EXCEED_BATCH_VOLUME
    http_status: 422
    applies_to: "POST /batches, POST /batches/{batchId}/condition, POST /packaging-runs/{runId}/complete, POST /keg-assets/{kegAssetId}/fill, POST /taproom-pours, POST /keg-assets/{kegAssetId}/movements"

  - priority: 57
    category: business_constraint
    check: "Void and dump guards: ERR_RUN_HAS_ALLOCATIONS when voiding a COMPLETED run whose allocated_bbl, shipped_bbl or kegs_filled_count is non-zero; ERR_BATCH_HAS_PLANNED_RUNS when dumping a CONDITIONING batch that still has a PLANNED PackagingRun."
    error_id: ERR_RUN_HAS_ALLOCATIONS
    http_status: 409
    applies_to: "POST /packaging-runs/{runId}/void, POST /batches/{batchId}/dump"

  - priority: 60
    category: business_fiscal
    check: "Self-distribution annual ceiling, evaluated at shipment: for channel SELF_DISTRIBUTED, StateLicense.barrels_shipped_ytd + order.allocated_bbl must be <= annual_barrel_cap. The comparison is inclusive, so landing exactly on the cap is permitted and the very next barrel is not."
    error_id: ERR_SELF_DISTRIBUTION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /distribution-orders/{orderId}/ship"

  - priority: 61
    category: business_fiscal
    check: "Off-site annual barrel ceiling per state, an aggregate check: sum of requested_bbl over EventPermit rows in the same venue_state_code with state IN {SUBMITTED, APPROVED}, plus this permit's requested_bbl, must be <= EVENT_ANNUAL_BBL_CAP_PER_STATE = 25.00. Each permit may be individually small and still breach the collective ceiling."
    error_id: ERR_EVENT_BARREL_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /event-permits/{permitId}/submit"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
# Reads (23) come first, then writes (35). All collections sit at the API root
# (api_prefix "/"); children carry their FK in the request body and are found in
# reverse via the filtered list endpoints below.

endpoints:
  # --- reads -----------------------------------------------------------------
  - method: GET
    path: "/brewery"
    description: "Read the brewery singleton with its notice status and YTD barrel aggregates"
    roles: [BreweryAdmin, ComplianceOfficer, CellarOperator, TaproomStaff, StateRegulator]
    code: 200
    input: []
    output: Brewery
    side_effects: []

  - method: GET
    path: "/beers/{beerId}"
    description: "Read one beer with both approval dimensions and the derived sellability flags"
    roles: [BreweryAdmin, ComplianceOfficer, CellarOperator, TaproomStaff, StateRegulator]
    code: 200
    input: []
    output: Beer
    side_effects: []

  - method: GET
    path: "/beers"
    description: "List beers, filterable by either approval dimension"
    roles: [BreweryAdmin, ComplianceOfficer, CellarOperator, TaproomStaff, StateRegulator]
    code: 200
    input: ["registration_state?", "label_state?", "limit?", "offset?"]
    output: Beer[]
    side_effects: []

  - method: GET
    path: "/tanks/{tankId}"
    description: "Read one cellar vessel with its CIP history counters"
    roles: [BreweryAdmin, ComplianceOfficer, CellarOperator, TaproomStaff, StateRegulator]
    code: 200
    input: []
    output: Tank
    side_effects: []

  - method: GET
    path: "/tanks"
    description: "List cellar vessels"
    roles: [BreweryAdmin, ComplianceOfficer, CellarOperator, TaproomStaff, StateRegulator]
    code: 200
    input: ["status?", "tank_type?", "limit?", "offset?"]
    output: Tank[]
    side_effects: []

  - method: GET
    path: "/batches/{batchId}"
    description: "Read one batch with its yield ledger (packaged_bbl, remaining_bbl, total_loss_bbl)"
    roles: [BreweryAdmin, ComplianceOfficer, CellarOperator, TaproomStaff, StateRegulator]
    code: 200
    input: []
    output: Batch
    side_effects: []

  - method: GET
    path: "/batches"
    description: "List batches; reverse-reachability for Batch.beer_id and Batch.tank_id"
    roles: [BreweryAdmin, ComplianceOfficer, CellarOperator, TaproomStaff, StateRegulator]
    code: 200
    input: ["beer_id?", "tank_id?", "state?", "limit?", "offset?"]
    output: Batch[]
    side_effects: []

  - method: GET
    path: "/packaging-runs/{runId}"
    description: "Read one packaging run with its four-way barrel split and reconciliation state"
    roles: [BreweryAdmin, ComplianceOfficer, CellarOperator, TaproomStaff, StateRegulator]
    code: 200
    input: []
    output: PackagingRun
    side_effects: []

  - method: GET
    path: "/packaging-runs"
    description: "List packaging runs; reverse-reachability for PackagingRun.batch_id"
    roles: [BreweryAdmin, ComplianceOfficer, CellarOperator, TaproomStaff, StateRegulator]
    code: 200
    input: ["batch_id?", "state?", "destination?", "reconciliation_state?", "limit?", "offset?"]
    output: PackagingRun[]
    side_effects: []

  - method: GET
    path: "/keg-assets/{kegAssetId}"
    description: "Read one keg with its fill, pour and return volumes and the shrinkage verdict"
    roles: [BreweryAdmin, ComplianceOfficer, CellarOperator, TaproomStaff, StateRegulator]
    code: 200
    input: []
    output: KegAsset
    side_effects: []

  - method: GET
    path: "/keg-assets"
    description: "List kegs; reverse-reachability for KegAsset.packaging_run_id and KegAsset.filled_beer_id"
    roles: [BreweryAdmin, ComplianceOfficer, CellarOperator, TaproomStaff, StateRegulator]
    code: 200
    input: ["packaging_run_id?", "filled_beer_id?", "state?", "deployment_channel?", "limit?", "offset?"]
    output: KegAsset[]
    side_effects: []

  - method: GET
    path: "/taproom-pours/{pourId}"
    description: "Read one immutable taproom pour record"
    roles: [BreweryAdmin, ComplianceOfficer, CellarOperator, TaproomStaff, StateRegulator]
    code: 200
    input: []
