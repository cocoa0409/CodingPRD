            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${pa}", trade_package_id: "${ta}", doc_type: "WARRANTY_DOC", file_ref: "wd-1" }, as: SubcontractorRep, as_user_id: "${ta}", captures: { d2: $.data.id } }
            - { call: "POST /closeout/closeout-documents", payload: { project_id: "${pa}", trade_package_id: "${ta}", doc_type: "AS_BUILT", file_ref: "ab-1" }, as: SubcontractorRep, as_user_id: "${ta}", captures: { d3: $.data.id } }
            - { call: "POST /closeout/closeout-documents/${d1}/approve", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents/${d2}/approve", as: GCProjectManager }
            - { call: "POST /closeout/closeout-documents/${d3}/approve", as: GCProjectManager }
            - { call: "POST /closeout/trade-packages/${ta}/lien-waiver-submission", payload: { waiver_type: "UNCONDITIONAL", amount_cents: 1000000, file_ref: "wvr-1" }, as: SubcontractorRep, as_user_id: "${ta}" }
            - { call: "POST /closeout/trade-packages/${ta}/lien-waiver-decision", payload: { decision: "ACCEPT" }, as: GCProjectManager }
            - { call: "POST /closeout/training-sessions", payload: { project_id: "${pa}", trade_package_id: "${ta}", system_name: "AHU-1", location_room: "TR-1", scheduled_start: "2026-08-05T09:00:00Z", scheduled_end: "2026-08-05T10:00:00Z" }, as: GCProjectManager, captures: { s1: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/training-sessions/${s1}/conduct", payload: { attendee_count: 3 }, as: GCProjectManager }
            - { call: "GET /closeout/projects/${pa}", as: GCProjectManager, captures: { pstat_pre: $.data.status } }
            - { call: "POST /closeout/punch-items/${it}/mark-ready", as: SubcontractorRep, as_user_id: "${ta}" }
