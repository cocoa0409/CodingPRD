              captures: { p1: $.data.id }
            - call: "GET /vessels/${v}"
              as: ShoreComplianceOfficer
              captures: { v_ver2: $.data.version }
          assert:
            - "HTTP 201; BallastWaterManagementPlan.${p1} created in DRAFT"
            - "${v_ver} == 1 AND ${v_ver2} == 2 (exactly one increment)"

      - name: occ_ballast_event_stale_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[voyage-event-stale-voyage]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Voyage.version: after a first event advances the voyage version, a second event POST carrying the pre-write expected_voyage_version is rejected ERR_STALE_VERSION (412); both events are individually valid UPTAKEs on distinct tanks."
        test_recipe:
          setup: ["Clock 2026-08-01T00:00:00Z; vessel with APPROVED plan; voyage V9805 IN_PROGRESS; version observed once"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
