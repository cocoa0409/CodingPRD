scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: pause_refund_forward_looking_on_subscription
        grounds:
          - calculations.pause_proration_refund
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - entities.Client.fields.wallet_credit_cents
        distinguishing_aspect: "Pause refund is a forward-looking proration on the Subscription domain (remaining days of the paid week credited to wallet); a mid-week pause at elapsed_days=3 refunds 5657 of a 9900 cycle, not the full amount."
        test_recipe:
          setup:
            - "Client registered in CA, intake cleared, subscription created and charged one PAID cycle of 9900 cents at period_start 2026-06-01T00:00:00Z."
            - "Clock advanced to 2026-06-04T00:00:00Z (3 full days elapsed of the 7-day period)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /clients"
              payload: { email: "p1@x.com", full_name: "P One", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /subscriptions"
              payload: { client_id: "${c_id}" }
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/charge-cycle"
              payload: {}
              as: BillingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:00:00Z" }
              as: BillingAdmin
            - call: "GET /subscriptions/${sub_id}"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_v: $.data.version }
          trigger:
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: { resume_on: "2026-07-01T00:00:00Z", expected_subscription_version: "${sub_v}" }
              as: Client
              as_user_id: "${c_id}"
          assert:
            - "Subscription.${sub_id}.status == PAUSED"
            - "Client.${c_id}.wallet_credit_cents == 5657"
      - name: superbill_service_value_basis_on_superbill
        grounds:
          - calculations.superbill_reimbursable_amount
          - state_machines.Superbill.DRAFT_to_ISSUED
          - entities.Superbill.fields.reimbursable_amount_cents
        distinguishing_aspect: "Superbill reimbursement aggregates per-session list_amount_cents (service value) on the Superbill domain — 9900 for one completed session — diverging from the cash a client paid out of pocket when wallet credit was applied."
        test_recipe:
          setup:
            - "Client active with a PAID cycle (list 9900, 1 credit granted) at period_start 2026-06-01."
            - "One LiveSession scheduled at 2026-06-02T10:00Z and COMPLETED, consuming the credit."
            - "A DRAFT superbill drafted for window [2026-06-01, 2026-06-08)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /clients"
              payload: { email: "p2@x.com", full_name: "P Two", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /therapists"
              payload: { full_name: "T Two", specialties: ["ANXIETY"] }
              as: ClinicalAdmin
              captures: { t_id: $.data.id }
            - call: "POST /therapists/${t_id}/licenses"
              payload: { state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /therapists/${t_id}/activate"
              payload: {}
              as: ClinicalAdmin
            - call: "POST /matches"
              payload: { client_id: "${c_id}", therapist_id: "${t_id}" }
              as: ClinicalAdmin
              captures: { m_id: $.data.id }
            - call: "POST /matches/${m_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
              captures: { m_v: $.data.version }
            - call: "POST /subscriptions"
              payload: { client_id: "${c_id}" }
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/charge-cycle"
              payload: {}
              as: BillingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T10:00:00Z" }
              as: BillingAdmin
            - call: "POST /matches/${m_id}/live-sessions"
              payload: { starts_at: "2026-06-02T10:00:00Z", ends_at: "2026-06-02T11:00:00Z", expected_match_version: "${m_v}" }
              as: Client
              as_user_id: "${c_id}"
              captures: { ls_id: $.data.id }
            - call: "POST /live-sessions/${ls_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /clients/${c_id}/superbills"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-08T00:00:00Z" }
              as: BillingAdmin
              captures: { sb_id: $.data.id }
          trigger:
            - call: "POST /superbills/${sb_id}/issue"
              payload: {}
              as: BillingAdmin
          assert:
            - "Superbill.${sb_id}.status == ISSUED"
            - "Superbill.${sb_id}.session_count == 1"
            - "Superbill.${sb_id}.reimbursable_amount_cents == 9900"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: match_score_three_input_nonlinear_mode_a
        grounds:
          - calculations.match_score
          - state_machines.Match.PROPOSED_to_ACTIVE
          - entities.Match.fields.match_score
        distinguishing_aspect: "Mode (a): match_score combines >=3 inputs (specialty overlap count, license-state bit, severity) with distinct weights {10,25,2} into a single non-linear fit score; overlap=2, license=1, severity=5 -> 55."
        test_recipe:
          setup:
            - "Client in CA with intake presenting_concerns [ANXIETY, DEPRESSION], severity 5."
            - "Therapist with specialties [ANXIETY, DEPRESSION, TRAUMA] and a VALID CA license, ACCEPTING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /clients"
              payload: { email: "p3@x.com", full_name: "P Three", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY", "DEPRESSION"], severity_score: 5 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /therapists"
              payload: { full_name: "T Three", specialties: ["ANXIETY", "DEPRESSION", "TRAUMA"] }
              as: ClinicalAdmin
              captures: { t_id: $.data.id }
            - call: "POST /therapists/${t_id}/licenses"
              payload: { state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /therapists/${t_id}/activate"
              payload: {}
              as: ClinicalAdmin
          trigger:
            - call: "POST /matches"
              payload: { client_id: "${c_id}", therapist_id: "${t_id}" }
              as: ClinicalAdmin
              captures: { m_id: $.data.id }
          assert:
            - "Match.${m_id}.match_score == 55"
            - "Match.${m_id}.status == PROPOSED"
      - name: cycle_billing_pinned_eval_order_mode_c
        grounds:
          - calculations.cycle_billing_amount
          - state_machines.Subscription.TRIALING_to_ACTIVE
          - entities.BillingCycle.fields.charged_amount_cents
        distinguishing_aspect: "Mode (c): billing pins evaluation order — discount applies to base FIRST (TIER_2 0.40 on 9900 -> list 5940), THEN wallet applies (min(3394,5940)=3394) -> charged 2546; reversing the order (wallet before discount) would change the charged cents."
        test_recipe:
          setup:
            - "Client in CA, intake cleared, approved TIER_2 financial aid (discount 0.40)."
            - "First TIER_2 cycle charged 5940 at period_start 2026-06-01; a mid-week pause at 2026-06-04 (elapsed_days 3) refunds round(5940*4/7)=3394 to wallet; then resume."
            - "The renewal cycle is then charged with wallet_credit_cents 3394 present."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /clients"
              payload: { email: "p4@x.com", full_name: "P Four", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/financial-aid-applications"
              payload: { annual_income_cents: 3000000, household_size: 1 }
              as: Client
              as_user_id: "${c_id}"
              captures: { faa_id: $.data.id }
            - call: "POST /financial-aid-applications/${faa_id}/approve"
              payload: {}
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { client_id: "${c_id}", base_weekly_fee_cents: 9900, weekly_credit_grant: 1 }
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/charge-cycle"
              payload: {}
              as: BillingAdmin
              captures: { bc1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T00:00:00Z" }
              as: BillingAdmin
            - call: "GET /subscriptions/${sub_id}"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_v: $.data.version }
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: { resume_on: "2026-07-01T00:00:00Z", expected_subscription_version: "${sub_v}" }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /subscriptions/${sub_id}/resume"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /subscriptions/${sub_id}/charge-cycle"
              payload: {}
              as: BillingAdmin
              captures: { bc2_id: $.data.id }
          assert:
            - "BillingCycle.${bc2_id}.list_amount_cents == 5940"
            - "BillingCycle.${bc2_id}.wallet_applied_cents == 3394"
            - "BillingCycle.${bc2_id}.charged_amount_cents == 2546"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: match_reassignment_cycle
        grounds:
          - state_machines.Match.ACTIVE_to_SWITCH_REQUESTED
          - state_machines.Match.SWITCH_REQUESTED_to_ENDED
          - state_machines.Match.PROPOSED_to_ACTIVE
        distinguishing_aspect: "Match exhibits a cyclic/branching reassignment: ACTIVE -> SWITCH_REQUESTED -> (reassign) ENDED while a successor Match is born ACTIVE — the relationship loops onto a fresh match row rather than advancing linearly."
        test_recipe:
          setup:
            - "Client in CA with an ACTIVE match to therapist T-A; a second ACCEPTING therapist T-B holds a VALID CA license."
            - "The ACTIVE match has been moved to SWITCH_REQUESTED with switch_reason FIT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /clients"
              payload: { email: "p5@x.com", full_name: "P Five", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /therapists"
              payload: { full_name: "T A", specialties: ["ANXIETY"] }
              as: ClinicalAdmin
              captures: { ta_id: $.data.id }
            - call: "POST /therapists/${ta_id}/licenses"
              payload: { state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /therapists/${ta_id}/activate"
              payload: {}
              as: ClinicalAdmin
            - call: "POST /therapists"
              payload: { full_name: "T B", specialties: ["ANXIETY"] }
              as: ClinicalAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /therapists/${tb_id}/licenses"
              payload: { state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /therapists/${tb_id}/activate"
              payload: {}
              as: ClinicalAdmin
            - call: "POST /matches"
              payload: { client_id: "${c_id}", therapist_id: "${ta_id}" }
              as: ClinicalAdmin
              captures: { m_id: $.data.id }
            - call: "POST /matches/${m_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /matches/${m_id}/request-switch"
              payload: { switch_reason: "FIT" }
              as: Client
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /matches/${m_id}/reassign"
              payload: {}
              as: ClinicalAdmin
              captures: { succ_id: $.data.id }
          assert:
            - "Match.${m_id}.status == ENDED"
            - "Match.${m_id}.superseded_by_match_id == ${succ_id}"
            - "Match.${succ_id}.status == ACTIVE"
            - "Match.${succ_id}.therapist_id == ${tb_id}"
      - name: subscription_pause_resume_cycle
        grounds:
          - state_machines.Subscription.ACTIVE_to_PAUSED
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - entities.Subscription.fields.pause_resumes_on
        distinguishing_aspect: "Subscription loops ACTIVE -> PAUSED -> ACTIVE on the same row (different entity than Match); resume clears pause_resumes_on and resets current_period_start rather than terminating."
        test_recipe:
          setup:
            - "Client in CA, intake cleared, subscription charged one PAID cycle, ACTIVE at period_start 2026-06-01."
            - "Clock at 2026-06-02; subscription paused with resume_on 2026-07-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /clients"
              payload: { email: "p6@x.com", full_name: "P Six", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /subscriptions"
              payload: { client_id: "${c_id}" }
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/charge-cycle"
              payload: {}
              as: BillingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: BillingAdmin
            - call: "GET /subscriptions/${sub_id}"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_v: $.data.version }
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: { resume_on: "2026-07-01T00:00:00Z", expected_subscription_version: "${sub_v}" }
              as: Client
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/resume"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
          assert:
            - "Subscription.${sub_id}.status == ACTIVE"
            - "Subscription.${sub_id}.pause_resumes_on == null"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finalize_cancel_subscription_client_match_caseload_depth4
        grounds:
          - state_machines.Subscription.CANCEL_SCHEDULED_to_CANCELLED
          - state_machines.Client.ACTIVE_to_CLOSED
          - state_machines.Match.ACTIVE_to_ENDED
          - entities.Therapist.fields.active_caseload
        distinguishing_aspect: "Depth-4 cascade: finalize-cancel sets Subscription CANCELLED -> that triggers Client CLOSED -> that triggers each ACTIVE Match ENDED -> that triggers Therapist.active_caseload decrement; each hop is caused by the previous hop, not by the finalize call directly."
        test_recipe:
          setup:
            - "Client in CA with an ACTIVE match to therapist (active_caseload 1) and a CANCEL_SCHEDULED subscription whose cancel_effective_on is 2026-06-08."
            - "Clock advanced to 2026-06-08 so finalize-cancel is due."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /clients"
              payload: { email: "p7@x.com", full_name: "P Seven", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /therapists"
              payload: { full_name: "T Seven", specialties: ["ANXIETY"] }
              as: ClinicalAdmin
              captures: { t_id: $.data.id }
            - call: "POST /therapists/${t_id}/licenses"
              payload: { state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /therapists/${t_id}/activate"
              payload: {}
              as: ClinicalAdmin
            - call: "POST /matches"
              payload: { client_id: "${c_id}", therapist_id: "${t_id}" }
              as: ClinicalAdmin
              captures: { m_id: $.data.id }
            - call: "POST /matches/${m_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /subscriptions"
              payload: { client_id: "${c_id}" }
              as: Client
              as_user_id: "${c_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/charge-cycle"
              payload: {}
              as: BillingAdmin
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /subscriptions/${sub_id}/finalize-cancel"
              payload: {}
              as: BillingAdmin
          assert:
            - "Subscription.${sub_id}.status == CANCELLED"
            - "Client.${c_id}.status == CLOSED"
            - "Match.${m_id}.status == ENDED"
            - "Therapist.${t_id}.active_caseload == 0"
      - name: acute_resolve_escalation_client_thread_depth3
        grounds:
          - state_machines.CrisisEscalation.ACKNOWLEDGED_to_RESOLVED
          - state_machines.Client.SUSPENDED_to_ACTIVE
          - state_machines.MessageThread.FROZEN_to_OPEN
        distinguishing_aspect: "Depth-3 cascade from a different trigger (escalation resolve, not finalize-cancel): RESOLVED on the ACUTE escalation -> Client SUSPENDED->ACTIVE -> the frozen MessageThread FROZEN->OPEN; each hop is caused by the previous."
        test_recipe:
          setup:
            - "Client in CA with an ACTIVE match (OPEN thread)."
            - "An ACUTE CrisisEscalation was raised (Client now SUSPENDED, thread FROZEN) and ACKNOWLEDGED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /clients"
              payload: { email: "p8@x.com", full_name: "P Eight", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/intake"
              payload: { presenting_concerns: ["ANXIETY"], severity_score: 3 }
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /therapists"
              payload: { full_name: "T Eight", specialties: ["ANXIETY"] }
              as: ClinicalAdmin
              captures: { t_id: $.data.id }
            - call: "POST /therapists/${t_id}/licenses"
              payload: { state_code: "CA", expires_on: "2027-01-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /therapists/${t_id}/activate"
              payload: {}
              as: ClinicalAdmin
            - call: "POST /matches"
              payload: { client_id: "${c_id}", therapist_id: "${t_id}" }
              as: ClinicalAdmin
              captures: { m_id: $.data.id }
            - call: "POST /matches/${m_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "GET /matches/${m_id}/thread"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
              captures: { th_id: $.data.0.id }
            - call: "POST /clients/${c_id}/crisis-escalations"
              payload: { severity: "ACUTE" }
              as: Client
              as_user_id: "${c_id}"
              captures: { esc_id: $.data.id }
            - call: "POST /crisis-escalations/${esc_id}/acknowledge"
              payload: {}
              as: ClinicalAdmin
          trigger:
            - call: "POST /crisis-escalations/${esc_id}/resolve"
              payload: {}
              as: ClinicalAdmin
          assert:
            - "CrisisEscalation.${esc_id}.status == RESOLVED"
            - "Client.${c_id}.status == ACTIVE"
            - "Client.${c_id}.risk_flag == NONE"
            - "MessageThread.${th_id}.status == OPEN"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_safety_accept_acute_already_active
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - state_machines.Match.PROPOSED_to_ACTIVE
        distinguishing_aspect: "Different category pair state(p7) vs business_safety(p8): a match that is already ACTIVE AND a client now ACUTE-blocked, on a re-accept, fails the lower-numbered state check first -> ERR_INVALID_STATE, not ERR_CLIENT_RISK_BLOCKED."
        test_recipe:
          setup:
            - "Client in CA with an ACTIVE match; an ACUTE escalation has since suspended the client (risk_flag ACUTE)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ClinicalAdmin
            - call: "POST /clients"
              payload: { email: "p9@x.com", full_name: "P Nine", state_code: "CA" }
              as: Client
              captures: { c_id: $.data.id }
