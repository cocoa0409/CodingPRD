            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Smb", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Smb", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 100000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/loans/${loan}/recalls", payload: { quantity: 1000, reason: "VOTE", deadline_date: "2026-08-10" }, as: OwnerRep, as_user_id: "${own}", captures: { rec: $.data.id } }
          trigger:
            - { call: "POST /api/loans/${loan}/recalls", payload: { quantity: 1000, reason: "SALE", deadline_date: "2026-08-12" }, as: OwnerRep, as_user_id: "${own}", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_RECALL_ALREADY_OPEN"
            - "GET /api/recalls?loan_id=${loan} returns exactly 1 recall"

      - name: halted_security_blocks_create_and_collateral_pledge
        claim_type: precondition_enforcement
        grounds: ["validations[priority=7]", "errors[ERR_SECURITY_HALTED]"]
        distinguishing_aspect: "The halt gate fires on (a) direct loan creation against the halted security and (b) posting the halted security AS COLLATERAL on a live loan of a different, still-lendable security. (Accept/confirm/match never see the error because the halt cascade cancels proposals and demand first — the state error would win by priority.)"
        test_recipe:
          setup: ["securities S1 (LENDABLE, loaned) and S2 (to be halted); SECURITIES-collateral loan qty 1000 on S1 BOOKED; a position also exists on S2; S2 then halted"]
          setup_api_calls:
            - { call: "POST /api/securities", payload: { symbol: "SMC1", asset_class: "EQUITY", price_cents: 1000 }, as: DeskAdmin, captures: { sec: $.data.id } }
            - { call: "POST /api/securities", payload: { symbol: "SMC2", asset_class: "GOV_BOND", price_cents: 10000 }, as: DeskAdmin, captures: { csec: $.data.id } }
            - { call: "POST /api/beneficial-owners", payload: { display_name: "Owner Smc", revenue_share_bps: 6000, indemnification_opt_in: false }, as: DeskAdmin, captures: { own: $.data.id } }
            - { call: "POST /api/borrowers", payload: { display_name: "Borrower Smc", credit_limit_cents: 100000000 }, as: DeskAdmin, captures: { bor: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${sec}", quantity_total: 10000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { pos: $.data.id } }
            - { call: "POST /api/lendable-positions", payload: { owner_id: "${own}", security_id: "${csec}", quantity_total: 10000, min_fee_bps: 25 }, as: OwnerRep, as_user_id: "${own}", captures: { cpos: $.data.id } }
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${sec}", position_id: "${pos}", quantity: 1000, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { loan: $.data.id } }
            - { call: "POST /api/loans/${loan}/accept", payload: {}, as: BorrowerRep, as_user_id: "${bor}" }
            - { call: "POST /api/securities/${csec}/halt", payload: {}, as: DeskAdmin }
          trigger:
            - { call: "POST /api/loans", payload: { owner_id: "${own}", borrower_id: "${bor}", security_id: "${csec}", position_id: "${cpos}", quantity: 100, collateral_type: "SECURITIES", rate_bps: 25 }, as: DeskTrader, captures: { err1: $.data.error_id } }
            - { call: "POST /api/loans/${loan}/pledges", payload: { pledge_type: "SECURITY", pledge_security_id: "${csec}", quantity: 117 }, as: BorrowerRep, as_user_id: "${bor}", captures: { err2: $.data.error_id } }
          assert:
