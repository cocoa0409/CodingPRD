# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task 1333 H-2A
# Every instance: grounds resolve into SCAFFOLD.yaml §1.1–§1.7; setup_api_calls
# drive empty-DB -> precondition state; all money literals pre-computed per the
# pinned formulas (see SCAFFOLD.yaml §1.3).
#
# Shared fixture literals used across instances:
#   WD1: CA / LETTUCE / HARVEST / 2026, aewr 1850, prevailing 1775, piece 450/BOX
#   J1 (grower G1): 2026-09-01..2026-10-20, 50 calendar days, 43 workdays,
#       cutoff = transport threshold = 2026-09-25, certify deadline 2026-08-02,
#       daily_standard_hours 8, workers_requested 4, offered hourly 1800,
#       offered piece 400, inbound 60000, outbound 75000
#       => required_hourly_floor = max(1850,1775,1800,725) = 1850
#       => effective_piece_rate = max(400,450) = 450
#   J2 (grower G2): 2026-09-15..2026-11-03, workers_requested 2
#   J3 (grower G1): 2026-09-01..2026-09-20, workers_requested 8
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: wage_reconciliation_provisional_vs_final_divergence
        grounds:
          - calculations.weekly_wage_reconciliation
          - calculations.three_quarters_guarantee
          - calculations.transportation_reimbursement
          - state_machines.WageReconciliation.OPEN_to_FINALIZED
        distinguishing_aspect: |
          Same WorkLogs and same assignment produce different money under the
          provisional (OPEN) vs final (FINALIZED) variant of the WAGE-domain
          calculation: final adds outbound_transport (75000) and re-derives
          eligibility from end_reason; provisional uses computed_through = clock.
        test_recipe:
          setup:
            - "J1 ACTIVE with worker W_A WORKING (assignment started 2026-09-01)"
            - "10 WorkLogs for W_A: every workday 2026-09-01..2026-09-11 (09-06 is Sunday, skipped), 8.0 hours and 25 units each"
            - "clock at 2026-09-11"
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
            - { call: "POST /h2a/job-orders", payload: { grower_id: "${g1}", wage_determination_id: "${wd1}", title: "Fall lettuce", crop: "LETTUCE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-10-20", daily_standard_hours: 8, workers_requested: 4, offered_hourly_cents: 1800, offered_piece_rate_cents_per_unit: 400, inbound_transport_cents: 60000, outbound_transport_cents: 75000 }, as: ContractorAdmin, captures: { jo1: $.data.id } }
            - { call: "POST /h2a/job-orders/${jo1}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/certify", payload: {}, as: ProgramReviewer }
            - { call: "POST /h2a/job-orders/${jo1}/begin-recruitment", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/close-recruitment", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/visa-petitions", payload: { receipt_code: "RCPT-1", requested_worker_count: 1 }, as: ContractorAdmin, captures: { pet1: $.data.id } }
            - { call: "POST /h2a/workers", payload: { full_name: "Worker A", passport_number: "P0001", date_of_birth: "1990-01-01", country_code: "MX" }, as: ContractorAdmin, captures: { wa: $.data.id } }
            - { call: "POST /h2a/visa-petitions/${pet1}/link-worker", payload: { worker_id: "${wa}" }, as: ContractorAdmin }
            - { call: "POST /h2a/visa-petitions/${pet1}/file", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/visa-petitions/${pet1}/adjudicate", payload: { decision: "APPROVE", approved_worker_count: 1 }, as: ProgramReviewer }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /h2a/consular-appointments", payload: { worker_id: "${wa}", petition_id: "${pet1}", consulate_code: "MEX-MTY", appointment_date: "2026-09-01" }, as: ContractorAdmin, captures: { appt_a: $.data.id } }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/activate", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/consular-appointments/${appt_a}/complete", payload: { outcome: "ISSUED" }, as: VisaOfficer }
            - { call: "POST /h2a/worker-assignments", payload: { worker_id: "${wa}", job_order_id: "${jo1}" }, as: ContractorAdmin, captures: { asg_a: $.data.id } }
            - { call: "POST /h2a/worker-assignments/${asg_a}/start", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2026-09-11T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-01", hours_worked: 8, units_picked: 25 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-02", hours_worked: 8, units_picked: 25 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-03", hours_worked: 8, units_picked: 25 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-04", hours_worked: 8, units_picked: 25 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-05", hours_worked: 8, units_picked: 25 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-07", hours_worked: 8, units_picked: 25 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-08", hours_worked: 8, units_picked: 25 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-09", hours_worked: 8, units_picked: 25 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-10", hours_worked: 8, units_picked: 25 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-11", hours_worked: 8, units_picked: 25 }, as: ContractorAdmin }
            - { call: "GET /h2a/worker-assignments/${asg_a}/reconciliation", as: ContractorAdmin }
            - { call: "POST /h2a/worker-assignments/${asg_a}/end", payload: { end_reason: "COMPLETED" }, as: ContractorAdmin }
          trigger:
            - { call: "POST /h2a/worker-assignments/${asg_a}/finalize-reconciliation", payload: {}, as: ContractorAdmin, captures: { rec_final: $.data } }
          assert:
            - "Provisional (captured before end): WageReconciliation[0].status == OPEN, computed_through_date == 2026-09-11, piece_earnings_cents == 112500, hourly_floor_earnings_cents == 148000, makeup_pay_cents == 35500, guarantee_basis_workdays == 10, guaranteed_quarters == 240, worked_quarters == 320, shortfall_quarters == 0, guarantee_pay_cents == 0, inbound_transport_owed_cents == 0 (2026-09-11 < threshold 2026-09-25), outbound_transport_owed_cents == 0, total_due_cents == 148000"
            - "Final (trigger response): status == FINALIZED, computed_through_date == 2026-09-11, piece_earnings_cents == 112500, makeup_pay_cents == 35500, guarantee_pay_cents == 0, guarantee_applied == true, inbound_transport_owed_cents == 0, outbound_transport_owed_cents == 75000, total_due_cents == 223000"
            - "Divergence: final total_due_cents (223000) - provisional total_due_cents (148000) == 75000 == outbound transport owed only in the final variant"

      - name: audit_exposure_provisional_vs_final_divergence
        grounds:
          - calculations.audit_penalty_assessment
          - state_machines.AuditCase.OPEN_to_FINDINGS_ISSUED
          - state_machines.AuditCase.FINDINGS_ISSUED_to_RESOLVED_PENALTY
        distinguishing_aspect: |
          Same findings array yields different money under the two ENFORCEMENT-
          domain variants: provisional ignores willful multiplier/cap/discount
          (570000), final applies willful x2, per-kind cap, then the 10%
          good-faith discount (918000). Distinct entity domain from the
          wage_reconciliation instance (AuditCase vs WageReconciliation).
        test_recipe:
          setup:
            - "Grower G1 exists; AuditCase OPEN on G1 with findings [WAGE_UNDERPAYMENT x3 willful, RECORDKEEPING x2 not willful]"
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/audit-cases", payload: { grower_id: "${g1}", trigger_source: "MANUAL" }, as: WageAuditor, captures: { ac1: $.data.id } }
            - { call: "POST /h2a/audit-cases/${ac1}/issue-findings", payload: { findings: [ { violation_code: "WAGE_UNDERPAYMENT", count: 3, willful: true }, { violation_code: "RECORDKEEPING", count: 2, willful: false } ] }, as: WageAuditor, captures: { ac_prov_exposure: $.data.provisional_exposure_cents } }
          trigger:
            - { call: "POST /h2a/audit-cases/${ac1}/assess-penalty", payload: { good_faith: true }, as: WageAuditor, captures: { ac_final: $.data.final_penalty_cents } }
          assert:
            - "provisional_exposure_cents == 570000 (150000*3 + 60000*2; no willful multiplier, no cap, no discount)"
            - "final_penalty_cents == 918000 (WU kind = min(150000*3*2, 1000000) = 900000; RK kind = min(60000*2*1, 1000000) = 120000; sum 1020000; round_half_up(1020000*90/100) = 918000)"
            - "Grower ${g1}.status == SUSPENDED after assessment"
            - "AuditCase.${ac1}.status == RESOLVED_PENALTY and closed_on == 2026-08-01 (default clock)"

  - rule_id: combinatorial_formula
    instances:
      - name: wage_recon_multi_input_state_branch_mode_a
        grounds:
          - calculations.weekly_wage_reconciliation
          - calculations.three_quarters_guarantee
          - calculations.transportation_reimbursement
        distinguishing_aspect: |
          Mode (a): >= 3 inputs (hours, units, locked floor 1850, piece 450,
          end_reason, dates) with non-linear interaction — nested min/max on
          weekly makeup, guarantee floor on quarter-hours, and conditional
          branches on end_reason — producing composite total_due 612300.
        test_recipe:
          setup:
            - "J1 ACTIVE, W_A WORKING since 2026-09-01; exactly 10 WorkLogs (workdays 2026-09-01..2026-09-11, 8.0h, 30 units each)"
            - "clock advanced to 2026-10-21 (past work_end_date 2026-10-20); assignment ended COMPLETED; reconciliation FINALIZED"
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
            - { call: "POST /h2a/job-orders", payload: { grower_id: "${g1}", wage_determination_id: "${wd1}", title: "Fall lettuce", crop: "LETTUCE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-10-20", daily_standard_hours: 8, workers_requested: 4, offered_hourly_cents: 1800, offered_piece_rate_cents_per_unit: 400, inbound_transport_cents: 60000, outbound_transport_cents: 75000 }, as: ContractorAdmin, captures: { jo1: $.data.id } }
            - { call: "POST /h2a/job-orders/${jo1}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/certify", payload: {}, as: ProgramReviewer }
            - { call: "POST /h2a/job-orders/${jo1}/begin-recruitment", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/close-recruitment", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/visa-petitions", payload: { receipt_code: "RCPT-1", requested_worker_count: 1 }, as: ContractorAdmin, captures: { pet1: $.data.id } }
            - { call: "POST /h2a/workers", payload: { full_name: "Worker A", passport_number: "P0001", date_of_birth: "1990-01-01", country_code: "MX" }, as: ContractorAdmin, captures: { wa: $.data.id } }
            - { call: "POST /h2a/visa-petitions/${pet1}/link-worker", payload: { worker_id: "${wa}" }, as: ContractorAdmin }
            - { call: "POST /h2a/visa-petitions/${pet1}/file", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/visa-petitions/${pet1}/adjudicate", payload: { decision: "APPROVE", approved_worker_count: 1 }, as: ProgramReviewer }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /h2a/consular-appointments", payload: { worker_id: "${wa}", petition_id: "${pet1}", consulate_code: "MEX-MTY", appointment_date: "2026-09-01" }, as: ContractorAdmin, captures: { appt_a: $.data.id } }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/activate", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/consular-appointments/${appt_a}/complete", payload: { outcome: "ISSUED" }, as: VisaOfficer }
            - { call: "POST /h2a/worker-assignments", payload: { worker_id: "${wa}", job_order_id: "${jo1}" }, as: ContractorAdmin, captures: { asg_a: $.data.id } }
            - { call: "POST /h2a/worker-assignments/${asg_a}/start", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2026-09-11T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-01", hours_worked: 8, units_picked: 30 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-02", hours_worked: 8, units_picked: 30 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-03", hours_worked: 8, units_picked: 30 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-04", hours_worked: 8, units_picked: 30 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-05", hours_worked: 8, units_picked: 30 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-07", hours_worked: 8, units_picked: 30 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-08", hours_worked: 8, units_picked: 30 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-09", hours_worked: 8, units_picked: 30 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-10", hours_worked: 8, units_picked: 30 }, as: ContractorAdmin }
            - { call: "POST /h2a/work-logs", payload: { worker_assignment_id: "${asg_a}", work_date: "2026-09-11", hours_worked: 8, units_picked: 30 }, as: ContractorAdmin }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2026-10-21T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /h2a/worker-assignments/${asg_a}/end", payload: { end_reason: "COMPLETED" }, as: ContractorAdmin }
          trigger:
            - { call: "POST /h2a/worker-assignments/${asg_a}/finalize-reconciliation", payload: {}, as: ContractorAdmin }
          assert:
            - "piece_earnings_cents == 135000 (10 days x 30 units x 450)"
            - "hourly_floor_earnings_cents == 148000 (10 days x round_half_up(32 quarters x 1850/4) = 10 x 14800)"
            - "makeup_pay_cents == 13000 (week1: max(0, 88800-81000)=7800; week2: max(0, 59200-54000)=5200)"
            - "guarantee_basis_workdays == 43; guaranteed_quarters == 1032; worked_quarters == 320; shortfall_quarters == 712; guarantee_pay_cents == 329300 (round_half_up(712 x 1850 / 4)); guarantee_applied == true"
            - "inbound_transport_owed_cents == 60000 (computed_through 2026-10-20 >= threshold 2026-09-25); outbound_transport_owed_cents == 75000 (end_reason COMPLETED)"
            - "total_due_cents == 612300"

      - name: audit_penalty_per_kind_cap_order_mode_b
        grounds:
          - calculations.audit_penalty_assessment
        distinguishing_aspect: |
          Mode (b): nested evaluation order is load-bearing — per-kind cap is
          applied BEFORE summation (2000000), whereas cap-after-sum would give
          1000000; the scaffold pins cap-before-sum explicitly. Different mode
          from the wage_recon instance (multi-input state branches).
        test_recipe:
          setup:
            - "Grower G1 with an AuditCase carrying two over-cap willful findings: WAGE_UNDERPAYMENT x8 and HOUSING_SUBSTANDARD x10"
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/audit-cases", payload: { grower_id: "${g1}", trigger_source: "WAGE_DISCREPANCY" }, as: WageAuditor, captures: { ac1: $.data.id } }
            - { call: "POST /h2a/audit-cases/${ac1}/issue-findings", payload: { findings: [ { violation_code: "WAGE_UNDERPAYMENT", count: 8, willful: true }, { violation_code: "HOUSING_SUBSTANDARD", count: 10, willful: true } ] }, as: WageAuditor }
          trigger:
            - { call: "POST /h2a/audit-cases/${ac1}/assess-penalty", payload: { good_faith: false }, as: WageAuditor, captures: { ac_final: $.data.final_penalty_cents } }
          assert:
            - "provisional_exposure_cents == 2400000 (150000*8 + 120000*10)"
            - "final_penalty_cents == 2000000: WU kind = min(150000*8*2, 1000000) = 1000000; HS kind = min(120000*10*2, 1000000) = 1000000; sum of capped kinds = 2000000; no discount (good_faith false)"
            - "2000000 != 1000000 — proves cap applied per kind before summation, not once after"

  - rule_id: non_linear_state_machine
    instances:
      - name: job_order_deficiency_cure_cycle
        grounds:
          - state_machines.JobOrder.SUBMITTED_to_DEFICIENCY
          - state_machines.JobOrder.DEFICIENCY_to_SUBMITTED
          - state_machines.JobOrder.SUBMITTED_to_CERTIFIED
        distinguishing_aspect: |
          JobOrder cycles SUBMITTED -> DEFICIENCY -> SUBMITTED (cure loop), a
          non-linear shape on the JobOrder entity; the loop clears
          deficiency_note and re-takes wage snapshots on resubmission.
        test_recipe:
          setup:
            - "Grower G1 ACTIVE; WD1 PUBLISHED; J1 created (DRAFT, version 1)"
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
            - { call: "POST /h2a/job-orders", payload: { grower_id: "${g1}", wage_determination_id: "${wd1}", title: "Fall lettuce", crop: "LETTUCE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-10-20", daily_standard_hours: 8, workers_requested: 4, offered_hourly_cents: 1800, offered_piece_rate_cents_per_unit: 400, inbound_transport_cents: 60000, outbound_transport_cents: 75000 }, as: ContractorAdmin, captures: { jo1: $.data.id } }
            - { call: "POST /h2a/job-orders/${jo1}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/flag-deficiency", payload: { note: "missing housing addendum" }, as: ProgramReviewer }
          trigger:
            - { call: "POST /h2a/job-orders/${jo1}/submit", payload: {}, as: ContractorAdmin, captures: { jo_after_cure: $.data } }
            - { call: "POST /h2a/job-orders/${jo1}/certify", payload: {}, as: ProgramReviewer, captures: { jo_cert: $.data.status } }
          assert:
            - "After cure resubmit: status == SUBMITTED and deficiency_note == null"
            - "locked_aewr_hourly_cents == 1850 and locked_prevailing_hourly_cents == 1775 and locked_prevailing_piece_rate_cents_per_unit == 450 (snapshots re-taken on the cycle's cure leg)"
            - "After certify: status == CERTIFIED (cycle exits forward)"
            - "JobOrder.version == 5 after create+submit+flag+submit+certify (each mutation increments by 1)"

      - name: visa_petition_rfe_cycle_with_hard_limit
        grounds:
          - state_machines.VisaPetition.FILED_to_RFE
          - state_machines.VisaPetition.RFE_to_FILED
          - errors[ERR_RFE_LIMIT_REACHED]
        distinguishing_aspect: |
          VisaPetition cycles FILED -> RFE -> FILED (negotiation loop) on a
          different entity than the JobOrder cycle; rfe_count hard-caps the
          loop at 2, so the third issue-rfe fails ERR_RFE_LIMIT_REACHED and the
          petition must exit via adjudication.
        test_recipe:
          setup:
            - "J1 in PETITIONING; petition RCPT-1 (requested 2) with workers W_A, W_B linked; petition FILED once"
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
