# =============================================================================
# Task 1116: Hazmat Transportation Compliance & Placarding — scaffold seed
# Difficulty: harder than expert (maximal rule depth, dense cross-entity
# interactions, tight boundary conditions, many error precedence levels,
# rich state machines, non-trivial calculations)
# =============================================================================

scenario: |
  generate task hard than expert level! 1116. Hazmat Transportation Compliance & Placarding (hazmat shipper compliance office): shipment classification & proper shipping name determination, packaging authorization & marking/labeling, placard selection & vehicle segregation rules, shipping paper & emergency response information, driver training & endorsement verification, security plan & route restriction, incident reporting timelines, carrier registration & fees

domain_name: hazmat-transportation-compliance
api_prefix: /hazmat

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat          # peer collections under /hazmat, FK-linked; reads via filtered lists
  state_machine_shape: cyclic    # reject/rework, amendment, suspension/reinstatement cycles
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the hazmat carrier" }
      - { name: usdot_number, type: string, source: input, description: "USDOT registration number; unique across all carriers", constraints: "unique; duplicate create -> ERR_DUPLICATE_USDOT" }
      - { name: fleet_size_declared, type: integer, source: input, description: "Declared power-unit count used for the provisional registration fee", constraints: ">= 0" }
      - { name: verified_fleet_size, type: integer, source: system, description: "Regulator-verified fleet size recorded at registration approval; null until first approval", default: null }
      - { name: hazmat_categories, type: array, source: input, description: "Category authorizations; enum members: EXPLOSIVE | FLAMMABLE_LIQUID | OXIDIZER | RADIOACTIVE | INHALATION_TOXIC | CORROSIVE | MISC" }
      - { name: accepts_dangerous_placard_substitution, type: boolean, source: input, default: false, description: "Carrier option to allow DANGEROUS placard substitution on mixed Table-2 loads" }
      - { name: registration_status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED_ACTIVE | SUSPENDED | EXPIRED" }
      - { name: registration_tier, type: enum, source: computed, description: "SMALL | MEDIUM | LARGE derived from fleet input per registration_fee calculation" }
      - { name: registration_expires_at, type: datetime, source: system, description: "Set at each approval to approval-clock + 1 year; null until first approval", default: null }
      - { name: security_plan_required, type: boolean, source: computed, description: "true iff hazmat_categories intersect {EXPLOSIVE, RADIOACTIVE, INHALATION_TOXIC}" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum over RegistrationInvoice with status OPEN of (total_due_cents - paid_cents)" }
      - { name: credit_balance_cents, type: integer, source: computed, default: 0, description: "Unapplied payment overage held as credit, consumed first by later payments" }
      - { name: safety_rating, type: integer, source: computed, default: 100, description: "Starts 100; decremented at incident close per confirmed severity; floor 0" }

  - name: SecurityPlan
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; owning carrier" }
      - { name: plan_name, type: string, source: input, description: "Human-readable plan name" }
      - { name: coverage_categories, type: array, source: input, description: "Subset of carrier hazmat categories this plan covers" }
      - { name: effective_from, type: datetime, source: input, description: "Coverage window start (closed bound)" }
      - { name: effective_to, type: datetime, source: input, description: "Coverage window end (closed bound); must be > effective_from" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | UNDER_REVISION | REJECTED | EXPIRED" }
      - { name: approved_at, type: datetime, source: system, description: "Clock instant of latest approval; null until approved", default: null }

  - name: HazmatMaterial
    parent: null
    common_fields: true
    fields:
      - { name: un_na_number, type: string, source: input, description: "UN/NA identification number; unique", constraints: "unique; duplicate -> ERR_DUPLICATE_UN_NA" }
      - { name: proper_shipping_name, type: string, source: input, description: "Regulatory proper shipping name (PSN)" }
      - { name: hazard_class, type: enum, source: input, description: "CLASS_1_1 | CLASS_1_2 | CLASS_1_3 | CLASS_2_1 | CLASS_2_2 | CLASS_2_3 | CLASS_3 | CLASS_4_1 | CLASS_4_2 | CLASS_4_3 | CLASS_5_1 | CLASS_5_2 | CLASS_6_1 | CLASS_6_2 | CLASS_7 | CLASS_8 | CLASS_9" }
      - { name: packing_group, type: enum, source: input, description: "PG_I | PG_II | PG_III | PG_NONE; PG_NONE material is compatible with any spec max_packing_group" }
      - { name: placard_table, type: enum, source: input, description: "TABLE_1 (placard at any quantity) | TABLE_2 (placard at aggregate threshold)" }
      - { name: transport_category, type: enum, source: input, description: "EXPLOSIVE | FLAMMABLE_LIQUID | OXIDIZER | RADIOACTIVE | INHALATION_TOXIC | CORROSIVE | MISC; must be within carrier hazmat_categories" }
      - { name: reportable_quantity_lbs, type: number, source: input, description: "CERCLA reportable quantity in pounds" }
      - { name: is_inhalation_hazard, type: boolean, source: input, default: false, description: "Poison-inhalation hazard flag" }
      - { name: segregation_group, type: enum, source: input, default: "SG_NONE", description: "SG_NONE | SG_ACID | SG_ALKALI | SG_OXIDIZER | SG_FLAMMABLE" }
      - { name: erg_guide_number, type: string, source: input, description: "Emergency Response Guide number copied onto shipping papers" }
      - { name: requires_security_plan, type: boolean, source: computed, description: "true iff placard_table == TABLE_1 or is_inhalation_hazard or hazard_class == CLASS_7" }

  - name: PackagingSpec
    parent: null
    common_fields: true
    fields:
      - { name: spec_code, type: string, source: input, description: "UN specification code, e.g. UN1A1; unique", constraints: "unique; duplicate -> ERR_DUPLICATE_SPEC_CODE" }
      - { name: authorized_hazard_classes, type: array, source: input, description: "Hazard class enum members this packaging is authorized for" }
      - { name: max_packing_group, type: enum, source: input, description: "PG_I | PG_II | PG_III; PG_I packaging accepts PG_I/II/III material, PG_II accepts II/III, PG_III accepts III only" }
      - { name: max_net_quantity_kg, type: number, source: input, description: "Maximum net quantity per shipment using this spec" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; employing carrier" }
      - { name: full_name, type: string, source: input, description: "Driver full name" }
      - { name: cdl_number, type: string, source: input, description: "CDL number; unique", constraints: "unique; duplicate -> ERR_DUPLICATE_CDL" }
      - { name: hazmat_endorsement_expires_at, type: datetime, source: input, description: "Hazmat endorsement expiry instant; endorsement is valid while clock <= this value" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED (system-driven via carrier suspension cascade)" }
      - { name: qualification_posture, type: enum, source: computed, description: "SUSPENDED | ENDORSEMENT_EXPIRED | TRAINING_LAPSED | QUALIFIED per driver_qualification_posture" }

  - name: TrainingRecord
    parent: null
    common_fields: false
    fields:
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; record owner" }
      - { name: training_type, type: enum, source: input, description: "INITIAL | RECURRENT" }
      - { name: completed_at, type: datetime, source: input, description: "Training completion instant" }
      - { name: expires_at, type: datetime, source: computed, description: "Per training_expiry_extension: anchored to prior record expiry when completed inside the 90-day early-renewal window, else completed_at + 3 years" }
      - { name: certificate_code, type: string, source: input, description: "Certificate identifier (free text)" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; owning carrier" }
      - { name: plate_number, type: string, source: input, description: "Plate number; unique", constraints: "unique; duplicate -> ERR_DUPLICATE_PLATE" }
      - { name: vehicle_class, type: enum, source: input, description: "VAN | FLATBED | TANKER" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | LOADING | DISPATCHED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id; shipping carrier" }
      - { name: material_id, type: string, source: input, description: "FK -> HazmatMaterial.id; classified material" }
      - { name: packaging_spec_id, type: string, source: input, description: "FK -> PackagingSpec.id; chosen packaging" }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; assigned at tender; null until then", default: null }
      - { name: declared_shipping_name, type: string, source: input, description: "Shipper-declared PSN; must normalize-match material PSN at classify" }
      - { name: normalized_shipping_name, type: string, source: computed, description: "UPPERCASED, trimmed, inner-whitespace-collapsed declared name; set at classify" }
      - { name: quantity_kg, type: number, source: input, description: "Net quantity in kilograms", constraints: "> 0" }
      - { name: declared_value_cents, type: integer, source: input, description: "Declared value in cents used by load_handling_fee", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | CLASSIFIED | PACKAGING_VERIFIED | DOCUMENTED | REJECTED | TENDERED | IN_TRANSIT | DELIVERED | CANCELLED" }
      - { name: classified_by_user_id, type: string, source: system, description: "X-User-ID of the officer who performed classify; SoD anchor for paper certification", default: null }
      - { name: pinned_security_plan_id, type: string, source: system, description: "SecurityPlan pinned at tender; null until tendered", default: null }
      - { name: pinned_security_plan_version, type: integer, source: system, description: "SecurityPlan.version pinned at tender; dispatch compares against current plan version", default: null }

  - name: ShippingPaper
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; one paper per shipment (1:1)", constraints: "unique per shipment; second create -> ERR_DUPLICATE_SHIPPING_PAPER" }
      - { name: emergency_contact_phone, type: string, source: input, description: "24-hour emergency response telephone number" }
      - { name: er_response_guide_number, type: string, source: computed, description: "Copied from shipment material erg_guide_number at certify" }
      - { name: emergency_response_summary, type: string, source: input, description: "Free-text emergency response information" }
      - { name: shipper_certification_signed, type: boolean, source: input, description: "Shipper certification signature flag; must be true at certify" }
      - { name: certified_by_user_id, type: string, source: system, description: "X-User-ID of certifying officer; must differ from shipment classified_by_user_id", default: null }
      - { name: amendment_count, type: integer, source: system, default: 0, description: "Increments on each CERTIFIED -> UNDER_AMENDMENT transition" }
      - { name: status, type: enum, source: system, description: "DRAFT | CERTIFIED | UNDER_AMENDMENT | LOCKED_IN_TRANSIT | VOIDED" }

  - name: VehicleLoad
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; assigned vehicle" }
      - { name: route_id, type: string, source: input, description: "FK -> Route.id; planned route" }
      - { name: planned_departure_at, type: datetime, source: input, description: "Planned departure (half-open window start)" }
      - { name: planned_arrival_at, type: datetime, source: input, description: "Planned arrival (half-open window end); must be > planned_departure_at" }
      - { name: total_table2_weight_kg, type: number, source: computed, description: "Live sum of quantity_kg over current LoadItems whose material placard_table == TABLE_2" }
      - { name: required_placards, type: array, source: computed, description: "Computed at seal per placard_determination; cleared to [] on unseal/void" }
      - { name: handling_fee_cents, type: integer, source: computed, description: "Computed at seal per load_handling_fee; cleared to 0 on unseal/void" }
      - { name: status, type: enum, source: system, description: "STAGING | SEALED | DISPATCHED | ARRIVED | VOIDED" }

  - name: LoadItem
    parent: null
    common_fields: false
    fields:
      - { name: load_id, type: string, source: input, description: "FK -> VehicleLoad.id; parent load" }
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; loaded shipment" }
      - { name: position_code, type: string, source: input, description: "Free-text stow position label" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Route code; windows for the same route_code must not overlap (closed-interval semantics)" }
      - { name: allowed_hazard_classes, type: array, source: input, description: "Hazard classes permitted on this route when is_restricted_corridor is true" }
      - { name: is_restricted_corridor, type: boolean, source: input, default: false, description: "Restricted corridor flag; dispatch enforces allowed_hazard_classes when true" }
      - { name: effective_from, type: datetime, source: input, description: "Effective window start (closed bound)" }
      - { name: effective_to, type: datetime, source: input, description: "Effective window end (closed bound); must be > effective_from" }

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; incident subject" }
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; denormalized from shipment at creation" }
      - { name: occurred_at, type: datetime, source: input, description: "Incident occurrence instant" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CATASTROPHIC (reported severity)" }
      - { name: confirmed_severity, type: enum, source: system, description: "Regulator-confirmed severity recorded at close; null until closed", default: null }
      - { name: phone_report_required, type: boolean, source: computed, description: "true iff severity in {MAJOR, CATASTROPHIC}" }
      - { name: phone_deadline, type: datetime, source: computed, description: "occurred_at + 12 hours; phone report on-time iff recorded_at <= phone_deadline" }
      - { name: written_report_deadline, type: datetime, source: computed, description: "occurred_at + 30 days; written filing on-time iff filed_at <= written_report_deadline" }
      - { name: phone_reported_at, type: datetime, source: system, description: "Clock instant of record-phone-report; null until recorded", default: null }
      - { name: written_filed_at, type: datetime, source: system, description: "Clock instant of file-written; null until filed", default: null }
      - { name: is_phone_late, type: boolean, source: computed, description: "phone_report_required AND (phone_reported_at is null OR phone_reported_at > phone_deadline); evaluated at file-written and at close" }
      - { name: is_written_late, type: boolean, source: computed, description: "written_filed_at > written_report_deadline; false until filed" }
      - { name: penalty_cents, type: integer, source: computed, description: "Reported variant at file-written; confirmed variant replaces it at close (incident_penalty)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PHONE_REPORTED | WRITTEN_FILED | CLOSED" }

  - name: RegistrationInvoice
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id; billed carrier" }
      - { name: kind, type: enum, source: system, description: "INITIAL (from DRAFT) | RENEWAL (from EXPIRED) | REINSTATEMENT (from reinstate)" }
      - { name: assessment_year, type: integer, source: system, description: "Calendar year of the logical clock at assessment" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "Provisional variant of registration_fee at submit (declared fleet, no safety discount); null for REINSTATEMENT", default: null }
      - { name: final_total_cents, type: integer, source: computed, description: "Final variant of registration_fee at approve (verified fleet + safety discount); equals provisional for REINSTATEMENT", default: null }
      - { name: total_due_cents, type: integer, source: computed, description: "Amount due: provisional before approval, final after approval" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Allocated payments per payment_waterfall" }
      - { name: status, type: enum, source: system, description: "OPEN | PAID | VOID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Carrier
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /hazmat/carriers/{id}/registration/submit"
        actor: CarrierAdmin
        preconditions:
          - "registration_status IN {DRAFT, EXPIRED}, or APPROVED_ACTIVE inside the early-renewal window [registration_expires_at - 30 days, registration_expires_at] (ERR_CARRIER_NOT_SUBMITTABLE)"
          - "expected_carrier_version matches carrier.version (ERR_STALE_VERSION)"
        side_effects:
          - "Create RegistrationInvoice kind INITIAL with provisional totals per registration_fee"
          - "increments Carrier.version by 1"
      - from: EXPIRED
        to: SUBMITTED
        trigger: "POST /hazmat/carriers/{id}/registration/submit"
        actor: CarrierAdmin
        preconditions:
          - "registration_status IN {DRAFT, EXPIRED}, or APPROVED_ACTIVE inside the early-renewal window (ERR_CARRIER_NOT_SUBMITTABLE)"
          - "expected_carrier_version matches carrier.version (ERR_STALE_VERSION)"
        side_effects:
          - "Create RegistrationInvoice kind RENEWAL with provisional totals incl. late fee per registration_fee (months_late = 0 for early renewal)"
          - "increments Carrier.version by 1"
      - from: APPROVED_ACTIVE
        to: SUBMITTED
        trigger: "POST /hazmat/carriers/{id}/registration/submit (early renewal inside the 30-day pre-expiry window)"
        actor: CarrierAdmin
        preconditions:
          - "clock IN [registration_expires_at - 30 days, registration_expires_at] (ERR_CARRIER_NOT_SUBMITTABLE)"
          - "expected_carrier_version matches carrier.version (ERR_STALE_VERSION)"
        side_effects:
          - "Create RegistrationInvoice kind RENEWAL with provisional totals, months_late = 0"
          - "increments Carrier.version by 1"
      - from: SUBMITTED
        to: APPROVED_ACTIVE
        trigger: "POST /hazmat/carriers/{id}/registration/approve"
        actor: Regulator
        preconditions:
          - "registration_status == SUBMITTED (ERR_CARRIER_NOT_SUBMITTED)"
        side_effects:
          - "verified_fleet_size := payload verified_fleet_size"
          - "Recompute the open INITIAL/RENEWAL invoice at the final variant; set final_total_cents and total_due_cents"
          - "registration_expires_at := clock + 1 year"
      - from: APPROVED_ACTIVE
        to: SUSPENDED
        trigger: "POST /hazmat/carriers/{id}/suspend"
        actor: Regulator
        preconditions:
          - "registration_status == APPROVED_ACTIVE (ERR_CARRIER_NOT_ACTIVE)"
        side_effects:
          - "Link 1: every Driver of this carrier in ACTIVE -> SUSPENDED (plan entities are NOT state-changed; tender/dispatch gates already require the carrier APPROVED_ACTIVE)"
          - "Link 2: caused by link 1's carrier-state change, every Shipment of this carrier in TENDERED -> DOCUMENTED, with pinned_security_plan_id and pinned_security_plan_version cleared (driver_id kept)"
          - "Link 3: caused by link 2's shipment reversions, each reverted shipment's LoadItem is removed from any STAGING or SEALED VehicleLoad; each affected load recomputes total_table2_weight_kg, and an affected SEALED load -> STAGING with required_placards cleared to [] and handling_fee_cents zeroed"
      - from: SUSPENDED
        to: APPROVED_ACTIVE
        trigger: "POST /hazmat/carriers/{id}/reinstate"
        actor: Regulator
        preconditions:
          - "registration_status == SUSPENDED (ERR_CARRIER_NOT_SUSPENDED)"
        side_effects:
          - "Create RegistrationInvoice kind REINSTATEMENT, flat total_due_cents 75000 (no processing fee, no discount)"
          - "Every Driver of this carrier in SUSPENDED -> ACTIVE"
      - from: APPROVED_ACTIVE
        to: EXPIRED
        trigger: "system clock sweep when clock advances past registration_expires_at"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SecurityPlan
    initial_state: DRAFT
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /hazmat/security-plans/{planId}/submit"
        actor: CarrierAdmin
        preconditions:
          - "status IN {DRAFT, UNDER_REVISION} (ERR_PLAN_NOT_SUBMITTABLE)"
        side_effects: []
      - from: UNDER_REVISION
        to: SUBMITTED
        trigger: "POST /hazmat/security-plans/{planId}/submit"
        actor: CarrierAdmin
        preconditions:
          - "status IN {DRAFT, UNDER_REVISION} (ERR_PLAN_NOT_SUBMITTABLE)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /hazmat/security-plans/{planId}/approve"
        actor: Regulator
        preconditions:
          - "status == SUBMITTED (ERR_PLAN_NOT_SUBMITTED)"
          - "No other non-terminal SecurityPlan of the same carrier overlaps [effective_from, effective_to] with closed-interval semantics (ERR_PLAN_WINDOW_CONFLICT)"
        side_effects:
          - "approved_at := clock"
          - "increments SecurityPlan.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /hazmat/security-plans/{planId}/reject"
        actor: Regulator
        preconditions:
          - "status == SUBMITTED (ERR_PLAN_NOT_SUBMITTED)"
        side_effects: []
      - from: APPROVED
        to: UNDER_REVISION
        trigger: "POST /hazmat/security-plans/{planId}/revise"
        actor: CarrierAdmin
        preconditions:
          - "status == APPROVED (ERR_PLAN_NOT_APPROVED)"
        side_effects:
          - "increments SecurityPlan.version by 1 (stales any pinned shipments)"
      - from: APPROVED
        to: EXPIRED
        trigger: "system clock sweep when clock advances past effective_to"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PackagingSpec
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /hazmat/packaging-specs/{specId}/retire"
        actor: Regulator
        preconditions:
          - "status == ACTIVE (ERR_SPEC_NOT_ACTIVE)"
        side_effects:
          - "Link 1: every Shipment using this spec in DRAFT, CLASSIFIED, or PACKAGING_VERIFIED -> CANCELLED"
          - "Link 2: every ShippingPaper of each cancelled shipment in DRAFT, CERTIFIED, or UNDER_AMENDMENT -> VOIDED (caused by the shipment cancellation)"

  - entity: Driver
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (carrier suspension cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "qualification_posture recomputed per driver_qualification_posture"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (carrier reinstatement cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "qualification_posture recomputed per driver_qualification_posture"

  - entity: Vehicle
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: LOADING
        trigger: "system (first non-terminal VehicleLoad created on this vehicle)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOADING
        to: DISPATCHED
        trigger: "system (a VehicleLoad on this vehicle dispatches)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPATCHED
        to: AVAILABLE
        trigger: "system (the DISPATCHED VehicleLoad arrives)"
        actor: system
        preconditions: []
        side_effects: []
      - from: LOADING
        to: AVAILABLE
        trigger: "system (last non-terminal STAGING/SEALED load on this vehicle is voided)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Shipment
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: CLASSIFIED
        trigger: "POST /hazmat/shipments/{id}/classify"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status == DRAFT (ERR_SHIPMENT_NOT_DRAFT)"
          - "Normalized declared_shipping_name equals normalized material proper_shipping_name (ERR_SHIPPING_NAME_MISMATCH)"
        side_effects:
          - "normalized_shipping_name set"
          - "classified_by_user_id := X-User-ID"
      - from: CLASSIFIED
        to: PACKAGING_VERIFIED
        trigger: "POST /hazmat/shipments/{id}/verify-packaging"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status == CLASSIFIED (ERR_SHIPMENT_NOT_CLASSIFIED)"
          - "PackagingSpec status == ACTIVE (ERR_SPEC_NOT_ACTIVE)"
          - "material hazard_class IN spec authorized_hazard_classes (ERR_PACKAGING_CLASS_MISMATCH)"
          - "material packing_group within spec max_packing_group (ERR_PACKING_GROUP_INCOMPATIBLE)"
          - "quantity_kg <= spec max_net_quantity_kg, equality allowed (ERR_QUANTITY_EXCEEDS_CAPACITY)"
        side_effects: []
      - from: PACKAGING_VERIFIED
        to: DOCUMENTED
        trigger: "POST /hazmat/shipments/{id}/document"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status == PACKAGING_VERIFIED (ERR_SHIPMENT_NOT_PACKAGING_VERIFIED)"
          - "The shipment's ShippingPaper exists and status == CERTIFIED (ERR_PAPER_NOT_CERTIFIED)"
        side_effects: []
      - from: DOCUMENTED
        to: REJECTED
        trigger: "POST /hazmat/shipments/{id}/reject"
        actor: Regulator
        preconditions:
          - "status == DOCUMENTED (ERR_SHIPMENT_NOT_DOCUMENTED)"
        side_effects:
          - "ShippingPaper in CERTIFIED -> UNDER_AMENDMENT (must re-certify before re-document)"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /hazmat/shipments/{id}/rework"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status == REJECTED (ERR_SHIPMENT_NOT_REJECTED)"
        side_effects:
          - "normalized_shipping_name and classified_by_user_id cleared"
      - from: DOCUMENTED
        to: TENDERED
        trigger: "POST /hazmat/shipments/{id}/tender"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status IN {DOCUMENTED, TENDERED} (ERR_SHIPMENT_NOT_DOCUMENTED); TENDERED re-tender re-pins security plan and re-assigns driver"
          - "If material.requires_security_plan: security_plan_selector must return a plan (ERR_SECURITY_PLAN_REQUIRED)"
          - "driver exists, driver.carrier_id == shipment.carrier_id (ERR_INVALID_REFERENCE)"
          - "driver qualification_posture == QUALIFIED (ERR_DRIVER_NOT_QUALIFIED)"
          - "carrier.outstanding_balance_cents == 0 (ERR_OUTSTANDING_FEES)"
        side_effects:
          - "driver_id := payload driver_id"
          - "pinned_security_plan_id / pinned_security_plan_version := selected plan id + version (null when not required)"
      - from: TENDERED
        to: TENDERED
        trigger: "POST /hazmat/shipments/{id}/tender (re-tender self-loop)"
        actor: ShipperComplianceOfficer
        preconditions:
          - "Same as DOCUMENTED -> TENDERED"
        side_effects:
          - "Re-pin security plan id/version; re-assign driver"
      - from: TENDERED
        to: IN_TRANSIT
        trigger: "system (owning VehicleLoad dispatches)"
        actor: system
        preconditions: []
        side_effects:
          - "ShippingPaper in CERTIFIED -> LOCKED_IN_TRANSIT (link 2 of dispatch cascade)"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "system (owning VehicleLoad arrives)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /hazmat/shipments/{id}/cancel"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status IN {DRAFT, CLASSIFIED, PACKAGING_VERIFIED} (ERR_SHIPMENT_NOT_CANCELLABLE)"
        side_effects:
          - "ShippingPaper in DRAFT or UNDER_AMENDMENT -> VOIDED"
      - from: CLASSIFIED
        to: CANCELLED
        trigger: "POST /hazmat/shipments/{id}/cancel"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status IN {DRAFT, CLASSIFIED, PACKAGING_VERIFIED} (ERR_SHIPMENT_NOT_CANCELLABLE)"
        side_effects:
          - "ShippingPaper in DRAFT or UNDER_AMENDMENT -> VOIDED"
      - from: PACKAGING_VERIFIED
        to: CANCELLED
        trigger: "POST /hazmat/shipments/{id}/cancel"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status IN {DRAFT, CLASSIFIED, PACKAGING_VERIFIED} (ERR_SHIPMENT_NOT_CANCELLABLE)"
        side_effects:
          - "ShippingPaper in DRAFT, CERTIFIED, or UNDER_AMENDMENT -> VOIDED"
      - from: CLASSIFIED
        to: DRAFT
        trigger: "PATCH /hazmat/shipments/{shipmentId} changing material_id, packaging_spec_id, quantity_kg, or declared_shipping_name"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status IN {DRAFT, CLASSIFIED, PACKAGING_VERIFIED} (ERR_SHIPMENT_NOT_AMENDABLE)"
          - "expected_shipment_version matches shipment.version (ERR_STALE_VERSION)"
        side_effects:
          - "normalized_shipping_name and classified_by_user_id cleared"
          - "increments Shipment.version by 1"
      - from: PACKAGING_VERIFIED
        to: DRAFT
        trigger: "PATCH /hazmat/shipments/{shipmentId} changing material_id, packaging_spec_id, quantity_kg, or declared_shipping_name"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status IN {DRAFT, CLASSIFIED, PACKAGING_VERIFIED} (ERR_SHIPMENT_NOT_AMENDABLE)"
          - "expected_shipment_version matches shipment.version (ERR_STALE_VERSION)"
        side_effects:
          - "normalized_shipping_name and classified_by_user_id cleared"
          - "increments Shipment.version by 1"

  - entity: ShippingPaper
    initial_state: DRAFT
    terminal_states: [LOCKED_IN_TRANSIT, VOIDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /hazmat/shipping-papers/{paperId}/certify"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status IN {DRAFT, UNDER_AMENDMENT} (ERR_PAPER_NOT_CERTIFIABLE)"
          - "shipper_certification_signed == true (ERR_INVALID_REQUEST)"
          - "X-User-ID != shipment.classified_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "certified_by_user_id := X-User-ID"
          - "er_response_guide_number := shipment material erg_guide_number"
      - from: UNDER_AMENDMENT
        to: CERTIFIED
        trigger: "POST /hazmat/shipping-papers/{paperId}/certify"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status IN {DRAFT, UNDER_AMENDMENT} (ERR_PAPER_NOT_CERTIFIABLE)"
          - "shipper_certification_signed == true (ERR_INVALID_REQUEST)"
          - "X-User-ID != shipment.classified_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "certified_by_user_id := X-User-ID"
          - "er_response_guide_number := shipment material erg_guide_number"
      - from: CERTIFIED
        to: UNDER_AMENDMENT
        trigger: "POST /hazmat/shipping-papers/{paperId}/amend"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status == CERTIFIED (ERR_PAPER_NOT_CERTIFIED)"
        side_effects:
          - "amendment_count += 1"
      - from: CERTIFIED
        to: LOCKED_IN_TRANSIT
        trigger: "system (owning shipment enters IN_TRANSIT)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CERTIFIED
        to: UNDER_AMENDMENT
        trigger: "system (owning shipment DOCUMENTED -> REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "amendment_count += 1"
      - from: DRAFT
        to: VOIDED
        trigger: "system (owning shipment cancelled or packaging spec retired cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CERTIFIED
        to: VOIDED
        trigger: "system (owning shipment cancelled from PACKAGING_VERIFIED or packaging spec retired cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_AMENDMENT
        to: VOIDED
        trigger: "system (owning shipment cancelled or packaging spec retired cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: VehicleLoad
    initial_state: STAGING
    terminal_states: [ARRIVED, VOIDED]
    transitions:
      - from: STAGING
        to: SEALED
        trigger: "POST /hazmat/vehicle-loads/{id}/seal"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status == STAGING (ERR_LOAD_NOT_STAGING)"
          - "At least one LoadItem present (ERR_LOAD_EMPTY)"
          - "Carrier of the vehicle is APPROVED_ACTIVE (ERR_CARRIER_NOT_ACTIVE)"
          - "segregation_check over all item pairs finds no forbidden pair (ERR_SEGREGATION_VIOLATION)"
        side_effects:
          - "total_table2_weight_kg recomputed"
          - "required_placards computed per placard_determination"
          - "handling_fee_cents computed per load_handling_fee"
      - from: SEALED
        to: STAGING
        trigger: "POST /hazmat/vehicle-loads/{id}/unseal"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status == SEALED (ERR_LOAD_NOT_SEALED)"
        side_effects:
          - "required_placards := []; handling_fee_cents := 0"
      - from: SEALED
        to: DISPATCHED
        trigger: "POST /hazmat/vehicle-loads/{id}/dispatch"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status == SEALED (ERR_LOAD_NOT_SEALED)"
          - "Every item shipment status == TENDERED (ERR_SHIPMENT_NOT_TENDERED)"
          - "Route effective window covers clock, closed bounds (ERR_ROUTE_NOT_EFFECTIVE)"
          - "If route.is_restricted_corridor: every item material hazard_class IN route.allowed_hazard_classes (ERR_ROUTE_RESTRICTED_CLASS)"
          - "For every item shipment with pinned_security_plan_id: pinned version == current plan version AND plan status == APPROVED (ERR_STALE_SECURITY_PLAN)"
          - "Carrier of the vehicle is APPROVED_ACTIVE (ERR_CARRIER_NOT_ACTIVE)"
          - "Vehicle status == LOADING, i.e. no other load of this vehicle is currently DISPATCHED (ERR_VEHICLE_NOT_DISPATCHABLE)"
        side_effects:
          - "Link 1: Vehicle -> DISPATCHED"
          - "Link 1 (parallel): every item shipment TENDERED -> IN_TRANSIT"
          - "Link 2: each IN_TRANSIT shipment's ShippingPaper CERTIFIED -> LOCKED_IN_TRANSIT"
      - from: DISPATCHED
        to: ARRIVED
        trigger: "POST /hazmat/vehicle-loads/{id}/arrive"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status == DISPATCHED (ERR_LOAD_NOT_DISPATCHED)"
        side_effects:
          - "Vehicle -> AVAILABLE if no other non-terminal load remains on it, else LOADING"
          - "Every item shipment IN_TRANSIT -> DELIVERED"
      - from: STAGING
        to: VOIDED
        trigger: "POST /hazmat/vehicle-loads/{id}/void"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status IN {STAGING, SEALED} (ERR_LOAD_NOT_VOIDABLE)"
        side_effects:
          - "All LoadItems removed; item shipments in TENDERED revert to DOCUMENTED (pin fields kept)"
          - "required_placards := []; handling_fee_cents := 0; total_table2_weight_kg := 0"
          - "Vehicle -> AVAILABLE when no other non-terminal load remains on it"
      - from: SEALED
        to: VOIDED
        trigger: "POST /hazmat/vehicle-loads/{id}/void"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status IN {STAGING, SEALED} (ERR_LOAD_NOT_VOIDABLE)"
        side_effects:
          - "All LoadItems removed; item shipments in TENDERED revert to DOCUMENTED (pin fields kept)"
          - "required_placards := []; handling_fee_cents := 0; total_table2_weight_kg := 0"
          - "Vehicle -> AVAILABLE when no other non-terminal load remains on it"

  - entity: IncidentReport
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PHONE_REPORTED
        trigger: "POST /hazmat/incident-reports/{incidentId}/record-phone-report"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status == DRAFT (ERR_INCIDENT_NOT_DRAFT)"
        side_effects:
          - "phone_reported_at := clock"
      - from: PHONE_REPORTED
        to: WRITTEN_FILED
        trigger: "POST /hazmat/incident-reports/{incidentId}/file-written"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status == PHONE_REPORTED, or status == DRAFT with severity == MINOR (ERR_PHONE_REPORT_REQUIRED)"
        side_effects:
          - "written_filed_at := clock; is_phone_late and is_written_late evaluated"
          - "penalty_cents := reported variant per incident_penalty"
      - from: DRAFT
        to: WRITTEN_FILED
        trigger: "POST /hazmat/incident-reports/{incidentId}/file-written (MINOR severity only)"
        actor: ShipperComplianceOfficer
        preconditions:
          - "status == PHONE_REPORTED, or status == DRAFT with severity == MINOR (ERR_PHONE_REPORT_REQUIRED)"
        side_effects:
          - "written_filed_at := clock; is_phone_late and is_written_late evaluated"
          - "penalty_cents := reported variant per incident_penalty"
      - from: WRITTEN_FILED
        to: CLOSED
        trigger: "POST /hazmat/incident-reports/{incidentId}/close"
        actor: Regulator
        preconditions:
          - "status == WRITTEN_FILED (ERR_INCIDENT_NOT_CLOSABLE)"
        side_effects:
          - "confirmed_severity := payload confirmed_severity"
          - "penalty_cents := confirmed variant per incident_penalty (replaces reported variant)"
          - "carrier.safety_rating -= severity points per safety_rating_update (floor 0)"

  - entity: RegistrationInvoice
    initial_state: OPEN
    terminal_states: [PAID, VOID]
    transitions:
      - from: OPEN
        to: PAID
        trigger: "system (payment_waterfall fills paid_cents to total_due_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "carrier.outstanding_balance_cents recomputed per outstanding_balance"
      - from: OPEN
        to: VOID
        trigger: "POST /hazmat/registration-invoices/{invoiceId}/void"
        actor: Regulator
        preconditions:
          - "status == OPEN (ERR_INVOICE_NOT_VOIDABLE)"
        side_effects:
          - "carrier.outstanding_balance_cents recomputed (voided invoice excluded)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: shipment-amend-stale-version
    parent_entity: Shipment
    write_endpoint: "PATCH /hazmat/shipments/{shipmentId}"
    occ_field: expected_shipment_version
    description: |
      Amending a Shipment whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just amended the same shipment (a legitimate superseding edit) and the
      current writer's view of the shipment is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: carrier-submit-stale-version
    parent_entity: Carrier
    write_endpoint: "POST /hazmat/carriers/{id}/registration/submit"
    occ_field: expected_carrier_version
    description: |
      Submitting a registration against a Carrier whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just submitted (which legitimately supersedes
      the prior draft under the renewal flow) and the current writer's view
      of the carrier is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: registration_fee
    trigger: "Carrier registration submit (provisional variant) and approve (final variant); REINSTATEMENT invoices bypass this calculation (flat 75000)"
    algorithm: tiered_pricing
    formula: |
      Inputs: fleet (declared at submit / verified at approve), security_plan_required,
              months_late (RENEWAL only), safety_rating (final variant only).
      1. tier = SMALL if fleet <= 10; MEDIUM if 11 <= fleet <= 50; LARGE if fleet >= 51.
      2. base = TIER_BASE[tier]; for LARGE: base = 250000 + 2500 * (fleet - 50).
      3. surcharge = round_half_up(base * 0.50) if carrier.security_plan_required else 0.
      4. late_fee (RENEWAL kind only, else 0):
           months_late = number of started calendar months strictly after
             registration_expires_at up to clock; 0 when clock <= registration_expires_at.
             (clock in (expires, expires+1mo] -> 1; each additional started month +1.)
           late_pct = min(0.10 * months_late, 0.50)
           late_fee = round_half_up((base + surcharge) * late_pct)
      5. discount (final variant only, else 0):
           5%  of base when safety_rating >= 95;
           2.5% of base when 90 <= safety_rating < 95; else 0.
           discount = round_half_up(base * discount_pct)
      6. subtotal = base + surcharge + late_fee - discount
      7. processing_fee = round_half_up(subtotal * 0.03) if subtotal >= 100000 else 2500
         (bracket keyed on subtotal BEFORE the fee is added — evaluation order pinned)
      8. total = subtotal + processing_fee
      Rounding order pinned: every component is individually rounded half-up to whole
      cents at the step where it is produced, then integer-summed.
    input_set: "The single open INITIAL/RENEWAL RegistrationInvoice of the carrier; months_late measured against Carrier.registration_expires_at and the logical clock"
    constants:
      TIER_SMALL_MAX_FLEET: 10
      TIER_MEDIUM_MAX_FLEET: 50
      TIER_BASE_SMALL: 25000
      TIER_BASE_MEDIUM: 100000
      TIER_BASE_LARGE: 250000
      LARGE_PER_UNIT_OVER_50: 2500
      SECURITY_SURCHARGE_PCT: 0.50
      LATE_PCT_PER_MONTH: 0.10
      LATE_PCT_CAP: 0.50
      DISCOUNT_PCT_HIGH: 0.05
      DISCOUNT_RATING_HIGH: 95
      DISCOUNT_PCT_MID: 0.025
      DISCOUNT_RATING_MID: 90
      PROCESSING_PCT: 0.03
      PROCESSING_PCT_MIN_SUBTOTAL: 100000
      PROCESSING_FLAT: 2500
      REINSTATEMENT_FLAT: 75000
    precision: "integer cents, round_half_up per component, then sum"
    variants:
      - name: provisional
        when: "computed at registration submit"
        difference: "uses fleet_size_declared; discount = 0 regardless of safety_rating"
      - name: final
        when: "computed at registration approve"
        difference: "uses payload verified_fleet_size; applies safety discount; result replaces provisional_total_cents as final_total_cents and total_due_cents"

  - name: incident_penalty
    trigger: "IncidentReport file-written (reported variant) and close (confirmed variant)"
    algorithm: threshold
    formula: |
      base = SEVERITY_BASE[severity_or_confirmed]  (MINOR 0, MAJOR 50000, CATASTROPHIC 150000)
      phone_component = 25000 if is_phone_late else 0
      days_late = max(0, floor((written_filed_at - written_report_deadline) / 86400s))
      written_component = min(5000 * days_late, 500000)
      On-time boundaries are inclusive: filed exactly AT the deadline -> 0 days late;
      phone recorded exactly at phone_deadline -> not late.
      reported variant:  penalty = base(severity) + phone_component + written_component
      confirmed variant: penalty = round_half_up((base(confirmed_severity) +
        phone_component + written_component) * (1 + adjustment_percent/100))
        where adjustment_percent is the regulator close payload value in [-50, 50].
    input_set: "The single IncidentReport; its shipment and carrier for context only"
    constants:
      PHONE_DEADLINE_HOURS: 12
      WRITTEN_DEADLINE_DAYS: 30
      LATE_PHONE_FEE: 25000
      LATE_WRITTEN_DAILY: 5000
      LATE_WRITTEN_CAP: 500000
      SEVERITY_BASE_MINOR: 0
      SEVERITY_BASE_MAJOR: 50000
      SEVERITY_BASE_CATASTROPHIC: 150000
    precision: "integer cents, round_half_up on the confirmed multiplier step"
    variants:
      - name: reported
        when: "evaluated at file-written"
        difference: "uses shipper-reported severity; no adjustment multiplier"
      - name: confirmed
        when: "evaluated at close"
        difference: "uses regulator confirmed_severity and applies (1 + adjustment_percent/100); replaces the reported penalty_cents"

  - name: placard_determination
    trigger: "VehicleLoad seal (stored); inputs tracked live via total_table2_weight"
    algorithm: threshold
    formula: |
      P1 = set of placard labels = material.hazard_class for every item whose
           material.placard_table == TABLE_1 (any quantity placards).
      W2 = total_table2_weight_kg (sum of quantity_kg over items with TABLE_2 materials).
      If W2 >= 454.0 (boundary inclusive): P2 = set of hazard_class labels over distinct
           TABLE_2 classes present; else P2 = {}.
      required = P1 UNION P2.
      DANGEROUS substitution: if carrier.accepts_dangerous_placard_substitution
        AND |P2| >= 2 AND W2 >= 2270.0 (boundary inclusive):
        required = P1 UNION {"DANGEROUS"}.
    input_set: "Current LoadItems of the load (only items whose shipment is not CANCELLED)"
    constants:
      TABLE2_THRESHOLD_KG: 454.0
      DANGEROUS_THRESHOLD_KG: 2270.0
    precision: "weights in kg compared exactly at one decimal; boundary inclusive (>=)"

  - name: total_table2_weight
    trigger: "LoadItem add, LoadItem remove, load void, carrier-suspension item removal"
    algorithm: aggregation
    formula: |
      total_table2_weight_kg = sum(shipment.quantity_kg) over current LoadItems of the
      load whose shipment material placard_table == TABLE_2. Items removed by any
      transition leave the sum immediately (immediate consistency).
    input_set: "Current LoadItems of the load, joined to Shipment and HazmatMaterial"
    constants: {}
    precision: "kg, one decimal"

  - name: load_handling_fee
    trigger: "VehicleLoad seal"
    algorithm: aggregation
    formula: |
      per_item = round_half_up(item.shipment.declared_value_cents * 0.0625)
      fee = sum(per_item over items) + PLACARD_FEE_CENTS * len(required_placards)
      ROUNDING ORDER PINNED: each line is rounded half-up to whole cents FIRST,
      then integer-summed. (sum-then-round is a different, rejected reading.)
    input_set: "Current LoadItems at seal; required_placards already computed this seal"
    constants:
      HANDLING_RATE: 0.0625
      PLACARD_FEE_CENTS: 725
    precision: "integer cents, round_half_up per line"

  - name: segregation_check
    trigger: "LoadItem add and VehicleLoad seal"
    algorithm: pairing
    formula: |
      For every unordered pair of items (i, j) on the load, conflict iff:
        (a) hazard-class pair matches FORBIDDEN_CLASS_PAIRS, where CLASS_1_* matches
            any of CLASS_1_1/CLASS_1_2/CLASS_1_3; or
        (b) segregation_group pair matches FORBIDDEN_GROUP_PAIRS.
      Any conflict -> ERR_SEGREGATION_VIOLATION.
    input_set: "Current LoadItems plus the candidate item (add); all items (seal)"
    constants:
      FORBIDDEN_CLASS_PAIRS: "{CLASS_1_*, CLASS_5_1}, {CLASS_5_1, CLASS_3}, {CLASS_2_3, CLASS_3}"
      FORBIDDEN_GROUP_PAIRS: "{SG_ACID, SG_ALKALI}, {SG_OXIDIZER, SG_FLAMMABLE}"
    precision: "exact set membership"

  - name: training_expiry_extension
    trigger: "TrainingRecord creation"
    algorithm: chronological
    formula: |
      Let prev = the latest prior TrainingRecord of the same driver: the record
      with greatest completed_at strictly before new.completed_at; tie-break
      (equal completed_at) by created_at ASC.
      Window = [prev.expires_at - 90 days, prev.expires_at], BOTH bounds inclusive.
      If prev exists and new.completed_at is inside Window:
        new.expires_at = prev.expires_at + 3 years      (anchored extension)
      Else:
        new.expires_at = new.completed_at + 3 years
      Boundary: completed exactly at prev.expires_at - 90 days -> anchored;
      completed exactly at prev.expires_at -> anchored; one second after -> not anchored.
    input_set: "Existing TrainingRecords of the same driver"
    constants:
      EARLY_RENEWAL_WINDOW_DAYS: 90
      VALIDITY_YEARS: 3
    precision: "datetime, second granularity"

  - name: driver_qualification_posture
    trigger: "Evaluated on read and at tender; refreshed by clock sweep, training-record creation, and status cascades"
    algorithm: constraint_propagation
    formula: |
      if status == SUSPENDED: SUSPENDED
      elif clock > hazmat_endorsement_expires_at: ENDORSEMENT_EXPIRED
         (strictly greater: at the exact expiry instant the endorsement is still valid)
      elif no TrainingRecord of the driver has expires_at >= clock: TRAINING_LAPSED
         (inclusive: a record expiring exactly now still counts)
      else: QUALIFIED
    input_set: "The driver, the logical clock, the driver's TrainingRecords"
    constants: {}
    precision: "datetime, second granularity"

  - name: security_plan_selector
    trigger: "Shipment tender (when material.requires_security_plan)"
    algorithm: selector
    formula: |
      eligibility: SecurityPlan p where p.carrier_id == shipment.carrier_id
        AND p.status == APPROVED
        AND material.transport_category IN p.coverage_categories
        AND p.effective_from <= clock <= p.effective_to (closed bounds)
      ranking: approved_at DESC
      tie-break: created_at ASC
      empty candidate set -> ERR_SECURITY_PLAN_REQUIRED
      Selected plan's id AND current version are pinned onto the shipment.
    input_set: "SecurityPlans of the shipment's carrier"
    constants: {}
    precision: "datetime, second granularity"

  - name: payment_waterfall
    trigger: "POST /hazmat/carriers/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      pool = payload amount_cents + carrier.credit_balance_cents (credit consumed first)
      targets = carrier's RegistrationInvoices with status == OPEN,
        ordered by assessment_year ASC, then created_at ASC (never id)
      for each invoice in order:
        due = invoice.total_due_cents - invoice.paid_cents
        alloc = min(due, pool); invoice.paid_cents += alloc; pool -= alloc
        if invoice.paid_cents == invoice.total_due_cents: invoice.status = PAID
      remainder pool -> carrier.credit_balance_cents
      carrier.outstanding_balance_cents recomputed per outstanding_balance
    input_set: "OPEN RegistrationInvoices of the carrier"
    constants: {}
    precision: "integer cents"

  - name: safety_rating_update
    trigger: "IncidentReport close"
    algorithm: aggregation
    formula: |
      points = 2 if confirmed MINOR; 10 if MAJOR; 25 if CATASTROPHIC
      carrier.safety_rating = max(0, safety_rating - points)
    input_set: "The closing IncidentReport and its carrier"
    constants:
      POINTS_MINOR: 2
      POINTS_MAJOR: 10
      POINTS_CATASTROPHIC: 25
      RATING_FLOOR: 0
    precision: "integer"

  - name: outstanding_balance
    trigger: "invoice create (submit/reinstate), approve recompute, payment waterfall, invoice void"
    algorithm: aggregation
    formula: |
      carrier.outstanding_balance_cents =
        sum(invoice.total_due_cents - invoice.paid_cents)
        over invoices of the carrier with status == OPEN
    input_set: "RegistrationInvoices of the carrier with status OPEN only (PAID and VOID excluded)"
    constants: {}
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path resource ids must exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids
  - priority: 4
    category: business_constraint
    check: "Request shape: required fields present, types valid, enum members valid, ranges valid (quantity_kg > 0, fleet_size_declared >= 0, declared_value_cents >= 0, effective_to > effective_from, planned_arrival_at > planned_departure_at, amount_cents > 0, shipper_certification_signed boolean)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints
  - priority: 5
    category: existence
    check: "Body foreign-key references must exist (material_id, packaging_spec_id, driver_id, vehicle_id, route_id, shipment_id)"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: write endpoints with body FKs
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version must match the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /hazmat/shipments/{shipmentId}; POST /hazmat/carriers/{id}/registration/submit"
  - priority: 7
    category: state
    check: "Aggregate gate: carrier must be APPROVED_ACTIVE to create drivers, vehicles, shipments, security plans, vehicle loads, or to tender/seal/dispatch"
    error_id: ERR_CARRIER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST drivers/vehicles/shipments/security-plans/loads; tender; seal; dispatch"
  - priority: 8
    category: state
    check: "Target resource must be in the transition's required from-state"
    error_id: "domain-specific state errors (ERR_SHIPMENT_NOT_DRAFT, ERR_LOAD_NOT_STAGING, ERR_PLAN_NOT_SUBMITTED, ERR_INCIDENT_NOT_CLOSABLE, etc.)"
    http_status: 409
    applies_to: all action endpoints
  - priority: 9
    category: business_safety
    check: "Material transport_category must be within carrier hazmat_categories (shipment create)"
    error_id: ERR_CATEGORY_NOT_AUTHORIZED
    http_status: 409
    applies_to: "POST /hazmat/carriers/{id}/shipments"
  - priority: 10
    category: business_safety
    check: "Normalized declared_shipping_name must equal normalized material proper_shipping_name (uppercase, trim, collapse inner whitespace)"
    error_id: ERR_SHIPPING_NAME_MISMATCH
    http_status: 422
    applies_to: "POST /hazmat/shipments/{id}/classify"
  - priority: 11
    category: business_safety
    check: "Packaging authorization chain at verify-packaging, in this sub-order: spec ACTIVE (ERR_SPEC_NOT_ACTIVE) -> hazard class authorized (ERR_PACKAGING_CLASS_MISMATCH) -> packing group compatible (ERR_PACKING_GROUP_INCOMPATIBLE) -> quantity_kg <= max_net_quantity_kg inclusive (ERR_QUANTITY_EXCEEDS_CAPACITY)"
    error_id: "ERR_SPEC_NOT_ACTIVE | ERR_PACKAGING_CLASS_MISMATCH | ERR_PACKING_GROUP_INCOMPATIBLE | ERR_QUANTITY_EXCEEDS_CAPACITY"
    http_status: 409
    applies_to: "POST /hazmat/shipments/{id}/verify-packaging"
  - priority: 12
    category: business_safety
    check: "segregation_check: no forbidden hazard-class or segregation-group pair on the load"
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 409
    applies_to: "POST /hazmat/vehicle-loads/{id}/items; POST /hazmat/vehicle-loads/{id}/seal"
  - priority: 13
    category: business_safety
    check: "security_plan_selector must return a plan when material.requires_security_plan (tender)"
    error_id: ERR_SECURITY_PLAN_REQUIRED
    http_status: 409
    applies_to: "POST /hazmat/shipments/{id}/tender"
  - priority: 14
    category: business_safety
    check: "Segregation of duties: certifying officer X-User-ID must differ from shipment classified_by_user_id"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /hazmat/shipping-papers/{paperId}/certify"
  - priority: 15
    category: business_temporal
    check: "Pinned security plan must still be APPROVED and at the pinned version (dispatch)"
    error_id: ERR_STALE_SECURITY_PLAN
    http_status: 409
    applies_to: "POST /hazmat/vehicle-loads/{id}/dispatch"
  - priority: 16
    category: business_temporal
    check: "Driver qualification_posture must be QUALIFIED (tender)"
    error_id: ERR_DRIVER_NOT_QUALIFIED
    http_status: 409
    applies_to: "POST /hazmat/shipments/{id}/tender"
  - priority: 17
    category: business_temporal
    check: "Vehicle load windows: half-open [planned_departure_at, planned_arrival_at) must not overlap any other non-terminal load on the same vehicle; touching endpoints allowed"
    error_id: ERR_LOAD_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /hazmat/vehicles/{vehicleId}/loads"
  - priority: 18
    category: business_temporal
    check: "Route windows: closed [effective_from, effective_to] for the same route_code must not overlap any existing route with that code; touching endpoints conflict"
    error_id: ERR_ROUTE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /hazmat/routes"
  - priority: 19
    category: business_temporal
    check: "Security plan windows: closed [effective_from, effective_to] must not overlap another non-REJECTED, non-EXPIRED plan of the same carrier (checked at create and approve)"
    error_id: ERR_PLAN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /hazmat/carriers/{id}/security-plans; POST /hazmat/security-plans/{planId}/approve"
  - priority: 20
    category: business_temporal
    check: "Dispatch route gate: route effective window must cover clock (ERR_ROUTE_NOT_EFFECTIVE); restricted corridor requires every item class allowed (ERR_ROUTE_RESTRICTED_CLASS, checked after ERR_ROUTE_NOT_EFFECTIVE)"
    error_id: "ERR_ROUTE_NOT_EFFECTIVE | ERR_ROUTE_RESTRICTED_CLASS"
    http_status: 409
    applies_to: "POST /hazmat/vehicle-loads/{id}/dispatch"
  - priority: 21
    category: business_fiscal
    check: "carrier.outstanding_balance_cents must be 0 at tender"
    error_id: ERR_OUTSTANDING_FEES
    http_status: 402
    applies_to: "POST /hazmat/shipments/{id}/tender"
  - priority: 22
    category: business_constraint
    check: "Uniqueness: usdot_number, cdl_number, plate_number, un_na_number, spec_code; one ShippingPaper per shipment; shipment not already on a non-terminal load; item removal only while shipment DOCUMENTED"
    error_id: "ERR_DUPLICATE_USDOT | ERR_DUPLICATE_CDL | ERR_DUPLICATE_PLATE | ERR_DUPLICATE_UN_NA | ERR_DUPLICATE_SPEC_CODE | ERR_DUPLICATE_SHIPPING_PAPER | ERR_SHIPMENT_ALREADY_LOADED | ERR_SHIPMENT_NOT_REMOVABLE"
    http_status: 409
    applies_to: create endpoints; shipping-paper create; load item add/remove

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/hazmat/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-05-01T00:00:00Z and the clock MUST NOT fall back to wall-clock time. Advancing the clock fires the system sweep: carriers past registration_expires_at -> EXPIRED; APPROVED security plans past effective_to -> EXPIRED; driver postures refresh."
    roles: [Regulator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["clock sweep transitions", "driver_qualification_posture refresh"]

  # --- Carrier ---
  - method: POST
    path: "/hazmat/carriers"
    description: "Register a new carrier (DRAFT)"
    roles: [CarrierAdmin]
    code: 201
    input: [legal_name, usdot_number, fleet_size_declared, hazmat_categories, "accepts_dangerous_placard_substitution?"]
    output: Carrier
    side_effects: ["registration_status = DRAFT", "safety_rating = 100", "credit_balance_cents = 0"]
  - method: GET
    path: "/hazmat/carriers"
    description: "List carriers"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "registration_status?"]
    output: "Carrier[]"
    side_effects: []
  - method: GET
    path: "/hazmat/carriers/{carrierId}"
    description: "Get one carrier"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: []
    output: Carrier
    side_effects: []
  - method: POST
    path: "/hazmat/carriers/{id}/registration/submit"
    description: "Submit registration from DRAFT (INITIAL), EXPIRED (RENEWAL with late fee), or APPROVED_ACTIVE inside the 30-day early-renewal window (RENEWAL, months_late 0); OCC-guarded; creates the invoice with provisional totals"
    roles: [CarrierAdmin]
    code: 201
    input: [expected_carrier_version]
    output: RegistrationInvoice
    side_effects: ["registration_status -> SUBMITTED", "registration_fee provisional variant", "increments Carrier.version by 1"]
  - method: POST
    path: "/hazmat/carriers/{id}/registration/approve"
    description: "Approve a SUBMITTED registration; recomputes the open invoice at the final variant"
    roles: [Regulator]
    code: 200
    input: [verified_fleet_size]
    output: Carrier
    side_effects: ["registration_status -> APPROVED_ACTIVE", "registration_fee final variant on open invoice", "registration_expires_at := clock + 1 year", "verified_fleet_size set"]
  - method: POST
    path: "/hazmat/carriers/{id}/suspend"
    description: "Suspend an APPROVED_ACTIVE carrier (3-level cascade: plans unavailable, drivers SUSPENDED, TENDERED shipments revert to DOCUMENTED and are pulled from non-dispatched loads)"
    roles: [Regulator]
    code: 200
    input: []
    output: Carrier
    side_effects: ["registration_status -> SUSPENDED", "drivers ACTIVE -> SUSPENDED", "TENDERED shipments -> DOCUMENTED with pin cleared", "affected LoadItems removed; SEALED loads -> STAGING with placards/fee cleared; loads recompute total_table2_weight_kg"]
  - method: POST
    path: "/hazmat/carriers/{id}/reinstate"
    description: "Reinstate a SUSPENDED carrier; creates a flat REINSTATEMENT invoice (75000)"
    roles: [Regulator]
    code: 200
    input: []
    output: Carrier
    side_effects: ["registration_status -> APPROVED_ACTIVE", "REINSTATEMENT invoice created", "drivers SUSPENDED -> ACTIVE"]
  - method: POST
    path: "/hazmat/carriers/{id}/payments"
    description: "Apply a payment across the carrier's OPEN invoices via payment_waterfall (credit consumed first; overflow becomes credit)"
    roles: [CarrierAdmin]
    code: 200
    input: [amount_cents]
    output: Carrier
    side_effects: ["payment_waterfall allocation", "invoices may flip to PAID", "outstanding_balance_cents recomputed"]
  - method: GET
    path: "/hazmat/carriers/{id}/registration-invoices"
    description: "List a carrier's registration invoices"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "RegistrationInvoice[]"
    side_effects: []
  - method: POST
    path: "/hazmat/registration-invoices/{invoiceId}/void"
    description: "Void an OPEN invoice (compensating action for assessment)"
    roles: [Regulator]
    code: 200
    input: []
    output: RegistrationInvoice
    side_effects: ["status -> VOID", "outstanding_balance_cents recomputed"]

  # --- SecurityPlan ---
  - method: POST
    path: "/hazmat/carriers/{id}/security-plans"
    description: "Create a security plan (DRAFT); window overlap checked with closed-interval semantics"
    roles: [CarrierAdmin]
    code: 201
    input: [plan_name, coverage_categories, effective_from, effective_to]
    output: SecurityPlan
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/hazmat/carriers/{id}/security-plans"
    description: "List a carrier's security plans"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "SecurityPlan[]"
    side_effects: []
  - method: POST
    path: "/hazmat/security-plans/{planId}/submit"
    description: "Submit a plan from DRAFT or UNDER_REVISION"
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: SecurityPlan
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/hazmat/security-plans/{planId}/approve"
    description: "Approve a SUBMITTED plan (closed-window overlap re-checked); bumps plan version"
    roles: [Regulator]
    code: 200
    input: []
    output: SecurityPlan
    side_effects: ["status -> APPROVED", "approved_at := clock", "increments SecurityPlan.version by 1"]
  - method: POST
    path: "/hazmat/security-plans/{planId}/reject"
    description: "Reject a SUBMITTED plan (terminal)"
    roles: [Regulator]
    code: 200
    input: []
    output: SecurityPlan
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/hazmat/security-plans/{planId}/revise"
    description: "Move an APPROVED plan to UNDER_REVISION; bumps plan version and stales pinned shipments"
    roles: [CarrierAdmin]
    code: 200
    input: []
    output: SecurityPlan
    side_effects: ["status -> UNDER_REVISION", "increments SecurityPlan.version by 1"]

  # --- HazmatMaterial (catalog) ---
  - method: POST
    path: "/hazmat/hazmat-materials"
    description: "Register a hazmat material in the catalog"
    roles: [Regulator]
    code: 201
    input: [un_na_number, proper_shipping_name, hazard_class, packing_group, placard_table, transport_category, reportable_quantity_lbs, "is_inhalation_hazard?", "segregation_group?", erg_guide_number]
    output: HazmatMaterial
    side_effects: ["requires_security_plan computed"]
  - method: GET
    path: "/hazmat/hazmat-materials"
    description: "List catalog materials"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "hazard_class?", "placard_table?"]
    output: "HazmatMaterial[]"
    side_effects: []

  # --- PackagingSpec (catalog) ---
  - method: POST
    path: "/hazmat/packaging-specs"
    description: "Register an authorized packaging specification (ACTIVE)"
    roles: [Regulator]
    code: 201
    input: [spec_code, authorized_hazard_classes, max_packing_group, max_net_quantity_kg]
    output: PackagingSpec
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/hazmat/packaging-specs"
    description: "List packaging specifications"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "PackagingSpec[]"
    side_effects: []
  - method: POST
    path: "/hazmat/packaging-specs/{specId}/retire"
    description: "Retire an ACTIVE spec; cascades: pre-DOCUMENTED shipments on it -> CANCELLED, their papers -> VOIDED"
    roles: [Regulator]
    code: 200
    input: []
    output: PackagingSpec
    side_effects: ["status -> RETIRED", "shipments DRAFT/CLASSIFIED/PACKAGING_VERIFIED -> CANCELLED", "their ShippingPapers DRAFT/CERTIFIED/UNDER_AMENDMENT -> VOIDED"]

  # --- Driver ---
  - method: POST
    path: "/hazmat/carriers/{id}/drivers"
    description: "Onboard a driver (carrier must be APPROVED_ACTIVE)"
    roles: [CarrierAdmin]
    code: 201
    input: [full_name, cdl_number, hazmat_endorsement_expires_at]
    output: Driver
    side_effects: ["status = ACTIVE", "qualification_posture computed"]
  - method: GET
    path: "/hazmat/carriers/{id}/drivers"
    description: "List a carrier's drivers"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "status?", "qualification_posture?"]
    output: "Driver[]"
    side_effects: []
  - method: GET
    path: "/hazmat/drivers/{driverId}"
    description: "Get one driver (includes qualification_posture)"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: []
    output: Driver
    side_effects: []
  - method: POST
    path: "/hazmat/drivers/{id}/training-records"
    description: "Append a training record; expires_at computed per training_expiry_extension"
    roles: [CarrierAdmin]
    code: 201
    input: [training_type, completed_at, certificate_code]
    output: TrainingRecord
    side_effects: ["expires_at computed", "driver qualification_posture recomputed"]
  - method: GET
    path: "/hazmat/drivers/{id}/training-records"
    description: "List a driver's training records"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "TrainingRecord[]"
    side_effects: []

  # --- Vehicle ---
  - method: POST
    path: "/hazmat/carriers/{id}/vehicles"
    description: "Register a vehicle (carrier must be APPROVED_ACTIVE)"
    roles: [CarrierAdmin]
    code: 201
    input: [plate_number, vehicle_class]
    output: Vehicle
    side_effects: ["status = AVAILABLE"]
  - method: GET
    path: "/hazmat/carriers/{id}/vehicles"
    description: "List a carrier's vehicles"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Vehicle[]"
    side_effects: []
  - method: GET
    path: "/hazmat/vehicles/{vehicleId}"
    description: "Get one vehicle"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  # --- Shipment ---
  - method: POST
    path: "/hazmat/carriers/{id}/shipments"
    description: "Create a shipment (DRAFT); carrier ACTIVE + category authorization enforced"
    roles: [ShipperComplianceOfficer]
    code: 201
    input: [material_id, packaging_spec_id, declared_shipping_name, quantity_kg, declared_value_cents]
    output: Shipment
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/hazmat/carriers/{id}/shipments"
    description: "List a carrier's shipments; invoices and shipment lists are ordered created_at ASC"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "status?", "material_id?", "packaging_spec_id?", "driver_id?"]
    output: "Shipment[]"
    side_effects: []
  - method: GET
    path: "/hazmat/shipments"
    description: "Global shipment list (FK reverse-reachability for material_id / packaging_spec_id / driver_id via filters); ordered created_at ASC"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "status?", "carrier_id?", "material_id?", "packaging_spec_id?", "driver_id?"]
    output: "Shipment[]"
    side_effects: []
  - method: GET
    path: "/hazmat/shipments/{shipmentId}"
    description: "Get one shipment"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: []
    output: Shipment
    side_effects: []
  - method: PATCH
    path: "/hazmat/shipments/{shipmentId}"
    description: "Amend a shipment in DRAFT/CLASSIFIED/PACKAGING_VERIFIED; OCC-guarded; changing material_id, packaging_spec_id, quantity_kg, or declared_shipping_name reverts status to DRAFT and clears classification"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: [expected_shipment_version, "material_id?", "packaging_spec_id?", "declared_shipping_name?", "quantity_kg?", "declared_value_cents?"]
    output: Shipment
    side_effects: ["classification-relevant change reverts status to DRAFT and clears normalized_shipping_name + classified_by_user_id", "increments Shipment.version by 1"]
  - method: POST
    path: "/hazmat/shipments/{id}/classify"
    description: "Classify: PSN normalized match against the material"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> CLASSIFIED", "normalized_shipping_name set", "classified_by_user_id := X-User-ID"]
  - method: POST
    path: "/hazmat/shipments/{id}/verify-packaging"
    description: "Verify packaging authorization chain (spec active, class, packing group, capacity)"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> PACKAGING_VERIFIED"]
  - method: POST
    path: "/hazmat/shipments/{id}/document"
    description: "Document: requires the shipment's ShippingPaper CERTIFIED"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> DOCUMENTED"]
  - method: POST
    path: "/hazmat/shipments/{id}/reject"
    description: "Regulator rejection of a DOCUMENTED shipment; its CERTIFIED paper drops to UNDER_AMENDMENT"
    roles: [Regulator]
    code: 200
    input: ["reason?"]
    output: Shipment
    side_effects: ["status -> REJECTED", "ShippingPaper CERTIFIED -> UNDER_AMENDMENT"]
  - method: POST
    path: "/hazmat/shipments/{id}/rework"
    description: "Rework a REJECTED shipment back to DRAFT (revision loop)"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> DRAFT", "classification fields cleared"]
  - method: POST
    path: "/hazmat/shipments/{id}/tender"
    description: "Tender to carrier: assigns driver, pins security plan id+version, enforces fiscal gate; re-tender from TENDERED re-pins"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: [driver_id]
    output: Shipment
    side_effects: ["status -> TENDERED", "driver_id set", "security plan pinned (id + version) when material.requires_security_plan"]
  - method: POST
    path: "/hazmat/shipments/{id}/cancel"
    description: "Cancel a pre-DOCUMENTED shipment; voids its non-locked paper"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status -> CANCELLED", "ShippingPaper DRAFT/CERTIFIED/UNDER_AMENDMENT -> VOIDED"]
  - method: GET
    path: "/hazmat/shipments/{id}/load-items"
    description: "List LoadItems referencing this shipment (0..1 while on a non-terminal load)"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "LoadItem[]"
    side_effects: []

  # --- ShippingPaper ---
  - method: POST
    path: "/hazmat/shipments/{id}/shipping-papers"
    description: "Create the shipment's shipping paper (DRAFT); 1:1 with shipment"
    roles: [ShipperComplianceOfficer]
    code: 201
    input: [emergency_contact_phone, emergency_response_summary, shipper_certification_signed]
    output: ShippingPaper
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/hazmat/shipments/{id}/shipping-papers"
    description: "Get the shipment's shipping papers (array of 0..1)"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "ShippingPaper[]"
    side_effects: []
  - method: POST
    path: "/hazmat/shipping-papers/{paperId}/certify"
    description: "Certify a DRAFT or UNDER_AMENDMENT paper; SoD: certifier != shipment classifier"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: []
    output: ShippingPaper
    side_effects: ["status -> CERTIFIED", "certified_by_user_id := X-User-ID", "er_response_guide_number copied from material"]
  - method: POST
    path: "/hazmat/shipping-papers/{paperId}/amend"
    description: "Open a CERTIFIED paper for amendment (amendment cycle)"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: ["emergency_contact_phone?", "emergency_response_summary?"]
    output: ShippingPaper
    side_effects: ["status -> UNDER_AMENDMENT", "amendment_count += 1"]

  # --- VehicleLoad / LoadItem ---
  - method: POST
    path: "/hazmat/vehicles/{vehicleId}/loads"
    description: "Create a load (STAGING) on a vehicle; half-open window overlap checked against the vehicle's other non-terminal loads"
    roles: [ShipperComplianceOfficer]
    code: 201
    input: [route_id, planned_departure_at, planned_arrival_at]
    output: VehicleLoad
    side_effects: ["status = STAGING", "vehicle AVAILABLE -> LOADING when first non-terminal load"]
  - method: GET
    path: "/hazmat/vehicle-loads"
    description: "List loads (FK reverse-reachability for vehicle_id and route_id via filters)"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "vehicle_id?", "route_id?", "status?"]
    output: "VehicleLoad[]"
    side_effects: []
  - method: GET
    path: "/hazmat/vehicle-loads/{loadId}"
    description: "Get one load (includes computed weight, placards, fee)"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: []
    output: VehicleLoad
    side_effects: []
  - method: GET
    path: "/hazmat/vehicle-loads/{id}/items"
    description: "List the load's current LoadItems (FK reverse-reachability for LoadItem.load_id)"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?"]
    output: "LoadItem[]"
    side_effects: []
  - method: POST
    path: "/hazmat/vehicle-loads/{id}/items"
    description: "Add a DOCUMENTED shipment to a STAGING load; segregation checked against existing items"
    roles: [ShipperComplianceOfficer]
    code: 201
    input: [shipment_id, position_code]
    output: LoadItem
    side_effects: ["total_table2_weight_kg recomputed"]
  - method: DELETE
    path: "/hazmat/vehicle-loads/{id}/items/{shipmentId}"
    description: "Remove an item from a STAGING load (only while the shipment is DOCUMENTED); compensating action for item add"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: []
    output: LoadItem
    side_effects: ["total_table2_weight_kg recomputed"]
  - method: POST
    path: "/hazmat/vehicle-loads/{id}/seal"
    description: "Seal a STAGING load: re-checks segregation, computes total_table2_weight_kg, required_placards, handling_fee_cents"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: []
    output: VehicleLoad
    side_effects: ["status -> SEALED", "placard_determination", "load_handling_fee"]
  - method: POST
    path: "/hazmat/vehicle-loads/{id}/unseal"
    description: "Unseal a SEALED load back to STAGING; clears computed placards and fee"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: []
    output: VehicleLoad
    side_effects: ["status -> STAGING", "required_placards := []", "handling_fee_cents := 0"]
  - method: POST
    path: "/hazmat/vehicle-loads/{id}/dispatch"
    description: "Dispatch a SEALED load: route + pinned-plan gates; cascades to vehicle, shipments, and shipping papers"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: []
    output: VehicleLoad
    side_effects: ["status -> DISPATCHED", "Vehicle -> DISPATCHED", "item shipments TENDERED -> IN_TRANSIT", "their papers CERTIFIED -> LOCKED_IN_TRANSIT"]
  - method: POST
    path: "/hazmat/vehicle-loads/{id}/arrive"
    description: "Arrive a DISPATCHED load"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: []
    output: VehicleLoad
    side_effects: ["status -> ARRIVED", "Vehicle -> AVAILABLE", "item shipments IN_TRANSIT -> DELIVERED"]
  - method: POST
    path: "/hazmat/vehicle-loads/{id}/void"
    description: "Void a STAGING/SEALED load; items removed, TENDERED shipments revert to DOCUMENTED"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: []
    output: VehicleLoad
    side_effects: ["status -> VOIDED", "LoadItems removed", "TENDERED item shipments -> DOCUMENTED", "vehicle -> AVAILABLE when no non-terminal load remains"]

  # --- Route ---
  - method: POST
    path: "/hazmat/routes"
    description: "Create a route with a closed effective window; same-route_code windows must not overlap (touching endpoints conflict)"
    roles: [Regulator]
    code: 201
    input: [route_code, allowed_hazard_classes, "is_restricted_corridor?", effective_from, effective_to]
    output: Route
    side_effects: []
  - method: GET
    path: "/hazmat/routes"
    description: "List routes"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "route_code?"]
    output: "Route[]"
    side_effects: []

  # --- IncidentReport ---
  - method: POST
    path: "/hazmat/shipments/{id}/incident-reports"
    description: "File an incident report (DRAFT) for a shipment; deadlines computed from occurred_at"
    roles: [ShipperComplianceOfficer]
    code: 201
    input: [occurred_at, severity]
    output: IncidentReport
    side_effects: ["carrier_id denormalized", "phone_report_required / phone_deadline / written_report_deadline computed"]
  - method: GET
    path: "/hazmat/incident-reports"
    description: "List incident reports (FK reverse-reachability for shipment_id and carrier_id via filters)"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: ["limit?", "offset?", "shipment_id?", "carrier_id?", "status?"]
    output: "IncidentReport[]"
    side_effects: []
  - method: GET
    path: "/hazmat/incident-reports/{incidentId}"
    description: "Get one incident report"
    roles: [CarrierAdmin, ShipperComplianceOfficer, Regulator]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: POST
    path: "/hazmat/incident-reports/{incidentId}/record-phone-report"
    description: "Record the immediate phone notification (clock-stamped)"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status -> PHONE_REPORTED", "phone_reported_at := clock"]
  - method: POST
    path: "/hazmat/incident-reports/{incidentId}/file-written"
    description: "File the written report; MINOR may file directly from DRAFT, MAJOR/CATASTROPHIC require phone first; reported penalty variant computed"
    roles: [ShipperComplianceOfficer]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status -> WRITTEN_FILED", "written_filed_at := clock", "is_phone_late / is_written_late evaluated", "incident_penalty reported variant"]
  - method: POST
    path: "/hazmat/incident-reports/{incidentId}/close"
    description: "Regulator close: confirmed severity + adjustment; confirmed penalty replaces reported; carrier safety_rating decremented"
    roles: [Regulator]
    code: 200
    input: [confirmed_severity, "adjustment_percent?"]
    output: IncidentReport
    side_effects: ["status -> CLOSED", "incident_penalty confirmed variant", "safety_rating_update"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Request shape violation: missing required field, bad type, bad enum member, or range violation (quantity_kg <= 0, end <= start, amount_cents <= 0, etc.)" }
  - { id: ERR_INVALID_REFERENCE, http: 422, condition: "Body foreign-key reference does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_CARRIER_NOT_FOUND, http: 404, condition: "Carrier id not found" }
  - { id: ERR_SECURITY_PLAN_NOT_FOUND, http: 404, condition: "SecurityPlan id not found" }
  - { id: ERR_DRIVER_NOT_FOUND, http: 404, condition: "Driver id not found" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "Vehicle id not found" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment id not found" }
  - { id: ERR_SHIPPING_PAPER_NOT_FOUND, http: 404, condition: "ShippingPaper id not found" }
  - { id: ERR_LOAD_NOT_FOUND, http: 404, condition: "VehicleLoad id not found" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "IncidentReport id not found" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "RegistrationInvoice id not found" }
  - { id: ERR_CARRIER_NOT_ACTIVE, http: 409, condition: "Operation requires carrier registration_status APPROVED_ACTIVE" }
  - { id: ERR_CARRIER_NOT_SUBMITTABLE, http: 409, condition: "Registration submit requires DRAFT or EXPIRED" }
  - { id: ERR_CARRIER_NOT_SUBMITTED, http: 409, condition: "Registration approve requires SUBMITTED" }
  - { id: ERR_CARRIER_NOT_SUSPENDED, http: 409, condition: "Reinstate requires SUSPENDED" }
  - { id: ERR_PLAN_NOT_SUBMITTABLE, http: 409, condition: "Plan submit requires DRAFT or UNDER_REVISION" }
  - { id: ERR_PLAN_NOT_SUBMITTED, http: 409, condition: "Plan approve/reject requires SUBMITTED" }
  - { id: ERR_PLAN_NOT_APPROVED, http: 409, condition: "Plan revise requires APPROVED" }
  - { id: ERR_PLAN_WINDOW_CONFLICT, http: 409, condition: "Plan effective window overlaps another non-terminal plan of the same carrier (closed intervals: touching endpoints conflict)" }
  - { id: ERR_SPEC_NOT_ACTIVE, http: 409, condition: "Packaging spec must be ACTIVE (verify-packaging, retire)" }
  - { id: ERR_SHIPMENT_NOT_DRAFT, http: 409, condition: "Classify requires DRAFT" }
  - { id: ERR_SHIPMENT_NOT_CLASSIFIED, http: 409, condition: "Verify-packaging requires CLASSIFIED" }
  - { id: ERR_SHIPMENT_NOT_PACKAGING_VERIFIED, http: 409, condition: "Document requires PACKAGING_VERIFIED" }
  - { id: ERR_SHIPMENT_NOT_DOCUMENTED, http: 409, condition: "Tender/reject/item-add requires DOCUMENTED (tender also accepts TENDERED for re-pin)" }
  - { id: ERR_SHIPMENT_NOT_REJECTED, http: 409, condition: "Rework requires REJECTED" }
  - { id: ERR_SHIPMENT_NOT_CANCELLABLE, http: 409, condition: "Cancel requires DRAFT, CLASSIFIED, or PACKAGING_VERIFIED" }
  - { id: ERR_SHIPMENT_NOT_AMENDABLE, http: 409, condition: "PATCH requires DRAFT, CLASSIFIED, or PACKAGING_VERIFIED" }
  - { id: ERR_SHIPMENT_NOT_TENDERED, http: 409, condition: "Dispatch requires every item shipment TENDERED" }
  - { id: ERR_SHIPMENT_ALREADY_LOADED, http: 409, condition: "Shipment already has a LoadItem on a non-terminal load" }
  - { id: ERR_SHIPMENT_NOT_REMOVABLE, http: 409, condition: "Item removal requires shipment DOCUMENTED (TENDERED shipments require load void)" }
  - { id: ERR_PAPER_NOT_CERTIFIABLE, http: 409, condition: "Certify requires paper DRAFT or UNDER_AMENDMENT" }
  - { id: ERR_PAPER_NOT_CERTIFIED, http: 409, condition: "Amend requires CERTIFIED; document requires the shipment's paper CERTIFIED" }
  - { id: ERR_DUPLICATE_SHIPPING_PAPER, http: 409, condition: "Shipment already has a shipping paper" }
  - { id: ERR_LOAD_NOT_STAGING, http: 409, condition: "Seal/item-add/item-remove requires STAGING" }
  - { id: ERR_LOAD_NOT_SEALED, http: 409, condition: "Unseal/dispatch requires SEALED" }
  - { id: ERR_LOAD_NOT_DISPATCHED, http: 409, condition: "Arrive requires DISPATCHED" }
  - { id: ERR_LOAD_NOT_VOIDABLE, http: 409, condition: "Void requires STAGING or SEALED" }
  - { id: ERR_LOAD_EMPTY, http: 409, condition: "Seal requires at least one LoadItem" }
  - { id: ERR_LOAD_WINDOW_CONFLICT, http: 409, condition: "Load window overlaps another non-terminal load on the same vehicle (half-open: touching endpoints allowed)" }
  - { id: ERR_ROUTE_WINDOW_CONFLICT, http: 409, condition: "Route window overlaps an existing window for the same route_code (closed intervals: touching endpoints conflict)" }
  - { id: ERR_ROUTE_NOT_EFFECTIVE, http: 409, condition: "Dispatch clock outside the route's effective window" }
  - { id: ERR_ROUTE_RESTRICTED_CLASS, http: 409, condition: "Restricted corridor does not allow an item's hazard class" }
  - { id: ERR_CATEGORY_NOT_AUTHORIZED, http: 409, condition: "Material transport_category not in carrier hazmat_categories" }
  - { id: ERR_SHIPPING_NAME_MISMATCH, http: 422, condition: "Normalized declared shipping name differs from material proper shipping name" }
  - { id: ERR_PACKAGING_CLASS_MISMATCH, http: 409, condition: "Material hazard class not in spec authorized_hazard_classes" }
  - { id: ERR_PACKING_GROUP_INCOMPATIBLE, http: 409, condition: "Material packing group exceeds spec max_packing_group" }
  - { id: ERR_QUANTITY_EXCEEDS_CAPACITY, http: 409, condition: "quantity_kg > spec max_net_quantity_kg (equality allowed)" }
  - { id: ERR_SEGREGATION_VIOLATION, http: 409, condition: "Forbidden hazard-class or segregation-group pair on the load" }
  - { id: ERR_SECURITY_PLAN_REQUIRED, http: 409, condition: "Material requires a security plan but no APPROVED in-window plan covers its category" }
  - { id: ERR_STALE_SECURITY_PLAN, http: 409, condition: "Pinned security plan version no longer current or plan no longer APPROVED at dispatch" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Certifying officer is the same X-User-ID that classified the shipment" }
  - { id: ERR_DRIVER_NOT_QUALIFIED, http: 409, condition: "Driver qualification_posture is not QUALIFIED at tender" }
  - { id: ERR_OUTSTANDING_FEES, http: 402, condition: "Carrier outstanding_balance_cents is not 0 at tender" }
  - { id: ERR_DUPLICATE_USDOT, http: 409, condition: "usdot_number already registered" }
  - { id: ERR_DUPLICATE_CDL, http: 409, condition: "cdl_number already registered" }
  - { id: ERR_DUPLICATE_PLATE, http: 409, condition: "plate_number already registered" }
  - { id: ERR_DUPLICATE_UN_NA, http: 409, condition: "un_na_number already in catalog" }
  - { id: ERR_DUPLICATE_SPEC_CODE, http: 409, condition: "spec_code already in catalog" }
  - { id: ERR_INCIDENT_NOT_DRAFT, http: 409, condition: "record-phone-report requires DRAFT" }
  - { id: ERR_PHONE_REPORT_REQUIRED, http: 409, condition: "file-written requires PHONE_REPORTED, except MINOR severity which may file from DRAFT" }
  - { id: ERR_INCIDENT_NOT_CLOSABLE, http: 409, condition: "Close requires WRITTEN_FILED" }
  - { id: ERR_INVOICE_NOT_VOIDABLE, http: 409, condition: "Void requires invoice OPEN" }
  - { id: ERR_VEHICLE_NOT_DISPATCHABLE, http: 409, condition: "Dispatch requires vehicle status LOADING (no other load of the vehicle currently DISPATCHED)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CarrierAdmin
    description: "Carrier-side administrator: registration, payments, security plans, drivers, vehicles"
    identity: opaque
    exclusive_operations:
      - "POST /hazmat/carriers"
      - "POST /hazmat/carriers/{id}/registration/submit"
      - "POST /hazmat/carriers/{id}/payments"
      - "POST /hazmat/carriers/{id}/security-plans"
      - "POST /hazmat/security-plans/{id}/submit"
      - "POST /hazmat/security-plans/{id}/revise"
      - "POST /hazmat/carriers/{id}/drivers"
      - "POST /hazmat/drivers/{id}/training-records"
      - "POST /hazmat/carriers/{id}/vehicles"
    shared_operations: ["all GET endpoints"]
  - name: ShipperComplianceOfficer
    description: "Shipper compliance office: classification, packaging verification, shipping papers, tendering, load/placard management, incident filing. Segregation of duties: the officer who classifies a shipment may not certify its shipping paper (X-User-ID compared)."
    identity: opaque
    exclusive_operations:
      - "POST /hazmat/carriers/{id}/shipments"
      - "PATCH /hazmat/shipments/{id}"
      - "POST /hazmat/shipments/{id}/classify | verify-packaging | document | rework | tender | cancel"
      - "POST /hazmat/shipments/{id}/shipping-papers"
      - "POST /hazmat/shipping-papers/{id}/certify | amend"
      - "POST /hazmat/vehicles/{id}/loads"
      - "POST /hazmat/vehicle-loads/{id}/items | seal | unseal | dispatch | arrive | void"
      - "DELETE /hazmat/vehicle-loads/{id}/items/{shipmentId}"
      - "POST /hazmat/shipments/{id}/incident-reports"
      - "POST /hazmat/incident-reports/{id}/record-phone-report | file-written"
    shared_operations: ["all GET endpoints"]
  - name: Regulator
    description: "Regulatory authority: catalog management, registration approval, suspension/reinstatement, plan approval, shipment rejection, incident closure, invoice void, clock control"
    identity: opaque
    exclusive_operations:
      - "POST /hazmat/hazmat-materials"
      - "POST /hazmat/packaging-specs"
      - "POST /hazmat/packaging-specs/{id}/retire"
      - "POST /hazmat/routes"
      - "POST /hazmat/carriers/{id}/registration/approve"
      - "POST /hazmat/carriers/{id}/suspend"
      - "POST /hazmat/carriers/{id}/reinstate"
      - "POST /hazmat/security-plans/{id}/approve | reject"
      - "POST /hazmat/shipments/{id}/reject"
      - "POST /hazmat/incident-reports/{id}/close"
      - "POST /hazmat/registration-invoices/{id}/void"
      - "POST /hazmat/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
