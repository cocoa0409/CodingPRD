    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: "Wave[]"
    side_effects: []

  - method: GET
    path: "/waves/{waveId}"
    description: "Get a wave by id"
    roles: [WavePlanner, ClientUser, BillingClerk]
    code: 200
    input: []
    output: Wave
    side_effects: []

  - method: GET
    path: "/returns"
    description: "List returns; filter by order_id, sku_id, bin_id (filtered-list reverse-reachability for those FKs)"
    roles: [ReturnsClerk, ClientUser, BillingClerk]
    code: 200
    input: ["order_id?", "sku_id?", "bin_id?", "limit?", "offset?"]
    output: "Return[]"
    side_effects: []

  - method: GET
    path: "/returns/{returnId}"
    description: "Get a return by id"
    roles: [ReturnsClerk, ClientUser, BillingClerk]
    code: 200
    input: []
    output: Return
    side_effects: []

  - method: GET
    path: "/billing-charges"
    description: "List billing charges; filter by client_id, source_order_id, charge_type (filtered-list reverse-reachability for BillingCharge.client_id and source_order_id)"
    roles: [BillingClerk, ClientUser]
    code: 200
    input: ["client_id?", "source_order_id?", "charge_type?", "limit?", "offset?"]
    output: "BillingCharge[]"
    side_effects: []

  - method: GET
    path: "/billing-charges/{chargeId}"
    description: "Get a billing charge by id"
    roles: [BillingClerk, ClientUser]
    code: 200
    input: []
    output: BillingCharge
    side_effects: []

  # --- Client ---
  - method: POST
    path: "/clients"
    description: "Onboard a client with billing rate card"
    roles: [BillingClerk]
    code: 201
    input: ["name", "storage_rate_per_pallet_cents", "handling_rate_per_order_cents", "handling_rate_per_extra_unit_cents?", "handling_surcharge_per_extra_carton_cents?", "carrier_discount_bps?"]
    output: Client
    side_effects: ["status=ACTIVE", "storage_balance_cents=0", "handling_balance_cents=0"]

  - method: GET
    path: "/clients"
    description: "List clients"
    roles: [BillingClerk, ClientUser, WavePlanner, ReceivingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Client[]"
    side_effects: []

  - method: GET
    path: "/clients/{clientId}"
    description: "Get a client (includes storage_balance_cents, handling_balance_cents)"
    roles: [BillingClerk, ClientUser, WavePlanner, ReceivingClerk]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/clients/{clientId}/suspend"
    description: "Suspend a client (blocks new receipts and orders)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: Client
    side_effects: ["status -> SUSPENDED"]

  # --- Sku ---
  - method: POST
    path: "/clients/{clientId}/skus"
    description: "Onboard a SKU under a client"
    roles: [ClientUser]
    code: 201
    input: ["code", "unit_volume_cc", "unit_cost_cents?", "hazmat?"]
    output: Sku
    side_effects: ["status=ACTIVE; client_id set from path"]

  - method: GET
    path: "/clients/{clientId}/skus"
    description: "List a client's SKUs (filtered-list reverse-reachability for Sku.client_id)"
    roles: [ClientUser, WavePlanner, ReceivingClerk, BillingClerk]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: "Sku[]"
    side_effects: []

  - method: GET
    path: "/clients/{clientId}/skus/{skuId}"
    description: "Get a SKU"
    roles: [ClientUser, WavePlanner, ReceivingClerk, BillingClerk]
    code: 200
    input: []
    output: Sku
    side_effects: []

  - method: POST
    path: "/clients/{clientId}/skus/{skuId}/discontinue"
    description: "Discontinue a SKU (blocks new receipts)"
    roles: [ClientUser]
    code: 200
    input: []
    output: Sku
    side_effects: ["status -> DISCONTINUED"]

  # --- Bin ---
  - method: POST
    path: "/bins"
    description: "Create a warehouse bin/location"
    roles: [ReceivingClerk]
    code: 201
    input: ["location_code", "bin_type", "capacity_cc"]
    output: Bin
    side_effects: ["status=OPEN", "occupied_cc=0"]

  - method: GET
    path: "/bins"
    description: "List bins"
    roles: [ReceivingClerk, WavePlanner, ClientUser, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Bin[]"
    side_effects: []

  - method: GET
    path: "/bins/{binId}"
    description: "Get a bin (includes occupied_cc)"
    roles: [ReceivingClerk, WavePlanner, ClientUser, BillingClerk]
    code: 200
    input: []
    output: Bin
    side_effects: []

  - method: POST
    path: "/bins/{binId}/block"
    description: "Block a bin (rejects putaway and picks)"
    roles: [ReceivingClerk]
    code: 200
    input: []
    output: Bin
    side_effects: ["status -> BLOCKED"]

  # --- InventoryLot ---
  - method: GET
    path: "/inventory-lots"
    description: "List inventory lots; filterable by client_id, sku_id, bin_id, receipt_id (filtered-list reverse-reachability for all four FKs)"
    roles: [ReceivingClerk, WavePlanner, ClientUser, BillingClerk]
    code: 200
    input: ["client_id?", "sku_id?", "bin_id?", "receipt_id?", "limit?", "offset?"]
    output: "InventoryLot[]"
    side_effects: []

  - method: GET
    path: "/inventory-lots/{lotId}"
    description: "Get one inventory lot (includes on_hand_qty, reserved_qty, available_qty, version for OCC)"
    roles: [ReceivingClerk, WavePlanner, ClientUser, BillingClerk]
    code: 200
    input: []
    output: InventoryLot
    side_effects: []

  # --- Receipt ---
  - method: POST
    path: "/clients/{clientId}/receipts"
    description: "Announce an inbound receipt (ASN)"
    roles: [ReceivingClerk]
    code: 201
    input: ["sku_id", "bin_id", "expected_qty"]
    output: Receipt
    side_effects: ["status=ANNOUNCED; rejected if client SUSPENDED or SKU DISCONTINUED"]

  - method: GET
    path: "/clients/{clientId}/receipts"
    description: "List a client's receipts (filtered-list reverse-reachability for Receipt.client_id)"
    roles: [ReceivingClerk, ClientUser, BillingClerk]
    code: 200
    input: ["client_id?", "sku_id?", "bin_id?", "limit?", "offset?"]
    output: "Receipt[]"
    side_effects: []

  - method: GET
    path: "/clients/{clientId}/receipts/{receiptId}"
    description: "Get a receipt"
    roles: [ReceivingClerk, ClientUser, BillingClerk]
    code: 200
    input: []
    output: Receipt
    side_effects: []

  - method: POST
    path: "/clients/{clientId}/receipts/{receiptId}/receive"
    description: "Dock-count an announced receipt"
    roles: [ReceivingClerk]
    code: 200
    input: ["received_qty"]
    output: Receipt
    side_effects: ["received_qty stored", "status ANNOUNCED -> RECEIVED"]

  - method: POST
    path: "/clients/{clientId}/receipts/{receiptId}/putaway"
    description: "Putaway received units into the bin, creating/topping up an InventoryLot"
    roles: [ReceivingClerk]
    code: 200
    input: []
    output: Receipt
    side_effects: ["InventoryLot on_hand_qty/available_qty += received_qty", "Bin.occupied_cc recomputed", "status RECEIVED -> PUTAWAY"]

  - method: POST
    path: "/clients/{clientId}/receipts/{receiptId}/cancel"
    description: "Cancel an announced receipt"
    roles: [ReceivingClerk]
    code: 200
    input: []
    output: Receipt
    side_effects: ["status ANNOUNCED -> CANCELLED"]

  # --- Order ---
  - method: POST
    path: "/clients/{clientId}/orders"
    description: "Import a fulfillment order"
    roles: [ClientUser]
    code: 201
    input: ["ship_to_zone", "lines"]
    output: Order
    side_effects: ["status=IMPORTED", "total_units computed", "rejected if client SUSPENDED"]

  - method: GET
    path: "/clients/{clientId}/orders"
    description: "List a client's orders (filtered-list reverse-reachability for Order.client_id and Order.wave_id)"
    roles: [ClientUser, WavePlanner, BillingClerk, ShipStation]
    code: 200
    input: ["client_id?", "wave_id?", "limit?", "offset?"]
    output: "Order[]"
    side_effects: []

  - method: GET
    path: "/clients/{clientId}/orders/{orderId}"
    description: "Get an order (includes estimated_handling_cents, billed_handling_cents)"
    roles: [ClientUser, WavePlanner, BillingClerk, ShipStation, PackStation]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/clients/{clientId}/orders/{orderId}/pack"
    description: "Pack a fully-picked order into cartons (cartonization)"
    roles: [PackStation]
    code: 200
    input: ["cartons"]
    output: Order
    side_effects: ["Cartons created with carton_size", "estimated_handling_cents computed", "status PICKING -> PACKED"]

  - method: POST
    path: "/clients/{clientId}/orders/{orderId}/ship"
    description: "Ship a packed order with a purchased label; consume inventory and bill handling"
    roles: [ShipStation]
    code: 200
    input: []
    output: Order
    side_effects:
      - "reserved->consumed: lot.reserved_qty -= qty AND lot.on_hand_qty -= qty (cascade Bin.occupied_cc)"
      - "Cartons PACKED -> SHIPPED"
      - "billed_handling_cents computed; HANDLING BillingCharge posted; Client.handling_balance_cents += amount"
      - "status PACKED -> SHIPPED; parent Wave auto-completes if all members terminal"

  - method: POST
    path: "/clients/{clientId}/orders/{orderId}/short"
    description: "Declare a picking order short (some picks under-confirmed)"
    roles: [PickOperator]
    code: 200
    input: []
    output: Order
    side_effects:
      - "release unconsumed reservations: lot.reserved_qty -= (qty - picked_qty) (cascade available_qty)"
      - "PickTasks -> SHORT_CLOSED"
      - "status PICKING -> SHORT; parent Wave auto-completes if all members terminal"

  - method: POST
    path: "/clients/{clientId}/orders/{orderId}/cancel"
    description: "Cancel an order (IMPORTED or RESERVED only)"
    roles: [ClientUser]
    code: 200
    input: []
    output: Order
    side_effects:
      - "If RESERVED: release reservations lot.reserved_qty -= qty (cascade available_qty); PickTasks -> SHORT_CLOSED"
      - "Detach from wave if attached"
      - "status -> CANCELLED; parent Wave auto-completes if all members terminal"

  # --- Wave ---
  - method: POST
    path: "/clients/{clientId}/waves"
    description: "Create a wave (batch) for a client"
    roles: [WavePlanner]
    code: 201
    input: []
    output: Wave
    side_effects: ["status=BUILDING", "order_count=0"]

  - method: GET
    path: "/clients/{clientId}/waves"
    description: "List a client's waves (filtered-list reverse-reachability for Wave.client_id)"
    roles: [WavePlanner, ClientUser, BillingClerk]
    code: 200
    input: ["client_id?", "limit?", "offset?"]
    output: "Wave[]"
    side_effects: []

  - method: GET
    path: "/clients/{clientId}/waves/{waveId}"
    description: "Get a wave (includes order_count)"
    roles: [WavePlanner, ClientUser, BillingClerk]
    code: 200
    input: []
    output: Wave
    side_effects: []

  - method: POST
    path: "/clients/{clientId}/waves/{waveId}/add-order"
    description: "Add an IMPORTED order to a BUILDING wave"
    roles: [WavePlanner]
    code: 200
    input: ["order_id"]
    output: Wave
    side_effects: ["Order.wave_id set", "order_count incremented"]

  - method: POST
    path: "/clients/{clientId}/waves/{waveId}/release"
    description: "Release a wave: reserve inventory (FEFO), generate pick tasks, move orders to PICKING"
    roles: [WavePlanner]
    code: 200
    input: []
    output: Wave
    side_effects:
      - "reserve each line FEFO by lot.created_at ASC: lot.reserved_qty += qty (cascade available_qty)"
      - "PickTasks created (ASSIGNED)"
      - "Orders IMPORTED -> RESERVED -> PICKING"
      - "status BUILDING -> RELEASED"

  - method: POST
    path: "/clients/{clientId}/waves/{waveId}/cancel"
    description: "Cancel a BUILDING wave (detaches member orders)"
    roles: [WavePlanner]
    code: 200
    input: []
    output: Wave
    side_effects: ["member Orders detached (wave_id=null)", "status BUILDING -> CANCELLED"]

  # --- PickTask ---
  - method: GET
    path: "/pick-tasks"
    description: "List pick tasks; filterable (filtered-list reverse-reachability for order_id, lot_id, sku_id)"
    roles: [PickOperator, WavePlanner, PackStation]
    code: 200
    input: ["order_id?", "lot_id?", "sku_id?", "limit?", "offset?"]
    output: "PickTask[]"
    side_effects: []

  - method: GET
    path: "/pick-tasks/{pickTaskId}"
    description: "Get a pick task"
    roles: [PickOperator, WavePlanner, PackStation]
    code: 200
    input: []
    output: PickTask
    side_effects: []

  - method: POST
    path: "/clients/{clientId}/pick-tasks/{pickTaskId}/confirm"
    description: "Confirm a pick (records picked_qty)"
    roles: [PickOperator]
    code: 200
    input: ["picked_qty"]
    output: PickTask
    side_effects: ["picked_qty stored", "status ASSIGNED -> PICKED"]

  # --- Carton ---
  - method: GET
    path: "/cartons"
    description: "List cartons; filterable by order_id (filtered-list reverse-reachability for Carton.order_id)"
    roles: [PackStation, ShipStation, BillingClerk]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: "Carton[]"
    side_effects: []

  - method: GET
    path: "/cartons/{cartonId}"
    description: "Get a carton (includes fill_volume_cc, carton_size)"
    roles: [PackStation, ShipStation, BillingClerk]
    code: 200
    input: []
    output: Carton
    side_effects: []

  # --- Shipment ---
  - method: POST
    path: "/clients/{clientId}/shipments"
    description: "Rate-shop and purchase a label for a PACKED order"
    roles: [ShipStation]
    code: 201
    input: ["order_id", "force_carrier?"]
    output: Shipment
    side_effects: ["rate-shop selects carrier and quoted_cost_cents", "tracking_number minted", "status=LABELLED"]

  - method: GET
    path: "/shipments"
    description: "List shipments; filterable by order_id (filtered-list reverse-reachability for Shipment.order_id)"
    roles: [ShipStation, BillingClerk, ClientUser]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: "Shipment[]"
    side_effects: []

  - method: GET
    path: "/shipments/{shipmentId}"
    description: "Get a shipment (includes carrier, quoted_cost_cents, tracking_number)"
    roles: [ShipStation, BillingClerk, ClientUser]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: POST
    path: "/clients/{clientId}/shipments/{shipmentId}/deliver"
    description: "Mark a shipment delivered (order must be SHIPPED)"
    roles: [ShipStation]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status LABELLED -> DELIVERED"]

  - method: POST
    path: "/clients/{clientId}/shipments/{shipmentId}/void"
    description: "Void a label while the order is still PACKED"
    roles: [ShipStation]
    code: 200
    input: []
    output: Shipment
    side_effects: ["status LABELLED -> VOIDED"]

  # --- Return ---
  - method: POST
    path: "/clients/{clientId}/returns"
    description: "Open an RMA against a SHIPPED order"
    roles: [ReturnsClerk]
    code: 201
    input: ["order_id", "sku_id", "bin_id", "qty"]
    output: Return
    side_effects: ["status=REQUESTED"]

  - method: GET
    path: "/clients/{clientId}/returns"
    description: "List a client's returns; filterable by order_id (filtered-list reverse-reachability for Return.order_id)"
    roles: [ReturnsClerk, ClientUser, BillingClerk]
    code: 200
    input: ["order_id?", "sku_id?", "bin_id?", "limit?", "offset?"]
    output: "Return[]"
    side_effects: []

  - method: GET
    path: "/clients/{clientId}/returns/{returnId}"
    description: "Get a return"
    roles: [ReturnsClerk, ClientUser, BillingClerk]
    code: 200
    input: []
    output: Return
    side_effects: []

  - method: POST
    path: "/clients/{clientId}/returns/{returnId}/grade"
    description: "Grade a return; SELLABLE restocks to bin, DAMAGED scraps"
    roles: [ReturnsClerk]
    code: 200
    input: ["grade"]
    output: Return
    side_effects: ["grade set", "if SELLABLE: InventoryLot on_hand/available += qty (cascade Bin.occupied_cc)", "status REQUESTED -> GRADED"]

  - method: POST
    path: "/clients/{clientId}/returns/{returnId}/close"
    description: "Close a graded return"
    roles: [ReturnsClerk]
    code: 200
    input: []
    output: Return
    side_effects: ["status GRADED -> CLOSED"]

  # --- CycleCount ---
  - method: POST
    path: "/clients/{clientId}/cycle-counts"
    description: "Apply a cycle count to a lot with OCC on the lot version"
    roles: [ReceivingClerk]
    code: 201
    input: ["lot_id", "expected_lot_version", "counted_qty"]
    output: CycleCount
    side_effects:
      - "OCC: reject if expected_lot_version != lot.version (ERR_STALE_LOT_VERSION)"
      - "variance_qty computed; lot.on_hand_qty := counted_qty; available clamped; lot.version += 1 (cascade Bin.occupied_cc)"

  - method: GET
    path: "/cycle-counts"
    description: "List cycle counts; filterable by lot_id (filtered-list reverse-reachability for CycleCount.lot_id)"
    roles: [ReceivingClerk, BillingClerk]
    code: 200
    input: ["lot_id?", "limit?", "offset?"]
    output: "CycleCount[]"
    side_effects: []

  - method: GET
    path: "/cycle-counts/{cycleCountId}"
    description: "Get a cycle count (includes variance_qty)"
    roles: [ReceivingClerk, BillingClerk]
    code: 200
    input: []
    output: CycleCount
    side_effects: []

  # --- BillingCharge ---
  - method: POST
    path: "/clients/{clientId}/storage/accrue"
    description: "Run the per-pallet daily storage sweep, posting a STORAGE charge"
    roles: [BillingClerk]
    code: 201
    input: ["days"]
    output: BillingCharge
    side_effects: ["storage_charge computed", "STORAGE BillingCharge posted", "Client.storage_balance_cents += amount"]

  - method: GET
    path: "/clients/{clientId}/billing-charges"
    description: "List a client's billing charges; filterable by source_order_id (filtered-list reverse-reachability for BillingCharge.client_id and source_order_id)"
    roles: [BillingClerk, ClientUser]
    code: 200
    input: ["client_id?", "source_order_id?", "charge_type?", "limit?", "offset?"]
    output: "BillingCharge[]"
    side_effects: []

  - method: GET
    path: "/clients/{clientId}/billing-charges/{chargeId}"
    description: "Get a billing charge"
    roles: [BillingClerk, ClientUser]
    code: 200
    input: []
    output: BillingCharge
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-ID or X-User-Role header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum, or out-of-range numeric (e.g. expected_qty<=0, zone outside 1..8, empty lines)" }

  # --- Not Found ---
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "Client id in path not found" }
  - { id: ERR_SKU_NOT_FOUND, http: 404, condition: "SKU not found / not owned by client" }
  - { id: ERR_BIN_NOT_FOUND, http: 404, condition: "Bin not found" }
  - { id: ERR_LOT_NOT_FOUND, http: 404, condition: "InventoryLot not found" }
  - { id: ERR_RECEIPT_NOT_FOUND, http: 404, condition: "Receipt not found" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order not found" }
  - { id: ERR_WAVE_NOT_FOUND, http: 404, condition: "Wave not found" }
  - { id: ERR_PICK_TASK_NOT_FOUND, http: 404, condition: "PickTask not found" }
  - { id: ERR_CARTON_NOT_FOUND, http: 404, condition: "Carton not found" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "Shipment not found" }
  - { id: ERR_RETURN_NOT_FOUND, http: 404, condition: "Return not found" }
  - { id: ERR_CYCLE_COUNT_NOT_FOUND, http: 404, condition: "CycleCount not found" }
  - { id: ERR_CHARGE_NOT_FOUND, http: 404, condition: "BillingCharge not found" }

  # --- State ---
  - { id: ERR_RECEIPT_NOT_ANNOUNCED, http: 409, condition: "Receive/cancel requires receipt in ANNOUNCED" }
  - { id: ERR_RECEIPT_NOT_RECEIVED, http: 409, condition: "Putaway requires receipt in RECEIVED" }
  - { id: ERR_WAVE_NOT_BUILDING, http: 409, condition: "Add-order/release/cancel requires wave in BUILDING" }
  - { id: ERR_WAVE_EMPTY, http: 409, condition: "Release requires the wave to have >=1 member order" }
  - { id: ERR_ORDER_NOT_IMPORTED, http: 409, condition: "Add-order requires order in IMPORTED" }
  - { id: ERR_ORDER_NOT_PICKING, http: 409, condition: "Pack/short requires order in PICKING" }
  - { id: ERR_ORDER_NOT_PACKED, http: 409, condition: "Ship/void requires order in PACKED" }
  - { id: ERR_ORDER_NOT_SHIPPED, http: 409, condition: "Deliver/return requires order in SHIPPED" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "Cancel requires order in IMPORTED or RESERVED" }
  - { id: ERR_PICKS_INCOMPLETE, http: 409, condition: "Pack requires every PickTask PICKED" }
  - { id: ERR_NOT_SHORT, http: 409, condition: "Short requires at least one PickTask under-picked" }
  - { id: ERR_PICK_NOT_ASSIGNED, http: 409, condition: "Confirm requires pick task in ASSIGNED" }
  - { id: ERR_LABEL_REQUIRED, http: 409, condition: "Ship requires a LABELLED Shipment for the order" }
  - { id: ERR_SHIPMENT_NOT_LABELLED, http: 409, condition: "Deliver/void requires shipment in LABELLED" }
  - { id: ERR_RETURN_NOT_REQUESTED, http: 409, condition: "Grade requires return in REQUESTED" }
  - { id: ERR_RETURN_NOT_GRADED, http: 409, condition: "Close requires return in GRADED" }
  - { id: ERR_STALE_LOT_VERSION, http: 412, condition: "Cycle count expected_lot_version != live InventoryLot.version (OCC)" }

  # --- Business ---
  - { id: ERR_CLIENT_SUSPENDED, http: 409, condition: "New receipt/order on a SUSPENDED client" }
  - { id: ERR_SKU_DISCONTINUED, http: 409, condition: "New receipt on a DISCONTINUED SKU" }
  - { id: ERR_CLIENT_OWNERSHIP_MISMATCH, http: 409, condition: "Referenced SKU/lot/order not owned by the path client" }
  - { id: ERR_BIN_BLOCKED, http: 409, condition: "Putaway/pick/restock on a BLOCKED bin" }
  - { id: ERR_BIN_CAPACITY_EXCEEDED, http: 409, condition: "Putaway/restock would push occupied_cc above capacity_cc" }
  - { id: ERR_PALLET_OCCUPIED_BY_OTHER_CLIENT, http: 409, condition: "Putaway/restock of one client into a PALLET bin already holding another client's units" }
  - { id: ERR_PACK_UNIT_MISMATCH, http: 409, condition: "Submitted carton packed_units do not sum to total_units" }
  - { id: ERR_CARTON_OVERFLOW, http: 409, condition: "A carton's fill_volume_cc exceeds LARGE_INNER_CC" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "Wave release: an order line's qty exceeds available_qty for the client's SKU" }
  - { id: ERR_HAZMAT_CARRIER_FORBIDDEN, http: 409, condition: "force_carrier=GROUND_ECONOMY with a hazmat line SKU" }
  - { id: ERR_RETURN_QTY_EXCEEDS_SHIPPED, http: 409, condition: "Return qty exceeds units shipped for that SKU on the order" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: BillingClerk
    description: "Onboards clients, runs storage accrual, reads billing charges"
    identity: "opaque"
    exclusive_operations:
      - "POST /clients — onboard client"
      - "POST /clients/{id}/suspend — suspend client"
      - "POST /clients/{id}/storage/accrue — storage sweep"
    shared_operations:
      - "GET reads across clients, skus, bins, inventory-lots, orders, waves, cartons, shipments, returns, billing-charges, cycle-counts"

  - name: ClientUser
    description: "Acts as a client: onboards SKUs, imports/cancels orders"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /clients/{id}/skus — onboard SKU"
      - "POST /clients/{id}/skus/{id}/discontinue — discontinue SKU"
      - "POST /clients/{id}/orders — import order"
      - "POST /clients/{id}/orders/{id}/cancel — cancel order"
    shared_operations:
      - "GET reads scoped to own client resources"

  - name: ReceivingClerk
    description: "Manages bins, receipts, putaway, and cycle counts"
    identity: "opaque"
    exclusive_operations:
      - "POST /bins, POST /bins/{id}/block — bin admin"
      - "POST /clients/{id}/receipts (+ /receive,/putaway,/cancel) — receiving"
      - "POST /clients/{id}/cycle-counts — cycle count"
    shared_operations:
      - "GET reads across inventory, receipts, bins, skus"

  - name: WavePlanner
    description: "Builds, populates, releases, and cancels waves"
    identity: "opaque"
    exclusive_operations:
      - "POST /clients/{id}/waves (+ /add-order,/release,/cancel) — wave lifecycle"
    shared_operations:
      - "GET reads across waves, orders, pick-tasks, inventory, skus, bins"

  - name: PickOperator
    description: "Confirms picks and declares shorts"
    identity: "opaque"
    exclusive_operations:
      - "POST /clients/{id}/pick-tasks/{id}/confirm — confirm pick"
      - "POST /clients/{id}/orders/{id}/short — declare short"
    shared_operations:
      - "GET reads across pick-tasks, orders"

  - name: PackStation
    description: "Packs picked orders into cartons (cartonization)"
    identity: "opaque"
    exclusive_operations:
      - "POST /clients/{id}/orders/{id}/pack — pack/cartonize"
    shared_operations:
      - "GET reads across orders, cartons, pick-tasks"

  - name: ShipStation
    description: "Rate-shops, buys labels, ships, delivers, voids"
    identity: "opaque"
    exclusive_operations:
      - "POST /clients/{id}/shipments — rate-shop/label"
      - "POST /clients/{id}/orders/{id}/ship — ship"
      - "POST /clients/{id}/shipments/{id}/deliver — deliver"
      - "POST /clients/{id}/shipments/{id}/void — void label"
    shared_operations:
      - "GET reads across shipments, orders, cartons"

  - name: ReturnsClerk
    description: "Processes RMAs: request, grade, restock/scrap, close"
    identity: "opaque"
    exclusive_operations:
      - "POST /clients/{id}/returns (+ /grade,/close) — returns lifecycle"
    shared_operations:
      - "GET reads across returns, orders, skus, bins"
