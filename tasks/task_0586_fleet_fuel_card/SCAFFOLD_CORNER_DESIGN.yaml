scaffold_corner_design:

  # -------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_fleet_account_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.FleetAccount, endpoints.POST./fleet-accounts]
        distinguishing_aspect: "POST /fleet-accounts with all required fields returns 201; company_name and credit_limit_cents echo back, status defaults ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /fleet-accounts"
              payload: { company_name: "New Co", base_jurisdiction: "CA", credit_limit_cents: 500000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
          assert:
            - "response.status == 201"
            - "FleetAccount.${fa_id}.status == ACTIVE"
            - "FleetAccount.${fa_id}.credit_limit_cents == 500000"

      - name: fresh_account_available_credit_equals_limit
        claim_type: Computed Fields
        grounds: [entities.FleetAccount.fields.available_credit_cents, calculations.credit_ledger]
        distinguishing_aspect: "On a fresh account with no transactions, available_credit_cents == credit_limit_cents and outstanding_holds_cents == 0."
        test_recipe:
          setup: ["One fleet account, credit_limit 500000, no transactions."]
          setup_api_calls:
            - call: "POST /fleet-accounts"
              payload: { company_name: "Ledger Co", base_jurisdiction: "CA", credit_limit_cents: 500000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
          trigger:
            - call: "GET /fleet-accounts/${fa_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "FleetAccount.${fa_id}.available_credit_cents == 500000"
            - "FleetAccount.${fa_id}.outstanding_holds_cents == 0"

      - name: card_default_hours_applied
        claim_type: Defaults
        grounds: [entities.FuelCard.fields.allowed_start_hour, entities.FuelCard.fields.allowed_end_hour]
        distinguishing_aspect: "Issuing a card without allowed_start_hour/allowed_end_hour applies defaults 0 and 24."
        test_recipe:
          setup: ["One fleet account."]
          setup_api_calls:
            - call: "POST /fleet-accounts"
              payload: { company_name: "Def Co", base_jurisdiction: "CA", credit_limit_cents: 500000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
          trigger:
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "0400", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000, per_txn_gallon_limit: 100 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
          assert:
            - "FuelCard.${card_id}.allowed_start_hour == 0"
            - "FuelCard.${card_id}.allowed_end_hour == 24"
            - "FuelCard.${card_id}.status == ISSUED"

      - name: vehicle_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.Vehicle.fields.tank_capacity_gallons, endpoints.POST./vehicles]
        distinguishing_aspect: "POST /vehicles omitting tank_capacity_gallons returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One fleet account."]
          setup_api_calls:
            - call: "POST /fleet-accounts"
              payload: { company_name: "Req Co", base_jurisdiction: "CA", credit_limit_cents: 500000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "VX", expected_mpg_min: 3, expected_mpg_max: 12, home_jurisdiction: "CA" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: vehicle_bad_fleet_fk_not_found
        claim_type: Parent Relationships
        grounds: [entities.Vehicle.fields.fleet_account_id, "errors[ERR_FLEET_ACCOUNT_NOT_FOUND]"]
        distinguishing_aspect: "POST /vehicles referencing a non-existent fleet_account_id returns ERR_FLEET_ACCOUNT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vehicles"
              payload: { fleet_account_id: "00000000-0000-4000-8000-000000000000", plate: "VY", tank_capacity_gallons: 5000, expected_mpg_min: 3, expected_mpg_max: 12, home_jurisdiction: "CA" }
              as: FleetManager
              as_user_id: "00000000-0000-4000-8000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_FLEET_ACCOUNT_NOT_FOUND"

      - name: vehicle_not_found_on_get
        claim_type: Not Found
        grounds: ["errors[ERR_VEHICLE_NOT_FOUND]", "endpoints.GET./vehicles/{id}"]
        distinguishing_aspect: "GET /vehicles/{unknown} returns ERR_VEHICLE_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /vehicles/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_VEHICLE_NOT_FOUND"

      - name: card_invalid_product_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.FuelCard.fields.allowed_products, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Issuing a card with an unknown product enum in allowed_products returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["One fleet account."]
          setup_api_calls:
            - call: "POST /fleet-accounts"
              payload: { company_name: "Enum Co", base_jurisdiction: "CA", credit_limit_cents: 500000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
          trigger:
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "0401", allowed_products: ["KEROSENE"], daily_dollar_limit_cents: 100000, per_txn_gallon_limit: 100 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

  # -------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: capture_already_settled_transaction_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Transaction.CAPTURED_to_SETTLED, "errors[ERR_INVALID_TXN_STATE]"]
        distinguishing_aspect: "capture on a SETTLED transaction returns ERR_INVALID_TXN_STATE (409); no side effects fire."
        test_recipe:
          setup: ["Fleet, vehicle, active card+assignment; one transaction authorized->captured->settled."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Inv Txn Co", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "VS1", tank_capacity_gallons: 5000, expected_mpg_min: 1, expected_mpg_max: 50, home_jurisdiction: "CA", starting_odometer: 0 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /drivers"
              payload: { fleet_account_id: "${fa_id}", full_name: "Tim", pin: "1818" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "0500", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
              payload: { card_id: "${card_id}", vehicle_id: "${veh_id}", driver_id: "${drv_id}", effective_from: "2026-06-01T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 100, unit_price_cents: 400, odometer: 100, jurisdiction: "CA" }
              as: Merchant
              captures: { tx_id: $.data.id }
            - call: "POST /transactions/${tx_id}/capture"
              payload: {}
              as: Merchant
            - call: "POST /transactions/${tx_id}/settle"
              payload: {}
              as: Merchant
          trigger:
            - call: "POST /transactions/${tx_id}/capture"
              payload: {}
              as: Merchant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_TXN_STATE"

      - name: activate_cancelled_card_rejected_terminal
        claim_type: Terminal State Lockdown
        grounds: [state_machines.FuelCard.terminal_states, "errors[ERR_INVALID_CARD_STATE]"]
        distinguishing_aspect: "activate on a CANCELLED (terminal) card returns ERR_INVALID_CARD_STATE (409)."
        test_recipe:
          setup: ["Fleet; a card cancelled from ISSUED."]
          setup_api_calls:
            - call: "POST /fleet-accounts"
              payload: { company_name: "Term Co", base_jurisdiction: "CA", credit_limit_cents: 500000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "0501", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000, per_txn_gallon_limit: 100 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/cancel"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
          trigger:
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_CARD_STATE"

      - name: dismiss_open_alert_rejected_idempotency
        claim_type: Idempotency
        grounds: [state_machines.FraudAlert.INVESTIGATING_to_DISMISSED, "errors[ERR_INVALID_ALERT_STATE]"]
        distinguishing_aspect: "dismiss on an OPEN alert (not yet INVESTIGATING) returns ERR_INVALID_ALERT_STATE (409)."
        test_recipe:
          setup: ["Fleet, vehicle tank 100, active card+assignment; over-tank authorize creates an OPEN alert."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Alert Co", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "VS2", tank_capacity_gallons: 100, expected_mpg_min: 1, expected_mpg_max: 50, home_jurisdiction: "CA", starting_odometer: 0 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /drivers"
              payload: { fleet_account_id: "${fa_id}", full_name: "Uma", pin: "1919" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "0502", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
              payload: { card_id: "${card_id}", vehicle_id: "${veh_id}", driver_id: "${drv_id}", effective_from: "2026-06-01T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 200, unit_price_cents: 400, odometer: 100, jurisdiction: "CA" }
              as: Merchant
              captures: { tx_id: $.data.id }
            - call: "GET /fraud-alerts"
              payload: { transaction_id: "${tx_id}" }
              as: FraudAnalyst
              captures: { alert_id: "$.data[0].id" }
          trigger:
            - call: "POST /fraud-alerts/${alert_id}/dismiss"
              payload: { resolution_note: "premature" }
              as: FraudAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_ALERT_STATE"

      - name: new_card_initial_state_issued
        claim_type: Initial State
        grounds: [state_machines.FuelCard.initial_state]
        distinguishing_aspect: "A newly issued card starts in status ISSUED with version 1."
        test_recipe:
          setup: ["One fleet account."]
          setup_api_calls:
            - call: "POST /fleet-accounts"
              payload: { company_name: "Init Co", base_jurisdiction: "CA", credit_limit_cents: 500000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
          trigger:
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "0503", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000, per_txn_gallon_limit: 100 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
          assert:
            - "FuelCard.${card_id}.status == ISSUED"
            - "FuelCard.${card_id}.version == 1"

      - name: fraud_confirm_cascade_side_effects
        claim_type: Side Effect Execution
        grounds: [state_machines.FuelCard.ACTIVE_to_SUSPENDED, state_machines.Transaction.CAPTURED_to_VOIDED]
        excluded_because:
          difficulty_instance: transitive_cascade / fraud_confirm_cascades_card_txn_ledger_depth3
          rationale: "The full FraudAlert->FuelCard->Transaction->FleetAccount cascade and its side effects are asserted by that §1.8 instance."

  # -------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: gross_amount_computed_from_gallons_and_price
        claim_type: Correct Result
        grounds: [entities.Transaction.fields.gross_amount_cents]
        distinguishing_aspect: "authorize gallons 10 @ unit_price_cents 431 -> gross_amount_cents == round_half_up(10*431) == 4310."
        test_recipe:
          setup: ["Fleet, vehicle, active card+assignment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Gross Co", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "VG", tank_capacity_gallons: 5000, expected_mpg_min: 1, expected_mpg_max: 50, home_jurisdiction: "CA", starting_odometer: 0 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /drivers"
              payload: { fleet_account_id: "${fa_id}", full_name: "Van", pin: "2020" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "0600", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
              payload: { card_id: "${card_id}", vehicle_id: "${veh_id}", driver_id: "${drv_id}", effective_from: "2026-06-01T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
          trigger:
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 10, unit_price_cents: 431, odometer: 50, jurisdiction: "CA" }
              as: Merchant
              captures: { tx_id: $.data.id }
          assert:
            - "Transaction.${tx_id}.gross_amount_cents == 4310"
            - "Transaction.${tx_id}.hold_amount_cents == 4310"

      - name: mpg_exception_flag_below_band
        claim_type: Correct Result
        grounds: [entities.Transaction.fields.mpg_exception, entities.Transaction.fields.mpg_snapshot]
        distinguishing_aspect: "segment mpg 1.0 (100 mi / 100 gal) below expected_mpg_min 3 sets mpg_exception == true."
        test_recipe:
          setup: ["Fleet, vehicle start odo 0 expected band 3..12, active card+assignment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Exc Co", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "VH", tank_capacity_gallons: 5000, expected_mpg_min: 3, expected_mpg_max: 12, home_jurisdiction: "CA", starting_odometer: 0 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /drivers"
              payload: { fleet_account_id: "${fa_id}", full_name: "Wes", pin: "2121" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "0601", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
              payload: { card_id: "${card_id}", vehicle_id: "${veh_id}", driver_id: "${drv_id}", effective_from: "2026-06-01T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
          trigger:
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 100, unit_price_cents: 400, odometer: 100, jurisdiction: "CA" }
              as: Merchant
              captures: { tx_id: $.data.id }
          assert:
            - "Transaction.${tx_id}.mpg_snapshot == 1.0"
            - "Transaction.${tx_id}.mpg_exception == true"

      - name: rebate_variant_divergence
        claim_type: Variant Divergence
        grounds: [calculations.provisional_final_rebate]
        excluded_because:
          difficulty_instance: dual_variant_calc / rebate_provisional_vs_final_diverges_on_transaction
          rationale: "Provisional-vs-final divergence (4000 vs 6400) is asserted by that §1.8 instance."

  # -------------------------------------------------------------------------
  - section: validations
    instances:
      - name: outside_allowed_hours_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=9]", "errors[ERR_OUTSIDE_ALLOWED_HOURS]"]
        distinguishing_aspect: "Card window [6,18); clock at 03:00 UTC -> authorize returns ERR_OUTSIDE_ALLOWED_HOURS (422)."
        test_recipe:
          setup: ["Fleet, vehicle, card window [6,18) active+assignment; clock 2026-06-01T03:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T03:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Hours Co", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "VI", tank_capacity_gallons: 5000, expected_mpg_min: 1, expected_mpg_max: 50, home_jurisdiction: "CA", starting_odometer: 0 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /drivers"
              payload: { fleet_account_id: "${fa_id}", full_name: "Xan", pin: "2222" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "0700", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000, allowed_start_hour: 6, allowed_end_hour: 18 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
              payload: { card_id: "${card_id}", vehicle_id: "${veh_id}", driver_id: "${drv_id}", effective_from: "2026-06-01T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
          trigger:
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 10, unit_price_cents: 400, odometer: 10, jurisdiction: "CA" }
              as: Merchant
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_OUTSIDE_ALLOWED_HOURS"

      - name: product_not_allowed_with_valid_assignment
        claim_type: Violation → Error
        grounds: ["validations[priority=8]", "errors[ERR_PRODUCT_NOT_ALLOWED]"]
        distinguishing_aspect: "With a valid ACTIVE assignment present, authorizing UNLEADED on a DIESEL-only card returns ERR_PRODUCT_NOT_ALLOWED (422) — the safety check reached because referential passes."
        test_recipe:
          setup: ["Fleet, vehicle, DIESEL-only active card+assignment."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Prod Co", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "VJ", tank_capacity_gallons: 5000, expected_mpg_min: 1, expected_mpg_max: 50, home_jurisdiction: "CA", starting_odometer: 0 }
              as: FleetManager
              as_user_id: "${fa_id}"
