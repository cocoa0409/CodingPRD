            - call: "POST /power-rental/rental-contracts/${con_id}/start-rental"
              payload: {}
              as: DepotManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /power-rental/rental-contracts/${con_id}/off-hire"
              payload: {}
              as: SalesEngineer
            - call: "GET /power-rental/equipment-units/${unit_id}"
              payload: {}
              as: DepotManager
              captures: { st_offrent: $.data.status }
            - call: "POST /power-rental/rental-lines/${line_id}/return"
              payload: {}
              as: DepotManager
            - call: "GET /power-rental/equipment-units/${unit_id}"
              payload: {}
              as: DepotManager
              captures: { st_maint: $.data.status }
            - call: "POST /power-rental/equipment-units/${unit_id}/complete-maintenance"
              payload: {}
              as: DepotManager
              captures: { st_avail: $.data.status }
          assert:
            - "after line add: U1 status == RESERVED"
            - "after start-rental cascade: U1 status == DEPLOYED (observed via GET before off-hire)"
            - "after off-hire cascade: U1 status == OFF_RENT and current_site_id == null"
            - "after line return: U1 status == MAINTENANCE"
            - "after complete-maintenance: U1 status == AVAILABLE (full cycle closed)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (spill depth-3 vs off-hire depth-2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: spill_report_cascades_quarantine_suspend_cancel
        grounds:
          - state_machines.EquipmentUnit.DEPLOYED_to_QUARANTINED
          - state_machines.RentalContract.ON_RENT_to_SUSPENDED
          - state_machines.ServiceVisit.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain triggered by incident creation: Incident(SPILL) ->
          EquipmentUnit DEPLOYED->QUARANTINED (link 1) -> RentalContract
          ON_RENT->SUSPENDED (link 2, caused by the unit quarantine) ->
          ServiceVisit SCHEDULED->CANCELLED (link 3, caused by the suspension).
        test_recipe:
          setup:
            - "Customer C1, Site S1 (TX-TCEQ), Unit U1 deployed on contract K1 (ON_RENT, window 2026-09-01..2026-09-15)"
            - "ServiceVisit V1 (TECHNICIAN, tech-1, 2026-09-10T10:00-11:00) SCHEDULED on K1; clock at 2026-09-03"
          setup_api_calls:
            - call: "POST /power-rental/customers"
              payload: { name: "Acme Construction", billing_email: "ap@acme.example" }
              as: SalesEngineer
              captures: { cust_id: $.data.id }
            - call: "POST /power-rental/sites"
              payload: { customer_id: "${cust_id}", name: "Houston Yard", jurisdiction_code: "TX-TCEQ", fuel_tank_capacity_liters: 5000 }
