# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# task_3480_federal_water_project_contract_allocation_reservoir_operation
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and ships a verbatim
# transcribable test_recipe. Anchors (&k_*) are defined once in the first
# instance and reused; each instance's chain is self-contained from empty-DB.
#
# Shared fixture arithmetic (small reservoir: storage 10,500, dead 5,000,
# flood max 20,000 -> holdback 2,000 in flood months; usable = 5,500):
#   snow 80 + runoff 5,000  -> F_adj 4,000 -> declared 7,500 (ratio 0.75 NONE)
#   snow 80 + runoff 4,999  -> F_adj 3,999 -> declared 7,499 (ratio 0.7499 TIER_1)
#   snow 50 + runoff 3,000  -> F_adj 1,500 -> declared 5,000 (ratio 0.50 TIER_1)
#   snow 80 + runoff 4,000  -> F_adj 3,200 -> declared 6,700 (ratio 0.67 TIER_1)
# Waterfall at declared 7,500: SR 6,000 / JR 1,500. At 5,000: SR 5,000 / JR 0.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: alloc_waterfall_vs_sharing_dual_basis
        grounds:
          - calculations.priority_waterfall_allocation
          - calculations.shortage_sharing_allocation
          - entities.AllocationLine.fields.allocated_af
          - state_machines.ShortageAgreement.RATIFIED_to_ACTIVATED
        distinguishing_aspect: |
          Dual variant on the AllocationLine domain: identical inputs (same year,
          same two contracts, same declared_supply_af 5,000) produce SR 5,000/JR 0
          under PRIORITY_WATERFALL but SR 4,200/JR 800 after SHORTAGE_SHARING
          activation — the two bases diverge on the same data.
        test_recipe:
          setup:
            - "Logical clock 2027-01-15 (flood month). Small reservoir (storage 10,500). Districts SR/JR with contracts C-100 SENIOR 6,000af and C-200 JUNIOR 4,000af. Water year 2027 with snowpack 50 and runoff forecast 3,000 -> declared supply 5,000, tier TIER_1. Announcement published PRIORITY_WATERFALL."
          setup_api_calls:
            - &k_clock_oct
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: SystemAdmin
            - &k_res_small
              call: "POST /water/reservoirs"
              payload: { name: "Shasta Unit", capacity_af: 50000, dead_pool_af: 5000, flood_control_max_storage_af: 20000, initial_storage_af: 10500, outlet_capacity_cfs: 15000, power_conversion_mwh_per_af: 0.5 }
              as: SystemAdmin
              captures: { res_id: $.data.id }
            - &k_d_sr
              call: "POST /water/districts"
              payload: { name: "Senior Irrigation District", service_area_acres: 42000, contact_email: "ops@senior.example" }
              as: SystemAdmin
              captures: { d_sr: $.data.id }
            - &k_d_jr
              call: "POST /water/districts"
              payload: { name: "Junior Water District", service_area_acres: 18000, contact_email: "ops@junior.example" }
              as: SystemAdmin
              captures: { d_jr: $.data.id }
            - &k_d_tp
              call: "POST /water/districts"
              payload: { name: "Third Party District", service_area_acres: 9000, contact_email: "ops@third.example" }
              as: SystemAdmin
              captures: { d_tp: $.data.id }
            - &k_c_sr
              call: "POST /water/contracts"
              payload: { district_id: "${d_sr}", contract_number: "C-100", priority_class: "SENIOR", max_annual_quantity_af: 6000, repayment_obligation_cents: 120000000 }
              as: SystemAdmin
              captures: { c_sr: $.data.id }
            - &k_c_jr
              call: "POST /water/contracts"
              payload: { district_id: "${d_jr}", contract_number: "C-200", priority_class: "JUNIOR", max_annual_quantity_af: 4000, repayment_obligation_cents: 80000000 }
              as: SystemAdmin
              captures: { c_jr: $.data.id }
            - &k_wy
              call: "POST /water/water-years"
              payload: { label: 2027, season_start: "2026-10-01T00:00:00Z", season_end: "2027-09-30T00:00:00Z" }
              as: ReclamationOperator
              captures: { wy_id: $.data.id, wy_v: $.data.version }
            - &k_clock_jan
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-15T00:00:00Z" }
              as: SystemAdmin
            - &k_obs_snow50
              call: "POST /water/water-years/${wy_id}/hydrology-observations"
              payload: { observation_type: "SNOWPACK_INDEX", value: 50, observed_on: "2027-01-10T00:00:00Z" }
              as: HydrologyOfficer
            - &k_obs_run3000
              call: "POST /water/water-years/${wy_id}/hydrology-observations"
              payload: { observation_type: "RUNOFF_FORECAST_AF", value: 3000, observed_on: "2027-01-10T00:00:00Z" }
              as: HydrologyOfficer
            - &k_ann1_create
              call: "POST /water/water-years/${wy_id}/allocation-announcements"
              payload: { expected_water_year_version: "${wy_v}" }
              as: ReclamationOperator
              captures: { ann1_id: $.data.id }
            - &k_ann1_publish
              call: "POST /water/allocation-announcements/${ann1_id}/publish"
              payload: {}
              as: ReclamationOperator
              captures: { ann1_declared: $.data.declared_supply_af }
            - &k_ln_sr_waterfall
              call: "GET /water/allocation-lines"
              payload: { announcement_id: "${ann1_id}", contract_id: "${c_sr}" }
              as: ReclamationOperator
              captures: { ln_sr: "$.data[0].id" }
            - &k_ln_jr_waterfall
              call: "GET /water/allocation-lines"
              payload: { announcement_id: "${ann1_id}", contract_id: "${c_jr}" }
              as: ReclamationOperator
              captures: { ln_jr: "$.data[0].id" }
            - &k_agree
              call: "POST /water/shortage-agreements"
              payload: { name: "Drought Plan 2027", tier_1_senior_pct: 70, tier_1_junior_pct: 40, tier_2_senior_pct: 55, tier_2_junior_pct: 25, quorum_district_count: 2 }
              as: ReclamationOperator
              captures: { ag_id: $.data.id }
            - &k_ratify_sr
              call: "POST /water/shortage-agreements/${ag_id}/ratify"
              payload: {}
              as: DistrictManager
              as_user_id: "${d_sr}"
            - &k_ratify_jr
              call: "POST /water/shortage-agreements/${ag_id}/ratify"
              payload: {}
              as: DistrictManager
              as_user_id: "${d_jr}"
          trigger:
            - &k_activate_ag
              call: "POST /water/shortage-agreements/${ag_id}/activate"
              payload: { water_year_label: 2027 }
              as: RegionalDirector
          assert:
            - "before activation: AllocationLine.${ln_sr}.allocated_af == 5000 and AllocationLine.${ln_jr}.allocated_af == 0 (strict priority waterfall)"
            - "announcement ${ann1_id}.declared_supply_af == 5000 and shortage_tier == TIER_1 both before and after activation"
            - "after activation: AllocationLine.${ln_sr}.allocated_af == 4200 (round(6000*0.70)) and AllocationLine.${ln_jr}.allocated_af == 800 (raw 1600 capped by 800 excess)"
            - "AllocationLine.${ln_sr}.allocated_af after != its waterfall value 5000, and AllocationLine.${ln_jr}.allocated_af after != its waterfall value 0 — same inputs, two bases, different results"
            - "announcement ${ann1_id}.allocation_basis == SHORTAGE_SHARING"

      - name: revenue_projected_vs_settled_divergence
        grounds:
          - calculations.hydropower_revenue
          - entities.RevenuePeriod.fields.projected_revenue_cents
          - entities.RevenuePeriod.fields.settled_revenue_cents
          - state_machines.RevenuePeriod.PROJECTED_to_SETTLED
        distinguishing_aspect: |
          Dual variant on the RevenuePeriod domain (different entity domain from
          AllocationLine): same month, same two releases — projected includes the
          still-SCHEDULED release (11,901.0 MWh -> 53,554,500 cents) while settled
          excludes it (9,917.5 MWh -> 44,628,750 cents).
        test_recipe:
          setup:
            - "Logical clock 2027-01-15. Big reservoir (storage 3,000,000, conversion 0.5 MWh/af). Contracts C-100/C-200. Release R1 1,000 cfs x 10 days starting 2027-02-01 (volume 19,835 af) EXECUTED; release R2 500 cfs x 4 days starting 2027-02-20 (volume 3,967 af) still SCHEDULED."
          setup_api_calls:
            - *k_clock_oct
            - &k_res_big
              call: "POST /water/reservoirs"
              payload: { name: "Shasta Unit", capacity_af: 4552000, dead_pool_af: 200000, flood_control_max_storage_af: 3600000, initial_storage_af: 3000000, outlet_capacity_cfs: 15000, power_conversion_mwh_per_af: 0.5 }
              as: SystemAdmin
              captures: { res_id: $.data.id }
            - *k_d_sr
            - *k_d_jr
            - *k_c_sr
            - *k_c_jr
            - &k_rel_r1
              call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "POWER", release_cfs: 1000, duration_days: 10, scheduled_start: "2027-02-01T00:00:00Z" }
              as: ReclamationOperator
              captures: { r1_id: $.data.id }
            - &k_rel_r2
              call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "POWER", release_cfs: 500, duration_days: 4, scheduled_start: "2027-02-20T00:00:00Z" }
              as: ReclamationOperator
              captures: { r2_id: $.data.id }
            - &k_clock_feb05
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-05T00:00:00Z" }
              as: SystemAdmin
            - &k_exec_r1
              call: "POST /water/release-orders/${r1_id}/execute"
              payload: {}
              as: ReclamationOperator
            - &k_period_feb
              call: "POST /water/revenue-periods"
              payload: { reservoir_id: "${res_id}", period_month: "2027-02", rate_cents_per_mwh: 4500 }
              as: FinanceOfficer
              captures: { per_id: $.data.id }
          trigger:
            - &k_settle_feb
              call: "POST /water/revenue-periods/${per_id}/settle"
              payload: {}
              as: FinanceOfficer
              captures: { per_settled: $.data.settled_revenue_cents }
          assert:
            - "RevenuePeriod.${per_id}.projected_mwh == 11901.0 and projected_revenue_cents == 53554500 (includes SCHEDULED R2: (19835+3967)*0.5*4500)"
            - "after settle: RevenuePeriod.${per_id}.settled_mwh == 9917.5 and settled_revenue_cents == 44628750 (EXECUTED R1 only: 19835*0.5*4500)"
            - "RevenuePeriod.${per_id}.projected_revenue_cents != RevenuePeriod.${per_id}.settled_revenue_cents — same month, same releases, input-set filtering drives the delta"
            - "ReleaseOrder.${r2_id}.status is still SCHEDULED at settle time"
            - "RevenuePeriod.${per_id}.status == SETTLED"

  - rule_id: combinatorial_formula
    instances:
      - name: supply_minmax_flood_holdback
        grounds:
          - calculations.forecast_declared_supply
          - entities.AllocationAnnouncement.fields.declared_supply_af
        distinguishing_aspect: |
          Mode (a) combinatorial: five inputs (runoff forecast, snowpack index,
          current storage, dead pool, flood holdback) interact through nested
          max/min plus a flood-month conditional branch — the SAME observations
          yield declared 7,500 in January (holdback 2,000 applies) but 9,500 when
          published in April (holdback branch off).
        test_recipe:
          setup:
            - "Small reservoir (storage 10,500). Contracts C-100/C-200. Year 2027 with snowpack 80 and runoff forecast 5,000. First publish at clock 2027-01-15 (flood month)."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_small
            - *k_d_sr
            - *k_d_jr
            - *k_c_sr
            - *k_c_jr
            - *k_wy
            - *k_clock_jan
            - &k_obs_snow80
              call: "POST /water/water-years/${wy_id}/hydrology-observations"
              payload: { observation_type: "SNOWPACK_INDEX", value: 80, observed_on: "2027-01-10T00:00:00Z" }
              as: HydrologyOfficer
            - &k_obs_run5000
              call: "POST /water/water-years/${wy_id}/hydrology-observations"
              payload: { observation_type: "RUNOFF_FORECAST_AF", value: 5000, observed_on: "2027-01-10T00:00:00Z" }
              as: HydrologyOfficer
            - *k_ann1_create
            - *k_ann1_publish
            - &k_get_wy_v2
              call: "GET /water/water-years/${wy_id}"
              payload: {}
              as: ReclamationOperator
              captures: { wy_v2: $.data.version }
            - &k_clock_apr
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-04-01T00:00:00Z" }
              as: SystemAdmin
            - &k_ann2_create
              call: "POST /water/water-years/${wy_id}/allocation-announcements"
              payload: { expected_water_year_version: "${wy_v2}" }
              as: ReclamationOperator
              captures: { ann2_id: $.data.id }
          trigger:
            - &k_ann2_publish
              call: "POST /water/allocation-announcements/${ann2_id}/publish"
              payload: {}
              as: ReclamationOperator
              captures: { ann2_declared: $.data.declared_supply_af }
          assert:
            - "AllocationAnnouncement.${ann1_id}.declared_supply_af == 7500 (max(0, min-chain: usable 5500 + round(5000*80/100) - holdback 2000))"
            - "AllocationAnnouncement.${ann2_id}.declared_supply_af == 9500 (identical observations, April publish -> holdback branch off: 5500 + 4000 - 0)"
            - "the 2,000 delta between the two publishes is attributable solely to the FLOOD_MONTHS conditional, not to any input change"
            - "AllocationAnnouncement.${ann1_id}.status == SUPERSEDED and ${ann2_id}.status == PUBLISHED"

      - name: per_release_rounding_order
        grounds:
          - calculations.release_volume_af
          - calculations.hydropower_revenue
          - entities.ReleaseOrder.fields.volume_af
        distinguishing_aspect: |
          Mode (b) nested rounding: per-release volume rounding BEFORE summation is
          pinned. Two 333 cfs x 1 day releases each round 660.5055 -> 661 af, so the
          period volume is 1,322 af and 661.0 MWh; the forbidden sum-then-round order
          would give round(666*1.9835)=1,321 af and 660.5 MWh — the order flips the result.
        test_recipe:
          setup:
            - "Big reservoir. Contracts C-100/C-200 exist. Two releases R3 and R4 of exactly 333 cfs x 1 day in February 2027, both EXECUTED inside their windows."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_big
            - *k_d_sr
            - *k_d_jr
            - *k_c_sr
            - *k_c_jr
            - &k_rel_r3
              call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "POWER", release_cfs: 333, duration_days: 1, scheduled_start: "2027-02-01T00:00:00Z" }
              as: ReclamationOperator
              captures: { r3_id: $.data.id }
            - &k_rel_r4
              call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "POWER", release_cfs: 333, duration_days: 1, scheduled_start: "2027-02-03T00:00:00Z" }
              as: ReclamationOperator
              captures: { r4_id: $.data.id }
            - &k_clock_feb01_noon
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T12:00:00Z" }
              as: SystemAdmin
            - call: "POST /water/release-orders/${r3_id}/execute"
              payload: {}
              as: ReclamationOperator
            - &k_clock_feb03_10
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-03T10:00:00Z" }
              as: SystemAdmin
            - call: "POST /water/release-orders/${r4_id}/execute"
              payload: {}
              as: ReclamationOperator
            - &k_period_feb_r100
              call: "POST /water/revenue-periods"
              payload: { reservoir_id: "${res_id}", period_month: "2027-02", rate_cents_per_mwh: 100 }
              as: FinanceOfficer
              captures: { per2_id: $.data.id }
          trigger:
            - call: "POST /water/revenue-periods/${per2_id}/settle"
              payload: {}
              as: FinanceOfficer
          assert:
            - "ReleaseOrder.${r3_id}.volume_af == 661 and ReleaseOrder.${r4_id}.volume_af == 661 (round_half_up(333*1*1.9835)=round_half_up(660.5055))"
            - "RevenuePeriod.${per2_id}.settled_mwh == 661.0 (per-release-then-sum: (661+661)*0.5)"
            - "RevenuePeriod.${per2_id}.settled_mwh != 660.5 (the sum-then-round order on raw cfs-days is forbidden)"
            - "RevenuePeriod.${per2_id}.settled_revenue_cents == 66100"

      - name: tier_share_cap_evaluation_order
        grounds:
          - calculations.shortage_sharing_allocation
          - calculations.shortage_tier_classification
        distinguishing_aspect: |
          Mode (c) circular-looking dependency pinned by evaluation order: tier needs
          declared supply, sharing percentages are selected BY tier, and the cap step
          needs both. Pinned order supply -> tier -> per-contract rounded shares ->
          junior-only cap yields SR 4,200 (uncapped, seniors never reduced) and
          JR 800 (1,600 raw minus the full 800 excess); any other order misallocates.
        test_recipe:
          setup:
            - "Identical fixture to alloc_waterfall_vs_sharing_dual_basis: declared 5,000, tier TIER_1, agreement 70/40/55/25 ratified by both districts."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_small
            - *k_d_sr
            - *k_d_jr
            - *k_d_tp
            - *k_c_sr
            - *k_c_jr
            - *k_wy
            - *k_clock_jan
            - *k_obs_snow50
            - *k_obs_run3000
            - *k_ann1_create
            - *k_ann1_publish
            - *k_agree
            - *k_ratify_sr
            - *k_ratify_jr
          trigger:
            - *k_activate_ag
            - call: "GET /water/allocation-lines"
              payload: { announcement_id: "${ann1_id}", contract_id: "${c_sr}" }
              as: ReclamationOperator
              captures: { ln_sr2: "$.data[0].id" }
            - call: "GET /water/allocation-lines"
              payload: { announcement_id: "${ann1_id}", contract_id: "${c_jr}" }
              as: ReclamationOperator
              captures: { ln_jr2: "$.data[0].id" }
          assert:
            - "AllocationLine.${ln_sr2}.allocated_af == 4200 — senior share round_half_up(6000*0.70) is computed BEFORE the cap and never reduced"
            - "AllocationLine.${ln_jr2}.allocated_af == 800 — junior raw share 1,600 absorbs exactly the total excess 800 (5,800 - 5,000)"
            - "AllocationAnnouncement.${ann1_id}.shortage_tier is still TIER_1 — the cap step does NOT feed back into tier classification"
            - "AllocationAnnouncement.${ann1_id}.declared_supply_af is still 5000 — the cap consumes supply, it does not recompute it"

  - rule_id: non_linear_state_machine
    instances:
      - name: transfer_revision_cycle_bounded
        grounds:
          - state_machines.TransferRequest.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.TransferRequest.REVISION_REQUESTED_to_UNDER_REVIEW
          - entities.TransferRequest.fields.revision_count
          - errors.ERR_REVISION_LIMIT_EXCEEDED
        distinguishing_aspect: |
          Cyclic machine on TransferRequest: UNDER_REVIEW -> REVISION_REQUESTED ->
          UNDER_REVIEW loops exactly three times (revision_count 1,2,3); the fourth
          REQUEST_REVISION is rejected with ERR_REVISION_LIMIT_EXCEEDED while REJECT
          still succeeds — the cycle is bounded, not free.
        test_recipe:
          setup:
            - "Small-reservoir announced fixture: declared 7,500, SR 6,000 / JR 1,500. Transfer of 1,000 af SR->JR created, status UNDER_REVIEW."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_small
            - *k_d_sr
            - *k_d_jr
            - *k_d_tp
            - *k_c_sr
            - *k_c_jr
            - *k_wy
            - *k_clock_jan
            - *k_obs_snow80
            - *k_obs_run5000
            - *k_ann1_create
            - *k_ann1_publish
            - &k_tr_create
              call: "POST /water/transfer-requests"
              payload: { from_contract_id: "${c_sr}", to_contract_id: "${c_jr}", water_year_id: "${wy_id}", quantity_af: 1000, price_cents: 50000 }
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { tr_id: $.data.id }
            - &k_tr_rev1
              call: "POST /water/transfer-requests/${tr_id}/decide"
              payload: { decision: "REQUEST_REVISION", rationale: "too much" }
              as: RegionalDirector
            - &k_tr_resub1
              call: "POST /water/transfer-requests/${tr_id}/resubmit"
              payload: { quantity_af: 900 }
              as: DistrictManager
              as_user_id: "${d_sr}"
            - &k_tr_rev2
              call: "POST /water/transfer-requests/${tr_id}/decide"
              payload: { decision: "REQUEST_REVISION" }
              as: RegionalDirector
            - &k_tr_resub2
              call: "POST /water/transfer-requests/${tr_id}/resubmit"
              payload: { quantity_af: 800 }
              as: DistrictManager
              as_user_id: "${d_sr}"
            - &k_tr_rev3
              call: "POST /water/transfer-requests/${tr_id}/decide"
              payload: { decision: "REQUEST_REVISION" }
              as: RegionalDirector
            - &k_tr_resub3
              call: "POST /water/transfer-requests/${tr_id}/resubmit"
              payload: {}
              as: DistrictManager
              as_user_id: "${d_sr}"
          trigger:
            - &k_tr_rev4
              call: "POST /water/transfer-requests/${tr_id}/decide"
              payload: { decision: "REQUEST_REVISION" }
              as: RegionalDirector
              captures: { tr_err: $.data.error_id }
            - &k_tr_reject
              call: "POST /water/transfer-requests/${tr_id}/decide"
              payload: { decision: "REJECT", rationale: "rounds exhausted" }
              as: RegionalDirector
          assert:
            - "after the three loops TransferRequest.${tr_id}.revision_count == 3 and status == UNDER_REVIEW"
            - "the fourth REQUEST_REVISION returns 409 with error_id == ERR_REVISION_LIMIT_EXCEEDED and the transfer stays UNDER_REVIEW"
            - "amended quantity_af == 800 survived the resubmits (set on the second resubmit, untouched by the third's empty payload)"
            - "the final REJECT succeeds: TransferRequest.${tr_id}.status == REJECTED"

      - name: delivery_parallel_axes_independent
        grounds:
          - state_machines.DeliveryOrder.fulfillment_status
          - state_machines.DeliveryOrder.compliance_status
          - entities.DeliveryOrder.fields.compliance_status
        distinguishing_aspect: |
          Parallel state dimensions on DeliveryOrder: fulfillment advances
          CONFIRMED -> PARTIALLY_DELIVERED while compliance stays FLAGGED, and the
          later incident resolution flips compliance FLAGGED -> CLEARED without
          touching fulfillment — the two axes move independently on one row.
        test_recipe:
          setup:
            - "Big reservoir announced fixture (declared 2,444,000; SR full 6,000). A 400 cfs release scheduled BEFORE a MIN_FLOW 500 constraint existed, then executed inside the constraint window -> OPEN incident, reservoir COMPLIANCE_HOLD."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_big
            - *k_d_sr
            - *k_d_jr
            - *k_c_sr
            - *k_c_jr
            - *k_wy
            - *k_clock_jan
            - *k_obs_snow80
            - *k_obs_run5000
            - *k_ann1_create
            - *k_ann1_publish
            - &k_rel_weak
              call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "DELIVERY", release_cfs: 400, duration_days: 5, scheduled_start: "2027-02-01T00:00:00Z" }
              as: ReclamationOperator
              captures: { rel_weak_id: $.data.id }
            - &k_con_min500
              call: "POST /water/reservoirs/${res_id}/environmental-constraints"
              payload: { species: "SMELT", requirement_type: "MIN_FLOW", required_min_cfs: 500, enforce_start: "2027-01-01T00:00:00Z", enforce_end: "2027-03-01T00:00:00Z" }
              as: EnvironmentalOfficer
              captures: { con_min_id: $.data.id }
            - *k_clock_feb03_10
            - &k_exec_weak
              call: "POST /water/release-orders/${rel_weak_id}/execute"
              payload: {}
              as: ReclamationOperator
            - &k_do_flagged
              call: "POST /water/delivery-orders"
              payload: { contract_id: "${c_sr}", water_year_id: "${wy_id}", ordered_af: 100 }
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { do_id: $.data.id }
          trigger:
            - &k_do_partial
              call: "POST /water/delivery-orders/${do_id}/record-delivery"
              payload: { delivered_af: 40 }
              as: ReclamationOperator
            - &k_inc_lookup
              call: "GET /water/compliance-incidents"
              payload: { status: "OPEN" }
              as: EnvironmentalOfficer
              captures: { inc_id: "$.data[0].id" }
            - &k_inc_resolve
              call: "POST /water/compliance-incidents/${inc_id}/resolve"
              payload: { resolution: "FLOW_RESTORED" }
              as: EnvironmentalOfficer
          assert:
            - "at creation DeliveryOrder.${do_id}.compliance_status == FLAGGED (posture was COMPLIANCE_HOLD) and fulfillment_status == CONFIRMED"
            - "after record-delivery: fulfillment_status == PARTIALLY_DELIVERED while compliance_status is STILL FLAGGED — fulfillment moved, compliance did not"
            - "after incident resolve: compliance_status == CLEARED while fulfillment_status is STILL PARTIALLY_DELIVERED — compliance moved, fulfillment did not"
            - "DeliveryOrder.${do_id}.delivered_af == 40 throughout the compliance flip"

  - rule_id: transitive_cascade
    instances:
      - name: revision_curtailment_cascade_depth3
        grounds:
          - calculations.revision_curtailment_cascade
          - state_machines.AllocationAnnouncement.DRAFT_to_PUBLISHED
          - state_machines.DeliveryOrder.fulfillment_status
          - entities.AllocationLine.fields.remaining_af
        distinguishing_aspect: |
          Depth-3 cascade triggered by publish: announcement publish mutates
          AllocationLines (recomputed), the line mutation itself demotes
          over-committed DeliveryOrders to SHORTED (newest first), and the demotion
          re-fires the line's remaining_af recompute. At declared 6,700 the JR line
          lands at allocated 700 / delivered 200 / remaining 300 with exactly one
          order (the newer 500 af one) SHORTED and the older partial order intact.
        test_recipe:
          setup:
            - "Small-reservoir fixture, v1 published at declared 7,500 (SR 6,000 / JR 1,500). JR order O1 400 af with 200 delivered; JR order O2 500 af created one clock-day later. Revision observations (runoff 4,000, snow 80, observed 2027-01-20) posted."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_small
            - *k_d_sr
            - *k_d_jr
            - *k_d_tp
            - *k_c_sr
            - *k_c_jr
            - *k_wy
            - *k_clock_jan
            - *k_obs_snow80
            - *k_obs_run5000
            - *k_ann1_create
            - *k_ann1_publish
            - &k_o1_create
              call: "POST /water/delivery-orders"
              payload: { contract_id: "${c_jr}", water_year_id: "${wy_id}", ordered_af: 400 }
              as: DistrictManager
              as_user_id: "${d_jr}"
              captures: { o1_id: $.data.id }
            - &k_o1_partial
              call: "POST /water/delivery-orders/${o1_id}/record-delivery"
              payload: { delivered_af: 200 }
              as: ReclamationOperator
            - &k_clock_jan16
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-16T00:00:00Z" }
              as: SystemAdmin
            - &k_o2_create
              call: "POST /water/delivery-orders"
              payload: { contract_id: "${c_jr}", water_year_id: "${wy_id}", ordered_af: 500 }
              as: DistrictManager
              as_user_id: "${d_jr}"
              captures: { o2_id: $.data.id }
            - &k_obs2_run4000
              call: "POST /water/water-years/${wy_id}/hydrology-observations"
              payload: { observation_type: "RUNOFF_FORECAST_AF", value: 4000, observed_on: "2027-01-20T00:00:00Z" }
              as: HydrologyOfficer
            - &k_clock_jan20
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-20T00:00:00Z" }
              as: SystemAdmin
            - &k_get_wy_v3
              call: "GET /water/water-years/${wy_id}"
              payload: {}
              as: ReclamationOperator
              captures: { wy_v3: $.data.version }
            - &k_ann2_create_b
              call: "POST /water/water-years/${wy_id}/allocation-announcements"
              payload: { expected_water_year_version: "${wy_v3}" }
              as: ReclamationOperator
              captures: { ann2b_id: $.data.id }
          trigger:
            - &k_ann2b_publish
              call: "POST /water/allocation-announcements/${ann2b_id}/publish"
              payload: {}
              as: ReclamationOperator
          assert:
            - "AllocationAnnouncement.${ann2b_id}.declared_supply_af == 6700 (usable 5500 + round(4000*80/100) - holdback 2000) and ${ann1_id}.status == SUPERSEDED"
            - "the newer order ${o2_id}.fulfillment_status == SHORTED (created_at DESC demotion) while ${o1_id}.fulfillment_status == PARTIALLY_DELIVERED"
            - "DeliveryOrder.${o1_id}.delivered_af == 200 preserved through the cascade"
            - "the JR successor line (announcement ${ann2b_id}) has allocated_af == 700, delivered_af == 200 (carried forward), remaining_af == 300"
            - "the SR successor line has allocated_af == 6000 and remaining_af == 6000 (senior untouched)"

      - name: violation_propagates_compliance_hold
        grounds:
          - state_machines.ReleaseOrder.SCHEDULED_to_EXECUTED
          - state_machines.ComplianceIncident
          - entities.Reservoir.fields.compliance_posture
          - errors.ERR_COMPLIANCE_HOLD
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (release execute, not publish):
          execution violating a MIN_FLOW constraint itself creates a ComplianceIncident,
          whose creation flips Reservoir.compliance_posture to COMPLIANCE_HOLD, which
          then gates the NEXT release creation with ERR_COMPLIANCE_HOLD.
        test_recipe:
          setup:
            - "Big reservoir. A 400 cfs x 5 day release scheduled for 2027-02-01 with NO constraints on file; then a MIN_FLOW 500 cfs constraint covering Jan-Mar is registered. Clock 2027-02-03."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_big
            - *k_d_sr
            - *k_rel_weak
            - *k_con_min500
            - *k_clock_feb03_10
          trigger:
            - *k_exec_weak
            - &k_rel_blocked
              call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "POWER", release_cfs: 900, duration_days: 1, scheduled_start: "2027-02-10T00:00:00Z" }
              as: ReclamationOperator
              captures: { blocked_err: $.data.error_id }
          assert:
            - "the violating release ${rel_weak_id} executed anyway: status == EXECUTED (200)"
            - "exactly one ComplianceIncident exists with status OPEN, constraint_id == ${con_min_id}, release_order_id == ${rel_weak_id}, deficit_cfs == 100"
            - "Reservoir.${res_id}.compliance_posture == COMPLIANCE_HOLD and open_incident_count == 1"
            - "the follow-up release creation returns 409 with error_id == ERR_COMPLIANCE_HOLD — the posture gate fires one hop after the incident"
            - "Reservoir.${res_id}.current_storage_af == 2996033 (3,000,000 - 3,967 volume debit still applied)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_contract_beats_allocation_shortfall
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - errors.ERR_CONTRACT_SUSPENDED
          - errors.ERR_ALLOCATION_EXCEEDED
        distinguishing_aspect: |
          Category pair state vs business_fiscal: a delivery order on a SUSPENDED
          contract that would ALSO exceed its line's remaining_af must return
          ERR_CONTRACT_SUSPENDED (priority 6), never ERR_ALLOCATION_EXCEEDED (11).
        test_recipe:
          setup:
            - "Small-reservoir announced fixture (JR line allocated 1,500). Contract C-200 then SUSPENDED by FinanceOfficer."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_small
            - *k_d_sr
            - *k_d_jr
            - *k_c_sr
            - *k_c_jr
            - *k_wy
            - *k_clock_jan
            - *k_obs_snow80
            - *k_obs_run5000
            - *k_ann1_create
            - *k_ann1_publish
            - &k_suspend_jr
              call: "POST /water/contracts/${c_jr}/suspend"
              payload: {}
              as: FinanceOfficer
          trigger:
            - &k_do_suspended
              call: "POST /water/delivery-orders"
              payload: { contract_id: "${c_jr}", water_year_id: "${wy_id}", ordered_af: 2000 }
              as: DistrictManager
              as_user_id: "${d_jr}"
              captures: { do_err: $.data.error_id }
          assert:
            - "the response is 409 with error_id == ERR_CONTRACT_SUSPENDED"
            - "error_id != ERR_ALLOCATION_EXCEEDED even though ordered_af 2000 > remaining 1500"
            - "GET /water/delivery-orders?contract_id=${c_jr} returns 0 rows — the state rejection persisted nothing"

      - name: env_min_flow_beats_past_schedule
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors.ERR_ENV_MIN_FLOW_VIOLATION
          - errors.ERR_SCHEDULE_IN_PAST
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal (different pair from
          the first instance): a release that violates an intersecting MIN_FLOW
          constraint AND is scheduled in the past must return
          ERR_ENV_MIN_FLOW_VIOLATION (priority 7), never ERR_SCHEDULE_IN_PAST (9).
        test_recipe:
          setup:
            - "Big reservoir with a MIN_FLOW 500 cfs constraint covering Jan-Mar. Clock 2027-01-15."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_big
            - *k_d_sr
            - *k_con_min500
            - *k_clock_jan
          trigger:
            - &k_rel_double_bad
              call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "POWER", release_cfs: 400, duration_days: 5, scheduled_start: "2027-01-10T00:00:00Z" }
              as: ReclamationOperator
              captures: { rel_err: $.data.error_id }
          assert:
            - "the response is 422 with error_id == ERR_ENV_MIN_FLOW_VIOLATION"
            - "error_id != ERR_SCHEDULE_IN_PAST even though scheduled_start 2027-01-10 precedes the clock 2027-01-15"
            - "GET /water/reservoirs/${res_id}/release-orders returns 0 rows"

  - rule_id: boundary_precision_check
    instances:
      - name: tier_boundary_ratio_exact_075
        grounds:
          - calculations.shortage_tier_classification
          - entities.AllocationAnnouncement.fields.shortage_tier
        distinguishing_aspect: |
          Numeric-ratio boundary on the publish endpoint: declared 7,500 against
          total_max 10,000 is exactly ratio 0.75 and classifies NONE (strict <);
          declared 7,499 (one acre-foot lower) classifies TIER_1.
        test_recipe:
          setup:
            - "Small-reservoir fixture with snowpack 80 / runoff 5,000 (declared 7,500). Revision observations runoff 4,999 observed later."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_small
            - *k_d_sr
            - *k_d_jr
            - *k_c_sr
            - *k_c_jr
            - *k_wy
            - *k_clock_jan
            - *k_obs_snow80
            - *k_obs_run5000
            - *k_ann1_create
            - *k_ann1_publish
            - &k_obs_run4999
              call: "POST /water/water-years/${wy_id}/hydrology-observations"
              payload: { observation_type: "RUNOFF_FORECAST_AF", value: 4999, observed_on: "2027-01-20T00:00:00Z" }
              as: HydrologyOfficer
            - *k_clock_jan20
            - *k_get_wy_v3
            - *k_ann2_create_b
          trigger:
            - *k_ann2b_publish
          assert:
            - "AllocationAnnouncement.${ann1_id}.declared_supply_af == 7500 and shortage_tier == NONE — ratio exactly 0.75 does NOT trip TIER_1"
            - "AllocationAnnouncement.${ann2b_id}.declared_supply_af == 7499 (round(4999*80/100)=3999) and shortage_tier == TIER_1 — one acre-foot below the boundary does"
            - "the SR line of ${ann2b_id} has allocated_af == 6000 and the JR line 1,499 (waterfall: min(4000, 1499))"

      - name: zero_quantity_delivery_rejected
        grounds:
          - entities.DeliveryOrder.fields.ordered_af
          - errors.ERR_INVALID_QUANTITY
          - validations[priority=8]
        distinguishing_aspect: |
          Zero-quantity boundary on a different metric and endpoint (order quantity
          on POST /water/delivery-orders, not a ratio on publish): ordered_af == 0
          is rejected ERR_INVALID_QUANTITY even though 0 would trivially satisfy the
          remaining_af fiscal check — the boundary lives on the quantity floor.
        test_recipe:
          setup:
            - "Small-reservoir announced fixture (SR line allocated 6,000, nothing ordered)."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_small
            - *k_d_sr
            - *k_d_jr
            - *k_c_sr
            - *k_c_jr
            - *k_wy
            - *k_clock_jan
            - *k_obs_snow80
            - *k_obs_run5000
            - *k_ann1_create
            - *k_ann1_publish
          trigger:
            - &k_do_zero
              call: "POST /water/delivery-orders"
              payload: { contract_id: "${c_sr}", water_year_id: "${wy_id}", ordered_af: 0 }
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { zero_err: $.data.error_id }
          assert:
            - "the response is 400 with error_id == ERR_INVALID_QUANTITY"
            - "error_id != ERR_ALLOCATION_EXCEEDED — 0 acre-feet is a domain error, not a fiscal overflow"
            - "GET /water/delivery-orders?contract_id=${c_sr} returns 0 rows"

  - rule_id: resource_temporal_overlap
    instances:
      - name: pulse_window_adjacency_vs_overlap
        grounds:
          - calculations.env_window_overlap
          - entities.EnvironmentalConstraint.fields.enforce_start
          - errors.ERR_PULSE_WINDOW_OVERLAP
        distinguishing_aspect: |
          Pairwise half-open interval semantics on EnvironmentalConstraint: a pulse
          window starting exactly at another's end (adjacency) is ACCEPTED, while
          one overlapping by any positive amount is rejected — [Jan 10, Jan 20) then
          [Jan 20, Feb 1) both persist, [Jan 15, Jan 25) fails.
        test_recipe:
          setup:
            - "Big reservoir, clock 2026-10-01, no constraints yet."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_big
            - &k_con_pulse1
              call: "POST /water/reservoirs/${res_id}/environmental-constraints"
              payload: { species: "SALMON", requirement_type: "PULSE_FLOW", required_min_cfs: 3000, enforce_start: "2027-01-10T00:00:00Z", enforce_end: "2027-01-20T00:00:00Z" }
              as: EnvironmentalOfficer
              captures: { pulse1_id: $.data.id }
          trigger:
            - &k_con_pulse2
              call: "POST /water/reservoirs/${res_id}/environmental-constraints"
              payload: { species: "SALMON", requirement_type: "PULSE_FLOW", required_min_cfs: 3500, enforce_start: "2027-01-20T00:00:00Z", enforce_end: "2027-02-01T00:00:00Z" }
              as: EnvironmentalOfficer
              captures: { pulse2_id: $.data.id }
            - &k_con_pulse3
              call: "POST /water/reservoirs/${res_id}/environmental-constraints"
              payload: { species: "STURGEON", requirement_type: "PULSE_FLOW", required_min_cfs: 4000, enforce_start: "2027-01-15T00:00:00Z", enforce_end: "2027-01-25T00:00:00Z" }
              as: EnvironmentalOfficer
              captures: { pulse_err: $.data.error_id }
          assert:
            - "the adjacent window [Jan 20, Feb 1) is created: 201 with id ${pulse2_id} — half-open adjacency is not overlap"
            - "the overlapping window [Jan 15, Jan 25) returns 409 with error_id == ERR_PULSE_WINDOW_OVERLAP"
            - "GET /water/reservoirs/${res_id}/environmental-constraints?requirement_type=PULSE_FLOW returns exactly 2 rows"

      - name: outlet_capacity_aggregate_day
        grounds:
          - calculations.outlet_capacity_daily
          - entities.Reservoir.fields.outlet_capacity_cfs
          - errors.ERR_OUTLET_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Different interval semantics AND different resource from the pulse case:
          aggregate per-day capacity on Reservoir — two releases summing to exactly
          outlet_capacity_cfs (10,000 + 5,000 = 15,000) on a shared day are ACCEPTED
          (strict > rejects), but adding 1 cfs more (15,001) is rejected.
        test_recipe:
          setup:
            - "Big reservoir (outlet 15,000 cfs), clock 2027-01-15, no constraints."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_big
            - *k_clock_jan
            - &k_rel_cap_a
              call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "DELIVERY", release_cfs: 10000, duration_days: 10, scheduled_start: "2027-02-01T00:00:00Z" }
              as: ReclamationOperator
              captures: { rel_a_id: $.data.id }
          trigger:
            - &k_rel_cap_b
              call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "ENVIRONMENTAL", release_cfs: 5000, duration_days: 2, scheduled_start: "2027-02-02T00:00:00Z" }
              as: ReclamationOperator
              captures: { rel_b_id: $.data.id }
            - &k_rel_cap_c
              call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "POWER", release_cfs: 1, duration_days: 1, scheduled_start: "2027-02-02T00:00:00Z" }
              as: ReclamationOperator
              captures: { rel_c_err: $.data.error_id }
          assert:
            - "the 5,000 cfs release is created: 201 with id ${rel_b_id} — day load exactly 15,000 == outlet_capacity_cfs is allowed"
            - "the 1 cfs release returns 422 with error_id == ERR_OUTLET_CAPACITY_EXCEEDED — 15,001 > 15,000"
            - "GET /water/reservoirs/${res_id}/release-orders returns exactly 2 rows"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: delivery_gated_by_contract_status
        grounds:
          - validations[priority=6]
          - state_machines.WaterContract.ACTIVE_to_SUSPENDED
          - errors.ERR_CONTRACT_SUSPENDED
        distinguishing_aspect: |
          Pair DeliveryOrder x WaterContract: the same delivery-order payload is
          accepted (201, CONFIRMED) while the contract is ACTIVE and rejected
          ERR_CONTRACT_SUSPENDED after POST /water/contracts/{id}/suspend — the
          contract's state machine gates another entity's creation.
        test_recipe:
          setup:
            - "Small-reservoir announced fixture (SR line allocated 6,000)."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_small
            - *k_d_sr
            - *k_d_jr
            - *k_c_sr
            - *k_c_jr
            - *k_wy
            - *k_clock_jan
            - *k_obs_snow80
            - *k_obs_run5000
            - *k_ann1_create
            - *k_ann1_publish
            - &k_do_ok
              call: "POST /water/delivery-orders"
              payload: { contract_id: "${c_sr}", water_year_id: "${wy_id}", ordered_af: 100 }
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { do_ok_id: $.data.id }
            - &k_suspend_sr
              call: "POST /water/contracts/${c_sr}/suspend"
              payload: {}
              as: FinanceOfficer
          trigger:
            - &k_do_after_suspend
              call: "POST /water/delivery-orders"
              payload: { contract_id: "${c_sr}", water_year_id: "${wy_id}", ordered_af: 100 }
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { do_susp_err: $.data.error_id }
          assert:
            - "the pre-suspension order was created with id ${do_ok_id} and fulfillment_status CONFIRMED"
            - "the post-suspension attempt returns 409 with error_id == ERR_CONTRACT_SUSPENDED"
            - "DeliveryOrder.${do_ok_id} is untouched (still CONFIRMED) — suspension blocks only new creations"

      - name: transfer_gated_by_water_year_status
        grounds:
          - validations[priority=6]
          - state_machines.WaterYear
          - errors.ERR_YEAR_NOT_ANNOUNCED
        distinguishing_aspect: |
          Pair TransferRequest x WaterYear (different entities from the delivery /
          contract pair): transfer creation in an OPEN year (no published
          announcement) fails ERR_YEAR_NOT_ANNOUNCED, and the identical payload
          succeeds once the same year reaches ANNOUNCED via publish.
        test_recipe:
          setup:
            - "Small-reservoir fixture with contracts and an OPEN year (observations posted, no announcement)."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_small
            - *k_d_sr
            - *k_d_jr
            - *k_c_sr
            - *k_c_jr
            - *k_wy
            - *k_clock_jan
            - *k_obs_snow80
            - *k_obs_run5000
            - &k_tr_early
              call: "POST /water/transfer-requests"
              payload: { from_contract_id: "${c_sr}", to_contract_id: "${c_jr}", water_year_id: "${wy_id}", quantity_af: 100 }
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { tr_early_err: $.data.error_id }
            - *k_ann1_create
            - *k_ann1_publish
          trigger:
            - &k_tr_after_announce
              call: "POST /water/transfer-requests"
              payload: { from_contract_id: "${c_sr}", to_contract_id: "${c_jr}", water_year_id: "${wy_id}", quantity_af: 100 }
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { tr_ok_id: $.data.id }
          assert:
            - "the OPEN-year attempt returns 409 with error_id == ERR_YEAR_NOT_ANNOUNCED"
            - "the identical payload after publish succeeds: 201, TransferRequest.${tr_ok_id}.status == UNDER_REVIEW"
            - "GET /water/transfer-requests?water_year_id=${wy_id} returns exactly 1 row"

  - rule_id: compensating_invariant
    instances:
      - name: transfer_conserves_year_allocation
        grounds:
          - state_machines.TransferRequest.APPROVED_to_EXECUTED
          - entities.AllocationLine.fields.transfer_in_af
          - entities.AllocationLine.fields.transfer_out_af
          - calculations.allocation_remaining_balance
        distinguishing_aspect: |
          Conserved quantity: total remaining acre-feet across the year's lines.
          Executing a 1,000 af transfer debits the seller line and credits the buyer
          line (5,000 and 2,500 afterwards) — the pair sum stays 7,500, exactly its
          pre-execute value.
        test_recipe:
          setup:
            - "Small-reservoir announced fixture (SR 6,000 / JR 1,500, nothing delivered or ordered). Transfer 1,000 af SR->JR APPROVED at clock 2027-01-15, objection window ending 2027-01-18T00:00:00Z."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_small
            - *k_d_sr
            - *k_d_jr
            - *k_d_tp
            - *k_c_sr
            - *k_c_jr
            - *k_wy
            - *k_clock_jan
            - *k_obs_snow80
            - *k_obs_run5000
            - *k_ann1_create
            - *k_ann1_publish
            - *k_ln_sr_waterfall
            - *k_ln_jr_waterfall
            - *k_tr_create
            - &k_tr_approve
              call: "POST /water/transfer-requests/${tr_id}/decide"
              payload: { decision: "APPROVE" }
              as: RegionalDirector
            - &k_clock_window_end
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-18T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - &k_tr_execute
              call: "POST /water/transfer-requests/${tr_id}/execute"
              payload: {}
              as: ReclamationOperator
          assert:
            - "TransferRequest.${tr_id}.status == EXECUTED (clock exactly at objection_window_end is allowed: >= boundary)"
            - "AllocationLine.${ln_sr}.transfer_out_af == 1000 and remaining_af == 5000"
            - "AllocationLine.${ln_jr}.transfer_in_af == 1000 and remaining_af == 2500"
            - "invariant: 5000 + 2500 == 7500 — the year's total remaining is unchanged by the forward action (there is no compensating reverse action for EXECUTED transfers)"
            - "AllocationLine.${ln_sr}.allocated_af == 6000 and ${ln_jr}.allocated_af == 1500 — allocation itself is untouched, only transfer ledgers moved"

      - name: settle_conserves_repayment_dollars
        grounds:
          - calculations.repayment_credit_distribution
          - state_machines.RevenuePeriod.PROJECTED_to_SETTLED
          - entities.Reservoir.fields.unrecovered_balance_cents
          - entities.WaterContract.fields.repaid_credits_cents
        distinguishing_aspect: |
          Conserved quantity: repayment dollars. A 1-cent settle splits 7M/5M/3M
          obligations into per-contract rounded credits of 0/0/0, then assigns the
          1-cent remainder to the largest-outstanding contract — sum(credits) +
          unrecovered_balance == total_obligation (15,000,000) before and after,
          with zero drift.
        test_recipe:
          setup:
            - "Big reservoir. Three contracts C-A (7,000,000 cents), C-B (5,000,000), C-C (3,000,000). One 1 cfs x 1 day release (2 af -> 1.0 MWh) EXECUTED in February. Period 2027-02 at rate 1 cent/MWh."
          setup_api_calls:
            - *k_clock_oct
            - *k_res_big
            - *k_d_sr
            - *k_d_jr
            - *k_d_tp
            - &k_c_a
              call: "POST /water/contracts"
              payload: { district_id: "${d_sr}", contract_number: "C-A", priority_class: "SENIOR", max_annual_quantity_af: 1000, repayment_obligation_cents: 7000000 }
              as: SystemAdmin
              captures: { c_a: $.data.id }
            - &k_c_b
              call: "POST /water/contracts"
              payload: { district_id: "${d_jr}", contract_number: "C-B", priority_class: "JUNIOR", max_annual_quantity_af: 1000, repayment_obligation_cents: 5000000 }
              as: SystemAdmin
              captures: { c_b: $.data.id }
            - &k_c_c
              call: "POST /water/contracts"
              payload: { district_id: "${d_tp}", contract_number: "C-C", priority_class: "JUNIOR", max_annual_quantity_af: 1000, repayment_obligation_cents: 3000000 }
              as: SystemAdmin
              captures: { c_c: $.data.id }
            - &k_rel_tiny
              call: "POST /water/reservoirs/${res_id}/release-orders"
              payload: { purpose: "POWER", release_cfs: 1, duration_days: 1, scheduled_start: "2027-02-01T00:00:00Z" }
              as: ReclamationOperator
              captures: { rel_tiny_id: $.data.id }
            - *k_clock_feb01_noon
            - call: "POST /water/release-orders/${rel_tiny_id}/execute"
              payload: {}
              as: ReclamationOperator
            - &k_period_tiny
              call: "POST /water/revenue-periods"
              payload: { reservoir_id: "${res_id}", period_month: "2027-02", rate_cents_per_mwh: 1 }
              as: FinanceOfficer
              captures: { per3_id: $.data.id }
          trigger:
            - call: "POST /water/revenue-periods/${per3_id}/settle"
              payload: {}
              as: FinanceOfficer
            - call: "GET /water/reservoirs/${res_id}"
              payload: {}
              as: FinanceOfficer
              captures: { res_unrec: $.data.unrecovered_balance_cents }
          assert:
            - "before settle: Reservoir.total_repayment_obligation_cents == 15000000 and unrecovered_balance_cents == 15000000 with all repaid_credits_cents == 0"
            - "RevenuePeriod.${per3_id}.settled_revenue_cents == 1 (2 af * 0.5 MWh/af = 1.0 MWh at 1 cent)"
            - "WaterContract.${c_a}.repaid_credits_cents == 1 (remainder rule: per-line rounding gives 0/0/0, the 1-cent remainder goes to the largest outstanding)"
            - "WaterContract.${c_b}.repaid_credits_cents == 0 and WaterContract.${c_c}.repaid_credits_cents == 0"
            - "invariant: 1 + 0 + 0 + 14999999 == 15000000 — Reservoir.unrecovered_balance_cents == 14999999 after settle"
