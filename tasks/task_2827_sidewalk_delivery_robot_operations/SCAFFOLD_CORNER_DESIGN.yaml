            - "the ACTIVATE attempted from SUSPENDED returns 409 with error_id ERR_INVALID_STATE_TRANSITION, because SUSPENDED -> ACTIVE is reachable only through REINSTATE"
            - "the REINSTATE returns 200 with Merchant.${m}.integration_state == ACTIVE and version 4"
            - "Merchant.${m}.escrowed_fee_cents == 0 and Merchant.${m}.exception_count == 0 throughout"
      - name: mission_actions_after_completed_hit_the_terminal_lock
        claim_type: terminal_state_lockdown
        grounds:
          - "validations[priority=57]"
          - "errors.ERR_MISSION_ALREADY_TERMINAL"
          - "state_machines.DeliveryMission.HANDOFF_READY_to_COMPLETED"
          - "entities.DeliveryMission.fields.mission_state"
        distinguishing_aspect: >-
          COMPLETED is terminal for the mission machine and the lock has its own error identity: ABORT,
          load and REPORT_BLOCKAGE on a COMPLETED mission all return 409 ERR_MISSION_ALREADY_TERMINAL
          rather than the generic ERR_INVALID_STATE_TRANSITION, and none of them re-runs the completion
          side effects, so settled_fee_cents stays 817 and the robot stays AVAILABLE with
          lifetime_mission_count 1.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T09:00:00.000Z, advanced to 2026-08-03T09:12:00.000Z before completion"
            - "ServiceZone Z1 PERMITTED; segments S1, S2, S3, S5 APPROVED; Merchant M1 ACTIVE PREFERRED; Robot R1 was AVAILABLE"
            - "mission for order O1 ran the full LOADED -> EN_ROUTE -> HANDOFF_READY -> COMPLETED path on plan P1"
            - "order O1 is DELIVERED with settled_fee_cents 817; Robot R1 is back to AVAILABLE with lifetime_mission_count 1"
            - "the mission carries lid_access_code and active_minutes 12"
