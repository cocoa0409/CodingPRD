              payload: { patient_id: "${pt_id}", indication: "SCREENING_AVERAGE_RISK" }
              as: ReferralCoordinator
              captures: { ep_id: $.data.id, due0: $.data.due_date, origin0: $.data.origin }
            - call: "GET /patients/${pt_id}"
              payload: {}
              as: PracticeAdmin
              captures: { prio1: $.data.navigation_priority, count1: $.data.open_episode_count }
            - call: "POST /screening-episodes/${ep_id}/noninvasive-tests"
              payload: { test_type: "FIT", collected_date: "2026-08-08" }
              as: PatientNavigator
              captures: { test_id: $.data.id, res0: $.data.result }
          trigger:
            - call: "POST /noninvasive-tests/${test_id}/result"
              payload: { result: "POSITIVE" }
              as: Pathologist
              captures: { fu_ep: $.data.follow_up_episode_id, res1: $.data.result }
          assert:
            - "${prio0} == ROUTINE and ${count0} == 0"
            - "${due0} == 2027-02-06 and ${origin0} == DIRECT"
            - "${prio1} == ROUTINE and ${count1} == 1"
            - "${res0} == PENDING"
            - "hop 1 - ${res1} == POSITIVE and NoninvasiveTest.${test_id}.resulted_at == 2026-08-10T00:00:00Z"
            - "hop 2 - ${fu_ep} is a new ScreeningEpisode with indication DIAGNOSTIC_FOLLOWUP, origin NONINVASIVE_POSITIVE, preceding_episode_id == ${ep_id}, index_date 2026-08-10, eligibility_status ELIGIBLE"
            - "hop 3 - Patient.${pt_id}.open_episode_count == 2 and Patient.${pt_id}.navigation_priority == HIGH"
            - "hop 4 - ScreeningEpisode.${fu_ep}.due_date == 2026-09-09 (index_date + 30 high-priority days, NOT the 90-day diagnostic-followup default of 2026-11-08)"
            - "ScreeningEpisode.${fu_ep}.navigation_status == OUTREACH_ACTIVE"
            - "ScreeningEpisode.${ep_id}.due_date is still 2027-02-06 (the originating episode is not re-dated)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: suspended_session_at_capacity_returns_session_not_accepting
        grounds:
          - validations.priority_10_ERR_SESSION_NOT_ACCEPTING_BOOKINGS
          - validations.priority_38_ERR_SESSION_CAPACITY_EXCEEDED
          - state_machines.EndoscopySession.PUBLISHED_to_SUSPENDED
          - entities.EndoscopySession.fields.max_procedures
        distinguishing_aspect: |
          A posture-versus-capacity conflict on EndoscopySession: the block is both SUSPENDED
          (priority 10) and already holding max_procedures bookings (priority 38). The declared answer
          is the posture error, and the same request replayed after RESUME - with only the posture
          repaired - must then surface the capacity error, which proves both rules were genuinely
          violated at once rather than one of them being vacuous.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z"
            - "MODERATE_SEDATION block on 2026-09-15, window 13:00Z-21:00Z, turnover 15, max_procedures 1"
            - "One booking already placed at 13:00Z for 45 minutes, so the block is at capacity"
            - "Block then SUSPENDED with a reason"
            - "A second eligible patient with an OPEN episode waiting for a slot at 15:00Z, which is free and inside the window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /insurance-plans"
