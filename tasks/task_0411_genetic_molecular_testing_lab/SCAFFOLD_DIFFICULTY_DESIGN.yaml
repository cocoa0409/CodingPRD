            - call: "POST /lab/genes"
              payload: { symbol: "GC1", is_acmg_reportable: false }
              as: LabDirector
              captures: { gc1_id: $.data.id }
            - call: "POST /lab/panels"
              payload: { name: "PC1", list_price_cents: 40000, requires_consent: false }
              as: LabDirector
