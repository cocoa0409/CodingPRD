      - "GET /provost/teach-out-plans/{id}/course-guarantees"
      - "GET /provost/teach-out-plans/{id}/displaced-students"

  - name: Provost
    description: "The deciding officer. Proposes outcomes, ratifies a colleague's proposal (never their own), rescinds a ratified decision, and approves or returns teach-out plans. Cannot effectuate — that is the coordinator's step, which keeps proposal, ratification and execution in three different hands."
