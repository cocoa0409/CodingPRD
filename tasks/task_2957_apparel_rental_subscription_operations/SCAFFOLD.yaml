    roles: [WarehouseTech, ClaimsAdjuster, InventoryPlanner, PlatformAdmin]
    code: 200
    input: ["job_id?", "technician_id?", "damage_severity?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/reverse-logistics-jobs/{job_id}/cleaning-completion"
    description: "Sign off dry cleaning on a job; blocked while a required repair leg is still open"
    roles: [WarehouseTech]
    code: 200
    input: []
    output: ReverseLogisticsJob
    side_effects: ["cleaning_completed_at stamped, servicing_cost_cents rolled up via servicing_cost_rollup", "unit condition_state NEEDS_CLEANING -> FLOOR_READY", "job PROCESSING -> READY_FOR_PHOTO once every required leg is complete"]
  - method: POST
    path: "/reverse-logistics-jobs/{job_id}/repair-completion"
    description: "Sign off or fail a repair attempt; the signing technician may not be the technician who inspected the job"
    roles: [WarehouseTech]
    code: 200
    input: [outcome]
    output: ReverseLogisticsJob
    side_effects: ["repair_attempts incremented", "outcome ACCEPTED: repair_completed_at stamped, unit condition_state NEEDS_REPAIR -> NEEDS_CLEANING when cleaning is also required, otherwise -> FLOOR_READY", "outcome FAILED below the cap: job INSPECTED -> PROCESSING for another attempt", "outcome FAILED at REPAIR_ATTEMPT_CAP: job -> CONDEMNED_HOLD, unit condition_state -> CONDEMNED and condemned set", "servicing_cost_cents rolled up via servicing_cost_rollup"]
  - method: POST
    path: "/reverse-logistics-jobs/{job_id}/quarantine-clearance"
    description: "Certified technician clears a biohazard quarantine hold"
    roles: [WarehouseTech]
    code: 200
    input: []
    output: ReverseLogisticsJob
    side_effects: ["unit quarantine_hold cleared", "unit condition_state QUARANTINED -> NEEDS_CLEANING"]
  - method: POST
    path: "/reverse-logistics-jobs/{job_id}/photography"
    description: "Re-photograph a reconditioned unit"
    roles: [WarehouseTech]
    code: 200
    input: []
    output: ReverseLogisticsJob
    side_effects: ["photographed_at stamped, PHOTOGRAPHY cost added via servicing_cost_rollup", "job READY_FOR_PHOTO -> PHOTOGRAPHED"]
  - method: POST
    path: "/reverse-logistics-jobs/{job_id}/restock"
    description: "Return a reconditioned unit to rentable inventory"
    roles: [WarehouseTech]
    code: 200
    input: []
    output: ReverseLogisticsJob
    side_effects: ["job PHOTOGRAPHED -> RESTOCKED", "reservation RETURNED -> CLOSED", "unit PROCESSING -> IN_STOCK, cumulative_servicing_cost_cents updated", "style floor_ready_unit_count, depth_gap_units and replenishment_flag recomputed", "the oldest WAITLISTED reservation for the style and size is promoted to MATCHED when the unit fits its window"]

  # --- damage, loss and dispute handling --------------------------------------
  - method: GET
    path: "/damage-claims/{claim_id}"
    description: "Read one damage claim"
    roles: [Member, WarehouseTech, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: DamageClaim
    side_effects: []
  - method: GET
    path: "/damage-claims"
    description: "List damage claims, optionally filtered by reservation, unit, member, source inspection or state"
    roles: [Member, WarehouseTech, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["reservation_id?", "rental_unit_id?", "member_id?", "inspection_id?", "state?", "limit?", "offset?"]
    output: DamageClaim[]
    side_effects: []
  - method: POST
    path: "/damage-claims/{claim_id}/assessment"
    description: "Adjuster prices a damage claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["calculation damage_fee_assessment sets residual_value_cents, gross_fee_cents, waiver_applied_cents and net_fee_cents", "member.waiver_coverage_used_cents is recomputed from the member claims in {ASSESSED, DISPUTED, CHARGED, WAIVED}, so a waiver-backed assessment consumes coverage immediately even though no FeeLedgerEntry is appended yet", "state OPEN -> ASSESSED, assessed_at stamped"]
  - method: POST
    path: "/damage-claims/{claim_id}/waiver"
    description: "Adjuster absorbs an assessed claim under the member's damage waiver"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["state ASSESSED -> WAIVED", "waiver_applied_cents raised to gross_fee_cents and net_fee_cents set to 0", "member.waiver_coverage_used_cents increased", "a WAIVER_CREDIT entry is appended for audit with amount_cents 0"]
  - method: POST
    path: "/damage-claims/{claim_id}/charge"
    description: "Adjuster charges the net damage fee to the member"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: DamageClaim
    side_effects: ["state ASSESSED -> CHARGED, charged_at stamped", "a DAMAGE_FEE DEBIT FeeLedgerEntry of gross_fee_cents is appended, plus a WAIVER_CREDIT CREDIT entry of minus waiver_applied_cents when the waiver paid part of it, so the balance rises by net_fee_cents", "crossing DELINQUENCY_THRESHOLD_CENTS moves the member ACTIVE -> DELINQUENT", "the delinquency cascade RELEASES every MATCHED reservation and CANCELS every WAITLISTED reservation of the member and returns each RESERVED unit to IN_STOCK; an IN_POSSESSION reservation is left untouched", "waitlist promotion re-evaluated for each affected style"]
  - method: POST
    path: "/damage-claims/{claim_id}/disputes"
    description: "Member disputes an assessed or charged damage claim"
    roles: [Member]
    code: 200
    input: [dispute_reason]
    output: DamageClaim
    side_effects: ["state ASSESSED or CHARGED -> DISPUTED", "dispute_round incremented"]
  - method: POST
    path: "/damage-claims/{claim_id}/dispute-resolution"
    description: "Adjuster resolves a disputed claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: [resolution]
    output: DamageClaim
    side_effects: ["resolution PARTIAL: state -> ASSESSED with net_fee_cents re-derived at the next lower severity band", "resolution UPHELD: state -> CHARGED and the fee stands or is re-charged", "resolution OVERTURNED: state -> DISMISSED, net_fee_cents set to 0, and any prior DAMAGE_FEE is reversed by a DISPUTE_REVERSAL CREDIT entry that returns member.outstanding_fee_cents to its pre-charge value"]
  - method: GET
    path: "/fee-ledger-entries/{entry_id}"
