              captures: { stall_paint_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { customer_id: "${cust_id}", insurer_id: "${ins_id}", claim_number: "CLM-77042", vehicle_vin: "1HGCV1F30LA000114", vehicle_model_year: 2019, vehicle_make_model: "Honda Accord", initial_authorized_cents: 400000, deductible_cents: 25000 }
              as: ShopAdmin
