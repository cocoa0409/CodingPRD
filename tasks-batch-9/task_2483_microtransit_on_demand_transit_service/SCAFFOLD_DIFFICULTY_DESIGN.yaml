            - "Because the only completed trip is non-WAV, wav_equivalence_ratio is 0.000 and equivalence_verdict is COMPLIANT, so the priority-30 gate cannot interfere."
            - "FinanceAnalyst fa-1 files a FINAL report for 2026-08-03..2026-08-03 and submits it while B1 is still OPEN."
