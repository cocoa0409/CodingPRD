                prod_p100_v: "$.data.version"
            - call: "POST /oss-products"
              payload:
                product_code: "PCT-99"
                product_name: "Percent 99"
                distribution_model: "SaaS"
              as: ComplianceAnalyst
              captures:
                prod_p99_id: "$.data.id"
                prod_p99_v: "$.data.version"
            - call: "POST /oss-products/${prod_p100_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_p100_v}"
              as: ComplianceAnalyst
              captures:
                scan_p100_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_p100_id}"
              as: PlatformAdmin
            - call: "POST /oss-products/${prod_p99_id}/dependency-scans"
              payload:
                scan_tool: "SYFT"
                scan_scope: "FULL"
                expected_product_version: "${prod_p99_v}"
              as: ComplianceAnalyst
              captures:
                scan_p99_id: "$.data.id"
            - call: "POST /_scan-worker/process-next"
              payload:
                scan_id: "${scan_p99_id}"
              as: PlatformAdmin
            - call: "GET /oss-products/${prod_p100_id}/boms"
              as: ComplianceAnalyst
              captures:
                bom_p100_id: "$.data[0].id"
                bom_p100_v: "$.data[0].version"
            - call: "GET /oss-products/${prod_p99_id}/boms"
              as: ComplianceAnalyst
              captures:
                bom_p99_id: "$.data[0].id"
                bom_p99_v: "$.data[0].version"
            - call: "POST /oss-products/${prod_p100_id}/boms/${bom_p100_id}/generate-notice"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_p99_id}/boms/${bom_p99_id}/generate-notice"
              as: ComplianceAnalyst
            - call: "POST /oss-products/${prod_p100_id}/release-gates"
              payload:
                bom_id: "${bom_p100_id}"
                release_version: "1.0.0"
              as: ReleaseManager
              captures:
                gate_p100_id: "$.data.id"
            - call: "POST /oss-products/${prod_p99_id}/release-gates"
              payload:
                bom_id: "${bom_p99_id}"
