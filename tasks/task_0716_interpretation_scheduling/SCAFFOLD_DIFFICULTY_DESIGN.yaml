  - rule_id: priority_pair_validation_conflict
    instances:
      - name: auth_vs_state_forbidden_role_beats_invalid_state
        grounds:
          - validations[priority=2]
          - validations[priority=6]
        distinguishing_aspect: "Error-category pair = auth (priority 2, ERR_FORBIDDEN_ROLE) vs state (priority 6, ERR_INVALID_STATE): a ClientAccount (forbidden for dispatch) targets an already-ASSIGNED request; the auth check at priority 2 wins, so ERR_FORBIDDEN_ROLE surfaces, not ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "A request that has already been dispatched once (now ASSIGNED); a ClientAccount then attempts to dispatch it (wrong role AND wrong state)."
          setup_api_calls:
            - call: "POST /interpretation/clients"
              payload: { org_name: "Mercy Hosp", org_type: "HOSPITAL", contact_email: "h@x.com" }
              as: PlatformAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /interpretation/rate-plans"
              payload: { client_id: "${hosp_id}", certification_tier: "MEDICAL", modality: "PHONE", billing_mode: "PER_MINUTE", rate_cents: 195, min_block_units: 10 }
              as: PlatformAdmin
            - call: "POST /interpretation/language-pairs"
              payload: { source_lang: "en", target_lang: "es" }
              as: PlatformAdmin
              captures: { lp_id: $.data.id }
            - call: "POST /interpretation/interpreters"
              payload: { full_name: "Med I" }
              as: PlatformAdmin
              captures: { itp_id: $.data.id }
            - call: "POST /interpretation/interpreters/${itp_id}/certifications"
              payload: { tier: "MEDICAL", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/interpreters/${itp_id}/languages"
              payload: { language_pair_id: "${lp_id}" }
              as: PlatformAdmin
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/requests"
              payload: { client_id: "${hosp_id}", language_pair_id: "${lp_id}", modality: "PHONE", required_tier: "MEDICAL", scheduling_mode: "ON_DEMAND" }
              as: ClientAccount
              as_user_id: "${hosp_id}"
              captures: { req_id: $.data.id, req_v: $.data.version }
            - call: "POST /interpretation/requests/${req_id}/dispatch"
              payload: { expected_request_version: "${req_v}" }
              as: CoordinatorOps
          trigger:
            - call: "POST /interpretation/requests/${req_id}/dispatch"
              payload: { expected_request_version: "${req_v}" }
              as: ClientAccount
              as_user_id: "${hosp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_FORBIDDEN_ROLE (auth/role check at priority 2 fires before the state check at priority 6)."
            - "ERR_INVALID_STATE is NOT what surfaces despite the request already being ASSIGNED — the earlier auth category wins, proving priority 2 < priority 6 ordering."
      - name: safety_vs_fiscal_no_qualified_vs_credit_limit
        grounds:
          - validations[priority=8]
          - validations[priority=14]
        distinguishing_aspect: "A dispatch where the client is over credit limit (fiscal, priority 14 on create — but here the request already exists) AND no qualified interpreter exists (safety, priority 8): the business_safety check returns ERR_NO_QUALIFIED_INTERPRETER before any fiscal consideration, a different category pair (business_safety vs business_fiscal) than the state/OCC pair."
        test_recipe:
          setup:
            - "An OPEN request whose required language pair has NO interpreter who can service it, while the client is already near its credit limit."
          setup_api_calls:
            - call: "POST /interpretation/clients"
              payload: { org_name: "Mercy Hosp", org_type: "HOSPITAL", contact_email: "h@x.com", credit_limit_cents: 100 }
              as: PlatformAdmin
              captures: { hosp_id: $.data.id }
            - call: "POST /interpretation/rate-plans"
              payload: { client_id: "${hosp_id}", certification_tier: "MEDICAL", modality: "PHONE", billing_mode: "PER_MINUTE", rate_cents: 195, min_block_units: 10 }
              as: PlatformAdmin
            - call: "POST /interpretation/language-pairs"
              payload: { source_lang: "en", target_lang: "zh" }
              as: PlatformAdmin
              captures: { lp_id: $.data.id }
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/requests"
              payload: { client_id: "${hosp_id}", language_pair_id: "${lp_id}", modality: "PHONE", required_tier: "MEDICAL", scheduling_mode: "ON_DEMAND" }
              as: ClientAccount
              as_user_id: "${hosp_id}"
              captures: { req_id: $.data.id, req_v: $.data.version }
          trigger:
            - call: "POST /interpretation/requests/${req_id}/dispatch"
              payload: { expected_request_version: "${req_v}" }
              as: CoordinatorOps
          assert:
            - "InterpretationRequest.${req_id}.status == UNFULFILLABLE (empty candidate pool -> business_safety path), not a fiscal rejection."
            - "No ERR_CREDIT_LIMIT_EXCEEDED is raised on dispatch; the safety/selection outcome governs, distinct from the priority-14 fiscal category."

