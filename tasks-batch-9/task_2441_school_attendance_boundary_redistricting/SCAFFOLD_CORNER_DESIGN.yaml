      - Scenario A assigns A-01 to Cedar, A-02 to Birch and A-03 to Cedar, with 30 DUAL_LANGUAGE seats at Cedar. Cedar's utilization is only 80.93 and every area is assigned exactly once, so neither the completeness rule at priority 64 nor the capacity rule at priority 72 can pre-empt contiguity at priority 65.
