            - call: "POST /federal-aid/stips/${stip_id}/submit"
              payload: {}
              as: StateDOTPlanner
            - call: "POST /federal-aid/stips/${stip_id}/decide"
              payload: { decision: "APPROVE" }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/projects/${p_id}/determine-eligibility"
              payload: { determination: "ELIGIBLE" }
              as: FHWADivisionAdmin
            - call: "POST /federal-aid/clearances"
              payload: { project_id: "${p_id}", kind: "ENVIRONMENTAL", nepa_class: "CE" }
              as: StateDOTEngineer
              captures: { c_env: $.data.id }
            - call: "POST /federal-aid/clearances/${c_env}/decide"
              payload: { decision: "CLEARED" }
              as: FHWAReviewer
            - call: "POST /federal-aid/clearances"
              payload: { project_id: "${p_id}", kind: "RIGHT_OF_WAY" }
              as: StateDOTEngineer
              captures: { c_row: $.data.id }
            - call: "POST /federal-aid/clearances/${c_row}/decide"
              payload: { decision: "CLEARED", row_cert_level: "LEVEL_1_FULL" }
              as: FHWAReviewer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/authorizations"
              payload: { project_id: "${p_id}", agreement_number: "FA-R-001", initial_obligated_cents: 1000 }
              as: FHWADivisionAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /federal-aid/projects/${p_id}/advertise"
              payload: {}
              as: StateDOTEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /federal-aid/projects/${p_id}/open-bids"
              payload: { bids: [{ contractor_name: "Low Bidder", bid_amount_cents: 900, is_responsive: true }] }
              as: StateDOTEngineer
            - call: "GET /federal-aid/projects/${p_id}/bids"
              payload: {}
              as: FHWAReviewer
              captures: { bid0: "$.data[0].id" }
            - call: "POST /federal-aid/projects/${p_id}/award"
              payload: { bid_id: "${bid0}", dbe_commitment_pct: 0.10 }
              as: FHWAReviewer
            - call: "POST /federal-aid/vouchers"
              payload: { authorization_id: "${auth_id}", period_start_date: "2027-01-01T00:00:00Z", period_end_date: "2027-02-01T00:00:00Z", line_items: [{ description: "mobilization", eligible_amount_cents: 105 }, { description: "striping", eligible_amount_cents: 105 }], documentation_complete: true, is_final: false }
              as: StateDOTEngineer
              captures: { v_id: $.data.id }
            - call: "POST /federal-aid/vouchers/${v_id}/submit"
              payload: {}
              as: StateDOTEngineer
          trigger:
            - call: "POST /federal-aid/vouchers/${v_id}/decide"
              payload: { decision: "APPROVE" }
              as: FHWAReviewer
              captures: { fed: $.data.federal_reimbursable_cents, elig: $.data.eligible_amount_cents }
          assert:
            - "Voucher.${v_id}.eligible_amount_cents == 210"
            - "Voucher.${v_id}.federal_reimbursable_cents == 190 (per-line round_half_up 95 + 95, then sum; sum-then-round would give 189)"
            - "Authorization.${auth_id}.reimbursed_cents == 190"

      - name: change_order_cumulative_cap_clamps_participation
        grounds:
          - calculations.change_order_federal_participation
          - entities.ChangeOrder.fields.federal_participation_cents
          - constants.OVERRUN_PARTICIPATION_CAP_PCT
        distinguishing_aspect: "Mode (c) pinned evaluation order over a circular-looking dependency: participation feeds cumulative participation which bounds the next order's room — the first order clamps to the 200,000 cap (not its 480,000 eligible), the second gets 0 because the cap room is exhausted."
        test_recipe:
          setup:
            - "NHPP project (non-interstate, land 0.00) determined at share 0.80, authorized for 1,000,000 against an apportionment of 5,000,000, UNDER_CONSTRUCTION. Two change orders: CO1 delta 600,000 then CO2 delta 100,000, each state-concurred by a different engineer than its requester."
