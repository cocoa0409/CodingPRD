          assert:
            - "R1's adjudication returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES even though R1 holds the PolicyReviewer role and the right queue"
            - "After the refusal Appeal.${appeal_id}.status is still SUBMITTED with decided_by_reviewer_id null and version 1"
            - "R2's identical call returns HTTP 200 with Appeal.${appeal_id}.status == DENIED, decided_by_reviewer_id ${rev2}, decided_at 2026-08-01T00:00:00Z and reinstated_review_status null"
            - "DisapprovalNotice.${notice_id}.status == APPEAL_UPHELD and AdCreative.${cr_id}.review_status is still DISAPPROVED"
            - "The ledger still holds exactly one entry of 4.00: a denied appeal writes no compensating entry"

      - name: rbac_certification_submission_is_shared_by_advertiser_and_policy_admin_only
        claim_type: Shared operation
        grounds:
          - roles.Advertiser.shared_operations
          - roles.PolicyAdmin.shared_operations
          - validations[priority=12].ERR_FORBIDDEN_ROLE
          - validations[priority=14].ERR_ADVERTISER_SCOPE_VIOLATION
        distinguishing_aspect: |
          POST /ad-policy/certifications is the one write two roles share, and the sharing is
          asymmetric: the admin may file on behalf of any advertiser while an advertiser may
          file only for itself, and the reviewer and analyst may not file at all. Both accepted
          rows land on the same advertiser and rule, separated only by issuing country.
        test_recipe:
          setup:
            - "Rule ALC_SPIRITS (RESTRICTED, weight 6.00, requires_certification true); advertiser A and advertiser B, both verified on identity."
