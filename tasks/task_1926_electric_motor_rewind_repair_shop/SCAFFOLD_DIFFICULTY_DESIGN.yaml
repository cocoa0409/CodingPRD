              as: ServiceManager
              captures: { m1: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "M-14", rated_kw: 75, frame_mm: 200, voltage_v: 460, manufacture_year: 2020 }
              as: ServiceManager
              captures: { m2: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "P-3", rated_kw: 75, frame_mm: 200, voltage_v: 460, manufacture_year: 2019, is_pool_spare: true }
              as: ServiceManager
              captures: { p1: $.data.id }
            - call: "POST /shops/${shop_id}/motors"
              payload: { owner_customer_id: "${cust_id}", serial_number: "P-4", rated_kw: 75, frame_mm: 200, voltage_v: 460, manufacture_year: 2019, is_pool_spare: true }
              as: ServiceManager
              captures: { p2: $.data.id }
            - call: "POST /shops/${shop_id}/pool-contracts"
              payload: { customer_id: "${cust_id}", slot_count: 1 }
              as: ServiceManager
              captures: { contract_id: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${m1}", priority: "STANDARD" }
              as: Technician
              captures: { wo1: $.data.id }
            - call: "POST /shops/${shop_id}/work-orders"
              payload: { customer_id: "${cust_id}", motor_id: "${m2}", priority: "STANDARD" }
              as: Technician
              captures: { wo2: $.data.id }
            - call: "POST /shops/${shop_id}/pool-contracts/${contract_id}/loans"
              payload: { work_order_id: "${wo1}", spare_motor_id: "${p1}" }
              as: ServiceManager
              captures: { loan1: $.data.id }
          trigger:
            - call: "POST /shops/${shop_id}/pool-contracts/${contract_id}/loans"
              payload: { work_order_id: "${wo2}", spare_motor_id: "${p2}" }
              as: ServiceManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_POOL_UNAVAILABLE   # slot_count=1 exhausted by loan1"
            - "After POST .../loans/${loan1}/return the same checkout for W2 succeeds"

      - name: quote_single_live_interval_per_work_order
        grounds:
          - validations[priority=9]
          - state_machines.Quote.DRAFT_to_ISSUED
        distinguishing_aspect: |
          Half-open live-interval semantics on WorkOrder.active_quote_id: a
          quote occupies the work order's quote slot from issuance until it
          reaches a terminal state; issuing a second quote while the first is
          ISSUED collides even though the two quotes' [issued_at, expires_at)
          windows would trivially overlap — the rule is one-live-quote, not
