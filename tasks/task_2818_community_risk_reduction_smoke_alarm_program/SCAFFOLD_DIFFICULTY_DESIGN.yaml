# ===========================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2818 - Community Risk Reduction & Smoke Alarm Program
# Every rule_id below is verbatim from SKILL.md 0.5; every grounds entry
# resolves into SCAFFOLD.yaml 1.1-1.7.
# ===========================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: zone_risk_score_provisional_demographic_vs_validated_field_diverges
        grounds:
          - calculations.zone_risk_score
          - entities.RiskZone.fields.assumed_alarm_absence_pct
          - entities.RiskZone.fields.surveyed_units_without_alarm
          - entities.ZoneAssessment.fields.alarm_gap_pct
          - state_machines.RiskZone.ASSESSED_to_ASSESSED
          - concurrency_rules[zone-assessment-supersede-stale-zone]
        distinguishing_aspect: |
          This dual variant lives in the risk-scoring domain on RiskZone: the same zone row scores
          70.00 / TIER_1 under PROVISIONAL_DEMOGRAPHIC (alarm_gap_pct = assumed_alarm_absence_pct
          = 66.00) and 63.40 / TIER_2 under VALIDATED_FIELD (alarm_gap_pct derived from one surveyed
          unit that already had a working alarm, so 0.00) - no money field participates.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One LEAF zone with occupied_units 2000, 20 structure fires and 2 fire injuries over 5 years, 60.0 pct pre-1980 units, 25.0/10.0/5.0 senior/under-5/disability household pct and assumed_alarm_absence_pct 66.0."
            - "A first PROVISIONAL assessment has scored the zone 70.00 / TIER_1."
            - "One non-vulnerable household in the zone, so its band is decided purely by the zone tier."
            - "One published route and one arrived visit whose survey found 2 working smoke alarms, leaving surveyed_units 1 and surveyed_units_without_alarm 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-A70", name: "Ashfield Leaf", occupied_units: 2000, structure_fire_count_5yr: 20, fire_injury_count_5yr: 2, pre_1980_unit_pct: 60.0, senior_household_pct: 25.0, under5_household_pct: 10.0, disability_household_pct: 5.0, assumed_alarm_absence_pct: 66.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_a_id: $.data.id, z_a_v0: $.data.version }
            - call: "POST /crr/zones/${z_a_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_a_v0}" }
              as: RiskAnalyst
              captures: { asmt1_id: $.data.id }
            - call: "POST /crr/crews"
              payload: { crew_code: "CREW-A1", member_count: 2, certification_level: "ADVANCED", max_daily_minutes: 480 }
              as: ProgramAdmin
              captures: { crew_a_id: $.data.id }
            - call: "POST /crr/households"
              payload: { zone_id: "${z_a_id}", address_line: "1 Ash Lane", occupant_count: 2, sleeping_areas_count: 2, storeys: 1 }
              as: CanvassCoordinator
              captures: { hh_a_id: $.data.id }
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_a_id}", crew_id: "${crew_a_id}", service_date: "2026-08-03", window_start_utc: "2026-08-03T13:00:00Z", window_end_utc: "2026-08-03T21:00:00Z", planned_slots: 4 }
              as: CanvassCoordinator
              captures: { r_a_id: $.data.id }
            - call: "POST /crr/routes/${r_a_id}/publish"
              payload: {}
              as: CanvassCoordinator
            - call: "POST /crr/visits"
              payload: { household_id: "${hh_a_id}", route_id: "${r_a_id}", scheduled_start_utc: "2026-08-03T14:00:00Z", appointment_option: "SCHEDULED_APPOINTMENT" }
              as: CanvassCoordinator
              captures: { v_a_id: $.data.id }
            - call: "POST /crr/visits/${v_a_id}/arrive"
              payload: { occupant_present: true, pre_existing_working_smoke_alarms: 2, pre_existing_working_co_alarms: 1 }
              as: CrrTechnician
              as_user_id: "${crew_a_id}"
            - call: "GET /crr/zones/${z_a_id}"
              payload: {}
              as: RiskAnalyst
              captures: { z_a_v_now: $.data.version }
          trigger:
            - call: "POST /crr/zones/${z_a_id}/assessments"
              payload: { basis: "VALIDATED", expected_zone_version: "${z_a_v_now}" }
              as: RiskAnalyst
              captures: { asmt2_id: $.data.id }
          assert:
            - "ZoneAssessment.${asmt1_id}.basis == PROVISIONAL"
            - "ZoneAssessment.${asmt1_id}.alarm_gap_pct == 66.00"
            - "ZoneAssessment.${asmt1_id}.alarm_points == 6.60"
            - "ZoneAssessment.${asmt1_id}.risk_score == 70.00"
            - "ZoneAssessment.${asmt1_id}.risk_tier == TIER_1"
            - "ZoneAssessment.${asmt2_id}.sequence_no == 2"
            - "ZoneAssessment.${asmt2_id}.surveyed_units_at_assessment == 1"
            - "ZoneAssessment.${asmt2_id}.alarm_gap_pct == 0.00"
            - "ZoneAssessment.${asmt2_id}.alarm_points == 0.00"
            - "ZoneAssessment.${asmt2_id}.risk_score == 63.40"
            - "ZoneAssessment.${asmt2_id}.risk_tier == TIER_2"
            - "RiskZone.${z_a_id}.risk_score == 63.40"
            - "RiskZone.${z_a_id}.risk_tier == TIER_2"
            - "RiskZone.${z_a_id}.assessment_basis == VALIDATED"
            - "RiskZone.${z_a_id}.current_assessment_id == ${asmt2_id}"
            - "Household.${hh_a_id}.priority_band == P3_STANDARD"

      - name: installation_reimbursement_unit_rate_vs_actual_cost_diverges
        grounds:
          - calculations.installation_reimbursement
          - entities.PartnerGrant.fields.reimbursement_basis
          - entities.PartnerGrant.fields.unit_rate_cents_by_type
          - entities.AlarmInstallation.fields.reserved_cost_cents
          - entities.AlarmInstallation.fields.reimbursable_cents
          - entities.GrantReport.fields.reimbursable_total_cents
        distinguishing_aspect: |
          This dual variant lives in the money domain on PartnerGrant / AlarmInstallation / GrantReport,
          not on RiskZone: six physically identical devices installed on one visit reimburse 6900 cents
          in total under UNIT_RATE (flat 2195/3495 grant rates) and 7796 cents under ACTUAL_COST
          (lot cost 1850/2990 plus 740 cents labour allocation), at the same 87.5 pct rate.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "One TIER_2 zone (risk_score 54.52) holding one household with 3 sleeping areas, 2 storeys, one mobility-impaired occupant, one child under 5 and a fuel-burning appliance."
            - "Two partners, each with one ACTIVE grant over 2026-07-01..2026-12-31 authorised at 500000 cents, reimbursement_pct 87.5, indirect_rate_pct 12.5, match_pct 20.0 - grant G1 on UNIT_RATE, grant G2 on ACTUAL_COST."
            - "Each grant funds one SMOKE_10YR lot at 1850 cents and one CO_ALARM lot at 2990 cents."
            - "One published route, one arrived visit that found 1 pre-existing working smoke alarm, and six installations: three drawn from G1's lots and three from G2's lots."
            - "The visit is completed with install_outcome COMPLETE, so all six installations are INSTALLED and therefore reportable."
            - "A second crew (CREW-B2) independently verifies every installation, exercising the segregation-of-duties rule on verify; the reportable set covers INSTALLED and VERIFIED rows alike."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /crr/zones"
              payload: { zone_code: "Z-B54", name: "Birchwood Leaf", occupied_units: 2000, structure_fire_count_5yr: 15, fire_injury_count_5yr: 2, pre_1980_unit_pct: 40.0, senior_household_pct: 20.0, under5_household_pct: 8.0, disability_household_pct: 4.0, assumed_alarm_absence_pct: 50.0, daily_visit_cap: 12 }
              as: RiskAnalyst
              captures: { z_b_id: $.data.id, z_b_v0: $.data.version }
            - call: "POST /crr/zones/${z_b_id}/assessments"
              payload: { basis: "PROVISIONAL", expected_zone_version: "${z_b_v0}" }
              as: RiskAnalyst
            - call: "POST /crr/crews"
              payload: { crew_code: "CREW-B1", member_count: 2, certification_level: "ADVANCED", max_daily_minutes: 480 }
              as: ProgramAdmin
              captures: { crew_b_id: $.data.id }
            - call: "POST /crr/crews"
              payload: { crew_code: "CREW-B2", member_count: 2, certification_level: "ADVANCED", max_daily_minutes: 480 }
              as: ProgramAdmin
              captures: { crew_v_id: $.data.id }
            - call: "POST /crr/partners"
              payload: { org_name: "Firesafe Trust", org_type: "NONPROFIT", contact_email: "ops@firesafe.example", agreement_signed: true }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /crr/partners"
              payload: { org_name: "Riverside Utility", org_type: "UTILITY", contact_email: "grants@riverside.example", agreement_signed: true }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /crr/grants"
