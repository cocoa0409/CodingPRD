# ===========================================================================
# 1.9 Scaffold Corner Design — coupon-clearinghouse-redemption-settlement
#
# Breadth probe over the §1.1-§1.7 surface of SCAFFOLD.yaml. Sections and
# claim_type values are taken from references/claim-extraction-guide.md; corners
# already asserted by an instance in SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted
# as excluded_because stubs that name that instance.
#
# Every fixture below starts from an empty database and the mandatory logical
# clock default 2026-08-01T00:00:00Z. Recurring literals:
#   gs1_company_prefix 038000, face_value_cents 50, handling_fee_cents 7
#   GS1_DATABAR payload = "811" + prefix6 + face5 + units2 + YYMMDD + grace3
#     units 1 / exp 2026-12-31 / grace 30 -> 8110380000005001261231030
#     units 1 / exp 2026-08-10 / grace 30 -> 8110380000005001260810030
#   UPC_A_WITH_EXT5 payload = "5" + prefix6 + face5 + ext5
#     units 1 / grace 30 -> 50380000005001030
# ===========================================================================

scaffold_corner_design:

  # =====================================================================
  # Table 1 — Entities
  # =====================================================================
  - section: entities
    instances:

      - name: manufacturer_creation_returns_zeroed_funding_ledger
        claim_type: creation
        grounds:
          - endpoints.POST./manufacturers
          - entities.Manufacturer
        distinguishing_aspect: |
          A 201 with every declared field present in the envelope's data object:
          the two input fields echoed, the two optional inputs at the values
          supplied, all three ledger fields at 0, status ACTIVE, and the four
          common fields minted by the server. The ledger fields are the point —
          a manufacturer is born with no funding and no disbursement, so
          funding_balance_cents is 0 rather than absent or null.
        test_recipe:
          setup:
            - "empty database; clock at its 2026-08-01T00:00:00Z default"
          setup_api_calls: []
          trigger:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000", handling_fee_policy: "TIERED_RATE", dispute_window_days: 60 }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          assert:
            - "status 201 with response_type == \"object\" and meta.api_request_id present"
            - "data.legal_name == \"Kellwood Foods\" and data.gs1_company_prefix == \"038000\""
            - "data.handling_fee_policy == \"TIERED_RATE\" and data.dispute_window_days == 60"
            - "data.funded_total_cents == 0, data.disbursed_total_cents == 0, data.funding_balance_cents == 0"
            - "data.status == \"ACTIVE\""
            - "data.version == 1 and data.created_at == data.updated_at"
            - "data.id is a bare UUID string with no type prefix (no \"mfr_\" and no underscore)"

      - name: retailer_retrieval_returns_every_stored_field
        claim_type: retrieval
        grounds:
          - endpoints.GET./retailers/{id}
          - entities.Retailer
        distinguishing_aspect: |
          GET returns the same row POST minted, including both fraud-score
          variant fields and the selected fraud_score, so a client never has to
          infer a score from the mode. last_rescored_at is null until the first
          rescore, which distinguishes "never scored" from "scored at 0.00".
        test_recipe:
          setup:
            - "one retailer, created with every optional field supplied explicitly"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets", channel_capability: "MAIL_ONLY", payment_terms: "NET_45", base_fee_tier: "PREFERRED", fraud_scoring_mode: "LIFETIME_WEIGHTED" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "GET /retailers/${ret_id}"
              payload: {}
              as: FraudAnalyst
              as_user_id: "fa-1"
          assert:
            - "status 200 and data.id == ${ret_id}"
            - "data.channel_capability == \"MAIL_ONLY\", data.payment_terms == \"NET_45\", data.base_fee_tier == \"PREFERRED\", data.fraud_scoring_mode == \"LIFETIME_WEIGHTED\""
            - "data.handling_fee_tier == \"PREFERRED\" — initialised from base_fee_tier, not hard-coded to STANDARD"
            - "data.fraud_score_rolling_window == 0.00, data.fraud_score_lifetime_weighted == 0.00, data.fraud_score == 0.00"
            - "data.duplicate_rate == 0.00, data.misredemption_rate == 0.00, data.counterfeit_rate == 0.00"
            - "data.rejected_submission_count == 0 and data.unpaid_balance_cents == 0"
            - "data.status == \"ACTIVE\" and data.last_rescored_at == null"

      - name: retailer_listing_paginates_newest_first
        claim_type: listing
        grounds:
          - endpoints.GET./retailers
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          Three rows, limit 2: the first page carries the two newest by
          created_at DESC with total_count 3 and has_more true; the second page
          carries the oldest with has_more false. total_count counts the whole
          filtered set, not the page.
        test_recipe:
          setup:
            - "three retailers created in order R1, R2, R3"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { legal_name: "R1 Grocery" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { r1_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "R2 Grocery" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { r2_id: $.data.id }
            - call: "POST /retailers"
              payload: { legal_name: "R3 Grocery" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { r3_id: $.data.id }
          trigger:
            - call: "GET /retailers?limit=2&offset=0"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "GET /retailers?limit=2&offset=2"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "GET /retailers?status=SUSPENDED"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          assert:
            - "trigger call 1: status 200, response_type == \"array\", total_count == 3, has_more == true, exactly 2 rows"
            - "trigger call 1: data[0].id == ${r3_id} and data[1].id == ${r2_id} (created_at DESC)"
            - "trigger call 2: total_count == 3, has_more == false, exactly 1 row, data[0].id == ${r1_id}"
            - "trigger call 3: total_count == 0, has_more == false, 0 rows — the filter applies before pagination"

      - name: offer_retrieval_with_unknown_id_returns_offer_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_OFFER_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: |
          A well-formed but unused UUID on the offer route returns the
          offer-specific 404, not a generic one, and the error envelope carries
          response_type "error" with data.error_id — the shape a client parses.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /offers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-1"
          assert:
            - "status 404 with response_type == \"error\" and data.error_id == \"ERR_OFFER_NOT_FOUND\""
            - "data.message is a non-empty string and no offer payload is returned"

      - name: offer_creation_missing_required_fields_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST./offers
          - errors.ERR_INVALID_REQUEST
          - validations[priority=5]
        distinguishing_aspect: |
          Each input field of POST /offers that carries no default is
          individually required: dropping face_value_cents, barcode_family or
          max_redemptions each fails with the same 400, and nothing is created,
          so a client cannot half-open an offer by omitting the ceiling.
        test_recipe:
          setup:
            - "one manufacturer"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
          trigger:
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "GET /offers?manufacturer_id=${mfr_id}"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
          assert:
            - "trigger call 1 (no face_value_cents) returns 400 ERR_INVALID_REQUEST"
            - "trigger call 2 (no barcode_family) returns 400 ERR_INVALID_REQUEST"
            - "trigger call 3 (no max_redemptions) returns 400 ERR_INVALID_REQUEST"
            - "trigger call 4 returns total_count == 0 — none of the three refused calls created an Offer"

      - name: offer_creation_omitting_optional_terms_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Offer.fields.purchase_requirement_units
          - entities.Offer.fields.redemption_grace_days
          - entities.Offer.fields.digital_enabled
          - entities.Offer.fields.clip_validity_days
        distinguishing_aspect: |
          The four optional offer terms fall back to exactly the §1.1 defaults
          (1 unit, 30 grace days, digital off, 60-day clips) rather than to zero
          or null, and the computed/system fields start at their declared
          initial values — barcode_payload null while DRAFT and
          accepted_redemption_count 0.
        test_recipe:
          setup:
            - "one manufacturer"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
          trigger:
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c on two cans", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
          assert:
            - "status 201 with data.purchase_requirement_units == 1, data.redemption_grace_days == 30, data.digital_enabled == false, data.clip_validity_days == 60"
            - "data.status == \"DRAFT\", data.barcode_payload == null, data.accepted_redemption_count == 0, data.withdrawn_reason == null"
            - "data.version == 1"

      - name: retailer_creation_omitting_optional_fields_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Retailer.fields.channel_capability
          - entities.Retailer.fields.payment_terms
          - entities.Retailer.fields.base_fee_tier
          - entities.Retailer.fields.fraud_scoring_mode
        distinguishing_aspect: |
          A retailer onboarded with nothing but a legal name is contracted for
          BOTH channels on NET_30 at the STANDARD tier and scored in
          ROLLING_WINDOW mode, and handling_fee_tier is seeded from
          base_fee_tier rather than defaulted independently.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          assert:
            - "status 201 with data.channel_capability == \"BOTH\", data.payment_terms == \"NET_30\", data.base_fee_tier == \"STANDARD\", data.fraud_scoring_mode == \"ROLLING_WINDOW\""
            - "data.handling_fee_tier == \"STANDARD\" (seeded from base_fee_tier)"
            - "data.status == \"ACTIVE\", data.fraud_score == 0.00, data.unpaid_balance_cents == 0, data.rejected_submission_count == 0, data.last_rescored_at == null"
            - "data.version == 1"

      - name: offer_computed_fields_input_ignored_and_minted_at_register
        claim_type: computed_fields
        grounds:
          - entities.Offer.fields.barcode_payload
          - entities.Offer.fields.accepted_redemption_count
          - calculations.offer_barcode_payload
          - state_machines.Offer.transitions.DRAFT_to_REGISTERED
        distinguishing_aspect: |
          A caller cannot hand the clearinghouse a barcode: supplying either
          computed field is a 400, and the payload only appears at the
          DRAFT -> REGISTERED transition, where it is the exact 25-digit
          GS1_DATABAR concatenation of the manufacturer prefix, face value,
          purchase units, expiry and grace days.
        test_recipe:
          setup:
            - "one manufacturer with gs1_company_prefix 038000; clock at its default"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
          trigger:
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000, barcode_payload: "8110380000005001261231030" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000, accepted_redemption_count: 5 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/register"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
          assert:
            - "trigger call 1 returns 400 ERR_INVALID_REQUEST — barcode_payload is source: computed"
            - "trigger call 2 returns 400 ERR_INVALID_REQUEST — accepted_redemption_count is source: computed"
            - "trigger call 3 returns 201 with data.barcode_payload == null and data.accepted_redemption_count == 0"
            - "trigger call 4 returns 200 with data.status == \"REGISTERED\" and data.barcode_payload == \"8110380000005001261231030\" (\"811\" + \"038000\" + \"00050\" + \"01\" + \"261231\" + \"030\", 25 digits)"
            - "trigger call 4: data.version == 2 and data.accepted_redemption_count still 0"

      - name: system_fields_minted_by_server_and_body_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Retailer.fields.status
          - state_machines.Retailer.transitions.ACTIVE_to_SUSPENDED
          - endpoints.POST./retailers/{id}/suspend
        distinguishing_aspect: |
          id, created_at, updated_at and version are server property: supplying
          status or id in the create body is a 400, created_at equals updated_at
          at creation with version 1, and the first mutation moves version to 2
          and refreshes updated_at while leaving created_at and id byte-identical.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets", status: "SUSPENDED" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets", id: "11111111-1111-4111-8111-111111111111" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
            - call: "POST /retailers/${ret_id}/suspend"
              payload: { reason: "Under investigation" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
            - call: "GET /retailers/${ret_id}"
              payload: {}
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
          assert:
            - "trigger call 1 returns 400 ERR_INVALID_REQUEST — status is source: system"
            - "trigger call 2 returns 400 ERR_INVALID_REQUEST — id is server-minted and not an input field"
            - "trigger call 3 returns 201 with data.status == \"ACTIVE\", data.version == 1, data.created_at == data.updated_at, and data.id != \"11111111-1111-4111-8111-111111111111\""
            - "trigger call 4 returns 200 with data.status == \"SUSPENDED\", data.version == 2, data.updated_at > data.created_at"
            - "trigger call 5: data.id == ${ret_id} and data.created_at is unchanged from trigger call 3's value"

      - name: offer_enum_and_numeric_range_constraints_rejected
        claim_type: type_constraints
        grounds:
          - entities.Offer.fields.barcode_family
          - entities.Offer.fields.face_value_cents
          - entities.Offer.fields.purchase_requirement_units
          - entities.Offer.fields.max_redemptions
          - entities.Offer.fields.offer_code
        distinguishing_aspect: |
          Each declared bound is enforced at its own edge — barcode_family
          outside its two-member enum, face_value_cents at 0 (floor is 1),
          purchase_requirement_units at 25 (ceiling is 24), max_redemptions at 0
          (floor is 1), offer_code with lowercase and a space — and no Offer row
          survives any of them.
        test_recipe:
          setup:
            - "one manufacturer"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
          trigger:
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "EAN13", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 0, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000, purchase_requirement_units: 25 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "SOUP50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 0 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /offers"
              payload: { manufacturer_id: "${mfr_id}", offer_code: "soup 50", face_value_cents: 50, handling_fee_cents: 7, expiration_date: "2026-12-31", redemption_instructions: "Save 50c", barcode_family: "GS1_DATABAR", max_redemptions: 1000 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "GET /offers?manufacturer_id=${mfr_id}"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_id}"
          assert:
            - "trigger calls 1-5 each return 400 ERR_INVALID_REQUEST"
            - "trigger call 6 returns total_count == 0 — five refused creates left no Offer row behind"

      - name: submission_window_ordering_and_channel_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Submission.fields.channel
          - entities.Submission.fields.postmark_window_start
          - entities.Submission.fields.postmark_window_end
          - entities.Submission.fields.declared_count
        distinguishing_aspect: |
          The postmark interval must be strictly ordered: start == end is
          refused as well as start > end, because a zero-width half-open window
          would occupy no intake capacity at all. channel outside {MAIL,
          ELECTRONIC} and a negative declared_count are refused by the same 400.
        test_recipe:
          setup:
            - "one retailer with the default BOTH channel capability"
          setup_api_calls:
            - call: "POST /retailers"
              payload: { legal_name: "Northgate Markets" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "FAX", declared_count: 10, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: 10, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-01" }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: 10, postmark_window_start: "2026-07-31", postmark_window_end: "2026-07-01" }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: -1, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
            - call: "POST /submissions"
              payload: { retailer_id: "${ret_id}", channel: "MAIL", declared_count: 10, postmark_window_start: "2026-07-01", postmark_window_end: "2026-07-31" }
              as: IntakeClerk
              as_user_id: "clerk-1"
          assert:
            - "trigger calls 1-4 each return 400 ERR_INVALID_REQUEST"
            - "trigger call 5 returns 201 with data.intake_status == \"RECEIVED\" and data.settlement_status == \"PENDING\" — the same window is accepted once ordered"
            - "trigger call 5: data.verified_count == 0, data.count_variance_pct == 0.00, data.hold_reason == null, data.sorted_lot_count == 0, data.declared_face_value_cents == 0, data.valuation_method == \"FULL_COUNT\""

      - name: purchase_data_record_is_immutable_and_reusable
        claim_type: immutability
        grounds:
          - entities.PurchaseDataRecord
          - endpoints.POST./purchase-data-records
          - calculations.misredemption_match
        distinguishing_aspect: |
          PurchaseDataRecord is the scaffold's only common_fields: false entity:
          its response carries id and created_at but no updated_at and no
          version, there is no PATCH/PUT/DELETE route for it anywhere in §1.5,
          and being selected by an adjudication leaves the row byte-identical —
          the matcher names the record on the item rather than consuming it.
        test_recipe:
          setup:
            - "manufacturer, retailer, ACTIVE offer (face 50, fee 7, units 1, exp 2026-12-31)"
            - "one MAIL submission of 1 coupon, count-verified, sorted into one lot of counted_qty 1"
            - "one POS basket under ref POS-1 with qualifying_units 1, and one captured coupon quoting POS-1"
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kellwood Foods", gs1_company_prefix: "038000" }
              as: ClearinghouseAdmin
              as_user_id: "admin-1"
              captures: { mfr_id: $.data.id }
