            - "GET /fleet/vehicles/${veh_pgm}/valuation -> data.mileage_band == \"OVER_SOFT\""
            - "The two variants on the SAME vehicle differ by exactly 336000 cents (2236000 - 1900000)"
            - "GET /fleet/vehicles/${veh_rsk}/valuation -> data.policy_net_book_value_cents == 1900000"
            - "GET /fleet/vehicles/${veh_rsk}/valuation -> data.program_guaranteed_value_cents == 0"
            - "GET /fleet/vehicles/${veh_rsk}/valuation -> data.applied_variant == \"POLICY_SCHEDULE\""
            - "GET /fleet/vehicles/${veh_rsk}/valuation -> data.net_book_value_cents == 1900000"
            - "GET /fleet/vehicles/${veh_rsk}/valuation -> data.accumulated_depreciation_cents == 900000"
            - "GET /fleet/vehicles/${veh_pgm} -> data.net_book_value_cents == 2236000 while GET /fleet/vehicles/${veh_rsk} -> data.net_book_value_cents == 1900000 for byte-identical cost, odometer and dates"

      - name: fleet_plan_forward_planned_vs_chronological_actual_divergence
