              as: BoardMember
              as_user_id: "board-1"
              captures: { a_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Del Egate", employee_number: "E-C-490", home_country_code: "US", home_state_code: "CA", hire_date: "2020-01-06", birth_date: "1995-04-04" }
