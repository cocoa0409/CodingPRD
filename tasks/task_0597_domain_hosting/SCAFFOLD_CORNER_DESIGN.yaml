  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: domain_search_prices_a_premium_short_label
        claim_type: constants_applied
        grounds:
          - calculations.domain_base_price
          - entities.Domain.fields.is_premium
          - endpoints[GET /registrar/domain-search]
        distinguishing_aspect: "A 3-character label is premium: 'abc'.com prices at 1199 * PREMIUM_MULTIPLIER(5) = 5995 cents, while the 7-character 'example'.com prices at the plain 1199."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /registrar/domain-search"
              payload: { domain_name: "abc", tld: "com" }
              as: Anonymous
            - call: "GET /registrar/domain-search"
              payload: { domain_name: "example", tld: "com" }
              as: Anonymous
          assert:
            - "for 'abc': available == true, is_premium == true, base_year_price_cents == 5995, fqdn == 'abc.com'"
            - "for 'example': available == true, is_premium == false, base_year_price_cents == 1199"

      - name: renewal_from_active_extends_the_existing_term
        claim_type: correct_result
        grounds:
          - calculations.domain_renewal_charge
          - state_machines.Domain.lifecycle_status.ACTIVE_to_ACTIVE
          - calculations.invoice_total
        distinguishing_aspect: "The EXTEND branch: renewing an ACTIVE domain for 2 years adds 730 days to expires_at (2027-05-01 -> 2029-04-30) rather than resetting the baseline to the clock, and bills 2 * 1199 = 2398 cents with no redemption fee."
        test_recipe:
          setup: ["ACTIVE example.com, expires_at 2027-05-01, clock still at the 2026-05-01 default."]
          setup_api_calls:
            - call: "POST /registrar/accounts"
              payload: { email: "ext@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/domains"
              payload: { account_id: "${acct_id}", domain_name: "example", tld: "com", term_years: 1, registrant_name: "Ada L", registrant_email: "ada@corp.example", auto_renew: false }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /registrar/invoices/${inv_id}/pay"
              payload: { use_credit: false }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "GET /registrar/domains/${dom_id}"
              payload: {}
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { dom_v: $.data.version }
          trigger:
            - call: "POST /registrar/domains/${dom_id}/renew"
              payload: { term_years: 2, expected_domain_version: "${dom_v}" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { renew_inv: "$.data[0].id" }
          assert:
            - "Domain.${dom_id}.lifecycle_status == 'ACTIVE'"
            - "Domain.${dom_id}.expires_at == '2029-04-30T00:00:00.000Z' (2027-05-01 + 730 days — EXTEND, not RESET)"
            - "Invoice.${renew_inv}.subtotal_cents == 2398 and tax_cents == 198 and service_fee_cents == 0 and total_cents == 2596"
            - "the invoice has exactly one line item with item_type == 'DOMAIN_RENEWAL' and quantity == 2 (no REDEMPTION_FEE line)"

      - name: bandwidth_exactly_at_quota_does_not_trip_over_quota
        claim_type: boundary_edge
        grounds:
          - state_machines.HostingSubscription.ACTIVE_to_OVER_QUOTA
          - calculations.hosting_bandwidth_overage
          - entities.HostingSubscription.fields.bandwidth_used_mb
        distinguishing_aspect: "The OVER_QUOTA trigger is strictly greater-than: a single 10240 MB record on a 10240 MB quota leaves the subscription ACTIVE with provisional_overage_cents 0; one more MB flips it to OVER_QUOTA."
        test_recipe:
          setup: ["ACTIVE DELUXE subscription (bandwidth_quota_mb 10240) with its first BillingPeriod [2026-05-01, 2026-05-31)."]
          setup_api_calls:
            - call: "POST /registrar/hosting-plans"
              payload: { plan_code: "DLX-C4", tier: "DELUXE", storage_quota_mb: 5120, bandwidth_quota_mb: 10240, monthly_price_cents: 4999, included_mailboxes: 5, included_ssl: true, overage_rate_cents_per_gb: 200 }
              as: BillingAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /registrar/accounts"
              payload: { email: "quota@corp.example", company_name: "Corp Example" }
              as: Anonymous
              captures: { acct_id: $.data.id }
            - call: "POST /registrar/accounts/${acct_id}/payment-method"
              payload: { card_token: "tok_visa_4242" }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "POST /registrar/hosting-subscriptions"
              payload: { account_id: "${acct_id}", plan_id: "${plan_id}" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { sub_id: $.data.id }
            - call: "GET /registrar/invoices"
              payload: { account_id: "${acct_id}", status: "ISSUED" }
              as: Registrant
              as_user_id: "${acct_id}"
              captures: { inv_sub: "$.data[0].id" }
            - call: "POST /registrar/invoices/${inv_sub}/pay"
              payload: { use_credit: false }
              as: Registrant
              as_user_id: "${acct_id}"
            - call: "GET /registrar/hosting-subscriptions/${sub_id}/billing-periods"
              payload: {}
              as: BillingAdmin
              captures: { p0_id: "$.data[0].id" }
          trigger:
            - call: "POST /registrar/hosting-subscriptions/${sub_id}/usage-records"
              payload: { metric: "BANDWIDTH_MB", amount_mb: 10240, recorded_at: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /registrar/hosting-subscriptions/${sub_id}/usage-records"
              payload: { metric: "BANDWIDTH_MB", amount_mb: 1, recorded_at: "2026-05-03T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "after the 10240 MB record: HostingSubscription.${sub_id}.bandwidth_used_mb == 10240 and status == 'ACTIVE' (equal is NOT over)"
            - "after the 10240 MB record: BillingPeriod.${p0_id}.provisional_overage_cents == 0"
            - "after the extra 1 MB record: HostingSubscription.${sub_id}.bandwidth_used_mb == 10241 and status == 'OVER_QUOTA'"
            - "after the extra 1 MB record: BillingPeriod.${p0_id}.provisional_overage_cents == 0 (round_half_up(1/1024 * 200) == 0)"

      - name: mailbox_landing_exactly_on_the_storage_quota_is_allowed
