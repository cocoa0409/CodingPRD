# =============================================================================
# §1.8 Scaffold Difficulty Design — Drywall & Interior-Finish Stocking
# Test Targeting Index: 9 rules × 2 instances each = 18 instances.
# Every instance's grounds resolve into SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================

scaffold_difficulty_design:
  # ------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (two different entity domains)
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: takeoff_lock_reprices_quoted_lines
        grounds:
          - calculations.line_bundle_count
          - state_machines.Takeoff.SUBMITTED_to_LOCKED
          - entities.TakeoffLine.fields.quoted_line_cents
          - entities.TakeoffLine.fields.final_line_cents
        distinguishing_aspect: |
          Variant divergence lives on the Takeoff entity domain: the same line set,
          priced once at submit with current Product.unit_price_cents_per_sheet and
          once at lock after the price has moved, produces quoted_line_cents !=
          final_line_cents for identical input sheets and waste.
        test_recipe:
          setup:
            - "Account A1 ACTIVE with default_waste_pct_bp = 1000 (10%)"
            - "Project P1 on A1 with distance_miles=10, framing_pct_complete=50"
            - "Product PR1 REGULAR, sheets_per_bundle=20, unit_price_cents_per_sheet=1500, lead_time_days=0"
            - "Takeoff T1 on P1 (waste_pct_bp_override=null) with one line sheet_count=50"
            - "T1 submitted (provisional pricing captured)"
            - "PR1 price updated to 1700 before T1 is locked"
          setup_api_calls:
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Acme Drywall", credit_limit_cents: 5000000, default_waste_pct_bp: 1000 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "Tower A", distance_miles: 10, framing_pct_complete: 50 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 50 }
              as: EstimatorUser
              captures: { line_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
            - call: "PATCH /supply/products/${prod_id}"
              payload: { unit_price_cents_per_sheet: 1700 }
              as: WarehouseManager
            - call: "GET /supply/takeoffs/${tk_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk_ver: $.data.version }
          trigger:
            - call: "POST /supply/takeoffs/${tk_id}/lock"
              payload: { expected_takeoff_version: "${tk_ver}" }
              as: EstimatorUser
          assert:
            - "Takeoff.${tk_id}.quoted_subtotal_cents == 90000"
            - "Takeoff.${tk_id}.final_subtotal_cents == 102000"
            - "Takeoff.${tk_id}.quoted_subtotal_cents != Takeoff.${tk_id}.final_subtotal_cents"

      - name: freight_provisional_vs_dispatch_final_differ
        grounds:
          - calculations.freight_tier_cents
          - state_machines.StockingOrder.DRAFT_to_SCHEDULED
          - state_machines.StockingOrder.SCHEDULED_to_DISPATCHED
          - entities.StockingOrder.fields.freight_charge_cents
        distinguishing_aspect: |
          Variant divergence lives on the StockingOrder/freight domain — not Takeoff.
          Same (project.distance_miles) produces provisional freight at SCHEDULED
          without fuel surcharge, and final freight at DISPATCHED with
          FUEL_SURCHARGE_BP applied; the two values differ.
        test_recipe:
          setup:
            - "Account ACTIVE, Project with distance_miles=10, framing=50"
            - "Product REGULAR 20 sheets/bundle, 1500c/sheet"
            - "Takeoff with sheet_count=50, submitted, locked (final_subtotal=90000 with same price)"
            - "BoomTruck cap 100 bundles / 100000 lbs"
            - "Project opened for stocking"
            - "StockingOrder created for that takeoff, scheduled_date=2026-08-02, shift=AM, with one drop of 3 bundles"
            - "Logical clock at 2026-08-01"
          setup_api_calls:
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CreditManager
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Bravo Builders", credit_limit_cents: 5000000, default_waste_pct_bp: 1000 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "Tower B", distance_miles: 10, framing_pct_complete: 50 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 50 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk_ver: $.data.version }
            - call: "POST /supply/takeoffs/${tk_id}/lock"
              payload: { expected_takeoff_version: "${tk_ver}" }
              as: EstimatorUser
            - call: "POST /supply/projects/${proj_id}/open-stocking"
              payload: {}
              as: Foreman
            - call: "POST /supply/boom-trucks"
              payload: { truck_code: "BT-01", max_bundle_capacity: 100, max_weight_lbs: 100000 }
              as: DispatcherUser
              captures: { truck_id: $.data.id }
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj_id}", takeoff_id: "${tk_id}", scheduled_date: "2026-08-02", shift_window: "AM", boom_truck_id: "${truck_id}" }
              as: DispatcherUser
              captures: { ord_id: $.data.id }
            - call: "POST /supply/stocking-orders/${ord_id}/drops"
              payload: { floor_label: "L1", room_label: "101", product_id: "${prod_id}", bundle_count: 3 }
              as: DispatcherUser
          trigger:
            - call: "POST /supply/stocking-orders/${ord_id}/schedule"
              payload: {}
              as: DispatcherUser
              captures: { freight_provisional: $.data.freight_charge_cents }
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: CreditManager
            - call: "POST /supply/stocking-orders/${ord_id}/dispatch"
              payload: {}
              as: DispatcherUser
              captures: { freight_final: $.data.freight_charge_cents }
          assert:
            - "captured freight_provisional == 9500"
            - "captured freight_final == 10213"
            - "freight_final != freight_provisional"

  # ------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes)
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: freight_tier_straddles_tier2_boundary
        grounds:
          - calculations.freight_tier_cents
        distinguishing_aspect: |
          Mode (a) — tiered-rate formula with >=3 inputs (distance, tier flats,
          per-mile rates) and non-linear interaction across tier boundaries.
          A project at distance_miles=50 (TIER2) prices differently from
          distance_miles=25 (TIER1) and 100 (TIER3) even though the inputs
          are only distances.
        test_recipe:
          setup:
            - "Three accounts/projects with distance_miles 25, 50, 100 respectively"
            - "Identical REGULAR product, takeoffs, locked takeoffs, stocking orders on each project with one drop of 1 bundle"
            - "Logical clock at 2026-08-01"
          setup_api_calls:
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CreditManager
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Tier Acct", credit_limit_cents: 9000000, default_waste_pct_bp: 0 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P25", distance_miles: 25, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj25: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P50", distance_miles: 50, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj50: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P100", distance_miles: 100, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj100: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj25}" }
              as: EstimatorUser
              captures: { tk25: $.data.id }
            - call: "POST /supply/takeoffs/${tk25}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 20 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk25}/submit"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk25}"
              payload: {}
              as: EstimatorUser
              captures: { tk25_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk25}/lock"
              payload: { expected_takeoff_version: "${tk25_v}" }
              as: EstimatorUser
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj50}" }
              as: EstimatorUser
              captures: { tk50: $.data.id }
            - call: "POST /supply/takeoffs/${tk50}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 20 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk50}/submit"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk50}"
              payload: {}
              as: EstimatorUser
              captures: { tk50_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk50}/lock"
              payload: { expected_takeoff_version: "${tk50_v}" }
              as: EstimatorUser
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj100}" }
              as: EstimatorUser
              captures: { tk100: $.data.id }
            - call: "POST /supply/takeoffs/${tk100}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 20 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk100}/submit"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk100}"
              payload: {}
              as: EstimatorUser
              captures: { tk100_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk100}/lock"
              payload: { expected_takeoff_version: "${tk100_v}" }
              as: EstimatorUser
            - call: "POST /supply/projects/${proj25}/open-stocking"
              payload: {}
              as: Foreman
            - call: "POST /supply/projects/${proj50}/open-stocking"
              payload: {}
              as: Foreman
            - call: "POST /supply/projects/${proj100}/open-stocking"
              payload: {}
              as: Foreman
            - call: "POST /supply/boom-trucks"
              payload: { truck_code: "BT-25", max_bundle_capacity: 100, max_weight_lbs: 100000 }
              as: DispatcherUser
              captures: { tr25: $.data.id }
            - call: "POST /supply/boom-trucks"
              payload: { truck_code: "BT-50", max_bundle_capacity: 100, max_weight_lbs: 100000 }
              as: DispatcherUser
              captures: { tr50: $.data.id }
            - call: "POST /supply/boom-trucks"
              payload: { truck_code: "BT-100", max_bundle_capacity: 100, max_weight_lbs: 100000 }
              as: DispatcherUser
              captures: { tr100: $.data.id }
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj25}", takeoff_id: "${tk25}", scheduled_date: "2026-08-02", shift_window: "AM", boom_truck_id: "${tr25}" }
              as: DispatcherUser
              captures: { ord25: $.data.id }
            - call: "POST /supply/stocking-orders/${ord25}/drops"
              payload: { floor_label: "L1", room_label: "101", product_id: "${prod_id}", bundle_count: 1 }
              as: DispatcherUser
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj50}", takeoff_id: "${tk50}", scheduled_date: "2026-08-02", shift_window: "AM", boom_truck_id: "${tr50}" }
              as: DispatcherUser
              captures: { ord50: $.data.id }
            - call: "POST /supply/stocking-orders/${ord50}/drops"
              payload: { floor_label: "L1", room_label: "101", product_id: "${prod_id}", bundle_count: 1 }
              as: DispatcherUser
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj100}", takeoff_id: "${tk100}", scheduled_date: "2026-08-02", shift_window: "AM", boom_truck_id: "${tr100}" }
              as: DispatcherUser
              captures: { ord100: $.data.id }
            - call: "POST /supply/stocking-orders/${ord100}/drops"
              payload: { floor_label: "L1", room_label: "101", product_id: "${prod_id}", bundle_count: 1 }
              as: DispatcherUser
          trigger:
            - call: "POST /supply/stocking-orders/${ord25}/schedule"
              payload: {}
              as: DispatcherUser
              captures: { f25: $.data.freight_charge_cents }
            - call: "POST /supply/stocking-orders/${ord50}/schedule"
              payload: {}
              as: DispatcherUser
              captures: { f50: $.data.freight_charge_cents }
            - call: "POST /supply/stocking-orders/${ord100}/schedule"
              payload: {}
              as: DispatcherUser
              captures: { f100: $.data.freight_charge_cents }
          assert:
            - "captured f25 == 9500"
            - "captured f50 == 27500"
            - "captured f100 == 47500"
            - "f25 != f50 and f50 != f100"

      - name: restock_fee_partial_bundle_uses_higher_rate
        grounds:
          - calculations.restock_fee
          - state_machines.BundleReturn.PENDING_INSPECTION_to_ACCEPTED
        distinguishing_aspect: |
          Mode (a) variant — nested conditional branches on entity state
          (days_since_stocked vs RESTOCK_FREE_DAYS, loose_sheets_returned == 0 vs
          > 0) selecting one of three rate rows; the formula is not a simple
          tiered rate on distance, it is a multi-condition rate selector on the
          BundleReturn entity domain.
        test_recipe:
          setup:
            - "Stocked order on a REGULAR product (20 sheets/bundle, 1500c/sheet)"
            - "Order stocked on 2026-08-02 (so days_since_stocked > 7 on 2026-08-12)"
            - "Two BundleReturns filed against same order/product: R_full bundles_returned=2, loose=0; R_part bundles_returned=1, loose=5"
            - "Logical clock set to 2026-08-12 before accepts"
          setup_api_calls:
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CreditManager
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "Restock Co", credit_limit_cents: 9000000, default_waste_pct_bp: 0 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 60 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 100 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk_id}/lock"
              payload: { expected_takeoff_version: "${tk_v}" }
              as: EstimatorUser
            - call: "POST /supply/projects/${proj_id}/open-stocking"
              payload: {}
              as: Foreman
            - call: "POST /supply/boom-trucks"
              payload: { truck_code: "BT-01", max_bundle_capacity: 100, max_weight_lbs: 100000 }
              as: DispatcherUser
              captures: { truck_id: $.data.id }
            - call: "POST /supply/stocking-orders"
              payload: { project_id: "${proj_id}", takeoff_id: "${tk_id}", scheduled_date: "2026-08-02", shift_window: "AM", boom_truck_id: "${truck_id}" }
              as: DispatcherUser
              captures: { ord_id: $.data.id }
            - call: "POST /supply/stocking-orders/${ord_id}/drops"
              payload: { floor_label: "L1", room_label: "101", product_id: "${prod_id}", bundle_count: 5 }
              as: DispatcherUser
            - call: "POST /supply/stocking-orders/${ord_id}/schedule"
              payload: {}
              as: DispatcherUser
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T08:00:00Z" }
              as: CreditManager
            - call: "POST /supply/stocking-orders/${ord_id}/dispatch"
              payload: {}
              as: DispatcherUser
            - call: "POST /supply/stocking-orders/${ord_id}/mark-stocked"
              payload: {}
              as: Foreman
            - call: "POST /supply/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: CreditManager
            - call: "POST /supply/bundle-returns"
              payload: { stocking_order_id: "${ord_id}", product_id: "${prod_id}", bundles_returned: 2, loose_sheets_returned: 0 }
              as: WarehouseManager
              captures: { r_full: $.data.id }
            - call: "POST /supply/bundle-returns"
              payload: { stocking_order_id: "${ord_id}", product_id: "${prod_id}", bundles_returned: 1, loose_sheets_returned: 5 }
              as: WarehouseManager
              captures: { r_part: $.data.id }
          trigger:
            - call: "POST /supply/bundle-returns/${r_full}/accept"
              payload: {}
              as: WarehouseManager
              captures: { fee_full: $.data.restock_fee_cents, credit_full: $.data.credit_cents }
            - call: "POST /supply/bundle-returns/${r_part}/accept"
              payload: {}
              as: WarehouseManager
              captures: { fee_part: $.data.restock_fee_cents, credit_part: $.data.credit_cents }
          assert:
            - "captured fee_full == 9000"
            - "captured credit_full == 51000"
            - "captured fee_part == 9375"
            - "captured credit_part == 28125"
            - "fee_full != fee_part (different rate rows applied)"

  # ------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: takeoff_cancel_releases_for_replacement
        grounds:
          - state_machines.Takeoff
        distinguishing_aspect: |
          Takeoff machine is non-linear: SUBMITTED → CANCELLED is a revert path
          (not a strict forward pipeline), and DRAFT → CANCELLED also exists; a
          cancelled takeoff releases the project so a fresh takeoff can be
          submitted and locked in its place. Distinct entity from the second
          instance's StockingOrder.
        test_recipe:
          setup:
            - "Account ACTIVE, Project with framing_pct_complete=50"
            - "Product REGULAR"
            - "Takeoff T1 with a line, submitted (SUBMITTED)"
          setup_api_calls:
            - call: "POST /supply/contractor-accounts"
              payload: { company_name: "SM Co", credit_limit_cents: 5000000, default_waste_pct_bp: 1000 }
              as: CreditManager
              captures: { acct_id: $.data.id }
            - call: "POST /supply/products"
              payload: { sku: "REG-4x8-1/2", board_kind: "REGULAR", length_ft: 8, width_ft: 4, thickness_in: "1/2", sheets_per_bundle: 20, unit_price_cents_per_sheet: 1500, lead_time_days: 0 }
              as: WarehouseManager
              captures: { prod_id: $.data.id }
            - call: "POST /supply/projects"
              payload: { account_id: "${acct_id}", jobsite_name: "P", distance_miles: 10, framing_pct_complete: 50 }
              as: EstimatorUser
              captures: { proj_id: $.data.id }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 40 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk_id}/submit"
              payload: {}
              as: EstimatorUser
          trigger:
            - call: "POST /supply/takeoffs/${tk_id}/cancel"
              payload: {}
              as: EstimatorUser
              captures: { tk_status: $.data.status }
            - call: "POST /supply/takeoffs"
              payload: { project_id: "${proj_id}" }
              as: EstimatorUser
              captures: { tk2_id: $.data.id }
            - call: "POST /supply/takeoffs/${tk2_id}/lines"
              payload: { product_id: "${prod_id}", sheet_count: 40 }
              as: EstimatorUser
            - call: "POST /supply/takeoffs/${tk2_id}/submit"
              payload: {}
              as: EstimatorUser
            - call: "GET /supply/takeoffs/${tk2_id}"
              payload: {}
              as: EstimatorUser
              captures: { tk2_v: $.data.version }
            - call: "POST /supply/takeoffs/${tk2_id}/lock"
              payload: { expected_takeoff_version: "${tk2_v}" }
              as: EstimatorUser
              captures: { tk2_status: $.data.status }
          assert:
            - "captured tk_status == CANCELLED"
            - "captured tk2_status == LOCKED"

      - name: stocking_order_cancel_from_scheduled_releases_slot
        grounds:
          - state_machines.StockingOrder
        distinguishing_aspect: |
          StockingOrder machine is non-linear: SCHEDULED → CANCELLED is a revert
          path that releases the boom-truck reservation, allowing another order
          to take the same (truck, date, shift) slot. Distinct entity from the
          first instance's Takeoff.
        test_recipe:
          setup:
            - "Locked takeoff and open-stocking project"
            - "One boom truck BT-01"
            - "Stocking order O1 SCHEDULED on (BT-01, 2026-08-02, AM)"
