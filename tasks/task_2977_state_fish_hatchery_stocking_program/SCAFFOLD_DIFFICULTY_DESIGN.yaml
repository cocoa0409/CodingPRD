            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-24T00:00:01Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /stocking-events/${event3_id}/load"
              payload: { loaded_at: "2026-09-24T00:00:01Z", load_water_temp_c: 12.0 }
