scenario: |
  2402. Directors and Officers Liability Underwriting & Claims (management liability insurer): risk assessment from financial disclosures, governance structure, litigation history and sector exposure, coverage structure across individual, company reimbursement and entity securities coverage, exclusion negotiation for conduct, prior acts and insured-versus-insured scenarios, tower participation with excess layer following-form and difference-in-conditions terms, claim notice timing under claims-made policies with circumstance reporting, defense cost advancement and allocation between covered and uncovered matters, settlement consent and hammer clause application, run-off and tail coverage on a change of control

domain_name: directors-officers-liability
api_prefix: /dno

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - ops_run_checkpoint
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
#
# Entities declared with `common_fields: true` implicitly carry four system fields:
#   id         string   server-minted, never accepted from the client
#   created_at datetime stamped from the logical clock at insert
#   updated_at datetime stamped from the logical clock on every successful write
#   version    integer  starts at 1 on insert and increments by exactly 1 on every
#                       successful write to that row (the OCC token of §1.2.1)
# Entities declared with `common_fields: false` carry only `id` and `created_at`. Every
# client-supplied field on them is write-once at creation: they expose no update endpoint, take
# no OCC token and have no `version`. Their `source: computed` fields are refreshed only by a
# system recomputation declared in §1.2 (LitigationEvent.weight_units, rewritten by a score run).
# =============================================================================
entities:
  - name: Insured
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        required: true
        description: Registered name of the prospective or bound insured organization.
      - name: sector_code
        type: enum
        source: input
        required: true
        description: Industry sector used to select the sector exposure multiplier.
        constraints: "one of TECH, BIOTECH, FINANCIAL, ENERGY, INDUSTRIAL, CONSUMER"
      - name: exchange_listing
        type: enum
        source: input
        required: true
        description: Securities listing status; drives Side C entity securities eligibility and load.
        constraints: "one of LISTED, PRIVATE, NONE"
      - name: market_cap_usd
        type: number
        source: input
        required: true
        description: Reported market capitalization in USD; 0 permitted for PRIVATE/NONE.
        constraints: ">= 0"
      - name: fiscal_year_end
        type: string
        source: input
        required: true
        description: Fiscal year end as MM-DD, used to order disclosure packages by fiscal_year.
      - name: control_status
        type: enum
        source: input
        required: false
        description: Change-of-control posture of the insured; gates binding and run-off endorsement.
        default: INDEPENDENT
        constraints: "one of INDEPENDENT, CHANGE_OF_CONTROL_ANNOUNCED, ACQUIRED"
      - name: change_of_control_date
        type: datetime
        source: input
        required: false
        description: Effective date of the announced or completed transaction; required when control_status != INDEPENDENT.
        default: null
      - name: entity_capacity_cap_usd
        type: number
        source: input
        required: true
        description: Maximum aggregate Side C (entity securities) limit this insurer will carry across overlapping policy periods for this insured.
        constraints: "> 0"
      - name: aggregate_bound_side_c_usd
        type: number
        source: computed
        required: false
        description: Sum of SIDE_C CoveragePart.limit_usd over this insured's policies whose coverage_status IN {INCEPTED, ACTIVE, RUNOFF} — see calculations.entity_side_c_capacity.
        default: 0
      - name: available_side_c_capacity_usd
        type: number
        source: computed
        required: false
        description: entity_capacity_cap_usd - aggregate_bound_side_c_usd, floored at 0.
        default: 0
      - name: capacity_posture
        type: enum
        source: computed
        required: false
        description: Derived posture from utilization ratio — see calculations.entity_side_c_capacity.
        default: OPEN
        constraints: "one of OPEN, RESTRICTED, EXHAUSTED"
      - name: open_policy_count
        type: integer
        source: computed
        required: false
        description: Count of this insured's policies whose coverage_status IN {INCEPTED, ACTIVE, RUNOFF}.
        default: 0

  - name: DisclosurePackage
    parent: Insured
    common_fields: true
    fields:
      - name: insured_id
        type: string
        source: input
        required: true
        description: "FK -> Insured.id; the organization whose financial disclosures these are."
      - name: fiscal_year
        type: integer
        source: input
        required: true
        description: Fiscal year the package covers; ordering key for latest-package selection.
        constraints: ">= 2000"
      - name: filed_date
        type: datetime
        source: input
        required: true
        description: Date the disclosure was filed; used for the staleness check at scoring time.
      - name: restatement_flag
        type: boolean
        source: input
        required: true
        description: Whether the period included a restatement of previously issued financials.
      - name: material_weakness_count
        type: integer
        source: input
        required: true
        description: Count of reported material weaknesses in internal control.
        constraints: ">= 0"
      - name: going_concern_flag
        type: boolean
        source: input
        required: true
        description: Whether the auditor raised substantial doubt about going concern.
      - name: negative_operating_cash_flow_flag
        type: boolean
        source: input
        required: true
        description: Whether operating cash flow for the period was negative.
      - name: debt_to_equity
        type: number
        source: input
        required: true
        description: Debt-to-equity ratio at period end.
        constraints: ">= 0"
      - name: independent_director_ratio
        type: number
        source: input
        required: true
        description: Fraction of the board that is independent, 0.00-1.00.
        constraints: "0 <= value <= 1"
      - name: dual_class_shares_flag
        type: boolean
        source: input
        required: true
        description: Whether a dual-class share structure is in place.
      - name: staggered_board_flag
        type: boolean
        source: input
        required: true
        description: Whether the board is classified/staggered.
      - name: combined_ceo_chair_flag
        type: boolean
        source: input
        required: true
        description: Whether the CEO also serves as board chair.
      - name: auditor_change_flag
        type: boolean
        source: input
        required: true
        description: Whether the independent auditor changed during the period.
      - name: financial_subscore
        type: number
        source: computed
        required: false
        description: Financial component of the risk score for this package — see calculations.governance_risk_assessment.
        default: 0
      - name: governance_subscore
        type: number
        source: computed
        required: false
        description: Governance component of the risk score for this package — see calculations.governance_risk_assessment.
        default: 0

  - name: LitigationEvent
    parent: Insured
    common_fields: false
    fields:
      - name: insured_id
        type: string
        source: input
        required: true
        description: "FK -> Insured.id; the organization named in this matter."
      - name: case_type
        type: enum
        source: input
        required: true
        description: Category of the litigation matter; selects the litigation weight.
        constraints: "one of SECURITIES_CLASS_ACTION, DERIVATIVE, REGULATORY_ENFORCEMENT, MERGER_OBJECTION, EMPLOYMENT_PRACTICES, FIDUCIARY"
      - name: filed_date
        type: datetime
        source: input
        required: true
        description: Filing date of the matter; recency is measured from the logical clock at scoring time.
      - name: resolved_date
        type: datetime
        source: input
        required: false
        description: Resolution date; null means the matter is still open.
        default: null
      - name: indemnity_paid_usd
        type: number
        source: input
        required: false
        description: Indemnity already paid on this matter by any carrier or by the insured.
        default: 0
        constraints: ">= 0"
      - name: outcome
        type: enum
        source: input
        required: false
        description: Disposition of the matter; null while open.
        default: null
        constraints: "one of DISMISSED, SETTLED, JUDGMENT, PENDING"
      - name: weight_units
        type: number
        source: computed
        required: false
        description: Recency-graded weight contributed by this matter at the last scoring run — see calculations.governance_risk_assessment.
        default: 0

  - name: Submission
    parent: Insured
    common_fields: true
    fields:
      - name: insured_id
        type: string
        source: input
        required: true
        description: "FK -> Insured.id; the organization seeking management liability cover."
      - name: requested_limit_usd
        type: number
        source: input
        required: true
        description: Requested primary shared aggregate limit.
        constraints: "> 0"
      - name: requested_retention_usd
        type: number
        source: input
        required: true
        description: Requested per-claim retention applicable to Side B and Side C.
        constraints: ">= 0"
      - name: requested_side_c_sublimit_usd
        type: number
        source: input
        required: true
        description: Requested entity securities (Side C) sublimit; 0 means no Side C part is created.
        constraints: ">= 0"
      - name: requested_program_target_limit_usd
        type: number
        source: input
        required: true
        description: Total tower limit the broker intends to place across primary and excess layers.
        constraints: ">= requested_limit_usd"
      - name: requested_period_start
        type: datetime
        source: input
        required: true
        description: Requested inception date of the policy period.
      - name: requested_period_end
        type: datetime
        source: input
        required: true
        description: Requested expiry of the policy period; must be strictly after requested_period_start.
      - name: retroactive_date
        type: datetime
        source: input
        required: true
        description: Prior-acts retroactive date; wrongful acts before this instant are excluded.
      - name: erp_days
        type: integer
        source: input
        required: false
        description: Extended reporting period in days added to period_end for claim notice and circumstance reporting.
        default: 90
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        required: false
        description: Submission lifecycle state.
        default: DRAFT
        constraints: "one of DRAFT, SCORED, QUOTED, BOUND, EXPIRED"
      - name: risk_score
        type: number
        source: computed
        required: false
        description: Composite risk score from the last scoring run — see calculations.governance_risk_assessment.
        default: null
      - name: risk_band
        type: enum
        source: computed
        required: false
        description: Band derived from risk_score; selects the premium rate per exposure unit.
        default: null
        constraints: "one of LOW, MODERATE, ELEVATED, SEVERE"
      - name: score_variant
        type: enum
        source: input
        required: false
        description: Variant used by the last scoring run.
        default: null
        constraints: "one of INDICATIVE, UNDERWRITTEN"
      - name: scored_at
        type: datetime
        source: system
        required: false
        description: Logical-clock instant of the last scoring run.
        default: null
      - name: disclosure_packages_considered
        type: integer
        source: computed
        required: false
        description: Number of DisclosurePackage rows the last scoring run consumed.
        default: 0
      - name: litigation_units
        type: number
        source: computed
        required: false
        description: Litigation subscore contributed by the last scoring run, after the 70-point cap.
        default: 0
      - name: expires_at
        type: datetime
        source: computed
        required: false
        description: created_at + 90 days; the submission auto-expires at or after this instant on an ops run.
        default: null

  - name: Quote
    parent: Submission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: input
        required: true
        description: "FK -> Submission.id; the submission this quote answers."
      - name: offered_limit_usd
        type: number
        source: input
        required: true
        description: Primary shared aggregate limit offered by the underwriter.
        constraints: "> 0"
      - name: offered_retention_usd
        type: number
        source: input
        required: true
        description: Per-claim retention offered; drives the retention credit.
        constraints: ">= 0"
      - name: offered_side_c_sublimit_usd
        type: number
        source: input
        required: true
        description: Entity securities sublimit offered; must not exceed offered_limit_usd.
        constraints: ">= 0"
      - name: quote_valid_until
        type: datetime
        source: input
        required: true
        description: Instant at or after which the quote can no longer be accepted.
      - name: risk_band_at_quote
        type: enum
        source: system
        required: false
        description: Snapshot of Submission.risk_band at quote issuance; the rate is pinned to this snapshot even if the submission is re-scored later.
        constraints: "one of LOW, MODERATE, ELEVATED, SEVERE"
      - name: net_premium_usd
        type: number
        source: computed
        required: false
        description: Technical premium before commission grossing-up — see calculations.net_premium_quotation.
        default: 0
      - name: gross_premium_usd
        type: number
        source: computed
        required: false
        description: Commission-inclusive premium — see calculations.premium_grossup_and_tax.
        default: 0
      - name: broker_commission_usd
        type: number
        source: computed
        required: false
        description: gross_premium_usd - net_premium_usd, taken as the residual so the three amounts always reconcile.
        default: 0
      - name: premium_tax_usd
        type: number
        source: computed
        required: false
        description: Surplus lines tax on the gross premium.
        default: 0
      - name: total_payable_usd
        type: number
        source: computed
        required: false
        description: gross_premium_usd + premium_tax_usd.
        default: 0
      - name: status
        type: enum
        source: system
        required: false
        description: Quote lifecycle state.
        default: OFFERED
        constraints: "one of OFFERED, ACCEPTED, LAPSED, SUPERSEDED"
      - name: issued_by_user_id
        type: string
        source: system
        required: false
        description: X-User-ID of the Underwriter who issued the quote; recorded for audit only.
        default: null

  - name: ExclusionTerm
    parent: Quote
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        required: true
        description: "FK -> Quote.id; the quote whose wording is being negotiated."
      - name: exclusion_type
        type: enum
        source: input
        required: true
        description: Which exclusion is under negotiation.
        constraints: "one of CONDUCT, PRIOR_ACTS, INSURED_VS_INSURED, BODILY_INJURY, REGULATORY"
      - name: wording_variant
        type: enum
        source: input
        required: true
        description: Currently proposed wording variant for this exclusion.
        constraints: "one of BROAD, FINAL_ADJUDICATION, NON_APPEALABLE_ADJUDICATION, DERIVATIVE_CARVEBACK, BANKRUPTCY_CARVEBACK, RETRO_DATE_FULL_PRIOR_ACTS, NONE"
      - name: premium_impact_pct
        type: number
        source: input
        required: true
        description: Fractional premium adjustment this wording carries if agreed; negative narrows cover, positive broadens it.
        constraints: "-0.25 <= value <= 0.25"
      - name: proposed_by_role
        type: enum
        source: system
        required: false
        description: Role that opened the negotiation on this term.
        constraints: "one of Underwriter, RiskManager"
      - name: last_actor_role
        type: enum
        source: system
        required: false
        description: Role that made the most recent proposal or counter; the next counter must come from the other role.
        constraints: "one of Underwriter, RiskManager"
      - name: round_count
        type: integer
        source: computed
        required: false
        description: Number of proposals and counters recorded on this term; the opening proposal counts as round 1.
        default: 1
      - name: status
        type: enum
        source: system
        required: false
        description: Negotiation state of this term.
        default: PROPOSED
        constraints: "one of PROPOSED, COUNTERED, AGREED, REJECTED, IMPASSE"
      - name: agreed_variant
        type: enum
        source: system
        required: false
        description: Wording variant frozen at agreement; null until status == AGREED.
        default: null
        constraints: "one of BROAD, FINAL_ADJUDICATION, NON_APPEALABLE_ADJUDICATION, DERIVATIVE_CARVEBACK, BANKRUPTCY_CARVEBACK, RETRO_DATE_FULL_PRIOR_ACTS, NONE"

  - name: Policy
    parent: Submission
    common_fields: true
    fields:
      - name: submission_id
        type: string
        source: system
        required: false
        description: "FK -> Submission.id; the submission that was bound."
      - name: insured_id
        type: string
        source: system
        required: false
        description: "FK -> Insured.id; copied from the submission at bind so capacity aggregation reads one field."
      - name: quote_id
        type: string
        source: system
        required: false
        description: "FK -> Quote.id; the accepted quote whose terms were bound."
      - name: policy_number
        type: string
        source: system
        required: false
        description: "Human-readable number DO-NNNNNN where NNNNNN is a zero-padded monotonic counter incremented once per bind, starting at 000001."
      - name: period_start
        type: datetime
        source: system
        required: false
        description: Inception instant copied from the submission; the coverage window is half-open [period_start, period_end).
      - name: period_end
        type: datetime
        source: system
        required: false
        description: Expiry instant copied from the submission; a notice stamped exactly at period_end is outside the period.
      - name: retroactive_date
        type: datetime
        source: system
        required: false
        description: Prior-acts date copied from the submission at bind.
      - name: erp_days
        type: integer
        source: system
        required: false
        description: Extended reporting period days copied from the submission at bind.
      - name: shared_aggregate_limit_usd
        type: number
        source: system
        required: false
        description: Primary shared aggregate limit copied from the accepted quote's offered_limit_usd.
      - name: aggregate_remaining_usd
        type: number
        source: computed
        required: false
        description: shared_aggregate_limit_usd - total_eroded_usd.
        default: 0
      - name: total_eroded_usd
        type: number
        source: computed
        required: false
        description: Sum of CoveragePart.eroded_usd across this policy's parts.
        default: 0
      - name: retention_usd
        type: number
        source: system
        required: false
        description: Per-claim retention copied from the accepted quote's offered_retention_usd.
      - name: gross_premium_usd
        type: number
        source: computed
        required: false
        description: Quote gross premium adjusted by agreed exclusion impacts — see calculations.bound_premium_exclusion_adjustment.
        default: 0
      - name: premium_due_date
        type: datetime
        source: computed
        required: false
        description: Bind instant + 30 days; an ops run at or after this instant with premium_status == INVOICED flips it to DELINQUENT.
        default: null
      - name: coverage_status
        type: enum
        source: system
        required: false
        description: Coverage dimension of the policy's parallel state; evolves independently of premium_status.
        default: INCEPTED
        constraints: "one of INCEPTED, ACTIVE, EXPIRED, CANCELLED, RUNOFF"
      - name: premium_status
        type: enum
        source: system
        required: false
        description: Billing dimension of the policy's parallel state; evolves independently of coverage_status.
        default: INVOICED
        constraints: "one of INVOICED, PAID, DELINQUENT"
      - name: program_target_limit_usd
        type: number
        source: system
        required: false
        description: Total tower limit copied from the submission's requested_program_target_limit_usd.
      - name: placed_limit_usd
        type: number
        source: computed
        required: false
        description: Sum of Layer.limit_usd * Layer.participation_pct over layers with status IN {ATTACHED, EXHAUSTED} — see calculations.tower_placement_posture.
        default: 0
      - name: tower_posture
        type: enum
        source: computed
        required: false
        description: Derived tower posture — see calculations.tower_placement_posture.
        default: INCOMPLETE
        constraints: "one of INCOMPLETE, CONTIGUOUS, SEALED, ERODED, RELEASED"
      - name: tower_sealed
        type: boolean
        source: system
        required: false
        description: True once the tower has been sealed; layers become immutable and claim notices are permitted.
        default: false
      - name: runoff_start_date
        type: datetime
        source: system
        required: false
        description: Start of the run-off window; set when a run-off endorsement is issued.
        default: null
      - name: runoff_end_date
        type: datetime
        source: system
        required: false
        description: End of the run-off window; replaces period_end in reporting-deadline derivation while coverage_status == RUNOFF.
        default: null
      - name: runoff_premium_usd
        type: number
        source: system
        required: false
        description: Premium charged for the run-off tail; copied from the endorsement.
        default: 0
      - name: return_premium_usd
        type: number
        source: system
        required: false
        description: Unearned premium credited on cancellation — see calculations.cancellation_return_premium.
        default: 0
      - name: open_claim_count
        type: integer
        source: computed
        required: false
        description: Count of this policy's claims whose status IN {NOTICED, COVERAGE_ACCEPTED, DEFENSE_ADVANCING, SETTLEMENT_PENDING}.
        default: 0
      - name: cancelled_reason
        type: enum
        source: system
        required: false
        description: Reason recorded at cancellation.
        default: null
        constraints: "one of INSURED_REQUEST, NON_PAYMENT, MATERIAL_MISREPRESENTATION"

  - name: CoveragePart
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: system
        required: false
        description: "FK -> Policy.id; the policy this coverage part belongs to."
      - name: part
        type: enum
        source: system
        required: false
        description: Which insuring agreement this part represents — SIDE_A individual non-indemnified, SIDE_B company reimbursement, SIDE_C entity securities.
        constraints: "one of SIDE_A, SIDE_B, SIDE_C"
      - name: limit_usd
        type: number
        source: system
        required: false
        description: Limit assigned to this part at bind; SIDE_A and SIDE_B equal the shared aggregate limit, SIDE_C equals the accepted sublimit.
      - name: retention_usd
        type: number
        source: system
        required: false
        description: Retention applicable to this part; 0 for SIDE_A, policy retention for SIDE_B and SIDE_C.
      - name: remaining_limit_usd
        type: number
        source: computed
        required: false
        description: limit_usd - eroded_usd, floored at 0.
        default: 0
      - name: eroded_usd
        type: number
        source: computed
        required: false
        description: Cumulative indemnity and advanced defense charged to this part.
        default: 0
      - name: status
        type: enum
        source: system
        required: false
        description: Part availability state.
        default: ACTIVE
        constraints: "one of ACTIVE, EXHAUSTED, RELEASED"

  - name: Layer
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        required: true
        description: "FK -> Policy.id; the primary policy whose tower this layer sits in."
      - name: underlying_layer_id
        type: string
        source: input
        required: false
        description: "FK -> Layer.id; the layer immediately beneath this one in the tower; null for the primary layer."
        default: null
      - name: carrier_name
        type: string
        source: input
        required: true
        description: Carrier subscribing this layer or this share of the layer.
      - name: attachment_point_usd
        type: number
        source: input
        required: true
        description: Amount of underlying limit that must be eroded before this layer responds; 0 for the primary layer.
        constraints: ">= 0"
      - name: limit_usd
        type: number
        source: input
        required: true
        description: Limit of liability of this layer band.
        constraints: "> 0"
      - name: participation_pct
        type: number
        source: input
        required: true
        description: Fraction of the band this carrier subscribes; identical bands quota-share and must sum to 1.00 at seal.
        constraints: "0 < value <= 1"
      - name: form_type
        type: enum
        source: input
        required: true
        description: FOLLOWING_FORM adopts the primary wording verbatim; DIFFERENCE_IN_CONDITIONS deviates and is capped at 40% of the tower.
        constraints: "one of FOLLOWING_FORM, DIFFERENCE_IN_CONDITIONS"
      - name: dic_deviation_notes
        type: string
        source: input
        required: false
        description: Description of the wording deviation; required when form_type == DIFFERENCE_IN_CONDITIONS.
        default: null
      - name: status
        type: enum
        source: system
        required: false
        description: Layer availability state.
        default: ATTACHED
        constraints: "one of ATTACHED, EXHAUSTED, RELEASED"
      - name: is_primary
        type: boolean
        source: computed
        required: false
        description: True when attachment_point_usd == 0; the primary layer band is immutable once the tower is sealed.
        default: false

  - name: Claim
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        required: true
        description: "FK -> Policy.id; the policy under which the claim is noticed."
      - name: circumstance_report_id
        type: string
        source: system
        required: false
        description: "FK -> CircumstanceReport.id; set only when the claim matured from a prior circumstance report, which relates the notice date back to that report."
        default: null
      - name: claim_type
        type: enum
        source: input
        required: true
        description: Nature of the matter; selects the eligible coverage parts.
        constraints: "one of SECURITIES_CLASS_ACTION, DERIVATIVE, REGULATORY_ENFORCEMENT, EMPLOYMENT_PRACTICES, INSURED_VS_INSURED, FIDUCIARY"
      - name: claimant_name
        type: string
        source: input
        required: true
        description: Name of the party asserting the claim.
      - name: claimant_capacity
        type: enum
        source: input
        required: true
        description: Capacity in which the claimant sues; drives the insured-versus-insured analysis.
        constraints: "one of THIRD_PARTY, SHAREHOLDER_DERIVATIVE, FORMER_OFFICER, BANKRUPTCY_TRUSTEE, COMPANY"
      - name: wrongful_act_date
        type: datetime
        source: input
        required: true
        description: Date of the alleged wrongful act; compared against retroactive_date and, in run-off, against change_of_control_date.
      - name: notice_date
        type: datetime
        source: system
        required: false
        description: Logical-clock instant of notice, except for a matured circumstance report where it is set to that report's notice_date (relation-back).
      - name: alleged_damages_usd
        type: number
        source: input
        required: true
        description: Damages asserted by the claimant.
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        required: false
        description: Claim lifecycle state.
        default: NOTICED
        constraints: "one of NOTICED, COVERAGE_ACCEPTED, DEFENSE_ADVANCING, SETTLEMENT_PENDING, SETTLED, DENIED"
      - name: allocation_method
        type: enum
        source: system
        required: false
        description: Defense-cost allocation method fixed at the coverage decision and applied to every invoice on this claim.
        default: null
        constraints: "one of RELATIVE_EXPOSURE, LARGER_SETTLEMENT"
      - name: denial_reason
        type: enum
        source: system
        required: false
        description: Reason recorded when coverage is declined.
        default: null
        constraints: "one of CONDUCT_EXCLUSION, PRIOR_ACTS, INSURED_VS_INSURED, LATE_NOTICE, MISREPRESENTATION"
      - name: decided_by_user_id
        type: string
        source: system
        required: false
        description: X-User-ID of the ClaimsAdjuster who recorded the coverage decision.
        default: null
      - name: retention_remaining_usd
        type: number
        source: computed
        required: false
        description: Unapplied portion of the per-claim retention; initialized from Policy.retention_usd at notice and drawn down by defense advancement and indemnity on this claim only.
        default: 0
      - name: retention_applied_usd
        type: number
        source: computed
        required: false
        description: Portion of the per-claim retention already absorbed by the insured on this claim.
        default: 0
      - name: advanced_defense_usd
        type: number
        source: computed
        required: false
        description: Cumulative defense cost advanced by the insurer on this claim.
        default: 0
      - name: post_refusal_defense_usd
        type: number
        source: input
        required: false
        description: Defense cost the insured incurs after refusing consent to a recommended settlement; recorded for the hammer-clause narrative and not advanced by the insurer.
        default: 0
        constraints: ">= 0"
      - name: indemnity_paid_usd
        type: number
        source: computed
        required: false
        description: Indemnity funded by the insurer at resolution.
        default: 0
      - name: insurer_share_usd
        type: number
        source: computed
        required: false
        description: Insurer share of the final resolution amount after retention, hammer cap and aggregate availability — see calculations.hammer_clause_insurer_share.
        default: 0
      - name: insured_retained_usd
        type: number
        source: computed
        required: false
        description: final_resolution_amount_usd - insurer_share_usd, the portion the insured bears.
        default: 0
      - name: unfunded_excess_usd
        type: number
        source: computed
        required: false
        description: Portion of covered defense and indemnity that no coverage part could absorb because limits were exhausted.
        default: 0
      - name: hammer_applied
        type: boolean
        source: computed
        required: false
        description: True when the resolution was capped by the hammer clause after a refusal of consent.
        default: false

  - name: CircumstanceReport
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        required: true
        description: "FK -> Policy.id; the policy under which the circumstance is reported."
      - name: description
        type: string
        source: input
        required: true
        description: Narrative of the circumstance that may give rise to a claim.
      - name: discovered_date
        type: datetime
        source: input
        required: true
        description: Date the insured first became aware of the circumstance.
      - name: notice_date
        type: datetime
        source: system
        required: false
        description: Logical-clock instant the circumstance was reported; a claim maturing from this report inherits this instant as its notice_date.
      - name: potential_claimants
        type: string
        source: input
        required: true
        description: Identified or anticipated claimants.
      - name: estimated_exposure_usd
        type: number
        source: input
        required: true
        description: Insured's estimate of potential exposure.
        constraints: "> 0"
      - name: reporting_deadline
        type: datetime
        source: computed
        required: false
        description: Latest instant a claim may still relate back to this report — see calculations.reporting_deadline_derivation.
        default: null
      - name: status
        type: enum
        source: system
        required: false
        description: Circumstance report state.
        default: REPORTED
        constraints: "one of REPORTED, MATURED, LAPSED"

  - name: DefenseInvoice
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        required: true
        description: "FK -> Claim.id; the claim this defense bill belongs to."
      - name: law_firm_name
        type: string
        source: input
        required: true
        description: Defense counsel submitting the bill.
      - name: invoice_reference
        type: string
        source: input
        required: true
        description: Counsel's own invoice reference; must be unique within the claim.
      - name: billed_amount_usd
        type: number
        source: input
        required: true
        description: Total billed on this invoice; must equal covered + uncovered + mixed matter amounts.
        constraints: "> 0"
      - name: covered_matter_amount_usd
        type: number
        source: input
        required: true
        description: Portion of the bill attributable solely to covered matters.
        constraints: ">= 0"
      - name: uncovered_matter_amount_usd
        type: number
        source: input
        required: true
        description: Portion attributable solely to uncovered matters or uncovered defendants.
        constraints: ">= 0"
      - name: mixed_matter_amount_usd
        type: number
        source: input
        required: true
        description: Portion attributable to work that advances both covered and uncovered matters; allocated by the claim's allocation_method.
        constraints: ">= 0"
      - name: insured_person_defendant_count
        type: integer
        source: input
        required: true
        description: Number of insured-person defendants the mixed work defends; numerator of the relative-exposure share.
        constraints: ">= 0"
      - name: entity_defendant_count
        type: integer
        source: input
        required: true
        description: Number of entity defendants the mixed work defends.
        constraints: ">= 0"
      - name: allocation_method_applied
        type: enum
        source: computed
        required: false
        description: Copied from Claim.allocation_method at allocation time so the invoice records the method actually used.
        default: null
        constraints: "one of RELATIVE_EXPOSURE, LARGER_SETTLEMENT"
      - name: covered_allocated_usd
        type: number
        source: computed
        required: false
        description: Covered defense cost after allocation — see calculations.defense_cost_allocation.
        default: 0
      - name: retention_applied_usd
        type: number
        source: computed
        required: false
        description: Portion of covered_allocated_usd absorbed by the claim's remaining retention — see calculations.defense_advancement_waterfall.
        default: 0
      - name: advanced_usd
        type: number
        source: computed
        required: false
        description: Portion the insurer actually advances on this invoice after retention and limit availability.
        default: 0
      - name: unfunded_excess_usd
        type: number
        source: computed
        required: false
        description: Covered portion that no eligible coverage part could absorb.
        default: 0
      - name: status
        type: enum
        source: system
        required: false
        description: Invoice lifecycle state.
        default: SUBMITTED
        constraints: "one of SUBMITTED, ADVANCED, CLAWED_BACK, VOIDED"

  - name: SettlementProposal
    parent: Claim
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        required: true
        description: "FK -> Claim.id; the claim being settled."
      - name: recommended_amount_usd
        type: number
        source: input
        required: true
        description: Amount the insurer recommends to settle; the hammer cap is measured against this amount.
        constraints: "> 0"
      - name: recommended_by_user_id
        type: string
        source: system
        required: false
        description: X-User-ID of the ClaimsAdjuster who recommended the settlement; the resolving adjuster must be a different user.
        default: null
      - name: insured_response
        type: enum
        source: system
        required: false
        description: The insured's consent decision.
        default: null
        constraints: "one of CONSENT, REFUSE"
      - name: response_date
        type: datetime
        source: system
        required: false
        description: Logical-clock instant of the consent decision.
        default: null
      - name: refusal_reason
        type: string
        source: input
        required: false
        description: Insured's stated reason for refusing consent; required when the response is REFUSE.
        default: null
      - name: hammer_pct_applied
        type: number
        source: computed
        required: false
        description: Fraction of the excess over retention the insurer will bear after a refusal; 1.00 when consent was given.
        default: null
      - name: insurer_indemnity_cap_usd
        type: number
        source: computed
        required: false
        description: Ceiling on insurer indemnity implied by this proposal — see calculations.hammer_clause_insurer_share.
        default: null
      - name: status
        type: enum
        source: system
        required: false
        description: Proposal lifecycle state.
        default: RECOMMENDED
        constraints: "one of RECOMMENDED, CONSENTED, REFUSED, FUNDED, HAMMER_APPLIED, SUPERSEDED"

  - name: RunoffEndorsement
    parent: Policy
    common_fields: true
    fields:
      - name: policy_id
        type: string
        source: input
        required: true
        description: "FK -> Policy.id; the policy being placed into run-off."
      - name: change_of_control_date
        type: datetime
        source: system
        required: false
        description: Copied from the insured's change_of_control_date at endorsement; wrongful acts after this instant are outside run-off cover.
      - name: tail_years
        type: integer
        source: input
        required: true
        description: Length of the run-off tail in years; selects the tail factor.
        constraints: "one of 1, 2, 3, 6"
      - name: runoff_start_date
        type: datetime
        source: computed
        required: false
        description: Equal to change_of_control_date.
        default: null
      - name: runoff_end_date
        type: datetime
        source: computed
        required: false
        description: runoff_start_date + tail_years * 365 days.
        default: null
      - name: tail_factor_applied
        type: number
        source: computed
        required: false
        description: Multiplier selected from TAIL_FACTOR by tail_years — see calculations.runoff_premium.
        default: 0
      - name: severity_load_applied
        type: number
        source: computed
        required: false
        description: Additional load applied when the policy carries at least one claim whose status != DENIED.
        default: 0
      - name: unexpired_premium_credit_usd
        type: number
        source: computed
        required: false
        description: Credit for the unexpired portion of the current period — see calculations.runoff_premium.
        default: 0
      - name: runoff_premium_usd
        type: number
        source: computed
        required: false
        description: Net premium payable for the tail, floored at 0 — see calculations.runoff_premium.
        default: 0
      - name: status
        type: enum
        source: system
        required: false
        description: Endorsement state.
        default: ENDORSED
        constraints: "one of ENDORSED, EXPIRED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Submission
    initial_state: DRAFT
    terminal_states: [BOUND, EXPIRED]
    transitions:
      - from: DRAFT
        to: SCORED
        trigger: "POST /dno/submissions/{id}/score"
        actor: Underwriter
        preconditions:
          - "submission.status == DRAFT"
          - "at least one DisclosurePackage exists with insured_id == submission.insured_id, else ERR_DISCLOSURE_REQUIRED"
          - "the selected latest DisclosurePackage has filed_date > clock_now - 540 days, else ERR_DISCLOSURE_STALE"
        side_effects:
          - "recompute Submission.risk_score, Submission.risk_band, Submission.litigation_units, Submission.disclosure_packages_considered per calculations.governance_risk_assessment"
          - "set Submission.score_variant to the request's variant and Submission.scored_at to the logical clock"
          - "write DisclosurePackage.financial_subscore and DisclosurePackage.governance_subscore on every package the run consumed"
          - "write LitigationEvent.weight_units on every litigation event the run consumed"
          - "increment Submission.version by 1"
      - from: SCORED
        to: SCORED
        trigger: "POST /dno/submissions/{id}/score (re-score with a different variant)"
        actor: Underwriter
        preconditions:
          - "submission.status == SCORED"
          - "the selected latest DisclosurePackage has filed_date > clock_now - 540 days, else ERR_DISCLOSURE_STALE"
        side_effects:
          - "overwrite risk_score, risk_band, litigation_units, disclosure_packages_considered, score_variant, scored_at"
          - "recompute DisclosurePackage subscores and LitigationEvent.weight_units for the newly consumed set"
          - "increment Submission.version by 1"
        note: "Self-loop; a re-score never rewrites Quote.risk_band_at_quote on quotes already issued."
      - from: SCORED
        to: QUOTED
        trigger: "POST /dno/submissions/{id}/quotes"
        actor: Underwriter
        preconditions:
          - "submission.status == SCORED"
          - "request expected_submission_version == submission.version, else ERR_STALE_VERSION"
          - "offered_side_c_sublimit_usd <= offered_limit_usd, else ERR_SIDE_C_SUBLIMIT_EXCEEDS_AGGREGATE"
        side_effects:
          - "create Quote in OFFERED with risk_band_at_quote = submission.risk_band"
          - "transition every other Quote of this submission whose status == OFFERED to SUPERSEDED"
          - "auto-create one ExclusionTerm on the new quote with exclusion_type CONDUCT, wording_variant BROAD, premium_impact_pct 0.00, proposed_by_role Underwriter, last_actor_role Underwriter, status PROPOSED, round_count 1"
          - "compute Quote.net_premium_usd, gross_premium_usd, broker_commission_usd, premium_tax_usd, total_payable_usd"
          - "increment Submission.version by 1"
      - from: QUOTED
        to: SCORED
        trigger: "POST /dno/ops-runs (all quotes of the submission have lapsed)"
        actor: system
        preconditions:
          - "submission.status == QUOTED"
          - "every Quote of this submission has status IN {LAPSED, SUPERSEDED}"
        side_effects:
          - "revert Submission.status to SCORED so the underwriter may re-quote"
          - "increment Submission.version by 1"
        note: "Bubble-up revert: the parent's state is re-derived once all children are terminal."
      - from: QUOTED
        to: BOUND
        trigger: "POST /dno/quotes/{id}/accept"
        actor: RiskManager
        preconditions:
          - "submission.status == QUOTED"
          - "quote.status == OFFERED"
        side_effects:
          - "create the Policy and its CoverageParts (see Policy state machine, bind transition)"
          - "increment Submission.version by 1"
      - from: DRAFT
        to: EXPIRED
        trigger: "POST /dno/ops-runs (clock >= submission.expires_at)"
        actor: system
        preconditions:
          - "submission.status IN {DRAFT, SCORED, QUOTED}"
          - "clock_now >= submission.expires_at"
        side_effects:
          - "transition every Quote of this submission whose status == OFFERED to LAPSED"
          - "increment Submission.version by 1"
        note: "The same ops-run rule applies from SCORED and from QUOTED; DRAFT is written here as the representative from-state."

  - entity: Quote
    initial_state: OFFERED
    terminal_states: [ACCEPTED, LAPSED, SUPERSEDED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /dno/quotes/{id}/accept"
        actor: RiskManager
        preconditions:
          - "quote.status == OFFERED"
          - "clock_now < quote.quote_valid_until, else ERR_QUOTE_EXPIRED"
          - "insured.control_status == INDEPENDENT, else ERR_CONTROL_CHANGE_BLOCKS_BIND"
          - "every ExclusionTerm on this quote has status IN {AGREED, REJECTED}, else ERR_UNRESOLVED_EXCLUSION_TERMS"
          - "an ExclusionTerm with exclusion_type CONDUCT and status AGREED exists on this quote, else ERR_MANDATORY_EXCLUSION_MISSING"
          - "insured.aggregate_bound_side_c_usd + quote.offered_side_c_sublimit_usd <= insured.entity_capacity_cap_usd across overlapping periods, else ERR_ENTITY_CAPACITY_EXCEEDED"
        side_effects:
          - "create Policy (coverage_status INCEPTED, premium_status INVOICED) with policy_number from the monotonic counter"
          - "create CoverageParts SIDE_A and SIDE_B, and SIDE_C only when quote.offered_side_c_sublimit_usd > 0"
          - "compute Policy.gross_premium_usd per calculations.bound_premium_exclusion_adjustment and Policy.premium_due_date = bind instant + 30 days"
          - "recompute Insured.aggregate_bound_side_c_usd, available_side_c_capacity_usd, capacity_posture, open_policy_count"
          - "transition Submission to BOUND"
          - "increment Quote.version by 1"
      - from: OFFERED
        to: LAPSED
        trigger: "POST /dno/ops-runs (clock >= quote.quote_valid_until)"
        actor: system
        preconditions:
          - "quote.status == OFFERED"
          - "clock_now >= quote.quote_valid_until"
        side_effects:
          - "when every sibling quote is now terminal, revert Submission.status from QUOTED to SCORED"
          - "increment Quote.version by 1"
      - from: OFFERED
        to: SUPERSEDED
        trigger: "POST /dno/submissions/{id}/quotes (a newer quote is issued on the same submission)"
        actor: Underwriter
        preconditions:
          - "quote.status == OFFERED"
        side_effects:
          - "increment Quote.version by 1"

  - entity: ExclusionTerm
    initial_state: PROPOSED
    terminal_states: [AGREED, REJECTED, IMPASSE]
    transitions:
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /dno/exclusion-terms/{id}/counter"
        actor: RiskManager
        preconditions:
          - "term.status IN {PROPOSED, COUNTERED}"
          - "acting role != term.last_actor_role, else ERR_TERM_ACTOR_SEQUENCE"
          - "quote.status == OFFERED, else ERR_INVALID_QUOTE_STATE"
          - "term.round_count + 1 < MAX_NEGOTIATION_ROUNDS (4)"
        side_effects:
          - "overwrite term.wording_variant and term.premium_impact_pct with the countering party's values"
          - "set term.last_actor_role to the acting role and increment term.round_count by 1"
          - "increment ExclusionTerm.version by 1"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /dno/exclusion-terms/{id}/counter"
        actor: Underwriter
        preconditions:
          - "term.status == COUNTERED"
          - "acting role != term.last_actor_role, else ERR_TERM_ACTOR_SEQUENCE"
          - "term.round_count + 1 < MAX_NEGOTIATION_ROUNDS (4)"
        side_effects:
          - "overwrite term.wording_variant and term.premium_impact_pct, set last_actor_role, increment round_count by 1"
          - "increment ExclusionTerm.version by 1"
        note: "Cycle: PROPOSED -> COUNTERED -> PROPOSED; each hop must come from the role that did not make the last proposal."
      - from: COUNTERED
        to: IMPASSE
        trigger: "POST /dno/exclusion-terms/{id}/counter (the counter that reaches MAX_NEGOTIATION_ROUNDS)"
        actor: system
        preconditions:
          - "term.status IN {PROPOSED, COUNTERED}"
          - "acting role != term.last_actor_role"
          - "term.round_count + 1 == MAX_NEGOTIATION_ROUNDS (4)"
        side_effects:
          - "increment term.round_count to 4, set last_actor_role to the acting role, set status IMPASSE"
          - "the term is now terminal and can never be AGREED, so any accept on the parent quote fails ERR_UNRESOLVED_EXCLUSION_TERMS"
          - "increment ExclusionTerm.version by 1"
      - from: PROPOSED
        to: AGREED
        trigger: "POST /dno/exclusion-terms/{id}/resolve with resolution AGREE"
        actor: RiskManager
        preconditions:
          - "term.status IN {PROPOSED, COUNTERED}"
          - "acting role != term.last_actor_role, else ERR_TERM_ACTOR_SEQUENCE"
          - "quote.status == OFFERED, else ERR_INVALID_QUOTE_STATE"
        side_effects:
          - "freeze term.agreed_variant = term.wording_variant"
          - "term.premium_impact_pct now participates in calculations.bound_premium_exclusion_adjustment at bind"
          - "increment ExclusionTerm.version by 1"
        note: "The same resolve endpoint reaches AGREED from COUNTERED under identical preconditions."
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /dno/exclusion-terms/{id}/resolve with resolution REJECT"
        actor: RiskManager
        preconditions:
          - "term.status IN {PROPOSED, COUNTERED}"
          - "acting role != term.last_actor_role, else ERR_TERM_ACTOR_SEQUENCE"
        side_effects:
          - "term.agreed_variant stays null and the term contributes 0.00 to the bound premium adjustment"
          - "increment ExclusionTerm.version by 1"
        note: "A REJECTED CONDUCT term still fails ERR_MANDATORY_EXCLUSION_MISSING at accept, since the conduct exclusion must be AGREED."

  - entity: Policy
    initial_state: INCEPTED
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: null
        to: INCEPTED
        trigger: "POST /dno/quotes/{id}/accept"
        actor: RiskManager
        preconditions:
          - "see Quote OFFERED -> ACCEPTED preconditions"
        side_effects:
          - "hop 1: the accept mutates the Quote to ACCEPTED, which creates this Policy with coverage_status INCEPTED and premium_status INVOICED"
          - "hop 2: creating the Policy creates its CoverageParts — SIDE_A (limit = shared_aggregate_limit_usd, retention 0), SIDE_B (limit = shared_aggregate_limit_usd, retention = policy retention), and SIDE_C only when the accepted sublimit > 0 (limit = sublimit, retention = policy retention)"
          - "hop 3: creating the SIDE_C CoveragePart recomputes Insured.aggregate_bound_side_c_usd and available_side_c_capacity_usd per calculations.entity_side_c_capacity"
          - "hop 4: the recomputed utilization ratio re-derives Insured.capacity_posture (OPEN / RESTRICTED / EXHAUSTED) and Insured.open_policy_count"
          - "compute Policy.gross_premium_usd, premium_due_date, aggregate_remaining_usd, placed_limit_usd, tower_posture"
          - "increment Insured.version by 1"
        note: "Transitive cascade of depth 4 originating from the accept transition: Quote -> Policy -> CoveragePart -> Insured capacity -> Insured posture."
      - from: INCEPTED
        to: ACTIVE
        trigger: "POST /dno/ops-runs (clock >= policy.period_start)"
        actor: system
        preconditions:
          - "policy.coverage_status == INCEPTED"
          - "clock_now >= policy.period_start"
        side_effects:
          - "set coverage_status ACTIVE; premium_status is untouched by this transition"
          - "increment Policy.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /dno/ops-runs (clock >= policy.period_end)"
        actor: system
        preconditions:
          - "policy.coverage_status IN {INCEPTED, ACTIVE}"
          - "clock_now >= policy.period_end"
        side_effects:
          - "transition every CoveragePart of this policy whose status == ACTIVE to RELEASED"
          - "transition every Layer of this policy whose status == ATTACHED to RELEASED"
          - "recompute Policy.tower_posture (RELEASED) and Policy.placed_limit_usd"
          - "recompute Insured.aggregate_bound_side_c_usd, available_side_c_capacity_usd, capacity_posture, open_policy_count"
          - "increment Policy.version and Insured.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /dno/policies/{id}/cancel"
        actor: ComplianceOfficer
        preconditions:
          - "policy.coverage_status IN {INCEPTED, ACTIVE}"
          - "policy.open_claim_count == 0, else ERR_OPEN_CLAIMS_BLOCK_CANCEL"
        side_effects:
          - "compute Policy.return_premium_usd per calculations.cancellation_return_premium and set cancelled_reason"
          - "transition every CoveragePart whose status == ACTIVE to RELEASED and every Layer whose status == ATTACHED to RELEASED"
          - "recompute Insured.aggregate_bound_side_c_usd, available_side_c_capacity_usd, capacity_posture, open_policy_count — the released SIDE_C limit returns to the insured's available capacity"
          - "increment Policy.version and Insured.version by 1"
      - from: ACTIVE
        to: RUNOFF
        trigger: "POST /dno/policies/{id}/runoff-endorsements"
        actor: ComplianceOfficer
        preconditions:
          - "policy.coverage_status IN {INCEPTED, ACTIVE, RUNOFF}, else ERR_INVALID_POLICY_STATE — a policy already in RUNOFF passes this check so that the duplicate-endorsement guard below produces ERR_RUNOFF_ALREADY_ENDORSED"
          - "insured.control_status IN {CHANGE_OF_CONTROL_ANNOUNCED, ACQUIRED} and insured.change_of_control_date is not null, else ERR_NO_CHANGE_OF_CONTROL"
          - "no RunoffEndorsement already exists on this policy, else ERR_RUNOFF_ALREADY_ENDORSED"
          - "tail_years IN {1, 2, 3, 6}, else ERR_INVALID_TAIL_YEARS"
        side_effects:
          - "create RunoffEndorsement in ENDORSED and compute its tail_factor_applied, severity_load_applied, unexpired_premium_credit_usd, runoff_premium_usd per calculations.runoff_premium"
          - "copy runoff_start_date, runoff_end_date and runoff_premium_usd onto the Policy and set coverage_status RUNOFF"
          - "reporting deadlines of every CircumstanceReport whose status == REPORTED are re-derived from runoff_end_date per calculations.reporting_deadline_derivation"
          - "increment Policy.version by 1"
      - from: RUNOFF
        to: EXPIRED
        trigger: "POST /dno/ops-runs (clock >= policy.runoff_end_date)"
        actor: system
        preconditions:
          - "policy.coverage_status == RUNOFF"
          - "clock_now >= policy.runoff_end_date"
        side_effects:
          - "transition the RunoffEndorsement to EXPIRED"
          - "release remaining ACTIVE CoverageParts and ATTACHED Layers as in the ACTIVE -> EXPIRED transition"
          - "recompute Insured capacity fields and Policy.tower_posture"
          - "increment Policy.version and Insured.version by 1"
      - from: INVOICED
        to: PAID
        trigger: "POST /dno/policies/{id}/premium-payments"
        actor: RiskManager
        preconditions:
          - "policy.premium_status IN {INVOICED, DELINQUENT}"
          - "policy.coverage_status != CANCELLED, else ERR_INVALID_POLICY_STATE"
          - "amount_usd == policy.gross_premium_usd, else ERR_PREMIUM_AMOUNT_MISMATCH"
        side_effects:
          - "set premium_status PAID; coverage_status is untouched by this transition"
          - "increment Policy.version by 1"
        note: "Second, independent state dimension on Policy: premium_status evolves on its own axis (INVOICED -> PAID | DELINQUENT -> PAID) while coverage_status walks INCEPTED -> ACTIVE -> EXPIRED."
      - from: INVOICED
        to: DELINQUENT
        trigger: "POST /dno/ops-runs (clock >= policy.premium_due_date)"
        actor: system
        preconditions:
          - "policy.premium_status == INVOICED"
          - "clock_now >= policy.premium_due_date"
        side_effects:
          - "set premium_status DELINQUENT, which blocks defense advancement on every claim of this policy"
          - "increment Policy.version by 1"
        note: "One ops run may advance both dimensions of the same Policy row: coverage_status INCEPTED -> ACTIVE and premium_status INVOICED -> DELINQUENT."

  - entity: CoveragePart
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "POST /dno/defense-invoices/{id}/allocate or POST /dno/claims/{id}/resolve (erosion reaches the part limit)"
        actor: system
        preconditions:
          - "part.status == ACTIVE"
          - "part.eroded_usd >= part.limit_usd after the erosion posted by the triggering call"
        side_effects:
          - "set remaining_limit_usd to 0 and status EXHAUSTED; the part is skipped by later waterfalls, which pushes cost into unfunded_excess_usd"
          - "transition every Layer of the policy whose attachment_point_usd < policy.total_eroded_usd and whose status == ATTACHED to EXHAUSTED"
          - "recompute Policy.total_eroded_usd, aggregate_remaining_usd and tower_posture"
          - "increment CoveragePart.version and Policy.version by 1"
        note: "Hops 2-4 of the settlement-erosion cascade: Claim resolve -> CoveragePart erosion -> CoveragePart EXHAUSTED -> Layer EXHAUSTED -> Policy.tower_posture ERODED."
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /dno/policies/{id}/cancel or POST /dno/ops-runs (policy reaches EXPIRED)"
        actor: system
        preconditions:
          - "part.status == ACTIVE"
          - "policy.coverage_status transitions to CANCELLED or EXPIRED in the same call"
        side_effects:
          - "a RELEASED SIDE_C part leaves Insured.aggregate_bound_side_c_usd, restoring available_side_c_capacity_usd"
          - "increment CoveragePart.version by 1"

  - entity: Layer
    initial_state: ATTACHED
    terminal_states: [RELEASED]
    transitions:
      - from: ATTACHED
        to: EXHAUSTED
        trigger: "POST /dno/claims/{id}/resolve or POST /dno/defense-invoices/{id}/allocate (erosion passes this layer's attachment point)"
        actor: system
        preconditions:
          - "layer.status == ATTACHED"
          - "policy.total_eroded_usd > layer.attachment_point_usd after the erosion posted by the triggering call"
        side_effects:
          - "set Policy.tower_posture to ERODED per calculations.tower_placement_posture"
          - "increment Layer.version and Policy.version by 1"
      - from: ATTACHED
        to: RELEASED
        trigger: "POST /dno/policies/{id}/cancel or POST /dno/ops-runs (policy reaches EXPIRED)"
        actor: system
        preconditions:
          - "layer.status == ATTACHED"
          - "policy.coverage_status transitions to CANCELLED or EXPIRED in the same call"
        side_effects:
          - "RELEASED layers leave Policy.placed_limit_usd, so tower_posture re-derives to RELEASED"
          - "increment Layer.version by 1"

  - entity: Claim
    initial_state: NOTICED
    terminal_states: [SETTLED, DENIED]
    transitions:
      - from: null
        to: NOTICED
        trigger: "POST /dno/policies/{id}/claims"
        actor: RiskManager
        preconditions:
          - "policy.coverage_status IN {INCEPTED, ACTIVE, RUNOFF}, else ERR_INVALID_POLICY_STATE"
          - "clock_now IN [policy.period_start, policy.period_end) for non-RUNOFF policies, or [policy.period_start, policy.runoff_end_date) when coverage_status == RUNOFF, else ERR_NOTICE_OUTSIDE_PERIOD"
          - "wrongful_act_date >= policy.retroactive_date, unless the bound quote carries an AGREED PRIOR_ACTS term whose agreed_variant == RETRO_DATE_FULL_PRIOR_ACTS, else ERR_PRIOR_ACTS_EXCLUDED"
          - "when coverage_status == RUNOFF, wrongful_act_date < policy.runoff_start_date, else ERR_POST_TRANSACTION_ACT"
          - "claimant_capacity == THIRD_PARTY, or the insured-versus-insured carve-back applies (see validations priority 58), else ERR_INSURED_VS_INSURED_EXCLUDED"
        side_effects:
          - "set Claim.notice_date to the logical clock and Claim.retention_remaining_usd to policy.retention_usd"
          - "increment Policy.open_claim_count and Policy.version by 1"
      - from: null
        to: NOTICED
        trigger: "POST /dno/circumstance-reports/{id}/mature"
        actor: ClaimsAdjuster
        preconditions:
          - "report.status == REPORTED, else ERR_INVALID_CIRCUMSTANCE_STATE"
          - "clock_now < report.reporting_deadline, else ERR_REPORTING_WINDOW_CLOSED"
          - "wrongful_act_date >= policy.retroactive_date, unless an AGREED RETRO_DATE_FULL_PRIOR_ACTS PRIOR_ACTS term exists, else ERR_PRIOR_ACTS_EXCLUDED"
        side_effects:
          - "create the Claim with circumstance_report_id set and notice_date = report.notice_date (relation-back), NOT the current clock — so a claim maturing after period_end still carries an in-period notice date"
          - "transition the CircumstanceReport to MATURED"
          - "set Claim.retention_remaining_usd to policy.retention_usd"
          - "increment Policy.open_claim_count and Policy.version by 1"
        note: "The claims-made window check is deliberately skipped here: the report already fixed an in-period notice date, and the reporting_deadline check replaces it."
      - from: NOTICED
        to: COVERAGE_ACCEPTED
        trigger: "POST /dno/claims/{id}/coverage-decision with decision ACCEPT_WITH_ROR"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == NOTICED"
          - "allocation_method is present in the request, else ERR_CONDITIONAL_FIELD_REQUIRED"
        side_effects:
          - "freeze Claim.allocation_method for every future DefenseInvoice on this claim and set decided_by_user_id"
          - "increment Claim.version by 1"
      - from: NOTICED
        to: DENIED
        trigger: "POST /dno/claims/{id}/coverage-decision with decision DENY"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status IN {NOTICED, COVERAGE_ACCEPTED, DEFENSE_ADVANCING}"
          - "denial_reason is present in the request, else ERR_CONDITIONAL_FIELD_REQUIRED"
        side_effects:
          - "set denial_reason and decided_by_user_id"
          - "decrement Policy.open_claim_count and increment Policy.version by 1"
      - from: DEFENSE_ADVANCING
        to: DENIED
        trigger: "POST /dno/claims/{id}/coverage-decision with decision DENY (late denial after advancement)"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status IN {COVERAGE_ACCEPTED, DEFENSE_ADVANCING}"
          - "denial_reason is present in the request"
        side_effects:
          - "hop 1: every DefenseInvoice of this claim whose status == ADVANCED transitions to CLAWED_BACK, and every SUBMITTED invoice transitions to VOIDED"
          - "hop 2: each CLAWED_BACK invoice reverses its advanced_usd from the CoveragePart it eroded, restoring that part's eroded_usd and remaining_limit_usd, and returns an EXHAUSTED part to ACTIVE when its eroded_usd drops below its limit"
          - "hop 3: the restored part erosion re-derives Policy.total_eroded_usd, aggregate_remaining_usd and tower_posture, and returns Layers whose attachment_point_usd >= the restored total_eroded_usd from EXHAUSTED to ATTACHED"
          - "reset Claim.advanced_defense_usd to 0, Claim.retention_applied_usd to 0 and Claim.retention_remaining_usd to policy.retention_usd"
          - "decrement Policy.open_claim_count; increment Claim.version and Policy.version by 1"
        note: "Compensating action: after the clawback, policy.shared_aggregate_limit_usd == policy.aggregate_remaining_usd + policy.total_eroded_usd holds and total_eroded_usd equals its pre-advancement value exactly."
      - from: COVERAGE_ACCEPTED
        to: DEFENSE_ADVANCING
        trigger: "POST /dno/defense-invoices/{id}/allocate"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status IN {COVERAGE_ACCEPTED, DEFENSE_ADVANCING}"
          - "policy.premium_status != DELINQUENT, else ERR_PREMIUM_DELINQUENT"
          - "request expected_claim_version == claim.version, else ERR_STALE_VERSION"
        side_effects:
          - "compute DefenseInvoice.covered_allocated_usd per calculations.defense_cost_allocation using Claim.allocation_method"
          - "run calculations.defense_advancement_waterfall: draw down Claim.retention_remaining_usd, then erode SIDE_B, then SIDE_A, then record unfunded_excess_usd"
          - "accumulate Claim.retention_applied_usd, Claim.advanced_defense_usd, Claim.unfunded_excess_usd; set invoice status ADVANCED and allocation_method_applied"
          - "recompute CoveragePart.eroded_usd / remaining_limit_usd, Policy.total_eroded_usd, Policy.aggregate_remaining_usd, Policy.tower_posture"
          - "increment Claim.version, DefenseInvoice.version, CoveragePart.version and Policy.version by 1"
        note: "A second allocate on the same claim keeps status DEFENSE_ADVANCING (self-loop) and continues the retention draw-down where the first left off."
      - from: DEFENSE_ADVANCING
        to: SETTLEMENT_PENDING
        trigger: "POST /dno/claims/{id}/settlement-proposals"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status IN {COVERAGE_ACCEPTED, DEFENSE_ADVANCING}"
          - "request expected_claim_version == claim.version, else ERR_STALE_VERSION"
        side_effects:
          - "create SettlementProposal in RECOMMENDED with recommended_by_user_id = acting X-User-ID"
          - "transition any other SettlementProposal of this claim whose status IN {RECOMMENDED, REFUSED, CONSENTED} to SUPERSEDED"
          - "increment Claim.version by 1"
      - from: SETTLEMENT_PENDING
        to: SETTLED
        trigger: "POST /dno/claims/{id}/resolve"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.status == SETTLEMENT_PENDING"
          - "the claim's newest SettlementProposal has status IN {CONSENTED, REFUSED}, else ERR_CONSENT_PENDING"
          - "acting X-User-ID != proposal.recommended_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "policy.aggregate_remaining_usd > 0, else ERR_LIMIT_EXHAUSTED"
        side_effects:
          - "hop 1: compute Claim.insurer_share_usd per calculations.hammer_clause_insurer_share and set Claim.indemnity_paid_usd, insured_retained_usd, hammer_applied"
          - "hop 2: split insurer_share_usd across eligible CoverageParts per calculations.settlement_indemnity_split, raising each part's eroded_usd and lowering remaining_limit_usd"
          - "hop 3: any part whose eroded_usd >= limit_usd transitions ACTIVE -> EXHAUSTED"
          - "hop 4: the resulting Policy.total_eroded_usd transitions every Layer whose attachment_point_usd < total_eroded_usd from ATTACHED to EXHAUSTED, which re-derives Policy.tower_posture to ERODED"
          - "transition the proposal to FUNDED when insured_response == CONSENT, or to HAMMER_APPLIED when insured_response == REFUSE"
          - "decrement Policy.open_claim_count; increment Claim.version, Policy.version and each touched CoveragePart.version by 1"
        note: "Transitive cascade of depth 4 originating from the resolve transition — distinct from the bind cascade, which originates at accept."

  - entity: CircumstanceReport
    initial_state: REPORTED
    terminal_states: [MATURED, LAPSED]
    transitions:
      - from: REPORTED
        to: MATURED
        trigger: "POST /dno/circumstance-reports/{id}/mature"
        actor: ClaimsAdjuster
        preconditions:
          - "report.status == REPORTED"
          - "clock_now < report.reporting_deadline, else ERR_REPORTING_WINDOW_CLOSED"
        side_effects:
          - "create the related Claim with notice_date = report.notice_date"
          - "increment CircumstanceReport.version by 1"
      - from: REPORTED
        to: LAPSED
        trigger: "POST /dno/ops-runs (clock >= report.reporting_deadline)"
        actor: system
        preconditions:
          - "report.status == REPORTED"
          - "clock_now >= report.reporting_deadline"
        side_effects:
          - "the circumstance can no longer mature into a claim"
          - "increment CircumstanceReport.version by 1"

  - entity: DefenseInvoice
    initial_state: SUBMITTED
    terminal_states: [CLAWED_BACK, VOIDED]
    transitions:
      - from: SUBMITTED
        to: ADVANCED
        trigger: "POST /dno/defense-invoices/{id}/allocate"
        actor: ClaimsAdjuster
        preconditions:
          - "invoice.status == SUBMITTED"
          - "claim.status IN {COVERAGE_ACCEPTED, DEFENSE_ADVANCING}, else ERR_INVALID_CLAIM_STATE"
          - "policy.premium_status != DELINQUENT, else ERR_PREMIUM_DELINQUENT"
        side_effects:
          - "see Claim COVERAGE_ACCEPTED -> DEFENSE_ADVANCING side effects"
          - "increment DefenseInvoice.version by 1"
      - from: ADVANCED
        to: CLAWED_BACK
        trigger: "POST /dno/claims/{id}/coverage-decision with decision DENY (late denial)"
        actor: system
        preconditions:
          - "invoice.status == ADVANCED"
          - "the parent claim transitions to DENIED in the same call"
        side_effects:
          - "reverse advanced_usd from the eroded CoveragePart and reverse retention_applied_usd on the claim"
          - "increment DefenseInvoice.version by 1"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /dno/claims/{id}/coverage-decision with decision DENY"
        actor: system
        preconditions:
          - "invoice.status == SUBMITTED"
          - "the parent claim transitions to DENIED in the same call"
        side_effects:
          - "the invoice can never be allocated"
          - "increment DefenseInvoice.version by 1"

  - entity: SettlementProposal
    initial_state: RECOMMENDED
    terminal_states: [FUNDED, HAMMER_APPLIED, SUPERSEDED]
    transitions:
      - from: RECOMMENDED
        to: CONSENTED
        trigger: "POST /dno/settlement-proposals/{id}/respond with response CONSENT"
        actor: RiskManager
        preconditions:
          - "proposal.status == RECOMMENDED"
          - "the acting RiskManager's X-User-ID == policy.insured_id, else ERR_NOT_RESOURCE_OWNER"
        side_effects:
          - "set insured_response CONSENT, response_date = clock, hammer_pct_applied = 1.00"
          - "compute insurer_indemnity_cap_usd = recommended_amount_usd"
          - "increment SettlementProposal.version by 1"
      - from: RECOMMENDED
        to: REFUSED
        trigger: "POST /dno/settlement-proposals/{id}/respond with response REFUSE"
        actor: RiskManager
        preconditions:
          - "proposal.status == RECOMMENDED"
          - "refusal_reason is present in the request, else ERR_CONDITIONAL_FIELD_REQUIRED"
        side_effects:
          - "set insured_response REFUSE, response_date = clock, hammer_pct_applied = HAMMER_INSURER_PCT (0.70)"
          - "compute insurer_indemnity_cap_usd per calculations.hammer_clause_insurer_share"
          - "increment SettlementProposal.version by 1"
      - from: CONSENTED
        to: FUNDED
        trigger: "POST /dno/claims/{id}/resolve"
        actor: ClaimsAdjuster
        preconditions:
          - "proposal.status == CONSENTED"
          - "acting X-User-ID != proposal.recommended_by_user_id"
        side_effects:
          - "the insurer funds min(final_resolution_amount_usd, cap, policy.aggregate_remaining_usd)"
          - "increment SettlementProposal.version by 1"
      - from: REFUSED
        to: HAMMER_APPLIED
        trigger: "POST /dno/claims/{id}/resolve"
        actor: ClaimsAdjuster
        preconditions:
          - "proposal.status == REFUSED"
          - "acting X-User-ID != proposal.recommended_by_user_id"
        side_effects:
          - "set Claim.hammer_applied true and cap insurer indemnity at retention + 70% of the excess over retention"
          - "increment SettlementProposal.version by 1"
      - from: RECOMMENDED
        to: SUPERSEDED
        trigger: "POST /dno/claims/{id}/settlement-proposals (a newer proposal is recommended)"
        actor: ClaimsAdjuster
        preconditions:
          - "proposal.status IN {RECOMMENDED, CONSENTED, REFUSED}"
        side_effects:
          - "increment SettlementProposal.version by 1"

  - entity: RunoffEndorsement
    initial_state: ENDORSED
    terminal_states: [EXPIRED]
    transitions:
      - from: ENDORSED
        to: EXPIRED
        trigger: "POST /dno/ops-runs (clock >= endorsement.runoff_end_date)"
        actor: system
        preconditions:
          - "endorsement.status == ENDORSED"
          - "clock_now >= endorsement.runoff_end_date"
        side_effects:
          - "the parent Policy transitions RUNOFF -> EXPIRED in the same ops run"
          - "increment RunoffEndorsement.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned
#        write-write conflict mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: insured-control-update-stale
    parent_entity: Insured
    write_endpoint: "PATCH /dno/insureds/{id}"
    occ_field: "expected_insured_version"
    description: |
      Updating an Insured's control_status or entity_capacity_cap_usd is rejected when the
      submitted expected_insured_version no longer matches the stored version. The insured's
      version advances on every bind and every release of Side C capacity, so a compliance
      officer working from an earlier read would otherwise overwrite a capacity cap that was
      already re-derived.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: quote-create-stale-submission
    parent_entity: Submission
    write_endpoint: "POST /dno/submissions/{id}/quotes"
    occ_field: "expected_submission_version"
    description: |
      Issuing a Quote against a Submission whose version has advanced since the underwriter
      last read it is rejected. A new quote legitimately supersedes any prior OFFERED quote,
      so the operation cannot be blocked by a state precondition; the version check is what
      makes the supersede deliberate rather than accidental.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: settlement-proposal-create-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /dno/claims/{id}/settlement-proposals"
    occ_field: "expected_claim_version"
    description: |
      Recommending a settlement on a Claim whose version has advanced since the adjuster last
      read it is rejected. A newer proposal legitimately supersedes the prior recommendation,
      so the second recommendation would otherwise succeed on a claim whose defense spend and
      remaining retention have already moved.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: defense-allocation-stale-claim
    parent_entity: Claim
    write_endpoint: "POST /dno/defense-invoices/{id}/allocate"
    occ_field: "expected_claim_version"
    description: |
      Allocating a DefenseInvoice against a Claim whose version has advanced since the adjuster
      last read it is rejected. Allocation consumes the claim's remaining retention, which any
      earlier allocation has already reduced, so the caller must confirm the retention baseline
      it observed is still current.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: governance_risk_assessment
    description: "Composite management-liability risk score from financial disclosures, governance structure, litigation history and sector exposure."
    trigger: "POST /dno/submissions/{id}/score (Submission DRAFT -> SCORED and SCORED -> SCORED)"
    algorithm: weighted_scoring
    inputs: [DisclosurePackage fields, LitigationEvent fields, Insured.sector_code, requested variant, logical clock]
    input_set: |
      INDICATIVE variant: exactly one DisclosurePackage — the one with the greatest fiscal_year for
      this insured, tie-broken by created_at DESC (latest wins); and only LitigationEvent rows whose
      case_type IN {SECURITIES_CLASS_ACTION, REGULATORY_ENFORCEMENT}.
      UNDERWRITTEN variant: the 3 DisclosurePackages with the greatest fiscal_year (fewer if fewer
      exist), ordered fiscal_year DESC then created_at DESC; and every LitigationEvent of the insured
      regardless of case_type.
      Both variants read every selected package and event with no status filter; DisclosurePackage and
      LitigationEvent have no status field.
    formula: |
      financial_subscore(pkg) = min(60,
            18 * (pkg.restatement_flag ? 1 : 0)
          +  6 * min(pkg.material_weakness_count, 3)
          + 12 * (pkg.going_concern_flag ? 1 : 0)
          + 10 * (pkg.negative_operating_cash_flow_flag ? 1 : 0)
          +  8 * (pkg.debt_to_equity >= 2.0 ? 1 : 0))

      governance_subscore(pkg) = min(50,
            14 * (pkg.independent_director_ratio < 0.50 ? 1 : 0)
          + 10 * (pkg.dual_class_shares_flag ? 1 : 0)
          +  8 * (pkg.combined_ceo_chair_flag ? 1 : 0)
          +  6 * (pkg.staggered_board_flag ? 1 : 0)
          + 12 * (pkg.auditor_change_flag ? 1 : 0))

      age_days(event) = floor((clock_now - event.filed_date) / 1 day)

      recency_factor_graded(event) = 1.0 if age_days <= 1095
                                     else 0.5 if age_days <= 2190
                                     else 0.0
      recency_factor_binary(event) = 1.0 if age_days <= 1095 else 0.0

      event.weight_units = LITIGATION_WEIGHT[event.case_type] * recency_factor(event)

      litigation_subscore = min(70, sum(event.weight_units over the selected events)
                                    + OPEN_LITIGATION_SURCHARGE_APPLIED)
        where OPEN_LITIGATION_SURCHARGE_APPLIED = OPEN_LITIGATION_SURCHARGE if the UNDERWRITTEN
        variant is running AND at least one selected event has resolved_date == null, else 0.

      composite = financial_component + governance_component + litigation_subscore
      risk_score = round(composite * SECTOR_MULTIPLIER[insured.sector_code], 2)

      risk_band = LOW      if risk_score <  40
                = MODERATE if risk_score <  70
                = ELEVATED if risk_score < 100
                = SEVERE   otherwise
    constants:
      SECTOR_MULTIPLIER: { TECH: 1.15, BIOTECH: 1.30, FINANCIAL: 1.25, ENERGY: 1.10, INDUSTRIAL: 1.00, CONSUMER: 0.95 }
      LITIGATION_WEIGHT: { SECURITIES_CLASS_ACTION: 20, DERIVATIVE: 12, REGULATORY_ENFORCEMENT: 15, MERGER_OBJECTION: 5, EMPLOYMENT_PRACTICES: 3, FIDUCIARY: 8 }
      RECENCY_FULL_DAYS: 1095
      RECENCY_HALF_DAYS: 2190
      OPEN_LITIGATION_SURCHARGE: 10
      FINANCIAL_SUBSCORE_CAP: 60
      GOVERNANCE_SUBSCORE_CAP: 50
      LITIGATION_SUBSCORE_CAP: 70
      DISCLOSURE_STALE_DAYS: 540
    precision: "risk_score and both subscores 2 decimal places, round_half_up; the single rounding happens after the sector multiplier"
    variants:
      - name: INDICATIVE
        when: "score request carries variant INDICATIVE (broker's pre-underwriting indication)"
        difference: |
          financial_component = financial_subscore(latest package) and governance_component =
          governance_subscore(latest package) — one package only; litigation uses the binary recency
          factor over securities and regulatory matters only and never applies the open-litigation
          surcharge. disclosure_packages_considered == 1.
      - name: UNDERWRITTEN
        when: "score request carries variant UNDERWRITTEN (bound-authority underwriting)"
        difference: |
          financial_component = max(financial_subscore(pkg)) and governance_component =
          max(governance_subscore(pkg)) taken independently over the 3 most recent packages (the two
          maxima may come from different packages); litigation uses the graded recency factor over all
          case types and adds OPEN_LITIGATION_SURCHARGE when any selected event is unresolved.
          disclosure_packages_considered == min(3, package count).

  - name: net_premium_quotation
    description: "Technical premium for the primary layer from banded rate, increased-limit factors, entity-securities load and retention credit."
    trigger: "POST /dno/submissions/{id}/quotes (Submission SCORED -> QUOTED)"
    algorithm: tiered_pricing
    inputs: [Quote.risk_band_at_quote, Quote.offered_limit_usd, Quote.offered_retention_usd, Quote.offered_side_c_sublimit_usd, Insured.exchange_listing]
    input_set: "Exactly one Quote — the one being created; no aggregation over siblings. risk_band_at_quote is the submission's risk_band snapshotted at creation, so a later re-score never re-prices an issued quote."
    formula: |
      exposure_units(L) = sum over the ILF bands of (band_amount_in_millions * band_factor), where
        band 1 covers the first 5,000,000 at factor 1.00
        band 2 covers the next 5,000,000 at factor 0.65
        band 3 covers the next 10,000,000 at factor 0.45
        band 4 covers everything above 20,000,000 at factor 0.30
      base_premium = BAND_RATE[quote.risk_band_at_quote] * exposure_units(quote.offered_limit_usd)

      side_c_load = 0.00 if quote.offered_side_c_sublimit_usd == 0
                  = SIDE_C_LOAD_LISTED  if insured.exchange_listing == LISTED
                  = SIDE_C_LOAD_PRIVATE if insured.exchange_listing == PRIVATE
                  = 0.00                if insured.exchange_listing == NONE

      retention_credit = min(RETENTION_CREDIT_CAP,
                             RETENTION_CREDIT_STEP * floor(quote.offered_retention_usd / RETENTION_CREDIT_BLOCK_USD))

      # EVALUATION ORDER IS PINNED: apply the load first, then the credit, then clamp, then round once.
      raw = base_premium * (1 + side_c_load) * (1 - retention_credit)
      net_premium_usd = round(max(NET_PREMIUM_FLOOR_USD, min(NET_PREMIUM_CEILING_USD, raw)), 2)
    constants:
      BAND_RATE: { LOW: 9000, MODERATE: 14000, ELEVATED: 22000, SEVERE: 34000 }
      ILF_BAND_1_USD: 5000000
      ILF_BAND_1_FACTOR: 1.00
      ILF_BAND_2_USD: 5000000
      ILF_BAND_2_FACTOR: 0.65
      ILF_BAND_3_USD: 10000000
      ILF_BAND_3_FACTOR: 0.45
      ILF_BAND_4_FACTOR: 0.30
      SIDE_C_LOAD_LISTED: 0.20
      SIDE_C_LOAD_PRIVATE: 0.08
      RETENTION_CREDIT_STEP: 0.05
      RETENTION_CREDIT_BLOCK_USD: 250000
      RETENTION_CREDIT_CAP: 0.35
      NET_PREMIUM_FLOOR_USD: 25000
      NET_PREMIUM_CEILING_USD: 2500000
    precision: "2 decimal places, round_half_up, applied exactly once at the end; exposure_units and the two factors are kept unrounded"

  - name: premium_grossup_and_tax
    description: "Gross the technical premium up for broker commission, then apply surplus lines tax to the grossed-up figure."
    trigger: "POST /dno/submissions/{id}/quotes (Submission SCORED -> QUOTED), immediately after net_premium_quotation"
    algorithm: constraint_propagation
    inputs: [Quote.net_premium_usd]
    input_set: "The single Quote being created."
    formula: |
      # The dependency looks circular: commission is a percentage OF THE GROSS, while the gross is the
      # net plus commission. The evaluation order below is pinned and MUST be used.
      # 1. divide the net by (1 - COMMISSION_RATE) to obtain the gross
      gross_premium_usd   = round(net_premium_usd / (1 - COMMISSION_RATE), 2)
      # 2. take the commission as the RESIDUAL so that net + commission == gross exactly
      broker_commission_usd = gross_premium_usd - net_premium_usd
      # 3. tax is charged on the gross, never on the net
      premium_tax_usd     = round(gross_premium_usd * SURPLUS_LINES_TAX_RATE, 2)
      total_payable_usd   = gross_premium_usd + premium_tax_usd
      # FORBIDDEN alternative that must NOT be used: gross = net * (1 + COMMISSION_RATE), which
      # under-collects (206910.00 -> 232773.75 instead of 236468.57), and commission = net * rate,
      # which leaves net + commission != gross.
    constants:
      COMMISSION_RATE: 0.125
      SURPLUS_LINES_TAX_RATE: 0.035
    precision: "2 decimal places, round_half_up; gross is rounded before the tax is computed, and commission is the unrounded residual of two 2-decimal amounts"

  - name: bound_premium_exclusion_adjustment
    description: "Adjust the quoted gross premium by the premium impact of every exclusion wording that was actually agreed."
    trigger: "POST /dno/quotes/{id}/accept (Quote OFFERED -> ACCEPTED)"
    algorithm: aggregation
    inputs: [Quote.gross_premium_usd, ExclusionTerm.premium_impact_pct, ExclusionTerm.status]
    input_set: "Every ExclusionTerm whose quote_id == the accepted quote's id AND whose status == AGREED. Terms in PROPOSED, COUNTERED, REJECTED or IMPASSE contribute exactly 0.00 (and PROPOSED/COUNTERED/IMPASSE block the accept anyway)."
    formula: |
      agreed_impact_sum = sum(term.premium_impact_pct for AGREED terms on the accepted quote)
      policy.gross_premium_usd = round(quote.gross_premium_usd * (1 + agreed_impact_sum), 2)
      policy.premium_due_date  = clock_now + PREMIUM_DUE_DAYS days
    constants:
      PREMIUM_DUE_DAYS: 30
    precision: "2 decimal places, round_half_up, applied once after summing the impacts (sum first, then multiply, then round)"

  - name: defense_cost_allocation
    description: "Split a defense invoice between covered and uncovered matters under the allocation method fixed at the coverage decision."
    trigger: "POST /dno/defense-invoices/{id}/allocate (DefenseInvoice SUBMITTED -> ADVANCED)"
    algorithm: threshold
    inputs: [DefenseInvoice.covered_matter_amount_usd, DefenseInvoice.mixed_matter_amount_usd, DefenseInvoice.insured_person_defendant_count, DefenseInvoice.entity_defendant_count, Claim.allocation_method]
    input_set: "The single DefenseInvoice being allocated, whose status must be SUBMITTED; the method comes from Claim.allocation_method frozen at the ACCEPT_WITH_ROR decision."
    formula: |
      relative_exposure_share =
          0 if (insured_person_defendant_count + entity_defendant_count) == 0
          else insured_person_defendant_count / (insured_person_defendant_count + entity_defendant_count)

      covered_allocated_usd =
          round(covered_matter_amount_usd + mixed_matter_amount_usd * relative_exposure_share, 2)
              when allocation_method == RELATIVE_EXPOSURE
          round(covered_matter_amount_usd + mixed_matter_amount_usd * 1.00, 2)
              when allocation_method == LARGER_SETTLEMENT

      uncovered_matter_amount_usd is never advanced under either method.
    constants:
      LARGER_SETTLEMENT_MIXED_SHARE: 1.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: RELATIVE_EXPOSURE
        when: "Claim.allocation_method == RELATIVE_EXPOSURE (fixed at the coverage decision)"
        difference: "Mixed-matter work is pro-rated by the defendant headcount ratio, so only insured_person_defendant_count / total_defendants of the mixed amount becomes covered."
      - name: LARGER_SETTLEMENT
        when: "Claim.allocation_method == LARGER_SETTLEMENT (fixed at the coverage decision)"
        difference: "The whole mixed-matter amount becomes covered on the theory that the work would have been incurred to defend the covered insured persons regardless, so the covered amount is strictly larger for any invoice with mixed_matter_amount_usd > 0 and entity_defendant_count > 0."

  - name: defense_advancement_waterfall
    description: "Fill ordered buckets — claim retention, then company-reimbursement limit, then individual limit, then unfunded excess — with the covered portion of a defense invoice."
    trigger: "POST /dno/defense-invoices/{id}/allocate (DefenseInvoice SUBMITTED -> ADVANCED), immediately after defense_cost_allocation"
    algorithm: waterfall_allocation
    inputs: [DefenseInvoice.covered_allocated_usd, Claim.retention_remaining_usd, CoveragePart.remaining_limit_usd, CoveragePart.status, Claim.claim_type]
    input_set: |
      Buckets are consumed in this fixed order: (1) Claim.retention_remaining_usd, but only when
      SIDE_B is a member of ELIGIBLE_PARTS[claim.claim_type] (Side A non-indemnified loss carries no
      retention); (2) the policy's SIDE_B CoveragePart when SIDE_B is in ELIGIBLE_PARTS and its
      status == ACTIVE; (3) the policy's SIDE_A CoveragePart when SIDE_A is in ELIGIBLE_PARTS and its
      status == ACTIVE; (4) unfunded excess. SIDE_C never funds defense cost. Parts whose status is
      EXHAUSTED or RELEASED are skipped, which pushes the remainder down the waterfall.
    formula: |
      remaining = invoice.covered_allocated_usd

      if SIDE_B in ELIGIBLE_PARTS[claim.claim_type]:
          invoice.retention_applied_usd = min(claim.retention_remaining_usd, remaining)
      else:
          invoice.retention_applied_usd = 0.00
      remaining = remaining - invoice.retention_applied_usd
      claim.retention_remaining_usd -= invoice.retention_applied_usd
      claim.retention_applied_usd   += invoice.retention_applied_usd

      advanced = 0.00
      for part in ordered_buckets(SIDE_B first, then SIDE_A):
          if part exists and part.status == ACTIVE and part.part in ELIGIBLE_PARTS[claim.claim_type]:
              take = min(part.remaining_limit_usd, remaining)
              part.eroded_usd += take
              part.remaining_limit_usd = part.limit_usd - part.eroded_usd
              advanced  += take
              remaining -= take
      invoice.advanced_usd        = round(advanced, 2)
      invoice.unfunded_excess_usd = round(remaining, 2)
      claim.advanced_defense_usd  += invoice.advanced_usd
      claim.unfunded_excess_usd   += invoice.unfunded_excess_usd
      policy.total_eroded_usd       = sum(part.eroded_usd over the policy's parts)
      policy.aggregate_remaining_usd = policy.shared_aggregate_limit_usd - policy.total_eroded_usd
    constants:
      SIDE_C_FUNDS_DEFENSE: false
    precision: "2 decimal places, round_half_up on each bucket amount; the bucket sequence is fixed and never re-ordered by amount"

  - name: hammer_clause_insurer_share
    description: "Cap the insurer's indemnity when the insured refuses consent to a recommended settlement, after the retention is absorbed."
    trigger: "POST /dno/settlement-proposals/{id}/respond (proposal RECOMMENDED -> CONSENTED | REFUSED) for the cap, and POST /dno/claims/{id}/resolve (Claim SETTLEMENT_PENDING -> SETTLED) for the funded share"
    algorithm: threshold
    inputs: [SettlementProposal.recommended_amount_usd, SettlementProposal.insured_response, Claim.retention_remaining_usd, Policy.aggregate_remaining_usd, resolve request final_resolution_amount_usd]
    input_set: "The newest SettlementProposal of the claim (greatest created_at) whose status IN {CONSENTED, REFUSED}; SUPERSEDED proposals are ignored. R is the claim's retention_remaining_usd observed at the moment of the respond call."
    formula: |
      R = claim.retention_remaining_usd at the respond call
      S = proposal.recommended_amount_usd
      F = resolve request final_resolution_amount_usd

      proposal.hammer_pct_applied      = 1.00              when insured_response == CONSENT
                                       = HAMMER_INSURER_PCT when insured_response == REFUSE
      proposal.insurer_indemnity_cap_usd = round(proposal.hammer_pct_applied * max(S - R, 0), 2)

      # at resolve
      claim.retention_applied_usd  += min(claim.retention_remaining_usd, F)
      claim.retention_remaining_usd = max(claim.retention_remaining_usd - F, 0)
      claim.insurer_share_usd   = min(max(F - R, 0),
                                      proposal.insurer_indemnity_cap_usd,
                                      policy.aggregate_remaining_usd)
      claim.indemnity_paid_usd  = claim.insurer_share_usd
      claim.insured_retained_usd = round(F - claim.insurer_share_usd, 2)
      claim.hammer_applied      = (proposal.insured_response == REFUSE)
    constants:
      HAMMER_INSURER_PCT: 0.70
    precision: "2 decimal places, round_half_up; the cap is rounded once at the respond call and that stored value is reused verbatim at resolve"

  - name: settlement_indemnity_split
    description: "Distribute the insurer's indemnity share across the eligible coverage parts in proportion to their remaining limits."
    trigger: "POST /dno/claims/{id}/resolve (Claim SETTLEMENT_PENDING -> SETTLED), immediately after hammer_clause_insurer_share"
    algorithm: aggregation
    inputs: [Claim.insurer_share_usd, Claim.claim_type, CoveragePart.remaining_limit_usd, CoveragePart.status, CoveragePart.created_at]
    input_set: "Every CoveragePart of the claim's policy whose part IN ELIGIBLE_PARTS[claim.claim_type] AND whose status == ACTIVE AND whose remaining_limit_usd > 0, ordered created_at ASC (bind creates SIDE_A, then SIDE_B, then SIDE_C, in that order)."
    formula: |
      eligible = the input set above
      basis    = sum(part.remaining_limit_usd for part in eligible)
      if basis == 0: the whole insurer_share_usd becomes claim.unfunded_excess_usd and no part is eroded

      # ROUNDING ORDER IS PINNED: round each part's share to 2 decimals FIRST, then assign the
      # residual. Summing the unrounded shares and rounding once at the end is FORBIDDEN.
      for part in eligible (created_at ASC):
          part_share[part] = round(claim.insurer_share_usd * part.remaining_limit_usd / basis, 2)
      residual = round(claim.insurer_share_usd - sum(part_share.values()), 2)
      # the residual (positive or negative) goes to the part with the greatest remaining_limit_usd;
      # when two parts tie on remaining_limit_usd, the one with the earlier created_at takes it
      target = max(eligible, key = (part.remaining_limit_usd, -created_at_ordinal))
      part_share[target] += residual

      for part in eligible:
          part.eroded_usd += part_share[part]
          part.remaining_limit_usd = part.limit_usd - part.eroded_usd
          if part.eroded_usd >= part.limit_usd: part.status = EXHAUSTED
      policy.total_eroded_usd        = sum(part.eroded_usd over the policy's parts)
      policy.aggregate_remaining_usd = policy.shared_aggregate_limit_usd - policy.total_eroded_usd
    constants:
      ELIGIBLE_PARTS:
        SECURITIES_CLASS_ACTION: [SIDE_A, SIDE_B, SIDE_C]
        DERIVATIVE: [SIDE_A, SIDE_B]
        REGULATORY_ENFORCEMENT: [SIDE_A, SIDE_B]
        EMPLOYMENT_PRACTICES: [SIDE_A, SIDE_B]
        FIDUCIARY: [SIDE_A, SIDE_B]
        INSURED_VS_INSURED: [SIDE_A]
    precision: "2 decimal places, round_half_up per part, then a single residual adjustment so the parts always sum exactly to insurer_share_usd"

  - name: tower_placement_posture
    description: "Derive placed limit and tower posture from the excess layer bands subscribed on the policy."
    trigger: "POST /dno/policies/{id}/layers, POST /dno/policies/{id}/seal-tower, and every transition that erodes or releases a Layer or CoveragePart"
    algorithm: interval_merge
    inputs: [Layer.attachment_point_usd, Layer.limit_usd, Layer.participation_pct, Layer.status, Layer.form_type, Policy.program_target_limit_usd, Policy.total_eroded_usd, Policy.tower_sealed]
    input_set: "Every Layer whose policy_id == this policy AND whose status IN {ATTACHED, EXHAUSTED}; RELEASED layers are excluded from placed_limit_usd. A band is the distinct pair (attachment_point_usd, limit_usd); several layers sharing a band are quota-share co-participants."
    formula: |
      bands = distinct (attachment_point_usd, limit_usd) pairs over the input set, ordered
              attachment_point_usd ASC
      placed_limit_usd = round(sum(layer.limit_usd * layer.participation_pct over the input set), 2)

      contiguous = bands is non-empty
                   AND bands[0].attachment_point_usd == 0
                   AND for every consecutive pair, next.attachment_point_usd
                       == prev.attachment_point_usd + prev.limit_usd
                   AND every band's participation sum == 1.00
      dic_share  = round(sum(layer.limit_usd * layer.participation_pct
                             for layers with form_type == DIFFERENCE_IN_CONDITIONS) , 2)

      # posture precedence, evaluated top to bottom; the first match wins
      tower_posture = RELEASED   if policy.coverage_status IN {CANCELLED, EXPIRED}, or the policy
                                    has at least one Layer and every Layer of the policy has
                                    status RELEASED
                    = ERODED     if policy.total_eroded_usd > 0
                    = SEALED     if policy.tower_sealed
                    = CONTIGUOUS if contiguous
                    = INCOMPLETE otherwise (this includes a policy that carries no Layer at all,
                                    which is why a freshly bound policy reads INCOMPLETE)
    constants:
      DIC_SHARE_CAP: 0.40
      PRIMARY_ATTACHMENT_POINT_USD: 0
    precision: "placed_limit_usd 2 decimal places, round_half_up; participation sums compared exactly at 2 decimals"

  - name: entity_side_c_capacity
    description: "Aggregate the insurer's entity-securities exposure to one insured across overlapping policy periods and derive the capacity posture."
    trigger: "POST /dno/quotes/{id}/accept, POST /dno/policies/{id}/cancel, POST /dno/ops-runs (policy reaches EXPIRED), PATCH /dno/insureds/{id}"
    algorithm: aggregation
    inputs: [CoveragePart.limit_usd, CoveragePart.part, CoveragePart.status, Policy.coverage_status, Policy.period_start, Policy.period_end, Insured.entity_capacity_cap_usd]
    input_set: |
      Every CoveragePart whose part == SIDE_C, whose status == ACTIVE, and whose policy has
      insured_id == this insured AND coverage_status IN {INCEPTED, ACTIVE, RUNOFF}. At accept time the
      candidate policy period [requested_period_start, requested_period_end) is tested for overlap
      against each such policy period using half-open intervals: two periods overlap iff
      a.period_start < b.period_end AND b.period_start < a.period_end, so a period starting exactly
      at another's period_end does NOT overlap.
    formula: |
      aggregate_bound_side_c_usd     = sum(part.limit_usd over the input set)
      available_side_c_capacity_usd  = max(insured.entity_capacity_cap_usd - aggregate_bound_side_c_usd, 0)
      utilization = 0 if insured.entity_capacity_cap_usd == 0
                    else aggregate_bound_side_c_usd / insured.entity_capacity_cap_usd
      capacity_posture = EXHAUSTED  if utilization >= CAPACITY_EXHAUSTED_RATIO
                       = RESTRICTED if utilization >= CAPACITY_RESTRICTED_RATIO
                       = OPEN       otherwise
      open_policy_count = count(policies of this insured with coverage_status IN {INCEPTED, ACTIVE, RUNOFF})

      # accept-time admission test, evaluated over overlapping periods only
      admitted = (aggregate_bound_side_c_usd_over_overlapping_periods + quote.offered_side_c_sublimit_usd)
                 <= insured.entity_capacity_cap_usd
    constants:
      CAPACITY_RESTRICTED_RATIO: 0.80
      CAPACITY_EXHAUSTED_RATIO: 1.00
    precision: "amounts 2 decimal places, round_half_up; utilization compared unrounded"

  - name: runoff_premium
    description: "Price the run-off tail on a change of control, loading for open claims and crediting the unexpired portion of the current period."
    trigger: "POST /dno/policies/{id}/runoff-endorsements (Policy ACTIVE -> RUNOFF)"
    algorithm: decay_function
    inputs: [Policy.gross_premium_usd, RunoffEndorsement.tail_years, Insured.change_of_control_date, Policy.period_end, Claim.status]
    input_set: "Every Claim whose policy_id == this policy and whose status != DENIED contributes to the severity load (a single such claim is enough); claims in NOTICED, COVERAGE_ACCEPTED, DEFENSE_ADVANCING, SETTLEMENT_PENDING and SETTLED all count, DENIED claims do not."
    formula: |
      runoff_start_date = insured.change_of_control_date
      runoff_end_date   = runoff_start_date + tail_years * 365 days
      tail_factor_applied   = TAIL_FACTOR[tail_years]
      severity_load_applied = SEVERITY_LOAD if at least one Claim of this policy has status != DENIED
                              else 0.00
      # the load is MULTIPLICATIVE on the tail factor, not additive to it
      base = round(policy.gross_premium_usd * tail_factor_applied * (1 + severity_load_applied), 2)

      unexpired_days = min(max(floor((policy.period_end - runoff_start_date) / 1 day), 0), 365)
      unexpired_premium_credit_usd = round(policy.gross_premium_usd * unexpired_days / 365, 2)

      runoff_premium_usd = max(round(base - unexpired_premium_credit_usd, 2), 0)
    constants:
      TAIL_FACTOR: { 1: 0.75, 2: 1.10, 3: 1.45, 6: 2.25 }
      SEVERITY_LOAD: 0.20
      DAYS_PER_YEAR: 365
    precision: "2 decimal places, round_half_up; base and credit are each rounded before the subtraction, and the difference is floored at 0"

  - name: cancellation_return_premium
    description: "Credit the unearned premium on a mid-term cancellation on a pro-rata daily basis."
    trigger: "POST /dno/policies/{id}/cancel (Policy ACTIVE -> CANCELLED)"
    algorithm: chronological
    inputs: [Policy.gross_premium_usd, Policy.period_end, cancel request effective_date]
    input_set: "The single Policy being cancelled; no aggregation."
    formula: |
      unexpired_days = min(max(floor((policy.period_end - effective_date) / 1 day), 0), 365)
      return_premium_usd = round(policy.gross_premium_usd * unexpired_days / 365, 2)
    constants:
      DAYS_PER_YEAR: 365
    precision: "2 decimal places, round_half_up; the day count is floored to whole days before the ratio is taken and clamped to [0, 365] so a pre-inception cancellation returns at most the whole premium"

  - name: reporting_deadline_derivation
    description: "Derive the latest instant at which a reported circumstance may still mature into a claim."
    trigger: "POST /dno/policies/{id}/circumstance-reports, and re-derived by POST /dno/policies/{id}/runoff-endorsements"
    algorithm: chronological
    inputs: [Policy.period_end, Policy.erp_days, Policy.coverage_status, Policy.runoff_end_date]
    input_set: "The single CircumstanceReport being created, or every CircumstanceReport of the policy whose status == REPORTED when a run-off endorsement is issued."
    formula: |
      window_end = policy.runoff_end_date if policy.coverage_status == RUNOFF else policy.period_end
      reporting_deadline = window_end + policy.erp_days days
      # the deadline is exclusive: maturing exactly at reporting_deadline fails ERR_REPORTING_WINDOW_CLOSED
    constants: {}
    precision: "whole days; the resulting instant keeps the time-of-day of window_end"

# =============================================================================
# 1.4 Validation Rules Table (evaluated in ascending priority; the first
#     violated rule determines the response)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's authorized roles"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path-templated resource exists, validated left to right, returning that resource's own not-found error (ERR_INSURED_NOT_FOUND, ERR_SUBMISSION_NOT_FOUND, ERR_QUOTE_NOT_FOUND, ERR_EXCLUSION_TERM_NOT_FOUND, ERR_POLICY_NOT_FOUND, ERR_LAYER_NOT_FOUND, ERR_CLAIM_NOT_FOUND, ERR_CIRCUMSTANCE_REPORT_NOT_FOUND, ERR_DEFENSE_INVOICE_NOT_FOUND, ERR_SETTLEMENT_PROPOSAL_NOT_FOUND)"
    error_id: ERR_POLICY_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 10
    category: auth
    check: "for RiskManager, X-User-ID equals the Insured.id reached from the target resource (submission.insured_id, quote -> submission.insured_id, policy.insured_id, claim -> policy.insured_id, proposal -> claim -> policy.insured_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: ["POST /dno/quotes/{id}/accept", "POST /dno/exclusion-terms/{id}/counter", "POST /dno/exclusion-terms/{id}/resolve", "POST /dno/policies/{id}/premium-payments", "POST /dno/policies/{id}/circumstance-reports", "POST /dno/policies/{id}/claims", "POST /dno/claims/{id}/defense-invoices", "POST /dno/settlement-proposals/{id}/respond"]
  - priority: 15
    category: existence
    check: "request body parses, every required field is present, every field matches its declared type, every enum value is a declared member, and every numeric range constraint in §1.1 holds"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 16
    category: business_constraint
    check: "requested_period_end > requested_period_start"
    error_id: ERR_PERIOD_INVALID
    http_status: 422
    applies_to: ["POST /dno/submissions"]
  - priority: 17
    category: business_constraint
    check: "requested_program_target_limit_usd >= requested_limit_usd"
    error_id: ERR_PROGRAM_TARGET_BELOW_LIMIT
    http_status: 422
    applies_to: ["POST /dno/submissions"]
  - priority: 18
    category: existence
    check: "underlying_layer_id, when present in the body, references an existing Layer of the same policy"
    error_id: ERR_LAYER_NOT_FOUND
    http_status: 404
    applies_to: ["POST /dno/policies/{id}/layers"]
  - priority: 20
    category: existence
    check: "conditionally required fields are present — allocation_method when decision == ACCEPT_WITH_ROR, denial_reason when decision == DENY, refusal_reason when response == REFUSE, dic_deviation_notes when form_type == DIFFERENCE_IN_CONDITIONS, change_of_control_date when control_status != INDEPENDENT"
    error_id: ERR_CONDITIONAL_FIELD_REQUIRED
    http_status: 422
    applies_to: ["POST /dno/claims/{id}/coverage-decision", "POST /dno/settlement-proposals/{id}/respond", "POST /dno/policies/{id}/layers", "PATCH /dno/insureds/{id}"]
  - priority: 30
    category: state
    check: "expected_<parent>_version equals the stored parent version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["PATCH /dno/insureds/{id}", "POST /dno/submissions/{id}/quotes", "POST /dno/claims/{id}/settlement-proposals", "POST /dno/defense-invoices/{id}/allocate"]
  - priority: 40
    category: state
    check: "submission.status == DRAFT or SCORED for score; == SCORED for quote issuance"
    error_id: ERR_INVALID_SUBMISSION_STATE
    http_status: 409
    applies_to: ["POST /dno/submissions/{id}/score", "POST /dno/submissions/{id}/quotes"]
  - priority: 41
    category: state
    check: "quote.status == OFFERED"
    error_id: ERR_INVALID_QUOTE_STATE
    http_status: 409
    applies_to: ["POST /dno/quotes/{id}/accept", "POST /dno/quotes/{id}/exclusion-terms", "POST /dno/exclusion-terms/{id}/counter", "POST /dno/exclusion-terms/{id}/resolve"]
  - priority: 42
    category: state
    check: "the acting role differs from term.last_actor_role — a party may not counter or resolve its own outstanding wording"
    error_id: ERR_TERM_ACTOR_SEQUENCE
    http_status: 409
    applies_to: ["POST /dno/exclusion-terms/{id}/counter", "POST /dno/exclusion-terms/{id}/resolve"]
  - priority: 43
    category: state
    check: "term.status IN {PROPOSED, COUNTERED}"
    error_id: ERR_INVALID_TERM_STATE
    http_status: 409
    applies_to: ["POST /dno/exclusion-terms/{id}/counter", "POST /dno/exclusion-terms/{id}/resolve"]
  - priority: 44
    category: state
    check: "policy.coverage_status is in the set this operation permits — {INCEPTED, ACTIVE} for layers, seal-tower and cancel; {INCEPTED, ACTIVE, RUNOFF} for claims, circumstance-reports and runoff-endorsements (a second endorsement on a RUNOFF policy is refused by priority 79, not here); not CANCELLED for premium-payments"
    error_id: ERR_INVALID_POLICY_STATE
    http_status: 409
    applies_to: ["POST /dno/policies/{id}/layers", "POST /dno/policies/{id}/seal-tower", "POST /dno/policies/{id}/premium-payments", "POST /dno/policies/{id}/cancel", "POST /dno/policies/{id}/runoff-endorsements", "POST /dno/policies/{id}/claims", "POST /dno/policies/{id}/circumstance-reports"]
  - priority: 45
    category: state
    check: "policy.tower_sealed == false when adding a layer, and == false when sealing"
    error_id: ERR_TOWER_ALREADY_SEALED
    http_status: 409
    applies_to: ["POST /dno/policies/{id}/layers", "POST /dno/policies/{id}/seal-tower"]
  - priority: 46
    category: state
    check: "claim.status is in the set this operation permits — {NOTICED} for ACCEPT_WITH_ROR and {NOTICED, COVERAGE_ACCEPTED, DEFENSE_ADVANCING} for DENY; {COVERAGE_ACCEPTED, DEFENSE_ADVANCING} for defense-invoices, allocate and settlement-proposals; {SETTLEMENT_PENDING} for resolve"
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: ["POST /dno/claims/{id}/coverage-decision", "POST /dno/claims/{id}/defense-invoices", "POST /dno/defense-invoices/{id}/allocate", "POST /dno/claims/{id}/settlement-proposals", "POST /dno/claims/{id}/resolve"]
  - priority: 47
    category: state
    check: "invoice.status == SUBMITTED"
    error_id: ERR_INVALID_INVOICE_STATE
    http_status: 409
    applies_to: ["POST /dno/defense-invoices/{id}/allocate"]
  - priority: 48
    category: state
    check: "proposal.status == RECOMMENDED"
    error_id: ERR_INVALID_PROPOSAL_STATE
    http_status: 409
    applies_to: ["POST /dno/settlement-proposals/{id}/respond"]
  - priority: 49
    category: state
    check: "report.status == REPORTED"
    error_id: ERR_INVALID_CIRCUMSTANCE_STATE
    http_status: 409
    applies_to: ["POST /dno/circumstance-reports/{id}/mature"]
  - priority: 50
    category: state
    check: "the claim's newest SettlementProposal (greatest created_at) has status IN {CONSENTED, REFUSED}"
    error_id: ERR_CONSENT_PENDING
    http_status: 409
    applies_to: ["POST /dno/claims/{id}/resolve"]
  - priority: 52
    category: business_safety
    check: "the acting X-User-ID differs from the newest SettlementProposal's recommended_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: ["POST /dno/claims/{id}/resolve"]
  - priority: 54
    category: business_safety
    check: "an ExclusionTerm with exclusion_type CONDUCT and status AGREED exists on the quote being accepted"
    error_id: ERR_MANDATORY_EXCLUSION_MISSING
    http_status: 422
    applies_to: ["POST /dno/quotes/{id}/accept"]
  - priority: 56
    category: business_safety
    check: "every ExclusionTerm of the quote has status IN {AGREED, REJECTED} — a PROPOSED, COUNTERED or IMPASSE term blocks binding"
    error_id: ERR_UNRESOLVED_EXCLUSION_TERMS
    http_status: 409
    applies_to: ["POST /dno/quotes/{id}/accept"]
  - priority: 58
    category: business_safety
    check: "claimant_capacity == THIRD_PARTY, or the bound quote carries an AGREED INSURED_VS_INSURED ExclusionTerm whose agreed_variant is NONE, or is DERIVATIVE_CARVEBACK with claimant_capacity == SHAREHOLDER_DERIVATIVE, or is BANKRUPTCY_CARVEBACK with claimant_capacity == BANKRUPTCY_TRUSTEE"
    error_id: ERR_INSURED_VS_INSURED_EXCLUDED
    http_status: 422
    applies_to: ["POST /dno/policies/{id}/claims"]
  - priority: 60
    category: business_temporal
    check: "clock_now < quote.quote_valid_until"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: ["POST /dno/quotes/{id}/accept"]
  - priority: 62
    category: business_temporal
    check: "clock_now IN [policy.period_start, policy.period_end) for non-RUNOFF policies, or [policy.period_start, policy.runoff_end_date) when coverage_status == RUNOFF — the upper bound is exclusive"
    error_id: ERR_NOTICE_OUTSIDE_PERIOD
    http_status: 422
    applies_to: ["POST /dno/policies/{id}/claims", "POST /dno/policies/{id}/circumstance-reports"]
  - priority: 63
    category: business_temporal
    check: "wrongful_act_date >= policy.retroactive_date, unless the bound quote carries an AGREED PRIOR_ACTS term whose agreed_variant == RETRO_DATE_FULL_PRIOR_ACTS"
    error_id: ERR_PRIOR_ACTS_EXCLUDED
    http_status: 422
    applies_to: ["POST /dno/policies/{id}/claims", "POST /dno/circumstance-reports/{id}/mature"]
  - priority: 64
    category: business_temporal
    check: "when policy.coverage_status == RUNOFF, wrongful_act_date < policy.runoff_start_date"
    error_id: ERR_POST_TRANSACTION_ACT
    http_status: 422
    applies_to: ["POST /dno/policies/{id}/claims"]
  - priority: 65
    category: business_temporal
    check: "clock_now < report.reporting_deadline"
    error_id: ERR_REPORTING_WINDOW_CLOSED
    http_status: 409
    applies_to: ["POST /dno/circumstance-reports/{id}/mature"]
  - priority: 66
    category: business_temporal
    check: "at least one DisclosurePackage exists for the submission's insured"
    error_id: ERR_DISCLOSURE_REQUIRED
    http_status: 422
    applies_to: ["POST /dno/submissions/{id}/score"]
  - priority: 67
    category: business_temporal
    check: "the selected latest DisclosurePackage has filed_date > clock_now - DISCLOSURE_STALE_DAYS (540) days"
    error_id: ERR_DISCLOSURE_STALE
    http_status: 422
    applies_to: ["POST /dno/submissions/{id}/score"]
  - priority: 70
    category: business_constraint
    check: "the new layer band either exactly matches an existing band (quota-share co-participation) or does not overlap any existing band: for distinct bands, new.attachment_point_usd >= existing.attachment_point_usd + existing.limit_usd or new.attachment_point_usd + new.limit_usd <= existing.attachment_point_usd"
    error_id: ERR_LAYER_OVERLAP
    http_status: 409
    applies_to: ["POST /dno/policies/{id}/layers"]
  - priority: 71
    category: business_constraint
    check: "the sum of participation_pct over all ATTACHED layers sharing the new layer's band, including the new layer, is <= 1.00"
    error_id: ERR_PARTICIPATION_OVERSUBSCRIBED
    http_status: 409
    applies_to: ["POST /dno/policies/{id}/layers"]
  - priority: 72
    category: business_constraint
    check: "the DIFFERENCE_IN_CONDITIONS share of the tower, including the new layer, is <= DIC_SHARE_CAP (0.40) of program_target_limit_usd"
    error_id: ERR_DIC_SHARE_EXCEEDED
    http_status: 422
    applies_to: ["POST /dno/policies/{id}/layers"]
  - priority: 73
    category: business_constraint
    check: "a layer with attachment_point_usd == 0 may only be added when no primary layer exists yet, and its limit_usd must equal policy.shared_aggregate_limit_usd"
    error_id: ERR_PRIMARY_LAYER_IMMUTABLE
    http_status: 409
    applies_to: ["POST /dno/policies/{id}/layers"]
  - priority: 74
    category: business_constraint
    check: "the layer bands are contiguous from attachment point 0 with no gap, per calculations.tower_placement_posture"
    error_id: ERR_TOWER_GAP
    http_status: 409
    applies_to: ["POST /dno/policies/{id}/seal-tower"]
  - priority: 75
    category: business_constraint
    check: "every band's participation_pct sums to exactly 1.00 and placed_limit_usd == policy.program_target_limit_usd"
    error_id: ERR_PARTICIPATION_INCOMPLETE
    http_status: 409
    applies_to: ["POST /dno/policies/{id}/seal-tower"]
  - priority: 76
    category: business_constraint
    check: "offered_side_c_sublimit_usd <= offered_limit_usd"
    error_id: ERR_SIDE_C_SUBLIMIT_EXCEEDS_AGGREGATE
    http_status: 422
    applies_to: ["POST /dno/submissions/{id}/quotes"]
  - priority: 77
    category: business_constraint
    check: "invoice_reference is unique among the DefenseInvoices of this claim"
    error_id: ERR_DUPLICATE_INVOICE_REFERENCE
    http_status: 409
    applies_to: ["POST /dno/claims/{id}/defense-invoices"]
  - priority: 78
    category: business_constraint
    check: "covered_matter_amount_usd + uncovered_matter_amount_usd + mixed_matter_amount_usd == billed_amount_usd"
    error_id: ERR_INVOICE_AMOUNT_MISMATCH
    http_status: 422
    applies_to: ["POST /dno/claims/{id}/defense-invoices"]
  - priority: 79
    category: business_constraint
    check: "no RunoffEndorsement already exists on this policy"
    error_id: ERR_RUNOFF_ALREADY_ENDORSED
    http_status: 409
    applies_to: ["POST /dno/policies/{id}/runoff-endorsements"]
  - priority: 80
    category: business_constraint
    check: "insured.control_status IN {CHANGE_OF_CONTROL_ANNOUNCED, ACQUIRED} and insured.change_of_control_date is not null"
    error_id: ERR_NO_CHANGE_OF_CONTROL
    http_status: 409
    applies_to: ["POST /dno/policies/{id}/runoff-endorsements"]
  - priority: 81
    category: business_constraint
    check: "tail_years IN {1, 2, 3, 6}"
    error_id: ERR_INVALID_TAIL_YEARS
    http_status: 422
    applies_to: ["POST /dno/policies/{id}/runoff-endorsements"]
  - priority: 82
    category: business_constraint
    check: "insured.control_status == INDEPENDENT at the moment of binding"
    error_id: ERR_CONTROL_CHANGE_BLOCKS_BIND
    http_status: 409
    applies_to: ["POST /dno/quotes/{id}/accept"]
  - priority: 83
    category: business_constraint
    check: "policy.open_claim_count == 0"
    error_id: ERR_OPEN_CLAIMS_BLOCK_CANCEL
    http_status: 409
    applies_to: ["POST /dno/policies/{id}/cancel"]
  - priority: 84
    category: business_fiscal
    check: "policy.premium_status != DELINQUENT"
    error_id: ERR_PREMIUM_DELINQUENT
    http_status: 402
    applies_to: ["POST /dno/defense-invoices/{id}/allocate"]
  - priority: 85
    category: business_fiscal
    check: "amount_usd == policy.gross_premium_usd"
    error_id: ERR_PREMIUM_AMOUNT_MISMATCH
    http_status: 422
    applies_to: ["POST /dno/policies/{id}/premium-payments"]
  - priority: 86
    category: business_fiscal
    check: "aggregate Side C exposure over overlapping policy periods plus the quote's offered_side_c_sublimit_usd <= insured.entity_capacity_cap_usd"
    error_id: ERR_ENTITY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: ["POST /dno/quotes/{id}/accept"]
  - priority: 87
    category: business_fiscal
    check: "placed_limit_usd including the new layer <= policy.program_target_limit_usd"
    error_id: ERR_TOWER_LIMIT_EXCEEDED
    http_status: 409
    applies_to: ["POST /dno/policies/{id}/layers"]
  - priority: 88
    category: business_fiscal
    check: "policy.aggregate_remaining_usd > 0"
    error_id: ERR_LIMIT_EXHAUSTED
    http_status: 409
    applies_to: ["POST /dno/claims/{id}/resolve"]

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/dno/insureds"
    description: "Register a prospective insured organization with its sector, listing status and entity-securities capacity cap."
    roles: [Underwriter]
    code: 201
    input: [legal_name, sector_code, exchange_listing, market_cap_usd, fiscal_year_end, entity_capacity_cap_usd, "control_status?", "change_of_control_date?"]
    output: Insured
    side_effects: ["initialize aggregate_bound_side_c_usd 0, available_side_c_capacity_usd = entity_capacity_cap_usd, capacity_posture OPEN, open_policy_count 0"]
  - method: PATCH
    path: "/dno/insureds/{id}"
    description: "Update an insured's control posture, market capitalization or capacity cap under optimistic concurrency."
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_insured_version, "control_status?", "change_of_control_date?", "market_cap_usd?", "entity_capacity_cap_usd?"]
    output: Insured
    side_effects: ["recompute available_side_c_capacity_usd and capacity_posture per calculations.entity_side_c_capacity", "increment Insured.version by 1"]
  - method: GET
    path: "/dno/insureds/{id}"
    description: "Read one insured with its derived capacity fields."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: []
    output: Insured
    side_effects: []
  - method: POST
    path: "/dno/insureds/{id}/disclosure-packages"
    description: "File a fiscal-year financial and governance disclosure package for an insured."
    roles: [Underwriter]
    code: 201
    input: [fiscal_year, filed_date, restatement_flag, material_weakness_count, going_concern_flag, negative_operating_cash_flow_flag, debt_to_equity, independent_director_ratio, dual_class_shares_flag, staggered_board_flag, combined_ceo_chair_flag, auditor_change_flag]
    output: DisclosurePackage
    side_effects: ["financial_subscore and governance_subscore stay 0 until a scoring run consumes the package"]
  - method: GET
    path: "/dno/insureds/{id}/disclosure-packages"
    description: "List an insured's disclosure packages."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: DisclosurePackage[]
    side_effects: []
  - method: POST
    path: "/dno/insureds/{id}/litigation-events"
    description: "Record a historical or pending litigation matter against an insured."
    roles: [Underwriter]
    code: 201
    input: [case_type, filed_date, "resolved_date?", "indemnity_paid_usd?", "outcome?"]
    output: LitigationEvent
    side_effects: ["weight_units stays 0 until a scoring run consumes the event"]
  - method: GET
    path: "/dno/insureds/{id}/litigation-events"
    description: "List an insured's litigation history."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: LitigationEvent[]
    side_effects: []
  - method: POST
    path: "/dno/submissions"
    description: "Open a submission for management liability cover on an insured."
    roles: [Underwriter]
    code: 201
    input: [insured_id, requested_limit_usd, requested_retention_usd, requested_side_c_sublimit_usd, requested_program_target_limit_usd, requested_period_start, requested_period_end, retroactive_date, "erp_days?"]
    output: Submission
    side_effects: ["set status DRAFT and expires_at = created_at + 90 days"]
  - method: GET
    path: "/dno/submissions/{id}"
    description: "Read one submission with its scoring outputs."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: []
    output: Submission
    side_effects: []
  - method: GET
    path: "/dno/submissions"
    description: "List submissions, optionally filtered by insured or status."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: ["insured_id?", "status?", "limit?", "offset?"]
    output: Submission[]
    side_effects: []
  - method: POST
    path: "/dno/submissions/{id}/score"
    description: "Run the risk assessment on a submission under the requested variant; variant is an enum with members INDICATIVE and UNDERWRITTEN."
    roles: [Underwriter]
    code: 200
    input: [variant]
    output: Submission
    side_effects: ["Submission DRAFT -> SCORED or SCORED -> SCORED", "compute risk_score, risk_band, litigation_units, disclosure_packages_considered per calculations.governance_risk_assessment", "write DisclosurePackage.financial_subscore / governance_subscore and LitigationEvent.weight_units for the consumed set", "increment Submission.version by 1"]
  - method: POST
    path: "/dno/submissions/{id}/quotes"
    description: "Issue a quote on a scored submission; supersedes any prior OFFERED quote."
    roles: [Underwriter]
    code: 201
    input: [expected_submission_version, offered_limit_usd, offered_retention_usd, offered_side_c_sublimit_usd, quote_valid_until]
    output: Quote
    side_effects: ["Submission SCORED -> QUOTED", "snapshot risk_band_at_quote from Submission.risk_band", "compute net_premium_usd, gross_premium_usd, broker_commission_usd, premium_tax_usd, total_payable_usd per calculations.net_premium_quotation and calculations.premium_grossup_and_tax", "auto-create the mandatory CONDUCT ExclusionTerm in PROPOSED with wording_variant BROAD, premium_impact_pct 0.00 and last_actor_role Underwriter", "supersede sibling OFFERED quotes", "increment Submission.version by 1"]
  - method: GET
    path: "/dno/submissions/{id}/quotes"
    description: "List the quotes issued on a submission."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Quote[]
    side_effects: []
  - method: GET
    path: "/dno/quotes/{id}"
    description: "Read one quote with its premium breakdown."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: []
    output: Quote
    side_effects: []
  - method: POST
    path: "/dno/quotes/{id}/exclusion-terms"
    description: "Open negotiation on an additional exclusion wording for a quote."
    roles: [Underwriter]
    code: 201
    input: [exclusion_type, wording_variant, premium_impact_pct]
    output: ExclusionTerm
    side_effects: ["create the term in PROPOSED with round_count 1, proposed_by_role and last_actor_role set to Underwriter"]
  - method: GET
    path: "/dno/quotes/{id}/exclusion-terms"
    description: "List the exclusion terms under negotiation on a quote."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ExclusionTerm[]
    side_effects: []
  - method: POST
    path: "/dno/exclusion-terms/{id}/counter"
    description: "Counter the outstanding wording on an exclusion term; the fourth round forces an impasse."
    roles: [Underwriter, RiskManager]
    code: 200
    input: [wording_variant, premium_impact_pct]
    output: ExclusionTerm
    side_effects: ["ExclusionTerm PROPOSED -> COUNTERED, COUNTERED -> PROPOSED, or -> IMPASSE at MAX_NEGOTIATION_ROUNDS", "increment round_count by 1 and set last_actor_role to the acting role", "increment ExclusionTerm.version by 1"]
  - method: POST
    path: "/dno/exclusion-terms/{id}/resolve"
    description: "Agree or reject the outstanding wording on an exclusion term; resolution is an enum with members AGREE and REJECT."
    roles: [Underwriter, RiskManager]
    code: 200
    input: [resolution]
    output: ExclusionTerm
    side_effects: ["ExclusionTerm -> AGREED (freezing agreed_variant) or -> REJECTED", "increment ExclusionTerm.version by 1"]
  - method: POST
    path: "/dno/quotes/{id}/accept"
    description: "Bind the quote and issue the policy with its coverage parts."
    roles: [RiskManager]
    code: 201
    input: []
    output: Policy
    side_effects: ["Quote OFFERED -> ACCEPTED and Submission QUOTED -> BOUND", "create Policy with policy_number from the monotonic counter, coverage_status INCEPTED, premium_status INVOICED", "create CoverageParts in the fixed order SIDE_A, SIDE_B, then SIDE_C when the sublimit > 0", "compute Policy.gross_premium_usd per calculations.bound_premium_exclusion_adjustment and premium_due_date = bind instant + 30 days", "recompute Insured.aggregate_bound_side_c_usd, available_side_c_capacity_usd, capacity_posture, open_policy_count", "increment Insured.version and Submission.version by 1"]
  - method: GET
    path: "/dno/policies/{id}"
    description: "Read one policy with its derived ledger and posture fields."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: []
    output: Policy
    side_effects: []
  - method: GET
    path: "/dno/policies"
    description: "List policies, optionally filtered by submission, insured, quote or coverage status."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: ["submission_id?", "insured_id?", "quote_id?", "coverage_status?", "limit?", "offset?"]
    output: Policy[]
    side_effects: []
  - method: GET
    path: "/dno/policies/{id}/coverage-parts"
    description: "List a policy's Side A, Side B and Side C coverage parts with their erosion."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: CoveragePart[]
    side_effects: []
  - method: POST
    path: "/dno/policies/{id}/layers"
    description: "Subscribe a primary or excess layer band into the policy's tower."
    roles: [Underwriter]
    code: 201
    input: [carrier_name, attachment_point_usd, limit_usd, participation_pct, form_type, "underlying_layer_id?", "dic_deviation_notes?"]
    output: Layer
    side_effects: ["create the Layer in ATTACHED with is_primary = (attachment_point_usd == 0)", "recompute Policy.placed_limit_usd and Policy.tower_posture per calculations.tower_placement_posture", "increment Policy.version by 1"]
  - method: GET
    path: "/dno/layers/{id}"
    description: "Read one tower layer."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: []
    output: Layer
    side_effects: []
  - method: GET
    path: "/dno/layers"
    description: "List layers, optionally filtered by policy, underlying layer or status."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: ["policy_id?", "underlying_layer_id?", "status?", "limit?", "offset?"]
    output: Layer[]
    side_effects: []
  - method: POST
    path: "/dno/policies/{id}/seal-tower"
    description: "Seal the tower once the bands are contiguous and fully subscribed; layers become immutable."
    roles: [Underwriter]
    code: 200
    input: []
    output: Policy
    side_effects: ["set tower_sealed true and re-derive tower_posture to SEALED", "increment Policy.version by 1"]
  - method: POST
    path: "/dno/policies/{id}/premium-payments"
    description: "Record payment of the bound gross premium in full."
    roles: [RiskManager]
    code: 200
    input: [amount_usd]
    output: Policy
    side_effects: ["premium_status INVOICED -> PAID or DELINQUENT -> PAID, leaving coverage_status untouched", "increment Policy.version by 1"]
  - method: POST
    path: "/dno/policies/{id}/cancel"
    description: "Cancel a policy mid-term and credit the unearned premium."
    roles: [ComplianceOfficer]
    code: 200
    input: [effective_date, cancelled_reason]
    output: Policy
    side_effects: ["coverage_status -> CANCELLED", "compute return_premium_usd per calculations.cancellation_return_premium", "release ACTIVE CoverageParts and ATTACHED Layers", "recompute Insured capacity fields, freeing the released Side C limit", "increment Policy.version and Insured.version by 1"]
  - method: POST
    path: "/dno/policies/{id}/runoff-endorsements"
    description: "Endorse a run-off tail on a change of control and price it."
    roles: [ComplianceOfficer]
    code: 201
    input: [tail_years]
    output: RunoffEndorsement
    side_effects: ["coverage_status -> RUNOFF; copy runoff_start_date, runoff_end_date and runoff_premium_usd onto the Policy", "compute tail_factor_applied, severity_load_applied, unexpired_premium_credit_usd, runoff_premium_usd per calculations.runoff_premium", "re-derive reporting_deadline on every REPORTED CircumstanceReport of the policy", "increment Policy.version by 1"]
  - method: GET
    path: "/dno/policies/{id}/runoff-endorsements"
    description: "List a policy's run-off endorsements."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: RunoffEndorsement[]
    side_effects: []
  - method: POST
    path: "/dno/policies/{id}/circumstance-reports"
    description: "Report a circumstance that may give rise to a claim, fixing an in-period notice date."
    roles: [RiskManager]
    code: 201
    input: [description, discovered_date, potential_claimants, estimated_exposure_usd]
    output: CircumstanceReport
    side_effects: ["set notice_date to the logical clock and compute reporting_deadline per calculations.reporting_deadline_derivation"]
  - method: GET
    path: "/dno/policies/{id}/circumstance-reports"
    description: "List a policy's circumstance reports."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: CircumstanceReport[]
    side_effects: []
  - method: POST
    path: "/dno/circumstance-reports/{id}/mature"
    description: "Mature a reported circumstance into a claim whose notice date relates back to the report."
    roles: [ClaimsAdjuster]
    code: 201
    input: [claim_type, claimant_name, claimant_capacity, wrongful_act_date, alleged_damages_usd]
    output: Claim
    side_effects: ["CircumstanceReport REPORTED -> MATURED", "create the Claim in NOTICED with circumstance_report_id set and notice_date = report.notice_date", "set retention_remaining_usd from policy.retention_usd", "increment Policy.open_claim_count and Policy.version by 1"]
  - method: POST
    path: "/dno/policies/{id}/claims"
    description: "Notice a claim first made against the insured during the policy period."
    roles: [RiskManager]
    code: 201
    input: [claim_type, claimant_name, claimant_capacity, wrongful_act_date, alleged_damages_usd]
    output: Claim
    side_effects: ["create the Claim in NOTICED with notice_date = the logical clock", "set retention_remaining_usd from policy.retention_usd", "increment Policy.open_claim_count and Policy.version by 1"]
  - method: GET
    path: "/dno/claims/{id}"
    description: "Read one claim with its retention, defense and indemnity ledger."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: GET
    path: "/dno/claims"
    description: "List claims, optionally filtered by policy, originating circumstance report or status."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: ["policy_id?", "circumstance_report_id?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []
  - method: POST
    path: "/dno/claims/{id}/coverage-decision"
    description: "Accept coverage under a reservation of rights with an allocation method, or deny coverage; decision is an enum with members ACCEPT_WITH_ROR and DENY, and allocation_method takes the Claim.allocation_method members."
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision, "allocation_method?", "denial_reason?"]
    output: Claim
    side_effects: ["Claim NOTICED -> COVERAGE_ACCEPTED freezing allocation_method, or -> DENIED recording denial_reason", "on a DENY after advancement: claw back ADVANCED DefenseInvoices, void SUBMITTED ones, reverse part erosion, restore retention and re-attach de-exhausted Layers", "decrement Policy.open_claim_count on a DENY", "increment Claim.version and Policy.version by 1"]
  - method: POST
    path: "/dno/claims/{id}/defense-invoices"
    description: "Submit a defense counsel invoice split into covered, uncovered and mixed matter amounts."
    roles: [RiskManager]
    code: 201
    input: [law_firm_name, invoice_reference, billed_amount_usd, covered_matter_amount_usd, uncovered_matter_amount_usd, mixed_matter_amount_usd, insured_person_defendant_count, entity_defendant_count]
    output: DefenseInvoice
    side_effects: ["create the invoice in SUBMITTED with no allocation applied yet"]
  - method: GET
    path: "/dno/claims/{id}/defense-invoices"
    description: "List a claim's defense invoices with their allocation results."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: DefenseInvoice[]
    side_effects: []
  - method: POST
    path: "/dno/defense-invoices/{id}/allocate"
    description: "Allocate a submitted invoice and advance the covered portion through the waterfall."
    roles: [ClaimsAdjuster]
    code: 200
    input: [expected_claim_version]
    output: DefenseInvoice
    side_effects: ["DefenseInvoice SUBMITTED -> ADVANCED and Claim COVERAGE_ACCEPTED -> DEFENSE_ADVANCING", "compute covered_allocated_usd per calculations.defense_cost_allocation and retention_applied_usd / advanced_usd / unfunded_excess_usd per calculations.defense_advancement_waterfall", "erode the SIDE_B then SIDE_A CoverageParts, exhausting them when the limit is reached and marking Layers EXHAUSTED", "recompute Policy.total_eroded_usd, aggregate_remaining_usd, tower_posture", "increment Claim.version, DefenseInvoice.version, CoveragePart.version and Policy.version by 1"]
  - method: POST
    path: "/dno/claims/{id}/settlement-proposals"
    description: "Recommend a settlement amount to the insured for consent."
    roles: [ClaimsAdjuster]
    code: 201
    input: [expected_claim_version, recommended_amount_usd]
    output: SettlementProposal
    side_effects: ["Claim -> SETTLEMENT_PENDING", "create the proposal in RECOMMENDED with recommended_by_user_id = the acting X-User-ID", "supersede any earlier proposal of this claim", "increment Claim.version by 1"]
  - method: GET
    path: "/dno/claims/{id}/settlement-proposals"
    description: "List a claim's settlement proposals with their consent outcome and hammer cap."
    roles: [Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: SettlementProposal[]
    side_effects: []
  - method: POST
    path: "/dno/settlement-proposals/{id}/respond"
    description: "Consent to or refuse the recommended settlement; a refusal engages the hammer clause. response is an enum with members CONSENT and REFUSE."
    roles: [RiskManager]
    code: 200
    input: [response, "refusal_reason?"]
    output: SettlementProposal
    side_effects: ["SettlementProposal RECOMMENDED -> CONSENTED or -> REFUSED", "set hammer_pct_applied and insurer_indemnity_cap_usd per calculations.hammer_clause_insurer_share", "increment SettlementProposal.version by 1"]
  - method: POST
    path: "/dno/claims/{id}/resolve"
    description: "Fund the resolution of a claim, applying the hammer cap and splitting indemnity across coverage parts."
    roles: [ClaimsAdjuster]
    code: 200
    input: [final_resolution_amount_usd, "post_refusal_defense_usd?"]
    output: Claim
    side_effects: ["Claim SETTLEMENT_PENDING -> SETTLED and the proposal -> FUNDED or -> HAMMER_APPLIED", "compute insurer_share_usd, indemnity_paid_usd, insured_retained_usd, hammer_applied per calculations.hammer_clause_insurer_share", "split the insurer share across eligible CoverageParts per calculations.settlement_indemnity_split, exhausting parts and Layers and re-deriving tower_posture", "decrement Policy.open_claim_count", "increment Claim.version, Policy.version and each touched CoveragePart.version by 1"]
  - method: POST
    path: "/dno/ops-runs"
    description: "Advance the system epoch: activate and expire policies, flag delinquent premium, lapse quotes and submissions, revert fully-lapsed submissions, lapse circumstance reports past their reporting deadline and expire run-off endorsements."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: { epoch: integer, current_utc: datetime, activated_policy_count: integer, expired_policy_count: integer, delinquent_policy_count: integer, lapsed_quote_count: integer, expired_submission_count: integer, reverted_submission_count: integer, lapsed_circumstance_report_count: integer, expired_runoff_count: integer }
    side_effects: ["Policy INCEPTED -> ACTIVE, ACTIVE -> EXPIRED, RUNOFF -> EXPIRED", "Policy premium_status INVOICED -> DELINQUENT at premium_due_date", "Quote OFFERED -> LAPSED at quote_valid_until", "Submission -> EXPIRED at expires_at and QUOTED -> SCORED when every quote is terminal", "CircumstanceReport REPORTED -> LAPSED at reporting_deadline", "RunoffEndorsement ENDORSED -> EXPIRED", "recompute Insured capacity fields and Policy tower_posture for every affected policy"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock used by every deadline, window and recency rule. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z, the fixed server startup default; it never falls back to real wall-clock time. The clock also stamps created_at and updated_at on subsequent writes."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["no entity transitions happen here; deadlines are only acted on by POST /dno/ops-runs"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of Underwriter, RiskManager, ClaimsAdjuster, ComplianceOfficer"
    applies_to: ["all endpoints"]
  - id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    condition: "the acting role is not listed in the endpoint's roles"
    applies_to: ["all endpoints"]
  - id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    condition: "a RiskManager acts on a resource whose owning Insured.id differs from the acting X-User-ID"
    applies_to: ["POST /dno/quotes/{id}/accept", "POST /dno/exclusion-terms/{id}/counter", "POST /dno/exclusion-terms/{id}/resolve", "POST /dno/policies/{id}/premium-payments", "POST /dno/policies/{id}/circumstance-reports", "POST /dno/policies/{id}/claims", "POST /dno/claims/{id}/defense-invoices", "POST /dno/settlement-proposals/{id}/respond"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "the ClaimsAdjuster funding a resolution is the same X-User-ID that recorded the settlement recommendation"
    applies_to: ["POST /dno/claims/{id}/resolve"]
  - id: ERR_INSURED_NOT_FOUND
    http_status: 404
    condition: "the {id} in an insured-scoped path matches no Insured"
    applies_to: ["PATCH /dno/insureds/{id}", "GET /dno/insureds/{id}", "POST /dno/insureds/{id}/disclosure-packages", "GET /dno/insureds/{id}/disclosure-packages", "POST /dno/insureds/{id}/litigation-events", "GET /dno/insureds/{id}/litigation-events"]
  - id: ERR_SUBMISSION_NOT_FOUND
    http_status: 404
    condition: "the {id} in a submission-scoped path, or insured_id / submission_id supplied in a body, matches no Submission"
    applies_to: ["GET /dno/submissions/{id}", "POST /dno/submissions/{id}/score", "POST /dno/submissions/{id}/quotes", "GET /dno/submissions/{id}/quotes"]
  - id: ERR_QUOTE_NOT_FOUND
    http_status: 404
    condition: "the {id} in a quote-scoped path matches no Quote"
    applies_to: ["GET /dno/quotes/{id}", "POST /dno/quotes/{id}/exclusion-terms", "GET /dno/quotes/{id}/exclusion-terms", "POST /dno/quotes/{id}/accept"]
  - id: ERR_EXCLUSION_TERM_NOT_FOUND
    http_status: 404
    condition: "the {id} in an exclusion-term path matches no ExclusionTerm"
    applies_to: ["POST /dno/exclusion-terms/{id}/counter", "POST /dno/exclusion-terms/{id}/resolve"]
  - id: ERR_POLICY_NOT_FOUND
    http_status: 404
    condition: "the {id} in a policy-scoped path matches no Policy"
    applies_to: ["GET /dno/policies/{id}", "GET /dno/policies/{id}/coverage-parts", "POST /dno/policies/{id}/layers", "POST /dno/policies/{id}/seal-tower", "POST /dno/policies/{id}/premium-payments", "POST /dno/policies/{id}/cancel", "POST /dno/policies/{id}/runoff-endorsements", "GET /dno/policies/{id}/runoff-endorsements", "POST /dno/policies/{id}/circumstance-reports", "GET /dno/policies/{id}/circumstance-reports", "POST /dno/policies/{id}/claims"]
  - id: ERR_LAYER_NOT_FOUND
    http_status: 404
    condition: "the {id} in a layer path, or underlying_layer_id in a body, matches no Layer of the same policy"
    applies_to: ["GET /dno/layers/{id}", "POST /dno/policies/{id}/layers"]
  - id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    condition: "the {id} in a claim-scoped path matches no Claim"
    applies_to: ["GET /dno/claims/{id}", "POST /dno/claims/{id}/coverage-decision", "POST /dno/claims/{id}/defense-invoices", "GET /dno/claims/{id}/defense-invoices", "POST /dno/claims/{id}/settlement-proposals", "GET /dno/claims/{id}/settlement-proposals", "POST /dno/claims/{id}/resolve"]
  - id: ERR_CIRCUMSTANCE_REPORT_NOT_FOUND
    http_status: 404
    condition: "the {id} in a circumstance-report path matches no CircumstanceReport"
    applies_to: ["POST /dno/circumstance-reports/{id}/mature"]
  - id: ERR_DEFENSE_INVOICE_NOT_FOUND
    http_status: 404
    condition: "the {id} in a defense-invoice path matches no DefenseInvoice"
    applies_to: ["POST /dno/defense-invoices/{id}/allocate"]
  - id: ERR_SETTLEMENT_PROPOSAL_NOT_FOUND
    http_status: 404
    condition: "the {id} in a settlement-proposal path matches no SettlementProposal"
    applies_to: ["POST /dno/settlement-proposals/{id}/respond"]
  - id: ERR_INVALID_REQUEST
    http_status: 422
    condition: "a required body field is missing, a field has the wrong type, an enum value is not a declared member, a numeric value breaches a §1.1 constraint, or limit / offset fall outside their declared range"
    applies_to: ["all write endpoints", "all list endpoints"]
  - id: ERR_CONDITIONAL_FIELD_REQUIRED
    http_status: 422
    condition: "a field that is required only in a given context is absent — allocation_method on ACCEPT_WITH_ROR, denial_reason on DENY, refusal_reason on REFUSE, dic_deviation_notes on a DIFFERENCE_IN_CONDITIONS layer, change_of_control_date on a non-INDEPENDENT control status"
    applies_to: ["POST /dno/claims/{id}/coverage-decision", "POST /dno/settlement-proposals/{id}/respond", "POST /dno/policies/{id}/layers", "PATCH /dno/insureds/{id}"]
  - id: ERR_PERIOD_INVALID
    http_status: 422
    condition: "requested_period_end is not strictly after requested_period_start"
    applies_to: ["POST /dno/submissions"]
  - id: ERR_PROGRAM_TARGET_BELOW_LIMIT
    http_status: 422
    condition: "requested_program_target_limit_usd is below requested_limit_usd"
    applies_to: ["POST /dno/submissions"]
  - id: ERR_STALE_VERSION
    http_status: 412
    condition: "the supplied expected_<parent>_version does not equal the stored parent version (see §1.2.1)"
    applies_to: ["PATCH /dno/insureds/{id}", "POST /dno/submissions/{id}/quotes", "POST /dno/claims/{id}/settlement-proposals", "POST /dno/defense-invoices/{id}/allocate"]
  - id: ERR_INVALID_SUBMISSION_STATE
    http_status: 409
    condition: "the submission is not in a state that permits the requested trigger"
    applies_to: ["POST /dno/submissions/{id}/score", "POST /dno/submissions/{id}/quotes"]
  - id: ERR_INVALID_QUOTE_STATE
    http_status: 409
    condition: "the quote is not OFFERED"
    applies_to: ["POST /dno/quotes/{id}/exclusion-terms", "POST /dno/quotes/{id}/accept"]
  - id: ERR_INVALID_TERM_STATE
    http_status: 409
    condition: "the exclusion term is not in PROPOSED or COUNTERED"
    applies_to: ["POST /dno/exclusion-terms/{id}/counter", "POST /dno/exclusion-terms/{id}/resolve"]
  - id: ERR_TERM_ACTOR_SEQUENCE
    http_status: 409
    condition: "the acting role is the same role that recorded the term's most recent counter, so the negotiation would not alternate"
    applies_to: ["POST /dno/exclusion-terms/{id}/counter", "POST /dno/exclusion-terms/{id}/resolve"]
  - id: ERR_INVALID_POLICY_STATE
    http_status: 409
    condition: "the policy's coverage_status does not permit the requested operation"
    applies_to: ["POST /dno/policies/{id}/layers", "POST /dno/policies/{id}/seal-tower", "POST /dno/policies/{id}/cancel", "POST /dno/policies/{id}/runoff-endorsements", "POST /dno/policies/{id}/circumstance-reports", "POST /dno/policies/{id}/claims"]
  - id: ERR_TOWER_ALREADY_SEALED
    http_status: 409
    condition: "the tower has already been sealed, so layers are immutable and cannot be sealed again"
    applies_to: ["POST /dno/policies/{id}/layers", "POST /dno/policies/{id}/seal-tower"]
  - id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    condition: "the claim is not in a state that permits the requested trigger"
    applies_to: ["POST /dno/claims/{id}/coverage-decision", "POST /dno/claims/{id}/defense-invoices", "POST /dno/defense-invoices/{id}/allocate", "POST /dno/claims/{id}/settlement-proposals", "POST /dno/claims/{id}/resolve"]
  - id: ERR_INVALID_INVOICE_STATE
    http_status: 409
    condition: "the defense invoice is not SUBMITTED"
    applies_to: ["POST /dno/defense-invoices/{id}/allocate"]
  - id: ERR_INVALID_PROPOSAL_STATE
    http_status: 409
    condition: "the settlement proposal is not RECOMMENDED"
    applies_to: ["POST /dno/settlement-proposals/{id}/respond"]
  - id: ERR_INVALID_CIRCUMSTANCE_STATE
    http_status: 409
    condition: "the circumstance report is not REPORTED"
    applies_to: ["POST /dno/circumstance-reports/{id}/mature"]
  - id: ERR_CONSENT_PENDING
    http_status: 409
    condition: "the claim's live settlement proposal is still RECOMMENDED, so no resolution may be funded"
    applies_to: ["POST /dno/claims/{id}/resolve"]
  - id: ERR_MANDATORY_EXCLUSION_MISSING
    http_status: 422
    condition: "a mandatory exclusion for the risk band was rejected rather than agreed, so the quote cannot be bound"
    applies_to: ["POST /dno/quotes/{id}/accept"]
  - id: ERR_UNRESOLVED_EXCLUSION_TERMS
    http_status: 409
    condition: "at least one exclusion term of the quote is still PROPOSED, COUNTERED or IMPASSE"
    applies_to: ["POST /dno/quotes/{id}/accept"]
  - id: ERR_INSURED_VS_INSURED_EXCLUDED
    http_status: 422
    condition: "the claimant_capacity falls under the agreed insured-versus-insured exclusion and no carve-back applies"
    applies_to: ["POST /dno/policies/{id}/claims", "POST /dno/circumstance-reports/{id}/mature"]
  - id: ERR_QUOTE_EXPIRED
    http_status: 409
    condition: "the logical clock has reached quote_valid_until, so the quote can no longer be accepted"
    applies_to: ["POST /dno/quotes/{id}/accept"]
  - id: ERR_NOTICE_OUTSIDE_PERIOD
    http_status: 422
    condition: "the notice date falls outside the half-open claims-made period [period_start, period_end)"
    applies_to: ["POST /dno/policies/{id}/claims", "POST /dno/policies/{id}/circumstance-reports"]
  - id: ERR_PRIOR_ACTS_EXCLUDED
    http_status: 422
    condition: "wrongful_act_date precedes the policy's retroactive date"
    applies_to: ["POST /dno/policies/{id}/claims", "POST /dno/circumstance-reports/{id}/mature"]
  - id: ERR_POST_TRANSACTION_ACT
    http_status: 422
    condition: "wrongful_act_date falls on or after the run-off start date, so the act is outside the tail's frozen coverage"
    applies_to: ["POST /dno/policies/{id}/claims", "POST /dno/circumstance-reports/{id}/mature"]
  - id: ERR_REPORTING_WINDOW_CLOSED
    http_status: 409
    condition: "the logical clock has reached the circumstance report's reporting_deadline, so it can no longer mature into a claim"
    applies_to: ["POST /dno/circumstance-reports/{id}/mature"]
  - id: ERR_DISCLOSURE_REQUIRED
    http_status: 422
    condition: "the insured has no disclosure package, so the risk cannot be scored"
    applies_to: ["POST /dno/submissions/{id}/score"]
  - id: ERR_DISCLOSURE_STALE
    http_status: 422
    condition: "every disclosure package of the insured predates the staleness cutoff of 540 days before the logical clock"
    applies_to: ["POST /dno/submissions/{id}/score"]
  - id: ERR_LAYER_OVERLAP
    http_status: 409
    condition: "the proposed attachment band partially overlaps an existing non-RELEASED layer band of the policy without being identical to it"
    applies_to: ["POST /dno/policies/{id}/layers"]
  - id: ERR_PARTICIPATION_OVERSUBSCRIBED
    http_status: 409
    condition: "the participations recorded for one attachment band would exceed 1.0000"
    applies_to: ["POST /dno/policies/{id}/layers"]
  - id: ERR_DIC_SHARE_EXCEEDED
    http_status: 422
    condition: "difference-in-conditions layers would carry more than the permitted fraction of the tower limit"
    applies_to: ["POST /dno/policies/{id}/layers"]
  - id: ERR_PRIMARY_LAYER_IMMUTABLE
    http_status: 409
    condition: "an attempt is made to add a second primary layer, or a layer whose attachment_point_usd is 0 while a primary already exists"
    applies_to: ["POST /dno/policies/{id}/layers"]
  - id: ERR_TOWER_GAP
    http_status: 409
    condition: "the layer bands are not contiguous from 0 up to the placed limit, so the tower cannot be sealed"
    applies_to: ["POST /dno/policies/{id}/seal-tower"]
  - id: ERR_PARTICIPATION_INCOMPLETE
    http_status: 409
    condition: "at least one attachment band is subscribed below 1.0000, so the tower cannot be sealed"
    applies_to: ["POST /dno/policies/{id}/seal-tower"]
  - id: ERR_TOWER_LIMIT_EXCEEDED
    http_status: 409
    condition: "the layer's top of band would carry the placed limit above the policy's program target limit"
    applies_to: ["POST /dno/policies/{id}/layers"]
  - id: ERR_SIDE_C_SUBLIMIT_EXCEEDS_AGGREGATE
    http_status: 422
    condition: "offered_side_c_sublimit_usd exceeds offered_limit_usd"
    applies_to: ["POST /dno/submissions/{id}/quotes"]
  - id: ERR_ENTITY_CAPACITY_EXCEEDED
    http_status: 409
    condition: "binding would push the insured's committed entity securities capacity, aggregated over policies whose periods overlap, above the entity capacity cap"
    applies_to: ["POST /dno/quotes/{id}/accept"]
  - id: ERR_DUPLICATE_INVOICE_REFERENCE
    http_status: 409
    condition: "invoice_reference is already used by a non-VOIDED defense invoice of the same claim"
    applies_to: ["POST /dno/claims/{id}/defense-invoices"]
  - id: ERR_INVOICE_AMOUNT_MISMATCH
    http_status: 422
    condition: "covered_matter_amount_usd + uncovered_matter_amount_usd + mixed_matter_amount_usd does not equal billed_amount_usd, or the defendant counts are both zero"
    applies_to: ["POST /dno/claims/{id}/defense-invoices"]
  - id: ERR_LIMIT_EXHAUSTED
    http_status: 409
    condition: "the policy aggregate remaining is zero, so nothing further can be advanced or paid"
    applies_to: ["POST /dno/defense-invoices/{id}/allocate", "POST /dno/claims/{id}/resolve"]
  - id: ERR_PREMIUM_DELINQUENT
    http_status: 402
    condition: "the policy's premium_status is DELINQUENT, so no insurer money may leave"
    applies_to: ["POST /dno/defense-invoices/{id}/allocate", "POST /dno/claims/{id}/resolve"]
  - id: ERR_PREMIUM_AMOUNT_MISMATCH
    http_status: 422
    condition: "amount_usd does not equal the policy's bound gross premium"
    applies_to: ["POST /dno/policies/{id}/premium-payments"]
  - id: ERR_RUNOFF_ALREADY_ENDORSED
    http_status: 409
    condition: "the policy already carries a run-off endorsement"
    applies_to: ["POST /dno/policies/{id}/runoff-endorsements"]
  - id: ERR_NO_CHANGE_OF_CONTROL
    http_status: 409
    condition: "the insured's control_status is INDEPENDENT, so there is no transaction to run off"
    applies_to: ["POST /dno/policies/{id}/runoff-endorsements"]
  - id: ERR_INVALID_TAIL_YEARS
    http_status: 422
    condition: "tail_years is not a member of the permitted set {1, 2, 3, 6}"
    applies_to: ["POST /dno/policies/{id}/runoff-endorsements"]
  - id: ERR_CONTROL_CHANGE_BLOCKS_BIND
    http_status: 409
    condition: "the insured's control_status is not INDEPENDENT, so no new policy may incept"
    applies_to: ["POST /dno/quotes/{id}/accept"]
  - id: ERR_OPEN_CLAIMS_BLOCK_CANCEL
    http_status: 409
    condition: "the policy has at least one open claim, so it cannot be cancelled"
    applies_to: ["POST /dno/policies/{id}/cancel"]

# =============================================================================
# 1.7 RBAC Permission Matrix
# =============================================================================
roles:
  - name: Underwriter
    description: "Management-liability underwriter: intake, scoring, quoting, exclusion wording from the insurer side, tower construction and sealing."
    identity: opaque
    exclusive_operations:
      - "POST /dno/insureds"
      - "POST /dno/insureds/{id}/disclosure-packages"
      - "POST /dno/insureds/{id}/litigation-events"
      - "POST /dno/submissions"
      - "POST /dno/submissions/{id}/score"
      - "POST /dno/submissions/{id}/quotes"
      - "POST /dno/quotes/{id}/exclusion-terms"
      - "POST /dno/policies/{id}/layers"
      - "POST /dno/policies/{id}/seal-tower"
    shared_operations:
      - "POST /dno/exclusion-terms/{id}/counter (shared with RiskManager; the alternation rule at priority 42 decides who may act next)"
      - "POST /dno/exclusion-terms/{id}/resolve (shared with RiskManager)"
      - "every GET endpoint"
  - name: RiskManager
    description: "The insured organization's risk manager: negotiates exclusion wording from the buyer side, binds the quote, pays premium, gives notice and consents to settlements. Acts only on its own insured's resources."
    identity: "entity_backed:Insured"
    exclusive_operations:
      - "POST /dno/quotes/{id}/accept"
      - "POST /dno/policies/{id}/premium-payments"
      - "POST /dno/policies/{id}/circumstance-reports"
      - "POST /dno/policies/{id}/claims"
      - "POST /dno/claims/{id}/defense-invoices"
      - "POST /dno/settlement-proposals/{id}/respond"
    shared_operations:
      - "POST /dno/exclusion-terms/{id}/counter (shared with Underwriter)"
      - "POST /dno/exclusion-terms/{id}/resolve (shared with Underwriter)"
      - "every GET endpoint"
  - name: ClaimsAdjuster
    description: "Claims adjuster: coverage decisions, defense-cost allocation and advancement, settlement recommendations and funding. Subject to segregation of duties — the adjuster who recommended a settlement may not fund its resolution."
    identity: opaque
    exclusive_operations:
      - "POST /dno/circumstance-reports/{id}/mature"
      - "POST /dno/claims/{id}/coverage-decision"
      - "POST /dno/defense-invoices/{id}/allocate"
      - "POST /dno/claims/{id}/settlement-proposals"
      - "POST /dno/claims/{id}/resolve"
    shared_operations:
      - "every GET endpoint"
  - name: ComplianceOfficer
    description: "Compliance and portfolio administration: insured control-status maintenance, cancellation, run-off endorsement, epoch advancement and the logical clock."
    identity: opaque
    exclusive_operations:
      - "PATCH /dno/insureds/{id}"
      - "POST /dno/policies/{id}/cancel"
      - "POST /dno/policies/{id}/runoff-endorsements"
      - "POST /dno/ops-runs"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"
