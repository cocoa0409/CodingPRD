              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_id}", factor_count: 1, evidentiary_standard_count: 0, stringency_written_finding: "COMPARABLE", stringency_operation_finding: "COMPARABLE", expected_nqtl_item_version: "${item_v}" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { ca_thin_id: $.data.id }
          trigger:
            - call: "POST /parity/comparative-analyses/${ca_thin_id}/submit"
