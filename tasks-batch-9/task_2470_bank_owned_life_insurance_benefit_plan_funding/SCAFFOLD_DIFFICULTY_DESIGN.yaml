              as: TreasuryController
            - call: "POST /purchase-requests/${pr_mec_id}/request-concurrence"
              payload: {}
              as: BenefitsAnalyst
              as_user_id: "analyst-1"
            - call: "POST /purchase-requests/${pr_mec_id}/approve"
              payload: {}
