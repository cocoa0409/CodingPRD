              as: IntakeAgent
              captures: { call_1: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_1}", caller_name: "Ada Kim", caller_phone: "+14155550102", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "call two" }
              as: IntakeAgent
              captures: { call_2: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_1}", caller_name: "Ivo Cruz", caller_phone: "+14155550103", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "call three" }
              as: IntakeAgent
              captures: { call_3: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_2}", caller_name: "Rey Osei", caller_phone: "+14155550104", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "other practice" }
              as: IntakeAgent
              captures: { call_4: $.data.id }
          trigger:
            - call: "GET /triage-calls?practice_id=${practice_1}&limit=2&offset=0"
              as: ChargeNurse
              captures: { page1_total: $.total_count, page1_more: $.has_more, page1_first: "$.data[0].id" }
            - call: "GET /triage-calls?practice_id=${practice_1}&limit=2&offset=2"
              as: ChargeNurse
              captures: { page2_total: $.total_count, page2_more: $.has_more, page2_first: "$.data[0].id" }
            - call: "GET /triage-calls?practice_id=${practice_2}"
              as: ChargeNurse
              captures: { other_total: $.total_count, other_first: "$.data[0].id" }
            - call: "GET /triage-calls?status=INTAKE"
              as: ChargeNurse
              captures: { status_total: $.total_count, status_more: $.has_more }
          assert:
            - "${page1_total} == 3"
            - "${page1_more} == true"
            - "the first page contains exactly 2 rows and every row has practice_id == ${practice_1}"
            - "${page2_total} == 3"
            - "${page2_more} == false"
            - "the second page contains exactly 1 row"
            - "${page1_first} != ${page2_first}"
            - "${other_total} == 1"
            - "${other_first} == ${call_4}"
            - "${status_total} == 4"
            - "${status_more} == false"
            - "the unfiltered-by-practice INTAKE listing applies the default limit of 10, so all 4 rows fit on one page"

