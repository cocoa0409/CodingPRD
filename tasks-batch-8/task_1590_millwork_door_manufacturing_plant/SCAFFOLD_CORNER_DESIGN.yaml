            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-LATE", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { err_closed_proj: $.data.error_id } }
            - { call: "PUT /millwork/projects/${proj_id}/status", payload: { target_status: "ARCHIVED" }, as: PlantManager, captures: { proj_arch: $.data.status } }
            - { call: "PUT /millwork/projects/${proj_id}/status", payload: { target_status: "COMPLETED" }, as: PlantManager, captures: { err_arch: $.data.error_id } }
          assert:
            - "captured ${err_noop} == ERR_NO_OPENINGS"
            - "captured ${err_nm} == ERR_OPENINGS_NOT_MACHINED"
            - "captured ${err_ns} == ERR_OPENINGS_NOT_STAGED"
            - "captured ${err_nsh} == ERR_OPENINGS_NOT_SHIPPED"
            - "captured ${err_nacc} == ERR_OPENINGS_NOT_ACCEPTED"
            - "captured ${ord_end} == CLOSED and captured ${trip_end} == CLOSED"
            - "captured ${err_proj} == ERR_ORDERS_NOT_TERMINAL (O-EMPTY still DRAFT)"
            - "captured ${proj_end} == COMPLETED after cancelling O-EMPTY"
            - "captured ${err_closed_proj} == ERR_PROJECT_NOT_OPEN"
            - "captured ${proj_arch} == ARCHIVED and captured ${err_arch} == ERR_INVALID_PROJECT_STATUS_TRANSITION"
      - name: label_apply_stage_verify_chain
        claim_type: action_endpoint
        grounds: ["state_machines.LabelAllocation", "state_machines.Opening", "errors[ERR_LABELING_REQUIRED]", "errors[ERR_LABEL_SERIES_MISMATCH]", "errors[ERR_ROLL_NOT_ACTIVE]", "errors[ERR_ACTIVE_ALLOCATION_EXISTS]", "errors[ERR_INVALID_ALLOCATION_STATUS_TRANSITION]", "errors[ERR_LABEL_NOT_VERIFIED]"]
        distinguishing_aspect: "Rated-opening endpoint chain: direct stage from FINISHED fails (ERR_LABELING_REQUIRED); wrong-series roll fails (ERR_LABEL_SERIES_MISMATCH); retired roll fails (ERR_ROLL_NOT_ACTIVE); second issue fails (ERR_ACTIVE_ALLOCATION_EXISTS); verify-before-apply is an invalid transition; staging before verification fails (ERR_LABEL_NOT_VERIFIED); the happy path ISSUED->APPLIED->VERIFIED->STAGED succeeds."
        test_recipe:
          setup: ["Rated MIN_20 order with 1-leaf opening driven to FINISHED; rolls: UL_45MIN capacity 2, UL_20MIN capacity 2 (one retired immediately), UL_20MIN capacity 2 active."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CE-5" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/hardware-templates", payload: { template_code: "T-E5", manufacturer: "ACME", fire_rated_compatible: true }, as: PlantManager, captures: { tmpl_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-E5", species: "MAPLE", profile_code: "PR-7", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "TEMPLATE_PREP", hardware_template_id: "${tmpl_id}", fire_rating_required: "MIN_20" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "L1", width_in: 36, height_in: 84, leaf_count: 1, fire_rating: "MIN_20", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { op1: $.data.id } }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_id}", order_id: "${ord_id}", estimated_minutes: 45 }, as: ProductionLead, captures: { prog_id: $.data.id } }
            - { call: "POST /millwork/moulder-machines", payload: { machine_code: "M-E5", supported_species: ["MAPLE"] }, as: PlantManager, captures: { mach_id: $.data.id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_id}", machine_id: "${mach_id}", start_hour: 8, end_hour: 9 }, as: ProductionLead, captures: { slot_id: $.data.id } }
            - { call: "PUT /millwork/moulder-setup-slots/${slot_id}/status", payload: { target_status: "COMPLETED" }, as: ProductionLead }
            - { call: "PUT /millwork/machining-programs/${prog_id}/status", payload: { target_status: "RELEASED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "IN_PRODUCTION" }, as: ProductionLead }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "MACHINED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "FINISHING" }, as: ProductionLead }
            - { call: "POST /millwork/spray-booths", payload: { booth_code: "B-E5" }, as: PlantManager, captures: { booth_id: $.data.id } }
            - { call: "POST /millwork/finishing-batches", payload: { order_id: "${ord_id}", booth_id: "${booth_id}", cure_start_hour: 10, cure_end_hour: 14 }, as: ProductionLead, captures: { batch_id: $.data.id } }
            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "SPRAYED" }, as: ProductionLead }
            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "CURED" }, as: ProductionLead }
            - { call: "POST /millwork/finishing-batches/${batch_id}/measure", payload: { sheen_measured_gu: 35 }, as: QAInspector }
            - { call: "POST /millwork/fire-label-rolls", payload: { label_series: "UL_45MIN", serial_capacity: 2 }, as: PlantManager, captures: { roll45: $.data.id } }
            - { call: "POST /millwork/fire-label-rolls", payload: { label_series: "UL_20MIN", serial_capacity: 2 }, as: PlantManager, captures: { roll_ret: $.data.id } }
            - { call: "POST /millwork/fire-label-rolls", payload: { label_series: "UL_20MIN", serial_capacity: 2 }, as: PlantManager, captures: { roll1: $.data.id } }
            - { call: "PUT /millwork/fire-label-rolls/${roll_ret}/status", payload: { target_status: "RETIRED" }, as: LabelAuthority }
          trigger:
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "STAGED" }, as: ProductionLead, captures: { err_lbl: $.data.error_id } }
            - { call: "GET /millwork/fire-label-rolls/${roll45}", as: Any, captures: { v45: $.data.version } }
            - { call: "POST /millwork/label-allocations", payload: { opening_id: "${op1}", roll_id: "${roll45}", expected_roll_version: "${v45}" }, as: LabelAuthority, as_user_id: "la-1", captures: { err_series: $.data.error_id } }
            - { call: "GET /millwork/fire-label-rolls/${roll_ret}", as: Any, captures: { vret: $.data.version } }
            - { call: "POST /millwork/label-allocations", payload: { opening_id: "${op1}", roll_id: "${roll_ret}", expected_roll_version: "${vret}" }, as: LabelAuthority, as_user_id: "la-1", captures: { err_ret: $.data.error_id } }
            - { call: "GET /millwork/fire-label-rolls/${roll1}", as: Any, captures: { v1: $.data.version } }
            - { call: "POST /millwork/label-allocations", payload: { opening_id: "${op1}", roll_id: "${roll1}", expected_roll_version: "${v1}" }, as: LabelAuthority, as_user_id: "la-1", captures: { alloc: $.data.id } }
            - { call: "GET /millwork/fire-label-rolls/${roll1}", as: Any, captures: { v2: $.data.version } }
            - { call: "POST /millwork/label-allocations", payload: { opening_id: "${op1}", roll_id: "${roll1}", expected_roll_version: "${v2}" }, as: LabelAuthority, as_user_id: "la-1", captures: { err_dup: $.data.error_id } }
            - { call: "PUT /millwork/label-allocations/${alloc}/status", payload: { target_status: "VERIFIED" }, as: QAInspector, as_user_id: "qa-1", captures: { err_skip: $.data.error_id } }
            - { call: "PUT /millwork/label-allocations/${alloc}/status", payload: { target_status: "APPLIED" }, as: ProductionLead, as_user_id: "pl-1" }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "STAGED" }, as: ProductionLead, captures: { err_nv: $.data.error_id } }
            - { call: "PUT /millwork/label-allocations/${alloc}/status", payload: { target_status: "VERIFIED" }, as: QAInspector, as_user_id: "qa-1" }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "STAGED" }, as: ProductionLead, captures: { fab_end: $.data.fab_status } }
          assert:
            - "captured ${err_lbl} == ERR_LABELING_REQUIRED"
            - "captured ${err_series} == ERR_LABEL_SERIES_MISMATCH"
            - "captured ${err_ret} == ERR_ROLL_NOT_ACTIVE"
            - "captured ${err_dup} == ERR_ACTIVE_ALLOCATION_EXISTS"
            - "captured ${err_skip} == ERR_INVALID_ALLOCATION_STATUS_TRANSITION (ISSUED->VERIFIED)"
            - "captured ${err_nv} == ERR_LABEL_NOT_VERIFIED"
            - "captured ${fab_end} == STAGED"

  # ==================================================================
  # Section: errors
  # ==================================================================
  - section: errors
    instances:
      - name: error_sweep_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=3]"]
        distinguishing_aspect: "Every resource collection returns its specific 404 error for an unknown id — one trigger call per resource type covers the full not-found catalog."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "GET /millwork/projects/11111111-1111-4111-8111-111111111111", as: Any, captures: { e_project: $.data.error_id } }
            - { call: "GET /millwork/orders/22222222-2222-4222-8222-222222222222", as: Any, captures: { e_order: $.data.error_id } }
            - { call: "GET /millwork/openings/33333333-3333-4333-8333-333333333333", as: Any, captures: { e_opening: $.data.error_id } }
            - { call: "GET /millwork/shop-drawings/44444444-4444-4444-8444-444444444444", as: Any, captures: { e_drawing: $.data.error_id } }
            - { call: "GET /millwork/machining-programs/55555555-5555-4555-8555-555555555555", as: Any, captures: { e_program: $.data.error_id } }
            - { call: "GET /millwork/moulder-machines/66666666-6666-4666-8666-666666666666", as: Any, captures: { e_machine: $.data.error_id } }
            - { call: "GET /millwork/moulder-setup-slots/77777777-7777-4777-8777-777777777777", as: Any, captures: { e_slot: $.data.error_id } }
            - { call: "GET /millwork/spray-booths/88888888-8888-4888-8888-888888888888", as: Any, captures: { e_booth: $.data.error_id } }
            - { call: "GET /millwork/finishing-batches/99999999-9999-4999-8999-999999999999", as: Any, captures: { e_batch: $.data.error_id } }
            - { call: "GET /millwork/fire-label-rolls/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa", as: Any, captures: { e_roll: $.data.error_id } }
            - { call: "GET /millwork/label-allocations/bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb", as: Any, captures: { e_alloc: $.data.error_id } }
            - { call: "GET /millwork/delivery-trips/cccccccc-cccc-4ccc-8ccc-cccccccccccc", as: Any, captures: { e_trip: $.data.error_id } }
            - { call: "GET /millwork/punch-items/dddddddd-dddd-4ddd-8ddd-dddddddddddd", as: Any, captures: { e_punch: $.data.error_id } }
