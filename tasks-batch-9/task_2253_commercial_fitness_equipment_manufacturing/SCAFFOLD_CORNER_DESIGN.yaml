        as: FacilityManager
        as_user_id: ${f1}
        captures: {o2: $.data.id}
      - call: GET /orders/${o1}
        payload: {}
        as: OrderPlanner
      assert:
      - the ProductEngineer's POST /firmware-releases returns 201 (PE exclusive) with FirmwareRelease.${fw1}.status == ACTIVE
      - the ComplianceOfficer's withdraw returns 200 (CO exclusive) with FirmwareRelease.${fw1}.status == WITHDRAWN
      - the ServiceOpsAdmin's activate returns 200 (SOA exclusive) with PMProgram.${pm1}.status == ACTIVE
      - the ServicePartnerTech's usage-report returns 200 (SPT exclusive) with SerializedAsset.${a1}.annual_usage_hours == 1800.00
      - the OrderPlanner's settle returns 200 (OP exclusive) with Order.${o1}.billing_status == SETTLED
      - the FacilityManager's own-facility order create returns 201 (shared with OrderPlanner) with Order.${o2}.facility_id == ${f1}
      - Facility.${f1}.open_order_exposure_cents == 0 once ${o1} is SETTLED
  - name: no_role_may_perform_another_roles_exclusive_operation
    claim_type: role_cannot_perform_others_exclusive
    grounds:
    - rbac[ProductEngineer].exclusive_operations
    - rbac[ComplianceOfficer].exclusive_operations
    - rbac[OrderPlanner].exclusive_operations
    - rbac[ServicePartnerTech].exclusive_operations
    - rbac[ServiceOpsAdmin].exclusive_operations
    - validations[priority=2]
    - errors[ERR_ROLE_NOT_PERMITTED]
    distinguishing_aspect: Eight cross-role probes all return 403 ERR_ROLE_NOT_PERMITTED even though every path id is a non-existent UUID and one body is empty — the priority-2 role gate is evaluated before
      the priority-3 path check and the priority-7 schema check, so no store state is needed to prove the table.
    test_recipe:
      setup:
      - The store is empty; no entity has the id 00000000-0000-4000-8000-000000000000.
      - Each probe pairs an endpoint with a role that is NOT listed for it in §1.5.
      setup_api_calls: []
      trigger:
      - call: POST /model-revisions/00000000-0000-4000-8000-000000000000/release
        payload: {}
        as: ProductEngineer
        captures: {e1: $.data.error_id}
      - call: POST /firmware-certifications/00000000-0000-4000-8000-000000000000/certify
        payload: {}
        as: ProductEngineer
        as_user_id: pe-01
        captures: {e2: $.data.error_id}
      - call: POST /equipment-models
        payload: {name: Rogue Model, category: CARDIO, duty_class: LIGHT_COMMERCIAL, unit_list_price_cents: 100000, shipping_weight_kg: 50.0, allowed_finish_codes: [GRAPHITE]}
        as: ComplianceOfficer
        captures: {e3: $.data.error_id}
      - call: POST /orders/00000000-0000-4000-8000-000000000000/quote
        payload: {}
        as: FacilityManager
        as_user_id: 00000000-0000-4000-8000-000000000000
        captures: {e4: $.data.error_id}
      - call: POST /install-jobs/00000000-0000-4000-8000-000000000000/arrive
        payload: {}
        as: OrderPlanner
        captures: {e5: $.data.error_id}
      - call: POST /service-partners/00000000-0000-4000-8000-000000000000/parts-receipt
        payload: {units: 5}
        as: ProductEngineer
        captures: {e6: $.data.error_id}
      - call: POST /serialized-assets/00000000-0000-4000-8000-000000000000/scrap
        payload: {scrap_reason: not my call}
        as: ServicePartnerTech
        as_user_id: 00000000-0000-4000-8000-000000000000
        captures: {e7: $.data.error_id}
      - call: POST /orders/00000000-0000-4000-8000-000000000000/settle
        payload: {payment_reference: WIRE-1}
        as: ServiceOpsAdmin
        captures: {e8: $.data.error_id}
      - call: GET /equipment-models
        payload: {}
        as: ProductEngineer
      assert:
      - the ProductEngineer's release attempt returns 403 with error_id ERR_ROLE_NOT_PERMITTED (release is ComplianceOfficer-exclusive)
      - the ProductEngineer's certify attempt returns 403 with error_id ERR_ROLE_NOT_PERMITTED — submitting is shared, certifying is not
      - the ComplianceOfficer's model create returns 403 with error_id ERR_ROLE_NOT_PERMITTED despite a fully valid body (priority 2 before priority 7)
      - the FacilityManager's quote attempt returns 403 with error_id ERR_ROLE_NOT_PERMITTED — FacilityManager may confirm but never price
      - the OrderPlanner's arrive attempt and the ServicePartnerTech's scrap attempt both return 403 with error_id ERR_ROLE_NOT_PERMITTED
      - the ProductEngineer's parts-receipt attempt and the ServiceOpsAdmin's settle attempt both return 403 with error_id ERR_ROLE_NOT_PERMITTED
      - every probe returns 403 and never 404, even though all eight path ids are non-existent
      - GET /equipment-models returns total_count == 0 — nothing was created by any probe
  - name: shared_operations_accept_either_of_their_declared_roles
    claim_type: shared_operation_accepts_either_role
    grounds:
    - rbac[ProductEngineer].shared_operations
    - rbac[ServiceOpsAdmin].shared_operations
    - rbac[OrderPlanner].shared_operations
    - rbac[FacilityManager].shared_operations
    - rbac[ComplianceOfficer].shared_operations
    - entities.FirmwareCertification.fields.submitted_by_user_id
