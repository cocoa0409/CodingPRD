  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_clearance_requires_the_destination_permit_to_be_active
        grounds:
          - validations.priority_62.ERR_PERMIT_NOT_ACTIVE
          - state_machines.StatePermit.PENDING_to_ACTIVE
          - state_machines.Order.DRAFT_to_REJECTED
          - state_machines.Order.DRAFT_to_CLEARED
          - entities.StatePermit.fields.status
        distinguishing_aspect: |
          Order screening reads the state of a different entity — the StatePermit for the destination
          state — and nothing about the order itself changes between the two arms. With the permit still
          PENDING the identical order body is REJECTED; after the permit is activated a fresh order with the
          same body CLEARS. The dependency is on the permit's status, not its existence: the same row serves
          both arms.
