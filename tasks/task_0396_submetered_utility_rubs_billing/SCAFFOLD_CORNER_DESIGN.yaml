# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage Index)
# Submetered Utility & RUBS Tenant Billing — Expert band
# Walks references/claim-extraction-guide.md row-by-row against SCAFFOLD.yaml
# §1.1–§1.7. Every grounds ref resolves to a declared element. excluded_because
# stubs cite §1.8 instances by name (in SCAFFOLD_DIFFICULTY_DESIGN.yaml).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_property_missing_state_code_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Property.fields.state_code
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /properties without the required state_code field is rejected ERR_INVALID_REQUEST (422); no Property is created."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { name: "NoState" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_property_applies_recovery_cap_and_common_area_defaults
        claim_type: Defaults
        grounds:
          - entities.Property.fields.recovery_cap_pct
          - entities.Property.fields.common_area_pct
          - endpoints["POST /properties"]
        distinguishing_aspect: "Omitting recovery_cap_pct and common_area_pct applies defaults 0.85 and 0.10 respectively on the created Property."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { name: "Defaults", state_code: "CA" }
              as: PropertyManager
              captures: { dp_id: $.data.id }
          assert:
            - "Property.recovery_cap_pct == 0.85"
            - "Property.common_area_pct == 0.10"
            - "Property.integrity_status == OK and current_period_label == null"

      - name: create_meter_duplicate_serial_returns_duplicate_serial
        claim_type: Type Constraints
        grounds:
          - entities.Meter.fields.serial_number
          - errors[ERR_DUPLICATE_SERIAL]
          - endpoints["POST /meters"]
        distinguishing_aspect: "Creating a second Meter with a serial_number already used for the same Property returns ERR_DUPLICATE_SERIAL (409)."
        test_recipe:
          setup:
            - "A Property with a WATER/CONSUMPTION Utility and a Meter serial 'DUP'."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "PdupS", state_code: "CA" }
              as: PropertyManager
              captures: { ps_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${ps_id}", utility_type: "WATER", allocation_method: "CONSUMPTION", unit_of_measure: "GAL" }
              as: PropertyManager
              captures: { us_id: $.data.id }
            - call: "POST /meters"
              payload: { property_id: "${ps_id}", utility_id: "${us_id}", serial_number: "DUP" }
              as: PropertyManager
          trigger:
            - call: "POST /meters"
              payload: { property_id: "${ps_id}", utility_id: "${us_id}", serial_number: "DUP" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_DUPLICATE_SERIAL"

      - name: create_unit_duplicate_number_returns_duplicate_unit_number
        claim_type: Type Constraints
        grounds:
          - entities.Unit.fields.unit_number
          - errors[ERR_DUPLICATE_UNIT_NUMBER]
          - endpoints["POST /units"]
        distinguishing_aspect: "Creating a second non-archived Unit with a unit_number already used in the same Property returns ERR_DUPLICATE_UNIT_NUMBER (409)."
        test_recipe:
          setup:
            - "A Property with a Unit numbered '101'."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "PdupU", state_code: "CA" }
              as: PropertyManager
              captures: { pu_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pu_id}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
          trigger:
            - call: "POST /units"
              payload: { property_id: "${pu_id}", unit_number: "101", square_feet: 750 }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_DUPLICATE_UNIT_NUMBER"

      - name: create_utility_invalid_allocation_method_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Utility.fields.allocation_method
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /utilities with allocation_method outside {CONSUMPTION, RUBS} is rejected ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "A Property exists."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "PenumU", state_code: "CA" }
              as: PropertyManager
              captures: { pe_id: $.data.id }
          trigger:
            - call: "POST /utilities"
              payload: { property_id: "${pe_id}", utility_type: "WATER", allocation_method: "AVERAGE", unit_of_measure: "GAL" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_meter_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
          - endpoints["GET /meters/{meterId}"]
        distinguishing_aspect: "GET /meters/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /meters/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: assign_meter_to_missing_unit_returns_unit_not_found
        claim_type: Parent Relationships
        grounds:
          - state_machines.Meter.UNASSIGNED_to_ASSIGNED
          - errors[ERR_UNIT_NOT_FOUND]
          - endpoints["POST /meters/{meterId}/assign"]
        distinguishing_aspect: "Assigning a Meter to a non-existent Unit id returns ERR_UNIT_NOT_FOUND (404); the meter stays UNASSIGNED."
        test_recipe:
          setup:
            - "A Property with a WATER/CONSUMPTION Utility and an UNASSIGNED Meter."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Passign", state_code: "CA" }
              as: PropertyManager
              captures: { pa_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${pa_id}", utility_type: "WATER", allocation_method: "CONSUMPTION", unit_of_measure: "GAL" }
              as: PropertyManager
              captures: { ua_id: $.data.id }
            - call: "POST /meters"
              payload: { property_id: "${pa_id}", utility_id: "${ua_id}", serial_number: "AM1" }
              as: PropertyManager
              captures: { am_id: $.data.id }
          trigger:
            - call: "POST /meters/${am_id}/assign"
              payload: { unit_id: "00000000-0000-4000-8000-000000000000", effective_from: "2026-06-01T00:00:00Z" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_UNIT_NOT_FOUND"
            - "Meter ${am_id}.status remains UNASSIGNED"

      - name: meter_read_consumption_computed_clamped_nonnegative
        claim_type: Computed Fields
        grounds:
          - entities.MeterRead.fields.consumption
          - state_machines.MeterRead.PENDING_to_SUBMITTED
          - calculations.read_validation_band
        distinguishing_aspect: "On submit, consumption = max(0, reading_value - last_validated_reading); a reading below the baseline clamps to 0, never negative."
        test_recipe:
          setup:
            - "A Meter whose last_validated_reading is 500 (one prior VALIDATED read), in an OPEN cycle; a new read of reading_value 480."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PropertyManager
            - call: "POST /properties"
              payload: { name: "Pclamp", state_code: "CA" }
              as: PropertyManager
              captures: { pc_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${pc_id}", utility_type: "ELECTRIC", allocation_method: "CONSUMPTION", unit_of_measure: "KWH" }
              as: PropertyManager
              captures: { uc_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pc_id}", unit_number: "C1", square_feet: 700 }
              as: PropertyManager
              captures: { cu_id: $.data.id }
            - call: "POST /meters"
              payload: { property_id: "${pc_id}", utility_id: "${uc_id}", serial_number: "CS1" }
              as: PropertyManager
              captures: { cm_id: $.data.id }
            - call: "POST /meters/${cm_id}/assign"
              payload: { unit_id: "${cu_id}", effective_from: "2026-06-01T00:00:00Z" }
              as: PropertyManager
            - call: "POST /vendor-bills"
              payload: { property_id: "${pc_id}", utility_id: "${uc_id}", period_label: "2026-06", total_cost_cents: 50000 }
              as: PropertyManager
              captures: { cvb_id: $.data.id }
            - call: "POST /billing-cycles"
              payload: { property_id: "${pc_id}", utility_id: "${uc_id}", vendor_bill_id: "${cvb_id}", period_label: "2026-06", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: PropertyManager
              captures: { cbc_id: $.data.id }
            # baseline validated read in the SAME OPEN 2026-06 cycle sets last_validated_reading=500
            - call: "POST /meter-reads"
              payload: { meter_id: "${cm_id}", property_id: "${pc_id}", period_label: "2026-06", reading_value: 500 }
              as: MeterTech
              captures: { cr0_id: $.data.id }
            - call: "POST /meter-reads/${cr0_id}/submit"
              payload: {}
              as: MeterTech
            - call: "POST /meter-reads/${cr0_id}/validate"
              payload: {}
              as: PropertyManager
            # below-baseline read; consumption clamps to 0
            - call: "POST /meter-reads"
              payload: { meter_id: "${cm_id}", property_id: "${pc_id}", period_label: "2026-06", reading_value: 480 }
              as: MeterTech
              captures: { cr1_id: $.data.id }
          trigger:
            - call: "POST /meter-reads/${cr1_id}/submit"
              payload: {}
              as: MeterTech
          assert:
            - "MeterRead ${cr1_id}.consumption == 0  # max(0, 480 - 500)"
            - "MeterRead ${cr1_id}.status == SUBMITTED"

      - name: system_fields_id_created_version_generated_on_create
        claim_type: System Fields
        grounds:
          - entities.Property.fields.integrity_status
          - endpoints["POST /properties"]
        distinguishing_aspect: "A created Property has a server-minted id (un-prefixed UUID), created_at, updated_at, and version==1; client cannot set them."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { name: "Sysfields", state_code: "TX" }
              as: PropertyManager
              captures: { sf_id: $.data.id, sf_v: $.data.version }
          assert:
            - "Property.version == 1"
            - "Property.id is a non-empty UUID without a type prefix"
            - "Property.created_at and updated_at are present ISO-8601 timestamps"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: approve_already_approved_vendor_bill_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.VendorBill.RECEIVED_to_APPROVED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Approving a VendorBill that is already APPROVED returns ERR_INVALID_STATE (409); recoverable_cents is not recomputed."
        test_recipe:
          setup:
            - "An APPROVED VendorBill."
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Pdouble", state_code: "CA" }
              as: PropertyManager
              captures: { pd_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${pd_id}", utility_type: "WATER", allocation_method: "RUBS", unit_of_measure: "GAL" }
              as: PropertyManager
              captures: { ud_id: $.data.id }
            - call: "POST /vendor-bills"
              payload: { property_id: "${pd_id}", utility_id: "${ud_id}", period_label: "2026-06", total_cost_cents: 20000 }
              as: PropertyManager
              captures: { dvb_id: $.data.id }
            - call: "POST /vendor-bills/${dvb_id}/approve"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /vendor-bills/${dvb_id}/approve"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: validate_read_still_pending_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.MeterRead.SUBMITTED_to_VALIDATED
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Validating a MeterRead that is still PENDING (never submitted) returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A PENDING MeterRead in an OPEN cycle (not yet submitted)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PropertyManager
            - call: "POST /properties"
              payload: { name: "Ppend", state_code: "CA" }
              as: PropertyManager
              captures: { pp_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${pp_id}", utility_type: "WATER", allocation_method: "CONSUMPTION", unit_of_measure: "GAL" }
              as: PropertyManager
              captures: { up_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pp_id}", unit_number: "P1", square_feet: 800 }
              as: PropertyManager
              captures: { pu_id: $.data.id }
            - call: "POST /meters"
              payload: { property_id: "${pp_id}", utility_id: "${up_id}", serial_number: "PS1" }
              as: PropertyManager
              captures: { pm_id: $.data.id }
            - call: "POST /meters/${pm_id}/assign"
              payload: { unit_id: "${pu_id}", effective_from: "2026-06-01T00:00:00Z" }
              as: PropertyManager
            - call: "POST /vendor-bills"
              payload: { property_id: "${pp_id}", utility_id: "${up_id}", period_label: "2026-06", total_cost_cents: 30000 }
              as: PropertyManager
              captures: { pvb_id: $.data.id }
            - call: "POST /billing-cycles"
              payload: { property_id: "${pp_id}", utility_id: "${up_id}", vendor_bill_id: "${pvb_id}", period_label: "2026-06", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: PropertyManager
              captures: { pbc_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${pm_id}", property_id: "${pp_id}", period_label: "2026-06", reading_value: 120 }
              as: MeterTech
              captures: { pr_id: $.data.id }
          trigger:
            - call: "POST /meter-reads/${pr_id}/validate"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: submit_read_when_cycle_not_open_returns_cycle_not_open
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.MeterRead.PENDING_to_SUBMITTED
          - errors[ERR_CYCLE_NOT_OPEN]
          - endpoints["POST /meter-reads/{readId}/submit"]
        distinguishing_aspect: "Submitting a read whose matching BillingCycle has advanced to READS_LOCKED returns ERR_CYCLE_NOT_OPEN (409)."
        test_recipe:
          setup:
            - "A cycle that is READS_LOCKED (its sole meter already validated), plus a PENDING read created on that meter for the same period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PropertyManager
            - call: "POST /properties"
              payload: { name: "Plock", state_code: "CA" }
              as: PropertyManager
              captures: { pl_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${pl_id}", utility_type: "WATER", allocation_method: "CONSUMPTION", unit_of_measure: "GAL" }
              as: PropertyManager
              captures: { ul_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pl_id}", unit_number: "L1", square_feet: 800 }
              as: PropertyManager
              captures: { lu_id: $.data.id }
            - call: "POST /meters"
              payload: { property_id: "${pl_id}", utility_id: "${ul_id}", serial_number: "LS1" }
              as: PropertyManager
              captures: { lm_id: $.data.id }
            - call: "POST /meters/${lm_id}/assign"
              payload: { unit_id: "${lu_id}", effective_from: "2026-06-01T00:00:00Z" }
              as: PropertyManager
            - call: "POST /vendor-bills"
              payload: { property_id: "${pl_id}", utility_id: "${ul_id}", period_label: "2026-06", total_cost_cents: 30000 }
              as: PropertyManager
              captures: { lvb_id: $.data.id }
            - call: "POST /billing-cycles"
              payload: { property_id: "${pl_id}", utility_id: "${ul_id}", vendor_bill_id: "${lvb_id}", period_label: "2026-06", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: PropertyManager
              captures: { lbc_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${lm_id}", property_id: "${pl_id}", period_label: "2026-06", reading_value: 100 }
              as: MeterTech
              captures: { lr0_id: $.data.id }
            - call: "POST /meter-reads/${lr0_id}/submit"
              payload: {}
              as: MeterTech
            - call: "POST /meter-reads/${lr0_id}/validate"
              payload: {}
              as: PropertyManager
            - call: "POST /billing-cycles/${lbc_id}/lock-reads"
              payload: {}
              as: PropertyManager
            - call: "POST /meter-reads"
              payload: { meter_id: "${lm_id}", property_id: "${pl_id}", period_label: "2026-06", reading_value: 130 }
              as: MeterTech
              captures: { lr1_id: $.data.id }
          trigger:
            - call: "POST /meter-reads/${lr1_id}/submit"
              payload: {}
              as: MeterTech
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_CYCLE_NOT_OPEN"

      - name: retire_meter_with_pending_reads_returns_meter_has_pending_reads
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Meter.ASSIGNED_to_RETIRED
          - errors[ERR_METER_HAS_PENDING_READS]
          - endpoints["POST /meters/{meterId}/retire"]
        distinguishing_aspect: "Retiring an ASSIGNED Meter that has a SUBMITTED read in an OPEN cycle returns ERR_METER_HAS_PENDING_READS (409); the meter stays ASSIGNED."
        test_recipe:
          setup:
            - "An ASSIGNED Meter with a SUBMITTED MeterRead in an OPEN cycle."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PropertyManager
            - call: "POST /properties"
              payload: { name: "Pretire", state_code: "CA" }
              as: PropertyManager
              captures: { pr_id: $.data.id }
            - call: "POST /utilities"
              payload: { property_id: "${pr_id}", utility_type: "WATER", allocation_method: "CONSUMPTION", unit_of_measure: "GAL" }
              as: PropertyManager
              captures: { ur_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${pr_id}", unit_number: "R1", square_feet: 800 }
              as: PropertyManager
              captures: { ru_id: $.data.id }
            - call: "POST /meters"
              payload: { property_id: "${pr_id}", utility_id: "${ur_id}", serial_number: "RS1" }
              as: PropertyManager
              captures: { rm_id: $.data.id }
            - call: "POST /meters/${rm_id}/assign"
              payload: { unit_id: "${ru_id}", effective_from: "2026-06-01T00:00:00Z" }
              as: PropertyManager
            - call: "POST /vendor-bills"
              payload: { property_id: "${pr_id}", utility_id: "${ur_id}", period_label: "2026-06", total_cost_cents: 30000 }
              as: PropertyManager
              captures: { rvb_id: $.data.id }
            - call: "POST /billing-cycles"
              payload: { property_id: "${pr_id}", utility_id: "${ur_id}", vendor_bill_id: "${rvb_id}", period_label: "2026-06", period_start: "2026-06-01T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: PropertyManager
              captures: { rbc_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${rm_id}", property_id: "${pr_id}", period_label: "2026-06", reading_value: 100 }
              as: MeterTech
              captures: { rr_id: $.data.id }
            - call: "POST /meter-reads/${rr_id}/submit"
              payload: {}
              as: MeterTech
          trigger:
            - call: "POST /meters/${rm_id}/retire"
              payload: {}
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_METER_HAS_PENDING_READS"
            - "Meter ${rm_id}.status remains ASSIGNED"

      - name: activate_lease_sets_unit_occupied_side_effect
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Lease.PENDING_to_ACTIVE
          - entities.Unit.fields.status
          - endpoints["POST /leases/{leaseId}/activate"]
        distinguishing_aspect: "Activating a PENDING Lease sets its Unit.status to OCCUPIED (cross-entity side effect)."
        test_recipe:
          setup:
            - "A VACANT Unit with a PENDING Lease."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PropertyManager
            - call: "POST /properties"
              payload: { name: "Pocc", state_code: "CA" }
              as: PropertyManager
              captures: { po_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${po_id}", unit_number: "O1", square_feet: 800 }
              as: PropertyManager
              captures: { ou_id: $.data.id }
            - call: "POST /leases"
              payload: { unit_id: "${ou_id}", property_id: "${po_id}", tenant_user_id: "tO", occupant_count: 2, move_in_date: "2026-06-01T00:00:00Z" }
              as: PropertyManager
              captures: { ol_id: $.data.id }
          trigger:
            - call: "POST /leases/${ol_id}/activate"
              payload: {}
              as: PropertyManager
          assert:
            - "Lease ${ol_id}.status == ACTIVE"
            - "Unit ${ou_id}.status == OCCUPIED"

      - name: validate_read_supersedes_prior_validated_sibling
        claim_type: Side Effect Execution
        grounds:
          - state_machines.MeterRead.SUBMITTED_to_VALIDATED
          - state_machines.MeterRead.VALIDATED_to_SUPERSEDED
          - entities.Meter.fields.last_validated_reading
        distinguishing_aspect: "Validating a second read for the same meter+period supersedes the prior VALIDATED read (-> SUPERSEDED) and updates Meter.last_validated_reading to the new reading_value."
        test_recipe:
          setup:
