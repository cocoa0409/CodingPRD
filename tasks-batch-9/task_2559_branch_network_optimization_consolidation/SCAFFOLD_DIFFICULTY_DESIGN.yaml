              payload: { name: "Lakeshore West", region_code: "MW-11", population: 110000, median_household_income_cents: 7400000, deposit_market_total_cents: 170000000000, competitor_branch_count: 19, household_growth_pct_bps: 240, digital_penetration_bps: 5000 }
