  - section: state_machines
    instances:
      - name: duplicate_flag_confirm_merges_loser
        claim_type: side_effect_execution
        grounds: [state_machines.DuplicateFlag.OPEN_to_CONFIRMED, state_machines.Bicycle.integrity_status]
        distinguishing_aspect: "Confirm with merged_into_bicycle_id == bA: loser bB flips DUPLICATE_SUSPECT -> MERGED (its UNDER_REVIEW report auto-WITHDRAWN), survivor bA returns to CLEAR, flag records merged_into_bicycle_id."
        test_recipe:
          setup: ["Owner o1 with bicycles bA (DUP100) and bB (DUP101) — auto-flagged pair, both DUPLICATE_SUSPECT; UNDER_REVIEW report rB on bB; flag df fetched by bicycle_a_id == bA"]
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "DUP100", manufacturer: "Trek", model: "X", primary_color: "Black", declared_value_cents: 100000, photo_url: "https://x/a.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { ba_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "DUP101", manufacturer: "Trek", model: "X", primary_color: "Black", declared_value_cents: 90000, photo_url: "https://x/b.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { bb_id: $.data.id } }
            - { call: "POST /registry/theft-reports", payload: { bicycle_id: "${bb_id}", occurred_at: "2026-05-03T00:00:00Z", theft_location: "Rack" }, as: Owner, as_user_id: "${o1_id}", captures: { rb_id: $.data.id } }
            - { call: "GET /registry/duplicate-flags?bicycle_a_id=${ba_id}", as: Registrar, captures: { df_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /registry/duplicate-flags/${df_id}/confirm", payload: { merged_into_bicycle_id: "${ba_id}" }, as: Registrar, captures: { df_status: $.data.status, df_survivor: $.data.merged_into_bicycle_id } }
            - { call: "GET /registry/bicycles/${bb_id}", as: Registrar, captures: { bb_integ: $.data.integrity_status } }
            - { call: "GET /registry/bicycles/${ba_id}", as: Registrar, captures: { ba_integ: $.data.integrity_status } }
            - { call: "GET /registry/theft-reports/${rb_id}", as: Registrar, captures: { rb_status: $.data.status } }
          assert:
            - "DuplicateFlag.status == CONFIRMED (observed ${df_status}); merged_into_bicycle_id == ${ba_id} (observed ${df_survivor})"
            - "Loser bB integrity_status == MERGED (observed ${bb_integ}); survivor bA integrity_status == CLEAR (observed ${ba_integ})"
            - "bB's UNDER_REVIEW report auto-WITHDRAWN (observed ${rb_status})"

