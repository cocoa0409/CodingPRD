              as: Physician
              as_user_id: "${dr1}"
              captures: { so30: $.data.id }
            - call: "POST /clinic/procedures"
              payload: { patient_id: "${p30}", provider_id: "${dr1}", consult_id: "${cs30}", standing_order_id: "${so30}", procedure_type: "INITIAL", room_code: "RM24", scheduled_start: "2026-08-01T09:00:00Z" }
              as: FrontDesk
              captures: { pr30: $.data.id }
            - call: "POST /clinic/financing-plans"
