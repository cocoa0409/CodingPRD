          Two temporal rules sit adjacent at priorities 88 and 90 and they use
          deliberately DIFFERENT interval semantics (half-open buffered per zone,
          closed unbuffered project-wide). A closure window that overlaps a
          sibling on its own zone breaks both, and the per-zone error must win.
          Moving the identical time span to another zone removes the 88 breach
          and leaves the 90 breach, so the same payload minus one field value
