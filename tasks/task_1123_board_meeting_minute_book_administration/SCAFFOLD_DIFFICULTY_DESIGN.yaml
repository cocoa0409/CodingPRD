            - "Resolution.${r}.consent_deadline_at == 2026-05-11T00:00:00Z"
            - "Resolution.${r}.status == CONSENT_ADOPTED   # 3 FOR signatures of 3 non-recused"
            - "ConflictDisclosure.${cd}.status == CLEARED"

  # ---------------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — cycles on three DIFFERENT entities.
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: resolution_reject_redraft_cycle
        grounds:
          - state_machines.Resolution.VOTE_OPEN_to_REJECTED
          - state_machines.Resolution.REJECTED_to_DRAFT
          - state_machines.Resolution.DRAFT_to_TABLED
        distinguishing_aspect: |
          Resolution cycles REJECTED -> DRAFT -> TABLED -> VOTE_OPEN -> ADOPTED (a revision
          loop, not a pipeline); the redraft hop voids round-1 ballots and zeroes the tallies.
          Entity: Resolution (distinct from Minutes and BoardPackage siblings).
        test_recipe:
          setup:
            - "Corporation, ADOPTED bylaws, 3 ACTIVE directors (D1 chair), meeting IN_SESSION with all 3 present (required 2 of 3)"
            - "Resolution R round 1: TABLED -> VOTE_OPEN, ballots D1 FOR / D2 AGAINST / D3 AGAINST, closed -> REJECTED"
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp RC", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
