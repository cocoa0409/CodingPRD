  - rule_id: transitive_cascade
    instances:
      - name: delay_threshold_cascade_to_signatures
        grounds:
          - calculations.delay_auto_amend
          - state_machines.FlightRelease.RELEASED_to_UNDER_AMENDMENT
          - entities.FlightRelease.fields.cycle_seq
          - entities.OperationalControlRecord.fields.action
        distinguishing_aspect: |
          Depth-3 cascade triggered by a delay decision (distinct from the
          weather-replace trigger): delay mutates FlightLeg (hop 1) -> the
          leg's RELEASED release auto-amends because delay == 60 min >=
          DELAY_REVIEW_THRESHOLD_MIN (hop 2) -> cycle_seq bump invalidates the
          two existing ReleaseSignatures (hop 3); audit records written at
          hops 1 and 2.
        test_recipe:
          setup:
            - "Standard chain to RELEASED (as in release_signature_amendment_cycle); plus a second bare leg L2 for D1 so workload_leg_count == 2"
          setup_api_calls:
