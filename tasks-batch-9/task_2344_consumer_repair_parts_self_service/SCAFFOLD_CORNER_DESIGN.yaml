# =============================================================================
# 1.9 Scaffold Corner Design — task 2344 (consumer-repair-parts-self-service)
# One section per claim-extraction-guide table; claim_type values are taken
# verbatim from that guide's per-section rows. Instances that a §1.8 difficulty
# instance already pins carry `excluded_because` stubs instead of a recipe.
# Logical clock starts at 2026-08-01T00:00:00Z in every recipe below.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: product_model_create_stamps_every_declared_system_and_computed_default
        claim_type: creation
        grounds:
          - endpoints[POST /repair-program/product-models]
          - entities.ProductModel.fields.support_state
          - entities.ProductModel.fields.documentation_posture
          - entities.ProductModel.fields.compliance_posture
        distinguishing_aspect: |
          A model created without end_of_production_date must come back with
          support_state ACTIVE_PRODUCTION, documentation_posture MISSING and
          compliance_posture OPEN in the SAME response — an implementation that
          leaves any of the three null fails.
        test_recipe:
          setup:
            - "Nothing but the region profile every later chain needs; no model exists yet."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
          trigger:
            - call: "POST /repair-program/product-models"
              payload: { model_code: "CRX-E100", product_family: "CRX", market_release_date: "2024-01-01T00:00:00Z", repairability_tier: "TIER_A_SELF_SERVICE" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { model_id: $.data.id }
          assert:
            - "HTTP 201"
            - "ProductModel.${model_id}.support_state == ACTIVE_PRODUCTION"
            - "ProductModel.${model_id}.documentation_posture == MISSING"
            - "ProductModel.${model_id}.compliance_posture == OPEN"
            - "ProductModel.${model_id}.open_obligation_count == 0"
            - "ProductModel.${model_id}.published_disassembly_revision_number == null and published_safety_sheet_revision_number == null"
            - "ProductModel.${model_id}.support_end_date == null and version == 1"

      - name: part_catalog_item_single_row_read_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /repair-program/part-catalog-items/{part_id}]
          - entities.PartCatalogItem.fields.core_liability_outstanding_cents
        distinguishing_aspect: |
          The single-row read must echo the four core ledger aggregates at 0 for a
          freshly created part, not omit them — they are the fields the
          conservation invariant is audited through.
        test_recipe:
          setup:
            - "One DRAFT catalog row with a core deposit configured but never ordered."
          setup_api_calls:
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E100-CELL", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 4500, core_return_required: true, core_credit_cents: 900 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_id: $.data.id }
          trigger:
            - call: "GET /repair-program/part-catalog-items/${part_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "HTTP 200"
            - "response sku == SKU-E100-CELL and list_price_cents == 4500 and core_credit_cents == 900"
            - "response status == DRAFT"
            - "response core_face_value_committed_cents == 0 and core_liability_outstanding_cents == 0"
            - "response core_credit_settled_cents == 0 and core_credit_forfeited_cents == 0"

      - name: part_catalog_item_list_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /repair-program/part-catalog-items]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          With three rows stored and limit 2, total_count must be 3 (the whole
          filtered population) while the page carries 2 rows and has_more true —
          returning total_count 2 is the classic failure.
        test_recipe:
          setup:
            - "Three catalog rows, two of them COMPONENT and one TOOL."
          setup_api_calls:
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E101-A", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 100, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E101-B", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 200, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E101-T", part_class: "TOOL", safety_class: "UNRESTRICTED", list_price_cents: 300, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
          trigger:
            - call: "GET /repair-program/part-catalog-items"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
          assert:
            - "HTTP 200 and response_type == array"
            - "meta/pagination total_count == 3 and has_more == true"
            - "exactly 2 rows returned"
            - "a follow-up read with part_class=COMPONENT and limit 10 reports total_count == 2 and has_more == false"

      - name: unknown_model_id_read_returns_model_not_found
        claim_type: not_found
        grounds:
          - validations[priority=20]
          - errors.ERR_MODEL_NOT_FOUND
          - endpoints[GET /repair-program/product-models/{model_id}]
        distinguishing_aspect: |
          A syntactically valid but unstored UUID must return 404
          ERR_MODEL_NOT_FOUND, not 200 with an empty body and not 400.
        test_recipe:
          setup:
            - "No ProductModel row exists at all."
          setup_api_calls: []
          trigger:
            - call: "GET /repair-program/product-models/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == ERR_MODEL_NOT_FOUND"

      - name: part_catalog_item_without_sku_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=10]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /repair-program/part-catalog-items]
        distinguishing_aspect: |
          sku is an input field with no default, so omitting it must fail at the
          structural gate with 400 ERR_INVALID_REQUEST before any uniqueness or
          range check runs.
        test_recipe:
          setup:
            - "Empty catalog."
          setup_api_calls: []
          trigger:
            - call: "POST /repair-program/part-catalog-items"
              payload: { part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 100, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"
            - "no PartCatalogItem row was created"

      - name: part_catalog_item_omitted_optional_flags_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.PartCatalogItem.fields.core_credit_cents
          - entities.PartCatalogItem.fields.concurrent_rental_capacity
          - entities.PartCatalogItem.fields.requires_authentication
          - endpoints[POST /repair-program/part-catalog-items]
        distinguishing_aspect: |
          Omitting every optional flag must yield core_credit_cents 0,
          rental_deposit_cents 0, concurrent_rental_capacity null,
          requires_authentication/requires_calibration false and
          supersedes_part_id null — null and 0 are NOT interchangeable here.
        test_recipe:
          setup:
            - "Empty catalog."
          setup_api_calls: []
          trigger:
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E102-MIN", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 750, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_id: $.data.id }
          assert:
            - "HTTP 201"
            - "PartCatalogItem.${part_id}.core_credit_cents == 0 and rental_deposit_cents == 0"
            - "PartCatalogItem.${part_id}.concurrent_rental_capacity == null"
            - "PartCatalogItem.${part_id}.requires_authentication == false and requires_calibration == false"
            - "PartCatalogItem.${part_id}.supersedes_part_id == null and status == DRAFT"

      - name: model_open_obligation_count_and_posture_are_derived_from_children
        claim_type: computed_fields
        grounds:
          - calculations.model_compliance_posture_rollup
          - calculations.obligation_status_evaluation
          - entities.ProductModel.fields.open_obligation_count
          - endpoints[POST /repair-program/compliance-obligations]
        distinguishing_aspect: |
          The parent's open_obligation_count and compliance_posture are written by
          the obligation create in the same request — reading the model afterwards
          must show 1 and OPEN without any sweep being run.
        test_recipe:
          setup:
            - "Region US-CA, model CRX-E103 still in production, one PUBLISHED part with an in-window compatibility row, and a PUBLISHED DISASSEMBLY_GUIDE covering that sku, so documentation_posture is CURRENT."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/product-models"
              payload: { model_code: "CRX-E103", product_family: "CRX", market_release_date: "2024-01-01T00:00:00Z", repairability_tier: "TIER_A_SELF_SERVICE" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { model_id: $.data.id }
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E103-FAN", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 1000, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_id: $.data.id }
            - call: "POST /repair-program/part-compatibilities"
              payload: { part_id: "${part_id}", model_id: "${model_id}", effective_from: "2024-02-01T00:00:00Z", self_service_eligible: true, install_minutes: 20 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/part-catalog-items/${part_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "GET /repair-program/product-models/${model_id}"
              payload: {}
              as: ProgramAdmin
              captures: { mv1: $.data.version }
            - call: "POST /repair-program/manual-revisions"
              payload: { model_id: "${model_id}", doc_type: "DISASSEMBLY_GUIDE", covered_part_skus: ["SKU-E103-FAN"], safety_warning_count: 2, expected_model_version: "${mv1}" }
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
              captures: { rev_id: $.data.id }
            - call: "POST /repair-program/manual-revisions/${rev_id}/submit"
              payload: {}
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
            - call: "POST /repair-program/manual-revisions/${rev_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "covers the published sku" }
              as: SafetyReviewer
              as_user_id: "u_rev_1"
            - call: "POST /repair-program/manual-revisions/${rev_id}/publish"
              payload: {}
              as: SafetyReviewer
              as_user_id: "u_rev_1"
          trigger:
            - call: "POST /repair-program/compliance-obligations"
              payload: { model_id: "${model_id}", region_code: "US-CA" }
              as: ComplianceOfficer
              as_user_id: "u_co_1"
              captures: { obligation_id: $.data.id }
            - call: "GET /repair-program/product-models/${model_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { posture: $.data.compliance_posture }
          assert:
            - "HTTP 201 then HTTP 200"
            - "ComplianceObligation.${obligation_id}.deadline_basis == PRODUCTION_ACTIVE"
            - "ComplianceObligation.${obligation_id}.parts_available_until == null and documentation_available_until == null"
            - "ComplianceObligation.${obligation_id}.status == OPEN and breach_count == 0"
            - "ProductModel open_obligation_count == 1"
            - "${posture} == OPEN"

      - name: part_catalog_item_client_supplied_system_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.PartCatalogItem.fields.status
          - validations[priority=10]
          - endpoints[POST /repair-program/part-catalog-items]
        distinguishing_aspect: |
          status, id, version and the four core aggregates are server-owned: a
          create body carrying `status: PUBLISHED` must not produce a PUBLISHED
          row — either the unknown field is refused with ERR_INVALID_REQUEST or it
          is dropped, but the stored status is DRAFT either way.
        test_recipe:
          setup:
            - "Empty catalog."
          setup_api_calls: []
          trigger:
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E104-SYS", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 500, core_return_required: false, status: "PUBLISHED", core_liability_outstanding_cents: 9999 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { err: $.data.error_id }
          assert:
            - "the declared §1.4 priority-10 behaviour applies: unknown body keys are refused, so HTTP 400 with ${err} == ERR_INVALID_REQUEST"
            - "no PartCatalogItem row with status PUBLISHED exists afterwards"
            - "a repeat of the same call without the two server-owned keys returns 201 with status DRAFT, version 1 and core_liability_outstanding_cents 0"

      - name: unknown_repairability_tier_enum_value_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.ProductModel.fields.repairability_tier
          - validations[priority=10]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          An out-of-set enum is a structural failure at priority 10 (400), not a
          range failure at priority 12 (422) — the two codes must not be swapped.
        test_recipe:
          setup:
            - "Empty model table."
          setup_api_calls: []
          trigger:
            - call: "POST /repair-program/product-models"
              payload: { model_code: "CRX-E105", product_family: "CRX", market_release_date: "2024-01-01T00:00:00Z", repairability_tier: "TIER_E_MYSTERY" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "${err} == ERR_INVALID_REQUEST"

      - name: disclosure_acknowledgment_is_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.DisclosureAcknowledgment
          - endpoints[GET /repair-program/disclosure-acknowledgments/{acknowledgment_id}]
          - endpoints[POST /repair-program/parts-orders/{order_id}/acknowledgments]
        distinguishing_aspect: |
          DisclosureAcknowledgment is declared common_fields: false — the created
          row carries acknowledged_at but no version, and §1.5 exposes no PUT,
          PATCH or DELETE for it, so the signature can never be edited.
        test_recipe:
          setup:
            - "Full consumer chain on model CRX-E106 up to the acknowledgment: region profile, PUBLISHED part with compatibility, PUBLISHED DISASSEMBLY_GUIDE with 2 warnings, assessment (decision ELIGIBLE, warranty class WARRANTY_PRESERVED_WITH_LOG, liability version LW-CRX-E106-R1), order with one line, disclosure requested."
          setup_api_calls:
            - call: "POST /repair-program/compliance-profiles"
              payload: { region_code: "US-CA", min_parts_availability_years: 7, min_documentation_years: 7, requires_public_manual: false, max_documentation_fee_cents: 2000, allows_pairing_restriction: true, self_service_mandate_tier: "MANDATE_FULL" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/product-models"
              payload: { model_code: "CRX-E106", product_family: "CRX", market_release_date: "2024-01-01T00:00:00Z", repairability_tier: "TIER_A_SELF_SERVICE" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { model_id: $.data.id }
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E106-FAN", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 1000, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_id: $.data.id }
            - call: "POST /repair-program/part-compatibilities"
              payload: { part_id: "${part_id}", model_id: "${model_id}", effective_from: "2024-02-01T00:00:00Z", self_service_eligible: true, install_minutes: 20 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/part-catalog-items/${part_id}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "GET /repair-program/product-models/${model_id}"
              payload: {}
              as: ProgramAdmin
              captures: { mv1: $.data.version }
            - call: "POST /repair-program/manual-revisions"
              payload: { model_id: "${model_id}", doc_type: "DISASSEMBLY_GUIDE", covered_part_skus: ["SKU-E106-FAN"], safety_warning_count: 2, expected_model_version: "${mv1}" }
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
              captures: { rev_id: $.data.id }
            - call: "POST /repair-program/manual-revisions/${rev_id}/submit"
              payload: {}
              as: DocumentationEngineer
              as_user_id: "u_doc_1"
            - call: "POST /repair-program/manual-revisions/${rev_id}/review-decision"
              payload: { decision: "APPROVE", review_note: "ok" }
              as: SafetyReviewer
              as_user_id: "u_rev_1"
            - call: "POST /repair-program/manual-revisions/${rev_id}/publish"
              payload: {}
              as: SafetyReviewer
              as_user_id: "u_rev_1"
            - call: "POST /repair-program/eligibility-assessments"
              payload: { model_id: "${model_id}", part_id: "${part_id}", region_code: "US-CA", requester_class: "SELF_REPAIR_CONSUMER" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { assessment_id: $.data.id }
            - call: "POST /repair-program/parts-orders"
              payload: { assessment_id: "${assessment_id}", region_code: "US-CA", buyer_class: "SELF_REPAIR_CONSUMER" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { order_id: $.data.id, ov1: $.data.version }
            - call: "POST /repair-program/parts-orders/${order_id}/lines"
              payload: { part_id: "${part_id}", quantity: 1, expected_order_version: "${ov1}" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
            - call: "POST /repair-program/parts-orders/${order_id}/request-disclosure"
              payload: {}
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
          trigger:
            - call: "POST /repair-program/parts-orders/${order_id}/acknowledgments"
              payload: { warranty_impact_class_ack: "WARRANTY_PRESERVED_WITH_LOG", liability_warning_version: "LW-CRX-E106-R1", acknowledged_scope: "FULL_SELF_REPAIR" }
              as: SelfRepairCustomer
              as_user_id: "u_cust_1"
              captures: { ack_id: $.data.id }
            - call: "GET /repair-program/disclosure-acknowledgments/${ack_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP 201 then HTTP 200"
            - "the acknowledgment payload has no version field and no updated_at semantics — acknowledged_at is stamped at 2026-08-01T00:00:00Z"
            - "DisclosureAcknowledgment.${ack_id}.acknowledged_by_user_id == u_cust_1 and manual_revision_number == 1"
            - "§1.5 declares no PUT, PATCH or DELETE on any acknowledgment path"
            - "PartsOrder.${order_id}.disclosure_acknowledged_at == 2026-08-01T00:00:00Z"

      - name: compatibility_against_unknown_model_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.PartModelCompatibility.fields.model_id
          - validations[priority=20]
          - errors.ERR_MODEL_NOT_FOUND
        distinguishing_aspect: |
          The junction row must validate BOTH foreign keys: a real part_id with a
          fabricated model_id is a 404 on the model, not a 201 with a dangling
          edge.
        test_recipe:
          setup:
            - "One catalog row exists; no ProductModel row exists."
          setup_api_calls:
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E107-FAN", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 1000, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_id: $.data.id }
          trigger:
            - call: "POST /repair-program/part-compatibilities"
              payload: { part_id: "${part_id}", model_id: "22222222-2222-4222-8222-222222222222", effective_from: "2026-01-01T00:00:00Z", self_service_eligible: true, install_minutes: 20 }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "${err} == ERR_MODEL_NOT_FOUND"
            - "no PartModelCompatibility row exists"

      - name: compatibility_junction_is_readable_from_both_sides
        claim_type: graph_topology
        grounds:
          - complexity_profile.entity_topology
          - endpoints[GET /repair-program/product-models/{model_id}/part-compatibilities]
          - endpoints[GET /repair-program/part-catalog-items/{part_id}/part-compatibilities]
          - endpoints[GET /repair-program/part-compatibilities]
        distinguishing_aspect: |
          The many-to-many junction must be traversable from the model side, from
          the part side and through the flat filter, and the required_tool_part_id
          edge must be reachable through the same filtered list.
        test_recipe:
          setup:
            - "Model CRX-E108, one COMPONENT part and one TOOL part; the component's compatibility row names the tool as required_tool_part_id."
          setup_api_calls:
            - call: "POST /repair-program/product-models"
              payload: { model_code: "CRX-E108", product_family: "CRX", market_release_date: "2024-01-01T00:00:00Z", repairability_tier: "TIER_B_GUIDED" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { model_id: $.data.id }
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E108-TOOL", part_class: "TOOL", safety_class: "UNRESTRICTED", list_price_cents: 2000, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { tool_id: $.data.id }
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E108-CELL", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 3000, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_id: $.data.id }
            - call: "POST /repair-program/part-compatibilities"
              payload: { part_id: "${part_id}", model_id: "${model_id}", effective_from: "2024-02-01T00:00:00Z", self_service_eligible: true, install_minutes: 30, required_tool_part_id: "${tool_id}" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { compat_id: $.data.id }
          trigger:
            - call: "GET /repair-program/product-models/${model_id}/part-compatibilities"
              payload: {}
              as: ProgramAdmin
            - call: "GET /repair-program/part-catalog-items/${part_id}/part-compatibilities"
              payload: {}
              as: ProgramAdmin
            - call: "GET /repair-program/part-compatibilities"
              payload: { required_tool_part_id: "${tool_id}" }
              as: ProgramAdmin
          assert:
            - "all three reads return HTTP 200 with exactly the one row ${compat_id}"
            - "PartModelCompatibility.${compat_id}.required_tool_part_id == ${tool_id}"
            - "PartModelCompatibility.${compat_id}.superseded_by_safety_restriction == false"
            - "GET /repair-program/part-compatibilities/${compat_id} returns the same row"

      - name: supersession_repoint_that_closes_a_cycle_is_rejected
        claim_type: graph_topology
        grounds:
          - validations[priority=26]
          - errors.ERR_SUPERSESSION_CYCLE
          - endpoints[POST /repair-program/part-catalog-items/{part_id}/supersession]
          - entities.PartCatalogItem.fields.supersedes_part_id
        distinguishing_aspect: |
          B already supersedes A; re-pointing A at B would close a two-node cycle
          on the self-referential edge and must be refused with 422
          ERR_SUPERSESSION_CYCLE before the class check at priority 27 is reached.
        test_recipe:
          setup:
            - "Part A (SKU-E109-A, COMPONENT) is PUBLISHED; part B (SKU-E109-B, COMPONENT) was created with supersedes_part_id = A, so B -> A already exists in the supersession graph."
          setup_api_calls:
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E109-A", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 1000, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_a: $.data.id }
            - call: "POST /repair-program/part-catalog-items/${part_a}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E109-B", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 1100, core_return_required: false, supersedes_part_id: "${part_a}" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_b: $.data.id }
          trigger:
            - call: "POST /repair-program/part-catalog-items/${part_a}/supersession"
              payload: { supersedes_part_id: "${part_b}", supersession_note: "attempted swap-back" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == ERR_SUPERSESSION_CYCLE"
            - "PartCatalogItem.${part_a}.supersedes_part_id is still null"
            - "PartCatalogItem.${part_b}.supersedes_part_id is still ${part_a}"
            - "GET /repair-program/part-catalog-items/${part_a}/successors still lists only ${part_b}"

      - name: successor_declaring_a_different_part_class_is_rejected
        claim_type: graph_topology
        grounds:
          - validations[priority=27]
          - errors.ERR_SUPERSESSION_CLASS_MISMATCH
          - endpoints[POST /repair-program/part-catalog-items]
        distinguishing_aspect: |
          A TOOL may not supersede a COMPONENT: the class guard fires at 422 even
          though no cycle exists, which separates priority 27 from priority 26.
        test_recipe:
          setup:
            - "One PUBLISHED COMPONENT part."
          setup_api_calls:
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E110-COMP", part_class: "COMPONENT", safety_class: "UNRESTRICTED", list_price_cents: 1000, core_return_required: false }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { part_a: $.data.id }
            - call: "POST /repair-program/part-catalog-items/${part_a}/publish"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin_1"
          trigger:
            - call: "POST /repair-program/part-catalog-items"
              payload: { sku: "SKU-E110-TOOL", part_class: "TOOL", safety_class: "UNRESTRICTED", list_price_cents: 1200, core_return_required: false, supersedes_part_id: "${part_a}" }
              as: ProgramAdmin
              as_user_id: "u_admin_1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "${err} == ERR_SUPERSESSION_CLASS_MISMATCH"
            - "PartCatalogItem.${part_a}.status is still PUBLISHED — no supersession side effect ran"
            - "no row with sku SKU-E110-TOOL exists"

  - section: state_machines
    instances:
      - name: publishing_a_second_part_flips_the_model_documentation_posture_to_stale
        claim_type: cascade_down
        grounds:
          - state_machines.PartCatalogItem.transitions[DRAFT -> PUBLISHED]
