    roles: [PrintOperationsDirector]
    code: 200
    input: [receiving_print_site_id]
    output: PrintMarket
    side_effects:
      - "select_transfer_route runs (§1.3); the replacement route becomes committed and is recorded as replacement_route_id"
      - "status returns to active; member editions are recomputed and returned to in_production"
      - "increments RegionHub.version by 1"

