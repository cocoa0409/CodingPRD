# =============================================================================
# §1.9 Scaffold Corner Design - task_2712 Greenhouse Vegetable Production
#
# Breadth pass over the nine sections of references/claim-extraction-guide.md.
# Every corner that SCAFFOLD_DIFFICULTY_DESIGN.yaml already drives to a literal
# outcome is recorded here as an `excluded_because` stub that names the owning
# §1.8 instance, so the two files partition the claim space without overlap.
#
# Sections: entities / state_machines / calculations / validations / endpoints /
#           errors / rbac / complexity_layers / consistency_model
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: zone_create_returns_every_declared_field_with_postures_at_their_defaults
        claim_type: creation
        grounds:
          - entities.Zone
          - endpoints[POST /zones]
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to DEFAULT_CLOCK_UTC."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
          trigger:
            - call: "POST /zones"
              payload: { code: "ZC-01", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { z_new: $.data.id, z_status: $.data.status, z_ipm: $.data.ipm_posture, z_irr: $.data.irrigation_posture, z_ver: $.data.version }
          assert:
            - "the call returns HTTP 201"
            - "${z_status} == IDLE"
            - "${z_ipm} == NORMAL"
            - "${z_irr} == NORMAL"
            - "${z_ver} == 1"
            - "Zone.${z_new}.open_pest_alert_count == 0"
            - "Zone.${z_new}.drain_alarm_count == 0"
            - "Zone.${z_new}.hive_slots_used == 0"
            - "Zone.${z_new}.labor_budget_committed_usd == 0.00"
            - "Zone.${z_new}.labor_budget_remaining_usd == 20000.00"
            - "Zone.${z_new}.climate_plan_revision == 0"
            - "created_at and updated_at are present ISO-8601 timestamps"

      - name: zone_get_by_id_returns_the_stored_row_unchanged
        claim_type: retrieval
        grounds:
          - endpoints[GET /zones/{id}]
          - response_envelope.success
        test_recipe:
          setup:
            - "One zone created with a 20000.00 USD labor budget."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZC-02", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { z_get: $.data.id }
          trigger:
            - call: "GET /zones/${z_get}"
              as: IrrigationTech
              captures: { got_code: $.data.code, got_area: $.data.area_sqft, got_budget: $.data.labor_budget_remaining_usd }
          assert:
            - "the call returns HTTP 200"
            - "${got_code} == ZC-02"
            - "${got_area} == 9450"
            - "${got_budget} == 20000.00"
            - "response_type is object and meta carries api_request_id and api_request_timestamp"

      - name: worker_list_is_paginated_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /workers]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        test_recipe:
          setup:
            - "Three ACTIVE workers exist: two HARVEST and one SCOUT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /workers"
              payload: { full_name: "Hana Ito", skill: "HARVEST", hourly_rate_usd: 19.50, productivity_index: 1.05, status: "ACTIVE" }
              as: GrowerManager
              captures: { pw1: $.data.id }
            - call: "POST /workers"
              payload: { full_name: "Petra Lund", skill: "HARVEST", hourly_rate_usd: 19.50, productivity_index: 1.00, status: "ACTIVE" }
              as: GrowerManager
              captures: { pw2: $.data.id }
            - call: "POST /workers"
              payload: { full_name: "Sera Vos", skill: "SCOUT", hourly_rate_usd: 21.00, productivity_index: 1.00, status: "ACTIVE" }
              as: GrowerManager
              captures: { pw3: $.data.id }
          trigger:
            - call: "GET /workers"
              payload: { skill: "HARVEST", limit: 1, offset: 0 }
              as: GrowerManager
              captures: { page1_first: "$.data[0].id" }
            - call: "GET /workers"
              payload: { skill: "HARVEST", limit: 1, offset: 1 }
              as: GrowerManager
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "both calls return HTTP 200 with response_type array"
            - "the first page carries total_count 2, limit 1, offset 0 and has_more true"
            - "the second page carries total_count 2, limit 1, offset 1 and has_more false"
            - "${page1_first} == ${pw1}"
            - "${page2_first} == ${pw2}"
            - "the SCOUT worker ${pw3} appears in neither page because the skill filter excludes it"

      - name: crop_cycle_get_with_an_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=6]
          - errors[ERR_CROP_CYCLE_NOT_FOUND]
        test_recipe:
          setup:
            - "Empty database; no crop cycle has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
          trigger:
            - call: "GET /crop-cycles/00000000-0000-4000-8000-000000000000"
              as: GrowerManager
              captures: { nf_err: $.data.error_id }
          assert:
            - "the call returns HTTP 404 with response_type error"
            - "${nf_err} == ERR_CROP_CYCLE_NOT_FOUND"

      - name: variety_create_missing_a_required_field_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
          - endpoints[POST /varieties]
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
          trigger:
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true }
              as: GrowerManager
              captures: { req_err: $.data.error_id }
          assert:
            - "ec_target_ms is a declared required input and is absent from the payload"
            - "the call returns HTTP 400"
            - "${req_err} == ERR_VALIDATION"
            - "no Variety row is written"

      - name: worker_create_omitting_optional_fields_applies_the_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Worker.fields.productivity_index
          - entities.Worker.fields.status
          - entities.Worker.fields.committed_hours
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
          trigger:
            - call: "POST /workers"
              payload: { full_name: "Default Dana", skill: "HARVEST", hourly_rate_usd: 19.50 }
              as: GrowerManager
              captures: { dw: $.data.id, dw_pidx: $.data.productivity_index, dw_status: $.data.status, dw_hours: $.data.committed_hours }
          assert:
            - "the call returns HTTP 201"
            - "${dw_pidx} == 1.00"
            - "${dw_status} == ACTIVE"
            - "${dw_hours} == 0.00"
            - "Worker.${dw}.version == 1"

      - name: crop_cycle_computed_density_factor_ignores_an_extra_field_in_the_payload
        claim_type: computed_fields
        grounds:
          - entities.CropCycle.fields.density_factor
          - calculations.expected_yield_curve
        test_recipe:
          setup:
            - "One zone of 9450 sqft and one tomato variety at 0.24 plants per sqft."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZC-03", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zc3: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { vc3: $.data.id }
          trigger:
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zc3}", variety_id: "${vc3}", transplant_date: "2026-08-03", plants_transplanted: 2157, density_factor: 5.0, expected_total_yield_lbs: 1.0 }
              as: GrowerManager
              captures: { cc3: $.data.id, cc3_df: $.data.density_factor }
          assert:
            - "the call returns HTTP 201 and the two undeclared fields are silently discarded"
            - "${cc3_df} == 0.9511"
            - "2157 / (9450 * 0.24) quantized to four places is 0.9511, so the client's 5.0 was ignored"
            - "CropCycle.${cc3}.expected_total_yield_lbs == 82688.64"
            - "CropCycle.${cc3}.first_harvest_allowed_date == 2026-08-24"
            - "CropCycle.${cc3}.planned_end_date == 2026-11-01"

      - name: zone_create_with_a_client_supplied_id_extra_field_ignored
        claim_type: system_fields
        grounds:
          - entities.Zone.common_fields
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
          trigger:
            - call: "POST /zones"
              payload: { code: "ZC-04", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00, id: "11111111-1111-4111-8111-111111111111", version: 99, created_at: "2000-01-01T00:00:00Z" }
              as: GrowerManager
              captures: { zc4: $.data.id, zc4_v: $.data.version }
          assert:
            - "the call returns HTTP 201"
            - "${zc4} != 11111111-1111-4111-8111-111111111111"
            - "${zc4_v} == 1"
            - "created_at is the current logical clock, not the year 2000"

      - name: variety_create_with_an_invalid_enum_crop_type_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_ENUM_VALUE]
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
          trigger:
            - call: "POST /varieties"
              payload: { name: "Mystery Crop", crop_type: "DURIAN", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { enum_err: $.data.error_id }
          assert:
            - "the call returns HTTP 400"
            - "${enum_err} == ERR_INVALID_ENUM_VALUE"
            - "no Variety row is written"

      - name: immutable_variety_and_observation_rows_carry_no_version_and_no_writer
        claim_type: immutability
        grounds:
          - entities.Variety.common_fields
          - entities.ScoutingObservation.common_fields
        test_recipe:
          setup:
            - "One zone, one tomato variety, one crop cycle in TRANSPLANTED and one SCOUT worker."
            - "One below-threshold WHITEFLY observation so no posture cascade fires."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZC-05", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zc5: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { vc5: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zc5}", variety_id: "${vc5}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cc5: $.data.id }
            - call: "POST /crop-cycles/${cc5}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
            - call: "POST /workers"
              payload: { full_name: "Sera Vos", skill: "SCOUT", hourly_rate_usd: 21.00, productivity_index: 1.00, status: "ACTIVE" }
              as: GrowerManager
              captures: { ws5: $.data.id }
            - call: "POST /scouting-observations"
              payload: { zone_id: "${zc5}", crop_cycle_id: "${cc5}", observed_at: "2026-08-06T08:00:00Z", pest_code: "WHITEFLY", plants_inspected: 60, pest_count_per_plant: 0.400 }
              as: IPMScout
              as_user_id: "${ws5}"
              captures: { ob5: $.data.id, ob5_status: $.data.threshold_status, ob5_required: $.data.release_required }
          trigger:
            - call: "GET /varieties/${vc5}"
              as: GrowerManager
              captures: { v_read: $.data.id }
            - call: "GET /scouting-observations/${ob5}"
              as: GrowerManager
              captures: { o_read: $.data.id }
          assert:
            - "${v_read} == ${vc5}"
            - "${o_read} == ${ob5}"
            - "${ob5_status} == BELOW"
            - "${ob5_required} == false"
            - "neither response carries a version field and neither entity declares an update endpoint in §1.5"
            - "Zone.${zc5}.open_pest_alert_count == 0"
            - "Zone.${zc5}.ipm_posture == NORMAL"

      - name: crop_cycle_create_with_an_unknown_variety_id_returns_not_found
        claim_type: flat_topology_fk_integrity
        grounds:
          - complexity_profile.entity_topology
          - validations[priority=7]
          - errors[ERR_VARIETY_NOT_FOUND]
        test_recipe:
          setup:
            - "One zone exists; no variety has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZC-06", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zc6: $.data.id }
          trigger:
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zc6}", variety_id: "22222222-2222-4222-8222-222222222222", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { fk_err: $.data.error_id }
          assert:
            - "the call returns HTTP 404"
            - "${fk_err} == ERR_VARIETY_NOT_FOUND"
            - "no CropCycle row is written and Zone ${zc6} stays in status IDLE"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: fertigation_batch_is_born_in_mixed_and_walks_to_delivered_then_reconciled
        claim_type: initial_state_and_valid_transition
        grounds:
          - state_machines.FertigationBatch.None_to_MIXED
          - state_machines.FertigationBatch.MIXED_to_DELIVERED
          - state_machines.FertigationBatch.DELIVERED_to_RECONCILED
          - calculations.nutrient_blend_recirculation
        test_recipe:
          setup:
            - "Clock at 2026-08-06T00:00:00Z, one zone, one tomato variety with ec_target_ms 3.0, one crop cycle in TRANSPLANTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZC-10", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zc10: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
              as: GrowerManager
              captures: { vc10: $.data.id }
            - call: "POST /crop-cycles"
              payload: { zone_id: "${zc10}", variety_id: "${vc10}", transplant_date: "2026-08-03", plants_transplanted: 2157 }
              as: GrowerManager
              captures: { cc10: $.data.id }
            - call: "POST /crop-cycles/${cc10}/transitions"
              payload: { to_status: "TRANSPLANTED" }
              as: GrowerManager
          trigger:
            - call: "POST /fertigation-batches"
              payload: { zone_id: "${zc10}", crop_cycle_id: "${cc10}", batch_date: "2026-08-06", planned_volume_liters: 12000, requested_recirculated_liters: 6000, reservoir_ec_ms: 4.6, target_ec_ms: 3.0, target_ph: 5.8, n_ppm: 180, k_ppm: 320, ca_ppm: 200, drain_target_pct: 30 }
              as: IrrigationTech
              captures: { fb10: $.data.id, fb10_status: $.data.status, fb10_applied: $.data.recirculated_liters_applied, fb10_fresh: $.data.fresh_liters_applied, fb10_blend: $.data.blended_ec_ms }
            - call: "POST /fertigation-batches/${fb10}/transitions"
              payload: { to_status: "DELIVERED", delivered_volume_liters: 12000 }
              as: IrrigationTech
              captures: { fb10_delivered: $.data.status }
            - call: "POST /fertigation-batches/${fb10}/drainage-readings"
              payload: { drain_volume_liters: 3600.0, drain_ec_ms: 3.4, reading_at: "2026-08-06T12:00:00Z" }
              as: IrrigationTech
              captures: { fb10_after_reading: $.data.status, fb10_alarm: $.data.drain_alarm }
            - call: "POST /fertigation-batches/${fb10}/transitions"
              payload: { to_status: "RECONCILED" }
              as: IrrigationTech
          assert:
            - "${fb10_status} == MIXED, which is the declared initial_state - no PLANNED state exists"
            - "${fb10_applied} == 6000"
            - "${fb10_fresh} == 6000"
            - "${fb10_blend} == 2.500"
            - "${fb10_delivered} == DELIVERED"
            - "${fb10_after_reading} == DELIVERED, because the drainage-reading edge is a self-loop"
            - "${fb10_alarm} == false"
            - "FertigationBatch.${fb10}.status == RECONCILED"
            - "FertigationBatch.${fb10}.drain_fraction_pct == 30.00"
            - "Zone.${zc10}.drain_alarm_count == 0"
            - "Zone.${zc10}.irrigation_posture == NORMAL"

      - name: climate_strategy_lighting_on_a_zone_without_lights_is_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ClimateStrategy.None_to_ACTIVE
          - validations[priority=20]
          - errors[ERR_ZONE_CAPABILITY_MISSING]
        test_recipe:
          setup:
            - "One zone with has_supplemental_lighting false and has_thermal_screen false."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZC-11", area_sqft: 9450, glazing_type: "POLY", has_thermal_screen: false, has_supplemental_lighting: false, chp_connected: false, hive_slot_capacity: 4, labor_budget_usd: 8000.00 }
              as: GrowerManager
              captures: { zc11: $.data.id, zc11_v: $.data.version }
          trigger:
            - call: "POST /climate-strategies"
              payload: { zone_id: "${zc11}", regime: "DAY", window_start: "2026-08-07T06:00:00Z", window_end: "2026-08-07T18:00:00Z", temp_setpoint_c: 21.5, rh_setpoint_pct: 78, co2_setpoint_ppm: 900, lighting_hours: 6, screen_position_pct: 0, expected_zone_version: "${zc11_v}" }
              as: GrowerManager
              captures: { cap_err: $.data.error_id }
          assert:
            - "the call returns HTTP 422"
            - "${cap_err} == ERR_ZONE_CAPABILITY_MISSING"
            - "no ClimateStrategy row is written and Zone ${zc11}.climate_plan_revision stays 0"
            - "the same payload with lighting_hours 0 would be accepted, proving the setpoint ranges themselves were in bounds"

      - name: labor_task_scheduled_cannot_jump_straight_to_completed
        claim_type: invalid_transitions
        grounds:
          - state_machines.LaborTask.SCHEDULED_to_IN_PROGRESS
          - validations[priority=10]
          - errors[ERR_INVALID_STATE_TRANSITION]
        test_recipe:
          setup:
            - "Clock at 2026-08-06T00:00:00Z, one zone, one crop cycle in TRANSPLANTED, one ACTIVE HARVEST worker."
            - "One SCHEDULED task for 4000 units at a 500 units/hour standard."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZC-12", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zc12: $.data.id }
            - call: "POST /varieties"
