# =============================================================================
# PRD Benchmark Seed Tables — Structured Settlement Annuity Administration
# Difficulty target: HARDER THAN EXPERT (dense coupling, multi-jurisdiction
# statutory variation, OCC, compensating invariants, deep cascades)
# =============================================================================

scenario: |
  Structured Settlement Annuity Administration (structured settlement annuity issuer): settlement agreement & payment schedule setup, qualified assignment & annuity purchase, periodic payment issuance & address/tax handling, payee change & guardianship/minor payment rules, secondary market transfer with court approval, missed/returned payment investigation, death benefit & commutation provisions, statutory compliance across states

domain_name: structured-settlement-annuity
api_prefix: /annuity

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology; FK links, no URL nesting)
# =============================================================================
entities:
  - name: StateStatuteProfile
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "US state/territory code this profile governs; unique across profiles", constraints: "2-letter uppercase code; unique" }
      - { name: age_of_majority, type: integer, source: input, description: "Age at which a payee ceases to be a minor in this state (18, 19, or 21)", constraints: "18..21" }
      - { name: sspa_max_discount_rate_bps, type: integer, source: input, description: "State Structured Settlement Protection Act cap on effective_annual_rate_bps (IRR method); a petition whose rate exceeds the cap cannot be filed", constraints: "> 0" }
      - { name: disclosure_cooling_off_days, type: integer, source: input, description: "Minimum whole days that must elapse between disclosure service and hearing scheduling", constraints: ">= 0" }
      - { name: ipa_required, type: boolean, source: input, description: "Whether the state requires independent professional advice before a transfer hearing may be scheduled" }
      - { name: dormancy_years, type: integer, source: input, description: "Unclaimed-property dormancy period in years; unpaid payments become ESCHEATABLE the day AFTER the dormancy anniversary of due_date", constraints: ">= 1" }
      - { name: commutation_permitted, type: boolean, source: input, description: "Whether this state permits commutation of structured settlement payments" }

  - name: Payee
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Payee legal name" }
      - { name: date_of_birth, type: string, source: input, description: "Birth date YYYY-MM-DD; drives is_minor", constraints: "YYYY-MM-DD, strictly before current clock date" }
      - { name: tax_id, type: string, source: input, description: "SSN/TIN used for 1099 reporting" }
      - { name: address_line1, type: string, source: input, description: "Mailing address line 1; mutable only via approved PayeeChangeRequest" }
      - { name: address_city, type: string, source: input, description: "Mailing city" }
      - { name: address_state_code, type: string, source: input, description: "Mailing state code; selects the StateStatuteProfile used for minority and dormancy rules; a profile for this code must exist" }
      - { name: address_postal_code, type: string, source: input, description: "Mailing postal code" }
      - { name: phone, type: string, source: input, required: false, description: "Optional phone" }
      - { name: email, type: string, source: input, required: false, description: "Optional email" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DECEASED; set DECEASED when a DeathClaim settles", constraints: "ACTIVE | DECEASED" }
      - { name: deceased_date, type: string, source: system, description: "Date of death recorded at DeathClaim settlement; null while ACTIVE" }
      - { name: is_minor, type: boolean, source: computed, description: "True when age at current logical clock date is strictly less than age_of_majority of the StateStatuteProfile keyed by address_state_code; age uses full-year arithmetic (birthday already reached this calendar year)" }

  - name: GuardianshipCase
    parent: null
    common_fields: true
    fields:
      - { name: payee_id, type: string, source: input, description: "FK -> Payee.id; the protected payee" }
      - { name: court_state_code, type: string, source: input, description: "State of the court that appointed the guardian" }
      - { name: guardian_full_name, type: string, source: input, description: "Court-appointed guardian/conservator legal name; payments to a minor are made payable to this name" }
      - { name: effective_from_date, type: string, source: input, description: "First day of guardianship authority (inclusive); half-open interval start", constraints: "YYYY-MM-DD" }
      - { name: terminated_at_date, type: string, source: system, description: "Termination date (exclusive end of the half-open interval); set on revoke or auto-termination at majority; null while open-ended" }
      - { name: status, type: enum, source: system, default: PENDING_REVIEW, description: "PENDING_REVIEW -> ACTIVE -> TERMINATED | REVOKED", constraints: "PENDING_REVIEW | ACTIVE | TERMINATED | REVOKED" }

  - name: SettlementAgreement
    parent: null
    common_fields: true
    fields:
      - { name: case_number, type: string, source: input, description: "Court case number; unique across agreements", constraints: "unique" }
      - { name: court_state_code, type: string, source: input, description: "State of the settling court; a StateStatuteProfile for this code must exist" }
      - { name: obligor_name, type: string, source: input, description: "Defendant/insurer obligated to fund the settlement" }
      - { name: injury_type, type: enum, source: input, description: "PHYSICAL (tax-free under IRC 104(a)(2)) | NON_PHYSICAL (taxable)", constraints: "PHYSICAL | NON_PHYSICAL" }
      - { name: primary_payee_id, type: string, source: input, description: "FK -> Payee.id; injured party receiving payments" }
      - { name: agreement_date, type: string, source: input, description: "Date of the settlement agreement", constraints: "YYYY-MM-DD" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> EXECUTED -> ASSIGNED -> FUNDED -> ACTIVE -> CLOSED | COMMUTED", constraints: "DRAFT | EXECUTED | ASSIGNED | FUNDED | ACTIVE | CLOSED | COMMUTED" }
      - { name: total_scheduled_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over all ScheduledPayments of the currently ACTIVE schedule; recomputed at schedule activation" }
      - { name: outstanding_liability_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over payments in {SCHEDULED, PAYABLE, ISSUED, RETURNED, STALE_DATED, ESCHEATABLE}; recomputed on every payment transition" }
      - { name: paid_total_cents, type: integer, source: computed, default: 0, description: "Cumulative amount_cents of payments that reached CLEARED" }
      - { name: escheated_total_cents, type: integer, source: computed, default: 0, description: "Cumulative amount_cents currently in ESCHEATED status (decremented on reclaim)" }
      - { name: transferred_total_cents, type: integer, source: computed, default: 0, description: "Cumulative nominal amount_cents of payments TRANSFERRED to factoring companies" }
      - { name: commuted_nominal_total_cents, type: integer, source: computed, default: 0, description: "Cumulative nominal amount_cents of payments COMMUTED (the discounted lump payout is tracked on CommutationRequest, not here)" }

  - name: QualifiedAssignment
    parent: null
    common_fields: true
    fields:
      - { name: settlement_agreement_id, type: string, source: input, description: "FK -> SettlementAgreement.id; agreement being assigned (IRC 130 qualified assignment)" }
      - { name: assignment_company_name, type: string, source: input, description: "Qualified assignment company (QAC) assuming the periodic payment obligation" }
      - { name: executed_date, type: string, source: input, description: "Date the assignment agreement was executed", constraints: "YYYY-MM-DD" }
      - { name: status, type: enum, source: system, default: EXECUTED, description: "EXECUTED -> RELEASED (obligor novation released once annuity is in force)", constraints: "EXECUTED | RELEASED" }

  - name: AnnuityPolicy
    parent: null
    common_fields: true
    fields:
      - { name: settlement_agreement_id, type: string, source: input, description: "FK -> SettlementAgreement.id; agreement this policy funds (1:1 enforcement is not required by the model, but FUNDED requires the linked policy IN_FORCE)" }
      - { name: qualified_assignment_id, type: string, source: input, description: "FK -> QualifiedAssignment.id; assignment under which the QAC purchased this annuity" }
      - { name: policy_number, type: string, source: input, description: "Insurer policy number" }
      - { name: insurer_name, type: string, source: input, description: "Life insurance company issuing the annuity" }
      - { name: premium_cents, type: integer, source: input, description: "Single premium paid by the QAC to the insurer", constraints: "> 0" }
      - { name: contract_discount_rate_bps, type: integer, source: input, description: "Policy pricing discount rate in basis points; basis for present_value_cents and the commutation min-rate", constraints: "> 0" }
      - { name: commutation_rider, type: enum, source: input, description: "NONE | DEATH_ONLY | DEATH_AND_HARDSHIP — which commutation reasons the contract allows", constraints: "NONE | DEATH_ONLY | DEATH_AND_HARDSHIP" }
      - { name: certain_period_end_date, type: string, source: input, required: false, description: "End of the guaranteed/certain period YYYY-MM-DD; payments due on or before this date survive the payee's death (paid to the estate/beneficiary); null means all payments are life-contingent" }
      - { name: in_force_date, type: string, source: system, description: "Date the policy went in force; null while PENDING_ISSUE" }
      - { name: status, type: enum, source: system, default: PENDING_ISSUE, description: "PENDING_ISSUE -> IN_FORCE -> PARTIALLY_COMMUTED -> FULLY_COMMUTED | EXHAUSTED", constraints: "PENDING_ISSUE | IN_FORCE | PARTIALLY_COMMUTED | FULLY_COMMUTED | EXHAUSTED" }

  - name: PaymentSchedule
    parent: null
    common_fields: true
    fields:
      - { name: settlement_agreement_id, type: string, source: input, description: "FK -> SettlementAgreement.id" }
      - { name: effective_from_date, type: string, source: input, description: "First date this schedule governs", constraints: "YYYY-MM-DD" }
      - { name: escalation_anchor_date, type: string, source: input, description: "Anniversary anchor for escalation: a payment's escalation exponent n equals the count of anniversaries of this date that are <= the payment's due_date", constraints: "YYYY-MM-DD" }
      - { name: supersedes_schedule_id, type: string, source: system, description: "FK -> PaymentSchedule.id; the previously ACTIVE schedule this schedule superseded at activation; null for the first ACTIVE schedule" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> ACTIVE -> SUPERSEDED | TERMINATED", constraints: "DRAFT | ACTIVE | SUPERSEDED | TERMINATED" }

  - name: ScheduledPayment
    parent: null
    common_fields: true
    fields:
      - { name: payment_schedule_id, type: string, source: input, description: "FK -> PaymentSchedule.id; must be a DRAFT schedule at creation" }
      - { name: payee_id, type: string, source: input, description: "FK -> Payee.id; recipient" }
      - { name: payment_seq_no, type: integer, source: input, description: "Sequence number within the schedule", constraints: ">= 1" }
      - { name: due_date, type: string, source: input, description: "Contractual due date YYYY-MM-DD; must be >= schedule effective_from_date" }
      - { name: base_amount_cents, type: integer, source: input, description: "Un-escalated contractual amount", constraints: "> 0" }
      - { name: escalation_rate_bps, type: integer, source: input, default: 0, description: "Annual escalation (COLA) in basis points applied per anniversary of the schedule's escalation_anchor_date", constraints: ">= 0" }
      - { name: payment_type, type: enum, source: input, default: PERIODIC, description: "PERIODIC | LUMP_SUM", constraints: "PERIODIC | LUMP_SUM" }
      - { name: amount_cents, type: integer, source: computed, description: "Payable amount: carry-rounded escalation (round_half_up to cents after EVERY annual compounding step, carrying the rounded value forward); computed at creation" }
      - { name: disclosure_amount_cents, type: integer, source: computed, description: "Disclosure amount: end-rounded escalation (compound unrounded, round_half_up once at the end); may differ from amount_cents" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED -> PAYABLE -> ISSUED -> CLEARED | RETURNED | STALE_DATED; RETURNED -> PAYABLE (authorized reissue cycle); {ISSUED,STALE_DATED,RETURNED} -> ESCHEATABLE -> ESCHEATED -> PAYABLE (reclaim); SCHEDULED|PAYABLE -> TRANSFERRED | COMMUTED | CANCELLED", constraints: "SCHEDULED | PAYABLE | ISSUED | CLEARED | RETURNED | STALE_DATED | ESCHEATABLE | ESCHEATED | TRANSFERRED | COMMUTED | CANCELLED" }
      - { name: issue_count, type: integer, source: system, default: 0, description: "Number of successful issuance attempts" }
      - { name: last_issue_method, type: enum, source: system, description: "CHECK | EFT of the latest issuance; null before first issue", constraints: "CHECK | EFT" }
      - { name: last_issued_at, type: string, source: system, description: "Clock date of the latest issuance; null before first issue" }
      - { name: payee_name_on_check, type: string, source: system, description: "Name the last issuance was made payable to: guardian_full_name of the payee's ACTIVE GuardianshipCase when the payee is a minor, else the payee's full_name" }
      - { name: return_reason, type: enum, source: system, description: "BAD_ADDRESS | EFT_REJECTED | UNCASHED_STALE of the latest return; null unless RETURNED", constraints: "BAD_ADDRESS | EFT_REJECTED | UNCASHED_STALE" }
      - { name: escheated_in_batch_id, type: string, source: system, description: "FK -> EscheatmentBatch.id; batch that swept this payment; null unless ESCHEATED" }
      - { name: transferred_by_petition_id, type: string, source: system, description: "FK -> TransferPetition.id; petition whose effectuation transferred this payment; null unless TRANSFERRED" }
      - { name: commuted_by_request_id, type: string, source: system, description: "FK -> CommutationRequest.id; commutation that paid out this payment; null unless COMMUTED" }
      - { name: cancel_reason, type: enum, source: system, description: "DEATH | SUPERSEDED; null unless CANCELLED", constraints: "DEATH | SUPERSEDED" }

  - name: ReturnedPaymentCase
    parent: null
    common_fields: true
    fields:
      - { name: scheduled_payment_id, type: string, source: system, description: "FK -> ScheduledPayment.id; the returned payment under investigation" }
      - { name: return_reason, type: enum, source: system, description: "Copied from the report-returned call: BAD_ADDRESS | EFT_REJECTED | UNCASHED_STALE", constraints: "BAD_ADDRESS | EFT_REJECTED | UNCASHED_STALE" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID that reported the return; segregation-of-duties anchor (the same user id may not authorize reissue)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> RESOLVED_REISSUE | ESCHEAT_PENDING -> CLOSED_ESCHEATED", constraints: "OPEN | RESOLVED_REISSUE | ESCHEAT_PENDING | CLOSED_ESCHEATED" }
      - { name: resolution_note, type: string, source: system, description: "Short system note describing how the case resolved" }

  - name: PayeeChangeRequest
    parent: null
    common_fields: true
    fields:
      - { name: payee_id, type: string, source: input, description: "FK -> Payee.id" }
      - { name: change_type, type: enum, source: input, description: "ADDRESS | NAME | BANK_ACCOUNT", constraints: "ADDRESS | NAME | BANK_ACCOUNT" }
      - { name: new_address_line1, type: string, source: input, required: false, description: "New address line 1 (ADDRESS changes)" }
      - { name: new_address_city, type: string, source: input, required: false, description: "New city (ADDRESS changes)" }
      - { name: new_address_state_code, type: string, source: input, required: false, description: "New state code (ADDRESS changes); a StateStatuteProfile for this code must exist" }
      - { name: new_address_postal_code, type: string, source: input, required: false, description: "New postal code (ADDRESS changes)" }
      - { name: new_full_name, type: string, source: input, required: false, description: "New legal name (NAME changes)" }
      - { name: new_bank_routing_number, type: string, source: input, required: false, description: "New ACH routing number (BANK_ACCOUNT changes)" }
      - { name: new_bank_account_number, type: string, source: input, required: false, description: "New ACH account number (BANK_ACCOUNT changes)" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the submitter; SoD anchor for staff-submitted requests" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED -> APPROVED (auto when change_type=ADDRESS and no OPEN ReturnedPaymentCase exists for the payee) | UNDER_REVIEW -> APPROVED | REJECTED", constraints: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED" }

  - name: TransferPetition
    parent: null
    common_fields: true
    fields:
      - { name: settlement_agreement_id, type: string, source: input, description: "FK -> SettlementAgreement.id; must be FUNDED or ACTIVE at creation" }
      - { name: payee_id, type: string, source: input, description: "FK -> Payee.id; the payee selling payments (must be the agreement's primary payee)" }
      - { name: factoring_company_name, type: string, source: input, description: "Secondary-market purchaser" }
      - { name: purchase_price_cents, type: integer, source: input, description: "Lump-sum price offered to the payee", constraints: "> 0" }
      - { name: transfer_start_date, type: string, source: input, description: "Inclusive start of the due-date window selecting payments", constraints: "YYYY-MM-DD" }
      - { name: transfer_end_date, type: string, source: input, description: "Inclusive end of the due-date window selecting payments", constraints: "YYYY-MM-DD, >= transfer_start_date" }
      - { name: state_code, type: string, source: system, description: "Payee's address_state_code captured at filing; selects the governing StateStatuteProfile (SSPA forum state)" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID that filed the petition; SoD anchor for court-order recording" }
      - { name: filed_at, type: string, source: system, description: "Clock date of filing; valuation date for rate computations" }
      - { name: disclosure_served_at, type: string, source: system, description: "Clock date the statutory disclosure was served" }
      - { name: hearing_date, type: string, source: system, description: "Scheduled hearing date" }
      - { name: ipa_completed_at, type: string, source: system, description: "Date independent professional advice was completed; required before hearing when the governing profile has ipa_required" }
      - { name: transferred_payment_count, type: integer, source: computed, description: "Count of SCHEDULED/PAYABLE payments of the agreement's ACTIVE schedule with due_date in [transfer_start_date, transfer_end_date] inclusive; computed at creation" }
      - { name: present_value_cents, type: integer, source: computed, description: "PV of the matched payment set at the policy's contract_discount_rate_bps; per-payment round_half_up THEN sum (pinned order); computed at creation" }
      - { name: disclosed_discount_rate_bps, type: integer, source: computed, description: "Aggregate-method annualized discount: round_half_up(10000 * (nominal - price) / nominal / weighted_avg_years) where weighted_avg_years = sum(amount_i * t_i)/sum(amount_i), t_i in ACT/365 years from valuation date" }
      - { name: effective_annual_rate_bps, type: integer, source: computed, description: "Actuarial IRR method: r solving purchase_price_cents = sum(amount_i / (1+r)^(t_i)); reported as round_half_up(10000*r); the statutory cap applies to THIS value" }
      - { name: court_outcome, type: enum, source: system, description: "APPROVED | APPROVED_MODIFIED | DENIED; null until a court order is recorded", constraints: "APPROVED | APPROVED_MODIFIED | DENIED" }
      - { name: court_order_date, type: string, source: system, description: "Date of the court order; effectuation must occur within 60 days" }
      - { name: prejudice, type: enum, source: system, description: "WITH | WITHOUT — denials WITH prejudice bar refiling for 365 days", constraints: "WITH | WITHOUT" }
      - { name: approved_price_cents, type: integer, source: system, description: "Court-modified price when outcome is APPROVED_MODIFIED; otherwise mirrors purchase_price_cents" }
      - { name: order_recorded_by_user_id, type: string, source: system, description: "X-User-ID of the JudicialRecorder who recorded the order" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT -> FILED -> DISCLOSURE_SERVED -> HEARING_SCHEDULED -> COURT_APPROVED | COURT_DENIED; COURT_APPROVED -> EFFECTIVE | EXPIRED; FILED|DISCLOSURE_SERVED|HEARING_SCHEDULED -> WITHDRAWN", constraints: "DRAFT | FILED | DISCLOSURE_SERVED | HEARING_SCHEDULED | COURT_APPROVED | COURT_DENIED | EFFECTIVE | EXPIRED | WITHDRAWN" }

  - name: DeathClaim
    parent: null
    common_fields: true
    fields:
      - { name: payee_id, type: string, source: input, description: "FK -> Payee.id; the deceased payee (must be ACTIVE at creation)" }
      - { name: settlement_agreement_id, type: string, source: input, description: "FK -> SettlementAgreement.id" }
      - { name: date_of_death, type: string, source: input, description: "Date of death YYYY-MM-DD", constraints: "YYYY-MM-DD" }
      - { name: claimant_type, type: enum, source: input, description: "BENEFICIARY | ESTATE — who receives certain-period and death-benefit payments", constraints: "BENEFICIARY | ESTATE" }
      - { name: claimant_name, type: string, source: input, description: "Name of the beneficiary or estate representative" }
      - { name: denial_reason, type: string, source: system, description: "Reason recorded when denied; null otherwise" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED -> SETTLED | DENIED; DENIED -> REPORTED (resubmission cycle)", constraints: "REPORTED | SETTLED | DENIED" }

  - name: CommutationRequest
    parent: null
    common_fields: true
    fields:
      - { name: annuity_policy_id, type: string, source: input, description: "FK -> AnnuityPolicy.id; policy whose payments are commuted" }
      - { name: settlement_agreement_id, type: string, source: input, description: "FK -> SettlementAgreement.id" }
      - { name: death_claim_id, type: string, source: input, required: false, description: "FK -> DeathClaim.id; required when reason=DEATH, must reference a SETTLED claim" }
      - { name: reason, type: enum, source: input, description: "DEATH | HARDSHIP; rider and statute gates differ per reason", constraints: "DEATH | HARDSHIP" }
      - { name: covered_payment_count, type: integer, source: computed, description: "Count of eligible payments (SCHEDULED/PAYABLE on the ACTIVE schedule with due_date strictly after the creation clock date)" }
      - { name: fee_cents, type: integer, source: computed, description: "HARDSHIP: min(round_half_up(0.03 * pv_total), 25000); DEATH: 0" }
      - { name: commuted_value_cents, type: integer, source: computed, description: "pv_total - fee_cents where pv_total discounts each eligible payment at min(policy.contract_discount_rate_bps, state profile sspa_max_discount_rate_bps of the payee residence), per-payment round_half_up then sum" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> APPROVED | DENIED; APPROVED -> PAID_OUT", constraints: "REQUESTED | APPROVED | DENIED | PAID_OUT" }

  - name: EscheatmentBatch
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "State whose unclaimed-property filing this batch covers; at most one OPEN batch per state_code" }
      - { name: batch_period, type: string, source: input, description: "Reporting period label YYYY-MM" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID that opened the batch; SoD anchor (opener may not finalize)" }
      - { name: swept_count, type: integer, source: computed, default: 0, description: "Number of ESCHEATABLE payments swept at finalize" }
      - { name: swept_amount_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents swept at finalize" }
      - { name: reclaimed_count, type: integer, source: computed, default: 0, description: "Number of ESCHEATED->PAYABLE reclaims attributed to this batch while it is OPEN" }
      - { name: reclaimed_amount_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents reclaimed while this batch is OPEN" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN -> FINALIZED", constraints: "OPEN | FINALIZED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SettlementAgreement
    initial_state: DRAFT
    terminal_states: [CLOSED, COMMUTED]
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: POST /annuity/settlement-agreements/{agreementId}/execute
        actor: CaseManager
        preconditions:
          - "agreement.status == DRAFT (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "agreement.version += 1"
      - from: EXECUTED
        to: ASSIGNED
        trigger: POST /annuity/qualified-assignments (creation against this agreement)
        actor: CaseManager
        preconditions:
          - "agreement.status == EXECUTED (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "agreement.status -> ASSIGNED; agreement.version += 1"
      - from: ASSIGNED
        to: FUNDED
        trigger: POST /annuity/annuity-policies/{policyId}/mark-in-force on a policy linked to this agreement
        actor: CaseManager
        preconditions:
          - "agreement.status == ASSIGNED (ERR_AGREEMENT_INVALID_STATE)"
          - "policy.status transitions PENDING_ISSUE -> IN_FORCE (ERR_POLICY_INVALID_STATE)"
        side_effects:
          - "agreement.status -> FUNDED; agreement.version += 1"
      - from: FUNDED
        to: ACTIVE
        trigger: "system (on POST /annuity/_clock/set_current_utc: a payment on the agreement's ACTIVE schedule transitions SCHEDULED -> PAYABLE)"
        actor: system
        preconditions:
          - "agreement.status == FUNDED"
          - "at least one payment on the ACTIVE schedule has due_date <= current clock date"
        side_effects:
          - "agreement.status -> ACTIVE; agreement.version += 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "system (immediately after the linked AnnuityPolicy reaches EXHAUSTED)"
        actor: system
        preconditions:
          - "policy.status just became EXHAUSTED (no payments in {SCHEDULED, PAYABLE, ISSUED, RETURNED, STALE_DATED, ESCHEATABLE})"
        side_effects:
          - "agreement.status -> CLOSED; agreement.version += 1"
      - from: ACTIVE
        to: COMMUTED
        trigger: "system (immediately after the linked AnnuityPolicy reaches FULLY_COMMUTED via CommutationRequest pay-out)"
        actor: system
        preconditions:
          - "policy.status just became FULLY_COMMUTED"
        side_effects:
          - "agreement.status -> COMMUTED; agreement.version += 1"

  - entity: QualifiedAssignment
    initial_state: EXECUTED
    terminal_states: [RELEASED]
    transitions:
      - from: EXECUTED
        to: RELEASED
        trigger: POST /annuity/qualified-assignments/{assignmentId}/release
        actor: ComplianceOfficer
        preconditions:
          - "assignment.status == EXECUTED (ERR_ASSIGNMENT_INVALID_STATE)"
          - "an AnnuityPolicy with qualified_assignment_id == assignment.id exists and has status IN_FORCE | PARTIALLY_COMMUTED (ERR_POLICY_INVALID_STATE)"
        side_effects:
          - "assignment.status -> RELEASED; assignment.version += 1"

  - entity: AnnuityPolicy
    initial_state: PENDING_ISSUE
    terminal_states: [FULLY_COMMUTED, EXHAUSTED]
    transitions:
      - from: PENDING_ISSUE
        to: IN_FORCE
        trigger: POST /annuity/annuity-policies/{policyId}/mark-in-force
        actor: CaseManager
        preconditions:
          - "policy.status == PENDING_ISSUE (ERR_POLICY_INVALID_STATE)"
          - "linked agreement.status == ASSIGNED (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "policy.in_force_date = input in_force_date; policy.version += 1"
          - "cascade: linked agreement ASSIGNED -> FUNDED"
      - from: IN_FORCE
        to: PARTIALLY_COMMUTED
        trigger: POST /annuity/commutation-requests/{commutationId}/pay-out when non-terminal payments remain after payout
        actor: OperationsSpecialist
        preconditions:
          - "commutation.status == APPROVED (ERR_COMMUTATION_INVALID_STATE)"
        side_effects:
          - "policy.version += 1"
      - from: PARTIALLY_COMMUTED
        to: PARTIALLY_COMMUTED
        trigger: POST /annuity/commutation-requests/{commutationId}/pay-out (repeat partial commutation)
        actor: OperationsSpecialist
        preconditions:
          - "commutation.status == APPROVED (ERR_COMMUTATION_INVALID_STATE)"
        side_effects:
          - "policy.version += 1"
      - from: IN_FORCE
        to: FULLY_COMMUTED
        trigger: POST /annuity/commutation-requests/{commutationId}/pay-out when no non-terminal payments remain
        actor: OperationsSpecialist
        preconditions:
          - "commutation.status == APPROVED (ERR_COMMUTATION_INVALID_STATE)"
        side_effects:
          - "policy.version += 1"
          - "cascade: linked agreement ACTIVE -> COMMUTED"
      - from: PARTIALLY_COMMUTED
        to: FULLY_COMMUTED
        trigger: POST /annuity/commutation-requests/{commutationId}/pay-out when no non-terminal payments remain
        actor: OperationsSpecialist
        preconditions:
          - "commutation.status == APPROVED (ERR_COMMUTATION_INVALID_STATE)"
        side_effects:
          - "policy.version += 1"
          - "cascade: linked agreement ACTIVE -> COMMUTED"
      - from: IN_FORCE
        to: EXHAUSTED
        trigger: "system (immediately after the last payment in {SCHEDULED, PAYABLE, ISSUED, RETURNED, STALE_DATED, ESCHEATABLE} leaves that set — via CLEARED, ESCHEATED, TRANSFERRED, COMMUTED, or CANCELLED)"
        actor: system
        preconditions:
          - "count of non-terminal payments on the ACTIVE schedule for the linked agreement reaches 0"
        side_effects:
          - "policy.version += 1"
          - "cascade: linked agreement ACTIVE -> CLOSED"
      - from: PARTIALLY_COMMUTED
        to: EXHAUSTED
        trigger: "system (same exhaustion rule)"
        actor: system
        preconditions:
          - "count of non-terminal payments reaches 0"
        side_effects:
          - "policy.version += 1"
          - "cascade: linked agreement ACTIVE -> CLOSED"

  - entity: PaymentSchedule
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /annuity/payment-schedules/{scheduleId}/activate
        actor: CaseManager
        preconditions:
          - "schedule.status == DRAFT (ERR_SCHEDULE_INVALID_STATE)"
          - "OCC: expected_settlement_agreement_version == agreement.version (ERR_STALE_AGREEMENT_VERSION, 412)"
          - "at least one ScheduledPayment exists on this schedule (ERR_SCHEDULE_HAS_PAYMENTS)"
          - "linked agreement.status in {FUNDED, ACTIVE} (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "previously ACTIVE schedule for the same agreement (if any) -> SUPERSEDED, and this schedule.supersedes_schedule_id := that schedule's id"
          - "all payments of the superseded schedule in {SCHEDULED, PAYABLE} -> CANCELLED with cancel_reason = SUPERSEDED (their ISSUED/RETURNED/STALE_DATED/ESCHEATABLE payments are untouched)"
          - "agreement.total_scheduled_cents recomputed as sum of amount_cents over this schedule's payments"
          - "agreement.outstanding_liability_cents recomputed over the new payment set"
          - "agreement.version += 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (when CommutationRequest pay-out commutes every remaining non-terminal payment of this schedule)"
        actor: system
        preconditions:
          - "no payments of this schedule remain in {SCHEDULED, PAYABLE, ISSUED, RETURNED, STALE_DATED, ESCHEATABLE}"
        side_effects:
          - "schedule.version += 1"

  - entity: ScheduledPayment
    initial_state: SCHEDULED
    terminal_states: [CLEARED, ESCHEATED, TRANSFERRED, COMMUTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PAYABLE
        trigger: "system (POST /annuity/_clock/set_current_utc: schedule ACTIVE, agreement in {FUNDED, ACTIVE}, due_date <= clock date)"
        actor: system
        preconditions: []
        side_effects:
          - "if agreement.status == FUNDED: agreement -> ACTIVE"
          - "agreement totals recomputed (status move keeps payment inside outstanding set)"
      - from: PAYABLE
        to: ISSUED
        trigger: POST /annuity/scheduled-payments/{paymentId}/issue
        actor: OperationsSpecialist
        preconditions:
          - "payment.status == PAYABLE (ERR_PAYMENT_NOT_PAYABLE)"
          - "if payee.is_minor at current clock: an ACTIVE GuardianshipCase for the payee must exist (ERR_GUARDIANSHIP_REQUIRED)"
        side_effects:
          - "issue_count += 1; last_issue_method = input method; last_issued_at = current clock date"
          - "payee_name_on_check = ACTIVE guardianship.guardian_full_name when payee is minor, else payee.full_name"
          - "return_reason := null"
      - from: ISSUED
        to: CLEARED
        trigger: POST /annuity/scheduled-payments/{paymentId}/mark-cleared
        actor: OperationsSpecialist
        preconditions:
          - "payment.status == ISSUED (ERR_PAYMENT_NOT_ISSUED)"
        side_effects:
          - "agreement.paid_total_cents += amount_cents; agreement.outstanding_liability_cents -= amount_cents; agreement.version += 1"
          - "system: if no non-terminal payments remain -> policy EXHAUSTED -> agreement CLOSED"
      - from: ISSUED
        to: RETURNED
        trigger: POST /annuity/scheduled-payments/{paymentId}/report-returned
        actor: OperationsSpecialist
        preconditions:
          - "payment.status == ISSUED (ERR_PAYMENT_NOT_ISSUED)"
        side_effects:
          - "return_reason := input return_reason"
          - "cascade link 1: create ReturnedPaymentCase(scheduled_payment_id = payment.id, return_reason, opened_by_user_id = X-User-ID, status = OPEN)"
      - from: RETURNED
        to: PAYABLE
        trigger: POST /annuity/returned-payment-cases/{caseId}/authorize-reissue
        actor: OperationsSpecialist
        preconditions:
          - "case.status == OPEN (ERR_CASE_INVALID_STATE)"
          - "payment.status == RETURNED (ERR_PAYMENT_NOT_RETURNED)"
          - "SoD: X-User-ID != case.opened_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "case.status -> RESOLVED_REISSUE; case.resolution_note := 'REISSUE_AUTHORIZED'"
          - "payment -> PAYABLE (outstanding_liability_cents unchanged: RETURNED and PAYABLE are both in the outstanding set)"
      - from: ISSUED
        to: STALE_DATED
        trigger: "system (POST /annuity/_clock/set_current_utc: last_issue_method == CHECK and (clock date - last_issued_at) > 180 days)"
        actor: system
        preconditions: []
        side_effects:
          - "return_reason := UNCASHED_STALE"
      - from: ISSUED
        to: ESCHEATABLE
        trigger: "system (clock-set: clock date > due_date + dormancy_years of payee's address_state_code profile) OR POST /annuity/returned-payment-cases/{caseId}/escalate-escheat"
        actor: system | ComplianceOfficer
        preconditions:
          - "dormancy met: clock date > due_date + profile.dormancy_years years (else ERR_DORMANCY_NOT_MET on the manual path)"
        side_effects:
          - "payment becomes eligible for escheatment sweep"
      - from: STALE_DATED
        to: ESCHEATABLE
        trigger: "system / escalate-escheat (same dormancy rule)"
        actor: system | ComplianceOfficer
        preconditions:
          - "dormancy met"
        side_effects: []
      - from: RETURNED
        to: ESCHEATABLE
        trigger: "system / escalate-escheat (same dormancy rule)"
        actor: system | ComplianceOfficer
        preconditions:
          - "dormancy met"
        side_effects:
          - "system clock sweep: the payment's ReturnedPaymentCase is untouched (stays OPEN)"
          - "manual escalate-escheat only: the payment's OPEN ReturnedPaymentCase -> ESCHEAT_PENDING"
      - from: ESCHEATABLE
        to: ESCHEATED
        trigger: POST /annuity/escheatment-batches/{batchId}/finalize
        actor: ComplianceOfficer
        preconditions:
          - "batch.status == OPEN (ERR_BATCH_INVALID_STATE)"
          - "SoD: X-User-ID != batch.opened_by_user_id (ERR_SOD_VIOLATION)"
          - "payment's payee address_state_code == batch.state_code"
        side_effects:
          - "escheated_in_batch_id := batch.id"
          - "agreement.outstanding_liability_cents -= amount_cents; agreement.escheated_total_cents += amount_cents; agreement.version += 1"
          - "cascade: OPEN/ESCHEAT_PENDING ReturnedPaymentCase for this payment -> CLOSED_ESCHEATED"
          - "system: exhaustion check -> policy EXHAUSTED -> agreement CLOSED"
      - from: ESCHEATED
        to: PAYABLE
        trigger: POST /annuity/scheduled-payments/{paymentId}/reclaim-escheat
        actor: OperationsSpecialist
        preconditions:
          - "payment.status == ESCHEATED (ERR_PAYMENT_NOT_ESCHEATED)"
          - "an OPEN EscheatmentBatch exists for the payee's address_state_code (ERR_NO_OPEN_ESCHEAT_BATCH)"
          - "linked agreement.status != CLOSED and != COMMUTED (ERR_AGREEMENT_INVALID_STATE)"
        side_effects:
          - "agreement.escheated_total_cents -= amount_cents; agreement.outstanding_liability_cents += amount_cents; agreement.version += 1"
          - "the OPEN batch for that state: reclaimed_count += 1; reclaimed_amount_cents += amount_cents"
          - "escheated_in_batch_id := null; return_reason := null"
      - from: SCHEDULED
        to: TRANSFERRED
        trigger: POST /annuity/transfer-petitions/{petitionId}/effectuate (payment inside the petition window)
        actor: ComplianceOfficer
        preconditions:
          - "petition.status == COURT_APPROVED (ERR_PETITION_INVALID_STATE)"
          - "payment due_date in [petition.transfer_start_date, petition.transfer_end_date] inclusive"
        side_effects:
          - "transferred_by_petition_id := petition.id"
          - "agreement.outstanding_liability_cents -= amount_cents; agreement.transferred_total_cents += amount_cents; agreement.version += 1"
      - from: PAYABLE
        to: TRANSFERRED
        trigger: POST /annuity/transfer-petitions/{petitionId}/effectuate
        actor: ComplianceOfficer
        preconditions:
          - "petition.status == COURT_APPROVED"
          - "payment due_date inside petition window"
        side_effects:
          - "same ledger moves as SCHEDULED -> TRANSFERRED"
      - from: SCHEDULED
        to: COMMUTED
        trigger: POST /annuity/commutation-requests/{commutationId}/pay-out (payment eligible at request creation)
        actor: OperationsSpecialist
        preconditions:
          - "commutation.status == APPROVED (ERR_COMMUTATION_INVALID_STATE)"
        side_effects:
          - "commuted_by_request_id := commutation.id"
          - "agreement.outstanding_liability_cents -= amount_cents; agreement.commuted_nominal_total_cents += amount_cents"
      - from: PAYABLE
        to: COMMUTED
        trigger: POST /annuity/commutation-requests/{commutationId}/pay-out
        actor: OperationsSpecialist
        preconditions:
          - "commutation.status == APPROVED"
        side_effects:
          - "same ledger moves as SCHEDULED -> COMMUTED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system: schedule supersession (cancel_reason = SUPERSEDED) or DeathClaim settle (cancel_reason = DEATH)"
        actor: system
        preconditions: []
        side_effects:
          - "agreement totals recomputed"
      - from: PAYABLE
        to: CANCELLED
        trigger: "system: DeathClaim settle with due_date > policy.certain_period_end_date (cancel_reason = DEATH)"
        actor: system
        preconditions: []
        side_effects:
          - "agreement.outstanding_liability_cents -= amount_cents"

  - entity: ReturnedPaymentCase
    initial_state: OPEN
    terminal_states: [RESOLVED_REISSUE, CLOSED_ESCHEATED]
    transitions:
      - from: OPEN
        to: RESOLVED_REISSUE
        trigger: POST /annuity/returned-payment-cases/{caseId}/authorize-reissue
        actor: OperationsSpecialist
        preconditions:
          - "case.status == OPEN (ERR_CASE_INVALID_STATE)"
          - "linked payment.status == RETURNED (ERR_PAYMENT_NOT_RETURNED)"
          - "SoD: X-User-ID != case.opened_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "case.resolution_note := 'REISSUE_AUTHORIZED'"
          - "cascade: linked ScheduledPayment RETURNED -> PAYABLE"
      - from: OPEN
        to: ESCHEAT_PENDING
        trigger: POST /annuity/returned-payment-cases/{caseId}/escalate-escheat
        actor: ComplianceOfficer
        preconditions:
          - "case.status == OPEN (ERR_CASE_INVALID_STATE)"
          - "dormancy met for the linked payment: clock date > due_date + profile.dormancy_years (ERR_DORMANCY_NOT_MET)"
        side_effects:
          - "cascade: linked ScheduledPayment -> ESCHEATABLE"
      - from: OPEN
        to: CLOSED_ESCHEATED
        trigger: "system (POST /annuity/escheatment-batches/{batchId}/finalize sweeps the linked payment)"
        actor: system
        preconditions: []
        side_effects:
          - "case.resolution_note := 'ESCHEATED'"
      - from: ESCHEAT_PENDING
        to: CLOSED_ESCHEATED
        trigger: "system (batch finalize sweeps the linked payment)"
        actor: system
        preconditions: []
        side_effects:
          - "case.resolution_note := 'ESCHEATED'"

  - entity: GuardianshipCase
    initial_state: PENDING_REVIEW
    terminal_states: [TERMINATED, REVOKED]
    transitions:
      - from: PENDING_REVIEW
        to: ACTIVE
        trigger: POST /annuity/guardianship-cases/{caseId}/activate
        actor: ComplianceOfficer
        preconditions:
          - "case.status == PENDING_REVIEW (ERR_GUARDIANSHIP_INVALID_STATE)"
          - "no other GuardianshipCase for the same payee in {PENDING_REVIEW, ACTIVE} whose [effective_from_date, terminated_at_date or infinity) interval intersects [this.effective_from_date, infinity) — half-open semantics, null end means infinity (ERR_GUARDIANSHIP_OVERLAP)"
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: POST /annuity/guardianship-cases/{caseId}/revoke
        actor: ComplianceOfficer
        preconditions:
          - "case.status == ACTIVE (ERR_GUARDIANSHIP_INVALID_STATE)"
        side_effects:
          - "terminated_at_date := current clock date"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (POST /annuity/_clock/set_current_utc: payee reaches age_of_majority — clock date >= date_of_birth + profile.age_of_majority years)"
        actor: system
        preconditions: []
        side_effects:
          - "terminated_at_date := the majority birthday date"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system (DeathClaim settle for the protected payee)"
        actor: system
        preconditions: []
        side_effects:
          - "terminated_at_date := claim.date_of_death"

  - entity: PayeeChangeRequest
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "system (auto-approve at creation when change_type == ADDRESS AND no ReturnedPaymentCase in OPEN or ESCHEAT_PENDING exists for any ScheduledPayment of this payee)"
        actor: system
        preconditions: []
        side_effects:
          - "payee address fields overwritten with new_* values; payee.version += 1"
          - "if new_address_state_code changes the payee's state: subsequent minority/dormancy evaluations use the new state's profile"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system (default path when auto-approve conditions do not hold: change_type in {NAME, BANK_ACCOUNT}, or an open returned-payment case exists)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: POST /annuity/payee-change-requests/{requestId}/approve
        actor: ComplianceOfficer
        preconditions:
          - "request.status == UNDER_REVIEW (ERR_CHANGE_REQUEST_INVALID_STATE)"
          - "SoD: X-User-ID != request.submitted_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "apply the new_* payload to the Payee (ADDRESS -> address fields; NAME -> full_name; BANK_ACCOUNT recorded on request only); payee.version += 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: POST /annuity/payee-change-requests/{requestId}/reject
        actor: ComplianceOfficer
        preconditions:
          - "request.status == UNDER_REVIEW (ERR_CHANGE_REQUEST_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system (DeathClaim settle for the payee auto-rejects open change requests)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TransferPetition
    initial_state: DRAFT
    terminal_states: [COURT_DENIED, EFFECTIVE, EXPIRED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: POST /annuity/transfer-petitions/{petitionId}/file
        actor: Payee | CaseManager
        preconditions:
          - "petition.status == DRAFT (ERR_PETITION_INVALID_STATE)"
          - "role Payee: X-User-ID must equal petition.payee_id (ERR_FORBIDDEN_ROLE)"
          - "refile bar: no COURT_DENIED petition for the same payee with prejudice == WITH and court_order_date within the prior 365 days (clock date < court_order_date + 365 days => barred) (ERR_REFILE_BARRED_WITH_PREJUDICE)"
          - "window overlap: no other petition for the same agreement in {FILED, DISCLOSURE_SERVED, HEARING_SCHEDULED, COURT_APPROVED, EFFECTIVE} whose matched payment set intersects this petition's matched set (ERR_TRANSFER_WINDOW_OVERLAP)"
          - "if payee.is_minor: an ACTIVE GuardianshipCase must exist (ERR_GUARDIANSHIP_REQUIRED)"
          - "effective_annual_rate_bps <= profile.sspa_max_discount_rate_bps of petition.state_code (ERR_EFFECTIVE_RATE_EXCEEDS_CAP)"
          - "purchase_price_cents <= present_value_cents (ERR_PRICE_EXCEEDS_PRESENT_VALUE)"
        side_effects:
          - "filed_at := current clock date; filed_by_user_id := X-User-ID; state_code := payee.address_state_code"
      - from: FILED
        to: DISCLOSURE_SERVED
        trigger: POST /annuity/transfer-petitions/{petitionId}/serve-disclosure
        actor: CaseManager
        preconditions:
          - "petition.status == FILED (ERR_PETITION_INVALID_STATE)"
        side_effects:
          - "disclosure_served_at := current clock date"
      - from: DISCLOSURE_SERVED
        to: HEARING_SCHEDULED
        trigger: POST /annuity/transfer-petitions/{petitionId}/schedule-hearing
        actor: CaseManager
        preconditions:
          - "petition.status == DISCLOSURE_SERVED (ERR_PETITION_INVALID_STATE)"
          - "cooling-off: clock date >= disclosure_served_at + profile.disclosure_cooling_off_days (ERR_COOLING_OFF_NOT_ELAPSED)"
          - "if profile.ipa_required: input ipa_completed_at must be present (ERR_IPA_REQUIRED)"
        side_effects:
          - "hearing_date := input hearing_date; ipa_completed_at := input ipa_completed_at (when provided)"
      - from: HEARING_SCHEDULED
        to: COURT_APPROVED
        trigger: POST /annuity/transfer-petitions/{petitionId}/record-court-order with outcome APPROVED or APPROVED_MODIFIED
        actor: JudicialRecorder
        preconditions:
          - "petition.status == HEARING_SCHEDULED (ERR_PETITION_INVALID_STATE)"
          - "SoD: X-User-ID != petition.filed_by_user_id (ERR_SOD_VIOLATION)"
          - "outcome == APPROVED_MODIFIED requires approved_price_cents present and < purchase_price_cents (ERR_INVALID_REQUEST)"
        side_effects:
          - "court_outcome, court_order_date, prejudice := inputs; order_recorded_by_user_id := X-User-ID"
          - "approved_price_cents := input (modified) or purchase_price_cents"
      - from: HEARING_SCHEDULED
        to: COURT_DENIED
        trigger: POST /annuity/transfer-petitions/{petitionId}/record-court-order with outcome DENIED
        actor: JudicialRecorder
        preconditions:
          - "petition.status == HEARING_SCHEDULED (ERR_PETITION_INVALID_STATE)"
          - "SoD: X-User-ID != petition.filed_by_user_id (ERR_SOD_VIOLATION)"
          - "outcome == DENIED requires prejudice present (ERR_INVALID_REQUEST)"
        side_effects:
          - "court_outcome := DENIED; prejudice := input; order_recorded_by_user_id := X-User-ID"
      - from: COURT_APPROVED
        to: EFFECTIVE
        trigger: POST /annuity/transfer-petitions/{petitionId}/effectuate
        actor: ComplianceOfficer
        preconditions:
          - "petition.status == COURT_APPROVED (ERR_PETITION_INVALID_STATE)"
        side_effects:
          - "cascade link 2: every payment of the agreement's ACTIVE schedule in {SCHEDULED, PAYABLE} with due_date in [transfer_start_date, transfer_end_date] inclusive -> TRANSFERRED (transferred_by_petition_id set); if the re-matched set is empty -> ERR_NO_TRANSFERRABLE_PAYMENTS"
          - "cascade link 3: exhaustion check -> AnnuityPolicy EXHAUSTED when no non-terminal payments remain"
          - "cascade link 4: agreement ACTIVE -> CLOSED immediately after policy EXHAUSTED"
      - from: COURT_APPROVED
        to: EXPIRED
        trigger: "system (POST /annuity/_clock/set_current_utc: clock date > court_order_date + 60 days without effectuation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FILED
        to: WITHDRAWN
        trigger: POST /annuity/transfer-petitions/{petitionId}/withdraw
        actor: Payee | CaseManager
        preconditions:
          - "petition.status in {FILED, DISCLOSURE_SERVED, HEARING_SCHEDULED} (ERR_PETITION_INVALID_STATE)"
          - "role Payee: X-User-ID must equal petition.payee_id (ERR_FORBIDDEN_ROLE)"
        side_effects: []
      - from: DISCLOSURE_SERVED
        to: WITHDRAWN
        trigger: POST /annuity/transfer-petitions/{petitionId}/withdraw
        actor: Payee | CaseManager
        preconditions:
          - "petition.status in {FILED, DISCLOSURE_SERVED, HEARING_SCHEDULED} (ERR_PETITION_INVALID_STATE)"
        side_effects: []
      - from: HEARING_SCHEDULED
        to: WITHDRAWN
        trigger: POST /annuity/transfer-petitions/{petitionId}/withdraw
        actor: Payee | CaseManager
        preconditions:
          - "petition.status in {FILED, DISCLOSURE_SERVED, HEARING_SCHEDULED} (ERR_PETITION_INVALID_STATE)"
        side_effects: []
      - from: FILED
        to: WITHDRAWN
        trigger: "system (DeathClaim settle for the petitioning payee auto-withdraws open petitions)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DeathClaim
    initial_state: REPORTED
    terminal_states: [SETTLED, DENIED]
    transitions:
      - from: REPORTED
        to: SETTLED
        trigger: POST /annuity/death-claims/{claimId}/settle
        actor: ComplianceOfficer
        preconditions:
          - "claim.status == REPORTED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "cascade link 1a: payee.status ACTIVE -> DECEASED; payee.deceased_date := claim.date_of_death; payee.version += 1"
          - "cascade link 1b: payee's ACTIVE GuardianshipCase (if any) -> TERMINATED"
          - "cascade link 1c: payee's PayeeChangeRequests in UNDER_REVIEW -> REJECTED"
          - "cascade link 1d: payee's TransferPetitions in {FILED, DISCLOSURE_SERVED, HEARING_SCHEDULED} -> WITHDRAWN"
          - "cascade link 2: the agreement's ScheduledPayments for this payee in {SCHEDULED, PAYABLE} with due_date > policy.certain_period_end_date (or all of them when certain_period_end_date is null) -> CANCELLED with cancel_reason = DEATH; payments due on/before the certain-period end remain for the estate"
          - "cascade link 3: exhaustion check -> AnnuityPolicy EXHAUSTED"
          - "cascade link 4: agreement ACTIVE -> CLOSED after policy EXHAUSTED"
      - from: REPORTED
        to: DENIED
        trigger: POST /annuity/death-claims/{claimId}/deny
        actor: ComplianceOfficer
        preconditions:
          - "claim.status == REPORTED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "denial_reason := input denial_reason"
      - from: DENIED
        to: REPORTED
        trigger: "POST /annuity/death-claims/{claimId}/resubmit (revision loop: new evidence package)"
        actor: CaseManager
        preconditions:
          - "claim.status == DENIED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "denial_reason := null"

  - entity: CommutationRequest
    initial_state: REQUESTED
    terminal_states: [DENIED, PAID_OUT]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: POST /annuity/commutation-requests/{commutationId}/approve
        actor: ComplianceOfficer
        preconditions:
          - "commutation.status == REQUESTED (ERR_COMMUTATION_INVALID_STATE)"
        side_effects: []
      - from: REQUESTED
        to: DENIED
        trigger: POST /annuity/commutation-requests/{commutationId}/deny
        actor: ComplianceOfficer
        preconditions:
          - "commutation.status == REQUESTED (ERR_COMMUTATION_INVALID_STATE)"
        side_effects: []
      - from: APPROVED
        to: PAID_OUT
        trigger: POST /annuity/commutation-requests/{commutationId}/pay-out
        actor: OperationsSpecialist
        preconditions:
          - "commutation.status == APPROVED (ERR_COMMUTATION_INVALID_STATE)"
        side_effects:
          - "cascade link 2: covered ScheduledPayments (eligible set frozen at creation) -> COMMUTED"
          - "cascade link 3: policy IN_FORCE|PARTIALLY_COMMUTED -> PARTIALLY_COMMUTED when non-terminal payments remain, else -> FULLY_COMMUTED; policy.version += 1"
          - "cascade link 4: FULLY_COMMUTED triggers agreement ACTIVE -> COMMUTED; EXHAUSTED-style close does not apply"
          - "policy.version += 1 also at request creation (OCC anchor for commutation-create-stale-policy)"

  - entity: EscheatmentBatch
    initial_state: OPEN
    terminal_states: [FINALIZED]
    transitions:
      - from: OPEN
        to: FINALIZED
        trigger: POST /annuity/escheatment-batches/{batchId}/finalize
        actor: ComplianceOfficer
        preconditions:
          - "batch.status == OPEN (ERR_BATCH_INVALID_STATE)"
          - "SoD: X-User-ID != batch.opened_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "sweep: every ScheduledPayment in ESCHEATABLE whose payee address_state_code == batch.state_code -> ESCHEATED (escheated_in_batch_id := batch.id)"
          - "swept_count / swept_amount_cents := count and sum of swept payments (0 and 0 for an empty sweep — finalizing an empty batch is allowed)"
          - "cascade: swept payments' OPEN/ESCHEAT_PENDING ReturnedPaymentCases -> CLOSED_ESCHEATED"
          - "cascade: per swept payment, agreement ledger move outstanding -> escheated; exhaustion check -> policy EXHAUSTED -> agreement CLOSED"

# =============================================================================
# 1.2.1 Concurrency Rules (true OCC races only — see SKILL.md filter)
# =============================================================================
concurrency_rules:
  - rule_id: schedule-activate-stale-agreement
    parent_entity: SettlementAgreement
    write_endpoint: "POST /annuity/payment-schedules/{scheduleId}/activate"
    occ_field: expected_settlement_agreement_version
    description: |
      Activating a PaymentSchedule supersedes whichever schedule is currently
      ACTIVE for the agreement and rewires the agreement's payment population.
      A client that read the agreement before another activation landed holds a
      stale view: its expected_settlement_agreement_version no longer matches
      agreement.version, so the activation is rejected. Both activations are
      individually legitimate under the product semantics (re-scheduling is
      allowed); the OCC check forces the second client to re-read and re-issue.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

  - rule_id: commutation-create-stale-policy
    parent_entity: AnnuityPolicy
    write_endpoint: "POST /annuity/commutation-requests"
    occ_field: expected_annuity_policy_version
    description: |
      Partial commutations are repeatable: each commutation request mutates the
      policy (status may move IN_FORCE -> PARTIALLY_COMMUTED and the remaining
      payment population shrinks), advancing policy.version. A client creating
      a commutation request against a policy version it read earlier is working
      from a stale reserve/payment picture, so the creation is rejected and the
      client must re-read the policy.
    error_id: ERR_STALE_POLICY_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: escalated_payment_amount
    trigger: "ScheduledPayment creation"
    algorithm: compounding_with_pinned_rounding
    formula: |
      n = count of anniversaries of schedule.escalation_anchor_date that are
          <= payment.due_date (an anniversary falling exactly on due_date counts)
      VARIANT carry_rounded (produces amount_cents, the payable amount):
        A_0 = base_amount_cents
        A_k = round_half_up(A_{k-1} * (1 + escalation_rate_bps / 10000))  for k = 1..n
        amount_cents = A_n
      VARIANT end_rounded (produces disclosure_amount_cents):
        disclosure_amount_cents = round_half_up(base_amount_cents * (1 + escalation_rate_bps / 10000)^n)
      The two variants diverge for n >= 2 whenever intermediate rounding loses
      fractional cents. amount_cents (carry_rounded) is the ONLY payable amount.
    input_set: "the payment being created; schedule.escalation_anchor_date"
    precision: "integer cents, round_half_up per pinned step"
    variants:
      - name: carry_rounded
        when: "payable amount_cents"
        difference: "rounds after every annual step and carries the rounded value into the next step"
      - name: end_rounded
        when: "disclosure_amount_cents shown on statements/disclosures"
        difference: "compounds unrounded and rounds once at the end; equal to carry_rounded for n <= 1"

  - name: transfer_discount_rates
    trigger: "TransferPetition creation (valuation date = creation clock date)"
    algorithm: dual_method_rate_solve
    formula: |
      Let the matched payment set M = payments of the agreement's ACTIVE schedule
      in {SCHEDULED, PAYABLE} with due_date in [transfer_start_date, transfer_end_date]
      inclusive (both dates inclusive). If M is empty: creation fails (ERR_NO_TRANSFERRABLE_PAYMENTS).
      t_i = (due_date_i - valuation_date).days / 365.0   (ACT/365, exact)
      nominal = sum(amount_cents_i)
      wavg_years = sum(amount_cents_i * t_i) / nominal
      VARIANT aggregate (disclosed_discount_rate_bps):
        disclosed_discount_rate_bps = round_half_up(10000 * (nominal - purchase_price_cents) / nominal / wavg_years)
      VARIANT irr (effective_annual_rate_bps):
        r = the positive real solving purchase_price_cents = sum(amount_cents_i / (1+r)^t_i)
        effective_annual_rate_bps = round_half_up(10000 * r)
      The statutory cap (profile.sspa_max_discount_rate_bps) applies to the IRR
      variant ONLY. The two variants disagree on any multi-payment set.
    input_set: "matched payment set M; purchase_price_cents; valuation clock date"
    precision: "integer basis points, round_half_up"
    variants:
      - name: aggregate
        when: "consumer disclosure figure"
        difference: "simple annualized discount; NOT the capped figure"
      - name: irr
        when: "statutory SSPA cap enforcement at /file"
        difference: "actuarial rate solving PV equality; strictly greater than aggregate for discounted multi-payment sets"

  - name: transferred_payment_set_pv
    trigger: "TransferPetition creation"
    algorithm: per_payment_discount_then_sum
    formula: |
      rate = policy.contract_discount_rate_bps / 10000  (the policy's own pricing basis)
      For each payment i in the matched set M (same set as transfer_discount_rates):
        pv_i = round_half_up(amount_cents_i / (1 + rate)^(t_i))
      present_value_cents = sum(pv_i)
      ROUNDING ORDER IS PINNED: each pv_i is rounded to integer cents FIRST,
      then summed. Summing unrounded values and rounding once at the end can
      differ by one or more cents and is NOT the contract.
    input_set: "matched payment set M; policy.contract_discount_rate_bps"
    precision: "integer cents, round_half_up per payment, then sum"

  - name: commuted_value
    trigger: "CommutationRequest creation (effective date = creation clock date)"
    algorithm: multi_input_conditional_discount
    formula: |
      Eligible set E = payments on the agreement's ACTIVE schedule in
      {SCHEDULED, PAYABLE} with due_date STRICTLY AFTER the creation clock date.
      If E is empty: creation fails (ERR_NO_COMMUTABLE_PAYMENTS).
      rate_bps = min(policy.contract_discount_rate_bps,
                     profile.sspa_max_discount_rate_bps of payee.address_state_code)
      t_i = (due_date_i - effective date).days / 365.0
      pv_total = sum over E of round_half_up(amount_cents_i / (1 + rate_bps/10000)^(t_i))
        (per-payment rounding first, then sum — same pinned order as transferred_payment_set_pv)
      fee_cents = (reason == HARDSHIP) ? min(round_half_up(0.03 * pv_total), 25000) : 0
      commuted_value_cents = pv_total - fee_cents
      covered_payment_count = |E|
      Non-linear inputs: the min() of two rate sources, the reason branch, and
      the min() fee cap interact; changing any one changes the result.
    input_set: "eligible payment set E; policy.contract_discount_rate_bps; payee residence profile cap; reason"
    constants:
      HARDSHIP_FEE_PCT: 0.03
      HARDSHIP_FEE_CAP_CENTS: 25000
    precision: "integer cents, round_half_up per payment, then sum; fee round_half_up then capped"

  - name: minority_status
    trigger: "evaluated at payment issue, petition file, and on every clock-set (for guardianship auto-termination)"
    algorithm: threshold
    formula: |
      profile = StateStatuteProfile keyed by payee.address_state_code
      age = years between payee.date_of_birth and current clock date,
            subtracting 1 when the birthday has not yet occurred this calendar year
      is_minor = (age < profile.age_of_majority)
      Boundary: on the exact age_of_majority birthday, age == threshold and
      is_minor flips to false (strict <).
    input_set: "payee.date_of_birth; clock date; profile.age_of_majority"
    precision: "whole years; date-granular"

  - name: dormancy_escheat_eligibility
    trigger: "POST /annuity/_clock/set_current_utc and POST /annuity/returned-payment-cases/{caseId}/escalate-escheat"
    algorithm: threshold
    formula: |
      profile = StateStatuteProfile keyed by the payment's payee address_state_code
      dormancy_anniversary = due_date + profile.dormancy_years years
      eligible_status = payment.status in {ISSUED, STALE_DATED, RETURNED}
      payment -> ESCHEATABLE when eligible_status AND clock date > dormancy_anniversary
      Boundary: exactly ON the dormancy anniversary the payment is NOT yet
      escheatable (strictly-greater comparison); it becomes escheatable the next day.
    input_set: "payments in {ISSUED, STALE_DATED, RETURNED}; profile.dormancy_years; clock date"
    precision: "date-granular, strict >"

  - name: stale_check_expiry
    trigger: "POST /annuity/_clock/set_current_utc"
    algorithm: threshold
    formula: |
      payment ISSUED with last_issue_method == CHECK transitions to STALE_DATED when
      (clock date - last_issued_at) > 180 days (strictly greater: exactly 180 days
      remains ISSUED). EFT issuances never stale.
    input_set: "ISSUED payments with last_issue_method == CHECK"
    constants:
      STALE_CHECK_DAYS: 180
    precision: "whole days, strict >"

  - name: agreement_outstanding_liability
    trigger: "every ScheduledPayment status transition and schedule activation"
    algorithm: aggregation
    formula: |
      outstanding_liability_cents = sum(amount_cents) over payments on the
      agreement's ACTIVE schedule whose status is in
      {SCHEDULED, PAYABLE, ISSUED, RETURNED, STALE_DATED, ESCHEATABLE}
      Terminal statuses (CLEARED, ESCHEATED, TRANSFERRED, COMMUTED, CANCELLED)
      and any status on a SUPERSEDED/TERMINATED schedule contribute 0.
      Note TRANSFERRED payments leave the outstanding set at effectuation: the
      issuer's obligation to the original payee ends (the factor is paid outside
      this ledger); transferred_total_cents accumulates their nominal amount.
    input_set: "payments of the ACTIVE schedule filtered by status"
    precision: "integer cents"

  - name: escheat_sweep_totals
    trigger: "EscheatmentBatch finalize"
    algorithm: aggregation
    formula: |
      sweep set S = payments in ESCHEATABLE whose payee's address_state_code == batch.state_code
      swept_count = |S|              (0 allowed: empty finalize succeeds)
      swept_amount_cents = sum(amount_cents over S)
      Reclaims while the batch is OPEN increment reclaimed_count /
      reclaimed_amount_cents independently of the sweep totals.
    input_set: "ESCHEATABLE payments filtered by payee residence state"
    precision: "integer cents and count"

  - name: clock_set_system_sweep
    trigger: "POST /annuity/_clock/set_current_utc"
    algorithm: chronological
    formula: |
      On every clock-set, system transitions fire in this exact order:
      1. GuardianshipCase auto-termination (ACTIVE and clock date >= payee majority birthday)
      2. SCHEDULED -> PAYABLE (schedule ACTIVE, agreement in {FUNDED, ACTIVE}, due_date <= clock date)
      3. agreement FUNDED -> ACTIVE (when step 2 produced the first PAYABLE payment)
      4. ISSUED + CHECK + age > 180 days -> STALE_DATED
      5. {ISSUED, STALE_DATED, RETURNED} past dormancy -> ESCHEATABLE
      6. TransferPetition COURT_APPROVED with clock date > court_order_date + 60 days -> EXPIRED
      Ordering matters: a payment can move ISSUED -> STALE_DATED -> ESCHEATABLE
      within a single clock-set; a petition expiring in step 6 does not retroactively
      affect step 2.
    input_set: "all entities gated by the logical clock"
    precision: "date-granular"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The caller's role must be authorized for this endpoint; for Payee-role self-service endpoints, X-User-ID must equal the target payee id"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path ids must exist, validated left-to-right; body-referenced ids (payee_id, settlement_agreement_id, etc.) must exist; state codes referencing StateStatuteProfile must resolve"
    error_id: "ERR_NOT_FOUND / ERR_STATE_PROFILE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints"

  - priority: 3.5
    category: state
    check: "OCC: expected_settlement_agreement_version == agreement.version on schedule activate; expected_annuity_policy_version == policy.version on commutation create"
    error_id: "ERR_STALE_AGREEMENT_VERSION / ERR_STALE_POLICY_VERSION"
    http_status: 412
    applies_to: "POST /annuity/payment-schedules/{id}/activate; POST /annuity/commutation-requests"
    note: "Checked after existence, before all state/business validation"

  - priority: 4
    category: state
    check: "Target entity must be in the required state for the transition (per-machine ERR_*_INVALID_STATE / ERR_PAYMENT_NOT_PAYABLE / ERR_PAYMENT_NOT_ISSUED / ERR_PAYMENT_NOT_RETURNED / ERR_PAYMENT_NOT_ESCHEATED)"
    error_id: "ERR_AGREEMENT_INVALID_STATE | ERR_ASSIGNMENT_INVALID_STATE | ERR_POLICY_INVALID_STATE | ERR_SCHEDULE_INVALID_STATE | ERR_PAYMENT_NOT_PAYABLE | ERR_PAYMENT_NOT_ISSUED | ERR_PAYMENT_NOT_RETURNED | ERR_PAYMENT_NOT_ESCHEATED | ERR_CASE_INVALID_STATE | ERR_CHANGE_REQUEST_INVALID_STATE | ERR_PETITION_INVALID_STATE | ERR_CLAIM_INVALID_STATE | ERR_COMMUTATION_INVALID_STATE | ERR_BATCH_INVALID_STATE | ERR_GUARDIANSHIP_INVALID_STATE"
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 5
    category: business_safety
    check: "Guardianship: issuing to a minor payee requires an ACTIVE GuardianshipCase; filing a transfer petition for a minor payee requires an ACTIVE GuardianshipCase"
    error_id: ERR_GUARDIANSHIP_REQUIRED
    http_status: 403
    applies_to: "POST /annuity/scheduled-payments/{id}/issue; POST /annuity/transfer-petitions/{id}/file"

  - priority: 6
    category: business_safety
    check: "Commutation legality: policy rider must allow the requested reason (DEATH requires DEATH_ONLY or DEATH_AND_HARDSHIP; HARDSHIP requires DEATH_AND_HARDSHIP) AND the payee-residence state profile must have commutation_permitted"
    error_id: ERR_COMMUTATION_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /annuity/commutation-requests"

  - priority: 7
    category: business_safety
    check: "Segregation of duties: reissue authorizer != case opener; batch finalizer != batch opener; court-order recorder != petition filer; change-request approver != submitter"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "authorize-reissue; finalize; record-court-order; change-request approve"

  - priority: 8
    category: business_safety
    check: "SSPA rate cap: effective_annual_rate_bps (IRR method) must be <= the governing profile's sspa_max_discount_rate_bps"
    error_id: ERR_EFFECTIVE_RATE_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /annuity/transfer-petitions/{id}/file"

  - priority: 9
    category: business_temporal
    check: "Cooling-off: clock date >= disclosure_served_at + disclosure_cooling_off_days before hearing scheduling"
    error_id: ERR_COOLING_OFF_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /annuity/transfer-petitions/{id}/schedule-hearing"

  - priority: 10
    category: business_temporal
    check: "IPA: when the governing profile has ipa_required, ipa_completed_at must be supplied at hearing scheduling"
    error_id: ERR_IPA_REQUIRED
    http_status: 409
    applies_to: "POST /annuity/transfer-petitions/{id}/schedule-hearing"

  - priority: 11
    category: business_temporal
    check: "Refile bar: a COURT_DENIED petition with prejudice WITH bars any new filing for the same payee until clock date >= court_order_date + 365 days"
    error_id: ERR_REFILE_BARRED_WITH_PREJUDICE
    http_status: 409
    applies_to: "POST /annuity/transfer-petitions/{id}/file"

  - priority: 12
    category: business_temporal
    check: "Dormancy: manual escheat escalation requires clock date > due_date + dormancy_years"
    error_id: ERR_DORMANCY_NOT_MET
    http_status: 409
    applies_to: "POST /annuity/returned-payment-cases/{id}/escalate-escheat"

  - priority: 13
    category: business_constraint
    check: "Transfer window overlap: matched payment sets of non-terminal petitions ({FILED, DISCLOSURE_SERVED, HEARING_SCHEDULED, COURT_APPROVED, EFFECTIVE}) on the same agreement must be disjoint"
    error_id: ERR_TRANSFER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /annuity/transfer-petitions/{id}/file"

  - priority: 14
    category: business_constraint
    check: "Guardianship overlap: half-open intervals [effective_from_date, terminated_at_date or infinity) of PENDING_REVIEW/ACTIVE cases for the same payee must be disjoint (at create and at activate)"
    error_id: ERR_GUARDIANSHIP_OVERLAP
    http_status: 409
    applies_to: "POST /annuity/guardianship-cases; POST /annuity/guardianship-cases/{id}/activate"

  - priority: 15
    category: business_constraint
    check: "Uniqueness: agreement case_number unique; StateStatuteProfile.state_code unique; at most one OPEN EscheatmentBatch per state_code"
    error_id: "ERR_DUPLICATE_CASE_NUMBER / ERR_DUPLICATE_STATE_PROFILE / ERR_OPEN_BATCH_EXISTS"
    http_status: 409
    applies_to: "POST /annuity/settlement-agreements; POST /annuity/state-statute-profiles; POST /annuity/escheatment-batches"

  - priority: 16
    category: business_constraint
    check: "Non-empty selection: petition matched payment set and commutation eligible payment set must be non-empty"
    error_id: "ERR_NO_TRANSFERRABLE_PAYMENTS / ERR_NO_COMMUTABLE_PAYMENTS"
    http_status: 409
    applies_to: "POST /annuity/transfer-petitions; POST /annuity/commutation-requests"

  - priority: 17
    category: business_constraint
    check: "Escheat reclaim requires an OPEN batch for the payment's escheat state"
    error_id: ERR_NO_OPEN_ESCHEAT_BATCH
    http_status: 409
    applies_to: "POST /annuity/scheduled-payments/{id}/reclaim-escheat"

  - priority: 18
    category: business_referential
    check: "Cross-entity state: assignment creation requires agreement EXECUTED; policy creation requires agreement ASSIGNED and assignment EXECUTED; mark-in-force requires agreement ASSIGNED; schedule activation requires agreement FUNDED|ACTIVE; DEATH commutation requires death_claim_id referencing a SETTLED claim for the same agreement"
    error_id: "ERR_AGREEMENT_INVALID_STATE / ERR_ASSIGNMENT_INVALID_STATE / ERR_CLAIM_INVALID_STATE"
    http_status: 409
    applies_to: "qualified-assignments create; annuity-policies create; mark-in-force; schedule activate; commutation-requests create"

  - priority: 19
    category: business_fiscal
    check: "Price sanity: purchase_price_cents must be > 0 and <= present_value_cents (PV of the matched set at the policy contract rate)"
    error_id: ERR_PRICE_EXCEEDS_PRESENT_VALUE
    http_status: 422
    applies_to: "POST /annuity/transfer-petitions/{id}/file"

  - priority: 20
    category: business_constraint
    check: "Input shape: required fields present, enum members valid, date strings YYYY-MM-DD, positive integer cents fields, due_date >= schedule effective_from_date, transfer_end_date >= transfer_start_date, unknown payload fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
    note: "Field-shape checks run AFTER existence/state/business guards so that a request failing a domain rule surfaces the domain error"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/annuity/_clock/set_current_utc"
    description: "Set the logical clock. The server default before any call is exactly 2026-08-01T00:00:00Z; the clock never falls back to wall-clock time. Fires the clock_set_system_sweep transitions in pinned order (guardianship auto-termination; SCHEDULED->PAYABLE; FUNDED->ACTIVE; CHECK stale at >180 days; dormancy -> ESCHEATABLE; COURT_APPROVED petition expiry at >60 days)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string, transitions_fired: integer }
    side_effects: ["clock_set_system_sweep (6 ordered steps)"]

  # --- StateStatuteProfile ---
  - method: POST
    path: "/annuity/state-statute-profiles"
    description: "Create a per-state statutory profile (SSPA cap, majority age, dormancy, etc.)"
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, age_of_majority, sspa_max_discount_rate_bps, disclosure_cooling_off_days, ipa_required, dormancy_years, commutation_permitted]
    output: StateStatuteProfile
    side_effects: []
  - method: GET
    path: "/annuity/state-statute-profiles"
    description: "List statute profiles"
    roles: [Any]
    code: 200
    input: ["state_code?"]
    output: "StateStatuteProfile[]"
    side_effects: []
  - method: GET
    path: "/annuity/state-statute-profiles/{profileId}"
    description: "Get one statute profile"
    roles: [Any]
    code: 200
    input: []
    output: StateStatuteProfile
    side_effects: []

  # --- Payee ---
  - method: POST
    path: "/annuity/payees"
    description: "Register a payee (injured party)"
    roles: [CaseManager]
    code: 201
    input: [full_name, date_of_birth, tax_id, address_line1, address_city, address_state_code, address_postal_code, "phone?", "email?"]
    output: Payee
    side_effects: ["status = ACTIVE; is_minor computed against current clock and profile"]
  - method: GET
    path: "/annuity/payees"
    description: "List payees"
    roles: [Any]
    code: 200
    input: ["status?", "address_state_code?"]
    output: "Payee[]"
    side_effects: []
  - method: GET
    path: "/annuity/payees/{payeeId}"
    description: "Get one payee (recomputed is_minor at current clock)"
    roles: [Any]
    code: 200
    input: []
    output: Payee
    side_effects: []

  # --- GuardianshipCase ---
  - method: POST
    path: "/annuity/guardianship-cases"
    description: "Open a guardianship case for a payee (overlap-checked, half-open intervals)"
    roles: [CaseManager]
    code: 201
    input: [payee_id, court_state_code, guardian_full_name, effective_from_date]
    output: GuardianshipCase
    side_effects: ["status = PENDING_REVIEW"]
  - method: GET
    path: "/annuity/guardianship-cases"
    description: "List guardianship cases"
    roles: [Any]
    code: 200
    input: ["payee_id?", "status?"]
    output: "GuardianshipCase[]"
    side_effects: []
  - method: GET
    path: "/annuity/guardianship-cases/{caseId}"
    description: "Get one guardianship case"
    roles: [Any]
    code: 200
    input: []
    output: GuardianshipCase
    side_effects: []
  - method: POST
    path: "/annuity/guardianship-cases/{caseId}/activate"
    description: "Activate a pending guardianship case (court order reviewed)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: GuardianshipCase
    side_effects: ["PENDING_REVIEW -> ACTIVE (overlap re-checked)"]
  - method: POST
    path: "/annuity/guardianship-cases/{caseId}/revoke"
    description: "Revoke an active guardianship (sets terminated_at_date = clock date)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: GuardianshipCase
    side_effects: ["ACTIVE -> REVOKED; terminated_at_date := clock date"]

  # --- SettlementAgreement ---
  - method: POST
    path: "/annuity/settlement-agreements"
    description: "Create a structured settlement agreement (DRAFT)"
    roles: [CaseManager]
    code: 201
    input: [case_number, court_state_code, obligor_name, injury_type, primary_payee_id, agreement_date]
    output: SettlementAgreement
    side_effects: ["status = DRAFT; all ledger totals = 0"]
  - method: GET
    path: "/annuity/settlement-agreements"
    description: "List settlement agreements"
    roles: [Any]
    code: 200
    input: ["status?", "court_state_code?", "primary_payee_id?"]
    output: "SettlementAgreement[]"
    side_effects: []
  - method: GET
    path: "/annuity/settlement-agreements/{agreementId}"
    description: "Get one agreement (ledger totals, version)"
    roles: [Any]
    code: 200
    input: []
    output: SettlementAgreement
    side_effects: []
  - method: POST
    path: "/annuity/settlement-agreements/{agreementId}/execute"
    description: "Execute a DRAFT agreement"
    roles: [CaseManager]
    code: 200
    input: []
    output: SettlementAgreement
    side_effects: ["DRAFT -> EXECUTED; agreement.version += 1"]

  # --- QualifiedAssignment ---
  - method: POST
    path: "/annuity/qualified-assignments"
    description: "Create and execute an IRC 130 qualified assignment (agreement EXECUTED -> ASSIGNED)"
    roles: [CaseManager]
    code: 201
    input: [settlement_agreement_id, assignment_company_name, executed_date]
    output: QualifiedAssignment
    side_effects: ["assignment status = EXECUTED; linked agreement EXECUTED -> ASSIGNED; agreement.version += 1"]
  - method: GET
    path: "/annuity/qualified-assignments"
    description: "List qualified assignments"
    roles: [Any]
    code: 200
    input: ["settlement_agreement_id?", "status?"]
    output: "QualifiedAssignment[]"
    side_effects: []
  - method: GET
    path: "/annuity/qualified-assignments/{assignmentId}"
    description: "Get one qualified assignment"
    roles: [Any]
    code: 200
    input: []
    output: QualifiedAssignment
    side_effects: []
  - method: POST
    path: "/annuity/qualified-assignments/{assignmentId}/release"
    description: "Release the obligor (novation) once the annuity is in force"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: QualifiedAssignment
    side_effects: ["EXECUTED -> RELEASED (requires linked policy IN_FORCE | PARTIALLY_COMMUTED)"]

  # --- AnnuityPolicy ---
  - method: POST
    path: "/annuity/annuity-policies"
    description: "Record annuity purchase by the QAC (PENDING_ISSUE)"
    roles: [CaseManager]
    code: 201
    input: [settlement_agreement_id, qualified_assignment_id, policy_number, insurer_name, premium_cents, contract_discount_rate_bps, commutation_rider, "certain_period_end_date?"]
    output: AnnuityPolicy
    side_effects: ["status = PENDING_ISSUE; requires agreement ASSIGNED"]
  - method: GET
    path: "/annuity/annuity-policies"
    description: "List annuity policies"
    roles: [Any]
    code: 200
    input: ["settlement_agreement_id?", "qualified_assignment_id?", "status?"]
    output: "AnnuityPolicy[]"
    side_effects: []
  - method: GET
    path: "/annuity/annuity-policies/{policyId}"
    description: "Get one annuity policy"
    roles: [Any]
    code: 200
    input: []
    output: AnnuityPolicy
    side_effects: []
  - method: POST
    path: "/annuity/annuity-policies/{policyId}/mark-in-force"
    description: "Mark policy in force (cascades agreement ASSIGNED -> FUNDED)"
    roles: [CaseManager]
    code: 200
    input: [in_force_date]
    output: AnnuityPolicy
    side_effects: ["PENDING_ISSUE -> IN_FORCE; agreement ASSIGNED -> FUNDED; agreement.version += 1"]

  # --- PaymentSchedule ---
  - method: POST
    path: "/annuity/payment-schedules"
    description: "Create a DRAFT payment schedule for an agreement"
    roles: [CaseManager]
    code: 201
    input: [settlement_agreement_id, effective_from_date, escalation_anchor_date]
    output: PaymentSchedule
    side_effects: ["status = DRAFT; requires agreement not in {DRAFT, CLOSED, COMMUTED}"]
  - method: GET
    path: "/annuity/payment-schedules"
    description: "List payment schedules"
    roles: [Any]
    code: 200
    input: ["settlement_agreement_id?", "status?", "supersedes_schedule_id?"]
    output: "PaymentSchedule[]"
    side_effects: []
  - method: GET
    path: "/annuity/payment-schedules/{scheduleId}"
    description: "Get one payment schedule"
    roles: [Any]
    code: 200
    input: []
    output: PaymentSchedule
    side_effects: []
  - method: POST
    path: "/annuity/payment-schedules/{scheduleId}/activate"
    description: "Activate a DRAFT schedule; supersedes the current ACTIVE schedule (OCC on agreement version)"
    roles: [CaseManager]
    code: 200
    input: [expected_settlement_agreement_version]
    output: PaymentSchedule
    side_effects: ["DRAFT -> ACTIVE; prior ACTIVE -> SUPERSEDED with its {SCHEDULED, PAYABLE} payments CANCELLED (SUPERSEDED); agreement totals recomputed; increments SettlementAgreement.version by 1"]

  # --- ScheduledPayment ---
  - method: POST
    path: "/annuity/scheduled-payments"
    description: "Add a payment row to a DRAFT schedule; computes amount_cents (carry-rounded) and disclosure_amount_cents (end-rounded)"
    roles: [CaseManager]
    code: 201
    input: [payment_schedule_id, payee_id, payment_seq_no, due_date, base_amount_cents, "escalation_rate_bps?", "payment_type?"]
    output: ScheduledPayment
    side_effects: ["escalated_payment_amount computed; status = SCHEDULED"]
  - method: GET
    path: "/annuity/scheduled-payments"
    description: "List payments (multi-FK filtered list)"
    roles: [Any]
    code: 200
    input: ["payment_schedule_id?", "payee_id?", "status?", "escheated_in_batch_id?", "transferred_by_petition_id?", "commuted_by_request_id?"]
    output: "ScheduledPayment[]"
    side_effects: []
  - method: GET
    path: "/annuity/scheduled-payments/{paymentId}"
    description: "Get one payment"
    roles: [Any]
    code: 200
    input: []
    output: ScheduledPayment
    side_effects: []
  - method: POST
    path: "/annuity/scheduled-payments/{paymentId}/issue"
    description: "Issue a PAYABLE payment by CHECK or EFT (guardianship-gated for minors)"
    roles: [OperationsSpecialist]
    code: 200
    input: [method]
    output: ScheduledPayment
    side_effects: ["PAYABLE -> ISSUED; issue_count += 1; payee_name_on_check resolved"]
  - method: POST
    path: "/annuity/scheduled-payments/{paymentId}/mark-cleared"
    description: "Mark an ISSUED payment cleared (funds honored)"
    roles: [OperationsSpecialist]
    code: 200
    input: []
    output: ScheduledPayment
    side_effects: ["ISSUED -> CLEARED; paid_total_cents += amount; outstanding -= amount; exhaustion check"]
  - method: POST
    path: "/annuity/scheduled-payments/{paymentId}/report-returned"
    description: "Report an ISSUED payment returned/rejected; auto-opens a ReturnedPaymentCase (OPEN) with opened_by_user_id = caller"
    roles: [OperationsSpecialist]
    code: 200
    input: [return_reason]
    output: ScheduledPayment
    side_effects: ["ISSUED -> RETURNED; creates ReturnedPaymentCase OPEN"]
  - method: POST
    path: "/annuity/scheduled-payments/{paymentId}/reclaim-escheat"
    description: "Reclaim an ESCHEATED payment (owner proven); requires an OPEN batch for the escheat state"
    roles: [OperationsSpecialist]
    code: 200
    input: []
    output: ScheduledPayment
    side_effects: ["ESCHEATED -> PAYABLE; escheated_total -= amount; outstanding += amount; OPEN batch reclaimed counters += "]

  # --- ReturnedPaymentCase ---
  - method: GET
    path: "/annuity/returned-payment-cases"
    description: "List returned-payment investigations"
    roles: [Any]
    code: 200
    input: ["scheduled_payment_id?", "status?"]
    output: "ReturnedPaymentCase[]"
    side_effects: []
  - method: GET
    path: "/annuity/returned-payment-cases/{caseId}"
    description: "Get one returned-payment case"
    roles: [Any]
    code: 200
    input: []
    output: ReturnedPaymentCase
    side_effects: []
  - method: POST
    path: "/annuity/returned-payment-cases/{caseId}/authorize-reissue"
    description: "Authorize reissue of the returned payment (SoD: caller != opened_by_user_id)"
    roles: [OperationsSpecialist]
    code: 200
    input: []
    output: ReturnedPaymentCase
    side_effects: ["case OPEN -> RESOLVED_REISSUE; payment RETURNED -> PAYABLE"]
  - method: POST
    path: "/annuity/returned-payment-cases/{caseId}/escalate-escheat"
    description: "Manually escalate an OPEN case toward escheatment (dormancy must already be met)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ReturnedPaymentCase
    side_effects: ["case OPEN -> ESCHEAT_PENDING; payment -> ESCHEATABLE (ERR_DORMANCY_NOT_MET if early)"]

  # --- PayeeChangeRequest ---
  - method: POST
    path: "/annuity/payee-change-requests"
    description: "Submit a payee change (ADDRESS auto-approves when no open returned-payment case; NAME/BANK_ACCOUNT always reviewed)"
    roles: [Payee, CaseManager]
    code: 201
    input: [payee_id, change_type, "new_address_line1?", "new_address_city?", "new_address_state_code?", "new_address_postal_code?", "new_full_name?", "new_bank_routing_number?", "new_bank_account_number?"]
    output: PayeeChangeRequest
    side_effects: ["submitted_by_user_id := X-User-ID; ADDRESS + no open cases -> auto APPROVED and applied; else UNDER_REVIEW"]
  - method: GET
    path: "/annuity/payee-change-requests"
    description: "List change requests"
    roles: [Any]
    code: 200
    input: ["payee_id?", "status?"]
    output: "PayeeChangeRequest[]"
    side_effects: []
  - method: GET
    path: "/annuity/payee-change-requests/{requestId}"
    description: "Get one change request"
    roles: [Any]
    code: 200
    input: []
    output: PayeeChangeRequest
    side_effects: []
  - method: POST
    path: "/annuity/payee-change-requests/{requestId}/approve"
    description: "Approve an UNDER_REVIEW change request (SoD: caller != submitter)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PayeeChangeRequest
    side_effects: ["UNDER_REVIEW -> APPROVED; payload applied to Payee; payee.version += 1"]
  - method: POST
    path: "/annuity/payee-change-requests/{requestId}/reject"
    description: "Reject an UNDER_REVIEW change request"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PayeeChangeRequest
    side_effects: ["UNDER_REVIEW -> REJECTED"]

  # --- TransferPetition (secondary market / SSPA) ---
  - method: POST
    path: "/annuity/transfer-petitions"
    description: "Draft a secondary-market transfer petition; computes matched set, PV, and both discount rates at creation (valuation date = clock date)"
    roles: [Payee, CaseManager]
    code: 201
    input: [settlement_agreement_id, payee_id, factoring_company_name, purchase_price_cents, transfer_start_date, transfer_end_date]
    output: TransferPetition
    side_effects: ["transfer_discount_rates + transferred_payment_set_pv computed; status = DRAFT; requires agreement FUNDED|ACTIVE"]
  - method: GET
    path: "/annuity/transfer-petitions"
    description: "List transfer petitions"
    roles: [Any]
    code: 200
    input: ["settlement_agreement_id?", "payee_id?", "status?"]
    output: "TransferPetition[]"
    side_effects: []
  - method: GET
    path: "/annuity/transfer-petitions/{petitionId}"
    description: "Get one transfer petition"
    roles: [Any]
    code: 200
    input: []
    output: TransferPetition
    side_effects: []
  - method: POST
    path: "/annuity/transfer-petitions/{petitionId}/file"
    description: "File the petition (refile bar, overlap, guardianship-for-minor, IRR cap, price<=PV)"
    roles: [Payee, CaseManager]
    code: 200
    input: []
    output: TransferPetition
    side_effects: ["DRAFT -> FILED; filed_at/filed_by_user_id/state_code captured"]
  - method: POST
    path: "/annuity/transfer-petitions/{petitionId}/serve-disclosure"
    description: "Record statutory disclosure service"
    roles: [CaseManager]
    code: 200
    input: []
    output: TransferPetition
    side_effects: ["FILED -> DISCLOSURE_SERVED; disclosure_served_at := clock date"]
  - method: POST
    path: "/annuity/transfer-petitions/{petitionId}/schedule-hearing"
    description: "Schedule the court hearing (cooling-off and IPA gates)"
    roles: [CaseManager]
    code: 200
    input: [hearing_date, "ipa_completed_at?"]
    output: TransferPetition
    side_effects: ["DISCLOSURE_SERVED -> HEARING_SCHEDULED"]
  - method: POST
    path: "/annuity/transfer-petitions/{petitionId}/withdraw"
    description: "Withdraw a petition before adjudication"
    roles: [Payee, CaseManager]
    code: 200
    input: []
    output: TransferPetition
    side_effects: ["{FILED, DISCLOSURE_SERVED, HEARING_SCHEDULED} -> WITHDRAWN"]
  - method: POST
    path: "/annuity/transfer-petitions/{petitionId}/record-court-order"
    description: "Record the judicial outcome (SoD: recorder != filer; APPROVED_MODIFIED substitutes price)"
    roles: [JudicialRecorder]
    code: 200
    input: [outcome, court_order_date, "prejudice?", "approved_price_cents?"]
    output: TransferPetition
    side_effects: ["HEARING_SCHEDULED -> COURT_APPROVED | COURT_DENIED; order fields stamped"]
  - method: POST
    path: "/annuity/transfer-petitions/{petitionId}/effectuate"
    description: "Effectuate a court-approved transfer: matched payments -> TRANSFERRED, exhaustion cascade"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: TransferPetition
    side_effects: ["COURT_APPROVED -> EFFECTIVE; payments -> TRANSFERRED; policy/agreement exhaustion cascade"]

  # --- DeathClaim ---
  - method: POST
    path: "/annuity/death-claims"
    description: "Report a payee death (payee must be ACTIVE; one open claim per payee)"
    roles: [CaseManager]
    code: 201
    input: [payee_id, settlement_agreement_id, date_of_death, claimant_type, claimant_name]
    output: DeathClaim
    side_effects: ["status = REPORTED"]
  - method: GET
    path: "/annuity/death-claims"
    description: "List death claims"
    roles: [Any]
    code: 200
    input: ["payee_id?", "settlement_agreement_id?", "status?"]
    output: "DeathClaim[]"
    side_effects: []
  - method: GET
    path: "/annuity/death-claims/{claimId}"
    description: "Get one death claim"
    roles: [Any]
    code: 200
    input: []
    output: DeathClaim
    side_effects: []
  - method: POST
    path: "/annuity/death-claims/{claimId}/settle"
    description: "Settle a death claim (cascade: payee DECEASED, life-contingent payments cancelled, guardianship/change-requests/petitions resolved, exhaustion)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DeathClaim
    side_effects: ["REPORTED -> SETTLED; full death cascade per state machine"]
  - method: POST
    path: "/annuity/death-claims/{claimId}/deny"
    description: "Deny a death claim"
    roles: [ComplianceOfficer]
    code: 200
    input: [denial_reason]
    output: DeathClaim
    side_effects: ["REPORTED -> DENIED"]
  - method: POST
    path: "/annuity/death-claims/{claimId}/resubmit"
    description: "Resubmit a denied claim with new evidence (DENIED -> REPORTED cycle)"
    roles: [CaseManager]
    code: 200
    input: []
    output: DeathClaim
    side_effects: ["DENIED -> REPORTED; denial_reason cleared"]

  # --- CommutationRequest ---
  - method: POST
    path: "/annuity/commutation-requests"
    description: "Request commutation of remaining payments to a lump sum (OCC on policy version; rider/statute gates; computes commuted_value_cents)"
    roles: [CaseManager]
    code: 201
    input: [annuity_policy_id, settlement_agreement_id, reason, expected_annuity_policy_version, "death_claim_id?"]
    output: CommutationRequest
    side_effects: ["commuted_value computed; status = REQUESTED; increments AnnuityPolicy.version by 1"]
  - method: GET
    path: "/annuity/commutation-requests"
    description: "List commutation requests"
    roles: [Any]
    code: 200
    input: ["annuity_policy_id?", "settlement_agreement_id?", "death_claim_id?", "status?"]
    output: "CommutationRequest[]"
    side_effects: []
  - method: GET
    path: "/annuity/commutation-requests/{commutationId}"
    description: "Get one commutation request"
    roles: [Any]
    code: 200
    input: []
    output: CommutationRequest
    side_effects: []
  - method: POST
    path: "/annuity/commutation-requests/{commutationId}/approve"
    description: "Approve a commutation request"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CommutationRequest
    side_effects: ["REQUESTED -> APPROVED"]
  - method: POST
    path: "/annuity/commutation-requests/{commutationId}/deny"
    description: "Deny a commutation request"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: CommutationRequest
    side_effects: ["REQUESTED -> DENIED"]
  - method: POST
    path: "/annuity/commutation-requests/{commutationId}/pay-out"
    description: "Pay out an approved commutation (payments -> COMMUTED; policy/agreement transitions)"
    roles: [OperationsSpecialist]
    code: 200
    input: []
    output: CommutationRequest
    side_effects: ["APPROVED -> PAID_OUT; covered payments COMMUTED; policy PARTIALLY/FULLY_COMMUTED; agreement COMMUTED on full"]

  # --- EscheatmentBatch ---
  - method: POST
    path: "/annuity/escheatment-batches"
    description: "Open an escheatment batch for a state (at most one OPEN per state_code)"
    roles: [ComplianceOfficer]
    code: 201
    input: [state_code, batch_period]
    output: EscheatmentBatch
    side_effects: ["status = OPEN; opened_by_user_id := X-User-ID"]
  - method: GET
    path: "/annuity/escheatment-batches"
    description: "List escheatment batches"
    roles: [Any]
    code: 200
    input: ["state_code?", "status?"]
    output: "EscheatmentBatch[]"
    side_effects: []
  - method: GET
    path: "/annuity/escheatment-batches/{batchId}"
    description: "Get one escheatment batch"
    roles: [Any]
    code: 200
    input: []
    output: EscheatmentBatch
    side_effects: []
  - method: POST
    path: "/annuity/escheatment-batches/{batchId}/finalize"
    description: "Finalize: sweep ESCHEATABLE payments of the batch state (SoD: finalizer != opener; empty sweep allowed)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EscheatmentBatch
    side_effects: ["OPEN -> FINALIZED; ESCHEATABLE -> ESCHEATED sweep; swept totals; case closure cascade; exhaustion cascade"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not authorized for this endpoint; or Payee-role caller acting on another payee's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body-referenced resource id does not exist" }
  - { id: ERR_STATE_PROFILE_NOT_FOUND, http: 404, condition: "No StateStatuteProfile exists for a referenced state code (agreement court_state_code, payee address_state_code, change-request new_address_state_code)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, invalid enum/date format, non-positive cents, unknown payload field, inverted date range, due_date before schedule effective_from_date" }
  - { id: ERR_STALE_AGREEMENT_VERSION, http: 412, condition: "expected_settlement_agreement_version != agreement.version on schedule activation (OCC)" }
  - { id: ERR_STALE_POLICY_VERSION, http: 412, condition: "expected_annuity_policy_version != policy.version on commutation create (OCC)" }
  - { id: ERR_AGREEMENT_INVALID_STATE, http: 409, condition: "Agreement not in the state required for the operation (execute/assign/fund/schedule-activate/reclaim guards)" }
  - { id: ERR_ASSIGNMENT_INVALID_STATE, http: 409, condition: "Assignment not EXECUTED when required (release twice, release from terminal)" }
  - { id: ERR_POLICY_INVALID_STATE, http: 409, condition: "Policy not in the state required (mark-in-force twice; release without IN_FORCE policy; commutation on terminal policy)" }
  - { id: ERR_SCHEDULE_INVALID_STATE, http: 409, condition: "Schedule not DRAFT when required (payment add to non-DRAFT; activate non-DRAFT)" }
  - { id: ERR_SCHEDULE_HAS_PAYMENTS, http: 409, condition: "Activating a schedule with zero payment rows" }
  - { id: ERR_PAYMENT_NOT_PAYABLE, http: 409, condition: "Issue attempted on a payment not in PAYABLE" }
  - { id: ERR_PAYMENT_NOT_ISSUED, http: 409, condition: "mark-cleared or report-returned attempted on a payment not in ISSUED" }
  - { id: ERR_PAYMENT_NOT_RETURNED, http: 409, condition: "authorize-reissue attempted while the payment is not RETURNED" }
  - { id: ERR_PAYMENT_NOT_ESCHEATED, http: 409, condition: "reclaim-escheat attempted on a payment not in ESCHEATED" }
  - { id: ERR_CASE_INVALID_STATE, http: 409, condition: "ReturnedPaymentCase not in the state required (authorize-reissue requires OPEN; escalate requires OPEN)" }
  - { id: ERR_CHANGE_REQUEST_INVALID_STATE, http: 409, condition: "Change request not UNDER_REVIEW for approve/reject" }
  - { id: ERR_PETITION_INVALID_STATE, http: 409, condition: "Petition not in the state required for the transition" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "DeathClaim not in the state required; also: claim creation while payee not ACTIVE; DEATH commutation referencing a non-SETTLED claim" }
  - { id: ERR_COMMUTATION_INVALID_STATE, http: 409, condition: "Commutation not in the state required (approve/deny require REQUESTED; pay-out requires APPROVED)" }
  - { id: ERR_BATCH_INVALID_STATE, http: 409, condition: "EscheatmentBatch not OPEN for finalize" }
  - { id: ERR_GUARDIANSHIP_INVALID_STATE, http: 409, condition: "Guardianship case not in the state required (activate requires PENDING_REVIEW; revoke requires ACTIVE)" }
  - { id: ERR_GUARDIANSHIP_REQUIRED, http: 403, condition: "Payee is a minor and no ACTIVE GuardianshipCase exists (payment issue, transfer filing)" }
  - { id: ERR_GUARDIANSHIP_OVERLAP, http: 409, condition: "Half-open guardianship intervals intersect for the same payee" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties: caller id equals the anchor user id (case opener / batch opener / petition filer / change submitter)" }
  - { id: ERR_EFFECTIVE_RATE_EXCEEDS_CAP, http: 422, condition: "Petition effective_annual_rate_bps (IRR) exceeds the governing state's sspa_max_discount_rate_bps" }
  - { id: ERR_PRICE_EXCEEDS_PRESENT_VALUE, http: 422, condition: "purchase_price_cents exceeds present_value_cents of the matched payment set" }
  - { id: ERR_REFILE_BARRED_WITH_PREJUDICE, http: 409, condition: "Payee has a COURT_DENIED petition with prejudice WITH whose court_order_date is within the prior 365 days" }
  - { id: ERR_TRANSFER_WINDOW_OVERLAP, http: 409, condition: "Matched payment set intersects another non-terminal petition's set on the same agreement" }
  - { id: ERR_NO_TRANSFERRABLE_PAYMENTS, http: 409, condition: "Petition window matches zero eligible payments (at create or at effectuate)" }
  - { id: ERR_IPA_REQUIRED, http: 409, condition: "Governing state requires independent professional advice; ipa_completed_at not supplied" }
  - { id: ERR_COOLING_OFF_NOT_ELAPSED, http: 409, condition: "Hearing scheduled before disclosure_served_at + disclosure_cooling_off_days" }
  - { id: ERR_COMMUTATION_NOT_PERMITTED, http: 403, condition: "Policy rider does not allow the requested reason, or the payee-residence state forbids commutation" }
  - { id: ERR_NO_COMMUTABLE_PAYMENTS, http: 409, condition: "Zero eligible payments (SCHEDULED/PAYABLE with due_date strictly after the clock date)" }
  - { id: ERR_DORMANCY_NOT_MET, http: 409, condition: "Manual escheat escalation before the dormancy anniversary has passed" }
  - { id: ERR_OPEN_BATCH_EXISTS, http: 409, condition: "An OPEN escheatment batch already exists for this state_code" }
  - { id: ERR_NO_OPEN_ESCHEAT_BATCH, http: 409, condition: "Reclaim requires an OPEN escheatment batch for the payment's escheat state" }
  - { id: ERR_DUPLICATE_CASE_NUMBER, http: 409, condition: "Settlement agreement case_number already exists" }
  - { id: ERR_DUPLICATE_STATE_PROFILE, http: 409, condition: "A StateStatuteProfile for this state_code already exists" }

# =============================================================================
# 1.7 RBAC Matrix (segregation_of_duties model)
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Issuer platform administrator; owns statutory configuration and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /annuity/_clock/set_current_utc"
      - "POST /annuity/state-statute-profiles"
    shared_operations: []

  - name: CaseManager
    description: "Settlement case manager; structures agreements, assignments, policies, schedules, payments; files petitions/claims/commutations"
    identity: opaque
    exclusive_operations:
      - "POST /annuity/payees"
      - "POST /annuity/settlement-agreements + execute"
      - "POST /annuity/qualified-assignments"
      - "POST /annuity/annuity-policies + mark-in-force"
      - "POST /annuity/payment-schedules + activate"
      - "POST /annuity/scheduled-payments"
      - "POST /annuity/guardianship-cases"
      - "POST /annuity/transfer-petitions + serve-disclosure + schedule-hearing"
      - "POST /annuity/death-claims + resubmit"
      - "POST /annuity/commutation-requests"
    shared_operations:
      - "POST /annuity/payee-change-requests (on behalf of a payee)"
      - "POST /annuity/transfer-petitions/{id}/file (on behalf)"
      - "POST /annuity/transfer-petitions/{id}/withdraw (on behalf)"

  - name: OperationsSpecialist
    description: "Annuity operations specialist; issues and reconciles payments, works returned-payment cases, pays commutations"
    identity: opaque
    exclusive_operations:
      - "POST /annuity/scheduled-payments/{id}/issue | mark-cleared | report-returned | reclaim-escheat"
      - "POST /annuity/returned-payment-cases/{id}/authorize-reissue (SoD: != opened_by_user_id)"
      - "POST /annuity/commutation-requests/{id}/pay-out"
    shared_operations: []

  - name: ComplianceOfficer
    description: "Compliance officer; approves guardianships, change requests, petition effectuation, death claims, commutations; owns escheatment"
    identity: opaque
    exclusive_operations:
      - "POST /annuity/guardianship-cases/{id}/activate | revoke"
      - "POST /annuity/payee-change-requests/{id}/approve | reject (SoD on approve: != submitter)"
      - "POST /annuity/transfer-petitions/{id}/effectuate"
      - "POST /annuity/death-claims/{id}/settle | deny"
      - "POST /annuity/commutation-requests/{id}/approve | deny"
      - "POST /annuity/escheatment-batches + finalize (SoD on finalize: != opener)"
      - "POST /annuity/returned-payment-cases/{id}/escalate-escheat"
      - "POST /annuity/qualified-assignments/{id}/release"
    shared_operations: []

  - name: JudicialRecorder
    description: "Court liaison clerk; records judicial outcomes on transfer petitions"
    identity: opaque
    exclusive_operations:
      - "POST /annuity/transfer-petitions/{id}/record-court-order (SoD: != filed_by_user_id)"
    shared_operations: []

  - name: Payee
    description: "The injured party; self-service change requests and transfer petitions"
    identity: "entity_backed:Payee"
    exclusive_operations: []
    shared_operations:
      - "POST /annuity/payee-change-requests (payee_id must equal X-User-ID)"
      - "POST /annuity/transfer-petitions (payee_id must equal X-User-ID)"
      - "POST /annuity/transfer-petitions/{id}/file (petition.payee_id must equal X-User-ID)"
      - "POST /annuity/transfer-petitions/{id}/withdraw (petition.payee_id must equal X-User-ID)"

  - name: Any
    description: "Read-only umbrella role: every authenticated caller may use GET endpoints"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /annuity/* (all list and single-read endpoints)"
