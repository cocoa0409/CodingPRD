              payload: { host_railroad_id: "${host_id}", code: "ZZ", name: "Z", endpoint_a: "A", endpoint_b: "B", service_type: "LONG_DISTANCE", annual_cost_cents: 1 }
              as: StateSponsor
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 and ${err} == ERR_FORBIDDEN"

      - name: passenger_operator_cannot_lock_maintenance_forbidden
        claim_type: Role Denial
        grounds:
          - roles.PassengerOperator
          - roles.HostRailroadRep
        distinguishing_aspect: "Maintenance lock is HostRailroadRep-exclusive; the passenger operator gets 403 even on its own timetable's corridor."
        test_recipe:
          setup: ["Host, corridor, segment, PLANNED window."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - call: "POST /rail/maintenance-windows"
              payload: { track_segment_id: "${seg1_id}", window_start_at: "2026-09-08T06:00:00Z", window_end_at: "2026-09-08T08:00:00Z", equipment_unit_id: "EQ-3", clearance_buffer_minutes: 15 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { mw3: $.data.id }
          trigger:
            - call: "POST /rail/maintenance-windows/${mw3}/lock"
              payload: {}
              as: PassengerOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 and ${err} == ERR_FORBIDDEN"
            - "MaintenanceWindow.${mw3}.status == PLANNED"

      - name: host_rep_cannot_confirm_own_incident_forbidden
        claim_type: Segregation of Duties
        grounds:
          - roles.HostRailroadRep
          - roles.PassengerOperator
        distinguishing_aspect: "Delay coding is host-side, confirmation is passenger-side: the host rep who coded the incident gets 403 on confirm; the passenger operator succeeds."
        test_recipe:
          setup: ["Completed run; one OPEN host incident."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
            - *k_tt1
            - *k_tt1_prop
            - *k_tt1_rev
            - *k_tt1_rat
            - *k_tt1_pub
            - *k_runs1
            - *k_pass1
            - *k_dep1
            - *k_act1
            - *k_act2
            - *k_comp1
            - *k_inc20
          trigger:
            - call: "POST /rail/delay-incidents/${inc20}/confirm"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
            - call: "POST /rail/delay-incidents/${inc20}/confirm"
              payload: {}
              as: PassengerOperator
          assert:
            - "host confirm: status 403 and ${err} == ERR_FORBIDDEN"
            - "passenger confirm: status 200 and DelayIncident.${inc20}.status == CONFIRMED"

  # ===========================================================================
  - section: cross_cutting
    instances:

      - name: project_approve_stale_version_rejected
        claim_type: OCC Stale Version
        grounds:
          - concurrency_rules[project-approve-stale-agreement]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After a successful approve bumps the agreement version, a second approve carrying the previously observed version is rejected 412 ERR_STALE_VERSION; the project stays FUNDED."
        test_recipe:
          setup: ["ACTIVE agreement at version ${oa_v}; two PROPOSED capital projects; project 1 already approved (version now ${oa_v}+1)."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
            - *k_proj
            - call: "POST /rail/capital-projects"
              payload: { operating_agreement_id: "${oa_id}", track_segment_id: "${seg2_id}", project_type: "SIGNAL", funded_amount_cents: 30000000, added_frequency_capacity: 2 }
              as: PassengerOperator
              captures: { proj2: $.data.id }
            - *k_proj_ok
          trigger:
            - call: "POST /rail/capital-projects/${proj2}/approve"
              payload: { expected_operating_agreement_version: "${oa_v}" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 412 and ${err} == ERR_STALE_VERSION"
            - "CapitalProject.${proj2}.status == PROPOSED (unchanged)"
            - "OperatingAgreement.${oa_id}.version == ${oa_v} + 1 (only the first approve bumped it)"

      - name: amend_stale_version_rejected
        claim_type: OCC Stale Version
        grounds:
          - concurrency_rules[oa-amend-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "An amend carrying a version one behind the current agreement version is rejected 412 ERR_STALE_VERSION and changes nothing."
        test_recipe:
          setup: ["ACTIVE agreement at version ${oa_v}."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
          trigger:
            - call: "POST /rail/operating-agreements/${oa_id}/amend"
              payload: { expected_operating_agreement_version: "${oa_v} - 1", penalty_rate_cents_per_minute: 99 }
              as: PassengerOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status 412 and ${err} == ERR_STALE_VERSION"
            - "OperatingAgreement.${oa_id}.penalty_rate_cents_per_minute == 50 and amendment_seq == 0"

      - name: equipment_allowance_exact_boundary
        claim_type: Threshold Boundary
        grounds:
          - calculations.equipment_hours_budget
          - errors[ERR_EQUIPMENT_ALLOWANCE_EXCEEDED]
        distinguishing_aspect: "Cumulative threshold with inclusive boundary: four 10-hour locks in one ISO week consume exactly 40.00 hours and are all allowed; a fifth 1-hour window (41.00 total) is rejected 409 ERR_EQUIPMENT_ALLOWANCE_EXCEEDED."
        test_recipe:
          setup: ["Segment; four PLANNED 10-hour windows for EQ-4 on 2026-09-07..2026-09-10 (same ISO week), all LOCKED; one PLANNED 1-hour window on 2026-09-11."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - call: "POST /rail/maintenance-windows"
              payload: { track_segment_id: "${seg1_id}", window_start_at: "2026-09-07T06:00:00Z", window_end_at: "2026-09-07T16:00:00Z", equipment_unit_id: "EQ-4", clearance_buffer_minutes: 15 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { w1: $.data.id }
            - call: "POST /rail/maintenance-windows"
              payload: { track_segment_id: "${seg1_id}", window_start_at: "2026-09-08T06:00:00Z", window_end_at: "2026-09-08T16:00:00Z", equipment_unit_id: "EQ-4", clearance_buffer_minutes: 15 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { w2: $.data.id }
            - call: "POST /rail/maintenance-windows"
              payload: { track_segment_id: "${seg1_id}", window_start_at: "2026-09-09T06:00:00Z", window_end_at: "2026-09-09T16:00:00Z", equipment_unit_id: "EQ-4", clearance_buffer_minutes: 15 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { w3: $.data.id }
            - call: "POST /rail/maintenance-windows"
              payload: { track_segment_id: "${seg1_id}", window_start_at: "2026-09-10T06:00:00Z", window_end_at: "2026-09-10T16:00:00Z", equipment_unit_id: "EQ-4", clearance_buffer_minutes: 15 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { w4: $.data.id }
            - call: "POST /rail/maintenance-windows"
              payload: { track_segment_id: "${seg1_id}", window_start_at: "2026-09-11T06:00:00Z", window_end_at: "2026-09-11T07:00:00Z", equipment_unit_id: "EQ-4", clearance_buffer_minutes: 15 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { w5: $.data.id }
            - call: "POST /rail/maintenance-windows/${w1}/lock"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - call: "POST /rail/maintenance-windows/${w2}/lock"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - call: "POST /rail/maintenance-windows/${w3}/lock"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - call: "POST /rail/maintenance-windows/${w4}/lock"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { avail40: $.data.equipment_week_hours_available }
          trigger:
            - call: "POST /rail/maintenance-windows/${w5}/lock"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first four locks succeed; ${avail40} == 0.00 (exactly at the 40.00 boundary, inclusive)"
            - "fifth lock: status 409 and ${err} == ERR_EQUIPMENT_ALLOWANCE_EXCEEDED"
            - "MaintenanceWindow.${w5}.status == PLANNED (unchanged)"

      - name: maintenance_lock_skips_conflicting_planned_passage
        claim_type: Cascade Side Effect
        grounds:
          - state_machines.MaintenanceWindow.PLANNED_to_LOCKED
          - state_machines.SegmentPassage.PLANNED_to_SKIPPED
        distinguishing_aspect: "Locking a window that conflicts with a published run's planned passage flips that passage to SKIPPED; the same lock on a non-conflicting day leaves passages untouched."
        test_recipe:
          setup: ["Published 1-run timetable on 2026-09-02; PLANNED window on seg2 08:30-09:00 with buffer 0 (conflicts with planned passage [08:27,09:17))."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
            - *k_tt1
            - *k_tt1_prop
            - *k_tt1_rev
            - *k_tt1_rat
            - *k_tt1_pub
            - *k_runs1
            - *k_pass1
            - call: "POST /rail/maintenance-windows"
              payload: { track_segment_id: "${seg2_id}", window_start_at: "2026-09-02T08:30:00Z", window_end_at: "2026-09-02T09:00:00Z", equipment_unit_id: "EQ-5", clearance_buffer_minutes: 0 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { mw5: $.data.id }
          trigger:
            - call: "POST /rail/maintenance-windows/${mw5}/lock"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
          assert:
            - "SegmentPassage.${pass2_id}.status == SKIPPED (conflicting planned passage cascaded)"
            - "SegmentPassage.${pass1_id}.status == PLANNED (seg1 passage untouched)"
            - "TrainRun.${run_id}.status == SCHEDULED (run itself not cancelled by a lock)"

      - name: segment_capacity_derived_reconciliation_on_complete
        claim_type: Derived Field Reconciliation
        grounds:
          - entities.TrackSegment.fields.capacity_trains_per_day
          - state_machines.CapitalProject.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: "Completing the capital project recomputes the segment's capacity exactly once (20 -> 24); a suspend/start cycle beforehand does not change it."
        test_recipe:
          setup: ["ACTIVE agreement; capital project approved, started."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
            - *k_proj
            - *k_proj_ok
            - call: "POST /rail/capital-projects/${proj_id}/start"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /rail/capital-projects/${proj_id}/complete"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
          assert:
            - "CapitalProject.${proj_id}.status == COMPLETED"
            - "TrackSegment.${seg1_id}.capacity_trains_per_day == 24 (20 + 4)"
            - "TrackSegment.${seg1_id}.status == OPERABLE (CAPITAL_HOLD cleared)"

  # ===========================================================================
  - section: consistency
    instances:

      - name: immediate_visibility_after_create_and_transition
        claim_type: Immediate Consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "consistency_model immediate: the GET right after activate reflects ACTIVE without any delay, and the transition response body itself carries the new status and bumped version."
        test_recipe:
          setup: ["DRAFT agreement exists."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
          trigger:
            - call: "POST /rail/operating-agreements/${oa_id}/activate"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { act_status: $.data.status, act_v: $.data.version }
            - call: "GET /rail/operating-agreements/${oa_id}"
              payload: {}
              as: StateSponsor
              captures: { get_status: $.data.status, get_v: $.data.version }
          assert:
            - "${act_status} == ACTIVE and ${act_v} == 2 in the transition response itself"
            - "${get_status} == ACTIVE and ${get_v} == 2 on the immediately following GET"
