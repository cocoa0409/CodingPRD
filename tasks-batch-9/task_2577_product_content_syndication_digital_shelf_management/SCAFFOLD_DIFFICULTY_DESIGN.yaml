            - "the AlphaMart listing was created before the BetaMart listing, so created_at ASC ordering puts its subscore first"
            - "Product.last_pinned_at == 2026-08-10T00:00:00Z and both observations are stamped after it (2026-08-11 and 2026-08-12), so the post_pin_window BASE group is empty"
