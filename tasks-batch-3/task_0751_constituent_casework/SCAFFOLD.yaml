# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID on an endpoint that requires authentication"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the authenticated role is not permitted to perform the operation"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "an entity-backed Constituent attempts to act on a resource it does not own"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, or invalid enum value in the request body"
  - id: ERR_INVALID_TIME_RANGE
    http: 422
    condition: "start_at is not strictly before end_at"
  - id: ERR_REPRESENTATIVE_NOT_FOUND
    http: 404
    condition: "referenced representative id does not exist"
  - id: ERR_CONSTITUENT_NOT_FOUND
    http: 404
    condition: "referenced constituent id does not exist"
  - id: ERR_AGENCY_NOT_FOUND
    http: 404
    condition: "referenced agency id does not exist"
  - id: ERR_TEMPLATE_NOT_FOUND
    http: 404
    condition: "referenced response template id does not exist"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "referenced case id does not exist"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "referenced agency referral id does not exist"
  - id: ERR_VENUE_NOT_FOUND
    http: 404
    condition: "referenced venue id does not exist"
  - id: ERR_EVENT_NOT_FOUND
    http: 404
    condition: "referenced event id does not exist"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "referenced event registration id does not exist"
  - id: ERR_NEWSLETTER_NOT_FOUND
    http: 404
    condition: "referenced newsletter campaign id does not exist"
  - id: ERR_CASE_INVALID_STATE
    http: 409
    condition: "case is not in a state permitting the requested transition"
  - id: ERR_REFERRAL_INVALID_STATE
    http: 409
    condition: "referral is not in a state permitting the requested transition"
  - id: ERR_EVENT_INVALID_STATE
    http: 409
    condition: "event lifecycle/registration state does not permit the requested operation"
  - id: ERR_REGISTRATION_INVALID_STATE
    http: 409
    condition: "registration is already CANCELLED"
  - id: ERR_CONSTITUENT_PURGED
    http: 409
    condition: "operation references a PURGED constituent"
  - id: ERR_CONSENT_REQUIRED
    http: 403
    condition: "agency referral attempted without data_sharing_consent on the constituent"
  - id: ERR_AGENCY_INACTIVE
    http: 409
    condition: "referral created against or sent to an INACTIVE agency"
  - id: ERR_TEMPLATE_MISMATCH
    http: 422
    condition: "template is inactive or its category does not match the case category at triage"
  - id: ERR_DUPLICATE_REGISTRATION
    http: 409
    condition: "constituent already has a REGISTERED registration for the event"
  - id: ERR_VENUE_CONFLICT
    http: 409
    condition: "event interval (expanded by the venue buffer) overlaps another scheduled event at the same venue"
  - id: ERR_REPRESENTATIVE_CONFLICT
    http: 409
    condition: "event interval overlaps another scheduled event for the same representative (half-open; back-to-back allowed)"
  - id: ERR_EVENT_FULL
    http: 409
    condition: "registered_count has reached event capacity, or event capacity exceeds venue capacity at create/reschedule"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_event_version does not match the current Event.version"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: OfficeAdmin
    description: "Legislative office administrator; superset of Caseworker plus all configuration and privacy operations."
    identity: "opaque"
    exclusive_operations:
      - "POST /representatives"
      - "POST /agencies"
      - "POST /response-templates"
      - "POST /venues"
      - "POST /events, /events/{id}/reschedule, /events/{id}/open-registration, /events/{id}/cancel"
      - "POST /cases/{id}/close"
      - "POST /representatives/{id}/newsletters and newsletter reads"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "case triage/request-info/respond/referrals and referral send/resolve/reject (shared with Caseworker)"
      - "constituent purge and PATCH (shared with the owning Constituent)"
      - "event registration create/cancel (shared with the owning Constituent)"
      - "list/read cases, constituents, agencies, referrals, analytics (shared with Caseworker)"
  - name: Caseworker
    description: "Office staff who triage, work, refer, and resolve cases."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /cases, triage, request-info, respond, referrals"
      - "referral send/resolve/reject"
      - "GET cases/constituents/agencies/referrals/analytics/events/venues"
  - name: Constituent
    description: "A constituent acting on their own records."
    identity: "entity_backed:Constituent"
    exclusive_operations:
      - "POST /cases/{id}/constituent-reply"
      - "POST /cases/{id}/withdraw"
    shared_operations:
      - "POST /cases (own), PATCH/purge own constituent record"
      - "register/cancel own event registrations"
      - "GET own case/constituent/registration, list events"
  - name: Anonymous
    description: "Unauthenticated self-service surface, limited to registration."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /constituents (self-registration)"
