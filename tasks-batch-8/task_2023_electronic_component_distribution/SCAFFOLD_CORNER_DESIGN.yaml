  # ============================================================ rbac
  - section: rbac
    instances:
      - name: customer_buyer_cannot_create_part
        claim_type: role_denial
        grounds: ["roles[CustomerBuyer].exclusive_operations", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Catalog management is DistributorAdmin-exclusive; CustomerBuyer gets 403 on POST /parts even with a valid entity-backed id."
        test_recipe:
          setup: ["Line and customer exist"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-RB1", name: "RBAC Line 1", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_rb1: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust RB1", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_rb1: $.data.id }
          trigger:
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_rb1}", part_number: "PRB-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: CustomerBuyer
              as_user_id: "${cust_rb1}"
              captures: { err_rb1: $.data.error_id }
          assert:
            - "${err_rb1} == ERR_INSUFFICIENT_PERMISSIONS (http 403)"

      - name: supplier_admin_cannot_acknowledge_order
        claim_type: role_denial
        grounds: ["roles[SalesRep].exclusive_operations", "roles[SupplierAdmin]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Acknowledge is SalesRep-exclusive; SupplierAdmin (a peer role) is denied 403 even though the order exists and is SUBMITTED."
        test_recipe:
          setup: ["One SUBMITTED order"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-RB2", name: "RBAC Line 2", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_rb2: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_rb2}", part_number: "PRB-2", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_rb2: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust RB2", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_rb2: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_rb2}", lines: [ { part_id: "${part_rb2}", quantity: 5, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_rb2: $.data.id }
          trigger:
            - call: "POST /orders/${o_rb2}/acknowledge"
              payload: {}
              as: SupplierAdmin
              captures: { err_rb2: $.data.error_id }
          assert:
            - "${err_rb2} == ERR_INSUFFICIENT_PERMISSIONS (http 403)"
            - "CustomerOrder.${o_rb2}.status == SUBMITTED (unchanged)"

      - name: warehouse_ops_cannot_inspect_lot
        claim_type: role_denial
        grounds: ["roles[QualityInspector].exclusive_operations", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Inspection is QualityInspector-exclusive; the warehouse role is denied before the state check even though the lot is IN_INSPECTION."
        test_recipe:
          setup: ["OPEN_MARKET lot IN_INSPECTION"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-RB3", name: "RBAC Line 3", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_rb3: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_rb3}", part_number: "PRB-3", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_rb3: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_rb3}", date_code: "202601", qty_received: 10, source_type: "OPEN_MARKET" }
              as: WarehouseOps
              as_user_id: "wh-01"
              captures: { lot_rb3: $.data.id }
          trigger:
            - call: "POST /lots/${lot_rb3}/inspect"
              payload: { disposition: "AUTHENTICATE" }
              as: WarehouseOps
              as_user_id: "wh-02"
              captures: { err_rb3: $.data.error_id }
          assert:
            - "${err_rb3} == ERR_INSUFFICIENT_PERMISSIONS (http 403; role check precedes state/SoD checks)"
            - "InventoryLot.${lot_rb3}.status == IN_INSPECTION (unchanged)"

      - name: segregation_receiver_cannot_inspect_own_lot
        claim_type: segregation_of_duties
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", entities.InventoryLot.fields.received_by_user_id, "validations[priority=5]"]
        distinguishing_aspect: "Segregation of duties: when the same operator id (X-User-ID u-77) received the lot and later acts as QualityInspector, inspection is denied with ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["OPEN_MARKET lot received by user u-77 (WarehouseOps)"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-SD1", name: "SoD Line", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_sd1: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_sd1}", part_number: "PSD1-1", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_sd1: $.data.id }
            - call: "POST /lots"
              payload: { part_id: "${part_sd1}", date_code: "202601", qty_received: 10, source_type: "OPEN_MARKET" }
              as: WarehouseOps
              as_user_id: "u-77"
              captures: { lot_sd1: $.data.id }
          trigger:
            - call: "POST /lots/${lot_sd1}/inspect"
              payload: { disposition: "AUTHENTICATE" }
              as: QualityInspector
              as_user_id: "u-77"
              captures: { err_sd1: $.data.error_id }
            - call: "POST /lots/${lot_sd1}/inspect"
              payload: { disposition: "AUTHENTICATE" }
              as: QualityInspector
              as_user_id: "qi-99"
          assert:
            - "Inspector u-77 (== received_by_user_id): ${err_sd1} == ERR_SEGREGATION_OF_DUTIES (http 403)"
            - "Inspector qi-99 (different user): succeeds; InventoryLot.${lot_sd1}.status == AVAILABLE and .authenticity == AUTHENTICATED"

      - name: customer_buyer_other_customer_order_forbidden
        claim_type: role_denial
        grounds: ["roles[CustomerBuyer]", "validations[priority=2]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Entity-backed ownership: a CustomerBuyer whose X-User-ID is customer A cannot cancel customer B's order (ownership compare against order.customer_id)."
        test_recipe:
          setup: ["Two customers A and B; B has an ACKNOWLEDGED order with one OPEN line"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-RB4", name: "RBAC Line 4", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_rb4: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_rb4}", part_number: "PRB-4", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_rb4: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust A-RB4", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_rb4a: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust B-RB4", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_rb4b: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_rb4b}", lines: [ { part_id: "${part_rb4}", quantity: 5, ship_date: "2026-10-01" } ] }
              as: SalesRep
              captures: { o_rb4: $.data.id }
            - call: "POST /orders/${o_rb4}/acknowledge"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /orders/${o_rb4}/cancel"
              payload: {}
              as: CustomerBuyer
              as_user_id: "${cust_rb4a}"
              captures: { err_rb4: $.data.error_id }
          assert:
            - "${err_rb4} == ERR_INSUFFICIENT_PERMISSIONS (http 403; order.customer_id != X-User-ID)"
            - "CustomerOrder.${o_rb4}.status == ACKNOWLEDGED (unchanged)"

      - name: alternate_decision_exclusive_to_owning_customer
        claim_type: role_denial
        grounds: ["roles[CustomerBuyer].exclusive_operations", "errors[ERR_INSUFFICIENT_PERMISSIONS]", state_machines.AlternatePartApproval.PROPOSED_to_APPROVED]
        distinguishing_aspect: "Alternate-part decisions are CustomerBuyer-exclusive AND ownership-checked: SalesRep is denied; the owning customer succeeds."
        test_recipe:
          setup: ["PROPOSED alternate approval for (customer, primary, alternate)"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-RB5", name: "RBAC Line 5", sourcing_channel: "FRANCHISED" }
              as: DistributorAdmin
              captures: { line_rb5: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_rb5}", part_number: "PRB-5A", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 1000, book_price_cents: 1500 }
              as: DistributorAdmin
              captures: { part_rb5a: $.data.id }
            - call: "POST /parts"
              payload: { manufacturer_line_id: "${line_rb5}", part_number: "PRB-5B", msl_level: 3, floor_life_hours: 100, date_code_limit_months: 24, standard_cost_cents: 900, book_price_cents: 1400 }
              as: DistributorAdmin
              captures: { part_rb5b: $.data.id }
            - call: "POST /customers"
              payload: { name: "Cust RB5", credit_limit_cents: 100000000 }
              as: DistributorAdmin
              captures: { cust_rb5: $.data.id }
            - call: "POST /alternate-approvals"
              payload: { customer_id: "${cust_rb5}", primary_part_id: "${part_rb5a}", alternate_part_id: "${part_rb5b}" }
              as: SalesRep
              captures: { alt_rb5: $.data.id }
          trigger:
            - call: "POST /alternate-approvals/${alt_rb5}/decision"
              payload: { decision: "APPROVE" }
              as: SalesRep
              captures: { err_rb5: $.data.error_id }
            - call: "POST /alternate-approvals/${alt_rb5}/decision"
              payload: { decision: "APPROVE" }
              as: CustomerBuyer
              as_user_id: "${cust_rb5}"
          assert:
            - "SalesRep decision: ${err_rb5} == ERR_INSUFFICIENT_PERMISSIONS (http 403)"
            - "Owning CustomerBuyer decision: AlternatePartApproval.${alt_rb5}.status == APPROVED"

