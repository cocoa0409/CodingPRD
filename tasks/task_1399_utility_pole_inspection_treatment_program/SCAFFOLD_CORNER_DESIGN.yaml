  # ============================================================= calculations
  - section: calculations
    instances:
      - name: escalated_cost_compounds_per_deferral
        claim_type: correct_result
        grounds: [calculations.escalated_cost]
        distinguishing_aspect: "Deferral escalation compounds: 200000 -> 216000 after one defer, -> 233280 after the second (1.08^2), round_half_up to integer cents."
        test_recipe:
          setup: ["plain pole; manual order cost 200000 QUEUED"]
          setup_api_calls:
            - call: "POST /pole-program/poles"
              payload: { pole_number: "P-ESC1", species: LARCH, original_class: "2", install_date: "2001-05-01", gis_lat: 46.0, gis_lon: -121.0, gis_tag: "RURAL", height_ft: 35 }
              as: ProgramManager
              captures: { p_id: $.data.id }
            - call: "POST /pole-program/replacement-work-orders"
              payload: { pole_id: "${p_id}", estimated_cost_cents: 200000 }
              as: ProgramManager
              captures: { o_id: $.data.id, e0: $.data.escalated_cost_cents }
          trigger:
            - call: "POST /pole-program/replacement-work-orders/${o_id}/defer"
              payload: {}
              as: ProgramManager
              captures: { e1: $.data.escalated_cost_cents }
            - call: "POST /pole-program/replacement-work-orders/${o_id}/defer"
              payload: {}
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "at creation: escalated_cost_cents == 200000 (deferral 0)"
            - "after one defer: escalated_cost_cents == 216000"
            - "second defer from DEFERRED is rejected 409 ERR_ORDER_NOT_QUEUED (defer requires QUEUED; compounding to 233280 is observable only after a reconcile requeues the order)"

