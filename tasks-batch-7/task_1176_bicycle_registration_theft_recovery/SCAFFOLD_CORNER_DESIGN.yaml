      - name: duplicate_serial_exact_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_SERIAL_ACTIVE]", calculations.serial_normalization]
        distinguishing_aspect: "Exact normalized-serial equality with an existing CLEAR bicycle is a hard reject (ERR_DUPLICATE_SERIAL_ACTIVE), not a suspect flag: 'abc-123' then 'ABC123' collide after normalization."
        test_recipe:
          setup: ["Owner o1 with Bicycle b1 serial 'abc-123' (normalized ABC123, CLEAR)"]
          setup_api_calls:
            - { call: "POST /registry/owners/register", payload: { email: "o1@x.com", password: "pw", full_name: "O One" }, as: Anonymous, captures: { o1_id: $.data.id } }
            - { call: "POST /registry/bicycles", payload: { serial_number: "abc-123", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 40000, photo_url: "https://x/1.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { b1_id: $.data.id } }
          trigger:
            - { call: "POST /registry/bicycles", payload: { serial_number: "ABC123", manufacturer: "M", model: "Z", primary_color: "Black", declared_value_cents: 40000, photo_url: "https://x/2.jpg" }, as: Owner, as_user_id: "${o1_id}", captures: { err: $.data.error_id } }
          assert:
