              payload: { name: "Pothole", code: "POTHOLE", default_department_id: "${dept_id}", requires_geolocation: true }
              as: SystemAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /citizens"
              payload: { email: "c@x.com", full_name: "C" }
              as: Anonymous
              captures: { citizen_id: $.data.id }
            - call: "POST /service-requests"
              payload: { citizen_id: "${citizen_id}", category_id: "${cat_id}", description: "canon", lat: 41.8800, lng: -87.6300 }
