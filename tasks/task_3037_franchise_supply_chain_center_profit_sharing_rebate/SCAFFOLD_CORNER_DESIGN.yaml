      - name: price_book_overlap_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_11_business_referential
          - errors.ERR_PRICE_BOOK_OVERLAP
        distinguishing_aspect: "New price book overlapping existing ACTIVE book for same product+tier is rejected."
        test_recipe:
