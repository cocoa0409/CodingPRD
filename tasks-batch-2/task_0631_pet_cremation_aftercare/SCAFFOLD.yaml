# =============================================================================
# Pet Cremation & Aftercare Provider — Seed Tables (SCAFFOLD.yaml, §1.0–§1.7)
# Difficulty band: Expert
# =============================================================================

scenario: |
  Pet Cremation & Aftercare Provider: intake & body transport (clinic pickup/home),
  service type (private/communal) & cremation batch, paw-print/urn/keepsake order,
  scheduling & cooler inventory, certificate & ashes return/route, billing
  (clinic-account vs owner), memorial add-on, chain-of-custody

domain_name: pet-cremation-aftercare

# api_prefix is intentionally the empty string: every entity is mounted as a flat
# top-level collection (/cases, /clinics, /coolers, ...). This keeps cross-entity
# foreign-key references (Case->Clinic, Case->CremationBatch, Invoice->Case)
# reachable via filtered-list GETs and Case-children reachable via sub-resource
# GETs, without forcing a single nesting tree onto peer resources.
api_prefix: ""

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: hybrid
  # Case is the central resource. Clinic/PetOwner/Cooler/Retort/CremationBatch are
  # peer resources referenced by FK; TransportLeg/CustodyEvent/KeepsakeOrder/
  # CertificateRecord/ReturnRoute/MemorialAddon are children of Case; Invoice is a
  # peer that references Case and (optionally) Clinic.

  state_machine_shape: parallel
  # Case carries two independent axes (custody_status × billing_status); CremationBatch
  # is branching fork-join (PRIVATE vs COMMUNAL diverge in side effects); Cooler is
  # cyclic (AVAILABLE→FULL→AVAILABLE); ReturnRoute and Invoice are linear with reverts.

  relationship_patterns:
    - one_to_many        # Clinic→Case, Case→CustodyEvent, CremationBatch→Case
    - cross_aggregate    # Case→CremationBatch, Case→Cooler, Invoice→Case/Clinic

  role_model: peer_roles
  # ClinicStaff and PetOwner own different resource slices; CrematoryOperator and
  # CrematoryAdmin are operational roles over the crematory floor and billing.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMITTED VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Clinic
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Veterinary clinic name" }
      - { name: account_code, type: string, source: input, description: "Unique clinic account code", constraints: "globally unique among Clinics" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum unpaid clinic-account balance permitted before new clinic-billed cases are blocked", default: 500000 }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Sum of total_cents over Invoices where bill_to=CLINIC_ACCOUNT and status IN {ISSUED}; recomputed on invoice issue/void/pay. Never negative." }
      - { name: account_status, type: enum, source: computed, description: "CURRENT | DELINQUENT. DELINQUENT when outstanding_balance_cents > credit_limit_cents, else CURRENT." }

  - name: PetOwner
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Pet owner full name" }
      - { name: email, type: string, source: input, description: "Owner contact email", constraints: "globally unique among PetOwners" }
      - { name: phone, type: string, source: input, description: "Owner contact phone" }

  - name: Cooler
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Cooler unit label (e.g. COOLER-A)" }
      - { name: total_capacity, type: integer, source: input, description: "Number of body slots in this cooler", constraints: ">= 1" }
      - { name: occupied_count, type: integer, source: computed, description: "Count of Cases currently held with cooler_id == this Cooler and custody_status == IN_COOLER. Starts 0." }
      - { name: available_capacity, type: integer, source: computed, description: "total_capacity - occupied_count; never negative" }
      - { name: status, type: enum, source: computed, description: "AVAILABLE | FULL. FULL when occupied_count >= total_capacity, else AVAILABLE." }

  - name: Retort
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Cremation retort (oven) label" }
      - { name: max_load_lbs, type: integer, source: input, description: "Maximum combined body weight per firing", constraints: ">= 1" }

  - name: CremationBatch
    parent: null
    common_fields: true
    fields:
      - { name: retort_id, type: string, source: input, description: "FK -> Retort.id; oven this batch fires in" }
      - { name: service_type, type: enum, source: input, description: "PRIVATE | COMMUNAL. PRIVATE batches hold exactly one Case; COMMUNAL batches hold one or more.", constraints: "PRIVATE | COMMUNAL" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC firing window start (inclusive)" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO 8601 UTC firing window end (exclusive); must be after scheduled_start" }
      - { name: status, type: enum, source: system, description: "OPEN | LOADED | FIRING | COMPLETED | RECONCILED" }
      - { name: member_count, type: integer, source: computed, description: "Count of Cases with batch_id == this batch and custody_status NOT IN {CANCELLED}. Starts 0." }
      - { name: loaded_weight_lbs, type: integer, source: computed, description: "Sum of weight_lbs over member Cases (custody_status NOT IN {CANCELLED})." }
      - { name: communal_firing_total_cents, type: integer, source: computed, description: "For COMMUNAL batches, the fixed pooled firing cost allocated across members on FIRING; 0 for PRIVATE." }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: clinic_id, type: string, source: input, description: "FK -> Clinic.id; clinic that submitted intake (nullable for direct owner drop-off)", default: null }
      - { name: owner_id, type: string, source: input, description: "FK -> PetOwner.id; owner of the deceased pet" }
      - { name: batch_id, type: string, source: system, description: "FK -> CremationBatch.id; assigned cremation batch (null until staged)", default: null }
      - { name: cooler_id, type: string, source: system, description: "FK -> Cooler.id; cooler currently holding the body (null when not in cooler)", default: null }
      - { name: pet_name, type: string, source: input, description: "Deceased pet name" }
      - { name: species, type: enum, source: input, description: "DOG | CAT | OTHER" }
      - { name: weight_lbs, type: integer, source: input, description: "Body weight in pounds", constraints: ">= 1" }
      - { name: weight_tier, type: enum, source: computed, description: "SMALL (<=25) | MEDIUM (26-75) | LARGE (76-150) | XLARGE (>150), derived from weight_lbs" }
      - { name: service_type, type: enum, source: input, description: "PRIVATE | COMMUNAL; PRIVATE returns this pet's ashes, COMMUNAL pools with others", constraints: "PRIVATE | COMMUNAL" }
      - { name: expedited, type: boolean, source: input, description: "If true, adds expedite surcharge to private cremation charge", default: false }
      - { name: pickup_kind, type: enum, source: input, description: "CLINIC | HOME; where the body is collected from" }
      - { name: bill_to, type: enum, source: input, description: "CLINIC_ACCOUNT | OWNER; party billed for this case", constraints: "CLINIC_ACCOUNT requires clinic_id set" }
      - { name: custody_status, type: enum, source: system, description: "INTAKE_PENDING | IN_TRANSIT | RECEIVED | IN_COOLER | STAGED | CREMATED | READY_FOR_RETURN | RETURNED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "NOT_BILLABLE | BILLABLE | INVOICED | SETTLED. Independent of custody_status." }
      - { name: cremation_charge_cents, type: integer, source: computed, description: "PRIVATE: PRIVATE_RATE[weight_tier] + (expedited?EXPEDITE_SURCHARGE:0). COMMUNAL: allocated share of batch communal_firing_total_cents, set on batch FIRING. 0 until determined." }
      - { name: custody_chain_open, type: boolean, source: computed, description: "True while the chain-of-custody is not yet closed by a RETURN_TO_OWNER or DISPOSED_COMMUNAL terminal CustodyEvent." }

  - name: TransportLeg
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; case being transported" }
      - { name: origin_kind, type: enum, source: input, description: "CLINIC | HOME; pickup location type" }
      - { name: origin_label, type: string, source: input, description: "Free-text pickup address or clinic name" }
      - { name: driver_name, type: string, source: input, description: "Assigned transport driver" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | EN_ROUTE | ARRIVED | CANCELLED" }

  - name: CustodyEvent
    parent: Case
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; case this custody record belongs to" }
      - { name: seq, type: integer, source: system, description: "Monotonic per-case sequence number starting at 1, +1 per appended event; defines chain order" }
      - { name: event_type, type: enum, source: system, description: "INTAKE | TRANSPORT_PICKUP | RECEIVED_AT_FACILITY | COOLER_IN | COOLER_OUT | STAGED | CREMATED | RETURN_TO_OWNER | DISPOSED_COMMUNAL | CANCELLED" }
      - { name: custodian, type: string, source: system, description: "Identifier of the party holding custody at this hop (driver_name, operator id, or owner)" }
      - { name: occurred_at, type: datetime, source: system, description: "Logical-clock timestamp when the event was appended" }

  - name: KeepsakeOrder
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; case this keepsake belongs to" }
      - { name: item_type, type: enum, source: input, description: "PAW_PRINT | CLAY_IMPRESSION | FUR_CLIPPING | URN | PENDANT", constraints: "PAW_PRINT | CLAY_IMPRESSION | FUR_CLIPPING | URN | PENDANT" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Catalog price for item_type from KEEPSAKE_CATALOG_CENTS" }
      - { name: status, type: enum, source: system, description: "ORDERED | IN_PRODUCTION | READY | CANCELLED" }

  - name: CertificateRecord
    parent: Case
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; case the certificate certifies" }
      - { name: certificate_number, type: string, source: system, description: "Sequential certificate number assigned on issuance" }
      - { name: pet_name, type: string, source: system, description: "Snapshot of Case.pet_name at issuance" }
      - { name: service_type, type: enum, source: system, description: "Snapshot of Case.service_type at issuance" }
      - { name: cremated_at, type: datetime, source: system, description: "Logical-clock timestamp the certifying cremation completed" }
      - { name: status, type: enum, source: system, description: "ISSUED | VOID" }

  - name: ReturnRoute
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; case whose ashes are being returned" }
      - { name: return_method, type: enum, source: input, description: "PICKUP_AT_FACILITY | COURIER_TO_CLINIC | COURIER_TO_HOME", constraints: "PICKUP_AT_FACILITY | COURIER_TO_CLINIC | COURIER_TO_HOME" }
      - { name: destination_label, type: string, source: input, description: "Drop-off address or pickup contact" }
      - { name: status, type: enum, source: system, description: "PLANNED | DISPATCHED | DELIVERED | CANCELLED" }

  - name: MemorialAddon
    parent: Case
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; case this memorial add-on is for" }
      - { name: addon_type, type: enum, source: input, description: "ONLINE_MEMORIAL | VIEWING_SESSION | TRIBUTE_VIDEO", constraints: "ONLINE_MEMORIAL | VIEWING_SESSION | TRIBUTE_VIDEO" }
      - { name: price_cents, type: integer, source: computed, description: "Catalog price for addon_type from MEMORIAL_CATALOG_CENTS" }
      - { name: viewing_room_code, type: string, source: input, description: "Viewing room code (e.g. ROOM-1); required only when addon_type=VIEWING_SESSION, else null", default: null }
      - { name: viewing_start, type: datetime, source: input, description: "ISO 8601 UTC viewing window start (inclusive); required for VIEWING_SESSION", default: null }
      - { name: viewing_end, type: datetime, source: input, description: "ISO 8601 UTC viewing window end (exclusive); required for VIEWING_SESSION; must be after viewing_start", default: null }
      - { name: status, type: enum, source: system, description: "BOOKED | FULFILLED | CANCELLED" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id; case being invoiced" }
      - { name: clinic_id, type: string, source: system, description: "FK -> Clinic.id; set when bill_to=CLINIC_ACCOUNT, else null", default: null }
      - { name: bill_to, type: enum, source: system, description: "Snapshot of Case.bill_to at invoice creation: CLINIC_ACCOUNT | OWNER" }
      - { name: subtotal_cents, type: integer, source: computed, description: "cremation_charge_cents + sum(KeepsakeOrder.unit_price_cents for status != CANCELLED) + sum(MemorialAddon.price_cents for status != CANCELLED)" }
      - { name: handling_fee_cents, type: integer, source: computed, description: "Fee tier keyed on subtotal_cents (see invoice_total calculation); waived (0) for bill_to=CLINIC_ACCOUNT" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents + handling_fee_cents" }
      - { name: status, type: enum, source: system, description: "ISSUED | PAID | VOID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # --- Case axis 1: custody_status (physical chain-of-custody lifecycle) ---
  - entity: Case
    field: custody_status
    initial_state: INTAKE_PENDING
    terminal_states: [RETURNED, CANCELLED]
    note: "Parallel axis with billing_status; the two evolve independently."
    transitions:
      - from: INTAKE_PENDING
        to: IN_TRANSIT
        trigger: "POST /cases/{id}/transport-legs (create first transport leg)"
        actor: CrematoryOperator
        preconditions:
          - "Case.custody_status == INTAKE_PENDING"
        side_effects:
          - "Create TransportLeg with status=ASSIGNED"
          - "Append CustodyEvent TRANSPORT_PICKUP (custodian = driver_name)"
          - "Set updated_at; increment Case.version by 1"

      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /cases/{id}/receive"
        actor: CrematoryOperator
        preconditions:
          - "Case.custody_status == IN_TRANSIT"
          - "Case has a TransportLeg in status ARRIVED (set via PATCH transport-leg status=ARRIVED)"
        side_effects:
          - "Append CustodyEvent RECEIVED_AT_FACILITY"
          - "Set Case.billing_status: NOT_BILLABLE -> BILLABLE (intake recognized for accrual statement basis)"
          - "Set updated_at; increment Case.version by 1"

      - from: RECEIVED
        to: IN_COOLER
        trigger: "POST /cases/{id}/store"
        actor: CrematoryOperator
        preconditions:
          - "Case.custody_status == RECEIVED"
          - "Target Cooler.status == AVAILABLE (cross-entity: occupied_count < total_capacity)"
        side_effects:
          - "Set Case.cooler_id = target cooler"
          - "Increment Cooler.occupied_count by 1; recompute Cooler.available_capacity and Cooler.status (AVAILABLE->FULL if occupied_count reaches total_capacity)"
          - "Append CustodyEvent COOLER_IN (custodian = cooler.label)"
          - "Set updated_at; increment Case.version by 1"

      - from: [RECEIVED, IN_COOLER]
        to: STAGED
        trigger: "POST /batches/{id}/assign-case"
        actor: CrematoryOperator
        preconditions:
          - "Case.custody_status IN {RECEIVED, IN_COOLER}"
          - "Target CremationBatch.status == OPEN"
          - "Case.service_type == CremationBatch.service_type"
          - "If batch.service_type == PRIVATE, batch.member_count == 0 (private holds exactly one)"
        side_effects:
          - "Set Case.batch_id = target batch"
          - "If Case was IN_COOLER: clear Case.cooler_id, decrement Cooler.occupied_count, recompute Cooler.available_capacity and Cooler.status (FULL->AVAILABLE if a slot frees), append CustodyEvent COOLER_OUT"
          - "Append CustodyEvent STAGED"
          - "Recompute CremationBatch.member_count and loaded_weight_lbs"
          - "Set updated_at; increment Case.version by 1"

      - from: STAGED
        to: CREMATED
        trigger: "system (CremationBatch FIRING -> COMPLETED cascade)"
        actor: system
        preconditions:
          - "Case.custody_status == STAGED"
          - "Case.batch_id's CremationBatch.status == COMPLETED (cross-entity)"
        side_effects:
          - "Append CustodyEvent CREMATED (custodian = operator)"
          - "Issue CertificateRecord (status=ISSUED) for the case (next certificate_number)"
          - "Set Case.billing_status BILLABLE -> BILLABLE (no-op; completion-basis recognition handled by clinic statement calc)"
          - "Set updated_at; increment Case.version by 1"

      - from: CREMATED
        to: READY_FOR_RETURN
        trigger: "POST /cases/{id}/ready-return"
        actor: CrematoryOperator
        preconditions:
          - "Case.custody_status == CREMATED"
          - "Case has an ISSUED CertificateRecord"
        side_effects:
          - "Create ReturnRoute (status=PLANNED) using request return_method/destination_label"
          - "Set updated_at; increment Case.version by 1"

      - from: READY_FOR_RETURN
        to: RETURNED
        trigger: "POST /cases/{id}/finalize-return"
        actor: CrematoryOperator
        preconditions:
          - "Case.custody_status == READY_FOR_RETURN"
          - "Case service_type == PRIVATE (COMMUNAL cases are disposed, not returned)"
          - "Case has a ReturnRoute in status DISPATCHED (cross-entity)"
        side_effects:
          - "ReturnRoute.status DISPATCHED -> DELIVERED"
          - "Append CustodyEvent RETURN_TO_OWNER; set Case.custody_chain_open = false"
          - "Set updated_at; increment Case.version by 1"

      - from: [INTAKE_PENDING, IN_TRANSIT, RECEIVED, IN_COOLER, STAGED]
        to: CANCELLED
        trigger: "POST /cases/{id}/cancel"
        actor: CrematoryOperator
        preconditions:
          - "Case.custody_status IN {INTAKE_PENDING, IN_TRANSIT, RECEIVED, IN_COOLER, STAGED}"
          - "Case.batch_id is null OR batch.status == OPEN (cannot cancel a case in a FIRING/COMPLETED batch)"
        side_effects:
          - "If Case was IN_COOLER: clear Case.cooler_id, decrement Cooler.occupied_count, recompute Cooler.available_capacity and Cooler.status, append CustodyEvent COOLER_OUT"
          - "If Case was STAGED: clear Case.batch_id, recompute batch.member_count and loaded_weight_lbs"
          - "Cancel any TransportLeg not already CANCELLED (status -> CANCELLED)"
          - "Void any ISSUED Invoice for this case (status -> VOID); recompute Clinic.outstanding_balance_cents and account_status if clinic-billed"
          - "Append CustodyEvent CANCELLED; set Case.custody_chain_open = false"
          - "Set updated_at; increment Case.version by 1"

  # --- Case axis 2: billing_status (independent of custody_status) ---
  - entity: Case
    field: billing_status
    initial_state: NOT_BILLABLE
    terminal_states: [SETTLED]
    note: "Parallel axis; transitions to BILLABLE on receive, to INVOICED on invoice issue, to SETTLED on invoice pay."
    transitions:
      - from: NOT_BILLABLE
        to: BILLABLE
        trigger: "system (Case custody RECEIVED)"
        actor: system
        preconditions:
          - "Case.custody_status reached RECEIVED"
        side_effects:
          - "Case becomes eligible for invoicing"

      - from: BILLABLE
        to: INVOICED
        trigger: "POST /cases/{id}/invoices"
        actor: CrematoryAdmin
        preconditions:
          - "Case.billing_status == BILLABLE"
          - "Case.custody_status == CREMATED (invoice only after cremation completes)"
        side_effects:
          - "Create Invoice (status=ISSUED), snapshot bill_to, compute subtotal/handling_fee/total"
          - "If bill_to == CLINIC_ACCOUNT: increment Clinic.outstanding_balance_cents by Invoice.total_cents; recompute Clinic.account_status"
          - "Set updated_at; increment Case.version by 1"

      - from: INVOICED
        to: BILLABLE
        trigger: "system (Invoice voided via POST /invoices/{id}/void or case cancel)"
        actor: system
        preconditions:
          - "The case's ISSUED Invoice was voided"
        side_effects:
          - "If clinic-billed: decrement Clinic.outstanding_balance_cents by the voided Invoice.total_cents; recompute account_status"

      - from: INVOICED
        to: SETTLED
        trigger: "system (Invoice paid via POST /invoices/{id}/pay)"
        actor: system
        preconditions:
          - "The case's ISSUED Invoice transitioned to PAID"
        side_effects:
          - "If clinic-billed: decrement Clinic.outstanding_balance_cents by the paid Invoice.total_cents; recompute account_status"

  # --- CremationBatch (branching fork-join: PRIVATE vs COMMUNAL diverge) ---
  - entity: CremationBatch
    field: status
    initial_state: OPEN
    terminal_states: [RECONCILED]
    transitions:
      - from: OPEN
        to: LOADED
        trigger: "POST /batches/{id}/load"
        actor: CrematoryOperator
        preconditions:
          - "CremationBatch.status == OPEN"
          - "member_count >= 1"
          - "loaded_weight_lbs <= Retort.max_load_lbs (cross-entity)"
          - "If service_type == PRIVATE, member_count == 1"
        side_effects:
          - "Set updated_at; increment CremationBatch.version by 1"

      - from: LOADED
        to: FIRING
        trigger: "POST /batches/{id}/fire"
        actor: CrematoryOperator
        preconditions:
          - "CremationBatch.status == LOADED"
          - "member_count >= 1 (no empty firing)"
          - "No other batch on the same Retort occupies an overlapping [scheduled_start, scheduled_end) window in status FIRING (cross-entity temporal overlap, half-open)"
        side_effects:
          - "COMMUNAL branch: set communal_firing_total_cents = COMMUNAL_FIRING_TOTAL_CENTS; allocate each member Case.cremation_charge_cents by weight proportion (round half-up per case; last member by created_at ASC absorbs the remainder)"
          - "PRIVATE branch: set the single member Case.cremation_charge_cents = PRIVATE_RATE[weight_tier] + (expedited?EXPEDITE_SURCHARGE:0); communal_firing_total_cents stays 0"
          - "Set updated_at; increment CremationBatch.version by 1"

      - from: FIRING
        to: COMPLETED
        trigger: "POST /batches/{id}/complete"
        actor: CrematoryOperator
        preconditions:
          - "CremationBatch.status == FIRING"
        side_effects:
          - "CASCADE: each member Case (custody_status==STAGED) -> CREMATED (appends CREMATED CustodyEvent, issues CertificateRecord)"
          - "CASCADE: each member Case that was IN_COOLER at staging has already released its slot; no cooler change here"
          - "Set updated_at; increment CremationBatch.version by 1"

      - from: COMPLETED
        to: RECONCILED
        trigger: "POST /batches/{id}/reconcile"
        actor: CrematoryAdmin
        preconditions:
          - "CremationBatch.status == COMPLETED"
          - "Every member Case.custody_status IN {CREMATED, READY_FOR_RETURN, RETURNED}"
        side_effects:
          - "COMMUNAL branch: append CustodyEvent DISPOSED_COMMUNAL to every member Case still in CREMATED and set its custody_chain_open=false"
          - "Set updated_at; increment CremationBatch.version by 1"

  # --- Cooler (cyclic: AVAILABLE -> FULL -> AVAILABLE) ---
  - entity: Cooler
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    note: "Status is derived from occupied_count; cycles as cases enter/leave."
    transitions:
      - from: AVAILABLE
        to: FULL
        trigger: "system (Case stored bringing occupied_count to total_capacity)"
        actor: system
        preconditions:
          - "occupied_count + 1 == total_capacity after a store"
        side_effects:
          - "No further stores accepted until a slot frees"

      - from: FULL
        to: AVAILABLE
        trigger: "system (Case leaves cooler via store-out: stage, cancel, or manual release)"
        actor: system
        preconditions:
          - "occupied_count drops below total_capacity"
        side_effects:
          - "Cooler accepts stores again"

  # --- TransportLeg (linear with cancel revert) ---
  - entity: TransportLeg
    field: status
    initial_state: ASSIGNED
    terminal_states: [ARRIVED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: EN_ROUTE
        trigger: "PATCH /transport-legs/{id} status=EN_ROUTE"
        actor: CrematoryOperator
        preconditions:
          - "TransportLeg.status == ASSIGNED"
        side_effects:
          - "Set updated_at; increment TransportLeg.version by 1"

      - from: EN_ROUTE
        to: ARRIVED
        trigger: "PATCH /transport-legs/{id} status=ARRIVED"
        actor: CrematoryOperator
        preconditions:
          - "TransportLeg.status == EN_ROUTE"
        side_effects:
          - "Set updated_at; increment TransportLeg.version by 1"

      - from: [ASSIGNED, EN_ROUTE]
        to: CANCELLED
        trigger: "PATCH /transport-legs/{id} status=CANCELLED, or system (Case cancel)"
        actor: "CrematoryOperator or system"
        preconditions:
          - "TransportLeg.status IN {ASSIGNED, EN_ROUTE}"
        side_effects:
          - "Set updated_at; increment TransportLeg.version by 1"

  # --- ReturnRoute (linear with cancel revert) ---
  - entity: ReturnRoute
    field: status
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /return-routes/{id}/dispatch"
        actor: CrematoryOperator
        preconditions:
          - "ReturnRoute.status == PLANNED"
          - "The route's Case.custody_status == READY_FOR_RETURN (cross-entity)"
        side_effects:
          - "Set updated_at; increment ReturnRoute.version by 1"

      - from: DISPATCHED
        to: DELIVERED
        trigger: "system (Case finalize-return cascade)"
        actor: system
        preconditions:
          - "Owning Case transitioned READY_FOR_RETURN -> RETURNED"
        side_effects:
          - "Set updated_at; increment ReturnRoute.version by 1"

      - from: [PLANNED, DISPATCHED]
        to: CANCELLED
        trigger: "POST /return-routes/{id}/cancel"
        actor: CrematoryOperator
        preconditions:
          - "ReturnRoute.status IN {PLANNED, DISPATCHED}"
        side_effects:
          - "Set updated_at; increment ReturnRoute.version by 1"

  # --- Invoice (linear with void/pay terminal split) ---
  - entity: Invoice
    field: status
    initial_state: ISSUED
    terminal_states: [PAID, VOID]
    transitions:
      - from: ISSUED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: "CrematoryAdmin or PetOwner"
        preconditions:
          - "Invoice.status == ISSUED"
        side_effects:
          - "CASCADE: Case.billing_status INVOICED -> SETTLED"
          - "If bill_to == CLINIC_ACCOUNT: decrement Clinic.outstanding_balance_cents by total_cents; recompute Clinic.account_status (DELINQUENT->CURRENT if balance falls to/under credit_limit_cents)"
          - "Set updated_at; increment Invoice.version by 1"

      - from: ISSUED
        to: VOID
        trigger: "POST /invoices/{id}/void, or system (Case cancel)"
        actor: "CrematoryAdmin or system"
        preconditions:
          - "Invoice.status == ISSUED"
        side_effects:
          - "CASCADE: Case.billing_status INVOICED -> BILLABLE"
          - "If bill_to == CLINIC_ACCOUNT: decrement Clinic.outstanding_balance_cents by total_cents; recompute Clinic.account_status"
          - "Set updated_at; increment Invoice.version by 1"

  # --- KeepsakeOrder (linear with cancel revert) ---
  - entity: KeepsakeOrder
    field: status
    initial_state: ORDERED
    terminal_states: [READY, CANCELLED]
    transitions:
      - from: ORDERED
        to: IN_PRODUCTION
        trigger: "PATCH /keepsake-orders/{id} status=IN_PRODUCTION"
        actor: CrematoryOperator
        preconditions: ["KeepsakeOrder.status == ORDERED"]
        side_effects: ["Set updated_at; increment version by 1"]
      - from: IN_PRODUCTION
        to: READY
        trigger: "PATCH /keepsake-orders/{id} status=READY"
        actor: CrematoryOperator
        preconditions: ["KeepsakeOrder.status == IN_PRODUCTION"]
        side_effects: ["Set updated_at; increment version by 1"]
      - from: [ORDERED, IN_PRODUCTION]
        to: CANCELLED
        trigger: "PATCH /keepsake-orders/{id} status=CANCELLED"
        actor: CrematoryOperator
        preconditions:
          - "KeepsakeOrder.status IN {ORDERED, IN_PRODUCTION}"
          - "The case has no ISSUED Invoice (cancelling priced line items after invoicing is blocked)"
        side_effects: ["Set updated_at; increment version by 1"]

  # --- MemorialAddon (linear with cancel revert) ---
  - entity: MemorialAddon
    field: status
    initial_state: BOOKED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: BOOKED
        to: FULFILLED
        trigger: "PATCH /memorial-addons/{id} status=FULFILLED"
        actor: CrematoryOperator
        preconditions: ["MemorialAddon.status == BOOKED"]
        side_effects: ["Set updated_at; increment version by 1"]
      - from: BOOKED
        to: CANCELLED
        trigger: "PATCH /memorial-addons/{id} status=CANCELLED"
        actor: CrematoryOperator
        preconditions:
          - "MemorialAddon.status == BOOKED"
          - "The case has no ISSUED Invoice"
        side_effects: ["Set updated_at; increment version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (true races only — OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: invoice-create-stale-case
    parent_entity: Case
    write_endpoint: "POST /cases/{id}/invoices"
    occ_field: "expected_case_version"
    description: |
      Issuing an Invoice against a Case whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has already issued an Invoice for the same Case (legitimately
      moving billing_status BILLABLE -> INVOICED and bumping Case.version); the
      current writer's stale view of the Case would otherwise create a second,
      superseding Invoice. The loser sends an expected_case_version that no
      longer matches and is rejected.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: weight_tier
    trigger: "Case create; whenever weight_lbs is set"
    algorithm: threshold
    formula: |
      if weight_lbs <= 25:        weight_tier = SMALL
      elif weight_lbs <= 75:      weight_tier = MEDIUM
      elif weight_lbs <= 150:     weight_tier = LARGE
      else:                       weight_tier = XLARGE
    input_set: "single Case.weight_lbs"
    constants:
      SMALL_MAX: 25
      MEDIUM_MAX: 75
      LARGE_MAX: 150
    precision: "integer pounds; boundary is inclusive on the upper bound (25 -> SMALL, 26 -> MEDIUM)"

  - name: case_cremation_charge
    trigger: "CremationBatch FIRING transition (LOADED -> FIRING)"
    algorithm: tiered_pricing
    formula: |
      # PRIVATE variant (per-case flat tier):
      private_charge = PRIVATE_RATE[weight_tier] + (EXPEDITE_SURCHARGE if expedited else 0)

      # COMMUNAL variant (pooled, allocated by weight proportion):
      # On FIRING of a COMMUNAL batch with members M ordered by created_at ASC:
      #   total_w = sum(m.weight_lbs for m in M)
      #   for each m: raw = COMMUNAL_FIRING_TOTAL_CENTS * m.weight_lbs / total_w
      #               share[m] = round_half_up(raw)            # per-case rounding FIRST
      #   remainder = COMMUNAL_FIRING_TOTAL_CENTS - sum(share)  # may be +/-1..n cents
      #   share[last member by created_at ASC] += remainder      # last absorbs remainder
      #   m.cremation_charge_cents = share[m]
    input_set: "All member Cases of the batch with custody_status NOT IN {CANCELLED}"
    constants:
      PRIVATE_RATE: { SMALL: 12000, MEDIUM: 18000, LARGE: 26000, XLARGE: 38000 }
      EXPEDITE_SURCHARGE: 5000
      COMMUNAL_FIRING_TOTAL_CENTS: 30000
    precision: "cents, round_half_up; communal allocation pins round-per-case-then-sum, last member (created_at ASC) absorbs remainder"
    variants:
      - name: private_flat
        when: "Case.service_type == PRIVATE (batch.service_type == PRIVATE)"
        difference: "Flat tier rate plus expedite surcharge; ignores other cases"
      - name: communal_allocated
        when: "Case.service_type == COMMUNAL (batch.service_type == COMMUNAL)"
        difference: "Weight-proportional share of a fixed pooled firing cost; depends on sibling members' weights and rounding order"

  - name: invoice_total
    trigger: "Invoice create (POST /cases/{id}/invoices)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned (subtotal first, then fee from subtotal tier, then total):
      subtotal = cremation_charge_cents
               + sum(k.unit_price_cents for k in KeepsakeOrders if k.status != CANCELLED)
               + sum(a.price_cents      for a in MemorialAddons  if a.status != CANCELLED)
      if bill_to == CLINIC_ACCOUNT:
          handling_fee = 0                          # clinic-account waives handling
      else:                                          # bill_to == OWNER
          if   subtotal <  20000:  handling_fee = 2500
          elif subtotal <= 50000:  handling_fee = 1500
          else:                    handling_fee = 0
      total = subtotal + handling_fee
    input_set: "The invoiced Case's cremation_charge_cents plus its non-CANCELLED KeepsakeOrders and MemorialAddons"
    constants:
      FEE_LOW_TIER_MAX_EXCLUSIVE: 20000
      FEE_MID_TIER_MAX_INCLUSIVE: 50000
      FEE_LOW_CENTS: 2500
      FEE_MID_CENTS: 1500
      FEE_HIGH_CENTS: 0
      KEEPSAKE_CATALOG_CENTS: { PAW_PRINT: 4500, CLAY_IMPRESSION: 5500, FUR_CLIPPING: 2000, URN: 8000, PENDANT: 9500 }
      MEMORIAL_CATALOG_CENTS: { ONLINE_MEMORIAL: 3000, VIEWING_SESSION: 12000, TRIBUTE_VIDEO: 7000 }
    precision: "cents; fee tier boundaries: <20000 low, 20000..50000 inclusive mid, >50000 high(0)"
    variants:
      - name: owner_billed
        when: "Case.bill_to == OWNER"
        difference: "Handling fee tier applied from subtotal"
      - name: clinic_account_billed
        when: "Case.bill_to == CLINIC_ACCOUNT"
        difference: "Handling fee waived (0); same subtotal; total == subtotal"

  - name: clinic_statement_balance
    trigger: "GET /clinics/{id}/statement?basis=ACCRUAL|COMPLETION (read-only computed report)"
    algorithm: aggregation
    formula: |
      # Two valid recognition bases over the same clinic's clinic-account cases:
      # ACCRUAL basis: recognize a case's charge once it is intake-RECEIVED.
      #   accrual_balance = sum(case.cremation_charge_cents
      #                         for case in clinic cases
      #                         if case.bill_to == CLINIC_ACCOUNT
      #                         and case.custody_status IN {RECEIVED, IN_COOLER, STAGED, CREMATED, READY_FOR_RETURN, RETURNED})
      # COMPLETION basis: recognize only after cremation completes.
      #   completion_balance = sum(case.cremation_charge_cents
      #                            for case in clinic cases
      #                            if case.bill_to == CLINIC_ACCOUNT
      #                            and case.custody_status IN {CREMATED, READY_FOR_RETURN, RETURNED})
      # Note: cremation_charge_cents is 0 until the batch fires, so an accrual-recognized
      #       case still STAGED contributes 0; the divergence appears once charges are set.
    input_set: "All Cases with clinic_id == this Clinic and bill_to == CLINIC_ACCOUNT, filtered by custody_status per basis"
    constants: {}
    precision: "cents; integer sum"
    variants:
      - name: accrual
        when: "basis=ACCRUAL"
        difference: "Includes RECEIVED-and-later cases; recognizes earlier"
      - name: completion
        when: "basis=COMPLETION"
        difference: "Includes only CREMATED-and-later cases; recognizes later — diverges from accrual while cases are received but not yet cremated"

  - name: cooler_occupancy
    trigger: "Case store (RECEIVED->IN_COOLER), stage (IN_COOLER->STAGED), cancel from IN_COOLER, or manual release"
    algorithm: aggregation
    formula: |
      occupied_count = count(Case where cooler_id == this.id and custody_status == IN_COOLER)
      available_capacity = max(0, total_capacity - occupied_count)
      status = FULL if occupied_count >= total_capacity else AVAILABLE
    input_set: "All Cases currently assigned to this Cooler with custody_status == IN_COOLER"
    constants: {}
    precision: "integer; available_capacity floored at 0"

  - name: clinic_outstanding_balance
    trigger: "Invoice issue (clinic-account), Invoice void, Invoice pay, Case cancel that voids an invoice"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = sum(inv.total_cents
                                      for inv in Invoices
                                      where inv.clinic_id == this.id
                                      and inv.bill_to == CLINIC_ACCOUNT
                                      and inv.status == ISSUED)
      account_status = DELINQUENT if outstanding_balance_cents > credit_limit_cents else CURRENT
    input_set: "All Invoices for this Clinic in status ISSUED with bill_to == CLINIC_ACCOUNT"
    constants: {}
    precision: "cents; integer sum; never negative"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for the operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist (validated left-to-right); FK targets in body exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Required body fields present and well-typed; enum values valid; numbers within declared bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 5
    category: business_referential
    check: "Ownership: PetOwner may only act on Cases/Invoices for owner_id == X-User-ID; ClinicStaff only on Cases with clinic_id == X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "owner/clinic-scoped reads and pays"

  - priority: 6
    category: business_referential
    check: "bill_to == CLINIC_ACCOUNT requires Case.clinic_id to be set"
    error_id: ERR_CLINIC_REQUIRED_FOR_ACCOUNT_BILLING
    http_status: 422
    applies_to: "POST /cases"

  - priority: 7
    category: state
    check: "OCC: expected_case_version matches Case.version on invoice create"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /cases/{id}/invoices"

  - priority: 8
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 9
    category: business_safety
    check: "Service-type integrity: a Case may only be assigned to a CremationBatch with matching service_type; PRIVATE batch holds exactly one case"
    error_id: ERR_SERVICE_TYPE_MISMATCH
    http_status: 409
    applies_to: "POST /batches/{id}/assign-case"

  - priority: 10
    category: business_safety
    check: "Chain-of-custody integrity: a Case may not be received/stored/staged unless its custody chain is continuous (previous required CustodyEvent present)"
    error_id: ERR_CUSTODY_CHAIN_BROKEN
    http_status: 409
    applies_to: "POST /cases/{id}/receive, /store, assign-case"

  - priority: 11
    category: business_temporal
    check: "Retort scheduling: firing window [scheduled_start, scheduled_end) must not overlap another FIRING batch on the same Retort (half-open; touching endpoints OK)"
    error_id: ERR_RETORT_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /batches/{id}/fire"

  - priority: 12
    category: business_temporal
    check: "Viewing room scheduling: a VIEWING_SESSION window plus VIEWING_BUFFER_MINUTES must not collide with another non-CANCELLED VIEWING_SESSION in the same viewing_room_code (buffered interval)"
    error_id: ERR_VIEWING_ROOM_CONFLICT
    http_status: 409
    applies_to: "POST /cases/{id}/memorial-addons"

  - priority: 13
    category: business_constraint
    check: "Retort load: batch loaded_weight_lbs must not exceed Retort.max_load_lbs"
    error_id: ERR_RETORT_OVERLOADED
    http_status: 409
    applies_to: "POST /batches/{id}/load"

  - priority: 14
    category: business_constraint
    check: "Cooler capacity: a store is rejected when target Cooler.occupied_count >= total_capacity"
    error_id: ERR_COOLER_FULL
    http_status: 409
    applies_to: "POST /cases/{id}/store"

  - priority: 15
    category: business_fiscal
    check: "Clinic credit limit: issuing a CLINIC_ACCOUNT invoice that would push outstanding_balance_cents above credit_limit_cents is blocked"
    error_id: ERR_CLINIC_CREDIT_EXCEEDED
    http_status: 409
    applies_to: "POST /cases/{id}/invoices"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------- Test-driving: logical clock ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock used for CustodyEvent.occurred_at, certificate cremated_at, and scheduling. Server startup default is 2026-01-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [CrematoryAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Sets the logical clock to to_iso8601"]

  # ---------- Clinic ----------
  - method: POST
    path: "/clinics"
    description: "Create a clinic account"
    roles: [CrematoryAdmin]
    code: 201
    input: [name, account_code, "credit_limit_cents?"]
    output: Clinic
    side_effects: ["outstanding_balance_cents=0, account_status=CURRENT"]

  - method: GET
    path: "/clinics/{id}"
    description: "Get a clinic"
    roles: [CrematoryAdmin, CrematoryOperator, ClinicStaff]
    code: 200
    input: []
    output: Clinic
    side_effects: []

  - method: GET
    path: "/clinics"
    description: "List clinics"
    roles: [CrematoryAdmin, CrematoryOperator]
    code: 200
    input: ["limit?", "offset?", "account_status?"]
    output: Clinic[]
    side_effects: []

  - method: GET
    path: "/clinics/{id}/statement"
    description: "Computed clinic statement balance under a chosen recognition basis"
    roles: [CrematoryAdmin, ClinicStaff]
    code: 200
    input: ["basis?"]
    output: "{ clinic_id: string, basis: string, balance_cents: integer }"
    side_effects: []

  # ---------- PetOwner ----------
  - method: POST
    path: "/petowners"
    description: "Create a pet owner"
    roles: [CrematoryAdmin, CrematoryOperator, ClinicStaff]
    code: 201
    input: [full_name, email, phone]
    output: PetOwner
    side_effects: []

  - method: GET
    path: "/petowners/{id}"
    description: "Get a pet owner"
    roles: [CrematoryAdmin, CrematoryOperator, ClinicStaff, PetOwner]
    code: 200
    input: []
    output: PetOwner
    side_effects: []

  # ---------- Cooler ----------
  - method: POST
    path: "/coolers"
    description: "Create a cooler unit"
    roles: [CrematoryAdmin]
    code: 201
    input: [label, total_capacity]
    output: Cooler
    side_effects: ["occupied_count=0, available_capacity=total_capacity, status=AVAILABLE"]

  - method: GET
    path: "/coolers/{id}"
    description: "Get a cooler"
    roles: [CrematoryAdmin, CrematoryOperator]
    code: 200
    input: []
    output: Cooler
    side_effects: []

  - method: GET
    path: "/coolers"
    description: "List coolers"
    roles: [CrematoryAdmin, CrematoryOperator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Cooler[]
    side_effects: []

  # ---------- Retort ----------
  - method: POST
    path: "/retorts"
    description: "Create a cremation retort (oven)"
    roles: [CrematoryAdmin]
    code: 201
    input: [label, max_load_lbs]
    output: Retort
    side_effects: []

  - method: GET
    path: "/retorts/{id}"
    description: "Get a retort"
    roles: [CrematoryAdmin, CrematoryOperator]
    code: 200
    input: []
    output: Retort
    side_effects: []

  # ---------- CremationBatch ----------
  - method: POST
    path: "/batches"
    description: "Create a cremation batch on a retort"
    roles: [CrematoryOperator, CrematoryAdmin]
    code: 201
    input: [retort_id, service_type, scheduled_start, scheduled_end]
    output: CremationBatch
    side_effects: ["status=OPEN, member_count=0, loaded_weight_lbs=0, communal_firing_total_cents=0"]

  - method: GET
    path: "/batches/{id}"
    description: "Get a cremation batch"
    roles: [CrematoryAdmin, CrematoryOperator]
    code: 200
    input: []
    output: CremationBatch
    side_effects: []

  - method: GET
    path: "/batches"
    description: "List cremation batches; filter by retort_id"
    roles: [CrematoryAdmin, CrematoryOperator]
    code: 200
    input: ["limit?", "offset?", "retort_id?", "status?", "service_type?"]
    output: CremationBatch[]
    side_effects: []

  - method: GET
    path: "/batches/{id}/cases"
    description: "List member Cases of a batch (reverse-reachability for Case.batch_id)"
    roles: [CrematoryAdmin, CrematoryOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: Case[]
    side_effects: []

  - method: POST
    path: "/batches/{id}/assign-case"
    description: "Assign a Case to this batch (Case RECEIVED/IN_COOLER -> STAGED)"
    roles: [CrematoryOperator]
    code: 200
    input: [case_id]
    output: CremationBatch
    side_effects: ["Case -> STAGED; cooler slot released if was IN_COOLER; member_count/loaded_weight_lbs recomputed"]

  - method: POST
    path: "/batches/{id}/load"
    description: "Mark batch LOADED"
    roles: [CrematoryOperator]
    code: 200
    input: []
    output: CremationBatch
    side_effects: ["status OPEN -> LOADED"]

  - method: POST
    path: "/batches/{id}/fire"
    description: "Fire the batch (LOADED -> FIRING); allocates cremation charges"
    roles: [CrematoryOperator]
    code: 200
    input: []
    output: CremationBatch
    side_effects: ["status LOADED -> FIRING", "allocate member Case.cremation_charge_cents (private flat or communal weight-proportional)"]

  - method: POST
    path: "/batches/{id}/complete"
    description: "Complete the firing (FIRING -> COMPLETED); cascades members to CREMATED"
    roles: [CrematoryOperator]
    code: 200
    input: []
    output: CremationBatch
    side_effects: ["status FIRING -> COMPLETED", "CASCADE: member Cases STAGED -> CREMATED; CertificateRecords issued"]

  - method: POST
    path: "/batches/{id}/reconcile"
    description: "Reconcile a completed batch (COMPLETED -> RECONCILED)"
    roles: [CrematoryAdmin]
    code: 200
    input: []
    output: CremationBatch
    side_effects: ["status COMPLETED -> RECONCILED", "COMMUNAL: members still CREMATED get DISPOSED_COMMUNAL custody event; custody_chain_open=false"]

  # ---------- Case ----------
  - method: POST
    path: "/cases"
    description: "Create an intake Case"
    roles: [CrematoryOperator, ClinicStaff]
    code: 201
    input: ["clinic_id?", owner_id, pet_name, species, weight_lbs, service_type, "expedited?", pickup_kind, bill_to]
    output: Case
    side_effects: ["custody_status=INTAKE_PENDING, billing_status=NOT_BILLABLE, weight_tier computed, cremation_charge_cents=0, custody_chain_open=true; append CustodyEvent INTAKE"]

  - method: GET
    path: "/cases/{id}"
    description: "Get a case"
    roles: [CrematoryAdmin, CrematoryOperator, ClinicStaff, PetOwner]
    code: 200
    input: []
    output: Case
    side_effects: []

  - method: GET
    path: "/cases"
    description: "List cases; filter by clinic_id, owner_id, batch_id, cooler_id"
    roles: [CrematoryAdmin, CrematoryOperator, ClinicStaff, PetOwner]
    code: 200
    input: ["limit?", "offset?", "clinic_id?", "owner_id?", "batch_id?", "cooler_id?", "custody_status?", "billing_status?"]
    output: Case[]
    side_effects: []

  - method: POST
    path: "/cases/{id}/transport-legs"
    description: "Create a transport leg (Case INTAKE_PENDING -> IN_TRANSIT)"
    roles: [CrematoryOperator]
    code: 201
    input: [origin_kind, origin_label, driver_name]
    output: TransportLeg
    side_effects: ["Case -> IN_TRANSIT; TransportLeg status=ASSIGNED; CustodyEvent TRANSPORT_PICKUP appended"]

  - method: GET
    path: "/cases/{id}/transport-legs"
    description: "List transport legs for a case (reverse-reachability for TransportLeg.case_id)"
    roles: [CrematoryAdmin, CrematoryOperator]
    code: 200
    input: ["limit?", "offset?"]
    output: TransportLeg[]
    side_effects: []

  - method: PATCH
    path: "/transport-legs/{id}"
    description: "Advance or cancel a transport leg (ASSIGNED->EN_ROUTE->ARRIVED, or ->CANCELLED)"
    roles: [CrematoryOperator]
    code: 200
    input: [status]
    output: TransportLeg
    side_effects: ["status transition per state machine; ARRIVED is the precondition for /cases/{id}/receive"]

  - method: GET
    path: "/transport-legs/{id}"
    description: "Get a transport leg"
    roles: [CrematoryAdmin, CrematoryOperator]
    code: 200
    input: []
    output: TransportLeg
    side_effects: []

  - method: GET
    path: "/cases/{id}/custody-events"
    description: "List the chain-of-custody events for a case in seq order (reverse-reachability for CustodyEvent.case_id)"
    roles: [CrematoryAdmin, CrematoryOperator, ClinicStaff, PetOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: CustodyEvent[]
    side_effects: []

  - method: POST
    path: "/cases/{id}/receive"
    description: "Receive the body at facility (IN_TRANSIT -> RECEIVED)"
    roles: [CrematoryOperator]
    code: 200
    input: []
    output: Case
    side_effects: ["Case -> RECEIVED; billing_status -> BILLABLE; CustodyEvent RECEIVED_AT_FACILITY"]

  - method: POST
    path: "/cases/{id}/store"
    description: "Store the body in a cooler (RECEIVED -> IN_COOLER)"
    roles: [CrematoryOperator]
    code: 200
    input: [cooler_id]
    output: Case
    side_effects: ["Case.cooler_id set; Cooler.occupied_count++ ; Cooler.status recompute; CustodyEvent COOLER_IN"]

  - method: POST
    path: "/cases/{id}/ready-return"
    description: "Mark private case ready for return (CREMATED -> READY_FOR_RETURN); creates ReturnRoute"
    roles: [CrematoryOperator]
    code: 200
    input: [return_method, destination_label]
    output: Case
    side_effects: ["Case -> READY_FOR_RETURN; ReturnRoute created status=PLANNED"]

  - method: POST
    path: "/cases/{id}/finalize-return"
    description: "Finalize the ashes return (READY_FOR_RETURN -> RETURNED)"
    roles: [CrematoryOperator]
    code: 200
    input: []
    output: Case
    side_effects: ["Case -> RETURNED; ReturnRoute DISPATCHED -> DELIVERED; CustodyEvent RETURN_TO_OWNER; custody_chain_open=false"]

  - method: POST
    path: "/cases/{id}/cancel"
    description: "Cancel a case before cremation"
    roles: [CrematoryOperator, CrematoryAdmin]
    code: 200
    input: []
    output: Case
    side_effects: ["Case -> CANCELLED; release cooler slot; cancel transport legs; void ISSUED invoice; CustodyEvent CANCELLED"]

  - method: POST
    path: "/cases/{id}/invoices"
    description: "Issue an Invoice for a cremated case (OCC on Case.version)"
    roles: [CrematoryAdmin]
    code: 201
    input: [expected_case_version]
    output: Invoice
    side_effects: ["Invoice created status=ISSUED; subtotal/handling_fee/total computed; Case.billing_status BILLABLE -> INVOICED; clinic outstanding updated if clinic-billed; increments Case.version by 1"]

  - method: GET
    path: "/cases/{id}/invoices"
    description: "List invoices for a case (reverse-reachability for Invoice.case_id)"
    roles: [CrematoryAdmin, CrematoryOperator, ClinicStaff, PetOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: Invoice[]
    side_effects: []

  # ---------- KeepsakeOrder ----------
  - method: POST
    path: "/cases/{id}/keepsake-orders"
    description: "Order a keepsake for a case"
    roles: [CrematoryOperator, ClinicStaff]
    code: 201
    input: [item_type]
    output: KeepsakeOrder
    side_effects: ["status=ORDERED; unit_price_cents from catalog"]

  - method: GET
    path: "/cases/{id}/keepsake-orders"
    description: "List keepsake orders for a case (reverse-reachability for KeepsakeOrder.case_id)"
    roles: [CrematoryAdmin, CrematoryOperator, ClinicStaff, PetOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: KeepsakeOrder[]
    side_effects: []

  - method: PATCH
    path: "/keepsake-orders/{id}"
    description: "Advance/cancel a keepsake order"
    roles: [CrematoryOperator]
    code: 200
    input: [status]
    output: KeepsakeOrder
    side_effects: ["status transition per state machine"]

  # ---------- CertificateRecord ----------
  - method: GET
    path: "/cases/{id}/certificates"
    description: "List certificate records for a case (reverse-reachability for CertificateRecord.case_id)"
    roles: [CrematoryAdmin, CrematoryOperator, ClinicStaff, PetOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: CertificateRecord[]
    side_effects: []

  # ---------- ReturnRoute ----------
  - method: GET
    path: "/cases/{id}/return-routes"
    description: "List return routes for a case (reverse-reachability for ReturnRoute.case_id)"
    roles: [CrematoryAdmin, CrematoryOperator, ClinicStaff, PetOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: ReturnRoute[]
    side_effects: []

  - method: POST
    path: "/return-routes/{id}/dispatch"
    description: "Dispatch a planned return route (PLANNED -> DISPATCHED)"
    roles: [CrematoryOperator]
    code: 200
    input: []
    output: ReturnRoute
    side_effects: ["status PLANNED -> DISPATCHED"]

  - method: POST
    path: "/return-routes/{id}/cancel"
    description: "Cancel a return route"
    roles: [CrematoryOperator]
    code: 200
    input: []
    output: ReturnRoute
    side_effects: ["status -> CANCELLED"]

  # ---------- MemorialAddon ----------
  - method: POST
    path: "/cases/{id}/memorial-addons"
    description: "Add a memorial add-on to a case (viewing sessions are scheduled and room-checked)"
    roles: [CrematoryOperator, ClinicStaff]
    code: 201
    input: [addon_type, "viewing_room_code?", "viewing_start?", "viewing_end?"]
    output: MemorialAddon
    side_effects: ["status=BOOKED; price_cents from catalog; VIEWING_SESSION checks room window conflict"]

  - method: GET
    path: "/cases/{id}/memorial-addons"
    description: "List memorial add-ons for a case (reverse-reachability for MemorialAddon.case_id)"
    roles: [CrematoryAdmin, CrematoryOperator, ClinicStaff, PetOwner]
    code: 200
    input: ["limit?", "offset?"]
    output: MemorialAddon[]
    side_effects: []

  - method: PATCH
    path: "/memorial-addons/{id}"
    description: "Fulfill/cancel a memorial add-on"
    roles: [CrematoryOperator]
    code: 200
    input: [status]
    output: MemorialAddon
    side_effects: ["status transition per state machine"]

  # ---------- Invoice ----------
  - method: GET
    path: "/invoices/{id}"
    description: "Get an invoice"
    roles: [CrematoryAdmin, CrematoryOperator, ClinicStaff, PetOwner]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/invoices"
    description: "List invoices; filter by case_id or clinic_id"
    roles: [CrematoryAdmin, CrematoryOperator, ClinicStaff]
    code: 200
    input: ["limit?", "offset?", "case_id?", "clinic_id?", "status?"]
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/invoices/{id}/pay"
    description: "Pay an issued invoice (ISSUED -> PAID)"
    roles: [CrematoryAdmin, PetOwner]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status ISSUED -> PAID; CASCADE Case.billing_status INVOICED -> SETTLED; clinic outstanding decremented if clinic-billed"]

  - method: POST
    path: "/invoices/{id}/void"
    description: "Void an issued invoice (ISSUED -> VOID)"
    roles: [CrematoryAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status ISSUED -> VOID; CASCADE Case.billing_status INVOICED -> BILLABLE; clinic outstanding decremented if clinic-billed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID header, or unknown role"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the operation, or ownership scope violated (PetOwner/ClinicStaff acting on another party's resource)"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-referenced resource or body FK target does not exist"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, bad enum value, or numeric out of bounds"
  - id: ERR_CLINIC_REQUIRED_FOR_ACCOUNT_BILLING
    http: 422
    condition: "bill_to=CLINIC_ACCOUNT but Case.clinic_id is not set"
  - id: ERR_STALE_CASE_VERSION
    http: 412
    condition: "expected_case_version does not match the Case's current version on invoice create"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is not in a valid state for the requested transition (includes terminal-state lockdown and idempotent re-trigger)"
  - id: ERR_SERVICE_TYPE_MISMATCH
    http: 409
    condition: "Case service_type differs from batch service_type, or a PRIVATE batch already holds a member"
  - id: ERR_CUSTODY_CHAIN_BROKEN
    http: 409
    condition: "A custody transition is attempted without the required preceding CustodyEvent in the chain"
  - id: ERR_RETORT_WINDOW_CONFLICT
    http: 409
    condition: "Firing window [scheduled_start, scheduled_end) overlaps another FIRING batch on the same retort (half-open semantics)"
  - id: ERR_VIEWING_ROOM_CONFLICT
    http: 409
    condition: "VIEWING_SESSION window plus buffer collides with another non-CANCELLED viewing in the same room"
  - id: ERR_RETORT_OVERLOADED
    http: 409
    condition: "Batch loaded_weight_lbs exceeds Retort.max_load_lbs at load time"
  - id: ERR_COOLER_FULL
    http: 409
    condition: "Store rejected because target cooler occupied_count >= total_capacity"
  - id: ERR_BATCH_EMPTY
    http: 409
    condition: "Load or fire attempted on a batch with member_count == 0"
  - id: ERR_CLINIC_CREDIT_EXCEEDED
    http: 409
    condition: "Issuing a clinic-account invoice would push clinic outstanding_balance_cents above credit_limit_cents"
  - id: ERR_LINE_ITEM_LOCKED
    http: 409
    condition: "Keepsake/memorial cancellation blocked because the case already has an ISSUED invoice"
  - id: ERR_PAGINATION_INVALID
    http: 422
    condition: "limit/offset out of allowed range (limit 1..100, offset >= 0)"
  - id: ERR_VIEWING_FIELDS_REQUIRED
    http: 422
    condition: "addon_type=VIEWING_SESSION without viewing_room_code/viewing_start/viewing_end, or viewing_end <= viewing_start"
  - id: ERR_SCHEDULE_WINDOW_INVALID
    http: 422
    condition: "Batch scheduled_end <= scheduled_start"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CrematoryAdmin
    description: "Crematory back-office operator: manages clinics, coolers, retorts, billing (invoice issue/void/pay), batch reconciliation, and the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /clinics — create clinic"
      - "POST /coolers — create cooler"
      - "POST /retorts — create retort"
      - "POST /cases/{id}/invoices — issue invoice"
      - "POST /invoices/{id}/void — void invoice"
      - "POST /batches/{id}/reconcile — reconcile batch"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "GET reads on clinics, coolers, retorts, batches, cases, invoices"
      - "POST /batches — create batch (with CrematoryOperator)"
      - "POST /cases/{id}/cancel — cancel case (with CrematoryOperator)"
      - "POST /invoices/{id}/pay — pay invoice (with PetOwner)"

  - name: CrematoryOperator
    description: "Crematory floor operator: drives the physical chain-of-custody (transport, receive, store, stage, fire, complete, return) and keepsake/memorial production."
    identity: "opaque"
    exclusive_operations:
      - "POST /cases/{id}/transport-legs — create transport leg"
      - "POST /cases/{id}/receive — receive body"
      - "POST /cases/{id}/store — store in cooler"
      - "POST /batches/{id}/assign-case — stage case"
      - "POST /batches/{id}/load — load batch"
      - "POST /batches/{id}/fire — fire batch"
      - "POST /batches/{id}/complete — complete firing"
      - "POST /cases/{id}/ready-return — ready for return"
      - "POST /cases/{id}/finalize-return — finalize return"
      - "POST /return-routes/{id}/dispatch — dispatch return"
      - "POST /return-routes/{id}/cancel — cancel return"
      - "PATCH /transport-legs/{id} — advance transport leg"
      - "PATCH /keepsake-orders/{id} — advance keepsake"
      - "PATCH /memorial-addons/{id} — advance memorial addon"
    shared_operations:
      - "POST /cases — create case (with ClinicStaff)"
      - "POST /cases/{id}/keepsake-orders — order keepsake (with ClinicStaff)"
      - "POST /cases/{id}/memorial-addons — add memorial (with ClinicStaff)"
      - "POST /batches — create batch (with CrematoryAdmin)"
      - "POST /cases/{id}/cancel — cancel case (with CrematoryAdmin)"
      - "GET reads on cases, batches, coolers, retorts, custody-events"

  - name: ClinicStaff
    description: "Veterinary clinic staff who submit intakes for their own clinic and view their clinic's cases/invoices. X-User-ID is the Clinic.id they act as."
    identity: "entity_backed:Clinic"
    exclusive_operations: []
    shared_operations:
      - "POST /cases — create case for own clinic (with CrematoryOperator)"
      - "POST /cases/{id}/keepsake-orders — order keepsake (with CrematoryOperator)"
      - "POST /cases/{id}/memorial-addons — add memorial (with CrematoryOperator)"
      - "POST /petowners — create pet owner"
      - "GET reads scoped to own clinic's cases, invoices, statement, custody-events"

  - name: PetOwner
    description: "Pet owner who can view their own pet's case, custody chain, certificate, and pay their own owner-billed invoice. X-User-ID is the PetOwner.id."
    identity: "entity_backed:PetOwner"
    exclusive_operations: []
    shared_operations:
      - "GET reads scoped to own cases, custody-events, certificates, return-routes, invoices"
      - "POST /invoices/{id}/pay — pay own owner-billed invoice (with CrematoryAdmin)"
