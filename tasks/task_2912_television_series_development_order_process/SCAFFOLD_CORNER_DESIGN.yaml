      - name: the_agency_scoped_reads_return_the_writer_and_pitch_by_id_and_in_the_listing
        claim_type: standard_crud
        grounds: ["endpoints[GET /writers/{id}]", "endpoints[GET /pitches/{id}]", "endpoints[GET /pitches]"]
        distinguishing_aspect: "The three reads an AgencyRep owns are all scoped to its own agency, so the same rep sees its writer and pitch by id and in the filtered listing while a listing filtered to a rival agency comes back empty rather than 403 - the scope rule shapes the result set on reads and refuses only on writes."
        test_recipe:
          setup:
            - "two agencies HAL and MRD; HAL has one writer (Ada Reyes, HIGH tier) and one SUBMITTED pitch, MRD has neither"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /agencies"
              payload: { name: "Halcyon Talent Partners", agency_code: "HAL", relationship_tier: "STANDARD", packaging_allowed: true, annual_submission_cap: 5 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /agencies"
              payload: { name: "Meridian Artists", agency_code: "MRD", relationship_tier: "PREMIER", packaging_allowed: true, annual_submission_cap: 4 }
              as: PlatformAdmin
              captures: { ag2_id: $.data.id }
            - call: "POST /slates"
              payload: { platform: "STREAMING", season_year: 2027, total_dev_budget_cents: 400000000, pattern_budget_per_episode_cents: 32000000, license_fee_cap_per_episode_cents: 30000000, max_deficit_per_episode_cents: 7000000, episode_capacity: 20, default_episode_count: 10, max_backend_points_bps: 2000, max_concurrent_pilot_shoots: 2 }
              as: PlatformAdmin
              captures: { slate_id: $.data.id }
            - call: "POST /writers"
              payload: { full_name: "Ada Reyes", agency_id: "${ag_id}", guild_minimum_tier: "HIGH", quote_per_step_cents: 5000000 }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { wr_id: $.data.id }
            - call: "POST /pitches"
              payload: { agency_id: "${ag_id}", slate_id: "${slate_id}", title: "Fault Lines", logline: "A seismologist predicts the quake nobody wants to hear about.", packaging_elements: [], underlying_ip_key: "IP-FAULT-LINES" }
              as: AgencyRep
              as_user_id: "${ag_id}"
              captures: { pitch_id: $.data.id }
          trigger:
            - call: "GET /writers/${wr_id}"
              payload: {}
              as: AgencyRep
              as_user_id: "${ag_id}"
            - call: "GET /pitches/${pitch_id}"
              payload: {}
              as: AgencyRep
              as_user_id: "${ag_id}"
            - call: "GET /pitches?agency_id=${ag_id}&status=SUBMITTED&limit=10&offset=0"
              payload: {}
              as: DevelopmentExec
          assert:
            - "the writer read is HTTP 200 with full_name == \"Ada Reyes\", agency_id == \"${ag_id}\", guild_minimum_tier == \"HIGH\", exclusivity_status == \"FREE\", open_step_count == 0 and version == 1"
            - "the pitch read is HTTP 200 with status == \"SUBMITTED\", agency_id == \"${ag_id}\", slate_id == \"${slate_id}\", underlying_ip_key == \"IP-FAULT-LINES\" and packaging_elements == []"
            - "the listing is HTTP 200 with response_type == \"array\", exactly 1 row (${pitch_id}) and meta.limit == 10, meta.offset == 0, meta.total_count == 1, meta.has_more == false"
            - "GET /pitches?agency_id=${ag2_id} returns 0 rows with meta.total_count == 0 - MRD has nothing, and this is a 200 rather than a 403"
            - "GET /pitches as AgencyRep with X-User-ID ${ag_id} and no agency_id filter returns only HAL's pitch, scoped by identity rather than by the query"

