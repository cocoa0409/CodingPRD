            - "order status == CLOSED (bubble-up: single-phase order, all phases COMPLETE)"

  # ------------------------------------------------------------------ Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_temporal_error_on_resubmit
        grounds:
          - validations[priority=8]
          - validations[priority=20]
        distinguishing_aspect: |
          Error-category pair state vs business_temporal: a re-submit of an
          ACKNOWLEDGED order whose requested_install_date has fallen behind
          the advanced clock violates both the DRAFT-only state precondition
          and the lead-time rule; priority 8 (state) must win with
          ERR_INVALID_STATE, not ERR_LEAD_TIME_VIOLATION.
        test_recipe:
          setup:
            - "order fully acknowledged with requested_install_date 2026-12-15; logical clock then advanced to 2026-12-20 so the date is now lead-time-invalid as well"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /product-families", payload: { family_code: "SEAT-2200", name: "Seating 2200", category: "SEATING", base_lead_time_days: 28 }, as: ManufacturerAdmin }
            - { call: "POST /dealers", payload: { name: "Dealer Alpha", territory_codes: ["MI", "OH"], service_capability_level: 4 }, as: ManufacturerAdmin, captures: { dlr_id: "$.data.id" } }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2027-12-31", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
            - { call: "POST /volume-agreements/${agr_id}/activate", as: ManufacturerAdmin }
            - { call: "POST /configurations", payload: { name: "Chairs", modules: [{ module_type: "TASK_CHAIR_SET", fabric_grade: "A", qty: 4 }] }, as: DealerRep, as_user_id: "${dlr_id}", captures: { cfg_id: "$.data.id" , cfg_v: "$.data.version" } }
            - { call: "POST /configurations/${cfg_id}/lock", payload: { expected_configuration_version: "${cfg_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders", payload: { volume_agreement_id: "${agr_id}", configuration_id: "${cfg_id}", territory_code: "MI", requested_install_date: "2026-12-15" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { ord_id: "$.data.id", ord_v: "$.data.version" } }
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v}" }, as: DealerRep, as_user_id: "${dlr_id}" }
            - { call: "POST /project-orders/${ord_id}/acknowledge", as: ManufacturerAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-20T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "GET /project-orders/${ord_id}", as: DealerRep, as_user_id: "${dlr_id}", captures: { ord_v_now: "$.data.version" } }
          trigger:
            - { call: "POST /project-orders/${ord_id}/submit", payload: { expected_order_version: "${ord_v_now}" }, as: DealerRep, as_user_id: "${dlr_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE (correct current version passes OCC; the state precondition at priority 8 beats the lead-time rule at priority 20)"
            - "error_id != ERR_LEAD_TIME_VIOLATION although requested_install_date 2026-12-15 < clock 2026-12-20 + max_lead_time_days"

      - name: referential_error_beats_capacity_error_on_reserve_slot
        grounds:
          - validations[priority=17]
          - validations[priority=28]
        distinguishing_aspect: |
          Error-category pair business_referential vs business_constraint:
          reserve-slot where the order's family was DISCONTINUED after
          acknowledgment AND the plant/day is already full — priority 17
          (referential) must win with ERR_PRODUCT_LINE_DISCONTINUED, not
