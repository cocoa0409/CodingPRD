  - rule_id: resource_temporal_overlap
    instances:

      - name: rto_venue_aggregate_capacity_half_open_adjacency_allowed
        grounds:
          - validations[priority=74]
          - errors.ERR_VENUE_CAPACITY_CONFLICT
          - entities.SaleVenue.fields.concurrent_lot_capacity
          - entities.SaleVenue.fields.active_lot_count
        distinguishing_aspect: |
          Half-open [opens_at, closes_at) intervals against an aggregate capacity: the shared resource is
          the venue, two overlaps are tolerated and the third is refused, so no single pair of lots is
          illegal on its own. Touching endpoints do not intersect, so a lot starting exactly when another
          ends is admitted even while the venue is at capacity. Contrast
          rto_asset_relist_cooldown_closed_interval_adjacency_forbidden, whose resource is a single asset
          with capacity one and whose adjacency is forbidden by a buffer.
