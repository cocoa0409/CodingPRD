  # ---------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: dispatch_create_requires_call_triaged
        grounds:
          - state_machines.ServiceCall.RECEIVED_to_TRIAGED
          - state_machines.Dispatch
          - validations[priority=8]
        distinguishing_aspect: |
          Pair Dispatch -> ServiceCall: a dispatch can only be created for a call in TRIAGED (or
          DISPATCHED without an active dispatch). Attempting it on a RECEIVED (never triaged)
          call fails with ERR_INVALID_STATE - the dispatch entity's create is gated by the
          parent call's machine position.
        test_recipe:
          setup: ["rate card, retail vehicle, AVAILABLE ENGINE technician; call created (RECEIVED) but never triaged"]
