scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Account.fields.email, entities.Account.fields.kyc_status, entities.Account.fields.posture]
        distinguishing_aspect: "POST /accounts with email/full_name/state_code -> 201; kyc_status defaults PENDING, posture BLOCKED, status OPEN, wallet_cents 0, server-minted id."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { email: "c1@x.com", full_name: "C One", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
          assert:
            - "HTTP 201; data.kyc_status == PENDING; data.posture == BLOCKED; data.status == OPEN; data.wallet_cents == 0; data.version == 1"

      - name: get_account_returns_stored_entity
        claim_type: Retrieval
        grounds: [entities.Account.fields.email]
        distinguishing_aspect: "GET /accounts/{id} echoes the stored Account with matching id and email."
        test_recipe:
          setup: ["One account created."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c2@x.com", full_name: "C Two", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
          trigger:
            - call: "GET /accounts/${acct}"
              payload: {}
              as: LoanServicer
          assert:
            - "HTTP 200; data.id == ${acct}; data.email == c2@x.com"

      - name: list_accounts_paginated_envelope
        claim_type: Listing
        grounds: [entities.Account.fields.status]
        distinguishing_aspect: "GET /accounts returns response_type array with meta.total_count and has_more; default limit 10."
        test_recipe:
          setup: ["Two accounts created."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c3a@x.com", full_name: "C 3a", state_code: "CA" }
              as: LoanServicer
            - call: "POST /accounts"
              payload: { email: "c3b@x.com", full_name: "C 3b", state_code: "NY" }
              as: LoanServicer
          trigger:
            - call: "GET /accounts?limit=1&offset=0"
              payload: {}
              as: LoanServicer
          assert:
            - "response_type == array; meta.total_count == 2; has_more == true; data length == 1"

      - name: get_account_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{unknown-uuid} -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_NOT_FOUND"

      - name: create_loan_missing_required_field_rejected
        claim_type: Required Fields
        grounds: [entities.CreditBuilderLoan.fields.principal_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /loans omitting term_months -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["CA account ELIGIBLE with acknowledged LOAN disclosure."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c5@x.com", full_name: "C Five", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
          trigger:
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_INVALID_REQUEST"

      - name: autopay_default_funding_wallet_false
        claim_type: Defaults
        grounds: [entities.AutopayEnrollment.fields.funding_wallet, entities.AutopayEnrollment.fields.status]
        distinguishing_aspect: "POST /autopay-enrollments omitting funding_wallet -> stored false; status defaults ACTIVE."
        test_recipe:
          setup: ["CA loan funded ACTIVE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "c6@x.com", full_name: "C Six", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /autopay-enrollments"
              payload: { loan_id: "${loan}", day_of_month: 5 }
              as: Borrower
              as_user_id: "${acct}"
          assert:
            - "HTTP 201; data.funding_wallet == false; data.status == ACTIVE"

      - name: loan_computed_apr_copied_from_disclosure_input_ignored
        claim_type: Computed Fields
        grounds: [entities.CreditBuilderLoan.fields.apr_bps, calculations.compute_amortized_payment]
        distinguishing_aspect: "apr_bps on the loan is copied from the pinned disclosure at funding; the create body has no apr field, so the disclosed 1599 is used."
        test_recipe:
          setup: ["CA account ELIGIBLE; LOAN disclosure apr 1599 acknowledged; loan P=120000 term12 funded."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c7@x.com", full_name: "C Seven", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 1599, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 120000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
          trigger:
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
          assert:
            - "data.apr_bps == 1599; data.monthly_payment_cents == 10887"

      - name: bureau_report_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.BureauReport.fields.cycle_label]
        distinguishing_aspect: "BureauReport is common_fields:false (append-only): it carries id + created_at, no version, and has no update/delete endpoint."
        test_recipe:
          setup: ["CA loan funded ACTIVE; one bureau sweep emitted a LOAN report for 2026-03."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "c8@x.com", full_name: "C Eight", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/run-bureau-sweep"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "GET /loans/${loan}/bureau-reports?cycle_label=2026-03"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
          assert:
            - "data length >= 1; each BureauReport has bureaus == [EQUIFAX, EXPERIAN, TRANSUNION] and tradeline_kind == LOAN; no version field"

      - name: create_loan_invalid_term_rejected
        claim_type: Type Constraints
        grounds: [entities.CreditBuilderLoan.fields.term_months, "validations[priority=15]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "term_months not in {12,24} (e.g. 18) -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["CA account ELIGIBLE; LOAN disclosure acknowledged."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c9@x.com", full_name: "C Nine", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
          trigger:
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 18 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422; data.error_id == ERR_INVALID_REQUEST"

      - name: create_loan_wrong_parent_account_not_found
        claim_type: Parent Relationships
        grounds: [entities.CreditBuilderLoan.fields.account_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /loans with a non-existent account_id -> 404 ERR_NOT_FOUND (parent existence checked left-to-right)."
        test_recipe:
          setup: ["A real LOAN disclosure exists on a different account; the create cites a bogus account_id."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c10@x.com", full_name: "C Ten", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { account_id: "22222222-2222-4222-8222-222222222222", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404; data.error_id == ERR_NOT_FOUND"

      - name: fk_reverse_loans_by_account_filtered_list
        claim_type: Creation
        grounds: [entities.CreditBuilderLoan.fields.account_id, endpoints]
        distinguishing_aspect: "GET /loans?account_id={id} returns the account's loans (FK reverse-reachability via filtered list)."
        test_recipe:
          setup: ["CA account ELIGIBLE with one PENDING loan."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "c11@x.com", full_name: "C Eleven", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
          trigger:
            - call: "GET /loans?account_id=${acct}"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
          assert:
            - "response_type == array; data length == 1; data[0].id == ${loan}"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: loan_initial_state_pending
        claim_type: Initial State
        grounds: [state_machines.CreditBuilderLoan.PENDING_to_ACTIVE, entities.CreditBuilderLoan.fields.lifecycle_status]
        distinguishing_aspect: "A freshly created loan starts lifecycle_status PENDING and delinquency_status CURRENT."
        test_recipe:
          setup: ["CA account ELIGIBLE; loan created, not funded."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s1@x.com", full_name: "S One", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
          trigger:
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
          assert:
            - "data.lifecycle_status == PENDING; data.delinquency_status == CURRENT"

      - name: fund_already_active_loan_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.CreditBuilderLoan.PENDING_to_ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Funding a loan already ACTIVE -> 409 ERR_INVALID_STATE; second fund is rejected, no second schedule generated."
        test_recipe:
          setup: ["CA loan funded ACTIVE."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s2@x.com", full_name: "S Two", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE"

      - name: cancel_active_loan_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.CreditBuilderLoan.PENDING_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel is only valid from PENDING; cancelling an ACTIVE loan -> 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["CA loan funded ACTIVE."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { email: "s3@x.com", full_name: "S Three", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /loans/${loan}/cancel"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_INVALID_STATE"

      - name: graduate_active_not_paid_off_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.CreditBuilderLoan.PAID_OFF_to_GRADUATED, "validations[priority=11]", "errors[ERR_GRADUATION_NOT_ELIGIBLE]"]
        distinguishing_aspect: "Graduating an ACTIVE (not PAID_OFF) loan -> 409 ERR_GRADUATION_NOT_ELIGIBLE."
        test_recipe:
          setup: ["CA loan funded ACTIVE, no payments (outstanding 60000)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "s4@x.com", full_name: "S Four", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { disc: $.data.id }
            - call: "POST /disclosures/${disc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${disc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
          trigger:
            - call: "POST /loans/${loan}/graduate"
              payload: {}
              as: LoanServicer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == ERR_GRADUATION_NOT_ELIGIBLE"

      - name: graduate_paid_off_success_flags_card
        claim_type: Valid Transition
        grounds: [state_machines.CreditBuilderLoan.PAID_OFF_to_GRADUATED, entities.SecuredCard.fields.graduation_eligible]
        distinguishing_aspect: "Graduating a PAID_OFF loan with on_time_streak>=6 moves lifecycle GRADUATED and sets the linked ACTIVE card's graduation_eligible=true."
        test_recipe:
          setup: ["CA loan P=60000 apr0 funded ACTIVE, lump-paid 60000 -> PAID_OFF streak 12; SECURED_CARD acknowledged; card deposit 50000 ACTIVE balance 0."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /accounts"
              payload: { email: "s5@x.com", full_name: "S Five", state_code: "CA" }
              as: LoanServicer
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/kyc-decision"
              payload: { decision: "VERIFIED" }
              as: LoanServicer
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "LOAN", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { ldisc: $.data.id }
            - call: "POST /accounts/${acct}/disclosures"
              payload: { product_kind: "SECURED_CARD", apr_bps: 0, admin_fee_cents: 0 }
              as: ComplianceOfficer
              captures: { cdisc: $.data.id }
            - call: "POST /disclosures/${ldisc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /disclosures/${cdisc}/acknowledge"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /loans"
              payload: { account_id: "${acct}", disclosure_id: "${ldisc}", principal_cents: 60000, term_months: 12 }
              as: Borrower
              as_user_id: "${acct}"
              captures: { loan: $.data.id }
            - call: "POST /loans/${loan}/fund"
              payload: {}
              as: LoanServicer
              as_user_id: "srv-1"
              captures: { loan_v2: $.data.version }
            - call: "POST /payments"
              payload: { loan_id: "${loan}", amount_cents: 60000, source: "MANUAL", expected_loan_version: "${loan_v2}" }
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /secured-cards"
              payload: { account_id: "${acct}", disclosure_id: "${cdisc}" }
              as: Borrower
              as_user_id: "${acct}"
              captures: { card: $.data.id, card_v1: $.data.version }
            - call: "POST /secured-cards/${card}/deposits"
              payload: { amount_cents: 50000, expected_card_version: "${card_v1}" }
              as: Borrower
              as_user_id: "${acct}"
            - call: "POST /secured-cards/${card}/activate"
              payload: {}
              as: Borrower
              as_user_id: "${acct}"
          trigger:
            - call: "POST /loans/${loan}/graduate"
              payload: {}
              as: LoanServicer
              as_user_id: "srv-1"
          assert:
            - "HTTP 200; data.lifecycle_status == GRADUATED"
            - "GET /secured-cards/${card}.graduation_eligible == true"

      - name: terminal_graduated_loan_locked
        claim_type: Terminal State Lockdown
