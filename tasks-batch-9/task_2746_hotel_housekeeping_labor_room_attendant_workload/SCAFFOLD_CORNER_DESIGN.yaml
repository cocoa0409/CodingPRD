          - state_machines.LaundryCycle[QUEUED->RETURNED]
        distinguishing_aspect: "A 240-minute turnaround against a 240-minute SLA returns RETURNED with sla_breach false because the comparison is strictly greater, and the two missing sets are written off so the three-bucket identity still balances at 18."
        test_recipe:
          setup:
