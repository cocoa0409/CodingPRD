        grounds: ["validations[priority=15]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: ChapterDirector dir-1 creates and submits a plan (a shared operation), but approving it as dir-1 fails with 403 ERR_SEGREGATION_OF_DUTIES; a different director dir-2 can approve."
        test_recipe:
          setup: ["RECEIVE_ITEM wish DETERMINED; plan created AND submitted by ChapterDirector dir-1."]
          setup_api_calls:
            - call: "POST /wish-grant/_clock/set_current_utc"
