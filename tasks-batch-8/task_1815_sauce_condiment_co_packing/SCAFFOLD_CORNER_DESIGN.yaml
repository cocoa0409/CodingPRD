            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000 }, as: OpsAdmin, captures: { c1: "$.data.id"} }
          trigger:
            - { call: "POST /copack/kettle-lines", payload: { line_name: "Kettle-9", capacity_units: 1000 }, as: Customer, as_user_id: "${c1}", captures: { err: "$.data.error_id"} }
          assert:
            - "error_id == ERR_FORBIDDEN and http status 403"

      - name: qa_reviewer_cannot_activate_letter
        claim_type: role_exclusive_denial
        grounds: [roles.ProcessAuthority, roles.QAReviewer, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Letter activation is exclusive to ProcessAuthority: a QAReviewer caller is rejected with 403 ERR_FORBIDDEN before any state checks."
        test_recipe:
          setup: ["Chain A through TRIAL_PASSED with letter l1 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000 }, as: OpsAdmin, captures: { c1: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Ghost Pepper Sauce", sku_code: "GPS-001", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { f1: "$.data.id"} }
            - { call: "POST /copack/pilot-cells", payload: { cell_name: "Pilot-1", max_batch_units: 5000 }, as: OpsAdmin, captures: { pc1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${f1}", pilot_cell_id: "${pc1}", batch_size_units: 500, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }, as: OpsAdmin, captures: { t1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials/${t1}/record-results", payload: { passed: true, yield_units: 480 }, as: OpsAdmin }
            - { call: "POST /copack/process-authority-letters", payload: { formula_id: "${f1}", formula_revision: 1, authority_name: "Dr. Rosa Kim", letter_number: "PAL-1001", max_ph: 4.2, max_water_activity: 0.9 }, as: ProcessAuthority, captures: { l1: "$.data.id"} }
          trigger:
            - { call: "POST /copack/process-authority-letters/${l1}/activate", payload: {}, as: QAReviewer, captures: { err: "$.data.error_id"} }
          assert:
            - "error_id == ERR_FORBIDDEN and http status 403"
            - "ProcessAuthorityLetter.${l1}.status remains SUBMITTED"

      - name: customer_cannot_read_other_customers_formula
        claim_type: ownership_isolation
        grounds: [roles.Customer, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Customer is entity-backed by CustomerAccount: reading a formula owned by a different customer_id is rejected with 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Customers cA and cB; formula fA owned by cA"]
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000 }, as: OpsAdmin, captures: { cA: "$.data.id"} }
            - { call: "POST /copack/customers", payload: { brand_name: "Nuevo Brands", contact_email: "hola@nuevo.example", credit_limit_cents: 100000000 }, as: OpsAdmin, captures: { cB: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${cA}", product_name: "Ghost Pepper Sauce", sku_code: "GPS-001", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { fA: "$.data.id"} }
          trigger:
            - { call: "GET /copack/formulas/${fA}", payload: {}, as: Customer, as_user_id: "${cB}", captures: { err: "$.data.error_id"} }
          assert:
            - "error_id == ERR_FORBIDDEN and http status 403"

  - section: cross_cutting_layers
    instances:
      - name: formula_put_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[formula-update-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Formula.version: a PUT carrying the pre-update expected_formula_version succeeds (version 1 -> 2); replaying the same stale expected version is rejected with 412 ERR_STALE_VERSION and the formula keeps version 2."
        test_recipe:
          setup: ["Customer c1; DRAFT formula f1 (version 1)"]
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000 }, as: OpsAdmin, captures: { c1: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Ghost Pepper Sauce", sku_code: "GPS-001", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { f1: "$.data.id", f_v: "$.data.version"} }
          trigger:
            - { call: "PUT /copack/formulas/${f1}", payload: { product_name: "Ghost Pepper Sauce v2", expected_formula_version: "${f_v}" }, as: OpsAdmin }
            - { call: "PUT /copack/formulas/${f1}", payload: { unit_rate_cents: 130, expected_formula_version: "${f_v}" }, as: OpsAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "first PUT succeeds and increments Formula.${f1}.version to 2"
            - "second PUT fails with ERR_STALE_VERSION and http status 412 (expected ${f_v} is stale)"
            - "Formula.${f1}.unit_rate_cents remains 120 and version remains 2"

      - name: component_put_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[component-adjust-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on PackagingComponent.version: a stock adjustment carrying the pre-adjustment expected_component_version succeeds (version 1 -> 2); replaying the same stale version is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["PackagingComponent b1 created with initial_on_hand_units 100000 (version 1)"]
          setup_api_calls:
            - { call: "POST /copack/packaging-components", payload: { component_name: "12oz woozy bottle", component_type: "BOTTLE", unit_cost_cents: 50, initial_on_hand_units: 100000 }, as: OpsAdmin, captures: { b1: "$.data.id", b_v: "$.data.version"} }
          trigger:
            - { call: "PUT /copack/packaging-components/${b1}", payload: { on_hand_units: 95000, expected_component_version: "${b_v}" }, as: OpsAdmin }
            - { call: "PUT /copack/packaging-components/${b1}", payload: { on_hand_units: 90000, expected_component_version: "${b_v}" }, as: OpsAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "first PUT succeeds: on_hand_units == 95000 and version == 2"
            - "second PUT fails with ERR_STALE_VERSION and http status 412"
            - "PackagingComponent.${b1}.on_hand_units remains 95000 and version remains 2"

      - name: layer_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: reformulate_letter_run_packaging_cascade
          rationale: "The 3-level cascade (formula -> letter -> runs -> components/customer) is asserted hop-by-hop in the named §1.8 instance."

      - name: layer_dual_variant_delta
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: run_charge_estimate_vs_final
          rationale: "Estimate-vs-final divergence (84400 cents) and billing reconciliation are asserted in the named §1.8 instance."

      - name: layer_derived_field_available_units
        claim_type: derived_field_reconciliation
        grounds: [entities.PackagingComponent.fields.available_units, entities.PackagingComponent.fields.reserved_units]
        excluded_because:
          difficulty_instance: confirm_cancel_restores_packaging_reserved
          rationale: "reserved_units/available_units reconciliation across confirm and cancel is asserted in the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: immediate_visibility_after_confirm
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        excluded_because:
          difficulty_instance: run_charge_estimate_vs_final
          rationale: "Computed charge fields are read back immediately after confirm and complete in the named §1.8 instance, demonstrating immediate consistency."
