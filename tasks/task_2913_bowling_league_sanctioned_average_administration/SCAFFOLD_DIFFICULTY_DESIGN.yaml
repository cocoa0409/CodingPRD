          assert:
            - "the three-match request fails with ERR_LANE_PAIR_CONFLICT (409): week 3's [2026-08-12T02:59:00Z, 2026-08-12T04:59:00Z) shares the minute 02:59-03:00 with week 1's window on lane pair ${lp1_id}"
