              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { p_id: $.data.id }
            - call: "POST /community-care/providers/${p_id}/credential-decision"
              payload: { target_status: "CREDENTIALED" }
              as: NetworkManager
            - call: "POST /community-care/veterans"
              payload: { full_name: "V One", home_station_id: "${st_id}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { v_id: $.data.id, v_v: $.data.version }
            - call: "POST /community-care/veterans/${v_id}/eligibility-assessments"
              payload: { service_code: "PT_EVAL", service_category: "PRIMARY_CARE", geo_classification: "URBAN", choice_requested: false, expected_veteran_version: "${v_v}" }
              as: EligibilityClerk
              captures: { a_id: $.data.id }
            - call: "POST /community-care/referral-authorizations"
              payload: { veteran_id: "${v_id}", assessment_id: "${a_id}", provider_id: "${p_id}", service_code: "PT_EVAL", authorized_visits: 2, duration_days: 60, start_date: "2026-09-05" }
              as: CareCoordinator
              captures: { ra_id: $.data.id }
            - call: "POST /community-care/referral-authorizations/${ra_id}/authorize"
              as: CareCoordinator
            - call: "POST /community-care/referral-authorizations/${ra_id}/extension-requests"
              payload: { requested_visits: 3, requested_extra_days: 0 }
              as: CareCoordinator
              captures: { ext_id: $.data.id }
            - call: "GET /community-care/referral-authorizations/${ra_id}"
              as: CareCoordinator
              captures: { ra_v: $.data.version }
            - call: "POST /community-care/referral-authorizations/${ra_id}/extension-requests/${ext_id}/decide"
              payload: { decision: "APPROVED", expected_referral_authorization_version: "${ra_v}" }
              as: CareCoordinator
          trigger:
            - call: "POST /community-care/referral-authorizations/${ra_id}/appointments"
              payload: { scheduled_start: "2026-09-06T10:00:00Z", requested_date: "2026-09-02" }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { ap_a: $.data.id }
            - call: "POST /community-care/referral-authorizations/${ra_id}/appointments"
              payload: { scheduled_start: "2026-09-07T10:00:00Z", requested_date: "2026-09-02" }
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
              captures: { ap_b: $.data.id }
            - call: "GET /community-care/referral-authorizations/${ra_id}"
              as: CareCoordinator
              captures: { s1_reserved: $.data.reserved_visits, s1_completed: $.data.completed_visits, s1_remaining: $.data.remaining_visits }
            - call: "POST /community-care/appointments/${ap_a}/complete"
              as: ProviderRep
              as_user_id: "${p_id}"
            - call: "GET /community-care/referral-authorizations/${ra_id}"
              as: CareCoordinator
              captures: { s2_reserved: $.data.reserved_visits, s2_completed: $.data.completed_visits, s2_remaining: $.data.remaining_visits }
            - call: "POST /community-care/appointments/${ap_b}/cancel"
              as: TPAAdministrator
              as_user_id: "${tpa_id}"
            - call: "GET /community-care/referral-authorizations/${ra_id}"
              as: CareCoordinator
              captures: { s3_reserved: $.data.reserved_visits, s3_completed: $.data.completed_visits, s3_remaining: $.data.remaining_visits, s3_extended: $.data.extended_visits }
          assert:
            - "after two reservations: reserved == 2, completed == 0, remaining == 3  (2 + 3 == 0 + 2 + 3)"
            - "after completing A: reserved == 1, completed == 1, remaining == 3  (2 + 3 == 1 + 1 + 3)"
            - "after cancelling B (compensating action): reserved == 0, completed == 1, remaining == 4  (2 + 3 == 1 + 0 + 4)"
            - "extended_visits == 3 throughout; authorized_visits == 2 throughout"

      - name: payment_buckets_conserved_across_pay_and_reverse
        grounds:
          - calculations.provider_payment_invariant
          - state_machines.Claim.PAID_to_REVERSED
          - entities.CommunityProvider.fields.lifetime_paid_cents
        distinguishing_aspect: |
          Conserved quantity: cents (distinct from the sibling's visit count).
          Two PAID adjudications accumulate lifetime_paid_cents 6825; reversing
          the 4875-cent claim moves money from current_paid_cents to
          reversed_cents without touching lifetime, so lifetime == current +
          reversed (6825 == 1950 + 4875) holds before, during, and after the
          compensation.
