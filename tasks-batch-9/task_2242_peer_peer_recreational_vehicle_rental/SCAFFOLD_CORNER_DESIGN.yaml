              as: PlatformAdmin
            - *k_submit
            - *k_list_approve
            - *k_fund
            - call: "POST /rv-marketplace/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rv-marketplace/bookings"
              payload:
                listing_id: "${listing_id}"
                renter_id: "${renter_id}"
                protection_plan_id: "${plan_id}"
                cancellation_policy_id: "${policy_id}"
                start_date: "2026-08-29"
                end_date: "2026-09-02"
                delivery_option: "PICKUP"
                declared_miles: 380
                declared_generator_hours: 11.0
              as: Renter
              as_user_id: "${renter_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response 422"
            - "data.error_id == 'ERR_LISTING_INSURANCE_NOT_VERIFIED'"
