# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1805: School Facility Use & Community Rental
# 9 rules x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1–§1.6. All numeric asserts are literals precomputed by
# executing the pinned formulas in SCAFFOLD.yaml §1.3.
#
# Standard fixture policies (created inline per instance):
#   NP-STD: NONPROFIT x STANDARD hourly 5000, custodial 4000, bp 2000, floor 10000
#   FP-PRE: FOR_PROFIT x PREMIUM hourly 15000, custodial 6000, bp 3000, floor 20000
#   FP-STD: FOR_PROFIT x STANDARD hourly 8000, custodial 5000, bp 2500, floor 10000
#   IN-STD: INTERNAL x STANDARD hourly 0, custodial 0, bp 0, floor 0
#   NP-ATH-2026: NONPROFIT x ATHLETIC hourly 9000, custodial 4500, bp 2000, floor 15000,
#                effective 2026-07-01 .. 2027-01-01
#   NP-ATH-2027: NONPROFIT x ATHLETIC hourly 10000, custodial 5000, bp 2000, floor 15000,
#                effective 2027-01-01 open-ended
#
# OCC pattern throughout: the version bound into expected_request_version is captured
# from the response of the LAST mutation before approve (begin_review), since submit
# and begin_review each increment RentalRequest.version.
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_provisional_vs_final_money_delta
        grounds:
          - calculations.staffing_charge
          - calculations.invoice_total
          - entities.Invoice.fields.invoice_kind
          - state_machines.Permit.lifecycle_status.ACTIVE_to_COMPLETED
        distinguishing_aspect: |
          Invoice-domain dual variant: identical event window and rate policy produce
          PROVISIONAL total 52250 (estimated_hours 5.0) vs FINAL total 62225 (verified
          actual_hours 6.5) — same entity inputs, different money, delta 9975.
        test_recipe:
          setup:
            - "Site RHS, STANDARD facility GYM (capacity 300, buffers 30/30, requires_custodian=true)"
            - "NONPROFIT renter, VALID insurance (per_occ 200000000, agg 400000000, 2026-01-01..2027-01-01)"
            - "Event Sat 2026-09-05 17:00-21:00 local = 2026-09-06T00:00:00Z..04:00:00Z UTC, headcount 200"
            - "PROVISIONAL at approval: rental 20000 (4h x 5000) + staffing 20000 (5.0h est x 4000) + after_hours 15000 (0.75 uplift, weekend+after-hours) = 55000; 5% discount 2750; total 52250. deposit_required = max(10000, 4000) = 10000"
            - "Deposit 10000 captured; clock to 2026-09-06T12:00:00Z; permit completed; work order verified actual_hours 6.5"
            - "FINAL: rental 20000 + staffing 26000 + after 19500 = 65500; 5% discount 3275; total 62225"
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "RHS", display_name: "Riverview High", rental_timezone: "America/Los_Angeles" }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /district/sites/${site_id}/facilities"
              payload: { facility_code: "GYM", facility_tier: "STANDARD", capacity: 300, setup_buffer_minutes: 30, teardown_buffer_minutes: 30, requires_custodian: true }
              as: DistrictAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /district/rate_policies"
              payload: { policy_code: "NP-STD", rate_class: "NONPROFIT", facility_tier: "STANDARD", hourly_rate_cents: 5000, deposit_basis_points: 2000, custodial_hourly_cents: 4000, effective_from: "2026-01-01T00:00:00Z", deposit_floor_cents: 10000 }
              as: DistrictAdmin
            - call: "POST /district/renters"
              payload: { org_name: "Riverview PTA", rate_class: "NONPROFIT", nonprofit_registration_no: "12-3456789" }
              as: FacilitiesDirector
              captures: { org_id: $.data.id }
            - call: "POST /district/renters/${org_id}/insurance_certificates"
              payload: { insurer_name: "Aegis Mutual", per_occurrence_limit_cents: 200000000, aggregate_limit_cents: 400000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/renters/${org_id}/requests"
              payload: { facility_id: "${fac_id}", event_title: "Charity Auction", headcount_estimate: 200, starts_at: "2026-09-06T00:00:00Z", ends_at: "2026-09-06T04:00:00Z", district_sponsored: false }
              as: RenterOrgRep
              as_user_id: "${org_id}"
              captures: { req_id: $.data.id }
            - call: "POST /district/renters/${org_id}/requests/${req_id}/submit"
              payload: {}
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/requests/${req_id}/begin_review"
              payload: {}
              as: SiteCoordinator
              captures: { req_vr: $.data.version }
            - call: "POST /district/requests/${req_id}/approve"
              payload: { expected_request_version: "${req_vr}" }
              as: FacilitiesDirector
              captures: { permit_id: $.data.id }
            - call: "POST /district/permits/${permit_id}/payments"
              payload: { txn_kind: "DEPOSIT_CAPTURE", amount_cents: 10000, idempotency_key: "dep-a-1" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T12:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/permits/${permit_id}/complete"
              payload: {}
              as: SiteCoordinator
            - call: "GET /district/permits/${permit_id}/work_orders"
              payload: {}
              as: CustodialSupervisor
              captures: { wo_id: "$.data[0].id" }
            - call: "POST /district/work_orders/${wo_id}/verify"
              payload: { actual_hours: 6.5 }
              as: CustodialSupervisor
          trigger:
            - call: "GET /district/permits/${permit_id}/invoices"
              payload: {}
              as: FacilitiesDirector
              captures: { inv0_total: "$.data[0].total_cents", inv0_kind: "$.data[0].invoice_kind", inv0_status: "$.data[0].invoice_status" }
          assert:
            - "PROVISIONAL invoice (created at approval) had total_cents == 52250 (rental 20000 + staffing 20000 + after_hours 15000 - discount 2750)"
            - "FINAL invoice total_cents == 62225 (rental 20000 + staffing 26000 + after_hours 19500 - discount 3275)"
            - "FINAL invoice staffing_charge_cents == 26000 and after_hours_charge_cents == 19500"
            - "PROVISIONAL invoice invoice_status == VOID after completion"
            - "FINAL total - PROVISIONAL total == 9975 — identical window/policy, money delta driven purely by estimate-vs-actual variant"

      - name: cancellation_refund_tier_vs_administrative_variant
        grounds:
          - calculations.cancellation_refund
          - state_machines.Permit.lifecycle_status.ISSUED_to_CANCELLED
          - state_machines.Permit.lifecycle_status.ISSUED_to_SUPERSEDED
        distinguishing_aspect: |
          Refund-domain dual variant (different entity domain from instance 1 — Permit
          refund waterfall vs Invoice totaling): identical paid-in deposit 24300 yields
          refund 9650 under the renter-initiated 7-13-day tier vs refund 24300 under
          the ADMINISTRATIVE (tier-0 calendar supersession) variant.
        test_recipe:
          setup:
            - "Site FHS PREMIUM facility AUD (capacity 500, buffers 30/30, requires_custodian=true)"
            - "FOR_PROFIT renter with VALID insurance (headcount 400 tier)"
            - "Permit P1: event 2026-10-14T22:00:00Z..2026-10-15T04:00:00Z; deposit 24300 captured"
            - "Permit P2: same renter, event 2026-10-21T22:00:00Z..2026-10-22T04:00:00Z; deposit 24300 captured"
            - "Clock 2026-10-07T12:00:00Z: P1 cancel is 7 days before occupancy (>= 7, < 14) -> 50% tier, 2500 fee -> refund 9650, forfeit 14650"
            - "Clock 2026-10-19T12:00:00Z: tier-0 calendar event overlapping P2 -> P2 SUPERSEDED -> ADMINISTRATIVE -> refund 24300, forfeit 0"
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "FHS", display_name: "Fairview High", rental_timezone: "America/Los_Angeles" }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /district/sites/${site_id}/facilities"
              payload: { facility_code: "AUD", facility_tier: "PREMIUM", capacity: 500, setup_buffer_minutes: 30, teardown_buffer_minutes: 30, requires_custodian: true }
              as: DistrictAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /district/rate_policies"
              payload: { policy_code: "FP-PRE", rate_class: "FOR_PROFIT", facility_tier: "PREMIUM", hourly_rate_cents: 15000, deposit_basis_points: 3000, custodial_hourly_cents: 6000, effective_from: "2026-01-01T00:00:00Z", deposit_floor_cents: 20000 }
              as: DistrictAdmin
            - call: "POST /district/renters"
              payload: { org_name: "Gala Productions LLC", rate_class: "FOR_PROFIT" }
              as: FacilitiesDirector
              captures: { org_id: $.data.id }
            - call: "POST /district/renters/${org_id}/insurance_certificates"
              payload: { insurer_name: "Aegis Mutual", per_occurrence_limit_cents: 200000000, aggregate_limit_cents: 400000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/renters/${org_id}/requests"
              payload: { facility_id: "${fac_id}", event_title: "Gala Night A", headcount_estimate: 400, starts_at: "2026-10-14T22:00:00Z", ends_at: "2026-10-15T04:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
              captures: { req1_id: $.data.id }
            - call: "POST /district/renters/${org_id}/requests/${req1_id}/submit"
              payload: {}
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/requests/${req1_id}/begin_review"
              payload: {}
              as: SiteCoordinator
              captures: { req1_vr: $.data.version }
            - call: "POST /district/requests/${req1_id}/approve"
              payload: { expected_request_version: "${req1_vr}" }
              as: FacilitiesDirector
              captures: { permit1_id: $.data.id }
            - call: "POST /district/permits/${permit1_id}/payments"
              payload: { txn_kind: "DEPOSIT_CAPTURE", amount_cents: 24300, idempotency_key: "dep-b-1" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/renters/${org_id}/requests"
              payload: { facility_id: "${fac_id}", event_title: "Gala Night B", headcount_estimate: 400, starts_at: "2026-10-21T22:00:00Z", ends_at: "2026-10-22T04:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
              captures: { req2_id: $.data.id }
            - call: "POST /district/renters/${org_id}/requests/${req2_id}/submit"
              payload: {}
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/requests/${req2_id}/begin_review"
              payload: {}
              as: SiteCoordinator
              captures: { req2_vr: $.data.version }
            - call: "POST /district/requests/${req2_id}/approve"
              payload: { expected_request_version: "${req2_vr}" }
              as: FacilitiesDirector
              captures: { permit2_id: $.data.id }
            - call: "POST /district/permits/${permit2_id}/payments"
              payload: { txn_kind: "DEPOSIT_CAPTURE", amount_cents: 24300, idempotency_key: "dep-b-2" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-07T12:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /district/permits/${permit1_id}/cancel"
              payload: { cancellation_reason: "renter changed plans" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-19T12:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/sites/${site_id}/calendar_events"
              payload: { facility_id: "${fac_id}", title: "State Playoff Game", starts_at: "2026-10-21T20:00:00Z", ends_at: "2026-10-22T05:00:00Z", event_priority_tier: 0 }
              as: DistrictAdmin
            - call: "GET /district/permits/${permit1_id}/payments"
              payload: {}
              as: FacilitiesDirector
            - call: "GET /district/permits/${permit2_id}/payments"
              payload: {}
              as: FacilitiesDirector
          assert:
            - "P1 (renter cancel, days_before == 7): DEPOSIT_REFUND == 9650 (round_half_up(24300 * 0.5) - 2500), DEPOSIT_FORFEIT == 14650; financial_status == REFUNDED"
            - "P2 (tier-0 supersession): lifecycle_status == SUPERSEDED, financial_status == REFUNDED, DEPOSIT_REFUND == 24300, DEPOSIT_FORFEIT == 0"
            - "Same gross paid 24300 yields 9650 vs 24300 purely from cancellation_class variant (tiered vs ADMINISTRATIVE)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: invoice_total_tier_rekey_evaluation_order
        grounds:
          - calculations.invoice_total
          - calculations.rental_charge_quote
          - calculations.after_hours_charge
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order
          rental -> staffing -> after_hours -> subtotal -> tier -> discount -> total.
          Verified by a discount-tier CROSSING between provisional (subtotal 144000,
          10% tier, total 129600) and final (subtotal 99000 after min-shift-floored
          actuals, 5% tier, total 94050): the discount RATE itself re-keys on the
          final pre-discount subtotal, proving tier selection precedes subtraction.
        test_recipe:
          setup:
            - "Site FHS PREMIUM AUD, FOR_PROFIT renter (FP-PRE), headcount 400, VALID insurance"
            - "Event Fri 2026-11-06 14:00-20:00 local = 2026-11-06T21:00:00Z..2026-11-07T03:00:00Z UTC; 6 billable hours -> rental = round(90000 * 0.90) = 81000 (long-booking rebate at >= 6h)"
            - "Custodial window 13:30-20:30 = 7.0h estimated; after-hours flag true (minutes beyond 18:00), weekend false -> uplift 0.50"
            - "PROVISIONAL: staffing 42000, after 21000, subtotal 144000 -> 10% tier -> discount 14400 -> total 129600; deposit = max(20000, round(81000*0.30)) = 24300"
            - "Verified actual_hours 1.5 -> min-shift floor bills 2.0h -> staffing 12000, after 6000, subtotal 99000 (< 100000) -> 5% tier -> discount 4950 -> FINAL total 94050"
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "FHS", display_name: "Fairview High", rental_timezone: "America/Los_Angeles" }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /district/sites/${site_id}/facilities"
              payload: { facility_code: "AUD", facility_tier: "PREMIUM", capacity: 500, setup_buffer_minutes: 30, teardown_buffer_minutes: 30, requires_custodian: true }
              as: DistrictAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /district/rate_policies"
              payload: { policy_code: "FP-PRE", rate_class: "FOR_PROFIT", facility_tier: "PREMIUM", hourly_rate_cents: 15000, deposit_basis_points: 3000, custodial_hourly_cents: 6000, effective_from: "2026-01-01T00:00:00Z", deposit_floor_cents: 20000 }
              as: DistrictAdmin
            - call: "POST /district/renters"
              payload: { org_name: "Gala Productions LLC", rate_class: "FOR_PROFIT" }
              as: FacilitiesDirector
              captures: { org_id: $.data.id }
            - call: "POST /district/renters/${org_id}/insurance_certificates"
              payload: { insurer_name: "Aegis Mutual", per_occurrence_limit_cents: 200000000, aggregate_limit_cents: 400000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/renters/${org_id}/requests"
              payload: { facility_id: "${fac_id}", event_title: "Product Launch", headcount_estimate: 400, starts_at: "2026-11-06T21:00:00Z", ends_at: "2026-11-07T03:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
              captures: { req_id: $.data.id }
            - call: "POST /district/renters/${org_id}/requests/${req_id}/submit"
              payload: {}
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/requests/${req_id}/begin_review"
              payload: {}
              as: SiteCoordinator
              captures: { req_vr: $.data.version }
            - call: "POST /district/requests/${req_id}/approve"
              payload: { expected_request_version: "${req_vr}" }
              as: FacilitiesDirector
              captures: { permit_id: $.data.id }
            - call: "GET /district/permits/${permit_id}/invoices"
              payload: {}
              as: FacilitiesDirector
              captures: { prov_total: "$.data[0].total_cents" }
            - call: "POST /district/permits/${permit_id}/payments"
              payload: { txn_kind: "DEPOSIT_CAPTURE", amount_cents: 24300, idempotency_key: "dep-c-1" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-07T12:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/permits/${permit_id}/complete"
              payload: {}
              as: SiteCoordinator
            - call: "GET /district/permits/${permit_id}/work_orders"
              payload: {}
              as: CustodialSupervisor
              captures: { wo_id: "$.data[0].id" }
            - call: "POST /district/work_orders/${wo_id}/verify"
              payload: { actual_hours: 1.5 }
              as: CustodialSupervisor
          trigger:
            - call: "GET /district/permits/${permit_id}/invoices"
              payload: {}
              as: FacilitiesDirector
              captures: { final_total: "$.data[0].total_cents", final_staff: "$.data[0].staffing_charge_cents" }
          assert:
            - "PROVISIONAL invoice: rental_fee_cents == 81000, staffing_charge_cents == 42000, after_hours_charge_cents == 21000, discount_cents == 14400, total_cents == 129600"
            - "FINAL invoice: staffing_charge_cents == 12000 (min-shift floor: actual 1.5h bills 2.0h x 6000), after_hours_charge_cents == 6000, discount_cents == 4950, total_cents == 94050"
            - "FINAL discount tier is 5% on subtotal 99000 — tier RE-KEYED on the final pre-discount subtotal (below the 100000 threshold), proving pinned evaluation order"
            - "Total delta 129600 - 94050 == 35550 = staffing delta 30000 + after_hours delta 15000 - discount delta 9450"

      - name: staffing_round_per_component_then_sum
        grounds:
          - calculations.staffing_charge
          - calculations.after_hours_charge
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters — scaffold pins round-per-component
          THEN sum. Discriminating fixture: custodial rate 3333/h x actual 1.5h.
          Pinned: staffing = round_half_up(4999.5) = 5000; after_hours = round_half_up(5000
          x 0.75) = 3750; pair sum 8750. Sum-raw-then-round yields round_half_up(4999.5 x
          1.75) = round_half_up(8749.125) = 8749 — one cent apart.
        test_recipe:
          setup:
            - "Site WHS STANDARD facility STG (capacity 100, buffers 30/30, requires_custodian=true)"
            - "Custom policy NONPROFIT x STANDARD: hourly 5000, custodial_hourly_cents 3333, bp 2000, floor 10000"
            - "NONPROFIT renter, headcount 50, VALID insurance tier 1 (100000000/200000000)"
            - "Event Sat 2026-10-03 18:00-19:00 local = 2026-10-04T01:00:00Z..02:00:00Z UTC; custodial window 17:30-19:30 = 2.0h estimated; weekend true, after-hours true (minutes beyond 18:00) -> uplift 0.75"
            - "Verified actual_hours 1.5 -> staffing round(1.5*3333)=round(4999.5)=5000; after round(5000*0.75)=3750"
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "WHS", display_name: "Westside High", rental_timezone: "America/Los_Angeles" }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
            - call: "POST /district/sites/${site_id}/facilities"
              payload: { facility_code: "STG", facility_tier: "STANDARD", capacity: 100, setup_buffer_minutes: 30, teardown_buffer_minutes: 30, requires_custodian: true }
              as: DistrictAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /district/rate_policies"
              payload: { policy_code: "NP-STD-3333", rate_class: "NONPROFIT", facility_tier: "STANDARD", hourly_rate_cents: 5000, deposit_basis_points: 2000, custodial_hourly_cents: 3333, effective_from: "2026-01-01T00:00:00Z", deposit_floor_cents: 10000 }
              as: DistrictAdmin
            - call: "POST /district/renters"
              payload: { org_name: "Westside Drama Boosters", rate_class: "NONPROFIT", nonprofit_registration_no: "98-7654321" }
              as: FacilitiesDirector
              captures: { org_id: $.data.id }
            - call: "POST /district/renters/${org_id}/insurance_certificates"
              payload: { insurer_name: "Aegis Mutual", per_occurrence_limit_cents: 100000000, aggregate_limit_cents: 200000000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/renters/${org_id}/requests"
              payload: { facility_id: "${fac_id}", event_title: "Evening Rehearsal", headcount_estimate: 50, starts_at: "2026-10-04T01:00:00Z", ends_at: "2026-10-04T02:00:00Z" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
              captures: { req_id: $.data.id }
            - call: "POST /district/renters/${org_id}/requests/${req_id}/submit"
              payload: {}
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/requests/${req_id}/begin_review"
              payload: {}
              as: SiteCoordinator
              captures: { req_vr: $.data.version }
            - call: "POST /district/requests/${req_id}/approve"
              payload: { expected_request_version: "${req_vr}" }
              as: FacilitiesDirector
              captures: { permit_id: $.data.id }
            - call: "POST /district/permits/${permit_id}/payments"
              payload: { txn_kind: "DEPOSIT_CAPTURE", amount_cents: 10000, idempotency_key: "dep-d-1" }
              as: RenterOrgRep
              as_user_id: "${org_id}"
            - call: "POST /district/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-04T12:00:00Z" }
              as: DistrictAdmin
            - call: "POST /district/permits/${permit_id}/complete"
              payload: {}
              as: SiteCoordinator
            - call: "GET /district/permits/${permit_id}/work_orders"
              payload: {}
              as: CustodialSupervisor
              captures: { wo_id: "$.data[0].id" }
            - call: "POST /district/work_orders/${wo_id}/verify"
              payload: { actual_hours: 1.5 }
              as: CustodialSupervisor
          trigger:
            - call: "GET /district/permits/${permit_id}/invoices"
              payload: {}
              as: FacilitiesDirector
          assert:
            - "FINAL invoice staffing_charge_cents == 5000 (round_half_up(1.5 x 3333) = round_half_up(4999.5); truncation would give 4999)"
            - "FINAL invoice after_hours_charge_cents == 3750 (0.75 x already-rounded 5000)"
            - "FINAL invoice total_cents == 13750 (rental 5000 + staffing 5000 + after 3750; subtotal 13750 < 50000 -> no discount)"
            - "Pinned per-component rounding yields staffing+after == 8750; the forbidden sum-raw-then-round order yields 8749 — one-cent divergence proves rounding order"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: rental_request_revision_cycle_seniority_preserved
        grounds:
          - state_machines.RentalRequest.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.RentalRequest.REVISION_REQUESTED_to_RESUBMITTED
          - state_machines.RentalRequest.RESUBMITTED_to_UNDER_REVIEW
          - entities.RentalRequest.fields.revision_round
        distinguishing_aspect: |
          Cyclic machine on RentalRequest: UNDER_REVIEW -> REVISION_REQUESTED ->
          RESUBMITTED -> UNDER_REVIEW loops up to 3 times; revision_round increments
          only on resubmit, and submitted_at (the conflict-ordering key) is NOT
          refreshed by resubmission — the looped request keeps original seniority.
        test_recipe:
          setup:
            - "Site RHS STANDARD GYM, NONPROFIT renter with insurance, event 2026-11-14T01:00:00Z..05:00:00Z"
            - "Clock T0 = 2026-08-10T00:00:00Z at submit -> submitted_at == T0"
            - "Two full cycles: begin_review -> request_revision -> resubmit(150) -> begin_review -> request_revision -> resubmit(120) -> begin_review"
          setup_api_calls:
            - call: "POST /district/sites"
              payload: { site_code: "RHS", display_name: "Riverview High", rental_timezone: "America/Los_Angeles" }
              as: DistrictAdmin
              captures: { site_id: $.data.id }
