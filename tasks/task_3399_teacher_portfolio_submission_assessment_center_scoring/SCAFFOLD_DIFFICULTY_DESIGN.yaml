# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3399_teacher_portfolio_submission_assessment_center_scoring
# 9 rules x 2 instances. Every chain replays against SCAFFOLD.yaml §1.2/§1.4/§1.6.
# Standard fixtures: cycle NB-2027 components CKA(ASSESSMENT 0.40) + P1/P2/P3
# (PORTFOLIO 0.20), window [2027-01-01, 2027-03-01), retake close 2027-04-15,
# threshold 1.75, max_attempts 2. Portfolio minimal compliant artifact set:
# 1 WRITTEN_COMMENTARY pdf + 1 VIDEO mp4 with subject_student_count 0 (no
# release form required at 0 students).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: certification_weighted_total_provisional_latest_vs_final_max
        grounds:
          - calculations.weighted_certification_score
          - calculations.counted_score
          - entities.Certification.fields.weighted_total_provisional
          - entities.Certification.fields.weighted_total_final
        distinguishing_aspect: "On identical attempt data (P2 attempt1 SCORED 1.50, retake attempt2 SCORED 1.25), the provisional variant over the LATEST attempt yields 2.35 while the final variant over the MAX of SCORED attempts yields 2.40 — dual-variant logic on the Certification domain, distinct from the Assessor reliability variants."
        test_recipe:
          setup:
            - "Clock 2027-01-10; cycle NB-2027 OPEN (threshold 1.75, max_attempts 2); candidate A (NM, district D-100, fte 1.0) ELIGIBLE; assessors R1 (D-900) and R2 (D-901) ACTIVE; center capacity 5."
            - "All four components SCORED for candidate A: CKA 3.00 (booking), P1 2.50, P2 1.50, P3 2.00 (agreeing read pairs); Certification decided CERTIFIED with weighted_total_final 2.40."
          setup_api_calls:
            - &clk_jan10
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-10T00:00:00Z" }
              as: BoardAdministrator
            - &mk_cycle_nb
              call: "POST /cycles"
              payload: { code: "NB-2027", components: [ { code: "CKA", kind: "ASSESSMENT", weight: 0.40 }, { code: "P1", kind: "PORTFOLIO", weight: 0.20 }, { code: "P2", kind: "PORTFOLIO", weight: 0.20 }, { code: "P3", kind: "PORTFOLIO", weight: 0.20 } ], submission_window_open: "2027-01-01T00:00:00Z", submission_window_close: "2027-03-01T00:00:00Z", retake_window_close: "2027-04-15T00:00:00Z", certification_threshold: 1.75, max_attempts_per_component: 2 }
              as: BoardAdministrator
              captures: { cyc_id: $.data.id }
            - &open_cycle_nb
              call: "POST /cycles/${cyc_id}/transition"
              payload: { to: "OPEN" }
              as: BoardAdministrator
            - &mk_cand_a
              call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
            - &elig_a_submit
              call: "POST /candidates/${cand_a}/submit-eligibility"
              payload: { license_document_ref: "lic-a.pdf", employer_verification_ref: "emp-a.pdf" }
              as: Candidate
              as_user_id: "${cand_a}"
            - &elig_a_verify
              call: "POST /candidates/${cand_a}/verify-eligibility"
              payload: { decision: "APPROVE" }
              as: BoardAdministrator
            - &mk_bench
              call: "POST /benchmarks"
              payload: { component_code: "P1", content_domain: "math", known_score: 3.00 }
              as: ScoringAdministrator
              captures: { bm_id: $.data.id }
            - &mk_r1
              call: "POST /assessors"
              payload: { full_name: "Reader One", email: "r1@x.com", home_district_code: "D-900" }
              as: ScoringAdministrator
              captures: { as1: $.data.id }
            - &r1_train
              call: "POST /assessors/${as1}/transition"
              payload: { to: "IN_TRAINING" }
              as: ScoringAdministrator
            - &r1_calibrating
              call: "POST /assessors/${as1}/transition"
              payload: { to: "CALIBRATING" }
              as: ScoringAdministrator
            - &r1_cal_asg1
              call: "POST /assignments"
              payload: { benchmark_id: "${bm_id}", assessor_id: "${as1}" }
              as: ScoringAdministrator
              captures: { r1ca1: $.data.id }
            - &r1_cal_score1
              call: "POST /assignments/${r1ca1}/submit-score"
              payload: { score: 3.00 }
              as: Assessor
              as_user_id: "${as1}"
            - &r1_cal_asg2
              call: "POST /assignments"
              payload: { benchmark_id: "${bm_id}", assessor_id: "${as1}" }
              as: ScoringAdministrator
              captures: { r1ca2: $.data.id }
            - &r1_cal_score2
              call: "POST /assignments/${r1ca2}/submit-score"
              payload: { score: 3.25 }
              as: Assessor
              as_user_id: "${as1}"
            - &r1_active
              call: "POST /assessors/${as1}/transition"
              payload: { to: "ACTIVE" }
              as: ScoringAdministrator
            - &mk_r2
              call: "POST /assessors"
              payload: { full_name: "Reader Two", email: "r2@x.com", home_district_code: "D-901" }
              as: ScoringAdministrator
              captures: { as2: $.data.id }
            - &r2_train
              call: "POST /assessors/${as2}/transition"
              payload: { to: "IN_TRAINING" }
              as: ScoringAdministrator
            - &r2_calibrating
              call: "POST /assessors/${as2}/transition"
              payload: { to: "CALIBRATING" }
              as: ScoringAdministrator
            - &r2_cal_asg1
              call: "POST /assignments"
              payload: { benchmark_id: "${bm_id}", assessor_id: "${as2}" }
              as: ScoringAdministrator
              captures: { r2ca1: $.data.id }
            - &r2_cal_score1
              call: "POST /assignments/${r2ca1}/submit-score"
              payload: { score: 3.00 }
              as: Assessor
              as_user_id: "${as2}"
            - &r2_cal_asg2
              call: "POST /assignments"
              payload: { benchmark_id: "${bm_id}", assessor_id: "${as2}" }
              as: ScoringAdministrator
              captures: { r2ca2: $.data.id }
            - &r2_cal_score2
              call: "POST /assignments/${r2ca2}/submit-score"
              payload: { score: 3.25 }
              as: Assessor
              as_user_id: "${as2}"
            - &r2_active
              call: "POST /assessors/${as2}/transition"
              payload: { to: "ACTIVE" }
              as: ScoringAdministrator
            - &mk_center5
              call: "POST /assessment-centers"
              payload: { name: "Center Five", region_code: "NW", slot_capacity: 5 }
              as: BoardAdministrator
              captures: { ctr_id: $.data.id }
            # --- CKA component scored 3.00 via assessment-center booking ---
            - &cka_sub
              call: "POST /cycles/${cyc_id}/submissions"
              payload: { component_code: "CKA" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_cka: $.data.id }
            - &cka_book
              call: "POST /bookings"
              payload: { center_id: "${ctr_id}", cycle_id: "${cyc_id}", slot_start_at: "2027-01-20T14:00:00Z" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { bk_id: $.data.id }
            - &clk_jan20
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-20T15:00:00Z" }
              as: BoardAdministrator
            - &cka_complete
              call: "POST /bookings/${bk_id}/transition"
              payload: { to: "COMPLETED", earned_score: 3.00 }
              as: ScoringAdministrator
            # --- P1 portfolio scored 2.50 by agreeing reads ---
            - &p1_sub
              call: "POST /cycles/${cyc_id}/submissions"
              payload: { component_code: "P1" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_p1: $.data.id }
            - &p1_art_wc
              call: "POST /submissions/${sub_p1}/artifacts"
              payload: { artifact_type: "WRITTEN_COMMENTARY", file_format: "pdf", file_size_mb: 2 }
              as: Candidate
              as_user_id: "${cand_a}"
            - &p1_art_vid
              call: "POST /submissions/${sub_p1}/artifacts"
              payload: { artifact_type: "VIDEO", file_format: "mp4", file_size_mb: 120, duration_minutes: 10, subject_student_count: 0 }
              as: Candidate
              as_user_id: "${cand_a}"
            - &p1_submit
              call: "POST /submissions/${sub_p1}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_a}"
            - &p1_accept
              call: "POST /submissions/${sub_p1}/tech-review"
              payload: { decision: "ACCEPT" }
              as: ScoringAdministrator
            - &p1_asg1
              call: "POST /assignments"
              payload: { submission_id: "${sub_p1}", assessor_id: "${as1}" }
              as: ScoringAdministrator
              captures: { asg_p1_r1: $.data.id }
            - &p1_score1
              call: "POST /assignments/${asg_p1_r1}/submit-score"
              payload: { score: 2.50 }
              as: Assessor
              as_user_id: "${as1}"
            - &p1_asg2
              call: "POST /assignments"
              payload: { submission_id: "${sub_p1}", assessor_id: "${as2}" }
              as: ScoringAdministrator
              captures: { asg_p1_r2: $.data.id }
            - &p1_score2
              call: "POST /assignments/${asg_p1_r2}/submit-score"
              payload: { score: 2.50 }
              as: Assessor
              as_user_id: "${as2}"
            # --- P2 portfolio scored 1.50 (attempt 1) ---
            - call: "POST /cycles/${cyc_id}/submissions"
              payload: { component_code: "P2" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_p2: $.data.id }
            - call: "POST /submissions/${sub_p2}/artifacts"
              payload: { artifact_type: "WRITTEN_COMMENTARY", file_format: "pdf", file_size_mb: 2 }
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "POST /submissions/${sub_p2}/artifacts"
              payload: { artifact_type: "VIDEO", file_format: "mp4", file_size_mb: 120, duration_minutes: 10, subject_student_count: 0 }
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "POST /submissions/${sub_p2}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "POST /submissions/${sub_p2}/tech-review"
              payload: { decision: "ACCEPT" }
              as: ScoringAdministrator
            - call: "POST /assignments"
              payload: { submission_id: "${sub_p2}", assessor_id: "${as1}" }
              as: ScoringAdministrator
              captures: { asg_p2_r1: $.data.id }
            - call: "POST /assignments/${asg_p2_r1}/submit-score"
              payload: { score: 1.50 }
              as: Assessor
              as_user_id: "${as1}"
            - call: "POST /assignments"
              payload: { submission_id: "${sub_p2}", assessor_id: "${as2}" }
              as: ScoringAdministrator
              captures: { asg_p2_r2: $.data.id }
            - call: "POST /assignments/${asg_p2_r2}/submit-score"
              payload: { score: 1.50 }
              as: Assessor
              as_user_id: "${as2}"
            # --- P3 portfolio scored 2.00; decision CERTIFIED 2.40 fires here ---
            - &p3_sub
              call: "POST /cycles/${cyc_id}/submissions"
              payload: { component_code: "P3" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_p3: $.data.id }
            - &p3_art_wc
              call: "POST /submissions/${sub_p3}/artifacts"
              payload: { artifact_type: "WRITTEN_COMMENTARY", file_format: "pdf", file_size_mb: 2 }
              as: Candidate
              as_user_id: "${cand_a}"
            - &p3_art_vid
              call: "POST /submissions/${sub_p3}/artifacts"
              payload: { artifact_type: "VIDEO", file_format: "mp4", file_size_mb: 120, duration_minutes: 10, subject_student_count: 0 }
              as: Candidate
              as_user_id: "${cand_a}"
            - &p3_submit
              call: "POST /submissions/${sub_p3}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_a}"
            - &p3_accept
              call: "POST /submissions/${sub_p3}/tech-review"
              payload: { decision: "ACCEPT" }
              as: ScoringAdministrator
            - &p3_asg1
              call: "POST /assignments"
              payload: { submission_id: "${sub_p3}", assessor_id: "${as1}" }
              as: ScoringAdministrator
              captures: { asg_p3_r1: $.data.id }
            - &p3_score1
              call: "POST /assignments/${asg_p3_r1}/submit-score"
              payload: { score: 2.00 }
              as: Assessor
              as_user_id: "${as1}"
            - &p3_asg2
              call: "POST /assignments"
              payload: { submission_id: "${sub_p3}", assessor_id: "${as2}" }
              as: ScoringAdministrator
              captures: { asg_p3_r2: $.data.id }
            - &p3_score2
              call: "POST /assignments/${asg_p3_r2}/submit-score"
              payload: { score: 2.00 }
              as: Assessor
              as_user_id: "${as2}"
            - &get_cert_list
              call: "GET /certifications"
              payload: { candidate_id: "${cand_a}", cycle_id: "${cyc_id}" }
              as: BoardAdministrator
              captures: { cert_id: "$.data[0].id" }
          trigger:
            # Retake P2 (attempt 2) and score it WORSE: 1.25 / 1.25 -> 1.25
            - call: "POST /submissions/${sub_p2}/retake"
              payload: {}
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { sub_p2b: $.data.id }
            - call: "POST /submissions/${sub_p2b}/artifacts"
              payload: { artifact_type: "WRITTEN_COMMENTARY", file_format: "pdf", file_size_mb: 2 }
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "POST /submissions/${sub_p2b}/artifacts"
              payload: { artifact_type: "VIDEO", file_format: "mp4", file_size_mb: 120, duration_minutes: 10, subject_student_count: 0 }
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "POST /submissions/${sub_p2b}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_a}"
            - call: "POST /submissions/${sub_p2b}/tech-review"
              payload: { decision: "ACCEPT" }
              as: ScoringAdministrator
            - call: "POST /assignments"
              payload: { submission_id: "${sub_p2b}", assessor_id: "${as1}" }
              as: ScoringAdministrator
              captures: { asg_p2b_r1: $.data.id }
            - call: "POST /assignments/${asg_p2b_r1}/submit-score"
              payload: { score: 1.25 }
              as: Assessor
              as_user_id: "${as1}"
            - call: "POST /assignments"
              payload: { submission_id: "${sub_p2b}", assessor_id: "${as2}" }
              as: ScoringAdministrator
              captures: { asg_p2b_r2: $.data.id }
            - call: "POST /assignments/${asg_p2b_r2}/submit-score"
              payload: { score: 1.25 }
              as: Assessor
              as_user_id: "${as2}"
            - call: "GET /certifications/${cert_id}"
              payload: {}
              as: BoardAdministrator
            - call: "GET /submissions/${sub_p2}"
              payload: {}
              as: BoardAdministrator
            - call: "GET /submissions/${sub_p2b}"
              payload: {}
              as: BoardAdministrator
          assert:
            - "Certification.${cert_id}.weighted_total_provisional == 2.35 (latest-attempt variant: 1.20 + 0.50 + 0.25 + 0.40)"
            - "Certification.${cert_id}.weighted_total_final == 2.40 (max-across-attempts variant: 1.20 + 0.50 + 0.30 + 0.40)"
            - "Certification.${cert_id}.status == CERTIFIED (a worse retake never demotes a decided certification)"
            - "ComponentSubmission.${sub_p2}.final_score == 1.50 and ComponentSubmission.${sub_p2b}.final_score == 1.25"
            - "ComponentSubmission.${sub_p2}.counted_score == 1.50 and ComponentSubmission.${sub_p2b}.counted_score == 1.50 (both attempts carry the max)"
            - "ComponentSubmission.${sub_p2}.superseded == true and ComponentSubmission.${sub_p2b}.attempt_number == 2"

      - name: assessor_reliability_exact_vs_adjacent_rates
        grounds:
          - calculations.assessor_reliability_index
          - entities.Assessor.fields.exact_agreement_rate
          - entities.Assessor.fields.adjacent_agreement_rate
          - state_machines.Assessor.ACTIVE_to_SUSPENDED
        distinguishing_aspect: "On an identical set of 10 finalized live reads the exact variant rates the assessor 0.50 (below the 0.70 floor -> auto-SUSPENDED) while the adjacent variant rates the same reads 1.00 — dual-variant logic on the Assessor domain, distinct from the Certification weighted-total variants."
        test_recipe:
          setup:
            - "Clock 2027-01-10; cycle REL-2027 OPEN with components K1 (ASSESSMENT, 0.10) and C1..C10 (PORTFOLIO, 0.09 each)."
            - "Candidate B (NM, D-100) ELIGIBLE; assessor AX (D-900) ACTIVE and assessor AY (D-901) ACTIVE."
            - "Ten portfolio submissions C1..C10 each SCORED by read pair (AX, AY): AX scores 3.00 everywhere; AY scores 3.00 on C1..C5 (finals 3.00, AX exact) and 3.50 on C6..C10 (finals 3.25, AX off by exactly 0.25 — inside DIVERGENCE_TOLERANCE 0.50 so no adjudication)."
          setup_api_calls:
            - *clk_jan10
            - call: "POST /cycles"
              payload: { code: "REL-2027", components: [ { code: "K1", kind: "ASSESSMENT", weight: 0.10 }, { code: "C1", kind: "PORTFOLIO", weight: 0.09 }, { code: "C2", kind: "PORTFOLIO", weight: 0.09 }, { code: "C3", kind: "PORTFOLIO", weight: 0.09 }, { code: "C4", kind: "PORTFOLIO", weight: 0.09 }, { code: "C5", kind: "PORTFOLIO", weight: 0.09 }, { code: "C6", kind: "PORTFOLIO", weight: 0.09 }, { code: "C7", kind: "PORTFOLIO", weight: 0.09 }, { code: "C8", kind: "PORTFOLIO", weight: 0.09 }, { code: "C9", kind: "PORTFOLIO", weight: 0.09 }, { code: "C10", kind: "PORTFOLIO", weight: 0.09 } ], submission_window_open: "2027-01-01T00:00:00Z", submission_window_close: "2027-03-01T00:00:00Z", retake_window_close: "2027-04-15T00:00:00Z", certification_threshold: 1.75, max_attempts_per_component: 2 }
              as: BoardAdministrator
              captures: { cyc_r: $.data.id }
            - call: "POST /cycles/${cyc_r}/transition"
              payload: { to: "OPEN" }
              as: BoardAdministrator
            - call: "POST /candidates"
              payload: { full_name: "Candidate B", email: "b@x.com", license_number: "LIC-B", license_state: "NM", district_code: "D-100", years_experience: 8 }
              as: Anonymous
              captures: { cand_b: $.data.id }
            - call: "POST /candidates/${cand_b}/submit-eligibility"
              payload: { license_document_ref: "lic-b.pdf", employer_verification_ref: "emp-b.pdf" }
              as: Candidate
              as_user_id: "${cand_b}"
            - call: "POST /candidates/${cand_b}/verify-eligibility"
              payload: { decision: "APPROVE" }
              as: BoardAdministrator
            - *mk_bench
            - call: "POST /assessors"
              payload: { full_name: "Reader X", email: "rx@x.com", home_district_code: "D-900" }
              as: ScoringAdministrator
              captures: { asx: $.data.id }
            - call: "POST /assessors/${asx}/transition"
              payload: { to: "IN_TRAINING" }
              as: ScoringAdministrator
            - call: "POST /assessors/${asx}/transition"
              payload: { to: "CALIBRATING" }
              as: ScoringAdministrator
            - call: "POST /assignments"
              payload: { benchmark_id: "${bm_id}", assessor_id: "${asx}" }
              as: ScoringAdministrator
              captures: { axc1: $.data.id }
            - call: "POST /assignments/${axc1}/submit-score"
              payload: { score: 3.00 }
              as: Assessor
              as_user_id: "${asx}"
            - call: "POST /assignments"
              payload: { benchmark_id: "${bm_id}", assessor_id: "${asx}" }
              as: ScoringAdministrator
              captures: { axc2: $.data.id }
            - call: "POST /assignments/${axc2}/submit-score"
              payload: { score: 3.25 }
              as: Assessor
              as_user_id: "${asx}"
            - call: "POST /assessors/${asx}/transition"
              payload: { to: "ACTIVE" }
              as: ScoringAdministrator
            - call: "POST /assessors"
              payload: { full_name: "Reader Y", email: "ry@x.com", home_district_code: "D-901" }
              as: ScoringAdministrator
              captures: { asy: $.data.id }
            - call: "POST /assessors/${asy}/transition"
              payload: { to: "IN_TRAINING" }
              as: ScoringAdministrator
            - call: "POST /assessors/${asy}/transition"
              payload: { to: "CALIBRATING" }
              as: ScoringAdministrator
            - call: "POST /assignments"
              payload: { benchmark_id: "${bm_id}", assessor_id: "${asy}" }
              as: ScoringAdministrator
              captures: { ayc1: $.data.id }
            - call: "POST /assignments/${ayc1}/submit-score"
              payload: { score: 3.00 }
              as: Assessor
              as_user_id: "${asy}"
            - call: "POST /assignments"
              payload: { benchmark_id: "${bm_id}", assessor_id: "${asy}" }
              as: ScoringAdministrator
              captures: { ayc2: $.data.id }
            - call: "POST /assignments/${ayc2}/submit-score"
              payload: { score: 3.25 }
              as: Assessor
              as_user_id: "${asy}"
            - call: "POST /assessors/${asy}/transition"
              payload: { to: "ACTIVE" }
              as: ScoringAdministrator
            # --- C1..C5: AX 3.00, AY 3.00 -> final 3.00 (AX exact) ---
            - call: "POST /cycles/${cyc_r}/submissions"
              payload: { component_code: "C1" }
              as: Candidate
              as_user_id: "${cand_b}"
              captures: { sub_c1: $.data.id }
            - call: "POST /submissions/${sub_c1}/artifacts"
              payload: { artifact_type: "WRITTEN_COMMENTARY", file_format: "pdf", file_size_mb: 2 }
              as: Candidate
              as_user_id: "${cand_b}"
            - call: "POST /submissions/${sub_c1}/artifacts"
              payload: { artifact_type: "VIDEO", file_format: "mp4", file_size_mb: 120, duration_minutes: 10, subject_student_count: 0 }
              as: Candidate
              as_user_id: "${cand_b}"
            - call: "POST /submissions/${sub_c1}/submit"
              payload: {}
              as: Candidate
              as_user_id: "${cand_b}"
            - call: "POST /submissions/${sub_c1}/tech-review"
              payload: { decision: "ACCEPT" }
              as: ScoringAdministrator
            - call: "POST /assignments"
              payload: { submission_id: "${sub_c1}", assessor_id: "${asx}" }
              as: ScoringAdministrator
              captures: { ax_c1: $.data.id }
            - call: "POST /assignments/${ax_c1}/submit-score"
              payload: { score: 3.00 }
              as: Assessor
              as_user_id: "${asx}"
            - call: "POST /assignments"
              payload: { submission_id: "${sub_c1}", assessor_id: "${asy}" }
              as: ScoringAdministrator
              captures: { ay_c1: $.data.id }
            - call: "POST /assignments/${ay_c1}/submit-score"
              payload: { score: 3.00 }
