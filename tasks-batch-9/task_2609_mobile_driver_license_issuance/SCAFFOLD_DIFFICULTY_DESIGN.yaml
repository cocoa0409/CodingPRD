            - "GET /mdl/holders/${holder_id} response data.address_version == 2"

  # ===========================================================================
  # RULE 7 - cross_entity_state_dependency
  # DIFFERENT entity pairs: DigitalCredential gated by Holder state, and
  # PresentationSession's fork decided by DigitalCredential's sync axis.
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: credential_activation_gated_by_holder_physical_credential_state
        grounds: "state_machines[DigitalCredential.lifecycle_state] PENDING_PROVISION -> ACTIVE precondition `Holder(holder_id).physical_credential_status == VALID`; validations priority 18"
        distinguishing_aspect: "Entity pair DigitalCredential -> Holder. The credential's own row is untouched between the two attempts - lifecycle_state stays PENDING_PROVISION and every field of the request is identical - so the only thing that changes the verdict is a state field on a DIFFERENT aggregate. The pair is also asymmetric: the SUSPENDED cascade skips PENDING_PROVISION credentials, so the gate here is a precondition read rather than a cascade write."
        test_recipe:
          setup: "One credential in PENDING_PROVISION on a BOUND handset, whose holder's underlying physical license has just been suspended by the agency."
