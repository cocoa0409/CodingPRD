# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Campus Housing & Dorm Assignment — breadth probe over §1.1–§1.7.
# Walks references/claim-extraction-guide.md row-by-row against this scaffold.
# excluded_because: stubs cite §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_building_returns_201_with_computed_counters_zero
        claim_type: Creation
        grounds:
          - entities.Building
          - endpoints
        distinguishing_aspect: "POST /buildings with name+building_type returns 201, total_bed_count==0, occupied_bed_count==0, version==1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /buildings"
              payload: { name: "Alpha Hall", building_type: SUITE }
              as: HousingOfficer
              captures: { b_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Building.${b_id}.total_bed_count == 0"
            - "Building.${b_id}.occupied_bed_count == 0"
            - "Building.${b_id}.version == 1"

      - name: room_bed_capacity_computed_from_room_type
        claim_type: Computed Fields
        grounds:
          - entities.Room.fields.bed_capacity
          - entities.Room.fields.room_type
        distinguishing_aspect: "Creating a TRIPLE room yields bed_capacity==3 regardless of any client-supplied value; SINGLE yields 1."
        test_recipe:
          setup: ["A building exists"]
          setup_api_calls:
            - call: "POST /buildings"
              payload: { name: "Cap Build", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { cb_id: $.data.id }
          trigger:
            - call: "POST /buildings/${cb_id}/rooms"
              payload: { room_number: "X1", room_type: TRIPLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
              captures: { r_id: $.data.id }
          assert:
            - "Room.${r_id}.bed_capacity == 3"
            - "Room.${r_id}.status == OPEN"
            - "Room.${r_id}.occupied_bed_count == 0"

      - name: create_application_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.Application.fields.preferred_room_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /applications without preferred_room_type returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A cycle and student exist"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Req R", class_year: SENIOR, gender_identity: MALE, lottery_number: 200 }
              as: HousingOfficer
              captures: { s_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "REQ_T" }
              as: HousingOfficer
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { cycle_id: "${c_id}", student_id: "${s_id}", preferred_building_type: NO_PREFERENCE }
              as: Student
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

      - name: create_student_invalid_enum_class_year_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Student.fields.class_year
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /students with class_year=GRAD (not in enum) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { full_name: "Bad Enum", class_year: GRAD, gender_identity: MALE, lottery_number: 1 }
              as: HousingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "response.status == 400"

      - name: get_room_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Room
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /rooms/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /rooms/00000000-0000-0000-0000-000000000999"
              payload: {}
              as: HousingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: student_system_fields_ignored_on_create
        claim_type: System Fields
        grounds:
          - entities.Student.fields.account_balance_cents
          - entities.Student.fields.status
        distinguishing_aspect: "POST /students ignores client-sent status/account_balance_cents; server sets status=ACTIVE, account_balance_cents=0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /students"
              payload: { full_name: "Sys S", class_year: JUNIOR, gender_identity: FEMALE, lottery_number: 7 }
              as: HousingOfficer
              captures: { s_id: $.data.id }
          assert:
            - "Student.${s_id}.status == ACTIVE"
            - "Student.${s_id}.account_balance_cents == 0"
            - "Student.${s_id}.version == 1"

      - name: building_offers_break_housing_default_false
        claim_type: Defaults
        grounds:
          - entities.Building.fields.offers_break_housing
        distinguishing_aspect: "POST /buildings omitting offers_break_housing yields offers_break_housing==false and break_housing_capacity==0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /buildings"
              payload: { name: "Default Hall", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { b_id: $.data.id }
          assert:
            - "Building.${b_id}.offers_break_housing == false"
            - "Building.${b_id}.break_housing_capacity == 0"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: accept_on_draft_application_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Application.OFFERED_to_ACCEPTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST accept on a DRAFT (never-submitted) application returns ERR_INVALID_STATE (409); no Assignment created."
        test_recipe:
          setup: ["A DRAFT application that has never been submitted or offered"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Draft D", class_year: SENIOR, gender_identity: MALE, lottery_number: 210 }
              as: HousingOfficer
              captures: { s_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "DRAFT_T" }
              as: HousingOfficer
              captures: { c_id: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${c_id}", student_id: "${s_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: SINGLE }
              as: Student
              as_user_id: "${s_id}"
              captures: { app_id: $.data.id, app_v: $.data.version }
          trigger:
            - call: "POST /applications/${app_id}/accept"
              payload: { expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Application.${app_id}.status == DRAFT"

      - name: lock_group_not_full_returns_group_size_invalid
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RoommateGroup.FORMING_to_LOCKED
          - validations[priority=12]
          - errors[ERR_GROUP_SIZE_INVALID]
        distinguishing_aspect: "Lock a FORMING group of target_size 2 with only the owner ACCEPTED (count 1) returns ERR_GROUP_SIZE_INVALID (409); status stays FORMING."
        test_recipe:
          setup: ["A FORMING group target_size 2 with accepted_member_count 1 (owner only)"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Lonely Owner", class_year: JUNIOR, gender_identity: MALE, lottery_number: 220 }
              as: HousingOfficer
              captures: { o_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "LOCK_T" }
              as: HousingOfficer
              captures: { c_id: $.data.id }
            - call: "POST /roommate-groups"
              payload: { cycle_id: "${c_id}", owner_student_id: "${o_id}", target_size: 2 }
              as: Student
              as_user_id: "${o_id}"
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /roommate-groups/${g_id}/lock"
              payload: {}
              as: Student
              as_user_id: "${o_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_GROUP_SIZE_INVALID"
            - "RoommateGroup.${g_id}.status == FORMING"

      - name: resolve_already_resolved_incident_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.IncidentReport.OPEN_to_RESOLVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Resolving an already RESOLVED (terminal) incident returns ERR_INVALID_STATE (409); open_incident_count not double-decremented."
        test_recipe:
          setup: ["A RESOLVED incident report on a room"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "RA Rita", class_year: SENIOR, gender_identity: FEMALE, lottery_number: 230 }
              as: HousingOfficer
              captures: { ra_id: $.data.id }
            - call: "POST /buildings"
              payload: { name: "Incident Hall", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "IH1", room_type: SINGLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
              captures: { r_id: $.data.id }
            - call: "POST /incident-reports"
              payload: { room_id: "${r_id}", reporter_student_id: "${ra_id}", severity: MINOR }
              as: ResidentAdvisor
              as_user_id: "${ra_id}"
              captures: { inc_id: $.data.id }
            - call: "POST /incident-reports/${inc_id}/resolve"
              payload: {}
              as: HousingOfficer
          trigger:
            - call: "POST /incident-reports/${inc_id}/resolve"
              payload: {}
              as: HousingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "IncidentReport.${inc_id}.status == RESOLVED"

      - name: new_application_starts_in_draft
        claim_type: Initial State
        grounds:
          - state_machines.Application
          - entities.Application.fields.status
        distinguishing_aspect: "A freshly created Application has status==DRAFT and priority_rank==null before submit."
        test_recipe:
          setup: ["A cycle and student exist"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Init I", class_year: SOPHOMORE, gender_identity: NONBINARY, lottery_number: 240 }
              as: HousingOfficer
              captures: { s_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "INIT_T" }
              as: HousingOfficer
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { cycle_id: "${c_id}", student_id: "${s_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: NO_PREFERENCE }
              as: Student
              as_user_id: "${s_id}"
              captures: { app_id: $.data.id }
          assert:
            - "Application.${app_id}.status == DRAFT"
            - "Application.${app_id}.priority_rank == null"

      - name: incident_open_to_escalated_restricts_room
        claim_type: Side Effect Execution
        grounds:
          - state_machines.IncidentReport.OPEN_to_ESCALATED
          - entities.Room.fields.status
          - entities.Room.fields.open_incident_count
        distinguishing_aspect: "Escalating an open incident leaves the room with status RESTRICTED and open_incident_count still 1 (ESCALATED counts as open)."
        test_recipe:
          setup: ["An OPEN incident on a room"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "RA Ray", class_year: SENIOR, gender_identity: MALE, lottery_number: 250 }
              as: HousingOfficer
              captures: { ra_id: $.data.id }
            - call: "POST /buildings"
              payload: { name: "Escalate Hall", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "EH1", room_type: SINGLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
              captures: { r_id: $.data.id }
            - call: "POST /incident-reports"
              payload: { room_id: "${r_id}", reporter_student_id: "${ra_id}", severity: MAJOR }
              as: ResidentAdvisor
              as_user_id: "${ra_id}"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /incident-reports/${inc_id}/escalate"
              payload: {}
              as: ResidentAdvisor
              as_user_id: "${ra_id}"
            - call: "GET /rooms/${r_id}"
              payload: {}
              as: HousingOfficer
              captures: { r_status: $.data.status, r_open: $.data.open_incident_count }
          assert:
            - "IncidentReport.${inc_id}.status == ESCALATED"
            - "Room.${r_id}.status == RESTRICTED"
            - "Room.${r_id}.open_incident_count == 1"

      - name: withdraw_after_assignment_open_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Application.SUBMITTED_to_WITHDRAWN
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Withdraw on an OFFERED application (cycle already ASSIGNMENT_OPEN) returns ERR_INVALID_STATE (409); withdraw is only valid from SUBMITTED."
        test_recipe:
          setup: ["An OFFERED application in a cycle that is ASSIGNMENT_OPEN"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Withdraw W", class_year: SENIOR, gender_identity: MALE, lottery_number: 260 }
              as: HousingOfficer
              captures: { s_id: $.data.id }
            - call: "POST /buildings"
              payload: { name: "Withdraw Hall", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "WH1", room_type: SINGLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
              captures: { r_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "WD_T" }
              as: HousingOfficer
              captures: { c_id: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${c_id}", student_id: "${s_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: SINGLE }
              as: Student
              as_user_id: "${s_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_id}"
            - call: "POST /housing-cycles/${c_id}/run-lottery"
              payload: {}
              as: HousingOfficer
            - call: "POST /housing-cycles/${c_id}/open-assignment"
              payload: {}
              as: HousingOfficer
          trigger:
            - call: "POST /applications/${app_id}/withdraw"
              payload: {}
              as: Student
              as_user_id: "${s_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Application.${app_id}.status == OFFERED"

      - name: cycle_close_expires_outstanding_offer
        claim_type: Side Effect Execution
        grounds:
          - state_machines.HousingCycle.ASSIGNMENT_OPEN_to_CLOSED
          - state_machines.Application.OFFERED_to_EXPIRED
          - entities.Room.fields.occupied_bed_count
        distinguishing_aspect: "Closing a cycle with an unaccepted OFFERED application transitions it to EXPIRED and releases its reserved bed (Room.occupied_bed_count back to 0)."
        test_recipe:
          setup: ["An OFFERED application (bed reserved) in an ASSIGNMENT_OPEN cycle"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Expire E", class_year: SENIOR, gender_identity: MALE, lottery_number: 270 }
              as: HousingOfficer
              captures: { s_id: $.data.id }
            - call: "POST /buildings"
              payload: { name: "Expire Hall", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "EX1", room_type: SINGLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
              captures: { r_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "EXP_T" }
              as: HousingOfficer
              captures: { c_id: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${c_id}", student_id: "${s_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: SINGLE }
              as: Student
              as_user_id: "${s_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_id}"
            - call: "POST /housing-cycles/${c_id}/run-lottery"
              payload: {}
              as: HousingOfficer
            - call: "POST /housing-cycles/${c_id}/open-assignment"
              payload: {}
              as: HousingOfficer
          trigger:
            - call: "POST /housing-cycles/${c_id}/close"
              payload: {}
              as: HousingOfficer
            - call: "GET /rooms/${r_id}"
              payload: {}
              as: HousingOfficer
              captures: { occ_after: $.data.occupied_bed_count }
          assert:
            - "Application.${app_id}.status == EXPIRED"
            - "Room.${r_id}.occupied_bed_count == 0"

      - name: break_cancel_refunds_balance
        claim_type: Side Effect Execution
        grounds:
          - state_machines.BreakHousingRequest.APPROVED_to_CANCELLED
          - entities.Student.fields.account_balance_cents
        distinguishing_aspect: "Cancelling an APPROVED break request refunds total_charge_cents, returning Student.account_balance_cents to 0."
        test_recipe:
          setup: ["An APPROVED 7-night break request charged 31500 to a student with no other balance"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Refund R", class_year: SENIOR, gender_identity: FEMALE, lottery_number: 280 }
              as: HousingOfficer
              captures: { s_id: $.data.id }
            - call: "POST /buildings"
              payload: { name: "Refund Hall", building_type: APARTMENT, offers_break_housing: true, break_housing_capacity: 2 }
              as: HousingOfficer
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "RF1", room_type: SINGLE, gender_inclusivity: ALL_GENDER, nightly_break_rate_cents: 4500 }
              as: HousingOfficer
              captures: { r_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "RF_T" }
              as: HousingOfficer
              captures: { c_id: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${c_id}", student_id: "${s_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: SINGLE }
              as: Student
              as_user_id: "${s_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_id}"
            - call: "POST /housing-cycles/${c_id}/run-lottery"
              payload: {}
              as: HousingOfficer
            - call: "POST /housing-cycles/${c_id}/open-assignment"
              payload: {}
              as: HousingOfficer
            - call: "GET /applications/${app_id}"
              payload: {}
              as: HousingOfficer
              captures: { app_v: $.data.version }
            - call: "POST /applications/${app_id}/accept"
              payload: { expected_application_version: "${app_v}" }
              as: Student
              as_user_id: "${s_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /break-housing-requests"
              payload: { assignment_id: "${asg_id}", check_in_date: "2026-12-20T00:00:00Z", check_out_date: "2026-12-27T00:00:00Z" }
              as: Student
              as_user_id: "${s_id}"
              captures: { req_id: $.data.id }
            - call: "POST /break-housing-requests/${req_id}/approve"
              payload: {}
              as: HousingOfficer
          trigger:
            - call: "POST /break-housing-requests/${req_id}/cancel"
              payload: {}
              as: Student
              as_user_id: "${s_id}"
            - call: "GET /students/${s_id}"
              payload: {}
              as: HousingOfficer
              captures: { bal_after: $.data.account_balance_cents }
          assert:
            - "BreakHousingRequest.${req_id}.status == CANCELLED"
            - "Student.${s_id}.account_balance_cents == 0"

  # ===========================================================================
  - section: calculations
    instances:
      - name: priority_rank_senior_computed_on_submit
        claim_type: Correct Result
        grounds:
          - calculations.application_priority_rank
          - state_machines.Application.DRAFT_to_SUBMITTED
          - entities.Application.fields.priority_rank
        distinguishing_aspect: "Submitting an application for a SENIOR sets priority_rank==1 (SENIOR=1 per constants)."
        test_recipe:
          setup: ["A DRAFT application for a SENIOR student in an APPLICATION_OPEN cycle"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Senior Pri", class_year: SENIOR, gender_identity: MALE, lottery_number: 300 }
              as: HousingOfficer
              captures: { s_id: $.data.id }
            - call: "POST /housing-cycles"
              payload: { term_label: "PRI_T" }
              as: HousingOfficer
              captures: { c_id: $.data.id }
            - call: "POST /applications"
              payload: { cycle_id: "${c_id}", student_id: "${s_id}", preferred_building_type: NO_PREFERENCE, preferred_room_type: NO_PREFERENCE }
              as: Student
              as_user_id: "${s_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_id}"
              captures: { rank: $.data.priority_rank }
          assert:
            - "Application.${app_id}.priority_rank == 1"
            - "Application.${app_id}.status == SUBMITTED"

      - name: lottery_priority_order_senior_beats_freshman_for_scarce_room
        claim_type: Input Set Filtering
        grounds:
          - calculations.lottery_offer_selection
          - state_machines.Application.SUBMITTED_to_OFFERED
          - state_machines.Application.SUBMITTED_to_WAITLISTED
        distinguishing_aspect: "With one SINGLE room and two SUBMITTED apps, the SENIOR (rank 1) is OFFERED and the FRESHMAN (rank 4) is WAITLISTED — priority ordering, not creation order."
        test_recipe:
          setup: ["One SINGLE room; a FRESHMAN app submitted FIRST, then a SENIOR app submitted second"]
          setup_api_calls:
            - call: "POST /students"
              payload: { full_name: "Frosh First", class_year: FRESHMAN, gender_identity: MALE, lottery_number: 310 }
              as: HousingOfficer
              captures: { fr_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Senior Second", class_year: SENIOR, gender_identity: MALE, lottery_number: 311 }
              as: HousingOfficer
              captures: { sr_id: $.data.id }
            - call: "POST /buildings"
              payload: { name: "Scarce Hall", building_type: TRADITIONAL }
              as: HousingOfficer
              captures: { b_id: $.data.id }
            - call: "POST /buildings/${b_id}/rooms"
              payload: { room_number: "SC1", room_type: SINGLE, gender_inclusivity: ALL_GENDER }
              as: HousingOfficer
