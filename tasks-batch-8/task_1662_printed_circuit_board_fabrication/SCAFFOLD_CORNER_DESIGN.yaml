scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_customer_applies_defaults
        claim_type: defaults
        grounds: [entities.Customer.fields.tax_exempt]
        distinguishing_aspect: "Omitting tax_exempt applies the default false; system stamps id, created_at (logical clock default 2026-08-01T00:00:00Z), updated_at, version 1."
        test_recipe:
          setup: ["empty database; logical clock at default"]
          setup_api_calls: []
          trigger:
            - { call: "POST /pcb/customers", payload: { company_name: "Defaults Co", contact_email: "defaults@co.example", credit_limit_cents: 5000 }, as: FabAdmin, captures: { c: $.data.id, c_te: $.data.tax_exempt, c_v: $.data.version, c_ca: $.data.created_at } }
          assert:
            - "Customer.${c}.tax_exempt == false (default applied)"
            - "Customer.${c}.version == 1 and created_at == 2026-08-01T00:00:00Z (logical clock default, not wall clock)"
      - name: create_order_missing_quantity_returns_validation
        claim_type: required_fields
        grounds: [entities.FabOrder.fields.quantity_boards, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "A create payload missing required quantity_boards is rejected 400 ERR_VALIDATION before any state change."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Req Co", contact_email: "req@co.example", credit_limit_cents: 5000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION with http 400"
      - name: create_order_invalid_layer_count_returns_validation
        claim_type: type_constraints
        grounds: [entities.FabOrder.fields.layer_count, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "layer_count 3 is outside the enum {2,4,6,8} and is rejected 400 ERR_VALIDATION."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Enum Co", contact_email: "enum@co.example", credit_limit_cents: 5000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 3, surface_finish: "HASL", quantity_boards: 10, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION with http 400"
      - name: get_missing_order_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent FabOrder UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /pcb/fab-orders/00000000-0000-0000-0000-000000000000", payload: {}, as: FabAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"
      - name: list_orders_pagination_envelope
        claim_type: listing
        grounds: [response_envelope.pagination_defaults]
        distinguishing_aspect: "With 2 orders, GET ?limit=1 returns exactly 1 row with total_count 2 and has_more true inside the fixed envelope."
        test_recipe:
          setup: ["customer with 2 QUOTED orders"]
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Page Co", contact_email: "page@co.example", credit_limit_cents: 5000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 10, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 20, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}" }
          trigger:
            - { call: "GET /pcb/fab-orders", payload: { limit: 1 }, as: SalesEngineer }
          assert:
            - "response data has exactly 1 row; total_count == 2; has_more == true"
            - "envelope contains meta.api_request_id and meta.api_request_timestamp; response_type == array"
      - name: system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Customer]
        distinguishing_aspect: "Client-supplied id/version/created_at on create are ignored; the server mints its own identity fields."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /pcb/customers", payload: { company_name: "Ignore Co", contact_email: "ignore@co.example", credit_limit_cents: 5000, tax_exempt: false, id: "11111111-1111-1111-1111-111111111111", version: 99, created_at: "1999-01-01T00:00:00Z" }, as: FabAdmin, captures: { c: $.data.id, c_v: $.data.version } }
          assert:
            - "Customer.${c}.id != 11111111-1111-1111-1111-111111111111 and version == 1 and created_at == 2026-08-01T00:00:00Z"
      - name: computed_array_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.PanelArray.fields.boards_per_panel]
        distinguishing_aspect: "Client-supplied boards_per_panel 99 is ignored; the server computes 4 from array_x*array_y."
        test_recipe:
          setup: ["QUOTED order exists"]
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Comp Co", contact_email: "comp@co.example", credit_limit_cents: 5000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id, ord_v: $.data.version } }
          trigger:
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}", boards_per_panel: 99 }, as: CAMOperator, captures: { arr: $.data.id, bpp: $.data.boards_per_panel } }
          assert:
            - "PanelArray.${arr}.boards_per_panel == 4 (computed), not the supplied 99"
      - name: laminate_lot_codes_traceability
        claim_type: computed_fields
        grounds: [entities.FabOrder.fields.laminate_lot_codes]
        distinguishing_aspect: "After production start consumes the reservation, the order exposes the consumed lots' date-code lineage: laminate_lot_codes == [LOT-W1]."
        test_recipe:
          setup:
            - "Order IN_PRODUCTION whose 34 panels were consumed from lot LOT-W1"
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Trace Co", contact_email: "trace@co.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${ord}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/fab-orders/${ord}/drill-programs", payload: { revision: 1, min_hole_mils: 8, hole_count: 1200 }, as: CAMOperator, as_user_id: "cam_1", captures: { drl: $.data.id } }
            - { call: "POST /pcb/drill-programs/${drl}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/drill-programs/${drl}/approve", payload: {}, as: ProcessEngineer, as_user_id: "eng_1" }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-W1", manufacture_date: "2025-09-01T00:00:00Z", panels_total: 100 }, as: ProcessEngineer, captures: { lot: $.data.id } }
            - { call: "POST /pcb/laminate-lots/${lot}/qualify", payload: {}, as: QualityInspector, captures: { lot_v: $.data.version } }
            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "${lot}", panels_allocated: 34, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/release", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/start-production", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "GET /pcb/fab-orders/${ord}", payload: {}, as: ProductionPlanner, captures: { codes: $.data.laminate_lot_codes } }
          assert:
            - "FabOrder.${ord}.laminate_lot_codes == [\"LOT-W1\"] (sorted distinct lot codes of CONSUMED reservations)"
            - "GET LaminateLot.${lot}: panels_consumed == 34, panels_reserved == 0, panels_available == 66"
      - name: defect_record_retrieval_immutable
        claim_type: immutability
        grounds: [entities.DefectRecord]
        distinguishing_aspect: "DefectRecord is an append-only event (common_fields false): retrievable by id in the order's defect list, carrying id and created_at but no version/updated_at, with no update or delete endpoint in the surface."
        test_recipe:
          setup: ["Order IN_PRODUCTION with a RELEASED array"]
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Def Co", contact_email: "def@co.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${ord}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/fab-orders/${ord}/drill-programs", payload: { revision: 1, min_hole_mils: 8, hole_count: 1200 }, as: CAMOperator, as_user_id: "cam_1", captures: { drl: $.data.id } }
            - { call: "POST /pcb/drill-programs/${drl}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/drill-programs/${drl}/approve", payload: {}, as: ProcessEngineer, as_user_id: "eng_1" }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-D1", manufacture_date: "2025-09-01T00:00:00Z", panels_total: 100 }, as: ProcessEngineer, captures: { lot: $.data.id } }
            - { call: "POST /pcb/laminate-lots/${lot}/qualify", payload: {}, as: QualityInspector, captures: { lot_v: $.data.version } }
            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "${lot}", panels_allocated: 34, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/release", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/start-production", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "POST /pcb/fab-orders/${ord}/defects", payload: { panel_array_id: "${arr}", defect_code: "OPEN", severity: "MAJOR", boards_affected: 3, detected_at: "2026-08-01T09:00:00Z", source: "AOI" }, as: QualityInspector, captures: { drec: $.data.id } }
            - { call: "GET /pcb/fab-orders/${ord}/defects", payload: {}, as: QualityInspector }
          assert:
            - "the defect list contains ${drec} with defect_code OPEN, severity MAJOR, boards_affected 3"
            - "DefectRecord has id and created_at but no version field (append-only, common_fields false)"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.FabOrder, state_machines.Stackup, state_machines.DrillProgram, state_machines.LaminateLot]
        distinguishing_aspect: "Fresh rows start in their declared initial states: order QUOTED + disposition PENDING, stackup DRAFT, drill program DRAFT, lot RECEIVED."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Init Co", contact_email: "init@co.example", credit_limit_cents: 5000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
          trigger:
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 10, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id, ord_s: $.data.fab_status, ord_q: $.data.quality_disposition } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { stk: $.data.id, stk_s: $.data.status } }
            - { call: "POST /pcb/fab-orders/${ord}/drill-programs", payload: { revision: 1, min_hole_mils: 8, hole_count: 100 }, as: CAMOperator, as_user_id: "cam_1", captures: { drl: $.data.id, drl_s: $.data.status } }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-I1", manufacture_date: "2025-09-01T00:00:00Z", panels_total: 10 }, as: ProcessEngineer, captures: { lot: $.data.id, lot_s: $.data.status } }
          assert:
            - "fab_status == QUOTED and quality_disposition == PENDING on create"
            - "Stackup status == DRAFT; DrillProgram status == DRAFT; LaminateLot status == RECEIVED"
      - name: ship_from_quoted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.FabOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "ship is only defined from COMPLETED; from QUOTED it returns 409 ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["QUOTED order"]
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Ship Co", contact_email: "ship@co.example", credit_limit_cents: 5000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 10, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /pcb/fab-orders/${ord}/ship", payload: {}, as: ProductionPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409); FabOrder.${ord}.fab_status still QUOTED"
      - name: cancel_from_shipped_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.FabOrder.COMPLETED_to_SHIPPED, "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "SHIPPED is terminal for cancellation: cancel from SHIPPED returns ERR_ORDER_NOT_CANCELLABLE; also proves the full happy path through ship."
        test_recipe:
          setup: ["Order advanced all the way to SHIPPED (invoice issued)"]
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Term Co", contact_email: "term@co.example", credit_limit_cents: 1000000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "STANDARD", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 100, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { ord: $.data.id } }
            - { call: "POST /pcb/fab-orders/${ord}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: true }, as: CAMOperator, captures: { stk: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/spec-lines", payload: { layer_name: "L1", target_ohms: 50.0, tolerance_plus_ohms: 5.0, tolerance_minus_ohms: 5.0, line_type: "SINGLE_ENDED", coupon_required: true }, as: CAMOperator, captures: { line: $.data.id } }
            - { call: "POST /pcb/stackups/${stk}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${ord}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { ord_v: $.data.version } }
            - { call: "POST /pcb/fab-orders/${ord}/panel-arrays", payload: { array_x: 2, array_y: 2, panel_width_mils: 5000, panel_height_mils: 7000, expected_fab_order_version: "${ord_v}" }, as: CAMOperator, captures: { arr: $.data.id } }
            - { call: "POST /pcb/panel-arrays/${arr}/release", payload: {}, as: CAMOperator }
            - { call: "POST /pcb/fab-orders/${ord}/drill-programs", payload: { revision: 1, min_hole_mils: 8, hole_count: 1200 }, as: CAMOperator, as_user_id: "cam_1", captures: { drl: $.data.id } }
            - { call: "POST /pcb/drill-programs/${drl}/submit", payload: {}, as: CAMOperator, as_user_id: "cam_1" }
            - { call: "POST /pcb/drill-programs/${drl}/approve", payload: {}, as: ProcessEngineer, as_user_id: "eng_1" }
            - { call: "POST /pcb/laminate-lots", payload: { material_code: "FR4_TG170", lot_code: "LOT-SH1", manufacture_date: "2025-09-01T00:00:00Z", panels_total: 100 }, as: ProcessEngineer, captures: { lot: $.data.id } }
            - { call: "POST /pcb/laminate-lots/${lot}/qualify", payload: {}, as: QualityInspector, captures: { lot_v: $.data.version } }
            - { call: "POST /pcb/laminate-reservations", payload: { fab_order_id: "${ord}", panel_array_id: "${arr}", laminate_lot_id: "${lot}", panels_allocated: 34, expected_laminate_lot_version: "${lot_v}" }, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/release", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/start-production", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/coupons", payload: { spec_line_id: "${line}", panel_ref: "P01" }, as: QualityInspector, captures: { cpn: $.data.id } }
            - { call: "POST /pcb/lab-slot-bookings", payload: { coupon_id: "${cpn}", station: "MICROSECTION_A", starts_at: "2026-07-31T23:30:00Z", ends_at: "2026-08-01T00:30:00Z" }, as: QualityInspector, captures: { bk: $.data.id } }
            - { call: "POST /pcb/coupons/${cpn}/measurements", payload: { measured_ohms: 52.0, lab_slot_booking_id: "${bk}" }, as: QualityInspector }
            - { call: "POST /pcb/fab-orders/${ord}/complete-fab", payload: {}, as: ProductionPlanner }
            - { call: "POST /pcb/fab-orders/${ord}/etest-runs", payload: { fixture_id: "FX-1", test_voltage: 250 }, as: QualityInspector, captures: { etr: $.data.id } }
            - { call: "POST /pcb/etest-runs/${etr}/start", payload: {}, as: QualityInspector }
            - { call: "POST /pcb/etest-runs/${etr}/complete", payload: { outcome: "PASS", boards_tested: 100, boards_failed: 0, opens_found: 0, shorts_found: 0 }, as: QualityInspector }
            - { call: "POST /pcb/fab-orders/${ord}/invoices/final", payload: { actual_panels_run: 34 }, as: ProductionPlanner, captures: { inv: $.data.id } }
            - { call: "POST /pcb/invoices/${inv}/issue", payload: {}, as: SalesEngineer }
            - { call: "POST /pcb/fab-orders/${ord}/ship", payload: {}, as: ProductionPlanner }
          trigger:
            - { call: "POST /pcb/fab-orders/${ord}/cancel", payload: { reason: "too late" }, as: FabAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORDER_NOT_CANCELLABLE (http 409); FabOrder.${ord}.fab_status remains SHIPPED"
      - name: cancel_from_cancelled_rejected
        claim_type: invalid_transition
        grounds: [state_machines.FabOrder, "errors[ERR_ORDER_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Second cancel on an already-CANCELLED order is rejected with ERR_ORDER_NOT_CANCELLABLE and fires no cascade twice (lot panels_reserved unchanged)."
        test_recipe:
          setup: ["QUOTED order cancelled once"]
          setup_api_calls:
            - { call: "POST /pcb/customers", payload: { company_name: "Twice Co", contact_email: "twice@co.example", credit_limit_cents: 5000, tax_exempt: false }, as: FabAdmin, captures: { cust: $.data.id } }
