scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: network_creation_applies_defaults
        claim_type: creation_with_defaults
        grounds:
          - entities.Network
        distinguishing_aspect: "POST /networks returns 201 with epoch_index 0, enrolled_listing_count 0, and a server-installed brand_lexicon; client-sent epoch_index is ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id, ep: $.data.epoch_index, cnt: $.data.enrolled_listing_count }
          trigger: []
          assert:
            - "ep == 0 (system default wins over input)"
            - "cnt == 0"
            - "Network.${net}.brand_lexicon.CA['salvage certificate'] == 'SALVAGE'"

      - name: vehicle_lazy_creation_on_first_match
        claim_type: computed_fields
        grounds:
          - entities.Vehicle
          - calculations.vin_match
        distinguishing_aspect: "No POST /vehicles endpoint exists; a Vehicle row is created lazily by the first record that fails to match, with canonical_brand NONE and counts zeroed."
        test_recipe:
          setup: ["network; MVA source ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /records"
              payload: { vin: "5YJSA1E26HF122334", source_id: "${src}", record_type: "INSPECTION", event_date: "2026-09-01", odometer_reading: 12000, payload_ref: "i1", idempotency_key: "k-i1" }
              as: SourceOperator
              as_user_id: "${src}"
              captures: { veh: $.data.vehicle_id, mm: $.data.match_method }
            - call: "GET /vehicles/${veh}"
              as: Any
              captures: { brand: $.data.canonical_brand, cnt: $.data.active_record_count }
          assert:
            - "mm == 'EXACT_VIN' (no prior vehicle -> new vehicle with submitted vin)"
            - "brand == 'NONE' and cnt == 1"

      - name: vehicle_not_found
        claim_type: not_found
        grounds:
          - entities.Vehicle
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET on a non-existent vehicle id returns 404 ERR_NOT_FOUND within the network scope."
        test_recipe:
          setup: ["network exists"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
          trigger:
            - call: "GET /vehicles/00000000-0000-0000-0000-000000000000"
              as: Any
          assert:
            - "HTTP 404 with error_id == 'ERR_NOT_FOUND'"

      - name: list_endpoint_pagination_envelope
        claim_type: listing
        grounds:
          - "GET /networks/{networkId}/sources"
          - response_envelope
        distinguishing_aspect: "List response carries limit/offset/total_count/has_more with defaults limit=10 offset=0 and response_type 'array'."
        test_recipe:
          setup: ["network with 1 source"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
          trigger:
            - call: "GET /sources"
              as: Any
          assert:
            - "response data has total_count == 1 and has_more == false with default pagination (limit=10, offset=0)"

      - name: shop_data_source_provisioning_fk
        claim_type: parent_relationships
        grounds:
          - entities.Shop.fields.data_source_id
          - state_machines.Shop.APPLIED_to_ACTIVE
        distinguishing_aspect: "Approving a shop provisions its SERVICE_SHOP DataSource; the shop's data_source_id points at an ACTIVE source with jurisdiction 'SHOP'."
        test_recipe:
          setup: ["network; shop APPLIED"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /shops"
              payload: { legal_name: "S1" }
              as: NetworkAdmin
              captures: { shop: $.data.id }
          trigger:
            - call: "POST /shops/${shop}/approve"
              payload: {}
              as: NetworkAdmin
              captures: { ds: $.data.data_source_id, tier: $.data.reporting_tool_tier }
            - call: "GET /sources/${ds}"
              as: Any
              captures: { ds_type: $.data.source_type, ds_st: $.data.status }
          assert:
            - "tier == 'BASIC' (approval floor)"
            - "ds_type == 'SERVICE_SHOP' and ds_st == 'ACTIVE'"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: record_terminal_lockdown_superseded
        claim_type: terminal_lockdown
        grounds:
          - state_machines.HistoryRecord
        distinguishing_aspect: "A SUPERSEDED record accepts no further transitions: a correction targeting it fails ERR_RECORD_NOT_ACTIVE."
        test_recipe:
          setup: ["network; MVA ACTIVE; vehicle with title R1 superseded by R2 (same-source replacement)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${src}"
              captures: { veh: $.data.vehicle_id, r1: $.data.id }
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "flood", event_date: "2026-09-01", payload_ref: "t1b", idempotency_key: "k-t1b" }
              as: SourceOperator
              as_user_id: "${src}"
            - call: "GET /vehicles/${veh}"
              as: Any
              captures: { vv: $.data.version }
            - call: "POST /consumers"
              payload: { email: "o@x.com" }
              as: VehicleOwner
              captures: { con: $.data.id }
          trigger:
            - call: "POST /vehicles/${veh}/corrections"
              payload: { target_record_id: "${r1}", reason: "late correction", expected_vehicle_version: "${vv}" }
              as: VehicleOwner
              as_user_id: "${con}"
          assert:
            - "HTTP 409 ERR_RECORD_NOT_ACTIVE (R1 is SUPERSEDED, a terminal state)"

      - name: initial_state_defaults
        claim_type: initial_state
        grounds:
          - state_machines.DataSource
          - state_machines.Shop
        distinguishing_aspect: "New DataSource is PENDING and new Shop is APPLIED — initial states are server-set, not client-controllable."
        test_recipe:
          setup: ["network"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src_st: $.data.status }
            - call: "POST /shops"
              payload: { legal_name: "S1" }
              as: NetworkAdmin
              captures: { shop_st: $.data.status }
          trigger: []
          assert:
            - "src_st == 'PENDING' and shop_st == 'APPLIED' (initial states)"

      - name: invalid_transition_activate_on_active_source
        claim_type: invalid_transition
        grounds:
          - state_machines.DataSource
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "activate on an already-ACTIVE source is not idempotent — second call returns 409 ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["network; MVA source ACTIVE"]
          setup_api_calls:
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
          assert:
            - "HTTP 409 ERR_INVALID_STATE_TRANSITION (transitions are not idempotent)"

      - name: delist_with_claim_in_flight_blocked
        claim_type: precondition_enforcement
        grounds:
          - state_machines.InventoryListing.PUBLISHED_to_DELISTED
          - "errors[ERR_CLAIM_IN_FLIGHT]"
        distinguishing_aspect: "Delisting an ENROLLED listing while a claim is OPEN fails ERR_CLAIM_IN_FLIGHT; after claim rejection the same delist succeeds and voids the guarantee."
        test_recipe:
          setup: ["network; MVA ACTIVE; CLEAN vehicle enrolled listing, then SALVAGE escalation, claim OPEN"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { veh: $.data.vehicle_id }
            - call: "POST /dealers"
              payload: { legal_name: "D1" }
              as: NetworkAdmin
              captures: { dl: $.data.id }
            - call: "POST /dealers/${dl}/listings"
              payload: { vehicle_id: "${veh}", asking_price_cents: 700000 }
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { lst: $.data.id }
            - call: "POST /dealers/${dl}/listings/${lst}/publish"
              payload: {}
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { lv: $.data.version }
            - call: "POST /dealers/${dl}/listings/${lst}/enroll_guarantee"
              payload: { expected_listing_version: "${lv}" }
              as: DealerAgent
              as_user_id: "${dl}"
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "TX", raw_brand_text: "salvage title", event_date: "2026-09-01", payload_ref: "t2", idempotency_key: "k-t2" }
              as: SourceOperator
              as_user_id: "${mva}"
            - call: "POST /claims"
              payload: { listing_id: "${lst}", claimant_name: "B", claim_reason: "salvage" }
              as: GuaranteeAdmin
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /dealers/${dl}/listings/${lst}/delist"
              payload: {}
              as: DealerAgent
              as_user_id: "${dl}"
            - call: "POST /claims/${cl}/reject"
              payload: {}
              as: GuaranteeAdmin
            - call: "POST /dealers/${dl}/listings/${lst}/delist"
              payload: {}
              as: DealerAgent
              as_user_id: "${dl}"
              captures: { fin: $.data.status, g: $.data.guarantee_status }
          assert:
            - "First delist -> HTTP 409 ERR_CLAIM_IN_FLIGHT"
            - "After claim rejection: fin == 'DELISTED' and g == 'VOIDED'"

      - name: correction_expiry_after_deadline
        claim_type: valid_transition
        grounds:
          - state_machines.CorrectionRequest.AWAITING_SOURCE_to_EXPIRED
        distinguishing_aspect: "A routed correction with no source response expires exactly when the sweep runs at epoch > source_deadline_epoch (route at 0 -> deadline 2; alive at epoch 2, expired at epoch 3)."
        test_recipe:
          setup: ["network; MVA ACTIVE; vehicle title; owner correction routed at epoch 0"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { veh: $.data.vehicle_id, rec: $.data.id, vv: $.data.version }
            - call: "POST /consumers"
              payload: { email: "o@x.com" }
              as: VehicleOwner
              captures: { con: $.data.id }
            - call: "POST /vehicles/${veh}/corrections"
              payload: { target_record_id: "${rec}", reason: "wrong", expected_vehicle_version: "${vv}" }
              as: VehicleOwner
              as_user_id: "${con}"
              captures: { cr: $.data.id }
            - call: "POST /corrections/${cr}/route_to_source"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "GET /corrections/${cr}"
              as: Any
              captures: { st2: $.data.status }
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "GET /corrections/${cr}"
              as: Any
              captures: { st3: $.data.status }
          assert:
            - "st2 == 'AWAITING_SOURCE' at epoch 2 (deadline 2 is not yet exceeded)"
            - "st3 == 'EXPIRED' at epoch 3 (epoch > deadline)"

  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: fuzzy_vin_single_position_match
        claim_type: correct_result
        grounds:
          - calculations.vin_match
        distinguishing_aspect: "A submitted VIN differing in exactly one character from an existing vehicle's VIN attaches via FUZZY_VIN instead of creating a new vehicle."
        test_recipe:
          setup: ["network; MVA ACTIVE; vehicle V with vin 1HGCM82633A004352"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "INSPECTION", event_date: "2026-09-01", odometer_reading: 10000, payload_ref: "i1", idempotency_key: "k-i1" }
              as: SourceOperator
              as_user_id: "${src}"
              captures: { veh: $.data.vehicle_id }
          trigger:
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004353", source_id: "${src}", record_type: "INSPECTION", event_date: "2026-09-01", odometer_reading: 10050, payload_ref: "i2", idempotency_key: "k-i2" }
              as: SourceOperator
              as_user_id: "${src}"
              captures: { veh2: $.data.vehicle_id, mm: $.data.match_method }
          assert:
            - "veh2 == veh (attached to existing vehicle, no new row)"
            - "mm == 'FUZZY_VIN'"

      - name: ambiguous_vin_rejected
        claim_type: violation_to_error
        grounds:
          - calculations.vin_match
          - "errors[ERR_AMBIGUOUS_VIN_MATCH]"
        distinguishing_aspect: "Two existing vehicles each at Hamming distance 1 from the submitted VIN produce ERR_AMBIGUOUS_VIN_MATCH rather than an arbitrary pick (vehicles ...352 and ...353, submission ...35X pattern with two distance-1 candidates)."
        test_recipe:
          setup: ["network; MVA ACTIVE; vehicles 1HGCM82633A004352 and 1HGCM82633A004353 both exist; submitted 1HGCM82633A00435A differs in one position from... neither — pinned construction: vehicles differ from the submission in exactly one position each (positions 16: '2' vs '3' vs 'A' all at last char)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "INSPECTION", event_date: "2026-09-01", odometer_reading: 10000, payload_ref: "i1", idempotency_key: "k-i1" }
              as: SourceOperator
              as_user_id: "${src}"
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004332", source_id: "${src}", record_type: "INSPECTION", event_date: "2026-09-01", odometer_reading: 9000, payload_ref: "i2", idempotency_key: "k-i2" }
              as: SourceOperator
              as_user_id: "${src}"
          trigger:
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004342", source_id: "${src}", record_type: "ACCIDENT", event_date: "2026-09-01", damage_severity: 2, payload_ref: "a1", idempotency_key: "k-a1" }
              as: SourceOperator
              as_user_id: "${src}"
          assert:
            - "HTTP 409 ERR_AMBIGUOUS_VIN_MATCH (...4342 is distance 1 from both ...4352 and ...4332 — exactly one char differs in each pair at position 15)"

      - name: brand_rollup_max_severity_wins
        claim_type: correct_result
        grounds:
          - calculations.vehicle_brand_rollup
        distinguishing_aspect: "Across ACTIVE title records the max severity wins regardless of arrival order: a REBUILT (4) ingested after a SALVAGE (5) leaves the rollup at SALVAGE; withdrawing the SALVAGE record drops the rollup to REBUILT."
        test_recipe:
          setup: ["network; MVA ACTIVE; vehicle with TX salvage title"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "TITLE_BRAND", jurisdiction: "TX", raw_brand_text: "salvage title", event_date: "2026-08-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${src}"
              captures: { veh: $.data.vehicle_id, rec: $.data.id }
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "revived salvage", event_date: "2026-08-15", payload_ref: "t2", idempotency_key: "k-t2" }
              as: SourceOperator
              as_user_id: "${src}"
          trigger:
            - call: "GET /vehicles/${veh}"
              as: Any
              captures: { brand: $.data.canonical_brand, sev: $.data.brand_severity }
          assert:
            - "brand == 'SALVAGE' and sev == 5 (max severity wins over the later-ingested REBUILT 4)"

      - name: odometer_rollback_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_ODOMETER_ROLLBACK]"
        distinguishing_aspect: "A SERVICE record with odometer below the max of earlier-dated ACTIVE records is rejected; equal odometer on the same date is allowed."
        test_recipe:
          setup: ["network; shop ACTIVE with provisioned source; vehicle with service record at 10000mi on 2026-08-01"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /shops"
              payload: { legal_name: "S1" }
              as: NetworkAdmin
              captures: { shop: $.data.id }
            - call: "POST /shops/${shop}/approve"
              payload: {}
              as: NetworkAdmin
            - call: "POST /shops/${shop}/service-records"
              payload: { vin: "1HGCM82633A004352", event_date: "2026-08-01", odometer_reading: 10000, payload_ref: "s1", idempotency_key: "k-s1" }
              as: ShopOperator
              as_user_id: "${shop}"
              captures: { veh: $.data.vehicle_id }
          trigger:
            - call: "POST /shops/${shop}/service-records"
              payload: { vin: "1HGCM82633A004352", event_date: "2026-08-15", odometer_reading: 9000, payload_ref: "s2", idempotency_key: "k-s2" }
              as: ShopOperator
              as_user_id: "${shop}"
            - call: "POST /shops/${shop}/service-records"
              payload: { vin: "1HGCM82633A004352", event_date: "2026-08-15", odometer_reading: 10000, payload_ref: "s3", idempotency_key: "k-s3" }
              as: ShopOperator
              as_user_id: "${shop}"
              captures: { ok: $.data.id }
          assert:
            - "9000mi at later date -> HTTP 422 ERR_ODOMETER_ROLLBACK"
            - "10000mi (equal, same-day tie) -> accepted: ok is minted"

      - name: confidence_threshold_purge_timing
        claim_type: boundary_edge
        grounds:
          - calculations.accident_confidence
          - state_machines.HistoryRecord.ACTIVE_to_VOIDED
        distinguishing_aspect: "An UNRELIABLE accident (score 32, reliability decayed to 80 pre-ingest) submitted at epoch 2 survives the epoch-3 purge sweep (age 1 < 2) and is VOIDED at epoch 4 (age >= 2)."
        test_recipe:
          setup: ["network; MVA ACTIVE; seed record in epoch 0 then two miss epochs decay reliability 100 -> 80"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "9YJSA1E26HF122339", source_id: "${src}", record_type: "INSPECTION", event_date: "2026-09-01", odometer_reading: 10, payload_ref: "seed", idempotency_key: "k-seed" }
              as: SourceOperator
              as_user_id: "${src}"
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "ACCIDENT", event_date: "2026-09-01", damage_severity: 6, payload_ref: "a1", idempotency_key: "k-a1" }
              as: SourceOperator
              as_user_id: "${src}"
              captures: { rec: $.data.id, sc: $.data.confidence_score, lvl: $.data.confidence_level }
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "GET /records/${rec}"
              as: Any
              captures: { st1: $.data.status }
            - call: "POST /advance_epoch"
              payload: {}
              as: NetworkAdmin
            - call: "GET /records/${rec}"
              as: Any
              captures: { st2: $.data.status }
          assert:
            - "sc == 32 and lvl == 'UNRELIABLE' at ingest (reliability 80 after two misses: 100-10-10)"
            - "st1 == 'ACTIVE' after one epoch (age 1 < 2, purge not due)"
            - "st2 == 'VOIDED' after the second epoch (age 2 >= 2)"

  # =====================================================================
  # Section: validations
  # =====================================================================
  - section: validations
    instances:
      - name: missing_user_context_header
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Requests without X-User-Role fail 400 before any role check."
        test_recipe:
          setup: ["none"]
          setup_api_calls: []
          trigger:
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              note: "headers intentionally omitted at test time (unit-test generator sends the request without X-User-Role)"
          assert:
            - "HTTP 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER when headers absent"

      - name: unknown_brand_term_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_UNKNOWN_BRAND_TERM]"
        distinguishing_aspect: "A raw_brand_text absent from the jurisdiction lexicon fails 422 even from an ACTIVE source with a valid VIN."
        test_recipe:
          setup: ["network; MVA ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "totaled", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${src}"
          assert:
            - "HTTP 422 ERR_UNKNOWN_BRAND_TERM ('totaled' is not in the CA lexicon)"

      - name: future_event_date_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_EVENT_IN_FUTURE]"
        distinguishing_aspect: "event_date after the logical clock date fails 422; event_date equal to the clock date passes."
        test_recipe:
          setup: ["network at 2026-09-01; MVA ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
          trigger:
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "ACCIDENT", event_date: "2026-09-02", damage_severity: 2, payload_ref: "a1", idempotency_key: "k-a1" }
              as: SourceOperator
              as_user_id: "${src}"
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "ACCIDENT", event_date: "2026-09-01", damage_severity: 2, payload_ref: "a2", idempotency_key: "k-a2" }
              as: SourceOperator
              as_user_id: "${src}"
              captures: { ok: $.data.id }
          assert:
            - "2026-09-02 -> HTTP 422 ERR_EVENT_IN_FUTURE"
            - "2026-09-01 (equal to clock date) -> accepted: ok minted"

      - name: insufficient_credit_blocks_consumer_report
        claim_type: violation_to_error
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_INSUFFICIENT_CREDIT]"
        distinguishing_aspect: "A consumer with 3998c cannot buy the 3999c first report; topping up 1c makes the exact-balance purchase succeed."
        test_recipe:
          setup: ["network; MVA ACTIVE; vehicle exists; consumer with 3998c"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { mva: $.data.id }
            - call: "POST /sources/${mva}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${mva}", record_type: "TITLE_BRAND", jurisdiction: "CA", raw_brand_text: "clean", event_date: "2026-09-01", payload_ref: "t1", idempotency_key: "k-t1" }
              as: SourceOperator
              as_user_id: "${mva}"
              captures: { veh: $.data.vehicle_id }
            - call: "POST /consumers"
              payload: { email: "o@x.com" }
              as: VehicleOwner
              captures: { con: $.data.id }
            - call: "POST /consumers/${con}/credit"
              payload: { amount_cents: 3998 }
              as: NetworkAdmin
          trigger:
            - call: "POST /reports"
              payload: { vehicle_id: "${veh}", product: "CONSUMER_SINGLE", buyer_consumer_id: "${con}" }
              as: VehicleOwner
              as_user_id: "${con}"
            - call: "POST /consumers/${con}/credit"
              payload: { amount_cents: 1 }
              as: NetworkAdmin
            - call: "POST /reports"
              payload: { vehicle_id: "${veh}", product: "CONSUMER_SINGLE", buyer_consumer_id: "${con}" }
              as: VehicleOwner
              as_user_id: "${con}"
              captures: { price: $.data.price_cents }
          assert:
            - "3998c balance -> HTTP 402 ERR_INSUFFICIENT_CREDIT"
            - "3999c balance (exact) -> success with price == 3999"

      - name: idempotent_replay_vs_conflict
        claim_type: violation_to_error
        grounds:
          - "validations[priority=9]"
          - "errors[ERR_IDEMPOTENCY_CONFLICT]"
          - calculations.dedupe_grouping
        distinguishing_aspect: "Same idempotency_key + identical payload returns the original record unchanged (no new row); same key + different payload is ERR_IDEMPOTENCY_CONFLICT."
        test_recipe:
          setup: ["network; MVA ACTIVE; one accident record R with key k-1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /networks"
              payload: { name: "N1", guarantee_payout_cap_cents: 5000000 }
              as: NetworkAdmin
              captures: { net: $.data.id }
            - call: "POST /sources"
              payload: { source_type: "MVA", jurisdiction: "CA" }
              as: NetworkAdmin
              captures: { src: $.data.id }
            - call: "POST /sources/${src}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "ACCIDENT", event_date: "2026-09-01", damage_severity: 2, payload_ref: "a1", idempotency_key: "k-1" }
              as: SourceOperator
              as_user_id: "${src}"
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "ACCIDENT", event_date: "2026-09-01", damage_severity: 2, payload_ref: "a1", idempotency_key: "k-1" }
              as: SourceOperator
              as_user_id: "${src}"
              captures: { r2: $.data.id }
            - call: "POST /records"
              payload: { vin: "1HGCM82633A004352", source_id: "${src}", record_type: "ACCIDENT", event_date: "2026-09-01", damage_severity: 9, payload_ref: "a1", idempotency_key: "k-1" }
              as: SourceOperator
              as_user_id: "${src}"
          assert:
            - "Identical replay: r2 == r1 (original record returned, no duplicate row)"
            - "Changed payload with same key -> HTTP 409 ERR_IDEMPOTENCY_CONFLICT"

      - name: duplicate_record_same_source_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_DUPLICATE_RECORD]"
        distinguishing_aspect: "Same-source, same dedupe group, identical content but a fresh idempotency key is rejected as a duplicate; a changed content field supersedes instead."
        test_recipe:
          setup: ["network; MVA ACTIVE; CA clean title R1 on vehicle"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
