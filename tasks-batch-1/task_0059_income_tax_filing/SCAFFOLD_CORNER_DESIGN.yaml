            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: IrsGateway
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"
            - "HTTP status == 403"

      - name: taxpayer_cannot_act_on_other_taxpayers_return
        claim_type: rbac_denial
        grounds: ["roles", "validations[priority=3]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "A Taxpayer whose X-User-ID is not the return's taxpayer_id is denied compute on that return with ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["Owner Taxpayer O with a DRAFT return (one W-2); second Taxpayer X."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "rb3o@x.com", full_name: "O", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { o_id: $.data.id }
            - call: "POST /taxpayers"
              payload: { email: "rb3x@x.com", full_name: "X", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { x_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${o_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${o_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000 }
              as: Taxpayer
              as_user_id: "${o_id}"
          trigger:
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${x_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_RESOURCE_OWNER"
            - "HTTP status == 403"

      - name: missing_auth_headers_unauthenticated
        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unknown X-User-Role returns ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["Taxpayer + DRAFT TaxReturn exist."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "rb4@x.com", full_name: "RB4", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Ghost
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

  # -----------------------------------------------------------------
  # Cross-Cutting Complexity Layers
  # -----------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.TaxReturn.fields.version, endpoints]
        distinguishing_aspect: "TaxReturn.version starts at 1 on create and increments by 1 on each mutation: after adding one income document and one compute the version is 3."
        test_recipe:
          setup: ["Taxpayer + DRAFT TaxReturn."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "cc1@x.com", full_name: "CC1", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_now: $.data.version }
          assert:
            - "TaxReturn.${ret_id}.version == 3"

      - name: amend_create_correct_version_succeeds
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[amend-create-stale-return]", "endpoints"]
        distinguishing_aspect: "Creating a 1040X with expected_return_version matching the current version succeeds (201) — the positive counterpart to the stale-version 412."
        test_recipe:
          setup: ["A FILED TaxReturn; client reads its current version just before amending."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "cc2@x.com", full_name: "CC2", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_c: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_c}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ef_id: $.data.id }
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "ACCEPTED", ack_code: "A0000" }
              as: IrsGateway
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_filed: $.data.version }
          trigger:
            - call: "POST /amended-returns"
              payload: { original_return_id: "${ret_id}", taxpayer_id: "${tp_id}", corrected_balance_due_cents: 40000, correction_period_start: "2025-01-01T00:00:00Z", correction_period_end: "2025-06-30T00:00:00Z", expected_return_version: "${v_filed}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { amd_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "AmendedReturn.${amd_id}.status == DRAFT"

      - name: amend_create_stale_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[amend-create-stale-return]", "errors[ERR_STALE_RETURN_VERSION]"]
        distinguishing_aspect: "Creating a 1040X carrying expected_return_version one less than the current FILED version (stale) returns ERR_STALE_RETURN_VERSION (412)."
        test_recipe:
          setup: ["A FILED TaxReturn whose version the client under-reports by one."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "cc3@x.com", full_name: "CC3", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_c: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_c}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ef_id: $.data.id }
            - call: "POST /efilings/${ef_id}/acknowledge"
              payload: { outcome: "ACCEPTED", ack_code: "A0000" }
              as: IrsGateway
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_filed: $.data.version }
          trigger:
            - call: "POST /amended-returns"
              payload: { original_return_id: "${ret_id}", taxpayer_id: "${tp_id}", corrected_balance_due_cents: 40000, correction_period_start: "2025-01-01T00:00:00Z", correction_period_end: "2025-06-30T00:00:00Z", expected_return_version: "${v_filed} - 1" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_RETURN_VERSION"
            - "HTTP status == 412"

      - name: itemized_flag_changes_deduction_path
        claim_type: dual_variant_calculation
        grounds: [calculations.compute_return_tax, entities.TaxReturn.fields.deduction_method]
        excluded_because:
          difficulty_instance: dual_variant_calc / deduction_standard_vs_itemized_diverges_on_taxreturn
          rationale: "The STANDARD vs ITEMIZED divergence is the named §1.8 dual-variant instance."

      - name: amendment_delta_derived_field_reconciliation
        claim_type: derived_field_reconciliation
        grounds: [entities.AmendedReturn.fields.delta_cents, state_machines.AmendedReturn.DRAFT_to_FILED]
        excluded_because:
          difficulty_instance: compensating_invariant / amendment_delta_conserves_balance_due_ledger
          rationale: "delta_cents reconciliation against the original balance is asserted by the named §1.8 invariant instance."

  # -----------------------------------------------------------------
  # Consistency Model
  # -----------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: compute_changes_visible_same_response
        claim_type: immediate
        grounds: [endpoints, calculations.compute_return_tax]
        distinguishing_aspect: "compute returns the fully recomputed return in the same response: balance_due_cents is present and correct (35,300) in the POST /compute response, not on a later read."
        test_recipe:
          setup: ["Taxpayer + DRAFT TaxReturn with one W-2 wages 8,000,000 withholding 900,000."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "cm1@x.com", full_name: "CM1", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "STANDARD" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { bal: $.data.balance_due_cents }
          assert:
            - "POST /compute response data.balance_due_cents == 35300"
            - "TaxReturn.${ret_id}.status == READY"
