  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_refund_conserves_net_cash_to_zero
        grounds:
          - state_machines.FramingOrder.INTAKE_to_CANCELLED
          - calculations.order_ledger
          - entities.FramingOrder.fields.amount_paid
          - entities.Payment.fields.kind
        distinguishing_aspect: |
          Conserved quantity = net order cash (sum of APPLIED DEPOSIT/BALANCE amounts minus
          APPLIED REFUND amounts). A deposit of 25.00 followed by CANCEL's compensating REFUND
          of 25.00 leaves amount_paid exactly 0.00 — no cash drift.
        test_recipe:
          setup:
            - "QUOTED order, deposit 25.00 paid (amount_paid 25.00, one APPLIED DEPOSIT)"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Qi Cash", email: "qi@x.com", phone: "555-0116" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}", deposit_pct: 0.30 }
              as: FrameDesigner
              captures: { order_id: $.data.id, v0: $.data.version }
            - call: "POST /framing-orders/${order_id}/frame-lines"
              payload: { expected_order_version: "${v0}", artwork_label: "R", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30 }
              as: FrameDesigner
              captures: { line_id: $.data.id }
            - call: "POST /frame-lines/${line_id}/measure"
              payload: { measured_width_in: 8, measured_height_in: 10 }
              as: FrameDesigner
            - call: "POST /framing-orders/${order_id}/quote"
              payload: {}
              as: FrameDesigner
              captures: { dep: $.data.deposit_required }
            - call: "POST /framing-orders/${order_id}/payments"
              payload: { kind: "DEPOSIT", amount: 25.00 }
              as: FrontDeskClerk
          trigger:
            - call: "POST /framing-orders/${order_id}/cancel"
              payload: {}
              as: FrontDeskClerk
              captures: { paid: $.data.amount_paid }
          assert:
            - "FramingOrder.${order_id}.amount_paid == 0.00"
            - "FramingOrder.${order_id}.payment_status == REFUNDED"

      - name: task_release_conserves_workbench_free_interval
        grounds:
          - state_machines.ProductionTask.SCHEDULED_to_RELEASED
          - state_machines.FramingOrder.IN_PRODUCTION_to_CANCELLED
          - entities.ProductionTask.fields.task_status
          - validations[priority=9]
        distinguishing_aspect: |
          Conserved quantity = workbench interval occupancy (a different conserved quantity than
          cash): cancelling the order RELEASES its task so the [0,60) interval becomes free, and a
          brand-new task on [0,60) on the same bench is then accepted (no occupancy drift).
        test_recipe:
          setup:
            - "ASSEMBLY bench; order IN_PRODUCTION with one SCHEDULED task on [0,60); then order cancelled -> task RELEASED"
            - "A second order (deposit paid, IN_PRODUCTION) then schedules a task on [0,60) on the same freed bench"
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Ru Free", email: "ru@x.com", phone: "555-0117" }
              as: FrameDesigner
              captures: { cust_id: $.data.id }
            - call: "POST /workbenches"
              payload: { bench_name: "Asm F", bench_type: "ASSEMBLY" }
              as: FrameProductionTech
              captures: { bench_id: $.data.id }
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}", deposit_pct: 0.30 }
              as: FrameDesigner
              captures: { o1: $.data.id, v1: $.data.version }
            - call: "POST /framing-orders/${o1}/frame-lines"
              payload: { expected_order_version: "${v1}", artwork_label: "F1", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30, glass_type: "REGULAR" }
              as: FrameDesigner
              captures: { l1: $.data.id }
            - call: "POST /frame-lines/${l1}/measure"
              payload: { measured_width_in: 8, measured_height_in: 10 }
              as: FrameDesigner
            - call: "POST /framing-orders/${o1}/quote"
              payload: {}
              as: FrameDesigner
              captures: { d1: $.data.deposit_required }
            - call: "POST /framing-orders/${o1}/payments"
              payload: { kind: "DEPOSIT", amount: 25.00 }
              as: FrontDeskClerk
            - call: "POST /framing-orders/${o1}/start-production"
              payload: {}
              as: FrameProductionTech
            - call: "POST /production-tasks"
              payload: { order_id: "${o1}", workbench_id: "${bench_id}", start_minute: 0, end_minute: 60 }
              as: FrameProductionTech
              captures: { t1: $.data.id }
            - call: "POST /framing-orders/${o1}/cancel"
              payload: {}
              as: FrontDeskClerk
            - call: "POST /framing-orders"
              payload: { customer_id: "${cust_id}", deposit_pct: 0.30 }
              as: FrameDesigner
              captures: { o2: $.data.id, v2: $.data.version }
            - call: "POST /framing-orders/${o2}/frame-lines"
              payload: { expected_order_version: "${v2}", artwork_label: "F2", nominal_width_in: 8, nominal_height_in: 10, molding_rate_per_ui: 0.30, glass_type: "REGULAR" }
              as: FrameDesigner
              captures: { l2: $.data.id }
            - call: "POST /frame-lines/${l2}/measure"
              payload: { measured_width_in: 8, measured_height_in: 10 }
              as: FrameDesigner
            - call: "POST /framing-orders/${o2}/quote"
              payload: {}
              as: FrameDesigner
              captures: { d2: $.data.deposit_required }
            - call: "POST /framing-orders/${o2}/payments"
              payload: { kind: "DEPOSIT", amount: 25.00 }
              as: FrontDeskClerk
            - call: "POST /framing-orders/${o2}/start-production"
              payload: {}
              as: FrameProductionTech
          trigger:
            - call: "POST /production-tasks"
              payload: { order_id: "${o2}", workbench_id: "${bench_id}", start_minute: 0, end_minute: 60 }
              as: FrameProductionTech
              captures: { t2: $.data.id, st: $.data.task_status }
          assert:
            - "ProductionTask.${t1}.task_status == RELEASED"
            - "ProductionTask.${t2}.task_status == SCHEDULED"
            - "ProductionTask.${t2}.start_minute == 0"
