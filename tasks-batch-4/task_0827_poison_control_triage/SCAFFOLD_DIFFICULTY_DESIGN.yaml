  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: severity_band_at_exact_0_75_is_severe
        grounds:
          - calculations.exposure_toxicity_score
          - entities.Exposure.fields.severity_band
        distinguishing_aspect: |
          An exposure whose toxicity_score is exactly 0.75 (dose_high 2250, weight 20, tdk 150)
          lands in SEVERE via the inclusive >= boundary, not MODERATE; a numeric-threshold
          boundary reached through POST /exposures.
        test_recipe:
          setup:
            - "Substance acetaminophen (tdk 150, onset 4); case weight 20kg."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
          trigger:
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 2250, dose_range_high_mg: 2250, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
              captures: { exp: $.data.id }
          assert:
            - "Exposure.${exp}.toxicity_score == 0.75"
            - "Exposure.${exp}.severity_band == SEVERE (0.75 included via >=)"

      - name: triage_empty_exposure_set_rejected
        grounds:
          - validations[priority=6]
          - errors[ERR_NO_EXPOSURES]
          - state_machines.ExposureCase.INTAKE_to_TRIAGED
        distinguishing_aspect: |
          Triaging a case with zero Exposure rows (empty collection) returns ERR_NO_EXPOSURES; an
          empty-set count boundary reached through POST /triage, a different metric and endpoint
          than the numeric 0.75 threshold.
        test_recipe:
          setup:
            - "A freshly created case in INTAKE with no exposures recorded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "unknown ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
          trigger:
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_NO_EXPOSURES (422)"
            - "ExposureCase.${case}.status == INTAKE (unchanged)"

  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: disposition_requires_finalized_assessment
        grounds:
          - validations[priority=5]
          - state_machines.ExposureCase.TRIAGED_to_MONITORING
          - entities.RiskAssessment.fields.status
        distinguishing_aspect: |
          A Disposition (entity A) cannot be created unless its referenced RiskAssessment
          (entity B).status == FINALIZED; a COMPLETED assessment is rejected with
          ERR_INVALID_STATE and the same request succeeds after finalize (case -> MONITORING).
        test_recipe:
          setup:
            - "MODERATE case triaged with a COMPLETED (un-finalized) RiskAssessment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /substances"
              payload: { name: "acetaminophen", category: "ANALGESIC", toxic_dose_mg_per_kg: 150, onset_hours: 4, reference_route: "INGESTION" }
              as: SystemAdmin
              captures: { sub_apap: $.data.id }
            - call: "POST /protocols"
              payload: { risk_tier: "MODERATE", management_setting: "HOME", followup_count: 1, followup_interval_hours: 24, requires_toxicologist: false }
              as: SystemAdmin
            - call: "POST /specialists"
              payload: { full_name: "Sam SPI", credential: "SPI" }
              as: SystemAdmin
              captures: { spi: $.data.id }
            - call: "POST /exposure-cases"
              payload: { patient_age_years: 6, patient_weight_kg: 20, patient_sex: "MALE", chief_complaint: "ingestion" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { case: $.data.id }
            - call: "POST /exposure-cases/${case}/exposures"
              payload: { substance_id: "${sub_apap}", route: "INGESTION", dose_range_low_mg: 1200, dose_range_high_mg: 1500, time_since_exposure_hours: 2 }
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/triage"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
              captures: { case_v: $.data.version }
            - call: "POST /exposure-cases/${case}/risk-assessments"
              payload: { expected_case_version: "${case_v}" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { ra: $.data.id }
          trigger:
            - call: "POST /exposure-cases/${case}/dispositions"
              payload: { risk_assessment_id: "${ra}", disposition_type: "HOME_MANAGEMENT" }
              as: Specialist
              as_user_id: "${spi}"
              captures: { err: $.data.error_id }
            - call: "POST /risk-assessments/${ra}/finalize"
              payload: {}
              as: Specialist
              as_user_id: "${spi}"
            - call: "POST /exposure-cases/${case}/dispositions"
              payload: { risk_assessment_id: "${ra}", disposition_type: "HOME_MANAGEMENT" }
              as: Specialist
              as_user_id: "${spi}"
          assert:
            - "trigger[0] error_id == ERR_INVALID_STATE (RiskAssessment COMPLETED, not FINALIZED)"
            - "after finalize, trigger[2] succeeds and ExposureCase.${case}.status == MONITORING"

      - name: consult_requires_accepting_facility
        grounds:
          - validations[priority=10]
          - entities.HealthcareFacility.fields.status
          - errors[ERR_FACILITY_NOT_ACCEPTING]
        distinguishing_aspect: |
          A FacilityConsult (entity A) cannot open unless the referenced HealthcareFacility
          (entity B).status == ACCEPTING; a DIVERTING facility is rejected with
          ERR_FACILITY_NOT_ACCEPTING and its active_consult_count stays 0 -- a different entity
          pair than Disposition->RiskAssessment.
        test_recipe:
          setup:
            - "DIVERTING facility; a triaged MODERATE case with a COMPLETED RiskAssessment (defines risk_tier)."
          setup_api_calls:
