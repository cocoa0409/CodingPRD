      - name: corner_invoice_errors_cover_duplicate_currency_state_and_republication
        claim_type: conflict_error
        grounds:
          - errors[ERR_DUPLICATE_INVOICE_NUMBER]
          - errors[ERR_INVOICE_INVALID_STATE]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_ARTICLE_ALREADY_PUBLISHED]
        distinguishing_aspect: |
          Against one PAID invoice on a published article, four distinct failures are separated:
          re-using the same invoice_number for the same publisher is
          ERR_DUPLICATE_INVOICE_NUMBER 409, re-validating the PAID invoice is
          ERR_INVOICE_INVALID_STATE 409, a currency of EUR is ERR_INVALID_REQUEST 400 (the
          shape rule at priority 5 fires before the uniqueness rule at priority 29 even though
          the invoice_number is also fresh), and a second publication call is
          ERR_ARTICLE_ALREADY_PUBLISHED 409.
        test_recipe:
          setup:
            - "logical clock at 2026-08-12T00:00:00Z"
            - "publisher HALDEN with no agreement; FULLY_OA journal at 300000; author with no grant"
            - "articles A1 and A2, both determined AUTHOR_PAYS / SELF_FUNDED"
            - "invoice HALDEN-5001 for A1 at 300000 (zero discount, zero VAT) driven to PAID; A1 published on 2026-08-12"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00Z" }
              as: AgreementAdmin
            - call: "POST /publishers"
              payload: { name: "Halden Open Science", publisher_code: "HALDEN", country_code: "NO" }
              as: AgreementAdmin
              captures: { x5_p_id: $.data.id }
            - call: "POST /journals"
              payload: { publisher_id: "${x5_p_id}", issn: "2515-0847", title: "Halden Journal of Open Metabolism", oa_model: "FULLY_OA", list_apc_cents: 300000, required_embargo_months: 12 }
              as: AgreementAdmin
              captures: { x5_j_id: $.data.id }
            - call: "POST /authors"
              payload: { full_name: "Tomas Berg", email: "tomas.berg@uni.example", orcid: "0000-0001-5109-3700", department_code: "MET", affiliation_status: "ELIGIBLE_FACULTY", appointment_from: "2024-01-01", appointment_until: "2028-12-31", annual_cap_cents: 500000 }
              as: AgreementAdmin
              captures: { x5_au_id: $.data.id }
            - call: "POST /articles"
              payload: { journal_id: "${x5_j_id}", corresponding_author_id: "${x5_au_id}", manuscript_title: "Invoice error surface, first article", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
              captures: { x5_a1_id: $.data.id }
            - call: "POST /articles/${x5_a1_id}/eligibility-checks"
              payload: { basis: "PROVISIONAL" }
              as: ScholCommLibrarian
              captures: { x5_route: $.data.route }
            - call: "POST /articles"
              payload: { journal_id: "${x5_j_id}", corresponding_author_id: "${x5_au_id}", manuscript_title: "Invoice error surface, second article", accepted_on: "2026-08-05" }
              as: ScholCommLibrarian
              captures: { x5_a2_id: $.data.id }
            - call: "POST /articles/${x5_a2_id}/eligibility-checks"
              payload: { basis: "PROVISIONAL" }
              as: ScholCommLibrarian
            - call: "POST /publisher-invoices"
              payload: { publisher_id: "${x5_p_id}", article_id: "${x5_a1_id}", invoice_number: "HALDEN-5001", invoice_amount_cents: 300000, currency: "USD", claimed_discount_pct: 0.0, vat_pct: 0.0, invoice_date: "2026-08-12" }
              as: ScholCommLibrarian
              captures: { x5_inv_id: $.data.id, x5_outcome: $.data.validation_outcome }
            - call: "POST /publisher-invoices/${x5_inv_id}/validation"
              payload: {}
              as: ScholCommLibrarian
            - call: "POST /publisher-invoices/${x5_inv_id}/payment-approval"
              payload: {}
              as: FundManager
              as_user_id: "fm-approver-01"
            - call: "POST /publisher-invoices/${x5_inv_id}/payment"
              payload: { payment_reference: "WIRE-77001" }
              as: FundManager
              as_user_id: "fm-payer-02"
              captures: { x5_paid_status: $.data.status }
            - call: "POST /articles/${x5_a1_id}/publication"
              payload: { publication_date: "2026-08-12" }
              as: ScholCommLibrarian
              captures: { x5_doi: $.data.doi }
          trigger:
            - call: "POST /publisher-invoices"
              payload: { publisher_id: "${x5_p_id}", article_id: "${x5_a2_id}", invoice_number: "HALDEN-5001", invoice_amount_cents: 300000, currency: "USD", claimed_discount_pct: 0.0, vat_pct: 0.0, invoice_date: "2026-08-12" }
              as: ScholCommLibrarian
              captures: { x5_err_dup: $.data.error_id }
            - call: "POST /publisher-invoices/${x5_inv_id}/validation"
              payload: {}
              as: ScholCommLibrarian
              captures: { x5_err_state: $.data.error_id }
            - call: "POST /publisher-invoices"
