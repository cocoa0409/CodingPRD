            - "One ACTIVE HedgeProgram with one EXECUTED, DESIGNATED 1000000-gallon SWAP struck at 2.5000 maturing 2027-02; counterparty credit limit 2000000.00, margin_requirement_usd 60000.00, no collateral posted."
