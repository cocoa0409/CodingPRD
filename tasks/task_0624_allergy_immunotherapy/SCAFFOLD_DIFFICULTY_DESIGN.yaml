              as: Pharmacist
              captures: { vial_id: $.data.id, plan_v1: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/activate"
              payload: {}
              as: Allergist
              captures: { plan_v2: $.data.version }
            - call: "POST /immunotherapy-plans/${plan_id}/shot-visits"
              payload: { vial_id: "${vial_id}", expected_plan_version: "${plan_v2}" }
              as: Nurse
              captures: { v1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T01:00:00Z" }
              as: Nurse
            - call: "POST /shot-visits/${v1_id}/release"
              payload: { released_at_iso: "2026-01-01T01:00:00Z", reaction_grade: "NONE" }
