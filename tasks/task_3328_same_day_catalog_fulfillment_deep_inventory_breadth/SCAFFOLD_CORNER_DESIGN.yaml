          - errors.ERR_CLAIM_NOT_FOUND
          - errors.ERR_DC_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "Existence failures are reported with the code of the entity named in the path: an unknown return id, an unknown claim id and an unknown DC id each produce their own 404 rather than a shared generic one."
        test_recipe:
          setup:
