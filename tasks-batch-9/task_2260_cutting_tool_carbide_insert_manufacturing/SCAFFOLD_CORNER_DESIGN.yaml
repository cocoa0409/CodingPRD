              captures: { err_expedite: $.data.error_id }
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${customer_id}", product_id: "${spc_id}", order_code: "SO-STD", quantity: 10, expedite_requested: false, expected_product_version: "${spc_ver}" }
              as: ApplicationEngineer
              captures: { std_order: $.data.id, std_status: $.data.status }
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${customer_id}", product_id: "${cat_id}", order_code: "SO-CAT", quantity: 25, expedite_requested: true, expected_product_version: "${cat_ver}" }
              as: ApplicationEngineer
              captures: { cat_order: $.data.id }
          assert:
            - "${spc_lead} == 28 and ${spc_elig} == false; ${cat_lead} == 8 and ${cat_elig} == true (11 - 3 shave)"
            - "${err_expedite} == ERR_EXPEDITE_NOT_ELIGIBLE with HTTP status 422 and no order row for SO-EXP"
            - "ToolOrder.${std_order}.status == DRAFT and expedite_requested == false"
            - "ToolOrder.${cat_order} is created with expedite_requested true because CAT-INS-1 is eligible"

      - name: recondition_job_links_customer_product_and_predecessor_job
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /tooling/recondition-jobs]
          - endpoints[GET /tooling/recondition-jobs]
          - entities.ReconditionJob.fields.predecessor_job_id
          - entities.ReconditionJob.fields.regrind_pass_no
        distinguishing_aspect: "A second pass links three ways at once - to the customer, to the product and self-referentially to the finished first pass - and each link is observable through its own list filter, with regrind_pass_no derived from the chain length rather than supplied."
        test_recipe:
          setup:
            - "Regrindable product EM-10-1 (nominal 100.0, min regrind 70.0, step 2.5, 20 grind units)"
            - "Customer CU-8 ACTIVE with 50000 credit, wheel WH-8 AVAILABLE with 100000 life"
            - "First pass RJ-1 driven all the way to RETURNED"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-K10", target_workpiece_group: "K", co_binder_pct: 6.0, wc_grain_um: 0.8, hardness_hv: 1750, trs_mpa: 1900 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "EM-4F-30", iso_designation: "EM10-4F", application_class: "MEDIUM", chipbreaker_code: "NONE", rake_angle_deg: 10.0, nose_radius_mm: 0.5, max_depth_of_cut_mm: 10.0, edge_prep: "SHARP" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/tool-products"
              payload: { sku: "EM-10-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "SOLID_CARBIDE_ENDMILL", list_price_cents: 12000, min_order_qty: 1, nominal_length_mm: 100.0, min_regrind_length_mm: 70.0, regrind_step_mm: 2.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/grinding-wheels"
              payload: { wheel_code: "WH-8", spec_code: "D64-C100", initial_life_units: 100000 }
              as: ProductionPlanner
              captures: { wheel_id: $.data.id }
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-8", name: "Theta Regrind", tier: "STANDARD", regrind_credit_cents: 50000 }
              as: ProductionPlanner
              captures: { customer_id: $.data.id }
            - call: "GET /tooling/customers/${customer_id}"
              as: ProductionPlanner
              captures: { c_ver1: $.data.version }
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", job_code: "RJ-1", units_received: 10, expected_customer_version: "${c_ver1}" }
              as: ProductionPlanner
              captures: { job1_id: $.data.id, job1_pass: $.data.regrind_pass_no }
            - call: "POST /tooling/recondition-jobs/${job1_id}/inspect"
              payload: { units_inspected: 10, measured_length_mm: 90.0, measured_corner_wear_um: 210.0 }
              as: ProductionPlanner
            - call: "POST /tooling/recondition-jobs/${job1_id}/refurbish"
              payload: { wheel_id: "${wheel_id}", recoat_applied: false }
              as: ProductionPlanner
            - call: "POST /tooling/recondition-jobs/${job1_id}/return"
              payload: { units_returned: 10 }
              as: ProductionPlanner
            - call: "GET /tooling/customers/${customer_id}"
              as: ProductionPlanner
              captures: { c_ver2: $.data.version }
          trigger:
            - call: "POST /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", job_code: "RJ-2", units_received: 10, predecessor_job_id: "${job1_id}", expected_customer_version: "${c_ver2}" }
              as: ProductionPlanner
              captures: { job2_id: $.data.id, job2_pass: $.data.regrind_pass_no, job2_cust: $.data.customer_id, job2_prod: $.data.product_id, job2_pred: $.data.predecessor_job_id }
            - call: "GET /tooling/recondition-jobs"
              payload: { predecessor_job_id: "${job1_id}" }
              as: ProductionPlanner
              captures: { pred_job_code: "$.data[0].job_code" }
            - call: "GET /tooling/recondition-jobs"
              payload: { customer_id: "${customer_id}", status: "RETURNED" }
              as: ProductionPlanner
              captures: { cust_job_code: "$.data[0].job_code" }
            - call: "GET /tooling/recondition-jobs"
              payload: { wheel_id: "${wheel_id}" }
              as: ProductionPlanner
              captures: { wheel_job_code: "$.data[0].job_code" }
          assert:
            - "${job1_pass} == 1 and ${job2_pass} == 2 (regrind_pass_no is derived from the chain, never supplied)"
            - "${job2_cust} == ${customer_id} and ${job2_prod} == ${product_id} and ${job2_pred} == ${job1_id}"
            - "the predecessor_job_id filter returns exactly one row with ${pred_job_code} == RJ-2, and the customer_id + status=RETURNED filter returns exactly one row with ${cust_job_code} == RJ-1"
            - "the wheel_id filter returns exactly one row with ${wheel_job_code} == RJ-1 (the wheel link is written by refurbish, and RJ-2 has not been refurbished)"
            - "ReconditionJob.${job2_id}.warranted_life_extension_pct is null until inspection, and Customer.${customer_id}.reserved_credit_cents == 18500 for the open second pass"

      - name: withdraw_action_cancels_every_open_order_and_locks_the_release_dimension
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /tooling/tool-products/{productId}/withdraw]
          - state_machines.ToolProduct
          - validations[priority=17]
          - errors.ERR_PRODUCT_NOT_ORDERABLE
        distinguishing_aspect: "One action fans out over three collections at once: the product's release dimension reaches the terminal WITHDRAWN, the supply dimension is forced to UNAVAILABLE, every DRAFT/SUBMITTED order on the product is CANCELLED, and any further order against it is refused as not orderable."
        test_recipe:
          setup:
            - "DEVELOPMENT CATALOG product CAT-INS-1 whose supply_status is set to MAKE_TO_ORDER so it can be quoted, with two open orders (SO-D in DRAFT, SO-S in SUBMITTED) from customer CU-9"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/insert-geometries/${geometry_id}/release"
              as: GeometryEngineer
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/customers"
              payload: { customer_code: "CU-9", name: "Iota Works", tier: "STANDARD", regrind_credit_cents: 0 }
              as: ProductionPlanner
              captures: { customer_id: $.data.id }
            - call: "POST /tooling/tool-products/${product_id}/set-supply-status"
              payload: { supply_status: "MAKE_TO_ORDER" }
              as: ProductionPlanner
            - call: "GET /tooling/tool-products/${product_id}"
              as: ApplicationEngineer
              captures: { p_ver1: $.data.version }
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", order_code: "SO-D", quantity: 25, expected_product_version: "${p_ver1}" }
              as: ApplicationEngineer
              captures: { order_d: $.data.id }
            - call: "GET /tooling/tool-products/${product_id}"
              as: ApplicationEngineer
              captures: { p_ver2: $.data.version }
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", order_code: "SO-S", quantity: 30, expected_product_version: "${p_ver2}" }
              as: ApplicationEngineer
              captures: { order_s: $.data.id }
            - call: "POST /tooling/tool-orders/${order_s}/submit"
              as: ApplicationEngineer
            - call: "GET /tooling/tool-products/${product_id}"
              as: ApplicationEngineer
              captures: { p_ver3: $.data.version }
          trigger:
            - call: "POST /tooling/tool-products/${product_id}/withdraw"
              payload: { withdraw_reason: "Grade discontinued by the metallurgy roadmap" }
              as: QualityApprover
              captures: { rel: $.data.release_status, sup: $.data.supply_status }
            - call: "GET /tooling/tool-orders"
              payload: { product_id: "${product_id}" }
              as: ApplicationEngineer
              captures: { order1_status: "$.data[0].status", order2_status: "$.data[1].status" }
            - call: "POST /tooling/tool-orders"
              payload: { customer_id: "${customer_id}", product_id: "${product_id}", order_code: "SO-LATE", quantity: 25, expected_product_version: "${p_ver3}" }
              as: ApplicationEngineer
              captures: { err_late: $.data.error_id }
          assert:
            - "${rel} == WITHDRAWN and ${sup} == UNAVAILABLE in the same response"
            - "${order1_status} == CANCELLED and ${order2_status} == CANCELLED (SO-D from DRAFT and SO-S from SUBMITTED), and total_count is 2"
            - "${err_late} == ERR_PRODUCT_NOT_ORDERABLE with HTTP status 422"
            - "ToolProduct.${product_id}.version bumped exactly once by the withdraw"

      - name: grinding_wheel_crud_surface_is_create_read_list_only
        claim_type: standard_crud
        grounds:
          - endpoints[POST /tooling/grinding-wheels]
          - endpoints[GET /tooling/grinding-wheels/{wheelId}]
          - endpoints[GET /tooling/grinding-wheels]
          - entities.GrindingWheel
        distinguishing_aspect: "The wheel resource exposes create, read and a status-filtered list and nothing else: its life counters are computed at 201 (remaining_life_units == initial_life_units, consumed 0, dress_count 0), the read echoes them, and the abrasive spec is only ever changed by replacing the asset because no update or delete route exists."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
          trigger:
            - call: "POST /tooling/grinding-wheels"
              payload: { wheel_code: "WH-A", spec_code: "D46-C75-B", initial_life_units: 5000 }
              as: ProductionPlanner
              captures: { wheel_a: $.data.id, rem_a: $.data.remaining_life_units, con_a: $.data.consumed_life_units, dc_a: $.data.dress_count, st_a: $.data.status }
            - call: "POST /tooling/grinding-wheels"
              payload: { wheel_code: "WH-B", spec_code: "D64-C100", initial_life_units: 100 }
              as: ProductionPlanner
              captures: { wheel_b: $.data.id }
            - call: "GET /tooling/grinding-wheels/${wheel_a}"
              as: QualityApprover
              captures: { read_spec: $.data.spec_code, read_rem: $.data.remaining_life_units }
            - call: "GET /tooling/grinding-wheels"
              payload: { status: "AVAILABLE", limit: 1, offset: 1 }
              as: ProductionPlanner
              captures: { page_code: "$.data[0].wheel_code" }
          assert:
            - "${st_a} == AVAILABLE, ${con_a} == 0, ${dc_a} == 0 and ${rem_a} == 5000 at creation"
            - "${read_spec} == D46-C75-B and ${read_rem} == 5000"
            - "with status=AVAILABLE, limit 1 and offset 1 the envelope reports total_count 2, has_more false and a single element whose ${page_code} == WH-B"
            - "initial_life_units 100 is accepted at the declared lower bound, and no PATCH/PUT/DELETE route exists for /tooling/grinding-wheels/{wheelId}"

      - name: coating_run_completion_action
        claim_type: action_endpoint
        grounds:
          - "endpoints[POST /tooling/coating-runs/{runId}/complete]"
        excluded_because:
          difficulty_instance: coating_chamber_aggregate_area_within_overlap
          rationale: "The chamber action endpoint, its window preconditions and its validation side effects are exercised there and again in the state_machines corner instances, so a separate action-endpoint instance would only repeat the same calls."

      - name: sinter_action_endpoint
        claim_type: action_endpoint
        grounds:
          - "endpoints[POST /tooling/powder-blend-batches/{batchId}/sinter]"
        excluded_because:
          difficulty_instance: sinter_density_and_yield_exactly_at_minimum
          rationale: "Every declared side effect of POST /tooling/powder-blend-batches/{batchId}/sinter (yield, qc_status, remaining_units) is asserted at the boundary there."

  - section: errors
    instances:
      - name: authentication_and_role_errors_short_circuit_deeper_checks
        claim_type: priority_ordering
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_ROLE_NOT_PERMITTED
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
        distinguishing_aspect: "Both envelope errors are proved to pre-empt the checks behind them: an empty X-User-ID on a GET for a non-existent id returns 401 rather than the 404, and a forbidden role posting a body that is also missing required fields returns 403 rather than ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
          trigger:
            - call: "GET /tooling/carbide-grades/11111111-1111-4111-8111-111111111111"
              as: MetallurgyEngineer
              as_user_id: ""
              captures: { err_auth: $.data.error_id, msg_auth: $.data.message }
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-X" }
              as: CoatingEngineer
              captures: { err_role: $.data.error_id }
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-X" }
              as: MetallurgyEngineer
              captures: { err_request: $.data.error_id }
          assert:
            - "${err_auth} == ERR_UNAUTHENTICATED with HTTP status 401, not ERR_GRADE_NOT_FOUND"
            - "${msg_auth} is a non-empty human-readable string and the envelope still carries success false"
            - "${err_role} == ERR_ROLE_NOT_PERMITTED with HTTP status 403, not ERR_INVALID_REQUEST (priority 2 precedes 3)"
            - "${err_request} == ERR_INVALID_REQUEST with HTTP status 400 once the role is right (target_workpiece_group, co_binder_pct, wc_grain_um, hardness_hv and trs_mpa are all missing)"
            - "no CarbideGrade row exists after the three calls"

      - name: layer_stack_schema_rejections_and_the_legal_non_adjacent_repeat
        claim_type: violation_to_error
        grounds:
          - errors.ERR_INVALID_LAYER_STACK
          - validations[priority=6]
          - entities.CoatingRecipe.fields.total_thickness_um
        distinguishing_aspect: "All three malformed shapes are rejected - empty stack, six layers, adjacent duplicate material - while the near-miss case of the same material repeated non-adjacently is legal and its thicknesses still sum, so the rule cannot be implemented as a plain distinct-material check."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
          trigger:
            - call: "POST /tooling/coating-recipes"
              payload: { recipe_code: "PVD-EMPTY", deposition_type: "PVD", layers: [] }
              as: CoatingEngineer
              captures: { err_empty: $.data.error_id }
            - call: "POST /tooling/coating-recipes"
              payload: { recipe_code: "PVD-SIX", deposition_type: "PVD", layers: [ { material: "TiN", thickness_um: 0.5 }, { material: "TiAlN", thickness_um: 0.5 }, { material: "TiN", thickness_um: 0.5 }, { material: "TiAlN", thickness_um: 0.5 }, { material: "TiN", thickness_um: 0.5 }, { material: "TiAlN", thickness_um: 0.5 } ] }
              as: CoatingEngineer
              captures: { err_six: $.data.error_id }
            - call: "POST /tooling/coating-recipes"
              payload: { recipe_code: "PVD-ADJ", deposition_type: "PVD", layers: [ { material: "TiAlN", thickness_um: 1.0 }, { material: "TiAlN", thickness_um: 2.0 } ] }
              as: CoatingEngineer
              captures: { err_adj: $.data.error_id }
            - call: "POST /tooling/coating-recipes"
              payload: { recipe_code: "PVD-ABA", deposition_type: "PVD", layers: [ { material: "TiAlN", thickness_um: 1.0 }, { material: "TiN", thickness_um: 0.5 }, { material: "TiAlN", thickness_um: 1.0 } ] }
              as: CoatingEngineer
              captures: { aba_id: $.data.id, aba_total: $.data.total_thickness_um, aba_valid: $.data.is_validated }
          assert:
            - "${err_empty} == ERR_INVALID_LAYER_STACK with HTTP status 422"
            - "${err_six} == ERR_INVALID_LAYER_STACK (six layers exceeds the five-layer ceiling)"
            - "${err_adj} == ERR_INVALID_LAYER_STACK (adjacent TiAlN/TiAlN)"
            - "CoatingRecipe.${aba_id} is created with ${aba_total} == 2.50 and ${aba_valid} == false"
            - "exactly one CoatingRecipe row exists after the four calls"

      - name: wear_curve_schema_is_checked_before_the_trial_is_looked_up
        claim_type: priority_ordering
        grounds:
          - errors.ERR_INVALID_WEAR_CURVE
          - errors.ERR_TRIAL_NOT_FOUND
          - validations[priority=5]
          - validations[priority=7]
          - calculations.trial_tool_life_rating
        distinguishing_aspect: "Priority 5 sits above the path-404 band, so a malformed curve posted to a random trial id returns ERR_INVALID_WEAR_CURVE rather than ERR_TRIAL_NOT_FOUND; on a real RUNNING trial the three malformed shapes (single point, decreasing vb, equal last pair) are each rejected while the well-formed curve rates to 20.0 minutes."
        test_recipe:
          setup:
            - "Grade WC-P25 in PILOT, batch BLD-1 PASSED with 180 units, product CAT-INS-1 in QUALIFICATION, dossier DOS-1 OPEN, trial TRL-1 RUNNING on 20 units"
          setup_api_calls:
            - call: "POST /tooling/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProductionPlanner
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-1", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches/${batch_id}/press"
              payload: { pressed_units: 200 }
              as: MetallurgyEngineer
            - call: "POST /tooling/powder-blend-batches/${batch_id}/sinter"
              payload: { sintered_units: 180, scrap_units: 20, measured_density_gcc: 14.35, measured_hardness_hv: 1580 }
              as: MetallurgyEngineer
            - call: "POST /tooling/carbide-grades/${grade_id}/start-pilot"
              as: MetallurgyEngineer
            - call: "POST /tooling/insert-geometries"
              payload: { geometry_code: "CNMG-MM", iso_designation: "CNMG120408", application_class: "MEDIUM", chipbreaker_code: "MM", rake_angle_deg: 12.0, nose_radius_mm: 0.8, max_depth_of_cut_mm: 4.0, edge_prep: "HONED" }
              as: GeometryEngineer
              captures: { geometry_id: $.data.id }
            - call: "POST /tooling/insert-geometries/${geometry_id}/release"
              as: GeometryEngineer
            - call: "POST /tooling/tool-products"
              payload: { sku: "CAT-INS-1", order_class: "CATALOG", grade_id: "${grade_id}", geometry_id: "${geometry_id}", tool_type: "INSERT", list_price_cents: 4550, min_order_qty: 25, nominal_length_mm: 12.7, min_regrind_length_mm: 12.7, regrind_step_mm: 0.5, grind_units_per_tool: 20 }
              as: GeometryEngineer
              captures: { product_id: $.data.id }
            - call: "POST /tooling/tool-products/${product_id}/enter-qualification"
              as: ApplicationEngineer
            - call: "POST /tooling/qualification-dossiers"
              payload: { product_id: "${product_id}", dossier_code: "DOS-1" }
              as: ApplicationEngineer
              captures: { dossier_id: $.data.id }
            - call: "POST /tooling/machining-trials"
              payload: { dossier_id: "${dossier_id}", batch_id: "${batch_id}", trial_code: "TRL-1", workpiece_material_code: "C45E", workpiece_group: "P", units_consumed: 20, cutting_speed_vc: 250.0, feed_fz: 0.25, depth_ap: 2.0, coolant: "FLOOD" }
              as: ApplicationEngineer
              as_user_id: "op-1"
              captures: { trial_id: $.data.id }
          trigger:
