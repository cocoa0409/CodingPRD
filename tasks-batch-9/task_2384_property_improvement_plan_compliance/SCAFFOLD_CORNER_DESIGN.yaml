            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-11.1.1", brand_estimated_cost_cents: 1000000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_id: $.data.id }
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
          trigger:
            - call: "POST /pip/disputes"
              payload: { plan_id: "${plan_id}", item_id: "${item_id}", dispute_basis: "COST_ESTIMATE", claimed_cost_cents: 1200000 }
