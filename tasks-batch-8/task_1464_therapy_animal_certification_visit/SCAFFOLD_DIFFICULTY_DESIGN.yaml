  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: certification_suspend_reinstate_cycle
        grounds:
          - state_machines.Certification.ACTIVE_to_SUSPENDED
          - state_machines.Certification.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Certification is cyclic (ACTIVE -> SUSPENDED -> ACTIVE): after a full
          loop the certification returns to ACTIVE with expires_on UNCHANGED
          (no extension) and suspension fields cleared — distinguishing a true
          cycle from a linear pipeline that would mint a new record.
        test_recipe:
          setup:
            - "Certification c ACTIVE (activated 2026-08-02, expires_on 2028-08-01); rabies valid_until 2029-12-31; policy ACTIVE 200000000 cents through 2029-12-31"
          setup_api_calls:
            - { call: "POST /v1/handlers", payload: { full_name: "H C", email: "hc@x.com", region_code: "WA", volunteer_since: "2024-08-01" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /v1/handlers/${h}/approve", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/animals", payload: { name: "D", species: "DOG", breed: "Beagle", date_of_birth: "2021-01-01" }, as: Handler, as_user_id: "${h}", captures: { a: $.data.id } }
            - { call: "POST /v1/teams", payload: { animal_id: "${a}", team_name: "TC" }, as: Handler, as_user_id: "${h}", captures: { t: $.data.id } }
            - { call: "POST /v1/evaluations", payload: { team_id: "${t}" }, as: Handler, as_user_id: "${h}", captures: { e: $.data.id } }
            - { call: "POST /v1/evaluators", payload: { full_name: "Ev C", email: "evc@x.com", region_code: "WA", specializations: ["DOG"] }, as: ProgramAdmin, captures: { ev: $.data.id } }
            - { call: "POST /v1/evaluations/${e}/schedule", payload: { evaluator_id: "${ev}", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T11:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /v1/evaluations/${e}/score", payload: { aptitude_score: 80, obedience_score: 70 }, as: Evaluator, as_user_id: "${ev}" }
            - { call: "POST /v1/vaccination-records", payload: { animal_id: "${a}", vaccine_type: "RABIES", administered_on: "2026-07-01", valid_until: "2029-12-31", veterinarian_name: "Dr V" }, as: Handler, as_user_id: "${h}" }
            - { call: "POST /v1/insurance-policies", payload: { insurer_name: "INS", policy_number: "P-C", coverage_cents: 200000000, effective_from: "2026-01-01", effective_until: "2029-12-31" }, as: Handler, as_user_id: "${h}", captures: { p: $.data.id } }
            - { call: "POST /v1/insurance-policies/${p}/verify", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/certifications", payload: { team_id: "${t}", evaluation_id: "${e}" }, as: ProgramAdmin, captures: { c: $.data.id } }
            - { call: "POST /v1/certifications/${c}/activate", payload: {}, as: ProgramAdmin }
          trigger:
            - { call: "POST /v1/certifications/${c}/suspend", payload: { reason: "manual review" }, as: ComplianceOfficer, captures: { st1: $.data.status } }
            - { call: "GET /v1/teams/${t}", payload: {}, as: ProgramAdmin, captures: { team_st: $.data.status } }
            - { call: "POST /v1/certifications/${c}/reinstate", payload: {}, as: ComplianceOfficer, captures: { st2: $.data.status, exp2: $.data.expires_on, sr2: $.data.suspension_reason } }
            - { call: "GET /v1/teams/${t}", payload: {}, as: ProgramAdmin, captures: { team_st2: $.data.status } }
          assert:
            - "st1 == SUSPENDED and team_st == SUSPENDED (bubble-down)"
            - "st2 == ACTIVE and team_st2 == ACTIVE (cycle closed)"
            - "exp2 == 2028-08-01 (expires_on NOT extended by the suspension cycle)"
            - "sr2 == null (suspension_reason cleared)"

      - name: request_offer_decline_cycle
        grounds:
          - state_machines.VisitRequest.OPEN_to_OFFERED
          - state_machines.VisitRequest.OFFERED_to_OPEN
          - state_machines.VisitRequest.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          VisitRequest is cyclic (OPEN -> OFFERED -> OPEN -> OFFERED ->
          ACCEPTED): a decline returns the SAME request row to OPEN with
          decline_count incremented and offer fields cleared, and a later
          offer/accept cycle succeeds on the same row.
        test_recipe:
          setup:
