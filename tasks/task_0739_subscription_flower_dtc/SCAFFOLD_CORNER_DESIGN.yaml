scaffold_corner_design:
  # =================================================================
  # Entities
  # =================================================================
  - section: entities
    instances:
      - name: corner_customer_creation_returns_201
        claim_type: Creation
        grounds: [entities.Customer.fields.status, entities.Customer.fields.email]
        distinguishing_aspect: "POST /customers with email+full_name returns 201 with system id and status defaulting to ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { email: "new@x.com", full_name: "New Person" }
              as: PlatformAdmin
              captures: { cid: "$.data.id", st: "$.data.status" }
          assert:
            - "response code 201; Customer.${cid}.status == ACTIVE; id is a server-minted UUID"

      - name: corner_subscription_default_style_applied
        claim_type: Defaults
        grounds: [entities.Subscription.fields.style]
        distinguishing_aspect: "Omitting style on subscription create yields the default ROUND."
        test_recipe:
          setup: ["A plan and a customer exist."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "dstyle@x.com", full_name: "D Style" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id", style: "$.data.style" }
          assert:
            - "Subscription.${sub_id}.style == ROUND (default applied)"

      - name: corner_subscription_missing_size_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Subscription.fields.size, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Creating a subscription without the required size field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A plan and a customer exist."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "nosize@x.com", full_name: "No Size" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST (missing required size)"

      - name: corner_subscription_invalid_size_enum
        claim_type: Type Constraints
        grounds: [entities.Subscription.fields.size, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "size outside {PETITE,ORIGINAL,DELUXE,GRAND} returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["A plan and a customer exist."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "badsize@x.com", full_name: "Bad Size" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "HUGE" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_REQUEST (invalid size enum)"

      - name: corner_subscription_create_plan_not_found
        claim_type: Parent Relationships
        grounds: [entities.Subscription.fields.plan_id, "errors[ERR_PLAN_NOT_FOUND]"]
        distinguishing_aspect: "Creating a subscription against a non-existent plan_id returns ERR_PLAN_NOT_FOUND."
        test_recipe:
          setup: ["A customer exists; no plan with the given id."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "noplan@x.com", full_name: "No Plan" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "00000000-0000-0000-0000-000000000000", size: "ORIGINAL" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_PLAN_NOT_FOUND"

      - name: corner_customer_not_found
        claim_type: Not Found
        grounds: [entities.Customer.fields.email, "errors[ERR_CUSTOMER_NOT_FOUND]"]
        distinguishing_aspect: "GET /customers/{unknown} returns ERR_CUSTOMER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-0000-0000-000000000000"
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_CUSTOMER_NOT_FOUND"

      - name: corner_loyalty_tier_silver_after_two_deliveries
        claim_type: Computed Fields
        grounds: [entities.Customer.fields.loyalty_tier, entities.Customer.fields.lifetime_cycles, calculations.loyalty_tier]
        distinguishing_aspect: "Two DELIVERED shipments set Customer.lifetime_cycles to 2 and loyalty_tier to SILVER (2 in [2,5))."
        test_recipe:
          setup: ["Subscription with two cycle-1 shipments delivered on one route (adjacent windows)."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "loyal@x.com", full_name: "Loyal Person" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}/shipments"
              as: PlatformAdmin
              captures: { sh0_id: "$.data[0].id", sh1_id: "$.data[1].id" }
            - call: "POST /carrier-routes"
              payload: { zone: "Z1", service_date: "2026-03-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { route_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-04T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipments/${sh0_id}/source"
              payload: {}
              as: FulfillmentOps
            - call: "POST /shipments/${sh0_id}/confirm-sourced"
              payload: { substitution_applied: false }
              as: FulfillmentOps
            - call: "POST /shipments/${sh0_id}/ship"
              payload: { route_id: "${route_id}", delivery_window_start: "2026-03-10T09:00:00Z", delivery_window_end: "2026-03-10T10:00:00Z" }
              as: FulfillmentOps
            - call: "POST /shipments/${sh0_id}/deliver"
              payload: {}
              as: FulfillmentOps
            - call: "POST /shipments/${sh1_id}/source"
              payload: {}
              as: FulfillmentOps
            - call: "POST /shipments/${sh1_id}/confirm-sourced"
              payload: { substitution_applied: false }
              as: FulfillmentOps
            - call: "POST /shipments/${sh1_id}/ship"
              payload: { route_id: "${route_id}", delivery_window_start: "2026-03-10T10:00:00Z", delivery_window_end: "2026-03-10T11:00:00Z" }
              as: FulfillmentOps
            - call: "POST /shipments/${sh1_id}/deliver"
              payload: {}
              as: FulfillmentOps
          trigger:
            - call: "GET /customers/${cust_id}"
              as: PlatformAdmin
              captures: { tier: "$.data.loyalty_tier", cycles: "$.data.lifetime_cycles" }
          assert:
            - "Customer.${cust_id}.lifetime_cycles == 2"
            - "Customer.${cust_id}.loyalty_tier == SILVER"

  # =================================================================
  # State Machines
  # =================================================================
  - section: state_machines
    instances:
      - name: corner_pause_from_paused_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.Subscription.lifecycle=PAUSED_to_lifecycle=ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Pausing an already-PAUSED subscription returns ERR_INVALID_STATE; no side effects."
        test_recipe:
          setup: ["A subscription paused once."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "pp@x.com", full_name: "P P" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (cannot pause from PAUSED)"

      - name: corner_skip_non_scheduled_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.Shipment.SCHEDULED_to_SKIPPED, "errors[ERR_SHIPMENT_NOT_SKIPPABLE]"]
        distinguishing_aspect: "Skipping a shipment already in SOURCING returns ERR_SHIPMENT_NOT_SKIPPABLE."
        test_recipe:
          setup: ["A subscription's shipment[2] moved to SOURCING (within skip window otherwise)."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "sk@x.com", full_name: "S K" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}/shipments"
              as: PlatformAdmin
              captures: { sh2_id: "$.data[2].id" }
            - call: "POST /shipments/${sh2_id}/source"
              payload: {}
              as: FulfillmentOps
          trigger:
            - call: "POST /shipments/${sh2_id}/skip"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_SHIPMENT_NOT_SKIPPABLE (status is SOURCING, not SCHEDULED)"

      - name: corner_charge_double_capture_idempotency
        claim_type: Idempotency
        grounds: [state_machines.Charge.PENDING_to_CAPTURED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Simulating SUCCEEDED twice on the same charge: the second attempt returns ERR_INVALID_STATE (already CAPTURED)."
        test_recipe:
          setup: ["A subscription with a PENDING cycle-1 charge captured once."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "dc@x.com", full_name: "D C" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}/charges"
              as: BillingAdmin
              captures: { charge1_id: "$.data[0].id" }
            - call: "POST /charges/${charge1_id}/simulate-payment"
              payload: { outcome: "SUCCEEDED" }
              as: BillingAdmin
          trigger:
            - call: "POST /charges/${charge1_id}/simulate-payment"
              payload: { outcome: "SUCCEEDED" }
              as: BillingAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (charge already CAPTURED, not PENDING)"

      - name: corner_winback_redeem_reactivates_subscription
        claim_type: Valid Transition
        grounds:
          - state_machines.WinBackOffer.OFFERED_to_REDEEMED
          - state_machines.Subscription.lifecycle=CANCELLED_to_lifecycle=ACTIVE
          - entities.Subscription.fields.discount_pct
        distinguishing_aspect: "Redeeming an in-window offer flips it to REDEEMED, reactivates the subscription (CANCELLED->ACTIVE), and sets discount_pct=0.2."
        test_recipe:
          setup: ["A cancelled subscription with an OFFERED win-back offer captured while the clock is still 2026-03-01 (offer expires 2026-03-31)."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "wb@x.com", full_name: "W B" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /customers/${cust_id}/win-back-offers"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { offer_id: "$.data[0].id" }
          trigger:
            - call: "POST /win-back-offers/${offer_id}/redeem"
              payload: { subscription_id: "${sub_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { os: "$.data.status" }
            - call: "GET /subscriptions/${sub_id}"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { lc: "$.data.lifecycle_status", disc: "$.data.discount_pct" }
          assert:
            - "WinBackOffer.${offer_id}.status == REDEEMED"
            - "Subscription.${sub_id}.lifecycle_status == ACTIVE"
            - "Subscription.${sub_id}.discount_pct == 0.2"

      - name: corner_resume_from_active_invalid
        claim_type: Invalid Transitions
        grounds: [state_machines.Subscription.lifecycle=PAUSED_to_lifecycle=ACTIVE, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resuming an ACTIVE (never-paused) subscription returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["A fresh ACTIVE subscription."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "ra@x.com", full_name: "R A" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/resume"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (cannot resume from ACTIVE)"

      - name: corner_shipment_branch_substituted
        claim_type: Valid Transition
        grounds: [state_machines.Shipment.SOURCING_to_SUBSTITUTED]
        excluded_because:
          difficulty_instance: shipment_branch_sourced_vs_substituted
          rationale: "The SUBSTITUTED branch and its substitution_applied side effect are asserted by the named §1.8 instance."

  # =================================================================
  # Calculations
  # =================================================================
  - section: calculations
    instances:
      - name: corner_renewal_price_standard_no_floor
        claim_type: Correct Result
        grounds: [calculations.renewal_price, entities.Subscription.fields.renewal_price_cents]
        distinguishing_aspect: "base 6000 + DELUXE 1500 + no vase, no discount -> renewal_price 7500 (floor/cap inactive)."
        test_recipe:
          setup: ["A WEEKLY plan base 6000 and a customer."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "rp@x.com", full_name: "R P" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "DELUXE", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id", price: "$.data.renewal_price_cents" }
          assert:
            - "Subscription.${sub_id}.renewal_price_cents == 7500"

      - name: corner_per_shipment_value_skip_credit
        claim_type: Correct Result
        grounds: [calculations.per_shipment_value, state_machines.Shipment.SCHEDULED_to_SKIPPED, entities.WalletEntry.fields.amount_cents]
        distinguishing_aspect: "Skipping a shipment credits the wallet by per_shipment_value = round(6000/4) = 1500."
        test_recipe:
          setup: ["WEEKLY ORIGINAL subscription (renewal 6000); shipment[2] scheduled 2026-03-17, clock at default 2026-03-01 (before cutoff)."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "sc@x.com", full_name: "S C" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}/shipments"
              as: PlatformAdmin
              captures: { sh2_id: "$.data[2].id" }
          trigger:
            - call: "POST /shipments/${sh2_id}/skip"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { st: "$.data.status" }
            - call: "GET /customers/${cust_id}"
              as: PlatformAdmin
              captures: { w: "$.data.wallet_credit_cents" }
          assert:
            - "Shipment.${sh2_id}.status == SKIPPED"
            - "Customer.${cust_id}.wallet_credit_cents == 1500"

      - name: corner_cold_chain_usable_until_computed
        claim_type: Correct Result
        grounds: [calculations.cold_chain_deadline, entities.StemLot.fields.usable_until, entities.StemLot.fields.cold_chain_state]
        distinguishing_aspect: "usable_until = sourced_at + shelf_life_hours = 2026-03-06T00:00:00Z; FRESH while clock (default 2026-03-01) < usable_until."
        test_recipe:
          setup: ["Clock at default 2026-03-01."]
          setup_api_calls:
            - call: "POST /stem-lots"
              payload: { variety: "ROSE", grade: "A", quantity_total: 50, unit_cost_cents: 40, sourced_at: "2026-03-04T00:00:00Z", shelf_life_hours: 48 }
              as: FulfillmentOps
              captures: { lot_id: "$.data.id" }
          trigger:
            - call: "GET /stem-lots/${lot_id}"
              as: FulfillmentOps
              captures: { uu: "$.data.usable_until", ccs: "$.data.cold_chain_state" }
          assert:
            - "StemLot.${lot_id}.usable_until == 2026-03-06T00:00:00Z"
            - "StemLot.${lot_id}.cold_chain_state == FRESH (clock 2026-03-01 < usable_until)"

      - name: corner_dual_variant_refund_estimate_vs_actual
        claim_type: Variant Divergence
        grounds: [calculations.cancellation_refund]
        excluded_because:
          difficulty_instance: refund_estimate_vs_actual_on_cancel
          rationale: "Estimate-vs-actual divergence is the core assertion of the named §1.8 instance."

      - name: corner_stem_valuation_reserved_vs_committed
        claim_type: Variant Divergence
        grounds: [calculations.stem_valuation]
        excluded_because:
          difficulty_instance: stem_reserved_vs_committed_valuation
          rationale: "Reserved-vs-committed valuation divergence is asserted by the named §1.8 instance."

      - name: corner_shipment_stem_cost_rounding
        claim_type: Precision
        grounds: [calculations.shipment_stem_cost]
        excluded_because:
          difficulty_instance: shipment_stem_cost_line_then_sum_rounding
          rationale: "Round-per-line-then-sum precision is asserted by the named §1.8 instance."

  # =================================================================
  # Validations
  # =================================================================
  - section: validations
    instances:
      - name: corner_unauthenticated_missing_headers
        claim_type: Violation → Error
        grounds: ["validations[priority=10]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without valid auth headers returns ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["A plan and a customer exist (to have a real subscription id)."]
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "unauth@x.com", full_name: "Un Auth" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
          trigger:
            - call: "GET /subscriptions/${sub_id}"
              as: Anonymous
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (no/invalid X-User-Role header)"

      - name: corner_billing_past_due_blocks_change
        claim_type: Violation → Error
        grounds: ["validations[priority=65]", "errors[ERR_BILLING_PAST_DUE]"]
        distinguishing_aspect: "Changing an ACTIVE-but-PAST_DUE subscription (state ok, ownership ok, OCC ok) returns ERR_BILLING_PAST_DUE (402)."
        test_recipe:
          setup: ["Subscription made PAST_DUE via a failed payment but still ACTIVE."]
          setup_api_calls:
            - call: "POST /plans"
