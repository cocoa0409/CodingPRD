          trigger:
            - call: "POST /gc/petitions/${peta}/grant"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/petitions/${petb}/dismiss"
              payload: {}
              as: Judge
              as_user_id: "judge-1"
          assert:
