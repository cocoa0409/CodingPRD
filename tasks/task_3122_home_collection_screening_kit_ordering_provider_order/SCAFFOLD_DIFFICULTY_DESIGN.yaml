            - "age-76 order rejected with ERR_AGE_OUT_OF_RANGE"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: outreach_requires_program_active_push
        grounds:
          - state_machines.MemberCohort.ELIGIBLE_to_OUTREACH_SENT
          - validations[priority=17]
          - validations[priority=18]
        distinguishing_aspect: |
          Pair MemberCohort -> HealthPlanProgram: the cohort's outreach
          transition is gated on the PROGRAM's state (is_active == true and
          outreach_mode == PUSH). A SELF_SERVE program rejects outreach even
          though the cohort row itself is ELIGIBLE.
        test_recipe:
          setup:
            - "SELF_SERVE program G with cohort member M (status ELIGIBLE)"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/programs"
              payload: { program_code: "G-SS", program_name: "GSS", outreach_mode: "SELF_SERVE", measure_year: 2026 }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /screening/patients"
              payload: { external_ref: "p-xd-1", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/programs/${g_id}/cohorts"
              payload: { patient_id: "${p_id}" }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /screening/programs/${g_id}/cohorts/${c_id}/outreach"
              payload: { channel: "MAIL", template_code: "T1" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PROGRAM_MODE_VIOLATION"
            - "MemberCohort.${c_id}.status remains ELIGIBLE"

      - name: kit_ship_requires_order_in_kit_ordered
        grounds:
          - state_machines.ScreeningKit.ORDERED_to_SHIPPED
          - validations[priority=4]
        distinguishing_aspect: |
          Pair ScreeningKit -> ScreeningOrder (different entity pair from
          cohort->program): shipping a kit is rejected when its parent order
          has moved on (e.g. order CANCELLED), even though the kit row itself
          is still ORDERED.
        test_recipe:
          setup:
            - "Order O confirmed ELIGIBLE then CANCELLED by the provider before any kit exists is impossible (kit requires ELIGIBLE); concretely: order driven to KIT_ORDERED, kit created, then a second order for a different patient reuses the kit endpoint — instead: verify ship on a kit whose order is CANCELLED is not reachable, so this instance asserts the dependency via ordering: an order cancelled from ELIGIBLE cannot later accept a kit, and a kit whose order id is used by reminders/dispatch after cancel is rejected with ERR_ORDER_INVALID_STATE"
            - "Reachable form: order O -> ELIGIBLE -> cancelled; POST kit on cancelled order rejected ERR_ORDER_INVALID_STATE; then a fresh order O2 -> KIT_ORDERED -> kit K2; cancelling O2 is now impossible (state), so ship K2 proceeds — assert the ship precondition by attempting ship on a kit whose order was abandoned (KIT_SHIPPED->ABANDONED via clock)"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-xd-2", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567801", display_name: "Dr L", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/cancel"
              payload: {}
              as: Provider
              as_user_id: "${v_id}"
          trigger:
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 2" }
              as: FulfillmentAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ORDER_INVALID_STATE (kit creation gated on order state, checked before OCC version evaluation is moot)"
            - "no ScreeningKit exists for order ${o_id}: GET /screening/orders/${o_id}/kits returns empty array"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: in_flight_order_mutual_exclusion_per_patient
        grounds:
          - validations[priority=12]
          - errors[ERR_ACTIVE_ORDER_EXISTS]
        distinguishing_aspect: |
          Interval semantics: state-occupancy exclusion on the Patient
          resource. A patient may hold at most one order in any in-flight
          status at a time; the 'interval' is the order's lifetime from
          ELIGIBLE to terminal. A second order for the same patient is
          rejected at kit-creation time (the point occupancy begins), not at
          order capture — capture is allowed, occupancy is not.
        test_recipe:
          setup:
            - "Patient P with order O1 confirmed ELIGIBLE (occupancy begun at kit creation: O1 driven to KIT_SHIPPED)"
            - "Second order O2 for the same patient, confirmed ELIGIBLE"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-ovl-1", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567802", display_name: "Dr M", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o1_id: $.data.id, o1_v: $.data.version }
            - call: "POST /screening/orders/${o1_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o1_id}/kit"
              payload: { expected_order_version: "${o1_v} + 1" }
              as: FulfillmentAgent
              captures: { k1_id: $.data.id }
            - call: "POST /screening/kits/${k1_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o2_id: $.data.id, o2_v: $.data.version }
            - call: "POST /screening/orders/${o2_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /screening/orders/${o2_id}/kit"
              payload: { expected_order_version: "${o2_v} + 1" }
              as: FulfillmentAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ACTIVE_ORDER_EXISTS (O1 occupies the patient in KIT_SHIPPED)"
            - "http status == 409"
            - "ScreeningOrder.${o2_id}.status remains ELIGIBLE"

      - name: stabilization_window_point_in_interval
        grounds:
          - calculations.stabilization_window_check
          - errors[ERR_STABILIZATION_EXPIRED]
        distinguishing_aspect: |
          Different semantics from instance 1: point-in-half-open-interval
          occupancy on the ScreeningKit resource (processing must start inside
          [returned_at, returned_at+72h) ), versus the state-occupancy mutual
          exclusion on Patient. Adjacency: a process start at the exact
          interval end collides (rejected), while the same instant is the
          earliest legal start for a hypothetical second window — the two
          rules differ in geometric treatment.
        test_recipe:
          setup:
            - "Excluded: fully exercised by boundary_precision_check.stabilization_strict_less_than_at_exact_expiry — this instance pins the distinct SEMANTICS (half-open point-in-interval) via the one-second-before acceptance leg already asserted there; kept as a full instance to satisfy >=2 with distinct setup: kit returned at 2026-09-01T12:00:00Z, process attempted at 2026-09-04T11:59:59Z succeeds and at 2026-09-04T12:00:00Z on a second kit fails"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-ovl-2", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567803", display_name: "Dr N", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { k_id: $.data.id }
            - call: "POST /screening/kits/${k_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/kits/${k_id}/return"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/orders/${o_id}/specimens"
              payload: {}
              as: LabTechnician
              captures: { s_id: $.data.id }
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T11:59:59Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /screening/specimens/${s_id}/process"
              payload: {}
              as: LabTechnician
          assert:
            - "process succeeds at returned_at + 71h59m59s: LabSpecimen.${s_id}.status == PROCESSING"
            - "ScreeningKit.${k_id}.stabilization_expires_at == 2026-09-04T12:00:00Z (the half-open end that would reject one second later)"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: recollection_round_trip_conserves_single_active_kit
        grounds:
          - state_machines.ScreeningOrder.IN_LAB_to_RECOLLECTION_REQUESTED
          - state_machines.ScreeningOrder.RECOLLECTION_REQUESTED_to_KIT_ORDERED
          - entities.ScreeningOrder.fields.active_kit_id
        distinguishing_aspect: |
          Conserved quantity: exactly one outstanding (non-terminal) kit per
          order. Forward action (kit creation) paired with its compensating
          consumption (INADEQUATE -> kit CONSUMED, active_kit_id cleared)
          leaves count(kits in {ORDERED, SHIPPED, RETURNED, IN_PROCESSING}
          for the order) == 1 before and after each round trip; recollection
          never produces two live kits.
        test_recipe:
          setup:
            - "Order O with kit K1 shipped, returned, specimen INADEQUATE (K1 CONSUMED); replacement kit K2 created"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/patients"
              payload: { external_ref: "p-inv-1", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567804", display_name: "Dr O", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { k1_id: $.data.id }
            - call: "POST /screening/kits/${k1_id}/ship"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/kits/${k1_id}/return"
              payload: {}
              as: FulfillmentAgent
            - call: "POST /screening/orders/${o_id}/specimens"
              payload: {}
              as: LabTechnician
              captures: { s1_id: $.data.id }
            - call: "POST /screening/specimens/${s1_id}/adequacy"
              payload: { adequacy: "INADEQUATE" }
              as: LabTechnician
            - call: "GET /screening/orders/${o_id}"
              as: ProgramAdmin
              captures: { o_v2: $.data.version }
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v2}" }
              as: FulfillmentAgent
              captures: { k2_id: $.data.id }
          trigger:
            - call: "GET /screening/orders/${o_id}/kits"
              as: ProgramAdmin
          assert:
            - "exactly one kit of order ${o_id} is in a non-terminal status: ${k2_id} (status ORDERED)"
            - "ScreeningKit.${k1_id}.status == CONSUMED (compensated)"
            - "ScreeningOrder.${o_id}.active_kit_id == ${k2_id}"
            - "ScreeningOrder.${o_id}.recollection_round == 1"

      - name: exclusion_conserves_measure_denominator
        grounds:
          - calculations.quality_measure_attribution
          - state_machines.MemberCohort.ELIGIBLE_to_EXCLUDED
        distinguishing_aspect: |
          Conserved quantity: attributed_count + excluded_count == total
          cohort rows ever created for the program (denominator conservation).
          Excluding a cohort member (forward) and the compensating
          re-attribution rule leave numerator <= denominator invariant and
          attributed_count == population_size - excluded_count at all times;
          a different conserved quantity than the kit-count invariant.
        test_recipe:
          setup:
            - "Program G with 3 cohort members; member C3 excluded"
          setup_api_calls:
            - call: "POST /screening/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /screening/programs"
              payload: { program_code: "G-INV", program_name: "GI", outreach_mode: "PUSH", measure_year: 2026 }
              as: ProgramAdmin
              captures: { g_id: $.data.id }
            - call: "POST /screening/patients"
              payload: { external_ref: "p-inv-a", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { pa_id: $.data.id }
            - call: "POST /screening/patients"
              payload: { external_ref: "p-inv-b", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { pb_id: $.data.id }
            - call: "POST /screening/patients"
              payload: { external_ref: "p-inv-c", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /screening/programs/${g_id}/cohorts"
              payload: { patient_id: "${pa_id}" }
              as: ProgramAdmin
            - call: "POST /screening/programs/${g_id}/cohorts"
              payload: { patient_id: "${pb_id}" }
              as: ProgramAdmin
            - call: "POST /screening/programs/${g_id}/cohorts"
              payload: { patient_id: "${pc_id}" }
              as: ProgramAdmin
              captures: { c3_id: $.data.id }
            - call: "POST /screening/programs/${g_id}/cohorts/${c3_id}/exclude"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "GET /screening/programs/${g_id}"
              as: ProgramAdmin
          assert:
            - "HealthPlanProgram.${g_id}.population_size == 3 (cohort rows ever created)"
            - "HealthPlanProgram.${g_id}.attributed_count == 2 (3 - 1 excluded; denominator conserved)"
            - "HealthPlanProgram.${g_id}.adherent_count == 0"
            - "MemberCohort.${c3_id}.attributed == false"
            - "MemberCohort.${c3_id}.status == EXCLUDED"
