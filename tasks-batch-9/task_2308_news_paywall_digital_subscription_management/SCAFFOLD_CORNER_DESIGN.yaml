              payload: { name: "Campus Domain", bundle_type: "INSTITUTIONAL_SEAT", intro_price_cents: 5000, intro_cycles: 1, standard_price_cents: 5000, standard_from_cycle: 2, cycle_days: 30, per_seat_price_cents: 400 }
              as: RevenueManager
              captures: { plan_dm: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_dm}/activate"
