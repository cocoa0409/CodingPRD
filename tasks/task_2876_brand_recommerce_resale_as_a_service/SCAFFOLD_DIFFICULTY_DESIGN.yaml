  - rule_id: priority_pair_validation_conflict
    instances:
      - name: campaign_category_overlap_outranks_channel_capacity_exhaustion
        grounds:
          - validations[priority=67]
          - validations[priority=68]
          - errors[ERR_CAMPAIGN_CATEGORY_OVERLAP]
          - errors[ERR_CAMPAIGN_CAPACITY_EXCEEDED]
          - global_constants.MAX_CONCURRENT_CAMPAIGNS_PER_CHANNEL
        distinguishing_aspect: |
          Pairs a temporal rule (priority 67, per-category window overlap) against an aggregate
          rule (priority 68, at most MAX_CONCURRENT_CAMPAIGNS_PER_CHANNEL overlapping campaigns
          per channel) — two different error categories. A single request violates both and must
          surface only the temporal error; a sibling request that violates the aggregate rule
          alone proves the lower-priority rule is genuinely live and not dead code.
        test_recipe:
          setup:
            - "One ACTIVE RESALE_MARKETPLACE channel."
            - "Campaign C1 on that channel for FOOTWEAR over [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z), left in SCHEDULED."
            - "Campaign C2 on the same channel for OUTERWEAR over [2026-08-15T00:00:00Z, 2026-09-15T00:00:00Z), left in SCHEDULED."
            - "MAX_CONCURRENT_CAMPAIGNS_PER_CHANNEL is 2, so the channel is already at aggregate capacity for any window overlapping both C1 and C2."
          setup_api_calls:
            - call: "POST /recommerce/channels"
              payload: { code: "RESALE-MP", channel_type: "RESALE_MARKETPLACE", allowed_assortment: "RESALE_ONLY", max_resale_price_ratio_bp: 7000, region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { chan_id: "$.data.id" }
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_id}", product_category: "FOOTWEAR", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-09-01T00:00:00Z", cadence_days: 7, step_bp: 1500, floor_pct_bp: 6000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { c1_id: "$.data.id", c1_status: "$.data.status" }
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_id}", product_category: "OUTERWEAR", window_start_at: "2026-08-15T00:00:00Z", window_end_at: "2026-09-15T00:00:00Z", cadence_days: 7, step_bp: 1500, floor_pct_bp: 6000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { c2_id: "$.data.id" }
          trigger:
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_id}", product_category: "FOOTWEAR", window_start_at: "2026-08-15T00:00:00Z", window_end_at: "2026-08-20T00:00:00Z", cadence_days: 7, step_bp: 1000, floor_pct_bp: 7000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { both_err: "$.data.error_id" }
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_id}", product_category: "BAG", window_start_at: "2026-08-20T00:00:00Z", window_end_at: "2026-08-25T00:00:00Z", cadence_days: 7, step_bp: 1000, floor_pct_bp: 7000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { agg_only_err: "$.data.error_id" }
            - call: "POST /recommerce/markdown-campaigns"
              payload: { channel_id: "${chan_id}", product_category: "FOOTWEAR", window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-10-01T00:00:00Z", cadence_days: 7, step_bp: 1000, floor_pct_bp: 7000 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { c3_id: "$.data.id", c3_status: "$.data.status" }
          assert:
            - "${c1_status} == SCHEDULED  # SCHEDULED campaigns already count for both rules"
            - "${both_err} == ERR_CAMPAIGN_CATEGORY_OVERLAP  # HTTP 409; violates 67 (overlaps C1 on FOOTWEAR) AND 68 (overlaps C1 and C2 = capacity 2), priority 67 wins"
            - "${agg_only_err} == ERR_CAMPAIGN_CAPACITY_EXCEEDED  # HTTP 409; BAG has no category peer, so only the aggregate rule fires"
            - "${c3_status} == SCHEDULED  # HTTP 201: [2026-09-01, 2026-10-01) does not overlap C1's half-open [2026-08-01, 2026-09-01), so only C2 overlaps and capacity is 1 < 2"
            - "GET /recommerce/channels/${chan_id}/markdown-campaigns returns exactly 3 rows (C1, C2, C3); neither rejected request created a row"

      - name: segregation_of_duties_outranks_refurb_viability_threshold
        grounds:
          - validations[priority=55]
          - validations[priority=73]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_REFURB_NOT_VIABLE]
          - calculations.refurb_viability_ratio
        distinguishing_aspect: |
          A different error-category pair from the campaign instance: segregation_of_duties
          (priority 55, an identity rule on X-User-ID) against threshold (priority 73, the
          viability cap). One qc-decision request violates both — the same technician who
          performed the work is deciding QC, and the order is over its refurbishment budget —
