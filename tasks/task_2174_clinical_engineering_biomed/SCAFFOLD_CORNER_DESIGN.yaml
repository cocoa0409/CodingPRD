          - "entities.WorkOrder.fields.sla_met"
        distinguishing_aspect: "Two IN_REPAIR segments of 2.5 h and 1.25 h separated by a 21.5 h parts hold sum to active_repair_hours 3.75 while turnaround_hours is 28.00, so a P1 order with sla_hours 4 records sla_met true even though wall-clock turnaround is seven times the SLA."
