# =============================================================================
# PRD Benchmark Seed Tables
# Task 3412 — Contract Furniture Dealer Network, Configuration & Installation
# =============================================================================

scenario: |
  Contract Furniture Dealer Network, Configuration & Installation (Steelcase): authorized dealer network with territory considerations, showroom requirements and service capability standards, specification and configuration of workstation systems with part-level bills of material generated from layout drawings, order entry validation against configuration rules and lead times differing by product family and fabric, project pricing with volume discount agreements negotiated directly with large end users but transacted through dealers, manufacturing scheduling against project installation dates with sequencing by floor and phase, delivery and installation coordination in occupied buildings with union labor and building access rules, punch list and warranty service through dealers with manufacturer parts support, product line transitions with continued parts availability for installed systems

domain_name: contract-furniture-dealer-network
api_prefix: "/"

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: graph_constraint        # part-level BOM expansion + floor/phase ordering DAG
  secondary_archetype: pricing_engine        # volume-agreement tiered pricing transacted through dealers
  complexity_layers:
    - optimistic_concurrency                 # OCC on ConfigurationSpec.version and ProjectOrder.version
    - cascading_side_effects                 # order-cancel cascade; dealer-suspension cascade; complete bubble-up
    - dual_variant_calculation               # provisional vs final pricing; calendar vs business-day punch age
    - rate_threshold_triggers                # volume tier thresholds; plant daily capacity; zone crew capacity
  entity_topology: flat                      # peer entities joined by foreign keys; flat URL space
  state_machine_shape: cyclic                # ConfigurationSpec LOCKED->DRAFT revision loop and ProjectOrder
                                             # SUBMITTED<->ON_HOLD hold/release loop; InstallationPhase keeps two
                                             # status dimensions driven by shared triggers; ProjectOrder branches
                                             # with state-dependent cancel compensation
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: peer_roles                     # DealerRep and EndUserRep own disjoint slices; ManufacturerAdmin operates the network
  consistency_model: immediate               # every mutation is visible in the mutating response and subsequent reads

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Logical Clock Convention
# =============================================================================
logical_clock:
  description: |
    All date arithmetic in this domain (lead times, production notice, transit
    windows, lifecycle last-order dates, warranty windows, parts-support
    horizons, punch escalation) reads a logical clock, never the wall clock.
    Before any POST /_clock/set_current_utc call, the logical clock reads
    exactly 2026-09-01T00:00:00Z. Date-only fields compare against the UTC
    calendar date of the logical clock.
  default_utc: "2026-09-01T00:00:00Z"

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dealer company name" }
      - { name: territory_codes, type: array, source: input, description: "Non-empty array of territory codes the dealer is authorized to sell into (e.g. [\"MI\",\"OH\"])", constraints: "min length 1; each a 2-letter uppercase code" }
      - { name: service_capability_level, type: integer, source: input, description: "Certified service capability level, 1 (basic) to 5 (full systems installer)", constraints: "1..5" }
      - { name: showroom_compliant, type: boolean, source: input, default: true, description: "Whether the dealer's showroom currently meets manufacturer standards; setting true->false auto-suspends the dealer" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED; a suspended dealer cannot submit orders and its SUBMITTED orders move to ON_HOLD", constraints: "ACTIVE | SUSPENDED" }
      - { name: suspended_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the most recent suspension; null while ACTIVE" }

  - name: EndUser
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Large corporate end user name" }
      - { name: industry, type: string, source: input, description: "Industry label (free text, e.g. 'healthcare')" }

  - name: VolumeAgreement
    parent: null
    common_fields: true
    fields:
      - { name: end_user_id, type: string, source: input, description: "FK -> EndUser.id; the end user this pricing agreement was negotiated with" }
      - { name: effective_start, type: string, source: input, description: "ISO date (YYYY-MM-DD) the agreement becomes usable" }
      - { name: effective_end, type: string, source: input, description: "ISO date the agreement stops being usable; must be strictly after effective_start" }
      - { name: tier1_discount_pct, type: number, source: input, description: "Discount fraction applied at tier 1 (e.g. 0.10)", constraints: "0 <= x < 1" }
      - { name: tier2_discount_pct, type: number, source: input, description: "Discount fraction applied at tier 2 (e.g. 0.15)", constraints: "0 <= x < 1" }
      - { name: tier3_discount_pct, type: number, source: input, description: "Discount fraction applied at tier 3 (e.g. 0.20)", constraints: "0 <= x < 1" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | EXPIRED; ACTIVE->EXPIRED is applied by the system when the logical clock passes effective_end (evaluated on any read or write of the agreement)", constraints: "DRAFT | ACTIVE | EXPIRED" }
      - { name: cumulative_volume_cents, type: integer, source: computed, default: 0, description: "Sum of pre_discount_total_cents over this agreement's ProjectOrders whose status is ACKNOWLEDGED or CLOSED (i.e. acknowledged and not cancelled)" }
      - { name: current_tier, type: integer, source: computed, default: 1, description: "Tier derived from cumulative_volume_cents: 1 if < 25000000, 2 if >= 25000000 and < 75000000, 3 if >= 75000000" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when the agreement moved DRAFT->ACTIVE" }

  - name: ProductFamily
    parent: null
    common_fields: true
    fields:
      - { name: family_code, type: string, source: input, description: "Unique catalog code for the product family (e.g. SYS-7500)", constraints: "unique across ProductFamily" }
      - { name: name, type: string, source: input, description: "Human-readable family name" }
      - { name: category, type: enum, source: input, description: "SYSTEMS | SEATING | STORAGE; at most one family row per category (the row represents that category's current generation)", constraints: "SYSTEMS | SEATING | STORAGE; unique per category" }
      - { name: base_lead_time_days, type: integer, source: input, description: "Base manufacturing lead time in calendar days for this family, before fabric delta", constraints: "1..365" }
      - { name: lifecycle_status, type: enum, source: system, default: CURRENT, description: "CURRENT | SUNSETTING | DISCONTINUED; forward-only", constraints: "CURRENT | SUNSETTING | DISCONTINUED" }
      - { name: last_order_date, type: string, source: input, default: null, description: "ISO date; required when transitioning CURRENT->SUNSETTING; configurations referencing this family may lock only while clock date <= last_order_date" }
      - { name: discontinued_at, type: string, source: system, default: null, description: "ISO date the family moved SUNSETTING->DISCONTINUED" }
      - { name: parts_support_until, type: string, source: input, default: null, description: "ISO date; required when transitioning SUNSETTING->DISCONTINUED; must be >= discontinue date + 2557 days (7-year parts horizon); PARTS warranty claims for this family's parts are rejected after this date" }

  - name: ConfigurationSpec
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id; set from the acting DealerRep's X-User-ID at creation" }
      - { name: name, type: string, source: input, description: "Configuration name (e.g. the layout drawing reference)" }
      - { name: modules, type: array, source: input, description: "Non-empty array of module entries {module_type, fabric_grade, qty}; module_type in WORKSTATION_6X6 | WORKSTATION_8X8 | PRIVATE_OFFICE | STORAGE_WALL | TASK_CHAIR_SET; fabric_grade in A | B | C | COM and is required for SYSTEMS/SEATING modules and must be null for STORAGE modules; qty integer >= 1", constraints: "min length 1" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | LOCKED; revise loops LOCKED->DRAFT", constraints: "DRAFT | LOCKED" }
      - { name: revision_number, type: integer, source: system, default: 1, description: "Starts at 1; increments by 1 on every revise (LOCKED->DRAFT)" }
      - { name: total_units, type: integer, source: computed, description: "Sum of qty over modules[]; computed at lock" }
      - { name: list_total_cents, type: integer, source: computed, description: "parts_total_cents from bom_expansion over modules[]; computed at lock" }
      - { name: max_lead_time_days, type: integer, source: computed, description: "configuration_lead_time result: max over modules of (family base_lead_time_days + fabric delta) + queue days tier of total_units; computed at lock" }
      - { name: locked_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of last DRAFT->LOCKED" }

  - name: ProjectOrder
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id; set from the acting DealerRep's X-User-ID at creation" }
      - { name: volume_agreement_id, type: string, source: input, description: "FK -> VolumeAgreement.id; pricing agreement this order transacts under" }
      - { name: configuration_id, type: string, source: input, description: "FK -> ConfigurationSpec.id; the locked configuration being ordered" }
      - { name: configuration_revision, type: integer, source: system, default: null, description: "ConfigurationSpec.revision_number pinned at submit time (version-pinning on approval)" }
      - { name: territory_code, type: string, source: input, description: "Territory the project installs in; the dealer must be authorized for it" }
      - { name: requested_install_date, type: string, source: input, description: "ISO date the end user wants installation to begin" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | ON_HOLD | ACKNOWLEDGED | CLOSED | CANCELLED", constraints: "DRAFT | SUBMITTED | ON_HOLD | ACKNOWLEDGED | CLOSED | CANCELLED" }
      - { name: pre_discount_total_cents, type: integer, source: computed, default: null, description: "Sum of per-line rounded totals computed at submit from the configuration BOM and fabric upcharges" }
      - { name: provisional_tier, type: integer, source: computed, default: null, description: "Tier computed at submit from agreement.cumulative_volume_cents EXCLUDING this order" }
      - { name: provisional_total_cents, type: integer, source: computed, default: null, description: "pre_discount_total_cents x (1 - provisional tier discount), rounded half-up to whole cents" }
      - { name: final_tier, type: integer, source: computed, default: null, description: "Tier computed at acknowledge from agreement.cumulative_volume_cents + this order's pre_discount_total_cents" }
      - { name: final_total_cents, type: integer, source: computed, default: null, description: "pre_discount_total_cents x (1 - final tier discount), rounded half-up to whole cents" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of DRAFT->SUBMITTED" }
      - { name: acknowledged_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of SUBMITTED->ACKNOWLEDGED" }
      - { name: cancelled_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the cancel transition" }
      - { name: cancel_reason, type: string, source: input, default: null, description: "Optional free-text reason captured at cancel" }

  - name: InstallationPhase
    parent: null
    common_fields: true
    fields:
      - { name: project_order_id, type: string, source: system, description: "FK -> ProjectOrder.id; set from the path of POST /project-orders/{orderId}/phases" }
      - { name: floor_number, type: integer, source: input, description: "Building floor this phase installs on", constraints: ">= 1" }
      - { name: phase_sequence, type: integer, source: input, description: "Sequence number within the order; unique per (project_order_id, phase_sequence)", constraints: ">= 1; unique per order" }
      - { name: building_zone_id, type: string, source: input, description: "Building zone code whose freight elevator and crew pool this phase uses (e.g. Z1)" }
      - { name: planned_units, type: integer, source: input, description: "Units this phase manufactures and installs; debits plant daily capacity while reserved", constraints: ">= 1" }
      - { name: logistics_status, type: enum, source: system, default: PLANNED, description: "PLANNED | SCHEDULED | DELIVERED | CANCELLED; independent dimension 1", constraints: "PLANNED | SCHEDULED | DELIVERED | CANCELLED" }
      - { name: install_status, type: enum, source: system, default: NOT_STARTED, description: "NOT_STARTED | IN_PROGRESS | COMPLETE | CANCELLED; independent dimension 2", constraints: "NOT_STARTED | IN_PROGRESS | COMPLETE | CANCELLED" }
      - { name: plant_code, type: enum, source: input, default: null, description: "PLANT_GR | PLANT_DAL; set by reserve-slot", constraints: "PLANT_GR | PLANT_DAL" }
      - { name: production_date, type: string, source: input, default: null, description: "ISO date the phase is scheduled for manufacture; set by reserve-slot" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of SCHEDULED->DELIVERED" }
      - { name: install_started_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of NOT_STARTED->IN_PROGRESS" }
      - { name: actual_install_complete_date, type: string, source: system, default: null, description: "ISO date (logical clock) recorded when install_status becomes COMPLETE; basis for warranty windows" }

  - name: InstallWindow
    parent: null
    common_fields: true
    fields:
      - { name: installation_phase_id, type: string, source: input, description: "FK -> InstallationPhase.id; the phase this window serves" }
      - { name: building_zone_id, type: string, source: computed, description: "Inherited from the phase's building_zone_id at creation" }
      - { name: start_at, type: datetime, source: input, description: "ISO datetime window start (freight elevator occupied from this instant, inclusive)" }
      - { name: end_at, type: datetime, source: input, description: "ISO datetime window end (exclusive); must be strictly after start_at" }
      - { name: union_required, type: boolean, source: input, description: "Whether the building requires union labor for this window" }
      - { name: elevator_required, type: boolean, source: input, description: "Whether this window occupies the zone's freight elevator; false means the phase delivers via loading dock/stairs and the window never participates in elevator conflicts" }
      - { name: crew_size, type: integer, source: input, description: "Installers booked; must be >= 4 when union_required is true", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: RESERVED, description: "RESERVED | CANCELLED", constraints: "RESERVED | CANCELLED" }

  - name: PunchTicket
    parent: null
    common_fields: true
    fields:
      - { name: installation_phase_id, type: string, source: input, description: "FK -> InstallationPhase.id; punch items are filed against a phase whose install is IN_PROGRESS" }
      - { name: severity, type: enum, source: input, description: "CRITICAL | MAJOR | MINOR", constraints: "CRITICAL | MAJOR | MINOR" }
      - { name: description, type: string, source: input, description: "Free-text defect description" }
      - { name: requires_part, type: boolean, source: input, default: false, description: "Whether resolution requires a manufacturer replacement part" }
      - { name: part_number, type: string, source: input, default: null, description: "Required iff requires_part is true; must be a catalog part number from MODULE_BOM_RULES" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | RESOLVED | VERIFIED | VOID; verify outcome REJECTED loops RESOLVED->OPEN", constraints: "OPEN | RESOLVED | VERIFIED | VOID" }
      - { name: resolution_note, type: string, source: input, default: null, description: "Dealer note captured at resolve" }
      - { name: escalated, type: boolean, source: computed, default: false, description: "True while status == OPEN and at least 5 business days (Mon-Fri, no holiday calendar) have elapsed strictly after the creation calendar date, per punch_escalation_age BUSINESS variant" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: project_order_id, type: string, source: input, description: "FK -> ProjectOrder.id; the order the claimed product was installed under" }
      - { name: installation_phase_id, type: string, source: input, description: "FK -> InstallationPhase.id; must be a phase of project_order_id whose install_status is COMPLETE" }
      - { name: punch_ticket_id, type: string, source: system, default: null, description: "FK -> PunchTicket.id; set only when the claim was auto-created by a punch resolve with requires_part=true; null for dealer-filed claims" }
      - { name: claim_type, type: enum, source: input, description: "PARTS | LABOR", constraints: "PARTS | LABOR" }
      - { name: part_number, type: string, source: input, default: null, description: "Required iff claim_type is PARTS; must be a catalog part number from MODULE_BOM_RULES" }
      - { name: description, type: string, source: input, description: "Free-text failure description" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | APPROVED | DENIED; APPROVED and DENIED are both terminal", constraints: "SUBMITTED | APPROVED | DENIED" }
      - { name: filed_date, type: string, source: system, description: "ISO date (logical clock) the claim was filed" }
      - { name: review_note, type: string, source: input, default: null, description: "Manufacturer note captured at review" }
      - { name: reviewed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the review" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Dealer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /dealers/{dealerId} with status=SUSPENDED, or PATCH setting showroom_compliant from true to false (system auto-suspends)"
        actor: ManufacturerAdmin | system
        preconditions:
          - "dealer.status == ACTIVE"
        side_effects:
          - "dealer.suspended_at := logical clock"
          - "CASCADE link 1: every ProjectOrder of this dealer with status == SUBMITTED transitions to ON_HOLD (order.version increments on each)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /dealers/{dealerId} with status=ACTIVE"
        actor: ManufacturerAdmin
        preconditions:
          - "dealer.status == SUSPENDED"
          - "dealer.showroom_compliant == true (after applying any showroom_compliant change in the same PATCH)"
        side_effects:
          - "dealer.suspended_at := null"
          - "CASCADE link 1: every ProjectOrder of this dealer with status == ON_HOLD transitions back to SUBMITTED (order.version increments on each)"

  - entity: VolumeAgreement
    initial_state: DRAFT
    terminal_states: [EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /volume-agreements/{agreementId}/activate"
        actor: ManufacturerAdmin
        preconditions:
          - "agreement.status == DRAFT"
          - "logical clock date <= agreement.effective_end"
        side_effects:
          - "agreement.activated_at := logical clock"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (applied lazily: any read or write of the agreement first checks logical clock date > effective_end)"
        actor: system
        preconditions:
          - "agreement.status == ACTIVE"
          - "logical clock date > agreement.effective_end"
        side_effects: []

  - entity: ProductFamily
    initial_state: CURRENT
    terminal_states: [DISCONTINUED]
    transitions:
      - from: CURRENT
        to: SUNSETTING
        trigger: "PATCH /product-families/{familyId} with lifecycle_status=SUNSETTING"
        actor: ManufacturerAdmin
        preconditions:
          - "family.lifecycle_status == CURRENT"
          - "payload carries last_order_date and last_order_date >= logical clock date"
        side_effects:
          - "family.last_order_date := payload.last_order_date"
      - from: SUNSETTING
        to: DISCONTINUED
        trigger: "PATCH /product-families/{familyId} with lifecycle_status=DISCONTINUED"
        actor: ManufacturerAdmin
        preconditions:
          - "family.lifecycle_status == SUNSETTING"
          - "payload carries parts_support_until and parts_support_until >= logical clock date + 2557 days"
        side_effects:
          - "family.discontinued_at := logical clock date"
          - "family.parts_support_until := payload.parts_support_until"

  - entity: ConfigurationSpec
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /configurations/{configurationId}/lock (OCC: expected_configuration_version)"
        actor: DealerRep (owner)
        preconditions:
          - "spec.status == DRAFT"
          - "expected_configuration_version == spec.version"
          - "every module entry references a known module_type and its family's category row exists"
          - "fabric_grade present for SYSTEMS/SEATING modules and null for STORAGE modules"
          - "for every referenced family: lifecycle_status == CURRENT, or (lifecycle_status == SUNSETTING and logical clock date <= family.last_order_date)"
        side_effects:
          - "compute and cache total_units, list_total_cents (bom_expansion), max_lead_time_days (configuration_lead_time)"
          - "spec.locked_at := logical clock; spec.version += 1"
      - from: LOCKED
        to: DRAFT
        trigger: "POST /configurations/{configurationId}/revise"
        actor: DealerRep (owner)
        preconditions:
          - "spec.status == LOCKED"
        side_effects:
          - "spec.revision_number += 1; spec.version += 1"
          - "orders already submitted keep their pinned configuration_revision (no retroactive change)"

  - entity: ProjectOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /project-orders/{orderId}/submit (OCC: expected_order_version)"
        actor: DealerRep (owner)
        preconditions:
          - "order.status == DRAFT"
          - "expected_order_version == order.version"
          - "dealer.status == ACTIVE"
          - "referenced spec.status == LOCKED"
          - "order.territory_code is in dealer.territory_codes"
          - "dealer.service_capability_level >= CAPABILITY_REQUIRED[category] for every module category in the spec (SYSTEMS:3, SEATING:1, STORAGE:2)"
          - "referenced agreement.status == ACTIVE and effective_start <= logical clock date <= effective_end"
          - "requested_install_date >= logical clock date + spec.max_lead_time_days"
        side_effects:
          - "compute pre_discount_total_cents, provisional_tier, provisional_total_cents per order_pricing PROVISIONAL variant and cache on the order"
          - "order.configuration_revision := spec.revision_number"
          - "order.submitted_at := logical clock; order.version += 1"
      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /project-orders/{orderId}/acknowledge"
        actor: ManufacturerAdmin
        preconditions:
          - "order.status == SUBMITTED"
        side_effects:
          - "compute final_tier and final_total_cents per order_pricing FINAL variant and cache on the order"
          - "CASCADE link 1 (ledger): agreement.cumulative_volume_cents += order.pre_discount_total_cents; agreement.current_tier recomputed"
          - "order.acknowledged_at := logical clock; order.version += 1"
      - from: SUBMITTED
        to: ON_HOLD
        trigger: "system (cascade from Dealer ACTIVE->SUSPENDED)"
        actor: system
        preconditions:
          - "order.status == SUBMITTED"
          - "order.dealer transitioned to SUSPENDED"
        side_effects:
          - "order.version += 1"
      - from: ON_HOLD
        to: SUBMITTED
        trigger: "system (cascade from Dealer SUSPENDED->ACTIVE)"
        actor: system
        preconditions:
          - "order.status == ON_HOLD"
          - "order.dealer transitioned to ACTIVE"
        side_effects:
          - "order.version += 1"
      - from: ACKNOWLEDGED
        to: CLOSED
        trigger: "system (bubble-up: evaluated after any phase of this order reaches install_status COMPLETE)"
        actor: system
        preconditions:
          - "order.status == ACKNOWLEDGED"
          - "the order has at least 1 phase"
          - "every phase of the order has install_status == COMPLETE"
        side_effects:
          - "order.version += 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /project-orders/{orderId}/cancel"
        actor: DealerRep (owner) | ManufacturerAdmin
        preconditions:
          - "order.status == DRAFT"
        side_effects:
          - "order.cancelled_at := logical clock; order.cancel_reason := payload.reason; order.version += 1"
      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /project-orders/{orderId}/cancel"
        actor: DealerRep (owner) | ManufacturerAdmin
        preconditions:
          - "order.status == SUBMITTED"
        side_effects:
          - "order.cancelled_at := logical clock; order.cancel_reason := payload.reason; order.version += 1"
          - "CASCADE link 1: every phase of this order with logistics_status not CANCELLED and install_status not COMPLETE is cancelled per the InstallationPhase cancel rules (which itself cascades to InstallWindows and PunchTickets)"
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /project-orders/{orderId}/cancel"
        actor: DealerRep (owner) | ManufacturerAdmin
        preconditions:
          - "order.status == ON_HOLD"
        side_effects:
          - "order.cancelled_at := logical clock; order.cancel_reason := payload.reason; order.version += 1"
          - "CASCADE link 1: same phase cancellation cascade as SUBMITTED->CANCELLED"
      - from: ACKNOWLEDGED
        to: CANCELLED
        trigger: "POST /project-orders/{orderId}/cancel"
        actor: DealerRep (owner) | ManufacturerAdmin
        preconditions:
          - "order.status == ACKNOWLEDGED"
        side_effects:
          - "order.cancelled_at := logical clock; order.cancel_reason := payload.reason; order.version += 1"
          - "COMPENSATION: agreement.cumulative_volume_cents -= order.pre_discount_total_cents; agreement.current_tier recomputed"
          - "CASCADE link 1: same phase cancellation cascade as SUBMITTED->CANCELLED"

  - entity: InstallationPhase
    dimension: logistics_status
    initial_state: PLANNED
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /phases/{phaseId}/reserve-slot"
        actor: DealerRep (owner of the phase's order)
        preconditions:
          - "phase.logistics_status == PLANNED"
          - "phase.install_status == NOT_STARTED"
          - "phase's order.status == ACKNOWLEDGED"
          - "every module family of the order's spec is not DISCONTINUED"
          - "production_date >= logical clock date + 2 days"
          - "production_date <= order.requested_install_date - TRANSIT_DAYS[plant_code] (PLANT_GR:4, PLANT_DAL:6)"
          - "plant_capacity_available(plant_code, production_date) >= phase.planned_units"
        side_effects:
          - "phase.plant_code := payload.plant_code; phase.production_date := payload.production_date"
          - "phase.version += 1"
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /phases/{phaseId}/start-install (goods are delivered and install begins in one dealer action)"
        actor: DealerRep (owner)
        preconditions:
          - "phase.logistics_status == SCHEDULED"
          - "logical clock date >= phase.production_date (goods exist before they ship)"
        side_effects:
          - "phase.delivered_at := logical clock; phase.version += 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "system (cascade from order cancel)"
        actor: system
        preconditions:
          - "phase.install_status != COMPLETE"
        side_effects:
          - "phase.install_status := CANCELLED; phase.version += 1"
          - "CASCADE link 2a: every InstallWindow of this phase with status RESERVED transitions to CANCELLED (frees elevator interval and crew capacity)"
          - "CASCADE link 2b: every PunchTicket of this phase with status OPEN or RESOLVED transitions to VOID (VERIFIED tickets are historical and stay)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from order cancel)"
        actor: system
        preconditions:
          - "phase.install_status != COMPLETE"
        side_effects:
          - "phase.install_status := CANCELLED; phase.version += 1"
          - "CASCADE link 2c: the plant-day reservation is released: plant_capacity_available(plant_code, production_date) rises by phase.planned_units, so a previously rejected reserve-slot for that plant/day may now succeed (link 3 of the order-cancel cascade)"
          - "CASCADE link 2a/2b: windows CANCELLED and punches VOIDED as in PLANNED->CANCELLED"
      - from: DELIVERED
        to: CANCELLED
        trigger: "system (cascade from order cancel)"
        actor: system
        preconditions:
          - "phase.install_status != COMPLETE"
        side_effects:
          - "phase.install_status := CANCELLED; phase.version += 1"
          - "CASCADE link 2c: plant-day reservation released as in SCHEDULED->CANCELLED"
          - "CASCADE link 2a/2b: windows CANCELLED and punches VOIDED as in PLANNED->CANCELLED"

  - entity: InstallationPhase
    dimension: install_status
    initial_state: NOT_STARTED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "POST /phases/{phaseId}/start-install (drives logistics_status SCHEDULED->DELIVERED and install_status NOT_STARTED->IN_PROGRESS in one action)"
        actor: DealerRep (owner)
        preconditions:
          - "phase.install_status == NOT_STARTED"
          - "phase.logistics_status == SCHEDULED"
          - "logical clock date >= phase.production_date"
        side_effects:
          - "phase.install_started_at := logical clock; phase.version += 1"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /phases/{phaseId}/complete"
        actor: DealerRep (owner)
        preconditions:
          - "phase.install_status == IN_PROGRESS"
          - "every other phase of the same order with (floor_number < this floor_number) or (floor_number == this floor_number and phase_sequence < this phase_sequence) has install_status == COMPLETE"
          - "count of this phase's PunchTickets with severity CRITICAL and status in {OPEN, RESOLVED} == 0"
          - "count of this phase's PunchTickets with severity MAJOR and status == OPEN == 0"
        side_effects:
          - "phase.actual_install_complete_date := logical clock date; phase.version += 1"
          - "BUBBLE-UP: if every phase of the order is COMPLETE and the order is ACKNOWLEDGED, the order transitions ACKNOWLEDGED->CLOSED"

  - entity: InstallWindow
    initial_state: RESERVED
    terminal_states: [CANCELLED]
    transitions:
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /install-windows/{windowId}/cancel or system cascade from phase cancellation"
        actor: DealerRep (owner) | system
        preconditions:
          - "window.status == RESERVED"
        side_effects:
          - "window.version += 1; the elevator interval (with its 15-minute buffers) and the crew_size capacity are freed for the zone/date"

  - entity: PunchTicket
    initial_state: OPEN
    terminal_states: [VERIFIED, VOID]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /punch-tickets/{ticketId}/resolve"
        actor: DealerRep (owner of the ticket's phase's order)
        preconditions:
          - "ticket.status == OPEN"
        side_effects:
          - "ticket.resolution_note := payload.resolution_note; ticket.version += 1"
          - "CASCADE link 1: if ticket.requires_part is true, a WarrantyClaim is auto-created with status SUBMITTED, claim_type PARTS, part_number := ticket.part_number, punch_ticket_id := ticket.id, project_order_id and installation_phase_id copied from the ticket's phase, filed_date := logical clock date (link 2: this claim is then reviewable via POST /warranty-claims/{claimId}/review)"
      - from: RESOLVED
        to: VERIFIED
        trigger: "POST /punch-tickets/{ticketId}/verify with outcome=CONFIRMED"
        actor: "EndUserRep (owner: end user of the order's agreement)"
        preconditions:
          - "ticket.status == RESOLVED"
        side_effects:
          - "ticket.version += 1"
      - from: RESOLVED
        to: OPEN
        trigger: "POST /punch-tickets/{ticketId}/verify with outcome=REJECTED"
        actor: EndUserRep (owner)
        preconditions:
          - "ticket.status == RESOLVED"
        side_effects:
          - "ticket.version += 1"
      - from: OPEN
        to: VOID
        trigger: "system (cascade from phase cancellation)"
        actor: system
        preconditions: []
        side_effects:
          - "ticket.version += 1"
      - from: RESOLVED
        to: VOID
        trigger: "system (cascade from phase cancellation)"
        actor: system
        preconditions: []
        side_effects:
          - "ticket.version += 1"

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty-claims/{claimId}/review with decision=APPROVE"
        actor: ManufacturerAdmin
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "claim.review_note := payload.review_note; claim.reviewed_at := logical clock; claim.version += 1"
          - "manufacturer parts support is engaged: the approved replacement part ships to the servicing dealer (recorded via reviewed_at; no further state)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty-claims/{claimId}/review with decision=DENY"
        actor: ManufacturerAdmin
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "claim.review_note := payload.review_note; claim.reviewed_at := logical clock; claim.version += 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: order-submit-stale-version
    parent_entity: ProjectOrder
    write_endpoint: "POST /project-orders/{orderId}/submit"
    occ_field: "expected_order_version"
    description: |
      Submitting a ProjectOrder with an expected_order_version below the
      order's current version is rejected: the client's view of the order is
      stale (e.g. a dealer-suspension cascade or a prior submit has advanced
      the version since the client last read it). Stated as a stale-version
      check; two strictly sequential submissions suffice to observe it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: spec-lock-stale-version
    parent_entity: ConfigurationSpec
    write_endpoint: "POST /configurations/{configurationId}/lock"
    occ_field: "expected_configuration_version"
    description: |
      Locking a ConfigurationSpec with an expected_configuration_version below
      the spec's current version is rejected: the spec has been mutated (e.g.
      re-validated or revised) since the client last observed it, so the
      client's pricing/lead-time basis may no longer match the locked content.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: bom_expansion
    description: "Expand a configuration's module entries into a part-level bill of material"
    trigger: "GET /configurations/{configurationId}/bom (computed at read); also cached into list_total_cents at lock"
    algorithm: aggregation
    formula: |
      For each module entry m in modules[]:
        rule = MODULE_BOM_RULES[m.module_type]
        for each part p in rule.parts: line_qty[p.part_number] += p.qty_per_unit * m.qty
      Merge by part_number across ALL module entries (a part shared by two
      module types appears once with summed quantity).
      Sort lines by part_number ascending (lexicographic).
      extended_cents[line] = total_qty[line] * unit_list_price_cents[line]
      parts_total_cents = sum(extended_cents)   # exact integer arithmetic; no rounding anywhere in this calc
      total_units = sum(m.qty)
    input_set: "all module entries of the ConfigurationSpec, regardless of spec status"
    constants:
      MODULE_BOM_RULES: |
        WORKSTATION_6X6 (category SYSTEMS, fabric required): PN-FRM-66 x1 @ 41200; PN-PNL-FAB x2 @ 9600; PN-WRK-SRF x1 @ 15800; PN-PWR-PLR x1 @ 7400; PN-HDW-KIT x1 @ 2237  => per-unit parts 85837
        WORKSTATION_8X8 (category SYSTEMS, fabric required): PN-FRM-88 x1 @ 48900; PN-PNL-FAB x3 @ 9600; PN-WRK-SRF x1 @ 17400; PN-PWR-PLR x1 @ 7400; PN-HDW-KIT x1 @ 2237  => per-unit parts 104737
        PRIVATE_OFFICE (category SYSTEMS, fabric required): PN-FRM-PO x1 @ 92500; PN-PNL-FAB x4 @ 9600; PN-WRK-SRF x1 @ 21500; PN-DOOR x1 @ 18700; PN-PWR-PLR x1 @ 7400; PN-HDW-KIT x1 @ 2237  => per-unit parts 180737
        STORAGE_WALL (category STORAGE, fabric must be null): PN-CAB-TALL x1 @ 34200; PN-CAB-BASE x1 @ 22800; PN-SHLF x3 @ 3100  => per-unit parts 66300
        TASK_CHAIR_SET (category SEATING, fabric required): PN-CHR-TASK x4 @ 25000; PN-CHR-GUEST x2 @ 12500  => per-unit parts 125000
      MODULE_FAMILY_CATEGORY: "WORKSTATION_6X6: SYSTEMS; WORKSTATION_8X8: SYSTEMS; PRIVATE_OFFICE: SYSTEMS; STORAGE_WALL: STORAGE; TASK_CHAIR_SET: SEATING"
    precision: "whole cents; exact integer arithmetic"

  - name: configuration_lead_time
    description: "Lead time of a configuration from family base days, fabric deltas, and a unit-count queue tier"
    trigger: "POST /configurations/{id}/lock (cached into spec.max_lead_time_days); read at order submit"
    algorithm: threshold
    formula: |
      module_lead(m) = family(m).base_lead_time_days + FABRIC_LEAD_DELTA_DAYS[m.fabric_grade or 0 for STORAGE]
      queue_days(total_units) = 3 if total_units <= 49; 7 if 50 <= total_units <= 199; 12 if total_units >= 200
      max_lead_time_days = max over modules of module_lead(m) + queue_days(total_units)
      earliest_install_date(submit_clock_date) = submit_clock_date + max_lead_time_days
    input_set: "modules[] of the spec; the ProductFamily row per module category"
    constants:
      FABRIC_LEAD_DELTA_DAYS: "A: 0; B: 7; C: 14; COM: 21"
      QUEUE_DAYS_SMALL_MAX_UNITS: 49
      QUEUE_DAYS_SMALL: 3
      QUEUE_DAYS_MEDIUM_MAX_UNITS: 199
      QUEUE_DAYS_MEDIUM: 7
      QUEUE_DAYS_LARGE: 12
    precision: "whole calendar days; max() is over per-module sums; queue tier keys on total_units of the whole configuration"
    variants:
      - name: boundary_semantics
        when: "total_units exactly 49 -> 3 queue days; exactly 50 -> 7; exactly 199 -> 7; exactly 200 -> 12"
        difference: "tier membership uses <= on the upper bound of each tier"

  - name: order_pricing
    description: "Project pricing: BOM parts total, fabric upcharge per line, per-line rounding, tier discount from the volume agreement"
    trigger: "POST /project-orders/{id}/submit (PROVISIONAL variant) and POST /project-orders/{id}/acknowledge (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned (this resolves the circular-looking tier<->total dependency):
        1. unit_parts_cents(m) = sum of part qty_per_unit * unit_list_price_cents for module m (from bom_expansion constants)
        2. unit_price_exact(m) = unit_parts_cents(m) * (1 + FABRIC_UPCHARGE_PCT[m.fabric_grade or 0] / 100)   # keep exact, do NOT round unit prices
        3. line_total_cents(m) = round_half_up(unit_price_exact(m) * m.qty)   # ROUND PER MODULE ENTRY (per line), to whole cents
        4. pre_discount_total_cents = sum(line_total_cents over all module entries)   # sum AFTER per-line rounding; never sum-then-round
        5. tier_basis = (PROVISIONAL: agreement.cumulative_volume_cents) or (FINAL: agreement.cumulative_volume_cents + pre_discount_total_cents)
        6. tier = 1 if tier_basis < 25000000; 2 if 25000000 <= tier_basis < 75000000; 3 if tier_basis >= 75000000
        7. discount_pct = agreement.tier{tier}_discount_pct
        8. total_cents = round_half_up(pre_discount_total_cents * (1 - discount_pct))
      The tier discount is an average-rate (flat) discount over the whole
      pre-discount total, NOT a marginal per-tier rate.
    input_set: "modules[] of the order's pinned configuration; the order's VolumeAgreement"
    constants:
      FABRIC_UPCHARGE_PCT: "A: 0; B: 5; C: 12; COM: 18"
      TIER2_MIN_CENTS: 25000000
      TIER3_MIN_CENTS: 75000000
    precision: "whole cents; round_half_up applied exactly twice: once per module line (step 3), once on the discounted total (step 8)"
    variants:
      - name: PROVISIONAL
        when: "computed at submit; stored as provisional_tier / provisional_total_cents"
        difference: "tier basis EXCLUDES this order's pre-discount total (cumulative volume as it stands before this order)"
      - name: FINAL
        when: "computed at acknowledge; stored as final_tier / final_total_cents"
        difference: "tier basis INCLUDES this order's pre-discount total, so a single large order can tip itself into a higher tier"

  - name: plant_capacity_available
    description: "Remaining manufacturing capacity of one plant on one production date"
    trigger: "POST /phases/{id}/reserve-slot (validation); recomputed whenever a phase is scheduled or cancelled"
    algorithm: aggregation
    formula: |
      reserved(P, D) = sum(phase.planned_units) over InstallationPhases with
        plant_code == P and production_date == D and logistics_status in {SCHEDULED, DELIVERED}
      available(P, D) = PLANT_DAILY_CAPACITY[P] - reserved(P, D)
      Invariant: reserved(P, D) + available(P, D) == PLANT_DAILY_CAPACITY[P] at all times.
    input_set: "phases with logistics_status in {SCHEDULED, DELIVERED} only (PLANNED holds no reservation; CANCELLED released it)"
    constants:
      PLANT_DAILY_CAPACITY: "PLANT_GR: 120; PLANT_DAL: 80"
    precision: "whole units"

  - name: punch_escalation_age
    description: "Age of an OPEN punch ticket used for the escalated flag"
    trigger: "computed on read of any PunchTicket (GET /punch-tickets)"
    algorithm: chronological
    formula: |
      escalated = (ticket.status == OPEN) and (business_age_days >= 5)
      business_age_days(clock_date) = count of dates d with created_date < d <= clock_date and weekday(d) in {Mon..Fri}
    input_set: "the ticket's created date (from created_at) and the logical clock date"
    constants:
      ESCALATION_BUSINESS_DAYS: 5
    precision: "whole days; boundary is >= (exactly 5 business days escalates)"
    variants:
      - name: BUSINESS
        when: "authoritative for the escalated flag"
        difference: "counts Mon-Fri dates only"
      - name: CALENDAR
        when: "reporting/display only; never drives escalated"
        difference: "calendar_age_days = clock_date - created_date; for a Thursday creation, calendar age reaches 5 on the following Tuesday while business age is only 3"

  - name: warranty_eligibility
    description: "Whether a warranty claim may be filed against a completed phase"
    trigger: "POST /warranty-claims"
    algorithm: threshold
    formula: |
      parts_last_day = phase.actual_install_complete_date + 1826 days
      labor_last_day = phase.actual_install_complete_date + 366 days
      claim_type PARTS eligible iff filed_date <= parts_last_day, else ERR_WARRANTY_EXPIRED
      claim_type LABOR eligible iff filed_date <= labor_last_day, else ERR_WARRANTY_EXPIRED
      Additionally for PARTS: if the part's category family is DISCONTINUED, filed_date must be <= family.parts_support_until, else ERR_PARTS_SUPPORT_EXPIRED
    input_set: "the claim's phase actual_install_complete_date, the logical clock date, and (PARTS only) the part's family lifecycle"
    constants:
      PARTS_WARRANTY_DAYS: 1826
      LABOR_WARRANTY_DAYS: 366
      MIN_PARTS_SUPPORT_DAYS: 2557
    precision: "whole days; boundaries are inclusive (<=) on the last eligible day"

  - name: window_conflict_and_capacity
    description: "Freight-elevator exclusivity with turnover buffer, plus zone daily crew aggregate capacity"
    trigger: "POST /install-windows"
    algorithm: interval_merge
    formula: |
      Elevator rule (exclusive with buffer, per building_zone_id):
        applies only between windows whose elevator_required is true
        buffered_new = [start_at - 15 minutes, end_at + 15 minutes)
        conflict iff exists another RESERVED window w in the same zone with
          w.elevator_required == true and
          buffered_new.start < w.end_at and w.start_at < buffered_new.end   (half-open overlap against w's raw interval)
        => back-to-back is allowed only when new.start_at >= w.end_at + 15min; 14 minutes after w.end_at still conflicts.
      Crew rule (aggregate capacity, per zone per calendar date):
        considers ALL RESERVED windows in the zone regardless of elevator_required
        (dock deliveries still draw from the zone's installer pool):
        for every calendar date touched by the new window, sum the crew_size of
        RESERVED windows in that zone on that date whose raw intervals overlap
        the new raw interval (a overlaps b iff a.start_at < b.end_at and
        b.start_at < a.end_at), plus new.crew_size; reject iff total > 10.
        Non-overlapping windows on the same date do not sum.
    input_set: "RESERVED InstallWindows of the same building_zone_id (CANCELLED windows free both resources)"
    constants:
      FREIGHT_TURN_BUFFER_MIN: 15
      ZONE_MAX_CREW: 10
      UNION_MIN_CREW: 4
    precision: "minute resolution on intervals; strict inequality on overlap"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority; within one priority
# tier, checks evaluate in the order their rows appear here)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a known role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is in the endpoint's roles list", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "path identifiers resolve, left to right (dealer, agreement, family, configuration, order, phase, window, ticket, claim); body foreign keys resolve as well (end_user_id, volume_agreement_id, configuration_id, installation_phase_id, project_order_id) and a missing body FK yields the referenced resource's 404", error_id: ERR_DEALER_NOT_FOUND | ERR_END_USER_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_PRODUCT_FAMILY_NOT_FOUND | ERR_CONFIGURATION_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_PHASE_NOT_FOUND | ERR_WINDOW_NOT_FOUND | ERR_PUNCH_NOT_FOUND | ERR_CLAIM_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path parameters or body foreign keys" }
  - { priority: 4, category: auth, check: "ownership scope: DealerRep may only touch resources whose dealer_id == X-User-ID; EndUserRep may only touch resources of orders whose agreement's end_user_id == X-User-ID", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: "all DealerRep/EndUserRep endpoints acting on an existing scoped resource" }
  - { priority: 5, category: existence, check: "request body shape: required fields present (including conditionally required ones: part_number iff requires_part/claim_type PARTS), types valid, enum members valid, qty/planned_units/crew_size >= 1, modules non-empty, family_code and category unique, (order, phase_sequence) unique; unknown input fields are ignored (never stored, never an error), including client-supplied id/created_at/version", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all write endpoints" }
  - { priority: 6, category: existence, check: "field-level date windows: effective_end strictly after effective_start; end_at strictly after start_at; SUNSETTING requires last_order_date >= clock date; DISCONTINUED requires parts_support_until >= clock date + 2557 days", error_id: ERR_DATE_WINDOW_INVALID, http_status: 400, applies_to: "POST /volume-agreements, POST /install-windows, PATCH /product-families/{familyId}" }
  - { priority: 7, category: state, check: "OCC: expected_order_version == order.version (submit) and expected_configuration_version == spec.version (lock)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /project-orders/{orderId}/submit, POST /configurations/{configurationId}/lock" }
  - { priority: 8, category: state, check: "target entity is in the transition's required from-state (generic invalid transition, e.g. revise from DRAFT, start-install from PLANNED, verify an OPEN ticket, review a terminal claim, cancel a CLOSED order)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 9, category: state, check: "family lifecycle step is forward-only (CURRENT->SUNSETTING->DISCONTINUED; no skipping, no reverse)", error_id: ERR_INVALID_LIFECYCLE_TRANSITION, http_status: 409, applies_to: "PATCH /product-families/{familyId}" }
  - { priority: 10, category: state, check: "dealer.status == ACTIVE at order submit", error_id: ERR_DEALER_SUSPENDED, http_status: 409, applies_to: "POST /project-orders/{orderId}/submit" }
  - { priority: 11, category: state, check: "referenced spec.status == LOCKED at order submit", error_id: ERR_SPEC_NOT_LOCKED, http_status: 409, applies_to: "POST /project-orders/{orderId}/submit" }
  - { priority: 12, category: state, check: "phase's order.status == ACKNOWLEDGED at reserve-slot", error_id: ERR_ORDER_NOT_ACKNOWLEDGED, http_status: 409, applies_to: "POST /phases/{phaseId}/reserve-slot" }
  - { priority: 13, category: business_safety, check: "union_required window must book crew_size >= 4", error_id: ERR_UNION_CREW_MINIMUM, http_status: 422, applies_to: "POST /install-windows" }
  - { priority: 14, category: business_referential, check: "order.territory_code is in dealer.territory_codes", error_id: ERR_TERRITORY_NOT_AUTHORIZED, http_status: 422, applies_to: "POST /project-orders/{orderId}/submit" }
  - { priority: 15, category: business_referential, check: "dealer.service_capability_level >= CAPABILITY_REQUIRED[category] for every module category in the spec", error_id: ERR_CAPABILITY_INSUFFICIENT, http_status: 422, applies_to: "POST /project-orders/{orderId}/submit", constants: "CAPABILITY_REQUIRED: SYSTEMS 3, SEATING 1, STORAGE 2" }
  - { priority: 16, category: business_referential, check: "module fabric rules and known module types at lock (fabric present for SYSTEMS/SEATING, null for STORAGE)", error_id: ERR_INVALID_MODULE, http_status: 422, applies_to: "POST /configurations/{configurationId}/lock" }
  - { priority: 17, category: business_referential, check: "at spec lock and at reserve-slot, no referenced family is DISCONTINUED", error_id: ERR_PRODUCT_LINE_DISCONTINUED, http_status: 422, applies_to: "POST /configurations/{configurationId}/lock, POST /phases/{phaseId}/reserve-slot" }
  - { priority: 18, category: business_referential, check: "at spec lock, a SUNSETTING family is usable only while clock date <= family.last_order_date", error_id: ERR_LAST_ORDER_DATE_PASSED, http_status: 422, applies_to: "POST /configurations/{configurationId}/lock" }
  - { priority: 19, category: business_referential, check: "agreement.status == ACTIVE and effective_start <= clock date <= effective_end at order create and at order submit", error_id: ERR_AGREEMENT_NOT_ACTIVE, http_status: 422, applies_to: "POST /project-orders, POST /project-orders/{orderId}/submit" }
  - { priority: 20, category: business_temporal, check: "requested_install_date >= clock date + spec.max_lead_time_days at submit", error_id: ERR_LEAD_TIME_VIOLATION, http_status: 422, applies_to: "POST /project-orders/{orderId}/submit" }
  - { priority: 21, category: business_temporal, check: "production_date >= clock date + 2 days at reserve-slot", error_id: ERR_PRODUCTION_NOTICE_VIOLATION, http_status: 422, applies_to: "POST /phases/{phaseId}/reserve-slot" }
  - { priority: 22, category: business_temporal, check: "production_date <= order.requested_install_date - TRANSIT_DAYS[plant_code] at reserve-slot", error_id: ERR_TRANSIT_WINDOW_VIOLATION, http_status: 422, applies_to: "POST /phases/{phaseId}/reserve-slot", constants: "TRANSIT_DAYS: PLANT_GR 4, PLANT_DAL 6" }
  - { priority: 23, category: business_temporal, check: "freight-elevator exclusivity with 15-minute turnover buffer per zone (window_conflict_and_capacity elevator rule)", error_id: ERR_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /install-windows" }
  - { priority: 24, category: business_temporal, check: "floor/phase sequencing at complete: all earlier (floor_number, phase_sequence) phases of the order COMPLETE", error_id: ERR_FLOOR_SEQUENCE_VIOLATION, http_status: 422, applies_to: "POST /phases/{phaseId}/complete" }
  - { priority: 25, category: business_temporal, check: "punch gate at complete: zero CRITICAL punches in {OPEN, RESOLVED} and zero MAJOR punches in {OPEN}", error_id: ERR_OPEN_CRITICAL_PUNCH, http_status: 422, applies_to: "POST /phases/{phaseId}/complete" }
  - { priority: 26, category: business_temporal, check: "warranty window: PARTS filed within 1826 days and LABOR within 366 days of phase.actual_install_complete_date", error_id: ERR_WARRANTY_EXPIRED, http_status: 422, applies_to: "POST /warranty-claims" }
  - { priority: 27, category: business_temporal, check: "parts support: for PARTS claims whose part's family is DISCONTINUED, filed_date <= family.parts_support_until", error_id: ERR_PARTS_SUPPORT_EXPIRED, http_status: 422, applies_to: "POST /warranty-claims" }
  - { priority: 28, category: business_constraint, check: "plant_capacity_available(plant_code, production_date) >= phase.planned_units at reserve-slot", error_id: ERR_PLANT_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /phases/{phaseId}/reserve-slot" }
  - { priority: 29, category: business_constraint, check: "zone crew aggregate capacity <= 10 per zone per date over overlapping windows (window_conflict_and_capacity crew rule)", error_id: ERR_ZONE_CREW_CAPACITY, http_status: 422, applies_to: "POST /install-windows" }

# =============================================================================
# Table 5: API Endpoint Table (40 endpoints)
# =============================================================================
endpoints:
  # --- Dealers ---
  - { method: POST, path: "/dealers", description: "Create a Dealer (initial status ACTIVE)", roles: [ManufacturerAdmin], code: 201, input: [name, territory_codes, service_capability_level, "showroom_compliant?"], output: Dealer, side_effects: ["status=ACTIVE"] }
  - { method: PATCH, path: "/dealers/{dealerId}", description: "Update dealer capability/territory/showroom/status; showroom_compliant true->false auto-suspends and cascades orders to ON_HOLD; status=ACTIVE from SUSPENDED reinstates and cascades ON_HOLD orders back to SUBMITTED", roles: [ManufacturerAdmin], code: 200, input: ["service_capability_level?", "territory_codes?", "showroom_compliant?", "status?"], output: Dealer, side_effects: ["dealer status transitions per state machine", "cascade: SUBMITTED<->ON_HOLD on the dealer's orders", "increments Dealer.version by 1"] }

  # --- End users ---
  - { method: POST, path: "/end-users", description: "Create an EndUser", roles: [ManufacturerAdmin], code: 201, input: [name, industry], output: EndUser, side_effects: [] }

  # --- Volume agreements ---
  - { method: POST, path: "/volume-agreements", description: "Create a VolumeAgreement (DRAFT) negotiated with an end user", roles: [ManufacturerAdmin], code: 201, input: [end_user_id, effective_start, effective_end, tier1_discount_pct, tier2_discount_pct, tier3_discount_pct], output: VolumeAgreement, side_effects: ["cumulative_volume_cents=0, current_tier=1"] }
  - { method: GET, path: "/volume-agreements/{agreementId}", description: "Read one agreement including computed cumulative_volume_cents and current_tier (lazy EXPIRED applied first)", roles: [ManufacturerAdmin, EndUserRep], code: 200, input: [], output: VolumeAgreement, side_effects: [] }
  - { method: GET, path: "/volume-agreements", description: "List agreements; filterable by end_user_id and status (FK reverse reachability for VolumeAgreement.end_user_id)", roles: [ManufacturerAdmin, EndUserRep], code: 200, input: ["end_user_id?", "status?", "limit?", "offset?"], output: "VolumeAgreement[]", side_effects: [] }
  - { method: POST, path: "/volume-agreements/{agreementId}/activate", description: "Activate a DRAFT agreement", roles: [ManufacturerAdmin], code: 200, input: [], output: VolumeAgreement, side_effects: ["status DRAFT->ACTIVE", "activated_at set", "increments VolumeAgreement.version by 1"] }

  # --- Product families ---
  - { method: POST, path: "/product-families", description: "Create a ProductFamily (lifecycle CURRENT)", roles: [ManufacturerAdmin], code: 201, input: [family_code, name, category, base_lead_time_days], output: ProductFamily, side_effects: ["lifecycle_status=CURRENT"] }
  - { method: PATCH, path: "/product-families/{familyId}", description: "Advance lifecycle: CURRENT->SUNSETTING (requires last_order_date) or SUNSETTING->DISCONTINUED (requires parts_support_until >= clock date + 2557 days)", roles: [ManufacturerAdmin], code: 200, input: [lifecycle_status, "last_order_date?", "parts_support_until?"], output: ProductFamily, side_effects: ["lifecycle transition per state machine", "increments ProductFamily.version by 1"] }

  # --- Configurations ---
  - { method: POST, path: "/configurations", description: "Create a ConfigurationSpec (DRAFT) owned by the acting dealer", roles: [DealerRep], code: 201, input: [name, modules], output: ConfigurationSpec, side_effects: ["dealer_id := X-User-ID", "revision_number=1"] }
  - { method: GET, path: "/configurations/{configurationId}", description: "Read one configuration including computed total_units, list_total_cents, max_lead_time_days", roles: [DealerRep, ManufacturerAdmin], code: 200, input: [], output: ConfigurationSpec, side_effects: [] }
  - { method: GET, path: "/configurations", description: "List configurations; filterable by dealer_id and status (FK reverse reachability for ConfigurationSpec.dealer_id). DealerRep sees only own configurations.", roles: [DealerRep, ManufacturerAdmin], code: 200, input: ["dealer_id?", "status?", "limit?", "offset?"], output: "ConfigurationSpec[]", side_effects: [] }
  - { method: POST, path: "/configurations/{configurationId}/lock", description: "DRAFT->LOCKED with OCC; checks module/fabric rules and family lifecycle (CURRENT, or SUNSETTING within last_order_date); computes and caches BOM totals and lead time", roles: [DealerRep], code: 200, input: [expected_configuration_version], output: ConfigurationSpec, side_effects: ["compute and cache total_units, list_total_cents, max_lead_time_days", "locked_at set", "increments ConfigurationSpec.version by 1"] }
  - { method: POST, path: "/configurations/{configurationId}/revise", description: "LOCKED->DRAFT revision loop; revision_number += 1", roles: [DealerRep], code: 200, input: [], output: ConfigurationSpec, side_effects: ["revision_number += 1", "increments ConfigurationSpec.version by 1"] }
  - { method: GET, path: "/configurations/{configurationId}/bom", description: "Computed part-level BOM: lines merged by part_number, sorted ascending, with quantities, unit prices, extended cents, parts_total_cents, total_units", roles: [DealerRep, ManufacturerAdmin], code: 200, input: [], output: "{ lines: array, parts_total_cents: integer, total_units: integer }", side_effects: [] }

  # --- Project orders ---
  - { method: POST, path: "/project-orders", description: "Create a ProjectOrder (DRAFT) under an ACTIVE agreement for the acting dealer", roles: [DealerRep], code: 201, input: [volume_agreement_id, configuration_id, territory_code, requested_install_date], output: ProjectOrder, side_effects: ["dealer_id := X-User-ID", "status=DRAFT"] }
  - { method: GET, path: "/project-orders/{orderId}", description: "Read one order including provisional/final pricing fields", roles: [DealerRep, ManufacturerAdmin, EndUserRep], code: 200, input: [], output: ProjectOrder, side_effects: [] }
  - { method: GET, path: "/project-orders", description: "List orders; filterable by dealer_id, volume_agreement_id, configuration_id, status (FK reverse reachability for all ProjectOrder FKs). Scoped by ownership for DealerRep/EndUserRep.", roles: [DealerRep, ManufacturerAdmin, EndUserRep], code: 200, input: ["dealer_id?", "volume_agreement_id?", "configuration_id?", "status?", "limit?", "offset?"], output: "ProjectOrder[]", side_effects: [] }
  - { method: POST, path: "/project-orders/{orderId}/submit", description: "DRAFT->SUBMITTED with OCC; full order-entry validation (dealer active, spec locked, territory, capability, agreement window, lead time); computes provisional pricing", roles: [DealerRep], code: 200, input: [expected_order_version], output: ProjectOrder, side_effects: ["compute pre_discount_total_cents, provisional_tier, provisional_total_cents", "pin configuration_revision", "submitted_at set", "increments ProjectOrder.version by 1"] }
  - { method: POST, path: "/project-orders/{orderId}/acknowledge", description: "SUBMITTED->ACKNOWLEDGED; computes FINAL pricing and debits agreement cumulative volume", roles: [ManufacturerAdmin], code: 200, input: [], output: ProjectOrder, side_effects: ["compute final_tier, final_total_cents", "agreement.cumulative_volume_cents += pre_discount_total_cents", "acknowledged_at set", "increments ProjectOrder.version by 1"] }
  - { method: POST, path: "/project-orders/{orderId}/cancel", description: "Cancel from DRAFT/SUBMITTED/ON_HOLD/ACKNOWLEDGED; ACKNOWLEDGED cancel credits back agreement volume and cascades phase/window/punch cancellation", roles: [DealerRep, ManufacturerAdmin], code: 200, input: ["reason?"], output: ProjectOrder, side_effects: ["cancelled_at set", "if from ACKNOWLEDGED: agreement.cumulative_volume_cents -= pre_discount_total_cents", "cascade: phases CANCELLED -> windows CANCELLED, punches VOIDED, plant capacity released", "increments ProjectOrder.version by 1"] }
  - { method: POST, path: "/project-orders/{orderId}/phases", description: "Create an InstallationPhase for an order in DRAFT, SUBMITTED, or ACKNOWLEDGED (phase structure may be refined until install)", roles: [DealerRep], code: 201, input: [floor_number, phase_sequence, building_zone_id, planned_units], output: InstallationPhase, side_effects: ["logistics_status=PLANNED, install_status=NOT_STARTED"] }
  - { method: GET, path: "/project-orders/{id}/phases", description: "List phases of an order (FK reverse reachability for InstallationPhase.project_order_id)", roles: [DealerRep, ManufacturerAdmin, EndUserRep], code: 200, input: ["limit?", "offset?"], output: "InstallationPhase[]", side_effects: [] }

  # --- Phase actions ---
  - { method: POST, path: "/phases/{phaseId}/reserve-slot", description: "Reserve manufacturing capacity: sets plant_code and production_date; checks order acknowledged, family not discontinued, notice, transit, and plant daily capacity", roles: [DealerRep], code: 200, input: [plant_code, production_date], output: InstallationPhase, side_effects: ["logistics_status PLANNED->SCHEDULED", "plant capacity consumed per plant_capacity_available", "increments InstallationPhase.version by 1"] }
  - { method: POST, path: "/phases/{phaseId}/start-install", description: "Deliver and begin installation in one dealer action: logistics_status SCHEDULED->DELIVERED and install_status NOT_STARTED->IN_PROGRESS; requires clock date >= production_date", roles: [DealerRep], code: 200, input: [], output: InstallationPhase, side_effects: ["delivered_at and install_started_at set", "increments InstallationPhase.version by 1"] }
  - { method: POST, path: "/phases/{phaseId}/complete", description: "IN_PROGRESS->COMPLETE; enforces floor/phase sequencing and the punch gate; bubbles the order to CLOSED when all phases complete", roles: [DealerRep], code: 200, input: [], output: InstallationPhase, side_effects: ["actual_install_complete_date := clock date", "bubble-up: order ACKNOWLEDGED->CLOSED when all phases COMPLETE", "increments InstallationPhase.version by 1"] }

  # --- Install windows ---
  - { method: POST, path: "/install-windows", description: "Reserve a freight-elevator/crew window for a phase whose logistics_status is SCHEDULED or DELIVERED; union minimum crew, elevator buffer conflict (only among elevator_required windows), and zone crew capacity enforced", roles: [DealerRep], code: 201, input: [installation_phase_id, start_at, end_at, union_required, elevator_required, crew_size], output: InstallWindow, side_effects: ["building_zone_id inherited from phase", "status=RESERVED"] }
  - { method: GET, path: "/install-windows", description: "List windows; filterable by installation_phase_id and building_zone_id (FK reverse reachability)", roles: [DealerRep, ManufacturerAdmin], code: 200, input: ["installation_phase_id?", "building_zone_id?", "limit?", "offset?"], output: "InstallWindow[]", side_effects: [] }
  - { method: GET, path: "/install-windows/{windowId}", description: "Read one install window", roles: [DealerRep, ManufacturerAdmin], code: 200, input: [], output: InstallWindow, side_effects: [] }
  - { method: POST, path: "/install-windows/{windowId}/cancel", description: "Cancel a RESERVED window; frees elevator interval and crew capacity", roles: [DealerRep], code: 200, input: [], output: InstallWindow, side_effects: ["status RESERVED->CANCELLED", "increments InstallWindow.version by 1"] }

  # --- Punch tickets ---
  - { method: POST, path: "/punch-tickets", description: "File a punch item against a phase whose install_status is IN_PROGRESS. EndUserRep files for own end user's orders; DealerRep files for own orders.", roles: [EndUserRep, DealerRep], code: 201, input: [installation_phase_id, severity, description, "requires_part?", "part_number?"], output: PunchTicket, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/punch-tickets", description: "List punch tickets; filterable by installation_phase_id and status (FK reverse reachability); includes computed escalated flag", roles: [DealerRep, ManufacturerAdmin, EndUserRep], code: 200, input: ["installation_phase_id?", "status?", "limit?", "offset?"], output: "PunchTicket[]", side_effects: [] }
  - { method: GET, path: "/punch-tickets/{ticketId}", description: "Read one punch ticket including computed escalated flag", roles: [DealerRep, ManufacturerAdmin, EndUserRep], code: 200, input: [], output: PunchTicket, side_effects: [] }
  - { method: POST, path: "/punch-tickets/{ticketId}/resolve", description: "OPEN->RESOLVED; if requires_part, auto-creates a SUBMITTED PARTS WarrantyClaim linked to this ticket", roles: [DealerRep], code: 200, input: [resolution_note], output: PunchTicket, side_effects: ["resolution_note set", "if requires_part: create WarrantyClaim(SUBMITTED, PARTS, part_number, punch_ticket_id)", "increments PunchTicket.version by 1"] }
  - { method: POST, path: "/punch-tickets/{ticketId}/verify", description: "RESOLVED->VERIFIED (outcome=CONFIRMED) or RESOLVED->OPEN (outcome=REJECTED)", roles: [EndUserRep], code: 200, input: [outcome], output: PunchTicket, side_effects: ["status transition per outcome", "increments PunchTicket.version by 1"] }

  # --- Warranty claims ---
  - { method: POST, path: "/warranty-claims", description: "Dealer files a warranty claim against a COMPLETE phase of an own order; warranty windows and parts-support horizon enforced", roles: [DealerRep], code: 201, input: [project_order_id, installation_phase_id, claim_type, description, "part_number?"], output: WarrantyClaim, side_effects: ["status=SUBMITTED", "filed_date := clock date"] }
  - { method: GET, path: "/warranty-claims/{claimId}", description: "Read one warranty claim", roles: [DealerRep, ManufacturerAdmin, EndUserRep], code: 200, input: [], output: WarrantyClaim, side_effects: [] }
  - { method: POST, path: "/warranty-claims/{claimId}/review", description: "Manufacturer reviews: decision=APPROVE -> APPROVED (terminal); decision=DENY -> DENIED (terminal)", roles: [ManufacturerAdmin], code: 200, input: [decision, "review_note?"], output: WarrantyClaim, side_effects: ["reviewed_at set", "increments WarrantyClaim.version by 1"] }
  - { method: GET, path: "/warranty-claims", description: "List claims; filterable by project_order_id, installation_phase_id, punch_ticket_id (FK reverse reachability for all WarrantyClaim FKs)", roles: [DealerRep, ManufacturerAdmin, EndUserRep], code: 200, input: ["project_order_id?", "installation_phase_id?", "punch_ticket_id?", "limit?", "offset?"], output: "WarrantyClaim[]", side_effects: [] }

  # --- Test-driving ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock to an ISO8601 UTC timestamp. Server startup default (before any call) is exactly 2026-09-01T00:00:00Z and never the wall clock.", roles: [ManufacturerAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["lazy agreement expiry applies on subsequent agreement reads/writes"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role or X-User-ID header, or unknown role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role is not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "DealerRep/EndUserRep acts on a resource outside their ownership scope" }
  - { id: ERR_VALIDATION, http: 400, condition: "Body shape violation: missing required field, bad type, bad enum member, qty/planned_units/crew_size < 1, empty modules, duplicate family_code or category, duplicate (order, phase_sequence)" }
  - { id: ERR_DATE_WINDOW_INVALID, http: 400, condition: "Field-level date window invalid: effective_end <= effective_start, end_at <= start_at, missing/invalid last_order_date or parts_support_until for the requested lifecycle transition" }
  - { id: ERR_DEALER_NOT_FOUND, http: 404, condition: "No dealer with the given id" }
  - { id: ERR_END_USER_NOT_FOUND, http: 404, condition: "No end user with the given id" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "No volume agreement with the given id" }
  - { id: ERR_PRODUCT_FAMILY_NOT_FOUND, http: 404, condition: "No product family with the given id" }
  - { id: ERR_CONFIGURATION_NOT_FOUND, http: 404, condition: "No configuration with the given id" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "No project order with the given id" }
  - { id: ERR_PHASE_NOT_FOUND, http: 404, condition: "No installation phase with the given id" }
  - { id: ERR_WINDOW_NOT_FOUND, http: 404, condition: "No install window with the given id" }
  - { id: ERR_PUNCH_NOT_FOUND, http: 404, condition: "No punch ticket with the given id" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "No warranty claim with the given id" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_order_version / expected_configuration_version does not match the entity's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid transition for the target's current state (includes verify of OPEN ticket, start-install of PLANNED phase, punch against non-IN_PROGRESS phase, window against PLANNED phase, claim against non-COMPLETE phase, review of an APPROVED or DENIED claim, cancel of CLOSED order)" }
  - { id: ERR_INVALID_LIFECYCLE_TRANSITION, http: 409, condition: "Product family lifecycle step is not the allowed forward step (e.g. CURRENT->DISCONTINUED, SUNSETTING->CURRENT)" }
  - { id: ERR_DEALER_SUSPENDED, http: 409, condition: "Order submit while the dealer is SUSPENDED" }
  - { id: ERR_SPEC_NOT_LOCKED, http: 409, condition: "Order submit while the referenced configuration is not LOCKED" }
  - { id: ERR_ORDER_NOT_ACKNOWLEDGED, http: 409, condition: "reserve-slot while the phase's order is not ACKNOWLEDGED" }
  - { id: ERR_UNION_CREW_MINIMUM, http: 422, condition: "union_required window booked with crew_size < 4" }
  - { id: ERR_TERRITORY_NOT_AUTHORIZED, http: 422, condition: "Order territory_code not in the dealer's territory_codes" }
  - { id: ERR_CAPABILITY_INSUFFICIENT, http: 422, condition: "Dealer service_capability_level below the required level for a module category in the spec (SYSTEMS 3, SEATING 1, STORAGE 2)" }
  - { id: ERR_INVALID_MODULE, http: 422, condition: "Unknown module_type, missing fabric_grade where required, or fabric_grade present on a STORAGE module, at lock" }
  - { id: ERR_PRODUCT_LINE_DISCONTINUED, http: 422, condition: "Spec lock or reserve-slot references a DISCONTINUED product family" }
  - { id: ERR_LAST_ORDER_DATE_PASSED, http: 422, condition: "Spec lock references a SUNSETTING family after its last_order_date" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 422, condition: "Order create or submit against an agreement that is DRAFT, EXPIRED, or outside its effective window" }
  - { id: ERR_LEAD_TIME_VIOLATION, http: 422, condition: "requested_install_date earlier than clock date + spec.max_lead_time_days" }
  - { id: ERR_PRODUCTION_NOTICE_VIOLATION, http: 422, condition: "production_date earlier than clock date + 2 days" }
  - { id: ERR_TRANSIT_WINDOW_VIOLATION, http: 422, condition: "production_date later than requested_install_date - TRANSIT_DAYS[plant_code]" }
  - { id: ERR_WINDOW_CONFLICT, http: 409, condition: "Freight-elevator overlap within the 15-minute turnover buffer in the same zone" }
  - { id: ERR_FLOOR_SEQUENCE_VIOLATION, http: 422, condition: "Completing a phase while an earlier (floor_number, phase_sequence) phase of the order is not COMPLETE" }
  - { id: ERR_OPEN_CRITICAL_PUNCH, http: 422, condition: "Completing a phase with a CRITICAL punch in OPEN/RESOLVED or a MAJOR punch in OPEN" }
  - { id: ERR_WARRANTY_EXPIRED, http: 422, condition: "Claim filed after the parts (1826d) or labor (366d) warranty window from actual_install_complete_date" }
  - { id: ERR_PARTS_SUPPORT_EXPIRED, http: 422, condition: "PARTS claim for a DISCONTINUED family's part filed after parts_support_until" }
  - { id: ERR_PLANT_CAPACITY_EXCEEDED, http: 422, condition: "reserve-slot would push reserved units above the plant's daily capacity (PLANT_GR 120, PLANT_DAL 80)" }
  - { id: ERR_ZONE_CREW_CAPACITY, http: 422, condition: "Overlapping windows in one zone on one date would sum crew_size above 10" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ManufacturerAdmin
    description: "Manufacturer operations staff: runs the dealer network, catalog, agreements, order acknowledgment, warranty review, and the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /dealers, PATCH /dealers/{dealerId}"
      - "POST /end-users"
      - "POST /volume-agreements, POST /volume-agreements/{agreementId}/activate"
      - "POST /product-families, PATCH /product-families/{familyId}"
      - "POST /project-orders/{orderId}/acknowledge"
      - "POST /warranty-claims/{claimId}/review"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across dealers, agreements, families, configurations, orders, phases, windows, punch tickets, claims"
      - "POST /project-orders/{orderId}/cancel (shared with owning DealerRep)"
  - name: DealerRep
    description: "Authorized dealer representative; owns configurations, orders, phases, windows, punch resolution, and warranty filing for their dealership"
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /configurations and configuration validate/lock/revise (own only)"
      - "POST /project-orders, submit, phase creation and phase actions (own only)"
      - "POST /install-windows and window cancel (own only)"
      - "POST /punch-tickets/{ticketId}/resolve (own only)"
      - "POST /warranty-claims (own only)"
    shared_operations:
      - "GET reads within ownership scope"
      - "POST /punch-tickets (shared with EndUserRep; scoped to own orders)"
      - "POST /project-orders/{orderId}/cancel (own orders; shared with ManufacturerAdmin)"
  - name: EndUserRep
    description: "End user facilities contact for a large customer; files and verifies punch items and reads own agreements/orders"
    identity: "entity_backed:EndUser"
    exclusive_operations:
      - "POST /punch-tickets/{ticketId}/verify (own end user's orders only)"
    shared_operations:
      - "GET reads of own agreements, orders, phases, punch tickets, claims"
      - "POST /punch-tickets (shared with DealerRep; scoped to phases of orders under agreements with end_user_id == X-User-ID)"
