  # ===========================================================================
  # Section: cross-cutting complexity layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "dual_variant_calc / permit_fee_business_vs_calendar_day_model_weekend_window"
          rationale: "Both variant pairs (permit fee, shoot-day compliance) are asserted in the two §1.8 dual_variant_calc instances."

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "transitive_cascade / amendment_supersede_depth3_permit_day_monitor_chain"
          rationale: "N-level cascades (depth 3 and depth 2, distinct triggers) are asserted end-to-end by both §1.8 transitive_cascade instances; production cancel cascade additionally covered by production_cancel_cascades_to_open_agreements_and_applications."

      - name: rate_threshold_triggers_layer
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "boundary_precision_check / cast_size_exactly_at_threshold_no_multiplier"
          rationale: "Threshold boundaries (cast multiplier at exactly N vs N+1, notification days at exactly lead) are asserted by the two §1.8 boundary_precision_check instances; deposit >= boundary covered by deposit_reaching_exact_required_transitions_funded."

      - name: optimistic_concurrency_layer
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules]
        excluded_because:
          difficulty_instance: "errors / permit_amend_stale_version_rejected"
          rationale: "Both OCC rules are exercised by the errors-section instances permit_amend_stale_version_rejected and mark_ready_stale_version_rejected (stale -> 412) and by the happy-path fresh-version calls inside §1.8 chains."

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_cascade_results
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: after owner-agreement accept returns 200, a subsequent GET of the location in the same test (no sweep, no wait) already shows status AGREEMENT_EXECUTED."
        test_recipe:
          setup: ["J1 chain: scout ACCEPTED; agreement PROPOSED"]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", lead_time_business_days: 5, notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2, holidays: [] }
              as: FilmOffice
              captures: { jur_id: $.data.id }
            - call: "POST /owners"
              payload: { legal_name: "Owner One", contact_email: "owner1@x.com", default_day_rate_cents: 150000 }
              as: LocationManager
              captures: { owner_id: $.data.id }
            - call: "POST /locations"
              payload: { name: "Loc A", address: "100 Main St", jurisdiction_id: "${jur_id}", owner_id: "${owner_id}", deposit_floor_cents: 200000, buffer_days: 2, max_shoot_hours_per_day: 14 }
              as: LocationManager
              captures: { loc_id: $.data.id }
            - call: "POST /productions"
              payload: { title: "Prod A", production_company: "Co A", cast_size: 40, umbrella_liability_limit_cents: 100000000 }
              as: LocationManager
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/scout-packages"
              payload: { location_id: "${loc_id}", photo_count: 6, coverage_score_pct: 80, scout_date: "2026-08-01" }
              as: LocationManager
              captures: { sp_id: $.data.id }
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/submit"
              payload: {}
              as: LocationManager
            - call: "POST /productions/${prod_id}/scout-packages/${sp_id}/review"
              payload: { decision: "ACCEPT" }
              as: FilmOffice
            - call: "POST /productions/${prod_id}/owner-agreements"
              payload: { location_id: "${loc_id}", shoot_start_date: "2026-08-10", shoot_end_date: "2026-08-12" }
              as: LocationManager
              captures: { agr_id: $.data.id }
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/propose"
              payload: { proposed_day_rate_cents: 150000 }
              as: LocationManager
          trigger:
            - call: "POST /productions/${prod_id}/owner-agreements/${agr_id}/accept"
              payload: {}
              as: OwnerRep
              as_user_id: "${owner_id}"
            - call: "GET /locations/${loc_id}"
              as: LocationManager
              captures: { loc_status: $.data.status }
          assert:
            - "accept response data.status == EXECUTED and data.agreed_day_rate_cents == 150000"
            - "GET /locations/${loc_id} immediately after: status == AGREEMENT_EXECUTED"
