      - 'Ben responding to his own seat returns 200 with attendance_status "ACCEPTED". The same call repeated
        as Ana returns ERR_NOT_RESOURCE_OWNER (403) while the same call repeated as Ben returns ERR_REGISTRATION_STATE_INVALID
        (409): ownership at priority 6 is decided before state at priority 11, so the wrong caller never
        learns that the seat had already been answered.'
  - name: contract_execution_requires_a_user_id_that_neither_proposed_nor_countered
