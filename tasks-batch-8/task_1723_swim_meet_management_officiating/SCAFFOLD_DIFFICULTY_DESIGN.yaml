            - { call: "POST /lane-assignments/${lane_b}/readings", payload: { pad_cs: 2500, backup1_cs: 2505, backup2_cs: 2507 }, as: TimingOperator }
            - { call: "POST /lane-assignments/${lane_c}/readings", payload: { pad_cs: 2510, backup1_cs: 2515, backup2_cs: 2517 }, as: TimingOperator }
