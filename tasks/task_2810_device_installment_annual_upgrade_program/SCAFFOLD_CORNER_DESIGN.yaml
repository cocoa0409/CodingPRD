      - name: device_unit_three_dimensions_advance_independently
        claim_type: parallel_state_dimensions
        grounds:
          - state_machines.DeviceUnit.activation_status
          - state_machines.DeviceUnit.unlock_status
          - state_machines.DeviceUnit.possession_status
          - complexity_profile.state_machine_shape_parallel
        distinguishing_aspect: |
          The handset's three dimensions are genuinely orthogonal: activation moves
          UNACTIVATED -> ACTIVATED while unlock stays LOCKED and possession stays
          WITH_CUSTOMER; a trade-in declaration then moves possession WITH_CUSTOMER ->
          RETURN_PENDING while activation stays ACTIVATED (activated_at unchanged) and unlock
          stays LOCKED — the combined triple (ACTIVATED, LOCKED, RETURN_PENDING) is legal and
          observable.
        test_recipe:
          setup:
            - "Eligible Handset B loan at 2027-06-27 with an ELIGIBILITY_PASSED upgrade request targeting Handset A; the handset was activated back on 2026-08-01."
