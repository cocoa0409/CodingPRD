scenario: |
  Generate task harder than expert level!

  2578. Correspondent Mortgage Purchase & Seller Management (correspondent lending aggregator): seller approval with financial statements, quality control review and net worth requirements, product eligibility matrix and mandatory versus best-efforts commitment types, pricing, lock desk execution and pair-off fee calculation on unfulfilled commitments, purchase review of the closed loan file with curable and non-curable defect classification, suspense conditions, cure timelines and purchase advice adjustments, repurchase demand process for early payment default or defect, servicing retained versus released elections and escrow transfer, seller scorecard and suspension for defect rate breaches

domain_name: correspondent-mortgage-purchase
api_prefix: "/correspondent"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: hybrid
  # Seller -> {FinancialStatement, QualityControlReview, SellerScorecard} and
  # Commitment -> Loan -> {Defect, SuspenseCondition, PurchaseAdvice,
  # RepurchaseDemand, EscrowTransfer} are hierarchical ownership chains, while
  # ProductEligibility / PricingAdjustment are cross-cutting configuration
  # referenced by both Commitment and Loan, and RepurchaseDemand reaches back
  # across the aggregate boundary to a Defect discovered post-purchase.

  state_machine_shape: parallel
  # Seller carries TWO independent dimensions on one row (approval_status ×
  # delivery_standing). Loan is cyclic (IN_REVIEW -> SUSPENDED -> IN_REVIEW and
  # PURCHASED -> REPURCHASE_DEMANDED -> PURCHASED). RepurchaseDemand is a
  # branching fork-join (ISSUED -> {APPEALED, RESCINDED, SATISFIED};
  # APPEALED -> {UPHELD, RESCINDED}) with divergent side-effect sets per branch.
  # Commitment is compound (its status is a function of allocated/fulfilled
  # amounts contributed by child Loans).

  relationship_patterns:
    - one_to_many          # Seller -> Commitment, Commitment -> Loan, Loan -> Defect
    - cross_aggregate      # RepurchaseDemand.source_defect_id, Loan.product_id
    - polymorphic          # RepurchaseDemand.reason selects which parent evidence is required

  role_model: segregation_of_duties
  # The user id that completes a QualityControlReview may not be the user id
  # that renders the seller approval decision; the user id that issues a
  # PurchaseAdvice may not be the user id that settles it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 51 endpoints / 66 error codes / 66 validation rows /
  # 10 calculations (2 with variants) / 12 state machines, two of them
  # non-linear on different entities, 2 OCC rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Seller
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: legal entity name of the correspondent seller
        constraints: 1..200 chars, non-empty
      - name: tin
        type: string
        source: input
        description: taxpayer identification number, unique across all Sellers
        constraints: exactly 9 digits; duplicate -> ERR_DUPLICATE_TIN
      - name: seller_type
        type: enum
        source: input
        description: counterparty class of the seller
        constraints: BANK | CREDIT_UNION | NON_BANK_IMB
      - name: approval_status
        type: enum
        source: system
        description: approval dimension of the Seller state machine
        default: APPLIED
        constraints: APPLIED | UNDER_REVIEW | APPROVED | DECLINED
      - name: delivery_standing
        type: enum
        source: system
        description: delivery-eligibility dimension of the Seller state machine, evolves independently of approval_status
        default: NOT_ELIGIBLE
        constraints: NOT_ELIGIBLE | GOOD_STANDING | WATCH | SUSPENDED | TERMINATED
      - name: approval_tier
        type: enum
        source: computed
        description: set at approval from the governing QualityControlReview outcome; null until approved
        default: null
        constraints: null | STANDARD | CONDITIONAL
      - name: servicing_retained_eligible
        type: boolean
        source: computed
        description: true only when the governing QualityControlReview outcome is PASS; gates servicing_election=RETAINED on delivery
        default: false
      - name: approved_tangible_net_worth_cents
        type: integer
        source: computed
        description: tangible net worth copied from the governing FinancialStatement at approval time
        default: 0
      - name: mandatory_exposure_limit_cents
        type: integer
        source: computed
        description: "min(NET_WORTH_MULTIPLIER * approved_tangible_net_worth_cents, MANDATORY_EXPOSURE_ABSOLUTE_CAP_CENTS) computed by calculations.seller_mandatory_exposure_limit"
        default: 0
      - name: open_mandatory_exposure_cents
        type: integer
        source: computed
        description: running sum of notional_amount_cents over this seller's Commitments with commitment_type=MANDATORY and status IN {LOCKED, PARTIALLY_FULFILLED}
        default: 0
      - name: net_funded_cents
        type: integer
        source: computed
        description: "conserved cash quantity: sum(PurchaseAdvice.net_wire_cents where status=SETTLED) - sum(RepurchaseDemand.funding_recovery_cents where status=SATISFIED)"
        default: 0
      - name: fee_receivable_cents
        type: integer
        source: computed
        description: running sum of Commitment.pair_off_fee_cents assessed on this seller plus RepurchaseDemand.admin_fee_cents on SATISFIED demands; never decremented
        default: 0
      - name: current_defect_rate_bps
        type: integer
        source: computed
        description: loan-count-weighted defect rate of the most recently CLOSED SellerScorecard (order by period_end DESC, then created_at DESC)
        default: 0
      - name: current_scorecard_grade
        type: enum
        source: computed
        description: grade of the most recently CLOSED SellerScorecard
        default: UNRATED
        constraints: UNRATED | A | B | C | D
      - name: suspension_reason
        type: enum
        source: computed
        description: why delivery_standing became SUSPENDED; cleared to null on reinstatement
        default: null
        constraints: null | SCORECARD_DEFECT_RATE | MANUAL_COUNTERPARTY_ACTION
      - name: approval_decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the CounterpartyAnalyst who rendered the approval decision
        default: null

  - name: FinancialStatement
    parent: Seller
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: FK -> Seller.id; the correspondent seller this statement belongs to
      - name: fiscal_year_end
        type: string
        source: input
        description: fiscal year end date of the statement period
        constraints: ISO 8601 date (YYYY-MM-DD)
      - name: audited
        type: boolean
        source: input
        description: true when the statement is CPA-audited; only audited statements may govern an approval
      - name: tangible_net_worth_cents
        type: integer
        source: input
        description: tangible net worth reported on the statement
        constraints: ">= 0"
      - name: liquid_assets_cents
        type: integer
        source: input
        description: unrestricted liquid assets reported on the statement
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: review state of the statement
        default: SUBMITTED
        constraints: SUBMITTED | ACCEPTED | REJECTED
      - name: reviewed_by_user_id
        type: string
        source: system
        description: X-User-ID of the CounterpartyAnalyst who accepted or rejected the statement
        default: null
      - name: review_note
        type: string
        source: input
        description: free-text reviewer note recorded on accept/reject
        default: null

  - name: QualityControlReview
    parent: Seller
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: FK -> Seller.id; the seller under quality control review
      - name: review_type
        type: enum
        source: input
        description: purpose of the review
        constraints: PRE_APPROVAL | ANNUAL_RECERT
      - name: status
        type: enum
        source: system
        description: review lifecycle state
        default: OPEN
        constraints: OPEN | COMPLETED
      - name: outcome
        type: enum
        source: computed
        description: derived at completion by calculations.qc_review_outcome from findings_count and critical_findings_count; null while OPEN
        default: null
        constraints: null | PASS | CONDITIONAL_PASS | FAIL
      - name: findings_count
        type: integer
        source: input
        description: total findings recorded at completion
        default: 0
        constraints: ">= 0"
      - name: critical_findings_count
        type: integer
        source: input
        description: subset of findings graded critical at completion
        default: 0
        constraints: ">= 0 and <= findings_count"
      - name: completed_by_user_id
        type: string
        source: system
        description: X-User-ID of the QCReviewer who completed the review; compared against the approval decider for segregation of duties
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant at completion
        default: null

  - name: ProductEligibility
    parent: null
    common_fields: true
    fields:
      - name: product_code
        type: string
        source: input
        description: unique product identifier in the eligibility matrix
        constraints: 3..32 chars uppercase; duplicate -> ERR_DUPLICATE_PRODUCT_CODE
      - name: description
        type: string
        source: input
        description: human-readable product description
        default: null
      - name: base_price_pct
        type: number
        source: input
        description: base purchase price as a percentage of note amount, 3 decimal places
        constraints: 90.000 .. 110.000
      - name: min_fico
        type: integer
        source: input
        description: minimum representative FICO accepted for this product, inclusive
        constraints: 300..850
      - name: max_ltv_pct
        type: number
        source: input
        description: maximum loan-to-value percentage accepted, inclusive, 1 decimal place
        constraints: 1.0 .. 100.0
      - name: max_loan_amount_cents
        type: integer
        source: input
        description: maximum note amount accepted for this product, inclusive
        constraints: "> 0"
      - name: allowed_commitment_types
        type: array
        source: input
        description: commitment types this product may be locked under
        constraints: non-empty subset of {MANDATORY, BEST_EFFORTS}
      - name: allowed_occupancies
        type: array
        source: input
        description: occupancy types this product may be delivered under
        constraints: non-empty subset of {PRIMARY, SECOND_HOME, INVESTMENT}
      - name: srp_pct
        type: number
        source: input
        description: service release premium as a percentage of note amount, paid only when servicing_election=RELEASED, 3 decimals
        constraints: 0.000 .. 5.000
      - name: status
        type: enum
        source: input
        description: matrix row availability
        default: ACTIVE
        constraints: ACTIVE | RETIRED

  - name: PricingAdjustment
    parent: ProductEligibility
    common_fields: true
    fields:
      - name: product_id
        type: string
        source: input
        description: FK -> ProductEligibility.id; the product whose price grid this row belongs to
      - name: adjustment_code
        type: string
        source: input
        description: loan-level price adjustment code, unique within the product
        constraints: 3..48 chars; duplicate within product -> ERR_DUPLICATE_ADJUSTMENT_CODE
      - name: fico_min
        type: integer
        source: input
        description: lower bound of the FICO band, INCLUSIVE
        constraints: 300..850
      - name: fico_max
        type: integer
        source: input
        description: upper bound of the FICO band, INCLUSIVE
        constraints: 300..850 and >= fico_min
      - name: ltv_min_pct
        type: number
        source: input
        description: lower bound of the LTV band, EXCLUSIVE
        constraints: 0.0 .. 100.0
      - name: ltv_max_pct
        type: number
        source: input
        description: upper bound of the LTV band, INCLUSIVE
        constraints: 0.0 .. 100.0 and > ltv_min_pct
      - name: price_adjustment_bps
        type: integer
        source: input
        description: signed price adjustment in basis points applied when the band matches
        constraints: -300 .. 100
      - name: status
        type: enum
        source: input
        description: whether the row participates in pricing
        default: ACTIVE
        constraints: ACTIVE | RETIRED

  - name: Commitment
    parent: Seller
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: FK -> Seller.id; the seller that owns this commitment
      - name: product_id
        type: string
        source: input
        description: FK -> ProductEligibility.id; the eligibility-matrix row this commitment is locked against
      - name: commitment_type
        type: enum
        source: input
        description: delivery obligation type; MANDATORY reserves exposure and occupies the delivery window, BEST_EFFORTS does neither
        constraints: MANDATORY | BEST_EFFORTS
      - name: notional_amount_cents
        type: integer
        source: input
        description: committed delivery amount
        constraints: ">= 1000000"
      - name: delivery_window_start
        type: string
        source: input
        description: first date on which loans may be delivered, INCLUSIVE
        constraints: ISO 8601 date
      - name: delivery_expiry_date
        type: string
        source: input
        description: expiry date; the delivery window is the half-open interval [delivery_window_start T00:00:00Z, delivery_expiry_date T00:00:00Z)
        constraints: ISO 8601 date, > delivery_window_start, <= delivery_window_start + 60 days
      - name: reference_fico
        type: integer
        source: input
        description: representative FICO used to select PricingAdjustment rows at lock time
        constraints: 300..850
      - name: reference_ltv_pct
        type: number
        source: input
        description: representative LTV used to select PricingAdjustment rows at lock time, 1 decimal
        constraints: 0.1 .. 100.0
      - name: lock_term_days
        type: integer
        source: computed
        description: "(delivery_expiry_date - delivery_window_start) in whole days; feeds the lock-term price tier"
      - name: llpa_bps_applied
        type: integer
        source: computed
        description: sum of price_adjustment_bps over matching ACTIVE PricingAdjustment rows, frozen at lock time
      - name: commitment_price_pct
        type: number
        source: computed
        description: locked purchase price percentage from calculations.commitment_price_pct, 3 decimals; never re-priced after lock
      - name: status
        type: enum
        source: system
        description: commitment lifecycle state
        default: LOCKED
        constraints: LOCKED | PARTIALLY_FULFILLED | FULFILLED | PAIRED_OFF | EXPIRED | CANCELLED
      - name: allocated_amount_cents
        type: integer
        source: computed
        description: sum of note_amount_cents over child Loans with purchase_status IN {DELIVERED, IN_REVIEW, SUSPENDED, CLEARED_FOR_PURCHASE}
        default: 0
      - name: fulfilled_amount_cents
        type: integer
        source: computed
        description: sum of note_amount_cents over child Loans with purchase_status IN {PURCHASED, REPURCHASE_DEMANDED, REPURCHASED}
        default: 0
      - name: paired_off_amount_cents
        type: integer
        source: computed
        description: amount removed from the commitment by an explicit pair-off
        default: 0
      - name: cancelled_amount_cents
        type: integer
        source: computed
        description: amount removed by tolerance write-off, expiry sweep, or seller-suspension cancellation
        default: 0
      - name: available_amount_cents
        type: integer
        source: computed
        description: "notional_amount_cents - allocated_amount_cents - fulfilled_amount_cents - paired_off_amount_cents - cancelled_amount_cents; the conserved-quantity residual, never negative"
      - name: tolerance_cents
        type: integer
        source: computed
        description: "floor(notional_amount_cents * PAIR_OFF_TOLERANCE_PCT / 100); under-delivery inside tolerance is written off free of charge"
      - name: pair_off_fee_cents
        type: integer
        source: computed
        description: fee assessed by calculations.pair_off_fee_cents when the commitment leaves the live set with billable shortfall
        default: 0
      - name: pair_off_market_price_pct
        type: number
        source: input
        description: market price percentage observed by the lock desk at explicit pair-off; null for administrative removals
        default: null
      - name: pair_off_method
        type: enum
        source: computed
        description: which pair-off variant produced pair_off_fee_cents
        default: null
        constraints: null | MANDATORY_MARK_TO_MARKET | BEST_EFFORTS_ADMIN_ONLY | ADMINISTRATIVE_FLAT
      - name: locked_by_user_id
        type: string
        source: system
        description: X-User-ID that created the lock
        default: null

  - name: Loan
    parent: Commitment
    common_fields: true
    fields:
      - name: commitment_id
        type: string
        source: input
        description: FK -> Commitment.id; the commitment this closed loan file is delivered against
      - name: seller_id
        type: string
        source: computed
        description: FK -> Seller.id; copied from the parent commitment at delivery
      - name: product_id
        type: string
        source: computed
        description: FK -> ProductEligibility.id; copied from the parent commitment at delivery
      - name: seller_loan_number
        type: string
        source: input
        description: seller's own loan number, unique per seller
        constraints: 1..32 chars; duplicate within seller -> ERR_DUPLICATE_SELLER_LOAN_NUMBER
      - name: note_amount_cents
        type: integer
        source: input
        description: original principal balance of the note
        constraints: "> 0"
      - name: note_rate_pct
        type: number
        source: input
        description: note interest rate percentage, 3 decimals
        constraints: 0.001 .. 25.000
      - name: fico
        type: integer
        source: input
        description: representative FICO of the borrower
        constraints: 300..850
      - name: ltv_pct
        type: number
        source: input
        description: loan-to-value percentage, 1 decimal
        constraints: 0.1 .. 150.0
      - name: occupancy
        type: enum
        source: input
        description: subject property occupancy
        constraints: PRIMARY | SECOND_HOME | INVESTMENT
      - name: servicing_election
        type: enum
        source: input
        description: servicing disposition elected by the seller at delivery
        constraints: RETAINED | RELEASED
      - name: escrow_balance_cents
        type: integer
        source: input
        description: escrow balance held by the seller at closing; funded to the seller only when servicing_election=RELEASED
        default: 0
        constraints: ">= 0"
      - name: closing_date
        type: string
        source: input
        description: note closing date; accrued interest runs from this date
        constraints: ISO 8601 date
      - name: first_payment_due_date
        type: string
        source: input
        description: contractual first payment due date; anchors early payment default
        constraints: ISO 8601 date, > closing_date
      - name: first_payment_status
        type: enum
        source: system
        description: servicing outcome of the first scheduled payment
        default: PENDING
        constraints: PENDING | PAID | MISSED
      - name: purchase_status
        type: enum
        source: system
        description: purchase-review lifecycle state
        default: DELIVERED
        constraints: DELIVERED | IN_REVIEW | SUSPENDED | CLEARED_FOR_PURCHASE | PURCHASED | REPURCHASE_DEMANDED | REPURCHASED | REJECTED
      - name: review_cycle_count
        type: integer
        source: computed
        description: number of times the loan has entered IN_REVIEW from SUSPENDED; measures cure round trips
        default: 0
      - name: open_defect_count
        type: integer
        source: computed
        description: count of child Defects with status=OPEN
        default: 0
      - name: non_curable_defect_count
        type: integer
        source: computed
        description: count of child Defects with classification=NON_CURABLE in any status
        default: 0
      - name: open_suspense_count
        type: integer
        source: computed
        description: count of child SuspenseConditions with status=OPEN
        default: 0
      - name: advice_count
        type: integer
        source: computed
        description: number of PurchaseAdvices ever issued on this loan; incremented on each advice creation
        default: 0
      - name: delivered_at
        type: datetime
        source: system
        description: logical-clock instant of delivery
      - name: purchased_at
        type: datetime
        source: system
        description: logical-clock instant at which the purchase advice settled; null until PURCHASED
        default: null

  - name: Defect
    parent: Loan
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK -> Loan.id; the loan file the defect was found on
      - name: defect_code
        type: string
        source: input
        description: aggregator defect taxonomy code
        constraints: 2..48 chars
      - name: category
        type: enum
        source: input
        description: defect category from the QC taxonomy
        constraints: CREDIT | INCOME | COLLATERAL | COMPLIANCE | DOCUMENTATION
      - name: severity
        type: enum
        source: input
        description: severity graded by the purchase reviewer
        constraints: LOW | MEDIUM | HIGH | CRITICAL
      - name: classification
        type: enum
        source: computed
        description: derived by calculations.defect_classification from severity and category; input values are ignored
        constraints: CURABLE | NON_CURABLE
      - name: status
        type: enum
        source: system
        description: defect lifecycle state
        default: OPEN
        constraints: OPEN | CURED | WAIVED | EXPIRED
      - name: cure_deadline_at
        type: datetime
        source: computed
        description: "created_at + CURE_WINDOW_DAYS[severity] for CURABLE defects; null for NON_CURABLE"
        default: null
      - name: cured_at
        type: datetime
        source: system
        description: logical-clock instant the cure was accepted
        default: null
      - name: price_adjustment_bps
        type: integer
        source: input
        description: signed price hit recorded when the defect is waived; EXPIRED defects instead carry EXPIRED_DEFECT_PENALTY_BPS
        default: 0
        constraints: -100 .. 0
      - name: cure_document_reference
        type: string
        source: input
        description: document reference supplied with the cure
        default: null
      - name: identified_by_user_id
        type: string
        source: system
        description: X-User-ID of the PurchaseReviewer who recorded the defect

  - name: SuspenseCondition
    parent: Loan
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK -> Loan.id; the loan file held in suspense by this condition
      - name: condition_code
        type: string
        source: input
        description: suspense condition code (missing document, missing signature, etc.)
        constraints: 2..48 chars
      - name: description
        type: string
        source: input
        description: what the seller must deliver to clear the condition
        default: null
      - name: status
        type: enum
        source: system
        description: condition lifecycle state
        default: OPEN
        constraints: OPEN | CLEARED | EXPIRED
      - name: due_at
        type: datetime
        source: computed
        description: created_at + SUSPENSE_WINDOW_DAYS; conditions past due are expired by the loan condition sweep
      - name: cleared_at
        type: datetime
        source: system
        description: logical-clock instant the condition was cleared
        default: null
      - name: document_reference
        type: string
        source: input
        description: document reference supplied when clearing the condition
        default: null

  - name: PurchaseAdvice
    parent: Loan
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK -> Loan.id; the loan being purchased
      - name: status
        type: enum
        source: system
        description: advice lifecycle state
        default: ISSUED
        constraints: ISSUED | SUPERSEDED | VOIDED | SETTLED | REVERSED
      - name: volume_incentive_bps
        type: integer
        source: computed
        description: month-to-date volume incentive frozen at issuance by calculations.volume_incentive_bps
        default: 0
      - name: final_purchase_price_pct
        type: number
        source: computed
        description: "commitment.commitment_price_pct + volume_incentive_bps / 100, 3 decimals; frozen at issuance and never recomputed at settlement"
      - name: accrued_days
        type: integer
        source: computed
        description: "(advice issuance date - loan.closing_date) in whole days"
      - name: principal_purchase_cents
        type: integer
        source: computed
        description: rounded principal purchase component
      - name: accrued_interest_cents
        type: integer
        source: computed
        description: rounded accrued interest component on a 360-day basis
      - name: escrow_funding_cents
        type: integer
        source: computed
        description: loan.escrow_balance_cents when servicing_election=RELEASED, else 0
      - name: service_release_premium_cents
        type: integer
        source: computed
        description: rounded SRP component; 0 when servicing_election=RETAINED
      - name: defect_price_adjustment_cents
        type: integer
        source: computed
        description: negative-or-zero sum of per-defect rounded price hits from WAIVED and EXPIRED child Defects
        default: 0
      - name: wire_fee_cents
        type: integer
        source: computed
        description: flat WIRE_FEE_CENTS deducted from every advice
      - name: net_wire_cents
        type: integer
        source: computed
        description: sum of the independently rounded components per calculations.purchase_advice_net_wire_cents
      - name: funding_reference
        type: string
        source: input
        description: wire reference recorded at settlement
        default: null
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the PurchaseReviewer who issued the advice; may not settle it
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant of issuance
      - name: settled_by_user_id
        type: string
        source: system
        description: X-User-ID of the PurchaseReviewer who settled the advice
        default: null
      - name: settled_at
        type: datetime
        source: system
        description: logical-clock instant of settlement
        default: null

  - name: RepurchaseDemand
    parent: Loan
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK -> Loan.id; the purchased loan being demanded back
      - name: seller_id
        type: string
        source: computed
        description: FK -> Seller.id; copied from the loan at issuance
      - name: source_defect_id
        type: string
        source: input
        description: FK -> Defect.id; required when reason=DEFECT, must be null when reason=EPD
        default: null
      - name: reason
        type: enum
        source: input
        description: legal basis for the demand
        constraints: EPD | DEFECT | MISREPRESENTATION
      - name: status
        type: enum
        source: system
        description: demand lifecycle state
        default: ISSUED
        constraints: ISSUED | APPEALED | UPHELD | RESCINDED | SATISFIED
      - name: demand_letter_reference
        type: string
        source: input
        description: reference of the repurchase demand letter sent to the seller
        constraints: 1..64 chars
      - name: appeal_deadline_at
        type: datetime
        source: computed
        description: issuance instant + APPEAL_WINDOW_DAYS; appeals filed after this instant are rejected
      - name: appeal_reason
        type: string
        source: input
        description: seller rebuttal text recorded when the demand is appealed
        default: null
      - name: funding_recovery_cents
        type: integer
        source: computed
        description: net_wire_cents of the loan's SETTLED PurchaseAdvice; the exact amount unwound from Seller.net_funded_cents when satisfied
      - name: admin_fee_cents
        type: integer
        source: computed
        description: flat REPURCHASE_ADMIN_FEE_CENTS booked to Seller.fee_receivable_cents when satisfied
      - name: repurchase_price_cents
        type: integer
        source: computed
        description: funding_recovery_cents + admin_fee_cents, the amount the seller remits
      - name: remittance_reference
        type: string
        source: input
        description: seller remittance reference recorded at satisfaction
        default: null
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the PurchaseReviewer who issued the demand
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the PurchaseReviewer who upheld or rescinded the appeal
        default: null
      - name: satisfied_at
        type: datetime
        source: system
        description: logical-clock instant the repurchase settled
        default: null

  - name: EscrowTransfer
    parent: Loan
    common_fields: true
    fields:
      - name: loan_id
        type: string
        source: input
        description: FK -> Loan.id; the servicing-released loan whose escrow is transferred
      - name: transfer_amount_cents
        type: integer
        source: computed
        description: loan.escrow_balance_cents frozen at purchase settlement
      - name: status
        type: enum
        source: system
        description: escrow transfer lifecycle state
        default: PENDING
        constraints: PENDING | COMPLETED | REVERSED
      - name: transfer_due_at
        type: datetime
        source: computed
        description: loan.purchased_at + ESCROW_TRANSFER_DAYS
      - name: goodbye_letter_reference
        type: string
        source: input
        description: reference of the RESPA goodbye letter recorded at completion
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant of completion
        default: null
      - name: reversal_reason
        type: enum
        source: system
        description: why the transfer was reversed
        default: null
        constraints: null | REPURCHASE_SATISFIED

  - name: SellerScorecard
    parent: Seller
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: FK -> Seller.id; the scored seller
      - name: period_start
        type: string
        source: input
        description: first date of the scoring period; the period is the CLOSED interval [period_start, period_end]
        constraints: ISO 8601 date
      - name: period_end
        type: string
        source: input
        description: last date of the scoring period, INCLUSIVE
        constraints: ISO 8601 date, >= period_start
      - name: status
        type: enum
        source: system
        description: scorecard lifecycle state
        default: OPEN
        constraints: OPEN | CLOSED
      - name: purchased_loan_count
        type: integer
        source: computed
        description: count of the seller's loans with purchase_status IN {PURCHASED, REPURCHASE_DEMANDED, REPURCHASED} and purchased_at inside the period
        default: 0
      - name: purchased_upb_cents
        type: integer
        source: computed
        description: sum of note_amount_cents over the same loan set
        default: 0
      - name: defective_loan_count
        type: integer
        source: computed
        description: count of loans in the same set that satisfy the defective predicate of calculations.seller_defect_rate_bps
        default: 0
      - name: defective_upb_cents
        type: integer
        source: computed
        description: sum of note_amount_cents over the defective subset
        default: 0
      - name: defect_rate_bps
        type: integer
        source: computed
        description: loan-count-weighted defect rate; the governing variant for grading and suspension
        default: 0
      - name: upb_weighted_defect_rate_bps
        type: integer
        source: computed
        description: UPB-weighted defect rate; reported for governance, never used for suspension
        default: 0
      - name: grade
        type: enum
        source: computed
        description: letter grade from calculations.seller_defect_rate_bps grade table
        default: UNRATED
        constraints: UNRATED | A | B | C | D
      - name: breach
        type: boolean
        source: computed
        description: true when the loan-count-weighted rate exceeds DEFECT_RATE_SUSPENSION_BPS with a scoreable sample
        default: false
      - name: standing_action_applied
        type: enum
        source: computed
        description: standing action the close applied to the seller
        default: NONE
        constraints: NONE | WATCH | SUSPENDED | RECOVERED
      - name: closed_at
        type: datetime
        source: system
        description: logical-clock instant the scorecard was closed
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  # ---- Seller: dimension 1 of 2 (approval), evolves independently of standing
  - entity: Seller
    dimension: approval_status
    initial_state: APPLIED
    terminal_states: [DECLINED]
    transitions:
      - from: APPLIED
        to: UNDER_REVIEW
        trigger: "POST /correspondent/sellers/{id}/qc-reviews — creation of the seller's FIRST QualityControlReview"
        actor: system
        preconditions:
          - "seller.approval_status == APPLIED"
        side_effects:
          - "increments Seller.version by 1"
        note: "Auto-transition. Creating a second QC review while UNDER_REVIEW does not re-fire this transition."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /correspondent/sellers/{id}/approval-decision with decision=APPROVE"
        actor: CounterpartyAnalyst
        preconditions:
          - "seller.approval_status == UNDER_REVIEW"
          - "a governing FinancialStatement exists — the seller's statements with status=ACCEPTED and audited=true ordered by fiscal_year_end DESC, then created_at DESC, first row; empty set -> ERR_NO_ACCEPTED_STATEMENT"
          - "governing_statement.fiscal_year_end + FS_STALENESS_DAYS >= clock date, else ERR_FINANCIAL_STATEMENT_STALE"
          - "governing_statement.tangible_net_worth_cents >= MIN_TANGIBLE_NET_WORTH_CENTS (250000000), else ERR_NET_WORTH_BELOW_MINIMUM"
          - "governing_statement.liquid_assets_cents >= MIN_LIQUIDITY_CENTS (50000000), else ERR_LIQUIDITY_BELOW_MINIMUM"
          - "a governing QualityControlReview exists — the seller's reviews with status=COMPLETED ordered by completed_at DESC, then created_at DESC, first row; empty set -> ERR_QC_REVIEW_NOT_COMPLETED"
          - "governing_review.outcome IN {PASS, CONDITIONAL_PASS}, else ERR_QC_REVIEW_FAILED"
          - "X-User-ID != governing_review.completed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Seller.approved_tangible_net_worth_cents = governing_statement.tangible_net_worth_cents"
          - "Seller.approval_tier = STANDARD when governing_review.outcome == PASS else CONDITIONAL"
          - "Seller.servicing_retained_eligible = (governing_review.outcome == PASS)"
          - "Seller.mandatory_exposure_limit_cents = calculations.seller_mandatory_exposure_limit"
          - "Seller.delivery_standing NOT_ELIGIBLE -> GOOD_STANDING (cross-dimension effect on the same row)"
          - "Seller.approval_decided_by_user_id = X-User-ID"
          - "increments Seller.version by 1"
      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /correspondent/sellers/{id}/approval-decision with decision=DECLINE"
        actor: CounterpartyAnalyst
        preconditions:
          - "seller.approval_status == UNDER_REVIEW"
          - "X-User-ID != governing_review.completed_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "Seller.approval_decided_by_user_id = X-User-ID"
          - "Seller.delivery_standing remains NOT_ELIGIBLE (no cross-dimension effect)"
          - "increments Seller.version by 1"
        note: "Terminal on the approval dimension; a DECLINED seller can never lock or deliver."

  # ---- Seller: dimension 2 of 2 (delivery standing), cyclic
  - entity: Seller
    dimension: delivery_standing
    initial_state: NOT_ELIGIBLE
    terminal_states: [TERMINATED]
    transitions:
      - from: NOT_ELIGIBLE
        to: GOOD_STANDING
        trigger: "cascaded from Seller.approval_status UNDER_REVIEW -> APPROVED"
        actor: system
        preconditions:
          - "seller.approval_status transitions to APPROVED in the same request"
        side_effects:
          - "Seller.suspension_reason = null"
      - from: GOOD_STANDING
        to: WATCH
        trigger: "POST /correspondent/scorecards/{id}/close where DEFECT_RATE_WATCH_BPS < defect_rate_bps <= DEFECT_RATE_SUSPENSION_BPS and purchased_loan_count >= MIN_SCORED_LOANS; or POST /correspondent/sellers/{id}/standing-actions with action=PLACE_ON_WATCH"
        actor: system | CounterpartyAnalyst
        preconditions:
          - "seller.delivery_standing == GOOD_STANDING"
        side_effects:
          - "SellerScorecard.standing_action_applied = WATCH (scorecard path only)"
          - "increments Seller.version by 1"
        note: "WATCH sellers may still lock and deliver; only SUSPENDED and TERMINATED block delivery."
      - from: WATCH
        to: GOOD_STANDING
        trigger: "POST /correspondent/scorecards/{id}/close where defect_rate_bps <= DEFECT_RATE_WATCH_BPS and purchased_loan_count >= MIN_SCORED_LOANS; or POST /correspondent/sellers/{id}/standing-actions with action=REINSTATE"
        actor: system | CounterpartyAnalyst
        preconditions:
          - "seller.delivery_standing == WATCH"
        side_effects:
          - "SellerScorecard.standing_action_applied = RECOVERED (scorecard path only)"
          - "increments Seller.version by 1"
        note: "Closes the WATCH cycle: GOOD_STANDING -> WATCH -> GOOD_STANDING."
      - from: GOOD_STANDING
        to: SUSPENDED
        trigger: "POST /correspondent/scorecards/{id}/close with breach=true; or POST /correspondent/sellers/{id}/standing-actions with action=SUSPEND"
        actor: system | CounterpartyAnalyst
        preconditions:
          - "seller.delivery_standing == GOOD_STANDING"
        side_effects:
          - "Seller.suspension_reason = SCORECARD_DEFECT_RATE (scorecard path) or MANUAL_COUNTERPARTY_ACTION (manual path)"
          - "SCORECARD PATH ONLY: every Commitment of this seller with status IN {LOCKED, PARTIALLY_FULFILLED} AND allocated_amount_cents == 0 transitions to CANCELLED (conditional cascade; commitments with outstanding allocations are left untouched)"
          - "MANUAL PATH: no Commitment is cancelled — existing locks survive a manual suspension"
          - "increments Seller.version by 1"
      - from: WATCH
        to: SUSPENDED
        trigger: "POST /correspondent/scorecards/{id}/close with breach=true; or POST /correspondent/sellers/{id}/standing-actions with action=SUSPEND"
        actor: system | CounterpartyAnalyst
        preconditions:
          - "seller.delivery_standing == WATCH"
        side_effects:
          - "same side-effect set as GOOD_STANDING -> SUSPENDED"
      - from: SUSPENDED
        to: GOOD_STANDING
        trigger: "POST /correspondent/sellers/{id}/standing-actions with action=REINSTATE"
        actor: CounterpartyAnalyst
        preconditions:
          - "seller.delivery_standing == SUSPENDED"
        side_effects:
          - "Seller.suspension_reason = null"
          - "increments Seller.version by 1"
        note: "Cancelled commitments are NOT restored; reinstatement only reopens the ability to lock anew."
      - from: GOOD_STANDING
        to: TERMINATED
        trigger: "POST /correspondent/sellers/{id}/standing-actions with action=TERMINATE"
        actor: CounterpartyAnalyst
        preconditions:
          - "seller.delivery_standing IN {GOOD_STANDING, WATCH, SUSPENDED}"
        side_effects:
          - "every Commitment of this seller with status IN {LOCKED, PARTIALLY_FULFILLED} AND allocated_amount_cents == 0 transitions to CANCELLED"
          - "increments Seller.version by 1"
      - from: WATCH
        to: TERMINATED
        trigger: "POST /correspondent/sellers/{id}/standing-actions with action=TERMINATE"
        actor: CounterpartyAnalyst
        preconditions: ["seller.delivery_standing == WATCH"]
        side_effects: ["same side-effect set as GOOD_STANDING -> TERMINATED"]
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /correspondent/sellers/{id}/standing-actions with action=TERMINATE"
        actor: CounterpartyAnalyst
        preconditions: ["seller.delivery_standing == SUSPENDED"]
        side_effects: ["same side-effect set as GOOD_STANDING -> TERMINATED"]

  - entity: FinancialStatement
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /correspondent/financial-statements/{id}/review with decision=ACCEPT"
        actor: CounterpartyAnalyst
        preconditions:
          - "statement.status == SUBMITTED"
        side_effects:
          - "FinancialStatement.reviewed_by_user_id = X-User-ID"
          - "increments FinancialStatement.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /correspondent/financial-statements/{id}/review with decision=REJECT"
        actor: CounterpartyAnalyst
        preconditions:
          - "statement.status == SUBMITTED"
        side_effects:
          - "FinancialStatement.reviewed_by_user_id = X-User-ID"
          - "increments FinancialStatement.version by 1"
        note: "REJECTED statements are invisible to the governing-statement selector."

  - entity: QualityControlReview
    initial_state: OPEN
    terminal_states: [COMPLETED]
    transitions:
      - from: OPEN
        to: COMPLETED
        trigger: "POST /correspondent/qc-reviews/{id}/complete"
        actor: QCReviewer
        preconditions:
          - "review.status == OPEN"
          - "critical_findings_count <= findings_count, else ERR_INVALID_REQUEST"
        side_effects:
          - "QualityControlReview.outcome = calculations.qc_review_outcome"
          - "QualityControlReview.completed_by_user_id = X-User-ID"
          - "QualityControlReview.completed_at = logical clock"
          - "increments QualityControlReview.version by 1"

  - entity: Commitment
    initial_state: LOCKED
    terminal_states: [FULFILLED, PAIRED_OFF, EXPIRED, CANCELLED]
    transitions:
      - from: LOCKED
        to: PARTIALLY_FULFILLED
        trigger: "cascaded from Loan CLEARED_FOR_PURCHASE -> PURCHASED (purchase advice settlement)"
        actor: system
        preconditions:
          - "commitment.status == LOCKED"
          - "fulfilled_amount_cents after the fill < notional_amount_cents - tolerance_cents"
        side_effects:
          - "Commitment.fulfilled_amount_cents += loan.note_amount_cents"
          - "Commitment.allocated_amount_cents -= loan.note_amount_cents"
          - "Commitment.available_amount_cents recomputed (unchanged by this hop: allocation converts to fulfilment)"
          - "increments Commitment.version by 1"
        note: "Self-loop: a second fill on a commitment already PARTIALLY_FULFILLED repeats the amount updates without a status change."
      - from: LOCKED
        to: FULFILLED
        trigger: "cascaded from Loan CLEARED_FOR_PURCHASE -> PURCHASED (purchase advice settlement)"
        actor: system
        preconditions:
          - "commitment.status == LOCKED"
          - "fulfilled_amount_cents after the fill >= notional_amount_cents - tolerance_cents"
        side_effects:
          - "Commitment.fulfilled_amount_cents += loan.note_amount_cents; Commitment.allocated_amount_cents -= loan.note_amount_cents"
          - "TOLERANCE WRITE-OFF: Commitment.cancelled_amount_cents += available_amount_cents, driving available_amount_cents to 0 so the conserved identity holds with no fee"
          - "Commitment.pair_off_fee_cents stays 0 (shortfall inside tolerance is never billable)"
          - "cascaded: Seller.open_mandatory_exposure_cents -= notional_amount_cents when commitment_type == MANDATORY"
          - "increments Commitment.version by 1"
      - from: PARTIALLY_FULFILLED
        to: FULFILLED
        trigger: "cascaded from Loan CLEARED_FOR_PURCHASE -> PURCHASED (purchase advice settlement)"
        actor: system
        preconditions:
          - "commitment.status == PARTIALLY_FULFILLED"
          - "fulfilled_amount_cents after the fill >= notional_amount_cents - tolerance_cents"
        side_effects:
          - "same side-effect set as LOCKED -> FULFILLED"
      - from: LOCKED
        to: PAIRED_OFF
        trigger: "POST /correspondent/commitments/{id}/pair-off"
        actor: LockDeskTrader
        preconditions:
          - "commitment.status IN {LOCKED, PARTIALLY_FULFILLED}"
          - "commitment.allocated_amount_cents == 0, else ERR_ALLOCATION_OUTSTANDING (priority 32)"
          - "commitment.available_amount_cents > 0 — structurally guaranteed for a commitment still in LOCKED or PARTIALLY_FULFILLED, since the residual can only reach zero through a fill, pair-off, write-off or cancellation that also moves the status to a terminal state"
        side_effects:
          - "Commitment.paired_off_amount_cents += available_amount_cents, driving available_amount_cents to 0"
          - "Commitment.pair_off_market_price_pct = request pair_off_market_price_pct"
          - "Commitment.pair_off_fee_cents = calculations.pair_off_fee_cents; Commitment.pair_off_method = MANDATORY_MARK_TO_MARKET or BEST_EFFORTS_ADMIN_ONLY per commitment_type"
          - "cascaded: Seller.fee_receivable_cents += Commitment.pair_off_fee_cents"
          - "cascaded: Seller.open_mandatory_exposure_cents -= notional_amount_cents when commitment_type == MANDATORY"
          - "increments Commitment.version by 1"
      - from: PARTIALLY_FULFILLED
        to: PAIRED_OFF
        trigger: "POST /correspondent/commitments/{id}/pair-off"
        actor: LockDeskTrader
        preconditions:
          - "same preconditions as LOCKED -> PAIRED_OFF"
        side_effects:
          - "same side-effect set as LOCKED -> PAIRED_OFF; the billable shortfall is measured on available_amount_cents net of prior fills"
      - from: LOCKED
        to: EXPIRED
        trigger: "POST /correspondent/commitments/expire-due (lock desk expiry sweep)"
        actor: LockDeskTrader
        preconditions:
          - "commitment.status IN {LOCKED, PARTIALLY_FULFILLED}"
          - "logical clock >= delivery_expiry_date T00:00:00Z"
          - "commitment.allocated_amount_cents == 0 (commitments with loans still in the purchase pipeline are skipped by the sweep)"
        side_effects:
          - "Commitment.cancelled_amount_cents += available_amount_cents, driving available_amount_cents to 0"
          - "Commitment.pair_off_fee_cents = calculations.pair_off_fee_cents variant administrative_flat; Commitment.pair_off_method = ADMINISTRATIVE_FLAT"
          - "cascaded: Seller.fee_receivable_cents += Commitment.pair_off_fee_cents"
          - "cascaded: Seller.open_mandatory_exposure_cents -= notional_amount_cents when commitment_type == MANDATORY"
          - "increments Commitment.version by 1"
      - from: PARTIALLY_FULFILLED
        to: EXPIRED
        trigger: "POST /correspondent/commitments/expire-due (lock desk expiry sweep)"
        actor: LockDeskTrader
        preconditions: ["same preconditions as LOCKED -> EXPIRED"]
        side_effects: ["same side-effect set as LOCKED -> EXPIRED"]
      - from: LOCKED
        to: CANCELLED
        trigger: "cascaded from Seller.delivery_standing -> SUSPENDED (scorecard breach path only) or -> TERMINATED"
        actor: system
        preconditions:
          - "commitment.status IN {LOCKED, PARTIALLY_FULFILLED}"
          - "commitment.allocated_amount_cents == 0"
        side_effects:
          - "Commitment.cancelled_amount_cents += available_amount_cents, driving available_amount_cents to 0"
          - "Commitment.pair_off_fee_cents = calculations.pair_off_fee_cents variant administrative_flat; Commitment.pair_off_method = ADMINISTRATIVE_FLAT"
          - "cascaded: Seller.fee_receivable_cents += Commitment.pair_off_fee_cents"
          - "cascaded: Seller.open_mandatory_exposure_cents -= notional_amount_cents when commitment_type == MANDATORY"
          - "increments Commitment.version by 1"
      - from: PARTIALLY_FULFILLED
        to: CANCELLED
        trigger: "cascaded from Seller.delivery_standing -> SUSPENDED (scorecard breach path only) or -> TERMINATED"
        actor: system
        preconditions: ["same preconditions as LOCKED -> CANCELLED"]
        side_effects: ["same side-effect set as LOCKED -> CANCELLED"]

  - entity: Loan
    initial_state: DELIVERED
    terminal_states: [REJECTED, REPURCHASED]
    transitions:
      - from: DELIVERED
        to: IN_REVIEW
        trigger: "POST /correspondent/loans/{id}/review"
        actor: PurchaseReviewer
        preconditions:
          - "loan.purchase_status == DELIVERED"
        side_effects:
          - "increments Loan.version by 1"
      - from: IN_REVIEW
        to: SUSPENDED
        trigger: "POST /correspondent/loans/{id}/defects or POST /correspondent/loans/{id}/suspense-conditions"
        actor: system
        preconditions:
          - "loan.purchase_status == IN_REVIEW"
        side_effects:
          - "increments Loan.version by 1"
        note: "Auto-transition on creation of any open review item. A loan already in SUSPENDED accepts further defects and suspense conditions without any transition (the counters accumulate and the file stays SUSPENDED), and creating a defect on a PURCHASED loan does NOT fire this transition either (conditional cascade keyed on loan.purchase_status)."
      - from: CLEARED_FOR_PURCHASE
        to: SUSPENDED
        trigger: "POST /correspondent/loans/{id}/defects or POST /correspondent/loans/{id}/suspense-conditions"
        actor: system
        preconditions:
          - "loan.purchase_status == CLEARED_FOR_PURCHASE"
        side_effects:
          - "every PurchaseAdvice of this loan with status == ISSUED transitions to VOIDED"
          - "increments Loan.version by 1"
      - from: SUSPENDED
        to: IN_REVIEW
        trigger: "cascaded from the last open review item leaving OPEN — POST /correspondent/defects/{id}/cure, POST /correspondent/defects/{id}/waive, POST /correspondent/suspense-conditions/{id}/clear, or POST /correspondent/loans/{id}/expire-conditions"
        actor: system
        preconditions:
          - "loan.purchase_status == SUSPENDED"
          - "loan.open_defect_count == 0 AND loan.open_suspense_count == 0 after the resolving mutation"
        side_effects:
          - "Loan.review_cycle_count += 1"
          - "increments Loan.version by 1"
        note: "Closes the cure cycle IN_REVIEW -> SUSPENDED -> IN_REVIEW; the loan may traverse it any number of times."
      - from: IN_REVIEW
        to: CLEARED_FOR_PURCHASE
        trigger: "POST /correspondent/loans/{id}/clear"
        actor: PurchaseReviewer
        preconditions:
          - "loan.purchase_status == IN_REVIEW"
          - "loan.open_defect_count == 0, else ERR_OPEN_DEFECTS_PRESENT"
          - "loan.open_suspense_count == 0, else ERR_OPEN_SUSPENSE_CONDITIONS"
          - "loan.non_curable_defect_count == 0, else ERR_NON_CURABLE_DEFECT_PRESENT"
        side_effects:
          - "increments Loan.version by 1"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /correspondent/loans/{id}/reject"
        actor: PurchaseReviewer
        preconditions:
          - "loan.purchase_status IN {IN_REVIEW, SUSPENDED}"
          - "loan.non_curable_defect_count >= 1, else ERR_NO_NON_CURABLE_DEFECT"
        side_effects:
          - "COMPENSATION of the delivery: Commitment.allocated_amount_cents -= loan.note_amount_cents and Commitment.available_amount_cents += loan.note_amount_cents, restoring the conserved notional identity"
          - "Commitment.status is NOT changed by a rejection"
          - "increments Commitment.version by 1"
          - "increments Loan.version by 1"
      - from: SUSPENDED
        to: REJECTED
        trigger: "POST /correspondent/loans/{id}/reject"
        actor: PurchaseReviewer
        preconditions: ["same preconditions as IN_REVIEW -> REJECTED"]
        side_effects: ["same side-effect set as IN_REVIEW -> REJECTED"]
      - from: CLEARED_FOR_PURCHASE
        to: PURCHASED
        trigger: "cascaded from PurchaseAdvice ISSUED -> SETTLED (POST /correspondent/purchase-advices/{id}/settle)"
        actor: system
        preconditions:
          - "loan.purchase_status == CLEARED_FOR_PURCHASE"
        side_effects:
          - "Loan.purchased_at = logical clock"
          - "when loan.servicing_election == RELEASED: an EscrowTransfer is created with status=PENDING, transfer_amount_cents = loan.escrow_balance_cents, transfer_due_at = purchased_at + ESCROW_TRANSFER_DAYS (no EscrowTransfer is created for RETAINED)"
          - "cascaded: parent Commitment fulfilled/allocated amounts update and the Commitment status transition fires (see Commitment machine), which in turn releases Seller.open_mandatory_exposure_cents when the commitment becomes terminal"
          - "increments Loan.version by 1"
      - from: PURCHASED
        to: REPURCHASE_DEMANDED
        trigger: "POST /correspondent/loans/{id}/repurchase-demands"
        actor: PurchaseReviewer
        preconditions:
          - "loan.purchase_status == PURCHASED"
        side_effects:
          - "increments Loan.version by 1"
      - from: REPURCHASE_DEMANDED
        to: PURCHASED
        trigger: "cascaded from RepurchaseDemand -> RESCINDED"
        actor: system
        preconditions:
          - "loan.purchase_status == REPURCHASE_DEMANDED"
        side_effects:
          - "increments Loan.version by 1"
        note: "Cyclic: a rescinded demand returns the loan to the purchased population and removes it from the scorecard's defective set."
      - from: REPURCHASE_DEMANDED
        to: REPURCHASED
        trigger: "cascaded from RepurchaseDemand -> SATISFIED (POST /correspondent/repurchase-demands/{id}/settle)"
        actor: system
        preconditions:
          - "loan.purchase_status == REPURCHASE_DEMANDED"
        side_effects:
          - "the loan's PurchaseAdvice with status == SETTLED transitions to REVERSED"
          - "the loan's EscrowTransfer with status IN {PENDING, COMPLETED} transitions to REVERSED with reversal_reason = REPURCHASE_SATISFIED"
          - "Commitment amounts are NOT adjusted (the commitment was fulfilled at purchase and stays fulfilled)"
          - "increments Loan.version by 1"

  - entity: Defect
    initial_state: OPEN
    terminal_states: [CURED, WAIVED, EXPIRED]
    transitions:
      - from: OPEN
        to: CURED
        trigger: "POST /correspondent/defects/{id}/cure"
        actor: SellerUser
        preconditions:
          - "defect.status == OPEN"
          - "defect.classification == CURABLE, else ERR_DEFECT_NOT_CURABLE"
          - "logical clock <= defect.cure_deadline_at (cure ON the deadline instant is on time), else ERR_CURE_WINDOW_EXPIRED"
          - "X-User-ID == loan.seller_id, else ERR_SELLER_SCOPE_VIOLATION"
        side_effects:
          - "Defect.cured_at = logical clock"
          - "Loan.open_defect_count -= 1"
          - "cascaded: Loan SUSPENDED -> IN_REVIEW when this was the last open review item"
          - "increments Defect.version by 1"
      - from: OPEN
        to: WAIVED
        trigger: "POST /correspondent/defects/{id}/waive"
        actor: PurchaseReviewer
        preconditions:
          - "defect.status == OPEN"
          - "defect.classification == CURABLE, else ERR_DEFECT_NOT_CURABLE"
          - "-100 <= price_adjustment_bps <= 0, else ERR_INVALID_REQUEST"
        side_effects:
          - "Defect.price_adjustment_bps = request price_adjustment_bps"
          - "Loan.open_defect_count -= 1"
          - "cascaded: Loan SUSPENDED -> IN_REVIEW when this was the last open review item"
          - "increments Defect.version by 1"
        note: "A waived defect keeps its severity, so a waived HIGH/CRITICAL defect still marks the loan defective on the scorecard."
      - from: OPEN
        to: EXPIRED
        trigger: "POST /correspondent/loans/{id}/expire-conditions (loan condition sweep)"
        actor: PurchaseReviewer
        preconditions:
          - "defect.status == OPEN"
          - "defect.classification == CURABLE and logical clock > defect.cure_deadline_at (strictly after)"
        side_effects:
          - "Loan.open_defect_count -= 1"
          - "the defect contributes EXPIRED_DEFECT_PENALTY_BPS to any later PurchaseAdvice"
          - "cascaded: Loan SUSPENDED -> IN_REVIEW when this was the last open review item"
          - "increments Defect.version by 1"

  - entity: SuspenseCondition
    initial_state: OPEN
    terminal_states: [CLEARED, EXPIRED]
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: "POST /correspondent/suspense-conditions/{id}/clear"
        actor: PurchaseReviewer
        preconditions:
          - "condition.status == OPEN"
          - "logical clock <= condition.due_at, else ERR_SUSPENSE_WINDOW_EXPIRED"
        side_effects:
          - "SuspenseCondition.cleared_at = logical clock"
          - "Loan.open_suspense_count -= 1"
          - "cascaded: Loan SUSPENDED -> IN_REVIEW when this was the last open review item"
          - "increments SuspenseCondition.version by 1"
      - from: OPEN
        to: EXPIRED
        trigger: "POST /correspondent/loans/{id}/expire-conditions (loan condition sweep)"
        actor: PurchaseReviewer
        preconditions:
          - "condition.status == OPEN"
          - "logical clock > condition.due_at (strictly after)"
        side_effects:
          - "Loan.open_suspense_count -= 1"
          - "cascaded: Loan SUSPENDED -> IN_REVIEW when this was the last open review item"
          - "increments SuspenseCondition.version by 1"
        note: "An EXPIRED condition no longer blocks clearing, unlike an EXPIRED defect which carries a price penalty."

  - entity: PurchaseAdvice
    initial_state: ISSUED
    terminal_states: [SUPERSEDED, VOIDED, REVERSED]
    transitions:
      - from: ISSUED
        to: SUPERSEDED
        trigger: "cascaded from a later POST /correspondent/loans/{id}/purchase-advices on the same loan"
        actor: system
        preconditions:
          - "advice.status == ISSUED"
        side_effects:
          - "increments PurchaseAdvice.version by 1"
        note: "Re-pricing after a waiver legitimately supersedes the prior advice; OCC on Loan.version is what pins which view of the loan the pricing was computed from."
      - from: ISSUED
        to: VOIDED
        trigger: "cascaded from Loan CLEARED_FOR_PURCHASE -> SUSPENDED (a new defect or condition landed after clearing)"
        actor: system
        preconditions:
          - "advice.status == ISSUED"
        side_effects:
          - "increments PurchaseAdvice.version by 1"
      - from: ISSUED
        to: SETTLED
        trigger: "POST /correspondent/purchase-advices/{id}/settle"
        actor: PurchaseReviewer
        preconditions:
          - "advice.status == ISSUED, else ERR_ADVICE_NOT_SETTLEABLE"
          - "loan.purchase_status == CLEARED_FOR_PURCHASE"
          - "X-User-ID != advice.issued_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "PurchaseAdvice.settled_at = logical clock; settled_by_user_id = X-User-ID"
          - "cascaded: Loan CLEARED_FOR_PURCHASE -> PURCHASED (which itself cascades to the Commitment and then to the Seller)"
          - "cascaded: Seller.net_funded_cents += PurchaseAdvice.net_wire_cents"
          - "increments PurchaseAdvice.version by 1"
      - from: SETTLED
        to: REVERSED
        trigger: "cascaded from Loan REPURCHASE_DEMANDED -> REPURCHASED"
        actor: system
        preconditions:
          - "advice.status == SETTLED"
        side_effects:
          - "cascaded: Seller.net_funded_cents -= RepurchaseDemand.funding_recovery_cents (equal to this advice's net_wire_cents), restoring the conserved cash quantity"
          - "increments PurchaseAdvice.version by 1"

  - entity: RepurchaseDemand
    initial_state: ISSUED
    terminal_states: [RESCINDED, SATISFIED]
    transitions:
      - from: ISSUED
        to: APPEALED
        trigger: "POST /correspondent/repurchase-demands/{id}/appeal"
        actor: SellerUser
        preconditions:
          - "demand.status == ISSUED"
          - "logical clock <= demand.appeal_deadline_at, else ERR_APPEAL_WINDOW_EXPIRED"
          - "X-User-ID == demand.seller_id, else ERR_SELLER_SCOPE_VIOLATION"
        side_effects:
          - "RepurchaseDemand.appeal_reason = request appeal_reason"
          - "loan.purchase_status stays REPURCHASE_DEMANDED"
          - "increments RepurchaseDemand.version by 1"
      - from: APPEALED
        to: RESCINDED
        trigger: "POST /correspondent/repurchase-demands/{id}/decision with decision=RESCIND"
        actor: PurchaseReviewer
        preconditions:
          - "demand.status IN {ISSUED, APPEALED}"
        side_effects:
          - "cascaded: Loan REPURCHASE_DEMANDED -> PURCHASED"
          - "the loan leaves the scorecard defective set contributed by this demand"
          - "Seller.net_funded_cents is NOT changed"
          - "RepurchaseDemand.decided_by_user_id = X-User-ID"
          - "increments RepurchaseDemand.version by 1"
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /correspondent/repurchase-demands/{id}/decision with decision=RESCIND"
        actor: PurchaseReviewer
        preconditions:
          - "demand.status IN {ISSUED, APPEALED}"
        side_effects:
          - "same side-effect set as APPEALED -> RESCINDED"
      - from: APPEALED
        to: UPHELD
        trigger: "POST /correspondent/repurchase-demands/{id}/decision with decision=UPHOLD"
        actor: PurchaseReviewer
        preconditions:
          - "demand.status == APPEALED, else ERR_DEMAND_NOT_ACTIONABLE (UPHOLD is unavailable on an un-appealed demand)"
        side_effects:
          - "RepurchaseDemand.decided_by_user_id = X-User-ID"
          - "increments RepurchaseDemand.version by 1"
        note: "UPHOLD is only reachable from APPEALED — the fork-join point where the two branches carry different side-effect sets."
      - from: ISSUED
        to: SATISFIED
        trigger: "POST /correspondent/repurchase-demands/{id}/settle"
        actor: SellerUser
        preconditions:
          - "demand.status IN {ISSUED, UPHELD}, else ERR_DEMAND_NOT_SETTLEABLE"
          - "X-User-ID == demand.seller_id, else ERR_SELLER_SCOPE_VIOLATION"
        side_effects:
          - "RepurchaseDemand.satisfied_at = logical clock"
          - "cascaded: Loan REPURCHASE_DEMANDED -> REPURCHASED, which cascades to PurchaseAdvice SETTLED -> REVERSED and EscrowTransfer -> REVERSED, which in turn unwinds Seller.net_funded_cents"
          - "cascaded: Seller.fee_receivable_cents += RepurchaseDemand.admin_fee_cents"
          - "increments RepurchaseDemand.version by 1"
      - from: UPHELD
        to: SATISFIED
        trigger: "POST /correspondent/repurchase-demands/{id}/settle"
        actor: SellerUser
        preconditions: ["same preconditions as ISSUED -> SATISFIED"]
        side_effects: ["same side-effect set as ISSUED -> SATISFIED"]

  - entity: EscrowTransfer
    initial_state: PENDING
    terminal_states: [COMPLETED, REVERSED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /correspondent/escrow-transfers/{id}/complete"
        actor: PurchaseReviewer
        preconditions:
          - "transfer.status == PENDING"
          - "loan.purchase_status == PURCHASED, else ERR_LOAN_UNDER_REPURCHASE"
          - "logical clock <= transfer.transfer_due_at, else ERR_ESCROW_TRANSFER_OVERDUE"
        side_effects:
          - "EscrowTransfer.completed_at = logical clock; goodbye_letter_reference recorded"
          - "increments EscrowTransfer.version by 1"
      - from: PENDING
        to: REVERSED
        trigger: "cascaded from Loan REPURCHASE_DEMANDED -> REPURCHASED"
        actor: system
        preconditions:
          - "transfer.status IN {PENDING, COMPLETED}"
        side_effects:
          - "EscrowTransfer.reversal_reason = REPURCHASE_SATISFIED"
          - "increments EscrowTransfer.version by 1"
      - from: COMPLETED
        to: REVERSED
        trigger: "cascaded from Loan REPURCHASE_DEMANDED -> REPURCHASED"
        actor: system
        preconditions: ["transfer.status IN {PENDING, COMPLETED}"]
        side_effects: ["same side-effect set as PENDING -> REVERSED"]

  - entity: SellerScorecard
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /correspondent/scorecards/{id}/close"
        actor: CounterpartyAnalyst
        preconditions:
          - "scorecard.status == OPEN"
          - "logical clock date > scorecard.period_end, else ERR_SCORECARD_PERIOD_NOT_ENDED"
        side_effects:
          - "all computed metrics are populated by calculations.seller_defect_rate_bps (both variants) and the grade table"
          - "SellerScorecard.closed_at = logical clock"
          - "cascaded: Seller.current_defect_rate_bps and Seller.current_scorecard_grade adopt this scorecard's values"
          - "cascaded: the standing action fires per calculations.scorecard_standing_action (WATCH / SUSPENDED / RECOVERED / NONE), and a SUSPENDED action itself cascades into Commitment cancellations and pair-off fees"
          - "increments SellerScorecard.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned
# write-write conflict mechanism)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: loan-delivery-stale-commitment
    parent_entity: Commitment
    write_endpoint: "POST /correspondent/commitments/{id}/loans"
    occ_field: "expected_commitment_version"
    description: |
      Delivering a closed loan file against a Commitment whose version has
      advanced since the client last read it is rejected. Remaining capacity is
      the product of every prior delivery, rejection and fill on that
      commitment, so a delivery computed against a stale view of
      allocated_amount_cents / available_amount_cents would silently over-commit
      the line. The stale-version check is observable with two strictly
      sequential requests: the first delivery advances Commitment.version, and a
      second delivery still carrying the pre-delivery version is refused.
    error_id: ERR_STALE_COMMITMENT_VERSION
    http_status: 412

  - rule_id: advice-create-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /correspondent/loans/{id}/purchase-advices"
    occ_field: "expected_loan_version"
    description: |
      Issuing a PurchaseAdvice against a Loan whose version has advanced since
      the client last read it is rejected. A new advice legitimately supersedes
      the prior ISSUED advice (re-pricing after a waiver or a cure), so the
      operation cannot be resolved by a state precondition — both the first and
      the second creation are individually valid. OCC on Loan.version pins which
      view of the loan the pricing was computed from; any defect waiver, cure,
      condition clearance or review-cycle transition in between advances the
      version and invalidates the stale request.
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: commitment_price_pct
    trigger: "POST /correspondent/commitments — evaluated once at lock creation and frozen onto Commitment.commitment_price_pct; never re-priced"
    algorithm: tiered_pricing
    formula: |
      lock_term_days = (delivery_expiry_date - delivery_window_start) in whole days

      # (1) lock-term tier: the LARGEST tabled term that is <= lock_term_days.
      #     lock_term_days < 15 selects 0 bps.
      lock_term_bps = 0
      for (term, bps) in [(15, 0), (30, -12), (45, -25), (60, -40)]:
          if lock_term_days >= term: lock_term_bps = bps

      # (2) llpa: SUM (order-insensitive, no single-winner selection) over every
      #     PricingAdjustment row with product_id == commitment.product_id AND
      #     status == ACTIVE AND fico_min <= reference_fico <= fico_max
      #     (both bounds INCLUSIVE) AND
      #     ltv_min_pct < reference_ltv_pct <= ltv_max_pct
      #     (lower bound EXCLUSIVE, upper bound INCLUSIVE).
      llpa_bps = sum(row.price_adjustment_bps for row in matching_rows)   # 0 when empty

      # (3) commitment-type spread
      type_bps = +25 if commitment_type == MANDATORY else -35

      raw_pct = product.base_price_pct + (lock_term_bps + llpa_bps + type_bps) / 100
      commitment_price_pct = round_half_up(
          max(PRICE_FLOOR_PCT, min(PRICE_CEILING_PCT, raw_pct)), 3)
    input_set: "the ACTIVE PricingAdjustment rows of the commitment's product at lock time; RETIRED rows and rows of other products are excluded"
    constants:
      LOCK_TERM_BPS_TABLE: { 15: 0, 30: -12, 45: -25, 60: -40 }
      MANDATORY_TYPE_BPS: 25
      BEST_EFFORTS_TYPE_BPS: -35
      PRICE_FLOOR_PCT: 98.000
      PRICE_CEILING_PCT: 104.000
    precision: "3 decimal places on percentages, round_half_up; the clamp is applied BEFORE rounding"
    variants: []

  - name: pair_off_fee_cents
    trigger: "Commitment {LOCKED, PARTIALLY_FULFILLED} -> PAIRED_OFF (POST /correspondent/commitments/{id}/pair-off), -> EXPIRED (POST /correspondent/commitments/expire-due), and -> CANCELLED (cascaded from seller suspension or termination); writes Commitment.pair_off_fee_cents and Commitment.pair_off_method"
    algorithm: threshold
    formula: |
      tolerance_cents = floor(notional_amount_cents * PAIR_OFF_TOLERANCE_PCT / 100)
      shortfall_cents = available_amount_cents            # measured BEFORE the write-off
      billable_cents  = max(0, shortfall_cents - tolerance_cents)

      # billable_cents == 0 (shortfall entirely inside tolerance) => fee 0 in
      # EVERY variant, including the administrative one.
      admin_fee_cents = PAIR_OFF_ADMIN_FEE_CENTS if billable_cents > 0 else 0
    input_set: "a single Commitment; available_amount_cents already nets out prior fills, prior pair-offs and rejected deliveries"
    constants:
      PAIR_OFF_TOLERANCE_PCT: 2.00
      PAIR_OFF_ADMIN_FEE_CENTS: 25000
    precision: "whole cents, round_half_up on the market-loss product; tolerance uses floor"
    variants:
      - name: mandatory_mark_to_market
        when: "explicit pair-off (POST .../pair-off) of a commitment with commitment_type == MANDATORY"
        difference: |
          market_loss_cents = round_half_up(billable_cents *
              max(0, commitment_price_pct - pair_off_market_price_pct) / 100)
          fee = market_loss_cents + admin_fee_cents
          A market price ABOVE the locked price yields zero market loss (the
          max(0, ...) floor), never a credit to the seller.
      - name: best_efforts_admin_only
        when: "explicit pair-off (POST .../pair-off) of a commitment with commitment_type == BEST_EFFORTS"
        difference: |
          fee = admin_fee_cents
          No mark-to-market component is assessed at all: for identical
          notional / fulfilled / market-price inputs this variant returns a
          strictly smaller fee than mandatory_mark_to_market whenever
          commitment_price_pct > pair_off_market_price_pct.
      - name: administrative_flat
        when: "the commitment leaves the live set WITHOUT an observed market price — expiry sweep or seller-suspension/termination cancellation, for BOTH commitment types"
        difference: |
          fee = admin_fee_cents
          No market price is observed on these paths, so no mark-to-market is
          assessed even for MANDATORY commitments.

  - name: volume_incentive_bps
    trigger: "POST /correspondent/loans/{id}/purchase-advices — evaluated once at advice issuance, frozen onto PurchaseAdvice.volume_incentive_bps, and NOT recomputed at settlement"
    algorithm: threshold
    formula: |
      # EVALUATION ORDER IS PINNED to break the circular appearance: the
      # incentive raises the price, the price raises the proceeds, and the
      # proceeds would raise the volume that selects the incentive. The tier is
      # measured over loans ALREADY PURCHASED, i.e. STRICTLY EXCLUDING the loan
      # under advice (which is still CLEARED_FOR_PURCHASE at this instant).
      month_start = first day of the advice issuance date's calendar month, T00:00:00Z
      mtd_upb_cents = sum(l.note_amount_cents for l in Loan
                          where l.seller_id == loan.seller_id
                            and l.purchase_status IN {PURCHASED, REPURCHASE_DEMANDED, REPURCHASED}
                            and month_start <= l.purchased_at < advice issuance instant)

      volume_incentive_bps = 0
      if mtd_upb_cents >= VOLUME_TIER_1_CENTS: volume_incentive_bps = 5
      if mtd_upb_cents >= VOLUME_TIER_2_CENTS: volume_incentive_bps = 10

      final_purchase_price_pct = round_half_up(
          commitment.commitment_price_pct + volume_incentive_bps / 100, 3)
    input_set: "the seller's own loans only; loans of other sellers, loans REJECTED, and the loan under advice itself are excluded"
    constants:
      VOLUME_TIER_1_CENTS: 100000000
      VOLUME_TIER_2_CENTS: 250000000
      TIER_1_BPS: 5
      TIER_2_BPS: 10
    precision: "integer basis points; the resulting price is rounded to 3 decimals half-up"
    variants: []

  - name: purchase_advice_net_wire_cents
    trigger: "POST /correspondent/loans/{id}/purchase-advices — writes every money field of PurchaseAdvice including net_wire_cents"
    algorithm: aggregation
    formula: |
      accrued_days = (advice issuance date - loan.closing_date) in whole days

      # ROUNDING ORDER IS PINNED: each component is rounded to whole cents
      # INDEPENDENTLY with round_half_up, and only THEN summed. Summing the
      # exact rational components first and rounding once at the end is the
      # WRONG order and can differ by one cent.
      principal_purchase_cents      = round_half_up(note_amount_cents * final_purchase_price_pct / 100)
      accrued_interest_cents        = round_half_up(note_amount_cents * note_rate_pct / 100 * accrued_days / 360)
      escrow_funding_cents          = escrow_balance_cents if servicing_election == RELEASED else 0
      service_release_premium_cents = round_half_up(note_amount_cents * product.srp_pct / 100)
                                      if servicing_election == RELEASED else 0

      # Per-defect rounding is ALSO independent: each contributing defect's hit
      # is rounded on its own, then the rounded hits are summed. Only WAIVED and
      # EXPIRED defects contribute; CURED defects contribute nothing.
      defect_price_adjustment_cents = - sum(
          round_half_up(note_amount_cents * abs(bps_of(d)) / 10000)
          for d in loan.defects where d.status IN {WAIVED, EXPIRED})
        where bps_of(d) = d.price_adjustment_bps if d.status == WAIVED
                          else EXPIRED_DEFECT_PENALTY_BPS

      wire_fee_cents = WIRE_FEE_CENTS

      net_wire_cents = principal_purchase_cents
                     + accrued_interest_cents
                     + escrow_funding_cents
                     + service_release_premium_cents
                     + defect_price_adjustment_cents      # negative or zero
                     - wire_fee_cents
    input_set: "the loan's own child Defects with status IN {WAIVED, EXPIRED}; OPEN defects cannot exist at issuance because the loan must be CLEARED_FOR_PURCHASE, and CURED defects carry no price impact"
    constants:
      WIRE_FEE_CENTS: 3500
      EXPIRED_DEFECT_PENALTY_BPS: -50
      DAY_COUNT_BASIS: 360
    precision: "whole cents, round_half_up, applied PER COMPONENT and PER DEFECT before summation"
    variants: []

  - name: seller_defect_rate_bps
    trigger: "POST /correspondent/scorecards/{id}/close — writes SellerScorecard.defect_rate_bps, upb_weighted_defect_rate_bps, defective_loan_count, defective_upb_cents, grade and breach"
    algorithm: weighted_scoring
    formula: |
      # scored population: the CLOSED period interval is inclusive on BOTH ends
      window = [period_start T00:00:00.000Z, period_end T23:59:59.999Z]
      scored = [l for l in Loan
                where l.seller_id == scorecard.seller_id
                  and l.purchase_status IN {PURCHASED, REPURCHASE_DEMANDED, REPURCHASED}
                  and l.purchased_at within window]

      # defective predicate (evaluated at close time, not at purchase time)
      defective(l) = (exists d in l.defects
                        where d.severity IN {HIGH, CRITICAL}
                          and d.status IN {WAIVED, EXPIRED})
                  or (exists r in l.repurchase_demands
                        where r.status IN {ISSUED, APPEALED, UPHELD, SATISFIED})
      # RESCINDED demands and CURED defects never mark a loan defective.

      purchased_loan_count = len(scored)
      purchased_upb_cents  = sum(l.note_amount_cents for l in scored)
      defective_loan_count = len([l for l in scored if defective(l)])
      defective_upb_cents  = sum(l.note_amount_cents for l in scored if defective(l))

      # EMPTY-SET GUARD: an empty scored population yields 0 for both rates and
      # grade UNRATED; no division is attempted.
      if purchased_loan_count == 0:
          defect_rate_bps = 0; upb_weighted_defect_rate_bps = 0
      else:
          defect_rate_bps = round_half_up(10000 * defective_loan_count / purchased_loan_count)
          upb_weighted_defect_rate_bps = round_half_up(10000 * defective_upb_cents / purchased_upb_cents)

      grade = UNRATED if purchased_loan_count < MIN_SCORED_LOANS
              else A if defect_rate_bps <= GRADE_A_MAX_BPS
              else B if defect_rate_bps <= GRADE_B_MAX_BPS
              else C if defect_rate_bps <= GRADE_C_MAX_BPS
              else D
      breach = (purchased_loan_count >= MIN_SCORED_LOANS
                and defect_rate_bps > DEFECT_RATE_SUSPENSION_BPS)   # STRICTLY greater
    input_set: "only the seller's own loans whose purchased_at falls inside the closed period; REJECTED and still-in-review loans are excluded regardless of their defects"
    constants:
      MIN_SCORED_LOANS: 2
      GRADE_A_MAX_BPS: 1000
      GRADE_B_MAX_BPS: 2500
      GRADE_C_MAX_BPS: 5000
      DEFECT_RATE_WATCH_BPS: 1000
      DEFECT_RATE_SUSPENSION_BPS: 5000
    precision: "integer basis points, round_half_up on the ratio times 10000"
    variants:
      - name: loan_count_weighted
        when: "always computed; the GOVERNING variant for grade, breach and every standing action"
        difference: |
          Weights each scored loan equally: 10000 * defective_loan_count /
          purchased_loan_count.
      - name: upb_weighted
        when: "always computed alongside, published on the scorecard for governance reporting only"
        difference: |
          Weights each scored loan by note_amount_cents: 10000 *
          defective_upb_cents / purchased_upb_cents. For the same population
          this diverges from loan_count_weighted whenever the defective loans
          are not of average size, and it MUST NOT be used for grading or
          suspension even when it is the smaller of the two.

  - name: scorecard_standing_action
    trigger: "POST /correspondent/scorecards/{id}/close — writes SellerScorecard.standing_action_applied and drives the Seller.delivery_standing transition"
    algorithm: threshold
    formula: |
      rate = scorecard.defect_rate_bps          # loan_count_weighted variant ONLY
      if scorecard.purchased_loan_count < MIN_SCORED_LOANS:
          action = NONE                          # sample too small: standing untouched
      elif rate > DEFECT_RATE_SUSPENSION_BPS:    # STRICT >; exactly 5000 does NOT suspend
          action = SUSPENDED
      elif rate > DEFECT_RATE_WATCH_BPS:         # STRICT >; exactly 1000 does NOT watch
          action = WATCH
      else:
          action = RECOVERED if seller.delivery_standing == WATCH else NONE

      # application rules
      SUSPENDED: applied only when seller.delivery_standing IN {GOOD_STANDING, WATCH};
                 sets suspension_reason = SCORECARD_DEFECT_RATE and cancels every
                 commitment of the seller with status IN {LOCKED, PARTIALLY_FULFILLED}
                 AND allocated_amount_cents == 0 (ordered by Commitment.created_at ASC)
      WATCH:     applied only when seller.delivery_standing == GOOD_STANDING
      RECOVERED: applied only when seller.delivery_standing == WATCH -> GOOD_STANDING
      NONE:      Seller.delivery_standing is left exactly as it was
    input_set: "one closed scorecard and the current Seller row; commitments are cancelled in Commitment.created_at ASC order (never id order)"
    constants:
      MIN_SCORED_LOANS: 2
      DEFECT_RATE_WATCH_BPS: 1000
      DEFECT_RATE_SUSPENSION_BPS: 5000
    precision: "integer comparisons only"
    variants: []

  - name: defect_classification
    trigger: "POST /correspondent/loans/{id}/defects — writes Defect.classification and Defect.cure_deadline_at"
    algorithm: constraint_propagation
    formula: |
      classification = NON_CURABLE if (severity == CRITICAL
                                       or (category == COMPLIANCE and severity == HIGH))
                       else CURABLE

      cure_deadline_at = null if classification == NON_CURABLE
                         else created_at + CURE_WINDOW_DAYS[severity]
      # A cure landing exactly ON cure_deadline_at is ON TIME (<=); the sweep
      # expires a defect only when the clock is STRICTLY past the deadline.
    input_set: "the single defect being recorded; the request's own classification value, if any, is ignored"
    constants:
      CURE_WINDOW_DAYS: { LOW: 15, MEDIUM: 10, HIGH: 5 }
      SUSPENSE_WINDOW_DAYS: 7
    precision: "datetime arithmetic on the logical clock, ISO 8601 UTC with three fractional digits"
    variants: []

  - name: qc_review_outcome
    trigger: "POST /correspondent/qc-reviews/{id}/complete — writes QualityControlReview.outcome"
    algorithm: threshold
    formula: |
      outcome = FAIL            if critical_findings_count >= 1
                CONDITIONAL_PASS if findings_count >= CONDITIONAL_PASS_FINDINGS_THRESHOLD
                PASS             otherwise
      # findings_count exactly at the threshold yields CONDITIONAL_PASS (>=).
    input_set: "the two counts supplied on the completion request"
    constants:
      CONDITIONAL_PASS_FINDINGS_THRESHOLD: 5
    precision: "integer comparisons only"
    variants: []

  - name: seller_mandatory_exposure_limit
    trigger: "POST /correspondent/sellers/{id}/approval-decision with decision=APPROVE — writes Seller.mandatory_exposure_limit_cents"
    algorithm: threshold
    formula: |
      multiplier = NET_WORTH_MULTIPLIER_STANDARD    if governing_review.outcome == PASS
                   else NET_WORTH_MULTIPLIER_CONDITIONAL
      mandatory_exposure_limit_cents = min(
          multiplier * governing_statement.tangible_net_worth_cents,
          MANDATORY_EXPOSURE_ABSOLUTE_CAP_CENTS)
    input_set: "the governing FinancialStatement and governing QualityControlReview selected by the approval transition's ordering rules"
    constants:
      NET_WORTH_MULTIPLIER_STANDARD: 10
      NET_WORTH_MULTIPLIER_CONDITIONAL: 5
      MANDATORY_EXPOSURE_ABSOLUTE_CAP_CENTS: 5000000000
      MIN_TANGIBLE_NET_WORTH_CENTS: 250000000
      MIN_LIQUIDITY_CENTS: 50000000
      FS_STALENESS_DAYS: 455
    precision: "whole cents, exact integer arithmetic"
    variants: []

  - name: repurchase_price_cents
    trigger: "POST /correspondent/loans/{id}/repurchase-demands — writes RepurchaseDemand.funding_recovery_cents, admin_fee_cents and repurchase_price_cents"
    algorithm: aggregation
    formula: |
      settled_advice = the loan's PurchaseAdvice with status == SETTLED
                       (exactly one exists for any loan in PURCHASED or later)
      funding_recovery_cents = settled_advice.net_wire_cents
      admin_fee_cents        = REPURCHASE_ADMIN_FEE_CENTS
      repurchase_price_cents = funding_recovery_cents + admin_fee_cents
      # The recovery is pinned to the exact amount wired, so satisfying the
      # demand returns Seller.net_funded_cents to its pre-purchase value with
      # zero drift; the admin fee is booked to fee_receivable_cents instead and
      # never contaminates net_funded_cents.
    input_set: "the single SETTLED PurchaseAdvice of the loan; SUPERSEDED, VOIDED and REVERSED advices are excluded"
    constants:
      REPURCHASE_ADMIN_FEE_CENTS: 50000
      EPD_DEMAND_WINDOW_DAYS: 120
      APPEAL_WINDOW_DAYS: 30
      ESCROW_TRANSFER_DAYS: 15
    precision: "whole cents, exact integer arithmetic"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority; lowest number wins when a
# single request violates several rows)
#
# Group layout: 1 authentication -> 2 authorization -> 3-14 existence
# (left-to-right along the path) -> 15 request schema -> 16 ownership ->
# 17 segregation of duties -> 18-19 optimistic concurrency ->
# 20-32 state preconditions -> 33-42 business_safety (counterparty eligibility
# and consumer/compliance gates) -> 43-45 business_referential (product
# eligibility) -> 46-54 business_temporal (windows, expiries, overlaps) ->
# 55-64 business_constraint (uniqueness, evidence, outstanding children) ->
# 66-67 business_fiscal (capacity and exposure limits, always last).
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the X-User-Role value is one of the roles listed on the endpoint in §1.5"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "{id} in the path resolves to an existing Seller"
    error_id: ERR_SELLER_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {id}"

  - priority: 4
    category: existence
    check: "{id} in the path resolves to an existing ProductEligibility"
    error_id: ERR_PRODUCT_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {id}"

  - priority: 5
    category: existence
    check: "{id} in the path resolves to an existing FinancialStatement"
    error_id: ERR_STATEMENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /correspondent/financial-statements/{id}/review"

  - priority: 6
    category: existence
    check: "{id} in the path resolves to an existing QualityControlReview"
    error_id: ERR_QC_REVIEW_NOT_FOUND
    http_status: 404
    applies_to: "POST /correspondent/qc-reviews/{id}/complete"

  - priority: 7
    category: existence
    check: "{id} in the path resolves to an existing Commitment"
    error_id: ERR_COMMITMENT_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {id}"

  - priority: 8
    category: existence
    check: "{id} in the path resolves to an existing Loan"
    error_id: ERR_LOAN_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {id}"

  - priority: 9
    category: existence
    check: "{id} in the path resolves to an existing Defect"
    error_id: ERR_DEFECT_NOT_FOUND
    http_status: 404
    applies_to: "POST /correspondent/defects/{id}/cure, POST /correspondent/defects/{id}/waive"

  - priority: 10
    category: existence
    check: "{id} in the path resolves to an existing SuspenseCondition"
    error_id: ERR_CONDITION_NOT_FOUND
    http_status: 404
    applies_to: "POST /correspondent/suspense-conditions/{id}/clear"

  - priority: 11
    category: existence
    check: "{id} in the path resolves to an existing PurchaseAdvice"
    error_id: ERR_ADVICE_NOT_FOUND
    http_status: 404
    applies_to: "POST /correspondent/purchase-advices/{id}/settle"

  - priority: 12
    category: existence
    check: "{id} in the path resolves to an existing RepurchaseDemand"
    error_id: ERR_DEMAND_NOT_FOUND
    http_status: 404
    applies_to: "all paths containing {id}"

  - priority: 13
    category: existence
    check: "{id} in the path resolves to an existing EscrowTransfer"
    error_id: ERR_TRANSFER_NOT_FOUND
    http_status: 404
    applies_to: "POST /correspondent/escrow-transfers/{id}/complete"

  - priority: 14
    category: existence
    check: "{id} in the path resolves to an existing SellerScorecard"
    error_id: ERR_SCORECARD_NOT_FOUND
    http_status: 404
    applies_to: "POST /correspondent/scorecards/{id}/close"

  - priority: 15
    category: business_constraint
    check: "request body carries every required input field, no unknown field is required to be honoured, every enum value is a declared member, every *_cents / *_count / *_bps value is an integer, every *_pct value is a number, every date is ISO-8601, and body-referenced ids (product_id, commitment_id, seller_id, source_defect_id) resolve to existing rows of the right entity"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 16
    category: auth
    check: "when X-User-Role is SellerUser, X-User-ID equals the Seller.id that owns the addressed resource (Seller itself, or the seller_id of the Commitment / Loan / FinancialStatement / SellerScorecard / RepurchaseDemand reached through the path or body)"
    error_id: ERR_SELLER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "every endpoint whose roles list includes SellerUser"

  - priority: 17
    category: business_safety
    check: "segregation of duties: on POST /correspondent/sellers/{id}/approval-decision the X-User-ID must differ from the completed_by_user_id of the governing QualityControlReview; on POST /correspondent/purchase-advices/{id}/settle the X-User-ID must differ from PurchaseAdvice.issued_by_user_id; on POST /correspondent/repurchase-demands/{id}/decision the X-User-ID must differ from RepurchaseDemand.issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /correspondent/sellers/{id}/approval-decision, POST /correspondent/purchase-advices/{id}/settle, POST /correspondent/repurchase-demands/{id}/decision"

  - priority: 18
    category: state
    check: "expected_commitment_version equals the addressed Commitment's current version"
    error_id: ERR_STALE_COMMITMENT_VERSION
    http_status: 412
    applies_to: "POST /correspondent/commitments/{id}/loans"

  - priority: 19
    category: state
    check: "expected_loan_version equals the addressed Loan's current version"
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412
    applies_to: "POST /correspondent/loans/{id}/purchase-advices"

  - priority: 20
    category: state
    check: "Seller.approval_status permits the operation: financial-statement and qc-review creation require APPLIED or UNDER_REVIEW; approval-decision requires UNDER_REVIEW; standing-actions require APPROVED"
    error_id: ERR_INVALID_SELLER_STATE
    http_status: 409
    applies_to: "POST /correspondent/sellers/{id}/financial-statements, POST /correspondent/sellers/{id}/qc-reviews, POST /correspondent/sellers/{id}/approval-decision, POST /correspondent/sellers/{id}/standing-actions"

  - priority: 21
    category: state
    check: "the addressed FinancialStatement is in SUBMITTED"
    error_id: ERR_STATEMENT_NOT_REVIEWABLE
    http_status: 409
    applies_to: "POST /correspondent/financial-statements/{id}/review"

  - priority: 22
    category: state
    check: "the addressed QualityControlReview is in OPEN"
    error_id: ERR_QC_REVIEW_NOT_OPEN
    http_status: 409
    applies_to: "POST /correspondent/qc-reviews/{id}/complete"

  - priority: 23
    category: state
    check: "the addressed Commitment is in LOCKED or PARTIALLY_FULFILLED (delivery, pair-off); FULFILLED, PAIRED_OFF, EXPIRED and CANCELLED commitments accept nothing"
    error_id: ERR_COMMITMENT_NOT_OPEN
    http_status: 409
    applies_to: "POST /correspondent/commitments/{id}/loans, POST /correspondent/commitments/{id}/pair-off"

  - priority: 24
    category: state
    check: "the addressed Loan's purchase_status permits the operation: review requires DELIVERED; defect creation requires IN_REVIEW, SUSPENDED or PURCHASED (a post-purchase QC finding is recorded without disturbing a completed purchase); suspense-condition creation requires IN_REVIEW or SUSPENDED; clear requires IN_REVIEW or SUSPENDED (a SUSPENDED loan then always fails the open-item gates at priorities 41 / 59 / 60, so it never reaches CLEARED_FOR_PURCHASE by this route); reject requires IN_REVIEW or SUSPENDED; advice creation requires CLEARED_FOR_PURCHASE; repurchase-demand creation requires PURCHASED"
    error_id: ERR_INVALID_LOAN_STATE
    http_status: 409
    applies_to: "POST /correspondent/loans/{id}/review, POST /correspondent/loans/{id}/defects, POST /correspondent/loans/{id}/suspense-conditions, POST /correspondent/loans/{id}/clear, POST /correspondent/loans/{id}/reject, POST /correspondent/loans/{id}/purchase-advices, POST /correspondent/loans/{id}/repurchase-demands"

  - priority: 25
    category: state
    check: "the addressed Defect is in OPEN"
    error_id: ERR_DEFECT_NOT_OPEN
    http_status: 409
    applies_to: "POST /correspondent/defects/{id}/cure, POST /correspondent/defects/{id}/waive"

  - priority: 26
    category: state
    check: "the addressed SuspenseCondition is in OPEN"
    error_id: ERR_CONDITION_NOT_OPEN
    http_status: 409
    applies_to: "POST /correspondent/suspense-conditions/{id}/clear"

  - priority: 27
    category: state
    check: "the addressed PurchaseAdvice is in ISSUED"
    error_id: ERR_ADVICE_NOT_SETTLEABLE
    http_status: 409
    applies_to: "POST /correspondent/purchase-advices/{id}/settle"

  - priority: 28
    category: state
    check: "the addressed RepurchaseDemand is in the right state for the action: appeal requires status == ISSUED; decision=RESCIND requires status IN {ISSUED, APPEALED}; decision=UPHOLD requires status == APPEALED (an un-appealed demand cannot be upheld, only rescinded or settled)"
    error_id: ERR_DEMAND_NOT_ACTIONABLE
    http_status: 409
    applies_to: "POST /correspondent/repurchase-demands/{id}/appeal, POST /correspondent/repurchase-demands/{id}/decision"

  - priority: 29
    category: state
    check: "the addressed RepurchaseDemand is in ISSUED or UPHELD (a RESCINDED, APPEALED or already SATISFIED demand cannot be settled)"
    error_id: ERR_DEMAND_NOT_SETTLEABLE
    http_status: 409
    applies_to: "POST /correspondent/repurchase-demands/{id}/settle"

  - priority: 30
    category: state
    check: "the addressed EscrowTransfer is in PENDING"
    error_id: ERR_TRANSFER_NOT_PENDING
    http_status: 409
    applies_to: "POST /correspondent/escrow-transfers/{id}/complete"

  - priority: 31
    category: state
    check: "the addressed SellerScorecard is in OPEN"
    error_id: ERR_SCORECARD_NOT_OPEN
    http_status: 409
    applies_to: "POST /correspondent/scorecards/{id}/close"

  - priority: 32
    category: state
    check: "the addressed Commitment has allocated_amount_cents == 0 — loans already delivered and still in the purchase pipeline must be purchased or rejected before the line can be paired off"
    error_id: ERR_ALLOCATION_OUTSTANDING
    http_status: 409
    applies_to: "POST /correspondent/commitments/{id}/pair-off"

  - priority: 33
    category: business_safety
    check: "the Seller has approval_status == APPROVED before any commitment is locked in its name"
    error_id: ERR_SELLER_NOT_APPROVED
    http_status: 409
    applies_to: "POST /correspondent/commitments"

  - priority: 34
    category: business_safety
    check: "the Seller's delivery_standing is GOOD_STANDING or WATCH; SUSPENDED, TERMINATED and NOT_ELIGIBLE sellers may neither lock new commitments nor deliver loans"
    error_id: ERR_SELLER_DELIVERY_SUSPENDED
    http_status: 409
    applies_to: "POST /correspondent/commitments, POST /correspondent/commitments/{id}/loans"

  - priority: 35
    category: business_safety
    check: "approval requires at least one FinancialStatement in ACCEPTED status"
    error_id: ERR_NO_ACCEPTED_STATEMENT
    http_status: 409
    applies_to: "POST /correspondent/sellers/{id}/approval-decision with decision=APPROVE"

  - priority: 36
    category: business_safety
    check: "the governing ACCEPTED statement's fiscal_year_end is no more than FS_STALENESS_DAYS (455) days before the current logical clock date"
    error_id: ERR_FINANCIAL_STATEMENT_STALE
    http_status: 409
    applies_to: "POST /correspondent/sellers/{id}/approval-decision with decision=APPROVE"

  - priority: 37
    category: business_safety
    check: "the governing statement's tangible_net_worth_cents >= MIN_TANGIBLE_NET_WORTH_CENTS (250000000); exactly at the minimum passes"
    error_id: ERR_NET_WORTH_BELOW_MINIMUM
    http_status: 409
    applies_to: "POST /correspondent/sellers/{id}/approval-decision with decision=APPROVE"

  - priority: 38
    category: business_safety
    check: "the governing statement's liquid_assets_cents >= MIN_LIQUIDITY_CENTS (50000000); exactly at the minimum passes"
    error_id: ERR_LIQUIDITY_BELOW_MINIMUM
    http_status: 409
    applies_to: "POST /correspondent/sellers/{id}/approval-decision with decision=APPROVE"

  - priority: 39
    category: business_safety
    check: "at least one QualityControlReview of the seller is in COMPLETED status"
    error_id: ERR_QC_REVIEW_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /correspondent/sellers/{id}/approval-decision with decision=APPROVE"

  - priority: 40
    category: business_safety
    check: "the governing QualityControlReview's outcome is PASS or CONDITIONAL_PASS; a FAIL outcome blocks approval outright"
    error_id: ERR_QC_REVIEW_FAILED
    http_status: 409
    applies_to: "POST /correspondent/sellers/{id}/approval-decision with decision=APPROVE"

  - priority: 41
    category: business_safety
    check: "the Loan has zero Defects with classification == NON_CURABLE and status == OPEN before it can be cleared for purchase"
    error_id: ERR_NON_CURABLE_DEFECT_PRESENT
    http_status: 409
    applies_to: "POST /correspondent/loans/{id}/clear"

  - priority: 42
    category: business_safety
    check: "the Loan is not under an unresolved repurchase demand (purchase_status NOT IN {REPURCHASE_DEMANDED, REPURCHASED}); escrow may not be transferred to the investor while the loan is being pulled back to the seller"
    error_id: ERR_LOAN_UNDER_REPURCHASE
    http_status: 409
    applies_to: "POST /correspondent/escrow-transfers/{id}/complete"

  - priority: 43
    category: business_referential
    check: "the product is ACTIVE and the delivery satisfies its eligibility matrix: fico >= min_fico, ltv_pct <= max_ltv_pct, note_amount_cents <= max_loan_amount_cents, occupancy IN allowed_occupancies (all bounds inclusive)"
    error_id: ERR_PRODUCT_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /correspondent/commitments (product ACTIVE only), POST /correspondent/commitments/{id}/loans (full matrix)"

  - priority: 44
    category: business_referential
    check: "the requested commitment_type appears in the product's allowed_commitment_types list"
    error_id: ERR_COMMITMENT_TYPE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /correspondent/commitments"

  - priority: 45
    category: business_referential
    check: "servicing_election == RETAINED is only accepted when the Seller has servicing_retained_eligible == true"
    error_id: ERR_SERVICING_RETAINED_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /correspondent/commitments/{id}/loans"

  - priority: 46
    category: business_temporal
    check: "the current logical clock instant is inside the commitment's half-open delivery window [delivery_window_start T00:00:00Z, delivery_expiry_date T00:00:00Z); the expiry date itself is already outside"
    error_id: ERR_COMMITMENT_EXPIRED
    http_status: 409
    applies_to: "POST /correspondent/commitments/{id}/loans"

  - priority: 47
    category: business_temporal
    check: "a new MANDATORY commitment's half-open delivery window must not overlap the window of any existing MANDATORY commitment of the same seller and product with status IN {LOCKED, PARTIALLY_FULFILLED}; touching windows (one starting exactly on another's expiry date) do not overlap, and BEST_EFFORTS commitments are exempt in both directions"
    error_id: ERR_DELIVERY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /correspondent/commitments"

  - priority: 48
    category: business_temporal
    check: "a new SellerScorecard's closed period [period_start, period_end] must not overlap any existing scorecard period of the same seller regardless of status; sharing a single endpoint date is an overlap"
    error_id: ERR_SCORECARD_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /correspondent/sellers/{id}/scorecards"

  - priority: 49
    category: business_temporal
    check: "a scorecard may only be closed once the logical clock is strictly past period_end T23:59:59.999Z"
    error_id: ERR_SCORECARD_PERIOD_NOT_ENDED
    http_status: 409
    applies_to: "POST /correspondent/scorecards/{id}/close"

  - priority: 50
    category: business_temporal
    check: "a cure is accepted only while the logical clock is <= Defect.cure_deadline_at; landing exactly on the deadline instant is on time"
    error_id: ERR_CURE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /correspondent/defects/{id}/cure"

  - priority: 51
    category: business_temporal
    check: "a suspense condition may be cleared only while the logical clock is <= SuspenseCondition.due_at"
    error_id: ERR_SUSPENSE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /correspondent/suspense-conditions/{id}/clear"

  - priority: 52
    category: business_temporal
    check: "an EPD repurchase demand may be issued only while the logical clock is within EPD_DEMAND_WINDOW_DAYS (120) days after Loan.first_payment_due_date"
    error_id: ERR_EPD_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /correspondent/loans/{id}/repurchase-demands with reason=EPD"

  - priority: 53
    category: business_temporal
    check: "an appeal is accepted only while the logical clock is <= RepurchaseDemand.appeal_deadline_at"
    error_id: ERR_APPEAL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /correspondent/repurchase-demands/{id}/appeal"

  - priority: 54
    category: business_temporal
    check: "an escrow transfer may be completed only while the logical clock is <= EscrowTransfer.transfer_due_at; a late transfer must be escalated off-platform rather than booked"
    error_id: ERR_ESCROW_TRANSFER_OVERDUE
    http_status: 409
    applies_to: "POST /correspondent/escrow-transfers/{id}/complete"

  - priority: 55
    category: business_constraint
    check: "Seller.tin is unique across all sellers"
    error_id: ERR_DUPLICATE_TIN
    http_status: 409
    applies_to: "POST /correspondent/sellers"

  - priority: 56
    category: business_constraint
    check: "ProductEligibility.product_code is unique across all products"
    error_id: ERR_DUPLICATE_PRODUCT_CODE
    http_status: 409
    applies_to: "POST /correspondent/products"

  - priority: 57
    category: business_constraint
    check: "PricingAdjustment.adjustment_code is unique within its product"
    error_id: ERR_DUPLICATE_ADJUSTMENT_CODE
    http_status: 409
    applies_to: "POST /correspondent/products/{id}/pricing-adjustments"

  - priority: 58
    category: business_constraint
    check: "Loan.seller_loan_number is unique within its seller"
    error_id: ERR_DUPLICATE_SELLER_LOAN_NUMBER
    http_status: 409
    applies_to: "POST /correspondent/commitments/{id}/loans"

  - priority: 59
    category: business_constraint
    check: "the Loan has zero Defects in OPEN status before it can be cleared for purchase"
    error_id: ERR_OPEN_DEFECTS_PRESENT
    http_status: 409
    applies_to: "POST /correspondent/loans/{id}/clear"

  - priority: 60
    category: business_constraint
    check: "the Loan has zero SuspenseConditions in OPEN status before it can be cleared for purchase"
    error_id: ERR_OPEN_SUSPENSE_CONDITIONS
    http_status: 409
    applies_to: "POST /correspondent/loans/{id}/clear"

  - priority: 61
    category: business_constraint
    check: "only a Defect with classification == CURABLE may be cured or waived; a NON_CURABLE defect can neither be cured nor waived and forces the loan to be rejected"
    error_id: ERR_DEFECT_NOT_CURABLE
    http_status: 409
    applies_to: "POST /correspondent/defects/{id}/cure, POST /correspondent/defects/{id}/waive"

  - priority: 62
    category: business_constraint
    check: "a loan may only be rejected when it carries at least one Defect with classification == NON_CURABLE and status == OPEN"
    error_id: ERR_NO_NON_CURABLE_DEFECT
    http_status: 409
    applies_to: "POST /correspondent/loans/{id}/reject"

  - priority: 63
    category: business_constraint
    check: "a DEFECT-reason or MISREPRESENTATION-reason demand requires source_defect_id naming a Defect of this loan whose severity IN {HIGH, CRITICAL} and whose status IN {WAIVED, EXPIRED}; a CURED defect is not repurchase evidence"
    error_id: ERR_DEFECT_EVIDENCE_REQUIRED
    http_status: 422
    applies_to: "POST /correspondent/loans/{id}/repurchase-demands with reason IN {DEFECT, MISREPRESENTATION}"

  - priority: 64
    category: business_constraint
    check: "an EPD-reason demand requires Loan.first_payment_status == MISSED"
    error_id: ERR_EPD_NOT_ESTABLISHED
    http_status: 409
    applies_to: "POST /correspondent/loans/{id}/repurchase-demands with reason=EPD"

  - priority: 66
    category: business_fiscal
    check: "the delivered note_amount_cents must not exceed the commitment's available_amount_cents"
    error_id: ERR_COMMITMENT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /correspondent/commitments/{id}/loans"

  - priority: 67
    category: business_fiscal
    check: "for a MANDATORY commitment, Seller.open_mandatory_exposure_cents + notional_amount_cents must not exceed Seller.mandatory_exposure_limit_cents; exactly at the limit is allowed"
    error_id: ERR_MANDATORY_EXPOSURE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /correspondent/commitments"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table — 51 endpoints, all under api_prefix /correspondent
# ---------------------------------------------------------------------------
endpoints:
  # ---- test-driving surface (last rung of the §1.5 priority ladder) ----
  - method: POST
    path: "/correspondent/_clock/set_current_utc"
    description: "Sets the server's logical clock to an explicit UTC instant. The clock's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every deadline, expiry, accrual and window rule in this domain reads this logical clock only."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "null"
    side_effects:
      - "the logical clock adopts current_utc for every subsequent request"

  # ---- product and pricing catalogue ----
  - method: POST
    path: "/correspondent/products"
    description: "Registers a product eligibility row (the product side of the eligibility matrix)."
    roles: [PlatformAdmin]
    code: 201
    input: [product_code, base_price_pct, min_fico, max_ltv_pct, max_loan_amount_cents, allowed_commitment_types, allowed_occupancies, srp_pct, "description?", "status?"]
    output: ProductEligibility
    side_effects:
      - "uniqueness of product_code enforced (ERR_DUPLICATE_PRODUCT_CODE)"

  - method: GET
    path: "/correspondent/products/{id}"
    description: "Reads one product eligibility row."
    roles: [PlatformAdmin, CounterpartyAnalyst, LockDeskTrader, PurchaseReviewer, SellerUser]
    code: 200
    output: ProductEligibility
    side_effects: []

  - method: POST
    path: "/correspondent/products/{id}/pricing-adjustments"
    description: "Adds a loan-level price adjustment (LLPA) grid row to a product. fico bounds are inclusive on both ends; ltv_min_pct is exclusive and ltv_max_pct inclusive."
    roles: [PlatformAdmin]
    code: 201
    input: [adjustment_code, fico_min, fico_max, ltv_min_pct, ltv_max_pct, price_adjustment_bps, "status?"]
    output: PricingAdjustment
    side_effects:
      - "uniqueness of adjustment_code within the product enforced (ERR_DUPLICATE_ADJUSTMENT_CODE)"

  - method: GET
    path: "/correspondent/products/{id}/pricing-adjustments"
    description: "Lists the LLPA grid rows of a product (FK reverse-reachability for PricingAdjustment.product_id)."
    roles: [PlatformAdmin, LockDeskTrader, CounterpartyAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PricingAdjustment[]
    side_effects: []

  # ---- seller approval ----
  - method: POST
    path: "/correspondent/sellers"
    description: "Registers a correspondent seller applicant. Starts APPLIED / NOT_ELIGIBLE."
    roles: [CounterpartyAnalyst]
    code: 201
    input: [legal_name, tin, seller_type]
    output: Seller
    side_effects:
      - "Seller.approval_status = APPLIED, Seller.delivery_standing = NOT_ELIGIBLE"
      - "uniqueness of tin enforced (ERR_DUPLICATE_TIN)"

  - method: GET
    path: "/correspondent/sellers/{id}"
    description: "Reads one seller, including its live exposure, funding and scorecard roll-ups."
    roles: [CounterpartyAnalyst, PlatformAdmin, LockDeskTrader, PurchaseReviewer, SellerUser]
    code: 200
    output: Seller
    side_effects: []

  - method: GET
    path: "/correspondent/sellers"
    description: "Lists sellers with optional filters on approval and standing."
    roles: [CounterpartyAnalyst, PlatformAdmin]
    code: 200
    input: ["approval_status?", "delivery_standing?", "limit?", "offset?"]
    output: Seller[]
    side_effects: []

  - method: POST
    path: "/correspondent/sellers/{id}/financial-statements"
    description: "Submits a fiscal-year financial statement for the seller."
    roles: [SellerUser, CounterpartyAnalyst]
    code: 201
    input: [fiscal_year_end, audited, tangible_net_worth_cents, liquid_assets_cents, "review_note?"]
    output: FinancialStatement
    side_effects:
      - "FinancialStatement.status = SUBMITTED"

  - method: GET
    path: "/correspondent/sellers/{id}/financial-statements"
    description: "Lists the seller's financial statements (FK reverse-reachability for FinancialStatement.seller_id)."
    roles: [CounterpartyAnalyst, PlatformAdmin, SellerUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FinancialStatement[]
    side_effects: []

  - method: POST
    path: "/correspondent/financial-statements/{id}/review"
    description: "Accepts or rejects a submitted financial statement."
    roles: [CounterpartyAnalyst]
    code: 200
    input: [decision, "review_note?"]
    output: FinancialStatement
    side_effects:
      - "FinancialStatement SUBMITTED -> ACCEPTED or REJECTED"
      - "FinancialStatement.reviewed_by_user_id = X-User-ID"
      - "increments FinancialStatement.version by 1"

  - method: POST
    path: "/correspondent/sellers/{id}/qc-reviews"
    description: "Opens a quality control review file on the seller (pre-approval or annual recertification)."
    roles: [QCReviewer]
    code: 201
    input: [review_type]
    output: QualityControlReview
    side_effects:
      - "QualityControlReview.status = OPEN"
      - "cascaded: Seller.approval_status APPLIED -> UNDER_REVIEW on the seller's FIRST review"

  - method: GET
    path: "/correspondent/sellers/{id}/qc-reviews"
    description: "Lists the seller's QC reviews (FK reverse-reachability for QualityControlReview.seller_id)."
    roles: [QCReviewer, CounterpartyAnalyst, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: QualityControlReview[]
    side_effects: []

  - method: POST
    path: "/correspondent/qc-reviews/{id}/complete"
    description: "Completes a QC review with its finding counts; the outcome is computed, never supplied."
    roles: [QCReviewer]
    code: 200
    input: [findings_count, critical_findings_count]
    output: QualityControlReview
    side_effects:
      - "QualityControlReview OPEN -> COMPLETED with outcome = calculations.qc_review_outcome"
      - "QualityControlReview.completed_by_user_id = X-User-ID; completed_at = logical clock"
      - "increments QualityControlReview.version by 1"

  - method: POST
    path: "/correspondent/sellers/{id}/approval-decision"
    description: "Approves or declines the seller. Approval evaluates net worth, liquidity, statement staleness and the governing QC outcome, sets the approval tier and servicing-retained eligibility, computes the mandatory exposure limit and opens delivery standing."
    roles: [CounterpartyAnalyst]
    code: 200
    input: [decision, "review_note?"]
    output: Seller
    side_effects:
      - "Seller.approval_status UNDER_REVIEW -> APPROVED or DECLINED"
      - "on APPROVE: approval_tier, servicing_retained_eligible, approved_tangible_net_worth_cents and mandatory_exposure_limit_cents = calculations.seller_mandatory_exposure_limit are written, and delivery_standing NOT_ELIGIBLE -> GOOD_STANDING"
      - "Seller.approval_decided_by_user_id = X-User-ID"
      - "increments Seller.version by 1"

  - method: POST
    path: "/correspondent/sellers/{id}/standing-actions"
    description: "Applies a manual counterparty action to the seller's delivery standing: SUSPEND, REINSTATE, TERMINATE or PLACE_ON_WATCH. A manual SUSPEND does NOT cancel existing commitments; TERMINATE does."
    roles: [CounterpartyAnalyst, PlatformAdmin]
    code: 200
    input: [action, "note?"]
    output: Seller
    side_effects:
      - "Seller.delivery_standing transition per the delivery_standing machine"
      - "Seller.suspension_reason = MANUAL_COUNTERPARTY_ACTION on SUSPEND, null on REINSTATE"
      - "on TERMINATE: every Commitment of the seller with status IN {LOCKED, PARTIALLY_FULFILLED} and allocated_amount_cents == 0 is CANCELLED with the administrative_flat pair-off fee, which accrues to Seller.fee_receivable_cents"
      - "increments Seller.version by 1"

  # ---- lock desk: commitments ----
  - method: POST
    path: "/correspondent/commitments"
    description: "Locks a mandatory or best-efforts commitment for an approved seller and prices it once (lock-term tier + LLPA grid + commitment-type spread, clamped to the price floor/ceiling)."
    roles: [LockDeskTrader, SellerUser]
    code: 201
    input: [seller_id, product_id, commitment_type, notional_amount_cents, delivery_window_start, delivery_expiry_date, reference_fico, reference_ltv_pct]
    output: Commitment
    side_effects:
      - "Commitment.status = LOCKED; lock_term_days, llpa_bps_applied and commitment_price_pct = calculations.commitment_price_pct are frozen"
      - "Commitment.tolerance_cents and available_amount_cents initialised (available = notional)"
      - "Commitment.locked_by_user_id = X-User-ID"
      - "for MANDATORY: Seller.open_mandatory_exposure_cents += notional_amount_cents after the exposure-limit check"

  - method: GET
    path: "/correspondent/commitments"
    description: "Lists commitments with filters (FK reverse-reachability for Commitment.seller_id and Commitment.product_id)."
    roles: [LockDeskTrader, CounterpartyAnalyst, PurchaseReviewer, PlatformAdmin, SellerUser]
    code: 200
    input: ["seller_id?", "product_id?", "commitment_type?", "status?", "limit?", "offset?"]
    output: Commitment[]
    side_effects: []

  - method: GET
    path: "/correspondent/commitments/{id}"
    description: "Reads one commitment, including the conserved-quantity amounts and its current version for optimistic concurrency."
    roles: [LockDeskTrader, CounterpartyAnalyst, PurchaseReviewer, PlatformAdmin, SellerUser]
    code: 200
    output: Commitment
    side_effects: []

  - method: POST
    path: "/correspondent/commitments/{id}/pair-off"
    description: "Pairs off the unfulfilled balance of a commitment at an observed market price. MANDATORY lines are marked to market; BEST_EFFORTS lines pay the administrative fee only."
    roles: [LockDeskTrader]
    code: 200
    input: [pair_off_market_price_pct]
    output: Commitment
    side_effects:
      - "Commitment -> PAIRED_OFF; paired_off_amount_cents absorbs available_amount_cents"
      - "Commitment.pair_off_fee_cents = calculations.pair_off_fee_cents (variant mandatory_mark_to_market or best_efforts_admin_only); pair_off_method recorded"
      - "Seller.fee_receivable_cents += pair_off_fee_cents; MANDATORY exposure released"
      - "increments Commitment.version by 1"

  - method: POST
    path: "/correspondent/commitments/expire-due"
    description: "Lock desk expiry sweep: every LOCKED or PARTIALLY_FULFILLED commitment whose delivery_expiry_date has been reached on the logical clock and which has no outstanding allocation is EXPIRED with the administrative flat pair-off fee. Commitments with loans still in the purchase pipeline are skipped."
    roles: [LockDeskTrader, PlatformAdmin]
    code: 200
    input: ["seller_id?"]
    output: "{ expired_count: integer, expired_commitment_ids: string[], total_pair_off_fee_cents: integer }"
    side_effects:
      - "each swept Commitment -> EXPIRED with pair_off_method = ADMINISTRATIVE_FLAT and pair_off_fee_cents = calculations.pair_off_fee_cents variant administrative_flat"
      - "Seller.fee_receivable_cents += each fee; MANDATORY exposure released per commitment"
      - "increments each affected Commitment.version by 1"
      - "commitments are processed in Commitment.created_at ASC order"

  # ---- delivery and purchase review ----
  - method: POST
    path: "/correspondent/commitments/{id}/loans"
    description: "Delivers a closed loan file against a commitment. Requires expected_commitment_version — the commitment's remaining capacity is the product of every prior delivery, fill and rejection, so a delivery computed from a stale view is refused with 412."
    roles: [SellerUser, LockDeskTrader]
    code: 201
    input: [expected_commitment_version, seller_loan_number, note_amount_cents, note_rate_pct, fico, ltv_pct, occupancy, servicing_election, closing_date, first_payment_due_date, "escrow_balance_cents?"]
    output: Loan
    side_effects:
      - "Loan.purchase_status = DELIVERED; seller_id and product_id copied from the commitment; delivered_at = logical clock"
      - "Commitment.allocated_amount_cents += note_amount_cents; available_amount_cents recomputed"
      - "increments Commitment.version by 1"

  - method: GET
    path: "/correspondent/loans"
    description: "Lists delivered loans with filters (FK reverse-reachability for Loan.commitment_id, Loan.seller_id and Loan.product_id)."
    roles: [PurchaseReviewer, LockDeskTrader, CounterpartyAnalyst, PlatformAdmin, SellerUser]
    code: 200
    input: ["seller_id?", "commitment_id?", "product_id?", "purchase_status?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []

  - method: GET
    path: "/correspondent/loans/{id}"
    description: "Reads one loan, including its review roll-ups and its current version for optimistic concurrency."
    roles: [PurchaseReviewer, LockDeskTrader, CounterpartyAnalyst, PlatformAdmin, SellerUser]
    code: 200
    output: Loan
    side_effects: []

  - method: POST
    path: "/correspondent/loans/{id}/review"
    description: "Opens purchase review on a delivered loan file; only a loan whose purchase_status is still DELIVERED may be opened (a SUSPENDED file returns to IN_REVIEW by resolving its open items, never by re-opening review)."
    roles: [PurchaseReviewer]
    code: 200
    input: ["note?"]
    output: Loan
    side_effects:
      - "Loan DELIVERED -> IN_REVIEW"
      - "increments Loan.version by 1"

  - method: POST
    path: "/correspondent/loans/{id}/defects"
    description: "Records a purchase-review defect. The classification (CURABLE / NON_CURABLE) and the cure deadline are computed from category and severity; any classification supplied in the body is ignored. Accepted while the loan is IN_REVIEW or SUSPENDED (a file may carry several defects at once) and on a PURCHASED loan as a post-purchase QC finding."
    roles: [PurchaseReviewer]
    code: 201
    input: [defect_code, category, severity]
    output: Defect
    side_effects:
      - "Defect.status = OPEN; classification and cure_deadline_at = calculations.defect_classification"
      - "Defect.identified_by_user_id = X-User-ID"
      - "Loan.open_defect_count += 1; non_curable_defect_count += 1 when NON_CURABLE"
      - "cascaded: Loan IN_REVIEW -> SUSPENDED, or CLEARED_FOR_PURCHASE -> SUSPENDED which VOIDs any ISSUED advice; an already SUSPENDED (or PURCHASED) loan only accumulates the item and does not transition"
      - "increments Loan.version by 1"

  - method: GET
    path: "/correspondent/loans/{id}/defects"
    description: "Lists the loan's defects (FK reverse-reachability for Defect.loan_id)."
    roles: [PurchaseReviewer, SellerUser, CounterpartyAnalyst, PlatformAdmin]
    code: 200
    input: ["status?", "classification?", "limit?", "offset?"]
    output: Defect[]
    side_effects: []

  - method: POST
    path: "/correspondent/defects/{id}/cure"
    description: "Seller cures a curable defect inside its cure window. A cure landing exactly on the deadline instant is on time."
    roles: [SellerUser]
    code: 200
    input: [cure_document_reference]
    output: Defect
    side_effects:
      - "Defect OPEN -> CURED; cured_at = logical clock"
      - "Loan.open_defect_count -= 1; cascaded Loan SUSPENDED -> IN_REVIEW with review_cycle_count += 1 when this was the last open item"
      - "increments Defect.version by 1 and Loan.version by 1"

  - method: POST
    path: "/correspondent/defects/{id}/waive"
    description: "Purchase reviewer waives a curable defect against a price adjustment (-100..0 bps). The waived severity survives, so a waived HIGH or CRITICAL defect still marks the loan defective on the scorecard."
    roles: [PurchaseReviewer, PlatformAdmin]
    code: 200
    input: [price_adjustment_bps]
    output: Defect
    side_effects:
      - "Defect OPEN -> WAIVED with price_adjustment_bps recorded"
      - "Loan.open_defect_count -= 1; cascaded Loan SUSPENDED -> IN_REVIEW with review_cycle_count += 1 when this was the last open item"
      - "increments Defect.version by 1 and Loan.version by 1"

  - method: POST
    path: "/correspondent/loans/{id}/suspense-conditions"
    description: "Adds a suspense condition to a loan in review; due_at = created_at + SUSPENSE_WINDOW_DAYS."
    roles: [PurchaseReviewer]
    code: 201
    input: [condition_code, "description?"]
    output: SuspenseCondition
    side_effects:
      - "SuspenseCondition.status = OPEN; due_at computed"
      - "Loan.open_suspense_count += 1"
      - "cascaded: Loan IN_REVIEW -> SUSPENDED, or CLEARED_FOR_PURCHASE -> SUSPENDED which VOIDs any ISSUED advice; an already SUSPENDED (or PURCHASED) loan only accumulates the item and does not transition"
      - "increments Loan.version by 1"

  - method: GET
    path: "/correspondent/loans/{id}/suspense-conditions"
    description: "Lists the loan's suspense conditions (FK reverse-reachability for SuspenseCondition.loan_id)."
    roles: [PurchaseReviewer, SellerUser, CounterpartyAnalyst, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SuspenseCondition[]
    side_effects: []

  - method: POST
    path: "/correspondent/suspense-conditions/{id}/clear"
    description: "Clears a suspense condition on receipt of the missing document, inside its due window."
    roles: [PurchaseReviewer]
    code: 200
    input: [document_reference]
    output: SuspenseCondition
    side_effects:
      - "SuspenseCondition OPEN -> CLEARED; cleared_at = logical clock"
      - "Loan.open_suspense_count -= 1; cascaded Loan SUSPENDED -> IN_REVIEW with review_cycle_count += 1 when this was the last open item"
      - "increments SuspenseCondition.version by 1 and Loan.version by 1"

  - method: POST
    path: "/correspondent/loans/{id}/expire-conditions"
    description: "Condition sweep for one loan: every OPEN curable Defect strictly past its cure_deadline_at becomes EXPIRED (carrying the EXPIRED_DEFECT_PENALTY_BPS price penalty) and every OPEN SuspenseCondition strictly past due_at becomes EXPIRED. Nothing expires exactly on its deadline."
    roles: [PurchaseReviewer, PlatformAdmin]
    code: 200
    input: []
    output: "{ expired_defect_count: integer, expired_condition_count: integer, loan_purchase_status: string }"
    side_effects:
      - "each due Defect OPEN -> EXPIRED and each due SuspenseCondition OPEN -> EXPIRED"
      - "Loan.open_defect_count and open_suspense_count decremented accordingly"
      - "cascaded Loan SUSPENDED -> IN_REVIEW with review_cycle_count += 1 when the sweep clears the last open item"
      - "increments each affected child version by 1 and Loan.version by 1"

  - method: POST
    path: "/correspondent/loans/{id}/clear"
    description: "Clears the loan file for purchase. Blocked by any open defect, any open suspense condition, or any open non-curable defect."
    roles: [PurchaseReviewer]
    code: 200
    input: ["note?"]
    output: Loan
    side_effects:
      - "Loan IN_REVIEW -> CLEARED_FOR_PURCHASE"
      - "increments Loan.version by 1"

  - method: POST
    path: "/correspondent/loans/{id}/reject"
    description: "Rejects the delivered loan file. Requires at least one open non-curable defect, and compensates the delivery by releasing the commitment allocation."
    roles: [PurchaseReviewer]
    code: 200
    input: ["note?"]
    output: Loan
    side_effects:
      - "Loan -> REJECTED (terminal)"
      - "COMPENSATION: Commitment.allocated_amount_cents -= note_amount_cents and available_amount_cents += note_amount_cents; Commitment.status unchanged"
      - "increments Commitment.version by 1 and Loan.version by 1"

  # ---- purchase advice and funding ----
  - method: POST
    path: "/correspondent/loans/{id}/purchase-advices"
    description: "Issues a purchase advice for a cleared loan: freezes the month-to-date volume incentive, the final purchase price and every money component (principal, accrued interest, escrow funding, service release premium, defect adjustments, wire fee). Requires expected_loan_version because a later advice legitimately supersedes an earlier one."
    roles: [PurchaseReviewer]
    code: 201
    input: [expected_loan_version]
    output: PurchaseAdvice
    side_effects:
      - "PurchaseAdvice.status = ISSUED; volume_incentive_bps = calculations.volume_incentive_bps; every money field = calculations.purchase_advice_net_wire_cents"
      - "any prior PurchaseAdvice of this loan with status == ISSUED transitions to SUPERSEDED"
      - "PurchaseAdvice.issued_by_user_id = X-User-ID; issued_at = logical clock"
      - "Loan.advice_count += 1"
      - "increments Loan.version by 1"

  - method: GET
    path: "/correspondent/loans/{id}/purchase-advices"
    description: "Lists the loan's purchase advices, current and superseded (FK reverse-reachability for PurchaseAdvice.loan_id)."
    roles: [PurchaseReviewer, SellerUser, CounterpartyAnalyst, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PurchaseAdvice[]
    side_effects: []

  - method: POST
    path: "/correspondent/purchase-advices/{id}/settle"
    description: "Settles (wires) an issued purchase advice. Segregation of duties: the settling user must differ from the issuing user."
    roles: [PurchaseReviewer, PlatformAdmin]
    code: 200
    input: [funding_reference]
    output: PurchaseAdvice
    side_effects:
      - "PurchaseAdvice ISSUED -> SETTLED; settled_by_user_id = X-User-ID; settled_at = logical clock"
      - "cascaded: Loan CLEARED_FOR_PURCHASE -> PURCHASED with purchased_at = logical clock"
      - "cascaded: for a RELEASED loan an EscrowTransfer is created (PENDING, due purchased_at + ESCROW_TRANSFER_DAYS)"
      - "cascaded: the parent Commitment fills (PARTIALLY_FULFILLED or FULFILLED with the tolerance write-off) and MANDATORY exposure is released when it becomes terminal"
      - "cascaded: Seller.net_funded_cents += net_wire_cents"
      - "increments PurchaseAdvice.version by 1, Loan.version by 1 and Commitment.version by 1"

  - method: POST
    path: "/correspondent/loans/{id}/payment-events"
    description: "Records the borrower's first-payment outcome on a purchased loan, establishing (or clearing) early payment default."
    roles: [PlatformAdmin]
    code: 200
    input: [event_type]
    output: Loan
    side_effects:
      - "Loan.first_payment_status = PAID on FIRST_PAYMENT_PAID, MISSED on FIRST_PAYMENT_MISSED"
      - "increments Loan.version by 1"

  # ---- repurchase demands ----
  - method: POST
    path: "/correspondent/loans/{id}/repurchase-demands"
    description: "Issues a repurchase demand on a purchased loan for early payment default, a defect, or misrepresentation. The repurchase price is pinned to the exact amount wired plus the administrative fee."
    roles: [PurchaseReviewer, CounterpartyAnalyst]
    code: 201
    input: [reason, demand_letter_reference, "source_defect_id?"]
    output: RepurchaseDemand
    side_effects:
      - "RepurchaseDemand.status = ISSUED; funding_recovery_cents, admin_fee_cents and repurchase_price_cents = calculations.repurchase_price_cents"
      - "RepurchaseDemand.appeal_deadline_at = logical clock + APPEAL_WINDOW_DAYS; seller_id copied from the loan"
      - "RepurchaseDemand.issued_by_user_id = X-User-ID"
      - "cascaded: Loan PURCHASED -> REPURCHASE_DEMANDED"
      - "increments Loan.version by 1"

  - method: GET
    path: "/correspondent/loans/{id}/repurchase-demands"
    description: "Lists the loan's repurchase demands (FK reverse-reachability for RepurchaseDemand.loan_id)."
    roles: [PurchaseReviewer, SellerUser, CounterpartyAnalyst, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RepurchaseDemand[]
    side_effects: []

  - method: GET
    path: "/correspondent/repurchase-demands"
    description: "Lists repurchase demands with filters (FK reverse-reachability for RepurchaseDemand.seller_id and RepurchaseDemand.source_defect_id)."
    roles: [PurchaseReviewer, CounterpartyAnalyst, PlatformAdmin, SellerUser]
    code: 200
    input: ["seller_id?", "source_defect_id?", "reason?", "status?", "limit?", "offset?"]
    output: RepurchaseDemand[]
    side_effects: []

  - method: GET
    path: "/correspondent/repurchase-demands/{id}"
    description: "Reads one repurchase demand, including the pinned recovery amounts and appeal deadline."
    roles: [PurchaseReviewer, CounterpartyAnalyst, PlatformAdmin, SellerUser]
    code: 200
    output: RepurchaseDemand
    side_effects: []

  - method: POST
    path: "/correspondent/repurchase-demands/{id}/appeal"
    description: "Seller appeals an issued demand inside the appeal window. The loan stays REPURCHASE_DEMANDED while the appeal is pending."
    roles: [SellerUser]
    code: 200
    input: [appeal_reason]
    output: RepurchaseDemand
    side_effects:
      - "RepurchaseDemand ISSUED -> APPEALED with appeal_reason recorded"
      - "increments RepurchaseDemand.version by 1"

  - method: POST
    path: "/correspondent/repurchase-demands/{id}/decision"
    description: "Decides a demand: UPHOLD (only from APPEALED) or RESCIND (from ISSUED or APPEALED). Segregation of duties: the deciding user must differ from the issuing user."
    roles: [PurchaseReviewer]
    code: 200
    input: [decision, "note?"]
    output: RepurchaseDemand
    side_effects:
      - "RepurchaseDemand -> UPHELD or RESCINDED; decided_by_user_id = X-User-ID"
      - "on RESCIND: cascaded Loan REPURCHASE_DEMANDED -> PURCHASED and the loan leaves the scorecard defective set; Seller.net_funded_cents unchanged"
      - "increments RepurchaseDemand.version by 1"

  - method: POST
    path: "/correspondent/repurchase-demands/{id}/settle"
    description: "Seller remits the repurchase price, satisfying the demand and unwinding the purchase end to end."
    roles: [SellerUser]
    code: 200
    input: [remittance_reference]
    output: RepurchaseDemand
    side_effects:
      - "RepurchaseDemand -> SATISFIED with satisfied_at = logical clock"
      - "cascaded: Loan -> REPURCHASED, the SETTLED PurchaseAdvice -> REVERSED, any EscrowTransfer -> REVERSED with reversal_reason = REPURCHASE_SATISFIED"
      - "cascaded: Seller.net_funded_cents -= funding_recovery_cents (restoring the pre-purchase value) and Seller.fee_receivable_cents += admin_fee_cents"
      - "increments RepurchaseDemand.version by 1, Loan.version by 1 and PurchaseAdvice.version by 1"

  # ---- escrow transfer ----
  - method: GET
    path: "/correspondent/loans/{id}/escrow-transfers"
    description: "Lists the loan's escrow transfers. This is the only discovery channel for the transfer synthesised by settlement of a servicing-released loan (FK reverse-reachability for EscrowTransfer.loan_id)."
    roles: [PurchaseReviewer, PlatformAdmin, SellerUser]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EscrowTransfer[]
    side_effects: []

  - method: POST
    path: "/correspondent/escrow-transfers/{id}/complete"
    description: "Completes the escrow balance transfer to the investor with the borrower goodbye letter. Blocked while the loan is under an unresolved repurchase demand, and blocked once the transfer is overdue."
    roles: [PurchaseReviewer, PlatformAdmin]
    code: 200
    input: [goodbye_letter_reference]
    output: EscrowTransfer
    side_effects:
      - "EscrowTransfer PENDING -> COMPLETED with completed_at = logical clock"
      - "increments EscrowTransfer.version by 1"

  # ---- seller scorecard ----
  - method: POST
    path: "/correspondent/sellers/{id}/scorecards"
    description: "Opens a scorecard period for the seller. Periods are closed intervals and may not overlap another period of the same seller."
    roles: [CounterpartyAnalyst, PlatformAdmin]
    code: 201
    input: [period_start, period_end]
    output: SellerScorecard
    side_effects:
      - "SellerScorecard.status = OPEN with all metrics zeroed and grade UNRATED"

  - method: GET
    path: "/correspondent/sellers/{id}/scorecards"
    description: "Lists the seller's scorecards (FK reverse-reachability for SellerScorecard.seller_id)."
    roles: [CounterpartyAnalyst, SellerUser, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SellerScorecard[]
    side_effects: []

  - method: POST
    path: "/correspondent/scorecards/{id}/close"
    description: "Closes a scorecard period once the logical clock is past period_end, computes both defect-rate variants, grades the seller and applies the standing action (WATCH / SUSPENDED / RECOVERED / NONE)."
    roles: [CounterpartyAnalyst]
    code: 200
    input: []
    output: SellerScorecard
    side_effects:
      - "SellerScorecard OPEN -> CLOSED; every metric written per calculations.seller_defect_rate_bps (both variants) plus grade and breach"
      - "SellerScorecard.standing_action_applied = calculations.scorecard_standing_action"
      - "cascaded: Seller.current_defect_rate_bps and current_scorecard_grade adopt the closed values; the delivery_standing transition fires; a SUSPENDED action cancels the seller's unallocated open commitments with administrative flat pair-off fees"
      - "increments SellerScorecard.version by 1 and Seller.version by 1"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog — one row per error_id referenced in §1.2 / §1.2.1 /
# §1.4; every row is triggerable by at least one declared endpoint.
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or empty"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_SELLER_NOT_FOUND
    http: 404
    condition: "{id} names no Seller"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "{id} names no ProductEligibility"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "{id} names no FinancialStatement"
  - id: ERR_QC_REVIEW_NOT_FOUND
    http: 404
    condition: "{id} names no QualityControlReview"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "{id} names no Commitment"
  - id: ERR_LOAN_NOT_FOUND
    http: 404
    condition: "{id} names no Loan"
  - id: ERR_DEFECT_NOT_FOUND
    http: 404
    condition: "{id} names no Defect"
  - id: ERR_CONDITION_NOT_FOUND
    http: 404
    condition: "{id} names no SuspenseCondition"
  - id: ERR_ADVICE_NOT_FOUND
    http: 404
    condition: "{id} names no PurchaseAdvice"
  - id: ERR_DEMAND_NOT_FOUND
    http: 404
    condition: "{id} names no RepurchaseDemand"
  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    condition: "{id} names no EscrowTransfer"
  - id: ERR_SCORECARD_NOT_FOUND
    http: 404
    condition: "{id} names no SellerScorecard"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, undeclared enum member, wrong scalar type, malformed date, out-of-range waiver bps, or a body id that resolves to nothing"
  - id: ERR_SELLER_SCOPE_VIOLATION
    http: 403
    condition: "a SellerUser addresses a resource whose owning seller_id differs from X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already performed the incompatible upstream step (QC completion before approval, advice issuance before settlement, demand issuance before decision)"
  - id: ERR_STALE_COMMITMENT_VERSION
    http: 412
    condition: "expected_commitment_version does not equal the Commitment's current version"
  - id: ERR_STALE_LOAN_VERSION
    http: 412
    condition: "expected_loan_version does not equal the Loan's current version"
  - id: ERR_INVALID_SELLER_STATE
    http: 409
    condition: "the Seller's approval_status does not permit the requested onboarding operation"
  - id: ERR_STATEMENT_NOT_REVIEWABLE
    http: 409
    condition: "the FinancialStatement is not in SUBMITTED"
  - id: ERR_QC_REVIEW_NOT_OPEN
    http: 409
    condition: "the QualityControlReview is already COMPLETED"
  - id: ERR_COMMITMENT_NOT_OPEN
    http: 409
    condition: "the Commitment is not in LOCKED or PARTIALLY_FULFILLED"
  - id: ERR_INVALID_LOAN_STATE
    http: 409
    condition: "the Loan's purchase_status does not permit the requested purchase-review operation"
  - id: ERR_DEFECT_NOT_OPEN
    http: 409
    condition: "the Defect is already CURED, WAIVED or EXPIRED"
  - id: ERR_CONDITION_NOT_OPEN
    http: 409
    condition: "the SuspenseCondition is already CLEARED or EXPIRED"
  - id: ERR_ADVICE_NOT_SETTLEABLE
    http: 409
    condition: "the PurchaseAdvice is not in ISSUED (superseded, voided, already settled or reversed)"
  - id: ERR_DEMAND_NOT_ACTIONABLE
    http: 409
    condition: "appeal on a demand not in ISSUED, RESCIND on a demand not in {ISSUED, APPEALED}, or UPHOLD on a demand not in APPEALED"
  - id: ERR_DEMAND_NOT_SETTLEABLE
    http: 409
    condition: "settlement of a demand not in {ISSUED, UPHELD}"
  - id: ERR_TRANSFER_NOT_PENDING
    http: 409
    condition: "the EscrowTransfer is already COMPLETED or REVERSED"
  - id: ERR_SCORECARD_NOT_OPEN
    http: 409
    condition: "the SellerScorecard is already CLOSED"
  - id: ERR_ALLOCATION_OUTSTANDING
    http: 409
    condition: "pair-off attempted while the Commitment still has allocated_amount_cents > 0"
  - id: ERR_SELLER_NOT_APPROVED
    http: 409
    condition: "commitment locked for a Seller whose approval_status is not APPROVED"
  - id: ERR_SELLER_DELIVERY_SUSPENDED
    http: 409
    condition: "lock or delivery attempted while the Seller's delivery_standing is NOT_ELIGIBLE, SUSPENDED or TERMINATED"
  - id: ERR_NO_ACCEPTED_STATEMENT
    http: 409
    condition: "approval attempted with no ACCEPTED audited FinancialStatement on file"
  - id: ERR_FINANCIAL_STATEMENT_STALE
    http: 409
    condition: "the governing statement's fiscal_year_end is more than FS_STALENESS_DAYS (455) days old"
  - id: ERR_NET_WORTH_BELOW_MINIMUM
    http: 409
    condition: "governing tangible_net_worth_cents < 250000000"
  - id: ERR_LIQUIDITY_BELOW_MINIMUM
    http: 409
    condition: "governing liquid_assets_cents < 50000000"
  - id: ERR_QC_REVIEW_NOT_COMPLETED
    http: 409
    condition: "approval attempted with no COMPLETED QualityControlReview"
  - id: ERR_QC_REVIEW_FAILED
    http: 409
    condition: "the governing QC review's outcome is FAIL"
  - id: ERR_NON_CURABLE_DEFECT_PRESENT
    http: 409
    condition: "clear-for-purchase attempted while an OPEN NON_CURABLE Defect exists"
  - id: ERR_LOAN_UNDER_REPURCHASE
    http: 409
    condition: "escrow transfer completion attempted while the Loan is REPURCHASE_DEMANDED or REPURCHASED"
  - id: ERR_PRODUCT_NOT_ELIGIBLE
    http: 422
    condition: "the product is RETIRED, or the delivered fico / ltv_pct / note_amount_cents / occupancy falls outside the product's eligibility matrix"
  - id: ERR_COMMITMENT_TYPE_NOT_ALLOWED
    http: 422
    condition: "the requested commitment_type is not in the product's allowed_commitment_types"
  - id: ERR_SERVICING_RETAINED_NOT_ELIGIBLE
    http: 422
    condition: "servicing_election=RETAINED delivered by a Seller with servicing_retained_eligible == false"
  - id: ERR_COMMITMENT_EXPIRED
    http: 409
    condition: "delivery attempted outside the half-open delivery window"
  - id: ERR_DELIVERY_WINDOW_OVERLAP
    http: 409
    condition: "a new MANDATORY commitment's window overlaps a live MANDATORY window of the same seller and product"
  - id: ERR_SCORECARD_PERIOD_OVERLAP
    http: 409
    condition: "a new scorecard period overlaps an existing period of the same seller"
  - id: ERR_SCORECARD_PERIOD_NOT_ENDED
    http: 409
    condition: "close attempted before the logical clock passes period_end"
  - id: ERR_CURE_WINDOW_EXPIRED
    http: 409
    condition: "cure attempted strictly after Defect.cure_deadline_at"
  - id: ERR_SUSPENSE_WINDOW_EXPIRED
    http: 409
    condition: "clearance attempted strictly after SuspenseCondition.due_at"
  - id: ERR_EPD_WINDOW_EXPIRED
    http: 409
    condition: "EPD demand issued more than 120 days after first_payment_due_date"
  - id: ERR_APPEAL_WINDOW_EXPIRED
    http: 409
    condition: "appeal attempted strictly after RepurchaseDemand.appeal_deadline_at"
  - id: ERR_ESCROW_TRANSFER_OVERDUE
    http: 409
    condition: "escrow transfer completion attempted strictly after transfer_due_at"
  - id: ERR_DUPLICATE_TIN
    http: 409
    condition: "another Seller already carries this tin"
  - id: ERR_DUPLICATE_PRODUCT_CODE
    http: 409
    condition: "another ProductEligibility already carries this product_code"
  - id: ERR_DUPLICATE_ADJUSTMENT_CODE
    http: 409
    condition: "the product already carries this adjustment_code"
  - id: ERR_DUPLICATE_SELLER_LOAN_NUMBER
    http: 409
    condition: "the seller already delivered a loan with this seller_loan_number"
  - id: ERR_OPEN_DEFECTS_PRESENT
    http: 409
    condition: "clear-for-purchase attempted with open_defect_count > 0"
  - id: ERR_OPEN_SUSPENSE_CONDITIONS
    http: 409
    condition: "clear-for-purchase attempted with open_suspense_count > 0"
  - id: ERR_DEFECT_NOT_CURABLE
    http: 409
    condition: "cure or waiver attempted on a NON_CURABLE Defect"
  - id: ERR_NO_NON_CURABLE_DEFECT
    http: 409
    condition: "rejection attempted with no OPEN NON_CURABLE Defect on the loan"
  - id: ERR_DEFECT_EVIDENCE_REQUIRED
    http: 422
    condition: "DEFECT or MISREPRESENTATION demand without a source_defect_id naming a HIGH/CRITICAL Defect of this loan in WAIVED or EXPIRED status"
  - id: ERR_EPD_NOT_ESTABLISHED
    http: 409
    condition: "EPD demand issued while Loan.first_payment_status is not MISSED"
  - id: ERR_COMMITMENT_CAPACITY_EXCEEDED
    http: 409
    condition: "delivered note_amount_cents exceeds the commitment's available_amount_cents"
  - id: ERR_MANDATORY_EXPOSURE_LIMIT_EXCEEDED
    http: 409
    condition: "a new MANDATORY notional would push open_mandatory_exposure_cents past mandatory_exposure_limit_cents"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# ---------------------------------------------------------------------------
roles:
  - name: SellerUser
    description: "The correspondent seller acting on its own file: submits financial statements, locks and delivers loans, cures defects, appeals and satisfies repurchase demands. X-User-ID is the Seller.id."
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /correspondent/defects/{id}/cure"
      - "POST /correspondent/repurchase-demands/{id}/appeal"
      - "POST /correspondent/repurchase-demands/{id}/settle"
    shared_operations:
      - "POST /correspondent/sellers/{id}/financial-statements (with CounterpartyAnalyst)"
      - "POST /correspondent/commitments (with LockDeskTrader)"
      - "POST /correspondent/commitments/{id}/loans (with LockDeskTrader)"
      - "every GET on its own sellers, commitments, loans, defects, suspense conditions, advices, demands, escrow transfers and scorecards, always narrowed to X-User-ID's own seller_id"

  - name: CounterpartyAnalyst
    description: "Counterparty risk analyst: onboards sellers, reviews financial statements, makes the approval decision, manages standing actions and runs the scorecard cycle."
    identity: "opaque"
    exclusive_operations:
      - "POST /correspondent/sellers"
      - "POST /correspondent/financial-statements/{id}/review"
      - "POST /correspondent/sellers/{id}/approval-decision"
      - "POST /correspondent/scorecards/{id}/close"
    shared_operations:
      - "POST /correspondent/sellers/{id}/standing-actions (with PlatformAdmin)"
      - "POST /correspondent/sellers/{id}/scorecards (with PlatformAdmin)"
      - "POST /correspondent/sellers/{id}/financial-statements (with SellerUser)"
      - "POST /correspondent/loans/{id}/repurchase-demands (with PurchaseReviewer)"
      - "read access across sellers, commitments, loans, advices, demands and scorecards"

  - name: QCReviewer
    description: "Quality control reviewer: opens and completes the pre-approval and annual recertification review files. Cannot approve the seller it reviewed (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /correspondent/sellers/{id}/qc-reviews"
      - "POST /correspondent/qc-reviews/{id}/complete"
    shared_operations:
      - "GET /correspondent/sellers/{id}/qc-reviews (with CounterpartyAnalyst, PlatformAdmin)"

  - name: LockDeskTrader
    description: "Lock desk trader: prices and locks commitments, runs the expiry sweep and executes pair-offs."
    identity: "opaque"
    exclusive_operations:
      - "POST /correspondent/commitments/{id}/pair-off"
    shared_operations:
      - "POST /correspondent/commitments (with SellerUser)"
      - "POST /correspondent/commitments/{id}/loans (with SellerUser)"
      - "POST /correspondent/commitments/expire-due (with PlatformAdmin)"
      - "GET /correspondent/products/{id}, GET /correspondent/products/{id}/pricing-adjustments, and read access to commitments, loans and sellers"

  - name: PurchaseReviewer
    description: "Purchase review underwriter: opens review on delivered files, records and resolves defects and suspense conditions, clears or rejects the file, issues and settles purchase advices, and issues and decides repurchase demands."
    identity: "opaque"
    exclusive_operations:
      - "POST /correspondent/loans/{id}/review"
      - "POST /correspondent/loans/{id}/defects"
      - "POST /correspondent/loans/{id}/suspense-conditions"
      - "POST /correspondent/suspense-conditions/{id}/clear"
      - "POST /correspondent/loans/{id}/clear"
      - "POST /correspondent/loans/{id}/reject"
      - "POST /correspondent/loans/{id}/purchase-advices"
      - "POST /correspondent/repurchase-demands/{id}/decision"
    shared_operations:
      - "POST /correspondent/defects/{id}/waive (with PlatformAdmin)"
      - "POST /correspondent/purchase-advices/{id}/settle (with PlatformAdmin, subject to segregation of duties)"
      - "POST /correspondent/loans/{id}/expire-conditions (with PlatformAdmin)"
      - "POST /correspondent/loans/{id}/repurchase-demands (with CounterpartyAnalyst)"
      - "POST /correspondent/escrow-transfers/{id}/complete (with PlatformAdmin)"
      - "read access to products, sellers, commitments, loans and their children"

  - name: PlatformAdmin
    description: "Platform operator: maintains the product and LLPA catalogue, drives the logical clock, records borrower first-payment events, and stands in on operational sweeps and settlements."
    identity: "opaque"
    exclusive_operations:
      - "POST /correspondent/_clock/set_current_utc"
      - "POST /correspondent/products"
      - "POST /correspondent/products/{id}/pricing-adjustments"
      - "POST /correspondent/loans/{id}/payment-events"
    shared_operations:
      - "POST /correspondent/sellers/{id}/standing-actions (with CounterpartyAnalyst)"
      - "POST /correspondent/sellers/{id}/scorecards (with CounterpartyAnalyst)"
      - "POST /correspondent/commitments/expire-due (with LockDeskTrader)"
      - "POST /correspondent/loans/{id}/expire-conditions (with PurchaseReviewer)"
      - "POST /correspondent/defects/{id}/waive (with PurchaseReviewer)"
      - "POST /correspondent/purchase-advices/{id}/settle (with PurchaseReviewer)"
      - "POST /correspondent/escrow-transfers/{id}/complete (with PurchaseReviewer)"
      - "read access across every collection"
