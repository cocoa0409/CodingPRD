      - name: po_over_receipt_battery
        claim_type: boundary_edge
        grounds: ["errors[ERR_OVER_RECEIPT]", state_machines.PaperPurchaseOrder]
        distinguishing_aspect: "Cumulative receipts may reach floor(ordered x 1.10) = 1100 exactly: receive 600 then 500 -> 1100 accepted (RECEIVED); the 500 -> 501 variant (1101 total) is rejected ERR_OVER_RECEIPT."
        test_recipe:
          setup: ["Two POs of 1000 sheets each on separate stocks"]
          setup_api_calls:
            - { call: "POST /paper-stocks", payload: { name: "SA", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { sa: $.data.id } }
            - { call: "POST /paper-stocks", payload: { name: "SB", grade: "UNCOATED", cost_per_sheet_cents: 5, reorder_threshold_sheets: 0, reorder_quantity_sheets: 20000 }, as: PurchasingManager, captures: { sb: $.data.id } }
            - { call: "POST /paper-purchase-orders", payload: { paper_stock_id: "${sa}", ordered_sheets: 1000, cost_per_sheet_cents: 5 }, as: PurchasingManager, captures: { poa: $.data.id } }
            - { call: "POST /paper-purchase-orders", payload: { paper_stock_id: "${sb}", ordered_sheets: 1000, cost_per_sheet_cents: 5 }, as: PurchasingManager, captures: { pob: $.data.id } }
            - { call: "POST /paper-purchase-orders/${poa}/receive", payload: { sheets_received: 600 }, as: PurchasingManager }
            - { call: "POST /paper-purchase-orders/${pob}/receive", payload: { sheets_received: 600 }, as: PurchasingManager }
          trigger:
            - { call: "POST /paper-purchase-orders/${poa}/receive", payload: { sheets_received: 500 }, as: PurchasingManager, captures: { sta: $.data.status } }
            - { call: "POST /paper-purchase-orders/${pob}/receive", payload: { sheets_received: 501 }, as: PurchasingManager, captures: { err: $.data.error_id } }
          assert:
            - "PO A: cumulative 1100 == cap -> accepted, status == RECEIVED"
            - "PO B: cumulative would be 1101 -> error_id == ERR_OVER_RECEIPT; PO B remains PARTIALLY_RECEIVED with received_sheets_total == 600"

