            - "Original retail call completed 2026-08-03 and CLOSED via full payment (136698 path with 2x ALT-104, completion odometer 120450). Vehicle odometer later reads 120750. New retail call, same vehicle and symptom ENGINE_NO_START, received 2026-08-20T14:00:00Z (window_days 16 = floor(16d21.5h), miles 300 -> NO_CHARGE)."
