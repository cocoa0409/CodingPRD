# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml  (§1.9 Coverage Index for Non-Difficulty Tests)
# Task: task_3174_commercial_parts_hub_delivery_loaner_tool_program
#
# Breadth probe over the same §1.1-§1.7 surface. Sections and claim_types are
# taken verbatim from references/claim-extraction-guide.md. Corners already
# exercised by an instance in SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:
- section: entities
  instances:
  - name: account_create_starts_bronze_open_with_zero_counters
    claim_type: creation
    grounds:
    - entities.CommercialAccount
    - endpoints.POST_/commercial/commercial-accounts
    distinguishing_aspect: An account posted with only the required fields comes back 201 with tier BRONZE, account_posture OPEN, petty_cash_cents 0, order_sequence 0, is_archived false and version 1.
    test_recipe:
      setup:
      - Logical clock at the 2026-09-01T00:00:00Z startup default; no account exists.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S100
          name: Corner Satellite
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      trigger:
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Corner Garage
          tax_id: TX-C001
          billing_address: 1 Corner St
          home_store_id: ${s_sat}
          credit_limit_cents: 250000
          credit_terms_days: 30
          delivery_service_level: SHOP_DELIVERY
        as: CommercialSalesRep
        captures:
          acct: $.data.id
      assert:
      - the response status is 201 and response_type is object
      - CommercialAccount.${acct}.tier == "BRONZE" and account_posture == "OPEN"
      - CommercialAccount.${acct}.petty_cash_cents == 0 and order_sequence == 0 and credit_exposure_cents == 0
      - CommercialAccount.${acct}.receivable_balance_cents == 0 and deposit_liability_cents == 0
      - CommercialAccount.${acct}.is_archived == false and shipping_address is null
      - CommercialAccount.${acct}.version == 1 and meta.api_request_id is present
  - name: store_get_round_trips_the_posted_configuration
    claim_type: retrieval
    grounds:
    - entities.Store
    - endpoints.GET_/commercial/stores/{storeId}
    distinguishing_aspect: Every Store configuration field round-trips through GET unchanged, including the null hub_store_id on a mega-hub and the defaulted cutoff_buffer_minutes of 30.
    test_recipe:
      setup:
      - Logical clock set; one mega-hub created with an omitted cutoff_buffer_minutes.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /commercial/stores
        payload:
          store_code: S900
          name: Corner Mega
          store_type: MEGA_HUB
          delivery_radius_miles: 60.0
          cutoff_hour_local: 17
          cutoff_buffer_minutes: 30
          promise_time_minutes: 120
          daily_capacity_units: 900
          hub_store_id: null
        as: PartsCategoryManager
        captures:
          mega: $.data.id
      - call: GET /commercial/stores/${mega}
        payload: {}
        as: PartsCategoryManager
      assert:
      - the response status is 200 and Store.${mega}.store_type == "MEGA_HUB"
      - Store.${mega}.store_code == "S900" and daily_capacity_units == 900
      - Store.${mega}.cutoff_buffer_minutes == 30, the declared default
      - Store.${mega}.hub_store_id is null and committed_units_today == 0
      - Store.${mega}.is_archived == false
  - name: parts_list_paginates_with_total_count_and_has_more
    claim_type: listing
    grounds:
    - endpoints.GET_/commercial/parts
    - response_envelope.pagination_fields
    - response_envelope.pagination_defaults
    distinguishing_aspect: With three parts on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the last row with has_more false.
    test_recipe:
      setup:
      - Logical clock set; three catalogue parts registered with distinct line codes.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/parts
        payload:
          sku: P-1
          description: Part One
          line_code: IGN
          list_price_cents: 1000
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p1: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: P-2
          description: Part Two
          line_code: IGN
          list_price_cents: 2000
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p2: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: P-3
          description: Part Three
          line_code: BRK
          list_price_cents: 3000
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p3: $.data.id
      trigger:
      - call: GET /commercial/parts
        payload:
          limit: 2
          offset: 0
        as: PartsCategoryManager
      assert:
      - the response status is 200 and response_type is array
      - the response returns exactly 2 rows with total_count == 3 and has_more == true
      - GET /commercial/parts?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false
      - GET /commercial/parts?line_code=IGN returns exactly 2 rows
      - GET /commercial/parts with no query parameters returns 3 rows with limit defaulting to 10 and offset to 0
  - name: account_get_with_an_unknown_id_returns_account_not_found
    claim_type: not_found
    grounds:
    - endpoints.GET_/commercial/commercial-accounts/{accountId}
    - errors[ERR_COMMERCIAL_ACCOUNT_NOT_FOUND]
    distinguishing_aspect: A syntactically valid but unallocated account id in the path produces the entity-specific 404 ERR_COMMERCIAL_ACCOUNT_NOT_FOUND, not a generic error and not a 400.
    test_recipe:
      setup:
      - Logical clock set; no account has been created.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /commercial/commercial-accounts/{11111111-2222-3333-4444-555555555555}
        payload: {}
        as: CommercialSalesRep
        captures:
          err_id: $.data.error_id
      assert:
      - the response status is 404 and response_type is error
      - ${err_id} == "ERR_COMMERCIAL_ACCOUNT_NOT_FOUND"
  - name: order_create_defaults_status_and_ignores_system_fields
    claim_type: defaults
    grounds:
    - entities.PartOrder.fields.status
    - endpoints.POST_/commercial/part-orders
    distinguishing_aspect: An order posted without a status starts at DRAFT, and client-supplied status, member_sequence or version values are ignored in favour of server-derived ones.
    test_recipe:
      setup:
      - Logical clock set; satellite stocking p_a; account A with no prior orders.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S100
          name: Def Satellite
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: P-A
          description: Part A
          line_code: IGN
          list_price_cents: 1000
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p_a: $.data.id
      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s_sat}
          part_id: ${p_a}
          on_hand_units: 5
        as: PartsCategoryManager
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Def Garage
          tax_id: TX-C002
          billing_address: 1 Def St
          home_store_id: ${s_sat}
          credit_limit_cents: 250000
          credit_terms_days: 30
          delivery_service_level: SHOP_DELIVERY
        as: CommercialSalesRep
        captures:
          acct: $.data.id
          acct_v: $.data.version
      trigger:
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          line_items:
          - part_id: ${p_a}
            quantity: 1
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
        captures:
          ord: $.data.id
      assert:
      - PartOrder.${ord}.status == "DRAFT" without any status in the payload
      - PartOrder.${ord}.member_sequence == 1 and pricing_band == "BRONZE"
      - PartOrder.${ord}.version == 1 and created_at is server-stamped
      - PartOrder.${ord}.reserved_unit_count == 0 and reserved units are untouched before confirm
      - CommercialAccount.${acct}.credit_exposure_cents == 1673 after creation, because the draft order already consumes exposure
  - name: account_put_recomputes_posture_from_the_new_terms
    claim_type: computed_fields
    grounds:
    - entities.CommercialAccount.fields.account_posture
    - calculations.account_posture_derivation
    distinguishing_aspect: 'account_posture is computed and never client-settable: shortening credit_terms_days moves an aged account from OPEN to CREDIT_SUSPENDED in the same response.'
    test_recipe:
      setup:
      - Logical clock set; order delivered on an account with credit_terms_days 90, then the clock advanced past the aging window.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S100
          name: Post Satellite
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: P-B
          description: Part B
          line_code: IGN
          list_price_cents: 4000
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p_b: $.data.id
      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s_sat}
          part_id: ${p_b}
          on_hand_units: 5
        as: PartsCategoryManager
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Post Garage
          tax_id: TX-C003
          billing_address: 1 Post St
          home_store_id: ${s_sat}
          credit_limit_cents: 5000000
          credit_terms_days: 90
          delivery_service_level: STORE_PICKUP
        as: CommercialSalesRep
        captures:
          acct: $.data.id
          acct_v: $.data.version
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          line_items:
          - part_id: ${p_b}
            quantity: 1
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
        captures:
          ord: $.data.id
          ord_v: $.data.version
          acct_v1: $.data.version
      - call: POST /commercial/part-orders/{orderId}/confirm
        payload:
          expected_order_version: ${ord_v}
          expected_account_version: ${acct_v1}
        as: CommercialSalesRep
        captures:
          ord_v2: $.data.version
          acct_v2: $.data.version
      - call: POST /commercial/part-orders/{orderId}/allocate
        payload:
          expected_order_version: ${ord_v2}
          expected_account_version: ${acct_v2}
        as: CommercialSalesRep
        captures:
          ord_v3: $.data.version
          acct_v3: $.data.version
      - call: POST /commercial/part-orders/{orderId}/pick
        payload: {}
        as: CommercialSalesRep
      - call: POST /commercial/part-orders/{orderId}/deliver
        payload: {}
        as: DeliveryDriver
        captures:
          acct_v4: $.data.version
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-12-15T08:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: PUT /commercial/commercial-accounts/${acct}
        payload:
          credit_terms_days: 30
          expected_account_version: ${acct_v4}
        as: CreditAnalyst
      assert:
      - after the term change CommercialAccount.${acct}.account_posture == "CREDIT_SUSPENDED"
      - CommercialAccount.${acct}.receivable_balance_cents == 4000
      - GET /commercial/commercial-accounts/${acct}/posture reports oldest_due_at equal to the delivered order's delivered_at plus 30 days
      - CommercialAccount.${acct}.credit_exposure_cents == 0, so the suspension came from the aging test and not the exposure test
      - 'the client cannot set posture directly: posting account_posture OPEN in the same body leaves the derived value unchanged'
- section: state_machines
  instances:
  - name: order_confirm_from_void_is_rejected_and_changes_nothing
    claim_type: invalid_transition
    grounds:
    - state_machines.PartOrder.field.status.transitions.DRAFT_to_VOID
    - errors[ERR_ORDER_NOT_DRAFT]
    distinguishing_aspect: 'A voided order is terminal: confirming it again returns ERR_ORDER_NOT_DRAFT and no reservation, capacity or satisfaction field moves.'
    test_recipe:
      setup:
      - Logical clock set; one draft order that has been voided.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S100
          name: Void Satellite
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: P-C
          description: Part C
          line_code: IGN
          list_price_cents: 1200
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p_c: $.data.id
      - call: POST /commercial/inventory-items
        payload:
          store_id: ${s_sat}
          part_id: ${p_c}
          on_hand_units: 5
        as: PartsCategoryManager
        captures:
          inv_c: $.data.id
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Void Garage
          tax_id: TX-C004
          billing_address: 1 Void St
          home_store_id: ${s_sat}
          credit_limit_cents: 250000
          credit_terms_days: 30
          delivery_service_level: SHOP_DELIVERY
        as: CommercialSalesRep
        captures:
          acct: $.data.id
          acct_v: $.data.version
      - call: POST /commercial/part-orders
        payload:
          account_id: ${acct}
          line_items:
          - part_id: ${p_c}
            quantity: 2
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
        captures:
          ord: $.data.id
          ord_v: $.data.version
      - call: POST /commercial/part-orders/${ord}/void
        payload: {}
        as: CommercialSalesRep
      trigger:
      - call: POST /commercial/part-orders/${ord}/confirm
        payload:
          expected_order_version: ${ord_v}
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
        captures:
          err_id: $.data.error_id
      assert:
      - the response status is 409 with ${err_id} == "ERR_ORDER_NOT_DRAFT"
      - PartOrder.${ord}.status == "VOID"
      - InventoryItem.${inv_c}.reserved_units == 0 and Store.${s_sat}.committed_units_today == 0
  - name: loan_close_from_checked_out_is_rejected_before_inspection
    claim_type: invalid_transition
    grounds:
    - state_machines.ToolLoan.field.status.transitions.INSPECTED_to_CLOSED
    - errors[ERR_LOAN_NOT_INSPECTED]
    distinguishing_aspect: 'A loan that is still out cannot be closed: the close returns ERR_LOAN_NOT_INSPECTED and the held deposit stays held.'
    test_recipe:
      setup:
      - Logical clock set; a loan checked out with a 3000-cent deposit and never returned.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S100
          name: Out Satellite
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Out Garage
          tax_id: TX-C005
          billing_address: 1 Out St
          home_store_id: ${s_sat}
          credit_limit_cents: 250000
          credit_terms_days: 30
          delivery_service_level: SHOP_DELIVERY
        as: CommercialSalesRep
        captures:
          acct: $.data.id
          acct_v: $.data.version
      - call: POST /commercial/tool-catalog
        payload:
          tool_sku: T-C1
          tool_name: Corner Press
          deposit_amount_cents: 3000
          replacement_part_id: null
          replacement_unit_cost_cents: 0
        as: ToolCribAttendant
        captures:
          t1: $.data.id
      - call: POST /commercial/tool-loans
        payload:
          account_id: ${acct}
          tool_catalog_id: ${t1}
          deposit_amount_cents: 3000
        as: CommercialSalesRep
        captures:
          ln: $.data.id
      - call: POST /commercial/tool-loans/${ln}/checkout
        payload:
          accepted_deposit_cents: 3000
          expected_account_version: ${acct_v}
        as: CommercialSalesRep
      trigger:
      - call: POST /commercial/tool-loans/${ln}/close
        payload: {}
        as: ToolCribAttendant
        captures:
          err_id: $.data.error_id
      assert:
      - the response status is 409 with ${err_id} == "ERR_LOAN_NOT_INSPECTED"
      - ToolLoan.${ln}.status == "CHECKED_OUT" and deposit_state == "HELD"
      - CommercialAccount.${acct}.petty_cash_cents == 3000 and deposit_liability_cents == 3000
  - name: route_cancel_from_terminal_route_is_locked_out
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.ServiceRoute.field.status.transitions.DISPATCHED_to_COMPLETED
    - errors[ERR_ROUTE_NOT_CANCELLABLE]
    distinguishing_aspect: 'A completed route is terminal: cancelling it returns ERR_ROUTE_NOT_CANCELLABLE and its delivered stops are left alone.'
    test_recipe:
      setup:
      - Logical clock set; a route dispatched and completed with one delivered customer stop carrying no orders.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S100
          name: Term Satellite
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Term Garage
          tax_id: TX-C006
          billing_address: 1 Term St
          home_store_id: ${s_sat}
          credit_limit_cents: 250000
          credit_terms_days: 30
          delivery_service_level: SHOP_DELIVERY
        as: CommercialSalesRep
        captures:
          acct: $.data.id
      - call: POST /commercial/service-routes
        payload:
          route_code: R-C1
          service_date: '2026-09-02T00:00:00Z'
          driver_id: drv-term
          driver_type: AFFILIATE
          departure_at: '2026-09-02T13:00:00Z'
          shift_end_at: '2026-09-02T21:00:00Z'
        as: RouteDispatcher
        captures:
          r1: $.data.id
          r1_v: $.data.version
      - call: POST /commercial/service-routes/{routeId}/stops
        payload:
          account_id: ${acct}
          stop_kind: CUSTOMER
          delivery_window_start: '2026-09-02T13:30:00Z'
          delivery_window_end: '2026-09-02T14:30:00Z'
          travel_minutes_from_previous: 20
          drop_minutes: 10
          order_ids: []
          expected_route_version: ${r1_v}
        as: RouteDispatcher
        captures:
          st1: $.data.id
          r1_v2: $.data.version
      - call: POST /commercial/service-routes/${r1}/plan
        payload:
          expected_route_version: ${r1_v2}
        as: RouteDispatcher
      - call: POST /commercial/service-routes/${r1}/dispatch
        payload: {}
        as: RouteDispatcher
      - call: POST /commercial/route-stops/${st1}/deliver
        payload: {}
        as: DeliveryDriver
      - call: POST /commercial/service-routes/${r1}/complete
        payload: {}
        as: RouteDispatcher
      trigger:
      - call: POST /commercial/service-routes/${r1}/cancel
        payload: {}
        as: RouteDispatcher
        captures:
          err_id: $.data.error_id
      assert:
      - the response status is 409 with ${err_id} == "ERR_ROUTE_NOT_CANCELLABLE"
      - ServiceRoute.${r1}.status == "COMPLETED" and RouteStop.${st1}.status == "DELIVERED"
      - ServiceRoute.${r1}.run_credit_cents == 500, because an empty affiliate run earns only the base credit
      - ServiceRoute.${r1}.total_miles == 0 and return_at == "2026-09-02T14:00:00Z"
  - name: part_supersede_rejects_a_cycle_through_the_existing_chain
    claim_type: precondition_enforcement
    grounds:
    - state_machines.Part.field.catalog_state.transitions.ACTIVE_to_SUPERSEDED
    - errors[ERR_SUPERSESSION_CYCLE]
    distinguishing_aspect: Superseding a part with one of its own descendants is rejected with ERR_SUPERSESSION_CYCLE, while the legal forward supersession in the same chain succeeds.
    test_recipe:
      setup:
      - Logical clock set; parts P1, P2 and P3 exist and P1 -> P2 -> P3 has been chained.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/parts
        payload:
          sku: G1
          description: Gen One
          line_code: ELC
          list_price_cents: 1000
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p1: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: G2
          description: Gen Two
          line_code: ELC
          list_price_cents: 1100
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p2: $.data.id
      - call: POST /commercial/parts
        payload:
          sku: G3
          description: Gen Three
          line_code: ELC
          list_price_cents: 1200
          core_charge_cents: 0
        as: PartsCategoryManager
        captures:
          p3: $.data.id
      - call: POST /commercial/parts/{partId}/supersede
        payload:
          superseding_part_id: ${p2}
        as: PartsCategoryManager
      - call: POST /commercial/parts/{partId}/supersede
        payload:
          superseding_part_id: ${p3}
        as: PartsCategoryManager
      trigger:
      - call: POST /commercial/parts/${p3}/supersede
        payload:
          superseding_part_id: ${p1}
        as: PartsCategoryManager
        captures:
          err_id: $.data.error_id
      - call: GET /commercial/parts/current
        payload:
          queried_part_id: ${p1}
        as: PartsCategoryManager
      assert:
      - the cycle is rejected with ${err_id} == "ERR_SUPERSESSION_CYCLE"
      - Part.${p3}.catalog_state == "ACTIVE" and superseded_by_part_id is null
      - 'the resolved chain is intact: GET /commercial/parts/current returns current_part_id == Part.${p3}.id'
      - the resolution reports supersession_depth == 2 for the queried part
  - name: repcoverage_posture_starts_scheduled_for_a_future_window
    claim_type: initial_state
    grounds:
    - state_machines.RepCoverage.field.coverage_posture
    distinguishing_aspect: A coverage row created for a window that starts in the future starts SCHEDULED, and is not ACTIVE until the logical clock passes effective_from.
    test_recipe:
      setup:
      - Logical clock set; one rep and one account exist.
      setup_api_calls:
      - call: POST /commercial/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T08:00:00Z'
        as: PlatformAdmin
      - call: POST /commercial/stores
        payload:
          store_code: S100
          name: Cov2 Satellite
          store_type: SATELLITE
          delivery_radius_miles: 5.0
          cutoff_hour_local: 15
          cutoff_buffer_minutes: 30
          promise_time_minutes: 240
          daily_capacity_units: 500
        as: PartsCategoryManager
        captures:
          s_sat: $.data.id
      - call: POST /commercial/sales-reps
        payload:
          email: rep2@parts.example
          full_name: Rep Two
          district_code: D-02
          home_store_id: ${s_sat}
        as: CommercialSalesRep
        captures:
          rep: $.data.id
      - call: POST /commercial/commercial-accounts
        payload:
          shop_name: Cov2 Garage
          tax_id: TX-C007
          billing_address: 1 Cov2 St
          home_store_id: ${s_sat}
          credit_limit_cents: 250000
          credit_terms_days: 30
          delivery_service_level: SHOP_DELIVERY
        as: CommercialSalesRep
        captures:
          acct: $.data.id
      trigger:
      - call: POST /commercial/rep-coverages
        payload:
          rep_id: ${rep}
          account_id: ${acct}
          effective_from: '2026-10-01T00:00:00Z'
          effective_to: '2026-12-01T00:00:00Z'
        as: CommercialSalesRep
        captures:
          cov: $.data.id
      assert:
      - RepCoverage.${cov}.coverage_posture == "SCHEDULED", not ACTIVE
      - RepCoverage.${cov}.effective_from == "2026-10-01T00:00:00Z" and effective_to == "2026-12-01T00:00:00Z"
      - SalesRep.${rep}.active_account_count == 0
      - after the clock moves to 2026-10-15T00:00:00Z the same row reads coverage_posture == "ACTIVE" and SalesRep.${rep}.active_account_count == 1
