      - name: corner_missing_and_wrong_role_headers_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Priority 1 fires before priority 2: a call with no X-User-Role header answers 401 ERR_UNAUTHENTICATED, while a well-formed call from a role absent from the endpoint's roles list answers 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "A RECEIVED complaint on APN-1001 exists"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
              payload: { name: "Riverside", code: "Z-RIV", population_density_per_sqkm: 4200 }
              as: ProgramAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /vector-control/property-owners"
              payload: { full_name: "Dana Ruiz", email: "dana@example.com", mailing_address: "12 Elm St" }
              as: ProgramAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /vector-control/properties"
              payload: { zone_id: "${zone_id}", owner_id: "${owner_id}", address_line: "12 Elm St", parcel_number: "APN-1001", property_type: "RESIDENTIAL_MULTI" }
