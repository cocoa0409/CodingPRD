            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l1_id: "$.data.id" } }
            - { call: "GET /v1/orders/${o_id}", payload: {}, as: Dispatcher, captures: { o_v2: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v2}", truck_id: "${t2_id}" }, as: Dispatcher, captures: { l2_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l1_id}/batch", payload: { batch_time: "2026-08-15T10:00:00Z" }, as: BatchOperator }
          trigger:
            - { call: "POST /v1/loads/${l2_id}/batch", payload: { batch_time: "2026-08-15T10:15:00Z", extra_batch_water_gal: 50 }, as: BatchOperator, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_WC_RATIO_EXCEEDED (priority 5 safety beats priority 7 temporal; w/c would be 0.542 > 0.50 and [10:15,10:45) also overlaps [10:00,10:30))"
            - "Load.${l2_id}.status remains SCHEDULED; no BatchTicket created for ${l2_id}"

  # =================================================================
  # Rule 6 — boundary_precision_check (different metrics, distinct endpoints)
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: wait_fee_exact_free_minutes_boundary
        grounds:
          - calculations.load_final_charge
          - entities.PriceList.fields.wait_free_minutes
        distinguishing_aspect: |
          Metric minutes on POST /v1/loads/{id}/complete: billable wait is
          max(0, on_site - 60), so exactly 60 on-site minutes yields wait_fee_cents == 0
          while 61 minutes yields 250 — the strict-greater boundary is observable in
          two sibling loads of one order.
        test_recipe:
          setup:
            - "Standard catalog (2026-08 index 115.0); order qty 16.0 pour 2026-08-17 (Monday, no surcharge); L1 on T1 on-site exactly 60 min; L2 on T2 on-site 61 min"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi pump mix", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [ { admixture_code: "AEA", dose_oz_per_cwt: 1.55 }, { admixture_code: "WR", dose_oz_per_cwt: 2.65 } ] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/cement-price-indices", payload: { plant_id: "${p_id}", effective_month: "2026-08", index_points: 115.0 }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T2", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t2_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 16.0, pour_date: "2026-08-17", pour_window_start: "07:00", pour_window_end: "12:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l1_id: "$.data.id" } }
            - { call: "GET /v1/orders/${o_id}", payload: {}, as: Dispatcher, captures: { o_v2: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v2}", truck_id: "${t2_id}" }, as: Dispatcher, captures: { l2_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l1_id}/batch", payload: { batch_time: "2026-08-17T09:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l2_id}/batch", payload: { batch_time: "2026-08-17T09:30:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l1_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l2_id}/depart", payload: {}, as: Driver, as_user_id: "drv-2" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T09:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l1_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T10:00:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l2_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-2" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T10:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l1_id}/complete", payload: { discharged_qty_yd3: 8.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T11:01:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l2_id}/complete", payload: { discharged_qty_yd3: 8.0 }, as: Driver, as_user_id: "drv-2" }
          trigger:
            - { call: "GET /v1/loads/${l1_id}", payload: {}, as: Dispatcher, captures: { l1_wait: "$.data.wait_fee_cents", l1_total: "$.data.final_charge_cents" } }
            - { call: "GET /v1/loads/${l2_id}", payload: {}, as: Dispatcher, captures: { l2_wait: "$.data.wait_fee_cents", l2_total: "$.data.final_charge_cents" } }
          assert:
            - "Load.${l1_id}.on_site_minutes == 60 and wait_fee_cents == 0 (equality is free)"
            - "Load.${l2_id}.on_site_minutes == 61 and wait_fee_cents == 250 (first billable minute)"
            - "Load.${l1_id}.final_charge_cents == 138000 and Load.${l2_id}.final_charge_cents == 138250"

      - name: zero_eligible_trucks_empty_selector
        grounds:
          - calculations.truck_selector
          - errors[ERR_NO_TRUCK_AVAILABLE]
        distinguishing_aspect: |
          Metric candidate-set cardinality on POST /v1/orders/{id}/loads: with T1
          OUT_OF_SERVICE and T2 capacity 6.0 < 8.0 requested, the eligible set is
          empty (boundary 0) and the selector falls back to ERR_NO_TRUCK_AVAILABLE.
        test_recipe:
          setup:
            - "Standard catalog; customer; order qty 8.0 CONFIRMED; T1 OUT_OF_SERVICE; T2 capacity 6.0"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi pump mix", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [ { admixture_code: "AEA", dose_oz_per_cwt: 1.55 }, { admixture_code: "WR", dose_oz_per_cwt: 2.65 } ] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T2", capacity_yd3: 6.0 }, as: Dispatcher }
            - { call: "POST /v1/trucks/${t1_id}/out-of-service", payload: {}, as: Dispatcher }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-17", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
          trigger:
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}" }, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NO_TRUCK_AVAILABLE (candidate set empty: T1 not AVAILABLE, T2 capacity 6.0 < 8.0)"
            - "Order.${o_id}.delivery_status remains CONFIRMED and Order.version unchanged"

  # =================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_blocked_by_customer_credit_hold
        grounds:
          - state_machines.Order.PLACED_to_CONFIRMED
          - entities.Customer.fields.credit_status
          - errors[ERR_CREDIT_HOLD]
        distinguishing_aspect: |
          Entity pair Order -> Customer: the confirm transition reads the linked
          Customer's credit_status; when HOLD (exposure 145200 >= limit 100000 from a
          first confirmed order), confirming a second order fails with ERR_CREDIT_HOLD.
        test_recipe:
          setup:
            - "Standard catalog; customer credit_limit_cents 100000; order A confirmed (provisional 145200); credit-review flips customer to HOLD; order B PLACED"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi pump mix", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [ { admixture_code: "AEA", dose_oz_per_cwt: 1.55 }, { admixture_code: "WR", dose_oz_per_cwt: 2.65 } ] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { oa_id: "$.data.id" } }
            - { call: "POST /v1/orders/${oa_id}/confirm", payload: {}, as: Dispatcher }
            - { call: "POST /v1/customers/${c_id}/credit-review", payload: {}, as: PlantManager }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 4.0, pour_date: "2026-08-16", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.0 }, as: Customer, as_user_id: "${c_id}", captures: { ob_id: "$.data.id" } }
          trigger:
            - { call: "POST /v1/orders/${ob_id}/confirm", payload: {}, as: Dispatcher, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_CREDIT_HOLD (402)"
            - "Order.${ob_id}.delivery_status remains PLACED and billing_status remains UNPRICED"

      - name: certify_blocked_until_load_completed
        grounds:
          - state_machines.CylinderSet.FINAL_RECORDED_to_CERTIFIED
          - entities.Load.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair CylinderSet -> Load (different from Order -> Customer): certify is
          gated on the linked Load being COMPLETED; while the load is still POURING the
          same certify request fails with ERR_INVALID_STATE, and succeeds after the
          load completes (strength 4200 >= 4000 -> CERTIFIED).
        test_recipe:
          setup:
            - "Standard catalog; order qty 8.0 pour 2026-08-15; one load POURING with a cylinder set (cast 2026-08-15T10:35 by qc-a); 7-day and 28-day breaks (4200 psi) entered by qc-b while the load stays POURING"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi pump mix", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [ { admixture_code: "AEA", dose_oz_per_cwt: 1.55 }, { admixture_code: "WR", dose_oz_per_cwt: 2.65 } ] }, as: PlantManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /v1/mix-designs/${m_id}/activate", payload: {}, as: PlantManager }
            - { call: "POST /v1/price-lists", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", expected_plant_version: "${p_v}", base_price_per_yd3_cents: 15000, escalation_base_index_points: 100.0, min_load_yd3: 4.0, short_load_fee_cents: 7500, wait_free_minutes: 60, wait_rate_per_minute_cents: 250, wait_fee_cap_cents: 15000, saturday_surcharge_pct: 0.10, activate: true }, as: PlantManager }
            - { call: "POST /v1/customers", payload: { name: "Cust A", credit_limit_cents: 100000000 }, as: PlantManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /v1/trucks", payload: { plant_id: "${p_id}", fleet_number: "T1", capacity_yd3: 10.0 }, as: Dispatcher, captures: { t1_id: "$.data.id" } }
            - { call: "POST /v1/orders", payload: { plant_id: "${p_id}", mix_design_id: "${m_id}", qty_yd3: 8.0, pour_date: "2026-08-15", pour_window_start: "07:00", pour_window_end: "10:00", slump_in: 4.5 }, as: Customer, as_user_id: "${c_id}", captures: { o_id: "$.data.id" } }
            - { call: "POST /v1/orders/${o_id}/confirm", payload: {}, as: Dispatcher, captures: { o_v1: "$.data.version" } }
            - { call: "POST /v1/orders/${o_id}/loads", payload: { qty_yd3: 8.0, expected_order_version: "${o_v1}", truck_id: "${t1_id}" }, as: Dispatcher, captures: { l_id: "$.data.id" } }
            - { call: "POST /v1/loads/${l_id}/batch", payload: { batch_time: "2026-08-15T10:00:00Z" }, as: BatchOperator }
            - { call: "POST /v1/loads/${l_id}/depart", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:30:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/arrive", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/loads/${l_id}/start-pour", payload: {}, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T10:35:00Z" }, as: PlantManager }
            - { call: "POST /v1/loads/${l_id}/cylinder-sets", payload: { num_cylinders: 3 }, as: QCTech, as_user_id: "qc-a", captures: { cs_id: "$.data.id" } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T10:40:00Z" }, as: PlantManager }
            - { call: "POST /v1/cylinder-sets/${cs_id}/breaks", payload: { break_type: "SEVEN_DAY", strength_psi: 3300 }, as: QCTech, as_user_id: "qc-b" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-12T10:40:00Z" }, as: PlantManager }
            - { call: "POST /v1/cylinder-sets/${cs_id}/breaks", payload: { break_type: "TWENTY_EIGHT_DAY", strength_psi: 4200 }, as: QCTech, as_user_id: "qc-b" }
          trigger:
            - { call: "POST /v1/cylinder-sets/${cs_id}/certify", payload: {}, as: QCTech, as_user_id: "qc-c", captures: { err: "$.data.error_id" } }
            - { call: "POST /v1/loads/${l_id}/complete", payload: { discharged_qty_yd3: 8.0 }, as: Driver, as_user_id: "drv-1" }
            - { call: "POST /v1/cylinder-sets/${cs_id}/certify", payload: {}, as: QCTech, as_user_id: "qc-c" }
          assert:
            - "First certify: error_id == ERR_INVALID_STATE (Load.${l_id} still POURING)"
            - "After complete: CylinderSet.${cs_id}.status == CERTIFIED and acceptance_passed == true"
            - "CylinderSet.${cs_id}.certified_by_user_id == qc-c"

  # =================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: plant_batch_interval_half_open_adjacency
        grounds:
          - validations[priority=7]
          - errors[ERR_PLANT_BATCH_CONFLICT]
          - entities.Plant.fields.batch_cycle_minutes
        distinguishing_aspect: |
          Resource Plant, half-open semantics: batch intervals are
          [batch_time, batch_time + 30min); a 10:15 batch collides with [10:00, 10:30)
          but a 10:30 batch is exactly adjacent and MUST be accepted.
        test_recipe:
          setup:
            - "Standard catalog; order qty 24.0 pour 2026-08-17; three 8.0 yd3 loads on T1, T2, T3; L1 batched 10:00"
          setup_api_calls:
            - { call: "POST /v1/plants", payload: { name: "Plant A", batch_cycle_minutes: 30, daily_capacity_yd3: 400 }, as: PlantManager, captures: { p_id: "$.data.id", p_v: "$.data.version" } }
            - { call: "POST /v1/mix-designs", payload: { plant_id: "${p_id}", code: "M4000", name: "4000 psi pump mix", design_strength_psi: 4000, slump_in: 4.0, cement_content_lb_per_yd3: 564, design_wc_ratio: 0.45, max_wc_ratio: 0.50, admixtures: [ { admixture_code: "AEA", dose_oz_per_cwt: 1.55 }, { admixture_code: "WR", dose_oz_per_cwt: 2.65 } ] }, as: PlantManager, captures: { m_id: "$.data.id" } }
