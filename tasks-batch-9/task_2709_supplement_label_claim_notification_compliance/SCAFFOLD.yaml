    input: []
    output: IngredientLot
    side_effects: ["sets lot_status = RELEASED", "moves the full mass from quarantined_quantity_kg to released_quantity_kg", "increments Supplier.total_released_kg by released_quantity_kg (calculations.lot_mass_invariant)", "sets released_at to the logical clock", "increments IngredientLot.version by 1", "increments Supplier.version by 1"]
  - method: POST
    path: "/supplement-compliance/ingredient-lots/{id}/recall"
    description: "Recall a released lot. Compensating transition: the supplier's released-mass ledger returns to its pre-release value with no drift."
    roles: [QualityAssuranceManager]
    code: 200
    input: [recall_reason]
    output: IngredientLot
    side_effects: ["sets lot_status = RECALLED", "decrements Supplier.total_released_kg by released_quantity_kg, restoring the pre-release value exactly (calculations.lot_mass_invariant)", "leaves released_quantity_kg unchanged so the per-lot mass identity still holds", "sets recalled_at to the logical clock", "recomputes label_posture for every Product with an ACTIVE line on this lot's ingredient", "increments IngredientLot.version by 1", "increments Supplier.version by 1"]
  # ---------- CertificateOfAnalysis ----------
  - method: POST
    path: "/supplement-compliance/coas"
    description: "Submit a certificate of analysis for a lot. The identity test method must be approved for the ingredient's class; acceptability is computed at intake but the certificate still requires review."
    roles: [SupplierRepresentative, QualityAssuranceManager]
    code: 201
    input: [lot_id, lab_name, identity_test_method, identity_match, assay_percent_of_label, heavy_metals_pass, microbial_pass]
    output: CertificateOfAnalysis
    side_effects: ["sets coa_status = RECEIVED", "computes coa_acceptable (calculations.coa_identity_method_eligibility)", "sets version = 1"]
  - method: GET
    path: "/supplement-compliance/coas/{id}"
    description: "Fetch one certificate of analysis with its computed acceptability."
    roles: [QualityAssuranceManager, RegulatoryAffairsSpecialist, SupplierRepresentative, ComplianceAuditor]
    code: 200
    input: []
    output: CertificateOfAnalysis
    side_effects: []
  - method: GET
    path: "/supplement-compliance/coas"
    description: "List certificates of analysis, filterable by lot_id (FK reverse-reachability for CertificateOfAnalysis.lot_id) and coa_status."
    roles: [QualityAssuranceManager, RegulatoryAffairsSpecialist, SupplierRepresentative, ComplianceAuditor]
    code: 200
    input: ["lot_id?", "coa_status?", "page?", "page_size?"]
    output: CertificateOfAnalysis[]
    side_effects: []
  - method: POST
    path: "/supplement-compliance/coas/{id}/review"
    description: "Quality review of a received certificate. ACCEPT requires coa_acceptable == true and verifies the lot's identity; REJECT drives the four-hop supplier and label cascade."
    roles: [QualityAssuranceManager]
    code: 200
    input: [decision, "rejection_reason?"]
    output: CertificateOfAnalysis
    side_effects: ["sets coa_status = ACCEPTED or REJECTED", "sets reviewed_by_user_id = X-User-ID and reviewed_at to the logical clock", "on ACCEPT: sets the lot's identity_verified = true", "on REJECT hop 1: increments Product.rejected_coa_count by 1 for every product with an ACTIVE line on the lot's ingredient, then recomputes compliance_risk_index", "on REJECT hop 2: increments Supplier.coa_rejection_count by 1 and moves the supplier QUALIFIED -> PROBATION at 1 rejection or PROBATION -> DISQUALIFIED at 2", "on REJECT hop 3: moves the lot QUARANTINED -> REJECTED (mass to rejected_quantity_kg) or RELEASED -> RECALLED (ledger compensated)", "on REJECT hop 4: recomputes label_posture for every affected Product and, when FROZEN is reached, supersedes their VALIDATED/LOCKED panels and pulls APPROVED claims back to REVISION_REQUESTED", "increments CertificateOfAnalysis.version by 1"]
  # ---------- test-driving endpoint ----------
  - method: POST
    path: "/supplement-compliance/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock to an arbitrary UTC instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the mandatory startup default); it never falls back to real wall-clock time. Every deadline, waiting period and effective-window rule in this scaffold is evaluated against this logical clock."
    roles: [RegulatoryAffairsSpecialist, SubstantiationReviewer, ClaimApprovalOfficer, QualityAssuranceManager, SupplierRepresentative, ComplianceAuditor]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["sets the logical clock to current_utc for all subsequent requests", "does not itself re-evaluate any deadline; timeliness is decided by the next business call"]

errors:
  # ---- auth / shape ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, empty, or naming a role outside the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_VALIDATION
    http: 422
    condition: "missing required body field, unknown enum value, wrong type, or a numeric field outside its declared domain"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "panel effective_from is later than effective_until"
  - id: ERR_SUPPLIER_SCOPE_VIOLATION
    http: 403
    condition: "a SupplierRepresentative receives a lot for, or files a certificate against, a supplier other than the one its X-User-ID names"
  # ---- existence ----
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "no Product with the given path or body id"
  - id: ERR_INGREDIENT_NOT_FOUND
    http: 404
    condition: "no Ingredient with the given path or body id (ingredient_id or predecessor_ingredient_id)"
  - id: ERR_PRODUCT_INGREDIENT_NOT_FOUND
    http: 404
    condition: "no ProductIngredient line with the given path id"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "no StructureFunctionClaim with the given path or body id"
  - id: ERR_DOSSIER_NOT_FOUND
    http: 404
    condition: "no SubstantiationDossier with the given path id"
  - id: ERR_PANEL_NOT_FOUND
    http: 404
    condition: "no LabelPanel with the given path id, or supersedes_panel_id names a panel belonging to a different product"
  - id: ERR_NDI_NOTIFICATION_NOT_FOUND
    http: 404
    condition: "no NDINotification with the given path id"
  - id: ERR_AER_NOT_FOUND
    http: 404
    condition: "no AdverseEventReport with the given path id"
  - id: ERR_SUPPLIER_NOT_FOUND
    http: 404
    condition: "no Supplier with the given path or body id"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "no IngredientLot with the given path or body id"
  - id: ERR_COA_NOT_FOUND
    http: 404
    condition: "no CertificateOfAnalysis with the given path id"
  # ---- optimistic concurrency ----
  - id: ERR_STALE_PRODUCT_VERSION
    http: 412
    condition: "expected_product_version does not equal the Product's current version at POST /supplement-compliance/label-panels"
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version does not equal the StructureFunctionClaim's current version at POST /supplement-compliance/substantiation-dossiers"
  # ---- state ----
  - id: ERR_PRODUCT_STATE_INVALID
    http: 409
    condition: "the Product's lifecycle_status forbids the operation (start-marketing outside LABEL_LOCKED, amendment or line edit outside DRAFT)"
  - id: ERR_INGREDIENT_STATE_INVALID
    http: 409
    condition: "the Ingredient's eligibility_status forbids the operation (re-determining a settled ingredient, amending after determination)"
  - id: ERR_NDI_NOTIFICATION_STATE_INVALID
    http: 409
    condition: "submit on a notification outside DRAFT, or agency-response on a notification outside SUBMITTED"
  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    condition: "the claim's substantiation_status forbids the operation (submit outside DRAFT/REVISION_REQUESTED, approve outside UNDER_SUBSTANTIATION_REVIEW, withdraw or notify outside APPROVED)"
  - id: ERR_DOSSIER_STATE_INVALID
    http: 409
    condition: "evidence appended to a dossier outside DRAFT, or review of a dossier outside UNDER_REVIEW"
  - id: ERR_PANEL_STATE_INVALID
    http: 409
    condition: "validate or amend on a panel outside DRAFT, or lock on a panel outside VALIDATED"
  - id: ERR_AER_STATE_INVALID
    http: 409
    condition: "triage on a report outside RECEIVED, or submit-to-fda on a report outside TRIAGED_SERIOUS"
  - id: ERR_SUPPLIER_STATE_INVALID
    http: 409
    condition: "the requested qualification decision is not legal from the supplier's current qualification_status"
  - id: ERR_LOT_STATE_INVALID
    http: 409
    condition: "release on a lot outside QUARANTINED, or recall on a lot outside RELEASED"
  - id: ERR_COA_STATE_INVALID
    http: 409
    condition: "review of a certificate outside RECEIVED"
  - id: ERR_PRODUCT_INGREDIENT_STATE_INVALID
    http: 409
    condition: "amend or delete of a supplement-facts line whose line_status is not ACTIVE"
  - id: ERR_CLAIM_NOTIFICATION_NOT_DUE
    http: 409
    condition: "notify-fda while the claim's notification dimension is NOT_DUE, SUBMITTED_TIMELY or SUBMITTED_LATE"
  # ---- regulatory gates ----
  - id: ERR_PRODUCT_LABEL_FROZEN
    http: 409
    condition: "a forward labeling or claim action attempted while the governing Product's label_posture is FROZEN"
  - id: ERR_SUPPLIER_NOT_QUALIFIED
    http: 409
    condition: "a supplier in the product's derived supplier set, or the lot's own supplier, is not QUALIFIED"
  - id: ERR_INGREDIENT_NOT_ELIGIBLE
    http: 409
    condition: "an ingredient backing a claim or an ACTIVE panel line is not GRANDFATHERED or NDI_ACKNOWLEDGED"
  - id: ERR_INGREDIENT_INELIGIBLE_FOR_LABEL
    http: 409
    condition: "a supplement-facts line references an ingredient whose eligibility_status is INELIGIBLE or NDI_OBJECTED"
  # ---- label panel construction ----
  - id: ERR_SERVING_SIZE_FORMAT_INVALID
    http: 422
    condition: "serving_size_text does not match the printed serving statement pattern"
  - id: ERR_SERVING_COUNT_MISMATCH
    http: 422
    condition: "servings_per_container_declared disagrees with net_quantity_g / serving_weight_g or with the product's servings_per_container"
  - id: ERR_MANDATORY_WARNING_MISSING
    http: 422
    condition: "a required allergen, contraindication or pediatric warning code is absent from declared_warning_codes"
  - id: ERR_DISCLAIMER_MISSING
    http: 422
    condition: "the product carries an APPROVED structure-function or general-wellbeing claim but the panel's disclaimer_text is absent or not the verbatim required text"
  - id: ERR_PANEL_LINE_BUDGET_EXCEEDED
    http: 422
    condition: "panel_lines_required exceeds panel_lines_allowed for the panel's format and pack size"
  - id: ERR_PRODUCT_HAS_NO_ACTIVE_LINES
    http: 409
    condition: "validation of a panel whose product has no ProductIngredient row with line_status ACTIVE"
  - id: ERR_PANEL_POSITION_TAKEN
    http: 409
    condition: "panel_position already used by another ACTIVE line of the same product"
  # ---- incoming material quality ----
  - id: ERR_IDENTITY_METHOD_NOT_APPROVED
    http: 422
    condition: "identity_test_method is not approved for the ingredient class of the certificate's lot"
  - id: ERR_LOT_IDENTITY_UNVERIFIED
    http: 409
    condition: "release attempted on a lot with no ACCEPTED certificate of analysis"
  - id: ERR_COA_NOT_ACCEPTABLE
    http: 409
    condition: "ACCEPT decision on a certificate whose computed coa_acceptable is false"
  - id: ERR_LOT_CODE_DUPLICATE
    http: 409
    condition: "lot_code already used by another lot of the same supplier"
  - id: ERR_AUDIT_SCORE_INSUFFICIENT
    http: 422
    condition: "QUALIFY decision with no audit_score or an audit_score below 70"
  - id: ERR_REMEDIATION_REFERENCE_REQUIRED
    http: 422
    condition: "REINSTATE decision without a non-empty remediation_reference"
  # ---- temporal windows ----
  - id: ERR_WAITING_PERIOD_NOT_ELAPSED
    http: 409
    condition: "ACKNOWLEDGE recorded before the notification's 75-day waiting_period_end"
  - id: ERR_NDI_WINDOW_OVERLAP
    http: 409
    condition: "a new 75-day notification window would overlap another SUBMITTED notification's window on the same ingredient"
  - id: ERR_PANEL_WINDOW_OVERLAP
    http: 409
    condition: "the incoming panel's buffered effective window intersects a live panel's window on the same product"
  # ---- substantiation and duty segregation ----
  - id: ERR_DUPLICATE_CLAIM_TEXT
    http: 409
    condition: "claim_text already used by a non-WITHDRAWN claim of the same product"
  - id: ERR_DOSSIER_NOT_READY
    http: 409
    condition: "the claim has no single DRAFT dossier with at least one study"
  - id: ERR_DOSSIER_NOT_ACCEPTED
    http: 409
    condition: "approval attempted while the claim has no ACCEPTED dossier"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting X-User-ID authored the dossier being reviewed, or reviewed the dossier backing the claim being approved"
  - id: ERR_SUBSTANTIATION_INSUFFICIENT
    http: 409
    condition: "ACCEPT decision on a dossier whose frozen final_score is below 65.00"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "a fourth substantiation submission attempted (revision_round already 3)"

roles:
  - name: RegulatoryAffairsSpecialist
    description: "Prepares the regulatory record: ingredient dossiers, NDI notifications, products, supplement-facts lines, claims, substantiation dossiers and label panels, and files serious adverse event reports."
    identity: "opaque"
    exclusive_operations:
      - "POST /supplement-compliance/ingredients"
      - "PATCH /supplement-compliance/ingredients/{id}"
      - "POST /supplement-compliance/ingredients/{id}/eligibility-determination"
      - "POST /supplement-compliance/ndi-notifications"
      - "POST /supplement-compliance/ndi-notifications/{id}/submit"
      - "POST /supplement-compliance/ndi-notifications/{id}/agency-response"
      - "POST /supplement-compliance/products"
      - "PATCH /supplement-compliance/products/{id}"
      - "POST /supplement-compliance/product-ingredients"
      - "PATCH /supplement-compliance/product-ingredients/{id}"
      - "DELETE /supplement-compliance/product-ingredients/{id}"
      - "POST /supplement-compliance/claims"
      - "PATCH /supplement-compliance/claims/{id}"
      - "POST /supplement-compliance/claims/{id}/submit-for-review"
      - "POST /supplement-compliance/substantiation-dossiers"
      - "POST /supplement-compliance/substantiation-dossiers/{id}/evidence"
      - "POST /supplement-compliance/label-panels"
      - "PATCH /supplement-compliance/label-panels/{id}"
      - "POST /supplement-compliance/label-panels/{id}/validate"
      - "POST /supplement-compliance/adverse-event-reports/{id}/submit-to-fda"
    shared_operations:
      - "POST /supplement-compliance/claims/{id}/withdraw (with ClaimApprovalOfficer)"
      - "POST /supplement-compliance/adverse-event-reports (with QualityAssuranceManager)"
      - "every GET endpoint"
      - "POST /supplement-compliance/_clock/set_current_utc"
  - name: SubstantiationReviewer
    description: "Independent scientific reviewer of substantiation dossiers; cannot author the evidence it judges and cannot approve the claim it cleared."
    identity: "opaque"
    exclusive_operations:
      - "POST /supplement-compliance/substantiation-dossiers/{id}/review"
    shared_operations:
      - "every GET endpoint except the supplier, lot and certificate reads reserved to quality roles"
      - "POST /supplement-compliance/_clock/set_current_utc"
  - name: ClaimApprovalOfficer
    description: "Signs off approved claims, locks printed panels, starts marketing and files claim notifications with the agency."
    identity: "opaque"
    exclusive_operations:
      - "POST /supplement-compliance/products/{id}/start-marketing"
      - "POST /supplement-compliance/label-panels/{id}/lock"
      - "POST /supplement-compliance/claims/{id}/approve"
      - "POST /supplement-compliance/claims/{id}/notify-fda"
    shared_operations:
      - "POST /supplement-compliance/claims/{id}/withdraw (with RegulatoryAffairsSpecialist)"
      - "every GET endpoint"
      - "POST /supplement-compliance/_clock/set_current_utc"
  - name: QualityAssuranceManager
    description: "Owns supplier qualification, incoming-lot disposition, certificate of analysis review and adverse event triage."
    identity: "opaque"
    exclusive_operations:
      - "POST /supplement-compliance/suppliers"
      - "POST /supplement-compliance/suppliers/{id}/qualification-decision"
      - "POST /supplement-compliance/ingredient-lots/{id}/release"
      - "POST /supplement-compliance/ingredient-lots/{id}/recall"
      - "POST /supplement-compliance/coas/{id}/review"
      - "POST /supplement-compliance/adverse-event-reports/{id}/triage"
    shared_operations:
      - "POST /supplement-compliance/ingredient-lots (with SupplierRepresentative)"
      - "POST /supplement-compliance/coas (with SupplierRepresentative)"
      - "POST /supplement-compliance/adverse-event-reports (with RegulatoryAffairsSpecialist)"
      - "every GET endpoint"
      - "POST /supplement-compliance/_clock/set_current_utc"
  - name: SupplierRepresentative
    description: "Acts as one registered Supplier: X-User-ID equals that Supplier's id. May receive its own lots and file its own certificates, and may never touch another supplier's records."
    identity: "entity_backed:Supplier"
    exclusive_operations: []
    shared_operations:
      - "POST /supplement-compliance/ingredient-lots (own supplier_id only, with QualityAssuranceManager)"
      - "POST /supplement-compliance/coas (own lots only, with QualityAssuranceManager)"
      - "GET endpoints for ingredients, suppliers, lots and certificates"
      - "POST /supplement-compliance/_clock/set_current_utc"
  - name: ComplianceAuditor
    description: "Read-only oversight role: inspects the full regulatory record and risk profile but changes nothing."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "every GET endpoint"
      - "POST /supplement-compliance/_clock/set_current_utc"
