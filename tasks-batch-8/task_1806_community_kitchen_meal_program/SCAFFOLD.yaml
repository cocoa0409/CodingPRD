scenario: "1806. Community Kitchen Meal Program (community meal program): meal planning & production forecast by served count, food sourcing (donation/purchase/rescue) & safety inspection, volunteer shift scheduling & food handler certification, dietary/allergen accommodation & labeling, service model (dine-in/to-go/delivery) logistics, guest count tracking & no-charge/donation policy, kitchen equipment maintenance & inspection, waste reduction & leftover handling"
domain_name: community-kitchen-meal-program
api_prefix: /kitchen

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: compliance / audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Kitchen site display name; unique per program.
      - name: dine_in_capacity
        type: integer
        source: input
        description: Maximum dine-in guests per service run; hard upper bound used by service capacity checks (>= 1).
      - name: togo_capacity_per_window
        type: integer
        source: input
        description: Maximum to-go meals issuable per 30-minute pickup window.
      - name: delivery_radius_km
        type: number
        source: input
        description: Delivery reach in kilometers; orders beyond radius are rejected at creation.
      - name: equipment_posture
        type: enum
        source: computed
        description: "Derived aggregate over EquipmentAsset.status at this site: OPERATIONAL if every CRITICAL asset is OPERATIONAL; RESTRICTED if exactly one CRITICAL asset is DOWN_FOR_REPAIR or IN_MAINTENANCE; HALTED if two or more CRITICAL assets are DOWN_FOR_REPAIR/IN_MAINTENANCE. Recomputed on every equipment status transition."
        constraints: "OPERATIONAL | RESTRICTED | HALTED"
      - name: status
        type: enum
        source: system
        description: Site operating status; CLOSED sites reject all new MealService creation.
        constraints: "OPEN | CLOSED"
        default: OPEN

  - name: MenuDay
    parent: null
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; the kitchen serving this menu day."
      - name: service_date
        type: string
        source: input
        description: ISO date (YYYY-MM-DD) of the planned meal service; one MenuDay per (site_id, service_date) pair (unique).
      - name: forecast_servings
        type: integer
        source: computed
        description: "Production forecast computed by calc production_forecast at PLAN finalize time; pinned until explicitly re-forecast."
      - name: forecast_variant
        type: enum
        source: input
        description: Which forecast variant was applied; recorded for audit.
        constraints: "TRAILING_AVERAGE | DOW_WEIGHTED"
        default: TRAILING_AVERAGE
      - name: committed_servings
        type: integer
        source: computed
        description: Sum of planned_servings over MenuItems of this MenuDay in status CONFIRMED; recomputed on MenuItem confirm/cancel.
        default: 0
      - name: served_count
        type: integer
        source: computed
        description: Running count of MealOrders in fulfillment_status SERVED or DELIVERED against services of this MenuDay; ledger-synced on each order fulfillment transition.
        default: 0
      - name: overproduction_ratio
        type: number
        source: computed
        description: "(committed_servings - served_count) / served_count when served_count > 0, else null; drives waste alerts."
      - name: status
        type: enum
        source: system
        description: Lifecycle of the production plan.
        constraints: "DRAFT | FORECAST_LOCKED | IN_PRODUCTION | SERVING | RECONCILED | CANCELLED"
        default: DRAFT

  - name: MenuItem
    parent: MenuDay
    common_fields: true
    fields:
      - name: menu_day_id
        type: string
        source: input
        description: "FK -> MenuDay.id; owning production plan."
      - name: name
        type: string
        source: input
        description: Dish name.
      - name: planned_servings
        type: integer
        source: input
        description: Servings the kitchen intends to produce for this item (>= 1 while CONFIRMED).
      - name: allergen_tags
        type: array
        source: input
        description: "Subset of the canonical allergen registry: GLUTEN, DAIRY, EGG, SOY, PEANUT, TREE_NUT, FISH, SHELLFISH, SESAME."
      - name: dietary_labels
        type: array
        source: input
        description: "Subset of: VEGETARIAN, VEGAN, HALAL, KOSHER_STYLE, LOW_SODIUM, DIABETIC_FRIENDLY."
      - name: requires_equipment_class
        type: enum
        source: input
        description: Critical equipment class needed to produce this item; used by posture gating.
        constraints: "OVEN | STOVETOP | COLD_HOLDING | NONE"
        default: NONE
      - name: status
        type: enum
        source: system
        description: Item availability lifecycle; UNAVAILABLE items cannot be ordered.
        constraints: "PLANNED | CONFIRMED | UNAVAILABLE | SOLD_OUT"
        default: PLANNED

  - name: FoodBatch
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; receiving kitchen."
      - name: source_type
        type: enum
        source: input
        description: Provenance of the batch; drives inspection strictness and leftover policy.
        constraints: "DONATION | PURCHASE | RESCUE"
      - name: item_description
        type: string
        source: input
        description: Free-text description of the food received.
      - name: quantity_servings
        type: integer
        source: input
        description: Total servings represented by the batch (>= 1).
      - name: remaining_servings
        type: integer
        source: computed
        description: "Servings not yet allocated, served, or wasted; quantity_servings - allocated - wasted. Kept consistent by calc inventory_conservation on every allocation/waste event."
      - name: received_at
        type: datetime
        source: input
        description: When the batch physically arrived.
      - name: use_by
        type: datetime
        source: input
        description: "Safety deadline; batches are unusable at or after this instant (boundary: use_by == now means EXPIRED)."
      - name: unit_cost_cents_per_serving
        type: number
        source: input
        description: "Acquisition cost in cents per serving; MAY be fractional (e.g., 33.335). Required for PURCHASE batches; ignored (treated as 0) for DONATION; RESCUE batches use HANDLING_FEE_CENTS instead."
      - name: inspection_result
        type: enum
        source: system
        description: Outcome of the safety inspection.
        constraints: "PENDING | PASSED | FAILED"
        default: PENDING
      - name: allergen_tags
        type: array
        source: input
        description: Allergens present per supplier declaration; propagates into MenuItems at allocation.
      - name: status
        type: enum
        source: system
        description: Batch lifecycle; see state machine. QUARANTINED batches may re-enter inspection (cycle).
        constraints: "RECEIVED | INSPECTING | ACCEPTED | QUARANTINED | REJECTED | DEPLETED"
        default: RECEIVED

  - name: BatchAllocation
    parent: MenuItem
    common_fields: false
    fields:
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; item the batch feeds."
      - name: food_batch_id
        type: string
        source: input
        description: "FK -> FoodBatch.id; source batch (must be ACCEPTED at allocation time)."
      - name: servings
        type: integer
        source: input
        description: Servings drawn from the batch for this item (>= 1).
      - name: allocated_at
        type: datetime
        source: system
        description: Server-stamped allocation time.

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Volunteer display name.
      - name: email
        type: string
        source: input
        description: Contact email; unique.
      - name: certification_level
        type: enum
        source: input
        description: Food-handler certification tier; gates shift roles.
        constraints: "NONE | BASIC | SUPERVISOR"
        default: NONE
      - name: certification_expires_at
        type: datetime
        source: input
        description: Expiry of food-handler card; certification is invalid at or after this instant. Null when certification_level == NONE.
      - name: hours_balance
        type: number
        source: computed
        description: "Ledger of confirmed shift hours minus cancelled-within-lockout penalties; maintained by calc volunteer_hours_ledger."
        default: 0
      - name: strike_count
        type: integer
        source: computed
        description: No-show strikes; reaching MAX_STRIKES auto-suspends the volunteer.
        default: 0
      - name: status
        type: enum
        source: system
        description: Account status.
        constraints: "ACTIVE | SUSPENDED | INACTIVE"
        default: ACTIVE

  - name: VolunteerShift
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; shift location."
      - name: volunteer_id
        type: string
        source: input
        description: "FK -> Volunteer.id; assignee. Reassignable while SCHEDULED."
      - name: menu_day_id
        type: string
        source: input
        description: "FK -> MenuDay.id; the production day this shift supports."
      - name: role_on_shift
        type: enum
        source: input
        description: Duties; COOK and SUPERVISOR_ON_DUTY require BASIC and SUPERVISOR certification respectively.
        constraints: "PREP | COOK | SERVER | DRIVER | SUPERVISOR_ON_DUTY"
      - name: starts_at
        type: datetime
        source: input
        description: Shift start (inclusive).
      - name: ends_at
        type: datetime
        source: input
        description: Shift end (exclusive); half-open interval [starts_at, ends_at) for overlap checks.
      - name: status
        type: enum
        source: system
        description: Shift lifecycle with reassignment cycle.
        constraints: "SCHEDULED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED"
        default: SCHEDULED

  - name: GuestProfile
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Guest name (or household head).
      - name: household_size
        type: integer
        source: input
        description: People fed per visit; caps per-order quantity (>= 1).
      - name: allergens
        type: array
        source: input
        description: Guest's declared allergens (same registry as MenuItem.allergen_tags).
      - name: dietary_preferences
        type: array
        source: input
        description: Guest's dietary labels (same registry as MenuItem.dietary_labels).
      - name: delivery_address
        type: string
        source: input
        description: Required when the guest will use DELIVERY service; free text.
      - name: delivery_distance_km
        type: number
        source: input
        description: Distance from home site; validated against Site.delivery_radius_km for DELIVERY orders.
      - name: visits_count
        type: integer
        source: computed
        description: Number of MealOrders fulfilled (SERVING/DELIVERED); drives loyalty-tier threshold effects in forecast priors.
        default: 0
      - name: status
        type: enum
        source: system
        description: Guest record status.
        constraints: "ACTIVE | FLAGGED | INACTIVE"
        default: ACTIVE

  - name: MealService
    parent: MenuDay
    common_fields: true
    fields:
      - name: menu_day_id
        type: string
        source: input
        description: "FK -> MenuDay.id; the menu day being served. MenuDay must be IN_PRODUCTION or SERVING."
      - name: service_model
        type: enum
        source: input
        description: Channel this service run operates.
        constraints: "DINE_IN | TO_GO | DELIVERY"
      - name: window_start
        type: datetime
        source: input
        description: Service window open (inclusive).
      - name: window_end
        type: datetime
        source: input
        description: Service window close (exclusive); half-open [window_start, window_end). Windows of the same service_model at the same site MUST NOT overlap; DINE_IN additionally requires a 30-minute buffer against TO_GO windows.
      - name: capacity
        type: integer
        source: input
        description: Max orders this service accepts. DINE_IN capacity MUST be <= Site.dine_in_capacity; TO_GO <= Site.togo_capacity_per_window * number of 30-min slots in window.
      - name: reserved_count
        type: integer
        source: computed
        description: Count of MealOrders in status RESERVED or IN_PREP against this service; incremented/decremented by order state transitions.
        default: 0
      - name: requires_supervisor
        type: boolean
        source: input
        description: If true, service cannot open unless a SUPERVISOR_ON_DUTY shift is CHECKED_IN for the same site and overlapping window.
        default: false
      - name: status
        type: enum
        source: system
        description: Service run lifecycle.
        constraints: "PLANNED | OPEN | PAUSED | CLOSED | ABORTED"
        default: PLANNED

  - name: MealOrder
    parent: MealService
    common_fields: true
    fields:
      - name: meal_service_id
        type: string
        source: input
        description: "FK -> MealService.id; service run fulfilling the order. Service must be OPEN at reservation time."
      - name: guest_id
        type: string
        source: input
        description: "FK -> GuestProfile.id; ordering guest."
      - name: menu_item_id
        type: string
        source: input
        description: "FK -> MenuItem.id; dish ordered. Must belong to the service's MenuDay and be CONFIRMED."
      - name: quantity
        type: integer
        source: input
        description: Servings ordered; 1 <= quantity <= GuestProfile.household_size.
      - name: substitution_allowed
        type: boolean
        source: input
        description: Whether kitchen may substitute an allergen-safe alternative when the ordered item goes UNAVAILABLE.
        default: true
      - name: prep_status
        type: enum
        source: system
        description: "Parallel dimension 1 (kitchen side): QUEUED -> IN_PREP -> READY; may revert READY -> IN_PREP on allergen re-check failure."
        constraints: "QUEUED | IN_PREP | READY"
        default: QUEUED
      - name: fulfillment_status
        type: enum
        source: system
        description: "Parallel dimension 2 (guest side): RESERVED -> {SERVED | DELIVERED | RELEASED}; RELEASED is the no-charge cancel path that returns capacity."
        constraints: "RESERVED | SERVED | DELIVERED | RELEASED | EXPIRED"
        default: RESERVED
      - name: charge_cents
        type: integer
        source: computed
        description: Always 0 under the no-charge policy while MealService status != ABORTED; donation prompt handled out of band. Kept as a computed field so policy change audits have a single field.
        default: 0

  - name: EquipmentAsset
    parent: Site
    common_fields: true
    fields:
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; kitchen owning the asset."
      - name: name
        type: string
        source: input
        description: Asset name (e.g., 'Combi Oven 1').
      - name: equipment_class
        type: enum
        source: input
        description: Functional class referenced by MenuItem.requires_equipment_class.
        constraints: "OVEN | STOVETOP | COLD_HOLDING | GENERAL"
      - name: criticality
        type: enum
        source: input
        description: CRITICAL assets drive Site.equipment_posture; SUPPORT assets do not.
        constraints: "CRITICAL | SUPPORT"
        default: SUPPORT
      - name: last_inspected_at
        type: datetime
        source: system
        description: Server-stamped when an inspection record completes.
      - name: next_inspection_due
        type: datetime
        source: computed
        description: last_inspected_at + INSPECTION_INTERVAL_DAYS; assets past due cannot transition to OPERATIONAL until re-inspected.
      - name: status
        type: enum
        source: system
        description: Equipment lifecycle; transitions recompute Site.equipment_posture.
        constraints: "OPERATIONAL | IN_MAINTENANCE | DOWN_FOR_REPAIR | DECOMMISSIONED"
        default: OPERATIONAL

  - name: WasteLog
    parent: MenuDay
    common_fields: false
    fields:
      - name: menu_day_id
        type: string
        source: input
        description: "FK -> MenuDay.id; the production day being reconciled."
      - name: food_batch_id
        type: string
        source: input
        description: "FK -> FoodBatch.id; batch the waste is attributed to."
      - name: servings_wasted
        type: integer
        source: input
        description: Servings discarded (>= 1).
      - name: reason
        type: enum
        source: input
        description: Waste classification; SAFETY_DISCARD requires the batch to be QUARANTINED or expired.
        constraints: "OVERPRODUCTION | SPOILAGE | SAFETY_DISCARD | PACKAGING_DAMAGE"
      - name: disposition
        type: enum
        source: input
        description: Where the leftover went; COMPOST/DISCARD count against waste ratio, RESCUE_REDIRECT does not.
        constraints: "DISCARD | COMPOST | RESCUE_REDIRECT"
      - name: logged_at
        type: datetime
        source: system
        description: Server-stamped.

state_machines:
  - entity: MenuDay
    initial_state: DRAFT
    terminal_states: [RECONCILED, CANCELLED]
    transitions:
      - from: DRAFT
        to: FORECAST_LOCKED
        trigger: "POST /kitchen/menu-days/{id}/lock-forecast"
        actor: KitchenManager
        preconditions:
          - "At least one MenuItem under this MenuDay has status CONFIRMED"
          - "All FoodBatches referenced by BatchAllocations of this MenuDay's items have status ACCEPTED"
        side_effects:
          - "Run calc production_forecast with the MenuDay's forecast_variant; set forecast_servings"
          - "Increments MenuDay.version by 1"
      - from: FORECAST_LOCKED
        to: IN_PRODUCTION
        trigger: "POST /kitchen/menu-days/{id}/start-production"
        actor: KitchenManager
        preconditions:
          - "Site.status == OPEN"
          - "Site.equipment_posture != HALTED"
        side_effects:
          - "Increments MenuDay.version by 1"
      - from: IN_PRODUCTION
        to: SERVING
        trigger: "POST /kitchen/menu-days/{id}/open-service (auto when first MealService opens)"
        actor: KitchenManager
        preconditions:
          - "At least one MealService under this MenuDay transitions PLANNED -> OPEN"
        side_effects:
          - "Increments MenuDay.version by 1"
      - from: SERVING
        to: RECONCILED
        trigger: "POST /kitchen/menu-days/{id}/reconcile"
        actor: KitchenManager
        preconditions:
          - "All MealServices under this MenuDay are CLOSED or ABORTED"
          - "All MealOrders under those services have terminal fulfillment_status (SERVED | DELIVERED | RELEASED | EXPIRED)"
        side_effects:
          - "Run calc waste_ratio for this MenuDay; if waste_ratio > WASTE_ALERT_THRESHOLD set MenuDay.overproduction alert flag (surface via GET)"
          - "Increments MenuDay.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /kitchen/menu-days/{id}/cancel"
        actor: KitchenManager
        preconditions:
          - "No MealService exists under this MenuDay with status OPEN or PAUSED"
        side_effects:
          - "Cascade: every MenuItem under this MenuDay in status PLANNED or CONFIRMED -> UNAVAILABLE"
          - "Cascade: every BatchAllocation under those MenuItems is released (FoodBatch.remaining_servings restored per calc inventory_conservation)"
          - "Cascade: every VolunteerShift referencing this MenuDay in status SCHEDULED -> CANCELLED"
          - "Increments MenuDay.version by 1"

  - entity: MenuItem
    initial_state: PLANNED
    terminal_states: [UNAVAILABLE, SOLD_OUT]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /kitchen/menu-items/{id}/confirm"
        actor: KitchenManager
        preconditions:
          - "MenuDay.status == DRAFT"
          - "Sum of BatchAllocation.servings for this item >= planned_servings (full coverage required)"
          - "Every allocated FoodBatch has inspection_result == PASSED and status == ACCEPTED"
        side_effects:
          - "MenuDay.committed_servings += planned_servings (ledger sync); recompute MenuDay.overproduction_ratio"
          - "Increments MenuDay.version by 1 (parent ledger mutation)"
      - from: CONFIRMED
        to: UNAVAILABLE
        trigger: "POST /kitchen/menu-items/{id}/mark-unavailable or cascade from batch quarantine / equipment posture"
        actor: KitchenManager | system
        preconditions:
          - "MenuDay.status IN {DRAFT, FORECAST_LOCKED, IN_PRODUCTION, SERVING}"
        side_effects:
          - "MenuDay.committed_servings -= planned_servings"
          - "Cascade: every MealOrder with menu_item_id == this item and fulfillment_status == RESERVED and prep_status != READY is either substituted (if substitution_allowed, re-point to a CONFIRMED allergen-compatible MenuItem on the same MenuDay chosen by selector policy) or released (fulfillment_status -> RELEASED, MealService.reserved_count -= 1)"
      - from: PLANNED
        to: UNAVAILABLE
        trigger: "POST /kitchen/menu-items/{id}/mark-unavailable"
        actor: KitchenManager
        preconditions: []
        side_effects:
          - "No ledger change (was not committed)"
      - from: CONFIRMED
        to: SOLD_OUT
        trigger: "system auto-transition"
        actor: system
        preconditions:
          - "Count of MealOrders referencing this item with fulfillment_status IN {RESERVED, SERVED, DELIVERED} >= planned_servings"
        side_effects:
          - "Item excluded from further ordering"

  - entity: FoodBatch
    initial_state: RECEIVED
    terminal_states: [REJECTED, DEPLETED]
    transitions:
      - from: RECEIVED
        to: INSPECTING
        trigger: "POST /kitchen/food-batches/{id}/begin-inspection"
        actor: FoodSafetyOfficer
        preconditions:
          - "Logical clock now < use_by (batch not yet expired)"
        side_effects: []
      - from: INSPECTING
        to: ACCEPTED
        trigger: "POST /kitchen/food-batches/{id}/record-inspection with result PASSED"
        actor: FoodSafetyOfficer
        preconditions:
          - "Logical clock now < use_by"
        side_effects:
          - "inspection_result = PASSED; remaining_servings = quantity_servings - already wasted"
      - from: INSPECTING
        to: QUARANTINED
        trigger: "POST /kitchen/food-batches/{id}/record-inspection with result FAILED"
        actor: FoodSafetyOfficer
        preconditions: []
        side_effects:
          - "inspection_result = FAILED"
          - "Cascade depth-3: for every BatchAllocation of this batch -> owning MenuItem (if CONFIRMED) -> UNAVAILABLE; that MenuItem transition cascades to RESERVED MealOrders (substitute-or-release) and MenuDay.committed_servings ledger"
      - from: QUARANTINED
        to: INSPECTING
        trigger: "POST /kitchen/food-batches/{id}/begin-inspection (re-inspection cycle)"
        actor: FoodSafetyOfficer
        preconditions:
          - "Logical clock now < use_by"
          - "A SAFETY_DISCARD WasteLog covering the contaminated portion has been recorded for this batch"
        side_effects:
          - "Re-inspection round count increments (audit)"
      - from: QUARANTINED
        to: REJECTED
        trigger: "POST /kitchen/food-batches/{id}/reject"
        actor: FoodSafetyOfficer
        preconditions: []
        side_effects:
          - "remaining_servings forced to 0; outstanding BatchAllocations released"
      - from: ACCEPTED
        to: INSPECTING
        trigger: "POST /kitchen/food-batches/{id}/begin-inspection (routine re-inspection of an accepted batch)"
        actor: FoodSafetyOfficer
        preconditions:
          - "Logical clock now < use_by"
        side_effects:
          - "inspection_result reset to PENDING for the new round"
      - from: ACCEPTED
        to: DEPLETED
        trigger: "system auto-transition"
        actor: system
        preconditions:
          - "remaining_servings == 0 (all allocated, served, or wasted)"
        side_effects: []

  - entity: VolunteerShift
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CHECKED_IN
        trigger: "POST /kitchen/volunteer-shifts/{id}/check-in"
        actor: Volunteer
        preconditions:
          - "Volunteer.status == ACTIVE"
          - "Volunteer certification valid for role_on_shift at logical clock now (BASIC for COOK; SUPERVISOR for SUPERVISOR_ON_DUTY; expires_at > now)"
          - "Logical clock now within [starts_at - 15min, ends_at)"
        side_effects: []
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /kitchen/volunteer-shifts/{id}/complete"
        actor: KitchenManager
        preconditions:
          - "Logical clock now >= ends_at OR KitchenManager early-close override flag set"
        side_effects:
          - "Run calc volunteer_hours_ledger: Volunteer.hours_balance += (ends_at - starts_at) hours"
      - from: CHECKED_IN
        to: SCHEDULED
        trigger: "POST /kitchen/volunteer-shifts/{id}/reassign (cycle: revert to SCHEDULED under a new volunteer_id)"
        actor: KitchenManager
        preconditions:
          - "New volunteer satisfies certification + overlap rules"
        side_effects:
          - "volunteer_id replaced; prior volunteer hours unchanged"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "system auto-transition at ends_at when never CHECKED_IN, or POST /kitchen/volunteer-shifts/{id}/mark-no-show"
        actor: system | KitchenManager
        preconditions:
          - "Logical clock now >= ends_at and no CHECKED_IN record"
        side_effects:
          - "Volunteer.strike_count += 1; if strike_count >= MAX_STRIKES then Volunteer.status -> SUSPENDED (cascade depth-2)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /kitchen/volunteer-shifts/{id}/cancel"
        actor: Volunteer | KitchenManager
        preconditions:
          - "If actor is Volunteer: logical clock now < starts_at - CANCEL_LOCKOUT_HOURS (else ERR_CANCEL_IN_LOCKOUT)"
        side_effects:
          - "If cancelled inside lockout by KitchenManager with penalty flag, Volunteer.hours_balance -= PENALTY_HOURS (floor at 0)"

  - entity: MealService
    initial_state: PLANNED
    terminal_states: [CLOSED, ABORTED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /kitchen/meal-services/{id}/open"
        actor: KitchenManager
        preconditions:
          - "MenuDay.status == IN_PRODUCTION"
          - "Site.equipment_posture != HALTED"
          - "If requires_supervisor: exists VolunteerShift for same site, role_on_shift == SUPERVISOR_ON_DUTY, status == CHECKED_IN, whose [starts_at, ends_at) overlaps [window_start, window_end)"
          - "No other MealService at the same site with same service_model whose window overlaps (half-open); if this service is DINE_IN, additionally no TO_GO service whose window starts within 30 minutes before or after this window (buffer rule)"
        side_effects:
          - "MenuDay auto-transition IN_PRODUCTION -> SERVING (first open)"
      - from: OPEN
        to: PAUSED
        trigger: "POST /kitchen/meal-services/{id}/pause"
        actor: KitchenManager
        preconditions: []
        side_effects:
          - "New MealOrder creation rejected while PAUSED"
      - from: PAUSED
        to: OPEN
        trigger: "POST /kitchen/meal-services/{id}/resume"
        actor: KitchenManager
        preconditions:
          - "Site.equipment_posture != HALTED"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /kitchen/meal-services/{id}/close"
        actor: KitchenManager
        preconditions: []
        side_effects:
          - "All non-terminal MealOrders (fulfillment_status == RESERVED, any prep_status) auto-transition to EXPIRED; MealService.reserved_count decremented for each"
      - from: PAUSED
        to: CLOSED
        trigger: "POST /kitchen/meal-services/{id}/close"
        actor: KitchenManager
        preconditions: []
        side_effects:
          - "All non-terminal MealOrders auto-transition to EXPIRED; reserved_count decremented for each"
      - from: OPEN
        to: ABORTED
        trigger: "POST /kitchen/meal-services/{id}/abort"
        actor: KitchenManager
        preconditions:
          - "Site.equipment_posture == HALTED OR explicit manager override"
        side_effects:
          - "All RESERVED/IN_PREP MealOrders -> RELEASED with reserved_count -= n"
          - "Site posture re-check scheduled (derived recompute)"

  - entity: MealOrder
    initial_state: RESERVED/QUEUED (both dimensions)
    terminal_states: [SERVED, DELIVERED, RELEASED, EXPIRED]
    transitions:
      - from: "prep QUEUED"
        to: "prep IN_PREP"
        trigger: "POST /kitchen/meal-orders/{id}/start-prep"
        actor: Volunteer
        preconditions:
          - "MealService.status == OPEN"
          - "Caller is CHECKED_IN on a shift for this site covering now with role IN {PREP, COOK}"
        side_effects: []
      - from: "prep IN_PREP"
        to: "prep READY"
        trigger: "POST /kitchen/meal-orders/{id}/mark-ready"
        actor: Volunteer
        preconditions:
          - "MenuItem.allergen_tags INTERSECT GuestProfile.allergens == {} (re-checked at READY time, not reservation time)"
        side_effects: []
      - from: "prep READY"
        to: "prep IN_PREP"
        trigger: "POST /kitchen/meal-orders/{id}/rework (allergen re-check failure loop)"
        actor: Volunteer
        preconditions:
          - "reason recorded"
        side_effects:
          - "Audit note appended"
      - from: "fulfillment RESERVED"
        to: "fulfillment SERVED"
        trigger: "POST /kitchen/meal-orders/{id}/serve"
        actor: Volunteer
        preconditions:
          - "prep_status == READY"
          - "MealService.service_model == DINE_IN"
          - "MealService.status == OPEN"
        side_effects:
          - "MenuDay.served_count += quantity; GuestProfile.visits_count += 1; MealService.reserved_count -= 1; recompute MenuDay.overproduction_ratio (cascade depth-3 ledger)"
      - from: "fulfillment RESERVED"
        to: "fulfillment DELIVERED"
        trigger: "POST /kitchen/meal-orders/{id}/deliver"
        actor: Volunteer
        preconditions:
          - "prep_status == READY"
          - "MealService.service_model == DELIVERY"
          - "Caller is CHECKED_IN on DRIVER shift covering now"
        side_effects:
          - "MenuDay.served_count += quantity; GuestProfile.visits_count += 1; MealService.reserved_count -= 1"
      - from: "fulfillment RESERVED"
        to: "fulfillment RELEASED"
        trigger: "POST /kitchen/meal-orders/{id}/release"
        actor: Guest | KitchenManager | system
        preconditions:
          - "If actor is Guest: before MealService.window_start"
        side_effects:
          - "MealService.reserved_count -= 1; capacity returned to pool; item sold-out re-evaluated"
      - from: "fulfillment RESERVED"
        to: "fulfillment EXPIRED"
        trigger: "system at MealService close"
        actor: system
        preconditions:
          - "Parent MealService transitioned to CLOSED with order still non-terminal"
        side_effects:
          - "MealService.reserved_count -= 1"

  - entity: EquipmentAsset
    initial_state: OPERATIONAL
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: OPERATIONAL
        to: IN_MAINTENANCE
        trigger: "POST /kitchen/equipment-assets/{id}/schedule-maintenance"
        actor: KitchenManager
        preconditions:
          - "Maintenance window [maint_start, maint_end] does not overlap (closed-interval with 15-minute buffer) any other IN_MAINTENANCE record for the same equipment_class at the same site"
        side_effects:
          - "Recompute Site.equipment_posture"
      - from: IN_MAINTENANCE
        to: OPERATIONAL
        trigger: "POST /kitchen/equipment-assets/{id}/complete-maintenance"
        actor: KitchenManager
        preconditions: []
        side_effects:
          - "last_inspected_at = now; next_inspection_due recomputed; recompute Site.equipment_posture"
      - from: OPERATIONAL
        to: DOWN_FOR_REPAIR
        trigger: "POST /kitchen/equipment-assets/{id}/report-fault"
        actor: KitchenManager | Volunteer
        preconditions: []
        side_effects:
          - "Recompute Site.equipment_posture; if posture becomes HALTED, cascade: every MealService OPEN at this site whose MenuDay has MenuItems requiring this equipment_class -> ABORTED, whose orders RELEASE"
      - from: DOWN_FOR_REPAIR
        to: OPERATIONAL
        trigger: "POST /kitchen/equipment-assets/{id}/complete-repair"
        actor: KitchenManager
        preconditions:
          - "Logical clock now <= next_inspection_due OR inspection completed at repair close"
        side_effects:
          - "last_inspected_at = now if inspected; next_inspection_due recomputed; recompute Site.equipment_posture"
      - from: DOWN_FOR_REPAIR
        to: DECOMMISSIONED
        trigger: "POST /kitchen/equipment-assets/{id}/decommission"
        actor: KitchenManager
        preconditions: []
        side_effects:
          - "Recompute Site.equipment_posture (asset excluded from posture set)"

  - entity: Volunteer
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system on strike_count reaching MAX_STRIKES, or POST /kitchen/volunteers/{id}/suspend"
        actor: system | KitchenManager
        preconditions: []
        side_effects:
          - "All SCHEDULED future shifts of this volunteer -> CANCELLED (no penalty)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /kitchen/volunteers/{id}/reinstate"
        actor: KitchenManager
        preconditions:
          - "strike_count reset to 0 by manager action"
        side_effects:
          - "strike_count = 0"

  - entity: GuestProfile
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: FLAGGED
        trigger: "POST /kitchen/guests/{id}/flag"
        actor: KitchenManager
        preconditions: []
        side_effects:
          - "FLAGGED guests may still order but every order requires KitchenManager approval path (handled as validation)"
      - from: FLAGGED
        to: ACTIVE
        trigger: "POST /kitchen/guests/{id}/unflag"
        actor: KitchenManager
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /kitchen/guests/{id}/deactivate"
        actor: KitchenManager
        preconditions:
          - "No MealOrder with fulfillment_status == RESERVED exists for this guest"
        side_effects: []

concurrency_rules:
  - rule_id: menu-day-forecast-lock-stale
    parent_entity: MenuDay
    write_endpoint: "POST /kitchen/menu-days/{id}/lock-forecast"
    occ_field: "expected_menu_day_version"
    description: |
      Locking the forecast against a MenuDay whose version has advanced since
      the client last observed it is rejected with ERR_STALE_VERSION, because
      an intervening MenuItem confirm (which bumps MenuDay.version via ledger
      sync) invalidates the client's committed_servings view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: service-open-stale-menuday
    parent_entity: MenuDay
    write_endpoint: "POST /kitchen/meal-services/{id}/open"
    occ_field: "expected_menu_day_version"
    description: |
      Opening a MealService carries expected_menu_day_version; if the parent
      MenuDay's version advanced since the client read it (e.g., a committed
      item went UNAVAILABLE and recomputed committed_servings), the open is
      rejected with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: production_forecast
    trigger: "MenuDay DRAFT -> FORECAST_LOCKED"
    algorithm: forward_looking
    formula: |
      base = served_count totals from the last LOOKBACK_DAYS reconciled MenuDays
      at the same site with the same weekday-of-week as service_date.
      TRAILING_AVERAGE variant:
        forecast = ceil( mean(served_count over last LOOKBACK_DAYS reconciled
                       MenuDays at this site, any weekday) * GROWTH_FACTOR )
      DOW_WEIGHTED variant:
        forecast = ceil( 0.6 * mean(served_count on same weekday, last 4 occurrences)
                       + 0.4 * mean(served_count over all reconciled MenuDays,
                                    last LOOKBACK_DAYS) ) * GROWTH_FACTOR
      If no reconciled history exists, forecast = DEFAULT_SEED_SERVINGS.
    input_set: "RECONCILED MenuDays at same site; excludes CANCELLED; window is last LOOKBACK_DAYS relative to service_date inclusive of service_date - 1."
    constants:
      LOOKBACK_DAYS: 28
      GROWTH_FACTOR: 1.05
      DEFAULT_SEED_SERVINGS: 60
    precision: "integer servings, ceil rounding"
    variants:
      - name: TRAILING_AVERAGE
        when: "forecast_variant == TRAILING_AVERAGE"
        difference: "Plain trailing mean over all weekdays; ignores day-of-week seasonality."
      - name: DOW_WEIGHTED
        when: "forecast_variant == DOW_WEIGHTED"
        difference: "Blends same-weekday mean (weight 0.6) with overall trailing mean (weight 0.4); for identical history the two variants diverge whenever same-weekday mean != overall mean."

  - name: portion_commitment
    trigger: "MenuItem PLANNED -> CONFIRMED (coverage check) and on BatchAllocation creation"
    algorithm: constraint_propagation
    formula: |
      required = planned_servings
      covered  = sum(BatchAllocation.servings for this MenuItem)
      coverage_ok = covered >= required
      Additionally per-allocation: servings_to_allocate = min(requested,
        FoodBatch.remaining_servings) but reject if requested > remaining
        (no silent clamp — explicit rejection with ERR_INSUFFICIENT_BATCH).
      Non-linear interaction: allocation is bounded by (batch remaining,
      item uncovered need, and — for RESCUE batches only — a RESCUE_CAP of
      0.5 * quantity_servings per single MenuItem), i.e.
      allowed = min(requested, remaining, need, rescue_cap_if_rescue).
    input_set: "BatchAllocations of this MenuItem; FoodBatch.status == ACCEPTED only."
    constants:
      RESCUE_CAP_RATIO: 0.5
    precision: "integer servings"

  - name: inventory_conservation
    trigger: "every BatchAllocation create/release, every WasteLog create, every batch accept"
    algorithm: aggregation
    formula: |
      For each FoodBatch, invariant:
        quantity_servings == allocated_servings + wasted_servings + remaining_servings
      where allocated_servings sums BatchAllocations of the batch (any MenuItem)
      and wasted_servings sums WasteLog.servings_wasted for this batch with
      disposition IN {DISCARD, COMPOST}.
      RESCUE_REDIRECT waste does NOT decrement remaining_servings (food left
      the kitchen to another program; it is subtracted from quantity for the
      purpose of remaining but excluded from the kitchen's waste_ratio).
      remaining_servings = quantity_servings - allocated - wasted_discard_compost - rescue_redirected.
    input_set: "BatchAllocations and WasteLogs of the batch."
    precision: "integer servings; invariant must hold exactly after every mutation"
    variants:
      - name: kitchen_view
        when: "waste_ratio reporting"
        difference: "RESCUE_REDIRECT excluded from waste numerator (counts as successful diversion)."
      - name: audit_view
        when: "batch depletion check"
        difference: "RESCUE_REDIRECT included in the 'left the building' total driving DEPLETED."

  - name: service_capacity_check
    trigger: "MealOrder creation and MealService creation"
    algorithm: threshold
    formula: |
      For MealService creation:
        DINE_IN:  capacity <= Site.dine_in_capacity
        TO_GO:    capacity <= Site.togo_capacity_per_window * floor(window_minutes / 30)
        DELIVERY: capacity unbounded by site, but each order validates
                  GuestProfile.delivery_distance_km <= Site.delivery_radius_km
      For MealOrder creation:
        accept iff reserved_count + 1 <= capacity   (boundary: reserved_count == capacity - 1 accepts; == capacity rejects)
        Boundary is inclusive-at-capacity minus one: the Nth order where
        N == capacity is the last accepted; N+1th -> ERR_CAPACITY_FULL.
    input_set: "MealOrders of the service with fulfillment_status IN {RESERVED} plus IN_PREP pipeline."
    precision: "integer count; comparison is reserved_count < capacity (strict less-than to admit one more)"

  - name: volunteer_hours_ledger
    trigger: "VolunteerShift -> COMPLETED; KitchenManager penalty cancel"
    algorithm: chronological
    formula: |
      hours_balance applied in chronological order of shift ends_at:
        on COMPLETE: hours_balance += (ends_at - starts_at) in fractional hours, round_half_up to 2dp
        on PENALTY cancel inside lockout: hours_balance = max(0, hours_balance - PENALTY_HOURS)
      Order matters because the floor at 0 is applied per-event, not at read time.
    input_set: "Completed shifts and penalty events of the volunteer, replayed by ends_at ASC, tie-break created_at ASC."
    constants:
      PENALTY_HOURS: 2.0
      MAX_STRIKES: 3
    precision: "2 decimal places, round_half_up per event"

  - name: cost_per_served_meal
    trigger: "MenuDay RECONCILED reporting (GET /kitchen/menu-days/{id}/summary)"
    algorithm: tiered_pricing
    formula: |
      One cost line per CONFIRMED MenuItem, fed by its allocated batches:
        PURCHASE: line_cost_cents = round_half_up( batch.unit_cost_cents_per_serving
                                     * item.planned_servings, 2dp )
        DONATION: line_cost_cents = 0
        RESCUE:   line_cost_cents = round_half_up( HANDLING_FEE_CENTS
                                     * item.planned_servings, 2dp )
      total_cost_cents = sum(line_cost_cents over items)   # round-per-line THEN sum (PINNED)
      cost_per_served_cents = round_half_up( total_cost_cents / max(1, served_count), 2dp )
      Rounding order is pinned: per-line rounding BEFORE summation; summing raw
      unrounded values then rounding once produces different cents and is NOT
      compliant (e.g., two lines of raw 100.005 sum to 200.01 under sum-then-round
      vs 100.01 + 100.01 = 200.02 under the pinned order).
    input_set: "MenuItems of the MenuDay that reached CONFIRMED (includes later UNAVAILABLE); served_count from MenuDay."
    constants:
      HANDLING_FEE_CENTS: 35
    precision: "cents with 2 decimal places (1/100-cent granularity); round_half_up per line and per final division"

  - name: waste_ratio
    trigger: "MenuDay RECONCILED"
    algorithm: threshold
    formula: |
      wasted = sum(WasteLog.servings_wasted where disposition IN {DISCARD, COMPOST})
      produced = MenuDay.committed_servings at reconcile time
      waste_ratio = wasted / produced   (produced == 0 -> ratio is null, no alert)
      Alert when waste_ratio > WASTE_ALERT_THRESHOLD (strict greater-than;
      ratio exactly == threshold does NOT alert).
    input_set: "WasteLogs of the MenuDay; MenuDay.committed_servings."
    constants:
      WASTE_ALERT_THRESHOLD: 0.15
    precision: "4 decimal places, round_half_up"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role value is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is permitted on the endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "Path-referenced resources exist, validated left-to-right (site -> menu day -> item/service/order)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "Target entity is in a state from which the requested transition is defined (state machine preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: business_safety
    check: "Food-safety gates: batch not expired (now < use_by), batch inspection PASSED before allocation, allergen intersection empty at order READY, SAFETY_DISCARD waste only for quarantined/expired batches"
    error_id: ERR_SAFETY_VIOLATION
    http_status: 422
    applies_to: "food-batch, allocation, order-ready, waste endpoints"
  - priority: 6
    category: business_temporal
    check: "Temporal conflicts: shift overlap per volunteer (half-open), service window overlap per site+model (half-open), DINE_IN vs TO_GO 30-minute buffer, maintenance window closed-interval with 15-minute buffer, certification expiry > now"
    error_id: ERR_TEMPORAL_CONFLICT
    http_status: 422
    applies_to: "shift, service, maintenance endpoints"
  - priority: 7
    category: business_constraint
    check: "Uniqueness and shape constraints: one MenuDay per (site_id, service_date); email unique; quantity within household_size; enum membership; capacity shape rules per service_model"
    error_id: ERR_CONSTRAINT_VIOLATION
    http_status: 422
    applies_to: "create/update endpoints"
  - priority: 8
    category: business_referential
    check: "Referential integrity with state: referenced MenuItem belongs to service's MenuDay and is CONFIRMED; referenced batch is ACCEPTED; guest ACTIVE or FLAGGED"
    error_id: ERR_REFERENCE_INVALID
    http_status: 422
    applies_to: "order, allocation, shift endpoints"
  - priority: 9
    category: business_fiscal
    check: "Capacity/quota ceilings last: service reserved_count < capacity, batch remaining_servings >= requested, RESCUE cap"
    error_id: ERR_CAPACITY_FULL
    http_status: 422
    applies_to: "order create, allocation create"

endpoints:
  - method: POST
    path: "/kitchen/sites"
    description: Create a kitchen site.
    roles: [ProgramAdmin]
    code: 201
    input: [name, dine_in_capacity, togo_capacity_per_window, delivery_radius_km]
    output: Site
    side_effects: ["equipment_posture initialized OPERATIONAL"]
  - method: GET
    path: "/kitchen/sites"
    description: List sites (paginated).
    roles: [ProgramAdmin, KitchenManager, FoodSafetyOfficer, Volunteer, Guest]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Site[]
  - method: GET
    path: "/kitchen/sites/{id}"
    description: Get one site including computed equipment_posture.
    roles: [ProgramAdmin, KitchenManager, FoodSafetyOfficer, Volunteer, Guest]
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: GET
    path: "/kitchen/sites/{id}/equipment-assets"
    description: List equipment at a site (FK reverse-reachability for EquipmentAsset.site_id).
    roles: [ProgramAdmin, KitchenManager, Volunteer]
    code: 200
    input: ["limit?", "offset?", "status?", "equipment_class?"]
    output: EquipmentAsset[]
  - method: GET
    path: "/kitchen/sites/{id}/food-batches"
    description: List food batches received at a site.
    roles: [ProgramAdmin, KitchenManager, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "status?", "source_type?"]
    output: FoodBatch[]
  - method: GET
    path: "/kitchen/sites/{id}/volunteer-shifts"
    description: List shifts at a site.
    roles: [ProgramAdmin, KitchenManager, Volunteer]
    code: 200
    input: ["limit?", "offset?", "status?", "volunteer_id?"]
    output: VolunteerShift[]

  - method: POST
    path: "/kitchen/menu-days"
    description: Create a production plan for (site_id, service_date).
    roles: [KitchenManager]
    code: 201
    input: [site_id, service_date, "forecast_variant?"]
    output: MenuDay
    side_effects: []
  - method: GET
    path: "/kitchen/menu-days"
    description: List menu days, filterable.
    roles: [ProgramAdmin, KitchenManager, FoodSafetyOfficer, Volunteer, Guest]
    code: 200
    input: ["limit?", "offset?", "site_id?", "status?", "service_date?"]
    output: MenuDay[]
  - method: GET
    path: "/kitchen/menu-days/{id}"
    description: Get one menu day with computed fields.
    roles: [ProgramAdmin, KitchenManager, FoodSafetyOfficer, Volunteer, Guest]
    code: 200
    input: []
    output: MenuDay
  - method: GET
    path: "/kitchen/menu-days/{id}/summary"
    description: "Computed read: forecast vs committed vs served, waste_ratio, cost_per_served_meal."
    roles: [ProgramAdmin, KitchenManager]
    code: 200
    input: []
    output: MenuDay
  - method: GET
    path: "/kitchen/menu-days/{id}/menu-items"
    description: List items of a menu day (FK reverse-reachability).
    roles: [ProgramAdmin, KitchenManager, FoodSafetyOfficer, Volunteer, Guest]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: MenuItem[]
  - method: GET
    path: "/kitchen/menu-days/{id}/meal-services"
    description: List services of a menu day (FK reverse-reachability).
    roles: [ProgramAdmin, KitchenManager, Volunteer, Guest]
    code: 200
    input: ["limit?", "offset?", "service_model?", "status?"]
    output: MealService[]
  - method: GET
    path: "/kitchen/menu-days/{id}/waste-logs"
    description: List waste logs of a menu day (FK reverse-reachability).
    roles: [ProgramAdmin, KitchenManager, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "reason?", "disposition?"]
    output: WasteLog[]
  - method: GET
    path: "/kitchen/menu-days/{id}/volunteer-shifts"
    description: List shifts supporting a menu day (FK reverse-reachability for VolunteerShift.menu_day_id).
    roles: [ProgramAdmin, KitchenManager, Volunteer]
    code: 200
    input: ["limit?", "offset?", "status?", "volunteer_id?"]
    output: VolunteerShift[]
  - method: POST
    path: "/kitchen/menu-days/{id}/lock-forecast"
    description: "DRAFT -> FORECAST_LOCKED; runs production_forecast. OCC-guarded."
    roles: [KitchenManager]
    code: 200
    input: [expected_menu_day_version]
    output: MenuDay
    side_effects: ["calc production_forecast", "increments MenuDay.version by 1"]
  - method: POST
    path: "/kitchen/menu-days/{id}/start-production"
    description: "FORECAST_LOCKED -> IN_PRODUCTION."
    roles: [KitchenManager]
    code: 200
    input: []
    output: MenuDay
    side_effects: ["increments MenuDay.version by 1"]
  - method: POST
    path: "/kitchen/menu-days/{id}/reconcile"
    description: "SERVING -> RECONCILED; computes waste_ratio alert."
    roles: [KitchenManager]
    code: 200
    input: []
    output: MenuDay
    side_effects: ["calc waste_ratio", "increments MenuDay.version by 1"]
  - method: POST
    path: "/kitchen/menu-days/{id}/cancel"
    description: "DRAFT -> CANCELLED with full cascade (items, allocations, shifts)."
    roles: [KitchenManager]
    code: 200
    input: []
    output: MenuDay
    side_effects: ["cascade MenuItem -> UNAVAILABLE", "release BatchAllocations", "cascade VolunteerShift -> CANCELLED", "increments MenuDay.version by 1"]

  - method: POST
    path: "/kitchen/menu-days/{id}/menu-items"
    description: Add a planned item to a DRAFT menu day.
    roles: [KitchenManager]
    code: 201
    input: [name, planned_servings, "allergen_tags?", "dietary_labels?", "requires_equipment_class?"]
    output: MenuItem
    side_effects: []
  - method: GET
    path: "/kitchen/menu-items/{id}"
    description: Get one menu item.
    roles: [ProgramAdmin, KitchenManager, FoodSafetyOfficer, Volunteer, Guest]
    code: 200
    input: []
    output: MenuItem
  - method: GET
    path: "/kitchen/menu-items/{id}/batch-allocations"
    description: List allocations feeding this item (FK reverse-reachability).
    roles: [ProgramAdmin, KitchenManager, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: BatchAllocation[]
  - method: GET
    path: "/kitchen/menu-items/{id}/meal-orders"
    description: List orders referencing this item (FK reverse-reachability for MealOrder.menu_item_id).
    roles: [ProgramAdmin, KitchenManager, Volunteer]
    code: 200
    input: ["limit?", "offset?", "fulfillment_status?"]
    output: MealOrder[]
  - method: POST
    path: "/kitchen/menu-items/{id}/allocations"
    description: Allocate servings from an ACCEPTED batch to this item.
    roles: [KitchenManager]
    code: 201
    input: [food_batch_id, servings]
    output: BatchAllocation
    side_effects: ["calc portion_commitment", "calc inventory_conservation: FoodBatch.remaining_servings -= servings", "FoodBatch auto-DEPLETED when remaining hits 0"]
  - method: POST
    path: "/kitchen/menu-items/{id}/confirm"
    description: "PLANNED -> CONFIRMED with coverage check; ledger-syncs MenuDay.committed_servings."
    roles: [KitchenManager]
    code: 200
    input: []
    output: MenuItem
    side_effects: ["MenuDay.committed_servings += planned_servings", "increments MenuDay.version by 1"]
  - method: POST
    path: "/kitchen/menu-items/{id}/mark-unavailable"
    description: "PLANNED|CONFIRMED -> UNAVAILABLE; cascades to RESERVED orders (substitute-or-release)."
    roles: [KitchenManager]
    code: 200
    input: []
    output: MenuItem
    side_effects: ["MenuDay.committed_servings -= planned_servings if was CONFIRMED", "MealOrder substitute-or-release cascade"]

  - method: POST
    path: "/kitchen/food-batches"
    description: Receive a food batch at a site.
    roles: [KitchenManager, FoodSafetyOfficer]
    code: 201
    input: [site_id, source_type, item_description, quantity_servings, received_at, use_by, "allergen_tags?", "unit_cost_cents_per_serving?"]
    output: FoodBatch
    side_effects: []
  - method: GET
    path: "/kitchen/food-batches/{id}"
    description: Get one batch.
    roles: [ProgramAdmin, KitchenManager, FoodSafetyOfficer]
    code: 200
    input: []
    output: FoodBatch
  - method: GET
    path: "/kitchen/food-batches/{id}/batch-allocations"
    description: List allocations drawn from this batch (FK reverse-reachability).
    roles: [ProgramAdmin, KitchenManager, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: BatchAllocation[]
  - method: GET
    path: "/kitchen/food-batches/{id}/waste-logs"
    description: List waste logs attributed to this batch (FK reverse-reachability for WasteLog.food_batch_id).
    roles: [ProgramAdmin, KitchenManager, FoodSafetyOfficer]
    code: 200
    input: ["limit?", "offset?", "reason?", "disposition?"]
    output: WasteLog[]
  - method: POST
    path: "/kitchen/food-batches/{id}/begin-inspection"
    description: "RECEIVED|QUARANTINED|ACCEPTED -> INSPECTING (initial inspection, re-inspection cycle after SAFETY_DISCARD, or routine re-inspection of an accepted batch)."
    roles: [FoodSafetyOfficer]
    code: 200
    input: []
    output: FoodBatch
    side_effects: []
  - method: POST
    path: "/kitchen/food-batches/{id}/record-inspection"
    description: "INSPECTING -> ACCEPTED (result PASSED) or QUARANTINED (result FAILED)."
    roles: [FoodSafetyOfficer]
    code: 200
    input: [result]
    output: FoodBatch
    side_effects: ["on FAILED: depth-3 cascade allocation -> MenuItem UNAVAILABLE -> orders substitute-or-release"]
  - method: POST
    path: "/kitchen/food-batches/{id}/reject"
    description: "QUARANTINED -> REJECTED; releases allocations."
    roles: [FoodSafetyOfficer]
    code: 200
    input: []
    output: FoodBatch
    side_effects: ["remaining_servings -> 0", "allocations released"]

  - method: POST
    path: "/kitchen/volunteers"
    description: Register a volunteer.
    roles: [ProgramAdmin, KitchenManager]
    code: 201
    input: [full_name, email, "certification_level?", "certification_expires_at?"]
    output: Volunteer
    side_effects: []
  - method: GET
    path: "/kitchen/volunteers"
    description: List volunteers.
    roles: [ProgramAdmin, KitchenManager]
    code: 200
    input: ["limit?", "offset?", "status?", "certification_level?"]
    output: Volunteer[]
  - method: GET
    path: "/kitchen/volunteers/{id}"
    description: Get one volunteer with hours_balance and strike_count.
    roles: [ProgramAdmin, KitchenManager, Volunteer]
    code: 200
    input: []
    output: Volunteer
  - method: GET
    path: "/kitchen/volunteers/{id}/volunteer-shifts"
    description: List shifts of a volunteer (FK reverse-reachability).
    roles: [ProgramAdmin, KitchenManager, Volunteer]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: VolunteerShift[]
  - method: POST
    path: "/kitchen/volunteers/{id}/suspend"
    description: "ACTIVE -> SUSPENDED; cancels future SCHEDULED shifts."
    roles: [KitchenManager]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["cascade future shifts -> CANCELLED"]
  - method: POST
    path: "/kitchen/volunteers/{id}/reinstate"
    description: "SUSPENDED -> ACTIVE; resets strikes."
    roles: [KitchenManager]
    code: 200
    input: []
    output: Volunteer
    side_effects: ["strike_count = 0"]

  - method: POST
    path: "/kitchen/volunteer-shifts"
    description: Schedule a shift; validates certification, overlap (half-open), and menu-day linkage.
    roles: [KitchenManager]
    code: 201
    input: [site_id, volunteer_id, menu_day_id, role_on_shift, starts_at, ends_at]
    output: VolunteerShift
    side_effects: []
  - method: GET
    path: "/kitchen/volunteer-shifts/{id}"
    description: Get one shift.
    roles: [ProgramAdmin, KitchenManager, Volunteer]
    code: 200
    input: []
    output: VolunteerShift
  - method: POST
    path: "/kitchen/volunteer-shifts/{id}/check-in"
    description: "SCHEDULED -> CHECKED_IN within the check-in window."
    roles: [Volunteer]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: []
  - method: POST
    path: "/kitchen/volunteer-shifts/{id}/complete"
    description: "CHECKED_IN -> COMPLETED; credits hours ledger."
    roles: [KitchenManager]
    code: 200
    input: ["early_close?"]
    output: VolunteerShift
    side_effects: ["calc volunteer_hours_ledger"]
  - method: POST
    path: "/kitchen/volunteer-shifts/{id}/reassign"
    description: "CHECKED_IN -> SCHEDULED under a different volunteer (cycle)."
    roles: [KitchenManager]
    code: 200
    input: [volunteer_id]
    output: VolunteerShift
    side_effects: []
  - method: POST
    path: "/kitchen/volunteer-shifts/{id}/cancel"
    description: "SCHEDULED -> CANCELLED; lockout + penalty rules apply."
    roles: [Volunteer, KitchenManager]
    code: 200
    input: ["apply_penalty?"]
    output: VolunteerShift
    side_effects: ["optional hours penalty"]
  - method: POST
    path: "/kitchen/volunteer-shifts/{id}/mark-no-show"
    description: "SCHEDULED -> NO_SHOW; strike cascade may suspend volunteer."
    roles: [KitchenManager]
    code: 200
    input: []
    output: VolunteerShift
    side_effects: ["Volunteer.strike_count += 1", "auto-suspend at MAX_STRIKES"]

  - method: POST
    path: "/kitchen/guests"
    description: Register a guest profile.
    roles: [ProgramAdmin, KitchenManager]
    code: 201
    input: [full_name, household_size, "allergens?", "dietary_preferences?", "delivery_address?", "delivery_distance_km?"]
    output: GuestProfile
    side_effects: []
  - method: GET
    path: "/kitchen/guests/{id}"
    description: Get one guest.
    roles: [ProgramAdmin, KitchenManager, Guest]
    code: 200
    input: []
    output: GuestProfile
  - method: GET
    path: "/kitchen/guests/{id}/meal-orders"
    description: List a guest's orders (FK reverse-reachability).
    roles: [ProgramAdmin, KitchenManager, Guest]
    code: 200
    input: ["limit?", "offset?", "fulfillment_status?"]
    output: MealOrder[]
  - method: POST
    path: "/kitchen/guests/{id}/flag"
    description: "ACTIVE -> FLAGGED."
    roles: [KitchenManager]
    code: 200
    input: []
    output: GuestProfile
    side_effects: []
  - method: POST
    path: "/kitchen/guests/{id}/unflag"
    description: "FLAGGED -> ACTIVE."
    roles: [KitchenManager]
    code: 200
    input: []
    output: GuestProfile
    side_effects: []
  - method: POST
    path: "/kitchen/guests/{id}/deactivate"
    description: "ACTIVE -> INACTIVE (requires no RESERVED orders)."
    roles: [KitchenManager]
    code: 200
    input: []
    output: GuestProfile
    side_effects: []

  - method: POST
    path: "/kitchen/meal-services"
    description: Create a service run under a menu day; validates window overlap and capacity shape.
    roles: [KitchenManager]
    code: 201
    input: [menu_day_id, service_model, window_start, window_end, capacity, "requires_supervisor?"]
    output: MealService
    side_effects: []
  - method: GET
    path: "/kitchen/meal-services/{id}"
    description: Get one service.
    roles: [ProgramAdmin, KitchenManager, Volunteer, Guest]
    code: 200
    input: []
    output: MealService
  - method: GET
    path: "/kitchen/meal-services/{id}/meal-orders"
    description: List orders of a service (FK reverse-reachability).
    roles: [ProgramAdmin, KitchenManager, Volunteer]
    code: 200
    input: ["limit?", "offset?", "fulfillment_status?", "prep_status?"]
    output: MealOrder[]
  - method: POST
    path: "/kitchen/meal-services/{id}/open"
    description: "PLANNED -> OPEN; OCC on parent MenuDay; supervisor + posture gates."
    roles: [KitchenManager]
    code: 200
    input: [expected_menu_day_version]
    output: MealService
    side_effects: ["MenuDay IN_PRODUCTION -> SERVING on first open", "increments MenuDay.version by 1"]
  - method: POST
    path: "/kitchen/meal-services/{id}/pause"
    description: "OPEN -> PAUSED."
    roles: [KitchenManager]
    code: 200
    input: []
    output: MealService
    side_effects: []
  - method: POST
    path: "/kitchen/meal-services/{id}/resume"
    description: "PAUSED -> OPEN."
    roles: [KitchenManager]
    code: 200
    input: []
    output: MealService
    side_effects: []
  - method: POST
    path: "/kitchen/meal-services/{id}/close"
    description: "OPEN|PAUSED -> CLOSED; all non-terminal orders auto-EXPIRE."
    roles: [KitchenManager]
    code: 200
    input: []
    output: MealService
    side_effects: ["auto-expire non-terminal orders", "reserved_count decremented per expired order"]
  - method: POST
    path: "/kitchen/meal-services/{id}/abort"
    description: "OPEN -> ABORTED; releases all pipeline orders."
    roles: [KitchenManager]
    code: 200
    input: []
    output: MealService
    side_effects: ["all RESERVED/IN_PREP orders -> RELEASED"]

  - method: POST
    path: "/kitchen/meal-orders"
    description: "Reserve an order (no-charge policy). Validates allergen safety at create, capacity, household cap, delivery radius."
    roles: [Guest, KitchenManager]
    code: 201
    input: [meal_service_id, guest_id, menu_item_id, quantity, "substitution_allowed?"]
    output: MealOrder
    side_effects: ["MealService.reserved_count += 1", "MenuItem sold-out re-evaluation"]
  - method: GET
    path: "/kitchen/meal-orders/{id}"
    description: Get one order (both state dimensions).
    roles: [ProgramAdmin, KitchenManager, Volunteer, Guest]
    code: 200
    input: []
    output: MealOrder
  - method: POST
    path: "/kitchen/meal-orders/{id}/start-prep"
    description: "prep QUEUED -> IN_PREP."
    roles: [Volunteer]
    code: 200
    input: []
    output: MealOrder
    side_effects: []
  - method: POST
    path: "/kitchen/meal-orders/{id}/mark-ready"
    description: "prep IN_PREP -> READY with allergen re-check."
    roles: [Volunteer]
    code: 200
    input: []
    output: MealOrder
    side_effects: []
  - method: POST
    path: "/kitchen/meal-orders/{id}/rework"
    description: "prep READY -> IN_PREP (rework loop)."
    roles: [Volunteer]
    code: 200
    input: [reason]
    output: MealOrder
    side_effects: []
  - method: POST
    path: "/kitchen/meal-orders/{id}/serve"
    description: "fulfillment RESERVED -> SERVED (DINE_IN only)."
    roles: [Volunteer]
    code: 200
    input: []
    output: MealOrder
    side_effects: ["MenuDay.served_count += quantity", "GuestProfile.visits_count += 1", "MealService.reserved_count -= 1"]
  - method: POST
    path: "/kitchen/meal-orders/{id}/deliver"
    description: "fulfillment RESERVED -> DELIVERED (DELIVERY only, DRIVER shift)."
    roles: [Volunteer]
    code: 200
    input: []
    output: MealOrder
    side_effects: ["MenuDay.served_count += quantity", "GuestProfile.visits_count += 1", "MealService.reserved_count -= 1"]
  - method: POST
    path: "/kitchen/meal-orders/{id}/release"
    description: "fulfillment RESERVED -> RELEASED; returns capacity."
    roles: [Guest, KitchenManager]
    code: 200
    input: []
    output: MealOrder
    side_effects: ["MealService.reserved_count -= 1"]

  - method: POST
    path: "/kitchen/equipment-assets"
    description: Register equipment at a site.
    roles: [ProgramAdmin, KitchenManager]
    code: 201
    input: [site_id, name, equipment_class, "criticality?"]
    output: EquipmentAsset
    side_effects: ["recompute Site.equipment_posture"]
  - method: GET
    path: "/kitchen/equipment-assets/{id}"
    description: Get one asset.
    roles: [ProgramAdmin, KitchenManager, Volunteer]
    code: 200
    input: []
    output: EquipmentAsset
  - method: POST
    path: "/kitchen/equipment-assets/{id}/schedule-maintenance"
    description: "OPERATIONAL -> IN_MAINTENANCE; closed-interval + 15min buffer overlap rule per class."
    roles: [KitchenManager]
    code: 200
    input: [maint_start, maint_end]
    output: EquipmentAsset
    side_effects: ["recompute Site.equipment_posture"]
  - method: POST
    path: "/kitchen/equipment-assets/{id}/complete-maintenance"
    description: "IN_MAINTENANCE -> OPERATIONAL; stamps inspection."
    roles: [KitchenManager]
    code: 200
    input: []
    output: EquipmentAsset
    side_effects: ["last_inspected_at = now", "next_inspection_due recomputed", "recompute Site.equipment_posture"]
  - method: POST
    path: "/kitchen/equipment-assets/{id}/report-fault"
    description: "OPERATIONAL -> DOWN_FOR_REPAIR; may cascade HALTED posture -> service aborts."
    roles: [KitchenManager, Volunteer]
    code: 200
    input: []
    output: EquipmentAsset
    side_effects: ["recompute Site.equipment_posture", "if HALTED: abort affected OPEN services, release orders"]
  - method: POST
    path: "/kitchen/equipment-assets/{id}/complete-repair"
    description: "DOWN_FOR_REPAIR -> OPERATIONAL with inspection gating."
    roles: [KitchenManager]
    code: 200
    input: ["inspected?"]
    output: EquipmentAsset
    side_effects: ["recompute Site.equipment_posture"]
  - method: POST
    path: "/kitchen/equipment-assets/{id}/decommission"
    description: "DOWN_FOR_REPAIR -> DECOMMISSIONED."
    roles: [KitchenManager]
    code: 200
    input: []
    output: EquipmentAsset
    side_effects: ["recompute Site.equipment_posture"]

  - method: POST
    path: "/kitchen/waste-logs"
    description: Record waste/leftover disposition against a menu day and batch.
    roles: [KitchenManager, FoodSafetyOfficer]
    code: 201
    input: [menu_day_id, food_batch_id, servings_wasted, reason, disposition]
    output: WasteLog
    side_effects: ["calc inventory_conservation", "FoodBatch.remaining_servings adjusted per disposition", "FoodBatch auto-DEPLETED check"]
  - method: GET
    path: "/kitchen/waste-logs/{id}"
    description: Get one waste log.
    roles: [ProgramAdmin, KitchenManager, FoodSafetyOfficer]
    code: 200
    input: []
    output: WasteLog

  - method: POST
    path: "/kitchen/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z (server startup default; never falls back to wall-clock)."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["re-evaluates time-gated auto-transitions (NO_SHOW, expiry) lazily on next read/write"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers."
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "Role not permitted on this endpoint."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not defined from the entity's current state (e.g., open a CLOSED service, confirm an UNAVAILABLE item)."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_menu_day_version does not match MenuDay.version (OCC)."
  - id: ERR_SAFETY_VIOLATION
    http: 422
    condition: "Food-safety gate failed: expired batch, uninspected/failed batch at allocation or confirm, allergen intersection at READY, invalid SAFETY_DISCARD target."
  - id: ERR_TEMPORAL_CONFLICT
    http: 422
    condition: "Interval collision: volunteer shift overlap, service window overlap or missing buffer, maintenance window overlap with buffer, expired certification."
  - id: ERR_CERTIFICATION_INSUFFICIENT
    http: 422
    condition: "Volunteer certification_level below role requirement or certification_expires_at <= now."
  - id: ERR_CONSTRAINT_VIOLATION
    http: 422
    condition: "Uniqueness/shape violation: duplicate (site_id, service_date) MenuDay, duplicate email, quantity > household_size, invalid enum, capacity shape rule broken."
  - id: ERR_REFERENCE_INVALID
    http: 422
    condition: "Cross-entity reference invalid in current state: item not on service's menu day, item not CONFIRMED, batch not ACCEPTED, guest INACTIVE."
  - id: ERR_CAPACITY_FULL
    http: 422
    condition: "Service reserved_count == capacity (the Nth+1 order), or batch remaining_servings < requested allocation, or RESCUE cap exceeded."
  - id: ERR_DELIVERY_OUT_OF_RANGE
    http: 422
    condition: "GuestProfile.delivery_distance_km > Site.delivery_radius_km for a DELIVERY order."
  - id: ERR_ALLERGEN_CONFLICT
    http: 422
    condition: "MenuItem.allergen_tags intersect GuestProfile.allergens at order creation or READY re-check."
  - id: ERR_SUPERVISOR_REQUIRED
    http: 422
    condition: "MealService.requires_supervisor true but no CHECKED_IN SUPERVISOR_ON_DUTY shift overlaps the window."
  - id: ERR_EQUIPMENT_HALTED
    http: 422
    condition: "Site.equipment_posture == HALTED blocks production start, service open, or resume."
  - id: ERR_CANCEL_IN_LOCKOUT
    http: 422
    condition: "Volunteer self-cancel inside CANCEL_LOCKOUT_HOURS before starts_at."
  - id: ERR_GUEST_FLAGGED_NEEDS_REVIEW
    http: 422
    condition: "FLAGGED guest order attempted by Guest role without KitchenManager actor."
  - id: ERR_BATCH_EXPIRED
    http: 422
    condition: "Logical clock now >= FoodBatch.use_by for inspection/allocation/confirm paths."
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed request body: missing required field, wrong type."

roles:
  - name: ProgramAdmin
    description: Platform-level operator; owns sites, equipment registration, volunteer registration, and the test clock.
    identity: "opaque"
    exclusive_operations: ["POST /kitchen/sites", "POST /kitchen/_clock/set_current_utc"]
    shared_operations: ["all GET endpoints", "equipment/volunteer/guest registration"]
  - name: KitchenManager
    description: Runs a kitchen site day-to-day; owns menu planning, production, services, shifts, and reconciliations.
    identity: "opaque"
    exclusive_operations: ["menu-day lifecycle actions", "menu-item confirm/mark-unavailable", "allocation creation", "service lifecycle actions", "shift scheduling/completion/no-show/reassign", "guest flag/unflag/deactivate", "volunteer suspend/reinstate", "equipment maintenance/repair/decommission", "waste-log creation"]
    shared_operations: ["GET endpoints", "order creation on behalf of guests", "order release"]
  - name: FoodSafetyOfficer
    description: Independent inspector; the only role that can run batch inspections and reject batches (segregation from KitchenManager who receives/allocates).
    identity: "opaque"
    exclusive_operations: ["begin-inspection", "record-inspection", "reject batch"]
    shared_operations: ["GET endpoints", "waste-log creation", "batch receive"]
  - name: Volunteer
    description: "Shift worker; identity equals a Volunteer entity id for ownership of check-in."
    identity: "entity_backed:Volunteer"
    exclusive_operations: ["check-in own shift", "self-cancel shift (outside lockout)", "prep pipeline actions", "serve/deliver"]
    shared_operations: ["GET endpoints for own records", "report equipment fault"]
  - name: Guest
    description: "Meal recipient; identity equals a GuestProfile id for order ownership."
    identity: "entity_backed:GuestProfile"
    exclusive_operations: ["create own meal order", "release own order before window"]
    shared_operations: ["GET menu days, items, services"]
