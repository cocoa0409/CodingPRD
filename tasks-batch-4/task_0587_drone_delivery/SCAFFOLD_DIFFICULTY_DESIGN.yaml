              as: DispatchOperator
              as_user_id: "op-1"
              captures: { order_id: $.data.id, order_v: $.data.version }
            - call: "POST /orders/${order_id}/dispatch"
              payload: { nest_id: "${nest_id}", expected_order_version: "${order_v}" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { flight_id: $.data.id }
            - call: "POST /flights/${flight_id}/file-authorization"
              payload: { grid_cells: ["37N122W-01"], requested_alt_ft: 350, window_start: "2026-06-01T08:00:00Z", window_end: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
              as_user_id: "op-1"
              captures: { auth_id: $.data.id }
            - call: "POST /_laanc/decision"
