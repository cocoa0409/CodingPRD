          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: "Uniqueness is per-identifier and per-pair: re-posting naic_code 10001, re-posting email ann@example.com, and re-posting the same (application_id, member_insurer_id) declination pair each return 409, and the two families use different error_ids (ERR_DUPLICATE_IDENTIFIER vs ERR_DUPLICATE_DECLINATION) with no new row created in any case."
