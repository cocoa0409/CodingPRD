        grounds:
          - validations[priority=6]
          - validations[priority=16]
          - state_machines.Admission.PENDING_ADMISSION_to_ADMITTED
        distinguishing_aspect: |
          Error-category pair {state vs business_fiscal}: admitting a WAITLISTED admission
          (never promoted) that also has no APPROVED authorization fails the state check
          (priority 6, ERR_INVALID_STATE) BEFORE the fiscal check (priority 16,
          ERR_NO_ACTIVE_AUTHORIZATION). The lower-priority-number state error wins.
        test_recipe:
          setup:
            - "A WAITLISTED admission with NO authorization (still WAITLISTED, never promoted)."
          setup_api_calls:
            - call: "POST /edt/facilities"
              payload: { name: "Maple EDT" }
