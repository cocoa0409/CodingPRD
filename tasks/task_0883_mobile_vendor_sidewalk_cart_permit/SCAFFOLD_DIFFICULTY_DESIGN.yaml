scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: permit_fee_new_vs_renewal_early
        grounds:
          - calculations.permit_fee
          - entities.Permit.fields.fee_amount_cents
          - state_machines.Permit.SUBMITTED_to_ISSUED
        distinguishing_aspect: |
          On the Permit money domain: NEW issuance of a STANDARD-zone / MEDIUM-cart permit assesses
          34257 cents, while an early renewal of the SAME permit (identical zone_type + size) assesses
          29907 cents (base component discounted by RENEWAL_BASE_FACTOR) — same inputs, different variant, different result.
        test_recipe:
          setup:
            - "Clock at 2026-06-01. Vendor v1 with ACTIVE insurance; commissary c1 ACTIVE; cart1 (size_sqft 30 => MEDIUM) inspected PASS and APPROVED; STANDARD zone z1; permit p1 ISSUED (fee_variant NEW)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 5 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id", zv1: "$.data.version" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer, captures: { new_fee: "$.data.fee_amount_cents" } }
          trigger:
            - { call: "POST /permits/${p1}/renew", payload: {}, as: Vendor, as_user_id: "${v1}", captures: { renew_fee: "$.data.fee_amount_cents", renew_variant: "$.data.fee_variant" } }
          assert:
            - "Permit.${p1}.fee_amount_cents after issue == 34257 (fee_variant == NEW)"
            - "Permit.${p1}.fee_amount_cents after renew == 29907 (fee_variant == RENEWAL_EARLY)"
            - "29907 != 34257 for identical STANDARD zone + MEDIUM cart"

      - name: impound_release_vs_forfeiture_settlement
        grounds:
          - calculations.impound_settlement
          - entities.Impound.fields.release_fee_cents
          - entities.Impound.fields.municipal_writeoff_cents
        distinguishing_aspect: |
          On the Impound/Cart domain (different entity domain than permit_fee): a 10-day RELEASE charges the vendor
          44500 cents (base+storage+admin), while a 10-day FORFEITURE of an identical-duration hold records a
          39500-cent municipal writeoff and charges the vendor 0 — same duration, different settlement algorithm, different amounts.
        test_recipe:
          setup:
            - "Clock at 2026-06-01. Vendor v1; commissary c1; two APPROVED carts cartA and cartB (size 30). Both later impounded on 2026-06-01 and settled on 2026-06-11 (10 storage days)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cartA: "$.data.id" } }
            - { call: "POST /carts/${cartA}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 90, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cartA}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cartB: "$.data.id" } }
            - { call: "POST /carts/${cartB}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 90, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cartB}/approve", payload: {}, as: PermitOfficer }
          trigger:
            - { call: "POST /carts/${cartA}/impounds", payload: { reason: "HEALTH_HAZARD", impounded_at: "2026-06-01T00:00:00Z" }, as: EnforcementOfficer, as_user_id: "off-1", captures: { impA: "$.data.id" } }
            - { call: "POST /impounds/${impA}/release", payload: { release_at: "2026-06-11T00:00:00Z" }, as: EnforcementOfficer, as_user_id: "off-1", captures: { relfee: "$.data.release_fee_cents", woA: "$.data.municipal_writeoff_cents" } }
            - { call: "POST /carts/${cartB}/impounds", payload: { reason: "ABANDONMENT", impounded_at: "2026-06-01T00:00:00Z" }, as: EnforcementOfficer, as_user_id: "off-1", captures: { impB: "$.data.id" } }
            - { call: "POST /impounds/${impB}/forfeit", payload: { forfeit_at: "2026-06-11T00:00:00Z" }, as: EnforcementOfficer, as_user_id: "off-1", captures: { woB: "$.data.municipal_writeoff_cents", relfeeB: "$.data.release_fee_cents" } }
          assert:
            - "Impound.${impA}.release_fee_cents == 44500 AND Impound.${impA}.municipal_writeoff_cents == 0"
            - "Impound.${impB}.municipal_writeoff_cents == 39500 AND Impound.${impB}.release_fee_cents == 0"
            - "44500 != 39500 for identical 10-day holds"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: permit_fee_round_per_component_then_sum
        grounds:
          - calculations.permit_fee
          - entities.Permit.fields.fee_amount_cents
        distinguishing_aspect: |
          Mode (b) nested rounding-order: tax is rounded per component (round(20000*.0875)=1750 + round(5000*.0875)=438 +
          round(6500*.0875)=569 = 2757) THEN summed, yielding 34257; sum-then-round (round(31500*.0875)=2756 => 34256)
          would differ by 1 cent. The scaffold pins per-component rounding.
        test_recipe:
          setup:
            - "Clock 2026-06-01. STANDARD zone, MEDIUM cart (size 30), permit p1 ISSUED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer, captures: { fee: "$.data.fee_amount_cents" } }
          assert:
            - "Permit.${p1}.fee_amount_cents == 34257 (per-component round then sum: 20000+5000+6500 + (1750+438+569))"
            - "34257 != 34256 (sum-then-round); the pinned rounding order is observable"

      - name: impound_release_tiered_storage
        grounds:
          - calculations.impound_settlement
          - entities.Impound.fields.release_fee_cents
          - entities.Impound.fields.storage_days
        distinguishing_aspect: |
          Mode (a) tiered-rate selection with >=3 inputs: release_fee = base(10000) + [tier1 = min(days,7)*2500] +
          [tier2 = max(0,days-7)*4000] + admin(5000). For 10 days: 10000 + (7*2500 + 3*4000) + 5000 = 44500,
          crossing the 7-day tier boundary. Different mode from the round-then-sum instance.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Vendor v1; commissary c1; cart1 APPROVED. Impound held from 2026-06-01, released 2026-06-11 (10 days => tier1 7d + tier2 3d)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /carts/${cart1}/impounds", payload: { reason: "UNPERMITTED", impounded_at: "2026-06-01T00:00:00Z" }, as: EnforcementOfficer, as_user_id: "off-1", captures: { imp1: "$.data.id" } }
          trigger:
            - { call: "POST /impounds/${imp1}/release", payload: { release_at: "2026-06-11T00:00:00Z" }, as: EnforcementOfficer, as_user_id: "off-1", captures: { fee: "$.data.release_fee_cents", days: "$.data.storage_days" } }
          assert:
            - "Impound.${imp1}.storage_days == 10"
            - "Impound.${imp1}.release_fee_cents == 44500 (base 10000 + 7*2500 + 3*4000 + admin 5000)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: permit_cycle_issued_suspended_reinstated
        grounds:
          - state_machines.Permit.ISSUED_to_SUSPENDED
          - state_machines.Permit.SUSPENDED_to_ISSUED
        distinguishing_aspect: |
          Cyclic edge on Permit: ISSUED -> SUSPENDED -> ISSUED. Reinstate returns the entity to the ISSUED
          state it left, so the machine is not a forward-only pipeline.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Permit p1 ISSUED (vendor with active insurance, approved cart, STANDARD zone)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer }
          trigger:
            - { call: "POST /permits/${p1}/suspend", payload: { reason: "admin-hold" }, as: PermitOfficer, captures: { s_after: "$.data.status" } }
            - { call: "POST /permits/${p1}/reinstate", payload: {}, as: PermitOfficer, captures: { r_after: "$.data.status" } }
          assert:
            - "Permit.${p1}.status == SUSPENDED after suspend"
            - "Permit.${p1}.status == ISSUED after reinstate (cycle closes)"

      - name: violation_cycle_issued_contested_withdrawn
        grounds:
          - state_machines.Violation.ISSUED_to_CONTESTED
          - state_machines.Violation.CONTESTED_to_ISSUED
        distinguishing_aspect: |
          Cyclic edge on Violation (a different entity than Permit): ISSUED -> CONTESTED -> ISSUED via
          withdraw-contest, a revision loop rather than a forward pipeline.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Permit p1 ISSUED; a MINOR violation vio ISSUED against it (issuer off-1)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer }
            - { call: "POST /permits/${p1}/violations", payload: { violation_type: "MINOR", description: "no bin" }, as: EnforcementOfficer, as_user_id: "off-1", captures: { vio: "$.data.id" } }
          trigger:
            - { call: "POST /violations/${vio}/contest", payload: {}, as: Vendor, as_user_id: "${v1}", captures: { st1: "$.data.status" } }
            - { call: "POST /violations/${vio}/withdraw-contest", payload: {}, as: Vendor, as_user_id: "${v1}", captures: { st2: "$.data.status" } }
          assert:
            - "Violation.${vio}.status == CONTESTED after contest"
            - "Violation.${vio}.status == ISSUED after withdraw-contest (cycle closes on a different entity than Permit)"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complaint_substantiation_depth4_cascade
        grounds:
          - state_machines.Complaint.OPEN_to_SUBSTANTIATED
          - state_machines.Violation.ISSUED_to_UPHELD
          - state_machines.Permit.ISSUED_to_SUSPENDED
          - state_machines.SpotAssignment.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Trigger = complaint resolve (SUBSTANTIATED). Depth-4 chain, each hop caused by the prior:
          Complaint -> auto-create+uphold MAJOR Violation (points 6) -> permit.violation_points reaches 12 ->
          Permit ISSUED->SUSPENDED -> its ACTIVE SpotAssignment ACTIVE->RELEASED -> Zone.assigned_slots decrements.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Permit p1 ISSUED with one ACTIVE SpotAssignment sa1 on spot1, and a prior UPHELD MAJOR violation (6 points). A complaint cmp OPEN on p1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id", zv1: "$.data.version" } }
            - { call: "POST /zones/${z1}/spots", payload: { label: "S1", position_feet: 100 }, as: PermitOfficer, captures: { spot1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer }
            - { call: "POST /permits/${p1}/spot-assignments", payload: { spot_id: "${spot1}", start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T17:00:00Z", expected_zone_version: "${zv1}" }, as: PermitOfficer, captures: { sa1: "$.data.id" } }
            - { call: "POST /permits/${p1}/violations", payload: { violation_type: "MAJOR", description: "prior major" }, as: EnforcementOfficer, as_user_id: "off-1", captures: { vprior: "$.data.id" } }
            - { call: "POST /violations/${vprior}/adjudicate", payload: { outcome: "UPHOLD" }, as: EnforcementOfficer, as_user_id: "off-2" }
            - { call: "POST /permits/${p1}/complaints", payload: { complaint_type: "SANITATION", description: "unsanitary handling" }, as: Resident, as_user_id: "res-1", captures: { cmp: "$.data.id" } }
          trigger:
            - { call: "POST /complaints/${cmp}/resolve", payload: { resolution_outcome: "SUBSTANTIATED", resolution: "verified" }, as: EnforcementOfficer, as_user_id: "off-2", captures: { gv: "$.data.generated_violation_id" } }
            - { call: "GET /permits/${p1}", payload: {}, as: PermitOfficer, captures: { pstatus: "$.data.status", pts: "$.data.violation_points" } }
            - { call: "GET /spot-assignments/${sa1}", payload: {}, as: PermitOfficer, captures: { sastatus: "$.data.status" } }
            - { call: "GET /zones/${z1}", payload: {}, as: PermitOfficer, captures: { zslots: "$.data.assigned_slots" } }
          assert:
            - "Permit.${p1}.violation_points == 12 after substantiation (6 prior + 6 from generated MAJOR)"
            - "Permit.${p1}.status == SUSPENDED (points threshold cascade)"
            - "SpotAssignment.${sa1}.status == RELEASED (hop caused by the suspension, not by the complaint directly)"
            - "Zone.${z1}.assigned_slots == 0"

      - name: inspection_fail_depth2_cascade
        grounds:
          - state_machines.Cart.PENDING_to_APPROVED
          - state_machines.Permit.ISSUED_to_SUSPENDED
          - state_machines.SpotAssignment.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Trigger = cart inspection FAIL (different trigger than complaint). Chain: Cart.inspection_status -> FAIL ->
          the cart's ISSUED Permit -> SUSPENDED -> that permit's ACTIVE SpotAssignment -> RELEASED. Each hop caused by the prior (depth >= 2).
        test_recipe:
          setup:
            - "Clock 2026-06-01. Permit p1 ISSUED on cart1 with one ACTIVE SpotAssignment sa1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id", zv1: "$.data.version" } }
            - { call: "POST /zones/${z1}/spots", payload: { label: "S1", position_feet: 100 }, as: PermitOfficer, captures: { spot1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer }
            - { call: "POST /permits/${p1}/spot-assignments", payload: { spot_id: "${spot1}", start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T17:00:00Z", expected_zone_version: "${zv1}" }, as: PermitOfficer, captures: { sa1: "$.data.id" } }
          trigger:
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "FAIL", score: 40 }, as: HealthInspector, captures: { instatus: "$.data.inspection_status" } }
            - { call: "GET /permits/${p1}", payload: {}, as: PermitOfficer, captures: { pst: "$.data.status" } }
            - { call: "GET /spot-assignments/${sa1}", payload: {}, as: PermitOfficer, captures: { sast: "$.data.status" } }
          assert:
            - "Cart.${cart1}.inspection_status == FAIL"
            - "Permit.${p1}.status == SUSPENDED (hop 1: cart -> permit)"
            - "SpotAssignment.${sa1}.status == RELEASED (hop 2: permit -> assignment)"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: issue_safety_beats_temporal_overlap
        grounds:
          - validations[priority=9]
          - validations[priority=12]
          - errors[ERR_INSURANCE_NOT_ACTIVE]
        distinguishing_aspect: |
          On POST /permits/{id}/issue a single request violates business_safety (insurance LAPSED, priority 9) AND
          business_temporal (another ISSUED permit for the same cart overlaps, priority 12). The lower-priority-number
          safety check wins: ERR_INSURANCE_NOT_ACTIVE, not ERR_PERMIT_OVERLAP.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Vendor v1 with insurance ACTIVE only until 2026-06-15. Cart1 APPROVED. Permit pA ISSUED on cart1 (validity through 2027-06-01). Permit pB SUBMITTED on the same cart1. Then clock advanced to 2026-06-20 so insurance is LAPSED and pA still overlaps."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2026-06-15T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { pA: "$.data.id" } }
            - { call: "POST /permits/${pA}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${pA}/issue", payload: {}, as: PermitOfficer }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { pB: "$.data.id" } }
            - { call: "POST /permits/${pB}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T00:00:00Z" }, as: PermitOfficer }
          trigger:
            - { call: "POST /permits/${pB}/issue", payload: {}, as: PermitOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INSURANCE_NOT_ACTIVE (safety priority 9 beats temporal overlap priority 12)"
            - "Permit.${pB}.status == SUBMITTED (unchanged)"

      - name: assignment_state_beats_capacity
        grounds:
          - validations[priority=7]
          - validations[priority=18]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          On POST /permits/{id}/spot-assignments a single request violates state (permit SUSPENDED, priority 7) AND
          business_fiscal (zone at capacity, priority 18). The state check wins: ERR_INVALID_STATE, not ERR_ZONE_CAPACITY_FULL.
          Different error-category pair (state vs fiscal) than the safety-vs-temporal instance.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Zone z1 capacity_slots 1. Permit pA ISSUED (cartA) holds the only slot via an ACTIVE assignment on spotA. Permit pB ISSUED (cartB) then SUSPENDED. spotB free but zone full."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cartA: "$.data.id" } }
            - { call: "POST /carts/${cartA}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cartA}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cartB: "$.data.id" } }
            - { call: "POST /carts/${cartB}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cartB}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 1, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id", zv1: "$.data.version" } }
            - { call: "POST /zones/${z1}/spots", payload: { label: "SA", position_feet: 100 }, as: PermitOfficer, captures: { spotA: "$.data.id" } }
            - { call: "POST /zones/${z1}/spots", payload: { label: "SB", position_feet: 400 }, as: PermitOfficer, captures: { spotB: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cartA}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { pA: "$.data.id" } }
            - { call: "POST /permits/${pA}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${pA}/issue", payload: {}, as: PermitOfficer }
            - { call: "POST /permits/${pA}/spot-assignments", payload: { spot_id: "${spotA}", start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T17:00:00Z", expected_zone_version: "${zv1}" }, as: PermitOfficer }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cartB}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { pB: "$.data.id" } }
            - { call: "POST /permits/${pB}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${pB}/issue", payload: {}, as: PermitOfficer }
            - { call: "POST /permits/${pB}/suspend", payload: { reason: "hold" }, as: PermitOfficer }
            - { call: "GET /zones/${z1}", payload: {}, as: PermitOfficer, captures: { zvc: "$.data.version" } }
          trigger:
            - { call: "POST /permits/${pB}/spot-assignments", payload: { spot_id: "${spotB}", start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T17:00:00Z", expected_zone_version: "${zvc}" }, as: PermitOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_INVALID_STATE (permit SUSPENDED, priority 7 beats zone-capacity priority 18)"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: points_threshold_exactly_twelve_suspends
        grounds:
          - calculations.violation_points_total
          - state_machines.Violation.ISSUED_to_UPHELD
          - entities.Permit.fields.violation_points
        distinguishing_aspect: |
          Metric = violation points via the adjudicate endpoint. At exactly 12 points (two UPHELD MAJOR, >= threshold)
          the permit auto-suspends; at 6 points it does not. The >= boundary (not >) is observable at 12.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Permit p1 ISSUED. Two MAJOR violations issued by off-1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer }
            - { call: "POST /permits/${p1}/violations", payload: { violation_type: "MAJOR", description: "v1" }, as: EnforcementOfficer, as_user_id: "off-1", captures: { vio1: "$.data.id" } }
            - { call: "POST /permits/${p1}/violations", payload: { violation_type: "MAJOR", description: "v2" }, as: EnforcementOfficer, as_user_id: "off-1", captures: { vio2: "$.data.id" } }
          trigger:
            - { call: "POST /violations/${vio1}/adjudicate", payload: { outcome: "UPHOLD" }, as: EnforcementOfficer, as_user_id: "off-2" }
            - { call: "GET /permits/${p1}", payload: {}, as: PermitOfficer, captures: { pts_after1: "$.data.violation_points", st_after1: "$.data.status" } }
            - { call: "POST /violations/${vio2}/adjudicate", payload: { outcome: "UPHOLD" }, as: EnforcementOfficer, as_user_id: "off-2" }
            - { call: "GET /permits/${p1}", payload: {}, as: PermitOfficer, captures: { pts_after2: "$.data.violation_points", st_after2: "$.data.status" } }
          assert:
            - "Permit.${p1}.violation_points == 6 and status == ISSUED after first UPHOLD (below threshold)"
            - "Permit.${p1}.violation_points == 12 and status == SUSPENDED after second UPHOLD (>= 12 boundary triggers)"

      - name: spacing_boundary_equal_allowed_below_rejected
        grounds:
          - calculations.spot_occupation_conflict
          - validations[priority=15]
          - errors[ERR_SPACING_VIOLATION]
        distinguishing_aspect: |
          Metric = spatial spacing via the spot-assignment endpoint. With spacing_min_feet 20 and an ACTIVE assignment at
          position 100: a new assignment at position 120 (|120-100| == 20, equality allowed) succeeds, while one at
          position 119 (|119-100| == 19 < 20) returns ERR_SPACING_VIOLATION. Different metric/endpoint than the points threshold.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Zone z1 spacing_min_feet 20, capacity 5. Spots spot1@100, spot120@120, spot119@119. Permit p1 ISSUED with an ACTIVE assignment on spot1 (window 09:00-17:00)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id", zv1: "$.data.version" } }
            - { call: "POST /zones/${z1}/spots", payload: { label: "S1", position_feet: 100 }, as: PermitOfficer, captures: { spot1: "$.data.id" } }
            - { call: "POST /zones/${z1}/spots", payload: { label: "S120", position_feet: 120 }, as: PermitOfficer, captures: { spot120: "$.data.id" } }
            - { call: "POST /zones/${z1}/spots", payload: { label: "S119", position_feet: 119 }, as: PermitOfficer, captures: { spot119: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer }
            - { call: "POST /permits/${p1}/spot-assignments", payload: { spot_id: "${spot1}", start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T17:00:00Z", expected_zone_version: "${zv1}" }, as: PermitOfficer, captures: { a100: "$.data.id" } }
            - { call: "GET /zones/${z1}", payload: {}, as: PermitOfficer, captures: { zvc1: "$.data.version" } }
            - { call: "POST /permits/${p1}/spot-assignments", payload: { spot_id: "${spot120}", start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T17:00:00Z", expected_zone_version: "${zvc1}" }, as: PermitOfficer, captures: { a120: "$.data.id", a120_status: "$.data.status" } }
            - { call: "POST /spot-assignments/${a120}/release", payload: {}, as: PermitOfficer }
            - { call: "GET /zones/${z1}", payload: {}, as: PermitOfficer, captures: { zvc2: "$.data.version" } }
          trigger:
            - { call: "POST /permits/${p1}/spot-assignments", payload: { spot_id: "${spot119}", start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T17:00:00Z", expected_zone_version: "${zvc2}" }, as: PermitOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "assignment at position_feet 120 (distance exactly 20) succeeded: SpotAssignment.${a120}.status == ACTIVE"
            - "assignment at position_feet 119 (distance 19 < 20) returns error_id == ERR_SPACING_VIOLATION"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: permit_issue_depends_on_vendor_insurance
        grounds:
          - state_machines.Permit.SUBMITTED_to_ISSUED
          - entities.Vendor.fields.insurance_status
          - errors[ERR_INSURANCE_NOT_ACTIVE]
        distinguishing_aspect: |
          Permit SUBMITTED->ISSUED is gated by a DIFFERENT entity's state (Vendor.insurance_status). Pair = Permit<->Vendor.
          With no policy the issue is rejected ERR_INSURANCE_NOT_ACTIVE; after activating insurance the same call succeeds.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Vendor v1 with NO insurance policy. Cart1 APPROVED. Permit p1 SUBMITTED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer, captures: { err: "$.data.error_id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer, captures: { st: "$.data.status" } }
          assert:
            - "first issue returns error_id == ERR_INSURANCE_NOT_ACTIVE (insurance_status NONE)"
            - "after activating insurance, Permit.${p1}.status == ISSUED"

      - name: cart_approve_depends_on_commissary_status
        grounds:
          - state_machines.Cart.PENDING_to_APPROVED
          - entities.Commissary.fields.status
          - errors[ERR_COMMISSARY_NOT_ACTIVE]
        distinguishing_aspect: |
          Cart PENDING->APPROVED is gated by a DIFFERENT entity's state (Commissary.status). Pair = Cart<->Commissary
          (distinct from Permit<->Vendor). A SUSPENDED commissary blocks approval; reactivating it lets the same call succeed.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Commissary c1 SUSPENDED. Cart1 (base c1) inspected PASS but still PENDING."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "PATCH /commissaries/${c1}", payload: { status: "SUSPENDED" }, as: HealthInspector }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
          trigger:
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer, captures: { err: "$.data.error_id" } }
            - { call: "PATCH /commissaries/${c1}", payload: { status: "ACTIVE" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer, captures: { cst: "$.data.status" } }
          assert:
            - "first approve returns error_id == ERR_COMMISSARY_NOT_ACTIVE (commissary SUSPENDED)"
            - "after reactivating the commissary, Cart.${cart1}.status == APPROVED"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: spot_time_overlap_half_open
        grounds:
          - calculations.spot_occupation_conflict
          - validations[priority=14]
          - errors[ERR_SPOT_TIME_CONFLICT]
        distinguishing_aspect: |
          Resource = Spot; interval semantics = half-open [start,end). An assignment starting exactly at the prior
          assignment's end_at (12:00) is allowed (touching boundary), but a genuinely overlapping window [11:00,13:00)
          is rejected ERR_SPOT_TIME_CONFLICT.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Permit p1 ISSUED. Spot spot1. One ACTIVE assignment on spot1 for [09:00,12:00)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id", zv1: "$.data.version" } }
            - { call: "POST /zones/${z1}/spots", payload: { label: "S1", position_feet: 100 }, as: PermitOfficer, captures: { spot1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer }
            - { call: "POST /permits/${p1}/spot-assignments", payload: { spot_id: "${spot1}", start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T12:00:00Z", expected_zone_version: "${zv1}" }, as: PermitOfficer, captures: { sa1: "$.data.id" } }
            - { call: "GET /zones/${z1}", payload: {}, as: PermitOfficer, captures: { zvc1: "$.data.version" } }
          trigger:
            - { call: "POST /permits/${p1}/spot-assignments", payload: { spot_id: "${spot1}", start_at: "2026-06-01T12:00:00Z", end_at: "2026-06-01T15:00:00Z", expected_zone_version: "${zvc1}" }, as: PermitOfficer, captures: { adj: "$.data.id", adj_status: "$.data.status" } }
            - { call: "GET /zones/${z1}", payload: {}, as: PermitOfficer, captures: { zvc2: "$.data.version" } }
            - { call: "POST /permits/${p1}/spot-assignments", payload: { spot_id: "${spot1}", start_at: "2026-06-01T11:00:00Z", end_at: "2026-06-01T13:00:00Z", expected_zone_version: "${zvc2}" }, as: PermitOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "adjacent window [12:00,15:00) starting at prior end_at succeeds: SpotAssignment.${adj}.status == ACTIVE"
            - "overlapping window [11:00,13:00) returns error_id == ERR_SPOT_TIME_CONFLICT"

      - name: permit_validity_overlap_closed_on_cart
        grounds:
          - validations[priority=12]
          - state_machines.Permit.SUBMITTED_to_ISSUED
          - errors[ERR_PERMIT_OVERLAP]
        distinguishing_aspect: |
          Resource = Cart; interval semantics = closed validity window [issued_at, expires_at]. Issuing a second permit
          for the same cart whose prospective validity overlaps an existing ISSUED permit's window is rejected
          ERR_PERMIT_OVERLAP. Different resource (Cart, not Spot) and different semantics (closed, not half-open).
        test_recipe:
          setup:
            - "Clock 2026-06-01. Cart1 APPROVED. Permit pA ISSUED on cart1 (validity 2026-06-01..2027-06-01). Permit pB SUBMITTED on the same cart1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { pA: "$.data.id" } }
            - { call: "POST /permits/${pA}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${pA}/issue", payload: {}, as: PermitOfficer }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { pB: "$.data.id" } }
            - { call: "POST /permits/${pB}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
          trigger:
            - { call: "POST /permits/${pB}/issue", payload: {}, as: PermitOfficer, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_PERMIT_OVERLAP (closed validity window collides with pA's window on the same cart)"
            - "Permit.${pB}.status == SUBMITTED (unchanged)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: money_conservation_fine_charge_then_dismiss
        grounds:
          - calculations.money_conservation
          - state_machines.Violation.ISSUED_to_DISMISSED
          - entities.Vendor.fields.balance_owed_cents
        distinguishing_aspect: |
          Conserved quantity = money (Vendor.balance_owed_cents). Charging a MAJOR fine (+12000) then DISMISSING it
          (compensating -12000) returns balance_owed_cents to its exact pre-pair value (34257 after issue). No drift.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Permit p1 ISSUED (NEW fee 34257 charged to vendor v1, so balance_owed_cents == 34257)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer }
          trigger:
            - { call: "GET /vendors/${v1}", payload: {}, as: PermitOfficer, captures: { bal0: "$.data.balance_owed_cents" } }
            - { call: "POST /permits/${p1}/violations", payload: { violation_type: "MAJOR", description: "fine" }, as: EnforcementOfficer, as_user_id: "off-1", captures: { vio: "$.data.id" } }
            - { call: "GET /vendors/${v1}", payload: {}, as: PermitOfficer, captures: { bal1: "$.data.balance_owed_cents" } }
            - { call: "POST /violations/${vio}/adjudicate", payload: { outcome: "DISMISS" }, as: EnforcementOfficer, as_user_id: "off-2" }
            - { call: "GET /vendors/${v1}", payload: {}, as: PermitOfficer, captures: { bal2: "$.data.balance_owed_cents" } }
          assert:
            - "Vendor.${v1}.balance_owed_cents == 34257 after issue (bal0)"
            - "Vendor.${v1}.balance_owed_cents == 46257 after MAJOR fine charged (bal1 == bal0 + 12000)"
            - "Vendor.${v1}.balance_owed_cents == 34257 after DISMISS reversal (bal2 == bal0); money conserved across the charge/credit pair"

      - name: slot_conservation_assign_then_release
        grounds:
          - calculations.zone_slot_conservation
          - state_machines.SpotAssignment.ACTIVE_to_RELEASED
          - entities.Zone.fields.assigned_slots
          - entities.Zone.fields.available_slots
        distinguishing_aspect: |
          Conserved quantity = zone slot count (a different quantity than money). Creating an assignment (+1 assigned)
          then releasing it (-1) restores assigned_slots/available_slots, and assigned_slots + available_slots == capacity_slots (5) holds at every step.
        test_recipe:
          setup:
            - "Clock 2026-06-01. Zone z1 capacity_slots 5, one spot spot1. Permit p1 ISSUED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: PermitOfficer }
            - { call: "POST /vendors", payload: { legal_name: "V1", contact_email: "v1@x.com", seniority_years: 0 }, as: PermitOfficer, captures: { v1: "$.data.id" } }
            - { call: "POST /vendors/${v1}/insurance", payload: { insurance_effective_at: "2026-05-01T00:00:00Z", insurance_expires_at: "2027-05-01T00:00:00Z", insurance_coverage_cents: 100000000 }, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /commissaries", payload: { name: "C1", health_grade: "A", license_expires_at: "2027-01-01T00:00:00Z" }, as: HealthInspector, captures: { c1: "$.data.id" } }
            - { call: "POST /carts", payload: { vendor_id: "${v1}", commissary_id: "${c1}", cart_type: "FOOD", size_sqft: 30 }, as: Vendor, as_user_id: "${v1}", captures: { cart1: "$.data.id" } }
            - { call: "POST /carts/${cart1}/inspect", payload: { inspection_type: "HEALTH", result: "PASS", score: 95, inspection_expires_at: "2026-12-01T00:00:00Z" }, as: HealthInspector }
            - { call: "POST /carts/${cart1}/approve", payload: {}, as: PermitOfficer }
            - { call: "POST /zones", payload: { name: "Z1", zone_type: "STANDARD", capacity_slots: 5, spacing_min_feet: 20 }, as: PermitOfficer, captures: { z1: "$.data.id", zv1: "$.data.version" } }
            - { call: "POST /zones/${z1}/spots", payload: { label: "S1", position_feet: 100 }, as: PermitOfficer, captures: { spot1: "$.data.id" } }
            - { call: "POST /permits", payload: { vendor_id: "${v1}", cart_id: "${cart1}", zone_id: "${z1}", permit_type: "FOOD" }, as: Vendor, as_user_id: "${v1}", captures: { p1: "$.data.id" } }
            - { call: "POST /permits/${p1}/submit", payload: {}, as: Vendor, as_user_id: "${v1}" }
            - { call: "POST /permits/${p1}/issue", payload: {}, as: PermitOfficer }
          trigger:
            - { call: "GET /zones/${z1}", payload: {}, as: PermitOfficer, captures: { as0: "$.data.assigned_slots", av0: "$.data.available_slots" } }
            - { call: "POST /permits/${p1}/spot-assignments", payload: { spot_id: "${spot1}", start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T17:00:00Z", expected_zone_version: "${zv1}" }, as: PermitOfficer, captures: { sa: "$.data.id" } }
            - { call: "GET /zones/${z1}", payload: {}, as: PermitOfficer, captures: { as1: "$.data.assigned_slots", av1: "$.data.available_slots" } }
            - { call: "POST /spot-assignments/${sa}/release", payload: {}, as: PermitOfficer }
            - { call: "GET /zones/${z1}", payload: {}, as: PermitOfficer, captures: { as2: "$.data.assigned_slots", av2: "$.data.available_slots" } }
          assert:
            - "Zone.${z1}: assigned_slots 0 available_slots 5 before assign"
            - "Zone.${z1}: assigned_slots 1 available_slots 4 after assign"
            - "Zone.${z1}: assigned_slots 0 available_slots 5 after release; assigned_slots + available_slots == 5 at every step"
