          assert:
            - "HTTP 200 with ScheduleCycle.${cyc}.status == \"CLOSED\"; cycle enplaned_bags_total == 500, mishandled_bags_total == 3, on_time_leg_count == 2, recorded_completed_legs == 2, credited_block_hours == 2.000"
            - "GET /cpa/scorecards?cycle_id=${cyc} returns total_count == 1 with completion_factor_pct == 100.00, on_time_arrival_pct == 100.00, mishandled_bags_per_1000 == 6.00 (round2(1000 * 3 / 500))"
