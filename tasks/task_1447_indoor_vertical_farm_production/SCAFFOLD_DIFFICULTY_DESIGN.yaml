scaffold_difficulty_design:
  # ==========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ==========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: energy_cost_provisional_vs_actual_per_pound
        grounds:
          - calculations.energy_cost_per_pound
          - entities.GrowBatch.fields.actual_cost_per_pound_cents
          - endpoints."GET /farm/batches/{id}/cost-summary"
        distinguishing_aspect: |
          Entity domain: production cost accounting on GrowBatch. For identical batch inputs
          the PROVISIONAL variant (nameplate kW x schedule / projected yield, no demand charge)
          yields 177.41 cents/lb while the ACTUAL variant (metered kWh + tiered demand charge
          allocated by tower-light-hour share / harvested pounds) yields 13187.15 cents/lb.
        test_recipe:
          setup:
            - "Crop KALE-01 with ACTIVE recipe R1 (light 16h/day, days_to_harvest 21, yield 12.5 lb/tower)"
            - "Crop BASIL-01 with ACTIVE recipe R2 (light 14h/day, 21d, 10.0 lb/tower)"
            - "Batch B1: 4 towers of rack R-01 (loop WL-A), seeded 2026-08-03T00:00:00Z, germination 96.0 -> projected 50.00 lb, harvested 46.00 lb on 2026-08-24"
            - "Batch B2: 2 towers of rack R-02 (loop WL-B), seeded 2026-08-03T00:00:00Z, germination 100.0, still GROWING"
            - "FACILITY meter reading [2026-08-03T00:00:00Z, 2026-08-24T00:00:00Z): 40000 kWh, peak 480 kW"
          setup_api_calls:
            - { call: "POST /farm/crops", payload: { crop_code: "KALE-01", display_name: "Kale", category: "LEAFY_GREEN", margin_cents_per_lb: 300, floor_price_cents_per_lb: 100 }, as: FarmManager, captures: { c_kale: "$.data.id", c_kale_v: "$.data.version" } }
            - { call: "POST /farm/recipes", payload: { crop_id: "${c_kale}", light_hours_per_day: 16, light_ppfd_umol: 600, ec_target_ms: 1.8, ph_target: 5.8, temp_day_c: 22, temp_night_c: 18, humidity_pct: 65, co2_ppm: 900, days_to_harvest: 21, expected_yield_lb_per_tower: 12.5 }, as: Grower, captures: { r_kale: "$.data.id" } }
            - { call: "POST /farm/recipes/${r_kale}/activate", payload: { expected_crop_version: "${c_kale_v}" }, as: Grower }
            - { call: "POST /farm/crops", payload: { crop_code: "BASIL-01", display_name: "Basil", category: "HERB", margin_cents_per_lb: 500, floor_price_cents_per_lb: 200 }, as: FarmManager, captures: { c_basil: "$.data.id", c_basil_v: "$.data.version" } }
            - { call: "POST /farm/recipes", payload: { crop_id: "${c_basil}", light_hours_per_day: 14, light_ppfd_umol: 500, ec_target_ms: 1.6, ph_target: 6.0, temp_day_c: 23, temp_night_c: 19, humidity_pct: 60, co2_ppm: 800, days_to_harvest: 21, expected_yield_lb_per_tower: 10.0 }, as: Grower, captures: { r_basil: "$.data.id" } }
            - { call: "POST /farm/recipes/${r_basil}/activate", payload: { expected_crop_version: "${c_basil_v}" }, as: Grower }
            - { call: "POST /farm/water-loops", payload: { loop_code: "WL-A" }, as: FarmManager, captures: { wl_a: "$.data.id" } }
            - { call: "POST /farm/water-loops", payload: { loop_code: "WL-B" }, as: FarmManager, captures: { wl_b: "$.data.id" } }
            - { call: "POST /farm/racks", payload: { rack_code: "R-01", water_loop_id: "${wl_a}", zone: "Z1", tower_count: 4 }, as: FarmManager, captures: { rk_1: "$.data.id" } }
            - { call: "POST /farm/racks", payload: { rack_code: "R-02", water_loop_id: "${wl_b}", zone: "Z1", tower_count: 2 }, as: FarmManager, captures: { rk_2: "$.data.id" } }
            - { call: "GET /farm/racks/${rk_1}/towers", as: FarmManager, captures: { t1: "$.data[0].id", t2: "$.data[1].id", t3: "$.data[2].id", t4: "$.data[3].id" } }
            - { call: "GET /farm/racks/${rk_2}/towers", as: FarmManager, captures: { u1: "$.data[0].id", u2: "$.data[1].id" } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/batches", payload: { crop_id: "${c_kale}", tower_ids: ["${t1}", "${t2}", "${t3}", "${t4}"] }, as: Grower, captures: { b1: "$.data.id" } }
            - { call: "POST /farm/batches/${b1}/seed", as: Grower }
            - { call: "POST /farm/batches/${b1}/germination-check", payload: { germination_rate_pct: 96.0 }, as: Grower }
            - { call: "POST /farm/batches", payload: { crop_id: "${c_basil}", tower_ids: ["${u1}", "${u2}"] }, as: Grower, captures: { b2: "$.data.id" } }
            - { call: "POST /farm/batches/${b2}/seed", as: Grower }
            - { call: "POST /farm/batches/${b2}/germination-check", payload: { germination_rate_pct: 100.0 }, as: Grower }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/batches/${b1}/mark-harvest-ready", as: Grower }
            - { call: "POST /farm/batches/${b1}/harvest", payload: { grade_a_lb: 40.0, grade_b_lb: 6.0, cull_lb: 3.0 }, as: Grower, as_user_id: "grower-7" }
            - { call: "POST /farm/energy-readings", payload: { scope_type: "FACILITY", period_start_at: "2026-08-03T00:00:00Z", period_end_at: "2026-08-24T00:00:00Z", kwh_consumed: 40000.0, peak_demand_kw: 480.0 }, as: FarmManager }
          trigger:
            - { call: "GET /farm/batches/${b1}/cost-summary", as: FarmManager, captures: { prov_cpp: "$.data.provisional_cost_per_pound_cents", act_cpp: "$.data.actual_cost_per_pound_cents", e_alloc: "$.data.energy_alloc_cents", d_alloc: "$.data.demand_alloc_cents" } }
          assert:
            - "provisional_cost_per_pound_cents == 177.41  (4 towers x 16h x 21d x 0.6kW = 806.4 kWh x 11 = 8870.4 cents / 50.00 lb)"
            - "energy_alloc_cents == 306087  (round_half_up(440000 x 1344/1932))"
            - "demand_alloc_cents == 300522  (round_half_up(432000 x 1344/1932); 480 kW entirely in tier 1)"
            - "actual_cost_per_pound_cents == 13187.15  (606609 / 46.00 harvested lb)"
            - "${prov_cpp} != ${act_cpp}  (same batch, same inputs, two valid variants diverge)"

      - name: fill_rate_provisional_vs_final_settlement
        grounds:
          - calculations.contract_week_fill_rate
          - calculations.contract_shortfall_penalty
          - endpoints."GET /farm/contracts/{id}/week-summary"
          - endpoints."POST /farm/contracts/{id}/settle-week"
        distinguishing_aspect: |
          Entity domain: commercial contract performance on RetailContract (vs GrowBatch cost
          accounting in the sibling instance). PROVISIONAL counts RESERVED pounds as if shipped
          (0.9800, no penalty territory) while FINAL counts only SHIPPED pounds after the
          settle sweep expires the unshipped reservation (0.6000, penalty 30000 cents).
        test_recipe:
          setup:
            - "Crop KALE-01 with ACTIVE recipe; loop WL-A with racks R-01/R-02 (8 towers each)"
            - "Batches B1 (300.00 lb packed) and B2 (190.00 lb packed), both harvested 2026-08-24 and safety RELEASED; PASSED sanitation on WL-A at 2026-08-22T03:30:00Z"
            - "Contract CT1: commitment 500 lb/wk, price 245, penalty 150/short lb, threshold 0.98, weeks start MONDAY, start_date 2026-08-24"
            - "S1 SHIPPED 300.00 lb (line on B1); S2 RESERVED 190.00 lb (line on B2), never shipped"
          setup_api_calls:
            - { call: "POST /farm/crops", payload: { crop_code: "KALE-01", display_name: "Kale", category: "LEAFY_GREEN", margin_cents_per_lb: 300, floor_price_cents_per_lb: 100 }, as: FarmManager, captures: { c_kale: "$.data.id", c_kale_v: "$.data.version" } }
            - { call: "POST /farm/recipes", payload: { crop_id: "${c_kale}", light_hours_per_day: 16, light_ppfd_umol: 600, ec_target_ms: 1.8, ph_target: 5.8, temp_day_c: 22, temp_night_c: 18, humidity_pct: 65, co2_ppm: 900, days_to_harvest: 21, expected_yield_lb_per_tower: 12.5 }, as: Grower, captures: { r_kale: "$.data.id" } }
            - { call: "POST /farm/recipes/${r_kale}/activate", payload: { expected_crop_version: "${c_kale_v}" }, as: Grower }
            - { call: "POST /farm/water-loops", payload: { loop_code: "WL-A" }, as: FarmManager, captures: { wl_a: "$.data.id" } }
            - { call: "POST /farm/racks", payload: { rack_code: "R-01", water_loop_id: "${wl_a}", zone: "Z1", tower_count: 8 }, as: FarmManager, captures: { rk_1: "$.data.id" } }
            - { call: "GET /farm/racks/${rk_1}/towers", as: FarmManager, captures: { t1: "$.data[0].id", t2: "$.data[1].id", t3: "$.data[2].id", t4: "$.data[3].id", t5: "$.data[4].id", t6: "$.data[5].id", t7: "$.data[6].id", t8: "$.data[7].id" } }
            - { call: "POST /farm/sanitation-cycles", payload: { water_loop_id: "${wl_a}", scheduled_start_at: "2026-08-22T01:00:00Z", scheduled_end_at: "2026-08-22T03:00:00Z" }, as: SanitationLead, captures: { cy1: "$.data.id" } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/batches", payload: { crop_id: "${c_kale}", tower_ids: ["${t1}", "${t2}", "${t3}", "${t4}"] }, as: Grower, captures: { b1: "$.data.id" } }
            - { call: "POST /farm/batches/${b1}/seed", as: Grower }
            - { call: "POST /farm/batches/${b1}/germination-check", payload: { germination_rate_pct: 96.0 }, as: Grower }
            - { call: "POST /farm/batches", payload: { crop_id: "${c_kale}", tower_ids: ["${t5}", "${t6}", "${t7}", "${t8}"] }, as: Grower, captures: { b2: "$.data.id" } }
            - { call: "POST /farm/batches/${b2}/seed", as: Grower }
            - { call: "POST /farm/batches/${b2}/germination-check", payload: { germination_rate_pct: 96.0 }, as: Grower }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T01:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/sanitation-cycles/${cy1}/start", as: SanitationLead }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T03:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/sanitation-cycles/${cy1}/record-result", payload: { result: "PASSED", coliform_cfu: 0 }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-22T06:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/batches/${b1}/mark-harvest-ready", as: Grower }
            - { call: "POST /farm/batches/${b2}/mark-harvest-ready", as: Grower }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T06:30:00Z" }, as: FarmManager }
            - { call: "POST /farm/batches/${b1}/harvest", payload: { grade_a_lb: 300.0, grade_b_lb: 0.0, cull_lb: 0.0 }, as: Grower, as_user_id: "grower-7" }
            - { call: "POST /farm/batches/${b2}/harvest", payload: { grade_a_lb: 190.0, grade_b_lb: 0.0, cull_lb: 0.0 }, as: Grower, as_user_id: "grower-7" }
            - { call: "POST /farm/batches/${b1}/safety-release", payload: { decision: "RELEASED", lab_ref: "LAB-11" }, as: QualityAssurance, as_user_id: "qa-1" }
            - { call: "POST /farm/batches/${b2}/safety-release", payload: { decision: "RELEASED", lab_ref: "LAB-12" }, as: QualityAssurance, as_user_id: "qa-1" }
            - { call: "POST /farm/batches/${b1}/pack", payload: { packed_lb: 300.0 }, as: Grower }
            - { call: "POST /farm/batches/${b2}/pack", payload: { packed_lb: 190.0 }, as: Grower }
            - { call: "POST /farm/contracts", payload: { retailer_name: "FreshMart", crop_id: "${c_kale}", weekly_commitment_lb: 500, price_per_pound_cents: 245, penalty_cents_per_short_lb: 150, fill_rate_threshold: 0.98, week_start_day: "MONDAY", start_date: "2026-08-24", end_date: "2026-09-20" }, as: ContractsManager, captures: { ct1: "$.data.id", ct1_v: "$.data.version" } }
            - { call: "POST /farm/shipments", payload: { contract_id: "${ct1}", ship_date: "2026-08-24", window_start_at: "2026-08-24T08:00:00Z", window_end_at: "2026-08-24T20:00:00Z", expected_contract_version: "${ct1_v}", lines: [ { batch_id: "${b1}", reserved_lb: 300.0 } ] }, as: ContractsManager, captures: { s1: "$.data.id" } }
            - { call: "GET /farm/shipments/${s1}/lines", as: ContractsManager, captures: { s1_l1: "$.data[0].id" } }
            - { call: "POST /farm/shipments/${s1}/confirm-pack", payload: { lines: [ { line_id: "${s1_l1}", packed_lb: 300.0 } ] }, as: ContractsManager }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T15:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/shipments/${s1}/ship", as: ContractsManager }
            - { call: "GET /farm/contracts/${ct1}", as: ContractsManager, captures: { ct1_v2: "$.data.version" } }
            - { call: "POST /farm/shipments", payload: { contract_id: "${ct1}", ship_date: "2026-08-24", window_start_at: "2026-08-24T17:00:00Z", window_end_at: "2026-08-24T21:00:00Z", expected_contract_version: "${ct1_v2}", lines: [ { batch_id: "${b2}", reserved_lb: 190.0 } ] }, as: ContractsManager, captures: { s2: "$.data.id" } }
          trigger:
            - { call: "GET /farm/contracts/${ct1}/week-summary", payload: { week_start_date: "2026-08-24" }, as: ContractsManager, captures: { prov_fill: "$.data.provisional_fill_rate", fin_fill_pre: "$.data.final_fill_rate" } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/contracts/${ct1}/settle-week", payload: { week_start_date: "2026-08-24" }, as: ContractsManager }
            - { call: "GET /farm/contracts/${ct1}/week-summary", payload: { week_start_date: "2026-08-24" }, as: ContractsManager, captures: { fin_fill: "$.data.final_fill_rate", pen: "$.data.penalty_cents" } }
            - { call: "GET /farm/shipments/${s2}", as: ContractsManager, captures: { s2_status: "$.data.shipment_status" } }
            - { call: "GET /farm/batches/${b2}", as: ContractsManager, captures: { b2_avail: "$.data.packed_available_lb" } }
          assert:
            - "pre-settle: provisional_fill_rate == 0.9800 ((300 shipped + 190 reserved)/500)"
            - "pre-settle: final_fill_rate == 0.6000 (300/500)"
            - "post-settle: Shipment.${s2}.shipment_status == EXPIRED (settle sweep)"
            - "post-settle: final_fill_rate == 0.6000 and penalty_cents == 30000 (short 200 lb x 150, no escalation: first short week)"
            - "GrowBatch.${b2}.packed_available_lb == 190.00 and reserved_lb == 0.00 (line release restored the pool)"
            - "RetailContract.${ct1}.consecutive_short_weeks == 1"

  # ==========================================================================
  # Rule 2 — combinatorial_formula (three different modes)
  # ==========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: harvest_labor_cost_nested_min_max
        grounds:
          - calculations.harvest_labor_cost
          - entities.LaborShift.fields.projected_labor_cost_cents
        distinguishing_aspect: |
          Mode (a) — 4 inputs with non-linear interaction: total forecast pounds, per-category
          productivity tier (LEAFY_GREEN 60 lb/h), assigned headcount, and planned rate combine
          through nested min()/max() with an overtime multiplier; cost jumps from 13200 (all
          overtime at 0 assigned) to 8800 (all regular at 1 assigned) for identical forecast data.
        test_recipe:
          setup:
            - "Crop KALE-01 ACTIVE recipe (16h, 21d, 12.5 lb/tower); racks R-01 and R-02 (8 towers each) on loops WL-A / WL-B"
            - "Batch B1 on R-01 (8 towers, germination 96.0 -> projected 100.00 lb) and B2 on R-02 (8 towers, -> 100.00 lb), both projected harvest 2026-08-24T06:00:00Z, both GROWING"
            - "HARVEST_CREW shift on 2026-08-24 07:00-15:00, headcount_required 2, planned rate 2200 cents/h"
          setup_api_calls:
            - { call: "POST /farm/crops", payload: { crop_code: "KALE-01", display_name: "Kale", category: "LEAFY_GREEN", margin_cents_per_lb: 300, floor_price_cents_per_lb: 100 }, as: FarmManager, captures: { c_kale: "$.data.id", c_kale_v: "$.data.version" } }
            - { call: "POST /farm/recipes", payload: { crop_id: "${c_kale}", light_hours_per_day: 16, light_ppfd_umol: 600, ec_target_ms: 1.8, ph_target: 5.8, temp_day_c: 22, temp_night_c: 18, humidity_pct: 65, co2_ppm: 900, days_to_harvest: 21, expected_yield_lb_per_tower: 12.5 }, as: Grower, captures: { r_kale: "$.data.id" } }
            - { call: "POST /farm/recipes/${r_kale}/activate", payload: { expected_crop_version: "${c_kale_v}" }, as: Grower }
            - { call: "POST /farm/water-loops", payload: { loop_code: "WL-A" }, as: FarmManager, captures: { wl_a: "$.data.id" } }
            - { call: "POST /farm/water-loops", payload: { loop_code: "WL-B" }, as: FarmManager, captures: { wl_b: "$.data.id" } }
            - { call: "POST /farm/racks", payload: { rack_code: "R-01", water_loop_id: "${wl_a}", zone: "Z1", tower_count: 8 }, as: FarmManager, captures: { rk_1: "$.data.id" } }
            - { call: "POST /farm/racks", payload: { rack_code: "R-02", water_loop_id: "${wl_b}", zone: "Z1", tower_count: 8 }, as: FarmManager, captures: { rk_2: "$.data.id" } }
            - { call: "GET /farm/racks/${rk_1}/towers", as: FarmManager, captures: { t1: "$.data[0].id", t2: "$.data[1].id", t3: "$.data[2].id", t4: "$.data[3].id", t5: "$.data[4].id", t6: "$.data[5].id", t7: "$.data[6].id", t8: "$.data[7].id" } }
            - { call: "GET /farm/racks/${rk_2}/towers", as: FarmManager, captures: { u1: "$.data[0].id", u2: "$.data[1].id", u3: "$.data[2].id", u4: "$.data[3].id", u5: "$.data[4].id", u6: "$.data[5].id", u7: "$.data[6].id", u8: "$.data[7].id" } }
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T06:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/batches", payload: { crop_id: "${c_kale}", tower_ids: ["${t1}", "${t2}", "${t3}", "${t4}", "${t5}", "${t6}", "${t7}", "${t8}"] }, as: Grower, captures: { b1: "$.data.id" } }
            - { call: "POST /farm/batches/${b1}/seed", as: Grower }
            - { call: "POST /farm/batches/${b1}/germination-check", payload: { germination_rate_pct: 96.0 }, as: Grower }
            - { call: "POST /farm/batches", payload: { crop_id: "${c_kale}", tower_ids: ["${u1}", "${u2}", "${u3}", "${u4}", "${u5}", "${u6}", "${u7}", "${u8}"] }, as: Grower, captures: { b2: "$.data.id" } }
            - { call: "POST /farm/batches/${b2}/seed", as: Grower }
            - { call: "POST /farm/batches/${b2}/germination-check", payload: { germination_rate_pct: 96.0 }, as: Grower }
            - { call: "POST /farm/labor-shifts", payload: { shift_date: "2026-08-24", role_type: "HARVEST_CREW", start_at: "2026-08-24T07:00:00Z", end_at: "2026-08-24T15:00:00Z", headcount_required: 2, planned_hourly_rate_cents: 2200 }, as: LaborPlanner, captures: { sh: "$.data.id" } }
            - { call: "POST /farm/workers", payload: { full_name: "W One", certifications: ["HARVEST_CREW"], hourly_rate_cents: 2200 }, as: LaborPlanner, captures: { w1: "$.data.id" } }
          trigger:
            - { call: "POST /farm/labor-shifts/${sh}/publish", as: LaborPlanner, captures: { sh_v: "$.data.version", cost_at_publish: "$.data.projected_labor_cost_cents" } }
            - { call: "POST /farm/labor-shifts/${sh}/assignments", payload: { worker_id: "${w1}", expected_labor_shift_version: "${sh_v}" }, as: LaborPlanner, captures: { asg1: "$.data.id" } }
            - { call: "GET /farm/labor-shifts/${sh}", as: LaborPlanner, captures: { cost_after: "$.data.projected_labor_cost_cents", hc: "$.data.headcount_assigned" } }
          assert:
            - "at publish (headcount_assigned == 0): projected_labor_cost_cents == 13200  (required = ceil(100/60 + 100/60) = 4 crew-hours; regular = min(4, 8x0) = 0; overtime = max(0, 4-0) = 4; 4 x 2200 x 1.5)"
            - "after 1 assignment: projected_labor_cost_cents == 8800  (regular = min(4, 8x1) = 4; overtime = 0; 4 x 2200)"
            - "LaborShift.${sh}.headcount_assigned == 1"

      - name: shipment_invoice_per_line_rounding
        grounds:
          - calculations.shipment_invoice_total
          - entities.Shipment.fields.invoice_total_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order: the scaffold pins round-per-line-then-sum, producing
          8882 cents for lines 10.55/20.15/5.55 lb at 245 cents/lb, where the alternative
          sum-then-round produces 8881 — a one-cent divergence the test pins exactly.
        test_recipe:
          setup:
            - "Crop KALE-01 ACTIVE recipe; one batch harvested 36.25 lb grade A, RELEASED, packed 36.25 lb on 2026-08-24 (PASSED sanitation 2026-08-22T03:30:00Z on WL-A)"
            - "Contract price 245 cents/lb, commitment 500, start 2026-08-24 (MONDAY weeks)"
          setup_api_calls:
            - { call: "POST /farm/crops", payload: { crop_code: "KALE-01", display_name: "Kale", category: "LEAFY_GREEN", margin_cents_per_lb: 300, floor_price_cents_per_lb: 100 }, as: FarmManager, captures: { c_kale: "$.data.id", c_kale_v: "$.data.version" } }
