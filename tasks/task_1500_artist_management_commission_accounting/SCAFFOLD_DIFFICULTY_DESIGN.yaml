            - call: "POST /opportunities"
              payload: { artist_id: "${a_id}", income_type: "TOURING", counterparty_name: "FestH", proposed_value_cents: 5000000, offer_expiry_date: "2026-12-31", proposed_window_start: "2026-10-10T18:00:00Z", proposed_window_end: "2026-10-10T23:00:00Z", fit_score: 60 }
