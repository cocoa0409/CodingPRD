              as_user_id: "${c1}"
              captures: { err_id: $.data.error_id }
            - call: "POST /referral-agreements/${ag}/activate"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c2}"
            - call: "POST /registry-cases/${k1}/transfer-out"
              payload: { transfer_out_to_center_id: "${c2}" }
              as: TraumaProgramManager
              as_user_id: "${c1}"
          assert:
            - "the first transfer-out returns HTTP 409 with data.error_id == ERR_NO_ACTIVE_REFERRAL_AGREEMENT and RegistryCase.${k1}.transfer_out_to_center_id is null"
            - "before activation TraumaCenter.${c1}.registry_included_case_count == 1 and registry_excluded_case_count == 0"
            - "after activation ReferralAgreement.${ag}.agreement_status == ACTIVE with activated_at == 2026-08-01T00:00:00Z"
            - "the second transfer-out returns HTTP 200 with RegistryCase.${k1}.ed_disposition == TRANSFER_OUT, inclusion_status == EXCLUDED and inclusion_reason == TRANSFER_OUT_MINOR_UNDER_24H"
            - "TraumaCenter.${c1}.registry_included_case_count == 0 and registry_excluded_case_count == 1"
      - name: verified_decision_requires_zero_open_critical_deficiencies
        grounds:
          - validations[priority=56]
          - errors[ERR_CRITICAL_DEFICIENCY_BLOCKS_VERIFICATION]
          - state_machines.VerificationCycle.UNDER_REVIEW_to_VERIFIED
          - state_machines.CriteriaDeficiency.REMEDIATION_SUBMITTED_to_CLOSED
        distinguishing_aspect: |
          The decision is gated by an aggregate over the cycle's child deficiencies rather than by any
          single entity's state, and remediation alone does not unblock it: only the reviewer's close
          drops open_type_i_count to 0, at which point the same VERIFIED decision succeeds and the
          center's national_verification_status flips.
        test_recipe:
          setup:
            - "one trauma center with no outreach hours, so a NATIONAL_VERIFICATION cycle starts at readiness 82.00 and can be submitted"
            - "the cycle is walked PREP -> SUBMITTED -> SITE_VISIT_SCHEDULED -> UNDER_REVIEW with one surveyor booking"
            - "while UNDER_REVIEW the reviewer records one TYPE_I_CRITICAL deficiency, so open_type_i_count is 1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
