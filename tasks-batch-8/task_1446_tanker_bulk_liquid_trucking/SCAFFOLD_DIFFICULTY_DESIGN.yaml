            - { call: "POST /bulk-liquid/shipments/${s3}/plan", payload: { trailer_id: "${trl3}", driver_id: "${drv}", rack_id: "${rack}", rack_window_start: "2026-08-02T11:30:00Z", rack_window_end: "2026-08-02T13:00:00Z" }, as: Dispatcher, captures: { err: $.data.error_id } }
