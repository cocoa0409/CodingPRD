# =============================================================================
# SCAFFOLD.yaml — Parent & Executive-Function Coaching Service
# §1.0–§1.7 seed tables. Difficulty posture: beyond-expert (maxed rule density).
# =============================================================================

scenario: |
  Parent & Executive-Function Coaching Service (ADHD/parent coaching practice): intake & goal setting with client and family, session cadence & package pricing, between-session accountability check-ins, progress measurement & plan revision, coordination with school/clinician within consent limits, group workshop vs individual track, cancellation/no-show policy, coach caseload & supervision

domain_name: parent-executive-function-coaching
api_prefix: /api

complexity_profile:
  primary_archetype: temporal_windowing        # cadence windows, cancellation cutoffs, package expiry, workshop windows
  secondary_archetype: access_control_matrix   # consent-scoped visibility to school/clinician contacts
  complexity_layers:
    - optimistic_concurrency                   # OCC on Client.version (plan supersede) and Family.version (consent supersede)
    - cascading_side_effects                   # no-show -> package -> plan posture -> family suspension chains
    - rate_threshold_triggers                  # caseload caps, supervision ratios, delinquency threshold, revision trigger
    - derived_field_reconciliation             # postures, caseload counters, credit splits, ledger balances
  entity_topology: hybrid                      # family tree + cross-cutting coach/contact/workshop references
  state_machine_shape: parallel                # Session carries attendance_state x billing_state; other entities add cycles + posture
  relationship_patterns:
    - one_to_many
    - many_to_many                             # WorkshopEnrollment junction
    - cross_aggregate                          # Session -> Package/Coach; ConsentGrant -> CoordinationContact
  role_model: hierarchical_override            # PracticeAdmin superset; Coach/FamilyMember/ExternalContact peers; supervision segregation of duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Family
    parent: null
    common_fields: true
    fields:
      - { name: account_name, type: string, source: input, description: "Household account display name" }
      - { name: primary_email, type: string, source: input, description: "Primary parent/guardian email" }
      - { name: status, type: enum, source: system, description: "INTAKE | ACTIVE | SUSPENDED | CLOSED; initial INTAKE", constraints: "enum: INTAKE, ACTIVE, SUSPENDED, CLOSED" }
      - { name: total_charged_cents, type: integer, source: computed, description: "Lifetime charges: package purchases + cancellation fees + money-source workshop enrollments", default: 0 }
      - { name: total_refunded_cents, type: integer, source: computed, description: "Lifetime refunds: package refunds + workshop cancel/drop money refunds", default: 0 }
      - { name: total_paid_cents, type: integer, source: computed, description: "Lifetime payments received via POST /families/{id}/payments", default: 0 }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "= total_charged_cents - total_refunded_cents - total_paid_cents (INV-MONEY)" }
      - { name: billing_status, type: enum, source: computed, description: "CURRENT | DELINQUENT; DELINQUENT iff outstanding_balance_cents > DELINQUENCY_THRESHOLD_CENTS", constraints: "enum: CURRENT, DELINQUENT" }

  - name: Client
    parent: Family
    common_fields: true
    fields:
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; owning household account" }
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date of birth (YYYY-MM-DD)" }
      - { name: track, type: enum, source: input, description: "INDIVIDUAL | GROUP | HYBRID coaching track", constraints: "enum: INDIVIDUAL, GROUP, HYBRID" }
      - { name: status, type: enum, source: system, description: "INTAKE | ACTIVE | PAUSED | DISCHARGED; initial INTAKE", constraints: "enum: INTAKE, ACTIVE, PAUSED, DISCHARGED" }
      - { name: active_plan_id, type: string, source: computed, description: "id of the single ACTIVE CoachingPlan, null when none" }
      - { name: checkin_streak, type: integer, source: computed, description: "Consecutive on-time check-ins under the active plan; resets to 0 on SUBMITTED_LATE or MISSED", default: 0 }
      - { name: rolling_progress_index, type: integer, source: computed, description: "Latest snapshot rolling_index (null until first snapshot)" }
      - { name: cumulative_progress_index, type: integer, source: computed, description: "Latest snapshot cumulative_index (null until first snapshot)" }

  - name: Coach
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Practitioner full name" }
      - { name: credential_level, type: enum, source: input, description: "ASSOCIATE | CERTIFIED | SUPERVISOR", constraints: "enum: ASSOCIATE, CERTIFIED, SUPERVISOR" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | SUPERVISION_DEFICIT | INACTIVE; initial AVAILABLE; deficit flag is computed by supervision_requirement", constraints: "enum: AVAILABLE, SUPERVISION_DEFICIT, INACTIVE" }
      - { name: active_caseload, type: integer, source: computed, description: "Count of CoachingPlans with status ACTIVE and coach_id = this coach", default: 0 }
      - { name: caseload_cap, type: integer, source: computed, description: "ASSOCIATE 12 | CERTIFIED 20 | SUPERVISOR 28" }
      - { name: required_supervision_hours, type: integer, source: computed, description: "floor(active_caseload / SUPERVISION_DIVISOR[level]); divisors ASSOCIATE 2, CERTIFIED 4, SUPERVISOR 6" }
      - { name: verified_supervision_hours_30d, type: number, source: computed, description: "Sum of SupervisionRecord.hours with status VERIFIED and verified_at in [now-30d, now] inclusive", default: 0 }

  - name: IntakeAssessment
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; assessed student" }
      - { name: presenting_concerns, type: string, source: input, description: "Free-text presenting concerns from family" }
      - { name: baseline_score, type: integer, source: input, description: "Baseline executive-function score 0..100", constraints: "0 <= baseline_score <= 100" }
      - { name: review_notes, type: string, source: system, description: "Reviewer notes; set on NEEDS_REVISION transition" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | NEEDS_REVISION; initial DRAFT; cycle NEEDS_REVISION -> DRAFT", constraints: "enum: DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, NEEDS_REVISION" }

  - name: CoachingPlan
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; plan owner" }
      - { name: coach_id, type: string, source: input, description: "FK -> Coach.id; primary coach for the plan" }
      - { name: intake_id, type: string, source: input, description: "FK -> IntakeAssessment.id; must belong to same client and be APPROVED" }
      - { name: cadence, type: enum, source: input, description: "WEEKLY | BIWEEKLY session cadence", constraints: "enum: WEEKLY, BIWEEKLY" }
      - { name: revision_number, type: integer, source: system, description: "1 + count of pre-existing plans for this client at creation time" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROPOSED | ACTIVE | COMPLETED | TERMINATED | SUPERSEDED; initial DRAFT", constraints: "enum: DRAFT, PROPOSED, ACTIVE, COMPLETED, TERMINATED, SUPERSEDED" }
      - { name: posture, type: enum, source: computed, description: "SCHEDULABLE | SCHEDULING_BLOCKED; derived: BLOCKED iff family.status != ACTIVE OR client.status != ACTIVE OR coach.status == INACTIVE OR no package of track INDIVIDUAL in status ACTIVE with credits_remaining - reserved_count >= 1", constraints: "enum: SCHEDULABLE, SCHEDULING_BLOCKED" }
      - { name: revision_recommended, type: boolean, source: computed, description: "true after two consecutive ProgressSnapshots with rolling_index < REVISION_TRIGGER_THRESHOLD (40)", default: false }
      - { name: activated_at, type: datetime, source: system, description: "Timestamp of DRAFT/PROPOSED -> ACTIVE; null until first acceptance" }

  - name: Goal
    parent: CoachingPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> CoachingPlan.id; owning plan" }
      - { name: title, type: string, source: input, description: "Goal title" }
      - { name: target_date, type: string, source: input, description: "ISO target date" }
      - { name: status, type: enum, source: system, description: "SET | IN_PROGRESS | ACHIEVED | DROPPED | CARRIED_FORWARD; initial SET", constraints: "enum: SET, IN_PROGRESS, ACHIEVED, DROPPED, CARRIED_FORWARD" }
      - { name: carried_to_plan_id, type: string, source: system, description: "FK -> CoachingPlan.id; set when status flips to CARRIED_FORWARD on plan supersede; null otherwise" }
      - { name: resolved_at, type: datetime, source: system, description: "Timestamp of transition into ACHIEVED or DROPPED; null while non-terminal" }

  - name: Package
    parent: Family
    common_fields: true
    fields:
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; purchasing household" }
      - { name: track, type: enum, source: input, description: "INDIVIDUAL | GROUP; which consumption the credits fund", constraints: "enum: INDIVIDUAL, GROUP" }
      - { name: credits_total, type: integer, source: input, description: "Purchased session credits", constraints: ">= 1" }
      - { name: credits_consumed, type: integer, source: computed, description: "Credits consumed by COMPLETED sessions or GROUP workshop enrollments", default: 0 }
      - { name: credits_forfeited, type: integer, source: computed, description: "Credits forfeited by CANCELLED_LATE / NO_SHOW sessions", default: 0 }
      - { name: credits_remaining, type: integer, source: computed, description: "= credits_total - credits_consumed - credits_forfeited (INV-CREDITS)" }
      - { name: reserved_count, type: integer, source: computed, description: "Count of Sessions with billing_state RESERVED against this package", default: 0 }
      - { name: price_paid_cents, type: integer, source: computed, description: "Computed by package_pricing at purchase" }
      - { name: unit_gross_cents, type: integer, source: computed, description: "round_half_up(tier_rate(credits_total) x track_multiplier); no sibling discount, no materials fee" }
      - { name: per_credit_value_cents, type: integer, source: computed, description: "PROVISIONAL per-credit value = round_half_up(price_paid_cents / credits_total)" }
      - { name: purchased_at, type: datetime, source: system, description: "Logical clock at purchase" }
      - { name: expires_at, type: datetime, source: system, description: "= purchased_at + PACKAGE_VALIDITY_DAYS (180) days" }
      - { name: refund_cents, type: integer, source: computed, description: "FINAL-variant refund amount; null until status == REFUNDED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | EXPIRED | REFUNDED; initial ACTIVE", constraints: "enum: ACTIVE, EXHAUSTED, EXPIRED, REFUNDED" }

  - name: Session
    parent: CoachingPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> CoachingPlan.id; owning plan" }
      - { name: coach_id, type: string, source: system, description: "FK -> Coach.id; copied from plan.coach_id at creation" }
      - { name: package_id, type: string, source: input, description: "FK -> Package.id; INDIVIDUAL-track package funding this session" }
      - { name: scheduled_start, type: datetime, source: input, description: "Session start (must be strictly in the future at creation)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Session end; must be > scheduled_start and duration <= 120 minutes" }
      - { name: attendance_state, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED_EARLY | CANCELLED_LATE | NO_SHOW; initial SCHEDULED (parallel dimension 1)", constraints: "enum: SCHEDULED, COMPLETED, CANCELLED_EARLY, CANCELLED_LATE, NO_SHOW" }
      - { name: billing_state, type: enum, source: system, description: "RESERVED | CONSUMED | RETURNED | FORFEITED; initial RESERVED (parallel dimension 2)", constraints: "enum: RESERVED, CONSUMED, RETURNED, FORFEITED" }
      - { name: cancellation_fee_cents, type: integer, source: computed, description: "0 | 50% | 100% of package.per_credit_value_cents per cancellation_charge; set on cancel/no-show", default: 0 }
      - { name: resolved_at, type: datetime, source: system, description: "Timestamp of leaving SCHEDULED; null while scheduled" }

  - name: CheckIn
    parent: CoachingPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> CoachingPlan.id; owning plan" }
      - { name: due_at, type: datetime, source: input, description: "Accountability deadline; must be strictly in the future at creation" }
      - { name: submitted_at, type: datetime, source: system, description: "Submission timestamp; null until submitted" }
      - { name: outcome_note, type: string, source: input, description: "Optional family note at submission" }
      - { name: status, type: enum, source: system, description: "PENDING | SUBMITTED_ON_TIME | SUBMITTED_LATE | MISSED | ACKNOWLEDGED; initial PENDING", constraints: "enum: PENDING, SUBMITTED_ON_TIME, SUBMITTED_LATE, MISSED, ACKNOWLEDGED" }

  - name: ProgressSnapshot
    parent: Client
    common_fields: false
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; measured student" }
      - { name: window_start, type: datetime, source: system, description: "= snapshot time - 28 days (rolling window, inclusive both ends)" }
      - { name: window_end, type: datetime, source: system, description: "= snapshot time" }
      - { name: goals_considered, type: integer, source: system, description: "Terminal goals in rolling window (resolved_at in [window_start, window_end])" }
      - { name: goals_achieved, type: integer, source: system, description: "Subset of goals_considered with status ACHIEVED" }
      - { name: checkins_considered, type: integer, source: system, description: "Check-ins in rolling window that left PENDING (submitted_at or MISSED resolution in window)" }
      - { name: checkins_on_time, type: integer, source: system, description: "Subset with status SUBMITTED_ON_TIME or ACKNOWLEDGED whose submitted_at <= due_at" }
      - { name: rolling_index, type: integer, source: system, description: "progress_index ROLLING_28D variant; null when both component denominators are 0" }
      - { name: cumulative_index, type: integer, source: system, description: "progress_index CUMULATIVE variant over the current ACTIVE plan; null when both denominators are 0" }

  - name: CoordinationContact
    parent: Family
    common_fields: true
    fields:
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; household that authorized this contact" }
      - { name: name, type: string, source: input, description: "Contact person name (teacher, clinician)" }
      - { name: organization, type: string, source: input, description: "School or clinic name" }
      - { name: contact_type, type: enum, source: input, description: "SCHOOL | CLINICIAN", constraints: "enum: SCHOOL, CLINICIAN" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE; initial ACTIVE", constraints: "enum: ACTIVE, INACTIVE" }

  - name: ConsentGrant
    parent: Family
    common_fields: true
    fields:
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; granting household" }
      - { name: contact_id, type: string, source: input, description: "FK -> CoordinationContact.id; consent recipient" }
      - { name: scope, type: enum, source: input, description: "PROGRESS_ONLY | GOALS_AND_PROGRESS | FULL_PLAN; coverage: PROGRESS_ONLY covers PROGRESS notes; GOALS_AND_PROGRESS covers PROGRESS+GOALS; FULL_PLAN covers PROGRESS+GOALS+PLAN_DETAIL", constraints: "enum: PROGRESS_ONLY, GOALS_AND_PROGRESS, FULL_PLAN" }
      - { name: status, type: enum, source: system, description: "PENDING_SIGNATURE | ACTIVE | REVOKED | EXPIRED | SUPERSEDED; initial PENDING_SIGNATURE", constraints: "enum: PENDING_SIGNATURE, ACTIVE, REVOKED, EXPIRED, SUPERSEDED" }
      - { name: signed_at, type: datetime, source: system, description: "Timestamp of sign transition; null until ACTIVE" }
      - { name: expires_at, type: datetime, source: input, description: "Consent expiry; must be strictly in the future at creation" }

  - name: CoordinationNote
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id; subject student" }
      - { name: author_coach_id, type: string, source: system, description: "FK -> Coach.id; authoring coach (= X-User-ID at creation)" }
      - { name: topic, type: enum, source: input, description: "PROGRESS | GOALS | PLAN_DETAIL sensitivity tier", constraints: "enum: PROGRESS, GOALS, PLAN_DETAIL" }
      - { name: body, type: string, source: input, description: "Note content" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | SHARED | SEALED; initial DRAFT; SEALED is terminal", constraints: "enum: DRAFT, FINALIZED, SHARED, SEALED" }
      - { name: shared_with_contact_id, type: string, source: system, description: "FK -> CoordinationContact.id; set on share transition; null otherwise" }
      - { name: shared_at, type: datetime, source: system, description: "Timestamp of share; null until SHARED" }

  - name: Workshop
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Workshop title" }
      - { name: coach_id, type: string, source: input, description: "FK -> Coach.id; facilitating coach" }
      - { name: capacity, type: integer, source: input, description: "Maximum ENROLLED seats", constraints: ">= 1" }
      - { name: window_start, type: datetime, source: input, description: "Workshop start" }
      - { name: window_end, type: datetime, source: input, description: "Workshop end; must be > window_start" }
      - { name: price_cents, type: integer, source: input, description: "Money price per enrollment when billing_source = MONEY", constraints: ">= 0" }
      - { name: seats_taken, type: integer, source: computed, description: "Count of WorkshopEnrollments with status ENROLLED", default: 0 }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | LOCKED | COMPLETED | CANCELLED; initial DRAFT", constraints: "enum: DRAFT, OPEN, LOCKED, COMPLETED, CANCELLED" }

  - name: WorkshopEnrollment
    parent: Workshop
    common_fields: true
    fields:
      - { name: workshop_id, type: string, source: system, description: "FK -> Workshop.id; enrolled workshop" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; enrolled student" }
      - { name: status, type: enum, source: system, description: "ENROLLED | WAITLISTED | DROPPED | REFUNDED", constraints: "enum: ENROLLED, WAITLISTED, DROPPED, REFUNDED" }
      - { name: waitlist_position, type: integer, source: computed, description: "1-based position among WAITLISTED by created_at ASC; null unless status == WAITLISTED" }
      - { name: billing_source, type: enum, source: computed, description: "PACKAGE_CREDIT | MONEY | NONE (NONE while WAITLISTED)", constraints: "enum: PACKAGE_CREDIT, MONEY, NONE" }
      - { name: charged_cents, type: integer, source: computed, description: "Amount charged to family ledger (0 for PACKAGE_CREDIT/NONE)", default: 0 }

  - name: SupervisionRecord
    parent: Coach
    common_fields: true
    fields:
      - { name: coach_id, type: string, source: system, description: "FK -> Coach.id; supervisee coach" }
      - { name: supervisor_coach_id, type: string, source: input, description: "FK -> Coach.id; verifying supervisor; MUST differ from coach_id and hold credential_level SUPERVISOR" }
      - { name: scheduled_at, type: datetime, source: input, description: "Supervision session time" }
      - { name: hours, type: number, source: input, description: "Supervision hours credited", constraints: "> 0" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD | VERIFIED | CANCELLED; initial SCHEDULED", constraints: "enum: SCHEDULED, HELD, VERIFIED, CANCELLED" }
      - { name: verified_at, type: datetime, source: system, description: "Timestamp of VERIFIED transition; anchors the rolling 30-day window" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Family
    initial_state: INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /api/families/{id}/transition {to_state: ACTIVE}"
        actor: PracticeAdmin
        preconditions:
          - "At least one Client exists with family_id = this family (ERR_FAMILY_NO_CLIENTS)"
        side_effects:
          - "increments Family.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/families/{id}/transition {to_state: SUSPENDED} OR system auto-suspend when a cancellation/no-show fee charge leaves outstanding_balance_cents > DELINQUENCY_THRESHOLD_CENTS"
        actor: PracticeAdmin | system
        preconditions: []
        side_effects:
          - "Every CoachingPlan of every Client of this family with status ACTIVE: posture recomputed -> SCHEDULING_BLOCKED"
          - "increments Family.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/families/{id}/transition {to_state: ACTIVE}"
        actor: PracticeAdmin
        preconditions:
          - "outstanding_balance_cents <= DELINQUENCY_THRESHOLD_CENTS (ERR_FAMILY_DELINQUENT)"
        side_effects:
          - "Posture recompute for all ACTIVE plans of the family's clients"
          - "increments Family.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/families/{id}/transition {to_state: CLOSED}"
        actor: PracticeAdmin
        preconditions:
          - "No CoachingPlan of any Client of this family in status ACTIVE (ERR_FAMILY_HAS_ACTIVE_DEPENDENCIES)"
          - "No Package of this family in status ACTIVE (ERR_FAMILY_HAS_ACTIVE_DEPENDENCIES)"
          - "No WorkshopEnrollment of any Client of this family in status ENROLLED or WAITLISTED (ERR_FAMILY_HAS_ACTIVE_DEPENDENCIES)"
        side_effects:
          - "All Clients status IN {INTAKE, ACTIVE, PAUSED} -> DISCHARGED"
          - "All CoordinationContacts status ACTIVE -> INACTIVE"
          - "All ConsentGrants status IN {PENDING_SIGNATURE, ACTIVE} -> REVOKED; notes SHARED under them -> SEALED"
          - "increments Family.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /api/families/{id}/transition {to_state: CLOSED}"
        actor: PracticeAdmin
        preconditions:
          - "Same three dependency preconditions as ACTIVE -> CLOSED (ERR_FAMILY_HAS_ACTIVE_DEPENDENCIES)"
        side_effects:
          - "Same cascade as ACTIVE -> CLOSED"
          - "increments Family.version by 1"

  - entity: Client
    initial_state: INTAKE
    terminal_states: [DISCHARGED]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "system: first CoachingPlan acceptance for this client"
        actor: system
        preconditions: []
        side_effects:
          - "active_plan_id set to the newly ACTIVE plan"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /api/clients/{id}/transition {to_state: PAUSED}"
        actor: PracticeAdmin
        preconditions: []
        side_effects:
          - "ACTIVE plan posture recomputed -> SCHEDULING_BLOCKED"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /api/clients/{id}/transition {to_state: ACTIVE}"
        actor: PracticeAdmin
        preconditions:
          - "Family status == ACTIVE (ERR_FAMILY_NOT_ACTIVE)"
        side_effects:
          - "ACTIVE plan posture recomputed"
      - from: ACTIVE
        to: DISCHARGED
        trigger: "POST /api/clients/{id}/transition {to_state: DISCHARGED}"
        actor: PracticeAdmin
        preconditions:
          - "No CoachingPlan in status ACTIVE for this client (ERR_CLIENT_HAS_ACTIVE_PLAN)"
        side_effects:
          - "Sessions of this client's plans with attendance_state == SCHEDULED -> CANCELLED_EARLY; billing_state -> RETURNED; package reserved_count -= 1 each (reservations released)"
      - from: PAUSED
        to: DISCHARGED
        trigger: "POST /api/clients/{id}/transition {to_state: DISCHARGED}"
        actor: PracticeAdmin
        preconditions:
          - "No CoachingPlan in status ACTIVE for this client (ERR_CLIENT_HAS_ACTIVE_PLAN)"
        side_effects:
          - "Same session-release cascade as ACTIVE -> DISCHARGED"

  - entity: Coach
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: SUPERVISION_DEFICIT
        trigger: "system recompute (supervision_requirement) after plan accept/complete/terminate/supersede, supervision verify, or daily sweep"
        actor: system
        preconditions:
          - "verified_supervision_hours_30d < required_supervision_hours"
        side_effects:
          - "ACTIVE plans of this coach keep running; posture recompute does NOT block on deficit alone (deficit gates only NEW plan acceptance)"
      - from: SUPERVISION_DEFICIT
        to: AVAILABLE
        trigger: "system recompute when verified_supervision_hours_30d >= required_supervision_hours"
        actor: system
        preconditions: []
        side_effects: []
      - from: AVAILABLE
        to: INACTIVE
        trigger: "POST /api/coaches/{id}/transition {to_state: INACTIVE}"
        actor: PracticeAdmin
        preconditions:
          - "active_caseload == 0 (ERR_COACH_HAS_ACTIVE_PLANS)"
        side_effects:
          - "Posture recompute for DRAFT/PROPOSED plans of this coach"
      - from: SUPERVISION_DEFICIT
        to: INACTIVE
        trigger: "POST /api/coaches/{id}/transition {to_state: INACTIVE}"
        actor: PracticeAdmin
        preconditions:
          - "active_caseload == 0 (ERR_COACH_HAS_ACTIVE_PLANS)"
        side_effects: []
      - from: INACTIVE
        to: AVAILABLE
        trigger: "POST /api/coaches/{id}/transition {to_state: AVAILABLE}"
        actor: PracticeAdmin
        preconditions: []
        side_effects:
          - "Immediately recompute supervision_requirement; may flip straight to SUPERVISION_DEFICIT"

  - entity: IntakeAssessment
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/intakes/{id}/transition {to_state: SUBMITTED}"
        actor: FamilyMember
        preconditions:
          - "presenting_concerns non-empty and baseline_score present (ERR_VALIDATION)"
        side_effects: []
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/intakes/{id}/transition {to_state: UNDER_REVIEW}"
        actor: Coach
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/intakes/{id}/transition {to_state: APPROVED}"
        actor: Coach
        preconditions:
          - "Acting coach credential_level IN {CERTIFIED, SUPERVISOR} (ERR_CREDENTIAL_INSUFFICIENT)"
        side_effects: []
      - from: UNDER_REVIEW
        to: NEEDS_REVISION
        trigger: "POST /api/intakes/{id}/transition {to_state: NEEDS_REVISION, review_notes}"
        actor: Coach
        preconditions:
          - "review_notes provided (ERR_VALIDATION)"
        side_effects:
          - "review_notes stored"
      - from: NEEDS_REVISION
        to: DRAFT
        trigger: "POST /api/intakes/{id}/transition {to_state: DRAFT}"
        actor: FamilyMember
        preconditions: []
        side_effects:
          - "review_notes retained for family reference; cycle may repeat without limit"

  - entity: CoachingPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, TERMINATED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /api/plans/{id}/transition {to_state: PROPOSED}"
        actor: Coach
        preconditions:
          - "Acting coach is plan.coach_id (ERR_FORBIDDEN_SCOPE)"
          - "At least one Goal with status IN {SET, IN_PROGRESS} under this plan (ERR_GOALS_NOT_RESOLVED)"
          - "Referenced intake status == APPROVED (ERR_INTAKE_NOT_APPROVED)"
          - "plan.coach status != INACTIVE (ERR_INVALID_STATE)"
        side_effects: []
      - from: PROPOSED
        to: DRAFT
        trigger: "POST /api/plans/{id}/transition {to_state: DRAFT} (family requests changes — revision loop)"
        actor: FamilyMember
        preconditions:
          - "Acting family owns plan.client.family_id (ERR_FORBIDDEN_SCOPE)"
        side_effects: []
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /api/plans/{id}/transition {to_state: ACTIVE}"
        actor: FamilyMember
        preconditions:
          - "Acting family owns plan.client.family_id (ERR_FORBIDDEN_SCOPE)"
          - "Family status == ACTIVE (ERR_FAMILY_NOT_ACTIVE)"
          - "Client status IN {INTAKE, ACTIVE} (ERR_CLIENT_NOT_ACTIVE)"
          - "plan.coach status != INACTIVE (ERR_INVALID_STATE)"
          - "plan.coach status != SUPERVISION_DEFICIT (ERR_COACH_SUPERVISION_DEFICIT)"
          - "plan.coach.active_caseload < plan.coach.caseload_cap (ERR_CASELOAD_CAP_REACHED; strictly less — at cap is rejected)"
        side_effects:
          - "activated_at = now; posture recomputed"
          - "If client has another CoachingPlan in status ACTIVE: that plan -> SUPERSEDED; its Goals in {SET, IN_PROGRESS} -> CARRIED_FORWARD with carried_to_plan_id = this plan; its Sessions with attendance_state == SCHEDULED -> CANCELLED_EARLY with billing_state -> RETURNED (package reserved_count -= 1 per session, reservations released)"
          - "Client status INTAKE -> ACTIVE; client.active_plan_id = this plan"
          - "Coach active_caseload recomputed (+1); supervision_requirement recompute may flip coach AVAILABLE -> SUPERVISION_DEFICIT (post-accept; does not block this acceptance)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /api/plans/{id}/transition {to_state: COMPLETED}"
        actor: Coach
        preconditions:
          - "Acting coach is plan.coach_id (ERR_FORBIDDEN_SCOPE)"
          - "All Goals terminal: status IN {ACHIEVED, DROPPED, CARRIED_FORWARD} (ERR_GOALS_NOT_RESOLVED)"
          - "No Sessions with attendance_state == SCHEDULED (ERR_PLAN_HAS_OPEN_SESSIONS)"
        side_effects:
          - "client.active_plan_id = null"
          - "Coach active_caseload recomputed (-1); supervision_requirement recompute"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/plans/{id}/transition {to_state: TERMINATED}"
        actor: FamilyMember | PracticeAdmin
        preconditions: []
        side_effects:
          - "Sessions with attendance_state == SCHEDULED -> CANCELLED_EARLY, billing_state -> RETURNED (package reserved_count -= 1 per session)"
          - "Goals in {SET, IN_PROGRESS} -> DROPPED with resolved_at = now"
          - "client.active_plan_id = null; coach active_caseload recomputed (-1); supervision recompute"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system: a new CoachingPlan is created for the same client while this plan is DRAFT"
        actor: system
        preconditions: []
        side_effects:
          - "Goals are NOT carried (carry happens only on ACTIVE supersede)"
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system: a new CoachingPlan is created for the same client while this plan is PROPOSED"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a different CoachingPlan for the same client transitions PROPOSED -> ACTIVE"
        actor: system
        preconditions: []
        side_effects:
          - "Goals in {SET, IN_PROGRESS} -> CARRIED_FORWARD (carried_to_plan_id = new plan)"
          - "Sessions SCHEDULED -> CANCELLED_EARLY + billing RETURNED (credit-return cascade into Package)"

  - entity: Goal
    initial_state: SET
    terminal_states: [ACHIEVED, DROPPED, CARRIED_FORWARD]
    transitions:
      - from: SET
        to: IN_PROGRESS
        trigger: "POST /api/goals/{id}/transition {to_state: IN_PROGRESS}"
        actor: Coach
        preconditions:
          - "Owning plan status IN {DRAFT, PROPOSED, ACTIVE} (ERR_INVALID_STATE)"
        side_effects: []
      - from: SET
        to: ACHIEVED
        trigger: "POST /api/goals/{id}/transition {to_state: ACHIEVED}"
        actor: Coach
        preconditions:
          - "Owning plan status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
        side_effects:
          - "resolved_at = now"
      - from: IN_PROGRESS
        to: ACHIEVED
        trigger: "POST /api/goals/{id}/transition {to_state: ACHIEVED}"
        actor: Coach
        preconditions:
          - "Owning plan status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
        side_effects:
          - "resolved_at = now"
      - from: SET
        to: DROPPED
        trigger: "POST /api/goals/{id}/transition {to_state: DROPPED}"
        actor: Coach
        preconditions:
          - "Owning plan status IN {DRAFT, PROPOSED, ACTIVE} (ERR_INVALID_STATE)"
        side_effects:
          - "resolved_at = now"
      - from: IN_PROGRESS
        to: DROPPED
        trigger: "POST /api/goals/{id}/transition {to_state: DROPPED}"
        actor: Coach
        preconditions:
          - "Owning plan status IN {DRAFT, PROPOSED, ACTIVE} (ERR_INVALID_STATE)"
        side_effects:
          - "resolved_at = now"
      - from: SET
        to: CARRIED_FORWARD
        trigger: "system: owning ACTIVE plan is superseded by a newly accepted plan"
        actor: system
        preconditions: []
        side_effects:
          - "carried_to_plan_id = superseding plan id; resolved_at = now"
      - from: IN_PROGRESS
        to: CARRIED_FORWARD
        trigger: "system: owning ACTIVE plan is superseded by a newly accepted plan"
        actor: system
        preconditions: []
        side_effects:
          - "carried_to_plan_id = superseding plan id; resolved_at = now"

  - entity: Package
    initial_state: ACTIVE
    terminal_states: [REFUNDED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: credits_remaining reaches 0 after a consume/forfeit mutation"
        actor: system
        preconditions: []
        side_effects:
          - "Posture recompute for every ACTIVE CoachingPlan of the family's clients -> SCHEDULING_BLOCKED when no other ACTIVE INDIVIDUAL package with available credit exists"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system: credits_remaining rises above 0 via a returned GROUP enrollment credit (enrollment drop or workshop cancel against an EXHAUSTED package: credits_consumed -= 1)"
        actor: system
        preconditions: []
        side_effects:
          - "Posture recompute for the family's ACTIVE plans"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: daily sweep when now >= expires_at AND credits_remaining > 0"
        actor: system
        preconditions: []
        side_effects:
          - "Sessions RESERVED against this package stay RESERVED but no new reservations allowed; posture recompute for family's ACTIVE plans"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: daily sweep when now >= expires_at AND credits_remaining == 0 routes to EXHAUSTED instead (see next transition)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Expiry with zero remaining credits transitions ACTIVE -> EXHAUSTED, not EXPIRED"
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system: daily sweep when now >= expires_at AND credits_remaining == 0"
        actor: system
        preconditions: []
        side_effects:
          - "Posture recompute for family's ACTIVE plans"
      - from: ACTIVE
        to: REFUNDED
        trigger: "POST /api/packages/{id}/refund"
        actor: PracticeAdmin
        preconditions:
          - "Family status != CLOSED (ERR_FAMILY_NOT_ACTIVE)"
        side_effects:
          - "refund = credit_refund_value FINAL variant; family.total_refunded_cents += refund"
          - "Sessions still RESERVED against this package -> CANCELLED_EARLY + billing_state RETURNED (reserved_count released); INV-CREDITS no longer enforced after REFUNDED"
          - "Posture recompute for family's ACTIVE plans; family billing_status recompute (refund may clear DELINQUENT)"
      - from: EXPIRED
        to: REFUNDED
        trigger: "POST /api/packages/{id}/refund"
        actor: PracticeAdmin
        preconditions:
          - "Family status != CLOSED (ERR_FAMILY_NOT_ACTIVE)"
        side_effects:
          - "Same refund computation (FINAL variant) and ledger side effects as ACTIVE -> REFUNDED"

  - entity: Session
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED_EARLY, CANCELLED_LATE, NO_SHOW]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/sessions/{id}/complete"
        actor: Coach
        preconditions:
          - "Acting coach is session.coach_id (ERR_FORBIDDEN_SCOPE)"
          - "now >= scheduled_start (ERR_SESSION_NOT_STARTED)"
        side_effects:
          - "attendance_state COMPLETED; billing_state RESERVED -> CONSUMED; resolved_at = now"
          - "package.credits_consumed += 1; package.reserved_count -= 1; package status recompute (may flip ACTIVE -> EXHAUSTED)"
          - "plan posture recompute; family billing recompute not affected"
      - from: SCHEDULED
        to: CANCELLED_EARLY
        trigger: "POST /api/sessions/{id}/cancel when cancellation_charge notice tier == FREE (notice >= 24h) OR system cascades (plan supersede/terminate, client discharge, package refund)"
        actor: FamilyMember | Coach | system
        preconditions:
          - "Manual cancel: now < scheduled_start (ERR_SESSION_ALREADY_STARTED)"
        side_effects:
          - "billing_state RESERVED -> RETURNED; cancellation_fee_cents = 0; resolved_at = now"
          - "package.reserved_count -= 1 (reservation released; credits_remaining is never decremented at reserve time); package status recompute"
          - "plan posture recompute"
      - from: SCHEDULED
        to: CANCELLED_LATE
        trigger: "POST /api/sessions/{id}/cancel when notice < 24h"
        actor: FamilyMember | Coach
        preconditions:
          - "now < scheduled_start (ERR_SESSION_ALREADY_STARTED)"
        side_effects:
          - "billing_state RESERVED -> FORFEITED; resolved_at = now"
          - "package.credits_forfeited += 1; package.reserved_count -= 1; package status recompute"
          - "cancellation_fee_cents = cancellation_charge (50% tier when 4h <= notice < 24h; 100% tier when notice < 4h)"
          - "family.total_charged_cents += cancellation_fee_cents; outstanding recompute; if billing_status flips to DELINQUENT -> family auto-SUSPENDED cascade -> plan postures SCHEDULING_BLOCKED"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /api/sessions/{id}/mark-no-show"
        actor: Coach
        preconditions:
          - "Acting coach is session.coach_id (ERR_FORBIDDEN_SCOPE)"
          - "now >= scheduled_start (ERR_SESSION_NOT_STARTED)"
        side_effects:
          - "billing_state RESERVED -> FORFEITED; cancellation_fee_cents = 100% tier (= package.per_credit_value_cents); resolved_at = now"
          - "package.credits_forfeited += 1; package.reserved_count -= 1; package status recompute (may flip ACTIVE -> EXHAUSTED -> plan posture SCHEDULING_BLOCKED)"
          - "family.total_charged_cents += cancellation_fee_cents; delinquency auto-suspend cascade applies"

  - entity: CheckIn
    initial_state: PENDING
    terminal_states: [MISSED, ACKNOWLEDGED]
    transitions:
      - from: PENDING
        to: SUBMITTED_ON_TIME
        trigger: "POST /api/checkins/{id}/submit when now <= due_at (boundary inclusive)"
        actor: FamilyMember
        preconditions:
          - "Owning plan status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "now <= due_at + CHECKIN_GRACE_HOURS (72h) else ERR_CHECKIN_EXPIRED"
        side_effects:
          - "submitted_at = now; client.checkin_streak += 1"
      - from: PENDING
        to: SUBMITTED_LATE
        trigger: "POST /api/checkins/{id}/submit when due_at < now <= due_at + 72h"
        actor: FamilyMember
        preconditions:
          - "Owning plan status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
        side_effects:
          - "submitted_at = now; client.checkin_streak = 0"
      - from: PENDING
        to: MISSED
        trigger: "system: daily sweep when now > due_at + 72h"
        actor: system
        preconditions: []
        side_effects:
          - "client.checkin_streak = 0"
      - from: SUBMITTED_ON_TIME
        to: ACKNOWLEDGED
        trigger: "POST /api/checkins/{id}/acknowledge"
        actor: Coach
        preconditions:
          - "Acting coach is owning plan.coach_id (ERR_FORBIDDEN_SCOPE)"
        side_effects: []
      - from: SUBMITTED_LATE
        to: ACKNOWLEDGED
        trigger: "POST /api/checkins/{id}/acknowledge"
        actor: Coach
        preconditions:
          - "Acting coach is owning plan.coach_id (ERR_FORBIDDEN_SCOPE)"
        side_effects: []

  - entity: CoordinationContact
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /api/contacts/{id}/transition {to_state: INACTIVE}"
        actor: FamilyMember
        preconditions:
          - "Acting family owns contact.family_id (ERR_FORBIDDEN_SCOPE)"
        side_effects:
          - "ConsentGrants with contact_id = this contact and status IN {PENDING_SIGNATURE, ACTIVE} -> REVOKED; CoordinationNotes SHARED to this contact -> SEALED (depth-2 cascade)"

  - entity: ConsentGrant
    initial_state: PENDING_SIGNATURE
    terminal_states: [REVOKED, EXPIRED, SUPERSEDED]
    transitions:
      - from: PENDING_SIGNATURE
        to: ACTIVE
        trigger: "POST /api/consents/{id}/transition {to_state: ACTIVE}"
        actor: FamilyMember
        preconditions:
          - "Acting family owns consent.family_id (ERR_FORBIDDEN_SCOPE)"
          - "now < expires_at (ERR_CONSENT_EXPIRED)"
        side_effects:
          - "signed_at = now"
      - from: PENDING_SIGNATURE
        to: REVOKED
        trigger: "POST /api/consents/{id}/transition {to_state: REVOKED}"
        actor: FamilyMember
        preconditions:
          - "Acting family owns consent.family_id (ERR_FORBIDDEN_SCOPE)"
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/consents/{id}/transition {to_state: REVOKED}"
        actor: FamilyMember
        preconditions:
          - "Acting family owns consent.family_id (ERR_FORBIDDEN_SCOPE)"
        side_effects:
          - "CoordinationNotes with shared_with_contact_id == consent.contact_id and status == SHARED -> SEALED"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: daily sweep when now >= expires_at"
        actor: system
        preconditions: []
        side_effects:
          - "Same note-sealing cascade as ACTIVE -> REVOKED"
      - from: PENDING_SIGNATURE
        to: SUPERSEDED
        trigger: "system: a new ConsentGrant is created for the same contact_id"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: a new ConsentGrant is created for the same contact_id"
        actor: system
        preconditions: []
        side_effects:
          - "Same note-sealing cascade as ACTIVE -> REVOKED"

  - entity: CoordinationNote
    initial_state: DRAFT
    terminal_states: [SEALED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /api/notes/{id}/transition {to_state: FINALIZED}"
        actor: Coach
        preconditions:
          - "Acting coach is note.author_coach_id (ERR_FORBIDDEN_SCOPE)"
        side_effects: []
      - from: FINALIZED
        to: SHARED
        trigger: "POST /api/notes/{id}/share {contact_id}"
        actor: Coach
        preconditions:
          - "Acting coach is note.author_coach_id (ERR_FORBIDDEN_SCOPE)"
          - "contact status == ACTIVE (ERR_INVALID_STATE)"
          - "ACTIVE ConsentGrant exists for (note.client.family_id, contact_id) (ERR_CONSENT_NOT_ACTIVE)"
          - "Consent scope covers note.topic per coverage table (ERR_CONSENT_SCOPE_INSUFFICIENT)"
          - "contact.family_id == note.client.family_id (ERR_CONTACT_NOT_LINKED)"
        side_effects:
          - "shared_with_contact_id = contact_id; shared_at = now"
      - from: FINALIZED
        to: SEALED
        trigger: "system: consent revocation/expiry/supersede cascade can only seal SHARED notes; FINALIZED notes may also be sealed by family close cascade"
        actor: system
        preconditions: []
        side_effects: []
      - from: SHARED
        to: SEALED
        trigger: "system: consent covering the share leaves ACTIVE (revoked, expired, superseded, or contact deactivated, or family closed)"
        actor: system
        preconditions: []
        side_effects:
          - "Note immediately disappears from GET /api/contacts/{id}/shared-notes"

  - entity: Workshop
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /api/workshops/{id}/transition {to_state: OPEN}"
        actor: PracticeAdmin
        preconditions:
          - "coach status != INACTIVE (ERR_INVALID_STATE)"
          - "window_start strictly in the future (ERR_SESSION_IN_PAST)"
        side_effects: []
      - from: OPEN
        to: LOCKED
        trigger: "POST /api/workshops/{id}/transition {to_state: LOCKED}"
        actor: PracticeAdmin
        preconditions: []
        side_effects:
          - "Roster frozen: enrollment creation and drops rejected while LOCKED (ERR_INVALID_STATE)"
      - from: LOCKED
        to: COMPLETED
        trigger: "POST /api/workshops/{id}/transition {to_state: COMPLETED}"
        actor: PracticeAdmin
        preconditions:
          - "now >= window_end (ERR_WORKSHOP_WINDOW_NOT_ENDED)"
        side_effects:
          - "WAITLISTED enrollments -> DROPPED (positions cleared)"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/workshops/{id}/transition {to_state: CANCELLED}"
        actor: PracticeAdmin
        preconditions: []
        side_effects:
          - "Every ENROLLED enrollment -> REFUNDED: billing_source MONEY -> family.total_refunded_cents += charged_cents; billing_source PACKAGE_CREDIT -> 1 credit returned to the family's GROUP package if that package status == ACTIVE (credits_consumed -= 1, credits_remaining += 1; status recompute), else no compensation"
          - "Every WAITLISTED enrollment -> DROPPED"
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /api/workshops/{id}/transition {to_state: CANCELLED}"
        actor: PracticeAdmin
        preconditions: []
        side_effects:
          - "Same refund cascade as OPEN -> CANCELLED"

  - entity: WorkshopEnrollment
    initial_state: ENROLLED
    terminal_states: [DROPPED, REFUNDED]
    transitions:
      - from: ENROLLED
        to: DROPPED
        trigger: "POST /api/enrollments/{id}/drop"
        actor: FamilyMember
        preconditions:
          - "Acting family owns enrollment.client.family_id (ERR_FORBIDDEN_SCOPE)"
          - "Workshop status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "billing_source MONEY: if now <= window_start - WORKSHOP_REFUND_WINDOW_DAYS (7d) (inclusive) -> family.total_refunded_cents += charged_cents; else no refund"
          - "billing_source PACKAGE_CREDIT: 1 credit returned if the GROUP package status == ACTIVE (credits_consumed -= 1, credits_remaining += 1), regardless of refund window"
          - "workshop.seats_taken -= 1; then waitlist promotion: WAITLISTED enrollment with earliest created_at -> ENROLLED; its billing computed by workshop_enrollment_billing (charge or credit consume); positions recomputed by created_at ASC"
      - from: WAITLISTED
        to: DROPPED
        trigger: "POST /api/enrollments/{id}/drop"
        actor: FamilyMember
        preconditions:
          - "Acting family owns enrollment.client.family_id (ERR_FORBIDDEN_SCOPE)"
          - "Workshop status == OPEN (ERR_INVALID_STATE)"
        side_effects:
          - "No refund (never charged); waitlist_position cleared; remaining positions recomputed"
      - from: WAITLISTED
        to: ENROLLED
        trigger: "system: promotion when a seat frees (ENROLLED drop) and workshop status == OPEN"
        actor: system
        preconditions: []
        side_effects:
          - "waitlist_position cleared; billing computed (PACKAGE_CREDIT consume or MONEY charge); seats_taken += 1"
      - from: ENROLLED
        to: REFUNDED
        trigger: "system: workshop cancel cascade"
        actor: system
        preconditions: []
        side_effects:
          - "Refund per billing_source as in workshop cancel transition"
      - from: WAITLISTED
        to: DROPPED
        trigger: "system: workshop cancel or complete cascade"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SupervisionRecord
    initial_state: SCHEDULED
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: HELD
        trigger: "POST /api/supervision-records/{id}/transition {to_state: HELD}"
        actor: Coach
        preconditions:
          - "Acting coach is record.supervisor_coach_id (ERR_FORBIDDEN_SCOPE) — segregation of duties: the supervisee cannot mark their own record"
        side_effects: []
      - from: HELD
        to: VERIFIED
        trigger: "POST /api/supervision-records/{id}/transition {to_state: VERIFIED}"
        actor: PracticeAdmin
        preconditions: []
        side_effects:
          - "verified_at = now; coach.verified_supervision_hours_30d recompute; supervision_requirement recompute may flip SUPERVISION_DEFICIT -> AVAILABLE"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/supervision-records/{id}/transition {to_state: CANCELLED}"
        actor: PracticeAdmin
        preconditions: []
        side_effects: []
      - from: HELD
        to: CANCELLED
        trigger: "POST /api/supervision-records/{id}/transition {to_state: CANCELLED}"
        actor: PracticeAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-client
    parent_entity: Client
    write_endpoint: "POST /api/clients/{id}/plans"
    occ_field: "expected_client_version"
    description: |
      Creating a CoachingPlan for a Client whose version has advanced since the
      caller last observed it is rejected. Creating a plan legitimately
      supersedes the client's existing non-terminal plan (DRAFT/PROPOSED ->
      SUPERSEDED), so a writer holding a stale view of the client must re-read
      before drafting; the OCC check on Client.version is the guard.
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
  - rule_id: consent-create-stale-family
    parent_entity: Family
    write_endpoint: "POST /api/families/{id}/consents"
    occ_field: "expected_family_version"
    description: |
      Creating a ConsentGrant for a Family whose version has advanced since the
      caller last observed it is rejected. Creating a consent for a contact that
      already has a non-terminal grant legitimately supersedes that grant
      (PENDING_SIGNATURE/ACTIVE -> SUPERSEDED, sealing notes shared under it),
      so the OCC check on Family.version guards writers acting on a stale view.
    error_id: ERR_STALE_FAMILY_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: package_pricing
    trigger: "POST /api/families/{id}/packages (at purchase; result frozen on the Package row)"
    algorithm: tiered_pricing
    formula: |
      tier_rate(c) = 15000 if c <= 8; 13500 if 9 <= c <= 16; 12000 if c >= 17
      track_mult = 1.00 if track == INDIVIDUAL; 0.60 if track == GROUP
      unit_gross_cents = round_half_up(tier_rate(credits_total) * track_mult)     # step 1
      subtotal = unit_gross_cents * credits_total                                  # step 2
      sibling_count = count of Client with family_id = family AND status IN {INTAKE, ACTIVE, PAUSED}
      if sibling_count >= 2: subtotal = round_half_up(subtotal * 0.90)             # step 3
      price_paid_cents = subtotal + MATERIALS_FEE_CENTS                            # step 4 (fee NOT discounted)
      per_credit_value_cents = round_half_up(price_paid_cents / credits_total)     # step 5
    input_set: "Package being purchased; sibling set = all Clients of the family with status IN {INTAKE, ACTIVE, PAUSED} at purchase time"
    constants:
      TIER1_MAX_CREDITS: 8
      TIER1_RATE_CENTS: 15000
      TIER2_MAX_CREDITS: 16
      TIER2_RATE_CENTS: 13500
      TIER3_RATE_CENTS: 12000
      GROUP_TRACK_MULTIPLIER: 0.60
      SIBLING_DISCOUNT_PCT: 0.10
      SIBLING_MIN_CLIENTS: 2
      MATERIALS_FEE_CENTS: 2500
    precision: "integer cents; round_half_up at steps 1, 3, 5; multiplication at steps 2 and 4 on already-rounded integers"
    variants: []

  - name: credit_refund_value
    trigger: "PROVISIONAL variant: on every Package read (displayed value). FINAL variant: POST /api/packages/{id}/refund"
    algorithm: aggregation
    formula: |
      PROVISIONAL: refund = credits_remaining * per_credit_value_cents
        # per-credit rounding FIRST (round_half_up at purchase), then multiply — pinned order
      FINAL: refund = max(0, price_paid_cents - (credits_consumed + credits_forfeited) * unit_gross_cents)
        # consumed+forfeited credits re-priced at GROSS unit (sibling discount clawed back, materials fee never refunded)
    input_set: "The Package row being read or refunded"
    constants: {}
    precision: "integer cents; per-credit round_half_up before multiplication in PROVISIONAL"
    variants:
      - name: PROVISIONAL
        when: "Read-time estimate of refundable value"
        difference: "remaining x rounded per-credit value; ignores clawback; differs from FINAL whenever sibling discount applied or division had a remainder"
      - name: FINAL
        when: "Actual refund at POST /api/packages/{id}/refund"
        difference: "price_paid minus consumed/forfeited re-priced at unit_gross_cents; discount clawed back on used credits"

  - name: cancellation_charge
    trigger: "POST /api/sessions/{id}/cancel and POST /api/sessions/{id}/mark-no-show"
    algorithm: threshold
    formula: |
      notice_seconds = scheduled_start - now
      if notice_seconds >= 24*3600:      tier = FREE;   fee = 0; attendance = CANCELLED_EARLY; billing = RETURNED
      elif notice_seconds >= 4*3600:     tier = HALF;   fee = round_half_up(0.50 * package.per_credit_value_cents); attendance = CANCELLED_LATE; billing = FORFEITED
      else (including mark-no-show):     tier = FULL;   fee = package.per_credit_value_cents; attendance = CANCELLED_LATE or NO_SHOW; billing = FORFEITED
      # boundaries inclusive: exactly 24h00m00s -> FREE; exactly 4h00m00s -> HALF
      # nested rounding pinned: per_credit_value_cents already rounded at purchase; fee rounds AGAIN half-up
    input_set: "The Session being cancelled/no-showed and its Package.per_credit_value_cents"
    constants:
      FREE_NOTICE_HOURS: 24
      HALF_NOTICE_HOURS: 4
      HALF_FEE_PCT: 0.50
    precision: "integer cents; round_half_up"
    variants: []

  - name: progress_index
    trigger: "POST /api/clients/{id}/progress-snapshots (writes one ProgressSnapshot with both variants)"
    algorithm: weighted_scoring
    formula: |
      goal_rate = goals_achieved / goals_considered          # null when goals_considered == 0
      checkin_rate = checkins_on_time / checkins_considered  # null when checkins_considered == 0
      if both null: index = null
      elif one null: index = round_half_up(100 * the_other_rate)        # weight renormalized to the present component
      else: index = round_half_up(100 * (0.6 * goal_rate + 0.4 * checkin_rate))
      ROLLING_28D variant: window [now - 28d, now], inclusive both ends;
        goals counted when resolved_at in window; check-ins counted when they left PENDING with resolution timestamp in window
      CUMULATIVE variant: same components over ALL goals/check-ins of the client's CURRENT ACTIVE plan (any timestamp);
        null when client has no ACTIVE plan or no data
      side rule: after snapshot, if the last two snapshots (by created_at ASC) both have rolling_index != null and < 40,
        set the ACTIVE plan's revision_recommended = true
    input_set: "Goals and CheckIns of the client's ACTIVE plan; window filter for ROLLING_28D"
    constants:
      GOAL_WEIGHT: 0.6
      CHECKIN_WEIGHT: 0.4
      ROLLING_WINDOW_DAYS: 28
      REVISION_TRIGGER_THRESHOLD: 40
      REVISION_TRIGGER_CONSECUTIVE: 2
    precision: "integer index 0..100; round_half_up"
    variants:
      - name: ROLLING_28D
        when: "Stored as rolling_index on the snapshot"
        difference: "Only events whose resolution timestamp falls in [now-28d, now] are counted"
      - name: CUMULATIVE
        when: "Stored as cumulative_index on the same snapshot from identical underlying rows"
        difference: "All events under the current ACTIVE plan regardless of age; same data yields a different number whenever any event lies outside the rolling window"

  - name: supervision_requirement
    trigger: "recompute after: plan accept/complete/terminate/supersede (caseload change), SupervisionRecord VERIFIED (hours change), daily sweep (window slide), coach reactivate"
    algorithm: constraint_propagation
    formula: |
      # Pinned evaluation order (the dependency looks circular; it is not):
      # (1) active_caseload = count of CoachingPlans status == ACTIVE with coach_id = coach
      # (2) required_supervision_hours = floor(active_caseload / SUPERVISION_DIVISOR[credential_level])
      # (3) verified_supervision_hours_30d = sum hours of SupervisionRecords status VERIFIED, verified_at in [now-30d, now] inclusive
      # (4) deficit = verified_supervision_hours_30d < required_supervision_hours   (strict <)
      # (5) if deficit AND coach.status == AVAILABLE -> SUPERVISION_DEFICIT; if NOT deficit AND status == SUPERVISION_DEFICIT -> AVAILABLE
      # (6) SUPERVISION_DEFICIT gates only NEW plan acceptance (ERR_COACH_SUPERVISION_DEFICIT); existing ACTIVE plans unaffected
    input_set: "Coach row; its CoachingPlans; its SupervisionRecords in the rolling 30-day window"
    constants:
      SUPERVISION_DIVISOR_ASSOCIATE: 2
      SUPERVISION_DIVISOR_CERTIFIED: 4
      SUPERVISION_DIVISOR_SUPERVISOR: 6
      SUPERVISION_WINDOW_DAYS: 30
      CASELOAD_CAP_ASSOCIATE: 12
      CASELOAD_CAP_CERTIFIED: 20
      CASELOAD_CAP_SUPERVISOR: 28
    precision: "hours as decimal; required hours integer via floor"
    variants: []

  - name: cadence_window_check
    trigger: "POST /api/plans/{id}/sessions"
    algorithm: threshold
    formula: |
      let last = scheduled_start of the plan's most recent Session with attendance_state IN {SCHEDULED, COMPLETED, NO_SHOW}
            (CANCELLED_EARLY / CANCELLED_LATE do NOT reset the cadence anchor), tie-break: latest created_at
      gap_days = (scheduled_start(new) - last) / 86400, compared on exact seconds
      WEEKLY:   first session must start within [0, 14] days of plan.activated_at; subsequent: gap_days IN [4, 10] inclusive
      BIWEEKLY: first session within [0, 14] days of activated_at; subsequent: gap_days IN [11, 17] inclusive
      violation -> ERR_CADENCE_WINDOW_VIOLATION
    input_set: "Sessions of the plan with attendance_state IN {SCHEDULED, COMPLETED, NO_SHOW}"
    constants:
      WEEKLY_MIN_GAP_DAYS: 4
      WEEKLY_MAX_GAP_DAYS: 10
      BIWEEKLY_MIN_GAP_DAYS: 11
      BIWEEKLY_MAX_GAP_DAYS: 17
      FIRST_SESSION_MAX_DAYS: 14
    precision: "second-exact comparison; day boundaries inclusive"
    variants: []

  - name: coach_schedule_conflict
    trigger: "POST /api/plans/{id}/sessions"
    algorithm: interval_merge
    formula: |
      Rule A (half-open overlap, adjacency allowed):
        conflict iff exists Session S with S.coach_id == plan.coach_id AND S.attendance_state == SCHEDULED
          AND new.start < S.end AND new.end > S.start
        -> ERR_COACH_DOUBLE_BOOKED (back-to-back end == start is ALLOWED)
      Rule B (buffered overlap vs workshops the coach facilitates):
        conflict iff exists Workshop W with W.coach_id == plan.coach_id AND W.status IN {OPEN, LOCKED}
          AND new.start < W.window_end + WORKSHOP_BUFFER_MINUTES
          AND new.end   > W.window_start - WORKSHOP_BUFFER_MINUTES
        -> ERR_COACH_BUFFER_CONFLICT (exactly 15 minutes clear is ALLOWED: comparison is strict)
    input_set: "Coach's SCHEDULED sessions; coach's OPEN/LOCKED workshops"
    constants:
      WORKSHOP_BUFFER_MINUTES: 15
    precision: "second-exact; half-open for sessions, strict-buffer for workshops"
    variants: []

  - name: workshop_enrollment_billing
    trigger: "POST /api/workshops/{id}/enrollments and waitlist promotion (system)"
    algorithm: waterfall_allocation
    formula: |
      candidate = family's Packages with track == GROUP AND status == ACTIVE AND credits_remaining >= 1
      selector: earliest expires_at; tie-break: earliest created_at
      if candidate exists: billing_source = PACKAGE_CREDIT; candidate.credits_consumed += 1 (status recompute); charged_cents = 0
      else: billing_source = MONEY; charged_cents = workshop.price_cents; family.total_charged_cents += charged_cents (delinquency recompute)
    input_set: "Family's GROUP-track ACTIVE packages; workshop price"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: delinquency_evaluation
    trigger: "billing_status is recomputed after every ledger mutation; the auto-SUSPEND check runs ONLY after cancellation-fee / no-show-fee charges (packages and enrollments are prepaid and never auto-suspend)"
    algorithm: threshold
    formula: |
      outstanding_balance_cents = total_charged_cents - total_refunded_cents - total_paid_cents
      billing_status = DELINQUENT iff outstanding_balance_cents > DELINQUENCY_THRESHOLD_CENTS (strict >; exactly 20000 is CURRENT)
      after a fee charge (CANCELLED_LATE / NO_SHOW only): if outstanding_balance_cents > DELINQUENCY_THRESHOLD_CENTS
        AND family.status == ACTIVE: family auto-transition ACTIVE -> SUSPENDED
        (cascade: ACTIVE plans of family's clients -> posture SCHEDULING_BLOCKED)
      INV-MONEY: outstanding_balance_cents == total_charged_cents - total_refunded_cents - total_paid_cents must hold after every mutation
    input_set: "Family ledger counters"
    constants:
      DELINQUENCY_THRESHOLD_CENTS: 20000
    precision: "integer cents"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is one of PracticeAdmin, Coach, FamilyMember, ExternalContact"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: FamilyMember X-User-ID must equal the path family's id (or the owning family of the path resource); Coach X-User-ID must equal the owning plan's coach_id / note.author_coach_id / supervision supervisor_coach_id as the transition requires; ExternalContact X-User-ID must equal the path contact id"
    error_id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    applies_to: "all scoped endpoints"
  - priority: 4
    category: existence
    check: "Path ids and body-referenced ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present, enum members valid, ranges valid (baseline_score 0..100, credits_total >= 1, capacity >= 1, hours > 0, scheduled_end > scheduled_start, session duration <= 120 minutes, due_at/expires_at/window_start in future where required)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_client_version == Client.version on POST /clients/{id}/plans; expected_family_version == Family.version on POST /families/{id}/consents"
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
    applies_to: "POST /api/clients/{id}/plans"
  - priority: 7
    category: state
    check: "OCC: expected_family_version == Family.version"
    error_id: ERR_STALE_FAMILY_VERSION
    http_status: 412
    applies_to: "POST /api/families/{id}/consents"
  - priority: 8
    category: state
    check: "Family status gate: family must be ACTIVE for plan acceptance, package purchase, session scheduling, enrollment, payments accepted any time except CLOSED"
    error_id: ERR_FAMILY_NOT_ACTIVE
    http_status: 409
    applies_to: "plan transition ACTIVE, POST /families/{id}/packages, POST /plans/{id}/sessions, POST /workshops/{id}/enrollments"
  - priority: 9
    category: state
    check: "Client status gate: client must be ACTIVE for session scheduling and workshop enrollment; INTAKE or ACTIVE for plan acceptance"
    error_id: ERR_CLIENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /plans/{id}/sessions, POST /workshops/{id}/enrollments, plan transition ACTIVE"
  - priority: 10
    category: state
    check: "Plan status gate: plan must be ACTIVE for session scheduling, check-in creation/submission, goal ACHIEVED; transition-specific from-state enforced per §1.2 (generic ERR_INVALID_STATE for impossible from-states and terminal-state writes)"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /plans/{id}/sessions, POST /plans/{id}/checkins, POST /checkins/{id}/submit, goal transitions"
  - priority: 11
    category: state
    check: "Intake must be APPROVED at plan creation and plan proposal"
    error_id: ERR_INTAKE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /clients/{id}/plans, plan transition PROPOSED"
  - priority: 12
    category: state
    check: "Package must be ACTIVE for session scheduling (EXPIRED/EXHAUSTED/REFUNDED reject)"
    error_id: ERR_PACKAGE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /plans/{id}/sessions"
  - priority: 13
    category: state
    check: "Workshop must be OPEN for enrollment creation and drops"
    error_id: ERR_WORKSHOP_NOT_OPEN
    http_status: 409
    applies_to: "POST /workshops/{id}/enrollments, POST /enrollments/{id}/drop"
  - priority: 14
    category: state
    check: "Session must be SCHEDULED for complete/cancel/mark-no-show; CheckIn must be PENDING for submit and SUBMITTED_* for acknowledge; Note must be FINALIZED for share; generic invalid-from on every other transition endpoint"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 15
    category: state
    check: "Aggregate state gates: ERR_GOALS_NOT_RESOLVED (propose without goals; complete with non-terminal goals), ERR_PLAN_HAS_OPEN_SESSIONS (complete with SCHEDULED sessions), ERR_FAMILY_HAS_ACTIVE_DEPENDENCIES, ERR_CLIENT_HAS_ACTIVE_PLAN, ERR_COACH_HAS_ACTIVE_PLANS, ERR_FAMILY_DELINQUENT (reactivate over threshold), ERR_FAMILY_NO_CLIENTS (activate with zero clients), ERR_PACKAGE_NOT_REFUNDABLE (refund from EXHAUSTED/REFUNDED), ERR_ENROLLMENT_NOT_DROPPABLE (drop from DROPPED/REFUNDED), ERR_CONSENT_EXPIRED (sign after expires_at)"
    error_id: ERR_GOALS_NOT_RESOLVED
    http_status: 409
    applies_to: "transition endpoints as listed in §1.2 preconditions"
  - priority: 16
    category: business_safety
    check: "Consent gate for note sharing: ACTIVE ConsentGrant for (family, contact) must exist (ERR_CONSENT_NOT_ACTIVE); its scope must cover the note topic per coverage table (ERR_CONSENT_SCOPE_INSUFFICIENT)"
    error_id: ERR_CONSENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /notes/{id}/share"
  - priority: 17
    category: business_safety
    check: "Consent scope coverage: PROGRESS_ONLY covers PROGRESS; GOALS_AND_PROGRESS covers PROGRESS+GOALS; FULL_PLAN covers all topics"
    error_id: ERR_CONSENT_SCOPE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /notes/{id}/share"
  - priority: 18
    category: business_temporal
    check: "Cadence window per cadence_window_check (first-session window, gap bounds inclusive)"
    error_id: ERR_CADENCE_WINDOW_VIOLATION
    http_status: 422
    applies_to: "POST /plans/{id}/sessions"
  - priority: 19
    category: business_temporal
    check: "Session timing: scheduled_start must be future at creation (ERR_SESSION_IN_PAST); cancel requires now < scheduled_start (ERR_SESSION_ALREADY_STARTED); complete/no-show require now >= scheduled_start (ERR_SESSION_NOT_STARTED); check-in submit after due_at+72h (ERR_CHECKIN_EXPIRED); workshop complete before window_end (ERR_WORKSHOP_WINDOW_NOT_ENDED)"
    error_id: ERR_SESSION_IN_PAST
    http_status: 422
    applies_to: "session, check-in, workshop endpoints"
  - priority: 20
    category: business_constraint
    check: "Coach schedule conflicts: half-open session overlap (ERR_COACH_DOUBLE_BOOKED) and 15-minute buffered workshop conflict (ERR_COACH_BUFFER_CONFLICT) per coach_schedule_conflict"
    error_id: ERR_COACH_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /plans/{id}/sessions"
  - priority: 21
    category: business_constraint
    check: "Credential and segregation rules: intake approval requires CERTIFIED or SUPERVISOR (ERR_CREDENTIAL_INSUFFICIENT); supervision supervisor must hold credential_level SUPERVISOR (ERR_CREDENTIAL_INSUFFICIENT); supervisor_coach_id != coach_id (ERR_SELF_SUPERVISION); duplicate non-terminal enrollment for (workshop, client) (ERR_DUPLICATE_ENROLLMENT)"
    error_id: ERR_CREDENTIAL_INSUFFICIENT
    http_status: 403
    applies_to: "intake APPROVED transition, POST /coaches/{id}/supervision-records, POST /workshops/{id}/enrollments"
  - priority: 22
    category: business_referential
    check: "Linkage: note share contact.family_id must equal note client's family (ERR_CONTACT_NOT_LINKED); consent contact must belong to the path family (ERR_CONTACT_NOT_LINKED); plan intake must belong to the path client (ERR_INTAKE_CLIENT_MISMATCH); session package.track must be INDIVIDUAL (ERR_TRACK_MISMATCH); enrollment client.track must be GROUP or HYBRID (ERR_TRACK_MISMATCH)"
    error_id: ERR_CONTACT_NOT_LINKED
    http_status: 422
    applies_to: "POST /notes/{id}/share, POST /families/{id}/consents, POST /clients/{id}/plans, POST /plans/{id}/sessions, POST /workshops/{id}/enrollments"
  - priority: 23
    category: business_fiscal
    check: "Credit availability: package.credits_remaining - package.reserved_count >= 1 for session scheduling"
    error_id: ERR_NO_CREDITS_AVAILABLE
    http_status: 422
    applies_to: "POST /plans/{id}/sessions"
  - priority: 24
    category: business_fiscal
    check: "Coach capacity: active_caseload < caseload_cap at plan acceptance (strictly less; equal-to-cap rejects)"
    error_id: ERR_CASELOAD_CAP_REACHED
    http_status: 422
    applies_to: "plan transition ACTIVE"
  - priority: 25
    category: business_fiscal
    check: "Coach supervision posture: coach.status must not be SUPERVISION_DEFICIT at plan acceptance"
    error_id: ERR_COACH_SUPERVISION_DEFICIT
    http_status: 422
    applies_to: "plan transition ACTIVE"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock & ops sweep (test-driving / ops) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Sets the server's logical clock. Startup default (before any call) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time; every deadline, expiry, notice window, and rolling window reads this clock."
    roles: [PracticeAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["No entity mutation; all time-dependent rules re-evaluate against the new clock on next read/sweep"]

  - method: POST
    path: "/api/admin/run-daily-sweep"
    description: "Ops-run checkpoint. Fixed order: (1) packages ACTIVE with now >= expires_at -> EXPIRED if credits_remaining > 0 else EXHAUSTED; (2) check-ins PENDING with now > due_at + 72h -> MISSED (streak reset); (3) consents ACTIVE with now >= expires_at -> EXPIRED + note-seal cascade; (4) coach supervision recompute; (5) plan posture recompute; (6) family billing recompute."
    roles: [PracticeAdmin]
    code: 200
    input: []
    output: "{ packages_expired: integer, packages_exhausted: integer, checkins_missed: integer, consents_expired: integer, coaches_recomputed: integer }"
    side_effects: ["Per-step transitions per §1.2; each mutation bumps the touched entity's version"]

  # --- Family ---
  - method: POST
    path: "/api/families"
    description: "Create a household account (status INTAKE)"
    roles: [PracticeAdmin]
    code: 201
    input: [account_name, primary_email]
    output: Family
    side_effects: []
  - method: GET
    path: "/api/families/{id}"
    description: "Read a family including ledger counters and billing_status"
    roles: [PracticeAdmin, FamilyMember]
    code: 200
    input: []
    output: Family
    side_effects: []
  - method: GET
    path: "/api/families"
    description: "Paginated family list"
    roles: [PracticeAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Family[]"
    side_effects: []
  - method: POST
    path: "/api/families/{id}/transition"
    description: "Family status transitions per §1.2 (to_state IN {ACTIVE, SUSPENDED, CLOSED}); INTAKE->ACTIVE requires >= 1 client; SUSPENDED->ACTIVE requires outstanding <= 20000"
    roles: [PracticeAdmin]
    code: 200
    input: [to_state]
    output: Family
    side_effects: ["Per Family state machine; increments Family.version by 1"]
  - method: POST
    path: "/api/families/{id}/payments"
    description: "Record a payment; reduces outstanding_balance_cents; may clear DELINQUENT (does NOT auto-unsuspend)"
    roles: [FamilyMember]
    code: 201
    input: [amount_cents]
    output: Family
    side_effects: ["total_paid_cents += amount_cents; outstanding + billing_status recompute; increments Family.version by 1"]

  # --- Client ---
  - method: POST
    path: "/api/families/{id}/clients"
    description: "Register a student under a family (status INTAKE)"
    roles: [PracticeAdmin, FamilyMember]
    code: 201
    input: [full_name, date_of_birth, track]
    output: Client
    side_effects: []
  - method: GET
    path: "/api/families/{id}/clients"
    description: "List clients of a family"
    roles: [PracticeAdmin, FamilyMember]
    code: 200
    input: []
    output: "Client[]"
    side_effects: []
  - method: GET
    path: "/api/clients/{id}"
    description: "Read a client including computed progress indices and streak"
    roles: [PracticeAdmin, Coach, FamilyMember]
    code: 200
    input: []
    output: Client
    side_effects: []
  - method: POST
    path: "/api/clients/{id}/transition"
    description: "Client status transitions per §1.2 (to_state IN {PAUSED, ACTIVE, DISCHARGED})"
    roles: [PracticeAdmin]
    code: 200
    input: [to_state]
    output: Client
    side_effects: ["Per Client state machine; session credit-release cascade on DISCHARGED"]

