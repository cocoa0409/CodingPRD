      - name: contract_suspension_cascade_down_to_territories_and_disclosures
        claim_type: cascade down
        excluded_because:
          difficulty_instance: document_fraud_confirmation_five_hop_cascade
          rationale: |
            That §1.8 instance already drives the full downward cascade from a CONFIRMED_FRAUD
            document through posture escalation to contract SUSPENDED, and asserts that only
            the non-terminal children move: the ACTIVE territory becomes RELEASED and the
            DRAFT application's disclosure becomes INVALIDATED. A separate corner instance
            would replay the same parent-to-children fan-out with weaker assertions.

      - name: withdrawal_compensation_reverses_accrual_side_effects
        claim_type: compensation
        excluded_because:
          difficulty_instance: withdrawal_clawback_restores_zero_net_with_paid_liability
          rationale: |
            The compensating-invariant instance already performs the undo transition
            (WITHDRAWN) and asserts that every original side effect is reversed without
            drift: each accrual moves to CLAWED_BACK, net_commission_cents and
            net_earned_commission_cents return to their pre-accrual values and the paid
            portion is preserved as clawback_liability_cents.

      - name: termination_forfeiture_is_conditional_on_application_state
        claim_type: conditional cascade
        excluded_because:
          difficulty_instance: contract_termination_for_cause_file_transition_cascade
          rationale: |
            That instance exercises the conditional arm of the termination cascade: a
            FileTransition row is appended only for applications whose status is in
            {DRAFT, SUBMITTED, ADMITTED, DEPOSIT_PAID}, and entry forfeiture is applied
            only to the entries selected by termination_forfeiture_selection. The
            complementary vesting arm is covered here by
            convenience_termination_preserves_vested_enrolled_accrual.

  # ===========================================================================
  # From Table 3 (Calculations)
  # ===========================================================================
  - section: calculations
    instances:
      - name: risk_score_ignores_reported_and_dismissed_incidents
        claim_type: input_set_filtering
        grounds:
          - calculations.agency_integrity_risk_score.input_set
          - state_machines.IntegrityIncident.status
          - endpoints["GET /recruitment/agencies/{id}/risk-profile"]
        distinguishing_aspect: |
          Three HIGH incidents on the same date contribute only 30.00 in total because the
          input set is restricted to status == CONFIRMED; the REPORTED one and the DISMISSED
          one are invisible to both variants even though they exist on the agency.
        test_recipe:
          setup:
            - "The clock is at the default 2026-08-01T00:00:00Z."
            - "One agency with three HIGH incidents that all occurred on 2026-08-01."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Filtered Input Agency", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/integrity-incidents"
              payload: { agency_id: "${ag1_id}", category: "MISREPRESENTATION", severity: "HIGH", occurred_on: "2026-08-01", source: "AUDIT" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { inc_conf_id: "$.data.id" }
            - call: "POST /recruitment/integrity-incidents"
              payload: { agency_id: "${ag1_id}", category: "MISREPRESENTATION", severity: "HIGH", occurred_on: "2026-08-01", source: "AUDIT" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { inc_open_id: "$.data.id" }
            - call: "POST /recruitment/integrity-incidents"
              payload: { agency_id: "${ag1_id}", category: "MISREPRESENTATION", severity: "HIGH", occurred_on: "2026-08-01", source: "AUDIT" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { inc_dism_id: "$.data.id" }
            - call: "POST /recruitment/integrity-incidents/${inc_conf_id}/resolution"
