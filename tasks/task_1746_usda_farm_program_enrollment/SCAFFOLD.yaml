scenario: |
  USDA Farm Program Enrollment (FSA): farm/tract/field record & acreage
  reporting deadline, base acre & program election (price vs revenue), payment
  limitation & AGI eligibility, actual production history & yield update,
  disaster program application & documentation, conservation compliance
  certification, payment calculation & sequestration, appeal & reconstitution.

domain_name: usda-farm-program-enrollment
api_prefix: /fsa

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency      # OCC on Farm.version (reconstitution) and Enrollment.version (election supersede)
    - cascading_side_effects      # election -> enrollment -> payment recompute; disaster approval -> yield substitution -> payment recompute
    - dual_variant_calculation    # PLC vs ARC-CO payment for identical inputs; provisional vs final APH yield
    - rate_threshold_triggers     # AGI $900k, payment-limitation $125k, sequestration 5.7%, prevented-plant 55%/$ trigger
    - version_pinning_on_approval # enrollment pins election + yield record at certification; appeal re-opens
  entity_topology: hybrid          # Farm -> Tract -> Field tree + cross-cutting Producer/Enrollment/Appeal/DisasterApplication
  state_machine_shape: cyclic      # appeal REMANDED -> enrollment back to CERTIFIED loop; election amendment cycle
  relationship_patterns:
    - one_to_many                  # Farm->Tract->Field, Farm->Enrollment
    - many_to_many                 # Producer <-> Farm via FarmMembership (share %)
    - cross_aggregate              # Enrollment references ProgramElection, YieldRecord, ConservationCertification, AgiAttestation
    - self_referential             # Appeal.remands_appeal_id (subsequent appeal after remand), Tract.reconstituted_from_tract_id
  role_model: segregation_of_duties # CountyCommittee reviewer may not certify a case they filed; CED approves what specialist prepared
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Farm
    parent: null
    common_fields: true
    fields:
      - { name: farm_number,      type: string,  source: input,    description: "FSA-assigned farm serial number; unique per county" }
      - { name: county_code,      type: string,  source: input,    description: "3-digit FIPS county code where the farm is administered" }
      - { name: program_year,     type: integer, source: input,    description: "Crop year the record belongs to (e.g. 2026)" }
      - { name: farm_status,      type: enum,    source: system,   description: "ACTIVE | RECONSTITUTION_PENDING | RECONSTITUTED | RETIRED", default: ACTIVE }
      - { name: total_base_acres, type: number,  source: computed, description: "Sum of base acres across tracts; recomputed on reconstitution" }
      - { name: arc_co_ic_indicator, type: enum, source: input,    description: "COUNTY | INDIVIDUAL — ARC coverage flavor elected at farm level", default: COUNTY }

  - name: Producer
    parent: null
    common_fields: true
    fields:
      - { name: producer_name,    type: string,  source: input,    description: "Legal name of individual or entity" }
      - { name: tax_id_last4,     type: string,  source: input,    description: "Last 4 of SSN/EIN used for attribution matching" }
      - { name: entity_type,      type: enum,    source: input,    description: "INDIVIDUAL | CORPORATION | PARTNERSHIP | TRUST | LLC" }
      - { name: agi_attestation_status, type: enum, source: system, description: "NOT_FILED | FILED | VERIFIED | NONCOMPLIANT", default: NOT_FILED }
      - { name: adjusted_gross_income, type: integer, source: input, description: "3-year average AGI in whole dollars as attested; null until FILED", default: null }
      - { name: payment_limitation_cap_cents, type: integer, source: system, description: "Statutory cap; default 12500000 ($125,000.00), may be raised by spouse rule", default: 12500000 }
      - { name: conservation_status, type: enum, source: system,   description: "CERTIFIED | PENDING | VIOLATION | EXEMPT", default: PENDING }

  - name: FarmMembership
    parent: Farm
    common_fields: true
    fields:
      - { name: farm_id,          type: string,  source: input,    description: "FK -> Farm.id; the farm the producer shares in" }
      - { name: producer_id,      type: string,  source: input,    description: "FK -> Producer.id; the member" }
      - { name: share_percent,    type: number,  source: input,    description: "Ownership/operation share 0 < share <= 100; sum across a farm's memberships must equal 100.00" }
      - { name: is_spouse_pair,   type: boolean, source: input,    description: "True when two memberships on this farm are a qualifying spouse pair (raises cap to 25000000)", default: false }
      - { name: membership_status, type: enum,   source: system,   description: "ACTIVE | REMOVED", default: ACTIVE }

  - name: Tract
    parent: Farm
    common_fields: true
    fields:
      - { name: farm_id,          type: string,  source: input,    description: "FK -> Farm.id; owning farm" }
      - { name: tract_number,     type: string,  source: input,    description: "FSA tract number within farm" }
      - { name: base_acres,       type: number,  source: input,    description: "Historical base acres on the tract; >= 0, 2-decimal precision" }
      - { name: cropland_acres,   type: number,  source: input,    description: "Total cropland acres; reported fields may not exceed this" }
      - { name: tract_status,     type: enum,    source: system,   description: "ACTIVE | DIVIDED | COMBINED", default: ACTIVE }
      - { name: reconstituted_from_tract_id, type: string, source: system, description: "FK -> Tract.id; set on the product of a reconstitution, null on original tracts", default: null }

  - name: Field
    parent: Tract
    common_fields: true
    fields:
      - { name: tract_id,         type: string,  source: input,    description: "FK -> Tract.id; owning tract" }
      - { name: field_number,     type: string,  source: input,    description: "Field number within tract" }
      - { name: acres,            type: number,  source: input,    description: "GIS-measured acres; sum of field acres on a tract must be <= tract.cropland_acres" }

  - name: AcreageReport
    parent: Farm
    common_fields: true
    fields:
      - { name: farm_id,          type: string,  source: input,    description: "FK -> Farm.id; the farm reported" }
      - { name: program_year,     type: integer, source: input,    description: "Crop year reported" }
      - { name: report_status,    type: enum,    source: system,   description: "DRAFT | FILED | CERTIFIED | LATE_FILED | REJECTED", default: DRAFT }
      - { name: reported_acres,   type: number,  source: computed, description: "Sum of AcreageReportLine acres included in the report" }
      - { name: filed_at,         type: datetime, source: system,  description: "Timestamp the report was filed; compared to reporting deadline" }

  - name: AcreageReportLine
    parent: AcreageReport
    common_fields: true
    fields:
      - { name: acreage_report_id, type: string, source: input,    description: "FK -> AcreageReport.id; parent report" }
      - { name: field_id,         type: string,  source: input,    description: "FK -> Field.id; the field reported" }
      - { name: crop_code,        type: string,  source: input,    description: "Commodity code (CORN, SOYBN, WHEAT, COTTON, ...)" }
      - { name: planted_acres,    type: number,  source: input,    description: "Planted acres; >= 0" }
      - { name: prevented_planted_acres, type: number, source: input, description: "Prevented-planting acres; >= 0" }
      - { name: intended_use,     type: enum,    source: input,    description: "GRAIN | SILAGE | HAY | GRAZE | COVER" }

  - name: ProgramElection
    parent: Farm
    common_fields: true
    fields:
      - { name: farm_id,          type: string,  source: input,    description: "FK -> Farm.id; the farm the election covers" }
      - { name: program_year,     type: integer, source: input,    description: "Crop year of election" }
      - { name: commodity,        type: string,  source: input,    description: "Covered commodity this election is for (CORN, SOYBN, WHEAT, COTTON)" }
      - { name: election_code,    type: enum,    source: input,    description: "PLC | ARC_CO | ARC_IC" }
      - { name: election_status,  type: enum,    source: system,   description: "ACTIVE | SUPERSEDED | WITHDRAWN | LOCKED", default: ACTIVE }
      - { name: effective_from_version, type: integer, source: system, description: "Farm.version at which this election became the pinned one" }

  - name: YieldRecord
    parent: Farm
    common_fields: true
    fields:
      - { name: farm_id,          type: string,  source: input,    description: "FK -> Farm.id; owning farm" }
      - { name: commodity,        type: string,  source: input,    description: "Commodity the APH applies to" }
      - { name: aph_yield_bu_per_acre, type: number, source: computed, description: "Actual Production History yield; weighted average of YieldObservation rows (plug yield on missing years)" }
      - { name: yield_status,     type: enum,    source: system,   description: "PROVISIONAL | UPDATED | CERTIFIED | LOCKED", default: PROVISIONAL }
      - { name: update_window_open, type: boolean, source: system, description: "Whether the one-time APH update window is open for this record", default: true }

  - name: YieldObservation
    parent: YieldRecord
    common_fields: false
    fields:
      - { name: yield_record_id,  type: string,  source: input,    description: "FK -> YieldRecord.id; parent record" }
      - { name: crop_year,        type: integer, source: input,    description: "Year of observation (must be one of the trailing 5 years)" }
      - { name: actual_yield_bu_per_acre, type: number, source: input, description: "Observed yield; null signals a plug-year", default: null }
      - { name: is_disaster_substituted, type: boolean, source: system, description: "True when a disaster approval substituted 65% of T-yield for this year", default: false }

  - name: Enrollment
    parent: Farm
    common_fields: true
    fields:
      - { name: farm_id,          type: string,  source: input,    description: "FK -> Farm.id; enrolled farm" }
      - { name: program_year,     type: integer, source: input,    description: "Crop year enrolled" }
      - { name: commodity,        type: string,  source: input,    description: "Covered commodity enrolled" }
      - { name: enrollment_status, type: enum,   source: system,   description: "DRAFT | SUBMITTED | CED_APPROVED | CERTIFIED | PAYMENT_COMPUTED | PAYMENT_ISSUED | ON_APPEAL | REMANDED | VOID", default: DRAFT }
      - { name: pinned_election_id, type: string, source: system,  description: "FK -> ProgramElection.id; election locked at certification", default: null }
      - { name: pinned_yield_record_id, type: string, source: system, description: "FK -> YieldRecord.id; yield record locked at certification", default: null }
      - { name: computed_payment_cents, type: integer, source: computed, description: "Payment after PLC/ARC formula, payment limitation, AGI bar, sequestration; null until PAYMENT_COMPUTED", default: null }
      - { name: sequestration_cents, type: integer, source: computed, description: "Amount withheld under sequestration order (5.7%)", default: null }

  - name: DisasterApplication
    parent: Farm
    common_fields: true
    fields:
      - { name: farm_id,          type: string,  source: input,    description: "FK -> Farm.id; affected farm" }
      - { name: program_year,     type: integer, source: input,    description: "Crop year of loss" }
      - { name: disaster_type,    type: enum,    source: input,    description: "DROUGHT | FLOOD | HAIL | FREEZE | WILDFIRE | EXCESS_MOISTURE" }
      - { name: application_status, type: enum,  source: system,   description: "DRAFT | FILED | UNDER_REVIEW | APPROVED | DENIED | WITHDRAWN", default: DRAFT }
      - { name: loss_acres,       type: number,  source: input,    description: "Acres claimed as disaster-affected; must be >= 35% of reported acres for the commodity to qualify (ELAP-style trigger)" }
      - { name: qualifying_commodity, type: string, source: input, description: "Commodity the loss applies to" }
      - { name: documentation_complete, type: boolean, source: input, description: "Producer attestation that Notice of Loss + evidence are on file", default: false }

  - name: Appeal
    parent: Farm
    common_fields: true
    fields:
      - { name: farm_id,          type: string,  source: input,    description: "FK -> Farm.id; farm the appeal concerns" }
      - { name: enrollment_id,    type: string,  source: input,    description: "FK -> Enrollment.id; the enrollment determination being appealed" }
      - { name: appeal_status,    type: enum,    source: system,   description: "FILED | CED_REVIEW | COMMITTEE_HEARING | UPHELD | REVERSED | REMANDED | CLOSED", default: FILED }
      - { name: ground_code,      type: enum,    source: input,    description: "FACTUAL_ERROR | PROCEDURAL_ERROR | MISAPPLICATION_OF_RULE | NEW_EVIDENCE" }
      - { name: remands_appeal_id, type: string, source: system,   description: "FK -> Appeal.id; set when this appeal re-opens a previously remanded case", default: null }
      - { name: filed_by_producer_id, type: string, source: input, description: "FK -> Producer.id; appellant" }
      - { name: assigned_reviewer_producer_id, type: string, source: system, description: "FK -> Producer.id; county-committee reviewer (must differ from filed_by_producer_id — segregation of duties)", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Farm
    field: farm_status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RECONSTITUTION_PENDING
        trigger: "POST /fsa/farms/{farm_id}/reconstitutions (method=DIVIDE or COMBINE)"
        actor: CountySpecialist
        preconditions:
          - "Farm is ACTIVE"
          - "No Enrollment on the farm is in CERTIFIED, PAYMENT_COMPUTED, or PAYMENT_ISSUED"
          - "expected_farm_version matches current Farm.version (OCC)"
        side_effects:
          - "Increments Farm.version by 1"
          - "Creates child Tract rows (DIVIDE: 2..N product tracts with reconstituted_from_tract_id = source; COMBINE: single product tract summing source base_acres)"
          - "Source tracts transition to DIVIDED or COMBINED"
      - from: RECONSTITUTION_PENDING
        to: RECONSTITUTED
        trigger: "system (all product tracts pass base-acre conservation check: |sum(product base_acres) - sum(source base_acres)| <= 0.01)"
        actor: system
        preconditions:
          - "All product tracts ACTIVE"
          - "Sum of product tract base_acres equals sum of source tract base_acres within 0.01-acre tolerance"
        side_effects:
          - "Farm.total_base_acres recomputed"
          - "Farm.status becomes ACTIVE for downstream enrollment (RECONSTITUTED is informational; farm returns to ACTIVE via /finalize)"
      - from: RECONSTITUTION_PENDING
        to: ACTIVE
        trigger: "POST /fsa/farms/{farm_id}/reconstitutions/{recon_id}/cancel"
        actor: CountySpecialist
        preconditions:
          - "Reconstitution not yet RECONSTITUTED"
        side_effects:
          - "Product tracts deleted; source tracts restored to ACTIVE"
      - from: RECONSTITUTED
        to: ACTIVE
        trigger: "POST /fsa/farms/{farm_id}/finalize-reconstitution"
        actor: CountySpecialist
        preconditions:
          - "Farm.status == RECONSTITUTED"
        side_effects:
          - "Increments Farm.version by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /fsa/farms/{farm_id}/retire"
        actor: CountyExecutiveDirector
        preconditions:
          - "All enrollments on the farm are in DRAFT, VOID, or PAYMENT_ISSUED"
          - "No OPEN (non-terminal) Appeal or DisasterApplication"
        side_effects:
          - "All ACTIVE FarmMembership rows -> REMOVED"

  - entity: Producer
    field: agi_attestation_status
    initial_state: NOT_FILED
    terminal_states: []
    transitions:
      - from: NOT_FILED
        to: FILED
        trigger: "POST /fsa/producers/{producer_id}/agi-attestations"
        actor: Producer
        preconditions:
          - "adjusted_gross_income is a non-negative integer"
        side_effects:
          - "Producer.agi_attestation_status -> FILED"
      - from: FILED
        to: VERIFIED
        trigger: "POST /fsa/producers/{producer_id}/agi-attestations/verify"
        actor: CountySpecialist
        preconditions:
          - "attestation_status == FILED"
        side_effects:
          - "Producer.agi_attestation_status -> VERIFIED"
      - from: FILED
        to: NONCOMPLIANT
        trigger: "POST /fsa/producers/{producer_id}/agi-attestations/flag-noncompliant"
        actor: CountySpecialist
        preconditions:
          - "attestation_status == FILED"
        side_effects:
          - "Producer.agi_attestation_status -> NONCOMPLIANT"
      - from: NONCOMPLIANT
        to: FILED
        trigger: "POST /fsa/producers/{producer_id}/agi-attestations (re-file)"
        actor: Producer
        preconditions: []
        side_effects:
          - "attestation_status -> FILED (restart verification)"

  - entity: Producer
    field: conservation_status
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /fsa/producers/{producer_id}/conservation-certifications"
        actor: Producer
        preconditions:
          - "HELC/WC self-certification attestation accepted"
        side_effects: []
      - from: CERTIFIED
        to: VIOLATION
        trigger: "POST /fsa/producers/{producer_id}/conservation-violations"
        actor: CountyExecutiveDirector
        preconditions: []
        side_effects:
          - "Producer.conservation_status -> VIOLATION; all non-terminal Enrollments on farms where producer holds membership get flagged (payment blocked)"
      - from: VIOLATION
        to: CERTIFIED
        trigger: "POST /fsa/producers/{producer_id}/conservation-certifications (remediated)"
        actor: Producer
        preconditions:
          - "A remediation plan attestation accompanies the certification"
        side_effects: []
      - from: PENDING
        to: EXEMPT
        trigger: "POST /fsa/producers/{producer_id}/conservation-exemptions"
        actor: CountyExecutiveDirector
        preconditions:
          - "Producer entity_type is TRUST or the land was enrolled before statutory baseline"
        side_effects: []

  - entity: AcreageReport
    field: report_status
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /fsa/acreage-reports/{report_id}/file"
        actor: Producer
        preconditions:
          - "Producer holds an ACTIVE FarmMembership on the report's farm"
          - "Current clock time <= reporting deadline for program_year (2026-07-15T23:59:59Z)"
          - "Every line's field belongs to the report's farm"
          - "reported_acres > 0"
        side_effects:
          - "filed_at stamped"
      - from: DRAFT
        to: LATE_FILED
        trigger: "POST /fsa/acreage-reports/{report_id}/file (when clock > deadline and <= deadline + 30 days)"
        actor: Producer
        preconditions:
          - "deadline < clock <= deadline + 30d"
          - "late fee is accepted"
        side_effects:
          - "filed_at stamped; LATE_FILED carries a reduced payment factor (0.9) downstream"
      - from: [FILED, LATE_FILED]
        to: CERTIFIED
        trigger: "POST /fsa/acreage-reports/{report_id}/certify"
        actor: CountySpecialist
        preconditions:
          - "report_status in {FILED, LATE_FILED}"
          - "Specialist did not file the report (segregation of duties)"
        side_effects:
          - "report_status -> CERTIFIED"
      - from: [FILED, LATE_FILED]
        to: REJECTED
        trigger: "POST /fsa/acreage-reports/{report_id}/reject"
        actor: CountySpecialist
        preconditions: []
        side_effects: []
      - from: CERTIFIED
        to: FILED
        trigger: "POST /fsa/acreage-reports/{report_id}/reopen"
        actor: CountySpecialist
        preconditions:
          - "No Enrollment for this farm+year is in CERTIFIED or beyond"
        side_effects: []

  - entity: ProgramElection
    field: election_status
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN, LOCKED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /fsa/farms/{farm_id}/program-elections (a new election for the same farm+year+commodity supersedes the prior)"
        actor: Producer
        preconditions:
          - "Election window is open (clock <= election deadline 2026-03-16T23:59:59Z)"
          - "Producer holds ACTIVE FarmMembership on the farm"
          - "No Enrollment referencing the prior election is CERTIFIED or beyond"
          - "expected_farm_version matches current Farm.version (OCC on supersede)"
        side_effects:
          - "Prior ACTIVE election for (farm, year, commodity) -> SUPERSEDED"
          - "New election created with effective_from_version = Farm.version"
          - "Increments Farm.version by 1"
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /fsa/program-elections/{election_id}/withdraw"
        actor: Producer
        preconditions:
          - "Election window still open"
          - "No Enrollment referencing this election is CERTIFIED or beyond"
        side_effects: []
      - from: ACTIVE
        to: LOCKED
        trigger: "system (an Enrollment that pinned this election reaches CERTIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "Election becomes immutable"

  - entity: YieldRecord
    field: yield_status
    initial_state: PROVISIONAL
    terminal_states: [LOCKED]
    transitions:
      - from: PROVISIONAL
        to: UPDATED
        trigger: "POST /fsa/yield-records/{record_id}/updates"
        actor: Producer
        preconditions:
          - "update_window_open == true"
          - "Producer holds ACTIVE FarmMembership on the record's farm"
        side_effects:
          - "aph_yield_bu_per_acre recomputed from YieldObservation rows"
          - "update_window_open -> false"
      - from: UPDATED
        to: CERTIFIED
        trigger: "POST /fsa/yield-records/{record_id}/certify"
        actor: CountySpecialist
        preconditions:
          - "yield_status == UPDATED"
        side_effects: []
      - from: [PROVISIONAL, UPDATED, CERTIFIED]
        to: LOCKED
        trigger: "system (an Enrollment pinning this record reaches CERTIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "Record becomes immutable"
      - from: CERTIFIED
        to: UPDATED
        trigger: "POST /fsa/yield-records/{record_id}/updates (recertification path while window still open)"
        actor: Producer
        preconditions:
          - "update_window_open == true"
        side_effects:
          - "aph_yield recomputed; update_window_open -> false"

  - entity: Enrollment
    field: enrollment_status
    initial_state: DRAFT
    terminal_states: [PAYMENT_ISSUED, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fsa/enrollments/{enrollment_id}/submit"
        actor: Producer
        preconditions:
          - "Producer holds ACTIVE FarmMembership on the farm"
          - "An ACTIVE ProgramElection exists for (farm, program_year, commodity)"
          - "A YieldRecord exists for (farm, commodity)"
          - "AcreageReport for (farm, program_year) is CERTIFIED"
        side_effects: []
      - from: SUBMITTED
        to: CED_APPROVED
        trigger: "POST /fsa/enrollments/{enrollment_id}/ced-approve"
        actor: CountyExecutiveDirector
        preconditions:
          - "Producer.agi_attestation_status == VERIFIED and adjusted_gross_income <= 90000000 ($900,000 AGI limit in cents)"
          - "Producer.conservation_status in {CERTIFIED, EXEMPT}"
          - "CED is not the submitting producer (segregation of duties)"
        side_effects: []
      - from: CED_APPROVED
        to: CERTIFIED
        trigger: "POST /fsa/enrollments/{enrollment_id}/certify"
        actor: CountyCommittee
        preconditions:
          - "enrollment_status == CED_APPROVED"
          - "Committee reviewer did not submit the enrollment (segregation of duties)"
        side_effects:
          - "pinned_election_id <- current ACTIVE election; pinned_election -> LOCKED"
          - "pinned_yield_record_id <- current YieldRecord; pinned yield -> LOCKED"
      - from: CERTIFIED
        to: PAYMENT_COMPUTED
        trigger: "POST /fsa/enrollments/{enrollment_id}/compute-payment"
        actor: CountySpecialist
        preconditions:
          - "enrollment_status == CERTIFIED"
        side_effects:
          - "computed_payment_cents set by calculation payment_calculation (PLC or ARC_CO variant per pinned election)"
          - "payment limitation applied against Producer.payment_limitation_cap_cents"
          - "sequestration_cents computed at 5.7%"
      - from: PAYMENT_COMPUTED
        to: PAYMENT_ISSUED
        trigger: "POST /fsa/enrollments/{enrollment_id}/issue-payment"
        actor: CountyExecutiveDirector
        preconditions:
          - "enrollment_status == PAYMENT_COMPUTED"
        side_effects:
          - "Payment disbursed (out of scope)"
      - from: [CERTIFIED, PAYMENT_COMPUTED]
        to: ON_APPEAL
        trigger: "POST /fsa/appeals (an appeal referencing this enrollment is filed)"
        actor: Producer
        preconditions:
          - "enrollment_status in {CERTIFIED, PAYMENT_COMPUTED}"
        side_effects:
          - "enrollment_status -> ON_APPEAL"
      - from: ON_APPEAL
        to: REMANDED
        trigger: "system (Appeal for this enrollment reaches REMANDED)"
        actor: system
        preconditions: []
        side_effects:
          - "enrollment -> REMANDED"
      - from: REMANDED
        to: CERTIFIED
        trigger: "POST /fsa/enrollments/{enrollment_id}/recertify"
        actor: CountyCommittee
        preconditions:
          - "enrollment_status == REMANDED"
          - "Corrected election or yield data supplied"
        side_effects:
          - "enrollment -> CERTIFIED; pins re-evaluated"
      - from: [DRAFT, SUBMITTED]
        to: VOID
        trigger: "POST /fsa/enrollments/{enrollment_id}/void"
        actor: Producer
        preconditions: []
        side_effects: []

  - entity: DisasterApplication
    field: application_status
    initial_state: DRAFT
    terminal_states: [DENIED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /fsa/disaster-applications/{app_id}/file"
        actor: Producer
        preconditions:
          - "Producer holds ACTIVE FarmMembership on the farm"
          - "AcreageReport for (farm, program_year) is CERTIFIED"
        side_effects: []
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /fsa/disaster-applications/{app_id}/assign-reviewer"
        actor: CountyExecutiveDirector
        preconditions:
          - "documentation_complete == true"
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /fsa/disaster-applications/{app_id}/approve"
        actor: CountyCommittee
        preconditions:
          - "loss_acres >= 0.35 * reported acres for qualifying_commodity (35% trigger)"
          - "Committee reviewer != filer (segregation of duties)"
        side_effects:
          - "For each YieldObservation on (farm, qualifying_commodity) with actual_yield < 65% of T-yield: set is_disaster_substituted = true, substitute 0.65*T_yield into APH recompute"
          - "Pinned YieldRecord on any CERTIFIED Enrollment for the same (farm, commodity) is re-evaluated; if the enrollment is PAYMENT_COMPUTED or PAYMENT_ISSUED the payment delta is recomputed"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /fsa/disaster-applications/{app_id}/deny"
        actor: CountyCommittee
        preconditions: []
        side_effects: []
      - from: [DRAFT, FILED]
        to: WITHDRAWN
        trigger: "POST /fsa/disaster-applications/{app_id}/withdraw"
        actor: Producer
        preconditions: []
        side_effects: []

  - entity: Appeal
    field: appeal_status
    initial_state: FILED
    terminal_states: [UPHELD, REVERSED, CLOSED]
    transitions:
      - from: FILED
        to: CED_REVIEW
        trigger: "POST /fsa/appeals/{appeal_id}/assign-ced"
        actor: CountyExecutiveDirector
        preconditions:
          - "appeal_status == FILED"
        side_effects: []
      - from: CED_REVIEW
        to: COMMITTEE_HEARING
        trigger: "POST /fsa/appeals/{appeal_id}/refer-to-committee"
        actor: CountyExecutiveDirector
        preconditions:
          - "CED cannot resolve informally"
        side_effects:
          - "assigned_reviewer_producer_id set; reviewer must differ from filed_by_producer_id"
      - from: COMMITTEE_HEARING
        to: UPHELD
        trigger: "POST /fsa/appeals/{appeal_id}/uphold"
        actor: CountyCommittee
        preconditions:
          - "reviewer != appellant"
        side_effects:
          - "Enrollment returns from ON_APPEAL to prior state (CERTIFIED or PAYMENT_COMPUTED)"
      - from: COMMITTEE_HEARING
        to: REVERSED
        trigger: "POST /fsa/appeals/{appeal_id}/reverse"
        actor: CountyCommittee
        preconditions:
          - "reviewer != appellant"
        side_effects:
          - "Enrollment payment is recomputed per the committee's finding (factual correction)"
      - from: COMMITTEE_HEARING
        to: REMANDED
        trigger: "POST /fsa/appeals/{appeal_id}/remand"
        actor: CountyCommittee
        preconditions:
          - "reviewer != appellant"
        side_effects:
          - "Enrollment -> REMANDED; may be recertified and re-appealed (cyclic)"
      - from: [FILED, CED_REVIEW]
        to: CLOSED
        trigger: "POST /fsa/appeals/{appeal_id}/close"
        actor: Producer
        preconditions:
          - "Closer is the appellant"
        side_effects:
          - "Enrollment returns to its pre-appeal state"

# =============================================================================
# 1.2.1 Concurrency Rules (true races only — OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: election-supersede-stale-farm
    parent_entity: Farm
    write_endpoint: "POST /fsa/farms/{farm_id}/program-elections"
    occ_field: expected_farm_version
    description: |
      Creating a new ProgramElection against a Farm whose version has advanced
      since the client last observed it is rejected. A superseding election
      legitimately advances Farm.version; a second create carrying the older
      expected_farm_version is stale and must be refused.
    error_id: ERR_STALE_FARM_VERSION
    http_status: 412
  - rule_id: reconstitution-stale-farm
    parent_entity: Farm
    write_endpoint: "POST /fsa/farms/{farm_id}/reconstitutions"
    occ_field: expected_farm_version
    description: |
      Opening a reconstitution against a Farm whose version has advanced since
      the client last observed it is rejected. Only one reconstitution may be
      pending; a request carrying an out-of-date version is stale.
    error_id: ERR_STALE_FARM_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: aph_yield_calculation
    trigger: "On YieldRecord create, on POST /fsa/yield-records/{id}/updates, and when a DisasterApplication approval substitutes yields"
    algorithm: aggregation
    formula: |
      Let observations = the 5 trailing YieldObservation rows for the record,
      ordered by crop_year ASC. For each row, effective_yield =
        actual_yield_bu_per_acre if not null and not is_disaster_substituted
        0.65 * T_YIELD[commodity]             if is_disaster_substituted
        PLUG_YIELD[commodity]                 if actual_yield is null (no evidence)
      aph_yield_bu_per_acre = round_half_up( sum(effective_yield) / 5 , 1 )
    input_set: "YieldObservation rows with yield_record_id = this record, the 5 trailing crop years only"
    constants:
      T_YIELD_CORN: 180
      T_YIELD_SOYBN: 50
      T_YIELD_WHEAT: 65
      PLUG_YIELD_CORN: 135
      PLUG_YIELD_SOYBN: 37
      PLUG_YIELD_WHEAT: 49
      DISASTER_SUBSTITUTION_FACTOR: 0.65
      OBSERVATION_WINDOW_YEARS: 5
    precision: "1 decimal place, round_half_up"
    variants:
      - name: provisional_vs_certified
        when: "PROVISIONAL records use plug yield for any missing year; CERTIFIED records require actual evidence and recompute if a plug was later filled"
        difference: "A provisional APH may contain plug-year values; a certified APH replaces plugs with observed values, producing a different (usually higher) yield"

  - name: plc_payment_calculation
    trigger: "POST /fsa/enrollments/{id}/compute-payment when pinned_election.election_code == PLC"
    algorithm: tiered_pricing
    formula: |
      # Price Loss Coverage: paid when effective price < statutory reference price.
      reference_price   = REFERENCE_PRICE[commodity]         # e.g. CORN 4.10
      effective_price   = min(national_my_price, loan_rate[commodity])  # given as input to compute
      payment_rate      = max(0, reference_price - effective_price)
      base_payment      = payment_rate * aph_yield_bu_per_acre * base_acres_on_enrollment * 0.85
      # payment limitation & sequestration layered on
      after_limitation  = min(base_payment, producer.payment_limitation_cap_cents/100 attributable share)
      sequestration     = round_half_up(after_limitation * 0.057, 2)
      computed_payment  = round_half_up(after_limitation - sequestration, 2)
    input_set: "Single Enrollment; pinned election PLC; pinned YieldRecord; Farm base acres for the commodity"
    constants:
      REFERENCE_PRICE_CORN: 4.10
      REFERENCE_PRICE_SOYBN: 9.00
      REFERENCE_PRICE_WHEAT: 5.50
      PLC_PAYMENT_FACTOR: 0.85
      SEQUESTRATION_RATE: 0.057
    precision: "2 decimal places, round_half_up; per-line then sum ordering pinned"
    variants:
      - name: price_triggered_vs_not
        when: "effective_price below reference_price produces positive payment; at-or-above produces zero"
        difference: "Identical acreage/yield inputs produce non-zero vs zero payment depending solely on market price input"

  - name: arc_co_payment_calculation
    trigger: "POST /fsa/enrollments/{id}/compute-payment when pinned_election.election_code == ARC_CO"
    algorithm: constraint_propagation
    formula: |
      # Agriculture Risk Coverage - County: revenue guarantee vs actual revenue.
      guarantee = benchmark_revenue * 0.86            # 86% of benchmark
      actual_revenue = county_actual_yield * national_my_price
      payment_rate = min( 0.10 * benchmark_revenue, max(0, guarantee - actual_revenue) )  # capped at 10% of benchmark
      base_payment = payment_rate * base_acres_on_enrollment * 0.85
      after_limitation = min(base_payment, producer.payment_limitation_cap_cents/100 attributable share)
      sequestration = round_half_up(after_limitation * 0.057, 2)
      computed_payment = round_half_up(after_limitation - sequestration, 2)
    input_set: "Single Enrollment; pinned election ARC_CO; county benchmark and actual revenue supplied as compute-time inputs"
    constants:
      ARC_GUARANTEE_FACTOR: 0.86
      ARC_CAP_FACTOR: 0.10
      ARC_PAYMENT_FACTOR: 0.85
      SEQUESTRATION_RATE: 0.057
    precision: "2 decimal places, round_half_up"
    variants:
      - name: revenue_vs_price_anchor
        when: "ARC-CO keys off revenue (yield x price) whereas PLC keys off price alone"
        difference: "Same farm data yields different payment under ARC-CO vs PLC when price is low but county yield is high (revenue offset) — the canonical dual-variant pair"

  - name: payment_limitation_attribution
    trigger: "During compute-payment, after base payment determined"
    algorithm: waterfall_allocation
    formula: |
      # Producer's payment flows through their membership share.
      attributable = base_payment * (membership.share_percent / 100)
      cap = producer.payment_limitation_cap_cents / 100
      # Spouse rule: two memberships with is_spouse_pair=true raise cap to 25000000 cents.
      allowed = min(attributable, cap)
      disallowed = attributable - allowed
    input_set: "All ACTIVE FarmMembership rows for the producer across farms; the enrollment's farm determines share"
    constants:
      STANDARD_CAP_CENTS: 12500000
      SPOUSE_CAP_CENTS: 25000000
    precision: "2 decimal places, round_half_up"
    variants: []

  - name: late_filed_payment_reduction
    trigger: "compute-payment when the farm's AcreageReport for the year is LATE_FILED (not FILED->CERTIFIED)"
    algorithm: threshold
    formula: |
      if acreage_report.report_status == LATE_FILED:
          payment *= 0.90      # 10% reduction for late filing
      # applied BEFORE payment limitation
    input_set: "The Enrollment's farm+year AcreageReport"
    constants:
      LATE_FILED_FACTOR: 0.90
    precision: "2 decimal places, round_half_up; reduction applied before limitation"
    variants: []

  - name: sequestration_withholding
    trigger: "compute-payment, last step"
    algorithm: threshold
    formula: |
      sequestration_cents = round_half_up( post_limitation_payment * 0.057 , 2 )
      net_payment_cents   = post_limitation_payment - sequestration_cents
    input_set: "Post-limitation payment amount"
    constants:
      SEQUESTRATION_RATE: 0.057
    precision: "2 decimal places, round_half_up"
    variants: []

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                 check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                 check: "Role is permitted to invoke the endpoint per RBAC matrix", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence,            check: "Every path id and FK in body resolves to an existing entity (path validated left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4,  category: state,                check: "Target resource is in a state from which the requested transition is defined", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5,  category: state,                check: "OCC: expected_farm_version (when present) equals current Farm.version", error_id: ERR_STALE_FARM_VERSION, http_status: 412, applies_to: ["POST /fsa/farms/{farm_id}/program-elections", "POST /fsa/farms/{farm_id}/reconstitutions"] }
  - { priority: 6,  category: business_temporal,    check: "AcreageReport.file: clock <= reporting deadline (else LATE_FILED path or ERR_ACREAGE_DEADLINE_PASSED beyond late window)", error_id: ERR_ACREAGE_DEADLINE_PASSED, http_status: 422, applies_to: ["POST /fsa/acreage-reports/{id}/file"] }
  - { priority: 7,  category: business_temporal,    check: "ProgramElection create/supersede/withdraw: clock <= election deadline 2026-03-16T23:59:59Z", error_id: ERR_ELECTION_WINDOW_CLOSED, http_status: 422, applies_to: ["POST /fsa/farms/{farm_id}/program-elections", "POST /fsa/program-elections/{id}/withdraw"] }
  - { priority: 8,  category: business_safety,      check: "Conservation compliance: Producer.conservation_status must be CERTIFIED or EXEMPT before CED approval", error_id: ERR_CONSERVATION_NOT_CERTIFIED, http_status: 422, applies_to: ["POST /fsa/enrollments/{id}/ced-approve"] }
  - { priority: 9,  category: business_safety,      check: "AGI eligibility: Producer.agi_attestation_status == VERIFIED and adjusted_gross_income <= 90000000 cents", error_id: ERR_AGI_INELIGIBLE, http_status: 422, applies_to: ["POST /fsa/enrollments/{id}/ced-approve"] }
  - { priority: 10, category: business_referential, check: "Enrollment.submit: ACTIVE ProgramElection exists for (farm, year, commodity)", error_id: ERR_NO_ACTIVE_ELECTION, http_status: 422, applies_to: ["POST /fsa/enrollments/{id}/submit"] }
  - { priority: 11, category: business_referential, check: "Enrollment.submit: AcreageReport for (farm, year) is CERTIFIED", error_id: ERR_ACREAGE_NOT_CERTIFIED, http_status: 422, applies_to: ["POST /fsa/enrollments/{id}/submit"] }
  - { priority: 12, category: business_constraint,  check: "Segregation of duties: approver/reviewer producer id != filer/submitter producer id", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: ["POST /fsa/acreage-reports/{id}/certify", "POST /fsa/enrollments/{id}/ced-approve", "POST /fsa/enrollments/{id}/certify", "POST /fsa/disaster-applications/{id}/approve", "POST /fsa/appeals/{id}/uphold", "POST /fsa/appeals/{id}/reverse", "POST /fsa/appeals/{id}/remand"] }
  - { priority: 13, category: business_constraint,  check: "Field.acres sum on a tract <= tract.cropland_acres", error_id: ERR_CROPLAND_EXCEEDED, http_status: 422, applies_to: ["POST /fsa/tracts/{id}/fields"] }
  - { priority: 14, category: business_constraint,  check: "FarmMembership.share_percent sums across a farm's ACTIVE memberships to exactly 100.00", error_id: ERR_SHARE_SUM_INVALID, http_status: 422, applies_to: ["POST /fsa/farms/{id}/memberships"] }
  - { priority: 15, category: business_constraint,  check: "Reconstitution conserves base acres: |sum(product)-sum(source)| <= 0.01", error_id: ERR_BASE_ACRE_IMBALANCE, http_status: 422, applies_to: ["POST /fsa/farms/{id}/reconstitutions"] }
  - { priority: 16, category: business_fiscal,      check: "DisasterApplication approve: loss_acres >= 0.35 * reported acres for qualifying_commodity", error_id: ERR_LOSS_THRESHOLD_NOT_MET, http_status: 422, applies_to: ["POST /fsa/disaster-applications/{id}/approve"] }
  - { priority: 17, category: business_fiscal,      check: "Payment limitation: computed payment may not exceed Producer.payment_limitation_cap_cents attributable share", error_id: ERR_PAYMENT_LIMITATION_EXCEEDED, http_status: 422, applies_to: ["POST /fsa/enrollments/{id}/compute-payment"] }
  - { priority: 18, category: business_constraint,  check: "AcreageReportLine.planted_acres + prevented_planted_acres <= parent Field.acres", error_id: ERR_LINE_ACRES_EXCEED_FIELD, http_status: 422, applies_to: ["POST /fsa/acreage-reports/{id}/lines"] }
  - { priority: 19, category: business_constraint,  check: "YieldRecord update/recertify: update_window_open must still be true (one-time window)", error_id: ERR_YIELD_UPDATE_WINDOW_CLOSED, http_status: 422, applies_to: ["POST /fsa/yield-records/{id}/updates"] }
  - { priority: 20, category: business_constraint,  check: "Request body carries every required field with a well-typed value; enum fields carry a declared member", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Farms ---
  - { method: POST,   path: "/fsa/farms",                                   roles: [CountySpecialist], code: 201, input: [farm_number, county_code, program_year, "arc_co_ic_indicator?"], output: Farm, side_effects: ["farm_status=ACTIVE"], description: "Create a farm record" }
  - { method: GET,    path: "/fsa/farms/{farm_id}",                         roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: Farm, side_effects: [], description: "Get farm" }
  - { method: GET,    path: "/fsa/farms",                                   roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: ["county_code?", "program_year?", "limit?", "offset?"], output: "Farm[]", side_effects: [], description: "List farms (paginated)" }
  - { method: POST,   path: "/fsa/farms/{farm_id}/retire",                  roles: [CountyExecutiveDirector], code: 200, input: [], output: Farm, side_effects: ["memberships -> REMOVED"], description: "Retire a farm (terminal)" }

  # --- Producers ---
  - { method: POST,   path: "/fsa/producers",                               roles: [CountySpecialist], code: 201, input: [producer_name, tax_id_last4, entity_type], output: Producer, side_effects: ["agi_attestation_status=NOT_FILED","conservation_status=PENDING"], description: "Register a producer" }
  - { method: GET,    path: "/fsa/producers/{producer_id}",                 roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: Producer, side_effects: [], description: "Get producer" }
  - { method: GET,    path: "/fsa/producers",                               roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: ["entity_type?", "limit?", "offset?"], output: "Producer[]", side_effects: [], description: "List producers" }
  - { method: POST,   path: "/fsa/producers/{producer_id}/agi-attestations", roles: [Producer],        code: 201, input: [adjusted_gross_income], output: Producer, side_effects: ["agi_attestation_status -> FILED"], description: "File AGI attestation" }
  - { method: POST,   path: "/fsa/producers/{producer_id}/agi-attestations/verify", roles: [CountySpecialist], code: 200, input: [], output: Producer, side_effects: ["agi_attestation_status -> VERIFIED"], description: "Verify AGI attestation" }
  - { method: POST,   path: "/fsa/producers/{producer_id}/agi-attestations/flag-noncompliant", roles: [CountySpecialist], code: 200, input: [], output: Producer, side_effects: ["agi_attestation_status -> NONCOMPLIANT"], description: "Flag AGI noncompliant" }
  - { method: POST,   path: "/fsa/producers/{producer_id}/conservation-certifications", roles: [Producer], code: 201, input: ["remediation_plan?"], output: Producer, side_effects: ["conservation_status -> CERTIFIED"], description: "File conservation compliance cert" }
  - { method: POST,   path: "/fsa/producers/{producer_id}/conservation-violations", roles: [CountyExecutiveDirector], code: 201, input: [violation_code], output: Producer, side_effects: ["conservation_status -> VIOLATION"], description: "Record a conservation violation" }
  - { method: POST,   path: "/fsa/producers/{producer_id}/conservation-exemptions", roles: [CountyExecutiveDirector], code: 201, input: [exemption_reason], output: Producer, side_effects: ["conservation_status -> EXEMPT"], description: "Grant conservation exemption" }

  # --- Memberships ---
  - { method: POST,   path: "/fsa/farms/{farm_id}/memberships",             roles: [CountySpecialist], code: 201, input: [producer_id, share_percent, "is_spouse_pair?"], output: FarmMembership, side_effects: ["share-percent sum validated"], description: "Add a producer to a farm with a share" }
  - { method: GET,    path: "/fsa/farms/{id}/memberships",             roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: "FarmMembership[]", side_effects: [], description: "List memberships on a farm" }
  - { method: GET,    path: "/fsa/memberships",                             roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: ["producer_id?", "farm_id?"], output: "FarmMembership[]", side_effects: [], description: "List memberships filtered by producer or farm" }
  - { method: GET,    path: "/fsa/memberships/{membership_id}",             roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: FarmMembership, side_effects: [], description: "Get a membership" }
  - { method: DELETE, path: "/fsa/memberships/{membership_id}",             roles: [CountySpecialist], code: 204, input: [], output: null, side_effects: ["membership_status -> REMOVED"], description: "Remove a membership" }

  # --- Tracts / Fields ---
  - { method: POST,   path: "/fsa/farms/{farm_id}/tracts",                  roles: [CountySpecialist], code: 201, input: [tract_number, base_acres, cropland_acres], output: Tract, side_effects: ["farm.total_base_acres recomputed"], description: "Add a tract to a farm" }
  - { method: GET,    path: "/fsa/farms/{id}/tracts",                  roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: "Tract[]", side_effects: [], description: "List tracts on a farm" }
  - { method: GET,    path: "/fsa/tracts/{tract_id}",                       roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: Tract, side_effects: [], description: "Get a tract" }
  - { method: GET,    path: "/fsa/tracts",                                  roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: ["farm_id?", "reconstituted_from_tract_id?"], output: "Tract[]", side_effects: [], description: "List tracts filtered by farm or reconstitution source" }
  - { method: POST,   path: "/fsa/tracts/{tract_id}/fields",                roles: [CountySpecialist], code: 201, input: [field_number, acres], output: Field, side_effects: [], description: "Add a field to a tract" }
  - { method: GET,    path: "/fsa/tracts/{id}/fields",                roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: "Field[]", side_effects: [], description: "List fields on a tract" }
  - { method: GET,    path: "/fsa/fields/{field_id}",                       roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: Field, side_effects: [], description: "Get a field" }
  - { method: GET,    path: "/fsa/fields/{id}/acreage-report-lines",        roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: "AcreageReportLine[]", side_effects: [], description: "List report lines referencing a field" }

  # --- Reconstitution ---
  - { method: POST,   path: "/fsa/farms/{farm_id}/reconstitutions",         roles: [CountySpecialist], code: 201, input: [method, source_tract_ids, product_specs, expected_farm_version], output: Farm, side_effects: ["farm RECONSTITUTION_PENDING; product tracts created; Farm.version += 1"], description: "Open a reconstitution (DIVIDE or COMBINE); OCC-guarded" }
  - { method: POST,   path: "/fsa/farms/{farm_id}/finalize-reconstitution", roles: [CountySpecialist], code: 200, input: [], output: Farm, side_effects: ["farm -> ACTIVE; Farm.version += 1"], description: "Finalize a balanced reconstitution" }
  - { method: POST,   path: "/fsa/farms/{farm_id}/reconstitutions/{recon_id}/cancel", roles: [CountySpecialist], code: 200, input: [], output: Farm, side_effects: ["reconstitution rolled back"], description: "Cancel a pending reconstitution" }

  # --- Acreage Reports ---
  - { method: POST,   path: "/fsa/farms/{farm_id}/acreage-reports",         roles: [Producer],         code: 201, input: [program_year], output: AcreageReport, side_effects: ["report_status=DRAFT"], description: "Open an acreage report" }
  - { method: GET,    path: "/fsa/acreage-reports/{report_id}",             roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: AcreageReport, side_effects: [], description: "Get acreage report" }
  - { method: GET,    path: "/fsa/farms/{id}/acreage-reports",         roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: ["program_year?"], output: "AcreageReport[]", side_effects: [], description: "List reports for a farm" }
  - { method: POST,   path: "/fsa/acreage-reports/{report_id}/lines",       roles: [Producer],         code: 201, input: [field_id, crop_code, planted_acres, prevented_planted_acres, intended_use], output: AcreageReportLine, side_effects: ["report.reported_acres recomputed"], description: "Add a line to a report" }
  - { method: GET,    path: "/fsa/acreage-reports/{id}/lines",       roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: "AcreageReportLine[]", side_effects: [], description: "List lines on a report" }
  - { method: POST,   path: "/fsa/acreage-reports/{report_id}/file",        roles: [Producer],         code: 200, input: [], output: AcreageReport, side_effects: ["filed_at stamped; status FILED or LATE_FILED by clock"], description: "File the report (deadline-aware)" }
  - { method: POST,   path: "/fsa/acreage-reports/{report_id}/certify",     roles: [CountySpecialist], code: 200, input: [], output: AcreageReport, side_effects: ["status -> CERTIFIED"], description: "Certify a filed report (SoD)" }
  - { method: POST,   path: "/fsa/acreage-reports/{report_id}/reject",      roles: [CountySpecialist], code: 200, input: [reason], output: AcreageReport, side_effects: ["status -> REJECTED"], description: "Reject a report" }
  - { method: POST,   path: "/fsa/acreage-reports/{report_id}/reopen",      roles: [CountySpecialist], code: 200, input: [], output: AcreageReport, side_effects: ["CERTIFIED -> FILED"], description: "Reopen a certified report" }

  # --- Program Elections ---
  - { method: POST,   path: "/fsa/farms/{farm_id}/program-elections",       roles: [Producer],         code: 201, input: [program_year, commodity, election_code, expected_farm_version], output: ProgramElection, side_effects: ["prior election SUPERSEDED; Farm.version += 1"], description: "Create/supersede a program election (OCC-guarded)" }
  - { method: GET,    path: "/fsa/program-elections/{election_id}",         roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: ProgramElection, side_effects: [], description: "Get an election" }
  - { method: GET,    path: "/fsa/program-elections/{id}/enrollments",      roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: "Enrollment[]", side_effects: [], description: "List enrollments that pinned a given election" }
  - { method: GET,    path: "/fsa/farms/{id}/program-elections",       roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: ["program_year?", "commodity?"], output: "ProgramElection[]", side_effects: [], description: "List elections for a farm" }
  - { method: POST,   path: "/fsa/program-elections/{election_id}/withdraw", roles: [Producer],        code: 200, input: [], output: ProgramElection, side_effects: ["status -> WITHDRAWN"], description: "Withdraw an election while window open" }

  # --- Yield Records ---
  - { method: POST,   path: "/fsa/farms/{farm_id}/yield-records",           roles: [CountySpecialist], code: 201, input: [commodity], output: YieldRecord, side_effects: ["PROVISIONAL; aph computed from observations"], description: "Create a yield record" }
  - { method: GET,    path: "/fsa/yield-records/{record_id}",               roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: YieldRecord, side_effects: [], description: "Get yield record" }
  - { method: GET,    path: "/fsa/yield-records/{id}/enrollments",          roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: "Enrollment[]", side_effects: [], description: "List enrollments that pinned a given yield record" }
  - { method: GET,    path: "/fsa/farms/{id}/yield-records",           roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: ["commodity?"], output: "YieldRecord[]", side_effects: [], description: "List yield records for a farm" }
  - { method: POST,   path: "/fsa/yield-records/{record_id}/observations",  roles: [CountySpecialist], code: 201, input: [crop_year, "actual_yield_bu_per_acre?"], output: YieldObservation, side_effects: ["aph recomputed"], description: "Append a yield observation" }
  - { method: GET,    path: "/fsa/yield-records/{id}/observations",  roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: "YieldObservation[]", side_effects: [], description: "List observations on a record" }
  - { method: POST,   path: "/fsa/yield-records/{record_id}/updates",       roles: [Producer],         code: 200, input: [], output: YieldRecord, side_effects: ["PROVISIONAL->UPDATED; update_window_open=false"], description: "Trigger one-time APH update" }
  - { method: POST,   path: "/fsa/yield-records/{record_id}/certify",       roles: [CountySpecialist], code: 200, input: [], output: YieldRecord, side_effects: ["UPDATED->CERTIFIED"], description: "Certify a yield record" }

  # --- Enrollments ---
  - { method: POST,   path: "/fsa/farms/{farm_id}/enrollments",             roles: [Producer],         code: 201, input: [program_year, commodity], output: Enrollment, side_effects: ["DRAFT"], description: "Open an enrollment" }
  - { method: GET,    path: "/fsa/enrollments/{enrollment_id}",             roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: Enrollment, side_effects: [], description: "Get enrollment" }
  - { method: GET,    path: "/fsa/enrollments/{id}/appeals",                roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: "Appeal[]", side_effects: [], description: "List appeals against a given enrollment" }
  - { method: GET,    path: "/fsa/farms/{id}/enrollments",             roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: ["program_year?", "enrollment_status?"], output: "Enrollment[]", side_effects: [], description: "List enrollments for a farm" }
  - { method: POST,   path: "/fsa/enrollments/{enrollment_id}/submit",      roles: [Producer],         code: 200, input: [], output: Enrollment, side_effects: ["DRAFT->SUBMITTED"], description: "Submit an enrollment" }
  - { method: POST,   path: "/fsa/enrollments/{enrollment_id}/ced-approve", roles: [CountyExecutiveDirector], code: 200, input: [], output: Enrollment, side_effects: ["SUBMITTED->CED_APPROVED"], description: "CED approval (AGI + conservation gates)" }
  - { method: POST,   path: "/fsa/enrollments/{enrollment_id}/certify",     roles: [CountyCommittee],  code: 200, input: [], output: Enrollment, side_effects: ["CED_APPROVED->CERTIFIED; pins election & yield"], description: "Committee certification (pins election+yield)" }
  - { method: POST,   path: "/fsa/enrollments/{enrollment_id}/compute-payment", roles: [CountySpecialist], code: 200, input: [national_my_price, "county_actual_yield?", "benchmark_revenue?"], output: Enrollment, side_effects: ["CERTIFIED->PAYMENT_COMPUTED; payment & sequestration computed"], description: "Compute payment (PLC or ARC-CO per pinned election)" }
  - { method: POST,   path: "/fsa/enrollments/{enrollment_id}/issue-payment", roles: [CountyExecutiveDirector], code: 200, input: [], output: Enrollment, side_effects: ["PAYMENT_COMPUTED->PAYMENT_ISSUED"], description: "Issue payment" }
  - { method: POST,   path: "/fsa/enrollments/{enrollment_id}/recertify",   roles: [CountyCommittee],  code: 200, input: [], output: Enrollment, side_effects: ["REMANDED->CERTIFIED"], description: "Recertify after remand" }
  - { method: POST,   path: "/fsa/enrollments/{enrollment_id}/void",        roles: [Producer],         code: 200, input: [], output: Enrollment, side_effects: ["DRAFT/SUBMITTED->VOID"], description: "Void an enrollment" }

  # --- Disaster Applications ---
  - { method: POST,   path: "/fsa/farms/{farm_id}/disaster-applications",   roles: [Producer],         code: 201, input: [program_year, disaster_type, loss_acres, qualifying_commodity, "documentation_complete?"], output: DisasterApplication, side_effects: ["DRAFT"], description: "Open a disaster application" }
  - { method: GET,    path: "/fsa/disaster-applications/{app_id}",          roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: DisasterApplication, side_effects: [], description: "Get disaster application" }
  - { method: GET,    path: "/fsa/farms/{id}/disaster-applications",   roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: ["program_year?"], output: "DisasterApplication[]", side_effects: [], description: "List disaster applications for a farm" }
  - { method: POST,   path: "/fsa/disaster-applications/{app_id}/file",     roles: [Producer],         code: 200, input: [], output: DisasterApplication, side_effects: ["DRAFT->FILED"], description: "File disaster application" }
  - { method: POST,   path: "/fsa/disaster-applications/{app_id}/assign-reviewer", roles: [CountyExecutiveDirector], code: 200, input: [], output: DisasterApplication, side_effects: ["FILED->UNDER_REVIEW"], description: "Assign reviewer" }
  - { method: POST,   path: "/fsa/disaster-applications/{app_id}/approve",  roles: [CountyCommittee],  code: 200, input: [], output: DisasterApplication, side_effects: ["UNDER_REVIEW->APPROVED; yield substitution cascade"], description: "Approve (35% threshold gate; SoD)" }
  - { method: POST,   path: "/fsa/disaster-applications/{app_id}/deny",     roles: [CountyCommittee],  code: 200, input: [reason], output: DisasterApplication, side_effects: ["UNDER_REVIEW->DENIED"], description: "Deny" }
  - { method: POST,   path: "/fsa/disaster-applications/{app_id}/withdraw", roles: [Producer],         code: 200, input: [], output: DisasterApplication, side_effects: ["DRAFT/FILED->WITHDRAWN"], description: "Withdraw" }

  # --- Appeals ---
  - { method: POST,   path: "/fsa/appeals",                                 roles: [Producer],         code: 201, input: [farm_id, enrollment_id, ground_code, filed_by_producer_id], output: Appeal, side_effects: ["enrollment -> ON_APPEAL"], description: "File an appeal" }
  - { method: GET,    path: "/fsa/appeals/{appeal_id}",                     roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: [], output: Appeal, side_effects: [], description: "Get appeal" }
  - { method: GET,    path: "/fsa/appeals",                                 roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: ["farm_id?", "enrollment_id?", "remands_appeal_id?", "filed_by_producer_id?", "assigned_reviewer_producer_id?"], output: "Appeal[]", side_effects: [], description: "List appeals filtered by farm/enrollment/remand/filer/reviewer" }
  - { method: GET,    path: "/fsa/farms/{id}/appeals",                 roles: [Producer, CountySpecialist, CountyExecutiveDirector, CountyCommittee],              code: 200, input: ["appeal_status?"], output: "Appeal[]", side_effects: [], description: "List appeals for a farm" }
  - { method: POST,   path: "/fsa/appeals/{appeal_id}/assign-ced",          roles: [CountyExecutiveDirector], code: 200, input: [], output: Appeal, side_effects: ["FILED->CED_REVIEW"], description: "Assign to CED" }
  - { method: POST,   path: "/fsa/appeals/{appeal_id}/refer-to-committee",  roles: [CountyExecutiveDirector], code: 200, input: [assigned_reviewer_producer_id], output: Appeal, side_effects: ["CED_REVIEW->COMMITTEE_HEARING"], description: "Refer to committee" }
  - { method: POST,   path: "/fsa/appeals/{appeal_id}/uphold",              roles: [CountyCommittee],  code: 200, input: [], output: Appeal, side_effects: ["COMMITTEE_HEARING->UPHELD; enrollment restored"], description: "Uphold original determination" }
  - { method: POST,   path: "/fsa/appeals/{appeal_id}/reverse",             roles: [CountyCommittee],  code: 200, input: ["corrected_payment_cents?"], output: Appeal, side_effects: ["COMMITTEE_HEARING->REVERSED; payment recomputed"], description: "Reverse determination" }
  - { method: POST,   path: "/fsa/appeals/{appeal_id}/remand",              roles: [CountyCommittee],  code: 200, input: [remand_instructions], output: Appeal, side_effects: ["COMMITTEE_HEARING->REMANDED; enrollment -> REMANDED"], description: "Remand for recertification" }
  - { method: POST,   path: "/fsa/appeals/{appeal_id}/close",               roles: [Producer],         code: 200, input: [], output: Appeal, side_effects: ["FILED/CED_REVIEW->CLOSED"], description: "Close (withdraw) an appeal" }

  # --- Test-driving clock ---
  - { method: POST,   path: "/fsa/_clock/set_current_utc",                  roles: [CountySpecialist], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced"], description: "Set the logical clock. Server default startup time is 2026-08-01T00:00:00Z; before any set_current_utc call the clock reads exactly this default and never falls back to wall-clock time." }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,           http: 401, condition: "Missing or malformed X-User-Role / X-User-ID" }
  - { id: ERR_UNAUTHORIZED,              http: 403, condition: "Role lacks permission for the endpoint" }
  - { id: ERR_NOT_FOUND,                 http: 404, condition: "Path id or FK reference does not resolve" }
  - { id: ERR_INVALID_STATE,             http: 409, condition: "Target resource not in a state allowing the transition" }
  - { id: ERR_STALE_FARM_VERSION,        http: 412, condition: "expected_farm_version does not match current Farm.version (OCC)" }
  - { id: ERR_INVALID_REQUEST,           http: 400, condition: "Missing required field, invalid enum, or malformed value" }
  - { id: ERR_ACREAGE_DEADLINE_PASSED,   http: 422, condition: "File attempted after deadline + 30-day late window" }
  - { id: ERR_ELECTION_WINDOW_CLOSED,    http: 422, condition: "Election create/supersede/withdraw after 2026-03-16 deadline" }
  - { id: ERR_CONSERVATION_NOT_CERTIFIED, http: 422, condition: "Producer conservation_status not in {CERTIFIED, EXEMPT} at CED approval" }
  - { id: ERR_AGI_INELIGIBLE,            http: 422, condition: "AGI attestation not VERIFIED or AGI exceeds 90000000 cents" }
  - { id: ERR_NO_ACTIVE_ELECTION,        http: 422, condition: "No ACTIVE ProgramElection for (farm, year, commodity) at submit" }
  - { id: ERR_ACREAGE_NOT_CERTIFIED,     http: 422, condition: "AcreageReport for (farm, year) not CERTIFIED at submit" }
  - { id: ERR_SEGREGATION_OF_DUTIES,     http: 422, condition: "Approver/reviewer is the same producer as filer/submitter" }
  - { id: ERR_CROPLAND_EXCEEDED,         http: 422, condition: "Sum of Field.acres would exceed tract.cropland_acres" }
  - { id: ERR_SHARE_SUM_INVALID,         http: 422, condition: "Membership share_percent sum on a farm != 100.00" }
  - { id: ERR_BASE_ACRE_IMBALANCE,       http: 422, condition: "Reconstitution products' base acres do not conserve source sum within 0.01" }
  - { id: ERR_LOSS_THRESHOLD_NOT_MET,    http: 422, condition: "Disaster loss_acres < 35% of reported acres for the commodity" }
  - { id: ERR_PAYMENT_LIMITATION_EXCEEDED, http: 422, condition: "Computed payment exceeds producer payment-limitation cap" }
  - { id: ERR_LINE_ACRES_EXCEED_FIELD,   http: 422, condition: "Report line planted+prevented acres exceed parent field acres" }
  - { id: ERR_YIELD_UPDATE_WINDOW_CLOSED, http: 422, condition: "APH one-time update window already consumed" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Producer
    description: "A farmer/operator acting on their own farm records"
    identity: "entity_backed:Producer"
    exclusive_operations:
      - "POST /fsa/farms/{farm_id}/acreage-reports"
      - "POST /fsa/acreage-reports/{id}/lines"
      - "POST /fsa/acreage-reports/{id}/file"
      - "POST /fsa/farms/{farm_id}/program-elections"
      - "POST /fsa/program-elections/{id}/withdraw"
      - "POST /fsa/yield-records/{id}/updates"
      - "POST /fsa/farms/{farm_id}/enrollments"
      - "POST /fsa/enrollments/{id}/submit"
      - "POST /fsa/enrollments/{id}/void"
      - "POST /fsa/farms/{farm_id}/disaster-applications"
      - "POST /fsa/disaster-applications/{id}/file"
      - "POST /fsa/disaster-applications/{id}/withdraw"
      - "POST /fsa/appeals"
      - "POST /fsa/appeals/{id}/close"
      - "POST /fsa/producers/{id}/agi-attestations"
      - "POST /fsa/producers/{id}/conservation-certifications"
    shared_operations: ["GET on any resource"]

  - name: CountySpecialist
    description: "FSA county office program specialist (record keeping, certification prep)"
    identity: "opaque"
    exclusive_operations:
      - "POST /fsa/farms"
      - "POST /fsa/producers"
      - "POST /fsa/farms/{farm_id}/tracts"
      - "POST /fsa/tracts/{tract_id}/fields"
      - "POST /fsa/farms/{farm_id}/memberships"
      - "DELETE /fsa/memberships/{id}"
      - "POST /fsa/farms/{farm_id}/reconstitutions"
      - "POST /fsa/farms/{farm_id}/finalize-reconstitution"
      - "POST /fsa/farms/{farm_id}/reconstitutions/{id}/cancel"
      - "POST /fsa/acreage-reports/{id}/certify"
      - "POST /fsa/acreage-reports/{id}/reject"
      - "POST /fsa/acreage-reports/{id}/reopen"
      - "POST /fsa/farms/{farm_id}/yield-records"
      - "POST /fsa/yield-records/{id}/observations"
      - "POST /fsa/yield-records/{id}/certify"
      - "POST /fsa/enrollments/{id}/compute-payment"
      - "POST /fsa/producers/{id}/agi-attestations/verify"
      - "POST /fsa/producers/{id}/agi-attestations/flag-noncompliant"
      - "POST /fsa/_clock/set_current_utc"
    shared_operations: ["GET on any resource"]

  - name: CountyExecutiveDirector
    description: "CED — approves enrollments, assigns reviewers, handles exceptions"
    identity: "opaque"
    exclusive_operations:
      - "POST /fsa/enrollments/{id}/ced-approve"
      - "POST /fsa/enrollments/{id}/issue-payment"
      - "POST /fsa/farms/{farm_id}/retire"
      - "POST /fsa/disaster-applications/{id}/assign-reviewer"
      - "POST /fsa/producers/{id}/conservation-violations"
      - "POST /fsa/producers/{id}/conservation-exemptions"
      - "POST /fsa/appeals/{id}/assign-ced"
      - "POST /fsa/appeals/{id}/refer-to-committee"
    shared_operations: ["GET on any resource"]

  - name: CountyCommittee
    description: "Elected county committee — final certification and adjudication"
    identity: "entity_backed:Producer"
    exclusive_operations:
      - "POST /fsa/enrollments/{id}/certify"
      - "POST /fsa/enrollments/{id}/recertify"
      - "POST /fsa/disaster-applications/{id}/approve"
      - "POST /fsa/disaster-applications/{id}/deny"
      - "POST /fsa/appeals/{id}/uphold"
      - "POST /fsa/appeals/{id}/reverse"
      - "POST /fsa/appeals/{id}/remand"
    shared_operations: ["GET on any resource"]
