  - section: errors
    instances:
      - name: players_list_with_limit_101_returns_400_invalid_pagination
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "The pagination envelope is validated against a closed 1..100 band before any filter runs, and both edges must be exercised: limit 100 is admissible and limit 101 is not, limit 0 is refused from below. The refusal is a 400 on the query envelope, not a 422 business error, and it must fire even though the query itself is otherwise well-formed and the caller's role can read the collection."
        test_recipe:
          setup:
            - "One section with one player exists, so a valid page would be non-empty and cannot be confused with an empty result."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_pa1
          trigger:
            - call: "GET /tennis/players"
              payload: {limit: 101, offset: 0}
              as: SectionAdmin
          assert:
            - "HTTP 400"
            - "$.data.error_id == 'ERR_INVALID_PAGINATION'"
            - "a follow-up GET /tennis/players with limit=100 returns HTTP 200 with $.data.limit == 100 and $.data.total_count == 1"
            - "a follow-up GET /tennis/players with limit=0 returns HTTP 400 with $.data.error_id == 'ERR_INVALID_PAGINATION'"
            - "a follow-up GET /tennis/players with offset=-1 returns HTTP 400 with $.data.error_id == 'ERR_INVALID_PAGINATION'"
            - "a follow-up GET /tennis/players with no pagination parameters returns $.data.limit == 10, $.data.offset == 0 and $.data.has_more == false"

      - name: unauthenticated_player_read_returns_401_missing_role_header
        claim_type: Violation → Error
        grounds:
          - errors[ERR_MISSING_ROLE_HEADER]
        distinguishing_aspect: "Authentication is resolved before resource existence and before role permission, so a request with no X-User-Role header must 401 on the header even when the target id resolves and the collection is readable by every role. An implementation that defaults an absent header to a role, or that reports 404/403 first, fails."
        test_recipe:
          setup:
            - "A player exists and would be readable by any of the six roles. The trigger request carries no X-User-Role header at all."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_pa1
          trigger:
            - call: "GET /tennis/players/${pa1_id}"
              as: null
          assert:
            - "HTTP 401"
            - "$.data.error_id == 'ERR_MISSING_ROLE_HEADER'"
            - "$.data.error_id != 'ERR_MISSING_USER_ID' because the role header is resolved first"
            - "the same GET /tennis/players/${pa1_id} sent with an empty X-User-Role header also returns HTTP 401 with $.data.error_id == 'ERR_MISSING_ROLE_HEADER'"
            - "the same GET /tennis/players/${pa1_id} as SectionAdmin returns HTTP 200 with $.data.id == '${pa1_id}'"

      - name: player_read_with_an_invalid_role_header_returns_401_unknown_role
        claim_type: Violation → Error
        grounds:
          - errors[ERR_UNKNOWN_ROLE]
        distinguishing_aspect: "A syntactically present but unrecognised role is a 401 on identity, not the 403 an unpermitted-but-known role would get. The distinction is the whole point: ERR_UNKNOWN_ROLE means the header value is not one of the six declared roles, while ERR_ROLE_NOT_PERMITTED means it is a real role that this endpoint does not list."
        test_recipe:
          setup:
            - "A player exists. The trigger sends X-User-Role: Referee, a value that is not one of the six roles in the RBAC matrix."
          setup_api_calls:
            - *c_t0
            - *a_sec
            - *a_pa1
          trigger:
            - call: "GET /tennis/players/${pa1_id}"
              as: Referee
          assert:
            - "HTTP 401"
            - "$.data.error_id == 'ERR_UNKNOWN_ROLE'"
            - "$.data.error_id != 'ERR_ROLE_NOT_PERMITTED' because an unrecognised role never reaches the endpoint's role list"
            - "a follow-up GET /tennis/players/${pa1_id} as CommitteeChair returns HTTP 200, showing the read itself is broadly permitted"

      - name: clock_set_backwards_returns_422_clock_not_monotonic
        claim_type: Violation → Error
        grounds:
          - errors[ERR_CLOCK_NOT_MONOTONIC]
        distinguishing_aspect: "The logical clock is monotone non-decreasing: strictly earlier is refused, equal is accepted. Re-stamping the same instant must therefore succeed while one second earlier must not, and a refused move must leave the clock where it was — every later timestamp assertion in the suite depends on that."
        test_recipe:
          setup:
            - "The logical clock has been set to 2026-08-01T00:00:00Z and a section exists."
          setup_api_calls:
            - *c_t0
            - *a_sec
          trigger:
            - call: "POST /tennis/_clock/set_current_utc"
              payload: {current_utc: "2026-07-31T23:59:59Z"}
              as: SectionAdmin
          assert:
            - "HTTP 422"
            - "$.data.error_id == 'ERR_CLOCK_NOT_MONOTONIC'"
            - "a follow-up POST /tennis/_clock/set_current_utc with current_utc 2026-08-01T00:00:00Z returns HTTP 200 because equal is not earlier"
            - "a follow-up POST /tennis/players creating a player in ${sec_id} returns $.data.created_at == '2026-08-01T00:00:00Z', proving the refused move did not roll the clock back"

