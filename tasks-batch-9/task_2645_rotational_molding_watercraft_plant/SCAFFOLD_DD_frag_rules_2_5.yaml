            - "ResinLot LOT-ZONE qualified for the model with received_kg 500.000; ProductionOrder PO-ZONE (ordered_qty 4, no demand_bucket_id, so §1.4 priorities 69 and 74 are vacuous) released and run through one cycle to DEMOLDED, minting hull_serials PO-ZONE-01-0001 .. PO-ZONE-04-0004."
            - "All four hulls are trimmed, outfitted (HK-ZONE-0001 .. HK-ZONE-0004) and inspected PASS with wall_cv_pct 1.08 <= wall_cv_max_pct 12.00 and final_warpage_index 0.000, so all four are SELLABLE and UNALLOCATED; PO-ZONE reaches completed_qty 4 and status COMPLETE."
            - "Hulls 1, 2 and 3 are then STORED in that order at 13:00, 13:05 and 13:10 (distinct stored_at values, so the promotion tie-break is unambiguous): hull 1 is charged the full 2.0000 and becomes the Z-A anchor (Z-A remaining_after 2.0000 beat Z-B remaining_after 8.0000 on the tighter-fit key while neither zone held an anchor); hull 2 is charged 1.0000 and is NOT an anchor because the anchor-affinity key outranks Z-B's looser fit; hull 3 is charged 1.0000, taking Z-A to exactly its 4.0000 capacity (remaining_after 0.0000 is still eligible)."
            - "At the end of setup Warehouse.committed_cube_m3 is 4.0000, utilization_pct round(4.0000 / 14.0000 * 100, 2) == 28.57 and posture NORMAL; hull 4 is still SELLABLE and UNALLOCATED."
