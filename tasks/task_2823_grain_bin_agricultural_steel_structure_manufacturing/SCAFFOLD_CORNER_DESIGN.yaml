  # =========================================================================
  # SECTION 2 - STATE MACHINES (claim-extraction-guide "From Table 2")
  # =========================================================================
  - section: state_machines
    instances:
      - name: every_stateful_entity_is_born_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines[Engineer].initial_state
          - state_machines[Dealer].initial_state
          - state_machines[BinDesign].initial_state
          - state_machines[DesignAnalysis].initial_state
          - state_machines[DealerOrder].initial_state
          - state_machines[CoilLot].initial_state
          - state_machines[RollFormingRun].initial_state
          - state_machines[FreightLoad].initial_state
          - state_machines[InstallationCrew].initial_state
          - state_machines[FieldFailure].initial_state
        distinguishing_aspect: "Ten state machines are seeded in one chain, so a single implementation that defaults a status column to the wrong literal - or that lets a client supply status on create - is caught for every machine at once. DealerOrder is the interesting row: it is born in three initial states at the same time (production DRAFT, financial AWAITING_DEPOSIT, installation UNASSIGNED) and the DesignAnalysis machine is boolean-encoded, so CURRENT must appear as superseded == false rather than as a status string."
        test_recipe:
          setup:
            - "Jurisdiction NE-WEST (seal_required false), GrainProfile CORN, CoatingSpec G115, RollFormingLine LINE_A (max_gauge_mm 3.0)."
            - "Logical clock at the default 2026-08-01T00:00:00Z, which is season OFFSEASON."
