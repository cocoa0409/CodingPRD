# =============================================================================
# Task 1880 — Scaffold Difficulty Design (Test Targeting Index, §1.8)
# 9 rules x 2 instances = 18 instances. All chains replay against SCAFFOLD.yaml.
# User ids: u_acct_1 / u_ctrl_1 / u_clerk_1 / u_tax_1 (opaque role identities).
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: book_vs_tax_period_amount_divergence
        grounds:
          - calculations.book_period_depreciation
          - calculations.tax_period_depreciation
          - entities.FixedAsset.fields.accumulated_book_cents
          - entities.FixedAsset.fields.accumulated_tax_cents
        distinguishing_aspect: |
          Same asset, same period 2026-01: the BOOK ledger (straight-line) posts 10000
          while the TAX ledger (MACRS-5 with 60% bonus elected) posts 34000 — one
          entity domain (FixedAsset depreciation), two valid algorithms, two numbers.
        test_recipe:
          setup:
            - "AssetClass MACH: threshold 250000, life 60, SL book, MACRS_5YR tax, bonus allowed"
            - "Asset A-100: cost 600000, salvage 0, bonus_elected true, in service 2026-01-10"
            - "Run 2026-01 posted"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: true }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-100", description: "Lathe", asset_class_id: "${cls}", acquisition_cost_cents: 600000, cost_center: "CC1", location: "PLANT-1", bonus_elected: true }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r1: $.data.id }
            - call: "POST /depreciation-runs/${r1}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "GET /depreciation-entries"
              payload: { asset_id: "${a}", ledger: "BOOK" }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { book_amt: "$.data[0].amount_cents" }
            - call: "GET /depreciation-entries"
              payload: { asset_id: "${a}", ledger: "TAX" }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { tax_amt: "$.data[0].amount_cents" }
          assert:
            - "BOOK entry: exactly 1 entry for period 2026-01, amount_cents == 10000 (600000/60)"
            - "TAX entry: exactly 1 entry for period 2026-01, amount_cents == 34000 (0.60*600000 + 0.40*600000*0.20 = 408000 annual, /12)"
            - "FixedAsset.${a}: accumulated_book_cents == 10000, accumulated_tax_cents == 34000, net_book_value_cents == 590000"

      - name: book_vs_tax_disposal_gain_loss_divergence
        grounds:
          - calculations.disposal_gain_loss
          - entities.Disposal.fields.book_gain_loss_cents
          - entities.Disposal.fields.tax_gain_loss_cents
        distinguishing_aspect: |
          The same SALE disposal reports book_gain_loss_cents == -70000 (net of BOOK
          depreciation and impairment) but tax_gain_loss_cents == -78565 (net of TAX
          depreciation only) — a dual-variant calculation on the Disposal entity
          domain, distinct from the per-period depreciation variant.
        test_recipe:
          setup:
            - "AssetClass VEH: threshold 250000, life 60, SL book, MACRS_7YR tax, no bonus"
            - "Asset A-200: cost 600000, in service 2026-01-05; runs 2026-01 and 2026-02 posted"
            - "Accumulated before disposal: BOOK 20000, TAX 14290 (85740/12 = 7145 per month)"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "VEH", name: "Vehicles", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_7YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-200", description: "Truck", asset_class_id: "${cls}", acquisition_cost_cents: 600000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-05" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r1: $.data.id }
            - call: "POST /depreciation-runs/${r1}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-02" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r2: $.data.id }
            - call: "POST /depreciation-runs/${r2}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /disposals"
              payload: { asset_id: "${a}", disposal_type: "SALE", proceeds_cents: 500000, effective_date: "2026-03-20" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { d: $.data.id }
            - call: "POST /disposals/${d}/approve"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
          trigger:
            - call: "POST /disposals/${d}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { book_gl: $.data.book_gain_loss_cents, tax_gl: $.data.tax_gain_loss_cents }
          assert:
            - "Disposal.${d}.book_gain_loss_cents == -70000 (500000 - (600000 - 30000 - 0); final March BOOK entry of 10000 applied first because day 20 >= 15)"
            - "Disposal.${d}.tax_gain_loss_cents == -78565 (500000 - (600000 - 21435); final March TAX entry of 7145 applied; impairment excluded from tax basis)"
            - "FixedAsset.${a}: status == DISPOSED, accumulated_book_cents == 30000, accumulated_tax_cents == 21435"
            - "Two DepreciationEntry rows with source == DISPOSAL_FINAL, disposal_id == ${d}, period == 2026-03 (BOOK 10000, TAX 7145)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: macrs_bonus_year1_combinatorial
        grounds:
          - calculations.tax_period_depreciation
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — acquisition cost,
          bonus election flag, tax-year index, and rate-table selection by tax method.
          Two identical-cost assets in the same class diverge purely on the bonus
          branch: 34000 vs 10000 for the same period.
        test_recipe:
          setup:
            - "AssetClass MACH (MACRS_5YR, bonus allowed)"
            - "Asset B-1 bonus_elected true; asset B-2 bonus_elected false; both cost 600000, in service 2026-01-10"
            - "Run 2026-01 posted"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: true }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "B-1", description: "Bonus asset", asset_class_id: "${cls}", acquisition_cost_cents: 600000, cost_center: "CC1", location: "PLANT-1", bonus_elected: true }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { b1: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "B-2", description: "Plain asset", asset_class_id: "${cls}", acquisition_cost_cents: 600000, cost_center: "CC1", location: "PLANT-1", bonus_elected: false }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { b2: $.data.id }
            - call: "POST /fixed-assets/${b1}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /fixed-assets/${b2}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r1: $.data.id }
            - call: "POST /depreciation-runs/${r1}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "GET /depreciation-entries"
              payload: { asset_id: "${b1}", ledger: "TAX" }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { b1_tax: "$.data[0].amount_cents" }
            - call: "GET /depreciation-entries"
              payload: { asset_id: "${b2}", ledger: "TAX" }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { b2_tax: "$.data[0].amount_cents" }
          assert:
            - "B-1 TAX entry amount_cents == 34000 (bonus branch: 600000*0.60 + 600000*0.40*0.20 = 408000/12)"
            - "B-2 TAX entry amount_cents == 10000 (standard branch: 600000*0.20 = 120000/12)"
            - "Both BOOK entries == 10000 — the bonus branch touches only the TAX ledger"
            - "Run ${r1}.entries_created_count == 4 (2 assets x 2 ledgers)"

      - name: per_month_rounding_final_plug
        grounds:
          - calculations.book_period_depreciation
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned — each month is rounded_half_up to
          integer cents from remaining basis over remaining months, and the final
          month takes the remainder plug; sum-then-round would drift. The pinned
          order yields the non-uniform sequence [33333, 33334, 33333] summing to
          exactly 100000.
        test_recipe:
          setup:
            - "AssetClass MACH; Asset R-1: cost 100000, salvage 0, useful_life_months 3 (override), SL book, in service 2026-01-10"
            - "Runs 2026-01, 2026-02, 2026-03 posted in order"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "R-1", description: "Rounding asset", asset_class_id: "${cls}", acquisition_cost_cents: 100000, cost_center: "CC1", location: "PLANT-1", useful_life_months: 3 }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r1: $.data.id }
            - call: "POST /depreciation-runs/${r1}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-02" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r2: $.data.id }
            - call: "POST /depreciation-runs/${r2}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-03" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r3: $.data.id }
            - call: "POST /depreciation-runs/${r3}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
          trigger:
            - call: "GET /depreciation-entries"
              payload: { asset_id: "${a}", ledger: "BOOK" }
              as: Controller
              as_user_id: u_ctrl_1
          assert:
            - "BOOK entries by period: 2026-01 == 33333 (round_half_up(100000/3)), 2026-02 == 33334 (round_half_up(66667/2)), 2026-03 == 33333 (final-month plug: 100000 - 66667)"
            - "FixedAsset.${a}.accumulated_book_cents == 100000 exactly — no rounding drift"
            - "FixedAsset.${a}.status == FULLY_DEPRECIATED after the 2026-03 run"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: disposal_reject_resubmit_revision_cycle
        grounds:
          - state_machines.Disposal
        distinguishing_aspect: |
          Disposal is non-linear: REQUESTED -> REJECTED -> REQUESTED revision loop
          plus the REQUESTED -> APPROVED -> POSTED fork; the resubmitted proceeds
          (450000, not the original 400000) drive the final gain/loss.
        test_recipe:
          setup:
            - "AssetClass VEH; Asset A-300 cost 600000 SL/60, in service 2026-01-05; runs 2026-01, 2026-02 posted (BOOK accumulated 20000)"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "VEH", name: "Vehicles", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_7YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-300", description: "Van", asset_class_id: "${cls}", acquisition_cost_cents: 600000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-05" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r1: $.data.id }
            - call: "POST /depreciation-runs/${r1}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-02" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r2: $.data.id }
            - call: "POST /depreciation-runs/${r2}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /disposals"
              payload: { asset_id: "${a}", disposal_type: "SALE", proceeds_cents: 400000, effective_date: "2026-03-20" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { d: $.data.id }
          trigger:
            - call: "POST /disposals/${d}/reject"
              payload: { reason: "price too low" }
              as: Controller
              as_user_id: u_ctrl_1
            - call: "POST /disposals/${d}/resubmit"
              payload: { proceeds_cents: 450000, effective_date: "2026-03-20" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /disposals/${d}/approve"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
            - call: "POST /disposals/${d}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { book_gl: $.data.book_gain_loss_cents }
          assert:
            - "Disposal.${d} traversed REQUESTED -> REJECTED -> REQUESTED -> APPROVED -> POSTED"
            - "Disposal.${d}.book_gain_loss_cents == -120000 (resubmitted proceeds 450000 - (600000 - 30000); March final entry 10000 applied, day 20 >= 15)"
            - "FixedAsset.${a}.status == DISPOSED"

      - name: inventory_recount_reconciling_cycle
        grounds:
          - state_machines.InventoryRun
          - calculations.inventory_line_reconciliation
        distinguishing_aspect: |
          InventoryRun is cyclic: COUNTING -> RECONCILING -> COUNTING -> RECONCILING
          -> CLOSED; the recount loop is what lets a LOCATION_MISMATCH line be
          re-counted into MATCHED before close.
        test_recipe:
          setup:
            - "AssetClass MACH; Asset A-400 cost 300000, in service 2026-01-10, location PLANT-1"
            - "Inventory run (scope ALL) seeds one PENDING line for the asset"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-400", description: "Press", asset_class_id: "${cls}", acquisition_cost_cents: 300000, cost_center: "CC1", location: "PLANT-1" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /inventory-runs"
              payload: { name: "FY26 count", scope_type: "ALL" }
              as: InventoryClerk
              as_user_id: u_clerk_1
              captures: { run: $.data.id }
            - call: "POST /inventory-runs/${run}/count-lines"
              payload: { asset_id: "${a}", found: true, counted_location: "PLANT-2" }
              as: InventoryClerk
              as_user_id: u_clerk_1
          trigger:
            - call: "POST /inventory-runs/${run}/begin-reconciliation"
              payload: {}
              as: InventoryClerk
              as_user_id: u_clerk_1
            - call: "POST /inventory-runs/${run}/recount"
              payload: {}
              as: InventoryClerk
              as_user_id: u_clerk_1
            - call: "POST /inventory-runs/${run}/count-lines"
              payload: { asset_id: "${a}", found: true, counted_location: "PLANT-1" }
              as: InventoryClerk
              as_user_id: u_clerk_1
            - call: "POST /inventory-runs/${run}/begin-reconciliation"
              payload: {}
              as: InventoryClerk
              as_user_id: u_clerk_1
            - call: "POST /inventory-runs/${run}/close"
              payload: {}
              as: Controller
              as_user_id: u_ctrl_1
          assert:
            - "Run status path: COUNTING -> RECONCILING -> COUNTING -> RECONCILING -> CLOSED"
            - "First count produced reconciliation_status == LOCATION_MISMATCH; recount produced MATCHED"
            - "Closed run: matched_count == 1, missing_count == 0, mismatch_count == 0"
            - "FixedAsset.${a}.open_inventory_exception == false after close"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: impairment_confirm_three_link_cascade
        grounds:
          - state_machines.ImpairmentReview
          - calculations.impairment_write_down
          - state_machines.FixedAsset
        distinguishing_aspect: |
          Depth-3 chain from the confirm trigger: review -> WRITTEN_DOWN with
          write_down posted to the asset (link 1); that posting recomputes
          net_book_value_cents and remaining depreciable basis (link 2); the
          basis reaching zero itself drives IN_SERVICE -> FULLY_DEPRECIATED
          (link 3) — each hop caused by the previous one, not by the request.
        test_recipe:
          setup:
            - "AssetClass MACH; Asset A-700 cost 120000, life 12 (override), SL, in service 2026-01-10"
            - "Run 2026-01 posted: accumulated_book 10000, net book value 110000"
            - "OPEN impairment review R (indicator MARKET_DECLINE) created by u_acct_1"
          setup_api_calls:
            - call: "POST /asset-classes"
              payload: { class_code: "MACH", name: "Machinery", capitalization_threshold_cents: 250000, default_useful_life_months: 60, book_method: "STRAIGHT_LINE", tax_method: "MACRS_5YR", bonus_depreciation_allowed: false }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { cls: $.data.id }
            - call: "POST /fixed-assets"
              payload: { asset_tag: "A-700", description: "Oven line", asset_class_id: "${cls}", acquisition_cost_cents: 120000, cost_center: "CC1", location: "PLANT-1", useful_life_months: 12 }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { a: $.data.id }
            - call: "POST /fixed-assets/${a}/place-in-service"
              payload: { in_service_date: "2026-01-10" }
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "POST /depreciation-runs"
              payload: { period: "2026-01" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r1: $.data.id }
            - call: "POST /depreciation-runs/${r1}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
            - call: "GET /fixed-assets/${a}"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { av: $.data.version }
            - call: "POST /impairment-reviews"
              payload: { asset_id: "${a}", indicator: "MARKET_DECLINE" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { rev: $.data.id }
          trigger:
            - call: "POST /impairment-reviews/${rev}/confirm"
              payload: { recoverable_value_cents: 0, expected_asset_version: "${av}" }
              as: Controller
              as_user_id: u_ctrl_1
              captures: { wd: $.data.write_down_cents }
            - call: "POST /depreciation-runs"
              payload: { period: "2026-02" }
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { r2: $.data.id }
            - call: "POST /depreciation-runs/${r2}/post"
              payload: {}
              as: AssetAccountant
              as_user_id: u_acct_1
              captures: { n2: $.data.entries_created_count }
          assert:
            - "ImpairmentReview.${rev}: status == WRITTEN_DOWN, write_down_cents == 110000 (NBV 110000 - recoverable 0)"
            - "FixedAsset.${a}: impairment_total_cents == 110000, net_book_value_cents == 0, remaining basis == 0"
            - "FixedAsset.${a}.status == FULLY_DEPRECIATED (auto-transition fired by the basis recompute, not by any direct asset call)"
            - "Run ${r2}.entries_created_count == 0 — a FULLY_DEPRECIATED asset is ineligible in later runs"

      - name: disposal_post_component_cascade
        grounds:
          - state_machines.Disposal
          - state_machines.FixedAsset
          - calculations.disposal_gain_loss
        distinguishing_aspect: |
          Depth-3 chain from the disposal-post trigger (different trigger than the
          impairment cascade): posting the parent's SALE flips the parent to
          DISPOSED (link 1); that transition auto-creates a companion POSTED SCRAP
          Disposal for each active component (link 2); each companion disposal
          itself posts final entries, computes its own gain/loss, and disposes the
          component asset (link 3).
        test_recipe:
          setup:
            - "AssetClass MACH (threshold 250000); Parent P cost 600000 SL/60, in service 2026-01-10"
