            - call: POST /production-lots/${lot_id}/sampling-plans
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { expected_lot_version: "${lot_v3}", plan_reason: "replay of the request that just succeeded" }
              captures: { err_replay: "$.data.error_id" }
            - call: POST /production-lots/${lot_id}/sampling-plans
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { expected_lot_version: "${lot_t_v}", plan_reason: "another lot's version token" }
              captures: { err_foreign_version: "$.data.error_id" }
          assert:
            - "The setup's first plan draw answers 201 with process_state \"LOT_TESTING\", sample_size 3, acceptance_number 0, sampling_plan_revision 1 and version 5 (create 1, three advances 2/3/4, plan draw 5 - the assembly create and the two verifications bump the ASSEMBLY's version, never the lot's)."
            - "HOLD answers 200 with env_hold_status \"HELD\", hold_reason \"OPERATOR_HOLD\" and version 6."
            - "The stale draw on the held lot answers 412 with error_id \"ERR_STALE_LOT_VERSION\" - NOT ERR_LOT_ENV_HELD, because OCC is priority 10 and the hold gate is priority 12."
            - "The refreshed read answers version 6, proving the failed 412 write did not bump the counter."
            - "The fresh-token draw on the still-held lot answers 409 with error_id \"ERR_LOT_ENV_HELD\", and a further read still answers version 6 - a failed 409 write does not bump the counter either."
            - "RELEASE_HOLD answers 200 with env_hold_status \"CLEAR\", hold_reason null and version 7."
            - "Replaying version 6 after the hold release answers 412 with error_id \"ERR_STALE_LOT_VERSION\" - the hold release itself invalidated the token even though it changed nothing the sampling plan depends on."
            - "The draw at version 7 answers 201 with sampling_plan_revision 2, sample_size still 3 and acceptance_number still 0 (retest_count is still 0, so the plan is redrawn identically), and version 8."
            - "Replaying version 7 immediately answers 412 with error_id \"ERR_STALE_LOT_VERSION\" and sampling_plan_revision stays 2 - the redraw is not idempotent."
            - "Supplying LOT-T's version 1 against LOT-S answers 412 with error_id \"ERR_STALE_LOT_VERSION\": the token is compared against THIS row's counter, and a smaller number is refused exactly like a larger one would be."
            - "LOT-T is untouched throughout: it is still PLANNED at version 1 with sample_size null."

      - name: battery_unit_occ_outranks_the_warranty_state_gate_and_the_event_time_gate
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[warranty-claim-create-stale-unit]
          - endpoints[POST /battery-units/{id}/warranty-claims]
          - endpoints[POST /battery-units/{id}/maintenance-logs]
          - errors[ERR_STALE_BATTERY_UNIT_VERSION]
          - errors[ERR_WARRANTY_STATE_INVALID]
          - errors[ERR_EVENT_TIME_OUT_OF_RANGE]
        distinguishing_aspect: "The unit's version is bumped by an endpoint the claimant never calls - every maintenance log, including a WATERING event that changes no warranty input at all, invalidates a held token. And because OCC is priority 10 while the warranty state gate is priority 11, a duplicate claim replayed with the SAME token answers 412 ERR_STALE_BATTERY_UNIT_VERSION, whereas the very same duplicate claim carrying a REFRESHED token answers 409 ERR_WARRANTY_STATE_INVALID. An implementation that checks 'is this unit claimable' before comparing versions inverts both codes."
