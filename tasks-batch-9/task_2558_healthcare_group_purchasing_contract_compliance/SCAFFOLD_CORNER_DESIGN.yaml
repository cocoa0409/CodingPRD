            - "${e3} == ERR_TIER_CODE_UNKNOWN with HTTP 409 — TIER_9 is absent from Contract.${c1}.tiers"
            - "the fully corrected request returns 201 with ${es} == ELECTED"
            - "no Commitment row exists for (${m1}, ${c1}) until the fourth call: the three rejected calls are side-effect free"

