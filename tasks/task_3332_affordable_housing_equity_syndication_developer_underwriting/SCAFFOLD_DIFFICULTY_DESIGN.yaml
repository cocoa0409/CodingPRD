              payload: {}
              as: Underwriter
              captures: { proj_after_commit: $.data.version }
            - call: "POST /projects/${proj_id}/capital-calls"
              payload: { milestone: "CONSTRUCTION_START", scheduled_date: "2026-10-01T00:00:00Z", due_date: "2026-10-31T00:00:00Z", milestone_share: 0.2, expected_project_version: "${proj_after_commit}" }
              as: AssetManager
              captures: { call1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /capital-calls/${call1_id}/transitions"
              payload: { action: "ISSUE" }
              as: AssetManager
          trigger:
            - call: "POST /capital-calls/${call1_id}/transitions"
              payload: { action: "SETTLE", funded_amount_cents: 1000000 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err_settle: $.data.error_id }
          assert:
            - "FundSubscription.${sub_id}.shortfall_cents == 104887208"
            - "FundSubscription.${sub_id}.status == DEFAULTED"
            - "Investor.${inv_id}.status == SUSPENDED"
            - "SyndicationFund.${fund_id}.subscribed_equity_cents == 0"
            - "SyndicationFund.${fund_id}.subscribed_equity_cents + FundSubscription.${sub_id}.committed_cents == 460000000"
