            - "ChangeoverOrder.${order_x}.planned_turnaround_minutes == 708"
            - "GET /changeover-orders?venue_id=${venue_id} returns total_count == 2"

      - name: rigging_grid_counts_closed_interval_neighbours_that_the_half_open_booking_conflict_ignores
        grounds:
          - calculations.rigging_committed_load_kg
          - validations[priority=76]
          - validations[priority=100]
          - state_machines.EventBooking.HELD_to_CONFIRMED
          - entities.Venue.fields.rigging_committed_load_kg
          - errors.ERR_RIGGING_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Two events that merely touch at 2026-09-09T13:00Z pass the half-open booking-conflict rule
          yet DO both load the roof grid, because the rigging aggregate uses closed intervals on both
          sides: 12000 + 8000 lands exactly on rigging_capacity_kg 20000 and is accepted at the <=
          boundary, while the next touching event sees only its 8000-kg neighbour (the 12000-kg one
          no longer touches) and is refused at 20001 — so the same pair of timestamps means "not
          conflicting" to one rule and "both hanging from the grid at once" to the other.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, an instant no event interval contains."
            - "Lakeside Arena registered with rigging_capacity_kg 20000; PROFILE ICE declared."
            - "Booking A 2026-09-09T10:00Z..13:00Z with rigging_load_kg 12000 is CONFIRMED."
            - "Booking B 2026-09-09T13:00Z..16:00Z with rigging_load_kg 8000 is HELD; booking D 2026-09-09T16:00Z..19:00Z with rigging_load_kg 12001 is HELD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Grid load A", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-09T10:00:00Z", event_end_utc: "2026-09-09T13:00:00Z", expected_attendance: 15000, rigging_load_kg: 12000 }
              as: BookingManager
              captures: { ba: $.data.id }
            - call: "POST /event-bookings/${ba}/hold"
              payload: {}
              as: BookingManager
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { v_a: $.data.version }
            - call: "POST /event-bookings/${ba}/confirm"
              payload: { expected_venue_version: "${v_a}" }
              as: BookingManager
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Grid load B", promoter_name: "Riverton Athletics", event_start_utc: "2026-09-09T13:00:00Z", event_end_utc: "2026-09-09T16:00:00Z", expected_attendance: 14000, rigging_load_kg: 8000 }
              as: BookingManager
              captures: { bb: $.data.id }
            - call: "POST /event-bookings/${bb}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Grid load D", promoter_name: "Harbor Curling", event_start_utc: "2026-09-09T16:00:00Z", event_end_utc: "2026-09-09T19:00:00Z", expected_attendance: 9000, rigging_load_kg: 12001 }
              as: BookingManager
              captures: { bd: $.data.id }
            - call: "POST /event-bookings/${bd}/hold"
              payload: {}
              as: BookingManager
          trigger:
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { v_b: $.data.version }
            - call: "POST /event-bookings/${bb}/confirm"
              payload: { expected_venue_version: "${v_b}" }
              as: BookingManager
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { v_d: $.data.version }
            - call: "POST /event-bookings/${bd}/confirm"
              payload: { expected_venue_version: "${v_d}" }
              as: BookingManager
          assert:
            - "the second trigger call returns HTTP 200 and not ERR_BOOKING_TIME_CONFLICT, because [10:00,13:00) and [13:00,16:00) do not intersect under half-open arithmetic"
            - "the second trigger call is also not rejected with ERR_RIGGING_CAPACITY_EXCEEDED, because 12000 + 8000 == 20000 is accepted at the <= boundary"
            - "the fourth trigger call returns HTTP 422 with error_id ERR_RIGGING_CAPACITY_EXCEEDED, its closed-interval peer set being booking B alone: 8000 + 12001 == 20001"
            - "EventBooking.${ba}.status == CONFIRMED"
            - "EventBooking.${bb}.status == CONFIRMED"
            - "EventBooking.${bd}.status == HELD"
            - "Venue.${venue_id}.rigging_committed_load_kg == 0.00, because the logical clock instant 2026-08-01T00:00:00Z lies inside no confirmed event's closed interval"
            - "Venue.${venue_id}.open_hold_count == 1"
            - "Venue.${venue_id}.version == ${v_d}, which already includes the single increment from the accepted confirm of booking B and is left untouched by the rejected confirm of booking D"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: equipment_pool_conserves_units_total_across_issue_damaged_return_and_maintenance_reset
        grounds:
          - calculations.equipment_units_available
          - state_machines.EquipmentIssue.ISSUED_to_RETURNED
          - state_machines.EquipmentAsset.IN_SERVICE_to_OUT_OF_SERVICE
          - state_machines.EquipmentAsset.OUT_OF_SERVICE_to_IN_SERVICE
          - entities.EquipmentAsset.fields.units_out_of_service
          - entities.EquipmentAsset.fields.service_due
        distinguishing_aspect: |
          The identity units_available + outstanding issued units + units_out_of_service ==
          units_total 10 must hold after every one of six writes, including the asymmetric ones: a
          return reporting 2 damaged units restores only 8 to availability and parks 2 in
          units_out_of_service, and the maintenance COMPLETE compensation is the only operation that
          moves those 2 back and resets cycles_since_service to 0 — so an implementation that
          credits damaged units back on return, or forgets to recompute service_due at the exact
          second cycle against service_interval_cycles 2, breaks the identity or the flag.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Lakeside Arena registered; PROFILE ICE and PROFILE CONCERT declared."
            - "A FLOOR_PANEL_SET pool with units_total 10 and service_interval_cycles 2 is IN_SERVICE with units_available 10, units_out_of_service 0, cycles_since_service 0 and service_due false."
            - "Outgoing promoter ice booking 2026-09-10T00:00Z..03:00Z is HELD; incoming promoter concert booking 2026-09-10T16:00Z..19:00Z is CONFIRMED; a ChangeoverOrder between them with crew_headcount 40 is PLANNED and receives both issues."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "CONCERT_END_STAGE", requires_ice: false, ice_cover_required: true, seating_mode: "CURTAINED_HALF", nominal_seats: 9000, base_changeover_minutes: 300, crew_size_required: 40, floor_protection_panels_required: 120, dehumidification_required_lph: 0, rigging_points_required: 220 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_con: $.data.id }
            - call: "POST /venues/${venue_id}/equipment-assets"
              payload: { asset_class: "FLOOR_PANEL_SET", units_total: 10, service_interval_cycles: 2 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { asset_floor: $.data.id, available_at_create: $.data.units_available }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Hockey Sep 10", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { b_ice: $.data.id }
            - call: "POST /event-bookings/${b_ice}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_con}", title: "Concert Sep 10", promoter_name: "Northline Live", event_start_utc: "2026-09-10T16:00:00Z", event_end_utc: "2026-09-10T19:00:00Z", expected_attendance: 8000, rigging_load_kg: 5000 }
              as: BookingManager
              captures: { b_con: $.data.id }
            - call: "POST /event-bookings/${b_con}/hold"
              payload: {}
              as: BookingManager
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { v_confirm: $.data.version }
            - call: "POST /event-bookings/${b_con}/confirm"
              payload: { expected_venue_version: "${v_confirm}" }
              as: BookingManager
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: ChangeoverSupervisor
              captures: { v_order: $.data.version }
            - call: "POST /changeover-orders"
              payload: { from_booking_id: "${b_ice}", to_booking_id: "${b_con}", crew_headcount: 40, expected_venue_version: "${v_order}" }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /equipment-issues"
              payload: { asset_id: "${asset_floor}", changeover_order_id: "${order_id}", units_issued: 6 }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { issue1: $.data.id }
            - call: "GET /equipment-assets/${asset_floor}"
              payload: {}
              as: ChangeoverSupervisor
              captures: { avail_after_issue1: $.data.units_available }
            - call: "POST /equipment-issues/${issue1}/return"
              payload: { damaged_units: 2 }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
            - call: "GET /equipment-assets/${asset_floor}"
              payload: {}
              as: ChangeoverSupervisor
              captures: { avail_after_return1: $.data.units_available, oos_after_return1: $.data.units_out_of_service, cycles_after_return1: $.data.cycles_since_service, due_after_return1: $.data.service_due }
            - call: "POST /equipment-issues"
              payload: { asset_id: "${asset_floor}", changeover_order_id: "${order_id}", units_issued: 3 }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
              captures: { issue2: $.data.id }
            - call: "GET /equipment-assets/${asset_floor}"
              payload: {}
              as: ChangeoverSupervisor
              captures: { avail_after_issue2: $.data.units_available }
            - call: "POST /equipment-issues/${issue2}/return"
              payload: { damaged_units: 0 }
              as: ChangeoverSupervisor
              as_user_id: "sup-alpha"
            - call: "GET /equipment-assets/${asset_floor}"
              payload: {}
              as: ChangeoverSupervisor
              captures: { avail_after_return2: $.data.units_available, cycles_after_return2: $.data.cycles_since_service, due_after_return2: $.data.service_due }
            - call: "POST /equipment-assets/${asset_floor}/maintenance"
              payload: { action: "START" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { avail_after_start: $.data.units_available, status_after_start: $.data.status }
            - call: "POST /equipment-assets/${asset_floor}/maintenance"
              payload: { action: "COMPLETE" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
          assert:
            - "available_at_create == 10 and the invariant units_available + issued + units_out_of_service == 10 holds at creation with issued 0 and out_of_service 0"
            - "avail_after_issue1 == 4, so 4 + 6 + 0 == 10"
            - "avail_after_return1 == 8, oos_after_return1 == 2, cycles_after_return1 == 1 and due_after_return1 == false, so 8 + 0 + 2 == 10 and 1 >= 2 is false"
            - "avail_after_issue2 == 5, so 5 + 3 + 2 == 10"
            - "avail_after_return2 == 8, cycles_after_return2 == 2 and due_after_return2 == true, evaluated with >= at exactly service_interval_cycles 2"
            - "avail_after_start == 8 and status_after_start == OUT_OF_SERVICE, so taking the pool out of service does not itself move any unit"
            - "EquipmentAsset.${asset_floor}.status == IN_SERVICE"
            - "EquipmentAsset.${asset_floor}.units_available == 10"
            - "EquipmentAsset.${asset_floor}.units_out_of_service == 0"
            - "EquipmentAsset.${asset_floor}.cycles_since_service == 0"
            - "EquipmentAsset.${asset_floor}.service_due == false"
            - "EquipmentIssue.${issue1}.status == RETURNED with damaged_units == 2 and return_reason == OPERATOR_RETURN"
            - "EquipmentIssue.${issue2}.status == RETURNED with damaged_units == 0 and return_reason == OPERATOR_RETURN"

      - name: hold_ledgers_reconcile_to_zero_after_confirm_and_release_although_the_two_counters_move_on_different_events
        grounds:
          - entities.Venue.fields.open_hold_count
          - entities.AnchorTenant.fields.holds_consumed
          - state_machines.EventBooking.HELD_to_CONFIRMED
          - state_machines.EventBooking.HELD_to_RELEASED
          - state_machines.EventBooking.CONFIRMED_to_RELEASED
          - calculations.rigging_committed_load_kg
        distinguishing_aspect: |
          The two ledgers are deliberately out of step: confirming a booking decrements
          Venue.open_hold_count to 2 but leaves AnchorTenant.holds_consumed at 3, because a confirmed
          date still consumes the tenant's seasonal guarantee; only the releases return both counters
          to 0, and the release of the CONFIRMED booking must decrement holds_consumed WITHOUT
          decrementing open_hold_count a second time — so an implementation that treats the two
          counters as one, or double-decrements on the confirm-then-release path, cannot reconcile.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z and left there, so the TIER_2 holds (168-hour window, expiring 2026-08-08T00:00:00.000Z) stay confirmable."
            - "Lakeside Arena registered with PROFILE ICE declared."
            - "Anchor tenant Lakeside Hockey Club at TIER_2 with guaranteed_holds_per_season 5, holds_consumed 0."
            - "Three DRAFT tenant bookings with disjoint event intervals on 2026-09-10, 2026-09-11 and 2026-09-12, each with rigging_load_kg 3000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
            - call: "POST /venues"
              payload: { name: "Lakeside Arena", rigging_capacity_kg: 20000, dock_count: 4, max_bowl_seats: 18000, crew_headcount_cap: 60, min_turnaround_buffer_minutes: 45, dock_buffer_minutes: 30, overnight_shift_start_local_hour: 22 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/configuration-profiles"
              payload: { code: "ICE_HOCKEY", requires_ice: true, ice_cover_required: false, seating_mode: "FULL_BOWL", nominal_seats: 17000, base_changeover_minutes: 240, crew_size_required: 30, floor_protection_panels_required: 0, dehumidification_required_lph: 120, rigging_points_required: 40 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { p_ice: $.data.id }
            - call: "POST /venues/${venue_id}/anchor-tenants"
              payload: { name: "Lakeside Hockey Club", hold_priority_tier: "TIER_2", guaranteed_holds_per_season: 5 }
              as: VenueOperationsDirector
              as_user_id: "dir-lakeside"
              captures: { ta: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", tenant_id: "${ta}", config_profile_id: "${p_ice}", title: "Home game Sep 10", event_start_utc: "2026-09-10T00:00:00Z", event_end_utc: "2026-09-10T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { bk1: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", tenant_id: "${ta}", config_profile_id: "${p_ice}", title: "Home game Sep 11", event_start_utc: "2026-09-11T00:00:00Z", event_end_utc: "2026-09-11T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { bk2: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", tenant_id: "${ta}", config_profile_id: "${p_ice}", title: "Home game Sep 12", event_start_utc: "2026-09-12T00:00:00Z", event_end_utc: "2026-09-12T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 3000 }
              as: BookingManager
              captures: { bk3: $.data.id }
          trigger:
            - call: "POST /event-bookings/${bk1}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /event-bookings/${bk2}/hold"
              payload: {}
              as: BookingManager
            - call: "POST /event-bookings/${bk3}/hold"
              payload: {}
              as: BookingManager
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { holds_open_after_three: $.data.open_hold_count, v_confirm: $.data.version }
            - call: "GET /venues/${venue_id}/anchor-tenants"
              payload: {}
              as: BookingManager
            - call: "POST /event-bookings/${bk2}/confirm"
              payload: { expected_venue_version: "${v_confirm}" }
              as: BookingManager
            - call: "GET /venues/${venue_id}"
              payload: {}
              as: BookingManager
              captures: { holds_open_after_confirm: $.data.open_hold_count, committed_after_confirm: $.data.rigging_committed_load_kg }
            - call: "POST /event-bookings/${bk1}/release"
              payload: { reason: "Tenant returned the date" }
              as: BookingManager
            - call: "POST /event-bookings/${bk2}/release"
              payload: { reason: "Tenant returned the confirmed date" }
              as: BookingManager
            - call: "POST /event-bookings/${bk3}/release"
              payload: { reason: "Tenant returned the date" }
              as: BookingManager
          assert:
            - "holds_open_after_three == 3 and AnchorTenant.${ta}.holds_consumed was 3 at that point, one per hold"
            - "holds_open_after_confirm == 2, decremented once by the confirm"
            - "committed_after_confirm == 0.00, because the logical clock instant lies inside no confirmed event's closed interval"
            - "EventBooking.${bk1}.status == RELEASED with release_reason recorded from the request"
            - "EventBooking.${bk2}.status == RELEASED with release_reason recorded from the request"
            - "EventBooking.${bk3}.status == RELEASED with release_reason recorded from the request"
            - "Venue.${venue_id}.open_hold_count == 0, never negative, so the release of the CONFIRMED booking did not decrement it a second time"
            - "AnchorTenant.${ta}.holds_consumed == 0"
            - "Venue.${venue_id}.rigging_committed_load_kg == 0.00"
