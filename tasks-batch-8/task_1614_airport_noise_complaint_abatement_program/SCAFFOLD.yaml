  - { method: GET, path: "/noise-program/noise-events", description: "List events with filters", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: ["limit?", "offset?", "monitor_id?", "flight_id?", "status?", "quarter?"], output: "NoiseEvent[]", side_effects: [] }
  - { method: GET, path: "/noise-program/noise-events/{eventId}", description: "Get an event", roles: [NoiseOfficeAdmin, NoiseAnalyst, CommunityLiaison, StudyCoordinator, BoardMember], code: 200, input: [], output: NoiseEvent, side_effects: [] }
