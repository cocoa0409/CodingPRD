      - name: membership_chain_state_errors_are_each_triggerable
        claim_type: error_triggerability
        grounds:
          - errors[ERR_INVALID_MEMBER_STATE]
          - errors[ERR_INVALID_CONTRACT_STATE]
          - errors[ERR_CONTRACT_NOT_EXECUTED]
          - errors[ERR_CONTRACT_MEMBER_MISMATCH]
        distinguishing_aspect: "Four codes that only the membership-to-money chain can raise, and each must be distinguishable from the others: a second audition decision is a MEMBER state error, a reissue against an ISSUED (not REVISION_REQUESTED) contract is a CONTRACT state error, a plan against a merely SIGNED contract is CONTRACT_NOT_EXECUTED, and a plan pairing member A with member B's contract is a referential mismatch."
        test_recipe:
          setup:
            - "Two OFFERED members exist. Member A's contract is ISSUED then SIGNED_BY_MEMBER; member B's contract is EXECUTED."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_a_id: "$.data.id" }
            - call: "POST /members/${member_a_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 90 }
              as: MembershipCoordinator
            - call: "POST /member-contracts"
              payload: { member_id: "${member_a_id}", tuition_amount_cents: 399900, payment_plan_type: "STANDARD_3" }
              as: MembershipCoordinator
              captures: { contract_a_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Blair Osei", email: "blair@corps.test", date_of_birth: "2004-07-19", section: "PERCUSSION", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_b_id: "$.data.id" }
            - call: "POST /members/${member_b_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 94 }
              as: MembershipCoordinator
            - call: "POST /member-contracts"
              payload: { member_id: "${member_b_id}", tuition_amount_cents: 399900, payment_plan_type: "STANDARD_3" }
              as: MembershipCoordinator
              captures: { contract_b_id: "$.data.id" }
            - call: "POST /member-contracts/${contract_b_id}/sign"
              payload: { signature_name: "Blair Osei" }
              as: Member
              as_user_id: "${member_b_id}"
            - call: "POST /member-contracts/${contract_b_id}/execute"
              payload: {}
              as: CorpsDirector
            - call: "GET /members/${member_a_id}"
              as: BusinessManager
              captures: { member_a_v: "$.data.version" }
          trigger:
            - call: "POST /members/${member_a_id}/audition-decision"
              payload: { decision: "DECLINE", audition_score: 55 }
              as: MembershipCoordinator
              captures: { member_state_err: "$.data.error_id" }
            - call: "POST /member-contracts/${contract_a_id}/reissue"
              payload: { tuition_amount_cents: 349900 }
              as: MembershipCoordinator
              captures: { contract_state_err: "$.data.error_id" }
            - call: "POST /member-contracts/${contract_a_id}/sign"
              payload: { signature_name: "Avery Nakamura" }
              as: Member
              as_user_id: "${member_a_id}"
            - call: "POST /payment-plans"
              payload: { member_id: "${member_a_id}", member_contract_id: "${contract_a_id}", first_due_date: "2027-01-15", expected_member_version: "${member_a_v}" }
              as: BusinessManager
              captures: { not_executed_err: "$.data.error_id" }
            - call: "POST /payment-plans"
              payload: { member_id: "${member_a_id}", member_contract_id: "${contract_b_id}", first_due_date: "2027-01-15", expected_member_version: "${member_a_v}" }
              as: BusinessManager
              captures: { mismatch_err: "$.data.error_id" }
          assert:
            - "${member_state_err} == ERR_INVALID_MEMBER_STATE with HTTP 409 — an OFFERED member has left APPLICANT, so no second audition decision is possible, and audition_score stays 90"
            - "${contract_state_err} == ERR_INVALID_CONTRACT_STATE with HTTP 409 — reissue only leaves REVISION_REQUESTED — and MemberContract.${contract_a_id}.tuition_amount_cents is still 399900 with revision_round == 0"
            - "${not_executed_err} == ERR_CONTRACT_NOT_EXECUTED with HTTP 409 — SIGNED_BY_MEMBER is not EXECUTED"
            - "${mismatch_err} == ERR_CONTRACT_MEMBER_MISMATCH with HTTP 409 — the referential coherence check fires even though contract B is properly EXECUTED"
