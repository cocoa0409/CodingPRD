            - { call: "POST /gifted/students", payload: { student_number: "ST-2", legal_name: "Stu Two", grade_level: 3, school_site_id: "${site_id}", demographic_group: "BLACK", primary_guardian_user_id: "guard-2" }, as: GiftedCoordinator, captures: { s2: $.data.id } }
