# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3221_seasonal_original_movie_slate_programming_blocks
# 9 Difficulty Rules × 2 instances each = 18 instances.
# Common fixture chain (referenced per instance, spelled out in each):
#   clock -> studio -> season (2027, air window 2027-11-01..2027-12-31,
#   delivery_deadline 2027-10-01, December-spiked) -> lock season -> titles.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: sponsorship_projection_vs_reconciliation_diverge
        grounds:
          - calculations.sponsorship_projection
          - calculations.sponsorship_reconciliation
          - state_machines.Sponsorship.BOOKED_to_RECONCILED
        distinguishing_aspect: |
          Dual-variant calculation on the Sponsorship/Season domain: with identical
          stored inputs (cpm 2000, viewership 10) the projected variant (spiked,
          December window) yields 25000 while the actual variant (premiere-weighted,
          spike dropped, 2 premieres aired) yields 24000 — same row, two valid
          algorithms, different cents.
        test_recipe:
          setup:
            - "Logical clock at 2027-03-01T00:00:00Z. Studio with ad_budget 10000000."
            - "Season year 2027, air window 2027-11-01T00:00:00Z..2027-12-31T00:00:00Z (December-spiked), delivery_deadline 2027-10-01T00:00:00Z, required_title_count 1, max_shoot_days 100."
            - "Season LOCKED; one title approved, shot (wrapped) and delivered; one block published; two PREMIERE air slots for the title marked AIRED so premiered_title_count == 2; season archived."
            - "Sponsorship booked with season_cpm_cents 2000, viewership_thousands 10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 10000000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown 2027", required_title_count: 1, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id, season_v1: $.data.version }
            - call: "POST /slate/seasons/${season_id}/lock"
              payload: {}
              as: ProgrammingExec
              captures: { season_v_locked: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "A Cookie Cutter Christmas", genre: "ROMANCE", tone_rating: "FESTIVE", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { title_id: $.data.id }
            - call: "POST /slate/titles/${title_id}/approve"
              payload: { expected_season_version: "${season_v_locked}" }
              as: SlatePlanner
            - call: "POST /slate/locations"
              payload: { studio_id: "${studio_id}", name: "Pinewood North", blackout_windows: [] }
              as: ProductionManager
              captures: { location_id: $.data.id }
            - call: "POST /slate/production-slots"
              payload: { title_id: "${title_id}", location_id: "${location_id}", shoot_start: "2027-03-10T00:00:00Z", shoot_end: "2027-03-20T00:00:00Z", shoot_days: 10 }
              as: ProductionManager
              captures: { slot_id: $.data.id }
            - call: "POST /slate/production-slots/${slot_id}/wrap"
              payload: {}
              as: ProductionManager
            - call: "POST /slate/titles/${title_id}/deliver"
              payload: {}
              as: ProductionManager
            - call: "POST /slate/program-blocks"
              payload: { season_id: "${season_id}", name: "Friday Premieres", block_start: "2027-11-05T00:00:00Z", premiere_cadence_days: 7, max_encores_per_title: 3, min_minutes_between_airings: 1440 }
              as: ProgrammingExec
              captures: { block_id: $.data.id, block_v0: $.data.version }
            - call: "POST /slate/program-blocks/${block_id}/publish"
              payload: {}
              as: ProgrammingExec
              captures: { block_v1: $.data.version }
            - call: "POST /slate/air-slots"
              payload: { block_id: "${block_id}", title_id: "${title_id}", air_start: "2027-11-05T00:00:00Z", kind: "PREMIERE", expected_block_version: "${block_v1}" }
              as: ProgrammingExec
              captures: { air1_id: $.data.id, block_v2: $.data.version }
            - call: "POST /slate/air-slots"
              payload: { block_id: "${block_id}", title_id: "${title_id}", air_start: "2027-11-12T00:00:00Z", kind: "PREMIERE", expected_block_version: "${block_v2}" }
              as: ProgrammingExec
              captures: { air2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-11-13T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/air-slots/${air1_id}/mark-aired"
              payload: {}
              as: ProgrammingExec
            - call: "POST /slate/air-slots/${air2_id}/mark-aired"
              payload: {}
              as: ProgrammingExec
            - call: "POST /slate/sponsorships"
              payload: { season_id: "${season_id}", advertiser: "Greeting Cards Co", season_cpm_cents: 2000, viewership_thousands: 10 }
              as: AdSalesRep
              captures: { spon_id: $.data.id }
            - call: "POST /slate/seasons/${season_id}/archive"
              payload: {}
              as: ProgrammingExec
          trigger:
            - call: "POST /slate/sponsorships/${spon_id}/reconcile"
              payload: {}
              as: AdSalesRep
          assert:
            - "Sponsorship.${spon_id}.projected_cost_cents == 25000 (spiked projection: floor(2000*10*125/100))"
            - "Sponsorship.${spon_id}.actual_cost_cents == 24000 (reconciliation: 2000*(10+2), spike dropped)"
            - "Sponsorship.${spon_id}.status == RECONCILED"
            - "Studio.${studio_id}.ad_budget_cents == 10000000 - 24000 == 9976000"

      - name: royalty_provisional_vs_trueup_delta
        grounds:
          - calculations.royalty_provisional
          - calculations.royalty_trueup
          - state_machines.LicenseGrant.REPORTED_to_AUDITED
        distinguishing_aspect: |
          Dual-variant calculation on the LicenseGrant (licensing) domain — a
          different entity domain from sponsorship: provisional royalty is
          floor(revenue*rate) == 150000, while the audit true-up adds a flat
          50000 bonus past the 1000000 threshold and reports a DELTA of 50000,
          not a re-stated royalty.
        test_recipe:
          setup:
            - "Logical clock at 2027-03-01T00:00:00Z. Studio, spiked season LOCKED with one delivered title (same minimal chain as the sponsorship instance but required_title_count 1, no air slots needed)."
            - "LicenseGrant reported with royalty_rate 0.10 and reported_revenue_cents 1500000 (>= 1000000 threshold)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown 2027", required_title_count: 1, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - call: "POST /slate/seasons/${season_id}/lock"
              payload: {}
              as: ProgrammingExec
              captures: { season_v_locked: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "Mistletoe Merch", genre: "FAMILY", tone_rating: "WARM", content_flags: [], duration_minutes: 84 }
              as: SlatePlanner
              captures: { title_id: $.data.id }
            - call: "POST /slate/titles/${title_id}/approve"
              payload: { expected_season_version: "${season_v_locked}" }
              as: SlatePlanner
            - call: "POST /slate/locations"
              payload: { studio_id: "${studio_id}", name: "Stage 7", blackout_windows: [] }
              as: ProductionManager
              captures: { location_id: $.data.id }
            - call: "POST /slate/production-slots"
              payload: { title_id: "${title_id}", location_id: "${location_id}", shoot_start: "2027-04-01T00:00:00Z", shoot_end: "2027-04-11T00:00:00Z", shoot_days: 10 }
              as: ProductionManager
              captures: { slot_id: $.data.id }
            - call: "POST /slate/production-slots/${slot_id}/wrap"
              payload: {}
              as: ProductionManager
            - call: "POST /slate/titles/${title_id}/deliver"
              payload: {}
              as: ProductionManager
            - call: "POST /slate/licenses"
              payload: { season_id: "${season_id}", title_id: "${title_id}", category: "MERCHANDISE", licensee: "OrnamentWorks", royalty_rate: 0.10, reported_revenue_cents: 1500000 }
              as: LicensingManager
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /slate/licenses/${lic_id}/audit"
              payload: {}
              as: LicensingManager
          assert:
            - "LicenseGrant.${lic_id}.provisional_royalty_cents == 150000 (floor(1500000 * 0.10))"
            - "LicenseGrant.${lic_id}.trued_royalty_cents == 50000 (floor(150000 + 50000) - 150000; DELTA, not re-stated royalty)"
            - "LicenseGrant.${lic_id}.status == AUDITED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: sponsorship_spike_multiplier_nested_floor
        grounds:
          - calculations.sponsorship_projection
        distinguishing_aspect: |
          Mode (a) non-linear interaction: the projection branches on a
          state-derived predicate (December-spike intersection of the season air
          window) and applies floor only in the spiked branch — cpm 2000 x
          viewership 10 gives 25000 spiked vs 20000 flat for identical money
          inputs when only the air window differs.
        test_recipe:
          setup:
            - "Logical clock at 2027-03-01T00:00:00Z. Studio."
            - "Season A (spiked): air window 2027-11-01..2027-12-31. Season B (flat): air window 2027-02-01T00:00:00Z..2027-03-01T00:00:00Z, delivery_deadline 2027-01-01T00:00:00Z."
            - "One sponsorship on each season, identical cpm 2000 / viewership 10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 1, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_spiked: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Winter Warmup", required_title_count: 1, air_window_start: "2027-02-01T00:00:00Z", air_window_end: "2027-03-01T00:00:00Z", delivery_deadline: "2027-01-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_flat: $.data.id }
          trigger:
            - call: "POST /slate/sponsorships"
              payload: { season_id: "${season_spiked}", advertiser: "CardsCo", season_cpm_cents: 2000, viewership_thousands: 10 }
              as: AdSalesRep
              captures: { spon_spiked: $.data.id }
            - call: "POST /slate/sponsorships"
              payload: { season_id: "${season_flat}", advertiser: "CardsCo", season_cpm_cents: 2000, viewership_thousands: 10 }
              as: AdSalesRep
              captures: { spon_flat: $.data.id }
          assert:
            - "Sponsorship.${spon_spiked}.projected_cost_cents == 25000 (floor(20000*125/100))"
            - "Sponsorship.${spon_flat}.projected_cost_cents == 20000 (no spike branch)"
            - "Sponsorship.${spon_spiked}.projected_cost_cents != Sponsorship.${spon_flat}.projected_cost_cents for identical cpm/viewership"

      - name: royalty_trueup_pinned_evaluation_order
        grounds:
          - calculations.royalty_trueup
          - calculations.royalty_provisional
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: trued_royalty depends on
          provisional_royalty while both derive from the same revenue/rate; the
          pinned order (gross -> threshold bonus -> floor -> subtract
          provisional) makes the DELTA exactly 50000 at revenue 1500000 and
          exactly -? impossible — any other evaluation order (e.g. floor after
          subtraction, or bonus added post-floor) yields a different integer.
        test_recipe:
          setup:
            - "Logical clock 2027-03-01T00:00:00Z. Studio, spiked LOCKED season, one delivered title."
            - "Two LicenseGrants on the title: G1 revenue 1500000 rate 0.10 (above bonus threshold), G2 revenue 999999 rate 0.10 (below)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 1, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - call: "POST /slate/seasons/${season_id}/lock"
              payload: {}
              as: ProgrammingExec
              captures: { season_v_locked: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "Novel Tie-In", genre: "MYSTERY", tone_rating: "WARM", content_flags: [], duration_minutes: 100 }
              as: SlatePlanner
              captures: { title_id: $.data.id }
            - call: "POST /slate/titles/${title_id}/approve"
              payload: { expected_season_version: "${season_v_locked}" }
              as: SlatePlanner
            - call: "POST /slate/locations"
              payload: { studio_id: "${studio_id}", name: "Stage 9", blackout_windows: [] }
              as: ProductionManager
              captures: { location_id: $.data.id }
            - call: "POST /slate/production-slots"
              payload: { title_id: "${title_id}", location_id: "${location_id}", shoot_start: "2027-04-01T00:00:00Z", shoot_end: "2027-04-11T00:00:00Z", shoot_days: 10 }
              as: ProductionManager
              captures: { slot_id: $.data.id }
            - call: "POST /slate/production-slots/${slot_id}/wrap"
              payload: {}
              as: ProductionManager
            - call: "POST /slate/titles/${title_id}/deliver"
              payload: {}
              as: ProductionManager
            - call: "POST /slate/licenses"
              payload: { season_id: "${season_id}", title_id: "${title_id}", category: "PUBLISHING", licensee: "BookHouse", royalty_rate: 0.10, reported_revenue_cents: 1500000 }
              as: LicensingManager
              captures: { lic_hi: $.data.id }
            - call: "POST /slate/licenses"
              payload: { season_id: "${season_id}", title_id: "${title_id}", category: "PUBLISHING", licensee: "BookHouse", royalty_rate: 0.10, reported_revenue_cents: 999999 }
              as: LicensingManager
              captures: { lic_lo: $.data.id }
          trigger:
            - call: "POST /slate/licenses/${lic_hi}/audit"
              payload: {}
              as: LicensingManager
            - call: "POST /slate/licenses/${lic_lo}/audit"
              payload: {}
              as: LicensingManager
          assert:
            - "LicenseGrant.${lic_hi}.provisional_royalty_cents == 150000 and trued_royalty_cents == 50000 (bonus applied to gross BEFORE floor-then-subtract)"
            - "LicenseGrant.${lic_lo}.provisional_royalty_cents == 99999 and trued_royalty_cents == 0 (revenue 999999 < 1000000 threshold: no bonus, delta zero)"
            - "floor(999999 * 0.10) == 99999 pins the per-report floor order (round per-report, before any aggregate)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: talent_deal_cyclic_fulfilled_active_loop
        grounds:
          - state_machines.TalentDeal.ACTIVE_to_FULFILLED
          - state_machines.TalentDeal.FULFILLED_to_ACTIVE
          - state_machines.Casting.ATTACHED_to_CONFIRMED
          - state_machines.Casting.CONFIRMED_to_RELEASED
        distinguishing_aspect: |
          Cyclic machine on TalentDeal (ACTIVE -> FULFILLED -> ACTIVE), driven
          indirectly by Casting confirm/release — distinct from any title or
          season machine.
        test_recipe:
          setup:
            - "Clock 2027-03-01T00:00:00Z. Studio, spiked LOCKED season (required_title_count 2)."
            - "Two titles T1, T2 approved. Talent W with availability window 2027-03-01..2027-05-01."
            - "Deal D: talent W, season, picture_commitment 2."
            - "Castings C1 on T1 and C2 on T2 for talent W, both CONFIRMED (no production slots -> production-horizon window check passes) -> deal flips FULFILLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 2, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - call: "POST /slate/seasons/${season_id}/lock"
              payload: {}
              as: ProgrammingExec
              captures: { sv: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "T1", genre: "ROMANCE", tone_rating: "WARM", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t1: $.data.id }
            - call: "POST /slate/titles/${t1}/approve"
              payload: { expected_season_version: "${sv}" }
              as: SlatePlanner
              captures: { sv2: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "T2", genre: "FAMILY", tone_rating: "GENTLE", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t2: $.data.id }
            - call: "POST /slate/titles/${t2}/approve"
              payload: { expected_season_version: "${sv2}" }
              as: SlatePlanner
            - call: "POST /slate/talent"
              payload: { studio_id: "${studio_id}", stage_name: "Holly Star", availability_windows: [{ start: "2027-03-01T00:00:00Z", end: "2027-05-01T00:00:00Z" }] }
              as: TalentAgent
              captures: { talent_id: $.data.id }
            - call: "POST /slate/deals"
              payload: { talent_id: "${talent_id}", season_id: "${season_id}", picture_commitment: 2 }
              as: TalentAgent
              as_user_id: "${talent_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /slate/castings"
              payload: { title_id: "${t1}", talent_id: "${talent_id}" }
              as: TalentAgent
              as_user_id: "${talent_id}"
              captures: { c1: $.data.id }
            - call: "POST /slate/castings/${c1}/confirm"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_id}"
            - call: "POST /slate/castings"
              payload: { title_id: "${t2}", talent_id: "${talent_id}" }
              as: TalentAgent
              as_user_id: "${talent_id}"
              captures: { c2: $.data.id }
            - call: "POST /slate/castings/${c2}/confirm"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_id}"
          trigger:
            - call: "GET /slate/deals/${deal_id}"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_id}"
              captures: { deal_fulfilled_status: $.data.status }
            - call: "POST /slate/castings/${c2}/release"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_id}"
          assert:
            - "deal_fulfilled_status == FULFILLED (after two confirms, fulfilled_pictures == 2 == picture_commitment)"
            - "after release: TalentDeal.${deal_id}.status == ACTIVE and fulfilled_pictures == 1 (cyclic loop back)"
            - "Casting.${c2}.status == RELEASED"

      - name: title_branching_approve_or_reject_fork
        grounds:
          - state_machines.Title.PITCHED_to_APPROVED
          - state_machines.Title.PITCHED_to_REJECTED
        distinguishing_aspect: |
          Branching fork on Title from PITCHED (approve vs reject with divergent
          side-effect sets — approve consumes slate quota and bumps
          Season.version; reject leaves quota and version untouched), a different
          entity than the TalentDeal cycle.
        test_recipe:
          setup:
            - "Clock 2027-03-01T00:00:00Z. Studio, LOCKED season (required_title_count 2). Two PITCHED titles T1, T2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 2, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - call: "POST /slate/seasons/${season_id}/lock"
              payload: {}
              as: ProgrammingExec
              captures: { sv: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "T1", genre: "ROMANCE", tone_rating: "WARM", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t1: $.data.id }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "T2", genre: "COMEDY", tone_rating: "GENTLE", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t2: $.data.id }
          trigger:
            - call: "POST /slate/titles/${t1}/approve"
              payload: { expected_season_version: "${sv}" }
              as: SlatePlanner
              captures: { sv_after: $.data.version }
            - call: "POST /slate/titles/${t2}/reject"
              payload: {}
              as: SlatePlanner
          assert:
            - "Title.${t1}.status == APPROVED and Title.${t2}.status == REJECTED (fork branches diverge)"
            - "Season.${season_id}.committed_title_count == 1 (only the approved branch consumed quota)"
            - "sv_after == ${sv} + 1 (approve bumped the season version exactly once; reject did not bump it)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: title_cancel_deep_cascade_to_deal_flip
        grounds:
          - state_machines.Title.APPROVED_to_CANCELLED
          - state_machines.ProductionSlot.BOOKED_to_CANCELLED
          - state_machines.Casting.CONFIRMED_to_RELEASED
          - state_machines.TalentDeal.FULFILLED_to_ACTIVE
        distinguishing_aspect: |
          Depth-3 cascade from Title cancel: quota recompute -> BOOKED slots
          cancel (booked_shoot_days release) -> CONFIRMED castings release ->
          deal fulfilled_pictures recompute flips a FULFILLED deal back to
          ACTIVE. Each hop is caused by the previous hop, not by the cancel
          directly.
        test_recipe:
          setup:
            - "Clock 2027-03-01T00:00:00Z. Studio, LOCKED season (required 2, max_shoot_days 100)."
            - "T1 approved, cast confirmed for talent W (deal commitment 2), one BOOKED slot of 10 days on T1. T2 approved, cast confirmed for W -> deal FULFILLED. Season.booked_shoot_days == 10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /slate/studios"
              payload: { name: "Crown Media", ad_budget_cents: 1000000 }
              as: PlatformAdmin
              captures: { studio_id: $.data.id }
            - call: "POST /slate/seasons"
              payload: { studio_id: "${studio_id}", year: 2027, label: "Countdown", required_title_count: 2, air_window_start: "2027-11-01T00:00:00Z", air_window_end: "2027-12-31T00:00:00Z", delivery_deadline: "2027-10-01T00:00:00Z", max_shoot_days: 100 }
              as: PlatformAdmin
              captures: { season_id: $.data.id }
            - call: "POST /slate/seasons/${season_id}/lock"
              payload: {}
              as: ProgrammingExec
              captures: { sv: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "T1", genre: "ROMANCE", tone_rating: "WARM", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t1: $.data.id }
            - call: "POST /slate/titles/${t1}/approve"
              payload: { expected_season_version: "${sv}" }
              as: SlatePlanner
              captures: { sv2: $.data.version }
            - call: "POST /slate/titles"
              payload: { season_id: "${season_id}", name: "T2", genre: "FAMILY", tone_rating: "GENTLE", content_flags: [], duration_minutes: 90 }
              as: SlatePlanner
              captures: { t2: $.data.id }
            - call: "POST /slate/titles/${t2}/approve"
              payload: { expected_season_version: "${sv2}" }
              as: SlatePlanner
            - call: "POST /slate/talent"
              payload: { studio_id: "${studio_id}", stage_name: "Holly Star", availability_windows: [{ start: "2027-03-01T00:00:00Z", end: "2027-06-01T00:00:00Z" }] }
              as: TalentAgent
              captures: { talent_id: $.data.id }
            - call: "POST /slate/deals"
              payload: { talent_id: "${talent_id}", season_id: "${season_id}", picture_commitment: 2 }
              as: TalentAgent
              as_user_id: "${talent_id}"
              captures: { deal_id: $.data.id }
            - call: "POST /slate/locations"
              payload: { studio_id: "${studio_id}", name: "Stage 1", blackout_windows: [] }
              as: ProductionManager
              captures: { loc_id: $.data.id }
            - call: "POST /slate/production-slots"
              payload: { title_id: "${t1}", location_id: "${loc_id}", shoot_start: "2027-03-10T00:00:00Z", shoot_end: "2027-03-20T00:00:00Z", shoot_days: 10 }
              as: ProductionManager
              captures: { slot1: $.data.id }
            - call: "POST /slate/castings"
              payload: { title_id: "${t1}", talent_id: "${talent_id}" }
              as: TalentAgent
              as_user_id: "${talent_id}"
              captures: { c1: $.data.id }
            - call: "POST /slate/castings/${c1}/confirm"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_id}"
            - call: "POST /slate/castings"
              payload: { title_id: "${t2}", talent_id: "${talent_id}" }
              as: TalentAgent
              as_user_id: "${talent_id}"
              captures: { c2: $.data.id }
            - call: "POST /slate/castings/${c2}/confirm"
              payload: {}
              as: TalentAgent
              as_user_id: "${talent_id}"
          trigger:
            - call: "POST /slate/titles/${t1}/cancel"
              payload: {}
              as: SlatePlanner
          assert:
            - "Title.${t1}.status == CANCELLED and Season.${season_id}.committed_title_count == 1 (hop 1)"
            - "ProductionSlot.${slot1}.status == CANCELLED and Season.${season_id}.booked_shoot_days == 0 (hop 2)"
            - "Casting.${c1}.status == RELEASED (hop 3a)"
            - "TalentDeal.${deal_id}.status == ACTIVE and fulfilled_pictures == 1 (hop 3b: FULFILLED flipped back)"
            - "Casting.${c2}.status == CONFIRMED (other title untouched)"

      - name: season_archive_cascade_breaches_deal
        grounds:
          - state_machines.Season.LOCKED_to_ARCHIVED
          - state_machines.ProgramBlock.PUBLISHED_to_CLOSED
          - state_machines.StreamingWindow
          - state_machines.TalentDeal.ACTIVE_to_BREACHED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (Season archive, not Title
          cancel): archive closes PUBLISHED blocks and SCHEDULED streaming
          windows (hop 1), and the archive's deal evaluation flips the
          still-ACTIVE deal with fulfilled_pictures 1 < commitment 2 to BREACHED
          (hop 2).
        test_recipe:
          setup:
            - "Clock 2027-03-01T00:00:00Z. Studio, LOCKED season (required 2)."
            - "T1 approved+shot(wrapped)+delivered; T2 approved then cancelled so all titles terminal-or-delivered."
            - "Talent W deal (commitment 2) with only ONE confirmed casting (on T1) -> fulfilled_pictures 1, deal ACTIVE."
            - "One PUBLISHED block with no air slots (so archive not blocked), one SCHEDULED streaming window for T1."
