  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: instrument_purge_buffer_admits_exact_fifteen_minute_gap_and_rejects_fourteen
        grounds:
          - calculations.instrument_minutes_ledger
          - calculations.instrument_minutes_ledger.constants.INSTRUMENT_PURGE_MINUTES
          - validations.priority_19
          - errors.ERR_INSTRUMENT_WINDOW_CONFLICT
          - entities.MetrologyInstrument.fields.booked_minutes_total
        distinguishing_aspect: |
          Instrument windows are CLOSED intervals guarded by a symmetric 15-minute purge buffer: a booking
          that starts exactly 15 minutes after the previous window ends is admitted and lifts
          booked_minutes_total from 120 to 180, while a booking that starts only 14 minutes after the new
          tail is refused with ERR_INSTRUMENT_WINDOW_CONFLICT and leaves booked_minutes_total at 180.
        test_recipe:
          setup:
            - "A RELEASED design, a certified 20-blank lot and three WorkOrders in BLANKS_RESERVED (WO-2540-1..3), each with element_count 2, so three independent runs are allowed on one instrument."
            - "Run A occupies IF-2540-1 from 08:00 to 10:00 on WO-2540-1 (120 minutes booked)."
            - "Run B asks for 10:15-11:15 (gap exactly 15 minutes). Run C then asks for 11:29-12:29 (gap 14 minutes behind run B)."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-A", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0800, transmitted_wavefront_budget_waves: 0.1050 }
              as: OpticsEngineer
              captures: { d1: $.data.id }
            - call: "POST /optics/optical-designs/${d1}/tolerance-allocations"
              payload: { contributor_type: "SURFACE_IRREGULARITY", sensitivity_waves_per_unit: 1.5, manufacturing_tolerance_units: 0.0250 }
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/tolerance-analysis"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/optical-designs/${d1}/release"
              payload: {}
              as: OpticsEngineer
            - call: "POST /optics/glass-lots"
              payload: { lot_code: "GL-2540-1", glass_type: "N-BK7", melt_index_nd: 1.516800, total_blank_count: 20, declared_index_homogeneity_grade: "H2", declared_striae_grade: "A" }
              as: ProcurementOfficer
              captures: { g1: $.data.id }
            - call: "POST /optics/glass-lots/${g1}/certification"
              payload: { measured_index_homogeneity_grade: "H3", measured_striae_grade: "B", certificate_reference: "CERT-2540-1" }
              as: ProcurementOfficer
              captures: { g1v: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-1", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v}" }
              as: ProcessTechnician
              captures: { w1: $.data.id }
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
              captures: { g1v2: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-2", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v2}" }
              as: ProcessTechnician
              captures: { w2: $.data.id }
            - call: "GET /optics/glass-lots/${g1}"
              payload: {}
              as: ProcurementOfficer
              captures: { g1v3: $.data.version }
            - call: "POST /optics/work-orders"
              payload: { wo_code: "WO-2540-3", design_id: "${d1}", glass_lot_id: "${g1}", element_count: 2, expected_glass_lot_version: "${g1v3}" }
              as: ProcessTechnician
              captures: { w3: $.data.id }
            - call: "POST /optics/metrology-instruments"
              payload: { instrument_code: "IF-2540-1", instrument_type: "PHASE_SHIFTING_INTERFEROMETER", base_uncertainty_waves: 0.0010, last_calibrated_utc: "2026-08-01T00:00:00Z", lateral_resolution_um: 5.0 }
              as: PlantAdmin
              captures: { i1: $.data.id }
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w1}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-08-01T08:00:00Z", metrology_window_end_utc: "2026-08-01T10:00:00Z" }
              as: ProcessTechnician
              captures: { rA: $.data.id }
          trigger:
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w2}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-08-01T10:15:00Z", metrology_window_end_utc: "2026-08-01T11:15:00Z" }
              as: ProcessTechnician
              captures: { rB: $.data.id }
            - call: "POST /optics/process-runs"
              payload: { work_order_id: "${w3}", metrology_instrument_id: "${i1}", run_stage: "POLISHING", metrology_window_start_utc: "2026-08-01T11:29:00Z", metrology_window_end_utc: "2026-08-01T12:29:00Z" }
              as: ProcessTechnician
          assert:
            - "the first trigger returns HTTP 201"
            - "ProcessRun.${rA}.window_minutes == 120"
            - "ProcessRun.${rB}.window_minutes == 60"
            - "ProcessRun.${rB}.run_status == SCHEDULED"
            - "MetrologyInstrument.${i1}.booked_minutes_total == 180 after the admitted booking"
            - "the second trigger returns HTTP 409 with error_id ERR_INSTRUMENT_WINDOW_CONFLICT"
            - "MetrologyInstrument.${i1}.booked_minutes_total == 180 after the refusal"
            - "WorkOrder.${w3}.process_status == BLANKS_RESERVED"

      - name: chamber_half_open_interval_admits_touching_booking_and_rejects_overlap_at_capacity
        grounds:
          - calculations.chamber_capacity_occupancy
          - validations.priority_20
          - errors.ERR_CHAMBER_CAPACITY_EXCEEDED
          - entities.CoatingChamber.fields.slot_capacity
          - state_machines.WorkOrder.FIGURE_ACCEPTED_to_COATING
        distinguishing_aspect: |
          Chamber bookings are HALF-OPEN [start, end) with aggregate capacity and no purge buffer, the
          exact opposite convention to the instrument ledger: against a single-slot chamber already
          holding [08:00, 12:00) a request for [11:00, 15:00) overlaps and is refused with
          ERR_CHAMBER_CAPACITY_EXCEEDED, while the touching request [12:00, 16:00) — zero gap — is
          admitted and moves its work order FIGURE_ACCEPTED -> COATING.
        test_recipe:
          setup:
            - "Two WorkOrders on a RELEASED design, both driven to FIGURE_ACCEPTED on instrument IF-2540-1 with non-conflicting metrology windows."
            - "CoatingChamber CH-2540-1 has slot_capacity 1 and already holds a LOADED coating run for WO-2540-1 spanning 2026-08-02T08:00:00Z to 2026-08-02T12:00:00Z."
            - "Logical clock untouched at 2026-08-01T00:00:00Z."
