  - rule_id: boundary_precision_check
    instances:
      - name: dispensing_fee_waived_exactly_at_fifty_thousand_cent_subtotal
        grounds:
          - calculations.abn_cash_quote
          - entities.AbnNotice.fields.estimated_subtotal_cents
          - entities.AbnNotice.fields.dispensing_fee_cents
          - entities.AbnNotice.fields.estimated_cost_cents
        distinguishing_aspect: |
          Boundary metric #1 is a MONEY threshold reached through POST
          /dme/encounters/{id}/abn-notices: FEE_WAIVER_SUBTOTAL_CENTS is
          inclusive (>=), so a subtotal of exactly 50000 waives the 2500-cent
          dispensing fee while 49999 charges it in full. The other three
          instances of this rule sit on a calendar-month window, an integer
          shelf-count threshold and a zero-count empty-collection edge, each
          through a different endpoint.
        test_recipe:
          setup:
            - "one accredited clinic licensed for SPINE, one group physician, one patient"
            - "product X priced 11765 cash; product Y priced 49999 cash; both OFF_SHELF_PREFAB SPINE items in different same-or-similar groups"
