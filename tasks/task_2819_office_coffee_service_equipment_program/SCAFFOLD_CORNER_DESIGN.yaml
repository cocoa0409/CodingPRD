            - call: "POST /ocs/accounts"
              payload: { legal_name: "Northgate Holdings LLC", billing_mode: "CONSOLIDATED", green_index_baseline_micros: 2000000, price_protection_days: 90 }
              as: AccountManager
              captures: { acct_id: "$.data.id" }
            - call: "POST /ocs/sites"
              payload: { account_id: "${acct_id}", route_id: "${route_id}", site_name: "HQ Floor 3", headcount: 40, days_per_week: 5, consumption_model: "HEADCOUNT_MODEL", service_minutes_estimate: 45 }
              as: AccountManager
              captures: { site_id: "$.data.id" }
            - call: "POST /ocs/sites/${site_id}/size-and-plan"
              payload: { brew_style: "DRIP" }
              as: AccountManager
          trigger:
            - call: "POST /ocs/service-visits"
              payload: { site_id: "${site_id}", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T09:45:00Z", planned_minutes: 45 }
              as: AccountManager
              captures: { visit_id: "$.data.id" }
            - call: "GET /ocs/routes/${route_id}/day-load"
              payload: { service_date: "2026-08-03" }
              as: AccountManager
            - call: "POST /ocs/service-visits/${visit_id}/lines"
              payload: { product_id: "${p_cof_id}", requested_units: 20 }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "GET /ocs/service-visits/${visit_id}"
              payload: {}
              as: AccountManager
            - call: "POST /ocs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /ocs/service-visits/${visit_id}/complete"
              payload: { delivered_lines: [{ product_id: "${p_cof_id}", delivered_units: 20 }] }
              as: RouteTechnician
              as_user_id: "${route_id}"
            - call: "GET /ocs/par-levels?site_id=${site_id}"
              payload: {}
              as: AccountManager
            - call: "GET /ocs/accounts/${acct_id}"
              payload: {}
              as: BillingSpecialist
              captures: { acct_v: "$.data.version" }
            - call: "POST /ocs/consolidated-invoices"
              payload: { account_id: "${acct_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-03T09:30:00Z", expected_account_version: "${acct_v}" }
              as: BillingSpecialist
              captures: { inv_id: "$.data.id" }
            - call: "GET /ocs/invoice-lines?invoice_id=${inv_id}"
              payload: {}
              as: BillingSpecialist
          assert:
            - "the scheduling response already carries route_id == ${route_id}, and the day-load read in the very next request reports booked_minutes_day == 45 and remaining_minutes == 435"
            - "the line response shows the visit's lines array with one element, and the immediate GET of the visit shows the same single line with requested_units == 20 and delivered_units null"
            - "the completion response itself carries the per-line results (consumed_units == 0 because elapsed_days == 0, delivered_units == 20, effective_unit_price_micros == 4500000, resulting_on_hand_units == 20)"
            - "the par-levels read immediately after completion reports on_hand_units == 20, cumulative_delivered_units == 20, cumulative_consumed_units == 0, last_service_at == 2026-08-03T09:00:00Z and stock_status == LOW, with no lag and no reconciliation step in between"
            - "the invoice creation response reports line_count == 2 and total_cents == 11500, and the invoice-lines read in the next request returns exactly those 2 rows (one PRODUCT 9000, one FREIGHT 2500), so the children are visible as soon as the parent is"

      - name: corner_a_credit_is_visible_on_the_invoice_the_moment_it_is_written
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /ocs/consolidated-invoices/{invoice_id}/credit]
        excluded_because:
          difficulty_instance: cross_entity_ledger_sync / credit_line_restores_account_receivable_after_an_unreturned_asset_writeoff
          rationale: "That §1.8 instance asserts the credit's effect on the invoice totals and the account receivable in the same response that writes the credit line."
