# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Residential Property Management — Expert
# 9 Difficulty Rules x 2 instances = 18 instances.
# Every grounds ref resolves to SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls
# chain drives empty-DB -> precondition using only declared §1.5 endpoints.
# All formula-derived asserts are precomputed literals (see scaffold-level
# computation; e.g. screening rti/dti, late fee, waterfall, deposit interest,
# settlement, statement net, distribution).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: owner_statement_cash_vs_accrual_diverge
        grounds:
          - calculations.owner_statement_net
          - entities.OwnerStatement.fields.basis
          - entities.OwnerStatement.fields.gross_cents
          - state_machines.OwnerStatement.DRAFT_to_FINALIZED
        distinguishing_aspect: |
          On OwnerStatement: a CASH-basis statement nets rent actually collected
          (137500) while an ACCRUAL-basis statement on the same property/period
          nets rent billed (200000) — different gross and different net_to_owner
          for identical underlying data.
        test_recipe:
          setup:
            - "Owner with management_fee_pct=0.08; Property in CA; Unit; signed ACTIVE lease; one RENT charge for 2026-06 of 200000 billed; a 150000 payment received 2026-06-10 applies 12500 to a late fee then 137500 to rent (137500 collected)."
            - "Two DRAFT statements for property period 2026-06: one basis=CASH, one basis=ACCRUAL."
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "Acme Holdings", email: "acme@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "Maple Court", state_code: "CA", address: "1 Maple St", reserve_floor_cents: 0 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "Apt 1A", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Pat Renter", email: "pat@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 700, requested_rent_cents: 200000, monthly_debt_cents: 50000 }
              as: PropertyManager
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
            - call: "POST /applicants/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", applicant_id: "${app_id}", start_date: "2026-06-01", end_date: "2027-06-01", monthly_rent_cents: 200000, late_fee_flat_cents: 2500, late_fee_pct: 0.05, grace_period_days: 5 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /security-deposits"
              payload: { lease_id: "${lease_id}", collected_cents: 300000, collected_date: "2026-06-01" }
              as: PropertyManager
            - call: "POST /leases/${lease_id}/sign"
              payload: {}
              as: PropertyManager
            - call: "POST /rent-charges"
              payload: { lease_id: "${lease_id}", period_label: "2026-06", due_date: "2026-06-01", amount_cents: 200000, charge_type: "RENT" }
              as: PropertyManager
            - call: "POST /leases/${lease_id}/assess-late-fees"
              payload: { as_of_date: "2026-06-09" }
              as: PropertyManager
            - call: "POST /payments"
              payload: { lease_id: "${lease_id}", amount_cents: 150000, received_date: "2026-06-10" }
              as: PropertyManager
            - call: "POST /owner-statements"
              payload: { property_id: "${prop_id}", period_label: "2026-06", basis: "CASH" }
              as: PropertyManager
              captures: { stmt_cash_id: $.data.id }
            - call: "POST /owner-statements"
              payload: { property_id: "${prop_id}", period_label: "2026-06", basis: "ACCRUAL" }
              as: PropertyManager
              captures: { stmt_acc_id: $.data.id }
          trigger:
            - call: "POST /owner-statements/${stmt_cash_id}/finalize"
              payload: {}
              as: PropertyManager
              captures: { cash_gross: $.data.gross_cents, cash_net: $.data.net_to_owner_cents }
            - call: "POST /owner-statements/${stmt_acc_id}/finalize"
              payload: {}
              as: PropertyManager
              captures: { acc_gross: $.data.gross_cents, acc_net: $.data.net_to_owner_cents }
          assert:
            - "OwnerStatement.${stmt_cash_id}.gross_cents == 137500"
            - "OwnerStatement.${stmt_cash_id}.management_fee_cents == 11000"
            - "OwnerStatement.${stmt_cash_id}.net_to_owner_cents == 126500"
            - "OwnerStatement.${stmt_acc_id}.gross_cents == 200000"
            - "OwnerStatement.${stmt_acc_id}.management_fee_cents == 16000"
            - "OwnerStatement.${stmt_acc_id}.net_to_owner_cents == 184000"
            - "OwnerStatement.${stmt_cash_id}.net_to_owner_cents != OwnerStatement.${stmt_acc_id}.net_to_owner_cents"

      - name: deposit_settlement_refund_vs_forfeit_diverge
        grounds:
          - calculations.deposit_settlement
          - calculations.deposit_interest
          - entities.SecurityDeposit.fields.refund_cents
          - entities.SecurityDeposit.fields.status
          - state_machines.SecurityDeposit.HELD_to_SETTLED
          - state_machines.SecurityDeposit.HELD_to_FORFEITED
        distinguishing_aspect: |
          On SecurityDeposit (a different entity domain from OwnerStatement): the
          same settle endpoint yields status SETTLED with refund_cents=196500 when
          arrears are small, but FORFEITED with refund_cents=0 when arrears consume
          the entire principal+interest — two valid outcomes of one algorithm.
        test_recipe:
          setup:
            - "NY property; lease EXPIRED; deposit collected 300000 on 2024-06-01, settled 2026-06-15 (744 days -> 2 full years -> NY interest 9000); available 309000."
            - "Lease balance_due 112500 in the refund branch (arrears+damage 50000 leave refund 196500)."
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "NY Owner", email: "ny@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "NY Tower", state_code: "NY", address: "5 Broadway", reserve_floor_cents: 0 }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "Apt 9C", market_rent_cents: 250000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Lee NY", email: "lee@x.com", unit_id: "${unit_id}", annual_income_cents: 18000000, credit_score: 720, requested_rent_cents: 250000, monthly_debt_cents: 0 }
              as: PropertyManager
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
            - call: "POST /applicants/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", applicant_id: "${app_id}", start_date: "2024-06-01", end_date: "2025-06-01", monthly_rent_cents: 250000, grace_period_days: 5 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /security-deposits"
              payload: { lease_id: "${lease_id}", collected_cents: 300000, collected_date: "2024-06-01" }
              as: PropertyManager
              captures: { dep_id: $.data.id }
            - call: "POST /leases/${lease_id}/sign"
              payload: {}
              as: PropertyManager
            - call: "POST /rent-charges"
              payload: { lease_id: "${lease_id}", period_label: "2025-05", due_date: "2025-05-01", amount_cents: 112500, charge_type: "RENT" }
              as: PropertyManager
            - call: "POST /leases/${lease_id}/expire"
              payload: { as_of_date: "2025-06-01" }
              as: PropertyManager
          trigger:
            - call: "POST /security-deposits/${dep_id}/settle"
              payload: { settlement_date: "2026-06-15", damage_deductions_cents: 50000 }
              as: PropertyManager
              captures: { d_status: $.data.status, d_refund: $.data.refund_cents }
          assert:
            - "SecurityDeposit.${dep_id}.interest_accrued_cents == 9000"
            - "SecurityDeposit.${dep_id}.deductions_cents == 162500"
            - "SecurityDeposit.${dep_id}.refund_cents == 146500"
            - "SecurityDeposit.${dep_id}.status == SETTLED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: screening_three_input_nonlinear_gate
        grounds:
          - calculations.applicant_screening
          - entities.Applicant.fields.screening_decision
          - entities.Applicant.fields.rent_to_income_ratio
          - entities.Applicant.fields.dti_ratio
          - state_machines.Applicant.SUBMITTED_to_SCREENED
        distinguishing_aspect: |
          Mode (a): screening combines THREE inputs (credit_score, rent_to_income_ratio,
          dti_ratio) under a conjunctive non-linear gate (all three thresholds must
          hold); flipping any single input across its breakpoint flips PASS->FAIL.
        test_recipe:
          setup:
            - "Applicant with income 6000000, requested rent 250000 -> rti 0.5000 (> MAX_RTI 0.40) although credit_score 700 passes; conjunctive gate => FAIL."
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "O", email: "o@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "P", state_code: "TX", address: "A" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "U1", market_rent_cents: 250000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Fail RTI", email: "f@x.com", unit_id: "${unit_id}", annual_income_cents: 6000000, credit_score: 700, requested_rent_cents: 250000, monthly_debt_cents: 50000 }
              as: PropertyManager
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
              captures: { decision: $.data.screening_decision, rti: $.data.rent_to_income_ratio, dti: $.data.dti_ratio }
          assert:
            - "Applicant.${app_id}.rent_to_income_ratio == 0.5"
            - "Applicant.${app_id}.dti_ratio == 0.6"
            - "Applicant.${app_id}.screening_decision == FAIL"
            - "Applicant.${app_id}.status == SCREENED"

      - name: late_fee_round_then_add_flat_order
        grounds:
          - calculations.late_fee_assessment
          - entities.Lease.fields.late_fee_pct
          - entities.Lease.fields.late_fee_flat_cents
          - entities.RentCharge.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested-rounding order is pinned — round (monthly_rent * late_fee_pct)
          to whole cents FIRST, THEN add the flat component. With rent 200000 and
          pct 0.05 -> round(10000.0)=10000, +2500 flat = 12500; the order is fixed so
          the cents are deterministic.
        test_recipe:
          setup:
            - "ACTIVE lease rent 200000, late_fee_pct 0.05, late_fee_flat 2500, grace 5; one RENT charge due 2026-06-01; sweep as_of 2026-06-09 (after the 2026-06-06 cutoff) -> one LATE_FEE charge of 12500."
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "O2", email: "o2@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "P2", state_code: "TX", address: "A2" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "U2", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "OnTime", email: "ot@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 700, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
            - call: "POST /applicants/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", applicant_id: "${app_id}", start_date: "2026-06-01", end_date: "2027-06-01", monthly_rent_cents: 200000, late_fee_pct: 0.05, late_fee_flat_cents: 2500, grace_period_days: 5 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /security-deposits"
              payload: { lease_id: "${lease_id}", collected_cents: 200000, collected_date: "2026-06-01" }
              as: PropertyManager
            - call: "POST /leases/${lease_id}/sign"
              payload: {}
              as: PropertyManager
            - call: "POST /rent-charges"
              payload: { lease_id: "${lease_id}", period_label: "2026-06", due_date: "2026-06-01", amount_cents: 200000, charge_type: "RENT" }
              as: PropertyManager
          trigger:
            - call: "POST /leases/${lease_id}/assess-late-fees"
              payload: { as_of_date: "2026-06-09" }
              as: PropertyManager
              captures: { bal: $.data.balance_due_cents }
          assert:
            - "Lease.${lease_id}.balance_due_cents == 212500"
            - "GET /rent-charges?lease_id=${lease_id}&charge_type=LATE_FEE returns exactly one charge with amount_cents == 12500"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: lease_renewal_offer_cycle
        grounds:
          - state_machines.Lease.ACTIVE_to_RENEWAL_OFFERED
          - state_machines.Lease.RENEWAL_OFFERED_to_ACTIVE
          - entities.Lease.fields.status
          - entities.Lease.fields.version
        distinguishing_aspect: |
          Cycle on Lease: ACTIVE -> RENEWAL_OFFERED -> ACTIVE is a true loop (offer
          then retract), with version incrementing on each hop; the entity returns to
          ACTIVE, not a terminal state.
        test_recipe:
          setup:
            - "Signed ACTIVE lease; observe version after sign."
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "O3", email: "o3@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "P3", state_code: "TX", address: "A3" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "U3", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Cyc", email: "c@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 700, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
            - call: "POST /applicants/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", applicant_id: "${app_id}", start_date: "2026-06-01", end_date: "2027-06-01", monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease_id: $.data.id }
            - call: "POST /security-deposits"
              payload: { lease_id: "${lease_id}", collected_cents: 200000, collected_date: "2026-06-01" }
              as: PropertyManager
            - call: "POST /leases/${lease_id}/sign"
              payload: {}
              as: PropertyManager
              captures: { v_signed: $.data.version }
          trigger:
            - call: "POST /leases/${lease_id}/offer-renewal"
              payload: { expected_lease_version: "${v_signed}" }
              as: PropertyManager
              captures: { v_offered: $.data.version, s_offered: $.data.status }
            - call: "POST /leases/${lease_id}/offer-renewal"
              payload: { expected_lease_version: "${v_offered}" }
              as: PropertyManager
              captures: { s_retracted: $.data.status }
          assert:
            - "Lease.${lease_id}.status after first offer-renewal == RENEWAL_OFFERED"
            - "Lease.${lease_id}.status after second offer-renewal == ACTIVE"
            - "Lease.${lease_id}.version strictly increased on each offer-renewal call"

      - name: applicant_screened_fork_approve_or_deny
        grounds:
          - state_machines.Applicant.SCREENED_to_APPROVED
          - state_machines.Applicant.SCREENED_to_DENIED
          - entities.Applicant.fields.status
        distinguishing_aspect: |
          Branching fork on Applicant (a different entity from Lease): a single SCREENED
          state forks to two divergent terminal-ish targets APPROVED vs DENIED via the
          decision input, with different downstream eligibility per branch.
        test_recipe:
          setup:
            - "Two SCREENED applicants on the same VACANT_READY unit, both with passing screening; one decided APPROVE, the other DENY."
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "O4", email: "o4@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "P4", state_code: "TX", address: "A4" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "U4", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "AppA", email: "aa@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 700, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { app_a: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "AppB", email: "ab@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 700, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { app_b: $.data.id }
            - call: "POST /applicants/${app_a}/screen"
              payload: {}
              as: PropertyManager
            - call: "POST /applicants/${app_b}/screen"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /applicants/${app_a}/decide"
              payload: { decision: "APPROVE" }
              as: PropertyManager
              captures: { sa: $.data.status }
            - call: "POST /applicants/${app_b}/decide"
              payload: { decision: "DENY" }
              as: PropertyManager
              captures: { sb: $.data.status }
          assert:
            - "Applicant.${app_a}.status == APPROVED"
            - "Applicant.${app_b}.status == DENIED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: eviction_enforce_terminates_lease_vacates_unit_opens_turnover
        grounds:
          - state_machines.EvictionCase.FILED_to_ENFORCED
          - state_machines.Lease.ACTIVE_to_TERMINATED
          - entities.Lease.fields.status
          - entities.Tenant.fields.status
          - entities.Unit.fields.occupancy_status
          - entities.TurnoverProject.fields.status
        distinguishing_aspect: |
          Depth-4 cascade from eviction enforce: EvictionCase ENFORCED -> Lease TERMINATED
          (hop1) -> Tenant FORMER (hop2, caused by the lease termination) and Unit
          VACANT_TURN (hop3) -> a TurnoverProject auto-opens (hop4). Each link is caused
          by the previous, not by the enforce action directly.
        test_recipe:
          setup:
            - "FL property; signed ACTIVE lease with a NONPAYMENT eviction served, cure window passed, case FILED."
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "O5", email: "o5@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
            - call: "POST /properties"
              payload: { owner_id: "${owner_id}", name: "P5", state_code: "FL", address: "A5" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /units"
              payload: { property_id: "${prop_id}", label: "U5", market_rent_cents: 200000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "Evd", email: "e5@x.com", unit_id: "${unit_id}", annual_income_cents: 12000000, credit_score: 700, requested_rent_cents: 200000 }
              as: PropertyManager
              captures: { app_id: $.data.id }
            - call: "POST /applicants/${app_id}/screen"
              payload: {}
              as: PropertyManager
            - call: "POST /applicants/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: PropertyManager
            - call: "POST /leases"
              payload: { unit_id: "${unit_id}", applicant_id: "${app_id}", start_date: "2026-06-01", end_date: "2027-06-01", monthly_rent_cents: 200000 }
              as: PropertyManager
              captures: { lease_id: $.data.id, tenant_pre: $.data.tenant_id }
            - call: "POST /security-deposits"
              payload: { lease_id: "${lease_id}", collected_cents: 200000, collected_date: "2026-06-01" }
              as: PropertyManager
            - call: "POST /leases/${lease_id}/sign"
              payload: {}
              as: PropertyManager
              captures: { tenant_id: $.data.tenant_id }
            - call: "POST /rent-charges"
              payload: { lease_id: "${lease_id}", period_label: "2026-06", due_date: "2026-06-01", amount_cents: 200000, charge_type: "RENT" }
              as: PropertyManager
            - call: "POST /evictions"
              payload: { lease_id: "${lease_id}", reason: "NONPAYMENT", notice_date: "2026-06-10" }
              as: PropertyManager
              captures: { evic_id: $.data.id }
            - call: "POST /evictions/${evic_id}/file"
              payload: { as_of_date: "2026-06-20" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /evictions/${evic_id}/enforce"
              payload: {}
              as: ComplianceOfficer
              captures: { evic_status: $.data.status }
          assert:
            - "EvictionCase.${evic_id}.status == ENFORCED"
            - "Lease.${lease_id}.status == TERMINATED"
            - "Tenant.${tenant_id}.status == FORMER"
            - "Unit.${unit_id}.occupancy_status == VACANT_TURN"
            - "GET /turnovers?unit_id=${unit_id} returns at least one TurnoverProject with status == OPEN"

      - name: lease_sign_mints_tenant_leases_applicant
        grounds:
          - state_machines.Lease.DRAFT_to_ACTIVE
          - state_machines.Applicant.APPROVED_to_LEASED
          - entities.Lease.fields.tenant_id
          - entities.Applicant.fields.status
          - entities.Tenant.fields.status
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (lease sign, not eviction): Lease
          DRAFT->ACTIVE (hop1) mints a Tenant and that activation in turn flips the
          source Applicant APPROVED->LEASED (hop2 caused by hop1).
        test_recipe:
          setup:
            - "APPROVED applicant with a HELD deposit and a DRAFT lease ready to sign."
          setup_api_calls:
            - call: "POST /owners"
              payload: { legal_name: "O6", email: "o6@x.com", management_fee_pct: 0.08 }
              as: PropertyManager
              captures: { owner_id: $.data.id }
