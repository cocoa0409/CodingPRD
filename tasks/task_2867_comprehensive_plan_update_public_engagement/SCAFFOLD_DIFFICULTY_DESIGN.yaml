              captures: { h4: $.data.id, h4_status: $.data.status }
          assert:
            - "the plan reached status == STATE_CERTIFIED with state_review_status == CERTIFIED and compliance_posture == CLEAR before any hearing was scheduled"
            - "a COMMISSION hearing starting exactly at the incumbent's scheduled_end (2026-09-25T21:00:00.000Z) returns HTTP 409 with error_id == \"ERR_HEARING_SLOT_CONFLICT\" (closed interval, no buffer)"
            - "the same request one millisecond later (2026-09-25T21:00:00.001Z) returns HTTP 201 with status == \"SCHEDULED\""
            - "a third COMMISSION hearing on 2026-09-25, non-overlapping at 09:00-11:00, returns HTTP 409 with error_id == \"ERR_HEARING_DAILY_CAP_EXCEEDED\" (MAX_HEARINGS_PER_BODY_PER_DAY == 2 counts SCHEDULED rows on the same UTC date)"
            - "a COUNCIL hearing that exactly duplicates the COMMISSION slot returns HTTP 409 with error_id == \"ERR_COMMISSION_RECOMMENDATION_REQUIRED\" - priority 78 answers before the calendar rules, and no COUNCIL row is created"
            - "a COMMISSION hearing on the next UTC date (2026-09-26) returns HTTP 201, so the cap is per calendar date and not per plan"
