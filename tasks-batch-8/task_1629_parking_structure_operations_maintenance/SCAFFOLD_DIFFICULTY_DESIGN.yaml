      trigger:
      - call: POST /ops/monthly-agreements/${agr}/suspend
        as: FacilityManager
      - call: POST /ops/monthly-agreements/${agr}/resume
        as: FacilityManager
      - call: POST /ops/monthly-agreements/${agr}/suspend
        as: FacilityManager
      - call: POST /ops/monthly-agreements/${agr}/resume
        as: FacilityManager
        captures:
          st: $.data.agreement_status
