  - section: endpoints
    instances:
      - name: carrier_create_read_and_filtered_list_round_trip
        claim_type: Standard CRUD
        grounds: ["endpoints[POST /numbering/carriers]", "endpoints[GET /numbering/carriers/{carrier_id}]", "endpoints[GET /numbering/carriers]"]
        distinguishing_aspect: "The carrier surface is create-read-list only: there is no PATCH and no DELETE, so the same row must be reachable by id and by an ocn filter with byte-identical field values, and every mutation happens through the licensing and readiness action endpoints instead."
        test_recipe:
          setup: ["Two carriers are registered: A (ocn 1234) and B (ocn 5678)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers"
              payload: { ocn: "5678", legal_name: "Buckeye Comm Inc", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 36 }
              as: NumberingAdministrator
              captures: { b_id: "$.data.id" }
          trigger:
            - call: "GET /numbering/carriers?ocn=1234"
              payload: {}
              as: RegulatoryApprover
              as_user_id: "approver-1"
              captures: { listed_id: "$.data[0].id" }
          assert:
            - "HTTP 200, total_count == 1, has_more == false and ${listed_id} == ${a_id}"
            - "The listed row equals GET /numbering/carriers/${a_id} field for field: legal_name \"Acme Telecom LLC\", carrier_type \"CLEC\", license_status \"NONE\", eligibility_status \"INELIGIBLE\", blocks_held_count 0, version 1"
            - "Carrier B is excluded from the filtered list yet still readable at GET /numbering/carriers/${b_id}"

      - name: readiness_event_action_endpoint_recomputes_eligibility
        claim_type: Action endpoint
        grounds: ["endpoints[POST /numbering/carriers/{carrier_id}/readiness-events]", "entities.Carrier.fields.eligibility_status"]
        distinguishing_aspect: "The readiness action endpoint owns a second, independent axis: VERIFY on an ATTESTED carrier that already holds a GRANTED licence is the single event that flips the derived eligibility_status from INELIGIBLE to ELIGIBLE, and the response carries the recomputed value in the same request."
        test_recipe:
          setup: ["Carrier A holds a GRANTED licence and has attested readiness with switch_clli CLMBOH01DS0 and interconnection_ready true, so facilities_readiness_status is ATTESTED and eligibility_status is still INELIGIBLE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { attested_eligibility: "$.data.eligibility_status" }
          trigger:
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "VERIFY", note: "CLLI verified against the LERG and interconnection trunks tested" }
              as: NumberingAdministrator
          assert:
            - "${attested_eligibility} == \"INELIGIBLE\" while readiness was only ATTESTED"
            - "HTTP 200, Carrier.facilities_readiness_status == \"VERIFIED\", eligibility_status == \"ELIGIBLE\", switch_clli == \"CLMBOH01DS0\", interconnection_ready == true"
            - "Carrier.license_status is still \"GRANTED\" - the licensing axis is untouched by a readiness event"

      - name: reclamation_sweep_processes_every_due_block_and_skips_the_rest
        claim_type: Bulk action
        grounds: ["endpoints[POST /numbering/reclamation-sweeps]", "calculations.activation_and_aging_schedule.formula"]
        distinguishing_aspect: "One sweep call is a partial-application bulk action: of three RESERVED blocks it reclaims exactly the two whose activation_due_at has passed, issues one order per reclaimed block, and leaves the third untouched rather than failing the whole call."
        test_recipe:
          setup: ["Carrier A is licensed and VERIFIED. Blocks 614-554-0 and 614-554-1 were loaded to A at 2026-08-01T00:00:00Z (activation_due_at 2027-01-28T00:00:00Z) and block 614-554-2 was loaded on 2026-09-01T00:00:00Z (activation_due_at 2027-02-28T00:00:00Z). None was ever activated. The clock is 2027-01-29T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 0, holder_carrier_id: "${a_id}" }
              as: NumberingAdministrator
              captures: { blk0_id: "$.data.id" }
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 1, holder_carrier_id: "${a_id}" }
              as: NumberingAdministrator
              captures: { blk1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 2, holder_carrier_id: "${a_id}" }
              as: NumberingAdministrator
              captures: { blk2_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-29T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/reclamation-sweeps"
              payload: { rate_center_id: "${rc_id}" }
              as: NumberingAdministrator
              captures: { orders_issued: "$.data.orders_issued", swept_at: "$.data.swept_at" }
          assert:
            - "HTTP 200, ${orders_issued} == 2, blocks_released == 0, routing_activated == 0 and ${swept_at} == \"2027-01-29T00:00:00Z\""
            - "GET /numbering/blocks/${blk0_id} and GET /numbering/blocks/${blk1_id} read allocation_status == \"RECLAMATION_PENDING\""
            - "GET /numbering/blocks/${blk2_id} still reads allocation_status == \"RESERVED\" with activation_due_at == \"2027-02-28T00:00:00Z\""
            - "GET /numbering/reclamation-orders with carrier_id == ${a_id} returns total_count == 2, one per reclaimed block, both with reason == \"ACTIVATION_DEADLINE_MISSED\""

