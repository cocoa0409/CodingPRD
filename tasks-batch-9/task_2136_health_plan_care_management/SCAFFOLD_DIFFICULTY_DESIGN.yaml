  - rule_id: transitive_cascade
    instances:
      - name: discharge_toc_escalation_depth_four_closes_auto_assign_pool
        grounds:
          - state_machines.Enrollment.toc.ACTIVE_to_ACTIVE_toc_escalation
          - calculations.caseload_weight_points
          - calculations.care_manager_auto_assignment
          - entities.CareManager.fields.capacity_status
          - entities.TransitionEvent.fields.toc_triggered_enrollment_count
        distinguishing_aspect: |
          Cascade one, depth four, triggered by recording a DISCHARGE TransitionEvent: the event sets
          toc_due_at and flips cadence_tier to TOC_INTENSIVE (hop 1); that tier change alone doubles
          acuity_weight_points from 4.0 to 8.0 (hop 2); that new weight alone pushes
          CareManager.assigned_caseload_points from 4.0 to 8.0 (hop 3); that new total alone flips
          capacity_status to OVER_CAPACITY (hop 4), which empties the auto-assignment candidate pool
          so a later enrollment is rejected with ERR_NO_ELIGIBLE_CARE_MANAGER.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default; program toc_outreach_hours 48."
            - "Exactly one care manager exists, RN licensed in CA with capacity_points 6.0."
            - "Member A stratifies CONCURRENT to 60 / RISING, is enrolled explicitly on that manager and activated, giving acuity_weight_points 4.0 and assigned_caseload_points 4.0 with capacity_status OPEN."
            - "Member B stratifies CONCURRENT to 36 / MODERATE and is not yet enrolled."
            - "An INPATIENT_ADMISSION event exists for member A to serve as the index admission."
          setup_api_calls:
            - call: "POST /care-management/programs"
              payload: { name: "TOC Cascade Program", min_risk_tier: "MODERATE", stratification_variant: "CONCURRENT", required_credential_levels: ["RN"], staff_minute_budget: 100000, hourly_cost_cents: 9000, cohort_benchmark_pmpm_cents: 100000, toc_outreach_hours: 48 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /care-management/care-managers"
              payload: { full_name: "Rita Nolan", credential_level: "RN", licensed_state_codes: ["CA"], capacity_points: 6.0 }
              as: ProgramAdmin
              captures: { cm1: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-8001", full_name: "Ivy Chen", birth_date: "1955-06-06", state_code: "CA", chronic_condition_count: 10 }
              as: ProgramAdmin
              captures: { m_a: $.data.id }
            - call: "POST /care-management/members"
              payload: { external_member_id: "MBR-8002", full_name: "Otto Lang", birth_date: "1963-09-21", state_code: "CA", chronic_condition_count: 6 }
              as: ProgramAdmin
              captures: { m_b: $.data.id }
            - call: "POST /care-management/members/${m_a}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { a_tier: $.data.tier }
            - call: "POST /care-management/members/${m_b}/stratifications"
              payload: { variant: "CONCURRENT" }
              as: UtilizationAnalyst
              captures: { b_tier: $.data.tier }
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m_a}", program_id: "${prog}", care_manager_id: "${cm1}" }
              as: ProgramAdmin
              captures: { enr_a: $.data.id }
            - call: "POST /care-management/enrollments/${enr_a}/activate"
              payload: {}
              as: ProgramAdmin
              captures: { weight_before: $.data.acuity_weight_points, tier_before: $.data.cadence_tier }
            - call: "GET /care-management/care-managers/${cm1}"
              payload: {}
              as: ProgramAdmin
              captures: { load_before: $.data.assigned_caseload_points, cap_before: $.data.capacity_status }
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m_a}", event_type: "INPATIENT_ADMISSION", occurred_at: "2026-07-28T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 900000, adjudication_status: "CLOSED" }
              as: ProgramAdmin
              captures: { adm: $.data.id }
          trigger:
            - call: "POST /care-management/transition-events"
              payload: { member_id: "${m_a}", event_type: "DISCHARGE", occurred_at: "2026-08-01T00:00:00Z", facility_name: "Bay General", episode_cost_cents: 0, adjudication_status: "CLOSED", discharge_disposition: "HOME", index_admission_event_id: "${adm}" }
              as: ProgramAdmin
              captures: { disch: $.data.id, toc_count: $.data.toc_triggered_enrollment_count }
            - call: "GET /care-management/enrollments/${enr_a}"
              payload: {}
              as: ProgramAdmin
              captures: { toc_due: $.data.toc_due_at, tier_after: $.data.cadence_tier, weight_after: $.data.acuity_weight_points, pre_toc: $.data.pre_toc_cadence_tier, next_due: $.data.next_touch_due_at }
            - call: "GET /care-management/care-managers/${cm1}"
              payload: {}
              as: ProgramAdmin
              captures: { load_after: $.data.assigned_caseload_points, cap_after: $.data.capacity_status }
            - call: "POST /care-management/enrollments"
              payload: { member_id: "${m_b}", program_id: "${prog}" }
              as: ProgramAdmin
              captures: { pool_err: $.data.error_id }
          assert:
            - "${a_tier} == RISING and ${b_tier} == MODERATE"
            - "${weight_before} == 4.0 and ${tier_before} == STANDARD"
            - "${load_before} == 4.0 and ${cap_before} == OPEN"
            - "${toc_count} == 1"
            - "${toc_due} == 2026-08-03T00:00:00.000Z"
            - "${tier_after} == TOC_INTENSIVE and ${pre_toc} == STANDARD"
            - "${weight_after} == 8.0"
            - "${load_after} == 8.0"
            - "${cap_after} == OVER_CAPACITY"
            - "${next_due} == 2026-08-03T00:00:00.000Z"
            - "${pool_err} == ERR_NO_ELIGIBLE_CARE_MANAGER"
            - "the auto-assign attempt for ${m_b} returns HTTP 409 and creates no Enrollment"
            - "Enrollment.${enr_a}.cadence_tier_snapshot == TOC_INTENSIVE"
            - "TransitionEvent.${disch}.index_admission_event_id == ${adm}"

      - name: referral_unmet_barrier_cascade_depth_three_on_matching_domain
        grounds:
          - state_machines.Referral.ACCEPTED_to_CLOSED_UNMET
          - state_machines.SocialNeed.REFERRED_to_UNMET_ESCALATED
          - state_machines.CarePlanGoal.OPEN_to_AT_RISK
          - entities.CarePlan.fields.at_risk_goal_count
          - entities.CarePlan.fields.compliance_posture
        distinguishing_aspect: |
          Cascade two, depth three, from a different trigger - closing a referral loop as
          SERVICE_NOT_DELIVERED: the closure escalates the SocialNeed to UNMET_ESCALATED (hop 1);
          that escalation alone moves the FOOD goal OPEN -> AT_RISK with barrier_flag true (hop 2);
          that goal move alone raises CarePlan.at_risk_goal_count to 1 and flips compliance_posture
          to AT_RISK (hop 3). The CLINICAL goal is untouched, proving the hop-2 link is keyed on the
          domain match rather than a fan-out over all goals.
