    side_effects: []

  - method: GET
    path: "/regulatory-exams/remediation-plans"
    description: "Filtered list of remediation plans by owner_user_id (FK reverse-reachability for RemediationPlan.owner_user_id -> BankOfficer.id)"
    roles: [PlatformAdmin, RegulatoryAffairsManager, ComplianceReviewer, RemediationOwner, BoardReporter]
    code: 200
    input: ["limit?", "offset?", "owner_user_id?"]
    output: RemediationPlan[]
    side_effects: []

  - method: GET
    path: "/regulatory-exams/validation-evidence"
    description: "Filtered list of validation evidence by submitted_by_user_id (FK reverse-reachability for ValidationEvidence.submitted_by_user_id -> BankOfficer.id)"
    roles: [PlatformAdmin, RegulatoryAffairsManager, ComplianceReviewer, RemediationOwner, BoardReporter]
    code: 200
    input: ["limit?", "offset?", "submitted_by_user_id?"]
    output: ValidationEvidence[]
    side_effects: []

  - method: GET
    path: "/regulatory-exams/closure-requests"
    description: "Filtered list of closure requests by validation_evidence_id or reviewed_by_user_id (FK reverse-reachability for ClosureRequest.validation_evidence_id -> ValidationEvidence.id and ClosureRequest.reviewed_by_user_id -> ComplianceReviewer.id)"
    roles: [PlatformAdmin, RegulatoryAffairsManager, ComplianceReviewer, RemediationOwner, BoardReporter]
    code: 200
    input: ["limit?", "offset?", "validation_evidence_id?", "reviewed_by_user_id?"]
    output: ClosureRequest[]
    side_effects: []

  - method: GET
    path: "/regulatory-exams/commitments"
    description: "Filtered list of commitment log entries by committed_by_user_id (FK reverse-reachability for CommitmentLogEntry.committed_by_user_id -> BankOfficer.id)"
    roles: [PlatformAdmin, RegulatoryAffairsManager, ComplianceReviewer, RemediationOwner, BoardReporter]
    code: 200
    input: ["limit?", "offset?", "committed_by_user_id?"]
    output: CommitmentLogEntry[]
    side_effects: []

  # --- Test-driving endpoints ---
  - method: POST
    path: "/regulatory-exams/_clock/set_current_utc"
    description: "Set the logical clock to an arbitrary ISO8601 UTC timestamp. Server startup default (before any set call) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Advancing the clock fires all clock-driven transitions (issue OVERDUE, milestone OVERDUE) and recomputes overdue_item_count and exam posture."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "transitions PENDING/IN_PROGRESS RemediationMilestone rows with due_date < new time to OVERDUE"
      - "transitions OPEN/REMEDIATION_PLANNED/IN_PROGRESS Issue rows with due_date < new time to OVERDUE and recomputes repeat_finding_risk_score_bp"
      - "recomputes overdue_item_count and posture on every affected examination"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted to invoke this endpoint"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "State-machine precondition failed for the requested transition"

  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "Requested transition from a terminal state (CLOSED, CANCELLED, SUBMITTED, WAIVED, ACCEPTED, REJECTED, FINALIZED, COMPLETE, SUPERSEDED, SUFFICIENT, INSUFFICIENT, APPROVED)"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Reviewer attempting to approve/reject a ClosureRequest on an issue whose ACTIVE remediation plan is owned by the same user id"

  - id: ERR_CERTIFICATION_INSUFFICIENT
    http: 422
    condition: "Reviewer certification_level below L3 while target issue classification is MRIA"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_<parent>_version does not match current parent version"

  - id: ERR_EXAM_SCHEDULE_OVERLAP
    http: 422
    condition: "New examination's [scheduled_start_date, scheduled_end_date) overlaps an existing non-terminal examination for the same agency"

  - id: ERR_MEETING_DATE_CONFLICT
    http: 422
    condition: "A FINALIZED ExaminerMeeting already exists on the same examination with the same UTC calendar date"

  - id: ERR_INVALID_DATE_RANGE
    http: 400
    condition: "scheduled_end_date <= scheduled_start_date, or reporting_period_end < reporting_period_start"

  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "Uniqueness constraint violated (agency_code, request_ref per exam, issue_ref per exam, sequence_index per plan)"

  - id: ERR_INVALID_REFERENCE
    http: 422
    condition: "Payload FK references a non-existent resource or a resource outside the required ancestry"

  - id: ERR_EXAM_POSTURE_FROZEN
    http: 422
    condition: "Examination posture FROZEN blocks document submission creation; posture IN {RESTRICTED, FROZEN} blocks first-day item creation"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, invalid enum, empty required array, or malformed payload"

  - id: ERR_ISSUE_NOT_CLOSABLE
    http: 422
    condition: "submit-validation invoked while issue not in IN_PROGRESS, milestones incomplete, or evidence not SUFFICIENT on same issue"

  - id: ERR_NO_ACTIVE_PLAN
    http: 422
    condition: "Milestone start/complete invoked while parent plan is not ACTIVE"

  - id: ERR_COMMITMENT_OUTSTANDING
    http: 422
    condition: "Examination close attempted while any CommitmentLogEntry has fulfilled_at == null"

  - id: ERR_OPEN_ISSUES_REMAIN
    http: 422
    condition: "Examination close attempted while any Issue.status != CLOSED"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System operator; seeds agencies, officers, reviewers, and drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /regulatory-exams/agencies"
      - "POST /regulatory-exams/officers"
      - "POST /regulatory-exams/reviewers"
      - "POST /regulatory-exams/_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across the surface"

  - name: RegulatoryAffairsManager
    description: "Runs the exam lifecycle: scheduling, first-day letter, fieldwork, findings, remediation-open, close/cancel, meetings, findings capture, commitments"
    identity: "opaque"
    exclusive_operations:
      - "POST /regulatory-exams/examinations"
      - "POST /regulatory-exams/examinations/{id}/issue-first-day-letter"
      - "POST /regulatory-exams/examinations/{id}/begin-fieldwork"
      - "POST /regulatory-exams/examinations/{id}/deliver-findings"
      - "POST /regulatory-exams/examinations/{id}/open-remediation"
      - "POST /regulatory-exams/examinations/{id}/close"
      - "POST /regulatory-exams/examinations/{id}/cancel"
      - "POST /regulatory-exams/examinations/{id}/first-day-items"
      - "POST /regulatory-exams/first-day-items/{id}/waive"
      - "POST /regulatory-exams/examiner-meetings"
      - "POST /regulatory-exams/examiner-meetings/{id}/finalize"
      - "POST /regulatory-exams/examiner-meetings/{id}/informal-findings"
      - "POST /regulatory-exams/examinations/{id}/issues"
      - "POST /regulatory-exams/examinations/{id}/commitments"
      - "POST /regulatory-exams/commitments/{id}/fulfill"
    shared_operations:
      - "GET endpoints across the surface"

  - name: RemediationOwner
    description: "Bank officer accountable for remediation execution: document submissions, plans, milestones, evidence"
    identity: "entity_backed:BankOfficer"
    exclusive_operations:
      - "POST /regulatory-exams/first-day-items/{id}/submissions"
      - "POST /regulatory-exams/issues/{id}/remediation-plans"
      - "POST /regulatory-exams/remediation-plans/{id}/submit"
      - "POST /regulatory-exams/remediation-plans/{id}/revise"
      - "POST /regulatory-exams/remediation-plans/{id}/activate"
      - "POST /regulatory-exams/remediation-plans/{id}/milestones"
      - "POST /regulatory-exams/remediation-milestones/{id}/start"
      - "POST /regulatory-exams/remediation-milestones/{id}/complete"
      - "POST /regulatory-exams/issues/{id}/validation-evidence"
      - "POST /regulatory-exams/issues/{id}/submit-validation"
    shared_operations:
      - "GET endpoints across the surface"

  - name: ComplianceReviewer
    description: "Independent reviewer; QC of submissions, plan approval, evidence sufficiency, closure approval. Segregated from RemediationOwner on the same issue."
    identity: "entity_backed:ComplianceReviewer"
    exclusive_operations:
      - "POST /regulatory-exams/document-submissions/{id}/accept"
      - "POST /regulatory-exams/document-submissions/{id}/reject"
      - "POST /regulatory-exams/remediation-plans/{id}/approve"
      - "POST /regulatory-exams/remediation-plans/{id}/reject"
      - "POST /regulatory-exams/validation-evidence/{id}/mark-sufficient"
      - "POST /regulatory-exams/validation-evidence/{id}/mark-insufficient"
      - "POST /regulatory-exams/closure-requests/{id}/approve"
      - "POST /regulatory-exams/closure-requests/{id}/reject"
    shared_operations:
      - "GET endpoints across the surface"

  - name: BoardReporter
    description: "Generates and finalizes board reporting snapshots"
    identity: "opaque"
    exclusive_operations:
      - "POST /regulatory-exams/board-reports"
      - "POST /regulatory-exams/board-reports/{id}/finalize"
    shared_operations:
      - "GET endpoints across the surface"
