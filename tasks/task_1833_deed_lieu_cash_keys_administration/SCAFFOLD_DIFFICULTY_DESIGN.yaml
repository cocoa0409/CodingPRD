            - { call: "POST /property-solutions/title-commitments/${tc_id}/receive", payload: { vested_owner_name: "A. Borrower" }, as: TitleOfficer, as_user_id: to_1 }
            - { call: "POST /property-solutions/cases/${case_id}/certify-title", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "GET /property-solutions/cases/${case_id}", as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { case_v: $.data.version } }
            - { call: "POST /property-solutions/cases/${case_id}/agreements", payload: { vacate_date: "2026-09-01", expected_case_version: "${case_v}" }, as: PropertySolutionsSpecialist, as_user_id: spec_1, captures: { ag_id: $.data.id } }
