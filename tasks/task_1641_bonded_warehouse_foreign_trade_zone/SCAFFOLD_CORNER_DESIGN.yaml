          - "errors[ERR_WITHDRAWAL_OUTSIDE_ENTRY_WEEK]"
        distinguishing_aspect: "Filing time (default clock 2026-08-01) outside the attached entry's week [2026-08-03, 2026-08-10) -> ERR_WITHDRAWAL_OUTSIDE_ENTRY_WEEK (422)."
        test_recipe:
          setup: ["Zone; lot (qty 5, unit 1000, HTS 0401.10, NPF); OPEN weekly entry for week 2026-08-03; withdrawal attached at create (entry OPEN passes the create-time state check)"]
          setup_api_calls:
