  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: cross_region_posture_gates_capacity_plan_activation
        grounds:
          - state_machines.CapacityPlan.UNDER_REVIEW_to_ACTIVE
          - state_machines.Region.RESTRICTED_to_OPEN
          - state_machines.CapacityPlan.ACTIVE_to_FROZEN
          - entities.Region.fields.posture
        distinguishing_aspect: "Cross-entity pair Region -> CapacityPlan: activation requires Region.posture IN {OPEN, RESTRICTED}, so the same plan flips between ACTIVATABLE and non-activatable purely from the region's derived posture."
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-09-01T00:00:00Z default."
            - "One OPEN region whose single member's capitation leaves a negative settled operating margin, so the region is RESTRICTED before the plan ever activates; panel_target is 3 while budgeted_slots is 100."
          setup_api_calls:
            - call: "POST /regions"
              payload: { name: "Juliet Region", state_codes: ["IL"], margin_target_pct: 0.03, capitation_index: 1.0 }
              as: PlatformAdmin
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /regions/${r1}/care-sites"
              payload: { site_name: "Juliet Medical Office", site_type: "MEDICAL_OFFICE", licensed_beds: 0, staffing_fte_budget: 1.0, facility_investment_budget_cents: 0 }
              as: RegionalFinanceOfficer
              captures: { cs1: $.data.id }
            - call: "POST /care-sites/${cs1}/departments"
              payload: { specialty: "PRIMARY_CARE", appointment_slots_budgeted: 200, wait_threshold_days: 14 }
              as: AccessScheduler
              captures: { d1: $.data.id }
            - call: "POST /care-sites/${cs1}/providers"
              payload: { provider_name: "Dr Luis Ferrer", specialty: "PRIMARY_CARE", compensation_model: "SALARY", base_component_cents: 5000000, panel_size_target: 1000 }
              as: RegionalFinanceOfficer
              captures: { p1: $.data.id }
            - call: "POST /regions/${r1}/members"
              payload: { member_ref: "M-CL-1", attributed_provider_id: "${p1}", plan_product: "COMMERCIAL_HMO", benefit_tier: "TIER_1", risk_score: 1.0, coverage_effective_date: "2026-09-01T00:00:00Z" }
              as: RegionalFinanceOfficer
              captures: { m1: $.data.id, m1_v: $.data.version }
            - call: "POST /regions/${r1}/capacity-plans"
              payload: { department_id: "${d1}", period: "2026-09", budgeted_slots: 100, panel_target: 3 }
              as: RegionalFinanceOfficer
              captures: { cp1: $.data.id }
            - call: "POST /capacity-plans/${cp1}/review"
              payload: {}
              as: AccessScheduler
          trigger:
            - call: "GET /regions/${r1}"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { r1_posture_before: $.data.posture, r1_margin_before: $.data.operating_margin_cents }
            - call: "POST /capacity-plans/${cp1}/activate"
              payload: {}
              as: RegionalFinanceOfficer
              captures: { cp1_status: $.data.status }
          assert:
            - "Region.${r1}.operating_margin_cents == -3750000 and Region.${r1}.posture == RESTRICTED before activation"
            - "CapacityPlan.${cp1}.status == ACTIVE despite the negative margin, because the activation precondition admits posture RESTRICTED"
            - "the same activation is refused when the region posture is FROZEN, so the gate reads Region.posture rather than the plan alone"
            - "the adjustment path is only reachable while budgeted_slots remains at or above committed_slots, so the gate is on the region state rather than on the plan"

      - name: cross_member_transfer_gates_provider_panel_close
        grounds:
          - state_machines.MemberTransfer.PENDING_EFFECTIVE_to_COMPLETED
          - state_machines.Member.TRANSFER_PENDING_to_ACTIVE
