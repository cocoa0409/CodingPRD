# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Single top-level key: scaffold_corner_design
# Breadth probe: every testable claim in §1.1–§1.7 not already covered by §1.8.
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section 1: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: product_creation_defaults_posture_open_zero_counters
        claim_type: creation_with_defaults
        grounds:
          - entities.Product.fields.posture
          - entities.Product.fields.open_complaint_count
          - entities.Product.fields.early_warning_active
        distinguishing_aspect: "A freshly created Product starts with posture OPEN, open_complaint_count 0, substantiated_count_90d 0, early_warning_active false, version 1."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-INIT", display_name: "Init Product" }
              as: ComplaintManager
              captures: { pid: $.data.id }
          trigger:
            - call: "GET /complaint-office/products/${pid}"
              payload: {}
              as: Auditor
          assert:
            - "Product.${pid}.posture == OPEN"
            - "Product.${pid}.open_complaint_count == 0"
            - "Product.${pid}.substantiated_count_90d == 0"
            - "Product.${pid}.early_warning_active == false"
            - "Product.${pid}.version == 1"

      - name: channel_default_is_regulator_portal_false
        claim_type: defaults
        grounds:
          - entities.Channel.fields.is_regulator_portal
        distinguishing_aspect: "Omitting is_regulator_portal on channel creation defaults to false, and complaints on that channel do NOT auto-create a referral."
        test_recipe:
          setup: ["Channel created without is_regulator_portal"]
          setup_api_calls:
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-CH", display_name: "Ch Product" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.CH" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-CH", channel_code: "WEB", product_code: "P-CH", category_code: "C.CH", narrative: "no portal" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
          trigger:
            - call: "GET /complaint-office/complaints/${cid}/referrals"
              payload: {}
              as: Auditor
          assert:
            - "referral list for complaint ${cid} is empty (length 0)"

      - name: complaint_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.Complaint.fields.narrative
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required narrative on intake returns ERR_INVALID_REQUEST (400), before any business rule runs."
        test_recipe:
          setup: ["Product, channel, category exist"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-REQ", display_name: "Req Product" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.REQ" }
              as: ComplaintManager
          trigger:
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-REQ", channel_code: "WEB", product_code: "P-REQ", category_code: "C.REQ" }
              as: IntakeSpecialist
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "http status == 400"

      - name: complaint_get_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but nonexistent complaint UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /complaint-office/complaints/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Auditor
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "http status == 404"

      - name: complaint_claimed_loss_defaults_zero_and_negative_rejected
        claim_type: defaults
        grounds:
          - entities.Complaint.fields.claimed_loss_cents
          - validations[priority=4]
        distinguishing_aspect: "Omitting claimed_loss_cents stores 0; supplying -1 is rejected with ERR_INVALID_REQUEST — boundary at zero."
        test_recipe:
          setup: ["Product/channel/category exist"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-LOSS", display_name: "Loss Product" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.LOSS" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-L1", channel_code: "WEB", product_code: "P-LOSS", category_code: "C.LOSS", narrative: "no loss stated" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-L2", channel_code: "WEB", product_code: "P-LOSS", category_code: "C.LOSS", narrative: "neg", claimed_loss_cents: -1 }
              as: IntakeSpecialist
              captures: { err_id: $.data.error_id }
          assert:
            - "Complaint.${cid}.claimed_loss_cents == 0"
            - "negative-claim response error_id == ERR_INVALID_REQUEST"

      - name: intake_event_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.IntakeEvent
        distinguishing_aspect: "IntakeEvent is append-only (common_fields: false): no PUT/PATCH/DELETE endpoint exists for it; it is reachable only via GET /complaints/{id}/events."
        test_recipe:
          setup: ["A complaint exists with at least its CREATED event"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-EV", display_name: "Ev Product" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.EV" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-EV", channel_code: "WEB", product_code: "P-EV", category_code: "C.EV", narrative: "audit me" }
              as: IntakeSpecialist
              as_user_id: "user_ev_1"
              captures: { cid: $.data.id }
          trigger:
            - call: "GET /complaint-office/complaints/${cid}/events"
              payload: {}
              as: Auditor
          assert:
            - "events list for ${cid} contains exactly 1 event with event_type == CREATED"
            - "the CREATED event's actor_user_id == user_ev_1 and actor_role == IntakeSpecialist"

      - name: taxonomy_self_referential_parent_link
        claim_type: parent_relationships
        grounds:
          - entities.TaxonomyCategory.fields.parent_category_code
        distinguishing_aspect: "A child category created with parent_category_code resolves through the self-FK; filtered list by parent_category_code returns exactly the children."
        test_recipe:
          setup: ["Root category FEES; child FEES.OVERDRAFT"]
          setup_api_calls:
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "FEES" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "FEES.OVERDRAFT", parent_category_code: "FEES" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "FEES.ATM", parent_category_code: "FEES" }
              as: ComplaintManager
          trigger:
            - call: "GET /complaint-office/taxonomy-categories"
              payload: { parent_category_code: "FEES" }
              as: Auditor
          assert:
            - "filtered list contains exactly FEES.OVERDRAFT and FEES.ATM (2 entries)"
            - "root FEES has parent_category_code == null"

  # ===========================================================================
  # Section 2: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: complaint_initial_state_intake
        claim_type: initial_state
        grounds:
          - state_machines.Complaint
        distinguishing_aspect: "A newly created complaint starts in INTAKE with version 1 and resolved_at null."
        test_recipe:
          setup: ["Product/channel/category exist"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-SM1", display_name: "SM1" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.SM1" }
              as: ComplaintManager
          trigger:
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-SM1", channel_code: "WEB", product_code: "P-SM1", category_code: "C.SM1", narrative: "init" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
          assert:
            - "Complaint.${cid}.status == INTAKE"
            - "Complaint.${cid}.version == 1"
            - "Complaint.${cid}.resolved_at == null"

      - name: complaint_invalid_transition_intake_to_resolved
        claim_type: invalid_transition
        grounds:
          - state_machines.Complaint
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "POST resolve on an INTAKE complaint is rejected with ERR_INVALID_STATE_TRANSITION; no version bump, no side effects."
        test_recipe:
          setup: ["Complaint in INTAKE"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-SM2", display_name: "SM2" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.SM2" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-SM2", channel_code: "WEB", product_code: "P-SM2", category_code: "C.SM2", narrative: "skip everything" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /complaint-office/complaints/${cid}/resolve"
              payload: {}
              as: CaseHandler
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION"
            - "Complaint.${cid}.status == INTAKE"
            - "Complaint.${cid}.version == 1"

      - name: complaint_terminal_lockdown_withdrawn_rejects_all_actions
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Complaint
        distinguishing_aspect: "From WITHDRAWN (terminal), triage/start_investigation/draft_response/reopen/withdraw all fail with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Complaint withdrawn from INTAKE"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-SM3", display_name: "SM3" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.SM3" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-SM3", channel_code: "WEB", product_code: "P-SM3", category_code: "C.SM3", narrative: "to withdraw" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /complaint-office/complaints/${cid}/withdraw"
              payload: {}
              as: CaseHandler
          trigger:
            - call: "POST /complaint-office/complaints/${cid}/triage"
              payload: {}
              as: CaseHandler
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION"
            - "Complaint.${cid}.status == WITHDRAWN"

      - name: complaint_resolve_is_not_idempotent
        claim_type: idempotency
        grounds:
          - state_machines.Complaint.RESPONSE_QA_to_RESOLVED
        distinguishing_aspect: "Resolving an already-RESOLVED complaint fails with ERR_INVALID_STATE_TRANSITION — the same trigger twice is an error on the second attempt."
        test_recipe:
          setup: ["Complaint fully resolved"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-SM4", display_name: "SM4" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.SM4" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-SM4", channel_code: "WEB", product_code: "P-SM4", category_code: "C.SM4", narrative: "resolve twice" }
              as: IntakeSpecialist
              as_user_id: "user_intake_sm4"
              captures: { cid: $.data.id }
            - call: "POST /complaint-office/complaints/${cid}/triage"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${cid}/start_investigation"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${cid}/rcas"
              payload: { verdict: "NOT_SUBSTANTIATED", linked_product_code: "P-SM4", process_step: "STEP" }
              as: CaseHandler
              captures: { rid: $.data.id }
            - call: "POST /complaint-office/rcas/${rid}/complete"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${cid}/draft_response"
              payload: { response_text: "resp" }
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${cid}/submit_for_qa"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${cid}/quality-reviews"
              payload: { window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2026-08-05T00:00:00Z" }
              as: QAReviewer
              as_user_id: "user_qa_sm4"
              captures: { qid: $.data.id }
            - call: "POST /complaint-office/quality-reviews/${qid}/complete"
              payload: { outcome: "PASS" }
              as: QAReviewer
              as_user_id: "user_qa_sm4"
            - call: "POST /complaint-office/complaints/${cid}/resolve"
              payload: {}
              as: CaseHandler
          trigger:
            - call: "POST /complaint-office/complaints/${cid}/resolve"
              payload: {}
              as: CaseHandler
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION"
            - "Complaint.${cid}.status == RESOLVED"

      - name: referral_close_from_open_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.RegulatoryReferral
        distinguishing_aspect: "POST close on an OPEN referral (never submitted) fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Portal complaint with OPEN referral"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-SM5", display_name: "SM5" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "CFPB_PORTAL", display_name: "Portal", is_regulator_portal: true }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.SM5" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-SM5", channel_code: "CFPB_PORTAL", product_code: "P-SM5", category_code: "C.SM5", narrative: "close early", portal_ref: "R-SM5" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "GET /complaint-office/complaints/${cid}/referrals"
              payload: {}
              as: CaseHandler
              captures: { rid: $.data.0.id }
          trigger:
            - call: "POST /complaint-office/referrals/${rid}/close"
              payload: {}
              as: ComplaintManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION"
            - "RegulatoryReferral.${rid}.status == OPEN"

      - name: remediation_reject_is_terminal_and_pay_after_reject_fails
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.RemediationDecision
        distinguishing_aspect: "REJECTED is terminal: mark_paid on a REJECTED decision fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["Decision pushed to PENDING_APPROVAL then REJECTED by a distinct approver"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-SM6", display_name: "SM6" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.SM6" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-SM6", channel_code: "WEB", product_code: "P-SM6", category_code: "C.SM6", narrative: "reject me" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /complaint-office/complaints/${cid}/triage"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints/${cid}/start_investigation"
              payload: {}
              as: CaseHandler
            - call: "GET /complaint-office/complaints/${cid}"
              payload: {}
              as: CaseHandler
              captures: { cv: $.data.version }
            - call: "POST /complaint-office/complaints/${cid}/remediation_decisions"
              payload: { decision_type: "RESTITUTION", line_items: [ { label: "fee", amount_cents: 5000 } ], expected_complaint_version: "${cv}" }
              as: CaseHandler
              as_user_id: "user_handler_sm6"
              captures: { did: $.data.id }
            - call: "POST /complaint-office/remediation-decisions/${did}/submit"
              payload: {}
              as: CaseHandler
              as_user_id: "user_handler_sm6"
            - call: "POST /complaint-office/remediation-decisions/${did}/reject"
              payload: {}
              as: RemediationApprover
              as_user_id: "user_approver_sm6"
          trigger:
            - call: "POST /complaint-office/remediation-decisions/${did}/mark_paid"
              payload: {}
              as: CaseHandler
              as_user_id: "user_handler_sm6"
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION"
            - "RemediationDecision.${did}.status == REJECTED"

      - name: escalation_full_happy_path_and_dismiss_from_acknowledged_fails
        claim_type: valid_transition
        grounds:
          - state_machines.EscalationCase
        distinguishing_aspect: "RAISED -> ACKNOWLEDGED -> RESOLVED succeeds; DISMISS from ACKNOWLEDGED is not a declared transition and fails."
        test_recipe:
          setup: ["Complaint exists; escalation raised and acknowledged"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-SM7", display_name: "SM7" }
              as: ComplaintManager
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.SM7" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-SM7", channel_code: "WEB", product_code: "P-SM7", category_code: "C.SM7", narrative: "escalate me" }
              as: IntakeSpecialist
              captures: { cid: $.data.id }
            - call: "POST /complaint-office/complaints/${cid}/escalations"
              payload: { escalation_tier: "LEGAL", reason: "Litigation hold risk" }
              as: CaseHandler
              captures: { eid: $.data.id }
            - call: "POST /complaint-office/escalations/${eid}/acknowledge"
              payload: {}
              as: ExecutiveReviewer
          trigger:
            - call: "POST /complaint-office/escalations/${eid}/dismiss"
              payload: {}
              as: ExecutiveReviewer
              captures: { err_id: $.data.error_id }
            - call: "POST /complaint-office/escalations/${eid}/resolve"
              payload: {}
              as: ExecutiveReviewer
          assert:
            - "dismiss-from-ACKNOWLEDGED error_id == ERR_INVALID_STATE_TRANSITION"
            - "EscalationCase.${eid}.status == RESOLVED after the resolve call"

      - name: template_retire_from_draft_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ResponseTemplate
        distinguishing_aspect: "Retire is declared only from ACTIVE; retiring a DRAFT template fails with ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["DRAFT template exists"]
          setup_api_calls:
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.TPL" }
              as: ComplaintManager
            - call: "POST /complaint-office/response-templates"
              payload: { template_key: "TPL-DRAFT", channel_code: "WEB", category_code: "C.TPL", body: "draft body" }
              as: ComplaintManager
              captures: { tid: $.data.id }
          trigger:
            - call: "POST /complaint-office/response-templates/${tid}/retire"
              payload: {}
              as: ComplaintManager
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE_TRANSITION"
            - "ResponseTemplate.${tid}.status == DRAFT"

      - name: product_manual_unfreeze_moves_frozen_to_watch
        claim_type: valid_transition
        grounds:
          - state_machines.Product.FROZEN_to_WATCH
          - endpoints[POST /complaint-office/products/{productId}/unfreeze]
        distinguishing_aspect: "Manual unfreeze on a FROZEN product moves it to WATCH and bumps version; subsequent complaint intake is allowed again (WATCH does not gate)."
        test_recipe:
          setup: ["Product driven to FROZEN via 5 SUBSTANTIATED RCAs; one more complaint attempt fails"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-SM8", display_name: "SM8" }
              as: ComplaintManager
              captures: { pid: $.data.id }
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.SM8" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-SM8-1", channel_code: "WEB", product_code: "P-SM8", category_code: "C.SM8", narrative: "s1" }
              as: IntakeSpecialist
              captures: { s1: $.data.id }
            - call: "POST /complaint-office/complaints/${s1}/rcas"
              payload: { verdict: "SUBSTANTIATED", linked_product_code: "P-SM8", process_step: "ST" }
              as: CaseHandler
              captures: { r1: $.data.id }
            - call: "POST /complaint-office/rcas/${r1}/complete"
              payload: {}
              as: CaseHandler
            - call: "POST /complaint-office/complaints"
              payload: { complainant_ref: "CU-SM8-2", channel_code: "WEB", product_code: "P-SM8", category_code: "C.SM8", narrative: "s2" }
              as: IntakeSpecialist
              captures: { s2: $.data.id }
            - call: "POST /complaint-office/complaints/${s2}/rcas"
