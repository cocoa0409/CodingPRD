  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refrigerant_recover_then_charge_conserves_equipment_mass
        grounds:
          - calculations.RefrigerantMassBalance
          - entities.Equipment.fields.current_charge_grams
          - state_machines.ServiceVisit.ON_SITE_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity = Equipment.current_charge_grams (refrigerant mass in
          grams). A RECOVER of 600 paired with its compensating ADD of 600 on the same
          unit leaves current_charge_grams exactly at nameplate 4000 — net zero drift,
          pinned as Equipment.current_charge_grams == nameplate + sum(ADD) - sum(RECOVER).
        test_recipe:
          setup:
            - "Clock 2026-07-01T00:00:00Z; equipment nameplate 4000 R410A current_charge_grams 4000; ACTIVE membership; SEASONAL visit ON_SITE with assigned EPA tech"
