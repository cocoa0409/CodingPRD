              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at1_id}", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 2, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
              captures: { s1_id: $.data.id }
            - call: "POST /stores/${st_id}/attraction-sessions"
              payload: { attraction_id: "${at2_id}", member_id: "${m_id}", session_kind: "GENERAL_ADMISSION", party_size: 2, slot_start_utc: "2026-11-02T10:00:00Z", slot_end_utc: "2026-11-02T11:00:00Z" }
              as: AttractionHost
              captures: { s2_id: $.data.id }
          trigger:
