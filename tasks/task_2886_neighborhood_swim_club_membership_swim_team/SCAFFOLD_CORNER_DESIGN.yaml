              captures: { h_sib_id: $.data.id }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Standard House", address_line: "13 Cedar Court", residency: "OUT_OF_DISTRICT", member_count: 4, prior_member: false }
