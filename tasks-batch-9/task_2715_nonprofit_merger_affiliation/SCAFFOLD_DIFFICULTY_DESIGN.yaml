  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_window_adjacency_allowed_but_one_day_straddle_rejected
        grounds:
          - validations.priority_42_ERR_CREW_WINDOW_CONFLICT
          - entities.IntegrationTask.fields.planned_start_date
          - entities.IntegrationTask.fields.planned_end_date
          - endpoints.POST_/integration-tasks
        distinguishing_aspect: |
          The crew window is half-open, [planned_start_date, planned_end_date), so a
          task ending 2026-09-08 and a task starting 2026-09-08 share no instant and
          must both be accepted, while a window of 2026-09-07 to 2026-09-09 straddles
          the seam and must be refused. The same straddling window is then accepted
          under a different crew_code, proving the capacity is scoped per crew rather
          than per deal. A closed-interval implementation rejects the legitimate
          adjacency; a naive "same crew, same deal" check rejects the different crew.
