      - name: filing_actions_taken_out_of_order_are_refused
        claim_type: invalid_transitions
        grounds:
          - state_machines[Filing]
          - validations.priority_6
          - validations.priority_8
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_AGENT_NOT_ENGAGED]
        distinguishing_aspect: >-
          The refusal an out-of-order filing action earns depends on WHICH rung catches it.
          Confirming or resubmitting a DRAFT filing is caught at priority 6 with
          ERR_AGENT_NOT_ENGAGED, because submitting_engagement_id is still null and therefore
          cannot equal any X-User-ID; only once the filing has been submitted does priority 8's
          ERR_INVALID_STATE_TRANSITION become the visible answer. An implementation that checks
          the status first returns 409 where 403 is required.
        test_recipe:
          setup:
