- section: cross_cutting_complexity_layers
  instances:
  - name: per_tap_snapshot_pinned_at_activation
    claim_type: version_pinning_on_approval
    grounds:
    - entities.Lease.fields.taps_snapshot
    - calculations.lease_royalty_accrual
    - state_machines.Lease.PENDING_AUDIT_to_ACTIVE
    distinguishing_aspect: 'Approval-time pinning: activation freezes taps_snapshot at 250 (taps_set then); adding an 80-tap line afterwards raises taps_set to 330 but accrued_royalty_cents stays 75000
      (250 x 300).'
    test_recipe:
      setup:
      - season OPEN; bush TAPPING with two ACTIVE lines 100+150; PER_TAP lease 300 cents ACTIVE
      setup_api_calls:
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-02-15T00:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/seasons
        payload:
          year: 2027
          opens_on: '2027-02-01'
          closes_on: '2027-04-15'
          planned_taps: 10000
        as: SugarhouseManager
        captures:
          season_id: $.data.id
      - call: POST /sugarhouse/seasons/${season_id}/open
        as: SugarhouseManager
        captures:
          season_v: $.data.version
      - call: POST /sugarhouse/sugarbushes
        payload:
          season_id: ${season_id}
          name: Leased Hill
          tap_capacity: 5000
        as: SugarhouseManager
        captures:
          bush_id: $.data.id
      - call: POST /sugarhouse/sugarbushes/${bush_id}/begin-tapping
        as: SugarhouseManager
      - call: POST /sugarhouse/tap-lines
        payload:
          sugarbush_id: ${bush_id}
          line_code: L1
          tap_count: 100
          vacuum_target_inhg: 25.0
        as: SugarhouseManager
        captures:
          line1_id: $.data.id
      - call: POST /sugarhouse/tap-lines/${line1_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/tap-lines
        payload:
          sugarbush_id: ${bush_id}
          line_code: L2
          tap_count: 150
          vacuum_target_inhg: 25.0
        as: SugarhouseManager
        captures:
          line2_id: $.data.id
      - call: POST /sugarhouse/tap-lines/${line2_id}/activate
        as: SugarhouseManager
      - call: POST /sugarhouse/leases
        payload:
          sugarbush_id: ${bush_id}
          landowner_name: Lou
          royalty_basis: PER_TAP
          per_tap_cents: 300
          certified_organic_required: false
          term_start: '2027-01-01'
          term_end: '2027-12-31'
        as: SugarhouseManager
        captures:
          lease_id: $.data.id
      - call: POST /sugarhouse/leases/${lease_id}/submit-audit
        as: SugarhouseManager
      - call: POST /sugarhouse/leases/${lease_id}/activate
        as: SugarhouseManager
      trigger:
      - call: POST /sugarhouse/tap-lines
        payload:
          sugarbush_id: ${bush_id}
          line_code: L3
          tap_count: 80
          vacuum_target_inhg: 25.0
        as: SugarhouseManager
        captures:
          line3_id: $.data.id
      - call: POST /sugarhouse/tap-lines/${line3_id}/activate
        as: SugarhouseManager
      - call: GET /sugarhouse/sugarbushes/${bush_id}
        as: SugarhouseManager
        captures:
          taps_set: $.data.taps_set
      - call: GET /sugarhouse/leases/${lease_id}
        as: SugarhouseManager
        captures:
          snap: $.data.taps_snapshot
          roy: $.data.accrued_royalty_cents
      assert:
      - 'at activation: taps_snapshot == 250 and accrued_royalty_cents == 75000'
      - 'after adding L3: Sugarbush.taps_set == 330 but Lease.taps_snapshot == 250 and accrued_royalty_cents == 75000 (pinned)'
  - name: immediate_visibility_after_finish
    claim_type: immediate_consistency
    grounds:
    - complexity_profile.consistency_model
    - endpoints[POST /sugarhouse/batches/{id}/finish]
    distinguishing_aspect: 'Immediate consistency: the finish response and a follow-up GET both show status FINISHED and the created SyrupLot is listable in the same logical instant.'
    test_recipe:
      setup:
      - batch BOILING (10-gal run, same-day boil)
      setup_api_calls:
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-02-15T00:00:00Z'
