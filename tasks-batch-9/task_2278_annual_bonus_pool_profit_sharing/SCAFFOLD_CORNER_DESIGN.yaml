          difficulty_instance: boundary_precision_check / funding_curve_floor_at_blended_eighty_versus_seventy_nine_point_nine_nine
          rationale: "The threshold-1 / threshold / threshold+1 sweep of CURVE_FLOOR_PCT, including the 0.0000 multiplier and the resulting 409, is that §1.8 instance."

      - name: tiered_burden_rate_at_the_tier_boundary
        claim_type: Constants Applied
