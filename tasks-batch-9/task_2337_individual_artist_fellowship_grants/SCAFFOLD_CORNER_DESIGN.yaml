            - { call: "GET /grants/recommendation-slots/${slot}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/artists/${art}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/awards/${aw}/accept", payload: { accept_agreement_version: "FELLOWSHIP-AGREEMENT-2027.1", tax_certification_signed: true }, as: Artist, as_user_id: "${art}" }
          assert:
            - "The clock response lists the award id in forfeited_award_ids and reports current_utc == \"2026-11-01T00:00:00.000Z\""
            - "The award reads status \"FORFEITED\" with acceptance_deadline_at == \"2026-10-30T00:00:00.000Z\""
            - "The application reads \"NOT_AWARDED\" with notified_at re-stamped to \"2026-11-01T00:00:00.000Z\""
            - "The slot reads \"VOIDED\" with awarded_amount_cents == 0"
            - "The cycle reads funded_total_cents == 0, admin_assessment_cents == 0, committed_cents == 0, available_cents == 5700000, posture \"OPEN\""
            - "The artist reads active_award_count == 0 and prior_award_count == 0"
            - "The late accept returns 409 ERR_ACCEPTANCE_DEADLINE_PASSED"

      - name: debarment_holds_only_the_still_scheduled_installments
        claim_type: conditional_cascade
        grounds:
          - state_machines.PaymentInstallment.SCHEDULED_to_HELD
          - endpoints[POST /grants/artists/{artist_id}/debar]
          - entities.PaymentInstallment.fields.hold_reason_code
        distinguishing_aspect: |
          With installment 1 already PAID, debarment must hold ONLY installments
          2 and 3 (hold_reason_code ARTIST_DEBARRED) and leave the PAID row
          exactly as it is; the award's disbursed_gross_cents must stay 600_000.
          An implementation that holds every installment, or that rewrites the
          paid row's status, fails.
        test_recipe:
          setup:
            - "CornerMain award accepted, cycle AWARDED, clock at 2027-01-01"
            - "Installment 1 (600_000) released and paid; installments 2 and 3 still SCHEDULED"
            - "tin_status is ON_FILE, so every withholding_cents is 0 and net == gross"
          setup_api_calls:
            - *n_clock
            - *n_cycle
            - *n_disc
            - *n_open
            - *n_art
            - *n_app
            - *n_ws1
            - *n_ws2
            - *n_sub
            - *n_clock16
            - *n_close
            - *n_elig
            - *n_pr
            - *n_panel
            - *n_pl1
            - *n_pl2
            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
            - *n_round
            - *n_rev1
            - *n_srev1
            - *n_rev2
            - *n_srev2
            - *n_rev3
            - *n_srev3
            - *n_closeround
            - *n_board
            - *n_getpan
            - *n_slate
            - *n_getslot
            - *n_getcyc
            - *n_approve
            - *n_getaw
            - &n_accept { call: "POST /grants/awards/${aw}/accept", payload: { accept_agreement_version: "FELLOWSHIP-AGREEMENT-2027.1", tax_certification_signed: true }, as: Artist, as_user_id: "${art}" }
            - &n_awarded { call: "POST /grants/cycles/${cyc}/status", payload: { to_status: AWARDED }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &n_getinst { call: "GET /grants/payment-installments", payload: { award_id: "${aw}" }, as: FiscalOfficer, as_user_id: "fiscal-1", captures: { i1: "$.data[0].id", i2: "$.data[1].id", i3: "$.data[2].id" } }
            - &n_clockjan { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - &n_rel1 { call: "POST /grants/payment-installments/${i1}/release", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
