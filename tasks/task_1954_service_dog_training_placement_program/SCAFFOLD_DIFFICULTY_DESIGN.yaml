scaffold_difficulty_design:
  # ---------------------------------------------------------------------
  # Rule 1: dual_variant_calc — different entity domains
  # ---------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: fundraising_provisional_vs_final_requirement
        grounds:
          - calculations.fundraising_requirement
          - entities.WaitlistEntry.fields.requirement_provisional_cents
          - entities.WaitlistEntry.fields.requirement_final_cents
        distinguishing_aspect: "Dual-variant divergence on the fiscal (Applicant/WaitlistEntry) domain: identical track+income inputs produce requirement_provisional_cents 750000 (subsidy tier keyed on gross 1500000 -> 10%) versus requirement_final_cents 765000 (tier keyed on post-credit net 900000 -> 15%), a delta of exactly 15000 cents."
        test_recipe:
          setup:
            - "Applicant on MOBILITY track with household_income_cents 4500000 (40% credit bracket), approved to waitlist; no contributions"
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "Ann Mobility", email: "ann.m@x.com", placement_track: MOBILITY, household_income_cents: 4500000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [RETRIEVE_ITEMS, OPEN_DOORS], task_urgency_tier: HIGH, home_environment_score: 7 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/approve", as: IntakeCoordinator }
            - { call: "GET /api/applicants/${a_id}/waitlist-entries", as: IntakeCoordinator, captures: { entry_id: "$.data[0].id" } }
          trigger:
            - call: "POST /api/waitlist-entries/${entry_id}/recalculate"
              payload: { verified_income_cents: 4500000 }
              as: IntakeCoordinator
          assert:
            - "WaitlistEntry.${entry_id}.requirement_provisional_cents == 750000"
            - "WaitlistEntry.${entry_id}.requirement_final_cents == 765000"
            - "WaitlistEntry.${entry_id}.effective_requirement_cents == 765000"
            - "WaitlistEntry.${entry_id}.status == PENDING (raised_cents 0 < 765000)"
            - "Applicant.${a_id}.verified_income_cents == 4500000"

      - name: training_advancement_rolling_vs_cumulative_divergence
        grounds:
          - calculations.training_advancement
          - entities.TrainingMilestone.fields.rolling_avg_3
          - entities.TrainingMilestone.fields.cumulative_gate_score
        distinguishing_aspect: "Dual-variant divergence on the Dog/TrainingMilestone (training) domain — a different entity domain than fundraising: the same six-milestone history yields rolling_avg_3 69.3 (< 70 gate, no advancement) while cumulative_gate_score computes 80.8 (>= 80 gate), so the two valid algorithms disagree on readiness for identical data."
        test_recipe:
          setup:
            - "DONATED dog health-cleared (score 84), foster-placed, placement completed with certified primary trainer; five milestones recorded: 95 TASK_WORK, 90 TASK_WORK, 88 PUBLIC_MANNERS, 85 OBEDIENCE, 82 SOCIALIZATION"
          setup_api_calls:
            - { call: "POST /api/dogs", payload: { name: "Diverge", origin: DONATED, breed: "Labrador", sex: FEMALE, born_on: "2024-05-01", region: NW, donor_name: "Donor One" }, as: ProgramAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /api/dogs/${d_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${d_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { sc_id: $.data.id } }
            - { call: "POST /api/screenings/${sc_id}/submit", as: Veterinarian }
            - { call: "POST /api/puppy-raisers", payload: { full_name: "Raiser One", region: NW, foster_capacity: 1, experience_score: 50 }, as: ProgramAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/puppy-raisers/${r_id}/vet", as: ProgramAdmin }
            - { call: "POST /api/puppy-raisers/${r_id}/approve", as: ProgramAdmin }
            - { call: "POST /api/dogs/${d_id}/raiser-placements", payload: { puppy_raiser_id: "${r_id}" }, as: TrainingDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /api/trainers", payload: { full_name: "Trainer Primary", pat_certified: false }, as: ProgramAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/trainers/${t_id}/certify", as: ProgramAdmin }
            - { call: "POST /api/raiser-placements/${pl_id}/complete", payload: { primary_trainer_id: "${t_id}" }, as: TrainingDirector }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: RETRIEVE_ITEMS, score: 95 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: OPEN_DOORS, score: 90 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: PUBLIC_MANNERS, score: 88 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: OBEDIENCE, score: 85 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: SOCIALIZATION, score: 82 }, as: Trainer, as_user_id: "${t_id}" }
          trigger:
            - call: "POST /api/dogs/${d_id}/milestones"
              payload: { category: TASK_WORK, task_code: RETRIEVE_ITEMS, score: 41 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { m6_roll: $.data.rolling_avg_3, m6_cum: $.data.cumulative_gate_score }
          assert:
            - "TrainingMilestone #6.rolling_avg_3 == 69.3  # (85+82+41)/3 = 69.333 -> 69.3"
            - "TrainingMilestone #6.cumulative_gate_score == 80.8  # 0.5*(226/3)+0.3*88+0.2*83.5 = 80.7667 -> 80.8"
            - "Dog.${d_id}.status == IN_ADVANCED_TRAINING  # rolling 69.3 < 70 blocks advancement despite cumulative 80.8 >= 80"
            - "Dog.${d_id}.certified_tasks contains RETRIEVE_ITEMS and OPEN_DOORS (scores >= 80)"

  # ---------------------------------------------------------------------
  # Rule 2: combinatorial_formula — modes (a), (b), (c)
  # ---------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: waitlist_rank_score_weighted_caps_and_branches
        grounds:
          - calculations.waitlist_rank_score
          - entities.WaitlistEntry.fields.rank_score
        distinguishing_aspect: "Mode (a) — >=3 inputs with non-linear interaction (nested min caps, conditional bonus branch, penalty term): 100 wait-days x 0.5 is capped at 40, home 10 x 2 is capped at 20, urgency CRITICAL adds 40, PENDING status adds no 15 bonus, zero dissolves add no penalty: rank_score == 100.0 exactly."
        test_recipe:
          setup:
            - "Applicant approved at the default clock 2026-08-01T00:00:00Z with CRITICAL urgency and home_environment_score 10; entry PENDING with no contributions and no dissolved matches"
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "Rita Rank", email: "rita.r@x.com", placement_track: PTSD, household_income_cents: 12000000, region: SW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [INTERRUPT_ANXIETY], task_urgency_tier: CRITICAL, home_environment_score: 10 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/approve", as: IntakeCoordinator }
            - { call: "GET /api/applicants/${a_id}/waitlist-entries", as: IntakeCoordinator, captures: { entry_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-11-09T00:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /api/waitlist-entries/${entry_id}", as: IntakeCoordinator, captures: { rank: $.data.rank_score } }
          assert:
            - "wait_days == 100 (2026-08-01 -> 2026-11-09), so wait points = min(40, 50) = 40"
            - "WaitlistEntry.${entry_id}.rank_score == 100.0  # 40 (capped) + 40 (CRITICAL) + 20 (capped home) + 0 - 0"
            - "WaitlistEntry.${entry_id}.status == PENDING  # fundraising bonus +15 NOT applied"

      - name: pat_score_per_section_then_average_rounding
        grounds:
          - calculations.pat_scoring
          - entities.PublicAccessTest.fields.official_score
          - entities.PublicAccessTest.fields.section_percents
        distinguishing_aspect: "Mode (b) — nested rounding where order matters: per-section round-then-average (pinned) yields official_score 81.5 from section sums 14/18, 10/12, 5/6, whereas the forbidden sum-then-round order yields 80.6; the test pins 77.8/83.3/83.3 -> 81.5 and SCORED_PASS."
        test_recipe:
          setup:
            - "One matched pair enrolled in an IN_SESSION class (total_sessions 20); evaluator is pat_certified, CERTIFIED, and not the dog's primary trainer; PAT attempt 1 scheduled at 2026-10-10T10:00:00Z"
          setup_api_calls:
            - { call: "POST /api/trainers", payload: { full_name: "Eval Eve", pat_certified: true }, as: ProgramAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /api/trainers/${e_id}/certify", as: ProgramAdmin }
            - { call: "POST /api/trainers", payload: { full_name: "Trainer Prim", pat_certified: false }, as: ProgramAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/trainers/${t_id}/certify", as: ProgramAdmin }
            - { call: "POST /api/dogs", payload: { name: "Patty", origin: DONATED, breed: "Golden Retriever", sex: MALE, born_on: "2024-03-01", region: NW, donor_name: "Donor Two" }, as: ProgramAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /api/dogs/${d_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${d_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { sc_id: $.data.id } }
            - { call: "POST /api/screenings/${sc_id}/submit", as: Veterinarian }
            - { call: "POST /api/puppy-raisers", payload: { full_name: "Raiser Two", region: NW, foster_capacity: 1, experience_score: 60 }, as: ProgramAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/puppy-raisers/${r_id}/vet", as: ProgramAdmin }
            - { call: "POST /api/puppy-raisers/${r_id}/approve", as: ProgramAdmin }
            - { call: "POST /api/dogs/${d_id}/raiser-placements", payload: { puppy_raiser_id: "${r_id}" }, as: TrainingDirector, captures: { pl_id: $.data.id } }
            - { call: "POST /api/raiser-placements/${pl_id}/complete", payload: { primary_trainer_id: "${t_id}" }, as: TrainingDirector }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: RETRIEVE_ITEMS, score: 95 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: OPEN_DOORS, score: 90 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: PUBLIC_MANNERS, score: 88 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: OBEDIENCE, score: 85 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: SOCIALIZATION, score: 82 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: RETRIEVE_ITEMS, score: 84 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "GET /api/dogs/${d_id}", as: TrainingDirector, captures: { d_status: $.data.status } }
            - { call: "POST /api/applicants", payload: { full_name: "Pat Applicant", email: "pat.a@x.com", placement_track: FACILITY, household_income_cents: 12000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [RETRIEVE_ITEMS], task_urgency_tier: STANDARD, home_environment_score: 6 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/approve", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/contributions", payload: { donor_name: "Donor X", amount_cents: 765000 }, as: IntakeCoordinator, as_user_id: "coord-a", captures: { c_id: $.data.id } }
            - { call: "POST /api/contributions/${c_id}/receive", as: IntakeCoordinator, as_user_id: "coord-b" }
            - { call: "GET /api/applicants/${a_id}/waitlist-entries", as: IntakeCoordinator, captures: { entry_id: "$.data[0].id" } }
            - { call: "GET /api/dogs/${d_id}", as: TrainingDirector, captures: { d_v: $.data.version } }
            - { call: "POST /api/dogs/${d_id}/match-proposals", payload: { waitlist_entry_id: "${entry_id}", expected_dog_version: "${d_v}" }, as: IntakeCoordinator, captures: { m_id: $.data.id } }
            - { call: "POST /api/matches/${m_id}/accept", as: IntakeCoordinator }
            - { call: "POST /api/classes", payload: { name: "Fall Class", lead_trainer_id: "${t_id}", starts_on: "2026-09-01", ends_on: "2026-10-15", capacity: 2, total_sessions: 20 }, as: TrainingDirector, captures: { cl_id: $.data.id } }
            - { call: "POST /api/classes/${cl_id}/open-enrollment", as: TrainingDirector }
            - { call: "GET /api/classes/${cl_id}", as: TrainingDirector, captures: { cl_v: $.data.version } }
            - { call: "POST /api/classes/${cl_id}/enrollments", payload: { match_id: "${m_id}", expected_class_version: "${cl_v}" }, as: TrainingDirector, captures: { enr_id: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /api/classes/${cl_id}/start", as: TrainingDirector }
            - { call: "POST /api/enrollments/${enr_id}/public-access-tests", payload: { scheduled_at: "2026-10-10T10:00:00Z", location: "Mall" }, as: Evaluator, as_user_id: "${e_id}", captures: { pat_id: $.data.id } }
          trigger:
            - call: "POST /api/public-access-tests/${pat_id}/score"
              payload: { exercise_scores: [ { exercise_code: C1, raw_score: 3 }, { exercise_code: C2, raw_score: 3 }, { exercise_code: C3, raw_score: 2 }, { exercise_code: C4, raw_score: 2 }, { exercise_code: C5, raw_score: 2 }, { exercise_code: C6, raw_score: 2 }, { exercise_code: P1, raw_score: 3 }, { exercise_code: P2, raw_score: 3 }, { exercise_code: P3, raw_score: 2 }, { exercise_code: P4, raw_score: 2 }, { exercise_code: S1, raw_score: 3 }, { exercise_code: S2, raw_score: 2 } ] }
              as: Evaluator
              as_user_id: "${e_id}"
          assert:
            - "PublicAccessTest.${pat_id}.section_percents == { control: 77.8, public_manners: 83.3, safety: 83.3 }"
            - "PublicAccessTest.${pat_id}.official_score == 81.5  # (77.8+83.3+83.3)/3 = 81.4667 -> 81.5; NOT the 80.6 of sum-then-round"
            - "PublicAccessTest.${pat_id}.status == SCORED_PASS"
            - "PublicAccessTest.${pat_id}.attempt_number == 1"
            - "Enrollment.${enr_id}.status == ENROLLED  # pass does not itself graduate"

      - name: fundraising_final_variant_pinned_evaluation_order
        grounds:
          - calculations.fundraising_requirement
        distinguishing_aspect: "Mode (c) — circular-looking dependency with pinned evaluation order: subsidy tier depends on the post-credit net, which itself depends on the subsidy; pinning gross -> credit -> provisional_net -> tier -> subsidy -> net yields final 612000 for PTSD @ income 2000000 (60% credit), while the provisional variant's gross-keyed tier yields 540000 for the same applicant."
        test_recipe:
          setup:
            - "Applicant on PTSD track with household_income_cents 2000000 (60% credit bracket), approved to waitlist"
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "Pete Order", email: "pete.o@x.com", placement_track: PTSD, household_income_cents: 2000000, region: SW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [INTERRUPT_ANXIETY, DEEP_PRESSURE], task_urgency_tier: HIGH, home_environment_score: 5 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/approve", as: IntakeCoordinator }
            - { call: "GET /api/applicants/${a_id}/waitlist-entries", as: IntakeCoordinator, captures: { entry_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/waitlist-entries/${entry_id}/recalculate", payload: { verified_income_cents: 2000000 }, as: IntakeCoordinator }
          assert:
            - "WaitlistEntry.${entry_id}.requirement_provisional_cents == 540000  # 1800000 - 1080000 - round(1800000*0.10)"
            - "WaitlistEntry.${entry_id}.requirement_final_cents == 612000  # provisional_net 720000 < 1000000 -> 15%: 720000 - 108000"
            - "WaitlistEntry.${entry_id}.effective_requirement_cents == 612000"

  # ---------------------------------------------------------------------
  # Rule 3: non_linear_state_machine — different entities
  # ---------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: applicant_info_request_cycle
        grounds:
          - state_machines.Applicant.IN_REVIEW_to_NEEDS_INFO
          - state_machines.Applicant.NEEDS_INFO_to_IN_REVIEW
          - state_machines.Applicant.IN_REVIEW_to_WAITLISTED
        distinguishing_aspect: "Cyclic machine on Applicant: IN_REVIEW -> NEEDS_INFO -> IN_REVIEW loop executes twice (resubmit is applicant-scoped) before the cycle exits forward to WAITLISTED on approve."
        test_recipe:
          setup:
            - "Applicant exists, IN_REVIEW, with a FINALIZED_ACCEPTED assessment"
          setup_api_calls:
            - { call: "POST /api/applicants", payload: { full_name: "Cyc Lia", email: "cyc.l@x.com", placement_track: AUTISM, household_income_cents: 5000000, region: NW }, as: IntakeCoordinator, captures: { a_id: $.data.id } }
            - { call: "POST /api/applicants/${a_id}/begin-review", as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/assessments", payload: { required_tasks: [ALERT_SOUND], task_urgency_tier: STANDARD, home_environment_score: 8 }, as: IntakeCoordinator, captures: { asmt_id: $.data.id } }
            - { call: "POST /api/assessments/${asmt_id}/finalize", payload: { outcome: FINALIZED_ACCEPTED }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/applicants/${a_id}/request-info", payload: { info_request_note: "need medical letter" }, as: IntakeCoordinator, captures: { s1: $.data.application_status } }
            - { call: "POST /api/applicants/${a_id}/resubmit", as: Applicant, as_user_id: "${a_id}" }
            - { call: "POST /api/applicants/${a_id}/request-info", payload: { info_request_note: "need landlord OK" }, as: IntakeCoordinator }
            - { call: "POST /api/applicants/${a_id}/resubmit", as: Applicant, as_user_id: "${a_id}" }
            - { call: "POST /api/applicants/${a_id}/approve", as: IntakeCoordinator, captures: { s_final: $.data.application_status } }
          assert:
            - "after first request-info: application_status == NEEDS_INFO"
            - "after first resubmit: application_status == IN_REVIEW"
            - "after second cycle: application_status == IN_REVIEW (loop repeatable, no loop counter)"
            - "after approve: application_status == WAITLISTED and a PENDING WaitlistEntry exists"

      - name: dog_raiser_recall_cycle_and_match_revert
        grounds:
          - state_machines.Dog.RAISER_PLACED_to_RECALLED
          - state_machines.Dog.RECALLED_to_RAISER_PLACED
          - state_machines.Dog.MATCHED_to_MATCH_READY
          - state_machines.MatchRecord.ACCEPTED_to_DISSOLVED
        distinguishing_aspect: "Non-linear machine on Dog (a different entity than Applicant): RAISER_PLACED -> RECALLED -> RAISER_PLACED placement loop, then later MATCHED -> MATCH_READY revert on match dissolve — two distinct backward edges in one lifecycle."
        test_recipe:
          setup:
            - "DONATED dog cleared (84), raiser approved; dog foster-placed once"
          setup_api_calls:
            - { call: "POST /api/dogs", payload: { name: "Loop", origin: DONATED, breed: "Poodle", sex: MALE, born_on: "2024-06-01", region: NW, donor_name: "Donor Three" }, as: ProgramAdmin, captures: { d_id: $.data.id } }
            - { call: "POST /api/dogs/${d_id}/begin-screening", as: Veterinarian }
            - { call: "POST /api/dogs/${d_id}/screenings", payload: { hip_grade: GOOD, elbow_grade: NORMAL, eye_result: CLEAR, cardiac_result: NORMAL, genetic_panel: CARRIER }, as: Veterinarian, captures: { sc_id: $.data.id } }
            - { call: "POST /api/screenings/${sc_id}/submit", as: Veterinarian }
            - { call: "POST /api/puppy-raisers", payload: { full_name: "Raiser Three", region: NW, foster_capacity: 2, experience_score: 70 }, as: ProgramAdmin, captures: { r_id: $.data.id } }
            - { call: "POST /api/puppy-raisers/${r_id}/vet", as: ProgramAdmin }
            - { call: "POST /api/puppy-raisers/${r_id}/approve", as: ProgramAdmin }
            - { call: "POST /api/dogs/${d_id}/raiser-placements", payload: { puppy_raiser_id: "${r_id}" }, as: TrainingDirector, captures: { pl1_id: $.data.id } }
            - { call: "POST /api/trainers", payload: { full_name: "Trainer Loop", pat_certified: false }, as: ProgramAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/trainers/${t_id}/certify", as: ProgramAdmin }
          trigger:
            - { call: "POST /api/raiser-placements/${pl1_id}/early-return", as: TrainingDirector, captures: { st1: $.data.status } }
            - { call: "POST /api/dogs/${d_id}/raiser-placements", payload: { puppy_raiser_id: "${r_id}" }, as: TrainingDirector, captures: { pl2_id: $.data.id } }
            - { call: "POST /api/raiser-placements/${pl2_id}/complete", payload: { primary_trainer_id: "${t_id}" }, as: TrainingDirector }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: RETRIEVE_ITEMS, score: 95 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: TASK_WORK, task_code: OPEN_DOORS, score: 90 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: PUBLIC_MANNERS, score: 88 }, as: Trainer, as_user_id: "${t_id}" }
            - { call: "POST /api/dogs/${d_id}/milestones", payload: { category: OBEDIENCE, score: 85 }, as: Trainer, as_user_id: "${t_id}" }
