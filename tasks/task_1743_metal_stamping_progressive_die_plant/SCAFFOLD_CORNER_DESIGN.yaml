            - call: "POST /api/part-die-assignments"
              payload: { part_id: "${part_id}", die_id: "${die_id}" }
              as: ProcessEngineer
            - call: "POST /api/strip-layouts"
              payload: { part_id: "${part_id}", revision: "A", strip_width_mm: 250, pitch_mm: 120, parts_per_strip_segment: 1, gross_weight_per_part_kg: 0.85 }
              as: ProcessEngineer
              captures: { layout_id: $.data.id }
            - call: "POST /api/strip-layouts/${layout_id}/approve"
              payload: { expected_part_version: "${part_ver}" }
              as: ProcessEngineer
            - call: "POST /api/ppap-submissions"
              payload: { part_id: "${part_id}", level: 1, control_plan_attached: false }
              as: ProcessEngineer
              captures: { ppap_id: $.data.id }
            - call: "POST /api/ppap-submissions/${ppap_id}/begin-review"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-1"
            - call: "POST /api/ppap-submissions/${ppap_id}/approve"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-2"
            - call: "POST /api/production-orders"
              payload: { part_id: "${part_id}", quantity_ordered: 500, due_date: "2026-08-20T00:00:00Z" }
              as: ProductionPlanner
              captures: { order_id: $.data.id, order_ver: $.data.version }
            - call: "POST /api/production-orders/${order_id}/release"
              payload: { expected_order_version: "${order_ver}" }
