scenario: |
  Generate task harder than expert level!

  2495. Residential HVAC Equipment Plant (heating and cooling equipment plant): product platform design
  across efficiency tiers with refrigerant transition planning, coil fabrication, brazing and leak testing
  with helium or pressure decay methods, charging, run testing and performance verification against rated
  capacity, efficiency rating certification and regional standard compliance restricting product sale by
  region, refrigerant transition compliance with equipment redesign, safety standards for flammable
  refrigerants and inventory sell-through deadlines, supply constraints on compressors and controls with
  allocation across distributor demand, seasonal production leveling with pre-season build and warehouse
  capacity, warranty claim analysis feeding design and supplier corrective action

domain_name: residential-hvac-equipment-plant
api_prefix: /plant

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a top-level collection under /plant; parents are referenced by FK fields in
  # request bodies, never by URL nesting. Sub-resource GETs exist only as reverse-reachability reads.

  state_machine_shape: cyclic
  # BuildOrder carries a rework cycle (BRAZED -> REWORK -> COIL_FAB -> BRAZED); DistributorOrder carries
  # two independent state dimensions (allocation_status x fulfillment_status); CertificationRecord forks
  # SUBMITTED -> {CERTIFIED, REJECTED} with divergent side-effect sets.

  relationship_patterns:
    - one_to_many        # ProductPlatform -> BuildOrder / DistributorOrder / CertificationRecord
    - many_to_many       # DistributorOrder <-> ComponentSupply via AllocationLine
    - self_referential   # ProductPlatform.supersedes_platform_id -> ProductPlatform.id (redesign lineage)
    - cross_aggregate    # WarrantyClaim -> SupplierCorrectiveAction -> ComponentSupply -> AllocationLine

  role_model: segregation_of_duties
  # The engineer who submits a platform for engineering review cannot release it; the certification
  # engineer who submits a certification cannot decide it; the technician who ran the passing leak test
  # cannot run the performance run test; the analyst who filed the triggering claim cannot close the CAPA.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: RefrigerantProgram
    parent: null
    common_fields: true
    fields:
      - { name: refrigerant_code, type: string, source: input, description: "ASHRAE designation, e.g. R-410A or R-454B", constraints: "1-32 chars; unique across all RefrigerantProgram rows" }
      - { name: gwp, type: integer, source: input, description: "global warming potential of the refrigerant", constraints: ">= 1" }
      - { name: flammability_class, type: enum, source: input, description: "ASHRAE flammability class governing the safety rules applied to platforms on this program", constraints: "A1 | A2L" }
      - { name: manufacture_cutoff_utc, type: datetime, source: input, description: "no BuildOrder on an affected platform may be created or charged at or after this instant" }
      - { name: sell_through_deadline_utc, type: datetime, source: input, description: "existing finished inventory may no longer be shipped at or after this instant", constraints: "must be strictly after manufacture_cutoff_utc" }
      - { name: status, type: enum, source: system, description: "program lifecycle phase", default: ACTIVE, constraints: "ACTIVE | SELL_THROUGH | EXPIRED" }
      - { name: sell_through_entered_at, type: datetime, source: system, description: "logical clock instant when the program entered SELL_THROUGH; null before that", default: null }
      - { name: expired_at, type: datetime, source: system, description: "logical clock instant when the program expired; null before that", default: null }
      - { name: affected_platform_count, type: integer, source: computed, description: "count of ProductPlatform rows whose refrigerant_program_id == this id and whose status IN {DRAFT, ENG_REVIEW, RELEASED, RESTRICTED}", default: 0 }

  - name: RegionalStandard
    parent: null
    common_fields: true
    fields:
      - { name: region_code, type: string, source: input, description: "regional efficiency-standard jurisdiction code, e.g. SOUTHEAST", constraints: "1-32 chars, A-Z and underscore; unique across RegionalStandard rows with status == ACTIVE" }
      - { name: min_seer2_standard, type: number, source: input, description: "minimum rated SEER2 a STANDARD-tier platform must hold to be sold in this region", constraints: "> 0, two decimals" }
      - { name: min_seer2_high, type: number, source: input, description: "minimum rated SEER2 for a HIGH-tier platform", constraints: "> 0, two decimals" }
      - { name: min_seer2_premium, type: number, source: input, description: "minimum rated SEER2 for a PREMIUM-tier platform", constraints: "> 0, two decimals" }
      - { name: prohibits_flammable_refrigerant, type: boolean, source: input, description: "when true, no platform whose program flammability_class == A2L may be certified for this region", default: false }
      - { name: effective_from_utc, type: datetime, source: input, description: "the standard participates in salability computation only when logical clock >= this instant" }
      - { name: status, type: enum, source: system, description: "set to ACTIVE at creation; the plant never withdraws a published standard", default: ACTIVE, constraints: "ACTIVE" }

  - name: ProductPlatform
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "plant model code for the platform", constraints: "1-32 chars; unique across ProductPlatform rows" }
      - { name: efficiency_tier, type: enum, source: input, description: "efficiency tier of the platform within the product family", constraints: "STANDARD | HIGH | PREMIUM" }
      - { name: refrigerant_program_id, type: string, source: input, description: "FK -> RefrigerantProgram.id; the refrigerant transition program this platform is designed around" }
      - { name: supersedes_platform_id, type: string, source: input, description: "FK -> ProductPlatform.id; the predecessor platform this redesign replaces, null for a first-generation platform", default: null }
      - { name: rated_capacity_btuh, type: integer, source: input, description: "nameplate cooling capacity in BTU/h used as the run-test reference", constraints: ">= 6000" }
      - { name: rated_eer, type: number, source: input, description: "nameplate full-load EER (BTU/h per watt) used as the run-test efficiency reference", constraints: "> 0, two decimals" }
      - { name: rated_seer2, type: number, source: input, description: "nameplate SEER2 rating compared against RegionalStandard minimums", constraints: "> 0, two decimals" }
      - { name: compressor_part_number, type: string, source: input, description: "compressor part number consumed one-per-unit by every BuildOrder and allocation of this platform" }
      - { name: control_board_part_number, type: string, source: input, description: "control board part number consumed one-per-unit by every BuildOrder and allocation of this platform" }
      - { name: max_charge_grams, type: integer, source: input, description: "safety charge ceiling for flammable refrigerant; required when the program flammability_class == A2L, optional otherwise", default: null }
      - { name: status, type: enum, source: system, description: "platform design lifecycle state", default: DRAFT, constraints: "DRAFT | ENG_REVIEW | RELEASED | RESTRICTED | RETIRED" }
      - { name: revision_round, type: integer, source: system, description: "incremented by 1 on every DRAFT -> ENG_REVIEW transition", default: 0 }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the DesignEngineer who submitted the current engineering review; retained after release for segregation-of-duties audit", default: null }
      - { name: released_at, type: datetime, source: system, description: "logical clock instant of the ENG_REVIEW -> RELEASED transition", default: null }
      - { name: blocked_region_codes, type: array, source: computed, description: "region codes in which this platform may not be sold, sorted ascending; recomputed per calculations.platform_regional_salability", default: [] }
      - { name: salable_region_count, type: integer, source: computed, description: "count of participating RegionalStandard rows minus the length of blocked_region_codes", default: 0 }
      - { name: warranty_posture, type: enum, source: computed, description: "derived warranty gate recomputed per calculations.platform_warranty_posture", default: OK, constraints: "OK | CAPA_REQUIRED | DESIGN_CHANGE_REQUIRED" }
      - { name: rolling_claim_rate_pct, type: number, source: computed, description: "BUILT_BASIS variant of calculations.platform_warranty_claim_rate as of the last recompute", default: 0.00 }
      - { name: units_built_released, type: integer, source: computed, description: "sum of BuildOrder.quantity_units over this platform's BuildOrder rows with status == RELEASED_TO_STOCK", default: 0 }
      - { name: units_shipped_total, type: integer, source: computed, description: "sum of DistributorOrder.shipped_units over this platform's orders with fulfillment_status == SHIPPED", default: 0 }
      - { name: last_revision_notes, type: string, source: input, description: "reviewer notes recorded by the most recent ENG_REVIEW -> DRAFT return; null until a review is returned", default: null }

  - name: CertificationRecord
    parent: null
    common_fields: true
    fields:
      - { name: platform_id, type: string, source: input, description: "FK -> ProductPlatform.id; the platform being certified" }
      - { name: region_code, type: string, source: input, description: "target jurisdiction; the governing standard is the ACTIVE RegionalStandard with this region_code, pinned into governing_standard_id at submit" }
      - { name: rated_seer2_submitted, type: number, source: input, description: "SEER2 value submitted to the certification body; must equal or exceed the governing regional minimum for the platform tier", constraints: "> 0, two decimals" }
      - { name: status, type: enum, source: system, description: "certification lifecycle state", default: DRAFT, constraints: "DRAFT | SUBMITTED | CERTIFIED | REJECTED | WITHDRAWN | SUPERSEDED" }
      - { name: governing_standard_id, type: string, source: computed, description: "id of the RegionalStandard row resolved at submit time and pinned for the rest of this record's life", default: null }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of the CertificationEngineer who submitted this record", default: null }
      - { name: submitted_at, type: datetime, source: system, description: "logical clock instant of DRAFT -> SUBMITTED", default: null }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the RegulatoryAuditor who decided this record", default: null }
      - { name: decided_at, type: datetime, source: system, description: "logical clock instant of the SUBMITTED -> CERTIFIED or SUBMITTED -> REJECTED transition", default: null }
      - { name: rejection_reason, type: string, source: system, description: "auditor-supplied reason echoed from the decide call when decision == REJECTED", default: null }
      - { name: withdrawn_at, type: datetime, source: system, description: "logical clock instant at which a CERTIFIED record was withdrawn by a platform retirement cascade", default: null }

  - name: ComponentSupply
    parent: null
    common_fields: true
    fields:
      - { name: component_type, type: enum, source: input, description: "which constrained component this supply row covers", constraints: "COMPRESSOR | CONTROL_BOARD" }
      - { name: part_number, type: string, source: input, description: "part number matched against ProductPlatform.compressor_part_number or control_board_part_number" }
      - { name: supplier_lot_code, type: string, source: input, description: "supplier lot identifier used to attribute warranty claims to this supply row" }
      - { name: supply_month, type: string, source: input, description: "delivery month this pool covers, matched against DistributorOrder.requested_delivery_month", constraints: "YYYY-MM" }
      - { name: total_allocatable_units, type: integer, source: input, description: "units the supplier committed for the month before any corrective-action derate", constraints: ">= 1" }
      - { name: allocation_policy, type: enum, source: input, description: "selects which variant of calculations.allocation_fill_plan governs draws against this pool", default: PRIORITY_WATERFALL, constraints: "PRIORITY_WATERFALL | DEMAND_PRORATA" }
      - { name: derate_pct, type: integer, source: computed, description: "percentage cut applied by an OPEN SupplierCorrectiveAction on this supply row", default: 0, constraints: "0 | 25 | 50 | 100" }
      - { name: effective_allocatable_units, type: integer, source: computed, description: "floor(total_allocatable_units * (100 - derate_pct) / 100)", default: 0 }
      - { name: reserved_units, type: integer, source: computed, description: "sum of AllocationLine.units over this supply's lines with status == RESERVED", default: 0 }
      - { name: committed_units, type: integer, source: computed, description: "sum of AllocationLine.units over this supply's lines with status == COMMITTED", default: 0 }
      - { name: available_units, type: integer, source: computed, description: "effective_allocatable_units - reserved_units - committed_units; may be driven negative only transiently inside a derate cascade, which then revokes lines until it is >= 0", default: 0 }
      - { name: status, type: enum, source: system, description: "supply pool state", default: ACTIVE, constraints: "ACTIVE | DERATED | EXHAUSTED | CLOSED" }

  - name: AllocationLine
    parent: null
    common_fields: true
    fields:
      - { name: distributor_order_id, type: string, source: system, description: "FK -> DistributorOrder.id; the order this line was granted to" }
      - { name: component_supply_id, type: string, source: system, description: "FK -> ComponentSupply.id; the pool this line draws from" }
      - { name: component_type, type: enum, source: system, description: "copied from the drawn ComponentSupply row", constraints: "COMPRESSOR | CONTROL_BOARD" }
      - { name: units, type: integer, source: system, description: "units drawn from the pool by this line", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "line state; RESERVED on grant, COMMITTED on ship, REVOKED by a derate cascade, RELEASED by order cancellation or platform retirement", default: RESERVED, constraints: "RESERVED | COMMITTED | REVOKED | RELEASED" }
      - { name: closed_reason, type: string, source: system, description: "reason string recorded when the line leaves RESERVED for REVOKED or RELEASED", default: null }

  - name: DistributorOrder
    parent: null
    common_fields: true
    fields:
      - { name: distributor_code, type: string, source: input, description: "distributor account code placing the demand" }
      - { name: platform_id, type: string, source: input, description: "FK -> ProductPlatform.id; the platform being ordered" }
      - { name: region_code, type: string, source: input, description: "jurisdiction the units will be sold into; must not appear in ProductPlatform.blocked_region_codes at allocation time" }
      - { name: requested_units, type: integer, source: input, description: "units of demand placed by the distributor", constraints: ">= 1" }
      - { name: priority_score, type: integer, source: input, description: "distributor demand priority used as the PRIORITY_WATERFALL sort key", constraints: "1..100" }
      - { name: requested_delivery_month, type: string, source: input, description: "delivery month matched against ComponentSupply.supply_month", constraints: "YYYY-MM" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the DistributorRep who created the order; ownership checks compare against this field" }
      - { name: allocated_units, type: integer, source: computed, description: "sum of AllocationLine.units for this order where component_type == COMPRESSOR and status IN {RESERVED, COMMITTED}", default: 0 }
      - { name: allocation_status, type: enum, source: system, description: "supply dimension, independent of fulfillment_status", default: UNALLOCATED, constraints: "UNALLOCATED | PARTIALLY_ALLOCATED | FULLY_ALLOCATED" }
      - { name: fulfillment_status, type: enum, source: system, description: "logistics dimension, independent of allocation_status", default: PENDING, constraints: "PENDING | STAGED | SHIPPED | CANCELLED" }
      - { name: shipped_units, type: integer, source: system, description: "units actually shipped; set by the ship transition", default: 0 }
      - { name: staged_at, type: datetime, source: system, description: "logical clock instant of PENDING -> STAGED", default: null }
      - { name: shipped_at, type: datetime, source: system, description: "logical clock instant of STAGED -> SHIPPED; the rolling warranty window filters on this field", default: null }
      - { name: cancelled_at, type: datetime, source: system, description: "logical clock instant of PENDING -> CANCELLED", default: null }

  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "warehouse name" }
      - { name: pallet_capacity, type: integer, source: input, description: "maximum pallets the warehouse can hold on any single calendar day", constraints: ">= 1" }
      - { name: pallets_reserved_current, type: integer, source: computed, description: "sum of WarehouseReservation.pallet_units over this warehouse's rows with status == ACTIVE whose start_date <= logical-clock date < end_date", default: 0 }

  - name: WarehouseReservation
    parent: null
    common_fields: true
    fields:
      - { name: warehouse_id, type: string, source: input, description: "FK -> Warehouse.id; the warehouse holding the pre-season stock" }
      - { name: build_order_id, type: string, source: input, description: "FK -> BuildOrder.id; the pre-season build whose finished units occupy the pallets" }
      - { name: start_date, type: string, source: input, description: "first occupied calendar day, inclusive", constraints: "YYYY-MM-DD" }
      - { name: end_date, type: string, source: input, description: "first free calendar day, exclusive; must be strictly after start_date", constraints: "YYYY-MM-DD" }
      - { name: pallet_units, type: integer, source: input, description: "pallets occupied every day of the half-open interval", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "reservation state", default: ACTIVE, constraints: "ACTIVE | RELEASED" }
      - { name: released_at, type: datetime, source: system, description: "logical clock instant at which the reservation was released", default: null }
      - { name: release_reason, type: string, source: system, description: "why the reservation was released (operator release, regulatory hold cascade, or scrap cascade)", default: null }

  - name: TestCell
    parent: null
    common_fields: true
    fields:
      - { name: cell_code, type: string, source: input, description: "run-test cell identifier", constraints: "1-32 chars; unique across TestCell rows" }
      - { name: cooldown_minutes, type: integer, source: input, description: "mandatory idle buffer applied on both sides of every RunTest window occupying this cell", default: 30, constraints: "0..240" }
      - { name: status, type: enum, source: system, description: "set to ACTIVE at creation; cells are never retired in this scope", default: ACTIVE, constraints: "ACTIVE" }

  - name: BuildOrder
    parent: null
    common_fields: true
    fields:
      - { name: platform_id, type: string, source: input, description: "FK -> ProductPlatform.id; the platform being built" }
      - { name: quantity_units, type: integer, source: input, description: "units in this build lot", constraints: ">= 1" }
      - { name: is_preseason, type: boolean, source: input, description: "true for pre-season leveling builds, which may hold warehouse reservations and must hold one at release time", default: false }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "planned coil-fabrication start instant" }
      - { name: status, type: enum, source: system, description: "manufacturing stage", default: DRAFT, constraints: "DRAFT | COIL_FAB | BRAZED | REWORK | LEAK_PASSED | CHARGED | RUN_PASSED | RELEASED_TO_STOCK | HOLD_REGULATORY | SCRAPPED | CANCELLED" }
      - { name: rework_count, type: integer, source: system, description: "incremented by 1 on every failed leak test or failed run test; a third increment scraps the lot", default: 0 }
      - { name: charge_grams, type: integer, source: system, description: "refrigerant charge currently in the lot; reset to 0 when a failed run test sends the lot back to REWORK", default: 0 }
      - { name: hold_reason, type: string, source: system, description: "why the lot sits in HOLD_REGULATORY", default: null }
      - { name: closed_reason, type: string, source: system, description: "reason recorded on cancellation or scrap", default: null }
      - { name: released_to_stock_at, type: datetime, source: system, description: "logical clock instant of RUN_PASSED -> RELEASED_TO_STOCK", default: null }
      - { name: latest_leak_verdict, type: enum, source: computed, description: "verdict of this lot's most recent LeakTest ordered by created_at DESC, null when none exists", default: null, constraints: "PASS | FAIL" }
      - { name: latest_run_verdict, type: enum, source: computed, description: "verdict of this lot's most recent RunTest ordered by created_at DESC, null when none exists", default: null, constraints: "PASS | FAIL" }

  - name: LeakTest
    parent: null
    common_fields: false
    fields:
      - { name: build_order_id, type: string, source: input, description: "FK -> BuildOrder.id; the brazed lot under test" }
      - { name: method, type: enum, source: input, description: "leak detection method, which selects the pass criterion", constraints: "HELIUM_MASS_SPEC | PRESSURE_DECAY" }
      - { name: measured_leak_rate_g_per_year, type: number, source: input, description: "tracer leak rate; required when method == HELIUM_MASS_SPEC, forbidden otherwise", default: null, constraints: ">= 0, two decimals" }
      - { name: decay_kpa, type: number, source: input, description: "pressure drop over the hold; required when method == PRESSURE_DECAY, forbidden otherwise", default: null, constraints: ">= 0, two decimals" }
      - { name: hold_minutes, type: integer, source: input, description: "pressure hold duration; required when method == PRESSURE_DECAY, forbidden otherwise", default: null, constraints: ">= 0" }
      - { name: applied_limit, type: number, source: computed, description: "the method-specific limit actually applied after the A2L strictness factor, per calculations.leak_test_verdict" }
      - { name: verdict, type: enum, source: computed, description: "PASS or FAIL per calculations.leak_test_verdict", constraints: "PASS | FAIL" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the QualityTechnician who recorded the test" }
      - { name: performed_at, type: datetime, source: system, description: "logical clock instant at which the test was recorded" }

  - name: RunTest
    parent: null
    common_fields: false
    fields:
      - { name: build_order_id, type: string, source: input, description: "FK -> BuildOrder.id; the charged lot under performance test" }
      - { name: test_cell_id, type: string, source: input, description: "FK -> TestCell.id; the cell the lot occupies for the window" }
      - { name: window_start_utc, type: datetime, source: input, description: "cell occupancy start, inclusive" }
      - { name: window_end_utc, type: datetime, source: input, description: "cell occupancy end, inclusive; must be strictly after window_start_utc" }
      - { name: measured_capacity_btuh, type: integer, source: input, description: "measured cooling capacity at the measured ambient temperature", constraints: ">= 0" }
      - { name: measured_power_w, type: integer, source: input, description: "measured total input power in watts", constraints: ">= 1" }
      - { name: measured_ambient_c, type: number, source: input, description: "outdoor ambient temperature during the test in Celsius", constraints: "one decimal" }
      - { name: corrected_capacity_btuh, type: integer, source: computed, description: "measured capacity corrected to the 35.0 C baseline, per calculations.run_test_performance_verdict" }
      - { name: capacity_ratio, type: number, source: computed, description: "corrected_capacity_btuh / ProductPlatform.rated_capacity_btuh, four decimals" }
      - { name: efficiency_ratio, type: number, source: computed, description: "(corrected_capacity_btuh / measured_power_w) / ProductPlatform.rated_eer, four decimals" }
      - { name: applied_capacity_tolerance, type: number, source: computed, description: "tier capacity tolerance actually applied" }
      - { name: applied_efficiency_tolerance, type: number, source: computed, description: "tier efficiency tolerance after the A2L relaxation and the 0.90 floor" }
      - { name: verdict, type: enum, source: computed, description: "PASS or FAIL per calculations.run_test_performance_verdict", constraints: "PASS | FAIL" }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the QualityTechnician who recorded the run test" }
      - { name: performed_at, type: datetime, source: system, description: "logical clock instant at which the run test was recorded" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: platform_id, type: string, source: input, description: "FK -> ProductPlatform.id; the platform the failed unit belongs to" }
      - { name: build_order_id, type: string, source: input, description: "FK -> BuildOrder.id; the lot the failed unit came from, null when the lot is unknown", default: null }
      - { name: failure_code, type: enum, source: input, description: "field failure mode", constraints: "COMPRESSOR_FAILURE | CONTROL_BOARD_FAULT | COIL_LEAK | CHARGE_LOSS | FAN_MOTOR" }
      - { name: component_type, type: enum, source: input, description: "constrained component blamed for the failure; null for non-component failures, which never open a corrective action", default: null, constraints: "COMPRESSOR | CONTROL_BOARD" }
      - { name: supplier_lot_code, type: string, source: input, description: "supplier lot blamed for the failure, matched against ComponentSupply.supplier_lot_code; null for non-component failures", default: null }
      - { name: claim_cost_cents, type: integer, source: input, description: "warranty cost of the claim in cents", constraints: ">= 0" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the WarrantyAnalyst who filed the claim" }
      - { name: filed_at, type: datetime, source: system, description: "logical clock instant at filing; the rolling warranty window filters on this field" }
      - { name: status, type: enum, source: system, description: "claim state; LINKED_TO_CAPA when a corrective action cites it, CLOSED when that action closes as EFFECTIVE", default: OPEN, constraints: "OPEN | LINKED_TO_CAPA | CLOSED" }

  - name: SupplierCorrectiveAction
    parent: null
    common_fields: true
    fields:
      - { name: component_supply_id, type: string, source: system, description: "FK -> ComponentSupply.id; the derated supply pool this action governs" }
      - { name: warranty_claim_id, type: string, source: system, description: "FK -> WarrantyClaim.id; the claim whose filing crossed the corrective-action threshold" }
      - { name: supplier_lot_code, type: string, source: system, description: "supplier lot copied from the triggering claim" }
      - { name: component_type, type: enum, source: system, description: "component type copied from the triggering claim", constraints: "COMPRESSOR | CONTROL_BOARD" }
      - { name: trigger_claim_rate_pct, type: number, source: system, description: "ROLLING_WINDOW claim rate at the instant the action opened, two decimals" }
      - { name: derate_pct, type: integer, source: system, description: "derate applied to the supply pool, per calculations.supply_derate_plan", constraints: "25 | 50 | 100" }
      - { name: cited_claim_count, type: integer, source: system, description: "number of WarrantyClaim rows moved to LINKED_TO_CAPA when this action opened" }
      - { name: status, type: enum, source: system, description: "corrective action state", default: OPEN, constraints: "OPEN | CLOSED_EFFECTIVE | CLOSED_INEFFECTIVE" }
      - { name: resolution, type: enum, source: system, description: "closure resolution echoed from the close call", default: null, constraints: "EFFECTIVE | INEFFECTIVE" }
      - { name: effectiveness_note, type: string, source: system, description: "free-text closure note", default: null }
      - { name: closed_by_user_id, type: string, source: system, description: "X-User-ID of the ReliabilityEngineer who closed the action", default: null }
      - { name: closed_at, type: datetime, source: system, description: "logical clock instant of closure", default: null }

state_machines:
  - entity: RefrigerantProgram
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SELL_THROUGH
        trigger: "POST /plant/refrigerant-programs/{id}/enter-sell-through"
        actor: PlantAdmin
        preconditions:
          - "status == ACTIVE, else ERR_PROGRAM_STATE_INVALID"
          - "logical clock >= manufacture_cutoff_utc, else ERR_MANUFACTURE_CUTOFF_NOT_REACHED"
        side_effects:
          - "status = SELL_THROUGH; sell_through_entered_at = logical clock; version += 1"
          - "HOP 1 - every ProductPlatform P where P.refrigerant_program_id == this.id AND P.status == RELEASED (processed created_at ASC): P.status = RESTRICTED; P.blocked_region_codes and P.salable_region_count recomputed per calculations.platform_regional_salability; P.updated_at refreshed; P.version += 1"
          - "HOP 2 - caused by each P entering RESTRICTED: every BuildOrder B where B.platform_id == P.id AND B.status IN {DRAFT, COIL_FAB, BRAZED, REWORK, LEAK_PASSED, CHARGED, RUN_PASSED} (processed created_at ASC): B.status = HOLD_REGULATORY; B.hold_reason = 'REFRIGERANT_SELL_THROUGH'; B.version += 1"
          - "HOP 3 - caused by each B entering HOLD_REGULATORY: every WarehouseReservation R where R.build_order_id == B.id AND R.status == ACTIVE (processed created_at ASC): R.status = RELEASED; R.released_at = logical clock; R.release_reason = 'BUILD_ON_REGULATORY_HOLD'; R.version += 1"
          - "HOP 4 - caused by each R entering RELEASED: Warehouse.pallets_reserved_current recomputed for R.warehouse_id; that Warehouse.version += 1"
        note: "Depth-4 transitive cascade; each hop is caused by the mutation of the previous hop, not by the original request."
      - from: SELL_THROUGH
        to: EXPIRED
        trigger: "POST /plant/refrigerant-programs/{id}/expire"
        actor: PlantAdmin
        preconditions:
          - "status == SELL_THROUGH, else ERR_PROGRAM_STATE_INVALID"
          - "logical clock >= sell_through_deadline_utc, else ERR_SELL_THROUGH_DEADLINE_NOT_REACHED"
        side_effects:
          - "status = EXPIRED; expired_at = logical clock; version += 1"
          - "HOP 1 - every ProductPlatform P where P.refrigerant_program_id == this.id AND P.status IN {DRAFT, ENG_REVIEW, RELEASED, RESTRICTED} (processed created_at ASC): P.status = RETIRED; P.version += 1"
          - "HOP 2 - caused by each P entering RETIRED: the full ProductPlatform RETIRED cascade defined on state_machines.ProductPlatform.RESTRICTED_to_RETIRED runs for P (certification withdrawal, salability recompute, build cancellation, order cancellation and allocation release)"
        note: "Second transitive cascade, originating from a different trigger than the sell-through cascade."

  - entity: ProductPlatform
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: CREATE
        to: DRAFT
        trigger: "POST /plant/product-platforms"
        actor: DesignEngineer
        preconditions:
          - "refrigerant_program_id resolves to an existing RefrigerantProgram, else ERR_REFRIGERANT_PROGRAM_NOT_FOUND"
          - "that program's status == ACTIVE, else ERR_PROGRAM_STATE_INVALID"
          - "supersedes_platform_id, when supplied, resolves to an existing ProductPlatform, else ERR_PLATFORM_NOT_FOUND"
          - "model_code is unique across ProductPlatform rows, else ERR_INVALID_REQUEST"
        side_effects:
          - "status = DRAFT; revision_round = 0; blocked_region_codes = []; salable_region_count = 0; warranty_posture = OK; rolling_claim_rate_pct = 0.00; units_built_released = 0; units_shipped_total = 0"
          - "RefrigerantProgram.affected_platform_count recomputed for refrigerant_program_id"
      - from: DRAFT
        to: ENG_REVIEW
        trigger: "POST /plant/product-platforms/{id}/submit-engineering-review"
        actor: DesignEngineer
        preconditions:
          - "status == DRAFT, else ERR_INVALID_PLATFORM_STATE"
          - "the platform's RefrigerantProgram.status == ACTIVE, else ERR_PROGRAM_STATE_INVALID"
          - "when the program flammability_class == A2L then max_charge_grams is non-null and >= 1, else ERR_A2L_SAFETY_LIMIT_UNSET"
        side_effects:
          - "status = ENG_REVIEW; revision_round += 1; submitted_by_user_id = X-User-ID; version += 1"
      - from: ENG_REVIEW
        to: DRAFT
        trigger: "POST /plant/product-platforms/{id}/return-to-draft"
        actor: ReliabilityEngineer
        preconditions:
          - "status == ENG_REVIEW, else ERR_INVALID_PLATFORM_STATE"
          - "X-User-ID != submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "status = DRAFT; last_revision_notes = request revision_notes; submitted_by_user_id retained for audit; version += 1"
        note: "Revision loop closing the DRAFT -> ENG_REVIEW -> DRAFT cycle; revision_round keeps counting rounds."
      - from: ENG_REVIEW
        to: RELEASED
        trigger: "POST /plant/product-platforms/{id}/release"
        actor: ReliabilityEngineer
        preconditions:
          - "status == ENG_REVIEW, else ERR_INVALID_PLATFORM_STATE"
          - "X-User-ID != submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the platform's RefrigerantProgram.status == ACTIVE, else ERR_PROGRAM_STATE_INVALID"
        side_effects:
          - "status = RELEASED; released_at = logical clock; version += 1"
          - "blocked_region_codes and salable_region_count recomputed per calculations.platform_regional_salability"
      - from: RELEASED
        to: RESTRICTED
        trigger: "system - HOP 1 of the RefrigerantProgram ACTIVE -> SELL_THROUGH cascade"
        actor: system
        preconditions:
          - "status == RELEASED and the transitioning program is this platform's refrigerant_program_id"
        side_effects:
          - "status = RESTRICTED; blocked_region_codes and salable_region_count recomputed; version += 1"
          - "new BuildOrder creation for this platform is refused from here on with ERR_INVALID_PLATFORM_STATE; already-finished stock may still ship until the sell-through deadline"
      - from: RESTRICTED
        to: RETIRED
        trigger: "POST /plant/product-platforms/{id}/retire, or system HOP 1 of the RefrigerantProgram SELL_THROUGH -> EXPIRED cascade"
        actor: PlantAdmin
        preconditions:
          - "status IN {RELEASED, RESTRICTED} for the endpoint form, else ERR_INVALID_PLATFORM_STATE"
          - "no BuildOrder for this platform has status IN {COIL_FAB, BRAZED, REWORK, LEAK_PASSED, CHARGED, RUN_PASSED}, else ERR_PLATFORM_HAS_OPEN_BUILDS (endpoint form only; the system cascade reaches this transition only after the sell-through cascade has already moved those lots to HOLD_REGULATORY)"
        side_effects:
          - "status = RETIRED; version += 1"
          - "HOP 1 - every CertificationRecord C where C.platform_id == this.id AND C.status IN {DRAFT, SUBMITTED, CERTIFIED} (processed created_at ASC): C.status = WITHDRAWN; C.withdrawn_at = logical clock; C.version += 1"
          - "HOP 2 - caused by the withdrawal of those records: blocked_region_codes recomputed - every participating RegionalStandard.region_code is now blocked because no CERTIFIED record remains - and salable_region_count = 0; version += 1"
          - "HOP 3 - every BuildOrder B where B.platform_id == this.id AND B.status IN {DRAFT, HOLD_REGULATORY} (processed created_at ASC): B.status = CANCELLED; B.closed_reason = 'PLATFORM_RETIRED'; B.version += 1; then caused by that cancellation, every WarehouseReservation R of B with status == ACTIVE becomes RELEASED with release_reason = 'BUILD_CANCELLED' and Warehouse.pallets_reserved_current is recomputed for R.warehouse_id"
          - "HOP 4 - every DistributorOrder O where O.platform_id == this.id AND O.fulfillment_status == PENDING (processed created_at ASC): O.fulfillment_status = CANCELLED; O.cancelled_at = logical clock; then caused by that cancellation, every AllocationLine L of O with status == RESERVED becomes RELEASED with closed_reason = 'PLATFORM_RETIRED', each touched ComponentSupply recomputes reserved_units / available_units and returns EXHAUSTED -> ACTIVE when available_units > 0, and O.allocated_units = 0 with O.allocation_status = UNALLOCATED"
      - from: RELEASED
        to: RETIRED
        trigger: "POST /plant/product-platforms/{id}/retire"
        actor: PlantAdmin
        preconditions:
          - "same preconditions and side effects as RESTRICTED -> RETIRED"
        side_effects:
          - "identical to state_machines.ProductPlatform.RESTRICTED_to_RETIRED"
      - from: DRAFT
        to: RETIRED
        trigger: "system - HOP 1 of the RefrigerantProgram SELL_THROUGH -> EXPIRED cascade"
        actor: system
        preconditions:
          - "status IN {DRAFT, ENG_REVIEW} and the expiring program is this platform's refrigerant_program_id"
        side_effects:
          - "status = RETIRED; version += 1; the RETIRED cascade hops run, which for a never-released platform find no certification, build, or order rows"
      - from: ENG_REVIEW
        to: RETIRED
        trigger: "system - HOP 1 of the RefrigerantProgram SELL_THROUGH -> EXPIRED cascade"
        actor: system
        preconditions:
          - "status == ENG_REVIEW and the expiring program is this platform's refrigerant_program_id"
        side_effects:
          - "status = RETIRED; version += 1"

  - entity: CertificationRecord
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, SUPERSEDED]
    transitions:
      - from: CREATE
        to: DRAFT
        trigger: "POST /plant/certification-records"
        actor: CertificationEngineer
        preconditions:
          - "platform_id resolves to an existing ProductPlatform, else ERR_PLATFORM_NOT_FOUND"
          - "expected_platform_version == ProductPlatform.version, else ERR_STALE_PLATFORM_VERSION (see concurrency_rules certification-create-stale-platform)"
          - "platform.status IN {RELEASED, RESTRICTED}, else ERR_INVALID_PLATFORM_STATE"
          - "no CertificationRecord with the same platform_id and region_code already has status == CERTIFIED, else ERR_DUPLICATE_CERTIFICATION"
        side_effects:
          - "status = DRAFT; governing_standard_id = null"
          - "every prior CertificationRecord with the same platform_id and region_code whose status IN {DRAFT, SUBMITTED, REJECTED} becomes SUPERSEDED (processed created_at ASC); each such row version += 1"
          - "ProductPlatform.version += 1 so that any other holder of a stale platform version is rejected on its next write"
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /plant/certification-records/{id}/submit"
        actor: CertificationEngineer
        preconditions:
          - "status == DRAFT, else ERR_CERTIFICATION_STATE_INVALID"
          - "platform.status == RELEASED, else ERR_INVALID_PLATFORM_STATE"
          - "a governing RegionalStandard exists for region_code, else ERR_REGIONAL_STANDARD_NOT_FOUND"
          - "rated_seer2_submitted >= the governing standard minimum for platform.efficiency_tier, else ERR_EFFICIENCY_BELOW_REGIONAL_MINIMUM"
        side_effects:
          - "status = SUBMITTED; submitted_by_user_id = X-User-ID; submitted_at = logical clock; governing_standard_id = the resolved RegionalStandard.id; version += 1"
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /plant/certification-records/{id}/decide with decision == CERTIFIED"
        actor: RegulatoryAuditor
        preconditions:
          - "status == SUBMITTED, else ERR_CERTIFICATION_STATE_INVALID"
          - "X-User-ID != submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "NOT (governing standard prohibits_flammable_refrigerant == true AND the platform program flammability_class == A2L), else ERR_FLAMMABLE_REFRIGERANT_PROHIBITED"
        side_effects:
          - "status = CERTIFIED; decided_by_user_id = X-User-ID; decided_at = logical clock; version += 1"
          - "ProductPlatform.blocked_region_codes and salable_region_count recomputed - region_code leaves the blocked list when no other blocking condition applies; ProductPlatform.version += 1"
        note: "CERTIFIED branch of the fork; its side-effect set differs from the REJECTED branch."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /plant/certification-records/{id}/decide with decision == REJECTED"
        actor: RegulatoryAuditor
        preconditions:
          - "status == SUBMITTED, else ERR_CERTIFICATION_STATE_INVALID"
          - "X-User-ID != submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "rejection_reason present in the request body, else ERR_INVALID_REQUEST"
        side_effects:
          - "status = REJECTED; rejection_reason stored; decided_by_user_id = X-User-ID; decided_at = logical clock; version += 1"
          - "ProductPlatform.blocked_region_codes and salable_region_count recomputed - region_code is added to the blocked list because no CERTIFIED record exists for it; ProductPlatform.version += 1"
        note: "REJECTED branch of the fork; no certified_at is stamped and the region stays blocked."
      - from: CERTIFIED
        to: WITHDRAWN
        trigger: "system - HOP 1 of the ProductPlatform RETIRED cascade"
        actor: system
        preconditions:
          - "status IN {DRAFT, SUBMITTED, CERTIFIED} and the retiring platform is this record's platform_id"
        side_effects:
          - "status = WITHDRAWN; withdrawn_at = logical clock; version += 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system - a newer CertificationRecord is created for the same platform_id and region_code"
        actor: system
        preconditions:
          - "status IN {DRAFT, SUBMITTED, REJECTED}"
        side_effects:
          - "status = SUPERSEDED; version += 1"

  - entity: ComponentSupply
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system - an allocation draw drives available_units to exactly 0"
        actor: system
        preconditions:
          - "available_units == 0 after the draw"
        side_effects:
          - "status = EXHAUSTED; version += 1"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system - a line revocation, release, or derate restoration drives available_units above 0"
        actor: system
        preconditions:
          - "available_units > 0 after the recompute and derate_pct == 0"
        side_effects:
          - "status = ACTIVE; version += 1"
      - from: ACTIVE
        to: DERATED
        trigger: "system - a SupplierCorrectiveAction opens against this supply row"
        actor: system
        preconditions:
          - "status IN {ACTIVE, EXHAUSTED} and a new SupplierCorrectiveAction cites this component_supply_id"
        side_effects:
          - "derate_pct = the value from calculations.supply_derate_plan; effective_allocatable_units recomputed; status = DERATED; version += 1"
          - "caused by the new effective_allocatable_units: AllocationLine rows with status == RESERVED are REVOKED in created_at DESC order until available_units >= 0"
      - from: DERATED
        to: ACTIVE
        trigger: "system - the governing SupplierCorrectiveAction closes with resolution == EFFECTIVE"
        actor: system
        preconditions:
          - "no other SupplierCorrectiveAction with status == OPEN cites this component_supply_id"
        side_effects:
          - "derate_pct = 0; effective_allocatable_units = total_allocatable_units; available_units recomputed; status = ACTIVE; version += 1"
      - from: DERATED
        to: CLOSED
        trigger: "system - the governing SupplierCorrectiveAction closes with resolution == INEFFECTIVE"
        actor: system
        preconditions:
          - "the closing corrective action carries resolution == INEFFECTIVE"
        side_effects:
          - "derate_pct = 100; effective_allocatable_units = 0; status = CLOSED; version += 1"
          - "caused by effective_allocatable_units reaching 0: every AllocationLine with status == RESERVED on this supply is REVOKED with closed_reason = 'SUPPLY_CLOSED' in created_at DESC order, and each affected DistributorOrder recomputes allocated_units and allocation_status"

  - entity: DistributorOrder
    initial_state: UNALLOCATED
    terminal_states: [CANCELLED, SHIPPED]
    parallel_dimensions:
      allocation_status: "UNALLOCATED | PARTIALLY_ALLOCATED | FULLY_ALLOCATED - driven only by allocation grants and revocations"
      fulfillment_status: "PENDING | STAGED | SHIPPED | CANCELLED - driven only by logistics actions"
    transitions:
      - from: CREATE
        to: UNALLOCATED
        dimension: allocation_status
        trigger: "POST /plant/distributor-orders"
        actor: DistributorRep
        preconditions:
          - "platform_id resolves to an existing ProductPlatform, else ERR_PLATFORM_NOT_FOUND"
          - "platform.status IN {RELEASED, RESTRICTED}, else ERR_INVALID_PLATFORM_STATE"
        side_effects:
          - "allocation_status = UNALLOCATED; fulfillment_status = PENDING; allocated_units = 0; shipped_units = 0; created_by_user_id = X-User-ID"
      - from: UNALLOCATED
        to: PARTIALLY_ALLOCATED
        dimension: allocation_status
        trigger: "POST /plant/distributor-orders/{id}/allocate granting fewer units than requested_units"
        actor: SupplyPlanner
        preconditions:
          - "allocation_status IN {UNALLOCATED, PARTIALLY_ALLOCATED}, else ERR_ORDER_STATE_INVALID"
          - "fulfillment_status == PENDING, else ERR_ORDER_STATE_INVALID"
          - "expected_component_supply_version == the primary compressor supply version, else ERR_STALE_SUPPLY_VERSION"
          - "region_code NOT IN platform.blocked_region_codes, else ERR_REGION_NOT_CERTIFIED"
          - "the granted unit count from calculations.allocation_fill_plan is >= 1, else ERR_NO_ELIGIBLE_SUPPLY"
        side_effects:
          - "one AllocationLine per drawn ComponentSupply row is created with status = RESERVED"
          - "each drawn ComponentSupply recomputes reserved_units and available_units, may transition ACTIVE -> EXHAUSTED, and version += 1"
          - "allocated_units recomputed; allocation_status = PARTIALLY_ALLOCATED; fulfillment_status untouched; version += 1"
      - from: UNALLOCATED
        to: FULLY_ALLOCATED
        dimension: allocation_status
        trigger: "POST /plant/distributor-orders/{id}/allocate granting exactly the remaining requested_units"
        actor: SupplyPlanner
        preconditions:
          - "same preconditions as UNALLOCATED -> PARTIALLY_ALLOCATED"
        side_effects:
          - "same allocation side effects; allocation_status = FULLY_ALLOCATED once allocated_units == requested_units"
      - from: PARTIALLY_ALLOCATED
        to: FULLY_ALLOCATED
        dimension: allocation_status
        trigger: "POST /plant/distributor-orders/{id}/allocate on an order that already holds a partial grant"
        actor: SupplyPlanner
        preconditions:
          - "same preconditions as UNALLOCATED -> PARTIALLY_ALLOCATED; the grant closes the remaining gap exactly"
        side_effects:
          - "additional AllocationLine rows created with status = RESERVED; allocated_units recomputed; allocation_status = FULLY_ALLOCATED; version += 1"
      - from: FULLY_ALLOCATED
        to: PARTIALLY_ALLOCATED
        dimension: allocation_status
        trigger: "system - a supply derate cascade revokes part of this order's RESERVED lines"
        actor: system
        preconditions:
          - "at least one RESERVED AllocationLine of this order is revoked and allocated_units stays >= 1"
        side_effects:
          - "allocated_units recomputed; allocation_status = PARTIALLY_ALLOCATED; fulfillment_status untouched; version += 1"
      - from: FULLY_ALLOCATED
        to: UNALLOCATED
        dimension: allocation_status
        trigger: "system - a supply derate cascade, an order cancellation, or a platform retirement removes every RESERVED line of this order"
        actor: system
        preconditions:
          - "allocated_units recomputes to 0"
        side_effects:
          - "allocated_units = 0; allocation_status = UNALLOCATED; version += 1"
      - from: PENDING
        to: STAGED
        dimension: fulfillment_status
        trigger: "POST /plant/distributor-orders/{id}/stage"
        actor: ProductionPlanner
        preconditions:
          - "fulfillment_status == PENDING, else ERR_ORDER_STATE_INVALID"
          - "allocation_status == FULLY_ALLOCATED, else ERR_ORDER_STATE_INVALID"
        side_effects:
          - "fulfillment_status = STAGED; staged_at = logical clock; allocation_status untouched; version += 1"
        note: "Cross-dimension guard: the fulfillment dimension may only advance when the allocation dimension is complete."
      - from: STAGED
        to: SHIPPED
        dimension: fulfillment_status
        trigger: "POST /plant/distributor-orders/{id}/ship"
        actor: ProductionPlanner
        preconditions:
          - "fulfillment_status == STAGED, else ERR_ORDER_STATE_INVALID"
          - "shipped_units == allocated_units, else ERR_SHIP_UNITS_EXCEED_ALLOCATION"
          - "logical clock < the platform program sell_through_deadline_utc, else ERR_SELL_THROUGH_DEADLINE_PASSED"
          - "region_code NOT IN platform.blocked_region_codes, else ERR_REGION_NOT_CERTIFIED"
        side_effects:
          - "fulfillment_status = SHIPPED; shipped_units stored; shipped_at = logical clock; version += 1"
          - "every AllocationLine of this order with status == RESERVED becomes COMMITTED (processed created_at ASC); each touched ComponentSupply moves those units from reserved_units to committed_units and version += 1"
          - "ProductPlatform.units_shipped_total recomputed; ProductPlatform.rolling_claim_rate_pct and warranty_posture recomputed; ProductPlatform.version += 1"
      - from: PENDING
        to: CANCELLED
        dimension: fulfillment_status
        trigger: "POST /plant/distributor-orders/{id}/cancel"
        actor: DistributorRep
        preconditions:
          - "fulfillment_status == PENDING, else ERR_ORDER_STATE_INVALID"
          - "X-User-ID == created_by_user_id, else ERR_ORDER_NOT_OWNED"
        side_effects:
          - "fulfillment_status = CANCELLED; cancelled_at = logical clock; version += 1"
          - "every AllocationLine of this order with status == RESERVED becomes RELEASED with closed_reason = 'ORDER_CANCELLED' (processed created_at ASC)"
          - "each touched ComponentSupply recomputes reserved_units and available_units, returns EXHAUSTED -> ACTIVE when available_units > 0, and version += 1; the conserved identity effective_allocatable_units == available_units + reserved_units + committed_units holds again"
          - "allocated_units = 0; allocation_status = UNALLOCATED"

  - entity: AllocationLine
    initial_state: RESERVED
    terminal_states: [COMMITTED, REVOKED, RELEASED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "system - the owning DistributorOrder ships"
        actor: system
        preconditions:
          - "status == RESERVED and the owning order is transitioning STAGED -> SHIPPED"
        side_effects:
          - "status = COMMITTED; version += 1; the drawn ComponentSupply moves units from reserved_units to committed_units"
      - from: RESERVED
        to: REVOKED
        trigger: "system - a supply derate or supply closure cascade"
        actor: system
        preconditions:
          - "status == RESERVED and the drawn supply's available_units is negative after the derate"
        side_effects:
          - "status = REVOKED; closed_reason set; version += 1; the drawn ComponentSupply recomputes reserved_units and available_units"
          - "every sibling AllocationLine of the same DistributorOrder with status == RESERVED and a different component_type is also REVOKED, because a unit needs one compressor and one control board to remain a kit"
      - from: RESERVED
        to: RELEASED
        trigger: "system - the owning DistributorOrder is cancelled or its platform is retired"
        actor: system
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "status = RELEASED; closed_reason set; version += 1; the drawn ComponentSupply recomputes reserved_units and available_units"

  - entity: BuildOrder
    initial_state: DRAFT
    terminal_states: [RELEASED_TO_STOCK, SCRAPPED, CANCELLED]
    transitions:
      - from: CREATE
        to: DRAFT
        trigger: "POST /plant/build-orders"
        actor: ProductionPlanner
        preconditions:
          - "platform_id resolves to an existing ProductPlatform, else ERR_PLATFORM_NOT_FOUND"
          - "platform.status == RELEASED, else ERR_INVALID_PLATFORM_STATE"
          - "platform.warranty_posture != DESIGN_CHANGE_REQUIRED, else ERR_WARRANTY_POSTURE_BLOCKED"
          - "logical clock < the platform program manufacture_cutoff_utc, else ERR_MANUFACTURE_WINDOW_CLOSED"
        side_effects:
          - "status = DRAFT; rework_count = 0; charge_grams = 0; latest_leak_verdict = null; latest_run_verdict = null"
      - from: DRAFT
        to: COIL_FAB
        trigger: "POST /plant/build-orders/{id}/start-coil-fab"
        actor: ProductionTechnician
        preconditions:
          - "status IN {DRAFT, REWORK}, else ERR_BUILD_STAGE_INVALID"
          - "platform.status == RELEASED, else ERR_INVALID_PLATFORM_STATE"
        side_effects:
          - "status = COIL_FAB; version += 1"
      - from: REWORK
        to: COIL_FAB
        trigger: "POST /plant/build-orders/{id}/start-coil-fab"
        actor: ProductionTechnician
        preconditions:
          - "status == REWORK, else ERR_BUILD_STAGE_INVALID"
          - "platform.status == RELEASED, else ERR_INVALID_PLATFORM_STATE"
        side_effects:
          - "status = COIL_FAB; version += 1"
        note: "Closes the rework cycle COIL_FAB -> BRAZED -> REWORK -> COIL_FAB."
      - from: COIL_FAB
        to: BRAZED
        trigger: "POST /plant/build-orders/{id}/complete-brazing"
        actor: ProductionTechnician
        preconditions:
          - "status == COIL_FAB, else ERR_BUILD_STAGE_INVALID"
        side_effects:
          - "status = BRAZED; version += 1"
      - from: BRAZED
        to: LEAK_PASSED
        trigger: "system - POST /plant/leak-tests records a LeakTest whose verdict == PASS"
        actor: system
        preconditions:
          - "status == BRAZED"
          - "the new LeakTest verdict == PASS"
        side_effects:
          - "status = LEAK_PASSED; latest_leak_verdict = PASS; version += 1"
      - from: BRAZED
        to: REWORK
        trigger: "system - POST /plant/leak-tests records a LeakTest whose verdict == FAIL and rework_count < 2 before the increment"
        actor: system
        preconditions:
          - "status == BRAZED"
          - "the new LeakTest verdict == FAIL"
          - "rework_count + 1 <= 2"
        side_effects:
          - "rework_count += 1; status = REWORK; latest_leak_verdict = FAIL; version += 1"
      - from: BRAZED
        to: SCRAPPED
        trigger: "system - POST /plant/leak-tests records a third failing verdict on the lot"
        actor: system
        preconditions:
          - "status == BRAZED"
          - "the new LeakTest verdict == FAIL"
          - "rework_count + 1 > 2"
        side_effects:
          - "rework_count += 1; status = SCRAPPED; closed_reason = 'REWORK_LIMIT_EXCEEDED'; latest_leak_verdict = FAIL; version += 1"
          - "every WarehouseReservation of this lot with status == ACTIVE becomes RELEASED with release_reason = 'BUILD_SCRAPPED', and Warehouse.pallets_reserved_current is recomputed for each touched warehouse"
      - from: LEAK_PASSED
        to: CHARGED
        trigger: "POST /plant/build-orders/{id}/charge"
        actor: ProductionTechnician
        preconditions:
          - "status == LEAK_PASSED, else ERR_BUILD_STAGE_INVALID"
          - "when the platform program flammability_class == A2L then charge_grams <= platform.max_charge_grams, else ERR_FLAMMABLE_CHARGE_LIMIT_EXCEEDED"
          - "logical clock < the platform program manufacture_cutoff_utc, else ERR_MANUFACTURE_WINDOW_CLOSED"
        side_effects:
          - "status = CHARGED; charge_grams = request charge_grams; version += 1"
      - from: CHARGED
        to: RUN_PASSED
        trigger: "system - POST /plant/run-tests records a RunTest whose verdict == PASS"
        actor: system
        preconditions:
          - "status == CHARGED"
          - "the new RunTest verdict == PASS"
        side_effects:
          - "status = RUN_PASSED; latest_run_verdict = PASS; version += 1"
      - from: CHARGED
        to: REWORK
        trigger: "system - POST /plant/run-tests records a RunTest whose verdict == FAIL and rework_count < 2 before the increment"
        actor: system
        preconditions:
          - "status == CHARGED"
          - "the new RunTest verdict == FAIL"
          - "rework_count + 1 <= 2"
        side_effects:
          - "rework_count += 1; status = REWORK; latest_run_verdict = FAIL; charge_grams = 0 because the charge is recovered before rework; version += 1"
      - from: CHARGED
        to: SCRAPPED
        trigger: "system - POST /plant/run-tests records a failing verdict that exhausts the rework budget"
        actor: system
        preconditions:
          - "status == CHARGED"
          - "the new RunTest verdict == FAIL"
          - "rework_count + 1 > 2"
        side_effects:
          - "rework_count += 1; status = SCRAPPED; closed_reason = 'REWORK_LIMIT_EXCEEDED'; charge_grams = 0; version += 1"
          - "every WarehouseReservation of this lot with status == ACTIVE becomes RELEASED with release_reason = 'BUILD_SCRAPPED', and Warehouse.pallets_reserved_current is recomputed"
      - from: RUN_PASSED
        to: RELEASED_TO_STOCK
        trigger: "POST /plant/build-orders/{id}/release-to-stock"
        actor: ProductionPlanner
        preconditions:
          - "status == RUN_PASSED, else ERR_BUILD_STAGE_INVALID"
          - "platform.status IN {RELEASED, RESTRICTED}, else ERR_INVALID_PLATFORM_STATE"
          - "when is_preseason == true, at least one WarehouseReservation of this lot has status == ACTIVE and start_date <= logical-clock date < end_date, else ERR_NO_WAREHOUSE_RESERVATION"
        side_effects:
          - "status = RELEASED_TO_STOCK; released_to_stock_at = logical clock; version += 1"
          - "ProductPlatform.units_built_released recomputed; ProductPlatform.rolling_claim_rate_pct and warranty_posture recomputed; ProductPlatform.version += 1"
      - from: DRAFT
        to: HOLD_REGULATORY
        trigger: "system - HOP 2 of the RefrigerantProgram ACTIVE -> SELL_THROUGH cascade"
        actor: system
        preconditions:
          - "status IN {DRAFT, COIL_FAB, BRAZED, REWORK, LEAK_PASSED, CHARGED, RUN_PASSED} and the platform just became RESTRICTED"
        side_effects:
          - "status = HOLD_REGULATORY; hold_reason = 'REFRIGERANT_SELL_THROUGH'; version += 1"
          - "caused by the hold: every ACTIVE WarehouseReservation of this lot becomes RELEASED and each touched Warehouse recomputes pallets_reserved_current"
      - from: HOLD_REGULATORY
        to: CANCELLED
        trigger: "POST /plant/build-orders/{id}/cancel, or the ProductPlatform RETIRED cascade HOP 3"
        actor: ProductionPlanner
        preconditions:
          - "status IN {DRAFT, HOLD_REGULATORY}, else ERR_BUILD_STAGE_INVALID"
        side_effects:
          - "status = CANCELLED; closed_reason set from the request reason or 'PLATFORM_RETIRED'; version += 1"
          - "every ACTIVE WarehouseReservation of this lot becomes RELEASED with release_reason = 'BUILD_CANCELLED'; each touched Warehouse recomputes pallets_reserved_current"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /plant/build-orders/{id}/cancel"
        actor: ProductionPlanner
        preconditions:
          - "status == DRAFT, else ERR_BUILD_STAGE_INVALID"
        side_effects:
          - "identical to state_machines.BuildOrder.HOLD_REGULATORY_to_CANCELLED"

  - entity: WarehouseReservation
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: CREATE
        to: ACTIVE
        trigger: "POST /plant/warehouse-reservations"
        actor: ProductionPlanner
        preconditions:
          - "warehouse_id resolves to an existing Warehouse, else ERR_WAREHOUSE_NOT_FOUND"
          - "build_order_id resolves to an existing BuildOrder, else ERR_BUILD_ORDER_NOT_FOUND"
          - "end_date > start_date, else ERR_INVALID_INTERVAL"
          - "BuildOrder.is_preseason == true and BuildOrder.status NOT IN {RELEASED_TO_STOCK, SCRAPPED, CANCELLED, HOLD_REGULATORY}, else ERR_RESERVATION_NOT_ALLOWED_FOR_BUILD"
          - "the day-wise peak occupancy from calculations.warehouse_pallet_occupancy stays <= Warehouse.pallet_capacity, else ERR_WAREHOUSE_CAPACITY_EXCEEDED"
        side_effects:
          - "status = ACTIVE; Warehouse.pallets_reserved_current recomputed; Warehouse.version += 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /plant/warehouse-reservations/{id}/release, or a build hold, cancellation, or scrap cascade"
        actor: ProductionPlanner
        preconditions:
          - "status == ACTIVE, else ERR_RESERVATION_STATE_INVALID"
        side_effects:
          - "status = RELEASED; released_at = logical clock; release_reason set; version += 1"
          - "Warehouse.pallets_reserved_current recomputed; Warehouse.version += 1; the conserved identity pallets_reserved_current == sum of ACTIVE reservation pallet_units covering the clock date holds again"

  - entity: LeakTest
    initial_state: RECORDED
    terminal_states: [RECORDED]
    transitions:
      - from: CREATE
        to: RECORDED
        trigger: "POST /plant/leak-tests"
        actor: QualityTechnician
        preconditions:
          - "build_order_id resolves to an existing BuildOrder, else ERR_BUILD_ORDER_NOT_FOUND"
          - "BuildOrder.status == BRAZED, else ERR_BUILD_STAGE_INVALID"
          - "method == HELIUM_MASS_SPEC requires measured_leak_rate_g_per_year and forbids decay_kpa and hold_minutes; method == PRESSURE_DECAY requires decay_kpa and hold_minutes and forbids measured_leak_rate_g_per_year, else ERR_INVALID_REQUEST"
          - "when method == PRESSURE_DECAY then hold_minutes >= 15, else ERR_LEAK_TEST_HOLD_TOO_SHORT"
        side_effects:
          - "applied_limit and verdict computed per calculations.leak_test_verdict; performed_by_user_id = X-User-ID; performed_at = logical clock"
          - "the owning BuildOrder transitions BRAZED -> LEAK_PASSED, BRAZED -> REWORK, or BRAZED -> SCRAPPED depending on the verdict and rework_count"
        note: "Append-only record; common_fields is false so there is no version and no update endpoint."

  - entity: RunTest
    initial_state: RECORDED
    terminal_states: [RECORDED]
    transitions:
      - from: CREATE
        to: RECORDED
        trigger: "POST /plant/run-tests"
        actor: QualityTechnician
        preconditions:
          - "build_order_id resolves to an existing BuildOrder, else ERR_BUILD_ORDER_NOT_FOUND"
          - "test_cell_id resolves to an existing TestCell, else ERR_TEST_CELL_NOT_FOUND"
          - "BuildOrder.status == CHARGED, else ERR_BUILD_STAGE_INVALID"
          - "window_end_utc > window_start_utc, else ERR_INVALID_INTERVAL"
          - "X-User-ID != the performed_by_user_id of this lot's most recent LeakTest with verdict == PASS, else ERR_SEGREGATION_OF_DUTIES"
          - "the requested window respects the cell cooldown buffer against every existing RunTest on that cell, else ERR_TEST_CELL_WINDOW_CONFLICT"
        side_effects:
          - "corrected_capacity_btuh, capacity_ratio, efficiency_ratio, applied_capacity_tolerance, applied_efficiency_tolerance, and verdict computed per calculations.run_test_performance_verdict; performed_by_user_id = X-User-ID; performed_at = logical clock"
          - "the owning BuildOrder transitions CHARGED -> RUN_PASSED, CHARGED -> REWORK, or CHARGED -> SCRAPPED depending on the verdict and rework_count"

  - entity: WarrantyClaim
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: CREATE
        to: OPEN
        trigger: "POST /plant/warranty-claims"
        actor: WarrantyAnalyst
        preconditions:
          - "platform_id resolves to an existing ProductPlatform, else ERR_PLATFORM_NOT_FOUND"
          - "build_order_id, when supplied, resolves to an existing BuildOrder, else ERR_BUILD_ORDER_NOT_FOUND"
          - "component_type and supplier_lot_code are either both present or both absent, else ERR_INVALID_REQUEST"
        side_effects:
          - "status = OPEN; filed_by_user_id = X-User-ID; filed_at = logical clock"
          - "HOP 1 - ProductPlatform.rolling_claim_rate_pct and warranty_posture recomputed per calculations.platform_warranty_claim_rate and calculations.platform_warranty_posture; ProductPlatform.version += 1"
          - "HOP 2 - caused by warranty_posture becoming CAPA_REQUIRED or DESIGN_CHANGE_REQUIRED while this claim carries a non-null component_type whose supplier_lot_code matches a ComponentSupply row: a SupplierCorrectiveAction is created with status = OPEN citing this claim, every counted claim of the same platform, component_type, and supplier_lot_code moves OPEN -> LINKED_TO_CAPA, and the matched ComponentSupply transitions to DERATED with derate_pct from calculations.supply_derate_plan"
          - "HOP 3 - caused by the new effective_allocatable_units: AllocationLine rows on that supply with status == RESERVED are REVOKED in created_at DESC order until available_units >= 0, with their kit siblings"
          - "HOP 4 - caused by those revocations: each affected DistributorOrder recomputes allocated_units and regresses allocation_status to PARTIALLY_ALLOCATED or UNALLOCATED while its fulfillment_status stays untouched"
      - from: OPEN
        to: LINKED_TO_CAPA
        trigger: "system - a SupplierCorrectiveAction opens and cites this claim"
        actor: system
        preconditions:
          - "status == OPEN and the claim's platform_id, component_type, and supplier_lot_code match the new corrective action"
        side_effects:
          - "status = LINKED_TO_CAPA; version += 1"
      - from: LINKED_TO_CAPA
        to: CLOSED
        trigger: "system - the citing SupplierCorrectiveAction closes with resolution == EFFECTIVE"
        actor: system
        preconditions:
          - "status == LINKED_TO_CAPA"
        side_effects:
          - "status = CLOSED; version += 1; the claim leaves the claim-rate input set, so ProductPlatform.rolling_claim_rate_pct and warranty_posture are recomputed"

  - entity: SupplierCorrectiveAction
    initial_state: OPEN
    terminal_states: [CLOSED_EFFECTIVE, CLOSED_INEFFECTIVE]
    transitions:
      - from: CREATE
        to: OPEN
        trigger: "system - HOP 2 of the WarrantyClaim creation cascade"
        actor: system
        preconditions:
          - "the filing platform's warranty_posture is CAPA_REQUIRED or DESIGN_CHANGE_REQUIRED after the claim"
          - "the claim carries a non-null component_type and a supplier_lot_code matching exactly one ComponentSupply row with status IN {ACTIVE, EXHAUSTED} for the platform's part number, resolved per calculations.supply_derate_plan"
          - "no SupplierCorrectiveAction with status == OPEN already cites the same component_supply_id"
        side_effects:
          - "status = OPEN; trigger_claim_rate_pct, derate_pct, and cited_claim_count stamped; the target ComponentSupply transitions to DERATED"
      - from: OPEN
        to: CLOSED_EFFECTIVE
        trigger: "POST /plant/supplier-corrective-actions/{id}/close with resolution == EFFECTIVE"
        actor: ReliabilityEngineer
        preconditions:
          - "status == OPEN, else ERR_CORRECTIVE_ACTION_STATE_INVALID"
          - "X-User-ID != the filed_by_user_id of the cited WarrantyClaim, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "status = CLOSED_EFFECTIVE; resolution = EFFECTIVE; closed_by_user_id; closed_at; version += 1"
          - "the governed ComponentSupply transitions DERATED -> ACTIVE with derate_pct = 0 and effective_allocatable_units restored to total_allocatable_units"
          - "every cited WarrantyClaim with status == LINKED_TO_CAPA becomes CLOSED, which drops it out of the claim-rate input set; ProductPlatform.rolling_claim_rate_pct and warranty_posture recomputed; ProductPlatform.version += 1"
      - from: OPEN
        to: CLOSED_INEFFECTIVE
        trigger: "POST /plant/supplier-corrective-actions/{id}/close with resolution == INEFFECTIVE"
        actor: ReliabilityEngineer
        preconditions:
          - "status == OPEN, else ERR_CORRECTIVE_ACTION_STATE_INVALID"
          - "X-User-ID != the filed_by_user_id of the cited WarrantyClaim, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "status = CLOSED_INEFFECTIVE; resolution = INEFFECTIVE; closed_by_user_id; closed_at; version += 1"
          - "the governed ComponentSupply transitions DERATED -> CLOSED with derate_pct = 100 and effective_allocatable_units = 0; its RESERVED lines are REVOKED and the affected orders regress"
          - "cited WarrantyClaim rows stay LINKED_TO_CAPA, so the platform claim rate is unchanged and warranty_posture stays where it was"
        note: "Divergent branch: the EFFECTIVE resolution restores supply and closes claims; the INEFFECTIVE resolution kills the supply row and leaves the claims counted."

concurrency_rules:
  - rule_id: allocate-stale-component-supply
    parent_entity: ComponentSupply
    write_endpoint: "POST /plant/distributor-orders/{id}/allocate"
    occ_field: "expected_component_supply_version"
    description: |
      An allocation draw carries the version of the primary compressor supply the planner last
      observed - the eligible COMPRESSOR ComponentSupply row for the platform part number and the
      order delivery month with the earliest created_at. When that row's version has advanced since
      the planner read it, the draw is rejected as stale: the pool the planner priced the grant
      against no longer exists in that shape, because a previously granted draw has already moved
      units out of available_units.
    error_id: ERR_STALE_SUPPLY_VERSION
    http_status: 412

  - rule_id: certification-create-stale-platform
    parent_entity: ProductPlatform
    write_endpoint: "POST /plant/certification-records"
    occ_field: "expected_platform_version"
    description: |
      Creating a CertificationRecord supersedes any DRAFT, SUBMITTED, or REJECTED record for the same
      platform and region, so the write legitimately destroys another writer's in-flight filing. The
      request therefore carries the platform version the engineer last observed; a request whose
      expected_platform_version is behind the stored ProductPlatform.version is rejected, because the
      platform has since been re-certified, restricted, or re-filed against and the engineer's view of
      which records exist is stale.
    error_id: ERR_STALE_PLATFORM_VERSION
    http_status: 412

calculations:
  - id: leak_test_verdict
    entity: LeakTest
    output_fields: [applied_limit, verdict]
    algorithm_type: threshold
    trigger: "POST /plant/leak-tests"
    variants:
      HELIUM_MASS_SPEC: "applied_limit = round(HELIUM_BASE_LIMIT_G_PER_YEAR * class_factor, 3); verdict = PASS when measured_leak_rate_g_per_year <= applied_limit, else FAIL. decay_kpa and hold_minutes are rejected by validation rule leak-method-payload-shape."
      PRESSURE_DECAY: "applied_limit = round(DECAY_ALLOWANCE_KPA_PER_15MIN * (hold_minutes / 15) * class_factor, 2); verdict = PASS when decay_kpa <= applied_limit, else FAIL. measured_leak_rate_g_per_year is rejected by validation rule leak-method-payload-shape."
    variant_selector: "LeakTest.method, supplied on the request; there is no default"
    formula: |
      class_factor = A2L_TIGHTENING_FACTOR when the BuildOrder platform's RefrigerantProgram.flammability_class == 'A2L', otherwise 1.000.
      The two variants share the class_factor and the comparison direction (measured <= applied_limit)
      but consume different measurement fields, different constants, and different units, so the
      applied_limit of one variant is never a valid limit for the other.
    constants:
      HELIUM_BASE_LIMIT_G_PER_YEAR: 3.000
      DECAY_ALLOWANCE_KPA_PER_15MIN: 2.00
      A2L_TIGHTENING_FACTOR: 0.500
      MIN_PRESSURE_DECAY_HOLD_MINUTES: 15
    input_set: "The single LeakTest request payload plus the platform's RefrigerantProgram.flammability_class."
    precision: "applied_limit is 3 decimal places for HELIUM_MASS_SPEC and 2 decimal places for PRESSURE_DECAY; ROUND_HALF_UP; comparisons use the rounded applied_limit so that an exactly-at-limit measurement passes."

  - id: run_test_performance_verdict
    entity: RunTest
    output_fields: [corrected_capacity_btuh, capacity_ratio, efficiency_ratio, applied_capacity_tolerance, applied_efficiency_tolerance, verdict]
    algorithm_type: threshold
    trigger: "POST /plant/run-tests"
    formula: |
      Step 1 - ambient correction to the 35.0 C rating point:
        corrected_capacity_btuh = round(measured_capacity_btuh * (1 + AMBIENT_COEFFICIENT_PER_C * (measured_ambient_c - RATING_AMBIENT_C)), 0)
      Step 2 - performance ratios against the platform's published ratings:
        capacity_ratio   = round(corrected_capacity_btuh / platform.rated_capacity_btuh, 4)
        measured_eer     = corrected_capacity_btuh / measured_power_w
        efficiency_ratio = round(measured_eer / platform.rated_eer, 4)
      Step 3 - tolerance selection from the two-dimensional table below, keyed by
      (platform.efficiency_tier, refrigerant program flammability_class). The table is not separable
      into a tier term plus a class term: the A2L column is relaxed by 0.01 at the STANDARD and HIGH
      tiers but is identical to the A1 column at the PREMIUM tier, where a flammable charge earns no
      allowance at all. Both tolerances must be read from the same cell.
      Step 4 - verdict = PASS when capacity_ratio >= applied_capacity_tolerance AND
      efficiency_ratio >= applied_efficiency_tolerance, otherwise FAIL.
    constants:
      RATING_AMBIENT_C: 35.0
      AMBIENT_COEFFICIENT_PER_C: 0.0040
      CAPACITY_TOLERANCE_TABLE:
        STANDARD: {A1: 0.9500, A2L: 0.9400}
        HIGH: {A1: 0.9700, A2L: 0.9600}
        PREMIUM: {A1: 0.9800, A2L: 0.9800}
      EFFICIENCY_TOLERANCE_TABLE:
        STANDARD: {A1: 0.9300, A2L: 0.9200}
        HIGH: {A1: 0.9500, A2L: 0.9400}
        PREMIUM: {A1: 0.9600, A2L: 0.9600}
    input_set: "The single RunTest request payload, the platform's rated_capacity_btuh / rated_eer / efficiency_tier, and the program's flammability_class."
    precision: "corrected_capacity_btuh is a whole BTU/h integer, ROUND_HALF_UP; both ratios carry exactly 4 decimal places, ROUND_HALF_UP; the rounded ratio is what is compared, so a ratio that rounds up to the tolerance passes."

  - id: allocation_fill_plan
    entity: DistributorOrder
    output_fields: [granted_units, allocation_lines]
    algorithm_type: waterfall_allocation
    trigger: "POST /plant/distributor-orders/{id}/allocate"
    variants:
      PRIORITY_WATERFALL: "granted_units = min(remaining_need, kit_capacity). The order in front takes everything it can carry and later orders live on the remainder."
      DEMAND_PRORATA: "fair_share = floor(kit_capacity * remaining_need / total_open_demand); granted_units = min(remaining_need, fair_share). Every open order of the same platform and delivery month is entitled to a demand-weighted slice of the pool, so an order in front cannot drain it."
    variant_selector: "allocation_policy of the primary compressor supply row - the eligible COMPRESSOR ComponentSupply for the platform's compressor_part_number and the order's requested_delivery_month with the earliest created_at. That same row is the OCC parent for expected_component_supply_version."
    formula: |
      eligible_compressors  = ComponentSupply rows where component_type == 'COMPRESSOR' AND part_number == platform.compressor_part_number AND supply_month == order.requested_delivery_month AND status IN {ACTIVE, DERATED} AND available_units >= 1
      eligible_boards       = the same filter with component_type == 'CONTROL_BOARD' AND part_number == platform.control_board_part_number
      compressor_pool       = sum(available_units of eligible_compressors)
      board_pool            = sum(available_units of eligible_boards)
      kit_capacity          = min(compressor_pool, board_pool)          # one unit consumes one compressor and one control board
      remaining_need        = order.requested_units - order.allocated_units
      total_open_demand     = sum over every DistributorOrder D where D.platform_id == order.platform_id AND D.requested_delivery_month == order.requested_delivery_month AND D.fulfillment_status == 'PENDING' AND D.allocation_status != 'FULLY_ALLOCATED' of (D.requested_units - D.allocated_units); the order being allocated is included
      granted_units         = per the selected variant above
      Draw order within each component_type: eligible rows are consumed in ascending (supply_month,
      created_at) order, taking min(available_units, units still to draw) from each and emitting one
      AllocationLine per drawn row, so a grant that spans two supplier lots produces two lines per
      component_type.
    constants:
      MIN_GRANT_UNITS: 1
    input_set: "Eligible ComponentSupply rows and every PENDING, not-fully-allocated DistributorOrder for the same platform and delivery month."
    precision: "Whole units only; the pro-rata fair share truncates toward zero (floor), so a pro-rata pass may leave units undrawn in the pool rather than over-granting."

  - id: supply_effective_capacity
    entity: ComponentSupply
    output_fields: [effective_allocatable_units, available_units]
    algorithm_type: aggregation
    trigger: "Every write that touches derate_pct, reserved_units, or committed_units."
    formula: |
      effective_allocatable_units = floor(total_allocatable_units * (100 - derate_pct) / 100)
      reserved_units  = sum(units of AllocationLine rows on this supply with status == 'RESERVED')
      committed_units = sum(units of AllocationLine rows on this supply with status == 'COMMITTED')
      available_units = effective_allocatable_units - reserved_units - committed_units
      Conserved identity, restored after every allocate, revoke, release, cancel, ship, derate, and
      derate-restore: effective_allocatable_units == available_units + reserved_units + committed_units.
      A derate that pushes available_units below zero is not stored as a negative balance; the derate
      cascade revokes RESERVED lines newest-first until the identity holds with available_units >= 0.
    constants:
      DERATE_PCT_ALLOWED: [0, 25, 50, 100]
    input_set: "AllocationLine rows of this ComponentSupply with status IN {RESERVED, COMMITTED}; REVOKED and RELEASED lines are excluded."
    precision: "Whole units; the effective capacity floors, so a 25 percent derate of 101 units yields 75 rather than 75.75."

  - id: warehouse_pallet_occupancy
    entity: Warehouse
    output_fields: [pallets_reserved_current, peak_occupancy_units]
    algorithm_type: interval_merge
    trigger: "POST /plant/warehouse-reservations, POST /plant/warehouse-reservations/{id}/release, GET /plant/warehouses/{id}/occupancy"
    formula: |
      Reservation intervals are half-open on whole days: [start_date, end_date). A reservation
      occupies day D when start_date <= D < end_date, so a reservation ending on the day another
      begins does not overlap it and the two may share the last pallet of capacity.
      occupancy(D) = sum(pallet_units of WarehouseReservation rows in this warehouse with
                         status == 'ACTIVE' AND start_date <= D < end_date)
      peak_occupancy_units for a candidate reservation = max over every day D in the candidate
      interval of (occupancy(D) + candidate.pallet_units). Acceptance requires
      peak_occupancy_units <= Warehouse.pallet_capacity.
      pallets_reserved_current = occupancy(the logical clock's UTC date).
    constants:
      DAY_BOUNDARY: "UTC calendar day"
    input_set: "WarehouseReservation rows of this Warehouse with status == 'ACTIVE'; RELEASED reservations are excluded from occupancy on every day, including days already elapsed."
    precision: "Whole pallet units; the comparison against pallet_capacity is inclusive, so peak occupancy exactly equal to capacity is accepted."

  - id: preseason_carrying_cost
    entity: Warehouse
    output_fields: [carrying_cost_cents, pallet_week_total]
    algorithm_type: aggregation
    trigger: "GET /plant/warehouses/{id}/carrying-cost"
    variants:
      PER_RESERVATION: "carrying_cost_cents = sum over reservations of round(pallet_units * (occupied_days / DAYS_PER_WEEK) * CARRYING_RATE_CENTS_PER_PALLET_WEEK, 0) - each invoice line is rounded to the cent before the lines are added."
      POOLED: "carrying_cost_cents = round(sum over reservations of (pallet_units * (occupied_days / DAYS_PER_WEEK)) * CARRYING_RATE_CENTS_PER_PALLET_WEEK, 0) - the pallet-weeks are pooled first and the single pooled figure is rounded once."
    variant_selector: "The basis query parameter on GET /plant/warehouses/{id}/carrying-cost; PER_RESERVATION is the default because that is what the plant bills against."
    formula: |
      occupied_days for a reservation = the number of whole days in the intersection of
      [start_date, end_date) with the requested [window_start, window_end) window.
      pallet_week_total = round(sum(pallet_units * occupied_days / DAYS_PER_WEEK), 4), reported under
      both bases and identical under both.
      The two bases can differ by a cent on the same reservation set whenever the individual line
      remainders and the pooled remainder round in different directions; the divergence is a genuine
      accounting difference, not a tolerance.
    constants:
      CARRYING_RATE_CENTS_PER_PALLET_WEEK: 1165
      DAYS_PER_WEEK: 7
    input_set: "WarehouseReservation rows of this Warehouse with status == 'ACTIVE' whose interval intersects the requested window, ordered by created_at ASC."
    precision: "carrying_cost_cents is a whole number of cents, ROUND_HALF_UP; pallet_week_total carries 4 decimal places; the rounding boundary is the point of the two bases."

  - id: platform_warranty_claim_rate
    entity: ProductPlatform
    output_fields: [rolling_claim_rate_pct, counted_claim_count, denominator_units]
    algorithm_type: aggregation
    trigger: "POST /plant/warranty-claims, corrective-action close, build release-to-stock, order ship, GET /plant/product-platforms/{id}/warranty-analysis"
    variants:
      BUILT_BASIS: "denominator_units = max(units_built_released, MIN_DENOMINATOR_UNITS); this is the stored basis - the value written to ProductPlatform.rolling_claim_rate_pct and the value the posture and derate rules read."
      SHIPPED_BASIS: "denominator_units = max(units_shipped_total, MIN_DENOMINATOR_UNITS); a read-only cohort view for the reliability team, never stored on the platform."
    variant_selector: "The basis query parameter on GET /plant/product-platforms/{id}/warranty-analysis; every write path uses BUILT_BASIS unconditionally."
    formula: |
      counted_claim_count = count(WarrantyClaim rows for this platform with status IN {OPEN, LINKED_TO_CAPA})
      rolling_claim_rate_pct = round(100 * counted_claim_count / denominator_units, 2)
      A claim that reaches CLOSED leaves the input set, which is why a corrective action closed as
      EFFECTIVE lowers the rate while one closed as INEFFECTIVE leaves it untouched.
    constants:
      MIN_DENOMINATOR_UNITS: 1
    input_set: "WarrantyClaim rows of this platform with status IN {OPEN, LINKED_TO_CAPA}; CLOSED claims are excluded."
    precision: "2 decimal places, ROUND_HALF_UP; the threshold comparisons in platform_warranty_posture read this rounded value, so a raw 4.995 percent rounds to 5.00 and does trip the CAPA threshold."

  - id: platform_warranty_posture
    entity: ProductPlatform
    output_fields: [warranty_posture]
    algorithm_type: threshold
    trigger: "Every recomputation of rolling_claim_rate_pct."
    formula: |
      Gate first: when units_built_released < MIN_UNITS_FOR_POSTURE or
      counted_claim_count < MIN_CLAIMS_FOR_POSTURE then warranty_posture = OK regardless of rate -
      a two-claim rate of 40 percent on five units is noise, not a signal.
      Otherwise, evaluated top down:
        rolling_claim_rate_pct >= DESIGN_CHANGE_THRESHOLD_PCT -> DESIGN_CHANGE_REQUIRED
        rolling_claim_rate_pct >= CAPA_THRESHOLD_PCT          -> CAPA_REQUIRED
        else                                                  -> OK
      Both thresholds are inclusive. DESIGN_CHANGE_REQUIRED blocks new BuildOrder creation for the
      platform; CAPA_REQUIRED does not block builds but does arm the supplier corrective-action
      cascade.
    constants:
      CAPA_THRESHOLD_PCT: 5.00
      DESIGN_CHANGE_THRESHOLD_PCT: 10.00
      MIN_UNITS_FOR_POSTURE: 20
      MIN_CLAIMS_FOR_POSTURE: 3
    input_set: "The platform's own rolling_claim_rate_pct, counted_claim_count, and units_built_released."
    precision: "Comparisons are inclusive against the 2-decimal rate; a rate of exactly 5.00 is CAPA_REQUIRED and a rate of 4.99 is OK."

  - id: supply_derate_plan
    entity: SupplierCorrectiveAction
    output_fields: [derate_pct, target_component_supply_id, cited_claim_count]
    algorithm_type: threshold
    trigger: "HOP 2 of the WarrantyClaim creation cascade"
    formula: |
      Target resolution: the ComponentSupply row whose component_type == claim.component_type AND
      supplier_lot_code == claim.supplier_lot_code AND part_number == the platform's part number for
      that component_type AND status IN {ACTIVE, EXHAUSTED}, taking the earliest created_at when more
      than one month of that lot is on hand. When no row matches, no corrective action is created and
      the claim stays OPEN - the platform posture still changes.
      cited_claim_count = count(WarrantyClaim rows of the same platform, component_type, and
      supplier_lot_code with status IN {OPEN, LINKED_TO_CAPA}).
      derate_pct is read from the table below, keyed by (component_type, rate band of the platform's
      rolling_claim_rate_pct). A compressor is a long-lead, single-source part, so a severe rate
      stops the lot outright; a control board is second-sourced, so the worst case only halves it.
      The table is not a compressor factor times a band factor - the CONTROL_BOARD column is flat at
      25 across the two lower bands and the COMPRESSOR column is not.
    constants:
      DERATE_TABLE:
        COMPRESSOR: {BAND_5_TO_7_49: 25, BAND_7_5_TO_9_99: 50, BAND_10_PLUS: 100}
        CONTROL_BOARD: {BAND_5_TO_7_49: 25, BAND_7_5_TO_9_99: 25, BAND_10_PLUS: 50}
      BAND_5_TO_7_49: "5.00 <= rolling_claim_rate_pct < 7.50"
      BAND_7_5_TO_9_99: "7.50 <= rolling_claim_rate_pct < 10.00"
      BAND_10_PLUS: "rolling_claim_rate_pct >= 10.00"
    input_set: "The filing claim, its sibling claims on the same platform / component_type / supplier_lot_code, and the candidate ComponentSupply rows."
    precision: "Band edges are inclusive at the bottom and exclusive at the top against the 2-decimal rate, so exactly 7.50 lands in BAND_7_5_TO_9_99."

  - id: platform_regional_salability
    entity: ProductPlatform
    output_fields: [blocked_region_codes, salable_region_count]
    algorithm_type: constraint_propagation
    trigger: "Platform release and retire, certification create / submit / decide / withdraw, refrigerant program sell-through and expiry."
    formula: |
      For every RegionalStandard S with status == 'ACTIVE', the region S.region_code is blocked for
      this platform when any of the following holds:
        (1) no CertificationRecord for (this platform, S.region_code) has status == 'CERTIFIED'
        (2) S.prohibits_flammable_refrigerant == true AND the platform program's flammability_class == 'A2L'
        (3) platform.rated_seer2 < the S minimum for platform.efficiency_tier, read from
            min_seer2_standard / min_seer2_high / min_seer2_premium
        (4) platform.status == 'RETIRED'
      blocked_region_codes = the qualifying region codes sorted ascending; a region blocked by more
      than one condition appears exactly once.
      salable_region_count = count(ACTIVE RegionalStandard rows) - len(blocked_region_codes).
      The field is a propagated derivation, not a snapshot: a certification decision three entities
      away rewrites it, and it is recomputed - never incrementally patched - on every trigger above.
    constants:
      TIER_MINIMUM_FIELD:
        STANDARD: min_seer2_standard
        HIGH: min_seer2_high
        PREMIUM: min_seer2_premium
    input_set: "ACTIVE RegionalStandard rows, this platform's CertificationRecord rows, the platform's rated_seer2 / efficiency_tier / status, and the program's flammability_class."
    precision: "SEER2 comparisons are made at 2 decimal places; rated_seer2 exactly equal to the regional minimum satisfies condition (3) and does not block."

  - id: test_cell_window_eligibility
    entity: RunTest
    output_fields: [conflict_found, conflicting_run_test_id]
    algorithm_type: interval_merge
    trigger: "POST /plant/run-tests"
    formula: |
      A candidate window [window_start_utc, window_end_utc) conflicts with an existing RunTest R on
      the same test_cell_id when, with buffer = TestCell.cooldown_minutes:
        candidate.window_start_utc < R.window_end_utc + buffer
        AND R.window_start_utc < candidate.window_end_utc + buffer
      The buffer is applied to both sides, so back-to-back windows separated by exactly
      cooldown_minutes are accepted and windows separated by cooldown_minutes minus one minute are
      refused. Windows are half-open, so a candidate starting exactly at an existing window's end is
      still refused unless the cooldown gap is satisfied.
      conflicting_run_test_id = the earliest-created conflicting RunTest, reported in the error detail.
    constants:
      DEFAULT_COOLDOWN_MINUTES: 30
    input_set: "Every RunTest already recorded against the same TestCell, regardless of verdict; a FAIL result still occupied the cell."
    precision: "Whole minutes; the comparison is strict (<), which is what makes an exact cooldown-length gap legal."

validations:
  - rule_id: role-authorization
    priority: 10
    category: authorization
    condition: "The X-Role header is absent, unrecognized, or not listed as permitted for the endpoint."
    error_id: ERR_UNAUTHORIZED
    applies_to: "every endpoint"
    note: "Evaluated before the request body is inspected, so an unauthorized caller with a malformed body still receives ERR_UNAUTHORIZED."

  - rule_id: request-schema-shape
    priority: 20
    category: schema
    condition: "A required input field is missing, an enum value is outside its declared set, a numeric field is non-numeric or negative where a positive value is required, or a timestamp is not RFC 3339."
    error_id: ERR_INVALID_REQUEST
    applies_to: "every write endpoint"

  - rule_id: leak-method-payload-shape
    priority: 20
    category: schema
    condition: "method == HELIUM_MASS_SPEC and measured_leak_rate_g_per_year is absent or decay_kpa / hold_minutes are present; or method == PRESSURE_DECAY and decay_kpa or hold_minutes is absent or measured_leak_rate_g_per_year is present."
    error_id: ERR_INVALID_REQUEST
    applies_to: "POST /plant/leak-tests"
    note: "The variant selector decides which measurement fields are legal; a payload carrying both measurement styles is refused rather than silently ignoring one."

  - rule_id: claim-component-pair-shape
    priority: 20
    category: schema
    condition: "Exactly one of component_type and supplier_lot_code is present on a warranty claim."
    error_id: ERR_INVALID_REQUEST
    applies_to: "POST /plant/warranty-claims"

  - rule_id: interval-order
    priority: 20
    category: temporal
    condition: "end_date <= start_date on a warehouse reservation, or window_end_utc <= window_start_utc on a run test."
    error_id: ERR_INVALID_INTERVAL
    applies_to: "POST /plant/warehouse-reservations, POST /plant/run-tests"

  - rule_id: referenced-entity-exists
    priority: 30
    category: referential_integrity
    condition: "A path id or a foreign key in the payload does not resolve to a stored row."
    error_id: "ERR_PLATFORM_NOT_FOUND, ERR_REFRIGERANT_PROGRAM_NOT_FOUND, ERR_REGIONAL_STANDARD_NOT_FOUND, ERR_CERTIFICATION_NOT_FOUND, ERR_COMPONENT_SUPPLY_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_BUILD_ORDER_NOT_FOUND, ERR_WAREHOUSE_NOT_FOUND, ERR_RESERVATION_NOT_FOUND, ERR_TEST_CELL_NOT_FOUND, ERR_WARRANTY_CLAIM_NOT_FOUND, or ERR_CORRECTIVE_ACTION_NOT_FOUND as appropriate"
    applies_to: "every endpoint carrying an id"

  - rule_id: model-code-unique
    priority: 30
    category: uniqueness
    condition: "model_code duplicates an existing ProductPlatform.model_code."
    error_id: ERR_INVALID_REQUEST
    applies_to: "POST /plant/product-platforms"

  - rule_id: duplicate-active-certification
    priority: 30
    category: uniqueness
    condition: "A CertificationRecord with status == CERTIFIED already exists for the same platform_id and region_code."
    error_id: ERR_DUPLICATE_CERTIFICATION
    applies_to: "POST /plant/certification-records"

  - rule_id: supply-stale-version
    priority: 40
    category: concurrency
    condition: "expected_component_supply_version does not equal the version of the primary compressor supply row resolved for the order."
    error_id: ERR_STALE_SUPPLY_VERSION
    applies_to: "POST /plant/distributor-orders/{id}/allocate"
    note: "Priority 40 places the concurrency check ahead of every business gate on this endpoint; see priority-pair rule allocate-stale-beats-region."

  - rule_id: platform-stale-version
    priority: 40
    category: concurrency
    condition: "expected_platform_version does not equal the stored ProductPlatform.version."
    error_id: ERR_STALE_PLATFORM_VERSION
    applies_to: "POST /plant/certification-records"

  - rule_id: platform-state-gate
    priority: 50
    category: state
    condition: "The platform is not in a state the requested operation admits - editing the design record from a state other than DRAFT, submitting a review from a state other than DRAFT, releasing from a state other than ENG_REVIEW, creating a build order against a platform that is not RELEASED, creating an order or certification against a platform outside {RELEASED, RESTRICTED}, or retiring a platform outside {RELEASED, RESTRICTED}."
    error_id: ERR_INVALID_PLATFORM_STATE
    applies_to: "PATCH /plant/product-platforms/{id}, POST /plant/product-platforms/{id}/submit-engineering-review, /release, /retire, POST /plant/build-orders, POST /plant/distributor-orders, POST /plant/certification-records, POST /plant/certification-records/{id}/submit"

  - rule_id: program-state-gate
    priority: 50
    category: state
    condition: "The governing RefrigerantProgram is not in the state the operation requires - creating or advancing a platform against a program that is not ACTIVE, entering sell-through from a state other than ACTIVE, or expiring from a state other than SELL_THROUGH."
    error_id: ERR_PROGRAM_STATE_INVALID
    applies_to: "POST /plant/product-platforms, /submit-engineering-review, /release, POST /plant/refrigerant-programs/{id}/enter-sell-through, /expire"

  - rule_id: certification-state-gate
    priority: 50
    category: state
    condition: "Submitting a certification record that is not DRAFT, or deciding one that is not SUBMITTED."
    error_id: ERR_CERTIFICATION_STATE_INVALID
    applies_to: "POST /plant/certification-records/{id}/submit, /decide"

  - rule_id: build-stage-gate
    priority: 50
    category: state
    condition: "The build order is not at the stage the operation requires - coil fab from outside {DRAFT, REWORK}, brazing from outside COIL_FAB, a leak test from outside BRAZED, charging from outside LEAK_PASSED, a run test from outside CHARGED, release to stock from outside RUN_PASSED, or cancellation from outside {DRAFT, HOLD_REGULATORY}."
    error_id: ERR_BUILD_STAGE_INVALID
    applies_to: "POST /plant/build-orders/{id}/start-coil-fab, /complete-brazing, /charge, /release-to-stock, /cancel, POST /plant/leak-tests, POST /plant/run-tests"
    note: "Priority 50 places the stage gate ahead of the flammable-charge safety limit; see priority-pair rule charge-stage-beats-safety-limit."

  - rule_id: order-state-gate
    priority: 50
    category: state
    condition: "Allocating an order whose fulfillment_status is not PENDING or whose allocation_status is already FULLY_ALLOCATED, staging an order that is not PENDING or not FULLY_ALLOCATED, shipping an order that is not STAGED, or cancelling an order that is not PENDING."
    error_id: ERR_ORDER_STATE_INVALID
    applies_to: "POST /plant/distributor-orders/{id}/allocate, /stage, /ship, /cancel"

  - rule_id: reservation-state-gate
    priority: 50
    category: state
    condition: "Releasing a warehouse reservation whose status is not ACTIVE."
    error_id: ERR_RESERVATION_STATE_INVALID
    applies_to: "POST /plant/warehouse-reservations/{id}/release"

  - rule_id: corrective-action-state-gate
    priority: 50
    category: state
    condition: "Closing a supplier corrective action whose status is not OPEN."
    error_id: ERR_CORRECTIVE_ACTION_STATE_INVALID
    applies_to: "POST /plant/supplier-corrective-actions/{id}/close"

  - rule_id: reservation-build-eligibility
    priority: 50
    category: cross_entity
    condition: "The referenced BuildOrder has is_preseason == false, or its status is one of {LEAK_PASSED, CHARGED, RUN_PASSED, RELEASED_TO_STOCK, SCRAPPED, CANCELLED, HOLD_REGULATORY}."
    error_id: ERR_RESERVATION_NOT_ALLOWED_FOR_BUILD
    applies_to: "POST /plant/warehouse-reservations"

  - rule_id: segregation-of-duties
    priority: 60
    category: authorization
    condition: "The acting X-User-ID is the same person who performed the preceding step - releasing or returning a platform the caller submitted, deciding a certification the caller submitted, recording a run test on a lot whose passing leak test the caller performed, or closing a corrective action whose cited claim the caller filed."
    error_id: ERR_SEGREGATION_OF_DUTIES
    applies_to: "POST /plant/product-platforms/{id}/release, /return-to-draft, POST /plant/certification-records/{id}/decide, POST /plant/run-tests, POST /plant/supplier-corrective-actions/{id}/close"
    note: "Priority 60 sits below the state gates and above the regulatory gates; see priority-pair rule decide-sod-beats-flammable-prohibition."

  - rule_id: order-ownership
    priority: 60
    category: authorization
    condition: "The acting X-User-ID is not the created_by_user_id of the distributor order being cancelled."
    error_id: ERR_ORDER_NOT_OWNED
    applies_to: "POST /plant/distributor-orders/{id}/cancel"

  - rule_id: manufacture-window-closed
    priority: 70
    category: regulatory
    condition: "The logical clock is at or past the governing program's manufacture_cutoff_utc on an operation that manufactures - creating a build order or charging a lot."
    error_id: ERR_MANUFACTURE_WINDOW_CLOSED
    applies_to: "POST /plant/build-orders, POST /plant/build-orders/{id}/charge"

  - rule_id: manufacture-cutoff-not-reached
    priority: 70
    category: regulatory
    condition: "Entering sell-through before the logical clock reaches manufacture_cutoff_utc."
    error_id: ERR_MANUFACTURE_CUTOFF_NOT_REACHED
    applies_to: "POST /plant/refrigerant-programs/{id}/enter-sell-through"

  - rule_id: sell-through-deadline-not-reached
    priority: 70
    category: regulatory
    condition: "Expiring a program before the logical clock reaches sell_through_deadline_utc."
    error_id: ERR_SELL_THROUGH_DEADLINE_NOT_REACHED
    applies_to: "POST /plant/refrigerant-programs/{id}/expire"

  - rule_id: sell-through-deadline-passed
    priority: 70
    category: regulatory
    condition: "Shipping stock at or after the governing program's sell_through_deadline_utc."
    error_id: ERR_SELL_THROUGH_DEADLINE_PASSED
    applies_to: "POST /plant/distributor-orders/{id}/ship"

  - rule_id: flammable-refrigerant-prohibited
    priority: 70
    category: regulatory
    condition: "Certifying a record whose governing RegionalStandard has prohibits_flammable_refrigerant == true while the platform's program flammability_class == A2L."
    error_id: ERR_FLAMMABLE_REFRIGERANT_PROHIBITED
    applies_to: "POST /plant/certification-records/{id}/decide"

  - rule_id: efficiency-below-regional-minimum
    priority: 70
    category: regulatory
    condition: "rated_seer2_submitted is below the governing standard's minimum for the platform's efficiency_tier."
    error_id: ERR_EFFICIENCY_BELOW_REGIONAL_MINIMUM
    applies_to: "POST /plant/certification-records/{id}/submit"

  - rule_id: region-not-certified
    priority: 70
    category: regulatory
    condition: "The order's region_code appears in the platform's blocked_region_codes when allocating or shipping."
    error_id: ERR_REGION_NOT_CERTIFIED
    applies_to: "POST /plant/distributor-orders/{id}/allocate, /ship"

  - rule_id: warranty-posture-blocked
    priority: 70
    category: regulatory
    condition: "Creating a build order for a platform whose warranty_posture == DESIGN_CHANGE_REQUIRED."
    error_id: ERR_WARRANTY_POSTURE_BLOCKED
    applies_to: "POST /plant/build-orders"

  - rule_id: a2l-safety-limit-unset
    priority: 80
    category: safety
    condition: "Submitting an engineering review for a platform on an A2L program whose max_charge_grams is null or below 1."
    error_id: ERR_A2L_SAFETY_LIMIT_UNSET
    applies_to: "POST /plant/product-platforms/{id}/submit-engineering-review"

  - rule_id: flammable-charge-limit
    priority: 80
    category: safety
    condition: "charge_grams exceeds platform.max_charge_grams on a lot whose program flammability_class == A2L."
    error_id: ERR_FLAMMABLE_CHARGE_LIMIT_EXCEEDED
    applies_to: "POST /plant/build-orders/{id}/charge"

  - rule_id: leak-hold-too-short
    priority: 80
    category: safety
    condition: "method == PRESSURE_DECAY with hold_minutes below MIN_PRESSURE_DECAY_HOLD_MINUTES (15)."
    error_id: ERR_LEAK_TEST_HOLD_TOO_SHORT
    applies_to: "POST /plant/leak-tests"

  - rule_id: warehouse-capacity
    priority: 90
    category: capacity
    condition: "The day-wise peak occupancy from calculations.warehouse_pallet_occupancy would exceed Warehouse.pallet_capacity on any day of the candidate interval."
    error_id: ERR_WAREHOUSE_CAPACITY_EXCEEDED
    applies_to: "POST /plant/warehouse-reservations"

  - rule_id: no-eligible-supply
    priority: 90
    category: capacity
    condition: "calculations.allocation_fill_plan yields granted_units below MIN_GRANT_UNITS - the kit capacity is zero, or the pro-rata fair share floors to zero."
    error_id: ERR_NO_ELIGIBLE_SUPPLY
    applies_to: "POST /plant/distributor-orders/{id}/allocate"

  - rule_id: test-cell-window-conflict
    priority: 90
    category: capacity
    condition: "calculations.test_cell_window_eligibility reports conflict_found for the requested cell and window."
    error_id: ERR_TEST_CELL_WINDOW_CONFLICT
    applies_to: "POST /plant/run-tests"

  - rule_id: preseason-release-needs-reservation
    priority: 90
    category: capacity
    condition: "Releasing a pre-season lot to stock when no ACTIVE WarehouseReservation of that lot covers the logical clock's date."
    error_id: ERR_NO_WAREHOUSE_RESERVATION
    applies_to: "POST /plant/build-orders/{id}/release-to-stock"

  - rule_id: platform-has-open-builds
    priority: 100
    category: aggregate
    condition: "Retiring a platform that still has a BuildOrder with status IN {COIL_FAB, BRAZED, REWORK, LEAK_PASSED, CHARGED, RUN_PASSED}."
    error_id: ERR_PLATFORM_HAS_OPEN_BUILDS
    applies_to: "POST /plant/product-platforms/{id}/retire"

  - rule_id: ship-units-exceed-allocation
    priority: 100
    category: aggregate
    condition: "shipped_units on the ship request is not equal to the order's allocated_units."
    error_id: ERR_SHIP_UNITS_EXCEED_ALLOCATION
    applies_to: "POST /plant/distributor-orders/{id}/ship"

priority_pair_conflicts:
  - pair_id: allocate-stale-beats-region
    endpoint: "POST /plant/distributor-orders/{id}/allocate"
    lower_priority_rule: "supply-stale-version (40, ERR_STALE_SUPPLY_VERSION, 412)"
    higher_priority_number_rule: "region-not-certified (70, ERR_REGION_NOT_CERTIFIED, 409)"
    expectation: "A request that is both stale and aimed at an uncertified region returns ERR_STALE_SUPPLY_VERSION with 412; the region gate is never reached."
  - pair_id: charge-stage-beats-safety-limit
    endpoint: "POST /plant/build-orders/{id}/charge"
    lower_priority_rule: "build-stage-gate (50, ERR_BUILD_STAGE_INVALID, 409)"
    higher_priority_number_rule: "flammable-charge-limit (80, ERR_FLAMMABLE_CHARGE_LIMIT_EXCEEDED, 422)"
    expectation: "Charging an over-limit mass onto a lot that is not LEAK_PASSED returns ERR_BUILD_STAGE_INVALID; the safety limit is only reported for a lot that is otherwise chargeable."
  - pair_id: decide-sod-beats-flammable-prohibition
    endpoint: "POST /plant/certification-records/{id}/decide"
    lower_priority_rule: "segregation-of-duties (60, ERR_SEGREGATION_OF_DUTIES, 409)"
    higher_priority_number_rule: "flammable-refrigerant-prohibited (70, ERR_FLAMMABLE_REFRIGERANT_PROHIBITED, 422)"
    expectation: "The submitter certifying their own A2L filing into a region that bans flammable refrigerant returns ERR_SEGREGATION_OF_DUTIES; the prohibition surfaces only for a different auditor."

endpoints:
  # ---- logical clock (test-driving, §1.5 rung 3) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every deadline, cutoff, window, and occupancy rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlantAdmin]
    code: 200
    input: ["current_utc"]
    output: null
    side_effects: ["No stored row changes; every subsequent evaluation of manufacture_cutoff_utc, sell_through_deadline_utc, reservation day windows, and cooldown buffers uses the new instant"]

