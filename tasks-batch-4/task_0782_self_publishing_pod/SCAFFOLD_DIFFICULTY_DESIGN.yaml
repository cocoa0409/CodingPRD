              payload: { expected_format_version: "${v1}", channel_id: "${amz}", territory: "US", list_price_cents: 1500, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-04-01T00:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { p1: "$.data.id" }
            - call: "GET /formats/${fmt}"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { v2: "$.data.version" }
            - call: "POST /formats/${fmt}/prices"
              payload: { expected_format_version: "${v2}", channel_id: "${amz}", territory: "US", list_price_cents: 1600, effective_from: "2026-04-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { p2: "$.data.id" }
            - call: "GET /formats/${fmt}"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { v3: "$.data.version" }
          trigger:
            - call: "POST /formats/${fmt}/prices"
              payload: { expected_format_version: "${v3}", channel_id: "${amz}", territory: "US", list_price_cents: 1700, effective_from: "2026-03-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { err: "$.data.error_id" }
          assert:
            - "The adjacent touching price ChannelPrice.${p2}.status == ACTIVE (accepted)"
            - "HTTP 409 on the overlapping create"
            - "response data.error_id == ERR_PRICE_WINDOW_OVERLAP"

      - name: statement_period_overlap_closed_touching_rejected
        grounds:
          - validations[priority=7]
          - errors[ERR_STATEMENT_PERIOD_OVERLAP]
          - entities.RoyaltyStatement.fields.period_start
        distinguishing_aspect: "RoyaltyStatement periods are CLOSED-inclusive [start,end]: a new period whose start (2026-03-31) equals the prior period's end (2026-03-31) is REJECTED — the opposite adjacency semantics from the half-open price windows, on a different resource (Publisher)."
        test_recipe:
          setup:
            - "Publisher with an existing statement covering [2026-01-01,2026-03-31]."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /publishers/${pub}/royalty-statements"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { stmt1: "$.data.id" }
          trigger:
            - call: "POST /publishers/${pub}/royalty-statements"
              payload: { period_start: "2026-03-31T00:00:00Z", period_end: "2026-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 409"
            - "response data.error_id == ERR_STATEMENT_PERIOD_OVERLAP"

  - rule_id: compensating_invariant
    instances:
      - name: isbn_pool_count_conserved_on_assign_then_release
        grounds:
          - state_machines.Isbn
          - entities.Isbn.fields.status
          - entities.Isbn.fields.assigned_format_id
          - entities.Format.fields.isbn_id
        distinguishing_aspect: "Conserved quantity = the ISBN pool count invariant FREE + ASSIGNED + LOCKED == pool size: assigning then releasing an ISBN returns it to FREE with assigned_format_id null and Format.isbn_id null, restoring the pre-action FREE count exactly."
        test_recipe:
          setup:
            - "Publisher with exactly one pool ISBN (FREE); one title and one DRAFT PRINT format."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /publishers/${pub}/isbns"
              payload: { isbn_13: "9780000000041" }
              as: PlatformAdmin
              captures: { isbn: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "Isbn Book", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt: "$.data.id" }
          trigger:
            - call: "POST /formats/${fmt}/assign-isbn"
              payload: { isbn_id: "${isbn}" }
              as: Publisher
              as_user_id: "${pub}"
            - call: "GET /isbns/${isbn}"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { st_assigned: "$.data.status" }
            - call: "POST /formats/${fmt}/release-isbn"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
            - call: "GET /isbns/${isbn}"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { st_free: "$.data.status" }
          assert:
            - "After assign Isbn.${isbn}.status == ASSIGNED and Isbn.${isbn}.assigned_format_id == ${fmt}"
            - "After release Isbn.${isbn}.status == FREE and Isbn.${isbn}.assigned_format_id is null"
            - "After release Format.${fmt}.isbn_id is null"

      - name: returns_reserve_balance_conserved_on_sale_then_return
        grounds:
          - calculations.publisher_reserve_balance
          - calculations.sales_line_amounts
          - entities.Publisher.fields.reserve_held_cents
        distinguishing_aspect: "Conserved quantity = Publisher.reserve_held_cents (money, distinct from the ISBN count invariant): a SALE of 3 units adds +259 reserve and an identical RETURN of 3 units adds -259, leaving the publisher's outstanding reserve back at its pre-sale value of 0."
        test_recipe:
          setup:
            - "AMZ channel (reserve 0.15), publisher, title, PRINT format with an ACTIVE open-ended US price of royalty 575."
          setup_api_calls:
            - call: "POST /channels"
              payload: { name: "AMZ", channel_type: "RETAIL", supports_formats: ["PRINT","EBOOK"], ebook_high_rate: 0.70, ebook_low_rate: 0.35, ebook_rate_low_threshold_cents: 299, ebook_rate_high_threshold_cents: 999, delivery_fee_per_mb_cents: 15, distribution_discount_standard: 0.40, distribution_discount_expanded: 0.60, returns_reserve_pct: 0.15, min_list_price_cents: 99, max_list_price_cents: 25000 }
              as: PlatformAdmin
              captures: { amz: "$.data.id" }
            - call: "POST /publishers"
              payload: { name: "Indie House", email: "p@x.com" }
              as: PlatformAdmin
              captures: { pub: "$.data.id" }
            - call: "POST /titles"
              payload: { publisher_id: "${pub}", title: "Reserve Book", language: "en", bisac_category: "FIC000000" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { title: "$.data.id" }
            - call: "POST /titles/${title}/formats"
              payload: { format_type: "PRINT", trim_size: "6x9", interior_color: "BW", page_count: 200 }
              as: Publisher
              as_user_id: "${pub}"
              captures: { fmt: "$.data.id", v1: "$.data.version" }
            - call: "POST /formats/${fmt}/prices"
              payload: { expected_format_version: "${v1}", channel_id: "${amz}", territory: "US", list_price_cents: 1500, effective_from: "2026-01-01T00:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
          trigger:
            - call: "POST /sales-lines"
              payload: { format_id: "${fmt}", channel_id: "${amz}", territory: "US", units: 3, line_type: "SALE", sale_date: "2026-03-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { sale: "$.data.id", sale_reserve: "$.data.reserve_held_cents" }
            - call: "GET /publishers/${pub}"
              payload: {}
              as: PlatformAdmin
              captures: { res_after_sale: "$.data.reserve_held_cents" }
            - call: "POST /sales-lines"
              payload: { format_id: "${fmt}", channel_id: "${amz}", territory: "US", units: 3, line_type: "RETURN", sale_date: "2026-03-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { ret: "$.data.id", ret_reserve: "$.data.reserve_held_cents" }
            - call: "GET /publishers/${pub}"
              payload: {}
              as: PlatformAdmin
              captures: { res_after_return: "$.data.reserve_held_cents" }
          assert:
            - "SalesLine.${sale}.reserve_held_cents == 259"
            - "After the SALE Publisher.${pub}.reserve_held_cents == 259"
            - "SalesLine.${ret}.reserve_held_cents == -259"
            - "After the RETURN Publisher.${pub}.reserve_held_cents == 0"
