# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing X-User-Role / X-User-ID or undeclared role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint or this specific transition (e.g. SecurityOfficer approving a CROWN_JEWEL grant)" }
  - { id: ERR_OWNERSHIP_REQUIRED, http: 403, condition: "Actor identity must equal the owning entity id (sign own ack, submit own disclosure, complete own training, counterparty executes/fulfills its own rows)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID attempted both sides of a controlled step (measure implementer verifying; letter drafter approving; disclosure requester approving)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_*_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition undefined from current state, or entity-level state gate failed (asset not REGISTERED, employee not ACTIVE, review not ESCALATED, terminal state reached)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, empty claim_lines, conflicting optional ids, findings_count < critical_findings, publish same policy version, bad departure_type" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Employee email already exists" }
  - { id: ERR_DATE_ORDER, http: 422, condition: "end <= start on NDA window, interview window, or audit window" }
  - { id: ERR_EXPIRY_IN_PAST, http: 422, condition: "Grant expires_at <= now or > now + 365 days" }
  - { id: ERR_REVIEW_WINDOW_EXPIRED, http: 422, condition: "Manual forensic review opened more than 90 days after departed_at" }
  - { id: ERR_NDA_WINDOW_OVERLAP, http: 409, condition: "NDA closed-interval window overlaps another non-terminal NDA of the same counterparty and is not its amendment" }
  - { id: ERR_AUDIT_WINDOW_CONFLICT, http: 409, condition: "Department has another non-terminal audit within the required 7-day buffer" }
  - { id: ERR_INTERVIEW_OVERLAP, http: 409, condition: "Half-open interview window overlaps another SCHEDULED/CONDUCTED interview of the same employee" }
  - { id: ERR_NEED_TO_KNOW_VIOLATION, http: 403, condition: "Employee access_clearance below the asset classification requirement on grant creation" }
  - { id: ERR_CLASSIFICATION_CEILING_EXCEEDED, http: 409, condition: "Asset classification exceeds the NDA classification_ceiling" }
  - { id: ERR_POSTURE_DEFICIENT, http: 409, condition: "Asset protection_posture is DEFICIENT at disclosure approval" }
  - { id: ERR_PRESERVATION_HOLD_ACTIVE, http: 409, condition: "An ISSUED/ACTIVE PreservationNotice covers the target (asset retire, evidence release)" }
  - { id: ERR_DISCLOSURE_RISK_TOO_HIGH, http: 409, condition: "disclosure_risk_score final >= 95; approval forbidden" }
  - { id: ERR_ENDORSEMENT_REQUIRED, http: 409, condition: "disclosure_risk_score final >= 80 and senior_endorsed is false" }
  - { id: ERR_NDA_NOT_ACTIVE, http: 409, condition: "Referenced NDA is not ACTIVE (disclosure review/approval)" }
  - { id: ERR_COUNTERPARTY_NOT_ACTIVE, http: 409, condition: "Counterparty is SUSPENDED or BARRED for an operation that requires ACTIVE" }
  - { id: ERR_STALE_REFERENCE, http: 409, condition: "Pinned asset or NDA version no longer current at disclosure approval (version-pinning on approval)" }
  - { id: ERR_ACK_REQUIRED, http: 409, condition: "Employee activation lacks a SIGNED acknowledgment on the current policy version" }
  - { id: ERR_POLICY_VERSION_STALE, http: 409, condition: "Signing an acknowledgment whose policy_version is not the program's current version" }
  - { id: ERR_EXIT_INTERVIEW_NOT_CERTIFIED, http: 409, condition: "Departure attempted without a CERTIFIED exit interview" }
  - { id: ERR_ACTIVE_GRANTS_REMAIN, http: 409, condition: "Departure or asset retirement attempted while active grants remain" }
  - { id: ERR_REVIEW_NOT_CONCLUDED, http: 409, condition: "Departure attempted with a forensic review not yet CLOSED_NO_ACTION or ESCALATED" }
  - { id: ERR_TRAINING_NOT_CURRENT, http: 409, condition: "Employee training_current is false at grant approval" }
  - { id: ERR_MEASURE_EVIDENCE_REQUIRED, http: 422, condition: "IMPLEMENTED attempted with empty evidence_uri" }
  - { id: ERR_MARKING_EVIDENCE_REQUIRED, http: 422, condition: "EXECUTED attempted without marking_evidence_uri and a well-formed marking_sha256" }
  - { id: ERR_INVALID_HASH, http: 422, condition: "sha256 fails ^[0-9a-f]{64}$ on evidence collection" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IPCounsel
    description: "Corporate IP counsel; owns the register, NDAs, obligations, disclosures, letters (drafting), preservation notices, policy publishing, and the periodic sweep"
    identity: opaque
    exclusive_operations:
      - "POST /api/assets, PATCH /api/assets/{id}, POST /api/assets/{id}/state"
      - "POST /api/counterparties, POST /api/counterparties/{id}/state"
      - "POST /api/ndas, POST /api/ndas/{id}/amendments"
      - "POST /api/obligations"
      - "POST /api/demand-letters"
      - "POST /api/preservation-notices"
      - "POST /api/program/policy/publish"
      - "POST /api/_clock/set_current_utc"
      - "VERIFY/LAPSE/ABANDON measure transitions; WAIVE/ESCALATE obligation transitions"
      - "APPROVE/REJECT/RETURN/EXECUTE disclosure transitions"
      - "COUNSEL_REVIEW/CLOSED_NO_ACTION/ESCALATED review transitions"
    shared_operations:
      - "POST /api/measures, POST /api/measures/{id}/state (implement)"
      - "POST /api/forensic-reviews, POST /api/forensic-reviews/{id}/state (counsel steps)"
      - "POST /api/grants/{id}/state (approve/deny/revoke; required for CROWN_JEWEL approval)"
      - "POST /api/evidence-items/{id}/state (release)"
      - "POST /api/program/sweep"
      - "GET reads across collections"

  - name: SeniorCounsel
    description: "Senior legal sign-off; counter-signs high-risk disclosures, approves and issues demand letters, releases preservation notices"
    identity: opaque
    exclusive_operations:
      - "POST /api/disclosures/{id}/endorse"
      - "COUNSEL_APPROVED / ISSUED / LITIGATION demand-letter transitions"
      - "RELEASED preservation-notice transition"
    shared_operations:
      - "GET reads on assets, counterparties, NDAs, obligations, disclosures, letters, notices, evidence, reviews, program status"

  - name: HRPartner
    description: "People-operations partner; owns employee records, onboarding acknowledgments, exit interviews, training assignment administration"
    identity: opaque
    exclusive_operations:
      - "POST /api/employees, POST /api/employees/{id}/state"
      - "POST /api/acknowledgments"
      - "POST /api/exit-interviews, PATCH /api/exit-interviews/{id}, POST /api/exit-interviews/{id}/state"
      - "POST /api/training-assignments; ESCALATED / EXCUSED training transitions"
    shared_operations:
      - "POST /api/forensic-reviews (manual open)"
      - "GET reads on employees, acknowledgments, interviews, training, reviews, program status"

  - name: SecurityOfficer
    description: "Security operations; implements measures, provisions access, runs forensic imaging, collects and seals evidence, runs clean-desk audits"
    identity: opaque
    exclusive_operations:
      - "PROVISIONED / SUSPENDED grant transitions"
      - "IMAGING / FINDINGS_DRAFTED review transitions; PATCH /api/forensic-reviews/{id}"
      - "POST /api/evidence-items; SEALED evidence transition"
      - "POST /api/clean-desk-audits, POST /api/clean-desk-audits/{id}/state"
    shared_operations:
      - "POST /api/measures, POST /api/measures/{id}/state (implement)"
      - "POST /api/grants/{id}/state (approve/deny/revoke for non-CROWN_JEWEL)"
      - "POST /api/forensic-reviews/{id}/state (officer steps)"
      - "POST /api/program/sweep"
      - "GET reads on assets, counterparties, measures, grants, employees, evidence, audits, program status"

  - name: Employee
    description: "Staff member; signs own acknowledgments, completes own training, requests access and disclosures"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /api/acknowledgments/{id}/sign (own only)"
      - "COMPLETED training transition (own assignments only)"
      - "POST /api/grants (employee_id must equal X-User-ID)"
      - "POST /api/disclosures; SUBMITTED / WITHDRAWN / RETURNED->DRAFT disclosure transitions (own requests only)"
    shared_operations:
      - "GET /api/employees/{id} (own record), GET /api/acknowledgments, GET /api/training-assignments, GET /api/grants, GET /api/disclosures"

  - name: CounterpartyRep
    description: "External counterparty representative; executes NDAs and fulfills obligations for their own organization"
    identity: "entity_backed:Counterparty"
    exclusive_operations:
      - "EXECUTED NDA transition (X-User-ID must equal the NDA's counterparty_id)"
      - "FULFILLED obligation transition (X-User-ID must equal the parent NDA's counterparty_id)"
    shared_operations:
      - "GET /api/obligations, GET /api/obligations/{id}"
