            - "Probe 3: HTTP 200 even though safety-1 also recorded the escalation response — review_opened_by_user_id is null on the ESCALATED_RESPONSE branch, so the check is vacuous"
            - "ObservationOrder.${ofob} returns ESCALATED -> ACTIVE on probe 3, with elopement_risk_score == 3.5 (2.5 baseline + 1.0 for the trailing-24h ELOPEMENT_ATTEMPT) and reassessment_interval_hours == 12"
            - "ObservationOrder.${ofoa}.elopement_risk_score == 3.5 (1.5 baseline + 2.0 for the all-time FALL_WITH_INJURY) with required_modality forced to ONE_TO_ONE_SITTER by the review"
            - "Staff.${ofsa}.status == SUSPENDED with suspension_reason == INCIDENT_REVIEW_OPENED and Staff.${ofsb}.status == AVAILABLE"

