            - *k_channel
            - *k_provision
            - *k_health_ok
            - *k_ready
            - *k_clock_prelive
            - *k_golive
            - *k_clock_live
            - *k_cart1
            - call: "GET /carts/${ct1}"
              payload: {}
              as: Viewer
              as_user_id: "${v1}"
              captures: { ct1_v: $.data.version }
          trigger:
