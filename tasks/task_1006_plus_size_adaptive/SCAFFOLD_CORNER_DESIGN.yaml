# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: customer_register_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - endpoints.POST_/customers/register
          - entities.Customer.fields.loyalty_tier
          - entities.Customer.fields.account_status
        distinguishing_aspect: "Registering with the three required fields returns 201 and system defaults: loyalty_points_balance 0, loyalty_tier STANDARD, wallet_credit_cents 0, no_show_count 0, booking_status ACTIVE, account_status ACTIVE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers/register"
              payload: { email: "new@x.com", full_name: "New Person", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
          assert:
            - "response.status == 201"
            - "Customer.${cust_id}.loyalty_tier == STANDARD"
            - "Customer.${cust_id}.loyalty_points_balance == 0"
            - "Customer.${cust_id}.wallet_credit_cents == 0"
            - "Customer.${cust_id}.booking_status == ACTIVE"
            - "Customer.${cust_id}.account_status == ACTIVE"

      - name: register_missing_required_size_returns_400
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/customers/register
          - entities.Customer.fields.size_code
        distinguishing_aspect: "Omitting the required size_code field yields ERR_VALIDATION (400) and no customer is created."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers/register"
              payload: { email: "bad@x.com", full_name: "No Size" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "response.status == 400"

      - name: variant_create_out_of_size_range_returns_409
        claim_type: Type Constraints
        grounds:
          - endpoints.POST_/products/{id}/variants
          - entities.ProductVariant.fields.size_code
          - errors[ERR_SIZE_OUT_OF_RANGE]
        distinguishing_aspect: "Creating a variant with size_code 40 under a product whose size_max is 34 is rejected with ERR_SIZE_OUT_OF_RANGE."
        test_recipe:
          setup: ["A product offering sizes 10..34."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Adaptive Wrap Dress", category: "DRESSES", base_price_cents: 6000, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 40, color: "Navy", inventory_on_hand: 5 }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SIZE_OUT_OF_RANGE"

      - name: variant_create_computes_available_and_reserved
        claim_type: Computed Fields
        grounds:
          - entities.ProductVariant.fields.inventory_available
          - entities.ProductVariant.fields.inventory_reserved
        distinguishing_aspect: "A freshly created variant with inventory_on_hand 5 has inventory_reserved 0 and inventory_available 5 (computed, not client-supplied)."
        test_recipe:
          setup: ["A product exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Adaptive Wrap Dress", category: "DRESSES", base_price_cents: 6000, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
          trigger:
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 22, color: "Navy", inventory_on_hand: 5 }
              as: StoreManager
              captures: { v1: $.data.id }
          assert:
            - "ProductVariant.${v1}.inventory_reserved == 0"
            - "ProductVariant.${v1}.inventory_available == 5"

      - name: product_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/products/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /products/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty catalog."]
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response.status == 404"

      - name: product_filter_by_adaptive_feature
        claim_type: Type Constraints
        grounds:
          - endpoints.GET_/products
          - entities.Product.fields.adaptive_features
        distinguishing_aspect: "GET /products?adaptive_feature=MAGNETIC_CLOSURE returns the magnetic product and excludes a plain product with no adaptive features."
        test_recipe:
          setup: ["One product with adaptive_features [MAGNETIC_CLOSURE] and one plain product."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Magnetic Blouse", category: "TOPS", base_price_cents: 5000, size_min: 10, size_max: 34, adaptive_features: ["MAGNETIC_CLOSURE"] }
              as: StoreManager
              captures: { p_mag: $.data.id }
            - call: "POST /products"
              payload: { name: "Plain Tee", category: "TOPS", base_price_cents: 4000, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { p_plain: $.data.id }
          trigger:
            - call: "GET /products?adaptive_feature=MAGNETIC_CLOSURE"
              payload: {}
              as: Anonymous
          assert:
            - "response.response_type == array"
            - "response.data includes product id ${p_mag}"
            - "response.data excludes product id ${p_plain}"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: products_list_returns_array_envelope_with_pagination
        claim_type: Listing
        grounds:
          - endpoints.GET_/products
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /products returns response_type array with meta plus pagination fields total_count and has_more present in the envelope."
        test_recipe:
          setup: ["At least one product exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { name: "Adaptive Wrap Dress", category: "DRESSES", base_price_cents: 6000, size_min: 10, size_max: 34 }
              as: StoreManager
          trigger:
            - call: "GET /products"
              payload: {}
              as: Anonymous
          assert:
            - "response.response_type == array"
            - "response envelope contains total_count and has_more"

      - name: add_line_nonexistent_variant_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.POST_/orders/{id}/lines
          - entities.OrderLine.fields.variant_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Adding a line whose variant_id does not exist returns ERR_NOT_FOUND (FK existence)."
        test_recipe:
          setup: ["A customer with an open order."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "ep1@x.com", full_name: "EP One", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "00000000-0000-4000-8000-000000000000", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: order_deliver_awards_loyalty_points
        claim_type: Computed read
        grounds:
          - state_machines.Order.SHIPPED_to_DELIVERED
          - calculations.loyalty_earn_and_tier
          - entities.Order.fields.points_earned
        distinguishing_aspect: "An order whose total is 6000 grants floor(6000/100)=60 points on DELIVER, added to loyalty_points_balance and loyalty_lifetime_points (STANDARD stays STANDARD, no bonus)."
        test_recipe:
          setup: ["A one-line order (unit 6000) driven to DELIVERED for a STANDARD customer."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "ep2@x.com", full_name: "EP Two", size_code: 14 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Adaptive Wrap Dress", category: "DRESSES", base_price_cents: 6000, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 14, color: "Black", inventory_on_hand: 10 }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v1}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "CAPTURE" }
              as: StoreManager
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "PICK" }
              as: StoreManager
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "SHIP" }
              as: StoreManager
          trigger:
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "DELIVER" }
              as: StoreManager
          assert:
            - "Order.${order_id}.points_earned == 60"
            - "Customer.${cust_id}.loyalty_points_balance == 60"
            - "Customer.${cust_id}.loyalty_lifetime_points == 60"
            - "Customer.${cust_id}.loyalty_tier == STANDARD"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: order_capture_before_authorize_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Order.AUTHORIZED_to_CAPTURED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CAPTURE on an order still in payment_status PENDING (never checked out) is rejected with ERR_INVALID_STATE; no dimension advances."
        test_recipe:
          setup: ["An order with a line but not yet checked out (payment PENDING)."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "sm1@x.com", full_name: "SM One", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Adaptive Wrap Dress", category: "DRESSES", base_price_cents: 6000, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 22, color: "Navy", inventory_on_hand: 10 }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v1}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "CAPTURE" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Order.${order_id}.payment_status == PENDING"

      - name: order_pick_before_capture_returns_invalid_state
        claim_type: guarded transitions
        grounds:
          - state_machines.Order.UNFULFILLED_to_PICKING
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "PICK while payment_status is AUTHORIZED (not yet CAPTURED) fails the cross-dimension precondition with ERR_INVALID_STATE."
        test_recipe:
          setup: ["An order checked out (AUTHORIZED) but not captured."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "sm2@x.com", full_name: "SM Two", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Adaptive Wrap Dress", category: "DRESSES", base_price_cents: 6000, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 22, color: "Navy", inventory_on_hand: 10 }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v1}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "PICK" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Order.${order_id}.fulfillment_status == UNFULFILLED"

      - name: order_cancel_after_shipped_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Order.PICKING_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "CANCEL once fulfillment_status is SHIPPED is rejected with ERR_INVALID_STATE (cancellation only allowed from UNFULFILLED or PICKING)."
        test_recipe:
          setup: ["An order captured, picked, and shipped."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "sm3@x.com", full_name: "SM Three", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Adaptive Wrap Dress", category: "DRESSES", base_price_cents: 6000, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 22, color: "Navy", inventory_on_hand: 10 }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v1}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "CAPTURE" }
              as: StoreManager
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "PICK" }
              as: StoreManager
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "SHIP" }
              as: StoreManager
          trigger:
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "CANCEL" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Order.${order_id}.fulfillment_status == SHIPPED"

      - name: appointment_complete_before_end_returns_not_ended
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.StylingAppointment.CONFIRMED_to_COMPLETED
          - errors[ERR_APPOINTMENT_NOT_ENDED]
        distinguishing_aspect: "COMPLETE while the clock is before end_at is rejected with ERR_APPOINTMENT_NOT_ENDED."
        test_recipe:
          setup: ["A confirmed appointment 2026-07-05 10:00-11:00 with the clock at the 2026-07-01 default (before end_at)."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "sm4@x.com", full_name: "SM Four", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Stylist G", specialties: ["ADAPTIVE"] }
              as: StoreManager
              captures: { spec_id: $.data.id }
            - call: "POST /appointments"
              payload: { specialist_id: "${spec_id}", start_at: "2026-07-05T10:00:00Z", end_at: "2026-07-05T11:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/transition"
              payload: { action: "CONFIRM" }
              as: StoreManager
          trigger:
            - call: "POST /appointments/${appt_id}/transition"
              payload: { action: "COMPLETE" }
              as: FitSpecialist
              as_user_id: "${spec_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_APPOINTMENT_NOT_ENDED"
            - "StylingAppointment.${appt_id}.status == CONFIRMED"

      - name: appointment_late_cancel_charges_fee_and_debits_wallet
        claim_type: Side Effect Execution
        grounds:
          - state_machines.StylingAppointment.CONFIRMED_to_CANCELLED
          - entities.StylingAppointment.fields.late_cancel_fee_cents
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: "Cancelling a CONFIRMED appointment 10 hours before start (< LATE_CANCEL_WINDOW_HOURS 24) sets late_cancel_fee_cents 1500 and debits wallet_credit_cents from 5000 to 3500."
        test_recipe:
          setup: ["Customer with 5000 wallet credit; a confirmed appointment starting 2026-07-05 10:00 with the clock at 2026-07-05 00:00 (10h before)."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "sm5@x.com", full_name: "SM Five", size_code: 22 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /customers/${cust_id}/wallet-adjustments"
              payload: { delta_cents: 5000 }
              as: StoreManager
            - call: "POST /specialists"
              payload: { full_name: "Stylist H", specialties: ["ADAPTIVE"] }
              as: StoreManager
              captures: { spec_id: $.data.id }
            - call: "POST /appointments"
              payload: { specialist_id: "${spec_id}", start_at: "2026-07-05T10:00:00Z", end_at: "2026-07-05T11:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/transition"
              payload: { action: "CONFIRM" }
              as: StoreManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /appointments/${appt_id}/transition"
              payload: { action: "CANCEL" }
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "StylingAppointment.${appt_id}.status == CANCELLED"
            - "StylingAppointment.${appt_id}.late_cancel_fee_cents == 1500"
            - "Customer.${cust_id}.wallet_credit_cents == 3500"

      - name: box_keep_decisions_before_ship_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.BoxShipment.SHIPPED_to_KEPT_PENDING
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "keep-decisions on a box still CURATED (never shipped) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A curated but unshipped box."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "sm6@x.com", full_name: "SM Six", size_code: 24 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Everyday Tee", category: "TOPS", base_price_cents: 6805, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 24, color: "Navy", inventory_on_hand: 20 }
              as: StoreManager
              captures: { vb1: $.data.id }
            - call: "POST /box-subscriptions"
              payload: { plan_tier: "ESSENTIALS" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id, sub_ver: $.data.version }
            - call: "POST /box-subscriptions/${sub_id}/shipments"
              payload: { expected_subscription_version: "${sub_ver}", item_variant_ids: ["${vb1}"] }
              as: StoreManager
              captures: { ship_id: $.data.id }
          trigger:
            - call: "POST /box-shipments/${ship_id}/keep-decisions"
              payload: { kept_variant_ids: ["${vb1}"] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "BoxShipment.${ship_id}.status == CURATED"

      - name: return_inspect_before_approve_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ReturnRequest.APPROVED_to_INSPECTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "INSPECT on a return still in REQUESTED (not APPROVED) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A delivered order with a RETURN still in REQUESTED."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "sm7@x.com", full_name: "SM Seven", size_code: 14 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Adaptive Wrap Dress", category: "DRESSES", base_price_cents: 6000, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 14, color: "Black", inventory_on_hand: 10 }
              as: StoreManager
              captures: { v1: $.data.id }
            - call: "POST /orders"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { variant_id: "${v1}", quantity: 1 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { l1: $.data.id }
            - call: "POST /orders/${order_id}/checkout"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "CAPTURE" }
              as: StoreManager
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "PICK" }
              as: StoreManager
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "SHIP" }
              as: StoreManager
            - call: "POST /orders/${order_id}/transition"
              payload: { action: "DELIVER" }
              as: StoreManager
            - call: "POST /returns"
              payload: { order_id: "${order_id}", return_type: "RETURN", line_ids: ["${l1}"] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /returns/${ret_id}/transition"
              payload: { action: "INSPECT" }
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "ReturnRequest.${ret_id}.status == REQUESTED"

      - name: settle_after_tryon_window_boundary_succeeds
        claim_type: Valid Transition
        grounds:
          - state_machines.BoxShipment.KEPT_PENDING_to_SETTLED
          - entities.BoxShipment.fields.shipped_at
        distinguishing_aspect: "Settling at exactly shipped_at + 7 days (2026-07-17T00:00:00Z, the >= boundary) succeeds and moves the box to SETTLED; complements the just-before rejection in §1.8."
        test_recipe:
          setup: ["An ESSENTIALS box (styling_fee 0) shipped 2026-07-10, single kept item retail 6805, STANDARD customer; clock at the exact boundary 2026-07-17T00:00:00Z."]
          setup_api_calls:
            - call: "POST /customers/register"
              payload: { email: "sm8@x.com", full_name: "SM Eight", size_code: 24 }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { name: "Everyday Tee", category: "TOPS", base_price_cents: 6805, size_min: 10, size_max: 34 }
              as: StoreManager
              captures: { prod_id: $.data.id }
            - call: "POST /products/${prod_id}/variants"
              payload: { size_code: 24, color: "Navy", inventory_on_hand: 20 }
              as: StoreManager
              captures: { vb1: $.data.id }
            - call: "POST /box-subscriptions"
              payload: { plan_tier: "ESSENTIALS" }
