  - name: state_machine_donor_parallel_dimensions_covered_by_difficulty_design
    claim_type: parallel
    grounds:
    - state_machines.DonorCandidate.advocacy_status
    - state_machines.DonorCandidate.medical_status_psychosocial_status
    excluded_because:
      difficulty_instance: non_linear_state_machine / donor_candidate_parallel_dimension_independence
      rationale: That §1.8 instance drives all three DonorCandidate dimensions in isolation and asserts
        the compound overall_status after each, which is exactly the parallel-shape claim.
  - name: state_machine_evaluation_deferral_cycle_covered_by_difficulty_design
    claim_type: cyclic
    grounds:
    - state_machines.DonorEvaluation.SUBMITTED_to_DEFERRED
    - state_machines.DonorEvaluation.DEFERRED_to_SUBMITTED
    excluded_because:
      difficulty_instance: non_linear_state_machine / donor_evaluation_deferral_resubmission_cycle
      rationale: That §1.8 instance loops SUBMITTED -> DEFERRED -> SUBMITTED -> CLEARED and asserts submission_count
        and the non-decrementing deferral_count, which is the cyclic-shape claim for this entity.
  - name: state_machine_advocacy_objection_teardown_covered_by_difficulty_design
    claim_type: compensation
    grounds:
    - state_machines.DonorCandidate.advocacy.DISCLOSED_to_OBJECTED
    - state_machines.ExchangeChain.COMMITTED_to_BROKEN
    excluded_because:
      difficulty_instance: transitive_cascade / advocate_objection_four_hop_chain_teardown
      rationale: That §1.8 instance asserts all four hops of the objection teardown and the reversal of
        every original side effect, which is the compensation claim for this dimension.
  - name: state_machine_posture_freeze_guarded_transition_covered_by_difficulty_design
    claim_type: guarded_transitions
    grounds:
    - state_machines.TransplantProgram.compliance_posture.OPEN_to_FROZEN
    - calculations.compliance_posture
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / chain_commitment_blocked_by_frozen_program_posture
      rationale: That §1.8 instance asserts the cross-entity guard (chain commitment refused while the
        PROGRAM row is FROZEN), which is the guarded-transition claim.
- section: calculations
  instances:
  - name: exclusion_screen_soft_band_upper_edges_award_every_soft_point
    claim_type: threshold
    grounds:
    - calculations.donor_exclusion_screen
    - calculations.donor_exclusion_screen.constants.BMI_HARD_MAX
    - calculations.donor_exclusion_screen.constants.EGFR_HARD_MIN
    - calculations.donor_exclusion_screen.constants.SYSTOLIC_HARD_MIN
    - calculations.donor_exclusion_screen.constants.HBA1C_HARD_MIN
    - calculations.donor_exclusion_screen.constants.SENIOR_DONOR_AGE_YEARS
    - entities.DonorEvaluation.fields.risk_points
    distinguishing_aspect: 'All five MEDICAL findings sit on the exact edge that separates soft from hard
      (bmi 35.0, egfr 80.0, systolic 159, hba1c 6.4, age 60): every one contributes its soft points and
      NONE fires a hard code, so risk_points is the full 10 with hard_exclusion_count 0.'
    test_recipe:
      setup:
      - Program NLT-01 with coordinator, advocate and two reviewers exists.
      - Donor D-501 is 60 years old, directed at recipient R-001.
      - 'Soft points: bmi 35.0 (+2, the band is 30.0 < bmi <= 35.0), egfr 80.0 (+3, band 80.0 <= egfr
        < 90.0), systolic 159 (+2, band 140..159), hba1c 6.4 (+2, band 5.7..6.49), age 60 (+1) = 10.'
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: ProgramAdmin
      - call: POST /programs
        payload:
          name: Northlake Transplant Center
          center_code: NLT-01
          organ_type: KIDNEY
          cooling_off_days: 7
          follow_up_completeness_threshold_pct: 80
          follow_up_compliance_threshold_pct: 75
          expected_one_year_survival_rate: 0.8
          donor_fund_pool_cents: 5000000
          lost_wage_daily_cap_cents: 30000
          lost_wage_weekly_cap_cents: 150000
        as: ProgramAdmin
        captures:
          prog_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Coordinator One
          staff_role: TRANSPLANT_COORDINATOR
          npi: '1000000001'
        as: ProgramAdmin
        captures:
          coord_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Advocate One
          staff_role: LIVING_DONOR_ADVOCATE
          npi: '1000000002'
        as: ProgramAdmin
        captures:
          adv_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Med
          staff_role: EVALUATION_REVIEWER
          npi: '1000000003'
        as: ProgramAdmin
        captures:
          revmed_id: $.data.id
      - call: POST /staff-members
        payload:
          program_id: ${prog_id}
          full_name: Reviewer Psy
          staff_role: EVALUATION_REVIEWER
          npi: '1000000004'
        as: ProgramAdmin
        captures:
          revpsy_id: $.data.id
      - call: POST /recipient-candidates
        payload:
          program_id: ${prog_id}
          mrn: R-001
          abo_blood_type: A
          age_years: 44
          cpra: 0.85
          dialysis_years: 2.0
          medical_urgency_points: 7
        as: TransplantCoordinator
        as_user_id: ${coord_id}
        captures:
          rec1_id: $.data.id
      - call: POST /donor-candidates
        payload:
          program_id: ${prog_id}
          mrn: D-501
          abo_blood_type: O
          age_years: 60
          intended_recipient_id: ${rec1_id}
        as: TransplantCoordinator
        as_user_id: ${coord_id}
        captures:
          d1_id: $.data.id
      trigger:
        call: POST /donor-evaluations
        payload:
          bmi: 35.0
          egfr_ml_min: 80.0
          systolic_bp: 159
          hba1c: 6.4
          coercion_flag: false
          unmanaged_substance_use: false
          decisional_capacity_ok: true
          financial_hardship_score: 1
          social_support_score: 9
          donor_candidate_id: ${d1_id}
          domain: MEDICAL
        as: EvaluationReviewer
        as_user_id: ${revmed_id}
      assert:
      - HTTP 201 with status == SUBMITTED and domain == MEDICAL
      - exclusion_codes == [] and hard_exclusion_count == 0
      - risk_points == 10 (2 + 3 + 2 + 2 + 1)
      - reviewer_staff_id == ${revmed_id} and submission_count == 1 and determined_at is null
      - DonorCandidate.${d1_id}.overall_status == EVAL_IN_PROGRESS (first evaluation) with medical_status
        still PENDING
      - DonorCandidate.${d1_id}.medical_risk_points == 0 and screening_risk_index == 0 - nothing mirrors
        before a determination
  - name: exclusion_screen_resubmission_over_the_hard_edge_zeroes_risk_points
