            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-21T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { auc_v: "$.data.version" } }
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer: "$.data.id" } }
            - { call: "POST /buyers/${buyer}/fund-deposit", payload: { amount_cents: 100000 }, as: Buyer, as_user_id: "${buyer}" }
          trigger:
            - { call: "POST /auctions/${auc}/bids", payload: { buyer_id: "${buyer}", amount_cents: 50000, expected_auction_version: "${auc_v}" }, as: Buyer, as_user_id: "${buyer}", captures: { bid: "$.data.id" } }
          assert:
            - "HTTP 201; Bid.${bid}.status == ACTIVE"
            - "Auction.${auc}.high_bid_cents == 50000 AND Auction.${auc}.min_next_bid_cents == 55000"

      - name: close_with_empty_bid_set
        grounds:
          - state_machines.Auction.LIVE_to_CLOSED
          - state_machines.StorageUnit.IN_AUCTION_to_LIEN_MATURED
          - entities.Auction.fields.high_bid_cents
        distinguishing_aspect: |
          Empty-collection boundary on POST /auctions/{id}/close: closing an auction whose
          ACTIVE-bid set is empty yields high_bid_cents 0, creates NO Sale, and reverts the
          unit IN_AUCTION -> LIEN_MATURED (distinct metric and endpoint from the bid boundary).
        test_recipe:
          setup:
            - "A LIVE auction with zero bids; clock at end_at."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { auc: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-21T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${auc}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-22T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /auctions/${auc}/close", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
          assert:
            - "Auction.${auc}.status == CLOSED AND Auction.${auc}.high_bid_cents == 0"
            - "StorageUnit.${unit}.status == LIEN_MATURED"
            - "GET /sales?auction_id=${auc} returns total_count 0 (no Sale created)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: schedule_requires_unit_matured
        grounds:
          - state_machines.StorageUnit.LIEN_MATURED_to_IN_AUCTION
          - validations[priority=9]
          - entities.StorageUnit.fields.status
        distinguishing_aspect: |
          Auction<->StorageUnit pair: Auction creation is gated on StorageUnit.status ==
          LIEN_MATURED; a matured unit yields a SCHEDULED auction while the unit stays
          LIEN_MATURED until open.
        test_recipe:
          setup:
            - "A unit matured to LIEN_MATURED."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "A1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { unit: "$.data.id" } }
            - { call: "POST /units/${unit}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { notice: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${notice}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
          trigger:
            - { call: "POST /auctions", payload: { unit_id: "${unit}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { auc: "$.data.id" } }
          assert:
            - "HTTP 201; Auction.${auc}.status == SCHEDULED"
            - "StorageUnit.${unit}.status == LIEN_MATURED (unchanged until open)"

      - name: pay_requires_buyer_not_suspended
        grounds:
          - validations[priority=10]
          - entities.Buyer.fields.status
          - state_machines.Sale.UNPAID_to_PAID
          - state_machines.Sale.UNPAID_to_FORFEITED
        distinguishing_aspect: |
          Sale<->Buyer pair (distinct from Auction<->Unit): paying Sale B is rejected with
          ERR_BUYER_SUSPENDED (pri 10) because the buyer was SUSPENDED by forfeiting Sale A;
          the buyer's cross-entity status gates the Sale payment transition.
        test_recipe:
          setup:
            - "Buyer wins two auctions (units u1, u2) -> sale_a and sale_b; clock advanced past both payment deadlines; sale_a forfeited -> buyer SUSPENDED."
          setup_api_calls:
            - { call: "POST /facilities", payload: { name: "F1", state_code: "TX", sales_tax_rate_bps: 825, facility_fee_bps: 1000 }, as: PlatformAdmin, captures: { fac: "$.data.id" } }
            - { call: "POST /tenants", payload: { facility_id: "${fac}", full_name: "T1", email: "t1@x.com" }, as: PlatformAdmin, captures: { ten: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "U1", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { u1: "$.data.id" } }
            - { call: "POST /units", payload: { facility_id: "${fac}", tenant_id: "${ten}", unit_number: "U2", monthly_rent_cents: 30000 }, as: PlatformAdmin, captures: { u2: "$.data.id" } }
            - { call: "POST /units/${u1}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { n1: "$.data.id" } }
            - { call: "POST /units/${u2}/lien-notices", payload: { past_due_balance_cents: 60000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { n2: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-20T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /lien-notices/${n1}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /lien-notices/${n2}/mature", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions", payload: { unit_id: "${u1}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { a1: "$.data.id" } }
            - { call: "POST /auctions", payload: { unit_id: "${u2}", mode: "ONLINE", start_at: "2026-03-21T00:00:00Z", end_at: "2026-03-22T00:00:00Z", reserve_cents: 50000, min_increment_cents: 5000 }, as: FacilityOperator, as_user_id: "${fac}", captures: { a2: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-21T01:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${a1}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { a1v: "$.data.version" } }
            - { call: "POST /auctions/${a2}/open", payload: {}, as: FacilityOperator, as_user_id: "${fac}", captures: { a2v: "$.data.version" } }
            - { call: "POST /buyers", payload: { full_name: "B1", email: "b1@x.com" }, as: PlatformAdmin, captures: { buyer: "$.data.id" } }
            - { call: "POST /buyers/${buyer}/fund-deposit", payload: { amount_cents: 100000 }, as: Buyer, as_user_id: "${buyer}" }
            - { call: "POST /auctions/${a1}/bids", payload: { buyer_id: "${buyer}", amount_cents: 150000, expected_auction_version: "${a1v}" }, as: Buyer, as_user_id: "${buyer}" }
            - { call: "POST /auctions/${a2}/bids", payload: { buyer_id: "${buyer}", amount_cents: 150000, expected_auction_version: "${a2v}" }, as: Buyer, as_user_id: "${buyer}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-22T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /auctions/${a1}/close", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "POST /auctions/${a2}/close", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
            - { call: "GET /sales?auction_id=${a1}", as: PlatformAdmin, captures: { sale_a: "$.data[0].id" } }
            - { call: "GET /sales?auction_id=${a2}", as: PlatformAdmin, captures: { sale_b: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-25T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /sales/${sale_a}/forfeit", payload: {}, as: FacilityOperator, as_user_id: "${fac}" }
          trigger:
            - { call: "POST /sales/${sale_b}/pay", payload: {}, as: Buyer, as_user_id: "${buyer}", captures: { err: "$.data.error_id" } }
          assert:
            - "Buyer.${buyer}.status == SUSPENDED after forfeiting sale_a"
            - "HTTP 409 with data.error_id == ERR_BUYER_SUSPENDED (pri 10 beats ERR_PAYMENT_WINDOW_EXPIRED pri 19)"

