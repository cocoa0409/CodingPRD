              as: ProgramAdmin
              as_user_id: "adm-001"
              captures: { pol_id: $.data.id, pol_v1: $.data.version }
            - call: "POST /commission-policies/${pol_id}/activate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: ProgramAdmin
              as_user_id: "adm-001"
            - call: "POST /affiliates"
              payload: { legal_name: "Tax A Ltd", contact_email: "ta@example.com", partner_type: "CONTENT", network_id: "${net_id}", payout_currency: "USD" }
