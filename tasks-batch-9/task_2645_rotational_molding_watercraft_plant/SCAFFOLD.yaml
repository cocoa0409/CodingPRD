# =============================================================================
# PRD Benchmark Scaffold — task_2645_rotational_molding_watercraft_plant
# Sections §1.0 – §1.7 (per prd-bench-scaffold-generator SKILL.md)
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; §1.9 in SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2645. Rotational Molding Watercraft Plant (rotomolded kayak and canoe manufacturer): mold inventory with oven cycle scheduling by product and mold size, polyethylene resin selection with color matching, additive packages and regrind usage limits, oven and cooling cycle control affecting wall thickness distribution and warpage, trimming, hardware installation and outfitting with fixture-based assembly, quality inspection for wall thickness, impact resistance and cosmetic defects, seasonal demand with build-ahead inventory and warehouse footprint constraints, freight optimization for bulky low-density products with nesting and trailer cube utilization, warranty on hull deformation with storage guidance to customers

domain_name: rotomold-watercraft-plant

# Flat topology: every entity is a peer collection mounted at the API root.
# There is no single owning aggregate root, so the prefix is the root itself.
api_prefix: "/"

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy

  entity_topology: flat
  # flat: 16 peer collections joined by explicit foreign keys; no nesting in URL
  # paths. Oven/cooling/mold occupancy, warehouse footprint and trailer cube are
  # all resource pools referenced by FK rather than owned by a parent path.

  state_machine_shape: parallel
  # FinishedUnit carries TWO independent state axes on one row
  # (build_status x logistics_status) and WarrantyClaim carries two more
  # (claim_status x storage_review_status). Additional non-linear shapes present:
  #   cyclic          — FinishedUnit.build_status REWORK -> TRIMMED rework loop;
  #                     Mold AVAILABLE <-> IN_CYCLE <-> MAINTENANCE;
  #                     ResinLot AVAILABLE <-> DEPLETED, AVAILABLE <-> QUARANTINED;
  #                     Shipment SEALED -> LOADING unseal revert;
  #                     WarrantyClaim UNDER_REVIEW -> SUBMITTED return-for-info
  #   compound        — ProductionOrder.status = f(child FinishedUnit build_status)
  #   posture_driven  — Warehouse.posture (NORMAL/RESTRICTED/FROZEN) gates
  #                     ProductionOrder release and FinishedUnit storage
  #   branching       — MoldingCycle SCHEDULED -> {OVEN_RUNNING, ABORTED} with
  #                     divergent side-effect sets per branch

  relationship_patterns:
    - one_to_many          # ProductionOrder -> MoldingCycle -> FinishedUnit
    - many_to_many         # Shipment <-> FinishedUnit via ShipmentLine junction
    - self_referential     # Mold.replaces_mold_id -> Mold.id (supersession chain)
    - cross_aggregate      # MoldingCycle references OvenStation, CoolingBay,
                           # Mold, Technician across aggregate boundaries;
                           # WarrantyClaim reaches back into ProductModel money

  role_model: segregation_of_duties
  # The Technician who ran a MoldingCycle may not inspect units from it, and the
  # AssemblyTechnician who outfitted a unit may not inspect that unit. Layered on
  # top of peer role ownership (ResinTechnician owns resin, LogisticsPlanner owns
  # storage/freight, WarrantyAgent owns adjudication) and one opaque admin role.

  consistency_model: immediate
  # Every cascade in §1.2 completes inside the triggering request. All derived
  # fields (Warehouse.committed_cube_m3, ProductionOrder.completed_qty,
  # DemandForecastBucket.build_ahead_committed_qty, ResinLot mass ledger,
  # ProductModel warranty reserve) are recomputed before the response is written.

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  # ProductModel — configuration hub. Owns the process window (resin spec,
  # regrind ceiling, colour tolerance, cooling floor), the geometry used by
  # freight/warehouse nesting, and the warranty money pool.
  # ---------------------------------------------------------------------------
  - name: ProductModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: "Human catalogue code for the hull model"
        constraints: "required; 3-32 chars; globally unique (case-sensitive exact match); duplicate -> ERR_DUPLICATE_CODE"
      - name: hull_type
        type: enum
        source: input
        description: "Watercraft family this model belongs to"
        constraints: "required; one of {KAYAK, CANOE}"
      - name: size_class
        type: enum
        source: input
        description: "Mold size class required to produce this model"
        constraints: "required; one of {COMPACT, MID, TANDEM, OVERSIZE}"
      - name: resin_grade
        type: enum
        source: input
        description: "Polyethylene grade the process window is qualified for"
        constraints: "required; one of {HDPE_LINEAR, HDPE_XL, MDPE}"
      - name: master_color_code
        type: string
        source: input
        description: "Master colour standard the resin lot must match"
        constraints: "required; 2-16 chars"
      - name: max_color_delta_e
        type: number
        source: input
        description: "Maximum allowed CIE dE between lot colour and master colour"
        default: 1.50
        constraints: "> 0; 2 decimal places"
      - name: required_additive_package_code
        type: string
        source: input
        description: "Additive package (UV stabiliser + antioxidant blend) the resin lot must carry"
        constraints: "required; 2-16 chars"
      - name: max_regrind_pct
        type: number
        source: input
        description: "Ceiling on the mass-weighted regrind percentage of a molding cycle's charge set"
        default: 30.00
        constraints: "0.00 <= value <= 100.00; 2 decimal places; compared with `>` (equal to the ceiling passes)"
      - name: min_melt_index_g10min
        type: number
        source: input
        description: "Lower bound of the qualified melt-flow index for lots charged into this model"
        default: 2.50
        constraints: "> 0; 2 decimal places"
      - name: max_melt_index_g10min
        type: number
        source: input
        description: "Upper bound of the qualified melt-flow index for lots charged into this model"
        default: 6.00
        constraints: "> min_melt_index_g10min; 2 decimal places"
      - name: nominal_charge_kg
        type: number
        source: input
        description: "Design shot mass for one cavity of this model"
        constraints: "required; > 0; 3 decimal places"
      - name: charge_tolerance_pct
        type: number
        source: input
        description: "Allowed +/- deviation of the actual charged mass from the mold's nominal charge"
        default: 5.00
        constraints: "0.00 < value <= 25.00; 2 decimal places; compared with `>` (equal to the tolerance passes)"
      - name: min_cooling_minutes
        type: integer
        source: input
        description: "Minimum whole minutes a part must remain in the cooling bay before demolding"
        constraints: "required; >= 1; demold compares with `<` (equal passes)"
      - name: target_wall_thickness_mm
        type: number
        source: input
        description: "Design nominal wall thickness"
        constraints: "required; > 0; 2 decimal places"
      - name: wall_thickness_min_mm
        type: number
        source: input
        description: "Minimum acceptable single measured wall-thickness point"
        constraints: "required; > 0; < target_wall_thickness_mm; 2 decimal places"
      - name: wall_cv_max_pct
        type: number
        source: input
        description: "Maximum acceptable coefficient of variation of the wall-thickness point set"
        default: 12.00
        constraints: "> 0; 2 decimal places; inspection compares with `>` (equal passes)"
      - name: impact_test_min_joules
        type: number
        source: input
        description: "Minimum joules the hull must survive on the drop-impact rig"
        constraints: "required; > 0; 2 decimal places; inspection compares with `<` (equal passes)"
      - name: gross_cube_m3
        type: number
        source: input
        description: "Bounding-box cube of one finished unit, used for freight and warehouse footprint"
        constraints: "required; > 0; 4 decimal places"
      - name: nest_factor
        type: number
        source: input
        description: "Fraction of gross_cube_m3 that each additional nested unit of the same model adds"
        constraints: "required; 0.1000 <= value <= 1.0000; 4 decimal places"
      - name: unit_weight_kg
        type: number
        source: input
        description: "Shipping weight of one finished unit"
        constraints: "required; > 0; 3 decimal places"
      - name: msrp_cents
        type: integer
        source: input
        description: "Retail price in cents; warranty gross entitlement is derived from it"
        constraints: "required; >= 1"
      - name: warranty_basis
        type: enum
        source: input
        description: "Which warranty payout variant applies to claims on units of this model"
        constraints: "required; one of {PRO_RATA_AGE, FLAT_SCHEDULE}"
      - name: initial_warranty_reserve_cents
        type: integer
        source: input
        description: "Money pool set aside for warranty payouts on this model"
        constraints: "required; >= 0"
      - name: warranty_reserve_cents
        type: integer
        source: computed
        description: "Remaining warranty reserve; see calculations.warranty_reserve_ledger"
        default: 0
        constraints: ">= 0; invariant: warranty_reserve_cents + warranty_paid_cents == initial_warranty_reserve_cents"
      - name: warranty_paid_cents
        type: integer
        source: computed
        description: "Cumulative net payout of claims currently in claim_status APPROVED for this model"
        default: 0
        constraints: ">= 0"
      - name: seasonal_family
        type: string
        source: input
        description: "Seasonal demand family label used to group build-ahead forecast buckets"
        constraints: "required; 2-32 chars"

  # ---------------------------------------------------------------------------
  # Mold — physical tool. Self-referential supersession chain via
  # replaces_mold_id. Occupancy is an exclusive interval (§1.4 priority 61).
  # ---------------------------------------------------------------------------
  - name: Mold
    parent: null
    common_fields: true
    fields:
      - name: mold_code
        type: string
        source: input
        description: "Tool-room code stamped on the mold; total ordering key for the mold selector"
        constraints: "required; 3-32 chars; globally unique; duplicate -> ERR_DUPLICATE_CODE"
      - name: product_model_id
        type: string
        source: input
        description: "FK -> ProductModel.id; the only model this mold can produce"
        constraints: "required; must exist -> ERR_PRODUCT_MODEL_NOT_FOUND"
      - name: size_class
        type: enum
        source: input
        description: "Physical size class of the tool"
        constraints: "required; one of {COMPACT, MID, TANDEM, OVERSIZE}; must equal ProductModel.size_class -> ERR_MOLD_SIZE_CLASS_MISMATCH"
      - name: cavity_count
        type: integer
        source: input
        description: "Number of hulls produced per completed molding cycle on this tool"
        constraints: "required; 1 <= value <= 4"
      - name: nominal_charge_kg
        type: number
        source: input
        description: "Total design shot mass for all cavities of this tool"
        constraints: "required; > 0; 3 decimal places; must equal ProductModel.nominal_charge_kg * cavity_count rounded to 3 dp -> ERR_VALIDATION"
      - name: service_interval_cycles
        type: integer
        source: input
        description: "Number of demolded cycles allowed between tool services"
        constraints: "required; >= 1"
      - name: cycles_since_service
        type: integer
        source: computed
        description: "Demolded cycles on this tool since the last completed service; see calculations.mold_service_counter"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Tool lifecycle state; see state_machines Mold"
        default: AVAILABLE
        constraints: "one of {AVAILABLE, IN_CYCLE, MAINTENANCE, RETIRED}"
      - name: replaces_mold_id
        type: string
        source: input
        description: "FK -> Mold.id; the retired tool this tool supersedes; null for an original tool"
        default: null
        constraints: "optional; if present must exist -> ERR_MOLD_NOT_FOUND, must have status RETIRED -> ERR_MOLD_NOT_AVAILABLE, and must reference the same product_model_id -> ERR_INVALID_MOLD_REPLACEMENT"

  # ---------------------------------------------------------------------------
  # OvenStation — resource pool #1. Occupancy semantics: EXCLUSIVE per
  # (station, arm_index), HALF-OPEN interval, symmetric changeover buffer.
  # ---------------------------------------------------------------------------
  - name: OvenStation
    parent: null
    common_fields: true
    fields:
      - name: station_code
        type: string
        source: input
        description: "Plant-floor code for the oven station"
        constraints: "required; 2-32 chars; globally unique; duplicate -> ERR_DUPLICATE_CODE"
      - name: arm_count
        type: integer
        source: input
        description: "Number of independently schedulable rotating arms on this station"
        constraints: "required; 1 <= value <= 6"
      - name: max_size_class
        type: enum
        source: input
        description: "Largest mold size class this station can swing"
        constraints: "required; one of {COMPACT, MID, TANDEM, OVERSIZE}; ordered COMPACT < MID < TANDEM < OVERSIZE"
      - name: changeover_buffer_min
        type: integer
        source: input
        description: "Whole minutes of purge/changeover required on both sides of every oven occupancy on a given arm"
        constraints: "required; >= 0"
      - name: energy_cents_per_min
        type: integer
        source: input
        description: "Oven energy cost in cents per whole minute of actual oven time"
        constraints: "required; >= 0"
      - name: status
        type: enum
        source: computed
        description: "Station availability; see state_machines OvenStation"
        default: OPERATIONAL
        constraints: "one of {OPERATIONAL, DOWN}"

  # ---------------------------------------------------------------------------
  # CoolingBay — resource pool #2. Occupancy semantics deliberately DIFFERENT
  # from OvenStation: AGGREGATE slot capacity, CLOSED interval, no buffer.
  # ---------------------------------------------------------------------------
  - name: CoolingBay
    parent: null
    common_fields: true
    fields:
      - name: bay_code
        type: string
        source: input
        description: "Plant-floor code for the cooling bay"
        constraints: "required; 2-32 chars; globally unique; duplicate -> ERR_DUPLICATE_CODE"
      - name: concurrent_slot_capacity
        type: integer
        source: input
        description: "How many cooling windows may overlap in this bay at any instant"
        constraints: "required; >= 1"
      - name: airflow_mode
        type: enum
        source: input
        description: "Cooling medium this bay delivers; a cycle's cooling_mode must equal it"
        constraints: "required; one of {AMBIENT, FORCED_AIR, WATER_MIST}"
      - name: status
        type: enum
        source: computed
        description: "Bay availability; see state_machines CoolingBay"
        default: OPERATIONAL
        constraints: "one of {OPERATIONAL, DOWN}"

  # ---------------------------------------------------------------------------
  # Technician — identity anchor for the three entity_backed shop-floor roles
  # and the subject of every segregation-of-duties check.
  # ---------------------------------------------------------------------------
  - name: Technician
    parent: null
    common_fields: true
    fields:
      - name: employee_code
        type: string
        source: input
        description: "Payroll code for the technician"
        constraints: "required; 3-32 chars; globally unique; duplicate -> ERR_DUPLICATE_CODE"
      - name: full_name
        type: string
        source: input
        description: "Technician display name"
        constraints: "required; 1-120 chars"
      - name: role_code
        type: enum
        source: input
        description: "The single shop-floor role this technician may act as"
        constraints: "required; one of {RESIN_TECH, MOLDING_OPERATOR, ASSEMBLY_TECH, QUALITY_INSPECTOR}"
      - name: certifications
        type: array
        source: input
        description: "Certification badges held; each element is one of {RESIN_BLENDING, FIXTURE_ASSEMBLY, WALL_GAUGE, IMPACT_RIG}"
        default: []
        constraints: "elements unique; unknown element -> ERR_VALIDATION"
      - name: status
        type: enum
        source: computed
        description: "Employment standing; see state_machines Technician"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  # ---------------------------------------------------------------------------
  # Customer — warranty claimant. Storage-guidance acknowledgement gates the
  # storage review outcome, which in turn gates the payout deduction.
  # ---------------------------------------------------------------------------
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: customer_code
        type: string
        source: input
        description: "Dealer/consumer account code"
        constraints: "required; 3-32 chars; globally unique; duplicate -> ERR_DUPLICATE_CODE"
      - name: email
        type: string
        source: input
        description: "Contact email for warranty correspondence"
        constraints: "required; must contain '@'"
      - name: region_code
        type: string
        source: input
        description: "Sales region code used for storage-guidance packet selection"
        constraints: "required; 2-8 chars"
      - name: storage_guidance_acknowledged_at
        type: datetime
        source: computed
        description: "Logical-clock instant the customer acknowledged the hull storage guidance; null until acknowledged"
        default: null
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: status
        type: enum
        source: computed
        description: "Account standing; see state_machines Customer"
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  # ---------------------------------------------------------------------------
  # Warehouse — resource pool #3 (footprint cube). Posture is a derived
  # aggregate that gates ProductionOrder release and FinishedUnit storage.
  # ---------------------------------------------------------------------------
  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - name: site_code
        type: string
        source: input
        description: "Warehouse site code"
        constraints: "required; 2-32 chars; globally unique; duplicate -> ERR_DUPLICATE_CODE"
      - name: footprint_capacity_cube_m3
        type: number
        source: input
        description: "Total storable cube of the site; equals the sum of its zone capacities"
        constraints: "required; > 0; 4 decimal places; must equal round(sum(zones[].capacity_cube_m3), 4) -> ERR_VALIDATION"
      - name: zones
        type: array
        source: input
        description: "Storage zones; each element is an object { zone_code: string, capacity_cube_m3: number }"
        constraints: "required; 1-12 elements; zone_code unique within the warehouse and 2-16 chars; each capacity_cube_m3 > 0 with 4 decimal places"
      - name: restricted_threshold_pct
        type: number
        source: input
        description: "Utilisation percentage at or above which posture becomes RESTRICTED"
        default: 85.00
        constraints: "0.00 < value < frozen_threshold_pct; 2 decimal places; compared with `>=`"
      - name: frozen_threshold_pct
        type: number
        source: input
        description: "Utilisation percentage at or above which posture becomes FROZEN"
        default: 95.00
        constraints: "restricted_threshold_pct < value <= 100.00; 2 decimal places; compared with `>=`"
      - name: committed_cube_m3
        type: number
        source: computed
        description: "Cube currently occupied by stored units; see calculations.warehouse_footprint_posture"
        default: 0.0000
        constraints: ">= 0; 4 decimal places; invariant: equals round(sum of FinishedUnit.stored_footprint_cube_m3 where warehouse_id == this.id and logistics_status == STORED, 4)"
      - name: utilization_pct
        type: number
        source: computed
        description: "committed_cube_m3 as a percentage of footprint_capacity_cube_m3; see calculations.warehouse_footprint_posture"
        default: 0.00
        constraints: ">= 0; 2 decimal places"
      - name: posture
        type: enum
        source: computed
        description: "Derived gating posture; see state_machines Warehouse"
        default: NORMAL
        constraints: "one of {NORMAL, RESTRICTED, FROZEN}"

  # ---------------------------------------------------------------------------
  # DemandForecastBucket — seasonal build-ahead quota window (configuration).
  # ---------------------------------------------------------------------------
  - name: DemandForecastBucket
    parent: null
    common_fields: true
    fields:
      - name: season_code
        type: string
        source: input
        description: "Season label, e.g. SPRING_2027"
        constraints: "required; 3-32 chars; (season_code, product_model_id) unique -> ERR_DUPLICATE_CODE"
      - name: product_model_id
        type: string
        source: input
        description: "FK -> ProductModel.id; the model this bucket forecasts"
        constraints: "required; must exist -> ERR_PRODUCT_MODEL_NOT_FOUND"
      - name: forecast_qty
        type: integer
        source: input
        description: "Forecast retail demand for the season"
        constraints: "required; >= 1"
      - name: build_ahead_cap_pct
        type: number
        source: input
        description: "Percentage of forecast_qty that may be built ahead and held in storage inside the window"
        default: 60.00
        constraints: "0.00 < value <= 100.00; 2 decimal places"
      - name: build_ahead_cap_qty
        type: integer
        source: computed
        description: "Absolute build-ahead ceiling; see calculations.build_ahead_commitment"
        default: 0
        constraints: ">= 1"
      - name: build_ahead_committed_qty
        type: integer
        source: computed
        description: "Count of stored sellable units charged to this bucket; see calculations.build_ahead_commitment"
        default: 0
        constraints: "0 <= value <= build_ahead_cap_qty"
      - name: window_start_on
        type: string
        source: input
        description: "First calendar date (UTC, YYYY-MM-DD) on which a stored unit counts against this bucket; inclusive"
        constraints: "required; YYYY-MM-DD"
      - name: window_end_on
        type: string
        source: input
        description: "Last calendar date (UTC, YYYY-MM-DD) on which a stored unit counts against this bucket; inclusive"
        constraints: "required; YYYY-MM-DD; >= window_start_on -> ERR_VALIDATION"

  # ---------------------------------------------------------------------------
  # ResinLot — polyethylene inventory with a three-bucket mass ledger
  # (available / reserved / consumed) that must always sum to received_kg.
  # ---------------------------------------------------------------------------
  - name: ResinLot
    parent: null
    common_fields: true
    fields:
      - name: lot_code
        type: string
        source: input
        description: "Supplier lot code"
        constraints: "required; 3-32 chars; globally unique; duplicate -> ERR_DUPLICATE_CODE"
      - name: resin_grade
        type: enum
        source: input
        description: "Polyethylene grade of this lot"
        constraints: "required; one of {HDPE_LINEAR, HDPE_XL, MDPE}"
      - name: melt_index_g10min
        type: number
        source: input
        description: "Measured melt-flow index of the lot"
        constraints: "required; > 0; 2 decimal places"
      - name: color_code
        type: string
        source: input
        description: "Colour designation of the lot as supplied"
        constraints: "required; 2-16 chars"
      - name: color_delta_e
        type: number
        source: input
        description: "Measured CIE dE of the lot against its colour master"
        constraints: "required; >= 0; 2 decimal places"
      - name: additive_package_code
        type: string
        source: input
        description: "Additive package blended into this lot"
        constraints: "required; 2-16 chars"
      - name: regrind_pct_by_mass
        type: number
        source: input
        description: "Percentage of this lot's mass that is reprocessed regrind rather than virgin resin"
        default: 0.00
        constraints: "0.00 <= value <= 100.00; 2 decimal places"
      - name: cost_cents_per_kg
        type: integer
        source: input
        description: "Purchase cost in cents per kilogram; drives ProductionOrder material cost"
        constraints: "required; >= 0"
      - name: received_kg
        type: number
        source: input
        description: "Mass received from the supplier; the conserved total of the mass ledger"
        constraints: "required; > 0; 3 decimal places"
      - name: available_kg
        type: number
        source: computed
        description: "Mass not yet reserved or consumed; see calculations.resin_mass_ledger"
        default: 0.000
        constraints: ">= 0; 3 decimal places"
      - name: reserved_kg
        type: number
        source: computed
        description: "Mass held by ResinCharge rows in status RESERVED; see calculations.resin_mass_ledger"
        default: 0.000
        constraints: ">= 0; 3 decimal places"
      - name: consumed_kg
        type: number
        source: computed
        description: "Mass burned by ResinCharge rows in status CONSUMED; see calculations.resin_mass_ledger"
        default: 0.000
        constraints: ">= 0; 3 decimal places; invariant: round(available_kg + reserved_kg + consumed_kg, 3) == received_kg"
      - name: expires_on
        type: string
        source: input
        description: "Last calendar date (UTC, YYYY-MM-DD) the lot may be charged; the lot expires when the logical clock date passes it"
        constraints: "required; YYYY-MM-DD"
      - name: status
        type: enum
        source: computed
        description: "Lot disposition; see state_machines ResinLot"
        default: AVAILABLE
        constraints: "one of {AVAILABLE, DEPLETED, QUARANTINED, EXPIRED}"

  # ---------------------------------------------------------------------------
  # ResinCharge — the reservation record that couples a MoldingCycle to a
  # ResinLot. Compensating action (RELEASED) must restore the lot ledger
  # exactly.
  # ---------------------------------------------------------------------------
  - name: ResinCharge
    parent: null
    common_fields: true
    fields:
      - name: molding_cycle_id
        type: string
        source: input
        description: "FK -> MoldingCycle.id; the cycle this charge is staged for"
        constraints: "required; must exist -> ERR_MOLDING_CYCLE_NOT_FOUND"
      - name: resin_lot_id
        type: string
        source: input
        description: "FK -> ResinLot.id; the lot the mass is drawn from"
        constraints: "required; must exist -> ERR_RESIN_LOT_NOT_FOUND"
      - name: created_by_technician_id
        type: string
        source: input
        description: "FK -> Technician.id; the resin technician who staged the charge"
        constraints: "required; must exist -> ERR_TECHNICIAN_NOT_FOUND; must equal the acting X-User-ID -> ERR_ROLE_IDENTITY_MISMATCH"
      - name: charge_kg
        type: number
        source: input
        description: "Total mass drawn from the lot for this charge"
        constraints: "required; > 0.000 -> ERR_INVALID_QUANTITY; 3 decimal places"
      - name: regrind_kg
        type: number
        source: input
        description: "Portion of charge_kg that is regrind"
        default: 0.000
        constraints: "0.000 <= value <= charge_kg -> ERR_INVALID_QUANTITY; 3 decimal places"
      - name: virgin_kg
        type: number
        source: computed
        description: "charge_kg - regrind_kg, rounded to 3 decimal places"
        default: 0.000
        constraints: ">= 0; 3 decimal places"
      - name: charge_regrind_pct
        type: number
        source: computed
        description: "regrind_kg / charge_kg * 100 for this single charge; see calculations.cycle_regrind_percentage"
        default: 0.00
        constraints: "0.00 <= value <= 100.00; 2 decimal places"
      - name: status
        type: enum
        source: computed
        description: "Charge disposition; see state_machines ResinCharge"
        default: RESERVED
        constraints: "one of {RESERVED, CONSUMED, RELEASED}"
      - name: released_reason
        type: enum
        source: computed
        description: "Why the charge was released back to the lot; null while RESERVED or CONSUMED"
        default: null
        constraints: "one of {CYCLE_ABORTED, LOT_QUARANTINED, LOT_EXPIRED, ORDER_CANCELLED, STATION_DOWN, MOLD_SERVICE_DUE}"

  # ---------------------------------------------------------------------------
  # ProductionOrder — compound aggregate. Its status is a function of child
  # FinishedUnit build_status counts and of the Warehouse posture / ResinLot
  # availability it depends on. OCC parent for cycle creation.
  # ---------------------------------------------------------------------------
  - name: ProductionOrder
    parent: null
    common_fields: true
    fields:
      - name: order_code
        type: string
        source: input
        description: "Works-order code"
        constraints: "required; 3-32 chars; globally unique; duplicate -> ERR_DUPLICATE_CODE"
      - name: product_model_id
        type: string
        source: input
        description: "FK -> ProductModel.id; the model being built"
        constraints: "required; must exist -> ERR_PRODUCT_MODEL_NOT_FOUND"
      - name: demand_bucket_id
        type: string
        source: input
        description: "FK -> DemandForecastBucket.id; the seasonal build-ahead bucket this order feeds; null for a make-to-order run"
        default: null
        constraints: "optional; if present must exist -> ERR_DEMAND_BUCKET_NOT_FOUND and its product_model_id must equal this order's product_model_id -> ERR_VALIDATION"
      - name: target_warehouse_id
        type: string
        source: input
        description: "FK -> Warehouse.id; the site finished units from this order are stored into"
        constraints: "required; must exist -> ERR_WAREHOUSE_NOT_FOUND"
      - name: ordered_qty
        type: integer
        source: input
        description: "Number of sellable hulls the order must yield"
        constraints: "required; >= 1 -> ERR_INVALID_QUANTITY"
      - name: completed_qty
        type: integer
        source: computed
        description: "Count of this order's FinishedUnit rows with build_status SELLABLE; see calculations.order_completion_rollup"
        default: 0
        constraints: ">= 0"
      - name: scrapped_qty
        type: integer
        source: computed
        description: "Count of this order's FinishedUnit rows with build_status SCRAPPED; see calculations.order_completion_rollup"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Order lifecycle state; see state_machines ProductionOrder"
        default: DRAFT
        constraints: "one of {DRAFT, READY_TO_SCHEDULE, BLOCKED_RESIN, BLOCKED_WAREHOUSE, IN_PRODUCTION, COMPLETE, CANCELLED}"
      - name: blocked_reason
        type: enum
        source: computed
        description: "Why the order is parked; null unless status is BLOCKED_RESIN or BLOCKED_WAREHOUSE"
        default: null
        constraints: "one of {NO_QUALIFIED_RESIN_LOT, WAREHOUSE_FROZEN}"
      - name: material_cost_cents
        type: integer
        source: computed
        description: "Resin cost of consumed charges; see calculations.production_order_cost"
        default: 0
        constraints: ">= 0"
      - name: oven_energy_cost_cents
        type: integer
        source: computed
        description: "Oven energy cost of demolded cycles; see calculations.production_order_cost"
        default: 0
        constraints: ">= 0"
      - name: overhead_cents
        type: integer
        source: computed
        description: "Tiered overhead applied to the pre-overhead subtotal; see calculations.production_order_cost"
        default: 0
        constraints: ">= 0"
      - name: total_cost_cents
        type: integer
        source: computed
        description: "material_cost_cents + oven_energy_cost_cents + overhead_cents; see calculations.production_order_cost"
        default: 0
        constraints: ">= 0"
      - name: unit_cost_cents
        type: integer
        source: computed
        description: "Floor-divided cost per sellable unit; see calculations.production_order_cost"
        default: 0
        constraints: ">= 0"

  # ---------------------------------------------------------------------------
  # MoldingCycle — the temporal-windowing core. One row occupies THREE resource
  # pools with THREE different interval semantics (see §1.4 priorities 61-63).
  # The mold is chosen by the server (calculations.mold_selection), never by the
  # client.
  # ---------------------------------------------------------------------------
  - name: MoldingCycle
    parent: null
    common_fields: true
    fields:
      - name: production_order_id
        type: string
        source: input
        description: "FK -> ProductionOrder.id; the order this cycle builds against"
        constraints: "required; must exist -> ERR_PRODUCTION_ORDER_NOT_FOUND"
      - name: mold_id
        type: string
        source: computed
        description: "FK -> Mold.id; tool selected by the server; see calculations.mold_selection"
        constraints: "always set on creation; never client-supplied"
      - name: oven_station_id
        type: string
        source: input
        description: "FK -> OvenStation.id; the oven station booked for the heat phase"
        constraints: "required; must exist -> ERR_OVEN_STATION_NOT_FOUND"
      - name: arm_index
        type: integer
        source: input
        description: "Which rotating arm of the station is booked; oven occupancy is exclusive per (oven_station_id, arm_index)"
        constraints: "required; 1 <= value <= OvenStation.arm_count -> ERR_VALIDATION"
      - name: cooling_bay_id
        type: string
        source: input
        description: "FK -> CoolingBay.id; the bay booked for the cool phase"
        constraints: "required; must exist -> ERR_COOLING_BAY_NOT_FOUND"
      - name: operator_technician_id
        type: string
        source: input
        description: "FK -> Technician.id; the molding operator who owns this cycle"
        constraints: "required; must exist -> ERR_TECHNICIAN_NOT_FOUND; must equal the acting X-User-ID on creation -> ERR_ROLE_IDENTITY_MISMATCH"
      - name: oven_start_at
        type: datetime
        source: input
        description: "Scheduled start of the oven occupancy window"
        constraints: "required; ISO 8601 UTC with three fractional digits"
      - name: scheduled_oven_minutes
        type: integer
        source: input
        description: "Planned whole minutes of oven time"
        constraints: "required; 1 <= value <= 600"
      - name: oven_end_at
        type: datetime
        source: computed
        description: "oven_start_at + scheduled_oven_minutes; exclusive upper bound of the oven occupancy window"
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: scheduled_cooling_minutes
        type: integer
        source: input
        description: "Planned whole minutes of cooling time; also the provisional-variant cooling input"
        constraints: "required; 1 <= value <= 600"
      - name: cooling_window_start_at
        type: datetime
        source: computed
        description: "Equal to oven_end_at; inclusive lower bound of the cooling-bay occupancy window"
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: cooling_window_end_at
        type: datetime
        source: computed
        description: "cooling_window_start_at + scheduled_cooling_minutes; INCLUSIVE upper bound of the cooling-bay occupancy window and exclusive upper bound of the mold occupancy window"
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: oven_temp_c
        type: number
        source: input
        description: "Oven air setpoint in degrees Celsius"
        constraints: "required; 200.0 <= value <= 360.0; 1 decimal place"
      - name: arm_rpm_major
        type: number
        source: input
        description: "Major-axis rotation speed in rpm"
        constraints: "required; > 0; 2 decimal places"
      - name: arm_rpm_minor
        type: number
        source: input
        description: "Minor-axis rotation speed in rpm"
        constraints: "required; > 0 -> ERR_INVALID_QUANTITY; 2 decimal places"
      - name: cooling_mode
        type: enum
        source: input
        description: "Cooling medium requested for this cycle"
        constraints: "required; one of {AMBIENT, FORCED_AIR, WATER_MIST}; must equal CoolingBay.airflow_mode -> ERR_COOLING_MODE_MISMATCH"
      - name: actual_oven_start_at
        type: datetime
        source: computed
        description: "Logical-clock instant start-oven was accepted; null while SCHEDULED"
        default: null
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: actual_oven_end_at
        type: datetime
        source: computed
        description: "Logical-clock instant start-cooling was accepted; null before the cool phase"
        default: null
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: actual_cooling_end_at
        type: datetime
        source: computed
        description: "Logical-clock instant demold was accepted; null before demold"
        default: null
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: actual_oven_minutes
        type: integer
        source: computed
        description: "floor((actual_oven_end_at - actual_oven_start_at) in seconds / 60); 0 until the cool phase starts"
        default: 0
        constraints: ">= 0"
      - name: actual_cooling_minutes
        type: integer
        source: computed
        description: "floor((actual_cooling_end_at - actual_oven_end_at) in seconds / 60); 0 until demold; the final-variant cooling input"
        default: 0
        constraints: ">= 0"
      - name: charged_mass_kg
        type: number
        source: computed
        description: "Sum of charge_kg over this cycle's ResinCharge rows in status RESERVED or CONSUMED; see calculations.cycle_charge_rollup"
        default: 0.000
        constraints: ">= 0; 3 decimal places"
      - name: weighted_melt_index_g10min
        type: number
        source: computed
        description: "Mass-weighted melt index of the cycle's charge set; see calculations.cycle_charge_rollup"
        default: 0.00
        constraints: ">= 0; 2 decimal places"
      - name: cycle_regrind_pct
        type: number
        source: computed
        description: "Mass-weighted regrind percentage of the cycle's charge set; see calculations.cycle_regrind_percentage"
        default: 0.00
        constraints: "0.00 <= value <= 100.00; 2 decimal places"
      - name: provisional_warpage_index
        type: number
        source: computed
        description: "PROVISIONAL variant of calculations.cycle_warpage_index, stamped at demold from scheduled cooling minutes; null before demold"
        default: null
        constraints: "0.00 <= value <= 100.00; 2 decimal places"
      - name: status
        type: enum
        source: computed
        description: "Cycle lifecycle state; see state_machines MoldingCycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, OVEN_RUNNING, COOLING, DEMOLDED, ABORTED}"
      - name: abort_reason
        type: enum
        source: computed
        description: "Why the cycle was aborted; null unless status is ABORTED"
        default: null
        constraints: "one of {OPERATOR_ABORT, LOT_QUARANTINED, LOT_EXPIRED, ORDER_CANCELLED, STATION_DOWN, BAY_DOWN, MOLD_SERVICE_DUE}"

  # ---------------------------------------------------------------------------
  # FinishedUnit — PARALLEL STATE DIMENSIONS on one row:
  #   build_status     (production axis, cyclic via the REWORK loop)
  #   logistics_status (storage/freight axis)
  # Created only as a cascade side effect of MoldingCycle demold, so its only
  # discovery channel is GET /finished-units.
  # ---------------------------------------------------------------------------
  - name: FinishedUnit
    parent: null
    common_fields: true
    fields:
      - name: molding_cycle_id
        type: string
        source: system
        description: "FK -> MoldingCycle.id; the cycle that produced this hull"
        constraints: "set by the demold cascade; immutable"
      - name: product_model_id
        type: string
        source: system
        description: "FK -> ProductModel.id; copied from the cycle's mold at demold"
        constraints: "set by the demold cascade; immutable"
      - name: warehouse_id
        type: string
        source: computed
        description: "FK -> Warehouse.id; site the unit is stored in; null unless logistics_status is STORED, LOADED or IN_TRANSIT"
        default: null
        constraints: "always equals the producing order's target_warehouse_id while non-null"
      - name: outfitted_by_technician_id
        type: string
        source: computed
        description: "FK -> Technician.id; assembly technician who completed outfitting; null before the first outfit"
        default: null
        constraints: "segregation of duties: may never equal inspected_by_technician_id"
      - name: inspected_by_technician_id
        type: string
        source: computed
        description: "FK -> Technician.id; quality inspector who recorded the most recent inspection; null before the first inspection"
        default: null
        constraints: "segregation of duties: may never equal outfitted_by_technician_id nor MoldingCycle.operator_technician_id"
      - name: hull_serial
        type: string
        source: computed
        description: "Deterministic serial '<order_code>-<cavity_index>-<build_seq>' where build_seq is the 1-based position of this unit within its order ordered by created_at ASC then cavity_index ASC"
        constraints: "globally unique; never derived from id"
      - name: cavity_index
        type: integer
        source: system
        description: "1-based cavity position within the producing mold"
        constraints: "1 <= value <= Mold.cavity_count"
      - name: trim_waste_kg
        type: number
        source: computed
        description: "Flash and trim scrap mass recorded at the most recent trim"
        default: 0.000
        constraints: ">= 0; 3 decimal places"
      - name: hardware_kit_serial
        type: string
        source: computed
        description: "Serial of the hardware/outfitting kit installed at the most recent outfit; null before the first outfit"
        default: null
        constraints: "3-32 chars"
      - name: wall_thickness_points
        type: array
        source: computed
        description: "Measured wall-thickness readings in millimetres from the most recent inspection; empty array before the first inspection"
        default: []
        constraints: "each element > 0 with 2 decimal places; length >= 6 -> otherwise ERR_INSUFFICIENT_MEASUREMENTS"
      - name: mean_wall_thickness_mm
        type: number
        source: computed
        description: "Rounded mean of wall_thickness_points; see calculations.wall_thickness_distribution"
        default: null
        constraints: "3 decimal places"
      - name: wall_sd_mm
        type: number
        source: computed
        description: "Population standard deviation about the ROUNDED mean; see calculations.wall_thickness_distribution"
        default: null
        constraints: "3 decimal places"
      - name: wall_cv_pct
        type: number
        source: computed
        description: "Coefficient of variation from the rounded sd and rounded mean; see calculations.wall_thickness_distribution"
        default: null
        constraints: "2 decimal places"
      - name: min_wall_thickness_mm
        type: number
        source: computed
        description: "Smallest element of wall_thickness_points, unrounded; see calculations.wall_thickness_distribution"
        default: null
        constraints: "2 decimal places"
      - name: impact_test_joules
        type: number
        source: computed
        description: "Joules survived on the drop-impact rig at the most recent inspection"
        default: null
        constraints: ">= 0; 2 decimal places"
      - name: cosmetic_defect_grade
        type: enum
        source: computed
        description: "Cosmetic grade assigned at the most recent inspection"
        default: null
        constraints: "one of {A, B, C, REJECT}"
      - name: final_warpage_index
        type: number
        source: computed
        description: "FINAL variant of calculations.cycle_warpage_index, stamped at inspection from actual cooling minutes plus the wall-CV term; null before the first inspection"
        default: null
        constraints: "0.00 <= value <= 100.00; 2 decimal places"
      - name: inspection_verdict
        type: enum
        source: computed
        description: "Outcome of the most recent inspection; see calculations.inspection_verdict"
        default: PENDING
        constraints: "one of {PENDING, PASS, REWORK, SCRAP}"
      - name: rework_count
        type: integer
        source: computed
        description: "Number of times this unit has entered build_status REWORK"
        default: 0
        constraints: "0 <= value <= 2; a third REWORK verdict forces build_status SCRAPPED instead"
      - name: build_status
        type: enum
        source: computed
        description: "Production axis; see state_machines FinishedUnit (build_status)"
        default: DEMOLDED
        constraints: "one of {DEMOLDED, TRIMMED, OUTFITTED, SELLABLE, REWORK, SCRAPPED}"
      - name: logistics_status
        type: enum
        source: computed
        description: "Storage and freight axis, independent of build_status; see state_machines FinishedUnit (logistics_status)"
        default: UNALLOCATED
        constraints: "one of {UNALLOCATED, STORED, LOADED, IN_TRANSIT, DELIVERED}"
      - name: storage_zone_code
        type: string
        source: computed
        description: "Zone chosen by the server at storage time; see calculations.storage_zone_selection; null unless logistics_status is STORED, LOADED or IN_TRANSIT"
        default: null
        constraints: "must be a zone_code of the unit's warehouse"
      - name: stored_footprint_cube_m3
        type: number
        source: computed
        description: "Nest-adjusted cube this unit occupies in its zone; see calculations.storage_footprint; 0 when not stored"
        default: 0.0000
        constraints: ">= 0; 4 decimal places"
      - name: is_zone_anchor
        type: boolean
        source: computed
        description: "True when this unit is the full-cube anchor for its (warehouse, zone, model) nest group"
        default: false
        constraints: "at most one anchor per (warehouse_id, storage_zone_code, product_model_id) group among units with logistics_status STORED"
      - name: stored_at
        type: datetime
        source: computed
        description: "Logical-clock instant the unit entered logistics_status STORED; null when never stored; cleared on release"
        default: null
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: demand_bucket_id
        type: string
        source: computed
        description: "FK -> DemandForecastBucket.id; bucket this stored unit is charged against; null when not stored or when the producing order had no bucket"
        default: null
        constraints: "copied from the producing ProductionOrder.demand_bucket_id at storage time"
      - name: delivered_at
        type: datetime
        source: computed
        description: "Logical-clock instant the unit entered logistics_status DELIVERED; the warranty clock origin; null before delivery"
        default: null
        constraints: "ISO 8601 UTC with three fractional digits"

  # ---------------------------------------------------------------------------
  # Shipment — trailer. Cube utilisation gates sealing; the freight calculation
  # has QUOTED (nested cube) and BILLED (gross cube) variants.
  # ---------------------------------------------------------------------------
  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - name: shipment_code
        type: string
        source: input
        description: "Load/BOL code"
        constraints: "required; 3-32 chars; globally unique; duplicate -> ERR_DUPLICATE_CODE"
      - name: origin_warehouse_id
        type: string
        source: input
        description: "FK -> Warehouse.id; the site the trailer loads from"
        constraints: "required; must exist -> ERR_WAREHOUSE_NOT_FOUND"
      - name: destination_zone
        type: enum
        source: input
        description: "Freight rate zone of the delivery address"
        constraints: "required; one of {Z1, Z2, Z3}"
      - name: carrier_code
        type: string
        source: input
        description: "Carrier SCAC-style code"
        constraints: "required; 2-16 chars"
      - name: trailer_cube_capacity_m3
        type: number
        source: input
        description: "Usable cube of the trailer"
        constraints: "required; > 0; 4 decimal places"
      - name: trailer_max_payload_kg
        type: number
        source: input
        description: "Legal payload of the trailer"
        constraints: "required; > 0; 3 decimal places"
      - name: loaded_cube_m3
        type: number
        source: computed
        description: "Sum of line_gross_cube_m3 over LOADED lines; see calculations.shipment_cube_rollup"
        default: 0.0000
        constraints: ">= 0; 4 decimal places"
      - name: nested_cube_m3
        type: number
        source: computed
        description: "Sum of line_nested_cube_m3 over LOADED lines; see calculations.shipment_cube_rollup"
        default: 0.0000
        constraints: ">= 0; 4 decimal places"
      - name: loaded_weight_kg
        type: number
        source: computed
        description: "Sum of ProductModel.unit_weight_kg over LOADED lines; see calculations.shipment_cube_rollup"
        default: 0.000
        constraints: ">= 0; 3 decimal places"
      - name: cube_utilization_pct
        type: number
        source: computed
        description: "nested_cube_m3 as a percentage of trailer_cube_capacity_m3; see calculations.shipment_cube_rollup"
        default: 0.00
        constraints: ">= 0; 2 decimal places"
      - name: density_kg_per_m3
        type: number
        source: computed
        description: "loaded_weight_kg / loaded_cube_m3; drives the low-density surcharge; 0.00 when no lines are LOADED"
        default: 0.00
        constraints: ">= 0; 2 decimal places"
      - name: quoted_freight_cents
        type: integer
        source: computed
        description: "QUOTED variant of calculations.shipment_freight, stamped at seal from nested cube; null before the first seal"
        default: null
        constraints: ">= 0"
      - name: billed_freight_cents
        type: integer
        source: computed
        description: "BILLED variant of calculations.shipment_freight, stamped at delivery from gross cube; null before delivery"
        default: null
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Trailer lifecycle state; see state_machines Shipment"
        default: PLANNED
        constraints: "one of {PLANNED, LOADING, SEALED, IN_TRANSIT, DELIVERED, CANCELLED}"
      - name: sealed_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent seal; cleared by unseal"
        default: null
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: departed_at
        type: datetime
        source: computed
        description: "Logical-clock instant the trailer departed"
        default: null
        constraints: "ISO 8601 UTC with three fractional digits"
      - name: delivered_at
        type: datetime
        source: computed
        description: "Logical-clock instant the trailer was delivered"
        default: null
        constraints: "ISO 8601 UTC with three fractional digits"

  # ---------------------------------------------------------------------------
  # ShipmentLine — junction realising the many-to-many between Shipment and
  # FinishedUnit, and the unit of per-line freight rounding.
  # ---------------------------------------------------------------------------
  - name: ShipmentLine
    parent: null
    common_fields: true
    fields:
      - name: shipment_id
        type: string
        source: input
        description: "FK -> Shipment.id; the trailer this line loads onto"
        constraints: "required; must exist -> ERR_SHIPMENT_NOT_FOUND"
      - name: finished_unit_id
        type: string
        source: input
        description: "FK -> FinishedUnit.id; the hull loaded by this line"
        constraints: "required; must exist -> ERR_FINISHED_UNIT_NOT_FOUND; at most one LOADED line per unit -> ERR_UNIT_INVALID_LOGISTICS_STATE"
      - name: nest_position
        type: integer
        source: computed
        description: "1-based position of this line within its (shipment, product_model) nest group ordered by created_at ASC then FinishedUnit.hull_serial ASC; see calculations.shipment_cube_rollup"
        default: 1
        constraints: ">= 1"
      - name: line_gross_cube_m3
        type: number
        source: computed
        description: "ProductModel.gross_cube_m3 of the loaded unit"
        default: 0.0000
        constraints: ">= 0; 4 decimal places"
      - name: line_nested_cube_m3
        type: number
        source: computed
        description: "Nest-adjusted cube of this line; see calculations.shipment_cube_rollup"
        default: 0.0000
        constraints: ">= 0; 4 decimal places"
      - name: line_freight_cents
        type: integer
        source: computed
        description: "Per-line freight charge rounded to whole cents before summation; see calculations.shipment_freight"
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Line disposition; see state_machines ShipmentLine"
        default: LOADED
        constraints: "one of {LOADED, REMOVED}"

  # ---------------------------------------------------------------------------
  # WarrantyClaim — PARALLEL STATE DIMENSIONS on one row:
  #   claim_status         (adjudication axis, with a revert edge)
  #   storage_review_status (storage-guidance axis)
  # Approval draws on the shared ProductModel warranty reserve, so ProductModel
  # is the OCC parent of the approve endpoint.
  # ---------------------------------------------------------------------------
  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: claim_code
        type: string
        source: input
        description: "Claim reference code"
        constraints: "required; 3-32 chars; globally unique; duplicate -> ERR_DUPLICATE_CODE"
      - name: finished_unit_id
        type: string
        source: input
        description: "FK -> FinishedUnit.id; the delivered hull the claim is about"
        constraints: "required; must exist -> ERR_FINISHED_UNIT_NOT_FOUND"
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the claimant"
        constraints: "required; must exist -> ERR_CUSTOMER_NOT_FOUND; must equal the acting X-User-ID for role Customer -> ERR_CUSTOMER_SCOPE_VIOLATION"
      - name: claim_type
        type: enum
        source: input
        description: "Nature of the defect claimed"
        constraints: "required; one of {HULL_DEFORMATION, HARDWARE, COSMETIC}"
      - name: reported_deformation_mm
        type: number
        source: input
        description: "Maximum hull deviation the customer measured; required and meaningful only for HULL_DEFORMATION"
        default: 0.00
        constraints: ">= 0; 2 decimal places; for claim_type HULL_DEFORMATION must be >= DEFORMATION_THRESHOLD_MM -> ERR_DEFORMATION_BELOW_THRESHOLD"
      - name: storage_description
        type: string
        source: input
        description: "Customer's account of how the hull was stored"
        constraints: "required; 10-500 chars"
      - name: claim_status
        type: enum
        source: computed
        description: "Adjudication axis; see state_machines WarrantyClaim (claim_status)"
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, APPROVED, DENIED, WITHDRAWN, VOIDED}"
      - name: storage_review_status
        type: enum
        source: computed
        description: "Storage-guidance axis, independent of claim_status; see state_machines WarrantyClaim (storage_review_status)"
        default: NOT_STARTED
        constraints: "one of {NOT_STARTED, GUIDANCE_VERIFIED, GUIDANCE_VIOLATED, WAIVED}"
      - name: months_in_service
        type: integer
        source: computed
        description: "Whole months from FinishedUnit.delivered_at to the logical clock; see calculations.warranty_payout"
        default: 0
        constraints: ">= 0"
      - name: payout_basis
        type: enum
        source: computed
        description: "Which warranty variant was applied; copied from ProductModel.warranty_basis at approval; null before approval"
        default: null
        constraints: "one of {PRO_RATA_AGE, FLAT_SCHEDULE}"
      - name: pre_fee_gross_cents
        type: integer
        source: computed
        description: "Gross entitlement before deductions; see calculations.warranty_payout; null before approval"
        default: null
        constraints: ">= 0"
      - name: storage_deduction_cents
        type: integer
        source: computed
        description: "Deduction applied when storage_review_status is GUIDANCE_VIOLATED; see calculations.warranty_payout; null before approval"
        default: null
        constraints: ">= 0"
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "Tiered handling fee selected from pre_fee_gross_cents BEFORE deductions; see calculations.warranty_payout; null before approval"
        default: null
        constraints: ">= 0"
      - name: net_payout_cents
        type: integer
        source: computed
        description: "Amount charged to ProductModel.warranty_reserve_cents; see calculations.warranty_payout; null before approval"
        default: null
        constraints: ">= 0"
      - name: denial_reason
        type: enum
        source: computed
        description: "Why the claim was denied or voided; null otherwise"
        default: null
        constraints: "one of {STORAGE_GUIDANCE_VIOLATED, NOT_A_MANUFACTURING_DEFECT, TERM_EXPIRED, APPROVAL_VOIDED}"

# =============================================================================
# §1.2 State Machine Table
#
# Non-linear shapes at a glance:
#   ProductionOrder            compound + cyclic (COMPLETE -> IN_PRODUCTION)
#   MoldingCycle               branching (SCHEDULED -> {OVEN_RUNNING, ABORTED})
#   FinishedUnit               PARALLEL: build_status x logistics_status, and
#                              build_status is cyclic (REWORK -> TRIMMED)
#   WarrantyClaim              PARALLEL: claim_status x storage_review_status,
#                              and claim_status has a revert (UNDER_REVIEW ->
#                              SUBMITTED)
#   Mold, ResinLot, Warehouse  cyclic
#   Shipment                   branching + revert (SEALED -> LOADING)
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: ProductionOrder
    state_field: status
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: READY_TO_SCHEDULE
        trigger: "POST /production-orders/{production_order_id}/release"
        actor: PlantAdmin
        preconditions:
          - "order.status == DRAFT"
          - "order.ordered_qty >= 1"
          - "Warehouse(order.target_warehouse_id).posture != FROZEN -> ERR_WAREHOUSE_FROZEN"
          - "count of Mold rows where product_model_id == order.product_model_id and status IN {AVAILABLE, IN_CYCLE, MAINTENANCE} >= 1 -> ERR_NO_ELIGIBLE_MOLD"
          - "count of ResinLot rows in status AVAILABLE qualified for order.product_model_id (see calculations.qualified_resin_lot_count) >= 1 -> ERR_RESIN_INSUFFICIENT"
        side_effects:
          - "blocked_reason set to null"
          - "recompute calculations.production_order_cost (all zero at this point: no CONSUMED charges, no DEMOLDED cycles)"
          - "increments ProductionOrder.version by 1"
      - from: READY_TO_SCHEDULE
        to: IN_PRODUCTION
        trigger: "POST /molding-cycles (first cycle created against this order)"
        actor: MoldingOperator
        preconditions:
          - "order.status == READY_TO_SCHEDULE"
          - "the created MoldingCycle passed every §1.4 check for POST /molding-cycles"
        side_effects:
          - "increments ProductionOrder.version by 1 (also the OCC bump for concurrency_rules[cycle-create-stale-order])"
        note: "Cycles created while the order is already IN_PRODUCTION leave status unchanged but still bump version."
      - from: IN_PRODUCTION
        to: COMPLETE
        trigger: "system — recompute of calculations.order_completion_rollup after a FinishedUnit enters build_status SELLABLE"
        actor: system
        preconditions:
          - "order.completed_qty >= order.ordered_qty"
          - "order.status == IN_PRODUCTION"
        side_effects:
          - "recompute calculations.production_order_cost (material, oven energy, tiered overhead, unit cost)"
          - "every MoldingCycle on this order still in status SCHEDULED -> ABORTED with abort_reason ORDER_CANCELLED is NOT performed here; surplus cycles remain schedulable"
          - "increments ProductionOrder.version by 1"
      - from: COMPLETE
        to: IN_PRODUCTION
        trigger: "system — recompute of calculations.order_completion_rollup after a FinishedUnit leaves build_status SELLABLE (CASCADE-D link 3)"
        actor: system
        preconditions:
          - "order.completed_qty < order.ordered_qty"
          - "order.status == COMPLETE"
        side_effects:
          - "recompute calculations.production_order_cost"
          - "increments ProductionOrder.version by 1"
        note: "This edge makes the machine cyclic: COMPLETE -> IN_PRODUCTION -> COMPLETE may repeat with each demotion and re-pass."
      - from: READY_TO_SCHEDULE
        to: BLOCKED_RESIN
        trigger: "system — CASCADE-F link 4 / CASCADE-G link 5: no ResinLot in status AVAILABLE remains qualified for the order's product model"
        actor: system
        preconditions:
          - "order.status IN {READY_TO_SCHEDULE, IN_PRODUCTION}"
          - "order.completed_qty < order.ordered_qty"
          - "calculations.qualified_resin_lot_count for order.product_model_id == 0"
        side_effects:
          - "blocked_reason set to NO_QUALIFIED_RESIN_LOT"
          - "increments ProductionOrder.version by 1"
      - from: IN_PRODUCTION
        to: BLOCKED_RESIN
        trigger: "system — CASCADE-F link 4 / CASCADE-G link 5: no ResinLot in status AVAILABLE remains qualified for the order's product model"
        actor: system
        preconditions:
          - "order.status == IN_PRODUCTION"
          - "order.completed_qty < order.ordered_qty"
          - "calculations.qualified_resin_lot_count for order.product_model_id == 0"
        side_effects:
          - "blocked_reason set to NO_QUALIFIED_RESIN_LOT"
          - "increments ProductionOrder.version by 1"
      - from: BLOCKED_RESIN
        to: READY_TO_SCHEDULE
        trigger: "system — CASCADE-A link 4 / CASCADE-B link 5 / CASCADE-E link 5: a qualified ResinLot returned to status AVAILABLE"
        actor: system
        preconditions:
          - "order.status == BLOCKED_RESIN"
          - "calculations.qualified_resin_lot_count for order.product_model_id >= 1"
          - "Warehouse(order.target_warehouse_id).posture != FROZEN"
        side_effects:
          - "blocked_reason set to null"
          - "increments ProductionOrder.version by 1"
        note: "When the target warehouse is also FROZEN at that moment the order moves BLOCKED_RESIN -> BLOCKED_WAREHOUSE instead (next transition), so the two blocking reasons are ordered rather than ambiguous."
      - from: BLOCKED_RESIN
        to: BLOCKED_WAREHOUSE
        trigger: "system — a qualified ResinLot returned to AVAILABLE while Warehouse(order.target_warehouse_id).posture == FROZEN"
        actor: system
        preconditions:
          - "order.status == BLOCKED_RESIN"
          - "calculations.qualified_resin_lot_count for order.product_model_id >= 1"
          - "Warehouse(order.target_warehouse_id).posture == FROZEN"
        side_effects:
          - "blocked_reason set to WAREHOUSE_FROZEN"
          - "increments ProductionOrder.version by 1"
      - from: READY_TO_SCHEDULE
        to: BLOCKED_WAREHOUSE
        trigger: "system — CASCADE-H link 4: Warehouse(order.target_warehouse_id).posture became FROZEN"
        actor: system
        preconditions:
          - "order.status IN {READY_TO_SCHEDULE, IN_PRODUCTION}"
          - "Warehouse(order.target_warehouse_id).posture == FROZEN"
        side_effects:
          - "blocked_reason set to WAREHOUSE_FROZEN"
          - "increments ProductionOrder.version by 1"
      - from: IN_PRODUCTION
        to: BLOCKED_WAREHOUSE
        trigger: "system — CASCADE-H link 4: Warehouse(order.target_warehouse_id).posture became FROZEN"
        actor: system
        preconditions:
          - "order.status == IN_PRODUCTION"
          - "Warehouse(order.target_warehouse_id).posture == FROZEN"
        side_effects:
          - "blocked_reason set to WAREHOUSE_FROZEN"
          - "increments ProductionOrder.version by 1"
      - from: BLOCKED_WAREHOUSE
        to: READY_TO_SCHEDULE
        trigger: "system — CASCADE-C link 4: Warehouse(order.target_warehouse_id).posture left FROZEN"
        actor: system
        preconditions:
          - "order.status == BLOCKED_WAREHOUSE"
          - "Warehouse(order.target_warehouse_id).posture IN {NORMAL, RESTRICTED}"
          - "calculations.qualified_resin_lot_count for order.product_model_id >= 1"
        side_effects:
          - "blocked_reason set to null"
          - "increments ProductionOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /production-orders/{production_order_id}/cancel"
        actor: PlantAdmin
        preconditions:
          - "order.status IN {DRAFT, READY_TO_SCHEDULE, BLOCKED_RESIN, BLOCKED_WAREHOUSE, IN_PRODUCTION} -> otherwise ERR_ORDER_ALREADY_TERMINAL"
        side_effects:
          - "every MoldingCycle on this order in status IN {SCHEDULED, OVEN_RUNNING, COOLING} -> ABORTED with abort_reason ORDER_CANCELLED"
          - "each aborted cycle releases its RESERVED ResinCharge rows -> RELEASED with released_reason ORDER_CANCELLED, returning charge_kg from ResinLot.reserved_kg to ResinLot.available_kg"
          - "each lot whose available_kg rose above 0.000 and whose status was DEPLETED -> AVAILABLE"
          - "each Mold left in status IN_CYCLE by an aborted cycle -> AVAILABLE"
          - "increments ProductionOrder.version by 1"
      - from: READY_TO_SCHEDULE
        to: CANCELLED
        trigger: "POST /production-orders/{production_order_id}/cancel"
        actor: PlantAdmin
        preconditions:
          - "order.status IN {DRAFT, READY_TO_SCHEDULE, BLOCKED_RESIN, BLOCKED_WAREHOUSE, IN_PRODUCTION}"
        side_effects:
          - "same cascade as DRAFT -> CANCELLED"
          - "increments ProductionOrder.version by 1"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /production-orders/{production_order_id}/cancel"
        actor: PlantAdmin
        preconditions:
          - "order.status IN {DRAFT, READY_TO_SCHEDULE, BLOCKED_RESIN, BLOCKED_WAREHOUSE, IN_PRODUCTION}"
        side_effects:
          - "same cascade as DRAFT -> CANCELLED"
          - "FinishedUnit rows already produced keep their build_status and logistics_status; they are not scrapped"
          - "increments ProductionOrder.version by 1"
      - from: BLOCKED_RESIN
        to: CANCELLED
        trigger: "POST /production-orders/{production_order_id}/cancel"
        actor: PlantAdmin
        preconditions:
          - "order.status IN {DRAFT, READY_TO_SCHEDULE, BLOCKED_RESIN, BLOCKED_WAREHOUSE, IN_PRODUCTION}"
        side_effects:
          - "same cascade as DRAFT -> CANCELLED"
          - "increments ProductionOrder.version by 1"
      - from: BLOCKED_WAREHOUSE
        to: CANCELLED
        trigger: "POST /production-orders/{production_order_id}/cancel"
        actor: PlantAdmin
        preconditions:
          - "order.status IN {DRAFT, READY_TO_SCHEDULE, BLOCKED_RESIN, BLOCKED_WAREHOUSE, IN_PRODUCTION}"
        side_effects:
          - "same cascade as DRAFT -> CANCELLED"
          - "increments ProductionOrder.version by 1"

  # ---------------------------------------------------------------------------
  - entity: MoldingCycle
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [DEMOLDED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: OVEN_RUNNING
        trigger: "POST /molding-cycles/{molding_cycle_id}/start-oven"
        actor: MoldingOperator
        preconditions:
          - "cycle.status == SCHEDULED -> ERR_CYCLE_INVALID_STATE"
          - "acting X-User-ID == cycle.operator_technician_id -> ERR_ROLE_IDENTITY_MISMATCH"
          - "Technician(cycle.operator_technician_id).status == ACTIVE -> ERR_TECHNICIAN_SUSPENDED"
          - "Mold(cycle.mold_id).status == AVAILABLE -> ERR_MOLD_NOT_AVAILABLE  [CROSS-ENTITY: MoldingCycle depends on Mold]"
          - "OvenStation(cycle.oven_station_id).status == OPERATIONAL -> ERR_OVEN_STATION_DOWN  [CROSS-ENTITY: MoldingCycle depends on OvenStation]"
          - "count of ResinCharge rows for this cycle in status RESERVED >= 1 -> ERR_RESIN_INSUFFICIENT"
          - "every ResinLot referenced by those charges has status AVAILABLE -> ERR_RESIN_LOT_NOT_AVAILABLE"
          - "abs(cycle.charged_mass_kg - Mold(cycle.mold_id).nominal_charge_kg) / Mold.nominal_charge_kg * 100 rounded to 2 dp <= ProductModel.charge_tolerance_pct -> otherwise ERR_CHARGE_MASS_OUT_OF_TOLERANCE"
          - "cycle.cycle_regrind_pct <= ProductModel.max_regrind_pct -> otherwise ERR_REGRIND_LIMIT_EXCEEDED"
          - "ProductModel.min_melt_index_g10min <= cycle.weighted_melt_index_g10min <= ProductModel.max_melt_index_g10min -> otherwise ERR_MELT_INDEX_OUT_OF_RANGE"
        side_effects:
          - "actual_oven_start_at set to the logical clock"
          - "Mold(cycle.mold_id).status -> IN_CYCLE"
          - "every ResinCharge of this cycle in status RESERVED -> CONSUMED; for each, charge_kg moves from ResinLot.reserved_kg to ResinLot.consumed_kg (available_kg unchanged)"
          - "each such ResinLot with available_kg == 0.000 and status AVAILABLE -> DEPLETED"
          - "ProductionOrder(cycle.production_order_id).status READY_TO_SCHEDULE -> IN_PRODUCTION if not already IN_PRODUCTION"
          - "increments MoldingCycle.version by 1"
      - from: OVEN_RUNNING
        to: COOLING
        trigger: "POST /molding-cycles/{molding_cycle_id}/enter-cooling"
        actor: MoldingOperator
        preconditions:
          - "cycle.status == OVEN_RUNNING -> ERR_CYCLE_INVALID_STATE"
          - "acting X-User-ID == cycle.operator_technician_id -> ERR_ROLE_IDENTITY_MISMATCH"
          - "CoolingBay(cycle.cooling_bay_id).status == OPERATIONAL -> ERR_COOLING_BAY_DOWN  [CROSS-ENTITY: MoldingCycle depends on CoolingBay]"
          - "count of MoldingCycle rows with cooling_bay_id == cycle.cooling_bay_id and status == COOLING < CoolingBay.concurrent_slot_capacity -> otherwise ERR_COOLING_BAY_CAPACITY_EXCEEDED"
        side_effects:
          - "actual_oven_end_at set to the logical clock"
          - "actual_oven_minutes recomputed as floor((actual_oven_end_at - actual_oven_start_at) seconds / 60)"
          - "increments MoldingCycle.version by 1"
      - from: COOLING
        to: DEMOLDED
        trigger: "POST /molding-cycles/{molding_cycle_id}/demold"
        actor: MoldingOperator
        preconditions:
          - "cycle.status == COOLING -> ERR_CYCLE_INVALID_STATE"
          - "acting X-User-ID == cycle.operator_technician_id -> ERR_ROLE_IDENTITY_MISMATCH"
          - "floor((logical clock - cycle.actual_oven_end_at) seconds / 60) >= ProductModel.min_cooling_minutes -> otherwise ERR_COOLING_TIME_INSUFFICIENT (equality passes)"
        side_effects:
          - "actual_cooling_end_at set to the logical clock; actual_cooling_minutes recomputed"
          - "provisional_warpage_index set from calculations.cycle_warpage_index variant PROVISIONAL"
          - "Mold(cycle.mold_id).status IN_CYCLE -> AVAILABLE"
          - "Mold(cycle.mold_id).cycles_since_service incremented by 1 (calculations.mold_service_counter)"
          - "CASCADE-B link 1: BECAUSE cycles_since_service reached service_interval_cycles, Mold.status AVAILABLE -> MAINTENANCE"
          - "CASCADE-B link 2: BECAUSE that Mold is in MAINTENANCE, every other MoldingCycle on it in status SCHEDULED -> ABORTED with abort_reason MOLD_SERVICE_DUE"
          - "CASCADE-B link 3: BECAUSE those cycles aborted, their RESERVED ResinCharge rows -> RELEASED with released_reason MOLD_SERVICE_DUE, moving charge_kg from ResinLot.reserved_kg back to ResinLot.available_kg"
          - "CASCADE-B link 4: BECAUSE those lots' available_kg rose above 0.000, each lot in status DEPLETED -> AVAILABLE"
          - "CASCADE-B link 5: BECAUSE a qualified lot returned to AVAILABLE, every ProductionOrder in status BLOCKED_RESIN qualified for it -> READY_TO_SCHEDULE"
          - "Mold(cycle.mold_id).cavity_count FinishedUnit rows created with build_status DEMOLDED, logistics_status UNALLOCATED, inspection_verdict PENDING, cavity_index 1..cavity_count, hull_serial per entities.FinishedUnit.hull_serial"
          - "increments MoldingCycle.version by 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /molding-cycles/{molding_cycle_id}/abort"
        actor: MoldingOperator
        preconditions:
          - "cycle.status IN {SCHEDULED, OVEN_RUNNING, COOLING} -> otherwise ERR_CYCLE_INVALID_STATE"
          - "acting X-User-ID == cycle.operator_technician_id -> ERR_ROLE_IDENTITY_MISMATCH"
        side_effects:
          - "abort_reason set to OPERATOR_ABORT"
          - "CASCADE-A link 2: BECAUSE the cycle is ABORTED, every ResinCharge of this cycle in status RESERVED -> RELEASED with released_reason CYCLE_ABORTED, moving charge_kg from ResinLot.reserved_kg to ResinLot.available_kg"
          - "CASCADE-A link 3: BECAUSE those lots' available_kg rose above 0.000, each lot in status DEPLETED -> AVAILABLE"
          - "CASCADE-A link 4: BECAUSE a qualified lot returned to AVAILABLE, every ProductionOrder in status BLOCKED_RESIN qualified for it -> READY_TO_SCHEDULE"
          - "increments MoldingCycle.version by 1"
        note: "Divergent branch of the SCHEDULED fork: the OVEN_RUNNING branch consumes resin and seizes the mold; the ABORTED branch releases resin and leaves the mold untouched."
      - from: OVEN_RUNNING
        to: ABORTED
        trigger: "POST /molding-cycles/{molding_cycle_id}/abort"
        actor: MoldingOperator
        preconditions:
          - "cycle.status IN {SCHEDULED, OVEN_RUNNING, COOLING}"
          - "acting X-User-ID == cycle.operator_technician_id -> ERR_ROLE_IDENTITY_MISMATCH"
        side_effects:
          - "abort_reason set to OPERATOR_ABORT"
          - "Mold(cycle.mold_id).status IN_CYCLE -> AVAILABLE; cycles_since_service NOT incremented (no part was produced)"
          - "ResinCharge rows already in status CONSUMED are NOT restored: consumed_kg stays on the lot (scrapped shot)"
          - "no FinishedUnit rows are created"
          - "increments MoldingCycle.version by 1"
        note: "Compensation is asymmetric by design: aborting from SCHEDULED restores the full lot ledger, aborting from OVEN_RUNNING or COOLING does not."
      - from: COOLING
        to: ABORTED
        trigger: "POST /molding-cycles/{molding_cycle_id}/abort"
        actor: MoldingOperator
        preconditions:
          - "cycle.status IN {SCHEDULED, OVEN_RUNNING, COOLING}"
          - "acting X-User-ID == cycle.operator_technician_id -> ERR_ROLE_IDENTITY_MISMATCH"
        side_effects:
          - "abort_reason set to OPERATOR_ABORT"
          - "Mold(cycle.mold_id).status IN_CYCLE -> AVAILABLE; cycles_since_service NOT incremented"
          - "no FinishedUnit rows are created"
          - "increments MoldingCycle.version by 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "system — CASCADE-B link 2 (mold service due), CASCADE-E link 2 (oven station DOWN), CASCADE-F link 3 (resin lot quarantined), CASCADE-G link 4 (resin lot expired), ProductionOrder cancel"
        actor: system
        preconditions:
          - "cycle.status == SCHEDULED"
        side_effects:
          - "abort_reason set to MOLD_SERVICE_DUE | STATION_DOWN | LOT_QUARANTINED | LOT_EXPIRED | ORDER_CANCELLED matching the originating cascade"
          - "every ResinCharge of this cycle in status RESERVED -> RELEASED with the matching released_reason, returning charge_kg from ResinLot.reserved_kg to ResinLot.available_kg"
          - "increments MoldingCycle.version by 1"

  # ---------------------------------------------------------------------------
  - entity: ResinCharge
    state_field: status
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "POST /molding-cycles/{molding_cycle_id}/start-oven"
        actor: MoldingOperator
        preconditions:
          - "charge.status == RESERVED"
          - "MoldingCycle(charge.molding_cycle_id).status == SCHEDULED"
        side_effects:
          - "charge_kg moves from ResinLot.reserved_kg to ResinLot.consumed_kg; available_kg unchanged"
          - "increments ResinCharge.version by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /resin-charges/{resin_charge_id}/release, or system — MoldingCycle abort (any cause), ResinLot quarantine (CASCADE-F link 2), ResinLot expiry (CASCADE-G link 3), ProductionOrder cancel"
        actor: "ResinTechnician (manual release) | system (every cascade cause)"
        preconditions:
          - "charge.status == RESERVED"
        side_effects:
          - "released_reason set to CYCLE_ABORTED | LOT_QUARANTINED | LOT_EXPIRED | ORDER_CANCELLED | STATION_DOWN | MOLD_SERVICE_DUE matching the cause"
          - "charge_kg moves from ResinLot.reserved_kg back to ResinLot.available_kg — the compensating half of the resin-mass invariant"
          - "MoldingCycle.charged_mass_kg, weighted_melt_index_g10min and cycle_regrind_pct recomputed over the remaining RESERVED/CONSUMED charges"
          - "increments ResinCharge.version by 1"

  # ---------------------------------------------------------------------------
  # PARALLEL DIMENSION 1 of 2 on FinishedUnit. Cyclic via REWORK -> TRIMMED.
  # ---------------------------------------------------------------------------
  - entity: FinishedUnit
    state_field: build_status
    initial_state: DEMOLDED
    terminal_states: [SCRAPPED]
    transitions:
      - from: DEMOLDED
        to: TRIMMED
        trigger: "POST /finished-units/{finished_unit_id}/trim"
        actor: AssemblyTechnician
        preconditions:
          - "unit.build_status IN {DEMOLDED, REWORK} -> otherwise ERR_UNIT_INVALID_BUILD_STATE"
          - "unit.logistics_status == UNALLOCATED -> otherwise ERR_UNIT_NOT_REINSPECTABLE  [PARALLEL-AXIS GUARD]"
          - "acting X-User-ID resolves to a Technician with role_code ASSEMBLY_TECH -> ERR_ROLE_IDENTITY_MISMATCH"
          - "that Technician.status == ACTIVE -> ERR_TECHNICIAN_SUSPENDED"
        side_effects:
          - "trim_waste_kg set from the request body"
          - "increments FinishedUnit.version by 1"
      - from: REWORK
        to: TRIMMED
        trigger: "POST /finished-units/{finished_unit_id}/trim"
        actor: AssemblyTechnician
        preconditions:
          - "unit.build_status IN {DEMOLDED, REWORK}"
          - "unit.logistics_status == UNALLOCATED -> otherwise ERR_UNIT_NOT_REINSPECTABLE"
          - "acting X-User-ID resolves to a Technician with role_code ASSEMBLY_TECH -> ERR_ROLE_IDENTITY_MISMATCH"
        side_effects:
          - "trim_waste_kg overwritten with the new value"
          - "hardware_kit_serial cleared to null (outfitting must be redone after rework trimming)"
          - "increments FinishedUnit.version by 1"
        note: "The rework loop edge — this is what makes the build_status machine cyclic."
      - from: TRIMMED
        to: OUTFITTED
        trigger: "POST /finished-units/{finished_unit_id}/outfit"
        actor: AssemblyTechnician
        preconditions:
          - "unit.build_status == TRIMMED -> otherwise ERR_UNIT_INVALID_BUILD_STATE"
          - "unit.logistics_status == UNALLOCATED -> otherwise ERR_UNIT_NOT_REINSPECTABLE"
          - "acting X-User-ID resolves to a Technician with role_code ASSEMBLY_TECH -> ERR_ROLE_IDENTITY_MISMATCH"
          - "that Technician.status == ACTIVE -> ERR_TECHNICIAN_SUSPENDED"
          - "FIXTURE_ASSEMBLY is an element of that Technician.certifications -> otherwise ERR_TECHNICIAN_NOT_CERTIFIED"
          - "acting X-User-ID != unit.inspected_by_technician_id -> otherwise ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "outfitted_by_technician_id set to the acting X-User-ID"
          - "hardware_kit_serial set from the request body"
          - "increments FinishedUnit.version by 1"
      - from: OUTFITTED
        to: SELLABLE
        trigger: "POST /finished-units/{finished_unit_id}/inspect (verdict PASS)"
        actor: QualityInspector
        preconditions:
          - "unit.build_status IN {OUTFITTED, SELLABLE} -> otherwise ERR_UNIT_INVALID_BUILD_STATE"
          - "unit.logistics_status == UNALLOCATED -> otherwise ERR_UNIT_NOT_REINSPECTABLE  [PARALLEL-AXIS GUARD]"
          - "acting X-User-ID resolves to a Technician with role_code QUALITY_INSPECTOR -> ERR_ROLE_IDENTITY_MISMATCH"
          - "that Technician.status == ACTIVE -> ERR_TECHNICIAN_SUSPENDED"
          - "WALL_GAUGE and IMPACT_RIG are both elements of that Technician.certifications -> otherwise ERR_TECHNICIAN_NOT_CERTIFIED"
          - "acting X-User-ID != MoldingCycle(unit.molding_cycle_id).operator_technician_id -> otherwise ERR_SEGREGATION_OF_DUTIES"
          - "acting X-User-ID != unit.outfitted_by_technician_id -> otherwise ERR_SEGREGATION_OF_DUTIES"
          - "length(wall_thickness_points) >= 6 -> otherwise ERR_INSUFFICIENT_MEASUREMENTS"
          - "calculations.inspection_verdict yields PASS"
        side_effects:
          - "wall_thickness_points, impact_test_joules, cosmetic_defect_grade stored from the request body"
          - "mean_wall_thickness_mm, wall_sd_mm, wall_cv_pct, min_wall_thickness_mm set per calculations.wall_thickness_distribution"
          - "final_warpage_index set from calculations.cycle_warpage_index variant FINAL"
          - "inspection_verdict -> PASS; inspected_by_technician_id set to the acting X-User-ID"
          - "ProductionOrder.completed_qty recomputed (calculations.order_completion_rollup); order IN_PRODUCTION -> COMPLETE when completed_qty >= ordered_qty"
          - "increments FinishedUnit.version by 1"
      - from: OUTFITTED
        to: REWORK
        trigger: "POST /finished-units/{finished_unit_id}/inspect (verdict REWORK)"
        actor: QualityInspector
        preconditions:
          - "unit.build_status IN {OUTFITTED, SELLABLE}"
          - "unit.logistics_status == UNALLOCATED -> otherwise ERR_UNIT_NOT_REINSPECTABLE"
          - "same identity, certification and segregation-of-duties preconditions as OUTFITTED -> SELLABLE"
          - "calculations.inspection_verdict yields REWORK"
          - "unit.rework_count < 2 (a REWORK verdict at rework_count == 2 routes to SCRAPPED instead)"
        side_effects:
          - "measurement fields and final_warpage_index stored exactly as on the PASS edge"
          - "inspection_verdict -> REWORK; rework_count incremented by 1; inspected_by_technician_id set to the acting X-User-ID"
          - "hardware_kit_serial cleared to null; outfitted_by_technician_id retained for the segregation-of-duties history"
          - "increments FinishedUnit.version by 1"
      - from: SELLABLE
        to: REWORK
        trigger: "POST /finished-units/{finished_unit_id}/inspect (verdict REWORK on a re-inspection)"
        actor: QualityInspector
        preconditions:
          - "unit.build_status == SELLABLE"
          - "unit.logistics_status == UNALLOCATED -> otherwise ERR_UNIT_NOT_REINSPECTABLE"
          - "same identity, certification and segregation-of-duties preconditions as OUTFITTED -> SELLABLE"
          - "calculations.inspection_verdict yields REWORK"
          - "unit.rework_count < 2"
        side_effects:
          - "CASCADE-D link 1: inspection_verdict -> REWORK; rework_count incremented by 1"
          - "CASCADE-D link 2: BECAUSE the unit left build_status SELLABLE, ProductionOrder.completed_qty is recomputed downward (calculations.order_completion_rollup)"
          - "CASCADE-D link 3: BECAUSE completed_qty fell below ordered_qty, the order's status COMPLETE -> IN_PRODUCTION"
          - "increments FinishedUnit.version by 1"
        note: "Demotion edge — the reason the ProductionOrder machine is cyclic."
      - from: OUTFITTED
        to: SCRAPPED
        trigger: "POST /finished-units/{finished_unit_id}/inspect (verdict SCRAP, or verdict REWORK at rework_count == 2)"
        actor: QualityInspector
        preconditions:
          - "unit.build_status IN {OUTFITTED, SELLABLE}"
          - "unit.logistics_status == UNALLOCATED -> otherwise ERR_UNIT_NOT_REINSPECTABLE"
          - "same identity, certification and segregation-of-duties preconditions as OUTFITTED -> SELLABLE"
          - "calculations.inspection_verdict yields SCRAP, OR yields REWORK while unit.rework_count == 2"
        side_effects:
          - "measurement fields and final_warpage_index stored exactly as on the PASS edge"
          - "inspection_verdict -> SCRAP; inspected_by_technician_id set to the acting X-User-ID"
          - "ProductionOrder.scrapped_qty recomputed; completed_qty recomputed; order COMPLETE -> IN_PRODUCTION when completed_qty falls below ordered_qty"
          - "increments FinishedUnit.version by 1"
      - from: SELLABLE
        to: SCRAPPED
        trigger: "POST /finished-units/{finished_unit_id}/scrap"
        actor: QualityInspector
        preconditions:
          - "unit.build_status IN {DEMOLDED, TRIMMED, OUTFITTED, SELLABLE, REWORK} -> otherwise ERR_UNIT_INVALID_BUILD_STATE"
          - "unit.logistics_status == UNALLOCATED -> otherwise ERR_UNIT_INVALID_LOGISTICS_STATE"
          - "acting X-User-ID resolves to a Technician with role_code QUALITY_INSPECTOR -> ERR_ROLE_IDENTITY_MISMATCH"
          - "acting X-User-ID != MoldingCycle(unit.molding_cycle_id).operator_technician_id -> otherwise ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "inspection_verdict -> SCRAP"
          - "ProductionOrder.scrapped_qty and completed_qty recomputed; order COMPLETE -> IN_PRODUCTION when completed_qty falls below ordered_qty"
          - "increments FinishedUnit.version by 1"
      - from: REWORK
        to: SCRAPPED
        trigger: "POST /finished-units/{finished_unit_id}/scrap"
        actor: QualityInspector
        preconditions:
          - "unit.build_status IN {DEMOLDED, TRIMMED, OUTFITTED, SELLABLE, REWORK}"
          - "unit.logistics_status == UNALLOCATED"
          - "acting X-User-ID resolves to a Technician with role_code QUALITY_INSPECTOR -> ERR_ROLE_IDENTITY_MISMATCH"
        side_effects:
          - "inspection_verdict -> SCRAP"
          - "ProductionOrder.scrapped_qty recomputed"
          - "increments FinishedUnit.version by 1"

  # ---------------------------------------------------------------------------
  # PARALLEL DIMENSION 2 of 2 on FinishedUnit — evolves independently of
  # build_status, with explicit cross-axis guards in both directions.
  # ---------------------------------------------------------------------------
  - entity: FinishedUnit
    state_field: logistics_status
    initial_state: UNALLOCATED
    terminal_states: [DELIVERED]
    transitions:
      - from: UNALLOCATED
        to: STORED
        trigger: "POST /finished-units/{finished_unit_id}/store"
        actor: LogisticsPlanner
        preconditions:
          - "unit.logistics_status == UNALLOCATED -> otherwise ERR_UNIT_INVALID_LOGISTICS_STATE"
          - "unit.build_status == SELLABLE -> otherwise ERR_UNIT_INVALID_BUILD_STATE  [PARALLEL-AXIS GUARD]"
          - "expected_warehouse_version equals Warehouse(order.target_warehouse_id).version -> otherwise ERR_STALE_WAREHOUSE_VERSION"
          - "Warehouse(order.target_warehouse_id).posture != FROZEN -> otherwise ERR_WAREHOUSE_FROZEN  [CROSS-ENTITY: FinishedUnit depends on Warehouse]"
          - "when the producing order has a demand_bucket_id: the logical-clock date is within [window_start_on, window_end_on] inclusive -> otherwise ERR_BUILD_AHEAD_WINDOW_MISMATCH"
          - "when the producing order has a demand_bucket_id: bucket.build_ahead_committed_qty + 1 <= bucket.build_ahead_cap_qty -> otherwise ERR_BUILD_AHEAD_CAP_EXCEEDED"
          - "calculations.storage_zone_selection yields a non-empty candidate set -> otherwise ERR_NO_ELIGIBLE_ZONE"
          - "round(Warehouse.committed_cube_m3 + candidate footprint, 4) <= Warehouse.footprint_capacity_cube_m3 -> otherwise ERR_WAREHOUSE_CUBE_EXCEEDED"
        side_effects:
          - "warehouse_id set to the producing ProductionOrder.target_warehouse_id; demand_bucket_id copied from that order"
          - "storage_zone_code set from calculations.storage_zone_selection; stored_at set to the logical clock"
          - "stored_footprint_cube_m3 and is_zone_anchor set per calculations.storage_footprint"
          - "CASCADE-H link 2: BECAUSE the unit's footprint was added, Warehouse.committed_cube_m3 and utilization_pct are recomputed (calculations.warehouse_footprint_posture)"
          - "CASCADE-H link 3: BECAUSE utilization_pct crossed frozen_threshold_pct, Warehouse.posture -> FROZEN"
          - "CASCADE-H link 4: BECAUSE the posture became FROZEN, every ProductionOrder with target_warehouse_id == that warehouse in status READY_TO_SCHEDULE or IN_PRODUCTION -> BLOCKED_WAREHOUSE with blocked_reason WAREHOUSE_FROZEN"
          - "DemandForecastBucket.build_ahead_committed_qty recomputed (calculations.build_ahead_commitment)"
          - "increments Warehouse.version by 1 and FinishedUnit.version by 1"
      - from: STORED
        to: UNALLOCATED
        trigger: "POST /finished-units/{finished_unit_id}/release-storage"
        actor: LogisticsPlanner
        preconditions:
          - "unit.logistics_status == STORED -> otherwise ERR_UNIT_INVALID_LOGISTICS_STATE"
          - "no ShipmentLine with finished_unit_id == unit.id has status LOADED -> otherwise ERR_UNIT_INVALID_LOGISTICS_STATE"
        side_effects:
          - "CASCADE-C link 1: warehouse_id, storage_zone_code, stored_at and demand_bucket_id cleared to null; stored_footprint_cube_m3 -> 0.0000; is_zone_anchor -> false"
          - "CASCADE-C link 2: BECAUSE the released unit vacated its (warehouse_id, storage_zone_code, product_model_id) nest group as its anchor, the earliest remaining STORED sibling of that group (ordered by stored_at ASC, tie-break hull_serial ASC) is promoted: is_zone_anchor -> true and stored_footprint_cube_m3 recomputed to the full ProductModel.gross_cube_m3"
          - "CASCADE-C link 3: BECAUSE those footprints changed, Warehouse.committed_cube_m3, utilization_pct and posture are recomputed"
          - "CASCADE-C link 4: BECAUSE the posture left FROZEN, every ProductionOrder with target_warehouse_id == that warehouse in status BLOCKED_WAREHOUSE -> READY_TO_SCHEDULE with blocked_reason cleared"
          - "DemandForecastBucket.build_ahead_committed_qty recomputed downward"
          - "increments Warehouse.version by 1 and FinishedUnit.version by 1"
      - from: STORED
        to: LOADED
        trigger: "POST /shipment-lines"
        actor: LogisticsPlanner
        preconditions:
          - "unit.logistics_status == STORED -> otherwise ERR_UNIT_INVALID_LOGISTICS_STATE"
          - "unit.build_status == SELLABLE -> otherwise ERR_UNIT_INVALID_BUILD_STATE  [PARALLEL-AXIS GUARD]"
          - "unit.warehouse_id == Shipment.origin_warehouse_id -> otherwise ERR_WAREHOUSE_MISMATCH  [CROSS-ENTITY: FinishedUnit depends on Shipment]"
          - "Shipment.status IN {PLANNED, LOADING} -> otherwise ERR_SHIPMENT_INVALID_STATE"
          - "expected_shipment_version equals Shipment.version -> otherwise ERR_STALE_SHIPMENT_VERSION"
          - "round(Shipment.nested_cube_m3 + candidate line_nested_cube_m3, 4) <= Shipment.trailer_cube_capacity_m3 -> otherwise ERR_TRAILER_CUBE_EXCEEDED"
          - "round(Shipment.loaded_weight_kg + ProductModel.unit_weight_kg, 3) <= Shipment.trailer_max_payload_kg -> otherwise ERR_TRAILER_PAYLOAD_EXCEEDED"
        side_effects:
          - "a ShipmentLine row is created with status LOADED and nest_position / line cubes per calculations.shipment_cube_rollup"
          - "the unit stays physically in its warehouse zone: warehouse_id, storage_zone_code, stored_footprint_cube_m3 and is_zone_anchor are UNCHANGED, so Warehouse.committed_cube_m3 does not move"
          - "Shipment.status PLANNED -> LOADING; shipment cube/weight/utilisation rollups recomputed"
          - "increments Shipment.version by 1 and FinishedUnit.version by 1"
      - from: LOADED
        to: STORED
        trigger: "POST /shipment-lines/{shipment_line_id}/remove or POST /shipments/{shipment_id}/cancel"
        actor: LogisticsPlanner
        preconditions:
          - "unit.logistics_status == LOADED"
          - "Shipment.status IN {PLANNED, LOADING} -> otherwise ERR_SHIPMENT_INVALID_STATE"
        side_effects:
          - "the ShipmentLine row -> REMOVED; shipment cube/weight/utilisation rollups recomputed; nest_position of the surviving lines of the same product model is recomputed"
          - "Shipment.quoted_freight_cents cleared to null when the shipment was SEALED and is unsealed as part of the same request"
          - "increments Shipment.version by 1 and FinishedUnit.version by 1"
      - from: LOADED
        to: IN_TRANSIT
        trigger: "POST /shipments/{shipment_id}/depart"
        actor: LogisticsPlanner
        preconditions:
          - "unit.logistics_status == LOADED"
          - "Shipment.status == SEALED -> otherwise ERR_SHIPMENT_INVALID_STATE"
        side_effects:
          - "CASCADE-C link 1 (departure variant): warehouse_id retained for audit but storage_zone_code, stored_at, demand_bucket_id cleared; stored_footprint_cube_m3 -> 0.0000; is_zone_anchor -> false"
          - "CASCADE-C link 2: BECAUSE each departing unit vacated its nest group as its anchor, the earliest remaining STORED sibling of that group (stored_at ASC, tie-break hull_serial ASC) is promoted to anchor at full gross cube"
          - "CASCADE-C link 3: BECAUSE those footprints changed, Warehouse.committed_cube_m3, utilization_pct and posture are recomputed"
          - "CASCADE-C link 4: BECAUSE the posture left FROZEN, ProductionOrder rows in BLOCKED_WAREHOUSE for that warehouse -> READY_TO_SCHEDULE"
          - "DemandForecastBucket.build_ahead_committed_qty recomputed downward for each departing unit's bucket"
          - "increments Warehouse.version by 1 and FinishedUnit.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipments/{shipment_id}/deliver"
        actor: LogisticsPlanner
        preconditions:
          - "unit.logistics_status == IN_TRANSIT"
          - "Shipment.status == IN_TRANSIT -> otherwise ERR_SHIPMENT_INVALID_STATE"
        side_effects:
          - "delivered_at set to the logical clock — this is the warranty clock origin"
          - "warehouse_id cleared to null"
          - "increments FinishedUnit.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Mold
    state_field: status
    initial_state: AVAILABLE
    terminal_states: [RETIRED]
    transitions:
      - from: AVAILABLE
        to: IN_CYCLE
        trigger: "POST /molding-cycles/{molding_cycle_id}/start-oven"
        actor: MoldingOperator
        preconditions:
          - "mold.status == AVAILABLE"
        side_effects:
          - "increments Mold.version by 1"
      - from: IN_CYCLE
        to: AVAILABLE
        trigger: "POST /molding-cycles/{molding_cycle_id}/demold or POST /molding-cycles/{molding_cycle_id}/abort"
        actor: MoldingOperator
        preconditions:
          - "mold.status == IN_CYCLE"
        side_effects:
          - "on demold only: cycles_since_service incremented by 1"
          - "increments Mold.version by 1"
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "system — CASCADE-B link 1: cycles_since_service reached service_interval_cycles at demold"
        actor: system
        preconditions:
          - "mold.cycles_since_service >= mold.service_interval_cycles (equality triggers)"
          - "mold.status == AVAILABLE"
        side_effects:
          - "CASCADE-B links 2-5 fire as documented on MoldingCycle COOLING -> DEMOLDED"
          - "increments Mold.version by 1"
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /molds/{mold_id}/service-hold"
        actor: PlantAdmin
        preconditions:
          - "mold.status == AVAILABLE -> otherwise ERR_MOLD_NOT_AVAILABLE"
        side_effects:
          - "every MoldingCycle on this mold in status SCHEDULED -> ABORTED with abort_reason MOLD_SERVICE_DUE, releasing their RESERVED charges"
          - "increments Mold.version by 1"
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /molds/{mold_id}/complete-service"
        actor: PlantAdmin
        preconditions:
          - "mold.status == MAINTENANCE -> otherwise ERR_MOLD_NOT_AVAILABLE"
        side_effects:
          - "cycles_since_service reset to 0"
          - "increments Mold.version by 1"
      - from: AVAILABLE
        to: RETIRED
        trigger: "POST /molds/{mold_id}/retire"
        actor: PlantAdmin
        preconditions:
          - "mold.status IN {AVAILABLE, MAINTENANCE} -> otherwise ERR_MOLD_NOT_AVAILABLE"
          - "count of MoldingCycle rows with mold_id == mold.id and status IN {SCHEDULED, OVEN_RUNNING, COOLING} == 0 -> otherwise ERR_MOLD_HAS_ACTIVE_CYCLES"
        side_effects:
          - "increments Mold.version by 1"
      - from: MAINTENANCE
        to: RETIRED
        trigger: "POST /molds/{mold_id}/retire"
        actor: PlantAdmin
        preconditions:
          - "mold.status IN {AVAILABLE, MAINTENANCE}"
          - "count of MoldingCycle rows with mold_id == mold.id and status IN {SCHEDULED, OVEN_RUNNING, COOLING} == 0 -> otherwise ERR_MOLD_HAS_ACTIVE_CYCLES"
        side_effects:
          - "increments Mold.version by 1"

  # ---------------------------------------------------------------------------
  - entity: ResinLot
    state_field: status
    initial_state: AVAILABLE
    terminal_states: [EXPIRED]
    transitions:
      - from: AVAILABLE
        to: DEPLETED
        trigger: "system — POST /resin-charges or POST /molding-cycles/{molding_cycle_id}/start-oven drove available_kg to exactly 0.000"
        actor: system
        preconditions:
          - "lot.available_kg == 0.000 (boundary: exactly zero depletes; 0.001 does not)"
          - "lot.status == AVAILABLE"
        side_effects:
          - "increments ResinLot.version by 1"
      - from: DEPLETED
        to: AVAILABLE
        trigger: "system — CASCADE-A link 3 / CASCADE-B link 4 / CASCADE-E link 4: a ResinCharge was RELEASED back to this lot"
        actor: system
        preconditions:
          - "lot.available_kg > 0.000"
          - "lot.status == DEPLETED"
        side_effects:
          - "CASCADE-A link 4: every ProductionOrder in BLOCKED_RESIN qualified for this lot -> READY_TO_SCHEDULE (or BLOCKED_WAREHOUSE when the target warehouse is FROZEN)"
          - "increments ResinLot.version by 1"
      - from: AVAILABLE
        to: QUARANTINED
        trigger: "POST /resin-lots/{resin_lot_id}/quarantine"
        actor: QualityInspector
        preconditions:
          - "lot.status IN {AVAILABLE, DEPLETED} -> otherwise ERR_RESIN_LOT_NOT_AVAILABLE"
        side_effects:
          - "CASCADE-F link 2: BECAUSE the lot is QUARANTINED, every ResinCharge drawing on it in status RESERVED -> RELEASED with released_reason LOT_QUARANTINED, returning charge_kg from reserved_kg to available_kg"
          - "CASCADE-F link 3: BECAUSE those charges were released, every MoldingCycle that held them in status SCHEDULED -> ABORTED with abort_reason LOT_QUARANTINED"
          - "CASCADE-F link 4: BECAUSE those cycles aborted and no qualified AVAILABLE lot remains for their orders, each affected ProductionOrder in READY_TO_SCHEDULE or IN_PRODUCTION with completed_qty < ordered_qty -> BLOCKED_RESIN with blocked_reason NO_QUALIFIED_RESIN_LOT"
          - "increments ResinLot.version by 1"
      - from: DEPLETED
        to: QUARANTINED
        trigger: "POST /resin-lots/{resin_lot_id}/quarantine"
        actor: QualityInspector
        preconditions:
          - "lot.status IN {AVAILABLE, DEPLETED}"
        side_effects:
          - "CASCADE-F links 2-4 as above"
          - "increments ResinLot.version by 1"
      - from: QUARANTINED
        to: AVAILABLE
        trigger: "POST /resin-lots/{resin_lot_id}/release-quarantine"
        actor: QualityInspector
        preconditions:
          - "lot.status == QUARANTINED -> otherwise ERR_RESIN_LOT_NOT_AVAILABLE"
          - "lot.available_kg > 0.000 -> otherwise the lot returns to DEPLETED instead (next transition)"
        side_effects:
          - "every ProductionOrder in BLOCKED_RESIN qualified for this lot -> READY_TO_SCHEDULE (or BLOCKED_WAREHOUSE when the target warehouse is FROZEN)"
          - "increments ResinLot.version by 1"
      - from: QUARANTINED
        to: DEPLETED
        trigger: "POST /resin-lots/{resin_lot_id}/release-quarantine"
        actor: QualityInspector
        preconditions:
          - "lot.status == QUARANTINED"
          - "lot.available_kg == 0.000"
        side_effects:
          - "increments ResinLot.version by 1"
      - from: AVAILABLE
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc — CASCADE-G link 2"
        actor: system
        preconditions:
          - "the new logical-clock calendar date (UTC) > lot.expires_on (equality does NOT expire)"
          - "lot.status IN {AVAILABLE, DEPLETED, QUARANTINED}"
        side_effects:
          - "CASCADE-G link 3: BECAUSE the lot EXPIRED, every ResinCharge drawing on it in status RESERVED -> RELEASED with released_reason LOT_EXPIRED, returning charge_kg from reserved_kg to available_kg"
          - "CASCADE-G link 4: BECAUSE those charges were released, every MoldingCycle that held them in status SCHEDULED -> ABORTED with abort_reason LOT_EXPIRED"
          - "CASCADE-G link 5: BECAUSE those cycles aborted and no qualified AVAILABLE lot remains, each affected ProductionOrder -> BLOCKED_RESIN with blocked_reason NO_QUALIFIED_RESIN_LOT"
          - "increments ResinLot.version by 1"
      - from: DEPLETED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc — CASCADE-G link 2"
        actor: system
        preconditions:
          - "the new logical-clock calendar date (UTC) > lot.expires_on"
          - "lot.status IN {AVAILABLE, DEPLETED, QUARANTINED}"
        side_effects:
          - "CASCADE-G links 3-5 as above"
          - "increments ResinLot.version by 1"
      - from: QUARANTINED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc — CASCADE-G link 2"
        actor: system
        preconditions:
          - "the new logical-clock calendar date (UTC) > lot.expires_on"
          - "lot.status IN {AVAILABLE, DEPLETED, QUARANTINED}"
        side_effects:
          - "CASCADE-G links 3-5 as above"
          - "increments ResinLot.version by 1"

  # ---------------------------------------------------------------------------
  # Derived posture — recomputed inside every request that changes any
  # FinishedUnit.stored_footprint_cube_m3 for the site. Cyclic in both
  # directions.
  # ---------------------------------------------------------------------------
  - entity: Warehouse
    state_field: posture
    initial_state: NORMAL
    terminal_states: []
    transitions:
      - from: NORMAL
        to: RESTRICTED
        trigger: "system — recompute of calculations.warehouse_footprint_posture after a footprint change"
        actor: system
        preconditions:
          - "restricted_threshold_pct <= utilization_pct < frozen_threshold_pct (equality at the restricted threshold triggers)"
        side_effects:
          - "no order is blocked; RESTRICTED only forbids creating a new Shipment whose origin_warehouse_id is this site with trailer_cube_capacity_m3 > remaining cube (see §1.4 priority 66)"
          - "increments Warehouse.version by 1"
      - from: RESTRICTED
        to: FROZEN
        trigger: "system — CASCADE-H link 3"
        actor: system
        preconditions:
          - "utilization_pct >= frozen_threshold_pct (equality triggers)"
        side_effects:
          - "CASCADE-H link 4: every ProductionOrder with target_warehouse_id == this site in status READY_TO_SCHEDULE or IN_PRODUCTION -> BLOCKED_WAREHOUSE"
          - "increments Warehouse.version by 1"
      - from: NORMAL
        to: FROZEN
        trigger: "system — CASCADE-H link 3 when a single store crosses both thresholds at once"
        actor: system
        preconditions:
          - "utilization_pct >= frozen_threshold_pct"
        side_effects:
          - "CASCADE-H link 4 as above"
          - "increments Warehouse.version by 1"
      - from: FROZEN
        to: RESTRICTED
        trigger: "system — CASCADE-C link 3"
        actor: system
        preconditions:
          - "restricted_threshold_pct <= utilization_pct < frozen_threshold_pct"
        side_effects:
          - "CASCADE-C link 4: every ProductionOrder with target_warehouse_id == this site in status BLOCKED_WAREHOUSE -> READY_TO_SCHEDULE"
          - "increments Warehouse.version by 1"
      - from: RESTRICTED
        to: NORMAL
        trigger: "system — CASCADE-C link 3"
        actor: system
        preconditions:
          - "utilization_pct < restricted_threshold_pct"
        side_effects:
          - "increments Warehouse.version by 1"
      - from: FROZEN
        to: NORMAL
        trigger: "system — CASCADE-C link 3 when a single release crosses both thresholds at once"
        actor: system
        preconditions:
          - "utilization_pct < restricted_threshold_pct"
        side_effects:
          - "CASCADE-C link 4 as above"
          - "increments Warehouse.version by 1"

  # ---------------------------------------------------------------------------
  - entity: OvenStation
    state_field: status
    initial_state: OPERATIONAL
    terminal_states: []
    transitions:
      - from: OPERATIONAL
        to: DOWN
        trigger: "POST /oven-stations/{oven_station_id}/mark-down — CASCADE-E link 1"
        actor: PlantAdmin
        preconditions:
          - "station.status == OPERATIONAL -> otherwise ERR_OVEN_STATION_DOWN"
        side_effects:
          - "CASCADE-E link 2: BECAUSE the station is DOWN, every MoldingCycle with oven_station_id == station.id in status SCHEDULED -> ABORTED with abort_reason STATION_DOWN"
          - "CASCADE-E link 3: BECAUSE those cycles aborted, every ResinCharge they held in status RESERVED -> RELEASED with released_reason STATION_DOWN, returning charge_kg from reserved_kg to available_kg"
          - "CASCADE-E link 4: BECAUSE available_kg rose above 0.000, every affected ResinLot in status DEPLETED -> AVAILABLE"
          - "CASCADE-E link 5: BECAUSE those lots became AVAILABLE, every ProductionOrder in BLOCKED_RESIN they qualify for -> READY_TO_SCHEDULE (or BLOCKED_WAREHOUSE when the target warehouse posture is FROZEN)"
          - "cycles already in OVEN_RUNNING or COOLING on this station are NOT touched (physical runs finish)"
          - "increments OvenStation.version by 1"
      - from: DOWN
        to: OPERATIONAL
        trigger: "POST /oven-stations/{oven_station_id}/restore"
        actor: PlantAdmin
        preconditions:
          - "station.status == DOWN -> otherwise ERR_OVEN_STATION_ALREADY_OPERATIONAL"
        side_effects:
          - "no cycle is resurrected — aborted cycles stay ABORTED and must be re-scheduled"
          - "increments OvenStation.version by 1"

  # ---------------------------------------------------------------------------
  - entity: CoolingBay
    state_field: status
    initial_state: OPERATIONAL
    terminal_states: []
    transitions:
      - from: OPERATIONAL
        to: DOWN
        trigger: "POST /cooling-bays/{cooling_bay_id}/mark-down"
        actor: PlantAdmin
        preconditions:
          - "bay.status == OPERATIONAL -> otherwise ERR_COOLING_BAY_DOWN"
        side_effects:
          - "every MoldingCycle with cooling_bay_id == bay.id in status SCHEDULED -> ABORTED with abort_reason BAY_DOWN, releasing their RESERVED charges (CASCADE-A links 2-4 then follow)"
          - "cycles already in OVEN_RUNNING or COOLING on this bay are NOT touched"
          - "increments CoolingBay.version by 1"
      - from: DOWN
        to: OPERATIONAL
        trigger: "POST /cooling-bays/{cooling_bay_id}/restore"
        actor: PlantAdmin
        preconditions:
          - "bay.status == DOWN -> otherwise ERR_COOLING_BAY_ALREADY_OPERATIONAL"
        side_effects:
          - "increments CoolingBay.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Technician
    state_field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /technicians/{technician_id}/suspend"
        actor: PlantAdmin
        preconditions:
          - "technician.status == ACTIVE -> otherwise ERR_TECHNICIAN_SUSPENDED"
        side_effects:
          - "no cycle or unit is mutated; the suspension only blocks future actions the technician would perform (see §1.4 priority 32)"
          - "increments Technician.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /technicians/{technician_id}/reinstate"
        actor: PlantAdmin
        preconditions:
          - "technician.status == SUSPENDED -> otherwise ERR_TECHNICIAN_ALREADY_ACTIVE"
        side_effects:
          - "increments Technician.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Customer
    state_field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /customers/{customer_id}/suspend"
        actor: PlantAdmin
        preconditions:
          - "customer.status == ACTIVE -> otherwise ERR_CUSTOMER_NOT_ACTIVE"
        side_effects:
          - "every WarrantyClaim for this customer in claim_status SUBMITTED or UNDER_REVIEW -> VOIDED with denial_reason APPROVAL_VOIDED"
          - "increments Customer.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /customers/{customer_id}/reinstate"
        actor: PlantAdmin
        preconditions:
          - "customer.status == SUSPENDED -> otherwise ERR_CUSTOMER_ALREADY_ACTIVE"
        side_effects:
          - "VOIDED claims are NOT resurrected"
          - "increments Customer.version by 1"

  # ---------------------------------------------------------------------------
  # Non-linear: SEALED -> LOADING is a documented revert edge that invalidates
  # the freight quote, so the quote must be recomputed before the next seal.
  # ---------------------------------------------------------------------------
  - entity: Shipment
    state_field: status
    initial_state: PLANNED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: PLANNED
        to: LOADING
        trigger: "POST /shipment-lines (first accepted line)"
        actor: LogisticsPlanner
        preconditions:
          - "shipment.status == PLANNED"
          - "expected_shipment_version equals shipment.version -> otherwise ERR_STALE_SHIPMENT_VERSION"
        side_effects:
          - "loaded_cube_m3, nested_cube_m3, loaded_weight_kg, cube_utilization_pct and density_kg_per_m3 recomputed (calculations.shipment_cube_rollup)"
          - "increments Shipment.version by 1"
      - from: LOADING
        to: PLANNED
        trigger: "POST /shipment-lines/{shipment_line_id}/remove (removing the last remaining LOADED line)"
        actor: LogisticsPlanner
        preconditions:
          - "shipment.status == LOADING"
          - "count of ShipmentLine rows with shipment_id == shipment.id and status LOADED becomes 0 after the removal"
        side_effects:
          - "all cube/weight rollups reset to 0; cube_utilization_pct -> 0.00; density_kg_per_m3 -> 0.000"
          - "increments Shipment.version by 1"
      - from: LOADING
        to: SEALED
        trigger: "POST /shipments/{shipment_id}/seal"
        actor: LogisticsPlanner
        preconditions:
          - "shipment.status == LOADING -> otherwise ERR_SHIPMENT_INVALID_STATE"
          - "count of ShipmentLine rows with shipment_id == shipment.id and status LOADED >= 1 -> otherwise ERR_SHIPMENT_EMPTY"
          - "cube_utilization_pct >= MIN_SEAL_UTILIZATION_PCT (60.00, equality passes) -> otherwise ERR_TRAILER_UNDERUTILIZED"
          - "every referenced FinishedUnit is in build_status SELLABLE and logistics_status LOADED -> otherwise ERR_UNIT_INVALID_BUILD_STATE  [CROSS-ENTITY: Shipment depends on FinishedUnit]"
        side_effects:
          - "quoted_freight_cents set from calculations.shipment_freight variant QUOTED (nested-cube basis)"
          - "sealed_at set to the logical clock"
          - "increments Shipment.version by 1"
      - from: SEALED
        to: LOADING
        trigger: "POST /shipments/{shipment_id}/unseal"
        actor: LogisticsPlanner
        preconditions:
          - "shipment.status == SEALED -> otherwise ERR_SHIPMENT_INVALID_STATE"
          - "shipment.departed_at IS NULL"
        side_effects:
          - "quoted_freight_cents cleared to null and sealed_at cleared to null — the next seal must recompute the quote from the then-current lines"
          - "increments Shipment.version by 1"
        note: "Backward revert edge that makes this machine non-linear."
      - from: SEALED
        to: IN_TRANSIT
        trigger: "POST /shipments/{shipment_id}/depart"
        actor: LogisticsPlanner
        preconditions:
          - "shipment.status == SEALED -> otherwise ERR_SHIPMENT_INVALID_STATE"
          - "shipment.quoted_freight_cents IS NOT NULL -> otherwise ERR_FREIGHT_QUOTE_MISSING"
        side_effects:
          - "departed_at set to the logical clock"
          - "every referenced FinishedUnit logistics_status LOADED -> IN_TRANSIT, firing CASCADE-C links 1-4 per unit"
          - "increments Shipment.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipments/{shipment_id}/deliver"
        actor: LogisticsPlanner
        preconditions:
          - "shipment.status == IN_TRANSIT -> otherwise ERR_SHIPMENT_INVALID_STATE"
        side_effects:
          - "billed_freight_cents set from calculations.shipment_freight variant BILLED (gross-cube basis — deliberately differs from the quote)"
          - "delivered_at set to the logical clock"
          - "every referenced FinishedUnit logistics_status IN_TRANSIT -> DELIVERED with delivered_at set (warranty clock origin)"
          - "increments Shipment.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /shipments/{shipment_id}/cancel"
        actor: LogisticsPlanner
        preconditions:
          - "shipment.status IN {PLANNED, LOADING, SEALED} -> otherwise ERR_SHIPMENT_INVALID_STATE"
        side_effects:
          - "increments Shipment.version by 1"
      - from: LOADING
        to: CANCELLED
        trigger: "POST /shipments/{shipment_id}/cancel"
        actor: LogisticsPlanner
        preconditions:
          - "shipment.status IN {PLANNED, LOADING, SEALED}"
        side_effects:
          - "every ShipmentLine with status LOADED -> REMOVED and each referenced FinishedUnit logistics_status LOADED -> STORED (the units stay in their warehouse zones, so no footprint moves)"
          - "increments Shipment.version by 1"
      - from: SEALED
        to: CANCELLED
        trigger: "POST /shipments/{shipment_id}/cancel"
        actor: LogisticsPlanner
        preconditions:
          - "shipment.status IN {PLANNED, LOADING, SEALED}"
          - "shipment.departed_at IS NULL"
        side_effects:
          - "quoted_freight_cents cleared to null; sealed_at cleared to null"
          - "every ShipmentLine with status LOADED -> REMOVED and each referenced FinishedUnit logistics_status LOADED -> STORED"
          - "increments Shipment.version by 1"

  # ---------------------------------------------------------------------------
  - entity: ShipmentLine
    state_field: status
    initial_state: LOADED
    terminal_states: [REMOVED]
    transitions:
      - from: LOADED
        to: REMOVED
        trigger: "POST /shipment-lines/{shipment_line_id}/remove, or system on POST /shipments/{shipment_id}/cancel"
        actor: LogisticsPlanner
        preconditions:
          - "line.status == LOADED -> otherwise ERR_SHIPMENT_LINE_ALREADY_REMOVED"
          - "Shipment.status IN {PLANNED, LOADING, SEALED} -> otherwise ERR_SHIPMENT_INVALID_STATE"
        side_effects:
          - "the referenced FinishedUnit logistics_status LOADED -> STORED"
          - "the shipment's cube/weight/utilisation rollups are recomputed and nest_position is renumbered from 1 over the surviving LOADED lines of the same product model (ordered by created_at ASC, tie-break FinishedUnit.hull_serial ASC)"
          - "when the shipment was SEALED it reverts to LOADING and quoted_freight_cents is cleared to null"
          - "increments ShipmentLine.version by 1"

  # ---------------------------------------------------------------------------
  # PARALLEL DIMENSION 1 of 2 on WarrantyClaim. Non-linear: UNDER_REVIEW ->
  # SUBMITTED is a revert edge, and APPROVED -> VOIDED reverses a payout.
  # ---------------------------------------------------------------------------
  - entity: WarrantyClaim
    state_field: claim_status
    initial_state: SUBMITTED
    terminal_states: [DENIED, WITHDRAWN, VOIDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /warranty-claims/{warranty_claim_id}/start-review"
        actor: WarrantyAgent
        preconditions:
          - "claim.claim_status == SUBMITTED -> otherwise ERR_CLAIM_INVALID_STATE"
          - "Customer(claim.customer_id).status == ACTIVE -> otherwise ERR_CUSTOMER_NOT_ACTIVE"
        side_effects:
          - "months_in_service recomputed from FinishedUnit.delivered_at against the logical clock"
          - "increments WarrantyClaim.version by 1"
      - from: UNDER_REVIEW
        to: SUBMITTED
        trigger: "POST /warranty-claims/{warranty_claim_id}/return-to-queue"
        actor: WarrantyAgent
        preconditions:
          - "claim.claim_status == UNDER_REVIEW -> otherwise ERR_CLAIM_INVALID_STATE"
        side_effects:
          - "storage_review_status is reset to NOT_STARTED on the other axis — a returned claim must be storage-reviewed again"
          - "months_in_service cleared to null"
          - "increments WarrantyClaim.version by 1"
        note: "Backward revert edge that makes this machine non-linear."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /warranty-claims/{warranty_claim_id}/approve"
        actor: WarrantyAgent
        preconditions:
          - "claim.claim_status == UNDER_REVIEW -> otherwise ERR_CLAIM_INVALID_STATE"
          - "claim.storage_review_status IN {GUIDANCE_VERIFIED, WAIVED} -> otherwise ERR_STORAGE_REVIEW_INCOMPLETE  [PARALLEL-AXIS GUARD]"
          - "expected_product_model_version equals ProductModel(FinishedUnit.product_model_id).version -> otherwise ERR_STALE_PRODUCT_MODEL_VERSION"
          - "Customer(claim.customer_id).status == ACTIVE -> otherwise ERR_CUSTOMER_NOT_ACTIVE"
          - "FinishedUnit(claim.finished_unit_id).logistics_status == DELIVERED -> otherwise ERR_UNIT_NOT_DELIVERED  [CROSS-ENTITY: WarrantyClaim depends on FinishedUnit]"
          - "claim.months_in_service <= WARRANTY_TERM_MONTHS (60, equality is inside the term) -> otherwise ERR_WARRANTY_TERM_EXPIRED"
          - "net_payout_cents from calculations.warranty_payout <= ProductModel.warranty_reserve_cents -> otherwise ERR_WARRANTY_RESERVE_EXHAUSTED"
        side_effects:
          - "payout_basis, pre_fee_gross_cents, storage_deduction_cents, admin_fee_cents and net_payout_cents set from calculations.warranty_payout"
          - "ProductModel.warranty_reserve_cents decreases by net_payout_cents and warranty_paid_cents increases by net_payout_cents — the conserved warranty-money invariant"
          - "increments ProductModel.version by 1 and WarrantyClaim.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /warranty-claims/{warranty_claim_id}/deny"
        actor: WarrantyAgent
        preconditions:
          - "claim.claim_status == UNDER_REVIEW -> otherwise ERR_CLAIM_INVALID_STATE"
          - "claim.storage_review_status != NOT_STARTED -> otherwise ERR_STORAGE_REVIEW_INCOMPLETE  [PARALLEL-AXIS GUARD]"
        side_effects:
          - "denial_reason set to STORAGE_GUIDANCE_VIOLATED when storage_review_status == GUIDANCE_VIOLATED, otherwise to the request body's reason"
          - "pre_fee_gross_cents, storage_deduction_cents, admin_fee_cents and net_payout_cents all set to 0; no reserve moves"
          - "increments WarrantyClaim.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /warranty-claims/{warranty_claim_id}/void"
        actor: PlantAdmin
        preconditions:
          - "claim.claim_status == APPROVED -> otherwise ERR_CLAIM_INVALID_STATE"
        side_effects:
          - "denial_reason -> APPROVAL_VOIDED"
          - "the compensating leg of the warranty-money invariant: ProductModel.warranty_reserve_cents increases by claim.net_payout_cents and warranty_paid_cents decreases by the same amount, restoring warranty_reserve_cents + warranty_paid_cents == initial_warranty_reserve_cents"
          - "net_payout_cents, pre_fee_gross_cents, storage_deduction_cents and admin_fee_cents are retained as the audit record and are NOT zeroed"
          - "increments ProductModel.version by 1 and WarrantyClaim.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /warranty-claims/{warranty_claim_id}/withdraw"
        actor: Customer
        preconditions:
          - "claim.claim_status IN {SUBMITTED, UNDER_REVIEW} -> otherwise ERR_CLAIM_INVALID_STATE"
          - "the acting X-User-ID equals claim.customer_id -> otherwise ERR_CUSTOMER_SCOPE_VIOLATION"
        side_effects:
          - "increments WarrantyClaim.version by 1"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /warranty-claims/{warranty_claim_id}/withdraw"
        actor: Customer
        preconditions:
          - "claim.claim_status IN {SUBMITTED, UNDER_REVIEW}"
          - "the acting X-User-ID equals claim.customer_id -> otherwise ERR_CUSTOMER_SCOPE_VIOLATION"
        side_effects:
          - "increments WarrantyClaim.version by 1"
      - from: SUBMITTED
        to: VOIDED
        trigger: "system — POST /customers/{customer_id}/suspend"
        actor: system
        preconditions:
          - "claim.claim_status IN {SUBMITTED, UNDER_REVIEW}"
          - "Customer(claim.customer_id).status transitions ACTIVE -> SUSPENDED"
        side_effects:
          - "denial_reason -> APPROVAL_VOIDED; no reserve moves because no payout had been booked"
          - "increments WarrantyClaim.version by 1"

  # ---------------------------------------------------------------------------
  # PARALLEL DIMENSION 2 of 2 on WarrantyClaim — the storage-guidance review
  # advances independently of claim_status and gates approval and denial.
  # ---------------------------------------------------------------------------
  - entity: WarrantyClaim
    state_field: storage_review_status
    initial_state: NOT_STARTED
    terminal_states: []
    transitions:
      - from: NOT_STARTED
        to: GUIDANCE_VERIFIED
        trigger: "POST /warranty-claims/{warranty_claim_id}/storage-review (outcome VERIFIED)"
        actor: WarrantyAgent
        preconditions:
          - "claim.claim_status == UNDER_REVIEW -> otherwise ERR_CLAIM_INVALID_STATE  [PARALLEL-AXIS GUARD]"
          - "claim.storage_review_status == NOT_STARTED -> otherwise ERR_STORAGE_REVIEW_ALREADY_DONE"
          - "Customer(claim.customer_id).storage_guidance_acknowledged_at IS NOT NULL -> otherwise ERR_STORAGE_GUIDANCE_NOT_ACKNOWLEDGED"
          - "Customer(claim.customer_id).storage_guidance_acknowledged_at <= FinishedUnit.delivered_at -> otherwise ERR_STORAGE_GUIDANCE_NOT_ACKNOWLEDGED (equality passes)"
        side_effects:
          - "storage_description stored from the request body"
          - "storage_deduction_cents will be 0 for this claim (see calculations.warranty_payout)"
          - "increments WarrantyClaim.version by 1"
      - from: NOT_STARTED
        to: GUIDANCE_VIOLATED
        trigger: "POST /warranty-claims/{warranty_claim_id}/storage-review (outcome VIOLATED)"
        actor: WarrantyAgent
        preconditions:
          - "claim.claim_status == UNDER_REVIEW -> otherwise ERR_CLAIM_INVALID_STATE"
          - "claim.storage_review_status == NOT_STARTED -> otherwise ERR_STORAGE_REVIEW_ALREADY_DONE"
        side_effects:
          - "storage_description stored from the request body"
          - "storage_deduction_cents will be the STORAGE_VIOLATION_DEDUCTION_PCT share of pre_fee_gross_cents if the claim is later approved after a WAIVED override"
          - "increments WarrantyClaim.version by 1"
      - from: GUIDANCE_VIOLATED
        to: WAIVED
        trigger: "POST /warranty-claims/{warranty_claim_id}/waive-storage-finding"
        actor: PlantAdmin
        preconditions:
          - "claim.storage_review_status == GUIDANCE_VIOLATED -> otherwise ERR_STORAGE_FINDING_NOT_WAIVABLE"
          - "claim.claim_status == UNDER_REVIEW -> otherwise ERR_CLAIM_INVALID_STATE  [PARALLEL-AXIS GUARD]"
        side_effects:
          - "the claim becomes approvable, but storage_deduction_cents still applies at the WAIVED rate defined in calculations.warranty_payout — waiving unblocks approval, it does not restore full value"
          - "increments WarrantyClaim.version by 1"
      - from: GUIDANCE_VERIFIED
        to: NOT_STARTED
        trigger: "system — POST /warranty-claims/{warranty_claim_id}/return-to-queue"
        actor: system
        preconditions:
          - "claim.claim_status transitions UNDER_REVIEW -> SUBMITTED"
        side_effects:
          - "storage_description cleared to null"
          - "increments WarrantyClaim.version by 1"
      - from: GUIDANCE_VIOLATED
        to: NOT_STARTED
        trigger: "system — POST /warranty-claims/{warranty_claim_id}/return-to-queue"
        actor: system
        preconditions:
          - "claim.claim_status transitions UNDER_REVIEW -> SUBMITTED"
        side_effects:
          - "storage_description cleared to null"
          - "increments WarrantyClaim.version by 1"
      - from: WAIVED
        to: NOT_STARTED
        trigger: "system — POST /warranty-claims/{warranty_claim_id}/return-to-queue"
        actor: system
        preconditions:
          - "claim.claim_status transitions UNDER_REVIEW -> SUBMITTED"
        side_effects:
          - "storage_description cleared to null; the waiver is revoked and must be re-granted"
          - "increments WarrantyClaim.version by 1"

# =============================================================================
# §1.2.1 CONCURRENCY RULES
#
# All five are CREATE-with-supersede / book-against-a-shared-parent patterns:
# in every case a strictly sequential second request that re-read the parent
# would legitimately succeed, so the only deterministic resolution is OCC on
# the parent's `version`. Each guarded endpoint declares the matching
# `expected_<parent>_version` in its §1.5 `input:` and bumps the parent's
# version on success.
# =============================================================================
concurrency_rules:
  - rule_id: cycle-create-stale-order
    parent_entity: ProductionOrder
    write_endpoint: "POST /molding-cycles"
    occ_field: "expected_production_order_version"
    description: |
      Scheduling a MoldingCycle against a ProductionOrder whose version has
      advanced since the client last read it is rejected. The stale view is
      material because an intervening writer may already have scheduled
      enough cycles to cover the remaining ordered_qty, may have moved the
      order into BLOCKED_RESIN or BLOCKED_WAREHOUSE, or may have consumed the
      oven arm window the current writer intends to book. A cycle create is
      legitimate on its own terms whenever remaining coverage exists, so this
      cannot be reduced to a state precondition.
    error_id: ERR_STALE_PRODUCTION_ORDER_VERSION
    http_status: 412

  - rule_id: charge-create-stale-resin-lot
    parent_entity: ResinLot
    write_endpoint: "POST /resin-charges"
    occ_field: "expected_resin_lot_version"
    description: |
      Reserving resin mass from a ResinLot whose version has advanced since
      the client last read it is rejected. The stale view is material because
      the observed available_kg has already been drawn down, quarantined, or
      expired by an earlier writer, and the mass ledger invariant
      available_kg + reserved_kg + consumed_kg == received_kg must hold after
      every reservation. Reserving from a lot with sufficient available mass
      is otherwise a legitimate operation, so no state precondition covers it.
    error_id: ERR_STALE_RESIN_LOT_VERSION
    http_status: 412

  - rule_id: store-unit-stale-warehouse
    parent_entity: Warehouse
    write_endpoint: "POST /finished-units/{finished_unit_id}/store"
    occ_field: "expected_warehouse_version"
    description: |
      Storing a FinishedUnit into a Warehouse whose version has advanced
      since the client last read it is rejected. The stale view is material
      because committed_cube_m3, utilization_pct and posture have already
      moved: the remaining footprint the client budgeted against may be gone
      and the site may have crossed its restricted or frozen threshold.
      Storing a SELLABLE unit into a NORMAL site is otherwise legitimate, so
      the check is not a state precondition.
    error_id: ERR_STALE_WAREHOUSE_VERSION
    http_status: 412

  - rule_id: line-create-stale-shipment
    parent_entity: Shipment
    write_endpoint: "POST /shipment-lines"
    occ_field: "expected_shipment_version"
    description: |
      Adding a ShipmentLine to a Shipment whose version has advanced since
      the client last read it is rejected. The stale view is material because
      nested_cube_m3 and loaded_weight_kg have already grown, so the trailer
      cube and payload headroom the client computed no longer exists, and the
      nest_position the client expected has been taken. Loading a STORED unit
      onto a PLANNED or LOADING shipment with headroom is otherwise
      legitimate.
    error_id: ERR_STALE_SHIPMENT_VERSION
    http_status: 412

  - rule_id: claim-approve-stale-product-model
    parent_entity: ProductModel
    write_endpoint: "POST /warranty-claims/{warranty_claim_id}/approve"
    occ_field: "expected_product_model_version"
    description: |
      Approving a WarrantyClaim while holding a stale version of the
      ProductModel that funds the payout is rejected. The stale view is
      material because warranty_reserve_cents has already been drawn down by
      an earlier approval (or restored by a void), so the reserve headroom
      the agent believed was available may no longer cover net_payout_cents.
      Approving a storage-reviewed, in-term claim against a funded reserve is
      otherwise legitimate, so this is not a state precondition.
    error_id: ERR_STALE_PRODUCT_MODEL_VERSION
    http_status: 412

# =============================================================================
# §1.3 CALCULATION RULES
#
# Global conventions used by every rule below:
#   * All rounding is round_half_up (never banker's rounding).
#   * Money is stored as integer cents; every money step names its own
#     rounding direction explicitly.
#   * Mass is 3 decimal places (kg), percentages 2 (pct), lengths 3 (mm),
#     volume 4 (m3), melt index 2 (g/10min), indices 3 (dimensionless).
#   * SIZE_CLASS_ORDER is the total order COMPACT(1) < MID(2) < TANDEM(3) <
#     OVERSIZE(4) and is the only comparison used for size-class fit.
#   * Every input_set names the exact status filter and the exact
#     inclusive/exclusive boundary it uses; no rule ever reads a random or
#     id-derived value.
# =============================================================================
calculations:
  - name: mold_selection
    trigger: "POST /molding-cycles — the server, not the client, picks Mold; the request body has no mold_id field"
    algorithm: selector_policy
    formula: |
      # ---- STEP 1: eligibility filter (all clauses must hold) ----
      candidates = every Mold m such that
        m.product_model_id == order.product_model_id
        AND m.status == AVAILABLE
        AND SIZE_CLASS_ORDER[m.size_class] <= SIZE_CLASS_ORDER[station.max_size_class]
        AND m.cycles_since_service < m.service_interval_cycles     # strict: a mold sitting
                                                                   # exactly at its interval
                                                                   # is NOT eligible
        AND no MoldingCycle c exists with
              c.mold_id == m.id
              AND c.status IN {SCHEDULED, OVEN_RUNNING, COOLING}
              AND intervals_overlap_half_open(
                    [c.oven_start_at, c.cooling_window_end_at),
                    [new.oven_start_at, new.cooling_window_end_at))

      # ---- STEP 2: ranking (deterministic, total) ----
      rank candidates ASC by m.cycles_since_service
        tie-break ASC by m.mold_code            # mold_code is globally unique,
                                                # so the order is total; Mold.id
                                                # is never consulted
      selected = first(ranked candidates)

      # ---- STEP 3: empty-pool fallback ----
      if candidates is empty:
        if at least one Mold for this product model exists in status AVAILABLE
           but every one of them was excluded by the overlap clause:
             reject with ERR_MOLD_WINDOW_CONFLICT
        else:
             reject with ERR_NO_ELIGIBLE_MOLD
      # The two fallbacks are distinguishable, so a test can tell an
      # occupancy failure from a capability failure.
    input_set: |
      Molds with product_model_id == the order's product model. Only
      status == AVAILABLE participates; MAINTENANCE, IN_CYCLE and RETIRED
      molds are excluded before ranking. Occupancy is evaluated over
      MoldingCycle rows in {SCHEDULED, OVEN_RUNNING, COOLING} only —
      DEMOLDED and ABORTED cycles never block a mold. The occupancy span is
      the HALF-OPEN interval [oven_start_at, cooling_window_end_at): a new
      cycle whose oven_start_at equals an existing cycle's
      cooling_window_end_at to the second is accepted.
    constants:
      SIZE_CLASS_ORDER: { COMPACT: 1, MID: 2, TANDEM: 3, OVERSIZE: 4 }
    precision: "integers only (cycle counts); no rounding"
    variants:
      - name: FIRST_ATTEMPT
        when: "the request body omits exclude_mold_ids"
        difference: "the full eligible pool is ranked"
      - name: RETRY_WITH_EXCLUSIONS
        when: "the request body supplies exclude_mold_ids (a list of mold ids a caller has already rejected on the shop floor)"
        difference: |
          Molds whose id appears in exclude_mold_ids are removed AFTER the
          eligibility filter and BEFORE ranking, so the second-ranked mold is
          returned instead of the first. Exclusion never changes the ranking
          expression itself, and an exclusion list that empties the pool
          yields ERR_NO_ELIGIBLE_MOLD, not ERR_MOLD_WINDOW_CONFLICT.

  - name: qualified_resin_lot_count
    trigger: "POST /production-orders/{production_order_id}/release, POST /resin-charges, and every cascade link that must decide whether an order is still resin-blocked"
    algorithm: aggregation
    formula: |
      qualified(lot, model) is TRUE iff ALL of:
        lot.status == AVAILABLE                                  # QUARANTINED,
                                                                 # EXPIRED and
                                                                 # DEPLETED never
                                                                 # qualify
        AND lot.resin_grade == model.resin_grade                  # exact enum match
        AND lot.additive_package_code == model.required_additive_package_code
        AND ( lot.color_code == model.master_color_code
              OR lot.color_delta_e <= model.max_color_delta_e )   # <= : a lot at
                                                                 # exactly the max
                                                                 # delta-E QUALIFIES
        AND model.min_melt_index_g10min <= lot.melt_index_g10min <= model.max_melt_index_g10min
                                                                 # both bounds inclusive
        AND lot.regrind_pct_by_mass <= model.max_regrind_pct      # <= : a lot at
                                                                 # exactly the ceiling
                                                                 # QUALIFIES
        AND lot.expires_on >= clock_date(now)                     # >= : a lot expiring
                                                                 # today still qualifies
        AND lot.available_kg >= round(model.nominal_charge_kg
                                      * (1 - model.charge_tolerance_pct / 100), 3)

      qualified_resin_lot_count(model) = count of ResinLot rows where qualified(lot, model)
    input_set: |
      Every ResinLot row in status AVAILABLE. The count is recomputed inside
      the request that changes any qualifying attribute — lot status, lot
      available_kg, the logical clock date, or the ProductModel's grade /
      colour / additive / melt-index / regrind fields. Never cached across
      requests.
    constants: {}
    precision: "kg comparisons at 3 decimal places; the minimum-mass threshold is rounded to 3 dp BEFORE the >= comparison"
    variants:
      - name: RELEASE_GATE
        when: "called from POST /production-orders/{production_order_id}/release"
        difference: "count == 0 sends the order to BLOCKED_RESIN with blocked_reason NO_QUALIFIED_RESIN_LOT instead of READY_TO_SCHEDULE; the request still returns 200"
      - name: UNBLOCK_SWEEP
        when: "called from a cascade link after a charge release, quarantine release, or service completion"
        difference: "count >= 1 moves BLOCKED_RESIN orders to READY_TO_SCHEDULE — unless the target Warehouse posture is FROZEN, in which case they move to BLOCKED_WAREHOUSE, so the same count yields two different destination states"

  - name: cycle_charge_rollup
    trigger: "POST /resin-charges, POST /resin-charges/{resin_charge_id}/release, and every cascade link that releases a charge"
    algorithm: aggregation
    formula: |
      participating = ResinCharge rows with molding_cycle_id == cycle.id
                      AND status IN {RESERVED, CONSUMED}         # RELEASED excluded

      charged_mass_kg = round( sum over participating of ch.charge_kg , 3 )

      # Mass-weighted melt index — divide first, round once at the end.
      if charged_mass_kg == 0.000:
        weighted_melt_index_g10min = null
      else:
        weighted_melt_index_g10min = round(
            ( sum over participating of ( ch.charge_kg
                                          * ResinLot(ch.resin_lot_id).melt_index_g10min ) )
            / charged_mass_kg
          , 2 )
        # The numerator is NOT rounded per charge; only the quotient is
        # rounded. Rounding each product first would drift.
    input_set: |
      ResinCharge rows for this cycle in status RESERVED or CONSUMED.
      RELEASED charges are excluded the instant they are released, which is
      why every release cascade recomputes this rule.
    constants: {}
    precision: "charged_mass_kg 3 decimal places round_half_up; weighted_melt_index_g10min 2 decimal places round_half_up, computed by divide-then-round"
    variants:
      - name: PRE_OVEN
        when: "cycle.status == SCHEDULED"
        difference: "participating charges are all RESERVED; the rollup can still shrink because releases are permitted"
      - name: POST_OVEN
        when: "cycle.status IN {OVEN_RUNNING, COOLING, DEMOLDED}"
        difference: "participating charges are all CONSUMED and the rollup is frozen; a release attempt is rejected with ERR_CHARGE_NOT_RELEASABLE"

  - name: cycle_regrind_percentage
    trigger: "POST /resin-charges and POST /molding-cycles/{molding_cycle_id}/start-oven"
    algorithm: threshold
    formula: |
      participating = ResinCharge rows with molding_cycle_id == cycle.id
                      AND status IN {RESERVED, CONSUMED}

      total_regrind_kg = round( sum over participating of ch.regrind_kg , 3 )
      total_charge_kg  = round( sum over participating of ch.charge_kg  , 3 )

      if total_charge_kg == 0.000:
        cycle_regrind_pct = 0.00
      else:
        # DIVIDE-THEN-ROUND on the two already-rounded 3 dp masses.
        cycle_regrind_pct = round( total_regrind_kg / total_charge_kg * 100 , 2 )

      # Ceiling test — strict greater-than rejects.
      if cycle_regrind_pct > ProductModel.max_regrind_pct:
        reject with ERR_REGRIND_LIMIT_EXCEEDED
      # A cycle landing at exactly max_regrind_pct (default 30.00) is
      # ACCEPTED. 30.00 passes; 30.01 fails.
    input_set: |
      ResinCharge rows for this cycle in status RESERVED or CONSUMED. The
      ceiling is read from the cycle's ProductModel via its ProductionOrder,
      never from the ResinLot — a single lot may sit under its own
      regrind_pct_by_mass ceiling while the blended cycle breaches the
      model's max_regrind_pct.
    constants:
      REGRIND_CEILING_COMPARISON: "strict_greater_than_rejects"
    precision: "masses at 3 decimal places, the percentage at 2 decimal places round_half_up; the two masses are rounded BEFORE the division"
    variants:
      - name: INCREMENTAL_ON_CHARGE
        when: "evaluated inside POST /resin-charges"
        difference: "the candidate charge is included in participating before the ceiling test, so the breaching charge itself is refused and no partial reservation is written"
      - name: FINAL_ON_OVEN_START
        when: "evaluated inside POST /molding-cycles/{molding_cycle_id}/start-oven"
        difference: "the set is already closed; a breach here means charges were released after the last check, and the oven start is refused with the same error while the cycle stays SCHEDULED"

  - name: wall_thickness_distribution
    trigger: "POST /finished-units/{finished_unit_id}/inspect"
    algorithm: weighted_scoring
    formula: |
      points = unit.wall_thickness_points          # client-supplied array, n >= 6
      n = length(points)
      if n < 6: reject with ERR_INSUFFICIENT_MEASUREMENTS

      # ---- STEP 1: mean, rounded to 3 dp and STORED ----
      mean_wall_thickness_mm = round( sum(points) / n , 3 )

      # ---- STEP 2: population SD taken about the ROUNDED mean ----
      # NESTED ROUNDING (deliberate): the deviations are measured from the
      # already-rounded mean_wall_thickness_mm, not from the unrounded
      # arithmetic mean. Using the unrounded mean gives a different sd.
      sum_sq = sum over p in points of ( p - mean_wall_thickness_mm ) ^ 2
      wall_sd_mm = round( sqrt( sum_sq / n ) , 3 )        # population divisor n,
                                                         # not n - 1

      # ---- STEP 3: CV from the two ROUNDED values ----
      if mean_wall_thickness_mm == 0.000:
        wall_cv_pct = 0.00
      else:
        wall_cv_pct = round( wall_sd_mm / mean_wall_thickness_mm * 100 , 2 )

      # ---- STEP 4: extremum, no rounding beyond field precision ----
      min_wall_thickness_mm = round( min(points) , 3 )
    input_set: |
      Exactly the wall_thickness_points array supplied on this inspect call,
      in the order given; no prior measurement set is merged in, and a
      re-inspection replaces the array wholesale. The divisor is the
      population n (all measured points), never n - 1.
    constants:
      MIN_MEASUREMENT_POINTS: 6
      SD_DIVISOR: "population_n"
    precision: "mean, sd and min at 3 decimal places round_half_up; cv at 2 decimal places round_half_up. Rounding order is mandatory: mean -> sd (about the rounded mean) -> cv (from the two rounded values)."
    variants:
      - name: FIRST_INSPECTION
        when: "unit.rework_count == 0"
        difference: "the array is stored as given and the verdict follows calculations.inspection_verdict unchanged"
      - name: POST_REWORK_INSPECTION
        when: "unit.rework_count >= 1"
        difference: "the previous array is discarded and replaced; the recomputed statistics are compared against the same ProductModel limits, but a REWORK verdict at rework_count == 2 is converted to SCRAP because the rework budget is exhausted"

  - name: cycle_warpage_index
    trigger: "POST /molding-cycles/{molding_cycle_id}/demold sets provisional_warpage_index; POST /finished-units/{finished_unit_id}/inspect sets final_warpage_index"
    algorithm: weighted_scoring
    formula: |
      # Four independent input families combine through nested function
      # calls: oven temperature, cooling time, arm rotation ratio, and (FINAL
      # only) the measured wall distribution. Two lookup tables multiply the
      # weighted sum.

      # ---- TERM 1: thermal over/under-shoot (signed, then folded) ----
      thermal_term = round(
          abs( cycle.oven_temp_c - OVEN_TEMP_REFERENCE_C ) / OVEN_TEMP_SPAN_C
        , 3 )

      # ---- TERM 2: cooling deficit (nested max, floored at zero) ----
      cooling_minutes = <see variants: scheduled_cooling_minutes or actual_cooling_minutes>
      cooling_deficit_min = max( 0 , model.min_cooling_minutes - cooling_minutes )
      cooling_term = round( cooling_deficit_min / model.min_cooling_minutes , 3 )

      # ---- TERM 3: arm rotation ratio departure (nested abs of a ratio) ----
      rotation_ratio = round( cycle.arm_rpm_major / cycle.arm_rpm_minor , 3 )
      rotation_term  = round(
          abs( rotation_ratio - IDEAL_ROTATION_RATIO ) / IDEAL_ROTATION_RATIO
        , 3 )

      # ---- TERM 4: measured distribution penalty (FINAL variant only) ----
      distribution_term = 0.000                                  # PROVISIONAL
      # FINAL: distribution_term = round( max(0, unit.wall_cv_pct
      #                                          - model.wall_cv_max_pct) / 10 , 3 )

      # ---- WEIGHTED SUM over the ALREADY-ROUNDED terms ----
      base = round(
            W_THERMAL      * thermal_term
          + W_COOLING      * cooling_term
          + W_ROTATION     * rotation_term
          + W_DISTRIBUTION * distribution_term
        , 3 )

      # ---- TWO MULTIPLICATIVE LOOKUPS, then a nested clamp ----
      size_factor = SIZE_CLASS_WARPAGE_FACTOR[model.size_class]
      mode_factor = COOLING_MODE_WARPAGE_FACTOR[cycle.cooling_mode]

      warpage_index = round(
          min( WARPAGE_INDEX_CEILING ,
               max( WARPAGE_INDEX_FLOOR , base * size_factor * mode_factor ) )
        , 3 )
      # The clamp is applied to the UNROUNDED product and the result rounded
      # once; rounding before clamping would let 5.0004 escape the ceiling.
    input_set: |
      One MoldingCycle plus its ProductModel (via ProductionOrder) and its
      CoolingBay airflow mode. The PROVISIONAL variant runs at demold and may
      only read fields that exist then: oven_temp_c, arm rpm pair,
      scheduled_cooling_minutes. The FINAL variant runs at inspection and
      reads actual_cooling_minutes plus the inspected unit's wall_cv_pct,
      which did not exist at demold. Aborted cycles are never scored.
    constants:
      OVEN_TEMP_REFERENCE_C: 288
      OVEN_TEMP_SPAN_C: 40
      IDEAL_ROTATION_RATIO: 4.000
      W_THERMAL: 0.40
      W_COOLING: 0.35
      W_ROTATION: 0.25
      W_DISTRIBUTION: 0.50
      WARPAGE_INDEX_FLOOR: 0.000
      WARPAGE_INDEX_CEILING: 5.000
      SIZE_CLASS_WARPAGE_FACTOR: { COMPACT: 0.850, MID: 1.000, TANDEM: 1.150, OVERSIZE: 1.400 }
      COOLING_MODE_WARPAGE_FACTOR: { AMBIENT: 1.000, FORCED_AIR: 0.900, WATER_MIST: 1.250 }
    precision: "each term rounded to 3 decimal places round_half_up before the weighted sum; the clamped product rounded once to 3 decimal places"
    variants:
      - name: PROVISIONAL
        when: "computed at POST /molding-cycles/{molding_cycle_id}/demold and stored on MoldingCycle.provisional_warpage_index"
        difference: |
          Uses cycle.scheduled_cooling_minutes for TERM 2 and forces
          distribution_term to 0.000 because no unit has been measured yet.
          For identical stored data this yields a LOWER index than FINAL
          whenever the cycle cooled for less than its scheduled minutes or the
          unit's wall_cv_pct exceeds the model ceiling.
      - name: FINAL
        when: "computed at POST /finished-units/{finished_unit_id}/inspect and stored on FinishedUnit.final_warpage_index"
        difference: |
          Uses cycle.actual_cooling_minutes for TERM 2 and a live
          distribution_term from the inspected wall_cv_pct. Both substitutions
          are made in the same pass, so PROVISIONAL and FINAL diverge on the
          identical cycle row and both values are retained side by side —
          FINAL alone drives calculations.inspection_verdict.

  - name: inspection_verdict
    trigger: "POST /finished-units/{finished_unit_id}/inspect, evaluated after wall_thickness_distribution and cycle_warpage_index variant FINAL"
    algorithm: threshold
    formula: |
      # Evaluated top to bottom; the FIRST matching clause wins and the rest
      # are not evaluated. Note the deliberately mixed comparison operators.

      #  1. minimum wall thickness — strict less-than scraps; a unit at
      #     exactly wall_thickness_min_mm PASSES this clause
      if unit.min_wall_thickness_mm < model.wall_thickness_min_mm      -> SCRAP
      #  2. impact energy — strict less-than scraps; exactly
      #     impact_test_min_joules PASSES
      if unit.impact_test_joules    < model.impact_test_min_joules     -> SCRAP
      #  3. cosmetic reject grade
      if unit.cosmetic_defect_grade == REJECT                          -> SCRAP
      #  4. severe warpage — strict greater-than scraps; exactly
      #     2.500 does NOT scrap
      if unit.final_warpage_index   > WARPAGE_SCRAP_THRESHOLD          -> SCRAP
      #  5. thickness uniformity — strict greater-than reworks; a unit at
      #     exactly wall_cv_max_pct PASSES
      if unit.wall_cv_pct           > model.wall_cv_max_pct            -> REWORK
      #  6. moderate warpage — strict greater-than reworks
      if unit.final_warpage_index   > WARPAGE_REWORK_THRESHOLD         -> REWORK
      #  7. borderline cosmetics
      if unit.cosmetic_defect_grade == C                               -> REWORK
      #  8. otherwise
      PASS

      # ---- rework budget override, applied AFTER the ladder ----
      if verdict == REWORK and unit.rework_count == MAX_REWORK_COUNT:
        verdict = SCRAP
      # Grade B never reworks on its own; it only matters through clause 7's
      # absence.
    input_set: |
      One FinishedUnit's freshly stored measurements plus its ProductModel
      limits and its own rework_count. No sibling unit and no cycle-level
      average participates — each hull is judged alone.
    constants:
      WARPAGE_SCRAP_THRESHOLD: 2.500
      WARPAGE_REWORK_THRESHOLD: 1.200
      MAX_REWORK_COUNT: 2
    precision: "comparisons at the stored field precision (3 dp for mm and index, 2 dp for pct, 1 dp for joules); no re-rounding inside the ladder"
    variants:
      - name: INITIAL_VERDICT
        when: "unit.build_status == OUTFITTED"
        difference: "a PASS moves the unit to SELLABLE and raises the order's completed_qty"
      - name: RE_INSPECTION_VERDICT
        when: "unit.build_status == SELLABLE and unit.logistics_status == UNALLOCATED"
        difference: |
          Identical ladder, opposite direction of travel: a REWORK or SCRAP
          verdict now DEMOTES a unit that already counted toward the order, so
          completed_qty falls and a COMPLETE order returns to IN_PRODUCTION
          (CASCADE-D). A unit whose logistics_status has left UNALLOCATED
          cannot be re-inspected at all (ERR_UNIT_NOT_REINSPECTABLE).

  - name: production_order_cost
    trigger: "POST /molding-cycles/{molding_cycle_id}/start-oven (charges become CONSUMED), POST /molding-cycles/{molding_cycle_id}/demold, and every inspect that changes completed_qty"
    algorithm: tiered_pricing
    formula: |
      # ---- STEP 1: material — ROUND PER CHARGE, THEN SUM ----
      consumed = ResinCharge rows whose MoldingCycle.production_order_id == order.id
                 AND ch.status == CONSUMED
      material_cost_cents = sum over consumed of
            round_half_up( ch.charge_kg * ResinLot(ch.resin_lot_id).cost_cents_per_kg )
      # Each charge is rounded to whole cents BEFORE the summation. Summing
      # the unrounded products and rounding once gives a different total.

      # ---- STEP 2: oven energy — ROUND PER CYCLE, THEN SUM ----
      finished_cycles = MoldingCycle rows with production_order_id == order.id
                        AND status == DEMOLDED                  # ABORTED cycles
                                                                # contribute nothing
      oven_energy_cost_cents = sum over finished_cycles of
            round_half_up( c.actual_oven_minutes
                           * OvenStation(c.oven_station_id).energy_cents_per_min )

      # ---- STEP 3: tier selection on the PRE-OVERHEAD subtotal ----
      pre_overhead_subtotal_cents = material_cost_cents + oven_energy_cost_cents
      overhead_rate_pct = the rate of the FIRST OVERHEAD_TIERS row whose
                          max_subtotal_cents >= pre_overhead_subtotal_cents,
                          else OVERHEAD_TOP_RATE_PCT
      # The tier is chosen ONCE from pre_overhead_subtotal_cents and is NEVER
      # re-selected after overhead is added, even though total_cost_cents may
      # land in a different band.

      # ---- STEP 4: overhead and total ----
      overhead_cents  = round_half_up( pre_overhead_subtotal_cents
                                       * overhead_rate_pct / 100 )
      total_cost_cents = pre_overhead_subtotal_cents + overhead_cents

      # ---- STEP 5: unit cost — FLOOR, not round ----
      if order.completed_qty >= 1:
        unit_cost_cents = floor( total_cost_cents / order.completed_qty )
      else:
        unit_cost_cents = null
      # Floor, so the summed unit costs may fall below total_cost_cents; the
      # remainder is deliberately not redistributed.
    input_set: |
      ResinCharge rows in status CONSUMED only (RESERVED mass is not yet a
      cost and RELEASED mass never was) reached through this order's cycles,
      plus MoldingCycle rows in status DEMOLDED only. Cycles in SCHEDULED,
      OVEN_RUNNING, COOLING or ABORTED contribute no energy cost.
    constants:
      OVERHEAD_TIERS:
        - { max_subtotal_cents: 500000, rate_pct: 18.00 }
        - { max_subtotal_cents: 2000000, rate_pct: 14.50 }
      OVERHEAD_TOP_RATE_PCT: 11.00
    precision: "integer cents throughout; per-charge and per-cycle products rounded round_half_up to whole cents before summation; overhead round_half_up; unit_cost_cents floored"
    variants:
      - name: IN_FLIGHT
        when: "order.status == IN_PRODUCTION"
        difference: "unit_cost_cents is computed over the completed_qty observed at that moment, so it moves with every PASS verdict"
      - name: AT_COMPLETION
        when: "order.status == COMPLETE"
        difference: "completed_qty has reached ordered_qty and unit_cost_cents stabilises; a CASCADE-D demotion back to IN_PRODUCTION recomputes it upward because the same total is divided by a smaller completed_qty"

  - name: storage_zone_selection
    trigger: "POST /finished-units/{finished_unit_id}/store — the server, not the client, picks the zone; the request body has no storage_zone_code field"
    algorithm: selector_policy
    formula: |
      w     = Warehouse(order.target_warehouse_id)
      model = ProductModel(unit.product_model_id)

      # A nest group is the triple (warehouse_id, storage_zone_code,
      # product_model_id). Bulky hulls nest inside one another, so only the
      # FIRST hull of a group occupies its full cube.
      occupying(u) = u.logistics_status IN {STORED, LOADED}   # a LOADED unit is
                                                             # still physically in
                                                             # the zone until the
                                                             # trailer departs

      for each zone z in w.zones:
        anchor_exists(z) = a FinishedUnit u exists with
              u.warehouse_id == w.id
              AND u.storage_zone_code == z.zone_code
              AND u.product_model_id == unit.product_model_id
              AND occupying(u) AND u.is_zone_anchor == true
        candidate_footprint(z) =
              anchor_exists(z) ? round( model.gross_cube_m3 * model.nest_factor , 4 )
                               : round( model.gross_cube_m3 , 4 )
        zone_committed(z) = round( sum of u.stored_footprint_cube_m3 over units u
                                   with u.warehouse_id == w.id
                                   AND u.storage_zone_code == z.zone_code
                                   AND occupying(u) , 4 )
        remaining_after(z) = round( z.capacity_cube_m3
                                    - zone_committed(z) - candidate_footprint(z) , 4 )
        eligible(z) = remaining_after(z) >= 0.0000      # >= : a zone that fills to
                                                       # exactly capacity is eligible

      # ---- ranking over eligible zones (deterministic, total) ----
      #  1. zones that already anchor this product model first (nesting wins)
      #  2. then tightest fit: remaining_after ASC
      #  3. then zone_code ASC  (unique within the warehouse; the unit's id and
      #     the zone's position in the array are never consulted)
      selected_zone = first zone under
            ( anchor_exists DESC , remaining_after ASC , zone_code ASC )

      if no zone is eligible: reject with ERR_NO_ELIGIBLE_ZONE
    input_set: |
      The zones array of the target Warehouse, and FinishedUnit rows in
      logistics_status STORED or LOADED at that warehouse. UNALLOCATED,
      IN_TRANSIT and DELIVERED units occupy nothing. SCRAPPED units are
      excluded because a scrapped unit can never have been stored.
    constants: {}
    precision: "cube volumes at 4 decimal places round_half_up; the nested product is rounded BEFORE it is added to the zone total"
    variants:
      - name: NEW_NEST_GROUP
        when: "anchor_exists is false for every eligible zone"
        difference: "the unit is charged the full gross_cube_m3 and becomes the group's anchor, so the same hull consumes materially more footprint than it would as a nested follower"
      - name: JOIN_EXISTING_NEST
        when: "at least one eligible zone already anchors this product model"
        difference: "the unit is charged gross_cube_m3 * nest_factor and is NOT an anchor; the affinity term forces this zone even when a wholly empty zone would give a looser fit"

  - name: storage_footprint
    trigger: "POST /finished-units/{finished_unit_id}/store, POST /finished-units/{finished_unit_id}/release-storage, POST /shipments/{shipment_id}/depart"
    algorithm: constraint_propagation
    formula: |
      # ---- ON STORE ----
      is_zone_anchor            = NOT anchor_exists(selected_zone)
      stored_footprint_cube_m3  = is_zone_anchor
            ? round( model.gross_cube_m3 , 4 )
            : round( model.gross_cube_m3 * model.nest_factor , 4 )

      # ---- ON VACATE (release-storage or trailer departure) ----
      vacating.stored_footprint_cube_m3 = 0.0000
      vacating.is_zone_anchor           = false
      if the vacating unit WAS the anchor of its nest group:
        survivors = FinishedUnit rows still occupying the same
                    (warehouse_id, storage_zone_code, product_model_id) group
        if survivors is non-empty:
          promoted = first(survivors ordered by stored_at ASC,
                                     tie-break hull_serial ASC)
          promoted.is_zone_anchor          = true
          promoted.stored_footprint_cube_m3 = round( model.gross_cube_m3 , 4 )
          # PROMOTION RAISES the group's total footprint by
          # gross_cube_m3 * (1 - nest_factor), so releasing one hull can leave
          # the warehouse MORE utilised than a naive subtraction predicts.
      # hull_serial is a deterministic business string, never a random id, so
      # the promotion order is reproducible.
    input_set: |
      FinishedUnit rows in logistics_status STORED or LOADED sharing the
      vacating unit's (warehouse_id, storage_zone_code, product_model_id)
      triple. Ordering is by stored_at ASC with hull_serial ASC as the total
      tie-break.
    constants: {}
    precision: "4 decimal places round_half_up; every footprint write is rounded before the warehouse rollup reads it"
    variants:
      - name: ANCHOR_PLACEMENT
        when: "the stored unit is the first of its nest group in the chosen zone"
        difference: "full gross cube is charged and is_zone_anchor is set true"
      - name: ANCHOR_PROMOTION
        when: "an anchor vacates while nested followers remain"
        difference: "the earliest surviving follower is re-charged from nested cube to full gross cube inside the same request, so the warehouse's committed cube does not fall by the departing unit's full footprint"

  - name: warehouse_footprint_posture
    trigger: "recomputed inside every request that writes any FinishedUnit.stored_footprint_cube_m3 for the site (store, release-storage, shipment depart, shipment cancel)"
    algorithm: threshold
    formula: |
      committed_cube_m3 = round( sum of u.stored_footprint_cube_m3 over
            FinishedUnit rows u with u.warehouse_id == w.id
            AND u.logistics_status IN {STORED, LOADED} , 4 )
      # Conservation invariant: this value MUST equal the sum of the
      # per-unit footprints at all times; no independent counter is kept.

      utilization_pct = round( committed_cube_m3
                               / w.footprint_capacity_cube_m3 * 100 , 2 )

      if utilization_pct >= w.frozen_threshold_pct:          posture = FROZEN
      elif utilization_pct >= w.restricted_threshold_pct:     posture = RESTRICTED
      else:                                                   posture = NORMAL
      # BOTH thresholds are >= : at exactly 85.00 the site is RESTRICTED, at
      # exactly 95.00 it is FROZEN. 84.99 is NORMAL and 94.99 is RESTRICTED.
    input_set: |
      FinishedUnit rows in logistics_status STORED or LOADED with
      warehouse_id == this warehouse. Units in UNALLOCATED, IN_TRANSIT or
      DELIVERED are excluded, which is exactly why a trailer departure — not
      a seal — is the event that frees footprint.
    constants:
      DEFAULT_RESTRICTED_THRESHOLD_PCT: 85.00
      DEFAULT_FROZEN_THRESHOLD_PCT: 95.00
      THRESHOLD_COMPARISON: "greater_than_or_equal_triggers"
    precision: "committed cube 4 decimal places, utilization 2 decimal places round_half_up; the comparison uses the ROUNDED utilization_pct, so 94.995 rounds to 95.00 and freezes the site"
    variants:
      - name: TIGHTENING
        when: "the recompute follows a footprint increase (store)"
        difference: "crossing frozen_threshold_pct blocks orders targeting this site (CASCADE-H link 4); crossing only restricted_threshold_pct blocks nothing but caps new shipment trailer sizing"
      - name: LOOSENING
        when: "the recompute follows a footprint decrease (release-storage, depart, shipment cancel)"
        difference: "leaving FROZEN unblocks BLOCKED_WAREHOUSE orders (CASCADE-C link 4); because anchor promotion can add cube back, a decrease does not always lower utilization_pct"

  - name: build_ahead_commitment
    trigger: "POST /finished-units/{finished_unit_id}/store, POST /finished-units/{finished_unit_id}/release-storage, POST /shipments/{shipment_id}/depart, POST /demand-forecast-buckets"
    algorithm: aggregation
    formula: |
      build_ahead_cap_qty = floor( bucket.forecast_qty
                                   * bucket.build_ahead_cap_pct / 100 )
      # FLOOR, not round: a forecast of 25 at 60.00 pct caps at 15, and a
      # forecast of 26 caps at 15 as well (15.6 floors to 15).

      build_ahead_committed_qty = count of FinishedUnit rows u with
            u.demand_bucket_id == bucket.id
            AND u.build_status == SELLABLE
            AND u.logistics_status IN {STORED, LOADED}

      # Admission test at store time — <= on the POST-increment count.
      if build_ahead_committed_qty + 1 > build_ahead_cap_qty:
        reject with ERR_BUILD_AHEAD_CAP_EXCEEDED
      # Storing the unit that lands exactly ON the cap is ACCEPTED; the next
      # one is refused.
    input_set: |
      FinishedUnit rows whose demand_bucket_id is this bucket, counted only
      while they are SELLABLE and physically in a warehouse (STORED or
      LOADED). A unit that departs on a trailer, is reworked, or is scrapped
      drops out of the count and frees capacity in the bucket.
    constants:
      DEFAULT_BUILD_AHEAD_CAP_PCT: 60.00
      CAP_ROUNDING: "floor"
    precision: "cap is an integer via floor; the committed count is an integer"
    variants:
      - name: IN_WINDOW
        when: "the logical-clock date is within [window_start_on, window_end_on] inclusive"
        difference: "the store is admitted subject to the cap; both boundary dates are inside the window"
      - name: OUT_OF_WINDOW
        when: "the logical-clock date is before window_start_on or after window_end_on"
        difference: "the store is refused with ERR_BUILD_AHEAD_WINDOW_MISMATCH regardless of remaining cap, and the cap check is never reached"

  - name: shipment_cube_rollup
    trigger: "POST /shipment-lines, POST /shipment-lines/{shipment_line_id}/remove, POST /shipments/{shipment_id}/cancel"
    algorithm: aggregation
    formula: |
      lines = ShipmentLine rows with shipment_id == s.id AND status == LOADED
              ordered by created_at ASC, tie-break FinishedUnit.hull_serial ASC

      # ---- per-line nesting: position 1 of each product model pays full cube ----
      for each line L in that order:
        model = ProductModel(FinishedUnit(L.finished_unit_id).product_model_id)
        L.nest_position = 1 + (number of EARLIER lines in the order whose unit
                               has the same product_model_id)
        L.line_gross_cube_m3  = round( model.gross_cube_m3 , 4 )
        L.line_nested_cube_m3 = ( L.nest_position == 1 )
              ? round( model.gross_cube_m3 , 4 )
              : round( model.gross_cube_m3 * model.nest_factor , 4 )

      loaded_cube_m3 = round( sum over lines of L.line_gross_cube_m3 , 4 )
      nested_cube_m3 = round( sum over lines of L.line_nested_cube_m3 , 4 )
      loaded_weight_kg = round( sum over lines of
            ProductModel(FinishedUnit(L.finished_unit_id).product_model_id).unit_weight_kg , 3 )

      cube_utilization_pct = round( nested_cube_m3
                                    / s.trailer_cube_capacity_m3 * 100 , 2 )
      if nested_cube_m3 == 0.0000:
        density_kg_per_m3 = 0.000
      else:
        density_kg_per_m3 = round( loaded_weight_kg / nested_cube_m3 , 3 )

      # Trailer admission tests, both on the ROUNDED post-add values:
      #   round(nested_cube_m3 + candidate, 4) <= trailer_cube_capacity_m3
      #   round(loaded_weight_kg + unit_weight_kg, 3) <= trailer_max_payload_kg
      # Both use <= , so a load that exactly fills the trailer is accepted.
    input_set: |
      ShipmentLine rows in status LOADED only; REMOVED lines contribute
      nothing and their nest_position is vacated, forcing a renumbering from
      1 over the survivors. The ordering key is created_at ASC with the unit's
      hull_serial ASC as a total tie-break — line ids are never consulted, so
      removing the first line of a model promotes the next one to full cube
      deterministically.
    constants: {}
    precision: "cubes 4 decimal places, weight 3, utilization 2, density 3 — all round_half_up; per-line cubes are rounded before the shipment sums"
    variants:
      - name: ADD_LINE
        when: "evaluated inside POST /shipment-lines"
        difference: "the candidate line's nested cube is provisionally appended and tested against the trailer BEFORE the row is written, so a rejected line leaves no trace and the shipment's version does not advance"
      - name: REMOVE_LINE
        when: "evaluated inside POST /shipment-lines/{shipment_line_id}/remove or a shipment cancel"
        difference: "nest_position is renumbered over the survivors, which can convert a nested follower into a full-cube position-1 line, so removing one hull can RAISE nested_cube_m3 for the remaining load"

  - name: shipment_freight
    trigger: "POST /shipments/{shipment_id}/seal sets quoted_freight_cents; POST /shipments/{shipment_id}/deliver sets billed_freight_cents"
    algorithm: tiered_pricing
    formula: |
      lines = ShipmentLine rows with shipment_id == s.id AND status == LOADED

      # ---- STEP 1: per-line chargeable mass, ROUNDED PER LINE ----
      for each line L:
        model = ProductModel(FinishedUnit(L.finished_unit_id).product_model_id)
        billable_cube_L = <see variants: L.line_nested_cube_m3 or L.line_gross_cube_m3>
        dim_weight_kg_L = round( billable_cube_L * DIM_FACTOR_KG_PER_M3 , 3 )
        chargeable_kg_L = max( model.unit_weight_kg , dim_weight_kg_L )
        # Bulky low-density hulls almost always bill on dimensional weight;
        # the max() is what makes the nested-vs-gross basis matter.
        L.line_freight_cents = round_half_up(
              chargeable_kg_L * ZONE_RATE_CENTS_PER_KG[s.destination_zone] )

      pre_discount_cents = sum over lines of L.line_freight_cents
      # Rounded per line, THEN summed. One round at the end gives a
      # different total.

      # ---- STEP 2: utilisation discount tier, chosen ONCE ----
      discount_pct = the rate of the FIRST UTILIZATION_DISCOUNT_TIERS row
                     (read top to bottom) whose min_utilization_pct
                     <= s.cube_utilization_pct, else 0.00
      # The tier is selected from cube_utilization_pct BEFORE any money is
      # adjusted and is NEVER re-selected afterwards.
      discount_cents      = round_half_up( pre_discount_cents * discount_pct / 100 )
      after_discount_cents = pre_discount_cents - discount_cents

      # ---- STEP 3: fuel surcharge — STRICTLY AFTER the discount ----
      fuel_cents = round_half_up( after_discount_cents * FUEL_SURCHARGE_PCT / 100 )
      freight_cents = after_discount_cents + fuel_cents
      # ORDER IS PINNED: discount first, then fuel on the discounted base.
      # Applying fuel first and discounting the fuelled total yields a
      # different integer.
    input_set: |
      ShipmentLine rows in status LOADED at the moment of the seal (for the
      quote) or at the moment of delivery (for the bill). Because a shipment
      can be unsealed, have lines removed, and be resealed, the two figures
      are computed over possibly different line sets as well as different
      cube bases.
    constants:
      DIM_FACTOR_KG_PER_M3: 120.000
      ZONE_RATE_CENTS_PER_KG: { Z1: 42, Z2: 61, Z3: 88 }
      UTILIZATION_DISCOUNT_TIERS:
        - { min_utilization_pct: 90.00, rate_pct: 12.00 }
        - { min_utilization_pct: 75.00, rate_pct: 7.50 }
        - { min_utilization_pct: 60.00, rate_pct: 3.00 }
      FUEL_SURCHARGE_PCT: 9.50
      MIN_SEAL_UTILIZATION_PCT: 60.00
    precision: "integer cents; per-line freight rounded round_half_up before summation; discount and fuel each rounded round_half_up; dimensional weight 3 decimal places"
    variants:
      - name: QUOTED
        when: "computed at POST /shipments/{shipment_id}/seal into quoted_freight_cents"
        difference: |
          Uses billable_cube_L = L.line_nested_cube_m3, i.e. the plant's
          nesting is credited to the customer. For a trailer of identical
          hulls this is materially cheaper than BILLED.
      - name: BILLED
        when: "computed at POST /shipments/{shipment_id}/deliver into billed_freight_cents"
        difference: |
          Uses billable_cube_L = L.line_gross_cube_m3 — the carrier bills the
          un-nested cube it actually tendered. Same lines, same zone, same
          tier ladder, higher integer. Both values are retained so the
          quote-to-bill variance is observable on one shipment row.

  - name: warranty_payout
    trigger: "POST /warranty-claims/{warranty_claim_id}/approve"
    algorithm: tiered_pricing
    formula: |
      unit  = FinishedUnit(claim.finished_unit_id)
      model = ProductModel(unit.product_model_id)

      # ---- STEP 0: age in whole months, floor ----
      months_in_service = the number of COMPLETE calendar months from
                          unit.delivered_at to the logical clock (floor; a
                          claim at 12 months and 29 days is 12)
      if months_in_service > WARRANTY_TERM_MONTHS:
        reject with ERR_WARRANTY_TERM_EXPIRED
      # exactly 60 is still inside the term

      # ---- STEP 1: coverage share (variant-dependent) ----
      coverage_pct = <see variants>

      # ---- STEP 2: claim-type factor, then the gross ----
      pre_fee_gross_cents = round_half_up( model.msrp_cents
                                           * coverage_pct / 100
                                           * CLAIM_TYPE_FACTOR[claim.claim_type] )

      # ---- STEP 3: admin fee tier, chosen ONCE from the GROSS ----
      admin_fee_pct = the rate of the FIRST ADMIN_FEE_TIERS row whose
                      max_gross_cents >= pre_fee_gross_cents,
                      else ADMIN_FEE_TOP_RATE_PCT
      admin_fee_cents = round_half_up( pre_fee_gross_cents * admin_fee_pct / 100 )
      # The tier is selected from pre_fee_gross_cents BEFORE the storage
      # deduction and is NEVER re-selected against the reduced amount, so a
      # claim whose post-deduction value falls into a cheaper band still pays
      # the expensive band's fee.

      # ---- STEP 4: storage-guidance deduction ----
      if claim.storage_review_status == WAIVED:
        storage_deduction_cents = round_half_up( pre_fee_gross_cents
                                    * STORAGE_WAIVED_DEDUCTION_PCT / 100 )
      else:                                  # GUIDANCE_VERIFIED
        storage_deduction_cents = 0

      # ---- STEP 5: net, floored at zero ----
      net_payout_cents = max( 0 , pre_fee_gross_cents
                                  - storage_deduction_cents - admin_fee_cents )

      # ---- STEP 6: reserve gate ----
      if net_payout_cents > model.warranty_reserve_cents:
        reject with ERR_WARRANTY_RESERVE_EXHAUSTED
      # <= passes: a payout that exactly drains the reserve is approved
    input_set: |
      One WarrantyClaim, its FinishedUnit (for delivered_at) and that unit's
      ProductModel (for msrp_cents, warranty_basis and the live reserve).
      Claims in claim_status other than UNDER_REVIEW are never priced, and a
      claim whose storage_review_status is NOT_STARTED or GUIDANCE_VIOLATED
      is refused before pricing begins.
    constants:
      WARRANTY_TERM_MONTHS: 60
      CLAIM_TYPE_FACTOR: { HULL_DEFORMATION: 1.00, HARDWARE: 0.60, COSMETIC: 0.30 }
      FLAT_SCHEDULE_BANDS:
        - { max_months: 12, coverage_pct: 80.00 }
        - { max_months: 36, coverage_pct: 50.00 }
        - { max_months: 60, coverage_pct: 25.00 }
      ADMIN_FEE_TIERS:
        - { max_gross_cents: 50000, rate_pct: 12.00 }
        - { max_gross_cents: 200000, rate_pct: 8.00 }
      ADMIN_FEE_TOP_RATE_PCT: 5.00
      STORAGE_WAIVED_DEDUCTION_PCT: 35.00
      MONTHS_ROUNDING: "floor_complete_months"
    precision: "integer cents; coverage_pct at 2 decimal places round_half_up; gross, fee and deduction each rounded round_half_up to whole cents in the order shown"
    variants:
      - name: PRO_RATA_AGE
        when: "ProductModel.warranty_basis == PRO_RATA_AGE"
        difference: |
          coverage_pct = round( (WARRANTY_TERM_MONTHS - months_in_service)
                                / WARRANTY_TERM_MONTHS * 100 , 2 )
          — a continuous straight-line decay, so every extra month reduces the
          payout by roughly 1.67 pct of MSRP.
      - name: FLAT_SCHEDULE
        when: "ProductModel.warranty_basis == FLAT_SCHEDULE"
        difference: |
          coverage_pct = the coverage_pct of the FIRST FLAT_SCHEDULE_BANDS row
          whose max_months >= months_in_service — a step function that is flat
          within a band and drops at 13 and 37 months. For the same unit at
          the same age the two variants produce different net_payout_cents,
          and the divergence can also flip the ADMIN_FEE_TIERS band.

  - name: cycle_window_projection
    trigger: "POST /molding-cycles (projection), POST /molding-cycles/{molding_cycle_id}/start-oven and .../demold (actuals)"
    algorithm: interval_merge
    formula: |
      # ---- projected windows, written at schedule time ----
      oven_end_at             = oven_start_at + scheduled_oven_minutes
      cooling_window_start_at = oven_end_at                      # butt-jointed
      cooling_window_end_at   = cooling_window_start_at + scheduled_cooling_minutes

      # BOUNDARY SEMANTICS (deliberately not uniform):
      #   oven arm span   = [oven_start_at, oven_end_at)                 HALF-OPEN
      #   cooling bay span= [cooling_window_start_at, cooling_window_end_at]  CLOSED
      #   mold span       = [oven_start_at, cooling_window_end_at)       HALF-OPEN

      # ---- actual minutes, floored whole minutes ----
      actual_oven_minutes    = floor( (actual_oven_end_at - actual_oven_start_at)
                                      in seconds / 60 )
      actual_cooling_minutes = floor( (actual_cooling_end_at - actual_oven_end_at)
                                      in seconds / 60 )
      # FLOOR: 29 minutes 59 seconds is 29 minutes, so a demold one second
      # early breaches min_cooling_minutes.
      if actual_cooling_minutes < ProductModel.min_cooling_minutes:
        reject with ERR_COOLING_TIME_INSUFFICIENT
      # exactly min_cooling_minutes passes
    input_set: |
      One MoldingCycle. scheduled_* minutes are validated as positive
      integers; the projections are recomputed if scheduled minutes change
      before the oven starts, and are frozen once status leaves SCHEDULED.
    constants:
      MINUTE_ROUNDING: "floor"
    precision: "timestamps to the second (UTC, ISO8601 with Z); minute counts are integers via floor"
    variants:
      - name: PROJECTED
        when: "cycle.status == SCHEDULED"
        difference: "windows come from scheduled_oven_minutes / scheduled_cooling_minutes and are what the three overlap checks read"
      - name: ACTUAL
        when: "cycle.status IN {COOLING, DEMOLDED}"
        difference: "actual_oven_minutes drives oven energy cost and actual_cooling_minutes drives the FINAL warpage variant, so a cycle that ran long costs more and warps less than its own projection implied"

  - name: oven_arm_window_check
    trigger: "POST /molding-cycles"
    algorithm: interval_merge
    formula: |
      # EXCLUSIVE occupancy of one arm of one station, with a SYMMETRIC
      # changeover buffer applied to BOTH sides of the existing cycle.
      conflicting = MoldingCycle rows c with
            c.oven_station_id == new.oven_station_id
            AND c.arm_index == new.arm_index
            AND c.status IN {SCHEDULED, OVEN_RUNNING}      # COOLING, DEMOLDED and
                                                          # ABORTED never block an arm
            AND overlaps_half_open(
                  [ c.oven_start_at - station.changeover_buffer_min ,
                    c.oven_end_at   + station.changeover_buffer_min ) ,
                  [ new.oven_start_at , new.oven_end_at ) )

      if count(conflicting) >= 1: reject with ERR_OVEN_WINDOW_CONFLICT
      # HALF-OPEN, so a new cycle starting exactly at
      # (existing.oven_end_at + changeover_buffer_min) is ACCEPTED, and one
      # starting one second earlier is refused. The buffer is applied to the
      # STORED cycle's span, not to the candidate's, so it is counted once.
    input_set: |
      MoldingCycle rows sharing (oven_station_id, arm_index) in status
      SCHEDULED or OVEN_RUNNING. Arms of the same station are independent, so
      arm_index 1 and arm_index 2 may hold identical windows.
    constants:
      OVEN_OCCUPANCY_MODE: "exclusive_per_arm"
      OVEN_BOUNDARY: "half_open_with_symmetric_buffer"
    precision: "second-level timestamp comparison; the buffer is whole minutes"
    variants:
      - name: SAME_ARM
        when: "an existing cycle shares both oven_station_id and arm_index"
        difference: "the buffered exclusive test applies and one overlapping cycle is enough to refuse"
      - name: DIFFERENT_ARM_SAME_STATION
        when: "an existing cycle shares oven_station_id but not arm_index"
        difference: "no conflict is possible — the arm, not the station, is the exclusive resource, so a station with arm_count 4 can hold four fully coincident windows"

  - name: cooling_bay_slot_check
    trigger: "POST /molding-cycles"
    algorithm: interval_merge
    formula: |
      # AGGREGATE capacity, CLOSED interval, NO buffer — deliberately
      # different on all three axes from oven_arm_window_check.
      intersecting = MoldingCycle rows c with
            c.cooling_bay_id == new.cooling_bay_id
            AND c.status IN {SCHEDULED, OVEN_RUNNING, COOLING}   # a cycle still in the
                                                                # oven already holds its
                                                                # future bay slot
            AND overlaps_closed(
                  [ c.cooling_window_start_at , c.cooling_window_end_at ] ,
                  [ new.cooling_window_start_at , new.cooling_window_end_at ] )

      if count(intersecting) >= bay.concurrent_slot_capacity:
        reject with ERR_COOLING_BAY_CAPACITY_EXCEEDED
      # CLOSED, so a new window whose start equals an existing window's END
      # to the second DOES intersect and consumes a slot — the opposite of
      # the oven arm rule. Capacity is compared with >= on the count of
      # existing occupants, so a bay with capacity 2 accepts the second
      # cycle and refuses the third.
      # The bay's airflow_mode must equal new.cooling_mode, otherwise
      # ERR_COOLING_MODE_MISMATCH is raised before this check.
    input_set: |
      MoldingCycle rows with the same cooling_bay_id in status SCHEDULED,
      OVEN_RUNNING or COOLING. DEMOLDED and ABORTED cycles release their slot
      immediately.
    constants:
      COOLING_OCCUPANCY_MODE: "aggregate_slot_capacity"
      COOLING_BOUNDARY: "closed_no_buffer"
    precision: "second-level timestamp comparison; the slot count is an integer"
    variants:
      - name: UNDER_CAPACITY
        when: "count(intersecting) < bay.concurrent_slot_capacity"
        difference: "the cycle is admitted and the bay may now be exactly full"
      - name: AT_CAPACITY
        when: "count(intersecting) == bay.concurrent_slot_capacity"
        difference: "refused with ERR_COOLING_BAY_CAPACITY_EXCEEDED even though every individual window is legal, because the constraint is collective rather than pairwise"

  - name: mold_service_counter
    trigger: "POST /molding-cycles/{molding_cycle_id}/demold, POST /molds/{mold_id}/complete-service"
    algorithm: threshold
    formula: |
      # ---- on demold ----
      mold.cycles_since_service = mold.cycles_since_service + 1
      # ABORTED cycles never increment the counter — only a completed demold
      # wears the tool.
      if mold.cycles_since_service >= mold.service_interval_cycles:
        mold.status = MAINTENANCE                        # >= : reaching the
                                                         # interval exactly
                                                         # triggers service
        # CASCADE-B links 2-5 then fire.

      # ---- on complete-service ----
      mold.cycles_since_service = 0                      # full reset, not a
                                                         # decrement by the
                                                         # interval
      mold.status = AVAILABLE
    input_set: |
      A single Mold row. The counter is not derived from MoldingCycle history
      — it is a stored counter with an explicit reset, so a serviced mold with
      100 lifetime demolds reads 0.
    constants:
      SERVICE_COMPARISON: "greater_than_or_equal_triggers"
      SERVICE_RESET: "to_zero"
    precision: "integers"
    variants:
      - name: BELOW_INTERVAL
        when: "cycles_since_service < service_interval_cycles after the increment"
        difference: "the mold returns to AVAILABLE and stays eligible for mold_selection"
      - name: AT_OR_ABOVE_INTERVAL
        when: "cycles_since_service >= service_interval_cycles after the increment"
        difference: "the mold goes to MAINTENANCE, which removes it from the mold_selection pool and aborts its other SCHEDULED cycles, releasing their resin"

  - name: order_completion_rollup
    trigger: "POST /finished-units/{finished_unit_id}/inspect, POST /finished-units/{finished_unit_id}/scrap"
    algorithm: aggregation
    formula: |
      units = FinishedUnit rows reached through MoldingCycle rows whose
              production_order_id == order.id

      completed_qty = count of units u with u.build_status == SELLABLE
                      OR u.logistics_status IN {STORED, LOADED, IN_TRANSIT, DELIVERED}
      # A unit that has shipped still counts as completed even though its
      # build_status remains SELLABLE — the two axes are read together.
      scrapped_qty  = count of units u with u.build_status == SCRAPPED

      if order.status == IN_PRODUCTION and completed_qty >= order.ordered_qty:
        order.status = COMPLETE
      if order.status == COMPLETE and completed_qty < order.ordered_qty:
        order.status = IN_PRODUCTION                  # CASCADE-D link 3
      # >= on completion, so over-production stays COMPLETE.
    input_set: |
      FinishedUnit rows for this order's cycles, including units from ABORTED
      cycles' predecessors (there are none — aborted cycles produce no units)
      but excluding nothing else. Units in build_status DEMOLDED, TRIMMED,
      OUTFITTED or REWORK count toward neither figure.
    constants: {}
    precision: "integers"
    variants:
      - name: UPWARD
        when: "an inspect returns PASS"
        difference: "completed_qty rises and an IN_PRODUCTION order may reach COMPLETE"
      - name: DOWNWARD
        when: "a re-inspect returns REWORK or SCRAP on an already-SELLABLE unit"
        difference: "completed_qty falls and a COMPLETE order reverts to IN_PRODUCTION, which also re-opens cycle scheduling for that order"

  - name: resin_mass_ledger
    trigger: "POST /resin-charges, POST /molding-cycles/{molding_cycle_id}/start-oven, POST /resin-charges/{resin_charge_id}/release, and every cascade link that releases a charge"
    algorithm: constraint_propagation
    formula: |
      # THREE-BUCKET CONSERVED LEDGER on every ResinLot.
      # INVARIANT (must hold after every request, checked before commit):
      #   round( available_kg + reserved_kg + consumed_kg , 3 ) == received_kg

      # reserve  (POST /resin-charges):
      available_kg -= charge_kg ; reserved_kg += charge_kg
      #   requires available_kg >= charge_kg BEFORE the move, otherwise
      #   ERR_RESIN_INSUFFICIENT (>= , so draining to exactly 0.000 is legal)

      # consume  (start-oven, charge RESERVED -> CONSUMED):
      reserved_kg -= charge_kg ; consumed_kg += charge_kg

      # release  (charge RESERVED -> RELEASED, the COMPENSATING move):
      reserved_kg -= charge_kg ; available_kg += charge_kg
      #   consumed_kg is NEVER decremented — consumption is irreversible, so
      #   an aborted cycle after oven start cannot return its resin.

      # derived per charge:
      virgin_kg           = round( charge_kg - regrind_kg , 3 )
      charge_regrind_pct  = round( regrind_kg / charge_kg * 100 , 2 )

      # depletion / revival:
      if available_kg == 0.000 and status == AVAILABLE:  status = DEPLETED
      if available_kg  > 0.000 and status == DEPLETED:   status = AVAILABLE
    input_set: |
      One ResinLot's three mass buckets plus the ResinCharge rows drawing on
      it. Only charges in status RESERVED hold reserved_kg; CONSUMED charges
      hold consumed_kg; RELEASED charges hold nothing. received_kg is
      immutable after creation, which is what makes the invariant checkable.
    constants:
      MASS_INVARIANT: "available_kg + reserved_kg + consumed_kg == received_kg"
      CONSUMED_IS_IRREVERSIBLE: true
    precision: "3 decimal places round_half_up on every bucket; the invariant is checked on the rounded sum"
    variants:
      - name: PRE_OVEN_RELEASE
        when: "the charge is still RESERVED when the cycle aborts"
        difference: "mass returns to available_kg and the lot may revive from DEPLETED to AVAILABLE, unblocking BLOCKED_RESIN orders"
      - name: POST_OVEN_ABORT
        when: "the charge is already CONSUMED when the cycle aborts"
        difference: "no mass returns; the abort is recorded, the order keeps its material cost, and the lot's available_kg is unchanged so no order is unblocked"

  - name: warranty_reserve_ledger
    trigger: "POST /warranty-claims/{warranty_claim_id}/approve, POST /warranty-claims/{warranty_claim_id}/void"
    algorithm: constraint_propagation
    formula: |
      # TWO-BUCKET CONSERVED LEDGER on every ProductModel.
      # INVARIANT (must hold after every request):
      #   warranty_reserve_cents + warranty_paid_cents == initial_warranty_reserve_cents

      # approve:
      warranty_reserve_cents -= claim.net_payout_cents
      warranty_paid_cents    += claim.net_payout_cents
      #   requires net_payout_cents <= warranty_reserve_cents BEFORE the move,
      #   otherwise ERR_WARRANTY_RESERVE_EXHAUSTED

      # void (the COMPENSATING move, exact reversal):
      warranty_reserve_cents += claim.net_payout_cents
      warranty_paid_cents    -= claim.net_payout_cents
      #   the claim's stored money fields are retained as the audit record and
      #   are NOT zeroed, so the reversal is reproducible from the claim row
    input_set: |
      One ProductModel's two money buckets and the WarrantyClaim rows in
      claim_status APPROVED that draw on them. DENIED, WITHDRAWN, SUBMITTED
      and UNDER_REVIEW claims move no money; a VOIDED claim's money has been
      returned. initial_warranty_reserve_cents is immutable after creation.
    constants:
      RESERVE_INVARIANT: "warranty_reserve_cents + warranty_paid_cents == initial_warranty_reserve_cents"
    precision: "integer cents; no rounding occurs in the ledger itself because net_payout_cents was already rounded by calculations.warranty_payout"
    variants:
      - name: DRAW
        when: "a claim is approved"
        difference: "the reserve falls and paid rises by the identical integer, so the sum is preserved and the next approval sees less headroom"
      - name: RESTORE
        when: "an approved claim is voided"
        difference: "the exact same integer moves back, restoring the headroom; this is the only path that raises warranty_reserve_cents, and it is what makes a stale ProductModel version material for approvals"

  - name: hull_serial_assignment
    trigger: "POST /molding-cycles/{molding_cycle_id}/demold — one FinishedUnit per mold cavity"
    algorithm: chronological
    formula: |
      # Deterministic, reproducible, and derived only from business fields.
      build_seq = 1 + (number of FinishedUnit rows already created for this
                       ProductionOrder, counted across all its cycles)
      for cavity_index in 1 .. Mold(cycle.mold_id).cavity_count:
        hull_serial = order.order_code + "-" + zero_pad(cavity_index, 2)
                                      + "-" + zero_pad(build_seq + cavity_index - 1, 4)
      # Cavities are created in ascending cavity_index order, so the created_at
      # ordering of siblings matches their cavity order. No random id
      # participates in the serial, which is why hull_serial is usable as a
      # total tie-break in storage_footprint and shipment_cube_rollup.
    input_set: |
      The demolding MoldingCycle, its Mold's cavity_count, and the count of
      FinishedUnit rows already produced for the ProductionOrder. Units from
      ABORTED cycles do not exist, so they never consume a sequence number.
    constants:
      SERIAL_FORMAT: "<order_code>-<cavity_index:2>-<build_seq:4>"
    precision: "integers, zero-padded to the widths shown"
    variants:
      - name: SINGLE_CAVITY
        when: "Mold.cavity_count == 1"
        difference: "exactly one FinishedUnit is created and build_seq advances by 1"
      - name: MULTI_CAVITY
        when: "Mold.cavity_count > 1"
        difference: "cavity_count units are created in one request, each inheriting the same cycle-level charged mass and provisional warpage but receiving its own measurements at inspection, so sibling hulls from one cycle can end in different verdicts"

# =============================================================================
# §1.4 VALIDATION RULES — evaluated in strictly ascending `priority` order.
# The FIRST failing check short-circuits the request; no later check runs and
# no partial write is committed.
#
# Domain ordering rationale (rotomolding plant): identity first, then
# existence, then schema, then the state machines, then PRODUCT-SAFETY and
# process-compliance limits (a hull that is out of spec must never be built
# or shipped, whatever the commercial cost), then referential and temporal
# constraints, then capacity / money, and finally optimistic-concurrency
# version checks so that a stale writer learns about the real defect in its
# request before it learns its view is out of date.
#
# Deliberate priority pairs (a single request can violate both members; the
# lower priority number always wins):
#   PAIR-1  state 34        beats business_temporal 62   (order not schedulable
#                                                        vs oven arm conflict)
#   PAIR-2  business_safety 52 beats business_fiscal 72  (regrind ceiling vs
#                                                        insufficient resin)
#   PAIR-3  state 40        beats business_fiscal 74     (warehouse FROZEN vs
#                                                        build-ahead cap)
#   PAIR-4  business_referential 60 beats business_fiscal 76 (customer suspended
#                                                        vs reserve exhausted)
#   PAIR-5  business_safety 55 beats business_temporal 64 (storage review
#                                                        incomplete vs warranty
#                                                        term expired)
# =============================================================================
validations:
  # ---------------- AUTHENTICATION / AUTHORIZATION (1-9) ----------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role is one of the eight roles declared in §1.7"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "the endpoint's roles list contains X-User-Role"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "for an entity_backed role, X-User-ID is the id of an existing row of that role's backing entity (Technician for the four shop-floor roles, Customer for Customer)"
    error_id: ERR_IDENTITY_NOT_FOUND
    http_status: 401
    applies_to: "all endpoints whose roles include an entity_backed role"
  - priority: 5
    category: auth
    check: "the backing Technician's role_code equals the shop-floor role being asserted (RESIN_TECH for ResinTechnician, MOLDING_OPERATOR for MoldingOperator, ASSEMBLY_TECH for AssemblyTechnician, QUALITY_INSPECTOR for QualityInspector)"
    error_id: ERR_ROLE_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "all endpoints whose roles include ResinTechnician, MoldingOperator, AssemblyTechnician or QualityInspector"
  - priority: 6
    category: auth
    check: "a Customer may only read or act on WarrantyClaim rows whose customer_id equals X-User-ID, and only read FinishedUnit rows it owns through a DELIVERED shipment"
    error_id: ERR_CUSTOMER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "all endpoints whose roles include Customer"

  # ---------------- EXISTENCE (10-19), left to right in the path ----------------
  - priority: 10
    category: existence
    check: "every id in the request path resolves, validated left to right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter"
  - priority: 11
    category: existence
    check: "product_model_id in the body resolves to a ProductModel"
    error_id: ERR_PRODUCT_MODEL_NOT_FOUND
    http_status: 404
    applies_to: "POST /molds, POST /production-orders, POST /demand-forecast-buckets"
  - priority: 12
    category: existence
    check: "production_order_id, oven_station_id and cooling_bay_id in the body all resolve"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /molding-cycles"
  - priority: 13
    category: existence
    check: "molding_cycle_id and resin_lot_id in the body both resolve"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /resin-charges"
  - priority: 14
    category: existence
    check: "shipment_id and finished_unit_id in the body both resolve"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /shipment-lines"
  - priority: 15
    category: existence
    check: "target_warehouse_id resolves, and demand_bucket_id resolves when supplied"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /production-orders"
  - priority: 16
    category: existence
    check: "finished_unit_id and customer_id in the body both resolve"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /warranty-claims"

  # ---------------- SCHEMA / ENUM / RANGE (20-29) ----------------
  - priority: 20
    category: business_constraint
    check: "all required body fields are present with the declared JSON types"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST, PUT and PATCH endpoints"
  - priority: 21
    category: business_constraint
    check: "every enum-typed field holds a declared member of its enum (hull_type, size_class, resin_grade, airflow_mode, cooling_mode, destination_zone, claim_type, cosmetic_defect_grade, warranty_basis, role_code, certifications members)"
    error_id: ERR_INVALID_ENUM_VALUE
    http_status: 422
    applies_to: "all POST, PUT and PATCH endpoints"
  - priority: 22
    category: business_constraint
    check: "numeric ranges hold (quantity, mass, count and rate fields): ordered_qty >= 1, cavity_count in 1..4, arm_count in 1..6, arm_index in 1..OvenStation.arm_count, concurrent_slot_capacity >= 1, scheduled_oven_minutes >= 1, scheduled_cooling_minutes >= 1, charge_kg > 0.000, 0.000 <= regrind_kg <= charge_kg, oven_temp_c in 150..350, arm_rpm_major > 0, arm_rpm_minor > 0, all *_pct in 0.00..100.00, limit in 1..100, offset >= 0"
    error_id: ERR_INVALID_QUANTITY
    http_status: 422
    applies_to: "all POST, PUT, PATCH and list endpoints"
  - priority: 23
    category: business_constraint
    check: "all timestamps parse as ISO8601 UTC with a trailing Z, and all dates as YYYY-MM-DD"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /molding-cycles, POST /resin-lots, POST /demand-forecast-buckets, POST /_clock/set_current_utc"
  - priority: 24
    category: business_constraint
    check: "window_start_on <= window_end_on on a DemandForecastBucket"
    error_id: ERR_INVALID_WINDOW
    http_status: 422
    applies_to: "POST /demand-forecast-buckets"
  - priority: 25
    category: business_constraint
    check: "wall_thickness_points contains at least 6 numeric measurements, each > 0.000"
    error_id: ERR_INSUFFICIENT_MEASUREMENTS
    http_status: 422
    applies_to: "POST /finished-units/{finished_unit_id}/inspect"
  - priority: 26
    category: business_constraint
    check: "uniqueness of business codes: model_code, mold_code, station_code, bay_code, employee_code, customer_code, site_code, lot_code, order_code, shipment_code, claim_code, hull_serial, and (season_code, product_model_id) on DemandForecastBucket; zone_code is unique within one Warehouse.zones array"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "all creation endpoints"
  - priority: 27
    category: business_constraint
    check: "a HULL_DEFORMATION claim reports reported_deformation_mm >= DEFORMATION_THRESHOLD_MM (3.00); exactly 3.00 is claimable and 2.99 is not"
    error_id: ERR_DEFORMATION_BELOW_THRESHOLD
    http_status: 422
    applies_to: "POST /warranty-claims"

  # ---------------- STATE PRECONDITIONS (30-49) ----------------
  - priority: 30
    category: state
    check: "the acting Technician's status is ACTIVE"
    error_id: ERR_TECHNICIAN_SUSPENDED
    http_status: 403
    applies_to: "all endpoints performed by ResinTechnician, MoldingOperator, AssemblyTechnician or QualityInspector"
  - priority: 31
    category: state
    check: "the acting Technician holds the certification the operation requires (RESIN_BLENDING to create a charge, FIXTURE_ASSEMBLY to outfit, both WALL_GAUGE and IMPACT_RIG to inspect)"
    error_id: ERR_TECHNICIAN_NOT_CERTIFIED
    http_status: 403
    applies_to: "POST /resin-charges, POST /finished-units/{finished_unit_id}/outfit, POST /finished-units/{finished_unit_id}/inspect"
  - priority: 32
    category: state
    check: "the referenced OvenStation status is OPERATIONAL"
    error_id: ERR_OVEN_STATION_DOWN
    http_status: 409
    applies_to: "POST /molding-cycles, POST /molding-cycles/{molding_cycle_id}/start-oven"
  - priority: 33
    category: state
    check: "the referenced CoolingBay status is OPERATIONAL"
    error_id: ERR_COOLING_BAY_DOWN
    http_status: 409
    applies_to: "POST /molding-cycles, POST /molding-cycles/{molding_cycle_id}/start-oven"
  - priority: 34
    category: state
    check: "PAIR-1 member A — the ProductionOrder status is READY_TO_SCHEDULE or IN_PRODUCTION; DRAFT, BLOCKED_RESIN, BLOCKED_WAREHOUSE, COMPLETE and CANCELLED orders cannot take a new cycle"
    error_id: ERR_ORDER_NOT_SCHEDULABLE
    http_status: 409
    applies_to: "POST /molding-cycles"
  - priority: 35
    category: state
    check: "the MoldingCycle is in the status its transition requires (SCHEDULED to start the oven, OVEN_RUNNING to enter cooling, COOLING to demold, SCHEDULED or OVEN_RUNNING to abort)"
    error_id: ERR_CYCLE_INVALID_STATE
    http_status: 409
    applies_to: "POST /molding-cycles/{molding_cycle_id}/start-oven, .../enter-cooling, .../demold, .../abort"
  - priority: 36
    category: state
    check: "the ResinLot status is AVAILABLE"
    error_id: ERR_RESIN_LOT_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /resin-charges"
  - priority: 37
    category: state
    check: "the ResinCharge status is RESERVED"
    error_id: ERR_CHARGE_NOT_RELEASABLE
    http_status: 409
    applies_to: "POST /resin-charges/{resin_charge_id}/release"
  - priority: 38
    category: state
    check: "the FinishedUnit build_status permits the operation (DEMOLDED or REWORK to trim, TRIMMED to outfit, OUTFITTED or SELLABLE to inspect, SELLABLE to store or load)"
    error_id: ERR_UNIT_INVALID_BUILD_STATE
    http_status: 409
    applies_to: "POST /finished-units/{finished_unit_id}/trim, .../outfit, .../inspect, .../store, POST /shipment-lines"
  - priority: 39
    category: state
    check: "the FinishedUnit logistics_status is UNALLOCATED — a unit that has been stored, loaded, shipped or delivered can no longer be trimmed, outfitted, re-inspected or scrapped"
    error_id: ERR_UNIT_NOT_REINSPECTABLE
    http_status: 409
    applies_to: "POST /finished-units/{finished_unit_id}/trim, .../outfit, .../inspect, .../scrap"
  - priority: 40
    category: state
    check: "PAIR-3 member A — the target Warehouse posture is not FROZEN"
    error_id: ERR_WAREHOUSE_FROZEN
    http_status: 409
    applies_to: "POST /finished-units/{finished_unit_id}/store, POST /production-orders/{production_order_id}/release"
  - priority: 41
    category: state
    check: "the Shipment status permits the operation (PLANNED or LOADING to add a line, LOADING to seal, SEALED to unseal or depart, IN_TRANSIT to deliver, PLANNED/LOADING/SEALED to cancel)"
    error_id: ERR_SHIPMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /shipment-lines, POST /shipments/{shipment_id}/seal, .../unseal, .../depart, .../deliver, .../cancel"
  - priority: 42
    category: state
    check: "the ShipmentLine status is LOADED"
    error_id: ERR_SHIPMENT_LINE_ALREADY_REMOVED
    http_status: 409
    applies_to: "POST /shipment-lines/{shipment_line_id}/remove"
  - priority: 43
    category: state
    check: "the WarrantyClaim claim_status permits the operation (SUBMITTED to start review, UNDER_REVIEW to storage-review, approve, deny or return to queue, APPROVED to void, SUBMITTED or UNDER_REVIEW to withdraw)"
    error_id: ERR_CLAIM_INVALID_STATE
    http_status: 409
    applies_to: "POST /warranty-claims/{warranty_claim_id}/start-review, .../storage-review, .../approve, .../deny, .../void, .../withdraw, .../return-to-queue, .../waive-storage-finding"
  - priority: 44
    category: state
    check: "the Mold status is AVAILABLE to place a service hold, MAINTENANCE to complete service, AVAILABLE or MAINTENANCE to retire"
    error_id: ERR_MOLD_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /molds/{mold_id}/service-hold, .../complete-service, .../retire"
  - priority: 45
    category: state
    check: "a Mold being retired has no MoldingCycle in SCHEDULED, OVEN_RUNNING or COOLING"
    error_id: ERR_MOLD_HAS_ACTIVE_CYCLES
    http_status: 409
    applies_to: "POST /molds/{mold_id}/retire"
  - priority: 46
    category: state
    check: "the storage-review axis has not already been decided (storage_review_status == NOT_STARTED)"
    error_id: ERR_STORAGE_REVIEW_ALREADY_DONE
    http_status: 409
    applies_to: "POST /warranty-claims/{warranty_claim_id}/storage-review"
  - priority: 47
    category: state
    check: "the storage finding is waivable (storage_review_status == GUIDANCE_VIOLATED)"
    error_id: ERR_STORAGE_FINDING_NOT_WAIVABLE
    http_status: 409
    applies_to: "POST /warranty-claims/{warranty_claim_id}/waive-storage-finding"
  - priority: 48
    category: state
    check: "a sealed Shipment carries a freight quote before it may depart"
    error_id: ERR_FREIGHT_QUOTE_MISSING
    http_status: 409
    applies_to: "POST /shipments/{shipment_id}/depart"
  - priority: 49
    category: state
    check: "a Shipment being sealed holds at least one LOADED line"
    error_id: ERR_SHIPMENT_EMPTY
    http_status: 409
    applies_to: "POST /shipments/{shipment_id}/seal"

  # ------- PRODUCT SAFETY / PROCESS COMPLIANCE (50-59) — before money -------
  - priority: 50
    category: business_safety
    check: "the blended cycle regrind share does not exceed the ProductModel ceiling: cycle_regrind_pct > max_regrind_pct rejects, exactly max_regrind_pct is accepted"
    error_id: ERR_REGRIND_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /resin-charges, POST /molding-cycles/{molding_cycle_id}/start-oven"
  - priority: 51
    category: business_safety
    check: "the ResinLot matches the ProductModel on grade, additive package, colour (exact master_color_code or color_delta_e <= max_color_delta_e) and melt-index band (both bounds inclusive)"
    error_id: ERR_RESIN_LOT_NOT_QUALIFIED
    http_status: 422
    applies_to: "POST /resin-charges"
  - priority: 52
    category: business_safety
    check: "PAIR-2 member A — the candidate charge would not push the cycle over the regrind ceiling; evaluated on the post-add blend before any mass availability check"
    error_id: ERR_REGRIND_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /resin-charges"
  - priority: 53
    category: business_safety
    check: "the total charged mass is inside the ProductModel charge tolerance: nominal_charge_kg * (1 - charge_tolerance_pct/100) <= charged_mass_kg <= nominal_charge_kg * (1 + charge_tolerance_pct/100), both bounds inclusive on values rounded to 3 dp"
    error_id: ERR_CHARGE_MASS_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /molding-cycles/{molding_cycle_id}/start-oven"
  - priority: 54
    category: business_safety
    check: "the actual cooling time reaches ProductModel.min_cooling_minutes on floored whole minutes; exactly min_cooling_minutes passes"
    error_id: ERR_COOLING_TIME_INSUFFICIENT
    http_status: 422
    applies_to: "POST /molding-cycles/{molding_cycle_id}/demold"
  - priority: 55
    category: business_safety
    check: "PAIR-5 member A — the storage-guidance review is complete and permissive (storage_review_status IN {GUIDANCE_VERIFIED, WAIVED}) before a claim may be approved, and is at least decided (not NOT_STARTED) before a claim may be denied"
    error_id: ERR_STORAGE_REVIEW_INCOMPLETE
    http_status: 409
    applies_to: "POST /warranty-claims/{warranty_claim_id}/approve, POST /warranty-claims/{warranty_claim_id}/deny"
  - priority: 56
    category: business_safety
    check: "the customer acknowledged the storage guidance on or before the unit's delivered_at (equality passes)"
    error_id: ERR_STORAGE_GUIDANCE_NOT_ACKNOWLEDGED
    http_status: 422
    applies_to: "POST /warranty-claims/{warranty_claim_id}/storage-review"
  - priority: 57
    category: business_safety
    check: "segregation of duties — the inspecting Technician is neither the cycle's operator_technician_id nor the unit's outfitted_by_technician_id; and the outfitting Technician is not the unit's inspected_by_technician_id from a prior inspection"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /finished-units/{finished_unit_id}/inspect, POST /finished-units/{finished_unit_id}/outfit, POST /finished-units/{finished_unit_id}/scrap"
  - priority: 58
    category: business_safety
    check: "the requested cooling_mode equals the CoolingBay airflow_mode"
    error_id: ERR_COOLING_MODE_MISMATCH
    http_status: 422
    applies_to: "POST /molding-cycles"
  - priority: 59
    category: business_safety
    check: "the mold's size_class fits the station: SIZE_CLASS_ORDER[mold.size_class] <= SIZE_CLASS_ORDER[station.max_size_class]"
    error_id: ERR_SIZE_CLASS_NOT_SUPPORTED
    http_status: 422
    applies_to: "POST /molding-cycles"

  # ------- REFERENTIAL / CONSTRAINT / TEMPORAL (60-69) -------
  - priority: 60
    category: business_referential
    check: "PAIR-4 member A — the Customer on the claim has status ACTIVE"
    error_id: ERR_CUSTOMER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /warranty-claims, POST /warranty-claims/{warranty_claim_id}/start-review, POST /warranty-claims/{warranty_claim_id}/approve"
  - priority: 61
    category: business_referential
    check: "the claimed FinishedUnit is in logistics_status DELIVERED — a hull that never shipped has no warranty"
    error_id: ERR_UNIT_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /warranty-claims, POST /warranty-claims/{warranty_claim_id}/approve"
  - priority: 62
    category: business_temporal
    check: "PAIR-1 member B — no cycle in SCHEDULED or OVEN_RUNNING occupies the same (oven_station_id, arm_index) over the buffered half-open span; see calculations.oven_arm_window_check"
    error_id: ERR_OVEN_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /molding-cycles"
  - priority: 63
    category: business_temporal
    check: "the requested oven_start_at is at or after the logical clock (equality passes) — cycles may not be back-dated"
    error_id: ERR_OVEN_START_IN_PAST
    http_status: 422
    applies_to: "POST /molding-cycles"
  - priority: 64
    category: business_temporal
    check: "PAIR-5 member B — months_in_service <= WARRANTY_TERM_MONTHS (60); exactly 60 is inside the term"
    error_id: ERR_WARRANTY_TERM_EXPIRED
    http_status: 422
    applies_to: "POST /warranty-claims/{warranty_claim_id}/approve"
  - priority: 65
    category: business_constraint
    check: "the loaded unit's warehouse_id equals the Shipment origin_warehouse_id"
    error_id: ERR_WAREHOUSE_MISMATCH
    http_status: 422
    applies_to: "POST /shipment-lines"
  - priority: 66
    category: business_constraint
    check: "a Shipment may not be created at a RESTRICTED or FROZEN origin warehouse with trailer_cube_capacity_m3 greater than the site's remaining cube (footprint_capacity_cube_m3 - committed_cube_m3)"
    error_id: ERR_WAREHOUSE_POSTURE_RESTRICTED
    http_status: 409
    applies_to: "POST /shipments"
  - priority: 67
    category: business_constraint
    check: "a replaces_mold_id, when supplied, points to a different Mold of the same product_model_id whose status is RETIRED"
    error_id: ERR_INVALID_MOLD_REPLACEMENT
    http_status: 422
    applies_to: "POST /molds"
  - priority: 68
    category: business_constraint
    check: "the trailer utilisation reaches MIN_SEAL_UTILIZATION_PCT (60.00) before a shipment may be sealed; exactly 60.00 passes"
    error_id: ERR_TRAILER_UNDERUTILIZED
    http_status: 409
    applies_to: "POST /shipments/{shipment_id}/seal"
  - priority: 69
    category: business_constraint
    check: "PAIR-3 member B temporal half — the logical-clock date lies inside the DemandForecastBucket window [window_start_on, window_end_on], both bounds inclusive"
    error_id: ERR_BUILD_AHEAD_WINDOW_MISMATCH
    http_status: 409
    applies_to: "POST /finished-units/{finished_unit_id}/store"

  # ------- CAPACITY / QUOTA / MONEY (70-79) — last before OCC -------
  - priority: 70
    category: business_fiscal
    check: "an eligible Mold exists for the order's product model that is AVAILABLE, below its service interval and free over the cycle's half-open span; see calculations.mold_selection"
    error_id: ERR_NO_ELIGIBLE_MOLD
    http_status: 409
    applies_to: "POST /molding-cycles"
  - priority: 71
    category: business_fiscal
    check: "the CoolingBay has a free slot: the count of intersecting cycles is below concurrent_slot_capacity on the CLOSED window; see calculations.cooling_bay_slot_check"
    error_id: ERR_COOLING_BAY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /molding-cycles"
  - priority: 72
    category: business_fiscal
    check: "PAIR-2 member B — ResinLot.available_kg >= charge_kg (equality passes, draining the lot to exactly 0.000)"
    error_id: ERR_RESIN_INSUFFICIENT
    http_status: 409
    applies_to: "POST /resin-charges"
  - priority: 73
    category: business_fiscal
    check: "an eligible storage zone exists whose remaining cube covers the unit's footprint after nesting; see calculations.storage_zone_selection"
    error_id: ERR_NO_ELIGIBLE_ZONE
    http_status: 409
    applies_to: "POST /finished-units/{finished_unit_id}/store"
  - priority: 74
    category: business_fiscal
    check: "PAIR-3 member B — build_ahead_committed_qty + 1 <= build_ahead_cap_qty; the unit that lands exactly on the cap is accepted"
    error_id: ERR_BUILD_AHEAD_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /finished-units/{finished_unit_id}/store"
  - priority: 75
    category: business_fiscal
    check: "the site's total committed cube after the store does not exceed footprint_capacity_cube_m3 (<= , so filling to exactly capacity is accepted)"
    error_id: ERR_WAREHOUSE_CUBE_EXCEEDED
    http_status: 409
    applies_to: "POST /finished-units/{finished_unit_id}/store"
  - priority: 76
    category: business_fiscal
    check: "PAIR-4 member B — net_payout_cents <= ProductModel.warranty_reserve_cents; a payout that exactly drains the reserve is approved"
    error_id: ERR_WARRANTY_RESERVE_EXHAUSTED
    http_status: 409
    applies_to: "POST /warranty-claims/{warranty_claim_id}/approve"
  - priority: 77
    category: business_fiscal
    check: "the trailer cube holds the new line: round(nested_cube_m3 + line_nested_cube_m3, 4) <= trailer_cube_capacity_m3"
    error_id: ERR_TRAILER_CUBE_EXCEEDED
    http_status: 409
    applies_to: "POST /shipment-lines"
  - priority: 78
    category: business_fiscal
    check: "the trailer payload holds the new line: round(loaded_weight_kg + unit_weight_kg, 3) <= trailer_max_payload_kg"
    error_id: ERR_TRAILER_PAYLOAD_EXCEEDED
    http_status: 409
    applies_to: "POST /shipment-lines"
  - priority: 79
    category: business_fiscal
    check: "the number of scheduled plus completed units for an order does not exceed ordered_qty * MAX_OVERBUILD_FACTOR (1.20, floored to an integer)"
    error_id: ERR_ORDER_OVERBUILD
    http_status: 409
    applies_to: "POST /molding-cycles"

  # ------- OPTIMISTIC CONCURRENCY (80-89) — evaluated last -------
  - priority: 80
    category: state
    check: "expected_production_order_version equals ProductionOrder.version"
    error_id: ERR_STALE_PRODUCTION_ORDER_VERSION
    http_status: 412
    applies_to: "POST /molding-cycles"
  - priority: 81
    category: state
    check: "expected_resin_lot_version equals ResinLot.version"
    error_id: ERR_STALE_RESIN_LOT_VERSION
    http_status: 412
    applies_to: "POST /resin-charges"
  - priority: 82
    category: state
    check: "expected_warehouse_version equals Warehouse.version"
    error_id: ERR_STALE_WAREHOUSE_VERSION
    http_status: 412
    applies_to: "POST /finished-units/{finished_unit_id}/store"
  - priority: 83
    category: state
    check: "expected_shipment_version equals Shipment.version"
    error_id: ERR_STALE_SHIPMENT_VERSION
    http_status: 412
    applies_to: "POST /shipment-lines"
  - priority: 84
    category: state
    check: "expected_product_model_version equals ProductModel.version"
    error_id: ERR_STALE_PRODUCT_MODEL_VERSION
    http_status: 412
    applies_to: "POST /warranty-claims/{warranty_claim_id}/approve"

# =============================================================================
# §1.5 API ENDPOINTS
#
# Flat topology: every entity is a root collection and relationships are
# expressed as foreign keys in bodies plus optional filters on the list
# endpoints. Every entity has BOTH a scalar `GET /<collection>/{id}` and a
# filtered `GET /<collection>` carrying each of its FK fields as an optional
# query input, so every FK declared in §1.1 is reverse-reachable — including
# FinishedUnit, which has no POST at all because units are minted by the
# demold cascade.
#
# All list endpoints accept limit? and offset? and return the pagination
# fields declared in response_envelope. All mutating endpoints return the
# mutated root entity so a test can read back every server-minted value
# (selected mold_id, hull_serial, computed cubes, postures, payouts) without a
# second call.
# =============================================================================
endpoints:
  # ------------------------------- ProductModel -------------------------------
  - method: POST
    path: "/product-models"
    description: "Register a rotomoulded hull model with its resin, colour, regrind, cure, quality, freight and warranty parameters."
    roles: [PlantAdmin]
    code: 201
    input: [model_code, hull_type, size_class, resin_grade, master_color_code, max_color_delta_e, required_additive_package_code, max_regrind_pct, min_melt_index_g10min, max_melt_index_g10min, nominal_charge_kg, charge_tolerance_pct, min_cooling_minutes, target_wall_thickness_mm, wall_thickness_min_mm, wall_cv_max_pct, impact_test_min_joules, gross_cube_m3, nest_factor, unit_weight_kg, msrp_cents, warranty_basis, initial_warranty_reserve_cents, seasonal_family]
    output: ProductModel
    side_effects: ["warranty_reserve_cents initialised to initial_warranty_reserve_cents and warranty_paid_cents to 0, establishing the conserved warranty-money invariant", "version initialised to 1"]
  - method: GET
    path: "/product-models"
    description: "List hull models, optionally filtered."
    roles: [PlantAdmin, ResinTechnician, MoldingOperator, AssemblyTechnician, QualityInspector, LogisticsPlanner, WarrantyAgent]
    code: 200
    input: ["hull_type?", "size_class?", "resin_grade?", "warranty_basis?", "seasonal_family?", "limit?", "offset?"]
    output: ProductModel[]
    side_effects: []
  - method: GET
    path: "/product-models/{product_model_id}"
    description: "Read one hull model including its live warranty_reserve_cents and warranty_paid_cents."
    roles: [PlantAdmin, ResinTechnician, MoldingOperator, AssemblyTechnician, QualityInspector, LogisticsPlanner, WarrantyAgent]
    code: 200
    input: []
    output: ProductModel
    side_effects: []
  - method: PATCH
    path: "/product-models/{product_model_id}"
    description: "Adjust a model's process and quality limits. Structural fields (model_code, hull_type, size_class, warranty_basis, initial_warranty_reserve_cents) are immutable."
    roles: [PlantAdmin]
    code: 200
    input: ["max_color_delta_e?", "max_regrind_pct?", "min_melt_index_g10min?", "max_melt_index_g10min?", "nominal_charge_kg?", "charge_tolerance_pct?", "min_cooling_minutes?", "target_wall_thickness_mm?", "wall_thickness_min_mm?", "wall_cv_max_pct?", "impact_test_min_joules?", "gross_cube_m3?", "nest_factor?", "unit_weight_kg?", "msrp_cents?"]
    output: ProductModel
    side_effects: ["previously stored measurements are NOT re-judged; the new limits apply to subsequent inspections only", "increments ProductModel.version by 1"]

  # ----------------------------------- Mold -----------------------------------
  - method: POST
    path: "/molds"
    description: "Register a mould tool for one hull model, optionally recording the retired tool it replaces."
    roles: [PlantAdmin]
    code: 201
    input: ["mold_code", "product_model_id", "size_class", "cavity_count", "nominal_charge_kg", "service_interval_cycles", "replaces_mold_id?"]
    output: Mold
    side_effects: ["cycles_since_service initialised to 0 and status to AVAILABLE", "version initialised to 1"]
  - method: GET
    path: "/molds"
    description: "List mould tools, filterable by owning model, by the tool they replace, and by status."
    roles: [PlantAdmin, MoldingOperator, QualityInspector, LogisticsPlanner]
    code: 200
    input: ["product_model_id?", "replaces_mold_id?", "status?", "size_class?", "limit?", "offset?"]
    output: Mold[]
    side_effects: []
  - method: GET
    path: "/molds/{mold_id}"
    description: "Read one mould tool including its live cycles_since_service counter."
    roles: [PlantAdmin, MoldingOperator, QualityInspector, LogisticsPlanner]
    code: 200
    input: []
    output: Mold
    side_effects: []
  - method: POST
    path: "/molds/{mold_id}/service-hold"
    description: "Take a mould out of service for maintenance ahead of its interval."
    roles: [PlantAdmin]
    code: 200
    input: ["hold_note?"]
    output: Mold
    side_effects: ["status AVAILABLE -> MAINTENANCE", "every MoldingCycle on this mould in SCHEDULED -> ABORTED with abort_reason MOLD_SERVICE_DUE", "their RESERVED ResinCharge rows -> RELEASED with released_reason MOLD_SERVICE_DUE, returning mass to ResinLot.available_kg", "DEPLETED lots that regain mass -> AVAILABLE and BLOCKED_RESIN orders they qualify for are unblocked", "increments Mold.version by 1"]
  - method: POST
    path: "/molds/{mold_id}/complete-service"
    description: "Return a serviced mould to production and reset its cycle counter to zero."
    roles: [PlantAdmin]
    code: 200
    input: ["service_note?"]
    output: Mold
    side_effects: ["cycles_since_service reset to 0 (full reset, not a decrement)", "status MAINTENANCE -> AVAILABLE, restoring the mould to the calculations.mold_selection pool", "increments Mold.version by 1"]
  - method: POST
    path: "/molds/{mold_id}/retire"
    description: "Permanently retire a mould tool."
    roles: [PlantAdmin]
    code: 200
    input: [retire_reason]
    output: Mold
    side_effects: ["status -> RETIRED (terminal); the tool becomes a legal replaces_mold_id target", "increments Mold.version by 1"]

  # -------------------------------- OvenStation --------------------------------
  - method: POST
    path: "/oven-stations"
    description: "Register a rotational oven station with its arm count, size ceiling, changeover buffer and energy rate."
    roles: [PlantAdmin]
    code: 201
    input: [station_code, arm_count, max_size_class, changeover_buffer_min, energy_cents_per_min]
    output: OvenStation
    side_effects: ["status initialised to OPERATIONAL", "version initialised to 1"]
  - method: GET
    path: "/oven-stations"
    description: "List oven stations."
    roles: [PlantAdmin, MoldingOperator, QualityInspector, LogisticsPlanner]
    code: 200
    input: ["status?", "max_size_class?", "limit?", "offset?"]
    output: OvenStation[]
    side_effects: []
  - method: GET
    path: "/oven-stations/{oven_station_id}"
    description: "Read one oven station."
    roles: [PlantAdmin, MoldingOperator, QualityInspector, LogisticsPlanner]
    code: 200
    input: []
    output: OvenStation
    side_effects: []
  - method: POST
    path: "/oven-stations/{oven_station_id}/mark-down"
    description: "Take an oven station out of service. Head of CASCADE-E."
    roles: [PlantAdmin]
    code: 200
    input: [down_reason]
    output: OvenStation
    side_effects: ["status OPERATIONAL -> DOWN", "CASCADE-E link 2: SCHEDULED cycles on this station -> ABORTED with abort_reason STATION_DOWN", "CASCADE-E link 3: their RESERVED charges -> RELEASED with released_reason STATION_DOWN", "CASCADE-E link 4: DEPLETED lots that regain mass -> AVAILABLE", "CASCADE-E link 5: BLOCKED_RESIN orders those lots qualify for -> READY_TO_SCHEDULE, or BLOCKED_WAREHOUSE when the target site is FROZEN", "cycles already OVEN_RUNNING or COOLING are untouched", "increments OvenStation.version by 1"]
  - method: POST
    path: "/oven-stations/{oven_station_id}/restore"
    description: "Return an oven station to service. Aborted cycles are not resurrected."
    roles: [PlantAdmin]
    code: 200
    input: []
    output: OvenStation
    side_effects: ["status DOWN -> OPERATIONAL", "increments OvenStation.version by 1"]

  # --------------------------------- CoolingBay ---------------------------------
  - method: POST
    path: "/cooling-bays"
    description: "Register a cooling bay with its concurrent slot capacity and airflow mode."
    roles: [PlantAdmin]
    code: 201
    input: [bay_code, concurrent_slot_capacity, airflow_mode]
    output: CoolingBay
    side_effects: ["status initialised to OPERATIONAL", "version initialised to 1"]
  - method: GET
    path: "/cooling-bays"
    description: "List cooling bays."
    roles: [PlantAdmin, MoldingOperator, QualityInspector, LogisticsPlanner]
    code: 200
    input: ["status?", "airflow_mode?", "limit?", "offset?"]
    output: CoolingBay[]
    side_effects: []
  - method: GET
    path: "/cooling-bays/{cooling_bay_id}"
    description: "Read one cooling bay."
    roles: [PlantAdmin, MoldingOperator, QualityInspector, LogisticsPlanner]
    code: 200
    input: []
    output: CoolingBay
    side_effects: []
  - method: POST
    path: "/cooling-bays/{cooling_bay_id}/mark-down"
    description: "Take a cooling bay out of service."
    roles: [PlantAdmin]
    code: 200
    input: [down_reason]
    output: CoolingBay
    side_effects: ["status OPERATIONAL -> DOWN", "SCHEDULED cycles on this bay -> ABORTED with abort_reason BAY_DOWN, releasing their RESERVED charges and unblocking resin-blocked orders", "cycles already OVEN_RUNNING or COOLING are untouched", "increments CoolingBay.version by 1"]
  - method: POST
    path: "/cooling-bays/{cooling_bay_id}/restore"
    description: "Return a cooling bay to service."
    roles: [PlantAdmin]
    code: 200
    input: []
    output: CoolingBay
    side_effects: ["status DOWN -> OPERATIONAL", "increments CoolingBay.version by 1"]

  # --------------------------------- Technician ---------------------------------
  - method: POST
    path: "/technicians"
    description: "Register a shop-floor technician with a role code and certification set. The created id is the X-User-ID for that technician's role."
    roles: [PlantAdmin]
    code: 201
    input: [employee_code, full_name, role_code, certifications]
    output: Technician
    side_effects: ["status initialised to ACTIVE", "version initialised to 1"]
  - method: GET
    path: "/technicians"
    description: "List technicians."
    roles: [PlantAdmin, MoldingOperator, AssemblyTechnician, QualityInspector, LogisticsPlanner]
    code: 200
    input: ["role_code?", "status?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []
  - method: GET
    path: "/technicians/{technician_id}"
    description: "Read one technician including the certification array the safety checks read."
    roles: [PlantAdmin, MoldingOperator, AssemblyTechnician, QualityInspector, LogisticsPlanner]
    code: 200
    input: []
    output: Technician
    side_effects: []
  - method: POST
    path: "/technicians/{technician_id}/suspend"
    description: "Suspend a technician. No existing cycle or unit is mutated; only future actions are blocked."
    roles: [PlantAdmin]
    code: 200
    input: [suspend_reason]
    output: Technician
    side_effects: ["status ACTIVE -> SUSPENDED, so §1.4 priority 30 rejects that technician's next action", "increments Technician.version by 1"]
  - method: POST
    path: "/technicians/{technician_id}/reinstate"
    description: "Reinstate a suspended technician."
    roles: [PlantAdmin]
    code: 200
    input: []
    output: Technician
    side_effects: ["status SUSPENDED -> ACTIVE", "increments Technician.version by 1"]

  # ---------------------------------- Customer ----------------------------------
  - method: POST
    path: "/customers"
    description: "Register a customer. The created id is the X-User-ID used by the Customer role."
    roles: [PlantAdmin, LogisticsPlanner]
    code: 201
    input: [customer_code, email, region_code]
    output: Customer
    side_effects: ["status initialised to ACTIVE and storage_guidance_acknowledged_at to null", "version initialised to 1"]
  - method: GET
    path: "/customers"
    description: "List customers."
    roles: [PlantAdmin, LogisticsPlanner, WarrantyAgent]
    code: 200
    input: ["region_code?", "status?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []
  - method: GET
    path: "/customers/{customer_id}"
    description: "Read one customer including storage_guidance_acknowledged_at, which gates the warranty storage review."
    roles: [PlantAdmin, LogisticsPlanner, WarrantyAgent, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/customers/{customer_id}/acknowledge-storage-guidance"
    description: "Record the customer's acknowledgement of hull storage guidance at an explicit timestamp, which must be at or before a claimed unit's delivered_at for the storage review to verify."
    roles: [PlantAdmin, LogisticsPlanner, Customer]
    code: 200
    input: [acknowledged_at]
    output: Customer
    side_effects: ["storage_guidance_acknowledged_at set to the supplied timestamp", "increments Customer.version by 1"]
  - method: POST
    path: "/customers/{customer_id}/suspend"
    description: "Suspend a customer, voiding its open warranty claims."
    roles: [PlantAdmin]
    code: 200
    input: [suspend_reason]
    output: Customer
    side_effects: ["status ACTIVE -> SUSPENDED", "every WarrantyClaim of this customer in SUBMITTED or UNDER_REVIEW -> VOIDED with denial_reason APPROVAL_VOIDED; no reserve moves because no payout was booked", "increments Customer.version by 1"]
  - method: POST
    path: "/customers/{customer_id}/reinstate"
    description: "Reinstate a suspended customer. Voided claims are not resurrected."
    roles: [PlantAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status SUSPENDED -> ACTIVE", "increments Customer.version by 1"]

  # ---------------------------------- Warehouse ----------------------------------
  - method: POST
    path: "/warehouses"
    description: "Register a finished-goods site with a zone array and its restricted / frozen utilisation thresholds."
    roles: [PlantAdmin, LogisticsPlanner]
    code: 201
    input: ["site_code", "footprint_capacity_cube_m3", "zones", "restricted_threshold_pct?", "frozen_threshold_pct?"]
    output: Warehouse
    side_effects: ["committed_cube_m3 initialised to 0.0000, utilization_pct to 0.00 and posture to NORMAL", "thresholds default to 85.00 and 95.00 when omitted", "version initialised to 1"]
  - method: GET
    path: "/warehouses"
    description: "List sites with their live utilisation and posture."
    roles: [PlantAdmin, LogisticsPlanner, QualityInspector]
    code: 200
    input: ["posture?", "limit?", "offset?"]
    output: Warehouse[]
    side_effects: []
  - method: GET
    path: "/warehouses/{warehouse_id}"
    description: "Read one site including committed_cube_m3, utilization_pct and posture."
    roles: [PlantAdmin, LogisticsPlanner, QualityInspector]
    code: 200
    input: []
    output: Warehouse
    side_effects: []
  - method: GET
    path: "/warehouses/{warehouse_id}/footprint-summary"
    description: "Computed read: per-zone committed cube, remaining cube, anchor counts per product model, and the site's posture, so a test can observe the nesting arithmetic without recomputing it."
    roles: [PlantAdmin, LogisticsPlanner]
    code: 200
    input: []
    # projection shape: WarehouseFootprintSummary
    output:
      warehouse_id: "string — the site"
      footprint_capacity_cube_m3: "number(4) — configured capacity"
      committed_cube_m3: "number(4) — sum of stored_footprint_cube_m3 over STORED and LOADED units"
      remaining_cube_m3: "number(4) — capacity minus committed"
      utilization_pct: "number(2) — committed / capacity * 100"
      posture: "enum NORMAL | RESTRICTED | FROZEN"
      zones: "array of { zone_code, capacity_cube_m3, committed_cube_m3, remaining_cube_m3, anchor_product_model_ids[], stored_unit_count }"
      blocked_production_order_count: "integer — orders in BLOCKED_WAREHOUSE targeting this site"
    side_effects: []
    output_schema:
      warehouse_id: "string — the site"
      footprint_capacity_cube_m3: "number(4) — configured capacity"
      committed_cube_m3: "number(4) — sum of stored_footprint_cube_m3 over STORED and LOADED units"
      remaining_cube_m3: "number(4) — capacity minus committed"
      utilization_pct: "number(2) — committed / capacity * 100"
      posture: "enum NORMAL | RESTRICTED | FROZEN"
      zones: "array of { zone_code, capacity_cube_m3, committed_cube_m3, remaining_cube_m3, anchor_product_model_ids[], stored_unit_count }"
      blocked_production_order_count: "integer — orders in BLOCKED_WAREHOUSE targeting this site"

  # --------------------------- DemandForecastBucket ---------------------------
  - method: POST
    path: "/demand-forecast-buckets"
    description: "Declare a seasonal demand bucket for one hull model with its build-ahead cap percentage and inclusive date window."
    roles: [PlantAdmin, LogisticsPlanner]
    code: 201
    input: ["season_code", "product_model_id", "forecast_qty", "build_ahead_cap_pct?", "window_start_on", "window_end_on"]
    output: DemandForecastBucket
    side_effects: ["build_ahead_cap_qty computed as floor(forecast_qty * build_ahead_cap_pct / 100); build_ahead_committed_qty initialised to 0", "build_ahead_cap_pct defaults to 60.00 when omitted", "version initialised to 1"]
  - method: GET
    path: "/demand-forecast-buckets"
    description: "List demand buckets, filterable by hull model and season."
    roles: [PlantAdmin, LogisticsPlanner, MoldingOperator]
    code: 200
    input: ["product_model_id?", "season_code?", "limit?", "offset?"]
    output: DemandForecastBucket[]
    side_effects: []
  - method: GET
    path: "/demand-forecast-buckets/{demand_forecast_bucket_id}"
    description: "Read one demand bucket including build_ahead_cap_qty and the live build_ahead_committed_qty."
    roles: [PlantAdmin, LogisticsPlanner, MoldingOperator]
