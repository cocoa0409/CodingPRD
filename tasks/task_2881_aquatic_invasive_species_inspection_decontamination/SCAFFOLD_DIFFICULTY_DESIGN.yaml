            - "InspectionRecord.${rec1_id}.risk_score == 20 and risk_band == LOW, likewise untouched"

      - name: second_rejected_release_cascades_through_referral_to_mandatory_decon_flag
        grounds:
          - state_machines.QuarantineOrder.RELEASE_REQUESTED_to_SEALED
          - state_machines.InspectionRecord.NONE_to_REFERRED
          - entities.Watercraft.fields.compliance_strikes
          - entities.Watercraft.fields.watchlist_status
          - entities.Watercraft.fields.mandatory_decon_flag
          - calculations.quarantine_hold_hours
        distinguishing_aspect: |
          The chain crosses THREE entities and only fires on the second rejection:
          hop 1 QuarantineOrder RELEASE_REQUESTED -> SEALED with
          rejected_release_count 1 -> 2, hop 2 the parent InspectionRecord's
          enforcement dimension NONE -> REFERRED with the system reason
          QUARANTINE_RELEASE_FAILURE because the count reached
          REJECTED_RELEASE_REFERRAL_THRESHOLD, hop 3 Watercraft.compliance_strikes
          1 -> 2, hop 4 watchlist_status CLEAR -> WATCHLISTED at
          WATCHLIST_STRIKE_THRESHOLD, hop 5 mandatory_decon_flag false -> true
          because of the watchlist flip. The strike-1 preload from an earlier
          REFUSED record is what makes hops 4 and 5 reachable, so the same
          rejection on a clean vessel would stop at hop 3 - an implementation
          that hard-codes WATCHLISTED on any referral fails the control.
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z and is advanced explicitly."
            - "WaterBody 'Tiber Reservoir' risk_tier HIGH, infestation_status SUSPECT; station 'Tiber Access' OPEN with seal_stock_initial_count 3."
