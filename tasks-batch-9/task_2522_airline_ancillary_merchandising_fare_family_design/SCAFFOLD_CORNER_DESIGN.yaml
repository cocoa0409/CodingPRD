              as_user_id: "ma-001"
              captures: { p_seat_std_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_BARE", name: "Economy Bare", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 12000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
