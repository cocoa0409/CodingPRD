# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Auto Repossession & Collateral Liquidation — 9 rules x 2 instances.
# All numeric literals pre-computed from §1.3 formulas with:
#   principal 2,000,000c; apr 1200bps; per_diem = rhu(2000000*0.12/365) = 658
#   missed 3 x 45,000; late 12,000; accrued 60,000; costs 35,000 + 4,500 = 39,500
#   case created 2026-05-01 (clock default); cure deadline 05-15; secured 05-16;
#   quote issued 05-16 -> valid_until 05-26 (25 interest-days from 05-01)
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: deficiency_provisional_vs_final_diverge
        grounds:
          - calculations.deficiency_balance
          - entities.DeficiencyNotice.fields.deficiency_amount_cents
        distinguishing_aspect: |
          Same RecoveryCase, same ledger: the PROVISIONAL variant (estimate endpoint,
          proceeds = grade-adjusted appraisal x 0.9, as_of = today) yields 1,114,792c
          while the FINAL variant (proceeds = certified net 1,125,000c, as_of = sold_at)
          yields 1,009,530c — different numbers from identical ledger data, on the
          RecoveryCase/loan domain.
        test_recipe:
          setup:
            - "Case progressed OPENED->CURE_PENDING->CURE_EXPIRED->REPO_ACTIVE->COLLATERAL_SECURED->REDEMPTION_OPEN with costs 39,500c posted before the cure notice; clock 2026-05-25 when the estimate is read"
            - "Then case driven REDEMPTION_OPEN->CONSIGNMENT_PENDING->IN_AUCTION->SALE_CONFIRMED with certified gross 1,200,000c; sold_at 2026-06-05"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Dana Voss", state_code: "CA", email: "dana@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "1HGCM82633A004352", governing_state_code: "CA", principal_balance_cents: 2000000, apr_bps: 1200, monthly_payment_cents: 45000, missed_installments: 3, accrued_interest_cents: 60000, late_fees_cents: 12000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "90 days delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "COST_REPO_FEE", amount_cents: 35000 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "COST_STORAGE", amount_cents: 4500 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/cure-notices", payload: { expected_recovery_case_version: "${c_v}" }, as: RecoveryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /repo-agents", payload: { name: "Swift Recovery", license_number: "LIC-1", licensed_state_codes: ["CA"], max_active_assignments: 5 }, as: RecoveryManager, captures: { ag_id: $.data.id } }
            - { call: "POST /recovery-cases/${c_id}/repo-assignments", payload: { agent_id: "${ag_id}", field_window_start: "2026-05-16T00:00:00Z", field_window_end: "2026-05-18T00:00:00Z" }, as: RecoveryManager, captures: { asg_id: $.data.id } }
            - { call: "POST /repo-assignments/${asg_id}/accept", payload: {}, as: RepoAgent, as_user_id: "${ag_id}" }
            - { call: "POST /repo-assignments/${asg_id}/report-secured", payload: { odometer: 65000, condition_grade: "GOOD", trade_in_value_cents: 1500000, auction_guide_low_cents: 900000 }, as: RepoAgent, as_user_id: "${ag_id}" }
            - { call: "GET /recovery-cases/${c_id}", payload: {}, as: RecoveryManager, captures: { c_v2: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/redemption-quotes", payload: { quote_type: "REDEMPTION", expected_recovery_case_version: "${c_v2}" }, as: RecoveryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-25T00:00:00Z" }, as: RecoveryManager }
          trigger:
            - { call: "GET /recovery-cases/${c_id}/deficiency-estimate", payload: {}, as: RecoveryManager, captures: { est_def: $.data.estimated_deficiency_cents } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-27T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /auction-houses", payload: { name: "West Auction", fee_bps: 500, transport_fee_cents: 15000 }, as: RecoveryManager, captures: { ah_id: $.data.id } }
            - { call: "POST /recovery-cases/${c_id}/consignments", payload: { auction_house_id: "${ah_id}" }, as: RecoveryManager, captures: { cons_id: $.data.id } }
            - { call: "POST /consignments/${cons_id}/list", payload: { listing_start: "2026-05-28T00:00:00Z", listing_end: "2026-05-30T00:00:00Z" }, as: Auctioneer, as_user_id: "${ah_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /consignments/${cons_id}/report-sale", payload: { gross_sale_cents: 1200000 }, as: Auctioneer, as_user_id: "${ah_id}", captures: { sale_id: $.data.id } }
            - { call: "POST /sale-records/${sale_id}/certify", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /recovery-cases/${c_id}/deficiency-notices", payload: {}, as: RecoveryManager, captures: { dn_amt: $.data.deficiency_amount_cents } }
          assert:
            - "est_def == 1114792  (PROVISIONAL: payoff 2087792 = 2072000 + 658*24; + costs 39500; - proceeds rhu(0.9 * 1125000 grade-adjusted) = 1012500)"
            - "dn_amt == 1009530  (FINAL: payoff 2095030 = 2072000 + 658*35; + costs 39500 = 2134530 owed; - certified net 1125000)"
            - "est_def != dn_amt"
      - name: agent_score_rolling_vs_lifetime_diverge
        grounds:
          - calculations.agent_performance_score
          - entities.RepoAgent.fields.performance_score_rolling
          - entities.RepoAgent.fields.performance_score_lifetime
        distinguishing_aspect: |
          Same assignment event history on the RepoAgent domain: LIFETIME counts one
          BREACHED_PEACE and one EXPIRED (100-25-10 = 65) while ROLLING_90D excludes
          both because they are >90 days old (empty window = 100) — two window variants,
          two different scores, and the suspension posture (driven by rolling) differs
          from what lifetime would imply.
        test_recipe:
          setup:
            - "Agent with two old terminal events: assignment A1 BREACHED_PEACE at 2026-05-16; assignment A2 created 2026-05-31 left ASSIGNED and auto-EXPIRED by clock advance past created+2d"
            - "Logical clock finally at 2026-09-01, so both events are >90 days old"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "B One", state_code: "CA", email: "b1@x.com" }, as: RecoveryManager, captures: { b1: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b1}", vin: "VIN00000000000001", governing_state_code: "CA", principal_balance_cents: 500000, apr_bps: 900, monthly_payment_cents: 20000, missed_installments: 2, accrued_interest_cents: 8000, late_fees_cents: 3000 }, as: RecoveryManager, captures: { l1: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l1}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c1: $.data.id, c1_v: $.data.version } }
            - { call: "POST /recovery-cases/${c1}/cure-notices", payload: { expected_recovery_case_version: "${c1_v}" }, as: RecoveryManager }
            - { call: "POST /repo-agents", payload: { name: "Old History Agent", license_number: "LIC-9", licensed_state_codes: ["CA"], max_active_assignments: 10 }, as: RecoveryManager, captures: { ag: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c1}/repo-assignments", payload: { agent_id: "${ag}", field_window_start: "2026-05-16T00:00:00Z", field_window_end: "2026-05-17T00:00:00Z" }, as: RecoveryManager, captures: { a1: $.data.id } }
            - { call: "POST /repo-assignments/${a1}/report-breach", payload: {}, as: ComplianceOfficer, as_user_id: "co_1" }
            - { call: "POST /borrowers", payload: { full_name: "B Two", state_code: "CA", email: "b2@x.com" }, as: RecoveryManager, captures: { b2: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b2}", vin: "VIN00000000000002", governing_state_code: "CA", principal_balance_cents: 500000, apr_bps: 900, monthly_payment_cents: 20000, missed_installments: 2, accrued_interest_cents: 8000, late_fees_cents: 3000 }, as: RecoveryManager, captures: { l2: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l2}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c2: $.data.id, c2_v: $.data.version } }
            - { call: "POST /recovery-cases/${c2}/cure-notices", payload: { expected_recovery_case_version: "${c2_v}" }, as: RecoveryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c2}/repo-assignments", payload: { agent_id: "${ag}", field_window_start: "2026-05-31T00:00:00Z", field_window_end: "2026-06-01T00:00:00Z" }, as: RecoveryManager, captures: { a2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T00:00:00Z" }, as: RecoveryManager }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: RecoveryManager }
            - { call: "GET /repo-agents/${ag}", payload: {}, as: ComplianceOfficer, captures: { life: $.data.performance_score_lifetime, roll: $.data.performance_score_rolling, ag_status: $.data.status } }
          assert:
            - "life == 65   (100 - 25 breach - 10 expired, all history)"
            - "roll == 100  (both events older than 90 days -> empty ROLLING_90D window)"
            - "ag_status == ACTIVE  (suspension is driven by the rolling variant only)"

  - rule_id: combinatorial_formula
    instances:
      - name: reserve_price_nested_min_max_grade_branch
        grounds:
          - calculations.reserve_price
        distinguishing_aspect: |
          Mode (a): reserve = min(grade_adjusted, max(auction_guide_low, floor(0.5 x payoff)))
          with a 4-tier grade multiplier — case A (trade-in 1,500,000c GOOD -> grade branch
          1,125,000c; guide 900,000c; floor 1,055,750c) lands on the FLOOR at 1,055,750c,
          while case B (trade-in 1,000,000c GOOD -> grade branch 750,000c) lands on the
          GRADE branch at 750,000c; each branch of the nested min/max is load-bearing.
        test_recipe:
          setup:
            - "Two independent cases both in CONSIGNMENT_PENDING at 2026-05-27 with identical loans (outstanding 2,072,000c, costs 39,500c -> payoff_estimate 2,111,500c, floor 1,055,750c) but different appraisals"
            - "Case A secured with trade_in 1,500,000c / guide 900,000c; case B secured with trade_in 1,000,000c / guide 900,000c"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "RA", state_code: "CA", email: "ra@x.com" }, as: RecoveryManager, captures: { ba: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${ba}", vin: "VIN0000000000000A", governing_state_code: "CA", principal_balance_cents: 2000000, apr_bps: 1200, monthly_payment_cents: 45000, missed_installments: 3, accrued_interest_cents: 60000, late_fees_cents: 12000 }, as: RecoveryManager, captures: { la: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${la}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { ca: $.data.id, ca_v: $.data.version } }
            - { call: "POST /recovery-cases/${ca}/ledger-entries", payload: { kind: "COST_REPO_FEE", amount_cents: 35000 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${ca}/ledger-entries", payload: { kind: "COST_STORAGE", amount_cents: 4500 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${ca}/cure-notices", payload: { expected_recovery_case_version: "${ca_v}" }, as: RecoveryManager }
            - { call: "POST /repo-agents", payload: { name: "Agent X", license_number: "LIC-X", licensed_state_codes: ["CA"], max_active_assignments: 10 }, as: RecoveryManager, captures: { agx: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${ca}/repo-assignments", payload: { agent_id: "${agx}", field_window_start: "2026-05-16T00:00:00Z", field_window_end: "2026-05-17T00:00:00Z" }, as: RecoveryManager, captures: { asga: $.data.id } }
            - { call: "POST /repo-assignments/${asga}/accept", payload: {}, as: RepoAgent, as_user_id: "${agx}" }
            - { call: "POST /repo-assignments/${asga}/report-secured", payload: { odometer: 65000, condition_grade: "GOOD", trade_in_value_cents: 1500000, auction_guide_low_cents: 900000 }, as: RepoAgent, as_user_id: "${agx}" }
            - { call: "GET /recovery-cases/${ca}", payload: {}, as: RecoveryManager, captures: { ca_v2: $.data.version } }
            - { call: "POST /recovery-cases/${ca}/redemption-quotes", payload: { quote_type: "REDEMPTION", expected_recovery_case_version: "${ca_v2}" }, as: RecoveryManager }
            - { call: "POST /borrowers", payload: { full_name: "RB", state_code: "CA", email: "rb@x.com" }, as: RecoveryManager, captures: { bb: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${bb}", vin: "VIN0000000000000B", governing_state_code: "CA", principal_balance_cents: 2000000, apr_bps: 1200, monthly_payment_cents: 45000, missed_installments: 3, accrued_interest_cents: 60000, late_fees_cents: 12000 }, as: RecoveryManager, captures: { lb: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${lb}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { cb: $.data.id, cb_v: $.data.version } }
            - { call: "POST /recovery-cases/${cb}/ledger-entries", payload: { kind: "COST_REPO_FEE", amount_cents: 35000 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${cb}/ledger-entries", payload: { kind: "COST_STORAGE", amount_cents: 4500 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${cb}/cure-notices", payload: { expected_recovery_case_version: "${cb_v}" }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${cb}/repo-assignments", payload: { agent_id: "${agx}", field_window_start: "2026-05-17T00:00:00Z", field_window_end: "2026-05-18T00:00:00Z" }, as: RecoveryManager, captures: { asgb: $.data.id } }
            - { call: "POST /repo-assignments/${asgb}/accept", payload: {}, as: RepoAgent, as_user_id: "${agx}" }
            - { call: "POST /repo-assignments/${asgb}/report-secured", payload: { odometer: 71000, condition_grade: "GOOD", trade_in_value_cents: 1000000, auction_guide_low_cents: 900000 }, as: RepoAgent, as_user_id: "${agx}" }
            - { call: "GET /recovery-cases/${cb}", payload: {}, as: RecoveryManager, captures: { cb_v2: $.data.version } }
            - { call: "POST /recovery-cases/${cb}/redemption-quotes", payload: { quote_type: "REDEMPTION", expected_recovery_case_version: "${cb_v2}" }, as: RecoveryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-27T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /auction-houses", payload: { name: "AH", fee_bps: 500, transport_fee_cents: 15000 }, as: RecoveryManager, captures: { ah: $.data.id } }
          trigger:
            - { call: "POST /recovery-cases/${ca}/consignments", payload: { auction_house_id: "${ah}" }, as: RecoveryManager, captures: { res_a: $.data.reserve_price_cents } }
            - { call: "POST /recovery-cases/${cb}/consignments", payload: { auction_house_id: "${ah}" }, as: RecoveryManager, captures: { res_b: $.data.reserve_price_cents } }
          assert:
            - "res_a == 1055750  (floor branch wins: min(1125000, max(900000, 1055750)))"
            - "res_b == 750000   (grade branch wins: min(750000, max(900000, 1055750)))"
            - "res_a != res_b although both loans and costs are identical"
      - name: per_diem_rounding_order_pinned
        grounds:
          - calculations.redemption_quote_amount
          - entities.RedemptionQuote.fields.per_diem_cents
        distinguishing_aspect: |
          Mode (b): the scaffold pins round-per-diem-FIRST (rhu(2,000,000 x 0.12 / 365) =
          658c, then 658 x 25 days = 16,450c); computing single-shot
          (rhu(2,000,000 x 0.12 x 25 / 365) = 16,438c) is non-conformant — the two orders
          differ by 12c on identical inputs, so quoted_amount_cents == 2,127,950c exactly.
        test_recipe:
          setup:
            - "Case OPENED 2026-05-01 (clock default), costs 39,500c, notice sent 05-01, clock 05-16, assignment accepted and secured 05-16; case COLLATERAL_SECURED"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "PD", state_code: "CA", email: "pd@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN0000000000000C", governing_state_code: "CA", principal_balance_cents: 2000000, apr_bps: 1200, monthly_payment_cents: 45000, missed_installments: 3, accrued_interest_cents: 60000, late_fees_cents: 12000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "COST_REPO_FEE", amount_cents: 35000 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "COST_STORAGE", amount_cents: 4500 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/cure-notices", payload: { expected_recovery_case_version: "${c_v}" }, as: RecoveryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /repo-agents", payload: { name: "Agent Y", license_number: "LIC-Y", licensed_state_codes: ["CA"], max_active_assignments: 5 }, as: RecoveryManager, captures: { ag_id: $.data.id } }
            - { call: "POST /recovery-cases/${c_id}/repo-assignments", payload: { agent_id: "${ag_id}", field_window_start: "2026-05-16T00:00:00Z", field_window_end: "2026-05-18T00:00:00Z" }, as: RecoveryManager, captures: { asg_id: $.data.id } }
            - { call: "POST /repo-assignments/${asg_id}/accept", payload: {}, as: RepoAgent, as_user_id: "${ag_id}" }
            - { call: "POST /repo-assignments/${asg_id}/report-secured", payload: { odometer: 65000, condition_grade: "GOOD", trade_in_value_cents: 1500000, auction_guide_low_cents: 900000 }, as: RepoAgent, as_user_id: "${ag_id}" }
            - { call: "GET /recovery-cases/${c_id}", payload: {}, as: RecoveryManager, captures: { c_v2: $.data.version } }
          trigger:
            - { call: "POST /recovery-cases/${c_id}/redemption-quotes", payload: { quote_type: "REDEMPTION", expected_recovery_case_version: "${c_v2}" }, as: RecoveryManager, captures: { q_amt: $.data.quoted_amount_cents, q_diem: $.data.per_diem_cents } }
          assert:
            - "q_diem == 658"
            - "q_amt == 2127950  (2072000 outstanding + 658*25 interest + 39500 costs; days = 05-01 -> 05-26 = 25)"
            - "q_amt != 2127938  (the single-shot rounding order would produce 16,438c interest and is non-conformant)"

  - rule_id: non_linear_state_machine
    instances:
      - name: consignment_relist_cycle_with_markdown
        grounds:
          - state_machines.Consignment.LISTED_to_UNSOLD
          - state_machines.Consignment.UNSOLD_to_LISTED
          - calculations.reserve_price
        distinguishing_aspect: |
          Consignment supports the cycle LISTED -> UNSOLD -> LISTED: the second listing
          is legal only after an UNSOLD report, and the cycle mutates data — reserve is
          recomputed as rhu(1,055,750 x 0.95) = 1,002,963c (round_half_up; banker's
          rounding would give 1,002,962c) and relist_count becomes 1.
        test_recipe:
          setup:
            - "Case in IN_AUCTION: consignment (reserve 1,055,750c) LISTED with window 2026-05-28..2026-05-30; clock 2026-05-27"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "RL", state_code: "CA", email: "rl@x.com" }, as: RecoveryManager, captures: { b_id: $.data.id } }
            - { call: "POST /loan-accounts", payload: { borrower_id: "${b_id}", vin: "VIN0000000000000D", governing_state_code: "CA", principal_balance_cents: 2000000, apr_bps: 1200, monthly_payment_cents: 45000, missed_installments: 3, accrued_interest_cents: 60000, late_fees_cents: 12000 }, as: RecoveryManager, captures: { l_id: $.data.id } }
            - { call: "POST /recovery-cases", payload: { loan_account_id: "${l_id}", default_reason: "delinquent" }, as: RecoveryManager, as_user_id: "rm_1", captures: { c_id: $.data.id, c_v: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "COST_REPO_FEE", amount_cents: 35000 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/ledger-entries", payload: { kind: "COST_STORAGE", amount_cents: 4500 }, as: RecoveryManager }
            - { call: "POST /recovery-cases/${c_id}/cure-notices", payload: { expected_recovery_case_version: "${c_v}" }, as: RecoveryManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-16T00:00:00Z" }, as: RecoveryManager }
            - { call: "POST /repo-agents", payload: { name: "Agent Z", license_number: "LIC-Z", licensed_state_codes: ["CA"], max_active_assignments: 5 }, as: RecoveryManager, captures: { ag_id: $.data.id } }
            - { call: "POST /recovery-cases/${c_id}/repo-assignments", payload: { agent_id: "${ag_id}", field_window_start: "2026-05-16T00:00:00Z", field_window_end: "2026-05-18T00:00:00Z" }, as: RecoveryManager, captures: { asg_id: $.data.id } }
            - { call: "POST /repo-assignments/${asg_id}/accept", payload: {}, as: RepoAgent, as_user_id: "${ag_id}" }
            - { call: "POST /repo-assignments/${asg_id}/report-secured", payload: { odometer: 65000, condition_grade: "GOOD", trade_in_value_cents: 1500000, auction_guide_low_cents: 900000 }, as: RepoAgent, as_user_id: "${ag_id}" }
            - { call: "GET /recovery-cases/${c_id}", payload: {}, as: RecoveryManager, captures: { c_v2: $.data.version } }
            - { call: "POST /recovery-cases/${c_id}/redemption-quotes", payload: { quote_type: "REDEMPTION", expected_recovery_case_version: "${c_v2}" }, as: RecoveryManager }
