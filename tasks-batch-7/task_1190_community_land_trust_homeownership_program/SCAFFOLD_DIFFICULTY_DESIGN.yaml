              as: ComplianceOfficer
            - call: "POST /programs/${prog}/households/${hh}/income-certifications/${cert}/approve"
              as: ComplianceOfficer
            - call: "POST /programs/${prog}/education-courses"
              payload: { code: "H101", title: "Basics", credit_hours: 8, is_required: true, validity_months: 24 }
              as: ProgramAdmin
              captures: { course: $.data.id }
            - call: "POST /programs/${prog}/households/${hh}/education-completions"
              payload: { course_id: "${course}", completed_at: "2026-04-01T00:00:00Z", score_pct: 0.9 }
              as: IntakeSpecialist
            - call: "POST /programs/${prog}/units/${unit}/leases"
              payload: { household_id: "${hh}", start_date: "2026-05-01T00:00:00Z", purchase_price_cents: 20000000 }
              as: LeaseManager
              captures: { lease: $.data.id }
            - call: "GET /programs/${prog}/units/${unit}"
              as: LeaseManager
              captures: { unit_v: $.data.version }
            - call: "POST /programs/${prog}/units/${unit}/leases/${lease}/activate"
              payload: { expected_unit_version: "${unit_v}" }
              as: LeaseManager
            - call: "POST /programs/${prog}/units/${unit}/inspections"
              payload: { scheduled_for: "2026-05-15T00:00:00Z" }
              as: Inspector
              captures: { insp: $.data.id }
          trigger:
            - call: "POST /programs/${prog}/units/${unit}/inspections/${insp}/record-result"
              payload: { result: "FAILED", findings: "Major structural issue" }
              as: Inspector
          assert:
            - "InspectionRecord.${insp}.result == FAILED"
            - "Unit.${unit}.maintenance_flag == UNSAFE"
            # Depth 1: DefaultNotice issued
            # Depth 2: GroundLease → IN_DEFAULT
            - "GroundLease.${lease}.status == IN_DEFAULT"
            # Depth 3: Unit occupancy_status
            - "Unit.${unit}.occupancy_status == IN_DEFAULT"
            - "InspectionRecord.${insp}.linked_notice_id != null"

      - name: income_cert_approval_cascade_to_fee_and_eligibility
        grounds:
          - state_machines.IncomeCertification
          - state_machines.Household
          - calculations.lease_fee_tier
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger: ComplianceOfficer approves IncomeCertification
          → Household.eligibility_status recomputed (PENDING → ELIGIBLE) AND Household.ami_pct
          refreshed → if Household has active_lease_id, GroundLease.monthly_fee_cents recomputed
          AND all PENDING LeaseFee rows re-amounted. Different initiating transition from
          inspection cascade.
        test_recipe:
          setup:
            - "Household already on ACTIVE lease at initial AMI 0.70 (monthly_fee = 41667)"
