            - "Stall.${stall_body_id}.booked_minutes == 120 (only the rework assignment is live)"
            - "Stall.${stall_paint_id}.booked_minutes == 0"
            - "a further POST /repair-orders/${ro_id}/stage-advance with to_stage = REPAIR is rejected ERR_STAGE_SEQUENCE_INVALID (409), so the cycle is entered once per failure, not repeatedly"

      - name: parts_line_negotiation_cycle_quoted_countered_quoted
