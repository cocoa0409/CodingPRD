scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: buydown_incentive_spend_us_recognition_vs_full_points
        grounds:
          - calculations.buydown_cost_recognition
          - calculations.capture_rate_realization
          - entities.BuydownCostRecord.fields.allowed_buydown_cost_cents
          - entities.Community.fields.incentive_spend_cents
          - state_machines.BuydownCostRecord.DRAFT_to_BOOKED
        distinguishing_aspect: |
          The same BuydownCostRecord row produces a different community-level incentive
          spend depending on which valid variant is applied: books_full_points_as_incentive
          reports 520000 while books_net_of_recapture reports 0, because the contract closed
          366 days after the record was created and therefore earned the whole recapture credit.
        test_recipe:
          setup:
            - "community cm1 under the PREMIUM policy; buyer b1 in TX; home site hs1 at 50000000 cents"
            - "contract ct1 with earnest money 2000000 cents; affiliated-lender application la1 qualified; rate lock lk1 for 360 days against commitment fc1 (window 2026-09-01..2030-01-01)"
            - "contract locked, AFFILIATED_BUSINESS_ARRANGEMENT disclosure d1 acknowledged"
            - "RATE_BUYDOWN allocation al1 of 8000000 cents applied, buydown record bd1 of 520000 cents booked by contract approval"
            - "logical clock subsequently advanced to 2027-09-02 so the lock expires and the contract must be relocked and re-approved"
            - "contract closed at 2027-09-02, i.e. 366 days after bd1.created_at"
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "PREMIUM", price_reduction_cap_cents: 4000000, closing_cost_cap_cents: 2500000, rate_buydown_cap_cents: 8000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
            - call: "POST /housing/buyers"
              payload: { full_name: "Ada", email: "ada@x.com", state_code: "TX" }
              as: SalesCounselor
              captures: { b1: $.data.id }
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L1", address: "1 Elm", base_price_cents: 50000000, construction_stage: "DRYWALL", estimated_completion_iso: "2026-12-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { hs1: $.data.id }
            - call: "POST /housing/communities/${cm1}/forward-commitments"
              payload: { commitment_code: "FC1", investor_name: "Fannie", committed_rate_bps: 499, committed_units: 10, commitment_start_iso: "2026-09-01T00:00:00Z", commitment_end_iso: "2030-01-01T00:00:00Z" }
              as: MortgageBanker
              captures: { fc1: $.data.id }
            - call: "POST /housing/home-sites/${hs1}/contracts"
              payload: { buyer_id: "${b1}", purchase_price_cents: 50000000, earnest_money_cents: 2000000 }
              as: SalesCounselor
              captures: { ct1: $.data.id, ct1_v: $.data.version }
            - call: "POST /housing/contracts/${ct1}/loan-applications"
              payload: { lender_entity_code: "AFFILIATED_LENDER", application_number: "APP-1", qualifying_income_cents: 2000000, monthly_debt_cents: 100000 }
              as: MortgageBanker
              captures: { la1: $.data.id }
            - call: "POST /housing/loan-applications/${la1}/qualify"
              payload: {}
              as: MortgageBanker
              captures: { la1_v: $.data.version }
            - call: "POST /housing/loan-applications/${la1}/rate-locks"
              payload: { commitment_id: "${fc1}", lock_rate_bps: 499, lock_days: 360, expected_application_version: "${la1_v}" }
              as: MortgageBanker
              captures: { lk1: $.data.id }
            - call: "POST /housing/contracts/${ct1}/lock"
              payload: {}
              as: MortgageBanker
            - call: "POST /housing/contracts/${ct1}/disclosures"
              payload: { disclosure_type: "AFFILIATED_BUSINESS_ARRANGEMENT" }
              as: ComplianceOfficer
              captures: { d1: $.data.id }
            - call: "POST /housing/disclosures/${d1}/acknowledge"
              payload: {}
              as: Buyer
              as_user_id: "${b1}"
            - call: "POST /housing/contracts/${ct1}/incentive-allocations"
              payload: { bucket: "RATE_BUYDOWN", requested_cents: 8000000, expected_contract_version: "${ct1_v}" }
              as: SalesCounselor
              captures: { al1: $.data.id }
            - call: "GET /housing/contracts/${ct1}"
              payload: {}
              as: MortgageBanker
              captures: { ct1_v2: $.data.version }
            - call: "POST /housing/contracts/${ct1}/buydown-records"
              payload: { allocation_id: "${al1}", gross_buydown_cents: 520000, expected_contract_version: "${ct1_v2}" }
              as: ClosingOfficer
              captures: { bd1: $.data.id }
            - call: "POST /housing/contracts/${ct1}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/loan-applications/${la1}/relock"
              payload: {}
              as: MortgageBanker
            - call: "POST /housing/rate-locks/${lk1}/relock"
              payload: {}
              as: MortgageBanker
            - call: "POST /housing/contracts/${ct1}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /housing/contracts/${ct1}/close"
              payload: {}
              as: ClosingOfficer
          trigger:
            - call: "GET /housing/buydown-records/${bd1}"
              payload: {}
              as: ClosingOfficer
              captures: { net_allowed: $.data.allowed_buydown_cost_cents }
            - call: "GET /housing/communities/${cm1}"
              payload: {}
              as: ComplianceOfficer
              captures: { comm_spend: $.data.incentive_spend_cents }
          assert:
            - "BuydownCostRecord.${bd1}.gross_buydown_cents == 520000"
            - "BuydownCostRecord.${bd1}.recapture_credit_cents == 520000  # books_net_of_recapture variant"
            - "BuydownCostRecord.${bd1}.allowed_buydown_cost_cents == 0"
            - "Community.${cm1}.incentive_spend_cents == 0  # books_full_points_as_incentive would report 520000"
            - "BuydownCostRecord.${bd1}.record_status == BOOKED"

      - name: lock_cost_extension_variant_vs_relock_variant
        grounds:
          - calculations.lock_extension_cost
          - state_machines.RateLock.EXPIRED_to_ACTIVE
          - entities.RateLock.fields.relock_fee_cents
          - entities.RateLock.fields.relock_count
          - entities.RateLock.fields.lock_cost_cents
        distinguishing_aspect: |
          The same 30 extra lock days cost 675 cents under the extension_variant and
          120675 cents under the relock_variant, so the two valid variants of one metric
          diverge by the flat RELOCK_FLAT_FEE_CENTS of 120000.
        test_recipe:
          setup:
            - "community cm1, buyer b1, home site hs1, contract ct1, affiliated application la1 qualified"
            - "rate lock lk1 created for 30 days against commitment fc1"
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
            - call: "POST /housing/buyers"
              payload: { full_name: "Ada", email: "ada@x.com", state_code: "TX" }
              as: SalesCounselor
              captures: { b1: $.data.id }
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L1", address: "1 Elm", base_price_cents: 50000000, construction_stage: "DRYWALL", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { hs1: $.data.id }
            - call: "POST /housing/communities/${cm1}/forward-commitments"
              payload: { commitment_code: "FC1", investor_name: "Fannie", committed_rate_bps: 499, committed_units: 10, commitment_start_iso: "2026-09-01T00:00:00Z", commitment_end_iso: "2030-01-01T00:00:00Z" }
              as: MortgageBanker
              captures: { fc1: $.data.id }
            - call: "POST /housing/home-sites/${hs1}/contracts"
              payload: { buyer_id: "${b1}", purchase_price_cents: 50000000, earnest_money_cents: 2000000 }
              as: SalesCounselor
              captures: { ct1: $.data.id }
            - call: "POST /housing/contracts/${ct1}/loan-applications"
              payload: { lender_entity_code: "AFFILIATED_LENDER", application_number: "APP-1", qualifying_income_cents: 2000000, monthly_debt_cents: 100000 }
              as: MortgageBanker
              captures: { la1: $.data.id }
            - call: "POST /housing/loan-applications/${la1}/qualify"
              payload: {}
              as: MortgageBanker
              captures: { la1_v: $.data.version }
            - call: "POST /housing/loan-applications/${la1}/rate-locks"
              payload: { commitment_id: "${fc1}", lock_rate_bps: 499, lock_days: 30, expected_application_version: "${la1_v}" }
              as: MortgageBanker
              captures: { lk1: $.data.id }
          trigger:
            - call: "POST /housing/rate-locks/${lk1}/extend"
              payload: { new_lock_days: 60 }
              as: MortgageBanker
              captures: { ext_cost: $.data.lock_cost_cents }
          assert:
            - "RateLock.${lk1}.lock_cost_cents == 675  # extra_days=30; tier1=min(30,30)-15=15 at 45c; tier2=max(0,30-30)=0 at 110c"
            - "RateLock.${lk1}.relock_fee_cents == 0  # extension_variant never charges the flat relock fee"
            - "RateLock.${lk1}.relock_count == 0"
            - "RateLock.${lk1}.lock_days == 60"
            - "RateLock.${lk1}.relock_variant would have produced 675 + 120000 * (0 + 1) == 120675"

  - rule_id: combinatorial_formula
    instances:
      - name: qualification_score_nested_min_max_tier_mode_a
        grounds:
          - calculations.mortgage_qualification_score
          - entities.LoanApplication.fields.qualification_score
          - entities.LoanApplication.fields.dti_bps
          - entities.LoanApplication.fields.qualifying_income_cents
          - entities.LoanApplication.fields.monthly_debt_cents
          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: |
          Mode (a): three inputs interact non-linearly through a nested min/max and a
          two-tier bonus, so income 1200000/1200000 and income 1200000/2000000 both land
          at score 572 and score 528 respectively while the raw tier bonus flips at an
          income boundary rather than a debt boundary.
        test_recipe:
          setup:
            - "two affiliated applications on the same contract share the premium income tier but differ in monthly debt"
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
            - call: "POST /housing/buyers"
              payload: { full_name: "Ada", email: "ada@x.com", state_code: "TX" }
              as: SalesCounselor
              captures: { b1: $.data.id }
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L1", address: "1 Elm", base_price_cents: 50000000, construction_stage: "DRYWALL", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { hs1: $.data.id }
            - call: "POST /housing/home-sites/${hs1}/contracts"
              payload: { buyer_id: "${b1}", purchase_price_cents: 50000000, earnest_money_cents: 2000000 }
              as: SalesCounselor
              captures: { ct1: $.data.id }
            - call: "POST /housing/contracts/${ct1}/loan-applications"
              payload: { lender_entity_code: "AFFILIATED_LENDER", application_number: "APP-1", qualifying_income_cents: 1200000, monthly_debt_cents: 1200000 }
              as: MortgageBanker
              captures: { la_low: $.data.id }
            - call: "POST /housing/contracts/${ct1}/loan-applications"
              payload: { lender_entity_code: "AFFILIATED_LENDER", application_number: "APP-2", qualifying_income_cents: 1200000, monthly_debt_cents: 2000000 }
              as: MortgageBanker
              captures: { la_high: $.data.id }
          trigger:
            - call: "GET /housing/loan-applications/${la_low}"
              payload: {}
              as: MortgageBanker
              captures: { s_low: $.data.qualification_score }
            - call: "GET /housing/loan-applications/${la_high}"
              payload: {}
              as: MortgageBanker
              captures: { s_high: $.data.qualification_score }
          assert:
            - "LoanApplication.${la_low}.qualification_score == 572  # base 324 + dti_component 188 + tier_bonus 60"
            - "LoanApplication.${la_high}.qualification_score == 528  # base 324 + dti_component 144 + tier_bonus 60"
            - "LoanApplication.${la_low}.dti_bps == 10000"
            - "LoanApplication.${la_high}.dti_bps == 16666"
            - "the tier_bonus is 60 for both rows because it keys on qualifying_income_cents >= 1200000, not on monthly_debt_cents"

      - name: allocation_waterfall_circular_spill_mode_c
        grounds:
          - calculations.incentive_allocation_waterfall
          - entities.IncentiveAllocation.fields.allocation_total_cents
          - entities.IncentiveAllocation.fields.spill_to_bucket
          - entities.HomeSaleContract.fields.incentive_allocated_cents
          - state_machines.IncentiveAllocation.PENDING_to_RESERVED
          - decision_policies.SELECTOR-04
        distinguishing_aspect: |
          Mode (c): the second allocation's granted amount depends on a cap left over by
          the first allocation's own granted amount, so the value is only well-defined once
          the pinned evaluation order PRICE_REDUCTION -> CLOSING_COSTS -> RATE_BUYDOWN is fixed;
          reading the caps before the first spill yields 2000000 instead of the correct 1500000.
        test_recipe:
          setup:
            - "community cm1 with caps 3000000 / 2000000 / 6000000; contract ct1 in PENDING"
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
            - call: "POST /housing/buyers"
              payload: { full_name: "Ada", email: "ada@x.com", state_code: "TX" }
              as: SalesCounselor
              captures: { b1: $.data.id }
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L1", address: "1 Elm", base_price_cents: 50000000, construction_stage: "DRYWALL", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { hs1: $.data.id }
            - call: "POST /housing/home-sites/${hs1}/contracts"
              payload: { buyer_id: "${b1}", purchase_price_cents: 50000000, earnest_money_cents: 2000000 }
              as: SalesCounselor
              captures: { ct1: $.data.id, ct1_v: $.data.version }
            - call: "POST /housing/contracts/${ct1}/incentive-allocations"
              payload: { bucket: "PRICE_REDUCTION", requested_cents: 3500000, expected_contract_version: "${ct1_v}" }
              as: SalesCounselor
              captures: { al1: $.data.id, al1_total: $.data.allocation_total_cents, al1_spill: $.data.spill_to_bucket }
            - call: "GET /housing/contracts/${ct1}"
              payload: {}
              as: SalesCounselor
              captures: { ct1_v2: $.data.version }
            - call: "POST /housing/contracts/${ct1}/incentive-allocations"
              payload: { bucket: "CLOSING_COSTS", requested_cents: 2500000, expected_contract_version: "${ct1_v2}" }
              as: SalesCounselor
              captures: { al2: $.data.id, al2_total: $.data.allocation_total_cents, al2_spill: $.data.spill_to_bucket }
          trigger:
            - call: "GET /housing/incentive-allocations/${al2}"
              payload: {}
              as: SalesCounselor
              captures: { al2_total_check: $.data.allocation_total_cents }
            - call: "GET /housing/contracts/${ct1}"
              payload: {}
              as: SalesCounselor
              captures: { ct1_alloc: $.data.incentive_allocated_cents }
          assert:
            - "IncentiveAllocation.${al1}.allocation_total_cents == 3500000"
            - "IncentiveAllocation.${al1}.spill_to_bucket == CLOSING_COSTS"
            - "IncentiveAllocation.${al2}.allocation_total_cents == 2500000  # NOT 2000000; the CLOSING_COSTS cap was already reduced to 1500000 by al1's spill"
            - "IncentiveAllocation.${al2}.spill_to_bucket == RATE_BUYDOWN"
            - "HomeSaleContract.${ct1}.incentive_allocated_cents == 6000000"

  - rule_id: non_linear_state_machine
    instances:
      - name: rate_lock_relock_cycle_returns_to_active
        grounds:
          - state_machines.RateLock.ACTIVE_to_EXPIRED
          - state_machines.RateLock.EXPIRED_to_ACTIVE
          - state_machines.RateLock.ACTIVE_to_CONSUMED
          - entities.RateLock.fields.relock_count
          - entities.RateLock.fields.lock_expires_iso
        distinguishing_aspect: |
          RateLock is cyclic rather than a linear pipeline: the same row leaves ACTIVE by
          expiry, re-enters ACTIVE by relock, and only then reaches the terminal CONSUMED,
          so the row visits ACTIVE twice and relock_count is the observable witness.
        test_recipe:
          setup:
            - "a 30-day lock lk1 on a qualified application, created 2026-09-01"
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
            - call: "POST /housing/buyers"
              payload: { full_name: "Ada", email: "ada@x.com", state_code: "TX" }
              as: SalesCounselor
              captures: { b1: $.data.id }
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L1", address: "1 Elm", base_price_cents: 50000000, construction_stage: "DRYWALL", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { hs1: $.data.id }
            - call: "POST /housing/communities/${cm1}/forward-commitments"
              payload: { commitment_code: "FC1", investor_name: "Fannie", committed_rate_bps: 499, committed_units: 10, commitment_start_iso: "2026-09-01T00:00:00Z", commitment_end_iso: "2030-01-01T00:00:00Z" }
              as: MortgageBanker
              captures: { fc1: $.data.id }
            - call: "POST /housing/home-sites/${hs1}/contracts"
              payload: { buyer_id: "${b1}", purchase_price_cents: 50000000, earnest_money_cents: 2000000 }
              as: SalesCounselor
              captures: { ct1: $.data.id }
            - call: "POST /housing/contracts/${ct1}/loan-applications"
              payload: { lender_entity_code: "AFFILIATED_LENDER", application_number: "APP-1", qualifying_income_cents: 2000000, monthly_debt_cents: 100000 }
              as: MortgageBanker
              captures: { la1: $.data.id }
            - call: "POST /housing/loan-applications/${la1}/qualify"
              payload: {}
              as: MortgageBanker
              captures: { la1_v: $.data.version }
            - call: "POST /housing/loan-applications/${la1}/rate-locks"
              payload: { commitment_id: "${fc1}", lock_rate_bps: 499, lock_days: 30, expected_application_version: "${la1_v}" }
              as: MortgageBanker
              captures: { lk1: $.data.id }
            - call: "POST /housing/contracts/${ct1}/lock"
              payload: {}
              as: MortgageBanker
          trigger:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /housing/rate-locks/${lk1}"
              payload: {}
              as: MortgageBanker
              captures: { expired_state: $.data.lock_status }
            - call: "POST /housing/rate-locks/${lk1}/relock"
              payload: {}
              as: MortgageBanker
              captures: { relocked_state: $.data.lock_status, rc: $.data.relock_count }
          assert:
            - "RateLock.${lk1}.lock_status == ACTIVE after the relock (the cycle closed back on its source state)"
            - "RateLock.${lk1}.relock_count == 1"
            - "RateLock.${lk1}.lock_expires_iso > 2026-10-05T00:00:00Z (expiry was recomputed from the current clock)"
            - "HomeSaleContract.${ct1}.contract_status == LOCKED (LOCKED -> PENDING on expiry, PENDING -> LOCKED again on relock)"
            - "RateLock.${lk1}.lock_status was EXPIRED immediately before the relock call"

      - name: loan_application_parallel_underwriting_and_waiver_dimensions
        grounds:
          - state_machines.LoanApplication.NOT_REQUESTED_to_REQUESTED
          - state_machines.LoanApplication.REQUESTED_to_GRANTED
          - state_machines.LoanApplication.QUALIFIED_to_EXPIRED
          - entities.LoanApplication.fields.lock_waiver_status
          - entities.LoanApplication.fields.application_status
          - entities.LoanApplication.fields.uw_precedence
        distinguishing_aspect: |
          LoanApplication carries two state dimensions that evolve independently on the same
          row: the waiver track moves NOT_REQUESTED -> REQUESTED -> GRANTED while the
          underwriting track stays QUALIFIED, so uw_precedence reads QUALIFIED_GRANTED and
          neither dimension's transitions appear in the other's transition list.
        test_recipe:
          setup:
            - "a qualified affiliated application la1 on contract ct1"
          setup_api_calls:
            - call: "POST /housing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /housing/communities"
              payload: { name: "C1", state_code: "TX", incentive_policy_code: "STANDARD", price_reduction_cap_cents: 3000000, closing_cost_cap_cents: 2000000, rate_buydown_cap_cents: 6000000 }
              as: PlatformAdmin
              captures: { cm1: $.data.id }
            - call: "POST /housing/buyers"
              payload: { full_name: "Ada", email: "ada@x.com", state_code: "TX" }
              as: SalesCounselor
              captures: { b1: $.data.id }
            - call: "POST /housing/communities/${cm1}/home-sites"
              payload: { lot_number: "L1", address: "1 Elm", base_price_cents: 50000000, construction_stage: "DRYWALL", estimated_completion_iso: "2026-10-01T00:00:00Z", advertised_rate_bps: 499, advertised_rate_expires_iso: "2027-01-01T00:00:00Z" }
              as: SalesCounselor
              captures: { hs1: $.data.id }
            - call: "POST /housing/home-sites/${hs1}/contracts"
              payload: { buyer_id: "${b1}", purchase_price_cents: 50000000, earnest_money_cents: 2000000 }
              as: SalesCounselor
              captures: { ct1: $.data.id }
