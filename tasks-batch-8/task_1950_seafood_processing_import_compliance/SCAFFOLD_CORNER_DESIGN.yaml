      - name: segregation_of_duties_on_resolve
        claim_type: violation_to_error
        grounds: ["validations[priority=25]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: the ComplianceManager user cm-01 who opened a MANUAL corrective action cannot also resolve it (ERR_SEGREGATION_OF_DUTIES 403), while a different ComplianceManager cm-02 can."
        test_recipe:
          setup: ["one processing batch; MANUAL CA on it opened by cm-01 and moved to INVESTIGATING by cm-02"]
          setup_api_calls:
            - { call: "POST /seafood/processing-batches", payload: { target_species: "COD", product_form: "FILLET" }, as: ProcessingSupervisor, captures: { bat_id: "$.data.id" } }
            - { call: "POST /seafood/corrective-actions", payload: { source_type: "MANUAL", processing_batch_id: "${bat_id}", reason: "audit finding" }, as: ComplianceManager, as_user_id: "cm-01", captures: { ca_id: "$.data.id", opener: "$.data.opened_by" } }
            - { call: "POST /seafood/corrective-actions/${ca_id}/investigate", payload: {}, as: ComplianceManager, as_user_id: "cm-02" }
          trigger:
            - { call: "POST /seafood/corrective-actions/${ca_id}/resolve", payload: { resolution_note: "self-resolution attempt" }, as: ComplianceManager, as_user_id: "cm-01", captures: { err: "$.data.error_id" } }
            - { call: "POST /seafood/corrective-actions/${ca_id}/resolve", payload: { resolution_note: "independent resolution" }, as: ComplianceManager, as_user_id: "cm-02", captures: { st: "$.data.status", closer: "$.data.closed_by" } }
          assert:
            - "opened_by == cm-01"
            - "resolve by cm-01 rejected: error_id == ERR_SEGREGATION_OF_DUTIES with http 403"
            - "resolve by cm-02 succeeds: status == RESOLVED, closed_by == cm-02"

