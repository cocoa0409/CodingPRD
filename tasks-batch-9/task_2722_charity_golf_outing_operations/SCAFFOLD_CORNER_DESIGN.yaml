              as: TournamentDirector
            - call: "POST /outing-ops/registrations"
              payload: { outing_id: "${o_id}", package_tier_id: "${t_id}", buyer_name: "Reversal Buyer", player_count: 1 }
              as: TournamentDirector
              captures: { r_id: $.data.id }
            - call: "POST /outing-ops/registrations/${r_id}/payment"
              payload: { amount_cents: 30000 }
              as: CharityTreasurer
            - call: "POST /outing-ops/receipts"
              payload: { outing_id: "${o_id}", receipt_kind: "REGISTRATION", registration_id: "${r_id}" }
              as: CharityTreasurer
              captures: { rec1_id: $.data.id }
          trigger:
            - call: "POST /outing-ops/receipts"
              payload: { outing_id: "${o_id}", receipt_kind: "REGISTRATION", registration_id: "${r_id}" }
              as: CharityTreasurer
              captures: { e_dup: $.data.error_id }
            - call: "POST /outing-ops/receipts/${rec1_id}/reversal"
              payload: { reversal_reason: "Payment charged back" }
              as: CharityTreasurer
              captures: { rev_id: $.data.id }
            - call: "POST /outing-ops/receipts/${rec1_id}/reversal"
              payload: { reversal_reason: "Second attempt at the same reversal" }
              as: CharityTreasurer
              captures: { e_twice: $.data.error_id }
            - call: "POST /outing-ops/receipts/${rev_id}/reversal"
              payload: { reversal_reason: "Reversing a reversal" }
              as: CharityTreasurer
              captures: { e_of_rev: $.data.error_id }
            - call: "POST /outing-ops/receipts"
              payload: { outing_id: "${o_id}", receipt_kind: "REGISTRATION", registration_id: "${r_id}" }
              as: CharityTreasurer
              captures: { rec3_id: $.data.id }
          assert:
            - "the first call is HTTP 409 with ${e_dup} == 'ERR_DUPLICATE_RECEIPT' while the original receipt is still live"
            - "the reversal is HTTP 201 with receipt_kind == 'REVERSAL', receipt_number == 'GR-0002', payment_cents == -30000, gsv_cents == 0 and deductible_amount_cents == -30000, and GET /outing-ops/outings/${o_id} then reads receipted_deductible_total_cents == 0"
            - "${e_twice} == 'ERR_RECEIPT_IMMUTABLE' (HTTP 409) - a receipt may be reversed at most once"
            - "${e_of_rev} == 'ERR_RECEIPT_IMMUTABLE' (HTTP 409) - a REVERSAL row is not itself reversible"
            - "the last call is HTTP 201 with receipt_number == 'GR-0003' and deductible_amount_cents == 30000, because the subject no longer holds an un-reversed forward receipt, and the outing then reads receipted_deductible_total_cents == 30000"
            - "GET /outing-ops/receipts?outing_id=${o_id} returns total_count == 3 - the two refused calls consumed no numbers"

