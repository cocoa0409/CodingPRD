# =============================================================================
# Task 1024 — Hydroponics & Indoor-Garden Store
# SCAFFOLD_CORNER_DESIGN.yaml  (§1.9 breadth probe)
# Enumerates testable claims not already covered by §1.8; excluded_because
# stubs point at the §1.8 instance that already exercises the claim.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: product_creation_returns_all_fields
        claim_type: Creation
        grounds: [entities.Product.fields.sku_code, entities.Product.fields.category]
        distinguishing_aspect: "POST /products with required fields returns 201 and echoes sku_code/category/unit_price_cents plus system id/version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku_code: "SYS-A", name: "Tower", category: "SYSTEM", unit_price_cents: 12000 }
              as: StoreAdmin
              captures: { p_id: $.data.id, v: $.data.version }
          assert:
            - "response code == 201"
            - "Product.${p_id}.category == SYSTEM"
            - "Product.${p_id}.version == 1"

      - name: product_computed_reorder_flag_true_when_empty
        claim_type: Computed Fields
        grounds: [entities.Product.fields.total_available_units, entities.Product.fields.reorder_flag]
        distinguishing_aspect: "A freshly created product with reorder_threshold 5 and no lots has total_available_units 0 and reorder_flag true (0 < 5)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /products"
              payload: { sku_code: "SYS-B", name: "Shelf", category: "SYSTEM", unit_price_cents: 5000, reorder_threshold: 5 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
          assert:
            - "Product.${p_id}.total_available_units == 0"
            - "Product.${p_id}.reorder_flag == true"

      - name: create_order_missing_lines_returns_422
        claim_type: Required Fields
        grounds: [entities.Order.fields.lines, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /orders without the required 'lines' field returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["A customer exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "mr@x.com", full_name: "Miss Req" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: get_product_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /products/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /products/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Order.DRAFT_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming a CONFIRMED order (second confirm) is rejected with ERR_INVALID_STATE; no additional reservation occurs."
        test_recipe:
          setup: ["Customer; product stocked; order confirmed once."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ic@x.com", full_name: "I C" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "SYS-C", name: "Kit C", category: "SYSTEM", unit_price_cents: 4000 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 50 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${p_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: cancel_shipped_order_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Order.CONFIRMED_to_SHIPPED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a SHIPPED (terminal fulfillment) order is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Customer; product stocked; order confirmed and shipped."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sh@x.com", full_name: "S H" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "SYS-D", name: "Kit D", category: "SYSTEM", unit_price_cents: 4000 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 50 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${p_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/ship"
              payload: {}
              as: StoreAdmin
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              payload: {}
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: rma_approve_from_submitted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.RMA.UNDER_REVIEW_to_APPROVED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a SUBMITTED RMA (skipping review) is rejected with ERR_INVALID_STATE; approve is only legal from UNDER_REVIEW."
        test_recipe:
          setup: ["Customer; product warranty 12 stocked; shipped order; RMA submitted (still SUBMITTED)."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ra@x.com", full_name: "R A" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "LGT-3", name: "COB", category: "LIGHTING", unit_price_cents: 9000, warranty_months: 12 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 20 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${p_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/ship"
              payload: {}
              as: StoreAdmin
            - call: "POST /rmas"
              payload: { order_id: "${order_id}", product_id: "${p_id}", return_quantity: 1, reason: "dim" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rma_id: $.data.id }
          trigger:
            - call: "POST /rmas/${rma_id}/approve"
              payload: {}
              as: StoreAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: subscription_pause_resume_cycle
        claim_type: cyclic
        grounds: [state_machines.Subscription.ACTIVE_to_PAUSED, state_machines.Subscription.PAUSED_to_ACTIVE]
        distinguishing_aspect: "A subscription cycles ACTIVE -> PAUSED -> ACTIVE via pause then resume, ending ACTIVE."
        test_recipe:
          setup: ["Customer; subscribable product; ACTIVE subscription."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "sub@x.com", full_name: "Sub One" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "CON-1", name: "Grow A", category: "CONSUMABLE", unit_price_cents: 2500, is_subscribable: true }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", product_id: "${p_id}", interval_days: 30, quantity_per_cycle: 2 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /subscriptions/${sub_id}/resume"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Subscription.${sub_id}.status == ACTIVE"

      - name: workshop_cancel_cascades_registrations
        claim_type: Cascade down
        grounds: [state_machines.WorkshopSession.OPEN_to_CANCELLED, entities.WorkshopRegistration.fields.status]
        distinguishing_aspect: "Cancelling an OPEN session cascades: the REGISTERED registration under it becomes CANCELLED and seats_taken recomputes to 0."
        test_recipe:
          setup: ["Room; OPEN session capacity 5; customer; one REGISTERED registration."]
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Studio D", seat_capacity: 20 }
              as: StoreAdmin
              captures: { room_id: $.data.id }
            - call: "POST /workshop-sessions"
              payload: { room_id: "${room_id}", title: "Cascade Class", start_at: "2026-07-13T18:00:00Z", end_at: "2026-07-13T20:00:00Z", capacity: 5 }
              as: StoreAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /workshop-sessions/${sess_id}/open"
              payload: {}
              as: StoreAdmin
            - call: "POST /customers"
              payload: { email: "wc@x.com", full_name: "W C" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /workshop-sessions/${sess_id}/registrations"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { reg_id: $.data.id }
          trigger:
            - call: "POST /workshop-sessions/${sess_id}/cancel"
              payload: {}
              as: StoreAdmin
          assert:
            - "WorkshopRegistration.${reg_id}.status == CANCELLED"
            - "WorkshopSession.${sess_id}.seats_taken == 0"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: retail_order_no_discount_no_hazmat
        claim_type: Correct Result
        grounds: [calculations.order_net_total, entities.Order.fields.provisional_total_cents]
        distinguishing_aspect: "A RETAIL order takes discount 0 and (no hazmat line) surcharge 0, so provisional_total_cents equals subtotal 12000 for 3 units at 4000."
        test_recipe:
          setup: ["Customer; product 4000 stocked."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "rn@x.com", full_name: "R N" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "ACC-2", name: "Air Stone", category: "ACCESSORY", unit_price_cents: 4000 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 50 }
              as: StoreAdmin
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${p_id}", quantity: 3 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          assert:
            - "Order.${order_id}.subtotal_cents == 12000"
            - "Order.${order_id}.discount_cents == 0"
            - "Order.${order_id}.hazmat_surcharge_cents == 0"
            - "Order.${order_id}.provisional_total_cents == 12000"

      - name: rma_refund_restock_fee_out_of_warranty
        claim_type: Constants Applied
        grounds: [calculations.rma_refund, entities.RMA.fields.refund_cents, entities.RMA.fields.within_warranty]
        distinguishing_aspect: "Out of warranty (warranty_months 0, clock advanced past shipped_at), refund_cents = round_half_up(20000 * 0.85) = 17000 and within_warranty is false."
        test_recipe:
          setup: ["Customer; product warranty 0, unit 10000, stocked; order of 2 confirmed+shipped; clock advanced to 2026-08-01; RMA reviewed."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "ow@x.com", full_name: "O W" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "ACC-3", name: "Timer", category: "ACCESSORY", unit_price_cents: 10000, warranty_months: 0 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 20 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${p_id}", quantity: 2 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/ship"
              payload: {}
              as: StoreAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StoreAdmin
            - call: "POST /rmas"
              payload: { order_id: "${order_id}", product_id: "${p_id}", return_quantity: 2, reason: "changed mind" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rma_id: $.data.id }
            - call: "POST /rmas/${rma_id}/review"
              payload: {}
              as: StoreAdmin
          trigger:
            - call: "POST /rmas/${rma_id}/approve"
              payload: {}
              as: StoreAdmin
          assert:
            - "RMA.${rma_id}.within_warranty == false"
            - "RMA.${rma_id}.refund_cents == 17000"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_orders_by_customer_pagination_envelope
        claim_type: Listing
        grounds: [entities.Order.fields.customer_id]
        distinguishing_aspect: "GET /orders?customer_id= returns the customer's two orders with pagination fields total_count 2 and has_more false."
        test_recipe:
          setup: ["Customer with two DRAFT orders on a stocked product."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "pg@x.com", full_name: "P G" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "ACC-4", name: "Clip", category: "ACCESSORY", unit_price_cents: 300 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 100 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${p_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${p_id}", quantity: 2 } ] }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /orders?customer_id=${cust_id}"
              payload: {}
              as: StoreAdmin
          assert:
            - "response pagination total_count == 2"
            - "response pagination has_more == false"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: customer_cannot_ship_order_returns_unauthorized
        claim_type: peer_roles
        grounds: ["errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /orders/{id}/ship is StoreAdmin-exclusive; a Customer calling it gets ERR_UNAUTHORIZED (403) before any state check."
        test_recipe:
          setup: ["Customer with a DRAFT order."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "us@x.com", full_name: "U S" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "ACC-5", name: "Hanger", category: "ACCESSORY", unit_price_cents: 700 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 10 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${p_id}", quantity: 1 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/ship"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

      - name: consultant_cannot_create_product_returns_unauthorized
        claim_type: peer_roles
        grounds: ["errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "POST /products is StoreAdmin-exclusive; a Consultant calling it gets ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["A consultant exists to act as."]
          setup_api_calls:
            - call: "POST /consultants"
              payload: { name: "Cara", specialty: "LIGHTING", hourly_rate_cents: 9000 }
              as: StoreAdmin
              captures: { con_id: $.data.id }
          trigger:
            - call: "POST /products"
              payload: { sku_code: "X-1", name: "X", category: "ACCESSORY", unit_price_cents: 100 }
              as: Consultant
              as_user_id: "${con_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

      - name: ownership_customer_registers_other_returns_403
        claim_type: peer_roles
        grounds: ["errors[ERR_OWNERSHIP_REQUIRED]", "validations[priority=22]"]
        distinguishing_aspect: "A Customer registering with a customer_id different from X-User-ID is rejected with ERR_OWNERSHIP_REQUIRED (403)."
        test_recipe:
          setup: ["Room; OPEN session; two customers c1 (actor) and c2 (target)."]
          setup_api_calls:
            - call: "POST /rooms"
              payload: { name: "Studio E", seat_capacity: 20 }
              as: StoreAdmin
              captures: { room_id: $.data.id }
            - call: "POST /workshop-sessions"
              payload: { room_id: "${room_id}", title: "Own", start_at: "2026-07-14T18:00:00Z", end_at: "2026-07-14T20:00:00Z", capacity: 5 }
              as: StoreAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /workshop-sessions/${sess_id}/open"
              payload: {}
              as: StoreAdmin
            - call: "POST /customers"
              payload: { email: "o1@x.com", full_name: "O One" }
              as: StoreAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "o2@x.com", full_name: "O Two" }
              as: StoreAdmin
              captures: { c2_id: $.data.id }
          trigger:
            - call: "POST /workshop-sessions/${sess_id}/registrations"
              payload: { customer_id: "${c2_id}" }
              as: Customer
              as_user_id: "${c1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_OWNERSHIP_REQUIRED"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_account_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[commercial-order-stale-account]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After a commercial order bumps the account version, a second placement still carrying the pre-order expected_commercial_account_version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Commercial account activated (version captured); product stocked; one order placed which advances the account version."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku_code: "SYS-Z", name: "Z Sys", category: "SYSTEM", unit_price_cents: 10000 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 100 }
              as: StoreAdmin
            - call: "POST /commercial-accounts"
              payload: { business_name: "Occ Co", credit_limit_cents: 5000000, discount_tier: "STANDARD" }
              as: StoreAdmin
              captures: { acc_id: $.data.id }
            - call: "POST /commercial-accounts/${acc_id}/activate"
              payload: {}
              as: StoreAdmin
              captures: { v_act: $.data.version }
            - call: "POST /commercial-accounts/${acc_id}/orders"
              payload: { lines: [ { product_id: "${p_id}", quantity: 1 } ], expected_commercial_account_version: "${v_act}" }
              as: CommercialBuyer
              as_user_id: "${acc_id}"
          trigger:
            - call: "POST /commercial-accounts/${acc_id}/orders"
              payload: { lines: [ { product_id: "${p_id}", quantity: 1 } ], expected_commercial_account_version: "${v_act}" }
              as: CommercialBuyer
              as_user_id: "${acc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"

      - name: insufficient_stock_on_confirm_returns_conflict
        claim_type: rate_threshold_triggers
        grounds: ["errors[ERR_INSUFFICIENT_STOCK]", "validations[priority=55]"]
        distinguishing_aspect: "Confirming a retail order whose line quantity (5) exceeds total_available_units (3) is rejected with ERR_INSUFFICIENT_STOCK (409)."
        test_recipe:
          setup: ["Customer; product with a single lot on_hand 3; DRAFT order for 5 units."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "is@x.com", full_name: "I S" }
              as: StoreAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /products"
              payload: { sku_code: "SYS-IS", name: "Scarce", category: "SYSTEM", unit_price_cents: 5000 }
              as: StoreAdmin
              captures: { p_id: $.data.id }
            - call: "POST /products/${p_id}/inventory-lots"
              payload: { lot_code: "L-1", quantity_on_hand: 3 }
              as: StoreAdmin
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", lines: [ { product_id: "${p_id}", quantity: 5 } ] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_STOCK"

