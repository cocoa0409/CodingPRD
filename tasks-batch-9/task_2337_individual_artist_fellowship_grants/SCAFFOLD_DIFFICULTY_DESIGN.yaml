      # --- mode (b): order of rounding operations changes the result ----------
      - name: award_withholding_rounded_per_installment_not_on_the_total
        grounds:
          - calculations.installment_payment_schedule
          - entities.Award.fields.scheduled_withholding_cents
          - entities.PaymentInstallment.fields.withholding_cents
          - state_machines.Award.OFFERED_to_ACCEPTED
        distinguishing_aspect: |
          Gross 1,500,000 splits into 600,000 / 525,000 / 375,000 and the 0.2707 rate rounds
          per installment to 162,420 / 142,118 / 101,513 summing to 406,051, whereas rounding
          the product 1,500,000 x 0.2707 once gives 406,050, so the award's
          scheduled_withholding_cents distinguishes the two rounding orders by exactly one cent.
        test_recipe:
          setup:
            - "CycleMain award of 1,500,000 accepted by an artist whose tin_status is MISSING"
            - "grant_period_start is 2027-01-01, so OFFSET_DAYS [0,120,240] give 2027-01-01, 2027-05-01 and 2027-08-29"
