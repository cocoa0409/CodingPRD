# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine §0.5 Difficulty
# Rules. Every grounds[] entry resolves to a declared element. Every assert
# literal was computed by executing the pinned formula against its constants.
# Expert tier: maximal multi-rule interaction, dense edge coverage.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_initial_vs_renewal_variant_on_application_and_license
        grounds:
          - calculations.fee_assessment
          - calculations.fee_assessment.variants.initial_application
          - calculations.fee_assessment.variants.renewal
          - entities.LicenseApplication.fields.fee_quoted_cents
          - entities.License.fields.term_end_at
          - state_machines.LicenseApplication.DRAFT_to_SUBMITTED
          - state_machines.License.RENEWAL_DUE_to_ACTIVE
        distinguishing_aspect: |
          The initial_application variant (computed on LicenseApplication at SUBMIT)
          charges base + surcharges = 110000 cents, while the renewal variant
          (computed on License at RENEWAL) charges base only = 100000 cents with NO
          surcharges re-applied; same ON_47 class, two different entity domains
          (LicenseApplication fee vs License renewal fee) yield different numbers.
        test_recipe:
          setup:
            - "ON_47 class: base_fee_cents=100000, requires_zoning=true, premise_type=ON_PREMISE, quota_managed=true, renewal_cycle_months=12, max_servers=5."
            - "An ISSUED application with fee_quoted_cents=110000, its License ACTIVE then RENEWAL_DUE inside the renewal window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Director
            - call: "POST /license-classes"
              payload: { code: "ON_47", premise_type: "ON_PREMISE", quota_managed: true, base_fee_cents: 100000, renewal_cycle_months: 12, requires_zoning: true, max_servers_per_license: 5 }
              as: Director
              captures: { cls_code: $.data.code }
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
              captures: { reg_v: $.data.version }
            - call: "POST /applicants"
              payload: { legal_name: "Acme Bar LLC", felony_flag: false }
              as: Director
              captures: { app_owner_id: $.data.id }
            - call: "POST /premises"
              payload: { applicant_id: "${app_owner_id}", region_code: "CTY_LA", street_address: "1 Main St", distance_to_school_m: 200, zoning_district: "COMMERCIAL" }
              as: Applicant
              as_user_id: "${app_owner_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /license-applications"
              payload: { applicant_id: "${app_owner_id}", premise_id: "${prem_id}", license_class_code: "ON_47" }
              as: Applicant
              as_user_id: "${app_owner_id}"
              captures: { la_id: $.data.id }
            - call: "POST /license-applications/${la_id}/submit"
              payload: { expected_region_version: "${reg_v}" }
              as: Applicant
              as_user_id: "${app_owner_id}"
            - call: "GET /license-applications/${la_id}/background-checks"
              as: LicensingExaminer
              as_user_id: "exam-1"
              captures: { bc_id: $.data.0.id }
            - call: "POST /background-checks/${bc_id}/resolve"
              payload: { decision: "PASS" }
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "GET /license-applications/${la_id}/zoning-reviews"
              as: ZoningOfficer
              as_user_id: "zone-1"
              captures: { zr_id: $.data.0.id }
            - call: "POST /zoning-reviews/${zr_id}/decide"
              payload: { decision: "CLEAR" }
              as: ZoningOfficer
              as_user_id: "zone-1"
            - call: "POST /license-applications/${la_id}/begin-review"
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "POST /license-applications/${la_id}/open-protest-period"
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Director
            - call: "POST /license-applications/${la_id}/approve"
              as: Director
              as_user_id: "dir-1"
            - call: "POST /license-applications/${la_id}/pay-fee"
              payload: { amount_cents: 110000 }
              as: Applicant
              as_user_id: "${app_owner_id}"
            - call: "POST /license-applications/${la_id}/issue"
              as: Director
              as_user_id: "dir-1"
            - call: "GET /licenses"
              payload: { application_id: "${la_id}" }
              as: Director
              as_user_id: "dir-1"
              captures: { lic_id: $.data.0.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: Director
            - call: "POST /licenses/${lic_id}/check-renewal-window"
              as: LicensingExaminer
              as_user_id: "exam-1"
          trigger:
            - call: "POST /licenses/${lic_id}/renew"
              payload: { renewal_fee_paid_cents: 100000 }
              as: Applicant
              as_user_id: "${app_owner_id}"
              captures: { lic_status: $.data.status, lic_renewals: $.data.renewal_count }
          assert:
            - "LicenseApplication.${la_id}.fee_quoted_cents == 110000"
            - "License.${lic_id}.status == ACTIVE"
            - "License.${lic_id}.renewal_count == 1"
            - "Renewal accepted with renewal_fee_paid_cents == 100000 (base only, NO 10000 zoning surcharge re-charged)"

      - name: fine_vs_demerit_dual_output_on_violation_and_license
        grounds:
          - calculations.fine_assessment
          - calculations.fine_assessment.variants.demerit_for
          - entities.AdministrativeAction.fields.fine_cents
          - entities.License.fields.demerit_points
          - state_machines.Violation.ALLEGED_to_SUSTAINED
        distinguishing_aspect: |
          Sustaining one SERIOUS violation produces TWO independent outputs on
          DIFFERENT entity domains from the same transition: AdministrativeAction.fine_cents
          == 75000 (monetary, on the action) and License.demerit_points += 4 (disciplinary,
          on the license); the demerit_for variant is decoupled from fine_cents and
          action_type, so they diverge in both magnitude and subject.
        test_recipe:
          setup:
            - "An ISSUED License lic_id (ACTIVE, demerit_points=0, outstanding_fine_cents=0) for class ON_47."
            - "An Investigator filed a SERIOUS Violation against lic_id (status ALLEGED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Director
            - call: "POST /license-classes"
              payload: { code: "ON_47", premise_type: "ON_PREMISE", quota_managed: true, base_fee_cents: 100000, renewal_cycle_months: 12, requires_zoning: true, max_servers_per_license: 5 }
              as: Director
            - call: "POST /quota-regions"
              payload: { region_code: "CTY_LA", population: 50000, persons_per_license: 25000 }
              as: Director
              captures: { reg_v: $.data.version }
            - call: "POST /applicants"
              payload: { legal_name: "Acme Bar LLC" }
              as: Director
              captures: { app_owner_id: $.data.id }
            - call: "POST /premises"
              payload: { applicant_id: "${app_owner_id}", region_code: "CTY_LA", street_address: "1 Main St", distance_to_school_m: 200, zoning_district: "COMMERCIAL" }
              as: Applicant
              as_user_id: "${app_owner_id}"
              captures: { prem_id: $.data.id }
            - call: "POST /license-applications"
              payload: { applicant_id: "${app_owner_id}", premise_id: "${prem_id}", license_class_code: "ON_47" }
              as: Applicant
              as_user_id: "${app_owner_id}"
              captures: { la_id: $.data.id }
            - call: "POST /license-applications/${la_id}/submit"
              payload: { expected_region_version: "${reg_v}" }
              as: Applicant
              as_user_id: "${app_owner_id}"
            - call: "GET /license-applications/${la_id}/background-checks"
              as: LicensingExaminer
              as_user_id: "exam-1"
              captures: { bc_id: $.data.0.id }
            - call: "POST /background-checks/${bc_id}/resolve"
              payload: { decision: "PASS" }
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "GET /license-applications/${la_id}/zoning-reviews"
              as: ZoningOfficer
              as_user_id: "zone-1"
              captures: { zr_id: $.data.0.id }
            - call: "POST /zoning-reviews/${zr_id}/decide"
              payload: { decision: "CLEAR" }
              as: ZoningOfficer
              as_user_id: "zone-1"
            - call: "POST /license-applications/${la_id}/begin-review"
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "POST /license-applications/${la_id}/open-protest-period"
              as: LicensingExaminer
              as_user_id: "exam-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Director
            - call: "POST /license-applications/${la_id}/approve"
              as: Director
              as_user_id: "dir-1"
            - call: "POST /license-applications/${la_id}/pay-fee"
              payload: { amount_cents: 110000 }
              as: Applicant
              as_user_id: "${app_owner_id}"
            - call: "POST /license-applications/${la_id}/issue"
              as: Director
              as_user_id: "dir-1"
            - call: "GET /licenses"
              payload: { application_id: "${la_id}" }
              as: Director
              as_user_id: "dir-1"
              captures: { lic_id: $.data.0.id }
            - call: "POST /violations"
              payload: { license_id: "${lic_id}", severity: "SERIOUS" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { vio_id: $.data.id }
          trigger:
            - call: "POST /violations/${vio_id}/sustain"
              payload: { action_type: "FINE" }
              as: AdjudicationOfficer
              as_user_id: "adj-1"
              captures: { act_id: $.data.action_id }
          assert:
            - "AdministrativeAction.${act_id}.fine_cents == 75000"
            - "License.${lic_id}.demerit_points == 4"
            - "License.${lic_id}.outstanding_fine_cents == 75000"
            - "Violation.${vio_id}.status == SUSTAINED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fine_assessment_three_input_nonlinear_recidivism
        grounds:
          - calculations.fine_assessment
          - entities.Violation.fields.severity
          - entities.License.fields.demerit_points
          - entities.AdministrativeAction.fields.action_type
          - state_machines.Violation.ALLEGED_to_SUSTAINED
          - state_machines.Violation.CONTESTED_to_SUSTAINED
        distinguishing_aspect: |
          Mode (a): fine_cents depends NON-LINEARLY on THREE inputs — severity
          (EGREGIOUS base 200000), the license's PRIOR demerit_points (recidivism
          multiplier 1.5 because the first sustained SERIOUS left it at 4), and
          action_type (SUSPENSION halves) — giving round_half_up(200000*1.5*0.5)
          == 150000, a value reachable by no single-input or linear formula.
        test_recipe:
          setup:
            - "An ISSUED License lic_id with demerit_points=4 (one prior SERIOUS violation already SUSTAINED as FINE), outstanding_fine_cents=75000."
            - "A second Violation (EGREGIOUS, status ALLEGED) filed by Investigator inv-1 against lic_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Director
            - call: "POST /license-classes"
              payload: { code: "ON_47", premise_type: "ON_PREMISE", quota_managed: true, base_fee_cents: 100000, renewal_cycle_months: 12, requires_zoning: true, max_servers_per_license: 5 }
              as: Director
            - call: "POST /quota-regions"
