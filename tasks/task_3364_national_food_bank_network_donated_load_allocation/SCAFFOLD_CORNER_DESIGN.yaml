            - "the award selects ${win_bid} == LoadBid.${bid_a} — the earlier created_at — and not LoadBid.${bid_b}"
            - "DonatedLoad.${l1}.awarded_member_id == ${win_member} == MemberFoodBank.${m1}, the member whose bid was earlier, even though MemberFoodBank.${m2} was created first"
            - "DonatedLoad.${l1}.status == ${st} == AWARDED and LoadBid.${bid_b}.bid_status == REJECTED with rejection_reason LOSING_BID"

      - name: award_with_no_eligible_bids_returns_no_eligible_bids
        claim_type: selector_policy
        grounds:
          - errors[ERR_NO_ELIGIBLE_BIDS]
          - validations[priority=26]
          - calculations.bid_ranking_score
        distinguishing_aspect: "The empty-candidate-set fallback: after the only bid is withdrawn the award selector has no eligible bid and returns ERR_NO_ELIGIBLE_BIDS (409) instead of awarding."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Load L1 is BIDDING with M1's single SUBMITTED 400-share bid, which is then withdrawn."
          setup_api_calls:
            - *c_clk
            - *c_agr
            - call: "POST /network/donor-agreements/${agr}/activate"
              payload: {}
              as: NetworkAdmin
            - *c_load1
            - call: "POST /network/loads/${l1}/post"
              payload: {}
              as: NetworkAdmin
              captures: { l1_v: $.data.version }
            - *c_m1
            - call: "POST /network/audits"
              payload: { member_id: "${m1}", audit_type: "COMPREHENSIVE", storage_score: 85, distribution_score: 85, reporting_score: 85 }
              as: NetworkAdmin
              as_user_id: "ops_admin_1"
              captures: { aud1: $.data.id }
            - call: "POST /network/audits/${aud1}/complete"
              payload: {}
              as: NetworkAuditor
              as_user_id: "auditor_7"
            - call: "POST /network/members/${m1}/certify"
              payload: {}
              as: NetworkAdmin
              captures: { m1_v: $.data.version }
            - call: "POST /network/share-ledger/grants"
              payload: { member_id: "${m1}", epoch: "2026-09", expected_member_version: "${m1_v}" }
              as: NetworkAdmin
            - call: "POST /network/loads/${l1}/bids"
              payload: { member_id: "${m1}", shares_offered: 400, preference_rank: 1, can_self_transport: false, expected_load_version: "${l1_v}" }
              as: MemberFoodBank
              as_user_id: "${m1}"
              captures: { bid1: $.data.id }
            - call: "POST /network/bids/${bid1}/withdraw"
              payload: {}
              as: MemberFoodBank
              as_user_id: "${m1}"
          trigger:
            - call: "POST /network/loads/${l1}/award"
              payload: {}
              as: NetworkAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response error_id ${err} == ERR_NO_ELIGIBLE_BIDS with HTTP 409"
            - "DonatedLoad.${l1}.status is still BIDDING with awarded_bid_id null"

      - name: award_cascade_already_covered_by_difficulty_index
        claim_type: cascading_side_effects
        grounds:
          - state_machines.DonatedLoad.BIDDING_to_AWARDED
          - state_machines.MemberFoodBank.CERTIFIED_to_PROBATION
        excluded_because:
          difficulty_instance: award_cascade_share_floor_to_probation_to_bid_withdrawal
          rationale: "The four-hop award cascade is asserted end to end as that §1.8 instance."

      - name: delivery_overlap_semantics_already_covered_by_difficulty_index
        claim_type: resource_temporal_overlap
        grounds:
          - validations[priority=29]
        excluded_because:
          difficulty_instance: delivery_window_half_open_adjacency_on_member
          rationale: "Half-open adjacency on delivery windows is asserted as that §1.8 instance."

      - name: hold_release_poundage_invariant_already_covered_by_difficulty_index
        claim_type: compensating_invariant
        grounds:
          - calculations.recall_hold_selection
          - state_machines.ProductRecall.TRACING_to_RESOLVED
        excluded_because:
          difficulty_instance: agreement_poundage_conserved_across_hold_and_release
          rationale: "The poundage conservation invariant across hold and release is asserted as that §1.8 instance."

      - name: cross_entity_bid_gate_already_covered_by_difficulty_index
        claim_type: cross_entity_state_dependency
        grounds:
          - state_machines.LoadBid.NONE_to_SUBMITTED
          - state_machines.DonatedLoad.POSTED_to_BIDDING
        excluded_because:
          difficulty_instance: bid_creation_gated_by_load_status
          rationale: "The DonatedLoad -> LoadBid gate is asserted as that §1.8 instance's trigger."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: award_response_carries_post_cascade_state
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.DonatedLoad.BIDDING_to_AWARDED
