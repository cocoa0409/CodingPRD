# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. All literals pre-computed.
# Clock default current_period_index = 0.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: fee_amount_provisional_vs_final_late
        grounds:
          - "calculations.fee_amount"
          - "entities.FeeInvoice.fields.amount_cents"
          - "state_machines.FeeInvoice.PENDING_to_PAID"
        distinguishing_aspect: "fee_amount is dual-variant on the FeeInvoice fiscal domain: provisional at creation is 30000, final at a 3-months-late pay is 39000 (base + min(30000*0.10*3, 30000)) — a fiscal-entity divergence, distinct from the Device-safety accident risk dual-variant."
        test_recipe:
          setup:
            - "Owner and a PASSENGER_ELEVATOR device exist; an ANNUAL_RENEWAL invoice with due_period 12 has provisional amount 30000; clock advanced to period 15."
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "Ace Realty", contact_email: "ace@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "Lobby A", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "POST /fee-invoices"
              payload: { device_id: "${dev_id}", type: "ANNUAL_RENEWAL", due_period: 12 }
              as: Registrar
              captures: { inv_id: "$.data.id", prov_amount: "$.data.amount_cents" }
            - call: "POST /_clock/set"
              payload: { to_period_index: 15 }
              as: Registrar
          trigger:
            - call: "POST /fee-invoices/${inv_id}/pay"
              payload: {}
              as: BuildingOwner
              as_user_id: "${owner_id}"
              captures: { final_amount: "$.data.amount_cents" }
          assert:
            - "prov_amount captured at invoice creation == 30000 (provisional variant)"
            - "FeeInvoice.${inv_id}.amount_cents == 39000 (final variant; penalty 9000 for 3 months overdue)"
            - "FeeInvoice.${inv_id}.status == PAID"

      - name: accident_risk_provisional_vs_final_substantiated
        grounds:
          - "calculations.accident_risk_score"
          - "entities.AccidentReport.fields.provisional_risk_score"
          - "entities.AccidentReport.fields.final_risk_score"
          - "entities.Device.fields.accident_risk_score"
          - "state_machines.AccidentReport.UNDER_INVESTIGATION_to_SUBSTANTIATED"
        distinguishing_aspect: "accident_risk_score is dual-variant on the Device safety domain: provisional at report is 60 (SEVERE weight) vs final 110 for a SUBSTANTIATED finding on a HIGH-risk device with one CITED critical deficiency (round(60*1.5)+20) — a Device-safety divergence, a different entity domain than the FeeInvoice fiscal dual-variant."
        test_recipe:
          setup:
            - "PASSENGER_ELEVATOR device with one CRITICAL deficiency (CITED via a failed inspection); a SEVERE accident report is under investigation led by an independent inspector."
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "Beacon Prop", contact_email: "b@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Ann Field", license_number: "L-1", license_expiry_period: 999, certified_categories: ["PASSENGER_ELEVATOR"] }
              as: Registrar
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Ben Lead", license_number: "L-2", license_expiry_period: 999, certified_categories: ["PASSENGER_ELEVATOR"] }
              as: Registrar
              captures: { insp_b: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "Tower 1", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "ANNUAL", scheduled_start_period: 1, scheduled_end_period: 2 }
              as: Registrar
              captures: { ins1: "$.data.id" }
            - call: "POST /inspections/${ins1}/assign"
              payload: { assigned_inspector_id: "${insp_a}" }
              as: Registrar
            - call: "POST /inspections/${ins1}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_a}"
            - call: "POST /inspections/${ins1}/complete"
              payload: { result: "FAIL", deficiencies: [ { code: "C-CRIT", severity: "CRITICAL", description: "brake failure" } ] }
              as: LicensedInspector
              as_user_id: "${insp_a}"
            - call: "POST /accident-reports"
              payload: { device_id: "${dev_id}", severity: "SEVERE", occurred_period: 1, description: "entrapment" }
              as: SafetyAdministrator
              captures: { acc_id: "$.data.id", prov_score: "$.data.provisional_risk_score" }
            - call: "POST /accident-reports/${acc_id}/open-investigation"
              payload: { lead_investigator_id: "${insp_b}" }
              as: SafetyAdministrator
          trigger:
            - call: "POST /accident-reports/${acc_id}/close"
              payload: { finding: "SUBSTANTIATED" }
              as: LicensedInspector
              as_user_id: "${insp_b}"
          assert:
            - "prov_score captured at report == 60 (provisional variant)"
            - "AccidentReport.${acc_id}.final_risk_score == 110 (final substantiated variant)"
            - "Device.${dev_id}.accident_risk_score == 110"

  - rule_id: combinatorial_formula
    instances:
      - name: citation_fine_tiered_nonlinear_mode_a
        grounds:
          - "calculations.citation_fine"
          - "entities.Citation.fields.fine_amount_cents"
          - "state_machines.Deficiency.OPEN_to_CITED"
        distinguishing_aspect: "Mode (a): citation_fine combines >=3 inputs (severity tier 20000, HIGH risk multiplier 1.5, repeat-offense count 1) under a nested min cap; a MAJOR deficiency on a HIGH-risk ESCALATOR with one prior citation yields min(round(20000*1.5)+min(1,3)*10000, 100000) == 40000."
        test_recipe:
          setup:
            - "ESCALATOR (HIGH) device with one prior ISSUED citation; a second OPEN MAJOR deficiency awaits citation."
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "Cedar Mgmt", contact_email: "c@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Cy Insp", license_number: "L-3", license_expiry_period: 999, certified_categories: ["ESCALATOR"] }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "ESCALATOR", location_description: "Mall E1", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "PERIODIC", scheduled_start_period: 1, scheduled_end_period: 2 }
              as: Registrar
              captures: { insP: "$.data.id" }
            - call: "POST /inspections/${insP}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${insP}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${insP}/complete"
              payload: { result: "CONDITIONAL", deficiencies: [ { code: "D-MIN", severity: "MINOR", description: "worn step" } ] }
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "GET /deficiencies?inspection_id=${insP}"
              payload: { inspection_id: "${insP}" }
              as: Registrar
              captures: { defP: "$.data[0].id" }
            - call: "POST /citations"
              payload: { deficiency_id: "${defP}" }
              as: Registrar
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "PERIODIC", scheduled_start_period: 5, scheduled_end_period: 6 }
              as: Registrar
              captures: { insT: "$.data.id" }
            - call: "POST /inspections/${insT}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${insT}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${insT}/complete"
              payload: { result: "CONDITIONAL", deficiencies: [ { code: "D-MAJ", severity: "MAJOR", description: "handrail speed" } ] }
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "GET /deficiencies?inspection_id=${insT}"
              payload: { inspection_id: "${insT}" }
              as: Registrar
              captures: { defT: "$.data[0].id" }
          trigger:
            - call: "POST /citations"
              payload: { deficiency_id: "${defT}" }
              as: Registrar
              captures: { fine: "$.data.fine_amount_cents" }
          assert:
            - "Citation.fine_amount_cents == 40000 (20000*1.5=30000 + 1 prior*10000)"
            - "Deficiency.${defT}.status == CITED"

      - name: outstanding_balance_round_then_sum_mode_b
        grounds:
          - "calculations.device_outstanding_balance_cents"
          - "entities.Device.fields.outstanding_balance_cents"
          - "entities.Citation.fields.surcharged_amount_cents"
        distinguishing_aspect: "Mode (b): device_outstanding_balance_cents rounds each citation surcharge to whole cents BEFORE summing; two DUMBWAITER citations (5000 -> 5363 and 15000 -> 16088) sum to 21451 under the pinned round-then-sum order, whereas sum-then-round gives 21450."
        test_recipe:
          setup:
            - "DUMBWAITER device with its registration fee paid (fees_part 0); two citations issued so the citations_part exercises per-item rounding."
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "Dune Co", contact_email: "d@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Dot Insp", license_number: "L-4", license_expiry_period: 999, certified_categories: ["DUMBWAITER"] }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "DUMBWAITER", location_description: "Kitchen", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "GET /fee-invoices?device_id=${dev_id}"
              payload: { device_id: "${dev_id}" }
              as: Registrar
              captures: { reg_inv: "$.data[0].id" }
            - call: "POST /fee-invoices/${reg_inv}/pay"
              payload: {}
              as: BuildingOwner
              as_user_id: "${owner_id}"
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "PERIODIC", scheduled_start_period: 1, scheduled_end_period: 2 }
              as: Registrar
              captures: { ins1: "$.data.id" }
            - call: "POST /inspections/${ins1}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${ins1}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins1}/complete"
              payload: { result: "CONDITIONAL", deficiencies: [ { code: "M1", severity: "MINOR", description: "door seal" } ] }
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "GET /deficiencies?inspection_id=${ins1}"
              payload: { inspection_id: "${ins1}" }
              as: Registrar
              captures: { def1: "$.data[0].id" }
            - call: "POST /citations"
              payload: { deficiency_id: "${def1}" }
              as: Registrar
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "PERIODIC", scheduled_start_period: 5, scheduled_end_period: 6 }
              as: Registrar
              captures: { ins2: "$.data.id" }
            - call: "POST /inspections/${ins2}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${ins2}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins2}/complete"
              payload: { result: "CONDITIONAL", deficiencies: [ { code: "M2", severity: "MINOR", description: "light out" } ] }
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "GET /deficiencies?inspection_id=${ins2}"
              payload: { inspection_id: "${ins2}" }
              as: Registrar
              captures: { def2: "$.data[0].id" }
          trigger:
            - call: "POST /citations"
              payload: { deficiency_id: "${def2}" }
              as: Registrar
              captures: { cit2_fine: "$.data.fine_amount_cents", cit2_surch: "$.data.surcharged_amount_cents" }
          assert:
            - "Citation(def2).fine_amount_cents == 15000 (5000 base LOW*1.0 + 1 prior*10000)"
            - "Citation(def2).surcharged_amount_cents == 16088 (round_half_up(15000*1.0725))"
            - "Device.${dev_id}.outstanding_balance_cents == 21451 (5363 + 16088; round-then-sum, not 21450)"

  - rule_id: non_linear_state_machine
    instances:
      - name: inspection_branching_fail_outcome
        grounds:
          - "state_machines.Inspection.IN_PROGRESS_to_FAILED"
          - "state_machines.Inspection.IN_PROGRESS_to_PASSED"
          - "state_machines.Inspection.IN_PROGRESS_to_CONDITIONAL"
        distinguishing_aspect: "Inspection is a branching fork-join: IN_PROGRESS forks to PASSED/FAILED/CONDITIONAL with divergent side effects; the FAILED branch (MAJOR deficiency, no CRITICAL) opens a deficiency and leaves next_inspection_due_period null, unlike the PASSED branch — non-linear on the Inspection entity, distinct from the Citation cycle."
        test_recipe:
          setup:
            - "A PASSENGER device inspection is IN_PROGRESS."
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "Elm Co", contact_email: "e@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Ed Insp", license_number: "L-5", license_expiry_period: 999, certified_categories: ["PASSENGER_ELEVATOR"] }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "Unit 5", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "ANNUAL", scheduled_start_period: 1, scheduled_end_period: 2 }
              as: Registrar
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${ins_id}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspections/${ins_id}/complete"
              payload: { result: "FAIL", deficiencies: [ { code: "MAJ-1", severity: "MAJOR", description: "governor slip" } ] }
              as: LicensedInspector
              as_user_id: "${insp_id}"
          assert:
            - "Inspection.${ins_id}.status == FAILED"
            - "Device.${dev_id}.next_inspection_due_period == null (FAIL branch does not set it, unlike PASS)"
            - "Device.${dev_id}.status == REGISTERED (MAJOR, not CRITICAL, so no OOS cascade)"
            - "GET /deficiencies?inspection_id=${ins_id} returns exactly 1 Deficiency with status OPEN"

      - name: citation_cyclic_contest_loop
        grounds:
          - "state_machines.Citation.ISSUED_to_CONTESTED"
          - "state_machines.Citation.CONTESTED_to_ISSUED"
          - "entities.Citation.fields.contest_count"
        distinguishing_aspect: "Citation is cyclic: ISSUED->CONTESTED->ISSUED (UPHELD) can repeat; after contest, uphold, contest again the status is CONTESTED and contest_count == 2 — a loop on the Citation entity, distinct from Inspection's branching machine."
        test_recipe:
          setup:
            - "A PASSENGER device has one ISSUED citation; owner has already contested once and the administrator UPHELD it (back to ISSUED)."
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "Fox LLC", contact_email: "f@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Fi Insp", license_number: "L-6", license_expiry_period: 999, certified_categories: ["PASSENGER_ELEVATOR"] }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "Bldg F", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "PERIODIC", scheduled_start_period: 1, scheduled_end_period: 2 }
              as: Registrar
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${ins_id}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/complete"
              payload: { result: "CONDITIONAL", deficiencies: [ { code: "MIN-F", severity: "MINOR", description: "scuff" } ] }
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "GET /deficiencies?inspection_id=${ins_id}"
              payload: { inspection_id: "${ins_id}" }
              as: Registrar
              captures: { def_id: "$.data[0].id" }
            - call: "POST /citations"
              payload: { deficiency_id: "${def_id}" }
              as: Registrar
              captures: { cit_id: "$.data.id" }
            - call: "POST /citations/${cit_id}/contest"
              payload: {}
              as: BuildingOwner
              as_user_id: "${owner_id}"
            - call: "POST /citations/${cit_id}/resolve-contest"
              payload: { outcome: "UPHELD" }
              as: SafetyAdministrator
          trigger:
            - call: "POST /citations/${cit_id}/contest"
              payload: {}
              as: BuildingOwner
              as_user_id: "${owner_id}"
          assert:
            - "Citation.${cit_id}.status == CONTESTED"
            - "Citation.${cit_id}.contest_count == 2 (loop traversed twice)"

  - rule_id: transitive_cascade
    instances:
      - name: inspection_fail_critical_cascade_depth3
        grounds:
          - "state_machines.Inspection.IN_PROGRESS_to_FAILED"
          - "state_machines.Deficiency.OPEN_to_CITED"
          - "state_machines.Device.ACTIVE_to_OUT_OF_SERVICE"
          - "state_machines.Certificate.POSTED_to_SUSPENDED"
        distinguishing_aspect: "Trigger = inspection FAIL with a CRITICAL deficiency; the chain is depth-4: FAIL creates the deficiency, the deficiency auto-issues a Citation, the Citation auto-creates an ACTIVE OutOfServiceOrder, and that order drives Device->OUT_OF_SERVICE and the POSTED Certificate->SUSPENDED — each hop caused by the previous, not by the original action."
        test_recipe:
          setup:
            - "PASSENGER device (registration fee paid) with a PASSED inspection, an ISSUED-then-POSTED certificate (device ACTIVE), and a second inspection IN_PROGRESS."
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "Gate Inc", contact_email: "g@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Gus Insp", license_number: "L-7", license_expiry_period: 999, certified_categories: ["PASSENGER_ELEVATOR"] }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "Plaza G", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "GET /fee-invoices?device_id=${dev_id}"
              payload: { device_id: "${dev_id}" }
              as: Registrar
              captures: { reg_inv: "$.data[0].id" }
            - call: "POST /fee-invoices/${reg_inv}/pay"
              payload: {}
              as: BuildingOwner
              as_user_id: "${owner_id}"
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "ANNUAL", scheduled_start_period: 1, scheduled_end_period: 2 }
              as: Registrar
              captures: { ins1: "$.data.id" }
            - call: "POST /inspections/${ins1}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${ins1}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins1}/complete"
              payload: { result: "PASS" }
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "GET /devices/${dev_id}"
              payload: {}
              as: Registrar
              captures: { dev_v: "$.data.version" }
            - call: "POST /certificates"
              payload: { device_id: "${dev_id}", source_inspection_id: "${ins1}", expected_device_version: "${dev_v}" }
              as: Registrar
              captures: { cert_id: "$.data.id" }
            - call: "POST /certificates/${cert_id}/post"
              payload: {}
              as: BuildingOwner
              as_user_id: "${owner_id}"
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "PERIODIC", scheduled_start_period: 5, scheduled_end_period: 6 }
              as: Registrar
              captures: { ins2: "$.data.id" }
            - call: "POST /inspections/${ins2}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${ins2}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /inspections/${ins2}/complete"
              payload: { result: "FAIL", deficiencies: [ { code: "CR-2", severity: "CRITICAL", description: "cable fray" } ] }
              as: LicensedInspector
              as_user_id: "${insp_id}"
          assert:
            - "Inspection.${ins2}.status == FAILED"
            - "Device.${dev_id}.status == OUT_OF_SERVICE"
            - "Certificate.${cert_id}.status == SUSPENDED"
            - "GET /citations?device_id=${dev_id} contains exactly 1 Citation with status ISSUED (auto-issued for the CRITICAL deficiency)"
            - "GET /out-of-service-orders?device_id=${dev_id} contains exactly 1 ACTIVE order with reason CRITICAL_DEFICIENCY"

      - name: accident_investigation_cascade_depth2
        grounds:
          - "state_machines.AccidentReport.REPORTED_to_UNDER_INVESTIGATION"
          - "state_machines.Device.ACTIVE_to_OUT_OF_SERVICE"
          - "state_machines.Certificate.POSTED_to_SUSPENDED"
        distinguishing_aspect: "Trigger = accident open-investigation (a different origin than inspection failure); depth-2 chain: opening the investigation auto-creates an ACTIVE OutOfServiceOrder (reason ACCIDENT) which itself drives Device->OUT_OF_SERVICE and the POSTED Certificate->SUSPENDED."
        test_recipe:
          setup:
            - "PASSENGER device (fee paid) with a POSTED certificate (ACTIVE); a SEVERE accident report is REPORTED; an independent lead inspector exists."
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "Hill Co", contact_email: "h@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Hal A", license_number: "L-8", license_expiry_period: 999, certified_categories: ["PASSENGER_ELEVATOR"] }
              as: Registrar
              captures: { insp_a: "$.data.id" }
            - call: "POST /inspectors"
