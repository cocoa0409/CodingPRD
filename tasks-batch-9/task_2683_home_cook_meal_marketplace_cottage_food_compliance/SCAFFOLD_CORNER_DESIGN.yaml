  - section: errors
    instances:
      - name: auth_envelope_errors_are_each_triggerable_and_ordered
        claim_type: error_triggerable
        grounds:
          - errors.ERR_MISSING_AUTH_HEADER
          - errors.ERR_UNKNOWN_ROLE
          - errors.ERR_MISSING_USER_ID
          - errors.ERR_ROLE_NOT_PERMITTED
          - validations[priority=1].header_envelope
        distinguishing_aspect: >
          The four envelope errors form a fixed ladder that must be walked before any resource is even
          looked up: a missing role header beats an unknown role, an unknown role beats a missing user
          id, all three 401s beat the 403, and the 403 beats the 404 for a path id that does not exist.
          Each rung is triggered separately on the same collection so no other rule can be credited.
        test_recipe:
          setup:
            - "StatePolicy CA exists and Cook Dara exists in DRAFT, so a real cook id is available for the path-id calls."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_id: "$.data.id" }
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id" }
          trigger:
            - call: GET /cooks
              payload: { limit: 10, offset: 0 }
              as: "(no X-User-Role header sent at all)"
              captures: { e_missing_role: "$.data.error_id" }
            - call: GET /cooks
              payload: { limit: 10, offset: 0 }
              as: Chef
              captures: { e_unknown_role: "$.data.error_id" }
            - call: GET /cooks/${cook_id}
              payload: {}
              as: Cook
              captures: { e_missing_uid: "$.data.error_id" }
            - call: POST /state-policies
              payload: { state_code: "NV", cottage_food_annual_cap_cents: 3000000, allowed_kitchen_types: ["HOME_COTTAGE"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 10, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1095 }
              as: Diner
              as_user_id: diner-1
              captures: { e_role_write: "$.data.error_id" }
            - call: GET /cooks
              payload: { limit: 10, offset: 0 }
              as: Anonymous
              captures: { e_role_read: "$.data.error_id" }
            - call: GET /cooks/00000000-0000-4000-8000-000000000404
              payload: {}
              as: Chef
              captures: { e_ladder: "$.data.error_id" }
          assert:
            - "${e_missing_role} == ERR_MISSING_AUTH_HEADER with HTTP 401 (the X-User-Role header is absent, not merely empty of meaning)"
            - "${e_unknown_role} == ERR_UNKNOWN_ROLE with HTTP 401: Chef is not one of the seven declared roles"
            - "${e_missing_uid} == ERR_MISSING_USER_ID with HTTP 401: Cook is one of the four roles that must identify itself, even on a read"
            - "${e_role_write} == ERR_ROLE_NOT_PERMITTED with HTTP 403: POST /state-policies lists PlatformAdmin only"
            - "${e_role_read} == ERR_ROLE_NOT_PERMITTED: Anonymous may read state policies and menu items but never the cook roster"
            - "${e_ladder} == ERR_UNKNOWN_ROLE, not ERR_COOK_NOT_FOUND: the envelope is resolved before the path id is resolved even though the id is unresolvable"
            - "every response carries the standard envelope with error_id and message, and no 500 appears anywhere in the ladder"

