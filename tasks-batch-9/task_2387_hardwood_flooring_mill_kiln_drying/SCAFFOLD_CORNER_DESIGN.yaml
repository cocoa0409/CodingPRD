        claim_type: error_triggerable
        grounds: ["errors[ERR_PROFILE_TOLERANCE_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / profile_tolerance_exactly_at_limit_passes_next_thousandth_fails"
          rationale: "The named §1.8 instance raises ERR_PROFILE_TOLERANCE_EXCEEDED one thousandth of an inch past the limit."
      - name: chamber_window_conflict_triggerable
        claim_type: error_triggerable
        grounds: ["errors[ERR_CHAMBER_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / chamber_closed_interval_includes_cooldown_buffer"
          rationale: "The named §1.8 instance raises ERR_CHAMBER_WINDOW_CONFLICT on a window that only touches the cooldown boundary."
