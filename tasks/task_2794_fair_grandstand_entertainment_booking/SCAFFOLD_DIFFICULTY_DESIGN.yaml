  # ===========================================================================
  # RULE 3 - Non-linear state machines on three different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_negotiation_cycle_exhausts_round_cap
        grounds:
          - state_machines.Offer.SENT_to_COUNTERED
          - state_machines.Offer.COUNTERED_to_SENT
          - entities.Offer.fields.round_count
          - entities.Offer.fields.countered_guarantee_cents
          - entities.OfferRound.fields.round_number
          - validations.priority_38
          - concurrency_rules.offer-revise-stale-offer
        distinguishing_aspect: |
          CYCLIC on Offer. The pair SENT -> COUNTERED -> SENT is a genuine loop whose
          termination is data-driven: round_count is the count of append-only OfferRound
          rows, and once it reaches MAX_NEGOTIATION_ROUNDS the same counter call that
          succeeded on round 2 now fails with ERR_NEGOTIATION_ROUND_LIMIT while the offer
          stays in SENT. The loop also alternates actor roles (agent countering, buyer
          revising) and the revise edge carries the OCC token, so the cycle is not a
          self-loop but a two-actor round trip.
        test_recipe:
          setup:
            - "One edition, one stage, one agent identified by user_id agent-hollis, one artist on that agent's roster."
            - "A DRAFT offer at guarantee 8000000, well under the 40000000 cap so no fiscal rule can fire."
            - "response_window_hours 48 with the clock parked at 2026-08-01T00:00:00.000Z, so nothing can expire mid-negotiation."
            - "send raises round_count to 1; the agent's counter raises it to 2; the buyer's revise raises it to 3 and returns the offer to SENT."
            - "The revise reads the offer version immediately beforehand, because expected_offer_version is an OCC token."
          setup_api_calls:
            - call: "POST /grandstand/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: FairOperationsDirector
            - call: "POST /grandstand/fair-editions"
              payload: { year: 2026, name: "Negotiation Fair", run_start_date: "2026-08-20", run_end_date: "2026-08-30", gate_admission_price_cents: 1500, talent_budget_cap_cents: 40000000, refund_reserve_cents: 15000000, max_shows_per_day: 2, curfew_utc_time: "23:30", strategy_basis: "ATTENDANCE_WEIGHTED" }
              as: FairOperationsDirector
              captures: { ed: "$.data.id" }
            - call: "POST /grandstand/stages"
              payload: { fair_edition_id: "${ed}", name: "Grandstand", reserved_seat_capacity: 4000, ga_capacity: 6000, changeover_buffer_minutes: 120, slot_soft_cap: 4 }
              as: FairOperationsDirector
              captures: { st: "$.data.id" }
            - call: "POST /grandstand/talent-agents"
              payload: { user_id: "agent-hollis", agency_name: "Hollis Talent", contact_email: "book@hollis.example" }
              as: TalentBuyer
              captures: { ag: "$.data.id" }
            - call: "POST /grandstand/artists"
              payload: { agent_id: "${ag}", name: "Dust Road Revival", genre: "COUNTRY", audience_segment: "FAMILY", base_draw_score: 62.50 }
              as: TalentBuyer
              captures: { ar: "$.data.id" }
            - call: "POST /grandstand/offers"
              payload: { fair_edition_id: "${ed}", artist_id: "${ar}", target_stage_id: "${st}", deal_type: "VERSUS", offered_guarantee_cents: 8000000, backend_split_pct: 0.8500, backend_breakeven_cents: 6000000, radius_miles: 150, radius_days_before: 30, radius_days_after: 30, target_show_date: "2026-08-22", load_in_start_utc: "2026-08-22T14:00:00.000Z", load_out_end_utc: "2026-08-22T23:00:00.000Z", response_window_hours: 48 }
              as: TalentBuyer
              captures: { of: "$.data.id" }
            - call: "POST /grandstand/offers/${of}/send"
              payload: {}
              as: TalentBuyer
            - call: "POST /grandstand/offers/${of}/counter"
              payload: { proposed_guarantee_cents: 11000000, proposed_backend_split_pct: 0.9000, proposed_breakeven_cents: 6000000, note: "Agent ask, round 2" }
              as: TalentAgent
              as_user_id: "agent-hollis"
            - call: "GET /grandstand/offers/${of}"
              payload: {}
              as: TalentBuyer
              captures: { of_v: "$.data.version" }
          trigger:
            - call: "POST /grandstand/offers/${of}/revise"
              payload: { expected_offer_version: "${of_v}", offered_guarantee_cents: 9500000, backend_split_pct: 0.8500, backend_breakeven_cents: 6000000, note: "Buyer revise, round 3" }
              as: TalentBuyer
            - call: "POST /grandstand/offers/${of}/counter"
              payload: { proposed_guarantee_cents: 12000000, proposed_backend_split_pct: 0.9500, proposed_breakeven_cents: 6000000, note: "Fourth round attempt - must be refused" }
              as: TalentAgent
              as_user_id: "agent-hollis"
              captures: { round_cap_err: "$.data.error_id" }
          assert:
            - "the revise returns 200 and Offer.${of}.status == SENT (the cycle closed back onto SENT)"
            - "Offer.${of}.offered_guarantee_cents == 9500000"
            - "Offer.${of}.countered_guarantee_cents == null"
            - "Offer.${of}.round_count == 3"
            - "the OfferRound rows of ${of} are exactly round_number 1 (BUYER, 8000000), 2 (AGENT, 11000000), 3 (BUYER, 9500000)"
            - "the fourth-round counter returns HTTP 409 with ${round_cap_err} == ERR_NEGOTIATION_ROUND_LIMIT"
            - "after the refusal Offer.${of}.status is still SENT and Offer.${of}.round_count is still 3"

