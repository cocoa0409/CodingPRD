              as: FinanceController
              captures: { up_id: $.data.id, up_holiday: $.data.holiday_hours, up_net: $.data.net_available_hours, up_target: $.data.target_utilization_pct }
            - call: "POST /demand-opportunities"
              payload: { client_name: "Acme Retail", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 1.00, win_probability_pct: 60, start_date: "2026-09-01", end_date: "2026-09-30", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 250.00 }
              as: SalesLead
              captures: { d1_id: $.data.id }
            - call: "POST /demand-opportunities/${d1_id}/qualify"
              payload: {}
              as: SalesLead
            - call: "GET /demand-opportunities/${d1_id}"
              as: SalesLead
              captures: { d1_v: $.data.version }
          trigger:
            - call: "POST /discount-approvals"
              payload: { demand_opportunity_id: "${d1_id}", requested_rate_usd_per_hour: 162.50, expected_opportunity_version: "${d1_v}" }
              as: SalesLead
              as_user_id: "sl-1"
              captures: { ap_status: $.data.status, ap_discount: $.data.discount_pct, ap_tier: $.data.required_tier, ap_escalated: $.data.tier_escalated, ap_provisional: $.data.provisional_realization_pct, ap_margin: $.data.projected_margin_pct }
